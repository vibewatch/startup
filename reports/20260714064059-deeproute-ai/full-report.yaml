    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, footprint, and what the company actually sells
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai should be underwritten as an autonomous-driving systems supplier, not merely as a robotaxi
              operator or an AI lab. Multiple public profiles and media reports align on several baseline identity
              facts: the company was founded in 2019, is headquartered in Shenzhen, and maintains a Fremont presence
              that signals continuing U.S. R&D or business development capacity. The business model is broader than a
              single software module. CB Insights describes a full Level 4 stack spanning robotaxis, trucks, and
              commercialization services, while Craft and TechCrunch portray a company that packages self-driving
              systems for automakers and mobility use cases. That framing matters because it explains why DeepRoute can
              plausibly serve three lanes at once—consumer-vehicle assisted driving, robotaxi operations, and a
              longer-term physical-world AI platform—while still centering commercialization on production vehicle
              programs. Public descriptions also show a distinct technical identity: map-free driving, end-to-end
              models, and a willingness to bring high-automation capabilities down to commodity vehicle hardware and
              mass-market price points instead of preserving them only for premium fleets.
