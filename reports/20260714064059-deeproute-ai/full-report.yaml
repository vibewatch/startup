              end-to-end driving software, but a unified VLA stack that combines perception, reasoning, and action in
              one model family. DeepRoute says IO 2.0 uses a VLA model integrated with a large language model, giving
              the system chain-of-thought reasoning, a broader knowledge base, OCR, voice interaction, and step-by-step
              decision explanations. Its GTC 2026 materials go further by describing a 40-billion-parameter foundation
              model that serves simultaneously as the driver, the analyst, and the critic. The strongest architectural
              implication is not merely a bigger model; it is the attempt to convert more of the data loop into
              machine-mediated reasoning. Public descriptions say the company compresses iteration from more than five
              days to roughly 12 hours by automating event mining, root-cause analysis, and behavior scoring. If true,
              that would make the moat less about one sensor layout and more about a faster self-improving development
              cycle.
