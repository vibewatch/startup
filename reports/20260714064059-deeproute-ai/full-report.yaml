        title: 'Product definition: what DeepRoute actually delivers in customer workflow terms'
        blocks:
          - type: paragraph
            body: >-
              DeepRoute’s current product is best understood as a production intelligent-driving platform for
              automakers, not merely a robotaxi prototype. The company’s public materials describe DeepRoute IO 2.0 as a
              smart-driving platform for everyday users, powered by a Vision-Language-Action model and designed for
              integration across multiple vehicle models and OEMs. That is a different commercial object from the
              earlier narrative around dedicated Level 4 fleets: the platform now sits much closer to the
              vehicle-program workflow of sourcing, integration, SOP launch, road data collection, and iterative
              updates. Robotaxi has not disappeared from the story, but it has become an adjacent layer rather than the
              only visible product. This framing matters because it explains why the company emphasizes deployability,
              sensor flexibility, chip partnerships, and defensive-driving behavior rather than only autonomy spectacle.
              The public artifact is therefore a modular intelligent-driving stack whose value depends on OEM fit,
              deployment maturity, and data-feedback speed.
