      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: track, not buy'
            body: >-
              DeepRoute has enough commercial proof to stay on the active watchlist, but not enough public economic
              disclosure to justify paying a premium like a fully underwritten public comp.
            calloutType: recommendation
            claimRefs:
              - CV028
              - CV039
              - CV040
          - type: callout
            title: Production proof separates DeepRoute from pure demo-stage autonomy stories
            body: >-
              The company's visible production-vehicle deployments and OEM count make it far more credible than a
              robotaxi-only or pre-revenue platform still selling possibility rather than shipped systems.
            calloutType: strength
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV028
          - type: callout
            title: The valuation ceiling is determined by what is still missing, not just by what has already shipped
            body: >-
              Without public revenue, pricing, margin, and concentration disclosure, any price much above the
              low-single-digit-billion range becomes too dependent on narrative and too lightly anchored in current
              economics.
            calloutType: risk
            claimRefs:
              - CV008
              - CV029
              - CV037
