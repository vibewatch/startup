  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what spend is in scope for DeepRoute and what is not'
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for DeepRoute is not “all autonomous driving” and not even “all robotaxis.” Its
              economically relevant market is the intersection of advanced driver-assistance software, compute,
              validation, and integration content that automakers buy when they want city-NOA, highway-NOA, or
              higher-level assisted-driving capability without fully self-developing the stack. That means the broadest
              TAM starts with the China vehicle market, narrows to NEV and smart-vehicle volume, then narrows again to
              NOA-equipped vehicles, and finally narrows to the third-party supplier segment where brands choose outside
              technology partners instead of internal stacks. Adjacent revenue pools still matter. Robotaxi creates a
              future software-and-operations market with higher autonomy and richer data feedback, while “RoadAGI” or
              broader embodied-AI applications could reuse the same perception, planning, and world-model
              infrastructure. But those adjacencies should not be conflated with the current buying center. Today’s
              market is driven mainly by OEM product, ADAS, procurement, and chip-roadmap decisions inside the China
              passenger-car industry. That framing matters because it shows why total national vehicle sales overstate
              DeepRoute’s immediate addressable market, while robotaxi-only views understate it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
