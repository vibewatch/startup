      - number: '2.2'
        title: 'Sizing lenses: from total vehicle demand to the third-party NOA niche'
        blocks:
          - type: paragraph
            body: >-
              Public market sizing data is now good enough to build a multi-lens view, even if no single source gives a
              perfect DeepRoute TAM. At the top of the funnel, official government reporting based on CAAM data says
              China sold 34.4 million vehicles in 2025, including 16.49 million NEVs. That is the macro base from which
              intelligent-driving content can spread. The more relevant middle layer is urban NOA and higher-end ADAS
              adoption. Research summaries and CAAM’s 2025 city-NOA report show the market moving quickly: by 2024H1,
              urban NOA penetration had already reached 7.6% of new passenger-car sales, and by January through November
              2025, city-NOA-equipped passenger-car sales reached 3.129 million units with 15.1% penetration. The
              third-party supplier layer is smaller again. CAAM’s own 2025 report says 19 brands were still
              self-developing city NOA, while about 29 brands used third-party suppliers. It also shows Momenta and
              Huawei together controlling about four-fifths of the third-party market, implying that the outsourced
              supplier slice was only around the high-hundreds-of-thousands of vehicles in 2025 rather than the full 3.1
              million city-NOA total. DeepRoute’s opportunity is therefore large enough to matter, but much tighter than
              a generic “34 million car market” pitch suggests.
