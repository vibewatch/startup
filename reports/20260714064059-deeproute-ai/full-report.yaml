      - number: '2.4'
        title: Growth drivers, constraints, and why the supplier market is consolidating
        blocks:
          - type: paragraph
            body: >-
              The strongest market drivers are clear. NEV penetration keeps rising, smart-driving features are diffusing
              into lower price bands, foundation-model and map-free approaches are lowering deployment frictions, and
              global as well as domestic brands increasingly accept that high-level assisted driving shapes vehicle
              competitiveness. But the constraint side is just as important. China’s regulatory environment is getting
              more formal, not looser: Beijing’s 2025 regulation, the 2026 nationwide-standard draft, and MIIT’s 2025
              restrictions on public beta testing, terminology, remote functions, and OTA cadence all raise the
              compliance cost of shipping fast. Safety performance, compute cost, and data-loop speed now matter
              alongside raw algorithm quality. Those conditions favor a smaller number of suppliers with deep data
              flywheels, chip partnerships, OEM trust, and proven volume deployment. That is exactly the structure
              described by CAAM and KrASIA: a field dominated by self-developed OEM stacks on one side and a third-party
              market increasingly concentrated among Huawei, Momenta, and a smaller set of challengers such as
              DeepRoute. The result is a market with strong growth, but also a narrowing competitive corridor where
              execution and scale can matter more than technical novelty alone.
