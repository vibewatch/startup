  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: where DeepRoute actually competes and where it only benchmarks against leaders'
        blocks:
          - type: paragraph
            body: >-
              DeepRoute sits in the middle of several adjacent competitive arenas, which can make the field look more
              crowded than it really is. In Chinese outsourced urban NOA and higher-level intelligent driving, its most
              immediate competitors are other third-party suppliers that sell stacks into OEM programs, especially
              Momenta and Huawei HI. In robotaxi and L4 operations, Waymo, Pony.ai, WeRide, and Baidu Apollo represent a
              different but still relevant benchmark set because they are competing for autonomy data, safety
              credibility, and future commercialization pathways. Mobileye matters as the closest international analogue
              for a licensable consumer-vehicle stack, while Tesla and OEM self-development matter as substitutes rather
              than pure like-for-like vendors. This framing is important because it shows why DeepRoute can be
              strategically strong in one lane—outsourced OEM intelligent driving—without yet leading the
              highest-profile robotaxi metrics globally. It also clarifies why Huawei HI and OEM self-development can be
              more dangerous to DeepRoute’s addressable market than a famous but structurally different operator like
              Waymo.
