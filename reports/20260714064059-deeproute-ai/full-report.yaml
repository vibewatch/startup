  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue / run-rate
        - Current annualized revenue or latest twelve-month OEM-licensing revenue
        - Turns valuation from inferred to observable and anchors comp discounting
        - Request management revenue bridge or IPO draft financial summary.
      - - Per-vehicle pricing and margin
        - Pricing stack, hardware / software mix, and gross-margin profile by program
        - Determines whether deployment scale will actually create supplier economics
        - Request customer-contract economics and program margin waterfall under NDA.
      - - Customer concentration by dollars
        - Revenue share from Great Wall, Leapmotor, and other OEMs
        - Tests whether strategic validation is becoming concentration risk
        - Request top-customer revenue schedule and model-by-model SOP revenue plan.
      - - Current price anchor
        - IPO range, secondary transactions, or a clearly documented current mark
        - Without a price anchor, entry discipline remains range-based rather than precision-based
        - Review draft listing materials, banker feedback, and secondary data.
      - - Cash runway
        - Current cash balance, monthly burn, and financing contingency plan
        - Explains whether IPO timing is opportunistic or necessary
        - Request latest budget-versus-actual burn and 24-month cash forecast.
      - - Governance / IP terms
        - Board depth, succession, and OEM co-development IP boundaries
        - Determines how much of the narrative and platform value is institutionally durable
        - Review cap table, board materials, and master OEM / JV / data-rights agreements.
    notes: These asks are prioritized by how quickly they would move DeepRoute from a trackable story into a priceable one.
