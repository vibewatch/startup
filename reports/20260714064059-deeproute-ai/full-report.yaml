            body: >-
              Public evidence is strongest on DeepRoute’s cost logic and weakest on its realized margin. In 2022 the
              company argued it had driven the cost of an L4 hardware package down from roughly $10,000 to about $3,000,
              with lidar and chips accounting for most of the bill of materials. That cost disclosure is useful because
              it shows management has long treated affordability as strategic, but it should not be mistaken for a
              current 2026 gross-margin disclosure. Product mix has changed, customer programs have evolved, and the
              company is now positioning itself around end-to-end and VLA-powered assisted driving rather than only a
              2022 robotaxi hardware package. The likely financial shape is a mixed model: software and licensing
              economics should be structurally better than running every trip itself, while continued compute, safety,
              validation, integration, and support costs remain heavy. Without realized pricing, contract terms, take
              rates, or customer support burden, DeepRoute’s unit economics must still be treated as inferred rather
