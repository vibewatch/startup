      - number: '8.4'
        title: Why the stock could earn some premium—and why that premium should stay capped for now
        blocks:
          - type: paragraph
            body: >-
              DeepRoute does have premium arguments. Great Wall is not just financial capital; it is strategic proof
              that the technology is relevant to mass-production vehicles. The company also has a broader partnership
              surface than a single-account story suggests, including smart and a larger IO 2.0 OEM pipeline. And
              management is trying to frame the company as a physical-AI platform rather than only a vertical
              auto-software vendor, which can matter in a market that still rewards bigger narratives. But the discount
              case is stronger today. KrASIA and 36Kr both frame a tightening funding window in which scale alone no
              longer guarantees premium pricing. Customer concentration remains visible, financial transparency remains
              thin, and the market is increasingly distinguishing between broad foundation-model stories and
              sector-specific autonomy vendors. In practical terms, that means the upside premium should be acknowledged
              but heavily haircut. DeepRoute deserves more than a commodity auto-supplier discount, but not enough to
              erase the disclosure, concentration, and execution gap versus the best-positioned peers.
            claimRefs:
              - CV007
              - CV025
              - CV026
              - CV027
              - CV029
