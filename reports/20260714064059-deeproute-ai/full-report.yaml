        title: Funding history, investor map, and the commercialization proof now visible in public
        blocks:
          - type: paragraph
            body: >-
              DeepRoute’s capital history shows a company that repeatedly attracted strategic money rather than only
              generic venture capital. CNBC documented a $300 million Alibaba-led Series B in 2021, while 2024 coverage
              from CNBC and TechCrunch described a $100 million strategic round from Great Wall Motor. Public data
              services then converge around a mid-hundreds-of-millions cumulative funding base, with CB Insights and the
              company’s own 2025 UK PR release both pointing to roughly $450 million raised, even though later
              promotional coverage claimed a figure above $700 million. That inconsistency does not erase the positive
              signal: DeepRoute clearly has blue-chip backers and enough capital to keep scaling. The more meaningful
              2025-2026 change is commercial proof. DeepRoute’s own UK and PRN Asia releases, 36Kr, and multiple
              industry outlets all describe the company moving from tens of thousands of deployed systems to roughly
              200,000 production vehicles by end-2025, with a target of one million in 2026 and nearly 40% share of
              China’s third-party urban NOA segment in October 2025. Those numbers are still company-reported and need
              independent reconciliation, but they are directionally consistent with a late-stage private company
              entering a much more commercial phase than its earlier robotaxi-only identity implied.
