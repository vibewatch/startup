    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory tightening has moved from background noise to a core operating constraint
        blocks:
          - type: paragraph
            body: >-
              DeepRoute is scaling in exactly the part of China's auto stack that regulators tightened most visibly in
              2025: assisted-driving claims, OTA governance, incident reporting, and the approval perimeter around
              advanced functions. The February 2025 MIIT/SAMR notice is not abstract policy language. It formalizes
              product-admission, recall, reporting, and OTA obligations for intelligent-connected vehicles and makes
              clear that automakers cannot treat advanced driving software as a loosely governed app-update cycle.
              Follow-on coverage from TechCrunch, CnEVPost, Business Standard, and CarNewsChina shows how that framework
              was operationalized after the Xiaomi SU7 fatal crash: marketing language was narrowed, public beta testing
              was curbed, emergency OTAs were pushed toward recall logic, and companies were told to validate more
              before rollout. For DeepRoute, whose public pitch depends on fast iteration and visible urban-NOA
              capability, the result is simple: product quality is no longer enough. Execution now has to pass through a
              more conservative regulatory process that can slow launches, constrain marketing, and raise the cost of
              any mistake.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
