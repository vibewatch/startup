  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The track / fair call comes from balancing production proof and market growth against opaque current economics and
      concentration risk.
    data:
      nodes:
        - id: proof
          label: Commercial proof
          detail: 200,000+ and later 250,000+ vehicles plus five OEM partnerships show the company is commercially relevant.
          tone: positive
        - id: market
          label: Market tailwind
          detail: China NOA and licensing markets are expanding materially through 2030.
          tone: positive
        - id: opacity
          label: Financial opacity
          detail: Current revenue, price, and gross margin are still not publicly disclosed.
          tone: negative
        - id: concentration
          label: Customer concentration
          detail: Great Wall and Leapmotor still dominate the visible customer map.
          tone: warning
        - id: comp-set
          label: Comp discipline
          detail: Public AV peers trade anywhere from ~4x to ~26x sales and have already compressed from earlier marks.
          tone: warning
        - id: decision
          label: Track / fair
          detail: Engage, but avoid paying above a low-single-digit-billion range without new disclosure.
          tone: neutral
      edges:
        - from: proof
          to: decision
        - from: market
          to: decision
        - from: opacity
          to: decision
        - from: concentration
          to: decision
        - from: comp-set
          to: decision
    approximationNotes: null
    claimRefs:
      - CV004
      - CV006
      - CV010
      - CV029
      - CV037
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The most important sensitivity driver is the discount applied to the peer basket formed by Pony.ai, WeRide, and
      Momenta's private pre-IPO mark.
    data:
      items:
        - label: ~70% discount to peer basket
          value: 1
          detail: >-
            Very conservative private-market pricing if the Hong Kong window weakens and DeepRoute stays economically
            opaque.
          tone: negative
        - label: ~60% discount to peer basket
          value: 1.3
          detail: Cautious but supportable range if deployment proof holds and disclosure remains thin.
          tone: warning
        - label: ~50% discount to peer basket
          value: 1.6
          detail: Base-case midpoint if DeepRoute keeps shipping and diversifies modestly without full financial disclosure.
          tone: neutral
        - label: ~40% discount to peer basket
          value: 2
          detail: >-
            More aggressive pricing that begins to assume a stronger premium for the physical-AI narrative and OEM
            breadth.
          tone: positive
    approximationNotes: >-
      Values are scenario-based USD billions derived from discounts to a simple peer basket using Pony.ai, WeRide, and
      Momenta's private pre-IPO valuation as directional anchors.
    claimRefs:
      - CV013
      - CV016
      - CV023
      - CV034
      - CV035
      - CV036
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      DeepRoute's supportable valuation corridor is wide because the company has meaningful production proof but no
      disclosed current revenue or clean price anchor.
    data:
      items:
        - label: Bear case
          low: 0.8
          mid: 0.95
          high: 1.1
          displayValue: $0.8B-$1.1B
          detail: >-
            Public-comp compression and weak listing conditions dominate the story; concentration and opacity receive
            the heaviest discount.
          tone: negative
        - label: Base case
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: >-
            Commercial proof is acknowledged, but the company still trades at a sizable discount to public and private
            peers because economics remain under-disclosed.
          tone: warning
        - label: Bull case
          low: 2.2
          mid: 2.6
          high: 3
          displayValue: $2.2B-$3.0B
          detail: >-
            The market gives more credit to DeepRoute's OEM scale, one-million-vehicle narrative, and physical-AI
            framing while peers remain constructive.
          tone: positive
    approximationNotes: >-
      Ranges are scenario-based valuation outputs in USD billions for investment-committee discussion, not management
      guidance or a documented transaction price.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      DeepRoute scores well on market growth and commercialization proof but weakly on transparency and
      concentration-adjusted economics.
    data:
      items:
        - label: Market growth
          score: 8
          detail: China NOA and licensing TAM expansion through 2030 is a real structural tailwind.
          tone: positive
        - label: Commercialization proof
          score: 7
          detail: 200,000+ to 250,000+ vehicles and multiple OEM partnerships are meaningful proof points.
          tone: positive
        - label: Customer diversification
          score: 4
          detail: Great Wall and Leapmotor still appear as the two core customers in 2026 coverage.
          tone: warning
        - label: Financial transparency
          score: 3
          detail: Current revenue, pricing, margin, and current mark remain under-disclosed.
          tone: negative
        - label: Public-comp support
          score: 5
          detail: Peers provide a usable range, but the public market has already compressed autonomy valuations.
          tone: warning
        - label: Narrative premium
          score: 6
          detail: Physical-AI framing offers upside, but the market may still cap vertical autonomy stories.
          tone: neutral
        - label: Evidence quality
          score: 6
          detail: Strong enough for ranges and discipline, not strong enough for precise price underwriting.
          tone: neutral
    approximationNotes: >-
      Scores are 0-10 ordinal judgments synthesized from the public evidence reviewed for investment-committee
      discussion.
    claimRefs:
      - CV010
      - CV028
      - CV029
      - CV032
      - CV039
      - CV040
      - CV042
