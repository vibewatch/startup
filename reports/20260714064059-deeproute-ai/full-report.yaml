  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segmentation: buyer, user, payer, and why DeepRoute’s “customer” is not the end driver'
        blocks:
          - type: paragraph
            body: >-
              DeepRoute’s customer map has three layers. The direct economic payer is usually the automaker or vehicle
              program team buying an intelligent-driving stack for production vehicles. The operational user is the
              driver or passenger who experiences the feature inside the vehicle, but that end user is not the main
              contracting counterparty. A third layer includes robotaxi operators or future mobility partners that may
              use the same core technology in fleet contexts. This means customer evidence must be judged differently
              from a normal B2C or SaaS company. Consumer adoption matters mainly insofar as it helps an OEM justify
              more model rollouts, stronger trim penetration, and larger production volumes. Public evidence also
              suggests that strategic value is highly uneven: Great Wall-linked programs, Smart, and other leading OEM
              integrations likely matter far more than a long tail of undeclared logos. The practical question is
              therefore which relationships have reached production, which are still roadmap claims, and how quickly one
              deployed program turns into repeat model wins.
