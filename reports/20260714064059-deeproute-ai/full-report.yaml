    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Weak or delayed Hong Kong IPO process
        - No visible pricing progress, material delay, or obviously soft order book
        - Undercuts the financing-window support behind the current fair-range call
        - Lower valuation range and assume tighter capital flexibility.
      - - No diversification beyond Great Wall / Leapmotor
        - Still no broader revenue-bearing SOP customer mix by next disclosure cycle
        - Keeps concentration risk too high for anything near peer-like pricing
        - Maintain or widen discount versus public and private comps.
      - - Public-comp compression deepens further
        - Pony.ai and WeRide fall materially below current levels without a sector rerating elsewhere
        - Reduces what the market is willing to pay for opaque AV narratives generally
        - Cut bear and base-case ranges.
      - - Deployments do not translate into economics
        - Still no disclosed revenue run-rate, pricing, or gross-margin evidence despite growing vehicle counts
        - Breaks the key assumption that commercialization proof will eventually close the disclosure gap
        - Move recommendation from track toward research-more / avoid paying up.
      - - Regulatory or compute shock
        - Meaningfully tighter China rollout rules or tougher AI-chip restrictions
        - Raises execution cost and slows the thesis path simultaneously
        - Lower scenario probabilities for the bull and base cases.
    notes: These are concrete go / no-go triggers rather than routine quarterly monitoring points.
