  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: commercially relevant, but still too opaque for an aggressive price-insensitive call'
        blocks:
          - type: paragraph
            body: >-
              DeepRoute now looks like a real late-stage intelligent-driving supplier rather than a speculative
              robotaxi-only experiment. The company has strategic backing from Alibaba and Great Wall, real deployment
              scale, multiple OEM relationships, and a product story that extends beyond a single pilot lane. That said,
              the evidence still stops short of what investors need for a strong buy-style valuation call. Public
              materials do not disclose a clean current mark, current revenue, per-vehicle pricing, gross margin, or
              customer-level concentration by dollars. That leaves valuation to be triangulated rather than observed.
              The right present-tense call is therefore disciplined rather than bullish: track the company, assume high
              risk, and treat a low-single-digit-billion valuation as fair only if the price stays meaningfully below
              the most expensive public and private Chinese AV comparables. The nearer the entry price moves toward the
              $2.5 billion-plus zone without new disclosure, the more the risk-reward begins to look stretched rather
              than balanced.
            claimRefs:
              - CV008
              - CV009
              - CV034
              - CV035
              - CV036
