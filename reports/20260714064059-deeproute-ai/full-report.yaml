        title: 'Revenue model and public traction: what DeepRoute appears to sell and what the market still cannot see'
        blocks:
          - type: paragraph
            body: >-
              The public record supports a fairly clear top-line revenue logic even though it does not disclose actual
              DeepRoute revenue. DeepRoute appears to monetize mainly by selling intelligent-driving capability into OEM
              programs rather than by operating a large paid consumer app or selling a single retail software
              subscription. TechCrunch reported that the company charges automakers a per-car licensing fee and collects
              data that it uses to improve its AI stack, while later company and partner disclosures shifted attention
              toward delivered vehicles, production programs, and strategic OEM partnerships. That makes the best public
              traction metric shipped or enabled vehicles, not ARR, MAU, or paid trip volume. It also means revenue
              quality could improve faster than that of a pure pilot-stage robotaxi operator if deployments keep
              converting into repeat SOP wins. The missing layer is magnitude: public sources do not disclose revenue
              mix, recognized revenue by customer, or realized price per vehicle, so investors can see the motion but
