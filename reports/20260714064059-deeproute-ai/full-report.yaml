              - CV030
      - number: '8.5'
        title: The call can improve, but only if the next disclosure cycle closes the obvious gaps
        blocks:
          - type: paragraph
            body: >-
              What would change this recommendation? Not another high-level deployment press release. The next
              disclosure cycle has to answer the economic questions that are still missing. Investors need actual
              current revenue or run-rate, per-vehicle pricing or take-rate logic, customer concentration by dollars
              rather than logos, gross-margin or hardware-mix evidence, and a real price anchor from either an IPO range
              or a clearly documented secondary mark. Without those data, the valuation can be bounded but not
              precision-underwritten. The kill triggers are therefore concrete and measurable: a weak or delayed Hong
              Kong listing, continued dependence on the same two visible anchor customers, public-comp compression that
              drags the sector lower, or failure to show that vehicle deployments are converting into visible revenue
              power. If those triggers do not fire and disclosure improves, the fair range can move up. Until then,
              medium confidence is the honest posture because the difference between a sensible price and a stretched
              one still depends on facts the public file does not yet reveal.
            claimRefs:
              - CV008
              - CV040
              - CV041
              - CV042
              - CV044
