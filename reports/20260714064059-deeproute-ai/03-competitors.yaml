    {
      "id": "distribution-data-loops-and-switching-costs",
      "title": "Distribution, data loops, and switching costs: what makes the market sticky",
      "body": "The competitive battle is no longer just about who demos the best autonomy stack. It is about who embeds deeply enough in OEM and operating workflows that replacement becomes painful. DeepRoute’s per-vehicle licensing model and mass-production push are designed to create precisely that kind of data loop: vehicle deployments produce more road data, which improves the stack, which makes the supplier more valuable for later programs and eventually for robotaxi. The same logic helps explain Momenta’s entrenchment, Pony.ai’s joint-deployment approach, Mobileye’s long ADAS ladder, and Apollo’s ecosystem strategy. Waymo is sticky for a different reason—its operating stack, safety evidence, and fleet systems form a tightly integrated service. In all cases, the supplier that wins more production programs and learns faster from real-world miles gains more leverage than a technically elegant but lightly deployed rival. This is also why apparently similar “AI driving” vendors can have very different staying power once a program reaches SOP and starts generating road data.",
