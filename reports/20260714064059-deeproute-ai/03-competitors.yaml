    {
      "id": "direct-peers-by-product-model-and-scale",
      "title": "Direct peers: product model, deployment scale, and public proof points",
      "body": "Public disclosures show a sharp strategic split among leading competitors. Waymo remains the clearest proof point for fully autonomous ride-hailing at scale, but it is not built around broad third-party OEM licensing. WeRide and Pony.ai combine robotaxi operations with broader product portfolios and therefore overlap more with DeepRoute’s ambition to bridge assisted driving and autonomy. Momenta looks like the hardest near-term consumer-vehicle rival because it is deeply tied to major global and Chinese automakers and has already disclosed wider model coverage and meaningful revenue. Baidu Apollo is harder to classify because it combines an open ecosystem, robotaxi fleet, large-model narrative, and vertically integrated vehicle stack. Mobileye, meanwhile, is the most legible international comparison for consumer-vehicle licensing, with a clear ADAS-to-AV ladder that many OEMs can adopt incrementally. The result is a field where every major rival is strong on a different dimension, which is why no single “winner takes all” narrative fits the evidence.",
