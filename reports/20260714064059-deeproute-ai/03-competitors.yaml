    {
      "id": "moat-durability-and-likely-industry-shape",
      "title": "Moat durability and likely industry shape: why the field is narrowing to a few scaled winners",
      "body": "The most durable moats in autonomous driving now come from evidence, capital, and organizational integration rather than from novelty alone. Waymo’s moat is operating safety proof and unmatched U.S. robotaxi experience. Momenta’s moat is OEM entrenchment and demonstrated consumer-vehicle scale. Pony.ai and WeRide each benefit from meaningful fleet operations, wider international expansion, and visible commercialization momentum. Apollo benefits from Baidu’s ecosystem and platform reach, while Mobileye benefits from silicon, mapping, and long-standing OEM design cycles. DeepRoute’s best path is to become one of the few independent suppliers that can turn assisted-driving SOP wins into a compounding data flywheel before the market locks around larger ecosystems. That is plausible, but it is not guaranteed; the market is consolidating faster than a pure R&D narrative would suggest. For investors, the key question is therefore less about technical ranking in a vacuum and more about whether DeepRoute can secure enough repeat programs to become unavoidable in procurement cycles.",
