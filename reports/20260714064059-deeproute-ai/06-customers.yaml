  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "DeepRoute.ai’s customer base is best understood as a concentrated OEM and partner ecosystem rather than a broad end-user subscription business. The economic payer is usually the automaker, the operational user is the driver or fleet operator, and the strategic value of each customer relationship depends less on current logo count than on whether a program reaches production and then expands across more models and geographies. Public evidence strongly supports adoption momentum—more than 200,000 production vehicles, roughly 40% monthly share among third-party urban-NOA suppliers in October 2025, and repeated references to leading OEM integrations—but public retention and concentration disclosure remain thin. The chapter’s core finding is that customer proof is real but concentrated: DeepRoute has crossed the threshold from pilot narrative to production relevance, yet investors still need better visibility into renewal durability and customer-level revenue concentration."
  },
  "sections": [
    {
      "id": "customer-segmentation-and-who-actually-pays",
      "title": "Customer segmentation: buyer, user, payer, and why DeepRoute’s “customer” is not the end driver",
      "body": "DeepRoute’s customer map has three layers. The direct economic payer is usually the automaker or vehicle program team buying an intelligent-driving stack for production vehicles. The operational user is the driver or passenger who experiences the feature inside the vehicle, but that end user is not the main contracting counterparty. A third layer includes robotaxi operators or future mobility partners that may use the same core technology in fleet contexts. This means customer evidence must be judged differently from a normal B2C or SaaS company. Consumer adoption matters mainly insofar as it helps an OEM justify more model rollouts, stronger trim penetration, and larger production volumes. Public evidence also suggests that strategic value is highly uneven: Great Wall-linked programs, Smart, and other leading OEM integrations likely matter far more than a long tail of undeclared logos. The practical question is therefore which relationships have reached production, which are still roadmap claims, and how quickly one deployed program turns into repeat model wins.",
