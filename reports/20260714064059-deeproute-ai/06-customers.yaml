    {
      "id": "adoption-trajectory-and-named-customer-proof",
      "title": "Adoption trajectory and named customer proof: DeepRoute has crossed into real production scale",
      "body": "DeepRoute’s customer proof is materially stronger than that of an autonomy company still limited to pilots. Multiple sources tie the company to over 150,000 vehicles by late 2025, over 200,000 by year-end 2025, and over 250,000 in later 2026 messaging. Public reporting also points to more than 10 models in progress, confirmed OEM partnerships for IO 2.0, and a set of named or strongly implied customer relationships around Great Wall Motor, Smart, Geely-linked programs, and Leapmotor. The most important pattern is not the exact number on any one date, but the repeated evidence that DeepRoute is expanding from one or two showcase wins into a broader production footprint. That is why sources emphasize monthly third-party share, mainstream SUV penetration, and production-vehicle robotaxi plans rather than just technical demos. Still, most named-customer evidence remains company- or partner-authored, and the public record rarely discloses contract value, duration, or revenue contribution per customer.",
