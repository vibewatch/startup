    {
      "id": "retention-expansion-and-concentration",
      "title": "Retention, expansion, and concentration: public evidence is strongest on expansion logic and weakest on renewal proof",
      "body": "DeepRoute’s public materials strongly imply a land-and-expand motion but stop short of proving true retention. The expansion logic is visible: once one model reaches SOP and performs well, the same OEM can broaden deployment into additional nameplates, higher trim penetration, or even fleet use cases. Management commentary around joint ventures, state-owned automakers, and robotaxi expansion reinforces this dynamic. But the public record offers no NRR, GRR, cohort, churn, or contract-length disclosure. It also does not reveal customer concentration by revenue even though the named program mix suggests a few OEMs likely dominate near-term economic value. For investors, this means customer durability is currently inferred from continued deployment momentum and repeated partnership announcements rather than measured renewal metrics. That is useful but incomplete. The best evidence of stickiness is integration depth and model reuse; the biggest unresolved risk is whether one or two anchor OEMs account for a disproportionate share of shipped vehicles and future revenue.",
