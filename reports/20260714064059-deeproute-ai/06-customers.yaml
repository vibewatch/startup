    {
      "id": "customer-verdict",
      "title": "Customer verdict: real production adoption, but still a concentrated and under-disclosed base",
      "body": "The customer verdict is positive on proof of real adoption and mixed on proof of durability. DeepRoute is no longer trying to win diligence on unnamed pilot logos alone; public sources show it has real production deployments, visible OEM relationships, and enough scale to matter in Chinese intelligent driving. That is a meaningful achievement. At the same time, the chapter surfaces the main missing pieces: customer-level revenue concentration, renewal metrics, exact contract duration, and independently verified outcome metrics by OEM or model. The result is a customer base that appears strategically valuable and expanding, but still opaque in the ways that matter most for underwriting. Investors should therefore treat customer traction as confirmed, customer expansion logic as plausible, and customer durability as an important diligence gap rather than a proven fact. today. materially",
