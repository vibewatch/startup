  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "DeepRoute.ai’s product has evolved from a dedicated L4 robotaxi stack into a mass-production intelligent-driving platform built around end-to-end and VLA models, flexible sensor choices, and a faster data flywheel. The key commercial artifact today is DeepRoute IO 2.0: a VLA-powered smart-driving platform that the company says can run in both LiDAR-equipped and pure-vision configurations, integrates with multiple chip paths, and is designed for everyday consumer vehicles rather than only fenced robotaxi fleets. The technology proposition is strong on architecture narrative and practical OEM fit, but weaker on independently disclosed safety, certification, and benchmark evidence. In short, the product appears commercially relevant and technically ambitious, but the public record still contains more architecture detail than third-party validation."
  },
  "sections": [
    {
      "id": "product-definition-and-module-map",
      "title": "Product definition: what DeepRoute actually delivers in customer workflow terms",
      "body": "DeepRoute’s current product is best understood as a production intelligent-driving platform for automakers, not merely a robotaxi prototype. The company’s public materials describe DeepRoute IO 2.0 as a smart-driving platform for everyday users, powered by a Vision-Language-Action model and designed for integration across multiple vehicle models and OEMs. That is a different commercial object from the earlier narrative around dedicated Level 4 fleets: the platform now sits much closer to the vehicle-program workflow of sourcing, integration, SOP launch, road data collection, and iterative updates. Robotaxi has not disappeared from the story, but it has become an adjacent layer rather than the only visible product. This framing matters because it explains why the company emphasizes deployability, sensor flexibility, chip partnerships, and defensive-driving behavior rather than only autonomy spectacle. The public artifact is therefore a modular intelligent-driving stack whose value depends on OEM fit, deployment maturity, and data-feedback speed.",
