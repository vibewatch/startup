  topStrengths:
    - 公司公开称量产上车已达 200,000+ 辆、随后 250,000+ 辆，并确认 5 个 IO 2.0 OEM 合作，生产级部署已有真实证据。
    - Alibaba 和 Great Wall Motor 的战略资本背书，验证了产品切入量产 OEM 项目的相关性。
    - 公司面对的是规模大且仍在增长的中国 NOA 与自动驾驶授权市场，而不是只做小众试点。
    - 产品架构灵活，叠加更宽的 physical-AI 叙事，使公司不被单一 robotaxi 或单一传感器故事锁死。
  topRisks:
    - 2025 年，中国围绕辅助驾驶营销、OTA 推送、召回处理和安全验证的监管明显收紧。
    - 可见客户集中度仍偏窄，2026 年资料里 Great Wall 和 Leapmotor 仍是两个核心账户。
    - 所审材料没有公开经审计收入、单车价格、毛利率，也没有干净的当前估值锚。
    - 自动驾驶 IPO 与融资窗口比 2021 年更窄、更不宽容，资本强度仍高。
    - 如果外部条件恶化，计算出口限制和创始人集中都可能拖慢路线图执行。
