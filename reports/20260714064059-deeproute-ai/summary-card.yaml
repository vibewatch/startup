  topStrengths:
    - >-
      Real production deployment proof with 200,000+ and later 250,000+ vehicles publicly claimed, plus five confirmed
      IO 2.0 OEM partnerships.
    - >-
      Strategic capital support from Alibaba and Great Wall Motor validates product relevance to mass-production OEM
      programs.
    - >-
      Exposure to a large, still-growing China NOA and autonomous-driving licensing market rather than a niche pilot
      segment only.
    - >-
      Flexible product architecture and broader physical-AI narrative create optionality beyond a single robotaxi or
      single-sensor story.
  topRisks:
    - >-
      Chinese regulation tightened sharply around assisted-driving marketing, OTA rollout, recall handling, and safety
      validation in 2025.
    - >-
      Visible customer concentration still appears narrow, with Great Wall and Leapmotor standing out as the two core
      accounts in 2026 coverage.
    - >-
      No public audited revenue, per-vehicle pricing, gross margin, or clean current valuation mark in the reviewed
      materials.
    - >-
      Capital intensity remains high while the autonomous-driving IPO and funding window appears narrower and less
      forgiving than in 2021.
    - Compute-export restrictions and founder concentration can both slow roadmap execution if conditions worsen.
