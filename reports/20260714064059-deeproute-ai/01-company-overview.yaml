  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "DeepRoute.ai is a Shenzhen-headquartered autonomous-driving company founded in 2019 by Maxwell Zhou that has evolved from a robotaxi-first Level 4 developer into a mass-production intelligent-driving supplier that still keeps robotaxi and physical-world AI ambitions alive. Public evidence supports a $300 million Alibaba-led Series B in 2021, a $100 million strategic round from Great Wall Motor in 2024, and materially stronger commercialization signals in 2025-2026 including roughly 200,000-plus production-vehicle deliveries and smart-driving programs with Great Wall, smart, and other OEMs. The main overview-stage cautions are conflicting public funding totals, incomplete disclosure on exact valuation beyond unicorn status, and a tightening Chinese regulatory regime for advanced driving claims and OTA-driven feature rollout."
  },
  "sections": [
    {
      "id": "identity-and-footprint",
      "title": "Identity, founding, footprint, and what the company actually sells",
      "body": "DeepRoute.ai should be underwritten as an autonomous-driving systems supplier, not merely as a robotaxi operator or an AI lab. Multiple public profiles and media reports align on several baseline identity facts: the company was founded in 2019, is headquartered in Shenzhen, and maintains a Fremont presence that signals continuing U.S. R&D or business development capacity. The business model is broader than a single software module. CB Insights describes a full Level 4 stack spanning robotaxis, trucks, and commercialization services, while Craft and TechCrunch portray a company that packages self-driving systems for automakers and mobility use cases. That framing matters because it explains why DeepRoute can plausibly serve three lanes at once—consumer-vehicle assisted driving, robotaxi operations, and a longer-term physical-world AI platform—while still centering commercialization on production vehicle programs. Public descriptions also show a distinct technical identity: map-free driving, end-to-end models, and a willingness to bring high-automation capabilities down to commodity vehicle hardware and mass-market price points instead of preserving them only for premium fleets.",
