    {
      "id": "milestones-and-risk-context",
      "title": "Milestones, IPO signals, and the regulatory context that could shape the next phase",
      "body": "The milestone record now supports a real commercialization narrative, but it also surfaces the major context risk. Public sources trace the company from 2019 founding, early Dongfeng and Hangzhou robotaxi pilots, and the 2021 Alibaba round through the 2022 low-cost L4 push, the 2024 Great Wall-backed financing, and the 2025-2026 ramp into production-vehicle deployments, smart and Black Sesame partnerships, an L3 cooperation with an unnamed global automaker, and a 2026 push toward IPO readiness. 36Kr’s 2026 reporting that DeepRoute secretly submitted Hong Kong listing materials suggests management views the current delivery and order-conversion window as monetizable before competitive intensity rises further. The main overview-stage risk is that commercialization is scaling into a stricter regulatory environment. China’s MIIT tightened rules in 2025 around public beta testing, marketing language, unsupervised parking features, and OTA management after fatal safety concerns. For a company whose brand is tied to advanced driving and rapid iteration, this means future growth depends not just on model quality and OEM wins, but on proving that mass-market deployment can survive more formal oversight, more conservative claims, and stricter product-governance discipline.",
