evidenceGaps:
  - type: missing-source
    severity: material
    topic: products
    missingEvidence: A readable primary description of current products, commercial model, headquarters, and founding date.
    whyItMatters: Sector and peer evidence cannot establish what SPIC Hydrogen Energy currently sells or how it earns revenue.
    diligencePath: >-
      Obtain the current official company profile, product catalog, registry extract, and parent-company subsidiary
      disclosure.
    relatedQuestionRefs:
      - QO001
      - QO002
  - type: private-evidence-only
    severity: blocking
    topic: valuation-and-financials
    missingEvidence: Current valuation, audited revenue, cash balance, burn, backlog, margins, debt, and financing terms.
    whyItMatters: The reported financing amount cannot establish current equity value, liquidity, dilution, or investor returns.
    diligencePath: >-
      Obtain the latest audited accounts, financing term sheet, cap table, debt schedule, and any IPO filing or draft
      prospectus from the company or lead investors.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: Current founders, executives, directors, ownership chain, and material leadership changes.
    whyItMatters: Governance quality and key-person dependence cannot be assessed from parent affiliation or sector speakers.
    diligencePath: >-
      Request an authoritative organization chart, board minutes or roster, executive biographies, and related-party
      governance disclosures.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: company-milestones
    missingEvidence: At least eight dated milestones specifically attributable to SPIC Hydrogen Energy.
    whyItMatters: >-
      Sector-level milestones do not prove the company's product delivery, customer traction, regulatory progress, or
      execution.
    diligencePath: >-
      Re-run official-domain and filing searches with readable company newsroom, parent-company, registry, and
      procurement records.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-and-scale
    missingEvidence: Named customers, active deployments, locations, headcount, and product-line revenue split.
    whyItMatters: >-
      These measures determine whether the financing reflects operating traction or primarily strategic capital
      deployment.
    diligencePath: >-
      Obtain customer reference letters, deployment lists, workforce disclosures, and product-level revenue or backlog
      schedules.
    relatedQuestionRefs:
      - QO006
      - QO009
  - type: private-evidence-only
    severity: material
    topic: company-sizing
    missingEvidence: SPIC-specific SAM, SOM, product-line revenue, utilization, backlog and win-rate data by buyer segment.
    whyItMatters: >-
      Broad sector capacity and component forecasts cannot establish the company's serviceable market or conversion into
      recurring orders.
    diligencePath: >-
      Obtain management's segment revenue bridge, qualified pipeline, backlog aging, customer concentration and
      geographic serviceable-market definition.
    relatedQuestionRefs:
      - QM008
      - QM010
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A transparent methodology reconciling component forecasts with China equipment capacity, vehicle deployment and
      hydrogen-output measures.
    whyItMatters: >-
      The available lenses use different units, populations and time bases; summing them would double-count the
      opportunity.
    diligencePath: >-
      Request source workbooks or methodology notes and rebuild the sizing with a common unit, geography, period and
      buyer boundary.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
