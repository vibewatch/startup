    body: The retained evidence consistently describes coverage from fuel-cell materials through systems, with a parallel electrolyzer and integrated-project offering.
    claimRefs: [CE005, CE006]
  - calloutType: assumption
    title: Certification is a process signal, not field proof
    body: IATF16949 certification supports quality-system maturity and supply-chain qualification, but the public record does not establish durability, uptime, warranty or customer-level performance.
    claimRefs: [CE009, CE012]
