chapter:
  number: 5
  title: Product & Technology
  summary: SPIC Hydrogen Energy presents a vertically integrated hydrogen technology portfolio spanning fuel-cell materials, components, systems, and PEM/alkaline electrolyzer projects. Public evidence supports meaningful quality-system and product-chain maturity, but independent data on deployed reliability, field economics, software controls, and product-level performance remain limited.
sections:
  - id: product-scope
    title: Product scope and customer workflow
    body: >-
      Public descriptions position SPIC Hydrogen Energy, also called SPIC Hydrogen
      Tech or Guohydrogen Technology in the retained sources, as a hydrogen
      technology manufacturer rather than a single-product software company. The
      product surface covers fuel-cell materials, components, stacks and power
      systems, alongside hydrogen-production equipment and integrated project
      applications. The China Hydrogen Energy Expo description places the fuel-cell
      line in city transit, delivery logistics, sanitation, heavy freight, mining,
      rail, inland shipping, aviation, backup power and combined heat and power.
      Its PEM and alkaline hydrogen-production products are described for
      photovoltaic-plus-PEM, wind/solar-coupled PEM or alkaline production, and
      green-hydrogen-to-ammonia projects. That breadth can address multiple
      customer workflows, but it also increases qualification, service and
      integration burden relative to a focused component vendor.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Technology architecture and maturity
    body: >-
      The strongest architecture evidence is a materials-to-system chain. The
      retained industry-exhibition source lists catalyst, carbon paper, proton
      exchange membrane, membrane electrode and bipolar-plate materials, followed
      by stack assembly, system integration and engineering production processes.
      A 2025 certification report independently describes the certified scope as
      catalyst, proton exchange membrane, carbon paper, gas-diffusion layer,
      membrane electrode, fuel-cell stack and fuel-cell power system. This
      convergence supports a credible full-chain product architecture, while not
      proving that every item is manufactured at commercial scale or that all
      products have equivalent field maturity. The World Bank's electrolyzer
      analysis is relevant to the operating model: the stack is usually about
      one-third of total project cost, while EPC, civil works, permitting and
      financing typically make up 40–50%, making balance-of-plant execution and
      integration central technical dependencies.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: quality-deployment
    title: Quality, deployment and reliability signals
    body: >-
      SPIC Hydrogen Tech announced that it and four subsidiaries passed TÜV
      Rheinland group certification for IATF16949:2016 in the advanced-materials
      and parts category in October 2025. The retained report says the scope
      covers the materials, components and system chain and describes standardized
      processes from research and development through production and after-sales
      service. This is a meaningful process and automotive-supply-chain access
      signal, but it is not a substitute for disclosed failure rates, warranty
      reserves, stack durability curves, uptime, safety-incident history or
      customer-level service data. Industry reporting also identifies persistent
      sector constraints in cost, material durability and uneven refueling
      infrastructure. The technical diligence case therefore turns on field
      evidence and project-level reliability, not only certification or stated
      vertical integration.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: differentiation-and-gaps
    title: Differentiation and diligence gaps
    body: >-
      Differentiation is most supportable as a combination of state-backed
      industrial access, in-house materials and component coverage, and the
      ability to combine fuel-cell products with hydrogen-production projects.
      China Daily reported more than 540 hydrogen-refueling stations nationwide
      by the end of 2024, which indicates a deployment surface but does not
      establish SPIC-specific adoption or performance. Tracxn identifies the
      company as founded in 2017 and a fuel-cell battery and system manufacturer,
      but its profile is a commercial database rather than audited technical
      evidence.
      The public record does not establish comparative
      efficiency, stack life, delivered cost, conversion yield, production
      throughput, software or data architecture, cybersecurity controls, or
      customer-verified availability. The recruiting page could not be read
      beyond a loading message, so it cannot close questions about engineering
      depth or current product teams. The next diligence step is a product-by-
      product technical data room containing certification scope, test protocols,
      warranty and return data, installed-base performance, safety cases, and
      lifecycle cost assumptions.
    claimRefs: [CE013, CE014, CE015, CE016]
