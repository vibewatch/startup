      - [Stack, "Assembles electrochemical components into a fuel-cell stack", "Component tolerances, thermal and water management", "Degradation and replacement economics are undisclosed"]
      - [System integration, "Packages stacks into fuel-cell power systems", "Vehicle, stationary-load and controls interfaces", "Field integration and safety evidence are limited"]
