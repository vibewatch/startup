chapter:
  number: 7
  title: Risks
  summary: Public evidence supports a high-risk profile for SPIC Hydrogen Energy because hydrogen equipment combines stringent safety and regulatory obligations with immature demand and infrastructure economics. The sources do not establish a company-specific incident or control maturity, so the principal investment task is to verify SPIC's licenses, safety systems, quality record, counterparties, and cash resilience.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Hydrogen equipment and projects operate across overlapping safety, standards, permitting, transport, and environmental regimes. The Chinese hazardous-chemicals law assigns regulators responsibility for safety-condition reviews, production and use permits, transport permissions, product quality, environmental incidents, and emergency response, while requiring hazardous-chemicals units to maintain risk controls, training, major-hazard-source records, monitoring, and emergency plans. China’s 2026 draft hydrogen standards add product-specific requirements across fuel quality, leak testing, electrolyzers, pipelines, refueling equipment, and data collection; the source says three standards are modified or non-equivalent to ISO versions. For SPIC, this creates a market-access and redesign risk rather than proof of non-compliance: diligence should reconcile each product and project with the applicable Chinese standard, permit, site-distance, inspection, and filing record. The public pool contains no company-specific license register, enforcement decision, litigation docket, or environmental finding, so residual exposure remains material until those records are obtained.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-safety
    title: Operational, quality, and security risk
    body: >-
      Hydrogen safety risk is inherently cascading. The peer-reviewed review identifies leaks, over-pressurization, material degradation, embrittlement, ignition, and confined-space accumulation as linked failure modes across production, storage, distribution, and use. It also notes that mitigation effectiveness depends on real-time responsiveness and regulatory enforcement, with research gaps in predictive modelling, material durability, human error, combustion behaviour, and fire suppression. The 2025 industry report adds that fuel-cell systems and hydrogen storage represented about 53% and 14% of a 49-ton vehicle’s cost, respectively, while the Chinese heavy-duty market evidence shows fuel-cell heavy trucks had only a 1% market share in June 2024. These facts imply quality, warranty, utilization, and scaling risks for an equipment supplier, but they do not prove SPIC's failure rate. The control test is therefore operational evidence: failure-mode analysis, leak and embrittlement testing, incident and recall logs, warranty reserves, cybersecurity controls for monitoring systems, and independent acceptance data.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-financial
    title: Partner, dependency, and financial-model risk
    body: >-
      Hydrogen projects remain exposed to demand timing, power costs, financing, infrastructure coordination, and counterparty quality. CMS reports that project delays and cancellations have been driven by financing complexity, high renewable-input costs, subsidy requirements, and a lack of offtakers willing to pay high entry costs; it cites projects delayed or withdrawn because power-purchase agreements or firm buyer commitments were not secured. Independent China market evidence shows fuel-cell vehicle output and sales fell year over year in 2024, while a 2025 report says the national fleet remained below a previously stated target and that refueling infrastructure was uneven. This is sector evidence, not a SPIC forecast. It makes backlog conversion, customer concentration, project payment terms, receivables, inventory, subsidy dependence, and supplier concentration the key unresolved model risks. The company-specific diligence path is to obtain a contract-level backlog aging, top-counterparty exposure, cash-flow bridge, warranty and milestone obligations, and stress cases for delayed commissioning or lower utilization.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: >-
      A defensible risk posture requires measurable triggers rather than an assumption that state backing or sector policy removes execution risk. Monitorable indicators include permit and standard-conformance exceptions, overdue corrective actions, reportable incidents, leak-detection and emergency-shutdown test results, hydrogen-compatible material failures, warranty claims, customer receivable days, project cancellations, supplier interruptions, and actual utilization of deployed systems. A thesis break would be a material safety or regulatory enforcement event, an inability to demonstrate compliant design or independent quality acceptance, repeated production or delivery failures, or liquidity stress caused by delayed offtake and rising working capital. The available evidence supports these tests but does not disclose SPIC-specific values, so the current conclusion is research-more rather than a quantified probability of loss.
    claimRefs: [CR003, CR005, CR009, CR012]
    callouts:
      - calloutType: risk
        title: Highest residual exposure
        body: The largest unresolved risk is not a demonstrated incident; it is the absence of public company-specific evidence showing that safety, quality, regulatory, and cash controls work at commercial scale.
        claimRefs: [CR004, CR008, CR012]
