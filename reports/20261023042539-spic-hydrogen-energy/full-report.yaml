  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer structure
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is hydrogen equipment and enabling components sold into mobility, stationary
              power and hydrogen production, with SPIC Hydrogen Energy positioned across fuel-cell stacks and systems,
              PEM electrolyzers, catalysts, membranes and bipolar plates. Dealroom describes the company as covering the
              hydrogen value chain from research and development through high-end manufacturing and as serving vehicles,
              ships and backup power. The boundary should exclude the value of all hydrogen molecules, downstream
              vehicle sales and unrelated renewable-generation assets unless SPIC captures that spend through an
              identified contract. Buyers are therefore heterogeneous: vehicle OEMs and fleet operators buy systems,
              industrial or energy developers buy electrolyzers, and public or state-owned sponsors can fund
              demonstration infrastructure. A procurement path normally requires technical qualification, hydrogen
              availability, refueling or balance-of-plant integration, and a credible total-cost-of-ownership case. The
              public record does not isolate SPIC's serviceable geography, product-line revenue or contract conversion,
              so a company-specific SAM/SOM remains an evidence gap rather than a defensible percentage of global
              hydrogen spending.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM016
      - number: '2.2'
        title: Sizing lenses and adoption evidence
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses give a more disciplined view than a single broad hydrogen forecast. The narrowest
              quantified lens in the assigned evidence is the global hydrogen-energy carbon paper market: Grand Research
              Store reports USD 743 million in 2025 and USD 2.945 billion in 2034, a 22.0% CAGR. That is an upstream
              component market, not SPIC's TAM, and the publisher's methodology and independent verification are not
              available in the fetched text. A China ecosystem lens is much larger but operationally constrained: the
              Energy Partnership report says China produced 37 Mt of hydrogen in 2024, had 3.5 GW of electrolysis
              capacity, and could reach 50 GW by 2030. The vehicle lens shows demand is not linear: CarNewsChina reports
              roughly 30,000 vehicles in the national fleet but first-half 2025 production and sales down roughly 47%
              year over year. S&P Global separately reports 39 GW per year of electrolyzer manufacturing capacity versus
              only 693 MW of tenders in the first ten months of 2024, an indicator of offtake risk. These figures
              support a layered market thesis, not a mechanically summed TAM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Growth drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Policy and localization can expand the opportunity, but adoption depends on economics and operating
              infrastructure. Energy Partnership identifies more than 500 sub-national hydrogen policies and says
              incentives are shifting toward production technology and applications beyond transport. CarNewsChina
              reports more than 200 vehicles on over 20 freight corridors, over 40 supporting stations, average urban
              hydrogen prices around CNY26.7/kg and production costs falling from CNY30.2/kg to CNY27.7/kg year over
              year. Those data points suggest an emerging commercial workflow, yet the same source reports a fleet below
              an earlier 50,000-vehicle target. S&P Global highlights high green-hydrogen system costs, declining
              alkaline-electrolyzer prices and margin pressure, while Energy Partnership identifies only 100 km of
              hydrogen pipelines and persistent technology and standardization gaps. For SPIC, strategic parentage and
              vertical integration may help access pilots and supply, but valuation still depends on repeat orders,
              utilization, warranty economics and non-subsidy demand that the assigned public evidence does not
              quantify.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy's relevant competitive set spans PEM electrolyzers, alkaline electrolyzers, fuel-cell
              systems, integrated hydrogen projects, and the status quo of fossil-based hydrogen or delayed adoption.
              Preqin describes SPIC as established in 2017, operating under State Power Investment Corporation, and
              combining fuel-cell research, power-system units, hydrogen-production technology, and hydrogen-safety
              testing. The public record therefore supports treating SPIC as an integrated technology and project
              participant rather than a single-product vendor. The competitor universe is broader than named direct
              peers: buyers can select another equipment supplier, use an integrated project developer, continue with
              grey hydrogen, or defer a project while economics and infrastructure develop. These alternatives solve the
              same decarbonization objective with different cost, performance, execution, and policy trade-offs. The
              available independent sources do not disclose a comprehensive SPIC peer ranking, contract win rate, or
              comparable price book, so those fields remain unknown rather than inferred.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP009
              - CP016
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              SPIC's strongest public capability signal is a large PEM electrolyzer: FuelCellChina reports a certified
              500 Nm3/h unit, independently developed catalysts and membrane electrodes, and a megawatt-scale deployment
              at the Da'an wind-and-solar green hydrogen synthesis-ammonia demonstration project. The same report states
              that the deployed electrolyzer accumulated more than 10,000 operating hours, but it is a company-sourced
              industry article rather than an independent benchmark. The comparative constraint is material: S&P Global
              reports Chinese electrolyzer manufacturing capacity of 39 GW per year in 2024 against only 693 MW of
              tenders in the first ten months, and describes high costs, weak offtake, and falling system prices. The
              China hydrogen-sector study adds that transport and storage remain bottlenecks, with only 100 km of
              hydrogen pipelines in operation as of its 2025 publication. These facts imply that distribution, project
              integration, standards, and bankable offtake may matter as much as stack specifications. REFIRE is a
              visible adjacent benchmark: O'Melveny describes its 2024 Hong Kong IPO, hydrogen fuel-cell and
              production-system scope, and international footprint, but that legal-firm release is not an independent
              operating comparison. No retained source supplies like-for-like SPIC-versus-REFIRE pricing, reliability,
              warranty, customer concentration, or channel conversion data.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a conditional, not categorical, moat thesis. SPIC can point to state-enterprise
              affiliation, an operating demonstration, PEM component development, and hydrogen safety testing as
              potential trust and integration advantages. Yet those advantages are exposed to commoditization and
              displacement. S&P Global reports that Chinese 1,000 Nm3/h alkaline electrolyzer prices fell from
              $200-$224/kW in 2023 to $185-$200/kW in the first half of 2024, approaching production costs and squeezing
              manufacturer margins. It also reports that Chinese PEM manufacturers still rely on imported
              proton-exchange membranes and precious metal catalysts, while EU and US trade and technology-transfer
              barriers can affect exports. The 2025 vehicle report describes a roughly 30,000-vehicle national fleet,
              first-half 2025 production and sales down about 47% year over year, and continuing cost, durability, and
              refueling constraints. That combination raises the risk that a technically credible product remains
              underutilized, while larger incumbents or lower-cost suppliers compete for projects. The public evidence
              does not establish SPIC's switching costs, proprietary IP enforcement, backlog quality, or repeat customer
              rate; these are material diligence gaps.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: Competitive implications and diligence limits
        blocks:
          - type: paragraph
            body: >-
              For underwriting, SPIC's differentiation should be tested at the project level: delivered cost per unit of
              hydrogen, uptime under intermittent renewable input, component localization, certification, service
              coverage, financing support, and secured offtake. The retained evidence is stronger on industry structure
              and technical constraints than on named-vendor commercial outcomes. A buyer may multi-home across stack
              vendors, use an incumbent alkaline system, contract an integrated project developer, or defer adoption;
              each path weakens any assumption that a single PEM milestone creates durable pricing power. The principal
              positive signal is credible operating experience in a demonstration project. The principal adverse signal
              is a supply-demand mismatch in which manufacturing capacity greatly exceeds tender demand, alongside high
              green-hydrogen costs and export barriers. Until SPIC discloses comparable pricing, customer references,
              backlog conversion, warranty performance, and proprietary-component economics, the competitive case
              supports research-more rather than a high-confidence moat conclusion.
            claimRefs:
              - CP004
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical credibility
            body: >-
              SPIC has a reported 500 Nm3/h PEM electrolyzer and more than 10,000 hours of accumulated operation in a
              megawatt-level demonstration, which is a stronger public signal than an untested product announcement.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Commercial commoditization
            body: >-
              Industry capacity, weak tender demand, falling electrolyzer prices, imported PEM components, and export
              barriers all challenge the assumption that technical scale converts into durable pricing power.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: callout
            title: Evidence boundary
            body: >-
              The retained sources do not provide a comparable SPIC peer set for pricing, customer retention, backlog,
              warranty cost, or market share; those fields remain diligence requests.
            calloutType: assumption
            claimRefs:
              - CP004
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and commercial activity
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy appears to monetize hydrogen equipment and integrated deployments rather than a
              recurring software subscription. The strongest current operating signal is a reported delivery of 200
              hydrogen-powered Dongfeng vehicles, with the vehicles serving city distribution, muck transportation, and
              bulk commodity transportation in Wuhan. The same report describes an ecosystem spanning fuel-cell systems,
              complete vehicles, refueling stations, hydrogen supply, and vehicle operation, which is consistent with
              project or systems revenue but does not establish the company’s recognized revenue, gross profit, or share
              of contract value. A 2022 funding report said the company made hydrogen production equipment, fuel-cell
              catalysts, carbon paper, and other core parts and planned seven production lines; those were
              company-reported plans, not audited outcomes. The commercial model therefore has several possible revenue
              streams, but public evidence does not separate product sales, project revenue, service revenue, or
              pass-through infrastructure economics.
            claimRefs:
