  - id: FE001
    title: Fuel-cell and hydrogen-production architecture
    type: stack
    summary: >-
      The public record describes a vertically integrated fuel-cell chain complemented by PEM and alkaline
      hydrogen-production applications.
    data:
      layers:
        - name: Customer applications
          label: Customer applications
          detail: Publicly described mobility, stationary-energy and integrated-project use cases.
          items:
            - label: Zero-carbon transport
              detail: City transit, logistics, heavy freight, mining, rail, inland shipping and aviation use cases.
            - label: Stationary and integrated energy
              detail: Backup power, combined heat and power, renewable-power hydrogen and green-ammonia projects.
        - name: System products
          label: System products
          detail: Fuel-cell power systems and PEM or alkaline hydrogen-production pathways.
          items:
            - label: Fuel-cell power system
              detail: End-user system in the retained certification and exhibition descriptions.
            - label: PEM and alkaline hydrogen production
              detail: Electrolyzer pathways described for integrated renewable-energy projects.
        - name: Stack and integration
          label: Stack and integration
          detail: Stack assembly and system integration connect components to operating environments.
          items:
            - label: Fuel-cell stack
              detail: Stack assembly and system integration are described as engineering capabilities.
            - label: System integration
              detail: Connects core products to vehicle, stationary and project operating environments.
        - name: Components
          label: Components
          detail: Membrane electrodes and bipolar plates bridge materials and stacks.
          items:
            - label: Membrane electrode
              detail: Certified-scope component between materials and stack.
            - label: Bipolar plate
              detail: Listed in the exhibition description as a component-level technology.
        - name: Core materials
          label: Core materials
          detail: Catalyst, proton exchange membrane, carbon paper and gas-diffusion-layer materials.
          items:
            - label: Catalyst and proton exchange membrane
              detail: Listed as independent technology products in the certification report.
            - label: Carbon paper and gas-diffusion layer
              detail: Listed as fuel-cell full-chain materials.
        - name: Operating controls
          label: Operating controls
          detail: Quality management plus safety analysis, simulation and monitoring capabilities.
          items:
            - label: Quality management
              detail: IATF16949:2016 certification reported for SPIC Hydrogen Tech and four subsidiaries.
            - label: Hydrogen safety and analytics
              detail: >-
                Exhibition description mentions hydrogen-safety analysis, simulation design, big-data monitoring and
                intelligent computation.
    claimRefs:
      - CE005
      - CE006
      - CE009
      - CE010
