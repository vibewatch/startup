      - number: '1.4'
        title: What the record supports
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a strategically relevant, state-linked position in China's hydrogen industrial
              chain, not an investable operating profile. S&P Global reports Chinese electrolyzer manufacturing capacity
              of 39 GW per year in 2024 against only 693 MW of tenders in the first ten months, alongside falling
              alkaline-system prices and squeezed manufacturer margins. The German Energy Partnership separately
              identifies coal dependence, transport and storage bottlenecks, and persistent technology gaps. Those
              constraints make SPIC Hydrogen Energy's undisclosed product economics, customer concentration, warranty
              exposure, and project cancellation history more important than the headline financing number. The
              appropriate current stance is research-more: obtain primary corporate and financing records before
              assigning a current valuation, scale score, or IPO probability.
