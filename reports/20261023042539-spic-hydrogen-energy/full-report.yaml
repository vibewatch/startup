      - number: '5.2'
        title: Technology architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest architecture evidence is a materials-to-system chain. The retained industry-exhibition
              source lists catalyst, carbon paper, proton exchange membrane, membrane electrode and bipolar-plate
              materials, followed by stack assembly, system integration and engineering production processes. A 2025
              certification report independently describes the certified scope as catalyst, proton exchange membrane,
              carbon paper, gas-diffusion layer, membrane electrode, fuel-cell stack and fuel-cell power system. This
              convergence supports a credible full-chain product architecture, while not proving that every item is
              manufactured at commercial scale or that all products have equivalent field maturity. The World Bank's
              electrolyzer analysis is relevant to the operating model: the stack is usually about one-third of total
              project cost, while EPC, civil works, permitting and financing typically make up 40–50%, making
              balance-of-plant execution and integration central technical dependencies.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
