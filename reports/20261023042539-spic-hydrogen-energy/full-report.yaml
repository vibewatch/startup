  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Technical and market evidence supports tracking, while valuation and liquidity gaps prevent a current buy
      decision.
    data:
      nodes:
        - id: scale
          label: Market scale
          detail: China fleet and infrastructure are real but adoption remains uneven
        - id: proof
          label: Technical proof
          detail: Qingyong PEM equipment has official first-unit recognition and reported operating history
        - id: risk
          label: Downside risks
          detail: Loss-making or compressed public comparables and delayed commercialization signals
        - id: price
          label: Price evidence
          detail: Historical CNY13B mark and non-binding $0.66 indication do not establish current fair value
        - id: diligence
          label: Diligence gate
          detail: Audited economics, backlog, cap table, preferences, and verified transactions
        - id: recommendation
          label: Recommendation
          detail: Research-more / track; do not underwrite a new entry price
      edges:
        - from: scale
          to: proof
        - from: proof
          to: risk
        - from: risk
          to: price
        - from: price
          to: diligence
        - from: diligence
          to: recommendation
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV011
      - CV014
      - CV016
