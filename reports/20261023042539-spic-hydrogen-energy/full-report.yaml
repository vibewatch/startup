      - number: '1.3'
        title: Operating context and milestones
        blocks:
          - type: paragraph
            body: >-
              The 2025 industry sources place the company in a market with meaningful infrastructure and localization
              progress but weak near-term proof of broad-based scale. The China Hydrogen Fuel Cell Vehicle
              Industrialization Development Report, as summarized by CarNewsChina and Hydrogen Central, describes
              core-component localization above 70%, approximately 30,000 vehicles in the national fleet, and first-half
              2025 production and sales of 1,364 and 1,373 units respectively, roughly 47% below the comparable prior
              period. The same report describes more than 200 vehicles on over 20 freight corridors supported by more
              than 40 stations, while the German Energy Partnership says China produced 37 Mt of hydrogen in 2024,
              mostly from coal, and had only about 100 km of hydrogen pipelines. These are sector milestones, not SPIC
              Hydrogen Energy milestones, but they define the adoption environment into which the company must sell.
