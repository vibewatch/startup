chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business perimeter
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies SPIC Hydrogen Energy as a subsidiary of the Chinese state-owned power
              company SPIC Group and reports a 2023 funding event of RMB4.5 billion (about $631 million), but the
              fetched FuelCellsWorks page is an access-gated landing page rather than a readable article. That means the
              identity and funding description are retained as a company-specific reported fact, not treated as
              independently corroborated financial disclosure. The assigned pool does not contain a readable official
              SPIC Hydrogen Energy profile, product catalog, founder page, board roster, headquarters record, or
              customer list. Accordingly, this chapter does not infer a current product mix, business model, or revenue
              contribution by line from sector or peer evidence. The company-specific perimeter supported here is
              limited to the reported parent relationship and financing headline; a current operating description
              requires primary company materials.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
      - number: '1.2'
        title: Capital, governance, and scale
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the clearest company-specific datapoint, but it is not a substitute for cash
              available, valuation, revenue, or cash burn. The reported RMB4.5 billion raise is dated January 2023 in
              the pool metadata and should not be presented as a current valuation or as evidence that all proceeds
              remain on the balance sheet. No assigned source supplies the post-Series-C price, draft IPO range,
              cap-table preferences, debt terms, audited revenue, backlog, gross margin, headcount, or customer count.
              Leadership dependence is likewise unassessable: the pool names industry speakers from other organizations,
              not SPIC Hydrogen Energy executives. This is a material disclosure gap for an investor underwriting a
              private, state-linked industrial company because control rights, operating accountability, and financing
              capacity cannot be inferred from the parent relationship alone.
