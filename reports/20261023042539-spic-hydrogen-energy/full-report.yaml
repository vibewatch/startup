  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public descriptions position SPIC Hydrogen Energy, also called SPIC Hydrogen Tech or Guohydrogen
              Technology in the retained sources, as a hydrogen technology manufacturer rather than a single-product
              software company. The product surface covers fuel-cell materials, components, stacks and power systems,
              alongside hydrogen-production equipment and integrated project applications. The China Hydrogen Energy
              Expo description places the fuel-cell line in city transit, delivery logistics, sanitation, heavy freight,
              mining, rail, inland shipping, aviation, backup power and combined heat and power. Its PEM and alkaline
              hydrogen-production products are described for photovoltaic-plus-PEM, wind/solar-coupled PEM or alkaline
              production, and green-hydrogen-to-ammonia projects. That breadth can address multiple customer workflows,
              but it also increases qualification, service and integration burden relative to a focused component
              vendor.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
