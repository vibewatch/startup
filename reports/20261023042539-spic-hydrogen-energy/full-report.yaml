      - number: '5.3'
        title: Quality, deployment and reliability signals
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Tech announced that it and four subsidiaries passed TÜV Rheinland group certification for
              IATF16949:2016 in the advanced-materials and parts category in October 2025. The retained report says the
              scope covers the materials, components and system chain and describes standardized processes from research
              and development through production and after-sales service. This is a meaningful process and
              automotive-supply-chain access signal, but it is not a substitute for disclosed failure rates, warranty
              reserves, stack durability curves, uptime, safety-incident history or customer-level service data.
              Industry reporting also identifies persistent sector constraints in cost, material durability and uneven
              refueling infrastructure. The technical diligence case therefore turns on field evidence and project-level
              reliability, not only certification or stated vertical integration.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Differentiation is most supportable as a combination of state-backed industrial access, in-house materials
              and component coverage, and the ability to combine fuel-cell products with hydrogen-production projects.
              China Daily reported more than 540 hydrogen-refueling stations nationwide by the end of 2024, which
              indicates a deployment surface but does not establish SPIC-specific adoption or performance. Tracxn
              identifies the company as founded in 2017 and a fuel-cell battery and system manufacturer, but its profile
              is a commercial database rather than audited technical evidence. The public record does not establish
              comparative efficiency, stack life, delivered cost, conversion yield, production throughput, software or
              data architecture, cybersecurity controls, or customer-verified availability. The recruiting page could
              not be read beyond a loading message, so it cannot close questions about engineering depth or current
              product teams. The next diligence step is a product-by- product technical data room containing
              certification scope, test protocols, warranty and return data, installed-base performance, safety cases,
              and lifecycle cost assumptions.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical integration is the clearest technical asset
            body: >-
              The retained evidence consistently describes coverage from fuel-cell materials through systems, with a
              parallel electrolyzer and integrated-project offering.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Certification is a process signal, not field proof
            body: >-
              IATF16949 certification supports quality-system maturity and supply-chain qualification, but the public
              record does not establish durability, uptime, warranty or customer-level performance.
            calloutType: assumption
            claimRefs:
              - CE009
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments, buyers, and operating use cases
        blocks:
          - type: paragraph
            body: >-
              The public customer record is organized around fleet and industrial use cases rather than a broad
              self-serve customer base. SPIC's disclosed hydrogen activity includes buses, trucks, ships, and drones,
              while a government-supervision publication describes more than a thousand products equipped with the
              Hydrogen Forerunner battery and a transportation network covering more than 20,000 kilometers. The named
              commercial buyers and users in the retained evidence are fleet operators, vehicle manufacturers, municipal
              demonstration programs, and logistics operators. This points to a multi-party sale: the technology
              supplier sells into an OEM or project, while the operating customer bears utilization and hydrogen-cost
              risk. The 230-vehicle logistics delivery reported by Energy界 identifies Yutong as the vehicle manufacturer
              and Hydrogen Power Technology as the operator, and places the subsequent intended purchase of 260 vehicles
              in a strategic cooperation context rather than completed revenue. The evidence therefore supports
              customer-segment traction, not a verified customer count, recurring revenue base, or independent proof of
              end-user economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              Adoption indicators show movement from demonstration toward larger commercial fleets, but they are not a
              substitute for cohort or retention data. SASAC reports that more than 1,000 SPIC products using the
              Hydrogen Forerunner battery had been delivered and that 30,000 battery-swapping trucks, mining trucks, and
              construction machines were in operation across the broader SPIC network, alongside more than 830 charging
              and swapping stations. The customer-specific 230-vehicle logistics delivery is a named batch deployment,
              and the announcement says the vehicles were intended for logistics and cold-chain use in Henan and
              Guangdong. Industry-wide evidence gives context for the addressable operating environment: the 2025
              vehicle report cited approximately 30,000 hydrogen vehicles nationally, but also reported first-half 2025
              production and sales below the prior year. These figures should not be attributed to SPIC Hydrogen Energy
              without a company-specific denominator. No retained source provides NRR, GRR, churn, renewal rates,
              contract length, repeat-purchase cohorts, or audited utilization for this company, so durability remains
              an open diligence question.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Named proof is credible where the source describes a delivered vehicle batch, an identified OEM
              relationship, a stated operating customer, or a government-supported demonstration, but most evidence
              remains company-issued or ecosystem-reported. The 230-vehicle delivery is stronger than a logo because it
              identifies the operator, OEM, vehicle quantity, and intended locations; however, the follow-on 260
              vehicles are only a purchase intention. The passenger vehicle strategy is also forward-looking: the
              retained announcement says the Hydrogen Forerunner-S series would first be demonstrated on a Hongqi H5 and
              expected 10,000 vehicles over five years, which is a plan rather than proof of production deployment.
              Customer concentration cannot be quantified from public evidence. Yutong, FAW/Hongqi, municipal
              hydrogen-city programs, and logistics operators appear strategically important, but the sources do not
              disclose contract values, share of revenue, backlog conversion, cancellations, or whether any named
              relationship is exclusive. The investment implication is that customer validation is real but still
              exposed to subsidy, infrastructure, and procurement timing.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named fleet proof exists
            body: >-
              The 230-vehicle delivery names both the OEM and operating customer and identifies intended logistics and
              cold-chain applications, which is stronger than an unsupported logo list.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: Durability is not publicly measurable
            body: >-
              The retained sources do not disclose churn, renewal, contract length, cohort retention, customer
              concentration, or utilization; the apparent adoption trajectory should therefore not be treated as
              recurring revenue proof.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Hydrogen equipment and projects operate across overlapping safety, standards, permitting, transport, and
              environmental regimes. The Chinese hazardous-chemicals law assigns regulators responsibility for
              safety-condition reviews, production and use permits, transport permissions, product quality,
              environmental incidents, and emergency response, while requiring hazardous-chemicals units to maintain
              risk controls, training, major-hazard-source records, monitoring, and emergency plans. China’s 2026 draft
              hydrogen standards add product-specific requirements across fuel quality, leak testing, electrolyzers,
              pipelines, refueling equipment, and data collection; the source says three standards are modified or
              non-equivalent to ISO versions. For SPIC, this creates a market-access and redesign risk rather than proof
              of non-compliance: diligence should reconcile each product and project with the applicable Chinese
              standard, permit, site-distance, inspection, and filing record. The public pool contains no
              company-specific license register, enforcement decision, litigation docket, or environmental finding, so
              residual exposure remains material until those records are obtained.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Hydrogen safety risk is inherently cascading. The peer-reviewed review identifies leaks,
              over-pressurization, material degradation, embrittlement, ignition, and confined-space accumulation as
              linked failure modes across production, storage, distribution, and use. It also notes that mitigation
              effectiveness depends on real-time responsiveness and regulatory enforcement, with research gaps in
              predictive modelling, material durability, human error, combustion behaviour, and fire suppression. The
              2025 industry report adds that fuel-cell systems and hydrogen storage represented about 53% and 14% of a
              49-ton vehicle’s cost, respectively, while the Chinese heavy-duty market evidence shows fuel-cell heavy
              trucks had only a 1% market share in June 2024. These facts imply quality, warranty, utilization, and
              scaling risks for an equipment supplier, but they do not prove SPIC's failure rate. The control test is
              therefore operational evidence: failure-mode analysis, leak and embrittlement testing, incident and recall
              logs, warranty reserves, cybersecurity controls for monitoring systems, and independent acceptance data.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR012
      - number: '7.3'
        title: Partner, dependency, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Hydrogen projects remain exposed to demand timing, power costs, financing, infrastructure coordination,
              and counterparty quality. CMS reports that project delays and cancellations have been driven by financing
              complexity, high renewable-input costs, subsidy requirements, and a lack of offtakers willing to pay high
              entry costs; it cites projects delayed or withdrawn because power-purchase agreements or firm buyer
              commitments were not secured. Independent China market evidence shows fuel-cell vehicle output and sales
              fell year over year in 2024, while a 2025 report says the national fleet remained below a previously
              stated target and that refueling infrastructure was uneven. This is sector evidence, not a SPIC forecast.
              It makes backlog conversion, customer concentration, project payment terms, receivables, inventory,
              subsidy dependence, and supplier concentration the key unresolved model risks. The company-specific
              diligence path is to obtain a contract-level backlog aging, top-counterparty exposure, cash-flow bridge,
              warranty and milestone obligations, and stress cases for delayed commissioning or lower utilization.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A defensible risk posture requires measurable triggers rather than an assumption that state backing or
              sector policy removes execution risk. Monitorable indicators include permit and standard-conformance
              exceptions, overdue corrective actions, reportable incidents, leak-detection and emergency-shutdown test
              results, hydrogen-compatible material failures, warranty claims, customer receivable days, project
              cancellations, supplier interruptions, and actual utilization of deployed systems. A thesis break would be
              a material safety or regulatory enforcement event, an inability to demonstrate compliant design or
              independent quality acceptance, repeated production or delivery failures, or liquidity stress caused by
              delayed offtake and rising working capital. The available evidence supports these tests but does not
              disclose SPIC-specific values, so the current conclusion is research-more rather than a quantified
              probability of loss.
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence gate before underwriting
            body: >-
              Do not underwrite a lower risk rating until SPIC supplies current permits and standards mapping,
              independent product and safety test evidence, incident and warranty history, customer and project
              concentration, supplier dependencies, and a cash-flow stress case for delayed offtake.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Market evidence and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The valuation case starts with a market that is strategically important but still commercially uneven.
              CarNewsChina reports 5,548 hydrogen fuel-cell vehicles produced and 5,405 sold in China during 2024, while
              first-half 2025 production and sales were 1,364 and 1,373 units, respectively, roughly 47% below the
              prior-year period. The same report describes a fleet of approximately 30,000 vehicles, more than 40
              refueling stations supporting over 200 vehicles on freight corridors, and a cost structure in which the
              fuel-cell system and hydrogen storage together represent more than two-thirds of a 49-ton vehicle's cost.
              That is a plausible long-run equipment opportunity, but the near-term adoption data do not support a
              high-growth revenue multiple without company backlog, gross-margin, warranty, and cancellation evidence.
              The comparison set reinforces the need for discipline: Yahoo Finance shows SinoHytec at CNY4.142B market
              capitalization with CNY260.55M trailing revenue and a CNY611.97M net loss, while Marketcapwatch reports
              Guofu at $50.36M market capitalization, $50.23M trailing revenue, and a $60.9M net loss. These are not
              directly comparable valuation multiples for SPIC, but they are useful downside signals for an equipment
              business with incomplete public economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing history and price discovery
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific valuation anchor remains historical. Sina Finance reports that SPIC
              Hydrogen Energy's December 2022 Series B post-money valuation was CNY13B, and that a later Series C was
              announced without a disclosed financing amount. The same report describes a 2025 tender for IPO sponsor
              and underwriting services, but also notes that an earlier 2023-to-2025 listing timetable had already been
              delayed. That combination is evidence of financing ambition, not evidence of a completed IPO or a current
              clearing price. Clarity lists a $0.66 model-derived indicative price and explicitly says the company is
              privately held, has no continuously quoted public price, and that not all matches result in completed
              transactions. The figure therefore cannot be converted into equity value without share class, share count,
              currency, transaction date, and transfer-terms evidence. The appropriate stance is to treat CNY13B as a
              historical reference point and the secondary indication as a non-binding liquidity signal, not as a
              refreshed mark.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Decision, scenarios, and diligence
        blocks:
          - type: paragraph
            body: >-
              The investment decision is research-more rather than buy or sell. The upside thesis is that SPIC can
              convert state-backed industrial access, recognized PEM-electrolyzer capability, and localized component
              know-how into repeatable commercial deployments. The anti-thesis is that hydrogen mobility remains below
              earlier deployment ambitions, public-company comparables are loss-making or sharply de-rated, and SPIC's
              current revenue, cash, backlog, cap table, liquidation preferences, and IPO range are not publicly
              evidenced in this pool. A precise bull/base/bear valuation range would imply unsupported revenue, margin,
              dilution, and exit assumptions, so the scenarios retain qualitative valuation logic and explicit evidence
              gates instead of false precision. A price-sensitive re-underwriting should begin only after audited
              financials, the complete capitalization table, the latest financing documents, product-level backlog,
              customer concentration, warranty exposure, and an executable liquidity path are obtained. Until then, the
              historical private mark is a ceiling to interrogate, not a price to underwrite.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The public record supports strategic relevance but does not support a current price or return target;
              obtain audited operating and capitalization evidence before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV016
          - type: callout
            title: Comparable downside is visible
            body: >-
              Public hydrogen-equipment comparables show losses and, in Guofu's case, a sharp market-cap decline; peer
              selection and downside sensitivity should therefore be explicit.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
