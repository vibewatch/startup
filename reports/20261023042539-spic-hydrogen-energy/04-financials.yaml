company:
  name: SPIC Hydrogen Energy
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a project- and equipment-led hydrogen business with meaningful deployment activity and a large historical financing event, but it does not disclose audited revenue, margin, cash, burn, or customer concentration. Industry evidence indicates that fuel-cell systems and hydrogen infrastructure remain major cost and utilization constraints, so underwriting should remain conditional on private financial diligence.
sections:
  - id: monetization-and-commercial-activity
    title: Monetization and commercial activity
    body: >-
      SPIC Hydrogen Energy appears to monetize hydrogen equipment and integrated deployments rather than a recurring software subscription. The strongest current operating signal is a reported delivery of 200 hydrogen-powered Dongfeng vehicles, with the vehicles serving city distribution, muck transportation, and bulk commodity transportation in Wuhan. The same report describes an ecosystem spanning fuel-cell systems, complete vehicles, refueling stations, hydrogen supply, and vehicle operation, which is consistent with project or systems revenue but does not establish the company’s recognized revenue, gross profit, or share of contract value. A 2022 funding report said the company made hydrogen production equipment, fuel-cell catalysts, carbon paper, and other core parts and planned seven production lines; those were company-reported plans, not audited outcomes. The commercial model therefore has several possible revenue streams, but public evidence does not separate product sales, project revenue, service revenue, or pass-through infrastructure economics.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Public industry evidence points to a capital-intensive cost base. A 2025 industry report states that the fuel-cell system represented about 53% of the cost of a 49-ton vehicle and hydrogen storage about 14%, together exceeding two-thirds of the vehicle cost base. It also reports average urban hydrogen prices of about CNY26.7 per kilogram and production costs declining from CNY30.2 to CNY27.7 per kilogram year over year. These are industry observations, not SPIC-specific realized pricing or margins, but they explain why project economics depend on utilization, hydrogen sourcing, equipment yield, warranty performance, and customer financing. A listed peer profile shows that public comparables can expose employee counts and market data while still not supplying SPIC’s private unit economics. The missing inputs are material: no public CAC, sales-cycle duration, gross margin by product, warranty reserve, service cost, working-capital cycle, or contribution margin was found in the assigned sources.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The latest retained financing evidence is historical rather than current. Yicai reported that SPIC Hydrogen Energy secured CNY4.5 billion in a December 2022 Series B, lifting the stated valuation to CNY13 billion, with State Power Investment holding 35%. The same report described planned production lines, a Beijing production-base investment of CNY980 million, and a target of more than CNY5 billion in 2025 revenue; these are dated company statements and should not be treated as current results. The assigned sources provide no current cash balance, debt schedule, project-finance obligations, burn rate, runway, or next-round trigger. A 2025 industry report showing weaker first-half vehicle production and sales is adverse context for financing dependency and demand risk, not proof of SPIC’s own loss or cash position. A listed peer profile confirms that fuel-cell engine systems, core components, and technical services form a relevant comparison set, but it does not supply SPIC-specific economics. The financial verdict is therefore research-more: strategic deployment and state-backed capital access may support scale, but revenue quality, margin path, and capital adequacy remain unproven until management provides audited statements, backlog aging, working-capital data, and capitalization terms.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: []
    figureRefs: []
