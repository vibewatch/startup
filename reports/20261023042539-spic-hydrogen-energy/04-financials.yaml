callouts:
  - calloutType: strength
    title: Demonstrated deployment channel
    body: >-
      A reported 200-vehicle delivery with Dongfeng provides evidence of an operating channel into heavy-duty transport, although it does not disclose SPIC’s economics.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Capital and margin opacity
    body: >-
      Current cash, burn, debt, revenue recognition, gross margin, warranty burden, and customer concentration remain unavailable in the assigned public record.
    claimRefs: [CI010, CI013, CI014, CI016]
  - calloutType: recommendation
    title: Underwrite only after private financial diligence
    body: >-
      Request audited statements, segment revenue, backlog aging, working-capital schedules, plant utilization, warranty reserves, debt terms, and capitalization documents before relying on the historical valuation or revenue target.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
