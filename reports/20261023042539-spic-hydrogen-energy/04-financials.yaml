  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-statements
      missingEvidence: "Audited income statements, balance sheets, cash-flow statements, and segment revenue through 2026."
      whyItMatters: "Without audited statements, revenue quality, margin path, liquidity, and accounting losses cannot be distinguished from plans or industry benchmarks."
      diligencePath: "Obtain management-approved audited financial statements and reconcile them to bank statements, tax filings, and segment ledgers."
      relatedQuestionRefs: [QI005, QI007]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: "Current cash, monthly burn, debt and project-finance obligations, restricted cash, and next-round trigger."
      whyItMatters: "The historical CNY4.5 billion financing does not establish current runway or funds available for expansion."
      diligencePath: "Request a current capitalization table, liquidity bridge, debt agreements, covenant schedule, and 24-month base/downside cash plan."
      relatedQuestionRefs: [QI007]
    - type: missing-source
      severity: material
      topic: revenue-recognition
      missingEvidence: "Product-level backlog, contract values, acceptance milestones, cancellations, warranty reserves, and customer concentration."
      whyItMatters: "A 200-vehicle delivery and planned production lines do not show recognized revenue or cash conversion."
      diligencePath: "Sample the largest customer contracts and trace orders from signed contract through shipment, acceptance, invoicing, collection, and warranty provision."
      relatedQuestionRefs: [QI001, QI002]
    - type: conflicting-data
      severity: material
      topic: demand-and-margins
      missingEvidence: "SPIC-specific utilization, realized hydrogen cost, system ASP, gross margin, and warranty claims alongside industry demand data."
      whyItMatters: "Peer losses and weaker industry volumes are adverse context but cannot be transferred mechanically to SPIC."
      diligencePath: "Request monthly fleet utilization, delivered hydrogen-cost records, system-level margin bridge, and warranty-claim cohort analysis."
      relatedQuestionRefs: [QI004, QI008]
