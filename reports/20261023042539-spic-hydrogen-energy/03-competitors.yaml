callouts:
  - calloutType: strength
    title: Technical credibility
    body: SPIC has a reported 500 Nm3/h PEM electrolyzer and more than 10,000 hours of accumulated operation in a megawatt-level demonstration, which is a stronger public signal than an untested product announcement.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Commercial commoditization
    body: Industry capacity, weak tender demand, falling electrolyzer prices, imported PEM components, and export barriers all challenge the assumption that technical scale converts into durable pricing power.
    claimRefs: [CP011, CP012, CP013, CP014]
  - calloutType: assumption
    title: Evidence boundary
    body: The retained sources do not provide a comparable SPIC peer set for pricing, customer retention, backlog, warranty cost, or market share; those fields remain diligence requests.
    claimRefs: [CP004, CP016]
