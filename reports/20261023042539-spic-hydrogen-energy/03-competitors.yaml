      - ["Infrastructure and integration", "Da'an project and hydrogen-safety testing are reported", "2025 sector study reports only 100 km of hydrogen pipelines", "Project execution and offtake access may dominate equipment choice"]
      - ["Trust and market access", "State Power Investment Corporation relationship is reported by Preqin", "EU auction rules and trade barriers may limit Chinese equipment access", "Geography and certification requirements must be underwritten by project"]
    notes: >-
      Values and qualitative comparisons retain their source periods and limitations.
      No cell should be read as an independently verified performance benchmark unless
      the cited source is explicitly independent of the vendor.
    claimRefs: [CP002, CP005, CP006, CP007, CP010, CP012]
  - id: TP003
    title: Moat, displacement, and evidence status
    columns: [Dimension, Positive signal for SPIC, Disconfirming or displacement signal, Evidence status]
    rows:
      - ["Technology", "PEM electrolyzer scale and reported operating hours", "Imported PEM components and technology gaps versus EU are reported", "Partial"]
      - ["Cost", "System engineering and integrated demonstration capability", "Falling alkaline prices and margin compression", "Supported"]
      - ["Demand", "Commercial hydrogen vehicle and green-ammonia use cases exist", "Electrolyzer tenders far below manufacturing capacity", "Supported"]
      - ["Distribution", "State-enterprise relationship and project integration", "Export barriers and infrastructure bottlenecks", "Partial"]
      - ["Switching costs", "Safety testing and integrated systems could support qualification stickiness", "No retained customer, warranty, or contract evidence", "Gap"]
      - ["Scale", "China has a large hydrogen equipment ecosystem", "National vehicle production and sales declined about 47% year over year in H1 2025", "Supported with sector caveat"]
      - ["Pricing power", "No positive pricing evidence identified", "Oversupply and falling prices directly challenge it", "Gap / adverse"]
    notes: >-
      This is an evidence-status matrix, not a scored moat model. “Partial” and “Gap”
      are intentional where the public record does not establish a durable advantage.
    claimRefs: [CP011, CP012, CP013, CP014, CP015]
