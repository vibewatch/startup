company:
  name: SPIC Hydrogen Energy
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports strategic relevance and technical progress, but not a current committee-grade price. The last reported private mark is historical, secondary-market pricing is indicative rather than a transaction benchmark, and public comparables show how quickly hydrogen-equipment valuations can compress.
sections:
  - id: market-and-comparables
    title: Market evidence and comparable signals
    body: >-
      The valuation case starts with a market that is strategically important but still
      commercially uneven. CarNewsChina reports 5,548 hydrogen fuel-cell vehicles produced
      and 5,405 sold in China during 2024, while first-half 2025 production and sales were
      1,364 and 1,373 units, respectively, roughly 47% below the prior-year period. The same
      report describes a fleet of approximately 30,000 vehicles, more than 40 refueling
      stations supporting over 200 vehicles on freight corridors, and a cost structure in
      which the fuel-cell system and hydrogen storage together represent more than two-thirds
      of a 49-ton vehicle's cost. That is a plausible long-run equipment opportunity, but the
      near-term adoption data do not support a high-growth revenue multiple without company
      backlog, gross-margin, warranty, and cancellation evidence. The comparison set reinforces
      the need for discipline: Yahoo Finance shows SinoHytec at CNY4.142B market capitalization
      with CNY260.55M trailing revenue and a CNY611.97M net loss, while Marketcapwatch reports
      Guofu at $50.36M market capitalization, $50.23M trailing revenue, and a $60.9M net loss.
      These are not directly comparable valuation multiples for SPIC, but they are useful
      downside signals for an equipment business with incomplete public economics.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007]
    tableRefs: [TV001]
  - id: financing-and-price-discovery
    title: Financing history and price discovery
    body: >-
      The strongest company-specific valuation anchor remains historical. Sina Finance
      reports that SPIC Hydrogen Energy's December 2022 Series B post-money valuation was
      CNY13B, and that a later Series C was announced without a disclosed financing amount.
      The same report describes a 2025 tender for IPO sponsor and underwriting services, but
      also notes that an earlier 2023-to-2025 listing timetable had already been delayed.
      That combination is evidence of financing ambition, not evidence of a completed IPO or
      a current clearing price. Clarity lists a $0.66 model-derived indicative price and
      explicitly says the company is privately held, has no continuously quoted public price,
      and that not all matches result in completed transactions. The figure therefore cannot
      be converted into equity value without share class, share count, currency, transaction
      date, and transfer-terms evidence. The appropriate stance is to treat CNY13B as a
      historical reference point and the secondary indication as a non-binding liquidity
      signal, not as a refreshed mark.
    claimRefs: [CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: decision-and-scenarios
    title: Decision, scenarios, and diligence
    body: >-
      The investment decision is research-more rather than buy or sell. The upside thesis is
      that SPIC can convert state-backed industrial access, recognized PEM-electrolyzer
      capability, and localized component know-how into repeatable commercial deployments.
      The anti-thesis is that hydrogen mobility remains below earlier deployment ambitions,
      public-company comparables are loss-making or sharply de-rated, and SPIC's current
      revenue, cash, backlog, cap table, liquidation preferences, and IPO range are not
      publicly evidenced in this pool. A precise bull/base/bear valuation range would imply
      unsupported revenue, margin, dilution, and exit assumptions, so the scenarios retain
      qualitative valuation logic and explicit evidence gates instead of false precision.
      A price-sensitive re-underwriting should begin only after audited financials, the
      complete capitalization table, the latest financing documents, product-level backlog,
      customer concentration, warranty exposure, and an executable liquidity path are
      obtained. Until then, the historical private mark is a ceiling to interrogate, not a
      price to underwrite.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a new entry price until current financial and cap-table evidence is provided."]
      - [Confidence, "Medium", "The direction is supported by multiple market and financing signals, but company-level operating data are incomplete."]
      - [Risk rating, "High", "Hydrogen adoption, loss-making public comparables, financing opacity, and delayed listing evidence create material downside uncertainty."]
      - [Valuation stance, "Stretched / unpriceable", "CNY13B is a December 2022 private mark; the current public record does not establish a fair value."]
      - [Decision implication, "Track and re-underwrite", "Require audited economics, terms, and price discovery before committing capital."]
    notes: "Public-company figures are directional benchmarks rather than directly comparable SPIC multiples; the private and secondary indications have different dates, instruments, and evidentiary quality."
    claimRefs: [CV008, CV011, CV012, CV013, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Industrial scale thesis, "National Energy Administration first-unit selection and Qingyong PEM capacity disclosures", "Independent operating data showing repeat orders, utilization, and margins."]
      - [Market expansion thesis, "China hydrogen fleet and infrastructure are established but still below earlier scale ambitions", "Sustained year-over-year volume growth plus disclosed contracted backlog."]
      - [Price-discovery anti-thesis, "CNY13B historical mark and a $0.66 model-derived indication are not a current clearing price", "A priced financing, verified secondary transaction, or public filing with share-count and terms."]
      - [Downside anti-thesis, "SinoHytec and Guofu public comparables show losses or severe market-cap compression", "Audited SPIC profitability, durable gross margin, and a valuation below defensible peer-adjusted downside."]
    notes: "The arguments separate company-specific evidence from market and public-comparable signals; no row treats a competitor's market cap as SPIC's value."
    claimRefs: [CV006, CV007, CV008, CV011, CV012, CV013, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Trigger or diligence gate]
    rows:
      - [Bull, "Commercial electrolyzer and fuel-cell deployments scale; audited revenue, margin, and backlog become available.", "Potential upside exists, but no defensible numeric range can be calculated from the assigned evidence.", "Low-to-medium until current financing and operating proof is supplied.", "Signed backlog, repeat customer orders, unit economics, and a verified IPO or financing price."]
      - [Base, "Strategic relevance persists but adoption and infrastructure scale gradually; private status continues.", "Track the historical CNY13B mark without treating it as current fair value.", "Medium.", "Quarterly operating disclosure, cash runway, cap-table terms, and evidence of conversion from pilots to paid deployments."]
      - [Bear, "Hydrogen deployment remains below targets, public peers remain loss-making or compress further, and listing timing slips.", "Downside risk is material; a numeric loss case would be false precision without share and preference terms.", "Medium-to-high.", "Order cancellations, worsening losses, funding dependence, or another delayed listing milestone."]
      - [Unresolved, "Revenue, gross margin, cash burn, dilution, preferences, and current price are not publicly evidenced here.", "No investment return or valuation range should be issued.", "High uncertainty.", "Obtain audited statements, cap table, financing agreements, and verified transaction records."]
    notes: "Scenario values are intentionally qualitative because the assigned evidence does not provide a current share count, financing price, audited revenue base, margin, dilution, or preference stack."
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Technical and market evidence supports tracking, while valuation and liquidity gaps prevent a current buy decision.
    data:
      nodes:
        - {id: scale, label: "Market scale", detail: "China fleet and infrastructure are real but adoption remains uneven"}
        - {id: proof, label: "Technical proof", detail: "Qingyong PEM equipment has official first-unit recognition and reported operating history"}
        - {id: risk, label: "Downside risks", detail: "Loss-making or compressed public comparables and delayed commercialization signals"}
        - {id: price, label: "Price evidence", detail: "Historical CNY13B mark and non-binding $0.66 indication do not establish current fair value"}
        - {id: diligence, label: "Diligence gate", detail: "Audited economics, backlog, cap table, preferences, and verified transactions"}
        - {id: recommendation, label: "Recommendation", detail: "Research-more / track; do not underwrite a new entry price"}
      edges:
        - {from: scale, to: proof}
        - {from: proof, to: risk}
        - {from: risk, to: price}
        - {from: price, to: diligence}
        - {from: diligence, to: recommendation}
    claimRefs: [CV001, CV006, CV008, CV011, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: The public record supports strategic relevance but does not support a current price or return target; obtain audited operating and capitalization evidence before underwriting.
    claimRefs: [CV008, CV009, CV011, CV016]
  - calloutType: risk
    title: Comparable downside is visible
    body: Public hydrogen-equipment comparables show losses and, in Guofu's case, a sharp market-cap decline; peer selection and downside sensitivity should therefore be explicit.
    claimRefs: [CV012, CV013, CV014]
