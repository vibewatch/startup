chapter:
  number: 6
  title: Customers
  summary: Public evidence shows adoption concentrated in policy-supported commercial transport and industrial demonstration settings, with named deployments and purchase intentions but limited disclosure of recurring revenue, retention, or customer concentration. The evidence is strongest for delivered vehicles, operating corridors, and ecosystem partners; production status and economic durability remain incompletely disclosed.
sections:
  - id: customer-segments-and-buyers
    title: Segments, buyers, and operating use cases
    body: >-
      The public customer record is organized around fleet and industrial use cases rather than a
      broad self-serve customer base. SPIC's disclosed hydrogen activity includes buses, trucks,
      ships, and drones, while a government-supervision publication describes more than a thousand
      products equipped with the Hydrogen Forerunner battery and a transportation network covering
      more than 20,000 kilometers. The named commercial buyers and users in the retained evidence
      are fleet operators, vehicle manufacturers, municipal demonstration programs, and logistics
      operators. This points to a multi-party sale: the technology supplier sells into an OEM or
      project, while the operating customer bears utilization and hydrogen-cost risk. The
      230-vehicle logistics delivery reported by Energy界 identifies Yutong as the vehicle
      manufacturer and Hydrogen Power Technology as the operator, and places the subsequent
      intended purchase of 260 vehicles in a strategic cooperation context rather than completed
      revenue. The evidence therefore supports customer-segment traction, not a verified customer
      count, recurring revenue base, or independent proof of end-user economics.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory-and-durability
    title: Adoption trajectory and durability
    body: >-
      Adoption indicators show movement from demonstration toward larger commercial fleets, but
      they are not a substitute for cohort or retention data. SASAC reports that more than 1,000
      SPIC products using the Hydrogen Forerunner battery had been delivered and that 30,000
      battery-swapping trucks, mining trucks, and construction machines were in operation across
      the broader SPIC network, alongside more than 830 charging and swapping stations. The
      customer-specific 230-vehicle logistics delivery is a named batch deployment, and the
      announcement says the vehicles were intended for logistics and cold-chain use in Henan and
      Guangdong. Industry-wide evidence gives context for the addressable operating environment:
      the 2025 vehicle report cited approximately 30,000 hydrogen vehicles nationally, but also
      reported first-half 2025 production and sales below the prior year. These figures should not
      be attributed to SPIC Hydrogen Energy without a company-specific denominator. No retained
      source provides NRR, GRR, churn, renewal rates, contract length, repeat-purchase cohorts, or
      audited utilization for this company, so durability remains an open diligence question.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-expansion-risk
    title: Named proof, expansion, and concentration risk
    body: >-
      Named proof is credible where the source describes a delivered vehicle batch, an identified
      OEM relationship, a stated operating customer, or a government-supported demonstration, but
      most evidence remains company-issued or ecosystem-reported. The 230-vehicle delivery is
      stronger than a logo because it identifies the operator, OEM, vehicle quantity, and intended
      locations; however, the follow-on 260 vehicles are only a purchase intention. The passenger
      vehicle strategy is also forward-looking: the retained announcement says the Hydrogen
      Forerunner-S series would first be demonstrated on a Hongqi H5 and expected 10,000 vehicles
      over five years, which is a plan rather than proof of production deployment. Customer
      concentration cannot be quantified from public evidence. Yutong, FAW/Hongqi, municipal
      hydrogen-city programs, and logistics operators appear strategically important, but the
      sources do not disclose contract values, share of revenue, backlog conversion, cancellations,
      or whether any named relationship is exclusive. The investment implication is that
      customer validation is real but still exposed to subsidy, infrastructure, and procurement
      timing.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
