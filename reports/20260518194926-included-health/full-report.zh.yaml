      - - Quantum Health
        - 在现有承运商之上叠加导航层，或更深的临床整合层级
        - 服务方导流、早期干预和理赔节省
        - 低
        - 无需全面替换计划即可接入，对谨慎买方有吸引力
      - - Rightway
        - 透明 PBM 管理费加医疗导航
        - 100% 回扣穿透、支出超过估算则退款、药房导流
        - 中
        - 相比多数导航对手，受托责任和药品支出经济性更清晰
      - - Teladoc
        - 通过 IBX 等渠道销售的健康计划或雇主虚拟医疗组合包
        - 以较低增量 PCPM 加购虚拟医疗和 Primary360 访问
        - 高
