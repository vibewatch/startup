      - number: '3.4'
        title: 差异化、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Included Health 仍有一套连贯的战略位置：它把导航、福利与理赔支持、虚拟护理、专科护理，以及围绕 LGBTQ+ 支持的公开包容性叙事组合在一起，后者很少被竞争者放在前台。这些资产让它比
              Quantum 或 HealthJoy 更有临床深度，也比 Transcarent、Teladoc 或 Firefly 有更明确的包容性差异。但护城河并非绝对。Transcarent
              如今是广度最接近的对手；Quantum 正在证明智能体 AI 和医生导流不再独特；Rightway 能用硬 PBM 经济性赢下 CFO；Teladoc 能以可见渠道价格打包虚拟护理；Firefly
              则能吸引想在计划层面直接控制利用率的雇主。切换成本是真实存在的，因为这些产品连接数据馈送、护理团队和现有供应商生态；但成本没有高到买方不能在续约时重新考虑。Included Health 的长期问题在于，它能否在
              AI 辅助导航和临床整合替代方案压缩类别优势之前，持续把广度和包容性转化为可衡量结果。
