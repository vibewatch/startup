chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、组建路径与产品范围
        blocks:
          - type: paragraph
            body: >-
              今天的 Included Health 把自己定位为一家个性化、一站式医疗公司，组合了导航、权益倡导和护理交付。当前实体并不是某一家旧创业公司的简单改名：它先在 2021 年由 Grand Rounds 和
              Doctor On Demand 合并搭成，随后又迅速扩张，同意收购原来的 Included Health——一个面向 LGBTQ+ 人群和其他服务不足群体的礼宾式平台。2021 年 10
              月的品牌重塑，把这个被收购的名字变成了合并后公司的伞形身份。


              这段历史重要，因为它解释了为什么该平台比典型医疗导航供应商更宽。官方材料如今围绕紧急护理、初级保健、行为健康、专科护理和权益倡导来定位 Included
              Health，而不是围绕单一虚拟护理流程。解决方案页面把公司的运营理念概括为
              “AI+EQ”，明确称人工智能是增强人的临床和导航体验，而不是替代人。从包容性导航走向更广泛的整合护理，这条主线是公司今天解释自身身份的核心。
