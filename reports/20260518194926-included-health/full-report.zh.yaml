  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方要求
        blocks:
          - type: paragraph
            body: >-
              Included Health 所在类别已经从孤立的数字健康点状方案，转向雇主对单一福利和护理入口的需求。Business Group on Health、Mercer、UnitedHealthcare 和
              Cigna 都在描述同一个 2026
              年宏观背景：买方面临高企的医疗和药品趋势，福利团队人手紧，雇主越来越愿意用导流、替代性计划和更强指令性的导航来控制成本。这个背景重要，因为买方不再只是问供应商能否回答问题；买方在问供应商能否减少碎片化、引导会员走向高价值医生，并证明经济影响。在这样的市场里，Included
              Health 最相关的比较对象不是所有虚拟护理供应商，而是那一小组试图横跨导航、临床指导和成本控制来拥有员工体验的平台，以及能靠更深药房或计划设计杠杆赢得同一预算的相邻替代方案。
