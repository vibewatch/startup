  - id: TP001
    title: 竞争对手画像表
    columns:
      - 平台
      - 类别
      - 规模 / 状态
      - 主要买方
      - 相比 Included Health 的关键强项
      - 相比 Included Health 的关键短板
    rows:
      - - Included Health
        - 整合式导航 + 临床交付
        - '>4% 趋势降幅主张；4,000+ 名专科医生；专科诊所；LGBTQ+ 支持'
        - 大型雇主和健康计划
        - 一站式导航、权益支持、虚拟医疗、专科和包容性护理覆盖面很宽
        - 当前公开定价和最新覆盖范围披露有限
      - - Transcarent
        - 整合式导航 + 医疗服务 + 药房
        - 收购 Accolade 后拥有 20M+ 会员、1,700+ 雇主 / 计划客户
        - 自保雇主和健康计划
        - 覆盖宽度最接近；AI 和药房叙事强
        - 公开层面对包容性护理和文化胜任支持的差异化较弱
      - - Quantum Health
        - 纯导航老牌厂商
        - 三层导航套件；宣称第 1 年理赔节省 6%、第 3 年节省 10%
        - 继续使用现有保险承运商的自保雇主
        - 导航可信度、服务方导流和早期干预叙事
        - 自有临床交付少于 Included Health
      - - Rightway
        - 导航 + 透明 PBM
        - 2M 导航会员；2M PBM 会员；30+ Fortune 500 客户
        - 优先控制药房成本趋势的雇主
        - 借助回扣穿透和药房节省，经济性故事更硬
        - 专科和虚拟医疗覆盖更窄
      - - HealthJoy
        - 福利操作系统 / 导航叠加层
        - 1,800+ 雇主；1M+ 会员
        - 管理碎片化供应商组合的雇主
        - 激活和点解决方案编排叙事强
        - 自有初级保健、专科或心理健康交付证据少
      - - Teladoc + BetterHelp
        - 虚拟医疗规模平台
        - 2025 年收入 $2.53B；2026 年美国 Integrated Care 会员展望 97-100M
        - 雇主、健康计划和渠道伙伴
        - 公开虚拟医疗规模最大，渠道打包清晰可见
        - 导航和理赔权益支持不是核心差异点
      - - Firefly Health
        - 临床整合健康计划 / 虚拟 PCP 替代方案
        - 美国 82.7% 人口距合作接入点 15 英里内；2,000+ 诊所
        - 愿意接受替代计划设计的雇主
        - 计划设计控制和初级保健责任更强
        - 导航和福利管理叙事窄得多
      - - Accolade legacy
        - 权益支持 + 虚拟初级保健 + 专家意见
        - 2025 年并入 Transcarent 后，独立公开竞品身份终结
        - Accolade 原有雇主和计划买方
        - 在权益支持和二次意见领域有历史品牌资产
        - 2026 年不再独立
    notes: 各行强调公开且有来源支撑的规模标记和战略位置；私营公司合同定价以及部分最新会员数仍未披露。
    enumerationScope:
