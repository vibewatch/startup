      - number: '1.4'
        title: AI 路线图与产品速度
        blocks:
          - type: paragraph
            body: >-
              Included Health 在 2025–2026 年最醒目的产品叙事，是试图把导航做成一个数据丰富、医生支撑的操作系统。2026 年 1 月的替代性计划设计，让公司更靠近以 PCP
              为中心的福利架构，叠加透明定价和 AI 驱动的互动。一个月前，Included Health 已把 Dot 扩展成医生在环助手，调用病史、理赔和福利数据；管理层称 Dot 已在大型雇主部署中处理超过 100 亿
              token。2026 年 5 月，公司又在这套栈上叠加 Provider Connect，把它作为高质量、网内护理的路由工具。


              这些发布大多仍是公司口径，但并不是孤立发生。Google Research 在 2026 年 2 月宣布与 Included Health 开展一项全国随机研究，评估对话式 AI
              在真实虚拟护理流程中的效果，把验证从模拟和回溯数据推进到现场护理场景。这还不能验证 Included Health
              的产品指标，但它是有意义的外部证据：公司足够活跃、技术可信度也足够高，能支撑在真实护理环境中的前瞻性研究。
