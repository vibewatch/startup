      - number: '3.3'
        title: 虚拟护理与计划设计替代方案
        blocks:
          - type: paragraph
            body: >-
              Teladoc、BetterHelp 和 Firefly 不是纯导航同业，但在同一个雇主预算讨论里是可信替代方案，因为它们覆盖了同一待办任务中的重要部分。Teladoc Primary360
              提供成熟的虚拟初级保健服务，包含护士、护理协调员、专家意见，以及通过 Independence Blue Cross 发布的渠道价格示例。BetterHelp
              增加了消费者心理健康触达，虽然它更多是治疗可及性的替代品，而不是福利导航平台。Firefly
              是另一类威胁：它不是搭建宽泛点状方案市场，而是主张雇主应通过围绕初级保健、专科导流和风险共担构建的临床整合健康计划，来解决成本和可及性。这些替代方案重要，因为它们可以在单一维度上击败 Included
              Health——虚拟护理规模、包装简单度或计划设计控制——即便不能复制 Included Health 在导航、理赔帮助、专科支持和包容性护理上的完整组合。
