      - number: '8.2'
        title: 可比参照：当前上市可比和并购给出的区间低得多，但仍可用
        blocks:
          - type: paragraph
            body: >-
              导航领域最相关的先例已经不是 2021 年泡沫化增长轮，而是 2025 年 Transcarent-Accolade 交易。Transcarent 以 $621M、每股 $7.03 收购
              Accolade，较交易前收盘价溢价约 110%。但即便有这个溢价，交易隐含倍数也只有 Accolade 最近一个财年收入的约
              1.5x。这是本章最重要的反向参照：一个有上市公司历史、客户覆盖广的规模化导航资产，最终仍以温和倍数成交。Stat 提到公开市场已经惩罚 Accolade
              这类公司，也强化了这一点：这是压缩周期里的交易，不是高溢价增长基准。


              上市可比集合会拉宽区间，但不会抹掉这条纪律。成熟的上市虚拟医疗可比 Teladoc 尽管有数十亿美元收入，EV / sales 仍在约 0.57x，因为增长和盈利能力仍承压。Omada
              这个更健康、规模更小的上市慢病管理平台，EV / revenue 更接近 2.8x。Hinge 是数字医疗里最好的增长可比，约 6x EV / revenue 才是真正上限，但它靠 47%
              增长、高利润率、现金创造和清晰的上市公司可预测性拿到这个区间。因此 Fierce 的 HLTH25 观察很关键：IPO 窗口重新打开，但只给财务纪律可见的公司。若 Included
              的整合模型确实更强，它可能配得上相对 Accolade 的溢价；但在没有披露数字之前，不能默认把它推到 Hinge 区间。
