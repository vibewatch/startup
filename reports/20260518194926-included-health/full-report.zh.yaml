      - number: '2.2'
        title: 规模测算视角与市场结构
        blocks:
          - type: paragraph
            body: >-
              没有公开分析机构能干净地测算一个“仅雇主、整合导航 + 虚拟护理 + 专科支持”的市场，所以正确方法是三角验证。最干净、可审计的视角是医疗导航平台类别：Grand View 把 2023 年全球收入放在
              $10.08 billion，Mordor 把 2025 年收入放在 $11.40 billion，两家公司都暗示中个位数到低双位数增长。Grand View 还称 North America
              是最大的区域利润池，大型企业主导终端使用；Mordor 则称雇主占 2025 年终端用户支出的 45.63%。这些信息本身无法给出干净的 Included Health SAM，但说明雇主买方并非该类别边缘角色。


              第二个视角是相邻的美国虚拟护理市场。Grand View 估算该市场 2024 年规模为 $8.83 billion，到 2030 年 CAGR 为
              32.35%，驱动因素包括初级保健和专科短缺、慢病管理以及更广泛的数字化采用。第三个视角是买方广度：PHTI 显示，采购方已经覆盖一组很宽的病症，而不是孤立工具。几个视角指向同一个方向：Included
              Health 不是在一个很小的福利利基里竞争，但也没有一个诚实的公开 TAM 数字只捕捉其合格雇主切片。市场很大、变化很快、结构上彼此重叠，因此规模应呈现为有边界的视角，而不是一个英雄式 TAM 主张。
