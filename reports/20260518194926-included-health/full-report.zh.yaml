  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 运营强度和私人公司状态支持继续关注，但估值不透明让建议仍停在 research-more 区间。
    data:
      nodes:
        - id: history
          label: 2021 年锚点：数十亿美元合并，但官方条款未披露
          type: input
        - id: operations
          label: 2025-2026 年证据：盈利、产品发布、CalPERS 证明、领导层持续补强
          type: process
        - id: profiles
          label: 资料仍显示其为私人公司，最新交易是二级私募，并具备独角兽规模身份
          type: process
        - id: comps
          label: 当前可比区间从被压缩的导航交易延伸到 Hinge 式高溢价增长
          type: process
        - id: opacity
          label: 缺少实时收入、利润率和股权结构数据，精确估值被卡住
          type: decision
        - id: recommendation
          label: 建议：Research-More；尽调完成前，将旧周期定价视为偏高
          type: output
      edges:
        - from: history
          to: operations
          label: 历史规模只有在业务仍能执行时才有意义
        - from: operations
          to: profiles
          label: 当前执行证明，它在私人市场仍值得跟踪
        - from: profiles
          to: comps
          label: 私人公司状态迫使投资判断依赖可比公司
        - from: comps
          to: opacity
          label: 没有实时分母，可比区间无法锚定今天价格
        - from: opacity
          to: recommendation
          label: 不透明让立场维持在 research-more
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV014
      - CV031
      - CV034
      - CV035
      - CV042
    approximationNotes: null
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 当前可比和先例倍数给出很宽区间；低端是真实风险，高端则需要顶级执行。
    data:
      items:
        - label: Teladoc EV / 销售额倍数
          value: 0.57
        - label: Accolade 收购价 / 收入倍数
          value: 1.5
        - label: Omada EV / 收入倍数
          value: 2.8
        - label: 基准情景测算上限
          value: 4
        - label: Hinge EV / 收入倍数
          value: 6
    claimRefs:
      - CV019
      - CV024
      - CV027
      - CV030
      - CV031
      - CV038
      - CV039
    approximationNotes: 这些倍数已取整，用来展示估值敏感性，而不是制造虚假的精确感。基准情景上限只是分析筛选线，不是市场已经打出的实际价格。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 示意性 EV 区间说明，争论核心不是给出一个当前估值点位，而是判断 Included 落在哪档收入和质量状态。
    data:
      items:
        - label: 悲观情景：收入约 $400M，市场按倍数压缩后的导航平台给 Included 定价
          low: 400
          mid: 600
          high: 800
          unit: $M
        - label: 基准情景：收入约 $500M，盈利信号属实，但披露仍薄
          low: 1250
          mid: 1600
          high: 2000
          unit: $M
        - label: 乐观情景：收入约 $600M，且 Hinge 式质量证据浮现
          low: 3000
          mid: 3300
          high: 3600
          unit: $M
        - label: 尽调收口前的保守入场门槛
          low: 1200
          mid: 1600
          high: 2000
          unit: $M
    claimRefs:
      - CV034
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
    approximationNotes: 由于 Included 未公开当前收入规模，这些区间都依赖假设收入锚点。它们是投资测算情景，不是本文主张的估值点位。
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 经营信号得分高于估值透明度，因此建议仍保持谨慎。
    data:
      items:
        - label: 经营连续性
          value: 7/10
          unit: score
          trend: up
        - label: 盈利信号
          value: 7/10
          unit: score
          trend: up
        - label: 客户验证耐久度
          value: 6/10
          unit: score
          trend: stable
        - label: 上市可比公司支撑
          value: 5/10
          unit: score
          trend: stable
        - label: 价格发现质量
          value: 2/10
          unit: score
          trend: down
        - label: 股权结构表可见度
          value: 3/10
          unit: score
          trend: unknown
        - label: 风险调整后入场吸引力
          value: 4/10
          unit: score
          trend: down
    claimRefs:
      - CV035
      - CV036
      - CV041
      - CV042
      - CV043
      - CV044
    approximationNotes: 这些分数是 IC 风格的 10 分制判断，依据已保留证据给出；它们只概括本案，不新增事实。
