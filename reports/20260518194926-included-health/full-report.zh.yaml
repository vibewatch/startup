      - number: '7.4'
        title: 剩余风险视角和实用否决标准
        blocks:
          - type: paragraph
            body: >-
              顶层风险判断是，Included Health
              大概率已经在大型雇主和医保计划中找到真实产品市场契合，但剩余风险仍高，因为公开证据更强的是客户轶事，而不是可用于承保的披露。公司在一个明显惩罚碎片化方案的市场中搭出整合平台，值得肯定；它补强财务和法务领导力、拿下
              CalPERS 这类账户，并选择临床医生在环设计而不是纯自动化噱头，也值得认可。这些都是有意义的缓释因素。


              但它们不能结案。谨慎投资人仍应把五件事视为投资逻辑破裂区：企业续约再次滑坡，无法给出可信集中度数据，远程医疗政策回滚或收紧，涉及敏感理赔和福利数据的隐私或 AI
              安全事件，或继续拿不出能脱离公司挑选案例的独立结果证据。如果尽调发现头部账户承载了过多收入基础、远程开方暴露重要，或 AI 治理比营销暗示得更薄，当前故事会脆弱得多。因此，下一轮尽调应少看一条新的漂亮 ROI
              主张，多看集中度、政策依赖、事故历史，以及真正独立的临床和财务持久性证据。
