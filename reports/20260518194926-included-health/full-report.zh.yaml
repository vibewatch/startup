  - id: TM001
    title: 市场定义表 — Included Health 可触达范围
    columns:
      - 细分 / 类别
      - Included 覆盖的支出或工作流
      - 排除的支出或工作流
      - 买方 / 付款方
      - 与 Included Health 的相关性
    rows:
      - - 雇主导航和权益倡导
        - 福利导航、理赔倡导、导流、护理协调
        - 嵌在全额保险计划中的保险公司呼叫中心服务，且买方没有单独选择权
        - CHRO、福利负责人、自保雇主、医保计划
        - 核心市场，因为 Included Health 把导航和权益倡导作为雇主或支付方解决方案销售
      - - 虚拟初级和急诊护理
        - 雇主付费虚拟初级保健、急诊护理、分诊、非工作时间访问
        - 无关联的消费者远程医疗订阅，以及仅面向 Medicare 的远程医疗项目
        - 雇主、支付方、雇主福利设计内的会员
        - 核心邻近市场，因为雇主越来越多地为医保计划网之外的虚拟初级保健签约
      - - 行为健康和韧性
        - 虚拟行为健康、心理健康分诊、韧性工具、对同等保障敏感的可及性支持
        - 没有雇主合同或没有临床工作流整合的独立健康管理应用
        - 雇主、支付方、员工和家属
        - 核心邻近市场，因为心理健康可及性缺口和使用增长是持续存在的雇主痛点
      - - 专科支持和专家意见
        - 专家医学意见、癌症支持、代谢护理、女性健康、专科导航、卓越中心导流
        - 雇主福利引导之外的医院收入，或仅面向消费者的专科远程医疗
        - 雇主、支付方、员工和家属
        - 关键邻近市场，因为灾难性理赔和专科碎片化主导买方痛点
      - - 排除的渠道范围
        - None
        - Medicare 优先导航、Medicaid 护理管理、小型全额保险产品、消费者直接付费护理
        - 政府支付方或消费者
        - 排除原因是 Included Health 披露的雇主定位集中在雇主和医保计划，而不是公共项目或直接付费渠道
