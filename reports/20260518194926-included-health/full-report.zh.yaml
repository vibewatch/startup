      - number: '6.5'
        title: 持久性是公开证据中最弱的一环，因为留存、集中度和投诉只露出一部分
        blocks:
          - type: paragraph
            body: >-
              Included Health 确实有公开证据显示会员可能喜欢这项服务：公司自己的用户评价页给出 4.9/5 分，多个客户故事也强调摩擦减少、指引更好或可及性改善。但持久性档案比获客档案薄得多。已审阅来源没有披露
              NRR、GRR、客户流失、续约队列或头部客户集中度。即便是 CalPERS 和 Walmart 这类最大样本，也更多证明相关性，而不是证明留存。原因很直接：导航平台成败取决于使用率、服务质量和年度续约信心。


              反向证据也真实存在，尽管并不完美。一个存档的 Trustpilot 页面显示，2025 年底评分为
              1.8/5，并包含关于转诊、账单、故障和会员服务响应的投诉。这些评论有自选择偏差，不能当作企业客户流失数据，但它们确实说明，运营模型可能带来会员摩擦风险。底线是，Included Health
              有可信的覆盖广度，也有可信的买方证明；但续约持久性和客户集中度的公开数据仍是尽调门槛，而非已被证明的事实。
