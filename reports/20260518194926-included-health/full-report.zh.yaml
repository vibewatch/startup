  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已披露锚点与当前状态：可信的私营规模，但没有新的价格发现
        blocks:
          - type: paragraph
            body: >-
              评估 Included Health 估值，最干净的起点是公开证据没有说什么。2021 年官方合并材料确认 Grand Rounds 与 Doctor On Demand
              合并，但未披露交易条款，因此确切合并估值不是保留来源集中的硬公开事实。可访问的 2021 年报道仍把方向讲清楚：这笔合并被视为一个数十亿美元级数字医疗组合，同时期报道把独立业务估值标在 Grand Rounds
              约 $1.34B、Doctor On Demand 约 $0.82B-$0.88B。换句话说，投资人应把经常被重复的 2021 年中个位数十亿美元故事视为高水位叙事，而不是已披露、当前可用于承保的估值标记。


              更当前、更有用的是 2025-2026 年经营信号栈。Included 告诉 Business Insider，公司仍是私营、已盈利、双位数增长，约有 300 个雇主和医保计划客户，并称在搁置 2022 年
              IPO 后不需要融资。PitchBook 仍显示公司为私营，最新交易类型为二级私募；Crunchbase 存档资料仍列出独角兽状态，最后融资类型为 Series E。官方公司公告、在线的 CalPERS 微站以及
              Google Research 合作说明都指向同一结论：Included 仍在运营，仍在发产品，也仍与大型企业买方相关。这个组合支持“仍为私营、可能是独角兽规模”的状态；它不支持编造一个 2026 年实时估值。
