        - 驱动
        - 当前 / 2026
        - 提高买方对导航、导流和更好福利经济性的紧迫感
        - 验证买方节省有多少来自计划设计，而非供应商绩效
      - - GLP-1 使用率与药房成本压力
        - 驱动
        - 当前 / 2026-2027
        - 推动买方转向整合式导航、预授权支持，以及更好的肥胖或代谢路径
        - 要求说明 Included Health 针对肥胖和药房经济性的具体做法
