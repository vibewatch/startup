  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和定价仍由企业销售主导，且大多不透明
        blocks:
          - type: paragraph
            body: >-
              Included Health 当前商业模式明显是
              B2B，尽管会员通过消费级应用体验它。在雇主和健康计划页面上，公司把自己呈现为由组织采购的覆盖福利，而不是宽泛的自助订阅。产品把导航、权益倡导、虚拟初级保健、行为健康、专科护理和行政支持打包进同一份合同；这在财务上重要，因为它把公司推向更大的企业交易、多利益相关方实施和续约驱动收入，而不是单纯交易型远程医疗。


              公开定价仍很薄。面向雇主的材料强调演示、整合和结果，但没有公布雇主合同本身的标价。最清晰的公开定价信号是 2026
              年替代性计划设计：它对会员采用先共付结构，并明确被包装为一种让成本更可预测、同时改善初级保健主导路由的方式。这让会员端价格体验更透明，却没有揭示 Included Health
              自身实际合同定价、抽成率或利润率捕获。商业结论是，Included Health
              看起来通过定制企业合同、支付方整合和绩效挂钩安排变现，但买方仍需要管理层数据，才能理解这部分收入中有多少是经常性按人按月（PMPM）式平台收入，有多少是更偶发的护理交付经济性。
