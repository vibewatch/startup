      - number: '4.4'
        title: 公开 ROI 证据更支持价值主张，而不是证明供应商经济性
        blocks:
          - type: paragraph
            body: >-
              Included Health 对客户价值的公开论证强于对自身供应商单位经济性的论证。CalPERS 合同是最清晰的采购方层面证明：约 400,000 名 PPO 会员在范围内，Included Health 和
              Blue Shield 在五年内承担 $464 million 风险，医疗趋势目标从 2025 年的 5.5% 逐步降至 2029 年的 3.0%。这个结构重要，因为它显示 Included Health
              不再只销售点状导航方案；它正在参与大型、多年期安排，衡量出来的成本改善是合同经济性的核心。


              公司也有明确的客户证明材料。Walmart 多年虚拟初级保健部署报告，总护理成本下降 11%，糖尿病用户 HbA1c 平均下降 24%，高血压用户血压下降 14%。Provider Connect
              增加了另一个公司声称的证明点：每次转诊节省 9%，与最高四分位医生的连接增加 92%。Healthy Days 和 Specialty Care Clinic 的发布显示，Included Health
              正试图把收入组合拓宽到互动衡量、专科协调和更高病情复杂度支持。缺口在于，这些证据都没有揭示 Included Health
              自身的毛利率、医生劳动强度、CAC、留存或现金转化。它们验证了买方价值和商业相关性，但尚未验证供应商完整经济引擎。
