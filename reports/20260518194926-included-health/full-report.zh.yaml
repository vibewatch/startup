companyProfile:
  summary: >
    Included Health 是一家总部位于 San Francisco 的数字健康公司，由 Grand Rounds 和 Doctor On Demand 在 2021 年合并而成，之后统一改名为 Included
    Health。公司面向雇主和健康计划销售一个整合入口，把医疗导航、权益倡导、虚拟初级保健、行为健康、专科护理、专家意见、医生匹配和会员支持放进同一个企业平台。到 2026
    年的公开运营证据显示，公司仍为私营，已经盈利，并继续活跃在大客户福利市场：约服务 300 家雇主和健康计划，推进了高曝光度的 CalPERS 上线，并围绕 Dot、替代性计划设计、专科护理和 Provider Connect
    持续扩展产品。
  foundedDate: '2021-05-11'
  founders:
    - name: Owen Tripp
      role: Grand Rounds 联合创始人；合并后公司 CEO
      background: |
        联合创立 Grand Rounds，并在 Grand Rounds 与 Doctor On Demand 合并后出任公司 CEO；该公司后来改名为 Included Health。
