  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 政策、隐私和 AI 风险如何传导到续约、利润率、估值和融资弹性。
    data:
      nodes:
        - id: policy
          label: 远程医疗政策期限
          detail: 临时报销和处方规则可能变化。
          tone: warning
        - id: privacy
          label: 隐私 / 法律事件
          detail: 涉及敏感会员数据的生殖健康或数据治理问题。
          tone: warning
        - id: ai
          label: AI 安全或责任问题
          detail: 验证不足、监督不清或患者伤害主张。
          tone: warning
        - id: renewal
          label: 续约信心
          detail: 大买方需要对价值和合规有信心。
          tone: neutral
        - id: margin
          label: 利润率和服务成本
          detail: 人工工作、重新设计或补救可能抬高运营成本。
          tone: neutral
        - id: valuation
          label: 估值 / 融资弹性
          detail: 不透明和执行意外会削弱谈判杠杆。
          tone: warning
      edges:
