  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 整合架构围绕一个应用、一份记录和共享临床运营展开
        blocks:
          - type: paragraph
            body: >-
              Included Health 的产品论点不是它在每个类别里都有最好的点状方案，而是导航、护理交付、权益倡导和福利设计应该放在同一个操作系统里。最强的官方证据是架构性的，不只是宣传：All-Included
              Care 称，会员从一个应用进入，医生在单一 EHR 中记录，同一家公司可以回答福利问题、把人路由到医生、交付虚拟问诊，并升级到专科或第二意见流程。Care Clinic
              和初级保健页面进一步说明，这套产品目标是纵向连续，而不是一次性事件，包含在职医生、PCP 到专科医生
              eConsult、共享随访，并与实验室、药房和本地医生整合。这种闭环结构，是相较于把远程医疗、导航和病种供应商拼接在一起的雇主福利栈的主要技术差异。需要留意的是，大部分整合叙事仍来自公司自制材料；公开技术证据显示了广度和一致性，但关于这套栈在高负载或异质支付方、医生环境下表现如何，第三方基准仍有限。
