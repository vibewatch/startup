      - number: '7.3'
        title: 并购遗留、产品蔓延和客户依赖抬高执行风险
        blocks:
          - type: paragraph
            body: >-
              Included Health 现在同时消化几项战略动作积累下来的复杂度：Grand Rounds–Doctor On Demand 合并、收购原 Included Health、支付方
              和公共部门落地、专科诊所扩张、AI 驱动会员指引，以及替代计划设计。单看每一项都不荒唐。事实上，它们都契合公司的核心判断：要赢下来，导航、护理交付
              和导流必须整合。问题在于，每一次扩张也会增加落地路径、数据流、临床协议和合规暴露面，而这些都必须在雇主、医保计划和个人会员之间可靠协同。


              公司自己讲述 2021 年合并时强调速度，称不到两个月就完成交割。这很亮眼，但快速合并往往留下产品、组织设计和系统集成的长尾工作。2022 年裁员显示出一定的重置压力；2024 年 CFO 和 CLO
              入职则说明，公司仍在搭建承接大合同和复杂交易所需的领导力肌肉。CalPERS、Blue Cross Minnesota 和 Walmart
              的公开客户证明令人鼓舞，但也凸显公司对复杂大型客户的依赖；这些客户会要求结果保证、服务水平和落地质量。如果增长过度集中在少数续约或上线项目上，这些要求很难长期顶住。
