      - number: '6.4'
        title: 落地动作围绕一个前门、虚拟初级保健连续性，以及升级到更高触达支持
        blocks:
          - type: paragraph
            body: >-
              在雇主、支付方和 TPA 材料中，Included Health 反复销售同一个运营承诺：一个入口、就诊前后都有指引、虚拟医疗不够时有人接手。Salesforce 和 Windstream
              案例强调集中平台或单一入口。Trustmark 和 HealthComp 把产品描述为一层导航加会员服务，可以叠在既有福利计划之上。Blue Cross and Blue Shield of Minnesota
              已上线的网络集成和 Doctor On Demand 微站把服务模型落到了具体场景：会员可以建立虚拟初级保健关系，由护理团队 协调影像或专科支持，并留在医保计划的网络逻辑内。


              Solv 和 Bicycle 合作把同一模式往外延伸。对需要线下复诊的部分就诊，Solv 补上数字到实体医疗的断点；Bicycle 则给 Included Health
              提供阿片使用障碍治疗的专科端点。公开激活信号方向不错，但仍不完整。Included Health 公布了随访、依从性和使用率提升，却很少把这些提升同具名客户分母、转化漏斗或服务水平指标配在一起。
