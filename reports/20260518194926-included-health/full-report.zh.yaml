      - number: '3.2'
        title: 直接导航竞争者
        blocks:
          - type: paragraph
            body: >-
              直接竞争者首先包括 Transcarent、Quantum Health、Rightway 和 HealthJoy；Accolade 现在主要作为被 Transcarent
              吸收的旧能力而相关。Transcarent 是最接近的整合挑战者，因为 Accolade 交易补上了它在初级保健和权益倡导上的缺口，同时保留了 Transcarent 的药房和 AI 叙事。Quantum
              仍是最强的纯导航现任者：它提供灵活部署、强导流语言，以及围绕理赔节省的成熟雇主话术，但它更多是在既有临床资产上叠加，而不是自己拥有这些资产。Rightway
              临床范围更窄，却比多数竞争者更重视经济性，因为它把导航与透明 PBM 模型、药房支出降低故事绑在一起。HealthJoy 在栈里更轻：它在 AI
              和编排上越来越有野心，但看起来仍更像福利操作系统和激活层，而不是拥有专科护理的交付平台。这也是为什么判断 Included Health 的差异化，不能只对比一个竞争者，而要对比买方完成同一任务的几种不同路径。
