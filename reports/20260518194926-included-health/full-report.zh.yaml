      - number: '1.3'
        title: 商业规模与 2024 年 5 月后的运营证明
        blocks:
          - type: paragraph
            body: >-
              Included Health 在 2024 年 5 月后仍在运营和扩张，最强证据来自具名合作伙伴和客户路径，而不是财务文件。CalPERS 在 2024 年 6 月选择 Included Health，为
              PPO 会员提供导航、虚拟护理和人群健康支持，服务自 2025 年 1 月开放；CalPERS 会员页面和 Included Health
              微网站显示，这套服务栈已经在市场中运转，包括医生搜索、免赔额跟踪和理赔工具。Blue Cross and Blue Shield of Minnesota 另在 2026 年 1 月把 Doctor On
              Demand by Included Health 扩展到联网虚拟初级保健；Walmart 也仍是全国虚拟初级保健上线的具名雇主案例。


              运营上，公司继续增加新的服务层。2024 年 Specialty Care Clinic 增加了快速虚拟专科入口，以及一个 4,000 多名专科医生、连接 40 多家医院和健康系统的网络。Provider
              Connect 和其他 2026 年发布内容显示，Included Health
              正从通用“导航”继续推向默认导流和护理路由基础设施，面向雇主和健康计划。公开证据不能证明续约率或使用强度，但足以说明公司仍在交付、拥有企业分销，并在公共部门取得牵引。
