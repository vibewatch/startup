      - number: '5.3'
        title: Dot、Provider Connect 和计划设计把导航变成路由与成本管理
        blocks:
          - type: paragraph
            body: >-
              Grand Rounds 与 Doctor On Demand 合并以来，最重要的产品变化是 Included Health 已从数字导航加虚拟护理，进入算法路由和计划导流。Dot
              被呈现为编排层：它使用福利、理赔和临床上下文回答问题、引导人们进入下一步，并在情况跨过安全阈值时交接给医生。Provider Connect
              位于这个助手内部，增加了一个质量和成本引擎，声称用数十亿数据点和数百个专科特定指标来个性化医生选择。Alternative Plan Design
              则把同一路由逻辑包进激励机制，在会员旅程起点放入健康咨询和先共付经济性。CalPERS 和 Blue Shield 提供了真实采购方证据，说明 Included Health 能进入大型风险承担安排；2022
              年生态连接发布也显示，公司还试图拥有跨外部供应商的转诊。技术上，这是平台里杠杆最大、也最不透明的部分：路由栈显然是差异化核心，但其评分方法和错误率对外部人仍大多是黑箱。
