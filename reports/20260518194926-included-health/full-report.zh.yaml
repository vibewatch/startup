  - id: TV005
    title: 投资逻辑破裂与终止触发条件表
    columns:
      - 触发条件
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 盈利能力反转
        - 管理层无法再证明经营利润或现金生成能够持续为正
        - 打破近期最强的正面信号
        - 立场从继续研究转为回避
      - - 旗舰客户恶化
        - CalPERS、Walmart 或其他标杆客户走弱或未能续约
        - 削弱企业级验证和规模溢价
        - 按悲观情景倍数重估
      - - 新融资低于预期
        - 新一轮融资或大额老股交易成交价明显低于上一周期传闻
        - 形成真实的市场出清下行证据
        - 用新价格作为主要锚点
      - - 优先权或稀释意外
        - 股权结构表显示清算优先权或期权稀释明显差于隐含预期
        - 压低普通股上行空间，并恶化下行情景回收
        - 要求结构性保护，否则放弃
      - - 可比公司倍数持续压缩
        - 在 Included 仍不透明时，上市可比公司区间停留在 Teladoc 和 Accolade 水平附近
        - 高溢价倍数难以成立
        - 把估值上限控制在基准情景区间内
    notes: 这些是会打破投资逻辑的条件，不是普通经营风险。任一条件出现，都足以实质性改变投资建议。
    claimRefs:
      - CV016
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 收入
        - 管理层确认的当前收入桥接
        - 整个估值框架都取决于真实的当前分母
        - 财务团队或董事会材料
      - - 利润率和自由现金流
        - 毛利率、经营利润率和 FCF 报表
        - 用于判断盈利是真能持续，还是只是账面效果
        - 最新审计财务或可提交董事会的财务
      - - 客户续约质量
        - 主要客户的续约、NRR 和理赔节省队列
        - 决定 Included 能否相对已压缩的导航可比公司享受溢价
        - 客户成功看板加客户访谈
      - - 股权结构表和优先权
        - 当前股权结构表和清算瀑布
        - 用于测算下行情景回收金额和普通股真实上行
        - 律师确认的股权结构表导出
      - - 老股市场证据
        - 409A 历史和近期任何经纪撮合的老股成交记录
        - 在没有新一轮新股融资时，提供真实市场出清数据点
        - 财务资料加老股经纪记录
      - - 情景兑现证据
        - 导航、虚拟医疗和专科产品的分部组合
        - 显示 Included 是在变成更强的集成平台，还是仍是导航占比高的资产
        - 管理层产品与财务复盘
    notes: 这些问题按估值重要性排序。没有前三项，任何投资备忘录仍会停留在故事争论，而不是数字判断。
    claimRefs:
      - CV034
      - CV042
      - CV043
      - CV044
