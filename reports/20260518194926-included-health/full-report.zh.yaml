      - number: '6.3'
        title: 医保计划渠道是差异化来源，尤其在社区或公平项目重要的场景
        blocks:
          - type: paragraph
            body: >-
              Included Health 的支付方渠道不只是数字前门故事；它越来越多地嵌入分人群社区和护理导航项目，让产品更像一层会员互动和人群管理能力。Point32Health 旗下 Tufts 和 Harvard
              Pilgrim 商业会员可以获得 LGBTQ+ 导航、友善医疗提供者匹配和支持小组。SCAN Affirm 在面向 LGBTQ+ 的 Medicare Advantage 计划内使用 Included
              Health Communities、同伴支持、权益倡导和社区资源。Blue Cross and Blue Shield of Minnesota 已把 Doctor On Demand
              初级保健放进一个运行中的医保计划网，而 Compass Rose 和未具名区域医保计划则显示，联邦、商业和 Medicare Advantage 人群也在覆盖范围内。


              这种社区重点确实能打出买方差异化，因为 Included Health 可以围绕公平、信任和可及性销售，而不只是卖通用远程医疗。Black Community Innovation Coalition
              从雇主侧给出了同样信号。不过，公开披露在项目设计上仍明显强于使用数据：会员数、县级采纳率、社区项目渗透率和分人群留存，在已审阅材料中大多缺位。
