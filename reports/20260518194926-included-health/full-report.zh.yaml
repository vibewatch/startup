  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              Included Health
              位于美国雇主赞助福利市场之内，但它真实的运营边界比整个保险市场更窄，也更有用。公司通过雇主和健康计划销售导航、权益倡导和虚拟护理，因此自然经济买方是直接暴露于医疗和药品趋势的自筹资金计划赞助方。KFF 的
              2024 年数据显示了这一点为什么重要：63% 的受保工人、79%
              的大型企业受保工人已经在自筹资金计划中，也就是说，很大一部分商业保险覆盖落在能够直接采购导航、虚拟初级保健、行为健康和专科支持的买方组织手里。这个市场也长期疼痛。家庭保费在 2025 年达到
              $26,993，心理健康可及性仍落后于初级和专科可及性，雇主也越来越多地采购虚拟初级保健，并把远程医疗视为持久的福利层，而不是 COVID 遗留物。


              因此，实际市场边界包括雇主导航、福利权益倡导、虚拟初级保健、虚拟行为健康、专家医学意见，以及绑定雇主或健康计划福利设计的专科护理支持。它不包括以 Medicare
              为核心的护理管理、与雇主无关的消费者自费远程医疗，以及由保险公司而非雇主控制大部分福利架构的小型全保险福利产品。这个边界重要，因为 Included Health
              的差异化取决于围绕会员编排多个福利触点，而不是销售单一数字点状工具。
