        - 驱动
        - 当前
        - 支撑专科导航、专家医疗意见和卓越中心导流
        - 验证 Included Health 的专科扩张是否实质改变高成本理赔结果
      - - 心理健康使用率上升及平等规则要求
        - 驱动与约束
        - 当前 / 2026
        - 整合式准入和质量管理更有价值，但福利设计和网络合规负担也更重
        - 审查 MHPAEA 支持、网络数据准备度和心理健康质量报告
      - - 短合同和基于结果采购
        - 约束
        - 当前
        - 供应商必须快速证明结果，否则有被替换的风险
        - 询问续约率、风险分担条款，以及按雇主队列拆分的证据
      - - 远程医疗政策延长至 2027 年
        - 驱动
        - 当前 / 2027
        - 稳住雇主项目的医生供给和虚拟工作流假设
        - 确认 Included Health 对 2027 年之后政策连续性的依赖程度
      - - AI 采用与隐私敏感度
        - 混合
        - 当前
