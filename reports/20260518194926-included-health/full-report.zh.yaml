      - number: '1.2'
        title: 领导层延续性与治理
        blocks:
          - type: paragraph
            body: >-
              领导层延续性最强的锚点是 Owen Tripp。他是 Grand Rounds 联合创始人，合并后出任 CEO，并在 2025 年 1 月 Business Insider 采访中仍是 Included
              Health 的公开代表人物。Robin Glass 从 2021 年合并团队到 2024 年法务高管招聘公告，一直公开被列为总裁，说明公司在搁置 IPO 计划、更新管理梯队时，高级运营层仍有延续。2024 年
              5 月之后最重要的新任命是 CFO Mark Flakne 和 CLO Rob Guenthner，两人都来自规模化医疗运营商，具备价值医疗、交易和上市公司流程经验。


              董事会证据比高管证据薄，但仍可使用。Included Health 在 2022 年 11 月宣布任命 Michael Bender，并把这与 Hill Ferguson
              随着整合推进而计划离开董事会相连。那一时期的公开材料提到一个七席董事会，包括前 HHS 部长 Kathleen Sebelius 和有风投背景的董事。主要治理结论不是明显不稳定，而是公司围绕 Tripp
              集中度较高，且当前投资人和控制权图景仍不透明；2024–2026 年高管更新之后，公开来源没有把这张图完全补齐。
