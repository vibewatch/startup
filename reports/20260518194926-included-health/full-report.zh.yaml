  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 要点
      - 当前支撑
      - 什么会改变观点
    rows:
      - - 投资逻辑
        - 一体化运营模型仍在运转
        - 2024 年后在计划设计、专科护理和服务方导航上持续推出新产品
        - 若新发布不能转化为可衡量的续约或节省，下调判断
      - - 投资逻辑
        - 大客户证据仍在
        - CalPERS 仍在使用，管理层称约有 300 家雇主和健康计划
        - 若旗舰账户无法续约，规模溢价消失
      - - 投资逻辑
        - 资本结构可能比后期同业更干净
        - 管理层称股权结构全是普通股，公司不需要融资
        - 测算下行退出收益前，先拿到实际股权结构表
      - - 反向逻辑
        - 当前估值输入缺失
        - 未披露当前 ARR、毛利率、自由现金流或新一轮 primary 融资
        - 若能拿到类似贷款人的运营资料包，信心会明显提高
      - - 反向逻辑
        - 品类可比估值显示压缩
        - Accolade 虽有规模和客户触达，退出倍数仍不高
        - 持续更高增长和盈利能力，才支撑更高区间
      - - 反向逻辑
        - 执行风险从未完全消失
        - Included 在重置期间调整过人员，且仍依赖私下披露
        - 清晰的续约、留存和运营指标会削弱这一担忧
    notes: 反向逻辑针对估值。Included 可以是一家强公司，但价格不对时仍不是好投资。
