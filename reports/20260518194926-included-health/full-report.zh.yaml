  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 财务不透明、估值包袱，以及雇主采购环境变难
        blocks:
          - type: paragraph
            body: >-
              Included Health 的商业位置是真实的，但仍难以承保式评估。公开材料清楚显示，公司围绕雇主和医保计划搭建了企业商业化体系；Business Insider 称公司现在服务约 300
              个这类买方，并声称已盈利且保持双位数增长。这足以证明规模，却不足以给风险定价。同一篇访谈确认，公司曾私下提交 2022 年 IPO 文件后又退回；而 2026
              年当前材料仍回避新的全公司估值、公开收入数字或已披露合同经济性。这个组合形成典型的后期私营公司包袱：投资人知道业务不小，却看不出估值重置已经发生，还是只是被推迟。


              买方侧也在变难。雇主福利研究和供应商评论指向同一个方向：采购方在砍掉低价值供应商、重跑 RFP，并要求简洁方案和可衡量结果，而不是参与度噱头。Included Health
              自己的打法也隐含承认，碎片化点方案正在让买方失望。这让公司的整合叙事在战略上讲得通，但也意味着，正当公司把范围扩到计划设计和更深的风险共担企业项目时，销售周期、续约和预算审批可能都会更苛刻。商业风险不是没有需求，而是要足够快地证明差异化
              ROI，守住仍不透明的后期估值。
