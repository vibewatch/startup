      - number: '2.3'
        title: 买方行为、需求驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              数字健康买方行为已经变得更有纪律，也更残酷。PHTI 的 2024
              年采购调查称，合同周期短，绩效型条款常见，雇主希望产品能改善健康、降低成本，并覆盖足够多的适应症，以替代供应商蔓延。成本压力解释了这种行为。Business Group on Health 预计，2026
              年雇主成本趋势在干预前的中位数为 9%；Mercer 则称，一半大型雇主可能把更多成本转嫁给员工，35%
              计划提供非传统医疗计划。与此同时，雇主还要同时处理肥胖药物、癌症、灾难性理赔和更高心理健康使用率带来的冲击。Lockton 的理赔人报告展示了疼痛背后的极端集中度：大约 1% 的会员年理赔超过
              $100,000，却占支出的三分之一。


              这些动态让导航和导流更有价值，也把供应商门槛抬高。只有当数字工具能简化会员旅程、接入现有福利，并拿出可信的节省或质量改善证据时，雇主才会继续付费。那些只增加一个新孤岛、或无法证明结果的产品，正是买方声称愿意替换的对象。这就是
              Included Health 面对的核心市场结构事实：类别在增长，但增长更偏向更宽、可衡量的平台，而不是狭窄点状方案。
