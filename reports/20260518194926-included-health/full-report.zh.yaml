      - number: '5.5'
        title: 信任信号真实存在，但独立验证仍落后于 AI 栈的野心
        blocks:
          - type: paragraph
            body: >-
              在基础控制上，Included Health 的公开信任姿态强于许多数字健康同行。公司发布详细隐私政策，称处理 PHI 的供应商必须签署业务伙伴协议，明确禁止未经授权用 PHI
              做营销，维护漏洞赏金计划，并把客户迁移到 OpenID Connect 等更强身份标准。医疗器械同意书也有用地澄清，平台在虚拟场景下可能依赖第三方临床套件，同时声明不对这些设备的安全和性能负责。在 AI
              上，最可信的外部质量信号不是公开基准看板，而是 Google Research 在 2026 年 2 月宣布的随机研究。该试验实质性强化了 Dot
              的验证路径，但结果仍待公布，买方也仍缺少关于正常运行时间、错误升级、路由精度或医生质量引擎审计范围的公开指标。净结论：Included Health
              看起来有技术差异化，因为它把导航、临床运营和福利数据连成一套栈；但产品仍需要围绕黑箱测量、认证范围和外部验证的运营表现继续尽调。
