  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 雇主、支付方和渠道买方分层很宽，但主要通过精选证据描述
        blocks:
          - type: paragraph
            body: >-
              Included Health 显然不只卖给一种客户原型。公开网站把需求拆成雇主和健康计划两类，又展示这些买方如何延伸到 CalPERS 这类公共采购方，以及 Trustmark 和 HealthComp
              这类管理方渠道。雇主侧定位面向 HR、福利和财务负责人，他们需要一个入口来处理导航、虚拟护理、权益倡导和专科路由。支付方侧话术则转向会员满意度、广覆盖、虚拟初级保健触达，以及面向商业、Medicare
              Advantage 和联邦会员人群的差异化项目。


              这种广度重要，因为它降低了对单一获客路径的依赖。Included Health 可以直接拿下自保雇主，也可以嵌入健康计划合同、TPA
              伙伴关系或公共采购方安排。代价是透明度：公开记录更多展示客户标识、精选案例研究和合作伙伴公告，很少给出清晰拆分，说明每个细分里有多少客户、各自贡献多少收入，以及这些关系在续约时有多稳固。
