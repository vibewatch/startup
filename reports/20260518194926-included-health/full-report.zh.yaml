      - number: '7.2'
        title: 远程医疗政策、生殖隐私和 AI 责任让剩余风险仍高
        blocks:
          - type: paragraph
            body: >-
              Included Health 受益于比许多投资人原先担心更友好的政策基线，但几个关键位置的法律基础仍是临时性的。HHS 称，许多 Medicare 远程医疗弹性现在延续到 2027
              年底，这给虚拟医疗运营商买了时间。这个利好有用，但不能完全关掉风险，因为受控物质处方弹性只延续到 2026
              年底，而且仍是远程医疗工作流的特定依赖。对一个仍依赖虚拟初级保健访问的平台来说，报销、合格提供者或远程处方的联邦规则一旦变化，可能在企业合同续约前就改变使用率、定价或临床工作流设计。


              隐私风险也不是理论问题。HHS 称，得州法院撤销了生殖健康隐私规则的大部分内容；Fisher Phillips 称，结果会直接落到雇主资助计划和提供者身上。另有雇主福利报道显示，堕胎旅行
              项目很常见，但管理往往粗糙，只有少数使用第三方管理。EPIC 补充说，与堕胎有关的数字痕迹可能来自搜索、应用和其他数据尾气，而这些并不在狭义医疗场景内。再叠加 Included Health 的 AI
              路线图——会调用病史、理赔和福利数据——风险栈就更重：公司必须管理 HIPAA 商业伙伴义务、FDA 许可 工具之外碎片化监管，以及一旦临床决策支持开始大规模影响护理后仍未解决的医疗事故或产品责任问题。
