  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 交易对手和系统的表现会塑造 Included Health 的风险画像。
    data:
      nodes:
        - id: employers
          label: 大型雇主
          detail: 赢下大合同，但也可能集中收入和续约。
          tone: warning
        - id: plans
          label: 健康险计划
          detail: 嵌入式虚拟初级保健和导航的分销渠道。
          tone: neutral
        - id: providers
          label: 医疗服务方网络
          detail: 临床质量和网内导流取决于网络深度和数据。
