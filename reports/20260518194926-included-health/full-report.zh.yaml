            body: >-
              如果只从虚拟初级保健看 Included Health，很容易低估它的广度。社群业务为 LGBTQ+ 和 Black
              人群增加了定向导航与护理协调，包括友善医生搜索、福利帮助、社会支持和保密承诺。Point32Health 的上线显示，该产品可以嵌入支付方层面，而不只是作为雇主 DEI 附加项营销。与此同时，Specialty
              Care Clinic 把核心护理模型推进到癌症、代谢、女性健康和自身免疫等用例；Expert Medical Opinion
              则为面临重大诊断或手术决策的会员保留第二意见路径。药房导航通过处理药物相关的行政和临床摩擦，补齐体验。战略结果是一张产品地图，用一个品牌覆盖导航、常规护理、复杂护理和服务不足人群支持。限制在于证据不对称：公开证据在广度和会员故事上很扎实，但相比更广为宣传的初级保健和采购方合同案例，社群和药房的独立结果证据要薄得多。
