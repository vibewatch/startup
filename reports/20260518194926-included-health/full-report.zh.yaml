      - number: '1.5'
        title: 资本历史、私营状态与反向信号
        blocks:
          - type: paragraph
            body: >-
              资本能见度明显弱于产品或合作伙伴能见度。公开报道显示，公司曾为计划中的 2022 年 IPO 秘密提交 S-1，随后在市场转向时后退。Business Insider 称，截至 2025 年 1 月
              Included Health 仍为私营且已盈利，自 2021 年以来保持双位数增长，约服务 300 家雇主和健康计划；Tripp
              则称股权结构表全部由普通股组成。公开来源对当前估值、当前累计融资或现公司任何债务安排的帮助小得多。最好的公开估值点已经陈旧：Becker's 在 2021 年 10 月引用了 $12.71 billion
              的数字和超过 1,000 名员工，而 Healthcare Dive 把原始合并描述为两家估值约 $1.34 billion 和 $875 million 的公司之间的全股票交易。


              需要保留的关键反向信号是 2022 年 7 月重组，当时 MobiHealthNews 报道裁员幅度低于 6%。这本身不是生死问题，但说明公司并未免疫于 2021
              年繁荣后的数字健康重置。整体看，公开记录支持这样一种判断：Included Health 是一家活跃、仍为私营的平台型公司，有可观合作伙伴牵引和真实产品速度；但这些记录不足以精确判断当前估值、员工数或经审计财务。
