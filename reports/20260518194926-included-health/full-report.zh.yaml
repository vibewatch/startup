      - number: '8.3'
        title: 情景分析与估值立场：仍有独角兽质量，但价格才是全部争议
        blocks:
          - type: paragraph
            body: >-
              因为 Included 没有披露当前收入、利润率或新一轮融资，正确的分析动作不是宣布一个估值，而是给情景定价。悲观情景假设 Included
              更像一个被压缩的导航资产，而不是高溢价软件复利增长资产：增长证明温和，公开现金流透明度有限，投资人对品类结果持怀疑态度。它指向约 1-2x
              收入；如果当前收入低于乐观私募市场传言，这会非常重要。基准情景认可公开层面的正面因素——盈利、持续发产品和大客户证明——同时尊重一个事实：最近没有市场出清的新股价格。在这个基础上，2.5-4.0x
              收入区间是最站得住脚的尽调筛选线。


              乐观情景存在，但有条件。若要支撑 5-6x 收入并重看 2021 年高水位叙事，Included 必须更像 Hinge，而不是
              Accolade：经审计的强增长、持久毛利率、可预测续约，以及整合导航加虚拟医疗能创造异常强买方经济性的证据。在证据出现前，最新可辩护立场不是 Included
              便宜或坏掉，而是公司很可能仍是一个私营独角兽规模资产，公允价值对价格高度敏感。如果卖方锚定旧周期预期，立场就是偏高；如果入场价明显低于旧峰值，且管理层能在资料室 打开收入质量，立场可以转向合理。
            claimRefs:
              - CV034
