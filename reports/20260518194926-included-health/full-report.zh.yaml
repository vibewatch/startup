        - 继续研究
        - 运营信号强，但未披露实时价格发现数据
        - 没有管理层数据室，不要做投资测算
      - - 信心
        - 中
        - 质量方向看得见，当前估值看不见
        - 用尽调里程碑，而不是即时价格观点
      - - 风险评级
        - 高
        - 品类估值压缩、收入不透明、没有新一轮融资，让下行空间难以量化
        - 防范不利价格锚定
      - - 估值立场
        - 价格敏感；若接近上一周期预期则偏高
        - 当前上市可比区间远低于 2021 年溢价叙事
        - 任何接近旧峰值的价格，表面上都偏激进
      - - 仍未上市的独角兽身份
        - 可能是
        - 资料仍显示其为私营公司，运营足迹达到独角兽规模
        - 继续跟踪公司，但不要把身份误当作公允价值
    notes: 本表给出当前立场，而不是精确标记。若管理层披露实时收入、利润率和股权结构证据，投资建议可能很快改善。
