          description: 会员建立长期照护关系，或使用急症和行为健康服务；这些服务常嵌在支付方网络或雇主赞助福利设计内。
        - id: escalation
          label: 专科、社群或线下升级
          description: 照护团队把会员转入专科护理、社群支持、影像检查、转诊、当日门诊，或 Bicycle Health 等外部伙伴。
        - id: renewal
          label: 续约、扩张或重新招标
          description: 买方评估满意度、可衡量结果和运营表现，再决定加深关系还是重新开放市场。
    claimRefs:
      - CU001
      - CU024
      - CU029
      - CU036
      - CU039
      - CU044
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: standard
    summary: 流程展示 Included Health 通常如何从导航入口扩展到长期照护、社群项目和伙伴交接。
    approximationNotes: 这是因果实施图，不是量化漏斗；公开来源对顺序讲得更清楚，对逐阶段转化率披露更少。
    data:
      nodes:
        - id: buyer
          label: 买方选择整合平台
          detail: 案例研究和伙伴上线都强调一个统一前门，承接导航、会员服务和照护路由。
          tone: neutral
        - id: navigation
          label: 导航与权益支持上线
          detail: 会员获得福利指引、医生匹配，以及临床、财务或行政问题支持。
          tone: positive
        - id: pcp
          label: 虚拟初级保健加深使用
          detail: Walmart 和 BCBS Minnesota 显示，使用从仅急症访问转向持续初级保健关系。
          tone: positive
        - id: community
          label: 社群或专科路径激活
          detail: Point32Health、SCAN 和 Bicycle 说明，公司可延伸到 LGBTQ+ 护理、社群支持和 OUD 治疗入口。
          tone: positive
        - id: finalmile
          label: 线下交接闭环
          detail: Doctor On Demand 照护团队和 Solv 的最后一公里把会员路由到影像检查、专科医生和本地诊所。
          tone: positive
        - id: review
          label: 买方复盘 ROI 和服务质量
          detail: 续约取决于可衡量结果、会员体验和运营可靠性，但这些指标只有部分公开。
          tone: warning
      edges:
        - from: buyer
          to: navigation
          label: 选择并上线
        - from: navigation
          to: pcp
          label: 激活照护使用
        - from: pcp
          to: community
          label: 扩大照护深度
        - from: community
          to: finalmile
          label: 按需升级
        - from: finalmile
          to: review
          label: 衡量并续约
    claimRefs:
      - CU024
      - CU029
      - CU036
      - CU037
      - CU039
      - CU044
      - CU046
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 矩阵按具名客户群比较公开证明深度，将部署具体性、结果具体性和留存可见度拆开看。
    approximationNotes: 单元格仅基于公开文件作定性判断：强 = 具名部署并有可衡量结果；中等 = 具名部署且有部分细节；弱 = 公开可用但缺少持久续约披露。
    data:
      columns:
        - 部署具体性
        - 结果具体性
        - 时效性
        - 留存可见度
      rows:
        - label: CalPERS
          values:
            - 强 — 具名合同和会员数
            - 强 — 风险挂钩的质量和趋势保证
            - 当前 — 2025-2029 年合同周期
            - 弱 — 未公开续约或满意度序列
        - label: Walmart
          values:
            - 强 — 多年期和全国铺开
            - 强 — 已发布成本和临床结果
            - 近期 — 2023 年全国扩张证明
            - 弱 — 未公开雇主留存指标
        - label: Point32Health
          values:
            - 中等 — 具名支付方合作
            - 中等 — 服务设计清楚，使用量不清
            - 历史项目但产品表述仍在
            - 弱 — 未公开持续性指标
        - label: SCAN Affirm
          values:
            - 中等 — 具名 MA 计划和县
            - 中等 — 福利设计和社群支持细节充分
            - 历史上线，当前计划仍存在
            - 弱 — 无队列或续约数据
        - label: BCBS Minnesota
          values:
            - 强 — 具名计划和当前网络页面
            - 轻量 — 有可及性和可负担性表述，ROI 计算很少
            - 当前 — 2026 年网络变更
            - 弱 — 无长期满意度或流失数据
        - label: TPA 渠道（Trustmark / HealthComp）
          values:
            - 中等 — 具名渠道关系
            - 轻量 — 运营和价值表述，采用数据有限
            - 历史合作仍被引用
            - 弱 — 未公开客户级续约数据
    claimRefs:
      - CU041
      - CU042
      - CU043
      - CU044
      - CU045
  - id: FU004
    title: 留存 / 复购可见度矩阵
    type: matrix
    layout: standard
    summary: 矩阵展示公开记录在主要客户细分的留存持久性上披露了什么、没有披露什么。
    approximationNotes: 队列图需要编造数值化留存百分比，因此这里改用替代矩阵，直接记录公开数据缺口。
    data:
      columns:
        - 公开留存指标
        - 最新可见信号
        - 含义
      rows:
        - label: 大型雇主部署
          values:
            - NRR / GRR 未披露
            - 只能看到公司自发发布的满意度和案例研究结果
            - 雇主账户续约韧性仍未被公开证明
        - label: 健康险计划合作
          values:
            - 续约率或退保率未披露
            - Point32Health、SCAN 和 BCBS MN 的会员入口扩张可见
            - 支付方分销广度比持续性更容易证明
        - label: TPA 渠道合作
          values:
            - 客户挂载率和续约率未披露
            - 公开材料仍把 Trustmark 和 HealthComp 上线项目定位为活跃产品
            - 渠道杠杆存在，但伙伴账本内的持久性不透明
        - label: 公共采购方合同
          values:
            - 暂无公开续约历史
            - CalPERS 披露规模和问责机制，但未披露会员留存结果
            - 一个标杆胜利还不能化解集中度或持久性风险
    claimRefs:
      - CU041
      - CU042
      - CU043
      - CU045
      - CU046
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 矩阵列出在计入当前缓释措施后剩余最高的风险。
    data:
      columns:
