      - number: '2.4'
        title: 监管、支付与 AI 背景
        blocks:
          - type: paragraph
            body: >-
              当前市场背景对虚拟护理可及性异常友好，但对合规和证明要求更高。CMS 2026 年 2 月 FAQ 把关键 Medicare 远程医疗灵活性延长到 2027 年底，保留居家访问和 RHC、FQHC
              远程医疗持续计费。虽然 Included Health 的核心市场是雇主赞助而非
              Medicare，这些规则仍然重要，因为它们稳定医生供给、让虚拟流程正常化，并让远程医疗基础设施继续具备投资性。心理健康平价在负担上朝相反方向移动：Lockton 的 MHPAEA
              分析称，计划需要更强的比较分析、更多网络充分性和报销数据，并在每个相关分类中提供有意义的心理健康福利，重大设计与应用要求将从 2026
              计划年度开始生效。换句话说，买方需要既能改善可及性、又不会制造平价或网络麻烦的供应商。


              AI 又增加了一层。Rock Health 称，2026 年 Q1 融资仍活跃但更集中，AI 如今已是数字健康的基本配置。消费者行为变化更快：Rock Health 调查摘要称，32% 的成年人已使用 AI
              聊天机器人获取健康信息，而且大多数依赖通用工具。这是导航界面的顺风，但也提高了隐私和信任风险。实际含义是，胜出的供应商可能是那些把面向会员的便利性，与企业级治理、临床整合和合同纪律结合起来的公司。
