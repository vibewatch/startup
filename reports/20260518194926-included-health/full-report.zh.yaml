      - number: '2.5'
        title: 为什么 Included Health 契合这个市场
        blocks:
          - type: paragraph
            body: >-
              Included Health
              与市场走向在方向上高度一致。公司已经把自己呈现为一套整合雇主方案，并声称能衡量趋势下降，这正是买方现在想听的语言。更重要的是，它的产品广度映射到已观察到的采购需求：初级保健、心理健康、肥胖或代谢支持、女性健康、导航和专科支持，都在公开调查中以重要采购类别或成本驱动因素出现。Included
              Health 2024
              年推出专科护理，也符合市场逻辑。雇主把癌症和其他复杂病症视为最高成本类别，高成本理赔仍极度集中，而专科旅程正是碎片化同时制造浪费和会员不满的地方。一个把导航、专家意见、初级保健、行为健康和环绕式专科支持组合起来的模型，比单病种应用更贴合这类疼痛。


              但需要留意的是经济性，而不是战略方向。公开来源没有披露 Included Health 的仅雇主 SAM、产品组合收入、续约画像，或其声称节省背后的确切机制。因此，正确结论不是市场论证已经完全被证明，而是
              Included Health 符合一种庞大且结构有利的需求模式——自筹资金雇主试图整合碎片化工具、把会员导向更高价值护理，并管理灾难性专科和药品趋势——但仍需要尽调实际合同经济性和已实现 ROI。
