        title: 临床工作流很宽、很快，并明显为人工跟进而设计
        blocks:
          - type: paragraph
            body: >-
              对会员而言，Included Health
              越来越像许多医疗任务的入口，而不是狭窄的远程医疗产品。初级保健界面展示了清晰的接入路径——激活、选择医生、线上就诊，并回来处理续药、转诊、筛查或慢病随访。行为健康把这个入口扩展到治疗和精神科，等待时间低于一周；Expert
              Medical Opinion
              则处理高病情复杂度病例，收集病历、匹配专科医生，并在不增加额外预约或账单的情况下给出建议。药房导航又增加了一层运营能力，处理事先授权摩擦、节省搜索、续药管理和用药指导。实际含义是，Included Health
              试图在第一次点击之后接管协调负担，而不只是提供预约时段。对企业买方来说，这是有意义的服务工作流优势，因为错过转诊和放弃后续步骤会摧毁碎片化福利栈中的价值。限制在于，最快理赔和最佳结果数字仍由公司报告；外部验证比产品覆盖图所暗示的更薄。
