              最强的具名证据点是 CalPERS 和 Walmart，因为两者都不只是摆 logo，而是给出了部署范围和效果表述。CalPERS 给 Included Health 提供了一个公共采购方样本：约 400,000
              名 PPO 会员、明确覆盖导航和虚拟医疗，并采用为期五年、与成本和质量挂钩的风险共担结构。Walmart 则给了公司一个少见的雇主案例，既有铺开历史，也有临床和财务结果：总医疗成本下降
              11%，慢病和预防性使用不只停留在急诊场景，糖尿病和高血压相关生物指标也有改善。


              其他具名案例的证据质量弱一些，但能把客户地图拉宽。Salesforce 和 Windstream 说明 Included Health 能拿下大型或分布式雇主。Point32Health、SCAN 以及 Blue
              Cross and Blue Shield of Minnesota 说明公司能进入支付方和 Medicare 路径。Trustmark 和 HealthComp
              说明管理机构渠道有撬动作用。缺口在于，大多数证据只停在产品可用、会员支持设计或定性结果，未披露附加率、续约结果、PMPM 经济性，或经过审计的前后基线。
