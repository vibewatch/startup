  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Current CAC, payback, gross margin, and NRR values by major product line or buyer cohort.
    whyItMatters: Without those numbers it is impossible to test whether profitability is durable or whether new product expansion is earning an acceptable return.
    diligencePath: Request a management P&L bridge with gross margin, sales efficiency, retention, and cohort economics for navigation, virtual care, and specialty care.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, free cash flow, and minimum liquidity covenant thresholds.
    whyItMatters: The CEO’s comment about a strong cash position is directionally positive but does not quantify runway or financing dependency.
    diligencePath: Request the latest balance sheet, cash flow statement, and board materials summarizing runway under base and downside cases.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
    - TI006
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Any credit facilities, receivables financing, contingent guarantee obligations, or earn-out liabilities tied to large customer contracts or acquisitions.
    whyItMatters: The CalPERS contract puts substantial dollars at risk, and any hidden financing or guarantee structures could change downside exposure materially.
    diligencePath: Request debt schedules, major customer contract summaries, and any acquisition-related indemnity or guarantee schedules.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited income statement, balance sheet, and cash flow statement for Included Health as a combined company.
    whyItMatters: Public proofs show traction and selected ROI outcomes, but not enough to underwrite revenue quality, margin path, or capital intensity with confidence.
    diligencePath: Request the latest audited or lender-grade financial statements and a segment bridge from legacy navigation, virtual care, and specialty-care lines.
    relatedQuestionRefs:
    - QI006
    - QI019
    - QI025
    relatedTableRefs:
    - TI006
  - type: conflicting-data
    severity: minor
    topic: merger-valuation
    missingEvidence: A definitive disclosed valuation or fairness memorandum for the 2021 Grand Rounds/Doctor On Demand merger.
    whyItMatters: Public coverage provides only partial valuation reference points, so the exact step-up from predecessor companies into the combined entity remains opaque.
    diligencePath: Request board materials, banker fairness work, or cap-table history covering the merger exchange ratio and any contemporaneous 409A marks.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI005
