- id: cost-drivers-and-roi
  title: Public ROI proofs support the value proposition more than they prove vendor economics
  body: 'Included Health has a stronger public case for customer value than for its own vendor unit economics. The CalPERS contract is the clearest purchaser-level proof: roughly 400,000 PPO members are in scope, Included Health and Blue Shield put $464 million at risk over five years, and the medical-trend target steps down from 5.5% in 2025 to 3.0% in 2029. That structure is important because it shows Included Health is no longer selling only point-solution navigation; it is participating in large, multi-year arrangements where measured cost improvement is economically central to the contract.


    The company also has explicit customer-proof artifacts. Walmart’s multi-year virtual primary care deployment reported an 11% reduction in total cost of care, a 24% average reduction in HbA1c for diabetes users, and a 14% reduction in blood pressure for hypertension users. Provider Connect adds another company-claimed proof point: 9% savings per referral and a 92% increase in connections to top-quartile clinicians. Healthy Days and Specialty Care Clinic launches show how Included Health is trying to widen revenue mix into engagement measurement, specialty coordination, and higher-acuity support. The gap is that none of these proofs reveal Included Health’s own gross margin, clinician labor intensity, CAC, retention, or cash conversion. They validate buyer value and commercial relevance, but not yet the vendor’s full economic engine.'
