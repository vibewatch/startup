- id: TI006
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on analysis
  - Why public proof is insufficient
  - Exact diligence path
  rows:
  - - Current revenue and audited financials
    - Blocking — cannot reconcile profitability claim to GAAP or segment mix
    - Business Insider confirms non-disclosure; official pages provide only growth narrative
    - Request audited financial statements and a management bridge by product line
  - - Cash balance, burn, and runway
    - Material — capital adequacy cannot be quantified
    - CEO says cash was strong during the IPO pause but gives no amount or runway
    - Request latest balance sheet and monthly cash waterfall
  - - Gross margin by line of business
    - Material — no view into clinician labor intensity or care-delivery profitability
    - ROI proofs show customer savings, not Included Health gross profit
    - Request margin by navigation, virtual care, specialty care, and payer contracts
  - - CAC, payback, and NRR
    - Blocking for software-style underwriting
    - No public cohort or sales-efficiency disclosures exist
    - Request cohort retention, sales productivity, and payback analysis
  - - Debt, guarantee, and contingent obligations
    - Material — risk-sharing contracts and acquisitions could add hidden downside
    - Public sources disclose CalPERS at-risk dollars but no corporate debt schedule
    - Request debt schedules, large-customer guarantee schedules, and acquisition indemnities
  notes: The main diligence blocker is not whether the model has demand; it is the absence of lender-grade numbers proving revenue quality, margin path, and downside exposure.
