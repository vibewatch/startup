chapter:
  number: 4
  title: Financials
  summary: Included Health appears to have crossed into profitability without taking a visible rescue round after pausing a planned 2022 IPO, and public customer proofs show the platform can win large contracts and document buyer savings. But public evidence still stops short of audited revenue, gross margin, cash, CAC, NRR, or debt data, so revenue quality and runway remain diligence-gated rather than proven.
sections:
- id: revenue-model-pricing
  title: Revenue model and pricing remain enterprise-led and mostly opaque
  body: 'Included Health’s current commercial model is clearly business-to-business even though members experience it through a consumer-style app. Across the employer and health-plan pages, the company presents itself as a covered benefit sold to organizations, not as a broad self-serve subscription. The offering bundles navigation, advocacy, virtual primary care, behavioral health, specialty care, and administrative support into one contract surface, which matters financially because it pushes the company toward larger enterprise deals, multi-stakeholder implementations, and renewal-driven revenue rather than transactional telehealth alone.


    Public pricing remains thin. Employer-facing materials emphasize demos, integration, and outcomes, but do not publish list prices for the employer contract itself. The clearest public pricing signal is the 2026 alternative plan design: it uses a copay-first structure for members and is explicitly framed as a way to make costs predictable while improving primary-care-led routing. That makes the member’s price experience more transparent without revealing Included Health’s own realized contract pricing, take rates, or margin capture. The commercial takeaway is that Included Health appears to monetize through custom enterprise contracts, payer integrations, and performance-linked arrangements, but a buyer still needs management data to understand how much of that revenue is recurring PMPM-style platform income versus more episodic care-delivery economics.'
