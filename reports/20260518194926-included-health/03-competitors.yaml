company:
  name: Included Health
chapter:
  number: 3
  title: Competitors
  summary: The closest direct rival to Included Health in 2026 is Transcarent after its Accolade merger, while Quantum Health remains the pure-play navigation incumbent, Rightway owns the strongest PBM-economics story, and Teladoc plus Firefly represent meaningful virtual-primary-care and plan-design substitutes. Included Health remains differentiated by integrated navigation plus clinical delivery, specialty depth, and public LGBTQ+ support, but AI-led navigation is quickly commoditizing and employers under roughly 9% cost trend are increasingly rewarding vendors that pair simplification with hard economic levers.
sections:
- id: landscape-and-buyer-requirements
  title: Landscape and buyer requirements
  body: 'Included Health competes in a category that has shifted from isolated digital-health point solutions toward employer demand for a single benefits and care front door. Business Group on Health, Mercer, UnitedHealthcare, and Cigna all describe the same macro setup for 2026: buyers are facing elevated medical and pharmacy trend, benefits teams are stretched, and employers are increasingly willing to use steerage, alternative plans, and more prescriptive navigation to control cost. That backdrop matters because the buyer is no longer just asking whether a vendor can answer questions; the buyer is asking whether the vendor can reduce fragmentation, guide members to high-value providers, and prove economic impact. In that market, the most relevant comparison set for Included Health is not every virtual-care vendor. It is the smaller set of platforms that try to own the employee experience across navigation, clinical guidance, and cost control, plus adjacent alternatives that can win the
    same budget by offering deeper pharmacy or plan-design leverage.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: direct-navigation-rivals
  title: Direct navigation rivals
  body: 'The direct rival set starts with Transcarent, Quantum Health, Rightway, and HealthJoy, with Accolade now relevant mainly as legacy capability folded into Transcarent. Transcarent is the closest integrated challenger because the Accolade deal filled its primary-care and advocacy gaps while preserving Transcarent’s pharmacy and AI narrative. Quantum remains the strongest pure-play navigation incumbent: it offers flexible deployment, strong steerage language, and mature employer messaging around claims savings, but it still overlays existing clinical assets more than it owns them. Rightway is narrower clinically, yet more economically opinionated than most rivals because it couples navigation to a transparent PBM model and a pharmacy-spend reduction story. HealthJoy sits lighter in the stack than Included Health: it is increasingly ambitious on AI and orchestration, but it still looks more like a benefits operating system and activation layer than a delivery platform with owned specialty
    care. This is why Included Health’s differentiation must be judged not against a single rival, but against several different ways buyers can solve the same job.'
