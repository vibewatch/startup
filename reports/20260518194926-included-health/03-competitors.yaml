tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Platform
  - Category
  - Scale / status
  - Primary buyer
  - Key strength versus Included Health
  - Key limitation versus Included Health
  rows:
  - - Included Health
    - Integrated navigation + clinical delivery
    - '>4% trend reduction claim; 4,000+ specialists; specialty clinic; LGBTQ+ support'
    - Large employers and health plans
    - Broad all-in-one navigation, advocacy, virtual, specialty, and inclusive-care story
    - Current public pricing and fresh footprint disclosure are limited
  - - Transcarent
    - Integrated navigation + care + pharmacy
    - 20M+ members; 1,700+ employer/plan clients after Accolade
    - Self-insured employers and health plans
    - Closest breadth rival; strong AI and pharmacy narrative
    - Less differentiated publicly on inclusive care and culturally competent support
  - - Quantum Health
    - Pure-play navigation incumbent
    - Three-tier navigation suite; 6% year-1 and 10% year-3 claims-savings claim
    - Self-funded employers keeping incumbent carriers
    - Navigation credibility, provider steerage, and early-intervention story
    - Less owned clinical delivery than Included Health
  - - Rightway
    - Navigation + transparent PBM
    - 2M navigation members; 2M PBM members; 30+ Fortune 500 clients
    - Employers prioritizing pharmacy trend control
    - Harder economic story via rebate pass-through and pharmacy savings
    - Narrower specialty and virtual-care breadth
  - - HealthJoy
    - Benefits operating system / navigation overlay
    - 1,800+ employers; 1M+ members
    - Employers managing fragmented vendor stacks
    - Strong activation and point-solution orchestration story
    - Little evidence of owned primary, specialty, or mental-health delivery
  - - Teladoc + BetterHelp
    - Virtual-care scale platform
    - $2.53B 2025 revenue; 97-100M U.S. Integrated Care members 2026 outlook
    - Employers, health plans, and channel partners
    - Largest public virtual-care scale and visible channel packaging
    - Navigation and claims advocacy are not core differentiators
  - - Firefly Health
    - Clinically integrated health plan / virtual PCP alternative
    - 82.7% of U.S. population within 15 miles of partner access; 2,000+ clinics
    - Employers open to alternative plan design
    - Stronger plan-design control and primary-care accountability
    - Much narrower navigation and benefits-administration story
  - - Accolade legacy
    - Advocacy + virtual primary care + expert opinion
    - Standalone public rival ended with 2025 merger into Transcarent
    - Legacy Accolade employer and plan buyers
    - Legacy brand equity in advocacy and second opinion
    - No longer independent in 2026
  notes: Rows emphasize public, source-backed scale markers and strategic position; private-company contract pricing and some current member counts remain undisclosed.
