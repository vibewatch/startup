- id: virtual-care-and-plan-design-alternatives
  title: Virtual-care and plan-design alternatives
  body: 'Teladoc, BetterHelp, and Firefly are not pure navigation peers, but they are credible alternatives in the same employer budget conversation because they cover meaningful pieces of the same job-to-be-done. Teladoc Primary360 offers a mature virtual-primary-care service with nurses, care coordinators, expert opinion, and a published channel-price example through Independence Blue Cross. BetterHelp adds consumer mental-health reach, though it functions more as a substitute for therapy access than as a benefits-navigation platform. Firefly is a different kind of threat: instead of building a broad point-solution marketplace, it argues that employers should solve cost and access through a clinically integrated health plan built around primary care, specialist steerage, and risk-sharing. These alternatives matter because they can beat Included Health on one dimension at a time—virtual-care scale, packaging simplicity, or plan-design control—even if they do not replicate Included Health’s
    full mix of navigation, claims help, specialty support, and inclusive care.'
