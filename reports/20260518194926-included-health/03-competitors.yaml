  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: footprint-disclosure
    missingEvidence: Current employer-client count, covered-member count, and contract mix for Included Health disclosed on a like-for-like basis with Transcarent, Quantum, Rightway, and Teladoc.
    whyItMatters: Without current footprint disclosure, it is hard to benchmark Included Health's actual commercial scale and enterprise traction against public or newly merged competitors.
    diligencePath: Request the latest employer count, covered lives, health-plan channels, and renewal metrics directly from company materials or data room.
    relatedQuestionRefs:
    - QP016
  - type: missing-source
    severity: material
    topic: apples-to-apples-outcomes
    missingEvidence: Independent side-by-side benchmarking of navigation savings, engagement, and clinical outcomes across Included Health, Transcarent, Quantum, and Rightway.
    whyItMatters: Current public evidence is mostly vendor-authored, making moat durability and ROI comparisons directionally useful but not decisive.
    diligencePath: Ask for consultant scorecards, broker evaluation grids, or matched-client case studies that compare multiple platforms on consistent definitions.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Standard PMPM, shared-savings, implementation, and guarantees for Included Health, Transcarent, Quantum, Rightway, HealthJoy, and Firefly.
    whyItMatters: The buyer's real decision depends on net economics, but public price visibility is weak outside channel-specific Teladoc examples and a few vendor claims.
    diligencePath: Collect current proposal decks or sample contracts from vendors and brokers, then normalize PMPM, minimums, guarantees, and carve-out assumptions.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
