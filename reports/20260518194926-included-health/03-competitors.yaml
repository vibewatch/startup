- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Commercial model
  - Economic lever
  - Public price visibility
  - Buyer implication
  rows:
  - - Included Health
    - Employer-sponsored bundle spanning navigation, advocacy, and virtual/specialty care
    - Trend reduction plus better access and support
    - Low
    - Strong breadth, but buyers need diligence to compare realized economics
  - - Transcarent
    - Platform plus care experiences and pharmacy offerings after Accolade
    - Integrated breadth and cost takeout across care episodes
    - Low
    - Closest breadth rival, but contract economics remain negotiated and opaque
  - - Quantum Health
    - Navigation overlay or deeper clinical-integration tiers on top of existing carriers
    - Provider steerage, early intervention, and claims savings
    - Low
    - Easy to add without full plan replacement, appealing to cautious buyers
  - - Rightway
    - Transparent PBM admin fee plus care navigation
    - 100% rebate pass-through, refund if spend exceeds estimate, pharmacy redirection
    - Medium
    - Clearer fiduciary and drug-spend economics than most navigation rivals
  - - Teladoc
    - Health-plan or employer virtual-care bundle sold through channels such as IBX
    - Low incremental PCPM add-on for virtual and Primary360 access
    - High
    - Visible channel pricing can make Teladoc easier to benchmark on narrow virtual-care use cases
  - - HealthJoy
    - Benefits operating system and navigation overlay on employer benefit stack
    - Activation, orchestration, and cost avoidance across existing vendors
    - Low
    - Lighter-weight and easier to frame than owned-care platforms, but harder to compare on clinical ROI
  - - Firefly
    - Clinically integrated health-plan model
    - Primary-care ROI, specialist steerage, and risk-sharing cost control
    - Low
    - Potentially compelling where employers will consider deeper plan redesign
  notes: Public list pricing is scarce across the category; the IBX Teladoc example is a channel-specific benchmark, not a universal enterprise contract rate.
