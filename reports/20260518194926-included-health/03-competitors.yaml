- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Included Health moat claim
  - Pressure source
  - Risk level
  - Why it matters
  - Diligence ask
  rows:
  - - All-in-one navigation plus clinical delivery
    - Transcarent after Accolade
    - High
    - Transcarent now covers advocacy, primary care, pharmacy, and AI on one platform
    - Request apples-to-apples outcome, implementation, and engagement data versus Transcarent
  - - Inclusive LGBTQ+ and culturally competent support
    - Rivals can add marketing and lighter inclusive services
    - Medium
    - This is one of the clearest public brand differentiators but needs proof of member-level value
    - Validate adoption, retention, and care-quality outcomes for LGBTQ+ members
  - - Specialty clinic plus expert-opinion depth
    - Teladoc, Transcarent, and Firefly continue expanding virtual-specialty and coordinated-care models
    - Medium-High
    - Specialty breadth matters in high-cost employer categories such as cancer and obesity
    - Test whether specialty use cases generate superior steerage and savings
  - - AI-enhanced navigation
    - Quantum, HealthJoy, carriers, and Transcarent now market AI heavily
    - High
    - AI is rapidly becoming expected rather than unique
    - Focus diligence on workflow completion, accuracy, and measured savings instead of AI branding
  - - Breadth without plan-control economics
    - Rightway and Firefly can win CFO buyers with clearer pharmacy or plan-accountability levers
    - High
    - Employers under cost pressure may prioritize hard economics over breadth
    - Quantify when Included Health wins on spend control versus when buyers need plan redesign or PBM change
  notes: Risk levels are analyst judgments grounded in retained public evidence; the table is designed to surface where breadth alone may not hold the buyer decision.
