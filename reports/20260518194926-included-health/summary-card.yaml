summary:
  headline: >
    Included Health looks like a credible late-stage digital-health platform with product breadth, marquee buyer proof,
    and visible profitability, but the lack of audited financial disclosure, retention transparency, and fresh price
    discovery keeps the investment case in research-more territory.
