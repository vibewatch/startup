    - Core market because Included Health sells navigation and advocacy as an employer or payer solution
  - - Virtual primary and urgent care
    - Employer-paid virtual primary care, urgent care, triage, after-hours access
    - Unaffiliated consumer telehealth subscriptions and Medicare-only telehealth programs
    - Employer, payer, member within employer benefit design
    - Core adjacency because employers increasingly contract for virtual primary care beyond health-plan networks
  - - Behavioral health and resilience
    - Virtual behavioral health, mental-health triage, resiliency tools, parity-sensitive access support
    - Standalone wellness apps with no employer contract or no clinical workflow integration
    - Employer, payer, employee and dependent
    - Core adjacency because mental-health access gaps and utilization growth are persistent employer pain points
  - - Specialty support and expert opinion
    - Expert medical opinion, cancer support, metabolic care, women’s health, specialty navigation, centers-of-excellence steerage
    - Hospital revenue outside employer benefit steering or consumer-only specialty telehealth
    - Employer, payer, employee and dependent
    - Critical adjacency because catastrophic claims and specialty fragmentation dominate buyer pain
  - - Excluded channel scope
    - None
    - Medicare-first navigation, Medicaid care management, small fully insured products, consumer direct-pay care
    - Government payer or consumer
    - Excluded because Included Health’s disclosed employer positioning centers on employers and health plans rather than public-program or direct-pay distribution
  notes: Boundary is drawn around employer- and payer-purchased navigation plus virtual and specialty support; public-program and consumer-only spend are excluded even when clinically adjacent.
