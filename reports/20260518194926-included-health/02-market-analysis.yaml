  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: integrated-market-sizing
    missingEvidence: A clean U.S. employer-only TAM or SAM for integrated navigation plus virtual primary care plus specialty support.
    whyItMatters: Public analyst reports overlap and cannot be summed cleanly, so valuation and share assumptions can be overstated without a disciplined bottom-up model.
    diligencePath: Build a bottoms-up model using covered lives, eligible employer counts, and disclosed pricing bands from management or customer references rather than relying on blended analyst categories.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: included-revenue-mix
    missingEvidence: Current revenue mix across navigation, primary care, behavioral health, expert opinion, and specialty offerings.
    whyItMatters: Without product-mix disclosure, it is hard to know whether Included Health is already monetizing the broad platform strategy or still relying on narrower legacy lines.
    diligencePath: Request management-level revenue segmentation or triangulate from large customer contracts and product attachments during diligence.
    relatedQuestionRefs:
    - QM027
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Typical employer contract sizes, renewal rates, performance guarantees, and risk-based economics for Included Health.
    whyItMatters: The market increasingly buys on short contracts and measurable outcomes, so contract structure is central to durability and valuation quality.
    diligencePath: Ask for cohort-level retention, PEPM or PEPY pricing ranges, guarantee structure, and benchmark comparisons against other navigation vendors.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: trend-reduction-attribution
    missingEvidence: A decomposition of Included Health’s claimed >4% trend reduction into navigation, steerage, direct virtual care, and specialty interventions.
    whyItMatters: Attribution matters for deciding whether the company’s moat comes from software-led navigation, clinician supply, specialty pathways, or favorable customer mix.
    diligencePath: Request customer cohort studies that isolate savings by intervention type and compare realized savings against matched-control or pre/post baselines.
    relatedQuestionRefs:
    - QM029
