- id: TM004
  title: Growth drivers, constraints, and regulatory backdrop
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for market adoption
  - Diligence ask
  rows:
  - - Employer medical trend near 9% before mitigation
    - Driver
    - Current / 2026
    - Raises urgency for navigation, steerage, and better benefits economics
    - Validate how much of buyer savings comes from plan design versus vendor performance
  - - GLP-1 utilization and pharmacy cost pressure
    - Driver
    - Current / 2026-2027
    - Pushes buyers toward integrated navigation, prior authorization support, and better obesity or metabolic pathways
    - Request Included Health-specific approach to obesity and pharmacy economics
  - - Cancer and catastrophic-claim concentration
    - Driver
    - Current
    - Supports specialty navigation, expert medical opinion, and centers-of-excellence steerage
    - Test whether Included Health’s specialty expansion materially changes high-cost-claim outcomes
  - - Mental-health utilization plus parity rule requirements
    - Driver and constraint
    - Current / 2026
    - Makes integrated access and quality management more valuable but raises compliance burden on benefit design and networks
    - Review MHPAEA support, network-data readiness, and mental-health quality reporting
  - - Short contracts and outcomes-based purchasing
    - Constraint
    - Current
    - Vendors must prove outcomes quickly or risk replacement
    - Ask for renewal rates, risk terms, and evidence by employer cohort
  - - Telehealth policy extension through 2027
    - Driver
    - Current / 2027
    - Stabilizes provider supply and virtual workflow assumptions for employer programs
    - Confirm how much Included Health depends on policy continuity beyond 2027
  - - AI adoption and privacy sensitivity
    - Mixed
    - Current
    - Improves member demand for digital navigation but raises governance and trust requirements
    - Assess AI governance, privacy posture, and enterprise guardrails
  notes: Rows combine buyer-demand drivers with adoption constraints because both determine whether integrated navigation platforms gain budget share or lose it to plan redesign and vendor churn.
