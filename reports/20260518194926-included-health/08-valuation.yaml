- id: scenario-analysis-and-valuation-stance
  title: 'Scenario analysis and valuation stance: still-unicorn quality, but the price remains the whole debate'
  body: 'Because Included has not disclosed current revenue, margin, or a fresh financing round, the right analytic move is not to declare a mark but to price scenarios. The bear case assumes Included behaves more like a compressed navigation asset than a premium software compounder: modest growth proof, limited public cash-flow transparency, and investor skepticism around category outcomes. That points toward roughly 1-2x revenue, which would matter a great deal if current revenue is lower than bullish private-market chatter assumes. The base case credits what is publicly positive—profitability, continued product shipping, and large-customer proof—while still respecting that there is no recent market-clearing primary price. On that basis, a 2.5-4.0x revenue band is the most defensible diligence screen.


    The bull case exists, but only conditionally. To justify 5-6x revenue and revisit the 2021 high-water narrative, Included would need to look much more like Hinge than like Accolade: audited strong growth, durable gross margins, predictable renewals, and evidence that integrated navigation plus virtual care creates unusually strong buyer economics. Until that proof exists, the latest defensible stance is not that Included is cheap or broken; it is that the company likely remains a still-private unicorn-scale asset whose fair value is highly price sensitive. If a seller anchors on old-cycle expectations, the stance is stretched. If entry is materially below the old peak and management can open the data room on revenue quality, the stance can move toward fair.'
