- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Point
  - What supports it now
  - What would change the view
  rows:
  - - Thesis
    - Integrated operating model still looks active
    - Post-2024 launches in plan design, specialty care, and provider navigation
    - If launches do not convert into measurable renewals or savings, downgrade
  - - Thesis
    - Large-customer proof still exists
    - CalPERS remains live and management cites about 300 employers and health plans
    - If flagship accounts fail to renew, the scale premium disappears
  - - Thesis
    - Capital structure may be cleaner than late-stage peers
    - Management says the cap table is all common and the company did not need to raise
    - Obtain the actual cap table before underwriting downside proceeds
  - - Anti-thesis
    - Exact current valuation inputs are missing
    - No disclosed current ARR, gross margin, free cash flow, or fresh primary round
    - A lender-style operating package would materially improve confidence
  - - Anti-thesis
    - Category comps show compression
    - Accolade cleared at a modest takeout multiple despite scale and client reach
    - Sustained superior growth and profitability would justify a higher band
  - - Anti-thesis
    - Execution risk never fully disappeared
    - Included restructured headcount during the reset and still relies on private disclosures
    - Clean renewal, retention, and operating metrics would weaken this concern
  notes: The anti-thesis is valuation-specific. Included can be a strong company and still be a poor investment at the wrong price.
