  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-opacity
    missingEvidence: A management-certified current ARR or revenue figure with segmentation across navigation, virtual care, and specialty offerings.
    whyItMatters: Without a live top-line number, every current valuation range remains illustrative rather than investable.
    diligencePath: Request the latest board deck or lender-style operating package with current ARR, recognized revenue, and segment mix.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: margin-and-cashflow-opacity
    missingEvidence: Current gross margin, operating margin, free cash flow, and cash-balance data for the combined company.
    whyItMatters: Profitability is directionally positive, but investors cannot distinguish sustainable cash generation from temporary cost discipline without the underlying margin stack.
    diligencePath: Request the latest income statement, cash-flow statement, and management bridge explaining how profitability was achieved and whether it is durable.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: current-price-discovery
    missingEvidence: Recent secondary trades, 409A history, or a new primary financing price for Included Health common.
    whyItMatters: The thesis turns on whether today’s seller expectations are closer to compressed public comps or to an old private-cycle high-water mark.
    diligencePath: Request cap-table history, 409A reports, and any brokered secondary prints since the shelved IPO period.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-cleanliness
    missingEvidence: A current cap table showing security classes, preference rights, liquidation waterfall, and employee-option dilution.
    whyItMatters: Management’s common-only comment is encouraging but insufficient for underwriting downside proceeds and investor return ranking.
    diligencePath: Obtain the current capitalization table and preferred-stock terms from counsel or finance before any price discussion.
    relatedQuestionRefs:
    - QV009
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: renewal-and-savings-cohorts
    missingEvidence: Customer cohort retention, claims-savings proof, and renewal outcomes for CalPERS, Walmart-scale employers, and health plans.
    whyItMatters: Comparable multiples depend on whether Included’s integrated model drives repeatable economic savings rather than one-off customer wins.
    diligencePath: Request customer renewal dashboards, cohort NRR, claims-savings studies, and references from large current accounts.
    relatedQuestionRefs:
    - QV025
    - QV026
    relatedTableRefs:
    - TV002
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: tv004-comparable-coverage-gap
    missingEvidence: One or two additional directly relevant navigation or integrated-care comparables with publicly disclosed current valuation anchors.
    whyItMatters: TV004 is intentionally selective, but more comparable coverage would tighten the base-case range and reduce dependence on a small set of public comps.
    diligencePath: Add another public or transaction comp only if it brings a clearly disclosed current multiple or transaction price that is closer to Included’s integrated model.
    relatedQuestionRefs:
    - QV018
    - QV020
    relatedTableRefs:
    - TV004
