- id: capital-history-and-risks
  title: Capital history, private status, and adverse signals
  body: |-
    Capital visibility is materially weaker than product or partner visibility. Public reporting shows that the company filed a confidential S-1 for a planned 2022 IPO, then stepped back as the market turned. Business Insider said Included Health was private and profitable by January 2025, with double-digit growth since 2021 and roughly 300 employers and health plans, while Tripp said the cap table consisted entirely of common stock. Public sources are much less helpful on current valuation, current total capital raised, or any debt facilities for the present company. The best public valuation point is stale: Becker's cited a $12.71 billion figure and more than 1,000 employees in October 2021, while Healthcare Dive framed the original merger as an all-stock deal between companies valued at roughly $1.34 billion and $875 million.

    The key adverse signal to preserve is the July 2022 restructuring, when MobiHealthNews reported a workforce reduction of less than 6%. That is not existential on its own, but it shows the company was not immune to the digital-health reset after the 2021 boom. Overall, the public record supports a view of an active, still-private platform business with meaningful partner traction and real product velocity, but it does not support precision on current valuation, headcount, or audited financials.
