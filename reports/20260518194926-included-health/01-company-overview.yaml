- id: commercial-scale-and-operations
  title: Commercial scale and post-May-2024 operating proof
  body: |-
    The strongest evidence that Included Health is still operating and expanding after May 2024 comes from named partner and customer pathways, not from financial filings. CalPERS selected Included Health in June 2024 for PPO member navigation, virtual care, and population-health support, with access beginning in January 2025; CalPERS member pages and the Included Health microsite show the service stack is active in the market, including provider search, deductible tracking, and claims tools. Blue Cross and Blue Shield of Minnesota separately expanded Doctor On Demand by Included Health into networked virtual primary care in January 2026, while Walmart remained a named employer case study for national virtual primary care rollout.

    Operationally, the company continues to add new service layers. The 2024 Specialty Care Clinic added rapid virtual specialty access and a 4,000-plus specialist network tied to 40-plus hospitals and health systems. Provider Connect and other 2026 releases suggest Included Health is pushing beyond generic “navigation” into default steering and care-routing infrastructure for employers and health plans. Public evidence does not prove renewal rates or utilization intensity, but it does establish ongoing delivery, enterprise distribution, and public-sector traction.
  claimRefs:
