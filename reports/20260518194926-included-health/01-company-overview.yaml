  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current valuation, total capital raised, current investor roster, and any debt or secondary financing since the 2021 merger.
    whyItMatters: These figures directly affect ownership dilution, downside protection, and any judgment about exit readiness or financing pressure.
    diligencePath: Request the current cap table, board consents, round history, any lender agreements, and the last board-approved 409A or financing valuation bridge.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO023
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current audited revenue, run-rate, margins, and cash burn for the present Included Health entity.
    whyItMatters: Private/profitable status is directionally useful, but valuation and credit risk cannot be judged responsibly without a current financial baseline.
    diligencePath: Request the latest audited financials or at minimum a board package showing revenue, gross margin, EBITDA or operating income, and cash runway.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A post-2024 employee count or organizational census for the current company.
    whyItMatters: Public headcount evidence is stale and makes it hard to judge operating leverage after the 2022 restructuring and 2024-2026 product expansion.
    diligencePath: Request a current HR census or payroll summary and reconcile it to the operating plan and the functions supporting Dot, Provider Connect, and specialty care.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: TO002 public leadership coverage
    missingEvidence: A current public leadership or board page that confirms the full executive bench and the up-to-date board roster.
    whyItMatters: The leadership table is intentionally partial because public sources clearly confirm only selected executives and one dated board roster.
    diligencePath: Request the latest org chart, board deck, or company leadership page export and reconcile it to public announcements.
    relatedQuestionRefs:
    - QO004
    - QO006
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: TO004 chronology completeness
    missingEvidence: A complete financing and governance chronology that includes precise round dates, any secondary or debt events, and any omitted post-2021 milestones.
    whyItMatters: The milestone table is the chronology of record for later chapters, so missing dated events can distort capital and governance context.
    diligencePath: Request the internal financing history, board minutes for major appointments, and a canonical company timeline used for investor materials.
    relatedQuestionRefs:
    - QO015
    - QO017
    - QO018
    relatedTableRefs:
    - TO004
