- id: ai-roadmap-and-product-velocity
  title: AI roadmap and product velocity
  body: |-
    Included Health's most visible 2025-2026 product narrative is the attempt to turn navigation into a data-rich, clinician-backed operating system. The January 2026 alternative plan design moved the company closer to a PCP-centered benefit architecture with transparent pricing and AI-powered engagement. One month earlier, Included Health had expanded Dot into a clinician-in-the-loop assistant that draws on medical history, claims, and benefits data; management said Dot had already processed more than ten billion tokens across large employer deployments. In May 2026, the company layered Provider Connect on top of this stack as a routing tool for high-quality, in-network care.

    These releases are still mostly company-claimed, but they are not happening in isolation. Google Research announced a nationwide randomized study with Included Health in February 2026 to evaluate conversational AI in real-world virtual care workflows, moving beyond simulation and retrospective datasets. That does not validate Included Health's product metrics yet, but it is meaningful outside-in evidence that the company is active enough — and technically credible enough — to support prospective research in live care settings.
  claimRefs:
  - CO014
