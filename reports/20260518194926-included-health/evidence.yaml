evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current valuation, total capital raised, current investor roster, and any debt or secondary financing since the
      2021 merger.
    whyItMatters: >-
      These figures directly affect ownership dilution, downside protection, and any judgment about exit readiness or
      financing pressure.
    diligencePath: >-
      Request the current cap table, board consents, round history, any lender agreements, and the last board-approved
      409A or financing valuation bridge.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO023
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current audited revenue, run-rate, margins, and cash burn for the present Included Health entity.
    whyItMatters: >-
      Private/profitable status is directionally useful, but valuation and credit risk cannot be judged responsibly
      without a current financial baseline.
    diligencePath: >-
      Request the latest audited financials or at minimum a board package showing revenue, gross margin, EBITDA or
      operating income, and cash runway.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A post-2024 employee count or organizational census for the current company.
    whyItMatters: >-
      Public headcount evidence is stale and makes it hard to judge operating leverage after the 2022 restructuring and
      2024-2026 product expansion.
    diligencePath: >-
      Request a current HR census or payroll summary and reconcile it to the operating plan and the functions supporting
      Dot, Provider Connect, and specialty care.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: TO002 public leadership coverage
    missingEvidence: A current public leadership or board page that confirms the full executive bench and the up-to-date board roster.
    whyItMatters: >-
      The leadership table is intentionally partial because public sources clearly confirm only selected executives and
      one dated board roster.
    diligencePath: >-
      Request the latest org chart, board deck, or company leadership page export and reconcile it to public
      announcements.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: TO004 chronology completeness
    missingEvidence: >-
      A complete financing and governance chronology that includes precise round dates, any secondary or debt events,
      and any omitted post-2021 milestones.
    whyItMatters: >-
      The milestone table is the chronology of record for later chapters, so missing dated events can distort capital
      and governance context.
    diligencePath: >-
      Request the internal financing history, board minutes for major appointments, and a canonical company timeline
      used for investor materials.
    relatedQuestionRefs:
      - QO015
      - QO017
      - QO018
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: integrated-market-sizing
    missingEvidence: A clean U.S. employer-only TAM or SAM for integrated navigation plus virtual primary care plus specialty support.
    whyItMatters: >-
      Public analyst reports overlap and cannot be summed cleanly, so valuation and share assumptions can be overstated
      without a disciplined bottom-up model.
    diligencePath: >-
      Build a bottoms-up model using covered lives, eligible employer counts, and disclosed pricing bands from
      management or customer references rather than relying on blended analyst categories.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: included-revenue-mix
    missingEvidence: Current revenue mix across navigation, primary care, behavioral health, expert opinion, and specialty offerings.
    whyItMatters: >-
      Without product-mix disclosure, it is hard to know whether Included Health is already monetizing the broad
      platform strategy or still relying on narrower legacy lines.
    diligencePath: >-
      Request management-level revenue segmentation or triangulate from large customer contracts and product attachments
      during diligence.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Typical employer contract sizes, renewal rates, performance guarantees, and risk-based economics for Included
      Health.
    whyItMatters: >-
      The market increasingly buys on short contracts and measurable outcomes, so contract structure is central to
      durability and valuation quality.
    diligencePath: >-
      Ask for cohort-level retention, PEPM or PEPY pricing ranges, guarantee structure, and benchmark comparisons
      against other navigation vendors.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: trend-reduction-attribution
    missingEvidence: >-
      A decomposition of Included Health’s claimed >4% trend reduction into navigation, steerage, direct virtual care,
      and specialty interventions.
    whyItMatters: >-
      Attribution matters for deciding whether the company’s moat comes from software-led navigation, clinician supply,
      specialty pathways, or favorable customer mix.
    diligencePath: >-
      Request customer cohort studies that isolate savings by intervention type and compare realized savings against
      matched-control or pre/post baselines.
    relatedQuestionRefs:
      - QM029
  - type: private-evidence-only
    severity: material
    topic: footprint-disclosure
    missingEvidence: >-
      Current employer-client count, covered-member count, and contract mix for Included Health disclosed on a
      like-for-like basis with Transcarent, Quantum, Rightway, and Teladoc.
    whyItMatters: >-
      Without current footprint disclosure, it is hard to benchmark Included Health's actual commercial scale and
      enterprise traction against public or newly merged competitors.
    diligencePath: >-
      Request the latest employer count, covered lives, health-plan channels, and renewal metrics directly from company
      materials or data room.
    relatedQuestionRefs:
      - QP016
  - type: missing-source
    severity: material
    topic: apples-to-apples-outcomes
    missingEvidence: >-
      Independent side-by-side benchmarking of navigation savings, engagement, and clinical outcomes across Included
      Health, Transcarent, Quantum, and Rightway.
    whyItMatters: >-
      Current public evidence is mostly vendor-authored, making moat durability and ROI comparisons directionally useful
      but not decisive.
    diligencePath: >-
      Ask for consultant scorecards, broker evaluation grids, or matched-client case studies that compare multiple
      platforms on consistent definitions.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Standard PMPM, shared-savings, implementation, and guarantees for Included Health, Transcarent, Quantum, Rightway,
      HealthJoy, and Firefly.
    whyItMatters: >-
      The buyer's real decision depends on net economics, but public price visibility is weak outside channel-specific
      Teladoc examples and a few vendor claims.
    diligencePath: >-
      Collect current proposal decks or sample contracts from vendors and brokers, then normalize PMPM, minimums,
      guarantees, and carve-out assumptions.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Current CAC, payback, gross margin, and NRR values by major product line or buyer cohort.
    whyItMatters: >-
      Without those numbers it is impossible to test whether profitability is durable or whether new product expansion
      is earning an acceptable return.
    diligencePath: >-
      Request a management P&L bridge with gross margin, sales efficiency, retention, and cohort economics for
      navigation, virtual care, and specialty care.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI006
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, free cash flow, and minimum liquidity covenant thresholds.
    whyItMatters: >-
      The CEO’s comment about a strong cash position is directionally positive but does not quantify runway or financing
      dependency.
    diligencePath: >-
      Request the latest balance sheet, cash flow statement, and board materials summarizing runway under base and
      downside cases.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
      - TI006
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: >-
      Any credit facilities, receivables financing, contingent guarantee obligations, or earn-out liabilities tied to
