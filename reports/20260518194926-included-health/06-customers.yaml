    - Attach rates and revenue share by channel are unknown
  - - Member-facing satisfaction surface
    - Member experience and support operations
    - Individual members
    - Included Health testimonials versus Trustpilot complaints
    - Experience quality can influence utilization and renewal narratives
    - Consumer reviews are non-random and not a churn proxy
