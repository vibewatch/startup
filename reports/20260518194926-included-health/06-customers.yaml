- id: named-customer-proof-and-roi
  title: Named customer proof is strongest where deployment scope and outcome math are both public
  body: 'The strongest named proof points are CalPERS and Walmart because both move beyond logo use into deployment scope and performance language. CalPERS gives Included Health a public-purchaser reference with roughly 400,000 PPO members, explicit accountability for navigation and virtual care, and a five-year at-risk construct tied to cost and quality. Walmart gives the company a rare employer case with rollout history plus clinical and financial outcomes: an 11% total-cost-of-care reduction, chronic-condition and preventive use beyond urgent care, and biometric improvements for diabetes and hypertension.


    Other named references broaden the customer map even when their proof quality is weaker. Salesforce and Windstream show that Included Health can win large or distributed employers. Point32Health, SCAN, and Blue Cross and Blue Shield of Minnesota show payer and Medicare pathways. Trustmark and HealthComp show channel leverage through administrators. The gap is that most of those proofs stop at product availability, member support design, or qualitative results rather than disclosing attach rates, renewal outcomes, PMPM economics, or audited before-and-after baselines.'
