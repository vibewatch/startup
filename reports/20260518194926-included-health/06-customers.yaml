figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Journey from buyer pain discovery through contracting, member launch, active use, and expansion across employer, payer, and channel contexts.
  approximationNotes: Stages are synthesized from public case studies, partner announcements, and plan-network pages; conversion rates between stages are not publicly disclosed.
  data:
    nodes:
    - id: pain
      label: Buyer pain identification
      description: Employer, payer, or public purchaser identifies rising medical trend, fragmented member experience, or inequitable access as the trigger for evaluating a navigation partner.
    - id: selection
      label: Vendor selection and contracting
      description: Benefits leaders, plan strategists, or administrators choose Included Health directly or embed it through a partner such as Blue Shield, BCBS Minnesota, Trustmark, or HealthComp.
    - id: launch
      label: Member launch and onboarding
      description: Members are introduced to a single app, navigation team, or plan-branded support layer that routes them into covered benefits and care options.
    - id: virtualcare
      label: Virtual primary / behavioral engagement
      description: Members establish a longitudinal care relationship or use urgent and behavioral services, often inside the payer network or employer-sponsored benefit design.
    - id: escalation
      label: Specialty, community, or in-person escalation
      description: Care teams move members into specialty care, community support, imaging, referrals, same-day office visits, or external partners such as Bicycle Health.
    - id: renewal
      label: Renewal, expansion, or re-bid
      description: Buyers evaluate satisfaction, measured outcomes, and operational performance to decide whether to deepen the relationship or reopen the market.
  claimRefs:
  - CU001
  - CU024
  - CU029
  - CU036
  - CU039
  - CU044
- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: standard
  summary: Flow showing how Included Health typically expands from navigation entry point into longitudinal care, community programs, and partner handoffs.
  approximationNotes: This is a causal implementation map, not a quantified funnel; public sources describe the sequence more clearly than they disclose stage-by-stage conversion rates.
  data:
    nodes:
    - id: buyer
      label: Buyer chooses a consolidated platform
      detail: Case studies and partner launches emphasize one front door for navigation, member services, and care routing.
      tone: neutral
    - id: navigation
      label: Navigation and advocacy go live
      detail: Members get benefits guidance, provider matching, and support for clinical, financial, or administrative questions.
      tone: positive
    - id: pcp
      label: Virtual primary care deepens engagement
      detail: Walmart and BCBS Minnesota show movement from urgent-only access into ongoing primary-care relationships.
      tone: positive
    - id: community
      label: Community or specialty pathways activate
      detail: Point32Health, SCAN, and Bicycle illustrate extension into LGBTQ+ care, communities support, and OUD treatment access.
      tone: positive
    - id: finalmile
      label: In-person handoff closes the loop
      detail: Doctor On Demand care teams and Solv final mile help route members to imaging, specialists, and local offices.
      tone: positive
    - id: review
