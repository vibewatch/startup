- id: TU005
  title: Implementation motion, activation, and care-continuity table
  columns:
  - Implementation step
  - Public example
  - Evidence
  - Member activation / workflow signal
  - Why it matters
  - Gap
  rows:
  - - Buyer selection and consolidation
    - Salesforce, Windstream, Trustmark, HealthComp, CalPERS
    - Case studies and partner launches
    - Single app, single point of entry, or wrapped member-services positioning
    - Included Health sells consolidation, not isolated telehealth
    - Sales-cycle length and win rates are not public
  - - Navigation onboarding
    - Salesforce case study and member stories
    - Salesforce + testimonial pages
    - Easy clinician matching, benefits lookup, and guidance in one place
    - Adoption depends on lowering administrative friction
    - Sample sizes and onboarding conversion rates missing
  - - Virtual primary-care establishment
    - BCBS Minnesota and Walmart
    - Network page, announcement, and Walmart results
    - Dedicated PCP relationship rather than urgent-only visits
    - Moves product from episodic care into longitudinal use
    - Repeat-visit cadence not public
  - - Care-team escalation to in-person care
    - Doctor On Demand microsite and Solv final mile
    - Microsite + independent Solv coverage
    - Imaging, scheduling, specialist, and same-day office handoffs
    - Prevents virtual visits from becoming dead ends
    - Handoff-completion SLA not public
  - - Community navigation
    - Point32Health, SCAN, Black Community coalition
    - Customer announcements
    - Support groups, advocacy, and community resources extend beyond claims help
    - Differentiates buyer value for underserved populations
    - Program penetration not public
  - - Channel implementation
    - Trustmark and HealthComp
    - Partner announcements
    - Administrator-branded navigation and claims support can ride existing client relationships
    - Expands reach without fully direct sales motion
    - Attach rates by client and retention by channel are absent
  notes: Implementation evidence is strongest on workflow design and weakest on funnel conversion, SLA, and activation denominators.
