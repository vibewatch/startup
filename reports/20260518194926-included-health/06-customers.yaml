- id: durability-and-risk
  title: Durability is the weakest public dimension because retention, concentration, and complaints are only partially visible
  body: 'Included Health does show public evidence that members can like the service: the company’s own testimonial page reports a 4.9-out-of-5 rating, and several customer stories emphasize reduced friction, better guidance, or better access. But the durability file is thinner than the acquisition file. None of the reviewed sources disclose NRR, GRR, logo churn, renewal cohorts, or top-customer concentration. Even the biggest references, such as CalPERS and Walmart, prove relevance more than they prove retention. That matters because navigation platforms live or die on utilization, service quality, and annual renewal confidence.


    The adverse evidence is also real, even if imperfect. An archived Trustpilot page showed a 1.8-out-of-5 rating in late 2025 and contained complaints about referrals, billing, glitches, and member-service responsiveness. Those reviews are self-selected and should not be mistaken for enterprise churn data, but they do show that the operational model can create member-friction risk. The bottom line is that Included Health has credible breadth and credible buyer proof, yet public data on renewal durability and customer concentration remain diligence-gated rather than proven.'
