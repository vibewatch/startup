  rows:
  - - Large self-insured employers
    - HR / benefits / finance buyer
    - Employees and dependents
    - Salesforce, Windstream, AT&T, lululemon references on employer page
    - Core direct-sales channel for cost, access, and navigation pain points
    - Public employer-count split and renewal rates are not disclosed
  - - Public purchasers / PPO administrators
    - Public sponsor plus plan administrator
    - PPO members, retirees, and dependents
    - CalPERS with Blue Shield of California and Included Health
    - Shows ability to win large, multi-year, performance-linked contracts
    - Reserve policy, utilization, and renewal math are not public
  - - Commercial health plans
    - Plan strategy / innovation leader
    - Commercial members
    - Point32Health, Compass Rose, CDPHP, and a 1M+ regional plan case
    - Gives white-label or embedded payer distribution
