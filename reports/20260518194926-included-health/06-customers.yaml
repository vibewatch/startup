- id: TU007
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Public signal
  - Potential impact
  - Current mitigation evidence
  - Diligence path
  rows:
  - - Land-and-expand from navigation into broader care
    - Regional plan expansion, Walmart national rollout, BCBS MN PCP launch
    - Increases contract depth and strategic value
    - Integrated care stack and partner ecosystem are visible
    - Ask for module attach rates and revenue by service line
  - - Channel dependence on partners
    - Blue Shield, BCBS MN, Point32Health, SCAN, Trustmark, HealthComp
    - Partner decisions can amplify or constrain reach
    - Multiple channel partners reduce single-distributor dependence
    - Ask for revenue share and top-five channel partners
  - - Public-purchaser concentration unknown
    - CalPERS is unusually large and visible
    - Large contracts can create renewal and service-delivery volatility
    - At-risk structure aligns incentives on one marquee account
    - Ask for top-10 customer revenue and covered-lives share
  - - Sparse named references
    - Many proofs are anonymized or company-curated
    - Makes breadth and renewal quality harder to underwrite
    - Cross-domain corroboration exists for a handful of named wins
    - Ask for customer roster and reference calls
  - - Member-experience complaints
    - Trustpilot snapshot highlights referral, billing, and support issues
    - Can reduce activation, satisfaction, and buyer confidence if persistent
    - Company testimonial pages and care-team workflow offer counter-evidence
    - Ask for complaint rates, SLAs, and first-call-resolution trends
  - - ROI attribution ambiguity
    - Walmart and cost-trend studies are promoted by Included Health and customers
    - Savings may be directionally true but attribution can be over-read
    - External validation exists for methodology, not for every deployment
    - Ask for raw cohorts, controls, and audited savings attribution
  notes: This table mixes upside expansion drivers with durability risks because the same integrated model that enables expansion also raises execution and concentration questions.
