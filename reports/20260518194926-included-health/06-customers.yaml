  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Customer-level NRR, GRR, renewal cohorts, and contract-length disclosure by segment.
    whyItMatters: Without durability metrics, the public record proves acquisition and deployment more than it proves renewal strength.
    diligencePath: Request the last three years of logo retention, revenue retention, and renewal-rate cohorts for employer, payer, TPA, and public-purchaser accounts.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, covered-lives share, and employer-versus-payer mix.
    whyItMatters: Large visible wins such as CalPERS and Walmart can distort perceived breadth if concentration is high.
    diligencePath: Request top-10 customer concentration, top-five partner/channel concentration, and customer mix by revenue and covered lives.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU007
  - type: enumeration-incomplete
    severity: minor
    topic: TU002 public customer roster incomplete
    missingEvidence: A fuller named customer roster with launch date, segment, deployment status, and renewal context.
    whyItMatters: The named-customer proof table is intentionally partial because public references are selective and curated.
    diligencePath: Request a customer-reference sheet or at least a larger named sample that can validate breadth across employers, plans, TPAs, and public buyers.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU025
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: roi-attribution
    missingEvidence: Raw cohort definitions, control groups, and audited savings attribution behind Walmart and employer-trend studies.
    whyItMatters: Public ROI numbers are useful for direction but still leave room for attribution ambiguity and selection effects.
    diligencePath: Request customer-ready outcome studies, methodology appendices, and third-party validation files for named deployments.
    relatedQuestionRefs:
    - QU007
    - QU008
    relatedTableRefs:
    - TU003
    - TU007
  - type: missing-source
    severity: minor
    topic: activation-denominators
    missingEvidence: Launch-to-active-user conversion, app registration, care-team response SLAs, and visit-to-resolution metrics by customer.
    whyItMatters: Implementation quality determines whether promising customer logos actually turn into durable utilization and satisfaction.
    diligencePath: Request activation dashboards for recent launches, including registration, first-use, repeat-use, and escalation timing metrics.
    relatedQuestionRefs:
    - QU009
    - QU016
    - QU023
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: member-complaints
    missingEvidence: Representative complaint-rate, resolution-time, and escalation data to reconcile testimonial scores with adverse review snapshots.
    whyItMatters: Self-selected reviews can overstate problems, but without complaint operations data they still create an execution-risk overhang.
    diligencePath: Request formal complaint logs, response-time SLAs, first-contact-resolution rates, and employer escalation trends for the last 12 months.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU006
    - TU007
acknowledgedWarnings:
- dimension: figureType
  reason: Public sources disclose no numeric time-bucket retention percentages, so a cohort chart would require fabricated values; this chapter uses a matrix to show the gap honestly instead.
