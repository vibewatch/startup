- id: TU006
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Public value
  - Segment
  - Confidence
  - Implication
  - Diligence ask
  rows:
  - - Self-published member rating
    - 4.9 / 5 stars
    - Member stories page
    - Medium
    - Company emphasizes strong member satisfaction
    - Request sample size, time window, and methodology
  - - Walmart repeat in-person step-down
    - ~10% moved to in-person within 21 days after virtual visit
    - Employer VPC users
    - Medium
    - Many issues may have stayed in the virtual workflow
    - Request total eligible-member denominator and repeat-visit rates
  - - Walmart chronic / preventive mix
    - ~30% of VPC patients seen for chronic or preventive care
    - Employer VPC users
    - Medium
    - Use extends beyond simple-sick telehealth
    - Request total visit volume and PCP continuity rate
  - - Follow-up care lift
    - 35% more patients returned for follow-up care
    - Aggregated employer / VPC marketing
    - Low
    - Suggests activation can improve continuity
    - Request named customer cohort and baseline
  - - Utilization-management lift
    - 19% fewer urgent-care visits and 17% fewer hospitalizations among CCM-enrolled members
    - Aggregated case-management marketing
    - Low
    - Navigation may reduce avoidable downstream utilization
    - Request named customer, enrollment size, and study design
  - - Public GRR / NRR / churn disclosure
    - 'null'
    - All customer segments
    - Low
    - Durability is not publicly proven
    - Request NRR, GRR, logo churn, and renewal cohorts
  notes: Null means the public record reviewed for this chapter did not disclose the metric; it does not imply a zero value.
