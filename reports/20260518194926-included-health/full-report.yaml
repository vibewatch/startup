      - number: '2.4'
        title: Regulatory, payment, and AI backdrop
        blocks:
          - type: paragraph
            body: >-
              The current market backdrop is unusually supportive of virtual care access but more demanding on
              compliance and proof. CMS’s February 2026 FAQ extends key Medicare telehealth flexibilities through the
              end of 2027, preserving home-based access and continued billing for RHC and FQHC telehealth. Even though
              Included Health’s core market is employer-sponsored rather than Medicare, these rules still matter because
              they stabilize provider supply, normalize virtual workflows, and keep telehealth infrastructure
              investable. Mental-health parity is moving the opposite way on burden: Lockton’s MHPAEA analysis says
              plans need stronger comparative analyses, more data on network adequacy and reimbursement, and meaningful
              mental-health benefits in every relevant classification, with major design-and-application requirements
              hitting plan years beginning in 2026. In other words, buyers need vendors that can improve access without
              creating parity or network headaches.


              AI adds another layer. Rock Health says Q1 2026 funding remained active but concentrated and that AI is
              now table stakes in digital health. Consumer behavior is changing even faster: a Rock Health survey
              summary says 32% of adults already use AI chatbots for health information and most rely on general-purpose
              tools. That is a tailwind for navigation interfaces, but it also raises privacy and trust risk. The
              practical implication is that the winning vendors are likely to be those that combine member-facing
              convenience with enterprise-grade governance, clinical integration, and contracting discipline.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
