      - number: '3.4'
        title: Differentiation, switching costs, and competitive risks
        blocks:
          - type: paragraph
            body: >-
              Included Health still has a coherent strategic position: it combines navigation, benefits and claims
              support, virtual care, specialty care, and a public inclusion story around LGBTQ+ support that few rivals
              foreground. Those assets give it more clinical depth than Quantum or HealthJoy and more explicit inclusion
              differentiation than Transcarent, Teladoc, or Firefly. But the moat is not absolute. Transcarent is now
              the closest breadth rival, Quantum is proving that agentic AI and provider steerage are no longer unique,
              Rightway can win CFOs with hard PBM economics, Teladoc can bundle virtual care at visible channel prices,
              and Firefly can appeal to employers who want direct plan-level control over utilization. Switching costs
              are real because these products connect to data feeds, care teams, and existing vendor ecosystems, yet
              they are not so high that buyers cannot reconsider at renewal. The durable question for Included Health is
              whether it can keep translating breadth and inclusion into measurable outcomes before AI-assisted
              navigation and clinically integrated alternatives compress the category’s advantage.
