  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Journey from buyer pain discovery through contracting, member launch, active use, and expansion across employer,
      payer, and channel contexts.
    approximationNotes: >-
      Stages are synthesized from public case studies, partner announcements, and plan-network pages; conversion rates
      between stages are not publicly disclosed.
    data:
      nodes:
        - id: pain
          label: Buyer pain identification
          description: >-
            Employer, payer, or public purchaser identifies rising medical trend, fragmented member experience, or
            inequitable access as the trigger for evaluating a navigation partner.
        - id: selection
          label: Vendor selection and contracting
          description: >-
            Benefits leaders, plan strategists, or administrators choose Included Health directly or embed it through a
            partner such as Blue Shield, BCBS Minnesota, Trustmark, or HealthComp.
        - id: launch
          label: Member launch and onboarding
          description: >-
            Members are introduced to a single app, navigation team, or plan-branded support layer that routes them into
            covered benefits and care options.
        - id: virtualcare
          label: Virtual primary / behavioral engagement
          description: >-
            Members establish a longitudinal care relationship or use urgent and behavioral services, often inside the
            payer network or employer-sponsored benefit design.
        - id: escalation
          label: Specialty, community, or in-person escalation
          description: >-
            Care teams move members into specialty care, community support, imaging, referrals, same-day office visits,
            or external partners such as Bicycle Health.
        - id: renewal
          label: Renewal, expansion, or re-bid
          description: >-
            Buyers evaluate satisfaction, measured outcomes, and operational performance to decide whether to deepen the
            relationship or reopen the market.
    claimRefs:
      - CU001
      - CU024
      - CU029
      - CU036
      - CU039
      - CU044
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: standard
    summary: >-
      Flow showing how Included Health typically expands from navigation entry point into longitudinal care, community
      programs, and partner handoffs.
    approximationNotes: >-
      This is a causal implementation map, not a quantified funnel; public sources describe the sequence more clearly
      than they disclose stage-by-stage conversion rates.
    data:
      nodes:
        - id: buyer
          label: Buyer chooses a consolidated platform
          detail: >-
            Case studies and partner launches emphasize one front door for navigation, member services, and care
            routing.
          tone: neutral
        - id: navigation
          label: Navigation and advocacy go live
          detail: >-
            Members get benefits guidance, provider matching, and support for clinical, financial, or administrative
            questions.
          tone: positive
        - id: pcp
          label: Virtual primary care deepens engagement
          detail: Walmart and BCBS Minnesota show movement from urgent-only access into ongoing primary-care relationships.
          tone: positive
        - id: community
          label: Community or specialty pathways activate
          detail: >-
            Point32Health, SCAN, and Bicycle illustrate extension into LGBTQ+ care, communities support, and OUD
            treatment access.
          tone: positive
        - id: finalmile
          label: In-person handoff closes the loop
          detail: >-
            Doctor On Demand care teams and Solv final mile help route members to imaging, specialists, and local
            offices.
          tone: positive
        - id: review
          label: Buyer reviews ROI and service quality
          detail: >-
            Renewal depends on measured outcomes, member experience, and operational reliability, but those metrics are
            only partially public.
          tone: warning
      edges:
        - from: buyer
          to: navigation
          label: Select and launch
        - from: navigation
          to: pcp
          label: Activate care use
        - from: pcp
          to: community
          label: Expand care depth
        - from: community
          to: finalmile
          label: Escalate when needed
        - from: finalmile
          to: review
          label: Measure and renew
    claimRefs:
      - CU024
      - CU029
      - CU036
      - CU037
      - CU039
      - CU044
      - CU046
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Matrix comparing the depth of public proof by named customer cohort, separating deployment specificity from
      outcome specificity and retention visibility.
    approximationNotes: >-
      Cells are qualitative judgments based on public documentation only: strong = named deployment plus measurable
      outcomes; moderate = named deployment with partial detail; weak = public availability without durable renewal
      disclosure.
    data:
      columns:
        - Deployment specificity
        - Outcome specificity
        - Currentness
        - Retention visibility
      rows:
        - label: CalPERS
          values:
            - Strong — named contract and member counts
            - Strong — at-risk quality and trend guarantees
            - Current — 2025-2029 contract horizon
            - Weak — no public renewal or satisfaction series
        - label: Walmart
          values:
            - Strong — multi-year and national rollout
            - Strong — cost and clinical outcomes published
            - Recent — 2023 nationwide expansion proof
            - Weak — no public employer-retention metric
        - label: Point32Health
          values:
            - Moderate — named payer partnership
            - Moderate — service design clear, utilization unclear
            - Historical but still live product framing
            - Weak — no public persistence metrics
        - label: SCAN Affirm
          values:
            - Moderate — named MA plan and counties
            - Moderate — benefit design and communities support detailed
            - Historical launch with current plan presence
            - Weak — no cohort or renewal data
        - label: BCBS Minnesota
          values:
            - Strong — named plan and current network page
            - Light — access and affordability framing, little ROI math
            - Current — 2026 network change
            - Weak — no longitudinal satisfaction or churn data
        - label: TPA channel (Trustmark / HealthComp)
          values:
            - Moderate — named channel relationships
            - Light — operational and value language, limited uptake data
            - Historical partnerships still referenced
            - Weak — no public client-level renewal data
    claimRefs:
      - CU041
      - CU042
      - CU043
      - CU044
      - CU045
  - id: FU004
    title: Retention / repeat visibility matrix
    type: matrix
    layout: standard
    summary: >-
      Matrix showing what the public record does and does not reveal about retention durability across major customer
      segments.
    approximationNotes: >-
      A cohort chart would require fabricated numeric retention percentages, so this substitute matrix documents the
      public-data gap directly.
    data:
      columns:
        - Public retention metric
        - Latest visible signal
        - Implication
      rows:
        - label: Large employer deployments
          values:
            - NRR / GRR not disclosed
            - Only self-published satisfaction and case-study outcomes are visible
            - Renewal durability for employer accounts remains unproven publicly
        - label: Health-plan partnerships
          values:
            - Renewal or disenrollment rates not disclosed
            - Member-access expansions are visible for Point32Health, SCAN, and BCBS MN
            - Payer distribution breadth is easier to prove than persistence
        - label: TPA channel partnerships
          values:
            - Client attach and renewal rates not disclosed
            - Trustmark and HealthComp launches remain publicly positioned as active offerings
            - Channel leverage exists, but durability within partner books is opaque
        - label: Public purchaser contracts
          values:
            - No public renewal history yet
            - CalPERS discloses scale and accountability but not member-retention outcomes
            - A marquee win does not yet resolve concentration or durability risk
    claimRefs:
      - CU041
      - CU042
      - CU043
      - CU045
      - CU046
