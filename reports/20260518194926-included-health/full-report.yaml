  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Operational strength and private status support continued relevance, but valuation opacity keeps the
      recommendation in research-more territory.
    data:
      nodes:
        - id: history
          label: '2021 anchor: multibillion merger, but official terms undisclosed'
          type: input
        - id: operations
          label: '2025-2026 evidence: profitable, product launches, CalPERS proof, active leadership build-out'
          type: process
        - id: profiles
          label: Profiles still show private status, secondary-private latest deal, and unicorn-scale identity
          type: process
        - id: comps
          label: Current comp band runs from compressed navigation deals to premium Hinge-like growth
          type: process
        - id: opacity
          label: Missing live revenue, margin, and cap-table data blocks a precise mark
          type: decision
        - id: recommendation
          label: 'Recommendation: Research-More; treat old-cycle pricing as stretched until diligence closes'
          type: output
      edges:
        - from: history
          to: operations
          label: Historical scale matters only if the business is still executing
        - from: operations
          to: profiles
          label: Current execution supports still-private relevance
        - from: profiles
          to: comps
          label: Private status forces comp-based underwriting
        - from: comps
          to: opacity
          label: Comp range cannot settle today’s price without a live denominator
        - from: opacity
          to: recommendation
          label: Opacity keeps the stance at research-more
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV014
      - CV031
      - CV034
      - CV035
      - CV042
    approximationNotes: null
  - id: FV002
    title: Valuation sensitivity
    type: bar
    summary: >-
      Current comparable and precedent multiples give a wide range, but the low end is real and the high end requires
      elite execution.
    data:
      items:
        - label: Teladoc EV / sales
          value: 0.57
        - label: Accolade takeout / revenue
          value: 1.5
        - label: Omada EV / revenue
          value: 2.8
        - label: Base-case underwriting ceiling
          value: 4
        - label: Hinge EV / revenue
          value: 6
    claimRefs:
      - CV019
      - CV024
      - CV027
      - CV030
      - CV031
      - CV038
      - CV039
    approximationNotes: >-
      Multiples are rounded to show valuation sensitivity rather than false precision. The base-case ceiling is an
      analytical screen, not an observed market print.
  - id: FV003
    title: Valuation / return range
    type: range
    summary: >-
      Illustrative EV bands show why the argument is really about which revenue and quality state Included occupies, not
      about naming a single current mark.
    data:
      items:
        - label: Bear if revenue is ~$400M and market treats Included like a compressed navigator
          low: 400
          mid: 600
          high: 800
          unit: $M
        - label: Base if revenue is ~$500M and profitability signal is real but disclosure remains thin
          low: 1250
          mid: 1600
          high: 2000
          unit: $M
        - label: Bull if revenue is ~$600M and Hinge-like quality proof emerges
          low: 3000
          mid: 3300
          high: 3600
          unit: $M
        - label: Conservative entry screen before diligence closes
          low: 1200
          mid: 1600
          high: 2000
          unit: $M
    claimRefs:
      - CV034
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
    approximationNotes: >-
      Ranges are conditional on hypothetical revenue anchors because Included has not publicly disclosed a current
      top-line figure. They are underwriting cases, not asserted marks.
  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: Operational signals score better than valuation transparency, which is why the recommendation stays cautious.
    data:
      items:
        - label: Operating continuity
          value: 7/10
          unit: score
          trend: up
        - label: Profitability signal
          value: 7/10
          unit: score
          trend: up
        - label: Customer proof durability
          value: 6/10
          unit: score
          trend: stable
        - label: Public-comp support
          value: 5/10
          unit: score
          trend: stable
        - label: Price discovery quality
          value: 2/10
          unit: score
          trend: down
        - label: Cap-table visibility
          value: 3/10
          unit: score
          trend: unknown
        - label: Risk-adjusted entry attractiveness
          value: 4/10
          unit: score
          trend: down
    claimRefs:
      - CV035
      - CV036
      - CV041
      - CV042
      - CV043
      - CV044
    approximationNotes: >-
      Scores are IC-style judgment calls on a 10-point scale informed by the retained evidence; they summarize the case
      rather than add new facts.
