  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    summary: >-
      The workflow moves from entry and triage into care or routing, then into pharmacy, specialist, and follow-up
      actions without leaving the platform.
    data:
      nodes:
        - id: entry
          label: |-
            Member entry
            (app / phone / web)
          type: input
        - id: dot
          label: |-
            Dot intake
            (benefits + symptom + context)
          type: process
        - id: nav
          label: |-
            Navigation / advocacy
            (claims, referrals, scheduling)
          type: process
        - id: pcp
          label: |-
            Primary / urgent / BH visit
            (Care Clinic)
          type: process
        - id: route
          label: |-
            Provider Connect / EMO
            (local routing or second opinion)
          type: process
        - id: rx
          label: Pharmacy / labs / reminders
          type: process
        - id: follow
          label: |-
            Follow-up and ongoing plan
            (screenings, adherence, next visit)
          type: output
      edges:
        - from: entry
          to: dot
          label: initial question
        - from: dot
          to: nav
          label: benefits / admin path
        - from: dot
          to: pcp
          label: clinical path
        - from: pcp
          to: route
          label: needs local specialist or EMO
        - from: pcp
          to: rx
          label: prescription / test follow-up
        - from: route
          to: follow
          label: booked or reviewed
        - from: rx
          to: follow
          label: medication support
        - from: nav
          to: follow
          label: issue resolved
