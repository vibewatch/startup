      - number: '4.2'
        title: Public scale signals improved, but revenue is still undisclosed
        blocks:
          - type: paragraph
            body: >-
              The strongest 2025 financial signal is management’s statement to Business Insider that Included Health is
              profitable. That matters because the company had privately filed an S-1 for a 2022 IPO, pulled back when
              the market deteriorated, and then spent the next several years reworking its operating model. In the same
              interview, management said revenue has grown at a double-digit rate since 2021, that the company now works
              with roughly 300 employers and health plans, and that the earlier merged business had around 250 contracts
              and combined revenue in the hundreds of millions. Together, those disclosures support a conclusion that
              Included Health is operating at meaningful late-stage private-company scale even though it still withholds
              a current top-line figure.


              The company’s operating narrative is not uniformly positive. Included Health cut less than 6% of its
              workforce in 2022, a reminder that digital-health cost pressure reached even scaled platforms. But the
              later CFO and CLO hires, the strong-cash-position claim, and the statement that all shares are common
              stock suggest a company that used the IPO pause to simplify operations and reduce financing pressure
              rather than a business forced into emergency capital raising. The net is encouraging but incomplete:
              profitability, contract count, and leadership upgrades point in the right direction, yet an investor still
              lacks the audited revenue, margin, and cash-flow proof needed to know how much of the turnaround is
              durable operating leverage versus selective narrative disclosure.
