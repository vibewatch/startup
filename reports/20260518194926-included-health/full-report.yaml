      - number: '2.2'
        title: Sizing lenses and market structure
        blocks:
          - type: paragraph
            body: >-
              No public analyst source cleanly sizes an employer-only market for integrated navigation plus virtual care
              plus specialty support, so the right approach is to triangulate. The cleanest auditable lens is the
              healthcare navigation platform category, where Grand View places 2023 global revenue at $10.08 billion and
              Mordor places 2025 revenue at $11.40 billion, with both firms implying mid-single-digit to
              low-double-digit growth. Grand View also says North America is the largest regional profit pool and that
              large enterprises lead end use, while Mordor says employers represent 45.63% of 2025 end-user spend. That
              does not produce a clean Included Health SAM by itself, but it does show that the employer buyer is not
              peripheral to the category.


              The second lens is the adjacent U.S. virtual care market. Grand View estimates that market at $8.83
              billion in 2024 with 32.35% CAGR through 2030, driven by primary-care and specialty shortages,
              chronic-disease management, and broader digital adoption. The third lens is buyer breadth: PHTI shows
              purchasers already covering broad sets of conditions rather than isolated tools. These lenses all point in
              the same direction: Included Health is not competing in a tiny benefits niche, but neither is there a
              single honest public TAM number that captures only its eligible employer slice. The market is large,
              fast-moving, and structurally overlapping, which means sizing should be presented as bounded lenses rather
              than a single heroic TAM claim.
            claimRefs:
