              recommendations without adding separate appointments or bills. Pharmacy navigation adds another
              operational layer by handling prior authorization friction, savings search, refill management, and
              medication guidance. The practical implication is that Included Health tries to own the coordination
              burden after the first click, not just the appointment slot. That is a meaningful service-workflow
              advantage for enterprise buyers, because missed referrals and abandoned next steps destroy value in
              fragmented benefit stacks. The limitation is that the fastest claims and best outcome numbers remain
