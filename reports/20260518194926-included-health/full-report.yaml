      - number: '3.2'
        title: Direct navigation rivals
        blocks:
          - type: paragraph
            body: >-
              The direct rival set starts with Transcarent, Quantum Health, Rightway, and HealthJoy, with Accolade now
              relevant mainly as legacy capability folded into Transcarent. Transcarent is the closest integrated
              challenger because the Accolade deal filled its primary-care and advocacy gaps while preserving
              Transcarent’s pharmacy and AI narrative. Quantum remains the strongest pure-play navigation incumbent: it
              offers flexible deployment, strong steerage language, and mature employer messaging around claims savings,
              but it still overlays existing clinical assets more than it owns them. Rightway is narrower clinically,
              yet more economically opinionated than most rivals because it couples navigation to a transparent PBM
              model and a pharmacy-spend reduction story. HealthJoy sits lighter in the stack than Included Health: it
              is increasingly ambitious on AI and orchestration, but it still looks more like a benefits operating
              system and activation layer than a delivery platform with owned specialty care. This is why Included
              Health’s differentiation must be judged not against a single rival, but against several different ways
              buyers can solve the same job.
