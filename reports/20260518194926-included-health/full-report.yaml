      - number: '8.4'
        title: 'Recommendation and diligence gates: Research-More unless management can turn signals into numbers'
        blocks:
          - type: paragraph
            body: >-
              The recommendation for Included Health is Research-More. That call is not a quality dismissal; it is a
              valuation-discipline decision. The retained evidence shows a real company with current operations,
              customer proof, product shipping, and a profitability signal. It also shows that the digital-health market
              now rewards only companies that can present clean revenue, margin, and cash-generation evidence. Included
              has not yet done that in public. As a result, there is no defensible basis for paying a premium growth
              multiple simply because the company stayed private through the reset. The valuation stance is therefore
              price-sensitive and, at any entry anywhere near the old pandemic-era high-water narrative, stretched.


              The path to an investable view is concrete. Management needs to provide a current ARR or revenue bridge,
              gross margin and free-cash-flow proof, customer renewal and cohort-savings evidence, and a current
              capitalization table or secondary-price history. If those materials confirm durable profitable growth and
              a relatively clean common-stock structure, Included can migrate from research-more toward a structured
              diligence or track-positive stance. If profitability reverses, a CalPERS or Walmart-class proof account
              disappoints, or a new financing surfaces below prior implied expectations, the thesis should break
              quickly. In short: the company likely still matters, but the price cannot be separated from the missing
              evidence.
