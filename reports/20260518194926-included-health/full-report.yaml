chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, formation, and product scope
        blocks:
          - type: paragraph
            body: >-
              Included Health today presents itself as a personalized, all-in-one healthcare company that combines
              navigation, advocacy, and care delivery. The current entity is not a simple rename of one legacy startup:
              it was assembled in 2021 when Grand Rounds and Doctor On Demand merged, then quickly expanded again by
              agreeing to acquire the original Included Health, a concierge-style platform focused on LGBTQ+ people and
              other underserved populations. The October 2021 rebrand turned that acquired name into the umbrella
              identity for the combined company.


              That history matters because it explains why the platform is broader than a typical care-navigation
              vendor. Official materials now position Included Health around urgent care, primary care, behavioral
              health, specialty care, and advocacy rather than a single virtual-care workflow. The solutions page frames
              the company's operating philosophy as “AI+EQ,” explicitly describing artificial intelligence as an
              enhancer of the human clinical and navigation experience rather than a replacement for it. That
              through-line from inclusive navigation to broader integrated care is central to how the company explains
              its identity today.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO013
              - CO014
              - CO042
      - number: '1.2'
        title: Leadership continuity and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is strongest around Owen Tripp, the Grand Rounds co-founder who became chief
              executive of the merged business and remained the public face of Included Health in the January 2025
              Business Insider interview. Robin Glass remained publicly identified as president across the 2021 merger
              team and the 2024 legal-hire announcement, indicating continuity in the senior operating layer even as the
              company refreshed its bench after pausing IPO plans. The biggest post-May-2024 additions were Mark Flakne
              as CFO and Rob Guenthner as CLO, both recruited from scaled healthcare operators with experience in
              value-based care, transactions, and public-company processes.


              Board evidence is thinner than executive evidence but still usable. Included Health announced Michael
              Bender's appointment in November 2022, tied to Hill Ferguson's planned departure from the board as
              integration progressed. Public materials from that period named a seven-seat board that included former
              HHS secretary Kathleen Sebelius and venture-linked directors. The main governance takeaway is not obvious
              instability; it is concentration around Tripp and a still-opaque current investor/control picture that
              public sources do not fully update after the 2024-2026 executive refresh.
