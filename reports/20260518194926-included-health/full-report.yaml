      - number: '7.2'
        title: Telehealth policy, reproductive privacy, and AI liability keep residual risk high
        blocks:
          - type: paragraph
            body: >-
              Included Health benefits from a friendlier policy baseline than many investors feared, but the legal
              footing is still temporary in several places that matter. HHS says many Medicare telehealth flexibilities
              now run through the end of 2027, which buys time for virtual-care operators. That is helpful, but it does
              not fully close risk because the controlled-substance prescribing flexibilities run only through the end
              of 2026 and remain a specific dependency for telemedicine workflows. For a platform that still depends on
              virtual primary care access, changing federal rules on reimbursement, eligible providers, or remote
              prescribing could alter utilization, pricing, or clinical workflow design faster than enterprise contracts
              renew.


              Privacy risk is also not theoretical. HHS says a Texas court vacated most of the reproductive-health
              privacy rule, and Fisher Phillips says the result lands directly on employer-sponsored plans and
              providers. Separate employer-benefit coverage shows that abortion-travel programs are common but often
              poorly administered, with only a minority using third-party administration. EPIC adds that
              abortion-related digital traces can come from searches, apps, and other data exhaust that sit outside
              narrow healthcare settings. Layer in Included Health’s AI roadmap, which draws on medical history, claims,
              and benefits data, and the risk stack gets heavier: the company must manage HIPAA business-associate
              duties, fragmented oversight outside FDA-cleared tools, and unresolved malpractice or product-liability
              questions if clinical decision support starts influencing care at scale.
