      - number: '6.3'
        title: Health-plan distribution is a differentiator, especially where community or equity programs matter
        blocks:
          - type: paragraph
            body: >-
              Included Health’s payer channel is not just a digital-front-door story; it increasingly includes segmented
              communities and care-navigation programs that make the offering look more like a member-engagement and
              population-management layer. Point32Health’s Tufts and Harvard Pilgrim commercial members get LGBTQ+
              navigation, affirming-provider matching, and support groups. SCAN Affirm uses Included Health Communities,
              peer support, advocacy, and community resources inside an LGBTQ+-focused Medicare Advantage plan. Blue
              Cross and Blue Shield of Minnesota now carries Doctor On Demand primary care inside a live health-plan
              network, while Compass Rose and the unnamed regional plan show that federal, commercial, and Medicare
              Advantage populations are also in scope.


              That community emphasis is a real buyer differentiator because it helps Included Health sell on equity,
              trust, and access rather than on generic telehealth alone. The Black Community Innovation Coalition makes
              the same point from the employer side. Still, public disclosure remains stronger on program design than on
              utilization: member counts, county-level uptake, community-program penetration, and segment-specific
              retention are mostly absent from the reviewed materials.
