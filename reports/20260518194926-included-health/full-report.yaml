companyProfile:
  summary: >
    Included Health is a San Francisco-based digital-health company formed through the 2021 merger of Grand Rounds and
    Doctor On Demand and later rebranded under the Included Health name. The company sells an integrated front door for
    employers and health plans that combines care navigation, advocacy, virtual primary care, behavioral health,
    specialty care, expert opinion, provider matching, and member support inside a single enterprise platform. Public
    operating evidence through 2026 shows the company remained private, profitable, and active in large-account benefits
    markets, with roughly 300 employers and health plans, a high-profile CalPERS rollout, and continued product
    expansion across Dot, alternative plan design, specialty care, and Provider Connect.
  foundedDate: '2021-05-11'
  founders:
    - name: Owen Tripp
      role: Grand Rounds co-founder; CEO of the merged company
      background: >
        Co-founded Grand Rounds and became CEO of the merged Grand Rounds-Doctor On Demand company that later rebranded
        as Included Health.
      claimRefs:
        - CO006
  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA
  productSummary: >
    Included Health offers a combined navigation and virtual-care stack for enterprise buyers. Core modules include
    urgent care, virtual primary care, behavioral health, expert medical opinion, care coordination, LGBTQ+ and
    community-based support, specialty-care pathways, provider search and steerage, and newer AI-enabled layers such as
    the Dot clinician-in-the-loop assistant, Alternative Plan Design, and Provider Connect.
  customerFocus: >
    Large self-insured employers, health plans, and public purchasers seeking a single healthcare-navigation and
    virtual-care partner for broad member populations rather than a narrow point solution.
  businessModel: >
    B2B enterprise health-benefit platform sold mainly through employers and health plans, with custom contract pricing,
    implementation support, and a growing mix of navigation, care-delivery, and plan-design services.
  stage: Late-stage private company
  fundingStatus: >
