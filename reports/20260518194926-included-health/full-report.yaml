      - CR034
      - CR035
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044
      - CR048
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: Map of the counterparties and systems whose performance shapes Included Health’s risk profile.
    data:
      nodes:
        - id: employers
          label: Large employers
