      - number: '8.2'
        title: 'Comparable context: current public comps and M&A set a much lower, but still usable, range'
        blocks:
          - type: paragraph
            body: >-
              The most relevant precedent in navigation is no longer a frothy 2021 growth round; it is the 2025
              Transcarent-Accolade transaction. Transcarent paid $621M, or $7.03 per share, for Accolade, a roughly 110%
              premium to the pre-deal close. Yet even with that premium, the deal implied only about a 1.5x revenue
              multiple on Accolade’s last reported fiscal-year revenue. That is the single most important adverse
              reference point in this chapter: a scaled navigation asset with public-company history and broad client
              reach still cleared at a modest multiple. Stat’s framing that public markets had punished companies like
              Accolade reinforces that this was a compression-era deal, not a premium growth benchmark.


              The public comp set widens the band but does not erase that discipline. Teladoc, the mature public
              virtual-care comp, trades around 0.57x EV or sales despite billions of revenue because growth and
              profitability remain challenged. Omada, a healthier and smaller public chronic-care platform, sits closer
              to 2.8x EV or revenue. Hinge, the best-in-class growth comp in digital health, is the real upper bound at
              roughly 6x EV or revenue, but it earns that band with 47% growth, high margins, cash generation, and clean
              public-company predictability. Fierce’s HLTH25 takeaway is therefore crucial: the IPO window is open
              again, but only for companies with visible financial discipline. Included may deserve a premium to
              Accolade if its integrated model is genuinely stronger, but absent disclosed numbers, it does not deserve
              to be assumed into Hinge territory by default.
