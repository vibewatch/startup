              company publishes a detailed privacy policy, says vendors handling PHI must sign business associate
              agreements, explicitly disallows PHI marketing without authorization, maintains a bug bounty, and migrated
              customers toward stronger identity standards such as OpenID Connect. The medical-device consent form also
