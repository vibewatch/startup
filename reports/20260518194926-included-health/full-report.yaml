  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              Included Health sits inside the U.S. employer-sponsored benefits market, but its real operating boundary
              is narrower and more useful than the total insurance market. The company sells navigation, advocacy, and
              virtual care through employers and health plans, so the natural economic buyer is the self-funded plan
              sponsor that is directly exposed to medical and pharmacy trend. KFF’s 2024 data show why this matters: 63%
              of covered workers and 79% of covered workers at large firms are already in self-funded plans, which means
              a large share of commercial coverage sits in buyer organizations that can contract directly for
              navigation, virtual primary care, behavioral health, and specialty support. This is also a market with
              persistent pain. Family premiums reached $26,993 in 2025, mental-health access still lags primary and
              specialty access, and employers are increasingly contracting for virtual primary care and treating
              telemedicine as a durable benefit layer rather than a COVID artifact.


              The practical market boundary therefore includes employer navigation, benefit advocacy, virtual primary
              care, virtual behavioral health, expert medical opinion, and specialty-care support tied to employer or
              health-plan benefit design. It excludes Medicare-focused care management, unaffiliated consumer direct-pay
              telehealth, and small fully insured benefits products where the carrier rather than the employer controls
              most benefit architecture. That boundary matters because Included Health’s differentiation depends on
              orchestrating multiple benefit touchpoints around the member instead of selling a single digital point
              tool.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
