  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Disclosed anchor and current status: credible private scale, no fresh price discovery'
        blocks:
          - type: paragraph
            body: >-
              The cleanest starting point for Included Health valuation is what public evidence does not say. Official
              2021 merger materials confirm the combination of Grand Rounds and Doctor On Demand, but they do not
              disclose transaction terms, so the exact merger valuation is not a hard public fact in the retained source
              set. Accessible 2021 coverage still makes the direction clear: the merger was treated as a
              multibillion-dollar digital-health combination, and contemporaneous reporting pegged the standalone
              businesses at roughly $1.34B for Grand Rounds and about $0.82B-$0.88B for Doctor On Demand. In other
              words, investors should treat the often-repeated mid-single-digit-billion 2021 story as a high-water
              narrative rather than a disclosed, current underwriting mark.


              What is current and more useful is the 2025-2026 operating signal stack. Included told Business Insider it
              is private, profitable, and growing double digits, with about 300 employers and health plans, and it said
              it did not need to raise capital after shelving the 2022 IPO. PitchBook still shows the company as private
              with a secondary-private latest deal type, while Crunchbase’s archived profile still lists unicorn status
              and Series E as the last funding type. Official company announcements, the live CalPERS microsite, and
              Google Research’s collaboration note all point the same way: Included is still operating, still shipping
              products, and still relevant to major enterprise buyers. That combination supports a still-private, likely
              unicorn-scale status; it does not support inventing a live 2026 mark.
            claimRefs:
