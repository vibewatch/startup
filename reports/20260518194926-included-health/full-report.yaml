      - number: '4.5'
        title: 'Verdict: credible revenue model, credible demand, still incomplete underwriting file'
        blocks:
          - type: paragraph
            body: >-
              Included Health’s financial picture is directionally better than many digital-health peers that chased the
              2021–2022 IPO window. The company says it is profitable, says it has maintained double-digit growth, and
              can point to large contracts, payer integrations, and customer ROI studies that show its
              navigation-plus-care model resonates with sophisticated buyers. The cap-table comment about common stock
              only, combined with the CEO’s statement that the company did not need to raise during the IPO pause, also
              reduces concern that Included Health is sitting on a distorted liquidation stack or an immediate financing
              cliff.


              But the underwriting file is still incomplete. Public sources do not disclose the current revenue figure,
              audited financial statements, cash balance, burn, gross margin, CAC, payback, NRR, or any detailed
              corporate debt schedule. The missing data are not cosmetic: they determine whether today’s profitability
              reflects durable operating leverage, favorable one-off contract timing, or a narrow subset of the
              business. The adverse signals to track are the 2022 layoff, the abandoned 2022 IPO process, the lack of
              public audited financials, and the fact that buyer-facing savings proofs still stop short of showing
              Included Health’s own return profile. On current evidence, the business model and demand look real, but a
              financial buyer should still treat margin path, cash adequacy, and revenue quality as diligence-gated
              rather than proven.
