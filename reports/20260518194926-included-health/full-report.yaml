  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Profitability reversal
        - Management can no longer show durable positive operating earnings or cash generation
        - Breaks the strongest recent positive signal
        - Move stance from research-more to avoid
      - - Flagship-account deterioration
        - CalPERS, Walmart, or another marquee account weakens or fails to renew
        - Undercuts enterprise-proof and scale premium
        - Re-rate toward bear-case multiples
      - - Fresh financing below expectations
        - A new round or large secondary clears well below old-cycle folklore
        - Creates real market-clearing downside evidence
        - Use the new price as the primary anchor
      - - Preference or dilution surprise
        - Cap table shows liquidation preferences or option dilution materially worse than implied
        - Reduces common-equity upside and worsens downside recoveries
        - Demand structure protections or walk
      - - Comp compression persists
        - Public peer band stays near Teladoc and Accolade levels while Included remains opaque
        - Prevents a premium multiple from being credible
        - Keep ceiling inside base-case range
    notes: >-
      These are thesis-break conditions rather than ordinary operating risks. Any one of them can move the
      recommendation materially.
    claimRefs:
      - CV016
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR / revenue
        - Management-certified current top-line bridge
        - The entire valuation framework depends on a real current denominator
        - Finance team or board package
      - - Margin and free cash flow
        - Gross margin, operating margin, and FCF statements
        - Needed to decide whether profitability is durable or cosmetic
        - Latest audited or board-ready financials
      - - Customer renewal quality
        - Renewal, NRR, and claims-savings cohorts for major accounts
        - Determines whether Included deserves a premium to compressed navigation comps
        - Customer success dashboards plus references
      - - Cap table and preferences
        - Current capitalization table and liquidation waterfall
        - Needed to underwrite downside proceeds and real common-stock upside
        - Counsel-backed cap-table export
      - - Secondary-market evidence
        - 409A history and any recent brokered secondary prints
        - Provides a real market-clearing datapoint absent a new primary round
        - Finance plus secondary broker records
      - - Scenario conversion proof
        - Segment mix across navigation, virtual care, and specialty offerings
        - Shows whether Included is becoming a stronger integrated platform or remaining a navigation-heavy asset
        - Management product and finance review
    notes: >-
      These asks are ordered by valuation importance. Without the first three, any investment memo would still be
      debating stories rather than numbers.
    claimRefs:
      - CV034
      - CV042
      - CV043
      - CV044
