        title: >-
          Implementation motion centers on one front door, virtual-primary-care continuity, and escalation into
          higher-touch support
        blocks:
          - type: paragraph
            body: >-
              Across employer, payer, and TPA materials, Included Health consistently sells a similar operational
              promise: one point of entry, guidance before and after the visit, and handoffs when virtual care alone is
              insufficient. Salesforce and Windstream case studies emphasize a centralized platform or single entry
              point. Trustmark and HealthComp frame the product as a combined navigation-and-member-services layer that
              can sit on top of existing benefit plans. Blue Cross and Blue Shield of Minnesota’s live network
              integration and Doctor On Demand’s microsite make the service model concrete: members can establish a
              virtual primary-care relationship, get imaging or specialist support coordinated by a care team, and stay
              inside the plan’s network logic.


              The Solv and Bicycle partnerships extend the same pattern. Solv closes the digital-to-physical care gap
              for the subset of visits that need in-person follow-up, while Bicycle gives Included Health a specialist
              endpoint for opioid-use-disorder treatment. Public activation signals are directionally good, but they are
              still incomplete. Included Health publishes follow-up, adherence, and utilization lifts, yet it rarely
              pairs those lifts with named-customer denominators, conversion funnels, or service-level metrics.
