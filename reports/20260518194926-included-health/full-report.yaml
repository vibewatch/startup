      - number: '6.2'
        title: Named customer proof is strongest where deployment scope and outcome math are both public
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof points are CalPERS and Walmart because both move beyond logo use into deployment
              scope and performance language. CalPERS gives Included Health a public-purchaser reference with roughly
              400,000 PPO members, explicit accountability for navigation and virtual care, and a five-year at-risk
              construct tied to cost and quality. Walmart gives the company a rare employer case with rollout history
              plus clinical and financial outcomes: an 11% total-cost-of-care reduction, chronic-condition and
              preventive use beyond urgent care, and biometric improvements for diabetes and hypertension.


              Other named references broaden the customer map even when their proof quality is weaker. Salesforce and
