              Included Health clearly sells into more than one customer archetype. Its public site splits demand between
              employers and health plans, then shows how those buyers extend into public purchasers such as CalPERS and
              administrator channels such as Trustmark and HealthComp. On the employer side, the positioning is aimed at
              HR, benefits, and finance leaders who need one entry point for navigation, virtual care, advocacy, and
              specialty routing. On the payer side, the pitch shifts toward member satisfaction, broad access,
              virtual-primary-care reach, and differentiated programs for commercial, Medicare Advantage, and
              federal-member populations.


              That breadth matters because it lowers dependence on a single go-to-market motion. Included Health can
              land directly with self-insured employers, but it can also be embedded through health-plan contracts, TPA
              partnerships, or public-purchaser arrangements. The trade-off is transparency: the public record shows
              logos, curated case studies, and partner announcements far more often than it shows a clean breakdown of
              how many customers sit in each segment, how much revenue each contributes, or how durable those
