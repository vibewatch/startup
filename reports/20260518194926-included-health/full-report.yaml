  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How policy, privacy, and AI risks flow into renewals, margins, valuation, and financing flexibility.
    data:
      nodes:
        - id: policy
          label: Telehealth policy deadlines
          detail: Temporary reimbursement and prescribing rules can change.
          tone: warning
        - id: privacy
          label: Privacy / legal event
          detail: Reproductive-health or data-governance issue involving sensitive member data.
          tone: warning
        - id: ai
          label: AI safety or liability issue
          detail: Weak validation, unclear oversight, or patient harm claim.
          tone: warning
        - id: renewal
          label: Renewal confidence
          detail: Large buyers demand confidence in value and compliance.
          tone: neutral
        - id: margin
          label: Margin and service cost
          detail: Manual work, redesign, or remediation can raise operating cost.
          tone: neutral
        - id: valuation
          label: Valuation / financing flexibility
          detail: Opacity and execution surprises reduce negotiating leverage.
          tone: warning
      edges:
        - from: policy
          to: renewal
          label: Alters product economics
        - from: privacy
          to: renewal
          label: Raises trust and indemnity concerns
        - from: ai
          to: renewal
          label: Weakens proof story
        - from: policy
          to: margin
          label: Forces workflow redesign
        - from: privacy
          to: margin
          label: Adds legal and remediation cost
        - from: ai
          to: margin
          label: Adds monitoring and clinical-review cost
        - from: renewal
          to: valuation
          label: Changes growth confidence
        - from: margin
          to: valuation
          label: Changes durability of profitability
    claimRefs:
