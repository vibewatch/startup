  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer requirements
        blocks:
          - type: paragraph
            body: >-
              Included Health competes in a category that has shifted from isolated digital-health point solutions
              toward employer demand for a single benefits and care front door. Business Group on Health, Mercer,
              UnitedHealthcare, and Cigna all describe the same macro setup for 2026: buyers are facing elevated medical
              and pharmacy trend, benefits teams are stretched, and employers are increasingly willing to use steerage,
              alternative plans, and more prescriptive navigation to control cost. That backdrop matters because the
              buyer is no longer just asking whether a vendor can answer questions; the buyer is asking whether the
              vendor can reduce fragmentation, guide members to high-value providers, and prove economic impact. In that
              market, the most relevant comparison set for Included Health is not every virtual-care vendor. It is the
              smaller set of platforms that try to own the employee experience across navigation, clinical guidance, and
              cost control, plus adjacent alternatives that can win the same budget by offering deeper pharmacy or
              plan-design leverage.
