            body: >-
              For members, Included Health increasingly looks like a front door to many healthcare jobs rather than a
              narrow telemedicine product. The primary-care surfaces show a straightforward intake path—activate, pick a
              doctor, visit online, and return for refills, referrals, screenings, or chronic-condition follow-up.
              Behavioral health expands that front door into therapy and psychiatry with sub-week access, while Expert
