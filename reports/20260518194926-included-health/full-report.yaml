  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated architecture centers on one app, one record, and shared clinical operations
        blocks:
          - type: paragraph
            body: >-
              Included Health’s product thesis is not that it has the best point solution in every category, but that
              navigation, care delivery, advocacy, and benefit design should sit inside one operating system. The
              strongest official proof is architectural, not just promotional: All-Included Care says members enter
              through one app, clinicians document in a single EHR, and the same company can answer benefits questions,
              route people to providers, deliver virtual visits, and escalate into specialty or second-opinion
              workflows. The Care Clinic and primary-care pages reinforce that this is meant to be longitudinal rather
              than episodic, with on-staff clinicians, PCP-to-specialist eConsults, shared follow-up, and integration
              with labs, pharmacies, and local providers. That closed-loop structure is the main technical
              differentiator versus employer-benefit stacks that bolt telehealth, navigation, and condition vendors
              together. The caveat is that much of the integration story still comes from company-produced materials;
              public technical evidence shows breadth and coherence, but only limited third-party benchmarking on how
              well the stack performs under load or across heterogeneous payer and provider environments.
