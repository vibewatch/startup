      - number: '2.3'
        title: Buyer behavior, demand drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer behavior in digital health has become more disciplined and more ruthless. PHTI’s 2024 purchasing
              survey says contracts are short, performance-based terms are common, and employers want proof that a
              product improves health, lowers cost, and spans enough indications to replace vendor sprawl. Cost pressure
              explains the behavior. Business Group on Health expects median employer cost trend of 9% for 2026 before
              mitigation, while Mercer says half of large employers are likely to shift more cost to employees and 35%
              plan to offer nontraditional medical plans. At the same time, employers are dealing with simultaneous
              shocks from obesity drugs, cancer, catastrophic claims, and higher mental-health utilization. Lockton’s
              claimant report shows the extreme concentration behind that pain: roughly 1% of members with more than
              $100,000 in annual claims account for a third of spend.


              These dynamics make navigation and steerage more valuable, but they also raise the bar for vendors.
              Employers will keep paying for digital tools only when those tools simplify the member journey, integrate
              with existing benefits, and create credible evidence of savings or quality improvement. Products that add
              one more silo or cannot prove outcomes are exactly the ones buyers say they are willing to replace. That
              is the core market-structure fact for Included Health: the category is growing, but growth is favoring
              broader, measurable platforms rather than narrow point solutions.
