- id: communities-specialty-and-breadth
  title: Communities, specialty care, and pharmacy broaden the stack beyond generic telehealth
  body: 'Included Health’s breadth is easiest to underestimate if the company is viewed only through the lens of virtual primary care. The communities business adds targeted navigation and care coordination for LGBTQ+ and Black populations, including affirming-provider search, benefits help, social support, and confidentiality commitments. Point32Health’s rollout shows the offer can be embedded at payer level rather than marketed only as an employer DEI add-on. At the same time, Specialty Care Clinic pushes the core care model into cancer, metabolic, women’s health, and autoimmune use cases, while Expert Medical Opinion keeps a second-opinion pathway for members facing major diagnoses or surgery decisions. Pharmacy navigation rounds out the experience by handling the administrative and clinical friction around medications. The strategic result is a product map that covers navigation, routine care, complex care, and underserved-population support in one brand. The limitation is proof asymmetry:
    public evidence is robust on breadth and member stories, but much thinner on independent outcomes for communities and pharmacy compared with the better-publicized primary-care and purchaser-contract examples.'
