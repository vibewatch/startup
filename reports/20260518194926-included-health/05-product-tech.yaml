- id: trust-safety-and-technical-verdict
  title: Trust signals are real, but independent validation still lags the ambition of the AI stack
  body: 'Included Health’s public trust posture is stronger than many digital-health peers on basic controls. The company publishes a detailed privacy policy, says vendors handling PHI must sign business associate agreements, explicitly disallows PHI marketing without authorization, maintains a bug bounty, and migrated customers toward stronger identity standards such as OpenID Connect. The medical-device consent form also usefully clarifies that the platform may rely on third-party clinical kits in virtual settings while disclaiming responsibility for those devices’ safety and performance. On AI, the most credible external quality signal is not a public benchmark dashboard but the Google Research randomized study announced in February 2026. That trial materially strengthens the validation path for Dot, yet it is still pending results, and buyers still lack public metrics on uptime, false escalations, routing precision, or audit scope for the provider-quality engine. Net: Included Health
    looks technically differentiated because it has linked navigation, clinical operations, and benefits data into one stack, but the product remains diligence-gated on black-box measurement, certification scope, and externally validated operating performance.'
