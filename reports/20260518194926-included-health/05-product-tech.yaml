  title: Product architecture map
  type: stack
  summary: Included Health layers member access, AI orchestration, navigation, clinical delivery, quality routing, and trust controls into one operating stack.
  data:
    layers:
    - label: Member access layer
      detail: App, phone, and web surfaces for benefits questions, provider search, refills, claims support, and care entry.
    - label: AI orchestration layer
      detail: Dot handles conversational intake, plan-aware guidance, routing logic, reminders, and escalation triggers.
    - label: Navigation and advocacy layer
      detail: Care advocates and coordinators resolve claims issues, referrals, scheduling, and administrative friction.
    - label: Clinical delivery layer
      detail: Urgent care, primary care, behavioral health, specialty care, and expert medical opinion operate on shared workflows.
    - label: Quality and network-routing layer
      detail: Provider Connect ranks local clinicians with quality, cost, and preference logic and feeds plan-design steering.
    - label: Data and trust layer
      detail: Claims, benefits, medical history, quality models, privacy controls, BAAs, and enterprise identity standards underpin the stack.
