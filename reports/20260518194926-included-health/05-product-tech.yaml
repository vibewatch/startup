- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Status
  - Scope
  - Evidence
  - Why it matters
  - Gap
  rows:
  - - HIPAA / state privacy posture
    - Publicly documented
    - Sites, apps, telehealth operations, partner data handling
    - Privacy policy effective Feb. 1, 2026
    - Core requirement for claims, benefits, and clinical data use
    - No public audit report or enforcement history summary
  - - Business associate agreements
    - Required by policy
    - Vendors performing hosting, IT security, claims support, and similar services
    - Privacy policy
    - Important given multi-party data sharing
    - Vendor roster and audit scope are not public
  - - Identity and access controls
    - OIDC supported; new IdP-initiated SAML retired
    - Customer SSO implementations
    - Security page
    - Reduces weak SSO patterns in enterprise access flows
    - No public MFA, RBAC, or incident metrics
  - - Bug bounty and responsible disclosure
    - Active
    - Security research against Included Health systems
    - Security page
    - Positive signal that internet-facing assets are monitored and tested
    - No public disclosure cadence or bug-class statistics
  - - Regulatory baseline
    - HHS guidance available
    - Administrative, physical, and technical safeguards plus risk management
    - HHS OCR Security Rule guidance
    - Frames what “good enough” should mean for PHI systems
    - Company does not publish a mapped control framework publicly
  - - Third-party clinical device kits
    - Used when providers recommend them
    - Virtual-care cases needing additional device-generated information
    - Medical Device Informed Consent
    - Clarifies boundary between platform workflow and device liability
    - Responsibility for device performance is pushed outside the company
  - - AI validation path
    - Prospective randomized study announced; no results yet
    - Conversational AI in real-world virtual care
    - Google Research and Included Health study announcement
    - Best external quality signal for Dot so far
    - Still no published operating outcomes
  notes: Trust evidence is stronger on policies and regulatory awareness than on published audits, benchmark dashboards, or real-time operating metrics.
