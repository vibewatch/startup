  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ai-operating-benchmarks
    missingEvidence: Public benchmarks for Dot uptime, false escalation rates, clinician override rates, symptom-triage accuracy, and production safety incidents.
    whyItMatters: The main product differentiation now rests on clinician-in-the-loop AI orchestration, but buyers still cannot independently assess reliability and safety under production conditions.
    diligencePath: Request internal AI scorecards, escalation logs, incident reports, and buyer references that quantify automation accuracy and safe handoff rates by use case.
    relatedQuestionRefs:
    - QE022
    - QE025
  - type: missing-source
    severity: material
    topic: provider-quality-engine-audit
    missingEvidence: A public methodology paper, third-party audit, or validation study for the provider-quality score and its 300-plus specialty-specific measures.
    whyItMatters: Provider Connect and Alternative Plan Design both rely on the quality engine to justify steering and savings claims, so black-box scoring creates underwriting risk.
    diligencePath: Request the scoring methodology, calibration process, bias review, update cadence, and any external clinical validation or purchaser audit materials.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE023
  - type: private-evidence-only
    severity: material
    topic: alternative-plan-performance
    missingEvidence: Named employer references, claims outcomes, network breadth, renewal data, and economics for Alternative Plan Design beyond the first unnamed launch cohort.
    whyItMatters: The plan-design product is strategically important because it extends Included Health into risk-bearing benefit design, but public evidence is still pre-scale.
    diligencePath: Ask for the launch employer case study, PMPM or value-based contract terms, network configuration, and first-year claims or engagement results.
    relatedQuestionRefs:
    - QE013
    - QE014
    - QE025
  - type: missing-source
    severity: minor
    topic: security-and-certification-scope
    missingEvidence: Public audit summaries for identity, application security, EHR certification, vendor management, and security certifications mapped to the current post-merger platform.
    whyItMatters: Privacy and security posture are visible at policy level, but enterprise buyers often need evidence of scope, recency, and control operation rather than policy intent.
    diligencePath: Request SOC 2, penetration-test, certification-scope, and security-architecture materials under NDA, including how acquired or partner-connected assets are governed.
    relatedQuestionRefs:
    - QE020
    - QE023
