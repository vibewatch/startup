- id: ai-routing-plan-design-and-connectivity
  title: Dot, Provider Connect, and plan design turn navigation into routing and cost management
  body: 'The most important product shift since the Grand Rounds and Doctor On Demand merger is that Included Health has moved from digital navigation plus virtual care into algorithmic routing and plan steering. Dot is presented as the orchestration layer: it uses benefits, claims, and clinical context to answer questions, guide people to the next step, and hand off to clinicians when the situation crosses a safety threshold. Provider Connect sits inside that assistant and adds a quality and cost engine that claims to personalize provider selection using billions of data points and hundreds of specialty-specific measures. Alternative Plan Design then wraps the same routing logic into incentives by putting a well-being consult and copay-first economics at the start of the member journey. CalPERS and Blue Shield add real purchaser proof that Included Health can sit inside large risk-bearing arrangements, while the 2022 ecosystem-connectivity launch shows the company is also trying to own
    referrals across outside vendors. Technically, this is the part of the platform with the most leverage and the most opacity: the routing stack is clearly central to differentiation, but its scoring methodology and error rates are still mostly a black box to outsiders.'
