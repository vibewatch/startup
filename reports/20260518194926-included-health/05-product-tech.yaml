- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary job to be done
  - Core components
  - Public proof
  - Differentiation
  - Key diligence gap
  rows:
  - - All-Included Care
    - Single front door for benefits, care, and advocacy
    - One app, one EHR, advocates, clinicians, routing
    - Trend reduction, engagement, savings, clinician and expert scale
    - Closed-loop model instead of many vendors
    - No public uptime or interoperability-performance benchmarks
  - - Virtual Primary Care
    - Preventive and longitudinal care hub
    - On-staff PCPs, BH integration, eConsults, care management
    - 99% issue resolution, savings claim, member rating
    - Whole-person care instead of video-only visits
    - Metrics are largely company-reported
  - - Behavioral Health
    - Fast access to therapy and psychiatry
    - Therapists, psychiatrists, youth coverage, nights/weekends
    - 1-3 day access, symptom-improvement claim
    - Integrated with broader care team and minors coverage
    - No public independent outcomes study by employer cohort
  - - Expert Medical Opinion
    - Second opinion and complex-case routing
    - Record collection, specialist review, local in-network follow-up
    - 4,000+ specialists, treatment-change and savings claims
    - Bridges remote review to local care execution
    - Specialist-quality methodology not publicly audited
  - - Care Clinic / Specialty Care
    - Virtual-first urgent, primary, BH, and specialty support
    - Urgent care, PCP, psychiatry, specialty clinic
    - Access metrics, ratings, Specialty Care Clinic launch
    - Shared team and platform across acuity levels
    - Public specialty outcomes remain thin
  - - Provider Connect
    - Guide members to high-value local care
    - AI assistant, quality score, cost estimate, booking
    - 92% top-quartile connection claim, utilization and savings claims
    - Quality routing embedded in conversational workflow
    - Scoring methodology and precision are opaque
  - - Alternative Plan Design
    - Align incentives with high-quality care
    - Copay-first plan, well-being consult, curated network, Dot
    - 2026 launch, first 20k-member employer, 2027 expansion
    - Moves from navigation into plan economics
    - Network breadth and renewal data not public
  - - Communities / LGBTQ+
    - Deliver culturally affirming navigation and support
    - Queer/trans-led teams, social support, benefit help
    - 70+ employers/plans, >4M people, Point32 rollout
    - Underserved-population specialization inside same platform
    - External outcome proof is limited
  - - Pharmacy Navigation
    - Reduce medication friction and cost
    - Savings search, prior auth, refill tracking, guidance
    - Member-facing page and app-store workflows
    - Extends navigation into medication adherence
    - No public proof on adherence or Rx savings lift
  notes: This matrix combines company module descriptions with the limited independent corroboration available. Gaps emphasize what buyers still cannot verify from public sources.
