company:
  name: Included Health
chapter:
  number: 5
  title: Product & Technology
  summary: Included Health has built a genuinely broad navigation-plus-care platform in which one member surface, one record, employed clinicians, and a growing AI routing layer increasingly work together instead of sitting in separate benefit silos. The strongest technical edge is the closed-loop workflow across navigation, virtual care, provider matching, and plan design; the biggest remaining risk is that public benchmarking on AI safety, routing precision, interoperability performance, and alternative-plan outcomes still lags the ambition of the product story.
sections:
- id: integrated-platform-architecture
  title: Integrated architecture centers on one app, one record, and shared clinical operations
  body: 'Included Health’s product thesis is not that it has the best point solution in every category, but that navigation, care delivery, advocacy, and benefit design should sit inside one operating system. The strongest official proof is architectural, not just promotional: All-Included Care says members enter through one app, clinicians document in a single EHR, and the same company can answer benefits questions, route people to providers, deliver virtual visits, and escalate into specialty or second-opinion workflows. The Care Clinic and primary-care pages reinforce that this is meant to be longitudinal rather than episodic, with on-staff clinicians, PCP-to-specialist eConsults, shared follow-up, and integration with labs, pharmacies, and local providers. That closed-loop structure is the main technical differentiator versus employer-benefit stacks that bolt telehealth, navigation, and condition vendors together. The caveat is that much of the integration story still comes from company-produced
    materials; public technical evidence shows breadth and coherence, but only limited third-party benchmarking on how well the stack performs under load or across heterogeneous payer and provider environments.'
