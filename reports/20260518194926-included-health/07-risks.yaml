  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-opacity
    missingEvidence: A current board-approved valuation, secondary-trade reference, or priced financing since the abandoned 2022 IPO process.
    whyItMatters: Without a fresh market mark, it is hard to judge whether today's private valuation embeds unrealistic growth or margin assumptions.
    diligencePath: Request the last 409A, any secondary clearing prices, and the latest board materials on valuation and liquidity planning.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue, covered lives, and renewal exposure by top employer and health-plan accounts.
    whyItMatters: Large institutional wins are a strength only if the book is not dangerously concentrated in a few renewals.
    diligencePath: Request a top-10 customer table with revenue share, covered lives, contract end dates, guarantees, and churn history.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: controlled-substances
    missingEvidence: Included Health-specific data on prescribing volumes and visit types that depend on DEA telemedicine flexibilities.
    whyItMatters: The policy deadline matters much more if a meaningful share of visits or member value depends on remote controlled-substance prescribing.
    diligencePath: Ask management for visit mix, prescription mix, and contingency plans by product line if Ryan Haight-era flexibilities tighten.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: blocking
    topic: ai-evidence
    missingEvidence: Independent safety metrics, error rates, clinician override rates, and peer-reviewed outcomes for Dot or related AI workflows.
    whyItMatters: AI governance is a core risk because the company is already using highly sensitive data and marketing clinician-in-the-loop automation at scale.
    diligencePath: Request the safety case, human review rules, incident logs, model-change controls, and any external validation beyond the pending Google study.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: litigation-history
    missingEvidence: A schedule of material complaints, regulatory inquiries, arbitration matters, malpractice claims, privacy incidents, and indemnity disputes.
    whyItMatters: Absence of public litigation does not prove absence of risk in telehealth, steerage, privacy, or clinical operations.
    diligencePath: Request the legal docket, reserve memo, cyber/privacy incident history, and customer indemnity exceptions before underwriting residual risk.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
