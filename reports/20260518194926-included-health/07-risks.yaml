- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Valuation overhang and opacity
    - Disclosure quality
    - Management refuses to share current valuation, customer concentration, and unit economics in diligence.
    - Treat price discipline as mandatory or step away.
  - - Employer-sales cyclicality
    - Renewal quality
    - Top-account renewal slippage, shrinking guarantees, or unusually long sales cycles.
    - Cut growth assumptions and re-underwrite concentration risk.
  - - Telehealth policy risk
    - Federal policy deadline
    - No durable replacement for remote controlled-substance rules before end-2026 or rollback of broader flexibilities.
    - Stress-test affected product lines and pricing before investing.
  - - Privacy and legal risk
    - Regulatory or litigation event
    - Material inquiry, injunction, breach, or benefit-design controversy involving sensitive reproductive or claims data.
    - Pause conviction until incident scope and liability are clear.
  - - AI safety and liability
    - Safety case quality
    - No independent safety metrics, weak override logs, or unclear accountable clinician ownership.
    - Treat AI as a risk multiplier, not a margin enhancer.
  - - Evidence-quality limits
    - Independent validation
    - No third-party or peer-reviewed outcomes beyond company-selected pilots over the next diligence cycle.
    - Assume slower expansion and a lower-quality moat.
  notes: These are the practical monitoring points most likely to change the investment view faster than another management presentation would.
