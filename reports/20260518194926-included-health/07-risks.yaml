- id: residual-risk-view-and-kill-criteria
  title: Residual-risk view and practical kill criteria
  body: |-
    The top-line risk view is that Included Health probably has a real product-market fit with large employers and plans, but the residual risk remains high because public proof is stronger on customer anecdotes than on underwriting-grade disclosure. The company deserves credit for building an integrated platform in a market that is clearly punishing fragmented solutions. It also deserves some credit for hiring finance and legal leadership, for winning accounts such as CalPERS, and for pursuing clinician-in-the-loop designs instead of pure automation theatre. Those are meaningful mitigants.

    They do not close the file. A cautious investor should still treat five issues as thesis-break territory: renewed slippage in enterprise renewals, failure to show credible concentration data, rollback or tightening of telehealth policy, a privacy or AI-safety event involving sensitive claims-and-benefits data, or continued inability to produce independent outcomes evidence that travels beyond company-selected case studies. If diligence finds that the top accounts carry too much of the revenue base, that tele-prescribing exposure is material, or that AI governance is thinner than the marketing implies, the current story becomes much more fragile. The next diligence round should therefore focus less on another glossy ROI claim and more on concentration, policy dependency, incident history, and truly independent evidence of clinical and financial durability.
