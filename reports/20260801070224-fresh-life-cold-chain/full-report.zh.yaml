      - number: '6.3'
        title: 采用、扩张与留存代理指标
        blocks:
          - type: paragraph
            body: >-
              公开留存数据很少，眼下能用的最好信号只能是间接证据。Fresh Life
              的案例页展示的是多城市、多线路、多门店部署，而不是一次性试点客户。这说明客户把平台用在反复发生的运营流程里，不只是偶发干线运输。Starbucks、New Hope Liuhe、Yili、Hema、Sukiya
              和 7-Eleven 的案例都指向周期性补货或计划配送，而非现货交易。Fresh Life
              还声称日订单量很高，并拥有全国分支网络；如果没有实质性复购需求，这样的规模很难维持。不过，这些仍是代理指标，不是披露出来的留存指标。


              公开信息的缺口很关键。公司没有披露客户数留存、总收入留存、净收入留存、平均合同期限、钱包份额、头部客户集中度或客户分群消费扩张。FoodTalks 提到“细分行业 top-20 客户中
              60%”这一点有帮助，因为它说明公司在头部买家中的渗透可能很强；但它也带出集中度问题：如果最有力的公开证据都落在头部客户上，增长究竟有多依赖相对少数的大型连锁？务实结论是，Fresh Life
              在已部署客户内部很可能有较强运营黏性，但公开记录不足以让投资人区分健康扩张和潜在集中依赖。
