  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Fresh Life 运营的是中国食品体系里最敏感的一段：从源头到门店的易腐品合规仓储与运输。近期政府材料说明，政策负担在上升，而不是减轻。2025 年 3
              月，国家媒体发布全国食品安全新框架，列出覆盖“从农田到餐桌”链条的 21 项具体措施，包括强化检验检疫、为部分大宗液态食品建立新的运输许可制度，以及加强线上线下监管协同。SAC 2021
              年食品安全标准通知同样把全过程控制列为监管重点；国家标准平台也显示，标准体系已经铺得很宽。冷链运营商面对的法律风险不只是遵守某一部法律，而是要持续让运营对齐不断扩张的标准、许可、检查和单证要求网络。


              Fresh Life
              自己的合规页面有价值，因为它透露了管理层如何理解这些暴露。阳光合规页面列出十条红线，包括贿赂、资产挪用、伪造业务或财务记录、泄露商业秘密和客户信息、绕过公司运营系统、虚假交易或付款、运输违禁品、无适当授权经营许可业务。联系
              / 合作页面还披露了举报和合作渠道以及备案登记。合起来看，公司知道控制失灵会很快演变成法律、财务和声誉事件。问题在于，公开规则只是起点；真正的问题是，在碎片化的全国运营版图里，控制能否持续有效。
