      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图异质但连贯。连锁餐饮和便利店里，经济买方通常是供应链、物流或采购负责人，关注补货率、损耗、路线可靠性和门店服务一致性。生鲜零售里，运营用户是最先感受到温度偏离、损耗和迟到配送的门店或 DC
              团队，付款方通常在总部零售运营或供应链。乳制品、蛋白和食品制造里，买方往往是物流或渠道负责人，需要全国温控覆盖、降低货损，又不想自建每条线路。医药和生物制品是相邻市场，合规强度更高、付费意愿更高，但不是
              Fresh Life 当前公开定位的中心。


              采用路径是渐进的。买方通常从一个区域、品类或路线簇开始：外包密度能够打过自营经济性，或者追溯失败已经显性影响商业。具名企业案例因此很关键：它们证明公司能嵌入餐饮、零售、乳制品和便利店的真实买方工作流。这些案例也意味着，软件集成——订单采集、温度监测、路线控制和对账——正在从高阶附加功能变成基础产品的一部分。
