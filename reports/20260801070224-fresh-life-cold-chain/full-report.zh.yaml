      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开融资证据强烈显示，Fresh Life 需要反复外部资本才能继续扩张。FoodTalks 和 Tencent 称，2024 年 B+ 轮把 B 轮系列累计融资推至接近 RMB900 million；36Kr
              则记录了 2022 年 B 轮和 2021 年 A 轮。Tencent 人物稿在这里尤其有用，因为它把 Fresh Life
              描绘成一个管理团队和支持方群体：为追求冷链基础设施规模，愿意承受较大的短期亏损；而技术建设本身就消耗了数亿元人民币。这不能证明当前烧钱情况，但说明业务历史上一直需要持续资金来支持网络扩张和数字能力。


              缺失的信息同样重要。已审阅公开材料没有披露 Fresh Life
              当前现金余额、月度烧钱、债务额度、营运资金占用、租赁义务或下一轮触发条件。也没有公开证据区分内部经营现金和持续融资依赖。上市可比运营商说明了这件事为什么重要：JD Logistics 经营现金为正，但 2025
              年上半年在投资和融资流出后现金余额仍下降；Lineage 则明确处在一个重实物资产模型中，资本开支和债务因素都很重。Fresh Life 也许正在打造有吸引力的冷链平台，但单靠公开记录无法承销其资本充足性。
