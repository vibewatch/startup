chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Fresh Life Cold Chain Logistics Co., Ltd. 于 2016 年 11 月正式成立，36Kr 列示的公司成立日期为 2016-11-24。Fresh Life
              官方网站把公司定位为冷链供应链服务商，面向连锁餐饮、生鲜零售、食品加工与贸易、团餐或酒店客户，提供从产地到门店的仓储、干线、城配和数字控制塔能力。官方联系页显示日常运营中心位于四川成都，36Kr
              则显示注册地址在拉萨。中国民营企业出现这种拆分并不罕见，但它很重要：公开叙事里的“总部”指向运营中心，不一定等同于法律注册地址。


              这门生意不只是运输。Fresh Life
              反复强调，自己靠并购、区域整合和数字工具，搭建全国冷链基础设施层。现有官方概览列出八大业务集团，覆盖冷链运营、科技、园区运营、助农服务、食材配送和团餐运营。它卖的是一整套冷链工作流：仓容、定时干线、路径规划、门店配送、温度可视化，以及越来越多由
              AI 支撑的对账和风控工具。后续章节需要按工业供应链平台来分析 Fresh Life，而不是把它看成狭义快递或冷藏车队运营商。
