      - number: '2.2'
        title: 规模测算：市场大，但精度弱
        blocks:
          - type: paragraph
            body: >-
              市场显然很大，但公开估算精度较弱，因为不同发布方采用的边界不同。十四五规划称，2020 年中国冷链物流市场规模超过 RMB 380 billion，冷库容量近 180 million 立方米，冷藏车约
              287000 辆。到 2025 年，CFLP 口径报道引用的冷链物流量为 381.4 million 吨，冷库容量按来源不同为 267-277 million 立方米；IIFIIR 则估算冷藏车队为 587900
              辆。即使不套用私募市场收入模型，这些物理指标也都指向一个重大的全国基础设施市场。


              问题出在发布方开始给出金额时。Research and Markets 估算中国冷链物流 2024 年规模为 USD 85.82 billion，Mordor 估算 2025 年为 USD 94.46
              billion，Verified Market Research 则把 2024 年放在仅 USD 17.2 billion。这些数字不能负责任地取平均，因为方法论很可能不同：有的只计正式 3PL
              收入，有的计更宽的温控物流，有的只计更窄的服务子集。承销这个品类时，最好把 TAM
              视为一个区间，并且只把公司规模和货量视角作为方向性参考。市场毫无疑问足够大，能容纳多个规模化赢家；但公开口径标准化程度不够，不足以支撑一个干净的 TAM 单点数字。
