      - number: '1.5'
        title: 里程碑与负面背景
        blocks:
          - type: paragraph
            body: >-
              Fresh Life 的里程碑密度很高。官方发展历程页展示了早期一连串动作：全国扩张、数字系统上线、研究院设立、参与标准制定、融资、发布 ESG、商业化技术品牌。这个时间线支持一个判断：Fresh Life
              不只是物流整合平台，而是有意把自己做成标准化冷链操作系统。2025 年新闻列表和 New Hope 2026 简介显示，2024 年 B+ 轮之后，公司继续押注 AI、数字升级和服务能力品牌，而不是转向收缩。


              负面背景主要是结构性的，不是丑闻驱动。直接审阅到的最佳负面来源是一篇 Tencent / 投中风格长文，认为 New Hope 为搭建平台容忍了很大的孵化亏损，并反复投入重金做技术。同一文章称，Fresh
              Life 在确定战略前研究了几十家头部冷链运营商，到 2021 年 A 轮时已在 IT 和 200 人团队上投入约 RMB 200
              million。这些都不能证伪商业模式；事实上，它们可能解释了网络领先。但这也意味着，Fresh Life
              的规模来自发起方支持下的资本强度，而不是公开表述中显而易见的自我造血模型。这是后续所有财务和估值分析的核心解释性保留。
