  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Fresh Life 的市场不是全部物流，也不是全部食品分销。最贴近的是中国温控 B2B
              冷链物流市场：预冷、冷藏仓储、干线运输、多温区城配、越库和分拣，以及确保产品从源头到交付都保持在要求范围内的可视化或追溯层。十四五规划把冷链物流定义为由冷库、冷藏车和配套设备支撑的端到端温控物流，因此软件、监控和物理执行应放在一起分析，而不是拆成无关市场。


              对 Fresh Life 而言，最关键的需求池是连锁餐饮、生鲜零售、乳制品和蛋白品牌、食品生产商或贸易商，以及团餐或酒店供应。官方客户组合——Sukiya、Starbucks、Hema、Yili、New Hope
              Liuhe 和 7-Eleven Chongqing——正好贴合这一画像。市场边界不包括常温包裹物流、干仓，以及通用普货运输。主要替代方案包括自营冷链、区域专业冷链 3PL，以及 SF、JD
              Logistics、Cainiao 等更大生态旗下的一体化平台业务。因此，Fresh Life 争的是一个真实品类中的外包工作流份额，而不是从零创造新品类。
