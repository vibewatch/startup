      - number: '8.4'
        title: 估值结论与重估触发因素
        blocks:
          - type: paragraph
            body: >-
              当前最可辩护的立场是公允 / 跟踪，中等置信度。公司确实有资产，可以支撑相对普通货运或非专门 3PL
              的明显溢价：全国分支覆盖大、网络深、客户密度说法强，官方和二级来源里关于数字控制的叙事也高度一致。中国冷链建设中的政策和需求顺风也在托底。这些因素解释了为什么 Fresh Life
              即使身处硬资产行业，也能守住独角兽级别估值。


              同时，估值上限仍被披露质量压住。投资人仍缺少经审计的收入、利润率、现金流、集中度和事故率数据；风险章节也显示，食品安全、能源、劳动力或伙伴网络问题很容易伤害经济性。因此，Fresh Life
              只有在证明大客户留存稳定、损耗和腐损经济性有吸引力、营运资本纪律严格，并且能源和劳动力通胀可管理时，估值才应上调。如果增长依赖持续补贴，如果少数客户主导收入，或如果出现严重合规或质量问题，估值就应下调。仅凭公开证据，正确结论是：Fresh
              Life 最后一次报道的独角兽估值仍然可信，但已经计入了相当多未来执行成功。
