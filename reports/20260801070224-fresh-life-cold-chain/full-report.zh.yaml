  - id: FV001
    title: 融资与估值标记时间线
    type: timeline
    layout: wide
    summary: Fresh Life 从 2021 年 A 轮到 2022 年独角兽地位快速重估，并借 2024 年 B+ 轮再次确认估值标记。
    data:
      items:
        - label: A 轮
          date: '2021-01-19'
          details: 36Kr 和 Tencent 披露 A 轮融资为 RMB600m，并给出约 RMB5bn 的估值信号。
        - label: A+ 轮
          date: '2022-01-01'
          details: 36Kr 列出 2022 年 1 月一笔金额未披露的 A+ 轮。
        - label: B 轮 / 跻身独角兽
          date: '2022-03-11'
          details: 36Kr 和 CB Insights 将 2022 年 3 月 B 轮与约 RMB10bn / ~$1.58bn 估值相连。
        - label: B+ 延展轮
          date: '2024-11-05'
          details: FoodTalks、Toutiao 和 CB Insights 把 B+ 轮描述为对独角兽地位的再次确认，B 轮累计融资接近 RMB900m。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
