      - number: '1.2'
        title: 管理层、孵化与治理锚点
        blocks:
          - type: paragraph
            body: >-
              与运营规模披露相比，Fresh Life 的公开管理层披露更薄。资料集中最清晰的具名高管是 Xi Gang；36Kr 和 Fresh Life 自身 2024 年融资报道均称其为 Fresh Life Cold
              Chain 董事长、Grassroots Zhiben 总裁，后者是 New Hope 体系内孵化该公司的投资平台。36Kr 另列 Sun Xiaoyu
              为法定代表人。官网没有发布完整董事会、执行委员会或治理名单，因此可观察的治理图景集中在孵化方和控股股东生态，而不是一个公开、完整的管理团队。


              Fresh Life 的孵化故事具有战略意义。多家与公司有关及独立来源均显示，公司诞生于 New Hope Group 旗下消费投资平台 Grassroots
              Zhiben，随后通过外部融资向外扩张。第三方报道进一步称，Grassroots Zhiben 仍是主要股东，Liu Yonghao 通过 New Hope 生态拥有最终控制权。上述说法合理，也符合 New
              Hope 更大的叙事，但本轮研究没有直接抓取股东名册支持，因此控制权只能表述为强烈指向，而不是已由第一手备案完全核实。治理舒适度更多来自发起方质量和持续投入，而不是透明的正式披露。
