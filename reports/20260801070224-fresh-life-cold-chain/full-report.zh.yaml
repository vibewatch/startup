      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是好坏参半。Fresh Life
              似乎已做出真实规模：企业客户广度、日订单量、大规模路线和仓储网络、反复融资，都很难造假。公司也在搭建比商品化冷藏车队更高价值的运营栈，长期可能带来更好留存和更密集的客户经济性。但这些都无法覆盖核心承销问题：没有公开审计披露收入组合、毛利率、EBITDA、现金生成或资产负债表韧性。一个基础设施需求很重的非上市物流企业，运营上可以很亮眼，单位经济性仍可能脆弱。


              正确姿态是把 Fresh Life
              看作财务上有吸引力、但披露不足的公司。它的收入规模可能大于典型创业公司，战略位置也强于本地冷链运营商；但它很可能同样背负该行业典型重资产负担：已实现利润率薄、对人工和能源敏感、需要反复资本投入。这意味着，后续尽调应少看虚荣规模，多看贡献利润率、现金转化、仓库经济性、资本开支与租赁组合、客户集中度和资金续航。在这些披露之前，本报告只能把业务评为潜力强、但财务不透明。
