      - number: '8.3'
        title: 情景区间与承保观点
        blocks:
          - type: paragraph
            body: >-
              因此，务实的估值框架应锚定收入倍数，而不是盈利倍数。公开证据不足以支撑 EBITDA 或 DCF 式精确度。已披露市场数据支持一个很宽的收入倍数走廊：JD 给出高 0.3x 区间附近的下沿，Americold
              位于中 1x 区间，Lineage 位于高 1x 区间。Fresh Life
              不应站在区间顶部，因为投资人无法用公开证据核验利润率、营运资本强度或经常性客户经济性。但它也未必该站在底部，因为公司处在中国食品基础设施里结构性渗透不足的一段，已经证明全国规模，并且似乎把实体网络密度和比许多区域冷链运营商更成熟的数字运营层结合起来。


              以用户提供且媒体报道的约 RMB 10 billion 收入锚点测算，保守熊案按 0.6x，股权价值约 RMB 6 billion；均衡基准情景按约 0.8x-1.0x，股权价值 RMB 8-10
              billion；拉伸牛案按约 1.1x-1.2x，股权价值约 RMB 11-12 billion。这个区间有意比上市可比范围更窄，因为 Fresh Life
              的私营状态和披露缺陷要求压缩高端估值，而其专业化又支持相对 JD 式低端物流定价的溢价。核心结论是，广泛引用的 RMB 10 billion
              独角兽估值并不明显荒唐，但也看不出明显便宜；它更接近纪律化基准情景的上沿，而不是深度折价区。
