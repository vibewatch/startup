      - number: '7.3'
        title: 合作方、依赖与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Fresh Life
              的规模一半是优势，一半是依赖系统。公司声称能调动数十万辆车、大规模云仓能力和数千家合作冷链物流企业。这有助于它快速服务全国客户，但也意味着执行质量可能取决于大量交易对手、分包承运商、冷库伙伴和本地运营团队。Lineage
              的公开申报显示，即使是规模大得多的冷链网络，也仍然担心客户集中、出租率、竞争和保价能力。Tencent 关于 Fresh Life
              的长文也再次说明，这门生意需要战略支持者和反复资本投入，才能把网络和技术栈搭起来。


              竞争会放大这些依赖风险。SF、JD Logistics、Cainiao 这样的大平台可以压价，或赢下整合采购竞标；客户也可以选择自建冷链能力，或按地区拆分供应商。Lineage
              的申报在这里是有用类比：它明确警告，客户或潜在客户可能自建仓库，竞争对手可能在同一市场增加设施，运营商可能被迫下调租金、仓储费或服务费来守住业务。Fresh Life
              在中国食品物流里很可能面对同样的结构性危险，尤其是在线路密度下滑，或更大平台决定把冷链更激进地打包进更宽的物流合同时。
