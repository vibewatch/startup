      - number: '3.3'
        title: 商业模式、打包方式与买方切换
        blocks:
          - type: paragraph
            body: >-
              与 SaaS 相比，中国冷链物流的商业信息仍不透明。在已审阅来源中，Fresh Life、SF、JD Logistics、Cainiao 和 Americold
              都没有为多数企业冷链工作流发布标准化价目表。它们的公开页面更强调能力、场景、行业适配和联系人驱动的销售流程。这意味着，买方常通过试点、路线经济性、损耗下降、仓库利用率、品类适配和标杆客户来比较服务商，而不是看公开费率卡。价格不透明会略微有利于覆盖更广、采购信任更强的大型老牌玩家，因为它们进入流程时，品牌信任和宽服务菜单已经可见。


              切换成本真实存在，但不是绝对。一旦食品连锁或乳制品品牌把订单流、温度追踪、对账和门店配送日历接入某个运营商，迁移这套工作流会很痛。同时，许多买方可以按地域、温区或客户分层多供应商并用。一家公司可能在食品密集的城配线路上保留
              Fresh Life 这样的专业商，同时把 JD 或 SF 用在其他流向，或者把 Cainiao 的保税和跨境能力与国内餐饮配送分开使用。商业含义是，Fresh Life
              不需要在所有地方替换每个老牌玩家；它需要赢下高密度、可背书的运营口袋，让服务质量和软件工具重要到足以在多供应商环境中留下来。
