      - number: '2.4'
        title: 增长驱动、采用约束与结构瓶颈
        blocks:
          - type: paragraph
            body: >-
              最强驱动清晰，而且彼此强化。政府政策明确支持建设更多全国冷链节点、提升标准化、扩大追溯覆盖、强化骨干基础设施。消费模式正在转向生鲜农产品、进口冷鲜蛋白和更快的零售周期。电商和即时零售压缩配送窗口，也让门店层面的服务完整性更可见。医药和生物制品带来收益率更高的相邻赛道，并抬高整个市场的技术预期。政府、分析师和行业来源也反复提到，数字化、AI
              和更绿色的车队正在重塑这个品类。


              约束同样是结构性的。政府自己也说，中国仍落后于发达市场，基础设施不均、融资困难、资源整合弱、标准不完整、专业化不足。Mordor 和 VMR
              又补充了末端车队碎片化、技术人员短缺、电力和资本开支负担高、技术采用不均等问题。Lenglianwuliu 2025 年报告显示，即便头部运营商也承受盈利压力，其样本平均利润率低于
              4%。结果是一个有真实顺风、但经济性并不轻松的市场：需求增长是真的，但这个品类仍会惩罚运营失误、密度不足和资本不足的扩张。
