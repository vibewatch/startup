      - number: '3.2'
        title: 能力对比：网络、软件与垂直适配
        blocks:
          - type: paragraph
            body: >-
              能力宽度比原始车辆数量更重要。SF 的公开报告把公司呈现为中国快递、快运、冷链、同城配送和供应链市场领导者，拥有全国农业网络和大量 R&D 投入。JD Logistics
              的公开服务菜单清楚地把冷链和生鲜物流放进更宽的仓储、配送、医药和数字供应链栈中，尽管冷链详情页受 JS 限制。Cainiao
              的全球供应链页面强调全链路追溯、保税运营、跨境仓储和专门品类处理，其中包括冷链品类。相比之下，Americold 把自己定位为冷供应链专业商，聚焦设施、运输、进出口和增值服务，而不是宽泛的中国电商物流平台。


              当食品行业密度、多温区城配和软件介入执行同时重要时，Fresh Life 的差异化最清楚。官方客户和 SaaS 材料显示，Fresh Life 不只是仓库加卡车运营商：它用
              OMS、TMS、WMS、风控和路线可视化工具支撑企业食品工作流。这让它更有机会对抗区域冷链服务商和更窄的运输车队。但面对 SF、JD 和 Cainiao
              时，竞争逻辑会切换。那些对手能把冷链打包进更大的物流、技术或商业生态。Fresh Life 因此在专业食品冷链执行上最强；当买方更看重一站式平台宽度而非品类专业性时，它最弱。
