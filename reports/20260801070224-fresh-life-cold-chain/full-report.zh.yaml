  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接对手
        blocks:
          - type: paragraph
            body: >-
              Fresh Life 面对的不是单一可比公司。中国冷链市场仍然分散，Mordor 和 Research and Markets
              提到的是大型全国运营商和专业服务商，而不是一个由单一玩家主导的赛场。实际竞争中，Fresh Life 至少面对四类对手：SF、JD Logistics 等国内一体化物流平台；Cainiao
              等供应链和保税网络运营商；Sinotrans、Beijing Ershang 等国资或传统全国物流集团；以及 Americold 和 Lineage
              关联中国布局等国际冷库专业商或合资平台。这一点重要，因为买方任务不同，基准就会变。全国连锁餐饮可能拿 Fresh Life 与 SF 或 JD 比网络触达和服务一致性；仓储需求重的跨国公司则可能拿它与
              CMAC、Americold 或其他专业冷库运营商比较。


              最强的公开证据把 Fresh Life 放在这一赛场的中间位置。公司材料称，它已成为中国最大的技术驱动 To B
              冷链运营商之一，拥有全国分支网络、大规模门店覆盖和重软件投入。但最大的平台型公开竞争对手仍拥有更宽的生态、上市公司资产负债表，或更深的跨境与多产品服务组合。因此，这个品类不是赢家通吃或赢家吃掉大多数。它是分层市场，Fresh
              Life 可以在局部或垂直场景很强，但不必、也尚未在每个维度上超过所有全国老牌玩家。
