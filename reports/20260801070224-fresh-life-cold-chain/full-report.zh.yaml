      - number: '1.3'
        title: 融资历史、估值与资本形成
        blocks:
          - type: paragraph
            body: >-
              作为一家中国非上市物流公司，Fresh Life 的融资历史罕见地有较多交叉印证。36Kr 记录了 2018 年天使轮、2021 年 1 月 RMB 600 million A 轮、2022 年 A+ 轮和 B
              轮，以及 2024 年 11 月 B+ 轮。FoodTalks、CFSN、Sina、Sohu 和 Toutiao 的独立或合作方报道，在近期核心事实上一致：2024 年 11 月 B+
              轮融资规模为“数亿元人民币”，投资方包括 Shuxin Tongyuan、Ningbo Xingfeng Industrial Group 等，并把 B 轮系列累计融资推至接近 RMB 900
              million。CB Insights 独立记录的最新轮次日期为 2024-11-05，并给出 2022 年 3 月估值 US$1.577 billion。


              关键尽调细节在于，“累计融资额”在不同来源之间并不完全一致。CB Insights 显示六轮合计 US$92.61 million，而中文报道仅 B 轮系列累计融资就接近 RMB 900
              million。这些数字并不直接矛盾——部分轮次未披露，数据库经常漏掉部分金额，人民币-美元换算也取决于纳入哪些轮次——但它们不能互换使用。最稳妥的表述是：Fresh Life 到 2022
              年已明确进入独角兽状态，并在 2024 年通过 B+ 轮后续资本再次确认这一状态；准确累计融资额仍是尽调项，而不是一个干净的公开数字。
