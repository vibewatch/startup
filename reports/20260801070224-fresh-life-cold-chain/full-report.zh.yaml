      - number: '4.2'
        title: 成本结构、单位经济与利润率视角
        blocks:
          - type: paragraph
            body: >-
              这套商业模式显然重资本、重运营。Fresh Life 自身概览强调 1100 万+ 平方米云仓、35 万+ 辆连接冷链车，以及全国分支网络。FoodTalks 描述的增长模式是“并购 +
              自建”，并提到公司持续投入 AI 调度、控制塔、冷链车辆和智慧仓网。Tencent 长文又补充称，到 A 轮时，管理层已经花费约 RMB200 million 搭建 200 人 IT 团队，并预计 2021
              年下半年再投入 RMB200 million。这些事实指向几个重成本桶：人工、干线和城配履约、冷库能源和设施、技术人员薪酬、车辆 / 设备合作，以及与食品分销和结算绑定的营运资金。


              Fresh Life 不披露利润率，最好的公开视角是把其可能经济性与上市物流和冷库运营商比较。JD Logistics 2025 年中期报告显示，收入 RMB98.5 billion，毛利率 9.0%，非
              IFRS EBITDA 率 9.6%；仅上半年，在扣除处置后仍需要 RMB2.4 billion 资本开支。Lineage 2024 年 10-K 显示，收入 $5.3 billion，Adjusted
              EBITDA $1.3 billion，物业、厂房和设备购买额 $691 million，同时仍有净亏损。它们不是 Fresh Life
              的直接可比公司，但说明一个重要点：规模化物流和冷链领导者仍可能只有温和经营利润率、明显资本强度，并需要严格管理利用率。因此，在管理层披露按线路、仓库和客户分层的实际贡献利润率之前，Fresh Life
              的利润率路径应保守承销。
