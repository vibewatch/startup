  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与估值锚点
        blocks:
          - type: paragraph
            body: >-
              Fresh Life 的估值历史只能从公司周边新闻、创业数据库和二级资料里拼出来，所以估值的第一步不是追求精确，而是三角校验。最稳定的模式是，公司在 2021 到 2022 年之间快速重估，随后用 2024 年
              11 月的 B+ 延伸轮确认独角兽估值，而不是彻底重置。36Kr 的 PitchHub 页面列出轮次顺序和日期；Tencent 长文称，2021 年 A 轮估值约为 RMB 5 billion，2022
              年轮次把估值翻到 RMB 10 billion；Toutiao 和 FoodTalks 都把 2024 年 B+ 轮描述为巩固独角兽地位，累计 B 轮融资接近 RMB 900 million。CB
              Insights 还给出一条机器可读的私募市场标记：2022 年 3 月估值为 $1.577 billion，最新融资轮发生在 2024 年 11 月 5 日。


              更难的是收入分母。公开说法显示，销售额后来超过 RMB 10 billion，但这些说法没有经审计财务报表支撑。Tencent 称，公司减少对 New Hope 内部业务依赖后，2021 年上半年收入超过 RMB
              3 billion；Toutiao 后来又称 Fresh Life 估值和销售额都超过 RMB 10 billion。官方材料确实能印证大规模全国版图，但不能给出干净的 P&L。因此，当前承保应把 Fresh
              Life 看作战略型、规模重的私营物流运营商：它有已知融资估值历史，但收入质量只部分披露；而不是一家披露充分的后期科技资产。
