  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Fresh Life 不发布审计财务报表，因此本章必须依赖收入机制证据和牵引力代理指标，而不是干净的已披露 P&L。公开产品和案例材料显示，公司有多层可货币化能力：仓储、干线、城配、结算、路线编排、冷链
              3PL，以及由软件支撑的供应链工作流。公司服务页和 Yunlizhi 材料明确显示，Fresh Life 变现的是物理执行加工作流工具的组合，而不是单一轻资产 SaaS
              费用。这意味着收入质量很可能取决于路线密度、仓库利用率、温控合规表现，以及向同一企业账户叠加多项服务的能力。


              公开牵引力信号真实但不均衡。Fresh Life 称其服务 5000+ B 端客户、日订单超过 100000 单，覆盖 31 个省和 100 多万家门店。一篇 Tencent 长文称，公司在降低对 New
              Hope 内部业务依赖后，2021 年上半年收入突破 RMB3 billion；后续融资报道则暗示业务到 2024
              年仍在扩张。这些信号说明吞吐量可观，但在缺少分部组合、内外部收入占比、合同结构和毛利可见性的情况下，不能直接转化为持久或高质量收入。最稳妥的判断是，Fresh Life
              已有有意义的收入规模，但公开记录不足以验证准确收入运行率或收入质量。
