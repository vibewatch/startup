companyProfile:
  summary: >-
    Fresh Life Cold Chain（鲜生活冷链物流）是一家 B2B 冷链物流平台，2016 年成立，由 New Hope Group
    孵化，运营中心与成都密切相关。公司运营全国性的温控仓、路径系统和末端配送能力，服务商超、连锁餐饮、便利店和生鲜食品企业。公开来源显示，2024 年 11 月 B+ 轮融资后，公司估值进入独角兽区间，B 轮系列累计融资接近
    RMB900M，据报销售额超过 RMB10B。
  foundedDate: '2016-11-24'
  founders:
    - name: Liu Chang (刘畅)
      role: 主要支持方 / 董事会参与者
      background: New Hope Group 创始人 Liu Yonghao 之女；通过 New Hope 和 Grassroot Zhiben 参与孵化并提供战略支持。
      claimRefs:
        - CO015
    - name: Xi Gang (席刚)
      role: 董事长 / 运营发起人
      background: Grassroot Zhiben 总裁、Fresh Life 董事长，经常在 Fresh Life 融资、战略和数字冷链建设报道中被引用。
      claimRefs:
        - CO015
  foundingLocation: Chengdu, Sichuan, China
  headquarters: Chengdu, Sichuan, China
  productSummary: 面向生鲜果蔬、肉类、海鲜、乳制品和预制食品客户，提供温控仓储、干线和末端配送、控制塔监控，以及数字冷链工作流工具。
  customerFocus: 覆盖中国各地连锁商超、餐饮集团、便利店、食品生产商、生鲜零售商，以及其他 B2B 食品分销客户。
  businessModel: 通过仓储、分拣、运输、结算和供应链服务收费，并由数字控制塔、路径规划和追溯系统支撑。
