  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与全国覆盖
        blocks:
          - type: paragraph
            body: >-
              理解 Fresh Life 的客户基础，最好按工作流，而不是按面向消费者的品牌标签。公司反复瞄准连锁餐饮、生鲜零售、食品加工与贸易、团餐或酒店式餐饮买方，这些客户需要定期多温区补货。公司自身概览称，其已服务
              5000 多家 B 端客户，覆盖 31 个省和 2800 个区县，并通过全国柔性履约网络触达 100 多万家门店。FoodTalks 又称，公司覆盖细分行业前 20 大客户中的 60%
              以上。这些信号意味着，客户策略并不只是“很多小门店”，而是赢下大型锚定账户，用其下游门店或路线网络创造密度。


              这个定位解释了为什么具名账户在公开记录中如此重要。Fresh Life 不发布流失率或合同金额表，而是指向 Starbucks、Sukiya、New Hope Liuhe、Yili、Hema 和 7-Eleven
              Chongqing 等品类头部买方。因此，客户视角首先看企业密度：赢下一个全国或区域连锁账户，再利用该账户的路线复杂度和频次，加深仓储、运输和数字工作流使用。这是一条可信的 B2B
              冷链路径，但也意味着公开层面更容易看到客户质量，而不是客户经济性或留存质量。
