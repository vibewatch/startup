      - number: '8.2'
        title: 上市可比视角
        blocks:
          - type: paragraph
            body: >-
              最好的上市可比公司也不完美，更适合作护栏，而不是直接定价模板。JD Logistics 是最干净的大型中国物流基准：CompaniesMarketCap 显示其 2026 年 8 月市值为 $11.73
              billion，收入页显示 2025 年收入为 $31.03 billion，公司自己的 1H25 文件披露收入 RMB 98.5 billion、non-IFRS EBITDA 利润率
              9.6%。按这些证据，JD 的交易倍数低于 0.5x 收入，反映的是综合物流的规模和薄经济性，而不是软件式市场偏好。Lineage 作为冷链专营商更贴近。CompaniesMarketCap 显示其 2026 年
              8 月市值为 $10.62 billion，TTM 收入为 $5.36 billion；2024 年 10-K 披露收入 $5.3 billion，公开估值约为 2x 销售额。Americold
              介于两者之间，CompaniesMarketCap 显示市值 $4.03 billion、TTM 收入 $2.60 billion，当前 P/S 页面约 1.4x。


              这组倍数跨度比任何单个数字更重要。Fresh Life 比 JD Logistics 更专门，如果其冷链网络、客户密度和数字控制栈是真正的经济差异化，它大概率应该相对综合型一体化 3PL 倍数享有溢价。但它也比
              Lineage 或 Americold 更不透明、流动性更差，没有公开利润率披露，没有经审计的多年报表，执行风险也很高。换句话说，上市冷链专营商说明，当质量和耐久性可见时，市场有时愿意为冷藏基础设施支付高于 1x
              销售额的价格；但 Fresh Life 的披露缺口不支持在没有折价的情况下假设峰值纯冷链倍数。
