  - - Customer / data secrecy breach
    - Fresh Life sunshine rules prohibit leaking trade secrets, core technology, and customer info
    - Data leakage can combine legal, customer, and competitive harm
    - Medium-high
    - Awareness visible; external audit evidence absent
