  - - Standards non-compliance
    - Standards platforms and GB / food-safety updates show evolving technical obligations
    - Cold chain can fail through paperwork and process gaps, not just physical failure
    - High
    - Systemization may help but evidence is indirect
  - - Bribery / corruption / procurement abuse
    - Fresh Life sunshine rules prohibit bribery and asset misuse
    - Third-party-heavy logistics networks are vulnerable to improper payments
    - Medium-high
    - Audit hotline and explicit red lines exist
  - - False records or off-system operations
    - Fresh Life sunshine rules prohibit falsifying records and bypassing systems
    - Operational fraud can distort quality, settlement, and margin
    - High
