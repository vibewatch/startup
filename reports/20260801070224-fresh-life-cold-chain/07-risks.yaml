- id: people-execution-and-kill-criteria
  title: People, execution, and kill criteria
  body: |-
    The people and governance burden is unusually high for a company trying to merge logistics, refrigeration, digital systems, and national food-account service. Tencent’s profile says management had to “break the traditional enterprise architecture” and build an IT team to unlock efficiency, while FoodTalks says the AI-SOP model is meant partly to solve the shortage of experienced cold-chain operators. Fresh Life’s own compliance rules warn against bypassing systems, falsifying data, fake transactions, conflicts of interest, and misuse of capacity or data. Taken together, these signals imply that the company’s execution risk is not just market-side; it is organizational. If field teams, settlement staff, or local operators operate outside standardized systems, the business could quickly accumulate quality failures, leakage, fraud, or margin erosion.

    The right investment discipline is therefore to define kill criteria early. A single severe food-safety or quality incident, evidence of material off-system operations, unexpected concentration in a handful of large customers, deterioration in funding access, or proof that energy and labor inflation cannot be passed through would all materially weaken the underwriting case. Fresh Life may still be worth tracking because its controls, traceability emphasis, and productization look stronger than those of a typical regional operator. But its risk profile remains high because the business sits at the intersection of food safety, industrial operations, and capital-intensive logistics. That intersection can reward disciplined operators, but it punishes control slippage quickly.
