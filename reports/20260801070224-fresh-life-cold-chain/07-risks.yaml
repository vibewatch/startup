- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Area
  - What would improve confidence
  - Kill trigger
  - Why it matters
  rows:
  - - Food safety and quality
    - Independent incident history, excursion rates, and claims data
    - Severe unresolved food-safety event or repeated temperature-control failures
    - Cold-chain trust can collapse quickly
  - - Control environment
    - Evidence that settlements and operations stay inside controlled systems
    - Material off-system workflows, fake transactions, or audit breakdowns
    - Control slippage undermines economics and legality
  - - Funding resilience
    - Visible runway, liquidity policy, and moderate fixed obligations
    - Funding crunch or next-round dependence without clear path
    - Asset-heavy operators can fail while growing
  - - Customer concentration
    - Healthy top-customer mix and strong renewal behavior
    - Overdependence on a handful of large chains
    - Concentration amplifies shock risk
  - - Cost pass-through
    - Proof that labor and energy inflation can be managed or passed through
    - Sustained margin compression with no pricing response
    - Cold-chain economics are thin
  - - Execution consistency
    - Stable SLA / OTIF / spoilage metrics across regions
    - Deterioration as the network expands
    - Scaling quality is the core underwriting question
  notes: Kill criteria are designed for follow-on diligence, not because the public record proves they have already been breached.
