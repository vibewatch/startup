  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-cap-table-and-control-chain
    missingEvidence: A current shareholder register or cap table directly confirming Grassroots Zhiben ownership, minority investors, and the exact control chain to Liu Yonghao or other ultimate controllers.
    whyItMatters: Ownership precision determines governance rights, related-party risk, dilution history, and any future exit constraints.
    diligencePath: Obtain a recent registry extract, shareholder agreement summary, or board-approved cap table from company counsel or an onshore database with document-level support.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited revenue, gross margin, EBITDA, cash flow, and debt statements for 2022-2025.
    whyItMatters: Public materials provide strong scale claims but weak evidence on quality of earnings and capital efficiency.
    diligencePath: Request audit reports, lender materials, or board packs supporting revenue and margin history.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: scale-metric-drift
    missingEvidence: A reconciled current operating-metrics pack explaining why some sources cite 350k vehicles and 1.15M stores while the New Hope 2026 article cites 400k vehicles and 1.3M stores.
    whyItMatters: Later chapters need a stable base for customer, market-share, and valuation analysis.
    diligencePath: Request the internal KPI deck underlying the latest financing or sponsor communications and map metric definitions by date.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-disclosure-depth
    missingEvidence: A full executive roster, board composition, and committee structure from first-party sources.
    whyItMatters: Key-person risk cannot be sized confidently if only the chairman and legal representative are public.
    diligencePath: Request an organization chart and current board slate from management or investor-relations contacts.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO002
  - type: restricted-access
    severity: minor
    topic: litigation-dataset-access
    missingEvidence: Directly reviewed legal-case detail from Qichacha, Aiqicha, or court databases sufficient to quantify dispute exposure.
    whyItMatters: Cold-chain infrastructure businesses often accumulate contract, warehouse, and labor disputes that affect diligence risk scoring.
    diligencePath: Review authenticated Chinese company-database exports or court records with document access rather than snippet-level summaries.
    relatedQuestionRefs:
    - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: to004-milestone-date-precision
    missingEvidence: Exact month/day support for several 2025-2026 milestone items that are visible only as official news-list headlines or summary report references.
    whyItMatters: The milestone table is the chronology of record; lower-precision dates slightly reduce comparability across later chapters.
    diligencePath: Fetch the underlying detail pages or award reports for each 2025-2026 milestone to replace year-level entries with exact dates.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
