- id: funding-valuation-history
  title: Funding history, valuation, and capital formation
  body: |-
    Fresh Lifes funding history is unusually well corroborated for a private Chinese logistics company. 36Kr records an angel round in 2018, a RMB 600 million Series A in January 2021, A+ and B rounds in 2022, and a B+ round in November 2024. Independent and partner-affiliated coverage from FoodTalks, CFSN, Sina, Sohu, and Toutiao all align on the main recent facts: the November 2024 B+ round was for “hundreds of millions of RMB,” included investors such as Shuxin Tongyuan and Ningbo Xingfeng Industrial Group, and brought cumulative Series B financing close to RMB 900 million. CB Insights independently records the latest round on 2024-11-05 and gives a March 2022 valuation of US$1.577 billion.

    The main diligence nuance is that “total raised” is not perfectly consistent across sources. CB Insights shows US$92.61 million over six rounds, while Chinese-language coverage frames cumulative B-round financing alone at nearly RMB 900 million. Those numbers are not directly contradictory — some rounds are undisclosed, databases often omit partial amounts, and RMB-USD translation depends on which rounds are counted — but they are not interchangeable. The safest framing is that Fresh Life clearly achieved unicorn status by 2022 and reaffirmed that status with follow-on B+ capital in 2024, while exact cumulative capital raised remains a diligence item rather than a clean public number.
  claimRefs:
