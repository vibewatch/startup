- id: leadership-backer-governance
  title: Leadership, incubation, and governance anchors
  body: |-
    Public leadership disclosure is thinner than the companys operating-scale disclosure. The clearest named executive in the source set is Xi Gang, identified by 36Kr and Fresh Lifes own 2024 financing coverage as chairman of Fresh Life Cold Chain and president of Grassroots Zhiben, the New Hope-affiliated investment platform that incubated the company. 36Kr separately lists Sun Xiaoyu as legal representative. The official site does not publish a full board, executive committee, or governance roster, so the observable governance picture is concentrated around the incubator and the controlling shareholder ecosystem rather than around a broad public management bench.

    Fresh Lifes incubation story is strategically important. Multiple company-linked and independent sources agree that the company was built inside New Hope Groups consumer-investment platform Grassroots Zhiben and then scaled outward through external financing. Third-party reporting further states that Grassroots Zhiben remains the dominant shareholder and that Liu Yonghao is the ultimate controller through the New Hope ecosystem. Those claims are plausible and consistent with the broader New Hope narrative, but they are not supported by a directly fetched shareholder register in this run, so control should be described as strongly indicated rather than fully verified from first-party filings. Governance comfort therefore comes more from sponsor quality and longevity than from transparent formal disclosure.
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO021
  - CO036
  - CO037
