company:
  name: Fresh Life Cold Chain
chapter:
  number: 1
  title: Company Overview
  summary: Fresh Life Cold Chain is a China-based B2B cold-chain logistics and supply-chain platform incubated by New Hope Group and scaled through a mix of acquisitions, network build-out, and logistics software. Official and partner-affiliated materials consistently place the operating center in Chengdu, show a nationwide branch and warehouse network, and identify the company as one of the largest independent technology-led cold-chain operators serving foodservice, retail, and food-manufacturing customers. The key diligence takeaways are strong strategic sponsorship and operating scale, but also materially incomplete governance and financial disclosure, scale-metric drift across sources, and evidence that building the platform required unusually high capital tolerance.
sections:
- id: identity-operating-model
  title: Identity, headquarters, and operating model
  body: |-
    Fresh Life Cold Chain Logistics Co., Ltd. was formally established in November 2016, with 36Kr listing the companys incorporation date as 2016-11-24. The official Fresh Life site presents the company as a cold-chain supply-chain service provider for restaurant chains, fresh-food retailers, food processors and traders, and group-meal or hotel customers, offering source-to-store warehousing, linehaul, city distribution, and digital-control-tower capabilities. Official contact pages place the day-to-day operating center in Chengdu, Sichuan, while 36Kr shows a registered address in Lhasa. That split is not uncommon for Chinese private companies, but it matters because it means “headquarters” in public narratives refers to the operating center rather than necessarily the legal registration seat.

    The business model is not just transportation. Fresh Life repeatedly describes itself as using mergers and acquisitions, regional integration, and digital tooling to create a national cold-chain infrastructure layer. The current official overview describes eight business groups spanning cold-chain operations, technology, park operations, agricultural-assistance services, ingredient distribution, and group-meal operations. The service proposition is a full cold-chain workflow: warehouse capacity, scheduled trunk routes, route planning, store delivery, temperature visibility, and increasingly AI-enabled reconciliation and risk-control tooling. This matters for later chapters because Fresh Life should be analyzed more like an industrial supply-chain platform than a narrow courier or reefer-fleet operator.
