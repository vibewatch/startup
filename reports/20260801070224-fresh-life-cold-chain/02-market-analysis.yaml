  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: tam-estimate-methodology-conflict
    missingEvidence: Publisher methodology notes detailed enough to reconcile why China market estimates range from USD 17.2B to USD 94.46B for roughly the same period.
    whyItMatters: Without boundary reconciliation, TAM precision is weak and valuation narratives can be overstated.
    diligencePath: Obtain full analyst reports or methodology appendices from each publisher and normalize by service scope, geography, and revenue basis.
    relatedQuestionRefs:
    - QM014
    - QM015
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: fresh-life-sam-som-model
    missingEvidence: Internal revenue split by customer vertical, geography, and service line to convert market background into a defensible SAM/SOM model.
    whyItMatters: A real investability view depends on what portion of the national cold-chain market Fresh Life can practically serve and win.
    diligencePath: Request management reporting by vertical, region, and service line plus lane-level density economics.
    relatedQuestionRefs:
    - QM025
    - QM026
    relatedTableRefs:
    - TM002
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-budget-ownership-detail
    missingEvidence: Direct procurement documents or buyer interviews confirming precise budget ownership by segment.
    whyItMatters: Buyer-user-payer alignment affects sales cycles, retention, and pricing power.
    diligencePath: Review tenders, procurement postings, or buyer interviews for restaurant, retail, and dairy segments.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM003
  - type: restricted-access
    severity: minor
    topic: samr-standard-detail-access
    missingEvidence: A directly readable version of the underlying national standard text rather than only the open standard platform placeholder.
    whyItMatters: Specific handling and traceability rules could sharpen the regulatory adoption case.
    diligencePath: Pull the full standard text from a standard database or paid repository with document access.
    relatedQuestionRefs:
    - QM002
    relatedTableRefs:
    - TM001
  - type: private-evidence-only
    severity: minor
    topic: regional-profitability-by-lane
    missingEvidence: Granular lane-level profitability and asset-utilization data across inland vs coastal cold-chain networks.
    whyItMatters: Industry average profit margins hide whether integrated operators really earn better economics in dense routes.
    diligencePath: Request route-level margin or warehouse-utilization cohorts from company or channel partners.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
