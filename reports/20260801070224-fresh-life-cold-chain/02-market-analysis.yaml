company:
  name: Fresh Life Cold Chain
chapter:
  number: 2
  title: Market Analysis
  summary: 'Fresh Life operates inside China''s large but still structurally underbuilt cold-chain logistics market. Government planning documents, trade reporting, and analyst estimates all agree on sustained demand growth driven by fresh-food consumption, instant retail, traceability, and supply-chain modernization, but they disagree sharply on the market''s measured dollar size because of different scope definitions. The most decision-useful conclusion is not a single TAM number: it is that cold-chain logistics is a policy-backed, fragmented, technology-upgrading infrastructure market where national foodservice, retail, and food-manufacturing buyers increasingly need integrated warehousing, transport, and visibility services, while regional gaps, capex intensity, technician shortages, and weak standardization still constrain penetration.'
sections:
- id: market-boundary-definition
  title: Market boundary, included spend, and substitutes
  body: |-
    Fresh Life's relevant market is not all logistics and not all food distribution. The closest fit is China's temperature-controlled B2B cold-chain logistics market: pre-cooling, refrigerated warehousing, trunk transport, multi-temperature city distribution, cross-dock and sorting, and the visibility or traceability layer that keeps products within required ranges from origin to delivery. The 14th Five-Year Plan defines cold-chain logistics as end-to-end temperature-controlled logistics supported by cold stores, refrigerated vehicles, and related equipment, which means software, monitoring, and physical execution should be analyzed together rather than as unrelated markets.

    For Fresh Life specifically, the most relevant demand pools are restaurant chains, fresh-food retailers, dairy and protein brands, food manufacturers or traders, and group-meal or hotel supply. The official customer mix — Sukiya, Starbucks, Hema, Yili, New Hope Liuhe, and 7-Eleven Chongqing — fits exactly that profile. The market boundary excludes ambient parcel logistics, dry warehousing, and generic general freight. The main substitutes are self-operated cold chains, regional specialist cold-chain 3PLs, and integrated platform arms owned by bigger ecosystems such as SF, JD Logistics, and Cainiao. Fresh Life is therefore competing for outsourced workflow share in a real category, not creating a new category from scratch.
