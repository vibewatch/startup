- id: sizing-lenses-range
  title: 'Sizing lenses: large market, weak precision'
  body: |-
    The market is clearly large, but public estimate precision is weak because publishers use different boundaries. The 14th Five-Year Plan reported that China's cold-chain logistics market exceeded RMB 380 billion in 2020, with nearly 180 million cubic meters of cold storage and roughly 287,000 refrigerated trucks. By 2025, CFLP-linked reporting cited 381.4 million tonnes of cold-chain logistics volume and 267-277 million cubic meters of cold storage depending on the source, while IIFIIR estimated the reefer fleet at 587,900 units. These physical indicators all point to a major national infrastructure market even before private-market revenue models are applied.

    The problem starts when publishers attach dollar values. Research and Markets estimates China cold-chain logistics at USD 85.82 billion in 2024, Mordor estimates USD 94.46 billion in 2025, and Verified Market Research puts 2024 at only USD 17.2 billion. Those numbers cannot be averaged responsibly because the methodologies likely differ on whether they count only formal 3PL revenue, broader temperature-controlled logistics, or a narrower service subset. The best way to underwrite the category is to treat TAM as a range and use company-scale and volume lenses only directionally. The market is unquestionably large enough for multiple scaled winners, but not well enough standardized publicly to justify a single clean TAM number.
