- id: public-comparable-lens
  title: Public comparable lens
  body: |-
    The best public comparables are imperfect and should be used as guardrails rather than direct pricing templates. JD Logistics is the cleanest large Chinese logistics benchmark: CompaniesMarketCap shows an August 2026 market capitalization of $11.73 billion, while its revenue page shows 2025 revenue of $31.03 billion and the company’s own 1H25 filing reports RMB 98.5 billion of revenue with a 9.6% non-IFRS EBITDA margin. On that evidence, JD trades at a low sub-0.5x revenue multiple, which reflects the scale and thin economics of integrated logistics rather than a software-style market appetite. Lineage is more relevant as a cold-chain specialist. CompaniesMarketCap shows an August 2026 market capitalization of $10.62 billion and TTM revenue of $5.36 billion, while the 2024 10-K reports revenue of $5.3 billion, putting its public valuation closer to roughly 2x sales. Americold sits between those poles, with CompaniesMarketCap showing $4.03 billion market cap, $2.60 billion TTM revenue, and a current P/S ratio page around 1.4x.

    That comp spread matters more than any one number. Fresh Life is more specialized than JD Logistics and probably deserves a premium to a broad-line integrated 3PL multiple if its cold-chain network, customer density, and digital control stack are real economic differentiators. But it is also more opaque and less liquid than Lineage or Americold, with no public margin disclosure, no audited multi-year statements, and significant execution risk. Put differently: public cold-chain specialists show that the market will sometimes pay above 1x sales for refrigerated infrastructure when quality and durability are visible, but Fresh Life’s disclosure gap argues against assuming a peak pure-play multiple without a discount.
