- id: scenario-range-and-underwriting-view
  title: Scenario range and underwriting view
  body: |-
    A practical valuation framework is therefore to anchor on revenue multiples, not earnings multiples. There is not enough public evidence to defend EBITDA or DCF-style precision. The disclosed market data support a wide revenue-multiple corridor: JD provides a lower bound around the high-0.3x range, Americold sits around the mid-1x range, and Lineage around the high-1x range. Fresh Life should not sit at the top of that range because investors cannot verify margins, working-capital intensity, or recurring customer economics with public evidence. But it arguably should not sit at the bottom either, because it is positioned in a structurally underpenetrated part of Chinese food infrastructure, has demonstrated national scale, and appears to combine physical network density with a more developed digital operating layer than many regional cold-chain operators.

    Using the user-supplied and press-reported revenue anchor of roughly RMB 10 billion, a conservative bear case at 0.6x implies about RMB 6 billion equity value; a balanced base case around 0.8x-1.0x implies RMB 8-10 billion; and a stretch bull case around 1.1x-1.2x implies roughly RMB 11-12 billion. This is intentionally tighter than the public comp range because Fresh Life’s private status and disclosure deficits justify compression at the high end, while its specialization justifies a premium to JD-like low-end logistics pricing. The key takeaway is that the widely cited RMB 10 billion unicorn mark is not obviously absurd, but it also does not screen obviously cheap. It sits close to the upper end of a disciplined base case rather than in deep discount territory.
