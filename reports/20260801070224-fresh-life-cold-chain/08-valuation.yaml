  - type: private-evidence-only
    severity: material
    topic: cash-flow-resilience
    missingEvidence: Runway, capex needs, financing timetable, and downside liquidity plan.
    whyItMatters: A hard-asset operator can be strategically valuable yet financially fragile.
    diligencePath: Request cash-flow forecast, capex pipeline, and financing scenario analysis.
