    - TV004
  - type: private-evidence-only
    severity: material
    topic: customer-quality-and-concentration
    missingEvidence: Top-customer concentration, churn, renewal rates, contract terms, and loss / claims history.
    whyItMatters: Revenue quantity without revenue quality can justify the wrong multiple.
    diligencePath: Request top-20 customer revenue mix, retention cohorts, and SLA/claim data.
    relatedQuestionRefs:
    - QV011
    - QV021
    - QV022
