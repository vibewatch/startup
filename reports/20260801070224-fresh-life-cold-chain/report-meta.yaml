  productSummary: Temperature-controlled warehousing, line-haul and last-mile distribution, control-tower monitoring, and digital cold-chain workflow tools for fresh produce, meat, seafood, dairy, and prepared food customers.
  customerFocus: Supermarket chains, restaurant groups, convenience stores, food producers, fresh retailers, and other B2B food-distribution accounts across China.
  businessModel: Service fees for warehousing, sorting, transportation, settlement, and related supply-chain services, supported by digital control-tower, routing, and traceability systems.
