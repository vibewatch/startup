- id: adoption-expansion-and-retention-proxies
  title: Adoption, expansion, and retention proxies
  body: |-
    Public retention data is sparse, so the best available signals are indirect. Fresh Life’s case pages show multi-city, multi-route, and multi-store deployments rather than one-off pilot logos. That suggests customers are using the platform for repeat operational workflows, not just occasional line-haul jobs. The Starbucks, New Hope Liuhe, Yili, Hema, Sukiya, and 7-Eleven examples all imply recurring replenishment or scheduled distribution rather than spot transactions. Fresh Life also claims very high daily order volumes and a nationwide branch network, which would be difficult to sustain without meaningful repeat demand. Still, these are proxies rather than disclosed retention metrics.

    The public gaps matter. There is no disclosed logo retention, gross revenue retention, net revenue retention, average contract length, wallet share, top-customer concentration, or cohort spend expansion. FoodTalks’ “60% of top-20 customers in subdivided industries” line is helpful because it suggests strong penetration among leading buyers, but it also raises the question of concentration: if the best public proof is anchored in top accounts, how dependent is growth on a relatively small set of large chains? The practical conclusion is that Fresh Life likely has strong operational stickiness inside deployed accounts, but the public record does not let an investor distinguish healthy expansion from potentially concentrated dependence.
  claimRefs:
  - CU020
