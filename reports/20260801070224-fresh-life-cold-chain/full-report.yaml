companyProfile:
  summary: >-
    Fresh Life Cold Chain (鲜生活冷链物流) is a Chengdu-linked B2B cold chain logistics platform founded in 2016 and incubated
    by New Hope Group. The company operates a nationwide network of temperature-controlled warehouses, routing systems,
    and last-mile delivery capacity serving supermarkets, restaurant chains, convenience stores, and fresh-food
    enterprises. Public sources place the business at unicorn valuation territory after a November 2024 B+ financing
    round, with cumulative B-round funding near RMB900M and reported sales above RMB10B.
  foundedDate: '2016-11-24'
