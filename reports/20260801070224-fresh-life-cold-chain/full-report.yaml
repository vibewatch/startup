  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Fresh Life's relevant market is not all logistics and not all food distribution. The closest fit is
              China's temperature-controlled B2B cold-chain logistics market: pre-cooling, refrigerated warehousing,
              trunk transport, multi-temperature city distribution, cross-dock and sorting, and the visibility or
              traceability layer that keeps products within required ranges from origin to delivery. The 14th Five-Year
              Plan defines cold-chain logistics as end-to-end temperature-controlled logistics supported by cold stores,
              refrigerated vehicles, and related equipment, which means software, monitoring, and physical execution
              should be analyzed together rather than as unrelated markets.


              For Fresh Life specifically, the most relevant demand pools are restaurant chains, fresh-food retailers,
              dairy and protein brands, food manufacturers or traders, and group-meal or hotel supply. The official
              customer mix — Sukiya, Starbucks, Hema, Yili, New Hope Liuhe, and 7-Eleven Chongqing — fits exactly that
              profile. The market boundary excludes ambient parcel logistics, dry warehousing, and generic general
              freight. The main substitutes are self-operated cold chains, regional specialist cold-chain 3PLs, and
              integrated platform arms owned by bigger ecosystems such as SF, JD Logistics, and Cainiao. Fresh Life is
              therefore competing for outsourced workflow share in a real category, not creating a new category from
              scratch.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM019
              - CM031
              - CM032
              - CM033
              - CM034
              - CM036
