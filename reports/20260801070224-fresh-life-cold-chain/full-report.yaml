  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct rivals
        blocks:
          - type: paragraph
            body: >-
              Fresh Life does not compete against just one comparator. The China cold-chain market is still fragmented,
              with Mordor and Research and Markets both naming large national operators and specialist providers rather
              than a single dominant field. In practice, Fresh Life faces at least four rival archetypes: integrated
              domestic logistics platforms such as SF and JD Logistics; supply-chain and bonded-network operators such
              as Cainiao; state-backed or legacy national logistics groups such as Sinotrans and Beijing Ershang; and
              international cold-storage specialists or joint ventures such as Americold and Lineage-related China
              footprints. This matters because the relevant benchmark changes by buyer job. A national restaurant chain
              may compare Fresh Life with SF or JD on network reach and service consistency, while a warehouse-heavy
              multinational may compare it with CMAC, Americold, or another specialist cold-storage operator.


              The strongest public evidence puts Fresh Life in a middle position inside that field. Its own materials
              argue that it has become one of the largest technology-led To B cold-chain operators in China, with a
              nationwide branch footprint, large store coverage, and heavy software investment. But the largest
              public-platform competitors retain broader ecosystems, listed-company balance sheets, or deeper
              cross-border and multi-product service portfolios. The category is therefore not winner-take-most. It is a
              layered market where Fresh Life can be locally or vertically strong without outranking every national
              incumbent on every dimension.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
