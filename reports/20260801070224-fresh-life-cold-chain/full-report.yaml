      - number: '1.5'
        title: Milestones and adverse context
        blocks:
          - type: paragraph
            body: >-
              Fresh Lifes milestone density is high. The official development-history page shows an early sequence of
              national expansion moves, digital-system launches, research-institute formation, standard-setting
              participation, fundraising, ESG publication, and technology-brand commercialization. That chronology
              supports the view that Fresh Life was not simply a logistics roll-up; it deliberately tried to become a
              standardized cold-chain operating system. The 2025 news list and New Hopes 2026 profile suggest the
              company kept leaning into AI, digital upgrade, and service-capability branding after the 2024 B+ round
              rather than pivoting into retrenchment.


              The adverse context is mostly structural rather than scandal-driven. The best directly reviewed negative
              source is a Tencent/投中-style long-form analysis that argues New Hope tolerated very large incubation
              losses and repeated heavy technology investment to build the platform. The same piece says Fresh Life
              studied dozens of top cold-chain operators before committing to the strategy and had already invested
              roughly RMB 200 million in IT and a 200-person team by the time of the 2021 A round. None of that
              disproves the business model; in fact it may explain the network lead. But it does mean Fresh Lifes scale
              came from sponsor-backed capital intensity, not from an obviously self-funding model visible in public
              statements. That is the central interpretive caveat for all later financial and valuation work.
