chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Fresh Life Cold Chain Logistics Co., Ltd. was formally established in November 2016, with 36Kr listing the
              companys incorporation date as 2016-11-24. The official Fresh Life site presents the company as a
              cold-chain supply-chain service provider for restaurant chains, fresh-food retailers, food processors and
              traders, and group-meal or hotel customers, offering source-to-store warehousing, linehaul, city
              distribution, and digital-control-tower capabilities. Official contact pages place the day-to-day
              operating center in Chengdu, Sichuan, while 36Kr shows a registered address in Lhasa. That split is not
              uncommon for Chinese private companies, but it matters because it means “headquarters” in public
              narratives refers to the operating center rather than necessarily the legal registration seat.


              The business model is not just transportation. Fresh Life repeatedly describes itself as using mergers and
              acquisitions, regional integration, and digital tooling to create a national cold-chain infrastructure
              layer. The current official overview describes eight business groups spanning cold-chain operations,
              technology, park operations, agricultural-assistance services, ingredient distribution, and group-meal
              operations. The service proposition is a full cold-chain workflow: warehouse capacity, scheduled trunk
              routes, route planning, store delivery, temperature visibility, and increasingly AI-enabled reconciliation
              and risk-control tooling. This matters for later chapters because Fresh Life should be analyzed more like
              an industrial supply-chain platform than a narrow courier or reefer-fleet operator.
