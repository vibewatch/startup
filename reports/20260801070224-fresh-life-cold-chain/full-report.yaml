    title: Funding and mark timeline
    type: timeline
    layout: wide
    summary: >-
      Fresh Life rerated quickly from the 2021 A round to unicorn status by 2022, then used the 2024 B+ round to
      reaffirm that mark.
    data:
      items:
        - label: A round
          date: '2021-01-19'
          details: 36Kr and Tencent describe a RMB600m A round and roughly RMB5bn valuation signal.
        - label: A+ round
          date: '2022-01-01'
          details: 36Kr lists an A+ round in January 2022 with undisclosed amount.
        - label: B round / unicorn step-up
          date: '2022-03-11'
          details: 36Kr and CB Insights link the March 2022 B round to ~RMB10bn / ~$1.58bn valuation.
        - label: B+ extension
          date: '2024-11-05'
          details: >-
