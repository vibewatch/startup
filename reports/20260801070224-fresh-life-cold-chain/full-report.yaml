      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is heterogeneous but coherent. In restaurant and convenience chains, the economic buyer is
              usually a supply-chain, logistics, or procurement lead focused on fill rate, spoilage, route reliability,
              and store-service consistency. In fresh-food retail, the operational user is the store or DC team that
              feels temperature excursions, shrink, and late delivery first, while the payer usually sits in central
              retail operations or supply chain. In dairy, protein, and food manufacturing, the buyer tends to be a
              logistics or channel head who needs nationwide temperature-controlled coverage and lower product loss
              without building every lane in-house. Pharma and biologics sit adjacent to this market with higher
              compliance intensity and higher willingness to pay, but they are not the center of Fresh Life's current
              public positioning.


              The adoption path is incremental. Buyers usually start with a region, category, or route cluster where
              outsourced density can beat self-operated economics or where traceability failures are becoming
              commercially visible. That is why named enterprise cases matter so much: they demonstrate that the company
              fits real buyer workflows across foodservice, retail, dairy, and convenience. They also imply that
              software integration — order capture, temperature monitoring, route control, and reconciliation — is
              becoming part of the base product rather than a premium add-on.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM033
