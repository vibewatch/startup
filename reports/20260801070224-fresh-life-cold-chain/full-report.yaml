  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Funding history and mark anchors
        blocks:
          - type: paragraph
            body: >-
              Fresh Life’s valuation history is visible only through a patchwork of company-adjacent press, startup
              databases, and secondary profiles, so the first valuation task is not precision but triangulation. The
              strongest consistent pattern is that the company rerated rapidly between 2021 and 2022, then used a
              November 2024 B+ extension to reaffirm rather than radically reset that unicorn mark. 36Kr’s PitchHub page
              lists the round sequence and dates; Tencent’s long-form profile says the A round in 2021 came in at
              roughly a RMB 5 billion valuation and that the 2022 round doubled the mark to RMB 10 billion; Toutiao and
              FoodTalks both frame the 2024 B+ round as consolidating unicorn status with cumulative B-round financing
              approaching RMB 900 million. CB Insights adds a machine-readable private-market marker by showing a March
              2022 valuation of $1.577 billion and a latest funding round on November 5, 2024.


              The harder problem is the revenue denominator. Public claims indicate that sales later exceeded RMB 10
              billion, but those claims are not backed by audited financial statements. Tencent says 2021 half-year
              revenue exceeded RMB 3 billion after the company reduced reliance on New Hope internal business, while
              Toutiao later describes Fresh Life as having both valuation and sales above RMB 10 billion. Official
              materials do corroborate a large nationwide footprint, but not a clean P&L. That means the current
              underwriting exercise should treat Fresh Life less like a fully disclosed late-stage tech asset and more
              like a strategic, scale-heavy private logistics operator with a known funding-mark history but only
              partially disclosed revenue quality.
            claimRefs:
              - CV001
