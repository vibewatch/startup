      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Cold-chain operations are structurally unforgiving: temperature excursions, routing misses, warehouse
              failures, and settlement errors all travel directly into customer service and food-safety outcomes. Fresh
              Life’s own product and customer corpus repeatedly emphasizes temperature monitoring, traceability,
              all-node alerts, and digital workflow controls, which is itself evidence of what can go wrong if those
              systems fail. The customer case set depends on predictable multi-city routing, proof-of-delivery, store
              calendars, and refrigerated compliance. That means operational risk includes not only physical breakdowns
              but also software outages, bad data, false settlements, and field teams operating outside the system.


              Public-company comparables show how expensive these problems can become. SF’s 2024 sustainability report
              explicitly says high temperatures can hurt cold-chain warehouses and refrigerated transport, increase
              refrigerant usage and refrigeration cost, and raise the risk of revenue loss. Lineage’s 10-K adds that
              labor and benefits are the largest variable cost inside a temperature-controlled warehouse, while power is
              a major operating cost that may not always be passed through to customers. In other words, operational
              risk is not a side issue; it is the business model. Fresh Life’s automation and control-tower narrative
              likely reduces some of this exposure, but the same operating complexity that creates differentiation also
              creates many surfaces where failures can compound.
            claimRefs:
              - CR009
