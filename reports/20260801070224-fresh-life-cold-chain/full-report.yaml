      - number: '4.2'
        title: Cost structure, unit economics, and margin lens
        blocks:
          - type: paragraph
            body: >-
              The business model is clearly capital and operations intensive. Fresh Life’s own overview highlights
              1100万+ square meters of cloud warehousing, 35万+ connected cold-chain vehicles, and a national branch
              network. FoodTalks describes a growth model of “M&A + self-construction” and cites ongoing investment in
              AI dispatch, control towers, cold-chain vehicles, and smart warehouse networks. Tencent’s long-form piece
              adds that management had already spent about RMB200 million building a 200-person IT team by the time of
              the A round and expected to invest another RMB200 million in the second half of 2021. Those facts point to
              heavy cost buckets: labor, line-haul and city-delivery fulfillment, cold-storage energy and facilities,
              technology payroll, vehicle / equipment partnerships, and working capital tied to food distribution and
              settlement.


              Because Fresh Life does not disclose margins, the best public lens is to compare its likely economics with
              listed logistics and cold-storage operators. JD Logistics’ 2025 interim filing shows revenue of RMB98.5
              billion, gross margin of 9.0%, and non-IFRS EBITDA margin of 9.6% while still requiring RMB2.4 billion of
              capital expenditures net of related disposals in just the first half. Lineage’s 2024 10-K shows $5.3
              billion of revenue, $1.3 billion of Adjusted EBITDA, and $691 million of property, plant, and equipment
              purchases alongside a net loss. Those are not direct comps to Fresh Life, but they do illustrate an
              important point: scaled logistics and cold-chain leaders can still run with modest operating margins,
              meaningful capital intensity, and a need for utilization discipline. Fresh Life’s margin path should
              therefore be underwritten conservatively until management discloses actual contribution margins by lane,
              warehouse, and customer segment.
