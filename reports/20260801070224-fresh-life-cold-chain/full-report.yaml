  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and traction proxies
        blocks:
          - type: paragraph
            body: >-
              Fresh Life does not publish audited financial statements, so the chapter must rely on revenue-mechanism
              evidence and traction proxies rather than on clean reported P&Ls. The public product and case corpus shows
              multiple monetizable layers: warehousing, trunk haul, city distribution, settlement, route orchestration,
              cold-chain 3PL, and software-enabled supply-chain workflows. The company’s service pages and Yunlizhi
              materials make clear that Fresh Life monetizes a bundle of physical execution plus workflow tooling rather
              than a single asset-light SaaS fee. That means revenue quality likely depends on route density, warehouse
              utilization, temperature-compliance performance, and the ability to attach multiple services to the same
              enterprise account.


              Public traction signals are real but uneven. Fresh Life says it serves 5,000+ B-end customers, processes
              more than 100,000 daily orders, and reaches 31 provinces and more than one million stores. A long-form
              Tencent profile says the company crossed RMB3 billion of revenue in the first half of 2021 after reducing
              dependence on New Hope internal business, while later financing coverage implies the business kept scaling
              through 2024. Those signals indicate substantial throughput, but they do not translate directly into
              durable or high-quality revenue without visibility into segment mix, internal-vs-external revenue share,
              contract structures, and gross profit. The safest reading is that Fresh Life has meaningful revenue scale,
              but that the public record is not enough to verify the exact run-rate or the quality of that revenue.
