      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. Fresh Life appears to have achieved real scale: enterprise
              customer breadth, daily order volumes, large route and warehouse networks, and repeated capital raises are
              all hard to fake. The company also seems to be building a higher-value operating stack than a commodity
              reefer fleet, which creates the possibility of better retention and denser customer economics over time.
              But none of that overrides the central underwriting problem: there is no audited public disclosure of
              revenue mix, gross margin, EBITDA, cash generation, or balance-sheet resilience. A private logistics
              business with heavy infrastructure needs can look impressive operationally while still having fragile unit
              economics.


              The right stance is to treat Fresh Life as financially interesting but under-disclosed. The company
              probably has larger revenue scale than a typical startup and a stronger strategic position than a local
              cold-chain operator, yet it likely shares the classic asset-heavy burdens of the sector: thin realized
              margins, high labor and energy sensitivity, and recurring capital needs. That means future diligence
              should focus less on vanity scale and more on contribution margins, cash conversion, warehouse economics,
              capex vs lease mix, customer concentration, and funding runway. Until those are disclosed, the report can
              only rate the business as potentially powerful but financially opaque.
