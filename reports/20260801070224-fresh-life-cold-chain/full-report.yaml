      - number: '2.4'
        title: Growth drivers, adoption constraints, and structural bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers are clear and mutually reinforcing. Government policy explicitly supports more
              national cold-chain nodes, better standardization, broader traceability, and stronger backbone
              infrastructure. Consumption patterns are shifting toward fresh produce, imported chilled protein, and
              faster retail cycles. E-commerce and instant-retail models compress delivery windows and make service
              integrity more visible at store level. Pharma and biologics add a higher-yield adjacent segment that
              raises technical expectations for the whole market. Government, analyst, and trade sources also repeatedly
              point to digitization, AI, and greener fleets as major forces reshaping the category.


              The constraints are equally structural. The government itself says China still lags developed markets,
              with uneven infrastructure, difficult financing, weak resource integration, incomplete standards, and
              insufficient professionalization. Mordor and VMR add fragmented last-mile fleets, technician shortages,
              high electricity and capex burdens, and uneven technology adoption. Lenglianwuliu's 2025 report suggests
              profitability remains under pressure even for leading operators, with average profit margins for its
              sample below 4 percent. The result is a market with real tailwinds but no easy economics: demand growth is
              real, yet the category still punishes operational mistakes, poor density, and undercapitalized expansion.
