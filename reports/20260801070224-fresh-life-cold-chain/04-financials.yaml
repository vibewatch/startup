    - List rates, realized prices, discounts, minimums
    - Public data cannot estimate realized ARPU or margin
  - - Warehouse economics
    - Network scale and use cases
    - Storage rate cards, occupancy guarantees, pass-through costs
    - Utilization quality remains opaque
  - - Transport economics
    - Routes, cities, stores, and temperature controls
    - Per-route pricing, accessorials, fuel surcharge mechanics
    - Revenue quality may vary materially by lane
  - - Software-enabled services
    - Workflow and visibility features
    - Whether any software fees are separately invoiced
    - Hard to separate service revenue from tech-enabled efficiency
  - - Customer-level monetization
    - Strong logo proof and scale claims
    - ACV, contract term, expansion revenue, and wallet share
    - The best proofs are operational, not commercial
  notes: The absence of posted pricing is typical for enterprise logistics, but it limits external underwriting of unit economics.
