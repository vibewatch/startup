- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: |-
    Public financing evidence strongly suggests that Fresh Life has needed repeated external capital to keep scaling. The 2024 B+ round took cumulative B financing close to RMB900 million according to FoodTalks and Tencent, while 36Kr records the 2022 B round and the 2021 A round. Tencent’s profile is particularly useful here because it frames Fresh Life as a management team and backer group willing to tolerate large near-term losses in pursuit of cold-chain infrastructure scale, and it describes the technology buildout itself as consuming hundreds of millions of renminbi. That does not prove current burn, but it does show that the business has historically required sustained funding for both network expansion and digital capability.

    What is missing is just as important. No public source in the reviewed corpus discloses Fresh Life’s current cash balance, monthly burn, debt facilities, working-capital utilization, lease obligations, or next-round trigger. There is also no public evidence separating internally generated operating cash from continued funding dependence. Comparable listed operators show why this matters: JD Logistics generated positive operating cash but still saw cash balances fall in 1H 2025 after investing and financing outflows, while Lineage explicitly operates with significant capital expenditure and debt considerations inside a real-asset-heavy model. Fresh Life may be building an attractive cold-chain platform, but its capital adequacy cannot be underwritten from the public record alone.
  claimRefs:
