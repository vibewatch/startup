  - - Debt / lease obligations
    - No clear public disclosure found
    - Real asset businesses often use debt or long leases
    - Unavailable
    - Debt maturities, leases, covenants, and guarantees
  - - Next-round trigger
    - No public disclosure found
    - Determines financing dependence under downside scenarios
    - Unavailable
    - Milestones tied to future fundraising
  notes: The table intentionally separates visible historical funding facts from missing live liquidity facts.
