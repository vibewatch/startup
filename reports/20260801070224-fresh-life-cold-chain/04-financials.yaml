tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public evidence
  - Quality lens
  - Main diligence ask
  rows:
  - - Cold storage / warehousing
    - Fees for storage, handling, and related warehouse services
    - Fresh Life service pages and Yunlizhi workflow descriptions
    - Likely recurring but utilization-sensitive
    - Storage pricing, occupancy, and margin by warehouse
  - - Trunk haul and city distribution
    - Transport and route execution from origin to store
    - Official service pages and named customer cases
    - Volume can be large but pricing may be competitive
    - Lane margin, backhaul rates, and subcontracting mix
  - - 3PL / integrated supply chain
    - Bundled warehouse + distribution + control workflows
    - Yili, Hema, New Hope Liuhe, and Starbucks style cases
    - Better revenue quality if multi-service attach is high
    - Service-line mix and share of wallet by account
  - - Supply-chain technology / workflow tools
    - OMS/TMS/WMS/BMS and digital process enablement
    - Yunlizhi and FoodTalks materials
    - Could improve retention more than standalone software revenue
    - Standalone software revenue vs embedded service revenue
  - - Adjacent value-added services
    - Settlement, route planning, traceability, digital reporting
    - Yunlizhi and product-tech chapter proof
    - May expand account value without proportionate asset growth
    - Attach rate and gross margin by module
  notes: Fresh Life appears to monetize a bundled operating system for food cold chain rather than one clean software or trucking line item.
