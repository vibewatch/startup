- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue by service line
    - Separates warehousing, distribution, 3PL, and tech-enabled value-added mix
    - Without it, scale quality is unclear
    - Request service-line revenue bridge for last 3 years
  - - Gross margin by service line
    - Shows which products create real economic value
    - Critical for moat and pricing power assessment
    - Request margin bridge by business group
  - - Warehouse and lane contribution margin
    - Reveals unit economics inside the network
    - Needed to test density thesis
    - Request top-20 warehouse and lane economics
  - - Cash generation and burn
    - Shows independence from external capital
    - Needed for runway and financing risk
    - Request operating cash flow and monthly cash burn
  - - Debt, leases, and guarantees
    - Determines fixed obligations and downside fragility
    - Needed for solvency view
    - Request debt schedule and lease commitments
  - - Customer concentration and payment terms
    - Affects working capital and pricing power
    - Needed to judge volatility of collections and wallet share
    - Request top-customer concentration, DSO, and contract terms
  notes: These gaps are normal for a private Chinese logistics company, but they are the core reasons the financial chapter remains cautious.
