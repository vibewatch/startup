- id: TI004
  title: Capital adequacy table
  columns:
  - Capital area
  - Public evidence
  - Why it matters
  - Current public status
  - Diligence ask
  rows:
  - - Equity financing
    - B series cumulative financing near RMB900m; prior A/A+/B rounds recorded publicly
    - Shows repeated external capital support
    - Partially visible
    - Full round history by use of funds and remaining cash
  - - Technology investment
    - Tencent profile describes roughly RMB200m spent on IT build and more planned in 2021
    - Shows capex-like operating investment in platform buildout
    - Historical snapshot only
    - Current tech opex and capex budget
  - - Warehouses and fleet ecosystem
    - 11m+ sqm cloud warehousing and large vehicle network imply meaningful fixed and semi-fixed cost base
    - Network scale is valuable but expensive
    - Scale visible, economics opaque
