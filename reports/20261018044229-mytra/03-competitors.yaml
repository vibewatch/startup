      - ["Each / case-picking support", "Case handling and pallet workflows discussed; fine-grained public proof remains limited", "Yes; native-case handling and micro-fulfillment are explicit", "Tote/small-item orientation in retained evidence", "Yes; Logistics Viewpoints says each and case picking", "Manual or custom rather than a standard goods-to-person offer"]
      - ["Incremental footprint / retrofit posture", "Yes; customers can start with a few racking rows and expand", "Turnkey end-to-end system; retained source does not describe incremental deployment", "Retained source emphasizes installed base, not brownfield retrofit detail", "Retained source emphasizes footprint reduction and system simplification", "Already in place or tailored incrementally, but without a comparable standard platform"]
      - ["Public scale proof", "Named launch customer plus two later anonymized large customers", "Strong public scale and performance claims on company site", "Very large installed base per Teardown", "20+ next-gen projects totaling $400M per Logistics Viewpoints", "Private operating record; no comparable product installed base"]
