  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Public pricing / contract signal
      - Included capabilities in retained evidence
      - Discount / unknown
      - Implication
    rows:
      - [Mytra, "No public pricing; model undisclosed", "Integrated bots, matrix, and software-defined orchestration for pallet workflows", "Unknown whether capex, RaaS, or hybrid", "Buyers must underwrite fit before they can benchmark commercial terms"]
      - [Symbotic, "No public pricing on retained company page", "Turnkey automation, dense storage, AI software, native-case handling, micro-fulfillment option", "Discount structure and contract model not disclosed", "Scale and proof are visible, but commercial comparability still requires direct RFP work"]
      - [Exotec, "No public pricing in retained article", "Each and case picking plus integrated buffering, sequencing, and pick-and-pack", "No retained disclosure on list pricing, RaaS, or project economics", "Capabilities are clearer than commercial terms"]
      - [AutoStore, "No public pricing in retained evidence", "Installed-base cube-storage platform for tote workflows", "No retained disclosure on system pricing or contracting", "Mytra cannot be dismissed on price alone from public evidence because the benchmark is not transparent here"]
      - ["Manual / legacy pallet flow", "Site-specific labor plus equipment spend rather than packaged software pricing", "Forklifts, aisle access, and familiar operations", "No retained benchmark price and no software-defined throughput proof", "The substitute is operational familiarity, not a published automation offer"]
    notes: >-
      This is a retained-evidence packaging view rather than proof that no
      public pricing exists anywhere; the meaningful signal is how much of the
      buyer conversation still has to happen through custom procurement.
    claimRefs: [CP004, CP008, CP010, CP014, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Mytra sits at the high end of payload and workflow ambition but below the
      public deployment proof of the established incumbents.
    data:
      xAxis:
        label: Workflow / payload breadth
        min: 1
        max: 5
        low: Narrower or lighter-load workflow
        high: Broader or heavier-load workflow
        description: Ordinal scoring from cited public product descriptions.
        scale: ordinal
      yAxis:
        label: Public deployment proof
        min: 1
        max: 5
        low: Limited disclosed production proof
        high: Large disclosed installed base or scale proof
        description: Ordinal scoring from cited public scale disclosures.
        scale: ordinal
      points:
        - label: Mytra
          x: 5
          y: 2
          detail: Heavy-pallet 3D architecture with limited public live-site disclosure.
          claimRefs: [CP003, CP006]
        - label: Symbotic
          x: 4
          y: 5
          detail: Large public scale and turnkey automation, but case-native published load envelope.
          claimRefs: [CP007, CP008, CP009]
        - label: AutoStore
          x: 2
          y: 5
          detail: Installed-base leader with tote orientation rather than full pallets.
          claimRefs: [CP012]
        - label: Exotec
          x: 3
          y: 4
          detail: Proven each/case system with disclosed project momentum below Mytra's payload class.
          claimRefs: [CP010, CP011]
        - label: Geek+ / Hai
          x: 2
          y: 4
          detail: Price-aggressive shuttle alternatives that can pressure RFPs without matching heavy-pallet scope.
          claimRefs: [CP013, CP016]
        - label: Manual forklifts
          x: 1
          y: 5
          detail: Ubiquitous incumbent pallet workflow with familiarity but limited software-defined automation.
          claimRefs: [CP004]
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores, not measured market-share
      or throughput figures; they summarize payload breadth and disclosed proof
      from the retained sources.
    claimRefs: [CP003, CP004, CP007, CP009, CP010, CP011, CP012, CP013, CP016]
callouts:
  - calloutType: insight
    title: Payload class is the real wedge
    body: >-
      The retained evidence consistently separates Mytra from AutoStore and
      Exotec on payload class: Mytra is trying to automate full-pallet material
      flow, not just tote or case handling.
    claimRefs: [CP003, CP009, CP010, CP012]
  - calloutType: risk
    title: Scale proof still trails the field
    body: >-
      Mytra's public proof still relies on a small number of named or
      anonymized customer references, while the strongest retained evidence on
      pricing, backlog, and repeatable deployment economics remains missing.
    claimRefs: [CP006, CP014, CP016]
