  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public or diligence-room disclosure of NRR, GRR, churn, renewals, contract terms, and cohort behavior by customer type.
      whyItMatters: Customer quality cannot be underwritten without evidence that early pilots and deployments renew, expand, and stay productive over time.
      diligencePath: Request cohort retention, logo churn, renewal-rate, and contract-length data for the top ten accounts and for the Albertsons deployment specifically.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof-roster
      missingEvidence: A full list of live production sites, pilots, and referenceable accounts beyond Albertsons and the two anonymized 2026 customer descriptions.
      whyItMatters: The current public roster is too small and too anonymous to assess concentration, reference quality, and whether the 60x deployment is an outlier or part of a repeatable pattern.
      diligencePath: Request a customer roster by stage, including named references, number of active sites, and which disclosed metrics attach to each account.
      relatedQuestionRefs: [QU001, QU007]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-and-channel-dependence
      missingEvidence: Top-customer share of bookings or ARR, ACV distribution, and commercial details on whether strategic investors such as Lineage or Ryder participate as customers, channels, or both.
      whyItMatters: A few large unnamed accounts could make the customer base look stronger than it is while still embedding meaningful single-account or partner-dependence risk.
