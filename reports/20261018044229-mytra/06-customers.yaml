    notes: >-
      Most scale and outcome metrics here are company-issued and often relative rather than absolute; they demonstrate momentum but do not substitute for disclosed customer counts, cohort retention, or per-site economics.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU009, CU010, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof quality
      - Limitation
    rows:
      - - Albertsons Cos. distribution centers
