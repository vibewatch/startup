company:
  name: Mytra
chapter:
  number: 6
  title: Customers
  summary: >-
    Mytra has one independently named production customer in the assigned evidence pool—Albertsons—and company-issued 2026 disclosures add two larger but still unnamed accounts, a Fortune 100 food company and a Fortune 500 industrial-supply distributor. The pattern suggests real enterprise traction, but public evidence still omits customer count, retention, contract value, and concentration metrics, leaving durability and land-and-expand underwriting unresolved.
sections:
  - id: verified-customer-proof
    title: Verified customer proof is real but still narrow
    body: >-
      The strongest externally named customer proof in the assigned pool is Albertsons. Automated Warehouse reported that Mytra had already deployed in production at select Albertsons distribution centers, which is materially stronger than logo-only proof because it ties the relationship to a live operating workflow. Company-issued January 2026 disclosures broaden the picture by saying Mytra now counts a Fortune 100 food company and a Fortune 500 industrial-supply distribution company as customers. That combination implies Mytra is selling into large pallet-heavy networks, but it still leaves the public roster thin: only one account is named independently, while the larger 2026 wins remain anonymous and therefore harder to diligence for scope, renewal risk, and reference quality.
    claimRefs: [CU001, CU002, CU003, CU007, CU008]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption markers are improving, but mostly through company-issued milestones
    body: >-
      Public traction has moved from launch-stage deployment intent in 2024 to concrete 2025-2026 execution markers. Mytra says it signed a deployment sixty times larger than its prior installation, shipped two pilot systems, and reached production at a new customer site in 2025. The same disclosure says early deployments delivered a 32% reduction in material-handling labor and a 34% improvement in storage density. Those are useful directional signals because they describe both commercial progress and operational outcomes, and Flow's profile of Mytra also shows a small team deliberately linking requirements, risks, and tests as deployments get more complex. Still, nearly every scale marker besides Albertsons comes from Mytra or a syndication of Mytra's own release, so the customer story is moving from pilot into production without yet giving investors a broad independent installed-base readout.
    claimRefs: [CU004, CU005, CU006, CU009, CU010, CU014, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration remain the underwriting gap
    body: >-
      The central customer risk is not whether Mytra can name promising accounts, but whether those accounts translate into a durable and diversified revenue base. Teardown's August 2026 profile explicitly argues that the recurring concern is scale execution and notes that Mytra still does not disclose revenue, backlog value, live-install count, or pricing. Across the assigned public materials, there is likewise no disclosed NRR, GRR, churn, renewal rate, contract length, customer count, or top-customer exposure. Strategic investors Lineage and RyderVentures suggest credible interest from logistics operators, yet the reviewed sources do not prove either party is already a paying customer or a scaled channel. That leaves concentration risk, land-and-expand quality, and serviceability of large accounts as unresolved diligence items rather than closed facts.
    claimRefs: [CU011, CU012, CU013, CU015]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation from disclosed proof
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Diversified retailers / grocers
        - "Buyer: distribution leadership; user: DC operations teams; payer: warehouse automation budget"
        - Full-pallet storage, retrieval, and cross-dock buffering
        - Albertsons production at select distribution centers; Fortune 100 food customer disclosed in 2026
        - Validates high-velocity grocery and food distribution workflows
        - No public site count, contract value, or renewal history
      - - Industrial-supply distribution
        - "Buyer: network operations; user: warehouse teams; payer: enterprise capex / automation budget"
        - Pallet movement and dense storage in multi-site distribution networks
        - Fortune 500 industrial-supply distribution company disclosed as a customer in January 2026
        - Shows Mytra's thesis extends beyond grocery into broadline distribution
        - Customer remains unnamed and production status is undisclosed
      - - Hard-goods manufacturing / industrial production
        - "Buyer: plant and warehouse operations; user: material handlers and automation teams; payer: plant capex"
        - Work-in-process and finished-goods movement for heavy loads
        - Automated Warehouse says Mytra expects viability for hard goods, large appliances, and automotive parts
        - Expands addressable demand beyond retail DCs if references materialize
        - No named manufacturing customer in the assigned pool
      - - 3PL / cold-chain operators
        - "Buyer: logistics operators; user: facility ops teams; payer: site owner or 3PL"
        - Cross-docking and high-density pallet storage
        - Lineage and RyderVentures are strategic investors; Mytra positions the system for cross-dock workflows
        - Could become a route into multi-site logistics networks
        - Strategic backing is not proof of paid customer deployment
    notes: >-
      This segmentation mixes named production proof, anonymized customer disclosures, and target workflow evidence because Mytra's public customer list is sparse; treat it as directional segmentation, not an exhaustive roster or revenue split.
    claimRefs: [CU001, CU002, CU003, CU008, CU015]
