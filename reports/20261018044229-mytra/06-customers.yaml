      - Value
      - Date / period
      - Source basis
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Publicly named production customer
        - Albertsons at select distribution centers
        - 2024-07
        - Independent trade coverage
        - Medium
        - Confirms at least one live production deployment
        - No number of sites, contract value, or uptime history
      - - Large-enterprise customer mix
        - Fortune 100 food company and Fortune 500 industrial-supply distributor
        - 2025 disclosed in 2026-01 release
        - Company-issued disclosure corroborated by syndication
        - High
        - Shows Mytra is selling into large pallet-heavy accounts
        - Customers unnamed; no ACV or volume data
      - - Largest deployment scaling marker
        - 60x Mytra's largest prior installation
        - 2025
        - Company-issued disclosure
        - Medium
        - Indicates step-function growth in deployment scope
        - Baseline install size and go-live economics are undisclosed
      - - Pilot throughput
        - Two pilot systems shipped
        - 2025
        - Company-issued disclosure
        - Medium
        - Shows pipeline progressed beyond concept-stage selling
        - No pilot-to-production conversion rate
      - - Production go-live cadence
        - New customer site live in production
        - 2025
        - Company-issued disclosure
        - Medium
        - Suggests at least one additional site moved past pilot
        - Site identity and live-site count remain undisclosed
      - - Early deployment outcome
        - 32% lower material-handling labor; 34% higher storage density
        - 2026-01 disclosed on early deployments
