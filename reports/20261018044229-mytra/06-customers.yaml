        - No public site count, contract size, or renewal history
      - - Unnamed Fortune 100 food company
        - Food supply chain
        - Large-scale deployment tied to 2025 commercial expansion
        - Customer disclosed; one new site said to be live in production
        - Company says the account is part of the 2025 inflection point and scale-up
        - Customer unnamed; unclear whether this is Albertsons or a second food account
      - - Unnamed Fortune 500 industrial-supply distribution company
        - Industrial distribution
        - Full-pallet warehouse automation for a broadline network
        - Contracted account; deployment stage undisclosed
        - Shows traction outside grocery and food verticals
        - No pilot status, site count, or revenue contribution disclosed
    notes: >-
      This is a partial public roster built only from the assigned sources. One account is independently named; the other two are company-described but anonymous, so concentration and reference quality cannot be underwritten from public evidence alone.
