figures:
  - id: FU001
    title: Customer journey from problem framing to expansion proof
    type: journey-map
    summary: Mytra's public customer evidence shows a progression from ROI-led problem framing into pilots, production, and still-unresolved expansion proof.
    data:
      items:
        - label: Labor and space pain qualification
          actor: Enterprise warehouse / plant operator
          phase: Pre-sale
          touchpoints:
            - Material flow is labor-intensive and warehouse aisles consume dead space
            - Buyers need pallet automation that fits existing facilities
          tone: neutral
        - label: Workflow-fit evaluation
          actor: Supply-chain engineering and automation teams
          phase: Evaluation
          touchpoints:
            - Goods-to-person, goods-to-robot, and cross-dock workflows are evaluated
            - Modular design is positioned to fit a customer's existing warehouse layout
          tone: neutral
        - label: Pilot shipment
          actor: Mytra deployment team and early customer sites
          phase: Pilot
          touchpoints:
            - Mytra says it shipped two pilot systems in 2025
            - Pilot-to-production conversion remains undisclosed
          tone: neutral
        - label: Production go-live
          actor: Named and unnamed customer sites
          phase: Initial production
          touchpoints:
            - Albertsons is the named production reference
            - Mytra says a new customer site also went live in production in 2025
          tone: positive
        - label: Network-scale expansion
          actor: Enterprise account sponsors
          phase: Expansion
          touchpoints:
            - Mytra says it signed a deployment 60x its prior largest installation
            - Early deployment ROI claims are 32% lower labor and 34% higher storage density
          tone: positive
        - label: Renewal and reference underwriting
          actor: Investors, procurement, and later-stage prospects
          phase: Diligence
          touchpoints:
            - No public NRR, churn, contract-length, or customer-count disclosure
            - Major 2026 customers remain anonymous, limiting concentration analysis
          tone: risk
    approximationNotes: null
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU010, CU013]
callouts:
  - calloutType: strength
    title: Production proof exists
    body: >-
      Albertsons gives Mytra one independently named production reference, and January 2026 disclosures add two more large but anonymous customer logos plus a separate production go-live.
    claimRefs: [CU001, CU002, CU003, CU006]
  - calloutType: risk
    title: Durability is still opaque
    body: >-
      The public evidence still does not show renewal behavior, customer count, concentration, or contract economics, so traction is visible but durability is not yet underwritten.
    claimRefs: [CU012, CU013]
  - calloutType: insight
    title: Strategic investors are promising, not dispositive
    body: >-
      Lineage and RyderVentures increase the odds of logistics-operator interest, but the assigned public evidence does not prove either relationship has converted into recurring customer revenue.
    claimRefs: [CU015]
