      - number: '3.3'
        title: 持续性与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河问题不在于 Mytra 的机器人是否新颖，而在于买方计入部署风险、商业条款不透明和验证更充分的替代方案后，重型托盘架构是否仍然有吸引力。Teardown 对 Attabotics
              的警示很重要，因为它是公开证据中最接近的概念参照：一个差异化的 3D 存储架构，仍在企业自动化的资本密集度和销售周期压力下失败。同一来源认为，Mytra
              必须在老牌厂商或更便宜的穿梭车供应商将话题拉向价格和已安装基数信任之前，把少量高知名度试点转化为可重复部署。这让 Mytra
              看起来有差异化，但尚未证明具备持久性。技术切口是真实的，但其生产覆盖面、定价模式和可重复部署经济性的公开验证，仍落后于更成熟的行业参与者。
            claimRefs:
