              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 能力与采购对比
        blocks:
          - type: paragraph
            body: >-
              保留证据显示出清晰的能力分化。Symbotic 销售端到端 turnkey 自动化栈，并公开吞吐量、劳动力和准确率数据，但其公开负载范围以箱件为主，远低于 Mytra 声称的 3,000-pound
              托盘级别。Exotec 最新一代 Skypod 公开支持件拣选和箱拣选，并集成排序和缓冲；Logistics Viewpoints 称其已拿下超过 20 个项目、总额 $400 million。AutoStore
              的已安装基数大得多，但 Teardown 明确将其描述为料箱系统，而不是全托盘平台。结果是，Mytra 形成了可信的负载级别切口，但采购透明度较弱：公开来源未披露 Mytra
              的定价或合同结构，保留证据也没有给出替代方案可直接对比的定价。买方看起来是在更适合重型托盘的架构与更有验证的安装记录之间做选择。固定矩阵和集成编排也意味着安装后的切换成本可能较高，尽管没有保留来源量化迁移费用或锁定效应。另一方面，据报道可以从少数几排货架开始，买方在分阶段部署期间可以与叉车或既有自动化并行使用，不必立即进行全有或全无的转换。
            claimRefs:
