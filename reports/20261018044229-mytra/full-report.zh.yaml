            title: 致命标准
            body: 如果这一标志性规模部署明显延期、未实现承诺的劳动力节省，或无法产生具名且可重复的生产参考，Mytra 的风险画像会迅速恶化，因为公开证据仍只显示出很小的上线站点基础。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR011
          - type: callout
            title: 价值最高的尽调问题
            body: 下一轮尽调应要求具名生产站点参考、合同模式经济性、网络与安全保障材料，以及律师确认的法律与监管排查；在此之前，不应把当前风险堆栈仅仅视为成长阶段噪音。
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景及公开来源实际能证明什么
        blocks:
          - type: paragraph
            body: >-
              官方融资证据都指向由 Avenir Growth 领投的 $120M Series C，以及超过 $200M 的累计融资，因此资本形成不是问题，真正困难的是价格。Teardown 称 Mytra
              的估值未正式披露；Exa 的融资目录仍只显示 Series C 之前的 $78M 历史；一篇联合转载文章的标题写着“$150M”，正文却描述了 $120M
              轮融资。这足以确认融资势头存在，但不足以把公开估值元数据当作干净的投资判断证据。因此，入场纪律必须从估值不透明出发，而不能只看投资者质量。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 投资逻辑成立，但规模经济性尚未有公开验证
        blocks:
          - type: paragraph
            body: >-
              看多逻辑在于，Mytra 已有真实运营信号，而不只是实验室演示：管理层称 2025 年包括一个规模为此前最大安装 60
              倍的部署、两个试点系统、一个新上线站点、一座更大的设施，以及可量化的劳动力和密度收益。反面是，同一份公开资料仍缺少收入、积压订单、已安装基数和商业模式披露；Teardown
              的悲观情景则取决于部署能否在资本密集度迫使价格竞争之前变得可重复。公开可比公司只能提供方向性参考。Yahoo 和 CompaniesMarketCap 都将 Symbotic
              作为大型公开基准，但两者的实时市值快照差异很大，因此可比公司只能框定市场情绪，无法确定私有估值。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 情景纪律将结论维持在继续研究
        blocks:
          - type: paragraph
            body: >-
              这些因素使推荐停留在继续研究区间。乐观情景要求披露证据证明 2025 年的部署爆发能转化为多个上线站点、增长中的积压订单和持久的单位经济性；只有这样，围绕或高于唯一公开的约 $2B
              代理估值入场才可能得到支持。基准情景更慢：继续跟踪，直到披露改善或入场价格软化。悲观情景很直接：如果大型部署延期、融资条款变得更结构化，或客户覆盖仍然狭窄，下轮融资或价值重置就变得可能。关键尽调问题是
              Series C 的准确投后估值和优先股堆叠、商业模式细节，以及逐站点的收入和积压订单桥接。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 公开证据将结论限定为继续研究
            body: 当前公开记录足以让 Mytra 留在尽调漏斗中，但不足以围绕唯一可见的约 $2B 估值代理给出买入建议。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV015
          - type: callout
            title: 升级判断需要更好的披露，而不只是更多兴奋情绪
            body: 更积极的判断需要收入、积压订单、定价和准确 Series C 条款的硬披露，或者一个明显低于今天嘈杂的私募市场代理估值的入场价格。
            calloutType: assumption
            claimRefs:
              - CV009
              - CV015
              - CV016
