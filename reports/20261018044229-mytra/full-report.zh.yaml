            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM011
      - number: '2.2'
        title: 买方是已经为改造型自动化编预算的运营主导型托盘网络
        blocks:
          - type: paragraph
            body: >-
              最可能的早期买方，是经济效益主要由托盘搬运、劳动力供给和存储密度决定，而非由电商件拣选决定的运营商。Supply Chain Digital 和 Automated Warehouse 都将 Mytra 与
              Albertsons 及其他高吞吐运营商联系起来；Supply Chain Dive 报道称，Albertsons 预计到 2025 年底将其配送量的 30% 自动化。Grocery Dive 还称，AWG
              正投资 $110 million，用先进自动化改造一座既有的 Gulf Coast 设施。这些第三方预算信号支持一张以食品零售、批发配送、3PL /
              冷链运营商，以及有托盘暂存或在制品需求的制造商为中心的买方图谱。预算归属很可能偏运营而非实验：采用需要改造设施、集成自动化和重做流程，因此经济买方更可能是供应链、配送或制造负责人，而不是纯软件职能。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM013
      - number: '2.3'
        title: 采用驱动因素已显现，但市场规模和商业化仍有实质缺口
        blocks:
          - type: paragraph
            body: >-
              最强的公开需求信号来自劳动力短缺、密度压力，以及棕地设施改造需求——买方不必被僵化的单一用途系统锁定。Mytra 及其联合发布稿称，制造业近 50% 的劳动力与物料搬运有关；当前有超过 400,000
              个工业岗位空缺，到 2030 年将走向 2 million；约 60% 的仓库空间闲置；约 80% 的工业设施尚未实现自动化。如果这些约束在方向上成立，Mytra
              的价值主张就对应着真实的运营痛点。但反面同样重要：Mytra 的公开材料仍未披露定价、交易是资本开支、RaaS 还是混合模式，也未说明除 Albertsons
              等具名参考客户外有多少生产站点上线。即便最好的公开结果数据，也仍是公司自报而非独立基准验证。因此，市场逻辑足以支持继续尽调，但还不够精确，无法在没有私有证据的情况下对份额获取或回本周期做投资判断。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 展品
        blocks:
          - type: callout
            title: 改造现有设施比重建绿地设施更接近当前预算路径
            body: Albertsons 的自动化目标和 AWG 的 $110 million 改造项目表明，买方预算已经在转向升级既有托盘密集型网络，而不是等待只适用于绿地项目的设施。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM009
          - type: callout
            title: 公开市场逻辑强于公开商业披露
            body: 劳动力和密度压力支撑需求叙事，但 Mytra 未披露的定价、上线站点数和合同结构，仍使可靠的公开 SOM 或回本周期模型无法建立。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代方案
        blocks:
          - type: paragraph
            body: >-
              Mytra 同时面对三类替代方案：根深蒂固的人工托盘搬运与巷道式存储，公开验证更充分的规模化自动化老牌厂商，以及解决较轻型流程的新型穿梭车或立方体系统。独立发布报道和 Mytra
              自己的发布材料始终将产品定义为软件定义的自动存取系统，用于搬运和存储物料，承载全托盘，区别于面向料箱或箱件的系统。这一技术定位可信，但公开验证仍然稀薄。Albertsons 是发布时的具名参考客户，2026 年
              1 月的披露仍依赖一家 Fortune 100 食品公司和一家 Fortune 500 工业供应分销商，而非广泛公开的客户名单。战略投资者 Lineage 和 RyderVentures
              可能帮助接触物流运营商，但保留证据没有披露渠道条款或合作伙伴主导的部署。因此，实际市场框架不是 Mytra 对某一个直接机器人对手，而是 Mytra
              对叉车主导的托盘搬运现状、内部工程项目，以及一批验证更充分的自动化供应商。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
