            title: 商业验证有限但真实
            body: Albertsons 是真实的具名参考客户，公司后来又提到一家 Fortune 100 食品客户和一家 Fortune 500 工业供应客户；但保留的公开记录仍未披露客户数、上线站点数或续约质量的分母。
