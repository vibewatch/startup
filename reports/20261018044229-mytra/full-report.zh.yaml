      - number: '5.3'
        title: 成熟度、差异化与验证
        blocks:
          - type: paragraph
            body: >-
              即便证据仍主要来自公司自身，Mytra 在公开材料中的差异化已经很清楚。系统面向最大 3,000 pounds
              的全托盘，强调结构内部的三维自由度，并将物料流描述为可在存储、排序和缓冲任务之间重新编程的软件定义原语。这一组合比传统巷道式托盘搬运更进取，也比局限在地面的 AMR
              部署更宽，因此多个来源反复提到密度、可配置性和减少劳动力。


              2026 年融资周期显著改善了成熟度信号。公司称 2025 年包括一个规模为此前最大安装六十倍的部署、两次试点系统发货和一个投入生产的新客户站点；同时，公司还声称早期部署将劳动力降低 32%，存储密度提升
              34%。这些指标说明系统已经走出实验室阶段，但仍是自报数据，也缺少投资者通常需要的运营分母：上线站点数、实施时长、可用率，以及按客户队列划分的续约或扩张表现。
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE011
              - CE015
      - number: '5.4'
        title: 控制、风险与待解技术问题
        blocks:
          - type: paragraph
            body: >-
              剩余最大的技术风险不是概念本身，而是保障和扩展风险。公开证据显示，Mytra 一边招聘安全系统和高级技术项目管理岗位，一边扩大部署范围，说明公司仍在围绕快速扩张的产品把控制环境工业化。这对一家 2022
              年成立的机器人公司很正常，但这里尤其重要，因为编排层控制的是客户现场的重型托盘搬运，而不是纯数字流程。


              同样重要的是，保留的公开记录仍未披露第三方安全认证、正式功能安全材料、实施 SLA 或超出宽泛战略意图的商业包装细节。Teardown 的 2026 年 8
              月画像明确指出没有公开定价和收入模式披露，保留来源也没有用硬性的部署经济性填补这一缺口。结果是，产品叙事虽有差异化且商业化程度在提升，但仅凭公开来源，还不足以对可靠性、网络与安全保障或上线可重复性做投资判断。
            claimRefs:
              - CE012
              - CE014
              - CE015
