  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 指示性区间
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 高于唯一公开的私募市场参照（约 $2B）
        - 2025 年的大型部署转化为多个已披露的运营现场，积压订单扩大，商业模式展现出可复制的经济性。
        - 只有这样，在外部参照值或更高价格买入才有支撑，因为执行风险将得到实质性降级。
        - 安装延期、客户集中度或硬件毛利压力仍可能击穿这一逻辑。
        - 关于运营现场、积压订单和客户扩张的新独立报道。
      - - 基准
        - 接近或低于参照值
        - 运营证明持续改善，但估值条款和单位经济性仍只部分披露。
        - 经过尽调后仍可投资，但仅凭公开数据无法评估上行空间。
        - 公开可比公司波动、未披露的融资条款和漫长安装周期，使安全边际保持薄弱。
        - 在披露补齐缺口前继续研究。
      - - 悲观
        - 低于参照值，并存在下轮融资风险
        - 大型部署延期、融资条件收紧，或客户覆盖面无法扩展到少数灯塔客户之外。
        - 由于公开证据无法从基本面支撑现有参照值，估值重置或带结构性条款的内部人融资将变得可能。
        - 积压订单可见性不足和优先权负担会首先冲击普通股权益回报。
        - 任何上线延期、招聘速度放缓或追踪机构进一步下调估值，都会成为负面信号。
    notes: 这些区间仅为方向性判断，因为没有公开来源披露确切当前估值、资本结构条款或可用于建立更紧模型的收入基数。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
