  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是托盘密集型仓储和制造业物料流，而非通用仓储软件
        blocks:
          - type: paragraph
            body: >-
              现有证据将 Mytra 的可服务问题定义为在仓库、越库转运和相邻制造流程中搬运与存储重型物料，而不是通用仓储 IT 或小件履约软件。Automated Warehouse
              在公司发布时描述了一套可攀爬立方体的自动存取系统，可将最重 1,360 kg（3,000 lb.）的全托盘向任意方向移动，适配既有空间，并支持货到人、货到机器人和越库缓冲场景。Mytra 的 2026 年
              Series C
              公告沿用了这一框架，强调用于搬运、存储、拣选和路由的软件定义原语，而不是单一用途机器人。这一边界对尽调很重要：最相关的纳入支出是高吞吐配送和制造环境中的托盘存储、取出、编排软件及棕地部署；排除项包括小件料箱自动化、通用
              WMS 软件，以及无法解决全托盘搬运的轻型 AMR。因此，公开市场证据更适合说明采用压力，而不足以干净地自上而下测算 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
