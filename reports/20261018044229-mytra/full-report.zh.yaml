  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 公开证据
      - 哪些信息会改变判断
    rows:
      - - 正方
        - 产品和部署证明真实存在。
        - Mytra 披露了 $120M 的 Series C，部署规模是此前装机基数的 60 倍，已交付两个试点，并新增一个上线现场，同时披露了早期人力和密度改善。
        - 若有多个独立记录的运营现场和后续客户部署，这一案例就会从有希望的证明升级为可复制的证明。
      - - 正方
        - 战略资本可以支撑扩张。
        - 此轮融资使累计融资额超过 $200M，且战略投资者与物流和冷链运营相关。
        - 若能证明资本转化为积压订单、更快安装和纪律化招聘，投资判断会更有支撑。
      - - 反方
        - 估值仍然不透明。
        - Teardown 称估值未披露，而第三方追踪机构和报道对历史累计融资额及当前轮次规模都存在分歧。
        - 披露确切的 Series C 投后估值、清算优先权和稀释情况，将显著提升信心。
      - - 反方
        - 公开可比公司锚点噪声很大。
        - Symbotic 方向上具有相关性，但在调整商业模式差异前，公开市场实时数据甚至对其当前市值都存在分歧。
        - 将标准化可比公司集与 Mytra 的收入、积压订单和毛利数据结合，才能让可比分析真正服务决策。
    notes: 本表混合了公司自报证明、第三方质疑，应当作为决策框架阅读，而不是精确的定价模型。
