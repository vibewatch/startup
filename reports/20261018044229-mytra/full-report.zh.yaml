chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与产品定位
        blocks:
          - type: paragraph
            body: >-
              Mytra 将自己定位为软件定义的工业机器人公司，解决物料的实体搬运与存储，而不是单点机器人供应商。保留来源对其核心架构的描述高度一致：机器人、软件和存储单元共同驱动全托盘穿过三维结构，额定升降上限为 3,000
              pounds。这为后续章节提供了稳定的公司身份和产品描述：一家后期私有仓储自动化基础设施公司，成立于 2022 年，总部位于 Brisbane, California，面向物流和工业场景的企业部署，而非 SMB
              软件销售。公开材料对系统描述多于商业条款，因此其运营模式应理解为集成硬件加编排软件，而不是已经清晰披露的定价或收入模式。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO009
              - CO011
              - CO013
              - CO015
      - number: '1.2'
        title: 创始人、领导班子与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配度是证据集中最明确的优势之一。Chris Walti 和 Ahmad Baitalmal 都来自 Tesla 时代的工厂与仓储自动化工作，Baitalmal 还负责过 Rivian
              软件，因此公司由一批已经在高要求工业环境中处理高吞吐物料流问题的操盘手带领。治理仍然明显由创始人主导，但 2025 年新增的高管，以及前 Tesla CFO Zach Kirkhorn
              加入董事会，说明公司正试图在部署进一步放量前补齐规模化、财务和工业运营经验。关键人风险仍集中在负责对外讲述产品的 Walti，以及负责软件层的
              Baitalmal；公开来源并未显示具名领导班子之下有多深的梯队，也未披露完整董事会构成。
            claimRefs:
              - CO005
              - CO006
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO012
      - number: '1.3'
        title: 资本基础、利益相关方图谱与阶段信号
        blocks:
          - type: paragraph
            body: >-
              Mytra 在很短时间内从隐身创业公司走向融资规模可观的后期私有公司。公司发布时已披露截至 Series B 的 $78 million 融资，并突出 Albertsons 这一早期商业伙伴；到 2026 年 1
              月，公司宣布由 Avenir Growth 领投的 $120 million Series C，战略投资者 Lineage 和 RyderVentures
              以及新的财务投资者共同参与。这一支持基础很重要，因为公司销售的是资本密集型系统，可能需要漫长的企业销售周期、集成劳动力和客户教育。公开记录仍未提供股权结构条款、官方估值、收入或客户数分母，因此利益相关方图谱更适合用来理解战略拉力和尽调优先级，而非精确推断经济控制权。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: 里程碑、规模证据与待解的投资判断问题
        blocks:
          - type: paragraph
            body: >-
              最强的进展证据集中在 2025 年至 2026 年初的里程碑上。Mytra 称其签下的部署规模是此前最大安装的六十倍，交付了两个试点系统，让一个新客户站点上线，并扩展至面积 100,000-square-foot
              的 Brisbane 总部，还在完成 Series C 前补充了多名职能负责人。这些都是有意义的规模信号，但仍未达到后期投资者进行投资判断所需的指标：披露收入、站点数、ACV
              集中度、续约表现或经审计的绩效数据。保留的独立分析提出的反向判断合理：争论焦点已经不再是概念是否新颖，而是 Mytra
              能否在资本密集度、采购摩擦或定价压力压缩上行空间之前，把少数参考部署转化为可重复、按时、规模化的交付。
