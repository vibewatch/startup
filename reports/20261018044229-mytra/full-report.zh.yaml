      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              技术叙事已经具体到足以对基本运营模式做投资判断。Mytra 的系统被描述为三大部分：机器人、重复排列的矩阵或单元结构，以及软件。机器人沿 X、Y、Z
              方向移动存储单元；软件负责寻址存储位置、规划车队路线，并决定矩阵应更像最大化密度的仓库，还是更偏向速度的缓冲区。VentureBeat 补充了一个有用的实施细节：编排层针对高价值规划问题采用基于强化学习的优化。


              其结果是一个模块化
              AS/RS，把复杂度从固定输送机、起重机或巷道几何结构转移到软件和更简单的物理底座上。这对棕地站点可能很有吸引力，因为多个来源称该结构能适配既有空间并渐进扩容，而不要求一次性整体切换。尽调难点在于，同一抽象层也是主要技术依赖：尚未找到公开的
              API 文档、可用率记录或集成目录，也没有第三方验证路由层在部署规模急剧扩大时的表现。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE013
