        title: 该模式先体现资本密集性，再显露软件属性
        blocks:
          - type: paragraph
            body: >-
              所有公开信息都指向一种项目波动大、营运资金占用高的经济模式。产品将晶格基础设施、机器人和编排软件打包在一起；外部报道将客户合同描述为大型工业交易，而不是 SaaS
              订阅。公开评论还认为，任何服务主导型模式都会把风险从买方资本开支转移给供应商的可用率、维护和续约义务。换句话说，Mytra
              最终可能获得有吸引力的经常性经济性，但前提是它能标准化安装、控制服务波动，并在利润可见前避免把融资基础烧在钢材、劳动力和执行超支上。
