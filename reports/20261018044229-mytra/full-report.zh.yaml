  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户流程匹配度
        blocks:
          - type: paragraph
            body: >-
              Mytra
              在公司材料和行业来源中的公开产品定义一致：这是一套软件定义的工业机器人系统，用于自动化全托盘物料搬运，而不是狭窄的拣选机器人或只处理料箱的立方体仓库。其架构之所以重要，是因为公司试图用一套可编程矩阵替代巷道式托盘搬运：在矩阵内存储、取出、缓冲和排序负载，再在仓库边缘将其交给人员或相邻自动化设备。因此，正确的对比对象是传统托盘
              AS/RS、叉车驱动的存储和越库缓冲流程，而不只是小件履约机器人。


              公开用例证据主要集中在托盘存取和出库排序。Automated Warehouse 和 Robotics 24/7 都描述了货到人、货到机器人和越库式缓冲流程；Albertsons
              被点名为生产用户，用于门店发货前的库存缓冲和排序。仍缺的是按垂直行业、吞吐量级别和部署数量细分的流程验证集；公司提到了大型客户和 2025
              年更大的订单，但保留来源仍未量化每种流程有多少站点上线，或这些站点处理的稳态货量。
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE010
              - CE014
