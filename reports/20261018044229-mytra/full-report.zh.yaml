          value: 400000
          unit: roles-plus
          note: 公司公开材料称该数字已经高于这一水平。
        - label: 2030 年开放的工业岗位
          value: 2000000
          unit: projected roles
          note: 公司引用的预测，用于说明自动化的紧迫性。
        - label: 零自动化的工业设施
          value: 80
          unit: '% of facilities'
          note: Mytra 以此说明棕地改造仍有空间。
        - label: 计划在 2025 年底前实现自动化的 Albertsons 配送量
          value: 30
          unit: '% of volume'
          note: Supply Chain Dive 提供的第三方客户预算信号，不代表 Mytra 的份额。
    approximationNotes: 各层使用了不同分母，应理解为采用压力堆栈，而非数学嵌套的 TAM/SAM/SOM 瀑布；每个数值均复现自上表，因为指定来源池不支持对软件定义重型托盘 ASRS 给出更窄的公开市场估算。
    claimRefs:
      - CM002
      - CM003
      - CM006
      - CM011
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: Mytra 在载荷和工作流野心上处于高位，但公开部署证明仍落后于成熟既有厂商。
    data:
      xAxis:
        label: 工作流 / 载荷宽度
        min: 1
        max: 5
        low: 更窄或更轻载荷工作流
        high: 更宽或更重载荷工作流
        description: Ordinal scoring from cited public product descriptions.
        scale: ordinal
      yAxis:
        label: 公开部署证明
        min: 1
        max: 5
        low: 已披露的生产证明有限
        high: 已披露的大规模装机或规模证明
        description: Ordinal scoring from cited public scale disclosures.
        scale: ordinal
      points:
        - label: Mytra
          x: 5
          'y': 2
          detail: 重型托盘 3D 架构，但公开披露的运营现场有限。
          claimRefs:
            - CP003
            - CP006
        - label: Symbotic
          x: 4
          'y': 5
          detail: 公开规模大、提供交钥匙自动化，但已发布的载荷范围按具体案例而定。
          claimRefs:
            - CP007
            - CP008
            - CP009
        - label: AutoStore
          x: 2
          'y': 5
          detail: 装机基数领先者，面向料箱而非完整托盘。
          claimRefs:
            - CP012
        - label: Exotec
          x: 3
          'y': 4
          detail: 已验证的件箱系统，已披露项目势头，但载荷级别低于 Mytra。
          claimRefs:
            - CP010
            - CP011
        - label: Geek+ / Hai
          x: 2
          'y': 4
          detail: 价格激进的穿梭车替代方案，能够给 RFP 施压，但无法匹配重型托盘范围。
          claimRefs:
            - CP013
            - CP016
        - label: 人工叉车
          x: 1
          'y': 5
          detail: 普及度高的传统托盘工作流，使用经验成熟，但软件定义自动化有限。
          claimRefs:
            - CP004
    approximationNotes: 坐标是有证据支撑的序数评分，不是市场份额或吞吐量实测数据；它们概括了来源中保留的载荷宽度和已披露证明。
    claimRefs:
      - CP003
      - CP004
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP016
  - id: FI001
    title: 公开可见的收入模式桥接
    type: flow
    summary: 公开证据支持高价值企业部署路径，但从客户活动到确认收入和毛利的桥接仍只部分披露。
    data:
      nodes:
        - id: demand
          label: 高速托盘运营商
          detail: 目标垂直行业的买家掌握庞大的托盘网络，周转速度也更高。
        - id: sale
          label: 顾问式企业交易
          detail: 公开的 GTM 信号是大型工业合同，而非自助式 SaaS。
        - id: deployment
          label: 部署与上线
          detail: 试点、生产现场和规模为此前 60 倍的部署，说明实施达到项目级别。
        - id: package
          label: 集成系统套件
          detail: Mytra 将晶格、机器人和编排软件作为一套自动化系统销售。
        - id: revenue
          label: 收入确认路径未披露
          detail: 公开来源无法确认当前合同属于资本开支、RaaS 还是混合模式。
        - id: margin
          label: 毛利取决于执行波动
          detail: 硬件、安装人工、运行时间和服务义务可能决定实际实现的利润率。
      edges:
        - from: demand
          to: sale
          label: 买方需求
        - from: sale
          to: deployment
          label: 已签项目
        - from: deployment
          to: package
          label: 已交付系统
        - from: package
          to: revenue
          label: 合同结构
        - from: revenue
          to: margin
          label: 服务与成本组合
    approximationNotes: 该桥接为定性分析，因为公开来源披露的是里程碑和结果，而非合同会计处理。
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Mytra 已披露的技术栈，将编排软件置于规划、机器人移动、存储介质和仓库边缘交接之上。
    data:
      layers:
        - label: 工作流意图
          detail: 客户为整托货物提出存储、取货、排序或缓冲需求。
          outputs:
            - label: Store
            - label: Retrieve
            - label: Sequence
            - label: Buffer
        - label: 软件定义的基础动作
          detail: 公开材料将移动、存储、拣选和路由描述为可编程核心动作。
          modules:
            - label: 移动
            - label: 存储
            - label: 拣选
            - label: 路由
        - label: 编排与规划
          detail: WES 层优化机器人路线、管理库存位置，并让矩阵在密度和速度之间动态调整。
          modules:
            - label: 路线优化
            - label: 库存布置
            - label: 优先级处理
          outputs:
            - label: Dispatch decisions
            - label: Pick-port assignments
        - label: 机器人机队
          detail: 低矮机器人将装载货物的单元托盘，从任一单元移动到 X、Y 或 Z 方向上的任一相邻单元。
          modules:
            - label: 3D 移动
            - label: 载荷处理
          outputs:
            - label: Pallet transfer
        - label: 单元托盘与矩阵
          detail: 重复排列的晶格和托盘系统创建可寻址存储空间，并消除结构内部对通道的依赖。
          modules:
            - label: 重复单元
            - label: 托盘接口
          outputs:
            - label: Dense storage
            - label: Reconfigurable layout
        - label: 边缘交接
          detail: 叉车、AMR、码垛机器人或人工在外围取放区进行交互。
          modules:
            - label: 外围端口
            - label: 相邻自动化设备
          outputs:
            - label: Goods-to-person
            - label: Goods-to-robot
            - label: Dock buffer
    approximationNotes: 层级顺序综合自 Mytra 对运营模式的公开描述，并非供应商提供的字面架构图。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: 从问题定义到扩张证明的客户旅程
    type: journey-map
    summary: Mytra 的公开客户证据显示，客户从以 ROI 为核心的问题定义，逐步走向试点、生产和仍未解决的扩张证明。
    data:
      items:
        - label: 人力与空间痛点确认
          actor: 企业仓库 / 工厂运营商
          phase: 售前
          touchpoints:
            - 物料流转劳动密集，仓库通道占用闲置空间
            - 买方需要能适配现有设施的托盘自动化方案
          tone: neutral
        - label: 工作流适配评估
          actor: 供应链工程与自动化团队
          phase: 评估
          touchpoints:
            - 评估货到人、货到机器人和越库工作流
            - 模块化设计被定位为可适配客户现有仓库布局
          tone: neutral
        - label: 试点发货
          actor: Mytra 部署团队与早期客户现场
          phase: 试点
          touchpoints:
            - Mytra 称其在 2025 年交付了两个试点系统
            - 从试点转入生产的比例未披露
          tone: neutral
        - label: 生产上线
          actor: 已点名和未点名的客户现场
          phase: 初始生产
          touchpoints:
            - Albertsons 是已点名的生产参考案例
            - Mytra 称 2025 年又有一个新客户现场在生产环境中上线
          tone: positive
        - label: 网络规模扩张
          actor: 企业客户项目负责人
          phase: 扩张
          touchpoints:
            - Mytra 称其签署了一项部署，规模是此前最大安装项目的 60 倍
            - 早期部署 ROI 声称人工成本降低 32%、存储密度提高 34%
          tone: positive
        - label: 续约与参考案例投资判断
          actor: 投资者、采购团队和后期潜在客户
          phase: 尽调
          touchpoints:
            - 未公开披露 NRR、流失率、合同期限或客户数
            - 2026 年主要客户仍匿名，限制了集中度分析
          tone: risk
    approximationNotes: null
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU008
      - CU009
      - CU010
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在公开运营披露有限的情况下，Mytra 必须证明可复制的大规模部署，因此剩余风险仍在这些环节最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余风险敞口
      rows:
        - label: 60 倍部署扩张
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 网络安全与控制保障
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 商业不透明与资本密集度
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 客户与合作伙伴集中度
          values:
            - 中
            - 高
            - 中
            - 中
        - label: 仓库与机器人安全
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 法律与监管可见度
          values:
            - Unknown
            - 中
            - 低
            - 中
    approximationNotes: 序数评分是分析师基于引用证据作出的判断，不是统计概率。
    claimRefs:
      - CR003
      - CR008
      - CR009
      - CR010
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议受到真实部署证明与仍缺少的投资判断披露之间相互作用的约束。
    data:
      nodes:
        - id: official-financing
          label: 官方融资证明
          note: $120M Series C 和超过 $200M 的累计融资，说明资本支持真实存在。
        - id: operating-signals
          label: 部署证明
          note: 规模为此前 60 倍的部署、两个试点、一个上线现场，以及早期 32% / 34% 的改善。
        - id: disclosure-gap
          label: 缺失的投资判断数据
          note: 未公开披露收入、积压订单、定价模式、运营现场数量或确切 Series C 条款。
        - id: public-comp
          label: 公开可比公司锚点
          note: Symbotic 方向上具有相关性，但实时市值数据存在重大分歧。
        - id: downside
          label: 下行证据
          note: Teardown 提示规模风险，而外部融资追踪机构仍滞后或相互冲突。
        - id: recommendation
          label: 建议
          note: 在价格或披露改善前，维持“继续研究”建议和偏高估值立场。
      edges:
        - from: official-financing
          to: operating-signals
        - from: operating-signals
          to: disclosure-gap
        - from: disclosure-gap
          to: public-comp
        - from: public-comp
          to: downside
        - from: downside
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
