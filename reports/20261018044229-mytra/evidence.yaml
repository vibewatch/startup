    keyQuote: >-
      Mytra is a Bay Area warehouse-automation startup that has rebuilt the automated storage and retrieval system
      (ASRS) from first principles. Instead of shelves and totes shuttling down fixed aisles, it stacks goods in a 3D
      steel matrix and sends low-profile robots climbing through it in all three axes, lifting trays that carry loads up
      to 1,360 kg (3,000 lb) — full pallets, not bins. Founded in 2022 by two Tesla alumni, it emerged from stealth in
      July 2024 having quietly raised $78M and signed a pilot with grocery giant Albertsons, then closed a $120M Series
      C led by Avenir Growth in January 2026, taking total funding past ~$198M. It is one of the more credible entrants
      in a decade of warehouse-robotics hype — and one of the least proven at scale.
