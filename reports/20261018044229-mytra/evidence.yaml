evidenceGaps:
  - type: missing-source
    severity: minor
    topic: leadership-depth
    missingEvidence: >-
      Full current board composition and the layer of operational leaders beneath the named founders and 2025 executive
      hires.
    whyItMatters: >-
      Public founder-market fit is strong, but diligence still needs to test whether execution capacity is
      institutionalized beyond a small named bench.
    diligencePath: >-
      Request the current board list, committee structure, and an org chart for engineering, deployments, finance, and
      go-to-market leadership.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Exact Series C post-money valuation, ownership dilution, liquidation preferences, and any debt or secondary
      components.
    whyItMatters: >-
      These terms determine whether the headline financing strengthened the balance sheet on investor-friendly or
      founder-costly terms.
    diligencePath: Request the Series C term sheet, cap table, and any board-consent side letters.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Public revenue, gross margin, burn, backlog, and cash-runway figures.
    whyItMatters: >-
      Financing scale and deployment ambition cannot be underwritten cleanly without understanding economic throughput
      and capital consumption.
    diligencePath: >-
      Request board materials or monthly investor updates with booked ARR or revenue, gross margin, backlog, and cash
      runway.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-breadth
    missingEvidence: Exact customer count, live-site count, ACV concentration, renewal behavior, and Albertsons expansion status.
    whyItMatters: >-
      The public record currently shows reference customers but not whether demand is diversified or still concentrated
      in a narrow deployment set.
    diligencePath: >-
      Request a customer list with ARR or contract value by account, live-site status, renewal dates, and implementation
      milestones.
    relatedQuestionRefs:
      - QO005
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: An independent market estimate for heavy-pallet, software-defined ASRS split by workflow or buyer segment.
    whyItMatters: >-
      Without a niche-specific sizing source, the chapter can only use demand lenses rather than a true TAM SAM SOM
      stack.
    diligencePath: >-
      Obtain current analyst coverage or public-company disclosures that isolate pallet-heavy ASRS or comparable
      retrofit automation spending by segment.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-model
    missingEvidence: Contract structure, pricing model, payback assumptions, and installed-base metrics for live deployments.
    whyItMatters: >-
      These details determine whether strong operating pain converts into repeatable sales economics and acceptable
      buyer ROI.
    diligencePath: Request customer proposals, pricing examples, cohort deployment economics, and live-site counts from management.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segments
    missingEvidence: A complete public list of live customer sites and referenceable deployment types by segment.
    whyItMatters: >-
      Named references are concentrated, so public evidence may overstate how representative Albertsons and similar
      operators are.
    diligencePath: >-
      Ask for a segmented pipeline and customer-reference list covering grocery, wholesale, 3PL, and manufacturing
      deployments.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Public list pricing, contract model structure, or a disclosed hardware versus recurring-software mix for Mytra.
    whyItMatters: >-
      Without commercial structure, it is hard to compare Mytra's wedge against incumbents on payback, gross-margin
      path, or switching cost.
    diligencePath: Request a recent customer proposal, pricing schedule, and any financing or RaaS terms from management.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: deployment-scale
    missingEvidence: >-
      A site-level list of live production deployments, go-live dates, throughput achieved, and backlog or contracted
      system count.
    whyItMatters: >-
      Competitive durability depends on whether Mytra can turn technical novelty into repeatable enterprise delivery
      rather than isolated pilots.
    diligencePath: >-
      Ask for a deployment ledger with named sites, commissioning timelines, and realized performance against customer
      success metrics.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: missing-source
    severity: minor
    topic: trust-and-procurement
    missingEvidence: >-
      Consistent public trust artifacts such as third-party benchmarks, compliance summaries, or procurement references
      that compare Mytra with scaled incumbents.
    whyItMatters: >-
      Enterprise buyers often reward proof and referenceability as much as raw capability when selecting automation
      vendors.
    diligencePath: >-
      Collect customer references, third-party benchmark material, and any published safety or systems-assurance
      documents used in procurement.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Signed customer contracts showing pricing basis, implementation fees, support fees, discounting, and
      revenue-recognition treatment.
    whyItMatters: >-
      Without contract structure, it is impossible to separate upfront project revenue from recurring software or
      service revenue, which changes margin and cash-flow timing.
    diligencePath: Request one executed contract and one current order form with accounting treatment by line item.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Hardware gross margin, software gross margin, deployment labor cost, CAC, payback, and project contribution margin
      by cohort.
    whyItMatters: >-
      Large deal headlines do not answer whether deployments become more profitable as sites scale or simply absorb more
      working capital.
    diligencePath: >-
      Request a cohort bridge from bookings to gross profit, with implementation labor and service cost separated from
      software contribution.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      Current cash balance, monthly burn, near-term capex needs, debt or lease obligations, and management's downside
      runway case after the Series C.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from funds raised alone because deployment businesses can consume cash
      well before accounting revenue catches up.
    diligencePath: >-
      Request monthly cash burn, liquidity by entity, project-finance or lease commitments, and a base/downside 18-month
      runway model.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue concentration by top customer, live-site count, backlog split between pilots and production, and renewal
      or expansion evidence.
    whyItMatters: A few large accounts can make apparent traction look stronger than the repeatability of the business actually is.
    diligencePath: Request customer cohort data covering deployments, ARR or service revenue, expansion, and logo concentration.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-live-site-proof
    missingEvidence: Site-level uptime, throughput, labor-savings denominator, and deployment-count data across production customers.
    whyItMatters: >-
      The core underwriting question is whether the architecture scales reliably beyond the named Albertsons proof point
      and the company's self-reported milestone claims.
    diligencePath: >-
      Request live-site KPI dashboards, implementation timelines, and customer reference calls for Albertsons plus the
      unnamed Fortune 100 and Fortune 500 deployments.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: private-evidence-only
    severity: material
    topic: security-and-safety-controls
    missingEvidence: >-
      Third-party security certifications, functional-safety documentation, incident history, and operator-control
      assurance artifacts.
    whyItMatters: >-
      The orchestration layer controls heavy pallet movement inside customer facilities, so missing cyber and safety
      evidence is a material diligence blocker rather than a documentation nicety.
    diligencePath: >-
      Request security architecture, certification register, safety sign-off packages, and any customer-facing
      reliability or incident reporting materials.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: commercial-model-and-support
    missingEvidence: Published pricing model, implementation economics, recurring software mix, support SLA, and maintenance packaging.
    whyItMatters: >-
      The company pitches modular brownfield deployment, but public evidence still does not show whether the commercial
      model preserves that flexibility once steel, service, and software are priced together.
    diligencePath: >-
      Request a sample customer proposal, hardware-versus-software revenue mix, SLA terms, and post-install support
      structure.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Public or diligence-room disclosure of NRR, GRR, churn, renewals, contract terms, and cohort behavior by customer
      type.
    whyItMatters: >-
      Customer quality cannot be underwritten without evidence that early pilots and deployments renew, expand, and stay
      productive over time.
    diligencePath: >-
      Request cohort retention, logo churn, renewal-rate, and contract-length data for the top ten accounts and for the
      Albertsons deployment specifically.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: customer-proof-roster
    missingEvidence: >-
      A full list of live production sites, pilots, and referenceable accounts beyond Albertsons and the two anonymized
      2026 customer descriptions.
    whyItMatters: >-
      The current public roster is too small and too anonymous to assess concentration, reference quality, and whether
