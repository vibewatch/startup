          values: [Medium, High, Low, High]
        - label: Commercial opacity and capital intensity
          values: [High, High, Low, High]
        - label: Customer and partner concentration
          values: [Medium, High, Medium, Medium]
        - label: Warehouse and robotics safety
          values: [Medium, High, Low, High]
        - label: Legal and regulatory visibility
          values: [Unknown, Medium, Low, Medium]
    approximationNotes: >-
      Ordinal scores are analyst judgments derived from the cited evidence, not
      statistical probabilities.
    claimRefs: [CR003, CR008, CR009, CR010, CR012, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Kill criterion
    body: >-
      If the marquee scaled deployment slips materially, misses promised labor
      savings, or fails to generate named repeatable production references,
      Mytra's risk profile worsens quickly because public evidence still shows
      only a small live-site base.
    claimRefs: [CR003, CR004, CR006, CR011]
  - calloutType: recommendation
    title: Highest-value diligence asks
    body: >-
      The next diligence pass should demand named production-site references,
      contract-model economics, cyber and safety assurance artifacts, and a
      counsel-confirmed legal/regulatory sweep before treating the current risk
      stack as merely growth-stage noise.
    claimRefs: [CR009, CR010, CR013, CR015, CR016]
