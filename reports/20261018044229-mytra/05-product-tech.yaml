      - ["Fleet planning and optimization", "Assigns paths and tasks across many possible movements in the matrix", "Algorithms, simulation, and planning quality at larger deployment sizes", "Public evidence cites reinforcement learning, but not operating guardrails or benchmark results"]
      - ["MytraBot mobility hardware", "Carries cell trays and moves payloads through adjacent cells in X/Y/Z", "Battery, motion control, and maintenance execution", "No public reliability or serviceability metrics"]
