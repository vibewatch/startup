  - calloutType: "strength"
    title: "A coherent full-pallet architecture"
    body: "The strongest product evidence is architectural coherence: public sources consistently describe the same three-part system and the same software-defined control philosophy across launch, customer proof, and financing materials."
    claimRefs: ["CE002", "CE004", "CE010"]
