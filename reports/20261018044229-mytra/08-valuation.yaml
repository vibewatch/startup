  evidenceGaps:
    - type: missing-source
      severity: material
      topic: series-c-terms
      missingEvidence: Exact Series C post-money valuation, security type, liquidation preferences, option-pool treatment, and dilution terms.
      whyItMatters: These terms determine whether the visible private-market proxy reflects clean common-equity upside or structured downside protection for insiders.
      diligencePath: Request the signed term sheet, updated cap table, and board financing memo from management.
      relatedQuestionRefs: [QV009]
    - type: missing-source
      severity: material
      topic: commercial-scale-economics
      missingEvidence: Revenue, backlog, gross margin, pricing model, install payback, and disclosed live production-site count.
      whyItMatters: Without these metrics, public sources cannot show whether a ~$2B valuation proxy is supported by repeatable commercial performance.
      diligencePath: Request a board-ready operating review covering booked backlog, recognized revenue, gross margin, and site go-live cadence.
      relatedQuestionRefs: [QV003, QV008]
    - type: missing-source
      severity: material
      topic: customer-breadth
      missingEvidence: Named live deployments, renewal cohorts, account concentration, and referenceable customer outcomes beyond the current small set of public logos.
      whyItMatters: One or two lighthouse accounts can overstate repeatability in capital-intensive warehouse automation.
      diligencePath: Request a customer cohort table with site go-live dates, contract value, expansion history, and renewal status.
      relatedQuestionRefs: [QV004]
