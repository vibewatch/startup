schemaVersion: report-v2
artifact: valuation
slug: mytra
runDate: 2026-10-18
company:
  name: Mytra
chapter:
  number: 8
  title: Valuation
  summary: >-
    Mytra's financing momentum and early deployment proof are strong enough to keep the
    company investable on diligence, but the public record still does not disclose the
    revenue, backlog, commercial model, or exact Series C terms needed to underwrite the
    externally cited ~$2B valuation proxy. That makes the evidence good enough for a
    research-more recommendation with a stretched stance, not for a buy call.
sections:
  - id: financing-context
    title: Financing context and what public sources actually prove
    body: >-
      Official round evidence converges on a $120M Series C led by Avenir Growth and on
      cumulative funding above $200M, so capital formation is not the question. The harder
      question is price. Teardown says Mytra's valuation was not officially disclosed, Exa's
      funding directory still shows only the pre-Series-C $78M history, and one syndicated
      article paired a "$150M" headline with a body that described a $120M round. That is
      enough to conclude that financing momentum exists, but not enough to treat public
      valuation metadata as clean underwriting evidence. Entry discipline therefore has to
      start from valuation opacity rather than from investor quality alone.
    claimRefs: [CV001, CV002, CV008, CV013, CV014, CV015]
    tableRefs: [TV001]
  - id: thesis-and-counterweight
    title: Thesis strength exists, but scale economics remain unproven publicly
    body: >-
      The pro case is that Mytra now has real operating signals rather than a lab-demo story:
      management says 2025 included a deployment 60x its largest prior installation, two pilot
      systems, one new live site, a much larger facility, and measurable labor and density
      gains. The counterweight is that the same public file still lacks revenue, backlog,
      installed-base count, and commercial-model disclosure, while Teardown's bear case turns
      on whether deployments become repeatable before capital intensity forces price
      competition. Public comps help only directionally. Yahoo and CompaniesMarketCap both
      point to Symbotic as a large public benchmark, but their live market-cap snapshots
      diverge sharply, so the comp set can bracket sentiment rather than settle a private mark.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-diligence
    title: Scenario discipline keeps the call at research-more
    body: >-
      That mix keeps the recommendation in research-more territory. The bull case requires
      disclosed proof that 2025's deployment burst turns into several live sites, growing
      backlog, and durable unit economics; only then would paying around or above the only
      public ~$2B proxy start to look supportable. The base case is slower: keep tracking
      until either disclosure improves or the entry price softens. The bear case is
      straightforward: if the large deployment slips, financing terms become more structured,
      or customer breadth stays narrow, a down-round or value reset becomes plausible. The
      key diligence asks are the exact Series C post-money and preference stack,
      commercial-model detail, and a site-by-site revenue and backlog bridge.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - >-
            Public evidence shows real financing momentum, but no disclosed revenue, backlog,
            or exact Series C valuation terms.
        - Do not underwrite a buy case from public sources alone.
      - - Risk rating
        - high
        - >-
            Scale markers exist, but repeatability and commercial economics remain largely
            undisclosed.
        - Require live-site, backlog, and pricing evidence before sizing aggressively.
      - - Valuation stance
        - stretched
        - >-
            The only public private-market proxy is a third-party ~$2B estimate, and external
            funding and comp datasets are internally inconsistent.
        - Prefer a lower entry or materially better disclosure before underwriting upside.
    notes: >-
      Summary reflects only public evidence; exact post-money, preference overhang, and
      commercial-model detail are still undisclosed.
    claimRefs: [CV008, CV009, CV011, CV012, CV013, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Public evidence
      - What would change the view
    rows:
      - - Thesis
        - Product and deployment proof is real.
        - >-
            Mytra disclosed a $120M Series C, a 60x larger deployment than its prior install
            base, two shipped pilots, one new live site, and early labor and density gains.
        - >-
            Multiple independently documented live sites and follow-on customer deployments
            would move this from promising proof to repeatable proof.
      - - Thesis
        - Strategic capital can fund scale-up.
        - >-
            The round took total funding above $200M and included strategic investors tied to
            logistics and cold-chain operations.
        - >-
            Evidence that the capital converts into backlog, faster installs, and disciplined
            hiring would strengthen the underwriting case.
      - - Anti-thesis
        - Valuation is still opaque.
        - >-
            Teardown says valuation is undisclosed, while third-party trackers and coverage
            still disagree on both total funding history and current round size.
        - >-
            Exact Series C post-money, liquidation preference, and dilution disclosure would
            materially improve confidence.
      - - Anti-thesis
        - Public comp anchoring is noisy.
        - >-
            Symbotic is directionally relevant, but live public screens diverge even on its
            current market cap before adjusting for business-model differences.
        - >-
            A normalized comp set paired with Mytra revenue, backlog, and gross-margin data
            would make the comp work far more decision-useful.
    notes: >-
      This table mixes company-reported proof with third-party skepticism and should be read as
      a decision frame, not as a precise price model.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Indicative range
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Above the only public private-market proxy (~$2B)
        - >-
            The large 2025 deployment converts into several disclosed live sites, backlog
            expands, and the commercial model shows repeatable economics.
        - >-
            Only then would paying at or above the external proxy look supportable, because
            execution risk would be meaningfully de-risked.
        - >-
            Install delays, customer concentration, or hardware-margin pressure could still
            break the case.
        - >-
            New independent reporting on live sites, backlog, and customer expansion.
      - - Base
        - Around to below the proxy
        - >-
            Operational proof keeps improving, but valuation terms and unit economics remain
            only partially disclosed.
        - >-
            The name stays investable on diligence, but upside cannot be underwritten from
            public data alone.
        - >-
            Public-comp volatility, undisclosed financing terms, and long install cycles keep
            the margin of safety thin.
        - Research-more until disclosure closes the gap.
      - - Bear
        - Below the proxy, with down-round risk
        - >-
            The large deployment slips, financing conditions tighten, or customer breadth fails
            to expand beyond a few lighthouse references.
        - >-
            A value reset or structured insider financing becomes plausible because public
            evidence cannot defend the existing proxy on fundamentals.
        - >-
            Missing backlog visibility and preference overhang would hit common-equity outcomes
            first.
        - >-
            Any delayed go-live, weaker hiring pace, or fresh tracker markdown would be a
            negative signal.
    notes: >-
      Ranges are directional because no public source discloses an exact current valuation,
      cap-table terms, or revenue base from which to build a tighter model.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays constrained by the interaction between real deployment proof and
      still-missing underwriting disclosure.
    data:
      nodes:
        - id: official-financing
          label: Official financing proof
          note: $120M Series C and >$200M total funding show real capital support.
        - id: operating-signals
          label: Deployment proof
          note: 60x larger deployment, two pilots, one live site, and early 32%/34% gains.
        - id: disclosure-gap
          label: Missing underwriting data
          note: No public revenue, backlog, pricing model, live-site count, or exact Series C terms.
        - id: public-comp
          label: Public comp anchor
          note: Symbotic is directionally relevant, but live market-cap screens disagree materially.
        - id: downside
          label: Downside evidence
          note: Teardown flags scale risk, while external funding trackers still lag or conflict.
        - id: recommendation
          label: Recommendation
          note: Research-more with a stretched stance until price or disclosure improves.
      edges:
        - from: official-financing
          to: operating-signals
        - from: operating-signals
          to: disclosure-gap
        - from: disclosure-gap
          to: public-comp
        - from: public-comp
          to: downside
        - from: downside
          to: recommendation
    approximationNotes: null
    claimRefs: [CV001, CV003, CV006, CV008, CV009, CV010, CV011, CV012, CV015]
callouts:
  - calloutType: recommendation
    title: Public evidence caps the call at research-more
    body: >-
      The current public record is strong enough to keep Mytra in the diligence funnel but not
      strong enough to justify a buy recommendation around the only visible ~$2B valuation
      proxy.
    claimRefs: [CV008, CV009, CV015]
  - calloutType: assumption
    title: An upgrade would require better disclosure, not just more excitement
    body: >-
      A more constructive call needs hard disclosure on revenue, backlog, pricing, and exact
      Series C terms, or an entry price that clearly resets below today's noisy private-market
      proxy.
    claimRefs: [CV009, CV015, CV016]
