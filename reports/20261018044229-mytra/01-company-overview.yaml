callouts:
  - calloutType: insight
    title: Narrow but real commercial proof
    body: >-
      Albertsons is a real named reference, and the company later pointed to a Fortune 100 food customer plus a Fortune
      500 industrial-supply customer, but the retained public record still does not expose a denominator for customers,
      live sites, or renewal quality.
    claimRefs: [CO008, CO011, CO015]
  - calloutType: risk
    title: Execution transparency lags financing scale
    body: >-
      Mytra has raised enough capital to look late-stage, but public underwriting still lacks official valuation, revenue,
      run-rate, and customer-count data, so the main diligence burden is proving that the 2025-2026 deployment signals
      translate into repeatable, economic scale.
    claimRefs: [CO009, CO011, CO015, CO016]
