companyProfile:
  summary: >-
    Mytra is a Bay Area warehouse-automation company that rethinks automated storage and retrieval around a
    software-defined, full-pallet system rather than a tote-based one. The company emerged from stealth in 2024, raised
    a $120 million Series C in January 2026, and says it already has production deployments and named strategic
    customers, but it still does not publicly disclose a full commercial model or operating metrics.
