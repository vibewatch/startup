          label: High-velocity pallet operators
          detail: "Target verticals are buyers with vast pallet networks and higher velocities."
        - id: sale
          label: Consultative enterprise deal
          detail: "Large industrial contracts, not self-serve SaaS, are the public GTM signal."
        - id: deployment
          label: Deployment and go-live
          detail: "Pilots, production sites, and a 60x larger deployment indicate project-scale implementation."
        - id: package
          label: Integrated system package
          detail: "Mytra sells lattice, bots, and orchestration software as one automation system."
        - id: revenue
          label: Revenue recognition path undisclosed
          detail: "Public sources do not confirm whether current contracts are capex, RaaS, or hybrid."
        - id: margin
          label: Gross profit depends on execution variance
          detail: "Hardware, installation labor, uptime, and service obligations likely drive realized margin."
      edges:
        - from: demand
          to: sale
          label: buyer need
        - from: sale
          to: deployment
          label: signed program
        - from: deployment
          to: package
          label: delivered system
        - from: package
          to: revenue
          label: contract structure
        - from: revenue
          to: margin
          label: service and cost mix
    approximationNotes: "The bridge is qualitative because public sources disclose milestones and outcomes, not contract accounting."
    claimRefs: [CI006, CI007, CI008, CI011, CI012, CI013]
