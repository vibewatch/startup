      - number: '1.2'
        title: Founders, leadership bench, and governance signals
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is one of the clearest strengths in the evidence set. Chris Walti and Ahmad Baitalmal
              both come from Tesla-era factory and warehouse automation work, with Baitalmal also tied to Rivian
              software, so the company is being led by operators who have already confronted high-throughput
              material-flow problems in demanding industrial environments. Governance still looks founder-led, but the
              2025 leadership additions and the board appointment of former Tesla CFO Zach Kirkhorn show an effort to
              add scaling, finance, and industrial operating experience before broader deployment ramps. The key-person
              risk remains concentrated around Walti as the public product narrator and around Baitalmal for the
              software layer, because public sources do not show much depth beneath the named leadership bench or a
              fully disclosed board composition.
            claimRefs:
              - CO005
              - CO006
              - CO012
              - CO013
