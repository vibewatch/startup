      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat question is less about whether Mytra's robot is novel and more about whether the heavy-pallet
              architecture stays compelling after buyers price in rollout risk, opaque commercial terms, and
              better-proven substitutes. Teardown's caution on Attabotics matters because it is the closest conceptual
              analogue in public evidence: a differentiated 3D storage architecture still failed under the capital
              intensity and sales cycles of enterprise automation. The same source argues that Mytra must convert a
              small number of high-profile pilots into repeatable deployments before incumbents or cheaper shuttle
              vendors pull the conversation toward price and installed-base trust. That makes Mytra look differentiated
              but not yet durable. The technical wedge is real, yet public proof on live production breadth, pricing
              model, and repeatable deployment economics still lags the better-established field.
            claimRefs:
