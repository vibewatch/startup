  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is pallet-heavy warehouse and manufacturing material flow, not generic warehouse software
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence defines Mytra's addressable problem as moving and storing heavy material in
              warehouses, cross-docks, and adjacent manufacturing workflows rather than generic warehouse IT or
              small-item fulfillment software. At launch, Automated Warehouse described a cube-climbing automated
              storage and retrieval system that moves full pallets up to 1,360 kg (3,000 lb.) in any direction, can fit
              existing footprints, and supports goods-to-person, goods-to-robot, and cross-dock buffering use cases.
              Mytra's 2026 Series C announcement kept the same framing, describing software-defined primitives for move,
              store, pick, and route rather than a single-purpose robot. That boundary matters for diligence: the
              closest included spend is pallet storage, retrieval, orchestration software, and brownfield deployment in
              high-throughput distribution and manufacturing environments, while excluded spend includes small-item tote
              automation, generic WMS software, and light-duty AMRs that do not solve full-pallet movement. Public
              market evidence is therefore better for adoption pressure than for clean top-down TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
