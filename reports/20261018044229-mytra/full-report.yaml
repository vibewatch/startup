  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Indicative range
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Above the only public private-market proxy (~$2B)
        - >-
          The large 2025 deployment converts into several disclosed live sites, backlog expands, and the commercial
          model shows repeatable economics.
        - >-
          Only then would paying at or above the external proxy look supportable, because execution risk would be
          meaningfully de-risked.
        - Install delays, customer concentration, or hardware-margin pressure could still break the case.
        - New independent reporting on live sites, backlog, and customer expansion.
      - - Base
        - Around to below the proxy
        - Operational proof keeps improving, but valuation terms and unit economics remain only partially disclosed.
        - The name stays investable on diligence, but upside cannot be underwritten from public data alone.
        - Public-comp volatility, undisclosed financing terms, and long install cycles keep the margin of safety thin.
        - Research-more until disclosure closes the gap.
      - - Bear
        - Below the proxy, with down-round risk
        - >-
          The large deployment slips, financing conditions tighten, or customer breadth fails to expand beyond a few
          lighthouse references.
        - >-
          A value reset or structured insider financing becomes plausible because public evidence cannot defend the
          existing proxy on fundamentals.
        - Missing backlog visibility and preference overhang would hit common-equity outcomes first.
        - Any delayed go-live, weaker hiring pace, or fresh tracker markdown would be a negative signal.
    notes: >-
      Ranges are directional because no public source discloses an exact current valuation, cap-table terms, or revenue
      base from which to build a tighter model.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
