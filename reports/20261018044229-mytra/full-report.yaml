      - number: '1.3'
        title: Capital base, stakeholder map, and stage signals
        blocks:
          - type: paragraph
            body: >-
              Mytra has moved from stealth startup to heavily funded late-stage private company in a short window. At
              launch, it had disclosed $78 million through Series B and highlighted Albertsons as an early commercial
              partner; by January 2026 it announced a $120 million Series C led by Avenir Growth, with strategic
              investors Lineage and RyderVentures alongside new financial participants. That support base matters
              because the company is selling a capital-intensive system that likely requires long enterprise cycles,
              integration labor, and customer education. The public record still does not provide cap-table terms, an
              official valuation, revenue, or a customer-count denominator, so the stakeholder map is more useful for
              understanding strategic pull and diligence priorities than for inferring economic control with precision.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO015
