      - number: '4.3'
        title: The model looks capital intensive before it looks software-like
        blocks:
          - type: paragraph
            body: |-
              Everything public about the deployment model points toward lumpy, working-capital-heavy
              economics. The product bundles lattice infrastructure, bots, and orchestration
              software, and outside reporting characterizes customer contracts as large industrial
              deals rather than SaaS subscriptions. Public commentary also frames any service-led
              model as shifting risk from buyer capex to vendor uptime, maintenance, and renewal
              obligations. That means Mytra may ultimately earn attractive recurring economics, but
              only if it can standardize installs, contain service variance, and avoid burning its
              financing base on steel, labor, and execution overruns before margins are visible.
            claimRefs:
