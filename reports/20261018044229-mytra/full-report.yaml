  - id: FI001
    title: Publicly visible revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a high-value enterprise deployment motion, but the bridge from customer activity to
      recognized revenue and gross profit remains only partially disclosed.
    data:
      nodes:
        - id: demand
          label: High-velocity pallet operators
          detail: Target verticals are buyers with vast pallet networks and higher velocities.
        - id: sale
          label: Consultative enterprise deal
          detail: Large industrial contracts, not self-serve SaaS, are the public GTM signal.
        - id: deployment
          label: Deployment and go-live
          detail: Pilots, production sites, and a 60x larger deployment indicate project-scale implementation.
        - id: package
          label: Integrated system package
          detail: Mytra sells lattice, bots, and orchestration software as one automation system.
        - id: revenue
          label: Revenue recognition path undisclosed
          detail: Public sources do not confirm whether current contracts are capex, RaaS, or hybrid.
        - id: margin
          label: Gross profit depends on execution variance
          detail: Hardware, installation labor, uptime, and service obligations likely drive realized margin.
      edges:
        - from: demand
          to: sale
          label: buyer need
        - from: sale
          to: deployment
          label: signed program
        - from: deployment
          to: package
          label: delivered system
        - from: package
          to: revenue
          label: contract structure
        - from: revenue
          to: margin
          label: service and cost mix
    approximationNotes: The bridge is qualitative because public sources disclose milestones and outcomes, not contract accounting.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Mytra's disclosed stack layers the orchestration software over planning, bot mobility, storage media, and edge
      warehouse handoffs.
    data:
      layers:
        - label: Workflow intent
          detail: Customer requests storage, retrieval, sequencing, or buffering work for full-pallet loads.
          outputs:
            - label: Store
            - label: Retrieve
            - label: Sequence
            - label: Buffer
        - label: Software-defined primitives
          detail: Public materials describe move, store, pick, and route as the core programmable actions.
          modules:
            - label: Move
            - label: Store
            - label: Pick
            - label: Route
        - label: Orchestration and planning
          detail: >-
            The WES layer optimizes bot routes, manages inventory location, and adjusts the matrix toward density or
            velocity.
          modules:
            - label: Route optimization
            - label: Inventory placement
            - label: Priority handling
          outputs:
            - label: Dispatch decisions
            - label: Pick-port assignments
        - label: Bot fleet
          detail: Low-profile robots move loaded cell trays from any cell to any adjacent cell in X, Y, or Z.
          modules:
            - label: 3D motion
            - label: Payload handling
          outputs:
            - label: Pallet transfer
        - label: Cell trays and matrix
          detail: >-
            A repeating lattice and tray system create addressable storage space and remove aisle dependence inside the
            structure.
          modules:
            - label: Repeating cells
            - label: Tray interface
          outputs:
            - label: Dense storage
            - label: Reconfigurable layout
        - label: Edge handoff
          detail: Forklifts, AMRs, palletizing robots, or humans interact at periphery pickup and drop zones.
          modules:
            - label: Periphery ports
            - label: Adjacent automation
          outputs:
            - label: Goods-to-person
            - label: Goods-to-robot
            - label: Dock buffer
    approximationNotes: >-
      The layer ordering is synthesized from public descriptions of Mytra's operating model; it is not a literal vendor
      architecture diagram.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: Customer journey from problem framing to expansion proof
    type: journey-map
    summary: >-
      Mytra's public customer evidence shows a progression from ROI-led problem framing into pilots, production, and
      still-unresolved expansion proof.
    data:
      items:
        - label: Labor and space pain qualification
          actor: Enterprise warehouse / plant operator
          phase: Pre-sale
          touchpoints:
            - Material flow is labor-intensive and warehouse aisles consume dead space
            - Buyers need pallet automation that fits existing facilities
          tone: neutral
        - label: Workflow-fit evaluation
          actor: Supply-chain engineering and automation teams
          phase: Evaluation
          touchpoints:
            - Goods-to-person, goods-to-robot, and cross-dock workflows are evaluated
            - Modular design is positioned to fit a customer's existing warehouse layout
          tone: neutral
        - label: Pilot shipment
          actor: Mytra deployment team and early customer sites
          phase: Pilot
          touchpoints:
            - Mytra says it shipped two pilot systems in 2025
            - Pilot-to-production conversion remains undisclosed
          tone: neutral
        - label: Production go-live
          actor: Named and unnamed customer sites
          phase: Initial production
          touchpoints:
            - Albertsons is the named production reference
            - Mytra says a new customer site also went live in production in 2025
          tone: positive
        - label: Network-scale expansion
          actor: Enterprise account sponsors
          phase: Expansion
          touchpoints:
            - Mytra says it signed a deployment 60x its prior largest installation
            - Early deployment ROI claims are 32% lower labor and 34% higher storage density
          tone: positive
        - label: Renewal and reference underwriting
          actor: Investors, procurement, and later-stage prospects
          phase: Diligence
          touchpoints:
            - No public NRR, churn, contract-length, or customer-count disclosure
            - Major 2026 customers remain anonymous, limiting concentration analysis
          tone: risk
