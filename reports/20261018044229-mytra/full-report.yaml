  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternatives
        blocks:
          - type: paragraph
            body: >-
              Mytra is competing across three different alternative sets at once: entrenched manual pallet movement and
              aisle-based storage, scaled automation incumbents with much stronger public proof, and newer shuttle or
              cube systems that solve lighter workflows. Independent launch coverage and Mytra's own launch materials
              consistently frame the product as a software-defined automated storage and retrieval system for moving and
              storing material, with a full-pallet payload class that differs from tote- or case-oriented systems. That
              technical positioning is credible, but the public proof set is still thin. Albertsons was the named launch
              reference, and January 2026 disclosures still relied on a Fortune 100 food company and a Fortune 500
              industrial-supply distributor rather than a broad public customer roster. Strategic investors Lineage and
              RyderVentures may provide access to logistics operators, but the retained evidence discloses no channel
              terms or partner-led deployments. The practical market framing is therefore Mytra versus the status quo of
              forklift-led pallet handling, internal engineering programs, and a set of better-proven automation
              vendors, not simply Mytra versus one direct robot rival.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
