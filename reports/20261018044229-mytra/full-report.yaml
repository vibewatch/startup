              - CP013
      - number: '3.2'
        title: Capability and procurement comparison
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows a clear capability split. Symbotic markets a turnkey, end-to-end automation
              stack with published throughput, labor, and accuracy claims, but its published load envelope is
              case-native and far below Mytra's claimed 3,000-pound pallet class. Exotec's latest Skypod iteration
              publicly supports each and case picking with integrated sequencing and buffering, and Logistics Viewpoints
              says it has already secured more than 20 projects totaling $400 million. AutoStore has the much larger
              installed base, but Teardown explicitly describes it as a tote system rather than a full-pallet platform.
              The result is a credible Mytra payload wedge paired with weaker procurement transparency: public sources
              do not disclose Mytra pricing or contract structure, and the retained evidence also does not provide
              apples-to-apples pricing for the alternatives. Buyers therefore appear to be choosing between a better-fit
              architecture for heavy pallets and a more proven installation record. The fixed matrix and integrated
              orchestration also suggest switching cost after installation, although no retained source quantifies
              migration expense or lock-in. Conversely, the reported ability to begin with a few racking rows suggests
              buyers could multi-home with forklifts or existing automation during a staged rollout rather than make an
              immediate all-or-nothing conversion.
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
