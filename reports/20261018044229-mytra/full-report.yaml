      - number: '1.4'
        title: Milestones, scale evidence, and open underwriting questions
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence of forward motion sits in the 2025 to early-2026 milestone cluster. Mytra said it
              signed a deployment 60 times larger than its prior largest installation, shipped two pilot systems,
              brought a new customer site live, expanded into a 100,000-square-foot Brisbane headquarters, and added
              senior functional leaders before closing its Series C. Those are meaningful scale indicators, but they
              still stop short of the metrics a later-stage investor would want for underwriting: disclosed revenue,
              site count, ACV concentration, renewal behavior, or audited performance data. The adverse read in the
              retained independent analysis is reasonable: the main debate is no longer whether the concept is novel,
              but whether Mytra can turn a narrow set of reference deployments into repeatable, on-time, at-scale
              execution before capital intensity, procurement friction, or pricing pressure compress the upside.
