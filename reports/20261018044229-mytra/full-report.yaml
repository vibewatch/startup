chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and product posture
        blocks:
          - type: paragraph
            body: >-
              Mytra presents itself as a software-defined industrial robotics company for the physical movement and
              storage of material, not as a point robot vendor. The retained sources consistently describe the same core
              architecture: bots, software, and storage cells that together move full pallets through a
              three-dimensional structure, with a stated lift limit of 3,000 pounds. That gives later chapters a stable
              company identity and product description to reuse: late-stage private warehouse automation infrastructure,
              founded in 2022, headquartered in Brisbane, California, and oriented toward enterprise deployments in
              logistics and industrial settings rather than SMB software sales. Public materials are stronger on system
              description than on commercial terms, so the operating model should be read as integrated hardware plus
              orchestration software rather than a cleanly disclosed pricing or revenue model.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
