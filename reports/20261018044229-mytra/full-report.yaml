        title: Exhibits
        blocks:
          - type: callout
            title: Retrofits look like the nearer-budget path than greenfield rebuilds
            body: >-
              Albertsons' automation target and AWG's $110 million retrofit suggest the buyer budget is already shifting
              toward upgrading existing pallet-heavy networks rather than waiting for greenfield-only facilities.
            calloutType: insight
