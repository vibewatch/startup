        - >-
          Evidence that the capital converts into backlog, faster installs, and disciplined hiring would strengthen the
          underwriting case.
      - - Anti-thesis
        - Valuation is still opaque.
        - >-
          Teardown says valuation is undisclosed, while third-party trackers and coverage still disagree on both total
          funding history and current round size.
        - >-
          Exact Series C post-money, liquidation preference, and dilution disclosure would materially improve
          confidence.
      - - Anti-thesis
        - Public comp anchoring is noisy.
        - >-
          Symbotic is directionally relevant, but live public screens diverge even on its current market cap before
          adjusting for business-model differences.
        - >-
          A normalized comp set paired with Mytra revenue, backlog, and gross-margin data would make the comp work far
          more decision-useful.
    notes: >-
      This table mixes company-reported proof with third-party skepticism and should be read as a decision frame, not as
      a precise price model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
