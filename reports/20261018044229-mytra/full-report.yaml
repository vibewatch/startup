      - number: '2.2'
        title: Buyers are operations-led pallet networks that already budget for retrofit automation
        blocks:
          - type: paragraph
            body: >-
              The most plausible early buyers are operators whose economics are dominated by pallet movement, labor
              availability, and storage density rather than by e-commerce piece picking. Supply Chain Digital and
              Automated Warehouse both position Mytra around Albertsons and other high-volume operators, while Supply
              Chain Dive reports Albertsons expected 30% of its distribution volume to be automated by the end of 2025.
              Grocery Dive adds that AWG is investing $110 million to modernize an existing Gulf Coast facility with
              advanced automation. Those third-party budget signals support a buyer map centered on grocery retail,
              wholesale distribution, 3PL/cold-chain operators, and manufacturers with pallet staging or work-in-process
              needs. Budget ownership is likely operational rather than experimental: adoption requires facility
              changes, automation integration, and workflow redesign, so the economic buyer is more likely a supply
              chain, distribution, or manufacturing leader than a software-only function.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM013
      - number: '2.3'
        title: Adoption drivers are visible, but sizing and commercialization still have material gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public demand signals are labor scarcity, density pressure, and the desire to retrofit
              brownfield facilities without committing to rigid one-purpose systems. Mytra and its syndicated release
              cite nearly 50% of manufacturing labor tied to material handling, more than 400,000 open industrial roles
              today heading toward 2 million by 2030, roughly 60% warehouse dead space, and approximately 80% of
              industrial facilities with zero automation. If those constraints are directionally right, then Mytra's
              value proposition matches a real operating pain. The counterweight is just as important: Mytra's public
              materials still do not disclose pricing, whether deals are capex, RaaS, or hybrid, or how many production
              sites are live beyond named references such as Albertsons. Even the best public outcome claims remain
              company-reported rather than independently benchmarked. That means the market case is credible enough to
              justify continued diligence, but not precise enough to underwrite share capture or payback without private
              evidence.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM011
              - CM012
              - CM013
