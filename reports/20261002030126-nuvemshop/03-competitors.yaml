figures:
  - id: FP001
    title: Evidence-bounded competitive positioning
    type: quadrant
    summary: >
      Ordinal map of documented Latin American localization versus documented global
      breadth; zero means the retained evidence did not establish the attribute.
    data:
      xAxis:
        label: Documented Latin American localization
        min: 0
        max: 3
      yAxis:
        label: Documented global breadth
        min: 0
        max: 3
      points:
        - label: Nuvemshop
          x: 3
          y: 1
          rationale: Strong regional localization; described as region-specific
        - label: Shopify
          x: 1
          y: 3
          rationale: Global reach and larger ecosystem; local adaptation described as weaker
        - label: Wix eCommerce
          x: 0
          y: 2
          rationale: Broader international audience reported; regional depth not established
        - label: PrestaShop
          x: 0
          y: 1
          rationale: Flexibility reported; geographic depth not established
        - label: Shoplazza
          x: 0
          y: 1
          rationale: Broad SME platform scope reported; regional depth not established
        - label: Ecwid
          x: 0
          y: 0
          rationale: Listed as an alternative without positioning evidence
    approximationNotes: >
      Analyst-authored ordinal scale: 0 = not established, 1 = limited evidence,
      2 = moderate evidence, 3 = strong evidence. Values are not market-share,
      performance, or product-quality scores.
    claimRefs:
      - CP015
callouts:
  - calloutType: risk
    title: Comparison evidence is not a benchmark
    body: >
      Third-party comparison pages consistently frame Nuvemshop around regional
      localization and Shopify around global breadth, but they do not provide a
      controlled feature, cost, performance, or merchant-outcome benchmark.
    claimRefs:
      - CP002
      - CP003
      - CP015
  - calloutType: insight
    title: Workflow breadth is the likely switching mechanism
    body: >
      Catalog, checkout, order, inventory, freight, and marketplace integrations create
      multiple migration surfaces. The evidence supports the mechanism, but not a
      quantified retention effect or contractual lock-in.
    claimRefs:
      - CP009
      - CP011
