chapter:
  number: 3
  title: Competitors
  summary: >
    The retained evidence places Nuvemshop between globally broad commerce platforms and
    more configurable alternatives: its clearest differentiation is Latin American
    payments, shipping, and installment localization, while Shopify is described as the
    stronger option for international reach. The evidence does not support a precise
    market-share ranking or normalized total-cost comparison, so those remain diligence
    gaps rather than modeled conclusions.
sections:
  - id: landscape-and-buyer-options
    title: Landscape and buyer alternatives
    body: >
      The assigned evidence identifies Shopify as the clearest direct global competitor
      and also names Wix eCommerce, PrestaShop, Shoplazza, Ecwid, Big Cartel, and TRAY as
      alternatives or comparison points. These are not interchangeable competitors.
      Shopify and Wix offer globally oriented hosted platforms, PrestaShop represents a
      configurable open-source path, and internal build or continued use of a marketplace
      remains a status-quo substitute for buyers that do not adopt a dedicated regional
      platform. Nuvemshop's strongest documented distinction is geographic rather than a
      universal feature lead: Softwares.com describes it as purpose-built for Latin
      America, while ForesightIQ describes Shopify as the principal global threat. The
      retained pool lacks current, primary competitor disclosures on funding, merchant
      counts, and regional market share, so the profile table separates reported data
      from unknowns instead of treating aggregator comparisons as independent benchmarks.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP012
      - CP013
      - CP014
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capabilities-and-switching
    title: Capability differentiation and switching friction
    body: >
      Nuvemshop's defensible layer is the integration of a storefront with local payment,
      shipping, installment, ERP, marketplace, and social-commerce workflows. GetApp
      describes integrations with dozens of ERP, freight, and marketplace tools, while
      Softwares.com emphasizes regional payments and carriers that global platforms can
      handle awkwardly. Apps Run The World's implementation records show the platform
      used for catalog, checkout, order, inventory, and fulfillment workflows across
      organizations of different sizes. That breadth can create operational switching
      friction because replacement affects multiple workflows, but no retained source
      quantifies migration cost, churn, contract lock-in, or multi-homing. Developer
      friction is also visible: Innovate built an independent CLI after encountering
      manual FTP uploads, full downloads, weak platform-specific validation, and hidden
      theme errors. This is evidence of ecosystem demand and tooling gaps, not proof of a
      proprietary moat or an official Nuvemshop capability.
    claimRefs:
      - CP002
      - CP009
      - CP010
      - CP011
    tableRefs:
      - TP002
  - id: pricing-and-durability
    title: Pricing evidence and moat durability
    body: >
      Current pricing evidence is directionally useful but not normalized. TrustRadius
      lists three Nuvemshop plans from "$59" to "$389" and also lists a free version and
      free trial, whereas GetApp explicitly reports a Brazilian starting price of R$59
      per month plus a free plan and free trial. Because the TrustRadius extract does not
      resolve the currency symbol, the two records cannot be treated as equivalent
      dollar-denominated prices. TrustRadius also lists low entry prices for Wix, Ecwid,
      and Big Cartel, but the extract does not establish equivalent feature bundles,
      transaction fees, taxes, contract terms, or regional availability. Durability
      therefore rests less on headline subscription price than on whether localization
      and integrated workflows offset Shopify's larger global ecosystem. The adverse
      case is clear but unquantified: merchants prioritizing international reach may
      prefer Shopify, while regional workflow depth favors Nuvemshop.
    claimRefs:
      - CP003
      - CP006
      - CP007
      - CP008
    tableRefs:
      - TP003
