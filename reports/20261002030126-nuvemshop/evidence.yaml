evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-arr
    missingEvidence: >-
      Audited consolidated financial statements, audited annual recurring revenue (ARR), gross margins, and net burn
      rates for 2025 and 2026.
    whyItMatters: >-
      Independent estimates for annual revenue diverge widely between $75 million and $130 million; without audited
      figures, valuation multiples and unit economics cannot be precisely modeled.
    diligencePath: Request confidential management financial package under non-disclosure agreement during late-stage diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: informative
    topic: leadership-roster-sample-coverage
    missingEvidence: Complete executive and board directory for Nuvemshop beyond primary public co-founders and divisional leads.
    whyItMatters: >-
      Table TO002 represents an illustrative leadership sample; complete committee composition and board observer seats
      remain private.
    diligencePath: Review capitalization table, charter documents, and board minutes in the virtual data room.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: sparse-evidence
    severity: informative
    topic: stakeholder-map-sample-coverage
    missingEvidence: >-
      Comprehensive merchant directory, exact customer concentration metrics, and full investor syndicate holdings
      across all equity classes.
    whyItMatters: >-
      Table TO003 presents representative merchant profiles and institutional stakeholders rather than an exhaustive
      platform census.
    diligencePath: Obtain merchant cohort retention schedules and detailed equity cap table directly from corporate management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: regional-tam-breakdown
    missingEvidence: >-
      Country-level audited GMV and merchant software spend breakdowns for Mexico, Colombia, and Argentina isolating
      Nuvemshop's exact market share vs Shopify and local competitors.
    whyItMatters: >-
      Without segmented geographic GMV reporting, regional Latin American TAM sizing relies disproportionately on Brazil
      transactional data published via Radar D2C.
    diligencePath: >-
      Request country-level management accounts and payment volume schedules for Mexico, Colombia, and Argentina during
      data room review.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current primary disclosures for competitor revenue, merchant count, funding, market share, and strategic direction
      on a comparable period basis.
    whyItMatters: Aggregator figures cannot establish relative scale or trajectory on an underwriting-quality basis.
    diligencePath: >-
      Obtain current competitor filings, official disclosures, and Latin America segment data, then normalize periods
      and metric definitions.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Currency-resolved list prices, transaction fees, taxes, discounts, feature bundles, and regional availability for
      each platform.
    whyItMatters: The retained pages show headline prices with inconsistent currency notation and no equivalent total-cost basis.
    diligencePath: Collect dated official pricing pages and representative merchant invoices for Brazil, Mexico, and Argentina.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching
    missingEvidence: >-
      Merchant churn, migration cost, contract term, multi-homing, and cohort retention evidence by GMV tier and
      country.
    whyItMatters: Workflow breadth suggests switching friction but does not quantify lock-in, retention, or displacement risk.
    diligencePath: Request cohort retention data, win-loss analyses, migration surveys, and contract samples from management.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: audited-revenue
    missingEvidence: Audited consolidated revenue, ARR definition, reporting period, and product and geographic revenue mix.
    whyItMatters: Public estimates differ by more than sevenfold and cannot support a reliable revenue baseline.
    diligencePath: Request audited 2024-2026 financial statements and reconcile them to board reporting and management ARR.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current realized pricing, CAC, sales cycle, payback, retention, gross margin, payment losses, working capital,
      capex, and service-delivery costs.
    whyItMatters: >-
      Merchant activity cannot establish durable revenue quality, sales efficiency, or contribution margin without these
      inputs.
    diligencePath: >-
      Request plan-level pricing realization, merchant cohorts, acquisition-channel data, and product-level
      contribution-margin schedules.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway forecast, debt, payment-loss reserves, financing obligations, planned uses of
      funds, and next-round triggers.
    whyItMatters: Historical funding raised does not establish current cash availability or financing dependency.
    diligencePath: >-
