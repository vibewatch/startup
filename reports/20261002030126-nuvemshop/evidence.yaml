  - type: private-evidence-only
    severity: material
    topic: edge-infrastructure-and-uptime-sla
    missingEvidence: Audited cloud infrastructure topology, multi-region failover documentation, and historical uptime SLA metrics.
    whyItMatters: >-
      Validating infrastructure resilience against high-traffic peak retail events (such as Black Friday and Father's
      Day) is essential for enterprise underwriting.
    diligencePath: >-
      Request production infrastructure diagrams, cloud hosting vendor commitments, and multi-year incident post-mortems
      from Nuvemshop engineering leadership.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: api-rate-limits-and-graphql-roadmap
    missingEvidence: Formal API rate-limiting thresholds and prospective GraphQL endpoint availability documentation.
    whyItMatters: >-
      Understanding API concurrency limits affects feasibility assessments for headless commerce frontends and
      high-volume ERP integrations.
    diligencePath: >-
      Obtain enterprise developer documentation detailing rate limits, webhook delivery retries, and developer platform
      roadmap.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited merchant cohort retention schedules, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and
      monthly logo churn percentages.
    whyItMatters: >-
      Without segmented cohort retention rates, it is impossible to evaluate whether growth is driven by low-cost
      merchant acquisition or sustainable high-margin account expansion.
    diligencePath: >-
      Request confidential SaaS cohort retention curves and gross/net churn schedules by merchant GMV tier from
      management.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-status
    missingEvidence: >-
      Primary regulator registrations and correspondence, court and enforcement dockets, privacy assessments, and
