  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心商务平台与商家工作流架构
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop（在拉美西语市场称为 Tiendanube）为中小企业商家提供覆盖完整零售生命周期的一站式 SaaS
              基础设施，包括网店目录托管、结账流程编排、支付路由以及库存管理。平台屏蔽了底层运营复杂度，提供自动化站点地图（sitemap）、原生 robots.txt 抓取规则、托管 TLS/HTTPS
              证书、规范域名重定向，以及按商品和品类配置的独立搜索引擎优化（SEO）元数据，无需商家运维服务器。然而，商家对未经审核的第三方主题组件与未优化追踪插件的依赖，频繁引发严重的客户端性能劣化。独立审计显示，采用动态多模块首页的网店累积了大量页面负载，未优化店铺的
              HTML 体积高达 3.3 MB，并在 120 个嵌入式商品模块中执行 150 个客户端脚本，导致移动端最大内容绘制 (LCP) 延迟长达 12.2
              秒。尽管后台仪表盘简化了日常目录维护，非技术背景的店主在排查页面技术缺陷（如阻碍搜索引擎爬虫抓取的客户端 JavaScript 导航菜单）时仍面临持续的运维阻力。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
