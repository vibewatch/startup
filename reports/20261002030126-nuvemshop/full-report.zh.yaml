      - number: '4.4'
        title: 历史融资不代表当期流动性
        blocks:
          - type: paragraph
            body: >-
              独立数据库记录的累计融资额在 $628 million 至 $632 million 之间，这一统计口径的微小差异并不能证明其当前的现金头寸。各方一致认同的重大历史融资事件为 2021 年 8 月按投后估值
              $3.1 billion 完成的 $500 million E 轮融资。Forge 当前显示 Nuvemshop 交易活跃度有限且未给出 Forge Price，因此 2021
              年的估值无法作为现阶段的流动性定价基准。更为关键的是，募资总额不等于账面可用现金：所分配证据均未披露当期现金余额、月度资金消耗率、跑道周期、负债规模、支付坏账拨备或融资偿还义务。因此，财务评估结论高度依赖进一步尽职调查。历史融资印证了其
              2021 年的资本吸纳能力，但在取得经审计报表与当期资产负债表底稿前，无法对其当前资本充足率及可信的利润率改善路径进行有效核保。
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
