  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户客群细分与地域侧重
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop 客户群高度集中于拉美，主要服务从事直面消费者销售的巴西微型及中小企业 (SMB)。根据平台公开披露与生态指标，该平台在巴西、阿根廷、墨西哥、哥伦比亚和智利支持超过 180,000
              个活跃商户品牌。商家画像以小微规模为主：独立技术统计评估显示，所追踪客户账户中超过 80% 的员工数不足 100 人，而员工规模在 101 至 1,000 人的中型商业机构约占
              19%。核心商家行业集中于快消品领域，具体包括时尚服饰、美妆个护、鞋履及包装消费品。地域规模主要以巴西为基石，2025 年遍布巴西全部 27 个联邦行政区的 100,000 余家活跃 DTC 数字网店共创造了超过
              R$ 6.5 billion 的商品交易总额。
