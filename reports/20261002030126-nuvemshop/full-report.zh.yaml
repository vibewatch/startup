      - number: '3.2'
        title: 功能差异化与转换摩擦
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop 的防御壁垒在于将网店与本地支付、物流、分期、ERP、电商平台及社交商务流程紧密打通。GetApp 指出其集成了数十种 ERP、货运与电商平台工具，Softwares.com
              则强调全球平台难以顺畅处理的区域支付通道与承运商。Apps Run The World
              的部署记录显示，不同规模的企业均使用该平台处理商品目录、结账、订单、库存与履约流程。这种流程广度能产生运营层面的转换壁垒，因替换平台会波及多套工作流，但当前没有保留来源量化了迁移成本、流失率、合同锁定期或多平台挂靠
              (multi-homing) 情况。开发者层面的阻力同样可见：Innovate 在遭遇手动 FTP 上传、全量下载、平台专属校验不足及隐形主题错误后，自主构建了独立
              CLI。这反映了生态需求与工具链缺口，并非专属护城河或 Nuvemshop 官方能力的佐证。
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
