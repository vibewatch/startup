          - 'Capital Base: $600M+ Raised via Series E'
        - - 'Capital Base: $600M+ Raised via Series E'
          - 'Valuation Friction: $3.1B Benchmark vs Opacity'
        - - 'Valuation Friction: $3.1B Benchmark vs Opacity'
          - 'Financial Gap: Unaudited ARR & Take Rates'
        - - 'Financial Gap: Unaudited ARR & Take Rates'
