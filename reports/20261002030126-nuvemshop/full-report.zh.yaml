chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、业务版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop 成立于 2011 年，总部位于巴西圣保罗，是拉美核心电商 SaaS 基础设施提供商 [CO001]。平台支持微型及中小企业 (SMB) 与直面消费者 (DTC) 品牌搭建独立数字网店、集成
              POS 系统，并在移动即时通讯与社交渠道编排多渠道销售 [CO002]。公司在阿根廷、墨西哥、哥伦比亚和智利等西语市场以 Tiendanube 品牌运营，据报道在区域内服务超过 180,000 个活跃品牌
              [CO003]。公司商业化依托阶梯式软件订阅费（起价每月 R$ 59）以及浮动支付处理与金融服务费 [CO004]。Nuvemshop 系统性地从核心网店托管拓展至集成化运营技术栈，包括 Nuvem Pago
              原生支付、Nuvem Envio 物流聚合、Crédito Nuvemshop 营运资金贷款，以及集成 Lumi 人工智能模块的 Nuvem Chat 对话自动化工具
              [CO005]。仅在巴西，随着数字商务走向成熟，该平台 2025 年线上交易处理量便达到约 R$ 6.5 billion [CO006]。
            claimRefs:
