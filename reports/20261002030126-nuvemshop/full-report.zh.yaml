              - CM016
      - number: '2.3'
        title: 采购群体画像、预算归属与支付基础设施
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop
              目标客户群的采购决策权主要掌握在中小企业的创业型创始人兼运营者，以及中端市场品牌的电商总监或数字化转型负责人手中。买家采用度深受本地化交易流程制约。在巴西，支付基础设施决定了商家的转化率：2026 年 8
              月全月超过 50.5% 的交易订单经由央行即时支付系统 Pix 结算，且约 70% 的信用卡交易需要分期付款融资。因此，触发采购的极少是孤立的商品目录软件功能；相反，商家倾向于选择无需高昂定制 API
              开发或复杂中间件开销，即可原生支持信用卡分期、降低支付欺诈并实现多承运商物流无缝对接的平台。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 结构性驱动因素、宏观瓶颈与扩张风险
        blocks:
          - type: paragraph
            body: >-
              拉美电商 SaaS
              的扩张受到正规与非正规零售商快速线上化、高智能手机普及率以及账户间即时支付主流化的推动。然而，实质性瓶颈制约着长期单体经济模型。拉美各地的配送物流仍高度分散，在核心大都市圈以外，下单到交付周期历史平均需 5 至
              6 个工作日，必须依靠持续的承运商聚合合作向 1 至 2 日送达标准推进。此外，宏观经济波动、本土通胀、货币贬值以及支付欺诈风险对专业化风控基础设施提出了硬性要求，若无法有效控制拒付，将迅速侵蚀 Nuvem
              Pago 等自营支付通道的毛利率。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 深度图表
        blocks:
          - type: callout
            title: Pix 与分期付款构筑竞争壁垒
            body: 与信用卡主导一次性结账付款的北美电商软件不同，拉美商家若无法提供巴西即时 Pix 支付及信用卡多月分期选项，将面临极高的结账弃单率。原生集成此类支付机制构成了运营护城河，通用型跨国平台若无第三方插件难以匹敌。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
          - type: callout
            title: 中小企业商家客群的宏观经济敏感性
            body: Nuvemshop 的目标市场集中于初创期及微型至中型零售商，其终端消费需求对巴西和阿根廷的区域购买力波动、通胀及利率调整极其敏感，给商家 GMV 增速与订阅留存率带来了波动性。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              指定证据将 Shopify 列为最明确的全球直接竞品，同时提及 Wix eCommerce、PrestaShop、Shoplazza、Ecwid、Big Cartel 及 TRAY
              作为替代选项或对比参考。这些竞品之间并不完全同质。Shopify 与 Wix 提供全球化托管平台，PrestaShop
              代表高可配置性的开源方案，而自建系统或继续依赖平台电商，则是未采用区域垂直专用平台的买家所保持的现状替代方案。Nuvemshop 经佐证的最强差异化在于地域属性而非全面的功能领先：Softwares.com
              称其专为拉美打造，而 ForesightIQ 将 Shopify
              列为主要全球威胁。当前证据库缺乏关于竞品融资额、商家数及区域市占率的最新一手披露，因此画像表格将已报道数据与未知项分开列示，而非将聚合平台的对比视为独立基准。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP012
              - CP013
              - CP014
