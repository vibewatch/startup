      - number: '7.3'
        title: 运营与外部依赖风险
        blocks:
          - type: paragraph
            body: >-
              其业务运营面涵盖移动端分发、互联网连接、身份鉴权、商家网店、支付处理、物流协同与库存控制。Google Play
              应用商店说明明确标注必须具备互联网连接，形成了肉眼可见的外部依赖，尽管其未披露云托管架构、应用商店容灾备用方案或灾难恢复目标。Nuvemshop 自身 2026 年 8 月的 Radar
              报告指出，在所监测的巴西商户群中付费订单达 2.81 million 笔，Pix 占比 50.53%；此类指标属于生态活跃度范畴，不能等同于 Nuvemshop 自身收入，亦无法证实全公司的支付集中度。Apps
              Run The World 披露的实名客户部署案例显示部分客户依赖 Nuvemshop 作为核心线上销售平台，但其局部数据库无法推导整体客户集中度。所采集的 Yolo
              招聘页面在预抓取文本中未展现具体岗位详情，因此无法据此评估人员配备充分性或团队执行力。
            claimRefs:
