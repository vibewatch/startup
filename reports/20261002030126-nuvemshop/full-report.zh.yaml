        - label: 财务缺口：未审计 ARR 与变现率
          detail: 缺少经审计利润表及支付处理毛利披露
        - label: 核保立场：深入调研
          detail: 建议在完成财务核实前暂缓出资承诺
        - label: 尽调要件：审计报表与支付毛利
          detail: 须直接对接管理层核实净变现率与单体经济模型
      edges:
