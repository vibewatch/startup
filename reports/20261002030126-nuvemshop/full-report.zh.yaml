      - number: '3.3'
        title: 定价证据与壁垒持久性
        blocks:
          - type: paragraph
            body: >-
              目前的定价证据具备方向性参考价值，但未经标准化归一。TrustRadius 列出了 Nuvemshop 从「$59」到「$389」的三档方案，同时标注了免费版本与免费试用，而 GetApp
              明确报告其在巴西的起价为每月 R$59，并提供免费方案及试用期。由于 TrustRadius 提取数据未解析货币符号，两项记录不能直接视为等同的美元定价。TrustRadius 还列出了 Wix、Ecwid 和
              Big Cartel 较低的入门价格，但提取内容未对等说明功能包组合、交易手续费、税费、合同期限或区域可用性。因此，商业模式持久性并不取决于表层订阅价格，而在于本地化与集成工作流能否抗衡 Shopify
              更庞大的全球生态。反向用例明确但未能量化：侧重国际业务覆盖的商家可能偏好 Shopify，而本土工作流深度则利好 Nuvemshop。
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: 深度图表
        blocks:
          - type: callout
            title: 对比证据不等同于可信基准
            body: 第三方对比页面普遍将 Nuvemshop 定位为区域本地化专家、将 Shopify 定位为全球广度代表，但未能提供经过变量控制的功能、成本、性能或商家成效基准对比。
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP015
          - type: callout
            title: 工作流覆盖广度为关键转换机制
            body: 商品目录、结账、订单、库存、货运及电商平台集成就此形成多个迁移触点。现有证据支持这一业务机制，但未能证实量化的留存效应或合同锁定力。
            calloutType: insight
            claimRefs:
              - CP009
              - CP011
  - number: 4
    title: 财务表现
