              - CU016
      - number: '6.4'
        title: 深度图表
        blocks:
          - type: callout
            title: 大体量商家流失与跨国迁移风险
            body: >-
              得益于葡萄牙语本土支持、本地支付集成（Pix、Nuvem Pago）及区域物流网络，Nuvemshop 在拉美小微企业群体中确立了坚实的竞争地位。然而竞品情报显示，具有国际业务诉求的高成长型成功商家往往会超出
              Nuvemshop 本地化架构的承载上限，进而迁移至 Shopify Plus 等平台，压制了平台的长期客户生命周期价值 (LTV)。
            calloutType: risk
            claimRefs:
              - CU010
              - CU016
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 基于实证的风险态势
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop
              深入介入商家的关键业务流，而非仅仅充当展示层。其官方发布的移动应用介绍明确提及，商家可管理订单、收单、协同物流、调整库存并更新商品信息，且登录页面显示系统权限与店铺邮箱直接绑定。独立技术统计数据将部分商家的部署记录列为核心网店或线上销售系统。这些事实使系统可用性、账户访问权限与交易完整性成为证据最直接的运营风险点。因此，凡可能中断销售或支付环节的系统故障，其严重性均属最高级别；但发生概率被标注为未知：给定证据库中既无系统在线率时序数据、故障日志、欺诈损失历史，亦无内控审计报告。证据库缺乏上述记录属于信息空白，并不代表此前未发生过任何运营事故或监管处罚。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: 监管、法律与财务模型风险敞口
        blocks:
          - type: paragraph
            body: >-
              支付业务构成了最明确的强监管风险尽调主线，但现有证据并非官方监管记录。2023 年刊登 Nuvemshop 官方公告的文章提及，公司设立专职反欺诈与风控总监以监管 Nuvem Pago 安全，并披露 2022
              年在巴西处理交易额达 R$640 million。这足以说明管理层的重视程度与历史业务规模，却不能作为牌照资质、坏账损失率、合规有效性或现阶段内控成熟度的凭证。数据合规责任同样重大，因为 Nuvemshop
              声明其巴西数据库覆盖逾 100,000 家活跃店铺，并以聚合、匿名化形式使用付费订单数据。指定证据库中未见任何监管机构记录、诉讼文书、隐私合规审计或司法卷宗。财务维度的核保依据同样薄弱：Growjo
              估算其年收入为 $75 million，而 RocketReach 针对 2026 年给出的数字为 $126 million，但两项数据均非经审计的公司收入。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
