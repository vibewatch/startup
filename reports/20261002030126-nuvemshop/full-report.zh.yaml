      - number: '4.2'
        title: 商家活跃度体现平台使用规模，但非公司营收
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop 2026 年 8 月的 Radar 报告显示，其交易数据集中包含逾 100,000 家活跃巴西店铺。该官方来源同时披露，2025 年平台商家 GMV 达到 R$6.5 billion（较
              2024 年增长 35%），2026 年 8 月付费订单量达 2.81 million 笔。这些指标反映出实质性的商务规模，但统计分母为商家交易额：既非 Nuvemshop 自身收入亦非
              ARR，且公开证据未提供从 GMV 到确认收入的换算关系。Apps Run The World 观测到的客户群体高度集中于 0-100
              人规模的企业，仅提供了中小企业客群的方向性信号，而非完整或具代表性的客户普查。因此，公开的业务体量有助于验证平台使用度，但不足以评估收入质量或客户单体经济模型。
