companyProfile:
  summary: >-
    Nuvemshop 是一家后期非上市商务基础设施企业，协助拉美中小企业与 DTC 品牌开设并运营独立网店、收单、协调物流，并使用配套软件与金融服务。公司在巴西以 Nuvemshop 品牌运营，在西语市场采用 Tiendanube
    品牌，核心价值主张立足于本地化电商工具而非平台市场模式。
