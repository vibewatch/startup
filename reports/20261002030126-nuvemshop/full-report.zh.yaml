              商家群体的交易与 GMV 吞吐量呈现稳健商业扩张，同时自营金融服务的采用率持续攀升。在巴西，Nuvemshop 商家网络仅在 2026 年 8 月就捕获了 2.81 million 笔订单，平均客单价达 R$
              288.04。得益于父亲节促销等零售季节性利好（美妆销售额暴涨 74.4%，珠宝销售额增长 57.1%），平台 2026 年 8 月 GMV 同比增长 50.3%。此外，2025 年间共有超过 12
              million 名独立巴西消费者在 Nuvemshop 网店完成购物。支付处理集成成为日益关键的客户黏合触点：2026 年 8 月经由 Pix 完成的即时支付占巴西网店全部订单的 50.53%，使用 Nuvem
              Pago 的商家亦享有免交易费优惠。开发者生态活跃度进一步巩固了平台粘性，支持面向商家群体的定制化应用开发。
