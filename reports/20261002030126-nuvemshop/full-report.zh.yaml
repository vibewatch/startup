  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 以可视化决策架构串联商户规模、融资历史、估值倍数压缩与投资承保结论。
    data:
      nodes:
        - label: 市场规模：100k+ 商户与 R$ 6.5B GMV
          detail: 稳居巴西与拉美地区 D2C 中小企业电商主导地位
        - label: 资本基础：Series E 累积融资超 $600M
          detail: 由 Insight Partners 与 Tiger Global 共同领投的机构股权底盘
