      - number: '1.4'
        title: 深度图表
        blocks:
          - type: callout
            title: 金融科技集成构筑平台护城河
            body: >-
              上线原生支付 (Nuvem Pago) 与嵌入式信贷 (Crédito Nuvemshop)，构成了 Nuvemshop 抵御跨国建站竞品的关键结构性护城河。公司免除 Nuvem Pago
              交易的平台手续费，并由专职反欺诈团队承保本土风险，以此获取商家支付利差并降低区域中小企业的流失率。
            calloutType: insight
            claimRefs:
              - CO004
              - CO005
              - CO009
          - type: callout
            title: 跨境规模化与商家毕业流失风险
            body: 尽管 Nuvemshop 依托逾 180,000 家网店主导拉美中小企业数字化赋能，但行业信息显示，谋求出海的高速成长型商家常受限于功能天花板，偶有向 Shopify 等全球生态迁移以获取多国货币与履约支持。
            calloutType: risk
            claimRefs:
              - CO003
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、目标品类与替代动态
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop 的核心目标市场聚焦于拉美微型及中小企业 (SMB) 的独立 DTC
              电商基础设施、全渠道建站赋能及嵌入式金融服务。该边界明确涵盖自建独立网店订阅软件、集成式交易结账系统、移动电商工具以及嵌入式支付路由。关键在于，其明确排除了 Mercado Libre 或 Amazon
              等第三方闭环平台的佣金支出、企业级 ERP 部署以及由第三方货运承运商承接的原始包裹履约执行。在拉美地区，独立网店的历史现状替代方案一直是平台店铺或 WhatsApp、Instagram
              私信等未集成的社交渠道销售。Nuvemshop 赋予商家自主权与品牌控制力，并提供低于传统多商家平台佣金的综合抽佣率，借此捕获交易流水，推动商家向独立品牌网店转型。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场测算视角、地域集中度与规模尽调
        blocks:
          - type: paragraph
            body: >-
              测算拉美数字商务赋能的市场机遇，需要将整体零售商务与软件可触达 GMV 以及厂商 SaaS 收入区分开来。最广泛的零售受众涵盖拉美逾 650 million
              名消费者，是全球增长最快的数字商务客群之一。在这一格局中，巴西构成核心地域支柱，仅 2025 年 Nuvemshop 商家群体在巴西产生的年化 DTC 商品交易总额 (GMV) 便超过 R$ 6.5
              billion，同比增长 35%。Nuvemshop 活跃商家基数已从 2020 年初的 20,000 家，扩充至巴西逾 100,000 家活跃 DTC 商家，以及覆盖巴西、阿根廷、墨西哥、哥伦比亚和智利的超
              180,000 家品牌安装量。可服务软件支出受限于当地商家相较北美基准更低的平均软件付费意愿，基础建站订阅定价以每月约 $59 的低平价起步，并配有入门级免费建站方案，因而高度依赖嵌入式支付 (Nuvem
              Pago) 与信贷方案的搭售率。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
