  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    summary: 梳理商家从初始建站入驻、支付与物流集成，逐步发展至大企业规模或平台迁移的进阶演进历程。
    data:
      items:
        - label: 网店搭建入驻
          detail: 创业者无需编写代码，利用预置主题、区块编辑器及商品目录模块即可搭建响应式网页网店。
        - label: 支付功能集成
          detail: 接入 Nuvem Pago，支持 Pix 与银行卡交易处理，享受免交易手续费政策与一体化收银台体验。
        - label: 物流履约配送
          detail: 启用原生承运商连接器（Nuvem Envio）及订单管理工作流，实现区域内物流履约。
        - label: 多渠道商业扩张
          detail: 跨 Instagram、Facebook、TikTok 及 Mercado Livre 等主流电商平台实现多渠道库存同步。
        - label: 开发者高级定制
          detail: 成熟商家利用 REST API 及 NubeSDK 开发者工具，实现定制化主题与 ERP 连接器对接。
        - label: 规模跃升或平台迁移
          detail: 商家要么升级至 Nuvemshop Next 顾问级服务阶梯，要么遭遇技术瓶颈转而迁移至 Shopify Plus。
