  - id: FE001
    title: Nuvemshop 多层产品与技术架构
    type: stack
    summary: 对 Nuvemshop 核心商务引擎在表现层、扩展层、商务逻辑层与结算层的结构性解构。
    data:
      layers:
        - label: 网店与前端体验层
          detail: 动态多主题模板，内置自动化 SEO、WebP 图片分发及 fetchpriority 预加载标签
        - label: 客户端可扩展层
          detail: LoadCheckoutPaymentContext JavaScript SDK 执行透明令牌化表单与模态弹窗结账
        - label: 商务应用核心层
          detail: 多租户 REST API 集群，负责管理商品变体、库存矩阵、目录架构及订单
        - label: 生态系统与集成层
          detail: OAuth 2.0 授权的合作伙伴应用、企业级 ERP/WMS Webhook 及售前工程 PoC
        - label: 金融结算层
          detail: 令牌化 PSP 支付网关（含 Nuvem Pago 与本地 Pix）及欺诈风险缓解管控
        - label: 基础设施与托管基石
          detail: 多区域云基础设施、边缘 CDN 缓存及自动化 TLS / 重定向管理
    approximationNotes: 呈现基于已公开开发者文档、招聘启事及技术迁移测评提炼的概念性架构分层。
