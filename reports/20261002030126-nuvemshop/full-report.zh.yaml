        title: 收入架构可见，但收入结构未披露
        blocks:
          - type: paragraph
            body: >-
              现有证据支持其为订阅主导的商务软件模式，但无法推导出量化的收入拆解。Multiples 将 Nuvemshop 的收入模式界定为订阅制，并分别提及历史订阅费与交易费，而 Tracxn
              则描述了涵盖建站、自营支付、物流运输及应用生态的更广泛产品矩阵。官方登录页面亦证实其运营合作以商家店铺为中心。这些来源共同勾勒出多条可信的变现途径，但并未披露当前的标价、实际折扣、支付抽成率、物流经济模型、应用分成比例或收入确认政策。因此，收入来源表将已验证产品与未获证实的变现手段区分开来，而非将每款产品都视作已独立证实的收入流。
