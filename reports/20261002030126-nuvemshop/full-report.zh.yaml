      - number: '1.2'
        title: 创始人团队、治理架构与风控管理层
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop 由联合创始人 Santiago Sosa、Alejandro Alfonso、Alejandro Vázquez、Martín Palombo 与 Jose Abuchaem 共同创立
              [CO007]。核心管理层由联合创始人兼首席执行官 Santiago Sosa、联合创始人兼总裁 Alejandro Alfonso 以及首席运营官 Nicolas Loreti 坐镇
              [CO008]。为支持持续扩张的支付与信贷基础设施业务，Nuvemshop 任命 Rafael Yudi Kadomoto 担任反欺诈与风险管理总监，主管 Nuvem Pago
              的安全与风险控制；后者在巴西的交易规模迅速扩大 [CO009]。尽管初创领导层保障了运营延续性与深厚的本土行业积累，但 Nuvemshop
              跨拉美五个主权司法管辖区的扩张给核心高管团队带来了运营复杂度与关键人员依赖风险 [CO010]。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
