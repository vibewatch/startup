      - number: '1.3'
        title: 资本结构、估值演变与增长权衡
        blocks:
          - type: paragraph
            body: >-
              在 2021 年 8 月融资后，Nuvemshop 一级市场估值达到 $3.1 billion，累计风险投资与成长期股权融资额约为 $627 million 至 $628.4 million
              [CO011]。第三方基准估算其年收入在 $75 million 至 $130 million 之间，但经审计企业财务数据与合并 ARR 指标仍未公开，各市场观察机构的估算存在显著差异
              [CO012]。公司在圣保罗、布宜诺斯艾利斯各运营中心及区域办公室的员工总数在 850 至 1,064 人之间 [CO013]。尽管 Nuvemshop
              在拉美本土化中小企业电商领域保持明确领先地位，但行业监测指出，具备国际扩张诉求的大型商家受制于其架构瓶颈，在跨境业务规模扩大时偶有向 Shopify 等全球平台迁移的情况 [CO014]。
