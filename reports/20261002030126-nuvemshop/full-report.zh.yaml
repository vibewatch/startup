            body: >-
              第三方机构对收入的估算难以调和。Growjo 估计其年收入为 $75 million，而 LeadIQ 在 2026 年 8 月给出的预估仅为 $1 million 至 $10
              million。两者差距过大，无法求取平均值或折算为 ARR 指标，尤其鉴于两家机构均未提供经审计账目、合并报表范围或一致的报告期定义。指定证据库同样未披露当期实际定价、客户获取成本
              (CAC)、投资回收期、净留存率、毛利率、支付坏账损失、营运资金或资本支出。合乎逻辑的定性是存在重大不确定性，而非主观建模折中。因此，定价与单体经济模型图表如实保留了公开估算，并将缺失的企业经营数据标注为需管理层提供凭证的尽调盲区。
