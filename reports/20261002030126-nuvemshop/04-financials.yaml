company:
  name: "Nuvemshop"
chapter:
  number: 4
  title: "Financials"
  summary: "Nuvemshop shows substantial merchant activity, including company-reported 2025 Brazilian GMV of R$6.5 billion, but GMV is not company revenue. Conflicting third-party revenue estimates and the absence of audited revenue, margins, cash, burn, and unit economics prevent reliable financial underwriting from public evidence."
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture is visible, but revenue mix is not"
    body: >-
      The available evidence supports a subscription-led commerce-software model, not a
      quantified revenue build. Multiples labels Nuvemshop's revenue model as subscription
      and separately describes historical subscription and transaction fees, while Tracxn
      describes a broader product set spanning the storefront, proprietary payments,
      shipping logistics, and an app ecosystem. The official login page also confirms that
      the operating relationship is organized around merchant stores. Together, these
      sources establish several plausible monetization surfaces, but they do not disclose
      current list prices, realized discounts, payment take rates, logistics economics, app
      revenue sharing, or revenue recognition policy. The revenue-stream table therefore
      distinguishes verified products from unverified monetization rather than treating
      every product as a separately proven revenue stream.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "traction-versus-revenue"
    title: "Merchant activity is strong evidence of platform use, not corporate revenue"
    body: >-
      Nuvemshop's August 2026 Radar reports more than 100,000 active Brazilian stores in
      its transactional dataset. The same company-issued source reports R$6.5 billion of
      merchant GMV in 2025, 35% growth from 2024, and 2.81 million paid orders in August
      2026. These measures indicate meaningful commerce activity, but the denominator is
      merchant transactions: they are neither Nuvemshop revenue nor ARR, and the public
      evidence does not provide the conversion from GMV to recognized revenue. Apps Run
      The World's observed customer set is heavily weighted toward organizations with
      0-100 employees, offering a directional SMB-segment signal rather than a complete or
      representative customer census. Public traction is therefore useful for validating
      platform use, but insufficient for estimating revenue quality or customer economics.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI003"
  - id: "pricing-and-unit-economics"
    title: "Conflicting estimates expose the core underwriting gap"
    body: >-
      Third-party revenue estimates are not reconcilable. Growjo estimates annual revenue
      at $75 million, whereas LeadIQ gives an August 2026 estimate of only $1 million to
      $10 million. The difference is too large to average or convert into an ARR proxy,
      especially because neither source supplies audited accounts, a reporting perimeter,
      or a consistent period definition. The assigned evidence also does not disclose
      current realized pricing, merchant acquisition cost, payback, net retention, gross
      margin, payment losses, working capital, or capital expenditure. The appropriate
      interpretation is uncertainty, not a modeled midpoint. Pricing and unit-economics
      exhibits accordingly preserve the reported estimates and mark unavailable company
      economics as gaps requiring management data.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy"
    title: "Historical funding does not establish present liquidity"
    body: >-
      Independent databases place cumulative funding at $628 million and $632 million,
      reflecting a modest coverage difference rather than proof of a current cash balance.
      They consistently identify the major historical event as a $500 million Series E in
      August 2021 at a $3.1 billion post-money valuation. Forge currently shows limited
      market activity and no Forge Price for Nuvemshop, so that 2021 valuation is not a
      current liquidity benchmark. More importantly, capital raised is not cash available:
      none of the assigned sources provides current cash, monthly burn, runway, debt,
      payment-loss reserves, or financing obligations. The financial verdict is therefore
      diligence-dependent. Historical capitalization demonstrates access to capital in
      2021, but present capital adequacy and a credible margin path cannot be underwritten
      without audited statements and a current balance-sheet package.
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Do not convert GMV into revenue without a disclosed take rate"
    body: "The R$6.5 billion 2025 figure is merchant GMV. No retained source discloses the share captured as Nuvemshop revenue, so it cannot support an ARR, revenue, or gross-profit estimate."
    claimRefs:
      - "CI006"
      - "CI012"
  - calloutType: "recommendation"
    title: "Require audited financial and cohort data before pricing an investment"
    body: "Obtain audited revenue by product and geography, gross margin by software and payments, merchant cohorts, CAC and payback, cash, burn, debt, and payment-loss reserves before relying on historical valuation or third-party revenue estimates."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI015"
      - "CI016"
