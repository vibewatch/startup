      - "Downside Triggers & Key Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Merchant GMV expands >40% CAGR; Nuvem Pago take rate reaches 2.5%; revenue hits $300M+"
        - "$3.0B - $3.6B valuation based on 10x-12x ARR multiple in a successful U.S. public market listing"
        - "Severe Brazilian inflation or currency devaluation choking consumer discretionary spending"
        - "25% (Requires rapid fintech take-rate scaling and successful Mexico/Colombia expansion)"
      - - "Base Case"
        - "GMV grows 25-30% CAGR; revenue reaches $180M-$220M; stable core merchant retention in Brazil"
        - "$1.8B - $2.2B valuation based on 9x-10x normalized SaaS/fintech blended revenue multiple"
        - "Compression of payment take rates due to aggressive merchant acquiring competition"
        - "50% (Reflects current market growth and stable 1,000+ employee operating structure)"
      - - "Bear Case"
        - "Micro-merchant churn accelerates; take rates stall below 1.5%; revenue stagnates near $100M-$120M"
        - "$800M - $1.2B valuation based on 7x-8x distressed private transaction multiple"
        - "Significant payment fraud losses or regulatory tightening on installment credit rails"
        - "25% (Risk heightened if primary capital is required in an illiquid venture environment)"
    notes: "Scenario analysis models forward revenue and valuation multiples against historical $3.1B peak benchmark and peer software trading multiples."
    claimRefs:
