      - - "Capital & Liquidity Buffer"
        - "Over $600M in cumulative capital raised provides operational runway without debt overhang"
        - "Multi-year funding hiatus since 2021 Series E may conceal internal down-round dynamics"
        - "Transparent pre-IPO institutional primary round establishing a clean capital structure"
    notes: "Pillars contrast strategic commercial advantages against operational and financial risks identified across diligence sources."
