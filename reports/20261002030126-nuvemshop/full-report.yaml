chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2011 and headquartered in São Paulo, Brazil, Nuvemshop operates as a primary e-commerce
              software-as-a-service infrastructure provider across Latin America [CO001]. The platform enables micro,
              small, and medium-sized enterprises (SMBs) as well as direct-to-consumer brands to establish independent
              digital storefronts, integrate point-of-sale systems, and orchestrate multichannel sales across mobile
              messaging and social channels [CO002]. Operating under the Tiendanube brand in Spanish-speaking markets
              including Argentina, Mexico, Colombia, and Chile, the company supports a regional customer base reported
              at over 180,000 active brands [CO003]. The company monetizes through tiered software subscription fees
              starting at R$ 59 per month alongside variable payment processing and financial services fees [CO004].
              Nuvemshop has systematically expanded beyond core storefront hosting into an integrated operational stack
              featuring native payments via Nuvem Pago, shipping aggregation via Nuvem Envio, working capital through
              Crédito Nuvemshop, and conversational automation with Nuvem Chat and its Lumi artificial intelligence
              module [CO005]. In Brazil alone, the platform processed approximately R$ 6.5 billion in online transaction
              volume during 2025 as digital commerce matured [CO006].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
