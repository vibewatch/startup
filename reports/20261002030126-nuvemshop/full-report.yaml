  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronology of Nuvemshop's foundational, financing, product, risk governance, and scale milestones from inception
      in 2011 to 2026.
    data:
      items:
        - label: Founding in Argentina
          detail: >-
            Santiago Sosa, Alejandro Alfonso, Alejandro Vázquez, Martín Palombo, and Jose Abuchaem establish the company
            in 2011 to build e-commerce infrastructure for Latin American SMBs.
          date: '2011'
          tone: neutral
        - label: Headquarters and Brazilian Scale
          detail: >-
            Establishes primary operational headquarters in São Paulo, Brazil, anchoring Portuguese language support and
            local banking integrations.
          date: '2015'
          tone: positive
        - label: Launch of Nuvem Pago
          detail: >-
            Launches proprietary payment gateway Nuvem Pago, eliminating per-transaction platform fees and capturing
            payment processing revenue.
          date: '2021'
          tone: positive
        - label: Unicorn Financing Round
          detail: >-
            Secures $500M in Series E funding at a $3.1B post-money valuation, bringing cumulative raised capital to
            over $627M.
          date: 2021-08
          tone: positive
        - label: Risk Leadership Appointment
          detail: >-
            Appoints former iFood/OLX risk executive Rafael Yudi Kadomoto as Director of Fraud Prevention and Risk
            Management following R$ 640M in Nuvem Pago Brazilian processing.
          date: 2023-02
          tone: neutral
        - label: Multinational Enterprise Footprint
          detail: >-
            Secures enterprise client deployments including Jack Links Brazil and Bayonne Cosmeticos across
            manufacturing and consumer segments.
          date: '2024'
          tone: positive
        - label: GMV Record in Brazil
          detail: >-
            Processes R$ 6.5 billion in annual online sales in Brazil alone across thousands of merchants, with beauty
            sales reaching R$ 791M.
          date: '2025'
          tone: positive
        - label: Multichannel and AI Ecosystem
          detail: >-
            Reaches active base of 180,000+ brands with Lumi AI analytics and Nuvem Chat conversational commerce via
            WhatsApp deployed across Brazil and Latin America.
          date: '2026'
          tone: positive
