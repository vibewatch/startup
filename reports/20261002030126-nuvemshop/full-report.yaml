              - CU011
              - CU016
      - number: '6.3'
        title: Named Customer Proof, Retention Vulnerabilities, and Expansion Friction
        blocks:
          - type: paragraph
            body: >-
              Public customer deployments demonstrate production adoption across diverse corporate scales, ranging from
              boutique retailers to established industrial enterprises. Independent technographic registries document
              production storefront deployments by Jack Links Brazil (700 employees; $80.0M revenue) in consumer
              packaged goods, Bayonne Cosmeticos (300 employees; $30.0M revenue) in chemical products, Bison Industria
              De Calcados (250 employees; $25.0M revenue) in footwear manufacturing, and Conexfit Brazil in fitness
              apparel. These accounts utilize Nuvemshop as their primary web-based catalog management, checkout
              orchestration, and order fulfillment system. Despite these enterprise references, merchant durability
              faces structural headwinds. While Nuvemshop provides localized Portuguese support and native Nuvem Pago
              and Nuvem Envio integrations, fast-growing Latin American brands frequently face technical ceilings,
              causing successful high-volume merchants to migrate to Shopify Plus as cross-border and complex
              omnichannel requirements outstrip Nuvemshop's regional infrastructure.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU012
