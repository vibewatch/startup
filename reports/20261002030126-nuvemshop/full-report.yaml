  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Categories, and Substitution Dynamics
        blocks:
          - type: paragraph
            body: >-
              The core addressable market for Nuvemshop centers on independent direct-to-consumer (D2C) e-commerce
              infrastructure, omnichannel storefront enablement, and embedded financial services for micro, small, and
              medium-sized enterprises (SMBs) in Latin America. This boundary explicitly encompasses subscription
              software for proprietary web storefronts, integrated transactional checkout systems, mobile commerce
              tooling, and embedded payment routing. Crucially, it excludes closed third-party marketplace commission
              spend on platforms like Mercado Libre or Amazon, enterprise ERP rollouts, and raw parcel fulfillment
              execution handled by third-party freight carriers. In Latin America, the status-quo substitute for a
              dedicated e-commerce store has historically been selling via marketplace listings or unintegrated social
              channels such as WhatsApp and Instagram direct messaging. Nuvemshop captures transaction volume by
              offering merchant autonomy, brand control, and lower aggregate take rates than traditional multi-vendor
              marketplace commissions, driving merchants toward dedicated branded storefronts.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses, Geographic Concentration, and Sizing Diligence
        blocks:
          - type: paragraph
            body: >-
              Sizing the Latin American digital commerce enablement opportunity requires disentangling overall retail
              commerce from software-addressable GMV and vendor SaaS revenues. The broadest retail population spans over
              650 million consumers across Latin America, representing one of the fastest-growing digital commerce
              demographics globally. Within this landscape, Brazil forms the primary geographic anchor, generating over
              R$ 6.5 billion in annualized D2C gross merchandise volume (GMV) across Nuvemshop's merchant cohort in 2025
              alone, representing 35% year-over-year expansion. Nuvemshop's active merchant base has scaled from 20,000
              stores at the beginning of 2020 to over 100,000 active D2C merchants in Brazil and more than 180,000 brand
              installations across Brazil, Argentina, Mexico, Colombia, and Chile. The serviceable software spend is
              constrained by lower average merchant software willingness-to-pay compared to North American benchmarks,
              with base storefront subscription price points starting at modest flat rates around $59 monthly alongside
              entry-tier free storefront offerings, necessitating high attach rates on embedded payments (Nuvem Pago)
              and credit solutions.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
