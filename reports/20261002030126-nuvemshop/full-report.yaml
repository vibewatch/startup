        title: Capitalization, Valuation, and Growth Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop reached a private market valuation of $3.1 billion following its August 2021 funding round, with
              cumulative venture and growth financing reaching approximately $627 million to $628.4 million [CO011].
              Third-party benchmarks estimate annual revenues between $75 million and $130 million, although audited
