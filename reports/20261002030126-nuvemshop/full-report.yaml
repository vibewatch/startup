  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Commerce Platform and Merchant Workflow Architecture
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop (operating as Tiendanube in Spanish-speaking Latin American markets) provides SMB merchants with
              a turnkey software-as-a-service infrastructure covering the complete retail lifecycle, including
              storefront catalog hosting, checkout orchestration, payment routing, and inventory management. The
              platform abstracts operational complexity by provisioning automated sitemaps, native robots.txt crawling
              directives, managed TLS/HTTPS certificates, canonical domain redirects, and per-entity search engine
              optimization metadata across products and categories without requiring merchant server management.
              However, merchant reliance on uncurated third-party theme components and unoptimized tracking add-ons
              frequently introduces acute client-side performance degradation. Independent audits demonstrate that
              storefronts utilizing dynamic multi-module homepages accumulate significant payload weight, with
              unoptimized stores downloading up to 3.3 MB of HTML and executing 150 client scripts across 120 embedded
              product blocks, resulting in mobile Largest Contentful Paint (LCP) delays as severe as 12.2 seconds. While
              the dashboard simplifies day-to-day catalog maintenance, non-technical store operators face persistent
              operational friction when addressing technical on-page deficiencies such as client-side JavaScript
              navigation menus that impede search engine spider traversal.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
