      - number: '3.3'
        title: Pricing evidence and moat durability
        blocks:
          - type: paragraph
            body: >
              Current pricing evidence is directionally useful but not normalized. TrustRadius lists three Nuvemshop
              plans from "$59" to "$389" and also lists a free version and free trial, whereas GetApp explicitly reports
              a Brazilian starting price of R$59 per month plus a free plan and free trial. Because the TrustRadius
              extract does not resolve the currency symbol, the two records cannot be treated as equivalent
              dollar-denominated prices. TrustRadius also lists low entry prices for Wix, Ecwid, and Big Cartel, but the
              extract does not establish equivalent feature bundles, transaction fees, taxes, contract terms, or
              regional availability. Durability therefore rests less on headline subscription price than on whether
              localization and integrated workflows offset Shopify's larger global ecosystem. The adverse case is clear
              but unquantified: merchants prioritizing international reach may prefer Shopify, while regional workflow
              depth favors Nuvemshop.
