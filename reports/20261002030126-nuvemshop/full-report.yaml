  - id: FE001
    title: Nuvemshop Multi-Layer Product and Technology Architecture
    type: stack
    summary: >-
      Structural decomposition of Nuvemshop's core commerce engine across presentation, extension, commerce logic, and
      settlement layers.
    data:
      layers:
        - label: Storefront & Experience Layer
          detail: Dynamic multi-theme templates with automated SEO, WebP image delivery, and fetchpriority preload tags
        - label: Client Extensibility Layer
          detail: LoadCheckoutPaymentContext JavaScript SDK executing transparent tokenized forms and modal checkouts
        - label: Commerce Application Core
          detail: Multi-tenant REST API cluster managing product variants, inventory matrices, catalog schemas, and orders
        - label: Ecosystem & Integration Layer
          detail: OAuth 2.0 authorized partner apps, enterprise ERP/WMS webhooks, and sales engineering PoCs
        - label: Financial Settlement Layer
          detail: Tokenized PSP payment gateways (including Nuvem Pago and regional Pix) and fraud mitigation controls
        - label: Infrastructure & Hosting Foundation
          detail: Multi-region cloud infrastructure, edge CDN caching, and automated TLS/redirect management
    approximationNotes: >-
      Represents conceptual architectural layering derived from published developer documentation, job disclosures, and
      migration benchmarks.
    claimRefs:
      - CE001
      - CE007
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Merchant progression from initial storefront onboarding through payment and logistics adoption to enterprise scale
      or platform migration.
    data:
      items:
        - label: Storefront Creation
          detail: >-
            Entrepreneurs launch responsive web storefronts using pre-built themes, section editors, and product catalog
            modules without coding.
        - label: Payment Integration
          detail: >-
            Adoption of Nuvem Pago to enable Pix and card processing with zero transaction fee penalties and integrated
            checkout.
        - label: Logistics Fulfillment
          detail: >-
            Activation of native shipping carrier connectors (Nuvem Envio) and order management workflows for regional
            delivery.
        - label: Commercial Expansion
          detail: Multi-channel inventory synchronization across Instagram, Facebook, TikTok, and Mercado Livre marketplaces.
        - label: Developer Customization
          detail: Advanced merchants implement custom themes and ERP connectors via REST API and NubeSDK developer tools.
        - label: Scale or Migration
          detail: >-
            Merchants either scale to Nuvemshop Next consulting tiers or face technical ceilings and migrate to Shopify
            Plus.
    approximationNotes: >-
      Progression stages represent typical merchant maturity patterns identified in ecosystem documentation and
      competitive platform analysis.
    claimRefs:
      - CU010
      - CU011
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative residual-risk view that keeps likelihood unknown when the assigned pool lacks frequency or
      control-effectiveness evidence.
    data:
      columns:
        - label: Potential impact
          detail: Consequence if the failure occurs
        - label: Likelihood evidence
          detail: What the assigned public pool establishes
        - label: Mitigation maturity
          detail: Publicly observable controls only
        - label: Residual assessment
          detail: Evidence-bounded underwriting view
      rows:
        - label: Payment fraud / loss
          values:
            - label: High
              note: Merchant-critical payment activity
              tone: critical
            - label: Not quantified
              note: No fraud-loss cohort
              tone: neutral
            - label: Partial
              note: Named risk leader; effectiveness unknown
              tone: warning
            - label: Unresolved
              note: Requires loss and reserve data
              tone: warning
        - label: Payments regulation
          values:
            - label: High
              note: Restrictions could impair payment operations
              tone: critical
            - label: Not established
              note: No regulator record retained
              tone: neutral
            - label: Not verified
              note: No compliance audit retained
              tone: warning
            - label: Unresolved
              note: Primary regulatory diligence required
              tone: warning
        - label: Service availability
          values:
            - label: High
              note: Orders, payments, shipments, and inventory are exposed
              tone: critical
            - label: Not quantified
              note: No uptime or incident series
              tone: neutral
            - label: Not verified
              note: No SLA or recovery test
              tone: warning
            - label: Unresolved
              note: Peak-period reliability is a kill criterion
              tone: warning
        - label: Merchant account access
          values:
            - label: High
              note: Access is linked to a store email
              tone: critical
            - label: Not quantified
              note: No takeover or lockout statistics
              tone: neutral
            - label: Not verified
              note: No MFA or recovery metrics
              tone: warning
            - label: Unresolved
              note: Control coverage must be diligenced
              tone: warning
        - label: Financial transparency
          values:
            - label: Medium to high
              note: Conflicting revenue inputs impair underwriting
              tone: warning
            - label: Observed conflict
              note: $75M and $126M third-party figures
              tone: warning
            - label: Not verified
              note: No audited revenue retained
              tone: warning
            - label: Unresolved
              note: Audited financials required
              tone: warning
        - label: Secondary liquidity
          values:
            - label: Medium to high
              note: Affects financing and employee liquidity
              tone: warning
            - label: Limited activity
              note: No displayed matched price
              tone: warning
            - label: Not evidenced
              note: No current tender or transaction
              tone: neutral
            - label: Elevated uncertainty
              note: 2021 valuation is stale
              tone: warning
    approximationNotes: >-
      Ordinal assessments are not probabilities. Impact reflects evidenced workflow criticality; likelihood remains
