      - number: '3.2'
        title: Capability differentiation and switching friction
        blocks:
          - type: paragraph
            body: >
              Nuvemshop's defensible layer is the integration of a storefront with local payment, shipping, installment,
              ERP, marketplace, and social-commerce workflows. GetApp describes integrations with dozens of ERP,
              freight, and marketplace tools, while Softwares.com emphasizes regional payments and carriers that global
              platforms can handle awkwardly. Apps Run The World's implementation records show the platform used for
              catalog, checkout, order, inventory, and fulfillment workflows across organizations of different sizes.
              That breadth can create operational switching friction because replacement affects multiple workflows, but
              no retained source quantifies migration cost, churn, contract lock-in, or multi-homing. Developer friction
              is also visible: Innovate built an independent CLI after encountering manual FTP uploads, full downloads,
              weak platform-specific validation, and hidden theme errors. This is evidence of ecosystem demand and
              tooling gaps, not proof of a proprietary moat or an official Nuvemshop capability.
