        blocks:
          - type: paragraph
            body: >-
              Independent databases place cumulative funding at $628 million and $632 million, reflecting a modest
              coverage difference rather than proof of a current cash balance. They consistently identify the major
              historical event as a $500 million Series E in August 2021 at a $3.1 billion post-money valuation. Forge
