              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: High-Volume Merchant Churn and International Migration Risk
            body: >-
              Nuvemshop maintains an exceptional competitive position among Latin American small businesses due to
              Portuguese support, local payment integrations (Pix, Nuvem Pago), and regional shipping networks. However,
              competitive intelligence indicates that successful high-growth merchants with international ambitions
              frequently outgrow Nuvemshop's localized architecture and migrate to platforms like Shopify Plus, capping
              long-term customer lifetime value.
            calloutType: risk
            claimRefs:
              - CU010
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence-bounded risk posture
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop sits inside merchant-critical workflows rather than serving only as a presentation layer. Its
              company-authored mobile listing says merchants can manage orders, accept payments, coordinate shipments,
              change inventory, and update products, while the login page shows that access is linked to a store email.
              Independent technographic records describe some deployments as the primary storefront or web-sales system.
              These observations make availability, account access, and transaction integrity the most directly
              evidenced operating risks. Severity is therefore highest where a failure could interrupt sales or payment
              activity, but likelihood is not scored as known: the assigned pool contains no uptime series, incident
              register, fraud-loss history, or control audit. Absence of such records in this pool is an evidence gap,
              not proof that no incident or enforcement action has occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and financial-model exposure
        blocks:
          - type: paragraph
            body: >-
              Payments create the clearest regulated-risk diligence path, but the available evidence is not a regulatory
              record. A 2023 article carrying Nuvemshop's announcement said a dedicated fraud-prevention and
              risk-management director would oversee Nuvem Pago security and reported R$640 million processed in Brazil
              during 2022. That is evidence of management attention and historical scale, not evidence of licensing
              status, loss rates, compliance effectiveness, or present control maturity. Data responsibility is
              similarly material because Nuvemshop says its Brazilian dataset covers more than 100,000 active stores and
              uses paid-order data in aggregated, anonymized form. No regulator, court, privacy audit, or legal docket
              appears in the assigned pool. Financial underwriting also remains fragile: Growjo estimates $75 million of
              annual revenue, while RocketReach reports $126 million for 2026, with neither figure presented as audited
              company revenue.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR015
      - number: '7.3'
        title: Operational and external-dependency risks
        blocks:
          - type: paragraph
            body: >-
              The operating surface spans mobile distribution, internet connectivity, authentication, merchant
              storefronts, payment processing, shipping coordination, and inventory control. The Google Play listing
              explicitly requires an internet connection, creating a visible dependency even though it does not disclose
              hosting architecture, app-store fallback, or recovery objectives. Nuvemshop's own August 2026 radar
              reports 2.81 million paid orders and a 50.53% Pix share in the observed Brazilian cohort; those are
              ecosystem activity metrics, not Nuvemshop revenue or proof of payment concentration across the whole
              company. Apps Run The World's named deployments show that some customers use Nuvemshop as their primary
              web-sales layer, but its partial database cannot establish total customer concentration. The retained Yolo
              jobs page did not expose role-level evidence in the prefetched text, so it cannot support conclusions
              about staffing sufficiency or execution capacity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Publicly evidenced mitigation is narrow: the 2023 appointment places named leadership against Nuvem Pago
              fraud and security, and the Radar methodology says the published transaction analysis is aggregated and
              anonymized. Neither item proves current control effectiveness. Investment monitoring should therefore
              require primary evidence rather than fixed thresholds invented from public data. A validated prolonged
              outage that prevents merchants from operating order, payment, shipment, or inventory workflows during a
              peak period would break the reliability thesis. Other kill criteria are a material regulator restriction
              on payments, fraud losses that make payment economics structurally negative, or a financing/secondary
              transaction that demonstrates severe impairment relative to the last-known $3.1 billion 2021 valuation.
              The current Forge page shows limited activity and no displayed matched price, so it establishes
              illiquidity and stale price discovery, not a current valuation or a quantified write-down.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Nuvemshop rests on its entrenched market position as the dominant
              white-label direct-to-consumer e-commerce platform across Spanish- and Portuguese-speaking Latin America.
              By providing modular storefront tools, localized checkout integrations, native logistics routing, and
              embedded fintech via Nuvem Pago, Nuvemshop enables micro, small, and medium businesses to bypass
              marketplace commoditization. In Brazil alone, network merchants generated R$ 6.5 billion in GMV across
              100,000 active storefronts in 2025, expanding by 35% year over year and processing 2.81 million orders in
              August 2026. Conversely, the anti-thesis centers on the structural opacity of platform take rates,
              macroeconomic exposure in core Southern Cone and Andean markets, and the severe lack of audited income
              statements. Without primary verification of software subscription ARR versus transactional payments
              margin, investors cannot confirm whether merchant GMV growth translates into durable platform operating
              cash flow.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
      - number: '8.2'
        title: Capitalization History, Preference Overhang, and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Nuvemshop's capital structure is anchored by more than $600 million to $628.4 million in cumulative
              venture capital and growth equity funding raised across multiple institutional rounds. The definitive
              primary pricing event occurred in August 2021, when the company secured a $500 million Series E financing
              co-led by Insight Partners and Tiger Global Management with participation from Alkeon Capital, Owl Rock,
              Sunley House Capital, VMG Partners, Accel, Kaszek Ventures, and Qualcomm Ventures. That transaction
              assigned Nuvemshop a post-money valuation of $3.1 billion, following a $90 million Series D closed five
              months earlier in March 2021. While private secondary tracking platforms such as Forge Global report
              limited secondary market activity without matched pricing benchmarks as of mid-2026, the absence of a
              refreshed primary financing round over the subsequent five-year cycle creates potential liquidation
              preference overhang and valuation disparity against prevailing SaaS public market multiples.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario Underwriting, Valuation Comps, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Underwriting Nuvemshop requires evaluating prospective entry valuations against public global benchmarks
              such as Shopify and localized e-commerce aggregators. With third-party estimates modeling Nuvemshop's
              annual revenue between $75 million and $130 million against a $3.1 billion peak post-money mark,
              historical multiples reached an aggressive 24x to 41x revenue, reflecting peak 2021 software exuberance.
              Even assuming forward revenue expansion to $200 million to $250 million supported by Nuvem Pago
              transaction take rates and logistics expansion, a normalized enterprise multiple of 8x to 12x implies a
              contemporary fair market valuation range of $1.6 billion to $2.5 billion. Exit readiness via a U.S.
              initial public offering remains a stated corporate aspiration but lacks formal S-1 registration or
              confidential filing disclosure. Consequently, formal underwriting demands direct access to audited IFRS
              revenue, Nuvem Pago interchange margins, cohort net revenue retention, and geographic contribution
              economics.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Stance: Research-More Pending Audited Financials'
            body: >-
              While Nuvemshop exhibits undeniable scale as Latin America's leading direct-to-consumer commerce operating
              system, committing primary capital at the unrefreshed $3.1 billion peak valuation poses downside repricing
              risk. Underwriters should adopt a research-more stance and require audited income statements, true
              take-rate realization, and Nuvem Pago gross margins before pricing secondary or pre-IPO equity.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV011
          - type: callout
            title: Five-Year Primary Valuation Gap and Multiple Compression Risk
            body: >-
              Nuvemshop has not completed a primary equity round since its August 2021 Series E at $3.1 billion. In an
              era where global commerce SaaS multiples contracted from over 30x forward revenue to 8x-12x, holding
              private equity marks static without independent audited revenue disclosures introduces material valuation
              vulnerability.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV010
