companyProfile:
  summary: >-
    Nuvemshop is a late-stage private commerce infrastructure company that helps SMBs and DTC brands in Latin America
    launch and run independent online stores, accept payments, coordinate shipping, and use adjacent software and
    financial services. The company operates under the Nuvemshop brand in Brazil and Tiendanube in Spanish-speaking
    markets, with its core value proposition built around localized e-commerce tooling rather than a marketplace model.
