figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Merchant progression from initial storefront onboarding through payment and logistics adoption to enterprise scale or platform migration."
    data:
      items:
        - label: "Storefront Creation"
          detail: "Entrepreneurs launch responsive web storefronts using pre-built themes, section editors, and product catalog modules without coding."
        - label: "Payment Integration"
          detail: "Adoption of Nuvem Pago to enable Pix and card processing with zero transaction fee penalties and integrated checkout."
        - label: "Logistics Fulfillment"
          detail: "Activation of native shipping carrier connectors (Nuvem Envio) and order management workflows for regional delivery."
        - label: "Commercial Expansion"
          detail: "Multi-channel inventory synchronization across Instagram, Facebook, TikTok, and Mercado Livre marketplaces."
        - label: "Developer Customization"
          detail: "Advanced merchants implement custom themes and ERP connectors via REST API and NubeSDK developer tools."
        - label: "Scale or Migration"
          detail: "Merchants either scale to Nuvemshop Next consulting tiers or face technical ceilings and migrate to Shopify Plus."
    approximationNotes: "Progression stages represent typical merchant maturity patterns identified in ecosystem documentation and competitive platform analysis."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU016"
callouts:
  - calloutType: "risk"
    title: "High-Volume Merchant Churn and International Migration Risk"
    body: "Nuvemshop maintains an exceptional competitive position among Latin American small businesses due to Portuguese support, local payment integrations (Pix, Nuvem Pago), and regional shipping networks. However, competitive intelligence indicates that successful high-growth merchants with international ambitions frequently outgrow Nuvemshop's localized architecture and migrate to platforms like Shopify Plus, capping long-term customer lifetime value."
    claimRefs:
      - "CU010"
      - "CU016"
