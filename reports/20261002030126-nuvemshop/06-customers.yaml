chapter:
  number: 6
  title: "Customers"
  summary: "Nuvemshop powers over 180,000 active merchant brands across Latin America with heavy operational concentration in Brazilian SMB and direct-to-consumer retail. While enterprise brand examples and vertical diversification exist, merchant retention remains vulnerable to low-end churn and international platform migration."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Geographic Focus"
    body: "Nuvemshop's customer base is heavily concentrated in Latin America, primarily serving Brazilian micro, small, and medium-sized enterprises (SMBs) selling direct-to-consumer. According to platform disclosures and ecosystem metrics, the platform supports over 180,000 active merchant brands across Brazil, Argentina, Mexico, Colombia, and Chile. The merchant profile is overwhelmingly small-scale: independent technographic evaluations indicate that over 80% of tracked customer accounts have fewer than 100 employees, while mid-sized commercial organizations with 101 to 1,000 employees constitute approximately 19% of the base. Core merchant verticals center on high-velocity consumer goods, specifically fashion, health and beauty, footwear, and consumer packaged goods. Geographic scale remains substantially anchored in Brazil, where more than 100,000 active D2C digital storefronts generated over R$ 6.5 billion in gross merchant volume during 2025 across all 27 Brazilian federative units."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-scale"
    title: "Adoption Trajectory and Transactional Scale"
    body: "Transaction and GMV throughput across the merchant cohort demonstrate steady commercial expansion alongside increasing native financial services adoption. In Brazil, Nuvemshop's merchant network captured 2.81 million orders in August 2026 alone, achieving an average order ticket of R$ 288.04. Platform GMV grew by 50.3% year-over-year in August 2026, driven by retail seasonality such as Father's Day campaigns where beauty sales surged 74.4% and jewelry sales increased 57.1%. Furthermore, over 12 million unique Brazilian consumers completed purchases on Nuvemshop storefronts during 2025. Payment processing integration represents an increasingly critical adoption surface: instant payments via Pix accounted for 50.53% of all Brazilian storefront orders in August 2026, with merchants utilizing Nuvem Pago benefiting from transaction fee exemptions. Developer ecosystem activity further reinforces adoption, supporting custom application development across the merchant base."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-durability-risks"
    title: "Named Customer Proof, Retention Vulnerabilities, and Expansion Friction"
    body: "Public customer deployments demonstrate production adoption across diverse corporate scales, ranging from boutique retailers to established industrial enterprises. Independent technographic registries document production storefront deployments by Jack Links Brazil (700 employees; $80.0M revenue) in consumer packaged goods, Bayonne Cosmeticos (300 employees; $30.0M revenue) in chemical products, Bison Industria De Calcados (250 employees; $25.0M revenue) in footwear manufacturing, and Conexfit Brazil in fitness apparel. These accounts utilize Nuvemshop as their primary web-based catalog management, checkout orchestration, and order fulfillment system. Despite these enterprise references, merchant durability faces structural headwinds. While Nuvemshop provides localized Portuguese support and native Nuvem Pago and Nuvem Envio integrations, fast-growing Latin American brands frequently face technical ceilings, causing successful high-volume merchants to migrate to Shopify Plus as cross-border and complex omnichannel requirements outstrip Nuvemshop's regional infrastructure."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
