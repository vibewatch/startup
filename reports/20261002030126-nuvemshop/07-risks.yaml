chapter:
  number: 7
  title: "Risks"
  summary: "The strongest evidenced risks are operational concentration in merchant-critical order, payment, shipment, inventory, and access workflows; unquantified Nuvem Pago fraud exposure; and financial opacity created by conflicting revenue estimates and a stale 2021 valuation reference. The assigned evidence does not establish Nuvemshop's current regulatory, litigation, security-incident, outage, or customer-concentration posture, so those items remain explicit diligence gaps rather than asserted events."
sections:
  - id: "risk-posture"
    title: "Evidence-bounded risk posture"
    body: >-
      Nuvemshop sits inside merchant-critical workflows rather than serving only as a
      presentation layer. Its company-authored mobile listing says merchants can manage
      orders, accept payments, coordinate shipments, change inventory, and update products,
      while the login page shows that access is linked to a store email. Independent
      technographic records describe some deployments as the primary storefront or web-sales
      system. These observations make availability, account access, and transaction integrity
      the most directly evidenced operating risks. Severity is therefore highest where a
      failure could interrupt sales or payment activity, but likelihood is not scored as known:
      the assigned pool contains no uptime series, incident register, fraud-loss history, or
      control audit. Absence of such records in this pool is an evidence gap, not proof that no
      incident or enforcement action has occurred.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-financial"
    title: "Regulatory, legal, and financial-model exposure"
    body: >-
      Payments create the clearest regulated-risk diligence path, but the available evidence
      is not a regulatory record. A 2023 article carrying Nuvemshop's announcement said a
      dedicated fraud-prevention and risk-management director would oversee Nuvem Pago
      security and reported R$640 million processed in Brazil during 2022. That is evidence of
      management attention and historical scale, not evidence of licensing status, loss rates,
      compliance effectiveness, or present control maturity. Data responsibility is similarly
      material because Nuvemshop says its Brazilian dataset covers more than 100,000 active
      stores and uses paid-order data in aggregated, anonymized form. No regulator, court,
      privacy audit, or legal docket appears in the assigned pool. Financial underwriting also
      remains fragile: Growjo estimates $75 million of annual revenue, while RocketReach reports
      $126 million for 2026, with neither figure presented as audited company revenue.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-and-dependency"
    title: "Operational and external-dependency risks"
    body: >-
      The operating surface spans mobile distribution, internet connectivity, authentication,
      merchant storefronts, payment processing, shipping coordination, and inventory control.
      The Google Play listing explicitly requires an internet connection, creating a visible
      dependency even though it does not disclose hosting architecture, app-store fallback, or
      recovery objectives. Nuvemshop's own August 2026 radar reports 2.81 million paid orders
      and a 50.53% Pix share in the observed Brazilian cohort; those are ecosystem activity
      metrics, not Nuvemshop revenue or proof of payment concentration across the whole company.
      Apps Run The World's named deployments show that some customers use Nuvemshop as their
      primary web-sales layer, but its partial database cannot establish total customer
      concentration. The retained Yolo jobs page did not expose role-level evidence in the
      prefetched text, so it cannot support conclusions about staffing sufficiency or execution
      capacity.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR002"
      - "TR003"
  - id: "mitigations-and-kill-criteria"
    title: "Mitigations, monitoring, and thesis-break criteria"
    body: >-
      Publicly evidenced mitigation is narrow: the 2023 appointment places named leadership
      against Nuvem Pago fraud and security, and the Radar methodology says the published
      transaction analysis is aggregated and anonymized. Neither item proves current control
      effectiveness. Investment monitoring should therefore require primary evidence rather
      than fixed thresholds invented from public data. A validated prolonged outage that
      prevents merchants from operating order, payment, shipment, or inventory workflows during
      a peak period would break the reliability thesis. Other kill criteria are a material
      regulator restriction on payments, fraud losses that make payment economics structurally
      negative, or a financing/secondary transaction that demonstrates severe impairment
      relative to the last-known $3.1 billion 2021 valuation. The current Forge page shows
      limited activity and no displayed matched price, so it establishes illiquidity and stale
      price discovery, not a current valuation or a quantified write-down.
    claimRefs:
      - "CR001"
      - "CR008"
      - "CR009"
      - "CR012"
      - "CR013"
      - "CR014"
