callouts:
  - calloutType: "insight"
    title: "Pix and Installments as Competitive Moats"
    body: "Unlike North American e-commerce software where credit cards dominate single-payment checkouts, Latin American merchants face severe checkout abandonment if platforms fail to offer instant Pix rails in Brazil and multi-month installment options across credit cards. Native integration of these mechanisms forms an operational moat that generic international platforms struggle to match without third-party plugins."
    claimRefs:
      - "CM009"
      - "CM010"
  - calloutType: "risk"
    title: "Macroeconomic Sensitivity of SMB Merchant Base"
    body: "Nuvemshop's addressable market is concentrated among early-stage and micro-to-medium retailers whose consumer demand is acutely sensitive to regional purchasing power fluctuations, inflation, and interest rate shifts in Brazil and Argentina, introducing volatility into merchant GMV growth and subscription durability."
    claimRefs:
      - "CM013"
      - "CM014"
