callouts:
  - calloutType: "insight"
    title: "Fintech Integration as Platform Moat"
    body: "The rollout of native payments (Nuvem Pago) and embedded credit (Crédito Nuvemshop) represents Nuvemshop's critical structural moat against international storefront competitors. By waiving platform fees on Nuvem Pago transactions and underwriting local risk through dedicated fraud leadership, the company captures merchant payment margin while reducing churn among regional SMBs."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO009"
  - calloutType: "risk"
    title: "Cross-Border Scaling and Merchant Graduation Risk"
    body: "While Nuvemshop dominates regional Latin American SMB enablement with over 180,000 stores, market intelligence indicates that fast-growing merchants expanding internationally encounter functional ceilings, occasionally migrating to global ecosystems like Shopify for multinational currency and fulfillment support."
    claimRefs:
      - "CO003"
      - "CO014"
