  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation flows from real validation and fresh capital on the left to a commercialization and financing
      gap that still dominates underwriting on the right.
    data:
      nodes:
        - id: validation
          label: OEM / partner validation
          detail: Stellantis validated 77Ah FEST cells at 375Wh/kg and still targets a 2026 demonstration fleet.
        - id: scale-path
          label: Scale path is visible
          detail: Massachusetts manufacturing footprint and a partner-led model indicate a pathway to scale.
        - id: fresh-capital
          label: Fresh capital exists
          detail: The June 2026 public listing added new capital and created a current valuation marker.
        - id: revenue-gap
          label: Revenue proof is still missing
          detail: Public reporting cited by Troy Technical still showed zero operating revenue at June 30, 2026.
        - id: financing-risk
          label: Runway and downside remain finite
          detail: >-
            Publicly visible cash only supports operations through Q1 2028 and the record still includes legal and
            counterparty risk.
        - id: recommendation
          label: 'Recommendation: track / stretched'
          detail: Watch for commercial conversion or a cheaper entry rather than underwriting a buy call today.
      edges:
        - from: validation
          to: scale-path
          label: technical proof supports scale narrative
        - from: scale-path
          to: fresh-capital
          label: scale story supports financing access
        - from: fresh-capital
          to: revenue-gap
          label: capital alone does not prove commercialization
        - from: revenue-gap
          to: financing-risk
          label: commercial delay turns into dilution risk
        - from: financing-risk
          to: recommendation
          label: price discipline dominates today
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
