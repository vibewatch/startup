            - Solstice all-solid-state platform
          outputs:
            - Nearer-term validation track and longer-horizon chemistry upside
        - label: Cell design and performance proof
          items:
            - 77Ah automotive-size FEST cells
            - Anode-free lithium-metal / NMC architecture reported externally
          outputs:
            - 375Wh/kg, 600+ cycles, fast charge, thermal-range claims
        - label: Industrialization stack
          modules:
            - Methuen pre-production line
            - Existing lithium-ion equipment compatibility
