chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              Factorial is now a public, pre-commercial solid-state battery developer rather than a venture-funded lab
              project: the de-SPAC with Cartesian Growth Corporation III closed on June 5, 2026, the company renamed to
              Factorial Energy Inc., and the stock began trading under FAC. The company still fits an R&D-heavy
              commercialization stage because its joint development agreements remain outside revenue recognition and
              management says meaningful product revenue depends on finishing qualification, scaling manufacturing, and
              converting partner programs into commercial supply. Product positioning is consistent across the company
              website and filings: FEST, Solstice, and Gammatron are sold as higher-performance solid-state platforms
              for eMobility, defense, AI/robotics, and adjacent energy-storage use cases, with a partner-led
              manufacturing model rather than a stand-alone gigafactory buildout.
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              The operating identity still centers on the founding team. SEC materials name Siyu Huang and Alex Yu as
              the legacy founders and show the founders retaining 62.9% of total voting power through super-voting
              Series B shares after listing, which leaves public-market minority governance unusually concentrated for a
              newly listed industrial technology company. Leadership coverage is stronger than a two-founder bench alone
              because Joe Taylor fronts manufacturing scale and public-company signaling as executive chairman, while
              Mercedes-Benz and Stellantis each have board representation through investor designees. That said, this
              remains a key-person story: founder continuity, OEM-board alignment, and the willingness of strategic
              partners to keep funding or validating programs all matter disproportionately to execution.
            claimRefs:
              - CO003
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO010
              - CO015
              - CO016
      - number: '1.3'
        title: Capital base, footprint, and milestone path
        blocks:
          - type: paragraph
            body: >-
              Publicly visible capital and scale markers are meaningful but incomplete. Factorial disclosed a $200
              million Series D in January 2022 and roughly $112.1 million of gross de-SPAC and PIPE proceeds in June
              2026, yet the available public record still does not fully reconcile lifetime funding, current cash, or
              post-close diluted ownership. On the operating side, the company moved from pilot-language in 2022 to a
              Methuen manufacturing site in 2023 and partner-validated 77Ah FEST cells with Stellantis in 2025, which is
              stronger evidence of technical progress than many solid-state peers provide. The remaining investor
              challenge is turning those milestones into revenue-bearing commercial programs without repeated dilution
              or a prolonged gap between engineering validation and SOP-scale production.
            claimRefs:
              - CO002
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
