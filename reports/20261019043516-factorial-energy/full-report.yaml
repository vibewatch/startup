  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a sequence from platform R&D to OEM validation, partner-led scale-up, and niche initial
      commercialization before any disclosed automotive volume revenue.
    data:
      nodes:
        - id: platforms
          label: Platforms and end markets
          summary: FEST and Solstice are positioned for eMobility, defense, and AI/robotics.
          note: Diversified end markets widen optionality, but they also imply different commercialization clocks.
          claimRefs:
            - CI001
            - CI002
        - id: oem-validation
          label: OEM validation programs
          summary: Dealroom and Stellantis frame the business around OEM and battery-manufacturer adoption.
          note: Validation and demo fleets are stronger technical signals than revenue signals.
          claimRefs:
            - CI003
            - CI006
        - id: preproduction
          label: Internal pre-production line
          value: 200
          unit: MWh footprint
          summary: The Methuen site provides pilot and pre-production support for partner programs.
