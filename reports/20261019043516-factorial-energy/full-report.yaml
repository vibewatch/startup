            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: OEM validation is unusually real for this stage
            body: >-
              Factorial is still pre-revenue, but its commercialization story is anchored by named JDAs, strategic OEM
              capital, an operational manufacturing site, and a partner-reported 2025 cell validation milestone rather
              than by purely conceptual lab claims.
            calloutType: strength
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: callout
            title: Control concentration and monetization remain the key underwriting gap
            body: >-
              The strongest public adverse signals are not technical failure disclosures but structural ones: founder
              voting control, pre-revenue accounting, prior going-concern language before the de-SPAC cash infusion, and
              incomplete visibility into current cash, customer commitments, and full lifetime capitalization.
            calloutType: risk
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitute
        blocks:
          - type: paragraph
            body: >
              Factorial's own boundary definition starts broad and then narrows quickly in the retained evidence. The
              homepage markets solid-state batteries for eMobility, defense, and AI/robotics, and Battery-Tech also
              places the company in EV and energy-storage workflows. That creates a multi-vertical narrative, but the
              concrete market evidence is still dominated by automotive programs, automaker partnerships, and
              vehicle-integration milestones rather than disclosed demand in defense, robotics, or stationary storage.
              The status-quo substitute is conventional lithium-ion: Factorial explicitly frames incumbent batteries as
              heavy and range-limited, while third-party and partner materials emphasize safety, charging speed, and
              energy-density improvements as the reason buyers would switch rather than price leadership alone.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
      - number: '2.2'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >
              The retained sources point to a B2B commercialization model aimed at automaker and battery partner
              workflows, not direct consumer demand capture. Dealroom describes the primary market as automotive and
              says the batteries are expected to debut in a high-spec market as a test of performance and
              manufacturability, while official and partner disclosures name Mercedes-Benz, Stellantis, Hyundai, and Kia
              as the most visible development counterparties. The adoption path therefore runs through qualification,
              pack integration, and partner-led pilot programs: Stellantis has validated automotive-sized cells and
              plans a 2026 demonstration fleet, while the Massachusetts facility announcement frames output as
              pre-production support for named automotive partners rather than a broad, already-booked order book.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >
              The adoption case is technically legible in public materials. Battery-Tech attributes up to 390 Wh/kg to
              FEST and up to 450 Wh/kg to Solstice, and Stellantis reports 375 Wh/kg, more than 600 cycles toward
              qualification, an 18-minute 15%-to-90% charge window, operation from -30 C to 45 C, and up to 4C
              discharge. WaveEP's 2022 funding announcement adds the commercial driver that drop-in compatibility with
              existing lithium-ion manufacturing infrastructure could reduce switching cost for automakers. The
              constraints are equally important: the 2023 facility is still framed as pre-production, the 2026 fleet is
              still a demonstration step, and retained public materials do not disclose pricing, royalties, purchase
              commitments, or contract volumes that would show whether technical validation converts into durable
              revenue.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.4'
        title: Sizing lens and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >
              Public evidence supports only an evidence-constrained sizing lens, not a clean TAM/SAM/SOM stack. The
              strongest public numbers are company-level or readiness proxies: Dealroom's valuation and funding ranges,
              the $200 million 2022 Series D, the $50 million Methuen facility, and the line's stated 200 MWh capacity.
              Those numbers help bracket investor belief, financing committed to the category, and the scale of the
              first manufacturable wedge, but none of them are synonymous with end-market spend, contracted demand, or
              revenue potential. Even the current resources hub still surfaces the 2025 Stellantis milestone release
              rather than market-size or pricing disclosures, so a diligence process still needs buyer budgets,
              committed offtake, and unit-economic detail before treating the market as underwritten.
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Automotive qualification is the real market wedge
            body: >
              Factorial markets multiple end markets, but the retained evidence that is closest to revenue conversion is
              concentrated in automotive OEM qualification, pack integration, and pilot-scale manufacturing rather than
              broad cross-vertical demand.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
              - CM014
          - type: callout
            title: Market size is still a diligence gap, not a proven revenue base
            body: >
              Public sources offer capital, valuation, and pilot-line proxies, but they still do not disclose TAM,
              contracted volumes, pricing, or royalties, so valuation cannot be underwritten from public market-size
              evidence alone.
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, substitutes, and likely entrant classes
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a wider competitive set than "other solid-state startups." Factorial
              positions itself around eMobility, defense, and AI/robotics, which means it competes for future platform
              decisions at OEMs and battery manufacturers rather than for a narrow lab niche. Dealroom's peer preview
              names direct and adjacent battery developers including QuantumScape, SES AI, Nyobolt, Beijing Weilan,
              Amprius, and StoreDot, while an independent comparison article frames the live substitute set as
              conventional lithium-ion supply available today, QuantumScape's public solid-state effort, and Toyota's
              internal solid-state program. For underwriting, the status quo matters as much as startup peers: incumbent
              lithium-ion and captive OEM programs can delay or absorb the same buyer budget that a Factorial deployment
              would otherwise win.
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP015
              - CP016
      - number: '3.2'
        title: Public differentiation is proof-led, not just narrative-led
        blocks:
          - type: paragraph
            body: >-
              Factorial's strongest public edge is that its commercialization story is supported by more than branding.
              The company said its Massachusetts manufacturing build-out represented a $50 million investment and a
              footprint that can support a 200 MWh assembly line, and Stellantis separately described validated 77Ah
              FEST cells at 375 Wh/kg with charging from 15% to over 90% in 18 minutes and a demonstration-fleet plan by
              2026. Those facts do not prove mass production or economics, but they do move Factorial beyond a purely
              conceptual position. Relative to private peers whose retained-source detail is thinner, the combination of
              partner validation, large-format cell proof, and a visible U.S. pilot-line path is the clearest public
              differentiation signal in this pool.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
              - CP016
      - number: '3.3'
        title: Distribution leverage comes from partners, but lock-in remains unproven
        blocks:
          - type: paragraph
            body: >-
              The route to market in the retained sources is partner-led rather than direct-price-led. Factorial's
              official and syndicated materials emphasize joint development agreements with Mercedes-Benz, Stellantis,
              and Hyundai, while a later Simplify profile characterizes the company as fabless and reliant on partners
              such as SK On and Mitsui Kinzoku for industrialization. That structure can accelerate access to OEM
              programs without requiring a standalone gigafactory build, but it also means switching costs are not yet
              visible in public commercial terms. Across the retained official and partner sources, there is still no
              public list pricing, royalty schedule, or binding purchase commitment detail that would show whether pilot
              success converts into durable share or margin.
            claimRefs:
              - CP005
              - CP008
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: Durable moat case is not yet closed
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this pool is less about a technical failure than about timing and bargaining
              power. The Simplify critic view explicitly says the SK On manufacturing MOU is non-binding and warns that
              Toyota and Chinese battery firms are racing commercialization, while the independent comparison source
              reminds readers that conventional lithium-ion remains available now and that Factorial is still in a pilot
              stage. That leaves Factorial with a credible but incomplete moat story: public proof is stronger than many
              startup narratives, yet the company still needs to turn partner validation into binding volume,
              transparent economics, and production reliability before it can claim competitive durability against
              incumbents, in-house OEM programs, and other solid-state specialists.
            claimRefs:
              - CP009
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Visible OEM validation is the main competitive asset
            body: >-
              Compared with many private battery startups, Factorial has unusually visible partner proof in public
              sources: automaker JDAs, a public pilot-line narrative, and a named Stellantis demonstration-fleet path.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Economics and binding demand remain the weak link
            body: >-
              The retained evidence still does not show public pricing, royalty schedules, or binding purchase
              commitments, so the company's competitive leverage is easier to observe than its monetization or lock-in.
            calloutType: risk
            claimRefs:
              - CP009
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Partner-led revenue remains earlier than a normal automotive underwriting case
        blocks:
          - type: paragraph
            body: >-
              Public evidence still frames Factorial as a technology supplier monetizing through OEM and
              battery-manufacturer relationships instead of through direct vehicle sales or a disclosed installed-base
              software model. Dealroom describes the company as selling FEST into automotive manufacturers, while
              Stellantis' validation update and the company's own surface both point to development, sampling, and
              demonstration milestones rather than public serial-production contracts. That makes the current revenue
              bridge visible in sequence but not yet measurable in dollars: validation and partner adoption come first,
              then higher-spec early orders, and only later potential automotive volume.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI010
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI013
      - number: '4.2'
        title: The cost story is capital-light on paper, but pricing economics are still hidden
        blocks:
          - type: paragraph
            body: >-
              Factorial's economic pitch is that FEST can run on much of the existing lithium-ion toolchain and
              therefore needs less greenfield capex than a startup building a full gigafactory from scratch. The Methuen
              site and the 2022 financing show that the company has still spent real money on pre-production capacity
              and manufacturing readiness, but the available evidence stops short of disclosing yield, scrap, warranty
              reserves, or a partner royalty schedule. As a result, investors can see the shape of the cost strategy and
              the dependence on partner plants, but not the realized unit economics that would convert that strategy
              into a durable margin profile.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI009
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI013
      - number: '4.3'
        title: Public-company metrics show capital and losses, not operating leverage
        blocks:
          - type: paragraph
            body: >-
              Independent summaries provide more visibility on capital structure than on revenue conversion. Inside Deep
              Tech cites more than $100 million of listing proceeds, roughly $112.8 million of cash at June 30, 2026,
              and 2026 guidance of about $40 million of non-GAAP operating expense and about $13 million of capex.
              Multiples.vc still shows revenue as undisclosed while reporting meaningful EBITDA and net losses, and the
              current public-market capitalization is much lower than the broader 2026 private-valuation range shown by
              Dealroom. That combination suggests investors are funding continued industrialization, but not yet paying
              for proven recurring revenue.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: 'Financial verdict: credible industrial progress, but insufficient disclosure for revenue quality'
        blocks:
          - type: paragraph
            body: >-
              Factorial has enough disclosed capital, partner validation, and pilot-capacity investment to keep
              progressing, and the capital-intensity profile looks lighter than a battery company that must self-fund
              multi-gigawatt-hour production. The underwriting problem is that the retained evidence still does not
              reveal the commercial terms that matter most: list pricing, realized ASP, royalty mechanics, conversion
              from demos into purchase orders, customer concentration, or gross margin. The clearest public revenue
              marker is a 2027 expectation tied to drones and supercars, while automotive scale remains gated by
              non-binding or development-stage partner agreements. Until those terms are disclosed, the story is
              investable as option value on industrialization rather than as a fully underwritable revenue model.
            claimRefs:
              - CI008
              - CI010
              - CI011
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital-light does not mean capital-free
            body: >-
              Factorial's existing-equipment pitch reduces the need for a self-funded gigafactory, but the company still
              needed a $200M Series D, a $50M Methuen build-out, and ongoing 2026 opex/capex guidance to keep
              industrialization moving.
            calloutType: insight
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI009
          - type: callout
            title: Revenue quality is still opaque
            body: >-
              Public sources describe validation milestones, public-market liquidity, and expected 2027 specialty
              revenue, but they still do not disclose pricing, royalties, or binding automotive purchase commitments
              that would let an investor underwrite normalized margins.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and portfolio architecture
        blocks:
          - type: paragraph
            body: >-
              Factorial is not selling a generic battery pitch so much as a portfolio thesis aimed at customer workflows
              that need higher-energy, safer cells without rebuilding every downstream manufacturing step. The official
              homepage and LinkedIn profile frame the company around mobility first, but they also extend the
              addressable surface to aerospace, defense, robotics, and broader energy-storage applications. Within that
              scope, the public portfolio breaks into two named chemistry tracks: FEST, which Factorial describes as its
              quasi-solid-state platform, and Solstice, which it describes as sulfide-based and all-solid-state. That
              dual-track positioning matters because it suggests the company is trying to serve near-term automotive
              qualification and longer-horizon performance upside in parallel rather than betting the company on one
              chemistry-only roadmap.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE010
              - CE012
      - number: '5.2'
        title: Validation, deployment, and industrialization model
        blocks:
          - type: paragraph
            body: >-
              The strongest named external validation in the assigned evidence comes from Stellantis, which said it
              validated automotive-sized 77Ah FEST cells at 375Wh/kg, with more than 600 cycles, 18-minute charging from
              15% to over 90%, and operation from -30°C to 45°C. Just as important, Stellantis described the work as
              broader than a cell lab exercise: the collaboration covers pack architecture, vehicle integration, and a
              demonstration fleet plan, while Factorial's own LinkedIn feed ties the chemistry to Peugeot concept work,
              Dodge Charger Daytona road testing, and early aerospace-range proof. On the operating side, Factorial has
              consistently emphasized manufacturability: the 2023 Methuen facility announcement described room for a
              200MWh line, and earlier financing materials stressed compatibility with existing lithium-ion equipment
              instead of a clean-sheet factory stack.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE010
              - CE015
      - number: '5.3'
        title: Maturity, dependencies, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              The maturity signal is therefore real but still conditional. Public evidence shows Factorial moving from
              lab validation into pre-production infrastructure, concept vehicles, and partner-led testing, yet most
              deployment proof remains in milestones, demos, or partner statements rather than serial-production awards.
              The operating model also remains dependency-heavy: public reporting points to a coalition approach for
              electrolytes, cathode and anode materials, tooling, and manufacturing scale-up, while third-party hiring
              signals show the company still building out production, EHS, inventory, and MES capacity. Most
              importantly, the public documentation surface reviewed for this chapter did not produce the hard
              scale-readiness evidence an investor would want next, such as third-party safety certifications, formal
              quality credentials, yield curves, scrap rates, or binding production-volume commitments. That makes
              technical readiness more advanced than revenue readiness, but still not fully underwritten.
            claimRefs:
              - CE008
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real validation exists, but it is still pre-scale proof
            body: >-
              Stellantis' named cell-validation data and Factorial's concept-vehicle updates are stronger than typical
              startup marketing, yet the public evidence still stops short of disclosed serial-production contracts,
              yields, or unit economics.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE012
          - type: callout
            title: Commercialization remains ecosystem-dependent
            body: >-
              Factorial's route to market depends on OEM qualification, supplier coordination, and
              manufacturing-transfer execution; the evidence reviewed does not yet show the hard quality and throughput
              data that would de-risk those handoffs.
            calloutType: risk
            claimRefs:
              - CE010
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is narrow, B2B, and OEM-led
        blocks:
          - type: paragraph
            body: >-
              Public evidence portrays Factorial as a business-to-business battery supplier selling into a narrow set of
              complex automotive programs rather than a diversified end-market franchise. The homepage markets batteries
              for eMobility, defense, and AI/robotics, and Dealroom likewise frames the company as B2B with automotive
              OEMs and battery manufacturers as the primary market. But the named-customer set in this pool is still
              concentrated: Mercedes-Benz, Stellantis, Hyundai Motor Company, and Kia Corporation recur across public
              materials, while a live customer-count denominator is absent. That concentration matters because each
              disclosed relationship appears strategic and technically intensive, implying long sales cycles and high
              dependence on a few flagship OEM programs rather than many small accounts.
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption proof shows technical progression, not yet volume conversion
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption proof is milestone-based rather than revenue-based. In 2022, Factorial said its
              pilot production facility would produce batteries for customer testing and linked commercialization to
              joint development agreements with Mercedes-Benz, Stellantis, and Hyundai. In 2023, it opened the Methuen
              line and said the site would serve automotive-partner needs at up to 200MWh preproduction scale. The
              clearest named customer proof comes from Stellantis' April 2025 disclosure: validated 77Ah FEST cells,
              375Wh/kg energy density, fast charging, and a demonstration-fleet plan by 2026. Electrek's archive
              reinforces the sequence from A-sample shipments to Mercedes validation and road-test headlines, while a
              low-reliability Cheonan interview-prep page suggests customer or partner visits are operationally relevant
              on site.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU008
              - CU009
              - CU010
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
              - CU013
      - number: '6.3'
        title: Durability and expansion remain underdisclosed
        blocks:
          - type: paragraph
            body: >-
              What remains missing is the durability layer that investors would need to underwrite recurring demand.
              None of the assigned sources disclose customer count, contract length, renewal behavior, churn, NRR or
              GRR, pricing, or purchase obligations. Even the strongest proofs—Stellantis validation and
              Mercedes-focused media milestones—still sit on the precommercial side of the boundary between engineering
              success and program revenue. Electrek's note that the specific OEM recipients of A-samples were "up for
              dispute" adds a useful caution: public momentum does not equal transparent customer breadth. The result is
              a chapter that supports real adoption interest, but not yet diversified, contract-backed customer
              durability.
            claimRefs:
              - CU002
              - CU009
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Flagship OEM proof is real
            body: >-
              The Stellantis disclosure goes beyond a logo slide: it names validated-cell performance, charging
              behavior, and a demonstration-fleet plan, while other public materials repeatedly reference Mercedes-Benz
              and Hyundai or Kia programs.
            calloutType: strength
            claimRefs:
              - CU002
              - CU006
              - CU008
          - type: callout
            title: Customer proof is still narrow and non-economic
            body: >-
              The evidence base is concentrated in a handful of automotive counterparties and milestone announcements;
              the assigned sources never disclose customer count, retention, contract length, pricing, or binding
              purchase commitments.
            calloutType: risk
            claimRefs:
              - CU009
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks sit at the commercialization boundary rather than pure lab performance.
              Stellantis still framed its 2026 demonstration fleet as the next step toward commercialization, while
              Factorial's own facility announcement described automotive-sized output at pre-production speed and volume
              instead of established serial manufacturing. That combination means the core underwriting risk is
              conversion: can validated cells, partner programs, and facility build-out become repeatable OEM revenue
              before more capital, schedule slip, or partner concentration changes the economics?
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Regulatory, legal, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports technical progress and partner engagement, but it does not yet provide the legal
              and compliance closure investors would want before treating the business as de-risked. The 2025 Stellantis
              milestone explicitly said qualification work was still progressing, and the assigned public materials do
              not disclose binding purchase commitments, pricing, royalty terms, or production yields. That leaves
              multiple diligence paths open at once: qualification and abuse-testing evidence, facility permits and EHS
              controls, freedom-to-operate work around the patent estate, and contract economics that determine whether
              technical success can convert into investable margins.
            claimRefs:
              - CR001
              - CR004
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
              - CR011
      - number: '7.3'
        title: Operational and partner execution risk
        blocks:
          - type: paragraph
            body: >-
              Factorial's execution surface is widening faster than its public proof set. The company has built a
              Massachusetts facility, is hiring production, MES, inventory, and EHS roles in Korea, and is extending
              partner coverage through Stellantis, Mercedes, Hyundai/Kia, SK On, and Mitsui Kinzoku. Those are positive
              signals, but they also create coupled failure modes: yield losses, ramp delays, materials bottlenecks,
              partner reprioritization, or a missed demonstration-fleet milestone could all push commercialization out
              while fixed costs and credibility commitments keep rising.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR008
              - CR010
              - CR013
      - number: '7.4'
        title: Financial model risk, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The public financing signal is directionally supportive but still leaves substantial valuation and
              dilution risk. Dealroom places the business in a unicorn valuation band with disclosed funding somewhere
              between $100 million and $500 million, and the 2022 Series D was explicitly raised to fund commercial
              production, team growth, and manufacturing facilities. Without public disclosure of purchase commitments,
              pricing, royalty structure, or yields, the main monitorables are practical: whether the 2026 demo fleet
              converts into broader qualification wins, whether the Korea and Massachusetts build-out produces reliable
              scale metrics, and whether new capital arrives on stronger strategic terms rather than defensive
              financing.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              The risk case hardens if the 2026 demonstration fleet slips materially, if new capital arrives without
              matching commercial disclosure or on clearly defensive terms, or if partner announcements continue to
              expand while public proof of serial production, contracted demand, and production economics remains
              absent.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation frame: credible technology, incomplete underwriting'
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to support a **track** view, but not strong enough to support a buy call.
              Factorial did complete its Nasdaq listing in June 2026 and the transaction headline valued the company at
              about $1.3 billion with more than $100 million of expected gross proceeds. At the same time, the SEC-based
              Troy Technical review says cash at June 30, 2026 was $112.8 million, revenue was still zero, and the
              disclosed plan only funds operations and equipment through the first quarter of 2028. That combination
              means investors are paying for technical option value and strategic partner credibility before public
              evidence shows durable commercial conversion, pricing, or fully transparent dilution mechanics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis vs. anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable part of the story is real. Stellantis says Factorial validated 77Ah FEST cells at 375Wh/kg,
              fast charge from 15% to above 90% in 18 minutes, and is still targeting a 2026 demonstration fleet.
              Factorial and its syndications also show a partner-led manufacturing strategy, a 200MWh-capable
              Massachusetts footprint, and a company resource archive that retains the April 2025 Stellantis milestone.
              The anti-thesis is just as important: Troy Technical still characterizes the company as
              pre-commercialization with zero recorded operating revenue, while contract termination rights, an active
              arbitration, and thin public visibility into customer economics make it hard to defend premium valuation
              multiples from current disclosures alone.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario discipline
        blocks:
          - type: paragraph
            body: >-
              Public sources support only milestone-based scenario framing, not precision modeling. The upside case
              depends on validated cells moving into visible commercial programs, partner manufacturing converting into
              repeatable shipments, and the company proving that its capital-light framing actually compresses future
              capital intensity. The base case is that public valuation stays anchored around the June 2026 listing
              context while investors wait for commercial revenue and cleaner economics. The downside case is that cash
              renewal or volume delays arrive before strong revenue proof, producing either recapitalization pressure or
              a market reset below the de-SPAC narrative value.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The decisive diligence asks are not broad TAM debates; they are contract, cap-table, and conversion
              questions. A more constructive recommendation would need public or diligence-room proof on binding
              purchase commitments, pricing or licensing economics, and the fully diluted post-SPAC ownership and
              preference stack. The thesis breaks if Factorial needs new capital before demonstrating sustained
              commercial revenue, if core automotive partners exercise termination rights or slip programs materially,
              or if management cannot show that manufacturing partnerships and the existing line footprint really bridge
              from validated cells to repeatable shipments without a far larger capital requirement.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track unless evidence or price improves
            body: >-
              Factorial looks strategically valuable, but current public evidence still prices more future success than
              it proves. A better call needs either cheaper entry, cleaner economics, or both.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV012
          - type: callout
            title: Underwrite milestones, not just narrative
            body: >-
              The critical watch items are cash renewal timing, partner program progression, and the gap between
              validated cells and disclosed revenue. Those are the variables most likely to change the valuation debate
              quickly.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV012
              - CV013
              - CV014
