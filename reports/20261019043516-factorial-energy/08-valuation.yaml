company:
  name: "Factorial Energy"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Public evidence supports a **track** recommendation rather than a buy. Factorial has
    unusually credible OEM and partner validation plus fresh public-market capital, but the
    public record still shows zero revenue as of June 30, 2026, finite runway into Q1 2028,
    and incomplete disclosure on contract economics and cap-table overhang, so the current
    valuation context looks stretched relative to disclosed commercial proof.
sections:
  - id: recommendation-frame
    title: "Recommendation frame: credible technology, incomplete underwriting"
    body: >-
      Public evidence is strong enough to support a **track** view, but not strong enough to
      support a buy call. Factorial did complete its Nasdaq listing in June 2026 and the
      transaction headline valued the company at about $1.3 billion with more than $100
      million of expected gross proceeds. At the same time, the SEC-based Troy Technical
      review says cash at June 30, 2026 was $112.8 million, revenue was still zero, and the
      disclosed plan only funds operations and equipment through the first quarter of 2028.
      That combination means investors are paying for technical option value and strategic
      partner credibility before public evidence shows durable commercial conversion, pricing,
      or fully transparent dilution mechanics.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-vs-anti-thesis
    title: "Thesis vs. anti-thesis"
    body: >-
      The investable part of the story is real. Stellantis says Factorial validated 77Ah
      FEST cells at 375Wh/kg, fast charge from 15% to above 90% in 18 minutes, and is still
      targeting a 2026 demonstration fleet. Factorial and its syndications also show a
      partner-led manufacturing strategy, a 200MWh-capable Massachusetts footprint, and a
      company resource archive that retains the April 2025 Stellantis milestone. The anti-thesis is just as
      important: Troy Technical still characterizes the company as pre-commercialization with
      zero recorded operating revenue, while contract termination rights, an active
      arbitration, and thin public visibility into customer economics make it hard to defend
      premium valuation multiples from current disclosures alone.
    claimRefs: [CV006, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenario-discipline
    title: "Scenario discipline"
    body: >-
      Public sources support only milestone-based scenario framing, not precision modeling.
      The upside case depends on validated cells moving into visible commercial programs,
      partner manufacturing converting into repeatable shipments, and the company proving
      that its capital-light framing actually compresses future capital intensity. The base
      case is that public valuation stays anchored around the June 2026 listing context while
      investors wait for commercial revenue and cleaner economics. The downside case is that
      cash renewal or volume delays arrive before strong revenue proof, producing either
      recapitalization pressure or a market reset below the de-SPAC narrative value.
    claimRefs: [CV002, CV003, CV004, CV008, CV009, CV011, CV012]
    tableRefs: [TV003]
  - id: diligence-and-thesis-breakers
    title: "Diligence asks and thesis-breakers"
    body: >-
      The decisive diligence asks are not broad TAM debates; they are contract, cap-table,
      and conversion questions. A more constructive recommendation would need public or
      diligence-room proof on binding purchase commitments, pricing or licensing economics,
      and the fully diluted post-SPAC ownership and preference stack. The thesis breaks if
      Factorial needs new capital before demonstrating sustained commercial revenue, if core
      automotive partners exercise termination rights or slip programs materially, or if
      management cannot show that manufacturing partnerships and the existing line footprint
      really bridge from validated cells to repeatable shipments without a far larger capital
      requirement.
    claimRefs: [CV003, CV004, CV006, CV010, CV011, CV013, CV014]
