      - ["Risk rating", "High", "Zero recorded revenue, runway only through Q1 2028, contract termination rights, and active arbitration all remain visible risks.", "Treat the equity as milestone- and financing-sensitive rather than compounding today."]
      - ["Valuation stance", "Stretched", "The company reached public markets around a $1.3B value and third-party market data still places it in a unicorn band without public revenue support.", "Entry discipline matters more than narrative quality."]
    notes: "Judgment summary built from current public sources; public materials do not disclose full per-share dilution, preference, or customer-economics detail."
    claimRefs: [CV002, CV003, CV004, CV008, CV009, CV012, CV013, CV014]
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns:
      - "Side"
      - "Argument"
      - "Public support"
      - "What would change the view"
    rows:
      - ["Thesis", "OEM and partner validation is stronger than for most battery startups at a comparable pre-revenue stage.", "Stellantis validated 77Ah FEST cells; Mercedes-Benz, Stellantis, Hyundai/Kia all appear in funding and development relationships.", "Visible conversion from validation into recurring commercial shipments would strengthen the thesis materially."]
      - ["Anti-thesis", "Public valuation still outruns disclosed commercial proof.", "Troy Technical reports zero revenue, finite runway, and continuing disclosure gaps on economics; Dealroom still shows a unicorn valuation range.", "Signed contracts with pricing, margin, and minimum-volume terms would reduce this gap."]
      - ["Decision pivot", "The investment call is price- and evidence-sensitive, not a pure technology-quality score.", "The company may be strategically valuable, but current evidence still looks like option value rather than underwritten operating proof.", "A cheaper entry or more complete economic disclosure could move the call upward."]
    notes: "Directional synthesis table; arguments are backed by public disclosures and should be revisited when customer economics or new financing terms are disclosed."
    claimRefs: [CV003, CV004, CV005, CV008, CV009, CV011, CV012]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Validated cells convert into visible automotive and non-automotive commercial programs; partner manufacturing reduces capital intensity; OEM partners deepen the scale path.", "Could justify the upper half of the public $1–2.5B reference band and eventually exceed the June 2026 transaction framing if revenue proof follows.", "Execution still depends on partner plants, qualification timing, and real contract economics.", "More partner manufacturing announcements plus shipped commercial units would support this case."]
      - ["Base", "Technical validation continues, but revenue proof and customer economics stay limited for another reporting cycle.", "Value remains anchored near the June 2026 public entry context rather than re-rating sharply upward.", "Investors keep paying for optionality while runway shortens.", "This is the most evidence-consistent case from current public sources."]
      - ["Bear", "Commercialization slips, new capital is needed before strong revenue appears, or key partners do not scale programs on time.", "Public valuation compresses below the de-SPAC narrative value and financing terms become the main driver of returns.", "Dilution, reset pricing, or partner attrition dominate.", "Any financing before clear commercial proof or major program slippage would push the story toward this case."]
    notes: "Scenario table is intentionally qualitative because public sources do not provide the contract, volume, or margin detail needed for a precise model."
    claimRefs: [CV002, CV003, CV004, CV008, CV009, CV010, CV011, CV012, CV013]
figures:
  - id: FV001
    title: "Recommendation logic"
    type: flow
    summary: >-
      The recommendation flows from real validation and fresh capital on the left to a
      commercialization and financing gap that still dominates underwriting on the right.
    data:
      nodes:
        - id: validation
          label: "OEM / partner validation"
          detail: "Stellantis validated 77Ah FEST cells at 375Wh/kg and still targets a 2026 demonstration fleet."
        - id: scale-path
          label: "Scale path is visible"
          detail: "Massachusetts manufacturing footprint and a partner-led model indicate a pathway to scale."
        - id: fresh-capital
          label: "Fresh capital exists"
          detail: "The June 2026 public listing added new capital and created a current valuation marker."
        - id: revenue-gap
          label: "Revenue proof is still missing"
          detail: "Public reporting cited by Troy Technical still showed zero operating revenue at June 30, 2026."
        - id: financing-risk
          label: "Runway and downside remain finite"
          detail: "Publicly visible cash only supports operations through Q1 2028 and the record still includes legal and counterparty risk."
        - id: recommendation
          label: "Recommendation: track / stretched"
          detail: "Watch for commercial conversion or a cheaper entry rather than underwriting a buy call today."
      edges:
        - from: validation
          to: scale-path
          label: "technical proof supports scale narrative"
        - from: scale-path
          to: fresh-capital
          label: "scale story supports financing access"
        - from: fresh-capital
          to: revenue-gap
          label: "capital alone does not prove commercialization"
        - from: revenue-gap
          to: financing-risk
          label: "commercial delay turns into dilution risk"
        - from: financing-risk
          to: recommendation
          label: "price discipline dominates today"
    claimRefs: [CV002, CV003, CV004, CV006, CV009, CV010, CV011, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: "Track unless evidence or price improves"
    body: >-
      Factorial looks strategically valuable, but current public evidence still prices more
      future success than it proves. A better call needs either cheaper entry, cleaner
      economics, or both.
    claimRefs: [CV002, CV003, CV004, CV008, CV009, CV012]
  - calloutType: risk
    title: "Underwrite milestones, not just narrative"
    body: >-
      The critical watch items are cash renewal timing, partner program progression, and the
      gap between validated cells and disclosed revenue. Those are the variables most likely
      to change the valuation debate quickly.
    claimRefs: [CV003, CV004, CV010, CV012, CV013, CV014]
