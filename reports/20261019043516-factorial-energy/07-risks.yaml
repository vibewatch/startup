      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Automotive qualification delay
          values:
            - { label: High, tone: risk, note: 2025 validation still described as progressing toward automotive qualification }
            - { label: High, tone: risk, note: Demo-fleet slip would delay commercialization proof }
            - { label: Medium, tone: warning, note: OEM testing is real but not a finished qualification program }
            - { label: High, tone: risk, note: Serial-production proof is still not public }
        - label: Pilot-to-volume manufacturing ramp
          values:
