            - { label: Medium, tone: neutral, note: Existing-equipment compatibility and new sites help but do not prove yields }
            - { label: High, tone: risk, note: No public yield, scrap, or warranty disclosure }
        - label: Partner concentration and reprioritization
          values:
            - { label: Medium-High, tone: risk, note: OEM and manufacturing counterparties are strategic but concentrated }
            - { label: High, tone: risk, note: Commercialization proof is routed through a small set of partners }
            - { label: Medium, tone: neutral, note: Multiple OEMs reduce single-counterparty failure risk }
            - { label: Medium-High, tone: risk, note: New MOUs still need operational conversion }
        - label: Financing and commercialization economics opacity
          values:
            - { label: Medium-High, tone: risk, note: Public funding is substantial but precise economics remain undisclosed }
            - { label: High, tone: risk, note: More capital without contract or yield proof could dilute upside }
            - { label: Low-Medium, tone: warning, note: Strategic investors help but do not remove capital intensity }
            - { label: Medium-High, tone: risk, note: Purchase commitments, pricing, royalties, and yields are not public }
        - label: EHS and facility-compliance opacity
          values:
            - { label: Medium, tone: warning, note: Public materials show facilities and EHS hiring but not a full permit or incident record }
            - { label: High, tone: risk, note: Compliance problems could delay scale-up or raise remediation cost }
            - { label: Low-Medium, tone: neutral, note: EHS hiring is a positive signal but not proof of mature controls }
            - { label: Medium-High, tone: risk, note: Assigned public sources do not expose the underlying operating logs }
        - label: Strategic scope diffusion
          values:
            - { label: Medium, tone: warning, note: The website spans eMobility, defense, and AI-robotics while public proof remains auto-led }
            - { label: Medium, tone: warning, note: Expansion beyond the lead market can dilute management focus and capital }
            - { label: Low, tone: neutral, note: Broad ambition can widen the future TAM if execution stays disciplined }
            - { label: Medium, tone: risk, note: There is no public segment-level economics disclosure for the non-auto narrative }
    claimRefs: [CR001, CR002, CR003, CR006, CR011, CR012, CR013]
