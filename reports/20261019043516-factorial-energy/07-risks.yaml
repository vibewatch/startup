company:
  name: Factorial Energy
chapter:
  number: 7
  title: Risks
  summary: >-
    Factorial's public risk profile is dominated by commercialization timing rather than a
    single catastrophic defect: third-party validation is improving, but the company is still
    moving from pilot and demonstration milestones toward automotive qualification, scaled
    manufacturing, and disclosed commercial economics. The same evidence base also shows
    concentrated dependence on a small set of OEM and manufacturing partners plus likely
    future capital needs, so the investable question is whether 2026 validation converts into
    serial-production proof before dilution, schedule slip, or partner reprioritization resets the
    story.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest-severity risks sit at the commercialization boundary rather than pure
      lab performance. Stellantis still framed its 2026 demonstration fleet as the next step
      toward commercialization, while Factorial's own facility announcement described
      automotive-sized output at pre-production speed and volume instead of established
      serial manufacturing. That combination means the core underwriting risk is conversion:
      can validated cells, partner programs, and facility build-out become repeatable OEM
      revenue before more capital, schedule slip, or partner concentration changes the
      economics?
    claimRefs: [CR001, CR002, CR006, CR011, CR013]
    figureRefs: [FR001]
  - id: regulatory-legal-and-disclosure
    title: Regulatory, legal, and disclosure risk
    body: >-
      Public evidence supports technical progress and partner engagement, but it does not
      yet provide the legal and compliance closure investors would want before treating the
      business as de-risked. The 2025 Stellantis milestone explicitly said qualification work
      was still progressing, and the assigned public materials do not disclose binding
      purchase commitments, pricing, royalty terms, or production yields. That leaves
      multiple diligence paths open at once: qualification and abuse-testing evidence,
      facility permits and EHS controls, freedom-to-operate work around the patent estate,
      and contract economics that determine whether technical success can convert into
      investable margins.
    claimRefs: [CR001, CR004, CR011, CR012]
    tableRefs: [TR001]
  - id: operational-and-partner-execution
    title: Operational and partner execution risk
    body: >-
      Factorial's execution surface is widening faster than its public proof set. The company
      has built a Massachusetts facility, is hiring production, MES, inventory, and EHS roles
      in Korea, and is extending partner coverage through Stellantis, Mercedes, Hyundai/Kia,
      SK On, and Mitsui Kinzoku. Those are positive signals, but they also create coupled
      failure modes: yield losses, ramp delays, materials bottlenecks, partner reprioritization,
      or a missed demonstration-fleet milestone could all push commercialization out while
      fixed costs and credibility commitments keep rising.
    claimRefs: [CR002, CR003, CR005, CR007, CR008, CR013]
    tableRefs: [TR002, TR003]
  - id: financial-model-and-kill-criteria
    title: Financial model risk, monitoring, and kill criteria
    body: >-
      The public financing signal is directionally supportive but still leaves substantial
      valuation and dilution risk. Dealroom places the business in a unicorn valuation band
      with disclosed funding somewhere between $100 million and $500 million, and the 2022
      Series D was explicitly raised to fund commercial production, team growth, and
      manufacturing facilities. Without public disclosure of purchase commitments, pricing,
      royalty structure, or yields, the main monitorables are practical: whether the 2026 demo
      fleet converts into broader qualification wins, whether the Korea and Massachusetts
      build-out produces reliable scale metrics, and whether new capital arrives on stronger
      strategic terms rather than defensive financing.
    claimRefs: [CR001, CR006, CR007, CR010, CR012, CR013]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      The risk case hardens if the 2026 demonstration fleet slips materially, if new capital
      arrives without matching commercial disclosure or on clearly defensive terms, or if
      partner announcements continue to expand while public proof of serial production,
      contracted demand, and production economics remains absent.
    claimRefs: [CR001, CR006, CR012, CR013]
