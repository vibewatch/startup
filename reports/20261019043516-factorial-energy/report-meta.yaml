  topStrengths:
    - Named OEM validation and partner relationships show real technical traction.
    - The public listing and disclosed cash balance improve liquidity visibility versus many private peers.
    - Manufacturing and integration evidence suggest a credible path from lab validation toward industrialization.
  topRisks:
    - Revenue, pricing, and contract economics remain materially undisclosed.
    - Commercialization still depends on partners and non-binding or milestone-based agreements.
    - Public valuation support is weaker than the technical narrative until production and margin evidence improve.
  unresolvedGaps:
    - Exact customer economics, pricing, and binding volume commitments for commercial programs.
    - Yield, scrap, and gross-margin data for FEST and Solstice at scale.
    - A post-close cash bridge and clearer evidence of runway beyond the current operating plan.
