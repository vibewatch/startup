companyProfile:
  summary: >-
    Factorial Energy is a Massachusetts solid-state battery company that went public in June 2026 via de-SPAC, markets
    FEST and Solstice across eMobility and adjacent high-performance applications, and is still pursuing a partner-led
    commercialization path. Public evidence shows meaningful technical validation and a sizable cash balance, but the
    company still has no disclosed operating revenue, and the economics of customer conversion, yield, and binding
    production commitments remain opaque.
