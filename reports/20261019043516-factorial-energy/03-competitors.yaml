callouts:
  - calloutType: strength
    title: Visible OEM validation is the main competitive asset
    body: >-
      Compared with many private battery startups, Factorial has unusually visible partner proof in public sources:
      automaker JDAs, a public pilot-line narrative, and a named Stellantis demonstration-fleet path.
    claimRefs: [CP005, CP006, CP014]
  - calloutType: risk
    title: Economics and binding demand remain the weak link
    body: >-
      The retained evidence still does not show public pricing, royalty schedules, or binding purchase commitments, so
      the company's competitive leverage is easier to observe than its monetization or lock-in.
    claimRefs: [CP009, CP013, CP016]
