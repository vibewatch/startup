schemaVersion: report-v2
artifact: financials
slug: factorial-energy
runDate: 2026-10-19
company:
  name: Factorial Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Factorial's public financial story is still pre-volume and partner-led: the company has
    invested in pilot-scale manufacturing, public-company liquidity, and OEM validation, but the
    clearest near-term monetization is niche 2027 revenue rather than contracted mass-EV output.
    Public sources support the capital-light manufacturing thesis, yet they still do not disclose
    pricing, royalties, gross margins, or binding purchase commitments tightly enough to underwrite
    revenue quality.
sections:
  - id: partner-led-revenue-model
    title: Partner-led revenue remains earlier than a normal automotive underwriting case
    body: >-
      Public evidence still frames Factorial as a technology supplier monetizing through OEM and
      battery-manufacturer relationships instead of through direct vehicle sales or a disclosed
      installed-base software model. Dealroom describes the company as selling FEST into automotive
      manufacturers, while Stellantis' validation update and the company's own surface both point
      to development, sampling, and demonstration milestones rather than public serial-production
      contracts. That makes the current revenue bridge visible in sequence but not yet measurable in
      dollars: validation and partner adoption come first, then higher-spec early orders, and only
      later potential automotive volume.
    claimRefs: [CI001, CI002, CI003, CI006, CI010]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: manufacturing-economics
    title: The cost story is capital-light on paper, but pricing economics are still hidden
    body: >-
      Factorial's economic pitch is that FEST can run on much of the existing lithium-ion toolchain
      and therefore needs less greenfield capex than a startup building a full gigafactory from
      scratch. The Methuen site and the 2022 financing show that the company has still spent real
      money on pre-production capacity and manufacturing readiness, but the available evidence
      stops short of disclosing yield, scrap, warranty reserves, or a partner royalty schedule.
      As a result, investors can see the shape of the cost strategy and the dependence on partner
      plants, but not the realized unit economics that would convert that strategy into a durable
      margin profile.
    claimRefs: [CI002, CI004, CI005, CI009, CI013]
    tableRefs: [TI002]
  - id: public-liquidity-and-market-signals
    title: Public-company metrics show capital and losses, not operating leverage
    body: >-
      Independent summaries provide more visibility on capital structure than on revenue conversion.
      Inside Deep Tech cites more than $100 million of listing proceeds, roughly $112.8 million of
      cash at June 30, 2026, and 2026 guidance of about $40 million of non-GAAP operating expense
      and about $13 million of capex. Multiples.vc still shows revenue as undisclosed while
      reporting meaningful EBITDA and net losses, and the current public-market capitalization is
      much lower than the broader 2026 private-valuation range shown by Dealroom. That combination
      suggests investors are funding continued industrialization, but not yet paying for proven
      recurring revenue.
    claimRefs: [CI007, CI008, CI009, CI011, CI012, CI014, CI015]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: "Financial verdict: credible industrial progress, but insufficient disclosure for revenue quality"
    body: >-
      Factorial has enough disclosed capital, partner validation, and pilot-capacity investment to
      keep progressing, and the capital-intensity profile looks lighter than a battery company that
      must self-fund multi-gigawatt-hour production. The underwriting problem is that the retained
      evidence still does not reveal the commercial terms that matter most: list pricing, realized
      ASP, royalty mechanics, conversion from demos into purchase orders, customer concentration,
      or gross margin. The clearest public revenue marker is a 2027 expectation tied to drones and
      supercars, while automotive scale remains gated by non-binding or development-stage partner
      agreements. Until those terms are disclosed, the story is investable as option value on
      industrialization rather than as a fully underwritable revenue model.
    claimRefs: [CI008, CI010, CI011, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Automotive OEM validation programs
        - Joint development, sampling, and vehicle-validation work with global automakers
        - Program milestone / sample-cell shipment
        - 77Ah FEST validation and demo-fleet progression; no public SOP contract
        - "Medium: strong technical proof, weak revenue visibility"
        - Signed offtake terms, milestone-payment schedule, and conversion by OEM program
      - - High-spec initial commercialization
        - Early shipments into specialty programs before mainstream auto scale
        - Order / battery program
        - First commercial revenue expected in 2027 from drone and supercar orders
        - "Low-medium: nearer-term than mass EV, but likely niche and lumpy"
        - Named customers, backlog, ASP, and gross-margin by program
      - - Manufacturing / tech-transfer partnerships
        - Use partner plants and process qualification rather than a fully owned gigafactory
        - License / process qualification / supply agreement
        - SK On path is still non-binding and under evaluation
        - "Low: monetization contingent on definitive agreements"
        - Royalty rate, engineering-fee structure, exclusivity, and minimum volumes
      - - Internal pre-production output
        - Company-owned pilot and pre-production line for validation and partner support
        - MWh of assembly footprint
        - Methuen site can accommodate up to a 200MWh assembly line
        - "Medium-high: tangible capacity, but still pre-volume"
        - Yield, utilization, scrap, and sample-to-purchase conversion
    notes: >-
      Rows mix current pre-revenue validation activity with expected future monetization paths;
      no retained source discloses realized customer pricing or booked recurring revenue.
    claimRefs: [CI003, CI004, CI006, CI010, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Monetization lever
      - Public price / unit
      - What is disclosed
      - What remains unknown
      - Implication
      - Source lens
    rows:
      - - Automotive pack or cell sales
        - null
        - Public sources show OEM validation and demo work, not a published per-kWh or per-pack price
        - Realized ASP, discounting, pass-through terms, and warranty reserve
        - Demo milestones cannot be converted into a revenue forecast
        - "Official plus partner releases"
      - - Licensing or royalties on partner plants
        - null
        - The industrialization path emphasizes existing lithium-ion infrastructure and partner manufacturing
        - Royalty rate, NRE fees, exclusivity, and minimum-volume commitments
        - Capital-light logic is visible, but monetization mechanics are not
        - "Official plus adverse independent summary"
      - - High-spec early orders
        - null
        - Independent reporting cites 2027 first commercial revenue from drone and supercar orders
        - Contract size, ship dates, concentration, and contribution margin
        - Early revenue may validate demand without proving scalable automotive economics
        - Independent summary
      - - Manufacturing cost advantage
        - "Compatibility claim, not a quoted price"
        - Company-issued materials say FEST works with existing lithium-ion equipment and aims to be cost-competitive
        - BOM, yield, scrap, and pack-level gross margin
        - Cost positioning is strategic until operating data is disclosed
        - Official and ecosystem profiles
    notes: >-
      Nulls mean the retained public evidence does not disclose list pricing, realized pricing, or
      royalty schedules; the chapter therefore separates mechanism from underwritten revenue.
    claimRefs: [CI002, CI003, CI010, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Cash and cash equivalents (June 30, 2026)
        - "~$112.8M"
        - Medium
        - Sets the cushion for R&D, sampling, and phased manufacturing expansion
        - Latest monthly cash bridge, restricted cash, and any debt or project-finance obligations
      - - FY2026 capex guidance
        - "~$13M"
        - Medium
        - Shows planned cash intensity is lighter than a greenfield battery plant, but still meaningful versus cash
        - 2027 capex plan by site, tooling, and partner-support requirement
      - - Last-fiscal-year operating performance
        - "Revenue undisclosed; EBITDA ($63M); net loss ($74M)"
        - Medium
        - Confirms public markets still do not see operating leverage from product revenue
        - Audited revenue bridge, gross margin, and operating-loss walk
      - - Public valuation context
        - "$509M market cap / $404M EV on Oct. 18, 2026; Dealroom valuation range $1-2.5B"
        - Medium
        - Shows public investors price the company below broad private-valuation ranges while revenue remains unclear
        - Fully diluted share count, warrant overhang, and post-listing cap-table detail
      - - CAC, payback, and program-conversion economics
        - null
        - Low
        - OEM qualification can consume years of engineering support before recognized revenue
        - Sales-cycle data, engineering-service cost, and conversion by program stage
    notes: >-
      Reported liquidity and loss figures come from secondary summaries of company disclosures;
      null means no retained public source provides a reliable metric.
    claimRefs: [CI007, CI008, CI009, CI011, CI012, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a sequence from platform R&D to OEM validation, partner-led scale-up,
      and niche initial commercialization before any disclosed automotive volume revenue.
    data:
      nodes:
        - id: platforms
          label: Platforms and end markets
          summary: FEST and Solstice are positioned for eMobility, defense, and AI/robotics.
          note: Diversified end markets widen optionality, but they also imply different commercialization clocks.
          claimRefs: [CI001, CI002]
        - id: oem-validation
          label: OEM validation programs
          summary: Dealroom and Stellantis frame the business around OEM and battery-manufacturer adoption.
          note: Validation and demo fleets are stronger technical signals than revenue signals.
          claimRefs: [CI003, CI006]
        - id: preproduction
          label: Internal pre-production line
          value: 200
          unit: MWh footprint
          summary: The Methuen site provides pilot and pre-production support for partner programs.
          note: $50M of disclosed site investment is meaningful, but still far below gigafactory scale.
          claimRefs: [CI004, CI005]
        - id: partner-scaleup
          label: Partner manufacturing scale-up
          summary: The scale-up model depends on existing lithium-ion infrastructure and partner qualification.
          note: The SK On path is still non-binding, so industrialization is not yet contractually locked in.
          claimRefs: [CI002, CI009, CI013]
        - id: first-revenue
          label: Initial commercial revenue
          value: 2027
          unit: target year
          summary: Independent reporting says the first revenue target is 2027 and tied to specialty orders.
          note: Early commercialization appears closer in drones and supercars than in mainstream EVs.
          claimRefs: [CI010]
        - id: auto-volume
          label: Automotive volume revenue
          summary: Larger automotive revenue still requires qualified partner lines, signed contracts, and disclosed economics.
          note: This is the biggest remaining underwriting gap in the public record.
          claimRefs: [CI006, CI013]
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI009, CI010, CI013]
callouts:
  - calloutType: insight
    title: Capital-light does not mean capital-free
    body: >-
      Factorial's existing-equipment pitch reduces the need for a self-funded gigafactory, but the
      company still needed a $200M Series D, a $50M Methuen build-out, and ongoing 2026 opex/capex
      guidance to keep industrialization moving.
    claimRefs: [CI002, CI004, CI005, CI009]
  - calloutType: risk
    title: Revenue quality is still opaque
    body: >-
      Public sources describe validation milestones, public-market liquidity, and expected 2027
      specialty revenue, but they still do not disclose pricing, royalties, or binding automotive
      purchase commitments that would let an investor underwrite normalized margins.
    claimRefs: [CI010, CI011, CI013]
