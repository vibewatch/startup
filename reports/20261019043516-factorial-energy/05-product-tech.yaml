- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Validate next-generation EV cells before SOP
    - OEMs test large-format cells and compare them with incumbent lithium-ion performance
    - FEST cells validated with Stellantis
    - 375Wh/kg, 600+ cycles, 15% to >90% charge in 18 minutes
    - Validation is milestone-stage, not a disclosed production award
  - - Integrate solid-state cells into vehicle architecture
    - Automakers need pack and charging-system co-design before fleet launch
    - Joint pack-architecture and vehicle-integration work with Stellantis; Peugeot RCZ Vision concept uses a 1,000 V architecture
    - Shows progression from lab cells into concept-vehicle packaging and charging design
    - Assigned sources do not disclose serial-production timing or volume commitments
  - - Industrialize automotive-sized cell output
    - Scale test and pre-production cells without building an entirely new process stack
    - Methuen facility plus compatibility with existing lithium-ion manufacturing equipment
    - Up to 200MWh assembly-line footprint and 100+Ah-cell scale claim
    - No public throughput, scrap, or unit-cost metrics
  - - Extend chemistry into aerospace / dual-use adjacencies
    - High-performance platforms need range and cold-weather performance proof outside passenger EVs
    - Factorial markets the same battery family into aerospace, defense, robotics, and energy storage
    - Initial Tulip flight tests cited by Factorial claimed more than 30% greater range
    - Commercial demand, certification path, and recurring program count are undisclosed
  notes: Benefits are kept to explicit public metrics or company/partner statements; absence of volume, margin, and qualification data is treated as a limitation rather than assumed away.
  claimRefs:
