  title: Real validation exists, but it is still pre-scale proof
  body: Stellantis' named cell-validation data and Factorial's concept-vehicle updates are stronger than typical startup marketing, yet the public evidence still stops short of disclosed serial-production contracts, yields, or unit economics.
