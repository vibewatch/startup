chapter:
  number: 5
  title: Product & Technology
  summary: 'Factorial''s public product story is a dual-platform solid-state battery roadmap: FEST is the more validated quasi-solid-state program and Solstice is the newer all-solid-state path. OEM validation, concept-car integration, and pilot-line investments show real technical progress, but the public record still leaves safety certification, yield, and production-contract visibility materially incomplete.'
sections:
- id: product-scope-and-portfolio
  title: Product scope and portfolio architecture
  body: 'Factorial is not selling a generic battery pitch so much as a portfolio thesis aimed at customer workflows that need higher-energy, safer cells without rebuilding every downstream manufacturing step. The official homepage and LinkedIn profile frame the company around mobility first, but they also extend the addressable surface to aerospace, defense, robotics, and broader energy-storage applications. Within that scope, the public portfolio breaks into two named chemistry tracks: FEST, which Factorial describes as its quasi-solid-state platform, and Solstice, which it describes as sulfide-based and all-solid-state. That dual-track positioning matters because it suggests the company is trying to serve near-term automotive qualification and longer-horizon performance upside in parallel rather than betting the company on one chemistry-only roadmap.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE001
- id: validation-deployment-and-industrialization
  title: Validation, deployment, and industrialization model
  body: 'The strongest named external validation in the assigned evidence comes from Stellantis, which said it validated automotive-sized 77Ah FEST cells at 375Wh/kg, with more than 600 cycles, 18-minute charging from 15% to over 90%, and operation from -30°C to 45°C. Just as important, Stellantis described the work as broader than a cell lab exercise: the collaboration covers pack architecture, vehicle integration, and a demonstration fleet plan, while Factorial''s own LinkedIn feed ties the chemistry to Peugeot concept work, Dodge Charger Daytona road testing, and early aerospace-range proof. On the operating side, Factorial has consistently emphasized manufacturability: the 2023 Methuen facility announcement described room for a 200MWh line, and earlier financing materials stressed compatibility with existing lithium-ion equipment instead of a clean-sheet factory stack.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE002
  figureRefs:
  - FE001
- id: maturity-dependencies-and-diligence-gaps
  title: Maturity, dependencies, and unresolved technical risk
  body: 'The maturity signal is therefore real but still conditional. Public evidence shows Factorial moving from lab validation into pre-production infrastructure, concept vehicles, and partner-led testing, yet most deployment proof remains in milestones, demos, or partner statements rather than serial-production awards. The operating model also remains dependency-heavy: public reporting points to a coalition approach for electrolytes, cathode and anode materials, tooling, and manufacturing scale-up, while third-party hiring signals show the company still building out production, EHS, inventory, and MES capacity. Most importantly, the public documentation surface reviewed for this chapter did not produce the hard scale-readiness evidence an investor would want next, such as third-party safety certifications, formal quality credentials, yield curves, scrap rates, or binding production-volume commitments. That makes technical readiness more advanced than revenue readiness, but still not fully underwritten.'
  claimRefs:
  - CE008
  - CE013
  - CE014
  - CE015
  - CE016
  tableRefs:
  - TE003
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / program
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - FEST quasi-solid-state platform
    - Automotive OEM and adjacent mobility programs
    - Most validated public platform; 77Ah cells validated with Stellantis and scaled previously in 100+Ah cells
    - Quasi-solid approach positioned as easier to scale while retaining solid-state branding
    - No public yield, cost-per-kWh, or warranty data
  - - Solstice all-solid-state platform
    - Longer-horizon high-performance battery customers
    - Publicly named platform, but assigned evidence gives far less direct validation detail than FEST
    - Sulfide-based all-solid-state chemistry broadens performance roadmap beyond FEST
    - No public cycle-life, abuse-test, or production-readiness detail in assigned sources
  - - Vehicle integration programs
    - Peugeot / Stellantis vehicle-development teams
    - Concept and road-test stage rather than commercial SOP
    - Moves proof from cell data toward real vehicle architecture and charging behavior
    - No public contracted launch volumes or customer economics
  - - Methuen manufacturing site
    - Factorial operations and automotive partners awaiting test cells
    - Pre-production / pilot industrialization asset
    - Domestic assembly footprint and proximity to R&D and headquarters
    - No disclosed line yield, utilization, or quality escape metrics
  notes: Rows synthesize only the assigned public sources; “status / maturity” distinguishes named validation and pilot assets from commercial production evidence.
