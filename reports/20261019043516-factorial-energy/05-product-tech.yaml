  - CE006
  - CE008
  - CE010
  - CE012
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Polymer-based FEST chemistry
    - Nearer-term quasi-solid platform for automotive validation
    - Needs OEM qualification and manufacturing repeatability
    - Could stall if cycle life, safety, or cost targets flatten before SOP
  - - Sulfide-based Solstice chemistry
    - Longer-horizon all-solid-state upside path
    - Needs materials, process, and qualification learning beyond FEST
    - Public validation detail is thinner, so roadmap confidence is lower
  - - Lithium-metal / NMC cell design (reported externally)
    - Enables high-energy-density positioning across both platforms
    - Requires stable interfaces and manufacturable cell construction
    - Externally reported architecture is not backed by a full official technical paper in the assigned evidence
  - - Pack integration with OEMs
    - Turns cell performance into vehicle-level range, charging, and packaging outcomes
    - Depends on Stellantis and other OEM partners for fleet-level proof
    - Road-testing and concept cars do not guarantee production awards
  - - Manufacturing transfer to existing Li-ion infrastructure
    - Reduces capex and speeds industrialization if compatibility holds
    - Depends on process transfer, tooling, and operator know-how
    - No public yield or cost-down bridge proves the compatibility at volume
  notes: Architecture rows mix official statements, partner proof, and one low-confidence external report; where the public record does not disclose certifications or yield data, the risk column states that gap explicitly.
