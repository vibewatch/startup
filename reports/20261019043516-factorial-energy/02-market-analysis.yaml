      - - Qualification threshold
        - Stellantis / 2025
        - Automotive OEM programs
        - "77Ah cells; 375 Wh/kg; >600 cycles; 18-minute 15%-90% charge"
        - Technical-adoption lens for whether the product can clear OEM qualification gates.
