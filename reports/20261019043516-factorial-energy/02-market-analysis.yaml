      - Buyer
      - User
      - Payer
      - Workflow
      - Adoption trigger
    rows:
      - - Global auto OEM programs
        - Automaker battery and vehicle-platform teams
        - Vehicle engineering and pack-integration teams
        - OEM R&D and platform budgets
        - Qualify next-generation cells for range, charging, safety, and weight targets.
        - Automotive-sized cell validation plus a path to real-world fleet testing.
      - - Strategic OEM development partners
        - Mercedes-Benz, Stellantis, Hyundai, and Kia development organizations
        - Joint development, validation, and integration teams
        - Strategic R&D and electrification budgets
        - Co-develop chemistry, pack architecture, and commercialization milestones.
        - Demonstrated technical milestones and existing joint development agreements.
      - - Battery production / pilot-line operations
        - Manufacturing and operations leaders
        - Pilot-line technicians and pack-manufacturing teams
        - Capex and manufacturing budgets
        - Scale cells at pre-production speed and volume for partner programs.
        - Facility readiness, existing-line compatibility, and automotive partner demand.
      - - Defense, AI/robotics, and storage adjacencies
        - Not publicly disclosed
        - System integrators or mission operators not publicly disclosed
        - Not publicly disclosed
        - Evaluate higher energy density and safety in specialized systems.
        - No retained customer proof yet; this remains a marketed adjacency rather than a disclosed demand base.
