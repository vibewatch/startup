callouts:
  - calloutType: insight
    title: Automotive qualification is the real market wedge
    body: >
      Factorial markets multiple end markets, but the retained evidence that is closest to revenue
      conversion is concentrated in automotive OEM qualification, pack integration, and pilot-scale
      manufacturing rather than broad cross-vertical demand.
    claimRefs: [CM001, CM002, CM007, CM013, CM014]
  - calloutType: risk
    title: Market size is still a diligence gap, not a proven revenue base
    body: >
      Public sources offer capital, valuation, and pilot-line proxies, but they still do not
      disclose TAM, contracted volumes, pricing, or royalties, so valuation cannot be underwritten
      from public market-size evidence alone.
    claimRefs: [CM008, CM011, CM015]
