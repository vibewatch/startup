  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议从左侧的真实验证和新增资本出发，落到右侧仍主导投资判断的商业化与融资缺口。
    data:
      nodes:
        - id: validation
          label: OEM / 伙伴验证
          detail: Stellantis 验证了 375Wh/kg 的 77Ah FEST 电芯，仍以 2026 年示范车队为目标。
        - id: scale-path
          label: 规模化路径可见
          detail: 马萨诸塞州制造布局和伙伴驱动模式显示出规模化路径。
        - id: fresh-capital
          label: 新增资本到位
          detail: 2026 年 6 月上市带来新增资本，也形成了当前估值锚点。
        - id: revenue-gap
          label: 收入证明仍缺失
          detail: Troy Technical 引用的公开报道显示，截至 2026 年 6 月 30 日，公司经营收入仍为零。
        - id: financing-risk
          label: 现金跑道和下行空间仍有限
          detail: 公开可见现金仅支持运营至 2028 年第一季度，记录中仍有法律和交易对手风险。
        - id: recommendation
          label: 建议：跟踪 / 估值偏高
          detail: 与其在今天做出买入判断，不如等待商业化转化或更低的入场价格。
      edges:
        - from: validation
          to: scale-path
          label: 技术证明支撑规模化叙事
        - from: scale-path
          to: fresh-capital
          label: 规模化故事支撑融资渠道
        - from: fresh-capital
          to: revenue-gap
          label: 资本本身不能证明商业化
        - from: revenue-gap
          to: financing-risk
          label: 商业化延迟转化为稀释风险
        - from: financing-risk
          to: recommendation
          label: 当前首要是价格纪律
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
