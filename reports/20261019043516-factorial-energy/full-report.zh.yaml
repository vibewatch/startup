  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 已验证电芯转化为可见的汽车及非汽车商业项目；合作伙伴制造降低资本强度；OEM 合作伙伴深化规模化路径。
        - 如果收入证明跟上，可能支撑公开 $1–2.5B 参考区间的上半段，并最终超过 2026 年 6 月交易框架。
        - 执行仍取决于合作伙伴工厂、认证时间和真实合同经济性。
        - 更多合作伙伴制造公告及已发货商业产品将支持这一情景。
      - - 基准
        - 技术验证继续推进，但在下一个报告周期内，收入证明和客户经济性仍然有限。
        - 估值仍锚定在 2026 年 6 月公开入场背景附近，而不是迅速上调重估。
        - 投资者继续为期权价值付费，而现金跑道不断缩短。
        - 这是当前公开来源最一致支持的情景。
      - - 悲观
        - 商业化推迟、强劲收入出现前需要新资本，或关键合作伙伴未能按时扩大项目规模。
        - 公开估值跌破去 SPAC 叙事价值，融资条款成为回报的主要驱动因素。
        - 稀释、重新定价或合作伙伴流失成为主导因素。
        - 如果在明确商业化验证前融资，或重大项目出现延误，叙事就会滑向这一情景。
    notes: 该情景表有意保持定性，因为公开来源没有提供建立精确模型所需的合同、销量或利润率细节。
