        title: 建议框架：技术可信，但投资判断不完整
        blocks:
          - type: paragraph
            body: >-
              公开证据足以支持“观察”观点，但不足以支持买入。Factorial 确实于 2026 年 6 月完成 Nasdaq 上市，交易 headline 对公司的估值约为 $1.3 billion，预期募集总额超过
              $100 million。与此同时，基于 SEC 的 Troy Technical 评估称，截至 2026 年 6 月 30 日现金为 $112.8 million，收入仍为零，已披露计划只为运营和设备提供资金至
              2028 年第一季度。换言之，在公开证据显示持久商业转化、定价或完全透明的稀释机制之前，投资者已经在为技术期权价值和战略合作伙伴可信度付费。
