      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 对这一阶段而言，OEM 验证异常扎实
            body: Factorial 仍未产生收入，但其商业化故事有明确的 JDA、战略 OEM 资本、正在运营的制造基地，以及合作伙伴报告的 2025 年电芯验证里程碑支撑，而不是只靠概念性的实验室说法。
            calloutType: strength
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: callout
            title: 控制权集中与变现仍是核心投资判断缺口
            body: 最强的公开反向信号并不是技术失败披露，而是结构性问题：创始人投票控制权、尚未产生收入的会计状态、de-SPAC 现金注入前的持续经营风险表述，以及对当前现金、客户承诺和累计资本化情况缺乏完整可见性。
            calloutType: risk
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Factorial 自己对边界的定义起点很宽，但在保留证据中很快收窄。官网面向 eMobility、国防和 AI/机器人推广固态电池，Battery-Tech
              也把公司放入电动车和储能工作流。这形成了多垂直市场叙事，但具体市场证据仍主要来自汽车项目、车企合作和车辆集成里程碑，而不是国防、机器人或固定式储能领域已披露的需求。现状替代方案是传统锂离子电池：Factorial
              明确把在役电池描述为笨重且续航受限，而第三方和合作伙伴材料强调安全性、充电速度和能量密度提升，认为买家转用的理由首先是这些性能，而不只是价格领先。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
      - number: '2.2'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              保留来源指向的是面向车企和电池合作伙伴工作流的 B2B 商业化模式，而不是直接获取消费者需求。Dealroom 将主要市场描述为汽车，并称电池预计会先在高规格市场亮相，以检验性能和可制造性；官方及合作伙伴披露则把
              Mercedes-Benz、Stellantis、Hyundai 和 Kia 列为最显眼的开发合作方。因此，采用路径要经过资格认证、Pack 集成和合作伙伴主导的试点项目：Stellantis
              已验证汽车尺寸电芯，并计划在 2026 年推出示范车队；马萨诸塞州基地公告则把产能定位为服务指定汽车合作伙伴的量产前支持，而不是已有广泛预订的订单簿。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              公开材料中的采用逻辑在技术上是清晰的。Battery-Tech 将 FEST 的能量密度归因至最高 390 Wh/kg，将 Solstice 归因至最高 450 Wh/kg；Stellantis 报告 375
              Wh/kg、超过 600 次趋向资格认证的循环、15% 到 90% 的 18 分钟充电窗口、-30 C 到 45 C 的工作温度，以及最高 4C 放电。WaveEP 的 2022
              年融资公告还指出，能够直接兼容现有锂离子制造基础设施，可能降低车企的切换成本。约束同样重要：2023 年基地仍被定位为量产前设施，2026
              年车队仍是示范步骤，保留的公开材料也没有披露定价、特许权使用费、采购承诺或合同量，无法证明技术验证能转化为持久收入。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.4'
        title: 规模测算视角与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >
              公开证据只支持受证据约束的规模测算视角，而不是干净的 TAM/SAM/SOM 分层。最有力的公开数字是公司层面或准备度代理指标：Dealroom 的估值和融资区间、2022 年 $200 million D
              轮融资、$50 million Methuen 基地，以及产线所称的 200 MWh
              产能。这些数字有助于框定投资者信念、投入该类别的融资规模和首个可制造切口的体量，但都不等同于终端市场支出、已签约需求或收入潜力。即便当前资源中心仍展示 2025 年 Stellantis
              里程碑公告，而不是市场规模或定价披露，尽调过程也仍需要买方预算、已承诺的承购量和单位经济性细节，才能把这个市场视为已完成投资判断。
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 汽车资格认证才是真正的市场切口
            body: |
              Factorial 面向多个终端市场，但最接近收入转化的保留证据集中在汽车 OEM 资格认证、Pack 集成和试点规模制造，而不是广泛的跨垂直需求。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
              - CM014
          - type: callout
            title: 市场规模仍是尽调缺口，不是已验证的收入基础
            body: |
              公开来源提供了资本、估值和试点产线代理指标，但仍未披露 TAM、合同量、定价或特许权使用费，因此不能仅凭公开市场规模证据完成估值判断。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、替代方案与潜在进入者类别
        blocks:
          - type: paragraph
            body: >-
              保留证据指向的竞争集合比“其他固态电池初创公司”更宽。Factorial 围绕 eMobility、国防和 AI/机器人定位，因此其争夺对象是 OEM
              和电池制造商未来的平台决策，而不是狭窄的实验室细分市场。Dealroom 的同业预览列出 QuantumScape、SES AI、Nyobolt、Beijing Weilan、Amprius 和 StoreDot
              等直接及相邻电池开发商；一篇独立对比文章则将现实替代集合描述为当前可供使用的传统锂离子供应、QuantumScape 的公开固态电池项目和 Toyota
              的内部固态电池项目。在投资判断中，现状和初创同业同样重要：在役锂离子供应和 OEM 自有项目，都可能推迟或吸收原本用于 Factorial 部署的同一笔买方预算。
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP015
              - CP016
      - number: '3.2'
        title: 公开差异化靠证据，而不只是叙事
        blocks:
          - type: paragraph
            body: >-
              Factorial 最强的公开优势在于，其商业化故事不只是品牌包装。公司称马萨诸塞州制造基地建设投入 $50 million，足以支持一条 200 MWh 装配线；Stellantis 也单独描述了经过验证的
              77Ah FEST 电芯，其能量密度为 375 Wh/kg，15% 到超过 90% 的充电时间为 18 分钟，并计划在 2026 年推出示范车队。这些事实不能证明大规模生产或经济性，但确实让 Factorial
              超越了纯概念定位。相较于保留来源细节更少的私有同业，合作伙伴验证、大尺寸电芯证据和可见的美国试点产线路径组合，是这一竞争池中最清晰的公开差异化信号。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
              - CP016
      - number: '3.3'
        title: 渠道杠杆来自合作伙伴，但锁定效应尚未证实
        blocks:
          - type: paragraph
            body: >-
              保留来源中的市场路径由合作伙伴主导，而不是由直接价格主导。Factorial 的官方及联合发布材料强调与 Mercedes-Benz、Stellantis 和 Hyundai 的联合开发协议；后来的
              Simplify 资料则把公司描述为无晶圆厂模式，依靠 SK On 和 Mitsui Kinzoku 等合作伙伴推进产业化。这种结构可以在无需独立建设超级工厂的情况下加快进入 OEM
              项目，但也意味着公开商业条款中还看不到切换成本。现有官方及合作伙伴来源仍没有公开目录价、特许权使用费安排或具有约束力的采购承诺细节，无法说明试点成功能否转化为持久份额或利润率。
            claimRefs:
              - CP005
              - CP008
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: 持久护城河尚未形成定论
        blocks:
          - type: paragraph
            body: >-
              这一竞争池中的反向证据，与其说是技术失败，不如说是时间和议价能力问题。Simplify 的批评观点明确称 SK On 制造 MOU 不具约束力，并警告 Toyota
              和中国电池企业正在加速商业化；独立对比来源也提醒读者，传统锂离子电池现在就能供应，而 Factorial 仍处于试点阶段。因此，Factorial
              的护城河故事可信但不完整：公开证据强于许多初创公司的叙事，但公司仍需在面对在役供应商、OEM 内部项目和其他固态电池专业厂商时，把合作伙伴验证转成有约束力的产量、透明的经济性和稳定的生产，才能证明竞争持久性。
            claimRefs:
              - CP009
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可见的 OEM 验证是主要竞争资产
            body: 与许多私有电池初创公司相比，Factorial 在公开来源中的合作伙伴证据异常可见：车企 JDA、公开的试点产线叙事，以及明确的 Stellantis 示范车队路径。
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP014
          - type: callout
            title: 经济性与有约束力的需求仍是弱项
            body: 保留证据仍未显示公开定价、特许权使用费安排或具有约束力的采购承诺，因此公司的竞争杠杆比其变现能力或锁定效应更容易观察。
            calloutType: risk
            claimRefs:
              - CP009
              - CP013
              - CP016
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 合作伙伴主导的收入仍早于通常的汽车投资判断案例
        blocks:
          - type: paragraph
            body: >-
              公开证据仍将 Factorial 描述为通过 OEM 和电池制造商关系变现的技术供应商，而不是直接销售整车，或采用已披露的装机量软件模式。Dealroom 称公司向汽车制造商销售 FEST；Stellantis
