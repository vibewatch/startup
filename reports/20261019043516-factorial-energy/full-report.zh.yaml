chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Factorial 如今是上市的商业化前固态电池开发商，而不是依靠风险投资的实验室项目：公司与 Cartesian Growth Corporation III 的 de-SPAC 于 2026 年 6 月 5
              日完成，随后更名为 Factorial Energy Inc.，股票以 FAC
              代码开始交易。由于联合开发协议仍不计入收入确认，管理层也表示有意义的产品收入要等资格认证完成、制造规模扩大并把合作伙伴项目转为商业供应，公司仍处于研发密集型商业化阶段。公司官网和监管文件中的产品定位一致：FEST、Solstice
              和 Gammatron 都被定位为面向 eMobility、国防、AI/机器人及相邻储能场景的高性能固态平台，采用合作伙伴主导的制造模式，而不是独立建设超级工厂。
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: 领导层、治理与控制权
        blocks:
          - type: paragraph
            body: >-
              公司的运营身份仍以创始团队为核心。SEC 材料将 Siyu Huang 和 Alex Yu 列为历史创始人，并显示两人通过上市后的超投票权 B 轮股份保留 62.9%
              的总投票权，这使一家新上市工业科技公司的公众市场少数股东治理异常集中。领导层覆盖面也不只是两位创始人：Joe Taylor 作为执行董事长负责制造规模化和上市公司形象，Mercedes-Benz 与
              Stellantis 也各自通过投资方指定董事拥有董事会席位。不过，这仍是一项高度依赖关键人物的业务：创始团队的连续性、与 OEM
              董事的协调，以及战略合作伙伴继续出资或验证项目的意愿，都会对执行结果产生不成比例的影响。
            claimRefs:
              - CO003
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO010
              - CO015
              - CO016
      - number: '1.3'
        title: 资本基础、运营足迹与里程碑路径
        blocks:
          - type: paragraph
            body: >-
              公开可见的资本和规模指标颇具分量，但仍不完整。Factorial 于 2022 年 1 月披露 $200 million D 轮融资，并于 2026 年 6 月取得约 $112.1 million 的
              de-SPAC 和 PIPE 募集总额，但现有公开记录仍无法完整核对累计融资、当前现金或交易完成后的摊薄持股。运营方面，公司从 2022 年的试点表述推进到 2023 年的 Methuen 制造基地，以及
              2025 年经 Stellantis 合作验证的 77Ah FEST 电芯；与许多固态电池同业相比，这些是更有力的技术进展证据。投资者剩下的挑战，是在避免反复稀释或工程验证与 SOP
              规模生产之间长期脱节的情况下，把这些里程碑转成产生收入的商业项目。
            claimRefs:
              - CO002
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
