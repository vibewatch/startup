      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 除非证据或价格改善，否则保持观察
            body: Factorial 在战略上很有价值，但当前公开证据定价的未来成功多于已证明的成功。更好的判断需要更低的进入价格、更清晰的经济性，或两者兼具。
            calloutType: recommendation
            claimRefs:
