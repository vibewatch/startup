      - number: '8.4'
        title: 尽调问题与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              决定性的尽调问题不是泛泛讨论 TAM，而是合同、股权结构和转化问题。若要给出更建设性的建议，需要公开材料或尽调室证据证明具有约束力的采购承诺、定价或许可经济性，以及 SPAC
              交易完成后完全摊薄的持股和优先股堆叠。如果 Factorial
              在证明持续商业收入前就需要新资本，核心汽车合作伙伴行使终止权或让项目明显延期，或者管理层无法证明制造合作与现有产线足以在无需大幅增加资本投入的情况下把验证电芯转为可重复发货，投资逻辑就会破裂。
            claimRefs:
              - CV003
              - CV004
              - CV006
