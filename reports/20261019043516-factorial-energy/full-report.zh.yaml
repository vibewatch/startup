      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              故事中可投资的部分确实存在。Stellantis 表示 Factorial 已验证 77Ah FEST 电芯，达到 375Wh/kg，可在 18 分钟内从 15% 快充至超过 90%，并仍以 2026
              年示范车队为目标。Factorial 及其联合发布材料还展示了合作伙伴主导的制造策略、具备 200MWh 能力的马萨诸塞州基地，以及保留 2025 年 4 月 Stellantis
              里程碑的公司资源档案。反向逻辑同样重要：Troy Technical 仍将公司描述为商业化前、经营收入记录为零；合同终止权、正在进行的仲裁，以及对客户经济性缺乏公开可见性，使得仅凭当前披露很难为溢价估值倍数辩护。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
