              - CV012
      - number: '8.3'
        title: 情景纪律
        blocks:
          - type: paragraph
            body: >-
              公开来源只支持基于里程碑的情景框架，不支持精确建模。上行情景取决于经过验证的电芯进入可见的商业项目、合作伙伴制造转化为可重复发货，以及公司证明轻资产定位确实能压低未来资本密集度。基准情景是公开估值继续锚定在
              2026 年 6 月上市背景附近，投资者等待商业收入和更清晰的经济性。下行情景则是现金续接或产量延误在强收入证据出现前发生，导致再资本化压力，或市场估值跌破 de-SPAC 叙事价值。
            claimRefs:
