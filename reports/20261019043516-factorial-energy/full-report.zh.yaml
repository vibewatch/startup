  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据显示，路径从平台研发到 OEM 验证、伙伴驱动的规模化，再到细分市场的初步商业化；目前尚未披露汽车批量收入。
    data:
      nodes:
        - id: platforms
          label: 平台与终端市场
          summary: FEST and Solstice are positioned for eMobility, defense, and AI/robotics.
          note: 多元终端市场扩大了选择空间，但也意味着不同的商业化节奏。
          claimRefs:
            - CI001
            - CI002
        - id: oem-validation
          label: OEM 验证项目
          summary: Dealroom and Stellantis frame the business around OEM and battery-manufacturer adoption.
          note: 验证和示范车队是比收入更强的技术信号。
          claimRefs:
            - CI003
            - CI006
        - id: preproduction
          label: 内部试生产线
          value: 200
          unit: MWh footprint
          summary: The Methuen site provides pilot and pre-production support for partner programs.
          note: 披露的 $50M 工厂投资颇具分量，但距离超级工厂规模仍很远。
          claimRefs:
            - CI004
            - CI005
        - id: partner-scaleup
          label: 伙伴制造规模化
          summary: The scale-up model depends on existing lithium-ion infrastructure and partner qualification.
          note: SK On 路径仍不具约束力，因此工业化尚未由合同锁定。
          claimRefs:
            - CI002
            - CI009
            - CI013
        - id: first-revenue
          label: 初始商业收入
          value: 2027
          unit: target year
          summary: Independent reporting says the first revenue target is 2027 and tied to specialty orders.
          note: 早期商业化在无人机和超级跑车领域看起来比主流电动车更近。
          claimRefs:
            - CI010
        - id: auto-volume
          label: 汽车批量收入
          summary: Larger automotive revenue still requires qualified partner lines, signed contracts, and disclosed economics.
          note: 这是公开记录中最大的剩余投资判断缺口。
          claimRefs:
            - CI006
            - CI013
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI009
      - CI010
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，公司采用分层运营模式：从终端市场项目，延伸到双化学体系平台、OEM 验证和伙伴驱动的规模化。
    data:
      layers:
        - label: 终端市场项目
          items:
            - 汽车 OEM 项目
            - 航空航天 / 无人机电池
            - 国防、机器人及储能相邻市场
          outputs:
            - 特定应用的验证和部署要求
        - label: 电芯平台
          items:
            - FEST 准固态平台
            - Solstice 全固态平台
          outputs:
            - 近期验证路径与长期化学体系上行空间
        - label: 电芯设计与性能证明
          items:
            - 77Ah 汽车尺寸 FEST 电芯
            - 外部报道的无负极锂金属 / NMC 架构
          outputs:
            - 375Wh/kg、600+ 次循环、快充及温度范围宣称
        - label: 工业化栈
          modules:
            - Methuen 试生产线
            - 兼容现有锂离子设备
            - OEM 电池包集成工作
          outputs:
            - 100+Ah 扩展宣称及 200MWh 装配线产能
        - label: 生态依赖
          items:
            - Stellantis 及其他 OEM JDA
            - 涵盖材料、工装和制造伙伴的供应商联盟
          outputs:
            - 商业化速度仍取决于伙伴
        - label: 公开证明面
          items:
            - 伙伴验证公告和公司里程碑文章
            - 公开认证、质量和良率披露有限
          outputs:
            - 公开证据更能证明里程碑，而不是规模化准备度控制
    approximationNotes: 该图为定性分析：它整理公开记录的体系和依赖关系，不宣称完整物料清单或精确工艺流程。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE010
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开客户证据呈现出分阶段路径：先组建战略伙伴关系，再验证样品，之后仍有待解决的跨越，才能进入规模化商业项目。
    data:
      items:
        - label: 车企与投资方组建
          phase: 2021-2022
          channel: 战略投资加 JDA
          touchpoints:
            - Mercedes-Benz 和 Stellantis 领投的 D 轮融资
            - 披露与 Mercedes-Benz、Stellantis 和 Hyundai 签署的 JDA
        - label: 客户测试供货准备
          phase: 2022
          channel: 试生产
          touchpoints:
            - 计划由试点工厂生产供客户测试的电池
        - label: 汽车伙伴制造支持
          phase: 2023
          channel: 试生产线
          touchpoints:
            - Methuen 工厂为满足汽车伙伴需求而建
            - 披露最高 200MWh 装配线产能
        - label: 样品交付与验证
          phase: 2023-2024
          channel: 技术里程碑证明
          touchpoints:
            - Electrek 存档称 A 样品已交付汽车伙伴
            - Electrek 存档称 106+Ah 电芯已送达 Mercedes-Benz 验证
        - label: 车辆集成与车队示范
          phase: 2025-2026
          channel: 具名客户验证
          touchpoints:
            - Stellantis 验证了达到 375Wh/kg 的 77Ah FEST 电芯
            - 目标在 2026 年部署示范车队
        - label: 商业扩张决策
          phase: 开放
          channel: 落地后扩张闭环
          touchpoints:
            - 来源池中没有公开定价、采购承诺或续约指标
            - 旗舰项目转化为收入仍未经证明
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最大的剩余风险集中在商业化时间、伙伴集中度和融资可见度，而不只是基础技术新颖性。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 汽车认证延迟
          values:
            - label: 高
              tone: risk
              note: 2025 年验证仍被描述为正在推进汽车认证
            - label: 高
              tone: risk
              note: 示范车队延迟将推迟商业化证明
            - label: 中
              tone: warning
              note: OEM 测试真实存在，但认证项目尚未完成
            - label: 高
              tone: risk
              note: 量产证明仍未公开
        - label: 从试生产到批量制造的爬坡
          values:
            - label: 高
              tone: risk
              note: 公开证明仍集中在试生产规模
            - label: 高
              tone: risk
              note: 良率或产能未达预期将冲击进度和资金需求
            - label: 中
              tone: neutral
              note: 兼容现有设备和新增工厂有帮助，但不能证明良率
            - label: 高
              tone: risk
              note: 没有公开良率
              scrap: null
              or warranty disclosure: null
        - label: 伙伴集中与重新排序
          values:
            - label: 中高
              tone: risk
              note: OEM 和制造交易对手具有战略意义，但较为集中
            - label: 高
              tone: risk
              note: 商业化证明依赖少数伙伴
            - label: 中
              tone: neutral
              note: 多个 OEM 降低单一交易对手失败风险
            - label: 中高
              tone: risk
              note: 新的 MOU 仍需转化为实际执行
        - label: 融资与商业化经济性不透明
