  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 公开支持
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑
        - 在可比的尚无收入阶段，OEM 和合作伙伴验证强于多数电池初创公司。
        - Stellantis 已验证 77Ah FEST 电芯；Mercedes-Benz、Stellantis、Hyundai/Kia 都出现在融资和开发关系中。
        - 如果能看到验证转化为持续商业出货，投资逻辑会明显增强。
      - - 反向逻辑
        - 公开估值仍超过已披露的商业证明。
        - Troy Technical 报告零收入、现金跑道有限，以及经济性方面持续存在披露缺口；Dealroom 仍显示独角兽估值区间。
        - 带定价、利润率和最低采购量条款的已签合同将缩小这一缺口。
      - - 决策转折点
        - 投资判断取决于价格和证据，而不是单纯的技术质量评分。
        - 公司可能具有战略价值，但当前证据看起来仍是期权价值，而不是已纳入投资判断的运营证明。
        - 更低的入场价格或更完整的经济性披露，可能令判断上调。
    notes: 这是方向性综合表；当客户经济性或新融资条款披露后，应重新审视这些基于公开披露的论点。
