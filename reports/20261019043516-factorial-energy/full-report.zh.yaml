            body: >-
              Factorial 销售的与其说是通用电池故事，不如说是一套面向客户工作流的产品组合：客户需要更高能量、更安全的电芯，却不想重建下游每一个制造环节。官方主页和 LinkedIn
              资料首先把公司定位在移动出行领域，同时也把可服务范围延伸到航空航天、国防、机器人和更广泛的储能应用。在这一范围内，公开产品组合分成两条有明确名称的化学路线：FEST 被 Factorial
              描述为准固态平台，Solstice 则被描述为硫化物基全固态平台。这种双路线定位很重要，因为它表明公司试图同时服务近期汽车资格认证和更长期的性能上行，而不是把公司押在单一化学路线图上。
