  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding-visibility
      missingEvidence: Exact lifetime capital raised, current unrestricted cash, and a post-close fully diluted ownership table.
      whyItMatters: These items determine how much runway remains and whether the public listing solved financing risk or only delayed another dilution cycle.
      diligencePath: Obtain the next quarterly filing and cap-table bridge, then reconcile PIPE, warrant, founder, and strategic-investor ownership.
      relatedQuestionRefs: [QO003, QO009]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: customer-commercialization
      missingEvidence: Binding purchase commitments, pricing, royalty economics, and named commercial customer counts.
      whyItMatters: Technical validation is not enough to underwrite revenue timing, gross margin potential, or valuation support without contract conversion evidence.
      diligencePath: Request OEM program milestones, commercial agreement terms, and any disclosed backlog or purchase-order metrics.
      relatedQuestionRefs: [QO005, QO009]
    - type: conflicting-data
      severity: minor
      topic: corporate-identity
      missingEvidence: A canonical headquarters label and a clean corporate chronology from the 2013 origin story through the 2026 listed entity.
      whyItMatters: Identity ambiguity is not thesis-breaking, but it weakens diligence hygiene and complicates later cross-chapter references to location, facilities, and founding history.
      diligencePath: Confirm the official headquarters, incorporation history, and major site roles directly with investor relations or the next annual filing.
      relatedQuestionRefs: [QO001, QO010]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: minor
      topic: headcount
      missingEvidence: A primary-source employee count or more recent independent workforce disclosure.
      whyItMatters: Headcount is one of the requested cover metrics and a useful proxy for cost structure, manufacturing readiness, and multi-site operating complexity.
      diligencePath: Check a later 10-Q or 10-K, investor deck, or management response that explicitly states employee count by region or function.
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO001]
