callouts:
  - calloutType: strength
    title: OEM validation is unusually real for this stage
    body: >-
      Factorial is still pre-revenue, but its commercialization story is anchored by named JDAs,
      strategic OEM capital, an operational manufacturing site, and a partner-reported 2025 cell
      validation milestone rather than by purely conceptual lab claims.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
  - calloutType: risk
    title: Control concentration and monetization remain the key underwriting gap
    body: >-
      The strongest public adverse signals are not technical failure disclosures but structural
      ones: founder voting control, pre-revenue accounting, prior going-concern language before
      the de-SPAC cash infusion, and incomplete visibility into current cash, customer
      commitments, and full lifetime capitalization.
    claimRefs: [CO003, CO004, CO005, CO013]
