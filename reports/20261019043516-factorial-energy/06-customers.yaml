schemaVersion: report-v2
artifact: customers
slug: factorial-energy
runDate: 2026-10-19
company:
  name: Factorial Energy
chapter:
  number: 6
  title: Customers
  summary: >-
    Factorial's public customer evidence is materially stronger on OEM validation than on
    commercial breadth. The assigned source set supports real automotive adoption interest,
    especially through Stellantis and Mercedes-related milestones, but it does not disclose
    customer counts, retention, contract economics, or binding purchase commitments.
sections:
  - id: customer-mix
    title: Customer mix is narrow, B2B, and OEM-led
    body: >-
      Public evidence portrays Factorial as a business-to-business battery supplier selling
      into a narrow set of complex automotive programs rather than a diversified end-market
      franchise. The homepage markets batteries for eMobility, defense, and AI/robotics,
      and Dealroom likewise frames the company as B2B with automotive OEMs and battery
      manufacturers as the primary market. But the named-customer set in this pool is still
      concentrated: Mercedes-Benz, Stellantis, Hyundai Motor Company, and Kia Corporation
      recur across public materials, while a live customer-count denominator is absent. That
      concentration matters because each disclosed relationship appears strategic and
      technically intensive, implying long sales cycles and high dependence on a few flagship
      OEM programs rather than many small accounts.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU013
    tableRefs:
      - TU001
  - id: adoption-proof
    title: Adoption proof shows technical progression, not yet volume conversion
    body: >-
      The strongest adoption proof is milestone-based rather than revenue-based. In 2022,
      Factorial said its pilot production facility would produce batteries for customer
      testing and linked commercialization to joint development agreements with
      Mercedes-Benz, Stellantis, and Hyundai. In 2023, it opened the Methuen line and said
      the site would serve automotive-partner needs at up to 200MWh preproduction scale.
      The clearest named customer proof comes from Stellantis' April 2025 disclosure:
      validated 77Ah FEST cells, 375Wh/kg energy density, fast charging, and a
      demonstration-fleet plan by 2026. Electrek's archive reinforces the sequence from
      A-sample shipments to Mercedes validation and road-test headlines, while a
      low-reliability Cheonan interview-prep page suggests customer or partner visits are
      operationally relevant on site.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
      - CU012
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU001
  - id: durability-and-concentration
    title: Durability and expansion remain underdisclosed
    body: >-
      What remains missing is the durability layer that investors would need to underwrite
      recurring demand. None of the assigned sources disclose customer count, contract
      length, renewal behavior, churn, NRR or GRR, pricing, or purchase obligations. Even
      the strongest proofs—Stellantis validation and Mercedes-focused media milestones—still
      sit on the precommercial side of the boundary between engineering success and program
      revenue. Electrek's note that the specific OEM recipients of A-samples were "up for
      dispute" adds a useful caution: public momentum does not equal transparent customer
      breadth. The result is a chapter that supports real adoption interest, but not yet
      diversified, contract-backed customer durability.
    claimRefs:
      - CU002
      - CU009
      - CU011
      - CU013
tables:
  - id: TU001
    title: Customer segmentation
    columns:
      - Segment
      - Buyer / user / payer
      - Geography / surface
      - Public proof
      - Strategic value
      - Gap
    rows:
      - - Automotive OEM development partners
        - OEM engineering and battery teams / vehicle programs / auto OEMs
        - US, Europe, and Korea across official and partner disclosures
        - Named set repeatedly includes Mercedes-Benz, Stellantis, Hyundai Motor Company, and Kia Corporation
        - Core route to first vehicle programs and qualification
        - No disclosed commercial volumes, pricing, or SOP timing
      - - Strategic investor-partners
        - Corporate investors and engineering sponsors / auto OEM strategy teams / same counterparties
        - 2022 funding round surface
        - Mercedes-Benz and Stellantis led the Series D while also appearing in development disclosures
        - Capital plus technical validation can accelerate program depth
        - Governance rights and commercial terms are undisclosed
      - - Preproduction sample-testing recipients
        - Validation labs and integration teams / engineering users / prospective OEM buyers
        - Global automotive-partner testing narrative
        - Electrek reports A-samples to automotive partners and Mercedes-focused validation progress
        - Shows movement beyond lab-only chemistry work
        - Exact recipient list and sample volumes remain only partly public
      - - Adjacent high-spec targets
        - Defense, AI/robotics, and other specialized integrators / technical users / enterprise buyers
        - Homepage positioning
        - Official messaging markets batteries beyond passenger EVs
        - Potential expansion path beyond flagship auto programs
        - Named customers in these adjacencies are absent from the assigned pool
    notes: >-
      Public segmentation evidence mixes official positioning, partner disclosures, and media
      reporting; blanks on volume or economics reflect missing public denominators rather than
      zero activity.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU011
      - CU012
      - CU013
  - id: TU002
    title: Customer growth / adoption trajectory
    columns:
      - Milestone metric
      - Value / signal
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Strategic customer formation
        - $200M Series D plus JDAs with Mercedes-Benz, Stellantis, and Hyundai
        - "2022-01-20"
        - Wave Equity Partners / GlobeNewswire repost
        - Medium
        - Shows strategic customers were engaged before commercialization
        - No contract value, purchase volume, or launch timetable
      - - Customer-testing supply path
        - Pilot production facility planned to produce batteries for customer testing
        - "2022-01-20"
        - Wave Equity Partners / GlobeNewswire repost
        - Medium
        - Indicates movement from R&D toward structured external validation
        - No sample count, test-success rate, or repeat-order data
      - - Preproduction manufacturing support
        - Methuen site to meet automotive-partner needs; up to 200MWh assembly line; 150+ jobs
        - "2023-10-23"
        - Factorial press release via Business Wire
        - Medium
        - Demonstrates infrastructure for partner programs
        - No committed off-take, utilization, or SOP customer disclosed
      - - Flagship customer validation
        - 77Ah FEST cells, 375Wh/kg, 15%-90% charge in 18 minutes, 600+ cycles, demo fleet by 2026
        - "2025-04-24"
        - Stellantis press release
        - High
        - Strongest dated production-adjacent proof in the pool
        - Still a flagship milestone rather than disclosed commercial revenue
      - - Media-observed adoption progression
        - Archive shows A-samples to automotive partners, Mercedes validation, road-test headlines, and shipping certification
        - 2023-2026
        - Electrek archive page
        - Medium
        - Public narrative shows repeated technical progression
        - Archive snippets do not quantify active programs or customer count
      - - Company scaling proxies
        - 132 employees, 17 open positions, 32K monthly visits, +6.5% one-year team growth
        - 2026 current
        - Dealroom profile
        - Medium
        - Company is staffing and presenting for scale
        - These are company proxies, not customer-adoption denominators
    notes: >-
      This is an adoption-signal table, not a revenue funnel; several rows measure technical
      or operating progress because the assigned public sources do not disclose customer
      cohorts, booked revenue, or renewal metrics.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU011
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Stellantis
        - Global auto OEM and strategic investor
        - Validated 77Ah FEST cells and planned demonstration-fleet integration
        - Pilot / preproduction validation
        - Strongest named customer proof in the assigned pool
        - No binding procurement volume, pricing, or series-production launch disclosed
      - - Mercedes-Benz
        - Premium auto OEM
        - Electrek archive reports 106+Ah cells delivered for EV validation and road-test headlines
        - Pilot / validation
        - Repeated public proof that the program advanced beyond concept-stage chemistry
        - Archive snippets do not disclose purchase volumes or a production contract
      - - Hyundai Motor Company / Kia Corporation
        - Global auto OEMs
        - Named in JDA and leading-automaker disclosures tied to commercialization
        - Development partnership / undisclosed pilot stage
        - Demonstrates breadth beyond one OEM family
        - No separate deployment, volume, or timing evidence in this pool
    notes: >-
      Enumeration is intentionally partial because the assigned pool supports only a sample
      of named counterparties; logos or unnamed partners were excluded where the fetched text
      did not establish specific deployment detail.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates only named counterparties with fetched text in the assigned pool that
        speaks to deployment, testing, or development stage; it is not a complete customer
        roster.
