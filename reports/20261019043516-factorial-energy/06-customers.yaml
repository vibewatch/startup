    title: Flagship OEM proof is real
    body: >-
      The Stellantis disclosure goes beyond a logo slide: it names validated-cell
      performance, charging behavior, and a demonstration-fleet plan, while other public
      materials repeatedly reference Mercedes-Benz and Hyundai or Kia programs.
    claimRefs:
      - CU002
      - CU006
      - CU008
  - calloutType: risk
    title: Customer proof is still narrow and non-economic
    body: >-
      The evidence base is concentrated in a handful of automotive counterparties and
      milestone announcements; the assigned sources never disclose customer count, retention,
      contract length, pricing, or binding purchase commitments.
    claimRefs:
      - CU009
      - CU013
