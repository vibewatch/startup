    title: Customer journey map
    type: journey-map
    summary: >-
      Public customer evidence follows a staged path from strategic partner formation to
      sample validation and then an unresolved jump to scaled commercial programs.
    data:
      items:
        - label: Automaker and investor formation
          phase: 2021-2022
          channel: Strategic investment plus JDA
          touchpoints:
            - Series D led by Mercedes-Benz and Stellantis
            - JDAs disclosed with Mercedes-Benz, Stellantis, and Hyundai
        - label: Customer-testing supply readiness
          phase: 2022
          channel: Pilot production
          touchpoints:
            - Pilot facility planned to produce batteries for customer testing
        - label: Automotive-partner manufacturing support
          phase: 2023
          channel: Preproduction line
          touchpoints:
            - Methuen facility built to meet automotive-partner needs
            - Up to 200MWh assembly-line capacity disclosed
        - label: Sample shipment and validation
          phase: 2023-2024
          channel: Technical milestone proof
          touchpoints:
            - Electrek archive says A-samples shipped to automotive partners
            - Electrek archive says 106+Ah cells reached Mercedes-Benz for validation
        - label: Vehicle integration and fleet demo
          phase: 2025-2026
          channel: Named customer validation
          touchpoints:
            - Stellantis validated 77Ah FEST cells at 375Wh/kg
            - Demonstration fleet targeted by 2026
        - label: Commercial expansion decision
          phase: Open
          channel: Land-and-expand loop
          touchpoints:
            - No public pricing, purchase commitments, or renewal metrics in the pool
            - Revenue conversion from flagship programs remains unproven
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU012
      - CU013
