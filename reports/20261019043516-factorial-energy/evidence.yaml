evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-visibility
    missingEvidence: Exact lifetime capital raised, current unrestricted cash, and a post-close fully diluted ownership table.
    whyItMatters: >-
      These items determine how much runway remains and whether the public listing solved financing risk or only delayed
      another dilution cycle.
    diligencePath: >-
      Obtain the next quarterly filing and cap-table bridge, then reconcile PIPE, warrant, founder, and
      strategic-investor ownership.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-commercialization
    missingEvidence: Binding purchase commitments, pricing, royalty economics, and named commercial customer counts.
    whyItMatters: >-
      Technical validation is not enough to underwrite revenue timing, gross margin potential, or valuation support
      without contract conversion evidence.
    diligencePath: Request OEM program milestones, commercial agreement terms, and any disclosed backlog or purchase-order metrics.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: conflicting-data
    severity: minor
    topic: corporate-identity
    missingEvidence: >-
      A canonical headquarters label and a clean corporate chronology from the 2013 origin story through the 2026 listed
      entity.
    whyItMatters: >-
      Identity ambiguity is not thesis-breaking, but it weakens diligence hygiene and complicates later cross-chapter
      references to location, facilities, and founding history.
    diligencePath: >-
      Confirm the official headquarters, incorporation history, and major site roles directly with investor relations or
      the next annual filing.
    relatedQuestionRefs:
      - QO001
      - QO010
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A primary-source employee count or more recent independent workforce disclosure.
    whyItMatters: >-
      Headcount is one of the requested cover metrics and a useful proxy for cost structure, manufacturing readiness,
      and multi-site operating complexity.
    diligencePath: >-
      Check a later 10-Q or 10-K, investor deck, or management response that explicitly states employee count by region
      or function.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Program-level purchase commitments, pricing, royalty terms, and forecasted contract volumes by buyer or platform.
    whyItMatters: >-
      Without those disclosures, valuation cannot be tied to a source-backed TAM/SAM/SOM or to revenue conversion from
      the named automotive programs.
    diligencePath: >-
      Request signed offtake, pricing, and program-volume schedules by OEM partner and reconcile them to manufacturing
      ramp assumptions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adjacency-demand
    missingEvidence: >-
      Independent customer or procurement proof for defense, AI/robotics, or energy-storage demand outside automotive
      pilots.
    whyItMatters: >-
      The company markets these adjacencies, but the retained evidence does not show whether they are real near-term
      buyers or only optional future narratives.
    diligencePath: >-
      Ask for named pilots, procurement pathways, or customer references for non-automotive programs and compare them
      with the automotive pipeline.
    relatedQuestionRefs:
      - QM001
      - QM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public contract terms, list pricing, royalty structures, and minimum-volume commitments for Factorial and named
      alternatives.
    whyItMatters: >-
      Without commercial terms, investors can see proof points and partner names but still cannot underwrite competitive
      share, margin, or switching-cost durability.
    diligencePath: >-
      Request OEM and manufacturing-partner commercial exhibits, sample pricing schedules, and any pilot-to-production
      volume commitments.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: partner-commitment-depth
    missingEvidence: Binding milestones or remedies that convert MOUs and JDAs into production commitments.
    whyItMatters: >-
      The chapter's moat case depends on whether public partnership signals create durable access or remain revocable
      proof-of-concept relationships.
    diligencePath: >-
      Obtain signed milestone schedules, exclusivity terms, capex obligations, and cancellation triggers for the major
      OEM and industrialization partners.
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: minor
    topic: independent-benchmarking
    missingEvidence: Independent like-for-like third-party cell benchmarks against named solid-state and lithium-ion alternatives.
    whyItMatters: >-
      Public performance claims are informative, but buyer conversion depends on comparative proof under common test
      conditions.
    diligencePath: >-
      Seek third-party teardown, test-lab, or OEM procurement benchmarks that compare density, charging, temperature
      performance, and manufacturability on the same basis.
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Signed price sheets, royalty schedules, and minimum-volume commitments for OEM, battery-maker, and
      specialty-program customers.
    whyItMatters: >-
      Public milestones cannot be converted into revenue quality, contribution margin, or demand durability without
      contract economics.
    diligencePath: >-
      Request executed customer agreements, current quoting templates, and board reporting on pipeline-to-booking
      conversion.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Platform-level gross margin, yield, scrap, warranty reserve, and working-capital data for FEST and Solstice
      programs.
    whyItMatters: >-
      Existing-equipment compatibility is a strategic claim, but investors still cannot test whether production
      economics improve at commercial scale.
    diligencePath: >-
      Obtain manufacturing KPI dashboards, BOM assumptions, and recent plant-level cost reviews from finance and
      operations.
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: liquidity-update
    missingEvidence: Post-June-2026 monthly cash bridge, any debt or project-finance obligations, and 2027 capex phasing.
    whyItMatters: Net losses and guided capex do not prove runway length, covenant headroom, or dilution timing.
    diligencePath: >-
      Request treasury cash reports, financing agreements, and the current 12-month operating plan approved by the
      board.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: quality-and-safety-proof
    missingEvidence: >-
      Third-party safety certifications, abuse-test summaries, PPAP-style qualification gates, and quality-system
      credentials for FEST, Solstice, and the Methuen line.
    whyItMatters: >-
      Battery performance headlines do not prove field safety, automotive qualification discipline, or process control
      under volume manufacturing.
    diligencePath: >-
      Request external test reports, ISO/IATF credentials, incident history, and customer qualification checklists tied
      to named programs.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: yield-and-cost-bridge
    missingEvidence: >-
      Cell yield, scrap, throughput, capex per MWh, and cost-down assumptions connecting pilot output to scaled
      production.
    whyItMatters: >-
      Without manufacturing economics and yield data, the compatibility-with-existing-lines thesis remains directionally
      attractive but not underwritten.
    diligencePath: >-
      Ask management and manufacturing partners for pilot-line KPIs, transfer assumptions, and the milestones required
      before customer SOP.
    relatedQuestionRefs:
      - QE004
      - QE005
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: commercial-program-conversion
    missingEvidence: >-
      Named production SOP dates, contracted cell volumes, pricing or royalty structures, and binding launch commitments
      beyond concept or demo vehicles.
    whyItMatters: >-
      Public proof today shows technical progress, but not enough commercial conversion to judge how quickly validation
      becomes durable revenue.
    diligencePath: >-
      Request signed program timelines, minimum-volume commitments, and the criteria customers must clear before moving
      from demo fleets to production sourcing.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
