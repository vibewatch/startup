      underwriting of market willingness to pay.
    diligencePath: Ask for anonymized customer ROI studies or implementation business cases used in enterprise sales.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: win-loss
