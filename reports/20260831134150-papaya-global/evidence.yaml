evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and formal governance-control map for Papaya Global.
    whyItMatters: >-
      Founder continuity looks positive, but investors still need to understand how much independent oversight exists
      beneath the public founder narrative.
    diligencePath: >-
      Request the latest board deck, corporate governance summary, and cap-table-linked governance schedule from
      management.
    relatedQuestionRefs:
      - QO032
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, customer concentration, and cap-table materials for 2024-2026.
    whyItMatters: >-
      The investment case depends on revenue quality and dilution terms, but public sources only provide ranges and
      third-party estimates.
    diligencePath: >-
      Obtain audited financial statements, monthly KPI reporting, and the latest financing documents from management or
      existing investors.
    relatedQuestionRefs:
      - QO025
      - QO035
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: workforce-reset
    missingEvidence: A company-authored explanation of the 2022-2023 staffing reduction and current hiring plan.
    whyItMatters: >-
      The public workforce reset is an adverse signal, and understanding whether it reflected over-hiring or deeper
      operating stress helps interpret resilience.
    diligencePath: Ask management for historical org charts, layoff timing, and 2026 hiring plans by geography and function.
    relatedQuestionRefs:
      - QO034
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      A bottom-up breakdown of Papaya’s target accounts, average contract value, and attach rates across payroll, EOR,
      and payments.
    whyItMatters: >-
      Public TAM sources establish demand, but they do not reveal how much spend is realistically addressable by Papaya
      in the next few years.
    diligencePath: Request pipeline segmentation, win-rate data, product attach rates, and ACV by cohort from management.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
