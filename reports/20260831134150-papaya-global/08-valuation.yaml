- id: fair-value-verdict
  title: Fair-value verdict
  body: On the available public evidence, the most defensible answer is a medium-confidence valuation range rather than a single price. The low end of the public sale-talk range already reflects real strategic relevance, while the high end likely requires stronger conviction in 2025 revenue delivery, product-mix quality, and strategic scarcity. A central fair-value zone around $3.8 billion to $4.2 billion is reasonable because it sits inside the reported range, acknowledges a durable franchise, and still discounts the lack of public detail on margin quality, retention, and concentration. This is therefore a business that looks valuable, but not transparently priced. The next diligence questions that would move valuation most are gross margins, net retention, burn, customer concentration, and evidence that Azimo-derived payments create attractive economics rather than just broader scope.
