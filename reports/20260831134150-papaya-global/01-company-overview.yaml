  - FO003
- id: founders-and-governance
  title: Founders, leadership, and governance implications
  body: 'Founder continuity is one of Papaya’s clearest strengths. Eynat Guez remains chief executive, Ruben Drong still anchors product leadership, and Ofer Herman continues to represent technology continuity from the original founding team. In practice that suggests a company that has not cycled through repeated leadership resets while scaling from startup formation to multibillion-dollar private-company status. The role split is also coherent: Guez carries external positioning, capital formation, and strategic transactions; Drong covers product and operational design; Herman covers architecture. For a platform that must balance software workflow, legal-employment logic, and embedded payments infrastructure, that spread is rational. The trade-off is key-person dependence. Public materials give little visibility into a full board roster or committee structure, so outside observers still rely heavily on the founders to infer strategic stability. That gap does not prove weak governance, but
    it does mean diligence should probe what institutional layer sits beneath the founders, how succession is handled, and how much customer or financing credibility is concentrated in Guez’s public role.'
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO005
