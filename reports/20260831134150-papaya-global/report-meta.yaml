  topStrengths:
    - Papaya combines payroll, EOR, and cross-border payments in one platform with coverage across more than 160 countries.
    - The company has credible enterprise proof from named customers and a stronger infrastructure story after the Azimo acquisition.
    - A reported 2026 sale process suggests the asset has continuing strategic relevance despite a tougher software market.
  topRisks:
    - Execution quality matters enormously because payroll, onboarding, and payout failures directly damage trust and retention.
    - Premium pricing faces pressure from both larger well-capitalized rivals and lower-cost EOR competitors.
    - Public evidence does not disclose margins, burn, runway, retention, or concentration well enough to underwrite the business tightly.
  unresolvedGaps:
    - Gross margin, burn, runway, and product-level economics remain undisclosed.
    - Net retention, customer concentration, and expansion quality require private diligence.
    - The January 2026 transaction discussions remain unconfirmed as a signed or closed deal.
