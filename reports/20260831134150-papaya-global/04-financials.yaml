- id: gtm-and-service-economics
  title: GTM motion and implied unit economics
  body: 'Papaya appears to sell through an enterprise motion rather than a self-serve model. Its public references include large multinational customers, while product materials emphasize integrations into systems such as Workday, SAP, Oracle, and NetSuite. That profile usually implies direct sales, longer deployment cycles, and multi-stakeholder procurement. The upside is that an initial sale can become a larger account if payroll expands into EOR and then into payments. The downside is that services-heavy onboarding, configuration, and compliance support can weigh on payback and margins when execution slips. This matters because global payroll is not a frictionless SaaS category: implementation quality and ongoing support are part of the product. G2 complaints about support and onboarding are therefore financially relevant, not just reputational noise, because a service-intensive business can become economically weaker if customer-success effort scales faster than software leverage.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI016
  - CI017
  - CI031
  - CI032
