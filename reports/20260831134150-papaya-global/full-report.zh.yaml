      - number: '7.2'
        title: 运营、产品与服务质量风险
        blocks:
          - type: paragraph
            body: >-
              运营执行是第二大风险桶。Papaya
              的产品横跨薪酬计算、名义雇主工作流、分析和跨境支付；每个发薪周期都要求多个系统正确运转。公开评论称支持质量和上线速度可能不一致，这在薪酬领域远比在轻度使用的协作软件中重要。如果实施滑坡，或支持响应不够快，客户就可能遭遇薪酬错误、付款延迟或合规挫折。系统宽度还会放大运营负担。国家规则维护必须保持最新，集成必须持续可靠，Azimo
              带来的支付层也必须与薪酬核心并行工作。覆盖面越广，失败冲击半径越大，因为纳入范围的国家、付款走廊和合规制度更多。因此，这是一门执行错误严重性很高的生意，运营纪律本身就是产品的一部分。
