    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础、细分与 Papaya 最适配的位置
        blocks:
          - type: paragraph
            body: >-
              Papaya 的公开客户证据指向有分量的全球企业版图，而不是大量微型国内账户长尾。公开描述称，公司在 160 多个国家的劳动力运营中服务 1,000
              多家全球客户。这本身不揭示账户质量，但说明已有真实规模。最强适配对象似乎是拥有国际劳动力的中型市场和企业公司，尤其是在薪酬、EOR
              和支付复杂性交汇处。已点名客户引用显示，客户组合既有快速增长的科技公司，也有更大的跨国企业；这说明只要场景足够跨境、合规负担足够重，Papaya
              就能卖给多种买方画像。产品既能服务已经有法律实体的组织，也能服务需要名义雇主支持的组织，从而扩大相关性。总体而言，细分证据表明 Papaya 不是通用 SMB 薪酬工具；它面向运营要求更高的全球用工工作流。
