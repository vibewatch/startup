companyProfile:
  summary: >-
    Papaya Global 发端于 Tel
    Aviv，是一家全球薪酬、名义雇主（EOR）和劳动力支付公司，搭建了统一平台来管理跨国招聘、薪资发放、合规和跨境付款。产品把全球薪酬、EOR、劳动力支付、劳动力管理和企业集成打包给在多司法辖区运营的公司。公开材料里最强的差异化在于覆盖国家广、跨国客户可点名，以及
    Azimo 带来的支付基础设施；主要短板则是私营公司财务不透明、服务质量敏感。
