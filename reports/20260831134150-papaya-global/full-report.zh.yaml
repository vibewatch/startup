      - number: '8.2'
        title: 收入与倍数视角
        blocks:
          - type: paragraph
            body: >-
              最实用的公开承销方法，是用估计 ARR 和收入数字锚定收入倍数视角。第三方估计把 2024 年 ARR 放在约 $145.1 million，2025 年收入预期约为 $168 million 到 $200
              million。把这些数字套入据报 2026 年估值区间，得到的隐含价值 / 收入倍数从十几倍高段到二十几倍高段，中点略高于 21x。这是溢价估值，但对一个具备全球覆盖、企业 logo
              和支付基础设施的类别参与者来说，并不荒唐。问题不是区间在数学上不合理；问题是核心输入是估计而非审计结果。因此，投资者需要把每个倍数结论都当作粗略视角，而不是精确价格信号。产品结构也重要，因为 EOR
              收入质量不同于承包商交易收入，也不同于纯薪酬订阅。
