  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Papaya 不属于泛泛的“所有 HR 软件”桶。它真正的市场在多国家薪资发放、名义雇主基础设施和跨境劳动力支付的交汇处。这个边界很重要，因为每一层解决的是不同运营瓶颈：薪酬负责计算并发放周期性薪资，EOR
              在客户没有本地实体的地方提供合规雇主基础设施，劳动力支付则把钱跨境付给员工或承包商。因此，现状替代方案不是另一个仪表盘，而是一堆混杂的本地服务局、割裂的法律雇主服务商、资金管理流程、电子表格和内部团队。Remote
              和 G2 的公开对比页也强化了这一点：买家越来越在同一轮评估中一起采购这些层。这正是为什么即便已发布的市场规模数字不一致，Papaya 的类别仍具有战略重要性。公司更像国际用工操作系统，而不是国内薪酬单点工具。
