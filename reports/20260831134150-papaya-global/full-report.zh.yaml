      - number: '7.4'
        title: 财务、竞争与战略风险
        blocks:
          - type: paragraph
            body: >-
              财务和战略风险的核心，不在于 Papaya
              是否有业务，而在于它能否守住价值和耐久性。公开证据没有披露利润率、烧钱速度或现金跑道，所以投资者无法直接测试韧性。竞争压力来自两个方向：规模更大、资本更充足的对手可以在产品和销售上花更多钱，低价对手则可以挑战它的高端
              EOR 定价。2026 年 1 月出售流程报道又增加了一层不确定性。如果流程仍在推进，可能分散管理层注意力；如果失败，也可能在没有创造流动性的情况下重置预期。据报 $3.5 billion 到 $4.5
              billion 的估值区间，也只是略高于最后披露的 2022 年定价轮，这说明公开证据并未显示大幅重估。实际上，Papaya 必须在执行复杂运营模型的同时，同时管理竞争、估值和融资叙事。
