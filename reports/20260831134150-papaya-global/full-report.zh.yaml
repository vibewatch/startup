      - number: '1.3'
        title: 融资历史、资本结构与 Azimo 带来的阶跃变化
        blocks:
          - type: paragraph
            body: >-
              Papaya 的融资史显示，公司在 2019-2021 年创投周期里快速扩张，随后用 M&A 加深对基础设施的掌控。公开披露和数据库摘要显示，2016-2018 年公司完成了小规模 Pre-Series A
              融资，随后在 2019 年 11 月完成 $45 million Series A，2020 年 9 月完成 $40 million Series B。2021 年 3 月，Papaya 的 Series C
              融资 $100 million，估值超过 $1 billion，确立独角兽身份。最显眼的一轮是 2021 年 9 月 Series D：公司以据报 $3.7 billion 估值融资 $250 million，由
              Insight Partners 和 Tiger Global 共同领投，并有广泛老股东跟投。综合可访问数据库和新闻报道，累计融资约为 $440 million 至 $445
              million，尽管部分公司档案仍把这个数字向上约化到 $500 million。战略拐点发生在 2022 年 3 月收购 Azimo。约 $175 million 的交易不只是补强型 M&A；它让 Papaya
              能主张自己掌握更多支付通道，而不是完全依赖第三方。这影响跨境薪酬的单位经济模型、控制力和合规可信度。
