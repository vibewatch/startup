chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与当前运营版图
        blocks:
          - type: paragraph
            body: >-
              理解 Papaya Global，最好把它看成一家后期私营的跨境用工基础设施层，而不只是单点薪酬工具。公司 2016 年创立于 Tel
              Aviv，如今在公开材料中把自己描述为全球薪酬、名义雇主、劳动力支付和劳动力管理平台。这个组合很关键：Papaya
              想拿下雇主管理国际员工时的整条合规与资金流转工作流，而不只是周期末的计算引擎。公开描述一直把公司放在 HR tech 与 fintech
              的交叉点；考虑到目标场景里，薪酬数据、本地用工合规和跨境资金流本就分不开，这个定位是合理的。现有运营版图证据也指向一家全球公司，而非单一区域软件厂商。Papaya 总部仍在 Tel Aviv，同时在 New
              York 有团队；公司声称覆盖 160 多个国家，估计服务 1,000 多名客户，员工数略高于 800 人。因此，公开记录在身份和范围上证据较强，但收入、产品线和集中度如何拆分仍然很薄。
