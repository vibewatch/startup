      - number: '6.5'
        title: 客户章节结论
        blocks:
          - type: paragraph
            body: >-
              客户图景可信但不完整。Papaya
              明显拥有可识别的参考账户、当前面向客户的证明，以及至少一个量化效率案例研究。这足以说明产品正在有分量的真实工作流中使用。不确定性在于公开材料很少揭示的层面：留存、账户集中度、合同期限，以及规模化满意度。评论证据显示，支持和上线问题可能出现；这很重要，因为全球薪酬是运营上高度贴身的产品。含义是，Papaya
              的客户基础很可能包含真实扩张机会，但投资者不应把 logo 质量误认为耐久经济性。采用证明强；耐久性证明不强。这个区分应影响估值纪律和尽调优先级。
            claimRefs:
              - CU030
