      - number: '3.4'
        title: 切换成本、多供应商并用与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争耐久性是混合的。一方面，切换成本确实有分量。薪酬迁移很痛，涉及敏感员工数据，还常常要接入 Workday、SAP 或 NetSuite
              等系统。这些摩擦让平台一旦深度嵌入，直接替换就更难。另一方面，买方可以而且经常会多供应商并用。一家公司可能保留原有国内薪酬系统，在有实体的国家用一个供应商，在需要 EOR
              的地方用另一个供应商，并为承包商或支付单独保留工作流。这意味着切换成本不会完全消除竞争，只会拖慢竞争。Papaya
              最可能的护城河元素因此不只是切换摩擦，而是整合支付通道、企业实施经验、合规声誉，以及把多个模块交叉销售进同一账户的能力。如果这些差异化在客户眼里显得浅，价格比较会占上风，护城河会很快收缩。
