      - number: '1.4'
        title: 牵引力证明、当前读数与反向背景
        blocks:
          - type: paragraph
            body: >-
              当前读数积极，但披露并不干净。正面看，作为一家私营薪酬平台，Papaya 拥有可信的公开客户引用，包括与 Microsoft、Toyota、Wix、Fiverr 相关的大公司披露，以及 Aqua Security
              案例研究中的量化结果。平台公开价格点、与 Workday 和 SAP 等企业系统的集成，以及围绕 SOC 2 Type II、GDPR、ISO 27001 的安全声明，都强化了一个判断：Papaya
              卖进的是有分量的企业工作流，而不是轻量的承包商单一场景。反向背景在于，独立证据仍显示运营摩擦：G2 评论提到支持和上线问题，公开报道也称公司在 2022-2023 年超过 1,100
              人的高峰后大幅裁员。再加上缺少经审计财务披露，投资者应把 Papaya 看作一个可信的规模化平台，有真实采用证据，但它在收入质量、集中度和治理上的精确度仍不完整。
