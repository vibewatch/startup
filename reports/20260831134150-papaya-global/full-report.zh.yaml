      - number: '4.3'
        title: Azimo、支付所有权与成本结构
        blocks:
          - type: paragraph
            body: >-
              Azimo 收购是最重要的财务背景之一，因为它改变了运营模型。Papaya
              从主要做薪酬和用工平台，转向掌握更多跨境支付层。客户希望薪酬和资金流在同一系统里完成时，这能提升产品控制力，降低对外部中介的依赖，并增强差异化。但拥有基础设施也会带来自己的成本。继承覆盖
              UK、Netherlands、Canada、Australia 和 Hong Kong 的牌照版图有战略价值，但很可能伴随合规、维护和运营开销，纯软件厂商不必承受同等程度的成本。因此，投资者应同时把 Azimo
              视作战略资产和成本结构复杂项。正确的尽调问题不是这笔交易有没有意义——它显然有——而是在纳入全部合规与运营成本之后，自有通道的经济性是否增厚利润率。
