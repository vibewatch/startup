      - number: '6.4'
        title: 扩张机会与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Papaya 的扩张逻辑直觉上很强。客户可以从薪酬开始，在选定市场增加名义雇主服务，再附加支付、分析和更广的劳动力管理工作流。地理覆盖和企业集成让 land-and-expand
              故事具备可信度。但同一模型也引入集中度风险。公开点名的参考账户足够大，以至于相对少数客户就可能贡献可观收入份额，尽管真实结构没有披露。这有利于平均合同价值和企业验证，但如果少数大客户不满或减少使用，也很危险。跨职能部署还同时增加摩擦和粘性：采购更慢，因为多支团队参与；但系统一旦嵌入，切换成本会加深。因此，扩张不只是产品问题，也是服务质量问题。
