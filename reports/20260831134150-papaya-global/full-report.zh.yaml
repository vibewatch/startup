            body: >-
              Papaya 显然获得过大量外部资本，但公开视角仍不完整。数据库和公司档案资料把融资基础放在约 $440 million 到 $445 million 区间，再加上约 $175 million 的 Azimo
              收购，意味着已有超过 $615 million 资本投向平台和支付基础设施。最后一次披露的定价基准仍是 2021 年 9 月 Series D，据报估值 $3.7 billion。2026 年 1
              月关于出售流程的报道提到，可能区间为 $3.5 billion 到 $4.5 billion；这看起来更像持平到温和上升，而不是大幅重估。劳动力数据也暗示，Papaya 在 2022-2023
              年招聘峰值后重置了成本，之后稳定在 800 人出头。即便有这些背景，公开材料仍没有披露现金余额、烧钱速度、现金跑道、利润率或留存。因此，不能只靠历史融资成功来承销资本充足性。
