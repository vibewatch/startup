      - number: '2.2'
        title: TAM、SAM 与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              市场机会很大，但具体数字取决于资料源纳入了什么。最窄且有用的视角是 HR 薪酬软件，第三方报告估计该市场 2025 年约为 $38.8 billion，2026 年为 $42.8 billion，并将在 2030
              年前增长到约 $62.6 billion。Research and Markets 给出的更宽口径把薪酬加 HR 解决方案放在 2026 年约 $75.2
              billion，而其他偏服务的报告还会把外包和薪酬服务纳入，进一步扩大边界。正确的承销反应不是挑一个数字并忽略其他数字。投资者应保留区间，把它作为证据：Papaya
              参与的是一个真正庞大的类别，一旦纳入服务、支付和合规运营，边界还会扩张。Papaya 真实的近期 SAM 显然小于最宽 TAM 幻灯片，但这个区间仍重要，因为它说明市场里有足够支出支撑规模化私营公司的结果。
