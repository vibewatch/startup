  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与结构
        blocks:
          - type: paragraph
            body: >-
              Papaya 的公开财务图景始于估计和标价，而不是经审计报告。GetLatka 列出的 2024 年 ARR 约为 $145.1 million，公开摘要资料把 2025 年收入放在约 $168 million
              到 $200 million 的区间。这些数值有方向性价值，因为它们暗示业务已有规模，但它们不是管理层认证的财务报表。公开定价显示三层清晰变现：薪酬每名员工每月 $29，名义雇主约 $499 到
              $650，承包商或劳动力支付约每笔交易 $3 到 $5。这个模式意味着经济结构混合了类似软件的经常性收入和运营更重的服务收入。公开摘要还显示，B2B 收入约占 2024 年收入的 40%，并可能在 2025
              年升至约 55%，这与更深的企业导向和更大金额的工作流相一致。
