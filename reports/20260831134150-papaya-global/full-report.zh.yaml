      - number: '3.2'
        title: 现代同业画像与相对规模
        blocks:
          - type: paragraph
            body: >-
              在现代私营同业中，Deel 是最清晰的规模威胁。评论和对比资料一直把它描述为最大的风投支持竞争对手，引用估值为 $12 billion，估计 ARR 超过 $500 million。这并不自动意味着 Deel
              在每个账户里都更好，但确实暗示它品牌动能更强、产品投入空间更大，也更能承受激进定价。Remote 的定位不同：它通常被描述为统一 HR 与 EOR 平台，在 70 多个国家直接拥有实体，估值信号超过 $1.5
              billion。Rippling 是第三类威胁，因为它把 HR、IT 和薪酬栈合在一起，对希望更广泛整合工作流的美国中心型企业很有吸引力。Oyster、Multiplier 和 Remofirst
              的规模更低，但仍有战略重要性，因为它们靠支持、简单性或价格吸走不同细分市场。简言之，Papaya 面对的不是一种对手原型，而是好几种。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP021
      - number: '3.3'
        title: 定价、能力与 Papaya 的胜点
        blocks:
          - type: paragraph
            body: >-
              当买家关心的是整合薪酬与支付，而不仅是 EOR 标价时，Papaya 的竞争叙事最强。公开对比资料显示，Papaya 的名义雇主价格带约为每名员工每月 $499 到 $650。这个价格接近 Oyster、Deel
              和 Remote 的中高端，明显高于 Multiplier 和 Remofirst，也低于 Globalization Partners 常被赋予的很高端定位。只看标价，Papaya
              并不占优。它的逻辑反而取决于能力：薪酬加 EOR 加支付通道、合规主导的叙事、企业集成，以及一批可识别客户的公开名单。Azimo
              带来的支付层尤其相关，因为很多竞争对手都会谈全球用工，但能讲出强自有支付故事的少得多。因此，复杂度和合规比最低进入成本更重要的场景，才是 Papaya 最容易赢的地方。
