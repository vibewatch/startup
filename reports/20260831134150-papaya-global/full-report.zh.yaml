      - number: '8.5'
        title: 公允价值判断
        blocks:
          - type: paragraph
            body: >-
              以现有公开证据看，最稳妥的答案不是单一价格，而是一个中等置信度的估值区间。公开出售传闻区间的低端已经体现真实战略价值；高端则很可能需要对 2025
              年收入兑现、产品组合质量和战略稀缺性有更强把握。把中枢公允价值放在约 $3.8 billion 至 $4.2 billion
              是合理的：它落在报道区间内，承认公司基本盘有韧性，同时也因为毛利质量、留存和客户集中度缺少公开细节而打折。因此，这家公司看起来有价值，但价格并不透明。最能推动估值变化的下一批尽调问题，是毛利率、净留存、烧钱速度、客户集中度，以及
              Azimo 带来的支付能力究竟能创造有吸引力的经济性，还是只是扩大业务范围。
