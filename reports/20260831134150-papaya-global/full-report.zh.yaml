      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              公开采用证据在具名引用和案例研究层面最强。与融资报道相关的历史披露客户包括 Microsoft、Toyota、Wix、Fiverr、Rubrik、Yubico、OneTrust、nCino 和 General
              Dynamics；当前公司发现中，Aqua Security 仍是最清晰的量化案例研究样本。这个宽度比匿名证言更能建立信心，因为这些名字意味着严肃采购标准，即使许多 logo
              引用来自融资期披露，而非当前经审计客户名单。Aqua Security 案例研究是最清晰的量化证明点，声称薪酬处理时间减少 90%。这不能证明整个客户基础都有同样
              ROI，但说明产品确实在真实生产工作流中使用。与此同时，公开证据在精确账户增长上较弱。收入估计显示业务已有规模，但没有说明 Papaya 是赢得了许多新
              logo、在较小客户基础内深度扩张，还是两者兼有。因此，客户证明足以支撑可信度，但不足以描绘完整采用动态。
