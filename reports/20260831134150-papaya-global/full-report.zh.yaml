        title: GTM 动作与隐含单位经济模型
        blocks:
          - type: paragraph
            body: >-
              Papaya 看起来通过企业销售动作推进，而不是自助模式。它的公开引用包含大型跨国客户，产品材料则强调接入 Workday、SAP、Oracle 和 NetSuite
              等系统。这个画像通常意味着直销、更长部署周期和多利益相关方采购。好处是，初始销售如果从薪酬扩到
              EOR，再扩到支付，一个账户就能变大。坏处是，一旦执行滑坡，服务密集型上线、配置和合规支持会拖累回本周期和利润率。这一点重要，因为全球薪酬不是无摩擦 SaaS 类别：实施质量和持续支持就是产品的一部分。因此，G2
              上关于支持和上线的投诉不仅是声誉噪音，也有财务相关性；如果客户成功投入扩张得比软件杠杆更快，服务密集型业务的经济性就会变弱。
