      - number: '2.5'
        title: 市场对 Papaya 承销的含义
        blocks:
          - type: paragraph
            body: >-
              从估值和尽调角度，核心结论不是薪酬软件很大，而是 Papaya
              服务的是一个庞大、结构性增长、对合规敏感的细分领域；预算所有权已经存在，多产品打包也可能产生价值。类别增长支撑公司的战略相关性，但公开证据仍留下几个关键规模变量：买方结构、平均合同价值，薪酬、EOR 和支付之间的
              attach rate，以及真实续约动态。缺少这些输入，单靠公开信息很难自下而上证明完整 SAM。即便如此，类别证据足够强，可以支持清晰的定性结论。Papaya
              所处市场有真实企业需求、云采用率上升，客户也明显不满碎片化替代方案。开放问题不是市场是否存在，而是相对于资金更足或价格更低的竞争对手，Papaya 能把其中多少转化为耐久、高效的收入。
