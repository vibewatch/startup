      - number: '3.5'
        title: 总体竞争结论
        blocks:
          - type: paragraph
            body: >-
              平衡来看，Papaya 在一个艰难赛道里可信，但还不是类别定义者。相比低价供应商，它的企业就绪度更强；相比一些纯 EOR
              厂商，它因支付而更有差异化；在复杂国际薪酬场景中，它的位置也不错。但它不是规模上最明显的领导者，不是价格最低者，也不是相邻工作流覆盖最宽者。Deel 和 Rippling
              带来的压力完全不同但都很严肃，Remote 和其他平台也让市场无法变成简单的双马竞争。这意味着 Papaya
              未来竞争结果更多取决于执行，而非结构性市场真空。如果公司能守住实施质量、加深支付附着，并利用企业客户引用，就能守住一个有利润的细分位置。否则，这个类别中资金更足、成本更低的对手组合可能同时压缩增长和定价权。
            claimRefs:
              - CP021
              - CP026
