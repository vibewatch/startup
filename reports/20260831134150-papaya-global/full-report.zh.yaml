      - number: '8.4'
        title: 交易逻辑与同业约束
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月关于出售流程的报道重要，因为它给战略买家或财务投资人愿意支撑的估值提供了市场参照。SAP 和 Oracle 等据报道的买家名字，符合 Papaya
              可为大型企业套件补上全球薪资和支付能力缺口的逻辑。即便如此，没有公开来源确认交易签署，任何溢价仍是假设。竞争也会影响结果。Deel 规模更大，广义 EOR
              市场里的预算型竞品价格也会压低锚点，这都会限制买家按独立公司口径给 Papaya 进取定价。换句话说，Papaya
              的估值逻辑不是它已经是清晰的品类赢家，而是它有可信客户基础和自有支付能力，是一项有战略用途的资产。这能支撑健康估值区间，但不是没有上限。
