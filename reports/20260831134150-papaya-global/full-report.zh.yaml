      - number: '6.3'
        title: 留存、满意度与使用耐久性
        blocks:
          - type: paragraph
            body: >-
              公开客户图景中最大的弱点是耐久性。Papaya 不披露
              NRR、GRR、流失率、续约率、合同期限或队列行为。也就是说，投资者无法直接看到客户只是采用平台，还是会留下、扩张并随时间加深使用。评论只能提供部分帮助。一方面，独立评论者总体验证了功能宽度和类别相关性。另一方面，G2
              反馈暴露了上线速度和支持一致性问题。在全球薪酬平台里，这些问题不是表面瑕疵；它们直指部署能否长期保持可信。如果公司服务的是大型跨国账户，可靠性和服务质量可能比功能宽度更重要。因此，公开证据支持一个关于客户满意度的合理案例，但它是混合的，而非定论；在硬留存指标上尤其薄弱。
