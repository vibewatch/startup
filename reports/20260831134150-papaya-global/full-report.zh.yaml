      - number: '7.3'
        title: 人员、地理与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Papaya 还带有明显的人员和依赖画像。公开劳动力分析显示，员工明显集中在中亚和西亚，并在南亚还有额外集中。这个版图可能高效且人才充足，但也引入地缘政治和业务连续性敞口。公开报道称员工数从 2022
              年后高峰大幅降至 800 人出头，这进一步暗示公司经历了一次有分量的运营重置。此类重置可以提升纪律，但如果知识随人员流失离开，也可能拉扯士气并削弱实施产能。依赖不止于员工。产品依赖第三方 HRIS 和 ERP
              集成、合作银行或支付网络关系，以及可能具有集中经济价值的大客户。治理可见度也有限，而外部信任似乎与 CEO 和创始团队紧密绑定。结果是，公司的风险画像同时包含技术依赖和集中人力依赖。
