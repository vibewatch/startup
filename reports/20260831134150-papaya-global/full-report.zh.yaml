  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              Papaya 的商业模式把监管和法律复杂性放在风险画像中心。跨 160 多个国家跑薪酬和 EOR 工作流，意味着本地税务、劳动、合同和解雇规则始终在变化。EOR
              产品还增加了围绕合规合同、福利、税务和解雇支持的直接法律雇主义务。Papaya 的支付层又加入一个受监管表面，因为 Azimo 带来了覆盖 UK、Netherlands、Canada、Australia 和
              Hong Kong 的支付牌照。这个版图有战略用途，但不会降低持续牌照、AML、KYC 和支付合规工作的必要性。SOC 2 Type II、GDPR、ISO 27001
              等安全和隐私控制很重要，却只能缓释整体风险的一小部分。更深层问题是，Papaya 卖的不是简单国内 SaaS 工具；它在高度监管环境中承担工作流责任，错误或失误会很快引发合同、合规和声誉后果。
