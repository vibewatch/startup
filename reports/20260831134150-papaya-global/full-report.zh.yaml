      - number: '1.2'
        title: 创始人、领导层与治理含义
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是 Papaya 最清晰的优势之一。Eynat Guez 仍担任首席执行官，Ruben Drong 继续掌舵产品，Ofer Herman
              也延续了原始创始团队的技术脉络。实际含义是，公司从初创走到数十亿美元级私营公司时，没有反复经历领导层重置。角色分工也顺：Guez 负责外部定位、融资和战略交易；Drong 覆盖产品和运营设计；Herman
              负责架构。对一个必须同时平衡软件工作流、法律用工逻辑和嵌入式支付基础设施的平台来说，这样的分布合理。代价是关键人物依赖。公开材料很少披露完整董事会名单或委员会结构，因此外部观察者仍主要靠创始人来判断战略稳定性。这个缺口不证明治理薄弱，但意味着尽调应追问：创始人之下有没有制度化管理层，继任如何安排，以及
              Guez 的公开角色承载了多少客户或融资信用。
