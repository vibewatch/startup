chapter:
  number: 6
  title: Customers
  summary: 'Papaya has credible public customer proof through recognizable enterprise logos and at least one quantified case study, supporting the view that the product is used in real multinational workflows. The gap is durability: public evidence is much stronger on adoption than on retention, concentration transparency, and service consistency.'
sections:
- id: customer-base-and-segmentation
  title: Customer base, segmentation, and where Papaya fits best
  body: Papaya’s public customer evidence points to a meaningful global-enterprise footprint rather than a long tail of tiny domestic accounts. The company is publicly described as serving more than 1,000 global clients across workforce operations in over 160 countries. That alone does not reveal account quality, but it does indicate real scale. The strongest fit appears to be mid-market and enterprise companies with international workforces, especially where payroll, EOR, and payments complexity intersect. Named customer references show a mix of fast-growing technology companies and larger multinational enterprises, which suggests Papaya can sell across several buyer profiles as long as the use case is sufficiently cross-border and compliance-heavy. The product can serve organizations that already have legal entities and those that need employer-of-record support, which broadens its relevance. Overall, the segmentation evidence says Papaya is not a generic SMB payroll tool; it is designed
    for more operationally demanding global employment workflows.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU008
  - CU009
  - CU010
  - CU011
  - CU025
  - CU030
