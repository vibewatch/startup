- id: adoption-and-proof
  title: Adoption trajectory and named customer proof
  body: Public adoption proof is strongest at the level of named references and case studies. Historically disclosed customer references tied to funding coverage include Microsoft, Toyota, Wix, Fiverr, Rubrik, Yubico, OneTrust, nCino, and General Dynamics, while current company discovery still points to Aqua Security as the clearest quantified case-study example. That breadth provides more confidence than anonymous testimonials because the names imply serious procurement standards, even though many of the logo references come from funding-era disclosures rather than a current audited customer roster. The Aqua Security case study is the clearest quantified proof point, claiming a 90% reduction in payroll-processing time. That does not prove the same ROI exists across the entire customer base, but it does suggest the product is being used in live production workflows. At the same time, public evidence is weaker on exact account growth. Revenue estimates suggest a scaled business, yet they do not reveal whether Papaya is winning many new logos, expanding deeply inside a smaller base, or both. As a result, customer proof is strong enough to support credibility, but not strong enough to map full adoption dynamics.
  claimRefs:
  - CU004
  - CU006
  - CU007
  - CU012
