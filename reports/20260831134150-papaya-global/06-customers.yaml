- id: customer-verdict
  title: Customer chapter verdict
  body: 'The customer picture is credible but incomplete. Papaya clearly has recognizable reference accounts, current customer-facing proof, and at least one quantified efficiency case study. That is enough to establish that the product is used in meaningful real-world workflows. The uncertainty lies in the layers that public materials rarely reveal: retention, account concentration, contract duration, and satisfaction at scale. Review evidence suggests that support and onboarding issues can arise, which matters because global payroll is an operationally intimate product. The implication is that Papaya’s customer base likely contains real expansion opportunity, but investors should not confuse logo quality with durable economics. Strong proof of adoption exists; strong proof of durability does not. That distinction should shape both valuation discipline and diligence priorities.'
