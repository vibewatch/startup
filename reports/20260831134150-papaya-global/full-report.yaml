      - number: '8.3'
        title: Strategic value from infrastructure and market position
        blocks:
          - type: paragraph
            body: >-
              Papaya’s strongest route to valuation resilience is strategic value rather than pure financial profiling.
              The Azimo acquisition gave Papaya more direct ownership of cross-border payment rails and licensing
              infrastructure, which can make the platform more attractive to buyers that want payroll and money movement
              in one stack. Named enterprise customers and broad country coverage reinforce the idea that the company is
              more than a narrow payroll API or a staffing arbitrage operation. The mix shift toward higher B2B
              contribution, if realized, would further strengthen the revenue-quality story because it suggests deeper
              enterprise integration rather than only transactional usage. Still, strategic value cuts both ways. Owning
              more of the payments layer can improve defensibility, but it also introduces operational and regulatory
              complexity that some buyers may discount. Publicly, the company looks strategically interesting, yet not
              easy to underwrite with precision.
            claimRefs:
