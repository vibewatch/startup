      - number: '2.3'
        title: Buyer, user, and segment map
        blocks:
          - type: paragraph
            body: >-
              Papaya’s natural buyer is a multinational employer that has outgrown domestic payroll tooling but does not
              want to manage a patchwork of local vendors. In most organizations the day-to-day users are payroll, HR
              operations, and compliance staff, while budget ownership typically sits with finance or people-operations
              leaders who own risk and execution quality. That mix explains why Papaya’s best-fit customers skew toward
              mid-market and enterprise companies with global workforces, especially in technology and internationally
              distributed knowledge-work sectors. Public customer proof and case-study materials support that
              interpretation even if the live customer roster is not fully disclosed. The category fit is also validated
              externally: competitor and review sites do not treat Papaya as a niche local tool, but as one option
              inside a mainstream 2026 global-employment buying set that includes Deel, Remote, Rippling, and incumbent
              suites.
