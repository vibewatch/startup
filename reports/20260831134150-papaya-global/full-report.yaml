            body: >-
              The evidence supports a real business, but not a fully underwritable one. Papaya has visible price points,
              credible independent revenue estimates, known enterprise customers, and a strategic M&A step that could
              meaningfully deepen product control. Those are real positives. The problem is that nearly every
              quality-of-revenue question remains open: investors cannot see margin structure, retention, cash burn, or
              how much of the topline is software versus service or payment flow. Enterprise concentration may improve
              average contract value but also sharpens downside. Support-quality risk matters because global payroll
              implementations are operationally intimate rather than lightly used SaaS seats. As a result, Papaya’s
