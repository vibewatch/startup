      - number: '8.4'
        title: Transaction logic and peer constraints
        blocks:
          - type: paragraph
            body: >-
              The January 2026 sale-process reports matter because they provide a market-based framing for what
              strategic or sponsor interest might support. Reported buyer names such as SAP and Oracle fit the thesis
              that Papaya could fill gaps in global payroll and payments capability for larger enterprise suites. Even
              so, no public source confirms a signed transaction, so any premium remains hypothetical. Competition also
              shapes the outcome. Deel’s greater scale and budget-rival pricing in the broader EOR landscape both limit
              how aggressively a buyer may value Papaya on a standalone basis. In other words, Papaya’s value case is
              not built on being the clear category winner; it is built on being a strategically useful asset with a
              credible customer base and proprietary payments capability. That can support a healthy range, but not an
              unconstrained one.
            claimRefs:
              - CV018
