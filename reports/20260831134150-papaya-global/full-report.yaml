      - number: '7.4'
        title: Financial, competitive, and strategic risk
        blocks:
          - type: paragraph
            body: >-
              The financial and strategic risks are less about whether Papaya has a business and more about whether it
              can preserve value and durability. Public evidence does not reveal margins, burn, or runway, so investors
              cannot directly test resilience. Competitive pressure is real from both directions: larger and
              better-capitalized rivals can outspend Papaya on product and sales, while cheaper rivals can challenge its
              premium EOR pricing. Sale-process coverage in January 2026 adds a further layer of uncertainty. If a
              process is active, it could distract management; if it fails, it could still reset expectations without
              creating liquidity. The reported value band of $3.5 billion to $4.5 billion also looks only modestly above
              the last disclosed 2022 priced round, which suggests public evidence of dramatic re-rating is limited. In
              effect, Papaya must manage competitive, valuation, and financing narratives simultaneously while still
