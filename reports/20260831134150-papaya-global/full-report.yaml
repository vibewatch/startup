      - number: '4.2'
        title: GTM motion and implied unit economics
        blocks:
          - type: paragraph
            body: >-
              Papaya appears to sell through an enterprise motion rather than a self-serve model. Its public references
              include large multinational customers, while product materials emphasize integrations into systems such as
              Workday, SAP, Oracle, and NetSuite. That profile usually implies direct sales, longer deployment cycles,
              and multi-stakeholder procurement. The upside is that an initial sale can become a larger account if
              payroll expands into EOR and then into payments. The downside is that services-heavy onboarding,
              configuration, and compliance support can weigh on payback and margins when execution slips. This matters
              because global payroll is not a frictionless SaaS category: implementation quality and ongoing support are
              part of the product. G2 complaints about support and onboarding are therefore financially relevant, not
