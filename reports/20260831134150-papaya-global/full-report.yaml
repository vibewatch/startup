      - number: '7.5'
        title: Risk verdict and monitoring logic
        blocks:
          - type: paragraph
            body: >-
              Taken together, Papaya’s risk picture is best described as execution-heavy rather than existential. The
              company appears to have real product substance, real customers, and meaningful capital behind it, but the
              combination of regulated employment workflows, payment infrastructure, competitive pricing pressure,
              opaque financial durability, and service-quality sensitivity leaves little room for operational slippage.
              This is not a business where problems remain isolated for long. Payroll, EOR, and payment failures
              propagate into customer trust, margin structure, renewal dynamics, and potentially strategic outcomes. The
              good news is that several of the major risks are monitorable: service quality, support responsiveness,
              payment reliability, regulatory maintenance, and customer expansion. The bad news is that public evidence
              does not expose most of those metrics directly. As a result, Papaya merits a medium-high risk rating that
              could improve with private diligence on controls, concentration, and unit economics.
