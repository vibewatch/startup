      - number: '5.4'
        title: Trust, security, and dependency profile
        blocks:
          - type: paragraph
            body: >-
              Trust is a first-order product requirement because Papaya handles payroll data, worker identity data,
              compliance workflows, and cross-border payment instructions. Public materials point to SOC 2 Type II,
              GDPR, and ISO 27001 as the core trust markers. Those are useful signals, but the deeper point is
              operational: the platform depends on always-updated country-specific tax and employment rules, as well as
              partner-bank and payment-network relationships. In other words, compliance operations and external
              infrastructure are integral pieces of the product, not background implementation details. This creates
              both moat potential and fragility. A company that manages rules, payments, and integrations well can
              become deeply embedded. But the same architecture also means that support quality, payout reliability, or
              integration breakdowns can damage customer trust quickly. The public record therefore supports a product
              with genuine enterprise substance, but one that must continually execute across a wide dependency surface.
