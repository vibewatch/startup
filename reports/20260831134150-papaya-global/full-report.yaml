chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and current operating footprint
        blocks:
          - type: paragraph
            body: >-
              Papaya Global is best understood as a late-stage private infrastructure layer for cross-border employment
              rather than just a payroll point solution. The company was founded in Tel Aviv in 2016 and now describes
              itself across its public materials as a global payroll, employer-of-record, workforce payments, and
              workforce-management platform. That combination matters because it means Papaya is trying to own the full
              compliance and money-movement workflow for employers with international staff, not merely the calculation
              engine at the end of the cycle. Public descriptions consistently position the company at the intersection
              of HR tech and fintech, which is logical given that payroll data, local employment compliance, and
              movement of funds across borders are inseparable in its target use case. Available operating-footprint
              evidence supports a global-company profile rather than a single-region software vendor. Papaya’s
              headquarters remain in Tel Aviv, while the company also maintains a New York presence, claims coverage in
              more than 160 countries, and is estimated to serve more than 1,000 customers with a workforce a little
              above 800 people. The public record is therefore strong on identity and scope, but still thin on how that
              scale breaks down by revenue, product line, and concentration.
