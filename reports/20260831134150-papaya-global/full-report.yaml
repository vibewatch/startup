  - id: TV007
    title: Comparable valuation table
    columns:
      - Peer
      - Public scale signal
      - Pricing posture
      - Implication for Papaya valuation
    rows:
      - - Deel
        - Much larger ARR and valuation
        - Premium modern platform
        - Caps how far Papaya can stretch as the category leader trade
      - - Remote
        - Scaled global HR / EOR platform
        - Premium but more unified HR framing
        - Keeps Papaya in a competitive premium band rather than a unique slot
      - - Rippling
        - Very large private valuation with broader HR+IT scope
        - Enterprise bundle
        - Highlights that broader platform stories can command stronger narratives
      - - Multiplier / Remofirst
        - Lower-cost EOR alternatives
        - Aggressive budget pricing
        - Pressures Papaya’s pricing and therefore multiple support
      - - ADP / Workday / G-P
        - Large incumbents or enterprise-grade global platforms
        - Enterprise procurement familiarity
        - Limits strategic scarcity even if Papaya remains attractive
