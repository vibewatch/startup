  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Papaya presents itself as a multi-module platform rather than a single payroll utility. Public materials
              consistently describe a stack that combines global payroll, employer of record, workforce payments, and
              workforce management. The first two modules solve employment execution and legal-employer problems; the
              latter two push the platform into post-approval operations and ongoing workforce administration. This
              matters because the company’s product thesis is not “better payroll UI” but control of the broader
              multinational workforce workflow. The EOR module includes compliant contracts, benefits, tax handling, and
              a termination-liability guarantee, while the management layer adds onboarding, self-service, and
              analytics. Coverage of more than 160 countries expands the addressable workflow surface. The result is a
              product map built for companies with distributed international labor, not small domestic employers. That
              breadth is a strength because it supports cross-sell, but it also means product quality depends on
              multiple operational layers working together consistently.
