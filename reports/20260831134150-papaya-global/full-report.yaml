      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in this market is mixed. On the one hand, there are meaningful switching costs.
              Payroll migrations are painful, involve sensitive employee data, and often require integration work into
              systems such as Workday, SAP, or NetSuite. These frictions make outright replacement harder once a
              platform is deeply embedded. On the other hand, buyers can and often do multi-home. A company may keep
              incumbent domestic payroll, use one vendor for countries where it has entities, another for
              employer-of-record, and a separate workflow for contractors or payments. That means switching costs do not
              fully eliminate competition; they simply slow it. Papaya’s most plausible moat elements are therefore not
              just switching friction, but integrated payments rails, enterprise implementation know-how, compliance
              reputation, and the ability to cross-sell multiple modules into one account. If those differentiators feel
              shallow to customers, price comparison will dominate and the moat compresses quickly.
            claimRefs:
