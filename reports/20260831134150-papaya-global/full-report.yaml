      - number: '8.2'
        title: Revenue and multiple lens
        blocks:
          - type: paragraph
            body: >-
              The most practical public underwriting method is a revenue-multiple lens anchored by estimated ARR and
              revenue figures. Third-party estimates place 2024 ARR near $145.1 million and 2025 revenue expectations
              around $168 million to $200 million. Applying those figures to the reported 2026 value band yields an
              implied value-to-revenue range from the high teens to the high twenties, with a midpoint a little above
              21x. That is a premium valuation, but not an absurd one for a category participant with global coverage,
              enterprise logos, and payment infrastructure. The problem is not that the range is mathematically
              unreasonable; the problem is that the core inputs are estimated, not audited. Investors therefore need to
              treat every multiple conclusion as a rough lens rather than an exact pricing signal. Product mix also
              matters, because EOR revenue quality differs from contractor transaction revenue and from payroll-only
              subscriptions.
            claimRefs:
              - CV005
