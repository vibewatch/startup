  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              Papaya does not sit inside a generic “all HR software” bucket. Its real market is the intersection of
              multi-country payroll execution, employer-of-record infrastructure, and cross-border workforce payments.
              That matters because each layer solves a different operational bottleneck: payroll calculates and executes
              recurring compensation, EOR provides compliant employer infrastructure where the customer lacks an entity,
              and workforce payments move money to employees or contractors across borders. The status-quo substitute is
              therefore not another dashboard so much as a messy stack of local bureaus, fragmented legal-employment
              providers, treasury workflows, spreadsheets, and internal teams. Public comparison pages from Remote and
              G2 reinforce that buyers increasingly shop these layers together in one evaluation cycle, which is
              precisely why Papaya’s category looks strategically important even if published market numbers differ. The
              company is closer to an operating system for international employment than to a domestic payroll point
              tool.
