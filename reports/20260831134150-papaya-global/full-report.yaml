            body: >-
              Papaya also carries a meaningful people and dependency profile. Public workforce analytics point to a
              notable concentration of staff in Central and Western Asia, with additional concentration in South Asia.
              That footprint may be efficient and talent-rich, but it introduces geopolitical and business-continuity
              exposure. Public reports that staffing fell materially from a post-2022 peak to the low-800s further
              suggest that the company went through a meaningful operating reset. Such resets can improve discipline,
              but they can also strain morale and reduce implementation capacity if knowledge walks out the door.
              Dependencies extend beyond the workforce. The product relies on third-party HRIS and ERP integrations,
              partner-bank or payment-network relationships, and large customer accounts that may carry concentrated
              economic value. Governance visibility is also limited, while external trust appears closely associated
              with the CEO and founding team. The result is a company whose risk profile includes both technical
