      - number: '2.5'
        title: What the market means for underwriting Papaya
        blocks:
          - type: paragraph
            body: >-
              For valuation and diligence purposes, the main conclusion is not that payroll software is huge; it is that
              Papaya serves a large, structurally growing, compliance-sensitive slice where budget ownership already
              exists and multi-product bundling can matter. Category growth supports the company’s strategic relevance,
              but public evidence still leaves key sizing variables private: buyer mix, average contract value, attach
              rates across payroll, EOR, and payments, and actual renewal dynamics. Those missing inputs are why a full
              bottom-up SAM remains hard to defend from public information alone. Still, the category evidence is
              sufficiently strong to support a clear qualitative conclusion. Papaya is operating in a market with real
              enterprise demand, rising cloud adoption, and meaningful dissatisfaction with fragmented alternatives. The
              open question is not whether the market exists, but how much of it Papaya can convert into durable,
              efficient revenue relative to better-funded or lower-priced rivals.
