      - number: '1.4'
        title: Traction proof, current readout, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The current readout is encouraging but not cleanly disclosed. On the positive side, Papaya has a credible
              public set of customer references for a private payroll platform, including large-company disclosures tied
              to Microsoft, Toyota, Wix, and Fiverr plus a quantified Aqua Security case-study outcome. The platform’s
              public price points, integrations with enterprise systems such as Workday and SAP, and security claims
              around SOC 2 Type II, GDPR, and ISO 27001 all reinforce the view that Papaya is selling into meaningful
              enterprise workflows rather than lightweight contractor-only use cases. The adverse context is that
              independent evidence still highlights operating friction: G2 reviews cite support and onboarding concerns,
              and public reporting says the company reduced staff materially after a 2022-2023 peak above 1,100 people.
              Combined with the absence of audited financial disclosure, those facts mean investors should read Papaya
              as a credible scaled platform with real adoption proof, but still one whose precision around revenue
              quality, concentration, and governance remains incomplete.
