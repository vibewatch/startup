      - number: '3.2'
        title: Modern peer profiles and relative scale
        blocks:
          - type: paragraph
            body: >-
              Among the modern private peers, Deel is the clearest scale threat. Review and comparison sources
              consistently frame it as the largest venture-backed rival, with a cited $12 billion valuation and
              estimated ARR above $500 million. That does not automatically make Deel better in every account, but it
              does suggest stronger brand momentum, more room for product investment, and greater tolerance for
              aggressive pricing. Remote is positioned differently: it is usually described as a unified HR and EOR
              platform with directly owned entities in more than 70 countries and valuation signals above $1.5 billion.
              Rippling is a third kind of threat because its combined HR, IT, and payroll stack can be compelling for
              U.S.-centric enterprises that want broader workflow consolidation. Oyster, Multiplier, and Remofirst
              cluster lower in scale but are still strategically important because they pull different segments with
              support, simplicity, or price. In short, Papaya faces not one rival archetype but several.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
