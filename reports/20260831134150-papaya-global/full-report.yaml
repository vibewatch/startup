      - number: '1.3'
        title: Funding history, capitalization, and the Azimo step-change
        blocks:
          - type: paragraph
            body: >-
              Papaya’s capital history shows a company that scaled quickly through the 2019-2021 venture cycle and then
              used M&A to deepen infrastructure ownership. Public disclosures and database summaries point to small
              pre-Series A financing in 2016-2018, then a $45 million Series A in November 2019 and a $40 million Series
              B in September 2020. Papaya’s March 2021 Series C raised $100 million at a valuation above $1 billion and
              established unicorn status. The headline financing event was the September 2021 Series D: $250 million at
              a reported $3.7 billion valuation, co-led by Insight Partners and Tiger Global with a broad follow-on
              syndicate. Taken together, accessible databases and press coverage put total funding near $440 million to
              $445 million, although some profile sources still round the figure upward toward $500 million. The
              strategic inflection came in March 2022 with the Azimo acquisition. At roughly $175 million, the deal was
              not just tuck-in M&A; it was the point at which Papaya could argue it owned more of the payment rail
              rather than depending entirely on third parties. That matters for unit economics, control, and compliance
              credibility across cross-border payroll.
