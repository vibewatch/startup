      - number: '4.3'
        title: Azimo, payment ownership, and cost structure
        blocks:
          - type: paragraph
            body: >-
              The Azimo acquisition is one of the most important financial context points because it changes the
              operating model. Papaya moved from being primarily a payroll and employment platform toward owning more of
              the cross-border payments layer. That can improve product control, reduce reliance on external
              intermediaries, and increase differentiation when customers want payroll and money movement in one system.
              Yet infrastructure ownership also brings its own costs. The inherited license footprint across the UK,
              Netherlands, Canada, Australia, and Hong Kong can be strategically valuable, but it likely comes with
              compliance, maintenance, and operating overhead that pure software vendors do not bear to the same degree.
              Investors should therefore treat Azimo as both a strategic asset and a cost-structure complication. The
              right diligence question is not whether the deal mattered—it clearly did—but whether the economics of
              owned rails are margin accretive after the full cost of compliance and operations is included.
