            body: >-
              The biggest weakness in the public customer picture is durability. Papaya does not disclose NRR, GRR,
              churn, renewal rates, contract length, or cohort behavior. That means investors cannot directly see
              whether customers merely adopt the platform or actually stay, expand, and deepen usage over time. Reviews
              offer only partial help. On one hand, independent reviewers generally validate feature breadth and
              category relevance. On the other hand, G2 feedback surfaces concerns around onboarding speed and support
              consistency. In a global payroll platform, those issues are not cosmetic; they cut to the heart of whether
              deployments remain trusted over time. If the company is serving large multinational accounts, reliability
              and service quality may matter even more than feature breadth. Public evidence therefore supports a
              plausible case for customer satisfaction, but it is mixed rather than definitive, and it is especially
