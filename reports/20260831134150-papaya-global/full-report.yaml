  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Papaya’s business model puts regulatory and legal complexity near the center of the risk profile. Running
              payroll and EOR workflows across more than 160 countries means local tax, labor, contract, and termination
              rules are always in motion. The EOR product adds direct legal-employer obligations around compliant
              contracts, benefits, taxes, and termination support. Papaya’s payment layer adds another regulated surface
              because Azimo brought payment licenses across the UK, Netherlands, Canada, Australia, and Hong Kong. That
              footprint is strategically useful, but it does not reduce the need for ongoing licensing, AML, KYC, and
              payments compliance work. Security and privacy controls such as SOC 2 Type II, GDPR, and ISO 27001 matter,
              yet they only mitigate a fraction of the overall risk. The deeper issue is that Papaya is not selling a
              simple domestic SaaS tool; it is assuming workflow responsibility in highly regulated environments where
              errors or missteps can create contractual, compliance, and reputational fallout quickly.
            claimRefs:
