      - number: '3.3'
        title: Pricing, capabilities, and where Papaya wins
        blocks:
          - type: paragraph
            body: >-
              Papaya’s competitive story is strongest when buyers care about integrated payroll and payments, not just
              headline EOR price. Public comparison sources place Papaya’s employer-of-record price band at roughly $499
              to $650 per worker per month. That puts it near Oyster, Deel, and Remote on upper-middle pricing,
              materially above Multiplier and Remofirst, and below the very premium positioning often associated with
              Globalization Partners. On pure list price, Papaya does not look advantaged. Its case instead depends on
              capability: payroll plus EOR plus payment rails, a compliance-led narrative, enterprise integrations, and
              a public roster of recognizable customers. The Azimo-derived payment layer is especially relevant because
              many competitors talk about global employment, but fewer can make a strong proprietary-payments case.
              Papaya therefore wins best where complexity and compliance matter more than cheapest entry cost.
