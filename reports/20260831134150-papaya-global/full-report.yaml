            body: >-
              Papaya has clearly had access to significant outside capital, but the public view remains incomplete.
              Database and profile sources place the financing base in a rough $440 million to $445 million range, and
              adding the roughly $175 million Azimo purchase suggests more than $615 million of capital deployed into
              the platform and its payment infrastructure. The last disclosed priced benchmark remains the September
              2021 Series D at a reported $3.7 billion value. Reported sale-process coverage in January 2026 suggested a
              possible $3.5 billion to $4.5 billion range, which looks more flat-to-moderately-up than dramatically
              re-rated. Workforce datasets also imply that Papaya reset costs after the 2022-2023 hiring peak,
              stabilizing in the low 800s later on. Even with that context, public materials still do not reveal cash
              balance, burn, runway, margins, or retention. That means capital adequacy cannot be underwritten just from
