      - number: '2.2'
        title: TAM, SAM, and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The market opportunity is large, but the exact number depends on what a source includes. The narrowest
              useful lens is HR payroll software, which third-party reports place at about $38.8 billion in 2025 and
              $42.8 billion in 2026, growing toward roughly $62.6 billion by 2030. A broader lens from Research and
              Markets puts payroll-plus-HR solutions around $75.2 billion in 2026, while other services-oriented reports
              expand the frame further by including outsourcing and payroll services. The correct underwriting response
              is not to pick one number and ignore the rest. Instead, investors should preserve the range and use it as
              evidence that Papaya participates in a genuinely large category whose boundary expands when services,
              payments, and compliance operations are included. Papaya’s true near-term SAM is obviously smaller than
              the broadest TAM slide, but the range still matters because it shows there is enough spend to support
              scaled private-company outcomes.
