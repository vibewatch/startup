  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing model, and mix
        blocks:
          - type: paragraph
            body: >-
              Papaya’s public financial picture starts with estimates and list pricing rather than audited reporting.
              GetLatka lists 2024 ARR at about $145.1 million, and public summary sources place 2025 revenue somewhere
              in a roughly $168 million to $200 million band. Those values are directionally useful because they imply a
              scaled business, but they are not management-certified financial statements. Public pricing shows three
              clear monetization layers: payroll at $29 per worker per month, employer-of-record at roughly $499 to
              $650, and contractor or workforce payments at about $3 to $5 per transaction. That pattern implies an
              economic mix of software-like recurring revenue and more operationally heavy service revenue. Public
              summaries also suggest B2B revenue was about 40% of 2024 revenue and may have risen toward 55% in 2025,
              which would be consistent with a deeper enterprise orientation and larger-ticket workflows.
