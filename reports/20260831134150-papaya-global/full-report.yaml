      - number: '5.2'
        title: Architecture, workflow, and how money moves
        blocks:
          - type: paragraph
            body: >-
              The core architectural insight is that Papaya sits between upstream HR systems and downstream money
              movement. Data begins with onboarding and worker setup, passes into payroll and compliance workflows, and
              then ends in cross-border disbursement. The Azimo acquisition made this architecture more vertically
              integrated because Papaya could point to stronger ownership of the payment rails instead of relying
              entirely on third parties. Public materials now describe instant payments in more than 16 currencies and
              emphasize licensing and coverage for regulated payouts. That does not mean the platform is technically
              simple. In fact, the opposite is more likely: payroll calculation, local compliance logic, workflow
              approvals, and payout execution all have to coordinate without failure. The architecture is therefore more
              operationally intensive than a standard SaaS dashboard and more valuable if it works well. It is an
              end-to-end workflow system where data correctness and timing are fundamental product requirements.
