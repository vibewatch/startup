  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Papaya competes inside a crowded global-employment software market where buyers can choose between modern
              all-in-one platforms, premium incumbents, and cheaper point solutions. The clearest direct peers are Deel,
              Remote, Rippling, Oyster, Multiplier, Remofirst, and Globalization Partners, all of which appear
              repeatedly in comparison content written either by competitors or independent review sites. Incumbents
              such as ADP GlobalView and Workday matter because large enterprises may prefer vendors already embedded in
              adjacent HR or payroll workflows, even if those incumbents are less elegant for modern cross-border
              operations. The real substitute set is broader still: a buyer can keep local payroll providers, form its
              own entities, use one vendor for employer-of-record and another for payroll, or manage contractors
              separately from employees. That fragmentation is exactly what Papaya tries to collapse. The implication is
              that Papaya is not selling into a winner-take-all category. It is selling into a market where solution
              breadth, trust, and integration matter, but where procurement always has alternative paths.
            claimRefs:
