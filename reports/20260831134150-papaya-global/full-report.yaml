        - Named customers help strategic credibility
        - Retention quality is still opaque
      - - Market timing
        - 2026 process may create price discovery
        - Talks can fail without transaction certainty
      - - Competitive response
        - Owning Papaya may block rivals or fill gaps
        - Peer alternatives reduce buyer urgency
    notes: Strategic value likely explains more upside than standalone sponsor underwriting.
