      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are complexity, consolidation, and automation. Employers operating across
              many countries face local-law complexity, data fragmentation, and hard-to-reconcile money-movement
              workflows, so a unified platform becomes easier to justify as geographic scope grows. Independent adoption
              statistics strengthen that case: cloud payroll usage among multinational firms is already above
              two-thirds, and more than 72% of payroll leaders reportedly prioritize automation. At the same time,
              adoption is not frictionless. Payroll errors, compliance failures, and delayed payments are high-cost
              events, so trust remains critical. Implementation also requires integrations into systems such as Workday,
              Oracle, NetSuite, or SAP, which can slow sales cycles and raise switching costs. Pricing matters too,
              especially because lower-cost providers keep pressure on premium vendors. The market is therefore growing
              for real reasons, but enterprise adoption still depends on execution credibility rather than category
              momentum alone.
