  title: Market Analysis
  summary: Papaya participates in a large and still-growing multinational payroll, EOR, and workforce-payments market, but the exact opportunity depends heavily on whether a source measures software only or the broader payroll-and-HR solutions stack. Adoption data, competitive comparison pages, and Papaya’s own positioning all indicate a mainstream enterprise buying category rather than a fringe niche, even though public SAM inputs remain incomplete.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitute
  body: 'Papaya does not sit inside a generic “all HR software” bucket. Its real market is the intersection of multi-country payroll execution, employer-of-record infrastructure, and cross-border workforce payments. That matters because each layer solves a different operational bottleneck: payroll calculates and executes recurring compensation, EOR provides compliant employer infrastructure where the customer lacks an entity, and workforce payments move money to employees or contractors across borders. The status-quo substitute is therefore not another dashboard so much as a messy stack of local bureaus, fragmented legal-employment providers, treasury workflows, spreadsheets, and internal teams. Public comparison pages from Remote and G2 reinforce that buyers increasingly shop these layers together in one evaluation cycle, which is precisely why Papaya’s category looks strategically important even if published market numbers differ. The company is closer to an operating system for international
    employment than to a domestic payroll point tool.'
  claimRefs:
  - CM001
  - CM002
  - CM014
  - CM015
  - CM016
  - CM017
  - CM033
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses
  title: TAM, SAM, and sizing lenses
  body: The market opportunity is large, but the exact number depends on what a source includes. The narrowest useful lens is HR payroll software, which third-party reports place at about $38.8 billion in 2025 and $42.8 billion in 2026, growing toward roughly $62.6 billion by 2030. A broader lens from Research and Markets puts payroll-plus-HR solutions around $75.2 billion in 2026, while other services-oriented reports expand the frame further by including outsourcing and payroll services. The correct underwriting response is not to pick one number and ignore the rest. Instead, investors should preserve the range and use it as evidence that Papaya participates in a genuinely large category whose boundary expands when services, payments, and compliance operations are included. Papaya’s true near-term SAM is obviously smaller than the broadest TAM slide, but the range still matters because it shows there is enough spend to support scaled private-company outcomes.
