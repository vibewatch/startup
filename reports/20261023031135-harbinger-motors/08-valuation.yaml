    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Strategic validation, "Series C co-led by FedEx, Capricorn, and THOR; 53-vehicle FedEx order disclosed.", "Verify delivered units, economics, and repeat orders."]
      - [Platform differentiation, "Company describes in-house systems, modularity, and medium-duty focus.", "Independent test, reliability, and cost-per-mile evidence."]
      - [Production-support signal, "A company-reposted role covers field failures, warranty claims, cost reduction, and supplier quality.", "Quantify field incidents, warranty rate, remediation time, and realized cost savings."]
      - [Disclosure gap, "No current valuation, revenue, margin, burn, or runway in assigned evidence.", "Audited or diligence-verified KPI package."]
      - [Competitive valuation risk, "Blue Bird market-cap figures differ by source/date; peers are not direct multiples.", "Normalized peer set with matched revenue, margin, and growth metrics."]
    notes: "Company claims are labeled as such; peer market capitalization is a context benchmark, not a Harbinger valuation."
    claimRefs: [CV002, CV003, CV005, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Orders convert into repeat deliveries; unit economics and quality data improve; financing terms are reasonable.", "Upside is plausible but not calculable without price, revenue, margin, and dilution inputs.", "Ramp, supply chain, warranty, and customer concentration.", "Positive operating evidence required; no probability assigned."]
      - [Base, "Technical and strategic progress continues while financial disclosure remains limited.", "Track rather than underwrite; defer target return until a normalized base exists.", "Opaque cash use, dilution, and delayed commercialization.", "Most defensible current stance; qualitative only."]
      - [Bear, "Delivery slips, margins disappoint, or financing requires a down-round.", "Capital loss or severe dilution is possible; no downside percentage is supportable.", "Production, working capital, field reliability, and multiple compression.", "Material risk; trigger monitoring required."]
      - [Decision gate, "Obtain cap table, cash runway, deliveries, revenue, gross margin, warranty, and order conversion evidence.", "Move to buy only if price and economics support upside after preferences; otherwise remain track/research-more.", "Missing evidence itself delays the decision.", "Unresolved."]
    notes: "Scenarios are qualitative because the assigned sources do not provide a current valuation, revenue base, margins, cash balance, or verified delivery cohorts."
    claimRefs: [CV007, CV010, CV011, CV014, CV016]
