callouts:
  - calloutType: strength
    title: Strategic alignment is unusually visible
    body: FedEx and THOR appear in the retained record as both strategic stakeholders and customers, creating a potentially valuable feedback loop between product validation, capital, and initial demand.
    claimRefs: [CO009, CO015, CO016]
  - calloutType: risk
    title: Production is ahead of disclosure
    body: The public record confirms a production milestone, but it does not yet establish current delivery volume, gross margin, warranty performance, cash conversion, or runway.
    claimRefs: [CO011, CO013]
  - calloutType: recommendation
    title: Next diligence should be operating-data led
    body: The highest-value follow-up is a reconciled production-to-delivery bridge with customer cohorts, cancellations, warranty claims, realized pricing, contribution margin, and cash burn.
    claimRefs: [CO011, CO013]
