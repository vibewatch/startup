company:
  name: Harbinger Motors
chapter:
  number: 1
  title: Company Overview
  summary: Harbinger Motors is a Garden Grove commercial-EV manufacturer focused on medium-duty electric and hybrid stripped-chassis platforms. It has progressed from a February 2021 founding to serial production and large company-announced orders, but retained sources disagree on total funding and do not disclose current revenue, margins, cash runway, delivered-customer cohorts, or valuation support.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Harbinger describes itself as an American commercial electric-vehicle company
      modernizing the medium-duty vehicle industry. Its product is a stripped chassis
      for delivery vans, box trucks, recreational vehicles, emergency-response vehicles,
      and other specialty applications, with the customer or a third-party upfitter
      adding the body. The company says it manufactures in Garden Grove and keeps the
      electric drivetrain, high-voltage battery system, steering, and brakes in-house.
      That architecture gives Harbinger a focused product boundary and lets it sell
      through existing body-builder channels, but it also leaves final-vehicle
      integration, service execution, and realized unit economics partly outside the
      disclosed record. Retained sources place the founding in February 2021 and the
      manufacturing operation in Garden Grove. The $160 million financing announced
      in November 2025 establishes a Series C stage, but the retained record does not
      provide audited revenue or reliable current valuation support.
    claimRefs: [CO001, CO002, CO003, CO009]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and execution capacity
    body: >-
      The official team page identifies John Harris as CEO and co-founder and Phillip
      Weicker as CTO and co-founder, making the founding pair the clearest publicly
      documented centers of commercial and technical accountability. A current
      company-issued engineering job repost describes a production organization
      handling sustaining engineering, warranty reduction, manufacturing defects, and
      supplier quality. That hiring signal is consistent with a platform in serial
      production, but it is not incident-rate evidence and does not establish the
      frequency or severity of warranty claims. The retained official evidence does
      not provide a complete board, committee, observer-rights, or ownership register,
      leaving governance completeness and key-person dependence as diligence gaps.
    claimRefs: [CO004, CO005, CO008]
    tableRefs: [TO002]
  - id: capital-commercialization-and-risks
    title: Capital, commercialization, and remaining gaps
    body: >-
      Harbinger's disclosed commercialization path has three visible stages: strategic
      capital and orders, production, and product expansion. Funding aggregators do not
      reconcile: Tracxn reports $363 million across six rounds, while the retained
      Simplify job profile lists $357.7 million. Separately, the official newsroom
      records a $160 million Series C co-led by FedEx, Capricorn, and THOR Industries.
      Funding raised is not cash available, and the company-announced order book is not
      recognized revenue. Harbinger said it had manufactured more than 100 units and
      held 4,690 vehicle orders worth about $500 million by April 2025. Its September
      2026 FedEx announcement added an order for 2,000 trucks valued above $300 million,
      planned for delivery by the end of 2027. Independent sector coverage nevertheless
      describes a market with many pilots and few scaled deployments, so conversion,
      warranty performance, margins, and liquidity remain the decisive open tests.
    claimRefs: [CO006, CO007, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
