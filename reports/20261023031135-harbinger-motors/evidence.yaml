evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, unit contribution, cash burn, runway, and current valuation support.
    whyItMatters: Funding and orders do not establish profitability, liquidity, or valuation support.
    diligencePath: Request management financial statements, cap table, latest valuation support, and a 24-month cash forecast.
  - type: missing-source
    severity: material
    topic: delivery-cohorts
    missingEvidence: Customer-level delivered units, repeat orders, cancellations, warranty claims, and service outcomes.
    whyItMatters: The conversion from order book and pilot activity to durable scaled revenue remains unverified.
    diligencePath: >-
      Obtain a customer cohort bridge from order to delivery, acceptance, payment, warranty, and renewal or repeat
      order.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Complete legal officer, board, ownership, committee, and observer-rights register.
    whyItMatters: The public team page identifies executives but does not establish governance completeness or control rights.
    diligencePath: >-
      Request the current board roster, committee structure, observer rights, ownership schedule, and founder or
      investor control terms.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: execution-risk
