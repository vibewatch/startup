company:
  name: Harbinger Motors
chapter:
  number: 6
  title: Customers
  summary: Harbinger's public customer evidence has progressed from announced orders and partner programs to named delivery signals, but public data still does not establish delivered-customer cohorts, repeat orders, retention, or unit economics. The strongest proof is concentrated among fleet, RV, and specialty-vehicle counterparties, with conversion and durability still requiring diligence.
sections:
  - id: customer-segments
    title: Buyer and use-case segmentation
    body: >-
      Harbinger sells a stripped-chassis platform into a multi-sided commercial-vehicle workflow rather than a single end-user market. The public record identifies fleet operators such as FedEx and Bimbo Bakeries, RV manufacturer THOR, commercial-vehicle dealers, and specialty or emergency-vehicle upfitters. Harbinger's own materials position the platform for delivery vans, box trucks, recreational vehicles, emergency and disaster-response vehicles, and other medium-duty applications. The economic buyer can therefore be a fleet, an OEM or upfitter, or a dealer ordering inventory, while the daily user is a driver or service operator. This breadth is strategically useful because it opens several demand channels, but it also makes customer quality difficult to compare: an announced order, a dealer allocation, a chassis delivered to an upfitter, and a vehicle operating in a fleet are different adoption states. Public sources do not disclose revenue by segment, paid-versus-unpaid pilot status, or the share of orders that have converted to delivered and revenue-generating vehicles.
    claimRefs: [CU001, CU002, CU003, CU012, CU015]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption evidence and conversion
    body: >-
      The adoption trajectory is directionally positive but unevenly evidenced. RV PRO's 2024 headline reports delivery of Harbinger's first electric chassis to THOR, providing a concrete delivery signal but no volume, acceptance, or operating-outcome detail. Logistics Manager separately reported a 53-vehicle FedEx initial order and expected chassis delivery by the end of 2025, while Harbinger's September 2026 archive text describes a 2,000-truck FedEx order planned for delivery by the end of 2027. These records show expanding commercial intent, but they do not disclose cumulative delivered units, acceptance rates, paid deployment counts, utilization, or cancellation behavior. The 2025 hybrid announcement describes pre-orders and planned 2026 commercial deliveries, so it is evidence of demand and roadmap timing rather than proof of realized revenue. Customer-facing infrastructure is also a gating variable: FedEx says commercial-fleet charging requires planning, policy, utility, and infrastructure work, including more than 500 California charging stations, but that statement is not Harbinger-specific.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named customer proof and durability
    body: >-
      Named-customer proof is strongest where an external counterparty describes a use case or an independent trade publication reports an order. THOR describes a jointly developed hybrid Class A motorhome with an estimated 500-mile range including 150 all-electric miles; this is a partner statement and an award announcement, not a disclosed production cohort or customer-retention metric. Bake Magazine ties Bimbo Bakeries USA to Harbinger's order book and walk-in-van upfits and quotes Bimbo's sustainability executive on the strategic rationale. Logistics Manager reports FedEx's initial Class 5 and Class 6 order and quotes FedEx on performance, price, and operational resilience. These sources support named commercial interest and differentiated use cases, but no source supplies NRR, GRR, churn, renewals, service uptime, repeat-purchase rates, or cohort economics. Harbinger-issued job material references field failures, warranty claims, and quality resolution; it indicates sustaining capability is being built, not that customer durability is proven.
    claimRefs: [CU010, CU011, CU012, CU014]
    tableRefs: [TU003]
  - id: expansion-and-gaps
    title: Expansion, concentration, and diligence implications
    body: >-
      Expansion potential comes from platform reuse across body types and from strategic customers that can create reference value, follow-on orders, or channel access. The reviewed record shows this pattern in THOR's RV relationship, FedEx's fleet-electrification program, and Bimbo's delivery-vehicle use case. Harbinger also sells into a dealer-and-upfitter workflow, widening market access while adding another conversion step before an end fleet operates the vehicle. Public evidence does not quantify customer concentration, order-book backlog quality, deposits, contract enforceability, procurement-cycle length, or the percentage of platform volume dependent on a small number of strategic accounts. FedEx's own charging-infrastructure discussion underscores deployment friction outside Harbinger's direct control. The investment implication is that customer breadth is promising but not yet equivalent to durable recurring demand: diligence should reconcile each announcement to signed contracts, deposits, delivered and accepted units, warranty cohorts, field uptime, repeat orders, and gross margin by customer and upfit configuration.
    claimRefs: [CU015, CU016, CU017, CU018]
    figureRefs: [FU001]
