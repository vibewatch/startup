        - id: order
          label: Order or pre-order
          detail: "Public sources describe a 53-vehicle FedEx initial order, a later 2,000-truck archive preview, and hybrid pre-orders."
        - id: chassis
          label: Chassis realization
          detail: "RV PRO reported a first THOR chassis delivery; the reviewed public evidence does not reconcile cumulative production and accepted deliveries."
        - id: upfit
          label: Customer upfit
          detail: "Dealers or third parties add box-truck, walk-in-van, RV, or specialty bodies."
        - id: deployment
          label: Fleet deployment
          detail: "Delivery and acceptance timing are disclosed selectively and do not establish active utilization."
        - id: expansion
          label: Repeat order and expansion
          detail: "NRR, GRR, churn, warranty cohorts, repeat orders, and customer-level margin are not public."
    approximationNotes: "The sequence is analytical, not a measured conversion funnel; public evidence does not provide stage conversion rates or cohort denominators."
    claimRefs: [CU008, CU009, CU015, CU018]
