      - [FedEx, Parcel and pickup-delivery fleet, "Class 5 and 6 electric delivery vehicles", "Initial order reported; later larger order previewed", "FedEx cited performance, price, and operational resilience as decision criteria", "Public sources do not show completed deployment or repeat-order behavior"]
