          detail: Dealers or third parties add box-truck, walk-in-van, RV, or specialty bodies.
        - id: deployment
          label: Fleet deployment
          detail: Delivery and acceptance timing are disclosed selectively and do not establish active utilization.
        - id: expansion
          label: Repeat order and expansion
          detail: NRR, GRR, churn, warranty cohorts, repeat orders, and customer-level margin are not public.
