      - number: '1.2'
        title: Leadership, governance, and execution capacity
        blocks:
          - type: paragraph
            body: >-
              The official team page identifies John Harris as CEO and co-founder and Phillip Weicker as CTO and
              co-founder, making the founding pair the clearest publicly documented centers of commercial and technical
              accountability. A current company-issued engineering job repost describes a production organization
              handling sustaining engineering, warranty reduction, manufacturing defects, and supplier quality. That
              hiring signal is consistent with a platform in serial production, but it is not incident-rate evidence and
              does not establish the frequency or severity of warranty claims. The retained official evidence does not
              provide a complete board, committee, observer-rights, or ownership register, leaving governance
              completeness and key-person dependence as diligence gaps.
            claimRefs:
              - CO004
              - CO005
              - CO008
