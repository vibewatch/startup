chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Harbinger describes itself as an American commercial electric-vehicle company modernizing the medium-duty
              vehicle industry. Its product is a stripped chassis for delivery vans, box trucks, recreational vehicles,
              emergency-response vehicles, and other specialty applications, with the customer or a third-party upfitter
              adding the body. The company says it manufactures in Garden Grove and keeps the electric drivetrain,
              high-voltage battery system, steering, and brakes in-house. That architecture gives Harbinger a focused
              product boundary and lets it sell through existing body-builder channels, but it also leaves final-vehicle
              integration, service execution, and realized unit economics partly outside the disclosed record. Retained
              sources place the founding in February 2021 and the manufacturing operation in Garden Grove. The $160
              million financing announced in November 2025 establishes a Series C stage, but the retained record does
              not provide audited revenue or reliable current valuation support.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
