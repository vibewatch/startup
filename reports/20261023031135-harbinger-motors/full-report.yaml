      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Independent trade coverage reported a first electric-chassis delivery to THOR, while a 2026 Work Truck
              Week article described the HC Series Cab as available for electric and plug-in-hybrid orders. Those are
              more concrete maturity signals than a concept reveal, but neither establishes sustained production
              cadence, delivered-fleet uptime, or warranty performance. Other company announcements point to a broader
              roadmap: Harbinger Industria applies battery technology to off-grid systems, and the Phantom AI
              acquisition is intended to add ADAS technology. American Rheinmetall coverage describes joint pursuit of
              robotic and uncrewed ground vehicles, while the partner material still frames work as demonstrations and
              prototyping rather than scaled deployment.
            claimRefs:
              - CE004
