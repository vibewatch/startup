        - Positive operating evidence required; no probability assigned.
      - - Base
        - Technical and strategic progress continues while financial disclosure remains limited.
        - Track rather than underwrite; defer target return until a normalized base exists.
        - Opaque cash use, dilution, and delayed commercialization.
