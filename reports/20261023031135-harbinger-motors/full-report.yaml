            body: >-
              The disclosed architecture centers on a stripped chassis containing the electric drive unit, battery
              system, steering, brakes, and related controls. Trade coverage adds that Panasonic supplies 2170 battery
              cells and that Harbinger designs and assembles the chassis at its Garden Grove headquarters before dealer
              or customer upfitting. Public job postings provide further operating detail: chassis assembly spans
              suspension, steering, brakes, and wiring harnesses, while new-product introduction links engineering,
              procurement, manufacturing, quality, and supplier development. These signals support a meaningful internal
              integration scope, but they do not prove battery-supply resilience, manufacturing yield, capacity, or
