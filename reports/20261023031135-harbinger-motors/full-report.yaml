      - number: '1.3'
        title: Capital, commercialization, and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              Harbinger's disclosed commercialization path has three visible stages: strategic capital and orders,
              production, and product expansion. Funding aggregators do not reconcile: Tracxn reports $363 million
              across six rounds, while the retained Simplify job profile lists $357.7 million. Separately, the official
              newsroom records a $160 million Series C co-led by FedEx, Capricorn, and THOR Industries. Funding raised
              is not cash available, and the company-announced order book is not recognized revenue. Harbinger said it
              had manufactured more than 100 units and held 4,690 vehicle orders worth about $500 million by April 2025.
              Its September 2026 FedEx announcement added an order for 2,000 trucks valued above $300 million, planned
              for delivery by the end of 2027. Independent sector coverage nevertheless describes a market with many
              pilots and few scaled deployments, so conversion, warranty performance, margins, and liquidity remain the
              decisive open tests.
