  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Harbinger's market is the medium-duty commercial vehicle platform and stripped-chassis layer, not the
              entire commercial-vehicle market. The company's public description places the chassis beneath walk-in
              vans, box trucks, delivery vehicles, recreational vehicles, emergency-response vehicles, and other
              specialty bodies. That boundary includes the chassis, battery, drivetrain, steering, brakes, and related
              vehicle systems, while excluding third-party body upfit, fleet operations, charging services, and most
              downstream maintenance economics. The buyer can still choose a diesel or gasoline chassis, a hybrid, an
              incumbent OEM platform, or an internal electrification program; those are status-quo substitutes even when
              they are not direct product competitors. Harbinger's 2024 order announcement says selling a stripped
              chassis separately from its body is standard practice among large gas and diesel incumbents, which
              supports treating the platform layer as the relevant comparison unit rather than comparing Harbinger with
              complete vehicles on an undifferentiated basis.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing through separate lenses
        blocks:
          - type: paragraph
            body: >-
              The strongest public market numbers use different denominators and should not be added together.
              Automotive Fleet reports a 14.4 million-unit estimate for the U.S. commercial truck fleet's Total Electric
              Potential as of the first quarter of 2025, based on trip length, payload, and fueling infrastructure
              assumptions. The same report says 67% of commercial-use trucks travel fewer than 100 miles per round trip
              and identifies roughly four million pickups in construction, agriculture, and landscaping as potentially
              replaceable based on usage patterns. Those figures describe technical or operational potential, not a
              forecast of Harbinger purchases. A narrower commercial proof point is Harbinger's announced FedEx order
              for 2,000 trucks worth more than $300 million, planned for delivery by the end of 2027. The order is
              company-reported and customer-specific, so it is evidence of a qualified deployment path rather than
              market share. ICCT's 2025 U.S. zero-emission heavy-duty registration data shows only 875 zero-emission
              heavy-duty registrations, down 20.7% from 1,103 in 2024, underscoring the difference between theoretical
              potential and realized adoption. A defensible SAM or SOM therefore remains unavailable without Harbinger's
              target-class volumes, geographic serviceability, pricing, and conversion assumptions.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The immediate economic buyer is a fleet or specialty-vehicle operator, while the user is the driver and
              operations team and the payer may be a procurement, fleet, sustainability, or capital-budget owner.
              Harbinger's disclosed customers and order channels span parcel delivery, food distribution, recreational
              vehicles, dealers, and healthcare or emergency applications, indicating a multi-segment route to market
              rather than one homogeneous buyer. The adoption trigger is strongest where vehicles return to a depot,
              route lengths are predictable, and fuel and maintenance savings can be measured against a diesel
              replacement. The adoption path still requires an upfitter, charging and utility planning, service
              coverage, incentives or acceptable upfront economics, and confidence that production deliveries will
              arrive on schedule. Harbinger's 2025 start-of- production release says it had manufactured more than 100
              units and delivered product to customers including THOR Industries, while the 2026 FedEx announcement
              describes a planned 2,000-vehicle delivery program. These milestones improve proof of a route from
              platform sale to deployment, but public evidence does not disclose conversion rates, delivered fleet
              uptime, repeat orders, or gross-margin contribution by segment.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Regulation and fleet economics support demand, but neither guarantees adoption. EPA's Phase 3 heavy-duty
              rule applies from model year 2027 to vocational vehicles and tractors and is technology-neutral and
              performance-based, creating a compliance demand signal without requiring battery-electric power
              specifically. The market's practical driver is route economics: Harbinger estimates that each truck can
              reduce fuel cost by an average of $20,000 annually versus a conventional diesel vehicle, but that is a
              company estimate whose outcome depends on route, energy prices, utilization, charging, and maintenance.
              Automotive Fleet identifies infrastructure and vehicle cost as key barriers. NREL's report centers on
              medium- and heavy-duty charging-infrastructure development, while the State of Sustainable Fleets
              describes utility and charging partnerships as essential to fleet-electrification programs. Harbinger job
              postings also describe current-production engineering, supplier-quality, warranty, and field-failure work,
              which is a signal of execution demands, not evidence that those risks are solved. For valuation, the
              relevant bridge is therefore qualified orders and repeatable production economics, not the broad
              technical-potential headline. Public disclosure remains insufficient to quantify a validated SAM, realized
              contribution margin, or scaled adoption curve.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is large in operating potential, not yet in validated Harbinger revenue
            body: >-
              Public evidence supports a large technical opportunity and a credible customer deployment path, but it
              does not establish Harbinger's SAM, SOM, repeat-order rate, realized unit economics, or
              production-constrained serviceable volume.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM012
              - CM016
          - type: callout
            title: Charging and production execution are adoption gates
            body: >-
              Route suitability can be offset by charging infrastructure, upfront vehicle cost, incentives, service
              coverage, supplier quality, and delivery timing; these constraints should be tested by cohort and duty
              cycle rather than assumed away in a broad TAM.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than electric-vehicle startups. Fleet buyers can purchase
              conventional diesel or gasoline medium-duty vehicles, use an incumbent dealer and service network, select
              a battery-electric van or truck from a larger manufacturer, or defer replacement while waiting for
              incentives and operating economics to improve. Harbinger addresses the medium-duty chassis layer rather
              than every body application: its platform supports walk-in vans, box trucks, recreational vehicles, and
              specialty vehicles, while a third party upfits the body after chassis assembly. That architecture can let
              one platform serve multiple niches, but it also leaves body integration, service coverage, and customer
              procurement as decision points outside Harbinger's direct control. The company describes a zero
              acquisition-premium objective, yet no retained source provides realized transaction prices,
              total-cost-of-ownership comparisons, or a verified fleet conversion rate. The competitive conclusion is
              therefore capability-led rather than price-led.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP009
              - CP013
      - number: '3.2'
        title: Capability and scale comparison
        blocks:
          - type: paragraph
            body: >-
              Harbinger's differentiation is concentrated in an integrated chassis and powertrain: company materials
              describe an independent front suspension, an 800 VDC liquid-cooled battery system, and a 14-pole motor
              rated at 330 kW. A separate production announcement reports more than 100 manufactured units and names
              THOR Industries, ETHERO Truck + Energy, and Bruckner's Truck among first-line customers and dealers. These
              are meaningful commercialization signals, but they are company-issued and do not disclose delivered
              cohorts, uptime, warranty frequency, or realized margins. The public-company comparables illustrate the
              scale advantage Harbinger must overcome: Blue Bird has a long-established North American school-bus
              portfolio and dealer/service network, while Xos is a public commercial-EV peer with ongoing product and
              financing-market visibility. Harbinger's technical breadth appears credible; relative scale, service
              density, and independently verified reliability remain unproven. A 2023 company page adds evidence of
              vertical integration by stating that Harbinger's expanded facility would support research, chassis
              assembly, and battery-pack manufacturing.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: Durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Switching to Harbinger requires more than selecting a powertrain: fleets must validate body compatibility,
              charging and depot workflows, maintenance coverage, residual value, driver acceptance, and financing.
              Harbinger's company-issued assembly role calls for inspections, defect detection, and diagnosis of
              assembly issues; these are normal production controls, but they also identify operational proof points
              that buyers will scrutinize. Competitive displacement risk is material. Independent reporting describes GM
              ending BrightDrop production after slower-than-expected commercial-EV-market development and notes that
              Rivian's commercial vans and Ford's E-Transit had materially higher reported deliveries in the cited
              periods. Separately, Lion's court-protection announcement shows that an electric commercial-vehicle
              manufacturer can reach restructuring despite a relevant product portfolio. These outcomes do not prove
              Harbinger will fail, but they weaken any assumption that technical differentiation alone creates a durable
              moat. The strongest moat candidate is accumulated fleet data, service execution, and repeat orders; none
              is disclosed with enough detail here to underwrite it.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and commercial proof
        blocks:
          - type: paragraph
            body: >-
              Harbinger's core monetization mechanism is the sale of vertically integrated medium-duty chassis and
              vehicles, with dealers or customers adding the final commercial or specialty body. That model has moved
              past prototypes: Harbinger said it had manufactured more than 100 units by April 2025, and its October
              2026 FedEx announcement described a binding order for 2,000 all-electric trucks worth more than $300
              million, planned for delivery by the end of 2027. The company is also broadening the revenue surface
              through hybrid work trucks, battery and auxiliary-power products, mobile-healthcare platforms, and
              licensing associated with Phantom AI. These adjacencies are credible product paths, but none comes with
              disclosed revenue contribution, backlog accounting, or recognition policy.
            claimRefs:
              - CI001
              - CI005
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
