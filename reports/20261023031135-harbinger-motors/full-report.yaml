      - number: '4.2'
        title: Pricing, order quality, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The FedEx order implies a gross order value above $150,000 per truck before any allocation to options,
              services, delivery, or other contract elements; it is therefore an order-level arithmetic proxy, not
              disclosed list or realized vehicle pricing. Harbinger separately markets zero acquisition premium versus
              comparable diesel or gasoline vehicles and estimates $20,000 of annual fuel savings per electric truck.
              Both are company claims, and neither establishes realized gross margin. The jump from a January 2025
              company-reported order book of 4,690 vehicles to the later FedEx commitment is meaningful evidence of
              enterprise demand, but public materials do not disclose deposits, cancellations, payment milestones,
              customer concentration economics, sales-cycle length, CAC, or contract enforceability terms.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure, capital intensity, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Harbinger designs and assembles the powertrain, battery system, steering, brakes, and other major chassis
              systems in-house. That integration may capture supplier margin and enable cost-down work, but it also
              exposes the company to tooling, inventory, factory utilization, warranty, supplier quality, and
              sustaining-engineering costs. A reposted Harbinger engineering role explicitly calls for value
              engineering, warranty and field-failure investigation, manufacturing-defect resolution, and
              supplier-quality work, illustrating the recurring cost centers behind the platform. The 2025 Series B was
              earmarked for higher-volume capacity, parts and service, supplier tooling, and new products. Later capital
              adds financing capacity, but funding raised is not cash available, and no current cash balance, burn rate,
              runway, debt schedule, or next-round trigger is public.
            claimRefs:
              - CI002
              - CI004
              - CI009
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI009
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial evidence is strongest on demand and weakest on conversion into profitable cash flow. A large
              order, serial production, product-line expansion, and strategic counterparties reduce go-to-market
              uncertainty, but delivery timing and manufacturing scale shift risk into working capital, execution,
              service, and warranty. Simplify's editorial critique that diesel economics could pressure order conversion
              and margins is low-confidence evidence rather than a benchmark, yet it identifies the correct underwriting
              stress: purchase orders do not establish revenue quality or contribution margin. Until management provides
              audited revenue, backlog conversion, bill-of-materials cost, warranty cohorts, gross margin, cash, burn,
              and capex requirements, valuation work should use scenario ranges and treat capital adequacy as
              unresolved.
            claimRefs:
              - CI001
              - CI005
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand proof is not earnings proof
            body: >-
              The greater-than-$300 million FedEx order is the strongest public demand signal, but no assigned source
              discloses revenue recognition, gross margin, cancellation protection, cash burn, or the working capital
              needed to deliver it.
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Harbinger supplies the vehicle foundation rather than every finished vehicle: independent coverage
              describes a ready-to-build chassis for the established medium-duty upfitter ecosystem, and the company
              says a dealer or customer then works with a third party to add the commercial or specialty body. The
              current electric line covers Class 4–6 stripped chassis, multiple wheelbases, 140–210 kWh battery
              configurations, and company-stated range up to 210 miles. The product surface is widening beyond that
              base. Harbinger's 2026 newsroom lists an electric and hybrid HC Series Cab, an off-grid energy-storage
              line for Airstream, and a defense-oriented hybrid platform. This breadth increases addressable use cases,
              but also increases configuration, integration, service, and validation complexity.
