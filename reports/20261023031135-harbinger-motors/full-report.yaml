      - number: '5.4'
        title: Differentiation, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Harbinger's differentiation case is the combination of electric-first packaging, in-house vehicle-system
              development, compatibility with existing upfitting workflows, and extension of the same platform logic
              into hybrid and autonomous-ready applications. The official electric-chassis page also describes embedded
              diagnostics intended to give fleet managers real-time information, while assembly postings describe
              inspections, quality checks, and defect handling. These are positive design and process signals, not
              outcome evidence. The reviewed public material does not disclose fleet failure rates, warranty cohorts,
              software-update governance, cybersecurity testing, certification inventories, or supplier concentration.
              Investment underwriting therefore needs configuration-level reliability and quality data before treating
              architectural coherence as a proven service-cost or uptime advantage.
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent platform logic
            body: >-
              Harbinger's chassis, powertrain, battery, and control capabilities are presented as reusable across
              commercial, specialty, energy, and defense applications.
            calloutType: strength
            claimRefs:
              - CE005
              - CE008
              - CE013
              - CE015
          - type: callout
            title: Architecture is ahead of public validation
            body: >-
              Serial production and process descriptions do not disclose the field reliability, warranty, cybersecurity,
              or scaled-yield evidence required to underwrite lifecycle performance.
            calloutType: risk
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Harbinger sells a stripped-chassis platform into a multi-sided commercial-vehicle workflow rather than a
              single end-user market. The public record identifies fleet operators such as FedEx and Bimbo Bakeries, RV
              manufacturer THOR, commercial-vehicle dealers, and specialty or emergency-vehicle upfitters. Harbinger's
              own materials position the platform for delivery vans, box trucks, recreational vehicles, emergency and
              disaster-response vehicles, and other medium-duty applications. The economic buyer can therefore be a
              fleet, an OEM or upfitter, or a dealer ordering inventory, while the daily user is a driver or service
              operator. This breadth is strategically useful because it opens several demand channels, but it also makes
              customer quality difficult to compare: an announced order, a dealer allocation, a chassis delivered to an
              upfitter, and a vehicle operating in a fleet are different adoption states. Public sources do not disclose
              revenue by segment, paid-versus-unpaid pilot status, or the share of orders that have converted to
              delivered and revenue-generating vehicles.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU011
      - number: '6.2'
        title: Adoption evidence and conversion
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is directionally positive but unevenly evidenced. RV PRO's 2024 headline reports
              delivery of Harbinger's first electric chassis to THOR, providing a concrete delivery signal but no
              volume, acceptance, or operating-outcome detail. Logistics Manager separately reported a 53-vehicle FedEx
              initial order and expected chassis delivery by the end of 2025, while Harbinger's September 2026 archive
              text describes a 2,000-truck FedEx order planned for delivery by the end of 2027. These records show
              expanding commercial intent, but they do not disclose cumulative delivered units, acceptance rates, paid
              deployment counts, utilization, or cancellation behavior. The 2025 hybrid announcement describes
              pre-orders and planned 2026 commercial deliveries, so it is evidence of demand and roadmap timing rather
              than proof of realized revenue. Customer-facing infrastructure is also a gating variable: FedEx says
              commercial-fleet charging requires planning, policy, utility, and infrastructure work, including more than
              500 California charging stations, but that statement is not Harbinger-specific.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              Named-customer proof is strongest where an external counterparty describes a use case or an independent
              trade publication reports an order. THOR describes a jointly developed hybrid Class A motorhome with an
              estimated 500-mile range including 150 all-electric miles; this is a partner statement and an award
              announcement, not a disclosed production cohort or customer-retention metric. Bake Magazine ties Bimbo
              Bakeries USA to Harbinger's order book and walk-in-van upfits and quotes Bimbo's sustainability executive
              on the strategic rationale. Logistics Manager reports FedEx's initial Class 5 and Class 6 order and quotes
              FedEx on performance, price, and operational resilience. These sources support named commercial interest
              and differentiated use cases, but no source supplies NRR, GRR, churn, renewals, service uptime,
              repeat-purchase rates, or cohort economics. Harbinger-issued job material references field failures,
              warranty claims, and quality resolution; it indicates sustaining capability is being built, not that
              customer durability is proven.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU010
              - CU012
      - number: '6.4'
        title: Expansion, concentration, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Expansion potential comes from platform reuse across body types and from strategic customers that can
              create reference value, follow-on orders, or channel access. The reviewed record shows this pattern in
              THOR's RV relationship, FedEx's fleet-electrification program, and Bimbo's delivery-vehicle use case.
              Harbinger also sells into a dealer-and-upfitter workflow, widening market access while adding another
              conversion step before an end fleet operates the vehicle. Public evidence does not quantify customer
              concentration, order-book backlog quality, deposits, contract enforceability, procurement-cycle length, or
              the percentage of platform volume dependent on a small number of strategic accounts. FedEx's own
              charging-infrastructure discussion underscores deployment friction outside Harbinger's direct control. The
              investment implication is that customer breadth is promising but not yet equivalent to durable recurring
              demand: diligence should reconcile each announcement to signed contracts, deposits, delivered and accepted
              units, warranty cohorts, field uptime, repeat orders, and gross margin by customer and upfit
              configuration.
            claimRefs:
              - CU015
              - CU016
              - CU017
              - CU018
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU009
              - CU015
              - CU018
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk hierarchy and investment implication
        blocks:
          - type: paragraph
            body: >-
              The leading residual risk is execution at the intersection of manufacturing scale, field reliability, and
              customer conversion. Harbinger reported more than 100 manufactured units in April 2025 and an order book
              of 4,690 vehicles valued at about $500 million, while a September 2026 company release described a
              2,000-truck FedEx order valued above $300 million with delivery planned by the end of 2027. Those are
              meaningful demand and production signals, but they also concentrate the next proof point in a steep ramp
              whose warranty performance and conversion economics are not public. The investment implication is to treat
              booked demand as execution exposure until deliveries, acceptance, gross margin, and repeat orders are
              independently evidenced.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory and legal posture remains an evidence gap
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool contains no direct regulator, court, certification, enforcement, recall, or
              incident record for Harbinger. That is not evidence that such matters are absent. The company describes an
              800-volt battery architecture using 2170-format lithium-ion cells, making vehicle-safety, high-voltage,
              battery-handling, and environmental compliance important diligence tracks. A company-authored controller
              posting also says Harbinger is building financial-reporting controls, statutory compliance, audit
              readiness, and eventual SOX readiness. The mitigation signal is real but incomplete: investors should
              require vehicle certifications, regulator correspondence, recall and claim histories, environmental
              permits, litigation schedules, and control-audit findings before treating this category as contained.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: Manufacturing, reliability, and product-quality risk
        blocks:
          - type: paragraph
            body: >-
              Harbinger's own hiring materials identify the operating disciplines required to keep a young production
              system stable. An assembly role calls for inspections at each stage and correction of defects or
              deviations; a sustaining-engineering role covers field failures, warranty claims, manufacturing defects,
              line stops, supplier-quality issues, and validation of alternative suppliers. These responsibilities do
              not prove that a material incident has occurred, but they show where execution can fail as output rises.
              The technology page's 450,000-mile service-life claim is therefore a diligence target rather than
              independent reliability proof. Cohort-level mileage, downtime, warranty frequency, severity, root causes,
              and closure times are required to test the claim.
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: External dependencies, financial controls, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Harbinger depends on third-party upfitters to turn its chassis into finished specialty vehicles, suppliers
              to sustain series production, customers to convert orders on schedule, and utilities and charging
              developers to make fleet deployment practical. Industry sources report slow federal charging deployment,
              uncertain 2026 funding, installation delays, utility workload constraints, and very large infrastructure
              requirements. Internally, the controller mandate indicates that cost accounting, inventory, revenue
              recognition, close, audit, and reporting systems are still being scaled. Thesis-break triggers are missed
              2027 FedEx deliveries, material warranty or safety trends, repeated supplier line stops, delayed
              certifications, order cancellations, or an inability to demonstrate positive unit contribution and
              adequate liquidity.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Stop underwriting scale if the FedEx delivery schedule materially slips, warranty or safety cohorts
              deteriorate, certifications remain unavailable before delivery, repeated supplier failures constrain
              output, or management cannot evidence unit contribution and runway.
            calloutType: risk
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a capitalized commercial-vehicle platform with strategic investors and customers.
              Harbinger announced a $160 million Series C in November 2025 and said cumulative funding reached $358
              million; the same release described a 53-vehicle FedEx order and a THOR collaboration. The company
              presents an in-house, modular chassis and a production ramp, while an independent trade article described
              the two initial platforms and their intended fleet use. These are commercial and product signals, not
              proof of profitable scale.

              The anti-thesis is disclosure and execution risk. Public evidence in this pool does not establish a
              current valuation, realized revenue, gross margin, contribution margin, burn, runway, cancellation rate,
              warranty rate, or delivered-customer cohort. A current Harbinger chassis-engineering listing calls for
              sustaining work on field failures, warranty claims, manufacturing defects, cost reduction, and supplier
              quality; that is evidence of an active production-support function, not evidence of defect rates or
              successful remediation. Company-issued and company-reposted material dominates the available
              Harbinger-specific evidence; the independent material is primarily historical or descriptive. Public
              comparables show that commercial-EV and specialty-vehicle businesses can have materially different scale
              and economics: Yahoo Finance reported Blue Bird at $1.932 billion market capitalization on October 22,
              2026, while Stock Analysis reported $2.50 billion on July 23, 2026, illustrating date and source
              dispersion rather than a direct Harbinger multiple. A private-company price cannot be judged from those
              market caps without a normalized revenue, margin, growth, and capital-structure bridge.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
      - number: '8.2'
        title: Price discipline and scenario logic
        blocks:
          - type: paragraph
            body: >-
              Entry discipline should be evidence-gated rather than multiple-driven. The disclosed Series C amount is
              financing raised, not cash currently available and not an equity valuation. The FedEx order and the THOR
              relationship can support a commercialization thesis, but neither source establishes recognized revenue,
              gross profit, customer concentration, payment terms, or the portion of an order that will convert to
              delivered vehicles. The valuation case therefore cannot responsibly produce a point estimate or target
              return from this pool.

              A bull outcome requires verified conversion of strategic orders into repeat deliveries, manufacturing
              yield and warranty data, improving unit economics, and a financing price that leaves adequate upside after
              dilution and preferences. The base case is continued technical and customer progress with insufficient
              disclosure for a confident price call. The bear case is delayed production or order conversion, cost and
              working-capital pressure, additional dilution, or multiple compression as public commercial-EV peers
              demonstrate weak economics. The trigger for moving from track to buy is a disclosed or diligence-verified
              valuation paired with revenue, gross-margin, delivery, and cash-runway evidence; a material down-round,
              missed delivery milestones, or adverse field-quality data would move the stance toward research-more or
              avoid.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV010
              - CV011
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV012
              - CV016
      - number: '8.3'
        title: Recommendation, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: track, with medium confidence and high risk. The recommendation is price-sensitive:
              strategic backing and announced orders improve the operating thesis, but the absence of a public price and
              core financial KPIs prevents a supported attractive or fair valuation stance. The company appears
              financing-capable, yet exit readiness remains unproven because no assigned source establishes audited
              financials, liquidity, a public listing path, or an arms-length secondary mark.

              Before an investment decision, request the latest cap table and financing terms, liquidation preferences
              and option pool, cash balance and monthly burn, backlog-to-delivery reconciliation, recognized revenue by
              customer, gross margin by platform, warranty and field-service cohorts, supplier concentration, and the
              status of the FedEx and THOR programs. Obtain independent evidence on production volume and order
              conversion. Monitor delivered units, gross margin, working-capital use, warranty claims, financing runway,
              and any down-round or covenant event as thesis-break indicators.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending price discovery
            body: >-
              The evidence supports continued diligence, not a buy: financing and strategic orders are visible, while
              the price, profitability, liquidity, and conversion evidence needed to assess return are not.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV007
              - CV012
          - type: callout
            title: Financing is not valuation
            body: >-
              The disclosed $358 million cumulative funding total is capital raised, not cash available and not an
              equity valuation; cap-table terms and current liquidity remain diligence requirements.
            calloutType: risk
            claimRefs:
              - CV002
              - CV007
              - CV014
