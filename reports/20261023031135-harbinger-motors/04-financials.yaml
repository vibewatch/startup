      - [Hybrid and HC Series work trucks, "Vehicle or chassis sale plus options", "HC Series available for order; hybrid configuration offered", "Product availability disclosed; realized price and volume undisclosed", "Provide SKU price book, options mix, orders, and realized ASP"]
      - [Battery and auxiliary-power systems, "Battery or power-system sale", "Harbinger Industria launched with Airstream as first customer", "Named customer, no value or delivery schedule", "Provide contract value, unit volumes, margin, and exclusivity"]
      - [Mobile-healthcare platforms, "Chassis, battery technology, and engineering support", "Frazer partnership and strategic investment", "Development relationship; commercial consideration undisclosed", "Provide development milestones, purchase commitments, and engineering reimbursement"]
      - [ADAS licensing, "Technology-license revenue", "ZF licensing agreement announced with Phantom AI acquisition", "New stream announced; economics and recognition undisclosed", "Provide royalty basis, minimums, term, and expected revenue timing"]
    notes: "Status reflects public company and partner announcements through 2026-10-23; undisclosed contract economics are shown as diligence asks, not estimates."
    claimRefs: [CI005, CI010, CI011, CI012, CI013]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Public value, Basis, Limitation]
    rows:
      - [FedEx order value per truck, "More than $150,000 implied", "More than $300 million divided by 2,000 trucks", "Derived order average; options, services, and contract allocation are unknown"]
      - [Acquisition premium, "Zero premium claimed", "Harbinger comparison with comparable gas or diesel vehicles", "No SKU-level list price, incentive treatment, or realized invoice"]
      - [Annual fuel saving per electric truck, "$20,000 estimated", "Harbinger estimate versus the diesel vehicle replaced", "Duty cycle, energy prices, charging cost, and utilization assumptions undisclosed"]
      - [Historical order-book average, "Approximately $106,600 implied", "$500 million divided by 4,690 company-reported orders in January 2025", "Historical, mixed-product arithmetic; not current ASP or recognized revenue"]
    notes: "Implied values are simple arithmetic on company-reported order totals and are not list prices, transaction prices, revenue, ARR, or gross profit."
    claimRefs: [CI003, CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital-adequacy ledger
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue and backlog conversion, null, "Unavailable", "Tests whether announced demand becomes recognized sales", "Monthly deliveries, recognized revenue, deferred revenue, cancellations, and remaining performance obligations"]
      - [Vehicle gross margin, null, "Unavailable", "Determines whether scale creates or consumes cash", "Gross margin by platform, bill of materials, labor, freight, warranty, and purchase-price variance"]
      - [CAC and payback, null, "Unavailable", "Measures enterprise GTM efficiency", "Sales and marketing spend, sales-cycle cohort, win rate, and gross-profit payback"]
      - [Working-capital intensity, null, "Unavailable", "Large orders can require inventory and receivables financing before collection", "Deposits, payment milestones, inventory days, receivable days, and supplier terms"]
      - [Warranty and service burden, null, "Unavailable", "Field failures can reverse early vehicle contribution", "Failure cohorts, claims per vehicle, reserve policy, parts cost, and service labor"]
      - ["Cash, burn, runway, and committed capex", null, "Unavailable", "Determines ability to fund end-2027 deliveries without another financing", "Cash and debt schedule, monthly burn, capex plan, borrowing base, and next-round trigger"]
    notes: "Null means the assigned public evidence does not disclose a supportable value; funding raised is not substituted for cash available or runway."
    claimRefs: [CI004, CI009, CI014, CI016]
figures:
  - id: FI001
    title: Revenue conversion path
    type: flow
    summary: >-
      Commercial commitments convert into revenue only after production,
      upfitting, delivery, acceptance, and any contract-specific recognition
      conditions.
    data:
      nodes:
        - id: order
          label: Fleet, dealer, or OEM commitment
          detail: Order value and enforceability depend on contract terms.
        - id: production
          label: Integrated chassis production
          detail: Harbinger assembles major vehicle systems in-house.
        - id: upfit
          label: Body upfit or application integration
          detail: Dealer, customer, or partner completes the end-use vehicle.
        - id: delivery
          label: Delivery and customer acceptance
          detail: The FedEx order targets completion by the end of 2027.
        - id: vehicle-revenue
          label: Vehicle or chassis revenue
          detail: Recognition timing and gross margin are not publicly disclosed.
        - id: adjacent-revenue
          label: Service, battery, and licensing revenue
          detail: Multiple streams are announced, but public economics remain unavailable.
    approximationNotes: "The sequence is a business-model map, not a forecast; it does not assign conversion rates or revenue values."
    claimRefs: [CI005, CI009, CI011, CI012, CI013, CI016]
callouts:
  - calloutType: risk
    title: Demand proof is not earnings proof
    body: >-
      The greater-than-$300 million FedEx order is the strongest public demand
      signal, but no assigned source discloses revenue recognition, gross
      margin, cancellation protection, cash burn, or the working capital needed
      to deliver it.
    claimRefs: [CI005, CI016]
