callouts:
  - calloutType: insight
    title: The market is large in operating potential, not yet in validated Harbinger revenue
    body: >-
      Public evidence supports a large technical opportunity and a credible
      customer deployment path, but it does not establish Harbinger's SAM, SOM,
      repeat-order rate, realized unit economics, or production-constrained
      serviceable volume.
    claimRefs: [CM004, CM007, CM012, CM016]
  - calloutType: risk
    title: Charging and production execution are adoption gates
    body: >-
      Route suitability can be offset by charging infrastructure, upfront
      vehicle cost, incentives, service coverage, supplier quality, and delivery
      timing; these constraints should be tested by cohort and duty cycle rather
      than assumed away in a broad TAM.
    claimRefs: [CM013, CM014, CM015]
