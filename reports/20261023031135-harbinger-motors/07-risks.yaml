    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Investment kill criteria
    body: >-
      Stop underwriting scale if the FedEx delivery schedule materially slips, warranty or safety
      cohorts deteriorate, certifications remain unavailable before delivery, repeated supplier
      failures constrain output, or management cannot evidence unit contribution and runway.
    claimRefs: [CR005, CR010, CR011, CR013]
