        - High
        - Independent evidence against the claimed 450,000-mile service life
      - - Charging availability or fleet-site energization delay
        - High
        - Medium-high
        - Mostly outside company control
        - High
        - Customer-site power studies, energization schedules, and charger uptime
    notes: >-
      Qualitative likelihood and severity reflect cited operating responsibilities and industry
      constraints, not measured Harbinger incident probabilities; security incident data were unavailable.
    claimRefs: [CR002, CR006, CR007, CR008, CR009, CR012, CR013, CR014, CR015]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role and concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Body integration and final vehicle completion
        - Third-party upfitters and dealers
        - Required downstream step after chassis assembly
        - Integration delay, quality dispute, or incomplete delivery
        - High
        - Existing medium-duty upfit model and dealer relationships
        - Medium-high; require acceptance, rework, and delivery-cycle data
      - - Charging and site power
        - Utilities, states, charging contractors, and customers
        - External infrastructure with fragmented funding and execution
        - Depot energization arrives after vehicle delivery
        - High
        - Customer site planning and mixed electric/hybrid offering
        - High; require site-by-site readiness and uptime plans
      - - Large order conversion
        - FedEx and other fleet buyers
        - FedEx order represents 2,000 trucks and more than $300 million by company report
        - Schedule slip, cancellation, or margin-destructive fulfillment
        - High
        - Planned deliveries through the end of 2027
        - High; require binding terms, deposits, cancellation rights, and delivery acceptance data
      - - Series-production components
        - Current and alternative suppliers
        - Supplier quality directly affects line continuity and field reliability
        - Defect, capacity shortfall, or failed resourcing interrupts production
        - High
        - PPAP updates, audits, validation, and alternative-supplier work
        - Medium-high; obtain sole-source map, lead times, and supplier scorecards
    notes: >-
      Dependency and concentration judgments use public company disclosures and industry evidence;
      contract protections, sole-source exposure, and customer concentration percentages remain private.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR013]
