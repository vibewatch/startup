      - [Electric and hybrid powertrain, "Integrated electric drive unit; range extender in the hybrid configuration", "Powertrain assembly, controls, and gasoline subsystem where applicable", "Yield, durability, emissions, and repair economics remain undisclosed"]
      - [Controls and diagnostics, "Embedded vehicle controls and real-time diagnostic data", "Software, sensors, data interfaces, and planned ADAS integration", "Cybersecurity, update governance, and validation evidence are incomplete"]
      - [Assembly and quality, "Mechanical and electrical systems are assembled and inspected", "Engineering drawings, work instructions, technicians, and quality processes", "No public first-pass yield, defect escape, or warranty-cohort metrics"]
