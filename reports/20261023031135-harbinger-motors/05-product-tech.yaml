callouts:
  - calloutType: strength
    title: Coherent platform logic
    body: Harbinger's chassis, powertrain, battery, and control capabilities are presented as reusable across commercial, specialty, energy, and defense applications.
    claimRefs: [CE005, CE008, CE013, CE015]
  - calloutType: risk
    title: Architecture is ahead of public validation
    body: Serial production and process descriptions do not disclose the field reliability, warranty, cybersecurity, or scaled-yield evidence required to underwrite lifecycle performance.
    claimRefs: [CE004, CE008, CE009, CE016]
