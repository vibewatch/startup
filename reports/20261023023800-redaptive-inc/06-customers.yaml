company:
  name: Redaptive Inc.
chapter:
  number: 6
  title: Customers
  summary: Redaptive sells financed, turnkey energy-infrastructure modernization to large commercial and industrial portfolios, with customer value demonstrated most clearly by the Iron Mountain retrofit and partner-led deployments. Public evidence supports meaningful multi-site adoption, but does not disclose customer-level retention, revenue concentration, or a complete active-account denominator.
sections:
  - id: buyer-segments
    title: Buyer, user, and payer segments
    body: >-
      Redaptive's customer is typically a large commercial or industrial organization with a multi-site estate, while the economic buyer is a facilities, sustainability, finance, or operations executive. The user population is distributed across facility operators, energy managers, finance teams, and ESG-reporting stakeholders. Redaptive's own positioning describes industrial, healthcare, and real-estate customers, and its EaaS model packages capital, execution, monitoring, and performance outcomes rather than selling a single hardware SKU. The Deutsche Bank case study describes demand from the C-suite and says the model has moved from opportunistic sustainability spending toward a strategic board-level conversation. This supports a portfolio and enterprise-sale motion, but public sources do not provide a customer-count denominator by vertical, geography, or channel.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and customer outcomes
    body: >-
      The strongest named-adoption evidence is Redaptive's Iron Mountain program: 428 locations were retrofitted with approximately 310,000 fixtures, with reported gross savings of $95 million over the service term and annual savings of $6.5 million. The program was completed in two years without disrupting fully operational facilities, according to a case study from Redaptive's financing partner Deutsche Bank. Redaptive also reports more than 12,000 completed client projects and $1.2 billion of capital deployed, while its current About Us page reports $1.2 billion-plus of infrastructure modernized and more than one billion square feet under real-time performance tracking. These are company or commercially related partner measures and should not be read as active customers, recurring revenue, or independently verified retention.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and channel leverage
    body: >-
      Named customer proof spans a large enterprise deployment, a strategic technology collaboration, and a UK delivery partnership. Iron Mountain provides the clearest production-scale reference because the source identifies locations, equipment, duration, and savings. Honeywell said it would deploy the Redaptive platform in its own facilities, but the announcement does not quantify sites or outcomes. eEnergy says Redaptive supplies up to £100 million of project financing for UK public and private-sector work and identifies Redaptive-backed projects involving T-Mobile, Saint-Gobain, and Iron Mountain; because this is a partner-issued account, it is evidence of channel positioning rather than independent proof of each customer's current use. The model can expand through financing capacity and local delivery partners, but partner dependence and procurement conversion remain diligence questions.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: retention-and-concentration
    title: Retention, durability, and concentration gaps
    body: >-
      Redaptive's public materials emphasize long-term contracts, measured performance, and portfolio-wide service, but the assigned evidence does not disclose net revenue retention, gross retention, churn, renewal rates, contract loss curves, customer concentration, or the share of revenue from the largest obligors. Deutsche Bank reported that the December 2025 securitization pool comprised 1,445 leases to 46 obligors, which establishes a portfolio denominator but not obligor-level exposure. The company-issued securitization announcement said the pool was pending final ratings and described review of cash-flow predictability, operating performance, installation quality, measured performance, service standards, and portfolio history. A 2025 peer-reviewed ESCO risk paper separately identifies economic, schedule, and quality risks in retrofit projects. Investors should request cohort retention, delinquency, realized-versus-modeled savings, and top-customer exposure before treating project volume as durable recurring adoption.
    claimRefs: [CU014, CU015, CU016]
