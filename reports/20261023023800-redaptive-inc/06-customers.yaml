    columns: [Customer/partner, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Named customer or delivery-partner references found in the ten successful prefetched sources assigned to this chapter as of 2026-10-23."
    rows:
      - [Iron Mountain, Enterprise information management / data centers, "LED retrofit across 428 locations and 310,000 fixtures", production deployment, "$95m gross savings; $6.5m annual savings reported", "Case-study claims are not an independent audit"]
      - [Honeywell, Commercial and industrial buildings, "Strategic collaboration; Honeywell said it would deploy Redaptive platform in its own facilities", deployment intent, "Designed to improve energy monitoring, optimization, and uptime", "No sites, timing, or realized savings disclosed"]
      - [eEnergy, UK public and private sector, "Lead UK delivery partner with Redaptive project-financing access", partner channel, "Up to £100m financing access; partner cites 1,100+ projects delivered", "Partner-issued claims; Redaptive customer conversion unreported"]
      - [T-Mobile, Blue-chip enterprise, "Named by eEnergy as a Redaptive-backed organization", not specified, "No quantified outcome in assigned source", "Logo/reference alone does not prove current production use"]
      - [Saint-Gobain, Blue-chip enterprise, "Named by eEnergy as a Redaptive-backed organization", not specified, "No quantified outcome in assigned source", "Logo/reference alone does not prove current production use"]
    notes: "Enumeration is partial because assigned sources do not provide a complete customer list. Production status is stated only where the source supports it; partner or logo mentions are not upgraded to deployment proof."
    claimRefs: [CU005, CU007, CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey from portfolio need to expansion
    type: journey-map
    summary: Redaptive's customer motion links portfolio diagnosis and financing to deployment, measurement, and potential repeat expansion.
    data:
      nodes:
        - id: need
          label: "Portfolio energy and capital constraint"
          detail: "Large commercial and industrial estates face deferred maintenance, energy-cost pressure, and limited internal CapEx."
        - id: finance
          label: "Funded proposal"
          detail: "Redaptive finances and packages upgrades as a service with fixed or performance-linked payments."
        - id: deploy
          label: "Multi-site deployment"
          detail: "Lighting, HVAC, controls, metering, solar, storage, and EV projects are installed across operating facilities."
        - id: measure
          label: "Meter and report"
          detail: "Redaptive describes asset-level measurement, performance analytics, and ESG reporting."
        - id: prove
          label: "Savings and resilience proof"
          detail: "Iron Mountain is the named example with locations, fixtures, annual savings, and whole-term savings."
        - id: expand
          label: "Portfolio expansion or partner channel"
          detail: "Financing facilities and eEnergy's UK partnership are potential routes to more sites; conversion and retention are not disclosed."
    claimRefs: [CU002, CU005, CU008, CU011, CU014]
callouts:
  - calloutType: strength
    title: Concrete enterprise deployment proof
    body: >-
      Iron Mountain supplies the strongest assigned evidence of production-scale adoption: 428 locations, 310,000 fixtures, and reported savings over a two-year retrofit.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Durability and concentration remain unproven
    body: >-
      Public evidence does not disclose retention, churn, renewal, delinquency, customer concentration, or realized-versus-modeled savings by cohort.
    claimRefs: [CU014, CU015, CU016]
