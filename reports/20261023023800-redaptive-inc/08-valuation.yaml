artifact: valuation
slug: redaptive-inc
runDate: 2026-10-23
company:
  name: Redaptive Inc.
chapter:
  number: 8
  title: Valuation
  summary: Redaptive has assembled a financeable Energy-as-a-Service platform with visible deployment scale, but public evidence does not disclose the revenue, margin, cash-conversion, or current equity-price inputs needed for a confident entry valuation. The appropriate stance is research-more, with financing execution and contract-performance diligence ahead of any priced investment.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that Redaptive combines capital, turnkey execution, metering, and measured
      outcomes in a way that can solve the financing and implementation bottlenecks of large
      commercial and industrial portfolios. Its public site reports 12,000+ projects completed,
      $353M in energy savings, and $1.2B in capital deployed, while its 2025 securitization
      announcement describes long-term contracts backed by measured performance. Those figures
      indicate operating reach and an institutional-finance pathway, but they are company-reported
      and do not provide revenue, EBITDA, free cash flow, loss rates, or equity ownership economics.
      The anti-thesis is therefore price-sensitive: the 2025 asset-backed financing can expand
      deployment without establishing common-equity value, and a financing facility is not the
      same as cash available to equity holders. Public evidence also leaves the latest priced
      equity round and current valuation unresolved.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: recommendation-and-price-discipline
    title: Recommendation and entry discipline
    body: >-
      The evidence supports research-more rather than buy. Redaptive's model is designed around
      multi-year service payments and structured capital, and Deutsche Bank's disclosed $125M
      warehouse facility and later ABS transaction show financing access. However, neither
      transaction supplies an equity valuation, dilution schedule, preference stack, or
      investor return. Public company-controlled metrics are useful for scale triangulation but
      cannot substitute for audited operating statements. A disciplined entry would require a
      current cap table, latest preferred terms, contract-level cash flows, debt and warehouse
      advance rates, and verified cohort economics. Until those are supplied, a range would be
      false precision; the valuation stance is unknown and the investment risk is high.
    claimRefs: [CV005, CV006, CV007, CV008]
  - id: scenarios-and-comparables
    title: Scenarios and comparable signals
    body: >-
      Scenario analysis should be anchored to drivers that can be verified rather than to an
      invented revenue multiple. The bull case assumes repeatable deployment, stable customer
      payments, successful securitization ratings, and financing costs that remain compatible
      with attractive shared-savings economics. The base case assumes continued project growth
      but incomplete disclosure and a higher evidence discount. The bear case assumes delayed
      projects, weaker contract performance, adverse credit outcomes, or capital-market
      compression. Ameresco's reported October 2026 market capitalization of $1.01B is a public
      market reference, not a directly comparable valuation for a private EaaS platform. Utility
      Dive's report on Stem illustrates how project-financing delays, contract valuation
      revisions, and bad debt can damage an adjacent clean-energy model; it is a risk signal, not
      a Redaptive forecast.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-exit
    title: Diligence asks and thesis-break triggers
    body: >-
      The next diligence round should reconcile reported project, savings, and capital figures to
      contracts, invoices, meter data, and cash receipts. It should also test customer
      concentration, renewal and delinquency behavior, construction and warranty obligations,
      warehouse covenants, rating outcomes, and the allocation of financing proceeds between
      project assets and corporate liquidity. Thesis-break triggers are a material deterioration
      in payment performance, an unfavorable rating or advance-rate reset, inability to refinance
      maturities, a down-round or preference structure that removes common-equity upside, or
      evidence that measured savings do not convert into durable customer cash flows. Exit
      readiness cannot be assessed from the assigned public sources because liquidity, ownership,
      and transfer restrictions are not disclosed.
    claimRefs: [CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Research-more
    body: >-
      Proceed only after current equity pricing, cap-table terms, contract cash conversion, and
      financing covenants are verified; the public record supports platform credibility but not a
      defensible price.
    claimRefs: [CV007, CV008, CV013]
  - calloutType: risk
    title: Financing is not equity value
    body: >-
      The disclosed $125M facility and 2025 ABS transaction demonstrate financing capacity, but
      they do not establish cash available to equity holders or a current common-equity valuation.
    claimRefs: [CV005, CV006]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, research-more, "Operating scale and financing access are visible; current equity price is not.", "Do not underwrite a buy without priced-round and cash-flow diligence."]
      - [Confidence, medium, "Several public sources corroborate the financing model, but key equity and profitability inputs are absent.", "Treat the call as conditional."]
      - [Risk rating, high, "Contract performance, financing structure, and disclosure gaps can materially affect returns.", "Require downside protections and covenant review."]
      - [Valuation stance, unknown, "No current public priced-equity valuation is retained in this pool.", "Use a price-discovery process, not a point estimate."]
      - [Exit readiness, unresolved, "Ownership, transfer restrictions, and liquidity are not disclosed.", "Confirm exit mechanics before committing capital."]
    notes: "Public sources mix company-reported operating indicators, financing announcements, and an adjacent public-company market-cap reference; none alone establishes Redaptive common-equity value."
    claimRefs: [CV001, CV005, CV007, CV008, CV013]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting signal, What would change the view, Current implication]
    rows:
      - [Scaled execution, "12,000+ projects and $1.2B capital deployed are reported on Redaptive's site.", "Meter-level and cash-receipt reconciliation.", "Positive but company-claimed."]
      - [Institutional financeability, "Deutsche Bank warehouse financing and a later ABS transaction are disclosed.", "Final ratings, advance rates, losses, and covenant performance.", "Positive for funding access."]
      - [Contracted cash-flow potential, "The ABS announcement describes long-term EaaS contracts and measured performance.", "Cohort payment, renewal, and delinquency data.", "Unproven for equity valuation."]
      - [Equity upside, "No current priced-equity round or cap-table terms are retained.", "A current financing price and preference stack.", "Cannot assess."]
      - [Downside resilience, "Adjacent Stem reporting documents delays, valuation revisions, and bad debt.", "Redaptive-specific loss and delay history.", "Material risk requiring diligence."]
    notes: "The table separates platform evidence from equity-value evidence; adjacent-company risk signals are not forecasts for Redaptive."
    claimRefs: [CV001, CV003, CV005, CV008, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Repeatable project delivery; stable payments; favorable ABS ratings; financing costs remain supportive.", "Higher value from durable contracted cash flows and scalable deployment, but no numeric range until revenue and equity terms are verified.", "Low-to-medium; requires several unverified inputs.", "Payment deterioration or rating shortfall."]
      - [Base, "Deployment continues; public disclosure remains incomplete; financing access persists but at a higher evidence discount.", "Research-more stance; negotiate only with downside protection and verified unit economics.", "Medium; best fit to current evidence.", "No current equity price or cash conversion."]
      - [Bear, "Project delays, weaker measured savings, adverse rating/advance-rate reset, or refinancing stress.", "Material equity impairment or dilution risk; avoid until repaired.", "Medium-to-high; adjacent evidence shows these mechanisms can occur.", "Covenant breach, down-round, or rising losses."]
      - [Monitoring case, "Quarterly cash conversion, customer concentration, contract losses, warehouse covenants, and refinancing are disclosed.", "Move toward priced underwriting only after data quality improves.", "Depends on diligence completion.", "Missing records persist."]
    notes: "These are qualitative, assumption-led scenarios. Numeric valuation ranges are intentionally omitted because current revenue, margin, cash conversion, equity pricing, and preference terms are not disclosed in the assigned sources."
    claimRefs: [CV006, CV008, CV010, CV011, CV013]
