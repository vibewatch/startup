company:
  name: Redaptive Inc.
chapter:
  number: 4
  title: Financials
  summary: Redaptive monetizes financed energy-efficiency infrastructure through long-term Energy-as-a-Service contracts, but public evidence supports capital-market access more strongly than operating profitability or cash-conversion underwriting. The key financial diligence issue is whether measured savings and contract payments remain durable after deployment, servicing, concentration, and financing costs.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Redaptive's public materials describe an Energy-as-a-Service model in which a third party funds,
      installs, owns, and maintains energy equipment while the customer pays a service fee over a
      multi-year contract. The model can cover lighting, HVAC, solar, EV charging, metering, and
      related controls, but list or service-rate information is not disclosed publicly. Independent
      coverage reports that Redaptive charges per kilowatt-hour saved at a rate below the utility
      bill, while the company says its metering and software create the measured results needed to
      support payment streams. This is closer to contracted infrastructure cash flow than pure
      software ARR: revenue quality depends on installed-asset performance, measurement and
      verification, customer credit, contract tenor, and the cost of capital. The public record does
      not provide realized revenue, ARR, gross margin, renewal rates, or customer-level concentration,
      so the underwriting case should not translate deployment or savings figures into revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-and-costs
    title: Capital structure, costs, and operating leverage
    body: >-
      Redaptive has demonstrated access to structured capital: Deutsche Bank provided a $125 million
      committed warehouse facility in 2023, and the company announced a $216 million asset-backed
      securitization in December 2025. The latter pooled long-term contracts, while KBRA's preliminary
      description gives a different but complementary underwriting view: 1,445 leases, 46 obligors,
      approximately $244.5 million of securitization value including a prefunding pool, and a
      weighted-average remaining tenor of 95 months. These are financing and collateral metrics, not
      cash on hand or unrestricted corporate liquidity. The structure can lower project-finance cost
      and recycle capital, but it also introduces advance-rate, performance, obligor, geographic,
      servicing, rating, and refinancing dependencies. Public sources do not disclose corporate
      burn, cash balance, EBITDA, gross margin, defaults, loss reserves, or debt covenants. The
      latest deal was described as awaiting final ratings in the retained material, so investors need
      final ratings and pool-performance data before treating the financing as proof of low risk.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial model is strategically coherent: customers avoid upfront capital, Redaptive
      aggregates projects, and institutional financing can turn measured contract payments into
      repeatable deployment capacity. The model is nevertheless capital intensive and operationally
      exposed. A reported portfolio of 1,500 contract schedules in ESG Dive and KBRA's 1,445-lease
      collateral description illustrate that scale is measured in contracts and equipment, not
      software subscriptions. Coverage also says the 2025 pool excluded assets requiring investment
      tax-credit reliance, which may simplify underwriting but does not establish economics across
      the broader project book. A supplier listing describes typical commitments of 5 to 25 years
      and provider ownership throughout the term, highlighting lock-in and residual-value questions
      rather than independently validating those terms. The company website reports $1.2B+ in
      infrastructure modernized and 1B+ square feet under performance tracking; those are
      company-reported operating indicators, not audited revenue or cash-flow figures. The resulting
      verdict is research-more: financing capability is a strength, while current revenue quality,
      margin path, working-capital needs, loss experience, customer concentration, and next-round
      triggers remain material gaps.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    callouts:
      - calloutType: strength
        title: Institutional financing access
        body: The warehouse facility and subsequent asset-backed securitization show that Redaptive can bring contract portfolios to institutional capital markets, subject to final ratings and performance validation.
        claimRefs: [CI006, CI007, CI008]
      - calloutType: risk
        title: Operating economics remain private
        body: Public evidence does not establish revenue, ARR, gross margin, burn, cash, defaults, or realized customer-level returns, so financing volume cannot substitute for operating underwriting.
        claimRefs: [CI010, CI014]
