      - [Metering and data, Redaptive ONE monitoring and ESG data, "Company describes electricity, gas, and water tracking", "Company-claimed platform capability", "Separate software/data fees from financed-project economics"]
      - ["Solar, EV, and other generation/efficiency", Funded project deployment, "Named in financing announcement; realized mix undisclosed", "Scope disclosed; revenue not disclosed", "Request project gross margin, tax-credit exposure, and maintenance cost"]
    notes: "Sources describe mechanisms and assets, but public sources do not disclose realized revenue, ARR, or revenue recognition by stream; null or undisclosed values are not zero."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing dimension, Evidence, Status, Financial implication]
    rows:
      - [Customer payment basis, "Canary reports a charge per kilowatt-hour saved", "Third-party reported", "Collections depend on verified savings and contract definitions"]
      - [Customer price position, "Canary reports the rate is lower than the utility bill", "Third-party reported; no numeric rate", "Value proposition is directionally described, not margin-tested"]
      - [Contract duration, "Fulfill describes typical 5-25 year commitments; Redaptive describes 5-20 years for EaaS generally", "Directory/official guidance; terms may vary", "Long tenor supports financing but raises renewal, performance, and lock-in diligence"]
      - [Discounts and realized pricing, "No public schedule of list price, discounts, or realized yield", "Unavailable", "Request contract-level price, escalation, and customer-payback data"]
    notes: "List or indicative pricing is not realized revenue or margin. Duration ranges are not a substitute for Redaptive's contract-level terms."
    claimRefs: [CI002, CI003, CI005, CI015]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue / ARR, null, low, "No public operating denominator for valuation or growth underwriting", "Obtain monthly revenue bridge, ARR definition, backlog, and recognized-versus-contracted revenue"]
      - [Gross margin, null, low, "Equipment, EPC, monitoring, maintenance, and financing costs may materially affect contribution", "Obtain cohort and consolidated gross-margin reconciliation"]
      - ["Cash, burn, and runway", null, low, "Warehouse and securitization capacity is not unrestricted corporate liquidity", "Obtain latest cash, burn, liquidity sources, covenants, and runway case"]
      - [Collateral scale, "1,445 leases / 46 obligors / approximately $244.5M securitization value", medium, "Shows financed-asset scale and concentration dimensions, not corporate profitability", "Obtain final rating, advance rate, loss assumptions, delinquency, and obligor concentration"]
    notes: "Null values are unavailable public evidence, not zero. The collateral figures come from KBRA's preliminary rating description and should not be conflated with revenue, funding raised, or cash available."
    claimRefs: [CI008, CI009, CI010, CI014]
