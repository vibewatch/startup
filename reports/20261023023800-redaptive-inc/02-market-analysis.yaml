company:
  name: Redaptive Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Redaptive participates in a defined commercial-building energy-infrastructure
    modernization market where customers exchange upfront capital expenditure and
    execution burden for performance-linked services. Public evidence supports a
    large underlying energy-cost pool and policy-driven demand, but does not support
    a clean Redaptive-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and buying job
    body: >-
      The relevant market is not all climate software or all renewable generation.
      It is the financing, delivery, monitoring, and maintenance of energy-efficiency
      and distributed-energy upgrades across large commercial and industrial
      portfolios. Redaptive's own description combines capital, execution, and
      measurable outcomes, while the independent Equipment Finance Advisor
      interview describes auditing sites, engineering and procurement, installation,
      financing, maintenance, and measurement as one turnkey service. The included
      spend therefore covers lighting, HVAC, controls, boilers, chillers, furnaces,
      solar, metering, and related project soft costs when they are delivered through
      a financed performance contract. Standalone equipment sales, ordinary utility
      supply, pure consulting, and building software without financed deployment are
      excluded. Status-quo substitutes are customer-funded capex, conventional
      lenders or equipment leases, ESCO arrangements, and internal facilities teams.
      This boundary matters because the buyer is purchasing a multi-year outcome and
      execution capacity, not merely a device or a software license.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market drivers
    body: >-
      The strongest sizing lens is the addressable energy-spend and building-stock
      base, not a generic EaaS forecast. EIA reports an estimated 5.9 million U.S.
      commercial buildings consumed 6.8 quadrillion Btu and spent $141 billion on
      energy in 2018; those figures describe the broad physical and spend envelope,
      not Redaptive revenue or a serviceable market. DOE separately states that
      buildings consume 75% of U.S. electricity and 40% of total energy, reinforcing
      the scale of the underlying problem. A narrower policy lens identifies large
      buildings that must report, verify, or reduce emissions: Boston covers
      non-residential buildings of at least 20,000 square feet and requires annual
      reporting, third-party verification, and emissions compliance; New York City
      covers most buildings over 25,000 square feet and applies stricter limits in
      2030. Federal Section 179D incentives further target lighting, HVAC, hot water,
      and envelope projects that achieve specified energy savings. These drivers
      expand the pool of motivated buyers, but geography, building size, technical
      eligibility, financing availability, and project economics constrain SAM.
      Public sources do not disclose Redaptive's eligible-building count, project
      conversion, or obtainable share, so SOM remains unresolved.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-adoption
    title: Buyer segmentation and adoption constraints
    body: >-
      Buyer evidence points to large portfolio owners with heavy power use and
      significant owned real estate, especially industrial, healthcare, and other
      enterprise settings. The economic buyer is typically a facilities, operations,
      sustainability, or finance leader; the user is the facilities and energy team;
      and the payer is the building owner or corporate capital sponsor, with
      repayment tied to energy saved or generated. Adoption is triggered by deferred
      maintenance, decarbonization commitments, compliance deadlines, resilience
      needs, and the desire to preserve capital. The model's central value
      proposition is budget and execution relief: BCSE describes third-party
      financing and execution with charges per utility unit saved or generated, while
      Redaptive's official page emphasizes no-upfront-cost modernization and measured
      outcomes. Constraints remain material. Performance contracts require credible
      baselines and measurement; projects can require long tenures; local rules and
      professional verification add workflow friction; and the provider must scale
      capital alongside deployment. The Equipment Finance Advisor interview expressly
      identifies capitalization and lower cost of capital as continuing priorities.
      These constraints lengthen enterprise sales cycles and make funding capacity,
      customer credit, execution quality, and savings realization central to
      valuation.
    claimRefs: [CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: sizing-gaps
    title: Evidence limits and diligence implications
    body: >-
      The market evidence is decision-useful but not a forecast of Redaptive's
      revenue opportunity. EIA's 2018 national baseline is old relative to the
      2026 run date, DOE's sector statistics describe energy significance rather
      than spend capture, and local laws identify obligated buildings without
      quantifying project budgets. Redaptive's public materials report company
      deployment outcomes, but those are not an independently measured market size.
      The 2025 securitization release also says its contract pool was pending final
      ratings, illustrating that underwriting and performance history remain part of
      the market's institutionalization process. The unresolved diligence path is a
      bottom-up cohort model: count eligible portfolio square footage by geography
      and building type, estimate upgradeable energy spend and contractable savings,
      apply verified project economics and financing constraints, then test conversion,
      retention, and loss performance. Until that evidence is available, the
      defensible conclusion is that the addressable problem is large and policy
      pressure is real, while Redaptive's obtainable market and near-term growth
      rate remain unverified.
    claimRefs: [CM018, CM019]
callouts:
  - calloutType: insight
    title: Large problem, bounded opportunity
    body: >-
      The commercial-building energy pool is substantial, but the investable
      opportunity is limited by eligible building cohorts, project economics,
      performance measurement, local compliance, and financing capacity.
    claimRefs: [CM005, CM007, CM019]
  - calloutType: risk
    title: Capital is part of the product
    body: >-
      Redaptive's own market description makes funding capacity and cost of capital
      strategic constraints; deployment growth without matching warehouse, credit,
      and securitization capacity would not translate directly into durable share.
    claimRefs: [CM014, CM019]
