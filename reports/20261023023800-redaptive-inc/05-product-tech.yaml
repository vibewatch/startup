company:
  name: Redaptive Inc.
chapter:
  number: 5
  title: Product & Technology
  summary: Redaptive combines financed energy-efficiency deployments, metering, analytics, and ongoing service into a portfolio-level Energy-as-a-Service model. Public evidence supports a broad operating stack and recent grid-capacity use case, but current reliability, security, integration, and performance disclosures remain limited.
sections:
  - id: delivered-product
    title: Customer workflow and delivered product
    body: >-
      Redaptive's customer proposition is a managed modernization workflow rather than a
      standalone software license. The company identifies opportunities across a commercial
      or industrial portfolio, arranges capital, installs physical measures, meters usage,
      and reports outcomes over the service period. The historical filing describes turnkey
      deployment, monitoring, maintenance, and analytics under a performance-based contract,
      while the current company surface frames the offer as a unified combination of capital,
      execution, and measurable outcomes. The product therefore spans facility equipment,
      data collection, portfolio analytics, and service operations. This can reduce customer
      implementation burden, but it also makes delivery quality and ongoing support central
      to product value rather than secondary back-office functions.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-differentiation
    title: Operating architecture and differentiation
    body: >-
      The architecture has four linked layers: project origination and financing; installed
      efficiency, generation, storage, or controls assets; meters and a software layer that
      turns utility and equipment data into portfolio insight; and ongoing service,
      maintenance, and outcome validation. The Redaptive One description provides concrete
      evidence of electricity, water, and gas metering, sustainability reporting integrations,
      alerts, and a five-month deployment across 18 locations. The newer Redaptive-Recurve
      solution extends this model into capacity creation, pairing Redaptive project execution
      with an external platform that measures and validates capacity for utilities. The
      differentiation is consequently an integrated capital-and-operations model plus
      accumulated project data, not a disclosed proprietary algorithm or exclusive hardware
      design. Public sources do not establish security controls, uptime commitments for the
      analytics layer, or the technical boundaries of customer integrations.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-risk-controls
    title: Maturity, dependencies, and technical risk
    body: >-
      Maturity is strongest where the evidence is operationally specific: the filing
      describes a technology-enabled platform and installed measures, the Redaptive One
      account reports scaled deployment at 18 sites, and the 2026 partnership describes
      concrete HVAC, battery, energy-management, efficiency, generation, and demand-response
      capabilities. The model remains dependent on third-party installers, equipment,
      utilities, financing counterparties, and customer-site data. The filing warns that
      scaling can strain IT infrastructure and that support obligations and replacement
      timing can affect customer relationships. It also states that the company had limited
      history fulfilling replacement obligations for some measures beyond lighting and HVAC.
      These disclosures make execution, asset performance, data quality, and service response
      the principal diligence risks. No assigned source provides an independent penetration
      test, certification, incident history, contractual uptime statistics, or current
      roadmap, so those should remain explicit diligence gaps rather than inferred strengths.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
callouts:
  - calloutType: strength
    title: Integrated delivery is the product
    body: Redaptive's defensible operating proposition is the combination of capital, deployment, measurement, and managed outcomes across distributed sites, not a narrowly defined software feature.
    claimRefs: [CE001, CE003, CE008]
  - calloutType: risk
    title: Physical execution and data controls remain under-disclosed
    body: The public record identifies scaling, support, replacement, third-party, and data dependencies, but does not disclose current uptime, security assurance, incident history, or independently verified performance.
    claimRefs: [CE010, CE011, CE014]
