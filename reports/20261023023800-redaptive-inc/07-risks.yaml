callouts:
  - calloutType: risk
    title: Financing access is not portfolio proof
    body: The 2025 financing and securitization evidence validates access to institutional capital, but it does not disclose current delinquency, loss, advance-rate, covenant, or realized-savings performance. Treat financing capacity as a mitigation with residual underwriting risk, not as a clean bill of health.
    claimRefs: [CR003, CR004, CR005]
  - calloutType: recommendation
    title: Require asset-level diligence before scaling exposure
    body: The investment case should remain conditional on contract-level cash-flow, concentration, equipment-performance, privacy-control, and facility-document review. A material adverse result in those datasets is a thesis-break trigger.
    claimRefs: [CR015, CR016]
