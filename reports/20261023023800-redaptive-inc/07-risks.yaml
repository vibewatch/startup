company:
  name: Redaptive Inc.
chapter:
  number: 7
  title: Risks
  summary: Redaptive's financing and contract platform has credible institutional backing, but public evidence leaves material exposure around portfolio performance, securitization concentration, regulatory data handling, and execution at scale. The highest-priority diligence is to obtain current loss, delinquency, contract, security, and operational-control evidence rather than infer low risk from financing access.
sections:
  - id: risk-ranking
    title: Risk ranking and investment implications
    body: >-
      Redaptive's principal risk is not a single disclosed incident; it is the interaction between long-duration customer payment contracts, physical infrastructure execution, and capital-markets dependence. Redaptive describes a model in which it funds equipment and is reimbursed through multi-year service fees, while the 2025 securitization evidence shows 1,445 leases, 46 obligors, geographic concentration, and mixed fixed and performance-adjusted payment structures. That combination can create sensitivity to customer credit, measured savings, equipment uptime, and refinancing conditions. Institutional financing is a mitigation for deployment capacity, not proof of cash-flow quality or asset-level resilience. The public record supports a high residual exposure pending portfolio-level delinquency, loss, concentration, and covenant data.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and data-governance exposure
    body: >-
      The retained record does not identify a Redaptive-specific enforcement action, lawsuit, or privacy incident, and that absence should not be treated as evidence that no such event exists. Redaptive's model touches building energy, metering, environmental reporting, customer contracts, and data services across multiple jurisdictions. The California Consumer Privacy Act creates obligations for covered businesses concerning personal information and consumer rights; applicability to Redaptive's datasets, customers, service providers, and contractual roles requires counsel review. The securitization record also shows that ratings analysis considers installation quality, measured performance against forecasts, service standards, and portfolio history, making documentation and controls part of both legal and financing risk.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operating-dependencies
    title: Operating, partner, and financial dependencies
    body: >-
      Redaptive's operating model depends on reliable installation, metering, maintenance, customer payment, financing partners, and the performance of equipment across distributed portfolios. The company says its platform spans HVAC, LED, solar, storage, EV, and metering, which broadens the execution surface and introduces supplier, permitting, interconnection, warranty, and performance-measurement dependencies. The 2025 securitization excluded assets requiring investment-tax-credit reliance, indicating that eligibility and underwriting constraints can shape which projects are financeable. A $650 million credit facility and a $125 million Deutsche Bank warehouse facility improve capital availability, but they also increase dependence on lender appetite, collateral quality, and the ability to replenish or refinance facilities.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: diligence-and-triggers
    title: Mitigations, monitoring indicators, and thesis-break triggers
    body: >-
      Near-term monitoring should focus on evidence that converts the platform story into measurable risk control: delinquency and loss curves by obligor and contract type; realized savings versus forecast; equipment failure and service-level data; customer and geographic concentration; privacy-control testing; and facility covenants, advance rates, ratings, and refinancing dates. A thesis-break event would be a material deterioration in payment performance, a failed or downgraded securitization, inability to fund committed deployments, repeated underperformance against contracted savings, a material data or safety incident, or a regulatory action that restricts operations. The existing public evidence supports these as diligence triggers, not as asserted events.
    claimRefs: [CR015, CR016]
