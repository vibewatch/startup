company:
  name: Redaptive Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Redaptive is a Denver-based Energy-as-a-Service company founded in 2015 that combines
    project financing, implementation, and metering for enterprise energy infrastructure.
    Its disclosed capital stack is substantial but mixes equity, warehouse credit, a credit
    facility, and securitization proceeds, while current valuation, revenue, governance, and
    exact operating-scale metrics remain publicly unresolved.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Redaptive was founded in 2015 and is headquartered in Denver, Colorado. Its model is
      not a conventional equipment sale: the company says it finances and coordinates
      portfolio-scale upgrades such as HVAC, lighting, solar, storage, EV charging, and
      metering, then recovers its investment through long-term service payments. The
      combination of capital, project execution, and performance data is the central
      differentiation asserted by both Redaptive and independent coverage. The proposition
      addresses customers' upfront-capital and implementation constraints, but it also
      makes access to competitively priced financing and reliable contract performance
      central to the company's ability to scale. Public scale indicators are meaningful but
      uneven: Redaptive reports more than $1.2 billion of infrastructure modernized and more
      than one billion square feet tracked, while current revenue and exact customer and
      employee counts are not disclosed in the retained evidence.
    claimRefs: [CO001, CO002, CO013, CO014, CO015, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      The public leadership picture is founder-led but incomplete. FundedIQ lists Arvin
      Vohra and Ryan Martineau as founders, while Commercial Observer identifies Vohra as
      co-founder and chief executive and describes his prior energy-structured-finance work
      at Lehman Brothers and Barclays. That background is directly relevant to a business
      whose operating model depends on structuring project capital and contract cash flows.
      Public releases also show Matt Gembrin described as chief financial officer in 2023
      and May 2025, then as chief investment officer in December 2025, suggesting a material
      role transition. The assigned evidence does not provide a current full executive
      roster, board composition, voting rights, or succession plan, so key-person and
      governance risk cannot be resolved from public materials alone.
    claimRefs: [CO003, CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital stack and stakeholder map
    body: >-
      Redaptive's financing history must be separated by instrument. A May 2023 company
      release put the Series E total at approximately $250 million; independent reporting
      later described a further $100 million CPP Investments equity investment in October
      2024. Separately, Redaptive announced a $125 million Deutsche Bank warehouse facility
      in 2023, a $650 million CDPQ and Nuveen credit facility in May 2025, and an
      approximately $216 million inaugural asset-backed securitization in December 2025.
      Those debt and structured-finance amounts expand deployment capacity but are not
      interchangeable with equity raised, cash on hand, or enterprise value. FundedIQ's
      $1.1 billion aggregate combines four disclosed rounds that include the credit facility
      and securitization; it is useful as a capital-formation summary, not as a valuation or
      liquidity measure.
    claimRefs: [CO006, CO007, CO008, CO009, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-diligence-posture
    title: Milestones and diligence posture
    body: >-
      The milestone sequence shows a company moving from growth equity toward repeatable
      structured funding for long-lived Energy-as-a-Service contracts. The 2025 IUC
      partnership also illustrates how Redaptive can use its financing platform to support
      third-party deployments, with several hundred contracted chargers initially cited.
      The December 2025 securitization is strategically important because it packages
      service-payment streams for institutional investors. Redaptive's own announcement said
      final KBRA ratings were still pending; a September 2026 CEO interview later said an
      investment-grade rating had been achieved, but the assigned pool does not contain the
      rating report. The strongest public evidence therefore establishes financing access
      and deployment breadth, not profitability or verified credit performance. A current
      investment assessment still requires revenue, margin, cash conversion, customer
      concentration, contract-loss performance, final ABS documentation, current valuation,
      and board-level governance documents.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    figureRefs: [FO001]
