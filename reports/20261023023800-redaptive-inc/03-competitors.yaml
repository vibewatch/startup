      - ["Technology-agnostic multi-measure deployment", "Supported: HVAC, solar, LED, EV, metering, and other solutions named", "Supported: solar, HVAC, LED, and smart controls", "Supported: efficiency and renewable portfolio", "Supported: HVAC, lighting, controls, generation, and water examples", "Unknown across named technologies", "Coverage is directionally comparable but not normalized by project count"]
