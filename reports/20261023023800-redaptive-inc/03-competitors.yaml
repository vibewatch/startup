    claimRefs: [CP005, CP006, CP007, CP010, CP011, CP014, CP015, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider or alternative, Price or contract model, Included capabilities, Discount or realization evidence, Competitive implication]
    rows:
      - [Redaptive, "Monthly service fee tied to shared savings; EaaS contracts typically 5-20 years", "Financing, ownership or management, deployment, monitoring, and measured outcomes", "No realized price, savings split, or customer-level margin disclosed", "Reduces upfront CapEx but creates long-duration performance and counterparty diligence"]
      - [Budderfly, "EaaS with provider-funded upgrades; contract price unknown", "Solar, HVAC, LED, smart controls, monitoring, and asset management", "No comparable list or realized price in assigned source", "Provider-funded deployment is a direct alternative, though target segment differs"]
      - [Ameresco, "ESPC, PPA, and off-balance-sheet EaaS; price unknown", "Efficiency, infrastructure upgrades, asset sustainability, and renewable energy", "No comparable list or realized price in assigned source", "Multiple contract forms and procurement access increase incumbent flexibility"]
      - [NORESCO, "ESPC funded through a share of verified savings; price unknown", "Analysis, engineering, design, M&V, construction management, and O&M", "No current comparable price in assigned qualification sheet", "Federal specialization and lifecycle delivery are strong incumbent substitutes"]
      - [ENFRA, "EaaS plus integrated services; price unknown", "Engineering, mechanical and electrical construction, service, maintenance, asset management", "No price, savings share, or contract term disclosed", "Vertical integration may reduce coordination costs; financial terms need diligence"]
      - [Internal build or conventional procurement, "Customer-funded capex or separately negotiated financing and contractor invoices", "Customer-selected equipment, contractor, and maintenance scope", "No single benchmark available", "Potentially cheaper for sophisticated owners but leaves execution and performance burden in-house"]
    notes: "Official EaaS descriptions provide model and term information, not realized customer pricing; a blank or unknown price is not evidence of a free or lower-cost offer."
    claimRefs: [CP002, CP005, CP007, CP009, CP014, CP015]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Redaptive is positioned on disclosed financing integration and portfolio delivery breadth; coordinates are ordinal analytical scores, not market-share measurements.
    data:
      xAxis: "Financing integration (ordinal, source-backed)"
      yAxis: "Portfolio delivery breadth (ordinal, source-backed)"
      points:
        - {label: Redaptive, x: 4, y: 4, note: "Capital, deployment, monitoring, and measured outcomes are described in official materials."}
        - {label: Budderfly, x: 4, y: 3, note: "Provider-funded upgrades and managed assets are described for a narrower commercial mid-market segment."}
        - {label: Ameresco, x: 3, y: 5, note: "Multiple financing structures and broad procurement and delivery coverage are described."}
        - {label: NORESCO, x: 3, y: 4, note: "ESPC financing and a vertically integrated government-project lifecycle are described."}
        - {label: ENFRA, x: 2, y: 5, note: "Vertically integrated delivery and EaaS are described, but financing detail is limited."}
        - {label: Internal build, x: 1, y: 3, note: "Customer retains control and can assemble a broad program, but external financing integration is not evidenced."}
    approximationNotes: "Coordinates are ordinal analyst scores from 1 to 5 based only on disclosed financing integration and delivery breadth; they are not market-share, price, or outcome measurements."
    claimRefs: [CP013]
