      - number: '4.2'
        title: Capital structure, costs, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Redaptive has demonstrated access to structured capital: Deutsche Bank provided a $125 million committed
              warehouse facility in 2023, and the company announced a $216 million asset-backed securitization in
              December 2025. The latter pooled long-term contracts, while KBRA's preliminary description gives a
              different but complementary underwriting view: 1,445 leases, 46 obligors, approximately $244.5 million of
              securitization value including a prefunding pool, and a weighted-average remaining tenor of 95 months.
              These are financing and collateral metrics, not cash on hand or unrestricted corporate liquidity. The
              structure can lower project-finance cost and recycle capital, but it also introduces advance-rate,
              performance, obligor, geographic, servicing, rating, and refinancing dependencies. Public sources do not
              disclose corporate burn, cash balance, EBITDA, gross margin, defaults, loss reserves, or debt covenants.
              The latest deal was described as awaiting final ratings in the retained material, so investors need final
              ratings and pool-performance data before treating the financing as proof of low risk.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.3'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial model is strategically coherent: customers avoid upfront capital, Redaptive aggregates
              projects, and institutional financing can turn measured contract payments into repeatable deployment
              capacity. The model is nevertheless capital intensive and operationally exposed. A reported portfolio of
              1,500 contract schedules in ESG Dive and KBRA's 1,445-lease collateral description illustrate that scale
              is measured in contracts and equipment, not software subscriptions. Coverage also says the 2025 pool
              excluded assets requiring investment tax-credit reliance, which may simplify underwriting but does not
              establish economics across the broader project book. A supplier listing describes typical commitments of 5
              to 25 years and provider ownership throughout the term, highlighting lock-in and residual-value questions
              rather than independently validating those terms. The company website reports $1.2B+ in infrastructure
              modernized and 1B+ square feet under performance tracking; those are company-reported operating
              indicators, not audited revenue or cash-flow figures. The resulting verdict is research-more: financing
              capability is a strength, while current revenue quality, margin path, working-capital needs, loss
              experience, customer concentration, and next-round triggers remain material gaps.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and delivered product
        blocks:
          - type: paragraph
            body: >-
              Redaptive's customer proposition is a managed modernization workflow rather than a standalone software
              license. The company identifies opportunities across a commercial or industrial portfolio, arranges
              capital, installs physical measures, meters usage, and reports outcomes over the service period. The
              historical filing describes turnkey deployment, monitoring, maintenance, and analytics under a
              performance-based contract, while the current company surface frames the offer as a unified combination of
              capital, execution, and measurable outcomes. The product therefore spans facility equipment, data
              collection, portfolio analytics, and service operations. This can reduce customer implementation burden,
              but it also makes delivery quality and ongoing support central to product value rather than secondary
              back-office functions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
