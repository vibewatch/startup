      - number: '5.2'
        title: Operating architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The architecture has four linked layers: project origination and financing; installed efficiency,
              generation, storage, or controls assets; meters and a software layer that turns utility and equipment data
              into portfolio insight; and ongoing service, maintenance, and outcome validation. The Redaptive One
              description provides concrete evidence of electricity, water, and gas metering, sustainability reporting
              integrations, alerts, and a five-month deployment across 18 locations. The newer Redaptive-Recurve
              solution extends this model into capacity creation, pairing Redaptive project execution with an external
              platform that measures and validates capacity for utilities. The differentiation is consequently an
              integrated capital-and-operations model plus accumulated project data, not a disclosed proprietary
              algorithm or exclusive hardware design. Public sources do not establish security controls, uptime
              commitments for the analytics layer, or the technical boundaries of customer integrations.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
