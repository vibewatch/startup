        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Redaptive's customer is typically a large commercial or industrial organization with a multi-site estate,
              while the economic buyer is a facilities, sustainability, finance, or operations executive. The user
              population is distributed across facility operators, energy managers, finance teams, and ESG-reporting
              stakeholders. Redaptive's own positioning describes industrial, healthcare, and real-estate customers, and
              its EaaS model packages capital, execution, monitoring, and performance outcomes rather than selling a
              single hardware SKU. The Deutsche Bank case study describes demand from the C-suite and says the model has
              moved from opportunistic sustainability spending toward a strategic board-level conversation. This
              supports a portfolio and enterprise-sale motion, but public sources do not provide a customer-count
              denominator by vertical, geography, or channel.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU011
      - number: '6.2'
        title: Adoption trajectory and customer outcomes
        blocks:
          - type: paragraph
            body: >-
              The strongest named-adoption evidence is Redaptive's Iron Mountain program: 428 locations were retrofitted
              with approximately 310,000 fixtures, with reported gross savings of $95 million over the service term and
              annual savings of $6.5 million. The program was completed in two years without disrupting fully
              operational facilities, according to a case study from Redaptive's financing partner Deutsche Bank.
              Redaptive also reports more than 12,000 completed client projects and $1.2 billion of capital deployed,
              while its current About Us page reports $1.2 billion-plus of infrastructure modernized and more than one
              billion square feet under real-time performance tracking. These are company or commercially related
              partner measures and should not be read as active customers, recurring revenue, or independently verified
              retention.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU008
              - CU011
              - CU014
      - number: '6.3'
        title: Named proof, expansion, and channel leverage
        blocks:
          - type: paragraph
            body: >-
              Named customer proof spans a large enterprise deployment, a strategic technology collaboration, and a UK
              delivery partnership. Iron Mountain provides the clearest production-scale reference because the source
              identifies locations, equipment, duration, and savings. Honeywell said it would deploy the Redaptive
              platform in its own facilities, but the announcement does not quantify sites or outcomes. eEnergy says
              Redaptive supplies up to £100 million of project financing for UK public and private-sector work and
              identifies Redaptive-backed projects involving T-Mobile, Saint-Gobain, and Iron Mountain; because this is
              a partner-issued account, it is evidence of channel positioning rather than independent proof of each
              customer's current use. The model can expand through financing capacity and local delivery partners, but
              partner dependence and procurement conversion remain diligence questions.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU007
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Retention, durability, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Redaptive's public materials emphasize long-term contracts, measured performance, and portfolio-wide
              service, but the assigned evidence does not disclose net revenue retention, gross retention, churn,
              renewal rates, contract loss curves, customer concentration, or the share of revenue from the largest
              obligors. Deutsche Bank reported that the December 2025 securitization pool comprised 1,445 leases to 46
              obligors, which establishes a portfolio denominator but not obligor-level exposure. The company-issued
              securitization announcement said the pool was pending final ratings and described review of cash-flow
              predictability, operating performance, installation quality, measured performance, service standards, and
              portfolio history. A 2025 peer-reviewed ESCO risk paper separately identifies economic, schedule, and
              quality risks in retrofit projects. Investors should request cohort retention, delinquency,
              realized-versus-modeled savings, and top-customer exposure before treating project volume as durable
              recurring adoption.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concrete enterprise deployment proof
            body: >-
              Iron Mountain supplies the strongest assigned evidence of production-scale adoption: 428 locations,
              310,000 fixtures, and reported savings over a two-year retrofit.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Durability and concentration remain unproven
            body: >-
              Public evidence does not disclose retention, churn, renewal, delinquency, customer concentration, or
              realized-versus-modeled savings by cohort.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implications
        blocks:
          - type: paragraph
            body: >-
              Redaptive's principal risk is not a single disclosed incident; it is the interaction between long-duration
              customer payment contracts, physical infrastructure execution, and capital-markets dependence. Redaptive
              describes a model in which it funds equipment and is reimbursed through multi-year service fees, while the
              2025 securitization evidence shows 1,445 leases, 46 obligors, geographic concentration, and mixed fixed
              and performance-adjusted payment structures. That combination can create sensitivity to customer credit,
              measured savings, equipment uptime, and refinancing conditions. Institutional financing is a mitigation
              for deployment capacity, not proof of cash-flow quality or asset-level resilience. The public record
              supports a high residual exposure pending portfolio-level delinquency, loss, concentration, and covenant
              data.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR010
      - number: '7.2'
        title: Regulatory, legal, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The retained record does not identify a Redaptive-specific enforcement action, lawsuit, or privacy
              incident, and that absence should not be treated as evidence that no such event exists. Redaptive's model
              touches building energy, metering, environmental reporting, customer contracts, and data services across
              multiple jurisdictions. The California Consumer Privacy Act creates obligations for covered businesses
              concerning personal information and consumer rights; applicability to Redaptive's datasets, customers,
              service providers, and contractual roles requires counsel review. The securitization record also shows
              that ratings analysis considers installation quality, measured performance against forecasts, service
              standards, and portfolio history, making documentation and controls part of both legal and financing risk.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operating, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Redaptive's operating model depends on reliable installation, metering, maintenance, customer payment,
              financing partners, and the performance of equipment across distributed portfolios. The company says its
              platform spans HVAC, LED, solar, storage, EV, and metering, which broadens the execution surface and
              introduces supplier, permitting, interconnection, warranty, and performance-measurement dependencies. The
              2025 securitization excluded assets requiring investment-tax-credit reliance, indicating that eligibility
              and underwriting constraints can shape which projects are financeable. A $650 million credit facility and
              a $125 million Deutsche Bank warehouse facility improve capital availability, but they also increase
              dependence on lender appetite, collateral quality, and the ability to replenish or refinance facilities.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Near-term monitoring should focus on evidence that converts the platform story into measurable risk
              control: delinquency and loss curves by obligor and contract type; realized savings versus forecast;
              equipment failure and service-level data; customer and geographic concentration; privacy-control testing;
              and facility covenants, advance rates, ratings, and refinancing dates. A thesis-break event would be a
              material deterioration in payment performance, a failed or downgraded securitization, inability to fund
              committed deployments, repeated underperformance against contracted savings, a material data or safety
              incident, or a regulatory action that restricts operations. The existing public evidence supports these as
              diligence triggers, not as asserted events.
            claimRefs:
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing access is not portfolio proof
            body: >-
              The 2025 financing and securitization evidence validates access to institutional capital, but it does not
              disclose current delinquency, loss, advance-rate, covenant, or realized-savings performance. Treat
              financing capacity as a mitigation with residual underwriting risk, not as a clean bill of health.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Require asset-level diligence before scaling exposure
            body: >-
              The investment case should remain conditional on contract-level cash-flow, concentration,
              equipment-performance, privacy-control, and facility-document review. A material adverse result in those
              datasets is a thesis-break trigger.
            calloutType: recommendation
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Redaptive combines capital, turnkey execution, metering, and measured outcomes in a way
              that can solve the financing and implementation bottlenecks of large commercial and industrial portfolios.
              Its public site reports 12,000+ projects completed, $353M in energy savings, and $1.2B in capital
              deployed, while its 2025 securitization announcement describes long-term contracts backed by measured
              performance. Those figures indicate operating reach and an institutional-finance pathway, but they are
              company-reported and do not provide revenue, EBITDA, free cash flow, loss rates, or equity ownership
              economics. The anti-thesis is therefore price-sensitive: the 2025 asset-backed financing can expand
              deployment without establishing common-equity value, and a financing facility is not the same as cash
              available to equity holders. Public evidence also leaves the latest priced equity round and current
              valuation unresolved.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV011
      - number: '8.2'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy. Redaptive's model is designed around multi-year
              service payments and structured capital, and Deutsche Bank's disclosed $125M warehouse facility and later
              ABS transaction show financing access. However, neither transaction supplies an equity valuation, dilution
              schedule, preference stack, or investor return. Public company-controlled metrics are useful for scale
              triangulation but cannot substitute for audited operating statements. A disciplined entry would require a
              current cap table, latest preferred terms, contract-level cash flows, debt and warehouse advance rates,
              and verified cohort economics. Until those are supplied, a range would be false precision; the valuation
              stance is unknown and the investment risk is high.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios and comparable signals
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be anchored to drivers that can be verified rather than to an invented revenue
              multiple. The bull case assumes repeatable deployment, stable customer payments, successful securitization
              ratings, and financing costs that remain compatible with attractive shared-savings economics. The base
              case assumes continued project growth but incomplete disclosure and a higher evidence discount. The bear
              case assumes delayed projects, weaker contract performance, adverse credit outcomes, or capital-market
              compression. Ameresco's reported October 2026 market capitalization of $1.01B is a public market
              reference, not a directly comparable valuation for a private EaaS platform. Utility Dive's report on Stem
              illustrates how project-financing delays, contract valuation revisions, and bad debt can damage an
              adjacent clean-energy model; it is a risk signal, not a Redaptive forecast.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence round should reconcile reported project, savings, and capital figures to contracts,
              invoices, meter data, and cash receipts. It should also test customer concentration, renewal and
              delinquency behavior, construction and warranty obligations, warehouse covenants, rating outcomes, and the
              allocation of financing proceeds between project assets and corporate liquidity. Thesis-break triggers are
              a material deterioration in payment performance, an unfavorable rating or advance-rate reset, inability to
              refinance maturities, a down-round or preference structure that removes common-equity upside, or evidence
              that measured savings do not convert into durable customer cash flows. Exit readiness cannot be assessed
              from the assigned public sources because liquidity, ownership, and transfer restrictions are not
              disclosed.
            claimRefs:
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              Proceed only after current equity pricing, cap-table terms, contract cash conversion, and financing
              covenants are verified; the public record supports platform credibility but not a defensible price.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV013
          - type: callout
            title: Financing is not equity value
            body: >-
              The disclosed $125M facility and 2025 ABS transaction demonstrate financing capacity, but they do not
              establish cash available to equity holders or a current common-equity valuation.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
