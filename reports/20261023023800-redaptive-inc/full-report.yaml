chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Redaptive was founded in 2015 and is headquartered in Denver, Colorado. Its model is not a conventional
              equipment sale: the company says it finances and coordinates portfolio-scale upgrades such as HVAC,
              lighting, solar, storage, EV charging, and metering, then recovers its investment through long-term
              service payments. The combination of capital, project execution, and performance data is the central
              differentiation asserted by both Redaptive and independent coverage. The proposition addresses customers'
              upfront-capital and implementation constraints, but it also makes access to competitively priced financing
              and reliable contract performance central to the company's ability to scale. Public scale indicators are
              meaningful but uneven: Redaptive reports more than $1.2 billion of infrastructure modernized and more than
              one billion square feet tracked, while current revenue and exact customer and employee counts are not
              disclosed in the retained evidence.
            claimRefs:
              - CO001
              - CO002
              - CO013
              - CO014
              - CO015
              - CO016
