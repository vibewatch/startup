      - number: '5.3'
        title: Maturity, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Maturity is strongest where the evidence is operationally specific: the filing describes a
              technology-enabled platform and installed measures, the Redaptive One account reports scaled deployment at
              18 sites, and the 2026 partnership describes concrete HVAC, battery, energy-management, efficiency,
              generation, and demand-response capabilities. The model remains dependent on third-party installers,
              equipment, utilities, financing counterparties, and customer-site data. The filing warns that scaling can
              strain IT infrastructure and that support obligations and replacement timing can affect customer
              relationships. It also states that the company had limited history fulfilling replacement obligations for
              some measures beyond lighting and HVAC. These disclosures make execution, asset performance, data quality,
              and service response the principal diligence risks. No assigned source provides an independent penetration
              test, certification, incident history, contractual uptime statistics, or current roadmap, so those should
              remain explicit diligence gaps rather than inferred strengths.
            claimRefs:
