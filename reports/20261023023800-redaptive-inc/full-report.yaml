      deployment partnership, and an inaugural securitization.
    data:
      items:
        - date: '2015'
          label: Founded in Denver
          details: Redaptive was founded as an Energy-as-a-Service provider.
          tone: neutral
          claimRefs:
            - CO001
        - date: 2022-12
          label: $200M Series E investment
          details: FundedIQ records the first disclosed Series E tranche in December 2022.
          tone: positive
          claimRefs:
            - CO006
        - date: '2023-05-03'
          label: Series E reaches about $250M
          details: A Linse Capital follow-on brought the company-reported round total to approximately $250 million.
          tone: positive
          claimRefs:
            - CO006
        - date: '2023-08-24'
          label: $125M Deutsche Bank warehouse
          details: The committed facility was intended to finance and securitize customer-contract deployments.
          tone: positive
          claimRefs:
            - CO008
