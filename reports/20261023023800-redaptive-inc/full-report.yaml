              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP009
              - CP014
              - CP015
      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Redaptive's potential moat is operational and financial rather than a proprietary device: portfolio data,
              measured savings, multi-site implementation capability, contracted payment streams, and access to
              institutional capital may compound as deployments grow. The 2025 CDPQ and Nuveen announcement says the
              facility is intended to expand the platform, while the securitization release says the first issuance
              required work with investors and advisers to educate the market on EaaS contracts, portfolio data, and
              credit enhancement. That learning curve could lower future financing friction, but it also shows that
              ratings, obligor risk, contract mechanics, installation quality, and measured performance are material
              gating factors. Budderfly's disclosed financing and revenue run rate, plus incumbent delivery breadth,
              show that capital and integration are not exclusive to Redaptive. Customers can also multi-home across
              technologies and contractors. The main diligence gap is whether Redaptive converts financing access into
              lower delivered cost and better measured outcomes than an incumbent ESCO or an internal capital program.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Redaptive's public materials describe an Energy-as-a-Service model in which a third party funds, installs,
              owns, and maintains energy equipment while the customer pays a service fee over a multi-year contract. The
              model can cover lighting, HVAC, solar, EV charging, metering, and related controls, but list or
              service-rate information is not disclosed publicly. Independent coverage reports that Redaptive charges
              per kilowatt-hour saved at a rate below the utility bill, while the company says its metering and software
              create the measured results needed to support payment streams. This is closer to contracted infrastructure
              cash flow than pure software ARR: revenue quality depends on installed-asset performance, measurement and
              verification, customer credit, contract tenor, and the cost of capital. The public record does not provide
              realized revenue, ARR, gross margin, renewal rates, or customer-level concentration, so the underwriting
              case should not translate deployment or savings figures into revenue.
            claimRefs:
              - CI001
