        title: Milestones and diligence posture
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a company moving from growth equity toward repeatable structured funding for
              long-lived Energy-as-a-Service contracts. The 2025 IUC partnership also illustrates how Redaptive can use
