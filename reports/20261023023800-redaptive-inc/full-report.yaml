              - CP010
              - CP011
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, financing, and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              The most defensible competitive distinction is the combination of balance-sheet financing and turnkey
              deployment across distributed commercial and industrial portfolios. Redaptive's 2023 Deutsche Bank
              announcement names metering, HVAC, solar, LED, EV, and other efficiency solutions, and says Redaptive ONE
              tracks water, gas, and energy for ESG reporting. Its 2025 securitization announcement describes long-term
              contracts for lighting, HVAC, and controls and says the pool was still pending final ratings, exposing a
              financing and underwriting dependency. Budderfly's independent coverage describes an EaaS model that funds
              equipment, manages assets, and guarantees energy savings, while ENFRA describes vertically integrated
              engineering, construction, service, maintenance, asset management, and EaaS. Ameresco's procurement
              listing adds ESPCs, PPAs, and off-balance-sheet EaaS, while the DOE-hosted NORESCO qualification sheet
              describes an in-house federal ESPC lifecycle from analysis through operations and maintenance. These are
              credible substitutes with deeper delivery histories or broader contracting menus. Public sources do not
              provide comparable realized prices, customer-level margins, renewal rates, or head-to-head win rates, so
              the matrix preserves unknowns rather than scoring them as advantages.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
