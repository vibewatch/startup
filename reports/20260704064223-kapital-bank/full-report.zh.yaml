      - number: '6.3'
        title: 墨西哥和哥伦比亚都有具名客户证明，但多数证据由公司策划，而不是独立量化
        blocks:
          - type: paragraph
            body: >-
              Kapital 过了基本具名客户证明门槛。公司的案例研究入口明确展示墨西哥的 Day Store、Commando 和 Makora，Kapital Colombia 则发布 Todos Comemos 和
              Yoyoso 的引述。关键是，证明质量并不均匀。Commando 是最强的墨西哥参考客户，因为专门案例页包含具体运营细节——超过 16 家工作室、超过 600 名员工和教练、西班牙扩张，以及 CEO 直接称
              Kapital 在需要时响应迅速。Day Store 和 Makora 较弱但仍有用，因为成功故事分类页把它们与 Kapital 绑定，它们自己的官网也证明它们是真实运营企业，而不是 logo
              墙布景。DayStore 网站称拥有 100 多个仓库、1,200 多名客户和 24/7 运营；Makora 网站称服务超过 78,000 户家庭。


              Kapital Colombia 提供了更新、更明确的证言证明。其首页点名 Todos Comemos 和 Yoyoso，给二者的 CEO 引述归因，并将 Kapital
              描述为战略盟友，而非商品化银行供应商。客户自有网站佐证二者都是真实运营企业，且有可识别的商业足迹。这足以支持生产成熟度判断：Kapital 正在服务物流、家具 /
              DTC、健身、食品分销和消费零售里的真实企业。但证据仍未达到机构级客户尽调。公开记录没有披露合同规模、按客户划分的产品组合、实施周期、续约历史，也没有存款增长、贷款使用率或软件席位扩张等可衡量结果。因此，具名客户证明存在，但多数由公司策划，结果指标偏薄。
