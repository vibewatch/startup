        - 公开来源未披露自动决策率、模型变量或损失监控
      - - 集团整合和资金层
        - 把银行、券商、存款业务和已收购运营平台连成一个金融集团栈
        - Moody's 新闻稿和公开报告、HR Ratings 信号
