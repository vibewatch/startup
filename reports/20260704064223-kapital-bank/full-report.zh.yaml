        - 提供付费客户、平均实际价格、流失率和软件毛利率。
      - - 银行实体利息收入
        - 1Q26 为 MXN 1,239m
        - 中
        - 说明资产负债表经济性已经相当重要。
        - 按产品、行业和信贷类型拆分利息收入。
      - - 银行实体拨备费用
        - 1Q26 为 MXN 144m
        - 中
        - 真实信用损失线已经可见，因此损失曲线是承销的核心。
        - 按 Crédito PyME、FLEX、保理和卡业务提供准备金方法，以及发放批次滚动率数据。
      - - 资本 / 流动性缓冲
        - 资本充足率 13.52%；LCR 407；现金及等价物 MXN 22,233m
        - 高
        - 说明受监管银行当下没有明显流动性约束。
        - 提供控股公司现金、受限现金分析，以及任何内部上缴限制。
      - - 客户 / 规模代理指标
        - 2025 年 9 月报道称约 300,000 名客户和 $3bn 资产负债表规模
