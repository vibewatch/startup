      - - Konfío
        - 固定利率信贷定位；抓取页面没有公开卡或资金管理费率表
        - 邀约驱动的贷款，正扩展更广业务栈
        - 信贷、银行卡、终端、未来存款 / 资金管理目标
        - 抓取摘录中没有公开精确实际利率
        - 适合顾问式销售，但不利于即时价格比较
      - - Clip
        - 硬件套装 MXN2,598 起；无月租；高交易量佣金有竞争力
        - 硬件驱动商户采用，加上基于邀约的贷款定价
        - 终端、受监管账户、链接、商户贷款
        - 抓取页面未发布完整 MDR 费率表
        - 对微型中小商户入驻非常有吸引力
      - - Conekta
        - 银行卡 3.4% + MXN3 起；现金 2.6% + MXN3；SPEI MXN12.50 起；均另加 IVA
        - 按成功交易付费的平台定价
        - API、线上收银、插件、链接、银行卡、现金、转账
        - 企业费率按交易量谈判
        - 数字商户比较 PSP 经济性时，透明度高
      - - BBVA TPV
        - MXN300 入网费；额外终端月费 MXN150；便携式借记卡费率 2.15%；低交易量罚金
        - 传统银行收单加关系银行服务
        - 账户、TPV、网点服务、数字信贷邀约
        - 摘录中信用卡 MDR 细节和协商费率未完全可见
        - 传统银行可以直接在商户收单经济性上竞争
      - - Santander PyME
        - PFAEs 套餐 MXN0 起；抓取页面看不到更深层终端定价
        - 账户 + 终端 + 应用打包
        - 账户、终端、链接、目录 / 库存、网点 / 数字银行
        - 抓取摘录中未公开详述 MDR、硬件和协商套餐
        - 即便没有完整公开费率披露，主打套餐也有吸引力
      - - Mercury
        - US$0 基础版；US$29.90 Plus；US$299 Pro
        - 在免费银行服务上叠加软件变现
        - 支票 / 储蓄账户、电汇、开票、银行卡、审批、会计自动化
        - 资金管理功能要求余额门槛；经济模型仅限美国
        - 说明财务软件打包可以长成什么样
      - - Brex
        - 资金管理收益率最高 3.68%；定价页绑定账户 / 资金管理套餐，而不是简单 MDR 表
        - 银行 + 资金管理 + 支出管理套餐
        - 商业账户、资金管理、应付账款（AP）、开票、银行卡、控制
        - 墨西哥只可作标杆参考
        - 说明资金管理和应付账款（AP）可以成为变现层，而不只是银行卡交换费
    notes: 该表比较公开列表价格或主打包装，不是实际谈判后的经济性。实际利率缺失是重要尽调缺口，因为真实折扣很可能决定竞争交易中的胜率。
