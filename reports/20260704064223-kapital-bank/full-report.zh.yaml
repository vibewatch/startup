  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 单位 / 定价基础
      - 当前公开值 / 状态
      - 收入质量
      - 尽调追问
    rows:
      - - 企业存款账户
        - 浮存收益、余额相关费用、支付活动和附属银行服务。
        - Cuenta Empresarial：无年费；Cuenta PyME：开户金额 MXN 5,000，若低于平均余额门槛，罚金 MXN 170 + IVA。
        - 可见且已上线，但实际账户收益率未披露。
        - 中——黏性轨道存在，但公开披露没有展示单账户净收入。
        - 提供按队列划分的账户级 ARPA、平均余额、费用豁免和交易变现。
      - - Banca Kapital 软件
        - 面向分析、支付自动化、预测和运营工作流的月度订阅。
        - MXN 1,199/月 + IVA。
        - 明确列表价已公开。
        - 中——列表价最清楚，但未披露采用率、毛利率或流失率。
        - 提供付费席位数、账户附着率、毛利率，以及按队列划分的流失 / 留存。
      - - Crédito PyME（SME 信贷）
        - 利息收入加开户费、保险附着和潜在罚费。
        - 公开示例：3% 开户费；MXN 200,000、最高 36 个月的 CAT 为 58.3%。
        - 已上线且明确标价。
        - 中-高——信贷收入真实存在，但扣除损失后的回报仍未披露。
        - 提供净息差、违约 / 回收曲线，以及扣除拨备后的实际收益率。
      - - Crédito FLEX / 供应商融资
        - 面向供应商付款和发票融资的循环或分阶段信贷。
        - 公开披露提到最高 7 MDP、最长 12 个月、年利率 30%，且示例 CAT 为 61.9%。
        - 已上线且明确变现。
        - 中-高——定价可见，但使用率和信贷损失不可见。
        - 提供使用率、重复提款率、平均票面、NPL 和准备金假设。
      - - 保理
        - 以费用和利息经济性，针对应收账款预支资金。
        - 营销信息称，最长 120 天后才付款的发票可在今天变现；成本页展示了保理 CAT 示例和放款费结构。
        - 产品已上线，但实际抽成率未公开。
        - 中——收入机制清楚，实际利差不清楚。
        - 提供平均预支率、费用抽成、期限、损失，以及按核心债务人划分的集中度。
      - - FX 转账
        - 转账费、FX 点差、结算服务和资金管理活动。
        - 已披露币种；客户点差或加价未公开披露。
        - 能力已上线，经济性不透明。
        - 低-中——是有用的相邻能力，但看不到实际点差或交易量收入。
        - 提供按走廊和币种划分的 FX 交易量、实际点差、对冲成本和净收入。
      - - 银行卡和薪资工作流
        - 银行卡交换费 / 净支出经济性，加上薪资处理变现或打包留存价值。
        - 功能存在已公开；独立定价没有公开。
        - 工作流可见，变现不可见。
        - 在银行卡和薪资抽成率披露前，收入质量偏低。
        - 提供活跃银行卡、支出量、扣除奖励后的交换费、薪资账户和薪资变现。
    notes: 该表把产品可见性与变现确定性分开。部分轨道有公开列表价，但实际收入组合仍未披露。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the materially visible monetization rails evidenced in retained product pages, legal documents, and the
        bank filing as of the run date.
