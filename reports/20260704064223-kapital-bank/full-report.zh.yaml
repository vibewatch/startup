      - number: '6.4'
        title: 耐久性证据比增长证明更薄，应用和投诉中的反向信号值得关注
        blocks:
          - type: paragraph
            body: >-
              Kapital 最弱的公开客户披露是留存和满意度。任何留存章节来源都未披露 NRR、GRR、logo
              留存、流失、续约时长或队列表。可用代理指标只能间接观察：重复工作流产品设计、公开客户引述、应用商店评分和投诉披露。最强正向代理指标是产品深度和嵌入式工作流。Banca Empresarial
              包含供应商付款管理、预测、薪资和一键发票工作流，Banca en Línea 处理财资和公用事业付款，FX 页面面向需要重复跨币种转账的企业。如果客户深度采用，这些动作有粘性。Mexico Business
              News 还引用管理层说法，称公司从问卷、聊天机器人和投诉中学习以改进平台，至少说明反馈回路在运转。


              反向证据足够实质，必须明确记录。Google Play 显示 Kapital Banca Móvil 评分 3.1 星、852 条评论，旧版 Kapital Bank Móvil 应用评分 2.4 星、627
              条评论，引用的投诉包括卡顿、流程混乱、数字 token 摩擦，甚至 ATM 吐钞纠纷。Finantres 也认为 Kapital 更适合企业，而不是只想要基础个人账户的用户，并提醒读者仔细检查佣金。Buró de
              Entidades Financieras PDF 给出更硬的服务数据点：2025 年 310 起投诉，每 10,000 份合同 6.3 起投诉的指数，以及 9.46
              的服务处理评分。正确解读不是客户质量已经坏掉，而是公开耐久性证明好坏参半，运营服务质量仍是真正的尽调线索。
