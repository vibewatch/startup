      - number: '4.2'
        title: 成本结构、单位经济性与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Kapital 的经济性更多由银行和信贷基础设施塑造，而不是轻量 SaaS 栈。KPTL México Bank 备案显示，1Q26 利息收入 MXN 1,239 million，对应利息支出
              MXN 867 million、拨备费用 MXN 144 million、管理和推广费用 MXN 334 million。这个组合至少指向五个影响承保的成本桶：存款资金成本、信贷损失、运营开销、监管 /
              合规基础设施，以及与外汇和证券相关的资金管理或做市活动。产品页面还增加了两项负担。第一，承保依赖 CIEC
              访问、税务数据、流水和担保人结构，意味着持续核验和服务成本。第二，企业平台包含银行卡、薪资、供应商付款、发票管理和预测，扩大了工作流，也扩大了客服和控制义务。公开牵引力真实存在：到 2025 年 9
              月，管理层和独立报道已引用约 300,000 客户和 $3 billion 资产负债表；1Q26 银行备案则显示资产 MXN 71,946 million、存款 MXN 58,421 million、净贷款
              MXN 25,786
              million。但可见牵引力仍不等于公开单位经济性。保留信源没有披露获客成本（CAC）、回本周期、流失、软件毛利率、外汇价差捕获、扣除激励后的银行卡交换费，或按贷款产品拆分的队列损失曲线。结果是规模信号强，但承保分辨率只有部分清晰。
