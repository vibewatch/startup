      - number: '1.5'
        title: 反向信号和证据缺口
        blocks:
          - type: paragraph
            body: >
              本章有两个重要反向信号。第一，Cybernews 2024 年 12 月报道称，研究人员发现一个归属于 Kapital 的 Google Cloud Storage 存储桶暴露在外，内含约 1.67
              million 个文件，主要是用于验证的选民 ID 和自拍照。Cybernews 称，其在发布前多次发送披露通知并联系 CERT-MX，但未收到 Kapital 回复。就表面事实看，对于任何把自己定位为 AI
              赋能、受监管金融机构的公司，这都是一个重要运营风险信号，因为它削弱了公司的合规和基础设施叙事。

              第二，Intercam 收购或许战略上聪明，但也带来合规和声誉风险。多份保留信源把交易放在美国对 Intercam 制裁以及洗钱指控的背景中解读。即便批评主要指向 Intercam
              或更广泛的墨西哥银行业危机，Kapital 仍成为负责整合的买方，必须证明客户入驻、AML / KYC 和资产核验能按承诺运转。这并不推翻增长故事，但意味着后续章节需要检验 2026
              年财务加速是否伴随更高的整合或行为风险。

              重要概况缺口仍未解决。公开来源没有给出干净、可访问的 2026 年员工数、完整董事会构成、可对账的生命周期融资表，或清晰披露的 Series C 后股权结构。一些本地画像甚至在创立年份和估值上漂移，写成 2019
              年或 $1.35 billion，而质量更高的融资报道指向 2020 年和 $1.3 billion。正确的尽调姿态是明确保留这些不一致，而不是把它们压平为单一、精修过的公司叙事。
