      - number: '3.4'
        title: 护城河耐久度、多归属风险与反向证据
        blocks:
          - type: paragraph
            body: >
              这张版图里的反向证据，不是某个对手已经统治每一层，而是 Kapital 想拥有的每一层，都正在被不同竞争者加强。Konfío 明确正从贷款走向存款和资金管理。Clip
              已经把受监管资金流动、终端和商户现金流贷款耦合在一起。Conekta 让本地在线支付经济性变得清晰，并主张自己在墨西哥授权率和拒付动态上优于全球处理商。Nu Mexico
              公开产品上仍只是消费者业务，但其规模和银行转型投入显示，可信消费者品牌积累分发力的速度可以很快。传统银行继续用全银行身份和公开费用表锚定买方信任，Adyen 则不断向编排和 AI 赋能商业更深处推进。

              Kapital 因此拥有真实但脆弱的护城河。它最强的差异化是套件收敛：买方能在一个界面看到信贷、公司卡、保理、账户、外汇和数字银行。问题在于，公开证据还没有显示出足够硬的锁定，能阻止商户把 Kapital 信贷与
              Clip 终端、Conekta 结账，以及 BBVA 或 Santander 运营账户混用。换句话说，护城河是执行型的，取决于 Kapital
              能多好地把套件转化为主账户行为；它不是结构型护城河，不像监管牌照、独特支付轨道或不可替代分发渠道那样坚硬。投资人只有在 Kapital 能展示绑定、留存和主银行钱包份额时，才应把竞争耐久度视为改善。
