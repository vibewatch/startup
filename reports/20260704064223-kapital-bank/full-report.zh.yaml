      - number: '7.5'
        title: 缓释因素真实存在，但承销判断仍需要监控触发点
        blocks:
          - type: paragraph
            body: >-
              本章不应读成 Kapital 已立即陷入压力的判断。公开证据显示，它是一家运转中的银行，具备规模、盈利能力、资本、流动性、HR A+/Stable 评级，并且留存 Buró
              披露中没有公开制裁。这些事实重要，因为它们让彻底偿付能力或牌照丧失情景今天不在最高风险层。公司还拥有正式投诉和 Condusef
              入口、可见信贷文件，以及足以证明其是真实受监管运营方的公开报告，而不是薄薄一层金融科技包装。


              如果少数可观察触发点走错，投资案例仍会快速破裂。最清晰的否决标准包括：2026 年客户批次进入账龄后，披露的不良率或覆盖率恶化；Intercam 整合出现任何监管条件、执法或审批延迟；另一起可信的开户数据隐私 /
              安全事件；IPO 规划升温前，无法把 Series C
              动能转化为更干净披露；或证据显示控股公司资金、契约或客户迁移执行比公开文件暗示的更差。因此，正确尽调姿态应是持续监控且证据饥渴：在把当前增长视为已降险之前，要求私有组合、治理、整合和安全材料。
