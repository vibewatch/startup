    columns:
      - 缺失的私有指标
      - 对分析的影响
      - 当前公开状态
      - 具体尽调路径
    rows:
      - - 按收入流拆分的合并收入
        - 无法严肃承销收入质量和多元化。
        - 保留来源均未披露按收入流拆分的收入、ARR 或毛利。
        - 索取月度管理账，拆分软件、存款 / 支付、贷款、保理、FX、卡、薪资和其他收入。
      - - 实际成交价与标价
        - 卡住对抽佣率、折扣和贡献毛利的验证。
        - 部分产品公开标价，但实际成交价不公开。
        - 索取实际成交价队列、折扣 / 减免日志，以及软件、FX、卡和薪资产品 P&L。
      - - 集团现金、烧钱速度和现金跑道
        - 无法量化融资依赖。
        - 保留来源均未披露合并现金、月度烧钱速度或现金跑道。
        - 获取资金报告、预算与实际烧钱对比，以及按法律实体拆分的情景现金跑道。
      - - 产品级逾期和损失曲线
        - 无法承销准备金是否充足、贷款业务是否耐久。
        - 公开信息只有全行 2.8% NPL 和 107.3% 覆盖率。
        - 索取发放批次、分桶迁移、回收、重组，以及按贷款产品拆分的集中度。
      - - 销售效率和 CAC / 回本周期
        - 无法与其他 SMB 金融科技公司做有意义比较。
        - 保留来源均未披露 CAC、转化率或回本周期。
        - 按产品线提供渠道组合、CAC、销售薪酬、激活和回本周期。
      - - FX、卡和薪资货币化
        - 三个可见工作流功能的经济性无法打分。
        - 能力公开；单位经济性不公开。
        - 提供 FX 交易量和点差、活跃卡消费和交换费、薪资账户数量，以及薪资手续费收入。
      - - 非墨西哥实体贡献
        - 看不清墨西哥银行申报代表大部分经济性，还是只是一个盈利核心。
        - 公开来源提到哥伦比亚和美国覆盖，但未披露分部 P&L。
        - 索取按国家 / 实体拆分的分部资产负债表、收入、直接成本和资本使用。
      - - 契约和控股公司债务图
        - 下行情景融资风险解释不足。
        - 独立报道提出契约和压力情景问题，但没有公开债务明细。
        - 获取完整债务堆栈、契约包、抵押品图和流动性触发阈值。
    notes: 每行都指出一个具体缺失输入；尽管公开披露集异常丰富，缺少这些输入仍会卡住标准金融科技、SME 贷款或受监管银行承销。
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036
      - CI038
      - CI039
      - CI045
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 公开状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - Cuenta PyME
        - 小企业和 PFAEs
        - 成熟且已上线
        - 把运营账户、SPEI、批量付款、薪资发放和实时可视性放进同一个受监管账户界面
        - 直接吞吐量、活跃账户和留存指标不公开
      - - Cuenta Empresarial
        - 法人主体和更大规模运营账户用户
        - 成熟且已上线
        - 低摩擦运营账户，带薪资和供应商付款工作流；适用产品享有受监管银行保护
        - 公开材料未披露卡、FX 或贷款的挂载率
      - - Banca Empresarial
        - 财务团队、业主和财务控制人员
        - 已上线，是套件核心
        - 在基础银行账户之外，增加卡、供应商发票、预测、融资入口、小组件和薪资控制
        - 没有公开架构图、API 界面或管理员角色模型
      - - Banca en línea + token 层
        - 需要网页银行和更高控制度操作的用户
        - 已上线，沿用受监管体系，并有活跃文档
        - Softtoken / token 门控，加上明确操作窗口和渠道级收费披露，显示出银行级流程控制
        - 公开文档未披露 MFA 失败率、欺诈控制或企业管理员委派细节
      - - 卡 / 钱包控制
        - 员工、出差人员和支出管理者
        - 已上线，但文档分散
        - 卡创建、充值、分配、钱包控制、锁卡流程，以及实体 / 虚拟混合用例，在企业平台和应用中均可见
        - 直接卡页面返回 404，因此卡规则深度分散在各处，没有集中呈现
      - - Crédito PyME（SME 信贷）
        - 需要营运资金融资的 SMEs
        - 成熟且有承销流程
        - 公开披露的承销输入、担保人 / 担保要求，以及 CAT / 费用披露，比典型私营金融科技营销更扎实
        - 审批率、风险分层和放款后表现仍未公开
      - - Crédito FLEX + Crédito Factoring（供应链融资）
        - 供应商付款和应收账款融资用户
        - 已上线，但经济风险重
        - 两个产品都嵌入同一生态，并在官方成本手册发布提款费 / CAT 示例
        - 公开页面未显示使用率、复购或债务人集中度
      - - FX 和移动应用栈
        - 跨境转账企业和需要移动端控制的用户
        - 已上线且多界面
        - FX 转账工作流加上独立银行、token 和 FX 应用足迹，说明嵌入式银行栈比单一应用更宽
        - 没有公开集成文档或发布说明解释这些应用界面背后如何交互
    notes: 各行基于保留公开证据描述产品成熟度，而非机密客户数量或使用深度。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the materially visible enterprise-facing product modules retained from official Kapital pages, app-store
        listings, and third-party product coverage as of the run date.
