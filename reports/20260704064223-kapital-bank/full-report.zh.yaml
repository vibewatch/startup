      - number: '6.2'
        title: 采用轨迹真实存在，但公开口径混合了自然增长 SMB、并购银行客户和宽泛客户标签
        blocks:
          - type: paragraph
            body: >-
              公开采用证据足以证明客户规模有分量，但还不足以给出一个投资级活跃客户分母。TechCrunch 称 Kapital 2023 年在墨西哥、哥伦比亚和秘鲁拥有 80,000 名小企业客户；公司另行收购了已有
              65,000 名客户的 Banco Autofin。Milenio 随后报道，2Q24 客户超过 100,000。到 2025 年独角兽轮，PR Newswire 和 Pulse 2 都称 Kapital
              在美国、墨西哥和哥伦比亚客户达到 300,000；Reuters 独立确认了墨西哥和哥伦比亚的运营版图。哥伦比亚方面，Kapital 自有网站给出更窄但更运营化的指标：服务超过 1,300
              家哥伦比亚公司，发放超过 USD 86 million。


              这些披露重要，但口径并不一致。有的专指 SMB
              客户，有的指所有客户，有的似乎包含并购银行关系，有的描述国家级运营公司而非合并集团。因此，采用轨迹可用来证明增长和地域扩张，却不足以承销留存或活跃钱包份额质量。官方产品入口也强化这一解读。Cuenta PyME
              承诺 48 小时内开户，Crédito PyME 要求一年经营历史，并把自己定位于营运资金、供应商付款或扩张；Banca Empresarial
              围绕薪资、应付账款和财务规划等重复工作流搭建。合在一起，这些页面暗示运营型企业有真实生产使用。它们没有说明 300,000 名客户里有多少是活跃软件用户、活跃存款人、重复借款人、并购来的遗留账户，或低频零售关系。
