            title: 观察公司，而不是 2025 年轮融资叙事
            body: Kapital 已披露的银行质量证据足以让公司保持可投资性，但合并经济性和股权结构表证据不足以支撑按最近披露轮加价买入。近期正确姿态是有纪律地监控，而不是兴奋追价。
