      - 地域
      - 数值
      - 说明
      - 主要限制
    rows:
      - - 企业基数
        - 墨西哥
        - 4.9m 家中小企业；5.51m 家私营部门经营场所
        - 账户、支付和信贷流程的漏斗顶部企业基数很大。
        - SME 与经营场所概念混在一起，因此更像宽口径 TAM 视角，不是精准 SAM。
      - - 企业基数
        - 哥伦比亚
        - 2024 年 1.739m 家活跃公司
        - 正规公司密度足以支撑规模化第二市场。
        - 活跃公司数量无法直接说明卡、信贷或软件就绪度。
      - - 企业基数
        - 美国
        - 5.58m 家 1-499 名员工的雇主企业；占雇主经营场所的 99.7%
        - 对照和走廊市场都很大。
        - 口径太宽、市场太成熟，不能当作 Kapital 已有证据支撑的核心 SAM。
      - - 融资缺口视角
        - EMDE / LAC 背景
        - 正规 MSME 缺口 US$5.7T；含非正规为 US$8T；2015-2019 年 LAC 金融供给 ~4%/yr 收缩
        - 证实替代性中小企业金融提供商的结构性逻辑。
        - 这是全球和区域背景，不是 Kapital 的国家级 TAM。
      - - 跨境支付视角
        - 拉丁美洲
        - US$1.4T 机会；平均 US$250 转账费率 23.3%，最高 30%
        - 供应商和贸易流程足够大，能支撑金融 + 支付产品。
        - 走廊机会不等于 Kapital 已捕获的收入池。
    notes: 本章使用多个受约束视角，因为没有单一公开数据集能把宽口径中小企业数量清晰转换为 Kapital 当前的 SAM 或 SOM。
