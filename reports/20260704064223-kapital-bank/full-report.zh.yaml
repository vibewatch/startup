companyProfile:
  summary: >-
    Kapital 是一家创立于墨西哥城的中小企业金融平台，把工作流软件、信贷和资金管理工具，与靠收购取得的银行基础设施组合起来，到 2025
    年已成为受监管金融集团。公司主要在墨西哥向企业销售商业账户、中小企业信贷、供应商和发票融资、银行卡、薪资服务，以及财务运营软件；早期和后续披露也提到哥伦比亚、秘鲁和美国。公开证据显示，Kapital 在 2025 年 9
    月完成独角兽轮融资，客户约 300,000 家，1Q26 银行资产负债表已有相当规模；但控股公司层面的关键经济性和治理细节仍未披露。
