        - 公开来源未披露核心银行供应商、账本模型或事故指标
      - - 业务工作流层
        - 把卡、薪资、供应商发票、预测和融资入口聚合进一个财务仪表盘
        - Banca Empresarial 页面
        - UI / 管理员模型、文件摄取和工作流编排
        - 没有公开 API、角色权限或导出控制文档
      - - 网上银行控制层
        - 提供 token 化网页银行、付款和明确操作窗口
        - Banca en línea FAQ 和费用
        - Token / softtoken 签发、网点支持和网页认证
        - 公开应用评论和支持说明显示 token 恢复有摩擦
      - - 移动应用层
        - 通过移动设备提供余额、转账、卡控制、投资、token 操作和钱包功能
        - Google Play、App Store 和开发者资料列表
