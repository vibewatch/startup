        - 在文件证据闭环前，将合作伙伴 / 整合风险视为打破投资逻辑
      - - 信贷恶化
        - IMOR、拨备覆盖率、重组和队列账龄数据
        - 2026 年队列成熟后表现差于计划，或覆盖率在没有解释的准备金增提下明显走弱
        - 暂停任何承销评级上调，并用更高损失假设重切下行情景估值
      - - 投诉或行为合规恶化
        - Buró、Condusef 和内部投诉包
        - 投诉率或正式争议增速明显快于合同增长
        - 上调行为合规和留存风险，并假设服务成本更高
      - - 安全控制失效复发
        - 安全事件、泄露通知或第三方审计发现
        - 再次出现可信的敏感数据事件，或重大事件后仍没有事后复盘
        - 将隐私 / 安全视为尽调门槛项，而非背景顾虑
      - - 融资 / 披露短板
        - 控股公司现金报告、契约余量和 IPO 准备度披露
        - 下一次资本市场动作前，治理或控股公司透明度没有实质改善
        - 打折估值，并要求更强投资人保护或更清晰资本结构
      - - 宏观 / 利率压力
        - Banxico 路径、IMF 增长预测修订和按行业划分的资产组合表现
        - 紧缩环境持续，同时中小企业还款或放款明显走弱
        - 重新承销增长和催收假设，并下调对当前盈利叙事的信心
