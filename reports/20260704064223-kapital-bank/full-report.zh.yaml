  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从披露规模和盈利能力，经由缺失的估值机制，到观察建议的推荐链条。
    data:
      nodes:
        - id: n1
          label: US$1.3B 轮次 + 新资金
        - id: n2
          label: 300k 客户 + US$3B 资产负债表声称
        - id: n3
          label: 1Q26 银行盈利、资本、流动性
        - id: n4
          label: 缺失 ARR / 收入桥
        - id: n5
          label: 缺失稀释 + 优先股堆叠
        - id: n6
          label: Intercam + 安全风险折价
        - id: n7
          label: 价格看起来可解释，但不便宜
        - id: n8
          label: 建议：观察
        - id: n9
          label: 上调触发：更多披露或更好入场价
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV012
      - CV013
      - CV014
      - CV015
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 用五套不同证据镜头给出 US$M 口径的示意估值输出，而不是一个虚假精确的单一模型。
    data:
      items:
        - label: 披露折价 / 下轮融资视角
          value: 900
        - label: 最近披露轮次锚点
          value: 1300
        - label: 银行盈利支撑视角
          value: 1450
        - label: 合并证明上行视角
          value: 1800
        - label: IPO 就绪平台溢价视角
          value: 2200
    approximationNotes: 数值是作者对 US$M 股权价值的估计。它们展示了，在投资人能或不能依赖合并收入、资本结构和整合证据时，结果会拉开多大距离。
    claimRefs:
      - CV001
      - CV008
      - CV035
      - CV036
      - CV038
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 以上一轮披露的 US$1.3B 轮次锚点为参照，给出悲观、基准和乐观股权价值区间。
    data:
      items:
        - label: 悲观
          low: 700
          mid: 900
          high: 1100
        - label: 基准
          low: 1100
          mid: 1350
          high: 1600
        - label: 乐观
          low: 1800
          mid: 2200
          high: 2600
    approximationNotes: 所有数值都是作者以 US$M 计的估计，不包含未披露的清算优先权或进一步稀释。以 US$1.3B 入场，隐含 MOIC 区间大约为悲观 0.5x-0.85x、基准 0.85x-1.2x、乐观 1.4x-2.0x。
    claimRefs:
      - CV001
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，1-5 分，5 分最强、最具吸引力。
    data:
      items:
        - label: 市场机会
          value: 4
          note: SMB 银行和运营金融痛点在墨西哥及邻近市场真实存在
        - label: 产品 / 资产负债表证据
          value: 4
          note: 受监管银行文件和可见产品广度强于典型私营金融科技公司披露
        - label: 护城河耐久性
          value: 3
          note: 捆绑融合有用，但锁定仍更像执行结果，而不是结构性优势
        - label: 经济性可见性
          value: 2
          note: 银行利润可见；合并收入质量和 ARR 不可见
        - label: 治理 / 合规
          value: 2
          note: Intercam 复杂度和 2024 年泄露事件让该项低于中性
        - label: 估值证据质量
          value: 2
          note: 定价本身说得通，但股权结构表和清算优先权仍缺细节
        - label: 融资弹性
          value: 3
          note: 刚完成的 Series C 轮和银行资本能提供缓冲，但控股公司现金可见度仍弱
        - label: 退出准备度
          value: 2
          note: IPO 故事已经成形，但 2026 年市场看重更干净的披露，Kapital 目前给出的信息还差一截
    approximationNotes: 这些分数只来自作者对公开证据的判断。估值证据得分低，反映的是数据缺失，并不等于认定这门业务没有价值。
    claimRefs:
      - CV008
      - CV012
      - CV013
      - CV015
      - CV036
      - CV038
      - CV048
