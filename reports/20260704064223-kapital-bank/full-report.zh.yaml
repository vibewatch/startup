      - number: '6.5'
        title: 扩张杠杆清晰可见，但集中度和定义风险仍压低确信度
        blocks:
          - type: paragraph
            body: >-
              Kapital 的扩张逻辑是客户故事里更有说服力的部分之一。同一段关系可以从账户开始，转入财资或 FX，加入薪资，再深化到营运资金信贷、供应商金融和分析。官方页面反复营销这种打包动作。Cuenta
              Empresarial 和 Cuenta PyME 承诺运营账户；Banca Empresarial 叠加分析、付款日历、供应商管理、卡和薪资；Crédito PyME 与 FX
              增加流动性和财资邻近场景；Sacra 认为更广的多产品策略旨在随时间提升单客户收入。哥伦比亚页面在另一市场展示同样模式，把保理、信贷、Flex、借记卡、薪资和工作流工具组合起来。战略上，Kapital 试图成为
              SMEs 的财务操作系统，而不是单一产品贷款机构。


              风险在于，公开证据仍只部分覆盖客户集中度和扩张质量。银行 1Q26 报告明确称，两个个人客户或经济集团的风险敞口超过一级资本的
              10%；同一报告还称，管理层希望分散客户基础，并优先发展公众存款来缓解集中风险。这是有价值的披露，但没有回答更深的承销问题：收入有多少来自前 10 大客户，存款或贷款余额按行业有多集中，300,000
              客户标题里有多少活跃并变现，交叉销售是否在不提高支持负担的情况下提升客户终身价值。问题解决前，Kapital 的客户逻辑最好评为获客广且有前景，但耐久性和集中度仍披露不足。
