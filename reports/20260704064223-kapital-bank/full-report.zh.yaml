  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 核心客户分层仍以 SMB 为先，同时外溢到企业、跨境和类消费者场景
        blocks:
          - type: paragraph
            body: >-
              Kapital 的公开客户地图很宽，但重心仍是中小企业，而不是通用零售银行。多个独立和官方入口都指向这一点。Mexico Business News 称 Kapital「自豪地只服务
              SMEs」，TechCrunch 在 2023 年描述公司服务墨西哥、哥伦比亚和秘鲁的小企业。Sacra 将产品市场匹配客群进一步缩窄，称拥有约 10-100 名员工、USD 2-10 million 收入的拉美
              SMB 是甜点区。官方产品页随后展示 Kapital 如何实际切分这群客户：Cuenta PyME 服务小公司和 PFAEs，Cuenta Empresarial 服务更大的法人运营方，Banca
              Empresarial 把支付、供应商管理、分析和薪资包进同一个运营层，FX 页面则瞄准以多币种支付供应商或收款的企业。


              关键细节是，Kapital 不再只是狭义 SMB 银行。网银页面仍宣传面向公司和个人的服务，银行报告明确将商业账簿拆成 Empresarial 和
              PyME，同时还持有汽车、个人、薪资等消费者组合；哥伦比亚站点又加入借记卡、薪资、保理和社区 /
              工作空间层。客户分层最好按购买者、使用者和用例拆开看：业主经理和财务团队购买关系，运营人员使用财资和工作流工具，员工可能接触薪资或卡，一些并购来的零售或财富客户也邻近核心 SMB
              逻辑。未披露的是按细分、地域和变现层拆分的精确客户结构，因此分层地图方向上强，但数字上不完整。
