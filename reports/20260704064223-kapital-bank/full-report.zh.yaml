      - number: '5.3'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >
              Kapital 的部署叙事在触及受监管运营的地方最强，在投资人通常期待软件遥测的地方最弱。官方页面显示多个已上线部署入口：面向财务运营的 Banca Empresarial、面向 token 化网页银行的
              Banca en línea、用于移动端控制的 Google Play 和 App Store 应用，以及暗示零售 / 移动银行、token 工具和 FX
              分开分发的应用商店开发者页面。这些入口今天已经支撑真实任务，其中几个还显示 2025-2026 年更新。支持和升级路径也具体：官方澄清页和 CONDUSEF
              页面公布电话、邮件、网点和监管机构渠道；应用商店列表补充支持联系方式；网银文件说明 token 恢复流程。问题在于可靠性可见度。Kapital 不公布状态页、API
              文档、事故历史或服务级别承诺，本次留存中一些产品技术上应重要的直接 URL 也不稳定。专门的卡片页面返回品牌 404，专门的 AI 页面返回 403，官方页脚链接的隐私通知 URL
              未能通过留存抓取路径取回。独立应用反馈也显示摩擦。一个 Google Play 商业应用列表称数据未加密，并有超过 2,000 条评论；较新的银行应用入口仍围绕 token、UX
              和具体银行任务出现褒贬不一的运营反馈。正确尽调结论是：部署是真实的，但软件质量证据比功能面的宽度更薄。
