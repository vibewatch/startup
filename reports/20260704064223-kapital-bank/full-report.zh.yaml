      - number: '3.2'
        title: 直接同业、能力重叠与定价姿态
        blocks:
          - type: paragraph
            body: >
              在金融科技同业中，Konfío 是最接近 Kapital 更大野心的信贷主导替代者。其公开信贷页面宣传最高 MXN 5 million 的无抵押企业贷款、固定利率、数字入驻和 48
              小时放款；第三方和新闻报道则显示，它正试图通过银行牌照增加存款和资金管理服务。这个方向重要，因为 Kapital 也想站在中小企业运营栈中心，而不是停留在点状解决方案。Clip
              是微型和小型企业端最接近的商户栈替代者：它组合了银行卡终端、受监管数字账户和基于授信邀约的企业贷款，再用硬件折扣和当日结算降低采用门槛。

              Conekta 在贷款上重叠较少，但在支付钱包份额上与金融栈重叠更多。其官方界面强调，一次集成即可覆盖银行卡、SPEI、现金、BNPL
              和钱包，并为中小企业给出明确表价。当买方痛点是结账转化、支付方式组合或对账，而不是信贷时，Conekta 就成为强替代方案。Adyen 更偏高端市场，但战略上重要，因为它提供线上加 POS 的统一支付平台、透明的
              Interchange++ 定价，以及 Adyen Agentic 等不断扩展的编排能力。对 Kapital 来说，含义很清楚：买方可以拆分金融栈，选择在其最关心工作流上最强的专门公司，再围绕其他部分多归属。
