  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              对 Kapital
              来说，相关市场不是「所有金融科技」，甚至也不是所有企业银行服务。更窄的边界是中小企业运营金融：商业账户、支出控制、供应商付款、收款、短周期营运资金信贷，以及把支付活动转化为承保和工作流自动化的数据层。这个边界重要，因为买方要解决的是日常运营问题——如何收款、向供应商付款、管理银行卡和现金、在不承担重文件工作的情况下获得信贷——而不是购买一段长期资金管理关系或消费者银行账户。World
              Bank 和 IFC 把中小企业金融定义为发展和生产率的核心瓶颈，同时也强调开放金融、嵌入式金融和替代信贷轨道可以降低小企业营运资金摩擦。

              墨西哥是已审阅证据中最清晰的核心市场。INEGI 2024 年经济普查记录了 7.09 million 个机构和 5.51 million 个私营部门 / 准国有经济单位；与 Plan México 相关的
              2026 年本地行业报道则把中小企业基数估为约 4.9 million 家，占商业版图的 99.8%，贡献 72%
              正式就业。哥伦比亚是自然邻近市场，因为正规企业基数足够大、具备战略意义——Confecámaras 数据显示 2024 年有 1.74 million
              家活跃企业——但融资和支付摩擦仍然明显，尤其集中在微型和小型企业。美国语境主要作为对照和走廊市场相关：2023 年有 5.58 million 家 1-499 名员工企业，这些企业占雇主机构的
              99.7%；但广义美国企业银行市场太大也太成熟，若没有公司披露，不能把它视为 Kapital 已有证据支撑的核心可服务市场（SAM）。

              现状替代方案仍是传统银行账户叠加手工流程：现金收款、电子表格对账、网点式服务、不解决营运资金需求的收单机构，以及不复用交易数据的单独信贷申请。在墨西哥，这种现状仍有黏性，因为 80% 的交易仍以现金完成，30%
              的人口表示担心数字安全。在哥伦比亚，问题不在于正规企业注册不足，而在于产品深度不够：许多企业有存款关系，但活跃信贷少得多。在美国，对照证据显示数字贷款机构提高了便利性，但定价意外和借款人不满仍存在。合在一起看，Kapital
              的竞争对象不太像单一 neobank，更像碎片化的传统关系加重现金工作流。
