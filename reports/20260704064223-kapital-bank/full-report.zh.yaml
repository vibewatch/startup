      - number: '8.3'
        title: 乐观、基准、悲观情景与可比公司组
        blocks:
          - type: paragraph
            body: >
              可比证据指向 Kapital 价格的中间判断。公开拉美和数字银行可比公司的质量跨度很大：Nu 和 MercadoLibre 因为把广泛分发与已验证盈利引擎结合起来，交易规模极大；StoneCo、PagBank 和
              LendingClub 则展示更聚焦支付、SMB 和数字银行模型在公开市场能拿到什么水平。私有可比也混合。Ualá 2026 年 3 月轮融资将一家全栈拉美数字银行估值为 US$3.2
              billion，Mercury 2026 年 5 月 Series D 将一家盈利的美国 SMB 银行金融科技公司估值为 US$5.2 billion，Clara 虽然后来做了债务融资，在 Tracxn
              上仍筛到约 US$1 billion 价值。Kapital 的 US$1.3 billion 价格高于 Clara，低于 Ualá 和 Mercury，也远低于已规模化公开赢家。


              这个位置方向上合理，但不能自证。客户价值视角尤其有启发。按 300,000 客户数计算，Kapital 最近披露轮隐含每客户约 US$4.3 thousand。这个水平明显高于 Nu 或 Ualá
              等大众市场拉美数字银行，但仍远低于 Mercury 的 SMB 聚焦客户价值。含义是，市场已经把 Kapital
              按更高价值企业客户和资产负债表平台定价，而不是按商品化零售数字银行定价。这个判断可以合理，但前提是承销、挂载和留存确实好于当前公开记录能证明的水平。


              因此，情景区间刻意保持纪律。悲观情景假设整合、合规或信贷质量问题把 Kapital 推向持平轮或降价轮。基准情景假设 1Q26 盈利信号可持续，但尚不足以打开溢价重估。乐观情景要求合并盈利可见度、Intercam
              成功整合，以及 2027-2028 窗口可信的 IPO 或战略退出路径。基于今天可得的公开证据，基准情景聚集在上一轮附近，而不是远高于它。
