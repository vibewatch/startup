  - id: TM003
    title: 各国准入与采用指标
    columns:
      - 地域
      - 指标
      - 2024-2026 数值
      - 重要性
      - 注意点
    rows:
      - - 墨西哥
        - 正规中小企业信贷可得性
        - 当前 15%；政策目标 30%
        - 显示承保和营运资金缺口很大。
        - 来自本地 2026 年政策和行业报道，而非单一公开监管表。
      - - 墨西哥
        - 数字支付轨道采用
        - 移动银行采用率 69%；2025 年 >6bn 笔数字交易
        - 说明用户群越来越能通过数字金融触达。
        - 移动银行使用不等同于中小企业产品采用。
      - - 墨西哥
        - 现金 / 信任约束
        - 80% 交易仍用现金；30% 提到数字安全担忧
        - 解释了为什么上手和建立信任仍是关键。
        - 消费者和经济层面指标只能代理企业行为。
      - - 哥伦比亚
        - 正规公司金融可得性
        - 72.5% 至少拥有一项产品；26.7% 有活跃信贷
        - 存款可得性广，但信贷深度浅得多。
        - 信贷指标覆盖法人实体，不覆盖每个个体经营者。
      - - 哥伦比亚
        - 实时支付采用
        - 前五个月 >500m 笔 Bre-B 交易和 >100m 个支付密钥
        - 更快的互操作支付轨道可改善收款，并为承保沉淀更多数据副产物。
        - 这是早期上线统计；长期留存和变现仍未知。
      - - 美国
        - 融资需求和结果
        - 60% 寻求融资；42% 拿到全额；在线贷款机构申请者占比升至 29%
        - 即便成熟市场，融资需求和渠道取舍仍强。
        - 结果基于雇主企业调查，不代表全部美国小企业。
    notes: 指标有意混合信贷、支付和信任，因为实际可触达市场取决于三者，而不只取决于企业数量。
