      - number: '5.4'
        title: 差异化、信任栈与产品风险
        blocks:
          - type: paragraph
            body: >
              Kapital 最清晰的产品差异化不是公开开发者护城河，而是持牌银行和集团金融结构之上的套件收敛。官方页面、费用表、评测报道和评级报告共同指向一家机构：它想同时拿住 SME 运营账户、财务看板、企业卡控制、FX
              转账和信贷栈。这比纯数字银行或单点贷款切入更强，因为同一个界面可以承接存款、触发薪资、支付供应商、对账发票并融资缺口。公开 AI
              信息强化了这一逻辑，但幅度有限：业务平台页面提到实时财务数据、趋势检测和预测，但本次无法检查专门的 Kapital IA 页面，因此 AI
              层应视为工作流增强，而不是已验证的自研模型栈。信任基础则好坏参半。官方页面反复引用 CNBV 监管、CONDUSEF 升级和适用产品的 IPAB
              保护，评级机构也正面评价整合、资本化和风险管理。但反向证据很实质：Cybernews 报道 2024 年 Kapital 相关选民 ID
              和自拍照大规模暴露，并列出具体补救步骤，暗示此前存储控制、日志和客户通知实践存在弱点。因此，监管和资产负债表层面的信任栈是真实的，但隐私运营、韧性和软件控制成熟度的尽调仍不完整。
