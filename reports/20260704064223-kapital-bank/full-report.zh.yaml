  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与用户工作流
        blocks:
          - type: paragraph
            body: >
              Kapital
              的企业产品最好理解为面向墨西哥中小企业的一套打包财务工作流，而不是独立银行账户或贷款。官方企业导航和保留产品页面显示，一套栈从受监管运营账户开始，延伸到企业银行软件、网上银行、外汇转账、中小企业信贷、供应商融资和发票支持融资。Cuenta
              PyME 和 Cuenta Empresarial
              是入口轨道：两个页面都强调开户、实时余额、SPEI、批量付款和薪资发放；企业平台页面则在同一界面加入供应商发票管理、预测、发卡和信贷访问。这意味着实际用户路径是：开立或迁移运营账户，激活数字渠道，运行应付账款和薪资，创建用于支出控制的银行卡，然后在营运资金需求出现时提取信贷或保理。公开移动端证据强化了这个框架。Kapital
              的 Android 和 iPhone 商店页面显示，其移动端可用于余额、转账、投资、银行卡管理和基于 token 的安全；Google Play 开发者资料还暴露了 Token Kapital 和 Kapital
              FX 两个独立 App 足迹。因此，工作流很宽，也有合理黏性；但它不是纯自助：开户门槛、重文档承保、token 激活，以及部分与网点相连的网上银行设置步骤，仍让产品更像被金融科技 UX
              包装起来的受监管银行基础设施，而不是完全软件化的平台。
