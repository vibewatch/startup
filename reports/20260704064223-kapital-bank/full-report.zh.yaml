      - number: '7.2'
        title: 信贷、资金和宏观风险偏高，尽管当前偿付能力信号看起来扎实
        blocks:
          - type: paragraph
            body: >-
              最重要的财务模型风险不在 Kapital 是否能报价信贷产品或展示资产负债表增长；它显然能。1Q26 银行文件显示 MXN 71.9 billion 资产、MXN 58.4 billion 存款、MXN 25.8
              billion 净贷款、MXN 5.7 billion 权益、13.52% 资本比率、407 流动性覆盖系数、MXN 5.289 billion 净资本和 MXN 4.83 billion
              表外信贷承诺。Excélsior 还强调 2.8% 不良贷款率和约 13.9% 资本化比率。这些是有意义的缓释因素，因为它们展示的是一张真实的受监管资产负债表，而不是只有叙事的金融科技公司。


              剩余风险在于，增长和定价远比下行情景下的信贷质量更可见。Kapital 自有 SME 信贷文件显示较高报价
              CAT、开户费、担保人结构、流动存款担保和逾期利率条款，这意味着回报高度依赖承销、催收和行为纪律。但公开材料仍未披露账龄曲线、欺诈损失拆分、重组、滚动率、回收或控股公司现金需求。因此，Crowdfund
              Insider 提到信贷投资人仍关注预付率、契约和现金流压力情景，很重要。宏观背景增加的是压力，不是缓解：Banxico 表示，即使 2026 年 5 月将隔夜利率降至 6.50%，政策仍具限制性；IMF 预计
              2026 年仅增长
              1.5%，贸易不确定性仍约束活动。因此，投资人已有足够证据排除偿付能力恐慌，但还不足以承销下一轮信贷下行周期。关键私有证据缺口是一座产品级损失和资金桥，能把高增长投放与实际账龄、准备金和控股公司流动性连起来。
