  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Kapital 方案
      - 可衡量收益
      - 限制
    rows:
      - - 开立 SME 运营账户并开始交易
        - 企业提交开户文件、给账户入金，并进入日常转账和付款
        - Cuenta PyME 或 Cuenta Empresarial
        - 公开披露的 PyME 48 个工作小时开户路径和数字账户操作降低对网点的依赖
        - 开户仍取决于文件完整和监管批准
      - - 处理薪资和经常性应付款
        - 财务团队登记协作者、排期付款，并在同一运营栈发起批量发放
        - Banca Empresarial 加账户清算通道
        - 薪资、批量付款和提醒嵌入同一工作流，不必用独立工具
        - 没有公开薪资集成目录或导出 / API 细节
      - - 控制员工和企业支出
        - 管理员创建卡、分配资金，并按用户或出差监控支出
        - Banca Empresarial 内的卡控制，加移动钱包管理
        - 平台和应用界面都支持实体卡和虚拟卡用例
        - 直接卡页面不稳定，因此规则深度和卡项目结构没有完整文档
      - - 为供应商发票融资并平滑现金流
        - 公司审核发票、排期供应商付款，或用营运资金产品为其融资
        - Banca Empresarial 中的供应商工作流，配合 Crédito FLEX 或保理
        - 同一界面处理应付款、融资和预测，减少切换上下文
        - 公开来源未显示信用额度调整或发票资格的政策规则
      - - 跨境转账
        - 用户基于现有 Kapital 关系或 FX 合同操作，并为跨境转账提交实体文件
        - 企业外汇转账
        - 官方页面列明多币种资金流动和清晰的最低文件集
        - 定价是示例性质，公开集成深度未披露
      - - 通过网页和移动渠道运营
        - 用户激活 token / softtoken、登录、发起 SPEI、跟踪余额，并使用移动应用功能
        - Banca en línea、Kapital Business、Kapital Banca Móvil 和 Kapital Bank Móvil 应用
        - 多渠道访问支持 24/365 可视性和低成本数字转账
        - 应用商店评论显示部分界面存在可用性和 token 摩擦
    notes: 收益仅限于公开来源明确写明的内容；不应理解为已审计客户结果。
