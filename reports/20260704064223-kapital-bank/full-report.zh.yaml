      - number: '1.3'
        title: 融资历史、投资人和资本结构
        blocks:
          - type: paragraph
            body: >
              Kapital 的融资历史方向清楚，但部分精确总额仍显混乱。2023 年 Series A 和 Series B 节点有充分记录：TechCrunch 和 LatAmList 描述 2023 年 5 月一轮
              $20 million 融资外加 $45 million 债务额度；后续 Series B 新闻稿则称公司此前宣布的是 $23 million Series A，加上同一笔 $45 million
              债务额度。差异按比例看不大，但足以让生命周期融资总额不能被当作干净事实。到 2023 年 12 月，Kapital 已完成一轮超额认购的 $40 million Series B 股权融资，另有 $125
              million 债务额度，由 Tribe Capital 领投，Cervin Ventures、Tru Arrow、MS&AD Ventures、Alumni Ventures 等投资人支持。

              对当前阶段判断最重要的资本事件，是 2025 年 9 月 Series C。公司和媒体报道基本一致：最高 $100 million 融资，估值 $1.3 billion，由 Tribe Capital
              领投、Pelion Ventures 共同领投，Y Combinator、Marbruck Ventures 和 True Arrow 参投。多方信源还称 Kapital
              在当时已经盈利。Reuters/Yahoo、Fintech Global、Nearshore Americas 等媒体均重复了管理层的说法：银行牌照加自研软件栈，是更高利润率和更快扩张背后的机制。

              投资人地图仍有限制。公开来源按轮次披露了领投方，但没有完整股权结构表、清算优先权、债务契约，也没有说明已宣布资本与已完全提取资本之间的精确边界。CNBC 2024 年画像在独角兽轮之前列出的累计融资为 $295
              million，可作为外部校验，但仍不足以调和之后每一个数字。正确的分析立场是：Kapital 已明确进入后期阶段、资金充足；但在管理层给出可对账的融资轮历史和债务使用计划之前，精确累计融资仍需部分保留。
