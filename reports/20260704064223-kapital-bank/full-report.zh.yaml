      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方 / 用户 /
              付款方模式，比大型企业软件更集中。在墨西哥微型和小型企业中，业主经理通常同时是买方、运营用户和最终付款方，即便有记账员或家庭成员协助对账。规模稍大的墨西哥中小企业和哥伦比亚法人实体，用户群会扩展到财务、运营和采购人员，但预算所有权仍通常落在创始人、法定代表人或财务负责人手里。美国对照市场中，少于
              500 名员工的企业也类似：融资需求往往由眼前运营需要驱动，而不是集中规划的资本预算。

              这些用户购买的不只是银行账户。他们买的是速度、确定性和数据复用。Mastercard 的拉美中小企业研究显示，已经接受数字支付的中小企业中，93% 认为这些轨道至关重要或非常重要，84%
              认为没有它们企业就无法持续经营，75% 依赖它们向供应商付款，88% 把它们与信贷可得性相连。这些结果重要，因为它们说明钱包所有者并不只优化名义账户费最低；买方优化的是贸易连续性、结账转化率和后续融资。在墨西哥
              / 中美洲 / 加勒比支付受理研究中，近 11 million 家企业仍可受益于数字受理扩张，77% 尚未接受数字支付；这为贷款机构或运营金融平台成为记录系统之前，留下了巨大的入驻楔子。

              因此，采用触发点随细分市场而变。现金占比高的商户，会在客户要求银行卡或数字受理时迁移。成长型中小企业，会在供应商付款、对账和信贷申请过于手工时迁移。哥伦比亚正规企业，会在互操作支付轨道和开放金融规则让多银行工作流更容易时迁移。与美国相连的跨境中小企业，会在供应商付款的延迟、不透明和外汇
              / 费用拖累痛到足以支持切换时迁移。信任贯穿所有这些细分市场：Mastercard 2026 年研究发现，88%
              接受支付的中小企业优先看重供应商的可信度和可扩展性；墨西哥公共政策讨论仍把信任和行为改变描述为主要采用瓶颈，而不是原始技术可得性。
