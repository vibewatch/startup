chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与业务足迹
        blocks:
          - type: paragraph
            body: >
              Kapital 如今的核心身份，更适合被定义为银行、信贷平台和中小企业运营软件的混合体。TechCrunch 2023 年的报道把公司描述为一家墨西哥城金融科技公司，由 René Saúl 和 Fernando
              Sandoval 于 2020 年创立，目标是让中小企业也能获得大企业式的现金流、信贷、开票和运营决策可见度。CNBC 2024 年 Disruptor 50 画像以及后来的 2025
              年融资报道显示，平台已从信贷和现金管理工具，扩展成覆盖账户、银行卡、薪资、福利和 AI 辅助承保的更完整套件。保留下来的官方治理页面也显示，Kapital
              把自己呈现为一个集团，旗下产品横跨商业和消费者账户、信贷、外汇、投资、数字银行和 AI。

              最清晰的战略主线是，管理层并不想停留在传统银行轨道之上的轻软件层。Kapital 的产品定位把工作流软件和受监管资产负债表产品合在一起。TechCrunch 在 2023
              年直接写到这一点：创始人希望中小企业能在一个地方满足现金流、信贷和投资需求；后续公司材料则把 Kapital
              描述为一家技术优先的银行。这个区别会影响报告后续判断：经济性、承保能力和防御性的章节结论，应把银行基础设施所有权视为核心主张，而不是营销话术。

              地理证据同样显示，公司随收购扩张调整了运营足迹。2023 年资料提到墨西哥、哥伦比亚和秘鲁；2025
              年融资报道则强调墨西哥、哥伦比亚和美国。这不一定矛盾，更可能反映各披露日期的优先级，以及哪些司法辖区已有实质活动。证据最充分的结论是，墨西哥是运营重心，而公司越来越以受监管集团而非单一产品金融科技应用来对外叙事。
