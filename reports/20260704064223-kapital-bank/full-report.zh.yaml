        - label: 低可能性
          values:
            - 即时偿付压力
            - 评级下调
            - 针对 Kapital 本身的公开制裁
            - 近期威胁牌照的执法
    approximationNotes: 排布为定性判断，反映当前公开证据，不是量化概率模型。
    claimRefs:
      - CR007
