      - number: '7.4'
        title: 合作方、依赖和人员执行风险被整合和创始人集中放大
        blocks:
          - type: paragraph
            body: >-
              Kapital 下一阶段执行负担异常高，因为几个依赖项必须同时跑通。公司一边运营快速增长的银行，一边整合在制裁时代压力下收购的 Intercam 资产，还要在 2025 年独角兽轮后维持外部资本渠道，并讨论
              IPO 时间线。公开指标和评级显示受监管银行今天在运转，但不能消除对监管审批、迁移质量、融资市场信心或墨西哥特定宏观条件的依赖。Intercam 交易尤其重要，因为它不是简单的小型补强式产品功能；它在更高 AML
              和声誉审查下增加了券商、资产管理和运营银行复杂度。


              人员风险同样集中。René Saúl 的公开资料明确称他带领 Kapital 从金融科技公司演进为商业银行再到金融集团，主流人物稿仍把 René Saúl 和 Fernando Sandoval
              呈现为核心公开操盘手。创始人市场契合重要时，这是实实在在的优势；但这也意味着，公开视野中的执行可信度仍很大程度压在一个小团队身上。治理页面有帮助，但可访问材料仍没有给投资人一张干净的公开委员会地图或控股公司风险看板。实际含义是，执行风险不再主要是产品能不能上线；而是管理层能否足够快地工业化治理、报告和整合控制，以支撑下一轮融资或
              IPO 步骤。
