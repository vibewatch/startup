      - number: '3.3'
        title: 传统银行、监管姿态与切换成本
        blocks:
          - type: paragraph
            body: >
              传统银行仍有结构性威胁，因为它们把信任、存款和商户收单打包在一起，这是金融科技公司仍无法完全匹配的组合。BBVA 发布的 Cuenta Maestra Pyme 看起来摩擦很低，开户最低只要 MXN
              1；但运营现实是网点开户、部分法人实体需做受益所有人声明，并且依赖既有 BBVA 关系才能解锁数字信贷授信邀约。它还公布了商户收单经济性，包括便携 TPV 的 2.15%
              借记折扣率，以及入会和低交易量费用。Santander 的 PyME 套餐也围绕账户、终端和 App 控制打包，PFAE 方案标价从 MXN 0 起，并附加 Getnet
              的支付链接、目录、库存和终端工作流等功能。Banorte 在本次抓取流程中透明度较低，因为其官方中小企业产品 URL 不稳定；但公司发布的认可信息仍指向可观的中小企业贷款和存款份额。

              这些银行结构以不同于金融科技 UX 的方式抬高切换成本。一旦中小企业通过一个银行账户走存款、供应商付款、银行卡和 POS
              结算，更换服务商会同时影响合规、网点服务、资金管理控制和支付轨道。这并不意味着传统银行总是更好用；事实上，它们的文档和基于邀约的信贷流程给金融科技公司留下了以速度取胜的空间。但这确实意味着，Kapital
              不能假设软件便利本身就能形成锁定。若要守住主账户，它必须匹配或超过银行明示的信任、披露和运营账户相关性。
