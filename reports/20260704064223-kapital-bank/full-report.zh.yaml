      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              最稳定得到交叉印证的创始人运营组合，是 CEO René Saúl 和 CFO Fernando Sandoval。TechCrunch 在 2023 年 Series A 和 Series B
              报道中均称二人为联合创始人，2025 年 PRNewswire 与 Reuters/Yahoo 文章也仍把他们作为主要高管声音引用。CNBC 的 Disruptor 50 画像把创始人范围扩大到 Eder
              Echeverria 和 Arjun Sethi，后续本地画像也以不同侧重点重复了这些名字。尽调上更稳妥的结论是，René Saúl 和 Fernando Sandoval
              是公开材料中两位不可替代的运营高管；Eder Echeverria 和 Arjun Sethi 出现在部分创始人 / 董事会列举中，但角色细节不够一致。

              领导层叙事高度创始人中心化。FinTech México Festival 演讲者页面把 René Saúl
              描述为带领公司从金融科技转向商业银行、再转向金融集团的高管；公开融资和媒体报道也频繁引用他对产品、监管和扩张的表述。这种集中度在 CEO 叙事控制、监管关系管理和收购执行上形成明确的关键人依赖。Sandoval
              则是资产负债表增长、盈利能力和 AI / 风险系统上的公开对应人物。

              治理透明度明显弱于增长披露。Kapital 可访问的投资者关系页面有助于理解公司如何营销自身，以及理论上应有哪些文件集；但该页面上最直接的治理材料是链接
              PDF，在本次运行中受到机器人防护或因其他原因无法访问。因此，报告可以验证公司存在治理和投资者关系界面，却无法验证完整公开董事会名单、委员会结构或所有权地图。这是明确的尽调缺口，不能据此推断公司缺乏监督。
