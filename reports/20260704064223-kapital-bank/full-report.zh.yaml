  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价和混合 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Kapital
              公开的变现界面，比通常的中小企业数字银行叙事更宽。官方页面显示至少六条已上线或相邻轨道：企业存款账户、付费财务管理平台、中小企业期限信贷、循环供应商融资、保理和外汇转账，薪资和银行卡控制嵌在同一运营工作流内。关键在于，这些轨道并不是同一种定价方式。最清楚的显性软件价格，是企业平台每月
              MXN 1,199 加 VAT；账户经济性则更多取决于余额门槛、交易费用和交叉销售。Cuenta Empresarial 对外宣传无年费、无开户最低额，但 Cuenta PyME 要求 MXN 5,000
              开户；若月均余额低于 MXN 2,500，则收取 MXN 170 加 VAT。公开视角下，信贷产品变现强得多：Crédito PyME 在 Kapital 自己的示例中收取 3 percent 开户费，CAT 为
              58.3 percent；公开 FLEX / 保理披露也显示较高 CAT 和提款费用。GTM 看起来也不是纯自助，而是混合型：客户可以线上开户并数字化管理运营，但网站反复推动顾问回电、高管协助、基于 CIEC
              的数据摄取和重文档承保。这个组合说明，Kapital 在销售一个可扩展的中小企业操作系统，但其实际经济性可能更依赖贷款和资金管理交叉销售，而不只是软件表价。
