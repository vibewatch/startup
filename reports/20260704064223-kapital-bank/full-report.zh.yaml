  - id: FR003
    title: 依赖地图
    type: dag
    layout: wide
    summary: Kapital 与决策相关的依赖现在横跨受监管银行基础设施、收购资产、创始人、投诉渠道和外部资本市场。
    data:
      nodes:
        - id: kapital
          label: Kapital 集团
          description: 核心运营和核保平台。
        - id: bank
          label: KPTL México Bank（银行实体）
          description: 受监管资产负债表、存款、贷款和资本。
        - id: intercam
          label: Intercam 资产
          description: 待整合的券商、资管和运营银行资产。
        - id: founders
          label: 创始人 / 高管梯队
          description: René Saúl 和 Fernando Sandoval 仍是核心公开运营者。
        - id: customers
          label: SME 客户
          description: 存款、投诉、还款和经营账户行为。
        - id: regulators
          label: CNBV / Condusef / 跨境监管机构
          description: 监管、消费者保护和审批边界。
        - id: capital
          label: Series C / 信贷投资人 / IPO 市场
          description: 外部融资和估值支撑。
        - id: macro
          label: Banxico / 墨西哥宏观背景
          description: 利率、增长和贸易不确定性。
      edges:
        - from: bank
          to: kapital
          label: 资本、流动性、贷款、存款
        - from: intercam
          to: kapital
          label: 整合和合规复杂度
        - from: founders
          to: kapital
          label: 执行和披露控制
        - from: customers
          to: bank
          label: 存款、投诉和信用表现
        - from: regulators
          to: bank
          label: 牌照和行为边界
        - from: regulators
          to: intercam
          label: 交易和 AML 审查
        - from: capital
          to: kapital
          label: 融资信心
        - from: macro
          to: customers
          label: SME 需求和还款
        - from: macro
          to: capital
          label: 估值条件
    approximationNotes: 该图强调公开承销依赖，而不是法律实体完整性。
