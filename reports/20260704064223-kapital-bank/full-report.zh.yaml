  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重程度
      - 缓解方式 / 尽调追问
    rows:
      - - 一个品牌覆盖信贷、银行卡、保理和账户全栈
        - 买家仍可拆开使用：银行运营账户、Clip 终端和 Conekta 线上收银可以与 Kapital 信贷并存
        - 高
        - 索取主账户渗透率、产品附着率，以及按附着产品数量划分的留存
      - - 信贷驱动的承保与营运资金相关性
        - Konfío 的 MXN5M 无担保信贷加银行牌照路径，会很快缩小战略差距
        - 高
        - 按票面规模、期限和账户所有权目标，验证相对 Konfío 的赢单 / 输单数据
      - - 商户运营工作流契合度
        - Clip 已把小型卖家的当日商户资金流转、终端和贷款组合在一起
        - 中-高
        - 衡量商户已用 Clip 做结算后，Kapital 在哪里赢、哪里输
      - - 墨西哥支付编排
        - Conekta 明确披露本地支付方式定价和性能主张，可能拉走线上收银导向买家
        - 中-高
        - 测试 Kapital 不依赖外部 PSP 时，能否匹配 SPEI / 现金 / 线上收银经济性
      - - 信任与监管信心
        - 完整银行和即将成为银行的挑战者，可以把 Kapital 定位成次要提供商
        - 高
        - 验证客户是否愿意把主要余额放在 Kapital，而不是传统银行
      - - 未来产品范围护城河
        - Adyen、Mercury、Brex 和 Lili 说明，财务软件可以多快围绕核心账户叠加银行卡、资金管理和应付账款（AP）
        - 中
        - 跟踪资金管理、应付账款（AP）控制和自助入驻的路线图速度，并与标杆栈深度比较
      - - 入驻后的客户惯性
        - 公开证据尚未证明采用后低流失或低多栖使用
        - 中-高
        - 索取总收入留存、净收入留存、流失原因，以及 6/12/24 个月后的钱包份额进展
