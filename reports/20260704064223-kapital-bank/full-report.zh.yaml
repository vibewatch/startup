      - number: '2.2'
        title: 受约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              这里给出单一总可用市场（TAM）数字会误导，因为相关市场会随企业数量、信贷可得性、支付数字化或跨境需求等视角改变。最宽的企业数量视角指向规模：墨西哥约 4.9 million 家中小企业、哥伦比亚 1.739
              million 家活跃企业、美国 5.58 million 家少于 500
              名员工的雇主企业。但这些宽口径数字会高估工作流驱动金融平台真正可触达的市场，因为许多企业太非正式、太依赖现金、数字化太轻，或单笔规模太小，启动期经济性不够有吸引力。

              第二个视角是金融可得性。在新兴市场，正式 MSME 融资缺口估计为 US$5.7 trillion；若纳入非正式企业，则升至 US$8 trillion。新兴市场中 70% 的 MSME
              仍缺乏足够融资，而拉丁美洲和加勒比地区在 2015-2019 年正式 MSME 金融供给甚至约每年收缩 4%。国家层面证据说明这为什么对 Kapital 重要。墨西哥方面，引用 CNBV 的 2026
              年本地报道显示，仅约 15% 中小企业能获得正式信贷，尽管 Plan México 推动 30% 可持续信贷可得性目标。哥伦比亚方面，2024 年 72.5% 法人实体至少有一种存款或信贷产品，但只有 26.7%
              有活跃信贷，微型企业的服务不足远甚于大型企业。美国对照市场融资更可得，但仍不是无摩擦：60% 雇主企业在过去 12 个月寻求融资，却只有 42% 拿到了所需全额。

              第三个视角是支付和数据就绪度。墨西哥移动银行采用率在 2024 年达到 69%，Banco de México 基础设施在 2025 年处理了超过 6 billion
              笔数字交易，但现金仍占主导，面向交易数据的开放银行规则也还没有完成。哥伦比亚在互操作轨道上看起来更先进：Bre-B 作为即时支付系统已经上线，前五个月处理了超过 500 million 笔交易，并有超过 100
              million 个支付键。区域支付数据同样重要，因为许多中小企业痛点与供应商和贸易相关，而不只是国内交易。Mastercard 和 PCMI 描述了一个 US$1.4 trillion
              的拉美跨境中小企业机会，但也显示一笔 US$250 转账平均费用可达 23.3%，部分走廊高达 30%。

              合并来看，证据支持的是受约束的规模判断，而不是激进 TAM
              叙事。实际可服务市场（SAM）是墨西哥和哥伦比亚正规中小企业中的一个子集，再加上部分与美国相关的走廊用户；这些企业已经运行在数字或半数字支付轨道上，并有经常性供应商、收款或营运资金工作流。公开来源无法分离可获取市场（SOM），因为
              Kapital 没有按地区和细分市场公开拆分实时客户数、支付量或信贷余额。
