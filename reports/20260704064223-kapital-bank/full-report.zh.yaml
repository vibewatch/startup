  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Kapital 核心风险通过少数共享通道传导：监管可信度、客户信任、融资信心和资产组合质量。
    data:
      nodes:
        - id: intercam
          label: Intercam 法律背景
          description: 围绕被收购资产的 FinCEN 行动，以及制裁时期出售背景。
        - id: governance
          label: 治理 / 披露缺口
          description: 公开材料里，董事会、委员会和控股公司风险披露都很薄。
        - id: data
          label: 数据安全 / 投诉事件
          description: Cybernews 泄露加官方投诉量。
        - id: credit
          label: 信用质量
          description: 贷款快速增长、高 CAT 产品和有限账龄披露。
        - id: macro
          label: 墨西哥宏观 / 利率背景
          description: 限制性政策和贸易不确定性。
        - id: trust
          label: 客户和监管信任
          description: 声誉、投诉和合规可信度。
        - id: funding
          label: 融资 / 市场准入
          description: Series C 后续推进、契约条款和 IPO 就绪度。
        - id: valuation
          label: 可投性 / 估值支撑
          description: Kapital 能否维持较低风险溢价。
      edges:
        - from: intercam
          to: trust
          label: 审批与 AML 审查
        - from: intercam
          to: funding
          label: 交易对手信心
        - from: governance
          to: funding
          label: 披露质量
        - from: governance
          to: valuation
          label: 风险溢价
        - from: data
          to: trust
          label: 客户信心
        - from: data
          to: governance
          label: 控制可信度
        - from: macro
          to: credit
          label: 需求 / 还款压力
        - from: credit
          to: funding
          label: 投资人信心
        - from: credit
          to: valuation
          label: 盈利质量
        - from: trust
          to: valuation
          label: 品牌与合规信号
        - from: funding
          to: valuation
          label: 轮次条款 / IPO 路径
    approximationNotes: 边展示方向性传导，不是实测弹性。
    claimRefs:
