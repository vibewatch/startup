      - number: '7.3'
        title: 运营、投诉处理和隐私 / 安全风险真实存在，不是假设
        blocks:
          - type: paragraph
            body: >-
              官方和反向证据都显示，Kapital 的运营风险不只是泛泛的金融科技噪音。Kapital 的 Buró de Entidades Financieras 披露报告 2025 年 310 起投诉、每 10,000
              份合同 6.3 起投诉的指数，以及 9.46 的用户服务评分。这不是危机信号，但足以显示当前规模下存在有意义的真实客户摩擦。公司还维护公开 Condusef
              帮助页面，这是有用缓释因素，因为它表明公司有正式消费者保护接口，而不是只靠应用内支持。


              更严重的运营信号来自 Cybernews 2024 年 12 月报道：一个归因于 Kapital 的云存储桶配置错误，暴露约 1.67 million 个文件，包括选民 ID
              和自拍照；该媒体称，在多次披露尝试后，发稿前没有收到公司回应。对处理身份验证的贷款机构和银行来说，这正是可能同时流向信任、行为和监管关注的事件。产品文件进一步表明，运营模型背后有不轻的控制义务：Crédito
              PyME 使用担保人、流动存款支持、佣金和逾期利率机制，Cuenta PyME
              则设置开户余额和低余额条件。因此，公开来源显示的是一套宽而活跃的操作系统，但还缺少事故复盘、投诉账龄数据、欺诈损失拆分或独立安全控制证据，无法证明风险已被完全控制。
