  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和制裁背景风险是最严重的一组
        blocks:
          - type: paragraph
            body: >-
              Kapital 不再只是高增长 SME 金融科技公司；它现在是一家受监管银行集团，而且在墨西哥和美国当局已经盯紧 AML 与跨境控制时，选择购买 Grupo Financiero Intercam
              的敏感资产。Kapital 自己 2025 年 8 月公告称，交易覆盖券商、资产管理和运营银行资产，并包括另外 US$100 million 运营投入。留存的 U.S. Federal Register
              记录把法律背景说得很清楚：FinCEN 在认定 Intercam Banco 因涉及非法阿片类药物流通而构成主要洗钱关切后，发布命令禁止涉及 Intercam Banco
              的特定资金传输。独立报道随后把出售本身描述为 Intercam 在美国财政部压力和制裁时代压力下推进的动作，而非干净的战略组合轮换。


              这不意味着 Kapital 自身在留存来源集中有公开执法记录；事实上，Buró 披露显示 2025 年零制裁。问题不同：Kapital
              主动走进高审查边界，却仍向市场提供相对单薄的公开治理界面。公司确实有公司治理和投资者关系页面，但留存公开材料仍没有展示合并的董事会委员会地图、可核对的股权结构表，或详细控股公司风险叙事。对于一家整合压力资产并讨论
              IPO 时间线的公司，这一披露缺口实质性提高法律、治理和审批风险。关键私有证据缺口是管理层关于 Intercam 交易的监管沟通包，包括先决条件、客户迁移控制和 AML 整改责任。
