      - number: '1.4'
        title: 里程碑、规模与整合
        blocks:
          - type: paragraph
            body: >
              Kapital 的里程碑曲线不只是融资，而是机构形态的转变。2022 年加入 Y Combinator、2023 年推出 Kapital Flex，说明公司当时仍像一家产品驱动的创业公司。2023 年收购
              Banco Autofin 随后成为阶跃事件，因为这一步把 Kapital 从软件主导的分发，带进了受监管银行基础设施。多篇收购报道对逻辑的描述相近：收购 Banco
              Autofin，保留其汽车金融渠道，再利用银行平台把产品集扩展到银行卡、自动化投资和更广泛的中小企业银行服务。

              2025 年 Intercam 交易是第二个转折点。公开报道显示，Kapital 进入了由美国对 Intercam 制裁引发的压力局面，随后同意收购经纪、资产管理和运营银行资产，并承诺再投入 $100
              million 用于运营和合规。这一步具有战略意义，因为它把 Kapital 从单一银行故事，推向更广泛的金融集团整合故事。它也解释了为什么后续信源谈到客户和资产规模时，数字远大于 2023 年创业公司阶段材料。

              到 2025 年末和 2026 年初，规模证据足以支撑后续章节。Series C 新闻稿、Reuters/Yahoo 及配套行业报道一致把客户触达放在 300,000，把资产负债表规模在 2025 年 9 月放在
              $3 billion。随后 Excélsior 和 El Cronista 显示，1Q26 资产为 MXN 71.9 billion，贷款为 MXN 26.6 billion，存款为 MXN 58.4
              billion，过去 12 个月净利润为 MXN 1.229 billion。与公司 2023 年画像相比，这些数字异常庞大，说明现在驱动公司概况的，是收购整合，而不只是有机 SaaS 增长。
