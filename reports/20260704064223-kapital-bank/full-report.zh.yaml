  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代集合
        blocks:
          - type: paragraph
            body: >
              Kapital 并不是在对抗单一同业群体。在墨西哥中小企业金融栈中，买方至少可以通过五种楔子完成同一件事：Konfío 这样的信贷主导金融科技公司，Clip 这样的商户运营栈，Conekta 或 Adyen
              这样的支付编排层，BBVA、Santander 或 Banorte 这样的全牌照传统银行，以及 Nu 这样未来可能延伸到企业银行的相邻消费者到银行品牌。Kapital
              自己的官方界面说明了这种重叠为什么重要：它在同一个品牌界面上销售企业信贷、公司卡、保理和商业账户，而不是单一用途产品。真正的竞争问题因此是，谁能成为中小企业的主运营账户，而不是谁能匹配某一个孤立功能。

              短期最强替代者，是已经拥有日常工作流的公司。Konfío 拥有信贷关系，并正试图增加存款和资金管理；Clip 拥有线下受理和商户当日结算；Conekta 拥有在线结账、SPEI 和现金收款轨道；BBVA 和
              Santander 拥有受监管存款账户和商户收单；Adyen 拥有面向更成熟商户的全渠道受理。Nu Mexico
              还不是公开的企业银行竞争者，但其持牌银行转型和规模仍重要，因为如果它日后进入中小企业产品，可能压缩获客经济性。这意味着，Kapital 需要防守的，不只是直接一对一替代，几乎同样重要的是拆分式多归属。
