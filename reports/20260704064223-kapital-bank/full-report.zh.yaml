  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 相比 Kapital 的限制
    rows:
      - - Kapital
        - 公司 / 集成式中小企业金融堆栈
        - 私营；公开网站覆盖信贷、卡、保理（factoraje）、账户、FX 和数字银行
        - 希望用一个关系覆盖资金和经营流程的墨西哥中小企业
        - 资金、卡、保理和账户界面打包收敛
        - 公开页面未披露实际定价或附着率指标
      - - Konfío
        - 直接同业 / 信贷主导金融科技
        - 2021 年独角兽画像；据 Legal Paradox，股权 >$380M，债务授信 >MXN7.4B
        - 需要无担保营运资金，并日益需要更广泛资金管理的中小企业
        - MXN5M 无担保信贷 + 卡和支付；明确的银行牌照扩张计划
        - 存款堆栈尚未上线；官方定价细节仍有限
      - - Clip
        - 直接同业 / 商户堆栈
        - 1M+ 应用下载、受监管钱包、终端和商户贷款报价
        - 需要银行卡受理和当日现金可视性的微型及小型商户
        - 把终端、受监管账户和基于报价的贷款打包，降低上手摩擦
        - 更广泛的资金管理和信贷深度仍弱于传统银行
      - - Conekta
        - 直接同业 / 线上支付基础设施
        - 处理 US$15B、428M 笔交易、8K+ 商户
        - 需要卡、SPEI、现金和结账编排的数字商户
        - 面向墨西哥的一次集成，定价明确覆盖中小企业，并优化本地支付方式
        - 对多数中小企业缺少贷款或经营账户切入口
      - - Adyen Mexico
        - 邻近赛道 / 企业支付平台
        - 全球平台，公布定价，线上 + POS 堆栈统一
        - 需要全渠道受理和跨境编排的商户
        - 一个平台同时支撑高转化、防欺诈和 POS 运营
        - 定位更偏高端，且没有中小企业信贷产品
      - - BBVA PyME
        - 传统银行
        - 全银行存款和收单基础设施；公布 TPV 费率和数字信贷条款
        - 优先考虑受监管账户、TPV 和关系银行服务的中小企业
        - 信任、公开费用和经营账户深度
        - 上手摩擦更高，数字信贷需先拿到报价
      - - Santander PyME
        - 传统银行
        - 全银行套装，PFAE 方案 MXN0 起，并配有 Getnet 终端工具
        - 希望账户、终端和网点支持服务打包的中小企业
        - 账户 + 终端 + 应用集成打包，并延伸到支付链接
        - 实际 MDR 公开细节少于 BBVA 或 Conekta
      - - Banorte PyME
        - 传统银行
        - 公司发布的表彰说明称，中小企业贷款份额 15%、存款份额 14%
        - 需要全国性银行资产负债表信任和融资可得性的中小企业
        - 规模、存款与被认可的中小企业客群
        - 本轮抓取中，当前官方自助式网页产品详情不稳定
      - - Nu Mexico
        - 相邻赛道 / 消费者优先的数字银行转型
        - 墨西哥约 14M 客户，计划到 2030 年投入 US$4.2B
        - 当前是消费者用户；未来可能延伸到中小企业
        - 低成本数字分发规模大，且正转向银行牌照
        - 目前没有公开的墨西哥商业银行产品页面
      - - Mercury
        - 美国标杆 / 软件驱动的商业银行
        - 300K+ 创业者，月交易量 US$20B+
        - 需要低费率账户、银行卡和自动化能力的初创公司与中小企业
        - 免费基础银行服务、1.5% 返现，并为财务软件设置分层定价
        - 未针对墨西哥本地化；没有本地支付轨道
      - - Brex
        - 美国标杆 / 支出 + 银行平台
        - 宣称覆盖 1/3 初创公司，资金管理收益率最高 3.68%，FDIC 保障最高 US$6M
        - 获风投注资、处于扩张期且支出 / 合规需求更高的公司
        - 高额度银行卡加资金管理、应付账款（AP）和全球控制
        - 未针对墨西哥本地化；经济模型绑定美国银行基础设施
      - - Lili
        - 美国标杆 / 小企业银行
        - 已服务 200K+ 企业；4.00% APY；US$3M FDIC 扫存保障
        - 寻求简单数字银行服务的小微企业和个体经营者
        - 低费率运营账户，嵌入信贷与支付
        - 只是美国标杆，不是墨西哥运营方
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles focus on the direct peers, incumbents, adjacents, and benchmark entrants most relevant to Mexico's SMB
        banking-credit-payments stack as of 2026-07-04; they are not an exhaustive list of all Mexican PSPs, neobanks,
        or non-bank lenders.
    notes: 规模信号混合了官方产品主张和独立报道。Banorte 一行依赖公司发布的中小企业认可数据，因为本轮抓取时官方自助式产品 URL 不稳定。
