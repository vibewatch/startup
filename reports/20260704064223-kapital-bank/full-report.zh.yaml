      - 来源类型
      - 解读
      - 仍未知的内容
    rows:
      - - Cuenta Empresarial
        - 无年费；无开户最低额；月均余额预期 MXN 5,000。
        - 官方 + 法律文件
        - 入门定价摩擦低，但经济性仍取决于余额和交叉销售。
        - 实际费用豁免、交易收入和关系盈利能力仍未披露。
      - - Cuenta PyME
        - 开户金额 MXN 5,000；若平均余额低于 MXN 2,500，收取 MXN 170 + IVA。
        - 官方 + 法律文件
        - 相比许多金融科技同行，给出了更明确的零售中小企业定价信号。
        - 单账户净收入、豁免频率和平均余额仍未披露。
      - - Banca Kapital 软件
        - MXN 1,199/月 + IVA。
        - 官方
        - 软件层列表价清楚。
        - 付费客户数、折扣和软件毛利率未公开。
      - - Crédito PyME（SME 信贷）
        - 3% 开户费；MXN 200,000、最高 36 个月的 CAT 示例为 58.3%；示例披露了保险费。
        - 官方 + 法律文件
        - 贷款经济性在公开视野中已经明显变现。
        - 按风险桶划分的实际 APR、审批率和扣除损失后的收益率未知。
      - - Crédito FLEX（供应商融资）
        - 年利率 30%；CAT 61.9%；示例披露放款费 / 提前还款罚金。
        - 官方
        - 供应商融资经济性看起来高收益，也高风险。
        - 平均提款规模、提款频率、违约率和净利差未公开。
      - - 保理
        - 披露了保理 CAT 示例和放款费；营销承诺发票可提前套现。
        - 官方
        - 保理是明确变现轨道，不只是营销相邻能力。
        - 预支率、回款期限和核心债务人集中度未公开。
      - - FX 转账
        - 仅有示例市场汇率；没有公开客户点差表。
        - 官方
        - Kapital 证明了能力，但没有证明实际 FX 定价。
        - 点差、最低费用、走廊经济性和资金对冲成本仍未披露。
      - - 银行卡 / 薪资
        - 未找到独立公开价格。
        - 官方
        - 最可能作为打包留存工具，或间接变现。
        - 交换费经济性、薪资费用和附着率均未披露。
    notes: 公开列表价在贷款和软件层最强。FX、银行卡和薪资只在功能层面有经济可见性。
    enumerationScope:
