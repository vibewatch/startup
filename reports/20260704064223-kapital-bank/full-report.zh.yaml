      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的采用驱动因素并不完全来自公司本身，而是来自运营环境的结构性改善。墨西哥公共政策组合正试图同时推动信贷深度和数字使用。Plan México 目标包括 30% 可持续中小企业信贷可得性、MX$4
              billion 首贷基金，以及更紧密的银行-金融科技合作。Banco de México 2026 年关于新账户层级的咨询，明确被定位为扩大普惠和数字支付使用的方式。哥伦比亚的驱动因素更偏监管：2026 年第
              0368 号法令把国家从自愿开放金融路径，推向受监管实体的强制开放金融；Superfinanciera 必须在六个月内定义标准化时间表。哥伦比亚还已有可运行的互操作轨道
              Bre-B，它能产生交易数据尾气，支撑收款、供应商付款，并最终改善承保。

              商业驱动因素同样强。拉美中小企业与供应商网络和跨境流动深度绑定：每 5 家中已有 3 家与国际供应商合作，墨西哥、巴西等市场中 75% 受访中小企业计划扩大全球合作关系。因此，支付摩擦就是中小企业税。如果发送
              US$250 平均可吃掉 23.3% 费用，部分情况下高达 30%，任何能降低结算成本、延迟或不透明度的产品，都能获得运营金融角色，而不是狭窄的支付角色。

              约束同样重要。第一，2018
              年金融科技法实施八年后，墨西哥开放银行制度仍未完成：开放数据规则已经存在，但具约束力的交易数据、同意和认证层仍不存在。这会拖慢承保自动化，并迫使公司做定制集成。第二，信任和安全仍是现实采用障碍。墨西哥约 80%
              交易仍用现金完成，30%
              人口表示担心数字安全。第三，数字轨道改善并不等于信贷缺口已被解决。哥伦比亚公司数据表明，基础产品可得性与活跃信贷使用之间差距很大，微型企业尤其明显。第四，美国对照提醒，不能假设数字渠道会自动带来更好的借款人经济性：2026
              年 4 月 SLOOS 报告称 C&I 贷款标准收紧，SBCS 中 60% 线上贷款借款人表示实际借款成本高于预期。

              因此，反向解读很清楚：市场庞大且结构性服务不足，但信任、监管和切换摩擦会拖慢变现。Kapital
              与估值相关的机会，在支付、承保和工作流自动化相互强化时最强；当产品必须一次只打一个用例，去对抗现金习惯、不完整数据轨道或借款人不信任时最弱。
