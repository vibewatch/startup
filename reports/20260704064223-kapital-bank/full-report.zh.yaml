  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 类型
      - 什么会改变判断
    rows:
      - - Kapital 已有真实的受监管银行证据：资产、存款、贷款、资本和季度盈利能力均已公开披露。
        - 投资逻辑
        - 如果控股公司经济性与银行层面盈利能力明显背离，这一支柱会削弱。
      - - 2026 年银行业绩公布前，公司已经声称达到 300,000 客户和 US$3B 资产负债表规模，显示出有意义的规模。
        - 投资逻辑
        - 客户质量、使用率或资产质量若明显恶化，会削弱规模叙事。
      - - 如果承销和留存更优，掌握更多受监管栈可能支撑高于大众市场数字银行的客户价值。
        - 投资逻辑
        - 证据若显示中小企业客户大量多平台使用，或交叉销售偏弱，会压低溢价情形。
      - - 公开证据仍缺合并收入运行率或 ARR，因此软件式定价支撑偏弱。
        - 反向逻辑
        - 披露合并收入桥和产品结构会直接增强估值支撑。
      - - 完全摊薄股数、优先股堆叠和 Series C 轮清算条款均未公开。
        - 反向逻辑
        - 清晰的股权结构表和优先权瀑布披露会收窄回报不确定性。
      - - 如果执行滑坡，Intercam 整合和制裁相邻的合规工作可能毁掉价值。
        - 反向逻辑
        - 清晰的整合 KPI、稳定资产质量和监管舒适度会缓和折价。
      - - Cybernews 曝光削弱了其天然享有 AI 或基础设施溢价的说法。
        - 反向逻辑
        - 独立证据若证明控制已整改且没有复发事件，会降低这一风险。
    notes: 这些行旨在说明哪些事实支撑叙事，哪些缺失事实仍使披露的 2025 轮价格下无法给出买入判断。
