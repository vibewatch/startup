  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价融资或结构化过桥
        - 新融资低于 US$1.3B 估值标记，或附带惩罚性条款
        - 表明上一轮估值撑不住，并抬高优先股堆叠风险
        - 在厘清新分配瀑布前，从观察下调至回避
      - - Intercam 整合延误
        - 收购资产引发监管、AML/KYC 或客户迁移问题
        - 打破其成为更广义金融集团的溢价逻辑
        - 暂停投资测算，重切悲观情景
      - - 资产质量恶化
        - 资本、流动性或信贷指标较 1Q26 银行基线明显恶化
        - 抽掉支撑该轮估值的主要公开盈利锚
        - 视为重大估值重置信号
      - - 安全 / 数据控制失守
        - 2024 年泄露后再次出现高严重性事件
        - 同时削弱 AI 溢价和合规叙事
        - 提高折现率，并要求第三方控制审计
      - - IPO 就绪证据未出现
        - 虽有 IPO 口径，收入、股权结构表或治理披露仍无进展
        - IPO 叙事变成营销口号，而不是退出路径
        - 维持观察 / 继续研究，不上调
    notes: 这些触发因素都设计成可由公开证据或尽调渠道证据监测，而不是泛泛的宏观担忧。
    claimRefs:
      - CV008
      - CV011
      - CV012
      - CV036
      - CV044
      - CV048
  - id: TV006
    title: 最终尽调资料请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合并收入 / ARR
        - 现存公开来源未披露集团收入运行率、ARR 或产品层级结构
        - 没有这项证据，软件式或混合金融科技倍数站不住
        - 管理层数据室；经审计或董事会层级 KPI 包
      - - 完全稀释后股权结构表
        - 未公开股数、期权池、可转证券或 Series C 后股权分布
        - 无法建模回报和稀释
        - 财务团队导出的股权结构表，加律师确认的股份类别
      - - Series C 条款
        - US$1.3B 轮次未披露清算优先权、反稀释或参与权细节
        - 优先权悬挂可能吃掉表面入场上行空间
        - 领投方附函或融资文件
      - - Intercam 整合 KPI
        - 客户迁移、合规整改或网点 / 资产表现没有公开时间表
        - 这是平台上行情景的主要摆动因素
        - 与风险和运营负责人复盘整合工作流
      - - 按年份分层的资产质量
        - 未公开不良贷款（NPL）、准备金或核销在收购资产簿与自营资产簿之间的桥接
        - 投资者无法判断报告盈利是否可持续
        - 信贷委员会材料和年份分层表
      - - 控股公司现金转化
        - 受监管银行盈利到集团现金生成及可用上游分红之间没有公开桥接
        - 银行盈利不自动等于有吸引力的股权自由现金流
        - 关于上游分红限制和公司间结构的资金 / 法务备忘录
    notes: 前三项资料请求是精确估值的阻塞项；后三项决定 Kapital 更应接近银行估值、软件驱动金融科技估值， 还是混合折价。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV038
      - CV045
      - CV049
