      - number: '4.3'
        title: 资本充足率与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Kapital 的公开记录提供的资产负债表证据，多于大多数私营金融科技公司；但证据被分割在受监管墨西哥银行实体和控股公司层面的融资公告之间。在受监管实体一侧，当前画面稳健：KPTL México Bank 在
              1Q26 报告现金及等价物 MXN 22,233 million、资本比率 13.52 percent、流动性覆盖系数 407、净资本 MXN 5,289 million。存款环比继续增长，该实体产生季度净利润
              MXN 533 million。HR Ratings 也在 2026 年 3 月给出 Stable 展望和 HR A+ 评级。在控股公司一侧，主要公开信号是 2025 年 9 月最高 $100
              million、估值 $1.3 billion 的 Series C；管理层和多家新闻媒体称，这笔资本将加速 AI
              驱动生态系统建设。新增资本降低了显性的近期融资压力，但没有闭合核心尽调回路。公开来源仍未披露合并集团现金、烧钱速度、现金跑道、契约余量，或非墨西哥业务的资本强度。它们也没有显示集团增长有多大程度依赖后续收购、表外承诺或信贷扩张。财务上，正确解读是墨西哥银行看起来有融资能力且流动性充足，但集团的下一轮融资依赖无法仅凭公开证据量化。
