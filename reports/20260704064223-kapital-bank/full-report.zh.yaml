  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 指标 / 估值 / 状态
      - 参考价值
      - 主要局限
    rows:
      - - Kapital
        - 标的公司 / 私募轮次
        - US$1.3B 2025 年 9 月估值；300k 客户；US$3B 资产负债表规模声称
        - 本章直接价格锚
        - 没有合并收入、ARR 或优先股堆叠披露
      - - Nu Holdings
        - 上市拉美数字银行
        - US$61.79B 市值；135M 客户；US$871M Q1 净利润
        - 盈利能力和客户货币化上，最好的大型拉美零售金融科技基准
        - 零售占比高，按客户比较时不如中小企业银行业务有区分度
      - - MercadoLibre / Mercado Pago
        - 上市拉美商业-金融科技生态
        - US$82.89B 市值；Mercado Pago US$4.0B Q1 收入；83M 金融科技 MAU
        - 展示拉美高溢价生态经济性可以支撑什么估值
        - 商业飞轮和规模远超 Kapital 范围
      - - StoneCo
        - 上市中小企业支付 / 银行 / 信贷平台
        - US$2.57B 市值；Q1 2026 业绩围绕支付、银行和信贷展开
        - 比零售数字银行更接近中小企业运营金融工作流
        - 当前公开材料在清晰盈利背景上不如 Nu 或 SoFi 充分
      - - PagBank
        - 上市支付-银行混合体
        - US$2.46B 市值；R$575M Q1 非 GAAP 净利润；信贷账簿同比 +36%
        - 对拉美支付 + 银行 + 信贷捆绑经济性有参考价值
        - 巴西零售 / 商户组合不是干净的墨西哥中小企业类比
      - - SoFi
        - 上市数字银行 / 贷款平台
        - US$22.97B 市值；US$1.1B Q1 收入；US$167M 净利润；US$40.2B 存款
        - 可作为公开市场为多元数字银行盈利支付多少估值的基准
        - 美国消费者组合和资金基础与 Kapital 明显不同
      - - LendingClub
        - 上市数字银行 / 贷款机构
        - US$2.21B 市值；US$252.3M Q1 收入；US$10.2B 存款；US$67.3M 税前收入
        - 对盈利但更窄的数字银行模型，是有用的下行情景基准
        - 消费者贷款和美国监管限制直接可比性
      - - Ualá
        - 私募拉美数字银行轮次
        - 2026 年 3 月投后估值 US$3.2B；11M+ 客户
        - 近期最佳拉美全栈私募数字银行轮次
        - 客户群是大众市场零售，不是中小企业主导
      - - Mercury
        - 私募美国中小企业银行金融科技轮次
        - 2026 年 5 月估值 US$5.2B；US$650M 年化收入；300k 客户
        - 在客户价值和盈利能力框架上，最相关的私募中小企业银行可比对象
        - 美国创业公司银行业务组合和估值环境不同于墨西哥
      - - Clara
        - 拉美私营 B2B 支出 / 支付平台
        - Tracxn 显示估值约 US$1.0B；累计融资 US$204M；Dec-2025 完成 US$70M 债务轮
        - Kapital 当前估值标记之下、最接近的拉美 B2B 金融科技估值锚
        - 估值基于二手数据，可能滞后于实时私募市场
    notes: 没有一个单一可比对象能定出 Kapital 的价值。上市可比公司规模更大、指标更干净，私营可比公司模式更接近， 但透明指标弱得多。应把这组样本当作三角测量框架，而不是公式。
    enumerationScope:
