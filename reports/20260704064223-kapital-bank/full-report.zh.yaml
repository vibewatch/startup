      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Kapital
              的公开财务案例强于典型私营金融科技公司，因为它披露了真实银行产品定价和真实持牌银行备案，而不只是增长营销。这是正面。负面是，公开记录仍没有展示股权承保真正需要的合并经济性。投资人能看到公司有多条变现轨道，受监管银行具备真实规模、流动性、盈利能力和可接受的信贷指标；但看不到哪些轨道真正产生耐久且高质量的收益，软件是否实质性分散了贷款模型风险，以及更大集团为了继续扩张烧掉多少现金。这个缺口重要，因为管理层的盈利声明、$3
              billion 资产负债表声明和 300,000 客户声明，与收入流组合、实际价差、产品层面逾期和控股公司现金跑道等未解问题并存。投诉记录并不令人警惕，但也不是零风险：Buró 披露 2025 年记录了 310
              起投诉，独立报道仍强调，信贷投资人关心契约和现金流压力情景。因此，正确的财务判断是建设性但有条件：Kapital
              看起来已经搭出真实的银行加软件收入引擎，但在投资人能有把握承保收入质量、利润率耐久度和融资独立性之前，案例仍依赖私下证据。
