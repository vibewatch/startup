      - number: '8.4'
        title: 退出准备度、打破投资逻辑的触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              退出准备度在改善，但还没有干净到可直接过投资委员会。独角兽轮、受监管银行披露层和更广金融集团雄心叠在一起，意味着内部预期正从私有增长融资转向公开市场资格。问题是，2026
              年市场选择性很强，并不宽容。Eqvista 的后期市场备忘明确指出，IPO 窗口奖励准备度，惩罚陈旧私有标记，并迫使没有治理和披露准备度的公司走双轨或过桥融资安排。Kapital 可能比许多金融科技公司更能讲
              IPO 故事，因为它有受监管银行文件和可见盈利能力，但公开记录在合并经济性和股东结构上仍显得过薄。


              打破投资逻辑的触发点可衡量。低于 US$1.3 billion 标记的降价轮或结构化过桥融资会表明上一轮站不住。Intercam
              出现整合或合规滑坡，会削弱成为更广金融集团的溢价案例。银行资本、流动性或资产质量恶化也重要，因为银行是支撑今日估值的主要公开锚点。任何新安全事件都会直接削弱 Kapital 应享受 AI
              或基础设施驱动估值溢价的说法。


              最终尽调应少看又一份营销材料，多盯缺失的承销机制。最高优先级问题是合并收入和 ARR、完全稀释股权结构表、Series C 优先权和清算瀑布、并购浪潮后 cohort
              级信贷和存款质量，以及盈利的受监管银行层确实能转化为控股公司现金生成的明确证据。这些项目才能把一个可解释的价格变成有吸引力的入场。
