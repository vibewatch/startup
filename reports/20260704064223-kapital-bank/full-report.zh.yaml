      - number: '5.2'
        title: 承保、运营与运营架构
        blocks:
          - type: paragraph
            body: >
              Kapital 的公开架构偏运营型，而不是深度技术型，但各个部件已经足够拼出这套栈如何运转。渠道层，客户通过 Cuenta PyME 或 Cuenta Empresarial 开户、Banca
              Empresarial、Banca en línea，以及至少三个可见移动应用入口接入系统。控制层，Banca en línea 要求客户号加 token 或 softtoken 激活，官方页面也列明 SPEI
              的不同处理窗口和渠道费用逻辑。工作流层，Banca Empresarial 把账户、预约付款、供应商发票、薪资登记、预测和卡资金管理集中起来。授信层，Crédito PyME 要求最近三个月银行流水、SAT
              状态文件、只读 CIEC 访问、受益所有人身份证明和公司章程信息；FAQ 还披露担保人和流动抵押品预期。公开费用显示，这不是轻量嵌入式信贷：Crédito PyME、FLEX
              和保理都在官方费用手册中公布开户或提款费用、CAT 示例和提前还款逻辑。集团层架构同样重要。Moody's 描述了 2025 年 9 月 Intercam 资产、人员和运营平台并入 Kapital
              银行与券商版图的过程；其 2026 年 3 月公开报告称，各实体高度整合并协调一致，但仍处在过渡期。因此，Kapital 的架构差异化来自受监管银行深度和工作流宽度；但由于公司不公布 API
              界面、系统图、可用性历史或详细 AI 落地说明，架构仍有一部分不透明。
