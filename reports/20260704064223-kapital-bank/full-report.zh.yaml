  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >
              Kapital 的可投资逻辑强于普通后期私有金融科技公司，因为这家公司现在在创投叙事之下有真实受监管银行披露。留存证据显示：2025 年 9 月 Series C 最高 US$100 million、估值
              US$1.3 billion，客户触达 300,000，资产负债表口径 US$3 billion，以及 1Q26 墨西哥银行文件中的 MXN 71.946 billion 资产、MXN 58.421
              billion 存款、MXN 25.786 billion 净贷款和 MXN 533 million 季度净利润。这个组合重要：不同于许多私有数字银行，Kapital
              能指向已披露的资产负债表规模、盈利能力和监管资本，而不只是收入宣称和用户增长。


              反向逻辑是，投资人仍无法把这些银行层指标桥接到 US$1.3 billion 轮融资实际定价的合并权益故事。公开来源没有披露合并收入运行率或 ARR、完全稀释股数、Series C
              后所有权地图，或创投栈中的任何清算优先权和优先权悬挂。Intercam 交易还引入整合和合规风险，2024 年 12 月 Cybernews 暴露事件削弱了 Kapital 仅因拥有更多受监管栈而应享受 AI
              或基础设施溢价的说法。


              因此，正确结论对价格敏感，而不是对公司质量敏感。Kapital
              看起来像一个真实金融平台，运营证据足以支持继续尽调，但披露不足以支持按最近披露轮价格买入。建议是以中等信心观察，风险评级高，估值立场合理。更便宜的入场价格，或一套补齐
              ARR、股权结构表和优先股堆叠缺口的新披露包，比又一条泛泛增长新闻更能改变判断。
