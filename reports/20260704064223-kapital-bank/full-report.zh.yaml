  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 信号
      - 当前公开状态
      - 范围
      - 重要性
      - 缺口或担忧
    rows:
      - - CNBV 监管的银行实体
        - 官方页面明确声称，第三方评测报道也呼应
        - KPTL México Bank 和集团金融运营
        - 受监管银行身份是信任、产品许可和投诉处理的基础
        - 公开产品页面仍未以技术细节解释运营控制架构
      - - 适用产品的 IPAB 保护
        - 官方页面和第三方评测报道提到适用产品最高 400,000 UDIS 保护
        - 适用银行余额的存款产品信任
        - 相对无牌金融科技界面的重要差异化
        - 覆盖取决于产品和法律结构，不是生态内每项服务都覆盖
      - - CONDUSEF 和澄清渠道
        - 官方页面公布投诉电话、邮箱、网点和监管升级路径
        - 客户支持和争议解决
        - 比泛泛的仅聊天机器人支持说法更强
        - 没有公开 SLA、工单解决指标或支持满意度数据
      - - Token / softtoken 控制
        - Banca en línea 要求激活 token 或 softtoken，并说明恢复路径
        - 网页银行认证和付款控制
        - 显示敏感操作有明确控制设计
        - 公开应用评论出现 token 摩擦，且未披露欺诈率指标
      - - 移动应用数据安全披露
        - 应用商店页面按应用披露更新节奏、收集 / 共享做法和加密姿态
        - 移动渠道隐私和安全透明度
        - 可作为软件运营成熟度的外部信号
        - 不同应用界面披露不一致，说明渠道治理可能碎片化
      - - 安全反向事件记录
        - Cybernews 记录了一起 2024 年暴露 ID 和自拍照的存储桶，并建议整改措施
        - 身份验证数据和隐私运营
        - KYC 文件是 Kapital 开户和承销工作流核心，因此这件事重要
        - 本轮未找到保留的公开事后复盘或整改披露
      - - 评级机构控制评价
        - Moody's 和 HR Ratings 对资本化、风险管理和整合持正面态度，但仍提到转型风险
        - 集团级财务和运营控制
        - 独立外部视角证明受监管栈真实存在
        - 评级不能替代产品可靠性或隐私控制证据
    notes: 信任证据在监管和资产负债表层最强；软件运营质量证据明显薄得多。
