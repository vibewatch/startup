      - number: '8.2'
        title: 融资背景、价格支撑与入场纪律
        blocks:
          - type: paragraph
            body: >
              当前融资背景异常混合。正面看，Kapital 进入 2025 年末时拥有新鲜 Series C、管理层盈利声明、老投资人继续支持，以及独立报道确认公司已经远超纯创业公司阶段。1Q26 银行文件和 HR
              Ratings 更新通过显示受监管银行层可用资本、流动性和盈利支撑，进一步强化了这一画面。这些事实意味着 US$1.3 billion 标记不是随意的叙事价格；公开证据至少能解释为什么投资人愿意支付它。


              但同一证据也说明，公开材料对价格的支撑并不完整。Kapital 留存公开披露中仍没有合并收入运行率或
              ARR、没有完全稀释股权结构表、没有清算瀑布，也没有清楚解释经济价值有多少在受监管银行里、有多少在更广集团里。这让软件式估值方法脆弱，也让简单每股回报测算带有猜测。Finro 的 Q1 2026
              数据集提醒得很有用：金融科技可比公司工作现在需要按阶段和细分赛道保持纪律，支付和转账中位数远低于周期高点的私有市场标记，2026 年投资人也越来越会用公开市场现实压力测试私有轮。Eqvista 的 2026
              后期市场备忘也指向同一方向，认为如果没有治理和指标准备度，公开投资人不再接受 2022 式定价。


              入场纪律因此必须写清楚。投资人不应只为 AI
              溢价叙事买单。一个有纪律的入场，要么价格低于上一轮，要么证明包高于市场目前掌握的材料。实践中，这意味着在上调判断前要求三类催化剂之一：披露合并收入和产品组合，提供完全稀释股权结构表与 Series C
              条款桥，或持续证明 Intercam 整合在不拖累合规或资产质量的情况下创造费用和存款上行。此之前，最近披露轮应被视为大体可辩护，但不明显便宜。
