  topStrengths:
    - 持有受监管银行加上工作流软件，让 Kapital 的基础设施壁垒比许多仍依赖第三方底层通道的 LatAm SMB 金融科技同行更完整。
    - 公开的 1Q26 银行指标显示真实存款、贷款、资本、流动性和盈利，而不是单纯增长叙事。
    - Tribe Capital、Pelion Ventures、Y Combinator 等风险投资人持续加码，证明 Kapital 仍能拿到增长资本。
    - Mexico 及更广的 LatAm SMB 银行市场在信贷、运营软件和数字财资上渗透率仍低，结构性需求有支撑。
  topRisks:
    - 合并收入、ARR、股权结构和优先权栈披露仍太薄，难以给出有把握的后期入场价格。
    - 美国对卖方采取反洗钱行动之后，Intercam 交易把合规、整合和声誉风险一并带了进来。
    - 据称 2024 年发生的数据暴露事件，削弱了这家受监管、身份数据密集型贷款机构的信任与控制叙事。
    - SME 信贷增长很快，产品又重担保人，公开 vintage 数据有限，承保和催收质量仍未充分跑出来。
  unresolvedGaps:
    - 合并收入、ARR、收入流组合，以及控股公司消耗或 runway，在保留的公开来源中仍未披露。
    - 完全摊薄股权结构、Series C 清算优先权，以及更广的优先权悬挂，公开渠道仍不可得。
    - 公开证据没有给出 2025-2026 年信贷 vintage、欺诈拆分、催收曲线或产品层面的损失表现。
    - 董事会委员会结构、当前所有权图谱和监督细节，在公开治理材料中仍有一部分拿不到。
    - Intercam 整合 KPI、客户重叠度，以及收购后资产质量影响，目前还无法用公开信息衡量。
