summary:
  headline: Kapital 看起来确实是全栈 SMB 银行平台，既有受监管银行的盈利能力，也有规模；但公开证据仍没给出合并收入、股权结构和优先权栈细节，无法激进承接 2025 年 9 月的独角兽价格。
