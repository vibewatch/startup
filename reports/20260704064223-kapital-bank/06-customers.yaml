- id: SECU03
  title: Named customer proof exists across Mexico and Colombia, but most evidence is curated rather than independently quantified
  body: |-
    Kapital clears the basic named-customer-proof bar. The company’s case-study surfaces explicitly feature Day Store, Commando, and Makora in Mexico, while Kapital Colombia publishes quotes from Todos Comemos and Yoyoso. Importantly, the proof quality is not uniform. Commando is the strongest Mexican reference because the dedicated case-study page includes concrete operating details—more than 16 studios, more than 600 staff and coaches, Spain expansion, and a direct CEO quote describing Kapital as responsive when needed. Day Store and Makora are weaker but still useful because the success-story category page ties them to Kapital and their own official websites demonstrate that they are live operating businesses rather than logo wallpaper. DayStore’s site claims 100-plus warehouses, 1,200-plus clients, and 24/7 operations; Makora’s site claims more than 78,000 households served.

    Kapital Colombia adds fresher, more explicit testimonial proof. Its homepage names Todos Comemos and Yoyoso, attributes CEO quotes to each, and frames Kapital as a strategic ally rather than a commodity banking vendor. The customers’ own sites corroborate that both are real operating businesses with identifiable commercial footprints. That is enough to support a production-maturity reading: Kapital is serving live businesses in logistics, furniture/DTC, fitness, food distribution, and consumer retail. But the evidence still falls short of institutional-grade customer diligence. The public record does not reveal contract sizes, product mix by customer, implementation timelines, renewal history, or measurable outcomes like deposit growth, loan utilization, or software-seat expansion. So named customer proof is present, yet mostly company-curated and outcome-light.
