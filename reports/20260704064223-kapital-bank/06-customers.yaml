- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - What public evidence says
  - Impact
  - Diligence path
  rows:
  - - Land-and-expand through workflow bundling
    - Official pages combine accounts, treasury, payroll, supplier management, FX, and credit
    - Strong expansion lever if more customers use multiple modules over time
    - Request product attach-rate cohorts and revenue-per-customer expansion by vintage.
  - - Cross-border treasury adjacency
    - FX page serves businesses moving supplier or revenue flows across multiple currencies
    - Adds sticky treasury revenue and higher-value enterprise use cases
    - Request active FX customers, monthly volumes, and renewal or retention by corridor.
  - - Geographic expansion beyond Mexico
    - Kapital Colombia claims 1,300+ companies served and named testimonials from local customers
    - Shows the playbook can travel internationally
    - Request country-by-country active customers, CAC, losses, and product mix.
  - - Definition risk in customer counts
    - Public milestones mix SMB customers, acquired bank customers, and broad client labels
    - Can overstate comparable organic growth if investors read all counts as the same cohort
    - Request a reconciled bridge from 80k SMBs to 300k customers by segment and acquisition source.
  - - Service-quality drag
    - App-store reviews and Finantres commentary flag UX friction, token issues, and fee sensitivity
    - Could weaken retention or cross-sell if support does not scale with growth
    - Request monthly complaint trend, app crash rate, and ticket-resolution outcomes.
  - - Customer concentration opacity
    - 1Q26 report discloses two clients or groups with exposures above 10% of Tier 1 capital and says the bank wants to diversify
    - Suggests concentration is material enough to manage, even if full revenue or deposit concentration is undisclosed
    - Request top-10 customer, depositor, and borrower concentration across revenue, balances, and losses.
  notes: The main customer risk is not lack of growth proof; it is that public disclosures stop short of showing whether growth is diversified, durable, and increasingly monetized across the installed base.
