- id: SECU02
  title: Adoption trajectory is real, but public counts mix organic SMBs, acquired bank customers, and broad client labels
  body: |-
    Public adoption evidence is sufficient to show meaningful customer scale, but not clean enough to produce one investor-grade active-customer denominator. TechCrunch said Kapital had 80,000 small-business customers across Mexico, Colombia, and Peru in 2023 and separately acquired Banco Autofin, which already had 65,000 customers. Milenio then reported more than 100,000 clients by 2Q24. By the 2025 unicorn round, PR Newswire and Pulse 2 both said Kapital had reached 300,000 customers across the United States, Mexico, and Colombia, while Reuters independently confirmed the Mexico-and-Colombia operating footprint. In Colombia, Kapital’s own site adds a narrower but more operational metric: more than 1,300 Colombian companies served and more than USD 86 million disbursed.

    Those disclosures matter, but they are not apples-to-apples. Some refer specifically to SMB customers, some to all clients, some appear to include acquired bank relationships, and some describe country-specific operating companies rather than the consolidated group. That makes the adoption trajectory useful for proving growth and geographic expansion, but weak for underwriting retention or active-wallet-share quality. The official product surfaces reinforce that interpretation. Cuenta PyME promises opening in under 48 hours, Crédito PyME requires one year of operating history and positions itself for working capital, supplier payments, or expansion, and Banca Empresarial is built around recurring workflows such as payroll, payables, and financial planning. Together, those pages imply real production usage by operating businesses. They do not reveal how many of the 300,000 customers are active software users, active depositors, recurring borrowers, acquired legacy accounts, or low-frequency retail relationships.
