  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: definition-gap
    missingEvidence: A reconciled active-customer bridge that separates organic SMB customers, acquired bank clients, retail or payroll users, dormant accounts, and country-level subsidiaries.
    whyItMatters: Without one denominator, growth milestones can overstate comparable adoption and make retention or monetization analysis unreliable.
    diligencePath: Ask management for a quarterly customer-definition bridge from 2023 through 2026, split by country, segment, and acquisition source.
    relatedQuestionRefs:
    - QU007
    - QU026
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: GRR, NRR, logo retention, account retention, borrower repeat-rate, and expansion revenue by customer cohort.
    whyItMatters: Public growth proof is much stronger than durability proof, so underwriting customer lifetime value or SaaS-like stickiness is impossible from public sources alone.
    diligencePath: Request cohort tables for deposits, software usage, credit utilization, and logo retention by annual or quarterly vintage.
    relatedQuestionRefs:
    - QU018
    - QU027
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer, depositor, borrower, and channel concentration across revenue, balances, and credit exposure.
    whyItMatters: The 1Q26 report proves concentration is material enough to monitor, but it does not quantify the share of economics tied to top relationships.
    diligencePath: Ask for customer concentration schedules and internal concentration limits by product line and geography.
    relatedQuestionRefs:
    - QU024
    - QU028
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: named-customer-proof
    missingEvidence: Referenceable case studies with product mix, start date, implementation scope, and measurable business outcomes for named customers.
    whyItMatters: Current named proof demonstrates existence, but not the size, depth, or repeatability of Kapital's best customer relationships.
    diligencePath: Request customer-reference calls, contract start dates, and KPI snapshots for at least five current customers across Mexico and Colombia.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU017
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: consumer-adjacent-usage
    missingEvidence: Readable official pages for some retail or personal Kapital surfaces that were blocked or incomplete during public fetches.
    whyItMatters: Consumer-adjacent usage is clearly present, but blocked or thin pages make it harder to verify the scope of personal and payroll-led customer segments.
    diligencePath: Repeat fetches on protected retail pages or request a current customer-segment presentation from management.
    relatedQuestionRefs:
    - QU004
    relatedTableRefs:
    - TU001
    - TU006
