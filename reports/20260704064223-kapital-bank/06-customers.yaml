- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Micro and small businesses (PyME / PFAE)
    - Owner-manager is often buyer and payer; finance or admin staff are daily users
    - Business account, basic treasury, payments, payroll, and working-capital access
    - Cuenta PyME, Crédito PyME, Milenio niche statement, and Mexico Business News SME-only positioning
    - Core acquisition wedge and likely highest-volume prospect pool
    - No public customer-count split by micro, small, or medium business size.
  - - Mid-market and larger enterprises
    - Legal entity buys; treasury and finance teams use; employees may execute workflows
    - Cuenta Empresarial, FX, supplier payments, analytics, payroll, and online banking
    - Cuenta Empresarial, Banca Empresarial, Banca en Línea, and FX pages show enterprise treasury workflows
    - Higher balances, more cross-sell surfaces, and better treasury monetization potential
    - No public disclosure of enterprise share, ARPA, or segment retention.
  - - Cross-border businesses
    - Finance teams buy and use; company pays fees and spreads
    - Multi-currency transfers, supplier payments, and inbound foreign receipts
    - FX page supports USD, EUR, GBP, CAD, and JPY operations from Mexico
    - Adds fee income and embeds Kapital into global supplier flows
    - No public volumes, active-customer count, or cross-border take rate.
  - - Colombian SMEs
    - Business owner buys; ops and finance teams use; company pays
    - Factoring, credit, debit, payroll, and all-in-one platform workflows
    - Kapital Colombia says 1,300+ companies served and USD 86M+ disbursed
    - Proves the model travels beyond Mexico and widens TAM
    - No country-level churn, cohort, or revenue split is public.
  - - Consumer / employee-adjacent users
    - Individual is user; employer or bank relationship may drive access
    - Payroll, mobile banking, personal transfers, auto/personal loans, and legacy consumer banking
    - Banca en Línea covers people; Q1 bank report lists consumer portfolios alongside business books
    - Creates deposit and wallet-share adjacency around SMB relationships
    - Public materials do not cleanly separate core SMB users from retail or legacy customers.
  - - Named proof customers
    - Business customer buys; leadership and ops teams use
    - Growth financing, treasury, or strategic banking partnership
    - Commando, Day Store, Makora, Todos Comemos, and Yoyoso are publicly named
    - Best available proof that Kapital is serving real operating companies across sectors
    - Named proof is curated and rarely discloses contract size, tenure, or measured ROI.
  notes: Segmentation is strongest by business size, workflow, and geography because Kapital discloses product surfaces and customer stories more clearly than exact cohort counts.
