- id: credit-funding-and-macro-risk
  title: Credit, funding, and macro risk are elevated even though current solvency signals look solid
  body: |-
    The most important financial-model risk is not whether Kapital can quote credit products or show balance-sheet growth; it plainly can. The 1Q26 bank filing shows MXN 71.9 billion of assets, MXN 58.4 billion of deposits, MXN 25.8 billion of net loans, MXN 5.7 billion of equity, a 13.52% capital ratio, 407 liquidity-coverage coefficient, MXN 5.289 billion of net capital, and MXN 4.83 billion of off-balance-sheet credit commitments. Excélsior also highlighted a 2.8% non-performing-loan ratio and a roughly 13.9% capitalization ratio. Those are meaningful mitigants because they show a real regulated balance sheet rather than a narrative-only fintech.

    The residual risk is that growth and pricing are much more visible than downside credit quality. Kapital's own SME credit documents show high quoted CATs, opening fees, guarantor structures, liquid-deposit guarantees, and moratory-rate provisions, which means returns depend heavily on underwriting, collections, and conduct discipline. Yet public materials still do not disclose vintage curves, fraud-loss splits, restructures, roll rates, recoveries, or holdco cash needs. Crowdfund Insider's point that credit investors still focus on advance rates, covenants, and cash-flow stress scenarios is therefore important. The macro backdrop adds pressure rather than relief: Banxico said policy was still restrictive even after cutting the overnight rate to 6.50% in May 2026, while the IMF projected only 1.5% growth for 2026 with trade uncertainty still constraining activity. Investors therefore have enough evidence to reject a solvency panic, but not enough to underwrite the next downside credit cycle. The key private evidence gap is a product-level loss and funding bridge that links high-growth origination to actual seasoning, reserves, and holdco liquidity.
