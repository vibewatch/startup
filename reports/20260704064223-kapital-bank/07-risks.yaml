company:
  name: Kapital Bank
chapter:
  number: 7
  title: Risks
  summary: 'Kapital''s risk register is led by five connected exposures: (1) regulatory and legal contagion from the Intercam transaction and a still-thin public governance stack; (2) credit, funding, and macro risk as the bank grows loans, deposits, and off-balance-sheet commitments faster than it discloses vintage or fraud detail; (3) operational, complaint-handling, and privacy/security risk highlighted by official complaint data and the 2024 Cybernews identity-data exposure report; (4) partner and execution risk around integrating acquired assets while remaining heavily founder-led; and (5) disclosure and capital-markets risk as management talks about an IPO before the public record shows a full board, cap-table, or holdco-liquidity view. Public bank metrics and an HR A+/Stable rating are real mitigants, so immediate solvency is not the top risk today.'
sections:
- id: regulatory-legal-and-sanctions-context-risk
  title: Regulatory, legal, and sanctions-context risk is the most severe cluster
  body: |-
    Kapital is no longer just a high-growth SME fintech; it is now a regulated banking group that chose to buy sensitive assets from Grupo Financiero Intercam while Mexico and U.S. authorities were already focusing on AML and cross-border controls. Kapital's own August 2025 announcement says the deal covers broker-dealer, asset-management, and operational banking assets and includes another US$100 million of operational investment. The retained U.S. Federal Register record makes the legal context explicit: FinCEN issued an order prohibiting certain transmittals of funds involving Intercam Banco after determining it was of primary money-laundering concern in connection with illicit opioid trafficking. Independent coverage then framed the sale itself as something Intercam pursued after Treasury pressure and sanctions-era stress, not as a clean strategic portfolio rotation.

    That does not mean Kapital itself has a public enforcement record in the retained source set; in fact, the Buró disclosure shows zero sanctions for 2025. The problem is different: Kapital voluntarily stepped into a high-scrutiny perimeter while still giving the market a relatively thin public governance surface. The company does have a corporate-governance and investor-relations page, but retained public materials still do not expose a consolidated board-committee map, a reconciled cap table, or a detailed holdco-risk narrative. For a company integrating stressed assets and discussing an IPO horizon, that disclosure gap materially raises legal, governance, and approval risk. The key private evidence gap is management's regulator-correspondence pack for the Intercam transaction, including conditions precedent, customer-migration controls, and AML remediation responsibilities.
