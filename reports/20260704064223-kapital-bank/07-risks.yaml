  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: intercam-approval-and-remediation-pack
    missingEvidence: Approval conditions, regulator correspondence, customer-migration controls, AML ownership, and cutover milestones for the Intercam transaction.
    whyItMatters: This is the chapter's highest-severity legal and dependency risk, and public press releases are too shallow to determine whether integration risk is tightening or easing.
    diligencePath: Request the full transaction approval pack, regulator conditions precedent, migration scorecards, and a dated risk register for Intercam integration.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR012
    - QR023
    - QR026
    relatedTableRefs:
    - TR001
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: portfolio-vintages-fraud-and-collections
    missingEvidence: Product-level vintage curves, fraud-loss splits, restructures, recoveries, roll rates, and collections efficiency metrics for 2025-2026 cohorts.
    whyItMatters: Current capital and NPL metrics are not enough to underwrite downside earnings or covenant risk once rapid growth seasons.
    diligencePath: Request monthly or quarterly cohort tables by product, fraud versus credit-loss waterfall, and collections scorecards with recovery timing.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR020
    - QR024
    - QR026
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: complaint-and-conduct-cohorts
    missingEvidence: Complaint mix by product, backlog aging, formal escalation outcomes, guarantor enforcement data, and hardship-policy use in SME lending.
    whyItMatters: Public complaint totals establish direction, but not whether conduct risk is isolated, seasonal, or compounding.
    diligencePath: Request monthly complaints packs, root-cause analysis, legal-escalation counts, and collections / hardship policy dashboards for 2025-2026.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR008
    - QR022
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: security-controls-and-postmortems
    missingEvidence: Cybernews incident postmortem, remediation evidence, security-audit outputs, critical-vendor map, and any subsequent security incident history.
    whyItMatters: A single exposed-identity event can become a durable trust and regulatory issue if management cannot show the control stack was genuinely rebuilt.
    diligencePath: Request the incident report, root-cause analysis, compensating controls, penetration-test results, and board-level security reporting.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR025
    relatedTableRefs:
    - TR001
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: holdco-liquidity-and-capital-structure
    missingEvidence: Holdco cash, runway, debt ladder, covenants, intercompany dependencies, and any secondary-liquidity or IPO-readiness workstreams.
    whyItMatters: The regulated bank looks sound, but public filings do not answer whether the broader group can absorb integration, growth, and disclosure costs without another financing dependency surprise.
    diligencePath: Request the holdco treasury pack, debt summary, covenant matrix, intercompany funding map, and capital-markets readiness timeline.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR021
    - QR025
    relatedTableRefs:
    - TR002
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: board-committee-and-oversight-detail
    missingEvidence: Full board roster, committee structure, director independence, ownership evolution, and the internal reporting cadence used to oversee the bank and acquired assets.
    whyItMatters: Public scale, Intercam complexity, and IPO talk make governance architecture itself a first-order underwriting variable.
    diligencePath: Request the board deck cover page, committee charters, org chart, cap table by class, and a summary of reserved matters and investor rights.
