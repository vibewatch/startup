- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Intercam regulatory slippage
    - Approval letters, regulator statements, and management integration updates
    - New condition, delay, or enforcement signal tied to Intercam assets or customer migration
    - Treat partner/integration risk as thesis-breaking until closed with documentary evidence
  - - Credit deterioration
    - IMOR, coverage, restructures, and cohort-vintage data
    - 2026 cohorts season worse than plan or coverage weakens materially without an explained reserve build
    - Pause any underwriting upgrade and recut downside valuation with higher loss assumptions
  - - Complaint or conduct deterioration
    - Buró, Condusef, and internal complaint packs
    - Complaint rate or formal disputes rise materially faster than contract growth
    - Increase conduct and retention risk and assume higher service cost
  - - Security-control failure recurrence
    - Security incidents, breach notices, or third-party audit findings
    - Another credible sensitive-data incident or absent postmortem after a major event
    - Treat privacy/security as a gating diligence item rather than a background concern
  - - Funding / disclosure shortfall
    - Holdco cash reporting, covenant headroom, and IPO-readiness disclosures
    - No meaningful improvement in governance or holdco transparency before the next capital-markets step
    - Discount valuation and require stronger investor protections or capital structure clarity
  - - Macro / rate stress
    - Banxico path, IMF growth revisions, and portfolio performance by sector
    - Restrictive conditions persist while SME repayment or origination weakens materially
    - Re-underwrite growth and collections assumptions and lower confidence in the current profit story
  notes: These are underwriting triggers, not predictions. Several can only be monitored properly once management shares private operating data.
