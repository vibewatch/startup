- id: mitigations-monitors-and-kill-criteria
  title: The mitigants are real, but the underwriting case still needs monitored triggers
  body: |-
    The chapter should not be read as a call that Kapital is immediately distressed. Public evidence shows a functioning bank with scale, profitability, capital, liquidity, an HR A+/Stable rating, and zero public sanctions in the retained Buró disclosure. Those facts matter because they keep outright solvency or license-loss scenarios below the top tier today. The company also has formal complaint and Condusef surfaces, visible credit documentation, and enough public reporting to prove this is a real regulated operator rather than a thin fintech wrapper.

    The investment case still breaks quickly if a handful of observable triggers go the wrong way. The clearest kill criteria are: a disclosed deterioration in NPL or coverage as 2026 cohorts season; any regulatory condition, enforcement, or delayed approval tied to Intercam integration; another credible privacy/security incident involving onboarding data; inability to convert Series C momentum into cleaner disclosure before IPO planning intensifies; or evidence that holdco funding, covenants, or customer-migration execution are worse than the public file implies. The right diligence posture is therefore monitored and evidence-hungry: demand private portfolio, governance, integration, and security materials before treating current growth as de-risked.
