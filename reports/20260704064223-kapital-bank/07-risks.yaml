- id: operational-customer-and-security-risk
  title: Operational, complaint-handling, and privacy/security risk are real rather than hypothetical
  body: |-
    Official and adverse evidence both show that Kapital's operating risk is not just generic fintech noise. Kapital's Buró de Entidades Financieras disclosure reported 310 complaints in 2025, an index of 6.3 complaints per 10,000 contracts, and a 9.46 user-service score. That is not a crisis signal, but it is enough to show meaningful real-world customer friction at current scale. The company also maintains a public Condusef help page, which is a useful mitigation because it demonstrates a formal consumer-protection interface rather than purely app-based support.

    The more serious operational signal is Cybernews' December 2024 report that a misconfigured cloud bucket attributed to Kapital exposed roughly 1.67 million files, including voter IDs and selfies, and that the outlet said it received no company response before publication despite multiple disclosure attempts. For a lender and bank handling identity verification, that is precisely the kind of event that can flow into trust, conduct, and regulator attention at once. Product documentation reinforces that the operating model involves non-trivial control obligations: Crédito PyME uses guarantors, liquid-deposit support, commissions, and moratory-rate mechanics, while Cuenta PyME imposes opening-balance and low-balance conditions. Public sources therefore show a broad and active operating system, but not the incident postmortems, complaint-aging data, fraud-loss splits, or independent security-control evidence needed to prove the risk is fully contained.
