  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: kapital-som
    missingEvidence: Geography-level Kapital customer counts, active-card counts, payment volume, and credit balances for Mexico, Colombia, and any U.S. corridor business.
    whyItMatters: Exact SOM cannot be separated from broad SAM without company disclosures on live distribution and monetization by market.
    diligencePath: Request operating KPIs by geography and cohort from management or investor materials under NDA.
    relatedQuestionRefs: [QM023, QM024]
    relatedTableRefs: [TM002]
  - type: missing-source
    severity: material
    topic: tri-country-wallet-size
    missingEvidence: A comparable public dataset for SMB deposit balances, payment volume, and credit balances across Mexico, Colombia, and the U.S.
    whyItMatters: A business-count TAM overstates monetizable wallet size and does not reveal spend depth.
    diligencePath: Build a geography-normalized wallet model from regulator series and bank disclosures rather than firm counts alone.
    relatedQuestionRefs: [QM024]
    relatedTableRefs: [TM002, TM003]
  - type: access-blocked
    severity: minor
    topic: mexico-enterprise-inclusion-series
    missingEvidence: Easier public access to business-level Mexican inclusion tables from CNBV and related official dashboards without challenge or fragment barriers.
    whyItMatters: The chapter relies on credible 2026 reporting for Mexico's SME credit-access figure rather than a clean regulator table extract.
    diligencePath: Pull the underlying CNBV series directly from regulator databases or request the enterprise slice from local counsel or research support.
    relatedQuestionRefs: [QM007]
    relatedTableRefs: [TM003]
  - type: access-blocked
    severity: minor
    topic: colombia-microbusiness-depth
    missingEvidence: Clean extractable DANE microbusiness time series that ties informal-micro trends to finance and payments behavior.
    whyItMatters: Colombia's formal-company data is strong, but informal and microbusiness operating-finance depth remains harder to quantify from accessible public extracts.
    diligencePath: Retrieve EMICRON tables directly from DANE or from MINCIT's monthly enterprise reports and append the segment splits.
    relatedQuestionRefs: [QM004, QM016]
    relatedTableRefs: [TM003, TM004]
