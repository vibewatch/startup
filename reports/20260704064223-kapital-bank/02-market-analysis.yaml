- id: constrained-sizing-lenses
  title: Constrained Sizing Lenses
  body: >-
    A single TAM number would be misleading here, because the relevant market changes
    depending on whether the lens is firm count, credit access, payment digitization,
    or cross-border need. The broadest business-count lens points to scale: roughly
    4.9 million Mexican SMEs, 1.739 million active Colombian firms, and 5.58 million
    U.S. employer firms under 500 employees. But those broad counts overstate the
    practically addressable market for a workflow-driven finance platform, because
    many firms are too informal, too cash-native, too lightly digitized, or too
    small-ticket to be economically attractive at launch.

    The second lens is finance access. Across emerging markets, the formal MSME
    finance gap is estimated at US$5.7 trillion and rises to US$8 trillion when
    informal enterprises are included; 70% of MSMEs in emerging markets still lack
    adequate financing, and Latin America and the Caribbean actually saw formal MSME
    finance supply contract by roughly 4% per year over 2015-2019. Country evidence
    shows why this matters for Kapital. In Mexico, only about 15% of SMEs have access
    to formal credit according to 2026 local reporting that cites the CNBV, even as
    Plan México pushes a 30% sustainable-credit-access target. In Colombia, 72.5% of
    legal entities had at least one deposit or credit product in 2024, but only 26.7%
    had active credit and micro firms were far more underserved than large firms.
    In the U.S. comparator market, financing is more available but still not friction-
    free: 60% of employer firms sought financing in the prior 12 months, yet only 42%
    received the full amount they sought.

    The third lens is payment and data readiness. Mexico's mobile-banking adoption
    reached 69% in 2024 and Banco de México infrastructure processed more than 6
    billion digital transactions in 2025, yet cash remains dominant and open-banking
    rules for transactional data are still unfinished. Colombia looks more advanced on
    interoperable rails: Bre-B is already live as an instant-payment system and had
    processed more than 500 million transactions with over 100 million payment keys in
    its first five months. Regional payments data also matters because many SMB pain
    points are supplier- and trade-linked rather than purely domestic. Mastercard and
    PCMI describe a US$1.4 trillion Latin American cross-border SME opportunity, but
    also show that a US$250 transfer can carry average fees of 23.3%, reaching 30% in
    some corridors.

    Taken together, the evidence supports a constrained sizing view rather than a
    heroic TAM claim. The practical SAM is the subset of formal Mexican and Colombian
    SMBs, plus selected U.S.-linked corridor users, that already run on digital or
    semi-digital payment rails and have recurring supplier, collection, or working-
    capital workflows. SOM cannot be isolated from public sources because Kapital does
    not publicly break out live customer counts, payment volume, or credit balances by
    geography and segment.
