- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: >-
    The strongest adoption drivers are not purely company-specific; they are
    structural improvements in the operating environment. In Mexico, the public-policy
    stack is trying to push both credit depth and digital usage at the same time.
    Plan México targets 30% sustainable SME credit access, a MX$4 billion first-
    financing fund, and closer bank-fintech collaboration. Banco de México's 2026
    consultation on new account tiers is explicitly framed as a way to expand
    inclusion and digital-payment usage. In Colombia, the driver is more regulatory:
    Decree 0368 of 2026 moves the country from a voluntary open-finance approach to a
    mandatory one for supervised entities, and the Superfinanciera must define a
    standardization schedule within six months. Colombia also already has a working
    interoperable rail in Bre-B, which creates the transaction-data exhaust that can
    support collections, supplier payments, and eventually better underwriting.

    There are also powerful commercial drivers. Latin American SMEs are deeply tied to
    supplier networks and cross-border flows: 3 out of 5 already work with
    international suppliers, and 75% of surveyed SMEs in markets such as Mexico and
    Brazil plan to expand global partnerships. Payment friction is therefore an SMB
    tax. If sending US$250 can consume 23.3% in average fees and up to 30% in some
    cases, any product that lowers settlement cost, delays, or opacity can earn an
    operating-finance role rather than a narrow payments role.

    The constraints are equally material. First, Mexico's open-banking regime remains
    incomplete eight years after the 2018 Fintech Law: open-data rules exist, but the
    binding transactional-data, consent, and accreditation layers still do not. That
    slows underwriting automation and forces bespoke integrations. Second, trust and
    security remain active adoption barriers. Mexico still conducts roughly 80% of
    transactions in cash, and 30% of the population reports digital-security concerns.
    Third, the credit gap is not solved just because digital rails improve. Colombia's
    company data shows a wide gap between basic product access and active credit use,
    especially for micro firms. Fourth, the U.S. comparator warns against assuming
    digital channels automatically create better borrower economics: the April 2026
    SLOOS reported tighter C&I lending standards, and 60% of online-lender borrowers
    in the SBCS said actual borrowing costs were higher than expected.

    The adverse read is therefore clear: the market is large and structurally
    underserved, but trust, regulation, and switching frictions can slow monetization.
    Kapital's valuation-relevant opportunity is strongest where payments, underwriting,
    and workflow automation reinforce each other; it is weakest where the product is
    forced to fight cash habits, incomplete data rails, or borrower distrust one use
    case at a time.
