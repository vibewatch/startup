  topStrengths:
    - Regulated-bank ownership plus workflow software gives Kapital a fuller infrastructure moat than many LatAm SMB fintech peers that still sit on third-party rails.
    - Public 1Q26 bank metrics show real deposits, loans, capital, liquidity, and profitability rather than a pure growth narrative.
    - Repeat investor support from Tribe Capital, Pelion Ventures, Y Combinator, and other venture backers validates continued access to growth capital.
    - Mexico and broader LatAm SMB banking remain underpenetrated in credit, operating software, and digital treasury, supporting structural demand.
  topRisks:
    - Consolidated revenue, ARR, cap-table, and preference-stack disclosure remain too thin for confident late-stage entry pricing.
    - The Intercam transaction imports compliance, integration, and reputation risk after U.S. anti-money-laundering action against the seller.
    - A reported 2024 data-exposure incident weakens the company's trust and control narrative for a regulated identity-heavy lender.
    - Rapid SME credit growth, guarantor-heavy products, and limited public vintage data leave underwriting and collections quality insufficiently proven.
  unresolvedGaps:
    - Consolidated revenue, ARR, stream mix, and holdco burn or runway are still undisclosed in retained public sources.
    - The fully diluted cap table, Series C liquidation preferences, and broader preference overhang are not publicly available.
    - Public evidence does not show 2025-2026 credit vintages, fraud splits, collections curves, or product-level loss performance.
    - Board committee structure, current ownership map, and oversight detail remain partially inaccessible from public governance materials.
    - Intercam integration KPIs, customer overlap, and post-acquisition asset-quality effects are not yet publicly measurable.
