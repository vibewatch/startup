summary:
  headline: >-
    Kapital looks like a real full-stack SMB banking platform with regulated-bank profitability and scale, but public evidence still does not show the consolidated revenue, cap-table, and preference-stack detail needed to underwrite the September 2025 unicorn price aggressively.
