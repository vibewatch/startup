companyProfile:
  summary: >-
    Kapital is a Mexico City-founded SMB financial platform that combined workflow software, lending, and treasury tools with acquisition-led banking infrastructure to become a regulated financial group by 2025. The company sells business accounts, SME credit, supplier and invoice finance, cards, payroll, and finance-operations software to businesses primarily in Mexico, with earlier and later disclosures also referencing Colombia, Peru, and the U.S. Public evidence shows a September 2025 unicorn round, roughly 300,000 customers, and meaningful 1Q26 bank balance-sheet scale, but important holdco-level economics and governance detail remain undisclosed.
  foundedDate: '2020-01-01'
  founders:
    - name: René Saúl
      role: Co-Founder and CEO
      background: Public face of Kapital's evolution from fintech software to regulated banking group.
      claimRefs: [CO006, CO008]
    - name: Fernando Sandoval
      role: Co-Founder and CFO
      background: Public counterpart on fundraising, profitability, and bank-scale financial operations.
      claimRefs: [CO006]
  foundingLocation: Mexico City, Mexico
  headquarters: Mexico City, Mexico
  productSummary: >-
    Business accounts, SME credit, cards, payroll, FX and treasury workflows, and AI-assisted financial operations tools delivered through a technology-first banking platform.
  customerFocus: >-
    Small and medium-sized businesses that need operating accounts, working-capital credit, supplier payments, payroll, and finance-management tooling, with Mexico as the center of gravity.
  businessModel: >-
    Monetization blends account fees and balance-linked economics with SME lending, supplier and invoice finance, card activity, FX, and subscription-style software fees layered on regulated banking infrastructure.
  stage: Series C private
  fundingStatus: >-
    Up to US$100 million Series C at a US$1.3 billion valuation in September 2025, led by Tribe Capital and co-led by Pelion Ventures, following earlier seed, Series A, Series B, debt facilities, and acquisition-linked capitalization.
  disclosureProfile: private-undisclosed
