callouts:
  - calloutType: risk
    title: Charter race is the sharpest adverse signal
    body: |
      Konfío and Nu are both moving toward fuller bank-like operating models. If Kapital does not become the customer's
      primary operating account before those transitions mature, its bundle risks being reduced to a lending overlay.
    claimRefs:
      - CP008
      - CP032
      - CP054
      - CP056
  - calloutType: insight
    title: Payments specialists lower lock-in more than pricing alone does
    body: |
      Conekta, Clip, and Adyen matter because they let SMBs unbundle acceptance, reconciliation, and checkout from the
      rest of the finance stack. That makes multi-homing easy even when capital products stay with another provider.
    claimRefs:
      - CP019
      - CP022
      - CP023
      - CP029
      - CP049
