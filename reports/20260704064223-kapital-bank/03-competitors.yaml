  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: Banorte official SME product depth
      missingEvidence: >-
        Stable official Banorte SME account, TPV, and credit pages with current public feature and pricing detail comparable
        to BBVA and Santander.
      whyItMatters: >-
        Banorte is a major incumbent alternative in Mexico, but unstable official self-serve pages limit apples-to-apples
        comparison on onboarding friction, pricing, and digital tooling.
      diligencePath: >-
        Re-run Banorte fetches with a confirmed official URL pack from management or capture the bank's SME brochures or
        authenticated product PDFs directly from Banorte relationship managers.
      relatedQuestionRefs:
        - QP020
      relatedTableRefs:
        - TP001
    - type: private-evidence-only
      severity: material
      topic: realized competitive pricing and discount curves
      missingEvidence: >-
        Negotiated MDRs, credit rates, card fees, and bundle discounts for Kapital, Konfío, Clip, Conekta, Adyen, and
        incumbent banks by merchant size and product attachment.
      whyItMatters: >-
        List pricing is a poor predictor of win rate in fintech and bank sales motions; actual competitive economics drive
        displacement risk and contribution margins.
      diligencePath: >-
        Request recent competitive bid sheets, anonymized price concessions, and sales win-loss notes by segment and deal size.
      relatedQuestionRefs:
        - QP023
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: post-onboarding lock-in and multi-homing
      missingEvidence: >-
        Publicly auditable retention, cross-sell attachment, wallet share, and churn reasons showing whether customers make
        Kapital their primary account or keep it as one tool among several.
      whyItMatters: >-
        The chapter's central risk is that buyers can unbundle the stack; without attachment and retention data, moat
        durability remains inferential.
      diligencePath: >-
        Ask for product-level attachment cohorts, monthly active account behavior, NRR by attached product count, and lost-deal
        reasons versus Clip, Konfío, banks, and Conekta.
      relatedQuestionRefs:
        - QP014
        - QP026
      relatedTableRefs:
        - TP004
