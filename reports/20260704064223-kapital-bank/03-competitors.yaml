company:
  name: Kapital Bank
chapter:
  number: 3
  title: Competitors
  summary: |
    Kapital competes across four overlapping rival sets: credit-led fintechs (Konfío), merchant-stack fintechs
    (Clip), payments specialists (Conekta and Adyen), and incumbent banks (BBVA, Santander, Banorte), with
    Nu Mexico and US finance platforms showing where adjacent entrants can go next. The highest pressure comes
    from rivals that can become the customer's primary operating account: Konfío is pursuing a bank charter,
    Clip already couples regulated money movement with terminals and loans, Conekta publishes local-method pricing,
    and incumbents still win on balance-sheet trust and disclosed merchant fees. Kapital's edge is bundle
    convergence across credit, cards, factoring, and accounts, but the moat looks executional rather than structurally locked.
sections:
  - id: landscape-overview
    title: Competitive landscape and substitute set
    body: |
      Kapital is not fighting a single peer group. In Mexico's SMB finance stack, buyers can solve the same job
      through at least five wedges: a credit-led fintech such as Konfío, a merchant operating stack such as Clip,
      a payments orchestration layer such as Conekta or Adyen, a full-bank incumbent such as BBVA, Santander, or
      Banorte, and an adjacent consumer-to-bank brand such as Nu that could later extend into business banking.
      Kapital's own official surfaces show why that overlap matters: it sells business credit, a corporate card,
      factoring, and business accounts on one brand surface rather than as a single-purpose product. That means
      the real competitive question is who can become the primary operating account for the SMB, not who matches
      one isolated feature.

      The strongest near-term substitutes are the firms that already own a daily workflow. Konfío owns the credit
      relationship and is trying to add deposits and treasury; Clip owns in-person acceptance and same-day merchant
      settlement; Conekta owns online checkout, SPEI, and cash collection rails; BBVA and Santander own regulated
      deposit accounts and merchant acquiring; Adyen owns omnichannel acceptance for more sophisticated merchants.
      Nu Mexico is not yet a public business-banking competitor, but its licensed-bank transition and scale still
      matter because it could compress customer acquisition economics if it enters SME products later. This means
      Kapital must defend against unbundled multi-homing almost as much as against direct one-to-one displacement.
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP011
      - CP019
      - CP026
      - CP031
      - CP038
      - CP047
      - CP049
      - CP054
