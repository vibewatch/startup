  - id: incumbent-banks-and-regulatory-trust
    title: Incumbents, regulatory posture, and switching costs
    body: |
      Incumbent banks remain structurally dangerous because they package trust, deposits, and merchant acquiring in
      ways fintechs still cannot fully match. BBVA publishes a low-friction-looking Cuenta Maestra Pyme with a MXN 1
      opening minimum, but the operational reality is branch onboarding, beneficial-owner declarations for some legal
      entities, and dependence on existing BBVA relationships to unlock digital credit offers. It also publishes merchant
      acquiring economics, including a 2.15% debit discount rate for a portable TPV plus affiliation and low-volume
      fees. Santander's PyME package is similarly bundled around account, terminal, and app control, with a headline
      plan from MXN 0 for PFAEs and additional Getnet features such as payment links, catalog, inventory, and terminal
      workflows. Banorte is less transparent in the current fetch flow because its official SME product URLs were not
      stable, but company-published recognition still points to material SME loan and deposit share.

      These bank structures raise switching costs in a different way than fintech UX does. Once an SMB routes deposits,
      supplier payments, cards, and POS settlement through a bank account, changing providers affects compliance, branch
      service, treasury controls, and payment rails at once. That does not mean incumbents are always easier to use;
      in fact, their documentation and offer-gated credit flows leave room for fintechs to win on speed. But it does
      mean Kapital cannot assume software convenience alone creates lock-in. To hold the primary account, it must match
      or exceed the trust, disclosures, and operating-account relevance that banks make explicit.
    claimRefs:
