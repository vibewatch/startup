tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation vs Kapital
    rows:
      - - Kapital
        - Company / integrated SMB finance stack
        - Private; public site spans credit, card, factoraje, accounts, FX, and digital banking
        - Mexico SMBs seeking one relationship across capital and operating workflows
        - Bundle convergence across funding, card, factoraje, and account surfaces
        - Public pages do not disclose realized pricing or attachment metrics
      - - Konfío
        - Direct peer / credit-led fintech
        - 2021 unicorn profile; >$380M equity and >MXN7.4B debt facilities per Legal Paradox
        - SMEs needing unsecured working capital and, increasingly, broader treasury
        - MXN5M unsecured credit plus card and payments; explicit bank-license expansion plan
        - Deposit stack not yet live; official pricing detail remains limited
      - - Clip
        - Direct peer / merchant stack
        - 1M+ app downloads, regulated wallet, terminals, and merchant-loan offers
        - Micro and small merchants needing card acceptance and same-day cash visibility
        - Couples terminals, regulated account, and offer-based loans with low-friction onboarding
        - Broader treasury and credit depth still lighter than bank incumbents
      - - Conekta
        - Direct peer / online-payments infrastructure
        - US$15B processed, 428M transactions, 8K+ merchants
        - Digital merchants needing cards, SPEI, cash, and checkout orchestration
        - One integration for Mexico with explicit SMB pricing and local-method optimization
        - No lending or operating-account wedge for most SMBs
      - - Adyen Mexico
        - Adjacent / enterprise payments platform
        - Global platform with published pricing and unified online-plus-POS stack
        - Merchants needing omnichannel acceptance and cross-border orchestration
        - Strong conversion, fraud, and POS operations with one platform
        - Upmarket orientation and no SME credit product
      - - BBVA PyME
        - Incumbent bank
        - Full-bank deposit and acquiring infrastructure; publishes TPV fees and digital-credit terms
        - SMEs prioritizing regulated accounts, TPV, and relationship banking
        - Trust, published fees, and operating-account depth
        - Higher-friction onboarding and offer-gated digital credit
      - - Santander PyME
        - Incumbent bank
        - Full-bank bundle with plan from MXN0 for PFAEs and Getnet terminal tooling
        - SMEs wanting account, terminal, and branch-backed service in one package
        - Integrated account + terminal + app bundle with payment-link extensions
        - Less public detail on realized MDR than BBVA or Conekta
      - - Banorte PyME
        - Incumbent bank
        - 15% SME loan share and 14% SME deposit share per company-published recognition note
        - SMEs wanting national-bank balance-sheet trust and financing access
        - Scale, deposits, and recognized SME franchise
        - Current official self-serve web product detail was unstable in this run
      - - Nu Mexico
        - Adjacent / consumer-first digital bank transition
        - ~14M Mexico customers and US$4.2B planned investment through 2030
        - Consumer users today; potential future SMB adjacency
        - Large low-cost digital distribution and banking-license transition
        - No public Mexico business-banking surface today
      - - Mercury
        - US benchmark / software-led business banking
        - 300K+ entrepreneurs and US$20B+ monthly transaction volume
        - Startups and SMBs wanting low-fee account, cards, and automations
        - Free base banking, 1.5% cashback, pricing tiers for finance software
        - Not localized for Mexico; no local payment rails
      - - Brex
        - US benchmark / spend + banking platform
        - 1 in 3 startups claim, up to 3.68% treasury yield, up to US$6M FDIC coverage
        - Venture-backed and scaling firms with higher spend/compliance needs
        - High-limit cards plus treasury, AP, and global controls
        - Not localized for Mexico; economics tied to US banking infrastructure
      - - Lili
        - US benchmark / small-business banking
        - 200K+ businesses served; 4.00% APY; US$3M FDIC sweep coverage
        - Smaller SMBs and solo operators seeking simple digital banking
        - Low-fee operating account with embedded credit and payments
        - US-only benchmark rather than Mexico operator
