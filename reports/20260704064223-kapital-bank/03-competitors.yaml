  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - One-brand stack across credit, card, factoraje, and accounts
        - Buyers can still unbundle by using bank operating accounts, Clip terminals, and Conekta checkout beside Kapital credit
        - High
        - Request primary-account penetration, product attachment, and retention by attached product count
      - - Credit-led underwriting and working-capital relevance
        - Konfío's MXN5M unsecured credit plus charter path narrows the strategic gap quickly
        - High
        - Verify win/loss data versus Konfío by ticket size, tenor, and account-ownership objective
      - - Merchant operating workflow fit
        - Clip already combines same-day merchant money movement, terminals, and loans for smaller sellers
        - Medium-High
        - Measure where Kapital wins or loses once a merchant already uses Clip for settlement
      - - Payments orchestration in Mexico
        - Conekta's explicit local-method pricing and performance claims can pull checkout-led buyers away
        - Medium-High
        - Test whether Kapital can match SPEI/cash/checkout economics without relying on external PSPs
      - - Trust and regulatory confidence
        - Full-bank incumbents and soon-to-be-bank challengers can position Kapital as a secondary provider
        - High
        - Validate customer willingness to hold primary balances at Kapital versus incumbent banks
      - - Future product-scope moat
        - Adyen, Mercury, Brex, and Lili show how fast finance software can layer cards, treasury, and AP around a core account
        - Medium
        - Track roadmap speed on treasury, AP controls, and self-serve onboarding relative to benchmark stack depth
      - - Customer inertia after onboarding
        - Public evidence does not yet prove low churn or low multi-homing after adoption
        - Medium-High
        - Ask for gross and net revenue retention, churn reasons, and share-of-wallet progression after 6/12/24 months
    enumerationScope:
      coverage: partial
      basis: >-
        The register scores the most decision-relevant moat claims surfaced by the fetched public evidence. It is a
        qualitative screen, not a full customer-interview-based churn or NPS study.
    notes: >-
      Severity ratings are qualitative and reflect downside to Kapital's ability to become the SMB's primary financial
      operating layer rather than simple feature parity.
