      - FP001
  - id: direct-peers-and-capability-overlap
    title: Direct peers, capability overlap, and pricing posture
    body: |
      Among fintech peers, Konfío is the closest credit-led substitute for Kapital's broader ambition. Its public
      credit page advertises unsecured business loans up to MXN 5 million with fixed rates, digital onboarding,
      and 48-hour funding, while third-party and news coverage indicate that it is trying to add deposit and
      treasury services through a banking license. That direction matters because Kapital also wants to sit at the
      center of the SME operating stack rather than remain a point solution. Clip is the closest merchant-stack
      substitute at the micro and small business end: it combines card terminals, a regulated digital account, and
      offer-based business loans, then uses hardware discounts and same-day settlement to make adoption easy.

      Conekta overlaps less on lending but more on the payments wallet share of the stack. Its official surfaces
      emphasize one integration for cards, SPEI, cash, BNPL, and wallets, plus explicit list pricing for SMBs.
      That makes Conekta a strong substitute when the buyer pain point is checkout conversion, payment-method mix,
      or reconciliation rather than credit. Adyen sits further upmarket but is strategically important because it
      offers one online-plus-POS payments platform, transparent Interchange++ pricing, and expanding orchestration
      capabilities such as Adyen Agentic. For Kapital, the implication is clear: buyers can unbundle the stack and
      choose whichever specialist is strongest at the workflow they care about most, then multi-home around the rest.
    claimRefs:
