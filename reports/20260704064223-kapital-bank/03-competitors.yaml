  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor
      - Published price / unit
      - Contract model
      - Included capabilities
      - Unknowns / discounts
      - Implication
    rows:
      - - Kapital
        - No public list pricing on fetched product pages
        - Offer-led credit/card/factoraje packaging
        - Credit, corporate card, factoraje, accounts, FX, digital banking
        - Realized rates, fees, and bundle discounts not public
        - Helps sales flexibility but weakens transparent self-serve comparison
      - - Konfío
        - Fixed-rate credit positioning; no public card or treasury fee table in fetched pages
        - Offer-led lending with broader stack expansion underway
        - Credit, card, terminals, future deposits/treasury ambition
        - Exact realized rates not public in fetched extracts
        - Strong for consultative selling, less strong for instant price comparison
      - - Clip
        - Hardware kits from MXN2,598; no monthly rent; competitive commissions for high volume
        - Hardware-led merchant adoption plus offer-based loan pricing
        - Terminals, regulated account, links, merchant loans
        - Full MDR schedule not published in fetched pages
        - Very compelling for micro-SMB merchant onboarding
      - - Conekta
        - Cards from 3.4% + MXN3; cash 2.6% + MXN3; SPEI from MXN12.50; all + IVA
        - Pay-per-successful-transaction platform pricing
        - API, checkout, plugins, links, cards, cash, transfers
        - Enterprise rates negotiated by volume
        - Transparent for digital merchants comparing PSP economics
      - - BBVA TPV
        - MXN300 affiliation; MXN150 extra terminal monthly; 2.15% portable debit rate; low-volume penalty
        - Traditional bank acquiring plus relationship banking
        - Accounts, TPV, branch servicing, digital credit offers
        - Credit-card MDR detail and negotiated rates not fully visible in extract
        - Incumbent bank can compete directly on merchant acquiring math
      - - Santander PyME
        - Plan from MXN0 for PFAEs; deeper terminal pricing not visible on fetched pages
        - Account + terminal + app bundle
        - Account, terminal, links, catalog/inventory, branch/digital banking
        - MDR, hardware, and negotiated bundles not publicly detailed in fetched extract
        - Headline bundle is attractive even without full public fee disclosure
      - - Mercury
        - US$0 base; US$29.90 Plus; US$299 Pro
        - Software monetization layered on free banking
        - Checking/savings, wires, invoicing, cards, approvals, accounting automations
        - Treasury requires balance thresholds; US-only economics
        - Benchmark for what finance-software bundling can look like
      - - Brex
        - Treasury yield up to 3.68%; pricing page tied to account / treasury bundle rather than simple MDR table
        - Banking + treasury + spend management package
        - Business account, treasury, AP, invoicing, cards, controls
        - Mexico relevance is benchmark only
        - Shows how treasury and AP can become the monetization layer, not just card interchange
    notes: >-
      This table compares public list or headline packaging, not realized negotiated economics. Missing realized rates are an
      important diligence gap because actual discounts likely determine win rates in competitive deals.
