evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised-gap
    missingEvidence: >-
      A reconciled financing schedule showing exact seed, Series A, Series B, Series C, and debt amounts drawn versus
      merely committed.
    whyItMatters: >-
      Valuation and dilution analysis for later chapters depends on whether public totals mix equity, debt facilities,
      and undrawn commitments.
    diligencePath: >-
      Request management's financing history table and debt facility summaries, then reconcile against signed term
      sheets and board approvals.
