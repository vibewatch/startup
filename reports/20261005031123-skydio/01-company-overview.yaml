callouts:
  - calloutType: "insight"
    title: "Capital Efficiency Underpinning the Series F Valuation"
    body: "While many deep-tech robotics enterprises require continuously expanding cash infusions to maintain runway, Skydio intentionally constrained its Series F to $110M at a $4.4B valuation. Management reported that strong unit economics and hundreds of millions in annual revenue from public safety DFR and defense contracts have reduced net capital dependency, shifting focus toward domestic manufacturing throughput [CO011, CO012]."
    claimRefs:
      - "CO011"
      - "CO012"
  - calloutType: "risk"
    title: "Geopolitical Retaliation and Supply Chain Vulnerabilities"
    body: "The formal sanctions imposed by the Chinese government in late 2024 represented an existential test of Skydio's operational resilience. While accelerating the creation of an independent non-Chinese supply chain, replacing specialized drone battery suppliers and critical electronics continues to demand intensive capital allocation and domestic supplier incubation under the SkyForge initiative [CO015, CO016]."
    claimRefs:
      - "CO015"
      - "CO016"
