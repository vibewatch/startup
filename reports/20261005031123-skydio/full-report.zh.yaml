      - number: '7.3'
        title: 运营、质量与支持风险
        blocks:
          - type: paragraph
            body: >-
              制造证据令人鼓舞，但放到当前产能判断中已显陈旧。2024 年 6 月证词称 Skydio 每月制造超过 1,000 架无人机并计划继续扩产；同一证词也强调，在高可靠性和低成本下整合硬件、软件、供应链、制造和 AI
              的难度。这些表述既支持一定规模基础，也定义了可能造成良率、可靠性、交付或质量问题的执行面。指定证据没有披露缺陷率、保修退货、坠机、召回、宕机、安全事件、服务等级承诺或当前工厂良率。Skydio
              公布了支持工单渠道和运营时间，隐私政策也描述了事件通知，但两者都没有衡量响应表现。因此，等 cohort 可靠性和支持数据齐备前，投资判断应把运营韧性视为未经验证。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
