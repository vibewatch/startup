      - number: '5.2'
        title: 自主架构、空间 AI 引擎与边缘计算
        blocks:
          - type: paragraph
            body: >-
              Skydio 技术差异化的核心是 Skydio Autonomy：这套专有软件飞行引擎完全运行在机载边缘处理器（包括 Nvidia Jetson
              计算模块）上，而非依赖地面控制站或云连接。系统从一组高分辨率导航摄像头持续汇总 360 度视觉数据，实时运行深度学习模型，完成 Simultaneous Localization and
              Mapping（SLAM）、预测轨迹生成和全球面避障，甚至能检测细至 0.5 英寸的线缆。针对低光和夜间作业，Skydio 集成
              NightSense，这套自主导航子系统把计算机视觉与主动可见光或红外照明结合，在无光和室内 GPS 受限环境中安全飞行。战略飞行由算法模块控制：Skydio Pathfinder
              结合地形高度、地理围栏和结构几何规划全局路线；Foresight 则通过提前数秒投射避障轨迹，让 F10 Lightrunner 适应更高速的固定翼飞行。Shadow
              负责目标跟踪，即使出现短暂遮挡，也能在可见光和热成像频谱中持续锁定车辆或人员。高层空域管理由 Skydio Airspace Assurance System（SAAS）协调：它接收 ADS-B
              遥测和组织飞行规则，并结合自动多机避碰算法，优先保障关键任务飞行，让次要飞机让行，避免空中相撞。
            claimRefs:
