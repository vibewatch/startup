      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 承销剩余风险前的尽调关口
            body: >-
              要求提供按产品和司法辖区划分的认证清单、现场可靠性和安全事件
              cohort、供应商集中度及合格替代供应商证据、头部客户和政府项目集中度，以及当前现金、烧钱速度、runway、债务、营运资金、资本开支和细分利润率数据。如果上市依赖尚未解决的关键认证、单一来源零件没有合格替代品、可靠性趋势突破客户
              SLA，或可用流动性无法支撑运营计划直到下一融资里程碑，则暂停投资论点。
