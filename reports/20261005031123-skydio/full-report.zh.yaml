      - number: '3.3'
        title: 定价、分销与信任
        blocks:
          - type: paragraph
            body: >-
              现有定价证据只能提供方向，不能用于承销。DataIntelo 估算了 X10 硬件和软件价格区间，并称 DJI 同类产品更便宜，但页面没有合同展品或可复现的基准测试附录。IPO CLUB 报道的 Skydio
              最新融资可以说明资源状况，却不是竞争对手收入、积压订单或可用现金。分销证据更扎实，但范围更窄：Skydio
              公布直接支持时段，禁止未经授权的转售，同时指向授权经销商计划。其法律条款也声明网站产品描述未必完整或最新，并纳入一年有限保修。这些控制或可支撑信任和渠道治理，但续约条款、实际折扣、服务等级承诺和多归属经济性仍属私密信息。
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 竞争结论与尽调重点
        blocks:
          - type: paragraph
            body: >-
              可辩护的投资判断比“Skydio 领先无人机行业”这一泛泛说法更窄。在买方重视美国采购资格、国内制造、低操作员负担和 GPS 受损环境运行时，Skydio
              的位置似乎最强；在价格和成熟供应链规模占主导时，它则更脆弱，因为指定独立来源描述了中国制造优势和价格更低的 DJI 替代品。Skydio 宣布的未来 5 年 $3.5B
              投资可能改善供应获取和规模，但已宣布的承诺不是已建成产能。因此，在把护城河视为持久优势前，尽调应按买方细分测试实际性价比、续约和软件附加率、操作员培训节省、零部件本地化及竞争得失数据。
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 现有证据不足以证明性价比护城河
            body: 最强的优越性主张要么来自 Skydio，要么来自没有可复现测试附录的市场数据页面。在承销持久溢价前，需要直接买方引语、标准化任务测试和实际合同价格。
            calloutType: risk
            claimRefs:
              - CP005
              - CP007
              - CP014
          - type: callout
            title: 承销受监管渠道优势，而非普遍领先
            body: Skydio 证据最充分的优势，是自主能力定位、国内生产和美国采购资格的结合。商业市场领先地位和转换成本仍是假设，直到获得按细分市场划分的得失及续约数据。
            calloutType: recommendation
            claimRefs:
