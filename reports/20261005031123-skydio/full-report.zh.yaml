      - number: '1.3'
        title: 融资历史、规模指标与地缘政治压力
        blocks:
          - type: paragraph
            body: >-
              2015 年至 2026 年 4 月完成的 8 轮融资累计为 Skydio 带来 $825M 至 $851.92M 的股权融资 [CO010]。2026 年 4 月，公司完成 $110M 的 Series
              F，投后估值 $4.4B；私人市场申报显示融资额为 $102.07M 至 $110M，发行价为 $8.63 每股 [CO011]。Skydio
              报告年收入达到九位数（“$100Ms”），并称单位经济性强；公司已交付超过 60,000 台自主飞行机器人，客户运营飞行次数超过 3,400,000 次 [CO012]。客户覆盖超过 3,800 个企业账户，包括
              42 个州的 1,200+ 个公共安全机构、51 个州交通部门中的 45 个，以及美国军队所有军种 [CO013]。规模化制造得到重大国防订单支持，包括美国陆军约 3,000 X10D 系统、金额 $52M 的
              Short Range Reconnaissance（SRR）合同 [CO014]。2026 年 4 月，Skydio 承诺未来 5 年投入 $3.5B，扩大国内制造、启动 SkyForge
              供应商计划，并建设一座面积为 Hayward 基地的五倍的新工厂 [CO015]。但公司也面临尖锐的地缘政治风险：2024
              年末，中国政府实施正式制裁，切断了公司使用中国供应链零部件和电池供应商的渠道，迫使其大举重构供应体系，转向非中国的国内及盟友供应商 [CO016]。
