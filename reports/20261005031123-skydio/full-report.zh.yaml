              2026 年两则公司职位重发描述了深入参与的售后模式。公共安全 Customer Success
              职位覆盖实施、使用、留存、扩张、续约和账户风险；场地安防部署职位则帮助客户从评估和试点走向可重复运营，并跟踪部署后的收益。这些职责说明 Skydio 正在搭建 land-and-expand
