              要扩大自主机库网络、支持全国范围的 Drone-as-a-First-Responder 运营，必须应对严格的 FAA
              超视距豁免政策和高度上限。此外，持续的地缘摩擦使公司的电池芯供应链暴露于贸易限制之下，需要多年资本投入来建立有韧性的国内制造替代方案。
            calloutType: risk
