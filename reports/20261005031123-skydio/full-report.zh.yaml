            title: GPS 受限环境中的边缘自主
            body: >-
              不同于高度依赖卫星 GPS 定位和持续飞手无线链路的旧式四旋翼，Skydio Autonomy 直接在机载边缘处理器上运行计算机视觉 SLAM 和避障。这一架构选择让系统能在 GPS
              受限环境、金属结构周边和电子战条件下保持完整任务可靠性。
            calloutType: strength
