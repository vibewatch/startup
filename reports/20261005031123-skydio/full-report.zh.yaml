      - number: '4.2'
        title: 牵引证据与收入质量
        blocks:
          - type: paragraph
            body: >-
              公开规模信号很重要，但口径各异。Sacra 和 Multiples 都报告 2024 年收入为 $180M，Sacra 还报告同比增长 80%；这些是第三方估算，不是经审计报表。2026 年 4 月，Skydio
              称核心业务年收入达数亿美元、单位经济性强且处于高速增长，并越来越多地用自身资金支持运营和未来投入。Sourcery 另报已交付 60,000 台机器人、拥有超过 3,800
              个企业客户，这能提供运营背景，却不能据此换算平均售价，因为交付期间、产品组合、捆绑软件和客户 cohort 均未披露。Multiples 的历史 12.2x 比率使用了 2024 年 11 月记录的 $2.2B
              估值和 $180M 收入；它不是当前运营倍数，且可能采用 run-rate 或 LTM 收入。
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI007
              - CI014
      - number: '4.3'
        title: 成本结构、生产强度与资本充足性
        blocks:
          - type: paragraph
            body: >-
              现有证据指向资本密集型运营模式，尽管管理层称外部资本需求正在下降。Skydio 于 2026 年 4 月融资 $110M，并表示资金将加速公共安全、国防、基础设施和场地安防领域的生产。Sourcery
              报道称，生产是主要约束，公司计划在 2026 年将产量提高至原来的三倍；$52M 的陆军订单涵盖 3,000
              架无人机。这些事实说明制造吞吐、硬件营运资金、部署和支持具有重要经济意义，但物料成本、库存周转、毛利率、服务负担和订单层面盈利均未披露。融资额不是可用现金：在没有本轮后现金余额、债务条款、经营现金流和已承诺资本开支计划的情况下，无法计算
              runway 和下一次融资触发点。
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI012
      - number: '4.4'
        title: 财务结论与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              硬件可以带来软件和服务关系，因此收入质量可能很有吸引力；但现有证据无法说明其中多少收入会持续、续约，或拥有软件式利润率。管理层关于单位经济性强的说法方向上令人鼓舞，行业报道也有呼应，但没有留存来源提供客户
              cohort
              留存、贡献毛利、CAC、回本周期或支持成本。负面情形并不是业务没有需求，而是实体产品的学习周期比软件更慢、更贵；扩大生产又可能在收入回款前消耗现金。因此，合适的承销姿态应受证据约束：承认可信的规模指标，但在赋予持久利润路径或融资
              runway 前，要求经审计报表、合同层面经济性、积压订单转化、集中度、营运资金数据和现金桥接。
            claimRefs:
              - CI002
              - CI003
              - CI013
              - CI014
