      - 剩余暴露
    rows:
      - - 先进半导体与软件专长
        - 美国科技生态
        - 自主能力和产品落地的投入
        - CEO 证词称公司成功依托这些美国优势；未披露供应商份额
        - 分配、重新设计、出口或淘汰冲击会延迟生产或削弱能力
        - 极高
        - 指定材料池没有供应商多元化证据；应直接索取
        - 在核实物料清单、分配、替代供应商和重新设计交付周期前，风险维持高位
      - - 政府采购
        - 美国政府
        - 当时部署到乌克兰的大多数 Skydio 设备的采购方和提供方
        - 重大项目暴露明显，但未披露全公司收入集中度
        - 预算、采购、政策或部署变化会造成订单波动
        - 高
        - 其他部分描述了商业和公共安全终端市场，但此处未量化其组合
        - 在审阅头部项目、头部客户、积压和取消数据前，风险维持高位
      - - 硬件与云服务混合经济
        - 客户与经常性云订阅
        - 飞机采购加软件订阅模式
        - 未披露收入组合、续约率、软件附加率和分部利润率
        - 在经常性软件达到足够规模前，硬件营运资本和利润率占主导
        - 高
        - 按队列跟踪软件附加率、续约率、毛利率和现金转换
        - 风险高，因为公开收入估算没有分部经济数据
      - - 外部资本与流动性
        - 私募投资者与融资市场
        - 历史融资支持扩张
        - 2021 年公司公告记录的是募资额，不是 2026 年剩余现金
        - 制造和合规投资超过内部产生的现金
        - 高
        - 指定来源无法确认当前缓解措施
        - 在披露现金、消耗、现金跑道、债务、营运资本和资本开支前，风险维持高位
    notes: 只有引用来源识别出依赖项时才报告集中度；不估算百分比。历史募资额不视为当前现金，Sacra 的收入数字仍是第三方估算。
