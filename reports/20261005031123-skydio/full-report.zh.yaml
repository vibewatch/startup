  - id: TV002
    title: 正反论点矩阵
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 证伪催化剂 / 论点失效
    rows:
      - - 投资正论
        - 自主 DFR 的品类领导地位与受保护的美国国防定位
        - 1,200+ 个警察部门、51 个州交通部门中的 45 个，以及 $52M 美国陆军合同
        - 失去 Blue UAS 合规资格、采购冻结或重大自主飞行安全事故
      - - 投资正论
        - 资本强度下降，核心业务自我造血
        - 尽管认购超额，Series F 仅募得 $110M；报告收入为九位数
        - 突然回到风险资本市场，寻求大额稀释性营运资本或下轮融资
      - - 投资反论
        - 硬件利润率承压且易受国际制裁影响
        - 历史毛利率为 38.1%，中国制裁造成电池供应瓶颈
        - 经审计毛利率超过 60%，且完整国内供应链具备韧性
      - - 投资反论
        - 估值倍数领先于底层经常性软件收入
        - 2023 年软件收入占比 30%，其余依赖实体无人机销售
        - 软件 ARR 增长至总收入的 60% 以上，净留存率超过 120%
    notes: 正论驱动因素将企业 / 国防采用与制造利润率约束及供应链暴露进行对照。
