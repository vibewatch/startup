  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议
        blocks:
          - type: paragraph
            body: >-
              Skydio 已成为领先的国内自主无人驾驶航空系统（UAS）制造商，受益于对外国竞争者的严格联邦限制，以及超过 1,200 家公共安全机构快速采用 Drone as First Responder（DFR）项目
              [CV004, CV008]。公司于 2026 年 4 月以 $4.4B 投后估值完成 $110M 的 Series F 融资 [CV001, CV002, CV003]。CEO Adam Bry
              将融资规模不大的原因描述为运营现金需求快速下降，并以数亿美元年收入和正向单位经济性为支撑 [CV002, CV004]。但 Skydio 虽受益于强劲的地缘政治顺风（包括美国陆军采购 3,000 套
              X10D、金额 $52M 的合同）[CV004]，业务仍资本密集，并暴露于国际供应链冲击，例如中国制裁扰乱关键电池零部件
              [CV007]。因此，在获得毛利率和持续性软件收入组合的经审计披露前，我们维持高风险、估值偏高的观望评级 [CV010]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
