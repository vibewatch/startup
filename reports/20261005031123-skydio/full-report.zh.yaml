      - number: '5.3'
        title: 软件套件、合作伙伴集成与技术脆弱性
        blocks:
          - type: paragraph
            body: >-
              Skydio 通过专业垂直软件应用和开发者集成接口变现机器人平台。软件组合包括用于公共安全紧急调度和实时视频分发的 DFR Command、用于自动化设施周界巡逻的 Security
              Command、用于自适应工业摄影测量和毫米级裂缝检测的 Asset Command 与 3D Scan，以及用于集中管理机队遥测和 Remote Flight Deck 远程操作的 Ops Center。通过
              Skydio Extend 框架，公司提供开放 REST API、Webhook 事件订阅和移动 SDK，可与 Axon Evidence（执法链路保全）、Esri ArcGIS（地理空间分析）和 Trimble
              Construction Cloud 等企业系统双向交换数据。在工程测量和制图领域，Trimble 合作建立了自动化流程，把 X10 RTK 无人机采集连接到 Trimble GNSS 基站及 Trimble
              Business Center（TBC），实现后处理动态测量（PPK）和 RTK
              测量精度。尽管能力先进，重大技术和运营风险仍在：企业架构容易受到严重的海外供应链冲击（中国对关键电池芯实施出口制裁就是例证），在有人区域上空操作重型自主四旋翼还带来公共安全责任风险；远程机库任务使用商业 5G
              蜂窝链路时可能出现通信延迟，多云数据自动同步流程也仍处于开发阶段。
            claimRefs:
