        title: 展示项
        blocks:
          - type: callout
            title: 融资额不是 runway
            body: $110M 的 Series F 证明获得了新融资，不代表当前现金、烧钱速度或 runway。这些输入仍属私密信息，必须取得后才能评估资本充足性。
            calloutType: risk
            claimRefs:
