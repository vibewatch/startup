      - number: '2.4'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用动力来自公共采购、远程巡检需求、工作人员和警员安全，以及一套自主平台跨多项任务复用的能力。国内制造承诺或可提升产能和供应商深度，拟议国防预算也显示政策对无人系统的支持。约束同样实质：买方必须取得运营授权，接入调度或资产系统，证明资本及持续软件支出合理，并管理隐私、可靠性和飞越人群的风险。DroneXL
              报道称，2026 年 6 月 NYPD 无人机在拥挤活动附近坠毁并发生电池起火；没有人员受伤，但原因仍未确定。NYPD 称发生故障，而 Skydio
              表示现有日志没有显示安全故障证据。这起未解决事件不能证明存在全机队缺陷，却提高了对故障率、根因闭环、保险和恢复系统的尽调要求。因此，估值应依赖经核实的细分收入、利润率、续约和部署经济性，而不是宽泛的市场预测。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开预测并不是可辩护的 TAM
            body: >-
              $3.2B 的 2025 年数字和 $8.7B 的 2034 年数字只是某一家出版方的估算。没有底层销量、价格、Skydio 收入、采购转化或独立估算，把它们当作投资级 TAM/SAM/SOM
              会制造虚假的精确感。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方可以通过多条不同路径解决 Skydio 所针对的任务：Skydio 自有的 X10/X10D 平台、更低价的全球成熟厂商 DJI、Anduril、Shield AI 或 AeroVironment
              的美国战术系统、系统集成商或内部自建，以及人工驾驶无人机或人工巡检这一现状方案。战术同行并不都是逐机体替代品；已有证据本身就把 Anduril 的 Ghost 描述为不同架构，并将 Shield AI 的
              V-BAT 和 AeroVironment
              的产品系列置于重叠的军用类别中。这个区别很重要：即使续航、起飞方式、载荷和单位经济性不同，采购竞争仍可能按任务项目发生。公开证据没有证明多数同行拥有可比的融资、装机基数或合同规模，因此画像表把这些字段标为未知，而不是用无依据的数量给公司排名。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP011
              - CP015
      - number: '3.2'
        title: 能力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Skydio 被报告的最强差异化是自主能力：第三方定位强调更低的操作员负担，而 Skydio 称 6
              个导航摄像头、机载计算和计算机视觉支持避障及视觉导航，即使卫星导航受损或被拒也能工作。这些能力具有战略意义，但指定证据池没有可复现的独立正面对比基准。政策是第二层护城河。对 American Security
              Drone Act 的报道显示，美国制造的中国供应商替代品可进入受保护的联邦采购渠道。但两层优势都不是静态的：Skydio
              自己表示，功能竞争与反制功能竞争要求持续开发；一篇行业文章则认为，中国零部件生态仍保有成本和规模优势。结论是：Skydio 拥有可信的受监管市场优势，但这不等于证明产品在所有场景都更优。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
