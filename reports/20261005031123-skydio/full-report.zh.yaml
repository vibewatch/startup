      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 支撑 Series F 估值的资本效率
            body: >-
              许多深科技机器人企业需要持续注入现金来维持 runway，而 Skydio 则有意把 Series F 控制在 $110M、估值定为 $4.4B。管理层称，公共安全 DFR
              和国防合同每年带来的数亿美元收入及强劲单位经济性，已降低对外部资本的依赖，公司的重点转向国内制造产能 [CO011, CO012]。
            calloutType: insight
            claimRefs:
              - CO011
              - CO012
          - type: callout
            title: 地缘报复与供应链脆弱性
            body: >-
              中国政府于 2024 年末实施的正式制裁，成为 Skydio 运营韧性的生死考验。公司虽加快建立独立的非中国供应链，但替换专业无人机电池供应商和关键电子元件，仍需在 SkyForge
              计划下投入大量资本并培育国内供应商 [CO015, CO016]。
            calloutType: risk
            claimRefs:
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              本分析将 Skydio
              的核心市场定义为国防、公共安全、能源、交通、建筑及其他基础设施运营商使用的自主小型无人机系统。纳入的支出包括机体、光学或热成像载荷、机库与远程运营基础设施、机队软件、支持，以及执行持续任务所需的集成服务。消费娱乐、大型战略无人机、一次性攻击系统、反无人机拦截器、货运航空和无关的空中成像服务均排除在这一收窄后的市场边界之外。实际替代方案也不只是其他无人机品牌：买方可以继续采用警员优先响应、人工巡检、绳索作业、有人航空、固定摄像头，或内部组建无人机项目。Skydio
              自身的支持分类确认 X10、Dock and Remote Operations 与 Skydio Cloud 属于同一产品体系；独立公司介绍则将其业务覆盖公共安全、国防和能源。
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM014
      - number: '2.2'
        title: 避免虚假精确的市场规模证据
        blocks:
          - type: paragraph
            body: >-
              已分配证据不足以支持可辩护的自上而下 TAM、公司特定的可服务市场或可取得份额。Dataintelo 发布了全球“Skydio X10 市场”估算：2025 年 $3.2B，2034 年升至 $8.7B，CAGR
              为 11.7%；但其公开页面没有披露公司收入、销量、价格或采购数据，无法核对这个以厂商命名的类别。因此该数字仅作为低置信度外部估算保留，不能视为独立验证的市场规模。其他需求信号包括拟议的 FY2027
              美国国防预算：UAS 与反 UAS $1.5B、陆军无人机项目 $2B。这些是预算申请视角，不是 Skydio 的收入池，彼此重叠也未得到确认。Skydio 报告的未来 5 年国内投资 $3.5B
              同样是供应能力承诺，不是 TAM，也不是当前可用现金。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方、预算路径与采用证据
        blocks:
          - type: paragraph
            body: >-
              不同细分市场中，买方、使用者和付款方并不相同。国防项目办公室及盟国政府部门为一线部队采购战术侦察系统；市政机构为调度员和警员使用的无人机先行响应部署提供资金；公用事业及基础设施运营商为运营团队购买巡检和场地安防流程；交通与建筑组织则用无人机记录情况并巡检资产。现有最强的自下而上证据是已报告的部署，而非支出：已交付超过
              60,000 台无人机，客户超过 3,800 个，公共安全机构超过 1,200 个，关键基础设施企业超过 1,200 家（其中公用事业公司 250 家），美国州交通机构为 51 家中的 45
              家。这些群体彼此重叠，不能简单相加。报告称 DFR 在 71% 的观测呼叫中首次抵达，另有 23% 无需派出巡逻队即可处理；这说明了采用机制，但数据来自 Skydio
              内部分析，只是由独立出版方转述，不能当作独立有效性基准。
            claimRefs:
              - CM008
