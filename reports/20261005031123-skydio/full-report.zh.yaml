  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              Skydio 看起来变现的是一套集成系统，而不是单卖一架飞机。Sacra 描述客户直接购买无人机并订阅云软件；Skydio
              自身网站条款对产品的定义也足够宽，涵盖硬件、软件、配件和服务。现有证据支持四类潜在收入：机体与机库硬件、软件订阅、附件或配件，以及支持或监管服务。但合同期限、续约节奏、软件附加率、实际定价、折扣和收入确认政策均未披露。支持网站把潜在客户引向销售团队，没有公开价格表，因此公开标价不能作为实际收入的代理。该财务模式更适合被理解为混合型、合同驱动型模式，持续收入组合尚未证实，而不是
              SaaS 模式。
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI015
