      - number: '1.2'
        title: 高管领导、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Skydio 的高管体系仍高度围绕联合创始人 Adam Bry 和 Abraham Bachrach；两人早年在 MIT 和 Project Wing 的研究之后构思了公司的自主导航架构
              [CO001]。公司高度依赖核心工程管理团队来维持 AI 飞行引擎、自主机库方案及 Hayward 工厂的专业化硬件产线 [CO007]。来自电动车和规模化硬件制造商的资深人才也在帮助公司扩张运营，包括从
              Tesla 招募的前生产与运营负责人 [CO008]。董事会席位和主要治理影响力由领投多轮成长融资的头部风投及机构投资者掌握，突出包括 Andreessen Horowitz 和 Linse
              Capital；Axon Enterprise、KDDI、Next47 和 IVP 等伙伴也提供企业及战略协同
              [CO009]。关键人物依赖在自主软件架构和监管关系上尤其显著，但制造运营领导力已随着工厂持续扩建而趋于成熟 [CO007]。
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
