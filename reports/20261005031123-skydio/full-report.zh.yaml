      - number: '7.2'
        title: 监管、法律与数据暴露
        blocks:
          - type: paragraph
            body: >-
              公开材料证明合规范围广泛，但没有说明每款产品和每个司法辖区已完成哪些认证。合规职位明确负责建立政策、风险框架、要求清单、认证关口和上市准备签字。这说明公司正在投入控制体系，但不证明控制体系或每项认证已经成熟。Skydio
              隐私政策还提出具体数据义务：部分服务可能处理无人机或控制器的精确地理位置；Remote ID
              则可广播无人机序列号、位置、状态、速度、控制器位置和时间戳。政策还承诺在安全事件后通过邮件通知。网站条款不保证网站或产品持续可用、安全或无错误；这描述的是合同风险分配，不是产品故障记录。
            claimRefs:
