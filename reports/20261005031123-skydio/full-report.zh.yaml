  - id: FE001
    title: Skydio 端到端企业技术栈
    type: stack
    summary: 六层架构层级，展示硬件、机载自主能力与云端企业服务的端到端整合。
    data:
      layers:
        - label: 企业集成与云平台
          detail: Skydio Cloud、DFR Command、Remote Flight Deck 和 Skydio Extend REST API，可与 Axon、Trimble 和 Esri 集成。
        - label: 空域管理与冲突消解
          detail: Skydio Airspace Assurance System (SAAS)、ADS-B 冲突告警，以及多无人机协同空域冲突消解。
        - label: 任务与自主应用层
          detail: 3D Scan 自适应摄影测量、Pathfinder 地形感知路线规划、Foresight 固定翼自主飞行和 Shadow 跟踪。
        - label: 核心自主与空间 AI 引擎
          detail: 实时 360 度 SLAM、全球面避障（可避开直径低至 0.5 英寸的线缆），以及 NightSense 零光导航。
        - label: 硬件系统与机库基础设施
          detail: Skydio X10/X10D 四旋翼、R10 室内飞行器、F10 固定翼飞行器，以及用于远程 BVLOS 作业的防风雨密封 Skydio Dock。
        - label: 物理子系统与边缘计算
          detail: Nvidia Jetson 边缘计算处理器、360 度导航视觉阵列、FLIR Boson+ 热成像传感器和 RTK GPS。
