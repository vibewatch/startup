chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与运营模式
        blocks:
          - type: paragraph
            body: >-
              Skydio, Inc. 是一家美国航空航天与机器人公司，由 MIT 毕业生 Adam Bry（首席执行官）、Abraham Bachrach（首席技术官）和 Matt Donahoe 于 2014 年创立
              [CO001]。公司总部位于加州 San Mateo 的 3000 Clearview Way，并在加州 Hayward 一座 80,000 平方英尺的设施中开展主要规模化生产，同时在
              Boston、日本和印度设有区域工程及商业办公室 [CO002]。公司目前处于 Series F 阶段，研发自主无人驾驶航空系统（UAS）、机库基础设施和 AI
              驱动的软件指挥平台，服务公共安全、国防、资产巡检和关键基础设施监控 [CO003]。不同于依赖飞手摇杆控制的手动无人机架构，Skydio 让机载计算机视觉和 AI
              导航引擎自主执行飞行任务，把系统定位成自动化空中响应工具 [CO004]。商业模式将 X10 四旋翼、R10 室内巡检无人机和 Dock 充电基座等加固型双用途硬件平台，与 DFR Command、Ops
              Center 等多年期企业软件订阅结合 [CO005]。截至 2024 年末至 2026 年中，员工人数约为 731 至 ~1,000 人；已披露的在岗数据则显示全职员工约 900 至 1,067 人
              [CO006]。
