  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              风险排序依据的是已记录的运营广度和剩余证据缺口，而不是假定存在的事故历史。Skydio 首席执行官称，无人机需要同时掌握推进、光学、传感器、热成像、空气动力学、无线、移动及云软件、供应链、制造、物流和
              AI。公司撰写的合规职位公告还覆盖产品安全、无线电、蜂窝网络、电池、航空、网络安全、供应链和出口管制。合在一起，这些来源把执行和认证列为首要剩余风险。下一层是依赖风险：2024
              年证词把业务与先进半导体联系起来，并称当时部署到乌克兰的大多数 Skydio
              单位由美国政府购买并提供。财务风险同样重要，因为证据池只有历史融资和第三方收入估算，没有当前现金、烧钱速度、runway、细分利润率或集中度数据。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
