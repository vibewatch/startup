figures:
  - id: FO001
    title: Skydio 公司里程碑与发展时间线
    type: timeline
    summary: 按时间梳理 2014 至 2026 年塑造 Skydio 的公司创立、资本化、产品推出、军方合同和地缘政治事件。
    data:
      items:
        - date: '2014-06-01'
          label: 公司成立
          detail: MIT 校友 Adam Bry、Abraham Bachrach 和 Matt Donahoe 在加州圣马特奥创立公司，此前拒绝了 DJI 早期收购邀约。
        - date: '2015-01-15'
          label: 种子融资
          detail: 完成 $3M 种子轮融资，用机载计算机视觉展示自主避障能力。
        - date: '2019-10-01'
          label: Skydio 2 发布
          detail: 推出量产型自主四旋翼无人机，证明其在复杂户外环境中的自主跟踪能力。
        - date: '2021-03-01'
          label: Series D 融资与独角兽地位
          detail: 完成由 Andreessen Horowitz 领投的 $170M Series D，估值超过 $1B，用于加速企业无人机部署。
        - date: '2023-02-27'
          label: Series E 融资与 X10 发布
          detail: 由 Linse Capital 领投，融资 $230M、估值 $2.2B，并发布旗舰企业级 X10 无人机平台。
        - date: '2024-10-15'
          label: 中国政府制裁
          detail: 遭中国政府正式制裁，电池和关键零部件供应商渠道被切断，迫使供应链回迁。
        - date: '2026-03-01'
          label: 美国陆军 SRR 合同
          detail: 获得美国陆军 $52M 合同，供应约 3,000 套 X10D 系统；这是军史上最大单一供应商 sUAS 国防采购。
        - date: '2026-04-23'
          label: $4.4B 估值的 Series F 融资
          detail: 宣布完成 $110M Series F，投后估值 $4.4B，背后有经常性公共安全和国防软件收入支撑。
        - date: '2026-04-24'
          label: $3.5B 美国制造承诺
          detail: 承诺五年投入 $3.5B，启动 SkyForge 并扩大国内生产，新设施面积是 Hayward 工厂的五倍。
    approximationNotes: 日期代表公开确认的新闻稿日期、融资公告记录或监管合同备案日期。
    claimRefs:
      - CO001
      - CO004
      - CO010
      - CO011
      - CO014
      - CO015
      - CO016
