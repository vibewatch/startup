      - number: '7.4'
        title: 依赖、财务模型与终止标准
        blocks:
          - type: paragraph
            body: >-
              尽管没有集中度百分比，交易对手暴露仍然可见。2024 年证词称 Skydio 的成功依赖美国获得资本、软件专业能力和先进半导体，并指出美国政府是公司当时已部署乌克兰机队绝大多数单位的购买方和提供方。Sacra
              描述了一种客户购买飞机并订阅云服务的混合模式，同时列出 2024 年收入 $180M 和同比增长 80%；这些仍是第三方估算，不是经审计结果。Skydio 2021 年 Series D
              公告证明历史融资，不证明当前现金可用。若尽调发现重大认证延期、现场可靠性恶化、未缓释的单一来源零件、政府或头部客户集中度过高，或 runway 不足以支持制造和合规计划，投资论点就应中止或暂停。
