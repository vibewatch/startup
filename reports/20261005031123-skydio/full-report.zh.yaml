          - type: callout
            title: 用合同证据验证利润率假设
            body: 在认可软件级经济性之前，应索取产品层面毛利率、软件附加率和续约数据、实施成本、客户集中度及订单到回款的时间。
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI014
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合、飞行硬件与子系统模块化
        blocks:
          - type: paragraph
            body: >-
              Skydio 提供一套集成的自主无人机系统，利用 AI 自主能力取代人工驾驶，服务国防、公共安全和工业巡检。硬件阵容以旗舰 Skydio X10 企业级四旋翼及其国防强化版本 X10D 为核心，同时包括 R10
              室内巡检无人机、旧款 Skydio 2/2+ 和 X2 平台，以及已宣布的固定翼 F10
              Lightrunner。从客户流程看，这些飞机把空中数据采集从专业飞手团队交给现场技术员、第一响应人员和远程运营中心。X10 平台相较前代将机载计算能力和导航传感器分辨率提升 10 倍，从背包携带到起飞准备不到
              40 秒。模块化来自专业硬件附件，包括多传感器光学及辐射测温热成像载荷（采用 FLIR Boson+ 核心）、用于测量级地理精度的 Real-Time Kinematic（RTK）GPS
              模块，以及配备动态频率选择、可抵御争议军事环境 RF 干扰的多频段无线电链路。Skydio Dock for X10 是持续自主运营的核心：这是一座封闭式基站，可自动充电、提供环境保护并远程起飞，支持
              Drone-as-a-First-Responder（DFR）和自动化基础设施巡逻。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE011
          - type: table
            tableRef: TE001
