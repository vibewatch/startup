      - number: '8.2'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2014 年成立以来，Skydio 通过 8 轮不同融资累计获得超过 $825M 股权资本 [CV006]。历程包括 2015 年最初的 $3M Seed、2021 年由 Andreessen
              Horowitz 领投的 $170M Series D（估值 $1.0B，确立独角兽地位）、2022 年 $230M 的 Series E（估值 $2.2B），以及 2024 年 11 月由战略伙伴 KDDI 和
              Axon 参与的后续 $170M Series E extension [CV005, CV006, CV007, CV009]。2026 年 4 月的 Series F 按每股 $8.63 定价，涉及
              11.82 million 股 Series F 和 1.65 million 股 Series 1，体现 1.0x 非参与型清算优先权 [CV011]。Linse Capital 早期机构投资者演示曾预计截至
              2029 年的 5 年累计现金消耗为 $238M 至 $350M [CV007]。尽管现任管理层称高速增长和单位经济性正在让核心运营自我供血
              [CV002]，完整股权结构表、优先级层级和确切债务工具仍属机密，除非取得 data room 访问权限 [CV010]。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景分析与尽调路径
        blocks:
          - type: paragraph
            body: >-
              Skydio 的估值承销取决于持续性软件订阅与周期性硬件制造之间的走势。牛市情景下，自主 DFR 机库部署超过 10,000 个市镇，国防采购项目锁定多年机队更新周期，估值可超过
              $6.5B。基准情景下，Skydio 在公共安全和企业巡检领域保持温和的收入增长，但美国制造和零部件重构带来利润率压力，公允价值维持在 $3.5B 至 $4.4B
              附近。熊市情景考虑硬件交付瓶颈延长、联邦预算波动，或其他国内国防 UAS 厂商追赶，估值向 $2.0B 至 $2.5B 下压 [CV007, CV010]。关键尽调应审计 Skydio
              的软件年度经常性收入（ARR）、执法客户 cohort 的留存率，以及长期电池芯采购承诺 [CV012]。
            claimRefs:
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 资本稀缺是增长信号
            body: >-
              Skydio 将 Series F 限定为 $110M、估值定为
              $4.4B，明显不同于传统后期机器人融资。管理层称运营现金生成和单位经济性正在降低外部资本依赖，但投资者必须区分营运资金需求下降与高毛利持续性现金流。
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: callout
            title: 硬件依赖限制利润率
            body: >-
              尽管 Skydio 将自己定位为自主软件领导者，但 2023 年硬件贡献了其收入的 70%，毛利率为
              38.1%。此外，国际报复（尤其是中国对其供应链实施的制裁）表明，国内无人机领导地位伴随纯软件厂商不会面对的运营供应风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV010
