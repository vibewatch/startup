companyProfile:
  summary: >-
    Skydio is a U.S. autonomous drone company founded in 2014 by MIT alumni Adam Bry, Abraham Bachrach, and Matt
    Donahoe. It combines autonomous uncrewed aerial systems, docking hardware, and AI-enabled command software for
    public safety, defense, inspection, and critical-infrastructure workflows, with headquarters in San Mateo and scaled
    manufacturing in Hayward, California.
