        - track
        - >-
          Over 1,200 public safety agencies and U.S. Army program awards validate demand but audited margins are
          undisclosed
        - Monitor upcoming DFR expansion milestones and federal hardware contract awards
      - - Confidence
        - medium
        - Reported nine-figure revenues and $110M round verified; underlying GAAP financials remain private
        - Withhold primary buy recommendation pending verification of ARR growth and churn
