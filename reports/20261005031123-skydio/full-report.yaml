      - number: '5.3'
        title: Software Suites, Partner Integrations, and Technical Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Skydio monetizes its robotic platform through specialized vertical software applications and developer
              integration interfaces. The software portfolio includes DFR Command for public safety emergency dispatch
              and live video distribution, Security Command for autonomous facility perimeter patrols, Asset Command and
              3D Scan for adaptive industrial photogrammetry and millimeter-level crack inspection, and Ops Center for
              centralized fleet telemetry and Remote Flight Deck teleoperation. Through the Skydio Extend framework, the
              company provides open REST APIs, Webhook event subscriptions, and mobile SDKs enabling bi-directional data
              exchange with enterprise systems including Axon Evidence for law enforcement chain-of-custody, Esri ArcGIS
              for geospatial analysis, and Trimble Construction Cloud. In engineering survey and mapping, the Trimble
              collaboration establishes an automated workflow connecting X10 RTK drone capture with Trimble GNSS base
              stations and Trimble Business Center (TBC) for post-processed kinematic (PPK) and RTK survey accuracy.
              Despite these advanced capabilities, significant technical and operational risks persist. The enterprise
              architecture remains vulnerable to severe foreign supply chain shocks—demonstrated by Chinese export
              sanctions on critical battery cells—alongside public-safety liability risks when operating heavy
              autonomous quadcopters over populated areas, potential communication latency across commercial 5G cellular
              links during remote dock missions, and the developmental status of automated multi-cloud data
              synchronization workflows.
            claimRefs:
              - CE009
              - CE010
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE009
              - CE010
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Edge Autonomy in GPS-Denied Environments
            body: >-
              Unlike legacy manual quadcopters that rely heavily on satellite GPS fixes and constant pilot radio links,
              Skydio Autonomy executes computer vision SLAM and obstacle avoidance directly on onboard edge processors.
              This architectural choice enables full mission reliability in GPS-denied environments, around metallic
              structures, and in electronic warfare conditions.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: callout
            title: Airspace Regulatory Constraints and Battery Supply Exposure
            body: >-
              Scaling autonomous docking networks to support national Drone-as-a-First-Responder operations requires
              navigating strict FAA beyond-visual-line-of-sight waiver policies and altitude ceilings. Furthermore,
              ongoing geopolitical friction exposes the company's battery cell supply chain to trade restrictions,
              necessitating multi-year capital deployment to establish resilient domestic manufacturing alternatives.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base spans regulated public-sector and industrial workflows
        blocks:
          - type: paragraph
            body: >-
              Skydio's September 2026 release says its systems are trusted by more than 4,000 U.S. public-safety and
              critical-infrastructure agencies and organizations, every branch of the U.S. military, and the armed
              forces of 29 allied nations. The same release names AEP, Chevron, Dominion Energy, and Southern Company as
              early development partners for Asset Command, while older company material identifies construction,
              transportation, energy, police, and fire users. These disclosures support a multi-segment customer map,
              not a revenue mix: the 4,000-plus denominator combines agencies and organizations, does not distinguish
              paying customers from development partners, and provides no contract-value bands. India is addressed
              through Aeroarc as a development, manufacturing, and deployment channel rather than as evidence of a
              directly contracted end-customer base.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
