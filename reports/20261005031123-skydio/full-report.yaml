chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Skydio, Inc. is an American aerospace and robotics corporation founded in 2014 by MIT graduates Adam Bry
              (Chief Executive Officer), Abraham Bachrach (Chief Technology Officer), and Matt Donahoe [CO001].
              Headquartered at 3000 Clearview Way in San Mateo, California, the company maintains its primary scaled
              production operations in an 80,000-square-foot facility in Hayward, California, with supplementary
              regional engineering and commercial offices in Boston, Japan, and India [CO002]. Operating at Series F
              stage, Skydio engineers autonomous uncrewed aerial systems (UAS), docking infrastructure, and AI-enabled
              software command platforms designed for public safety, defense, asset inspection, and critical
              infrastructure monitoring [CO003]. Unlike manual drone architectures that rely on pilot stick-and-rudder
              control, Skydio designs computing systems where onboard computer vision and AI navigation engines execute
              flight operations autonomously, positioning systems as automated aerial responders [CO004]. The commercial
              model pairs ruggedized dual-use hardware platforms such as the X10 quadcopter, R10 indoor inspection
              drone, and Dock charging bases with multi-year recurring enterprise software licenses including DFR
              Command and Ops Center [CO005]. As of late 2024 to mid-2026, employee counts range between 731 and ~1,000
              personnel, with active workforce disclosures indicating ~900 to 1,067 full-time employees [CO006].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
