  - id: TV002
    title: Thesis and Anti-Thesis Matrix
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Disconfirming Catalyst / Thesis Break
    rows:
      - - Investment Thesis
        - Category leadership in autonomous DFR and protected U.S. defense positioning
        - 1,200+ police departments, 45 of 51 state DOTs, and $52M U.S. Army contract
        - Loss of Blue UAS compliance, procurement freezes, or major autonomy flight safety failures
      - - Investment Thesis
        - Declining capital intensity and self-funding core business
        - Raised only $110M in Series F despite oversubscribed interest; reported nine-figure revenue
        - Sudden return to venture markets for large dilutive working capital or down-round financing
      - - Anti-Thesis
        - Hardware margin compression and vulnerability to international sanctions
        - Historical 38.1% gross margin and battery supply bottlenecks from Chinese sanctions
        - Proof of audited gross margins exceeding 60% with complete domestic supply chain resilience
      - - Anti-Thesis
        - Valuation multiple ahead of underlying recurring software revenue
        - 30% software revenue share in 2023 with balance dependent on physical drone sales
        - Software ARR growing past 60% of total revenue with net retention above 120%
    notes: >-
      Thesis drivers contrast enterprise/defense adoption against manufacturing margin constraints and supply chain
      exposure.
