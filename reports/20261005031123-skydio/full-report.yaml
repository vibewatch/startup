      - number: '6.2'
        title: Adoption proof is tangible but uneven in freshness and independence
        blocks:
          - type: paragraph
            body: >-
              The strongest outcome evidence in the assigned pool is Skydio's 2021 account of Sundt Construction. It
              says Sundt began using drones in 2013, saw adoption begin to grow in 2018, and reduced new-pilot training
              from six or seven hours to three with Skydio. The account also identifies FAA Part 107 certification and
              training as sources of implementation delay. This is useful production-workflow evidence, but it is
              historical and hosted by Skydio. The reported population figures of more than 1,900 corporations and
              government agencies in February 2024 and more than 4,000 agencies and organizations in September 2026 are
              not a clean growth series because the labels, geography, and inclusion rules differ. Planned 2027
              deployments and general availability are roadmap signals, not current adoption.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
