  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk domain
      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Portfolio certification and launch readiness
        - U.S. and international product markets
        - Company job post describes a compliance system being built; product-level certificate inventory is not public
        - Medium
        - High
        - 'Building: director ownership, risk framework, requirements inventory, and launch sign-off are specified'
        - High until certificates, exceptions, and launch gates are inspected
        - Obtain the product-by-jurisdiction certification matrix, open findings, renewal calendar, and launch waivers
      - - Aviation, radio, battery, cybersecurity, supply-chain, and export obligations
        - Civil aviation, telecom, product safety, federal procurement, and export regimes
        - Company role explicitly identifies these domains; applicable approvals and open findings are not enumerated
        - Medium
        - High
        - 'Building: dedicated compliance engineers and external specialists are contemplated'
        - High because one delayed approval can constrain a launch or market
        - Review FAA, EASA, Remote ID, FCC, carrier, battery, cybersecurity, and export-control evidence by product
      - - Precise geolocation and Remote ID data
        - California, United States, Japan, and other applicable privacy regimes
        - Privacy policy documents selected-service geolocation processing and required Remote ID broadcasts
        - Medium
        - High
        - Documented policy and customer-contract controls; technical audit evidence is not in the pool
        - Medium, subject to security architecture and government-customer contract terms
        - Inspect data maps, retention settings, access logs, subprocessors, incident tests, and customer DPAs
      - - Product availability, security, and error warranties
        - Public website and product usage terms
        - Usage policy disclaims a warranty of uninterrupted, secure, or error-free operation
        - Unknown
        - Medium
        - Legal allocation is public; enterprise warranty and indemnity terms are unavailable
        - Medium because public terms do not show negotiated customer liability
        - Review enterprise MSAs, limited warranty claims, indemnities, liability caps, and dispute history
    notes: >-
      Analyst likelihood and severity are qualitative, based only on the cited company policies and company-issued
      compliance role; no incident frequency is inferred. The register is partial because product-level approvals,
      litigation, enforcement, and customer contracts were not available in the assigned pool.
    enumerationScope:
      coverage: partial
      basis: >-
        Public risk domains evidenced by the assigned compliance job post, privacy policy, website usage policy, and
        pre-IPO risk page as of 2026-10-05.
