    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / factor
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Advanced semiconductors and software expertise
        - U.S. technology ecosystem
        - Inputs to autonomy and product execution
        - CEO testimony says company success rests on these U.S. advantages; supplier shares are not disclosed
        - Allocation, redesign, export, or obsolescence shock delays production or degrades capability
        - Critical
        - No supplier-diversification evidence in the assigned pool; request it directly
        - High until bills of material, allocations, alternates, and redesign lead times are verified
      - - Government procurement
        - U.S. government
        - Purchaser and provider of most Skydio units then deployed to Ukraine
        - Material program exposure is evident, but company-wide revenue concentration is not disclosed
        - Budget, procurement, policy, or deployment changes create order volatility
        - High
        - Commercial and public-safety end markets are described elsewhere, but mix is unquantified here
        - High until top-program, top-customer, backlog, and cancellation data are reviewed
      - - Hybrid hardware and cloud economics
        - Customers and recurring cloud subscriptions
        - Aircraft purchase plus software subscription model
        - Revenue mix, renewal, attach rate, and segment margin are not disclosed
        - Hardware working capital and margin dominate before recurring software reaches sufficient scale
        - High
