        - High because reliability depends on many tightly coupled engineering domains
        - No current defect, crash, return, recall, or mission-success cohorts
      - - Manufacturing scale, yield, or delivery slippage
        - Medium
        - High
        - Historical company claim of more than 1,000 drones per month in 2024
        - High because current capacity, yield, backlog, and supplier redundancy are undisclosed
        - No current throughput, first-pass yield, scrap, backlog aging, or on-time-delivery data
      - - Security incident or customer notification failure
        - Unknown
        - High
        - Privacy policy states that customers will be contacted by email after a security incident
        - High because prevention, detection, recovery, and notification test results are not public
        - No incident history, recovery objectives, penetration-test results, or tabletop-test evidence
      - - Support response or field-service shortfall
        - Unknown
        - Medium
