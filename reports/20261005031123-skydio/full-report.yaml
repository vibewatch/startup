        - Historical funding supports expansion
        - A 2021 company release records capital raised, not cash remaining in 2026
        - Manufacturing and compliance investment outruns internally generated cash
        - High
        - No current mitigation can be confirmed from the assigned sources
        - High until cash, burn, runway, debt, working capital, and capex are disclosed
