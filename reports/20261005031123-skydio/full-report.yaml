figures:
  - id: FO001
    title: Skydio Corporate Milestone and Development Timeline
    type: timeline
    summary: >-
      Chronology of key corporate founding, capitalization, product introductions, military contracts, and geopolitical
      events shaping Skydio from 2014 through 2026.
    data:
      items:
        - date: '2014-06-01'
          label: Company Founded
          detail: >-
            Founded in San Mateo, California by MIT alumni Adam Bry, Abraham Bachrach, and Matt Donahoe after rejecting
            an early acquisition overture from DJI.
        - date: '2015-01-15'
          label: Seed Financing
          detail: Closed $3M seed round to demonstrate autonomous obstacle avoidance using onboard computer vision.
        - date: '2019-10-01'
          label: Skydio 2 Launch
          detail: >-
            Introduced mass-production autonomous quadcopter, proving autonomous tracking capabilities in complex
            outdoor environments.
        - date: '2021-03-01'
          label: Series D & Unicorn Status
          detail: >-
            Raised $170M Series D led by Andreessen Horowitz at a valuation exceeding $1B to accelerate enterprise drone
            deployments.
        - date: '2023-02-27'
          label: Series E Financing & X10 Launch
          detail: Secured $230M led by Linse Capital at a $2.2B valuation and unveiled flagship enterprise X10 drone platform.
        - date: '2024-10-15'
          label: Chinese Ministry Sanctions
          detail: >-
            Subjected to formal sanctions by the Chinese government, terminating battery and critical component vendor
            access and necessitating supply chain reshoring.
        - date: '2026-03-01'
          label: U.S. Army SRR Award
          detail: >-
            Awarded $52M contract by the U.S. Army to supply approximately 3,000 X10D systems in the largest
            single-vendor sUAS defense purchase in military history.
        - date: '2026-04-23'
          label: Series F Financing at $4.4B Valuation
          detail: >-
            Announced $110M Series F round at a $4.4B post-money valuation, supported by recurring public safety and
            defense software revenues.
        - date: '2026-04-24'
          label: $3.5B U.S. Manufacturing Commitment
          detail: >-
            Committed $3.5B over five years to launch SkyForge and expand domestic production with a new facility five
            times larger than Hayward.
    approximationNotes: Dates represent publicly confirmed press release dates, funding announcement records, or regulatory award filings.
    claimRefs:
      - CO001
      - CO004
      - CO010
      - CO011
      - CO014
      - CO015
      - CO016
