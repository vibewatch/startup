              - CU004
              - CU005
              - CU006
              - CU009
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU009
              - CU013
      - number: '6.3'
        title: The operating motion targets retention and expansion, but outcomes are undisclosed
        blocks:
          - type: paragraph
            body: >-
              Two 2026 company job reposts describe a hands-on post-sale model. The public-safety Customer Success role
              covers implementation, usage, retention, expansion, renewals, and account risk, while the site- security
              deployment role moves customers from evaluation and pilots into repeatable operations and tracks
              post-deployment benefits. These responsibilities are evidence that Skydio is building a land-and-expand
              operating motion; they are not evidence of achieved gross retention, net retention, churn, renewal timing,
              or expansion rates. Skydio's website policy also restricts publication of benchmarking or performance data
              without advance written notice, which may make public outcome verification harder. The investment case
              therefore needs cohort-level data-room evidence rather than treating the existence of Customer Success
              roles as proof of durable revenue.
            claimRefs:
              - CU010
              - CU011
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Partners extend workflows and geography while obscuring economics
        blocks:
          - type: paragraph
            body: >-
              Optelos supplies a credible integration route for asset inspection: its 2022 release describes Skydio
              imagery flowing into visual-data management, AI analysis, and remediation workflows. Aeroarc provides a
              separate route into Indian and Indo-Pacific defense markets through local development, manufacturing,
              deployment, and support. These relationships broaden customer access, but neither release discloses
              revenue share, exclusivity, active installed base, renewal behavior, or partner- sourced revenue. Baltic
              Defense Initiative likewise cautions that supplier-reported order values do not allocate value among
              aircraft, support, and other contract elements. No assigned source discloses top-customer or top-channel
              concentration, so durability cannot be inferred from named logos, aggregate organization counts, or large
              order headlines.
            claimRefs:
              - CU012
              - CU013
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer visibility is process-rich but metric-poor
            body: >-
              Public material describes pilots, onboarding, deployment, renewals, and expansion work, yet provides no
              NRR, GRR, churn, contract-length, cohort, or concentration figures. Require customer-level revenue and
              renewal schedules before underwriting durability.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The risk ranking is driven by documented operating breadth and by the size of the remaining evidence gaps,
              not by an assumed incident history. Skydio's chief executive described drones as requiring simultaneous
              mastery of propulsion, optics, sensors, thermals, aerodynamics, wireless, mobile and cloud software,
              supply chain, manufacturing, logistics, and AI. A company-authored compliance job post separately spans
              product safety, radio, cellular, battery, aviation, cybersecurity, supply chain, and export controls.
              Together, those sources make execution and certification the leading residual risk. The next tier is
              dependency risk: 2024 testimony linked the business to advanced semiconductors and stated that most Skydio
              units then deployed to Ukraine were purchased and provided by the U.S. government. Financial risk is also
              material because the pool contains historical funding and a third-party revenue estimate, but no current
              cash, burn, runway, segment margin, or concentration data.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR009
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              Public materials demonstrate that compliance is broad, but they do not establish which certifications are
              complete for each product and jurisdiction. The compliance role is explicitly tasked with building policy,
              a risk framework, a requirements inventory, certification gates, and launch-readiness sign-off. That is
              evidence of an active control investment, not proof that the control system or every certification is
              mature. Skydio's privacy policy adds concrete data obligations: selected services may process precise
              drone or controller geolocation, while Remote ID can broadcast the drone serial number, position, status,
              speed, controller position, and a timestamp. The policy also promises email notification after a security
              incident. Website terms disclaim a warranty that websites or products will be uninterrupted, secure, or
              error-free; this describes contractual risk allocation rather than a record of product failure.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.3'
        title: Operational, quality, and support risk
        blocks:
          - type: paragraph
            body: >-
              Manufacturing evidence is encouraging but stale for a current capacity judgment. In June 2024 testimony,
              Skydio said it built more than one thousand drones per month and planned to scale further; the same
              testimony emphasized the difficulty of integrating hardware, software, supply chain, manufacturing, and AI
              at high reliability and low cost. Those statements support a meaningful scale base while also defining the
              execution surface that could create yield, reliability, delivery, or quality problems. The assigned
              evidence does not report defect rates, warranty returns, crashes, recalls, outages, security incidents,
              service-level commitments, or current factory yields. Skydio publishes a support case channel and
              operating hours, and its privacy policy describes incident notification, but neither source measures
              response performance. Investment underwriting should therefore treat operational resilience as unverified
              until cohort-level reliability and support data are produced.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR011
      - number: '7.4'
        title: Dependencies, financial model, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Counterparty exposure is visible even though concentration percentages are not. The 2024 testimony said
              Skydio's success rested on U.S. access to capital, software expertise, and advanced semiconductors, and it
              identified the U.S. government as the purchaser and provider of the vast majority of the company's
              then-deployed Ukraine units. Sacra describes a hybrid model in which customers buy aircraft and subscribe
              to cloud services; it also lists $180 million of 2024 revenue and 80% year-over-year growth, figures that
              remain third-party estimates rather than audited results. Skydio's 2021 Series D announcement proves
              historical capital raised, not current cash availability. The investment thesis should break or pause if
              diligence shows material certification slippage, worsening field reliability, an unmitigated sole-source
              component, excessive government or top-customer concentration, or runway insufficient to fund the
              manufacturing and compliance plan.
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence gates before underwriting the residual risk
            body: >-
              Require a product-by-jurisdiction certification inventory, field reliability and security-incident
              cohorts, supplier concentration and qualified-alternate evidence, top-customer and government-program
              concentration, and current cash, burn, runway, debt, working-capital, capex, and segment-margin data.
              Pause the thesis if a launch depends on an unresolved critical certification, a sole-source component
              lacks a qualified alternate, reliability trends breach customer SLAs, or available liquidity cannot fund
              the operating plan through the next financing milestone.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Skydio has established itself as the preeminent domestic autonomous unmanned aerial system (UAS)
              manufacturer, capitalizing on stringent federal restrictions on foreign competitors and rapid adoption of
              Drone as First Responder (DFR) programs across more than 1,200 public safety agencies [CV004, CV008]. The
              company raised $110 million in Series F financing in April 2026 at a $4.4 billion post-money valuation
              [CV001, CV002, CV003]. CEO Adam Bry characterized the modest financing size as evidence of rapidly
              declining operational cash needs, supported by hundreds of millions in annual revenue and positive unit
              economics [CV002, CV004]. However, while Skydio benefits from massive geopolitical tailwinds—including a
              $52 million contract with the U.S. Army for 3,000 X10D systems [CV004]—the business remains capital
              intensive and exposed to international supply chain shocks, such as Chinese sanctions that disrupted
              critical battery components [CV007]. Consequently, we maintain a track recommendation with high risk and a
              stretched valuation stance pending audited disclosures of gross margin and recurring software mix [CV010].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Skydio has accumulated more than $825 million in total equity capital across eight distinct financing
              rounds since its founding in 2014 [CV006]. The progression spans an initial $3 million Seed in 2015, a
              $170 million Series D led by Andreessen Horowitz in 2021 that established unicorn status at a $1.0 billion
              valuation, a $230 million Series E in 2022 at $2.2 billion, and a subsequent $170 million Series E
              extension in November 2024 with participation from strategic partners KDDI and Axon [CV005, CV006, CV007,
              CV009]. The April 2026 Series F was priced at $8.63 per share across 11.82 million Series F shares and
              1.65 million Series 1 shares, reflecting a 1.0x non-participating liquidation preference [CV011]. Prior
              institutional investor presentations from Linse Capital had anticipated five-year cumulative cash burn of
              $238 million to $350 million through 2029 [CV007]. Although current management states that hypergrowth and
              unit economics are self-funding core operations [CV002], the complete capitalization table, seniority
              tiers, and exact debt instruments remain confidential without data room access [CV010].
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Analysis and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Valuation underwriting for Skydio hinges on the trajectory of recurring software subscriptions versus
              cyclical hardware manufacturing. Under a bull scenario, autonomous DFR dock deployments scale past 10,000
              municipalities and defense procurement programs lock in multi-year fleet refresh cycles, justifying a
              valuation exceeding $6.5 billion. In our base case, Skydio sustains moderate top-line expansion across
              public safety and enterprise inspection but encounters margin pressure from U.S.-based manufacturing and
              component re-engineering, maintaining a fair value near $3.5 billion to $4.4 billion. A bear scenario
              accounts for extended hardware delivery bottlenecks, federal budget volatility, or competitive catch-up by
              other domestic defense UAS vendors, depressing valuation toward the $2.0 billion to $2.5 billion range
              [CV007, CV010]. Essential diligence priorities require auditing Skydio's software annual recurring revenue
              (ARR), customer retention rates within law enforcement cohorts, and long-term battery cell sourcing
              commitments [CV012].
            claimRefs:
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Scarcity as a Growth Signal
            body: >-
              Skydio's decision to limit its Series F to $110 million at a $4.4 billion valuation is a notable departure
              from conventional late-stage robotics financings. While management indicates that operational cash
              generation and unit economics are reducing external capital dependence, investors must distinguish between
              declining working capital requirements and high-margin recurring cash flow.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: callout
            title: Hardware Dependency and Margin Capping
            body: >-
              Despite positioning as an autonomous software leader, Skydio generated 70% of revenue from hardware in
              2023 with a 38.1% gross margin. Furthermore, international retaliation—specifically Chinese sanctions
              against its supply chain—underscores that domestic drone leadership carries operational supply risks that
              pure-play software vendors never face.
            calloutType: risk
            claimRefs:
              - CV007
              - CV010
