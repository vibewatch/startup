callouts:
  - calloutType: "insight"
    title: "Capital Scarcity as a Growth Signal"
    body: "Skydio's decision to limit its Series F to $110 million at a $4.4 billion valuation is a notable departure from conventional late-stage robotics financings. While management indicates that operational cash generation and unit economics are reducing external capital dependence, investors must distinguish between declining working capital requirements and high-margin recurring cash flow."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
  - calloutType: "risk"
    title: "Hardware Dependency and Margin Capping"
    body: "Despite positioning as an autonomous software leader, Skydio generated 70% of revenue from hardware in 2023 with a 38.1% gross margin. Furthermore, international retaliation—specifically Chinese sanctions against its supply chain—underscores that domestic drone leadership carries operational supply risks that pure-play software vendors never face."
    claimRefs:
      - "CV007"
      - "CV010"
