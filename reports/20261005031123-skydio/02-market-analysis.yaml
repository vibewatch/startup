company:
  name: "Skydio"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Skydio addresses a compliance-sensitive intersection of defense reconnaissance, public-safety response, and critical-infrastructure inspection rather than one cleanly measured drone market. Public evidence shows meaningful adoption and policy-driven demand, but the only allocated market forecast is a low-confidence, vendor-named estimate that cannot support a defensible TAM/SAM/SOM without procurement and revenue data."

sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      This analysis defines Skydio's core market as autonomous small-drone systems used by
      defense, public-safety, energy, transportation, construction, and other
      infrastructure operators. Included spend comprises airframes, optical or thermal
      payloads, docks and remote-operation infrastructure, fleet software, support, and
      integration needed to execute recurring missions. Consumer recreation, large
      strategic unmanned aircraft, one-way attack systems, counter-drone interceptors,
      cargo aviation, and unrelated aerial-imaging services are excluded from the
      constrained market boundary. The practical substitutes are also broader than other
      drone brands: buyers can continue officer-first response, manual inspection,
      rope-access work, manned aviation, fixed cameras, or internally assembled drone
      programs. Skydio's own support taxonomy confirms that X10, Dock and Remote
      Operations, and Skydio Cloud belong to one product system, while independent
      company descriptions place the offer across public safety, defense, and energy.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM014"
    tableRefs:
      - "TM001"

  - id: "sizing-evidence"
    title: "Sizing Evidence Without False Precision"
    body: >-
      The allocated evidence does not support a defensible top-down TAM, a company-specific
      serviceable market, or an obtainable share. Dataintelo publishes a global
      "Skydio X10 market" estimate of $3.2 billion in 2025, rising to $8.7 billion in 2034
      at an 11.7% CAGR, but the public page does not expose the underlying company revenue,
      unit, price, or procurement data needed to reconcile that vendor-named category.
      The figure is therefore retained as a low-confidence external estimate, not treated
      as independently validated market size. Separate demand signals include proposed
      FY2027 U.S. defense allocations of $1.5 billion for UAS and counter-UAS and $2
      billion for Army drone programs. Those are budget-request lenses, not Skydio
      revenue pools, and their overlap is not established. Skydio's reported $3.5 billion
      five-year domestic investment is likewise a supply-capacity commitment, not TAM or
      cash currently available.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
    tableRefs:
      - "TM002"

  - id: "buyers-and-adoption"
    title: "Buyers, Budget Paths, and Adoption Evidence"
    body: >-
      Buyer, user, and payer differ by segment. Defense program offices and allied
      ministries procure tactical reconnaissance systems for field units; municipal
      agencies fund drone-as-first-responder deployments used by dispatchers and officers;
      utilities and infrastructure operators buy inspection and site-security workflows
      for operations teams; and transportation or construction organizations deploy
      drones for documentation and asset inspection. The strongest allocated bottom-up
      evidence is reported deployment rather than expenditure: more than 60,000 drones
      shipped, more than 3,800 customers, over 1,200 public-safety agencies, over 1,200
      critical-infrastructure companies including 250 utilities, and 45 of 51 U.S. state
      transportation agencies. These populations overlap and cannot be summed. Reported
      DFR outcomes - first arrival in 71% of observed calls and 23% cleared without patrol
      dispatch - describe an adoption mechanism, but they come from Skydio's internal
      analysis as relayed by an independent publisher and are not an independent
      effectiveness benchmark.
    claimRefs:
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM003"
    figureRefs:
      - "FM001"

  - id: "drivers-and-constraints"
    title: "Adoption Drivers, Constraints, and Valuation Relevance"
    body: >-
      Adoption is pulled by public procurement, demand for remote inspection, worker and
      officer safety, and the ability to reuse one autonomous platform across several
      missions. Domestic manufacturing commitments may improve capacity and supplier
      depth, while the proposed defense budgets indicate policy support for unmanned
      systems. The constraints are equally material: buyers must obtain operational
      authorization, integrate dispatch or asset systems, justify capital and recurring
      software spend, and manage privacy, reliability, and over-people flight risk.
      DroneXL reported a June 2026 NYPD drone crash and battery fire near a crowded event;
      no one was injured, but the cause remained undetermined. The NYPD described a
      malfunction while Skydio said available logs showed no evidence of a safety
      malfunction. That unresolved incident does not establish a fleet-wide defect, but it
      raises diligence needs around failure rates, root-cause closure, insurance, and
      recovery systems. Valuation should therefore rely on verified segment revenue,
      margins, renewals, and deployment economics rather than the broad market forecast.
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM013"
      - "CM015"
      - "CM016"

