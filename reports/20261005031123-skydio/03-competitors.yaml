callouts:
  - calloutType: "risk"
    title: "The pool does not prove a price-performance moat"
    body: "The strongest superiority claims trace to Skydio or to a market-data page without a reproducible test appendix. Direct buyer quotes, standardized mission tests, and realized contract pricing are required before underwriting an enduring premium."
    claimRefs:
      - "CP005"
      - "CP007"
      - "CP014"

  - calloutType: "recommendation"
    title: "Underwrite the regulated-channel advantage, not universal leadership"
    body: "Skydio's best-supported edge is the combination of autonomy positioning, domestic production, and U.S. procurement eligibility. Treat commercial-market leadership and switching costs as hypotheses until segment-level win/loss and renewal data are available."
    claimRefs:
      - "CP002"
