callouts:
  - calloutType: "strength"
    title: "Edge Autonomy in GPS-Denied Environments"
    body: "Unlike legacy manual quadcopters that rely heavily on satellite GPS fixes and constant pilot radio links, Skydio Autonomy executes computer vision SLAM and obstacle avoidance directly on onboard edge processors. This architectural choice enables full mission reliability in GPS-denied environments, around metallic structures, and in electronic warfare conditions."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "Airspace Regulatory Constraints and Battery Supply Exposure"
    body: "Scaling autonomous docking networks to support national Drone-as-a-First-Responder operations requires navigating strict FAA beyond-visual-line-of-sight waiver policies and altitude ceilings. Furthermore, ongoing geopolitical friction exposes the company's battery cell supply chain to trade restrictions, necessitating multi-year capital deployment to establish resilient domestic manufacturing alternatives."
    claimRefs:
      - "CE006"
      - "CE008"
      - "CE015"
      - "CE016"
