        - id: deployment-support
          label: Deployment and support
          detail: "Support channel exists; service cost and revenue contribution are undisclosed"
        - id: gross-profit
          label: Gross profit
          detail: "No public gross margin or contribution-margin bridge"
        - id: reinvestment
          label: Production and product reinvestment
          detail: "Management says core operations fund more future bets, while manufacturing remains demanding"
    approximationNotes: >-
      Ordered analytical bridge only; node widths and sequence do not represent value, conversion,
      margin, timing, or a common population.
    claimRefs: [CI005, CI010, CI013]
