company:
  name: Skydio
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a hybrid hardware-and-software model and meaningful scale, but the
    strongest current operating claims remain management assertions. Independent estimates place
    2024 revenue at $180 million, while audited revenue, gross margin, cash, burn, runway, pricing,
    recurring mix, and customer concentration remain unavailable for underwriting.
sections:
  - id: revenue-model
    title: Revenue architecture and monetization
    body: >-
      Skydio appears to monetize an integrated system rather than a single aircraft sale. Sacra
      describes customers purchasing drones outright and subscribing to cloud software, while
      Skydio's own website terms define products broadly enough to include hardware, software,
      accessories, and services. That evidence supports four potential revenue streams: aircraft
      and dock hardware, software subscriptions, attachments or accessories, and support or
      regulatory services. It does not disclose contract duration, renewal cadence, software
      attach rate, realized pricing, discounting, or revenue-recognition policy. The support site
      directs prospects to sales rather than exposing a price card, so public list pricing cannot
      be treated as a proxy for realized revenue. The financial model is therefore best viewed as
      hybrid and contract-led, with an unproven recurring-revenue mix rather than a SaaS model.
    claimRefs: [CI005, CI009, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction evidence and revenue quality
    body: >-
      The public scale signals are material but heterogeneous. Sacra and Multiples both report
      $180 million of 2024 revenue, and Sacra reports 80% year-over-year growth; these are
      third-party estimates rather than audited statements. In April 2026 Skydio said its core
      business generated hundreds of millions in annual revenue, had strong unit economics and
      hypergrowth, and increasingly funded operations and future bets. Sourcery separately
      reported 60,000 robots shipped and more than 3,800 enterprise customers, which provides
      operational context but cannot be converted into average selling price because shipment
      periods, product mix, bundled software, and customer cohorts are not disclosed. Multiples'
      historical 12.2x ratio uses a $2.2 billion valuation and $180 million revenue recorded in
      November 2024; it is not a current operating multiple and may use run-rate or LTM revenue.
    claimRefs: [CI002, CI006, CI007, CI011]
    tableRefs: [TI003]
  - id: cost-structure-and-capital
    title: Cost structure, production intensity, and capital adequacy
    body: >-
      The available evidence points to a capital-intensive operating model even as management
      argues that external capital needs are falling. Skydio raised $110 million in April 2026 and
      said the proceeds would accelerate production across public safety, defense, infrastructure,
      and site security. Sourcery reported that production was the primary constraint, that the
      company planned to triple output during 2026, and that a $52 million Army order covered
      3,000 drones. Those facts indicate manufacturing throughput, hardware working capital,
      deployment, and support are economically important, but they do not disclose bill-of-
      materials cost, inventory turns, gross margin, service burden, or order-level profitability.
      Funding raised is not cash available: without the post-round cash balance, debt terms,
      operating cash flow, and committed capex schedule, runway and the next financing trigger
      cannot be calculated.
    claimRefs: [CI001, CI003, CI004, CI012]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Revenue quality is potentially attractive because hardware can seed software and service
      relationships, but the evidence does not show what portion recurs, renews, or carries
      software-like margin. Management's claim of strong unit economics is directionally
      encouraging and is echoed by industry coverage, yet no retained source provides cohort
      retention, contribution margin, CAC, payback, or support cost. The adverse case is not that
      the business lacks demand; it is that physical-product learning cycles are slower and more
      expensive than software, while scaling production can consume cash before revenue is
      collected. The appropriate underwriting posture is therefore evidence-constrained:
      recognize credible scale indicators, but require audited statements, contract-level
      economics, backlog conversion, concentration, working-capital data, and a cash bridge before
      assigning a durable margin path or financing runway.
    claimRefs: [CI002, CI003, CI013, CI014]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $110 million Series F establishes new financing, not current cash, burn, or runway.
      Those inputs remain private and must be obtained before capital adequacy can be underwritten.
    claimRefs: [CI001, CI014]
  - calloutType: recommendation
    title: Gate the margin thesis on contract evidence
    body: >-
      Request product-level gross margin, software attach and renewal data, implementation cost,
      customer concentration, and order-to-cash timing before crediting software-grade economics.
    claimRefs: [CI002, CI014]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Aircraft and docks, "Outright system purchase", "Unit or contracted system", "Existence supported; price and mix undisclosed", "Transactional hardware revenue", "Bookings, shipments, ASP, backlog conversion, and warranty cost"]
      - [Cloud software, "Subscription alongside purchased drones", "Subscription term not disclosed", "Mechanism reported by Sacra; attach rate undisclosed", "Potentially recurring but unquantified", "ARR, attach rate, renewal, NRR, term, and deferred revenue"]
      - [Accessories and attachments, "Product purchase", "Accessory or attachment", "Category named in company terms; pricing undisclosed", "Likely transactional; mix unknown", "SKU revenue, margin, discounting, and replacement cadence"]
      - [Services and support, "Support, regulatory, and other services", "Service scope not disclosed", "Service category and staffed support channel observed", "Could be recurring or labor-intensive", "Service revenue, delivery hours, utilization, and contribution margin"]
    notes: >-
      Stream existence is based on retained official pages and Sacra; no source discloses revenue
      mix, realized pricing, contract length, or recognition policy, so all quality assessments are
      analytical qualifications rather than reported segment results.
    claimRefs: [CI005, CI009, CI010]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Offer, Public price, Contract model evidence, Discount visibility, Underwriting implication]
    rows:
      - [Aircraft and dock systems, null, "Direct or contracted purchase", "Not disclosed", "Cannot derive hardware ASP or realized margin"]
      - [Cloud software, null, "Subscription reported by Sacra", "Not disclosed", "Recurring mix and renewal economics remain unknown"]
      - [Accessories and services, null, "Purchase categories named by Skydio", "Not disclosed", "Bundling may obscure product-level profitability"]
      - [Public-sector orders, null, "$52M / 3,000-drone Army order reported by Sourcery", "Scope and non-aircraft content not disclosed", "Do not infer per-drone price from aggregate order value"]
    notes: >-
      Null means no public price was found in the assigned prefetched evidence. The Army order
      value is retained as reported and is not divided by units because bundled scope, services,
      timing, and options are unknown.
    claimRefs: [CI005, CI009, CI010, CI012, CI015]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - ["2024 revenue", "$180M third-party estimate", Medium, "Anchors historical scale but is unaudited", "Audited revenue and recognition policy"]
      - ["2024 revenue growth", "80% year over year per Sacra", Medium, "Indicates growth but not revenue durability", "Monthly cohorts, backlog conversion, and organic growth bridge"]
      - ["2026 annual revenue", "Hundreds of millions, company-claimed", Medium, "Suggests continued scale without a precise denominator", "2025 audited revenue and 2026 YTD monthly results"]
      - ["Gross margin", null, Low, "Determines whether hardware scale creates or consumes cash", "Product, software, and service gross margins with allocation policy"]
      - ["CAC and payback", null, Low, "Tests efficiency of enterprise and public-sector GTM", "Fully loaded CAC, sales cycle, win rate, and payback by segment"]
      - ["Cash, burn, and runway", null, Low, "Required to assess financing dependency", "Post-Series-F cash, debt, monthly burn, capex, and downside runway"]
    notes: >-
      Revenue values are third-party estimates or company claims, not audited results. Null means
      the metric is absent from the assigned evidence and should be treated as a diligence gap, not
      zero or immaterial.
    claimRefs: [CI002, CI003, CI006, CI007, CI014]
