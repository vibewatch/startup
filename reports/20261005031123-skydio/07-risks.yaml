company:
  name: "Skydio"
chapter:
  number: 7
  title: "Risks"
  summary: "Skydio's highest public-evidence risks are execution across a tightly integrated hardware, software, manufacturing, and compliance stack; dependence on government demand and advanced semiconductors; and limited visibility into current liquidity and operating economics. The available sources show mitigation activity, but they do not quantify certification completion, field reliability, customer concentration, cash burn, or runway."

sections:
  - id: "risk-ranking-and-investment-implication"
    title: "Risk ranking and investment implication"
    body: >-
      The risk ranking is driven by documented operating breadth and by the size of the
      remaining evidence gaps, not by an assumed incident history. Skydio's chief executive
      described drones as requiring simultaneous mastery of propulsion, optics, sensors,
      thermals, aerodynamics, wireless, mobile and cloud software, supply chain,
      manufacturing, logistics, and AI. A company-authored compliance job post separately
      spans product safety, radio, cellular, battery, aviation, cybersecurity, supply chain,
      and export controls. Together, those sources make execution and certification the
      leading residual risk. The next tier is dependency risk: 2024 testimony linked the
      business to advanced semiconductors and stated that most Skydio units then deployed to
      Ukraine were purchased and provided by the U.S. government. Financial risk is also
      material because the pool contains historical funding and a third-party revenue
      estimate, but no current cash, burn, runway, segment margin, or concentration data.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR015"
    figureRefs:
      - "FR001"

  - id: "regulatory-legal-and-data-exposure"
    title: "Regulatory, legal, and data exposure"
    body: >-
      Public materials demonstrate that compliance is broad, but they do not establish which
      certifications are complete for each product and jurisdiction. The compliance role is
      explicitly tasked with building policy, a risk framework, a requirements inventory,
      certification gates, and launch-readiness sign-off. That is evidence of an active
      control investment, not proof that the control system or every certification is mature.
      Skydio's privacy policy adds concrete data obligations: selected services may process
      precise drone or controller geolocation, while Remote ID can broadcast the drone serial
      number, position, status, speed, controller position, and a timestamp. The policy also
      promises email notification after a security incident. Website terms disclaim a
      warranty that websites or products will be uninterrupted, secure, or error-free; this
      describes contractual risk allocation rather than a record of product failure.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR001"

  - id: "operational-quality-and-support-risk"
    title: "Operational, quality, and support risk"
    body: >-
      Manufacturing evidence is encouraging but stale for a current capacity judgment. In
      June 2024 testimony, Skydio said it built more than one thousand drones per month and
      planned to scale further; the same testimony emphasized the difficulty of integrating
      hardware, software, supply chain, manufacturing, and AI at high reliability and low
      cost. Those statements support a meaningful scale base while also defining the
      execution surface that could create yield, reliability, delivery, or quality problems.
      The assigned evidence does not report defect rates, warranty returns, crashes, recalls,
      outages, security incidents, service-level commitments, or current factory yields.
      Skydio publishes a support case channel and operating hours, and its privacy policy
      describes incident notification, but neither source measures response performance.
      Investment underwriting should therefore treat operational resilience as unverified
      until cohort-level reliability and support data are produced.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR009"
      - "CR011"
    tableRefs:
      - "TR002"

  - id: "dependencies-financial-model-and-kill-criteria"
    title: "Dependencies, financial model, and kill criteria"
    body: >-
      Counterparty exposure is visible even though concentration percentages are not. The
      2024 testimony said Skydio's success rested on U.S. access to capital, software
      expertise, and advanced semiconductors, and it identified the U.S. government as the
      purchaser and provider of the vast majority of the company's then-deployed Ukraine
      units. Sacra describes a hybrid model in which customers buy aircraft and subscribe to
      cloud services; it also lists $180 million of 2024 revenue and 80% year-over-year
      growth, figures that remain third-party estimates rather than audited results. Skydio's
      2021 Series D announcement proves historical capital raised, not current cash
      availability. The investment thesis should break or pause if diligence shows material
      certification slippage, worsening field reliability, an unmitigated sole-source
      component, excessive government or top-customer concentration, or runway insufficient
      to fund the manufacturing and compliance plan.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"

