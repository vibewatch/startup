callouts:
  - calloutType: "recommendation"
    title: "Diligence gates before underwriting the residual risk"
    body: >-
      Require a product-by-jurisdiction certification inventory, field reliability and
      security-incident cohorts, supplier concentration and qualified-alternate evidence,
      top-customer and government-program concentration, and current cash, burn, runway,
      debt, working-capital, capex, and segment-margin data. Pause the thesis if a launch
      depends on an unresolved critical certification, a sole-source component lacks a
      qualified alternate, reliability trends breach customer SLAs, or available liquidity
      cannot fund the operating plan through the next financing milestone.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR015"
      - "CR016"

