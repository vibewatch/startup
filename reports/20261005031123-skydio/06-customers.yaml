  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "GRR, NRR, logo and revenue churn, renewal rates, contract lengths, cohort retention, and expansion by customer segment."
      whyItMatters: "Without cohort and renewal metrics, public deployment evidence cannot establish durable recurring revenue or successful land-and-expand economics."
      diligencePath: "Obtain monthly customer and ARR cohorts, renewal schedules, churned-account reasons, expansion bridges, and signed contract samples from the data room."
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: "Top-1, top-5, and top-10 customer and channel shares of revenue, ARR, backlog, receivables, and renewals."
      whyItMatters: "Large defense orders and channel-led procurement could create material counterparty and timing concentration that aggregate organization counts conceal."
      diligencePath: "Review customer-level revenue, backlog, renewal, and receivables schedules reconciled to audited financials and board reporting."
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: "A complete current customer roster with deployment stage, products, sites, users, contract value, start date, renewal date, and reference permission."
      whyItMatters: "The public sample mixes customers, early development partners, and channels, so it cannot establish the size or quality of the production installed base."
      diligencePath: "Reconcile CRM account exports, active-device telemetry, support entitlements, invoices, and contracts; independently reference-check a stratified sample."
