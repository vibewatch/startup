company:
  name: Skydio
chapter:
  number: 6
  title: Customers
  summary: >-
    Skydio reports a broad public-safety, defense, and critical-infrastructure footprint, including
    more than 4,000 U.S. agencies and organizations, but the available evidence remains dominated by
    company-issued material. Concrete customer outcomes exist for a historical construction deployment,
    while retention, revenue concentration, contract duration, and current production status remain
    private-evidence gaps.
sections:
  - id: customer-base
    title: Customer base spans regulated public-sector and industrial workflows
    body: >-
      Skydio's September 2026 release says its systems are trusted by more than 4,000 U.S. public-safety
      and critical-infrastructure agencies and organizations, every branch of the U.S. military, and the
      armed forces of 29 allied nations. The same release names AEP, Chevron, Dominion Energy, and
      Southern Company as early development partners for Asset Command, while older company material
      identifies construction, transportation, energy, police, and fire users. These disclosures support
      a multi-segment customer map, not a revenue mix: the 4,000-plus denominator combines agencies and
      organizations, does not distinguish paying customers from development partners, and provides no
      contract-value bands. India is addressed through Aeroarc as a development, manufacturing, and
      deployment channel rather than as evidence of a directly contracted end-customer base.
    claimRefs: [CU001, CU002, CU003, CU009, CU013]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof is tangible but uneven in freshness and independence
    body: >-
      The strongest outcome evidence in the assigned pool is Skydio's 2021 account of Sundt Construction.
      It says Sundt began using drones in 2013, saw adoption begin to grow in 2018, and reduced new-pilot
      training from six or seven hours to three with Skydio. The account also identifies FAA Part 107
      certification and training as sources of implementation delay. This is useful production-workflow
      evidence, but it is historical and hosted by Skydio. The reported population figures of more than
      1,900 corporations and government agencies in February 2024 and more than 4,000 agencies and
      organizations in September 2026 are not a clean growth series because the labels, geography, and
      inclusion rules differ. Planned 2027 deployments and general availability are roadmap signals,
      not current adoption.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU008, CU014]
    tableRefs: [TU002, TU003]
  - id: retention-expansion
    title: The operating motion targets retention and expansion, but outcomes are undisclosed
    body: >-
      Two 2026 company job reposts describe a hands-on post-sale model. The public-safety Customer Success
      role covers implementation, usage, retention, expansion, renewals, and account risk, while the site-
      security deployment role moves customers from evaluation and pilots into repeatable operations and
      tracks post-deployment benefits. These responsibilities are evidence that Skydio is building a
      land-and-expand operating motion; they are not evidence of achieved gross retention, net retention,
      churn, renewal timing, or expansion rates. Skydio's website policy also restricts publication of
      benchmarking or performance data without advance written notice, which may make public outcome
      verification harder. The investment case therefore needs cohort-level data-room evidence rather
      than treating the existence of Customer Success roles as proof of durable revenue.
    claimRefs: [CU010, CU011, CU015]
    figureRefs: [FU001]
  - id: channels-concentration
    title: Partners extend workflows and geography while obscuring economics
    body: >-
      Optelos supplies a credible integration route for asset inspection: its 2022 release describes
      Skydio imagery flowing into visual-data management, AI analysis, and remediation workflows. Aeroarc
      provides a separate route into Indian and Indo-Pacific defense markets through local development,
      manufacturing, deployment, and support. These relationships broaden customer access, but neither
      release discloses revenue share, exclusivity, active installed base, renewal behavior, or partner-
      sourced revenue. Baltic Defense Initiative likewise cautions that supplier-reported order values
      do not allocate value among aircraft, support, and other contract elements. No assigned source
      discloses top-customer or top-channel concentration, so durability cannot be inferred from named
      logos, aggregate organization counts, or large order headlines.
    claimRefs: [CU012, CU013, CU016]
callouts:
  - calloutType: risk
    title: Customer visibility is process-rich but metric-poor
    body: >-
      Public material describes pilots, onboarding, deployment, renewals, and expansion work, yet provides
      no NRR, GRR, churn, contract-length, cohort, or concentration figures. Require customer-level
      revenue and renewal schedules before underwriting durability.
    claimRefs: [CU010, CU011, CU016]
