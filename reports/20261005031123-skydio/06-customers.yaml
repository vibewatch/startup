figures:
  - id: FU001
    title: Company-described customer journey and expansion loop
    type: journey-map
    summary: "A conceptual path reconstructed from 2026 customer-success and deployment job descriptions, not a measured funnel."
    data:
      items:
        - label: Evaluate
          detail: "Define the operational problem, technical feasibility, implementation complexity, and business case."
          touchpoints: ["Customer discovery", "ROI framework"]
        - label: Prove
          detail: "Run a structured pilot or proof of concept tied to measurable operational value."
          touchpoints: ["Pilot plan", "Technical validation"]
        - label: Deploy
          detail: "Integrate aircraft, software, data systems, governance, training, and site requirements."
          touchpoints: ["Implementation project", "Onboarding"]
        - label: Adopt
          detail: "Track usage, implementation health, and whether teams incorporate the system into daily operations."
          touchpoints: ["Customer check-ins", "Usage review"]
        - label: Measure
          detail: "Quantify efficiency, cost savings, risk reduction, and user adoption after deployment."
          touchpoints: ["Quarterly business review", "Benefit realization"]
        - label: Renew and expand
          detail: "Address renewal risk and expand from successful pilots or initial sites into a larger book of business."
          touchpoints: ["Renewal planning", "Multi-site expansion"]
    approximationNotes: "Conceptual sequence only; the sources disclose no stage populations, conversion rates, cycle times, or retention outcomes."
    claimRefs: [CU010, CU011, CU012]
