evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited GAAP financial statements, detailed gross margin per hardware unit vs SaaS license, and exact annual
      recurring revenue (ARR) breakdown.
    whyItMatters: >-
      Public sources report high-level revenue exceeding nine figures ('$100Ms'), but exact profitability, software
      margin contribution, and net burn rates remain private.
    diligencePath: >-
      Request audited financial statements, historical cash flow statements, and ARR cohort breakdown in a formal
      private diligence data room.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: supply-chain-alternatives
    missingEvidence: >-
      Complete disclosure of certified replacement battery cell suppliers and component cost inflation following late
      2024 Chinese sanctions.
    whyItMatters: >-
      China's sanctions directly disrupted drone battery supply chains; tracking long-term unit production cost and
      supply security requires identifying alternate cell producers.
    diligencePath: >-
      Verify bills of materials (BOM), supplier master agreements, and domestic vendor co-location terms under the
      SkyForge manufacturing initiative.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: cap-table-terms
    missingEvidence: >-
      Full capitalization table detailing founder equity stakes, investor share ownership, and specific liquidation
      preferences across preferred share classes.
    whyItMatters: >-
      Estimated dilution figures from third-party databases do not provide full legal rights, protective provisions, or
      secondary transaction records.
    diligencePath: Examine full corporate charter, investors' rights agreements, and cap table ledger through legal diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independently corroborated market model with disclosed units, prices, segment revenue, procurement conversion,
      and geographic boundaries.
    whyItMatters: >-
      Without a transparent denominator, the public vendor-named forecast cannot be converted into defensible TAM, SAM,
      SOM, or obtainable share.
    diligencePath: >-
      Obtain the complete market-study model, compare it with government procurement records and customer budgets, and
      reconcile it to Skydio segment revenue in the data room.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Contract-level prices, annual software fees, deployment costs, renewal rates, procurement cycle lengths, and
      segment revenue.
    whyItMatters: >-
      Customer counts and mission outcomes do not reveal budget capture, recurring revenue, margins, or the cost of
      scaling deployments.
    diligencePath: >-
      Review anonymized contracts, cohort revenue, renewal schedules, implementation costs, and pipeline conversion by
      defense, public safety, and infrastructure segment.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: root-cause-uncertainty
    missingEvidence: >-
      The NYPD incident report, Skydio root-cause analysis, fleet failure-rate denominator, corrective actions, and
      evidence on recovery-system use.
    whyItMatters: >-
      An unresolved over-people incident could affect authorization, insurance, public acceptance, and deployment
      economics, but one report cannot establish fleet-wide reliability.
    diligencePath: >-
      Request the operator and manufacturer investigations, maintenance history, telemetry, insurance claims, and
      comparable incident rates per flight hour.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-and-switching-costs
    missingEvidence: >-
      Realized hardware prices, discount schedules, software attach and renewal rates, service-level commitments, churn,
      and competitor win/loss records by customer segment.
    whyItMatters: >-
      Without contract-level economics, public list or estimated pricing cannot establish switching cost, lifetime
      value, or the durability of Skydio's premium.
    diligencePath: >-
      Request anonymized quotes and executed contracts for comparable configurations, plus cohort renewal, expansion,
      churn, and win/loss data.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-autonomy-benchmark
    missingEvidence: >-
      A reproducible independent benchmark comparing obstacle avoidance, GPS-denied navigation, operator workload,
      mission completion, and failure rates on current peer platforms.
    whyItMatters: >-
      The strongest technical moat claim currently depends on company statements and a market-data comparison without a
      disclosed test appendix.
    diligencePath: >-
      Commission a blinded mission test using identical environments, payloads, operators, and scoring rules, and obtain
      raw logs and failure reports.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: competitor-profile-coverage
    missingEvidence: >-
      Comparable current funding, revenue, backlog, installed base, contract values, product scope, and strategic
      direction for named U.S. tactical peers and likely entrants.
    whyItMatters: >-
      Qualitative category membership does not reveal which peer has the resources, distribution, or manufacturing
      capacity to displace Skydio.
    diligencePath: >-
      Collect current filings, procurement awards, investor materials, and product documentation for each named peer
      using a common comparison template.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited income statements, balance sheets, cash-flow statements, and monthly management reporting.
    whyItMatters: Without audited revenue, margin, cash, and burn, revenue quality and runway cannot be underwritten.
    diligencePath: Obtain audited FY2024-FY2025 statements and 2026 year-to-date monthly management accounts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Product-level gross margin, software attach and renewal, CAC, payback, service cost, and cohort contribution
      margin.
    whyItMatters: The public claim of strong unit economics cannot be tested or separated across hardware, software, and services.
    diligencePath: Request a cohort and product economics workbook reconciled to the general ledger and customer contracts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Post-Series-F cash, debt and structured obligations, monthly burn, capex commitments, and downside runway.
    whyItMatters: Funding raised does not establish cash available or the timing and size of a future financing need.
    diligencePath: Review bank statements, debt agreements, board-approved budget, capex plan, and 24-month downside cash forecast.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Customer-level backlog conversion, contract duration, concentration, cancellations, discounts, and renewal
      history.
    whyItMatters: Shipment and customer counts do not establish durable revenue, pricing power, or cash conversion.
    diligencePath: Sample the top 20 contracts and reconcile bookings, billings, recognized revenue, collections, and renewals.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: hardware-unit-economics
    missingEvidence: >-
      Fully absorbed bill-of-materials (BOM) cost breakdowns and domestic labor costs for X10 and X10D manufacturing at
      the Hayward facility.
    whyItMatters: >-
      Directly determines whether hardware sales achieve profitable gross margins or require ongoing software
      subscription cross-subsidization.
    diligencePath: >-
      Review standard manufacturing cost accounting, scrap rates, and direct unit margin schedules in a confidential
      management data room.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: supply-chain-battery-resilience
    missingEvidence: >-
      Post-sanctions battery cell supplier identity, qualification test data, and multi-source domestic cell
      manufacturing agreements.
    whyItMatters: >-
      Chinese export bans on drone batteries present an operational bottleneck for X10 assembly throughput and delivery
      schedules.
    diligencePath: >-
      Inspect commercial vendor agreements and secondary cell qualification audits from independent testing
      laboratories.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: cellular-latency-benchmarks
    missingEvidence: >-
      Empirical latency and video packet loss benchmarks for Remote Flight Deck teleoperation across public 5G
      commercial carrier networks.
    whyItMatters: >-
      Validates safe BVLOS control margins during critical Drone-as-a-First-Responder emergency deployments in
      high-interference urban settings.
    diligencePath: >-
      Request network performance test logs and cellular failover teleoperation telemetry from customer flight
      deployments.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      GRR, NRR, logo and revenue churn, renewal rates, contract lengths, cohort retention, and expansion by customer
      segment.
    whyItMatters: >-
      Without cohort and renewal metrics, public deployment evidence cannot establish durable recurring revenue or
      successful land-and-expand economics.
    diligencePath: >-
      Obtain monthly customer and ARR cohorts, renewal schedules, churned-account reasons, expansion bridges, and signed
      contract samples from the data room.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-1, top-5, and top-10 customer and channel shares of revenue, ARR, backlog, receivables, and renewals.
    whyItMatters: >-
      Large defense orders and channel-led procurement could create material counterparty and timing concentration that
      aggregate organization counts conceal.
    diligencePath: >-
      Review customer-level revenue, backlog, renewal, and receivables schedules reconciled to audited financials and
      board reporting.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A complete current customer roster with deployment stage, products, sites, users, contract value, start date,
      renewal date, and reference permission.
    whyItMatters: >-
      The public sample mixes customers, early development partners, and channels, so it cannot establish the size or
      quality of the production installed base.
    diligencePath: >-
      Reconcile CRM account exports, active-device telemetry, support entitlements, invoices, and contracts;
      independently reference-check a stratified sample.
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: Definitions and reconciliations for the 2024 more-than-1,900 and 2026 more-than-4,000 customer-population claims.
    whyItMatters: >-
      Different labels and geographic scopes prevent calculation of customer growth or average economics from the two
      public figures.
    diligencePath: >-
      Request dated customer-count bridges defining paying account, agency, organization, partner, pilot, inactive
      account, and geographic inclusion.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
