evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Confirmed ARR, Plus subscriber count, and monthly churn from management or a primary filing
    whyItMatters: >-
      These metrics determine whether the valuation is supportable on recurring revenue rather than install-base
      proxies.
    diligencePath: Request management disclosure or a current investor deck with subscriber and churn metrics.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete internal org chart and full leadership reporting lines below the executive layer
    whyItMatters: >-
      The chapter can identify the top executives, but the deeper leadership bench is not fully visible in public
      sources.
    diligencePath: Request org chart and current operating cadence from management.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Full investor ownership percentages, pro-rata rights, and board-observer rights
    whyItMatters: The stakeholder map is only partial without formal cap-table detail.
    diligencePath: Request cap table and investor rights agreement during diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: A primary-source or analyst model that translates install base into a defendable TAM/SAM/SOM
    whyItMatters: Without it, market sizing must remain proxy-based and cannot be treated as a single point estimate.
    diligencePath: Pull a current analyst note or customer-budget model with explicit methodology.
    relatedQuestionRefs:
      - QM006
      - QM008
      - QM011
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: direct peers
    missingEvidence: Current public pricing and feature pages for the most relevant direct peers and district suites
    whyItMatters: The chapter can identify substitute categories, but direct price/performance comparison remains incomplete.
    diligencePath: Pull current official pricing and product pages for the top named peers in a follow-on pass.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: blocking
    topic: capital
    missingEvidence: Confirmed current cash balance, burn, runway, and revenue mix
    whyItMatters: >-
      These inputs determine whether the company can justify the current private valuation without additional financing
      pressure.
    diligencePath: Request a current management financial summary or investor deck.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: support
    missingEvidence: Incident history and support-resolution metrics for sync failures or privacy-related complaints
    whyItMatters: Those metrics would show whether the trust and reliability posture is merely aspirational or operationally solid.
    diligencePath: Request support-ticket breakdowns and incident summaries from management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
