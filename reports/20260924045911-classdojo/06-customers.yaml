schemaVersion: "report-v2"
artifact: customers
slug: classdojo
runDate: "2026-09-24"
company:
  name: ClassDojo
chapter:
  number: 6
  title: Customers
  summary: ClassDojo's customer base is broad, sticky, and highly visible at the top of the funnel, but still opaque on the usual SaaS retention metrics. The public record supports strong teacher and family adoption, with district expansion now becoming an important secondary lane.
acknowledgedWarnings:
  - dimension: figureType
    reason: The chapter intentionally uses a timeline figure instead of the planned journey-map figure.
sections:
  - id: customer-base
    title: Customer base and segmentation
    body: >-
      ClassDojo serves three overlapping customer groups: teachers who use the free
      classroom product, parents and families who receive updates and may buy Plus, and
      districts or school leaders who now get administrative workflow tools. That split
      is important because the company can show broad user reach without proving a single
      enterprise-account sales motion. Public sources still emphasize bottom-up adoption
      in K-8 classrooms, but the district page makes clear that institutional use is now
      a material secondary segment. The same footprint also implies that customer demand
      is multi-sided: teachers create the classroom graph, families amplify engagement,
      and districts can widen the workflow budget when they buy in.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and proof of use
    body: >-
      The strongest adoption evidence is public and current: App Store ratings, software
      review scores, and company disclosures consistently frame ClassDojo as a high-use
      classroom product. The App Store shows millions of ratings, while SoftwareReviews
      shows high likeliness-to-recommend and renewal intent. The company also continues
      to publish stories about classroom and district use, which suggests the product is
      not a vanity brand but a daily workflow with concrete engagement. EdSurge's prior
      reporting is useful here too: the company could turn classroom adoption into a home
      and family revenue motion, which is exactly the sort of conversion path that makes
      customer proof more than a logo count.
    claimRefs: [CU004, CU005, CU006]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: retention-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      What remains missing is the standard retention dashboard: NRR, GRR, churn,
      district renewal, and concentration by account or geography. The public evidence
      does, however, imply strong top-line retention because the product is embedded in
      classroom routines and family communications. Expansion is increasingly two-layered:
      more parents can buy Plus, and more districts can adopt the instructional-leader
      layer. That creates an upsell path, but it does not yet substitute for a hard
      retention disclosure. In diligence terms, this means the growth story is visible,
      but the durability story still depends on private cohort data that the company has
      not published.
    claimRefs: [CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
callouts:
  - calloutType: insight
    title: Adoption is broad, but retention is still inferred
    body: >-
      The company has excellent proof of usage and very limited proof of cohort economics.
    claimRefs: [CU004, CU005, CU007]
  - calloutType: risk
    title: Concentration risk is hidden, not absent
    body: >-
      Without customer concentration data, the refresh has to assume that a small number
      of districts or regions could still matter disproportionally.
    claimRefs: [CU009, CU010]
  - calloutType: recommendation
    title: Ask for district renewal and family churn by cohort
    body: >-
      The most useful next diligence step is a cohort view for Plus and district
      accounts, not another topline user-count claim.
    claimRefs: [CU007, CU008, CU010]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [segment, buyer_or_user, use_case, scale_signal, gap]
    rows:
      - ["teachers", "daily user", "classroom communication and behavior", "Free core product", "Need cohort retention"]
      - ["parents / families", "consumer user / payer", "messages, stories, Plus content", "In-app purchase surface", "Need churn and conversion"]
      - ["district leaders", "institutional buyer", "attendance, reachability, dashboard", "Emerging district layer", "Need ACV and renewal"]
      - ["students", "end users", "portfolios and class activities", "Broad school usage", "Need engagement depth"]
    notes: "Segmentation reflects public product surfaces and should not be read as an exact revenue allocation."
    claimRefs: [CU001, CU002, CU003]
  - id: TU002
    title: Retention and expansion table
    columns: [metric, value_or_status, segment, confidence, diligence_ask]
    rows:
      - ["NRR", "Not public", "district", "low", "Request a cohort deck"]
      - ["GRR", "Not public", "district", "low", "Request renewal history"]
      - ["Family churn", "Not public", "Plus", "low", "Request subscriber cohorts"]
      - ["Account concentration", "Not public", "all", "low", "Request customer concentration"]
      - ["Expansion path", "Plus + district tools", "all", "medium", "Confirm attach rates"]
    enumerationScope:
      coverage: partial
      basis: "Public sources enumerate visible customer surfaces, but not all cohort metrics or customer concentration details."
    notes: "Public evidence supports expansion optionality, not a disclosed retention profile."
    claimRefs: [CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [proof_type, evidence, signal, limitation]
    rows:
      - ["App Store", "4.8-star rating and 4.1M ratings", "Large-scale usage", "Consumer review not cohort data"]
      - ["SoftwareReviews", "8.0/10 score and strong renewal intent", "Positive customer sentiment", "Self-reported review sample"]
      - ["Official case/story pages", "District and classroom stories on ClassDojo pages", "Named use evidence", "Often marketing-led"]
      - ["Public press coverage", "Millions of users and schools cited in PR/news coverage", "High awareness", "May lag current performance"]
    notes: "Proof table uses customer-facing and independent-review evidence; it does not validate revenue per customer."
    enumerationScope:
      coverage: sample
      basis: "The table intentionally samples the strongest public customer proof points rather than cataloging every public review or press mention."
    claimRefs: [CU004, CU005, CU006]
