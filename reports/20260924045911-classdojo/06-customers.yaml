          date: "2026"
          details: "Millions of ratings and a strong consumer app score show broad adoption."
          tone: positive
        - label: "SoftwareReviews"
          date: "2026"
          details: "High likeliness-to-recommend and renewal intent indicate strong sentiment."
          tone: positive
        - label: "Teacher workflow"
          date: "2026"
          details: "Official pages keep framing ClassDojo as free for teachers and schools."
          tone: positive
        - label: "District expansion"
          date: "2026"
          details: "District pages and stories show the institutional layer becoming material."
          tone: positive
        - label: "Retention gap"
          date: "2026"
          details: "NRR, GRR, churn, and concentration remain undisclosed."
          tone: negative
        - label: "Review risk"
          date: "2026"
          details: "Adverse teacher commentary suggests not all users are enthusiastic."
          tone: negative
    approximationNotes: "The figure summarizes customer proof using public signals only; it is not a retention model."
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011]

