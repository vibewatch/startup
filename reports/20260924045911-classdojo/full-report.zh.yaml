              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: 财务、集中度与治理风险
        blocks:
          - type: paragraph
            body: >-
              公司资金充裕，但围绕 ARR、流失率、现金储备及账户集中度的数据缺失，仍让估值与治理风险悬而未决。Tencent
              仍是重要投资人，即使目前没有直接运营影响，也可能影响退出路径和地缘政治观感。第三方负面评论还显示，部分教师对行为追踪和课堂监控感到不安。这些问题未必会令公司失败，却会限制市场愿意支付的估值上限。因此，本次评估把估值风险视为现实的投资判断问题，而非纸上推演。信息披露不透明本身就是风险因素。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
      - number: '7.4'
        title: 附件
        blocks:
          - type: callout
            title: 监管合规敏感性是核心逻辑颠覆风险点
            body: 重大隐私合规或 COPPA 负面事件会同时打击产品采纳和未来退出选择。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 密切监控技术支持摩擦与学区网络拦截问题
            body: 最值得优先处理的运营风险不是灾难性宕机，而是同步失败和网络拦截累积造成的课堂挫败感。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR006
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 乐观情形逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景十分清晰：ClassDojo 掌控庞大的课堂使用习惯回路，具备消费级产品的病毒式传播力，已证明具备盈利能力，且在免费教师底座之外握有多项变现杠杆。公司声称覆盖 95%+ 美国 K-8 学校与 51M+
              用户，产品现已覆盖沟通、行为管理、家庭互动和 AI 辅助教师工作。若 Plus 转化或学区业务显著扩大，当前一级市场估值最终甚至可能显得保守。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV008
      - number: '8.2'
        title: 悲观情形逻辑
        blocks:
          - type: paragraph
            body: >-
              悲观情景是，当前估值已假设公司成功变现，但这一点尚未公开证实。公司未披露 ARR、流失率、现金或当前收入构成，第三方收入估算的差距也大到足以影响判断。隐私敏感性和部署摩擦还意味着，投资者可能要求比普通消费级
              App 更高的回报。在此背景下，作为战略性优质资产，$1.25B 估值或许合理；但对新入场的私募投资者而言，仍可能偏高。
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.3'
        title: 可比参考标的与定价纪律
        blocks:
          - type: paragraph
            body: >-
              公开对标标的虽不够完美，但仍具参考价值。Caplight 基准依据商业模式相似度，将 ClassDojo 与 Seesaw、ParentSquare 及 SchoolStatus 并列。Tracxn 与
              GetLatka 则提供了本次复盘中最清晰的公开估值与 ARR
              定价锚点。这些信源虽无法取代管理层财务模型，但共同支持了一个判断：这是一款具备规模化与高粘性的成熟产品，其估值必须以实际收入披露为准绳，而非单看用户规模。
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
      - number: '8.4'
        title: 投资建议与情景展望
        blocks:
          - type: paragraph
            body: >-
              建议仍是观察，而不是买入或回避。ClassDojo 实力强到不能轻易否定，但信息披露过于不透明，也不足以支持大幅上调估值。上行空间取决于 ARR 是否显著高于公开估算的低端，以及学区扩张或 Plus
              转化能否提速，同时不遇到重大监管或支持问题。在这些条件得到验证前，应继续观望，估值判断仍为偏高。
            claimRefs:
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.5'
        title: 退出就绪度与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              公司具备 IPO 或被收购的退出可能性，但风险尚未完全消除。若能证明经常性收入稳定，并持续保持良好的隐私保护表现，未来上市或被收购都可能走通。最重要的尽调问题仍是：确认 ARR、Plus 订阅人数、流失率、学区
              ACV 和续约率，以及当前法律与隐私状态。这些数据能说明市场买的是可持续的经常性收入平台，还是一个用户规模异常庞大的品牌；两者之别仍是估值判断的关键。
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV011
      - number: '8.6'
        title: 附件
        blocks:
          - type: callout
            title: 锚定公开估值基准，但必须索取确切收入证明
            body: 当前估值标记并非显然错误，只是尚未获得公开的经常性收入实据支撑。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
          - type: callout
            title: 主要下行情景源于信息不透明，而非产品失败
            body: 若未披露的实际收入底盘弱于市场预期，ClassDojo 完全可能既是一家优秀的企业，同时又是一笔回报平庸的投资。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV010
          - type: callout
            title: “跟踪观察”是权衡现有证据后的审慎选择
            body: 关键缺失信息尚未补齐，因此没有充分依据上调至买入；建议仍应以证据为准。
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV010
