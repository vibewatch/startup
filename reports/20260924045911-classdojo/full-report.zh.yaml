        blocks:
          - type: paragraph
            body: >-
              变现仍由 C 端订阅与学区销售共同构成，教师端则继续免费。App Store 将 ClassDojo Plus
              列为应用内购买，提供月付和年付选项。公开产品页面还展示了较新的学区套件，涵盖消息、行为管理、课堂工具、考勤同步与 AI 辅助。ClassDojo 近期重点介绍 Sidekick 和 Dojo
