    sections:
      - number: '1.1'
        title: 业务定位、规模与市场地位
        blocks:
          - type: paragraph
            body: >-
              ClassDojo 由 Sam Chaudhary 与 Liam Don 于 2011
              年在旧金山创立。核心产品是课堂沟通与管理平台，教师可向家长和学生分享消息、照片、视频、成长档案、活动及行为反馈。公司仍将教师端产品定位为免费，公开材料强调广泛触达，而非只靠学区销售。综合现有信源，最突出的信号是品类领先：ClassDojo
              声称覆盖 180 个国家的 5100 多万名儿童、家庭及教师，并进入美国 95% 以上的 K-8 学校。
