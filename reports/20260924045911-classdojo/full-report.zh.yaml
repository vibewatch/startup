  - id: TV002
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 核心风险
    rows:
      - - 乐观
        - ARR 显著高于公开估算；Plus 转化率改善
        - 支撑现有或更高估值
        - 增长遭遇隐私或技术支持瓶颈
      - - 基准
        - ARR 接近分析师估算；增长平稳但非爆发式
        - 当前估值大致合理至偏高
        - 估值倍数持续承压
      - - 悲观
        - ARR 弱于公开估算，或流失率高于预期
        - 估值与建议面临下行压力
        - 收入不透明问题悬而未决
