        title: 差异化优势与迁移成本
        blocks:
          - type: paragraph
            body: >-
              ClassDojo 的差异化不在某个单项功能，而在整套功能如何嵌入每天的课堂习惯。教师能在同一产品里给家庭发消息、奖励积分、分享作品集并管理课堂日常；学区页面还新增了考勤同步、触达率报告和 AI
              辅助流程。用户评价和 App Store 评分显示，护城河主要来自广泛使用和习惯养成，而非技术独占。竞品即使不全面超越核心功能，只要降低部署负担或更符合管理要求，就能蚕食 ClassDojo 的既有用户基础。
