              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: 附件
        blocks:
          - type: callout
            title: 将隐私保护与同步稳定性列为产品级首要事项
            body: 这类高度依赖信任的产品，既要守住合规要求，也要保证日常同步可靠；任何一项掉链子都会拖慢采纳。
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: AI 功能扩展既强化差异化，也招致更严格合规审查
            body: Sidekick 与 Dojo Sparks 拓宽了产品护城河，但同时也推高了数据治理、可解释性及家长信任的门槛。
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: 研发实力确有积累，但主要面向内部体系
            body: 公开工程足迹扎实，但这并不是一个面向外部开发者的平台生态。
            calloutType: insight
            claimRefs:
              - CE004
              - CE011
  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户客群与细分定位
        blocks:
          - type: paragraph
            body: >-
              ClassDojo 服务三类彼此重叠的客群：使用免费课堂产品的教师、接收动态且可能购买 Plus
              的家长和家庭，以及使用行政工作流工具的学区或学校领导。公司因此能展示广泛用户覆盖，而不必先证明自己拥有单一的大客户销售模式。公开资料仍主要强调 K-8
              课堂里的自下而上采纳，但学区页面显示机构客户已成为重要的次级市场。需求也来自多方：教师建立课堂关系网络，家庭加深互动；学区采购则可能扩大可覆盖的工作流预算。
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 普及轨迹与使用实据
        blocks:
          - type: paragraph
            body: >-
              最有力的采纳证据来自近期公开资料：App Store 评分、软件评价和公司披露都显示 ClassDojo 被广泛用于课堂。App Store 上有数百万条评价，SoftwareReviews
              的推荐意愿和续约意向也较强。公司持续发布课堂和学区案例，说明它不只是有名无实的品牌，而是嵌入日常、带来实际互动的工作流。EdSurge 此前的报道也值得参考：ClassDojo
              有机会把课堂采纳延伸为家庭收入来源；这类转化路径让客户验证不止停留在 Logo 数量。
            claimRefs:
              - CU004
              - CU005
              - CU006
