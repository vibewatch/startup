        title: 尽调缺口与估值判断
        blocks:
          - type: paragraph
            body: >-
              核心尽调缺口与上次评估相同：公开资料仍未证实 ARR、Plus
              订阅用户数或流失率。因此，估值判断只能参考定价、用户基础、员工数和公开采纳情况等代理指标，而非管理层确认的经常性收入。公司已具备一定规模，仍由私募资本支持；关键不再是产品是否找到
              PMF，而是在缺少明确收入披露时，现有变现路径能否支撑一级市场估值。
