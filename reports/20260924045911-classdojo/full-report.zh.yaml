companyProfile:
  summary: >-
    ClassDojo 是一家总部位于旧金山的教育软件公司，由 Sam Chaudhary 与 Liam Don 于 2011 年创立。产品起步于免费的课堂沟通与行为管理工具，现已扩展为覆盖更广的家庭互动平台，包含面向 C
    端的付费订阅（ClassDojo Plus）、学区工作流，以及 Sidekick 和 Dojo Sparks 等 AI 功能。公开资料显示，公司累计融资约 $221M，是一家在美国 K-8 学校覆盖面广的非上市独角兽；但
    ARR、流失率与客户集中度等投资判断所需的关键数据尚未获公开确认。
