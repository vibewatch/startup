              估值仍显有限，因此关键是现有变现率能否支撑当前一级市场估值，而非公司能否变现。公司尚未公开毛利率、留存率或收入构成，因而这一判断尤其重要。业务看起来真实且已具规模，但公开数据仍不足以全面核验。
