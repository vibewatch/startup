      - number: '6.3'
        title: 留存、增购与客户集中度
        blocks:
          - type: paragraph
            body: >-
              仍缺少标准留存数据：NRR、GRR、流失率、学区续约率，以及按客户或地区划分的集中度。产品深嵌课堂日常和家校沟通，公开证据因此暗示整体留存较强，但并无硬数据佐证。增购有两条路：更多家长购买
              Plus，更多学区采用教学主管工具。这带来追加销售机会，却尚不能替代确切的留存披露。投资判断上，增长路径清晰可见；但业务能否长期留住客户，仍要看公司未公开的客户群组数据。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: 附件
        blocks:
          - type: callout
            title: 覆盖面广泛，但留存数据仍靠推断
            body: 公司有充分的使用证据，却几乎没有客户群组经济性的公开数据。
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU007
          - type: callout
            title: 集中度风险处于隐性状态，并非不存在
            body: 缺少客户集中度数据时，仍需考虑少数学区或地区可能具有不成比例的影响。
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
