  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采购角色
        blocks:
          - type: paragraph
            body: >-
              ClassDojo 所在的市场不只是“校内消息工具”，还覆盖家校沟通、课堂行为管理、学生作品集、考勤跟进和家庭互动。教师通常是使用者，校领导可能影响采购决策；付费方则可能是购买 C
              端功能的家长，也可能是统一部署产品的学区。教师先用起来，产品便能自下而上铺开；之后也可向学区销售，或直接向家庭变现。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 普及驱动力与增长制约
        blocks:
          - type: paragraph
            body: >-
              公开资料指向三项持久需求：多语言家校沟通、易上手的班级管理，以及教师端免费带来的低推广门槛。但同一批信源也显示出几项制约：学校对隐私的要求、学区网络与浏览器问题，以及公司必须把免费使用转成家庭或学区收入。换言之，ClassDojo
              市场空间广阔，但变现受制于信任机制与使用习惯，而非单纯的席位许可销售逻辑。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.3'
        title: 测算视角与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有一手证据不足以给出精确的公开 TAM。更稳妥的测算方式是从学校覆盖面、家庭订阅群体和学区工作流三方面着手。按此框架，潜在受众已相当庞大：ClassDojo 声称覆盖美国 95% 以上的 K-8 学校、拥有
              51M+ 用户，并触达 180 个国家。现实中的替代选择包括邮件和短信、电子表格、纸质行为记录表、SIS 流程，以及未能整合多项功能的课堂工具。竞争者不只是同类
              App，也包括只解决部分流程的传统邮件、短信和学区系统。投资判断要看到，ClassDojo
              的护城河来自使用习惯，而非排他性；替代品只要能减少使用摩擦，就可能拖慢转化。公司触达面广，但变现仍取决于信任、工作流契合度和教师习惯。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
