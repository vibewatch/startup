            title: 建议索取按客群划分的学区续约与家庭流失明细
            body: 下一步最值得索取的是 Plus 和学区客户按群组拆分的数据，而不是再重复一条总体用户数的公司声称。
            calloutType: recommendation
            claimRefs:
              - CU007
              - CU008
              - CU010
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              ClassDojo 运行于极具敏感性的儿童数据环境，隐私合规与 COPPA 监管敞口始终是核心风险源。隐私政策与安全综述虽声称遵循 COPPA 和 FERPA
              规范、不出售个人数据并实施数据留存控制，但这些合规表态无法完全免除监管审查风险。根本风险在于结构性约束：一旦针对儿童沟通软件的隐私监管标准收紧，公司将面临更高的合规成本，产品迭代节奏亦可能放缓。这种风险绝非凭空假设，而是深耕课堂信任市场的必然代价。直白而言，信任本就是产品的一部分，而非外在营销包装。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
      - number: '7.2'
        title: 运营、稳定性与支持风险
        blocks:
          - type: paragraph
            body: >-
              支持中心资料显示，浏览器版本、隐私设置和学区网络拦截都可能导致同步问题。这些问题虽不至于造成灾难性后果，却会让每天依赖课堂沟通的教师和学区管理员感到麻烦。状态页目前显示一切正常，但支持工单和部署工作实际耗费的时间是否多于公开页面所呈现，仍是问题。课堂上即使出现小故障，也可能影响教师继续使用。因此，支持负担会直接影响留存，也影响学区是否愿意统一采用。
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
