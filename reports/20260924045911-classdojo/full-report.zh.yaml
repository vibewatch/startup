          - type: paragraph
            body: >-
              工程博客描绘了一套现代 SaaS 技术栈，重点放在数据管道、AWS、Redshift、Airflow、dbt 和监控上。安全综述补充了更多细节：学生数据托管于 AWS us-east-1
              区域，实行基于角色的访问控制，并强制推行双因素认证、TLS
              加密、日志记录及定期漏洞管理。帮助文档与系统状态页面显示，产品仍受浏览器兼容性、学校网络设置和设备同步质量影响。架构基础可信，但推广能否顺利仍取决于同步是否省心、求助渠道是否清晰。可靠性本身就是产品体验的一部分，不只是运维指标。
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE009
      - number: '5.3'
        title: 信任机制与技术路线图
        blocks:
          - type: paragraph
            body: >-
              ClassDojo 继续把隐私与安全作为产品价值的一部分。隐私政策称公司不出售个人数据，并在 12 个月后删除学校反馈积分；安全概述则介绍了 SOC 2 认证进程。产品路线图明显转向
              AI：近期博客和学区页面重点介绍 Sidekick 与 Dojo Sparks，显示下一轮产品迭代将聚焦于节省教师时间、支持家庭学习，而不只是增加沟通功能。AI
              工具既要有用，也不能加重隐私顾虑，否则用户采纳可能受阻。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
