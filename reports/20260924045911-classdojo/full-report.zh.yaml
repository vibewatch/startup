  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图
        blocks:
          - type: paragraph
            body: >-
              公开资料没有指向某个占据主导地位的直接对手。ClassDojo 面对的竞争面很广：学区沟通套件、通用 LMS 和 SIS 流程、行为管理工具，以及争夺家长注意力的 C 端学习 App。Tracxn
              列出数百家活跃竞品；ClassDojo
              的产品页面则显示，它把沟通、班级文化和家庭互动整合进免费的教师工作流。打包定位带来差异化，但公司争夺的不只是软件客户，更是既有使用习惯。真正的防线是教师、家长和学区都在用这套流程，而非某个功能难以复制；因此，工作流本身形成了粘性的护城河。
