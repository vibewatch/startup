      - number: '3.3'
        title: 竞争风险与替代威胁
        blocks:
          - type: paragraph
            body: >-
              最可能的替代方式不是整体更换软件，而是教师和学区改用邮件、短信、纸质行为表，或转向更易统一部署的学区套件。有关同步故障和网络屏蔽的帮助文档说明，部署摩擦仍会影响使用。负面评论也显示，部分教师担心课堂行为追踪、公众观感以及奖励机制带来的社交影响。替代压力不只来自功能差异，也来自社会接受度和实际工作流是否合拍。
