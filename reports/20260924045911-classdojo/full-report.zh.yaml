        title: 融资历程、治理结构与团队规模
        blocks:
          - type: paragraph
            body: >-
              公开融资记录显示，ClassDojo 是融资充足的非上市独角兽。Tracxn 列出 9 轮、累计 $221M 融资，其中包括 2022 年 7 月的 $125M D 轮（投后估值 $1.25B），以及 2024
              年 3 月由 Five Sigma 领投、金额未披露的 D 轮追加融资。Tracxn 还显示，截至 2026 年 8 月下旬，公司约有 513
              名员工；这更像一家中型消费科技与教育平台，而非大型企业软件厂商。Tencent、General Catalyst、SignalFire 等长期投资人仍是股东阵营的核心。
