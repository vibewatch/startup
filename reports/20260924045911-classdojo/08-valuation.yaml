    title: Recommendation summary table
    columns: [field, value, rationale]
    rows:
      - ["recommendation", "track", "Strong product but opaque recurring revenue"]
      - ["confidence", "medium", "Evidence is good on adoption, weak on ARR"]
      - ["risk rating", "high", "Privacy and valuation opacity remain material"]
      - ["valuation stance", "stretched", "Private mark relies on unconfirmed monetization"]
    notes: "Summary reflects the current refresh only and not the prior report's scorecard."
    claimRefs: [CV001, CV005, CV008]
  - id: TV002
    title: Bull / base / bear scenario table
    columns: [case, assumptions, valuation_logic, key_risk]
    rows:
      - ["bull", "ARR materially above public estimates; Plus conversion improves", "Existing mark can be supported or higher", "Growth butts into privacy or support issues"]
      - ["base", "ARR near analyst estimate; growth steady but not explosive", "Current mark is roughly fair to stretched", "Multiple stays under pressure"]
      - ["bear", "ARR weaker than public estimates or churn higher than expected", "Downside to valuation and recommendation", "Revenue opacity remains unresolved"]
    notes: "Scenario math is qualitative because the company does not disclose the base revenue inputs needed for a precise model."
    claimRefs: [CV002, CV005, CV006, CV009]
  - id: TV003
    title: Comparable valuation table
    columns: [reference, metric, value_or_signal, relevance, limitation]
