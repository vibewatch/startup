      - ["Caplight comps", "similarity / market context", "Seesaw 86%, ParentSquare 84%, SchoolStatus 83%", "Shows comparable set", "Similarity is not valuation"]
      - ["Public pricing", "Plus price", "$7.99+ monthly tiers", "Supports monetization ceiling", "List price only"]
    notes: "Comparable set is intentionally proxy-heavy because the company is private and under-disclosed."
    claimRefs: [CV001, CV002, CV003, CV004]
