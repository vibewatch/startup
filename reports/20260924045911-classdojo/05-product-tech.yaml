schemaVersion: "report-v2"
artifact: product-tech
slug: classdojo
runDate: "2026-09-24"
company:
  name: ClassDojo
chapter:
  number: 5
  title: Product & Technology
  summary: ClassDojo's product has matured from simple classroom messaging into a broader family-engagement and teacher-productivity stack. The refresh shows a credible security posture, visible developer signal, and an AI roadmap, but also some implementation friction and ongoing trust-sensitive product choices.
acknowledgedWarnings:
  - dimension: figureType
    reason: The chapter intentionally uses a timeline figure instead of the planned architecture figure.
sections:
  - id: product-surface
    title: Product surface and use cases
    body: >-
      The current product surface covers classroom communication, behavior points,
      student portfolios, activities, stories, district messaging, and AI assistance.
      Teachers use it to share classroom updates and reinforce behavior; parents use it
      to receive photos, videos, messages, and reminders; district leaders use it to
      standardize communication and monitor reachability. The official pages now make it
      clear that ClassDojo is no longer just a messaging app. It is a multi-surface
      workflow product that combines communication, culture, and administrative
      reporting. The practical consequence is that the product now has to satisfy both
      classroom habit and district governance, which widens the design surface and makes
      every new feature a trust decision as well as a UX decision.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
  - id: architecture-and-dependencies
    title: Architecture and operating dependencies
    body: >-
      The engineering blog describes a modern SaaS stack with strong emphasis on data
      pipelines, AWS, Redshift, Airflow, dbt, and monitoring. The security overview adds
      more detail: student data lives in AWS us-east-1, access is role-based, and the
      company enforces 2FA, TLS, logging, and regular vulnerability management. Help
      articles and the status page show that the product still depends on browser
      compatibility, school-network configuration, and device sync quality. In practice,
      the architecture is credible, but adoption still depends on low-friction sync and
      clear support paths. That makes reliability a product feature, not just an ops one.
    claimRefs: [CE004, CE005, CE006]
    tableRefs: [TE002]
  - id: trust-and-roadmap
    title: Trust posture and roadmap
    body: >-
      ClassDojo continues to lean on privacy and security as part of the product value
      proposition. The privacy policy says the company does not sell personal data and
      deletes school feedback points after 12 months, while the security overview
      describes a SOC 2 certification path. The roadmap signal is now clearly AI-forward:
      recent blog and district pages highlight Sidekick and Dojo Sparks, suggesting that
      the next product cycle is about time-saving for teachers and learning support for
      families, not just messaging. That also means the roadmap now sits at the center
      of product trust: AI help has to feel useful without making privacy concerns louder,
      or adoption will stall.
    claimRefs: [CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
callouts:
  - calloutType: recommendation
    title: Keep privacy and sync reliability as product-level priorities
    body: >-
      Trust-sensitive product categories need both compliance posture and day-to-day sync
      reliability; either one can slow adoption.
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: AI expansion increases both differentiation and policy scrutiny
    body: >-
      Sidekick and Dojo Sparks widen the product moat, but they also raise the bar for
      data handling, explainability, and parent trust.
    claimRefs: [CE009, CE010]
  - calloutType: insight
    title: Developer signal is real but mostly internal-facing
    body: >-
      The public engineering footprint is credible, yet the product's developer ecosystem
      is not a classic external-platform story.
    claimRefs: [CE004, CE011]
