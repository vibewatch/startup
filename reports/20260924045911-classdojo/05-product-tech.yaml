    columns: [layer_or_workflow, evidence, dependency, risk]
    rows:
      - ["Teacher communication", "Messages, stories, calendars, portfolios", "App/web sync", "Browser/device compatibility"]
      - ["Family engagement", "Translation, photos, reminders, in-app purchases", "Push/email delivery", "Network block or notification failure"]
      - ["Data platform", "Redshift, dbt, Airflow, S3, Glue", "AWS and pipeline tooling", "Operational complexity"]
      - ["Product analytics", "Metrics tables and anomaly detection", "Data quality checks", "Catastrophic outage / bad KPI data"]
      - ["AI assistance", "Sidekick and Dojo Sparks", "Model/data governance", "Privacy and policy sensitivity"]
    notes: "Architecture table is based on engineering blog disclosures and security statements; it is intentionally partial."
    claimRefs: [CE004, CE005, CE009]
  - id: TE003
    title: Trust, quality, and compliance table
    columns: [control_or_signal, status, scope, diligence_gap]
    rows:
      - ["COPPA / FERPA posture", "Publicly asserted compliant", "Student and school data", "Need current legal review"]
      - ["Data retention", "12-month deletion for feedback points", "Student behavior data", "Confirm exceptions and workflows"]
      - ["SOC 2", "In progress in 2025", "Platform security", "Need current certification date"]
      - ["Status page", "Everything looks good", "Service reliability", "Need incident history beyond the page"]
      - ["Support / sync troubleshooting", "Documented browser and network fixes", "Deployment friction", "Quantify ticket load and resolution time"]
    notes: "Trust controls are a mix of policy, certification, and support signals; not all are audit proofs."
    claimRefs: [CE005, CE006, CE007]

