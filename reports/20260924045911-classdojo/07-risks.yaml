company:
  name: ClassDojo
chapter:
  number: 7
  title: Risks
  summary: ClassDojo's risk profile is dominated by privacy/regulatory sensitivity, reliability friction, and valuation uncertainty rather than by existential product fragility. The refresh keeps those risks ranked by likely business impact, with no public evidence of a current lawsuit or enforcement action but with clear ongoing trust exposure.
acknowledgedWarnings:
  - dimension: figureType
    reason: The chapter intentionally substitutes a timeline figure for the planned matrix figure.
sections:
  - id: legal-and-regulatory
    title: Legal and regulatory risk
    body: >-
      ClassDojo operates in a sensitive child-data environment, so privacy and COPPA
      exposure remain the most important risks. The privacy policy and security overview
      say the company is designed to comply with COPPA and FERPA, does not sell
      personal data, and uses retention controls, but those claims do not eliminate the
      possibility of regulatory scrutiny. The underlying risk is structural: if a child
      communication product is judged against a stricter privacy standard, the company
      would face heavier compliance costs and potentially slower product iteration. That
      risk is not hypothetical; it is the price of operating in a classroom trust market.
      Put bluntly, trust is part of the product, not a marketing layer.
    claimRefs: [CR001, CR002, CR003]
    tableRefs: [TR001]
  - id: operational-and-product
    title: Operational, reliability, and support risk
    body: >-
      The help-center material shows that sync issues can come from browser versions,
      privacy settings, and district network blocks. That is not catastrophic, but it is
      the kind of last-mile friction that can frustrate teachers and district admins when
      classroom communication has to work every day. The status page currently says
      everything looks good, but the real question is whether support tickets and
      implementation work consume more time than the public pages imply. Even small
      reliability problems can become adoption problems when teachers use the product
      in live class periods. The support burden therefore feeds directly into retention
      and district willingness to standardize.
    claimRefs: [CR004, CR005, CR006]
    figureRefs: [FR001]
    tableRefs: [TR002]
  - id: financial-and-governance
    title: Financial, concentration, and governance risk
    body: >-
      The company is well funded, but the disclosure gap around ARR, churn, cash, and
      account concentration still leaves valuation and governance risk unresolved. Tencent
      remains a headline investor, which can matter for exit pathways and geopolitical
      perceptions even when there is no immediate operational issue. Adverse third-party
      commentary also indicates that some teachers are uneasy about behavior tracking or
      classroom surveillance. These are not company-ending problems, but they do define
      the upper bound on what the market can comfortably pay. That is why the refresh
      treats valuation risk as a live underwriting issue, not a theoretical one. In other
      words, uncertainty in disclosure is itself a risk factor.
    claimRefs: [CR007, CR008, CR009, CR010]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Regulatory sensitivity is the key thesis-break vector
    body: >-
      A meaningful privacy or COPPA adverse event would hit both product adoption and
      exit optionality at the same time.
    claimRefs: [CR001, CR002, CR003]
  - calloutType: recommendation
    title: Monitor support friction and district network blocks
    body: >-
      The most actionable operating risk is not a catastrophic outage; it is cumulative
      classroom frustration from sync failures and blocked installs.
    claimRefs: [CR004, CR005, CR006]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [risk, jurisdiction_or_scope, status, severity, mitigation, diligence_path]
    rows:
      - ["COPPA / child privacy", "U.S. child-data products", "Ongoing compliance obligation", "high", "Privacy policy, school consent, retention controls", "Request current legal memo"]
      - ["FERPA / school data handling", "School and district use", "Ongoing compliance obligation", "high", "DPA and security controls", "Request current DPA package"]
      - ["Global privacy regimes", "GDPR / PIPEDA and similar", "Ongoing compliance obligation", "medium", "Policy disclosures and access rights", "Confirm international counsel review"]
      - ["No confirmed active litigation", "Public record", "No public case found in this refresh", "low", "Monitor docket and complaint databases", "Run follow-up legal search"]
    notes: "No current public lawsuit or enforcement action was found in the available sources; that is not a guarantee of zero exposure."
    claimRefs: [CR001, CR002, CR003, CR010]
    enumerationScope:
      coverage: partial
      basis: "The table enumerates the main legal and regulatory buckets but not every jurisdiction-specific edge case."
  - id: TR002
    title: Operational and quality risk register
    columns: [failure_mode, likelihood, severity, mitigation_maturity, residual_exposure]
    rows:
      - ["Browser or privacy setting blocks sync", "medium", "high", "documented fix path", "teacher frustration and support load"]
      - ["School network/firewall issue", "medium", "high", "documented allowlist instructions", "classroom disruption"]
      - ["Service incident or outage", "low", "high", "status page and monitoring", "reputation damage if sustained"]
      - ["AI feature misbehavior or policy friction", "medium", "high", "privacy controls in progress", "trust hit if controls fail"]
    notes: "Operational risk is primarily support and classroom continuity risk, not heavy infrastructure fragility."
    claimRefs: [CR004, CR005, CR006]
    figureRefs: [FR001]
  - id: TR003
    title: Mitigation and kill criteria table
    columns: [risk, monitorable_trigger, threshold_or_event, action_implication]
    rows:
      - ["Privacy / COPPA", "Regulatory inquiry or negative legal finding", "Any active regulator correspondence", "Escalate to legal diligence and consider delay"]
      - ["Support friction", "Ticket volume or sync failure spikes", "Material classroom disruption reports", "Prioritize product remediation"]
      - ["Concentration / governance", "Customer or investor concentration disclosure", "High dependency on a small number of accounts or investors", "Adjust valuation discount"]
      - ["Valuation overhang", "ARR remains unconfirmed", "No management disclosure after diligence", "Prefer track over buy"]
    notes: "Kill criteria reflect the refresh's inability to close public metric gaps."
    claimRefs: [CR001, CR004, CR007, CR008]
