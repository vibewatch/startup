          tone: negative
        - label: "Status page"
          date: "2026"
          details: "Service health is currently green, but that does not solve classroom friction."
          tone: neutral
        - label: "Investor opacity"
          date: "2026"
          details: "Cash, burn, and customer concentration remain undisclosed."
          tone: negative
        - label: "Behavior criticism"
          date: "2026"
          details: "Teacher commentary continues to raise classroom-surveillance concerns."
          tone: negative
    approximationNotes: "The timeline highlights risk categories rather than assigning probabilities."
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR007, CR008, CR009, CR010]

