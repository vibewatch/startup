company:
  name: ClassDojo
chapter:
  number: 1
  title: Company Overview
  summary: ClassDojo remains a dominant K-8 school-to-home communication platform with a freemium teacher product, a paid family subscription, and a newer district-facing layer. The company's public footprint is still strong, but key underwriting inputs such as confirmed ARR, Plus subscriber count, and churn remain unverified in public sources.
sections:
  - id: identity-and-scale
    title: Identity, scale, and positioning
    body: >-
      ClassDojo was founded in 2011 in San Francisco by Sam Chaudhary and Liam Don.
      Its core product is a classroom communication and management platform that lets
      teachers share messages, photos, videos, portfolios, activities, and behavior
      feedback with parents and students. The company still describes the teacher-facing
      product as free, and its public materials emphasize broad reach rather than a
      narrow district sales motion. Across the current sources, the consistent signal is
      category dominance: ClassDojo claims more than 51 million children, families, and
      teachers across 180 countries and 95%+ penetration in U.S. K-8 schools.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: funding-and-governance
    title: Funding, governance, and team scale
    body: >-
      Public funding history still points to a well-capitalized private unicorn. Tracxn
      lists $221M raised across 9 rounds, including a $125M Series D in July 2022 at a
      $1.25B post-money valuation and an undisclosed Series D extension in March 2024 led
      by Five Sigma. Tracxn also shows a current headcount of roughly 513 employees as of
      late August 2026, which is consistent with a mid-size consumer-tech and education
      platform rather than a large enterprise software vendor. The investor base remains
      anchored by Tencent, General Catalyst, SignalFire, and other long-tenured backers.
    claimRefs: [CO006, CO007, CO010]
    tableRefs: [TO002]
  - id: product-and-monitization
    title: Product line and monetization
    body: >-
      The monetization model is still a freemium blend of consumer subscription and
      district selling. The App Store page shows ClassDojo Plus as an in-app purchase,
      with multiple price points that currently include monthly and annual tiers. Public
      product pages also show a newer district-facing bundle centered on messaging,
      behavior, classroom tools, attendance sync, and AI assistance. Recent ClassDojo
      announcements highlight Sidekick and Dojo Sparks, which suggests the product road
      map is now explicitly extending from communication into teacher productivity and
      learning content. That expansion matters because it broadens the eventual revenue
      surface, even if the current revenue mix remains opaque.
    claimRefs: [CO008, CO009, CO012]
    tableRefs: [TO003]
  - id: diligence-gap
    title: Diligence gap and underwriting implication
    body: >-
      The central refresh gap is unchanged from the prior review: public sources still do
      not confirm ARR, Plus subscriber count, or churn. That means valuation discipline
      has to lean on proxy evidence such as pricing, install base, headcount, and public
      adoption rather than any management-confirmed recurring revenue number. Because the
      company is already scaled and privately financed, the right framing is not whether
      the product has product-market fit, but whether the current monetization path is
      strong enough to justify the private-market mark without a hard revenue disclosure.
    claimRefs: [CO011, CO012]
    tableRefs: []
callouts:
  - calloutType: recommendation
    title: Keep ARR and subscriber counts as explicit diligence asks
    body: >-
      The refresh should preserve ARR, Plus subscriber count, and monthly churn as live
      diligence gaps until management or a primary disclosure source confirms them.
    claimRefs: [CO012]
