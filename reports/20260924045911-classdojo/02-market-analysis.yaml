  name: ClassDojo
chapter:
  number: 2
  title: Market Analysis
  summary: ClassDojo operates in the school-home communication and classroom-management market, which is fragmented across consumer, district, and status-quo workflow alternatives. Public evidence supports a large reachable user surface, but not a clean single-number TAM, so the refresh treats sizing as an evidence-constrained proxy exercise.
acknowledgedWarnings:
  - dimension: figureType
    reason: The chapter intentionally uses a timeline figure instead of the planned pyramid figure.
sections:
  - id: market-boundary
    title: Market boundary and buyer roles
    body: >-
      The relevant market is broader than "school messaging." ClassDojo sits at the
      intersection of teacher-to-parent communication, classroom behavior tooling,
      student portfolios, attendance follow-up, and family engagement. The user is often
      a teacher, the decision influencer may be a school leader, and the payer can be a
      parent for consumer features or a district for institutional rollout. That split
      matters because the product can win bottom-up on teacher adoption while still
      monetizing top-down or directly through families.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: adoption-and-growth
    title: Adoption drivers and growth constraints
    body: >-
      The public sources point to three durable demand drivers: multilingual family
      communication, easy classroom culture management, and low-friction rollout because
      the teacher product remains free. The same sources also show the main constraints:
      school privacy expectations, district network and browser issues, and a monetization
      model that must convert free usage into paid family or district value. In other
      words, ClassDojo's market is large, but monetization is gated by trust and habit
      rather than by a simple seat-license motion.
    claimRefs: [CM004, CM005, CM009, CM010]
    tableRefs: [TM002]
  - id: sizing-and-substitutes
    title: Sizing lenses and substitutes
    body: >-
      A precise public TAM is not available from current primary evidence. The more
      defensible sizing approach is to use multiple lenses: the school install base, the
      family subscription pool, and the district workflow surface. By that framing, the
      addressable audience is already massive because ClassDojo claims 95%+ K-8 U.S.
      penetration, 51M+ users, and 180-country reach. The practical substitutes are the
      status quo: email/text chains, spreadsheets, paper behavior charts, SIS workflows,
      and generic classroom tools that do not combine engagement and monetization as
      tightly. The practical substitutes are not just rival apps; they also include
      status-quo email, text chains, paper behavior charts, and district systems that
      solve only one slice of the workflow. That matters for underwriting because the
      moat is behavioral, not exclusive: a substitute only needs to reduce friction to
      slow conversion. The result is broad reach but a monetization funnel that still
      depends on trust, workflow fit, and teacher habit.
    claimRefs: [CM006, CM007, CM008, CM011]
    tableRefs: [TM003]
    figureRefs: [FM001]
callouts:
  - calloutType: insight
    title: Large reach does not equal large monetization
    body: >-
      The same install base that creates a moat also makes monetization hard because most
      users expect the core teacher workflow to remain free.
    claimRefs: [CM003, CM009]
  - calloutType: assumption
    title: Use proxy sizing, not a single TAM number
    body: >-
      Without a primary revenue disclosure, valuation work should rely on multiple
      reach-and-conversion lenses rather than a single market-size headline.
    claimRefs: [CM011]
