        - track
        - Strong product but opaque recurring revenue
      - - confidence
        - medium
        - Evidence is good on adoption, weak on ARR
      - - risk rating
        - high
        - Privacy and valuation opacity remain material
      - - valuation stance
        - stretched
        - Private mark relies on unconfirmed monetization
    notes: Summary reflects the current refresh only and not the prior report's scorecard.
