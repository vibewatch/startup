  - id: TR003
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable_trigger
      - threshold_or_event
      - action_implication
    rows:
      - - Privacy / COPPA
        - Regulatory inquiry or negative legal finding
        - Any active regulator correspondence
        - Escalate to legal diligence and consider delay
      - - Support friction
        - Ticket volume or sync failure spikes
        - Material classroom disruption reports
        - Prioritize product remediation
      - - Concentration / governance
        - Customer or investor concentration disclosure
        - High dependency on a small number of accounts or investors
        - Adjust valuation discount
      - - Valuation overhang
        - ARR remains unconfirmed
        - No management disclosure after diligence
        - Prefer track over buy
    notes: Kill criteria reflect the refresh's inability to close public metric gaps.
