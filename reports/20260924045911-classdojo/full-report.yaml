      - metric
      - value_or_signal
      - relevance
      - limitation
    rows:
      - - Tracxn mark
        - post-money valuation
        - $1.25B disclosed in 2022
        - Latest hard anchor
        - Old and not refreshed by a new disclosed round
      - - GetLatka
        - ARR estimate
        - $51.9M est. ARR
        - Useful revenue proxy
        - Model estimate, not management disclosure
      - - Caplight comps
