companyProfile:
  summary: >-
    ClassDojo is a San Francisco-based education software company founded in 2011 by Sam Chaudhary and Liam Don. The
    product started as a free classroom communication and behavior tool and has expanded into a broader
    family-engagement platform with a paid consumer subscription (ClassDojo Plus), district-facing workflows, and AI-led
    features such as Sidekick and Dojo Sparks. Public sources indicate the company has raised about $221M and remains a
    private unicorn with broad U.S. K-8 penetration, but the key underwriting inputs - ARR, churn, and customer
    concentration - are not publicly confirmed.
