chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale, and positioning
        blocks:
          - type: paragraph
            body: >-
              ClassDojo was founded in 2011 in San Francisco by Sam Chaudhary and Liam Don. Its core product is a
              classroom communication and management platform that lets teachers share messages, photos, videos,
              portfolios, activities, and behavior feedback with parents and students. The company still describes the
              teacher-facing product as free, and its public materials emphasize broad reach rather than a narrow
              district sales motion. Across the current sources, the consistent signal is category dominance: ClassDojo
              claims more than 51 million children, families, and teachers across 180 countries and 95%+ penetration in
              U.S. K-8 schools.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
              - CO008
              - CO011
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Funding, governance, and team scale
        blocks:
          - type: paragraph
            body: >-
              Public funding history still points to a well-capitalized private unicorn. Tracxn lists $221M raised
              across 9 rounds, including a $125M Series D in July 2022 at a $1.25B post-money valuation and an
              undisclosed Series D extension in March 2024 led by Five Sigma. Tracxn also shows a current headcount of
              roughly 513 employees as of late August 2026, which is consistent with a mid-size consumer-tech and
              education platform rather than a large enterprise software vendor. The investor base remains anchored by
              Tencent, General Catalyst, SignalFire, and other long-tenured backers.
            claimRefs:
              - CO006
              - CO007
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
      - number: '1.3'
        title: Product line and monetization
        blocks:
          - type: paragraph
            body: >-
              The monetization model is still a freemium blend of consumer subscription and district selling. The App
              Store page shows ClassDojo Plus as an in-app purchase, with multiple price points that currently include
              monthly and annual tiers. Public product pages also show a newer district-facing bundle centered on
              messaging, behavior, classroom tools, attendance sync, and AI assistance. Recent ClassDojo announcements
              highlight Sidekick and Dojo Sparks, which suggests the product road map is now explicitly extending from
              communication into teacher productivity and learning content. That expansion matters because it broadens
              the eventual revenue surface, even if the current revenue mix remains opaque.
            claimRefs:
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: Diligence gap and underwriting implication
        blocks:
          - type: paragraph
            body: >-
              The central refresh gap is unchanged from the prior review: public sources still do not confirm ARR, Plus
              subscriber count, or churn. That means valuation discipline has to lean on proxy evidence such as pricing,
              install base, headcount, and public adoption rather than any management-confirmed recurring revenue
              number. Because the company is already scaled and privately financed, the right framing is not whether the
              product has product-market fit, but whether the current monetization path is strong enough to justify the
              private-market mark without a hard revenue disclosure.
            claimRefs:
              - CO011
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Keep ARR and subscriber counts as explicit diligence asks
            body: >-
              The refresh should preserve ARR, Plus subscriber count, and monthly churn as live diligence gaps until
              management or a primary disclosure source confirms them.
            calloutType: recommendation
            claimRefs:
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer roles
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than "school messaging." ClassDojo sits at the intersection of
              teacher-to-parent communication, classroom behavior tooling, student portfolios, attendance follow-up, and
              family engagement. The user is often a teacher, the decision influencer may be a school leader, and the
              payer can be a parent for consumer features or a district for institutional rollout. That split matters
              because the product can win bottom-up on teacher adoption while still monetizing top-down or directly
              through families.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Adoption drivers and growth constraints
        blocks:
          - type: paragraph
            body: >-
              The public sources point to three durable demand drivers: multilingual family communication, easy
              classroom culture management, and low-friction rollout because the teacher product remains free. The same
              sources also show the main constraints: school privacy expectations, district network and browser issues,
              and a monetization model that must convert free usage into paid family or district value. In other words,
              ClassDojo's market is large, but monetization is gated by trust and habit rather than by a simple
              seat-license motion.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.3'
        title: Sizing lenses and substitutes
        blocks:
          - type: paragraph
            body: >-
              A precise public TAM is not available from current primary evidence. The more defensible sizing approach
              is to use multiple lenses: the school install base, the family subscription pool, and the district
              workflow surface. By that framing, the addressable audience is already massive because ClassDojo claims
              95%+ K-8 U.S. penetration, 51M+ users, and 180-country reach. The practical substitutes are the status
              quo: email/text chains, spreadsheets, paper behavior charts, SIS workflows, and generic classroom tools
              that do not combine engagement and monetization as tightly. The practical substitutes are not just rival
              apps; they also include status-quo email, text chains, paper behavior charts, and district systems that
              solve only one slice of the workflow. That matters for underwriting because the moat is behavioral, not
              exclusive: a substitute only needs to reduce friction to slow conversion. The result is broad reach but a
              monetization funnel that still depends on trust, workflow fit, and teacher habit.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM010
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Large reach does not equal large monetization
            body: >-
              The same install base that creates a moat also makes monetization hard because most users expect the core
              teacher workflow to remain free.
            calloutType: insight
            claimRefs:
              - CM003
              - CM009
          - type: callout
            title: Use proxy sizing, not a single TAM number
            body: >-
              Without a primary revenue disclosure, valuation work should rely on multiple reach-and-conversion lenses
              rather than a single market-size headline.
            calloutType: assumption
            claimRefs:
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The public record does not point to one dominant direct rival. Instead, the practical competitive set is
              broad: district communication suites, generic LMS and SIS workflows, behavior-management tools, and
              consumer learning apps that may capture the same family attention. Tracxn lists hundreds of active
              competitors, while ClassDojo's own product pages make clear that the product competes by combining
              communication, classroom culture, and family engagement in one free teacher workflow. That bundled
              positioning is the core source of differentiation, but it also means the company is competing against
              habit, not just against other software brands. The practical defense is breadth of use across teachers,
              parents, and districts, not a single feature lock. This is a sticky workflow moat.
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP008
              - CP013
              - CP014
      - number: '3.2'
        title: Differentiation and switching costs
        blocks:
          - type: paragraph
            body: >-
              ClassDojo's differentiation is not a single feature; it is the way the feature set maps onto a daily
              classroom habit loop. Teachers can message families, award points, share portfolios, and keep routines in
              one product, while the district page now adds attendance sync, reachability reporting, and AI-assisted
              workflows. Customer reviews and the App Store rating suggest that the product's real moat is adoption
              depth and habit formation rather than pure technical exclusivity. That means any competitor that reduces
              setup burden or better matches admin policy can chip away at the installed base without needing to
              out-innovate the core product.
            claimRefs:
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
      - number: '3.3'
        title: Competitive risks and substitutes
        blocks:
          - type: paragraph
            body: >-
              The most likely displacement path is not a single software swap; it is teachers and districts falling back
              to email, SMS, paper behavior charts, or an alternative district suite that is easier to standardize.
              Support articles about sync failures and network blocking show that implementation friction still matters.
              Adverse user commentary also suggests some teachers are uneasy about classroom behavior tracking, public
              perception, and the social dynamics of reward systems. Put differently, replacement pressure comes from
              social acceptability and operational fit as much as from features.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is a workflow habit, not a hard technical lock
            body: >-
              If a district standardizes on another communication stack, the main defense is user habit and network
              effects, not exclusive data rights or deep proprietary IP.
            calloutType: risk
            claimRefs:
              - CP003
              - CP005
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The visible revenue stack has three parts: the free teacher communication product that drives
              distribution, ClassDojo Plus as the consumer subscription, and the district-facing product surface that
              now includes instructional-leader features, attendance sync, and AI assistance. The App Store makes the
              consumer monetization leg explicit with monthly and annual in-app purchases. Public product pages also
              frame the teacher and school products as free, which is consistent with a bottom-up adoption motion and a
              monetization model that converts a minority of engaged families or districts. The public record still does
              not disclose the mix between family, school, and district revenue, so the exact shape of monetization
              remains a diligence gap rather than a solved model.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI006
              - CI008
              - CI011
              - CI012
      - number: '4.2'
        title: Unit economics and revenue quality
        blocks:
          - type: paragraph
            body: >-
              The historical public record says ClassDojo reached profitability in 2019 and then grew revenue
              meaningfully during 2020, which suggests the subscription engine can fund the core product rather than act
              as pure promotion. More recent third-party estimates still imply a modest revenue base relative to the
              $1.25B valuation mark, so the underwriting question is not whether the company monetizes, but whether the
              monetization rate is high enough to justify the current private-market narrative. That is especially true
              because the company has not publicly broken out gross margin, retention, or revenue mix. The result is a
              business that looks real and scaled, but not yet fully auditable from public data.
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
      - number: '4.3'
        title: Capital adequacy and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              ClassDojo looks well financed for a private consumer platform. Tracxn lists $221M raised, the 2022 Series
              D at $125M and $1.25B valuation, plus an undisclosed 2024 extension. What is still missing is the classic
              capital-discipline data set: cash on hand, current burn, runway, and the rate at which family
              subscriptions and district tools convert into durable recurring revenue. Because the company is already
              scaled, the critical diligence move is to validate that the current price can be supported without
              assuming a future IPO-style revenue multiple expansion. Put simply, the company is mature enough that
              small errors in churn or mix can change the valuation story.
            claimRefs:
              - CI005
              - CI006
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat ARR and churn as the deciding diligence ask
            body: >-
              A defensible valuation still depends on confirming whether ClassDojo's monetization is closer to the lower
              or upper end of public estimates.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI007
          - type: callout
            title: Private-market valuation may be outrunning disclosed revenue
            body: >-
              The biggest financial risk is not lack of monetization; it is lack of an audited or management-confirmed
              revenue base that can cleanly justify the current mark.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: callout
            title: Freemium distribution lowers CAC but obscures payback math
            body: >-
              The product can scale virally with a low direct-acquisition budget, but the public data still does not
              show the payback period or conversion funnel in enough detail.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI004
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and use cases
        blocks:
          - type: paragraph
            body: >-
              The current product surface covers classroom communication, behavior points, student portfolios,
              activities, stories, district messaging, and AI assistance. Teachers use it to share classroom updates and
              reinforce behavior; parents use it to receive photos, videos, messages, and reminders; district leaders
              use it to standardize communication and monitor reachability. The official pages now make it clear that
              ClassDojo is no longer just a messaging app. It is a multi-surface workflow product that combines
              communication, culture, and administrative reporting. The practical consequence is that the product now
              has to satisfy both classroom habit and district governance, which widens the design surface and makes
              every new feature a trust decision as well as a UX decision.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
      - number: '5.2'
        title: Architecture and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The engineering blog describes a modern SaaS stack with strong emphasis on data pipelines, AWS, Redshift,
              Airflow, dbt, and monitoring. The security overview adds more detail: student data lives in AWS us-east-1,
              access is role-based, and the company enforces 2FA, TLS, logging, and regular vulnerability management.
              Help articles and the status page show that the product still depends on browser compatibility,
              school-network configuration, and device sync quality. In practice, the architecture is credible, but
              adoption still depends on low-friction sync and clear support paths. That makes reliability a product
              feature, not just an ops one.
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE009
      - number: '5.3'
        title: Trust posture and roadmap
        blocks:
          - type: paragraph
            body: >-
              ClassDojo continues to lean on privacy and security as part of the product value proposition. The privacy
              policy says the company does not sell personal data and deletes school feedback points after 12 months,
              while the security overview describes a SOC 2 certification path. The roadmap signal is now clearly
              AI-forward: recent blog and district pages highlight Sidekick and Dojo Sparks, suggesting that the next
              product cycle is about time-saving for teachers and learning support for families, not just messaging.
              That also means the roadmap now sits at the center of product trust: AI help has to feel useful without
              making privacy concerns louder, or adoption will stall.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Keep privacy and sync reliability as product-level priorities
            body: >-
              Trust-sensitive product categories need both compliance posture and day-to-day sync reliability; either
              one can slow adoption.
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: AI expansion increases both differentiation and policy scrutiny
            body: >-
              Sidekick and Dojo Sparks widen the product moat, but they also raise the bar for data handling,
              explainability, and parent trust.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: Developer signal is real but mostly internal-facing
            body: >-
              The public engineering footprint is credible, yet the product's developer ecosystem is not a classic
              external-platform story.
            calloutType: insight
            claimRefs:
              - CE004
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              ClassDojo serves three overlapping customer groups: teachers who use the free classroom product, parents
              and families who receive updates and may buy Plus, and districts or school leaders who now get
              administrative workflow tools. That split is important because the company can show broad user reach
              without proving a single enterprise-account sales motion. Public sources still emphasize bottom-up
              adoption in K-8 classrooms, but the district page makes clear that institutional use is now a material
              secondary segment. The same footprint also implies that customer demand is multi-sided: teachers create
              the classroom graph, families amplify engagement, and districts can widen the workflow budget when they
              buy in.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption trajectory and proof of use
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is public and current: App Store ratings, software review scores, and
              company disclosures consistently frame ClassDojo as a high-use classroom product. The App Store shows
              millions of ratings, while SoftwareReviews shows high likeliness-to-recommend and renewal intent. The
              company also continues to publish stories about classroom and district use, which suggests the product is
              not a vanity brand but a daily workflow with concrete engagement. EdSurge's prior reporting is useful here
              too: the company could turn classroom adoption into a home and family revenue motion, which is exactly the
              sort of conversion path that makes customer proof more than a logo count.
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              What remains missing is the standard retention dashboard: NRR, GRR, churn, district renewal, and
              concentration by account or geography. The public evidence does, however, imply strong top-line retention
              because the product is embedded in classroom routines and family communications. Expansion is increasingly
              two-layered: more parents can buy Plus, and more districts can adopt the instructional-leader layer. That
              creates an upsell path, but it does not yet substitute for a hard retention disclosure. In diligence
              terms, this means the growth story is visible, but the durability story still depends on private cohort
              data that the company has not published.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is broad, but retention is still inferred
            body: The company has excellent proof of usage and very limited proof of cohort economics.
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU007
          - type: callout
            title: Concentration risk is hidden, not absent
            body: >-
              Without customer concentration data, the refresh has to assume that a small number of districts or regions
              could still matter disproportionally.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
          - type: callout
            title: Ask for district renewal and family churn by cohort
            body: >-
              The most useful next diligence step is a cohort view for Plus and district accounts, not another topline
              user-count claim.
            calloutType: recommendation
            claimRefs:
              - CU007
              - CU008
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              ClassDojo operates in a sensitive child-data environment, so privacy and COPPA exposure remain the most
              important risks. The privacy policy and security overview say the company is designed to comply with COPPA
              and FERPA, does not sell personal data, and uses retention controls, but those claims do not eliminate the
              possibility of regulatory scrutiny. The underlying risk is structural: if a child communication product is
              judged against a stricter privacy standard, the company would face heavier compliance costs and
              potentially slower product iteration. That risk is not hypothetical; it is the price of operating in a
              classroom trust market. Put bluntly, trust is part of the product, not a marketing layer.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
      - number: '7.2'
        title: Operational, reliability, and support risk
        blocks:
          - type: paragraph
            body: >-
              The help-center material shows that sync issues can come from browser versions, privacy settings, and
              district network blocks. That is not catastrophic, but it is the kind of last-mile friction that can
              frustrate teachers and district admins when classroom communication has to work every day. The status page
              currently says everything looks good, but the real question is whether support tickets and implementation
              work consume more time than the public pages imply. Even small reliability problems can become adoption
              problems when teachers use the product in live class periods. The support burden therefore feeds directly
              into retention and district willingness to standardize.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Financial, concentration, and governance risk
        blocks:
          - type: paragraph
            body: >-
              The company is well funded, but the disclosure gap around ARR, churn, cash, and account concentration
              still leaves valuation and governance risk unresolved. Tencent remains a headline investor, which can
              matter for exit pathways and geopolitical perceptions even when there is no immediate operational issue.
              Adverse third-party commentary also indicates that some teachers are uneasy about behavior tracking or
              classroom surveillance. These are not company-ending problems, but they do define the upper bound on what
              the market can comfortably pay. That is why the refresh treats valuation risk as a live underwriting
              issue, not a theoretical one. In other words, uncertainty in disclosure is itself a risk factor.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR008
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory sensitivity is the key thesis-break vector
            body: >-
              A meaningful privacy or COPPA adverse event would hit both product adoption and exit optionality at the
              same time.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Monitor support friction and district network blocks
            body: >-
              The most actionable operating risk is not a catastrophic outage; it is cumulative classroom frustration
              from sync failures and blocked installs.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Bull thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: ClassDojo owns a massive classroom habit loop, has consumer-style
              virality, has already shown profitability, and has multiple monetization levers beyond the free teacher
              core. The company claims 95%+ U.S. K-8 penetration and 51M+ users, and the product now spans
              communication, behavior, family engagement, and AI-assisted teacher productivity. If Plus conversion or
              the district layer scales meaningfully, the current private mark could still prove conservative overall.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV008
      - number: '8.2'
        title: Bear thesis
        blocks:
          - type: paragraph
            body: >-
              The bear case is that the valuation already assumes monetization success that is not publicly confirmed.
              The company has not disclosed ARR, churn, cash, or a current revenue mix, and third-party revenue
              estimates remain wide enough to matter. At the same time, privacy sensitivity and implementation friction
              add a discount rate that is higher than a typical consumer app. In that setting, a $1.25B mark may be fair
              for a strategic franchise but still stretched for a private investor underwriting a fresh entry.
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.3'
        title: Comparable references and pricing discipline
        blocks:
          - type: paragraph
            body: >-
              Public comparison points are imperfect but still useful. Caplight lists ClassDojo alongside Seesaw,
              ParentSquare, and SchoolStatus as embedded comparables by business-model similarity. Tracxn and GetLatka
              provide the most explicit public valuation and ARR anchors we have in this refresh. None of those sources
              replaces a management model, but together they support the conclusion that this is a scaled, durable
              product with a valuation that has to be judged on revenue disclosure rather than on user count alone.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
      - number: '8.4'
        title: Recommendation and scenario view
        blocks:
          - type: paragraph
            body: >-
              The right recommendation remains track rather than buy or avoid. The company is too strong to dismiss and
              too opaque to mark aggressively upward. The upside case depends on confirming that ARR is materially above
              the low end of public estimates and that district expansion or Plus conversion can accelerate without a
              major regulatory or support setback. Until then, the refresh supports a hold posture with a valuation
              stance of stretched.
            claimRefs:
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.5'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit optionality looks real but not fully de-risked. A future IPO or acquisition could work if the company
              proves durable recurring revenue and keeps the privacy posture clean. The most important diligence asks
              remain unchanged: confirmed ARR, Plus subscriber count, churn, district ACV/renewal, and a current
              legal/privacy status check. Those inputs would tell us whether the market is paying for an actual
              recurring revenue platform or just for an unusually strong user franchise. That distinction is still the
              central valuation hinge.
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV011
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Keep the public valuation anchor but require revenue confirmation
            body: >-
              The current mark is not obviously wrong; it is simply not yet supported by public recurring-revenue
              evidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
          - type: callout
            title: The main downside is opacity, not product failure
            body: >-
              ClassDojo can still be a great business and a mediocre entry at the same time if the undisclosed revenue
              base is weaker than the market assumes.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV010
          - type: callout
            title: Track is the evidence-weighted choice
            body: >-
              The refresh does not justify an upgrade to buy because the decisive missing inputs are still missing. That
              is exactly why the recommendation remains evidence-led.
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV010
