company:
  name: ClassDojo
chapter:
  number: 4
  title: Financials
  summary: ClassDojo's revenue model is still a free teacher core plus paid family subscription and emerging district software, but the public record remains light on standard SaaS metrics. The refresh supports a profitable, capital-efficient consumer education business with strong monetization optionality, while keeping ARR and churn as unresolved diligence gaps.
acknowledgedWarnings:
  - dimension: figureType
    reason: The chapter intentionally uses a timeline figure instead of the planned waterfall figure.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      The visible revenue stack has three parts: the free teacher communication product
      that drives distribution, ClassDojo Plus as the consumer subscription, and the
      district-facing product surface that now includes instructional-leader features,
      attendance sync, and AI assistance. The App Store makes the consumer monetization
      leg explicit with monthly and annual in-app purchases. Public product pages also
      frame the teacher and school products as free, which is consistent with a
      bottom-up adoption motion and a monetization model that converts a minority of
      engaged families or districts. The public record still does not disclose the mix
      between family, school, and district revenue, so the exact shape of monetization
      remains a diligence gap rather than a solved model.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: unit-economics
    title: Unit economics and revenue quality
    body: >-
      The historical public record says ClassDojo reached profitability in 2019 and then
      grew revenue meaningfully during 2020, which suggests the subscription engine can
      fund the core product rather than act as pure promotion. More recent third-party
      estimates still imply a modest revenue base relative to the $1.25B valuation mark,
      so the underwriting question is not whether the company monetizes, but whether the
      monetization rate is high enough to justify the current private-market narrative.
      That is especially true because the company has not publicly broken out gross
      margin, retention, or revenue mix. The result is a business that looks real and
      scaled, but not yet fully auditable from public data.
    claimRefs: [CI005, CI006, CI007]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and remaining gaps
    body: >-
      ClassDojo looks well financed for a private consumer platform. Tracxn lists $221M
      raised, the 2022 Series D at $125M and $1.25B valuation, plus an undisclosed 2024
      extension. What is still missing is the classic capital-discipline data set: cash on
      hand, current burn, runway, and the rate at which family subscriptions and district
      tools convert into durable recurring revenue. Because the company is already
      scaled, the critical diligence move is to validate that the current price can be
      supported without assuming a future IPO-style revenue multiple expansion. Put
      simply, the company is mature enough that small errors in churn or mix can change
      the valuation story.
    claimRefs: [CI005, CI006, CI008]
    tableRefs: [TI003]
callouts:
  - calloutType: recommendation
    title: Treat ARR and churn as the deciding diligence ask
    body: >-
      A defensible valuation still depends on confirming whether ClassDojo's monetization
      is closer to the lower or upper end of public estimates.
    claimRefs: [CI006, CI007]
  - calloutType: risk
    title: Private-market valuation may be outrunning disclosed revenue
    body: >-
      The biggest financial risk is not lack of monetization; it is lack of an audited or
      management-confirmed revenue base that can cleanly justify the current mark.
    claimRefs: [CI005, CI006, CI007]
  - calloutType: insight
    title: Freemium distribution lowers CAC but obscures payback math
    body: >-
      The product can scale virally with a low direct-acquisition budget, but the public
      data still does not show the payback period or conversion funnel in enough detail.
    claimRefs: [CI001, CI002, CI004]
