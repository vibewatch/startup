schemaVersion: "report-v2"
artifact: financials
slug: matx
runDate: 2026-10-17
company:
  name: MatX
chapter:
  number: 4
  title: Financials
  summary: >-
    MatX has substantial financing for a semiconductor startup, led by a reported
    $500 million Series B, but the public record still describes a pre-shipment
    company targeting 2027 rather than an evidenced revenue base. Public sources
    do not disclose pricing, revenue, margins, cash burn, or runway, so capital
    adequacy and unit economics cannot yet be underwritten.
sections:
  - id: financing-and-capital-deployment
    title: Financing and capital deployment
    body: >-
      Independent secondary reporting consistently places the latest financing at
      $500 million and aggregate funding at approximately $600 million. The new
      capital is described as funding product design, manufacturing preparation,
      foundry capacity, critical components, and hiring rather than as liquidity
      available for an already commercial business. That distinction matters:
      funding raised is not cash on hand, and neither figure is runway. MatX has
      enough reported capital to attempt an unusually expensive chip program, but
      the retained sources provide no current cash balance, burn rate, committed
      wafer or packaging payments, debt, or milestone-based financing terms.
      Capital adequacy therefore depends on an undisclosed spending plan and on
      reaching tapeout and first shipments without material delay.
    claimRefs: [CI001, CI002, CI003, CI004, CI009, CI014]
    figureRefs: [FI001]
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      The evidence identifies MatX One as the intended commercial product and
      attributes both LLM training and inference use cases to it, but it does not
      establish how customers will buy or consume that capacity. No retained
      source gives a list price, average selling price, system configuration,
      minimum commitment, cloud-consumption rate, support fee, discount policy,
      or revenue-recognition convention. The 2027 shipment target also means that
      any current commercial traction should not be conflated with recognized
      product revenue. Until contracts or invoices are reviewed, the plausible
      hardware, cluster, and software-support mechanisms below are underwriting
      hypotheses and diligence categories, not demonstrated revenue streams.
    claimRefs: [CI005, CI006, CI008, CI010]
    tableRefs: [TI001, TI002]
  - id: unit-economics-and-cost-base
    title: Unit economics and cost base
    body: >-
      MatX is pursuing a capital-intensive fabless semiconductor model. Public
      reporting ties proceeds to design completion, TSMC capacity, components,
      and team expansion, while the product's narrow LLM focus and acknowledged
      programming tradeoffs may require meaningful compiler, systems-software,
      and customer-support investment. None of the assigned sources supplies
      wafer cost, packaging cost, yield, memory bill of materials, ASP, gross
      margin, contribution margin, CAC, sales cycle, payback, or working-capital
      terms. These are not safely inferable from the size of the financing or
      from claimed chip performance. A useful underwriting model therefore needs
      management-provided unit data and contractual evidence rather than a
      benchmark borrowed from a mature public semiconductor vendor.
    claimRefs: [CI002, CI004, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The strongest financial fact is access to capital, not revenue quality.
      The financing appears large enough to reserve manufacturing inputs and
      continue development, but first shipment is still reported for 2027 and
      EverMX explicitly notes that there is no shipping product and that
      performance claims remain unvalidated in production. A schedule slip,
      weak yield, software-integration burden, or lower-than-expected realized
      price could consume capital before recurring demand is proven. Because the
      exact valuation, current liquidity, burn, customer commitments, pricing,
      margins, and financing obligations remain undisclosed, the appropriate
      verdict is that the margin path, revenue durability, and next-round trigger
      are un-underwritable from public evidence rather than demonstrably strong
      or weak.
    claimRefs: [CI005, CI007, CI011, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams and monetization hypotheses
    columns:
      - Stream or mechanism
      - Unit or contract basis
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - MatX One accelerator sales
        - Per chip or system; undisclosed
        - First shipments reported for 2027
        - No realized revenue disclosed
        - Provide bookings, backlog, ASP, cancellation terms, and revenue-recognition policy
      - - LLM training deployments
        - Hardware, cluster, or capacity contract; undisclosed
        - Supported product use case, not an evidenced revenue stream
        - Unknown
        - Provide signed training contracts, deployment size, and acceptance milestones
      - - LLM inference deployments
        - Hardware, hosted capacity, or usage; undisclosed
        - Supported product use case, not an evidenced revenue stream
        - Unknown
        - Provide pricing metric, committed volume, utilization, and renewal structure
      - - Compiler, software, and support
        - License, subscription, or bundled support; undisclosed
        - No standalone monetization evidence in the retained sources
        - Unknown
        - Clarify whether software and support are priced, bundled, or subsidized
    notes: >-
      Rows separate evidenced product use cases from hypothetical monetization;
      unknown entries are not estimates and require management documentation.
    claimRefs: [CI005, CI006, CI008, CI010, CI011]
  - id: TI002
    title: Pricing and contracting evidence
    columns:
      - Pricing input
      - Public value
      - Underwriting implication
      - Required evidence
    rows:
      - - List price or cloud rate
        - Not disclosed in retained evidence
        - Addressable demand cannot be translated into revenue
        - Current price book and configuration rules
      - - Realized ASP and discounts
        - Not disclosed in retained evidence
        - Gross revenue per deployment is unknown
        - Executed orders, discount approvals, and channel economics
      - - Contract and recognition model
        - Not disclosed in retained evidence
        - Timing, backlog quality, and working capital are unknown
        - Contract templates, deposits, acceptance clauses, and accounting policy
    notes: >-
      This is a gap table scoped to the eight assigned sources; absence here does
      not prove the information is unavailable in private company materials.
    claimRefs: [CI010, CI011, CI015]
  - id: TI003
    title: Unit economics and capital-efficiency diligence
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Wafer, packaging, HBM, and test cost per sellable unit
        - null
        - Unavailable
        - Determines hardware gross margin and sensitivity to yield
        - Provide supplier quotes, committed capacity terms, yield assumptions, and test cost
      - - Average selling price and gross margin
        - null
        - Unavailable
        - Determines whether performance converts into durable revenue quality
        - Provide price waterfall, bill of materials, warranty reserve, and margin bridge
      - - Cash burn and runway
        - null
        - Unavailable
        - Determines whether reported funding reaches shipments and customer acceptance
        - Provide monthly cash, operating burn, capex, purchase commitments, and downside runway
      - - CAC, sales cycle, and payback
        - null
        - Unavailable
        - Measures the cost and duration of winning frontier-scale deployments
        - Provide pipeline stages, sales headcount, proof-of-concept cost, win rate, and collections
      - - Software and support cost per deployment
        - null
        - Low
        - Programming complexity may create deployment and support burden
        - Provide compiler staffing, field-engineering hours, support SLAs, and customer onboarding cost
    notes: >-
      Null means no numeric value was found in the assigned public evidence; it
      does not mean zero. Every row requires a management diligence response.
    claimRefs: [CI004, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Capital-to-commercialization bridge
    type: flow
    summary: >-
      Reported financing funds a sequence of development and manufacturing
      milestones before any evidenced revenue or gross profit can be underwritten.
    data:
      nodes:
        - id: financing
          label: Series B financing
          value: "$500M"
          detail: Reported capital input; not equivalent to cash available or runway.
        - id: design
          label: Complete chip design
          value: Public use of proceeds
          detail: MatX One design and tapeout work precede commercial silicon.
        - id: supply
          label: Reserve capacity and components
          value: Public use of proceeds
          detail: TSMC capacity and critical components create commitments before sales.
        - id: tapeout
          label: Tapeout and validation
          value: Targeted within one year
          detail: Yield, performance, and production validation remain undisclosed.
        - id: shipment
          label: Initial shipments
          value: "2027 target"
          detail: Timing is reported by secondary sources and remains execution-dependent.
        - id: economics
          label: Revenue and gross profit
          value: Not disclosed
          detail: Pricing, volume, cost, and margin evidence is required to complete the bridge.
    approximationNotes: >-
      This is an ordered milestone flow, not a cash waterfall; it does not imply
      that the full financing amount remains available at any stage.
    claimRefs: [CI001, CI002, CI005, CI008, CI014]
callouts:
  - calloutType: risk
    title: Financing scale does not resolve the underwriting gap
    body: >-
      The public record supports a large raise and a defined product timetable,
      but it does not disclose the operating inputs needed to convert those facts
      into runway, unit economics, or a margin forecast.
    claimRefs: [CI010, CI011, CI013, CI014, CI015]
