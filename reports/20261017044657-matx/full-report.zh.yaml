chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品定位
        blocks:
          - type: paragraph
            body: >-
              留存证据始终将 MatX 描述为一家专业 AI
              芯片公司，而非通用半导体初创企业。其官网称产品是为“前沿实验室的大模型需求”打造的，公开列出的工作负载也很集中：训练、强化学习、推理预填充和推理解码；小模型及相邻加速器场景则被明确置于次要位置。这个产品聚焦很重要，因为它把尽调问题从广义
              AI 算力敞口，收窄为单用途 LLM 架构能否在更广泛的商业证明出现前，赢得足够的前沿实验室需求。就已披露规模而言，管理层至少公开给出了一个具体运营指标——截至 2026 年 2 月 B 轮融资时有 100
              人——但本次来源池没有提供同等可靠的客户或收入指标。
