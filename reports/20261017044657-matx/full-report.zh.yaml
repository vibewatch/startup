      - number: '3.3'
        title: 切换成本、定价不透明与内部自研共同限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              即使是本次来源池中较为乐观的独立评论，也仍把 MatX 视为尚未完成验证的故事。最难的障碍不只是芯片性能，还包括让团队离开 CUDA、重新培训工程师，并在生产证明出现前接受集成风险。商业比较也很薄弱：来源池披露了
              Nvidia 和 Groq 的定价信号，却没有 MatX 的目录价或合同结构，因而无法做苹果对苹果的 ROI 比较。最后，Reuters 报道 Anthropic 正在建设内部芯片团队，同时维持多芯片策略，因此
              MatX 最相关的一些买家可能借助内部自研或多栖部署来对冲风险，而不是押注单一赢家。
            claimRefs:
