  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是定制 LLM 算力，而非广义企业 AI 硬件
        blocks:
          - type: paragraph
            body: >-
              本次证据始终将 MatX 放在一个具体任务上，而不是整个半导体市场：为大语言模型训练和服务提供专用芯片。所审阅报道并没有把 MatX 描绘成适用于所有 AI 或图形工作负载的通用 GPU
              替代品；它的定位是预训练、强化学习、长上下文推理预填充和解码。这个边界对估值很重要，因为真正相关的替代方案是 Nvidia GPU、云 TPU
              产能和其他定制芯片项目等前沿算力栈，而不是通用企业服务器。同样的定位也把很可能的买家群体收窄到前沿实验室、超大规模云厂商和技术能力较强的 AI 产品团队：它们算力预算集中，工作负载规模也足以支撑迁移成本。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
              - CM012
      - number: '2.2'
        title: 规模测算显示市场很大，但只有宽泛的外部代理指标
        blocks:
          - type: paragraph
            body: >-
              留存的市场证据支持这样的结论：MatX 正在争取一个规模庞大且仍在扩张的支出池，但证据无法单独拆出清晰的 MatX 专属 TAM、SAM 或 SOM。本次来源池引用的二手市场汇总称，全球 AI 芯片市场将从
              2025 年的 $94.5B 增至 2026 年约 $121.7B，此外还有大额 AI
              数据中心资本开支和定制处理器出货增长。这些数字具有方向性价值，因为它们解释了投资人为何愿意在交付周期很长的情况下资助新芯片团队。但它们不足以证明 MatX 实际可服务的市场，因为其中混合了广义 AI
              硬件、相邻基础设施预算和既有厂商集中度。实际含义是：MatX 追逐的是一个支出集中的大品类，但可变现的切入口仍取决于一小批买家是否认为专用 LLM 芯片值得承担切换风险。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
