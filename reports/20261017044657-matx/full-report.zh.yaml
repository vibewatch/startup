      - 估值参考
      - 必要假设
      - 概率信号
      - 下行情景或确认触发条件
    rows:
      - - 悲观
        - 低于 $4.0B
        - 出货延迟、基准差异化弱或没有签约需求。
        - 若流片或 2027 年计划延误，概率大幅上升。
        - 错过制造里程碑或独立基准失败。
      - - 基准
        - $4.0B-$4.65B 融资参考区间
        - 芯片按时完成、软件可信，并获得初始客户验证。
        - 公开证据不足以支持数值概率。
