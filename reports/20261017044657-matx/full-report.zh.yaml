              - CM006
              - CM007
      - number: '2.3'
        title: 采用时点取决于软件、供应链与切换证明
        blocks:
          - type: paragraph
            body: >-
              本次证据中最强的采用驱动因素并不新鲜：前沿模型开发者希望降低单位有效算力成本、降低模型服务延迟，并寻找 Nvidia 受限供给之外的替代方案。但约束同样明显。Reuters
              及后续报道强调芯片设计昂贵且缓慢；二手来源反复指出 CUDA 锁定、芯片尚未验证，以及首颗芯片出货前必须交付工具链。因此，MatX 的市场问题不是 AI
              基础设施支出是否存在，而是在独立基准测试和客户参考公开前，是否有足够买家愿意承担软件移植、验证和供应链风险。在出现具名客户、对比测试结果或部署案例前，市场准备度仍只是比“已被证明”更可信一些。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
