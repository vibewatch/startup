      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              最强的财务事实是资本可得性，而不是收入质量。融资规模看起来足以预留制造投入并继续开发，但首批出货仍据报在 2027 年；EverMX
              明确指出，公司没有出货产品，性能主张也尚未在生产环境中验证。进度延误、良率偏低、软件集成负担或实现价格低于预期，都可能在经常性需求得到证明前消耗资本。由于准确估值、当前流动性、烧钱、客户承诺、定价、利润率和融资义务均未披露，恰当结论是：从公开证据无法对利润路径、收入持久性和下一轮融资触发条件作出投资判断，而不是证明它们强或弱。
