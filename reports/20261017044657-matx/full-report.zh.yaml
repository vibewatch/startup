      - number: '3.2'
        title: MatX 以工作负载聚焦实现差异化，但这也缩小了潜在关心者范围
        blocks:
          - type: paragraph
            body: >-
              本次证据始终将 MatX 描述为 LLM 专用架构，而非通用加速器。关键在于，它的卖点不是广泛的计算兼容性，而是声称一颗芯片可以比通用 GPU
              更高效地覆盖训练、强化学习、推理预填充和推理解码。同样的专业化也把买家匹配范围收窄到前沿实验室、大模型团队和研究驱动型运营方，而不是主流企业 AI 用户。从实际采购角度看，MatX
              要求买家用生态广度和成熟度，换取在一个昂贵工作负载家族上的潜在更佳适配。
