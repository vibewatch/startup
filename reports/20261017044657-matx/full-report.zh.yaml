      - number: '1.3'
        title: 融资历史、估值信号与里程碑路径
        blocks:
          - type: paragraph
            body: >-
              已确认的最强资本事件是 2026 年 2 月的 $500 million B 轮融资。MatX 表示，这笔资金将用于完成开发、预留制造产能，并在一年内支持流片。二手来源拉长了时间线：SiliconANGLE
              报道公司此前于 2024 年 11 月融资 $80 million，估值超过 $300 million；Forge 目前显示累计融资 $619.9 million，投后估值为 $4.65
              billion。这些二手数据可作为方向性参考，但还不够干净，不能视为公司真实口径；尤其是 Pulse2 基于 Reuters 的 2026 年 8 月报道提到，Anthropic 曾探索约 $7 billion
              的收购，而 MatX 同时在寻求约 $4 billion 估值的新融资。EverMX 的质疑构成了恰当的反向校准：公司目前仍没有出货产品，芯片性能主张也没有公开的生产验证。
