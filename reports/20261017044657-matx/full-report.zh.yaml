        title: 图表
        blocks:
          - type: callout
            title: 市场规模比市场准备度更容易证明
            body: 留存证据让这个品类看起来规模大且具有战略重要性，但在独立基准测试和软件工具公开前，尚未显示谁已承诺把重要工作负载切换到 MatX。
