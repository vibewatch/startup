  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作负载范围
        blocks:
          - type: paragraph
            body: >-
              可见的产品面仍然狭窄且由创始人主导，而不是一个广泛的产品目录。公开描述聚焦 MatX
              One：这是一款为前沿实验室大语言模型工作负载调优的加速器，同一产品预计处理预训练、强化学习、推理预填充和解码，而不是把这些任务分散到不同芯片上。这种专业化是面向买家的核心故事：MatX
              推销的不是通用加速器，而是围绕 Transformer 密集型 LLM
              工作流设计的芯片和软件栈。对尽调而言，含义是聚焦明确，但产品集中度也高，因为公开差异化论据依赖一套旗舰架构，而不是一系列已出货、经过验证的产品。
