  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正的竞争是解决方案类别之争，而非单一同业对手
        blocks:
          - type: paragraph
            body: >-
              本次来源池最强的共同信号是：MatX 争夺的是同一笔 LLM 训练和推理预算，竞争对手来自多个不同解决方案类别，而不只是另一家获得风投资金的芯片初创公司。Nvidia 仍是默认选项，因为它已经大规模交付 H100
              / B200 系统，并拥有最成熟的软件栈。              在初创公司中，Etched 是最接近的直接比较对象，因为它同样定位为 Transformer 专用芯片，也完成了同样醒目的 $500
              million 融资。更广泛的替代方案还包括 Groq、Cerebras 等以推理为先的挑战者，以及超大规模云厂商或前沿实验室的内部芯片项目；这些方案无需让 MatX 成为标准硬件选择，也能满足需求。
