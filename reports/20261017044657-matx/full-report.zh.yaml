  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资与资本部署
        blocks:
          - type: paragraph
            body: >-
              独立二手报道始终将最新融资置于 $500 million 左右，累计融资约 $600
              million。新增资本被描述为用于产品设计、制造准备、晶圆厂产能、关键组件和招聘，而不是已经商业化企业可直接使用的流动性。这个区别很重要：募集资金不等于手头现金，任何一个数字也不等于 runway。MatX
              据报道拥有足够资本尝试一项异常昂贵的芯片项目，但留存来源没有提供当前现金余额、烧钱速度、已承诺的晶圆或封装付款、债务，或基于里程碑的融资条款。因此，资本充足度取决于未披露的支出计划，以及公司能否在没有重大延误的情况下完成流片和首次出货。
            claimRefs:
              - CI001
