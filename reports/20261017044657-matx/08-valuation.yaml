  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Current signed financing documents and a fully diluted post-money capitalization table.
      whyItMatters: The approximately $4.0 billion and $4.65 billion references cannot both be used as a precise current entry value without reconciliation.
      diligencePath: Obtain the latest term sheet, charter, capitalization table, and financing close ledger from company counsel.
      relatedQuestionRefs: [QV001, QV002, QV004]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: product-readiness
      missingEvidence: Production-silicon benchmarks, yield data, software readiness results, and foundry capacity commitments.
      whyItMatters: The valuation depends on delivering a differentiated chip on the reported schedule rather than merely funding its design.
      diligencePath: Review benchmark protocols and raw results, tapeout evidence, foundry agreements, packaging plans, and yield milestones.
      relatedQuestionRefs: [QV002, QV003, QV006]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: commercial-proof
      missingEvidence: Named design wins, paid pilots, contracted volumes, pricing, and customer deployment schedules.
      whyItMatters: Customer evidence is necessary to distinguish strategic interest from realizable revenue and exit value.
      diligencePath: Confirm customer references directly and inspect signed agreements, evaluation criteria, cancellation rights, and volume schedules.
      relatedQuestionRefs: [QV002, QV006, QV007, QV008]
      relatedTableRefs: [TV001, TV002, TV003]
    - type: missing-source
      severity: material
      topic: operating-model
      missingEvidence: Audited financials, current cash, committed spending, forecast revenue, gross margin, and financing needs.
      whyItMatters: Funding raised is not cash available, and no target return or runway can be underwritten without an operating model.
      diligencePath: Obtain audited statements, bank evidence, board-approved forecasts, bill-of-material assumptions, and quarterly cash plans.
      relatedQuestionRefs: [QV001, QV006, QV008]
      relatedTableRefs: [TV001, TV003]
