    columns: [Side, Argument, Evidence signal, What would change the view]
    rows:
      - [Thesis, "Capital supports an expensive chip-development program.", "$500M Series B reported.", "Confirmed runway, tapeout budget, and capacity commitments."]
      - [Thesis, "Focused architecture could create differentiated LLM economics.", "Company targets 10x performance and 2027 shipments.", "Independent end-to-end benchmarks on production silicon."]
      - [Thesis, "Strategic buyers may value the engineering team and roadmap.", "Anthropic reportedly explored an approximately $7B acquisition.", "Signed partnership, design win, or completed strategic transaction."]
      - [Anti-thesis, "Value depends on execution rather than current commercial proof.", "No shipping product; claims remain unvalidated.", "Production yield, software readiness, and contracted customer evidence."]
    notes: >-
      The positive architecture and performance points are company ambitions repeated by third
      parties; they are not treated as independently verified benchmark results.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009, CV015]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Valuation reference, Required assumptions, Probability signal, Downside or confirmation trigger]
    rows:
      - [Bear, "Below $4.0B", "Shipment delay, weak benchmark differentiation, or no contracted demand.", "Rises materially if tapeout or the 2027 plan slips.", "Missed manufacturing milestone or failed independent benchmark."]
      - [Base, "$4.0B-$4.65B financing-reference range", "On-time silicon, credible software, and initial customer validation.", "No numeric probability is supportable from public evidence.", "Reconciled financing terms plus production and design-win proof."]
      - [Bull, "$4.65B-$7.0B strategic-reference range", "Clear benchmark lead, scalable manufacturing, and contracted demand.", "Low until product and customer proof exists.", "Independent performance leadership and realizable strategic interest."]
    notes: >-
      Ranges are scenario reference bands, not intrinsic-value estimates. The $7B endpoint is an
      abandoned acquisition discussion, and the $4.0B and $4.65B figures require primary-document
      reconciliation.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV012, CV013, CV015]
