evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founded-date
    missingEvidence: An original incorporation record or company-controlled profile that states MatX's formal founding date.
    whyItMatters: >-
      Conflicting 2022, 2023, and 2024 founding references weaken milestone baselining and make age-versus-progress
      comparisons noisy.
    diligencePath: Request Delaware formation documents or an investor data room company profile that states the legal founding date.
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-Series B post-money valuation and current ownership data confirmed by the company or lead investors.
    whyItMatters: >-
      Current recommendation and dilution analysis should not rely on secondary-market estimates or acquisition rumors
      alone.
    diligencePath: Request the latest financing documents, cap table, or direct investor confirmation of post-money valuation.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, observer list, and summary of governance rights for major investors.
    whyItMatters: >-
      Public evidence is founder- and financing-centric, leaving control, oversight, and key-person mitigation
      under-specified.
    diligencePath: Request board composition, investor rights summaries, and any independent director appointments.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Named customers, pilot commitments, revenue, ARR, or other commercialization proof.
    whyItMatters: >-
      The company story is still technology- and financing-led, so customer validation is the main missing de-risking
      datapoint.
    diligencePath: >-
      Request customer references, LOIs, booked revenue, or verified pilot documentation before underwriting
      go-to-market assumptions.
  - type: private-evidence-only
    severity: material
    topic: demand-validation-gap
    missingEvidence: >-
      Named design partners, pilot workloads, LOIs, or signed capacity reservations showing who will adopt MatX before
      broad production.
    whyItMatters: >-
      Without concrete customer evidence, the market case rests on category enthusiasm and founder credibility rather
      than proven switching demand.
    diligencePath: >-
      Request customer pipeline detail, stage-gated pilot commitments, and any workload-specific design-partner
      references.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: benchmark-proof
    missingEvidence: >-
      Independent performance and cost benchmarks against H100, B200, TPUs, Groq, or other relevant alternatives on
      representative training and long-context inference workloads.
    whyItMatters: MatX's market wedge depends on measurable superiority, not just a company-claimed architecture thesis.
    diligencePath: >-
      Obtain third-party benchmark reports, customer bake-off summaries, or reproducible benchmark methodology tied to
      real model workloads.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: missing-source
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: >-
      A buyer-constrained TAM/SAM view specific to frontier-model training and low-latency LLM inference instead of
      broad AI-chip or adjacent capex totals.
    whyItMatters: >-
      Large category numbers can overstate the spend MatX can realistically reach before software, supply, and
      validation constraints clear.
    diligencePath: >-
      Triangulate target accounts, workload volumes, cluster economics, and procurement pathways for frontier labs,
      hyperscalers, and enterprise AI platforms.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: pricing-visibility
    missingEvidence: Public MatX list pricing, contract structure, cluster-level TCO, and any buyer discount or reservation terms.
    whyItMatters: >-
      Without commercial terms, the chapter can compare strategic positioning but cannot underwrite whether MatX beats
      incumbents on total cost for a real deployment.
    diligencePath: >-
      Request current pricing decks, reservation mechanics, and a customer-ready TCO model with named hardware
      assumptions.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent benchmark data comparing MatX One against current Nvidia systems and the nearest specialized startup
      alternatives.
    whyItMatters: Moat durability depends on realized performance, not only on architecture claims or fundraising scale.
    diligencePath: >-
      Obtain third-party benchmark runs or customer pilot data that specify workloads, cluster size, latency,
      throughput, and software overhead.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: customer-validation
    missingEvidence: >-
      Named pilot customers, evaluator feedback, or procurement proof showing buyers will switch or multi-home onto
      MatX.
    whyItMatters: >-
      The core competitive question is whether real buyers will accept migration and integration costs before the
      product has a shipping track record.
    diligencePath: >-
      Request named design partners, pilot conversion criteria, and migration case studies from a buyer currently using
      incumbent hardware.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Price book, realized ASP, discount waterfall, contract structure, backlog, acceptance terms, and
      revenue-recognition policy.
    whyItMatters: >-
