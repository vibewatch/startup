        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies MatX One as the intended commercial product and attributes both LLM training and
              inference use cases to it, but it does not establish how customers will buy or consume that capacity. No
              retained source gives a list price, average selling price, system configuration, minimum commitment,
              cloud-consumption rate, support fee, discount policy, or revenue-recognition convention. The 2027 shipment
              target also means that any current commercial traction should not be conflated with recognized product
              revenue. Until contracts or invoices are reviewed, the plausible hardware, cluster, and software-support
              mechanisms below are underwriting hypotheses and diligence categories, not demonstrated revenue streams.
