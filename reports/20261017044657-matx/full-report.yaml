  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing and capital deployment
        blocks:
          - type: paragraph
            body: >-
              Independent secondary reporting consistently places the latest financing at $500 million and aggregate
              funding at approximately $600 million. The new capital is described as funding product design,
              manufacturing preparation, foundry capacity, critical components, and hiring rather than as liquidity
              available for an already commercial business. That distinction matters: funding raised is not cash on
              hand, and neither figure is runway. MatX has enough reported capital to attempt an unusually expensive
              chip program, but the retained sources provide no current cash balance, burn rate, committed wafer or
              packaging payments, debt, or milestone-based financing terms. Capital adequacy therefore depends on an
              undisclosed spending plan and on reaching tapeout and first shipments without material delay.
            claimRefs:
