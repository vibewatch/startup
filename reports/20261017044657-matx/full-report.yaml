      - number: '3.3'
        title: Switching costs, pricing opacity, and internal build all limit moat durability
        blocks:
          - type: paragraph
            body: >-
              Even optimistic independent commentary in the assigned pool still treats MatX as a pre-validation story.
              The hardest barrier is not only silicon performance; it is the cost of moving teams away from CUDA,
              retraining engineers, and accepting integration risk before there is production proof. Commercial
              comparison is also thin: the pool exposes Nvidia and Groq pricing signals but not MatX list pricing or
              contract structure, which limits apples-to- apples ROI comparison. Finally, Reuters reporting that
              Anthropic is building an internal silicon team while keeping a multi-chip strategy shows that some of
              MatX's most relevant buyers may hedge with internal build or multi-homing instead of picking a single
              winner.
