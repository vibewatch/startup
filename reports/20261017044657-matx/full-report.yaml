              - CM003
              - CM004
              - CM008
              - CM012
      - number: '2.2'
        title: Sizing lenses show a large market, but only broad external proxies
        blocks:
          - type: paragraph
            body: >-
              The retained market evidence supports the conclusion that MatX is attacking a large and still-expanding
              spend pool, but it does not isolate a clean MatX-specific TAM, SAM, or SOM. Secondary market syntheses in
              the assigned pool cite a global AI chip market moving from $94.5B in 2025 to about $121.7B in 2026, plus
              large AI data-center capex and custom-processor shipment growth. Those figures are directionally useful
              because they show why investors fund new silicon teams despite long lead times. They are not enough to
              prove the serviceable market available to MatX specifically, since they mix broad AI hardware, adjacent
              infrastructure budgets, and incumbent concentration. The practical read-through is that MatX is pursuing a
              large category with concentrated spend, but the monetizable wedge still depends on a narrow group of
              buyers deciding that specialized LLM silicon is worth the switching risk.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
