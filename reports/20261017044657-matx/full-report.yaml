      - number: '1.2'
        title: Leadership, governance, and stakeholder concentration
        blocks:
          - type: paragraph
            body: >-
              Public source coverage centers heavily on the founders. DatacenterDynamics, Forge, and SiliconANGLE all
              tie MatX’s identity to Reiner Pope and Mike Gunter’s Google TPU backgrounds, reinforcing the technical
              credibility of the team but also underscoring how much of the company’s public narrative still runs
              through two people. The same evidence set does not surface a current board roster, observer structure, or
              a broader executive bench, so governance depth should be treated as a diligence gap rather than inferred
              from investor quality alone. The stakeholder map is still useful: Jane Street, Situational Awareness,
              Alchip, Marvell, and Spark Capital all appear in public reporting, giving MatX both capital and ecosystem
              signaling, but not enough information yet to establish control rights or follow-on support obligations.
