      - number: '4.3'
        title: Unit economics and cost base
        blocks:
          - type: paragraph
            body: >-
              MatX is pursuing a capital-intensive fabless semiconductor model. Public reporting ties proceeds to design
              completion, TSMC capacity, components, and team expansion, while the product's narrow LLM focus and
              acknowledged programming tradeoffs may require meaningful compiler, systems-software, and customer-support
              investment. None of the assigned sources supplies wafer cost, packaging cost, yield, memory bill of
              materials, ASP, gross margin, contribution margin, CAC, sales cycle, payback, or working-capital terms.
              These are not safely inferable from the size of the financing or from claimed chip performance. A useful
              underwriting model therefore needs management-provided unit data and contractual evidence rather than a
              benchmark borrowed from a mature public semiconductor vendor.
