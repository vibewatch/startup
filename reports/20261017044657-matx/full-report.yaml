  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workload scope
        blocks:
          - type: paragraph
            body: >-
              The visible product surface is still narrow and founder-led rather than a broad catalog. Public
              descriptions center on MatX One as an accelerator tuned for frontier-lab large language model workloads,
              with the same product expected to handle pre-training, reinforcement learning, and inference
              prefill/decode rather than splitting those jobs across separate chips. That specialization is the core
              buyer story: MatX is not pitching a general-purpose accelerator, but a chip and software stack designed
              around transformer-heavy LLM workflows. The implication for diligence is positive focus but also product
              concentration, because the public case for differentiation depends on one flagship architecture rather
              than a shipped family of validated products.
            claimRefs:
