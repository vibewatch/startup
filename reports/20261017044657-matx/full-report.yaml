      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The roadmap is clearer than the operating proof. MatX's official site ties "MatX One and our Series B" to
              February 2026, and independent coverage says the new capital is meant to finish chip design, reserve
              manufacturing capacity, and secure components. The same coverage places production with TSMC and first
              shipments in 2027, which means the company is still in pre-production maturity from a customer diligence
              standpoint. In other words, the market-facing narrative is now beyond pure stealth, but it is still framed
              around design completion and upcoming delivery milestones rather than deployed systems, service
              references, or field reliability data.
            claimRefs:
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Controls, validation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The main technical risk is not that the architecture story is incoherent; it is that public validation
              trails it. The assigned evidence frames software ecosystem readiness, manufacturing access, and supply
              reservations as prerequisites alongside silicon performance, so execution risk spans tooling and
              production as much as chip design. At the same time, the public corpus does not document enterprise trust
              surfaces such as security controls, privacy/compliance posture, uptime history, or quality-control
              routines. Independent, production-grade benchmarks against shipping Nvidia systems are also absent from
              the assigned evidence. Until those surfaces appear, MatX's product case remains technically promising but
              diligence- incomplete.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent full-stack thesis
            body: >-
              The assigned sources repeat the same architecture story often enough to make MatX's product thesis
              legible: LLM-specific silicon, software control surfaces, and visible research output all point in the
              same direction.
            calloutType: strength
            claimRefs:
