      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest financial fact is access to capital, not revenue quality. The financing appears large enough
              to reserve manufacturing inputs and continue development, but first shipment is still reported for 2027
              and EverMX explicitly notes that there is no shipping product and that performance claims remain
              unvalidated in production. A schedule slip, weak yield, software-integration burden, or
              lower-than-expected realized price could consume capital before recurring demand is proven. Because the
              exact valuation, current liquidity, burn, customer commitments, pricing, margins, and financing
              obligations remain undisclosed, the appropriate verdict is that the margin path, revenue durability, and
              next-round trigger are un-underwritable from public evidence rather than demonstrably strong or weak.
