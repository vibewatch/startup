      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The technical throughline across the assigned sources is unusually consistent. Public descriptions
              repeatedly cite a splittable systolic array, SRAM-first low-latency behavior, and HBM support for longer
              contexts and KV-cache-heavy inference. Third-party material also says the product is meant to scale into
              very large clusters, while independent analysis frames the software layer as part of the product rather
              than an afterthought. MatX's own research page reinforces that interpretation by showing a steady stream
              of inference and attention-system work, including seqax and sparse-attention posts. The resulting
              operating model looks like a full-stack LLM accelerator program, not just a standalone chip claim.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
