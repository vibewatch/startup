      - number: '1.3'
        title: Funding history, valuation signals, and milestone trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest confirmed capital event is the February 2026 $500 million Series B, which MatX said would
              finish development work, reserve manufacturing capacity, and support tapeout within a year. Secondary
              sources widen the timeline: SiliconANGLE reported an earlier November 2024 raise of $80 million at a
              valuation above $300 million, while Forge now shows $619.9 million of total funding and a $4.65 billion
              post-money figure. Those secondary figures are directionally useful but not clean enough to treat as
              company ground truth, especially because Pulse2’s Reuters-based August 2026 report said Anthropic had
              explored a roughly $7 billion acquisition while MatX was simultaneously seeking fresh financing around a
              $4 billion valuation. EverMX’s critique is the right counterweight: there is still no shipping product and
              no public production validation of the chip’s performance claims.
