      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public demand is segment-level, not account-level
            body: >-
              The strongest public signal is who MatX appears to want as buyers—labs, infrastructure operators,
              researchers, and AI enterprises—not who is already committed. That distinction matters because it keeps
              customer quality in the realm of market hypothesis rather than verifiable traction.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Customer proof is the main diligence hole
            body: >-
              Until MatX discloses named evaluators, production deployments, or retention data, the company can only be
              underwritten on technical promise and capitalization. That leaves adoption, expansion, and concentration
              risk materially under-evidenced.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is a coupled execution chain: MatX was still finalizing its first chip after
              the February 2026 financing, targeted tapeout within one year, and was reported to expect shipments in
              2027. A slip in design closure, packaging, compiler readiness, or foundry capacity would therefore move
              revenue and customer proof together rather than independently. Public commentary also says there is no
              shipping product and that performance claims remain unvalidated in production. Investment kill criteria
              should include no verified tapeout by February 2027, no reproducible end-to-end benchmark before a
              material commitment, and no evidence that the software stack can run priority models at production scale.
              The heatmap shows residual exposure, not a statistically measured failure probability.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, IP, and security posture is unverified
        blocks:
          - type: paragraph
            body: >-
              None of the eight retained sources is a MatX compliance disclosure, regulator record, court record,
              export-control classification, or security-incident report. That bounded finding does not mean MatX has no
              legal, regulatory, IP, privacy, or security exposure; it means the assigned public evidence cannot score
              likelihood or mitigation maturity responsibly. Advanced-accelerator export eligibility, freedom to
              operate, litigation representations, and secure-development controls should remain explicit closing
              conditions. Counsel should obtain the product's export-control classification and destination policy, a
              current litigation and regulatory certificate, an IP/FTO opinion covering the architecture and compiler,
              and security materials for software and firmware. Any unresolved restriction on target customers or a
              material IP injunction would be thesis-breaking.
            claimRefs:
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR012
              - CR013
      - number: '7.3'
        title: Capital reduces financing pressure but does not remove execution risk
        blocks:
          - type: paragraph
            body: >-
              The reported $500 million Series B is a financing event, not evidence of cash available, runway, burn,
              gross margin, or the remaining cost to production. Reports say capital will support final design,
              manufacturing-capacity reservations, and critical components, which is directionally mitigating, but no
              retained source provides an audited cash bridge or committed production schedule. The technical program
              also has simultaneous silicon and software obligations: public analysis highlights CUDA's long-established
              ecosystem and the need for MatX to deliver compilers, kernels, frameworks, interconnect, and production
              reliability around first silicon. Diligence should reconcile monthly burn, non-cancellable wafer and
              packaging commitments, staffing plan, milestone-based liquidity, and downside financing needs through a
              delayed ramp.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
              - CR015
      - number: '7.4'
        title: Foundry, ecosystem, and strategic-counterparty dependencies
        blocks:
          - type: paragraph
            body: >-
              TSMC is the only named manufacturing partner across the retained coverage, creating a concentrated
              dependency even though reports say MatX intends to reserve capacity and key components. No source
              discloses binding allocation, packaging capacity, yield protection, second-source options, or customer
              qualification. Separately, August reporting said Anthropic's approximately $7 billion acquisition
              discussions ended and evolved toward a potential partnership, while another report said MatX was seeking
              financing around a $4 billion valuation. Neither item is a signed commercial commitment. Investment
              approval should require foundry and packaging evidence, a milestone-linked customer design-partner plan,
              financing-term reconciliation, and explicit portability gates against incumbent software. Failure to
              convert evaluation interest into paid production demand before scale spending would break the commercial
              thesis.
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Stop or reprice if MatX misses the February 2027 tapeout gate without a funded recovery plan; cannot
              reproduce material performance and power claims on production silicon; cannot evidence foundry and
              packaging capacity; lacks a credible compiler and framework path; or cannot reconcile cash, burn,
              financing terms, and customer-backed demand before committing scale capital.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
              - CR014
          - type: callout
            title: Absence is not clearance
            body: >-
              The assigned pool contains no primary legal, regulatory, court, export-control, trust, or incident
              evidence. This chapter therefore records those areas as unverified and requires primary diligence; it does
              not infer that MatX has no litigation, restriction, vulnerability, outage, or compliance obligation.
            calloutType: assumption
            claimRefs:
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, high risk, and an evidence-insufficient
              valuation stance. The financing is substantial: multiple independent reports describe a $500 million
              Series B, while Forge lists $619.9 million of total funding. Price support is less settled. AIBARS says
              MatX did not disclose the exact post-money value, Forge displays a $4.65 billion post-money mark, and an
              August report says MatX was seeking financing near $4 billion. Those figures are financing references, not
              intrinsic value. Without revenue, margin, customer, or audited forecast evidence in the retained sources,
              a target return or defensible entry multiple cannot be calculated. Entry should therefore be conditioned
              on reconciled cap-table evidence and proof that the product can convert capital into validated silicon and
              commercial demand.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a well-capitalized specialist can use an LLM-specific architecture and TSMC
              manufacturing path to address a large compute bottleneck, with a reported 2027 shipping objective and a
              stated ten-times performance ambition. Strategic interest is another positive signal: Anthropic reportedly
              explored an acquisition around $7 billion. The anti-thesis is more decision-relevant today. MatX has no
              shipping product in the reviewed evidence, its performance claims remain unvalidated in production, and
              the acquisition discussions ended. Specialized silicon also must overcome manufacturing, software, and
              adoption execution before financing marks translate into durable value. The evidence therefore favors
              preserving upside optionality without paying today for an unproven performance or exit outcome.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public evidence permits reference bands, not a conventional discounted-cash-flow valuation. The base case
              uses the approximately $4.0 billion financing target and Forge's $4.65 billion post-money mark as a
              provisional range subject to reconciliation. The bear case falls below that range if tapeout, 2027
              shipment, benchmark, or customer milestones slip. The bull case requires independent benchmark leadership,
              manufacturing readiness, and contracted demand before a value above $4.65 billion is credible. The
              abandoned approximately $7 billion acquisition discussion is best treated as a strategic-interest ceiling,
              not a completed transaction comparable. Etched's reported $5 billion round valuation is a useful sector
              reference, but different product maturity and terms prevent direct multiple transfer.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              The reported acquisition approach indicates potential strategic value, but its abandonment means MatX is
              not demonstrably exit-ready. A decision-grade review should obtain the current term sheet, fully diluted
              cap table, preference stack, cash balance, use-of-funds plan, foundry commitments, independent benchmark
              protocol, named design-win evidence, and a bottoms-up revenue and gross-margin model. Thesis-break
              triggers are a material slip to the 2027 shipment plan, benchmark results that fail to substantiate
              meaningful advantage, inability to secure production capacity, or failure to convert evaluations into
              contracted demand. A verified price below the reported financing band could improve entry discipline, but
              it would not substitute for technical and commercial proof.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price cannot substitute for proof
            body: >-
              Preserve optionality, but require reconciled financing terms, production-silicon benchmarks, customer
              commitments, and an auditable operating model before underwriting an entry price.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV016
