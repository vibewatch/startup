            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Adoption timing depends on software, supply chain, and proof of switching
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the assigned evidence are familiar: frontier-model developers want lower
              cost per unit of useful compute, lower latency for model serving, and alternatives to Nvidia-constrained
              supply. But the constraints are equally material. Reuters and follow-on coverage emphasize that chip
              design is expensive and slow, while secondary sources repeatedly highlight CUDA lock-in, unproven silicon,
              and the need to deliver tooling before the first chip ships. That means MatX's market question is not
              whether AI infrastructure spend exists; it is whether enough buyers will absorb software-porting,
              validation, and supply-chain risk before independent benchmarks and customer references are public. Until
              named customers, bake-off results, or deployment case studies appear, market readiness remains more
              plausible than proven.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size is easier to prove than market readiness
            body: >-
              The retained evidence makes the category look large and strategically important, but it does not yet show
              who has committed to switch meaningful workloads onto MatX before independent benchmarks and software
              tooling are public.
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM011
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competitor set is solution-class competition, not one peer
        blocks:
          - type: paragraph
            body: >-
              The strongest pattern in the assigned pool is that MatX is competing for the same LLM training and
              inference budget against several distinct solution classes, not only against another venture-backed chip
              startup. Nvidia remains the incumbent default because it already ships broadly deployable H100/B200
              systems and owns the most mature software stack. Among startups, Etched appears as the closest direct
              comparison because it also positions itself as transformer-specific silicon and raised the same headline
              $500 million round. The broader alternative set includes inference-first challengers such as Groq and
              Cerebras, plus hyperscaler or frontier-lab internal silicon efforts that can satisfy demand without ever
              making MatX the standard hardware choice.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP010
