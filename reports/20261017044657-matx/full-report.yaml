  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is custom LLM compute, not broad enterprise AI hardware
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently frames MatX around one specific job rather than the whole semiconductor
              market: supplying chips purpose-built for large language model training and serving. Across the reviewed
              coverage, MatX is not presented as a general-purpose GPU substitute for every AI or graphics workload; it
              is positioned around pre-training, reinforcement learning, long-context inference prefill, and decode.
              That matters for valuation because the relevant substitutes are incumbent frontier-compute stacks such as
              Nvidia GPUs, cloud TPU capacity, and other custom-silicon programs, not generic enterprise servers. The
              same framing also narrows the likely buyer set to frontier labs, hyperscalers, and technically
              sophisticated AI product teams with concentrated compute budgets and enough workload scale to justify
              migration effort.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
