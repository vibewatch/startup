chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product positioning
        blocks:
          - type: paragraph
            body: >-
              The retained evidence consistently frames MatX as a specialized AI chip company rather than a
              general-purpose semiconductor startup. Its own website says the product is being built for the “large
              model needs of frontier labs,” and the public-facing workload list stays narrow: training, reinforcement
              learning, inference prefill, and inference decode, with small models and adjacent accelerator use cases
              explicitly deprioritized. That product focus matters because it sharpens the diligence question from broad
              AI compute exposure to whether a single-purpose LLM architecture can win enough frontier-lab demand before
              broader commercial proof arrives. On disclosed scale, management has at least put one concrete operating
              marker in public—100 people as of the February 2026 Series B—but the assigned pool does not provide
              equivalent ground-truth customer or revenue metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
