  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a four-layer product stack that combines LLM workloads, software control, differentiated
      compute/memory design, and a still-roadmap production path.
    data:
      layers:
        - label: Workloads
          detail: >-
            One chip is publicly positioned to cover training, RL, inference prefill, and decode for frontier LLM
            operators.
          modules:
            - Pre-training / training
            - Reinforcement learning
            - Inference prefill
            - Inference decode
        - label: Model envelope
          detail: >-
            Public descriptions consistently frame the product around dense LLMs and mixture-of-experts models rather
            than broad AI acceleration.
          modules:
            - Dense LLMs
            - Mixture-of-experts models
        - label: Software control
          detail: Public material points to direct hardware control plus supporting compiler and runtime work.
          modules:
            - Direct hardware control programming model
            - Compiler / runtime stack
            - seqax research codebase
        - label: Compute fabric
          detail: The differentiated hardware story starts with a splittable systolic array tuned to LLM workloads.
          modules:
            - Splittable systolic array
        - label: Memory hierarchy
          detail: Public descriptions separate low-latency SRAM roles from HBM-backed long-context and KV-cache support.
          modules:
            - SRAM for low-latency weight access
            - HBM for KV cache and long context
        - label: Scale and production
          detail: Cluster scale and manufacturing remain roadmap layers rather than shipped operating proof.
          modules:
            - Scale-up / scale-out interconnect
            - TSMC manufacturing path
            - 2027 initial shipments target
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: MatX's public customer journey is still a hypothesis path from target-segment fit to future production proof.
    data:
      nodes:
        - label: Target workload is identified
          actor: Frontier AI labs, hyperscalers, and AI-native enterprises
          phase: Demand discovery
          touchpoints:
            - Need alternatives to Nvidia for large-language-model training and inference
            - Public pitch centers on throughput, latency, and long-context support
        - label: Technical fit is evaluated
          actor: Compiler, infrastructure, and platform teams
          phase: Architecture screening
          touchpoints:
            - Cloud and on-premise deployment options are described
            - Software-stack compatibility still has to be proven
        - label: Pilot proof is still missing
          actor: Procurement and systems buyers
          phase: Pre-shipment proof gap
          touchpoints:
            - No named evaluator, pilot, or LOI is disclosed in the assigned sources
            - First shipments are still planned for 2027
        - label: Production reference is not yet public
          actor: Operating customer
          phase: Reference gap
          touchpoints:
            - No production deployment or measured customer outcome is publicly named
            - Current evidence does not establish active use or expansion
        - label: Expansion depends on enablement
          actor: Developer and operations teams
          phase: Adoption scaling
          touchpoints:
            - Migration requires model and engineering workflow adaptation
            - Open-source compiler and optimization tooling are positioned as adoption prerequisites
        - label: Renewal quality remains unknown
          actor: Finance and vendor-management owners
          phase: Durability gap
          touchpoints:
            - No customer count, contract length, GRR, churn, or NRR is disclosed
            - Top-customer concentration and channel dependence are not public
