company:
  name: MatX
chapter:
  number: 1
  title: Company Overview
  summary: >-
    MatX presents as a founder-led LLM accelerator company with a large February 2026
    financing, a 100-person team, and a product thesis aimed squarely at frontier-model
    workloads. The public record is still incomplete on exact valuation, governance depth,
    customers, and even founding date, so later chapters should reuse the disclosed funding
    and product facts but keep commercialization and control assumptions conservative.
sections:
  - id: identity-and-product
    title: Identity and product positioning
    body: >-
      The retained evidence consistently frames MatX as a specialized AI chip company rather
      than a general-purpose semiconductor startup. Its own website says the product is being
      built for the “large model needs of frontier labs,” and the public-facing workload list
      stays narrow: training, reinforcement learning, inference prefill, and inference decode,
      with small models and adjacent accelerator use cases explicitly deprioritized. That
      product focus matters because it sharpens the diligence question from broad AI compute
      exposure to whether a single-purpose LLM architecture can win enough frontier-lab demand
      before broader commercial proof arrives. On disclosed scale, management has at least put
      one concrete operating marker in public—100 people as of the February 2026 Series B—but
      the assigned pool does not provide equivalent ground-truth customer or revenue metrics.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO008
    tableRefs:
      - TO001
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder concentration
    body: >-
      Public source coverage centers heavily on the founders. DatacenterDynamics, Forge, and
      SiliconANGLE all tie MatX’s identity to Reiner Pope and Mike Gunter’s Google TPU
      backgrounds, reinforcing the technical credibility of the team but also underscoring how
      much of the company’s public narrative still runs through two people. The same evidence
      set does not surface a current board roster, observer structure, or a broader executive
      bench, so governance depth should be treated as a diligence gap rather than inferred from
      investor quality alone. The stakeholder map is still useful: Jane Street, Situational
      Awareness, Alchip, Marvell, and Spark Capital all appear in public reporting, giving
      MatX both capital and ecosystem signaling, but not enough information yet to establish
      control rights or follow-on support obligations.
    claimRefs:
      - CO006
      - CO009
      - CO014
      - CO016
    tableRefs:
      - TO002
      - TO003
  - id: financing-and-milestones
    title: Funding history, valuation signals, and milestone trajectory
    body: >-
      The strongest confirmed capital event is the February 2026 $500 million Series B, which
      MatX said would finish development work, reserve manufacturing capacity, and support
      tapeout within a year. Secondary sources widen the timeline: SiliconANGLE reported an
      earlier November 2024 raise of $80 million at a valuation above $300 million, while
      Forge now shows $619.9 million of total funding and a $4.65 billion post-money figure.
      Those secondary figures are directionally useful but not clean enough to treat as company
      ground truth, especially because Pulse2’s Reuters-based August 2026 report said Anthropic
      had explored a roughly $7 billion acquisition while MatX was simultaneously seeking fresh
      financing around a $4 billion valuation. EverMX’s critique is the right counterweight:
      there is still no shipping product and no public production validation of the chip’s
      performance claims.
    claimRefs:
      - CO007
      - CO010
      - CO011
      - CO012
      - CO013
      - CO015
      - CO016
    figureRefs:
      - FO001
