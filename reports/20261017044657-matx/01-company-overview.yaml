  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: founded-date
      missingEvidence: An original incorporation record or company-controlled profile that states MatX's formal founding date.
      whyItMatters: Conflicting 2022, 2023, and 2024 founding references weaken milestone baselining and make age-versus-progress comparisons noisy.
      diligencePath: Request Delaware formation documents or an investor data room company profile that states the legal founding date.
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Exact post-Series B post-money valuation and current ownership data confirmed by the company or lead investors.
      whyItMatters: Current recommendation and dilution analysis should not rely on secondary-market estimates or acquisition rumors alone.
      diligencePath: Request the latest financing documents, cap table, or direct investor confirmation of post-money valuation.
      relatedQuestionRefs: [QO006]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: A current board roster, observer list, and summary of governance rights for major investors.
      whyItMatters: Public evidence is founder- and financing-centric, leaving control, oversight, and key-person mitigation under-specified.
      diligencePath: Request board composition, investor rights summaries, and any independent director appointments.
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: commercial-traction
      missingEvidence: Named customers, pilot commitments, revenue, ARR, or other commercialization proof.
      whyItMatters: The company story is still technology- and financing-led, so customer validation is the main missing de-risking datapoint.
      diligencePath: Request customer references, LOIs, booked revenue, or verified pilot documentation before underwriting go-to-market assumptions.
