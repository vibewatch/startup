company:
  name: "MatX"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence positions MatX toward frontier AI labs, hyperscale AI infrastructure buyers,
    research institutions, and AI-native enterprises, but the assigned source set still does not
    name a production customer, pilot evaluator, or reference deployment. Commercial signal is
    therefore readiness-led rather than adoption-led: shipping is still planned for 2027, the team
    is still building toward launch, and software migration remains a material blocker to expansion.
sections:
  - id: "target-accounts"
    title: "Target accounts are clearer than the installed base"
    body: >-
      The assigned evidence does establish who MatX appears to be selling to, even though it does
      not establish who is already buying. The cleanest segment signal comes from the independent
      welcome.ai listing, which names AI researchers plus tech startups and enterprises as target
      users and also describes cloud and on-premise deployment options. That is reinforced by
      MatX's own value proposition as repeated by Pulse2 and by broader market framing from AIBARS
      and Evermx: the product is pitched at operators running large-language-model workloads who
      care about throughput, latency, and long-context support. That makes frontier labs, cloud AI
      infrastructure teams, and AI-native enterprises the most plausible initial buyers and payers,
      but this remains inference from positioning rather than proof of signed demand.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "readiness-vs-adoption"
    title: "Readiness proxies exist, but adoption proof is still forward-looking"
    body: >-
      The most concrete public signals in this pool are commercialization proxies rather than
      adoption metrics. Multiple retained sources say MatX expects first shipments in 2027, so any
      customer journey is still pre-shipment as of the run date. Pulse2 reports about 100
      engineers, while Forge lists $619.9 million of total funding and a $4.65 billion post-money
      valuation; those datapoints matter because they suggest the company has resources to finish
      silicon, reserve capacity, and staff software enablement. But they do not answer the core
      customer question: whether anyone has committed to buy, test, renew, or expand usage. In
      this chapter, capital and hiring are therefore best treated as preparedness indicators rather
      than evidence of market pull.
    claimRefs: ["CU007", "CU008", "CU009", "CU010", "CU014"]
    tableRefs: ["TU002"]
  - id: "proof-durability-and-expansion-risk"
    title: "Durability, expansion, and concentration remain unproven"
    body: >-
      The chapter's central diligence problem is not segment ambiguity but proof scarcity. None of
      the eight assigned public sources names a production customer, a pilot evaluator, or a public
      reference deployment, and none discloses customer count, contract duration, churn, GRR, or
      NRR. The only retained customer-facing artifact is a product-directory page that describes use
      cases and target users without giving operator names, review counts, or outcome data. At the
      same time, AI2Work highlights the practical switching cost of a new chip architecture, and
      Evermx argues the prudent posture is to wait until real-world use cases are demonstrated. That
      combination means the expansion loop is still hypothetical: without named design wins, customer
      concentration and renewal quality cannot yet be underwritten from public evidence.
    claimRefs: ["CU011", "CU012", "CU013", "CU015", "CU016"]
    tableRefs: ["TU003"]
