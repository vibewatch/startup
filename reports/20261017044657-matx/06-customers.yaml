callouts:
  - calloutType: "insight"
    title: "Public demand is segment-level, not account-level"
    body: >-
      The strongest public signal is who MatX appears to want as buyers—labs, infrastructure
      operators, researchers, and AI enterprises—not who is already committed. That distinction
      matters because it keeps customer quality in the realm of market hypothesis rather than
      verifiable traction.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006"]
  - calloutType: "risk"
    title: "Customer proof is the main diligence hole"
    body: >-
      Until MatX discloses named evaluators, production deployments, or retention data, the company
      can only be underwritten on technical promise and capitalization. That leaves adoption,
      expansion, and concentration risk materially under-evidenced.
    claimRefs: ["CU011", "CU012", "CU013", "CU015", "CU016"]
