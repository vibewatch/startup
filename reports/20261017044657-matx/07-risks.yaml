  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-evidence-gap
      missingEvidence: >-
        Primary export-control, regulatory, litigation, IP/FTO, privacy, security, certification,
        and incident records applicable to MatX products and operations.
      whyItMatters: >-
        Restrictions, ownership defects, injunctions, or insecure product controls could block
        target markets, delay shipment, or create uncapped liability.
      diligencePath: >-
        Obtain counsel certificates, regulator and court searches, ECCN and licensing materials,
        the patent and assignment schedule, FTO opinion, threat model, incident log, pen test, and
        security roadmap.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: validation-gap
      missingEvidence: >-
        Reproducible production-silicon benchmarks, reliability data, power and thermal results,
        scale tests, and named customer acceptance evidence.
      whyItMatters: >-
        Architecture descriptions and company performance claims cannot establish usable
        production economics or a durable purchase decision.
      diligencePath: >-
        Run investor-controlled benchmark suites on representative models and cluster sizes, audit
        methodology and power, and obtain design-partner acceptance criteria and failure logs.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR002]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: >-
        Current cap table, fully diluted share count, signed financing documents, preference stack,
        and reconciliation of the $4.65B Forge mark with the reported approximately $4B financing
        discussion.
      whyItMatters: >-
        Entry price, dilution, preference overhang, and downside financing risk cannot be evaluated
        from secondary valuation references alone.
      diligencePath: >-
        Review the cap table, charter, SAFEs or notes, round documents, board approvals, secondary
        transactions, and current financing term sheet.
      relatedQuestionRefs: [QR005, QR009]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-model-risk
      missingEvidence: >-
        Audited cash, monthly burn, runway, committed wafer and packaging spend, headcount plan,
        gross-margin bridge, and downside capital requirements.
      whyItMatters: >-
        Funding raised cannot be translated into runway or capital sufficiency without cash,
        obligations, timing, and cost structure.
      diligencePath: >-
        Review audited statements, bank balances, monthly management accounts, purchase
        commitments, hiring plan, unit-cost model, and milestone-linked liquidity scenarios.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: foundry-dependency
      missingEvidence: >-
        Binding TSMC wafer and packaging allocation, process-node schedule, yield assumptions,
        component commitments, remedies, and feasible alternative supply paths.
      whyItMatters: >-
        A single named foundry path couples shipment timing, cost, quality, and revenue realization.
      diligencePath: >-
        Inspect foundry, packaging, HBM, substrate, and component contracts; test lead-time and
        yield scenarios; and review contingency plans with named owners and funding.
      relatedQuestionRefs: [QR004, QR010]
      relatedTableRefs: [TR002, TR003]
