  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence-based likelihood signal
      - Impact
      - Public mitigation
      - Mitigation maturity
      - Residual exposure
      - Monitor / kill criterion
    rows:
      - - Design closure or tapeout misses the stated window
        - Elevated until tapeout is independently verified
        - Critical; delays every downstream proof point
        - $500M financing and a target to complete tapeout within one year of February 2026
        - In progress; no completed tapeout disclosed in retained sources
        - High
        - Kill if no verified tapeout by February 2027 without a funded recovery plan
      - - TSMC manufacturing, packaging, yield, or component ramp slips
        - Elevated because 2027 shipment depends on one named foundry path
        - Critical; blocks product availability and revenue
        - Reports say capital will reserve manufacturing capacity and key components
        - Planned; contractual allocation and yield protections are not public
        - High
        - Require capacity, packaging, yield, lead-time, and alternate-supply evidence
      - - Production performance does not reproduce company claims
        - Elevated because no shipping product or independent production benchmark is retained
        - Critical; undermines differentiation and customer economics
        - Architecture is described publicly, but no independent benchmark mitigation is shown
        - Unproven
        - High
        - Require reproducible model, power, latency, throughput, and scale benchmarks
      - - Compiler, framework, interconnect, or reliability stack is late
        - Elevated against a mature incumbent ecosystem
        - High; slows qualification even if silicon works
        - A March source reported a planned open-source compiler and optimization toolkit
        - Planned at that source date; current delivery was not verified
        - High
        - Require release evidence, priority-model coverage, cluster tests, and customer acceptance
    notes: >-
      Likelihood labels are qualitative evidence signals, not modeled probabilities; dates,
      mitigations, and gaps preserve the source vintage and current verification limits.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR007, CR008, CR013, CR015]
