        - Single named manufacturing partner
        - Capacity, schedule, yield, or packaging shortfall delays 2027 shipments
        - Critical
        - Funding reportedly supports capacity reservations and critical components
        - High; binding commitments and alternate paths are not public
      - - Software portability and developer adoption
        - CUDA-centered model and tooling ecosystem
        - Framework, kernel, and workflow compatibility
        - Incumbent ecosystem is deeply established
        - Migration cost offsets silicon performance or delays customer qualification
        - High
        - Open-source compiler and optimization tooling was reported as planned
        - High; current delivery and production coverage were not verified
      - - Strategic customer or partner conversion
        - Anthropic, reported potential partner
        - Possible demand, validation, or collaboration
        - No signed relationship disclosed in the retained source
        - Talks do not convert to paid production demand
        - High
        - Reporting says acquisition discussions evolved toward a potential partnership
        - High; partnership terms and revenue commitment are unknown
      - - Follow-on capital and valuation support
        - Existing and prospective investors
        - Fund remaining development and commercial ramp
        - Private financing with limited market activity
        - Burn or delays force financing below prior reference values
        - High
        - $500M Series B and reported strategic investor participation
        - Unknown; cash, burn, terms, and future capital need are not public
    notes: >-
      Concentration reflects only counterparties named in the assigned sources; a missing
      alternative or contract is a diligence gap, not proof that none exists.
    claimRefs: [CR001, CR005, CR007, CR008, CR009, CR010, CR011, CR014]
