callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Stop or reprice if MatX misses the February 2027 tapeout gate without a funded recovery
      plan; cannot reproduce material performance and power claims on production silicon; cannot
      evidence foundry and packaging capacity; lacks a credible compiler and framework path; or
      cannot reconcile cash, burn, financing terms, and customer-backed demand before committing
      scale capital.
    claimRefs: [CR002, CR003, CR004, CR005, CR007, CR008, CR013, CR014]
  - calloutType: assumption
    title: Absence is not clearance
    body: >-
      The assigned pool contains no primary legal, regulatory, court, export-control, trust, or
      incident evidence. This chapter therefore records those areas as unverified and requires
      primary diligence; it does not infer that MatX has no litigation, restriction, vulnerability,
      outage, or compliance obligation.
    claimRefs: [CR012]
