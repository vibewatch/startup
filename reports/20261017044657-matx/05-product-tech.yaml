  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public documentation of security controls, privacy or compliance posture, uptime or incident history, and product quality-control practices.
      whyItMatters: Frontier-lab and enterprise buyers need these controls to evaluate procurement, operational, and reputational risk beyond raw performance claims.
      diligencePath: Request a trust-center packet, security or compliance attestations, and any public status or incident-history artifacts.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: customer-validation
      missingEvidence: Named design partners, deployed integrations, benchmark customers, or production references that show MatX One operating outside roadmap language.
      whyItMatters: Without deployment proof, it is hard to separate architecture promise from usable product maturity.
      diligencePath: Request customer reference calls, pilot summaries, integration diagrams, and any production-readiness checklist shared with launch partners.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: benchmark-validation
      missingEvidence: Independent benchmark methodology against H100, B200, or other relevant LLM accelerators, including workload, model, cluster size, and power assumptions.
      whyItMatters: Performance and cost claims are central to the product thesis, but they are not yet externally testable from the assigned corpus.
      diligencePath: Request a third-party benchmark pack with reproducible model configurations and power-normalized results.
      relatedQuestionRefs: [QE005, QE007]
    - type: private-evidence-only
      severity: material
      topic: supply-chain-execution
      missingEvidence: Tape-out node, packaging plan, HBM sourcing, and the commercial terms behind manufacturing-capacity reservations.
      whyItMatters: For an AI-chip company, manufacturability and component access can derail timing and unit economics even if the architecture is sound.
      diligencePath: Ask management for tape-out milestones, foundry and packaging dependencies, and contingency plans for memory or capacity shortages.
      relatedQuestionRefs: [QE004, QE007]
