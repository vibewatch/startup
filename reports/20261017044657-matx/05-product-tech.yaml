      - [SRAM-first memory path, Low-latency access for model weights and fast serving behavior, On-chip memory efficiency and thermal budget, Benefit claims are not independently measured in the assigned corpus]
      - [HBM and KV-cache support, Longer-context support without giving up cluster-scale throughput claims, Packaging and memory supply execution, HBM availability cost and design tradeoffs are not disclosed]
      - [Scale-up / scale-out interconnect, Multi-chip clustering for frontier-lab deployments, Networking fabric and software orchestration, No public cluster deployment reference or topology detail]
      - [Compiler / runtime / programming model, Turns hardware claims into usable developer workflows, Framework compatibility and tooling maturity, Public software-surface detail is thinner than the architecture narrative]
    notes: >-
      This table mixes public architecture claims with inferred operating
      dependencies; missing specifics remain open diligence items rather than
      hidden assumptions.
    claimRefs: [CE002, CE003, CE006, CE008, CE010, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a four-layer product stack that combines LLM
      workloads, software control, differentiated compute/memory design, and a
      still-roadmap production path.
    data:
      layers:
        - label: Workloads
          detail: One chip is publicly positioned to cover training, RL, inference prefill, and decode for frontier LLM operators.
          modules:
            - Pre-training / training
            - Reinforcement learning
            - Inference prefill
            - Inference decode
        - label: Model envelope
          detail: Public descriptions consistently frame the product around dense LLMs and mixture-of-experts models rather than broad AI acceleration.
          modules:
            - Dense LLMs
            - Mixture-of-experts models
        - label: Software control
          detail: Public material points to direct hardware control plus supporting compiler and runtime work.
          modules:
            - Direct hardware control programming model
            - Compiler / runtime stack
            - seqax research codebase
        - label: Compute fabric
          detail: The differentiated hardware story starts with a splittable systolic array tuned to LLM workloads.
          modules:
            - Splittable systolic array
        - label: Memory hierarchy
          detail: Public descriptions separate low-latency SRAM roles from HBM-backed long-context and KV-cache support.
          modules:
            - SRAM for low-latency weight access
            - HBM for KV cache and long context
        - label: Scale and production
          detail: Cluster scale and manufacturing remain roadmap layers rather than shipped operating proof.
          modules:
            - Scale-up / scale-out interconnect
            - TSMC manufacturing path
            - 2027 initial shipments target
    claimRefs: [CE002, CE003, CE005, CE008, CE010, CE011]
callouts:
  - calloutType: strength
    title: Coherent full-stack thesis
    body: >-
      The assigned sources repeat the same architecture story often enough to
      make MatX's product thesis legible: LLM-specific silicon, software control
      surfaces, and visible research output all point in the same direction.
    claimRefs: [CE002, CE003, CE007, CE008]
  - calloutType: risk
    title: Validation lags design ambition
    body: >-
      Product maturity is still roadmap-heavy. Public evidence supports the
      manufacturing timeline and design intent, but not independent benchmarks,
      production references, or trust-control disclosure.
    claimRefs: [CE010, CE011, CE012, CE014]
