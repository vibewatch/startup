      - number: '4.3'
        title: Cost structure, delivery economics, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Feedzai looks software-led and capital-light in delivery, but not necessarily cheap to implement. The AML
              Transaction Monitoring page emphasizes lower compliance costs, lower total cost of ownership, and
              automated SAR/STR filing, while Orchestration and Secure Onboarding emphasize APIs, data connectors,
              real-time decisioning, and cloud delivery rather than physical infrastructure. The business therefore
              appears more exposed to R&D, cloud/data costs, implementation, support, and go-to-market expense than to
              inventory or hard capex. The CFO announcement strengthens that picture: Feedzai described itself in 2025
              as a 600+ employee, 10-office global company and said fiscal 2024 was record-breaking, driven in part by
              88% growth in behavioral biometrics. Gartner's 2026 product profile independently places Feedzai in the
              501-1000 employee band, which is directionally consistent with a meaningful opex base.


              Adverse evidence is concentrated in implementation burden, support responsiveness, and pricing opacity.
              Gartner's critical May 2026 review says the platform is strong for fraud prevention but that support
              responsiveness and depth can fall short in complex or time-sensitive situations, especially for older
              on-premise deployments. A Capterra review says rule creation is quick but costly, requires many manual
              steps, and can become confusing because of workflow, metric, and UI friction. Software Advice and GetApp
              both confirm that price discovery happens only after contacting the vendor rather than through a public
              schedule.


              The financial implication is that Feedzai likely has real pricing power with large institutions, but also
              nontrivial deployment and support cost that could compress realized margin if services intensity is high.
              Public sources do not disclose gross margin, services share, CAC, payback, NRR, or churn, so the margin
              path remains an inference, not a reported fact. The visible evidence supports a capital-light software
              architecture with enterprise implementation burden, not a clean public SaaS efficiency profile.
