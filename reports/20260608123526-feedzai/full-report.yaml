      - number: '4.4'
        title: Funding, statutory filings, and capital adequacy context
        blocks:
          - type: paragraph
            body: >-
              Feedzai has fresh valuation support and a meaningful disclosed capital base, but public evidence still
              stops short of balance-sheet adequacy. In March 2021, Feedzai announced a $200M Series D led by KKR at a
              valuation well above $1B, with proceeds earmarked for global expansion, product development, and partner
              strategy. In October 2025, Feedzai announced another approximately $75M investment round that increased
              valuation to $2B; PR Newswire, TechFundingNews, and FinTech Global all corroborate the round size and
              valuation step-up. Based only on rounds with disclosed sizes, Feedzai has at least $275M of publicly
              identified primary capital since 2021, before any undisclosed strategic investments.


              The digital euro selection is economically important but should be treated carefully. Feedzai's own
              release says the risk-and-fraud framework has an estimated value of €79.1M and a maximum value of €237.3M,
              and that the company would supply a fraud-risk score for each transaction. ECB's official notice confirms
              Feedzai is the first-ranked provider for risk and fraud management. However, ECB also says framework
              agreements involve no payment at this stage and that actual development decisions will be taken later. In
              other words, the framework supports commercial credibility and potential backlog, but it is not booked
              revenue or guaranteed cash.


              The only filing-grade public financial visibility reviewed here is at the subsidiary level. Companies
              House shows FEEDZAI UK LIMITED is active, filed a confirmation statement in May 2026, and has
              small-company accounts through 31 January 2025. That is useful as evidence of statutory compliance and
              legal footprint, but it is not a substitute for consolidated financial statements. No reviewed source
              discloses group cash, debt, burn, runway, or profitability, and no reviewed source revealed a public debt
              facility. Capital adequacy therefore remains a private-data question despite the strong valuation marks.
