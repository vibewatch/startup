chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, roots, and product scope
        blocks:
          - type: paragraph
            body: >-
              Feedzai's present-day public positioning is clear even if some legacy corporate descriptors are not. The
              company now describes itself as an AI-native end-to-end financial crime prevention platform, with fraud,
              scams, anti-money laundering, screening, and broader risk operations tied together in one stack. Its
              current homepage, About page, and recent product launches consistently target banks, payment providers,
              and other financial institutions rather than a broad horizontal analytics market. Founder materials anchor
              the company in 2011 and emphasize the technical pedigree of Nuno Sebastião and Pedro Bizarro, while
              third-party company-profile sources still point back to Coimbra, Portugal as the core historical
              headquarters. At the same time, Feedzai announced a U.S. headquarters opening in New York in March 2025,
              so the safest description for later chapters is a Portugal-rooted company with a dual-center operating
              footprint across Portugal and the United States rather than a single undisputed HQ label.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
              - CO014
              - CO042
              - CO049
      - number: '1.2'
        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Feedzai's public leadership record is strong on named executives and thin on complete governance
              disclosure. Nuno Sebastião remains the clearest public face of the company and still anchors the founding
              narrative, capital-markets messaging, and partner-facing positioning. Pedro Bizarro continues to provide
              much of the technical and research credibility, while Pedro Barata, David Larson, and Mariana Jordão round
              out the visible product, finance, and operations bench. Feedzai added Ana Sousa and Julie O’Brien in March
              2025 to strengthen people and marketing leadership, which suggests the company is maturing beyond a purely
              founder-led operating model. Even so, the reviewed sources still reveal a concentration risk: the public
              narrative on strategy, innovation, and regulatory validation runs mainly through Nuno and Pedro.
              Governance visibility is also incomplete. The company publicly named David Henshall as an outside director
              in 2022, but the broader board roster, committee structure, and succession planning remain under-disclosed
              in the sources reviewed for this chapter.
