companyProfile:
  summary: >-
    Feedzai is a Portugal-rooted, U.S.-scaled financial crime prevention company that sells an AI-native platform
    spanning fraud, scam, onboarding, AML, screening, orchestration, and network intelligence for banks and payment
    providers. Public evidence supports meaningful strategic momentum through its 2025 financing, the ECB digital euro
    selection, customer and partner expansion, and continued product launches, but the company remains financially
    opaque on core underwriting metrics such as ARR, revenue, gross margin, and cap-table terms.
  foundedDate: '2011-01-01'
  founders:
    - name: Nuno Sebastião
      role: Co-founder and CEO
      background: Former European Space Agency engineer; remains Feedzai's primary external executive voice.
      claimRefs:
        - CO003
        - CO004
    - name: Paulo Marques
      role: Co-founder
      background: null
      claimRefs:
        - CO003
    - name: Pedro Bizarro
      role: Co-founder and Chief Science Officer
      background: Leads Feedzai's research organization and public technical narrative.
      claimRefs:
        - CO003
        - CO005
  foundingLocation: Coimbra, Portugal
  headquarters: New York City, US / Coimbra, Portugal roots
  productSummary: >-
    AI-native RiskOps platform for fraud detection, scam prevention, AML transaction monitoring, onboarding, screening,
    orchestration, and network intelligence.
  customerFocus: Banks, payment providers, acquirers, fintechs, and public-sector financial infrastructure programs.
  businessModel: >-
