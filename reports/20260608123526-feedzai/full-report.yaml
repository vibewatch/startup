            body: >-
              Feedzai’s business model creates dependency risk at three levels: infrastructure, data ecosystem, and bank
              procurement governance. Public customer and partner materials show AWS as both a technical substrate and a
              commercial channel: ANZ’s orchestration workflow is built on AWS, and the AWS Marketplace press release
              says customers can buy Feedzai with AWS credits and manage it through AWS accounts. Standard Chartered’s
              case adds a second layer of dependency by describing single-contract access to hundreds of external data
              providers, with provider failover and entity resolution handled inside Feedzai’s orchestration layer. That
              architecture can reduce integration sprawl, but it also makes third-party data quality, regional
              compliance approvals, and exit planning part of the vendor-risk equation. Regulators reinforce that
              burden. PRA SS2/21 and the EBA outsourcing guidance treat outsourced technology as a governed relationship
              that needs data-security controls, business-continuity planning, and exit options. Feedzai’s own sanctions
              policy extends governance even further by requiring KYC and KYV screening of customers, partners, and
