  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Feedzai usually lands on a regulated-risk pain point, integrates deeply into workflows and data, proves measurable
      value, then expands across adjacent fraud, AML, and orchestration modules.
    data:
      items:
        - id: pain
          label: Pain appears
          actor: Fraud / payments / AML leader
          description: >-
            A bank, acquirer, or platform needs lower fraud loss, lower false positives, faster onboarding, or stronger
            AML controls.
          channels:
            - Direct enterprise sale
            - Partner referral
            - Regulatory or scam-pressure event
        - id: integrate
          label: Integrate data and controls
          actor: Risk and engineering teams
          description: >-
            Feedzai connects transaction data, behavioral signals, screening, rules, and workflows into the customer
            environment.
          channels:
            - APIs
            - Case manager
            - Behavioral biometrics
            - External-data orchestration
        - id: prove
          label: Prove production value
          actor: Analysts and product owners
          description: >-
            Customers report lower fraud loss, fewer false positives, better approval rates, or faster decisions in a
            live workflow.
          channels:
            - Transaction monitoring
            - Digital Trust
            - AML screening
            - Onboarding
        - id: expand
          label: Expand across use cases
          actor: Account sponsor plus adjacent teams
          description: Accounts add AML, screening, additional channels, more geographies, or downstream-institution coverage.
          channels:
            - Fraud to AML
            - Issuer multitenancy
            - Lending orchestration
            - Partner distribution
        - id: renew
          label: Renew or embed
          actor: Procurement and operating owner
          description: >-
            Deep workflow integration, custom rules, models, and partner channels increase embeddedness, but public
            retention metrics remain undisclosed.
          channels:
            - Multi-year transformation
            - Volume growth
            - Internal modeling expertise
    claimRefs:
      - CU001
      - CU008
      - CU010
      - CU041
      - CU043
      - CU047
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      The public funnel is strongest at scale proxies and named flagship wins, but weak on the exact number of paying
      customers and retention cohorts.
    approximationNotes: >-
      Values are indexed or count-like public signals, not a unified customer funnel from one source. They mix public
      scale proxies, reviewed named proofs, and disclosed flagship wins.
    data:
      items:
        - label: Public scale proxy
          value: 100
          description: 1B consumers, $9T in annual payments, and >1,000 U.S. financial institutions using Feedzai risk score.
        - label: Current named proofs reviewed
          value: 12
          description: Named customer-story rows retained in this chapter.
        - label: Quantified named outcomes
          value: 10
          description: Most named rows have at least one explicit KPI or operational outcome.
        - label: 2024-2026 flagship wins
          value: 5
          description: FY24 upsell, Jack Henry, Mastercard, ECB, and Novobanco transformation.
        - label: Partner-led distribution routes
          value: 4
          description: Mastercard, Jack Henry, Neterium, and core-banking-provider channels.
        - label: Public retention cohorts
