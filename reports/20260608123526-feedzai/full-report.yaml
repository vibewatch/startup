  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Model-Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Feedzai’s clearest top risk is not a proven public enforcement action but the cumulative governance burden
              attached to selling AI-driven risk tooling into banks. Its own privacy and DPA materials show that the
              company can sit in both controller and processor roles, can touch customer end-user data, and already
              contemplates EU and UK transfer mechanisms such as SCCs and the UK addendum. At the same time, Feedzai’s
              ethical-AI and responsible-AI materials explicitly market explainability, bias mitigation, fairness
              tooling, and human oversight because regulated financial use cases increasingly require those controls.
              External guidance reinforces that point: NIST frames trustworthiness as part of AI lifecycle management;
              ICO guidance requires information, challenge rights, and human intervention for certain automated
              decisions; and UK or EU outsourcing rules make cloud risk infrastructure a governed vendor relationship
              rather than a simple software buy. That means the commercial risk is two-layered: Feedzai must keep the
              product explainable and privacy-compliant, and its customers must prove to their own validators and
              regulators that the deployment is safe. Public materials reviewed did not disclose a public subprocessor
              list, incident history, or litigation register, so the diligence burden remains materially above what the
              website alone can clear.
            claimRefs:
