  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public proof is strongest for Digital Trust, transaction fraud, AML workflows, and partner rollouts, while RiskFM
      and open docs remain less fully underwritten.
    data:
      columns:
        - Newest / proof-light
        - Operational but still partly gated
        - Strongest current public proof
      rows:
        - label: RiskOps platform narrative
          values:
            - label: RiskOps Studio migration detail is thin
              tone: warning
            - label: Single-platform story is clear
              tone: warning
            - label: Identity/Fraud/AML map is explicit
              tone: positive
        - label: Digital Trust and identity
          values:
            - label: Certification scope still unclear
              tone: warning
            - label: Session-risk claims are partly case-study-led
              tone: warning
            - label: 3-in-1 architecture and market recognition are strong
              tone: positive
        - label: AML stack
          values:
            - label: Public SLA / latency detail is limited
              tone: warning
            - label: Provider and audit-trail detail is visible
              tone: warning
            - label: TM + screening workflows are well described
              tone: positive
        - label: Developer and research surface
          values:
            - label: Core product code is closed
              tone: warning
            - label: Docs portal is gated
              tone: warning
            - label: GitHub and research outputs are substantive
              tone: positive
        - label: Network intelligence and orchestration
