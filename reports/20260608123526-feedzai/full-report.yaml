      - number: '3.4'
        title: Switching costs and multi-homing — the hard part is workflow replacement, not feature matching
        blocks:
          - type: paragraph
            body: >-
              The main switching constraint in this market is not whether a rival can claim “AI” or “real-time
              monitoring.” It is whether a buyer can replace the surrounding operating fabric: shared data pipelines,
              transaction and customer context, third-party enrichment, case-handling logic, alert routing, audit
              trails, and integrations into payment rails or bank systems. Feedzai’s own sources lean into this logic
              through Demyst orchestration and FRAML unification; Novobanco’s migration narrative is explicitly about
              replacing fragmented legacy systems with one environment. The same pattern appears across rivals. FICO
              emphasizes shared data and case workflows, NICE Actimize sells managed optimization around installed AML
              models, ComplyAdvantage foregrounds API and audit-trail integration, Sardine and Unit21 sell AI-assisted
              investigations, and DataVisor ties FRAML to real-time decisioning and agentic controls.


              This has two implications. First, multi-homing is realistic at the edge: screening, consortium data,
              device intelligence, or a tactical RTP module can often be added without ripping out the core. Second,
              full-stack displacement is structurally harder once a platform owns shared cases, models, and evidence
              flows. That dynamic protects incumbents on renewals, but it can also protect Feedzai once adopted. For
              new-logo deals, however, it raises the bar: Feedzai must show not just better detection, but lower
              migration pain than either incumbent estates or modular challenger stacks.
            claimRefs:
              - CP004
              - CP005
              - CP006
