  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public customer proof is strongest where Feedzai publishes a named workflow plus KPI and weaker where the evidence
      is mostly distribution or curated references.
    data:
      columns:
        - Evidence quality
        - Outcome specificity
        - Retention visibility
        - Production maturity
      rows:
        - label: Novobanco
          values:
            - High — official story plus current press and independent news
            - High — multi-year transformation, faster investigations, fewer false positives
            - Low — no contract or cohort math
            - High — live expansion from 2023 to 2026
        - label: Jack Henry
          values:
            - Medium-High — two current company sources
            - Medium — hundreds of institutions and alert-rate target
            - Low — no partner-retention or downstream-bank churn data
            - High — active platform distribution
        - label: Banco BV
          values:
            - Medium-High — detailed case study plus aggregator references
            - High — 80% approval-time cut and 2h-to-30m SLA improvement
            - Low — no renewal data
            - High — expansion into onboarding and cards
        - label: Elo
          values:
            - Medium-High — detailed case study plus aggregator references
            - High — 35+ issuers, 90% fraud-bps drop for one issuer, 100+ banks
            - Low — issuer retention undisclosed
            - High — clearly production and multi-tenant
        - label: Unzer / PayU acquirer cases
          values:
