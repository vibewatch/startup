  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category
        blocks:
          - type: paragraph
            body: >-
              Feedzai should be analyzed inside the bank and payments financial-crime stack, not inside a generic “AI
              for finance” bucket. Its own positioning is specific: the company sells fraud, scam, identity, and AML
              controls to global banks and emerging fintechs, and its 2026 benchmarking launch was framed for financial
              institutions benchmarking digital-payment fraud performance. That means the included spend is software and
              operating infrastructure used to detect suspicious transactions, score fraud and scam risk in real time,
              manage alerts and investigations, and connect fraud and AML workflows across payment, onboarding, and
              transaction-monitoring surfaces. The market boundary should exclude unrelated core-banking software,
              generic cybersecurity, consulting-only services, and broader financial-software categories that do not
              directly perform financial-crime decisioning. Status-quo substitutes are still powerful: batch transaction
              monitoring, rules-only point tools, fragmented fraud and AML teams, and manual investigator workflows
              inside banks. Research and Markets, Feedzai, and AFP together suggest that the relevant buyer universe is
              a regulated institution or payment operator with explicit accountability for payments risk, fraud
              controls, AML outcomes, or financial-crime governance rather than a generic corporate IT department.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM009
              - CM016
              - CM027
              - CM058
