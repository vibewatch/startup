      - number: '8.2'
        title: Financing context, dilution, and price support gap
        blocks:
          - type: paragraph
            body: >-
              The October 2025 Series E put a clear headline on the table: roughly $75 million raised at a $2 billion
              post-money valuation. Publicly, that looks like a relatively low-dilution financing event. If the cash was
              entirely primary, the math implies only about 3.75% dilution and a pre-money value of roughly $1.925
              billion. That is useful because it says investors were willing to move the mark higher without a giant
              recap. But it is not enough to underwrite the economics. Tracxn shows seven rounds and $347 million of
              cumulative funding, while PitchBook’s public page is not openly accessible. That combination matters
              because low visible dilution in the latest round does not eliminate preference-stack risk, secondaries, or
              option-pool overhang from prior rounds. The burden of proof still sits with private diligence, not with
              the headline post-money figure itself.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV021
