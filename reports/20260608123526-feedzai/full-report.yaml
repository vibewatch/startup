      - number: '2.2'
        title: Sizing Lenses and Contradictions
        blocks:
          - type: paragraph
            body: >-
              No single public TAM maps neatly to Feedzai. Broad fraud-detection-and-prevention publishers such as
              Mordor and Fortune place the market at roughly US$67-70B in 2026, but those estimates span many industries
              and include adjacent functions such as authentication and governance tooling. At the other extreme, Expert
              Market Research values a much narrower financial-crime-and-fraud-management-solutions category at only
              US$1.37B in 2025, growing at 5.7% CAGR. The spread is too wide to average away; it is evidence that
              publishers are measuring different things. A more useful middle lens comes from Mordor’s vertical and
              customer splits: BFSI accounted for 26.15% of 2025 spend and large enterprises for 56.64%, implying a
              roughly US$14.6B BFSI slice and a roughly US$8.3B large-enterprise BFSI slice before narrowing further to
              bank-and-payments fraud and AML workflows. Two operational lenses reinforce that the need is real even
              when software TAM is fuzzy: ACI says real-time payments reached 266.2B transactions in 2023, while Nasdaq
              Verafin estimates US$4.4T of illicit financial activity and US$579.4B of fraud losses in 2025. The market
              is therefore clearly multi-billion-dollar, but exact SAM and SOM remain evidence-constrained because
              public sources rarely isolate bank-and-payments transaction-monitoring, scam, and FRAML spend with
              compatible methodology.
