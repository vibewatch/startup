      - number: '3.5'
        title: Verdict — Feedzai is credible and differentiated, but not insulated
        blocks:
          - type: paragraph
            body: >-
              Feedzai’s strongest current position is the middle ground it occupies. It looks more modern and unified
              than many incumbent estates, yet has stronger public bank-grade proof than most startup peers, thanks to
              the ECB digital-euro role and the Novobanco transformation. That is valuable because large-bank buyers
              often want both a future-facing architecture and evidence that another regulated institution has already
              trusted it.


              The adverse case is equally real. FRAML has become a crowded theme, and several challengers now market
              agentic workflow automation with bold productivity claims that sound directionally similar to Feedzai’s
              story. Meanwhile, NICE Actimize and FICO still possess the scale, geography, and installed-base trust to
              blunt displacement. Public pricing also does little to clarify the competitive answer because official
              list prices are largely absent across the entire set. The result is a chapter verdict of “competitive but
              not structurally safe”: Feedzai is a legitimate top-tier contender in modern financial-crime platforms,
              but moat durability now depends less on category narrative and more on measurable migration ease,
              reference strength, and win rates against named incumbents and fast-moving FRAML challengers.
