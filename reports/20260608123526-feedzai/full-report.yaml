  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: RiskOps definition and module map
        blocks:
          - type: paragraph
            body: >-
              Feedzai now presents a much clearer platform story than many older anti-fraud vendors: the company has
              reorganized its product surface around a single RiskOps banner that explicitly unites Identity, Fraud, and
              AML across the full customer lifecycle. The important diligence point is not only that the modules exist,
              but that the public map is legible. Identity covers account opening, Digital Trust, new-account fraud, and
              account monitoring; Fraud covers transaction fraud, scam prevention, and acquirer risk; AML covers
              watchlist screening and transaction monitoring. That module structure makes it easier to understand where
              Feedzai thinks the boundary sits between onboarding risk, session risk, payment fraud,
              sanctions/compliance controls, and investigator workflows.


              The workflow narrative also hangs together. Feedzai starts with onboarding and identity signals, continues
              with continuous session monitoring and transaction decisioning, and then carries those signals into AML
              investigations and case management. The platform pages repeatedly emphasize a single collaborative
              experience and a shared data view instead of separate fraud, identity, and AML consoles. That is
              strategically important because unified risk operations are central to Feedzai’s pitch versus point
              products and fragmented legacy stacks.


              There is still a diligence caveat. The public module map is now broad and coherent, but the exact
              commercial packaging, attach rates, and module-by-module deployment depth remain undisclosed. Investors
              can understand what the modules are supposed to do; they still cannot tell from public material how often
              customers buy the whole stack versus a narrow slice.
