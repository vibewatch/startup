            - High — 60% false-positive reduction / 50% LATAM fraud cut
            - Low — merchant economics undisclosed
            - High — long-running production workflows
        - label: Reference-platform layer
          values:
            - Medium — Gartner, Software Advice, FeaturedCustomers
            - Medium — good ratings plus concrete but small-sample complaints
            - Low — no direct cohort math
            - High — strongly suggests real production users
