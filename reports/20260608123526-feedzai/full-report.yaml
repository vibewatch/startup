      - number: '8.3'
        title: Comparable public and transaction lenses
        blocks:
          - type: paragraph
            body: >-
              The comp set points in two very different directions. Public trading comps such as NICE, Riskified, and
              ACI sit around roughly 1.85x-2.5x revenue, which is the kind of math that forces very large undisclosed
              revenue assumptions to defend a $2 billion mark. FICO is the premium public outlier at about 11.7x, but it
              earns that with evidence-backed software ARR growth and filing-grade retention disclosure. Verafin is the
              best strategic transaction lens because Nasdaq paid $2.75 billion on an implied 19.5x revenue multiple
              while also disclosing roughly 30% ARR CAGR and more than $140 million of revenue. Windsor Drake’s 2026
              work reconciles those endpoints: median public regtech has reset to about 3x-6x revenue, while only scarce
              AI-native or strategically critical assets still command 8x-15x or better. Feedzai may belong closer to
              that premium band, but the public record does not yet prove it.
            claimRefs:
