      - number: '3.2'
        title: Incumbents — NICE Actimize and FICO still set the enterprise trust baseline
        blocks:
          - type: paragraph
            body: >-
              NICE Actimize and FICO remain the most consequential incumbents because they combine broad product scope
              with clear public scale. NICE Actimize positions X-Sight as an AI-driven AML and fraud platform, layers in
              managed AML analytics through ActimizeWatch, and continues to emphasize digital-banking and
              faster-payments risk. At the parent level, NiCE says it operates in more than 150 countries, and
              CompaniesMarketCap reports trailing-twelve-month revenue of $2.94 billion as of June 2026. FICO presents a
              similarly broad posture: Protect & Comply spans KYC, AML, fraud prevention, workflows, and case
              management, while Enterprise Fraud explicitly covers card, application, and real-time payment fraud with
              millisecond response. FICO’s SEC-filed Q1 2026 release reported $512 million of quarterly revenue,
              including $207.5 million of software revenue.


              That matters for Feedzai because large-bank procurement does not reward product elegance alone. Incumbents
              can point to bigger installed bases, procurement familiarity, and existing operational entanglement in
              fraud, AML, and adjacent decisioning. SAS should still be treated as part of the incumbent backdrop
              because 2026 AML longlists continue to surface it, but publicly accessible current product detail was
              thinner in the reviewed set than for NICE Actimize or FICO. Net: Feedzai’s strongest incumbent threat is
              not that these vendors are more modern, but that they are more embedded.
            claimRefs:
