      - number: '4.2'
        title: Scale signals and customer-ROI proxies
        blocks:
          - type: paragraph
            body: >-
              Feedzai's strongest public financial signals are operating scale and customer outcomes, not revenue
              disclosure. Across its homepage, About page, benchmarking press release, and customer-story hub, the
              company says it protects roughly one billion consumers, processes or safeguards about 120 billion events
              per year, and touches about $9 trillion of payment volume annually. The customer-stories hub also says
              more than 1,000 U.S. financial institutions use Feedzai's risk score. Those are not ARR figures, but they
              do suggest that Feedzai operates at a scale where enterprise renewals and expansion revenue can matter
              materially.


              The customer proof is economically useful because it is outcome-based. Feedzai Orchestration advertises a
              67% reduction in customer application time, integration of 16 new data sources in three months, and more
              than $100M in incremental new revenue. The ANZ GoBiz case says Feedzai-supported workflows enabled
              20-minute lending decisions, 24-hour approvals, and $150M in incremental bank funding. Secure Onboarding
              claims $250M in deposits unlocked, 65% less fraud, 85% faster strategy deployment, and 20% lower
              third-party data spend. CoreCard says Feedzai cut fraud-related declines 46% while detecting 64% of
              attempted fraud. Feedzai IQ claims 4x more fraud detection, 50% fewer alerts, 27% better acceptance rates,
              and a 5% uplift in fraud detection for acquiring workflows.


              These data points matter because they show how Feedzai can justify premium enterprise pricing without
              publishing it. Buyers appear to purchase the platform on avoided losses, higher approval rates, faster
              onboarding, lower false positives, and reduced compliance workload. That is a credible revenue-quality
              signal: the product is sold against mission-critical economics rather than discretionary analytics spend.
              The caution is that all of these are customer or company-reported ROI proxies; none reveal Feedzai's own
              realized revenue, module mix, renewal cohorts, or gross profit conversion.
