        - Request audited or management-prepared income statement plus ARR bridge by module, region, and customer type.
      - - Revenue mix by module and services
        - >-
          Cross-sell thesis is central to the story, but public sources do not show how much revenue comes from fraud,
          AML, onboarding, IQ, services, or public-sector work.
        - Request product-line revenue mix and professional-services share of bookings and revenue.
      - - Gross margin and hosting / support cost
        - >-
          The company looks software-led, but review evidence implies nontrivial support and implementation cost that
          could compress margin.
        - Request gross margin by software versus services and major COGS buckets such as cloud, data, and support.
      - - Cash balance, burn, and runway
        - Capital adequacy cannot be assessed from fresh funding alone; burn determines financing dependency.
        - Request current balance sheet, trailing-12-month cash flow statement, board budget, and downside runway view.
      - - Retention, churn, and CAC payback
        - Mission-critical positioning suggests sticky revenue, but there is no public cohort proof.
        - Request NRR, gross retention, churn by segment, CAC, payback, and implementation cost by cohort.
      - - Realized price points, minimums, and discounts
        - >-
          Public sources only show quote-based selling and perceived value; they do not show actual ACV or pricing
          discipline.
        - Request sample contracts, price book, discount waterfall, payment terms, and module attach-rate economics.
      - - Digital-euro revenue conversion assumptions
        - The framework is strategically important, but ECB says there is no payment at this stage.
        - >-
          Request activation triggers, work-order process, implementation timeline, and accounting treatment for
          framework work.
      - - Customer concentration and top-account exposure
        - Named logos show quality, but concentration risk is unknown and could materially affect valuation and runway.
        - >-
          Request top-10 customers by ARR / gross profit, renewal dates, and share of revenue tied to the largest
          deployments.
      - - Audited consolidated financial statements
        - Subsidiary filings are not enough to test group solvency, profitability, or debt exposure.
        - >-
          Request audited group statements, cap table, debt schedule, and legal-entity map linking subsidiaries to
          contracts and cash.
    notes: >-
      Every row is a real underwriting blocker that remained unresolved after reviewing official pages, filings,
      reviews, and news. These are not speculative asks; they are the exact private-data items needed to convert public
      momentum into an investable model.
