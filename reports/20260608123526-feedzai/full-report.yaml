  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call stays cautious because Feedzai shows real strategic quality but not enough public financial disclosure to
      prove the current price.
    data:
      nodes:
        - id: s1
          label: Strategic quality
          detail: Digital-euro role, Demyst breadth, large-bank proof, and positive cash flow all support a serious asset.
          tone: positive
        - id: s2
          label: Premium optionality
          detail: >-
            Verafin and FICO show that anti-financial-crime platforms can attract premium multiples when revenue quality
            is visible.
          tone: positive
        - id: s3
          label: Public evidence gap
          detail: No current ARR, revenue, margin, NRR, or cap-table disclosure is available publicly.
          tone: warning
        - id: s4
          label: Comp reality
          detail: Median public regtech and fraud software bands still sit far below premium transaction outliers.
          tone: warning
        - id: s5
          label: Decision
          detail: Research-more and maintain price discipline until private diligence closes the denominator gap.
          tone: neutral
      edges:
        - from: s1
          to: s5
          label: keeps story live
        - from: s2
          to: s5
          label: supports upside
        - from: s3
          to: s5
          label: blocks conviction
        - from: s4
          to: s5
          label: caps price support
    approximationNotes: null
    claimRefs:
      - CV008
      - CV015
      - CV020
      - CV029
      - CV030
      - CV032
      - CV036
      - CV047
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Because current revenue is undisclosed, the cleanest public sensitivity test is the revenue required to justify
      the $2B mark at different multiples.
    data:
      items:
        - label: 12x revenue support
          value: 167
          detail: Revenue in USD millions needed to support $2B at a premium public-software multiple.
          tone: positive
        - label: 10x revenue support
          value: 200
          detail: Threshold at a still-strong premium multiple.
          tone: neutral
        - label: 8x revenue support
          value: 250
          detail: Roughly the low end of a premium tier after some compression.
          tone: warning
        - label: 6x revenue support
          value: 333
          detail: Closer to the top of Windsor Drake’s median public band.
          tone: warning
        - label: 3x revenue support
          value: 667
          detail: What would be required if the market prices Feedzai like ordinary regtech or mature fraud workflow software.
          tone: negative
    approximationNotes: >-
      Thresholds are simple valuation divided by revenue multiples anchored to the disclosed $2B post-money mark, not
      estimates of Feedzai’s current actual revenue.
    claimRefs:
      - CV001
      - CV029
      - CV030
      - CV036
      - CV038
      - CV040
      - CV042
      - CV046
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The current mark sits between an evidence-light base case and a premium outcome that still needs private proof on
      revenue quality and economics.
    data:
      items:
        - label: Bear case
          low: 800
          mid: 1100
          high: 1500
          displayValue: $0.8B-$1.5B
          detail: 3x-5x revenue world with ordinary quality or lower-than-needed scale.
          tone: negative
        - label: Base case
          low: 1600
          mid: 2000
          high: 2400
          displayValue: $1.6B-$2.4B
          detail: 6x-8x world where Feedzai is strong but not rare enough to live at the premium end.
          tone: warning
        - label: Bull case
          low: 3000
          mid: 3600
          high: 4200
          displayValue: $3.0B-$4.2B
          detail: >-
            10x-12x world in which revenue quality and strategic relevance prove out like a premium comp or transaction
            outcome.
          tone: positive
        - label: Current post-money
          low: 2000
          mid: 2000
          high: 2000
          displayValue: $2.0B
          detail: Headline valuation from the October 2025 round.
          tone: neutral
    approximationNotes: >-
      Ranges are scenario-based enterprise-value outputs for underwriting discipline, not management guidance and not a
      statement of current actual fair value to the dollar.
    claimRefs:
      - CV001
      - CV029
      - CV030
      - CV032
      - CV036
      - CV038
      - CV040
      - CV042
      - CV046
      - CV047
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Feedzai scores well on market relevance and strategic positioning, but poorly on public evidence sufficiency and
      current price support.
    data:
      items:
        - label: Market
          score: 8
          detail: Large, growing market with persistent fraud, AML, and scam tailwinds.
          tone: positive
        - label: Product / proof
          score: 7
          detail: Demyst breadth, large-bank wins, and digital-euro selection all help.
          tone: positive
        - label: Moat
          score: 7
          detail: Switching costs and data-network arguments are real, though not yet fully quantified publicly.
          tone: positive
        - label: Economics visibility
          score: 3
          detail: Cash-flow positive signal is helpful, but current ARR, revenue, gross margin, and NRR are undisclosed.
          tone: warning
        - label: Valuation support
          score: 3
          detail: >-
            A $2B mark can be rational, but only if private metrics place Feedzai near premium comps rather than median
            bands.
          tone: warning
        - label: Capital-structure clarity
          score: 2
          detail: Preference stack and 2025 round economics are still missing publicly.
          tone: negative
        - label: Evidence quality
          score: 4
          detail: There is enough public evidence to frame discipline, but not enough to close underwriting.
          tone: warning
    approximationNotes: >-
      Scores are ordinal 0-10 investment judgments anchored to the cited public evidence rather than management-supplied
      private KPI packs.
    claimRefs:
      - CV007
      - CV008
      - CV015
      - CV020
      - CV022
      - CV027
      - CV029
      - CV030
      - CV047
      - CV048
