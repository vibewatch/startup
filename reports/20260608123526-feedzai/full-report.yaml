      - number: '2.4'
        title: Drivers, Regulation, and Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case is strong because market drivers are structural, not cyclical. Real-time-payment adoption
              keeps expanding, regulators are shifting from box-checking to effectiveness, and AI has become both an
              attack accelerant and a detection requirement. FinCEN’s April 2026 proposal emphasizes risk-based AML/CFT
              programs, effectiveness, and objective independent testing; EBA says instant payments carry notably higher
              fraud rates than traditional credit transfers; the UK’s PSR has attached reimbursement economics to APP
              scams; and FedNow was launched with 24x7x365 settlement plus optional fraud-prevention features. At the
              same time, ACI, ACAMS, Mastercard, KYC Hub, and NICE Actimize all describe the same operational
              consequence: the window to detect, challenge, and investigate suspicious activity is shrinking. But
              adoption is still hard. DataVisor and McKinsey highlight fragmentation, poor data quality, and expensive
              manual operating models; KYC Hub and NICE emphasize explainability, governance, and specialist
              investigators; Moody’s points to interoperability and unified-risk architecture as prerequisites; and
              Mastercard argues that leadership alignment across cyber and fraud intelligence is now part of the control
              stack itself. For Feedzai, this means the market tailwind is real, but winning depends on proving
              measurable ROI, handling regulated deployment complexity, and fitting into long bank procurement and
              integration cycles.
