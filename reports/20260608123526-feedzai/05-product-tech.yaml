  type: stack
  layout: wide
  summary: Feedzai’s public architecture reads as a layered risk stack from signal ingestion through identity, payment decisioning, AML controls, and analyst workflows.
  approximationNotes: This architecture is synthesized from public product, research, GitHub, and support materials rather than copied from a single official system diagram.
  data:
    layers:
    - id: ingestion
      label: Signal ingestion and orchestration
      detail: Secure Onboarding, New Account Fraud, and Orchestration bring external data, application signals, and workflow logic into account-opening decisions.
    - id: identity
      label: Continuous identity and session trust
      detail: Identity and Digital Trust combine behavioral biometrics, device intelligence, malware detection, and adaptive session monitoring.
    - id: transaction
      label: Real-time transaction decisioning
      detail: Transaction Fraud and Feedzai IQ score payments using behavioral, monetary, non-monetary, and network intelligence signals.
    - id: aml
      label: Screening and AML operations
      detail: Watchlist Screening and AML Transaction Monitoring add sanctions screening, alert prioritization, case management, and SAR workflows.
    - id: ai
      label: AI and model-management layer
      detail: Pulse Risk Engine, Whitebox Explanations, AutoML, Data Science Studio, and RiskFM provide model execution, explanation, and adaptation.
    - id: ops
      label: Analyst, partner, and support surface
      detail: Case Manager, partner integrations, GitHub research assets, support workflows, and portal docs make the stack deployable and maintainable.
