- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Public status
  - Scope
  - Why it matters
  - Remaining gap
  rows:
  - - Whitebox Explanations
    - Publicly marketed
    - Plain-text decision explanations for fraud and AML analysts
    - Supports explainability and analyst adoption in regulated workflows
    - No public examples show coverage by model family or jurisdiction
  - - Responsible AI features
    - Publicly marketed
    - Bias quantification, fairer alternatives, fairness-performance optimization
    - Shows productized governance ambition, not just research claims
    - No public scorecards or model-governance thresholds are published
  - - TRUST Framework
    - Public press release and research microsite
    - Responsible-AI governance and implementation playbook
    - Creates a visible governance posture for GenAI and decisioning systems
    - Public acronym wording is inconsistent across official surfaces
  - - Fairness research stack
    - Public publications and GitHub repos
    - FairGBM, Aequitas Flow, unfairness research, RIFF interpretability
    - Provides technical depth behind fairness/explainability claims
    - Research presence is not the same as proven customer-wide production controls
  - - Privacy-by-design in Digital Trust
    - Publicly marketed
    - No PII by default; anonymized, obfuscated, encrypted device/network/behavior data
    - Important for identity monitoring and cross-session analysis in regulated banks
    - No public certification page clearly maps this claim to audit scope
  - - Screening audit trail
    - Publicly documented
    - Case-level record of what was screened, against which lists, and with what result
    - Relevant for AML defensibility and regulator review
    - Zero-downtime and update-latency evidence is not public
  - - Support and documentation portals
    - Publicly visible but gated
    - Knowledge center plus login/SSO docs portal
    - Shows a real post-sale technical surface exists
    - External diligence cannot fully inspect APIs or runbooks without credentials
  - - Public reliability and certification disclosure
    - Thin
    - No clearly identified public status page or open audit-report package in the reviewed sources
    - Important for underwriting operational resilience and control maturity
    - Must be closed with trust-center artifacts, SLA schedules, and audit summaries
  notes: Public evidence is materially stronger on AI-governance intent and research depth than on openly accessible operational attestations or reliability disclosure.
