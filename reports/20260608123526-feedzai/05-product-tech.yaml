- id: data-and-decisioning-architecture
  title: Data, decisioning, and integration architecture
  body: 'Feedzai’s architecture is best understood as a layered risk-decision stack rather than as a single monolithic model. At the front end, Secure Onboarding and New Account Fraud orchestrate application-stage signals, while Digital Trust adds continuous behavioral, device, network, and malware signals during live sessions. Transaction Fraud then combines behavioral, monetary, and non-monetary data for payment decisions, while Watchlist Screening and AML Transaction Monitoring add compliance-specific controls, prioritization, and reporting. Feedzai IQ sits above those layers as a federated network-intelligence service, and Orchestration sits beside them as the workflow and external-data fabric for onboarding and KYC/AML journeys.


    The most concrete integration evidence is on the Orchestration, Watchlist Screening, and OpenML surfaces. Feedzai publicly documents SQL- and Python-ready workflows, REST APIs, Snowflake and S3 data-delivery options, configuration gateway APIs, named screening data providers, and public OpenML repositories for external machine-learning providers. Those cues make the implementation model look more configurable than a black-box appliance. They also imply that Feedzai expects complex customer environments with multiple upstream data sources and downstream decisioning needs.


    The main architectural limitation is visibility rather than coherence. Public materials show a believable operating model, but many runtime details are gated behind customer docs. External diligence still needs portal access for API versioning, rate limits, schema evolution, and admin controls, especially for institutions evaluating multi-region deployment or heavy customization.'
