  - CE002
  - CE006
  - CE012
  - CE016
- calloutType: risk
  title: Operational proof still lags the breadth of the product story
  body: The product map is coherent, but many runtime details remain behind customer credentials, and the public record is still thin on open SLA, incident, certification-scope, and API-versioning disclosure. Newer differentiators such as RiskFM are still launch-led rather than broadly benchmarked.
  claimRefs:
  - CE034
  - CE038
  - CE049
  - CE050
- calloutType: insight
  title: 2025-2026 signals point to convergence, not feature sprawl
  body: 'RiskOps Studio, Neterium screening, Novobanco’s unification program, and RiskFM all reinforce the same direction: fewer silos, more connected fraud-plus-AML operations, and more reusable network intelligence across the installed base.'
  claimRefs:
  - CE049
  - CE051
  - CE053
  - CE054
  - CE055
