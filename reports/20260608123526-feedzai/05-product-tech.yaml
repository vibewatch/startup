- id: ai-differentiation-and-governance
  title: AI differentiation, explainability, and governance
  body: 'Feedzai’s strongest technical differentiation claim is that it has an unusually explicit AI and research surface for a private financial-crime vendor. Public product pages name Pulse Risk Engine, Whitebox Explanations, Data Science Studio, AutoML, and Responsible AI features, while the research site and GitHub footprint show supporting work on fairness-aware boosting, interpretable low-false-positive rule extraction, fairness experimentation pipelines, and explainability tooling. That is not the same as proving best-in-class production outcomes, but it is stronger evidence than generic “we use AI” positioning.


    RiskFM is the key 2026 signal. Feedzai is pitching it as a foundation-model layer for financial risk across onboarding, payments, transfers, and AML, with claims that it can match bespoke supervised models on day one and outperform traditional approaches when trained across multiple institutions. If those claims hold up, RiskFM could materially reduce model-creation and maintenance costs while broadening coverage across silos.


    Governance is credible but not perfectly tidy. Feedzai’s 2025 TRUST launch emphasized Transparent, Robust, Unbiased, Safe & Secure, and Tested, while the 2026 research microsite reframed the same acronym as Transparent, Robust, Universal, Sustainable, and Tested. That inconsistency does not erase the responsible-AI work, but it does suggest that the external governance story is still evolving. Combined with limited public certification scope and gated docs, the result is a governance posture that is promising yet not fully underwritten from public evidence alone.'
