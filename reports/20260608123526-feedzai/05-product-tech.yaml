- id: deployment-and-partner-dependencies
  title: Deployment model, partner dependencies, and technical proof in market
  body: 'Feedzai’s market proof increasingly comes from combined-product deployments rather than single-point fraud stories. Novobanco is the clearest example: the bank started with Digital Trust and Transaction Fraud, expanded into AML, introduced Neterium-powered watchlist screening, and is now using the platform as part of a unified economic-crime model. That matters because it validates the core product thesis that fraud, identity, and AML signals should live together instead of in disconnected tools. The Jack Henry example points in the same direction for smaller institutions, showing a multi-tenant AML-plus-fraud surface tied into modern payment rails.


    The partner layer is also becoming more visible. Neterium contributes screening infrastructure and named data-provider integrations; Matrix USA contributes implementation and advisory capacity through a joint Center of Excellence; AWS Marketplace adds a distribution and ecosystem signal; and QKS’ Digital Trust recognition supports the identity and behavioral-biometrics narrative. The overall picture is that Feedzai is not operating as a purely standalone product company. It is combining software, partner delivery, and data-provider connectivity to make the stack more deployable.


    The risk is that much of the deepest implementation evidence still sits in customer-only materials. Public pages show that a real deployment ecosystem exists, but they do not expose enough operational detail to fully price migration cost, partner dependency concentration, or SLA obligations.'
