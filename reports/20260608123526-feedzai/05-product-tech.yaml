- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public status
  - Differentiation signal
  - Diligence gap
  rows:
  - - RiskOps Platform
    - Fraud, AML, and identity leaders
    - Core platform narrative, clearly marketed
    - Unified fraud, identity, and AML control plane across the lifecycle
    - Need module attach rates and proof of how often customers deploy the whole stack
  - - Transaction Fraud
    - Fraud ops / payments risk
    - Current, heavily marketed
    - Behavioral plus monetary and non-monetary data with omnichannel risk profiling
    - Need public latency, decision-volume, and rollback metrics by payment rail
  - - Digital Trust
    - Identity / fraud / digital-channel teams
    - Current, strong product and analyst proof
    - Behavioral biometrics, device intelligence, malware detection, and privacy-first monitoring
    - Need public certification scope and independent false-positive studies
  - - Secure Onboarding
    - Onboarding / KYC / digital-origination teams
    - Current, strong product proof
    - Single API and persistent risk profile from application through later events
    - Need deeper public API and workflow docs without portal login
  - - New Account Fraud
    - Onboarding fraud teams
    - Current, current product page and solution brief links
    - Bot, mule, stolen-ID, and synthetic-ID focus at application time
    - Need public benchmark data versus external identity vendors
  - - AML Transaction Monitoring
    - AML investigators and compliance teams
    - Current, detailed FAQ surface
    - 20+ scenarios, ML prioritization, visual link analysis, and SAR Manager
    - Need current evidence of production latency, analyst throughput, and model governance
  - - Watchlist Screening
    - Compliance / sanctions teams
    - Current, enhanced in 2026
    - Neterium-powered transaction screening, real-time compliance, and audit trail
    - Need direct docs on provider SLAs, failover behavior, and sanctions-update latency
  - - Feedzai Orchestration
    - Product, risk, and onboarding engineers
    - Current, technical workflow surface visible
    - SQL/Python workflows, REST APIs, data shares, and 1,000+ integrations claim
    - Need public versioning, connector limits, and release/deprecation policies
  - - Feedzai IQ
    - Fraud strategy teams and acquirers
    - Current, 2025-era network-intelligence surface
    - Federated TrustScore / TrustSignals with immediate value and privacy-preserving design
    - Need external validation of lift by segment and controls around cross-bank model updates
  - - ScamPrevent / ScamAlert
    - Fraud and scam operations
    - Current, clear 2025-2026 emphasis
    - Coercion detection plus GenAI customer-assistance layer
    - Need broader public proof beyond a limited set of case-study metrics
  notes: Rows summarize the visible public product surface and maturity signals, not disclosed SKU packaging, attach rates, or full commercial bundle detail.
