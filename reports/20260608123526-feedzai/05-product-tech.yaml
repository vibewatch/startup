- id: roadmap-and-maturity-signals
  title: 2025-2026 launch cadence and maturity signals
  body: 'The current public record shows a real product cadence rather than a static legacy platform. In 2025 Feedzai publicly surfaced RiskOps Studio, Digital Trust leadership in behavioral biometrics, and the Jack Henry AML-plus-fraud rollout. In early 2026 it added Neterium-based transaction screening, announced the Novobanco unification program, and launched RiskFM. Across those releases the recurring pattern is not random feature sprawl; it is a push toward fewer silos, more network intelligence, more onboarding orchestration, and more unified fraud-plus-AML decisioning.


    The maturity signal is therefore mixed in a constructive way. Feedzai clearly has more than marketing slides: it has named modules, quantified case-study outcomes, public research, public open-source assets, and visible partner rollouts. But some of the newest differentiators, especially RiskFM and the broader RiskOps Studio migration path, are still closer to launch-stage proof than to fully transparent operating proof. That keeps the underwriting stance positive on direction but cautious on how much of the moat is already production-proven across the installed base.


    Bottom line: Feedzai’s product and technical story is now coherent enough to support a strong platform thesis, especially for institutions seeking a unified fraud, identity, and AML control plane. The remaining diligence burden is around operational proof, open documentation, and governance consistency rather than around whether the company has built a meaningful platform at all.'
