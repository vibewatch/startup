  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total raised reconciliation / TO003
    missingEvidence: A reconciled capitalization table or board-approved financing history showing whether public database tallies exclude any historical rounds, debt, or secondaries.
    whyItMatters: Capital formation and dilution history are foundational for later valuation work, but public totals currently diverge.
    diligencePath: Request the company financing ledger and most recent cap table summary, then reconcile each disclosed round against third-party databases.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: customer count disclosure / TO001
    missingEvidence: An explicit current customer or client count, plus a segmentation of banks, payment providers, and government or merchant accounts.
    whyItMatters: The company describes major institutional trust but does not disclose the exact installed base needed for go-to-market and concentration analysis.
    diligencePath: Ask management for a current customer-count bridge by segment and geography, plus top-customer concentration and logo retention metrics.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: headcount reconciliation / TO001
    missingEvidence: A current HR-approved headcount by function and geography that reconciles public self-descriptions with external directory-style estimates.
    whyItMatters: Current organizational scale drives operating-leverage, burn, and execution-readiness analysis, but the public signals conflict materially.
    diligencePath: Request current employee count, contractors, and office roster from HR or finance, then reconcile against LinkedIn- or directory-based captures.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A full current executive-team and board roster, including independent directors, committee assignments, and succession coverage for founders.
    whyItMatters: Public materials identify several executives, but they do not provide a complete governance view or enough detail to assess succession resilience.
    diligencePath: Request the latest board deck, org chart, and committee roster; confirm which executives are current and which directors remain active.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map coverage
    missingEvidence: Ownership percentages, board-seat rights, and partner economics for the investors and strategic programs listed in the stakeholder map.
    whyItMatters: The map identifies the visible stakeholders, but not their exact control or revenue contribution.
    diligencePath: Request the cap table, shareholder rights summary, and revenue attribution for major public partnerships and programs.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage
    missingEvidence: A management-approved chronology covering internal product launches, all customer wins, and the exact close date of the Demyst acquisition.
    whyItMatters: The public chronology is good enough for external milestones but still omits some internal and transaction details.
    diligencePath: Request a company milestone log and M&A close memo, then align product, partnership, and financing events to exact dates.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO004
