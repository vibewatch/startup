- id: milestones-risks
  title: Milestones, platform expansion, and adverse signals to carry forward
  body: 'Feedzai''s milestone record is good enough to establish a reusable chronology for the rest of the report. The company moved from a Portugal-rooted founding in 2011 to meaningful venture funding in 2015 and 2017, then crossed the unicorn threshold in 2021 under KKR leadership. The 2025-2026 sequence matters most for current diligence: a U.S. headquarters opening in New York, the Demyst acquisition to add data orchestration, an October 2025 financing round alongside the digital-euro selection, and then 2026 launches and partnerships around Matrix USA, Neterium, RiskFM, Novobanco, and the State of Fraud Performance benchmark. These events support the thesis that Feedzai is broadening from point fraud prevention into a wider platform spanning fraud, AML, screening, orchestration, and ecosystem distribution. The adverse signals are subtler but still real. Board disclosure remains sparse, exact customer and employee counts are unresolved, and RepVue''s low sales-culture and lead-flow
    scores create a low-confidence but relevant prompt to test go-to-market efficiency and internal management quality in later diligence.'
