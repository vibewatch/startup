- id: capital-stakeholders
  title: Capital formation, investors, and strategic stakeholders
  body: Feedzai's financing history shows a company that moved from venture-backed fraud analytics into a later-stage, strategically important financial infrastructure vendor. The public trail begins with a $17.5 million Series B in 2015, continues with a $50 million Series C in 2017, and then jumps to a $200 million KKR-led Series D in 2021 that placed the company well above a $1 billion valuation. The October 2025 financing round then pushed Feedzai above a $2 billion valuation and brought in a visibly Portuguese-heavy investor mix alongside renewed backing from existing supporters. For diligence, the more important point is not just round size. Feedzai's stakeholder map now includes legacy investors such as KKR, Sapphire Ventures, and Citi Ventures; new 2025 capital from Lince, Iberis, Explorer, Oxy, and Buenavista; a material public regulatory program with the ECB and PwC; and customer or partner proof points including Novobanco, Matrix USA, and Neterium. That combination suggests the
    company matters simultaneously as a venture-backed software asset, a regulated-finance infrastructure vendor, and an increasingly partnership-driven platform.
  claimRefs:
  - CO015
  - CO017
  - CO019
  - CO025
  - CO026
  - CO027
  - CO028
