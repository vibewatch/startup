- id: scale-disclosure-gaps
  title: Scale signals, operating momentum, and disclosure gaps
  body: 'Feedzai gives investors several meaningful public scale signals, but they do not all resolve into a clean underwriting snapshot. On the positive side, the company has publicly claimed positive free cash flow in FY2024, strong behavioral-biometrics growth, roughly one billion people protected, more than $6 trillion in transactions covered in FY2024, and about $9 trillion in annual payment risk assessed in its 2026 RiskFM and benchmarking materials. Those are useful signs of operating maturity and platform breadth, and they help explain why the ECB selection and 2025 funding round landed when they did. The biggest disclosure gaps are customer count and headcount. Public sources do not provide an exact installed-base number, and current headcount is especially messy: Nuno Sebastião''s current leadership page says Feedzai has close to 800 employees globally, while Unify''s April 2026 directory-style profile only captures a high-200s footprint across named functions and locations. That
    does not necessarily mean one source is wrong, but it does mean later financial and efficiency analysis should treat current headcount as unresolved until management supplies a clean internal roster.'
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO034
