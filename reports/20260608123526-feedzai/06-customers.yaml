- id: geography-verticals-and-channel-shape
  title: Geography, vertical, and channel shape
  body: |-
    Public references skew heavily toward banks and payment companies rather than retailers or other end markets,
                which is directionally consistent with Feedzai’s product positioning. Europe is well represented by Novobanco,
                Ibercaja, Standard Chartered’s cross-market onboarding program, and Unzer. Latin America is particularly deep,
                with Banco BV, BTG Pactual, Elo, and PayU showing strong banking, network, and acquirer adoption. North
                America is present through Jack Henry and Corecard, while Australia/New Zealand and the Caucasus show up via
                ANZ and TBC Bank. Channel shape matters alongside geography. Mastercard, Jack Henry, and Neterium show that
                Feedzai can reach end institutions through partner-distribution and embedded-product routes, not just direct
                enterprise sales. That is strategically valuable because it widens reach and can lower acquisition friction,
                but it also makes customer ownership and concentration harder to read from public evidence alone.
  claimRefs:
  - CU001
  - CU011
  - CU012
  - CU019
  - CU020
  - CU028
  - CU040
  - CU043
