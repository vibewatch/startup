company:
  name: Feedzai
chapter:
  number: 6
  title: Customers
  summary: |-
    Feedzai has credible, current public customer proof in banking and payments, with the best evidence concentrated in
                2024-2026 customer stories and partnership wins rather than a static logo wall. Novobanco, Jack Henry, Banco BV,
                Elo, PayU, Unzer, TBC Bank, Ibercaja, Standard Chartered, ANZ, BTG Pactual, and Corecard all provide public
                workflow or outcome detail; Mastercard and the ECB add flagship ecosystem wins. The customer story is strongest on
                named adoption and deployment depth, weaker on exact paying-customer counts, NRR/GRR, churn, contract duration,
                and top-customer concentration. Public evidence therefore supports real product-market fit with high switching-cost
                characteristics, but not a full underwriting case on renewal durability or concentration risk.
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: |-
    Feedzai’s public customer evidence is concentrated in regulated financial-services workflows where fraud, scams,
                onboarding risk, and AML can be treated as one operating problem rather than isolated tools. The clearest buyer
                groups are retail banks, commercial and corporate banks, payment networks, merchant acquirers, core-banking
                platforms, and financial-technology providers. In those accounts, the economic buyer is usually a fraud,
                payments, AML, product, or operational-risk executive; the day-to-day users are fraud analysts, investigators,
                underwriting teams, case managers, and data teams; and the payer is the bank, PSP, network, or platform owner
                funding the control stack. Feedzai’s official industry pages broaden the story beyond a pure card-fraud niche:
                the company explicitly sells across onboarding, scam prevention, behavioral biometrics, watchlist screening,
                AML, and real-time transaction monitoring. That makes the installed base strategically attractive because a bank
                or payment provider can start with one pain point and later expand into adjacent controls without changing the
                core vendor relationship.
  claimRefs:
  - CU001
  - CU002
  - CU040
  - CU047
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-flagship-wins
  title: Adoption trajectory and flagship wins from 2024 to 2026
  body: |-
    Feedzai discloses more scale proxies than it does customer denominators. The current public headline is 1
                billion consumers protected, $9 trillion in annual payment volume, and more than 1,000 U.S. financial
                institutions using a Feedzai risk score. The FY24 release used a lower but still material baseline—more than
                $6 trillion in payments at 3,000 transactions per second—showing that the scale story is directional rather
                than static. The most important 2024-2026 flagship wins are also a mix of new-logo and existing-account
                evidence: a disclosed $100 million multi-year upsell with a top-10 European bank in FY24, the 2025 Jack Henry
                and Mastercard distribution expansions, the ECB’s 2025 digital-euro fraud-prevention framework award, and the
                2026 Novobanco multi-year transformation. These data points support the thesis that Feedzai can win strategic,
                mission-critical accounts, but they still do not reveal the total number of paying customers or how concentrated
                ARR is across a handful of large institutions and partners.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU028
  - CU029
  - CU030
