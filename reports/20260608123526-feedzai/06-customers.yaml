- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Top-tier bank upsell motion
    - $100M disclosed upsell suggests few flagship accounts may matter disproportionately
    - Expansion is real, but concentration could be high if a handful of large banks dominate ARR
    - Request top-10 customer revenue share and renewal cliffs
  - - Novobanco land-and-expand
    - Fraud-to-AML expansion is promising but still one named flagship account
    - Shows multi-product attach potential in banks
    - Request module attach rates and expansion ARR by named bank cohort
  - - Elo multi-tenant issuer model
    - Value partly depends on downstream issuer participation and retention
    - Strong one-to-many distribution opportunity
    - Request downstream-issuer contract terms and churn by issuer
  - - Jack Henry and core-platform channels
    - Platform partners can own the end relationship and compress margin visibility
    - Broadens distribution into smaller financial institutions
    - Request direct-vs-partner bookings, margin share, and customer-ownership terms
  - - Mastercard scam-prevention channel
    - Powerful global route to market but could increase dependence on a few strategic partners
    - Accelerates consumer-fraud-risk adoption in A2A payments
    - Request pipeline conversion, exclusivity terms, and end-bank references
  - - Implementation complexity / on-prem gap
    - Complex deployments and support friction can slow procurement or create renewal risk
    - Could weaken support scores and elongate payback
    - Request median implementation cycle, services intensity, and on-prem-to-cloud migration data
  - - Bank-heavy proof set
    - Public evidence is much denser in banks and payments than in other verticals
    - Suggests concentrated vertical exposure even if TAM is broader
    - Request revenue by vertical, region, and institution type
  notes: These are diligence hypotheses grounded in public customer evidence. The upside is strong land-and-expand economics; the risk is that large banks and strategic partners may carry more of the revenue base than the public record reveals.
