- id: retention-review-signal-and-risk
  title: Retention, review signal, and customer risk
  body: |-
    Public durability evidence is supportive but incomplete. Gartner’s 2026 review base is small but useful: the
                average is 4.2, most ratings are four or five stars, and positive reviews repeatedly describe Feedzai as
                stable, scalable, and embedded in high-volume production environments. There are also real friction signals.
                One critical Gartner review says older on-premise deployments lag the cloud version and that support depth can
                disappoint in time-sensitive situations; a Capterra review asks for better dashboards, more automation, and a
                more fluid CaseManager. Those complaints do not amount to public churn evidence, but they do show where
                procurement and renewal diligence should focus. The larger issue is what the company does not disclose: NRR,
                GRR, churn, contract duration, top-customer concentration, and the exact number of global paying logos.
                Without those denominators, investors can confirm adoption breadth but cannot fully underwrite durability or
                concentration.
