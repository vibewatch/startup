figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Feedzai usually lands on a regulated-risk pain point, integrates deeply into workflows and data, proves measurable value, then expands across adjacent fraud, AML, and orchestration modules.
  data:
    items:
    - id: pain
      label: Pain appears
      actor: Fraud / payments / AML leader
      description: A bank, acquirer, or platform needs lower fraud loss, lower false positives, faster onboarding, or stronger AML controls.
      channels:
      - Direct enterprise sale
      - Partner referral
      - Regulatory or scam-pressure event
    - id: integrate
      label: Integrate data and controls
      actor: Risk and engineering teams
      description: Feedzai connects transaction data, behavioral signals, screening, rules, and workflows into the customer environment.
      channels:
      - APIs
      - Case manager
      - Behavioral biometrics
      - External-data orchestration
    - id: prove
      label: Prove production value
      actor: Analysts and product owners
      description: Customers report lower fraud loss, fewer false positives, better approval rates, or faster decisions in a live workflow.
      channels:
      - Transaction monitoring
      - Digital Trust
      - AML screening
      - Onboarding
    - id: expand
      label: Expand across use cases
      actor: Account sponsor plus adjacent teams
      description: Accounts add AML, screening, additional channels, more geographies, or downstream-institution coverage.
      channels:
      - Fraud to AML
      - Issuer multitenancy
      - Lending orchestration
      - Partner distribution
    - id: renew
      label: Renew or embed
      actor: Procurement and operating owner
      description: Deep workflow integration, custom rules, models, and partner channels increase embeddedness, but public retention metrics remain undisclosed.
      channels:
      - Multi-year transformation
      - Volume growth
      - Internal modeling expertise
  claimRefs:
  - CU001
  - CU008
  - CU010
  - CU041
  - CU043
  - CU047
