  evidenceGaps:
  - id: EGU001
    type: missing-source
    severity: blocking
    topic: Quantitative retention metrics are not publicly disclosed
    missingEvidence: Audited NRR, GRR, gross logo retention, churn, and renewal rates by year and segment.
    whyItMatters: Without retention math, public customer proof cannot be translated into durable revenue quality.
    diligencePath: Request audited retention bridges, gross and net retention by cohort, and logo churn reasons under NDA.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - id: EGU002
    type: missing-source
    severity: material
    topic: Exact global paying-customer count is undisclosed
    missingEvidence: A clean paying-customer denominator plus geography, segment, and product-line splits.
    whyItMatters: Scale proxies like >1,000 U.S. institutions using a risk score do not reveal paying-logo breadth or concentration.
    diligencePath: Request an account-level customer count and ARR split by region, institution type, and direct vs partner channel.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU002
    - TU001
  - id: EGU003
    type: missing-source
    severity: material
    topic: Top-customer and partner concentration are not public
    missingEvidence: Top-10 customer revenue share, top-partner bookings share, and renewal cliffs.
    whyItMatters: A few large banks or platform partners may carry disproportionate ARR, especially given the disclosed $100M upsell and partner-led routes.
    diligencePath: Request top-account concentration, partner-sourced ARR, and renewal schedules.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU006
  - id: EGU004
    type: enumeration-incomplete
    severity: material
    topic: Named customer proof table is intentionally partial
    missingEvidence: A full reconciled customer list across official case studies, partner references, and live production accounts.
    whyItMatters: Public case studies confirm real adoption but do not establish completeness or equal proof quality across the installed base.
    diligencePath: Request the full reference roster and reconcile it against Feedzai customer-story, FeaturedCustomers, and CaseStudies lists.
    relatedQuestionRefs:
    - QU005
    relatedTableRefs:
    - TU003
  - id: EGU005
    type: missing-source
    severity: material
    topic: No public retention cohort percentages exist to support a cohort figure
    missingEvidence: Time-bucketed retention percentages or cohort revenue curves by customer vintage.
    whyItMatters: Without cohort data, durability cannot be visualized as real retention curves and the planned cohort figure would be synthetic.
    diligencePath: Obtain cohort-level revenue and logo retention data under NDA before rendering a cohort exhibit.
    relatedQuestionRefs:
    - QU024
