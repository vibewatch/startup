- id: named-customer-proof-and-deployment-patterns
  title: Named customer proof and deployment patterns
  body: |-
    The strongest named proof combines a specific customer, a concrete workflow, and an operational outcome.
                Novobanco is the cleanest recent example because the evidence shows a real sequence: a 2023 digital-channel
                anti-fraud deployment, a 2025 expansion into unified fraud and AML, and a 2026 announcement framing Feedzai as
                the bank’s strategic platform partner. Jack Henry provides a different kind of proof: not one bank, but a
                core-banking and payments platform distributing Feedzai-powered controls to hundreds of downstream financial
                institutions. Banco BV, Elo, PayU, Unzer, TBC Bank, Ibercaja, ANZ, Standard Chartered, BTG Pactual, and
                Corecard add real breadth across Latin America, Europe, North America, Georgia, and Australia/New Zealand.
                What these cases share is implementation depth: custom rules, multitenant issuer models, behavioral-biometrics
                data, external-data orchestration, and expansion into adjacent workflows. That pattern matters because it is
                consistent with high switching costs even when the company does not disclose renewal cohorts.
