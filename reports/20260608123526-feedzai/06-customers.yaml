- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / public signal
  - Limitation
  rows:
  - - Novobanco
    - Portuguese retail/commercial bank
    - Digital Trust, transaction fraud, AML, watchlist screening
    - Production expansion
    - 2023 initial deployment expanded in 2025; 2026 multi-year transformation to unify fraud and AML
    - Operational metrics are directional; no commercial economics or renewal math disclosed
  - - Jack Henry
    - Core banking and payments platform
    - Financial Crimes Defender for downstream financial institutions
    - Production distribution platform
    - Hundreds of financial institutions reached; alert rates targeted below 1%
    - Proof is platform-level rather than one named downstream-bank deployment
  - - Banco BV
    - Brazilian digital bank
    - Onboarding, transaction monitoring, behavioral biometrics
    - Production
    - 80% cut in approval time; SLA improved from two hours to 30 minutes; lower false positives
    - Most metrics are company-published and not independently audited
  - - Elo
    - Brazilian card network / issuer hub
    - Multitenant issuer fraud platform and Pix-adjacent controls
    - Production migration
    - 35+ issuers migrated quickly; 90% fraud-basis-point reduction for one issuer; 100+ banks now on platform
    - Issuer-specific fraud benefit is only quantified for one issuer
  - - BTG Pactual
    - Brazilian private bank
    - Fraud controls for cards, Pix, and high-value clients
    - Production
    - Extremely low fraud with high approval rates and repeated Mastercard fraud-prevention awards
    - Specific fraud-loss numbers are not disclosed
  - - PayU
    - Global PSP / acquirer
    - Transaction fraud for acquirers and merchant portfolios
    - Production expansion
    - 50% cut in LATAM-based fraud across 450,000+ merchants
    - No merchant-retention or contract-economics disclosure
  - - Unzer
    - European merchant acquirer / payments group
    - Unified acquiring-risk operations across multiple entities
    - Production
    - Four-year relationship and 60% false-positive reduction
    - No ARR or logo-retention detail by acquired business line
  - - TBC Bank
    - Georgian retail bank
    - Digital Trust and agile RiskOps
    - Production
    - 65% of fraudulent sessions identified through Digital Trust
    - No baseline fraud-loss denominator disclosed
  - - Ibercaja
    - Spanish retail bank
    - Behavioral-biometrics-led Digital Trust
    - Production
    - 80% reduction in fraud losses while reducing customer friction
    - Result reflects Digital Trust plus adjacent controls, not necessarily Feedzai alone
  - - Standard Chartered Bank
    - Global retail bank
    - External-data orchestration for onboarding and credit decisioning
    - Production
    - More than 10 countries / markets, sub-15-minute decisions, hours-to-minutes servicing
    - Outcome is workflow efficiency rather than direct fraud-loss reduction
  - - ANZ Bank
    - Australian bank
    - Digital lending and external-data orchestration
    - Production
    - $150M incremental funding, 20-minute decisions, 24-hour full approval
    - Case is an orchestration workflow rather than core fraud-monitoring proof
  - - Corecard
    - Financial-technology platform
    - Transaction fraud controls for card programs
    - Production
    - 46% reduction in fraud-related declines and 64% attempted-fraud detection
    - Single-customer proof with limited implementation detail beyond the KPI set
  notes: Rows cover named public references retained in reviewed sources. Several are vendor-hosted case studies; they establish real deployment but should not be treated as a complete or fully independent customer roster.
  enumerationScope:
    coverage: partial
    basis: Verified against Feedzai customer-story pages plus independent case-study and review aggregators; only named accounts with a public workflow, title, or KPI were included.
