tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Retail banks
    - Buyer=fraud or digital-banking leader; users=fraud ops, risk teams; payer=bank
    - Onboarding, account takeover, scam prevention, transaction fraud, digital trust
    - Ibercaja, Novobanco, TBC, ANZ, Standard Chartered
    - Large recurring budgets tied to customer trust and payment throughput
    - No public ARR split or renewal data by bank tier
  - - Corporate / commercial banks
    - Buyer=AML, operations, or treasury-risk leader; users=screening and investigation teams; payer=bank
    - Watchlist screening, commercial-payment fraud, AML
    - Corporate-banking page plus Novobanco AML expansion
    - Higher-complexity workflows with cross-sell into AML and screening
    - Named commercial-bank roster remains thin
  - - Payment networks and issuing hubs
    - Buyer=product / fraud head; users=issuer-risk and ops teams; payer=network or hub
    - Issuer fraud controls, Pix / instant-payments protection, multitenant issuer management
    - Elo migrated 35+ issuers and now says 100+ banks use the platform
    - One-to-many distribution can create strong leverage and partner lock-in
    - Economics between Feedzai and downstream issuers are undisclosed
  - - Merchant acquirers / PSPs
    - Buyer=acquiring-risk leader; users=fraud analysts, dispute teams; payer=PSP/acquirer
    - Transaction fraud for merchants, chargebacks, underwriting, approvals optimization
    - PayU, Unzer, Trust Payments, merchant-acquirer case pages
    - High transaction-volume environments showcase scalability
    - Public churn and merchant-retention economics are missing
  - - Core banking / fintech platforms
    - Buyer=platform or payments executive; users=downstream FI risk teams; payer=platform owner and/or end institution
    - Embedded fraud and AML controls delivered through platform channels
    - Jack Henry and Corecard show platform-distribution motion
    - Can widen reach beyond direct enterprise sales
    - End-customer ownership and margin share are opaque
  - - Flagship strategic programs
    - Buyer=board-level or central-bank program sponsor; users=program, risk, and technology teams; payer=institution or public body
    - Fraud infrastructure for system-wide or market-wide payments programs
    - ECB digital-euro framework; Mastercard Consumer Fraud Risk rollout
    - Shows Feedzai can win mission-critical mandates
    - Some wins are framework or ecosystem wins, not fully deployed paying-production accounts yet
  notes: Segmentation blends institution type, channel route, and workflow because Feedzai publishes customer proof through all three lenses rather than a single customer-count taxonomy.
