  evidenceGaps:
  - type: missing-source
    severity: material
    topic: incident-transparency
    missingEvidence: A public or customer-shareable status history, SLO/SLA annex, RTO/RPO commitments, and last-24-month incident summary for Feedzai-hosted services.
    whyItMatters: Banks buying fraud infrastructure need resilience evidence; without incident and recovery disclosures, outage risk cannot be underwritten from public materials.
    diligencePath: Request the master services agreement SLO exhibit, last annual BCP/DR test results, and incident postmortems for the last 24 months.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-sales-cycle
    missingEvidence: Revenue by top customer, segment and geography; contract duration and renewal terms; pipeline conversion and pilot-to-production cycle times.
    whyItMatters: Macro and budget-cycle exposure depends on whether a small number of global banks dominate revenue and whether implementations regularly slip.
    diligencePath: Request top-10 customer ARR and bookings schedule, cohort renewal data, and median sales-cycle plus implementation-duration dashboards.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
    - TR004
  - type: missing-source
    severity: material
    topic: subprocessors-and-transfer-architecture
    missingEvidence: Named subprocessors, hosting-region map, transfer impact assessments, and customer-facing data-flow architecture by region.
    whyItMatters: Cross-border bank deployments can stall if data residency, transfer mechanisms, or subcontractor approvals are unresolved.
    diligencePath: Request the subprocessor register, SCC module mapping, regional hosting matrix, and latest transfer impact assessments used with bank customers.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: material
    topic: litigation-and-enforcement
    missingEvidence: Outside-counsel certificate, docket search results, and management representation letter covering threatened litigation, customer disputes, and regulatory correspondence.
    whyItMatters: The absence of a public dispute in reviewed materials is not proof of no exposure, especially for a company selling regulated risk infrastructure.
    diligencePath: Run PACER/CourtListener and local jurisdiction searches, and request outside-counsel and compliance attestations for open or threatened matters.
    relatedQuestionRefs:
    - QR006
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: model-validation-and-kpi-trend
    missingEvidence: Customer validation memos, bias-audit results, challenger-model reviews, and monthly false-positive or alert-volume trends for major deployments.
    whyItMatters: Responsible-AI commitments and research-stage model claims are only investment-grade if customers can validate them in production and regulators accept them.
    diligencePath: Request two recent bank model-validation packs, fairness testing outputs, and a 12-month KPI trend deck for false positives, manual-review rates, and alert precision.
    relatedQuestionRefs:
    - QR003
    - QR016
    relatedTableRefs:
    - TR002
    - TR005
