- id: mitigations-and-thesis-breakers
  title: Mitigations, Monitoring, and Thesis-Break Triggers
  body: Feedzai does have meaningful mitigants. Public legal and technical materials show the company has already invested in fairness tooling, explainability research, and human-oversight language that matches what regulated buyers want to hear. Customer case studies show a real orchestration layer rather than slideware, and the AWS Marketplace channel plus single-integration narrative can reduce some deployment friction. The capital raise also gives management time to keep building rather than optimize for short-term cash preservation. But none of these mitigants fully clears the chapter’s core risks. Investors still need proof that major bank customers validate the models, that transfer and outsourcing reviews do not repeatedly slow production go-lives, that AWS and data-partner concentration are contractually protected, and that competition is not winning on speed and price at the edge of the market. The thesis should be treated as intact only while Feedzai keeps converting complex programs
    into production without major privacy or resilience surprises. If diligence uncovers repeated approval delays, hidden customer concentration, weak incident disclosure, or research-stage model promises that lack validator acceptance, the risk-adjusted underwriting case deteriorates quickly.
