  title: Risk heatmap
  type: matrix
  layout: standard
  summary: Likelihood-by-risk-category matrix summarizing Feedzai’s most material public-source risks as of the run date.
  data:
    columns:
    - Regulatory / Legal
    - Operational / Implementation
    - Partner / Dependency
