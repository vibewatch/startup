- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Explainability and privacy approval drag
    - Customer validators, DPOs, or compliance teams require model redesign or regional transfer changes
    - Two strategic bank programs slip more than two quarters because of AI-governance or transfer-review objections
    - Cut revenue-conversion assumptions and require validator-ready documentation before underwriting further growth.
  - - Implementation throughput
    - Pilot-to-production timelines extend or rework volumes rise
    - Median enterprise implementation exceeds nine months or two lighthouse accounts miss public go-live targets
    - Treat services load as structural, not transitional, and lower margin expectations.
  - - AWS and data-provider concentration
    - Material outage, pricing change, or missing secondary-provider path appears
    - No multicloud or fallback answer is available for a top customer, or a key provider exits a region
    - Apply concentration discount and demand contractual protections or backup architecture.
  - - Competition and pricing pressure
    - Win rates or pricing compress against incumbents and API-first vendors
    - Average discounting widens materially or strategic losses cluster around faster-deployment rivals
    - Lower sales-efficiency assumptions and revisit positioning around platform breadth vs. speed.
  - - Capital and organizational execution
    - Bookings or customer expansion do not keep pace with post-raise spend
    - Burn re-accelerates without comparable production deployments, or key leadership turnover hits the roadmap
    - Reframe the case from scale-up compounding to execution repair and demand a milestone-based financing plan.
  notes: These kill criteria convert the chapter’s public evidence into monitorable triggers. Thresholds should be tightened or loosened once customer concentration and sales-cycle data are produced in diligence.
