    rows:
    - label: High Likelihood
      values:
      - Explainability and transfer reviews for bank AI use cases
      - Multi-country data integration and compliance certification
      - AWS plus outsourced-tech approval dependency
      - Enterprise budget and pilot slippage
      - Services-heavy scaling burden
      note: Risks already visible in public legal, customer, and market materials.
    - label: Medium Likelihood
      values:
      - Article 22 challenge or localization redesign
      - False-positive drift from stale rules or weak tail-latency control
      - External data-provider quality or regional approval issues
      - Price pressure from incumbents and API-first challengers
      - Research-stage model roadmap slippage
      note: Material if repeated across strategic accounts but not yet evidenced as systemic failures.
    - label: Low Likelihood
      values:
      - Public enforcement or litigation shock
      - Severe public incident despite no disclosed history
      - Channel or cloud concentration event without fallback
      - Capital shortfall after prior growth round
      - Senior leadership turnover without bench depth
      note: Tail events with high consequence if they occur.
