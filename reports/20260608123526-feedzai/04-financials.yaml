  rows:
  - - Transaction Fraud / Digital Trust
    - Real-time fraud scoring and decisioning for banks across payment channels and the customer lifecycle.
    - Public unit undisclosed; likely negotiated enterprise platform plus transaction-scope economics.
    - Active core module with named deployments at Wio, Novobanco, and CoreCard.
    - High – mission-critical control point tied to payment approval and loss prevention.
    - Provide contract minimums, renewal terms, and whether pricing keys off volume, accounts, or modules.
  - - AML Transaction Monitoring / Watchlist Screening
    - AI-assisted monitoring, alert prioritization, case management, and SAR/STR workflows for regulated institutions.
    - Public unit undisclosed; module or platform pricing not published.
    - Official pages emphasize lower compliance cost, 20+ out-of-the-box scenarios, and automated filings.
    - High – compliance workflows are sticky and often multi-year once embedded.
    - Break out AML module ARR, professional-services content, and regulator-specific add-on pricing.
  - - Orchestration / onboarding workflows
    - API-driven orchestration for account opening, digital lending, KYC/KYB, and external data workflows.
    - Public unit undisclosed; likely enterprise subscription plus implementation and data-workflow scope.
    - Feedzai markets this as a reusable automation layer, with ANZ citing 20-minute decisions and $150M incremental funding.
    - Medium-high – adjacent workflow revenue expands wallet share beyond pure fraud screening.
    - Show realized pricing, implementation fees, and percentage of deals sold with fraud or AML modules.
  - - Feedzai IQ network intelligence
    - Federated network intelligence add-on that improves fraud detection and payment acceptance using community signals.
    - Public unit undisclosed; likely premium add-on to existing platform contracts.
    - Official page claims immediate value, 4x more fraud detection, and 50% fewer alerts.
    - High – add-on economics can improve ACV without major deployment changes.
    - Disclose attach rate, uplift pricing, and margin profile of TrustScore / TrustSignals.
  - - Acquirer / PSP merchant-risk services
    - Fraud prevention, merchant monitoring, payout acceleration, and value-added services for acquirers and PSPs.
    - Tiered solutions by merchant need are marketed, but no public unit prices are disclosed.
    - Official page positions merchant risk and faster payouts as revenue-enhancing services.
    - Medium – could add platform revenue and deepen partner economics, but public pricing is absent.
    - Share merchant-tier packaging, take-up by segment, and any transaction-based monetization.
  - - Digital-euro framework opportunity
    - Framework agreement to provide central fraud detection and prevention scoring for digital-euro transactions.
    - 'Framework envelope disclosed publicly: €79.1M estimated value, €237.3M maximum value.'
    - Commercially significant but contingent; ECB says there is no payment at this stage.
    - Medium – potential public-sector program revenue, but not contracted recognized revenue yet.
    - Clarify expected service-request cadence, activation milestones, and revenue-recognition assumptions.
  notes: Rows distinguish public commercial evidence from private contract detail. Public unit pricing is undisclosed for all software modules except the digital-euro framework envelope, which is a contingent procurement capacity rather than a live paid subscription.
