callouts:
- calloutType: strength
  title: High-quality enterprise control point with measurable buyer ROI
  body: Feedzai sells into mission-critical fraud, AML, onboarding, and network-intelligence workflows where customer ROI is visible through lower false declines, faster approvals, lower alert burden, and revenue unlocked. That is a stronger monetization posture than discretionary analytics spend and supports cross-sell across adjacent controls.
  claimRefs:
  - CI006
  - CI010
  - CI011
  - CI012
  - CI013
  - CI043
  - CI045
- calloutType: risk
  title: Pricing opacity and support burden weaken public unit-economics confidence
  body: Independent reviews show that buyers see value in Feedzai, but also report costly workflow setup, complexity, and uneven support depth. Because public sources never move beyond quote-based pricing, there is no external way to test whether customer ROI translates into strong realized gross margin or efficient payback.
  claimRefs:
  - CI004
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
  - CI042
  - CI044
- calloutType: risk
  title: The ECB framework is strategic upside, not committed paid backlog
  body: Feedzai’s digital-euro selection is commercially important and the framework value could be meaningful, but ECB explicitly says framework agreements involve no payment at this stage. That means the framework should be treated as option value until service requests, work orders, and revenue-recognition treatment are documented.
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI041
- calloutType: recommendation
  title: Diligence should start with cash conversion, not TAM or customer logos
  body: 'The public story already establishes product relevance, customer quality, and fresh valuation support. The investment decision now hinges on private economics: ARR, module mix, services share, gross margin, NRR, CAC payback, current cash, burn, and the conversion path from framework capacity to live paid work.'
  claimRefs:
  - CI022
  - CI039
  - CI041
  - CI044
