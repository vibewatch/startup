  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-services-mix
    missingEvidence: Gross margin, hosting cost, professional-services share, and module-level contribution margin.
    whyItMatters: These metrics determine whether Feedzai behaves like a scalable software business or a services-assisted implementation business.
    diligencePath: Request product-line P&L and gross-margin bridge from management finance.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-discounts
    missingEvidence: Actual contract price points, minimum commitments, term lengths, discount waterfall, and implementation fee structure.
    whyItMatters: Public quote-based pricing is not enough to test pricing power, ACV, or payback assumptions.
    diligencePath: Request sample MSAs / order forms and the current price book with discount governance.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, board runway case, and any debt facilities or covenants.
    whyItMatters: Capital adequacy cannot be underwritten from valuation marks or framework wins without actual liquidity data.
    diligencePath: Request latest balance sheet, 13-week cash forecast, debt schedule, and downside plan.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: consolidated-statements
    missingEvidence: Audited consolidated income statement, cash flow statement, and legal-entity map linking contracts, cash, and costs.
    whyItMatters: Subsidiary statutory accounts do not reveal group solvency, profitability, or cash conversion.
    diligencePath: Request audited group accounts and a reconciled legal-entity / intercompany structure pack.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: digital-euro-conversion
    missingEvidence: Evidence showing when the digital-euro framework converts from ranked provider status into paid implementation work.
    whyItMatters: The framework is strategically important, but it should not be modeled as live revenue until conversion evidence appears.
    diligencePath: Request work-order schedule, milestone plan, and accounting treatment for framework activity.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-arr-disclosure
    missingEvidence: Current consolidated revenue / ARR, module mix, and customer concentration.
    whyItMatters: Without actual revenue scale, valuation support and financing dependency remain guesses.
    diligencePath: Request ARR bridge by product, geography, and top-customer concentration report.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
