- id: s5
  title: Underwriting gaps and financial verdict
  body: |-
    Feedzai's public evidence supports a positive view on revenue quality but not on full underwriteability. The company appears to sell mission-critical software into regulated buyers, can cross-sell across adjacent fraud and AML workflows, and uses network-scale data and customer-outcome proof to justify premium pricing. The fresh 2025 round and the ECB digital euro selection both reinforce strategic relevance. Independent review sources also show that buyers are willing to tolerate implementation complexity because the product addresses high-cost fraud and compliance problems.

    What is missing is every core investment-committee input needed to convert that narrative into a financial model. Public sources do not disclose consolidated revenue or ARR, module mix, services-versus-software revenue share, gross margin, net retention, CAC payback, cash balance, operating burn, runway, or profitability. Public pricing evidence stops at 'request a demo,' 'pricing available upon request,' and 'no pricing info.' Even the digital euro framework cannot close the gap because ECB says the framework creates no payment obligation at this stage.

    Financial verdict: Feedzai looks like a high-quality, enterprise, transaction-adjacent software asset with strong scale proxies and credible demand, but it is still impossible to underwrite on public information alone. The right base case is not that the company is weak; it is that the company is private. A diligence process should therefore focus first on audited or management-prepared financials, module-level revenue mix, realized pricing and discounting, professional-services burden, retention and cohort economics, current cash and burn, and the conversion path from digital-euro framework capacity to live paid work.
