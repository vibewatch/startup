chapter:
  number: 4
  title: Financials
  summary: Feedzai appears to monetize as quote-based enterprise software sold to banks, payment providers, acquirers, and public-sector buyers across transaction fraud, AML, onboarding, orchestration, and network-intelligence modules. Official and review sources confirm strong operating-scale and customer-ROI proxies plus fresh capital ($75M at a $2B valuation in October 2025), but they do not disclose revenue, ARR, gross margin, cash, burn, or runway. The ECB digital euro framework adds potentially material option value (€79.1M estimated / €237.3M maximum) yet ECB states there is no payment at this stage, so underwriting still depends on private financial statements and cohort economics.
sections:
- id: s1
  title: Revenue model, pricing posture, and transaction-linked economics
  body: |-
    Feedzai's public materials point to an enterprise software revenue model rather than a self-serve SaaS motion. The company sells an AI-native RiskOps platform to banks, payment service providers, acquirers, and now at least one public-sector infrastructure buyer. Product pages show separate commercial modules for Transaction Fraud, AML Transaction Monitoring, Secure Onboarding, Feedzai Orchestration, Feedzai IQ, and acquirer risk management, while customer references such as Wio Bank and Novobanco show multiple modules being deployed together. That combination supports a land-and-expand thesis: Feedzai can start with one control point and then upsell adjacent workflows across fraud, AML, onboarding, and network intelligence.

    Pricing posture is deliberately opaque. The reviewed official pages repeatedly route buyers to 'Request a Demo' rather than showing price cards, Software Advice says pricing is available only upon request, and GetApp says no pricing info is published while still classifying the product as subscription software. This is consistent with quote-based enterprise procurement where list price is less relevant than risk scope, transaction volumes, data integrations, and implementation complexity. Public evidence therefore supports custom enterprise contracts, but not a clean public price book or realized discount schedule.

    Public sources do, however, show the economic mechanism around transactions. Feedzai's Transaction Fraud page frames value in reduced false declines, faster approvals, and real-time decisioning across payment channels. Feedzai IQ monetizes shared network intelligence and claims better acceptance rates and fraud detection without workflow changes. Feedzai's digital euro press release is even more explicit: Feedzai says it would return a fraud-risk score for every transaction and that service requests would flow to the first-ranked provider under the framework agreement. That makes transaction-linked economics plausible, but the public record still does not disclose whether contracts are priced by annual platform fee, transaction band, alert volume, module count, services package, or some negotiated mix of those units.
