- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Instant-payment growth and 24x7 settlement
    - tailwind
    - current
    - More events clear in seconds, increasing demand for real-time detection and intervention
    - Ask what share of Feedzai deployments score or intervene before settlement on RTP/FedNow/SEPA instant flows
  - - APP scams and reimbursement economics
    - tailwind
    - current
    - Losses and reimbursement rules raise the cost of weak controls for banks and PSPs
    - Request customer case studies showing scam-loss reduction and reimbursement avoidance
  - - Risk-based AML modernization
    - tailwind
    - 2026+
    - FinCEN and EU-style reforms reward demonstrably effective controls and objective testing
    - Ask how Feedzai customers evidence effectiveness to regulators and internal audit
  - - FRAML convergence
    - tailwind
    - current
    - Shared data and shared workflows can remove duplicated operations and improve customer experience
    - Validate whether deployments actually merge fraud and AML teams or just share data layers
  - - AI-driven attack sophistication
    - tailwind
    - current
    - Institutions need predictive rather than purely reactive defenses
    - Request benchmark data on attack adaptation speed and model retraining cadence
  - - Data fragmentation and label quality
    - headwind
    - current
    - Poor data quality slows model lift and weakens explainability
    - Review required data sources, integration burden, and time-to-value by bank archetype
  - - Explainability, auditability, and model governance
    - headwind
    - current
    - AI adoption can stall if outputs cannot be justified to regulators and investigators
    - Ask for model-risk documentation, override controls, and audit artifacts
  - - Long procurement and specialist-operations burden
    - headwind
    - current
    - Banks need cross-functional sign-off and still require experienced investigators after go-live
    - Request sales-cycle, implementation, and staffing assumptions for comparable customers
  notes: Tailwinds and headwinds are evidence-backed but still require company-specific win-loss, implementation, and ROI data to quantify their exact effect on Feedzai growth.
