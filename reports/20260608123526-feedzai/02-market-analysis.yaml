company:
  name: Feedzai
chapter:
  number: 2
  title: Market Analysis
  summary: 'Feedzai participates in a financial-crime-prevention market whose public size depends almost entirely on category definition: broad fraud-detection publishers place the market near US$67-70B in 2026, while a much narrower financial-crime-and-fraud-management category sits near US$1-2B. The more decision-useful view for diligence is the bank-and-payments slice between those poles, where demand is being accelerated by instant-payment growth, APP scams, risk-based AML reform, and AI-driven attacks but constrained by fragmented data, explainability, and long integration cycles.'
sections:
- id: market-boundary-and-category
  title: Market Boundary and Category
  body: 'Feedzai should be analyzed inside the bank and payments financial-crime stack, not inside a generic “AI for finance” bucket. Its own positioning is specific: the company sells fraud, scam, identity, and AML controls to global banks and emerging fintechs, and its 2026 benchmarking launch was framed for financial institutions benchmarking digital-payment fraud performance. That means the included spend is software and operating infrastructure used to detect suspicious transactions, score fraud and scam risk in real time, manage alerts and investigations, and connect fraud and AML workflows across payment, onboarding, and transaction-monitoring surfaces. The market boundary should exclude unrelated core-banking software, generic cybersecurity, consulting-only services, and broader financial-software categories that do not directly perform financial-crime decisioning. Status-quo substitutes are still powerful: batch transaction monitoring, rules-only point tools, fragmented fraud and
    AML teams, and manual investigator workflows inside banks. Research and Markets, Feedzai, and AFP together suggest that the relevant buyer universe is a regulated institution or payment operator with explicit accountability for payments risk, fraud controls, AML outcomes, or financial-crime governance rather than a generic corporate IT department.'
  claimRefs:
  - CM001
  - CM002
  - CM007
  - CM009
  - CM016
  - CM027
  - CM058
  tableRefs:
  - TM001
- id: sizing-lenses-and-contradictions
  title: Sizing Lenses and Contradictions
  body: 'No single public TAM maps neatly to Feedzai. Broad fraud-detection-and-prevention publishers such as Mordor and Fortune place the market at roughly US$67-70B in 2026, but those estimates span many industries and include adjacent functions such as authentication and governance tooling. At the other extreme, Expert Market Research values a much narrower financial-crime-and-fraud-management-solutions category at only US$1.37B in 2025, growing at 5.7% CAGR. The spread is too wide to average away; it is evidence that publishers are measuring different things. A more useful middle lens comes from Mordor’s vertical and customer splits: BFSI accounted for 26.15% of 2025 spend and large enterprises for 56.64%, implying a roughly US$14.6B BFSI slice and a roughly US$8.3B large-enterprise BFSI slice before narrowing further to bank-and-payments fraud and AML workflows. Two operational lenses reinforce that the need is real even when software TAM is fuzzy: ACI says real-time payments reached
    266.2B transactions in 2023, while Nasdaq Verafin estimates US$4.4T of illicit financial activity and US$579.4B of fraud losses in 2025. The market is therefore clearly multi-billion-dollar, but exact SAM and SOM remain evidence-constrained because public sources rarely isolate bank-and-payments transaction-monitoring, scam, and FRAML spend with compatible methodology.'
  claimRefs:
