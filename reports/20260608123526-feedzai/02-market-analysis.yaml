- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'The buying center for Feedzai-like platforms is cross-functional by design. Feedzai’s own materials speak to banks, fintechs, payment networks, and acquirers, while DataVisor, SEON, Moody’s, AFP, and McKinsey all describe organizations where fraud, AML, risk, payments, treasury, finance, audit, and executive governance intersect. In practice, the executive sponsor is usually a chief risk officer, head of fraud, head of AML/compliance, or payments leader facing a clear pain point such as APP scams, higher real-time-payment velocity, or regulatory pressure to prove effectiveness. Day-to-day users are a different group: investigators, case managers, fraud analysts, AML analysts, transaction-monitoring teams, and data or model specialists who tune controls and route alerts. Payer logic varies by workload. Pure fraud and scam projects often sit in fraud, payments, or risk budgets; transaction-monitoring and SAR-efficiency projects often sit in AML/compliance budgets; enterprisewide FRAML
    programs increasingly require shared funding because the institution is solving for data fragmentation, customer friction, and duplicated operations at once. Survey evidence also suggests automation does not eliminate headcount. Rather, AI is being adopted to reduce false positives, accelerate investigations, and improve decision quality while institutions continue hiring specialized staff.'
