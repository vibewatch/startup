    - Chief risk / fraud / AML / payments sponsors
    - Core Feedzai-relevant category
  - - Real-time fraud and scam prevention
    - Transaction scoring, behavioral signals, mule and APP controls, alert routing
    - Static cybersecurity controls and post-event reporting only
    - Fraud or payments risk budget
    - High relevance as instant-payment usage grows
  - - AML transaction monitoring and investigation
    - Monitoring scenarios, suspicious-activity detection, case investigation, SAR workflow support
    - Manual spreadsheet review or stand-alone policy consulting
    - AML / compliance budget
    - High relevance because Feedzai markets AML efficiency
  - - FRAML / unified financial-crime operations
    - Shared data, shared models, shared investigators, cross-workflow orchestration
    - Separate fraud and AML silos with duplicated tooling
    - Cross-functional risk/compliance/program budget
    - Increasingly relevant because surveys and regulators push unification
  - - Adjacent payment-infrastructure growth
    - FedNow, RTP, SCT Inst, Faster Payments, payment-network use cases
    - Pure payment switching economics or interchange revenue
    - Payments / treasury / infrastructure leadership
    - Important driver of demand, not the software category itself
  - - 'Status-quo substitute: legacy in-house and rules-only stacks'
    - Batch monitoring, rule tuning, manual review, fragmented case handling
    - Modern unified AI-native orchestration
    - Existing operational budgets inside banks
    - Main incumbent alternative slowing replacement cycles
