  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-contradiction
    missingEvidence: A bank-and-payments-specific market study that separates fraud, scam, AML, and adjacent authentication/governance spend with transparent methodology.
    whyItMatters: Without a consistent taxonomy, published TAM figures vary by more than an order of magnitude and cannot be blended into one clean Feedzai market number.
    diligencePath: Request sell-side or management materials that segment revenue opportunity by bank type, workflow, and geography; reconcile them against at least one independent analyst taxonomy.
    relatedQuestionRefs:
    - QM008
    - QM009
    - QM010
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: feedzai-sam-som
    missingEvidence: Customer-count, ACV, pipeline, win-rate, and segment-mix data specific to Feedzai’s target bank and payment-firm base.
    whyItMatters: Public sources can show category demand but cannot isolate Feedzai’s reachable SAM or current SOM with enough precision for valuation work.
    diligencePath: Request management cohort data by bank tier, geography, and workload plus pipeline conversion assumptions used in the company’s planning model.
    relatedQuestionRefs:
    - QM010
    - QM025
  - type: missing-source
    severity: material
    topic: procurement-cycles
    missingEvidence: Comparable public evidence on sales-cycle length, implementation timelines, and change-management burden for large-bank FRAML replacements.
    whyItMatters: Adoption timing determines revenue ramp and integration risk, but public sources mostly describe pain points rather than actual deployment duration.
    diligencePath: Ask for signed implementation plans, time-to-value metrics, reference calls, and win-loss analysis against incumbent or in-house alternatives.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: benchmark-methodology
    missingEvidence: A public methods appendix for Feedzai’s VDR/FPR benchmark explaining sample composition, bank tiers, and exact normalization logic.
    whyItMatters: The benchmark is useful directional evidence, but without fuller methodology it should not be treated as a fully independent market-performance dataset.
    diligencePath: Request the underlying benchmark methodology deck or peer-normalization memo during management diligence.
    relatedQuestionRefs:
    - QM023
    - QM025
