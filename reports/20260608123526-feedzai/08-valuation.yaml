- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and revenue bridge
    - Current ARR, recognized revenue, and growth by product, geography, and customer cohort
    - Without the denominator, the $2B headline cannot be placed inside the comp range with confidence.
    - CFO data room and audited or reviewed financial statements.
  - - Gross margin and model-cost burden
    - Gross margin, cloud spend, model-inference cost, and services mix
    - Premium multiples require evidence that economics can scale attractively rather than merely grow.
    - Finance diligence and infrastructure-cost review.
  - - NRR, GRR, and concentration
    - Renewal quality, cohort retention, and exposure to top banks or public-sector contracts
    - A premium risk-ops multiple is supported by durable revenue quality, not only logo prestige.
    - Revenue-operations diligence plus customer reference calls.
  - - 2025 round economics
    - Liquidation preferences, ratchets, secondaries, option-pool changes, and any structured terms
    - Headline valuation may overstate the economic entry price for new capital.
    - Legal diligence on financing documents and cap table.
  - - Digital euro conversion assumptions
    - Implementation milestones, recognition timing, pricing, and exclusivity scope
    - Strategic narrative is strong, but framework optionality should not be capitalised as committed revenue.
    - Commercial and legal review of ECB project assumptions.
  - - Segment mix and product proof
    - Revenue split across fraud, AML, orchestration, public sector, and acquired capabilities like Demyst
    - Comp selection depends on what Feedzai actually is economically, not just what it says it can do.
    - Management segmentation package and product P&L review.
  notes: If these asks cannot be answered credibly, the correct action is not to force precision but to keep the call at research-more or demand a lower price.
