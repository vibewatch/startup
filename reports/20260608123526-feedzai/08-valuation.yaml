- id: S802
  title: Financing context, dilution, and price support gap
  body: 'The October 2025 Series E put a clear headline on the table: roughly $75 million raised at a $2 billion post-money valuation. Publicly, that looks like a relatively low-dilution financing event. If the cash was entirely primary, the math implies only about 3.75% dilution and a pre-money value of roughly $1.925 billion. That is useful because it says investors were willing to move the mark higher without a giant recap. But it is not enough to underwrite the economics. Tracxn shows seven rounds and $347 million of cumulative funding, while PitchBook’s public page is not openly accessible. That combination matters because low visible dilution in the latest round does not eliminate preference-stack risk, secondaries, or option-pool overhang from prior rounds. The burden of proof still sits with private diligence, not with the headline post-money figure itself.'
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV005
  - CV006
  - CV009
  - CV021
  - CV048
  figureRefs:
  - FV002
- id: S803
  title: Comparable public and transaction lenses
  body: 'The comp set points in two very different directions. Public trading comps such as NICE, Riskified, and ACI sit around roughly 1.85x-2.5x revenue, which is the kind of math that forces very large undisclosed revenue assumptions to defend a $2 billion mark. FICO is the premium public outlier at about 11.7x, but it earns that with evidence-backed software ARR growth and filing-grade retention disclosure. Verafin is the best strategic transaction lens because Nasdaq paid $2.75 billion on an implied 19.5x revenue multiple while also disclosing roughly 30% ARR CAGR and more than $140 million of revenue. Windsor Drake’s 2026 work reconciles those endpoints: median public regtech has reset to about 3x-6x revenue, while only scarce AI-native or strategically critical assets still command 8x-15x or better. Feedzai may belong closer to that premium band, but the public record does not yet prove it.'
