sections:
- id: S801
  title: Investment thesis and anti-thesis
  body: 'The positive case for Feedzai is straightforward. It is no longer just a narrow fraud-point solution: public materials show a broader RiskOps platform spanning fraud, AML, onboarding, and now data orchestration through Demyst. The company also has credible strategic signals that many private fintechs do not have, including positive free cash flow messaging, a record large-bank upsell, a multi-million ARR public-sector deal, and the ECB digital-euro framework award. The anti-thesis is just as clear. None of those signals answers the core valuation question because Feedzai still does not disclose current ARR, recognized revenue, gross margin, retention, or cap-table economics. In other words, the public case for the company is stronger than the public case for the price. That makes this a valuation-support problem, not a product-relevance problem.'
