  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: ARR and revenue bridge
    missingEvidence: Current ARR, GAAP revenue, growth by product and customer cohort, and the reconciliation between bookings, ARR, and recognized revenue.
    whyItMatters: The public record cannot tell whether Feedzai deserves a median regtech multiple, a premium fraud multiple, or something closer to the Verafin/FICO tier without a real denominator.
    diligencePath: Request CFO and board-level revenue bridge plus audited or reviewed financial statements under NDA.
    relatedQuestionRefs:
    - QV004
    - QV020
    - QV023
    - QV026
  - type: private-evidence-only
    severity: material
    topic: Cap table and preference stack
