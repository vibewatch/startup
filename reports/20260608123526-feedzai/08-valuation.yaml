- id: S804
  title: Scenario underwriting and entry discipline
  body: Because current ARR and revenue are undisclosed, the scenario framework must be built around thresholds rather than fake precision. The right public-data question is not “what is Feedzai worth to the last dollar today?” but “what revenue and quality level would the business need to justify this price under realistic multiples?” That lens is useful because it reveals how price-sensitive the thesis is. At 12x revenue, the current mark needs only about $167 million of revenue support; at 8x it needs about $250 million; at 6x it needs about $333 million; and at 3x it needs about $667 million. Those are not predictions of current scale. They are underwriting hurdles. If private diligence shows Feedzai closer to Verafin or FICO on growth, retention, and margin quality, the price can work. If it looks more like ordinary regtech or mature fraud workflow software, the price does not.
  claimRefs:
  - CV001
