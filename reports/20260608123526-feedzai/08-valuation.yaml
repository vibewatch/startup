- id: S805
  title: Recommendation, exit readiness, and final diligence asks
  body: 'The right public-data recommendation is research-more. Feedzai has enough strategic quality to stay on the agenda: the fraud and financial-crime market is large, adoption remains strong, AI investment is active, and the company has visible product and contract momentum. What is missing is the evidence that turns a credible company into a defendable entry price. Exit readiness is also mixed. The company could plausibly matter to strategics or public-market investors, but public comps and disclosed transactions show that premium pricing requires much more financial transparency than Feedzai currently offers. The highest-leverage diligence asks are therefore simple: obtain the full ARR and revenue bridge, inspect gross margin and NRR, understand the preference stack, and quantify what the digital-euro framework could actually convert into recognized revenue. Until those are known, the current mark should be treated as plausible but not yet proven.'
