- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Private ARR / revenue materially below threshold
    - Data room shows revenue far below what even 6x-8x public support would require
    - The current mark shifts from premium to stretched or expensive immediately.
    - Do not invest at the existing price.
  - - Digital-euro monetisation slips or shrinks
    - Framework does not convert into meaningful contracted revenue or timing slips materially
    - A major strategic premium argument weakens and optionality should be discounted.
    - Cut bull-case probability and re-underwrite closer to public comp bands.
  - - Preference stack is investor-unfriendly
    - Liquidation preferences, ratchets, or secondaries make the headline post-money misleading
    - Real economics to new money become worse than the headline valuation suggests.
    - Pause until terms improve or price resets.
  - - Public / private fraud multiples stay in reset mode
    - Market remains closer to 3x-6x than 8x-15x
    - The company would need far more revenue scale to justify the current mark.
    - Demand more revenue proof or lower price.
  - - Execution quality proves ordinary rather than premium
    - Gross margin, NRR, or customer concentration are materially weaker than premium software norms
    - Feedzai stops looking like FICO/Verafin and looks more like a standard regtech workflow provider.
    - Base case becomes bear case.
  notes: 'These are valuation triggers, not generic operating risks: each one explains how the thesis would transmit directly into the price investors should or should not pay.'
