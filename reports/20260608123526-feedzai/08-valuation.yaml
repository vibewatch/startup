company:
  name: Feedzai
chapter:
  number: 8
  title: Valuation
  summary: 'Feedzai’s October 2025 $75 million Series E at a $2 billion post-money valuation proves real investor support and strategic momentum around digital-euro and platform-breadth narratives, but the public valuation bridge is still incomplete because the company does not disclose company-wide ARR, revenue, gross margin, retention, or cap-table terms. Public and transaction references span roughly 1.85x-2.5x revenue for NICE, Riskified, and ACI, about 11.7x for FICO, and 19.5x for Nasdaq’s Verafin deal, so the current mark is defendable only if private diligence shows Feedzai belongs much closer to the premium end of the band than public evidence can currently prove. Recommendation: research-more with strict price discipline and scenario underwriting framed around required revenue thresholds rather than assumed current ARR.'
