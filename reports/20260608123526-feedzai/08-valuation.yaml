- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Rationale
  rows:
  - - Recommendation
    - research-more
    - The business looks strategically relevant, but undisclosed ARR, revenue, NRR, and cap-table terms make the $2B mark impossible to underwrite cleanly from public evidence alone.
  - - Confidence
    - medium
    - There is enough evidence to say the asset is real and the price is not obviously absurd, but not enough to say the price is safe.
  - - Risk rating
    - high
    - The main risk is denominator and preference-stack opacity rather than lack of product relevance.
  - - Valuation stance
    - stretched
    - Median regtech/public fraud comps sit far below premium transaction outliers, and Feedzai has not disclosed the metrics needed to claim the outlier tier.
  - - Decision implication
    - Stay engaged, but do not accept the headline mark without data-room proof on revenue quality and economic terms.
    - The gating issue is missing financial proof and term clarity rather than weak product relevance.
  notes: 'The recommendation is explicitly price-sensitive and evidence-sensitive: stronger private metrics or better terms could move the call more than additional product narrative.'
