  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Feedzai（标的）
        - 最新私募轮
        - $75M Series E 轮，对应 $2.0B 投后估值
        - 当前入场价格的直接参照。
        - 未披露 ARR / 收入、毛利率或留存，无法把对外估值换算成倍数。
      - - FICO
        - 市值 / TTM 收入
        - 基于 $26.37B 市值和 $2.25B 收入，约 11.7x 收入
        - 最好的溢价上市软件可比对象，ARR 和留存证据有真实监管文件支撑。
        - 信用分析和评分业务组合比 Feedzai 更宽、更成熟。
      - - ACI Worldwide
        - 市值 / TTM 收入
        - 基于 $4.35B 市值和 $1.75B 收入，约 2.5x 收入
        - 带有可见盈利改善趋势的支付与欺诈工作流参考对象。
        - 支付基础设施组合更成熟，增长画像低于溢价反欺诈资产。
      - - Riskified
        - 市值 / TTM 收入
        - 基于 $0.68B 市值和 $0.33B 收入，约 2.1x 收入
        - 直接的上市欺诈软件可比对象，可观察市场如何给更窄的欺诈厂商定价。
        - 电商欺诈聚焦范围窄于 Feedzai 的银行、AML 和公共部门足迹。
      - - NICE
        - 市值 / TTM 收入
        - 基于 $5.44B 市值和 $2.94B 收入，约 1.85x 收入
        - 大型金融犯罪工作流软件的低端基准有参考价值。
        - 大型联络中心业务组合和不同增长画像，使其不是完美的纯业务可比对象。
      - - Nasdaq / Verafin
        - 战略交易价值 / 预期收入
        - $2.75B 交易和约 19.5x 隐含收入倍数
        - 最有参考价值的已披露反金融犯罪交易可比对象，显示溢价战略结果可以有多贵。
        - 2020 年历史交易，市场窗口不同；Verafin 的收入、ARR 增长和客户证据更明确。
      - - Visa / Featurespace
        - 战略收购状态
        - 已抓取来源未公开披露交易价值
        - 验证市场对 AI 驱动欺诈决策资产仍有战略需求。
        - 未披露价格，只能作方向参考，不能做算术依据。
    notes: 覆盖范围不完整：本表纳入本次抓取中对决策最有用的上市交易可比对象和已披露战略金融犯罪交易，但排除价格仍在付费墙后或未说明的私有同行估值。
