  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入桥
        - 当前 ARR、确认收入，以及按产品、地区和客户队列拆分的增长
        - 没有分母，就无法有把握地把 $2B 头部估值放进可比区间。
        - CFO 数据室，以及经审计或审阅的财务报表。
      - - 毛利率和模型成本负担
        - 毛利率、云支出、模型推理成本和服务组合
        - 溢价倍数需要证据证明经济性能够有吸引力地规模化，而不只是增长。
        - 财务尽调和基础设施成本审查。
      - - NRR、GRR 和集中度
        - 续约质量、队列留存，以及对头部银行或公共部门合同的暴露
        - 溢价 RiskOps 倍数靠持久收入质量支撑，不只是知名客户光环。
        - 收入运营尽调加客户访谈。
      - - 2025 年融资轮经济性
        - 清算优先权、反稀释棘轮、老股交易、期权池变化和任何结构化条款
        - 头部估值可能高估新资本的经济入场价格。
        - 围绕融资文件和股权结构表做法律尽调。
      - - 数字欧元转化假设
        - 实施里程碑、收入确认时间、定价和排他范围
        - 战略叙事很强，但框架期权不应按已承诺收入资本化。
        - 对 ECB 项目假设做商业和法律审查。
      - - 细分市场组合和产品证明
        - 欺诈、AML、编排、公共部门以及 Demyst 等收购能力之间的收入拆分
        - 可比对象选择取决于 Feedzai 在经济实质上是什么，而不只是它声称能做什么。
        - 管理层细分包和产品 P&L 审查。
    notes: 如果这些问题无法可信回答，正确动作不是强行追求精确，而是把结论维持在继续研究，或要求更低价格。
