        title: 里程碑、平台扩张与需带入后续的反向信号
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的里程碑记录足以为报告后续部分建立可复用时间线。公司 2011 年起于葡萄牙，2015 年和 2017 年拿到有意义的风险融资，并在 2021 年 KKR 领投下跨过独角兽门槛。当前尽调最需要关注
              2025-2026 年序列：纽约美国总部开业，收购 Demyst 以补充数据编排，2025 年 10 月融资与数字欧元入选并行，随后围绕 Matrix USA、Neterium、RiskFM、Novobanco
              和 State of Fraud Performance 基准发布 2026 年产品与伙伴动作。这些事件支撑一个判断：Feedzai
              正从单点欺诈预防，扩展为覆盖欺诈、AML、筛查、编排和生态分发的更宽平台。反向信号更细，但仍真实存在。董事会披露稀疏，精确客户数和员工数未解决；RepVue
              对销售文化和线索流的低评分，可信度不高，但足以提示后续尽调测试 GTM 效率和内部管理质量。
