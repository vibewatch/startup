        - 把服务负载视为结构性而非过渡性，并下调利润率预期。
      - - AWS 和数据提供商集中度
        - 出现重大宕机、定价变化，或缺少第二提供商路径
        - 对头部客户拿不出多云或备援方案，或关键提供商退出某个区域
        - 计入集中度折价，并要求合同保护或备份架构。
