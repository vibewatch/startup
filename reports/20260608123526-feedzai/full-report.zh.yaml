  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Feedzai 在市场相关性和战略定位上得分较高，但公开证据充分性和当前价格支撑较弱。
    data:
      items:
        - label: 市场
          score: 8
          detail: 市场大且在增长，欺诈、AML 和诈骗带来持续顺风。
          tone: positive
        - label: 产品 / 证据
          score: 7
          detail: Demyst 覆盖广度、大型银行客户斩获和数字欧元入选都有帮助。
          tone: positive
        - label: 护城河
          score: 7
          detail: 切换成本和数据网络逻辑真实存在，但公开渠道尚未完全量化。
          tone: positive
        - label: 经济性可见度
          score: 3
          detail: 正现金流信号有帮助，但当前 ARR、收入、毛利率和 NRR 均未披露。
          tone: warning
        - label: 估值支撑
          score: 3
          detail: $2B 估值可以合理，但前提是私有指标显示 Feedzai 更接近高溢价可比公司，而不是中位区间。
          tone: warning
        - label: 资本结构清晰度
          score: 2
          detail: 优先股堆叠和 2025 年轮次经济条款仍未公开。
          tone: negative
        - label: 证据质量
          score: 4
          detail: 公开证据足以建立纪律框架，但不足以完成承销判断。
          tone: warning
    approximationNotes: 评分是 0-10 的序数型投资判断，锚定引用的公开证据，而不是管理层提供的私有 KPI 包。
