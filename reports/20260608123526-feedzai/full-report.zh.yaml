  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价姿态与交易挂钩经济模型
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的公开材料更指向企业软件收入模式，而不是自助式 SaaS 销售。公司向银行、支付服务商、收单机构，以及现在至少一个公共部门基础设施买家，销售 AI 原生 RiskOps 平台。产品页面显示了
              Transaction Fraud、AML Transaction Monitoring、Secure Onboarding、Feedzai Orchestration、Feedzai IQ
              和收单风险管理等独立商业模块；Wio Bank 和 Novobanco 等客户引用则显示多个模块会一起部署。这组组合支持一个先落地再扩张的投资逻辑：Feedzai
              可以从一个控制点切入，再向欺诈、AML、开户和网络智能等相邻工作流增售。


              定价姿态是有意不透明。已审阅官方页面反复把买家导向“请求演示”，而不是展示价格表；Software Advice 称价格只能按需提供，GetApp
              称没有公布价格信息，同时仍把产品归为订阅软件。这符合按报价成交的企业采购：标价不如风险范围、交易量、数据集成和实施复杂度重要。因此，公开证据支持定制企业合同，但不支持一个干净的公开价目表或已实现折扣表。


              不过，公开来源确实展示了围绕交易的经济机制。Feedzai 的 Transaction Fraud 页面把价值表述为减少误拒、更快批准，以及跨支付渠道的实时决策。Feedzai IQ
              将共享网络智能变现，并声称无需改变工作流即可提升接受率和欺诈检测。Feedzai 的数字欧元新闻稿更明确：Feedzai
              称会为每笔交易返回欺诈风险评分，服务请求会按框架协议流向排名第一的供应商。这让交易挂钩经济模型变得合理，但公开记录仍没有披露合同究竟按年度平台费、交易区间、告警量、模块数量、服务包，还是这些单位的某种协商组合定价。
