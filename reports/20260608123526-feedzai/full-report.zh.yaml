        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的正向逻辑很直接。它不再只是一个狭窄的欺诈单点方案：公开材料显示，更宽的 RiskOps 平台已经覆盖欺诈、AML、开户，并通过 Demyst
              进入数据编排。公司也有许多私有金融科技公司没有的可信战略信号，包括正自由现金流表述、创纪录的大银行增购、数百万 ARR 公共部门合同，以及 ECB
              数字欧元框架授标。反向逻辑同样清楚。这些信号都没有回答核心估值问题，因为 Feedzai 仍不披露当前
              ARR、确认收入、毛利率、留存或股权结构经济性。换句话说，公司本身的公开论据强于价格的公开论据。因此，这是估值支撑问题，不是产品相关性问题。
