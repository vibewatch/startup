  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: RiskOps 定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              相比许多老牌反欺诈厂商，Feedzai 现在呈现出清晰得多的平台故事：公司已把产品矩阵重组到单一 RiskOps 旗帜下，明确把 Identity、Fraud 和 AML
              贯穿整个客户生命周期。关键尽调点不只是这些模块存在，而是公开图谱可读。Identity 覆盖开户、Digital Trust、新账户欺诈和账户监测；Fraud 覆盖交易欺诈、诈骗预防和收单风险；AML
              覆盖观察名单筛查和交易监测。这个模块结构让人更容易理解，Feedzai 认为开户风险、会话风险、支付欺诈、制裁和合规控制以及调查员工作流之间的边界在哪里。


              工作流叙事也能串起来。Feedzai 从开户和身份信号开始，延伸到连续会话监测和交易决策，再把这些信号带入 AML 调查和案件管理。平台页面反复强调单一协作体验和共享数据视图，而不是分开的欺诈、身份和 AML
              控制台。这在战略上重要，因为统一风险运营是 Feedzai 相对点产品和割裂遗留技术栈的核心卖点。


              仍有一个尽调保留项。公开模块图谱现在宽且连贯，但精确商业包装、附加率和逐模块部署深度仍未披露。投资者可以理解这些模块应该做什么；但仅凭公开材料，仍无法判断客户多常购买整套技术栈，而不是只买狭窄切片。
