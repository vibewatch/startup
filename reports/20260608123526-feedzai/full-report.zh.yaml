  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与模型治理风险
        blocks:
          - type: paragraph
            body: >-
              Feedzai 最清晰的头号风险不是已经公开坐实的执法行动，而是向银行销售 AI 驱动风险工具所背负的累积治理负担。公司的隐私和 DPA
              材料显示，它可能同时扮演控制者和处理者角色，可能接触客户终端用户数据，并已考虑 SCC 和英国附录等欧盟、英国传输机制。同时，Feedzai 的伦理 AI 和负责任 AI
              材料明确营销可解释性、偏见缓释、公平性工具和人工监督，因为受监管金融用例越来越需要这些控制。外部指引也强化了这一点：NIST 把可信度纳入 AI 生命周期管理；ICO
              指引要求某些自动化决策提供信息、申诉权和人工干预；英国或欧盟外包规则把云风险基础设施视为受治理的供应商关系，而不是简单软件采购。也就是说，商业风险有两层：Feedzai
              必须让产品保持可解释和隐私合规，客户也必须向自己的验证方和监管机构证明部署安全。已审阅的公开材料没有披露公开子处理方名单、事故历史或诉讼登记，因此尽调负担仍显著高于网站本身能消化的程度。
