      - number: '2.4'
        title: 驱动因素、监管与约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑很强，因为市场驱动是结构性的，不是周期性的。实时支付采用持续扩大，监管正从勾选式合规转向有效性，AI 既成了攻击加速器，也成了检测要求。FinCEN 2026 年 4 月提案强调基于风险的 AML/CFT
              项目、有效性和客观独立测试；EBA 称即时支付的欺诈率显著高于传统贷记转账；英国 PSR 已把偿付经济性绑定到 APP 诈骗；FedNow 则以 24x7x365
              结算和可选欺诈预防功能推出。与此同时，ACI、ACAMS、Mastercard、KYC Hub 和 NICE Actimize
              都描述了同一个运营后果：检测、质疑和调查可疑活动的窗口正在变窄。但采用仍然困难。DataVisor 和 McKinsey 强调碎片化、数据质量差和昂贵的人工运营模式；KYC Hub 和 NICE
              强调可解释性、治理和专业调查员；Moody’s 指出互操作性和统一风险架构是前提；Mastercard 则认为，网络安全与欺诈情报之间的领导层对齐，已经是控制栈本身的一部分。对 Feedzai
              来说，市场顺风真实存在，但取胜取决于能否证明可衡量 ROI、处理受监管部署复杂度，并嵌入漫长的银行采购和集成周期。
