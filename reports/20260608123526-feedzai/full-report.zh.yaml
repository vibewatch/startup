      - number: '3.3'
        title: 初创挑战者——现代 FRAML 同业正快速收敛到同一叙事
        blocks:
          - type: paragraph
            body: >-
              初创公司群体已经近到足以迫使直接比较，但它们的买方中心并不相同。Hawk AI 是这一组中最明确的 FRAML 挑战者，声称集成欺诈和 AML 可带来 50% ROI，AML 监测误报减少
              70%，统一案件管理让调查速度提高 50%，并在 $56 million Series C 之后拥有 80 多个客户。ComplyAdvantage 比 Feedzai 更偏合规驱动，但确实有宽度：Mesh
              结合筛查、监测、案件管理、风险评分和自动补救；独立报道称公司服务 75 个国家的 3,000 多家企业，累计融资 $108.2 million。Sardine 在智能体工作流营销上走得更靠前，结合
              AML、制裁、交易监测和案件管理；其 2025 年融资公告称，累计融资 $145 million，企业客户 300 多家，ARR 同比增长 130%。


              Unit21 和 DataVisor 补齐最相关的现代同业。Unit21 强调 AI 风险基础设施、模块化案件工作和即时支付监测，决策延迟低于 250 毫秒，并有 Green Dot 客户证明和 4.8
              billion 笔受监测交易的历史规模声明。DataVisor 的话术同样是 AI 原生，但更强调跨实体智能、实时决策和现在的对话式智能体；Forbes 称其有 50 个客户和 $100 million
              融资。纵观这一群体，对 Feedzai 的反向解读很清楚：统一欺诈加 AML、以及 AI 驱动的工作流自动化，已经不再是专属叙事。
