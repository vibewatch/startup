      - number: '4.2'
        title: 规模信号与客户 ROI 代理指标
        blocks:
          - type: paragraph
            body: >-
              Feedzai 最强的公开财务信号是运营规模和客户结果，而不是收入披露。横跨首页、About 页面、基准新闻稿和客户故事中心，公司称其保护约 10 亿消费者，每年处理或保护约 120 billion
              个事件，并每年触达约 $9 trillion 支付量。客户故事中心还称，超过 1,000 家美国金融机构使用 Feedzai 的风险评分。这些不是 ARR 数据，但说明 Feedzai
              的运营规模已经大到企业续约和扩张收入可以产生实质意义。


              客户证明在经济性上有用，因为它以结果为基础。Feedzai Orchestration 宣称客户申请时间减少 67%，三个月内集成 16 个新数据源，并带来超过 $100M 增量新收入。ANZ GoBiz
              案例称，Feedzai 支持的工作流实现 20 分钟贷款决策、24 小时审批和 $150M 增量银行资金。Secure Onboarding 声称释放 $250M 存款、欺诈减少 65%、策略部署加快
              85%、第三方数据支出降低 20%。CoreCard 称 Feedzai 将欺诈相关拒绝削减 46%，同时检测到 64% 的欺诈尝试。Feedzai IQ 声称欺诈检测提高 4x、告警减少 50%、接受率提升
              27%，并让收单工作流的欺诈检测提升 5%。


              这些数据点很重要，因为它们说明 Feedzai
              如何在不公布价格的情况下证明高端企业定价。买家看起来是在围绕避免损失、更高批准率、更快开户、更低误报和更少合规工作量购买平台。这是可信的收入质量信号：产品销售对应关键任务经济性，而不是可自由裁量的分析支出。需要谨慎的是，以上都是客户或公司报告的
              ROI 代理指标；没有一个披露 Feedzai 自身已实现收入、模块组合、续约队列或毛利转化。
