      - number: '1.2'
        title: 创始人、领导班底与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的公开领导层记录里，具名高管信息充足，但完整治理披露偏薄。Nuno Sebastião 仍是公司最清晰的公众面孔，也继续撑起创始叙事、资本市场信息和面向伙伴的定位。Pedro Bizarro
              继续贡献大部分技术和研究可信度，Pedro Barata、David Larson 和 Mariana Jordão 则补齐可见的产品、财务和运营班底。2025 年 3 月，Feedzai 新增 Ana
              Sousa 和 Julie O’Brien，加强人力与市场领导力，说明公司正在从纯创始人主导的运营模式走向更成熟的组织。即便如此，已审阅来源仍暴露一个集中度风险：战略、创新和监管验证的公开叙事主要经过 Nuno
              和 Pedro。治理可见度也不完整。公司在 2022 年公开任命 David Henshall 为外部董事，但更广泛的董事会名单、委员会结构和继任规划，在本章审阅来源中仍披露不足。
