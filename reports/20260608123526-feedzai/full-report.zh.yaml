        - 相对既有厂商和 API 优先供应商，赢率或价格被压缩
        - 平均折扣显著扩大，或战略输单集中出现在部署更快的对手身上
        - 下调销售效率假设，并重审平台广度与速度之间的定位。
      - - 资本和组织执行
        - 订单额或客户扩张跟不上融资后的支出
