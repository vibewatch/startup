chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、根基与产品范围
        blocks:
          - type: paragraph
            body: >-
              Feedzai 眼下的公开定位很清楚，即便部分历史公司描述仍不完全一致。公司现在把自己称为 AI 原生的端到端金融犯罪预防平台，把欺诈、诈骗、反洗钱、筛查和更广义的风险运营放进同一套技术栈。当前首页、About
              页面和近期产品发布，都持续面向银行、支付服务商和其他金融机构，而不是泛化的横向分析市场。创始人材料把公司锚定在 2011 年，并强调 Nuno Sebastião 和 Pedro Bizarro
              的技术背景；第三方公司画像仍把葡萄牙 Coimbra 指向核心历史总部。与此同时，Feedzai 2025 年 3
              月宣布在纽约开设美国总部。因此，后续章节最稳妥的表述不是单一且无争议的总部标签，而是一家起于葡萄牙、在葡萄牙和美国双中心运营的公司。
            claimRefs:
