      - number: '1.4'
        title: 规模信号、经营动能与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Feedzai 给投资者提供了几项有意义的公开规模信号，但这些信号还拼不出干净的投资测算快照。正面看，公司公开称 FY2024 自由现金流为正，行为生物识别增长强劲，保护约 10 亿人，FY2024 覆盖超过
              $6 trillion 交易，并在 2026 年 RiskFM 和基准材料中评估约 $9 trillion 年度支付风险。这些信号有助于证明经营成熟度和平台宽度，也解释了为什么 ECB 入选和 2025
              年融资会在同一阶段落地。最大的披露缺口是客户数和员工数。公开来源没有给出精确安装基数，当前员工数尤其混乱：Nuno Sebastião 当前领导层页面称 Feedzai 全球员工接近 800 人，而 Unify
              2026 年 4 月的名录式画像，只在具名职能和地点中捕捉到接近 300 人的足迹。这不一定意味着某个来源出错，但确实意味着，在管理层提供干净内部花名册之前，后续财务和效率分析应把当前员工数视为未解决事项。
