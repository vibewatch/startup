            body: >-
              基于公开数据，正确建议是继续研究。Feedzai 有足够战略质量留在议程上：欺诈与金融犯罪市场很大，采用仍强，AI
              投资活跃，公司也有可见产品和合同动能。缺失的是把一家可信公司转化为可防守进入价格的证据。退出准备度也好坏参半。公司可能对战略买方或公开市场投资者有意义，但公开可比公司和已披露交易显示，溢价定价需要比
              Feedzai 目前提供的更多财务透明度。因此，最高杠杆的尽调问题很简单：拿到完整 ARR 和收入桥，检查毛利率和
              NRR，理解优先股堆叠，并量化数字欧元框架到底能转化为多少确认收入。在这些问题明确前，当前标记应被视为可能合理，但尚未证明。
