      - number: '3.2'
        title: 老牌厂商——NICE Actimize 和 FICO 仍设定企业信任基线
        blocks:
          - type: paragraph
            body: >-
              NICE Actimize 和 FICO 仍是最重要的老牌厂商，因为它们把宽产品范围和清晰公开规模结合在一起。NICE Actimize 把 X-Sight 定位为 AI 驱动的 AML 与欺诈平台，通过
              ActimizeWatch 叠加托管 AML 分析，并继续强调数字银行和更快支付风险。在母公司层面，NICE 称业务覆盖 150 多个国家；CompaniesMarketCap 报告，截至 2026 年 6
              月，公司过去 12 个月收入为 $2.94 billion。FICO 的姿态同样宽：Protect & Comply 覆盖 KYC、AML、欺诈预防、工作流和案件管理；Enterprise Fraud
              则明确覆盖卡、申请和实时支付欺诈，并支持毫秒级响应。FICO 向 SEC 提交的 2026 年 Q1 发布显示，季度收入为 $512 million，其中软件收入 $207.5 million。


              这对 Feedzai 很重要，因为大型银行采购不会只奖励产品优雅。老牌厂商可以指向更大的安装基数、采购熟悉度，以及在欺诈、AML 和相邻决策领域既有的运营缠绕。SAS 仍应被视为老牌背景的一部分，因为 2026
              年 AML 长名单仍持续出现它；但在审阅集合中，可公开访问的当前产品细节比 NICE Actimize 或 FICO 更薄。净结论是：Feedzai
              面对老牌厂商的最大威胁，不是这些供应商更现代，而是它们嵌得更深。
