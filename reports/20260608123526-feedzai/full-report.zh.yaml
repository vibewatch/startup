      - number: '1.3'
        title: 融资历程、投资者与战略利益方
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的融资历史显示，公司从风投支持的欺诈分析厂商，走成了更后期、具战略重要性的金融基础设施供应商。公开线索始于 2015 年 $17.5 million Series B，随后是 2017 年 $50
              million Series C，再跳到 2021 年 KKR 领投的 $200 million Series D，公司估值当时已显著高于 $1 billion。2025 年 10 月融资把 Feedzai
              推到超过 $2 billion 估值，并在既有支持者继续加码之外，引入了明显偏葡萄牙的投资者组合。对尽调而言，更关键的不只是轮次规模。Feedzai 的利益方版图现在包括 KKR、Sapphire
              Ventures、Citi Ventures 等历史投资者；Lince、Iberis、Explorer、Oxy、Buenavista 等 2025 年新资本；与 ECB 和 PwC 绑定的重大公共监管项目；以及
              Novobanco、Matrix USA、Neterium 等客户或伙伴证据点。这组组合说明，公司同时是一项风投支持的软件资产、受监管金融基础设施供应商，以及越来越依赖伙伴驱动的平台。
