      - number: '7.3'
        title: 合作伙伴、依赖与采购风险
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的商业模式在三层制造依赖风险：基础设施、数据生态和银行采购治理。公开客户与合作伙伴材料显示，AWS 既是技术底座，也是商业渠道：ANZ 的编排工作流建在 AWS 上，AWS Marketplace
              新闻稿称，客户可以用 AWS 积分购买 Feedzai，并通过 AWS 账户管理。Standard Chartered 的案例增加了第二层依赖：它描述了通过单一合同访问数百家外部数据供应商，并由 Feedzai
              编排层处理供应商故障转移和实体解析。这种架构可以减少集成蔓延，但也把第三方数据质量、区域合规审批和退出规划纳入供应商风险方程。监管机构进一步加重这项负担。PRA SS2/21 和 EBA
              外包指引把外包技术视为受治理关系，需要数据安全控制、业务连续性规划和退出选项。Feedzai 自己的制裁政策还把治理延伸得更远，要求对客户、合作伙伴和服务提供商做 KYC 与 KYV
              筛查。实际影响是采购周期更长，供应商复审工作反复出现，即便产品表现很强。
