      - number: '8.3'
        title: 可比公众公司与交易视角
        blocks:
          - type: paragraph
            body: >-
              可比组指向两个很不同的方向。NICE、Riskified、ACI 等公开交易可比公司约在 1.85x-2.5x 收入附近，这类数学会迫使投资者假设非常大的未披露收入，才能支撑 $2B 标记。FICO
              是高溢价公开特例，约 11.7x，但它靠有证据支撑的软件 ARR 增长和监管文件级留存披露赢得这个倍数。Verafin 是最好的战略交易视角，因为 Nasdaq 以 $2.75B 收购，对应隐含 19.5x
              收入倍数，同时还披露约 30% ARR CAGR 和超过 $140M 收入。Windsor Drake 2026 年研究把这些端点调和起来：公开 regtech 中位数已重置到约 3x-6x 收入，只有稀缺的
              AI 原生或战略关键资产仍能拿到 8x-15x 或更高。Feedzai 可能更接近这个溢价区间，但公开记录尚未证明。
