      - number: '3.4'
        title: 切换成本与多供应商并存——难点是替换工作流，而不是匹配功能
        blocks:
          - type: paragraph
            body: >-
              这个市场的主要切换约束，不在于竞争对手能否声称自己有“AI”或“实时监测”。关键是买家能否替换周边运营底座：共享数据管道、交易与客户上下文、第三方增强、案件处理逻辑、告警分流、审计轨迹，以及接入支付轨道或银行系统的集成。Feedzai
              自身来源通过 Demyst 编排和 FRAML 统一来强调这一逻辑；Novobanco 的迁移叙事也明确围绕用一个环境替代割裂的遗留系统。竞争对手身上也能看到同一模式。FICO 强调共享数据和案件工作流，NICE
              Actimize 围绕既有 AML 模型销售托管优化，ComplyAdvantage 突出 API 和审计轨迹集成，Sardine 和 Unit21 销售 AI 辅助调查，DataVisor 则把 FRAML
              绑定到实时决策和智能体控制。


              这带来两点含义。第一，边缘场景可以现实地多供应商并存：筛查、联盟数据、设备智能，或战术性 RTP
              模块，通常不用拆掉核心系统就能加上。第二，一旦平台拥有共享案件、模型和证据流，全栈替换就会结构性更难。这种动态保护老牌厂商续约，但一旦 Feedzai 被采用，也能保护
              Feedzai。不过在新客户交易中，门槛会更高：Feedzai 不仅要展示更好的检测，还要证明迁移痛苦低于老牌厂商体系或模块化挑战者技术栈。
