        - 10x-12x 收入
        - $3.0B-$4.2B
        - $300M-$350M 收入
        - Feedzai 证明收入质量可享溢价，数字欧元货币化放量，市场继续愿意为 AI 原生金融犯罪基础设施支付溢价。
        - 低
      - - 基准
        - 6x-8x 收入
        - $1.6B-$2.4B
        - $260M-$300M 收入
        - 公司继续增长，但投资人最终按强软件质量定价，而不是按稀有交易离群值定价。
        - 中
      - - 悲观
        - 3x-5x 收入
        - $0.8B-$1.5B
        - $160M-$300M 收入
        - 公司不错但稀缺性不够，或当前 ARR / 收入质量低于溢价预期。
        - 中高
      - - 承销含义
        - 仅作门槛框架
        - 当前 $2.0B 投后估值介于基准与溢价结果之间
        - 公开证据不足以判断哪组门槛更现实
        - 把这些数字当作入场纪律门槛，而不是对今天实际收入的预测。
        - —
