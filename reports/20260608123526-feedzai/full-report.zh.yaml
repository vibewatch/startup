  - id: TV005
    title: 投资逻辑破裂和终止触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 私有 ARR / 收入显著低于门槛
        - 数据室显示的收入远低于即便按 6x-8x 上市倍数支撑也所需的水平
        - 当前标价会立即从溢价变成偏高或昂贵。
        - 不要按现有价格投资。
      - - 数字欧元货币化延期或缩水
        - 框架未转化为有意义的合同收入，或时间表明显滑坡
        - 一条主要战略溢价论据变弱，期权价值应打折。
        - 下调乐观情景概率，并按更接近上市可比区间重新承销。
      - - 优先股堆叠对投资人不友好
        - 清算优先权、反稀释棘轮或老股交易让头部投后估值产生误导
        - 新钱的真实经济性比头部估值暗示的更差。
        - 暂停，直到条款改善或价格重置。
      - - 上市 / 私有欺诈倍数仍处于重置模式
        - 市场仍更接近 3x-6x，而不是 8x-15x
        - 公司需要大得多的收入规模才能支撑当前标价。
        - 要求更多收入证明或更低价格。
      - - 执行质量证明只是普通，而非溢价
        - 毛利率、NRR 或客户集中度显著弱于溢价软件常模
        - Feedzai 不再像 FICO/Verafin，而更像标准监管科技工作流提供商。
        - 基准情景变成悲观情景。
    notes: 这些是估值触发器，不是泛泛的运营风险：每一项都说明投资逻辑如何直接传导到投资人应该或不应该支付的价格。
