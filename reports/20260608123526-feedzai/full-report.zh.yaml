      - number: '5.4'
        title: 部署模式、合作伙伴依赖与市场技术验证
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的市场验证越来越来自组合产品部署，而不是单点欺诈故事。Novobanco 是最清晰的例子：该行先上 Digital Trust 和 Transaction Fraud，随后扩展到 AML，引入由
              Neterium 支撑的名单筛查，现在又把平台纳入统一经济犯罪模型。关键在于，它验证了核心产品假设：欺诈、身份和 AML 信号应该放在一起，而不是散落在彼此割裂的工具里。Jack Henry
              的案例也指向同一方向，只是落在中小机构：多租户 AML+欺诈界面接入现代支付轨道。


              合作伙伴层也更显性。Neterium 提供筛查基础设施和具名数据供应商集成；Matrix USA 通过联合卓越中心 提供实施和咨询能力；AWS Marketplace 增加分发渠道和生态信号；QKS 对
              Digital Trust 的认可则支撑身份与行为生物识别叙事。整体看，Feedzai 不是一家纯独立产品公司，而是在把软件、伙伴交付和数据供应商连接拼起来，让整套技术栈更容易落地。


              风险在于，最深入的实施证据仍有很多只放在客户材料里。公开页面能说明真实部署生态已经存在，但没有给出足够运营细节，无法充分定价迁移成本、合作伙伴依赖集中度或 SLA 义务。
