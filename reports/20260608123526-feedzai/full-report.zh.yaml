  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类
        blocks:
          - type: paragraph
            body: >-
              分析 Feedzai 时，应把它放在银行和支付的金融犯罪技术栈内，而不是泛泛的“金融 AI”桶里。公司自身定位很具体：向全球银行和新兴金融科技公司销售欺诈、诈骗、身份和 AML 控制；2026
              年基准发布也面向金融机构对标数字支付欺诈表现。因此，纳入支出的应是用于检测可疑交易、实时评分欺诈和诈骗风险、管理告警和调查，并把支付、开户、交易监测表面的欺诈与 AML
              工作流打通的软件和运营基础设施。市场边界应排除无关的核心银行软件、通用网络安全、纯咨询服务，以及不直接执行金融犯罪决策的更宽泛金融软件类别。现状替代方案仍很强：银行内部的批量交易监测、纯规则点工具、割裂的欺诈与
              AML 团队，以及人工调查员工作流。Research and Markets、Feedzai 和 AFP 合在一起说明，相关买家不是通用企业 IT 部门，而是对支付风险、欺诈控制、AML
              结果或金融犯罪治理负有明确责任的受监管机构或支付运营商。
