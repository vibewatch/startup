      - number: '4.3'
        title: 成本结构、交付经济性与反向证据
        blocks:
          - type: paragraph
            body: >-
              Feedzai 交付上看起来由软件驱动、资本较轻，但实施未必便宜。AML Transaction Monitoring 页面强调更低合规成本、更低总体拥有成本，以及自动 SAR/STR
              申报；Orchestration 和 Secure Onboarding 则强调 API、数据连接器、实时决策和云交付，而不是实体基础设施。因此，业务似乎更多暴露于研发、云和数据成本、实施、支持及 GTM
              支出，而不是库存或重资本开支。CFO 任命公告强化了这一图景：Feedzai 在 2025 年自称为拥有 600 多名员工、10 个办公室的全球公司，并称 2024 财年创下纪录，部分由行为生物识别 88%
              增长驱动。Gartner 2026 年产品画像独立把 Feedzai 放在 501-1000 名员工区间，与有意义的运营费用基础方向一致。


              反向证据集中在实施负担、支持响应和定价不透明。Gartner 2026 年 5
              月的一条批评性评论称，该平台在欺诈预防上很强，但在复杂或时间敏感场景中，尤其是较老的本地部署，支持响应速度和深度可能不足。Capterra 评论称，规则创建很快但成本高，需要许多人工步骤，并可能因工作流、指标和
              UI 摩擦而变得混乱。Software Advice 和 GetApp 都确认，询价只能在联系供应商之后进行，而不是通过公开价目表。


              财务含义是，Feedzai 很可能对大型机构有真实定价权，但如果服务强度高，实施和支持成本也不轻，可能压缩已实现利润率。公开来源没有披露毛利率、服务占比、CAC、回本周期、NRR
              或流失率，因此利润率路径仍是推断，不是报告事实。可见证据支持的是资本较轻的软件架构叠加企业实施负担，而不是干净的公开 SaaS 效率画像。
