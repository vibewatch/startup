        blocks:
          - type: paragraph
            body: >-
              由于当前 ARR 和收入未披露，情景框架必须围绕门槛搭建，而不是假装精确。基于公开数据，正确问题不是「Feedzai
              今天精确值多少钱？」而是「这家公司需要达到什么收入和质量水平，才能在现实倍数下支撑这个价格？」这个视角有用，因为它揭示了投资逻辑对价格有多敏感。在 12x 收入下，当前标记只需要约 $167M 收入支撑；在 8x
              下需要约 $250M；在 6x 下需要约 $333M；在 3x 下需要约 $667M。这些不是对当前规模的预测，而是承保门槛。如果私有尽调显示 Feedzai 在增长、留存和利润率质量上更接近 Verafin 或
