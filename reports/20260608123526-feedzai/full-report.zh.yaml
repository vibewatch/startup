        - 反向逻辑
        - Windsor Drake 提到的 3x-6x「新常态」和上市可比公司低个位数现实，使溢价区间成为例外，而非默认值。
      - - 资本结构不确定性
        - 反向逻辑
        - 2025 年可见稀释较低，并不能免除对七轮优先股堆叠、期权池和任何老股交易机制的检查。
    notes: 反向逻辑针对估值支撑，不是产品无关。Feedzai 可以是优质资产，同时仍难以按当前价格买入。
