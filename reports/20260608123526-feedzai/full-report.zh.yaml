      - number: '4.4'
        title: 融资、法定文件与资本充足性背景
        blocks:
          - type: paragraph
            body: >-
              Feedzai 有新的估值支撑和有意义的已披露资本基础，但公开证据仍不足以判断资产负债表充足性。2021 年 3 月，Feedzai 宣布由 KKR 领投 $200M Series D，估值显著高于
              $1B，资金用于全球扩张、产品开发和伙伴战略。2025 年 10 月，Feedzai 又宣布约 $75M 投资轮，将估值提高到 $2B；PR Newswire、TechFundingNews 和 FinTech
              Global 都佐证了轮次规模和估值上调。仅基于披露规模的轮次，Feedzai 自 2021 年以来至少有 $275M 可公开识别新股资本，且尚未计入任何未披露战略投资。


              数字欧元入选在经济上重要，但应谨慎处理。Feedzai 自有公告称，风险与欺诈框架估计价值为 €79.1M，最高价值为 €237.3M，公司会为每笔交易提供欺诈风险评分。ECB 官方通知确认，Feedzai
              是风险与欺诈管理的第一顺位供应商。不过，ECB 也称框架协议在当前阶段不涉及付款，实际开发决策稍后才会作出。换句话说，该框架支持商业可信度和潜在待履约机会，但不是已确认收入或保证现金。


              本次审阅中唯一达到监管文件级别的公开财务可见度位于子公司层面。Companies House 显示，FEEDZAI UK LIMITED 仍处于存续状态，2026 年 5 月提交了确认声明，并拥有截至 2025
              年 1 月 31
              日的小公司账目。这可作为法定合规和法律足迹证据，但不能替代合并财务报表。没有已审阅来源披露集团现金、债务、烧钱速度、现金跑道或盈利能力，也没有来源揭示公开债务融资工具。因此，即便估值标记强劲，资本充足性仍是私有数据问题。
