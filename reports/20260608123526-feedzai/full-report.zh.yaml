  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局——Feedzai 参与的是广义金融犯罪操作系统之争
        blocks:
          - type: paragraph
            body: >-
              Feedzai 不是在单一狭窄软件品类里竞争。直接战场更宽：以银行为中心的老牌厂商 NICE Actimize 和 FICO，2026 年 AML 长名单里仍能看到的 SAS 分析栈，以及 Hawk
              AI、ComplyAdvantage、Sardine、Unit21、DataVisor 等新一代厂商；这些公司越来越多地营销统一欺诈、AML、筛查和调查工作流自动化的某种组合。Feedzai 自己的 2026 年
              AML 展望也称，市场正走向 FRAML，即欺诈和 AML 在共享数据、模型和工作流上协同运行；SymphonyAI 和 Salv
              的第三方长名单也把许多相同供应商放进同一个考虑集。也就是说，相关买家要问的不只是哪个供应商有最好的欺诈模型或 AML 规则引擎，而是谁能成为金融犯罪决策的操作系统，或者买家是否会继续采用内部自建加拼接式点工具。


              Feedzai 的起点可信。公司仍有可见的企业银行证据、明确的编排野心，以及大多数初创同业无法公开匹配的当前规模信号。但这个品类已不再是空白市场：多个挑战者现在围绕统一欺诈与 AML、以及 AI
              驱动的工作流加速，讲着几乎相同的故事。结果是，品类定义有利于 Feedzai，但不能把它隔离出来。
