      - 收入质量
      - 尽调要求
    rows:
      - - Transaction Fraud / Digital Trust
        - 为银行在各支付渠道和客户生命周期中提供实时欺诈评分和决策。
        - 公开计价单位未披露；可能是谈判式企业平台费，叠加按交易范围计价。
        - 作为核心模块在售，Wio、Novobanco 和 CoreCard 有具名部署。
        - 高——绑定支付批准和损失防控，是任务关键控制点。
        - 提供合同最低额、续约条款，以及定价是否按交易量、账户数或模块计费。
      - - AML 交易监控 / 观察名单筛查
        - 面向受监管机构的 AI 辅助监控、告警优先级排序、案件管理和 SAR/STR 流程。
        - 公开计价单位未披露；模块或平台定价未公布。
        - 官方页面强调降低合规成本、20+ 开箱即用场景和自动申报。
        - 高——合规工作流一旦嵌入通常黏性强、周期多年。
        - 拆分 AML 模块 ARR、专业服务内容和按监管机构定制的附加定价。
      - - 编排 / 开户工作流
        - API 驱动的编排，覆盖开户、数字贷款、KYC/KYB 和外部数据工作流。
        - 公开计价单位未披露；可能是企业订阅，叠加实施和数据工作流范围。
        - Feedzai 将其营销为可复用自动化层；ANZ 提到 20 分钟决策和 $150M 增量融资。
        - 中高——相邻工作流收入把钱包份额扩到纯欺诈筛查之外。
        - 展示实际定价、实施费，以及有多少交易与欺诈或 AML 模块一起售出。
      - - Feedzai IQ 网络智能
        - 利用社区信号提升欺诈检出和支付通过率的联邦网络智能附加组件。
        - 公开计价单位未披露；可能是既有平台合同的高端附加项。
        - 官方页面称可立即创造价值、欺诈检出提高 4x、告警减少 50%。
        - 高——附加组件经济性可在不大改部署的情况下提升 ACV。
        - 披露 TrustScore / TrustSignals 的附加率、提价幅度和毛利结构。
      - - 收单方 / PSP 商户风险服务
        - 面向收单方和 PSP 的欺诈防控、商户监控、结算加速和增值服务。
        - 按商户需求营销分层方案，但未披露公开单价。
        - 官方页面把商户风险和更快结算定位为增收服务。
        - 中——可能增加平台收入并加深伙伴经济性，但公开定价缺位。
        - 分享商户分层打包、各细分市场采用率，以及任何基于交易的变现。
      - - 数字欧元框架机会
        - 为数字欧元交易提供中央欺诈检测和防控评分的框架协议。
        - 公开披露的框架额度：估计价值 €79.1M，最高价值 €237.3M。
        - 商业上重要但仍具或有性；ECB 表示现阶段没有付款。
        - 中——潜在公共部门项目收入，但尚不是已签约确认收入。
        - 澄清预期服务请求节奏、启动里程碑和收入确认假设。
    notes: 各行区分公开商业证据和私有合同细节。除数字欧元框架额度外，所有软件模块的公开单价都未披露；数字欧元框架是或有采购容量，而不是已经生效的付费订阅。
