      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Feedzai 这类平台的购买中心天然跨职能。Feedzai 自有材料面向银行、fintech、支付网络和收单机构；DataVisor、SEON、Moody’s、AFP 和 McKinsey
              也都描述了欺诈、AML、风险、支付、资金管理、财务、审计和高管治理交叉的组织形态。实际采购中，执行发起人通常是首席风险官、欺诈负责人、AML/合规负责人，或面对明确痛点的支付负责人，例如 APP
              诈骗、实时支付速度上升，或监管要求证明有效性。日常用户则是另一群人：调查员、案件经理、欺诈分析师、AML
              分析师、交易监测团队，以及调优控制和分流告警的数据或模型专家。付款逻辑随工作负载而变。纯欺诈和诈骗项目常落在欺诈、支付或风险预算；交易监测和 SAR 效率项目常落在 AML/合规预算；企业级 FRAML
              项目越来越需要共同出资，因为机构同时要解决数据割裂、客户摩擦和重复运营。调查证据还显示，自动化不会消灭员工数。相反，机构采用 AI 是为了降低误报、加快调查、提升决策质量，同时继续招聘专业人员。
