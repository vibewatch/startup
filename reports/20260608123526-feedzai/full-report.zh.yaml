      - number: '5.2'
        title: 数据、决策与集成架构
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的架构更适合理解为分层风险决策栈，而不是单一整体模型。在前端，Secure Onboarding 和 New Account Fraud 编排申请阶段信号；Digital Trust
              则在实时会话中加入连续的行为、设备、网络和恶意软件信号。Transaction Fraud 随后结合行为、金额和非金额数据做支付决策；Watchlist Screening 和 AML Transaction
              Monitoring 增加合规专属控制、优先级排序和报告。Feedzai IQ 位于这些层之上，作为联邦式网络智能服务；Orchestration 则位于旁侧，作为开户与 KYC/AML
              旅程的工作流和外部数据底座。


              最具体的集成证据位于 Orchestration、Watchlist Screening 和 OpenML 页面。Feedzai 公开记录了支持 SQL 和 Python 的工作流、REST
              API、Snowflake 和 S3 数据交付选项、配置网关 API、具名筛查数据提供商，以及面向外部机器学习提供商的公开 OpenML 仓库。这些线索让实施模型看起来比黑箱设备更可配置，也暗示 Feedzai
              预期客户环境复杂，拥有多个上游数据源和下游决策需求。


              主要架构限制不在连贯性，而在可见度。公开材料展示了可信的运营模型，但许多运行时细节被挡在客户文档之后。外部尽调仍需要门户访问权限，以核查 API
              版本、速率限制、模式演进和管理控制，尤其是针对评估多地区部署或重度定制的机构。
