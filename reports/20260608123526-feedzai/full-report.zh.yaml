      - number: '2.2'
        title: 规模测算口径与矛盾
        blocks:
          - type: paragraph
            body: >-
              没有一个公开 TAM 能与 Feedzai 干净对应。Mordor 和 Fortune 等广义欺诈检测与预防发布方，把 2026 年市场规模放在约
              US$67-70B，但这些估计跨越多个行业，也纳入身份认证和治理工具等相邻功能。另一个极端是 Expert Market Research，它把范围窄得多的金融犯罪和欺诈管理解决方案类别，估为 2025 年仅
              US$1.37B，年复合增长率（CAGR）为 5.7%。这个差距大到无法简单平均，反而证明发布方在测量不同东西。更有用的中间口径来自 Mordor 的垂直和客户拆分：BFSI 占 2025 年支出的
              26.15%，大型企业占 56.64%，推导出约 US$14.6B 的 BFSI 切片，以及在进一步收窄至银行和支付欺诈及 AML 工作流之前、约 US$8.3B 的大型企业 BFSI
              切片。两个运营口径进一步证明，即便软件 TAM 模糊，需求也真实存在：ACI 称 2023 年实时支付达到 266.2B 笔交易，Nasdaq Verafin 估计 2025 年非法金融活动为
              US$4.4T、欺诈损失为 US$579.4B。因此，市场明确是数十亿美元级别，但由于公开来源很少用兼容方法隔离银行和支付的交易监测、诈骗及 FRAML 支出，精确 SAM 和 SOM 仍受证据限制。
