      - number: '4.5'
        title: 承销缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              Feedzai 的公开证据支持对收入质量持正面看法，但不足以完成完整投资测算。公司似乎向受监管买家销售关键任务软件，可以在相邻欺诈和 AML 工作流之间交叉销售，并用网络级数据和客户结果证明来支撑高端定价。新的
              2025 年融资和 ECB 数字欧元入选，都强化了战略相关性。独立评论来源也显示，买家愿意忍受实施复杂度，因为产品解决的是高成本欺诈和合规问题。


              缺失的是把叙事转成财务模型所需的每一项核心投委会输入。公开来源没有披露合并收入或 ARR、模块组合、服务与软件收入占比、毛利率、净留存、CAC
              回本、现金余额、运营烧钱、现金跑道或盈利能力。公开定价证据停留在“请求演示”、“价格可按需提供”和“没有价格信息”。即便数字欧元框架也无法补上缺口，因为 ECB 称框架在当前阶段不产生付款义务。


              财务结论：Feedzai
              看起来是一项高质量、企业级、贴近交易的软件资产，具备强规模代理指标和可信需求，但仅凭公开信息仍无法完成投资测算。正确的基准情景不是公司弱，而是公司仍是私有公司。尽调流程因此应先聚焦经审计或管理层编制的财务报表、模块级收入组合、已实现定价和折扣、专业服务负担、留存和队列经济、当前现金与烧钱，以及从数字欧元框架容量转化为实时付费工作的路径。
