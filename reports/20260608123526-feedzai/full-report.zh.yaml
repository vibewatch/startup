companyProfile:
  summary: >-
    Feedzai 起于葡萄牙、在美国放大，是一家金融犯罪预防公司，销售 AI 原生平台，覆盖欺诈、诈骗、开户、AML、筛查、编排和面向银行及支付服务商的网络智能。公开证据显示，公司借 2025 年融资、ECB
    数字欧元入选、客户和伙伴扩张以及持续产品发布，拿到了有意义的战略动能；但 ARR、收入、毛利率和股权结构表条款等核心投资测算指标仍不透明。
