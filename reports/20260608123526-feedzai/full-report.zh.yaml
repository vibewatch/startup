      - number: '5.3'
        title: AI 差异化、可解释性与治理
        blocks:
          - type: paragraph
            body: >-
              Feedzai 最强的技术差异化主张，是它作为私营金融犯罪供应商，拥有异常明确的 AI 和研究展示面。公开产品页面点名 Pulse Risk Engine、Whitebox Explanations、Data
              Science Studio、AutoML 和 Responsible AI 功能；研究网站和 GitHub 足迹则展示了对公平性感知
              boosting、低误报可解释规则提取、公平性实验管道和可解释性工具的支持性工作。这不等于证明生产环境结果同类最佳，但证据强于泛泛的“我们使用 AI”定位。


              RiskFM 是 2026 年关键信号。Feedzai 将其宣传为面向开户、支付、转账和 AML
              的金融风险基础模型层，并声称它能在第一天匹配定制监督模型，在跨多家机构训练后超过传统方法。如果这些主张成立，RiskFM 可能实质降低模型创建和维护成本，同时把覆盖范围扩展到多个孤岛。


              治理可信，但不完全整齐。Feedzai 2025 年 TRUST 发布强调 Transparent、Robust、Unbiased、Safe & Secure 和 Tested，而 2026
              年研究微站把同一缩写重新表述为 Transparent、Robust、Universal、Sustainable 和 Tested。这种不一致不会抹掉负责任 AI
              工作，但说明外部治理叙事仍在演进。再叠加有限的公开认证范围和需权限访问的文档，结果是治理姿态有希望，却无法仅凭公开证据充分完成投资测算。
