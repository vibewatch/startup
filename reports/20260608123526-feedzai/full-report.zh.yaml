        title: 融资背景、稀释与价格支撑缺口
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月 Series E 给了一个清晰标题：大约融资 $75M，投后估值 $2B。公开看，这是一次稀释相对较低的融资。如果资金全部是新股，简单计算意味着稀释只有约 3.75%，投前价值约
              $1.925B。这有用，因为它说明投资者愿意在没有巨型重组的情况下把估值标记上移。但这不足以承保经济性。Tracxn 显示七轮融资、累计 $347M，而 PitchBook
              的公开页面无法开放访问。这一组合很重要，因为最新轮次可见稀释低，并不能消除过往轮次中的优先权堆叠风险、老股交易或期权池悬置。举证责任仍在私有尽调，而不是投后估值标题本身。
