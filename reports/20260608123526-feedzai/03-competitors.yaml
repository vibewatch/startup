  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Quoted list prices, minimums, and realized discount ranges for Feedzai, NICE Actimize, FICO, Hawk, ComplyAdvantage, Sardine, Unit21, DataVisor, and SAS.
    whyItMatters: Without real quotes, the chapter can compare packaging transparency but not true price-to-value or likely margin pressure.
    diligencePath: Request anonymized customer quotes or procurement screenshots from recent competitive deals and cross-check with reseller or partner data.
    relatedQuestionRefs:
    - QP015
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Named competitive win rates, churn reasons, and displacement data for Feedzai against NICE Actimize, FICO, and FRAML challengers.
    whyItMatters: Moat durability depends on who actually wins contested RFPs, not just on how vendors position themselves in public materials.
    diligencePath: Ask management for the last 12 months of named competitive wins/losses, broken out by incumbent versus challenger and by buyer type.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: private-scale
    missingEvidence: Current audited ARR, net retention, and gross-margin data for Feedzai and most private challengers in this set.
    whyItMatters: Scale and efficiency are central to whether challengers can sustain discounting, support large-bank deployments, and keep pace with incumbent R&D.
    diligencePath: Collect board or investor materials with latest ARR, growth, NRR, and customer concentration for Feedzai, Hawk, ComplyAdvantage, Sardine, Unit21, and DataVisor.
    relatedQuestionRefs:
    - QP006
    - QP008
    - QP009
    relatedTableRefs:
    - TP001
  - type: access-blocked
    severity: minor
    topic: sas-detail
    missingEvidence: Accessible current SAS product detail for fraud, AML, and workflow packaging comparable to what is public for NICE Actimize and FICO.
    whyItMatters: SAS remains a visible incumbent on 2026 AML longlists, but the reviewed public set did not provide enough current detail to score it with the same confidence as the other incumbents.
    diligencePath: Obtain current SAS product sheets or customer references directly from sales or analyst subscriptions and refresh the incumbent comparison.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP002
  - type: missing-source
    severity: material
    topic: implementation-burden
    missingEvidence: Measured deployment timelines, case-migration workload, and rule-conversion effort across incumbent and challenger replacements.
    whyItMatters: Switching cost is one of the core competitive lenses in this chapter, but most public materials describe outcomes rather than migration burden.
    diligencePath: Request implementation plans or post-mortems from recent platform migrations, especially deals replacing multiple legacy systems with one FRAML stack.
    relatedQuestionRefs:
    - QP017
    - QP019
    - QP026
    relatedTableRefs:
    - TP004
