- id: TP004
  title: Moat durability / competitive risk register — what can still differentiate Feedzai
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters now
  - Mitigation / diligence ask
  rows:
  - - Unified FRAML / RiskOps platform
    - Hawk, Sardine, Unit21, DataVisor, and ComplyAdvantage all market some version of unified fraud-plus-AML or AI workflow automation
    - High
    - FRAML is increasingly table stakes, so story alone will not sustain premium positioning
    - Request named competitive win rates and renewal data for unified-platform deals
  - - Bank-grade referenceability
    - NICE Actimize and FICO can counter with deeper installed-base trust and larger scale
    - High
    - Incumbent distribution can slow displacements even when newer tools look more modern
    - Obtain evidence of large-bank wins specifically against NICE or FICO
  - - Data / orchestration advantage
    - Rivals also market consortium, cross-entity, or third-party-data strengths
    - Medium
    - Demyst and network claims matter only if they materially improve deployment and detection outcomes
    - Ask for adoption metrics and attach rate for Demyst-orchestration workflows
  - - AI-led productivity gains
    - Peers advertise similar 50%+ productivity or 70%+ false-positive improvements
    - Medium
    - Normalized benchmarking is difficult when all vendors market large operational deltas
    - Run benchmark pilots with common alert sets and explicit false-positive definitions
  - - Single-platform efficiency
    - Replacing fragmented tools can require deep migration of rules, cases, and integrations
    - Medium
    - High switching cost protects incumbents and can elongate Feedzai sales cycles
    - Request implementation timelines, rule-migration burden, and case-history portability evidence
  - - Flexible enterprise pricing
    - Opaque pricing lets larger incumbents or better-funded challengers discount aggressively
    - Medium
    - Public materials reveal almost no like-for-like price anchors
    - Collect competitive quotes and discounting behavior before underwriting margin durability
