chapter:
  number: 3
  title: Competitors
  summary: 'Feedzai sits in the fast-converging middle of financial-crime software: more modern and unified than many incumbent estates, but no longer alone in marketing FRAML, agentic workflows, and real-time decisioning. NICE Actimize and FICO still anchor the enterprise trust baseline with much larger scale, while Hawk AI, ComplyAdvantage, Sardine, Unit21, and DataVisor all now offer evidence-backed challenger narratives around unified fraud-and-AML operations, workflow automation, or modular cloud deployment. Feedzai’s strongest public proof is bank-grade — especially the ECB digital-euro role and Novobanco transformation — but moat durability now depends on reference strength, migration ease, and competitive win rates more than on category story alone.'
sections:
- id: landscape
  title: Landscape — Feedzai competes in a broad financial-crime operating-system contest
  body: 'Feedzai does not compete in a single narrow software category. The direct arena is broader: bank-centered incumbents such as NICE Actimize and FICO, a still-visible SAS analytics stack on 2026 AML longlists, and a newer cohort — Hawk AI, ComplyAdvantage, Sardine, Unit21, and DataVisor — that increasingly markets some mix of unified fraud, AML, screening, and investigation workflow automation. Feedzai’s own 2026 AML outlook says the market is moving toward FRAML, where fraud and AML are run together on shared data, models, and workflows, and third-party longlists from SymphonyAI and Salv place many of the same vendors into one consideration set. That means the relevant buyer question is not merely who has the best fraud model or AML rules engine; it is which vendor can become the operating system for financial-crime decisions, or whether the buyer will stay with internal build plus stitched-together point tools.


    Feedzai’s starting position is credible. The company still has visible enterprise-bank proof, explicit orchestration ambitions, and current scale signals that most startup peers do not match publicly. But the category is no longer empty white space: multiple challengers now tell an almost identical story around unified fraud and AML plus AI-led workflow acceleration. The result is a market where category definition helps Feedzai, but does not isolate it.'
