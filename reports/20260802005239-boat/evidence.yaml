evidenceGaps:
  - type: missing-source
    severity: material
    topic: board governance
    missingEvidence: Full board composition, committee structure, and promoter-control terms from the latest filing set.
    whyItMatters: IPO readiness depends on governance quality, not just scale and profitability.
    diligencePath: Review the full UDRHP/annual-return attachments rather than only summaries.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: total capital raised
    missingEvidence: A clean round-by-round funding history with exact amounts and preference terms.
    whyItMatters: Valuation context and dilution analysis are incomplete without the financing stack.
    diligencePath: Pull full cap-table disclosures from the latest filing or data room.
    relatedQuestionRefs:
      - QO023
  - type: conflicting-data
    severity: minor
    topic: fy25 top-line presentation
    missingEvidence: Reconciled explanation for the difference between revenue-from-operations and consolidated media-release figures.
    whyItMatters: A single canonical revenue anchor reduces cross-chapter drift.
    diligencePath: Compare the full statement of profit and loss in the filing against media-release wording.
    relatedQuestionRefs:
      - QO014
  - type: missing-source
    severity: material
    topic: value-share market sizing
    missingEvidence: Primary analyst tables translating shipment share into revenue and profit pools by segment.
    whyItMatters: Shipment leadership does not automatically imply superior economics.
    diligencePath: Review paid IDC/Counterpoint tables or filing exhibits with category value data.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-lens comparability
    missingEvidence: One harmonized framework connecting audio-value share, watch shipments, and overall wearables share.
    whyItMatters: Later valuation needs comparable units across the narrative.
    diligencePath: Normalize market lenses by segment before building comps.
    relatedQuestionRefs:
      - QM016
  - type: missing-source
    severity: material
    topic: realized pricing and sell-through
    missingEvidence: Channel-level ASPs, return rates, and repeat-purchase data by competitor.
    whyItMatters: Visible list pricing is not the same as realized competitive economics.
    diligencePath: Pull marketplace scrape data or internal channel analytics.
    relatedQuestionRefs:
      - QP011
      - QP025
  - type: private-evidence-only
    severity: material
    topic: app engagement moat
    missingEvidence: MAU, retention, and OTA-update usage for boAt apps versus peers.
    whyItMatters: Software stickiness is central to judging moat durability.
    diligencePath: Request internal app telemetry and cohort data.
    relatedQuestionRefs:
      - QP016
  - type: private-evidence-only
    severity: blocking
    topic: cash conversion
    missingEvidence: Cash-flow statement detail, inventory turns, and route-to-market contribution margins.
    whyItMatters: Public PAT does not prove durable self-funded growth in hardware.
    diligencePath: Review full filing financial statements and internal monthly MIS.
    relatedQuestionRefs:
      - QI015
      - QI025
  - type: missing-source
    severity: material
    topic: gross margin by segment
    missingEvidence: Audio versus wearables gross margin and warranty cost.
    whyItMatters: Valuation and comp choice depend on true segment economics.
    diligencePath: Request management bridge by category and channel.
    relatedQuestionRefs:
      - QI016
  - type: private-evidence-only
    severity: material
    topic: quality metrics
    missingEvidence: Defect rates, service-cycle times, OTA adoption, and firmware reliability by product line.
    whyItMatters: Product breadth can mask weak field performance.
    diligencePath: Request internal quality dashboards and service logs.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: manufacturing economics
    missingEvidence: Per-unit cost savings from localization and JV manufacturing.
    whyItMatters: The operational moat is financial only if savings persist.
    diligencePath: Review supplier and JV operating data.
    relatedQuestionRefs:
      - QE010
      - QE011
  - type: private-evidence-only
    severity: material
    topic: retention and repeat
    missingEvidence: Repeat-purchase rate, NPS, complaint closure SLAs, and channel-level cohort behavior.
    whyItMatters: Public scale does not prove durable customer economics.
    diligencePath: Review CRM, service, and marketplace cohort data.
    relatedQuestionRefs:
      - QU010
      - QU021
      - QU025
  - type: missing-source
    severity: low
    topic: enterprise / institutional sales
    missingEvidence: Any non-consumer or corporate gifting concentration data.
    whyItMatters: Could change seasonality and customer concentration assumptions.
    diligencePath: Ask management for B2B and gifting mix.
    relatedQuestionRefs:
      - QU003
  - type: private-evidence-only
    severity: material
    topic: supplier and channel concentration
    missingEvidence: >-
      Named supplier concentration, top-channel economics, complaint closure SLAs, and detailed remediation plans for
      disclosure issues.
    whyItMatters: Residual risk cannot be fully ranked without concentration and remediation data.
    diligencePath: Request supplier, channel, service, and audit-remediation dashboards.
    relatedQuestionRefs:
      - QR010
      - QR011
      - QR030
  - type: missing-source
    severity: minor
    topic: litigation docket
