  topStrengths:
    - boAt 在印度音频和可穿戴品类拥有全国性品牌认知，公开证据显示它在核心消费品类里占据领先位置。
    - FY25 披露显示公司恢复盈利，相比此前亏损阶段，pre-IPO 叙事可信度有所提升。
    - 公司同时拥有强线上触达和庞大线下零售商、分销商网络，降低了对单一路径的依赖。
    - 本地化和合作制造推进后，成本控制更有支撑，韧性也好于完全依赖进口的模式。
    - 预期 IPO 估值区间仍让 boAt 稳稳处在独角兽范围内，说明市场对这项 franchise 有实质认可。
  topRisks:
    - 公开文件报道暴露出治理和披露问题，包括账面与银行记录不一致，以及其他控制担忧。
    - 产品品类竞争激烈且容易复制，限制了软件驱动消费平台通常能拿到的定价权。
    - 客户评论证据显示，换货和售后服务反复出现摩擦，可能削弱复购质量。
    - boAt 仍暴露在 marketplace 经济性、营运资本需求，以及消费硬件常见的利润率波动之下。
    - 上市前领导层交接和创始人退居二线，让关键制度化阶段多了一层执行风险。
  unresolvedGaps:
    - 本次审阅的公开记录里，现金转化、经营现金流和库存周转细节披露仍不足。
    - 仍缺分部层面的毛利率、保修成本和各销售路径贡献利润率数据。
    - 仅靠公开报道，还看不清审计和披露担忧的完整整改状态。
    - 复购、留存和投诉关闭指标公开程度不足，无法完整承保客户耐久性。
    - 上市前的股权结构细节、老股交易历史，以及任何稀释 / 优先权包袱仍不完整。
