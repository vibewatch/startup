- id: scenarios-comps
  title: Scenarios, comparables, and return logic
  body: Because boAt is still private as of 2026-08-02, scenario analysis is more important than precision. A bull case assumes stable category relevance, clean listing execution, mix improvement via premium lines, and sustained profitability. A base case assumes continued scale with moderate margin resilience and a fair rather than exuberant public multiple. A bear case assumes price pressure, service-quality drag, or governance overhang that compresses both performance and public-market appetite. Public comparables like Apple, Samsung, Garmin, and Logitech are useful as boundary markers, not direct pricing twins. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.
