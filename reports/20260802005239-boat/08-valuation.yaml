- id: pricing-context
  title: Current valuation context and entry discipline
  body: Public IPO-era reporting framed boAt around a roughly $1.4 billion to $1.6 billion valuation range. That range appears plausible in the sense that it confirms unicorn status and reflects brand scale, but it leaves limited room for complacency if governance questions linger or margin recovery proves shallow. Entry discipline should therefore center on the interaction between growth durability, channel quality, and market multiples for hardware-oriented comparables rather than on headline unicorn status alone. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.
