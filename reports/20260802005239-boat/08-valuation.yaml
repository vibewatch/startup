chapter:
  number: 8
  title: Valuation
  summary: 'boAt looks investable only with disciplined pricing: the company has real brand scale, profitability recovery, and IPO momentum, but its copyable categories, uneven support quality, and governance overhang argue for a fair-to-stretched view rather than an obvious bargain.'
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'The positive case for boAt is straightforward: it is a rare India-born consumer-hardware brand with national relevance, large category share, omnichannel reach, and evidence of renewed profitability. The anti-thesis is equally clear: many of its products sit in copyable, price-led categories where brand and channel execution can matter a lot but still fail to produce premium public-market multiples. The valuation question therefore is not whether boAt is real; it is whether public investors should pay up for a scaled hardware brand whose moat is commercial more than technical. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
