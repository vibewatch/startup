        title: 按严重度排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              单一最重要的承销事实是：boAt
              走向公开市场时，背后有真实的运营扭亏，也笼罩着公开的治理、控制和文件问题。治理疑云不会自动击穿业务，却会改变其他每一项风险的解读方式。供应链和品类压力重要，因为公司本质上仍是软件锁定有限的消费硬件运营商。服务质量重要，因为品牌驱动的首次购买，只有在购后信任改善后才真正耐久。正确的组合层面视角应是累积式的：boAt
              背负多项中到高风险，且风险可能彼此强化。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。
