      - number: '3.4'
        title: 竞争替代风险与可能改写格局的因素
        blocks:
          - type: paragraph
            body: >-
              最大的替代风险是叠加式的。本地玩家会从价格和渠道条款两端挤压 boAt，溢价玩家则会把消费者对功能和质量的预期往上拉。如果 boAt
              的高端化速度赶不上商品化蔓延，它可能守住份额，却失去利润率质量。反过来，只要本地化制造、线下执行、快速迭代周期和品牌驱动的陈列销售，让 boAt
              继续统治亲民中端市场，它仍能赢。战略问题在于：当本地性价比对手和全球生态从不同方向持续抬高门槛时，boAt
