      - number: '2.2'
        title: 规模、增长与品类动态
        blocks:
          - type: paragraph
            body: >-
              品类背景并非全面乐观，而是好坏参半。援引 IDC 的报道称，印度整体可穿戴设备市场 2024 年下滑 11.3%，至 119 million 台；2025 年又下滑 4%，至 114.2 million
              台。下滑高度集中在具体细分。智能手表出货大幅下跌，因为创新有限、折扣激烈和品牌整合削弱了消费者紧迫感。耳戴设备表现更稳。TWS 在更宽的可穿戴组合中提升份额，并继续是按出货量计算最大的子品类，因此 boAt
              以音频为重的模式，比过度押注超低价手表的公司更有结构位置。实际结论是，boAt 所处市场仍足以支撑规模，但已不再宽容到会奖励差异化弱或库存犯错的玩家。
