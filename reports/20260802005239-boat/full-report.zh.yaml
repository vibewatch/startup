    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品牌与运营版图
        blocks:
          - type: paragraph
            body: >-
              Imagine Marketing 以数字优先的印度消费电子公司身份运营 boAt 品牌，重心放在个人音频、可穿戴设备和移动配件。公开材料一致称，品牌由 Aman Gupta 和 Sameer Mehta 于
              2016 年创立，早期增长来自价格亲民但重视设计的耳机、线缆，随后延伸到 TWS 耳机。到 FY25，运营版图已扩展到智能手表、移动电源、音箱、条形音箱和相邻配件；IPO 阶段披露提到 SKU 超过 250
              个。线上走向全渠道是 boAt 故事的核心：boAt 仍有约 71% 销售来自线上，但管理层和 IPO 报道都强调线下网络持续扩张，覆盖 12,000 家零售店和 112
              家分销商。商业模式仍由消费硬件驱动，而不是软件驱动；品牌、渠道存在感和营运资本纪律，比自研操作系统或订阅收入更关键。
