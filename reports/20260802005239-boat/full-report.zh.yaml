  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              boAt 的市场边界并不是整个消费电子。实际边界是印度有品牌个人音频和可穿戴设备，再加上借用同一渠道关系和品牌承诺的相邻低客单价配件。音频仍是核心利润池：IPO 报道提到印度音频机会约 $6
              billion；IDC 和其他报道显示，印度可穿戴市场即便连续两年收缩，年出货量仍超过 100 million 台。因此，后续估值不能套用单一、夸大的标题式 TAM。更有纪律的看法，是把 boAt
              的核心和相邻业务分开。核心支出包括经电商和大众线下零售销售的 TWS 耳机、颈挂式耳机、头戴式耳机、蓝牙音箱、条形音箱、智能手表和配套充电配件。
