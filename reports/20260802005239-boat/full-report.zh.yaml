companyProfile:
  summary: >-
    Imagine Marketing Pvt. Ltd. 运营 boAt。boAt 是一家总部在新德里的消费电子品牌，2016 年由 Aman Gupta 和 Sameer Mehta
    创立。公司以设计驱动的大众品牌定位，销售从平价到轻高端的音频产品、智能手表、音箱、充电配件和周边设备。截至报告日期，boAt 仍未上市，但已推进到 SEBI 公开发行流程，公开报道指向约 $1.4B-$1.6B 的预期 IPO
    估值。FY25 披露显示收入约 Rs 3,073 crore，净利润约 Rs 61 crore，支撑一个判断：boAt 在计划上市窗口前已重回盈利。
  foundedDate: '2016-01-01'
  founders:
    - name: Aman Gupta
      role: 联合创始人
      background: 品牌的公众面孔，也是 boAt 面向年轻消费者的商业定位得以成形的重要推动者。
      claimRefs:
        - CO003
    - name: Sameer Mehta
      role: 联合创始人
      background: 与 Aman Gupta 共同创办公司，并长期深度参与产品方向和运营体系搭建。
      claimRefs:
        - CO003
  foundingLocation: New Delhi, India
  headquarters: New Delhi, India
  productSummary: boAt 销售 TWS 耳机、颈挂式耳机、头戴式耳机、音箱、条形音箱、智能手表、移动电源、充电器和周边配件，并由购物 app、配套 app，以及越来越本地化的制造和伙伴主导的产品集成提供支撑。
  customerFocus: 印度大众市场消费者，尤其是年轻、重视性价比的买家。他们寻找有品牌的个人音频设备、带通知 / 健身功能的可穿戴设备，以及低客单价配件。
  businessModel: 主要靠一次性硬件销售变现，渠道覆盖线上平台、D2C、线下零售和分销商，公开可见的经常性软件变现有限。
