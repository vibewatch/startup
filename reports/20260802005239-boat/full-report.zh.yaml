    blocks:
      - type: paragraph
        body: >-
          本报告基于 2026-08-02 报告运行期间抓取并留存的公开材料，包括公司官网页面、SEBI 申报页面、IPO 期间媒体报道、分析师市场份额评论、 应用商店条目、零售商页面和客户评论来源。运行日期时 boAt
          仍为私营公司，因此若干财务、留存和治理细节仍主要依赖推断，或资料不完整。
        claimRefs: []
      - type: callout
        calloutType: assumption
        title: 估值框架
        body: 本报告把广泛引用的 $1.4B-$1.6B 预期 IPO 区间作为最佳公开估值锚点，但不默认区间上沿天然合理。入场纪律取决于治理整改、利润率韧性和客户信任证据。
        claimRefs:
          - CV001
          - CV027
          - CV030
