      - number: '1.4'
        title: 里程碑、IPO 准备度与反向背景
        blocks:
          - type: paragraph
            body: >-
              boAt 的里程碑推进得异常紧凑。公司从 2016 年创立故事出发，做到全国平价音频领导者，随后扩展到可穿戴和更宽的配件，再在印度可穿戴市场降温时转向盈利与本地化叙事。FY25
              年，公司在成本控制、高端化、本地化和渠道多元化帮助下重回盈利。但同一个验证规模的 IPO 周期，也暴露了反向细节。更新版 DRHP
              报道和审计问题报道提到，提交给银行的陈述与账簿不一致、短期借款用于较长期用途、管理层薪酬超额、法定应缴款项问题，以及子公司控制弱点。由此形成的公司画像不是失灵公司，而是具备真实品类实力的规模品牌；在投资人把上市视为已降风险前，它仍需证明上市公司级别的内控、领导层连续性和干净的资本市场准备度。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。
