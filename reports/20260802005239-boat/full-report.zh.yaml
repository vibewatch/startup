      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              boAt 的可见优势是以亲民价格铺开足够宽的产品组合。其官方系列显示，耳机、头戴设备、可穿戴、音箱和配件覆盖很广，价格点也足以促成冲动购买。Apple 的 AirPods 和 Watch
              家族在价格和生态复杂度上远高于 boAt，并加入健康、ANC、空间音频和设备整合等利益点，boAt 无法端到端追平。Samsung 处在中间地带：生态耦合强于 boAt，设备杠杆更广，AI
              加持的音频和可穿戴体验也在扩展，但价格通常更高。Noise
              等印度本地同行攻击同一亲民价格区间，因此构成最危险的日常份额挑战。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。
