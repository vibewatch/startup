      - number: '2.3'
        title: 买家、用户、付款人与采用路径
        blocks:
          - type: paragraph
            body: >-
              boAt 主要卖给自费消费者，而不是企业买家。买家、用户和付款人通常是同一个人：年轻或中等收入的印度消费者，为听音乐、通话、通勤、健身记录或送礼购买一台价格亲民的设备。因此，采用路径很大程度受
              Amazon、Flipkart、D2C app、即时零售入口，以及 Croma、Vijay Sales 和区域电子卖场等线下连锁的陈列发现影响。预算来源是家庭可选消费，不是 IT
              部门。由此带来三个结果。第一，价格带极其重要。第二，渠道可见度和评分对转化的影响，几乎不亚于核心技术。第三，切换成本低、产品又不受合约绑定，因此更换周期可能很短。
