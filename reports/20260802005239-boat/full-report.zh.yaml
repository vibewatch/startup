  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与真正重要的对手
        blocks:
          - type: paragraph
            body: >-
              只有把所有音频或可穿戴品牌都当成可互换，boAt 的竞争集合才显得简单。现实中，boAt 至少面对四层竞争。第一层是 Noise、Boult、Fire-Boltt
              等本地性价比同行，它们争夺同一批印度消费者在音频和智能手表上的预算。第二层是 Apple 和 Samsung 等生态既有玩家，价格高于 boAt，却塑造了消费者对
              ANC、健康功能、生态整合和高端品牌的品类预期。第三层是 JBL、Beats 等专业音频玩家，它们靠声学可信度和设计竞争。第四层是现状替代：廉价无品牌配件、推迟更换，或消费者继续使用智能手机附带的音频方案。
