      - - 印度品牌规模和品类相关性
        - 份额领先、销量、全渠道触达
        - 份额或品牌相关性转弱
      - - 盈利修复
        - FY25 PAT 和 EBITDA 修复
        - 重回亏损或现金转化偏弱
      - - 商业护城河而非技术护城河
        - 广泛目录和渠道位置
        - 更强生态锁定效应的证据
      - - 治理 / 服务拖累
        - 审计标记报告和投诉模式
        - 明确整改并改善支持
    notes: 该表有意把上行逻辑和反向逻辑放在同一框架里。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV017
      - CV018
      - CV019
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 上市过程干净、高端化推进、利润稳定
        - 估值区间守住，或向上沿改善
        - 乐观预期下仍可能执行失误
        - 需要治理整改证据
      - - 基准
        - 规模守住、利润率温和、无重大意外
        - 公允价值接近报道区间中点
        - 如果利润率仍浅，上行有限
        - 从公开证据看最可能
      - - 悲观
        - 价格压力、治理拖累、支持问题
        - 倍数压缩到预期区间以下
        - 信任流失、需求走弱
        - 由监管文件或业绩受挫触发
    notes: 情景逻辑是定性的，因为公开数据集缺少足够细节，撑不起稳健 DCF。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV021
      - CV022
      - CV023
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Apple
        - 上市超大型消费科技公司
        - 极高规模 / 高端生态基准
        - 质量上限标尺
        - 不是直接可比对象
      - - Samsung Electronics
        - 上市多元电子龙头
        - 大规模上市基准
        - 可用于生态对比
        - 过于多元
      - - Garmin
        - 上市设备品牌
        - 品牌硬件参照
        - 更贴近设备经济性视角
        - 品类组合不同
      - - Logitech
        - 上市外设品牌
        - 品牌硬件参照
        - 可参考非手机生态耐久性
        - 渠道和地域不同
    notes: 可比对象只是参照框架，不是直接定价孪生。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV020
    enumerationScope:
      coverage: exhaustive
      basis: Exhaustive within the bounded four-company public comparable set used in this chapter.
  - id: TV005
    title: 逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 流程出现重大受挫
        - 新的未决治理问题或延期
        - 削弱信任和融资背景
        - 下调立场
      - - 盈利反转
        - 连续季度疲弱或利润率明显侵蚀
        - 打破修复逻辑
        - 重切估值
      - - 服务质量恶化
        - 投诉或关闭趋势显著恶化
        - 削弱复购和品牌信任
        - 提高折现率
      - - 高端化失败
        - 新品未改善组合
        - 封住利润率上行
        - 锚定低情景
    notes: 触发项设定为可从未来监管文件和经营更新中监测。
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV035
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 现金转化
        - 经营现金流和库存周转
        - 硬件业务只看 PAT 可能误导
        - 完整监管文件和管理层问答
      - - 分板块毛利率
        - 音频与可穿戴的经济性
        - 品类组合决定可比对象选择
        - 详细财务附表
      - - 保修成本和退货
        - 真实售后负担
        - 支持风险影响利润率和信任
        - 服务和财务数据复核
      - - 治理整改
        - 审计回应和控制计划
        - 倍数信心需要它支撑
        - 投行 / 法务 / 审计师尽调
    notes: 这些要求界定了提高承做信心所需的最低证据。
    claimRefs:
      - CV030
      - CV040
