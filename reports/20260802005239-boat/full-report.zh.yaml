      - number: '1.3'
        title: 融资、规模与股东基础
        blocks:
          - type: paragraph
            body: >-
              截至报告日期，boAt 还不是上市公司，但 IPO 流程让它已有接近公开市场的披露。SEBI 在 2025 年批准了保密申报路径，更新版 DRHP 概述了一笔 Rs 1,500 crore 的发行：Rs 500
              crore 新股发行，Rs 1,000 crore 老股出售。公开 UDRHP 报道还称，发行前两位创始人仍各自持有约四分之一股权，即便部分老股出售后，发起人影响力依然很强。对一个印度 D2C
              硬件品牌来说，规模指标已经相当可观：FY25 经营收入约 Rs 3,073 crore，销量超过 34 million 台，SKU 超过 250 个，并在有品牌个人音频中处于品类领先位置。如果预期的 $1.4B
              至 $1.6B IPO 估值落地，上述规模足以支撑独角兽身份；但估值仍是私募市场预期，还不是交易所检验后的公开市场标记。
