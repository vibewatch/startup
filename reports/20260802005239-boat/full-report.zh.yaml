      - number: '1.2'
        title: 创始人、领导层与治理过渡
        blocks:
          - type: paragraph
            body: >-
              公司身份仍紧贴 Aman Gupta 的公众形象和 Sameer Mehta 的产品主导式管理，但 2025 年底治理叙事出现实质变化。Indian Retailer 和 Economic Times
              报道显示，Gaurav Nayyar 出任 CEO，Sameer Mehta 转任执行董事，Aman Gupta 退出日常运营但仍以非执行董事身份关联公司。过渡很重要，因为 boAt
              过去高度依赖创始人主导的品牌建设、上新速度和渠道执行。IPO
              叙事因此同时包含职业化和关键人风险：公司似乎在接近公开市场时搭建更正式的管理结构，但外部投资人仍要为品牌认知深度绑定创始人的公司下注。投资者关系披露展现了
              上市前发行人的正式公司机器；同一份公开记录也凸显未解决的治理问题，包括内控、文件质量，以及创始人退出运营一线后执行力能否延续。
