  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              boAt
              的正面逻辑很直接：它是少见的印度本土消费硬件品牌，具备全国认知、大品类份额、全渠道触达，以及重新盈利的证据。反向逻辑也同样清楚：许多产品处在可复制、价格驱动的品类中，品牌和渠道执行很重要，却未必能换来溢价的公开市场倍数。因此，估值问题不是
              boAt
              是否真实，而是公开市场投资人是否应该为一个规模化硬件品牌支付高价；它的护城河更多是商业性的，而不是技术性的。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。
