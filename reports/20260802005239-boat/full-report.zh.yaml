      - number: '2.4'
        title: 增长动力、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的增长动力仍在印度本土：大众市场对平价无线音频的需求，一个历史上碎片化的配件市场继续品牌化，以及靠本地化或 JV 制造保护利润率的能力。Nirvana 等子品牌的高端化，也能抬高 ASP，而不用迫使 boAt
              直接与 Apple
              的生态定价竞争。但约束同样真实。智能手表需求疲弱。平价硬件品类很快商品化。依赖平台市场意味着促销算法和评分可能与设计同样重要。最后，公开品类估算来自多种方法，应当作观察镜头，而不是确定事实。因此，boAt
              的市场逻辑不是每个设备细分都在繁荣，而是以音频为主的价值型硬件仍有足够大盘；前提是渠道执行和品类组合纪律继续强。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。
