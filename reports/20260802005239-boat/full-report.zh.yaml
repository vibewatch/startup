              有足够市场证据，值得认真关注。但披露出来的利润率深度、生态锁定和治理干净程度还不够，不能仅因它是知名品牌就不计价格。最终尽调应聚焦现金转化、品类利润率、服务质量，以及申报中暴露的负面问题整改，然后再承销一个公开股票式回报情景。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。公开证据在部分细分指标上仍不完整，因此本节解读优先采用可交叉印证的信息，同时标出投资人还需追问的尽调问题和监测指标。
