- id: milestones-adverse
  title: Milestones, IPO readiness, and adverse context
  body: The milestone pattern is unusually compressed. boAt went from a 2016 founding story to national leadership in budget audio, then expanded into wearables and broader accessories, then pivoted into a profitability-and-localization narrative as the Indian wearables market cooled. FY25 marked a return to profitability, helped by cost control, premiumization, localization, and channel diversification. But the same IPO cycle that validated scale also surfaced adverse detail. Updated-DRHP reporting and audit-flag coverage described mismatches between statements given to banks and books of account, short-term borrowings used for longer-term purposes, excess managerial remuneration, statutory-dues issues, and subsidiary control weaknesses. The resulting company profile is not of a broken business; it is of a scaled brand with real category strength that still has to prove public-company grade controls, leadership continuity, and clean capital-markets readiness before investors should treat
    the listing as de-risked. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.
