- id: capital-scale
  title: Funding, scale, and shareholder base
  body: 'boAt is not yet a listed company as of the report date, but it has public-market style disclosures because of its IPO process. SEBI approved the confidential filing path in 2025, and the updated DRHP outlined a Rs 1,500 crore issue composed of a Rs 500 crore fresh issue and a Rs 1,000 crore offer-for-sale. Public UDRHP coverage also describes the founders as still holding roughly a quarter each of pre-offer equity, leaving promoter influence strong even after partial secondary sales. Scale metrics are substantial for an Indian D2C hardware brand: FY25 revenue from operations of about Rs 3,073 crore, more than 34 million units sold, 250-plus SKUs, and a category-leading position in branded personal audio. That scale is enough to support unicorn status if the expected $1.4 to $1.6 billion IPO valuation clears, but the valuation remains a private-market expectation rather than an exchange-cleared public mark.'
  claimRefs:
  - CO019
