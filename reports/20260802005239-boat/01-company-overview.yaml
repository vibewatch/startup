company:
  name: boAt
chapter:
  number: 1
  title: Company Overview
  summary: boAt is the consumer brand of Imagine Marketing, a still-private Indian audio and wearables company that reached IPO-ready scale by FY25, returned to profitability, and entered 2026 with SEBI-cleared listing plans but visible governance and execution questions after founder role changes and auditor flags.
sections:
- id: identity-model
  title: Identity, brand, and operating footprint
  body: 'Imagine Marketing operates the boAt brand as a digital-first Indian consumer-electronics company focused on personal audio, wearables, and mobile accessories. Public materials consistently describe the brand as founded in 2016 by Aman Gupta and Sameer Mehta, with early traction coming from affordable yet design-led earphones, cables, and later TWS earbuds. By FY25 the operating footprint had broadened into smartwatches, power banks, speakers, soundbars, and adjacent accessories, with more than 250 SKUs cited in IPO-era disclosures. The online-to-omnichannel transition is central to the story: boAt still generates roughly 71% of sales online, but management and IPO coverage emphasize an expanding offline network across 12,000 retail stores and 112 distributors. The business model remains consumer-hardware led rather than software led, with brand, channel presence, and working-capital discipline carrying more weight than proprietary operating systems or subscription revenue.'
  claimRefs:
