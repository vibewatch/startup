- id: manufacturing-quality
  title: Manufacturing, localization, and quality controls
  body: 'Public UDRHP summaries say roughly 75% of production had shifted to domestic manufacturing, supported by the Dixon joint venture Califonix Tech and an installed capacity around 30 million units per year. Quality control, however, is more mixed. The company advertises a 12+3 month warranty for purchases made through official surfaces, but customer-review sources show that after-sales performance is inconsistent in practice. That means product and operating quality should be judged in two layers: launch velocity and localization are strengths; warranty execution and service resolution remain weaker. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
  claimRefs:
  - CE019
  - CE020
