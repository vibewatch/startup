- id: differentiation-roadmap
  title: Differentiation, IP, and roadmap
  body: The most important differentiation is the combination of India-relevant price architecture, design-led branding, partner-integrated technology, and increasingly localized production. UDRHP-era reporting attributes 82 registered Indian trademarks, 25 non-Indian trademarks, 20 registered designs, one copyright, and 43 patents registered or pending to the company. More defensible in practice are channel feedback loops, product-refresh cadence, and the ability to deploy features quickly across many SKUs. The open risk is that many visible device features remain copyable by rivals using similar component ecosystems. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks
