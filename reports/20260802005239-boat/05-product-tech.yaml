chapter:
  number: 5
  title: Product & Technology
  summary: boAt is not a frontier deep-tech company, but it does have a meaningful product and operating stack built around fast-moving hardware design, companion apps, localization, and a broad catalog; the critical question is whether those capabilities amount to durable know-how or just efficient commercialization of commodity components.
sections:
- id: portfolio
  title: Product portfolio and user jobs
  body: 'boAt’s portfolio is deliberately broad. Official collections and app-store pages show the brand covering TWS earbuds, neckbands, headphones, Bluetooth speakers, soundbars, smartwatches, power banks, chargers, and gaming accessories. The user jobs are straightforward but large-volume: music, calls, commuting, fitness tracking, casual entertainment, gifting, and portable charging. What matters is how many use cases can be served with a single brand and price ladder. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
