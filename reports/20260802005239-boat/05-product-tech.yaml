- id: apps-architecture
  title: Apps, device software, and operating architecture
  body: 'boAt’s most visible software assets are its shopping, wearables, and hearables apps. The wearables app supports a long list of watch models and exposes activity tracking, notifications, SpO2, sleep, sports modes, and non-medical wellness functions. The hearables app emphasizes diagnostics, button customization, and OTA firmware updates. IPO coverage adds a higher-level architecture layer: boAt Labs, more than 100 engineers, Crest OS for wearables, AI/ML-enabled tracking, tokenized payments, and partner-led technology integration. The technology stack therefore looks real, but it is mostly productization and integration know-how rather than evidence of a unique consumer operating system moat. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
  claimRefs:
  - CE010
  - CE011
