  topStrengths:
    - "boAt has national-scale brand awareness in India across audio and wearables, with public evidence of leadership positions in core consumer categories."
    - "FY25 disclosures showed a return to profitability, improving the credibility of the pre-IPO story relative to earlier loss-making periods."
    - "The company combines strong online reach with a large offline network of retailers and distributors, reducing dependence on a single route to market."
    - "Localization and partner manufacturing progress can support cost control and improve resilience versus a fully import-dependent model."
    - "The expected IPO valuation range still leaves boAt firmly in unicorn territory, confirming substantial market recognition of the franchise."
  topRisks:
    - "Governance and disclosure issues surfaced in public filing coverage, including books-versus-bank discrepancies and other control concerns."
    - "The product categories are competitive and copyable, limiting the pricing power normally associated with software-led consumer platforms."
    - "Customer-review evidence shows recurring friction around replacements and after-sales service, which can weaken repeat purchase quality."
    - "boAt remains exposed to marketplace economics, working-capital needs, and the margin volatility common to consumer hardware."
    - "Leadership transition and founder step-back ahead of listing add execution risk during an important institutionalization phase."
  unresolvedGaps:
    - "Cash conversion, operating cash flow, and inventory-turn detail remain underdisclosed in the public record reviewed here."
    - "Segment-level gross margin, warranty cost, and route-to-market contribution margin data are still missing."
    - "The full remediation status for audit and disclosure concerns is not adequately visible from public reporting alone."
    - "Repeat-purchase, retention, and complaint-closure metrics are not public enough to fully underwrite customer durability."
    - "Cap-table detail, secondary history, and any dilution/preference overhang remain incomplete ahead of listing."
