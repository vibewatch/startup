companyProfile:
  summary: "Imagine Marketing Pvt. Ltd. operates boAt, a New Delhi-based consumer-electronics brand founded in 2016 by Aman Gupta and Sameer Mehta. The company sells affordable-to-affordable-premium audio products, smartwatches, speakers, charging accessories, and related devices under a design-led mass-market brand. As of the report date, boAt remained private but had progressed through SEBI's public-issue process, with public reporting pointing to a roughly $1.4B-$1.6B expected IPO valuation. FY25 disclosures showed revenue around Rs 3,073 crore and net profit around Rs 61 crore, supporting the view that boAt had returned to profitability before its planned listing window."
  foundedDate: "2016-01-01"
  founders:
    - name: "Aman Gupta"
      role: "Co-Founder"
      background: "Public face of the brand and a major commercial builder of boAt's youth-oriented consumer positioning."
      claimRefs: ["CO003"]
    - name: "Sameer Mehta"
      role: "Co-Founder"
      background: "Co-founded the business with Aman Gupta and has been closely associated with product direction and operating build-out."
      claimRefs: ["CO003"]
  foundingLocation: "New Delhi, India"
  headquarters: "New Delhi, India"
  productSummary: "boAt sells TWS earbuds, neckbands, headphones, speakers, soundbars, smartwatches, power banks, chargers, and related accessories, supported by shopping and companion apps plus increasingly localized manufacturing and partner-led product integration."
  customerFocus: "India mass-market consumers, especially younger and value-conscious buyers seeking branded personal audio, wearable notifications/fitness features, and low-ticket accessories."
  businessModel: "Primarily one-time hardware sales across online marketplaces, D2C, and offline retail/distributor channels, with limited visible recurring software monetization."
  stage: "Late Stage / Pre-IPO Private"
  fundingStatus: "Pre-IPO private company with updated DRHP/UDRHP filings and public reporting of a roughly $1.4B-$1.6B expected IPO valuation; key external investors include Warburg Pincus, Malabar Investments, Fireside Ventures, and Qualcomm."
  disclosureProfile: "private-disclosed"
  claimRefs: ["CO001", "CO002", "CO003", "CO005", "CO021", "CV001"]
summary:
  headline: "boAt is a scaled and now-profitable Indian consumer-hardware brand with real public-market potential, but governance overhang, service-quality friction, and category commoditization make it a price-disciplined track rather than a high-conviction buy."
