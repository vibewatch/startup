              FY25 profitability. But mitigants only matter if they are monitorable. A prudent investor should watch
              for: continued filing progress without fresh governance surprises; stable or rising profitability;
              evidence that premiumization lifts mix; and improvement in support quality. Clear thesis-break triggers
