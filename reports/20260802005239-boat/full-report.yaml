companyProfile:
  summary: >-
    Imagine Marketing Pvt. Ltd. operates boAt, a New Delhi-based consumer-electronics brand founded in 2016 by Aman
    Gupta and Sameer Mehta. The company sells affordable-to-affordable-premium audio products, smartwatches, speakers,
    charging accessories, and related devices under a design-led mass-market brand. As of the report date, boAt remained
    private but had progressed through SEBI's public-issue process, with public reporting pointing to a roughly
    $1.4B-$1.6B expected IPO valuation. FY25 disclosures showed revenue around Rs 3,073 crore and net profit around Rs
    61 crore, supporting the view that boAt had returned to profitability before its planned listing window.
