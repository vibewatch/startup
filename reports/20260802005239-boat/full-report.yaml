      - number: '7.2'
        title: Regulatory, legal, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk comes less from product bans than from issuer readiness and disclosure credibility. Public
              reporting around the updated DRHP flagged mismatches between books and bank statements, short-term
              borrowings used for longer-term purposes, unresolved subsidiary liabilities, statutory-dues and
              remuneration issues, and questions over document quality. SEBI’s acceptance of an updated filing does not
              erase those concerns; it only means the listing process continued. Warranty and returns terms are visible,
              but customer disputes suggest that legal language and operating reality may diverge. Public evidence
              remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated
