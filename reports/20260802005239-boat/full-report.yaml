      - number: '3.3'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in TWS and budget wearables are modest. Most consumers can replace one earbud brand with
              another without migrating data, changing contracts, or retraining workflows. boAt’s watch and hearables
              apps add some after-sale control, OTA updates, diagnostics, and personalization, but they do not create
              the same lock-in that Apple or Samsung achieve through broader device ecosystems. That said, boAt is not
              defenseless. Local brand recall, retailer shelf space, marketplace ranking history, price-ladder coverage,
              and a catalog broad enough to capture repeat purchases all create a practical but soft moat. In other
              words, boAt’s moat is commercial rather than technical. Public evidence remains incomplete on some
              sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the
              remaining diligence asks and monitoring indicators for an investor.
