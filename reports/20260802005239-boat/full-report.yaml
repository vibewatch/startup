      - number: '4.4'
        title: Financial verdict and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              The overall financial verdict is cautiously positive. boAt appears to have proven that it can stabilize
              margins, keep scale, and return to profit in a slowed market. At the same time, the public evidence
              remains incomplete on gross margin by segment, cash conversion, return rates, inventory turns, warranty
              costs, and cohort economics by channel. No reliable public burn or runway figure is available. Investors
