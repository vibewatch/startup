            body: >-
              Public IPO-era reporting framed boAt around a roughly $1.4 billion to $1.6 billion valuation range. That
              range appears plausible in the sense that it confirms unicorn status and reflects brand scale, but it
              leaves limited room for complacency if governance questions linger or margin recovery proves shallow.
