      - number: '1.2'
        title: Founders, leadership, and governance transition
        blocks:
          - type: paragraph
            body: >-
              The company’s identity is still closely tied to Aman Gupta’s public profile and Sameer Mehta’s product-led
              stewardship, but the governance story changed materially in late 2025. Indian Retailer and Economic Times
              reporting indicate that Gaurav Nayyar moved into the CEO role, Sameer Mehta shifted to executive director,
              and Aman Gupta stepped back from day-to-day operations while remaining associated as a non-executive
              director. That transition matters because boAt has historically relied on founder-led brand building,
              merchandising velocity, and channel execution. The IPO narrative therefore combines professionalization
              with key-person risk: the company appears to be building a more formal management structure precisely as
              it approaches public markets, yet outside investors still underwrite a brand whose recognition is deeply
              linked to its founders. Investor-relations disclosures show the formal corporate machinery of a pre-IPO
              issuer, but the same public record also highlights unresolved governance questions about controls,
              documentation quality, and the durability of execution after the founders’ operational step-back.
