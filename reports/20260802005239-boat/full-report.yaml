appendices:
  - id: A
    title: Methodology and Coverage Notes
    blocks:
      - type: paragraph
        body: >-
          This report is based on publicly available material fetched and retained during the 2026-08-02 report run,
          including official company pages, SEBI filing pages, IPO-era media coverage, analyst market-share commentary,
          app-store listings, retailer surfaces, and customer-review sources. boAt is still private on the run date, so
          several financial, retention, and governance details remain inference-heavy or incomplete.
        claimRefs: []
      - type: callout
        calloutType: assumption
        title: Valuation Framing
        body: >-
          The report treats the widely cited $1.4B-$1.6B expected IPO range as the best public valuation anchor, but it
          does not assume that the top end of that range is automatically justified. Entry discipline depends on
          governance cleanup, margin durability, and customer-trust evidence.
        claimRefs:
          - CV001
          - CV027
          - CV030
