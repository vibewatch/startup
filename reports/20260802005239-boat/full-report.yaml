        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              boAt’s visible advantage is price-accessible breadth. Its official collections show a wide range of
              earbuds, headphones, wearables, speakers, and accessories at price points where impulse-friendly buying is
              possible. Apple’s AirPods and Watch families sit far above boAt in price and ecosystem sophistication,
              adding health, ANC, spatial-audio, and device-integration benefits that boAt does not match end-to-end.
              Samsung occupies a middle space: stronger ecosystem coupling than boAt, broader device leverage, and
              expanding AI-enabled audio and wearable experiences, but often at higher prices. Local Indian peers such
              as Noise attack the same affordability zone and therefore make the most dangerous day-to-day share
              challenge. Public evidence remains incomplete on some sub-metrics, so the section interpretation
