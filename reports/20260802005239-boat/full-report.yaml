  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and who really matters
        blocks:
          - type: paragraph
            body: >-
              The competitor set only looks simple if every audio or wearable brand is treated as interchangeable. In
              reality boAt faces at least four layers of competition. First are local value peers such as Noise, Boult,
              and Fire-Boltt that compete for the same Indian consumer budgets in audio and smartwatches. Second are
              ecosystem incumbents such as Apple and Samsung whose products sit above boAt on price but shape category
              expectations for ANC, health features, ecosystem integration, and premium branding. Third are specialist
              audio players such as JBL and Beats that compete on acoustic credibility and design. Fourth is the status
              quo: cheap unbranded accessories, delayed replacement, or consumers using smartphone-included audio
              alternatives.
            claimRefs:
