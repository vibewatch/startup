  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The single most important underwriting fact is that boAt is approaching public markets after a real
              operating turnaround but under a cloud of public governance, control, and documentation questions. That
              does not automatically break the business, yet it changes how every other risk should be read. Supply
              chain and category pressure matter because this is still a consumer-hardware operator with limited
              software lock-in. Service quality matters because brand-led first purchases are only durable if
              post-purchase trust improves. The right portfolio-level view is cumulative: boAt carries multiple
              medium-to-high risks that can reinforce one another. Public evidence remains incomplete on some
              sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the
              remaining diligence asks and monitoring indicators for an investor.
