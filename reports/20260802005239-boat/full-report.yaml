              boAt monetizes hardware sales across audio, wearables, and accessories. Public FY25 mix disclosures show
              audio still dominant at roughly 84% of revenue, with wearables around 11% and other products around 5%.
              The public revenue anchor used in this report is roughly Rs 3,073 crore of FY25 revenue from operations,
              while some media-release style coverage cites a slightly higher consolidated top line around Rs 3,098
              crore. The important point is that revenue stayed roughly flat through the turnaround, so the improvement
              in profit quality came from cost structure and mix rather than explosive topline growth. Public evidence
              remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated
