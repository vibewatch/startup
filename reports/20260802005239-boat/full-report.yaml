              localization, and more disciplined spending. Moneycontrol’s IPO analysis also described stock-in-trade
              purchases falling as a percentage of revenue, which supports the cost-control story. Yet this is still a
              working-capital-hungry consumer-hardware business: inventory, channel funding, marketing, and new-product
