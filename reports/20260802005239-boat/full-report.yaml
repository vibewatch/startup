      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              boAt sells mostly to self-paying consumers rather than enterprise buyers. The buyer, user, and payer are
              usually the same person: a young or middle-income Indian consumer purchasing an affordable device for
              music, calls, commuting, fitness tracking, or gifting. Adoption is therefore strongly shaped by
              merchandised discovery on Amazon, Flipkart, D2C apps, quick-commerce surfaces, and increasingly offline
              chains such as Croma, Vijay Sales, and regional electronics outlets. The budget owner is discretionary
              household spending, not an IT department. That creates three consequences. First, price bands matter
              enormously. Second, channel visibility and ratings influence conversion almost as much as core technology.
              Third, replacement cycles can be short because switching costs are low and the product is not
              contract-bound.
