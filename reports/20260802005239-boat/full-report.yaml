  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              For boAt, the relevant market is not all consumer electronics. The practical boundary is Indian branded
              personal audio and wearables, plus adjacent low-ticket accessories that ride the same channel
              relationships and brand promise. Audio remains the core economic pool: IPO coverage cited a roughly $6
              billion Indian audio opportunity, while IDC and related coverage show India’s wearables market at over 100
              million annual units even after two years of contraction. That means later valuation should not use a
              single inflated headline TAM. A disciplined lens separates boAt’s core from adjacencies. Core spend
              includes TWS earbuds, neckbands, headphones, Bluetooth speakers, soundbars, smartwatches, and related
              charging accessories sold through e-commerce and mass offline retail.
