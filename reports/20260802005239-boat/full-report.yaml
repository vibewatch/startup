      - number: '2.4'
        title: Growth drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are still local to India: mass-market demand for affordable wireless audio,
              ongoing brand formalization inside a historically fragmented accessory market, and the ability to use
              localization or JV manufacturing to protect margins. Premiumization through sub-brands such as Nirvana can
              also lift ASPs without forcing boAt to compete directly with Apple’s ecosystem pricing. But the
              constraints are just as real. Smartwatch demand is weak. Budget hardware categories commoditize quickly.
              Marketplace dependence means promotional algorithms and ratings can matter as much as design. Finally,
              public category estimates come from multiple methodologies and should be treated as lenses rather than
              certainties. The market case for boAt is therefore not that every device segment is booming; it is that
              audio-led value hardware is still large enough to support scale if channel execution and assortment
