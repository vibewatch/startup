              marketplaces, and offline distribution partners. That creates concentration risk even without a single
              dominant supplier being publicly named. Localization via JV manufacturing is strategically positive, but
              localized production still depends on execution discipline, quality consistency, and working-capital
              health. Operational risk is therefore best understood as a chain risk: product planning, procurement,
