- id: sizing-dynamics
  title: Sizing, growth, and category dynamics
  body: The category backdrop is mixed rather than uniformly bullish. IDC-linked coverage says India’s total wearable-device market declined 11.3% in 2024 to 119 million units and then another 4% in 2025 to 114.2 million units. The decline is highly segment-specific. Smartwatch shipments fell sharply because limited innovation, intense discounting, and brand consolidation weakened consumer urgency. Earwear held up better. TWS gained share within the broader wearables mix and remained the largest subsegment by shipments, giving boAt’s audio-heavy model a better structural position than companies that leaned too hard into ultra-budget watches. The practical conclusion is that boAt operates in a market that is still large enough to support scale, but no longer forgiving enough to reward weak differentiation or inventory mistakes.
