chapter:
  number: 4
  title: Financials
  summary: boAt returned to profit in FY25, but the public financial picture still reads like a consumer-hardware turnaround story driven by mix, cost control, and working-capital discipline rather than a clean, software-like compounding machine; that makes capital structure, channel economics, and control quality central to underwriting.
sections:
- id: revenue-model
  title: Revenue model and mix
  body: boAt monetizes hardware sales across audio, wearables, and accessories. Public FY25 mix disclosures show audio still dominant at roughly 84% of revenue, with wearables around 11% and other products around 5%. The public revenue anchor used in this report is roughly Rs 3,073 crore of FY25 revenue from operations, while some media-release style coverage cites a slightly higher consolidated top line around Rs 3,098 crore. The important point is that revenue stayed roughly flat through the turnaround, so the improvement in profit quality came from cost structure and mix rather than explosive topline growth. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.
