- id: profitability-working-capital
  title: Profitability path and working-capital needs
  body: 'The FY25 turnaround is real, but investors should read it carefully. Public coverage cites PAT of roughly Rs 61 crore and EBITDA around Rs 142 crore, with margin recovery helped by lower procurement intensity, localization, and more disciplined spending. Moneycontrol’s IPO analysis also described stock-in-trade purchases falling as a percentage of revenue, which supports the cost-control story. Yet this is still a working-capital-hungry consumer-hardware business: inventory, channel funding, marketing, and new-product cycles all matter. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
