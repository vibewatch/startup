- id: capital-adequacy
  title: Capital adequacy and IPO dependence
  body: 'The public record is good on intended uses of proceeds and poor on cash-on-hand. The updated IPO plan reserved fresh capital mainly for working capital, marketing, and general corporate purposes, which implies that the company wants more balance-sheet flexibility even after returning to profitability. Adverse filing coverage connected financial reporting issues to the capital story itself: mismatches in bank submissions, short-term borrowings used for long-term purposes, and subsidiary-liability concerns all suggest that financing quality deserves as much diligence as revenue growth. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
