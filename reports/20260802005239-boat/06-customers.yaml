- id: customer-proof
  title: Customer proof and diligence verdict
  body: 'The best public proof of customer traction is scale: millions of units sold, consistent market-share leadership in India audio, a recognizable youth brand, and survival through a brutal price-competitive market. The weakest part of the customer story is not reach but resolution quality after purchase. That gap matters because customer trust is what converts brand-led first purchases into resilient repeat behavior. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence
