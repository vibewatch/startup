- id: acquisition-channels
  title: Acquisition, channel mix, and conversion surfaces
  body: Public sources point to a strong online acquisition engine supplemented by large offline coverage. FY25 channel commentary cited roughly 71% online sales, while UDRHP summaries referenced more than 12,000 retailers and 112 distributors. Official D2C surfaces, marketplaces, retail shelves, influencer campaigns, and brand collaborations all appear to feed discovery. Customer acquisition therefore seems broad and efficient, but not necessarily owned in the sense of a subscription SaaS funnel. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.
