chapter:
  number: 6
  title: Customers
  summary: 'boAt’s customer system is broad, youthful, and price-sensitive: the brand wins on relevance, value, and availability, but public evidence also shows uneven post-purchase satisfaction, meaning customer love is real yet not frictionless.'
sections:
- id: segments
  title: Customer segments and jobs-to-be-done
  body: 'boAt serves a mass-market Indian consumer base spanning students, young professionals, commuters, first-time smartwatch buyers, and gift-oriented buyers. The product set maps to simple daily jobs: affordable personal audio, notifications and light fitness tracking, low-ticket entertainment upgrades, and charging utility. Shark Tank-era founder branding and youth-oriented marketing helped boAt become legible to mainstream consumers, not just gadget enthusiasts. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
