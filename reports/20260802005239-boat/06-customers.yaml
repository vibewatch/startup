- id: retention-sentiment
  title: Retention proxies, reviews, and sentiment
  body: 'There is no robust public retention dashboard, so customer quality must be inferred from app reviews, review-site commentary, repeat-category breadth, and brand mindshare. App-store surfaces show large install and rating footprints, while review platforms present a mixed experience: customers like design, price, and features, but service and replacement handling generate recurring complaints. That pattern supports a nuanced view—boAt is a loved brand with a support burden, not a universally trusted premium operator. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
