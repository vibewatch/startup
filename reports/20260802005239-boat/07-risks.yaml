chapter:
  number: 7
  title: Risks
  summary: boAt’s risk profile is dominated by governance and financial-control issues, category commoditization, service-quality friction, and dependence on channels and suppliers; none is necessarily fatal alone, but together they justify a high rather than medium risk rating ahead of IPO.
sections:
- id: ranked-risks
  title: Severity-ranked risk picture
  body: 'The single most important underwriting fact is that boAt is approaching public markets after a real operating turnaround but under a cloud of public governance, control, and documentation questions. That does not automatically break the business, yet it changes how every other risk should be read. Supply chain and category pressure matter because this is still a consumer-hardware operator with limited software lock-in. Service quality matters because brand-led first purchases are only durable if post-purchase trust improves. The right portfolio-level view is cumulative: boAt carries multiple medium-to-high risks that can reinforce one another. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  figureRefs:
  - FR001
- id: regulatory-legal
  title: Regulatory, legal, and disclosure risk
  body: Regulatory risk comes less from product bans than from issuer readiness and disclosure credibility. Public reporting around the updated DRHP flagged mismatches between books and bank statements, short-term borrowings used for longer-term purposes, unresolved subsidiary liabilities, statutory-dues and remuneration issues, and questions over document quality. SEBI’s acceptance of an updated filing does not erase those concerns; it only means the listing process continued. Warranty and returns terms are visible, but customer disputes suggest that legal language and operating reality may diverge. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  tableRefs:
  - TR001
- id: operational-dependencies
  title: Operational and dependency risk
  body: 'boAt depends on a large portfolio, partner manufacturing, external component ecosystems, online marketplaces, and offline distribution partners. That creates concentration risk even without a single dominant supplier being publicly named. Localization via JV manufacturing is strategically positive, but localized production still depends on execution discipline, quality consistency, and working-capital health. Operational risk is therefore best understood as a chain risk: product planning, procurement, manufacturing, channel sell-through, and service quality can each transmit stress into margins and brand trust. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
