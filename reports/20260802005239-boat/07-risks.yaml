- id: mitigations-triggers
  title: Mitigations, triggers, and thesis-break conditions
  body: 'The company has real mitigants: scale, brand recognition, distributor reach, localization, and evidence of FY25 profitability. But mitigants only matter if they are monitorable. A prudent investor should watch for: continued filing progress without fresh governance surprises; stable or rising profitability; evidence that premiumization lifts mix; and improvement in support quality. Clear thesis-break triggers would include renewed losses from price competition, material disclosure setbacks in the IPO process, worsening audit or compliance issues, or customer-service degradation that starts to dent category share. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence asks and monitoring indicators for an investor. Public evidence remains incomplete on some sub-metrics, so the section interpretation prioritizes what can be corroborated while flagging the remaining diligence
