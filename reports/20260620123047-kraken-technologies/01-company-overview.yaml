company:
  name: Kraken Technologies
chapter:
  number: 1
  title: Company Overview
  summary: 'Kraken Technologies is a standalone utility operating system company spun out of Octopus Energy Group on 29 December 2025 so it could operate with its own cap table, governance, and enterprise-sales agenda. The company is now led by CEO Amir Orad and CFO Tim Wan, while Octopus Energy Group remains an influential 13.7% shareholder and Kraken''s largest client. Kraken sells a cloud-native platform spanning billing, CRM, DER orchestration, and field operations. Publicly disclosed scale is already exceptional for infrastructure software: 90M+ customer accounts, 15+ countries, $500M+ contracted ARR, 500,000+ connected devices, and 15B daily data points. The primary diligence questions now shift from product proof to concentration, disclosure depth, and governance independence.'
sections:
- id: section-1
  title: Identity and business model
  body: 'Kraken Technologies should be analyzed as a utility software platform, not as Octopus Energy''s retail supply arm. The business was incubated inside Octopus Energy from 2016 onward, where it was built to run complex retail billing, CRM, smart-meter workflows, and flexibility dispatch at scale. The 29 December 2025 demerger formalized Kraken as an independent company with its own governance and capital base while preserving a close commercial relationship with Octopus, which remains both a meaningful shareholder and the platform''s largest reference customer. Kraken''s economic model is B2B platform licensing: utilities pay to replace or modernize core customer operations, while Kraken cross-sells adjacent modules for asset orchestration and field service management. This model is strategically different from retail energy because revenue is driven by multi-year software deployments, migration services, and recurring platform usage rather than commodity gross margin. Kraken''s stated
    mission to improve one billion lives underscores the ambition to become a horizontal operating system for utilities across energy, water, and broadband rather than remain a captive internal tool.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO031
  - CO032
  - CO033
  - CO034
  figureRefs:
  - FO002
- id: section-2
  title: Leadership and governance
  body: 'The post-spinout leadership structure is one of the clearest signals that Kraken is meant to operate as a true enterprise software company. Amir Orad serves as CEO and Tim Wan as CFO, creating a management team explicitly separate from Octopus retail. Greg Jackson remains strategically influential because he created Kraken inside Octopus, is still the best-known external evangelist for the platform, and controls the relationship with Kraken''s largest shareholder-customer base. James Eddison remains important as the original platform architect and as the technologist most closely associated with Kraken''s design principles. This leadership configuration brings both strength and residual dependency risk: Kraken now has dedicated SaaS leadership, but product narrative, customer credibility, and ecosystem access still lean heavily on the Octopus founding team. Public disclosures show the company has its own governance, yet they do not publish a full board roster, committee structure,
    or detailed reserved matters for D1, Teachers'' Venture Growth, or Octopus. That means independence is directionally credible but not fully underwritten from public sources alone.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO032
  - CO036
  - CO037
  tableRefs:
  - TO002
- id: section-3
  title: Capital structure and investors
  body: 'Kraken''s December 2025 financing was large enough to reposition the company from internal platform spinout to global infrastructure-software contender. The Series B raised roughly $1 billion at an $8.65 billion valuation and was led by D1 Capital Partners, with Fidelity International, Durable Capital Partners, and Teachers'' Venture Growth among the named backers. Octopus Energy Group retained 13.7% ownership after the demerger, preserving both strategic alignment and a visible related-party dynamic. Origin Energy also remained economically aligned through its pre-existing relationship with Octopus and Kraken''s Australian deployment footprint. Public reporting indicates the financing combined direct Kraken equity purchases with a parallel $320 million injection into Octopus Capital, an unusual structure that matters because it shows investor appetite was distributed across the platform company and the wider Octopus ecosystem. What is still missing is the detailed cap table: liquidation
    preferences, employee option pool, board seat allocation, and any commercial rights granted to Octopus or anchor customers are not publicly disclosed. For diligence purposes, Kraken now looks like a late-stage growth software company with infrastructure-like reference customers but only partially transparent governance economics.'
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO032
  - CO037
  tableRefs:
  - TO003
- id: section-4
  title: Scale metrics and operating footprint
  body: 'Kraken''s operating metrics are unusually strong for a private utility software company and help explain why investors were willing to finance it at an elevated multiple. At spinout the company disclosed more than 70 million contracted accounts and $500 million contracted annual recurring revenue, up roughly fourfold in three years. By mid-2026 the corporate website reported more than 90 million customer accounts across 15+ countries, with up to 15GWh of energy managed daily and approximately 15 billion new data points processed every day. The platform''s client-reported outcomes are also central to the story: Kraken advertises an 85% client NPS, over 40% greater operational efficiency for utility customers, and 3x improved customer satisfaction. The flexibility layer adds another moat signal, with 500,000+ connected devices and 2GW under management. These metrics matter because they show Kraken is not an early-stage proof of concept; it is a scaled operating system already trusted
    by major utilities such as EDF, E.ON Next, Origin Energy, National Grid, Tokyo Gas, Plenitude, Portsmouth Water, and Cuckoo Broadband. The remaining diligence challenge is not whether the platform has scale, but how much of that scale is concentrated in a few anchor clients and how durable the economics are by customer cohort.'
  claimRefs:
