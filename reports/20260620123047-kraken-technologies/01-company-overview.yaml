- id: section-5
  title: Milestones and strategic evolution
  body: 'Kraken''s timeline shows a transition from internal capability to independent platform company. Greg Jackson and James Eddison began building the system inside Octopus in 2016 to solve retail billing and customer-service pain points that legacy utility software handled poorly. The next strategic inflection came when Kraken started licensing externally, turning operational proof from Octopus''s own supply business into a B2B sales asset. Expansion into Origin Energy, EDF, E.ON Next, Tokyo Gas, and later National Grid demonstrated that the platform could travel across geographies and regulatory environments. The May 2025 National Grid agreement broadened reference quality because it attached Kraken to a large regulated US utility footprint. The 29 December 2025 spinout and $1 billion Series B were the decisive milestones: they separated Kraken''s valuation logic from Octopus retail, recruited dedicated SaaS leadership, and gave the company a balance sheet suitable for long sales cycles
    and global implementations. Strategically, Kraken is now best understood as a category-defining utility operating system with live proof points across customer operations, distributed energy orchestration, and adjacent verticals such as water and broadband.'
