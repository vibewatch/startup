- id: section-3
  title: Buyer dynamics procurement and switching costs
  body: 'Kraken sells into one of the slowest but potentially most durable enterprise buying motions in software. The effective buyer is usually a utility CTO, COO, chief customer officer, or CEO, with finance, operations, customer-service, security, and regulatory teams all involved in approval. Because billing and customer systems are deeply embedded in the operating model, procurement cycles can last two to five years from initial RFP to full migration. The burden is not just vendor selection; it includes data migration, tariff-rule reconfiguration, meter integration, regulator sign-off, and customer-service retraining. That complexity is a headwind for new logo acquisition, but it also creates powerful retention once a platform is live. Buyers do not casually rip out a customer-information and flexibility stack that runs millions of accounts. Kraken''s strongest selling asset is reference quality: Octopus provides live proof at scale, and named accounts such as EDF, E.ON Next, National
    Grid, and Tokyo Gas reduce perceived execution risk. However, procurement committees will still scrutinize cyber assurance, migration tooling, country localization, and the degree of dependence on Octopus-origin use cases before awarding a full core-platform mandate.'
