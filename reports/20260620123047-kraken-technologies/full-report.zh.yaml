  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 独立收入模型与确认逻辑
        blocks:
          - type: paragraph
            body: >-
              分析 Kraken Technologies，应该把它看作软件平台，而不是零售能源供应商。核心变现是按账户收取 SaaS 许可费，由在平台上运行客户、计费和运营流程的公用事业公司支付。这与 Octopus
              Energy 大宗商品转手式零售业务形成完全不同的收入画像。公开证据显示，收入组合以经常性软件费为主，专业服务和迁移支持作为大型部署的次要收入流。最重要的会计和尽调问题，是已确认收入与签约 ARR
              的差异。Octopus 披露 FY24 Kraken 收入为 £90M，而拆分后 Kraken 后来披露签约 ARR 超过
              $500M，说明已签客户很可能会随着迁移上线和模块扩展，在一段时间内逐步转化为完整收入。这种爬坡逻辑符合公用事业软件的长实施周期，也解释了为何头部合同价值可以远高于当期已确认收入。
