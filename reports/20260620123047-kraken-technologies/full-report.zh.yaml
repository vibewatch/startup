chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              分析 Kraken Technologies，应该把它看作公用事业软件平台，而不是 Octopus Energy 的零售供电部门。业务自 2016 年起在 Octopus Energy
              内部孵化，初衷是大规模跑通复杂零售计费、CRM、智能电表流程和灵活性调度。2025 年 12 月 29 日拆分后，Kraken 正式成为拥有独立治理和资本基础的公司，同时保留与 Octopus
              的紧密商业关系；Octopus 仍是重要股东，也是该平台最大的标杆客户。Kraken 的经济模型是 B2B 平台许可：公用事业公司付费替换或现代化改造核心客户运营系统，Kraken
              再交叉销售资产编排和现场服务管理等相邻模块。它与零售能源的战略差异在于，收入来自多年期软件部署、迁移服务和经常性平台使用，而不是大宗商品毛利。Kraken
              所称改善十亿人生活的使命，凸显其野心不是停留在自用内部工具，而是成为能源、水务和宽带等公用事业的横向操作系统。
