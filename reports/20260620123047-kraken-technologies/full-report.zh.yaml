      - number: '1.5'
        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >-
              Kraken 的时间线展示了从内部能力到独立平台公司的转变。Greg Jackson 和 James Eddison 2016 年开始在 Octopus
              内部搭建系统，解决旧公用事业软件难以处理的零售计费和客服痛点。下一个战略拐点是 Kraken 开始对外授权，把 Octopus 自身供电业务的运营验证转化为 B2B 销售资产。进入 Origin
              Energy、EDF、E.ON Next、Tokyo Gas，后来再进入 National Grid，证明平台可以跨地域和监管环境复制。2025 年 5 月的 National Grid 协议提升了标杆质量，因为
              Kraken 进入了大型受监管美国公用事业版图。2025 年 12 月 29 日拆分和 $1B Series B 是决定性里程碑：它们把 Kraken 的估值逻辑与 Octopus 零售业务切开，引入专职
              SaaS 领导层，并给公司提供了足以支撑长销售周期和全球实施的资产负债表。战略上，Kraken
              现在更应被理解为一个定义品类的公用事业操作系统，在客户运营、分布式能源编排，以及水务和宽带等相邻垂直领域都有在跑的验证点。
