  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 拆分执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              Kraken 最核心的独立经营风险在于，它距离 2025 年 12 月从 Octopus Energy Group 拆分出来只有几个月。市场已经给 Kraken 标出 $8.65 billion
              估值，管理层也把它包装成独立的公用事业操作系统，但公开证据里，成熟的独立治理仍然偏薄。投资人知道新的管理团队、大致股权结构表和 Series B 轮的主承销阵容；但还不知道过渡服务有多深、财务和 HR
              系统何时彻底切开，也不知道哪些机制能防止一个持股 13.7% 且最大客户的股东主导路线图决策。这个问题重要，因为 Kraken
              的产品不是边缘分析工具；它是任务关键平台，碰到账单、催收、现场运营和灵活性调度。这个规模的分拆可以成功，但独立初期恰恰是董事会监督、内部控制和决策权最容易被模糊地带侵蚀的时候。尽管 Amir Orad 现在负责
              Kraken 日常运营，Greg Jackson 对 Octopus-Kraken 叙事的持续重要性，仍然放大了关键人物风险。
