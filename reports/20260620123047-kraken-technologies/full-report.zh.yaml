      - number: '5.5'
        title: 信任、安全与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Kraken 的公开信任姿态方向上正面，但对一个运行计费和电网边缘流程的平台来说，仍薄于保守基础设施投资人通常想看的证据。公司声称具备或对齐 ISO/IEC 27001，并突出客户
              NPS，但公开资料集没有清楚说明认证范围、已审计控制、可用性历史，或已具名 SLA 承诺。细节缺失不否定产品强度，却很重要，因为 Kraken
              正把关键客户运营和分布式资产编排集中到一套共享云平台上。同一套共享代码库能加快发布速度，也可能让严重缺陷迅速扩散到装机基础；对 AWS 的依赖也把基础设施风险集中在单一 hyperscaler
              关系上。因此，核心尽调追问不是 Kraken 是否技术成熟——它是——而是公司是否发布了足够的韧性、安全运营和变更管理纪律证据，匹配它如今控制的流程规模。
            claimRefs:
              - CE022
              - CE033
              - CE034
              - CE035
              - CE036
