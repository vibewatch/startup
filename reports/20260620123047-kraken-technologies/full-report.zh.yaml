      - number: '2.3'
        title: 买方动态、采购与切换成本
        blocks:
          - type: paragraph
            body: >-
              Kraken 切入的是软件里最慢、但潜在最耐久的企业采购动作之一。实际买方通常是公用事业公司的 CTO、COO、首席客户官或
              CEO，财务、运营、客服、安全和监管团队都会参与审批。计费和客户系统深嵌运营模型，采购周期从初始 RFP
              到完整迁移可能持续两到五年。负担不只是选供应商，还包括数据迁移、费率规则重配、电表集成、监管签核和客服再培训。这种复杂性拖累新 logo
              获取，但平台上线后也形成强留存。买方不会轻易拆掉一套承载数百万账户的客户信息和灵活性技术栈。Kraken 最强的销售资产是标杆质量：Octopus 提供规模化实时验证，EDF、E.ON Next、National
              Grid 和 Tokyo Gas 等已具名账户降低了感知执行风险。不过，采购委员会在授予完整核心平台项目之前，仍会审查网络安全保证、迁移工具、国家本地化，以及对 Octopus 源用例的依赖程度。
