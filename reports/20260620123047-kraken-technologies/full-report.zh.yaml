      - number: '1.4'
        title: 规模指标与运营足迹
        blocks:
          - type: paragraph
            body: >-
              作为一家私有公用事业软件公司，Kraken 的运营指标异常强，也解释了投资人为何愿意给出高倍数融资。拆分时公司披露签约账户超过 70M，签约年度经常性收入 $500M，三年内约增长四倍。到 2026
              年中，公司官网披露客户账户超过 90M、覆盖 15+ 个国家，每天管理最多 15GWh 能源，并处理约 15B 个新增数据点。客户披露的成果同样是故事核心：Kraken 宣称客户 NPS 为
              85%，公用事业客户运营效率提升超过 40%，客户满意度提升 3x。灵活性层又增加护城河信号，已有 500,000+ 台已连接设备和 2GW 管理规模。这些指标重要，是因为它们说明 Kraken
              不是早期概念验证，而是已获 EDF、E.ON Next、Origin Energy、National Grid、Tokyo Gas、Plenitude、Portsmouth Water 和 Cuckoo
              Broadband 等大型公用事业信任的规模化操作系统。剩下的尽调难点不是平台有没有规模，而是这些规模有多少集中在少数锚定客户，以及不同客户队列的经济性有多耐久。
