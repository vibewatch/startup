            body: >-
              Kraken 应被分析为完整公用事业操作系统，而不是狭义计费工具。公司把套件组织为 Kraken Customer、Kraken Asset 和 Kraken
              Field，三者共同覆盖现代公用事业的商业和运营流程。Kraken Customer 最贴近终端账户持有人：处理开户、CRM、计费、直接借记管理、服务流程和对外数字沟通。Kraken Asset
              是分布式能源资源的编排层，包括智能 EV 充电、热泵优化、电池和灵活性市场参与。Kraken Field 把平台延伸到智能电表排期和技师调度等实体运营。这个模块划分在战略上重要，因为 Kraken
              销售的是流程转型假设：公用事业公司可以用一个共享运营环境替换碎片化旧技术栈，把客服、费率执行、电网边缘设备和现场运营连起来，而不是拼接分散的点状系统。
