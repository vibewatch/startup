      - number: '7.3'
        title: 监管、隐私与平台韧性风险
        blocks:
          - type: paragraph
            body: >-
              Kraken 所处的是企业软件里最不宽容的环境之一：受监管的公用事业客户运营。2025 年 Ofgem 对 Octopus 的行动很重要，因为它说明，Kraken
              运营范围内的账单控制问题，可能演变成强制客户退款、财务处罚和声誉审查。即便受监管主体在法律上是客户，这个先例也抬高了 Kraken 未来出错的代价。同时，Kraken 的增长拉宽了隐私暴露面。英国和欧盟 GDPR
              义务关系到欧洲账户，APPI 关系到日本，美国州级隐私规则则关系到客户数据处理。平台集中在 AWS
              上，又增加了一层共因风险：严重宕机或安全故障可能同时影响多个客户。公开材料在愿景和规模上很强，但对承载如此多客户和账单数据的平台来说，买方或投资人通常想看到的韧性、认证和灾备细节仍然不足。对受监管软件供应商而言，保证材料缺位本身就是风险信号。
            claimRefs:
