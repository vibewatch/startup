            body: >-
              Kraken 的经济性在结构上优于公用事业零售经济性，因为经常性软件收入应有高得多的毛利率，也大幅降低大宗商品敞口。公开资料未披露独立毛利率，但软件许可、Octopus 集团内部 FY24 盈利和私有 SaaS
              基准组合起来，支持这样一个判断：许可层充分规模化后毛利率可超过 70%。切换成本也异常有利。公用事业公司很少快速重构核心 CIS
              和运营系统，因为它们面临监管、数据和客服风险。这种动态支撑长客户生命周期，也让净收入留存超过 100% 的判断可信，即便没有公开披露。主要保留意见是，最强的单位经济性结论仍是推断，而非公司报告。公开资料没有
              churn、队列扩张或实际定价文件，因此耐久性更多建立在市场结构和合同逻辑上，而不是已披露 KPI 序列上。
