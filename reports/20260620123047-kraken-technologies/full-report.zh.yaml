      - number: '8.3'
        title: 乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析是判断当前估值最干净的方法。乐观情景下，Kraken 继续拿下大型公用事业客户，账户规模向 150 million 推进，并把这块覆盖面转化为 $750 million 到 $1 billion 的
              ARR，同时说服公开市场或战略买方把它按稀缺垂直 SaaS 定价。这可以支撑大约 $15 billion 到 $20 billion 的估值。基准情景更克制：ARR 三年内升至约 $750
              million，客户数达到约 120 million，市场给出仍有溢价但不狂热的 15x 倍数，对应价值略高于今天的估值，约 $11.25
              billion。悲观情景里，集中度、竞争、监管或披露失望开始发挥作用。如果增长放缓、旗舰客户动摇，或公司看起来仍像实施服务很重的混合平台，那么以 $500 million 到 $600 million ARR 套
              8x 区间，估值可能被拉低到 $4 billion 到 $5 billion。这个区间足够宽，投资人应该用情景概率思考，而不是盯着单点估计。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV032
