      - number: '8.2'
        title: 可比框架：为什么 Kraken 的交易区间夹在公用事业与 SaaS 之间
        blocks:
          - type: paragraph
            body: >-
              Kraken 没有完美的公开可比公司，因此估值只能三角测算。Salesforce、ServiceNow 和 Veeva 能说明，当毛利率、留存和披露质量都强时，高端经常性软件资产可以拿到什么估值。Oracle 和
              SAP
              也重要，因为它们已经卖进同一组公用事业买方，尽管集团层面的倍数可能高估或低估其公用事业专属产品的价值。传统公用事业和基础设施倍数给出下行参照，因为它们展示了市场把现金流当作受监管或低利润运营资产，而非稀缺软件来定价时会发生什么。Kraken
              大概率应该落在两端之间。它的战略稀缺性和客户规模支持其相对传统公用事业软件供应商享有溢价，但缺少公开审计 ARR、NRR 和毛利率，意味着在不打折的情况下，不应直接给到 SaaS
              倍数区间上沿。因此，正确的可比问题不是「哪一个单一同业最像 Kraken？」而是「面对集中度、监管和披露风险，相对最优 SaaS 打多少折才合理？」
            claimRefs:
              - CV010
              - CV012
              - CV013
