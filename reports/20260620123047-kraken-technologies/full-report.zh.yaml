      - number: '8.4'
        title: 建议、置信度与下一步尽调关口
        blocks:
          - type: paragraph
            body: >-
              现有证据支持观察 / 继续研究的立场，置信度为中。Kraken 看起来是一家具备战略重要性的公司；考虑到规模、客户验证和可信公用事业平台资产的稀缺性，$8.65 billion
              的估值并非明显不理性。但相对于披露包，价格仍然偏高。投资人还没有审计后的 ARR、公开
              NRR、独立毛利率，也还看不清分拆后集团内部经济关系。因此，估值说得通，但带有溢价；举证责任现在落在未来披露和执行上，而不是营销叙事上。最有用的下一步尽调关口很直接：确认经审计的软件经济性，按 ARR
              和续约时点量化客户集中度，审查与 Octopus 的集团内部协议，并观察竞争或监管事件是否开始拖慢企业级获客。如果这些缺口顺利关闭，今天的估值会显得合理；如果没有，即便底层需求没有坍塌，倍数也有明显压缩空间。
