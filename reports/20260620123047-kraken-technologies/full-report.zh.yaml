  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 乐观解读
      - 审慎解读
      - 改变观点的证据
    rows:
      - - 规模与验证
        - 90M+ 签约账户和大型公用事业客户，说明其战略相关性不寻常。
        - 大 logo 不能证明 ARR 质量多元，也不能证明经济性足够粘。
        - 发布经审计 ARR、NRR，以及按收入计算的客户集中度。
      - - 分拆逻辑
        - 独立结构可以释放 Octopus 体内拿不到的软件倍数。
        - 分离证据完成前，市场可能已经为这部分释放付费。
        - 展示干净的 TSA、治理和首个独立报告周期。
      - - 可比公司组
        - 高溢价垂直 SaaS 公司支持更高的倍数天花板。
        - 公用事业和能源软件可比公司支持相对这些天花板打折。
        - 证明毛利率和留存可比高溢价 SaaS。
      - - 战略稀缺性
        - 很少有资产同时具备公用事业工作流深度和跨国部署。
        - 如果既有厂商和 Kaluza 缩小产品差距，稀缺性可能被高估。
        - 在不依赖 Octopus 背书的情况下赢得更多大型外部客户。
    notes: 反方论点栏刻意写得有力度，因为估值纪律既取决于上行叙事，也取决于下行框架。
