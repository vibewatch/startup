companyProfile:
  summary: >-
    Kraken Technologies 是 2016 年在 Octopus Energy 内部孵化的公用事业软件平台，并于 2025 年 12 月 29 日拆分为独立公司。它向 EDF、E.ON Next、Origin
    Energy、National Grid、Tokyo Gas、Plenitude 等大型公用事业公司销售云原生操作系统，覆盖计费、CRM、现场运营和分布式能源编排。到 2026 年中，公司披露客户账户超过 90M、覆盖 15+
    个国家，签约 ARR 超过 $500M。
