  - id: TV005
    title: 最终尽调要求与否决触发因素表
    columns:
      - 主题
      - 缺失证据或触发因素
      - 重要性
      - 行动含义
    rows:
      - - 软件经济性
        - 经审计 ARR、NRR、毛利率和收入桥
        - 核心检验是 Kraken 是否配得上一线 SaaS 折现率和倍数。
        - 只有审阅这些数据后，才上调置信度。
      - - 公司间经济性
        - TSA、定价、治理，以及与 Octopus 的关联方边界
        - 决定这家独立公司到底有多独立。
        - 条款清晰前，适用治理折价。
      - - 客户集中度
        - 最大客户 ARR、合同期限与续约时点
        - 即便账户基数很大，少数超大客户也可能主导价值。
        - 在部分客户流失情景下压力测试估值。
      - - 论点破裂触发项
        - 重大客户流失、监管事件，或二级市场成交价低于 B 轮价格
        - 任何一项都会直接冲击高溢价倍数。
        - 如果溢价叙事破裂，且披露改善无法抵消，应从跟踪转为回避。
    notes: 这些尽调问题按估值影响排序，而不是为了覆盖公司尽调的全部内容。
