      - number: '7.4'
        title: 竞争压缩与财务透明度风险
        blocks:
          - type: paragraph
            body: >-
              Kraken
              具备有意义的规模优势，但仍面对两个接近公开市场的问题：它能否在更大的企业软件供应商面前守住高端销售定位，以及它的披露能否支撑已经给出的估值？Oracle、SAP、Salesforce、Kaluza、ENSEK、Itineris
              和 C3 AI 都在争夺同一公用事业现代化预算的一部分。Kraken
              的现代架构和客户背书有帮助，但套件型存量厂商可以打包相邻软件、撬动既有采购关系，并等待公用事业客户选择风险更低的迁移路径。这个竞争背景重要，因为 Kraken 目前更愿意披露已签约 ARR、客户 NPS
              和账户规模，而不是毛利率、净留存、烧钱速度或现金跑道。超过 $500 million 的已签约 ARR 与 FY24 确认收入 £90 million
              之间的差距，并不推翻这个模式，但确实意味着外部人无法完全检验：Kraken
              究竟是具备高端经济性的软件平台，还是仍在消化重实施增长的混合服务业务。高估值叠加有限透明度，会提高增长放缓或重大客户决策不及预期时估值倍数压缩的概率。
