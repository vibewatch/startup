  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              Kraken 应归入公用事业操作系统市场，而不是大宗能源零售市场。相关软件品类覆盖客户计费、CRM、电表数据摄取、费率与直接借记管理、DER 编排和现场服务流程。这条边界很关键，因为 Kraken
              的买方是要替换或现代化改造关键运营软件的公用事业管理团队，而不是选择能源费率的家庭用户。纯计费平台只能部分替代；Kraken 更完整的价值主张，是把客户运营、分布式能源调度和现场执行放进同一套技术栈。这也是为什么
              Oracle Utilities、SAP for Utilities、Salesforce Energy & Utilities Cloud、Kaluza、ENSEK 和 C3.ai
              的部分业务都应进入比较集，尽管它们各自覆盖的流程子集不同。品类正在扩张，因为公用事业公司不再把计费现代化、灵活性编排和客户体验看成彼此孤立的项目。智能费率、EV
              充电、分布式电池和热泵控制成为标配后，公用事业公司越来越需要一套操作系统，把客户、资产和服务逻辑连起来，而不是拼接点状方案。Kraken 纳入水务和宽带客户，也说明品类边界比单纯电力零售更宽。
