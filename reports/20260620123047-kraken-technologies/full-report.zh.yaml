            body: >-
              Kraken 拆分后的资本结构在头部信息上简单，在运营细节上不透明。公司宣布以 $8.65B 估值完成 $1B Series B，由 D1 Capital Partners 领投，Fidelity
              International、Durable Capital Partners 和 Ontario Teachers' Venture Growth 也在已具名名单中。Octopus 保留 13.7%
              股权，Origin 也保留股权头寸，这意味着两个战略产业参与者仍与公司扩张保持一致。融资应能为招聘、全球 go-to-market 扩张、迁移支持和持续 R&D 提供显著
              runway。不过，公开证据仍未披露账上现金、月度 burn 或独立债务额度。因此资本充足性无法精确承保，只能从融资规模、预期软件利润率画像和公司接触蓝筹成长投资人的能力中推断。
