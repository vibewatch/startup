              Kraken 的增长故事建立在真实外部采用之上，但集中度仍然不可忽视。Octopus
              似乎仍约占已签约账户的八分之一，保留股权，也提供平台最醒目的验证样本。关系顺畅时，这个组合很有力；优先级一旦分叉，它也很危险。Octopus
              合同范围、采购姿态或内部软件策略的变化，可能不只影响短期收入；它还会影响大型公用事业客户在拿 Kraken 与 Oracle、Salesforce、SAP 或 Kaluza 比较时，对参考案例的信任。问题不是
              Kraken 没有其他客户。National Grid、Tokyo Gas、Origin 和 Plenitude 证明它在跨国客户上有真实进展，Portsmouth Water 和 Cuckoo
              Broadband 也说明产品可迁移。问题在于，外部客户名单仍由少数超大 logo
              主导，因此续约时点、扩张经济性和多国实施质量都变得关键。在这个语境下，集中度不应只按收入敞口承保，也应按未来企业级获客和后续融资的叙事敞口承保。
