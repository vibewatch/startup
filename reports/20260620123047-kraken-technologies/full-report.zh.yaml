      - number: '5.3'
        title: AI、数据与灵活性能力
        blocks:
          - type: paragraph
            body: >-
              Kraken 的差异化越来越建立在数据规模和运营 AI 上，而不只是公用事业软件管道。公开材料称，到 2026 年中客户账户超过 90M、运营覆盖 15+ 个国家，每天数据点约 8B 到
              15B。在这层数据底座之上，Kraken 叠加了两个品牌化自动化叙事。第一个是 Skyrocket，Kraken 称这套 ML 系统最多可自动化 40% 的数字客户沟通，意味着显著的联络中心生产率杠杆。第二个是
              Utility-Grade AI，Kraken 用它向企业买方打包需求预测、价格优化和异常检测。Kraken Asset 最清晰地体现了这一方法的真实世界落地，因为同一平台被描述为编排超过 500,000
              台已连接设备和约 2GW 虚拟电厂容量。尽调角度看，AI 故事之所以重要，只是因为它绑定真实公用事业流程和可衡量的运营规模，而不是泛泛的 copilots。
