      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              对一家私有公用事业软件平台来说，Kraken 的公开技术姿态异常清晰。公司和合作伙伴材料反复把 Kraken 与 AWS 基础设施、Python 和 Django
              联系在一起，面向开发者的招聘信号也强化了这些是仍在使用的实施选择，而不是旧品牌残留。架构叙事同样重要：Kraken 被描述为
              API-first、多租户，并运行在单一共享代码库上。这个组合解释了公司为何声称，它能让公用事业公司在数月内摆脱 Oracle 和 SAP 式资产，而不是经历既有公用事业 IT
              常见的多年迁移周期。National Grid 将 Kraken
              描述为替换几十年旧系统，是这一假设最强的公开验证点。运营模型也似乎围绕智能电表数据摄取、结算、费率执行和服务流程紧密集成，因此平台被营销为操作系统，而不是中间件。
