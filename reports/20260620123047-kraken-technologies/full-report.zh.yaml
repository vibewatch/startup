              Kraken 的财务故事在业务质量层面有吸引力，在可承保精度层面不完整。积极一面是，签约 ARR 超过 $500M、独立客户背书和大额融资轮共同支持一个结论：Kraken
              已是规模化基础设施软件资产，而不是早期试验。公司的多年期迁移模型也能合理解释，为什么已确认收入仍大幅落后于签约
              ARR。谨慎一面是，估值偏贵，披露画像仍是私有公司式轻披露，若干关键字段仍不可得：毛利率、churn、NRR、客户集中度、现金、burn，以及按客户拆分的详细 ARR。组合起来，结论应当平衡：Kraken
              看起来是一家高质量、具战略重要性的 SaaS 公司，但投资人仍需要管理层数据，检验 $8.65B 估值是否公平计入执行风险和收入转化时点。缺失指标因此不是装饰性问题；它们决定溢价估值能复利还是压缩。
