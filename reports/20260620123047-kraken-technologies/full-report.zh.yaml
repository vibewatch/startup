      - number: '2.4'
        title: 市场驱动因素与监管顺风
        blocks:
          - type: paragraph
            body: >-
              几个结构性趋势正在扩大对 Kraken 这类平台的需求。第一，智能电表铺设和分时费率要求公用事业公司摄取更细颗粒度的数据，并处理比旧月度周期系统更复杂的计费逻辑。第二，EV
              普及、户后电池和热泵让公用事业公司从被动出账方转为分布式需求的主动编排者。第三，英国、欧洲、日本、澳大利亚和美国部分地区的清洁能源与需求灵活性要求，正在推动公用事业公司推出面向客户的灵活性项目，把零售体验与电网运营连接起来。第四，客户体验预期在提高：公用事业公司希望数字沟通、自助服务和自动化流程更像现代
              SaaS，而不是旧后台 CIS 实施。这些都是真实利好，因为 Kraken 的产品叙事把客户运营和 DER
              控制统一起来。但同一监管环境也制造摩擦，因为每个国家都会增加费率结构、消费者保护、数据驻留、语言和公用事业专属集成的本地化工作。因此市场增长真实存在，但更多流向能在跨司法辖区同时守住产品宽度和实施纪律的供应商。
