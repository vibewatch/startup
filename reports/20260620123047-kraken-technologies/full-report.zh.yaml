      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              拆分后的领导架构，是 Kraken 想按真正企业软件公司运营的最清晰信号之一。Amir Orad 担任 CEO，Tim Wan 担任 CFO，管理团队与 Octopus 零售业务明确分离。Greg Jackson
              仍有战略影响力，因为他在 Octopus 内部创建了 Kraken，仍是该平台最知名的外部布道者，并掌握与 Kraken 最大股东兼客户群的关系。James Eddison 作为原始平台架构师，以及最能代表
              Kraken 设计原则的技术人，仍然重要。这套领导配置既带来优势，也留下依赖风险：Kraken 现在有专门的 SaaS 领导层，但产品叙事、客户可信度和生态入口仍高度倚重 Octopus
              创始团队。公开披露显示公司已有自身治理，但未公布完整董事会名单、委员会结构，也未详列 D1、Teachers' Venture Growth 或 Octopus
              的保留事项。因此，独立性方向上可信，但仅靠公开资料还无法完全承保。
