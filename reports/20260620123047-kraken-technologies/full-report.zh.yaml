      - number: '1.3'
        title: 资本结构与投资方
        blocks:
          - type: paragraph
            body: >-
              Kraken 2025 年 12 月融资规模足够大，把公司从内部平台拆分体重新定位为全球基础设施软件竞争者。Series B 融资约 $1B，估值 $8.65B，由 D1 Capital Partners
              领投，Fidelity International、Durable Capital Partners 和 Teachers' Venture Growth 等在已披露投资方之列。拆分后 Octopus
              Energy Group 保留 13.7% 股权，既维持战略一致，也留下可见的关联方动态。Origin Energy 也通过既有的 Octopus 关系和 Kraken
              在澳大利亚的部署版图保持经济利益一致。公开报道显示，这轮融资将 Kraken 直接股权购买与对 Octopus Capital 的 $320M
              平行注资结合在一起；结构并不常见，重要之处在于投资人胃口分布在平台公司和更广的 Octopus 生态之间。仍缺失的是详细股权表：清算优先权、员工期权池、董事席位分配，以及 Octopus
              或锚定客户获得的任何商业权利都未公开披露。尽调角度看，Kraken 现在像一家后期成长型软件公司，拥有基础设施级标杆客户，但治理经济性只部分透明。
