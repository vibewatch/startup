            body: >-
              Kraken 的客户基础应按角色分层，而不是按终端消费者品牌知名度分层。最高层级是大型公用事业企业，它们用 Kraken 运营自己的零售或受监管客户账户；这些企业买方再让 Kraken
              接触到数千万终端账户。已具名名单包括 EDF Energy 和 E.ON Next 等英国既有厂商，Octopus 和 Origin 等大型战略客户，Tokyo Gas 和 Plenitude
              等国际扩张客户，以及 Portsmouth Water 和 Cuckoo Broadband 等相邻行业标杆。这个组合重要，因为 Kraken 不是靠数百个匿名 logo
              证明需求。它要证明的是，少数极大且运营复杂的客户愿意把关键流程交给平台。代价是，每个 logo 都有不成比例的信号权重，因此集中度分析成为投资判断的核心。
