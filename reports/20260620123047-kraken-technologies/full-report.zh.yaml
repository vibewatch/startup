              编排和现场流程，与一套在真实运营中验证过的底座结合起来，而不是只有软件演示环境。地理扩张路径看起来是从英国验证走向欧洲、澳大利亚、日本，再进入美国；National Grid
              在这个极具吸引力但合规负担很重的市场提供了标杆立足点。进入水务和宽带则提示了第二条按垂直行业增长的轴线。主要竞争风险在于中立基准仍稀薄：公开资料确认了规模和客户，但没有充分揭示胜率、相对 Oracle 或 SAP
              的实施周期，或按地区拆分的模块级 ARR。因此，市场假设偏正面，但从尽调角度还未完全闭合。
