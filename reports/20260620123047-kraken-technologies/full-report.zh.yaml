              等传统既有厂商；计费和客户信息系统属于关键任务系统、替换成本高，因此它们仍主导许多大型公用事业资产。第二类是 Kaluza、Ensek 和 Itineris
              等云挑战者，承诺部署更快、运营摩擦更低，但通常只覆盖部分流程或较小客户群。第三类是 Salesforce、C3.ai、Uplight 和 AutoGrid 等相邻厂商，它们能在 CRM、分析或 DER
