      - number: '2.2'
        title: TAM 测算与服务市场逻辑
        blocks:
          - type: paragraph
            body: >-
              没有单一公开分析师模型能完美匹配 Kraken 的产品范围，因此 TAM 必须交叉测算。保守下限是全球公用事业计费、CRM、计量和相邻客户运营软件支出池；按当前市场交叉测算，年规模超过 $10B。这个下限还排除了
              Kraken 当前瞄准的部分现场服务、DER 编排和跨公用事业相邻场景。因此，更宽的战略 TAM
              可能高于纯计费口径，因为公用事业公司越来越把现代化采购成一个打包项目，横跨旧系统替换、智能电表就绪、联络中心自动化、灵活性使能和现场流程。Kraken 自身披露为服务市场讨论提供了锚点：公司披露客户账户
              90M+、覆盖 15+ 个国家、签约 ARR $500M+，意味着它已经在现代公用事业软件支出池中有实质渗透。正确解读不是 Kraken
              已经吃满市场，而是它已从试点商业化走向规模化企业采用。其在能源、水务和宽带的存在，也把 SAM 扩展到垂直口径很窄的公用事业 IT
              品类之外。最大的剩余规模不确定性，不是顶层市场是否存在，而是缺少一套中立发布的方法，能准确映射 Kraken 的一体化操作系统范围。
