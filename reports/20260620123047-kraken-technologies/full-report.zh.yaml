      - number: '5.4'
        title: 部署、可扩展性与企业验证
        blocks:
          - type: paragraph
            body: >-
              Kraken 的企业级论证，在公司能证明同一产品架构可跨地域和相邻行业复制时最强。Tokyo Gas
              是最清晰的国际验证：平台被授权进入日本，先覆盖初始电力客户基础，并可选择扩展到规模大得多的燃气客户群，说明本地化不止适用于英语市场。National Grid
              是美国最清晰的迁移验证，因为公开交易措辞强调要大规模替换几十年旧的客户系统。Kraken 还指向 Portsmouth Water 和 Cuckoo
              Broadband，证明同一代码库无需从零重构公司平台，就能延伸到非能源流程。这种可扩展性是 Kraken
              更广差异化论据的一部分：一次产品发布可以跨公用事业公司、新地域，甚至相邻受监管服务垂直行业交付。如果属实，相比定制化公用事业转型项目，这会带来有意义的产品经济性优势。
