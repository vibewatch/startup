  - id: TV003
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Includes the most relevant public SaaS and utility reference points plus direct utility-platform competitors; no
        exact pure-play public Kraken peer exists, so the set is deliberately triangulated rather than exhaustive.
    columns:
      - 可比公司
      - 类型
      - 指示性倍数区间
      - 相关性
      - 主要限制
    rows:
      - - Salesforce
        - 大市值企业 SaaS
        - 收入 8x-12x
        - 展示宽口径、高质量经常性软件能拿到什么定价。
        - 产品组合和客户多元化远高于 Kraken。
      - - ServiceNow
        - 工作流 SaaS
        - 收入 12x-15x
        - 可用于参考高溢价工作流软件的经济性和耐久度。
        - 并非公用事业专属，披露质量也成熟得多。
      - - Veeva
        - 专门垂直 SaaS
        - 收入 15x-20x
        - 聚焦型垂直软件业务的上界样本。
        - 医疗垂直领域和公开市场成熟度不能直接迁移。
      - - Oracle / SAP 公用事业业务
        - 嵌入式公用事业软件
        - 低于高溢价 SaaS；混在集团倍数中
        - 展示既有厂商在公用事业买方上的重叠和打包压力。
        - 集团交易倍数无法拆出公用事业软件板块价值。
      - - Kaluza / ENSEK
        - 私营公用事业科技同业
        - 仅作方向参考
        - 公用事业工作流现代化最直接的运营竞争对手。
        - 公开财务和估值数据稀少。
    notes: 倍数区间是基于分析师市场数据和文件披露的方向性综合，不是机械可比的前瞻 EV/ARR 计算。
    claimRefs:
      - CV012
