    question: Are audited ARR, NRR, and gross margin public?
    answer: No audited ARR, NRR, or gross margin data were identified in public materials.
    targets:
    - contentRequirements/2
  - id: QV027
    type: mechanism
    status: answered
    question: Why does lack of NRR disclosure matter?
    answer: Without net retention, investors cannot tell whether Kraken grows primarily through durable land-and-expand behavior or through constant new-logo selling and implementation work.
    targets:
    - contentRequirements/2
  - id: QV028
    type: verification
    status: partial
    question: Has Kraken published a public IPO timeline?
    answer: No public IPO or formal exit timetable was identified.
    targets:
    - contentRequirements/5
  - id: QV029
    type: adverse
    status: answered
    question: What competitive risks could compress the valuation multiple?
    answer: Oracle, SAP, Salesforce, and Kaluza could slow enterprise wins or prove that buyers value suite breadth and incumbent relationships more than Kraken's technical edge.
    targets:
    - contentRequirements/0
    - contentRequirements/3
  - id: QV030
    type: mechanism
    status: answered
    question: Why is the right recommendation track/research-more instead of buy?
    answer: The company looks strategically important, but evidence gaps on economics, disclosure, and concentration are still too material to underwrite a stronger recommendation at the current mark.
    targets:
    - contentRequirements/1
    - contentRequirements/5
  - id: QV031
    type: verification
    status: unresolved
    question: Are the post-spinout governance and intercompany economics fully public?
    answer: No detailed public disclosure of TSAs, transfer pricing, or long-term intercompany economics was identified.
    targets:
    - contentRequirements/5
  - id: QV032
    type: mechanism
    status: answered
    question: What should investors monitor next to decide whether the mark is becoming more attractive or more stretched?
    answer: Key monitors are audited ARR, customer concentration by ARR, renewal quality, standalone financial reporting, and any evidence of multiple compression or a secondary mark below the Series B price.
    targets:
    - contentRequirements/5
