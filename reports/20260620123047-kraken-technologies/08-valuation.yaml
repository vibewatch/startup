- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Bullish read
  - Skeptical read
  - What would change the view
  rows:
  - - Scale and proof
    - 90M+ contracted accounts and major utility customers imply unusual strategic relevance.
    - Large logos do not prove diversified ARR quality or sticky economics.
    - Publish audited ARR, NRR, and customer concentration by revenue.
  - - Spinout logic
    - Standalone structure can unlock a software multiple unavailable inside Octopus.
    - The market may already be paying for that unlock before separation proof is complete.
    - Show clean TSAs, governance, and first standalone reporting cycle.
  - - Comparable set
    - Premium vertical SaaS names justify a high ceiling multiple.
    - Utility and energy-software comparables support a discount to those ceilings.
    - Demonstrate gross margin and retention comparable to premium SaaS.
  - - Strategic scarcity
    - Few assets combine utility workflow depth with multinational deployments.
    - Scarcity can be overstated if incumbents and Kaluza narrow the product gap.
    - Win additional large external clients without relying on Octopus signaling.
  notes: The anti-thesis column is intentionally forceful because valuation discipline depends on downside framing as much as upside narrative.
