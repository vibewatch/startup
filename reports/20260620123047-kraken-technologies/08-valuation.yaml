    - Material downside if premium-SaaS framing breaks.
  - - Current mark
    - ARR floor above $500M; 90M+ accounts; strong narrative momentum
    - ~17x on disclosed ARR floor
    - $8.65B
    - Fresh price anchor, but still dependent on future proof.
