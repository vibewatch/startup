  rows:
  - - Bull
    - ARR rises toward $750M-$1B; accounts approach 150M; strategic premium intact
    - 15x-20x
    - $15B-$20B
    - Possible but demands sustained execution and better disclosure.
  - - Base
    - ARR reaches ~$750M in about three years; accounts around 120M; disclosure improves gradually
    - ~15x
    - ~$11.25B
    - Most reasonable upside case if spinout execution stays on track.
  - - Bear
    - ARR stalls near $500M-$600M; concentration or competition becomes more visible
    - ~8x
