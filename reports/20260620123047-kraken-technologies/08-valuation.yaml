  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-software-economics
    missingEvidence: Audited ARR, NRR, gross margin, and cohort-level revenue conversion data for Kraken as a standalone company.
    whyItMatters: These metrics are the main test of whether the company deserves a premium vertical-SaaS multiple rather than a discounted hybrid software-services valuation.
    diligencePath: Request audited financial statements, cohort analysis, and revenue-recognition bridge from management or the data room.
    relatedQuestionRefs:
    - QV026
    - QV027
  - type: missing-source
    severity: material
    topic: intercompany-economics
    missingEvidence: Detailed public TSAs, pricing, governance boundaries, and related-party economics between Kraken and Octopus after the spinout.
    whyItMatters: The valuation premium assumes true software independence; unclear intercompany economics justify a discount until proven otherwise.
    diligencePath: Obtain board-approved spinout documents, related-party policies, and commercial agreements under NDA.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR, contract length, renewal timing, and implementation backlog by major account.
    whyItMatters: A company can have huge account counts yet still have a fragile revenue base if a few enterprise customers dominate value.
    diligencePath: Request top-10 customer concentration schedules and renewal calendars.
    relatedQuestionRefs:
    - QV019
    - QV020
    - QV032
    relatedTableRefs:
    - TV005
  - type: stale
    severity: minor
    topic: secondary-market-mark
    missingEvidence: Any verified 2026 secondary pricing, updated private-market carrying values, or new financing rounds after the December 2025 transaction.
    whyItMatters: Without an updated market-clearing signal, the last round may remain the best anchor even if comparable multiples have moved.
    diligencePath: Monitor investor disclosures, private-market data services, and any new financing or tender activity.
    relatedQuestionRefs:
    - QV018
    - QV024
    - QV028
    relatedTableRefs:
    - TV003
