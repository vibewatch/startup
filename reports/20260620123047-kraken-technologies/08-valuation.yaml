- id: TV003
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Includes the most relevant public SaaS and utility reference points plus direct utility-platform competitors; no exact pure-play public Kraken peer exists, so the set is deliberately triangulated rather than exhaustive.
  columns:
  - Comparable
  - Type
  - Indicative multiple band
  - Why relevant
  - Key limitation
  rows:
  - - Salesforce
    - Large-cap enterprise SaaS
    - 8x-12x revenue
    - Shows what broad, high-quality recurring software can command.
    - Much broader product set and customer diversification than Kraken.
  - - ServiceNow
    - Workflow SaaS
    - 12x-15x revenue
    - Useful for premium workflow software economics and durability.
    - Not utility-specific and far more mature in disclosure quality.
  - - Veeva
    - Specialized vertical SaaS
    - 15x-20x revenue
    - Upper-bound example for a focused vertical software franchise.
    - Healthcare vertical and public-market maturity are not directly transferable.
  - - Oracle / SAP utility businesses
    - Embedded utility software
    - Below premium SaaS; blended inside group multiple
    - Shows incumbent utility buyer overlap and bundling pressure.
    - Group trading multiples do not isolate utility-software segment value.
  - - Kaluza / ENSEK
    - Private utility-tech peers
    - Directional only
    - Best direct operating competitors for utility workflow modernization.
    - Sparse public financial and valuation data.
  notes: Multiple bands are directional synthesis from analyst-market-data and filings, not mechanically comparable forward EV/ARR calculations.
