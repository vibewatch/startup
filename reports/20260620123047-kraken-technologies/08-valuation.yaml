- id: TV005
  title: Final diligence asks and kill triggers table
  columns:
  - Topic
  - Missing evidence or trigger
  - Why it matters
  - Action implication
  rows:
  - - Software economics
    - Audited ARR, NRR, gross margin, and revenue bridge
    - Core test of whether Kraken deserves a top-tier SaaS discount rate and multiple.
    - Upgrade confidence only after these data are reviewed.
  - - Intercompany economics
    - TSAs, pricing, governance, and related-party boundaries with Octopus
    - Determines how independent the standalone company really is.
    - Apply governance discount until terms are clear.
  - - Customer concentration
    - Top-customer ARR, contract duration, and renewal timing
    - A few mega-logos can dominate value even in a large account base.
    - Stress-test valuation under partial client loss scenarios.
  - - Thesis-break trigger
    - Major client loss, regulatory incident, or secondary mark below the Series B price
    - Each would directly challenge the premium multiple.
    - Move from track to avoid if premium narrative breaks without offsetting disclosure improvements.
  notes: These diligence asks are prioritized for valuation impact rather than for completeness of company diligence overall.
