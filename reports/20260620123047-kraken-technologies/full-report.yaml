            body: >-
              Kraken's enterprise case is strongest where the company can show that the same product architecture
              travels across geographies and adjacent sectors. Tokyo Gas is the clearest international proof: the
              platform was licensed into Japan for an initial electricity base with optional expansion into a far larger
