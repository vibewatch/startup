companyProfile:
  summary: >-
    Kraken Technologies is a utility software platform created inside Octopus Energy in 2016 and spun out as a
    standalone company on 29 December 2025. It sells a cloud-native operating system for billing, CRM, field operations,
    and distributed-energy orchestration to major utilities including EDF, E.ON Next, Origin Energy, National Grid,
    Tokyo Gas, and Plenitude. By mid-2026 the company reported 90M+ customer accounts, 15+ countries, and $500M+
    contracted ARR.
