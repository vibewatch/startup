      - number: '8.2'
        title: 'Comparable framework: why Kraken trades between utilities and SaaS'
        blocks:
          - type: paragraph
            body: >-
              There is no perfect public peer for Kraken, so valuation has to be triangulated. Salesforce, ServiceNow,
              and Veeva give a sense of what premium recurring software franchises can command when gross margin,
              retention, and disclosure quality are strong. Oracle and SAP matter because they already sell into the
              same utility buyer set, even if their group multiples overstate or understate the value of their
              utility-specific products. Traditional utility and infrastructure multiples set the downside reference
              because they show what happens when the market values cash flow like a regulated or low-margin operating
              asset rather than like scarce software. Kraken probably deserves to sit between those poles. Its strategic
              scarcity and customer scale support a premium to legacy utility-software vendors, but the absence of
              public audited ARR, NRR, and gross margin argues against assigning it the full upper-end SaaS multiple
              range without discount. The right comparable question is therefore not “which single peer matches Kraken?”
              but “how much discount to best-in-class SaaS is fair for concentration, regulation, and disclosure risk?”
            claimRefs:
              - CV010
