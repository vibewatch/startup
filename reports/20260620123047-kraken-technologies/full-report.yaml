chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Kraken Technologies should be analyzed as a utility software platform, not as Octopus Energy's retail
              supply arm. The business was incubated inside Octopus Energy from 2016 onward, where it was built to run
              complex retail billing, CRM, smart-meter workflows, and flexibility dispatch at scale. The 29 December
              2025 demerger formalized Kraken as an independent company with its own governance and capital base while
              preserving a close commercial relationship with Octopus, which remains both a meaningful shareholder and
              the platform's largest reference customer. Kraken's economic model is B2B platform licensing: utilities
              pay to replace or modernize core customer operations, while Kraken cross-sells adjacent modules for asset
              orchestration and field service management. This model is strategically different from retail energy
              because revenue is driven by multi-year software deployments, migration services, and recurring platform
              usage rather than commodity gross margin. Kraken's stated mission to improve one billion lives underscores
              the ambition to become a horizontal operating system for utilities across energy, water, and broadband
              rather than remain a captive internal tool.
