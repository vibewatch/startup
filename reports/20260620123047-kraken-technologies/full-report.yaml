  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Standalone revenue model and recognition logic
        blocks:
          - type: paragraph
            body: >-
              Kraken Technologies should be analyzed as a software platform, not as a retail energy supplier. Its core
              monetization is per-account SaaS licensing paid by utilities that run customer, billing, and operational
              workflows on the platform. That creates a very different revenue profile from Octopus Energy’s commodity
              pass-through retail business. Public evidence suggests a mix dominated by recurring software fees, with
              professional services and migration support as secondary streams attached to large deployments. The most
              important accounting and diligence issue is the difference between recognized revenue and contracted ARR.
              Octopus disclosed £90 million of FY24 Kraken revenue while the spinout later disclosed more than $500
              million of contracted ARR, indicating that signed clients likely ramp into full revenue over time as
              migrations go live and modules expand. That ramp logic is consistent with long implementation cycles in
              utility software and explains why headline contract value can run far ahead of current-period recognized
              revenue.
