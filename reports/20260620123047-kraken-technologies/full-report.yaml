      - number: '3.4'
        title: Competitive risks and adverse scenarios
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Kraken lacks strong competitors, but that different competitors can erode
              different layers of its value proposition. Oracle and SAP can keep core billing workloads through inertia
              and board-level trust. Salesforce can squeeze the customer-engagement layer. Kaluza could broaden from
              flexibility into deeper operational scope if it proves external licensing at scale. Hyperscalers may
              continue to commoditize infrastructure, data, and AI tooling, making parts of the technical stack easier
              to replicate even if the operating model remains hard to copy. Internal build also remains a real option
              for the largest utilities, especially where they already employ substantial digital teams and want tighter
              control over regulatory customization. As a result, Kraken’s moat looks strongest where a buyer wants one
              platform and fast migration, and weaker where procurement tolerates multi-vendor architecture or bespoke
              engineering. Buyers that already own significant systems-integration capacity may also prefer staged
              replacement, which reduces the advantage of a single-vendor operating-system sale.
            claimRefs:
