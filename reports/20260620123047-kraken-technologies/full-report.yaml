  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              Kraken should be placed in the market for utility operating systems, not in the market for commodity
              energy retail. The relevant software category spans customer billing, CRM, meter-data ingestion, tariff
              and direct-debit administration, DER orchestration, and field-service workflows. That boundary matters
              because Kraken's buyer is a utility executive team replacing or modernizing mission-critical operating
              software, not a household choosing an energy tariff. Billing-only platforms are a partial substitute, but
              Kraken's fuller value proposition is the combination of customer operations, distributed-energy dispatch,
              and field execution in one stack. This is why Oracle Utilities, SAP for Utilities, Salesforce Energy &
              Utilities Cloud, Kaluza, ENSEK, and parts of C3.ai belong in the comparison set, even though each covers a
              different subset of the workflow. The category is expanding because utilities no longer see billing
              modernization, flexibility orchestration, and customer experience as isolated projects. As smart tariffs,
              EV charging, distributed batteries, and heat-pump control become standard, utilities increasingly need an
              operating system that joins customer, asset, and service logic rather than stitching together point
              solutions. Kraken's inclusion of water and broadband customers also suggests the category boundary is
              broader than power retail alone.
            claimRefs:
              - CM001
              - CM002
