  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive structure around Kraken Technologies
        blocks:
          - type: paragraph
            body: >-
              Kraken Technologies competes in utility software rather than retail energy supply. The relevant field
              clusters into three groups. First are legacy incumbents such as Oracle Utilities and SAP IS-U, which still
              dominate many large utility estates because billing and customer-information systems are mission-critical
              and expensive to replace. Second are cloud challengers such as Kaluza, Ensek, and Itineris that promise
              faster deployment and lower operating friction, but usually address only part of the workflow or a smaller
              customer segment. Third are adjacent vendors such as Salesforce, C3.ai, Uplight, and AutoGrid that can
              influence buying decisions in CRM, analytics, or DER flexibility without providing the full operating
              backbone. Kraken’s case is that it alone combines utility-scale billing, field, and DER orchestration in
              one cloud-native stack that is already proven across multiple geographies and regulated utility contexts.
            claimRefs:
