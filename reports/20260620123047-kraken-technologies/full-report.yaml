      - number: '5.5'
        title: Trust, security, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Kraken's public trust posture is directionally positive but still thinner than what a conservative
              infrastructure investor would normally want for a platform running billing and grid-edge workflows. The
              company claims ISO/IEC 27001 status or alignment and highlights client NPS, but the public source set does
              not clearly specify certification scope, audited controls, uptime history, or named SLA commitments. That
              lack of detail does not negate product strength, yet it matters because Kraken is concentrating critical
              customer operations and distributed-asset orchestration on one shared cloud platform. The same shared
              codebase that accelerates release velocity can also spread a severe defect rapidly across the installed
              base, while dependence on AWS concentrates infrastructure risk in a single hyperscaler relationship. The
              core diligence follow-up is therefore not whether Kraken is technically sophisticated—it is—but whether
              the company publishes enough evidence on resilience, security operations, and change-management discipline
              to match the scale of the workflows it now controls.
