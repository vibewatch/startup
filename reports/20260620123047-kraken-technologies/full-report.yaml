        blocks:
          - type: paragraph
            body: >-
              Kraken's customer base should be segmented by role rather than by end-consumer brand recognition. At the
              top level the platform serves large utility enterprises that use Kraken to operate their own retail or
              regulated customer accounts; those enterprise buyers then bring Kraken into contact with tens of millions
              of end accounts. The named roster includes UK incumbents such as EDF Energy and E.ON Next, large strategic
              customers such as Octopus and Origin, international expansion customers such as Tokyo Gas and Plenitude,
              and adjacent-sector references such as Portsmouth Water and Cuckoo Broadband. That mix matters because
              Kraken is not trying to prove demand with hundreds of anonymous logos. It is trying to prove that a small
              number of very large, operationally complex customers trust the platform with critical workflows. The
              trade-off is that each logo carries disproportionate signaling power, making concentration analysis
              central to the investment case.
