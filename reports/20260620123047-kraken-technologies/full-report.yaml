  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kraken should be analyzed as a full utility operating system, not as a narrow billing tool. The company
              organizes its suite into Kraken Customer, Kraken Asset, and Kraken Field, which together cover the
              commercial and operational workflows of a modern utility. Kraken Customer sits closest to the end account
              holder: it handles onboarding, CRM, billing, direct-debit management, service workflows, and outbound
              digital communications. Kraken Asset is the orchestration layer for distributed energy resources,
              including smart EV charging, heat-pump optimization, batteries, and flexibility market participation.
              Kraken Field extends the platform into physical operations such as smart-meter scheduling and technician
              dispatch. This module split matters strategically because Kraken is selling a workflow transformation
              thesis: utilities can replace fragmented legacy stacks with one shared operating environment that links
              customer service, tariff execution, grid-edge devices, and field operations instead of stitching together
              separate point systems.
