      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The post-spinout leadership structure is one of the clearest signals that Kraken is meant to operate as a
              true enterprise software company. Amir Orad serves as CEO and Tim Wan as CFO, creating a management team
              explicitly separate from Octopus retail. Greg Jackson remains strategically influential because he created
              Kraken inside Octopus, is still the best-known external evangelist for the platform, and controls the
              relationship with Kraken's largest shareholder-customer base. James Eddison remains important as the
              original platform architect and as the technologist most closely associated with Kraken's design
              principles. This leadership configuration brings both strength and residual dependency risk: Kraken now
              has dedicated SaaS leadership, but product narrative, customer credibility, and ecosystem access still
              lean heavily on the Octopus founding team. Public disclosures show the company has its own governance, yet
              they do not publish a full board roster, committee structure, or detailed reserved matters for D1,
              Teachers' Venture Growth, or Octopus. That means independence is directionally credible but not fully
              underwritten from public sources alone.
