      - number: '1.4'
        title: Scale metrics and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Kraken's operating metrics are unusually strong for a private utility software company and help explain
              why investors were willing to finance it at an elevated multiple. At spinout the company disclosed more
              than 70 million contracted accounts and $500 million contracted annual recurring revenue, up roughly
              fourfold in three years. By mid-2026 the corporate website reported more than 90 million customer accounts
              across 15+ countries, with up to 15GWh of energy managed daily and approximately 15 billion new data
              points processed every day. The platform's client-reported outcomes are also central to the story: Kraken
              advertises an 85% client NPS, over 40% greater operational efficiency for utility customers, and 3x
              improved customer satisfaction. The flexibility layer adds another moat signal, with 500,000+ connected
              devices and 2GW under management. These metrics matter because they show Kraken is not an early-stage
              proof of concept; it is a scaled operating system already trusted by major utilities such as EDF, E.ON
              Next, Origin Energy, National Grid, Tokyo Gas, Plenitude, Portsmouth Water, and Cuckoo Broadband. The
              remaining diligence challenge is not whether the platform has scale, but how much of that scale is
              concentrated in a few anchor clients and how durable the economics are by customer cohort.
