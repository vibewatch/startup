      - number: '4.2'
        title: Economics, margin profile, and durability
        blocks:
          - type: paragraph
            body: >-
              Kraken’s economics look structurally better than utility retail economics because recurring software
              revenue should carry much higher gross margins and far lower commodity exposure. Public sources do not
              disclose a standalone gross margin, but the combination of software licensing, FY24 profit inside the
              Octopus group, and private SaaS benchmarks supports the view that the licensing layer can exceed 70
              percent gross margin once fully scaled. Switching costs are also unusually favorable. Utilities rarely
              replatform core CIS and operational systems quickly because they face regulatory, data, and
              customer-service risk. That dynamic supports long customer lifetimes and a credible case for net revenue
              retention above 100 percent even without a public disclosure. The main caveat is that the strongest
              unit-economics conclusions remain inferred rather than reported. There is no public churn, cohort
              expansion, or realized pricing file, so durability still rests on market structure and contract logic more
              than on disclosed KPI series.
