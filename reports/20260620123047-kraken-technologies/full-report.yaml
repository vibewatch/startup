            body: >-
              Kraken’s post-spinout capital structure is simple in headline terms and opaque in operating detail. The
              company announced a $1 billion Series B at an $8.65 billion valuation led by D1 Capital Partners, with
              Fidelity International, Durable Capital Partners, and Ontario Teachers’ Venture Growth also named. Octopus
              retained 13.7 percent ownership, and Origin kept an equity position as well, which means two strategic
              industry actors remain aligned with the company’s expansion. The financing should provide significant
              runway for hiring, global go-to-market expansion, migration support, and continued R&D. However, public
