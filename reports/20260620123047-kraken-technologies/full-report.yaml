      - number: '2.4'
        title: Market drivers and regulatory tailwinds
        blocks:
          - type: paragraph
            body: >-
              Several structural trends are expanding demand for platforms like Kraken. First, smart-meter rollouts and
              time-of-use tariffs require utilities to ingest more granular data and handle more complex billing logic
              than legacy monthly-cycle systems were designed for. Second, EV adoption, behind-the-meter batteries, and
              heat pumps convert utilities from passive billers into active orchestrators of distributed demand. Third,
              clean-energy and demand-flexibility mandates in the UK, Europe, Japan, Australia, and parts of the US are
              pushing utilities toward customer-facing flexibility programs that connect retail experience to grid
              operations. Fourth, customer-experience expectations are rising: utilities want digital communications,
              self-service, and automated workflows that look more like modern SaaS than old back-office CIS
              implementations. These are genuine tailwinds for Kraken because its product pitch unifies customer
              operations and DER control. The same regulatory environment also creates friction, however, because every
              country adds localization work for tariff structures, consumer protections, data residency, language, and
              utility-specific integrations. Market growth is therefore real, but it accrues disproportionately to
              vendors that can handle both product breadth and implementation discipline across jurisdictions.
            claimRefs:
              - CM009
              - CM010
              - CM011
