      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the cleanest way to judge the current mark. In the bull case, Kraken keeps winning
              large utility accounts, scales toward 150 million accounts, and converts that footprint into $750 million
              to $1 billion of ARR while convincing public or strategic buyers to value it as scarce vertical SaaS. That
              can justify roughly $15 billion to $20 billion. The base case is more restrained: ARR rises to around $750
              million over three years, customer count reaches roughly 120 million, and the market awards a
              still-premium but not euphoric 15x multiple, producing value a little above today's mark at about $11.25
              billion. The bear case is where concentration, competition, regulation, or disclosure disappointment
              matter. If growth slows, a flagship customer wobbles, or the company still looks like a hybrid
              services-heavy platform, an 8x band on $500 million to $600 million of ARR can pull value down toward $4
              billion to $5 billion. That spread is wide enough that investors should think in scenario probabilities,
              not point estimates.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV032
