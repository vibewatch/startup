      - number: '2.2'
        title: TAM sizing and served-market logic
        blocks:
          - type: paragraph
            body: >-
              No single public analyst model perfectly matches Kraken's product scope, so TAM must be triangulated. A
              conservative floor is the global spend pool for utility billing, CRM, metering, and adjacent
              customer-operations software, which current market triangulation places above $10 billion annually. That
              floor excludes some of the field-service, DER orchestration, and cross-utility adjacency that Kraken now
              targets. A broader strategic TAM therefore likely exceeds the billing-only number because utilities
              increasingly buy modernization as a bundled program spanning legacy-system replacement, smart-meter
              readiness, contact-center automation, flexibility enablement, and field workflows. Kraken's own
              disclosures anchor the served-market discussion: the company reports 90M+ customer accounts, 15+
              countries, and $500M+ contracted ARR, implying it already has meaningful penetration within the modern
              utility-software spend pool. The right interpretation is not that Kraken has saturated the market, but
              that it has moved beyond pilot-stage commercialization into scaled enterprise adoption. Its presence in
              energy, water, and broadband also expands SAM beyond vertically narrow utility IT categories. The largest
              remaining sizing uncertainty is not top-line market existence but the lack of a neutral published
              methodology that maps exactly to Kraken's integrated operating-system scope.
