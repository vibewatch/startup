      - number: '8.4'
        title: Recommendation, confidence, and the next diligence gates
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports a track / research-more stance with medium confidence. Kraken looks like a
              strategically important company, and the $8.65 billion mark is not obviously irrational given its scale,
              customer proof, and the scarcity of credible utility-platform assets. But the price is still premium
              relative to the disclosure package. Investors do not yet have audited ARR, public NRR, standalone gross
              margin, or a clear read on post-spinout intercompany economics. That means the valuation is plausible, but
              premium, and the burden of proof now sits on future disclosure and execution rather than on marketing
              narrative. The most useful next diligence gates are straightforward: confirm audited software economics,
              quantify customer concentration by ARR and renewal timing, review intercompany agreements with Octopus,
              and watch whether competition or regulatory incidents start to slow enterprise wins. If those gaps close
              well, today's mark can look sensible. If not, the multiple has room to compress meaningfully even without
              a collapse in underlying demand.
            claimRefs:
