      - number: '7.4'
        title: Competitive compression and financial transparency risk
        blocks:
          - type: paragraph
            body: >-
              Kraken has meaningful scale advantages, but it still faces two difficult public-market style questions:
              can it preserve a premium sales position against larger enterprise vendors, and does its disclosure
              support the valuation already assigned to it? Oracle, SAP, Salesforce, Kaluza, ENSEK, Itineris, and C3 AI
              all compete for some part of the same utility modernization budget. Kraken's modern architecture and
              customer references help, yet incumbent suite vendors can bundle adjacent software, leverage existing
              procurement relationships, and wait for utilities to choose lower-risk migration paths. That competitive
              backdrop matters because Kraken currently discloses contracted ARR, client NPS, and account scale more
              readily than gross margin, net retention, burn, or runway. The gap between $500 million-plus contracted
              ARR and £90 million of FY24 recognized revenue does not invalidate the model, but it does mean outsiders
              cannot fully test whether Kraken is a software platform with premium economics or a hybrid services
              business still working through implementation-heavy growth. Premium valuation and limited transparency
              together raise the probability of multiple compression if growth slows or a major client decision
              disappoints.
