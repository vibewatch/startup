  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the $8.65 billion mark is really pricing in
        blocks:
          - type: paragraph
            body: >-
              Kraken's December 2025 $8.65 billion valuation is best read as a bet on category creation, not as a
              routine late-stage private round. The round gives the company a fresh institutional price anchor, but that
              anchor sits on top of a software-style narrative: rare utility workflow depth, multinational reference
              customers, and a belief that Kraken can become the independent operating system for utilities rather than
              remain a captive Octopus tool. On the available public facts, that narrative is plausible. Kraken has real
              external customers, more than 90 million contracted accounts, and more than $500 million in contracted
              ARR. The harder question is not whether Kraken matters strategically; it is whether the public evidence
              supports paying a premium multiple today. The company still discloses a narrower economics set than
              top-tier SaaS peers, and the market is being asked to bridge a wide gap between booked contract value and
              recognized revenue. That is why the valuation debate is less about company quality and more about whether
              the current price already discounts a clean software-style transition that has not yet been fully
              evidenced in public.
            claimRefs:
              - CV001
              - CV002
              - CV003
