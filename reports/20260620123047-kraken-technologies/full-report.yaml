      - number: '1.3'
        title: Capital structure and investors
        blocks:
          - type: paragraph
            body: >-
              Kraken's December 2025 financing was large enough to reposition the company from internal platform spinout
              to global infrastructure-software contender. The Series B raised roughly $1 billion at an $8.65 billion
              valuation and was led by D1 Capital Partners, with Fidelity International, Durable Capital Partners, and
              Teachers' Venture Growth among the named backers. Octopus Energy Group retained 13.7% ownership after the
              demerger, preserving both strategic alignment and a visible related-party dynamic. Origin Energy also
              remained economically aligned through its pre-existing relationship with Octopus and Kraken's Australian
              deployment footprint. Public reporting indicates the financing combined direct Kraken equity purchases
              with a parallel $320 million injection into Octopus Capital, an unusual structure that matters because it
              shows investor appetite was distributed across the platform company and the wider Octopus ecosystem. What
              is still missing is the detailed cap table: liquidation preferences, employee option pool, board seat
              allocation, and any commercial rights granted to Octopus or anchor customers are not publicly disclosed.
              For diligence purposes, Kraken now looks like a late-stage growth software company with
              infrastructure-like reference customers but only partially transparent governance economics.
