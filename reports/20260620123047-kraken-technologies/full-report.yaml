        title: Peer-by-peer comparison and buyer fit
        blocks:
          - type: paragraph
            body: >-
              Oracle Utilities is still the reference incumbent for large CIS replacements because its installed base,
              implementation ecosystem, and executive familiarity remain formidable. SAP IS-U carries similar weight in
              utilities whose broader enterprise stack already runs through SAP. Salesforce approaches the space from
              the opposite direction: strong CRM and service tooling, but no equivalent full billing and settlement
              engine disclosed in public product pages. Kaluza is the closest modern peer because it shares cloud-native
              roots and a flexibility narrative, yet its public footprint remains narrower than Kraken’s on end-to-end
              customer, billing, and field operations. Ensek and Itineris are credible mid-market challengers,
              especially where suppliers want a modern billing core without a global transformation. Adjacent analytics
              or DER specialists can win budget line items, but they do not eliminate the need for an operating-system
              decision.
