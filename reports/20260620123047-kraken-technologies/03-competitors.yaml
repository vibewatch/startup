  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Executed software pricing schedules, discount ladders, and module-specific rate cards for Kraken and peers remain private.
    whyItMatters: Without realized pricing, it is hard to convert competitive breadth into precise economic advantage.
    diligencePath: Request redacted customer contracts and commercial proposal decks.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: verification-gap
    missingEvidence: Independent third-party validation for every Kraken company-claimed scale and NPS metric is still incomplete.
    whyItMatters: Several headline moat metrics are central to the chapter’s conclusion and deserve corroboration.
    diligencePath: Ask management for customer-account reconciliation, reference calls, and investor materials.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
