callouts:
- calloutType: strength
  title: Kraken’s strongest competitive claim
  body: Kraken’s most defensible message is not simply that it is cloud-native, but that it has already scaled a cloud-native utility operating model across dozens of millions of accounts and multiple sectors. That combination helps it sell against both legacy fear and challenger immaturity.
  claimRefs:
  - CP003
  - CP017
  - CP018
  - CP036
- calloutType: risk
  title: What can still break the moat
  body: The competitive story still depends heavily on company-reported scale, client NPS, and speed-of-migration claims. If buyers learn that realized pricing is aggressive or that module adoption is narrower than the headline suggests, the moat looks thinner than the marketing narrative implies.
  claimRefs:
  - CP028
  - CP030
  - CP033
  - CP035
