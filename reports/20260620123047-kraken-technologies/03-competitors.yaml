- id: durability
  title: Durability of Kraken’s differentiation
  body: 'Kraken’s competitive argument rests on proven scale, breadth, and migration credibility. The company says it now supports more than 90 million accounts and previously had more than 70 million contracted accounts at spinout, which gives buyers a shorthand signal that the software can survive production complexity. Named customers such as National Grid, Origin, and Tokyo Gas matter because they show demand outside the Octopus parent orbit. Multi-sector deployments in water and broadband widen the installed-base learning loop beyond pure energy. The strongest moat is still switching cost: once billing, service workflows, and DER dispatch are inside a platform, moving again is operationally painful. The weaker point is verification. Several of Kraken’s best headline metrics come from company materials, so buyers should still seek deployment-level proof, realized pricing detail, and evidence that the full-stack value proposition persists outside high-profile reference accounts. The chapter
    therefore treats public reference customers, scale disclosures, and multi-sector deployments as strong indicators rather than as a substitute for contract-level diligence. That extra distinction matters because competitive quality and monetization quality are related but not identical.'
  claimRefs:
  - CP003
  - CP017
