chapter:
  number: 4
  title: Financials
  summary: Kraken Technologies should be underwritten as a high-quality private SaaS platform with a large gap between public headline traction and the private metrics needed for a full model. Contracted ARR above $500 million, FY24 recognized revenue of £90 million, and a $1 billion Series B at an $8.65 billion valuation support the growth narrative, but cash, burn, gross margin, NRR, and customer concentration remain undisclosed.
sections:
- id: revenue-model
  title: Standalone revenue model and recognition logic
  body: Kraken Technologies should be analyzed as a software platform, not as a retail energy supplier. Its core monetization is per-account SaaS licensing paid by utilities that run customer, billing, and operational workflows on the platform. That creates a very different revenue profile from Octopus Energy’s commodity pass-through retail business. Public evidence suggests a mix dominated by recurring software fees, with professional services and migration support as secondary streams attached to large deployments. The most important accounting and diligence issue is the difference between recognized revenue and contracted ARR. Octopus disclosed £90 million of FY24 Kraken revenue while the spinout later disclosed more than $500 million of contracted ARR, indicating that signed clients likely ramp into full revenue over time as migrations go live and modules expand. That ramp logic is consistent with long implementation cycles in utility software and explains why headline contract value
    can run far ahead of current-period recognized revenue.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
  - CI006
  - CI014
  - CI034
  - CI037
  - CI039
  - CI040
