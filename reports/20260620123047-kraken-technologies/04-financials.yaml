  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  - Why public data falls short
  rows:
  - - Standalone gross margin
    - Cannot validate margin path or cash conversion
    - Request audited management accounts and segment bridges
    - Public sources give revenue and profit points but not cost structure
  - - Net revenue retention and churn
    - Cannot test durability of installed-base economics
    - Request cohort retention deck and contract renewal data
    - Market structure implies stickiness but does not quantify it
  - - Cash and monthly burn
    - Cannot model runway or financing dependency
    - Request treasury summary and monthly cash bridge
    - Series B size is only a proxy for liquidity
  - - ARR by customer / concentration
    - Cannot test whether headline ARR is diversified
    - Request top-customer ARR and go-live schedule
    - Named customers do not reveal concentration
  - - Services versus software mix
    - Cannot tell whether revenue quality is diluted by services
    - Request bookings and revenue split by stream
    - Public material emphasizes platform, not mix
  notes: The unresolved gaps are the main reason this chapter stops short of a fully underwritten standalone model.
