- id: verdict
  title: Financial verdict and remaining underwriting gaps
  body: 'The financial case for Kraken is compelling at the level of business quality and less complete at the level of underwriteable precision. On the positive side, contracted ARR above $500 million, independent customer references, and a large financing round all support the conclusion that Kraken is already a scaled infrastructure-software asset rather than an early experiment. The company’s multi-year migration model also gives a coherent explanation for why recognized revenue still trails contracted ARR by a large margin. On the cautionary side, the valuation is rich, the disclosure profile is private-company light, and several vital fields remain unavailable: gross margin, churn, NRR, customer concentration, cash, burn, and detailed ARR by client. That combination leads to a balanced conclusion: Kraken looks like a high-quality, strategically important SaaS business, but investors still need management data to test whether the $8.65 billion valuation fairly prices execution risk
    and the timing of revenue conversion. The missing metrics are therefore not cosmetic; they determine whether premium valuation can compound or compress.'
