- id: economics
  title: Economics, margin profile, and durability
  body: Kraken’s economics look structurally better than utility retail economics because recurring software revenue should carry much higher gross margins and far lower commodity exposure. Public sources do not disclose a standalone gross margin, but the combination of software licensing, FY24 profit inside the Octopus group, and private SaaS benchmarks supports the view that the licensing layer can exceed 70 percent gross margin once fully scaled. Switching costs are also unusually favorable. Utilities rarely replatform core CIS and operational systems quickly because they face regulatory, data, and customer-service risk. That dynamic supports long customer lifetimes and a credible case for net revenue retention above 100 percent even without a public disclosure. The main caveat is that the strongest unit-economics conclusions remain inferred rather than reported. There is no public churn, cohort expansion, or realized pricing file, so durability still rests on market structure and contract
    logic more than on disclosed KPI series.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI032
  - CI033
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003
- id: capital
  title: Capital structure and adequacy after the spinout
  body: Kraken’s post-spinout capital structure is simple in headline terms and opaque in operating detail. The company announced a $1 billion Series B at an $8.65 billion valuation led by D1 Capital Partners, with Fidelity International, Durable Capital Partners, and Ontario Teachers’ Venture Growth also named. Octopus retained 13.7 percent ownership, and Origin kept an equity position as well, which means two strategic industry actors remain aligned with the company’s expansion. The financing should provide significant runway for hiring, global go-to-market expansion, migration support, and continued R&D. However, public evidence still does not disclose cash on hand, monthly burn, or a standalone debt facility. That means capital adequacy cannot be underwritten precisely; it can only be inferred from the size of the round, the expected software margin profile, and the company’s access to blue-chip growth investors.
  claimRefs:
  - CI007
  - CI009
  - CI010
  - CI011
  - CI012
  - CI020
  - CI021
  - CI022
