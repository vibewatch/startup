company:
  name: Kraken Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Kraken Technologies is now a standalone utility operating system company whose product stack centers on Kraken Customer, Kraken Asset, and Kraken Field. Public materials consistently frame the platform as a cloud-native, API-first, single-codebase system built on AWS, Python, and Django, with large-scale proof from National Grid, Tokyo Gas, and adjacent deployments in water and broadband. The core diligence tension is that Kraken claims exceptional scale, automation, and migration speed, yet offers limited public detail on SLAs, incident history, or the precise scope of its ISO/IEC 27001 posture.
sections:
- id: SE001
  title: Product suite and customer workflow
  body: 'Kraken should be analyzed as a full utility operating system, not as a narrow billing tool. The company organizes its suite into Kraken Customer, Kraken Asset, and Kraken Field, which together cover the commercial and operational workflows of a modern utility. Kraken Customer sits closest to the end account holder: it handles onboarding, CRM, billing, direct-debit management, service workflows, and outbound digital communications. Kraken Asset is the orchestration layer for distributed energy resources, including smart EV charging, heat-pump optimization, batteries, and flexibility market participation. Kraken Field extends the platform into physical operations such as smart-meter scheduling and technician dispatch. This module split matters strategically because Kraken is selling a workflow transformation thesis: utilities can replace fragmented legacy stacks with one shared operating environment that links customer service, tariff execution, grid-edge devices, and field operations
    instead of stitching together separate point systems.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
  - FE002
- id: SE002
  title: Architecture and operating model
  body: 'Kraken''s public technical posture is unusually clear for a private utility software platform. Company and partner materials repeatedly associate Kraken with AWS infrastructure, Python, and Django, while developer-facing hiring signals reinforce that those are live implementation choices rather than old branding residue. The architectural pitch is equally important: Kraken is described as API-first, multi-tenant, and run from a single shared codebase. That combination explains the company''s claim that it can move utilities away from Oracle- and SAP-style estates in months rather than the multi-year migration cycles typical of incumbent utility IT. National Grid''s framing of Kraken as a replacement for decades-old systems is the strongest public proof point for this thesis. The operating model also appears tightly integrated around smart-meter data ingestion, settlement, tariff execution, and service workflows, which is why the platform is marketed as an operating system rather
    than as middleware.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE026
  tableRefs:
  - TE003
  figureRefs:
