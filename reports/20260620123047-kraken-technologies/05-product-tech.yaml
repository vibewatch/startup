- id: SE003
  title: AI, data, and flexibility capabilities
  body: Kraken's differentiation increasingly rests on data scale and operational AI rather than on utility software plumbing alone. Public materials claim more than 90 million customer accounts by mid-2026, over 15 countries of operation, and roughly 8 to 15 billion daily data points. On top of that data substrate Kraken layers two branded automation narratives. The first is Skyrocket, an ML system that Kraken says automates up to 40 percent of digital customer communications, implying meaningful contact-center productivity leverage. The second is Utility-Grade AI, which Kraken uses to package demand forecasting, price optimization, and anomaly detection for enterprise buyers. Kraken Asset provides the clearest real-world expression of this approach because the same platform is described as orchestrating more than 500,000 connected devices and about 2 gigawatts of virtual-power-plant capacity. In diligence terms, the AI story matters only because it is tied to real utility workflows and
    measurable operating scale rather than generic copilots.
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
