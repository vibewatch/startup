- id: SE004
  title: Deployment, extensibility, and enterprise proof
  body: 'Kraken''s enterprise case is strongest where the company can show that the same product architecture travels across geographies and adjacent sectors. Tokyo Gas is the clearest international proof: the platform was licensed into Japan for an initial electricity base with optional expansion into a far larger gas customer set, which suggests localization beyond Anglo markets. National Grid is the clearest migration proof in the United States because the public deal language emphasized replacement of decades-old customer systems at scale. Kraken also points to Portsmouth Water and Cuckoo Broadband to show that the same codebase can be extended into non-energy workflows without re-platforming the company from scratch. That extensibility is part of Kraken''s broader differentiation argument: a single product release can ship across utilities, new geographies, and even adjacent regulated-service verticals. If true, that creates a meaningful product-economics advantage over bespoke utility
    transformation programs.'
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  tableRefs:
  - TE005
- id: SE005
  title: Trust, security, and diligence gaps
  body: Kraken's public trust posture is directionally positive but still thinner than what a conservative infrastructure investor would normally want for a platform running billing and grid-edge workflows. The company claims ISO/IEC 27001 status or alignment and highlights client NPS, but the public source set does not clearly specify certification scope, audited controls, uptime history, or named SLA commitments. That lack of detail does not negate product strength, yet it matters because Kraken is concentrating critical customer operations and distributed-asset orchestration on one shared cloud platform. The same shared codebase that accelerates release velocity can also spread a severe defect rapidly across the installed base, while dependence on AWS concentrates infrastructure risk in a single hyperscaler relationship. The core diligence follow-up is therefore not whether Kraken is technically sophisticated—it is—but whether the company publishes enough evidence on resilience, security
    operations, and change-management discipline to match the scale of the workflows it now controls.
  claimRefs:
  - CE022
  - CE033
  - CE034
  - CE035
  - CE036
