companyProfile:
  summary: >-
    Kraken Technologies is a utility software platform created inside Octopus Energy in 2016 and spun
    out as a standalone company on 29 December 2025. It sells a cloud-native operating system for
    billing, CRM, field operations, and distributed-energy orchestration to major utilities including
    EDF, E.ON Next, Origin Energy, National Grid, Tokyo Gas, and Plenitude. By mid-2026 the company
    reported 90M+ customer accounts, 15+ countries, and $500M+ contracted ARR.
  foundedDate: '2016-01-01'
  founders:
    - name: Greg Jackson CBE
      role: Creator of Kraken inside Octopus Energy
      background: >-
        Octopus Energy co-founder who championed the platform's development and remains an influential
        shareholder voice after the spinout.
      claimRefs: [CO001, CO009]
    - name: James Eddison
      role: Original Kraken architect
      background: >-
        Early Octopus technologist most closely associated with Kraken's architecture and operating
        design inside the parent group.
      claimRefs: [CO001, CO010]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    Cloud-native utility operating system spanning Kraken Customer, Kraken Asset, and Kraken Field,
    covering billing, customer operations, smart-device orchestration, market and trading workflows,
    and utility field service management.
  customerFocus: >-
    Large utilities and energy retailers modernizing legacy billing, customer-service, and DER
    orchestration systems across power, gas, water, and adjacent utility workflows.
  businessModel: >-
    Recurring per-account software licensing with implementation and migration services, plus module
    expansion into adjacent operational workflows after the core platform is adopted.
  stage: late-stage private
  fundingStatus: >-
    $1B Series B completed in December 2025 at an $8.65B valuation, led by D1 Capital Partners; the
    full cap table and preference stack are not publicly disclosed.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO005, CO007, CO008, CO020, CO022]
summary:
  headline: >-
    Kraken is one of the strongest private utility-software assets in market, but the current $8.65B
    valuation already assumes a clean transition to software-grade economics and disclosure.
