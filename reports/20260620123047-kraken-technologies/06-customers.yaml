- id: SU003
  title: Adoption trajectory and geographic expansion
  body: Kraken's adoption curve is best understood as progressive entry into larger and more complex utility contexts rather than as a simple count of software logos. The platform started with Octopus as its proving ground, expanded into strategic partner-customer relationships such as Origin, then built a broader European reference set, localized into Japan with Tokyo Gas, and reached a large U.S. incumbent with National Grid. That sequencing matters because each new geography carries regulatory, language, billing, and data-model complexity. The headline account-count growth from more than 70 million contracted accounts at spinout to more than 90 million by mid-2026 suggests continuing expansion, but it should not be read like direct consumer-customer growth. The account count largely reflects the scale of utilities that Kraken serves, not the number of procurement events. In practice, each additional flagship client is more important than many smaller logos because it expands both reference
    quality and future module attach potential.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU016
  - CU017
  - CU021
  - CU027
  - CU028
  - CU032
  tableRefs:
