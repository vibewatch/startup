  figureRefs:
  - FU002
- id: SU004
  title: Retention, switching costs, and concentration
  body: 'Kraken''s durability is easier to infer than to measure. Public sources do not disclose NRR, GRR, churn, or contract lengths, so investors cannot benchmark the platform with normal SaaS retention metrics. Even so, the nature of the product implies high switching costs: once a utility migrates billing, service workflows, and customer data onto a new core platform, reversal is difficult and expensive. The evidence supporting that inference is the procurement depth itself. National Grid described a multi-year transformation, and Tokyo Gas structured its adoption as a phased expansion rather than a one-off pilot. The main counterweight is concentration. Octopus remains the anchor tenant and a material shareholder, which means the largest logo is not fully arms-length. A small set of very large customers also dominates the visible proof set, so diversification needs to be evaluated on revenue composition, not only on aggregate account counts.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU022
  - CU023
  - CU027
  - CU028
  - CU034
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: SU005
  title: Expansion vectors and diligence risks
  body: 'Kraken''s customer base supports two different expansion stories. The first is land-and-expand inside utilities: a customer may start with the customer-service and billing core, then expand into DER orchestration, field-service workflows, AI tooling, or additional geographies. Tokyo Gas and National Grid are the best public examples because their announcements imply multi-stage programs rather than single-module purchases. The second expansion story is TAM broadening beyond energy. Portsmouth Water and Cuckoo Broadband matter less for volume than for narrative: they suggest Kraken''s operating model can be ported into adjacent regulated-service sectors with similar billing and service complexity. The risks are equally clear. Public evidence is still reference-heavy and economics-light, Octopus remains an unavoidable concentration lens, and investors do not yet have transparent logo-level retention or contract-value disclosure. The diligence burden therefore shifts from proving demand
    to verifying diversification quality and attach-rate depth.'
  claimRefs:
