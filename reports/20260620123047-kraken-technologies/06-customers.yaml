company:
  name: Kraken Technologies
chapter:
  number: 6
  title: Customers
  summary: 'Kraken Technologies now has one of the strongest named-logo rosters in utility software, spanning Octopus Energy, National Grid, Tokyo Gas, Origin Energy, EDF Energy, E.ON Next, Plenitude, Portsmouth Water, and Cuckoo Broadband. The customer story is impressive because it combines incumbent-utility proof, international reach, and adjacent-vertical expansion, but it still carries material concentration and disclosure risk: Octopus remains the anchor tenant and owner, while public sources offer limited visibility into churn, contract lengths, or logo-level economics.'
sections:
- id: SU001
  title: Customer base segmentation and reference quality
  body: Kraken's customer base should be segmented by role rather than by end-consumer brand recognition. At the top level the platform serves large utility enterprises that use Kraken to operate their own retail or regulated customer accounts; those enterprise buyers then bring Kraken into contact with tens of millions of end accounts. The named roster includes UK incumbents such as EDF Energy and E.ON Next, large strategic customers such as Octopus and Origin, international expansion customers such as Tokyo Gas and Plenitude, and adjacent-sector references such as Portsmouth Water and Cuckoo Broadband. That mix matters because Kraken is not trying to prove demand with hundreds of anonymous logos. It is trying to prove that a small number of very large, operationally complex customers trust the platform with critical workflows. The trade-off is that each logo carries disproportionate signaling power, making concentration analysis central to the investment case.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU006
  - CU007
  - CU008
  - CU022
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU002
  title: Named customer proof and deployment maturity
  body: 'National Grid and Tokyo Gas are the strongest public proofs because both involve large, regulated, and operationally demanding customer environments. National Grid''s announcement framed Kraken as the platform that would replace decades-old systems for more than 6 million U.S. energy customers, making it the clearest evidence that Kraken can win a board-level transformation mandate in North America. Tokyo Gas provides the clearest Asian proof point, with an initial deployment covering about 3 million electricity customers and public discussion of further expansion into gas. Those two logos are stronger than simple brand-name marketing because they describe production-scale operational scopes. Around them sits a second ring of validation: EDF and E.ON Next confirm incumbent acceptance in the UK, Origin validates both customer usage and strategic alignment, and Plenitude shows that Kraken''s sales motion is not confined to Anglo markets.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU015
  - CU031
  - CU032
