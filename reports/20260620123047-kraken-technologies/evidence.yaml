evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Undisclosed standalone financial details below top-line ARR
    missingEvidence: >-
      Kraken discloses valuation, fundraising, and contracted ARR, but it does not publicly publish audited standalone
      revenue recognition, gross margin, EBITDA, cash burn, capex, or working-capital detail.
    whyItMatters: >-
      A software valuation at $8.65B depends heavily on margin structure and cash conversion, not only on contracted
      ARR.
    diligencePath: >-
      Request audited standalone historical financials, board-approved budget, and ARR reconciliation by cohort and
      module.
    relatedQuestionRefs:
      - QO018
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: Customer concentration and dependence on Octopus and other anchor clients
    missingEvidence: >-
      Public disclosures name large clients but do not quantify ARR share, implementation backlog, renewal terms, or
      margin concentration for Octopus, E.ON Next, National Grid, Tokyo Gas, or Origin-linked deployments.
    whyItMatters: >-
      A small number of anchor customers could drive a disproportionate share of ARR, reference quality, and roadmap
      prioritization.
    diligencePath: >-
      Request top-10 customer ARR, logo retention, contract term, gross retention, and implementation exposure by
      client.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO001
      - TO002
      - TO003
  - type: missing-source
    severity: moderate
    topic: Platform security audit scope and third-party assurance
    missingEvidence: >-
      Public materials discuss scale and cloud architecture but do not disclose the precise scope of any SOC,
      penetration-test, or independent security-audit program.
    whyItMatters: >-
      Kraken is a mission-critical billing and customer-data platform for utilities, so security assurance is central to
      enterprise risk underwriting.
    diligencePath: >-
      Request the latest security audit reports, penetration-test summaries, incident logs, and certification scope
      statements.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs: []
  - type: missing-source
    severity: moderate
    topic: Independent competitive benchmarking versus Oracle, SAP, Kaluza, and ENSEK
    missingEvidence: >-
      Frost Radar recognition is directionally positive, but public sources do not provide a neutral like-for-like
      benchmark on implementation speed, renewal rate, cost-to-serve impact, or uptime versus named competitors.
    whyItMatters: >-
      Category leadership claims are more credible when validated against comparable enterprise platforms rather than
      only customer anecdotes.
    diligencePath: >-
      Commission independent reference calls and request win/loss analysis plus implementation benchmarking against
      incumbent utility software stacks.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: ARR breakdown by client, geography, and module
    missingEvidence: >-
      Kraken discloses contracted ARR at a consolidated level only; no public breakdown is available for billing versus
      flexibility versus field modules or by geography and client.
    whyItMatters: >-
      Module and customer mix determine renewal quality, implementation risk, and the credibility of the software
      multiple implied by the last round.
    diligencePath: Request ARR bridge by module, customer, geography, and contracted go-live status.
    relatedQuestionRefs:
      - QO018
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
