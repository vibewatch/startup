  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: Covers the most material public legal and regulatory exposure points tied directly to Kraken's current footprint and disclosed client base as of June 2026; confidential client audits are not public.
  columns:
  - Risk
  - Jurisdiction
  - Why it matters
  - Current public evidence
  - Residual exposure
  rows:
  - - Billing automation failure
    - United Kingdom
    - Software errors inside regulated billing flows can trigger customer refunds, fines, and client remediation cost.
    - Ofgem fined Octopus in 2025 over billing failures on a Kraken-operated estate.
    - High — precedent already exists.
  - - GDPR / UK GDPR compliance
    - UK / EU
    - Kraken processes large volumes of customer and billing data across European utilities.
    - Kraken discloses scale in Europe; public materials do not detail control architecture.
    - High — volume is large and sanctions can be severe.
  - - APPI compliance
    - Japan
    - Tokyo Gas rollout creates local privacy and handling requirements distinct from GDPR.
    - Public customer announcement confirms Japan deployment; public control detail is limited.
    - Medium-high — regulation is manageable but localization burden is real.
  - - State privacy and utility oversight
    - United States
    - Large U.S. deployments add state-by-state privacy and customer-service obligations.
    - National Grid U.S. customer announcement confirms multi-million-account exposure.
    - Medium-high — fragmented oversight increases execution complexity.
  notes: Residual exposure reflects analyst judgment from public sources; it is not a legal opinion.
