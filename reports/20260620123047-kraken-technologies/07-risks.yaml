  researchQuestions:
  - id: QR001
    type: adverse
    status: answered
    question: What standalone execution risk follows from the December 2025 Kraken spinout?
    answer: The spinout is recent enough that governance, shared services, employee transfer, and intercompany operating agreements are still forming, so investors have limited evidence that Kraken already operates as a fully independent software company.
    targets:
    - contentRequirements/0
    - contentRequirements/5
  - id: QR002
    type: quantification
    status: answered
    question: How large is Kraken relative to its parent on disclosed scale metrics?
    answer: Kraken says it has 90 million-plus contracted accounts, $500 million-plus contracted ARR, and FY24 recognized revenue of £90 million with £35 million profit, which shows a platform business already meaningful in scale but still unevenly disclosed across software metrics.
    targets:
    - contentRequirements/3
  - id: QR003
    type: verification
    status: answered
    question: Who runs Kraken as a standalone company in 2026?
    answer: Public materials identify Amir Orad as CEO and Tim Wan as CFO of Kraken Technologies following the spinout.
    targets:
    - contentRequirements/5
  - id: QR004
    type: verification
    status: answered
    question: What ownership links remain between Kraken and Octopus Energy Group after the spinout?
    answer: Octopus Energy Group retained 13.7% of Kraken and Origin also retained equity, so the company is independent on paper but still strategically entangled with former and current affiliates.
    targets:
    - contentRequirements/2
    - contentRequirements/5
  - id: QR005
    type: quantification
    status: answered
    question: How concentrated is Kraken's customer base around Octopus Energy?
    answer: Octopus remains Kraken's largest customer at roughly 11 million accounts, or around 12% to 15% of Kraken's disclosed contracted account base.
    targets:
    - contentRequirements/2
  - id: QR006
    type: mechanism
    status: answered
    question: Why does Octopus concentration matter even if Kraken has many external clients?
    answer: Because a single client of that size influences product roadmap, renewal optics, and enterprise referenceability; any pricing dispute or insourcing move would hurt both revenue and narrative.
    targets:
    - contentRequirements/2
  - id: QR007
    type: verification
    status: answered
    question: What external flagship clients demonstrate Kraken's real-world deployment scale?
    answer: Named deployments include National Grid in the U.S., Tokyo Gas in Japan, Origin Energy in Australia, Plenitude in Europe, and non-energy customers such as Portsmouth Water and Cuckoo Broadband.
    targets:
    - contentRequirements/2
  - id: QR008
    type: adverse
    status: answered
    question: What regulatory event most directly challenges Kraken's billing-risk narrative?
    answer: The clearest adverse signal is Ofgem's 2025 billing enforcement against Octopus, which demonstrates that automated billing failures on a Kraken-operated estate can trigger refunds, penalties, and reputational damage.
    targets:
    - contentRequirements/1
  - id: QR009
    type: mechanism
    status: answered
    question: Why is regulated billing software risk different from ordinary SaaS uptime risk?
    answer: A billing or workflow error in utilities can create consumer-harm findings, mandated refunds, and client-level sanctions because the software sits inside licensed and closely regulated customer processes.
    targets:
    - contentRequirements/1
    - contentRequirements/0
  - id: QR010
    type: verification
    status: answered
    question: Which privacy regimes are most relevant to Kraken's multinational footprint?
    answer: UK GDPR and EU GDPR govern European accounts, Japan's APPI matters for Tokyo Gas, and California privacy rules matter for U.S. customer data footprints.
    targets:
    - contentRequirements/1
  - id: QR011
    type: mechanism
    status: answered
    question: How does AWS concentration amplify Kraken's operational risk?
    answer: A single-cloud architecture creates common-mode risk because an outage, security control failure, or dependency issue could affect multiple utilities at once rather than a single customer environment.
    targets:
    - contentRequirements/2
    - contentRequirements/0
  - id: QR012
    type: verification
    status: answered
    question: What public evidence exists that Kraken runs on AWS?
    answer: Kraken and AWS both describe the platform as cloud-native and hosted on AWS infrastructure.
    targets:
    - contentRequirements/2
  - id: QR013
    type: verification
    status: answered
    question: What product modules matter most to risk underwriting?
    answer: Kraken Customer powers billing and CRM, KrakenFlex and Kraken Asset support DER and VPP operations, and Kraken Field handles field-service workflows.
    targets:
    - contentRequirements/2
    - contentRequirements/1
  - id: QR014
    type: adverse
    status: answered
    question: What security-assurance gaps remain unresolved in public materials?
    answer: Public sources reviewed describe scale and architecture but do not publish the level of detailed resilience, disaster-recovery testing, or security-assurance evidence an investor would normally want for a platform this critical.
    targets:
    - contentRequirements/1
    - contentRequirements/5
  - id: QR015
    type: comparison
    status: answered
    question: Which large incumbents can compress Kraken's pricing power?
    answer: Oracle Utilities, SAP IS-U, and Salesforce Energy and Utilities Cloud all target the same enterprise buyers and can bundle broader suites, while Kaluza, ENSEK, Itineris, and C3 AI compete more directly on modern utility workflows.
    targets:
    - contentRequirements/3
  - id: QR016
    type: mechanism
    status: answered
    question: Why is competition from incumbents strategically important even if Kraken is better liked by customers?
    answer: Incumbents can discount, bundle, or exploit existing procurement relationships, which may slow Kraken win rates before product quality differences can matter.
    targets:
    - contentRequirements/3
  - id: QR017
    type: quantification
    status: answered
    question: How much platform activity does Kraken claim to process daily?
    answer: Kraken says it processes roughly 15 billion data points each day and manages around 2GW of VPP capacity over about 500,000 devices.
