  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-unit-economics
    missingEvidence: Standalone Kraken gross margin, burn rate, runway, and audited ARR-to-revenue conversion data.
    whyItMatters: Without these metrics, investors cannot determine whether the current premium valuation rests on software economics or implementation-heavy growth.
    diligencePath: Request audited standalone financials, management accounts, and cohort-level ARR bridge from the data room.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: transition-services
    missingEvidence: Public transition-service agreement and shared-services separation plan between Kraken and Octopus.
    whyItMatters: The spinout thesis assumes Kraken can operate independently; without TSA detail, control and execution risk stay elevated.
    diligencePath: Request the TSA schedule, functional cutover plan, and board-approved separation milestones.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR004
  - type: access-blocked
    severity: minor
    topic: security-assurance
    missingEvidence: Detailed disaster-recovery test results, resilience SLAs, and independent security-assurance documentation.
    whyItMatters: A platform serving 90M+ accounts needs stronger public assurance than architecture marketing alone.
    diligencePath: Review client security questionnaires, DR test packs, and any SOC or ISO audit reports under NDA.
