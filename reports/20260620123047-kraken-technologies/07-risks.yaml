    status: answered
    question: What are the most current risk signals visible at the June 2026 run date?
    answer: The freshest signals are the December 2025 spinout, the new standalone leadership team, the recent $1 billion Series B, the 90 million-plus account disclosure, and lingering regulatory overhang from the 2025 Octopus billing action.
    targets:
    - contentRequirements/0
  - id: QR025
    type: adverse
    status: answered
    question: Why does founder dependence remain relevant after appointing a standalone CEO?
    answer: Greg Jackson still anchors the parent-company relationship, public narrative, and major strategic credibility around Kraken, so founder influence remains meaningful even with Amir Orad running day-to-day operations.
    targets:
    - contentRequirements/5
  - id: QR026
    type: verification
    status: answered
    question: Which industries beyond power can Kraken point to as proof points?
    answer: Public references show deployments in water and broadband via Portsmouth Water and Cuckoo Broadband, broadening the market story beyond electricity and gas.
    targets:
    - contentRequirements/2
  - id: QR027
    type: comparison
    status: answered
    question: How does Kraken compare to Kaluza as a direct cloud-native rival?
    answer: Kaluza is the closest U.K.-born cloud-native peer, but Kraken currently discloses larger scale, broader geography, and more named multinational deployments.
    targets:
    - contentRequirements/3
  - id: QR028
    type: mechanism
    status: answered
    question: Why can a premium valuation increase operational risk?
    answer: A premium mark raises expectations for rapid independent growth and cleaner disclosure, which makes any separation delay, customer loss, or implementation issue more costly to the equity story.
    targets:
    - contentRequirements/0
    - contentRequirements/5
  - id: QR029
    type: verification
    status: answered
    question: Does the spinout remove governance conflicts between Kraken and Octopus?
    answer: No; the retained stake, commercial relationship, and Octopus's status as largest customer mean conflict management becomes a core governance task rather than disappearing.
    targets:
    - contentRequirements/5
  - id: QR030
    type: quantification
    status: answered
    question: What disclosed client experience evidence supports the platform despite risk concerns?
    answer: Kraken reports 85% client NPS, which is directionally positive, but it is still a management metric rather than an audited cross-customer dataset.
    targets:
    - contentRequirements/5
  - id: QR031
    type: verification
    status: unresolved
    question: Are detailed transition-service agreements or shared-services terms public?
    answer: No public transition-service agreement or shared-services schedule was identified in the reviewed materials.
    targets:
    - contentRequirements/5
  - id: QR032
    type: mechanism
    status: answered
    question: What would constitute a clear thesis-break event for the risk chapter?
    answer: A major client loss, a second billing-related regulatory action tied to Kraken-operated estates, or evidence that the spinout cannot separate core systems and governance cleanly would all be thesis-break events.
    targets:
    - contentRequirements/5
