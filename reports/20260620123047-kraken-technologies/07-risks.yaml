- id: regulatory-platform-risk
  title: Regulatory, privacy, and platform resilience risk
  body: 'Kraken operates in one of the most unforgiving enterprise software environments: regulated utility customer operations. The 2025 Ofgem action against Octopus is important because it shows how a billing-control issue on a Kraken-operated estate can turn into mandated customer refunds, financial penalties, and reputational scrutiny. That precedent raises the cost of future mistakes for Kraken even when the regulated entity is technically the client. At the same time, Kraken''s growth has created a wide privacy surface. UK and EU GDPR obligations matter for European accounts, APPI matters in Japan, and state privacy rules matter in the U.S. for customer data handling. The platform''s AWS concentration adds another layer of common-mode risk because a serious outage or security failure could affect multiple clients simultaneously. Public materials are strong on ambition and scale but still light on the detailed resilience, certification, and disaster-recovery evidence that a buyer or
    investor would normally want for a platform carrying this much customer and billing data. For a regulated-software vendor, missing assurance detail is itself a risk signal.'
  claimRefs:
  - CR017
  - CR018
  - CR020
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
