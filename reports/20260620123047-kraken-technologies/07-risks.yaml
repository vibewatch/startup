- id: concentration-and-partner-risk
  title: Parent and customer concentration risk
  body: Kraken's growth story is built on real external adoption, but concentration remains material. Octopus still appears to represent roughly one eighth of contracted accounts, retains equity, and provides the platform's most visible proof point. That combination is powerful when the relationship is cooperative and risky if priorities diverge. A change in Octopus contract scope, procurement posture, or internal software strategy would likely affect more than short-term revenue; it would influence reference credibility for large utilities evaluating Kraken against Oracle, Salesforce, SAP, or Kaluza. The issue is not that Kraken lacks other clients. National Grid, Tokyo Gas, Origin, and Plenitude show real multinational traction, while Portsmouth Water and Cuckoo Broadband prove product portability. The issue is that the external client list is still dominated by a relatively small number of very large logos, which makes renewal timing, expansion economics, and multi-country implementation
    quality crucial. In that context, concentration should be underwritten not only as revenue exposure but also as narrative exposure for future enterprise wins and future financing rounds.
  claimRefs:
