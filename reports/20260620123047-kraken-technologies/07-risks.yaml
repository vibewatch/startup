    - contentRequirements/1
  - id: QR018
    type: verification
    status: answered
    question: How broad is Kraken's geographic footprint?
    answer: Company materials say Kraken operates across more than 15 countries with main hubs in London and New York plus regional centers in Paris, Tokyo, and Melbourne.
