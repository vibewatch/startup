chapter:
  number: 7
  title: Risks
  summary: Kraken Technologies has real platform scale and blue-chip customer proof, but its standalone risk profile is elevated because the December 2025 spinout is still young, Octopus remains both largest client and shareholder, regulated billing failures have already produced an adverse precedent, and public financial disclosure remains too thin for a company valued at $8.65 billion.
sections:
- id: spinout-governance-risk
  title: Spinout execution and governance risk
  body: Kraken's core standalone risk is that the company is only months removed from its December 2025 separation from Octopus Energy Group. The market has already marked Kraken at $8.65 billion and management has presented it as an independent utility operating system, but public evidence of mature standalone governance is still thin. Investors know the new executive team, the rough cap table, and the headline Series B syndicate; they do not yet know the depth of transition services, the separation timetable for finance and HR systems, or the mechanisms that keep a 13.7%-owner and largest customer from dominating roadmap decisions. That matters because Kraken's product is not a peripheral analytics tool; it is a mission-critical platform that touches billing, collections, field operations, and flexibility dispatch. A spinout at this scale can succeed, but early independence is precisely when board oversight, internal controls, and decision rights are most vulnerable to ambiguity. Greg
    Jackson's continuing importance to the Octopus-Kraken story further reinforces key-person exposure even though Amir Orad now runs Kraken day to day.
  claimRefs:
