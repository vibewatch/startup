    status: answered
    question: What is the disclosed gap between contracted ARR and recognized revenue?
    answer: Kraken discloses contracted ARR above $500 million while reporting FY24 recognized revenue of £90 million, which highlights that backlog, implementation timing, and accounting recognition matter for valuation and risk assessment.
    targets:
