  - id: QR019
    type: mechanism
    status: answered
    question: Why does broader international reach raise risk rather than simply lower concentration?
    answer: Each additional country adds localization, privacy, billing, and consumer-protection complexity, so geographic breadth increases execution burden even while reducing reliance on a single market.
