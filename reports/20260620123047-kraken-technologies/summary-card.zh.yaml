  topStrengths:
    - National Grid、EDF、E.ON Next、Tokyo Gas、Origin Energy、Plenitude 等标杆客户，证明平台不只服务 Octopus 自有体系。
    - 公司覆盖计费、CRM、现场服务和 DER 编排，工作流广度少见；同时已有 90M+ 账户和 500,000+ 联网设备在线生产运行。
    - 蓝筹成长投资者领投的 $1B Series B，为长销售周期、迁移项目和持续平台 R&D 提供了融资深度。
  topRisks:
    - 相对公开披露包，估值偏贵：经审计 ARR、毛利率、NRR 和客户集中度均未公开。
    - Octopus 仍通过股权、标杆客户身份和生态控制保持战略影响力，其他公用事业买家可能质疑 Kraken 的独立性。
    - 公用事业平台销售周期长且承载关键运营，监管事故、迁移失败或旗舰客户动摇，都可能快速压缩估值倍数。
  unresolvedGaps:
    - 仍需经审计的独立 ARR、确认收入桥、毛利率和留存指标，才能承销软件质量的单位经济性。
    - 公开来源未披露装机客户按 ARR 的集中度、续约节奏或模块 attach rate。
    - 分拆后与 Octopus Energy Group 的关联公司协议披露不够细，无法完整评估治理独立性和关联方经济。
