  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-transparency
      missingEvidence: Independent uptime, field-failure, warranty-claim, and RMA cohort data for SPAN and Eaton smart-panel installs.
      whyItMatters: The feature story is credible, but durability and support burden cannot be underwritten from current public materials alone.
      diligencePath: Request warranty cohorts, return rates, MTTR, and any outage/status-history split by panel generation and channel.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: security-privacy
      missingEvidence: Public security architecture, privacy design, external certifications, pen-test summaries, or incident disclosures beyond marketing references to secure remote access.
      whyItMatters: Remote breaker control and cloud synchronization widen cyber and safety exposure, so feature claims are not enough by themselves.
      diligencePath: Request product-security documentation, certification status, data-flow diagrams, privilege model, and incident-response materials.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer or practitioner signal such as API documentation, repo activity, package metrics, or a neutral operator-community proxy.
      whyItMatters: The chapter brief asks for technical proof beyond marketing, and the assigned fast pool does not include an external developer-signal source.
      diligencePath: Add partner-integrator forum evidence, public API/community metrics, or another practitioner proxy in the next refresh cycle.
    - type: private-evidence-only
      severity: minor
      topic: integration-depth
      missingEvidence: Current interoperability matrix for batteries, inverters, chargers, and panel generations plus release cadence by product line.
      whyItMatters: Integration breadth and cadence drive upgrade risk, installer complexity, and attach-rate potential.
      diligencePath: Request the current compatibility matrix, firmware-release notes, and installation mix by panel generation.
