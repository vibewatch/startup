        - Continued partner announcements without quantified financial disclosure.
      - - Bear
        - Electrification demand slows while utility monetization takes longer than expected
        - Flat or down-round risk rises because public proof remains weaker than valuation narratives
        - Price friction, subsidy rollback, and longer sales cycles dominate
        - More independent reporting on cooling deployment or delayed conversions.
    notes: >-
      Scenario logic is qualitative because the assigned evidence pool does not disclose a current revenue base, margin
      structure, or financing terms needed for a precise modeled range.
    claimRefs:
      - CV004
      - CV005
      - CV010
      - CV011
      - CV013
      - CV014
