              - CM008
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to four public product categories competing for the same home electrification
              workflow: full smart-panel replacements, add-on smart load centers, monitoring-only retrofits, and
              single-load load-shed devices. That matters because SPAN is not just competing against another premium
              panel vendor; it is competing against cheaper ways to avoid service upgrades, manage backup loads, or
              simply gain visibility into household consumption. The direct peer set includes Lumin and Schneider's
              Square D Energy Center, while the practical substitute set includes a traditional panel plus a monitor
              such as Emporia or Sense, plus narrower load-management devices. Latitude Media also shows an adjacent
              entrant class in utility-facing smart meters, which compete on grid-edge visibility even when they do not
              replicate whole-home circuit control.
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP016
      - number: '3.2'
        title: Control, installation, and pricing tradeoffs
        blocks:
          - type: paragraph
            body: >-
              SPAN's core differentiation in the pool is breadth: its official materials describe a full panel
              replacement with 16 to 48 controllable circuits, app-based monitoring, and upgrade-avoidance load
              management, while Eaton mirrors the same circuit-level control claims in its partnered offer. By contrast,
              OhmSnap frames Lumin as an add-on that leaves the incumbent panel in place and controls up to 12 selected
              circuits, while monitoring-only substitutes preserve visibility but not automation. Public price signals
              also line up with that capability ladder. Independent 2026 guides consistently place full smart panels at
              the top of the installed-cost stack, Lumin in the middle, and monitoring substitutes at the bottom, which
              means SPAN must win on avoided upgrade cost, backup quality, and long-term software value rather than
              upfront affordability.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP008
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP016
      - number: '3.3'
        title: Channels, lock-in, and durability
        blocks:
          - type: paragraph
            body: >-
              The Eaton relationship is the clearest distribution advantage in the chapter pool. Solar Power World
              reported a $75 million Eaton investment and a plan to route Eaton-branded smart panels with SPAN Energy
              Intelligence through Eaton's distribution, installer, and homebuilder networks, which can narrow a classic
              startup disadvantage against incumbent electrical brands. At the same time, the same official materials
              show that Eaton- and SPAN-branded panels share the SPAN Energy Intelligence layer and app experience. That
              supports channel scale, but it also implies that product differentiation may remain concentrated in
              software and installer execution rather than in a wholly distinct Eaton stack. Lock-in therefore looks
              mixed: SPAN support materials say the panels work with industry-standard breakers and both retrofit and
              new-construction projects, but the software layer, backup-management workflows, and installer ecosystem
              still create softer switching costs once a customer adopts the product.
            claimRefs:
              - CP004
              - CP006
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.4'
        title: Adverse evidence and open questions
        blocks:
          - type: paragraph
            body: >-
              The public downside case is not that SPAN lacks category alternatives; it is that several lower-cost and
              more incremental substitutes solve enough of the buyer job to cap pricing power. ElectrifyCost explicitly
              warns that cloud-dependent smart panels carry vendor-support risk if the startup is acquired or winds
              down, and Latitude Media reports both smart-meter competition and cooling smart panel deployments at the
              grid edge. Those signals matter because they make incumbent response and substitute encroachment plausible
              even if SPAN keeps a superior app or control model. The assigned evidence still leaves important diligence
              gaps, especially on realized ASPs, installer discounting, customer multi-homing, and how often upgrade
              avoidance or utility programs actually overcome the premium versus add-on or monitor-only alternatives.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Eaton is the clearest distribution amplifier
            body: >-
              Eaton's investment and channel access are the strongest non-product edge in the assigned pool because they
              can place SPAN software inside incumbent distribution, installer, and homebuilder routes.
            calloutType: strength
            claimRefs:
              - CP006
              - CP013
          - type: callout
            title: Substitute pressure is mostly economic, not purely technical
            body: >-
              Lower-cost overlays, monitor-only retrofits, and smart-meter visibility products can satisfy enough of the
              buyer job to constrain SPAN's pricing power even if SPAN retains deeper automation.
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing surface
        blocks:
          - type: paragraph
            body: >-
              The clearest current monetization anchor is the SPAN Panel, which SPAN lists from $2,550 before
              installation, taxes, and shipping. Netfigo separately reports a $4,000-$6,000 installed cost, but that
              low-reputation estimate is not an official realized-price disclosure. Public materials present SPAN Energy
              Intelligence, PowerUp, app control, and free software updates as capabilities bundled into panel
              deployments. Netfigo asserts that premium software produces recurring revenue, yet the retained official
              and partner sources provide no price, attach rate, subscriber count, or accounting treatment that verifies
              a standalone recurring-software stream. Referral economics with installers are likewise asserted only by
              Netfigo. Utility programs and XFRA broaden the opportunity set, but their contract prices and revenue
              recognition remain private.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI013
              - CI014
              - CI015
              - CI016
