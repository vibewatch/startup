  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      SPAN layers panel hardware, embedded energy management, cloud/app services, and installer/channel delivery into
      one electrification platform.
    data:
      layers:
        - label: Electrical hardware
          detail: Smart panel hardware replaces the legacy load center and exposes controllable circuits plus metering.
          modules:
            - label: Panel variants
              value: 16-48 circuits
              note: MAIN and MLO formats across retrofit and new-build use cases
            - label: Connectivity
              value: Ethernet / Wi-Fi / cellular
              note: Public datasheet lists all three
          outputs:
            - label: Circuit telemetry
              note: Real-time monitoring and breaker status
            - label: Backup-ready circuits
              note: Inputs for backup prioritization when storage is present
        - label: Embedded energy management
          detail: SPAN Energy Intelligence and PowerUp provide the load-management and backup logic above the hardware.
          modules:
            - label: SPAN Energy Intelligence
            - label: PowerUp EMS
          outputs:
            - label: Load management
              note: Supports upgrade avoidance in retrofit scenarios
            - label: Backup orchestration
              note: Coordinates priorities when battery storage is present
        - label: Cloud and firmware services
          detail: Cloud synchronization, OTA firmware updates, and event alerts extend the product beyond on-box hardware.
          modules:
            - label: Cloud sync
            - label: OTA firmware
            - label: Alerts
          outputs:
            - label: Remote visibility
            - label: Ongoing software updates
        - label: Customer control surface
          detail: The SPAN Home App is the primary homeowner interface and also spans Eaton-branded smart panels.
          modules:
            - label: Circuit control
            - label: Energy dashboard
            - label: Backup settings
          outputs:
            - label: One app experience
              note: Shared across SPAN and Eaton smart panels
            - label: Whole-home insights
        - label: Channel and ecosystem
          detail: Authorized installers, Eaton, solar/battery pairings, and SPAN Drive broaden delivery and use cases.
          modules:
            - label: Authorized installers
            - label: Eaton channel
            - label: SPAN Drive
          outputs:
            - label: Retrofit and new-build deployment
            - label: Broader electrification workflow
        - label: Compliance and service governance
          detail: >-
            Product trust rests on electrical-code claims, published certifications, breaker-compatibility guidance, and
            an authorized-installer service path.
          modules:
            - label: UL certifications
            - label: NEC / PowerUp claims
            - label: Authorized service path
          outputs:
            - label: Published safety anchors
            - label: Controlled internal servicing
    approximationNotes: null
    claimRefs:
