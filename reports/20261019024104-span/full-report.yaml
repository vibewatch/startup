  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: panel control, service-upgrade avoidance, and grid-edge software'
        blocks:
          - type: paragraph
            body: >-
              SPAN should not be framed as a generic solar, battery, or electrical-equipment vendor. The public evidence
              places it in the smart electrical panel and residential energy-management layer: hardware that replaces or
              augments the panel, software that manages circuits and backup priorities, and controls that let a home add
              electrified loads without defaulting to a larger service upgrade. That boundary includes panel hardware,
              the SPAN Home App, Energy Intelligence software, and load-management features such as PowerUp; it excludes
              solar generation hardware, battery packs themselves, and commodity breaker panels that do not add
              circuit-level control. The practical substitute set is therefore status-quo panel upgrades, transfer
              switches, subpanels, smart meters, and other load-management approaches rather than the whole
              distributed-energy stack. This matters because the value proposition is less about selling electrons and
              more about monetizing avoided infrastructure cost and better orchestration of household loads.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 'Buyer, user, and payer map: homeowner retrofit, new-build, and utility channels'
        blocks:
          - type: paragraph
            body: >-
              The assigned pool shows three active buying motions. First, retrofit homeowners adopt SPAN when they add
              EV charging, heat pumps, solar, or batteries and want to stay within existing service constraints while
              gaining circuit-level visibility and backup control. Second, homebuilders and developers use SPAN to make
              new homes electric-ready, reduce upgrade-related project cost, and improve the post-close homeowner
              experience through monitoring and service data. Third, utilities and grid operators are an emerging budget
              owner because load management can defer distribution and service-upgrade spend at scale. Installers,
              electrical contractors, and Eaton's distribution and homebuilder network are critical channels across all
              three motions, which means market adoption is shaped as much by channel enablement and workflow fit as by
              end-user demand. The utility motion is strategically important because it can shift SPAN from a premium
              homeowner product into infrastructure sold through larger institutional budgets.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
      - number: '2.3'
        title: Sizing lenses, adoption drivers, and the constraints that keep TAM imprecise
        blocks:
          - type: paragraph
            body: >-
              Public market sizing in the pool is evidence-constrained rather than a clean TAM/SAM/SOM stack. SPAN's
              utility page provides the broadest quantified lens, citing rising residential load, higher
              distribution-upgrade spend, and large utility capex requirements, then translating that backdrop into
              per-household and 4M-service-territory cost comparisons. The builder release adds a narrower
              project-economics lens through claimed per-site savings, while homeowner pricing signals show that the
              category still carries premium upfront cost. Those lenses support a real opportunity, but they also show
              why valuation depends on adoption timing and budget ownership rather than on one big-market headline.
              Adoption can be slowed by local code and approval workflows, the need for trained installers, softening
              direct-consumer demand tied to rooftop solar and EV cycles, competition from smarter meters, and the fact
              that the clearest utility-scale savings numbers remain company-authored rather than independently audited
              market data.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
