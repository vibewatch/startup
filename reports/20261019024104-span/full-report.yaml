      - number: '6.2'
        title: Adoption proof exists, but mostly as channel and anecdotal evidence
        blocks:
          - type: paragraph
            body: >
              Public proof of adoption is real but uneven. The cleanest named builder reference is PulteGroup in SPAN's
              February 2025 release, where the

              company cites an already-running program, strong homebuyer feedback, and interest in broader deployment.
              Residential proof is thinner: the best

              direct usage signal in the retained pool is an anonymous but detailed r/solar post describing a live SPAN
              installation with three Tesla batteries

              and positive outage performance. On the utility side, SPAN shows channel access through a live Hawaiian
              Electric rebate and Latitude's reporting

              that utilities are in active discussions, but it does not name utility customers or disclose deployment
              counts. That means public evidence proves

              use cases and channel traction more clearly than it proves scaled installed-base growth.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU013
              - CU014
      - number: '6.3'
        title: Expansion logic depends on partner-led distribution and adjacent electrification projects
        blocks:
          - type: paragraph
            body: >
              The most credible expansion story is not classic SaaS-style land-and-expand; it is channel and project
              expansion. SPAN's official materials focus

              on backup control, electrification upgrades, and app-driven circuit management, which fit larger home
              projects such as batteries, EV charging,

              solar, and heat pumps. Eaton adds a second expansion vector by taking the same SPAN Energy Intelligence
              software and home app into Eaton-branded

              panels sold through builder and contractor networks. That can widen reach without changing the homeowner
              workflow. The builder release also

              frames product expansion around larger circuit counts and all-electric-ready homes, suggesting SPAN is
              trying to win more of the new-construction

              scope rather than relying only on retrofit pull-through.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.4'
        title: Retention, concentration, and utility conversion remain the core unknowns
        blocks:
          - type: paragraph
            body: >
              The biggest diligence gap is not whether SPAN has any customers; it is whether those customers are
              durable, scalable, and economically attractive.

              None of the retained sources disclose customer count, renewal rates, churn, net revenue retention, or
              top-customer concentration. Latitude's

              reporting is useful precisely because it adds tension: it says the direct-to-consumer market is relatively
              small, highlights cooling demand in

              rooftop solar and EVs, and shows SPAN leaning harder into utilities while still working out the business
              model. That leaves two live underwriting

              questions: whether growth is becoming concentrated in partner-led channels such as Eaton and builders, and
              whether utility discussions convert to

              production programs with repeatable unit economics rather than bespoke pilots.
            claimRefs:
              - CU011
              - CU012
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel breadth is the strongest public proof
            body: >-
              Eaton distribution, builder references, authorized installers, and a live utility rebate together make the
              go-to-market surface broader than a pure direct-to-homeowner hardware sale.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU009
              - CU013
          - type: callout
            title: Public durability proof still lags channel narratives
            body: >-
              The retained sources show real use cases, but they still do not disclose customer count, retention,
              concentration, or named utility conversions, which keeps customer-quality underwriting below high
              conviction.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >
              The reviewed evidence points to a risk stack led by execution and deployment quality. Independent reviews
              describe high installed cost, meaningful configuration complexity, and tangible downside when
              non-certified electricians handle commissioning, while SPAN's own materials confirm that the product is a
              software-defined panel whose value depends on app control, load-management logic, and authorized service
              support. That combination makes the core underwriting question less about whether the product is
              differentiated and more about whether SPAN can scale deployments, support, and partner coordination
              without letting field quality or customer economics deteriorate.


              The risk pattern is also asymmetric. SPAN has mitigating evidence in the form of historical fundraising,
              Eaton's 2026 investment and distribution commitment, and official claims that PowerUp can avoid service
              upgrades or extend battery runtime. Those mitigants do not eliminate downside if permit acceptance,
              installer performance, Wi-Fi reliability, utility adoption, or channel execution fail in practice. Several
              investment-relevant mitigations still depend on third-party execution and company-controlled disclosures
              rather than independently audited operating data, while a 2025 industry report described cooling
              smart-panel deployment and competition from advanced meters.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and policy dependence
        blocks:
          - type: paragraph
            body: >
              The cleanest regulatory signal in the assigned pool is not a permit or regulator approval; it is SPAN's
              own explanation that PowerUp is code-compliant under NEC logic while final approval remains subject to
              local regulations. That matters because the product's value proposition explicitly includes avoiding some
              service upgrades and enabling flexible electrification, so permit interpretation, local inspector comfort,
              and utility-program acceptance can shape actual attach rates and realized customer savings. The utilities
              page goes further by describing utility-set dynamic service ratings and peak-event management, which means
              part of SPAN's utility thesis depends on external program design rather than the panel alone.


              The public evidence reviewed does not include direct regulator, court, privacy, or recall records that
              could establish SPAN's legal and incident history. That evidence gap must not be interpreted as proof that
              no issue exists. The practical implication is that a buyer can rank legal or policy risk as unconfirmed
              rather than cleared: SPAN has a plausible code-compliance story, but investors still need direct evidence
              on litigation, enforcement, safety events, cybersecurity incidents, and jurisdiction-specific approval
              friction before taking residual legal exposure down materially.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
      - number: '7.3'
        title: Operational, quality, and software-control risks
        blocks:
          - type: paragraph
            body: >
              Operationally, the evidence points to a business that is more exposed to installation quality and software
              commissioning than a commodity panel vendor would be. SPAN's support materials say an authorized installer
              is required for internal service, and both independent review sources emphasize that installer quality is
              the biggest variable in customer satisfaction. One review specifically states that non-certified
              electricians leave mislabeled circuits, incomplete app commissioning, or broken solar-and-battery
              integrations, which turns deployment mistakes into product-experience and support-cost risk rather than
              simple contractor noise.


              The product also depends on software and network reliability. SPAN and its partner materials sell
              circuit-level remote control, app-driven insights, and configurable backup priorities as core value; the
              same review set notes that weak Wi-Fi near the panel is a common failure point. That does not mean SPAN is
              unusually fragile, but it does mean the product promise rests on a combined hardware-software-service
              stack. If field connectivity, firmware quality, or installer setup lags, customer outcomes and
              referenceability can degrade quickly even when the underlying panel hardware is functioning.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR015
      - number: '7.4'
        title: Partner dependence, capital exposure, and monitoring triggers
        blocks:
          - type: paragraph
            body: >
              SPAN's partner and capital profile reduces some near-term downside while creating its own dependency risk.
              Eaton publicly markets the joint solution as part of its home-electrification strategy, and Eaton
              announced a $75 million investment in 2026 alongside plans to distribute SPAN technology through its
              installer and homebuilder networks. That is a meaningful capital, distribution, and credibility benefit,
              but it also means SPAN's market access increasingly rides on a large partner's roadmap and sustained
              commitment. The utilities page similarly positions SPAN inside demand-management and
              infrastructure-avoidance programs whose rules sit outside SPAN's direct control.


              Capital risk looks mitigated but not eliminated. SPAN's 2023 financing announcement reported $231 million
              in total funding, while the 2026 Eaton investment adds a fresher capital marker. Neither disclosure
              provides current revenue, gross margin, cash balance, runway, round terms, or reliable secondary-market
              pricing. Current valuation and liquidity therefore remain under-evidenced. The cleanest thesis-break
              triggers are measurable: repeated permit rejection, persistent installer-quality issues, slower utility or
              partner uptake, failure to ship the announced Eaton-integrated products, or a financing event that reveals
              weaker economics than the historical growth story implies.
            claimRefs:
              - CR001
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority kill criteria
            body: >-
              Escalate to a no-go view if diligence cannot verify consistent permit acceptance for PowerUp-style
              deployments, field-quality outcomes from certified installers, and a current financing or secondary-market
              marker that supports the historical growth narrative rather than relying on stale fundraising evidence.
            calloutType: risk
            claimRefs:
              - CR003
              - CR006
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The chapter's bottom line is track, with medium confidence, high risk, and no publicly supportable
              valuation stance. The positive case is not imaginary: SPAN still sells a differentiated smart panel,
              advertises circuit-level control and backup flexibility, and now has a scaled partner path through Eaton.
              Public evidence also shows that Eaton put new capital behind the company in 2026, which is a stronger
              signal than a marketing-only partnership. But the evidence remains price-sensitive rather than
              price-clearing. The public record does not disclose current recognized revenue, gross margin, installed
              base, retention, or liquidation-preference terms, so an outside investor cannot convert channel momentum
              into a defensible entry multiple. That pushes the disciplined call toward tracking the company until
              either valuation terms improve or current operating proof improves.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis versus counterevidence
        blocks:
          - type: paragraph
            body: >-
              The thesis is that SPAN's software-defined load control addresses a real electrification pain point:
              homes, builders, and utilities need ways to add EV charging, batteries, and heat pumps without repeated
              service upgrades. The Eaton alliance matters because it broadens access to builders, distributors, and
              installers that a stand-alone hardware startup would struggle to reach on its own. The anti-thesis is that
              public evidence still shows adoption friction. Independent reporting describes the direct-to-consumer
              offer as expensive, the addressable residential market as pressured by slower rooftop-solar and EV demand,
              and the utility expansion as promising but still commercially unsettled. The investment question is
              therefore not whether SPAN has a credible product; it is whether the utility and partner channels can
              translate that product edge into repeatable, disclosed economics before capital-market conditions or
              subsidy changes tighten again.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              The bull case requires proof that Eaton-enabled distribution and utility programs turn SPAN's hardware
              premium into lower total project cost for builders and homeowners. The base case is more modest: SPAN
              keeps winning strategic partners and raising capital, but outside investors still cannot see enough
              current operating detail to underwrite a premium entry price. The bear case combines slower
              electrification demand, policy rollback, and longer utility sales cycles, which would make today's public
              momentum a poor proxy for realized value. Because the public record does not provide a recent revenue or
              margin base, the scenario work here is deliberately qualitative; the right discipline is to map what would
              move the call, not to manufacture false precision.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The remaining valuation work is straightforward but not optional. Management needs to show current
              recognized revenue, gross margin by product line, installed-base growth, utility-program conversion, and
              the cap-table terms that determine whether new investors are protected from a flat or down round. A
              positive update would be third-party evidence that utility partners are subsidizing deployment at scale or
              that Eaton distribution is converting into measurable unit growth with acceptable warranty and
              service-cost outcomes. Thesis-breakers are equally clear: evidence of slowing electrification demand
              without offsetting utility traction, partner distribution that does not convert into disclosed commercial
              scale, or financing terms that leave common-equity economics materially worse than the headline valuation
              implies. Until those questions close, SPAN remains investable to monitor, not yet to chase.
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track SPAN rather than buy until current operating metrics or downside-protective terms make the entry
              case concrete.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: Main downside driver
            body: >-
              Public evidence shows real strategic interest, but direct-to-consumer price friction and utility-channel
              execution risk can still outrun disclosed operating proof.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV014
          - type: callout
            title: What would move the call
            body: >-
              A stronger stance would require third-party evidence of scaled channel conversion plus current revenue,
              gross margin, and financing-term disclosure.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV011
              - CV014
