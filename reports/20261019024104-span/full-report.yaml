  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The delivered product is not framed as a standalone breaker box; SPAN positions the panel as the home's
              central energy-management system, with the homeowner interacting through the SPAN Home App rather than at
              the load center alone. Across official and partner materials, the core workflow is consistent: monitor
              individual circuits, switch them remotely, set backup priorities when storage is present, and coordinate
              solar, batteries, EV charging, and other heavy loads without treating each device as a separate control
              silo. The current public lineup also suggests a real commercial product family rather than a single hero
              SKU, spanning smaller-format and higher-capacity panels, adjacent EV charging, and an Eaton-branded
              channel extension.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE012
              - CE013
      - number: '5.2'
        title: Architecture, deployment, and operating model
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a layered operating model. Hardware at the panel provides controllable circuits,
              metering, and the physical interface to home loads; SPAN Energy Intelligence and PowerUp sit above that
              hardware as the logic layer for load management and backup behavior; and the app/cloud layer exposes
              monitoring, alerts, firmware updates, and remote control. This architecture is designed to solve a
              concrete deployment problem: adding electrification upgrades without forcing a full service upgrade in
              every home. Product and installer materials also make clear that the architecture is channel-dependent in
              practice, because commissioning and some service actions flow through authorized installers rather than
              through a purely self-serve device model.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE011
              - CE013
      - number: '5.3'
        title: Differentiation and maturity
        blocks:
          - type: paragraph
            body: >-
              SPAN's strongest public differentiation is not raw hardware capacity; it is the combination of a
              code-compliant panel, software-defined load control, and a unified app experience that extends to Eaton's
              co-branded product. That gives SPAN a credible wedge with builders, contractors, and electrifying
              homeowners who care about retrofit friction, backup orchestration, and circuit-level control more than
              about commodity panel pricing alone. The support surface and multiple current SKU references suggest the
              product has moved beyond an early pilot stage, but the available public pool still does not show
              installed-base size, field reliability cohorts, or objective adoption split across direct versus channel
              distribution.
            claimRefs:
              - CE002
              - CE005
              - CE012
              - CE014
      - number: '5.4'
        title: Trust, compliance, and technical risk
        blocks:
          - type: paragraph
            body: >-
              On the positive side, SPAN's public materials do disclose concrete trust and safety anchors: breaker
              compatibility guidance, NEC-oriented claims for the PowerUp workflow, public certifications on the panel
              datasheet, and a service model that does not imply end users should open the product themselves. They also
              describe secure remote access, OTA firmware updates, cloud synchronization, and system alerts, which
              matters because the product's value proposition depends on remote control and always-available software.
              The gap is that these are still feature and standards disclosures, not operating proof. The assigned
              source pool does not provide public uptime history, warranty cohorts, external security certifications,
              privacy architecture, or independent failure/incident evidence, so underwriting technical resilience still
              requires management disclosure.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software-defined panel is the real product
            body: >-
              Public evidence consistently describes SPAN as an energy-management stack layered on top of the electrical
              panel, which is a stronger differentiation story than treating the offering as a premium load center
              alone.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE012
              - CE013
          - type: callout
            title: Public operating proof lags the feature story
            body: >-
              The product surface documents capabilities and standards, but the current pool does not provide
              independent reliability, security, or service-burden metrics for the remote-control stack or the
              installer-dependent support model.
            calloutType: risk
            claimRefs:
              - CE007
              - CE009
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are broader than direct-to-homeowner sales
        blocks:
          - type: paragraph
            body: >
              SPAN does not present itself as a single-segment direct-to-consumer product. Its own product and support
              surfaces position homeowners as the end

              users, but keep authorized installers in the specification and service loop, which matters because
              installers decide fit, sizing, and whether the

              project is a retrofit or new build. Eaton's official partner page broadens that picture further by
              explicitly targeting homeowners, builders, and

              contractors, while SPAN's current product page adds a utility-linked rebate surface through Hawaiian
              Electric. Taken together, the public evidence

              supports four distinct customer motions: retrofit homeowners, new-home builders, installer/contractor
              channels, and utility-linked programs.

              What it does not disclose is the mix across those motions or which segment drives the majority of revenue.
            claimRefs:
              - CU001
              - CU002
              - CU005
