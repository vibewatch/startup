              - CO007
              - CO010
              - CO011
      - number: '1.4'
        title: Adverse readthrough and open gaps
        blocks:
          - type: paragraph
            body: >-
              The bearish readthrough is not a scandal or legal event in the retained pool; it is execution and
              market-structure risk. Latitude reported that smart-panel deployment was cooling versus the 2020-2021
              surge and that new smart meters were increasingly competing for the same grid-edge visibility budget,
              while also noting that SPAN's utility monetization model was still being worked out. That means the
              company can point to attractive partner narratives without yet giving outside investors enough public
              operating data to judge whether the channel shift is driving durable adoption, attractive unit economics,
              or a valuation that still fits private-market expectations.
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO014
