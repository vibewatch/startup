chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product position
        blocks:
          - type: paragraph
            body: >-
              The retained official pages consistently describe SPAN as a software-defined electrical panel company
              rather than a generic smart-home brand. Its current product narrative centers on replacing the home's
              electrical panel with an app-connected control layer that gives circuit-level visibility, battery-backup
              orchestration, and load management intended to defer service upgrades when homeowners add large electric
              loads. That product framing is strategically coherent with the broader electrification thesis, but the
              retained source set does not disclose a founding date and only gives an older headquarters reference from
              2022 rather than a fresh company profile or filing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and channel model
        blocks:
          - type: paragraph
            body: >-
              The public voice in the retained source set is concentrated around co-founder and CEO Arch Rao, whose
              Tesla product background fits SPAN's hardware-software positioning and whose comments anchor both funding
              and utility-channel coverage. The more important strategic development is channel expansion: by early 2025
              SPAN was no longer framed only as a homeowner retrofit story, but as a three-lane model spanning direct
              residential demand, builders, and utilities. That broadens TAM capture and potentially lowers
              customer-acquisition friction, but it also increases execution dependence on partners whose economics,
              rollout cadence, and governance rights are not publicly spelled out in the sources retained here.
            claimRefs:
