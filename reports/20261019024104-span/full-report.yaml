      - CE004
      - CE005
      - CE006
      - CE011
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      SPAN's customer motion starts with electrification pain, flows through specification channels, and expands through
      partner and utility surfaces.
    data:
      items:
        - label: Electrification trigger
          actor: Homeowner
          phase: Need discovery
          touchpoints:
            - EV, battery, solar, or heat-pump upgrade pushes panel constraints
            - Buyer looks for more control, backup flexibility, and energy visibility
        - label: Installer-led fit check
          actor: Authorized installer
          phase: Specification
          touchpoints:
            - Installer helps determine which panel fits the home's electrical needs
            - Retrofit versus new-build fit is decided before purchase
        - label: Purchase path selection
          actor: Homeowner or builder
          phase: Channel choice
          touchpoints:
            - Direct homeowner project
            - Builder program for all-electric-ready homes
            - Eaton-enabled builder or contractor route
        - label: App activation
          actor: End user
          phase: Daily operation
          touchpoints:
            - Circuit-level control from the SPAN Home App
            - Ongoing energy insights and backup prioritization
        - label: Expansion loop
          actor: Household
          phase: Adjacent upgrades
          touchpoints:
            - Battery, EV charger, solar, and heat-pump additions deepen product value
            - Larger panel configurations widen fit for more complex homes
        - label: Utility or partner scale path
          actor: Utility, builder, or Eaton channel
          phase: Portfolio expansion
          touchpoints:
            - Rebates and utility cost-avoidance logic lower purchase friction
            - Same SPAN software stack can travel through Eaton-branded panels
