  - id: FP001
    title: 'Positioning map: installation intrusion vs control depth'
    type: quadrant
    summary: >-
      Ordinal scores from the assigned evidence place SPAN and Eaton+SPAN at the high-control, high- intrusion end of
      the market, while cheaper substitutes cluster lower on both axes.
    data:
      xAxis:
        label: Installation intrusion
        min: 1
        max: 5
        low: Incremental overlay
        high: Full panel replacement
        description: Ordinal score from cited installation form factors and replacement requirements
        scale: ordinal
      yAxis:
        label: Control depth
        min: 1
        max: 5
        low: Visibility only
        high: Whole-home circuit automation
        description: Ordinal score from cited monitoring, switching, and backup-management capabilities
        scale: ordinal
      points:
        - label: Load-shed device
          x: 1
          'y': 1
          summary: Single-load management without app-first whole-home control
