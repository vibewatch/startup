      - number: '4.2'
        title: Distribution, delivery costs, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              SPAN's core route to market remains installer-mediated: an authorized installer selects the appropriate
              panel, and an authorized installer is required to service the internal assembly. That model can improve
              installation quality but leaves SPAN exposed to installer availability, markup, training, and service
              expense that are not quantified publicly. Netfigo explicitly describes the installed cost as significant
              and says the licensed-electrician requirement limits the sales channel, making it the chapter's adverse
              evidence. Eaton offers a potentially important counterweight. Independent reporting says Eaton plans to
              distribute a SPAN-integrated smart panel through its established installer and homebuilder networks. This
              may reduce channel acquisition friction, but no source discloses channel margin, lead conversion, sales
              cycle, CAC, or payback.
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI016
      - number: '4.3'
        title: Customer value proxies and emerging expansion
        blocks:
          - type: paragraph
            body: >-
              SPAN supplies customer-value evidence rather than company-margin evidence. Its utilities page models
              per-household electrification cost at $19,000 without SPAN versus $8,500-$10,500 with SPAN and PowerUp,
              including a stated $1,500-$3,500 SPAN Edge cost. Those are company-authored avoided-infrastructure
              estimates, not invoice prices, recognized revenue, or gross profit. The same page says SPAN can provide
              more than thirty times the usage data of a traditional smart meter, which could support utility pricing
              and load-management offerings but is not independently benchmarked here. XFRA adds a second expansion
              path: SPAN announced deployments beginning later in 2026 and a pipeline intended to reach gigawatt scale
              in 2027. Its homeowner package implies hardware and subsidy obligations, while pricing, utilization,
              funding responsibility, and contribution margin remain undisclosed.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Eaton's $75 million strategic investment is the strongest fresh capital signal in the assigned evidence
              and is more useful than a financing headline alone because it accompanies product integration and channel
              access. It is still funding raised, not cash currently available: none of the retained sources gives
              closing terms, use-of-funds detail, cash on hand, burn, debt, project-finance obligations, covenant
              headroom, or a next-round trigger. The public record therefore cannot support a runway calculation. The
              underwriting conclusion is correspondingly bounded. SPAN has visible product pricing, multiple routes to
              market, and plausible customer-cost savings, but revenue mix, realized ASP, warranty and service cost,
              gross margin, CAC/payback, and working-capital requirements remain private. The financial profile is
              strategically promising but not underwritable to high conviction without management accounts and
              channel-level cohorts.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Eaton combines financing and distribution leverage
            body: >-
              The $75 million investment is strategically stronger than an isolated funding event because independent
              reporting also ties Eaton to installer and homebuilder distribution.
            calloutType: insight
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: Public evidence stops before the P&L
            body: >-
              List prices, modeled customer savings, and product rollout plans do not establish recognized revenue,
              gross margin, burn, or runway.
            calloutType: risk
            claimRefs:
              - CI011
