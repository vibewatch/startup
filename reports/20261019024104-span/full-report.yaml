        title: Exhibits
        blocks:
          - type: callout
            title: Utility pivot raises evidence-quality risk
            body: >-
              SPAN's partner narrative is getting stronger, but the same independent coverage says smart-panel
              deployment is cooling and that utility monetization is still being worked out. That leaves a live risk
              that channel breadth outpaces proof of repeatable economics.
            calloutType: risk
            claimRefs:
