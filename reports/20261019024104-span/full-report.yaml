      - number: '1.3'
        title: Funding and milestones
        blocks:
          - type: paragraph
            body: >-
              Funding and milestone evidence shows a business that kept raising strategic capital while extending its
              product family. Canary Media reported a $90 million Series B in March 2022 that brought disclosed funding
              at that point to $134 million, while Eaton announced a later $75 million investment in March 2026
              alongside a commercial partnership. Product milestones also moved forward: SPAN publicly launched new
              panel variants in February 2025, said deliveries would begin in April 2025, and Eaton said joint solutions
              were expected in the second quarter of 2026. What is missing is just as important as what is present: none
              of the retained sources provides a current valuation mark, refreshed lifetime capital total, or current
              operating metrics.
            claimRefs:
              - CO005
