company:
  name: "SPAN"
chapter:
  number: 1
  title: "Company Overview"
  summary: "SPAN is a private home-electrification infrastructure company centered on smart electrical panels and software-led load control, with public evidence showing a widening channel strategy through builders, utilities, and Eaton. The same evidence base supports product and financing milestones, but it still leaves current valuation, revenue scale, installed-base size, headcount, and governance depth materially under-disclosed."
sections:
  - id: "identity-and-product-position"
    title: "Identity and product position"
    body: "The retained official pages consistently describe SPAN as a software-defined electrical panel company rather than a generic smart-home brand. Its current product narrative centers on replacing the home's electrical panel with an app-connected control layer that gives circuit-level visibility, battery-backup orchestration, and load management intended to defer service upgrades when homeowners add large electric loads. That product framing is strategically coherent with the broader electrification thesis, but the retained source set does not disclose a founding date and only gives an older headquarters reference from 2022 rather than a fresh company profile or filing."
    claimRefs: ["CO001", "CO002", "CO003", "CO004"]
    tableRefs: ["TO001"]
  - id: "leadership-and-channel-model"
    title: "Leadership and channel model"
    body: "The public voice in the retained source set is concentrated around co-founder and CEO Arch Rao, whose Tesla product background fits SPAN's hardware-software positioning and whose comments anchor both funding and utility-channel coverage. The more important strategic development is channel expansion: by early 2025 SPAN was no longer framed only as a homeowner retrofit story, but as a three-lane model spanning direct residential demand, builders, and utilities. That broadens TAM capture and potentially lowers customer-acquisition friction, but it also increases execution dependence on partners whose economics, rollout cadence, and governance rights are not publicly spelled out in the sources retained here."
    claimRefs: ["CO004", "CO007", "CO008", "CO012"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-and-milestones"
    title: "Funding and milestones"
    body: "Funding and milestone evidence shows a business that kept raising strategic capital while extending its product family. Canary Media reported a $90 million Series B in March 2022 that brought disclosed funding at that point to $134 million, while Eaton announced a later $75 million investment in March 2026 alongside a commercial partnership. Product milestones also moved forward: SPAN publicly launched new panel variants in February 2025, said deliveries would begin in April 2025, and Eaton said joint solutions were expected in the second quarter of 2026. What is missing is just as important as what is present: none of the retained sources provides a current valuation mark, refreshed lifetime capital total, or current operating metrics."
    claimRefs: ["CO005", "CO006", "CO010", "CO011", "CO013", "CO014"]
    figureRefs: ["FO001"]
  - id: "adverse-readthrough-and-open-gaps"
    title: "Adverse readthrough and open gaps"
    body: "The bearish readthrough is not a scandal or legal event in the retained pool; it is execution and market-structure risk. Latitude reported that smart-panel deployment was cooling versus the 2020-2021 surge and that new smart meters were increasingly competing for the same grid-edge visibility budget, while also noting that SPAN's utility monetization model was still being worked out. That means the company can point to attractive partner narratives without yet giving outside investors enough public operating data to judge whether the channel shift is driving durable adoption, attractive unit economics, or a valuation that still fits private-market expectations."
    claimRefs: ["CO008", "CO009", "CO011", "CO014"]
