    title: Recommendation summary table
    columns: [Metric, Assessment, Decision implication]
    rows:
      - [Recommendation, Track, Wait for better price support or fuller operating disclosure before underwriting a buy call.]
      - [Confidence, Medium, "Product and channel evidence is credible, but valuation support is incomplete."]
      - [Risk rating, High, "Price friction, policy sensitivity, and utility-channel execution still drive downside."]
      - [Valuation stance, "Not publicly supportable", Public momentum signals exceed the public operating detail needed for precise valuation.]
    notes: Public-evidence view only as of 2026-10-19; current revenue, gross margin, cash runway, and term-sheet economics were not publicly verified.
    claimRefs: [CV001, CV005, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Bullish, Eaton-backed distribution and joint smart-panel offers could reduce go-to-market friction, Show disclosed unit growth or revenue acceleration through partner channels.]
      - [Bullish, Avoided service upgrades and builder savings make the product economically relevant when electrification loads rise, Validate realized savings with independent deployment or customer economics data.]
      - [Bearish, Retail price and accessory cost still create homeowner adoption friction, Show utility or builder subsidy structures that consistently neutralize upfront cost.]
      - [Bearish, "Current public evidence still omits revenue, gross margin, installed-base, and cap-table terms", Provide current metrics and downside-protection terms sufficient for entry underwriting.]
    notes: Rows synthesize cited claims rather than presenting a scored model; the counterevidence column highlights what additional proof would be needed to move from track toward buy.
    claimRefs: [CV003, CV005, CV007, CV010, CV011, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Core assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, Eaton distribution and utility programs convert SPAN's premium hardware into lower total project cost and broader deployment, Premium pricing becomes more defensible once channel conversion and margins are externally visible, Utility cycles lengthen or savings prove less repeatable than claimed, Independent evidence of scaled utility adoption and disclosed margin expansion.]
      - [Base, Strategic momentum continues but revenue and term disclosure stay thin, Track only and require downside protection instead of paying for headline momentum, Private metrics remain opaque and customer demand stays rebate-sensitive, Continued partner announcements without quantified financial disclosure.]
      - [Bear, Electrification demand slows while utility monetization takes longer than expected, Flat or down-round risk rises because public proof remains weaker than valuation narratives, "Price friction, subsidy rollback, and longer sales cycles dominate", More independent reporting on cooling deployment or delayed conversions.]
    notes: Scenario logic is qualitative because the assigned evidence pool does not disclose a current revenue base, margin structure, or financing terms needed for a precise modeled range.
    claimRefs: [CV004, CV005, CV010, CV011, CV013, CV014]
