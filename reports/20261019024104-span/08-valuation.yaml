callouts:
  - calloutType: recommendation
    title: Recommendation
    body: Track SPAN rather than buy until current operating metrics or downside-protective terms make the entry case concrete.
    claimRefs: [CV013, CV014]
  - calloutType: risk
    title: Main downside driver
    body: Public evidence shows real strategic interest, but direct-to-consumer price friction and utility-channel execution risk can still outrun disclosed operating proof.
    claimRefs: [CV010, CV011, CV014]
  - calloutType: assumption
    title: What would move the call
    body: A stronger stance would require third-party evidence of scaled channel conversion plus current revenue, gross margin, and financing-term disclosure.
    claimRefs: [CV005, CV011, CV014]
