  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue-disclosure
      missingEvidence: Current recognized revenue, gross margin, and segment mix across panels, accessories, utility programs, and software or services.
      whyItMatters: Without current operating metrics, outside investors cannot translate partnership momentum into a defensible valuation range or target return.
      diligencePath: Obtain current management KPI reporting or audited financial statements that break out revenue mix and gross margin.
      relatedQuestionRefs: [QV007, QV008]
    - type: private-evidence-only
      severity: material
      topic: cap-table-terms
      missingEvidence: Current post-round valuation, liquidation preferences, anti-dilution terms, and any senior claims from strategic or prior investors.
      whyItMatters: Headline funding amounts do not reveal downside protection or common-equity economics for a new investor.
      diligencePath: Review the current cap table, financing documents, and any side-letter economics with counsel and the company.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: channel-conversion
      missingEvidence: Independent evidence of installed-base growth, utility-program conversion, and partner-driven unit or revenue contribution.
      whyItMatters: The bull case depends on channel leverage, but public evidence today proves partnership intent more clearly than commercial conversion.
      diligencePath: Request cohort data by channel plus named utility or builder deployment case studies with realized economics.
      relatedQuestionRefs: [QV002, QV005]
    - type: missing-source
      severity: material
      topic: cash-runway
      missingEvidence: Current cash balance, burn rate, working-capital needs, and warranty or service-cost trends after the latest expansion steps.
      whyItMatters: Financing momentum is helpful, but runway and service-cost absorption determine whether valuation downside is manageable.
      diligencePath: Review current budget-to-actuals, cash forecast, and service-cost data with finance leadership.
      relatedQuestionRefs: [QV003, QV008]
