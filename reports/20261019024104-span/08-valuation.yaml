company:
  name: SPAN
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports a track recommendation for SPAN rather than a buy call. The refreshed record
    shows real product and channel momentum, including Eaton's strategic investment and partner distribution, but
    current revenue, margin, cash-runway, valuation, and round-term disclosure remain too thin to defend a precise
    valuation range or target return.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The chapter's bottom line is track, with medium confidence, high risk, and no publicly supportable valuation stance.
      The positive case is not imaginary: SPAN still sells a differentiated smart panel, advertises circuit-level
      control and backup flexibility, and now has a scaled partner path through Eaton. Public evidence also shows that
      Eaton put new capital behind the company in 2026, which is a stronger signal than a marketing-only partnership.
      But the evidence remains price-sensitive rather than price-clearing. The public record does not disclose current
      recognized revenue, gross margin, installed base, retention, or liquidation-preference terms, so an outside
      investor cannot convert channel momentum into a defensible entry multiple. That pushes the disciplined call
      toward tracking the company until either valuation terms improve or current operating proof improves.
    claimRefs: [CV001, CV002, CV003, CV005, CV009, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-versus-counterevidence
    title: Thesis versus counterevidence
    body: >-
      The thesis is that SPAN's software-defined load control addresses a real electrification pain point: homes,
      builders, and utilities need ways to add EV charging, batteries, and heat pumps without repeated service
      upgrades. The Eaton alliance matters because it broadens access to builders, distributors, and installers that a
      stand-alone hardware startup would struggle to reach on its own. The anti-thesis is that public evidence still
      shows adoption friction. Independent reporting describes the direct-to-consumer offer as expensive, the addressable
      residential market as pressured by slower rooftop-solar and EV demand, and the utility expansion as promising but
      still commercially unsettled. The investment question is therefore not whether SPAN has a credible product; it is
      whether the utility and partner channels can translate that product edge into repeatable, disclosed economics
      before capital-market conditions or subsidy changes tighten again.
    claimRefs: [CV002, CV004, CV006, CV007, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-framing
    title: Bull, base, and bear framing
    body: >-
      The bull case requires proof that Eaton-enabled distribution and utility programs turn SPAN's hardware premium
      into lower total project cost for builders and homeowners. The base case is more modest: SPAN keeps winning
      strategic partners and raising capital, but outside investors still cannot see enough current operating detail to
      underwrite a premium entry price. The bear case combines slower electrification demand, policy rollback, and
      longer utility sales cycles, which would make today's public momentum a poor proxy for realized value. Because
      the public record does not provide a recent revenue or margin base, the scenario work here is deliberately
      qualitative; the right discipline is to map what would move the call, not to manufacture false precision.
    claimRefs: [CV004, CV005, CV008, CV010, CV011, CV013, CV014]
    tableRefs: [TV003]
  - id: diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      The remaining valuation work is straightforward but not optional. Management needs to show current recognized
      revenue, gross margin by product line, installed-base growth, utility-program conversion, and the cap-table terms
      that determine whether new investors are protected from a flat or down round. A positive update would be third-party
      evidence that utility partners are subsidizing deployment at scale or that Eaton distribution is converting into
      measurable unit growth with acceptable warranty and service-cost outcomes. Thesis-breakers are equally clear:
      evidence of slowing electrification demand without offsetting utility traction, partner distribution that does not
      convert into disclosed commercial scale, or financing terms that leave common-equity economics materially worse
      than the headline valuation implies. Until those questions close, SPAN remains investable to monitor, not yet to
      chase.
    claimRefs: [CV005, CV010, CV011, CV012, CV014]
