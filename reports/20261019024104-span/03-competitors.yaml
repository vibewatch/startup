        - "Yes"
        - "No"
        - "No"
        - "No"
      - - Remote circuit control
        - Every circuit
        - Every circuit
        - Selected circuits only
        - None
        - Not evidenced
      - - Typical circuit coverage in assigned evidence
        - 16-48 controllable circuits
        - Up to 48 circuits
        - Up to 12 circuits
        - 0 controllable circuits
        - Not evidenced
      - - Backup / load management
        - Whole-home prioritization and upgrade avoidance
        - Backup flexibility and upgrade avoidance
        - Priority-based shedding on connected circuits
        - Monitoring only
        - Visibility-oriented, control depth not evidenced
      - - Channel / procurement advantage
        - SPAN installer base
        - Eaton distributor, installer, and homebuilder reach
        - Lower-intrusion retrofit pitch
        - Lowest upfront spend
        - Utility program route
    notes: >-
      "Not evidenced" marks cells the assigned pool does not support directly; matrix rows compare public
      capability descriptions rather than measured field performance.
    claimRefs: [CP002, CP003, CP005, CP006, CP008, CP013, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Product / approach
      - Public price signal
      - Unit / contract model
      - Included capabilities
      - Unknowns
      - Implication
    rows:
      - - SPAN official panel pricing
        - "$2,550 starting price + installation, taxes, shipping"
        - Hardware list-price starting point
        - Smart panel hardware; installer selects panel size
        - Realized installer margin, labor, and attachment economics
        - Official list price understates total installed spend versus substitutes
      - - SPAN installed-cost range in OhmSnap
        - "$5,000-$8,500 installed"
        - Turnkey installed project
        - Full panel swap with circuit-level control and battery-management workflows
        - Geography, wiring complexity, and discounting
        - SPAN must justify a premium over add-on and monitor-only options
      - - Full smart-panel category in ElectrifyCost
        - "SPAN Drive $5,800-$9,000; Schneider $5,200-$8,500"
        - Installed project ranges
        - Whole-panel smart replacement
        - Quote-to-quote comparability and included labor scope
        - Direct peers cluster in premium replacement pricing
      - - Lumin add-on range
        - "$2,800-$4,800 to $3,000-$5,500 installed"
        - Installed project range
        - Smart control for selected circuits without replacing the incumbent panel
        - Module count, installer scope, and battery-specific options
        - Lumin can undercut SPAN when full-panel control is not required
      - - Monitoring-only substitute
        - "$200-$400 to $800-$2,400"
        - Device plus optional install / sensors
        - Energy visibility without automation
        - Device mix, number of sensors, and electrician involvement
        - The cheapest substitute pressures SPAN's ROI story for buyers who only need visibility
    notes: >-
      Public price signals come from official list pricing and independent comparison guides; they are not
      realized ASPs or contract terms and should be read as packaging anchors rather than revenue proxies.
    claimRefs: [CP001, CP008, CP009, CP016]
figures:
