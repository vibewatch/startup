  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-and-discounting
      missingEvidence: Actual installer ASPs, discounting, attachment rates for batteries or load-management software, and contract terms versus the public list or guide ranges.
      whyItMatters: Public list and guide pricing show packaging tiers, but they do not prove whether SPAN can sustain premium economics against add-on or monitoring substitutes.
      diligencePath: Request recent installer quotes, realized gross-to-net data, and channel discount schedules segmented by retrofit, builder, and utility-led deals.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: switching-cost-realization
      missingEvidence: Customer retention, multi-homing behavior, installer switching rates, and evidence on how often upgrade avoidance actually changes purchase outcomes versus cheaper substitutes.
      whyItMatters: Without observed switching or retention data, durability claims remain qualitative and could overstate lock-in from software, installers, or utility channels.
      diligencePath: Request cohort retention, installer win-loss analyses, and case studies comparing panel-replacement decisions against Lumin, monitor-only, or utility-program alternatives.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP001, TP002]
