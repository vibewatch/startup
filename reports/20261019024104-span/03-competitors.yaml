    title: "Positioning map: installation intrusion vs control depth"
    type: quadrant
    summary: >-
      Ordinal scores from the assigned evidence place SPAN and Eaton+SPAN at the high-control, high-
      intrusion end of the market, while cheaper substitutes cluster lower on both axes.
    data:
      xAxis:
        label: Installation intrusion
        min: 1
        max: 5
        low: Incremental overlay
        high: Full panel replacement
        description: Ordinal score from cited installation form factors and replacement requirements
        scale: ordinal
      yAxis:
        label: Control depth
        min: 1
        max: 5
        low: Visibility only
        high: Whole-home circuit automation
        description: Ordinal score from cited monitoring, switching, and backup-management capabilities
        scale: ordinal
      points:
        - label: Load-shed device
          x: 1
          y: 1
          summary: Single-load management without app-first whole-home control
          claimRefs: [CP007]
        - label: Traditional panel + monitor
          x: 1.5
          y: 1.5
          summary: Visibility substitute with no remote circuit control
          claimRefs: [CP007, CP016]
        - label: Utility smart-meter path
          x: 1
          y: 2
          summary: Competes on grid-edge visibility, not evidenced as a whole-home control stack
          claimRefs: [CP011, CP012]
        - label: Lumin
          x: 3
          y: 3.5
          summary: Mid-intrusion overlay with narrower circuit coverage than a full smart panel
          claimRefs: [CP008, CP009]
        - label: Schneider Square D Energy Center
          x: 5
          y: 4
          summary: Full smart-panel peer with incumbent-support positioning
          claimRefs: [CP009]
        - label: Eaton + SPAN smart panel
          x: 5
          y: 4.8
          summary: Full replacement offer with SPAN software and incumbent distribution
          claimRefs: [CP006, CP013]
        - label: SPAN Panel
          x: 5
          y: 5
          summary: Highest control depth in the assigned pool, but at premium installation scope
          claimRefs: [CP002, CP003, CP009]
    approximationNotes: >-
      Axes are ordinal 1-5 scores derived from cited installation form factors and documented control
      breadth; they are not measured market-share, performance, or customer-satisfaction values.
    claimRefs: [CP006, CP007, CP008, CP009, CP011, CP012, CP013, CP016]
callouts:
  - calloutType: strength
    title: Eaton is the clearest distribution amplifier
    body: >-
      Eaton's investment and channel access are the strongest non-product edge in the assigned pool because
      they can place SPAN software inside incumbent distribution, installer, and homebuilder routes.
    claimRefs: [CP006, CP013]
  - calloutType: risk
    title: Substitute pressure is mostly economic, not purely technical
    body: >-
      Lower-cost overlays, monitor-only retrofits, and smart-meter visibility products can satisfy enough of
      the buyer job to constrain SPAN's pricing power even if SPAN retains deeper automation.
    claimRefs: [CP009, CP012, CP015, CP016]
