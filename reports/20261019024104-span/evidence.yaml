evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current valuation mark, preferred-share price, and the date of the last priced primary round.
    whyItMatters: The investment case cannot be tied to a current entry price or private-market expectation without it.
    diligencePath: Request the latest cap table, board materials, or fresh financing coverage tied to a dated round.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue or run rate, installed-base/customer counts, and headcount.
    whyItMatters: These are core scale metrics needed to judge execution against the partner and electrification narrative.
    diligencePath: Request management KPI packs, lender or investor updates, and cohort or partner deployment dashboards.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Named board roster, broader executive team, and committee or control-right structure.
    whyItMatters: Leadership concentration and investor governance cannot be assessed from CEO-only public visibility.
    diligencePath: Request an org chart, board deck, and governance summary that identifies directors and committee oversight.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Full cap table, liquidation preferences, anti-dilution terms, and economics of the Eaton investment.
    whyItMatters: Headline funding alone does not show common-equity outcomes or downside protection dynamics.
    diligencePath: Review financing documents and investor rights agreements, including any strategic-commercial side letters.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: independent-market-size
    missingEvidence: >-
      An independent 2026 TAM, SAM, or SOM estimate specifically for smart electrical panels or residential
      load-management panels.
    whyItMatters: >-
      The biggest quantified numbers in the assigned pool are company-authored cost-avoidance scenarios rather than an
      independently sized revenue market.
    diligencePath: >-
      Add an analyst, utility, or public-company market study that isolates smart-panel or panel-level residential
      load-management spend.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-conversion
    missingEvidence: >-
      Signed utility-program counts, builder deployment volumes, and current revenue mix across homeowner, builder, and
      utility channels.
    whyItMatters: Valuation depends on whether the utility and builder motions are scaling beyond pilots and marketing partnerships.
    diligencePath: Request channel-level bookings, installed-base, and program-conversion data from management or investors.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: public-pricing
    missingEvidence: A reconciled installed-price schedule by panel type, accessories, and labor scope.
    whyItMatters: >-
      Public pricing signals range from a $2,550 starting price to third-party reported $3,500 panel pricing plus
      accessories, which affects payback and buyer qualification.
    diligencePath: >-
      Request current MSRP, accessory pricing, installer labor assumptions, and representative fully installed quotes by
      retrofit versus new-build use case.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounting
    missingEvidence: >-
      Actual installer ASPs, discounting, attachment rates for batteries or load-management software, and contract terms
      versus the public list or guide ranges.
    whyItMatters: >-
      Public list and guide pricing show packaging tiers, but they do not prove whether SPAN can sustain premium
      economics against add-on or monitoring substitutes.
    diligencePath: >-
      Request recent installer quotes, realized gross-to-net data, and channel discount schedules segmented by retrofit,
      builder, and utility-led deals.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-realization
    missingEvidence: >-
      Customer retention, multi-homing behavior, installer switching rates, and evidence on how often upgrade avoidance
      actually changes purchase outcomes versus cheaper substitutes.
    whyItMatters: >-
      Without observed switching or retention data, durability claims remain qualitative and could overstate lock-in
      from software, installers, or utility channels.
    diligencePath: >-
      Request cohort retention, installer win-loss analyses, and case studies comparing panel-replacement decisions
      against Lumin, monitor-only, or utility-program alternatives.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current recognized revenue, product and channel mix, realized ASP, gross margin, CAC, sales cycle, payback,
      warranty expense, and service-delivery cost.
    whyItMatters: >-
      These inputs determine whether channel expansion and embedded software improve revenue quality or merely add
      delivery cost.
    diligencePath: >-
      Request monthly management accounts and cohort-level unit economics by product, geography, and direct, installer,
      utility, Eaton, and XFRA channel.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, monthly burn, working-capital needs, debt and project-finance obligations, covenant headroom,
      planned use of the Eaton proceeds, and next-round trigger.
    whyItMatters: >-
      A $75 million investment cannot be translated into cash available or runway without closing, obligation, and burn
      data.
    diligencePath: >-
      Request the latest cash bridge, debt schedule, covenant package, board-approved operating plan, and financing
      milestones.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: software-and-program-revenue
    missingEvidence: >-
      Contracts, invoices, paid attach rates, subscriber counts, take rates, utility pricing units, XFRA pricing, and
      revenue-recognition policies for non-hardware offerings.
