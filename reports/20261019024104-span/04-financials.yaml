    claimRefs: [CI001, CI003, CI004, CI005, CI011, CI013, CI014, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offer or metric
      - Published value
      - Basis
      - What remains unknown
    rows:
      - ["SPAN Panel", "$2,550 starting price plus installation, taxes, and shipping", "Current SPAN product page", "Realized ASP, installer markup, discounts, financing, and product mix"]
      - ["Installed panel cost", "$4,000-$6,000 installed", "Netfigo third-party estimate", "Current representativeness, geographic range, and source methodology"]
      - ["Eaton smart panel software", "PowerUp and free over-the-air updates included", "Eaton partner page", "Hardware transfer price, revenue share, paid premium tiers, and service economics"]
      - ["Utility electrification model", "$19,000 per household without SPAN versus $8,500-$10,500 with SPAN and PowerUp", "SPAN company model using utility investment estimates and build-cost averages", "Independent validation, invoiced price, value-sharing mechanism, and SPAN margin"]
    notes: "Values retain their original denominators and source conventions; the utility comparison is an avoided-cost model, not SPAN revenue."
    claimRefs: [CI001, CI002, CI004, CI011, CI012]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value
      - Confidence
      - Underwriting implication
      - Diligence ask
    rows:
      - ["Realized panel ASP", null, "Unavailable", "List price cannot establish revenue per deployment", "Provide billed ASP by SKU, geography, and channel."]
      - ["Gross margin and service cost", null, "Unavailable", "Hardware, installer support, warranty, and software economics cannot be separated", "Provide gross margin bridge and warranty/service cost per installed panel."]
      - ["CAC, sales cycle, and payback", null, "Unavailable", "Eaton reach is a proxy, not evidence of sales efficiency", "Provide channel cohorts with lead source, conversion, CAC, cycle, and payback."]
      - ["Fresh strategic financing", "$75 million Eaton investment announced in March 2026", "Medium", "Capital and channel support improved, but funding raised is not current cash", "Provide closing terms, proceeds received, use of funds, and milestones."]
      - ["Cash, burn, debt, and runway", null, "Unavailable", "Capital adequacy and next-round timing cannot be calculated", "Provide cash bridge, monthly burn, debt schedule, covenants, and financing trigger."]
    notes: "Null means the assigned public sources do not disclose the metric; no missing value has been converted into an estimate."
    claimRefs: [CI008, CI009, CI010, CI016]
