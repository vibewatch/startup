schemaVersion: "report-v2"
artifact: financials
slug: span
runDate: "2026-10-19"
company:
  name: SPAN
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a hardware-led model with embedded software, installer
    distribution, utility programs, and an early distributed-compute option, but it does
    not disclose recognized revenue, gross margin, or cash burn. Eaton's $75 million
    investment improves capital and channel access without establishing runway or revenue
    quality.
sections:
  - id: revenue-model
    title: Revenue model and pricing surface
    body: >-
      The clearest current monetization anchor is the SPAN Panel, which SPAN lists from
      $2,550 before installation, taxes, and shipping. Netfigo separately reports a
      $4,000-$6,000 installed cost, but that low-reputation estimate is not an official
      realized-price disclosure. Public materials present SPAN Energy Intelligence,
      PowerUp, app control, and free software updates as capabilities bundled into panel
      deployments. Netfigo asserts that premium software produces recurring revenue, yet
      the retained official and partner sources provide no price, attach rate, subscriber
      count, or accounting treatment that verifies a standalone recurring-software stream.
      Referral economics with installers are likewise asserted only by Netfigo. Utility
      programs and XFRA broaden the opportunity set, but their contract prices and revenue
      recognition remain private.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI013, CI014, CI015, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: distribution-and-delivery
    title: Distribution, delivery costs, and sales efficiency
    body: >-
      SPAN's core route to market remains installer-mediated: an authorized installer
      selects the appropriate panel, and an authorized installer is required to service
      the internal assembly. That model can improve installation quality but leaves SPAN
      exposed to installer availability, markup, training, and service expense that are
      not quantified publicly. Netfigo explicitly describes the installed cost as
      significant and says the licensed-electrician requirement limits the sales channel,
      making it the chapter's adverse evidence. Eaton offers a potentially important
      counterweight. Independent reporting says Eaton plans to distribute a
      SPAN-integrated smart panel through its established installer and homebuilder
      networks. This may reduce channel acquisition friction, but no source discloses
      channel margin, lead conversion, sales cycle, CAC, or payback.
    claimRefs: [CI002, CI005, CI006, CI007, CI008, CI010]
    tableRefs: [TI003]
  - id: value-proxies-and-expansion
    title: Customer value proxies and emerging expansion
    body: >-
      SPAN supplies customer-value evidence rather than company-margin evidence. Its
      utilities page models per-household electrification cost at $19,000 without SPAN
      versus $8,500-$10,500 with SPAN and PowerUp, including a stated $1,500-$3,500 SPAN
      Edge cost. Those are company-authored avoided-infrastructure estimates, not invoice
      prices, recognized revenue, or gross profit. The same page says SPAN can provide
      more than thirty times the usage data of a traditional smart meter, which could
      support utility pricing and load-management offerings but is not independently
      benchmarked here. XFRA adds a second expansion path: SPAN announced deployments
      beginning later in 2026 and a pipeline intended to reach gigawatt scale in 2027.
      Its homeowner package implies hardware and subsidy obligations, while pricing,
      utilization, funding responsibility, and contribution margin remain undisclosed.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
  - id: capital-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Eaton's $75 million strategic investment is the strongest fresh capital signal in
      the assigned evidence and is more useful than a financing headline alone because
      it accompanies product integration and channel access. It is still funding raised,
      not cash currently available: none of the retained sources gives closing terms,
      use-of-funds detail, cash on hand, burn, debt, project-finance obligations, covenant
      headroom, or a next-round trigger. The public record therefore cannot support a
      runway calculation. The underwriting conclusion is correspondingly bounded. SPAN
      has visible product pricing, multiple routes to market, and plausible customer-cost
      savings, but revenue mix, realized ASP, warranty and service cost, gross margin,
      CAC/payback, and working-capital requirements remain private. The financial profile
      is strategically promising but not underwritable to high conviction without
      management accounts and channel-level cohorts.
    claimRefs: [CI001, CI002, CI008, CI009, CI010, CI011, CI012, CI014, CI015, CI016]
