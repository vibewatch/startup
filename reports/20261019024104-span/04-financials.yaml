      - ["Embedded software", "Energy Intelligence, PowerUp, app controls, and updates bundled with smart panels", "Eaton says PowerUp and over-the-air updates are included", "Bundling is verified; separate software revenue is not", "Provide recurring software revenue, paid attach rate, churn, and revenue-recognition policy."]
      - ["Installer referrals", "Netfigo says solar installers and electricians generate referral revenue", "No rate, denominator, or contract example disclosed", "Single low-reputation third-party assertion", "Provide referral agreements, take rates, and revenue by installer cohort."]
      - ["Utility programs", "SPAN Edge, PowerUp, data, and load management offered to utilities", "SPAN publishes avoided-cost models rather than contract pricing", "Company-authored value case; revenue economics unavailable", "Provide utility contract units, pricing, deployment count, and gross margin."]
      - ["XFRA", "Distributed compute sites paired with a homeowner benefits package", "Initial deployments planned for later 2026; gigawatt-scale pipeline claimed for 2027", "Early company announcement with no recognized revenue", "Provide signed capacity, utilization, capex owner, subsidy cost, pricing, and contribution margin."]
