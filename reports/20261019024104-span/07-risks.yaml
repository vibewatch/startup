chapter:
  number: 7
  title: "Risks"
  summary: "SPAN's highest evidence-backed risks cluster around installer execution, software-and-connectivity dependence, utility/code acceptance, and partner-led go-to-market concentration. Eaton's 2026 investment and distribution commitment are meaningful mitigants, but public evidence still leaves material diligence gaps around field reliability, legal and incident history, current unit economics, and private-market pricing."
sections:
  - id: "ranked-risk-picture"
    title: "Severity-ranked risk picture"
    body: |
      The reviewed evidence points to a risk stack led by execution and deployment quality. Independent reviews describe high installed cost, meaningful configuration complexity, and tangible downside when non-certified electricians handle commissioning, while SPAN's own materials confirm that the product is a software-defined panel whose value depends on app control, load-management logic, and authorized service support. That combination makes the core underwriting question less about whether the product is differentiated and more about whether SPAN can scale deployments, support, and partner coordination without letting field quality or customer economics deteriorate.

      The risk pattern is also asymmetric. SPAN has mitigating evidence in the form of historical fundraising, Eaton's 2026 investment and distribution commitment, and official claims that PowerUp can avoid service upgrades or extend battery runtime. Those mitigants do not eliminate downside if permit acceptance, installer performance, Wi-Fi reliability, utility adoption, or channel execution fail in practice. Several investment-relevant mitigations still depend on third-party execution and company-controlled disclosures rather than independently audited operating data, while a 2025 industry report described cooling smart-panel deployment and competition from advanced meters.
    claimRefs: ["CR001", "CR002", "CR005", "CR006", "CR008", "CR010", "CR011", "CR012", "CR013", "CR016"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-legal"
    title: "Regulatory, legal, and policy dependence"
    body: |
      The cleanest regulatory signal in the assigned pool is not a permit or regulator approval; it is SPAN's own explanation that PowerUp is code-compliant under NEC logic while final approval remains subject to local regulations. That matters because the product's value proposition explicitly includes avoiding some service upgrades and enabling flexible electrification, so permit interpretation, local inspector comfort, and utility-program acceptance can shape actual attach rates and realized customer savings. The utilities page goes further by describing utility-set dynamic service ratings and peak-event management, which means part of SPAN's utility thesis depends on external program design rather than the panel alone.

      The public evidence reviewed does not include direct regulator, court, privacy, or recall records that could establish SPAN's legal and incident history. That evidence gap must not be interpreted as proof that no issue exists. The practical implication is that a buyer can rank legal or policy risk as unconfirmed rather than cleared: SPAN has a plausible code-compliance story, but investors still need direct evidence on litigation, enforcement, safety events, cybersecurity incidents, and jurisdiction-specific approval friction before taking residual legal exposure down materially.
    claimRefs: ["CR001", "CR003", "CR005", "CR009"]
    tableRefs: ["TR001"]
  - id: "operational-and-quality"
    title: "Operational, quality, and software-control risks"
    body: |
      Operationally, the evidence points to a business that is more exposed to installation quality and software commissioning than a commodity panel vendor would be. SPAN's support materials say an authorized installer is required for internal service, and both independent review sources emphasize that installer quality is the biggest variable in customer satisfaction. One review specifically states that non-certified electricians leave mislabeled circuits, incomplete app commissioning, or broken solar-and-battery integrations, which turns deployment mistakes into product-experience and support-cost risk rather than simple contractor noise.

      The product also depends on software and network reliability. SPAN and its partner materials sell circuit-level remote control, app-driven insights, and configurable backup priorities as core value; the same review set notes that weak Wi-Fi near the panel is a common failure point. That does not mean SPAN is unusually fragile, but it does mean the product promise rests on a combined hardware-software-service stack. If field connectivity, firmware quality, or installer setup lags, customer outcomes and referenceability can degrade quickly even when the underlying panel hardware is functioning.
    claimRefs: ["CR004", "CR005", "CR006", "CR007", "CR012", "CR015"]
    tableRefs: ["TR002"]
  - id: "partner-capital-and-monitoring"
    title: "Partner dependence, capital exposure, and monitoring triggers"
    body: |
      SPAN's partner and capital profile reduces some near-term downside while creating its own dependency risk. Eaton publicly markets the joint solution as part of its home-electrification strategy, and Eaton announced a $75 million investment in 2026 alongside plans to distribute SPAN technology through its installer and homebuilder networks. That is a meaningful capital, distribution, and credibility benefit, but it also means SPAN's market access increasingly rides on a large partner's roadmap and sustained commitment. The utilities page similarly positions SPAN inside demand-management and infrastructure-avoidance programs whose rules sit outside SPAN's direct control.

      Capital risk looks mitigated but not eliminated. SPAN's 2023 financing announcement reported $231 million in total funding, while the 2026 Eaton investment adds a fresher capital marker. Neither disclosure provides current revenue, gross margin, cash balance, runway, round terms, or reliable secondary-market pricing. Current valuation and liquidity therefore remain under-evidenced. The cleanest thesis-break triggers are measurable: repeated permit rejection, persistent installer-quality issues, slower utility or partner uptake, failure to ship the announced Eaton-integrated products, or a financing event that reveals weaker economics than the historical growth story implies.
    claimRefs: ["CR001", "CR008", "CR010", "CR011", "CR013", "CR014", "CR016"]
    tableRefs: ["TR003"]
callouts:
  - calloutType: "risk"
    title: "Highest-priority kill criteria"
    body: "Escalate to a no-go view if diligence cannot verify consistent permit acceptance for PowerUp-style deployments, field-quality outcomes from certified installers, and a current financing or secondary-market marker that supports the historical growth narrative rather than relying on stale fundraising evidence."
    claimRefs: ["CR003", "CR006", "CR010", "CR011"]
