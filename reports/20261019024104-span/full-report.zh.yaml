  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图景
        blocks:
          - type: paragraph
            body: >
              审阅后的证据表明，风险组合由执行和部署质量主导。独立评测称安装成本高、配置复杂；如果由未认证电工负责调试，下行后果也很具体。SPAN 自身材料则确认，该产品是软件定义配电箱，价值取决于 App
              控制、负载管理逻辑和授权服务支持。因此，核心投资判断不再只是产品是否有差异化，而是 SPAN 能否在扩张部署、支持和伙伴协同的同时，不让现场质量或客户经济性恶化。

              这一风险模式也是不对称的。SPAN 有历史融资、Eaton 在 2026 年的投资和分销承诺，以及 PowerUp 可以避免升级供电容量或
              延长电池续航的官方主张，这些都是缓释证据。但如果许可审批、安装商表现、Wi-Fi 可靠性、公用事业采用或渠道执行在实践中失败，
              这些缓释因素并不能消除下行风险。若干与投资相关的缓释因素仍依赖第三方执行和公司控制的披露，而非独立审计的运营数据；同时，一份 2025 年行业报告描述了智能配电箱部署降温，以及来自先进电表的竞争。
