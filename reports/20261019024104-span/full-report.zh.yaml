  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代品
        blocks:
          - type: paragraph
            body: >-
              现有证据指向四类争夺同一家庭电气化工作流的公开产品：完整智能配电箱替换品、外挂式智能负载中心、 仅监控型改造产品，以及单负载卸载设备。这一点很重要，因为 SPAN 不只是与另一家高端配电箱供应商竞争；
              它还要面对更便宜的方案，这些方案同样可以避免升级供电容量、管理备用负载，或只是让用户看见家庭用电。 直接同类产品包括 Lumin 和 Schneider 的 Square D Energy
              Center；实际替代品包括传统配电箱加 Emporia 或 Sense 等监控器，以及更窄的负载管理设备。Latitude Media 还展示了面向公用事业的智能电表这一相邻进入者类别：
              即便它们无法复制全屋电路控制，也会在电网边缘可视化上展开竞争。
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
