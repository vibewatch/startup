      - number: '3.3'
        title: 渠道、锁定效应与持久性
        blocks:
          - type: paragraph
            body: >-
              Eaton 关系是本章资料池中最清晰的分销优势。Solar Power World 报道称，Eaton 投资 7500 万美元，并计划通过 Eaton 的分销商、安装商和住宅建筑商网络，销售搭载 SPAN
              Energy Intelligence 的 Eaton 品牌智能配电箱； 这可以缩小初创公司相对于老牌电气品牌的典型劣势。同时，同一批官方材料显示，Eaton 和 SPAN 品牌的配电箱 共享 SPAN
              Energy Intelligence 层和 App 体验。这支持渠道规模化，但也意味着产品差异化可能仍集中在软件和 安装商执行上，而不是一个完全独立的 Eaton 技术栈。锁定效应因此是混合的：SPAN
              支持材料称其配电箱兼容行业 标准断路器，适用于改造和新建项目；但客户采用产品后，软件层、备用电源管理流程和安装商生态仍会形成较软的切换成本。
            claimRefs:
              - CP004
              - CP006
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
