      - number: '3.4'
        title: 反向证据与待解问题
        blocks:
          - type: paragraph
            body: >-
              公开市场的下行情景并不是 SPAN 缺少品类替代品，而是若干低成本、渐进式替代品已经足以完成买方任务，从而 封顶其定价能力。ElectrifyCost
              明确警告，依赖云端的智能配电箱存在供应商支持风险：如果初创公司被收购或停业， 这类风险就会暴露；Latitude Media 则同时报道了智能电表竞争和电网边缘智能配电箱部署降温。即便 SPAN 保有更好的
              App 或控制模式，这些信号仍意味着老牌企业反击和替代品侵入都可能发生。现有证据还留下重要尽调缺口，尤其是实际
              ASP、安装商折扣、多产品同时使用的客户比例，以及避免升级或公用事业项目究竟多频繁地抵消相对于外挂式或仅监控型方案的溢价。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: Eaton 是最清晰的分销放大器
            body: Eaton 的投资和渠道准入是资料池中最强的非产品优势，因为它们可以把 SPAN 软件放进老牌企业的分销、安装商和住宅 建筑商渠道。
            calloutType: strength
            claimRefs:
              - CP006
              - CP013
          - type: callout
            title: 替代品压力主要来自经济性，而非纯技术因素
            body: 即使 SPAN 保留更深的自动化能力，低成本叠加式产品、仅监控型改造方案和智能电表可视化产品也能完成足够多的买方任务， 从而约束 SPAN 的定价能力。
            calloutType: risk
