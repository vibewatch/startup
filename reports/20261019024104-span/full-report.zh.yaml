  - id: FE001
    title: 产品架构图
    type: stack
    summary: SPAN 将配电盘硬件、嵌入式能源管理、云端 / 应用服务以及安装商 / 渠道交付整合成一个电气化平台。
    data:
      layers:
        - label: 电气硬件
          detail: 智能配电盘硬件替代传统负载中心，并提供可控回路和计量功能。
          modules:
            - label: 配电盘型号
              value: 16-48 circuits
              note: MAIN and MLO formats across retrofit and new-build use cases
            - label: 连接能力
              value: Ethernet / Wi-Fi / cellular
              note: Public datasheet lists all three
          outputs:
            - label: Circuit telemetry
              note: Real-time monitoring and breaker status
            - label: Backup-ready circuits
              note: Inputs for backup prioritization when storage is present
        - label: 嵌入式能源管理
          detail: SPAN Energy Intelligence 和 PowerUp 在硬件之上提供负载管理和备电逻辑。
          modules:
            - label: SPAN Energy Intelligence
            - label: PowerUp EMS
          outputs:
            - label: Load management
              note: Supports upgrade avoidance in retrofit scenarios
            - label: Backup orchestration
              note: Coordinates priorities when battery storage is present
        - label: 云端和固件服务
          detail: 云端同步、OTA 固件更新和事件提醒，让产品能力超出机载硬件本身。
          modules:
            - label: 云端同步
            - label: OTA 固件
            - label: 提醒
          outputs:
            - label: Remote visibility
            - label: Ongoing software updates
        - label: 客户控制界面
          detail: SPAN Home App 是屋主的主要界面，也覆盖 Eaton 品牌智能配电盘。
          modules:
            - label: 回路控制
            - label: 能源仪表盘
            - label: 备电设置
          outputs:
            - label: One app experience
              note: Shared across SPAN and Eaton smart panels
            - label: Whole-home insights
        - label: 渠道和生态
          detail: 授权安装商、Eaton、太阳能 / 电池组合以及 SPAN Drive 扩大了交付范围和应用场景。
          modules:
            - label: 授权安装商
            - label: Eaton 渠道
            - label: SPAN Drive
          outputs:
            - label: Retrofit and new-build deployment
            - label: Broader electrification workflow
        - label: 合规和服务治理
          detail: 产品信任建立在电气规范声明、已发布认证、断路器兼容性指引以及授权安装商服务路径之上。
          modules:
            - label: UL 认证
            - label: NEC / PowerUp 声明
            - label: 授权服务路径
          outputs:
            - label: Published safety anchors
            - label: Controlled internal servicing
    approximationNotes: null
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: SPAN 的客户路径从电气化痛点开始，经由规格选型渠道推进，并通过合作伙伴和公用事业触点扩展。
    data:
      items:
        - label: 电气化触发点
          actor: 屋主
          phase: 需求发现
          touchpoints:
            - 电动车、电池、太阳能或热泵升级令现有配电盘捉襟见肘
            - 买家寻求更强控制、更灵活的备电能力和能源可视化
        - label: 安装商主导的适配检查
          actor: 授权安装商
          phase: 规格选型
          touchpoints:
            - 安装商帮助判断哪种配电盘适合房屋的电气需求
            - 购买前决定采用改造方案还是新建方案
        - label: 购买路径选择
          actor: 屋主或建造商
          phase: 渠道选择
          touchpoints:
            - 屋主直接发起的项目
            - 面向全电气化就绪住宅的建造商项目
            - Eaton 支持的建造商或承包商路径
        - label: 应用激活
          actor: 终端用户
          phase: 日常运行
          touchpoints:
            - 通过 SPAN Home App 进行回路级控制
            - 持续获取能源洞察并进行备电优先级设置
        - label: 扩展循环
          actor: 家庭
          phase: 相邻升级
          touchpoints:
            - 增加电池、电动车充电器、太阳能和热泵，进一步放大产品价值
            - 更大的配电盘配置适配更多复杂住宅
        - label: 公用事业或合作伙伴规模化路径
          actor: 公用事业、建造商或 Eaton 渠道
          phase: 组合扩展
          touchpoints:
            - 返利和公用事业成本规避逻辑降低购买阻力
            - 同一套 SPAN 软件栈可以通过 Eaton 品牌配电盘拓展
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU010
      - CU013
