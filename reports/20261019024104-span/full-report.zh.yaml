  - id: FP001
    title: 定位图：安装侵入性与控制深度
    type: quadrant
    summary: 指定证据得出的序数评分，将 SPAN 和 Eaton+SPAN 放在市场中高控制、高安装侵入性的一端，而更便宜的替代方案在两个轴上都聚集于较低位置。
    data:
      xAxis:
        label: 安装侵入性
        min: 1
        max: 5
        low: 增量式叠加
        high: 完整配电盘替换
        description: Ordinal score from cited installation form factors and replacement requirements
        scale: ordinal
      yAxis:
        label: 控制深度
        min: 1
        max: 5
        low: 仅可视化
        high: 全屋回路自动化
        description: Ordinal score from cited monitoring, switching, and backup-management capabilities
        scale: ordinal
      points:
        - label: 负载削减设备
          x: 1
          'y': 1
          summary: Single-load management without app-first whole-home control
          claimRefs:
            - CP007
        - label: 传统配电盘 + 监测器
          x: 1.5
          'y': 1.5
          summary: Visibility substitute with no remote circuit control
          claimRefs:
