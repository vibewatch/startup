  - id: FM001
    title: 从系统级资本开支到项目经济性的市场规模视角
    type: pyramid
    summary: 公开证据支持一组层层递进的成本规避视角，而不是单一的独立 TAM。
    data:
      nodes:
        - label: 公用事业电气化资本开支背景
          displayValue: $1.3T
          detail: SPAN 公用事业页面引用 NV5 所述的公用事业所需资本投资。
          note: 美国宏观背景，不是 SPAN 特有收入。
          tone: neutral
          claimRefs:
            - CM006
        - label: 传统 4M 服务区域电气化
          displayValue: ~$14B
          detail: 公司估算的 400 万户服务区域电气化及相关升级成本。
          note: 区域层面情景。
          tone: risk
          claimRefs:
            - CM007
        - label: 使用 SPAN + PowerUp 的 4M 服务区域电气化
          displayValue: ~$6.3-$7.8B
          detail: 公司估算的同一 400 万户服务区域采用 SPAN 和 SPAN PowerUp 后的成本。
          note: 公司编制的成本规避案例，不是独立 TAM。
          tone: opportunity
          claimRefs:
            - CM007
        - label: 配合基础设施升级的单户电气化
          displayValue: $19,000
          detail: 公司编制的传统单户成本估算，包括基础设施升级和 6 个月以上的时间投入。
          note: 家庭层面情景。
          tone: risk
          claimRefs:
            - CM007
        - label: 使用 SPAN 的单户电气化
          displayValue: $8,500-$10,500
          detail: 公司编制的单户成本区间；使用 SPAN 后无需进行基础设施升级。
          note: 使用 SPAN + SPAN PowerUp 的情景估算。
          tone: opportunity
          claimRefs:
            - CM007
        - label: 避免 400A 公用事业服务后建造商节省的成本
          displayValue: $3,000-$10,000
          detail: SPAN 引用的建造商估算，适用于采用扩展型智能配电盘产品的新房项目。
          note: 项目层面的建造商视角。
          tone: positive
          claimRefs:
