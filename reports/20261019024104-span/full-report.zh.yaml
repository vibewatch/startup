        title: 展示项
        blocks:
          - type: callout
            title: Eaton 同时提供融资与分销杠杆
            body: 7500 万美元投资之所以比孤立的融资事件更具战略意义，是因为独立报道还将 Eaton 与安装商和住宅建筑商分销联系起来。
