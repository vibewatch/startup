      - number: '7.2'
        title: 监管、法律与政策依赖
        blocks:
          - type: paragraph
            body: >
              资料池中最清晰的监管信号不是许可或监管机构批准，而是 SPAN 自己的解释：PowerUp 按 NEC 逻辑符合规范，
              但最终批准仍取决于当地法规。这很重要，因为产品价值主张明确包括避免部分供电容量升级并支持灵活电气化；
              因而许可解释、当地检查员的接受度和公用事业项目认可，都可能影响实际附加率和客户节省额。公用事业页面更进一步描述了 由公用事业设定的动态供电评级和峰值事件管理，因此 SPAN
              的部分公用事业投资逻辑依赖外部项目设计，而不是配电箱本身。

              审阅的公开证据不包括直接的监管机构、法院、隐私或召回记录，无法据此建立 SPAN 的法律和事故历史。这一证据缺口不能 被解读为不存在问题。实际含义是，买方只能把法律或政策风险列为尚未确认，而不是已经排除：SPAN
              有一套合理的合规叙事， 但投资人在大幅降低剩余法律风险敞口前，仍需直接证据说明诉讼、执法、安全事件、网络安全事故和各司法辖区的审批摩擦。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
      - number: '7.3'
        title: 运营、质量与软件控制风险
        blocks:
          - type: paragraph
            body: >
              从运营角度看，相比普通配电箱供应商，SPAN 更容易受到安装质量和软件调试的影响。SPAN 支持材料称内部服务必须由授权安装商完成，
              两个独立评测来源都强调，安装商质量是客户满意度中最大的变量。一篇评测特别指出，未认证电工可能留下标记错误的电路、 未完成的 App
              调试，或损坏太阳能与电池的集成；这会把部署错误变成产品体验和支持成本风险，而不只是普通的承包商噪声。

              产品也依赖软件和网络可靠性。SPAN 及其合作伙伴材料把电路级远程控制、App 驱动的洞察和可配置备用电源优先级作为核心价值； 同一批评测还指出，配电箱附近 Wi-Fi 较弱是常见故障点。这不意味着 SPAN
              特别脆弱，但意味着产品承诺建立在软硬件与服务的组合 之上。如果现场连接、固件质量或安装商设置落后，即使底层配电箱硬件正常，客户结果和可供引用性也可能迅速恶化。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR015
      - number: '7.4'
        title: 伙伴依赖、资本敞口与监测触发条件
        blocks:
          - type: paragraph
            body: >
              SPAN 的伙伴和资本状况降低了部分短期下行，却也制造了自身的依赖风险。Eaton 将联合解决方案作为家庭电气化战略的一部分公开营销， 并在 2026 年宣布投资 7500
              万美元，同时计划通过安装商和住宅建筑商网络分销 SPAN 技术。这带来了重要的资本、分销和信誉收益， 但也意味着 SPAN 的市场准入越来越依赖大型合作伙伴的路线图和持续承诺。公用事业页面同样把 SPAN
              放进需求管理和避免基础设施升级 项目中，而这些项目的规则不受 SPAN 直接控制。

              资本风险得到缓解，但没有消失。SPAN 2023 年融资公告披露累计融资 2.31 亿美元，2026 年 Eaton 投资又增加了更新的资本标记。
              两项披露都没有提供当前收入、毛利率、现金余额、现金跑道、轮次条款或可靠的老股交易定价。因此，当前估值和流动性仍缺乏充分证据。
              最清晰的投资逻辑破坏触发条件是可衡量的：许可反复被拒、安装商质量问题持续、公用事业或合作伙伴采用放慢、无法交付已宣布的 Eaton 集成产品，或一次融资事件揭示出比历史增长故事更弱的经济性。
            claimRefs:
              - CR001
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 最高优先级否决标准
            body: 如果尽调无法验证 PowerUp 类部署的一致许可通过率、认证安装商带来的现场质量结果，以及一个能够支持历史增长叙事的当前融资 或老股交易标记，而只能依赖过时的融资证据，就应升级为不推进结论。
            calloutType: risk
            claimRefs:
              - CR003
              - CR006
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              本章结论是观察：信心中等、风险高，且没有公开证据支持估值立场。积极情景并非凭空想象：SPAN 仍在销售差异化智能配电箱， 宣传电路级控制和备用电源灵活性，如今还通过 Eaton
              获得了规模化合作伙伴路径。公开证据也显示，Eaton 在 2026 年向公司投入了 新资本，这比只停留在营销叙事中的合作更强。但证据仍然对价格敏感，却不足以清除价格不确定性。公开记录没有披露当前已确认收入、
              毛利率、装机基数、留存或清算优先权条款，因此外部投资人无法把渠道动能转换成有说服力的入场倍数。纪律性的结论是继续观察， 直到估值条款改善，或当前运营证明变得更充分。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 投资逻辑与反向证据
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，SPAN 的软件定义负载控制解决了真实的电气化痛点：家庭、建筑商和公用事业公司需要在不反复升级供电容量的情况下， 增加电动车充电、电池和热泵。Eaton
              联盟很重要，因为它扩大了面向建筑商、分销商和安装商的触达，而单独的硬件初创公司很难 自己触达这些渠道。反向逻辑是，公开证据仍显示采用存在摩擦。独立报道称直接面向消费者的产品价格昂贵，可服务住宅市场受到屋顶太阳能
              和电动车需求放缓的压力，公用事业扩张虽有前景却仍未解决商业化问题。因此，投资问题不是 SPAN 是否有可信产品，而是公用事业和
              合作伙伴渠道能否在资本市场环境或补贴变化再次收紧前，把产品优势转化为可重复、可披露的经济性。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要证明，Eaton 带来的分销和公用事业项目能把 SPAN 的硬件溢价转化为建筑商和房主更低的项目总成本。 基准情景更克制：SPAN
              继续赢得战略合作伙伴并融资，但外部投资人仍看不到足够的当前运营细节，无法判断高溢价入场价格。 悲观情景则叠加电气化需求放缓、政策回撤和公用事业销售周期延长，使今天的公开动能无法代表实际价值。由于公开记录没有提供
              最近的收入或利润率基础，本处情景分析有意保持定性；正确的纪律是梳理哪些事实会改变判断，而不是制造虚假的精确度。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调问题与投资逻辑破坏因素
        blocks:
          - type: paragraph
            body: >-
              剩余估值工作很直接，但不能省略。管理层需要展示当前已确认收入、按产品线拆分的毛利率、装机基数增长、公用事业项目转化，
              以及决定新投资人能否在平轮或下轮中获得保护的股权结构条款。积极更新应当是第三方证据：公用事业合作伙伴正在大规模补贴部署， 或 Eaton
              分销正在转化为可量化的单位增长，同时保修和服务成本结果可接受。投资逻辑破坏因素同样清晰：电气化需求放缓却没有公用事业牵引力
              对冲，合作伙伴分销没有转化为披露的商业规模，或融资条款使普通股经济性明显差于标题估值所暗示的水平。在这些问题解决前， SPAN 值得持续观察，但还不值得追价。
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 在当前运营指标或能保护下行的条款让入场逻辑变得具体之前，继续观察 SPAN，而不是买入。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: 主要下行驱动因素
            body: 公开证据显示真实的战略兴趣，但直接面向消费者的价格摩擦和公用事业渠道执行风险，仍可能跑在已披露的运营证明之前。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV014
          - type: callout
            title: 哪些事实会改变判断
            body: 更积极的判断需要第三方证据证明渠道已规模化转化，并披露当前收入、毛利率和融资条款。
            calloutType: assumption
            claimRefs:
              - CV005
              - CV011
              - CV014
