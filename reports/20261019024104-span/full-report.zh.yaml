      - number: '4.2'
        title: 分销、交付成本与销售效率
        blocks:
          - type: paragraph
            body: >-
              SPAN 的核心市场进入方式仍由安装商介导：授权安装商选择合适的配电箱，且内部组件维护必须由授权安装商完成。这种模式可以提升安装质量，却也让 SPAN
              暴露于安装商供给、加价、培训和服务费用，这些都没有公开量化。Netfigo 明确称安装后成本很高，并表示持证电工要求限制了销售渠道，将其构成本章的反向证据。Eaton 可能形成重要对冲。独立报道称，Eaton
              计划通过既有安装商和住宅建筑商网络，分销集成 SPAN 的智能配电箱。这可能降低渠道获客摩擦，但没有来源披露渠道利润率、线索转化率、销售周期、获客成本或回本周期。
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
