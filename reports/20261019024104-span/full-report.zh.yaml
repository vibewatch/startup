      - number: '1.2'
        title: 管理层与渠道模式
        blocks:
          - type: paragraph
            body: >-
              保留来源中的公开发声主要集中在联合创始人兼 CEO Arch Rao 身上。他在 Tesla 的产品经历与 SPAN 的软硬件定位 相符，其言论也支撑了融资和公用事业渠道报道。更重要的战略变化是渠道扩张：到
              2025 年初，SPAN 已不再只是 面向房主改造市场的故事，而是覆盖住宅直销需求、建筑商和公用事业公司的三条路径。这扩大了总可用市场的触达，
              也可能降低获客摩擦；但与此同时，公司更依赖合作伙伴的执行，而这些伙伴的经济条件、推出节奏和治理权利， 在此处保留的来源中都没有公开说明。
