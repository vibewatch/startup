              声称高端软件会产生经常性收入，但保留的官方和合作伙伴来源没有提供 价格、附加率、订阅用户数或会计处理，无法验证独立的软件经常性收入流。安装商转介经济性同样只有 Netfigo 提出。公用事业项目 和 XFRA
              扩大了机会范围，但其合同价格和收入确认方式仍属非公开信息。
