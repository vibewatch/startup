    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与产品定位
        blocks:
          - type: paragraph
            body: >-
              保留的官方页面始终将 SPAN 描述为软件定义配电箱公司，而非泛化的智能家居品牌。其当前产品叙事围绕 用接入 App 的控制层替换家庭配电箱展开，为用户提供电路级可视化、电池备用电源编排和负载管理；
              当房主增加大功率电气负载时，这些能力旨在推迟升级供电容量。这个产品定位与更广泛的电气化投资逻辑一致， 但保留的来源没有披露成立日期，只有一条来自 2022 年的旧总部信息，而不是最新公司简介或监管文件。
