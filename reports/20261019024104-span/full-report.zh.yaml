      - number: '1.3'
        title: 融资与里程碑
        blocks:
          - type: paragraph
            body: >-
              融资和里程碑证据显示，公司在扩展产品家族的同时持续获得战略资本。Canary Media 报道，2022 年 3 月的 9000 万美元 B 轮融资使当时披露的累计融资达到 1.34 亿美元；Eaton 则在
              2026 年 3 月宣布追加 7500 万美元投资， 并同步建立商业合作关系。产品里程碑也在推进：SPAN 于 2025 年 2 月公开推出新的配电箱型号，称将于 2025 年 4 月开始交付；Eaton
              则表示联合解决方案预计在 2026 年第二季度推出。缺失的信息同样重要： 保留来源没有给出当前估值、更新后的累计融资总额或当前运营指标。
