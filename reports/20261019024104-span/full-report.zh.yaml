        title: 反向解读与公开缺口
        blocks:
          - type: paragraph
            body: >-
              保留资料池中的悲观解读不是丑闻或法律事件，而是执行和市场结构风险。Latitude 报道称，智能配电箱部署 相比 2020—2021
              年的高峰正在降温，新型智能电表也越来越多地争夺同一笔电网边缘可视化预算；报道还指出， SPAN 的公用事业变现模式仍在摸索。因此，公司可以讲出有吸引力的合作伙伴故事，却还没有给外部投资人
              足够的公开运营数据，来判断渠道转向是否带来了持久采用、富有吸引力的单位经济性，或仍符合私募市场预期的估值。
