  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：配电箱控制、避免升级供电容量与电网边缘软件
        blocks:
          - type: paragraph
            body: >-
              不应把 SPAN 定义为泛化的太阳能、电池或电气设备供应商。公开证据将它放在智能配电箱和住宅能源管理层： 用于替换或增强配电箱的硬件、管理电路和备用电源优先级的软件，以及让家庭增加电气化负载而不必默认升级
              供电容量的控制功能。这个边界包括配电箱硬件、SPAN Home App、Energy Intelligence 软件，以及 PowerUp 等
              负载管理功能；不包括太阳能发电硬件、电池包本身，以及不具备电路级控制能力的普通断路器箱。因此，实际 替代品是原有配电箱升级、转换开关、子配电箱、智能电表和其他负载管理方案，而不是整个分布式能源栈。
              这一点很重要，因为价值主张与其说是销售电力，不如说是把避免基础设施升级的成本和更好的家庭负载编排变现。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 买方、用户与付费方图谱：房主改造、新建住宅与公用事业渠道
        blocks:
          - type: paragraph
            body: >-
              现有资料池显示出三种活跃的购买路径。第一，房主增加电动车充电、热泵、太阳能或电池时，会采用 SPAN， 以便在既有供电约束内运行，同时获得电路级可视化和备用电源控制。第二，住宅建筑商和开发商使用 SPAN，
              让新房具备电气化能力，降低升级供电容量带来的项目成本，并通过监控和服务数据改善交房后的房主体验。 第三，公用事业公司和电网运营商正在成为新兴预算所有者，因为负载管理可以大规模推迟配电和供电容量升级支出。
              安装商、电气承包商，以及 Eaton 的分销和住宅建筑商网络，是三条路径共同依赖的关键渠道。因此，市场采用 既取决于终端用户需求，也取决于渠道赋能和工作流适配。公用事业路径的战略意义在于，它可以把 SPAN
              从高端房主 产品转为通过大型机构预算销售的基础设施产品。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
      - number: '2.3'
        title: 市场规模视角、采用驱动因素与令 TAM 难以精确的约束
        blocks:
          - type: paragraph
            body: >-
              资料池中的市场规模估算受证据限制，并不是一套清晰的 TAM/SAM/SOM。SPAN 的公用事业页面提供了最宽的量化视角，
              提到住宅负载增长、配电升级支出上升和公用事业公司庞大的资本开支需求，并进一步换算为每户成本和 4M 服务区域的
              成本比较。建筑商公告则通过声称的单站点节省额提供了更窄的项目经济性视角，而房主定价信号表明，该品类仍有较高
              的前期溢价。这些视角支持真实机会，但也解释了为什么估值取决于采用时点和预算归属，而不是某个宏大的市场标题。
              地方法规和审批流程、对受训安装商的需求、与屋顶太阳能和电动车周期相关的直销需求走弱、来自更智能电表的竞争， 以及最清晰的公用事业规模节省数字仍由公司撰写而非独立审计的市场数据，都会拖慢采用。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
