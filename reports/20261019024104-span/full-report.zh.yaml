      - number: '3.2'
        title: 控制、安装与定价取舍
        blocks:
          - type: paragraph
            body: >-
              SPAN 在资料池中的核心差异化是覆盖面：官方材料描述了可替换完整配电箱、控制 16 至 48 个电路、基于 App 的监控和避免升级供电容量的负载管理；Eaton
              在合作产品中也复述了同样的电路级控制主张。相比之下， OhmSnap 将 Lumin 定义为外挂设备：保留原有配电箱，控制最多 12 个选定电路；仅监控型替代品能保留可视化，
              却不能自动化。公开价格信号也与这一能力梯度一致。独立的 2026 年指南始终将完整智能配电箱置于安装成本最高端， Lumin 居中，监控型替代品在底部。因此，SPAN
              必须靠避免升级成本、备用电源质量和长期软件价值取胜， 而不能只靠前期价格便宜。
            claimRefs:
              - CP001
