      - number: '4.3'
        title: 客户价值代理指标与新兴扩张
        blocks:
          - type: paragraph
            body: >-
              SPAN 提供的是客户价值证据，而不是公司利润率证据。其公用事业页面测算每户电气化成本：不使用 SPAN 时为 $19,000，使用 SPAN 和 PowerUp 时为 $8,500—$10,500
              美元，其中包含明确列出的 $1,500—$3,500 SPAN Edge 成本。这些是公司提供的基础设施规避成本估算，不是发票价格、确认收入或毛利润。同一页面称，SPAN 能提供传统智能电表 30
              多倍的使用数据，这或许能支撑公用事业定价和负载管理产品，但此处没有独立基准。XFRA 增加了第二条扩张路径：SPAN 宣布部署将在 2026 年稍晚开始，并计划在 2027
              年达到吉瓦级规模。其房主方案意味着硬件和补贴义务，但价格、利用率、资金责任和贡献利润率仍未披露。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              Eaton 的 7500 万美元战略投资是现有证据中最新鲜、最强的资本信号。它比单独的融资标题更有用，因为同时伴随产品整合和
              渠道准入。但这仍是已筹融资，不等于当前可用现金：保留来源没有披露交割条款、资金用途、手头现金、烧钱速度、债务、
              项目融资义务、契约余量或下一轮触发条件。因此，公开记录不足以支持现金跑道计算。相应的投资判断也必须设限。 SPAN 有可见的产品定价、多条市场进入路径和合理的客户成本节省，但收入构成、实际
              ASP、保修和服务成本、毛利率、获客成本/ 回本周期及营运资本需求仍属非公开信息。没有管理层账目和渠道层面的队列数据，这个财务画像虽有战略前景，却不足以支持 高确信度投资判断。
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
