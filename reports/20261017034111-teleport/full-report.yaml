      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Teleport looks like a real enterprise software business with a credible monetization surface,
              current product breadth, and compliance-oriented value that can justify contract pricing and multi-product
              expansion. What is missing is the evidence needed to turn that commercial story into an underwritable
              model: there is no public current revenue or ARR base, no gross margin disclosure, no cash-and-burn
              bridge, no realized pricing data, and no public explanation of Cisco's 2026 investment terms. The right
              investment read today is not "bad economics" so much as "insufficient economics": the next diligence step
              is management disclosure, not spreadsheet refinement.
