      - number: '3.4'
        title: 'Durability looks moderate: broad enough to matter, but not immune to category pressure'
        blocks:
          - type: paragraph
            body: >-
              Teleport's moat is not just open source; it is the combination of breadth, short-lived certificates,
              auditability, and a single control plane across human and non-human access. That is meaningful, but the
              retained sources do not prove lock-in through public win rates, churn, or multi-homing data. Instead, the
              durability case is architectural: replacing several fragmented systems is harder to dislodge than
              replacing one VPN or one broker. The pressure comes from both sides. Legacy PAM incumbents still appear in
              buyer shortlists, while adjacent identity entrants can chip away at narrower use cases. Teleport therefore
              looks durable in complex regulated environments, but more vulnerable where buyers only need one slice of
              the problem.
            claimRefs:
