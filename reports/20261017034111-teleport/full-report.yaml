  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Teleport's retained sources consistently place it in a specific infrastructure access and identity-control
              market, not in a broad undifferentiated security bucket. The 2022 TechCrunch profile described Teleport as
              an identity-based infrastructure access proxy spanning SSH, HTTPS, RDP, databases, Kubernetes clusters,
              internal web applications, and networked servers, while current product pages frame the same core job as
              zero-trust access and a unified identity layer for humans, machines, workloads, and AI agents. That
              combination implies the economic boundary starts with privileged infrastructure access and then expands
              outward into machine/workload identity and governance. It also means the status-quo substitutes are not
              just one competitor category: Teleport explicitly argues against VPNs, bastion hosts, shared credentials,
              standing privileges, and siloed access tools. For underwriting, the key point is that TAM discipline
              should begin with the control-plane problems Teleport demonstrably solves today, then treat newer AI-agent
              and identity-adjacent language as expansion potential rather than automatically assuming all adjacent
              security spend is addressable.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM012
              - CM013
              - CM014
