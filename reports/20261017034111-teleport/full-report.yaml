  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth is a competitive fact, not a marketing flourish
        blocks:
          - type: paragraph
            body: >-
              Teleport is not selling into a single clean category. The retained independent review set places it beside
              HashiCorp Boundary and StrongDM as direct access-platform peers, beside Tailscale as an adjacent
              connectivity-first substitute, and beside newer cloud- and machine-identity entrants such as Britive,
              Apono, and P0 Security. Public comparison hubs also show buyers shortlisting Teleport against legacy PAM
              suites, while official technical material makes clear that the status quo alternative is still an internal
              mix of VPNs, bastions, shared credentials, and per-protocol tooling. That means Teleport usually wins or
              loses on how many tools a buyer wants to retire at once, not on one narrow feature checklist alone.
            claimRefs:
