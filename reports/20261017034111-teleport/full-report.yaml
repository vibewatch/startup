chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and current stage
        blocks:
          - type: paragraph
            body: >-
              Teleport presents itself as an infrastructure identity platform rather than a point access tool. Its
              current messaging emphasizes one cryptographic identity layer spanning humans, machines, workloads, and AI
              agents, while official product documentation still roots the platform in certificate authority, proxy, and
              audit functions across SSH, RDP, HTTPS, Kubernetes, and database access. Independent tool profiles broadly
              corroborate that architecture and positioning, which makes the category story credible even if most scale
              claims remain company-originated. Commercially, the assigned public evidence supports a private,
              venture-backed status with an open-source core plus paid enterprise upsell, but it does not expose fresh
              public revenue, headcount, or a post-2022 priced valuation reset. Those omissions matter because later
              chapters will need to distinguish product depth from underwriting-quality operating disclosure.
