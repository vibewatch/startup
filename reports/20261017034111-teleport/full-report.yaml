      - number: '4.3'
        title: Capital adequacy and funding visibility
        blocks:
          - type: paragraph
            body: >-
              The capital story is materially less transparent than the product story. The last fully disclosed priced
              round still appears to be the May 2022 Series C: Teleport said in its 2022 webinar that it had just raised
              $110 million, and NHI Governance records that round at a $1.1 billion valuation with stated total funding
              of $169 million as of that time. Since then, the freshest public change is Cisco's August 2026 strategic
              investment and partnership, but public sources do not disclose the amount, instrument, valuation impact,
              or other terms. That leaves investors without the inputs needed to size current cash on hand, monthly
              burn, runway, debt capacity, or the likely trigger for a next financing. Public secondary-market
              visibility does not close the gap: the fetched Nasdaq Private Market company page supplies intermediary
              and regulatory disclosures but no Teleport transaction pricing or issuer financial statements. Funding
              raised historically is therefore not a proxy for cash currently available.
            claimRefs:
