  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product scope and workflow
        blocks:
          - type: paragraph
            body: >-
              Teleport positions the product as an identity-native access layer for engineering and security teams
              rather than a point tool for SSH alone. Current official surfaces span servers, databases, Kubernetes
              clusters, internal applications, cloud consoles, machines, workloads, and MCP-based AI-agent access, all
              using short-lived credentials instead of static secrets. The user workflow is consistent: an operator or
              workload authenticates through an identity source, receives a time-bounded certificate, and then connects
              to a scoped resource with audit attribution attached to that session. That breadth is real and repeatedly
              documented, but most public proof still comes from Teleport itself, so present-day mix by module,
              production penetration of newer AI features, and module-level revenue contribution remain diligence gaps
              rather than externally verified facts.
            claimRefs:
