      - number: '3.3'
        title: Open-source entry helps, but operating and paying for the platform is a real tradeoff
        blocks:
          - type: paragraph
            body: >-
              Teleport's packaging gives it a practical wedge that legacy suites often lack: a free community edition, a
              published enterprise starting point, and a managed cloud path. That lowers evaluation friction for
              engineering-led buyers and creates a cleaner upgrade story than a managed-only rival. The same evidence
              also shows why that wedge is not absolute. The public review set flags a real HA learning curve, rising
              enterprise-seat costs at scale, and weaker database maturity than its SSH and Kubernetes story. In
              competitive terms, that means Tailscale can win when the real job is secure connectivity, and StrongDM can
              win when the buyer starts from managed database access rather than a broader infrastructure identity
              agenda.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
