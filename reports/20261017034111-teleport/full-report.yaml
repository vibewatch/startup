        title: Funding history, scale signals, and milestone path
        blocks:
          - type: paragraph
            body: >-
              Teleport's public financing chronology is unusually clear through 2022 and increasingly opaque afterward.
              Assigned sources support a conventional venture path from a 2019 Series A and 2021 Series B into a $110M
              Series C at a $1.1B valuation in May 2022, with total disclosed funding reaching $169M at that point.
              Later milestone evidence shifts from priced-round disclosure toward company-led category building: a
              February 2025 Infrastructure Identity launch narrative, a July 2026 agentic-identity push, and an August
              2026 Cisco strategic investment whose amount was not disclosed. Scale signals point in the same direction.
              Management said there were 200+ customers in June 2022, then claimed 500+ adopting companies in February
              2025, but neither number is independently verified in the assigned pool. That pattern suggests product and
              distribution momentum, but not enough transparent operating disclosure to treat current scale, customer
              count, or commercial efficiency as settled ground truth.
