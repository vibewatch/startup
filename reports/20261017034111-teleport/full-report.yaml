      - number: '5.2'
        title: Architecture, deployment, and control plane
        blocks:
          - type: paragraph
            body: >-
              Public technical material describes a familiar but coherent architecture: the Auth Service acts as
              certificate authority and policy engine, the Proxy Service is the public gateway, and protocol-specific
              agents sit with protected resources. Reverse tunnels and Teleport VNet are central to the operating model
              because they let private resources connect outward rather than relying on inbound VPN or bastion exposure.
              That design supports hybrid deployment claims and aligns with Teleport's self-hosted, cloud, and hybrid
              packaging narrative. The tradeoff is operational complexity: independent operator commentary describes the
              initial configuration as verbose, dense, and more demanding than lighter-weight connectivity tools, while
              version alignment across auth, proxy, and agents matters for upgrades.
            claimRefs:
              - CE003
              - CE006
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE009
              - CE010
              - CE013
      - number: '5.3'
        title: Trust, audit, and operational controls
        blocks:
          - type: paragraph
            body: >-
              Security control depth is a core product strength. Official materials consistently describe short-lived
              certificates, role-based policy, approval workflows, and session recording as default operating primitives
              rather than optional add-ons. Teleport also extends that identity model to machines and AI agents, which
              is important because many zero-trust tools stop at human access and leave automation dependent on
              long-lived credentials. In practical terms, the public workflow includes Slack, Jira, PagerDuty, and
              similar approval or ticketing hooks, while audit trails can capture interactive sessions and associated
              metadata. The available compliance evidence is still asymmetric: Teleport cites frameworks such as SOC 2,
              FedRAMP, and HIPAA, but public third-party proof of current authorization scope, especially for newer
              product surfaces, is thinner than the company narrative.
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE008
              - CE012
      - number: '5.4'
        title: Technical differentiation and key diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The clearest product differentiation is not any single protocol adapter; it is the attempt to put humans,
              workloads, devices, infrastructure resources, and now AI agents under one identity and audit model. That
              gives Teleport a broader product envelope than VPN replacements and narrower access brokers, and it likely
              explains why operators cite value in session replay and centralized policy. The same breadth creates
              execution risk. Community feedback shows real adoption, but it also surfaces edge-case friction such as
              tbot and ArgoCD fit problems, approval interruption fatigue, and the need to keep some workflows on native
              cloud IAM. Investors should therefore diligence which modules are truly in production, how much of the
              newer AI/MCP surface is active versus narrative, and whether compliance, uptime, and support burden are
              proven outside company-issued content.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unified control plane is the real product wedge
            body: >-
              Teleport's core advantage is consolidating human, machine, and now AI-agent access under one certificate,
              policy, and audit model rather than selling a single-protocol access point.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE013
          - type: callout
            title: Operational breadth creates implementation risk
            body: >-
              Independent operator commentary supports the value proposition, but it also suggests dense setup, upgrade
              coordination, and integration edge cases that buyers need to test in their own workflows.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying center
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently place Teleport with platform engineering, DevOps, SRE, and security teams that
              need one access layer across SSH, Kubernetes, databases, applications, and machine identities. That makes
              the practical buyer/user mix broader than a narrow SSH-admin tool: the economic buyer is usually a
              security or platform budget owner, the daily users are engineers and automation systems, and the product
              pitch is strongest where teams already operate cloud-native infrastructure at scale rather than a single
              legacy perimeter.


              The public segmentation also splits between modern engineering-led adoption and compliance-led expansion.
              Teleport's regulated-environment proof is meaningful because the company can point to access-control,
              audit, and FedRAMP-oriented use cases, but it does not publish segment mix, paid conversion by workload,
              or revenue concentration by vertical. The customer motion therefore looks real, but the underwrite still
              depends on private diligence for how much revenue comes from large regulated accounts versus smaller
              self-serve or open-source-influenced teams.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU012
              - CU014
      - number: '6.2'
        title: Adoption proof is real, but freshest scale data is thin
        blocks:
          - type: paragraph
            body: >-
              Teleport does have credible public customer proof: the 2022 introduction webinar said the company had more
              than 200 customers and cited adoption with Nasdaq, IBM, Samsung, and Snowflake, while an August 2026
              independent profile still named DoorDash, Elastic, Nasdaq, and Snowflake as customers. That is enough to
              establish enterprise relevance, especially when paired with official testimonials that describe specific
              operational wins such as replacing manual SSH-key workflows, closing a Kubernetes API without losing
              access for engineers or automation, and meeting regulated-access requirements for a stock-exchange
              environment.


              The gap is freshness and denominator quality. The strongest independent scale language still leans on
              "hundreds of enterprise customers" or on the older statement that Teleport doubled its customer base from
              2020 to 2021, and the machine-identity webinar's large-fleet example is anonymous. Public evidence
              therefore proves meaningful adoption and product usefulness, but not current customer count, spending
              depth, live deployment breadth, or whether the named logos represent growing production accounts versus
              older reference customers.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Expansion logic exists, but durability remains mostly private
        blocks:
          - type: paragraph
            body: >-
              The best public explanation of Teleport's land-and-expand motion is architectural rather than financial.
              Independent technical analysis describes adoption as an incremental sequence that starts with bastion
              replacement, then spreads into Kubernetes, databases, access requests, and multi-cluster federation. Built
              In also points to AWS and TD SYNNEX channel relationships, which suggests some expansion can come through
              partner-led procurement rather than only direct field selling.


              Even so, durability is where public evidence weakens fastest. Review and comparison sources openly note
              operational complexity, paid-enterprise feature boundaries, smaller integration breadth than legacy PAM
              leaders, and situations where AWS-native teams already using SSM may not need another control plane.
              Teleport may still expand inside a satisfied account, but the public record does not disclose NRR, GRR,
              churn, renewal rates, contract length, or top-customer exposure, so the chapter's bottom line is that
              customer quality is believable while customer durability still requires management data.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU008
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is strongest in infrastructure-critical workflows
            body: >-
              Teleport's best public proof is not a raw customer-count boast but customer evidence tied to hard
              operational problems: replacing manual SSH-key and bastion workflows, keeping Kubernetes access while
              closing the API, and supporting regulated access controls.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Durability remains a private-data question
            body: >-
              Public sources support that Teleport has real enterprise customers, but they do not disclose NRR, GRR,
              churn, contract length, or concentration, so the chapter cannot treat current customer quality as
              equivalent to durable recurring revenue quality.
            calloutType: risk
            claimRefs:
              - CU009
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Teleport's core control thesis is credible in public materials: official pages describe a unified identity
              layer, short-lived certificates, and resource-scoped session recording across servers, databases,
              Kubernetes, cloud consoles, desktops, and MCP resources. That de-risks the product concept, but it also
              means implementation quality becomes part of the product. Independent reviews and technical writeups
              consistently describe the control plane, RBAC design, migration path, and product breadth as material
              execution risks. In practice, the main underwriting question is not whether Teleport addresses a real
              access problem, but whether a customer can deploy and operate the platform without creating new
              misconfiguration, migration, and governance failure modes.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Teleport has visible compliance-oriented controls, and both company-controlled and third-party material
              point to audit trails, session recording, and support for frameworks such as SOC 2 and ISO 27001. That
              said, the public pool here does not provide a primary-source public authorization artifact for Teleport's
              own FedRAMP or equivalent government listing, so regulated-sale readiness should be treated as partially
              evidenced rather than proven. A second governance risk is architectural: even Teleport-friendly sources
              note the security boundary is the session entry point, not cryptographic control over each command after
              access is granted. That leaves residual insider-misuse or compromised-session risk, which has to be
              mitigated operationally through approvals, moderation, and review rather than assumed away by product
              design.
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR007
              - CR009
              - CR011
              - CR012
              - CR014
      - number: '7.3'
        title: Operational, quality, and technical execution risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Teleport is not a drop-in wrapper around existing SSH keys and network paths. The
              self-hosted model adds Auth, Proxy, and backend responsibilities; adoption also requires redesign for
              teams that still depend on static keys, direct database passwords, or direct kubeconfig-based cluster
              access. Independent material further highlights migration lock-in, version compatibility changes, and
              setup complexity, especially when SSO, multi-cloud infrastructure, and self-hosted deployments are
              involved. Teleport Cloud reduces some of that burden by hosting the control plane, but the underlying
              access model, role design, and retention choices still have to be implemented correctly by the customer.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
              - CR013
      - number: '7.4'
        title: Partner, commercial, and roadmap dependence
        blocks:
          - type: paragraph
            body: >-
              Commercially, the pricing model appears seat-driven rather than infrastructure-driven, which can work for
              large engineering organizations but can create budget friction for smaller or slower-expanding
              deployments. The company also now spans more surfaces - including Linux desktops and AI-agent controls -
              which broadens upside but increases support and roadmap burden. Finally, outside summaries point to a
              Cisco partnership that includes technology integration, licensing, and investment, while noting that the
              amount was undisclosed and that some newer agent-security capabilities were still described as preview
              rather than generally available. Taken together, the partner and roadmap story is strategically promising,
              but not yet de-risked enough to treat as a closed underwriting point.
            claimRefs:
              - CR003
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR012
      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigations visible in public evidence are real: short-lived certificates, audit trails, session
              recording, managed-cloud deployment options, and established compliance programs all lower baseline access
              risk. The remaining question is whether those controls survive real-world rollout, procurement, and scope
              expansion. For diligence, the cleanest kill criteria are monitorable: failure to produce primary
              certification or authorization artifacts for regulated accounts, repeated deployment slippage caused by
              RBAC or migration complexity, continued preview-only status for AI-agent controls after customer pilots,
              or pricing friction that prevents expansion beyond a narrow admin cohort. If those conditions persist
              after technical validation and reference calls, the residual execution risk is likely too high for an
              aggressive underwriting stance.
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Implementation quality is part of the product risk
            body: >-
              Teleport can lower access risk only if customers actually implement the control plane, RBAC, migration
              path, and upgrades well. Independent sources repeatedly show that rollout complexity is the main way the
              thesis can fail.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
          - type: callout
            title: Regulated traction still needs primary proof
            body: >-
              Public evidence supports auditability and compliance features, but the retained pool does not itself prove
              a primary public authorization record for regulated procurement. That gap should remain open until primary
              artifacts are reviewed.
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
          - type: callout
            title: Kill criteria should be measurable
            body: >-
              The thesis should weaken if Teleport cannot produce primary compliance artifacts, if rollout pilots stall
              on RBAC or migration complexity, if new AI controls remain preview-only, or if seat-based pricing prevents
              expansion beyond a narrow admin cohort.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR012
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment view: strong product logic, weak public price support'
        blocks:
          - type: paragraph
            body: >-
              Teleport has a real product wedge: the company markets one infrastructure identity plane across SSH,
              Kubernetes, databases, internal apps, machines, and AI agents, and multiple public sources show that the
              platform is built around short-lived certificates, auditability, and zero-standing-privilege workflows.
              That breadth makes the business strategically interesting because it can sell into security, platform
              engineering, and emerging agent-governance budgets. The underwriting problem is price support, not product
              relevance. The latest public priced round is still the May 2022 Series C at a $1.1B valuation, while the
              later Cisco strategic investment disclosed no amount or valuation terms. With price discovery stale and
              current operating metrics absent, the valuation case cannot clear a buy threshold from public evidence
              alone.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Entry discipline depends on refreshed financial proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence is enough to say Teleport is venture-backed, still private, and commercially serious, but
              not enough to say what entry price is justified today. The assigned sources support a 2022 financing
              anchor, a later strategic-investor signal from Cisco, and a historical pricing model that charges annually
              by user and protocol. They do not disclose current ARR, NRR, gross margin, burn, cash runway, or cap-table
              terms. That forces valuation discipline toward evidence thresholds instead of false precision: a buyer
              would need refreshed private metrics or a new market-clearing transaction before treating the old unicorn
              mark as current. Until then, the sensible stance is to assume valuation risk is higher than
              product-quality risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario framing and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The upside case is straightforward: if Teleport has converted its infrastructure identity breadth,
              enterprise references, and Cisco channel signal into materially larger recurring revenue with acceptable
              retention and margins, a premium outcome could still be defensible. The downside case is equally clear
              from the assigned evidence: Teleport remains operationally non-trivial to deploy, can add latency for some
              database workloads, and may be overbuilt for smaller or simpler environments. Those traits matter because
              they can narrow the buyer universe and slow expansion even when the product is technically strong. The
              gating diligence asks are therefore current economics, post-2022 cap-table terms, and whether Cisco has
              changed distribution enough to reset valuation support.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: What would move the call
            body: >-
              A priced post-2022 transaction or private evidence showing strong current ARR, retention, gross margin,
              and favorable preference stack terms could move Teleport from research-more toward
              invest-at-the-right-price.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV011
              - CV012
          - type: callout
            title: Primary downside to watch
            body: >-
              If operating complexity, latency sensitivity for some workloads, or simpler alternatives narrow the buyer
              universe, the next financing could reset valuation expectations below the stale 2022 anchor.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
