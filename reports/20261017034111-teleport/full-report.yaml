  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence-supported view
      - What would change the view
    rows:
      - - Unified infrastructure identity thesis
        - >-
          Teleport publicly positions one control plane across users, machines, workloads, and agents, which can support
          a broader security budget than SSH access alone.
        - >-
          Evidence that the agent-identity narrative is not translating into enterprise spend or durable retention would
          weaken the premium case.
      - - Enterprise proof thesis
        - >-
          Public materials and third-party references point to known enterprise users and long-lived product deployment,
          so the company is not just a concept-stage story.
        - >-
          If named accounts are historical references rather than expanding production customers, the thesis loses
          commercial weight.
      - - Valuation anti-thesis
        - >-
          The latest disclosed priced valuation is still from May 2022, and the 2026 Cisco strategic investment did not
          disclose price or size.
        - A new financing, secondary mark, or private KPI package could either validate or reset the stale 2022 anchor.
      - - Operational-friction anti-thesis
        - >-
          Independent reviews say Teleport can be complex to operate at scale and may be a poor fit for simpler
          environments or latency-sensitive database access.
        - >-
          Proof that deployment friction is lower than peers or that customers adopt managed/cloud variants at scale
          would reduce this concern.
    notes: >-
      This table mixes company-issued product positioning with third-party diligence and adverse technical commentary;
      it is not a scorecard, and missing financial disclosures keep the anti-thesis materially open.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Current ARR growth, retention, and gross margin are materially stronger than public evidence reveals, and
          Cisco meaningfully improves distribution.
        - >-
          A premium outcome above the stale 2022 anchor is only supportable if refreshed private metrics show durable
          expansion and better go-to-market leverage.
        - >-
          Cisco signal fails to monetize; deployment complexity limits expansion; cap-table terms reduce common-equity
          upside.
        - 'Needs new primary evidence: private KPI pack, board materials, or a priced transaction.'
      - - Base
        - >-
          Teleport is strategically strong but financially solid rather than exceptional, with continued private opacity
          on current economics.
        - >-
          The company may deserve continued tracking, but entry discipline should wait for refreshed price discovery or
          a negotiated discount to stale expectations.
        - Investors overpay relative to current growth; premium narrative outruns monetization evidence.
        - Best fit for a research-more stance until management provides updated numbers.
      - - Bear
        - >-
          Growth and retention have slowed, Cisco terms are commercially modest, and buyers push back on operating
          complexity or cheaper alternatives.
        - >-
          A flat-to-down outcome versus the 2022 unicorn mark becomes plausible if the next real price discovery
          reflects multiple compression or execution drag.
        - No public downside mark exists yet, so downside can emerge suddenly in the next financing or tender process.
        - Independent adverse sources already point to operational burden, latency sensitivity, and small-team misfit.
    notes: >-
      Scenario logic is qualitative because the assigned evidence does not disclose current ARR, NRR, burn, gross
      margin, or cap-table economics. Probability signals indicate what new evidence would be needed, not estimated
      percentages.
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
