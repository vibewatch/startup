      - number: '2.3'
        title: Sizing lenses, adoption signals, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence is better at showing market shape and likely contract economics than at proving a clean
              standalone TAM. Teleport's own February 2025 release said more than 500 companies had adopted the platform
              and that almost half of those customers were companies with more than 1,000 employees, which is a useful
              adoption signal but still company-issued. Vendr's 2026 pricing guide adds a budget lens: it cites annual
              contract ranges from roughly $30,000-$150,000 for buyers managing 100-500 resources and $200,000-$500,000+
              for 1,000+ resource deployments, plus self-hosted minimums that often start at $50,000-$100,000 annually.
              Those figures suggest meaningful enterprise wallet share per account, but they remain pricing benchmarks
              rather than market-capitalization evidence. Just as important, the same source shows why adoption can be
              slower than a top-down TAM slide implies: pricing depends on deployment model, resource counts, feature
              tiers, support, and compliance add-ons, which creates scoping friction and emphasizes proof-of-ROI. The
              clean conclusion is that Teleport appears to sell into a real, budgeted control plane with expansion room,
              but publicly retained evidence still falls short of an independently benchmarked SAM or SOM for the
              current product footprint.
