  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Teleport's public materials show a commercial model that starts with open-source distribution and extends
              into paid enterprise features plus a managed cloud offering, which is directionally consistent with
              infrastructure software sold into engineering and security teams rather than a pure services business. The
              clearest current monetization evidence is the AWS Marketplace cloud listing: it sells a single
