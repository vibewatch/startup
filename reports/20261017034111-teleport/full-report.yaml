    type: matrix
    summary: >-
      The highest residual exposure sits in implementation complexity and regulated-proof gaps, not in the underlying
      access-control concept.
    data:
      columns:
        - label: Likelihood
          note: Probability that the issue becomes a material underwriting problem in the next 12-18 months.
        - label: Impact
          note: Effect on security posture, enterprise conversion, or deal quality if the risk materializes.
        - label: Mitigation maturity
          note: How mature the visible mitigations appear in public evidence.
        - label: Residual exposure
          note: Net exposure after considering currently visible mitigations.
      rows:
        - label: Implementation and migration complexity
          note: Combines self-hosted control-plane burden, workflow redesign, and setup complexity.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
