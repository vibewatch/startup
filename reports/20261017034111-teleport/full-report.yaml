  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Teleport layers identity issuance, access mediation, protocol services, and audit outputs into one
      infrastructure-access control plane.
    data:
      layers:
        - label: Users and non-human identities
          detail: >-
            Human users, machines, workloads, and AI agents begin from distinct identity types but enter one access
            system.
          modules:
            - label: Engineers and administrators
            - label: Machines and CI/CD workloads
            - label: AI agents via MCP clients
        - label: Identity and approval
          detail: SSO and approval workflows verify who is asking and whether elevated access should be granted.
          modules:
            - label: Okta / Entra / GitHub-style SSO
            - label: Slack, Jira, PagerDuty approval hooks
        - label: Auth and policy service
          detail: The Auth Service issues short-lived certificates and applies RBAC or access-request policy.
          outputs:
            - label: User and resource certificates
            - label: Role and access-request decisions
        - label: Proxy and access plane
          detail: The Proxy Service fronts the cluster and mediates connections without requiring broad VPN network trust.
          outputs:
            - label: Public gateway
            - label: Reverse-tunnel / VNet routing
        - label: Protected resource services
          detail: Protocol-specific agents expose infrastructure resources behind the same identity plane.
          modules:
            - label: Servers, databases, and Kubernetes
            - label: Web apps, cloud consoles, desktops, and MCP servers
        - label: Audit and automation outputs
          detail: Recorded sessions and machine identity flows make access reviewable and reusable in automation.
          outputs:
            - label: Session recording and audit export
            - label: tbot / Machine ID automation paths
    approximationNotes: >-
      This figure is a synthesized architecture view drawn from official docs, webinar material, and an independent
      technical deep dive; it is not a literal vendor diagram.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests Teleport usually lands with access-modernization pain, expands across more protocols and
      identities, then faces a buyer-fit checkpoint around legacy PAM and AWS-native alternatives.
    data:
      items:
        - label: Recognize access sprawl
          actor: Security or platform leadership
          stage: Problem recognition
          channels:
            - Official positioning
            - Review sources
          touchpoints:
            - Replace VPNs, bastions, and shared credentials
            - Need one audit trail across infrastructure access
        - label: Land on SSH and core infra access
          actor: DevOps, SRE, and platform engineers
          stage: Initial wedge
          channels:
            - Webinar/demo
            - Open-source evaluation
          touchpoints:
            - Bastion replacement
            - Short-lived certificates and SSO
        - label: Expand to more protocols
          actor: Same engineering teams plus security
          stage: Protocol expansion
          channels:
            - Technical evaluation
            - Architecture rollout
          touchpoints:
            - Add Kubernetes and database access
            - Unify engineers and machines under one policy model
        - label: Add machine identity and workflow governance
          actor: Platform automation and compliance owners
          stage: Workflow expansion
          channels:
            - Machine-identity webinar
            - Access request workflows
          touchpoints:
            - CI/CD and workload identities
            - Approvals, session recording, and audit visibility
        - label: Win regulated use cases
          actor: Compliance-sensitive buyers
          stage: High-friction procurement
          channels:
            - FedRAMP materials
            - Customer testimonials
          touchpoints:
            - FIPS endpoints and continuous-monitoring evidence
            - Access-control proof for internal infrastructure
        - label: Face buyer-fit checkpoint
          actor: Architecture and procurement review
          stage: Renewal / expansion gate
          channels:
            - Independent comparisons
            - Technical diligence
          touchpoints:
            - Legacy PAM leaders may fit some vault-centric buyers better
            - AWS-native teams already happy with SSM may see less incremental value
    approximationNotes: >-
      This journey map is synthesized from product positioning, testimonials, and independent comparison sources; it
      reflects a likely adoption sequence, not a disclosed funnel with conversion rates.
    claimRefs:
      - CU001
      - CU008
      - CU011
      - CU012
      - CU014
  - id: FR001
