            body: >-
              The public record in the assigned pool still points to founder continuity: Ev Kontsevoy remains the
              visible executive voice, while Alexander Klizhentas and Taylor Wakefield continue to appear as the
              technical and operating co-founders in third-party profiles. That continuity helps later chapters reuse a
              stable founder-market-fit narrative, but governance visibility is thin. Public sources identify Teleport
