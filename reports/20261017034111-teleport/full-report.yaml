      - number: '2.2'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The buyer map in retained evidence clusters around technical infrastructure owners and security/compliance
              stakeholders rather than general employee IT. Official product materials repeatedly name engineering
              teams, DevOps, SRE, platform engineering, database operators, and security teams as the operating users,
              while the February 2025 infrastructure-identity press release explicitly distinguishes Teleport's focus on
              engineering-managed infrastructure from broader IT employee workflows. That distinction matters because it
              shapes budget ownership: Teleport looks more like a shared platform-security purchase than a generic
              workforce-IAM line item. The adoption path is also operationally concrete. Teleport pitches one control
              plane that can replace or reduce separate VPN, bastion, key-management, and audit workflows, which means
              purchase urgency likely rises when infrastructure complexity, privileged-access oversight, or compliance
              burden starts creating friction across multiple engineering teams and environments.
            claimRefs:
