chapter:
  number: 6
  title: "Customers"
  summary: "Teleport has real enterprise customer proof, but the public evidence is still much stronger on named references and workflow outcomes than on current customer count, retention, or concentration. The clearest adoption signals come from official testimonials in regulated environments and from older but still relevant enterprise-logo references, while independent 2026 coverage still frames Teleport as a challenger that wins modern infrastructure teams rather than every legacy PAM buyer."
sections:
  - id: "customer-segments"
    title: "Customer segments and buying center"
    body: |-
      Public sources consistently place Teleport with platform engineering, DevOps, SRE, and security teams that need one access layer across SSH, Kubernetes, databases, applications, and machine identities. That makes the practical buyer/user mix broader than a narrow SSH-admin tool: the economic buyer is usually a security or platform budget owner, the daily users are engineers and automation systems, and the product pitch is strongest where teams already operate cloud-native infrastructure at scale rather than a single legacy perimeter.

      The public segmentation also splits between modern engineering-led adoption and compliance-led expansion. Teleport's regulated-environment proof is meaningful because the company can point to access-control, audit, and FedRAMP-oriented use cases, but it does not publish segment mix, paid conversion by workload, or revenue concentration by vertical. The customer motion therefore looks real, but the underwrite still depends on private diligence for how much revenue comes from large regulated accounts versus smaller self-serve or open-source-influenced teams.
    claimRefs: ["CU001", "CU002", "CU008", "CU012", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-proof"
    title: "Adoption proof is real, but freshest scale data is thin"
    body: |-
      Teleport does have credible public customer proof: the 2022 introduction webinar said the company had more than 200 customers and cited adoption with Nasdaq, IBM, Samsung, and Snowflake, while an August 2026 independent profile still named DoorDash, Elastic, Nasdaq, and Snowflake as customers. That is enough to establish enterprise relevance, especially when paired with official testimonials that describe specific operational wins such as replacing manual SSH-key workflows, closing a Kubernetes API without losing access for engineers or automation, and meeting regulated-access requirements for a stock-exchange environment.

      The gap is freshness and denominator quality. The strongest independent scale language still leans on "hundreds of enterprise customers" or on the older statement that Teleport doubled its customer base from 2020 to 2021, and the machine-identity webinar's large-fleet example is anonymous. Public evidence therefore proves meaningful adoption and product usefulness, but not current customer count, spending depth, live deployment breadth, or whether the named logos represent growing production accounts versus older reference customers.
    claimRefs: ["CU003", "CU004", "CU005", "CU006", "CU007", "CU008", "CU009", "CU010"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-and-expansion"
    title: "Expansion logic exists, but durability remains mostly private"
    body: |-
      The best public explanation of Teleport's land-and-expand motion is architectural rather than financial. Independent technical analysis describes adoption as an incremental sequence that starts with bastion replacement, then spreads into Kubernetes, databases, access requests, and multi-cluster federation. Built In also points to AWS and TD SYNNEX channel relationships, which suggests some expansion can come through partner-led procurement rather than only direct field selling.

      Even so, durability is where public evidence weakens fastest. Review and comparison sources openly note operational complexity, paid-enterprise feature boundaries, smaller integration breadth than legacy PAM leaders, and situations where AWS-native teams already using SSM may not need another control plane. Teleport may still expand inside a satisfied account, but the public record does not disclose NRR, GRR, churn, renewal rates, contract length, or top-customer exposure, so the chapter's bottom line is that customer quality is believable while customer durability still requires management data.
    claimRefs: ["CU009", "CU011", "CU012", "CU013", "CU014"]
    figureRefs: ["FU001"]
