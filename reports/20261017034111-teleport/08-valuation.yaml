company:
  name: Teleport
chapter:
  number: 8
  title: Valuation
  summary: Teleport still has a credible infrastructure-identity product thesis, but public price evidence remains anchored to the May 2022 $110M Series C at a $1.1B valuation while the August 2026 Cisco strategic investment disclosed no amount or terms. Without current ARR, retention, burn, gross margin, or post-2022 price discovery in the assigned evidence, the defensible public-evidence call is research-more with a stretched entry stance rather than a buy.
sections:
- id: investment-view
  title: 'Investment view: strong product logic, weak public price support'
  body: 'Teleport has a real product wedge: the company markets one infrastructure identity plane across SSH, Kubernetes, databases, internal apps, machines, and AI agents, and multiple public sources show that the platform is built around short-lived certificates, auditability, and zero-standing-privilege workflows. That breadth makes the business strategically interesting because it can sell into security, platform engineering, and emerging agent-governance budgets. The underwriting problem is price support, not product relevance. The latest public priced round is still the May 2022 Series C at a $1.1B valuation, while the later Cisco strategic investment disclosed no amount or valuation terms. With price discovery stale and current operating metrics absent, the valuation case cannot clear a buy threshold from public evidence alone.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV011
  - CV013
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: entry-discipline
  title: Entry discipline depends on refreshed financial proof
  body: 'Public evidence is enough to say Teleport is venture-backed, still private, and commercially serious, but not enough to say what entry price is justified today. The assigned sources support a 2022 financing anchor, a later strategic-investor signal from Cisco, and a historical pricing model that charges annually by user and protocol. They do not disclose current ARR, NRR, gross margin, burn, cash runway, or cap-table terms. That forces valuation discipline toward evidence thresholds instead of false precision: a buyer would need refreshed private metrics or a new market-clearing transaction before treating the old unicorn mark as current. Until then, the sensible stance is to assume valuation risk is higher than product-quality risk.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV007
  - CV011
  - CV012
- id: scenarios-and-diligence
  title: Scenario framing and final diligence asks
  body: 'The upside case is straightforward: if Teleport has converted its infrastructure identity breadth, enterprise references, and Cisco channel signal into materially larger recurring revenue with acceptable retention and margins, a premium outcome could still be defensible. The downside case is equally clear from the assigned evidence: Teleport remains operationally non-trivial to deploy, can add latency for some database workloads, and may be overbuilt for smaller or simpler environments. Those traits matter because they can narrow the buyer universe and slow expansion even when the product is technically strong. The gating diligence asks are therefore current economics, post-2022 cap-table terms, and whether Cisco has changed distribution enough to reset valuation support.'
  claimRefs:
  - CV005
  - CV006
  - CV008
  - CV009
  - CV010
  - CV012
  - CV013
  tableRefs:
  - TV003
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence
  - Decision implication
  rows:
  - - Recommendation
    - Research more
    - Product depth is credible, but current price support is not public.
    - Do not underwrite a buy from public evidence alone.
  - - Confidence
    - Medium
    - The source pack is directionally strong on product and financing history but weak on current economics.
    - Use management data room evidence, not only public materials, for an investable decision.
  - - Risk rating
    - High
    - Valuation opacity and operational complexity both remain material.
    - Demand hard proof on adoption quality and deployment friction.
  - - Valuation stance
    - Stretched / unsupported
    - Latest public priced round is May 2022 at $1.1B; later Cisco investment disclosed no amount or terms.
    - Treat the 2022 unicorn mark as a stale anchor, not a current clearing price.
  - - Required diligence to change the call
    - Current ARR/NRR, gross margin, burn, cash runway, cap-table preferences, Cisco commercial terms
    - These metrics and terms are not disclosed in the assigned evidence.
    - Positive movement on these items could move the recommendation toward invest at the right price.
  notes: 'Directional decision table only: no public source in the assigned pool discloses current ARR, NRR, gross margin, burn, cash runway, or a refreshed valuation, so price discipline is qualitative rather than numeric.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV011
  - CV012
- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence-supported view
  - What would change the view
  rows:
  - - Unified infrastructure identity thesis
    - Teleport publicly positions one control plane across users, machines, workloads, and agents, which can support a broader security budget than SSH access alone.
    - Evidence that the agent-identity narrative is not translating into enterprise spend or durable retention would weaken the premium case.
  - - Enterprise proof thesis
    - Public materials and third-party references point to known enterprise users and long-lived product deployment, so the company is not just a concept-stage story.
    - If named accounts are historical references rather than expanding production customers, the thesis loses commercial weight.
  - - Valuation anti-thesis
    - The latest disclosed priced valuation is still from May 2022, and the 2026 Cisco strategic investment did not disclose price or size.
    - A new financing, secondary mark, or private KPI package could either validate or reset the stale 2022 anchor.
  - - Operational-friction anti-thesis
    - Independent reviews say Teleport can be complex to operate at scale and may be a poor fit for simpler environments or latency-sensitive database access.
    - Proof that deployment friction is lower than peers or that customers adopt managed/cloud variants at scale would reduce this concern.
  notes: This table mixes company-issued product positioning with third-party diligence and adverse technical commentary; it is not a scorecard, and missing financial disclosures keep the anti-thesis materially open.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV008
  - CV009
  - CV010
  - CV011
  - CV013
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Current ARR growth, retention, and gross margin are materially stronger than public evidence reveals, and Cisco meaningfully improves distribution.
    - A premium outcome above the stale 2022 anchor is only supportable if refreshed private metrics show durable expansion and better go-to-market leverage.
    - Cisco signal fails to monetize; deployment complexity limits expansion; cap-table terms reduce common-equity upside.
    - 'Needs new primary evidence: private KPI pack, board materials, or a priced transaction.'
  - - Base
    - Teleport is strategically strong but financially solid rather than exceptional, with continued private opacity on current economics.
    - The company may deserve continued tracking, but entry discipline should wait for refreshed price discovery or a negotiated discount to stale expectations.
    - Investors overpay relative to current growth; premium narrative outruns monetization evidence.
    - Best fit for a research-more stance until management provides updated numbers.
  - - Bear
    - Growth and retention have slowed, Cisco terms are commercially modest, and buyers push back on operating complexity or cheaper alternatives.
    - A flat-to-down outcome versus the 2022 unicorn mark becomes plausible if the next real price discovery reflects multiple compression or execution drag.
    - No public downside mark exists yet, so downside can emerge suddenly in the next financing or tender process.
    - Independent adverse sources already point to operational burden, latency sensitivity, and small-team misfit.
  notes: Scenario logic is qualitative because the assigned evidence does not disclose current ARR, NRR, burn, gross margin, or cap-table economics. Probability signals indicate what new evidence would be needed, not estimated percentages.
