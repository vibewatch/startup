evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board composition and investor control
    missingEvidence: >-
      Current board seats, observer rights, ownership percentages, liquidation preferences, and any side-letter
      governance provisions.
    whyItMatters: >-
      Without governance and cap-table detail, later valuation and downside analyses cannot judge control, dilution
      sensitivity, or investor leverage.
    diligencePath: >-
      Request the current cap table, board schedule, financing documents, and any investor rights agreements from
      management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current operating scale metrics
    missingEvidence: >-
      Current headcount, ARR or revenue run-rate, office footprint, and an independently verified current customer
      count.
    whyItMatters: >-
      These metrics are required to anchor underwriting on scale efficiency, go-to-market traction, and whether the 2022
      unicorn valuation still fits current execution.
    diligencePath: >-
      Request the latest board deck or KPI pack and corroborate customer count with customer references, procurement
      records, or other third-party footprints.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      A full post-2026 stakeholder roster covering all investors, insiders, ownership stakes, and any secondary
      liquidity.
    whyItMatters: >-
      The public record names key investors but not the full economic or governance structure, so the stakeholder map
      cannot be treated as exhaustive.
    diligencePath: Collect the current shareholder register, financing schedules, and secondary history from the data room.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-lens
    missingEvidence: >-
      An independent third-party TAM, SAM, or SOM dataset specific to privileged infrastructure access or infrastructure
      identity that matches Teleport's current product scope.
    whyItMatters: >-
      Without a scope-matched external market benchmark, valuation work can overstate upside by importing broader IAM or
      cybersecurity categories that Teleport has not yet proven it monetizes.
    diligencePath: >-
      Request management's internal market model, third-party analyst slices, and cohort win-rate data segmented by core
      access control versus newer machine-identity and AI-agent use cases.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: expansion-adjacency
    missingEvidence: >-
      Revenue mix or pipeline data showing how much demand comes from core access control versus newer machine-identity
      and AI-agent modules.
    whyItMatters: >-
      The current messaging broadens the addressable narrative, but without commercial mix data it is hard to judge
      whether the newer adjacencies are valuation-relevant today or mostly strategic positioning.
    diligencePath: >-
      Ask for ARR by module, attach rates for machine-identity products, and win stories where AI-agent or workload
      identity changed deal size or closed a net-new budget.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: Neutral public pricing for Boundary, StrongDM, Tailscale, and incumbent PAM suites in the same source set.
    whyItMatters: Without public list or contract ranges for rivals, the chapter cannot produce a true head-to-head TCO view.
    diligencePath: >-
      Request current price cards or anonymized deal sheets from the company and compare them against live rival quotes
      for the same seat and protocol scope.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Win-loss, churn, multi-homing, and expansion data showing whether buyers standardize on Teleport or use it beside
      other access tools.
    whyItMatters: Durability is easier to prove with commercial behavior than with architecture alone.
    diligencePath: >-
      Ask management for cohort-level win-loss notes, replacement case studies, and deployment overlap with VPN, PAM,
      and database-access tools.
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: incumbent-parity
    missingEvidence: Neutral feature-parity evidence for incumbent PAM suites beyond shortlist presence and Teleport's own critique.
    whyItMatters: >-
      The chapter can identify incumbent pressure, but it cannot precisely rank CyberArk or BeyondTrust versus Teleport
      using this retained pool alone.
    diligencePath: >-
      Add third-party analyst comparisons or customer evaluation notes covering incumbent PAM products and Teleport in
      the same buying process.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Current ARR, GAAP revenue, revenue growth, and revenue mix by cloud, self-hosted, and services.
    whyItMatters: >-
      Without current topline and mix, the public customer and pricing signals cannot be converted into revenue quality
      or growth underwriting.
    diligencePath: >-
      Request the latest board or financing materials with monthly recurring revenue, GAAP revenue, growth, and segment
      mix.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, CAC payback, sales-cycle length, pipeline conversion, and services attach.
    whyItMatters: >-
      Seat-based list mechanics and marketplace availability do not establish efficient enterprise GTM or attractive
      channel economics.
    diligencePath: Request a cohort view of pipeline, win rates, sales-cycle duration, CAC payback, and onboarding/services effort.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt or covenant obligations, and the amount and terms of Cisco's 2026
      strategic investment.
    whyItMatters: >-
      Capital adequacy and financing dependency cannot be underwritten when the freshest disclosed strategic investment
      has no public amount or terms.
    diligencePath: Request the current balance sheet, cash-burn bridge, financing documents, and the Cisco investment summary.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized contract values, discounting behavior, renewal uplift, and support or infrastructure pass-through
      economics.
    whyItMatters: List mechanics with a 25-user floor do not reveal realized ASP, margin profile, or contract quality.
    diligencePath: Request anonymized price books, discount policies, top-customer contract summaries, and renewal/expansion cohorts.
    relatedQuestionRefs:
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: >-
      Current module-level deployment counts, ARR mix, and production usage split across SSH, Kubernetes, database, app,
      machine-identity, and AI-agent surfaces.
    whyItMatters: >-
      Without module mix, it is hard to tell whether Teleport is monetizing a broad platform or still concentrated in a
      smaller subset of access workflows.
    diligencePath: >-
      Request product-line ARR, paid-customer module penetration, and usage telemetry by surface for the last four
      quarters.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: compliance-and-reliability-proof
    missingEvidence: >-
      Independent current evidence for certification scope, uptime, support burden, and operational maturity of newer
      MCP or AI-agent features.
    whyItMatters: >-
      Security and compliance claims are central to Teleport's value proposition, so underwriting needs third-party
      validation beyond company marketing copy.
    diligencePath: >-
      Request current audit reports, major customer references using newer product surfaces, status history, and support
      or renewal data broken out for regulated buyers.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Segmented NRR, GRR, gross churn, renewal rates, contract length, and cohort retention by customer segment.
    whyItMatters: >-
      The chapter can prove adoption and some deployment quality, but not whether those accounts expand economically or
      renew predictably.
    diligencePath: >-
      Request board or operating-review retention/cohort decks with logo churn, gross churn, and renewal terms split by
      cloud, self-hosted, and regulated accounts.
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, channel concentration, and the revenue contribution of named reference customers.
    whyItMatters: >-
      Reference logos can coexist with risky revenue concentration; concentration risk changes both durability and
      valuation quality.
    diligencePath: >-
      Request an ARR concentration schedule by customer, channel partner, and vertical, plus any material-customer
      clauses or renewal cliffs.
  - type: stale
    severity: minor
    topic: named-customer-freshness
    missingEvidence: >-
      Fresh 2025-2026 case studies showing current deployment scope, modules used, and measurable outcomes for named
      enterprise customers.
    whyItMatters: Older or logo-only references prove market acceptance but not current depth, breadth, or customer expansion.
    diligencePath: >-
      Ask management for current customer references or case studies tied to production scale, module breadth, and
      deployment duration.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulated-proof-gap
    missingEvidence: >-
      Primary-source certification or authorization artifacts for regulated deployments, including any public registry
      entries, certificate numbers, or formal authorization letters.
    whyItMatters: >-
      Government and highly regulated buyers may treat the absence of primary proof as a procurement blocker even if
      control statements and testimonials are strong.
    diligencePath: >-
      Request trust-center exports, certification IDs, and any public-sector authorization artifacts directly from the
      company.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: >-
      A verified incident, outage, or litigation record showing whether Teleport has had material security,
      service-availability, or legal events.
    whyItMatters: Without an incident or docket history, downside frequency and crisis-handling quality remain under-specified.
    diligencePath: Request status-history exports, security incident summaries, and legal docket disclosures during diligence.
    relatedQuestionRefs:
      - QR002
      - QR006
  - type: private-evidence-only
    severity: material
    topic: pricing-risk
    missingEvidence: >-
      Current edition-by-edition pricing, discounting behavior, expansion patterns, and gross-retention or
      seat-expansion evidence.
    whyItMatters: >-
      Public pricing language is not enough to judge whether the model scales efficiently across customer sizes or only
      fits a narrow enterprise buyer.
    diligencePath: >-
      Ask for current price books, cohort expansion data, and reference calls focused on seat growth and procurement
      friction.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: stale
    severity: material
    topic: roadmap-maturity
    missingEvidence: >-
      General-availability confirmation, support scope, and customer references for the 2026 AI-agent controls and newer
      endpoint surfaces.
    whyItMatters: >-
      Preview-stage controls should not be underwritten as mature differentiators until customer evidence confirms
      production use and supportability.
    diligencePath: >-
      Request GA notes, customer references, support SLAs, and product telemetry for Linux desktop and agent-security
      features.
    relatedQuestionRefs:
      - QR004
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: current-economics
    missingEvidence: Current ARR, NRR, gross margin, burn, cash runway, and customer-quality metrics.
    whyItMatters: These metrics determine whether the old 2022 unicorn anchor still maps to current operating reality.
    diligencePath: >-
      Request the latest board deck or data room KPI package with monthly recurring revenue, retention cohorts, and
      margin bridge.
    relatedQuestionRefs:
      - QV007
      - QV008
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-cisco-terms
    missingEvidence: >-
      Amount, instrument, liquidation preferences, and commercial obligations tied to Cisco's August 2026 strategic
      investment.
    whyItMatters: >-
      Undisclosed strategic-money terms can materially change common-equity upside and the real post-money valuation
      signal.
    diligencePath: Obtain the financing documents, cap table, and any Cisco commercial agreement summary.
    relatedQuestionRefs:
      - QV002
      - QV007
      - QV008
  - type: missing-source
    severity: minor
    topic: current-pricing-and-adoption
    missingEvidence: >-
      Current enterprise list pricing, package structure, and independently verified present-day customer count or
      retention references.
    whyItMatters: >-
      Current monetization and adoption quality determine whether the platform narrative is translating into scalable
