company:
  name: "Teleport"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Teleport delivers a unified infrastructure-access platform that spans servers,
    databases, Kubernetes, internal apps, cloud consoles, machines, and newer MCP/AI-agent
    surfaces under one certificate-based identity plane. The technical core appears
    mature and differentiated, but current module-level adoption, reliability, and
    compliance proof remain only partially visible outside company-controlled sources.
sections:
  - id: "product-scope"
    title: "Delivered product scope and workflow"
    body: >-
      Teleport positions the product as an identity-native access layer for engineering
      and security teams rather than a point tool for SSH alone. Current official
      surfaces span servers, databases, Kubernetes clusters, internal applications,
      cloud consoles, machines, workloads, and MCP-based AI-agent access, all using
      short-lived credentials instead of static secrets. The user workflow is consistent:
      an operator or workload authenticates through an identity source, receives a
      time-bounded certificate, and then connects to a scoped resource with audit
      attribution attached to that session. That breadth is real and repeatedly documented,
      but most public proof still comes from Teleport itself, so present-day mix by
      module, production penetration of newer AI features, and module-level revenue
      contribution remain diligence gaps rather than externally verified facts.
    claimRefs: ["CE001", "CE002", "CE004", "CE005", "CE014"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "architecture"
    title: "Architecture, deployment, and control plane"
    body: >-
      Public technical material describes a familiar but coherent architecture: the
      Auth Service acts as certificate authority and policy engine, the Proxy Service
      is the public gateway, and protocol-specific agents sit with protected resources.
      Reverse tunnels and Teleport VNet are central to the operating model because
      they let private resources connect outward rather than relying on inbound VPN
      or bastion exposure. That design supports hybrid deployment claims and aligns
      with Teleport's self-hosted, cloud, and hybrid packaging narrative. The tradeoff
      is operational complexity: independent operator commentary describes the initial
      configuration as verbose, dense, and more demanding than lighter-weight connectivity
      tools, while version alignment across auth, proxy, and agents matters for upgrades.
    claimRefs: ["CE003", "CE006", "CE009", "CE010", "CE011"]
    tableRefs: ["TE003"]
  - id: "trust-controls"
    title: "Trust, audit, and operational controls"
    body: >-
      Security control depth is a core product strength. Official materials consistently
      describe short-lived certificates, role-based policy, approval workflows, and
      session recording as default operating primitives rather than optional add-ons.
      Teleport also extends that identity model to machines and AI agents, which is
      important because many zero-trust tools stop at human access and leave automation
      dependent on long-lived credentials. In practical terms, the public workflow
      includes Slack, Jira, PagerDuty, and similar approval or ticketing hooks, while
      audit trails can capture interactive sessions and associated metadata. The available
      compliance evidence is still asymmetric: Teleport cites frameworks such as SOC 2,
      FedRAMP, and HIPAA, but public third-party proof of current authorization scope,
      especially for newer product surfaces, is thinner than the company narrative.
    claimRefs: ["CE002", "CE004", "CE007", "CE008", "CE012"]
  - id: "risks-and-gaps"
    title: "Technical differentiation and key diligence gaps"
    body: >-
      The clearest product differentiation is not any single protocol adapter; it
      is the attempt to put humans, workloads, devices, infrastructure resources, and
      now AI agents under one identity and audit model. That gives Teleport a broader
      product envelope than VPN replacements and narrower access brokers, and it likely
      explains why operators cite value in session replay and centralized policy. The
      same breadth creates execution risk. Community feedback shows real adoption, but
      it also surfaces edge-case friction such as tbot and ArgoCD fit problems, approval
      interruption fatigue, and the need to keep some workflows on native cloud IAM.
      Investors should therefore diligence which modules are truly in production, how
      much of the newer AI/MCP surface is active versus narrative, and whether compliance,
      uptime, and support burden are proven outside company-issued content.
    claimRefs: ["CE008", "CE009", "CE010", "CE012", "CE013"]
