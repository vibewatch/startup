      - number: '1.3'
        title: 融资历史、规模信号与里程碑路径
        blocks:
          - type: paragraph
            body: >-
              Teleport 的公开融资时间线截至 2022 年异常清晰，此后却越来越不透明。现有资料支持一条常规风险投资路径：2019 年 Series A、2021 年 Series B，之后是 2022 年 5 月以
              $1.1B 估值完成的 $110M Series C；当时累计披露融资额达到 $169M。后续里程碑从定价轮披露转向公司主导的品类建设：2025 年 2 月发布 Infrastructure
              Identity，2026 年 7 月推动 agentic identity，以及 2026 年 8 月金额未披露的 Cisco 战略投资。规模信号也一致。管理层称 2022 年 6 月有 200+
              客户，2025 年 2 月又称有 500+ 家采用企业，但现有资料都没有独立核验这两个数字。这说明产品和分发势头不错，却不足以把当前规模、客户数或商业效率当作已确定的事实。
