            body: >-
              安全控制深度是核心产品优势。官方材料始终把短时证书、基于角色的策略、审批工作流和会话录制描述为默认运行基础，而非可选附加项。Teleport 还把身份模型延伸到机器和 AI
              agent，这一点很重要，因为许多零信任工具止步于人工访问，让自动化仍依赖长期凭证。具体而言，公开工作流包含 Slack、Jira、PagerDuty
              等审批或工单钩子，审计轨迹可以记录交互会话及其元数据。现有合规证据仍不对称：Teleport 提及 SOC 2、FedRAMP、HIPAA
