              管理工具更广：经济买方通常是安全或平台预算负责人，日常用户是工程师和自动化系统，产品在已经大规模运行云原生基础设施、而非只有单一传统边界的团队中最有说服力。

              公开分群还分为现代工程主导采用与合规主导扩张两类。Teleport 的受监管环境证明有一定意义，因为公司可以指向访问控制、审计和面向 FedRAMP
              的用例；但它没有披露分群结构、按工作负载计算的付费转化率，或按垂直行业计算的收入集中度。因此客户动能看起来真实，但投资判断仍需私下核实收入中有多少来自大型受监管账户，有多少来自较小的自助式或受开源影响的团队。
