        title: 管理层延续性、治理可见度与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              现有资料仍显示创始团队保持连续：Ev Kontsevoy 仍是最显眼的高管发声者，Alexander Klizhentas 和 Taylor Wakefield
              也继续以技术及运营联合创始人的身份出现在第三方资料中。这种连续性让后续章节可以沿用稳定的创始人与市场匹配叙事，但治理可见度很低。公开来源称 Teleport
              独立且由风险资本支持，却没有提供当前董事会构成、投票控制权、清算优先权，或除已披露投资人和 Cisco
              战略投资以外的持股集中度。因此，真正的关键人物依赖不在于创始人是否仍在，而在于品类叙事、投资人信号和产品市场转化有多大程度仍经由小型创始团队传递，尤其是作为品类布道者和引述对象的 Kontsevoy。
