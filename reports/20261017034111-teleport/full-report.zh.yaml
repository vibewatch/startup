            body: >-
              公开证据中的缓释措施确实存在：短时证书、审计轨迹、会话录制、托管云部署选项和成熟的合规项目，都能降低基线访问风险。剩下的问题是，这些控制能否经受真实落地、采购和范围扩张。尽调时，最清晰的可监测止损标准包括：无法为受监管账户提供一级认证或授权文件；RBAC
              或迁移复杂度反复导致部署延期；客户试点之后 AI agent 控制仍只停留在
              preview；或者定价摩擦使产品无法从狭窄的管理员群体扩张。如果技术验证和客户引荐之后这些情况仍持续，剩余执行风险可能过高，不适合激进的投资判断。
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 实施质量本身就是产品风险
            body: Teleport 只有在客户真正把控制平面、RBAC、迁移路径和升级做好时，才能降低访问风险。独立来源反复显示，落地复杂度是这套论点最可能失效的方式。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
          - type: callout
            title: 受监管牵引力仍需一级证据
            body: 公开证据支持可审计性和合规功能，但保留资料本身并没有证明受监管采购所需的一级公开授权记录。在审阅一级文件之前，这一缺口应继续保留。
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
          - type: callout
            title: 止损标准应可衡量
            body: 如果 Teleport 无法提供一级合规文件，落地试点因 RBAC 或迁移复杂度停滞，新 AI 控制仍停留在 preview，或按席位计价阻止产品超出狭窄管理员群体扩张，则投资论点应转弱。
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR012
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点：产品逻辑强，公开价格支撑弱
        blocks:
          - type: paragraph
            body: >-
              Teleport 有真实的产品切入口：公司把一套基础设施身份平面销售给 SSH、Kubernetes、数据库、内部应用、机器和 AI agent
              场景，多份公开资料也显示平台围绕短时证书、可审计性和无长期权限工作流构建。这种广度让业务在战略上有吸引力，因为它可以进入安全、平台工程和新兴 agent
              治理预算。投资判断的问题在于价格支撑，而不是产品相关性。最新公开定价轮仍是 2022 年 5 月、估值 $1.1B 的 Series C；后来的 Cisco
              战略投资没有披露金额或估值条款。在价格发现已经过时、当前经营指标缺失的情况下，仅凭公开证据无法达到买入门槛。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV013
