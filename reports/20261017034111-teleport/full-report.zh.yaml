      - number: '3.2'
        title: 差异化来自控制平面广度与受监管工作负载适配
        blocks:
          - type: paragraph
            body: >-
              证据最充分的差异化，是在一层身份感知访问层下覆盖广泛场景。官方产品页面和开源仓库描述了覆盖 SSH、Kubernetes、数据库、Web 应用、云控制台、Windows 桌面及 MCP 或 AI agent
              访问的统一平面；公开评测则强调会话录制、可搜索审计、JIT 审批和面向合规的打包。买方若同时需要开发者易用性，以及多个基础设施协议上的治理，Teleport 最有优势。2026 年的 agent identity
              叙事和 Cisco 合作又把这一切延伸到 agentic 基础设施和渠道驱动的企业分发，战略方向比纯会话代理或网状网络更宽。
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP010
