              - CP009
              - CP010
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 买方想一次淘汰多个工具时，Teleport 最容易赢
            body: 证据最充分的竞争切入口是整合：一套身份感知平面，统一处理多个基础设施协议和身份类型上的访问、审批、录制与审计。连接工具或单协议竞品很难在一次采购中匹配这一点。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
          - type: callout
            title: 更窄的用例可能把交易导向更简单的替代方案
            body: >-
              Teleport 的平台广度也会制造摩擦。公开评测显示，连接需求更简单、数据库优先的访问痛点，或不愿承担 HA 与 RBAC 运维的买方，可能偏好
              Tailscale、StrongDM，或现有内部技术栈，而不是新建一个控制平面。
            calloutType: risk
