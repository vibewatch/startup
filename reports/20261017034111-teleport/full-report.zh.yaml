              Teleport 披露了一些商业代理指标，却没有披露投资人真正要评估的指标。公司称 2022 年 6 月拥有超过 200 个客户；2026 年宣传资料称超过 500
              家企业依赖该平台。这说明企业触达仍在延续，但属于公司宣传的使用信号，而非经审计的收入披露。产品打包也暗示其价值主张围绕合规、会话录制和最小权限基础设施访问，而不是原始计算消耗。理论上这可以支撑有吸引力的软件利润率，但同一批公开材料没有披露
              CAC、回本周期、赢单率、服务附加率和客户集中度。AWS Marketplace 增加了采购渠道，却没有揭示实际合同额、销售周期、Marketplace 经济性或渠道效率。
