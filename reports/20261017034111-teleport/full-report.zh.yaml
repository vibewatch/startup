            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: 入场纪律取决于更新后的财务证明
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明 Teleport 有风险资本支持、仍是私有公司且商业上认真，但不足以说明今天合理的入场价。现有资料支持 2022 年融资锚点、Cisco
              后续战略投资人信号，以及按用户和协议每年收费的历史定价模式；没有披露当前 ARR、NRR、毛利率、烧钱、现金跑道
              或股权结构条款。因此估值纪律必须依赖证据门槛，而不是假装精确：买方需要更新的私有指标或新的市场成交交易，才能把旧的独角兽估值视为当前估值。在此之前，合理做法是假定估值风险高于产品质量风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV011
              - CV012
      - number: '8.3'
        title: 情景框架与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              上行情景很直接：如果 Teleport 已将基础设施身份广度、企业客户参考和 Cisco
              渠道信号转化为显著更大的经常性收入，并保持可接受的留存和利润率，溢价结果仍可能成立。下行情景同样清楚：根据现有证据，Teleport
              部署的运营难度不低，可能给部分数据库工作负载增加延迟，对较小或更简单的环境也可能过度建设。这些特点很重要，因为它们即使在产品技术实力强时，也会缩窄买方范围并拖慢扩张。因此，决定性尽调问题是当前经济性、2022
              年之后的股权结构条款，以及 Cisco 是否已经把分发能力改变到足以重置估值支撑。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 哪些变化会改变判断
            body: 2022 年之后有定价的交易，或私有证据显示当前 ARR、留存、毛利率强劲且优先权层级条款有利，都可能把 Teleport 从“继续研究”推向“在合适价格投资”。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV011
              - CV012
          - type: callout
            title: 需要关注的主要下行风险
            body: 如果运营复杂度、部分工作负载对延迟的敏感性，或更简单的替代方案缩窄买方范围，下一轮融资可能把估值预期重置到过时的 2022 年锚点以下。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
