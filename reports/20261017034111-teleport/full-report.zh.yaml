  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这项建议源于产品相关性很强，但价格发现过时且当前经济数据缺失。
    data:
      nodes:
        - id: n1
          label: 广泛的基础设施身份范围
          detail: 一个控制平面覆盖 SSH、Kubernetes、数据库、应用、机器和代理。
          claimRefs:
            - CV004
        - id: n2
          label: AI / 代理身份叙事
          detail: 管理层正在明确把同一控制模型扩展到 AI 代理和工作负载。
          claimRefs:
            - CV005
        - id: n3
          label: 企业验证真实但不完整
          detail: 公开材料显示具名企业用户，但当前客户质量和规模尚未完全披露。
          claimRefs:
            - CV006
        - id: n4
          label: 最近定价估值已过时
          detail: 公开价格发现仍指向 2022 年 5 月、$1.1B 的 C 轮融资。
          claimRefs:
            - CV001
        - id: n5
          label: 当前经济数据仍未披露
          detail: 指定证据缺少 ARR、NRR、烧钱、毛利率和 Cisco 投资条款。
          claimRefs:
            - CV002
            - CV003
            - CV012
        - id: n6
          label: 建议：继续研究
          detail: 继续跟踪公司；在把过时的独角兽估值视为可投资依据前，要求最新私人财务证据。
          claimRefs:
            - CV011
            - CV012
            - CV013
      edges:
        - from: n1
          to: n2
          label: 延伸叙事
        - from: n2
          to: n3
          label: 需要商业验证
        - from: n3
          to: n4
          label: 碰到过时价格锚点
        - from: n4
          to: n5
          label: 造成估值不确定性
        - from: n5
          to: n6
          label: 推动等待证据的决策
    approximationNotes: 仅展示叙事流程；节点顺序表示决策逻辑，不代表加权概率或推断出的转化率。
