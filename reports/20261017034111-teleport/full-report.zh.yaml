chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Teleport 把自己定位为基础设施身份平台，而不是单点访问工具。当前对外叙事强调一层覆盖人、机器、工作负载和 AI agent 的加密身份层；官方产品文档则仍将平台扎根于证书颁发机构、代理和审计功能，覆盖
              SSH、RDP、HTTPS、Kubernetes
              及数据库访问。独立工具简介大体印证了这一架构和定位，因此品类叙事可信，尽管大多数规模说法仍来自公司。商业上，现有公开证据支持其私有、风险资本支持的身份，以及“开源核心加付费企业升级”模式，但没有新近公开收入、员工数或
              2022 年之后重新定价的估值。这些缺口很重要：后续章节必须把产品深度与可用于投资判断的经营披露区分开。
