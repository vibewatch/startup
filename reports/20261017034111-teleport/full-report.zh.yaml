      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Teleport 是一家真实的企业软件公司，拥有可信的变现面、当前产品广度和可支撑合同定价及多产品扩张的合规价值。缺的是把商业故事转成可供投资判断的模型所需的证据：公开层面没有当前收入或 ARR
              基础，没有毛利率披露，没有现金与烧钱桥接，没有实际成交价格数据，也没有 Cisco 2026
              年投资条款的公开解释。今天正确的投资判断不是“经济性差”，而是“经济性不足以判断”：下一步尽调应要求管理层披露，而不是继续修饰表格。
