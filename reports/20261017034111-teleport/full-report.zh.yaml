      - number: '2.2'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              保留证据中的买方主要是技术基础设施负责人及安全/合规利益相关方，而非普通员工 IT。官方产品材料反复点名工程团队、DevOps、SRE、平台工程、数据库运维和安全团队是实际用户；2025 年 2
              月的基础设施身份新闻稿也明确把 Teleport 面向工程管理的基础设施，与更广泛的 IT 员工工作流区分开来。这一区分决定预算归属：Teleport 更像共享的平台安全采购，而非通用 workforce IAM
              预算项。采用路径也很具体：Teleport 推销一个可替代或减少独立
              VPN、堡垒机、密钥管理和审计工作流的控制平面，因此当基础设施复杂度、特权访问监督或合规负担开始在多个工程团队和环境间制造摩擦时，采购紧迫性可能上升。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
