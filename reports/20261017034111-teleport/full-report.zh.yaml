              - CM007
              - CM008
              - CM011
              - CM012
      - number: '2.3'
        title: 规模估算视角、采用信号与约束
        blocks:
          - type: paragraph
            body: >-
              公开证据更能说明市场形态和可能的合同经济性，却不足以证明一个干净的独立 TAM。Teleport 自己在 2025 年 2 月称已有 500 多家公司采用平台，其中近一半员工数超过 1,000
              人；这是一项有用的采用信号，但仍是公司口径。Vendr 的 2026 年定价指南提供了预算视角：管理 100-500 个资源的买方，年合同额约为 $30,000-$150,000；部署 1,000+ 个资源时为
              $200,000-$500,000+；自托管最低价通常从每年 $50,000-$100,000
              起。这些数字说明单个账户可占据可观的企业钱包份额，但它们仍是定价基准，不是市值证据。同一来源也解释了为什么采用可能比自上而下 TAM
              幻灯片暗示的更慢：价格取决于部署方式、资源数量、功能层级、支持和合规附加项，带来范围界定摩擦，也要求证明 ROI。稳妥结论是，Teleport
              确实在一个有预算的控制平面市场销售，且有扩张空间；但就当前产品范围而言，公开保留证据仍不足以建立独立基准的 SAM 或 SOM。
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场机会真实存在，但公开 TAM 并不成立
            body: Teleport 似乎在一个有预算、企业级的控制平面中销售，单客户年合同额可观，也有多产品扩张路径；但保留的公开证据更能说明采用形态，仍不足以证明一个干净的第三方 TAM。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
          - type: callout
            title: 边界膨胀是投资判断风险
            body: Teleport 如今把“基础设施身份”扩展到人、机器、工作负载和 AI agent。投资人若把成熟的特权访问需求与尚未在保留证据中独立变现的早期身份邻近领域混在一起，就可能高估可触达市场。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围广是事实，不是营销修辞
        blocks:
          - type: paragraph
            body: >-
              Teleport 并不处在一个干净的单一品类中。保留的独立评测把它与 HashiCorp Boundary、StrongDM 放在直接访问平台竞品一侧，与 Tailscale 放在邻近的连接优先替代方案一侧，也与
              Britive、Apono、P0 Security 等新兴云身份和机器身份厂商并列。公开比较平台还显示，买方会把 Teleport 与传统 PAM
              套件一起列入候选；官方技术材料则清楚表明，现状替代方案仍是内部混合使用 VPN、堡垒机、共享凭证和按协议拆分的工具。因此 Teleport 通常胜负取决于买方想一次淘汰多少工具，而不只是某一张窄功能清单。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP012
              - CP013
              - CP014
