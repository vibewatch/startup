  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留下来的资料始终把 Teleport 放在具体的基础设施访问与身份控制市场，而不是宽泛、无差别的安全市场。2022 年 TechCrunch 将 Teleport 描述为基于身份的基础设施访问代理，覆盖
              SSH、HTTPS、RDP、数据库、Kubernetes 集群、内部 Web 应用和联网服务器；当前产品页面则把同一核心任务表述为零信任访问，以及面向人、机器、工作负载和 AI agent
              的统一身份层。因此，经济边界应先从特权基础设施访问开始，再向机器/工作负载身份和治理扩展。现状替代方案也不止一种竞品类别：Teleport 明确反对
              VPN、堡垒机、共享凭证、长期权限和割裂的访问工具。投资判断应先从 Teleport 今天确实能解决的控制平面问题估算 TAM，再把新的 AI agent
              和身份邻近叙事视为扩张潜力，而不是自动把所有邻近安全支出都算作可触达市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM012
              - CM013
              - CM014
