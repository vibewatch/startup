  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 证据支持的判断
      - 哪些变化会改变判断
    rows:
      - - 统一基础设施身份论点
        - Teleport 对外定位为覆盖用户、机器、工作负载和代理的一体化控制平面，这可能支撑比单纯 SSH 访问更大的安全预算。
        - 如果证据显示代理身份叙事没有转化为企业支出或持久留存，溢价逻辑就会被削弱。
      - - 企业验证论点
        - 公开材料和第三方引用指向已知企业用户及长期产品部署，因此公司并非只是概念阶段故事。
        - 如果具名账户只是历史引用，而非不断扩大的生产客户，商业分量就会下降。
      - - 估值反论点
        - 最近披露的定价估值仍停留在 2022 年 5 月，而 2026 年 Cisco 的战略投资没有披露价格或规模。
        - 新融资、二级市场估值或私人 KPI 资料，可能验证或重置这个过时的 2022 年锚点。
      - - 运营摩擦反论点
        - 独立评测称 Teleport 大规模运营可能较复杂，也可能不适合更简单的环境或对延迟敏感的数据库访问。
        - 如果能证明部署摩擦低于同业，或客户能大规模采用托管 / 云版本，这一担忧会减弱。
    notes: 这张表混合了公司发布的产品定位、第三方尽调和反向技术评论；它不是评分卡，财务披露缺失也让反论点仍然悬而未决。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 当前 ARR 增长、留存和毛利率明显强于公开证据所显示的水平，且 Cisco 显著改善分销。
        - 只有最新私人指标显示扩张持久、进入市场杠杆更强时，才有足够依据支持高于过时 2022 年锚点的溢价结果。
        - Cisco 信号未能变现；部署复杂度限制扩张；资本结构条款压低普通股上行空间。
        - 需要新的第一手证据：私人 KPI 资料包、董事会材料或定价交易。
      - - 基准
        - Teleport 在战略上很强，但财务表现只是稳健而非出众，当前经济数据仍持续不透明。
        - 公司值得继续跟踪，但应等到价格发现更新，或以相对过时预期的折扣价谈判进入。
        - 投资者相对当前增长水平支付过高；溢价叙事跑在变现证据之前。
        - 在管理层提供最新数据前，最适合继续研究。
      - - 悲观
        - 增长和留存放缓，Cisco 条款商业价值有限，买方则反感运营复杂度或更便宜的替代方案。
        - 如果下一次真实价格发现反映倍数压缩或执行拖累，相对 2022 年独角兽估值持平甚至下行的结果就有可能出现。
        - 目前还没有公开的下行估值标记，因此下行可能在下一轮融资或要约收购中突然显现。
        - 独立反向来源已指出运营负担、延迟敏感性和小团队适配性不足。
    notes: 由于指定证据没有披露当前 ARR、NRR、烧钱、毛利率或资本结构经济数据，情景逻辑只能定性。概率信号说明需要什么新证据，而不是估计百分比。
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
