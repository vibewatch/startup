  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              Teleport 的公开材料显示，商业模式从开源分发起步，延伸到付费企业功能和托管云，方向上符合面向工程与安全团队销售基础设施软件，而非纯服务业务。最清晰的当前变现证据是 AWS Marketplace 的云端
              listing：它按活跃用户计费，只有一个有合同支撑的定价维度，最低 25
              个用户，且没有公开的分层价格。这指向按席位计价的企业合同模式；如果活跃用户增长、续约和折扣情况稳定，扩张逻辑应较可预测。但公开证据仍未披露实际成交价格、云端与自托管收入结构，或支持与实施是否贡献了重要收入。
