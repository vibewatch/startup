  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 留存证据显示，市场边界分层向外扩展：从核心特权基础设施访问，延伸至更广的基础设施身份邻接领域。
    data:
      items:
        - label: 核心 SSH 与 Kubernetes 访问
          detail: TechCrunch、网络研讨会和功能页面反复提到的核心访问控制
        - label: 数据库与内部 Web 应用
          detail: 将控制平面扩展到更多高价值基础设施资源
        - label: 云控制台与更广资源清单
          detail: 在同一身份平面中加入云控制台和多环境治理
        - label: 合规与会话治理工作流
          detail: 覆盖审计、受控会话、访问请求和受监管采购场景
        - label: 机器与工作负载身份
          detail: 将支出从人工访问扩展到 CI/CD、服务和自动化身份
        - label: AI 代理与 MCP 服务器
          detail: 最新的邻接方向；营销表达清晰，但留存的变现证据仍然薄弱
    approximationNotes: 这是边界金字塔，而不是数值 TAM 堆栈，因为留存来源没有提供独立公开数据集，无法对 Teleport 的 TAM、SAM 和 SOM 做出有依据的计算。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM012
      - CM013
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 1-5 级坐标轴仅依据留存公开证据：X 轴表示治理深度，Y 轴表示协议 / 工作场景广度。
    xAxis:
      label: 治理深度（1=仅连接，5=原生身份策略 + 审计）
      min: 1
      max: 5
      lowLabel: connectivity
      highLabel: governed access
    yAxis:
      label: 协议与工作场景广度（1=狭窄，5=多协议基础设施）
      min: 1
      max: 5
      lowLabel: narrow
      highLabel: broad
    data:
      points:
        - label: Teleport
          x: 5
          'y': 5
          detail: 留存证据覆盖面最广：SSH、Kubernetes、数据库、应用、云和带审计及 JIT 工作流的 AI 代理身份。
          claimRefs:
            - CP001
            - CP008
            - CP009
        - label: Boundary
          x: 4
          'y': 2
          detail: 以身份和治理为核心，但留存评测认为它覆盖面更窄，更偏会话代理。
          claimRefs:
            - CP005
        - label: StrongDM
          x: 4
          'y': 3
          detail: 商业上的直接同业，数据库协议支持更广，但没有 Teleport 的开源切入路径。
          claimRefs:
            - CP007
        - label: Tailscale
          x: 2
          'y': 2
          detail: 更简单的加密连接替代方案；留存评测指出它缺少会话录制和细粒度 RBAC。
          claimRefs:
            - CP006
        - label: VPN + 堡垒机
          x: 1
          'y': 1
          detail: 留存技术材料将其视为基线：广泛的网络信任、长期凭证，以及连接后的可见性薄弱。
          claimRefs:
            - CP002
        - label: 内部自建
          x: 2
          'y': 3
          detail: 通过多种工具可以覆盖许多协议，但治理、审计和运营负担仍分散在整个技术栈中。
          claimRefs:
            - CP002
            - CP010
    approximationNotes: 分数是基于留存证据的序数综合，不是测量得出的基准或市场份额数值。
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP006
      - CP007
      - CP009
      - CP010
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据显示，Teleport 以按席位的云合同模式承接更广泛的企业平台叙事，但实际定价和毛利转化率尚未披露。
    data:
      nodes:
        - id: n1
          label: 基础设施访问买方
          note: 安全和平台团队购买 Teleport，以统一基础设施中的访问、身份和审计。
        - id: n2
          label: 产品范围
          note: 官方页面将服务器、数据库、Kubernetes、内部应用、云和 AI 代理定位在同一平台上。
        - id: n3
          label: 商业包装
          note: 2022 年材料描述了开源分发、企业功能以及托管云服务。
        - id: n4
          label: 云计费单位
          value: 25
          unit: minimum active users
          note: AWS Marketplace 按活跃人工用户为云版本计费，最低 25 个用户。
        - id: n5
          label: 公开成本提示
          note: 可能还会产生额外 AWS 基础设施成本，且 Marketplace 列表不包含支持服务。
        - id: n6
          label: 毛利转化
          note: 实际 ASP、折扣、收入组合、毛利率和服务附加率均未公开披露。
      edges:
        - from: n1
          to: n2
          label: 需要跨环境安全访问
        - from: n2
          to: n3
          label: 打包成付费产品
        - from: n3
          to: n4
          label: 云版本按席位变现
        - from: n4
          to: n5
          label: 列表计费机制包含额外成本提示
        - from: n5
          to: n6
          label: 利润率结果仍未披露
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Teleport 将身份签发、访问中介、协议服务和审计输出叠加到一个基础设施访问控制平面上。
    data:
      layers:
        - label: 用户与非人工身份
          detail: 人员用户、机器、工作负载和 AI 代理从不同身份类型出发，但都会进入同一访问系统。
          modules:
            - label: 工程师与管理员
            - label: 机器与 CI/CD 工作负载
            - label: 通过 MCP 客户端接入的 AI 代理
        - label: 身份与审批
          detail: SSO 和审批工作流会核验请求者身份，以及是否应授予提升后的访问权限。
          modules:
            - label: Okta / Entra / GitHub 式 SSO
            - label: Slack、Jira、PagerDuty 审批钩子
        - label: 身份验证与策略服务
          detail: Auth Service 签发短期证书，并执行 RBAC 或访问请求策略。
          outputs:
            - label: User and resource certificates
            - label: Role and access-request decisions
        - label: 代理与访问平面
          detail: Proxy Service 位于集群前端并中介连接，无需广泛的 VPN 网络信任。
          outputs:
            - label: Public gateway
            - label: Reverse-tunnel / VNet routing
        - label: 受保护资源服务
          detail: 协议专用代理在同一身份平面后方暴露基础设施资源。
          modules:
            - label: 服务器、数据库与 Kubernetes
            - label: Web 应用、云控制台、桌面与 MCP 服务器
        - label: 审计与自动化输出
          detail: 录制的会话和机器身份流让访问可复核，也可复用于自动化。
          outputs:
            - label: Session recording and audit export
            - label: tbot / Machine ID automation paths
    approximationNotes: 这张图综合官方文档、网络研讨会材料和独立技术深度分析绘制，并非厂商的原始架构图。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据表明，Teleport 通常从访问现代化痛点切入，随后扩展到更多协议和身份，最后在传统 PAM 与 AWS 原生替代方案之间面临买方适配检查点。
    data:
      items:
        - label: 认识到访问蔓延
          actor: 安全或平台负责人
          stage: 问题识别
          channels:
            - 官方定位
            - 评测来源
          touchpoints:
            - 替代 VPN、堡垒机和共享凭证
            - 需要一条覆盖基础设施访问的审计轨迹
        - label: 从 SSH 和核心基础设施访问切入
          actor: DevOps、SRE 与平台工程师
          stage: 初始切入点
          channels:
            - 网络研讨会 / 演示
            - 开源评估
          touchpoints:
            - 替代堡垒机
            - 短期证书与 SSO
        - label: 扩展到更多协议
          actor: 同一批工程团队加安全团队
          stage: 协议扩展
          channels:
            - 技术评估
            - 架构部署
          touchpoints:
            - 增加 Kubernetes 和数据库访问
            - 用一套策略模型统一工程师和机器
        - label: 增加机器身份与工作流治理
          actor: 平台自动化与合规负责人
          stage: 工作流扩展
          channels:
            - 机器身份网络研讨会
            - 访问请求工作流
          touchpoints:
            - CI/CD 与工作负载身份
            - 审批、会话录制和审计可见性
        - label: 赢得受监管用例
          actor: 重视合规的买方
          stage: 高摩擦采购
          channels:
            - FedRAMP 材料
            - 客户证言
          touchpoints:
            - FIPS 端点与持续监控证据
            - 内部基础设施访问控制证明
        - label: 面临买方适配检查点
          actor: 架构与采购评审
          stage: 续约 / 扩张关口
          channels:
            - 独立比较
            - 技术尽调
          touchpoints:
            - 以保管库为核心的部分买方，可能更适合传统 PAM 龙头
            - 已经满意 SSM 的 AWS 原生团队，感受到的增量价值可能更小
    approximationNotes: 这张旅程图综合产品定位、客户证言和独立比较来源，反映可能的采用顺序，而非已披露的带转化率漏斗。
    claimRefs:
      - CU001
      - CU008
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
