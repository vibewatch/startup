      - number: '3.3'
        title: 开源入口有帮助，但运营并付费使用平台确实存在取舍
        blocks:
          - type: paragraph
            body: >-
              Teleport
              的打包方式提供了传统套件往往没有的切入口：免费社区版、公布的企业版起点和托管云路径。这降低了工程主导买方的评估摩擦，也比纯托管竞争对手提供更顺畅的升级路径。相同证据也说明这一优势并非绝对。公开评测指出，HA
              学习曲线真实存在，企业席位成本会随规模上升，数据库成熟度弱于 SSH 和 Kubernetes 叙事。在竞争中，若实际需求只是安全连接，Tailscale
              可能胜出；如果买方从托管数据库访问出发，而非更宽的基础设施身份议题，StrongDM 可能胜出。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
      - number: '3.4'
        title: 耐久性中等：足够宽才有意义，但并不免受品类压力
        blocks:
          - type: paragraph
            body: >-
              Teleport
              的护城河不只是开源，而是广度、短时证书、可审计性，以及覆盖人和非人访问的单一控制平面。这有价值，但保留资料没有通过公开赢单率、流失或多重使用数据证明锁定效应。耐久性主要来自架构：替代多个割裂系统，比替代一个
              VPN 或一个代理更难被撬走。压力来自两侧：传统 PAM 厂商仍出现在买方候选名单中，邻近身份厂商也能蚕食更窄的用例。因此 Teleport
              在复杂、受监管环境中看起来较耐用，但买方只需要问题的一小部分时，它更容易受到攻击。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
