      - number: '4.3'
        title: 资本充足性与融资可见度
        blocks:
          - type: paragraph
            body: >-
              资本故事比产品故事透明度低很多。最近一轮完整披露且定价明确的融资仍是 2022 年 5 月 Series C：Teleport 在 2022 年网络研讨会中称刚融资 $110M，NHI Governance
              记录该轮估值为 $1.1B，当时累计融资额为 $169M。此后最新的公开变化是 Cisco 于 2026 年 8
              月进行战略投资并建立合作，但公开来源没有披露金额、工具、估值影响或其他条款。因此投资人没有足够输入判断当前现金、月度烧钱、资金 现金跑道、债务能力或下一轮融资可能的触发点。公开二级市场信息也没有填补缺口：抓取的
              Nasdaq Private Market 公司页面提供中介和监管披露，却没有 Teleport 的交易定价或发行人财务报表。历史融资额不能作为当前可用现金的代理。
