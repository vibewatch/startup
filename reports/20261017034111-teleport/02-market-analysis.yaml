schemaVersion: "report-v2"
artifact: market-analysis
slug: teleport
runDate: 2026-10-17
company:
  name: Teleport
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Retained evidence supports a defined but still expanding market around infrastructure
    access control and identity, centered on securing SSH, Kubernetes, databases,
    internal apps, and adjacent machine identities rather than a generic "all of
    cybersecurity" TAM. Public sources provide useful budget and adoption lenses, but
    they do not isolate a third-party TAM/SAM/SOM for Teleport's current control-plane
    scope, which keeps market-upside claims more directional than precision-grade.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Teleport's retained sources consistently place it in a specific infrastructure
      access and identity-control market, not in a broad undifferentiated security
      bucket. The 2022 TechCrunch profile described Teleport as an identity-based
      infrastructure access proxy spanning SSH, HTTPS, RDP, databases, Kubernetes
      clusters, internal web applications, and networked servers, while current product
      pages frame the same core job as zero-trust access and a unified identity layer
      for humans, machines, workloads, and AI agents. That combination implies the
      economic boundary starts with privileged infrastructure access and then expands
      outward into machine/workload identity and governance. It also means the status-quo
      substitutes are not just one competitor category: Teleport explicitly argues
      against VPNs, bastion hosts, shared credentials, standing privileges, and siloed
      access tools. For underwriting, the key point is that TAM discipline should begin
      with the control-plane problems Teleport demonstrably solves today, then treat
      newer AI-agent and identity-adjacent language as expansion potential rather than
      automatically assuming all adjacent security spend is addressable.
    claimRefs: [CM001, CM002, CM003, CM007, CM012, CM013, CM014]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: buyers-budgets
    title: Buyers, users, and budget ownership
    body: >-
      The buyer map in retained evidence clusters around technical infrastructure owners
      and security/compliance stakeholders rather than general employee IT. Official
      product materials repeatedly name engineering teams, DevOps, SRE, platform
      engineering, database operators, and security teams as the operating users, while
      the February 2025 infrastructure-identity press release explicitly distinguishes
      Teleport's focus on engineering-managed infrastructure from broader IT employee
      workflows. That distinction matters because it shapes budget ownership: Teleport
      looks more like a shared platform-security purchase than a generic workforce-IAM
      line item. The adoption path is also operationally concrete. Teleport pitches one
      control plane that can replace or reduce separate VPN, bastion, key-management,
      and audit workflows, which means purchase urgency likely rises when infrastructure
      complexity, privileged-access oversight, or compliance burden starts creating
      friction across multiple engineering teams and environments.
    claimRefs: [CM005, CM006, CM007, CM008, CM011, CM012]
    tableRefs: [TM003]
  - id: sizing-lenses
    title: Sizing lenses, adoption signals, and constraints
    body: >-
      Public evidence is better at showing market shape and likely contract economics
      than at proving a clean standalone TAM. Teleport's own February 2025 release said
      more than 500 companies had adopted the platform and that almost half of those
      customers were companies with more than 1,000 employees, which is a useful adoption
      signal but still company-issued. Vendr's 2026 pricing guide adds a budget lens:
      it cites annual contract ranges from roughly $30,000-$150,000 for buyers managing
      100-500 resources and $200,000-$500,000+ for 1,000+ resource deployments, plus
      self-hosted minimums that often start at $50,000-$100,000 annually. Those figures
      suggest meaningful enterprise wallet share per account, but they remain pricing
      benchmarks rather than market-capitalization evidence. Just as important, the
      same source shows why adoption can be slower than a top-down TAM slide implies:
      pricing depends on deployment model, resource counts, feature tiers, support, and
      compliance add-ons, which creates scoping friction and emphasizes proof-of-ROI.
      The clean conclusion is that Teleport appears to sell into a real, budgeted control
      plane with expansion room, but publicly retained evidence still falls short of an
      independently benchmarked SAM or SOM for the current product footprint.
    claimRefs: [CM004, CM008, CM009, CM010, CM011, CM013, CM014]
    tableRefs: [TM002]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Infrastructure access control plane
        - SSH, Kubernetes, database, internal app, and cloud-console access with audit and session controls
        - Broad endpoint, SIEM, and general cyber budgets not directly evidenced in retained sources
        - Platform engineering and security share evaluation and budget
        - Core current scope repeated across product, webinar, and press coverage
      - - Machine and workload identity
        - Service accounts, CI/CD, microservices, and machine certificates under the same identity layer
        - General secrets-management or broader identity-governance spend outside Teleport-evidenced workflows
        - Platform engineering with security architecture oversight
        - Expands wallet share beyond human privileged access
      - - Compliance-oriented privileged access
        - Audit logs, session recording, moderated sessions, JIT access, and FedRAMP or SOC 2 support
        - Broad GRC tooling or non-infrastructure compliance software
        - Security, compliance, and infrastructure leaders
        - Important for regulated enterprises and audit-driven deals
      - - AI agent and MCP access
        - AI agents, LLMs, and MCP servers treated as first-class identities on the platform
        - Horizontal AI application spend not tied to infrastructure access controls
        - Innovation, platform, and security teams
        - A current adjacency narrative, but monetization evidence remains limited
    notes: >-
      Included and excluded spend are evidence-constrained boundary judgments derived
      from retained product positioning, not an exhaustive taxonomy of all cybersecurity
      categories Teleport could someday touch.
    claimRefs: [CM001, CM002, CM003, CM006, CM008, CM013, CM014]
