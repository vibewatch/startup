  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-lens
      missingEvidence: An independent third-party TAM, SAM, or SOM dataset specific to privileged infrastructure access or infrastructure identity that matches Teleport's current product scope.
      whyItMatters: Without a scope-matched external market benchmark, valuation work can overstate upside by importing broader IAM or cybersecurity categories that Teleport has not yet proven it monetizes.
      diligencePath: Request management's internal market model, third-party analyst slices, and cohort win-rate data segmented by core access control versus newer machine-identity and AI-agent use cases.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: expansion-adjacency
      missingEvidence: Revenue mix or pipeline data showing how much demand comes from core access control versus newer machine-identity and AI-agent modules.
      whyItMatters: The current messaging broadens the addressable narrative, but without commercial mix data it is hard to judge whether the newer adjacencies are valuation-relevant today or mostly strategic positioning.
      diligencePath: Ask for ARR by module, attach rates for machine-identity products, and win stories where AI-agent or workload identity changed deal size or closed a net-new budget.
      relatedQuestionRefs: [QM008]
