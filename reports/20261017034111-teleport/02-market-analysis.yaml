        - null
        - Company-stated installed-base snapshot
        - medium
        - Useful adoption signal, but not independent TAM/SAM evidence
      - - Vendr pricing guide
        - 2026
        - Unspecified / buyer benchmark
        - $30k-$150k annual contracts for 100-500 resources
        - null
        - Observed transaction benchmark for mid-sized deployments
        - medium
        - Directional contract-value lens, not total market size
      - - Vendr pricing guide
        - 2026
        - Unspecified / buyer benchmark
        - $200k-$500k+ annual contracts for 1,000+ resources
        - null
        - Observed transaction benchmark for larger deployments
        - medium
        - Spend range depends on deployment model, features, and discounts
      - - Vendr pricing guide
        - 2026
        - Unspecified / buyer benchmark
        - $50k-$100k annual starting point for smaller self-hosted deployments
        - null
        - Entry-price lens for self-hosted enterprise usage
