    notes: >-
      Publicly retained sources do not provide a credible third-party TAM, SAM, or SOM
      for Teleport's current control-plane scope, so this exhibit uses adoption and ACV
      lenses instead of inventing a synthetic market-size stack.
    claimRefs: [CM004, CM009, CM010, CM011, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Platform engineering organizations
        - Platform or infrastructure leader
        - DevOps, SRE, and engineers
        - Shared platform and security budget
        - Unify access to servers, Kubernetes, databases, and apps
        - Platform engineering with security sign-off
        - Access sprawl, onboarding friction, and multi-environment complexity
      - - Security and compliance teams
        - Security architect or IAM lead
        - Security operations and compliance practitioners
        - Security budget
        - Enforce least privilege, audit, and session governance
        - Security or compliance leadership
        - Audit readiness, privileged-access controls, and policy standardization
      - - Regulated or hybrid enterprises
        - Infrastructure security or operations executive
        - Administrators and engineering managers
        - Security, operations, or transformation budget
        - Replace bastions or VPN-heavy workflows with one governed control plane
        - Cross-functional infra and security committee
        - FedRAMP, SOC 2, stock-exchange, or similar oversight demands
      - - Machine-identity and AI-heavy teams
        - Platform or innovation lead
        - Automation, service owners, and AI teams
        - Platform or innovation budget with security review
        - Extend the same identity layer to workloads, agents, and MCP servers
        - Platform team
        - Growth in non-human identities or agentic automation
    notes: >-
      Buyer and payer roles are inferred from repeated audience, workflow, and compliance
      language in retained sources; public evidence does not disclose a single universal
      budget owner across all customer segments.
    claimRefs: [CM005, CM006, CM007, CM008, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Retained evidence shows a layered market boundary that expands outward from core
      privileged infrastructure access into broader infrastructure identity adjacencies.
    data:
      items:
        - label: Core SSH and Kubernetes access
          detail: Current access-control nucleus repeated across TechCrunch, webinar, and feature pages
        - label: Databases and internal web applications
          detail: Expands the control plane into additional high-value infrastructure resources
        - label: Cloud consoles and broader resource inventory
          detail: Adds cloud-console and multi-environment governance to the same identity plane
        - label: Compliance and session-governance workflows
          detail: Captures audit, moderated sessions, access requests, and regulated-buying use cases
        - label: Machine and workload identity
          detail: Extends spend beyond human access into CI/CD, services, and automation identities
        - label: AI agents and MCP servers
          detail: Newest adjacency; clearly marketed, but retained monetization evidence remains thin
    approximationNotes: >-
      This is a boundary pyramid rather than a numeric TAM stack because retained sources
      do not provide an independent public dataset that supports a defensible Teleport
      TAM, SAM, and SOM calculation.
    claimRefs: [CM001, CM003, CM004, CM012, CM013, CM014]
callouts:
  - calloutType: insight
    title: Market opportunity is real, but the public TAM is not
    body: >-
      Teleport appears to sell into a budgeted, enterprise-grade control plane with
      meaningful ACVs and multi-product expansion paths, yet retained public evidence is
      still better at showing adoption shape than at proving a clean third-party TAM.
    claimRefs: [CM009, CM010, CM013, CM014]
  - calloutType: risk
    title: Boundary inflation is an underwriting risk
    body: >-
      Because Teleport now markets "infrastructure identity" across humans, machines,
      workloads, and AI agents, investors can overstate addressable market by blending
      mature privileged-access demand with earlier-stage identity adjacencies that are
      not yet independently monetized in retained evidence.
    claimRefs: [CM003, CM004, CM013, CM014]
