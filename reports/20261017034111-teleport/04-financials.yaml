schemaVersion: report-v2
artifact: financials
slug: teleport
runDate: 2026-10-17
company:
  name: Teleport
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports an enterprise infrastructure-software monetization model:
    Teleport combines open-source distribution with paid enterprise and managed-cloud
    offerings, and its AWS Marketplace cloud listing bills by active user with a
    25-user floor. Underwriting still stops short of a true financial view because
    current revenue, ARR, gross margin, burn, runway, and the size and terms of
    Cisco's 2026 strategic investment are not publicly disclosed.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing mechanics
    body: >-
      Teleport's public materials show a commercial model that starts with open-source
      distribution and extends into paid enterprise features plus a managed cloud
      offering, which is directionally consistent with infrastructure software sold
      into engineering and security teams rather than a pure services business.
      The clearest current monetization evidence is the AWS Marketplace cloud listing:
      it sells a single contract-backed pricing dimension billed by active users, with
      a 25-user minimum and no public tier ladder. That points to a seat-based
      enterprise contract motion with predictable expansion logic if active-user growth,
      renewal, and discounting hold up, but public evidence still does not disclose
      realized pricing, cloud versus self-hosted revenue mix, or whether support and
      implementation are meaningful revenue contributors.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-proxies-and-traction
    title: GTM proxies, traction, and delivery economics
    body: >-
      Teleport discloses useful commercial proxies without exposing the metrics that
      investors actually underwrite. In June 2022 the company said it had over 200
      customers, and a 2026 promotional profile said more than 500 enterprises rely
      on the platform; that suggests continued enterprise reach, but those figures are
      company-promotional usage signals rather than audited revenue disclosures. The
      product packaging also implies a value proposition built around compliance,
      session recording, and least-privileged infrastructure access rather than raw
      compute consumption. That can support attractive software margins in principle,
      yet the same public materials leave CAC, payback, win rates, services attach,
      and customer concentration undisclosed. AWS Marketplace establishes an
      additional procurement channel, but it does not reveal realized contract
      values, sales-cycle length, marketplace economics, or channel efficiency.
    claimRefs: [CI006, CI007, CI008, CI009, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-funding-visibility
    title: Capital adequacy and funding visibility
    body: >-
      The capital story is materially less transparent than the product story. The
      last fully disclosed priced round still appears to be the May 2022 Series C:
      Teleport said in its 2022 webinar that it had just raised $110 million, and
      NHI Governance records that round at a $1.1 billion valuation with stated total
      funding of $169 million as of that time. Since then, the freshest public change
      is Cisco's August 2026 strategic investment and partnership, but public sources
      do not disclose the amount, instrument, valuation impact, or other terms. That
      leaves investors without the inputs needed to size current cash on hand, monthly
      burn, runway, debt capacity, or the likely trigger for a next financing. Public
      secondary-market visibility does not close the gap: the fetched Nasdaq Private
      Market company page supplies intermediary and regulatory disclosures but no
      Teleport transaction pricing or issuer financial statements. Funding raised
      historically is therefore not a proxy for cash currently available.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI016]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Financially, Teleport looks like a real enterprise software business with a
      credible monetization surface, current product breadth, and compliance-oriented
      value that can justify contract pricing and multi-product expansion. What is
      missing is the evidence needed to turn that commercial story into an
      underwritable model: there is no public current revenue or ARR base, no gross
      margin disclosure, no cash-and-burn bridge, no realized pricing data, and no
      public explanation of Cisco's 2026 investment terms. The right investment read
      today is not "bad economics" so much as "insufficient economics": the next
      diligence step is management disclosure, not spreadsheet refinement.
    claimRefs: [CI001, CI003, CI005, CI007, CI012, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Open-source to paid conversion, Open-source distribution with paid enterprise features, Community to enterprise account, Publicly evidenced; conversion rates undisclosed, Medium, Request conversion by cohort and self-hosted versus paid attach]
      - [Managed cloud offering, Contract subscription for the cloud version, Active human user, AWS Marketplace lists a single active-user pricing dimension with a 25-user floor, Medium, Request ACV by cohort and cloud revenue share]
      - [Compliance and audit value capture, Pricing appears tied to reducing access-control and audit friction, Platform contract, Value proposition is public but module attach and realized pricing are not, Low, Request module-level attach and renewal drivers]
      - [Support and implementation, Support is excluded from the AWS listing and separate services economics are not public, Unknown, Possible revenue and cost center but not quantified, Low, Request services revenue mix and onboarding labor intensity]
    notes: >-
      Public sources support the existence of these monetization paths, but they do
      not disclose realized ASPs, revenue mix, or whether services/support are
      material contributors; null-like statements reflect unavailable public data.
    claimRefs: [CI001, CI002, CI003, CI005, CI008]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [Cloud version billed by active user under contract, List mechanics are public; realized net price is not, Discounts renewal uplift and minimum contract value are not public, AWS Marketplace]
      - [25-user minimum with no separate public tier ladder, List floor is public; realized seat count per deal is not, Expansion seats overage logic and enterprise exceptions are not public, AWS Marketplace]
      - [Two-week free cloud trial with no credit card required, Entry motion is public; conversion economics are not, Free-to-paid conversion assisted-sales touch and trial-to-contract timing are not public, Teleport webinar]
      - [Additional AWS infrastructure costs may apply and support is excluded from the listing, Public cost caveat only; margin impact is not disclosed, Hosting burden support attach and gross-margin effect are not public, AWS Marketplace]
    notes: >-
      This table captures list mechanics and onboarding hooks, not realized customer
      pricing. Public evidence does not disclose negotiated discounts, minimum annual
      contract values, or renewal economics.
    claimRefs: [CI002, CI003, CI004, CI005]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Current ARR / revenue, null, Low, Current topline is required to judge growth and revenue quality, Request monthly recurring revenue ARR GAAP revenue and growth by segment]
      - [Gross margin, null, Low, Margin determines whether the compliance-heavy deployment motion still scales like software, Request gross margin by cloud self-hosted and services components]
      - [CAC payback / sales efficiency, null, Low, Enterprise seat pricing does not prove efficient acquisition or expansion, Request CAC payback S&M spend sales cycle and win-rate data]
      - ['Customer scale proxy', '200+ customers in 2022; 500+ enterprises in 2026 promotional profile', Medium, Indicates commercial reach but not monetization quality or concentration, Request current customer count definitions concentration and NRR]
      - ['Public pricing proxy', 'Active-user cloud contract with 25-user minimum', Medium, Suggests enterprise floor pricing and seat-expansion logic, Request realized ASP discounting and renewal uplift]
      - ['Cash runway / capital adequacy', null, Low, Without cash burn and financing terms investors cannot size dependency on the next round, Request cash balance burn runway debt covenants and Cisco investment terms]
    notes: >-
      Null values mark metrics that remain private. Public sources provide only proxy
      indicators such as seat-based list mechanics and company-promotional customer
      counts, not underwriter-grade unit-economics disclosure.
    claimRefs: [CI003, CI006, CI007, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a seat-based cloud contract motion layered onto a broader
      enterprise platform story, but realized pricing and gross-profit conversion are
      not disclosed.
    data:
      nodes:
        - id: n1
          label: Infrastructure access buyer
          note: Security and platform teams buy Teleport to unify access, identity, and audit across infrastructure.
        - id: n2
          label: Product scope
          note: Official pages position one platform across servers, databases, Kubernetes, internal apps, cloud, and AI agents.
        - id: n3
          label: Commercial packaging
          note: 2022 materials describe open-source distribution plus enterprise features and a managed cloud offering.
        - id: n4
          label: Cloud billing unit
          value: 25
          unit: minimum active users
          note: AWS Marketplace bills the cloud version by active human user with a 25-user minimum.
        - id: n5
          label: Public cost caveat
          note: Additional AWS infrastructure costs may apply, and support is not included in the marketplace listing.
        - id: n6
          label: Gross profit conversion
          note: Realized ASP, discounts, revenue mix, gross margin, and services attach are not publicly disclosed.
      edges:
        - from: n1
          to: n2
          label: needs secure access across environments
        - from: n2
          to: n3
          label: packaged into paid offerings
        - from: n3
          to: n4
          label: cloud version monetized by seat
        - from: n4
          to: n5
          label: list mechanics include extra cost caveats
        - from: n5
          to: n6
          label: margin outcome remains undisclosed
    claimRefs: [CI001, CI002, CI003, CI005, CI008, CI014]
callouts:
  - calloutType: strength
    title: Enterprise-style pricing exists
    body: >-
      Teleport is not relying on vague future monetization: public sources already
      show a paid cloud contract billed by active user with a 25-seat floor, layered
      onto enterprise features and managed cloud packaging.
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Capital adequacy is still not underwritable
    body: >-
      The last fully disclosed priced round remains the 2022 Series C, while Cisco's
      2026 strategic investment lacks public amount and term disclosure, leaving cash,
      burn, runway, and next-round timing effectively opaque.
    claimRefs: [CI011, CI012, CI013, CI014]
