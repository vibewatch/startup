company:
  name: "Teleport"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Teleport remains a private, Oakland-headquartered infrastructure identity vendor whose
    public materials now center on certificate-based access control for infrastructure and the
    extension of that identity model to AI agents. The company still anchors public financing
    on a 2022 $110M Series C at a $1.1B valuation, while 2025-2026 company statements show
    adoption momentum and strategic Cisco backing but leave board structure, current headcount,
    and independently verified customer scale unresolved.
sections:
  - id: "identity-and-stage"
    title: "Identity, product scope, and current stage"
    body: |-
      Teleport presents itself as an infrastructure identity platform rather than a point access tool. Its current messaging emphasizes one cryptographic identity layer spanning humans, machines, workloads, and AI agents, while official product documentation still roots the platform in certificate authority, proxy, and audit functions across SSH, RDP, HTTPS, Kubernetes, and database access. Independent tool profiles broadly corroborate that architecture and positioning, which makes the category story credible even if most scale claims remain company-originated. Commercially, the assigned public evidence supports a private, venture-backed status with an open-source core plus paid enterprise upsell, but it does not expose fresh public revenue, headcount, or a post-2022 priced valuation reset. Those omissions matter because later chapters will need to distinguish product depth from underwriting-quality operating disclosure.
    claimRefs: ["CO001", "CO002", "CO007", "CO008", "CO013", "CO015", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership continuity, governance visibility, and key-person dependence"
    body: |-
      The public record in the assigned pool still points to founder continuity: Ev Kontsevoy remains the visible executive voice, while Alexander Klizhentas and Taylor Wakefield continue to appear as the technical and operating co-founders in third-party profiles. That continuity helps later chapters reuse a stable founder-market-fit narrative, but governance visibility is thin. Public sources identify Teleport as independent and venture-backed, yet they do not provide current board composition, voting control, liquidation preferences, or ownership concentration beyond named investors and the disclosed Cisco strategic investment. As a result, the real key-person dependence is less about whether the founders are still present and more about how much of the category narrative, investor signaling, and product-market translation continues to route through a small founding team—especially Kontsevoy as category evangelist and quoted spokesperson.
    claimRefs: ["CO004", "CO005", "CO006", "CO007", "CO010"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-scale-and-milestones"
    title: "Funding history, scale signals, and milestone path"
    body: |-
      Teleport's public financing chronology is unusually clear through 2022 and increasingly opaque afterward. Assigned sources support a conventional venture path from a 2019 Series A and 2021 Series B into a $110M Series C at a $1.1B valuation in May 2022, with total disclosed funding reaching $169M at that point. Later milestone evidence shifts from priced-round disclosure toward company-led category building: a February 2025 Infrastructure Identity launch narrative, a July 2026 agentic-identity push, and an August 2026 Cisco strategic investment whose amount was not disclosed. Scale signals point in the same direction. Management said there were 200+ customers in June 2022, then claimed 500+ adopting companies in February 2025, but neither number is independently verified in the assigned pool. That pattern suggests product and distribution momentum, but not enough transparent operating disclosure to treat current scale, customer count, or commercial efficiency as settled ground truth.
    claimRefs: ["CO008", "CO009", "CO010", "CO011", "CO012", "CO013", "CO014", "CO015", "CO016", "CO017"]
    figureRefs: ["FO001"]
