company:
  name: "Teleport"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Teleport competes across a broader surface than a standard PAM vendor: direct access-platform peers
    like Boundary and StrongDM, adjacent substitutes like Tailscale, newer machine-identity entrants,
    and the status-quo mix of VPNs, bastions, and internal build. Its edge is product breadth and a
    unified identity-and-audit plane across human, machine, and AI-agent access, but public evidence
    also shows meaningful friction in HA operations, database maturity, and enterprise-seat economics.
sections:
  - id: "landscape"
    title: "Landscape breadth is a competitive fact, not a marketing flourish"
    body: >-
      Teleport is not selling into a single clean category. The retained independent review set places
      it beside HashiCorp Boundary and StrongDM as direct access-platform peers, beside Tailscale as an
      adjacent connectivity-first substitute, and beside newer cloud- and machine-identity entrants such
      as Britive, Apono, and P0 Security. Public comparison hubs also show buyers shortlisting Teleport
      against legacy PAM suites, while official technical material makes clear that the status quo
      alternative is still an internal mix of VPNs, bastions, shared credentials, and per-protocol
      tooling. That means Teleport usually wins or loses on how many tools a buyer wants to retire at
      once, not on one narrow feature checklist alone.
    claimRefs: ["CP002", "CP005", "CP006", "CP007", "CP012", "CP013", "CP014"]
    tableRefs: ["TP001"]
  - id: "differentiation"
    title: "Differentiation comes from control-plane breadth and regulated-workload fit"
    body: >-
      The strongest evidence-backed differentiator is breadth under one identity-aware access layer.
      Official product surfaces and the open-source repository describe one plane for SSH, Kubernetes,
      databases, web apps, cloud consoles, Windows desktops, and MCP or AI-agent access, while public
      reviews emphasize session recording, searchable audit, JIT approvals, and compliance-sensitive
      packaging. That makes Teleport strongest when the buyer needs both developer usability and
      governance across multiple infrastructure protocols. The 2026 agent-identity narrative and Cisco
      partnership extend that wedge further into agentic infrastructure and channel-led enterprise
      distribution, which is a broader strategic direction than a pure session broker or mesh network.
    claimRefs: ["CP001", "CP008", "CP009", "CP010"]
    tableRefs: ["TP002"]
  - id: "pricing-and-switching"
    title: "Open-source entry helps, but operating and paying for the platform is a real tradeoff"
    body: >-
      Teleport's packaging gives it a practical wedge that legacy suites often lack: a free community
      edition, a published enterprise starting point, and a managed cloud path. That lowers evaluation
      friction for engineering-led buyers and creates a cleaner upgrade story than a managed-only rival.
      The same evidence also shows why that wedge is not absolute. The public review set flags a real
      HA learning curve, rising enterprise-seat costs at scale, and weaker database maturity than its
      SSH and Kubernetes story. In competitive terms, that means Tailscale can win when the real job is
      secure connectivity, and StrongDM can win when the buyer starts from managed database access
      rather than a broader infrastructure identity agenda.
    claimRefs: ["CP003", "CP004", "CP006", "CP007", "CP010", "CP011"]
    tableRefs: ["TP003"]
  - id: "durability"
    title: "Durability looks moderate: broad enough to matter, but not immune to category pressure"
    body: >-
      Teleport's moat is not just open source; it is the combination of breadth, short-lived
      certificates, auditability, and a single control plane across human and non-human access. That is
      meaningful, but the retained sources do not prove lock-in through public win rates, churn, or
      multi-homing data. Instead, the durability case is architectural: replacing several fragmented
      systems is harder to dislodge than replacing one VPN or one broker. The pressure comes from both
      sides. Legacy PAM incumbents still appear in buyer shortlists, while adjacent identity entrants
      can chip away at narrower use cases. Teleport therefore looks durable in complex regulated
      environments, but more vulnerable where buyers only need one slice of the problem.
    claimRefs: ["CP008", "CP009", "CP010", "CP012", "CP013", "CP014"]
    figureRefs: ["FP001"]
