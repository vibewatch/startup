callouts:
  - calloutType: "strength"
    title: "Teleport wins best when the buyer wants to retire multiple tools at once"
    body: >-
      The best-supported competitive wedge is consolidation: one identity-aware plane for access,
      approvals, recording, and audit across multiple infrastructure protocols and identity types.
      That is harder for a connectivity-only or single-protocol rival to match in one buying motion.
    claimRefs: ["CP001", "CP002", "CP008", "CP009"]
  - calloutType: "risk"
    title: "Narrower use cases can route deals to simpler substitutes"
    body: >-
      Teleport's broad platform is also a source of friction. Public reviews show that buyers with
      simpler connectivity needs, database-first access pain, or limited appetite for HA and RBAC
      operations may prefer Tailscale, StrongDM, or an existing internal stack over a new control plane.
    claimRefs: ["CP006", "CP007", "CP010", "CP011"]
