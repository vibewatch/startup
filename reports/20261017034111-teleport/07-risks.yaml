      - ["Open-source / commercial boundary drift", "Teleport blends open-source deployment with commercial cloud, compliance, and partner motions, so entitlement and licensing boundaries matter in embedded or reseller use cases.", "Enterprise procurement, channel, and embedded deployments", "Low to medium", "Medium", "Official licensing, annual contracts, and partner agreements.", "Medium where procurement needs reseller, redistribution, or sovereign-hosting clarity.", "Review current OSS and commercial license terms, channel rights, and any Cisco-linked licensing commitments."]
