      - ["Strategic partner concentration", "Cisco", "Technology integration, licensing, and strategic investment", "Medium and rising", "Go-to-market expectations or roadmap assumptions run ahead of disclosed economics or delivered integration.", "Medium to high", "Partnership broadens distribution and validation if execution lands.", "Medium because investment size, commercial terms, and customer pull-through are undisclosed."]
      - ["Seat-based pricing dependence", "Customer budget owners", "Commercial expansion and procurement approval", "Medium", "Per-user pricing slows deployment beyond a narrow admin cohort or makes small-team adoption uneconomic.", "Medium", "Value improves in regulated or multi-cloud environments where auditability replaces multiple point tools.", "Medium where customer estates are small, budget-constrained, or satisfied with native tooling."]
    notes: "Rows focus on dependencies that can constrain adoption, monetization, or rollout timing even when product controls are sound."
    claimRefs: ["CR008", "CR009", "CR012"]
