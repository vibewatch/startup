callouts:
  - calloutType: "risk"
    title: "Implementation quality is part of the product risk"
    body: "Teleport can lower access risk only if customers actually implement the control plane, RBAC, migration path, and upgrades well. Independent sources repeatedly show that rollout complexity is the main way the thesis can fail."
    claimRefs: ["CR004", "CR005", "CR006", "CR010"]
  - calloutType: "risk"
    title: "Regulated traction still needs primary proof"
    body: "Public evidence supports auditability and compliance features, but the retained pool does not itself prove a primary public authorization record for regulated procurement. That gap should remain open until primary artifacts are reviewed."
    claimRefs: ["CR011", "CR014"]
  - calloutType: "recommendation"
    title: "Kill criteria should be measurable"
    body: "The thesis should weaken if Teleport cannot produce primary compliance artifacts, if rollout pilots stall on RBAC or migration complexity, if new AI controls remain preview-only, or if seat-based pricing prevents expansion beyond a narrow admin cohort."
    claimRefs: ["CR009", "CR012", "CR013", "CR014"]
