      - ["Migration redesign burden", "Teams using static SSH keys, direct DB passwords, or direct kubeconfigs have to redesign workflows around Teleport's proxy and certificate model.", "High", "High", "Medium", "High", "Need pilot results for the most business-critical admin and automation workflows."]
      - ["Upgrade and compatibility breaks", "Public material cites stricter client compatibility in newer versions and a WebAuthn MFA shift in Teleport 18.", "Medium", "Medium", "Medium", "Medium", "Need current version matrix, upgrade runbooks, and reference accounts that crossed major versions cleanly."]
      - ["Product-scope expansion strain", "The platform now covers Linux desktops and AI-agent workflows in addition to core infrastructure access, broadening test and support surface.", "Medium", "Medium", "Low to medium", "Medium", "Need GA/support evidence, adoption references, and support metrics for newer product surfaces."]
    notes: "Residual exposure reflects operational reality after visible mitigations; managed cloud reduces some burden but does not remove policy-design or rollout risk."
    claimRefs: ["CR003", "CR004", "CR005", "CR006", "CR008", "CR010", "CR013"]
