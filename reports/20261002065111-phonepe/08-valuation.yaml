    claimRefs: [CV001, CV002, CV011, CV012, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price is the gating question
    body: >-
      PhonePe may be a high-quality scaled platform, but the available public record does not
      establish a supportable entry price or target return. Primary offering and capitalization
      evidence should determine whether the reported secondary mark is investable.
    claimRefs: [CV001, CV006, CV007, CV009, CV010, CV016]
