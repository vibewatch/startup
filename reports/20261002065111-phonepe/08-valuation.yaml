          detail: "Independent sources place the October 2025 secondary valuation near $14.5B-$15B."
        - id: unresolved-risk
          label: Unresolved inputs
          detail: "Revenue definition, capitalization, preferences, net cash, and risk-loss metrics remain incomplete."
        - id: decision
          label: Recommendation
          detail: "Research more and retain price discipline rather than underwrite a precise value."
