    title: "Strategic Implication of Indian Domicile and Public Listing"
    body: "PhonePe's decision to shift its legal domicile from Singapore to India incurred substantial upfront tax friction for major sponsors but positioned the company uniquely as a domestic sovereign champion. In converting to PhonePe Limited and submitting draft prospectus papers to SEBI via the confidential pre-filing route, management has prioritized domestic public market access over foreign listings, establishing alignment with Reserve Bank of India and NPCI regulatory expectations around local data sovereignty and platform governance."
    claimRefs:
      - "CO001"
      - "CO004"

