  topStrengths:
    - Massive consumer and merchant distribution with a strong Indian payments brand.
    - Broad monetization surface across payments, merchant services, and financial products.
    - Improving operating leverage, positive operating cash flow, and narrowing statutory losses.
    - A visible IPO path that creates a plausible liquidity route.
  topRisks:
    - The valuation denominator and final fully diluted capitalization remain unresolved.
    - Monetization depends on UPI/NPCI policy and merchant-fee reforms that may not persist or may lag.
    - Fraud, compliance, and merchant-trust costs can erode economics in a scale business.
    - Secondary-sale marks and private-market liquidity constraints make the entry price harder to underwrite.
  unresolvedGaps:
    - Final offer terms, preference stack, lock-ups, and fully diluted share count.
    - Audited revenue basis and comparable denominator for the current private-market mark.
    - Segment-level gross margin, CAC, and cohort economics by product line.
    - Exact path to monetizing payments scale without relying on regulatory changes alone.
