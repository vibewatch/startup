companyProfile:
  summary: >-
    PhonePe is a Bengaluru-based Indian fintech platform founded in December 2015 that began as a
    digital payments app and expanded into merchant acceptance, bill payments, insurance, lending,
    wealth, and adjacent consumer-tech products. Its business is built around UPI payments plus
    monetization from merchant subscriptions, payment-aggregation fees, and financial-services
    distribution.
