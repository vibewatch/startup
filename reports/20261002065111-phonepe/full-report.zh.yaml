        title: 图表
        blocks:
          - type: callout
            title: 迁回印度主体与本土上市的战略意涵
            body: >-
              PhonePe 将注册地从新加坡迁回印度，虽使主要股东承担了高额的前期税费摩擦，但将公司确立为独具优势的本土主权冠军企业。管理层将实体改制为 PhonePe Limited，并经保密预交表机制向 SEBI
              提交招股说明书草案，把本土公开市场准入置于境外上市之上，契合了印度储备银行（RBI）与 NPCI 对本土数据主权及平台治理的监管预期。
