      - number: '4.2'
        title: 成本结构、利润率轨迹与单量经济模型
        blocks:
          - type: paragraph
            body: >-
              随着技术基础设施、合规及品牌信任等平台固定投资在庞大交易用户群中充分摊薄，PhonePe 展现出显著的经营杠杆。FY25 总支出为 ₹9,394 crore，较 FY24 的 ₹7,754 crore 增长
              21.2%，增速明显低于 40.5% 的营业收入增速。受控的成本支出使得 PhonePe 的 EBITDA 亏损收窄 54.1%，从 FY24 的 ₹903 crore 降至 FY25 的 ₹414
              crore，EBITDA 利润率改善 1,200 个基点，从 -17.8% 收窄至 -5.8%。在剔除非现金员工期权激励（ESOP）费用的调整后口径下，PhonePe 在 FY25
              录得经调整税后净利润（PAT）正值 ₹630 crore，高于 FY24 的 ₹197 crore。从单量口径来看，在 53.40 billion 笔交易的基础上，单笔交易营业收入从 FY24 的 ₹0.78
              提升至 FY25 的 ₹1.33，而单注册用户年化收入约为 ₹108.2。FY25 经营性现金流果断转正，达到 ₹1,202 crore；尽管存在累计账面亏损 ₹14,860 crore 且 FY25
              法定报告净亏损仍达 ₹1,727 crore，但 PhonePe 经营上已蜕变成为一家具备自我造血能力的支付企业。
