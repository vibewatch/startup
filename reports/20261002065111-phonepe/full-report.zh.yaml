              - CR014
      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 关键悬顶风险：NPCI 30% 交易量上限与监管互联互通
            body: >-
              PhonePe 最核心的竞争优势——掌控全国约半数的 UPI 交易——恰恰构成了其最致命的监管软肋。根据 NPCI 酝酿已久的拟定指引，单一第三方应用提供商的交易量不得超过全市场 UPI 总交易量的
              30%。尽管监管部门为避免居民支付受阻而一再延后执行时点，但若最终出台严厉整顿或强制限流举措，将直接挫伤 PhonePe 的获客势头、商户端变现能力以及二级市场估值倍数。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR012
          - type: callout
            title: 尽调建议：审计商户账户冻结比率与涉网纠纷处置机制
            body: >-
              拟参与公开市场投资的机构与业务合作伙伴，应对 PhonePe 商户终端冻结指标进行深入的运营尽调。随着网安侦查部门基于 1930
              热线报案线索加大对违规以数字转账套取现金的打击力度，商户账户管控已成为核心摩擦点。投资评估团队须审慎核实受警方协查通报波及的商户年化 TPV 占比、平均争议解决周期，以及终端遭遇冻结后商户维系留存的稳定性。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR010
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              尽调建议为继续研究，将 PhonePe 列入有条件的 IPO 前观察名单，而非按某一特定价格批准准入。独立市场数据源将 2025 年 10 月的老股交易参考区间定在 $14.5B 至 $15B
              之间，但这只是观察到的一级市场交易价格参考，并非完整的估值结论。Multiples 模型根据 $15B 估值与已收录的 $761M 收入数据算出 19.1x 估值倍数，同时提示融资轮次相关字段可能为营业收入或
              ARR，并可能代表运行率或过去 12
              个月（LTM）口径。分母的不确定性使得团队难以测算出可靠的预期回报率或下行情景。此外，未上市公司流动性匮乏和转让受限要求计入执行风险折价。因此，准入决策应等待正式发行招股文件、完全摊薄股份总数、净现金与净负债、优先权与锁定期条款、经审计的当期收入以及明确的退出时间窗口。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
