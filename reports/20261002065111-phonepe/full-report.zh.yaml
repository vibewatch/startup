      - number: '3.3'
        title: 分发壁垒韧性、变现模式与监管逆风
        blocks:
          - type: paragraph
            body: >
              商户收单的分发能力极度依赖线下实体二维码铺设与 Soundbox 语音播报终端。PhonePe 通过专属商户二维码支持中小零售商户的 POS
              收款，并通过一体化线上支付网关及轻量级、免技术配置的支付链接提供差异化商业方案。然而，商户终端持续面临运营与欺诈风险暴露，包括商户接受数字转账套取实体现金等违规滥用行为，由此引发银行账户冻结和商户风险升级。


              PhonePe 竞争护城河的韧性受到监管政策动向和政府补贴框架调整的深度制约。战略风险首推 NPCI 酝酿已久的指令，拟对单一 UPI TPAP 应用设置 30%
              的交易量份额上限。尽管该规定的执行期限屡次推迟，但最新合规截止日期已定在 2026 年 12 月 31 日。鉴于 PhonePe
              的交易量份额已超出这一门槛，严格执行将压制其交易规模的自然扩张。与此同时，政府支持机制正在退出：印度储备银行决定在 2025 年 12 月 31
              日之后不再延续支付基础设施发展基金（PIDF），而国家财政预算中用于补贴 UPI 和 RuPay 数字交易的拨款亦缩减了 10%，直接压缩了商户收单利润率，迫使全行业竞对转向金融服务和商户软件变现。
