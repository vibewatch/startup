      - number: '7.3'
        title: 伙伴依赖、平台集中度与商业可行性
        blocks:
          - type: paragraph
            body: >-
              PhonePe 的商业模式对外部交易对手存在关键依赖，削弱了其自主运营控制力 (CR003, CR013)。由于 PhonePe
              是第三方应用（TPAP）而非直接清算银行，每一笔用户支付都必须经由三大合作赞助银行（Yes Bank、Axis Bank 或 ICICI Bank）之一进行路由，再由这些银行直连 NPCI
              中央交换系统与用户发卡行账户 (CR003)。上述合作机构遭遇的任何技术故障、运营摩擦或监管处罚，都会直接冲击 PhonePe 的平台可用性与交易成功率 (CR003,
              CR013)。在商户端推广中，数字钱包选型评估将客服响应速度与争议账目对账列为核心运营隐患 (CR013)。此外，财务与变现端，PhonePe 个人端 UPI 支付受制于政府强制推行的零商户折扣率（Zero
              MDR）政策，迫使平台只能借助商户硬件订阅、支付网关手续费和金融产品分销补贴支付路由成本 (CR012, CR014)。为隔离信用违约风险，PhonePe 扮演贷款服务提供商（LSP）与数字交易撮合平台的角色，在
              RBI 数字借贷指引框架下分销信贷资产，承保坏账损失由持牌合作银行及 NBFC 承担，而不反映在 PhonePe 自身资产负债表上 (CR001,
              CR014)。尽管这些机制提供了结构性防护，但监管政策转向或合作伙伴去中介化，仍可能大幅压缩平台利润空间，进而威胁其 IPO 估值目标 (CR007, CR014)。
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
