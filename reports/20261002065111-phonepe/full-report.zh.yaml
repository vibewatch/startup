      - number: '1.3'
        title: 融资历程、业务里程碑与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              2023 年 1 月，PhonePe 启动规模最高达 $1B 的股权融资，首期由 General Atlantic 领投 $350M，投前估值为 $12B (CO001)。随后的融资轮次相继引入
              Walmart、Ribbit Capital 和 Tiger Global Management 的资金，为本土数据中心扩建、商户信贷承保以及个人理财平台等重资产资产负债表需求提供资金支持 (CO001,
              CO004)。不过，PhonePe 的扩张历程中也遭遇了切实的监管摩擦与银行抵制 (CO006)。2017 年 1 月，ICICI Bank 和 Bharti Airtel
              等老牌机构以其排他性锁定商户、涉嫌违背印度国家支付公司（NPCI）指引为由，一度拦截 PhonePe 交易，导致 Flipkart 平台相关整合业务短暂停摆，直至 2017 年 2 月完成技术与合规调整后才告恢复
              (CO006)。近期，PhonePe 于 2025 年 9 月通过保密预交表方式向印度证券交易委员会（SEBI）递交了 IPO 草案招股说明书，正式迈向公开市场检验 (CO004)。
            claimRefs:
              - CO001
              - CO004
              - CO006
