      - number: '1.2'
        title: 核心高管、治理结构与公司分拆
        blocks:
          - type: paragraph
            body: >-
              核心高管团队仍由三位原班创始人坐镇：首席执行官 Sameer Nigam、首席技术官 Rahul Chari 与首席可靠性官 Burzin Engineer (CO004)。这三位联合创始人此前在
              Flipkart 及早期数字媒体创业项目中长期共事，深谙大规模分布式交易系统与强监管银行对接，具备深厚的创始人与市场契合度 (CO004, CO005)。公司治理经历了一次结构性重组：2020 年 12 月
              PhonePe 从 Flipkart 部分分拆，随后在 2022 年实现彻底独立，并将注册地从新加坡迁回印度 (CO001, CO004)。重组完成后，Walmart
              保留多数经济所有权，成长期股权投资机构持有少数股权；公司建立了独立的董事会架构，同时与主要机构股东保持紧密战略协同 (CO001, CO004)。
            claimRefs:
