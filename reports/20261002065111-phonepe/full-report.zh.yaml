      xAxis:
        label: 基础设施独立性（1=公有云/共享，5=自建本地私有化/重资产）
      yAxis:
        label: 印度本土生态覆盖广度（1=小众/跨境，5=国民级全面普及）
    approximationNotes: 序数坐标定位源自经核实的基建投资（₹3,800+ crore 本地私有数据中心）及披露的用户覆盖规模。
    claimRefs:
      - CP002
      - CP006
      - CP009
      - CP010
  - id: FI001
    title: PhonePe FY25 收入与经营现金流转化瀑布图
    type: waterfall
    summary: FY25 总收入扣除运营费用后转化为 EBITDA、非现金 ESOP 费用及最终生成经营现金流的过程。
    data:
      items:
        - label: FY25 总收入
          value: 7772
          note: 营业收入 ₹7,115 Cr 加上利息收入 ₹657 Cr
        - label: 付现运营费用
          value: -8186
          note: 不含折旧与非现金 ESOP 费用的付现运营成本
        - label: EBITDA 亏损
          value: -414
          note: 财报披露的 EBITDA 亏损，较 FY24 减亏 54%
        - label: ESOP 及非现金费用
          value: -1313
          note: 大额非现金员工股权激励导致法定亏损
        - label: 列报净亏损
          value: -1727
          note: 较 FY24 的 ₹1,996 Cr 净亏损有所收窄
        - label: 经营营运资金与现金调整
          value: 2929
          note: 营运资金沉淀与利息收入为正，驱动现金生成
        - label: 转正的经营现金流
          value: 1202
          note: FY25 实现自我造血的经营现金流
    approximationNotes: 金额以公司备案文件与业绩电话会回顾所载的 ₹ Crore 计价；付现费用与营运资金变动根据财报列报的 EBITDA 和现金流总额调整勾稽。
    claimRefs:
      - CI004
      - CI007
      - CI009
      - CI010
      - CI012
      - CI014
  - id: FE001
    title: PhonePe 多层技术架构体系
    type: stack
    summary: 架构层级展示 PhonePe 从客户端界面延伸至底层数据基础设施的模块化平台。
    data:
      layers:
        - label: 客户端与展示层
          detail: 统一的原生移动应用与定制化衍生应用体验
        - label: 商户网关与集成层
          detail: 开发者入驻、结账 SDK 与商户 API 管理
        - label: 智能体 AI 与运营治理层
          detail: 内部 Agent Hub 平台、文档检索智能体与端侧 ML 执行
        - label: 交易路由与核心处理层
          detail: NPCI UPI 交换、多银行路由逻辑与实时反欺诈防控
        - label: 大数据与分布式流式处理架构
          detail: Apache Kafka 事件流、Spark ETL 流水线与 Garfield Druid 分析系统
        - label: 存储、数据中心与基础设施层
          detail: 分布式数据库集群、内部网络可观测性与基础设施保障
    approximationNotes: 逻辑架构分层综合自 PhonePe 技术刊物、工程职位画像及高管通气会。
    claimRefs:
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
      - CE014
  - id: FU001
    title: PhonePe 双边客户旅程与扩张飞轮
    type: journey-map
    summary: 展示面向个人与商户客群的梯次采纳、硬件赋能与交叉销售扩张飞轮。
    data:
      items:
        - label: 个人用户获客
          touchpoints:
            - UPI 银行卡绑定
            - 点对点个人转账
            - 账单缴费奖励刺激
        - label: 商户拓展入驻
          touchpoints:
            - 地推团队铺设二维码
            - 商户端 App 注册
            - 银行账户极速到账结算
        - label: 硬件设备赋能
          touchpoints:
            - SmartSpeaker / Soundbox 安装
            - 本土方言语音到账播报
            - 按月收取设备订阅费
        - label: 金融服务延伸
          touchpoints:
            - 商户营运资金贷款
            - 个人公募基金分销
            - 保险与黄金定投交叉销售
        - label: 企业级规模化
          touchpoints:
            - 支付网关 API 接入
            - 自动化结算对账
            - 多门店连锁管理
        - label: 生态体系留存
          touchpoints:
            - Indus Appstore 应用分发
            - Bharat BillPay 集中缴费
            - 商户授信额度续期
    approximationNotes: 概括 PhonePe 一线销售指南及财务披露中记载的结构化客户旅程与商业变现循环。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按发生概率与影响程度直观映射 PhonePe 的主要运营、监管、合作伙伴及财务风险。
    approximationNotes: 发生概率与影响程度等级基于监管文件、供应商采购审计及诉讼案卷评定。
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR010
      - CR012
      - CR013
      - CR014
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
      rows:
        - label: 高发生概率
          values:
            - label: 轻微 API 漂移
              tone: neutral
            - label: 客服响应投诉
              tone: warning
            - label: 商户套现欺诈账户冻结
              tone: critical
        - label: 中发生概率
          values:
            - label: 轻微汇率报告滞后
              tone: neutral
            - label: IPO 进度延期
              tone: warning
            - label: NPCI 强制执行 30% 份额上限
              tone: critical
        - label: 低发生概率
          values:
            - label: 局部硬件缺陷
              tone: positive
            - label: NBFC 合作伙伴退出
              tone: warning
            - label: 赞助 PSP 银行全面宕机
              tone: critical
        - label: 系统性基础设施
          values:
            - label: 云可用区故障转移
              tone: positive
            - label: 跨行交换系统延迟
              tone: warning
            - label: NPCI 中央交换系统宕机
              tone: critical
        - label: 监管合规
          values:
            - label: 常规审计发现项
              tone: positive
            - label: 贷款 FLDG 规则变动
              tone: warning
            - label: 强制压降 UPI 交易限额
              tone: critical
        - label: 安全与欺诈隐患
          values:
            - label: 局部钓鱼攻击
              tone: neutral
            - label: 商户终端争议激增
              tone: warning
            - label: 团伙化 UPI 欺诈网络
              tone: critical
  - id: FV001
    title: 建议推导逻辑
    type: flow
    summary: 从分发能力证据到估值不确定性，最终推导至「深入研究」决策的有序逻辑链。
    data:
      nodes:
        - id: scale
          label: 规模
          detail: 公司自述的用户与商户覆盖范围奠定了庞大的分发基础。
        - id: breadth
          label: 变现广度
          detail: 支付、商户工具、保险、理财投资与借贷开辟了多条增收途径。
        - id: exit-route
          label: 退出途径
          detail: 据报道的 SEBI 审批及老股东减持计划明确了 IPO 路径。
        - id: valuation-mark
          label: 参考基准
          detail: 独立信源将 2025 年 10 月的二级市场估值定在 $14.5B-$15B 左右。
        - id: unresolved-risk
          label: 待核实输入项
          detail: 收入口径、股权资本结构、优先权、净现金及风险损失指标仍不完备。
        - id: decision
          label: 投资建议
          detail: 深入研究并保持价格纪律，而非过早框定精确估值。
    approximationNotes: 仅为有序定性逻辑；节点顺序并不意味着量化的转化率或发生概率。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV012
      - CV015
      - CV016
