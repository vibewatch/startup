  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支付通道与替代基础设施
        blocks:
          - type: paragraph
            body: >
              印度数字支付生态呈现出由现金和闭环电子钱包向互联互通、账户对账户（A2A）支付通道的结构性转型。核心市场边界围绕印度国家支付公司（NPCI）开发的统一支付接口（UPI）展开，在 FY2024-25，UPI
              处理了印度约 84% 的零售数字支付交易量。过去，闭环钱包要求用户在孤立系统内预先充值，给消费者和商户带来显著摩擦；UPI 则建立了开放协议，实现银行账户间直接结算，将前端应用间的切换成本降至接近于零。


              在这一架构下，相关目标市场可细分为核心支付处理规模、商户收单受理基础设施，以及衍生金融服务分销。核心个人对个人（P2P）转账与标准个人对商户（P2M）支付创造了海量交易吞吐量，但受制于政府强制推行的零商户折扣率（Zero
              MDR）政策。因此，单纯的交易吞吐量无法直接变现收取支付手续费。平台转而借助商户赋能硬件、支付网关 API 以及第三方金融产品分销佣金，获取商业变现。现有替代方案包括现金、刷 POS
              终端的借记卡和信用卡，以及网银通道。尽管现金在非正规微型交易中依然具备韧性，但数字支付在 Tier 1 至 Tier 4 地区均已具备系统级公共事业属性。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
