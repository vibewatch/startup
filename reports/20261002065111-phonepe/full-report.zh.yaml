      - number: '8.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 定价是核心门槛问题
            body: PhonePe 或许是具备规模优势的高质量平台，但现有公开记录尚无法确立站得住脚的入场价格或目标回报。报道的老股交易估值是否具备投资价值，应取决于新股发行与资本结构方面的确凿证据。
