    PhonePe 成立于 2015 年 12 月，总部位于印度班加罗尔。平台最初为数字支付应用，随后延伸至商户收单、账单缴费、保险、借贷、理财及相关消费科技产品。其商业模式立足于 UPI
    支付，并通过商户订阅费、聚合支付手续费与金融服务分销抽佣实现商业化变现。
