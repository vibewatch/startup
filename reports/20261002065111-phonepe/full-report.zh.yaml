              - CR005
              - CR007
              - CR010
      - number: '7.2'
        title: 运营失效模式、欺诈传播路径与网络基础设施
        blocks:
          - type: paragraph
            body: >-
              PhonePe 支撑着超 60 crore 注册个人账户与覆盖超 4 crore 实体及数字化网点的商户收单网络的庞大高并发交易
              (CR008)。维护这一分布式支付基础设施的安全，需要持续防范高智商金融犯罪、平台仿冒与欺诈路径
              (CR009)。其中一项蔓延广泛的运营风险是「以数字转账套取实体现金骗局」，不法分子利用线下商户二维码将涉诈数字转账兑换为现金 (CR010)。一旦交易涉及被盗刷的 RuPay-on-UPI
              工具、被盗银行卡，或源于拨打全国 1930 热线报案的网络犯罪受害者，执法机关与网络犯罪侦查部门会根据 RBI 及内政部（MHA）指引冻结商户银行账户，给商户合作伙伴带来灾难性的经营中断与争议对账纠纷
              (CR010)。PhonePe 依靠多因素认证（结合设备生物识别、UPI PIN 与密码）及实时交易风控监控，并深度对接国家网络犯罪报告平台、CyCord 和 CyberSafe 等官方网信系统，化解此类风险
              (CR009)。在技术架构上，PhonePe 的 SDET 工程框架必须在涉及 652 家生态合作银行的环境中处理复杂的异步 UPI 状态机流转、幂等性约束以及分布式 API
              延迟，第三方系统停机往往会造成交易失败率激增 (CR011, CR012)。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
