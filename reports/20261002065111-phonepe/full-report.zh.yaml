              PhonePe 为印度的个人消费者、商户和机构端提供数字支付基础设施与金融分销通道。消费者端的核心功能包括 P2P 及 P2M 维度的 UPI 交易、数字钱包管理、账单缴费、话费充值，以及通过 AutoPay
