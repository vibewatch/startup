    title: 建议摘要
    columns:
      - 决策维度
      - 评估结论
      - 投资含义
    rows:
      - - 投资建议
        - 深入研究 / 有条件跟踪
        - 基于当前公开信息，不建议批准带定价的投资承诺。
      - - 置信度
        - 中低
        - 独立信源印证了参考估值基准，但缺失一手交易数据与经审计的估值输入项。
      - - 风险评级
        - 高
        - 监管依赖、欺诈敞口、一级市场流动性匮乏以及分母估值基数模糊依然构成重大风险。
      - - 估值立场
        - 相对于据报道的 $14.5B-$15B 基准不予定价
        - 将该基准视作参考上限，而非内在价值。
      - - 回报与退出
        - 无法得出具备支撑的目标回报率或持有期限
        - 需获取一手要约条款、完全稀释后持股比例、净现金以及明确的退出时间窗口。
    notes: 属于分析性判断而非交易条款；估值参考来源于二手信源标价，未计算目标回报率。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: 核心论点与反方观点
    columns:
      - 观点
      - 论据
      - 何种变量会改变观点
    rows:
      - - 立论
        - PhonePe 声称拥有超过 72 crore 注册用户与超过 five crore 商户。
        - 经审计的一手活跃度、留存群组及变现数据，方能确定其声称的覆盖规模中有多少具备经济价值的活跃度。
      - - 立论
        - 官方资料显示其具备覆盖个人与商户的广泛金融服务组合。
        - 分部收入、边际贡献、留存率及交叉销售证据，方能将业务广度转化为估值支撑。
      - - 反方观点
        - 参与 UPI 业务高度依赖 NPCI 规则及赞助 PSP 银行。
        - 穿越监管或赞助银行变动的持久经济效益与韧性，方可降低依赖风险。
      - - 反方观点
        - 公司资料描述了实时反欺诈风控机制，以及涉及商户账户冻结、损失和法律后果的处置场景。
        - 经审计的欺诈损失率、投诉趋势、追回时间及风控有效性，方能划定残留风险边界。
    notes: 规模与风控表述均属公司单方口径；各行均未将宣称的覆盖范围或监控能力视作经过独立验证的表现。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 情景
      - 明确假设
      - 估值或回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的备案文件证实持续增长、可比收入、经济效益改善，以及可控的监管与欺诈成本。
        - 上限触及据报道的 $14.5B-$15B 参考区间；现有证据不支持任何溢价。
        - IPO 进程推迟、估值倍数压缩或变现能力不及预期。
        - 获得 SEBI 批准上市，随后持续披露经审计数据并保持稳健增长。
      - - 基准
        - 规模效应持续，但收入常态化水平、股权结构和盈利能力仍仅部分披露。
        - 无法得出有说服力的绝对估值区间；在核心输入项得到验证前，需相对二级市场参考价给予折价。
        - 老股转让供应压力、分母基数不确定性，以及相邻产品的拓展执行风险。
        - 一手要约文件厘清了股份总数与收入基数，但尚未证明具备充分的经营杠杆。
      - - 悲观
        - 增长放缓，或者欺诈、合规、监管和股东抛压盖过变现进展。
        - 低于据报道的参考区间或放弃入场；缺乏支持测算确切估值底部的依据。
        - 监管制约、商户信任受损以及缺乏流动性。
        - 不利条款、疲软的经审计经济指标、上市推迟或亏损指标上升。
    notes: 情景估值为决策边界而非预测；股权资本结构、经审计净现金、优先权条款和常态化财务数据的缺失，阻碍了对概率或回报进行精确估算。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间顺序梳理 PhonePe 从成立到演进为多垂直领域金融生态系统及筹备 IPO 的历程。
    approximationNotes: 各日期对应公开发布的公司交易、平台发布和监管事件。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
    data:
      items:
        - date: 2015-12
          label: 公司成立
          detail: Sameer Nigam、Rahul Chari 与 Burzin Engineer 在 Bengaluru 创立 PhonePe。
          tone: positive
        - date: 2016-04
          label: 被 Flipkart 收购
          detail: Flipkart 收购 PhonePe；受让 FxMart 支付牌照并完成品牌重塑。
          tone: positive
        - date: 2016-08
          label: 基于 UPI 发布应用
          detail: 与 Yes Bank 合作在 UPI 链路上线面向个人的支付应用。
          tone: positive
        - date: 2017-01
          label: 银行互联互通挑战
          detail: ICICI Bank 与 Airtel 指称其不符合 NPCI 指引，一度暂停相关交易。
          tone: adverse
        - date: 2020-12
          label: 与 Flipkart 部分拆分
          detail: Flipkart 与 PhonePe 宣布公司分拆；Walmart 保持控股地位。
          tone: neutral
        - date: 2022-10
          label: 迁册与完全分拆
          detail: PhonePe 将注册地自 Singapore 迁至 India，完成与 Flipkart 的彻底分拆。
          tone: positive
        - date: 2023-01
          label: $12B 估值成长期融资
          detail: 获得来自 General Atlantic 的 $350M 投资，作为拟募资 $1B 计划的首笔资金。
          tone: positive
        - date: 2025-04
          label: 改制为股份有限公司
          detail: 法人结构变更为 PhonePe Limited，正式筹备在本土 IPO。
          tone: neutral
        - date: 2025-09
          label: 向 SEBI 秘密提交 IPO 申请
          detail: 通过机密预审机制向 SEBI 提交红鲱鱼招股书草案。
          tone: positive
  - id: FM001
    title: 潜在市场规模分层与变现转化漏斗
    type: pyramid
    summary: 规模金字塔展示从总支付吞吐量到收费商户及金融服务层的转化漏斗。
    data:
      items:
        - label: 数字支付链路总规模（TAM）
          value: 24.51
          unit: B monthly transactions
          detail: 2026 年 8 月，全国 UPI 生态系统零售和 P2P 支付月交易量达到 24.51 billion 笔。
        - label: 零售商户商业层（SAM）
          value: 15.37
          unit: B monthly transactions
          detail: 到 2025 年，个人对商户（P2M）零售商业占 UPI 应用总吞吐量的 62.7%。
        - label: PhonePe 平台吞吐量（SOM）
          value: 11.25
          unit: B monthly transactions
          detail: 2026 年 8 月，PhonePe 平台交易量占 UPI 总交易量的 45.9%，覆盖 650M+ 注册用户。
        - label: 注册个人用户基数
          value: 650
          unit: M registered users
          detail: 截至 2026 年 4 月，在 Tier 1 至 Tier 4 地区拓展的注册个人用户账户。
        - label: 月活跃个人用户基数
          value: 200
          unit: M active consumers
          detail: 超过 200 million 月活跃用户在个人转账、公用事业缴费和商户结账中进行交易。
        - label: 可变现商户受理触点
          value: 50
          unit: M merchant touchpoints
          detail: 近 50 million 商户受理触点，可用于 Soundbox 订阅、支付网关 API 和信贷分发。
    approximationNotes: 月交易量基于 Inc42 引用的 2026 年 8 月 NPCI 统计数据；62.7% 的 P2M 份额套用于交易量；注册和活跃用户数及商户触点反映了已披露的网络规模。
    claimRefs:
      - CM001
      - CM002
      - CM006
      - CM008
  - id: FP001
    title: 竞争定位：基础设施独立性对比生态覆盖广度
    type: quadrant
    summary: 数字支付提供商评估，比对技术基础设施自主权与个人及商户分发广度。
    data:
      points:
        - label: PhonePe
          x: 4.8
