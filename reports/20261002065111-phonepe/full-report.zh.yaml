            body: >-
              在控股股东 Walmart 与成长期股权投资机构 General Atlantic 的鼎力支持下，PhonePe 保持着充裕的资本储备，迄今股权融资总额已超 $1.71 billion。FY24
              庞大的现金储备产生了 ₹661 crore 利息收入，在 FY25 保持稳定在 ₹657 crore，为对冲法定亏损提供了有力的非经营性缓冲。公司正推进完全以老股转让（OFS）形式架构的 IPO，规模约为
              ₹13,500 crore（约合 $1.5 billion），不发行任何新股，表明其业务运营已无需稀释性外部融资来维持增长。然而，严谨的投资评估面临实质性的未公开数据缺口：PhonePe
              未按支付处理与金融服务细分披露毛利率，未公开获客成本（CAC）队列曲线，亦未披露 Soundbox
              硬件订阅商户流失率，或联名信用卡与助贷资产的单客拨备损失。监管政策悬顶同样构成明确的下行风险，尤其是印度国家支付公司（NPCI）拟对第三方应用提供商（TPAP）设置的 30%
