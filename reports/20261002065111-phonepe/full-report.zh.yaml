        blocks:
          - type: paragraph
            body: >-
              PhonePe 运营着双边金融基础设施生态，服务于两大核心群体：借助 P2P 及 P2M 支付通道进行交易的个人消费者，以及从非正规街头摊贩到大型连锁企业零售商的商业商户。个人消费者主要使用 PhonePe
              进行零手续费实时银行转账、借助 Bharat BillPay 缴纳公用事业账单、话费充值，并日益广泛地购买黄金、公募基金和保险等第三方金融产品。在收单端，商户按三层运营架构接入
