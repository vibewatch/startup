  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价体系
        blocks:
          - type: paragraph
            body: >-
              PhonePe 运营着印度规模最大的数字支付网络，但核心的统一支付接口（UPI）基础设施在个人端交易中一直受制于政府强制推行的零商户折扣率（Zero MDR）政策。因此，PhonePe
              绝大部分支付收入来自配套商业服务，包括线下商户的 Soundbox 语音播报设备订阅费、线上结账的聚合支付处理费，以及账单缴费和话费充值等消费端增值服务。在 FY25，支付业务总收入达 ₹6,300
              crore，较 FY24 的 ₹4,681 crore 增长 34.6%，同期整体营业收入增长 40.5% 至 ₹7,115 crore。为摆脱支付工具同质化瓶颈，PhonePe
              大力拓展金融服务业务，涵盖纯线上保险分销、与持牌银行和非银行金融机构（NBFC）合作的助贷业务，以及财富管理分销。金融服务收入从 FY24 的 ₹182 crore 增至 FY25 的 ₹558
              crore，实现三倍以上增长，同比增幅达 206.6%。此外，印度监管机构已批准将于 2026 年 10 月 15 日开启 UPI 变现的结构性拐点，允许对超过 ₹2,000 的商户端交易收取最高 0.4%
              的手续费；券商研究分析师估计，这将为头部应用带来可观的年度增量收入。
            claimRefs:
              - CI001
