chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司背景、创立历程与平台演进
        blocks:
          - type: paragraph
            body: >-
              2015 年 12 月，Sameer Nigam、Rahul Chari 与 Burzin Engineer 在卡纳塔克邦班加罗尔创立 PhonePe，紧扣当时新生的统一支付接口（UPI）框架搭建业务体系
              (CO001, CO004)。公司法律实体最早可追溯至 FX Mart Pvt Ltd，成立之初便致力于打破电子钱包充值的繁琐流程，转向银行账户间直接电子转账 (CO004, CO005)。2016 年 4 月
              Flipkart 收购该公司，其持有的预付支付牌照随之注入，并在 2016 年 8 月面向消费者的应用正式上线前，整合重塑为 PhonePe 数字钱包底层架构 (CO004,
              CO005)。得益于印度智能手机普及和废钞令催化的数字化浪潮，PhonePe 从一款 P2P 工具迅速演变为横跨商户收单、账单聚合、保险分销和投资经纪的国家级基础设施 (CO002,
              CO003)。公司注册总部位于班加罗尔 Bellandur 的 Salarpuria Softzone，并于 2025 年 4 月完成公司治理结构改造，由 PhonePe Private Limited
              正式变更为 PhonePe Limited，全力筹备 IPO (CO004, CO005)。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
