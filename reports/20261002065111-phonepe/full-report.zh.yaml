        - label: Google Pay
          x: 2.8
          'y': 4.5
        - label: Paytm
          x: 3.2
          'y': 4
        - label: Amazon Pay
          x: 2.5
          'y': 3.4
        - label: Trustly
          x: 3.8
          'y': 1.8
