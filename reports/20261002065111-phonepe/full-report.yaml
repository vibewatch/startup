  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - View
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - PhonePe claims more than 72 crore registered users and more than five crore merchants.
        - >-
          Primary audited engagement, cohort, and monetization data would determine how much of the claimed reach is
          economically active.
      - - Thesis
        - Official materials show a broad consumer and merchant financial-services portfolio.
        - >-
          Segment revenue, contribution margin, retention, and cross-sell evidence would convert breadth into valuation
          support.
      - - Anti-thesis
        - UPI participation depends on NPCI rules and sponsor PSP banks.
        - Durable economics and resilience across regulatory or sponsor-bank changes would reduce dependency risk.
      - - Anti-thesis
        - >-
          Company materials describe real-time fraud controls and scenarios involving frozen merchant accounts, loss,
          and legal consequences.
        - >-
          Audited fraud-loss rates, complaint trends, recovery times, and control effectiveness would bound residual
          risk.
    notes: >-
      Scale and control statements are company-issued; no row treats claimed reach or monitoring as independently
      verified performance.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull, base, and bear decision scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited filings confirm durable growth, comparable revenue, improving economics, and manageable regulatory and
          fraud costs.
        - Up to the reported $14.5B-$15B reference range; no premium is supported by available evidence.
        - Public offering delay, multiple compression, or weaker monetization.
        - SEBI-approved process followed by consistent audited disclosures and durable growth.
      - - Base
        - Scale persists, but revenue normalization, ownership, and profitability remain only partly disclosed.
        - No defensible absolute range; require a discount to the secondary reference until core inputs are verified.
        - Secondary supply, uncertain denominator, and execution across adjacent products.
        - Primary offer documents resolve share count and revenue basis without proving full operating leverage.
      - - Bear
        - Growth slows or fraud, compliance, regulation, and shareholder supply outweigh monetization progress.
        - Below the reported reference range or no entry; a precise floor is unsupported.
        - Regulatory constraints, merchant trust damage, and illiquidity.
        - Adverse terms, weak audited economics, delayed listing, or rising loss indicators.
    notes: >-
      Scenario values are decision boundaries, not forecasts; missing capitalization, audited net cash, preference
      terms, and normalized financials prevent precise probability or return estimates.
    claimRefs:
      - CV001
      - CV002
      - CV003
