  - id: TR003
    title: Partner and Dependency Risk Register
    columns:
      - Dependency / Domain
      - Counterparty & Role
      - Concentration Level
      - Failure Scenario
      - Severity
      - Mitigation Architecture
      - Residual Exposure Level
    rows:
      - - UPI Sponsor Bank Gateway
        - Yes Bank, Axis Bank, ICICI Bank (Sponsor PSP Banks)
        - Critical; 100% of UPI traffic routes via tripartite sponsor bank agreements.
        - Sponsor bank server outage, infrastructure throttling, or regulatory license suspension.
        - High
        - Multi-bank routing infrastructure; dynamically shifting traffic across multiple sponsor PSPs.
        - Moderate; systemic banking failures still impair downstream clearing and settlement.
      - - UPI Central Settlement Rail
        - National Payments Corporation of India (NPCI)
        - Monopoly; sole clearing switch for all interbank UPI fund movements.
        - Central NPCI switch downtime, policy changes, or mandatory 30% volume cap enforcement.
        - High
        - Direct regulatory liaison, participation in NPCI working committees, and alternative payment rails.
        - High; single point of failure inherent to national digital public infrastructure.
      - - Lending Balance-Sheet Capital
        - Partner Commercial Banks & NBFCs
        - High; PhonePe operates strictly as a digital distribution marketplace.
        - Partner risk aversion, credit tightening, or withdrawal from digital lending distribution.
        - Medium
        - Diversified panel of multiple regulated lending partners across consumer and merchant segments.
        - Low to Moderate; credit supply fluctuates with macro liquidity conditions.
      - - Mobile OS Distribution & App Store Ecosystem
        - Google (Android Play Store) / Apple (iOS App Store)
        - Very High; overwhelming majority of Indian smartphone users transact on Android.
        - App store policy shifts, billing mandates, or distribution restrictions.
        - Medium
        - Launched Indus Appstore as an indigenous localized Android alternative; multi-OEM preloading.
        - Moderate; Google Play remains the dominant discovery channel for Indian consumers.
    notes: Dependency matrix identifies external counterparties whose disruption directly impacts platform throughput.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR011
      - CR012
      - CR013
      - CR014
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Investment implication
    rows:
      - - Recommendation
        - Research more / conditional track
        - Do not approve a priced commitment from the current public record.
      - - Confidence
        - Medium-low
        - >-
          Independent sources corroborate the reference mark, but primary transaction and audited valuation inputs are
          missing.
      - - Risk rating
        - High
        - Regulatory dependency, fraud exposure, private-market illiquidity, and denominator ambiguity remain material.
      - - Valuation stance
        - Unpriced relative to the reported $14.5B-$15B mark
        - Treat the mark as a reference ceiling, not intrinsic value.
      - - Return and exit
        - No supportable target return or holding period
        - Require primary offer terms, fully diluted ownership, net cash, and a defined exit horizon.
    notes: >-
      Analytical judgments rather than transaction terms; the valuation references are secondary-source marks and no
      target return is computed.
