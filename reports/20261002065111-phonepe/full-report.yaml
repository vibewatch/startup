chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Platform Evolution
        blocks:
          - type: paragraph
            body: >-
              PhonePe was founded in December 2015 by Sameer Nigam, Rahul Chari, and Burzin Engineer in Bengaluru,
              Karnataka, establishing its operating identity around the emergent Unified Payments Interface framework
              (CO001, CO004). Initially incorporated with legal lineage tracing back to FX Mart Pvt Ltd, the startup
              positioned itself to eliminate frictional wallet-top-up workflows in favor of direct bank-to-bank
              electronic transactions (CO004, CO005). The company was acquired by Flipkart in April 2016, through which
              the underlying prepaid payment license was transferred and rebranded into the PhonePe digital wallet
              architecture prior to the consumer app's official public launch in August 2016 (CO004, CO005). Supported
              by India's rapid smartphone proliferation and demonetization-driven digitization, PhonePe evolved from a
              peer-to-peer utility into a national infrastructure asset spanning merchant acquiring, bill aggregation,
              insurance distribution, and investment brokerage (CO002, CO003). Operating out of its registered
              headquarters at Salarpuria Softzone in Bellandur, Bengaluru, the business converted from PhonePe Private
              Limited to PhonePe Limited in April 2025 as part of its corporate governance structuring for an initial
              public offering (CO004, CO005).
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Corporate Separation
        blocks:
          - type: paragraph
            body: >-
              The core executive leadership team remains anchored by its original founding group: Chief Executive
              Officer Sameer Nigam, Chief Technology Officer Rahul Chari, and Chief Reliability Officer Burzin Engineer
              (CO004). This founding triad previously collaborated at Flipkart and early digital media ventures,
              providing a high degree of founder-market alignment across large-scale distributed transactional systems
              and regulatory-heavy banking integrations (CO004, CO005). Governance underwent a structural transformation
              when PhonePe orchestrated a partial split from Flipkart in December 2020, followed in 2022 by a complete
              corporate separation and the relocation of its corporate domicile from Singapore back to India (CO001,
              CO004). Following the restructuring, Walmart retained majority economic ownership alongside minority
              participation from growth equity backers, establishing an independent board structure while maintaining
              strategic alignment with major institutional sponsors (CO001, CO004).
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO004
      - number: '1.3'
        title: Capitalization History, Operational Milestones, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              In January 2023, PhonePe initiated an equity financing round of up to $1 billion, securing an initial $350
              million tranche led by General Atlantic at a pre-money equity valuation of $12 billion (CO001). Subsequent
              tranches expanded capitalization with equity infusions from Walmart, Ribbit Capital, and Tiger Global
              Management to support substantial balance-sheet requirements including indigenous data center expansion,
              merchant credit underwriting, and consumer wealth platforms (CO001, CO004). However, PhonePe's expansion
              has encountered material regulatory frictions and banking pushback throughout its history (CO006). In
              January 2017, incumbent lenders including ICICI Bank and Bharti Airtel temporarily blocked PhonePe
              transactions due to alleged National Payments Corporation of India (NPCI) guideline non-compliance
              regarding restrictive merchant lock-ins, forcing a temporary cessation of Flipkart-integrated operations
              before technical and regulatory reconciliation was achieved in February 2017 (CO006). More recently,
              PhonePe submitted draft initial public offering papers to the Securities and Exchange Board of India
              (SEBI) via the confidential pre-filing route in September 2025, marking its transition toward public
              market scrutiny (CO004).
            claimRefs:
              - CO001
              - CO004
              - CO006
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Implication of Indian Domicile and Public Listing
            body: >-
              PhonePe's decision to shift its legal domicile from Singapore to India incurred substantial upfront tax
              friction for major sponsors but positioned the company uniquely as a domestic sovereign champion. In
              converting to PhonePe Limited and submitting draft prospectus papers to SEBI via the confidential
              pre-filing route, management has prioritized domestic public market access over foreign listings,
              establishing alignment with Reserve Bank of India and NPCI regulatory expectations around local data
              sovereignty and platform governance.
            calloutType: insight
            claimRefs:
