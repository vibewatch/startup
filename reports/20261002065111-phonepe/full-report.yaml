figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological overview of PhonePe's evolution from incorporation to multi-vertical financial ecosystem and IPO
      preparations.
    approximationNotes: Dates correspond to publicly announced corporate transactions, platform releases, and regulatory events.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
    data:
      items:
        - date: 2015-12
          label: Corporate Incorporation
          detail: PhonePe founded in Bengaluru by Sameer Nigam, Rahul Chari, and Burzin Engineer.
          tone: positive
        - date: 2016-04
          label: Acquisition by Flipkart
          detail: Flipkart acquires PhonePe; FxMart payment license transferred and rebranded.
          tone: positive
        - date: 2016-08
          label: App Launch on UPI
          detail: Consumer payments application goes live in partnership with Yes Bank on UPI rails.
          tone: positive
        - date: 2017-01
          label: Bank Interoperability Challenge
          detail: ICICI Bank and Airtel temporarily block transactions over alleged NPCI guideline non-compliance.
          tone: adverse
        - date: 2020-12
          label: Partial Split from Flipkart
          detail: Flipkart and PhonePe announce corporate separation; Walmart maintains majority ownership.
          tone: neutral
        - date: 2022-10
          label: Redomiciling & Separation
          detail: PhonePe shifts corporate domicile from Singapore to India and completes Flipkart separation.
          tone: positive
        - date: 2023-01
          label: $12B Valuation Growth Round
          detail: Secures $350M from General Atlantic as first tranche of planned $1B capital raise.
          tone: positive
        - date: 2025-04
          label: Public Limited Conversion
          detail: Converts legal structure to PhonePe Limited in formal preparation for domestic IPO.
          tone: neutral
        - date: 2025-09
          label: Confidential SEBI IPO Filing
          detail: Submits draft red herring prospectus papers with SEBI via confidential pre-filing mechanism.
          tone: positive
  - id: FM001
    title: Addressable market sizing layers and monetization conversion
    type: pyramid
