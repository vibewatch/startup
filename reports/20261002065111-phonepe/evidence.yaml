evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited statutory financial statements for FY2024 through FY2026, including operating revenue, net payment margin,
      marketing expense, and EBITDA loss breakdown.
    whyItMatters: >-
      Essential for verifying whether high transaction volumes translate into positive operating margins or sustainable
      unit economics ahead of public market listing.
    diligencePath: >-
      Review the confidential draft red herring prospectus (DRHP) submitted to SEBI or Ministry of Corporate Affairs
      (MCA) annual statutory return filings.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: cap-table-ownership
    missingEvidence: >-
      Fully diluted post-2023 cap table showing exact percentage equity stakes held by Walmart, General Atlantic, Tiger
      Global, and founding executives.
    whyItMatters: >-
      Necessary to evaluate governance control mechanisms, founder equity retention, and potential secondary share
      overhang during IPO.
    diligencePath: Obtain corporate secretarial register of members filings from the Registrar of Companies (ROC) Karnataka.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: soundbox-unit-economics
    missingEvidence: >-
      Audited segment disclosure on Soundbox device rental margins, hardware churn rates, and merchant monthly recurring
      revenue (MRR) across Tier 2 and Tier 3 cities.
    whyItMatters: >-
      Offline merchant hardware serves as PhonePe's principal defense against zero-MDR commoditization, and undisclosed
      device subsidization or churn could impair commercial unit economics.
    diligencePath: >-
      Review subsequent pre-IPO financial filings, DRHP revisions, or investor presentations for explicit device cohort
      retention schedules and monthly subscription churn disclosures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-financials
    missingEvidence: >-
      Audited gross margin and net contribution metrics broken down specifically by merchant QR versus soundbox versus
      payment gateway lines across competing private TPAPs.
    whyItMatters: >-
      Without segmented competitor unit economics, assessing whether PhonePe's on-premise infrastructure provides
      sustainable margin outperformance versus Google Pay or Paytm remains unverified.
    diligencePath: >-
      Review pre-IPO red herring prospectus disclosures (DRHP) or private financial statements filed with the Registrar
      of Companies (RoC).
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: upi-market-share-enforcement
    missingEvidence: >-
      Official NPCI implementation framework detailing penalty mechanisms or volume throttling procedures if any app
      exceeds the 30% cap after 31 December 2026.
    whyItMatters: >-
      Direct enforcement mechanisms determine whether PhonePe will face active user acquisition curbs or if the
      regulatory cap will be deferred again.
    diligencePath: Track NPCI steering committee circulars and RBI policy announcements regarding UPI volume caps.
    relatedQuestionRefs:
      - QP006
      - QP010
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Granular breakdown of customer acquisition costs (CAC) and payback periods across consumer and merchant segments.
    whyItMatters: >-
      Without segmented CAC and payback metrics, underwriters cannot independently model the terminal return on
      marketing expenditure.
    diligencePath: Request management presentation detailing cohort CAC, soundbox hardware subsidies, and payback periods.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Disclosed gross processing margins across payment gateway, merchant soundbox rentals, and financial services
      distribution.
    whyItMatters: >-
      Blended gross margin is necessary to evaluate the true profitability of incremental payment volume and software
      subscriptions.
    diligencePath: >-
      Obtain audited gross margin schedule by product line from confidential information memorandum during IPO
      diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pipeline-latency-benchmarks
    missingEvidence: >-
      Quantitative latency distributions and transaction-per-second (TPS) throughput metrics for PhonePe's Kafka and
      Spark data streaming clusters under peak load.
    whyItMatters: >-
      Validating infrastructure headroom is essential for assessing system resilience during nationwide shopping
      festivals and high-frequency UPI transaction spikes.
    diligencePath: >-
      Request production performance metrics, switch latency percentiles, and disaster recovery SLA logs during
      technical underwriting.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: distributed-consensus-benchmarks
    missingEvidence: >-
      Independent third-party architectural audits and consensus benchmarks comparing PhonePe's internal ledger engines
      with global high-throughput financial networks.
    whyItMatters: >-
      Confirms whether PhonePe's custom proprietary layers match the fault tolerance and auditability standards of
      established international payment rails.
    diligencePath: >-
      Review internal architecture whitepapers, third-party SOC audits, and external penetration testing reports under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: cohort-retention
    missingEvidence: >-
      Granular monthly active user (MAU) counts, annual consumer cohort retention rates, and merchant device churn
      figures are not publicly disclosed in DRHP summaries or marketing case studies.
    whyItMatters: >-
      Without segmented cohort retention data, assessing customer lifetime value (LTV), soundbox hardware ROI, and net
      revenue retention across merchant tiers relies on management assertions rather than verified operational metrics.
    diligencePath: >-
      Request audited monthly active user (MAU) retention cohorts, soundbox rental collection rates, and merchant churn
      tables from PhonePe investor relations prior to final public offering.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: merchant-terminal-freeze-volume
    missingEvidence: >-
      Data on the aggregate transaction volume and merchant count impacted by law enforcement cybercrime account freezes
      (via 1930 complaints).
    whyItMatters: >-
      Directly affects merchant network durability, terminal churn, and dispute resolution overhead across the offline
      merchant network.
    diligencePath: Review internal risk management audit logs and merchant support escalation tickets during technical due diligence.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: npci-market-share-enforcement-schedule
    missingEvidence: >-
      Official regulatory timeline and technical enforcement roadmap from NPCI regarding the 30% volume cap on UPI
      TPAPs.
    whyItMatters: >-
      Enforcement of the cap would force PhonePe to curtail onboarding or divert transactions, directly depressing
      growth and valuation multiples.
    diligencePath: Engage with NPCI steering committee circulars and RBI payment system oversight public disclosures.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-preferences
    missingEvidence: >-
      Fully diluted share count, complete option pool, preference stack, lock-ups, allocation mechanics, and seller
      concentration for the contemplated IPO.
    whyItMatters: >-
      These terms determine dilution, liquidation outcomes, effective entry price, and whether the reported valuation is
      comparable with common equity.
    diligencePath: >-
      Obtain the primary offer documents, capitalization table, shareholder agreements, preference schedule, and
      allocation and lock-up terms from the company and lead banks.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: normalized-financials
    missingEvidence: >-
      Audited period revenue by segment, revenue-versus-ARR reconciliation, contribution margin, consolidated loss, net
      cash and debt, fraud losses, and normalized share-based compensation.
    whyItMatters: >-
      Without consistent denominators and balance-sheet data, comparable multiples cannot produce a reliable enterprise
      or equity value.
    diligencePath: >-
      Reconcile audited filings and management data-room schedules to the cited period metrics before building a
      scenario valuation.
    relatedQuestionRefs:
      - QV005
  - type: private-evidence-only
    severity: material
    topic: target-return
    missingEvidence: >-
      Proposed entry security, price per share, ownership percentage, investment size, holding period, follow-on
      requirements, and realizable exit assumptions.
    whyItMatters: >-
      A target return cannot be calculated from a company-level secondary valuation without investor-specific cash flows
      and security terms.
    diligencePath: >-
      Request a term sheet and build fully diluted base, upside, and downside cash-flow cases using primary
      capitalization and exit data.
    relatedQuestionRefs:
      - QV003
      - QV008
