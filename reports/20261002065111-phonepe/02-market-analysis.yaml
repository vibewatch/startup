callouts:
  - calloutType: insight
    title: Structural Divergence Between Volume Leadership and Fee Realization
    body: PhonePe's commanding 45.9% to 50% UPI volume share establishes immense consumer distribution and network defensibility, but the zero-MDR regulatory mandate forces economic value realization into peripheral software, Soundbox device rentals, and financial distribution.
    claimRefs:
      - CM003
      - CM004
      - CM007
  - calloutType: risk
    title: Regulatory Volume Cap Threat to Market Concentration
    body: NPCI's long-contemplated 30% market share cap on Third-Party Application Providers poses a structural regulatory ceiling on dominant market leaders, creating operational uncertainty regarding volume throttling or mandatory customer onboarding slowdowns.
    claimRefs:
      - CM005
      - CM009
      - CM013
