figures:
  - id: FM001
    title: Addressable market sizing layers and monetization conversion
    type: pyramid
    summary: Sizing pyramid illustrating the conversion funnel from gross payment throughput to fee-bearing merchant and financial services layers.
    data:
      items:
        - label: Gross Digital Payment Rails (TAM)
          value: 24.51
          unit: B monthly transactions
          detail: Total nationwide UPI ecosystem throughput processing 24.51 billion monthly transactions across retail and P2P payments in August 2026.
        - label: Retail Merchant Commerce Layer (SAM)
          value: 15.37
          unit: B monthly transactions
          detail: Person-to-merchant (P2M) retail commerce accounting for 62.7% of total UPI application throughput by 2025.
        - label: PhonePe Platform Throughput (SOM)
          value: 11.25
          unit: B monthly transactions
          detail: PhonePe platform volume representing 45.9% of total UPI transactions in August 2026 across 650M+ registered users.
        - label: Registered Consumer User Base
          value: 650.0
          unit: M registered users
          detail: Registered consumer accounts onboarded across Tier 1 through Tier 4 geographies by April 2026.
        - label: Monthly Active Consumer Base
          value: 200.0
          unit: M active consumers
          detail: More than 200 million monthly active users transacting across peer transfers, utility bill payments, and merchant checkouts.
        - label: Monetizable Merchant Acceptance Touchpoints
          value: 50.0
          unit: M merchant touchpoints
          detail: Nearly 50 million merchant acceptance touchpoints accessible for Soundbox subscriptions, payments gateway APIs, and credit distribution.
    approximationNotes: Monthly transaction values based on August 2026 NPCI statistics cited by Inc42; P2M share of 62.7% applied to transaction volumes; registered and active users and merchant touchpoints reflect disclosed network scale.
