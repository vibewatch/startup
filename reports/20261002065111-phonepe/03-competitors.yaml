    body: "PhonePe's primary strategic risk centers on NPCI's proposed 30% UPI market share cap with a 31 December 2026 deadline, alongside the withdrawal of the PIDF incentive scheme. Because UPI P2P payments generate negligible merchant discount rates, regulatory curbs on volume expansion force PhonePe to rapidly monetize merchant software, soundbox rentals, and financial product distribution."
