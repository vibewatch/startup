      - [Vehicle and service tiers, "Standard plus Venti and Black described in market evidence", "Standard, Speed Call, Green and Deluxe", "TADA reservations; I.M scope not fully documented", "Taxi operators can offer local fleet differentiation", "Rivals can target premium and planned trips"]
      - [Reservations, "Venti and Black reservations described", "Expanded beyond conventional midsize taxi", "TADA combines real-time dispatch and advance reservations", "Telephone dispatch can handle planned trips", "Reservation capability reduces pure app switching advantage"]
      - [Payments and workflow, "Automatic payment and Kakao ecosystem integration described", "Digital booking and payment implied; Korean depth not quantified", "Not established by assigned evidence", "Internal build can leverage existing identity and payments", "Corporate lock-in is plausible but unverified"]
      - [Autonomous mobility path, "30,000 km demonstration data and 150,000 object cases reported", "No equivalent Korean autonomy evidence in pool", "No equivalent evidence", "Automakers and autonomy specialists are credible entrants", "Future moat depends on commercialization, not pilots alone"]
    notes: "Cells marked as not quantified or not established are evidence gaps, not negative capability findings; the matrix mixes company-reported operating data with third-party reporting and must not be read as a controlled benchmark."
    claimRefs: [CP007, CP009, CP010, CP011, CP012, CP015]
