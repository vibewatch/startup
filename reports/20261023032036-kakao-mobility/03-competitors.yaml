    title: Pricing, packaging and switching comparison
    columns: [Offer or alternative, Price or contract model, Included capabilities, Discount or unknown, Competitive implication]
    rows:
      - [Kakao general taxi, "Regulated taxi fare framework; platform price detail not disclosed", "General dispatch, payment and broad network", "Realized take rate and discounts unknown", "Scale and convenience support retention, but pricing power is constrained"]
      - [Kakao premium and large vehicles, "Premium or branded fare structures; exact realized prices unknown", "Venti, Black and reservations", "List versus realized pricing unknown", "Monetizes differentiated willingness to pay"]
      - [Uber Taxi, "Fare and commission detail not in assigned evidence", "Standard, Speed Call, Green and Deluxe options", "Korean realized pricing and driver economics unknown", "Can attack high-value or international use cases"]
      - [TADA, "Price and commission detail not in assigned evidence", "Real-time dispatch and advance reservations", "Utilization and discounting unknown", "Reservation specialization can reduce switching for planned journeys"]
      - [I.M, "Price and contract detail not in assigned evidence", "Standard, taxi and business options", "Scale, pricing and retention unknown", "Potential niche alternative, but durability unproven"]
      - [Driver partner access, "Kakao allegedly required fees or data-sharing arrangements from some franchise operators", "Access to Kakao T demand and dispatch", "Legal outcome and future access rules unresolved", "Regulatory remedy could materially change rival economics"]
    notes: "Public sources in the assigned pool do not provide comparable realized prices, commissions, discounts or contract terms; null-like wording is retained instead of estimated values."
    claimRefs: [CP005, CP006, CP011, CP014, CP016]

figures:
  - id: FP001
    title: Competitive positioning by network density and differentiation breadth
    type: quadrant
    summary: Kakao leads on evidenced Korean network density, while rivals occupy narrower differentiated positions and the status quo remains outside the app-based scale comparison.
    data:
      xAxis:
        label: Differentiation breadth
        min: 0
        max: 1
      yAxis:
        label: Korean network density
        min: 0
        max: 1
      points:
        - {label: Kakao Mobility, x: 0.88, y: 0.96, note: "Ordinal evidence-backed placement from cited scale and multi-service coverage"}
        - {label: Uber Taxi, x: 0.78, y: 0.34, note: "Ordinal placement from product breadth and cited MAU comparison"}
        - {label: TADA, x: 0.67, y: 0.12, note: "Ordinal placement from reservation differentiation and cited MAU comparison"}
        - {label: I.M, x: 0.45, y: 0.11, note: "Ordinal placement; public capability and scale evidence is limited"}
        - {label: Street or telephone dispatch, x: 0.18, y: 0.55, note: "Status-quo availability is broad but app-based density is not comparable"}
        - {label: Autonomous entrants, x: 0.92, y: 0.04, note: "Likely entrant category; current Korean network evidence is unavailable"}
    approximationNotes: "Coordinates are analyst ordinal placements anchored to the cited evidence, not measured market shares or a claim that the axes are linear."
    claimRefs: [CP002, CP004, CP012, CP016]

callouts:
  - calloutType: strength
    title: Density is the incumbent moat
    body: Kakao's cited user and market-share lead, combined with reported dispatch performance, creates a self-reinforcing demand and supply advantage that smaller rivals must overcome before competing on feature parity.
    claimRefs: [CP009, CP013]
  - calloutType: risk
    title: Dominance can become a liability
    body: The alleged blocking of rival franchise calls and continuing scrutiny make partner access and regulatory remedies a direct competitive variable, not merely a legal footnote.
    claimRefs: [CP003, CP014, CP016]
  - calloutType: recommendation
    title: Underwrite segment-level competition
    body: The next diligence step should compare ride-level price, fulfillment, driver multi-homing and retention by service tier rather than treating Kakao's aggregate network lead as proof of durable economics.
    claimRefs: [CP010, CP011, CP016]

