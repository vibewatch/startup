      - [Navigate a trip, Enter destination and follow route guidance, Kakao Navi navigation service, Product is part of the large mobility data surface, Independent route-quality benchmark is unavailable]
      - [Park a shared bike safely, Photograph parked bike or scooter and assess placement, Gemini Nano multimodal classification on device, Seconds-level feedback and evaluation on more than 200 labeled images, Feature had not launched in the cited source]
