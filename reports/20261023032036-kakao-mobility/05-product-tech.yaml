      - ["Mobility data and service APIs", "Aggregate trip, navigation, bike, delivery, and parking signals", "Cloud infrastructure and data governance", "Data provenance, retention, and privacy controls need review"]
      - ["Cloud runtime", "Scalable deployment and traffic handling", "Google Kubernetes Engine and Google Cloud services", "Vendor concentration, cost elasticity, and SLO evidence are not public"]
      - ["Applied AI", "Image recognition and entity extraction", "Gemini Nano via ML Kit plus Gemini Flash fallback", "Accuracy, hallucination, and fallback economics require production telemetry"]
      - ["Parking operations", "Payments, access, recognition, and facility control", "Parking-lot systems, digital twins, maps, and partner facilities", "Integration depth and smart-city contract conversion are unverified"]
      - ["Autonomous-driving program", "Fleet control, mapping, and vehicle testing", "Permits, test vehicles, driving data, and safety operators", "13,000 km is below the cited 15,000 km permit threshold and competitor data lead is material"]
    notes: "Architecture is limited to components explicitly described in assigned sources; unreported services, proprietary models, and security controls are not inferred."
    claimRefs: [CE005, CE013]
