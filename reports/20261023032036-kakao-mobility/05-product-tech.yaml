      - [Exit a parking facility, Use parking pass and automatic payment, Kakao T Parking platform and operations, Exit intervals reportedly fell by up to about 20% in analysis of 1.62 million records, Attribution and counterfactual design are not public]
    notes: "Benefits are reported by the cited company or technology partner unless otherwise noted; comparable independent benchmarks and denominators remain open."
    claimRefs: [CE002, CE009, CE010, CE014, CE015]
