  name: Kakao Mobility
chapter:
  number: 5
  title: Product & Technology
  summary: Kakao Mobility operates a broad mobility platform whose strongest public technical proof is in cloud-native reliability, cross-platform delivery, and on-device AI. The evidence also shows a material maturity gap in autonomous driving, where deployment permits, driving data, and competitor comparisons remain unresolved.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: Kakao Mobility's product is a multi-service mobility layer rather than a single ride-hailing feature. The Kakao T app spans taxi-hailing, navigation, bike and scooter sharing, parking, and parcel delivery, while Kakao T and Kakao Navi together serve more than 30 million people according to Flutter's case study. The workflow starts with a user request or trip context, then combines matching, navigation, payments, parking or delivery operations, and partner or driver execution. This breadth creates cross-service distribution, but it also means product maturity must be assessed by module rather than inferred from the flagship app's scale.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-reliability
    title: Architecture, deployment, and reliability
    body: "Public technical evidence supports a cloud-native operating model built around Google Kubernetes Engine, DORA practices, and cross-platform application delivery. Google Cloud reports that Kakao Mobility modernized traditional infrastructure with GKE, used Kubernetes to streamline deployments and scalability, and added Event Management Service for peak traffic. The same case study reports improved lead time, change-failure rate, deployment frequency, and time to restore service, but it does not provide baseline values or an independently audited service-level objective. Flutter adds a separate portability layer: one code base served Android, iOS, and partial web requirements for k.ride, reducing the need for separate platform UI work."
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: applied-ai-and-roadmap
    title: Applied AI and roadmap maturity
    body: "The strongest current product-technology proof is applied AI in constrained workflows. Kakao Mobility used Gemini Nano through ML Kit's GenAI Prompt API for bike-parking image checks and delivery-address extraction, evaluated roughly 200 examples for each use case, and added a cloud Gemini Flash fallback for address extraction. The address feature reportedly reduced delivery-order completion time by 24% and increased conversion by 45% for new users and 6% for existing users; the parking feature was not yet launched in the source text. By contrast, autonomous driving remains a roadmap and capability-building effort: an independent 2026 report says six vehicles accumulated 13,000 km, below the 15,000 km permit threshold, and that Kakao Mobility was not selected for one demonstration project."
    claimRefs: [CE009, CE010, CE011, CE012, CE013]
  - id: differentiation-and-risk
    title: Differentiation, trust, and technical risks
    body: "Differentiation is strongest where Kakao Mobility combines a large operational data surface with platform control, fleet management, and workflow integration. Google Cloud describes mobility data from taxis, navigation, shared bikes, and delivery as a source for understanding trips and supporting innovation; DigitalToday reports 1.62 million parking-related records used in analysis and up to a 20% reduction in exit intervals, but these are company-presented or partner-presented claims rather than an external benchmark. Trust controls are visible in the on-device AI design: the Android case says photos remain on the device for parking analysis, while the address feature was tested for hallucinations and had a cloud fallback. Countervailing risks include antitrust remedies, a reported 96% taxi-hailing share in 2022, and autonomous-driving gaps in permits, data, patents, and senior technical talent."
    claimRefs: [CE014, CE015, CE017]
callouts:
  - calloutType: strength
    title: Operational technology is more proven than frontier autonomy
    body: The public record supports production-oriented cloud, mobile, and applied-AI capabilities, while autonomous-driving readiness remains less mature and more exposed to permitting and data-accumulation constraints.
    claimRefs: [CE005, CE009, CE012, CE013]
  - calloutType: risk
    title: Platform scale does not settle technical defensibility
    body: A large installed user and trip base can support fleet-control learning, but it does not by itself prove autonomous-driving readiness, independent performance, or regulatory clearance.
    claimRefs: [CE002, CE013, CE017]
