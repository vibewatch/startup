company:
  name: Kakao Mobility
chapter:
  number: 4
  title: Financials
  summary: Public evidence indicates multiple fee pools and meaningful mobility scale, but it does not disclose Kakao Mobility's standalone cash, gross margin, burn, or runway. Regulation now pressures taxi-franchise revenue, while conflicting descriptions of a proposed US offering leave its capital benefit unresolved.
sections:
  - id: revenue-model
    title: Revenue model and public traction
    body: Kakao Mobility's public financial surface is a mix of taxi-platform economics and less mature adjacent services rather than a single recurring-revenue model. Aju Press reported 50.9 billion won of first-quarter 2026 revenue for Kakao's consolidated "Other Platform" segment, up 30% year over year but below 52.8 billion won in the prior quarter; that segment is not a standalone Kakao Mobility result. Historical reporting identified corporate per-trip fees, payment fees, and parking-operator fees as possible monetization routes. More recent parking evidence demonstrates operational activity, but not realized revenue or gross profit. Tracxn's $500 million-to-$1 billion 2025 revenue range is third-party market data, not audited standalone disclosure, so revenue mix and recognition remain underwriting gaps.
    claimRefs: [CI001, CI003, CI004, CI007, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-margin
    title: Pricing, recognition, and margin pressure
    body: The most concrete disclosed commercial terms concern affiliated taxi operators. Korea JoongAng Daily reported that Kakao Mobility pays operators 16% to 17% of fare revenue for services including driving-data sharing, while subsidiary KM Solutions receives 20% for dispatch, maintenance, and quality management. The FSS view was that the linked contracts should be treated as one arrangement and only the commission difference recognized as revenue; Kakao Mobility disputed that interpretation. Separately, a law effective May 11, 2026 prohibited fees on idle-taxi fares. Market estimates cited by Aju Press put the exposure at 15% to 20% of prior franchise fees, about 30 billion won annually. Neither item establishes current gross margin, CAC, payback, working capital, or service-delivery cost.
    claimRefs: [CI005, CI006, CI008, CI009, CI010]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: Reported cumulative funding cannot be treated as cash available. Tracxn lists $989 million raised across seven rounds, but supplies no current cash, burn, debt, or use-of-funds bridge. KED Global and Yonhap reported a confidential US filing seeking roughly $1 billion; Briefs.co instead described the proposed ADRs as representing only TPG's stake, which would make the deal primarily secondary liquidity rather than operating capital. An April report also described Uber diligence on a controlling stake at an estimated 5.5 trillion won valuation. These reports show potential financing and liquidity paths, not completed proceeds. Until the filing, primary-secondary split, balance sheet, debt schedule, and monthly cash flow are available, no defensible runway or next-round trigger can be calculated.
    claimRefs: [CI002, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence threshold
    body: The financial case merits a disclosure discount. Grab's public FY2025 profile illustrates that a scaled mobility peer can report positive gross and operating margins while still posting slightly negative free-cash-flow margin, but those figures are context rather than a benchmark for Kakao Mobility. Uber's much larger public market capitalization likewise says nothing about Kakao Mobility's own valuation support without comparable audited accounts. Kakao Mobility does have diversification options in parking and other services, yet the assigned evidence does not show their contribution to revenue or margin. Regulatory fines, a challenged revenue-recognition method, taxi-fee pressure, and uncertainty over whether a listing funds the company make audited standalone statements and product-level unit economics prerequisites to underwriting.
    claimRefs: [CI009, CI010, CI012, CI014, CI015, CI016]
callouts:
  - calloutType: strength
    title: Multiple monetization routes
    body: Taxi activity, corporate trips, payments, and parking can support different fee pools, but public evidence quantifies only part of the taxi exposure.
    claimRefs: [CI003, CI007, CI008, CI016]
  - calloutType: risk
    title: Revenue quality is unsettled
    body: Regulatory limits on idle-taxi fees and the FSS gross-versus-net accounting view can reduce reported revenue without providing enough data to model the margin impact.
    claimRefs: [CI005, CI006, CI009]
  - calloutType: recommendation
    title: Require a standalone finance pack
    body: Underwriting should wait for audited accounts, product-level price and cost bridges, current cash and debt, and the primary-versus-secondary structure of any offering.
    claimRefs: [CI001, CI011, CI012]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism or unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Taxi platform and franchise, "Dispatch and franchise-related fees", "Other Platform segment revenue is disclosed only within Kakao consolidated results", "Kakao Mobility mix and net recognition are unavailable", "Standalone bookings, recognized revenue, take rate, incentives, and settlement flows"]
      - [Corporate mobility, "Historically proposed fee per employee trip", "Current contracts and realized pricing are not disclosed", "Historical proposed mechanism, not verified current revenue", "Rate cards, discounts, contracted accounts, usage, and contribution margin"]
      - [Payments, "Historically proposed card-company fee through Kakao Pay", "Current payment revenue is not disclosed", "Mechanism was proposed in 2017", "Payment volume, processor costs, net take rate, and related-party terms"]
      - [Parking and adjacent services, "Operator fees plus platform, operations, and facilities services", "Operational expansion is evidenced; financial contribution is not", "Usage evidence does not establish revenue or gross profit", "Locations, contract types, realized fees, capex, utilization, and churn"]
    notes: "Rows distinguish reported activity from realized revenue; undisclosed values are evidence gaps rather than zeroes, and the Kakao Other Platform segment is not a standalone Kakao Mobility measure."
    claimRefs: [CI003, CI004, CI007, CI016]
  - id: TI002
    title: Pricing, recognition, and unit-economics evidence
    columns: [Item, Disclosed value or status, Confidence, Financial implication, Diligence ask]
    rows:
      - [Affiliated-operator service payment, "16%-17% of fare revenue paid by Kakao Mobility", medium, "A material contractual outflow whose classification affects net economics", "Contracts, covered fares, service cost, settlement timing, and related-party analysis"]
      - [KM Solutions franchise receipt, "20% of fare revenue received from operators", medium, "Gross-versus-net treatment can change reported revenue and margin presentation", "Principal-agent memo, auditor conclusion, and historical reconciliation"]
      - [Idle-taxi franchise fees, "Collection prohibited from May 11, 2026", medium, "Narrows a previously available fee base", "Affected rides, current fee base, mitigation, and realized post-law revenue"]
      - [Estimated annual exposure, "15%-20% of prior franchise fees; about KRW30B annually", medium, "Directional revenue pressure, not an EBITDA or cash-flow estimate", "Source denominator, audited impact, cost offsets, and sensitivity range"]
    notes: "The KRW30 billion and 15%-20% figures are market estimates cited by Aju Press; they are not company guidance and cannot be converted into margin without the missing denominator and cost base."
    claimRefs: [CI005, CI006, CI008, CI009]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - [Kakao Mobility 2025 revenue, "$500M-$1B range from Tracxn", low, "Wide third-party range does not establish audited revenue quality", "Audited standalone statements and bridge to Kakao consolidated reporting"]
      - [Cumulative funding, "$989M across 7 rounds from Tracxn", medium, "Capital raised is not current cash or runway", "Cash ledger, distributions, acquisitions, debt, and use of proceeds"]
      - [Proposed US offering, "About $1B reported; primary-versus-secondary descriptions conflict", medium, "Secondary liquidity would not fund operations", "Registration statement, share seller, primary proceeds, fees, and timetable"]
      - ["Cash, burn, runway, and debt", null, low, "Capital adequacy cannot be calculated", "Balance sheet, monthly cash flow, debt schedule, covenants, leases, and 24-month forecast"]
      - [Grab FY2025 context, "39.67% gross margin; 2.37% operating margin; -0.53% FCF margin", medium, "Shows peer margin layers can diverge; not a Kakao Mobility benchmark", "Use only after normalizing revenue recognition, geography, mix, and incentives"]
      - [Regulatory penalties reported in 2024, "KRW15.1B antitrust fine and KRW3.4B accounting-related fine", medium, "Cash and governance burdens sit outside operating unit economics", "Payment status, appeals, provisions, and remaining exposure"]
    notes: "Null means no assigned public source disclosed the metric. Peer figures are context only, not independent verification or an estimate of Kakao Mobility economics."
    claimRefs: [CI001, CI002, CI010, CI011, CI012, CI014]
