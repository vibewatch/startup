        - {from: platform, to: taxi-fees}
        - {from: platform, to: corporate-payment}
        - {from: platform, to: parking}
        - {from: taxi-fees, to: recognized-profit}
        - {from: corporate-payment, to: recognized-profit}
        - {from: parking, to: recognized-profit}
    approximationNotes: "This is a qualitative mechanism map, not a proportional funnel or quantitative waterfall; no conversion rate, revenue mix, or margin is inferred."
    claimRefs: [CI003, CI005, CI007, CI008, CI009, CI016]
