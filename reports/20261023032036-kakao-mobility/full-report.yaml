  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The investable core is South Korean e-hailing: digital discovery, dispatch, reservation, and payment for
              licensed taxi journeys. This boundary excludes public-transit fares, private-car economics, parking
              operations, EV charging, and autonomous-driving technology sold independently, although each can become an
              adjacency for Kakao Mobility. Knowledge Sourcing Intelligence estimates this core at USD 1.60 billion in
              2026, rising to USD 2.00 billion in 2031 at a 4.6% CAGR. IMARC estimates the broader South Korean MaaS
              market at USD 172.6 million in 2025 and USD 1,238.6 million in 2034 at 23.75% CAGR. The differing
              definitions, vintages, and counterintuitive relative scale mean these are separate lenses, not a nested
              TAM/SAM stack. Public evidence does not isolate Kakao Mobility's transaction value, net revenue pool, or
              attainable share, so a precise SOM would be false precision.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM014
      - number: '2.2'
        title: Buyers, Users, and Payers
        blocks:
          - type: paragraph
            body: >-
              Individual riders are the dominant end users and usually the direct payers, while corporate buyers value
              centralized billing, reservations, policy controls, and electronic trip records. Knowledge Sourcing
              Intelligence estimates individual consumers at about 82% and corporate customers at about 13% of 2026
              e-hailing market value, with government and other users forming the balance. International travelers are a
              distinct acquisition segment because language, local identity, and payment friction can block adoption;
              the Korea Tourism Organization highlights fare previews and Kakao Mobility's multilingual k.ride product
              with overseas-card support. Drivers and licensed taxi operators are supply-side participants rather than
              end-market buyers, but dispatch density and acceptable platform terms determine fulfillment.
              Municipalities and transport regulators shape operating permissions and autonomous-service rollout, making
              adoption a multi-sided process rather than a simple consumer-app sale.
            claimRefs:
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.3'
        title: Adoption Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              Network density is the principal adoption advantage. A 2025 operating-data summary reports 6.6-second
              average dispatch and a 94% boarding-success rate for Kakao T, while historical reporting describes how
              matching algorithms addressed temporal and geographic supply-demand mismatch. Scale indicators
              nevertheless require careful denominators: 2024 reporting cited more than 23 million registered users and
              a 98% share, another report cited a 96% 2022 share and 13.2 million monthly active users, and Yonhap
              reported more than 30 million app users in 2026. These are not interchangeable. Growth should come from
              deeper digital capture, reservations, premium vehicles, corporate travel, tourism, and adjacent parking
              workflows. Constraints include regulated fares, strong public-transport substitutes, driver availability,
              antitrust intervention, and the capital and authorization needed for autonomous fleets.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Adoption Timing and Valuation Implications
        blocks:
          - type: paragraph
            body: >-
              The market supports a durable domestic transaction layer, but market leadership should not be capitalized
              as an uncontested perpetual share. The KFTC fine over competitor access shows that distribution power can
              trigger remedies that affect platform terms and data access. Autonomous mobility is a longer-duration
              option: Korea JoongAng Daily reported that Kakao Mobility missed a 2026 demonstration-city selection and
              had not yet met the mileage threshold for a temporary driverless permit, despite useful fleet-control
              capabilities. Company-reported parking analysis suggests cross-sell potential, but it does not establish
              independent revenue or ROI. Overseas expansion could enlarge the addressable market, yet reported
              acquisition ambitions carried financing and execution uncertainty. Valuation work should therefore use the
              bounded e-hailing forecast as a reference, treat MaaS and autonomous opportunities as option value, and
              require private cohort, take-rate, and unit-economics data before assigning a company-specific SOM.
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A large platform share is not a company SOM
            body: >-
              Reported market-share and user metrics use different years and denominators, while public sources omit
              Kakao Mobility's gross bookings, take rate, segment revenue, and contribution margin. Regulatory remedies
              and the autonomous-technology transition could also change the addressable economics.
            calloutType: risk
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility competes across several layers rather than against one homogeneous rival set. The core
              direct alternatives are Uber Taxi, TADA and I.M, while premium and fleet-specific services compete for the
              same rider occasions. Status-quo substitutes include street hailing, telephone dispatch and taxi
              operators' own channels; internal build is also feasible for large platforms that already control
              identity, payments or maps. Tracxn lists 24 active competitors and names Uber, I.M and TADA among Kakao
              Mobility's top competitors, but its ranking is a commercial database signal, not a verified market-share
              survey. Independent market evidence describes mobile booking as the principal interface and indicates that
              TADA, Uber Taxi and Kakao T all extend beyond basic dispatch into reservations or differentiated vehicle
              tiers. This makes distribution, supply density and service breadth the relevant competitive dimensions,
              not app features in isolation.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP012
              - CP016
      - number: '3.2'
        title: Rival profiles and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility's direct rivals have different attack vectors. Uber brings global brand, cross-border
              experience and a willingness to deepen its Korean footprint; the independent market review identifies
              Standard, Speed Call, Green electric and Deluxe options. TADA and I.M are narrower local alternatives with
              differentiated fleet or service positioning, but public evidence in this pool does not establish their
              funding, profitability or sustainable scale. Tmoney GO Onda is an incumbent-adjacent alternative because
              its taxi-industry participation and payment infrastructure can support app and regional call-dispatch
              services. Kakao's own strategic response is to extend platform data and dispatch know-how into autonomous
              driving and physical AI, which could widen the moat if commercial execution follows, but also exposes it
              to Waymo, Baidu, automakers and specialized autonomy suppliers.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.3'
        title: Buyer trade-offs, pricing and switching
        blocks:
          - type: paragraph
            body: >-
              Buyers choose a mobility platform on expected pickup reliability, breadth of vehicle and reservation
              options, payment convenience, geographic coverage, safety and regulatory trust. The South Korea e-hailing
              evidence reports Kakao T dispatch time of 6.6 seconds and boarding success of 94% in the first half of
              2025; these figures reproduce company-reported operating data in a market report, not an independently
              audited comparison. Uber Taxi's differentiated products and TADA's reservation orientation can therefore
              win selected use cases even if Kakao retains the broadest network. Switching is low for a casual rider who
              can install another app, but higher for drivers and corporate users because demand, dispatch history,
              automatic payment, account controls and workflow integration compound over time. Multi-homing remains
              practical, so loyalty is conditional on service quality and fair access rather than contractual lock-in.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP011
              - CP014
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              Kakao's strongest defensibility is density: a large rider base attracts drivers, which improves matching,
              which in turn makes the platform more useful. TechCrunch cited a KFTC statement placing Kakao at 96% of
              the Korean taxi-hailing market in 2022; separately, its December 2024 article reported an October
              comparison of 13.2 million monthly active users for Kakao, versus 700,000 for Uber, 6,400 for TADA and
              5,800 for I.M. That scale is a formidable starting point, but it creates regulatory exposure rather than
              immunity. Prosecutors in 2026 alleged that Kakao blocked dispatch calls to drivers linked to smaller
              franchise operators; the report says the general-call share had exceeded 90% since around 2019 and
              describes alleged economic harm to drivers and a smaller operator. Kakao denies wrongdoing and says the
              arrangements addressed free-riding and service quality. The unresolved legal and partner-access question
              is material: an enforced opening of the network could lower switching friction for Uber, TADA and I.M,
              while autonomous vehicles could shift bargaining power toward capital-rich automakers and autonomy
              platforms. A regulatory tracker records that the KFTC's final December 2024 fine was KRW 15.1 billion,
              revised from the earlier KRW 72.4 billion amount, underscoring that the remedy and amount must be tied to
              the specific proceeding and date.
            claimRefs:
              - CP003
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits distinguish sourced facts from unknowns. Public evidence is stronger on network scale, market
              structure, regulatory posture and product direction than on realized prices, driver economics, churn or
              rival contribution margins. Unknown cells are deliberate: the available sources do not justify filling
              them with inferred rankings. The competitive conclusion is consequently asymmetric. Kakao has a
              substantial incumbent advantage in Korean demand and supply coordination, while rivals can attack specific
              segments through premium service, global distribution, fleet differentiation, reservations or autonomy. A
              refreshed diligence process should seek like-for-like ride-level pricing, cohort retention, driver
              multi-homing, channel economics and outcome data from the continuing regulatory proceedings.
            claimRefs:
              - CP002
              - CP006
              - CP011
              - CP016
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Density is the incumbent moat
            body: >-
              Kakao's cited user and market-share lead, combined with reported dispatch performance, creates a
              self-reinforcing demand and supply advantage that smaller rivals must overcome before competing on feature
              parity.
            calloutType: strength
            claimRefs:
              - CP009
              - CP013
          - type: callout
            title: Dominance can become a liability
            body: >-
              The alleged blocking of rival franchise calls and continuing scrutiny make partner access and regulatory
              remedies a direct competitive variable, not merely a legal footnote.
            calloutType: risk
            claimRefs:
              - CP003
              - CP014
              - CP016
          - type: callout
            title: Underwrite segment-level competition
            body: >-
              The next diligence step should compare ride-level price, fulfillment, driver multi-homing and retention by
              service tier rather than treating Kakao's aggregate network lead as proof of durable economics.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility's public financial surface is a mix of taxi-platform economics and less mature adjacent
              services rather than a single recurring-revenue model. Aju Press reported 50.9 billion won of
              first-quarter 2026 revenue for Kakao's consolidated "Other Platform" segment, up 30% year over year but
              below 52.8 billion won in the prior quarter; that segment is not a standalone Kakao Mobility result.
              Historical reporting identified corporate per-trip fees, payment fees, and parking-operator fees as
              possible monetization routes. More recent parking evidence demonstrates operational activity, but not
              realized revenue or gross profit. Tracxn's $500 million-to-$1 billion 2025 revenue range is third-party
              market data, not audited standalone disclosure, so revenue mix and recognition remain underwriting gaps.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI007
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI008
              - CI009
              - CI016
      - number: '4.2'
        title: Pricing, recognition, and margin pressure
        blocks:
          - type: paragraph
            body: >-
              The most concrete disclosed commercial terms concern affiliated taxi operators. Korea JoongAng Daily
              reported that Kakao Mobility pays operators 16% to 17% of fare revenue for services including driving-data
              sharing, while subsidiary KM Solutions receives 20% for dispatch, maintenance, and quality management. The
              FSS view was that the linked contracts should be treated as one arrangement and only the commission
              difference recognized as revenue; Kakao Mobility disputed that interpretation. Separately, a law effective
              May 11, 2026 prohibited fees on idle-taxi fares. Market estimates cited by Aju Press put the exposure at
              15% to 20% of prior franchise fees, about 30 billion won annually. Neither item establishes current gross
              margin, CAC, payback, working capital, or service-delivery cost.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Reported cumulative funding cannot be treated as cash available. Tracxn lists $989 million raised across
              seven rounds, but supplies no current cash, burn, debt, or use-of-funds bridge. KED Global and Yonhap
              reported a confidential US filing seeking roughly $1 billion; Briefs.co instead described the proposed
              ADRs as representing only TPG's stake, which would make the deal primarily secondary liquidity rather than
              operating capital. An April report also described Uber diligence on a controlling stake at an estimated
              5.5 trillion won valuation. These reports show potential financing and liquidity paths, not completed
              proceeds. Until the filing, primary-secondary split, balance sheet, debt schedule, and monthly cash flow
              are available, no defensible runway or next-round trigger can be calculated.
            claimRefs:
              - CI002
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence threshold
        blocks:
          - type: paragraph
            body: >-
              The financial case merits a disclosure discount. Grab's public FY2025 profile illustrates that a scaled
              mobility peer can report positive gross and operating margins while still posting slightly negative
              free-cash-flow margin, but those figures are context rather than a benchmark for Kakao Mobility. Uber's
              much larger public market capitalization likewise says nothing about Kakao Mobility's own valuation
              support without comparable audited accounts. Kakao Mobility does have diversification options in parking
              and other services, yet the assigned evidence does not show their contribution to revenue or margin.
              Regulatory fines, a challenged revenue-recognition method, taxi-fee pressure, and uncertainty over whether
              a listing funds the company make audited standalone statements and product-level unit economics
              prerequisites to underwriting.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple monetization routes
            body: >-
              Taxi activity, corporate trips, payments, and parking can support different fee pools, but public evidence
              quantifies only part of the taxi exposure.
            calloutType: strength
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI016
          - type: callout
            title: Revenue quality is unsettled
            body: >-
              Regulatory limits on idle-taxi fees and the FSS gross-versus-net accounting view can reduce reported
              revenue without providing enough data to model the margin impact.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI009
          - type: callout
            title: Require a standalone finance pack
            body: >-
              Underwriting should wait for audited accounts, product-level price and cost bridges, current cash and
              debt, and the primary-versus-secondary structure of any offering.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility's product is a multi-service mobility layer rather than a single ride-hailing feature. The
              Kakao T app spans taxi-hailing, navigation, bike and scooter sharing, parking, and parcel delivery, while
              Kakao T and Kakao Navi together serve more than 30 million people according to Flutter's case study. The
              workflow starts with a user request or trip context, then combines matching, navigation, payments, parking
              or delivery operations, and partner or driver execution. This breadth creates cross-service distribution,
              but it also means product maturity must be assessed by module rather than inferred from the flagship app's
              scale.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE009
              - CE010
              - CE014
              - CE015
      - number: '5.2'
        title: Architecture, deployment, and reliability
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence supports a cloud-native operating model built around Google Kubernetes Engine,
              DORA practices, and cross-platform application delivery. Google Cloud reports that Kakao Mobility
              modernized traditional infrastructure with GKE, used Kubernetes to streamline deployments and scalability,
              and added Event Management Service for peak traffic. The same case study reports improved lead time,
              change-failure rate, deployment frequency, and time to restore service, but it does not provide baseline
              values or an independently audited service-level objective. Flutter adds a separate portability layer: one
              code base served Android, iOS, and partial web requirements for k.ride, reducing the need for separate
              platform UI work.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE006
              - CE009
              - CE014
      - number: '5.3'
        title: Applied AI and roadmap maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest current product-technology proof is applied AI in constrained workflows. Kakao Mobility used
              Gemini Nano through ML Kit's GenAI Prompt API for bike-parking image checks and delivery-address
              extraction, evaluated roughly 200 examples for each use case, and added a cloud Gemini Flash fallback for
              address extraction. The address feature reportedly reduced delivery-order completion time by 24% and
              increased conversion by 45% for new users and 6% for existing users; the parking feature was not yet
              launched in the source text. By contrast, autonomous driving remains a roadmap and capability-building
              effort: an independent 2026 report says six vehicles accumulated 13,000 km, below the 15,000 km permit
              threshold, and that Kakao Mobility was not selected for one demonstration project.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Differentiation, trust, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Differentiation is strongest where Kakao Mobility combines a large operational data surface with platform
              control, fleet management, and workflow integration. Google Cloud describes mobility data from taxis,
              navigation, shared bikes, and delivery as a source for understanding trips and supporting innovation;
              DigitalToday reports 1.62 million parking-related records used in analysis and up to a 20% reduction in
              exit intervals, but these are company-presented or partner-presented claims rather than an external
              benchmark. Trust controls are visible in the on-device AI design: the Android case says photos remain on
              the device for parking analysis, while the address feature was tested for hallucinations and had a cloud
              fallback. Countervailing risks include antitrust remedies, a reported 96% taxi-hailing share in 2022, and
              autonomous-driving gaps in permits, data, patents, and senior technical talent.
            claimRefs:
              - CE014
              - CE015
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational technology is more proven than frontier autonomy
            body: >-
              The public record supports production-oriented cloud, mobile, and applied-AI capabilities, while
              autonomous-driving readiness remains less mature and more exposed to permitting and data-accumulation
              constraints.
            calloutType: strength
            claimRefs:
              - CE005
              - CE009
              - CE012
              - CE013
          - type: callout
            title: Platform scale does not settle technical defensibility
            body: >-
              A large installed user and trip base can support fleet-control learning, but it does not by itself prove
              autonomous-driving readiness, independent performance, or regulatory clearance.
            calloutType: risk
            claimRefs:
              - CE002
              - CE013
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility serves several connected customer groups rather than one homogeneous account base. Consumer
              riders use Kakao T for taxi-hailing and adjacent services; drivers and taxi operators supply the
              marketplace; delivery personnel and small businesses use parcel-ordering workflows; and parking operators
              or smart-city sponsors can buy operating technology. The platform model gives Kakao a broad demand
              surface, but the public record does not disclose the mix of users who are merely registered, monthly
              active, paying, or repeat users. TechTimes describes Kakao T as the routing layer for an autonomous
              service and says 31 million Koreans already use it, while Yonhap separately reports more than 30 million
              users. These figures indicate scale but are not equivalent denominators or retention measures. The
              customer thesis therefore rests on high distribution reach plus cross-service optionality, not on a
              disclosed net-retention metric.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
      - number: '6.2'
        title: Adoption trajectory and observed outcomes
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is operational rather than cohort-based. Seoul's Gangnam autonomous
              service reportedly recorded more than 15,000 rides from its September 2024 launch and 6,176 paid rides
              after fares began in April 2026; the same account reports 82.5% vehicle utilization and 97% of late-night
              autonomous users entering through Kakao T. Kakao Mobility's parking presentation adds a second workflow:
              analysis of about 1.62 million parking-related records was associated with exit intervals falling by up to
              about 20%, although the result is presented by the company and the independent methodology is not
              supplied. A Google-published case study reports a 24% reduction in delivery-order completion time and
              conversion increases of 45% for new users and 6% for existing users after an on-device address-entry
              improvement. These are useful product-use signals, but they do not establish recurring revenue, renewal,
              or causal lift across the whole customer base.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports expansion from taxi-hailing into parking, delivery, bikes, navigation, and
              autonomous mobility, but it is incomplete on durability. The platform's reach can lower customer
              acquisition friction for new mobility categories: autonomous rides were exposed inside the existing Kakao
              T interface, and the Android case study says delivery-order improvements were used by small business
              owners. At the same time, dependence on Kakao T's dominant position creates customer and regulatory
              concentration. TechCrunch reports 13.2 million monthly active users in October in a local-media comparison
              and a 96% taxi-hailing share in 2022, while also describing the KFTC's finding that access conditions for
              franchise competitors were linked to fees or data-sharing. The public sources do not provide churn, gross
              retention, contract length, top-account revenue, or a customer-level concentration table. Those gaps limit
              confidence that distribution advantage will translate into durable, independently monetized customer
              relationships.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the clearest customer asset
            body: >-
              Existing Kakao T reach appears to lower onboarding friction for adjacent mobility services, with
              autonomous rides and delivery workflows showing concrete use or outcome signals.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU008
          - type: callout
            title: Retention and concentration remain unproven
            body: >-
              The assigned evidence does not disclose cohort retention, churn, contract duration, top-customer revenue,
              or a consistent active-user denominator; platform dominance also increases regulatory and channel
              concentration exposure.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory conduct dominates the residual-risk ranking
        blocks:
          - type: paragraph
            body: >
              The risk register is led by platform-access conduct because the evidence spans an earlier antitrust
              sanction, a still-contested administrative case, and a January 2026 criminal indictment of the company and
              executives. Prosecutors alleged that access restrictions affected more than 15,000 rival-affiliated driver
              accounts and coincided with Kakao Mobility's franchise-call share rising from 55% to 79%. The company
              denies an intent or action to restrict competition, but public mitigation evidence is limited to that
              defense and a commitment to litigate and operate transparently. Accounting disclosure ranks next: a
              separate regulator fine and referral were reported, although prosecutors later said criminal liability
              could not be established on the inflated-sales allegation. Labor classification and transaction execution
              are medium-high risks; parking expansion is lower, but still pilot-stage in the allocated evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR011
              - CR014
              - CR016
      - number: '7.2'
        title: Legal exposure is active, multi-track, and not fully mitigated
        blocks:
          - type: paragraph
            body: >
              Korea JoongAng Daily reported that prosecutors indicted Kakao Mobility, its chief executive, and other
              executives over alleged blocking of rival-affiliated ride requests. The same report says the company
              disputes the charges and that administrative litigation is underway. That proceeding follows a competition
              penalty whose amount changed over time: Nikkei reported the original KRW 72.4 billion action in October
              2024, while TechCrunch later reported a reduced KRW 15.1 billion fine after the earlier calculation
              overstated operating profit. The accounting track is separate and nuanced: TechCrunch reported a KRW 3.4
              billion Financial Services Commission fine and referral, while JoongAng reported that prosecutors did not
              establish criminal liability on the inflated-sales allegation. Labor exposure is forward-looking rather
              than company-specific: minimum-wage treatment, presumptive worker status, and an expanded definition of
              employer can change obligations for platform-directed work. Exact Kakao Mobility cost sensitivity remains
              a diligence gap.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Operating expansion is visible, but control evidence is incomplete
        blocks:
          - type: paragraph
            body: >
              The allocated evidence shows product execution in parking, not comprehensive operating resilience.
              DigitalToday reported that Kakao Mobility presented automatic-payment, cloud-control, AI-recognition,
              digital-twin, and mapping capabilities, and said it had signed a proof-of-concept contract for the Diriyah
              smart-city project. Those facts support technical breadth and a route to international deployment, but
              they do not establish repeat contracts, margins, uptime, cybersecurity controls, or fleet-wide safety
              performance. Driver-account suspension allegations also make access governance an operational control
              issue rather than only a legal issue: policy implementation can affect marketplace supply, partner
              economics, and service trust. Reliability, breach, safety, and incident-history diligence therefore
              remains open; the absence of a cited incident in this allocated pool is not evidence that no incident
              occurred.
            claimRefs:
              - CR002
              - CR003
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR013
      - number: '7.4'
        title: Sponsor liquidity and disclosure quality shape the downside case
        blocks:
          - type: paragraph
            body: >
              Reported transaction paths create governance and financing uncertainty. Yonhap and a Korea Herald
              syndication reported that Kakao Mobility was said to have confidentially filed for a US listing and sought
              about US$1 billion, but the company declined to comment; the same reporting noted that a 2022 domestic
              listing attempt failed amid regulatory scrutiny. Separately, Investing.com reported that Uber was
              reviewing a controlling-stake acquisition and conducting due diligence, including stakes held by TPG and
              Carlyle plus part of Kakao Corp.'s position. These are reported possibilities, not completed financing,
              and neither establishes cash available to Kakao Mobility. Tracxn's funding and revenue figures are
              third-party estimates rather than audited standalone disclosure. Thesis-break triggers are a final conduct
              remedy that structurally impairs marketplace economics, a material accounting restatement or control
              failure, worker-status changes that cannot be offset operationally, or a transaction that increases
              governance complexity without strengthening company liquidity.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Conduct remediation is the primary thesis risk
            body: >-
              A final remedy that mandates broad neutral access, materially reduces monetization, or establishes
              executive liability would move the risk from episodic fines to a structural business-model constraint.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Transaction headlines do not equal company liquidity
            body: >-
              A confidential filing, a reported fundraising target, or a proposed stake acquisition does not identify
              primary proceeds, completed financing, or cash available to Kakao Mobility.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
          - type: callout
            title: Documentary diligence is a condition to underwriting
            body: >-
              Require the complete legal dockets, audited standalone accounts, access-policy audit, worker-cost
              sensitivity, incident registers, and transaction documents before treating the risk posture as mitigated.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and price discipline
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility has a credible scale-and-platform thesis: TechCrunch reported a 96% taxi-hailing market
              share in 2022 and 13.2 million monthly active users, while the company describes a broader parking and
              mobility infrastructure strategy. The strongest current financing signal is not a completed primary raise
              but a reported secondary/control transaction: investment-banking sources cited by Open Korea described
              roughly $700 million of Mubadala and Goldman Sachs purchases and an enterprise-value estimate of about 6
              trillion won. The same report says some investors resisted the valuation and that risk-protection clauses
              were insufficient for some institutions. That combination supports a track recommendation rather than a
              buy: operating proof exists, but price discovery is negotiated, not independently marked.

              The 2024 earnings datapoint is encouraging but narrow. Open Korea reported net profit of 28.9 billion won
              and operating profit of 93.0 billion won in 2024 after two loss-making years; it does not provide a
              complete standalone cash-flow bridge, recurring-revenue measure, or current margin profile. A 2026 U.S.
              listing could improve liquidity, but Yonhap described the filing as confidential and said Kakao Mobility
              declined comment; a separate market commentary said board approval, deal scale, schedule, and conditions
              remained unsettled. Entry discipline should therefore require verified current financial statements, the
              final transaction price and security terms, and evidence that any listing proceeds benefit the company
              rather than mainly providing an exit for an existing investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is a dense domestic network with multiple monetization surfaces. Tracxn describes
              taxi, ride-hailing, navigation, parking, intercity travel, and delivery offerings, and records $989
              million of cumulative funding plus a current valuation estimate of $6.5 billion; these are third-party
              database figures rather than audited company disclosures. The company's 2026 parking presentation adds a
              possible infrastructure and international expansion option: it described a Diriyah Smart City
              proof-of-concept and reported that analysis of about 1.62 million parking-related data points showed exit
              intervals falling by up to about 20%. Those statements are useful operating signals, but they remain
              company-reported and do not establish revenue conversion or durable returns on invested capital.

              The anti-thesis is that dominance may carry regulatory and accounting liabilities. TechCrunch reported the
              KFTC's recalculated $10.5 million fine for limiting competitors' access and separately reported a $2.47
              million Financial Services Commission fine referral for suspected accounting fraud. Asiae described the
              KFTC's final 15.1 billion won fine and the accounting-method dispute that reduced the provisional 72.4
              billion won amount. These are not merely headline risks: they raise questions about the quality of
              historical revenue presentation, the cost of compliance, and whether platform access practices can be
              monetized without enforcement. Public-market comparables are also heterogeneous: CompaniesMarketCap showed
              Uber at a 2.55 TTM price-to-sales ratio as of October 2026, versus Lyft at 0.9743 and Grab at 3.12; the
              different geographies, margins, growth, and business mixes make this a reference range, not a Kakao
              Mobility valuation.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be framed as decision thresholds rather than false precision. The bull case
              requires the reported 6 trillion won enterprise-value context to be validated, 2024 profitability to
              persist, parking and overseas initiatives to convert into disclosed revenue and cash generation, and a
              U.S. listing or other liquidity event to complete on terms that broaden the investor base. The base case
              assumes continued domestic scale and selective product expansion but incomplete financial transparency,
              leaving the appropriate stance at track and the valuation stance at stretched. The bear case combines
              multiple compression with unresolved enforcement, renewed accounting scrutiny, stalled liquidity, or weak
              commercialization of new mobility products; in that case, a negotiated secondary reference could overstate
              realizable value.

              A decision should move toward buy only after the company supplies audited standalone 2025-2026 revenue,
              margin, cash-flow, debt, and cap-table data; the exact rights and preferences attached to the reported
              transactions; and an explanation of whether the proposed U.S. listing is primary capital, secondary
              liquidity, or both. Exit readiness is therefore medium at best: the company has a plausible market-access
              route and recognizable scale, but Yonhap's account was based on a confidential filing and the commentary
              source said the board had not decided whether to proceed. The most important thesis-break triggers are a
              material adverse regulatory outcome, a restatement or inability to reconcile gross-versus-net revenue
              treatment, a down-round or failed liquidity event, or evidence that new products do not produce measurable
              contribution profit.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Track Kakao Mobility rather than underwrite a buy until audited standalone financials, final transaction
              terms, and the primary-versus-secondary structure of any U.S. listing are public.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              A material adverse regulatory outcome, accounting restatement, failed liquidity event, or non-converting
              expansion program would invalidate the current scale-led valuation thesis.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
              - CV016
