      - number: '1.3'
        title: Funding, milestones and unresolved disclosure
        blocks:
          - type: paragraph
            body: >-
              The evidence records multiple financing and strategic milestones, including a 2017 TPG investment, later
              private-equity activity, a 2022 domestic listing attempt, a 2024 antitrust and accounting-enforcement
              overhang, and 2026 reporting about a possible US listing. A potential US filing is reported rather than
              confirmed by Kakao Mobility itself, and one source says Kakao Mobility declined comment, so the event
              should remain a reported development rather than a completed transaction. The principal diligence
              conclusion is not that the company lacks scale, but that the public record does not yet reconcile
              valuation, audited standalone financials, capital raised, ownership economics and the exact status of the
              listing path. The antitrust record is also material: TechCrunch reports a KRW 15.1 billion fine after the
