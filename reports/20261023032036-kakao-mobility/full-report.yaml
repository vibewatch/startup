        title: Leadership, ownership and governance dependencies
        blocks:
          - type: paragraph
            body: >-
              The available pool identifies Kim Beom-soo as a founder and lists several current or historical CEO names
              in a commercial database, but it does not provide a definitive, dated executive roster or board
              composition. That is a material key-person and governance diligence gap for a private company preparing
              for a possible overseas listing. Ownership evidence is more consistent: Kakao is reported to retain a
              controlling 57.2% stake, while TPG and other financial investors have meaningful liquidity interests. The
              potential listing therefore appears connected both to capital-market access and to sponsor exit pressure,
