        - Security attestations, privacy impact assessments, breach logs, claims history, and safety metrics
    notes: >-
      Unknown likelihood marks missing evidence rather than low risk; the parking evidence is company-sourced reporting
      and does not prove commercial conversion or independently audited performance.
    claimRefs:
      - CR002
      - CR003
      - CR013
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Evidence of concentration
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure
    rows:
      - - Parent and sponsor ownership
        - Kakao Corp., TPG-led consortium, and Carlyle
        - >-
          Investing.com reported an Uber proposal involving more than 50% and specified 28% TPG-led and 6.17% Carlyle
          stakes
        - Stakeholders pursue incompatible exit, control, or minority-holder outcomes
        - High
        - Multiple reported transaction paths, but no completed agreement
        - Cap-table, governance, related-party, and change-of-control terms remain unknown
      - - US listing execution
        - Underwriters and US capital-markets process
        - Reported confidential filing and approximately US$1 billion target; company declined comment
        - Listing stalls, proceeds are secondary, or disclosure reveals weaker economics
        - High
        - Confidential filing was reported, but structure and approval were not confirmed
        - Primary proceeds, dilution, timetable, and final registration disclosures are unknown
      - - Rival franchise ecosystem
        - Rival operators and affiliated drivers
        - Prosecutors alleged suspensions affecting 14,042 accounts tied to one rival and 1,095 to another
        - Access remedy or partner withdrawal reduces supply or platform economics
        - Critical
        - Company denies restricting competition and says it will operate transparently
        - Current access rules, partner contracts, economics, and supply response need testing
      - - Expansion counterparties
        - Diriyah smart-city project and future parking customers
        - One reported proof-of-concept; no allocated recurring-contract evidence
        - Pilot does not scale or requires bespoke, capital-intensive implementation
        - Medium
        - Technical capabilities presented publicly
        - Contract value, deployment cost, renewal, and margin remain private
    notes: >-
      Reported stake discussions and listing plans are not completed transactions or funding available to the company;
      partner and pilot concentration is limited to disclosures in the assigned source set.
    claimRefs:
      - CR002
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Current assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - track
        - Scale and 2024 profitability are credible, but current price discovery is incomplete.
        - Do not underwrite a buy without verified standalone accounts and terms.
      - - Confidence
        - medium
        - >-
          Multiple independent reports support the financing, regulatory, and listing context; private-company
          disclosure remains thin.
        - Treat the call as conditional and refresh-sensitive.
      - - Risk rating
        - high
        - Antitrust, accounting-method, liquidity, and governance risks are material.
        - Require explicit downside protections and legal diligence.
      - - Valuation stance
        - stretched
        - >-
          Reported enterprise-value references are negotiated or database estimates, while public comparables are
          heterogeneous.
        - Demand a discount to the reported reference until price and cash-flow quality are verified.
    notes: >-
      Assessments synthesize cited evidence; reported transaction values are not audited marks, and null or undisclosed
      financial inputs are not treated as zero.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting signal
      - What could change the view
      - Evidence status
    rows:
      - - Domestic network and platform breadth
        - 96% taxi-hailing share in 2022; 13.2M MAUs; services span mobility categories.
        - Sustained share loss, lower activity, or inability to monetize adjacent services.
        - Independent reporting and third-party database; periods differ.
      - - Profitability is emerging
        - 2024 net profit 28.9B won and operating profit 93.0B won after two loss years.
        - Audited standalone cash flow, margins, and repeatability remain unverified.
        - Reported company-financial datapoint; no full public bridge.
      - - Infrastructure and international option
        - Parking platform, Saudi proof-of-concept, and up to 20% shorter exit intervals in company analysis.
        - No disclosed conversion from pilots or operational improvement to durable revenue and profit.
        - Company-reported and not independently validated.
      - - Regulatory and accounting overhang
        - KFTC fine finalized at 15.1B won; separate accounting-method enforcement context.
        - Successful appeal, durable control remediation, and reconciled reporting.
        - Independent and regulatory reporting; adverse.
    notes: >-
      Signals are not normalized for population, period, accounting basis, or issuer; they are decision inputs rather
      than a like-for-like scorecard.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          6T won EV is validated; profitability persists; parking/global initiatives convert; listing improves
          liquidity.
        - >-
          Potential upside from verified cash-flow growth and a liquid-market premium; no numeric return is supportable
          now.
        - 'Low-to-medium: several conditions are unconfirmed.'
        - Regulatory remediation or product conversion fails.
      - - Base
        - >-
          Domestic leadership persists; adjacent products grow selectively; disclosure remains incomplete; liquidity is
          delayed.
        - Track at a discount to reported private references; reassess when audited data and terms arrive.
        - 'Medium: best fit with currently disclosed evidence.'
        - Profitability reverses or price is set without downside protection.
      - - Bear
        - Multiple compression, enforcement, accounting restatement, stalled listing, or weak commercialization.
        - Capital impairment risk rises because a negotiated reference may not be realizable in a stressed exit.
        - 'Medium-to-high: several risks are already documented.'
        - Final adverse legal outcome, restatement, or down-round.
      - - Diligence gate
        - Obtain audited 2025-2026 standalone statements, cap table, security rights, and listing structure.
        - No underwriting range until evidence closes the central price and cash-flow gaps.
        - High importance, not a probability estimate.
        - Any refusal or material inconsistency.
    notes: >-
      Scenarios are qualitative because public evidence does not support a defensible Kakao Mobility revenue multiple,
      cash-flow forecast, or probability-weighted target return.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV013
      - CV014
      - CV015
      - CV016
