chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility is described across the retained evidence as a South Korean mobility platform and Kakao
              subsidiary, founded in 2015 and based in Seongnam-si. Its product scope extends beyond taxi hailing to
              navigation, parking, bikes, delivery and travel-related booking, which supports the characterization of
              Kakao T as a multi-service mobility platform rather than a single taxi product. Evidence is strongest for
              the product surface and user reach; standalone revenue, customer denominators and current legal-entity
              reporting remain less transparent. The independent comparison source reports more than 30 million
              registered users and KRW 791.5 billion of 2023 revenue, while a Google-hosted case study independently
              describes more than 30 million total users but is a partner-issued product account, so those figures
              should not be treated as independently audited.
