callouts:
  - calloutType: strength
    title: Platform breadth with credible scale signals
    body: The retained evidence consistently describes a broad mobility product surface and more than 30 million users, although the user denominator is not independently reconciled.
    claimRefs: [CO002, CO003, CO004]
  - calloutType: risk
    title: Control, disclosure and regulatory overhang
    body: Kakao control, sponsor exit pressure, unclear executive records, limited standalone disclosure and antitrust or accounting scrutiny should remain central to diligence.
    claimRefs: [CO006, CO007, CO008, CO012, CO013]
  - calloutType: recommendation
    title: Verify the listing and cap-table mechanics before underwriting
    body: Treat the possible US listing as a catalyst and liquidity signal, not as committed financing, until a regulator-facing filing, audited standalone statements and current ownership schedule are available.
    claimRefs: [CO009, CO010, CO011, CO014]
