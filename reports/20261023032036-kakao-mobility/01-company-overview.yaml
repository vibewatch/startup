company:
  name: Kakao Mobility
chapter:
  number: 1
  title: Company Overview
  summary: Kakao Mobility is a Kakao subsidiary built around the Kakao T mobility platform, with reported scale across taxi, navigation, parking, delivery and related services. The current evidence supports a large, strategically important platform, but private-company disclosure and unresolved regulatory and liquidity questions limit confidence in precise financial or governance conclusions.
sections:
  - id: identity-and-platform
    title: Identity, platform and operating footprint
    body: Kakao Mobility is described across the retained evidence as a South Korean mobility platform and Kakao subsidiary, founded in 2015 and based in Seongnam-si. Its product scope extends beyond taxi hailing to navigation, parking, bikes, delivery and travel-related booking, which supports the characterization of Kakao T as a multi-service mobility platform rather than a single taxi product. Evidence is strongest for the product surface and user reach; standalone revenue, customer denominators and current legal-entity reporting remain less transparent. The independent comparison source reports more than 30 million registered users and KRW 791.5 billion of 2023 revenue, while a Google-hosted case study independently describes more than 30 million total users but is a partner-issued product account, so those figures should not be treated as independently audited.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, ownership and governance dependencies
    body: "The available pool identifies Kim Beom-soo as a founder and lists several current or historical CEO names in a commercial database, but it does not provide a definitive, dated executive roster or board composition. That is a material key-person and governance diligence gap for a private company preparing for a possible overseas listing. Ownership evidence is more consistent: Kakao is reported to retain a controlling 57.2% stake, while TPG and other financial investors have meaningful liquidity interests. The potential listing therefore appears connected both to capital-market access and to sponsor exit pressure, with control remaining concentrated at Kakao on the retained record."
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: funding-milestones-and-open-gaps
    title: Funding, milestones and unresolved disclosure
    body: "The evidence records multiple financing and strategic milestones, including a 2017 TPG investment, later private-equity activity, a 2022 domestic listing attempt, a 2024 antitrust and accounting-enforcement overhang, and 2026 reporting about a possible US listing. A potential US filing is reported rather than confirmed by Kakao Mobility itself, and one source says Kakao Mobility declined comment, so the event should remain a reported development rather than a completed transaction. The principal diligence conclusion is not that the company lacks scale, but that the public record does not yet reconcile valuation, audited standalone financials, capital raised, ownership economics and the exact status of the listing path. The antitrust record is also material: TechCrunch reports a KRW 15.1 billion fine after the initial sanction was reduced, while the company said it would pursue administrative litigation."
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
