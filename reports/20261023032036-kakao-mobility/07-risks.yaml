    claimRefs: [CR001, CR004, CR005, CR006, CR007, CR014, CR015, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved evidence]
    rows:
      - ["Access-control implementation harms rival-affiliated drivers or marketplace supply", High, Critical, "Contested public defense; independent control testing not disclosed", "Partner trust, supply liquidity, and regulator remedies", "Driver-level allocation tests, exception logs, policy approvals, and post-change outcomes"]
      - ["Parking proof-of-concept fails to convert to recurring deployment", Medium, Medium, "Technical capabilities and one reported proof-of-concept; commercial maturity unverified", "Implementation spending without repeatable revenue or margin evidence", "Signed terms, deployment milestones, renewal, customer reference, and unit economics"]
      - ["Service outage or capacity degradation", Unknown, High, "No company incident register or service-level history in the allocated pool", "Potential passenger, driver, and partner disruption cannot be sized", "Twenty-four-month uptime, outage, recovery-time, and postmortem records"]
      - ["Cybersecurity, privacy, or safety control failure", Unknown, High, "No direct security attestation, breach register, or safety-loss record in the allocated pool", "Regulatory, remediation, liability, and trust effects remain unquantified", "Security attestations, privacy impact assessments, breach logs, claims history, and safety metrics"]
    notes: "Unknown likelihood marks missing evidence rather than low risk; the parking evidence is company-sourced reporting and does not prove commercial conversion or independently audited performance."
    claimRefs: [CR002, CR003, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Evidence of concentration, Failure scenario, Severity, Public mitigation, Residual exposure]
    rows:
      - ["Parent and sponsor ownership", "Kakao Corp., TPG-led consortium, and Carlyle", "Investing.com reported an Uber proposal involving more than 50% and specified 28% TPG-led and 6.17% Carlyle stakes", "Stakeholders pursue incompatible exit, control, or minority-holder outcomes", High, "Multiple reported transaction paths, but no completed agreement", "Cap-table, governance, related-party, and change-of-control terms remain unknown"]
      - ["US listing execution", "Underwriters and US capital-markets process", "Reported confidential filing and approximately US$1 billion target; company declined comment", "Listing stalls, proceeds are secondary, or disclosure reveals weaker economics", High, "Confidential filing was reported, but structure and approval were not confirmed", "Primary proceeds, dilution, timetable, and final registration disclosures are unknown"]
      - ["Rival franchise ecosystem", "Rival operators and affiliated drivers", "Prosecutors alleged suspensions affecting 14,042 accounts tied to one rival and 1,095 to another", "Access remedy or partner withdrawal reduces supply or platform economics", Critical, "Company denies restricting competition and says it will operate transparently", "Current access rules, partner contracts, economics, and supply response need testing"]
      - ["Expansion counterparties", "Diriyah smart-city project and future parking customers", "One reported proof-of-concept; no allocated recurring-contract evidence", "Pilot does not scale or requires bespoke, capital-intensive implementation", Medium, "Technical capabilities presented publicly", "Contract value, deployment cost, renewal, and margin remain private"]
    notes: "Reported stake discussions and listing plans are not completed transactions or funding available to the company; partner and pilot concentration is limited to disclosures in the assigned source set."
    claimRefs: [CR002, CR008, CR009, CR010, CR011, CR012, CR013]
