        - label: "Platform-worker obligations"
          values: [Medium, High, Early, High]
        - label: "Ownership and listing execution"
          values: [Medium, High, Early, High]
        - label: "Parking expansion conversion"
          values: [Medium, Medium, Pilot-stage, Medium]
        - label: "Outage, cyber, privacy, and safety controls"
          values: [Unknown, High, Undisclosed, Unknown]
    approximationNotes: "Ordinal labels are analyst assessments based on the cited status and disclosure maturity; they are not probability estimates, and Unknown is not treated as zero."
    claimRefs: [CR003, CR007, CR009, CR011, CR014, CR016]
callouts:
  - calloutType: risk
    title: Conduct remediation is the primary thesis risk
    body: "A final remedy that mandates broad neutral access, materially reduces monetization, or establishes executive liability would move the risk from episodic fines to a structural business-model constraint."
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
  - calloutType: assumption
    title: Transaction headlines do not equal company liquidity
    body: "A confidential filing, a reported fundraising target, or a proposed stake acquisition does not identify primary proceeds, completed financing, or cash available to Kakao Mobility."
    claimRefs: [CR008, CR010, CR011, CR012]
  - calloutType: recommendation
    title: Documentary diligence is a condition to underwriting
    body: "Require the complete legal dockets, audited standalone accounts, access-policy audit, worker-cost sensitivity, incident registers, and transaction documents before treating the risk posture as mitigated."
    claimRefs: [CR001, CR006, CR008, CR014, CR015, CR016]
