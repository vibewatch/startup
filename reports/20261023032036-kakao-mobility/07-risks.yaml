      - ["Platform-worker status and bargaining scope", "South Korea; 2026 policy proposal and 2025 labor-law change reported", Medium, High, "No Kakao-specific implementation evidence in the allocated pool", "Potential wage, benefit, bargaining, documentation, and subcontractor obligations", "Map worker populations, control indicators, contracts, insurance, and cost sensitivity"]
