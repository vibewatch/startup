company:
  name: "Kakao Mobility"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Kakao Mobility addresses a mature, highly digitized South Korean taxi-hailing core: one market-data provider estimates USD 1.60 billion in 2026 and 4.6% annual growth through 2031. Broader MaaS estimates imply faster growth but use a different boundary, while regulation, strong public transit, and an uncertain transition to autonomous fleets limit a defensible company-level SOM.
sections:
  - id: "market-boundary-and-sizing"
    title: "Market Boundary and Evidence-Constrained Sizing"
    body: >-
      The investable core is South Korean e-hailing: digital discovery, dispatch, reservation, and payment for licensed taxi journeys. This boundary excludes public-transit fares, private-car economics, parking operations, EV charging, and autonomous-driving technology sold independently, although each can become an adjacency for Kakao Mobility. Knowledge Sourcing Intelligence estimates this core at USD 1.60 billion in 2026, rising to USD 2.00 billion in 2031 at a 4.6% CAGR. IMARC estimates the broader South Korean MaaS market at USD 172.6 million in 2025 and USD 1,238.6 million in 2034 at 23.75% CAGR. The differing definitions, vintages, and counterintuitive relative scale mean these are separate lenses, not a nested TAM/SAM stack. Public evidence does not isolate Kakao Mobility's transaction value, net revenue pool, or attainable share, so a precise SOM would be false precision.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005"]
    tableRefs: ["TM001", "TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-users-and-payers"
    title: "Buyers, Users, and Payers"
    body: >-
      Individual riders are the dominant end users and usually the direct payers, while corporate buyers value centralized billing, reservations, policy controls, and electronic trip records. Knowledge Sourcing Intelligence estimates individual consumers at about 82% and corporate customers at about 13% of 2026 e-hailing market value, with government and other users forming the balance. International travelers are a distinct acquisition segment because language, local identity, and payment friction can block adoption; the Korea Tourism Organization highlights fare previews and Kakao Mobility's multilingual k.ride product with overseas-card support. Drivers and licensed taxi operators are supply-side participants rather than end-market buyers, but dispatch density and acceptable platform terms determine fulfillment. Municipalities and transport regulators shape operating permissions and autonomous-service rollout, making adoption a multi-sided process rather than a simple consumer-app sale.
    claimRefs: ["CM006", "CM007", "CM014", "CM015"]
    tableRefs: ["TM003"]
  - id: "adoption-drivers-and-constraints"
    title: "Adoption Drivers and Constraints"
    body: >-
      Network density is the principal adoption advantage. A 2025 operating-data summary reports 6.6-second average dispatch and a 94% boarding-success rate for Kakao T, while historical reporting describes how matching algorithms addressed temporal and geographic supply-demand mismatch. Scale indicators nevertheless require careful denominators: 2024 reporting cited more than 23 million registered users and a 98% share, another report cited a 96% 2022 share and 13.2 million monthly active users, and Yonhap reported more than 30 million app users in 2026. These are not interchangeable. Growth should come from deeper digital capture, reservations, premium vehicles, corporate travel, tourism, and adjacent parking workflows. Constraints include regulated fares, strong public-transport substitutes, driver availability, antitrust intervention, and the capital and authorization needed for autonomous fleets.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM013", "CM014", "CM015"]
  - id: "timing-and-valuation-implications"
    title: "Adoption Timing and Valuation Implications"
    body: >-
      The market supports a durable domestic transaction layer, but market leadership should not be capitalized as an uncontested perpetual share. The KFTC fine over competitor access shows that distribution power can trigger remedies that affect platform terms and data access. Autonomous mobility is a longer-duration option: Korea JoongAng Daily reported that Kakao Mobility missed a 2026 demonstration-city selection and had not yet met the mileage threshold for a temporary driverless permit, despite useful fleet-control capabilities. Company-reported parking analysis suggests cross-sell potential, but it does not establish independent revenue or ROI. Overseas expansion could enlarge the addressable market, yet reported acquisition ambitions carried financing and execution uncertainty. Valuation work should therefore use the bounded e-hailing forecast as a reference, treat MaaS and autonomous opportunities as option value, and require private cohort, take-rate, and unit-economics data before assigning a company-specific SOM.
    claimRefs: ["CM005", "CM011", "CM012", "CM013", "CM016"]
