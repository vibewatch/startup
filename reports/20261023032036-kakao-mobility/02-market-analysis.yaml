    notes: "The end-user shares are publisher estimates for 2026; workflow and budget-owner fields are analytical mappings from the cited operational and official-user evidence, not disclosed Kakao Mobility contract terms."
    claimRefs: ["CM006", "CM007", "CM011", "CM012", "CM014", "CM015"]
