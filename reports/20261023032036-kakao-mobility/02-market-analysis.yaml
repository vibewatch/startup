callouts:
  - calloutType: "risk"
    title: "A large platform share is not a company SOM"
    body: "Reported market-share and user metrics use different years and denominators, while public sources omit Kakao Mobility's gross bookings, take rate, segment revenue, and contribution margin. Regulatory remedies and the autonomous-technology transition could also change the addressable economics."
    claimRefs: ["CM005", "CM008", "CM009", "CM010", "CM011", "CM012"]
