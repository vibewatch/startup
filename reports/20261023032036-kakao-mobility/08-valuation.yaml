      severity: blocking
      topic: cap-table
      missingEvidence: "Audited standalone 2025-2026 financial statements, current cap table, liquidation preferences, debt, and exact primary-versus-secondary transaction terms."
      whyItMatters: "Without these inputs, a private enterprise-value reference cannot be translated into an investor return or dilution outcome."
      diligencePath: "Obtain the latest audited accounts, capitalization table, shareholder agreement, financing documents, and data-room waterfall from the company or lead investors."
      relatedQuestionRefs: [QV002, QV003, QV009]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: "Reconciliation of the reported 6 trillion won transaction enterprise value and the Tracxn $6.5 billion valuation estimate, including dates, currencies, and security classes."
      whyItMatters: "The references may describe different dates or instruments and cannot be used as a single valuation range without reconciliation."
      diligencePath: "Request dated term sheets, valuation memos, FX convention, and instrument-level rights for each referenced transaction."
      relatedQuestionRefs: [QV002, QV004]
    - type: missing-source
      severity: material
      topic: profitability
      missingEvidence: "Standalone revenue composition, gross-to-net accounting reconciliation, recurring versus transaction revenue, and cash conversion."
      whyItMatters: "Reported profit and operating profit do not establish sustainable cash generation or an appropriate revenue multiple."
      diligencePath: "Obtain audited segment accounts, cash-flow statements, accounting-policy memos, and monthly management accounts for 2024-2026."
      relatedQuestionRefs: [QV003, QV007]
    - type: stale
      severity: material
      topic: IPO
      missingEvidence: "Current status, structure, timetable, and primary-versus-secondary allocation of any U.S. listing."
      whyItMatters: "The available coverage describes a confidential or unsettled process, so exit readiness and capital availability remain uncertain."
      diligencePath: "Verify the latest board decision, SEC filing status, underwriters, share-registration structure, and use of proceeds."
      relatedQuestionRefs: [QV006]
    - type: access-blocked
      severity: minor
      topic: cap-table
      missingEvidence: "Independent confirmation of private-market preference and downside-protection terms."
      whyItMatters: "Some reported investors declined participation because risk-protection clauses were inadequate, but the exact terms are not public."
      diligencePath: "Review executed purchase agreements, preferred-share rights, consent thresholds, and exit waterfalls under confidentiality."
      relatedQuestionRefs: [QV009]
