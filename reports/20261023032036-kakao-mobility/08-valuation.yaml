company:
  name: Kakao Mobility
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strategically important, profitable mobility platform, but the investable valuation case remains conditional because current pricing, standalone disclosure, and the proposed liquidity path are not fully established.
sections:
  - id: investment-call
    title: Investment call and price discipline
    body: >-
      Kakao Mobility has a credible scale-and-platform thesis: TechCrunch reported a 96% taxi-hailing market share in 2022 and 13.2 million monthly active users, while the company describes a broader parking and mobility infrastructure strategy. The strongest current financing signal is not a completed primary raise but a reported secondary/control transaction: investment-banking sources cited by Open Korea described roughly $700 million of Mubadala and Goldman Sachs purchases and an enterprise-value estimate of about 6 trillion won. The same report says some investors resisted the valuation and that risk-protection clauses were insufficient for some institutions. That combination supports a track recommendation rather than a buy: operating proof exists, but price discovery is negotiated, not independently marked.

      The 2024 earnings datapoint is encouraging but narrow. Open Korea reported net profit of 28.9 billion won and operating profit of 93.0 billion won in 2024 after two loss-making years; it does not provide a complete standalone cash-flow bridge, recurring-revenue measure, or current margin profile. A 2026 U.S. listing could improve liquidity, but Yonhap described the filing as confidential and said Kakao Mobility declined comment; a separate market commentary said board approval, deal scale, schedule, and conditions remained unsettled. Entry discipline should therefore require verified current financial statements, the final transaction price and security terms, and evidence that any listing proceeds benefit the company rather than mainly providing an exit for an existing investor.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparable signals
    body: >-
      The positive thesis is a dense domestic network with multiple monetization surfaces. Tracxn describes taxi, ride-hailing, navigation, parking, intercity travel, and delivery offerings, and records $989 million of cumulative funding plus a current valuation estimate of $6.5 billion; these are third-party database figures rather than audited company disclosures. The company's 2026 parking presentation adds a possible infrastructure and international expansion option: it described a Diriyah Smart City proof-of-concept and reported that analysis of about 1.62 million parking-related data points showed exit intervals falling by up to about 20%. Those statements are useful operating signals, but they remain company-reported and do not establish revenue conversion or durable returns on invested capital.

      The anti-thesis is that dominance may carry regulatory and accounting liabilities. TechCrunch reported the KFTC's recalculated $10.5 million fine for limiting competitors' access and separately reported a $2.47 million Financial Services Commission fine referral for suspected accounting fraud. Asiae described the KFTC's final 15.1 billion won fine and the accounting-method dispute that reduced the provisional 72.4 billion won amount. These are not merely headline risks: they raise questions about the quality of historical revenue presentation, the cost of compliance, and whether platform access practices can be monetized without enforcement. Public-market comparables are also heterogeneous: CompaniesMarketCap showed Uber at a 2.55 TTM price-to-sales ratio as of October 2026, versus Lyft at 0.9743 and Grab at 3.12; the different geographies, margins, growth, and business mixes make this a reference range, not a Kakao Mobility valuation.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence
    body: >-
      Scenario analysis should be framed as decision thresholds rather than false precision. The bull case requires the reported 6 trillion won enterprise-value context to be validated, 2024 profitability to persist, parking and overseas initiatives to convert into disclosed revenue and cash generation, and a U.S. listing or other liquidity event to complete on terms that broaden the investor base. The base case assumes continued domestic scale and selective product expansion but incomplete financial transparency, leaving the appropriate stance at track and the valuation stance at stretched. The bear case combines multiple compression with unresolved enforcement, renewed accounting scrutiny, stalled liquidity, or weak commercialization of new mobility products; in that case, a negotiated secondary reference could overstate realizable value.

      A decision should move toward buy only after the company supplies audited standalone 2025-2026 revenue, margin, cash-flow, debt, and cap-table data; the exact rights and preferences attached to the reported transactions; and an explanation of whether the proposed U.S. listing is primary capital, secondary liquidity, or both. Exit readiness is therefore medium at best: the company has a plausible market-access route and recognizable scale, but Yonhap's account was based on a confidential filing and the commentary source said the board had not decided whether to proceed. The most important thesis-break triggers are a material adverse regulatory outcome, a restatement or inability to reconcile gross-versus-net revenue treatment, a down-round or failed liquidity event, or evidence that new products do not produce measurable contribution profit.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
