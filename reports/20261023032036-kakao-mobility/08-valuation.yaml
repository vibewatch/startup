  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting signal, What could change the view, Evidence status]
    rows:
      - [Domestic network and platform breadth, "96% taxi-hailing share in 2022; 13.2M MAUs; services span mobility categories.", "Sustained share loss, lower activity, or inability to monetize adjacent services.", "Independent reporting and third-party database; periods differ."]
      - [Profitability is emerging, "2024 net profit 28.9B won and operating profit 93.0B won after two loss years.", "Audited standalone cash flow, margins, and repeatability remain unverified.", "Reported company-financial datapoint; no full public bridge."]
      - [Infrastructure and international option, "Parking platform, Saudi proof-of-concept, and up to 20% shorter exit intervals in company analysis.", "No disclosed conversion from pilots or operational improvement to durable revenue and profit.", "Company-reported and not independently validated."]
      - [Regulatory and accounting overhang, "KFTC fine finalized at 15.1B won; separate accounting-method enforcement context.", "Successful appeal, durable control remediation, and reconciled reporting.", "Independent and regulatory reporting; adverse."]
    notes: "Signals are not normalized for population, period, accounting basis, or issuer; they are decision inputs rather than a like-for-like scorecard."
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "6T won EV is validated; profitability persists; parking/global initiatives convert; listing improves liquidity.", "Potential upside from verified cash-flow growth and a liquid-market premium; no numeric return is supportable now.", "Low-to-medium: several conditions are unconfirmed.", "Regulatory remediation or product conversion fails."]
      - [Base, "Domestic leadership persists; adjacent products grow selectively; disclosure remains incomplete; liquidity is delayed.", "Track at a discount to reported private references; reassess when audited data and terms arrive.", "Medium: best fit with currently disclosed evidence.", "Profitability reverses or price is set without downside protection."]
      - [Bear, "Multiple compression, enforcement, accounting restatement, stalled listing, or weak commercialization.", "Capital impairment risk rises because a negotiated reference may not be realizable in a stressed exit.", "Medium-to-high: several risks are already documented.", "Final adverse legal outcome, restatement, or down-round."]
      - [Diligence gate, "Obtain audited 2025-2026 standalone statements, cap table, security rights, and listing structure.", "No underwriting range until evidence closes the central price and cash-flow gaps.", "High importance, not a probability estimate.", "Any refusal or material inconsistency."]
    notes: "Scenarios are qualitative because public evidence does not support a defensible Kakao Mobility revenue multiple, cash-flow forecast, or probability-weighted target return."
    claimRefs: [CV002, CV003, CV005, CV006, CV013, CV014, CV015, CV016]
