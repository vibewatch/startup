      Reported conversion and completion improvements may be real but cannot be generalized without denominator and
      experimental-design detail.
    diligencePath: >-
      Request experiment design, cohort definitions, labeled evaluation results, hallucination audits, fallback rates,
      and production monitoring.
    relatedQuestionRefs:
      - QE004
      - QE006
