evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A dated official leadership, board and beneficial-ownership record for Kakao Mobility.
    whyItMatters: >-
      The assigned commercial profile lists multiple CEO names without an effective-date sequence, so key-person
      dependence and governance accountability cannot be assessed reliably.
    diligencePath: >-
      Obtain the latest company leadership page, corporate registry extract, shareholder register and any IPO prospectus
      or draft-registration disclosure.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: Audited standalone statements reconciling revenue, margin, cash flow, funding and valuation.
    whyItMatters: >-
      Reported revenue, database ranges and transaction valuations use different bases and cannot support an
      underwriting conclusion without reconciliation.
    diligencePath: >-
      Request audited 2025-2026 standalone financial statements, cap table, debt schedule and valuation bridge from
      management or listing counsel.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: regulation
    missingEvidence: Final court, regulator and accounting-enforcement outcomes, including any administrative litigation result.
    whyItMatters: >-
      The antitrust fine was reduced and litigation was reported, while the separate accounting-fraud matter creates a
      distinct legal and disclosure risk.
    diligencePath: Review KFTC, FSC, court and prosecutor records and obtain counsel's current status memo.
    relatedQuestionRefs:
      - QO006
  - type: stale
    severity: minor
    topic: listing
    missingEvidence: A current regulator-facing filing or board resolution confirming the US listing path.
    whyItMatters: >-
      Media reports describe a confidential or potential filing, but the company has not confirmed the transaction in
      the assigned evidence.
    diligencePath: >-
      Monitor SEC filing records, Kakao disclosures and the underwriters' announcements for a definitive filing, size
      and timetable.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: company-som
    missingEvidence: >-
      Kakao Mobility gross bookings, net take rate, revenue by mobility vertical, repeat-use cohorts, and contribution
      margin by segment.
    whyItMatters: >-
      Without these denominators, public market share cannot be converted into a defensible revenue SOM or valuation
      multiple.
    diligencePath: >-
      Request audited segment schedules, monthly cohort data, booking-to-revenue bridges, and management's bottom-up
      five-year market model.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: >-
      A consistent third-party time series using one definition for registered users, monthly active users, rides, and
      market share.
    whyItMatters: The cited 96%, 98%, 13.2 million, 23 million, and 30 million figures use different periods and denominators.
    diligencePath: >-
      Obtain KFTC source tables and independent app-usage and completed-ride data, then reconcile every figure by date
      and denominator.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: sizing-methodology
    missingEvidence: Full methodologies and bottom-up input tables for the e-hailing and broader MaaS forecasts.
    whyItMatters: >-
      Public summary pages do not establish whether reported values are gross bookings, platform revenue, or another
      market-value convention.
    diligencePath: >-
      Acquire the underlying reports or commission a bottoms-up build from licensed taxi trips, fares, digital
      penetration, and platform take rates.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized fares, commissions, discounts, driver earnings and retention by service tier for Kakao
      Mobility, Uber Taxi, TADA and I.M.
    whyItMatters: >-
      Feature breadth and aggregate users do not show whether rivals can win profitable demand or whether Kakao's scale
      converts into durable unit economics.
    diligencePath: >-
      Request ride-level price and commission samples, driver multi-homing data, cohort retention and corporate contract
      terms from management and major channel partners.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: >-
      A current, like-for-like Korean taxi market-share series that reconciles the 95%, 96% and segment-specific shares
      reported by different sources and years.
    whyItMatters: >-
      The strength of the network moat and the likely impact of a regulatory access remedy depend on the population and
      period behind each share.
    diligencePath: >-
      Obtain current KFTC, transport-ministry or audited platform data with definitions for general calls, franchise
      calls and monthly active users.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: autonomy
    missingEvidence: >-
      Current commercial utilization, economics and repeat usage for Kakao-linked autonomous services and comparable
      entrant programs.
    whyItMatters: >-
      Pilot kilometers and object cases demonstrate capability development, not a defendable commercial moat or
      displacement trajectory.
    diligencePath: >-
      Request 2026 trip volumes, paid-ride conversion, safety incidents, unit cost and vehicle-supply agreements by
      autonomous program.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Standalone gross margin, product costs, working capital, capex, CAC, payback, incentives, and contribution margin.
    whyItMatters: Without these inputs, revenue growth cannot be translated into cash conversion or a durable margin path.
    diligencePath: >-
      Request audited standalone statements plus monthly product P&Ls and cohort economics for taxi, parking, corporate
      mobility, payments, and logistics.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, debt and lease schedule, covenants, planned use of funds, and financing
      triggers.
    whyItMatters: Funding raised and possible shareholder liquidity do not establish cash available or runway.
    diligencePath: >-
      Obtain bank confirmations, management accounts, debt agreements, board-approved budgets, and a 24-month base and
      downside cash forecast.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: IPO
    missingEvidence: The registration statement and authoritative primary-versus-secondary offering structure.
    whyItMatters: A secondary sale would not provide operating capital, while a primary raise could materially change runway.
    diligencePath: >-
      Review the filed registration statement, selling-shareholder schedule, underwriting terms, fees, and
      use-of-proceeds section.
    relatedQuestionRefs:
      - QI007
  - type: conflicting-data
    severity: material
    topic: revenue-recognition
    missingEvidence: Final regulatory and auditor conclusions on gross-versus-net recognition for affiliated taxi contracts.
    whyItMatters: >-
      The treatment changes reported revenue, apparent take rate, and margin presentation without necessarily changing
      cash flow.
    diligencePath: >-
      Obtain the FSS correspondence, auditor memo, contract set, transaction-flow reconciliation, and any restated
      periods.
    relatedQuestionRefs:
      - QI002
  - type: missing-source
    severity: material
    topic: autonomous-driving
    missingEvidence: >-
      Independent safety, disengagement, and comparative performance data for Kakao Mobility's autonomous-driving
      system.
    whyItMatters: >-
      The current evidence shows test distance and permit status but does not establish whether the system is
      technically competitive or commercially deployable.
    diligencePath: >-
      Request the autonomous-driving test report, disengagement logs, safety case, permit filings, and comparative
      benchmark results.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Independent service-level objectives, outage history, incident response metrics, and cloud cost data.
    whyItMatters: >-
      Partner case studies report directional reliability improvements but omit baselines, denominators, and production
      SLO performance.
    diligencePath: >-
      Obtain 24-month uptime and incident registers, SLO/SLA reports, restore-time distributions, and cloud cost
      allocation.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: missing-source
    severity: material
    topic: applied-ai
    missingEvidence: Production sample sizes, error rates, confidence intervals, and post-launch safety outcomes for AI features.
