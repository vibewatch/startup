figures:
  - id: FU001
    title: Customer journey from installed demand to expansion
    type: journey-map
    summary: Existing Kakao T demand can be reused across taxi, autonomous, parking, and delivery workflows, but public retention and monetization evidence thins at each expansion step.
    data:
      items:
        - label: Installed demand
          title: Kakao T reach
          detail: More than 30 million users are reported by Yonhap; TechTimes reports 31 million existing users.
          touchpoints: ["Existing app access", "Taxi-hailing demand"]
          claimRefs: [CU001, CU002]
        - label: Adjacent mobility use
          title: New service entry
          detail: Kakao T spans taxi, navigation, parking, bikes, and delivery, with autonomous rides exposed through the same interface.
          touchpoints: ["Autonomous taxi", "Parking", "Delivery"]
          claimRefs: [CU003, CU005]
        - label: Workflow outcome
          title: Measured operating improvement
          detail: Reported outcomes include 82.5% autonomous-vehicle utilization, up to about 20% shorter parking exit intervals, and a 24% reduction in delivery-order completion time.
          touchpoints: ["Fleet utilization", "Parking throughput", "Order completion"]
          claimRefs: [CU006, CU007, CU008]
        - label: Expansion and durability test
          title: Enterprise and repeat value
          detail: Parking expansion includes a reported Saudi proof of concept, while customer-level retention, renewal, and concentration data remain undisclosed.
          touchpoints: ["Smart-city POC", "Retention diligence", "Concentration diligence"]
          claimRefs: [CU010, CU012, CU013, CU014]
        - label: Retention evidence
          title: Missing cohort proof
          detail: The assigned sources do not disclose churn, renewal, contract duration, or a consistent active-user denominator.
          touchpoints: ["Cohort retention", "Renewal", "Repeat use"]
          claimRefs: [CU014]
        - label: Counterparty durability
          title: Concentration test
          detail: Dominant platform access and unresolved customer-level concentration require contract, revenue-share, and top-account diligence.
          touchpoints: ["Top-account share", "Channel dependence", "Regulatory access"]
          claimRefs: [CU012, CU013, CU014]
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008, CU009, CU010, CU014]
callouts:
  - calloutType: strength
    title: Distribution is the clearest customer asset
    body: >-
      Existing Kakao T reach appears to lower onboarding friction for adjacent mobility services, with autonomous rides and delivery workflows showing concrete use or outcome signals.
    claimRefs: [CU001, CU005, CU008]
  - calloutType: risk
    title: Retention and concentration remain unproven
    body: >-
      The assigned evidence does not disclose cohort retention, churn, contract duration, top-customer revenue, or a consistent active-user denominator; platform dominance also increases regulatory and channel concentration exposure.
    claimRefs: [CU010, CU012, CU013, CU014, CU015, CU016]
