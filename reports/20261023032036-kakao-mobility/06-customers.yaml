chapter:
  number: 6
  title: Customers
  summary: Kakao Mobility's customer engine is anchored by Kakao T's large installed user base and a broad mobility super-app, with credible evidence of paid autonomous rides and workflow improvements in delivery and parking. Public evidence is stronger for reach and use cases than for retention, cohort durability, customer concentration, or segment-level monetization.
sections:
  - id: customer-segmentation
    title: Buyer, user, and payer segments
    body: >-
      Kakao Mobility serves several connected customer groups rather than one homogeneous account base. Consumer riders use Kakao T for taxi-hailing and adjacent services; drivers and taxi operators supply the marketplace; delivery personnel and small businesses use parcel-ordering workflows; and parking operators or smart-city sponsors can buy operating technology. The platform model gives Kakao a broad demand surface, but the public record does not disclose the mix of users who are merely registered, monthly active, paying, or repeat users. TechTimes describes Kakao T as the routing layer for an autonomous service and says 31 million Koreans already use it, while Yonhap separately reports more than 30 million users. These figures indicate scale but are not equivalent denominators or retention measures. The customer thesis therefore rests on high distribution reach plus cross-service optionality, not on a disclosed net-retention metric.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and observed outcomes
    body: >-
      The strongest adoption evidence is operational rather than cohort-based. Seoul's Gangnam autonomous service reportedly recorded more than 15,000 rides from its September 2024 launch and 6,176 paid rides after fares began in April 2026; the same account reports 82.5% vehicle utilization and 97% of late-night autonomous users entering through Kakao T. Kakao Mobility's parking presentation adds a second workflow: analysis of about 1.62 million parking-related records was associated with exit intervals falling by up to about 20%, although the result is presented by the company and the independent methodology is not supplied. A Google-published case study reports a 24% reduction in delivery-order completion time and conversion increases of 45% for new users and 6% for existing users after an on-device address-entry improvement. These are useful product-use signals, but they do not establish recurring revenue, renewal, or causal lift across the whole customer base.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risks
    body: >-
      Public evidence supports expansion from taxi-hailing into parking, delivery, bikes, navigation, and autonomous mobility, but it is incomplete on durability. The platform's reach can lower customer acquisition friction for new mobility categories: autonomous rides were exposed inside the existing Kakao T interface, and the Android case study says delivery-order improvements were used by small business owners. At the same time, dependence on Kakao T's dominant position creates customer and regulatory concentration. TechCrunch reports 13.2 million monthly active users in October in a local-media comparison and a 96% taxi-hailing share in 2022, while also describing the KFTC's finding that access conditions for franchise competitors were linked to fees or data-sharing. The public sources do not provide churn, gross retention, contract length, top-account revenue, or a customer-level concentration table. Those gaps limit confidence that distribution advantage will translate into durable, independently monetized customer relationships.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
