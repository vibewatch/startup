  topStrengths:
    - 灵巧手产品组合覆盖三种驱动架构，以及多个价格和性能层级。
    - 组件供应商策略既能服务现有机械臂，也能服务人形机器人平台，从而降低对整机人形机器人采用时点的依赖。
    - 据报道，资本获取能力和商业化信号都很强，包括已完成的 B+ 轮融资，以及公司自称的出货规模。
  topRisks:
    - 没有经审计的收入、利润率、现金、烧钱、稀释、债务或单位经济性披露支撑当前估值。
    - 出货量、市场份额、产能和具名客户的说法缺少独立的客户侧或市场层面验证。
    - 2026 年的交付目标要求制造、可靠性和现场服务执行能力大幅跃升。
    - 全栈机器人厂商可能把手部、机身与控制系统的集成内化，从而削弱独立组件供应商的战略地位。
  unresolvedGaps:
    - 经审计的收入、毛利率、现金、烧钱、营运资金、保修成本、债务、所有权、稀释和清算优先权数据。
    - 一份经核对的融资台账，区分新增融资所得、老股转让、债务、投前估值、投后估值和当前现金。
    - 对出货量、已验收交付、市场份额、工厂产能、利用率、良率、退货和保修表现的独立核验。
    - 客户侧确认付费部署状态、在用设备数量、结果、留存、重复采购和客户集中度。
    - 安全架构、安全认证、隐私控制、漏洞处理和现场可靠性基准。
