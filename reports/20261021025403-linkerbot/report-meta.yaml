  topStrengths:
    - Broad dexterous-hand portfolio spanning three actuation architectures and multiple price and performance tiers.
    - >-
      Component-supplier strategy can serve existing robotic arms as well as humanoid platforms, reducing dependence on
      full-humanoid adoption timing.
    - >-
      Strong reported capital access and commercialization signals, including a completed Series B+ and company-claimed
      shipment scale.
  topRisks:
    - >-
      No audited revenue, margin, cash, burn, dilution, debt, or unit-economics disclosure supports the current
      valuation.
    - >-
      Shipment, market-share, capacity, and named-customer claims lack independent customer-side or market-level
      verification.
    - The 2026 delivery ambition creates a substantial manufacturing, reliability, and field-service execution step-up.
    - >-
      Full-stack robot makers may internalize hand-body-control integration and weaken the strategic position of an
      independent component supplier.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, cash, burn, working capital, warranty cost, debt, ownership, dilution, and
      liquidation-preference data.
    - >-
      A reconciled financing ledger separating primary proceeds, secondaries, debt, pre-money valuation, post-money
      valuation, and current cash.
    - >-
      Independent verification of shipments, accepted deliveries, market share, factory capacity, utilization, yield,
      returns, and warranty performance.
    - >-
      Customer-side confirmation of paid deployment status, active units, outcomes, retention, repeat purchasing, and
      concentration.
    - >-
      Security architecture, safety certification, privacy controls, vulnerability handling, and field-reliability
      benchmarks.
