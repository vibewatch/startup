summary:
  headline: >-
    Linkerbot shows credible product breadth, financing access, and reported shipment momentum, but its USD 3 billion
    valuation cannot be underwritten without audited economics, customer verification, and independent scale evidence.
  overallScore: 5.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
