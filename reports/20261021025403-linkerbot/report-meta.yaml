companyProfile:
  summary: >-
    Linkerbot is a Beijing robotics company founded in 2023 that sells dexterous robotic hands to enterprise and
    institutional buyers while developing manipulation-skill software. Its component strategy addresses research,
    humanoid, and industrial use cases without requiring customers to buy a complete humanoid platform, but public
    disclosure does not yet establish audited economics, deployment quality, or governance.
  foundedDate: null
  founders:
    - name: Alex Zhou / Zhou Yong
      role: Founder; CEO/CTO titles vary by source
      background: >-
        KrASIA reports prior Lenovo research experience, while the public evidence does not establish whether the two
        English-name forms identify the same person.
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    A portfolio of linkage-driven, direct-drive, and tendon-driven dexterous robotic hands, supported by control
    software, teleoperation tooling, and a manipulation-skills library.
  customerFocus: >-
    Enterprise and institutional buyers in robotics research, humanoid platforms, industrial automation, and existing
    robotic-arm workflows.
  businessModel: >-
