company:
  name: "Linkerbot"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Linkerbot is a Beijing dexterous-hand supplier founded in 2023 whose evidence trail shows rapid financing and manufacturing expansion, but most scale metrics remain company claims. A reported $3 billion Series B+ valuation must be kept separate from the later $6 billion fundraising target, while revenue, headcount, board composition, and a reconciled capitalization history remain unavailable."
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Linkerbot is a Beijing-based robotics company founded in 2023 and focused on
      dexterous robotic hands, associated control software, and manipulation-skill
      infrastructure. The narrow component strategy lets it sell into research,
      humanoid-robot, and industrial workflows without underwriting the timing of a
      complete general-purpose humanoid. Preqin describes direct sales of robotic
      products to enterprises and institutions as the primary revenue model, while
      independent coverage describes a portfolio spanning hand hardware and skills
      software. That combination suggests a hardware-led business with a possible
      data and software layer, but no source in the assigned evidence discloses
      revenue mix, recurring software economics, gross margin, or customer
      concentration.
    claimRefs: [CO001, CO002, CO015]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founder evidence is directionally consistent but not fully normalized.
      RobotsBeat identifies Alex Zhou as the founder, while KrASIA identifies Zhou
      Yong as founder and CTO and describes his earlier Lenovo research experience.
      The two names may refer to the same person, but the assigned sources do not
      establish that identity explicitly. KrASIA also names Cao Gang as the leader
      for algorithms and model training, which adds technical depth beyond the
      founder. No retained source provides a board roster, voting rights, succession
      plan, executive ownership, or leadership-change history. The investment case
      therefore has visible founder and technical leadership but material governance
      and key-person diligence gaps.
    claimRefs: [CO003, CO004, CO005]
    tableRefs: [TO002]
  - id: "financing-and-stakeholders"
    title: "Financing and stakeholders"
    body: >-
      The financing record shows unusually rapid capital formation but does not yet
      reconcile into a dependable total-raised or dilution history. Late-2025
      reporting described a nine-figure-renminbi Series A+ and a fourth financing
      event in eight months. Tech in Asia then reported a RMB 1.5 billion Series B in
      February 2026, and Preqin recorded a further Series B+ financing in April.
      Coverage places the Series B+ valuation at $3 billion; a later $6 billion
      figure is a target for a proposed new round, not evidence of a completed
      transaction. Financial and strategic investors are numerous, but ownership,
      preferences, board rights, secondary sales, and debt remain undisclosed.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: "scale-and-milestones"
    title: "Scale, operating signals, and milestones"
    body: >-
      Operating signals are substantial but mostly issuer-originated or based on
      management statements. Linkerbot said it shipped 10,000 hands in 2025 and
      represented 80% of worldwide demand; KrASIA separately reported monthly orders
      above 1,000 units, four subsidiary factories, and monthly capacity above 4,000
      units. The company also set a 2026 delivery ambition of 50,000 to 100,000
      hands. Product breadth spans three actuation architectures and 11 to 42 degrees
      of freedom, supporting several price and performance tiers. These milestones
      indicate commercialization momentum, but they do not substitute for audited
      shipments, accepted-customer deliveries, revenue, utilization, yield, or
      warranty data. A potential Hong Kong IPO adds a near-term disclosure catalyst,
      although the reported process remained changeable.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
