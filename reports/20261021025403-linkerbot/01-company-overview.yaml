callouts:
  - calloutType: "risk"
    title: "Valuation figures are not interchangeable"
    body: "The $3 billion figure is reported as a completed Series B+ valuation, while $6 billion is a target for a proposed financing. Treating the target as current enterprise value would overstate the verified financing record."
    claimRefs: [CO009, CO010]
  - calloutType: "recommendation"
    title: "Make the next diligence request document-led"
    body: "Request the cap table, financing closing sets, audited financial statements, monthly shipment and acceptance records, headcount roster, board minutes, and factory utilization data before relying on headline scale."
    claimRefs: [CO006, CO007, CO008, CO011, CO013]
