schemaVersion: "report-v2"
artifact: customers
slug: linkerbot
runDate: 2026-10-21
company:
  name: Linkerbot
chapter:
  number: 6
  title: Customers
  summary: >-
    Linkerbot appears to sell primarily to research teams, robot integrators, and industrial
    manufacturers, with company-issued evidence naming Samsung, Siemens, and Foxconn and
    third-party reporting describing more than 1,000 monthly shipments. The evidence supports
    early commercial scale but not customer-level production status, retention, expansion, or
    concentration, while a founder interview directly acknowledges earlier reliability and
    deployment difficulties.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      The clearest supported customer split is between research users and industrial buyers.
      China Robotics Insider describes manipulation and teleoperation research as an application,
      while RobotsBeat says research teams need learning hardware and manufacturers need end
      effectors that fit existing arms and processes. Tech in Asia further reports that Linkerbot
      is pursuing nearer-term demand by selling hands for installed robotic arms rather than
      waiting for mature humanoid platforms. This creates a component-led route to market across
      laboratories, automation teams, and robot integrators, but the reviewed evidence does not
      quantify revenue, units, geography, or buyer mix by segment.
    claimRefs: [CU001, CU002, CU011]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption signals and named-account proof
    body: >-
      Public scale signals are substantial but heterogeneous. A December 2025 report relaying
      company disclosures says monthly orders exceeded 1,000 units and gives a 2026 delivery
      target of 50,000 to 100,000 hands. The Next Web, citing Reuters, separately describes the
      company as capable of shipping more than 1,000 units per month. A Linkerbot release names
      Samsung, Siemens, and Foxconn as customers, and Tech in Asia repeats Samsung and Siemens.
      These data points indicate demand and recognizable counterparties, but they do not provide
      a common period, shipped-versus-ordered reconciliation, contract values, or customer-side
      confirmation of production deployment.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-risk
    title: Durability, reliability, and concentration
    body: >-
      The strongest adverse evidence comes from Linkerbot's own account in a FedEx Business
      Insights interview. The company says an earlier focus on peak performance produced
      inconsistent stability, difficulty sustaining continuous operation, and harder-than-expected
      customer deployment; it says priorities then shifted toward continuous operation, thermal
      stability, maintenance, and practical task-completion metrics. This is relevant evidence of
      learning, not proof that the problems are resolved. None of the eight retained sources
      supplies NRR, GRR, churn, renewals, contract duration, customer cohorts, top-customer share,
      or channel concentration, leaving durability and dependency risk unquantified.
    claimRefs: [CU008, CU009, CU012, CU013]
  - id: expansion-path
    title: Expansion path and investment implication
    body: >-
      Linkerbot's plausible expansion loop begins with a hand selected for research or an existing
      robotic arm, moves through integration and task qualification, and then depends on reliable
      production use before additional hardware, skills, or sites can follow. The reported RMB
      6,666 O6 price could reduce an entry barrier, but it is a September 2025 reported price with
      no configuration, service, integration, or lifecycle-cost denominator. Linkerbot also says
      its hands assemble robotic arms and other hands internally; that is an operational proof
      point rather than external customer validation. Investment underwriting should therefore
      require customer-side references and cohort data before treating shipments as durable
      land-and-expand revenue.
    claimRefs: [CU010, CU011, CU016]
    figureRefs: [FU001]
