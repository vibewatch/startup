figures:
  - id: FU001
    title: Evidence-qualified customer adoption journey
    type: journey-map
    summary: >-
      The likely sequence from evaluation to expansion, with the unresolved proof needed at each
      step rather than an asserted conversion funnel.
    data:
      nodes:
        - id: discover
          label: Discover and select
          detail: Research, industrial, and integrator buyers compare hand designs and entry price.
        - id: integrate
          label: Integrate
          detail: The hand is connected to an existing arm, controller, and customer workflow.
        - id: qualify
          label: Qualify task
          detail: Buyers test task completion, stability, thermal behavior, and maintenance.
        - id: deploy
          label: Deploy
          detail: Production status is not disclosed for the named Samsung, Siemens, or Foxconn relationships.
        - id: operate
          label: Sustain operation
          detail: Public NRR, GRR, churn, renewal, uptime, and cohort evidence is unavailable.
        - id: expand
          label: Expand hardware and skills
          detail: Additional sites, hands, and reusable skills are plausible but not publicly quantified.
    approximationNotes: >-
      Analytical sequence inferred from the reviewed use cases and company reliability comments;
      it is not a measured cohort, conversion funnel, or disclosed customer process.
    claimRefs: [CU008, CU009, CU010, CU011, CU016]
callouts:
  - calloutType: strength
    title: Commercial scale has multiple public signals
    body: >-
      Distinct reports describe more than 1,000 monthly orders, more than 1,000 monthly shipments,
      and three recognizable customer names, although the metrics do not share a denominator.
    claimRefs: [CU003, CU005, CU006]
  - calloutType: risk
    title: Shipment volume is not retention evidence
    body: >-
      The retained evidence does not disclose customer cohorts, renewal rates, repeat purchases,
      contract duration, top-customer share, or customer-side operating outcomes.
    claimRefs: [CU012, CU013, CU014]
