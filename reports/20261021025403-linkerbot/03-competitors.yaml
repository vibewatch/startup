schemaVersion: "report-v2"
artifact: competitors
slug: linkerbot
runDate: 2026-10-21
company:
  name: Linkerbot
chapter:
  number: 3
  title: Competitors
  summary: >-
    Linkerbot is positioned between expensive research-grade dexterous hands,
    simpler industrial grippers, and vertically integrated humanoid programs.
    Its breadth across three drive architectures, low advertised entry pricing,
    and claimed production scale are differentiators, but durability,
    task-completion performance, market share, and realized customer economics
    remain insufficiently independently benchmarked.
sections:
  - id: landscape-and-buyer-alternatives
    title: Competitive landscape and buyer alternatives
    body: >-
      Linkerbot competes in a layered market rather than against one clean peer
      set. Shadow Robot is the legacy high-articulation benchmark: Pandaily
      reports 24 independently controlled joints and a roughly $140,000-$280,000
      price range. Tesla, Boston Dynamics, Figure AI, 1X, and Apptronik represent
      a different threat because they can internalize hand development inside a
      complete humanoid platform. At the lower-complexity end, conventional
      commercial grippers with one to six degrees of freedom remain adequate for
      constrained pick-and-place work. Buyers can also retain current automation
      or build an end effector internally. Linkerbot's component-supplier model
      therefore expands its addressable customer set beyond any single robot
      body, but also leaves distribution and integration power with robot OEMs
      and automation integrators.
    claimRefs: [CP001, CP003, CP004, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-product-position
    title: Capability breadth and product position
    body: >-
      Linkerbot's most defensible product distinction is architectural breadth,
      not degree-of-freedom count alone. Multiple reviewed sources describe
      linkage, direct-drive, and tendon-driven products, allowing the company to
      trade among stiffness, compactness, speed, maintainability, and
      biomimicry. The O6 also establishes a low advertised entry point: a
      September 2025 report listed it at RMB 6,666, while Pandaily described the
      L20 at roughly one-twentieth the cost of comparable overseas products.
      Those figures are useful positioning signals, not proof of delivered cost
      per successful task. RobotsBeat correctly cautions that active and passive
      joint counts do not establish reliability or maintenance burden, and
      Linkerbot's own co-founder acknowledged that earlier emphasis on peak
      metrics produced inconsistent stability and difficult customer
      deployments.
    claimRefs: [CP002, CP005, CP006, CP011, CP012]
    tableRefs: [TP002]
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching economics
    body: >-
      Public evidence supports list-price and architecture comparisons, but not
      realized transaction pricing, discounts, integration labor, service life,
      or replacement cost. Linkerbot's software and data layer may create
      switching cost if customers standardize workflows around LinkerSkillNet:
      company-originated material says the library has more than 500 skills,
      while RobotsBeat describes teleoperation, a skills store, and a model
      layer around the hardware. The same coupling can work against adoption
      when buyers already own a control stack or prefer an integrated robot OEM.
      Capital access may help Linkerbot subsidize manufacturing and channel
      expansion; Tech in Asia reported a RMB 1.5 billion Series B and a possible
      Hong Kong IPO, while Preqin records a subsequent Series B+ round but does
      not disclose total capital in its public preview.
    claimRefs: [CP007, CP014, CP015]
    tableRefs: [TP003]
  - id: moat-durability-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      The emerging moat thesis combines cost-down manufacturing, multi-architecture
      engineering, installed hardware, and proprietary manipulation data.
      Company-originated releases claim thousands of units per month, more than
      500 skills, and over 80% share of high-degree-of-freedom hands; Gasgoo
      separately reports a 60,000-100,000-unit annual-capacity line and more than
      140 CNC machines, but its underlying operating metrics appear supplied by
      Linkerbot rather than audited. These signals support a scale hypothesis,
      not a verified market-share conclusion. Displacement risk remains
      meaningful from full-stack humanoid makers, well-capitalized component
      entrants, and simpler grippers that solve narrower jobs more reliably.
      The investment case should therefore treat verified task success, service
      life, gross margin, customer retention, and independently measured share
      as gating evidence rather than extrapolate a durable moat from shipment
      and demonstration claims.
    claimRefs: [CP008, CP009, CP010, CP016]
