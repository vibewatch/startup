callouts:
  - calloutType: strength
    title: Architectural breadth reduces single-design risk
    body: >-
      Linkerbot is reported to offer linkage, direct-drive, and tendon-driven
      hands, allowing product selection around stiffness, speed, compactness,
      and maintainability rather than forcing every workload onto one mechanism.
    claimRefs: [CP002]
  - calloutType: risk
    title: Demonstrations are not deployment benchmarks
    body: >-
      Linkerbot's co-founder acknowledged that peak-performance emphasis once
      produced inconsistent stability, difficult continuous operation, and
      harder-than-expected customer deployment.
    claimRefs: [CP011]
