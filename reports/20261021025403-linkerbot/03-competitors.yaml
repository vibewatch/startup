      - ["Linker Hand L20", "Roughly one-twentieth of comparable overseas products, as reported by Pandaily", "One 21-DoF hand", "Industrial and general versions reported", "Comparator basket and realized discounts are undisclosed"]
      - ["Shadow Hand", "Roughly $140,000-$280,000, reported by Pandaily", "One 24-joint research-grade hand", "High articulation and established research benchmark", "Current quote, support terms, and total ownership cost unavailable"]
      - ["Full-stack humanoid hand", "No standalone public price in retained evidence", "Bundled within a robot platform", "Potential body-hand-control integration", "Transfer price and replaceability are not observable"]
      - ["Simple gripper or internal build", "No comparable retained price", "Task-specific hardware or engineering project", "Lower-complexity substitute or buyer-controlled design", "Requires customer-specific build-versus-buy analysis"]
    notes: >-
      Public list and relative-price signals only; no row establishes realized
      revenue, gross margin, lifecycle cost, discounting, or task-level return on
      investment.
    claimRefs: [CP003, CP005, CP006, CP012]
