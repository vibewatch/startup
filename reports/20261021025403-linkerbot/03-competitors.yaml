      - ["Articulation", "Portfolio reported at 11-42 DoF; model definitions vary", "24 independently controlled joints reported", "Tesla 22; Atlas four fingers and 13 DoF reported", "Commercial grippers commonly 1-6 DoF"]
      - ["Software and data layer", "LinkerSkillNet, teleoperation, and 500+ company-claimed skills", "Unknown in retained evidence", "Potentially integrated with body-level control and data", "Buyer-specific tooling or incumbent controls"]
      - ["Reliability evidence", "Founder acknowledged historical stability and continuous-operation limitations", "Unknown in retained evidence", "Unknown in retained evidence", "Potentially favored for simpler, bounded tasks; no comparative benchmark retained"]
      - ["Distribution and lock-in", "Component can serve multiple robot bodies, but requires integration", "Research ecosystem position; switching evidence unknown", "Body-hand-control bundle can internalize integration", "Existing workflow and tooling can preserve the status quo"]
    notes: >-
      Qualitative matrix; company specifications and company-originated skill
      counts are not independent performance benchmarks, and every unsupported
      comparison is marked unknown.
    claimRefs: [CP002, CP004, CP007, CP011, CP012, CP013]
  - id: TP003
    title: Public pricing and packaging comparison
    columns:
