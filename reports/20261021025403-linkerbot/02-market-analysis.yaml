      - [Linkerbot via PR Newswire, "January 2026", Global, "Thousands of units produced monthly", null, "Company statement", Low, "Production is not sales, installed base, revenue, or TAM"]
      - [China Biz Insider, "November 2025", Global, "Monthly orders above 1,000 units", null, "Reported founder disclosure", Medium-low, "Order value, cancellations, repeat mix, and shipment conversion are unavailable"]
      - [China Biz Insider, "Late 2025 / 2026 target", Global, "Capacity above 4,000 units monthly; target 50,000-100,000 deliveries", null, "Reported company capacity and target", Low, "Capacity and target output are not realized demand"]
      - [China Biz Insider, "November 2025", China, "RMB 3,999 subsidized entry model to RMB 99,900 high-end model", null, "Published product-price examples", Medium-low, "Versions, subsidies, discounts, service, and realized mix are unknown"]
      - [RoboHorizon, "September 2025", China, "RMB 6,666 for Linker Hand O6", null, "Published point-in-time price", Low, "Conflicts in basis with later subsidized pricing; not a market average"]
      - [Retained source set, "As of 2026-10-21", Global, "Independent TAM / SAM / SOM unavailable", null, "No retained source supplies a reconciled category estimate", High, "Requires independent shipments, ASPs, category rules, and geography"]
    notes: >-
      Values preserve each publisher's period and basis. Share, production, orders, capacity,
      delivery targets, and list prices are different metrics and are not combined into a market estimate.
    claimRefs: [CM004, CM005, CM008, CM009, CM010]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Robotics research, "Principal investigator or lab lead", "Researchers and engineers", "Research grant or corporate R&D", "Manipulation learning and benchmarking", "Controllable high-DOF platform at an accessible price"]
      - [Humanoid OEM, "Subsystem or platform engineering", "Controls and integration teams", "Product development or bill of materials", "Integrate hand into arm and whole-body stack", "Payload, interface, task fit, supply, and cost"]
      - [Industrial automation, "Automation engineering", "Operators and maintenance teams", "Plant operations or capital expenditure", "Assembly, irregular grasping, and tool handling", "Repeatable task ROI and service life"]
      - [Data and skills development, "AI or robotics platform lead", "Teleoperators and model engineers", "R&D or software platform budget", "Collect demonstrations and package reusable skills", "Data quality and transfer to production tasks"]
      - [Service or hazardous work, "Solution integrator", "Remote operator or service team", "Project owner or operating department", "Remote manipulation in variable environments", "Safety case, reliability, and lower total cost than alternatives"]
    notes: >-
      Segment roles are analytical mappings grounded in cited applications; named customers do not
      disclose purchasing authority, contract scope, deployment count, or realized return on investment.
    claimRefs: [CM002, CM006, CM007, CM011, CM012]
figures:
  - id: FM001
    title: Evidence-constrained addressable-market layers
    type: pyramid
    summary: >-
      The visual narrows broad robotics activity to the hand-specific hardware and enablement layer
      that Linkerbot can plausibly monetize; no numeric TAM is asserted.
    data:
      nodes:
        - label: Broad robotics and automation
          value: Excluded denominator
          detail: Includes spending unrelated to dexterous hands.
        - label: Full humanoid platforms
          value: Demand driver only
          detail: Locomotion, bodies, batteries, and whole-system software are excluded.
        - label: Existing robotic-arm deployments
          value: Served adjacency
          detail: Hands can be sold before general-purpose humanoids mature.
        - label: High-DOF hand hardware
          value: Core market
          detail: Linkage, direct-drive, and tendon-driven products for manipulation.
        - label: Hand integration and teleoperation
          value: Coupled enablement
          detail: Interfaces and data capture needed to deploy and train the hand.
        - label: Reusable manipulation skills
          value: Emerging software layer
          detail: Potential expansion beyond hardware, with monetization still undisclosed.
    approximationNotes: >-
      Layers are qualitative market boundaries, not value-proportional widths. Numeric values are
      intentionally omitted because the retained sources do not provide a defensible TAM, SAM, or SOM.
    claimRefs: [CM001, CM002, CM006, CM011, CM014]
callouts:
  - calloutType: insight
    title: The immediate market does not require humanoid maturity
    body: >-
      Selling hands into existing robotic arms creates a nearer-term adoption path, but the relevant
      denominator is compatible manipulation deployments rather than all humanoid or robotics spending.
    claimRefs: [CM006, CM014]
  - calloutType: risk
    title: Share claims lack an independent denominator
    body: >-
      The reported 80%+ share cannot anchor valuation until diligence defines high-DOF eligibility,
      verifies competitor and internal-build volumes, and reconciles orders, shipments, and revenue.
    claimRefs: [CM004, CM005]
