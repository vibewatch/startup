      - [Humanoid platforms, "Dexterous-hand subsystem supplied into the platform", "Locomotion, torso, batteries, and full-system software", "Humanoid manufacturer", "Demand driver, not the sizing denominator"]
      - [Status-quo substitutes, "None when retained as an excluded alternative", "Conventional grippers, internal builds, manual work, or delayed automation", "Operations or engineering owner", "Constrains conversion and pricing"]
    notes: >-
      Boundary is analyst-defined from Linkerbot's product catalog and third-party descriptions;
      excluded categories are not counted as addressable spend and no monetary size is implied.
    claimRefs: [CM001, CM002, CM003, CM014]
