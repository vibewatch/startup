schemaVersion: "report-v2"
artifact: market-analysis
slug: linkerbot
runDate: 2026-10-21
company:
  name: Linkerbot
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Linkerbot addresses the high-degree-of-freedom dexterous-hand layer between robot intelligence
    and physical work, with nearer-term demand from research, humanoid OEM, and industrial-arm
    deployments. Company-reported share, orders, and capacity indicate commercial momentum, but
    no retained independent source provides a reconciled TAM, SAM, SOM, or category methodology.
sections:
  - id: market-boundary
    title: A component market, not the whole humanoid economy
    body: >-
      The investable boundary is high-degree-of-freedom robotic hands and the closely coupled
      controls, teleoperation, and skills software needed to deploy them. Linkerbot's own catalog
      spans linkage, direct-drive, and tendon-driven hands with materially different degrees of
      freedom, weights, loads, and interfaces, then extends into arms, a humanoid platform, motion
      capture, and force feedback. That breadth makes a broad "robotics" denominator misleading.
      The core market should include hand hardware and hand-specific integration; it should exclude
      complete humanoid bodies, general-purpose robot arms, unrelated factory automation, and
      model-compute spend. Conventional grippers, internal end-effector development, and waiting
      for a more mature humanoid stack remain economically relevant substitutes rather than
      addressable dexterous-hand revenue.
    claimRefs: [CM001, CM002, CM003, CM014]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-with-proxies
    title: Commercial proxies are useful, but they are not TAM
    body: >-
      Available evidence offers shipment, order, capacity, pricing, and claimed-share signals
      rather than a defensible market-size series. Linkerbot's CES release claims more than 80% of
      the global high-DOF hand market and thousands of units of monthly production. China Biz
      Insider separately reported monthly orders above 1,000 units, monthly capacity above 4,000,
      and an aggressive 2026 delivery target, but those figures trace back to company statements
      and do not disclose the category denominator. Published prices span subsidized entry models
      through research-oriented products, demonstrating segmentation while also showing why one
      unit count cannot be multiplied by one list price. A numeric TAM, SAM, or SOM would therefore
      create false precision until independent shipment data, realized average selling prices, and
      a stable definition of "high-DOF" are obtained.
    claimRefs: [CM004, CM005, CM008, CM009, CM010]
    tableRefs: [TM002]
  - id: buyers-and-budgets
    title: Buyer, user, and payer vary by deployment
    body: >-
      Research laboratories buy controllable hardware and data-collection tooling; humanoid OEMs
      buy a subsystem that must fit their arm, control stack, and target tasks; industrial users
      ultimately pay for completed work rather than degrees of freedom. Reporting places Linkerbot
      with customers in scientific research, humanoid robotics, and industry, and company-issued
      materials name Samsung, Siemens, and Foxconn. Those references show segment breadth but not
      procurement depth, repeat orders, or customer economics. Near-term adoption can occur on
      existing robotic arms before general-purpose humanoids mature, which expands the immediate
      buyer set. Budget ownership should nevertheless be validated deployment by deployment:
      robotics R&D may fund pilots, while operations or automation teams must justify scaled use
      through integration effort, task success, service life, and replacement cost.
    claimRefs: [CM006, CM007, CM012]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Falling entry prices broaden trials; reliability governs scale
    body: >-
      The principal growth drivers are more affordable hands, multiple architectures for different
      payload and control requirements, and software that converts demonstrations into reusable
      manipulation skills. Linkerbot says LinkerSkillNet contains more than 500 real-world skills,
      and its product range gives buyers options from lower-cost entry hardware to high-DOF research
      systems. The binding constraints are less visible: integration into third-party arms,
      repeatable task completion under variable conditions, maintenance, replacement cost, safety,
      and proof that demonstrations survive production workloads. A large technology company could
      also use scale to compress hardware margins. Financing and a possible IPO may fund capacity,
      but capital availability does not independently validate end-market size. Valuation work
      should therefore weight verified deployments and unit economics above claimed category share.
    claimRefs: [CM003, CM011, CM012, CM013]
