evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Legal identity reconciliation for Alex Zhou and Zhou Yong, complete executive and board roster, voting rights,
      ownership, succession plan, and leadership-change history.
    whyItMatters: The current evidence cannot determine founder concentration, board independence, or resilience to key-person loss.
    diligencePath: >-
      Request the business registration, cap table, board minutes, executive employment agreements, and a
      management-confirmed organization chart.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, cash, burn, debt, headcount, customer concentration, and revenue mix.
    whyItMatters: Operational scale and financing headlines cannot establish economics, liquidity, or organizational capacity.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank and debt schedules, payroll roster, and
      customer-level revenue cohort data.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled round-by-round capitalization history separating primary proceeds, secondaries, debt, pre-money
      valuation, and post-money valuation.
    whyItMatters: The reported rounds and valuation targets do not yield a reliable total-raised figure or dilution profile.
    diligencePath: >-
      Review signed financing agreements, funds-flow statements, shareholder registers, and board approvals for every
      round.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: scale-verification
    missingEvidence: >-
      Independent audit of shipment volumes, accepted deliveries, market share, factory capacity, utilization, yield,
      warranty returns, and named-customer purchasing.
    whyItMatters: >-
      The largest scale metrics are management statements or repeat reporting and may not translate into recognized
      revenue or durable demand.
    diligencePath: >-
      Sample invoices, customer acceptance records, serial-number logs, factory production data, warranty records, and
      third-party channel checks.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent global and China shipment, installed-base, realized ASP, and revenue data under an explicit high-DOF
      dexterous-hand category definition.
    whyItMatters: >-
      Without a denominator and comparable transaction values, reported share, orders, capacity, and price points cannot
      support a numeric TAM, SAM, SOM, or market-growth rate.
    diligencePath: >-
      Commission a bottom-up competitor shipment and ASP study, reconcile it to customer procurement records, and
      triangulate with an independent industry dataset.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Customer contracts, deployment counts, repeat-order rates, task success, integration hours, service-life data, and
      realized total cost of ownership by segment.
    whyItMatters: >-
      Named customers and demonstrations do not show which budget owns scaled deployment or whether a dexterous hand
      clears operational return thresholds.
    diligencePath: >-
      Obtain cohort-level invoices and deployments, then conduct reference calls with research, humanoid-OEM, and
      industrial buyers using a common ROI template.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: A dated price book reconciling O6 versions, subsidies, channel discounts, software, support, and geography.
    whyItMatters: >-
      The retained sources report RMB 6,666 and RMB 3,999 for O6-related offerings on different dates and bases,
      preventing a reliable entry-price trend or blended ASP.
    diligencePath: >-
      Request executed invoices and the versioned price list, then separate list price, subsidy, discount, and
      bundled-service effects.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: >-
      An independent high-DoF dexterous-hand market definition with vendor shipments, revenue, period, geography, and
      denominator.
    whyItMatters: >-
      The claimed 80% share is central to distribution power and moat durability but cannot be underwritten from
      company-originated figures.
    diligencePath: >-
      Obtain sell-through data from distributors and major robot OEMs, then reconcile it with third-party vendor
      shipment estimates.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Customer invoices, discount schedules, integration hours, warranty terms, failure rates, service life, and
      task-level completion benchmarks for Linkerbot and alternatives.
    whyItMatters: >-
      List prices and demonstrations cannot establish total ownership cost, switching cost, gross margin, or return on
      investment.
    diligencePath: >-
      Sample contracts and service records from at least three industrial customers and run a controlled benchmark
      against a simple gripper and a research-grade dexterous hand.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, runway, debt, restricted cash, committed capex, and the operational
      trigger for the next financing.
    whyItMatters: >-
      Funding raised and prospective financing do not establish liquidity or the time available to reach sustainable
      economics.
    diligencePath: >-
      Obtain bank statements, debt schedules, board-approved budgets, monthly cash-flow statements, capex commitments,
      and financing term sheets.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: >-
      Recognized revenue by product and customer, realized ASP, discounts, returns, concentration, backlog conversion,
      and revenue-recognition policy.
    whyItMatters: Public starting prices and production volume cannot establish paid demand, revenue quality, or repeatability.
    diligencePath: >-
      Reconcile signed orders, acceptance records, invoices, revenue ledger, collections, returns, and cohort-level
      repeat orders.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Bill of materials, direct labor, freight, warranty, support, gross margin, contribution margin, CAC, payback,
      inventory turns, and receivable aging.
    whyItMatters: >-
      A high-output manufacturing footprint may create operating leverage or consume cash; public evidence cannot
      distinguish the outcomes.
    diligencePath: >-
      Obtain SKU-level cost sheets, monthly margin bridges, warranty cohorts, sales-efficiency data, inventory reports,
      and receivable aging.
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: cost structure
    missingEvidence: >-
      A reconciled list of operating factories, including ownership, lease status, function, capacity, and commissioning
      date.
    whyItMatters: >-
      Reuters reported five factories while Linkerbot's CES release described four proprietary factories, changing
      fixed-cost and capacity assumptions.
    diligencePath: Request the fixed-asset register, lease schedule, site list, and production capacity by facility.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A usable public repository, package registry, API or SDK documentation, release history, engineer talk, or
      practitioner-community integration discussion tied to Linkerbot.
    whyItMatters: >-
      Without a public developer surface or practitioner proxy, integration quality, software maturity, compatibility,
      and ecosystem adoption cannot be independently assessed.
    diligencePath: >-
      Request private SDK and API documentation, release notes, supported controller matrices, reference integrations,
      and access to integrator engineers; then validate a representative integration.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: reliability
