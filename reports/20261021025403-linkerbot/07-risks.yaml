schemaVersion: "report-v2"
artifact: risks
slug: linkerbot
runDate: 2026-10-21
company:
  name: Linkerbot
chapter:
  number: 7
  title: Risks
  summary: >-
    Linkerbot's most decision-relevant risks are executional: management has acknowledged
    historical reliability and deployment limits, while public targets imply a steep production
    ramp. Safety, regulatory, supplier-concentration, field-failure, and unit-economics evidence
    remain incomplete, and vertical integration by large robot platforms could weaken the
    component-supplier thesis.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest residual exposure is operational reliability at scale. In a July 2026 interview,
      Linkerbot's co-founder acknowledged that earlier systems showed inconsistent stability,
      difficulty sustaining continuous operation, and harder-than-expected customer deployment;
      management says it has since shifted attention toward continuous operation, thermal
      stability, maintenance, and practical task completion. That response is directionally
      appropriate, but the assigned evidence contains no independently measured field-failure,
      uptime, warranty, or return-rate series. A second high exposure is scale execution: a
      company-reported 10,000th cumulative shipment in December 2025 sits against a reported
      target of 50,000-100,000 deliveries in 2026. The risk is not that the target is impossible,
      but that quality controls, service capacity, and working capital are not publicly evidenced
      at the same level as the volume ambition.
    claimRefs: [CR001, CR002, CR005, CR007, CR008]
  - id: operational-safety
    title: Operational, quality, and safety exposure
    body: >-
      Product demonstrations and degree-of-freedom specifications do not establish dependable
      customer outcomes. RobotsBeat explicitly notes that active and passive joint counts alone
      cannot prove task reliability or maintenance burden, while Linkerbot's own humanoid page
      describes a roughly 100 kg mobile platform, a 2 kg arm-end payload, and remote operation
      from a safe distance. Those disclosures make controls such as obstacle sensing and
      teleoperation visible, but they do not substitute for third-party functional-safety
      certification, incident history, or autonomous task-completion evidence. The O6's reported
      6,666 RMB price may widen adoption, yet without gross-margin, warranty-cost, service-life,
      and replacement-cost data it also creates an unresolved economics and quality tradeoff.
      Investment underwriting should therefore require cohort-based reliability and cost data,
      not peak demonstrations.
    claimRefs: [CR001, CR002, CR003, CR004, CR012, CR013, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-governance
    title: Regulatory, legal, and governance diligence
    body: >-
      The assigned public evidence does not establish Linkerbot's certification coverage,
      product-liability controls, export-control posture, privacy and training-data rights, patent
      disputes, recalls, or litigation status. That absence is a diligence gap, not evidence that
      no issue exists. BestStartup.Asia separately flags geopolitical scrutiny arising from
      state-fund investors and a Beijing-Shenzhen footprint, while Tech in Asia reports that a
      possible Hong Kong IPO remained under discussion and could change. An IPO process may
      improve disclosure discipline, but it does not currently provide audited operating or risk
      data in this source set. The regulatory register is therefore deliberately partial and uses
      conditional severity rather than invented incident probabilities.
    claimRefs: [CR003, CR004, CR009, CR010, CR011]
    tableRefs: [TR001]
  - id: dependencies-thesis-breakers
    title: Dependencies, financing, and thesis-break triggers
    body: >-
      Linkerbot depends on robot integrators continuing to buy a specialized hand rather than
      vertically integrating it. BestStartup.Asia identifies Tesla's in-house hand work and
      whole-robot ambitions among platform companies as direct strategic threats; it also frames
      the component supplier's ceiling as sensitive to whether humanoids remain a niche. The
      company's claimed 80% share is therefore concentration in a young category, not automatic
      durability. Financing evidence also needs reconciliation: a December 2025 release cited
      $150 million raised since April 2025, Tech in Asia later reported a $220 million February
      2026 Series B, and other reporting described a proposed $6 billion valuation after a $3
      billion Series B+. Kill criteria should include unresolved audited funding data, a material
      rise in field failures, failed production qualification, or major integrators shifting
      decisively in-house.
    claimRefs: [CR006, CR009, CR010, CR011, CR014, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / scope
      - Public evidence status
      - Likelihood
      - Conditional severity
      - Disclosed mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Human-robot safety and product liability
        - Global deployments
        - Official page discloses safe-distance teleoperation and obstacle sensors; no certification or incident record appears in the assigned pool
        - Unknown
        - High if a field failure injures a user or damages customer equipment
        - Remote control, RGB camera, infrared ranging, ultrasound, and path planning are company-described
        - High until certification scope and field history are verified
        - Obtain ISO/CE/UL or local equivalents, hazard analyses, incident logs, insurance, and customer acceptance criteria
      - - Export-control and geopolitical restrictions
        - China-to-global sales and research relationships
        - Independent reporting flags scrutiny tied to state-fund investors and the Beijing-Shenzhen footprint; no legal opinion is public here
        - Unknown
        - High if restricted-market access or component sourcing is interrupted
        - No specific compliance program is evidenced in the assigned pool
        - Material and unquantified
        - Commission jurisdiction-by-jurisdiction export, sanctions, data-transfer, and end-use review
      - - IPO, disclosure, and governance readiness
        - Potential Hong Kong listing
        - Tech in Asia reports advisors were hired, but talks were ongoing and plans could change
        - Unknown
        - Medium-high if weak controls delay financing or surface undisclosed liabilities
        - Engagement of named financial advisers was reported
        - Material because audited accounts, board controls, and litigation schedules are not public in this evidence set
        - Review audited financials, cap table, board minutes, related-party transactions, litigation, and listing-preparation workstreams
    notes: >-
      Partial public-source register based only on assigned 2025-2026 evidence; no regulator,
      court, certification-body, recall, or incident database source was available in the pool,
      so unknown likelihoods are not scored as low risk.
    enumerationScope:
      coverage: partial
      basis: Public risks visible in the assigned 2025-2026 source pool, not an exhaustive legal search
    claimRefs: [CR003, CR004, CR009, CR010, CR011, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood evidence
      - Impact
      - Mitigation maturity
      - Residual exposure
      - Monitor / thesis-break trigger
    rows:
      - - Continuous-operation or thermal reliability falls short in customer use
        - Co-founder acknowledged inconsistent stability, difficult sustained operation, and deployment friction in earlier real-world use
        - Historical issue evidenced; current frequency undisclosed
        - High
        - Developing; management names reliability-oriented metrics, but no external cohort is public
        - High
        - Require uptime, thermal-failure, return, repair-time, and task-completion cohorts; break thesis if production cohorts do not improve
      - - Production ramp causes quality drift or service bottlenecks
        - Company reported a 10,000th cumulative shipment by December 2025; another source reports a 50,000-100,000 delivery target for 2026
        - Unknown
        - High
        - Capital and manufacturing expansion are reported, but process capability and service coverage are not
        - High
        - Track yield, scrap, warranty, supplier lead times, on-time delivery, and technician capacity monthly
      - - Teleoperation masks an autonomy or integration gap
        - Official humanoid page describes remote control of arms and hands from a safe distance
        - Evidenced for the described product configuration; prevalence across customers unknown
        - Medium-high
        - Deployed remote-operation system exists
        - Medium until autonomous task completion is independently measured
        - Require customer task success with intervention rates and integration time; break thesis if economics require persistent expert teleoperation
      - - Low price outpaces cost, durability, or warranty discipline
        - RoboHorizon reported a 6,666 RMB O6 price; public unit economics are absent
        - Unknown
        - High if negative contribution margin or early replacement is material
        - Not publicly evidenced
        - High
        - Obtain bill of materials, gross margin by model, service life, warranty reserve, and replacement-frequency data
    notes: >-
      Likelihood is left unknown where the assigned sources provide no denominator. Impact and
      residual-exposure labels are conditional analytical judgments tied to the cited operating
      evidence, not measured incident probabilities.
    claimRefs: [CR001, CR002, CR003, CR005, CR007, CR008, CR012, CR013, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / market
      - Role
      - Concentration evidence
      - Failure scenario
      - Conditional severity
      - Mitigation evidence
      - Residual exposure / trigger
    rows:
      - - External robot integrators
        - Humanoid and industrial robot OEMs
        - Buyers and integration channels for dexterous hands
        - Company claims more than 80% share in high-DoF hands; customer concentration is undisclosed
        - Large integrators design hands in-house or dual-source
        - High
        - Breadth of hand architectures and skills software is publicly described
        - High; trigger if top integrators internalize hand design or top-10 revenue concentration is excessive
      - - Humanoid category adoption
        - Global humanoid ecosystem
        - End-market demand for a specialized component
        - BestStartup.Asia says a niche humanoid outcome would cap a component supplier's ceiling
        - General-purpose humanoid deployments remain slower or narrower than production plans assume
        - High
        - Linkerbot also targets existing robotic arms and research uses
        - Material; trigger if repeat production orders lag capacity additions
      - - Capital markets and new financing
        - Private investors and potential Hong Kong IPO investors
        - Funds capacity expansion and commercialization
        - Public reports cite different round scopes, a possible IPO, and a prospective $6 billion valuation
        - IPO or new round is delayed, repriced, or accompanied by adverse terms
        - High
        - Multiple completed financings and named IPO advisers are reported
        - High until audited cash, burn, obligations, and cap-table terms are reconciled
      - - Data and skills ecosystem
        - Research users, customers, and data contributors
        - Supplies manipulation data and reusable skills around the hardware
        - More than 500 behaviors are company-claimed; external usage and rights coverage are not quantified
        - Data rights, transferability, or low customer reuse prevents a software moat
        - Medium-high
        - LinkerSkillNet and teleoperation tooling are publicly described
        - Material; trigger if external task success, reuse, and data permissions cannot be demonstrated
    notes: >-
      Concentration percentages, contract terms, renewal data, supplier shares, and top-customer
      exposure were not available in the assigned pool; rows distinguish disclosed dependencies
      from unverified mitigation claims.
    claimRefs: [CR006, CR009, CR010, CR011, CR014, CR016]
figures:
  - id: FR001
    title: Risk heatmap by impact, evidence of likelihood, and mitigation maturity
    type: matrix
    summary: >-
      Six decision-critical risks remain high-impact, while likelihood evidence and mitigation
      maturity are generally incomplete rather than demonstrably low.
    data:
      columns:
        - Impact if realized
        - Likelihood evidence
        - Mitigation maturity
      rows:
        - label: Continuous-operation reliability
          values:
            - High
            - Historical limitation acknowledged; current rate unknown
            - Developing, without an independent field cohort
        - label: Scale-up quality control
          values:
            - High
            - Ramp magnitude is evidenced; defect probability unknown
            - Manufacturing expansion disclosed; controls unverified
        - label: Product safety / liability
          values:
            - High
            - Incident frequency unknown
            - Teleoperation and sensors disclosed; certification gap remains
        - label: Integrator verticalization
          values:
            - High
            - Specific strategic threat reported; timing unknown
            - Product breadth and data strategy disclosed
        - label: Financing / IPO execution
          values:
            - High
            - IPO and valuation plans reported but not completed
            - Advisers and prior rounds reported; audited runway absent
        - label: Unit economics / warranty
          values:
            - High
            - Public price exists; cost and failure denominators absent
            - Not publicly evidenced
    approximationNotes: >-
      Qualitative matrix only. "Unknown" is preserved where the assigned source pool lacks a
      measured denominator; it is not converted into a low-likelihood score.
    claimRefs: [CR001, CR002, CR004, CR008, CR009, CR010, CR011, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Thesis-break conditions
    body: >-
      Pause or reject investment if diligence cannot reconcile audited funding and cash, if
      scaled production cohorts show persistent reliability or warranty deterioration, if required
      safety or export approvals are absent, or if major integrators materially shift hand design
      in-house without offsetting customer diversification.
    claimRefs: [CR001, CR008, CR011, CR014]
