  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal
      missingEvidence: >-
        Jurisdiction-specific safety certifications, export-control opinions, privacy and
        training-data rights, patent disputes, litigation, recalls, and incident records.
      whyItMatters: >-
        These records determine whether products can be sold and operated safely and whether
        undisclosed liabilities could block deployment or financing.
      diligencePath: >-
        Obtain counsel-prepared regulatory matrices, certification files, insurance and claims
        histories, patent freedom-to-operate work, data-rights contracts, and regulator or court searches.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: supplier-and-field-quality
      missingEvidence: >-
        Supplier concentration, production yield, field-failure, return, repair-time, warranty,
        service-coverage, and top-customer concentration data.
      whyItMatters: >-
        The size and durability of the production advantage cannot be underwritten without
        denominators that connect shipment growth to quality and service capacity.
      diligencePath: >-
        Review monthly operating cohorts, supplier spend, quality escape logs, warranty reserves,
        service staffing, and revenue concentration by customer and integrator.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Bill of materials, gross margin by hand model, warranty and replacement cost, working
        capital needs, and contribution margin after integration and support.
      whyItMatters: >-
        A low public product price may accelerate adoption or may mask weak economics; the
        assigned sources do not distinguish those outcomes.
      diligencePath: >-
        Reconcile invoice-level prices to costed bills of materials, warranty cohorts, support
        labor, channel discounts, and cash conversion by product generation.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR002]
    - type: conflicting-data
      severity: material
      topic: funding-reconciliation
      missingEvidence: >-
        A dated financing ledger reconciling round size, cumulative funding, valuation, cash
        received, investor rights, debt, and current cash available.
      whyItMatters: >-
        Funding raised is not cash available, and the public amounts use different periods and
        cannot support runway or dilution analysis without reconciliation.
      diligencePath: >-
        Inspect signed financing documents, capitalization tables, bank statements, debt
        schedules, preference terms, and audited cash-flow statements.
      relatedQuestionRefs: [QR006, QR008]
      relatedTableRefs: [TR003]
