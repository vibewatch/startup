      - number: '3.2'
        title: 能力广度与产品定位
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 最有防御力的产品差异不是自由度数量，而是架构广度。多个经审阅来源都描述了连杆驱动、直接驱动和腱驱动产品，使公司可以在刚度、紧凑性、速度、可维护性和仿生性之间取舍。O6
              还建立了较低的宣传起售价：2025 年 9 月的一篇报道列价 RMB 6,666，Pandaily 则称 L20
              的价格约为海外同类产品的二十分之一。这些数字是定位信号，不是每项成功任务的实际交付成本。RobotsBeat 正确提醒，主动和被动关节数量不能证明可靠性或维护负担；Linkerbot
              联合创始人也承认，早期过度强调峰值指标，导致稳定性不一致、客户部署困难。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: 定价、分销与切换经济性
        blocks:
          - type: paragraph
            body: >-
              公开证据支持目录价和架构比较，但不能证明实际成交价、折扣、集成工时、使用寿命或更换成本。如果客户围绕 LinkerSkillNet 固化工作流，Linkerbot
              的软件和数据层可能形成切换成本：公司材料称技能库超过 500 项，RobotsBeat 则描述了围绕硬件的远程操作、技能商店和模型层。但如果买方已有控制栈，或偏好一体化机器人
              OEM，同样的耦合也会阻碍采用。资金渠道可能帮助 Linkerbot 补贴制造和渠道扩张；Tech in Asia 报道 RMB 1.5 billion 的 Series B 及潜在香港 IPO，Preqin
              则记录了后续 Series B+，但没有在公开预览中披露累计资本。
            claimRefs:
              - CP007
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP012
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              初步的护城河逻辑由降本制造、多架构工程、已安装硬件和专有操作数据共同组成。公司发布材料声称月出货量达数千台、技能超过 500 项、高自由度机械手份额超过 80%；Gasgoo 另报一条年产能
              60,000-100,000 台的产线和超过 140 台 CNC 机床，但其底层运营指标似乎由 Linkerbot
              提供，并未经过审计。这些信号支持规模化假设，却不能证明市场份额。完整技术栈人形机器人厂商、资本充足的部件新进入者，以及更简单但能更可靠解决窄任务的夹具，都会带来实质替代风险。因此，投资判断应把已验证的任务成功率、使用寿命、毛利率、客户留存和独立测量的份额视为门槛证据，而不是从出货和示范声称外推持久护城河。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP016
