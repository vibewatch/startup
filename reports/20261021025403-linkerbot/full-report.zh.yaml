      - number: '4.2'
        title: 生产势头可见；单位经济性不可见
        blocks:
          - type: paragraph
            body: >-
              Reuters 报道月产量接近 5,000 只机械手，并计划很快达到 10,000 只。这是有商业意义的规模信号，但既不是收入，也不能证明产能利用率、售出率或盈利性产出。Linkerbot 自有 CES
              新闻稿声称两周交付周期，比竞争对手快六倍，但没有提供经审计的基线、订单积压、取消率或准时交付证据。制造版图也未完全勾稽：Reuters 报道五家工厂和超过 400
              名员工，而公司新闻稿称有四家自有工厂。综合这些披露，可以判断其有不小的实体成本基础，涉及工厂、库存、人工、质量控制、保修服务和可能的营运资金，但看不到毛利率、贡献利润率、资本开支、库存周转、保修准备金、CAC、回收期或现金转换。
            claimRefs:
              - CI009
