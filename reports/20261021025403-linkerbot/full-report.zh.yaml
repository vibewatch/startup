  - id: FM001
    title: 受证据约束的可触达市场分层
    type: pyramid
    summary: 该图将广义机器人活动收窄至 Linkerbot 可能实现变现的手部专用硬件和赋能层；不主张任何数值化 TAM。
    data:
      nodes:
        - label: 广义机器人与自动化
          value: Excluded denominator
          detail: 包括与灵巧手无关的支出。
        - label: 完整人形机器人平台
          value: Demand driver only
          detail: 不包括移动机构、机身、电池和全系统软件。
        - label: 现有机械臂部署
          value: Served adjacency
          detail: 在通用人形机器人成熟前，灵巧手也可以先行销售。
        - label: 高自由度灵巧手硬件
          value: Core market
          detail: 用于操作的连杆、直驱和腱驱产品。
        - label: 灵巧手集成与远程操控
          value: Coupled enablement
          detail: 部署和训练灵巧手所需的接口及数据采集。
        - label: 可复用操作技能
          value: Emerging software layer
          detail: 有望向硬件之外扩展，但变现方式仍未披露。
    approximationNotes: 各层是定性的市场边界，宽度不代表价值比例。由于保留来源无法提供有依据的 TAM、SAM 或 SOM，图中有意省略数值。
    claimRefs:
      - CM001
      - CM002
      - CM006
      - CM011
      - CM014
  - id: FP001
    title: 按集成广度和买方可触达性定位竞争格局
