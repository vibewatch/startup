              的研究经历。两人可能是同一人，但指定来源没有明确确认这一身份对应关系。KrASIA 还称 Cao Gang
              负责算法和模型训练，说明公司的技术领导力不止于创始人。留存来源没有提供董事会名单、投票权、继任计划、高管持股或领导层变动历史。因此，投资逻辑看得到创始人和技术领导力，但治理与关键人物尽调仍有明显缺口。
