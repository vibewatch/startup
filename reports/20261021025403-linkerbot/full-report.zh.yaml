              最强的反向证据来自 Linkerbot 在 FedEx Business Insights
              访谈中的自述。公司称，早期过度追求峰值性能，导致稳定性不一致、难以持续运行，以及客户部署比预期更困难；随后公司把重点转向持续运行、热稳定性、维护和实际任务完成指标。这是学习过程的相关证据，并不能证明问题已经解决。留存的八个来源都没有提供
              NRR、GRR、流失、续约、合同期限、客户群组、头部客户份额或渠道集中度，因此耐久性和依赖风险仍无法量化。
