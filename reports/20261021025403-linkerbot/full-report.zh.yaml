      points:
        - label: Linkerbot
          x: 3
          'y': 4
          detail: 带软件层、宣传起售价较低的部件平台
        - label: Shadow Hand
          x: 2
          'y': 1
          detail: 报道价格较高的科研级部件
        - label: Tesla Optimus
          x: 5
          'y': 1
          detail: 集成在自有整机人形机器人中的垂直整合灵巧手
        - label: Boston Dynamics Atlas
          x: 5
          'y': 1
          detail: 垂直整合设计，不作为独立灵巧手销售
        - label: 传统夹爪
          x: 2
          'y': 5
          detail: 面向受限操作任务的易获取替代方案
        - label: 内部自研
          x: 4
          'y': 2
          detail: 集成控制力强，但工程负担很重
    approximationNotes: 分析师依据保留证据给出的序数分数为 1（低）至 5（高）；这些分数不是实测性能、价格或市场份额。X 衡量集成广度，Y 衡量买方可触达性。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP011
      - CP013
      - CP016
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持直接销售硬件的路径，但实际成交价格和毛利仍未披露。
    data:
      nodes:
        - id: buyer
          label: 企业或机构
          detail: Preqin 将其列为直销的主要客户群体。
        - id: selection
          label: 选择灵巧手架构和型号
          detail: 产品线覆盖低价到高端型号。
        - id: price
          label: 公开起售价
          detail: 报道的起售价约为 US$1,500 至 US$14,000。
        - id: sale
          label: 直接销售产品
          detail: 已披露的收入机制是直接销售机器人产品。
        - id: deployment
          label: 安装到现有机械臂或科研系统
          detail: Reuters 报道称，客户通常使用现有机械臂。
        - id: delivery
          label: 制造并交付
          detail: Linkerbot 称交付周期为两周，但没有经审计的经营数据。
        - id: economics
          label: 已产生收入；毛利未知
          detail: 已确认收入、折扣、保修成本和毛利率均未公开。
    approximationNotes: 路径反映公开的商业模式描述，不估算转化率、已确认收入或利润率。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI008
      - CI012
  - id: FE001
    title: 灵巧操作产品栈
    type: stack
    summary: 公开证据描述了一条六层路径：从机器人部署，到末端执行器和感知，再到演示数据、可复用技能及学习软件。
    data:
      layers:
        - label: 部署载体
          detail: 人形机器人、现有机械臂、工业工作单元、科研设备和双臂工作站
          modules:
            - Linker Humanoid
            - P7 机械臂
            - Linker Craftsman
          outputs:
            - 客户任务环境
        - label: 灵巧末端执行器
          detail: 连杆、直驱和腱驱灵巧手系列在控制、柔顺性、重量和精度之间取舍
          modules:
            - O6
            - L20
            - L30
            - O20
            - O30
          outputs:
            - 手指运动
            - 抓取
            - 工具交互
        - label: 感知与驱动
          detail: 力矩传感、触觉阵列、摄像头、电子皮肤、减速器、电机和电缸
          modules:
            - 触觉阵列
            - Super Electric Cylinder
            - 视觉-触觉感知
          outputs:
            - 接触信号
            - 关节驱动
        - label: 人类示范采集
          detail: 手套和模块化远程操控将操作员动作与接触转化为机器人示范
          modules:
            - MCG
            - FFG
            - Open TeleDex
          outputs:
            - 多模态示范
        - label: 技能数据
          detail: LinkerSkillNet 被介绍为一个包含 500 多种真实世界操作技能的库
          modules:
            - LinkerSkillNet
            - LinkerSkillStore
          outputs:
            - 可复用技能记录
        - label: 学习与执行软件
          detail: Dex-Serl 和 Linker Genesis 被描述为训练和模型层，但公开部署细节有限
          modules:
            - Dex-Serl
            - Linker Genesis
          outputs:
            - 训练后的操作策略
    approximationNotes: 分层顺序是根据产品描述作出的分析性重构，不是已披露的部署图；接口、托管、延迟和控制边界仍未验证。
    claimRefs:
      - CE003
      - CE009
      - CE010
      - CE011
      - CE014
  - id: FU001
    title: 经证据限定的客户采用路径
    type: journey-map
    summary: 该图展示从评估到扩张的可能路径，以及每一步仍需补足的证据；它不是已主张的转化漏斗。
    data:
      nodes:
        - id: discover
          label: 发现并选择
          detail: 科研、工业和系统集成买方比较灵巧手设计与入门价格。
        - id: integrate
          label: 集成
          detail: 灵巧手接入现有机械臂、控制器和客户工作流。
        - id: qualify
          label: 任务验证
          detail: 买方测试任务完成度、稳定性、热表现和维护情况。
        - id: deploy
          label: 部署
          detail: Samsung、Siemens 或 Foxconn 等具名合作关系的生产部署状态未披露。
        - id: operate
          label: 持续运行
          detail: 公开渠道没有 NRR、GRR、流失、续约、正常运行时间和批次证据。
        - id: expand
          label: 扩展硬件与技能
          detail: 增加站点、灵巧手和可复用技能是合理可能，但尚未公开量化。
    approximationNotes: 该分析路径由已审阅的使用案例和公司可靠性表述推断而来，不是实测批次、转化漏斗或已披露的客户流程。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU016
  - id: FR001
    title: 按影响、发生可能性证据和缓释成熟度划分的风险热力图
    type: matrix
    summary: 六项对决策至关重要的风险影响仍然很高；发生可能性证据和缓释成熟度总体是不完整，而非已证明较低。
    data:
      columns:
        - 实现后的影响
        - 发生可能性证据
        - 缓释成熟度
      rows:
        - label: 持续运行可靠性
          values:
            - 高
            - 已承认历史局限；当前比率未知
            - 仍在发展，缺乏独立现场批次
        - label: 扩产质量控制
          values:
            - 高
            - 扩产规模有证据支持；缺陷概率未知
            - 已披露制造扩张；控制措施未验证
        - label: 产品安全 / 责任
          values:
            - 高
            - 事故频率未知
            - 已披露远程操控和传感器；认证仍存在缺口
        - label: 集成商垂直整合
          values:
            - 高
            - 已报道具体战略威胁；时间未知
            - 已披露产品广度和数据策略
        - label: 融资 / IPO 执行
          values:
            - 高
            - IPO 和估值计划已有报道但尚未完成
            - 顾问和此前融资轮次已有报道；缺乏经审计的现金跑道
        - label: 单位经济性 / 保修
          values:
            - 高
            - 有公开价格；缺乏成本和故障基数
            - 没有公开证据
    approximationNotes: 仅为定性矩阵。指定资料池缺乏实测基数的地方保留“未知”，不将其转换为低发生可能性分数。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR008
      - CR009
      - CR010
      - CR011
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 在把报道中的业务进展转化为经验证的经济性、价格支撑和退出准备度之前，决策仍是继续研究。
    data:
      nodes:
        - id: reported-traction
          label: 报道中的业务进展
          detail: 公司关于出货量、市场份额、产量和具名客户的主张。
        - id: independent-validation
          label: 独立验证
          detail: 核对客户、台数、退货和回款。
        - id: audited-economics
          label: 经审计经济性
          detail: 确认收入、利润率、现金使用和支持负担。
        - id: capitalization
          label: 资本化条款
          detail: 梳理所有权、摊薄、债务和优先权。
        - id: price-support
          label: 价格支撑
          detail: 将约 US$3B 的报道估值与拟议 US$6B 目标区分开。
        - id: exit-readiness
          label: 退出准备度
          detail: 核验顾问流程、时间表和上市依赖条件。
        - id: recommendation
          label: 继续研究
          detail: 只有证据关口关闭后才推进。
    approximationNotes: 这是决策路径，不是量化概率或估值模型。
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV013
      - CV015
