              - CM014
      - number: '2.2'
        title: 商业代理指标有用，但不是 TAM
        blocks:
          - type: paragraph
            body: >-
              现有证据提供的是出货、订单、产能、定价和声称的份额信号，而不是可辩护的市场规模序列。Linkerbot 的 CES 新闻稿声称其占全球高自由度机械手市场超过 80%，月产量达数千台。China Biz
              Insider 另报月订单量超过 1,000 台、月产能超过 4,000 台，以及激进的 2026
              年交付目标；但这些数字都追溯到公司表述，也没有披露品类分母。公开价格从补贴式入门型号到面向科研的产品不等，说明市场存在分层，也说明不能用一个目录价乘一个统一的出货量。除非取得独立出货数据、实际平均售价和稳定的“高自由度”定义，否则给出数值
              TAM、SAM 或 SOM 只会制造虚假的精确度。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: 买方、使用方和付款方因部署而异
        blocks:
          - type: paragraph
            body: >-
              研究实验室购买可控硬件和数据采集工具；人形机器人 OEM 购买必须适配自身机械臂、控制栈和目标任务的子系统；工业用户最终为完成的工作付费，而不是为自由度付费。报道显示 Linkerbot
              的客户覆盖科学研究、人形机器人和工业领域，公司材料还点名 Samsung、Siemens 和
              Foxconn。这些信息说明客户覆盖面广，但不能证明采购深度、复购或客户经济性。在通用人形机器人尚未成熟前，客户可以先把产品部署到现有机械臂上，短期买方范围因此更大。不过预算归属仍须逐个部署核实：机器人研发部门可能为试点买单，而运营或自动化团队必须依据集成工作量、任务成功率、使用寿命和更换成本，为规模化使用提供理由。
            claimRefs:
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM011
              - CM012
      - number: '2.4'
        title: 入门价格下降有利于试用；可靠性决定规模化
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动来自更便宜的机械手、适配不同负载和控制需求的多种架构，以及能把示范转化为可复用操作技能的软件。Linkerbot 称 LinkerSkillNet 收录超过 500
              项真实世界技能，其产品线也让买方可以在低成本入门硬件和高自由度科研系统之间选择。真正的约束反而不够透明：与第三方机械臂集成、在变化条件下稳定完成任务、维护、更换成本、安全性，以及示范能否经受生产负载。大型科技公司也可能凭规模压低硬件毛利。融资和潜在
              IPO 可以为扩产提供资金，但资金可得性不能独立证明终端市场规模。因此，估值工作应把已验证的部署和单位经济性放在声称的品类份额之上。
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 眼前市场不必等到人形机器人成熟
            body: 把机械手卖给现有机械臂，可以形成更近的采用路径；但相关分母应是兼容的操作部署，而不是全部人形机器人或机器人支出。
            calloutType: insight
            claimRefs:
              - CM006
              - CM014
          - type: callout
            title: 份额声称缺少独立分母
            body: 报道中的 80%+ 份额，在尽调明确高自由度资格、核实竞争对手与内部自制量，并勾稽订单、出货和收入之前，不能用来锚定估值。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 所处的是分层市场，而不是一组边界清晰的同类公司。Shadow Robot 是传统高关节数标杆：Pandaily 报道其有 24 个独立控制关节，价格约为
              $140,000-$280,000。Tesla、Boston Dynamics、Figure AI、1X 和 Apptronik
              构成另一类威胁，因为它们可以把机械手开发内置于完整的人形机器人平台。复杂度较低的一端，拥有一至六个自由度的传统商用夹具仍足以完成受限的抓取和放置工作。买方也可以继续使用现有自动化设备，或自行开发末端执行器。因此，Linkerbot
              的部件供应商模式把可服务客户扩展到单一机器人本体之外，但分销和集成能力仍掌握在机器人 OEM 与自动化集成商手中。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
