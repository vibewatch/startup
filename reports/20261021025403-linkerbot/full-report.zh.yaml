      - number: '5.3'
        title: 部署、集成与使用场景
        blocks:
          - type: paragraph
            body: >-
              产品可以从多个环节进入客户工作流。研究团队可以用机械手和手套采集数据；机器人厂商可以把机械手接入现有机械臂；制造商可以评估 L20
              级连杆设计用于工具操作和变化物体处理；示范工作站则可以把两条机械臂与灵巧机械手组合起来。RobotToday 点名了与产品相关的大学和工业公司，Tech in Asia
              则称管理层正瞄准现有机械臂的近期需求，而不是等待成熟的人形机器人车队。             
              这些信号说明存在合理的部署入口，但尚未证明生产经济性。公开来源没有提供安装时间、支持的控制器、环境等级、备件政策、现场服务覆盖、任务成功率或客户自有的前后对比结果。
            claimRefs:
