      - number: '5.4'
        title: 成熟度、差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Linkerbot
              最明显的差异化在于广度：多种驱动架构、轻量和高自由度版本、集成感知，以及数据与技能层。公司材料还声称拥有四家工厂、微米级公差控制、两周交付周期和千台级月产量。这些表述说明公司有工业化野心，但仍是供应商声称，而非独立工艺审计。留存证据没有公开
              MTBF、工作循环失效曲线、侵入防护或温度认证、可维护性数据、网络安全架构、远程操作数据隐私控制、功能安全认证、召回历史或第三方对比基准。因此，投资判断应把规模、耐久性、安全性和数据防御力视为可检验的尽调假设，而不是已经验证的护城河。
            claimRefs:
              - CE004
