  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与公开定价
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开证据显示这是一项以硬件为主的业务：Preqin 称 Linkerbot
              主要通过向企业和机构直接销售机器人产品获得收入；独立报道则称客户把其机械手装在现有机械臂上，而不是购买完整人形机器人。这扩大了全人形机器人制造商之外的近期买方范围，但合同结构、验收条款、保修义务和收入确认仍未披露。一篇独立产品评测称，O6
              起售价约 $1,500，L30 约 $14,000，中间还有 L 系列档位。这些是公开起售价，不是实际平均售价、折扣、收入结构或毛利率的证据。LinkerSkillNet
              可能强化硬件价值，但留存来源没有证明存在独立的软件订阅、许可或按使用收费收入流。
