      - number: '4.3'
        title: 融资信号不能证明资本充足
        blocks:
          - type: paragraph
            body: >-
              公开融资报道说明公司能获得资本，但不能把融资额当作手头现金。一篇独立评测称公司自 2025 年 4 月以来募资 $150 million；Tech in Asia 则报道 2026 年 2 月完成 CNY1.5
              billion 的 Series B，约合 $220 million。这些披露尚未勾稽，且可能存在重叠。Reuters 随后报道 Series B+ 给予 Linkerbot $3 billion
              估值，管理层目标是后续融资达到 $6 billion；独立报道正确区分了目标和已完成交易。Tech in Asia 与 The Robotics Media 还报道潜在香港 IPO
              或可募资数亿美元，但两者都将其描述为未来事项。这些数字都没有披露当前流动性、月度烧钱、已承诺资本开支、债务、项目融资、受限现金或触发下一轮融资的里程碑。
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 财务结论与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个合理的直接硬件销售模式、异常高的声称产量，以及持续获得融资的能力，但不足以得出收入质量或偿付能力结论。起售价可能说明单台收入有吸引力，但没有实际成交价分布、已付款出货量、客户集中度、退货数据、服务负担或利润桥接。同样，工厂扩张可能在规模化后带来经营杠杆，也可能因设备、库存和支持服务消耗现金；现有证据无法在两种结果之间作出判断。因此，投资判断必须以银行流水和月度财务包为前提，逐项勾稽订单、已验收出货、确认收入、物料清单、人工、保修、毛利率、营运资金、资本开支、现金、债务和烧钱。下一轮融资或
              IPO 在资金到账和交割条件形成文件前，都应建模为依赖项，而不是可用资本。
