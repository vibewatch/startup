  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 这是部件市场，不是完整的人形机器人经济
        blocks:
          - type: paragraph
            body: >-
              可投资边界是高自由度机械手，以及部署这些机械手所需的配套控制、远程操作和技能软件。Linkerbot
              自有目录覆盖连杆驱动、直接驱动和腱驱动机械手，它们的自由度、重量、负载和接口差异明显；产品还延伸到机械臂、人形机器人平台、动作捕捉和力反馈。范围过宽会让“机器人”这一分母失真。核心市场应包括机械手硬件和专用集成，但应排除完整人形机器人、通用机械臂、无关的工厂自动化和模型算力支出。传统夹具、内部开发末端执行器，以及等待更成熟的人形机器人技术栈，仍是有经济意义的替代方案，而不是灵巧机械手的可服务收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
