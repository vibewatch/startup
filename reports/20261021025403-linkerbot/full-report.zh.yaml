    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 是一家 2023
              年成立于北京的机器人公司，专注于灵巧机械手、配套控制软件和操作技能基础设施。聚焦部件的策略让它可以进入科研、人形机器人和工业工作流，而不必押注完整通用人形机器人的推出时间。Preqin
              将向企业和机构直接销售机器人产品描述为其主要收入模式，独立报道则称其产品覆盖机械手硬件和技能软件。综合来看，这是一项以硬件为主、可能叠加数据和软件层的业务；但指定证据中没有来源披露收入结构、经常性软件经济性、毛利率或客户集中度。
            claimRefs:
              - CO001
              - CO002
              - CO015
