        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              最大的剩余风险是规模化运营可靠性。在 2026 年 7 月的一次访谈中，Linkerbot
              联合创始人承认早期系统稳定性不一致、难以持续运行，且客户部署比预期更困难；管理层称此后已把注意力转向持续运行、热稳定性、维护和实际任务完成。这一应对方向正确，但指定证据没有独立测量的现场故障、正常运行时间、保修或退货率序列。第二项高风险是规模化执行：公司声称
              2025 年 12 月累计出货达到 10,000 只，但报道中的 2026 年目标是交付 50,000-100,000
              只。风险不在于目标必然无法实现，而在于质量控制、服务能力和营运资金是否能达到与规模目标相同的公开证据水平。
