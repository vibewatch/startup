            title: 架构广度降低单一设计风险
            body: 据报道，Linkerbot 提供连杆驱动、直接驱动和腱驱动机械手，买方可以围绕刚度、速度、紧凑性和可维护性选型，而不必让所有工作负载都采用同一种机制。
            calloutType: strength
            claimRefs:
              - CP002
          - type: callout
            title: 示范不是部署基准
