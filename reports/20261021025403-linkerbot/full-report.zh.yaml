  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 出货量、付费部署、利润率和留存均经独立验证；融资或 IPO 募资条款可接受。
        - 只有经审计的增长和单位经济性建立起可衡量的盈利或收入基础后，溢价才可能获得支撑。
        - 市场份额定义、执行规模和优先权压制。
        - 待经审计财务和客户证据到位后再分配。
      - - 基准
        - 报道中的业务进展大体真实，但财务和资本结构披露仍有限。
        - 将约 US$3B 的报道估值视为交易背景，而非独立评估的公允价值。
        - 信息不透明持续，退出时间延后。
        - 当前工作情景；不是数值概率。
      - - 悲观
        - 出货量或客户主张无法核对，可靠性成本侵蚀经济性，或下一轮融资延期、降价。
        - 由于拟议 US$6B 目标缺乏公开经营数据支撑，预计会出现显著下行或摊薄。
        - 下轮融资、IPO 延期、回款疲弱和保修负担。
        - 文件或客户核查失败时触发。
      - - 决策关口
        - 交付股权表、经审计报表、批次经济性、客户证明和顾问时间表。
        - 只有明确基数和证券条款后，才能建立适合模型的估值区间。
        - 未核对公开指标造成虚假精确。
        - 关口关闭前不分配概率。
    notes: 未展示数值化估值区间或概率，因为保留的公开来源没有披露经审计经营指标、证券条款或完整资本化表。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV013
      - CV015
