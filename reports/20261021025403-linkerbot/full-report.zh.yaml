  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户任务
        blocks:
          - type: paragraph
            body: >-
              Linkerbot
              的核心产品是一系列作为人形机器人和工业机器人末端执行器使用的灵巧机械手，而不是一款标准化机械手。产品采用连杆驱动、直接驱动和腱驱动机制，让买方在主动控制、被动柔顺性、重量、负载、精度和成本之间取舍。公开产品列表还描述了更广的生态，包括协作机械臂、人形机器人平台、动作捕捉和力反馈手套、技能库以及模型软件。这能形成一条可信的客户工作流：从选择机械手，到采集示范，再到教授操作技能。不过，第三方列表中的型号和规格并不一致，采购应以最新数据表、针对具体配置的验收测试和物料清单为准，而不是依赖产品家族层面的营销描述。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
