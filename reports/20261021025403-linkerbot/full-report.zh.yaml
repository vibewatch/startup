          - type: paragraph
            body: >-
              Linkerbot 依赖机器人集成商继续购买专用机械手，而不是把它垂直整合到内部。BestStartup.Asia 将平台公司内部开发机械手和整机野心（包括
              Tesla）视为直接战略威胁；同时也指出，部件供应商的上限取决于人形机器人是否仍是小众市场。因此，公司声称的 80% 份额只能说明这一年轻品类的集中度，不能自动证明其持久性。融资证据也需要重新勾稽：2025 年
              12 月的一则新闻稿称自 2025 年 4 月以来募资 $150 million，Tech in Asia 后来报道 2026 年 2 月的 Series B 为 $220 million，其他报道则称在 $3
              billion 的 Series B+ 之后拟议估值为 $6 billion。否决标准应包括经审计融资数据始终无法厘清、现场故障显著上升、生产验收失败，或大型集成商明确转向内部开发。
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 论点破坏条件
            body: 若尽调无法勾稽经审计的融资和现金，若规模化生产群组持续出现可靠性或保修恶化，若缺少必要的安全或出口审批，或若大型集成商明显把机械手设计转回内部且客户多元化无法抵消，应暂停或拒绝投资。
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR011
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是买入。独立报道将已完成的 Series B+ 融资估值放在约 US$3 billion，同时把 US$6 billion 的下一轮或 IPO 目标描述为未来事项；Tech in Asia
              还称公司已为潜在香港发行聘请顾问，但计划仍可能改变。这些是有用的流动性信号，却不能证明一个可辩护的入场价格。经审阅证据缺少经审计收入、利润率、现金、烧钱、持股、清算优先权和稀释数据。因此，入场纪律应以里程碑为基础：在为目标回报做投资判断前，要求
              股权结构表、融资文件、经审计财务报表、客户层面的出货与付款证据，以及从经营表现到拟议估值的勾稽桥接。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: 正论与反论
        blocks:
          - type: paragraph
            body: >-
              正论是，专注于机械手的供应商可以在人形机器人普及前实现变现。公司新闻稿声称累计出货 10,000 只机械手、高自由度细分市场份额超过 80%、月产量超过 1,000 台，并拥有 Samsung、Siemens 和
              Foxconn 等客户。Preqin 描述其向企业和机构直接销售产品；一篇独立评测则引用 O6 的 6,666 元价格。反论是，这些商业信号大多是公司声称或二手摘要，而非经审计证据。RobotsBeat
              特别提醒，规格数量不能证明任务可靠性或维护负担，募资目标也不是已完成的估值事件。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以给出数值估值区间，因此这些情景使用可观察的投资判断门槛，而不是捏造倍数。乐观情景要求独立确认出货量、复购客户和可用毛利率，并要求融资或上市接近报道目标且没有惩罚性优先权。基准情景认为商业
              traction 可能存在但尚未验证，并把最近报道的 US$3 billion 估值当作背景，而非公允价值。若出货勾稽失败、付费部署疲弱、可靠性支持成本高、出现 down round 或 IPO
              延迟，则触发悲观情景。由于证据集缺少校准概率所需的运营和资本化输入，任何情景都不赋予数值概率。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              聘请 China Merchants Bank International、Citic Securities 和 HSBC
              准备潜在香港发行，说明的是准备工作，而不是准备就绪或交易完成。由融资推动的退出可能改善价格发现，但当前报道称谈判仍在继续，计划可能变化。最终尽调应取得最新资本化表、全部优先权和债务条款、经审计财务报表、月度
              bookings-to-cash
              勾稽、客户集中度与退货数据、保修及现场故障群组，以及顾问提供的上市准备时间表。论点破坏触发条件包括估值上调但没有对应的经审计经济数据、订单与现金回款出现重大背离，或无法验证支撑增长叙事的出货和客户声称。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 没有可辩护的公开公允价值区间
            body: 留存证据支持估值背景和尽调门槛，但不支持数值公允价值区间。在取得经审计的经济数据和证券条款前，应把报道中的估值视为融资信号。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV015
          - type: callout
            title: 目标估值不是交易证据
            body: 报道中的 US$6 billion 是未来目标。若按已完成价值进行投资判断，就会抹去目标与已执行融资之间的区别。
            calloutType: risk
            claimRefs:
              - CV005
