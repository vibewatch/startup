      - number: '5.2'
        title: 从驱动到学习技能的架构
        blocks:
          - type: paragraph
            body: >-
              现有架构分层明显。在物理层，各产品家族采用不同传动机制，并结合主动和被动关节。感知能力声称包括力矩测量、触觉阵列、摄像头和电子皮肤。Linkerbot
              还描述了集成式电缸驱动，以及对制造投入进行纵向控制。在硬件之上，Open TeleDex 被定位为模块化远程操作系统，LinkerSkillNet 提供技能库，Dex-Serl
              支持真实机器强化学习。这个方向在战略上连贯，因为机械手既能执行已学行为，也能生成数据。但它还不是已验证的闭环架构：留存证据没有披露 API、时序预算、模型评估、部署拓扑、更新控制或互操作性测试结果。
