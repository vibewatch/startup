    title: 正向论点与反向论点
    columns:
      - 立场
      - 论点
      - 当前证据
      - 哪些证据会改变判断
    rows:
      - - 正向论点
        - 报道中的产品规模
        - 公司公告称累计出货量达 10,000。
        - 客户发票、序列号级出货记录、退货记录和现金回款。
      - - 正向论点
        - 品类地位
        - 公司公告称其占据高自由度细分市场 80% 以上，月产量超过 1,000 台。
        - 独立的市场定义、竞争对手基数和渠道核查。
      - - 正向论点
        - 商业路径
        - Preqin 描述了面向企业和机构的直销；具名客户包括 Samsung、Siemens 和 Foxconn。
        - 能证明付费生产使用、留存和客户集中度的客户背书。
      - - 反向论点
        - 估值跑在证据前面
        - US$6B 被报道为目标，而不是已完成的交易。
        - 与经审计经营数据挂钩的已签署融资或上市文件。
      - - 反向论点
        - 可靠性经济性未知
        - 规格和演示无法证明任务成功率、使用寿命或维护成本。
        - 独立工作负载测试、保修批次数据和毛利桥接表。
    notes: 出货量、份额、产量和客户指标均为公司口径；改变判断所需的证据是尽调要求，不是有来源的预测。
