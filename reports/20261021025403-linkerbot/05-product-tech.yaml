company:
  name: Linkerbot
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Linkerbot sells a broad dexterous-manipulation stack: multiple hand families
    spanning linkage, direct-drive, and tendon mechanisms, plus arms, teleoperation
    tools, tactile sensing, skills data, and learning software. Public evidence is
    rich in specifications and company demonstrations but does not establish
    field reliability, security, safety certification, serviceability, or
    independently benchmarked task success.
sections:
  - id: product-portfolio
    title: Product portfolio and customer job
    body: >-
      Linkerbot's core product is a family of dexterous robotic hands used as
      end-effectors on humanoid and industrial robots, rather than a single
      standardized hand. The range uses linkage, direct-drive, and tendon-driven
      mechanisms, allowing buyers to trade active control, passive compliance,
      weight, payload, precision, and cost. Public listings describe a wider
      ecosystem that includes a collaborative arm, a humanoid platform,
      motion-capture and force-feedback gloves, a skills library, and model
      software. This creates a credible customer workflow from selecting a hand
      through collecting demonstrations and teaching manipulation skills.
      However, model names and specifications vary across third-party listings,
      so procurement should be tied to current datasheets, configuration-specific
      acceptance tests, and a bill of materials rather than family-level
      marketing.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE001]
  - id: architecture-and-control
    title: Architecture from actuation to learned skills
    body: >-
      The available architecture is layered. At the physical layer, product
      families use different transmission mechanisms and combine active and
      passive joints. Sensing claims include force-torque measurement, tactile
      arrays, cameras, and electronic skin. Linkerbot also describes an
      integrated electric-cylinder drive and vertically controlled manufacturing
      inputs. Above the hardware, Open TeleDex is presented as a modular
      teleoperation system, while LinkerSkillNet supplies a skills library and
      Dex-Serl supports real-machine reinforcement learning. This is strategically
      coherent because the hand can generate data as well as execute learned
      behavior. It is not yet a verified closed-loop architecture: the retained
      evidence does not disclose APIs, timing budgets, model evaluation,
      deployment topology, update controls, or interoperability test results.
    claimRefs: [CE002, CE007, CE009, CE010, CE011, CE012, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: workflow-and-deployment
    title: Deployment, integration, and use cases
    body: >-
      The product can enter customer workflows at several points. Research teams
      can use a hand and gloves for data collection; robot makers can integrate
      a hand with an existing arm; manufacturers can evaluate the L20-class
      linkage design for tool use and variable-object handling; and demonstration
      workstations can combine two arms with dexterous hands. RobotToday names
      universities and industrial companies associated with the products, while
      Tech in Asia reports that management is targeting nearer-term demand from
      existing robotic arms rather than waiting for mature humanoid fleets.
      These signals show plausible deployment surfaces, not proven production
      economics. Public sources do not provide installation time, supported
      controllers, environmental ratings, spare-parts policy, field-service
      coverage, task success rates, or customer-owned before-and-after outcomes.
    claimRefs: [CE001, CE003, CE007, CE009, CE010, CE013, CE014]
    tableRefs: [TE002]
  - id: maturity-differentiation-and-risk
    title: Maturity, differentiation, and technical risk
    body: >-
      Linkerbot's strongest visible differentiation is breadth: several actuation
      architectures, lightweight and high-DoF variants, integrated sensing, and a
      data-and-skills layer. Company-issued material further claims four factories,
      micrometer-level tolerance control, a two-week delivery cycle, and
      thousand-unit monthly production. Those assertions indicate an industrial
      ambition but remain supplier claims rather than independent process audits.
      The retained evidence contains no published MTBF, duty-cycle failure curves,
      ingress or temperature qualification, maintainability data, cybersecurity
      architecture, privacy controls for teleoperation data, functional-safety
      certification, recall history, or third-party comparative benchmark.
      Consequently, the investment case should treat scale, durability, safety,
      and data defensibility as testable diligence hypotheses rather than verified
      moats.
    claimRefs: [CE004, CE006, CE008, CE009, CE012, CE013, CE015, CE016]
