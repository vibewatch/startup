    - type: private-evidence-only
      severity: material
      topic: trust-and-safety
      missingEvidence: >-
        Security architecture, vulnerability handling, access control, software
        update policy, teleoperation-data governance, privacy controls,
        functional-safety analysis, and applicable certifications.
      whyItMatters: >-
