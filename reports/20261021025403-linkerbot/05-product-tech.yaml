      - ["Manufacturing and service layer", "Build, test, deliver, and maintain hands at volume", "Factories, proprietary parts, quality systems, spares, and field support", "Production scale and two-week delivery are unverified; service metrics are undisclosed"]
    notes: >-
      This table reconstructs the operating stack from retained public sources;
