    claimRefs: [CE002, CE007, CE010, CE011, CE012, CE013, CE015, CE016]
figures:
  - id: FE001
    title: Dexterous-manipulation product stack
    type: stack
    summary: >-
      Public evidence describes a six-layer path from robot deployment through
      end-effectors and sensing to demonstration data, reusable skills, and
      learning software.
    data:
      layers:
        - label: Deployment surface
          detail: Humanoid robots, existing robotic arms, industrial cells, research rigs, and dual-arm workstations
          modules: [Linker Humanoid, P7 arm, Linker Craftsman]
          outputs: [Customer task environment]
        - label: Dexterous end-effectors
          detail: Linkage, direct-drive, and tendon-driven hand families trade control, compliance, weight, and precision
          modules: [O6, L20, L30, O20, O30]
          outputs: [Finger motion, grasp, tool interaction]
        - label: Perception and actuation
          detail: Force-torque sensing, tactile arrays, cameras, electronic skin, reducers, motors, and electric cylinders
          modules: [Tactile array, Super Electric Cylinder, vision-tactile sensing]
          outputs: [Contact signals, joint actuation]
        - label: Human demonstration capture
          detail: Gloves and modular teleoperation translate operator motion and contact into robot demonstrations
          modules: [MCG, FFG, Open TeleDex]
          outputs: [Multimodal demonstrations]
        - label: Skills data
          detail: LinkerSkillNet is presented as a library of more than 500 real-world manipulation skills
          modules: [LinkerSkillNet, LinkerSkillStore]
          outputs: [Reusable skill records]
        - label: Learning and execution software
          detail: Dex-Serl and Linker Genesis are described as training and model layers, but public deployment details are limited
          modules: [Dex-Serl, Linker Genesis]
          outputs: [Trained manipulation policy]
    approximationNotes: >-
      The layer ordering is an analytical reconstruction from product descriptions,
      not a disclosed deployment diagram; interfaces, hosting, latency, and control
      boundaries remain unverified.
    claimRefs: [CE003, CE009, CE010, CE011, CE014]
