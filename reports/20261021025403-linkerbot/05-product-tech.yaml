        Request private SDK and API documentation, release notes, supported
        controller matrices, reference integrations, and access to integrator
        engineers; then validate a representative integration.
      relatedQuestionRefs: [QE009]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Configuration-specific MTBF, duty-cycle failure curves, environmental
        tests, field-return rates, maintenance intervals, spare-parts lead times,
        and customer-owned production results.
      whyItMatters: >-
        Point specifications and demonstrations do not establish production
        uptime, lifecycle cost, or safe operation under variable loads.
      diligencePath: >-
        Review qualification reports and anonymized field-return logs, inspect
        factories and service operations, and run an instrumented endurance test
        on the proposed SKU.
