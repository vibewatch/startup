schemaVersion: "report-v2"
artifact: valuation
slug: linkerbot
runDate: 2026-10-21
company:
  name: Linkerbot
chapter:
  number: 8
  title: Valuation
  summary: >-
    Linkerbot has credible indicators of financing access, product shipments, and IPO preparation,
    but the retained public evidence does not disclose audited revenue, margins, cash, ownership,
    preferences, or a completed transaction at the reported US$6 billion target. The appropriate
    stance is research-more with medium confidence, high risk, and a stretched valuation view until
    commercial claims and financing terms are independently reconciled.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is research-more, not buy. Independent reporting places a completed Series
      B+ financing at roughly US$3 billion while describing a US$6 billion next-round or IPO ambition
      as prospective; Tech in Asia also says advisers were hired for a possible Hong Kong offering
      whose plans could still change. Those are useful liquidity signals, but they do not establish a
      defendable entry price. The reviewed evidence lacks audited revenue, margin, cash, burn,
      ownership, liquidation-preference, and dilution data. Entry discipline should therefore be
      milestone-based: require a cap table, financing documents, audited financials, customer-level
      shipment and payment evidence, and a reconciled bridge from operating performance to the
      proposed valuation before underwriting a target return.
    claimRefs: [CV001, CV004, CV005, CV006, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that a focused hand supplier can monetize before general-purpose humanoids mature.
      Company-issued releases claim 10,000 cumulative hand shipments, more than 80% share of the
      high-degree-of-freedom segment, production above 1,000 units per month, and customers including
      Samsung, Siemens, and Foxconn. Preqin describes direct product sales to enterprises and
      institutions, while an independent review cites a 6,666 yuan O6 price point. The anti-thesis is
      that these commercial signals are mostly company assertions or secondary summaries rather than
      audited evidence. RobotsBeat specifically cautions that specification counts do not establish
      task reliability or maintenance burden, and that a fundraising ambition is not a completed
      valuation event.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Bull, base, and bear framework
    body: >-
      Public evidence is insufficient for a numerical valuation range, so the scenarios use
      observable underwriting gates rather than fabricated multiples. A bull case requires
      independent confirmation of shipment volumes, repeat customers, usable gross margins, and a
      financing or listing near the reported target without punitive preferences. The base case keeps
      commercial traction as plausible but unverified and treats the last reported US$3 billion mark
      as context, not fair value. The bear case is triggered by failed shipment reconciliation, weak
      paid deployment, costly reliability support, a down round, or an IPO delay. No scenario receives
      a numerical probability because the evidence set lacks the operating and capitalization inputs
      needed to calibrate one.
    claimRefs: [CV004, CV005, CV006, CV007, CV010, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Hiring China Merchants Bank International, Citic Securities, and HSBC for a possible Hong Kong
      offering indicates preparation, not readiness or completion. A financing-led exit could improve
      price discovery, but current reporting says talks remain ongoing and plans may change. Final
      diligence should obtain the latest capitalization table, all preference and debt terms, audited
      financial statements, monthly bookings-to-cash reconciliation, customer concentration and
      returns data, warranty and field-failure cohorts, and written adviser timelines for listing
      readiness. Thesis-break triggers are a valuation step-up without corresponding audited
      economics, material divergence between orders and cash collections, or inability to validate
      the shipment and customer claims that anchor the growth narrative.
    claimRefs: [CV001, CV005, CV006, CV007, CV010, CV013, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision element
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, Research more, "Financing and traction signals exist, but core underwriting inputs are absent.", "Do not underwrite an entry until the named diligence gates close."]
      - [Confidence, Medium, "Multiple reports describe financing and IPO activity, but several operating metrics are company-issued.", "Treat the conclusion as directional rather than a complete valuation opinion."]
      - [Risk rating, High, "Commercial proof, reliability economics, cap-table terms, and audited financials remain unverified.", "Require downside protection and documentary verification."]
      - [Valuation stance, Stretched, "A roughly US$3B reported mark is followed by a prospective US$6B target without public audited economics.", "Reject valuation step-ups justified only by market-share or shipment assertions."]
      - [Entry discipline, Milestone-gated, "Public evidence cannot support a fair-value range or target return.", "Price only after financial, customer, capitalization, and exit-readiness diligence."]
    notes: "Assessments are analytical judgments from the retained public evidence; they are not transaction advice or a numerical fair-value estimate."
    claimRefs: [CV001, CV004, CV005, CV006, CV014, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - [Thesis, "Reported product scale", "Company release claims 10,000 cumulative shipments.", "Customer invoices, serial-level shipment records, returns, and cash receipts."]
      - [Thesis, "Category position", "Company releases claim more than 80% of the high-DoF segment and production above 1,000 units monthly.", "Independent market definition, competitor denominator, and channel checks."]
      - [Thesis, "Commercial route", "Preqin describes direct enterprise and institutional sales; named customers include Samsung, Siemens, and Foxconn.", "Customer references showing paid production use, retention, and concentration."]
      - [Anti-thesis, "Valuation outruns proof", "US$6B is reported as a target rather than a completed transaction.", "Executed financing or listing documents tied to audited economics."]
      - [Anti-thesis, "Reliability economics unknown", "Specifications and demonstrations do not establish task success, service life, or maintenance cost.", "Independent workload tests, warranty cohorts, and gross-margin bridge."]
    notes: "Shipment, share, production, and customer metrics are company-issued claims; the change-of-view evidence is a diligence requirement, not a sourced forecast."
    claimRefs: [CV005, CV007, CV008, CV009, CV010, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Shipments, paid deployments, margins, and retention are independently verified; financing or IPO proceeds on acceptable terms.", "A premium may become supportable only after audited growth and unit economics establish a measurable earnings or revenue base.", "Market-share definition, execution scale, and preference overhang.", "Unassigned pending audited financial and customer evidence."]
      - [Base, "Reported traction is directionally real, but financial and capitalization disclosure remains limited.", "Treat the roughly US$3B reported mark as transaction context, not independently underwritten fair value.", "Opacity persists and exit timing slips.", "Current working case; not a numerical probability."]
      - [Bear, "Shipment or customer assertions fail reconciliation, reliability costs impair economics, or the next financing is delayed or repriced.", "Expect material downside or dilution because the prospective US$6B target lacks public operating support.", "Down round, IPO delay, weak collections, and warranty burden.", "Triggered by failed documentary or customer checks."]
      - [Decision gate, "Cap table, audited statements, cohort economics, customer proof, and adviser timetable are delivered.", "Build a model-appropriate valuation range only after the denominator and security terms are known.", "False precision from unreconciled public metrics.", "No probability assigned before the gate closes."]
    notes: "No numerical valuation ranges or probabilities are shown because the retained public sources do not disclose audited operating metrics, security terms, or a complete capitalization table."
    claimRefs: [CV004, CV005, CV006, CV007, CV010, CV013, CV015]
figures:
