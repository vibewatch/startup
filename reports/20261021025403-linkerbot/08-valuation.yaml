          detail: "Reconcile customers, units, returns, and collections."
        - id: audited-economics
          label: Audited economics
          detail: "Establish revenue, margin, cash use, and support burden."
        - id: capitalization
          label: Capitalization terms
          detail: "Map ownership, dilution, debt, and preferences."
        - id: price-support
          label: Price support
          detail: "Separate the roughly US$3B reported mark from the prospective US$6B target."
        - id: exit-readiness
          label: Exit readiness
          detail: "Verify adviser process, timetable, and listing dependencies."
        - id: recommendation
          label: Research more
          detail: "Advance only after the evidence gates close."
    approximationNotes: "This is a decision sequence, not a quantitative probability or valuation model."
    claimRefs: [CV006, CV007, CV010, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: No defensible public fair-value range
    body: >-
      The retained evidence supports valuation context and diligence gates, but not a numerical
      fair-value range. Treat the reported marks as financing signals until audited economics and
      security terms are available.
    claimRefs: [CV004, CV005, CV006, CV015]
  - calloutType: risk
    title: Target valuation is not transaction evidence
    body: >-
      The reported US$6 billion figure is a prospective target. Underwriting it as completed value
      would erase the distinction between an ambition and an executed financing.
    claimRefs: [CV005]
