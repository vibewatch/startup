  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: A component market, not the whole humanoid economy
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is high-degree-of-freedom robotic hands and the closely coupled controls,
              teleoperation, and skills software needed to deploy them. Linkerbot's own catalog spans linkage,
              direct-drive, and tendon-driven hands with materially different degrees of freedom, weights, loads, and
              interfaces, then extends into arms, a humanoid platform, motion capture, and force feedback. That breadth
              makes a broad "robotics" denominator misleading. The core market should include hand hardware and
              hand-specific integration; it should exclude complete humanoid bodies, general-purpose robot arms,
              unrelated factory automation, and model-compute spend. Conventional grippers, internal end-effector
              development, and waiting for a more mature humanoid stack remain economically relevant substitutes rather
              than addressable dexterous-hand revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM011
              - CM014
      - number: '2.2'
        title: Commercial proxies are useful, but they are not TAM
        blocks:
          - type: paragraph
            body: >-
              Available evidence offers shipment, order, capacity, pricing, and claimed-share signals rather than a
              defensible market-size series. Linkerbot's CES release claims more than 80% of the global high-DOF hand
              market and thousands of units of monthly production. China Biz Insider separately reported monthly orders
              above 1,000 units, monthly capacity above 4,000, and an aggressive 2026 delivery target, but those figures
              trace back to company statements and do not disclose the category denominator. Published prices span
              subsidized entry models through research-oriented products, demonstrating segmentation while also showing
              why one unit count cannot be multiplied by one list price. A numeric TAM, SAM, or SOM would therefore
              create false precision until independent shipment data, realized average selling prices, and a stable
              definition of "high-DOF" are obtained.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer, user, and payer vary by deployment
        blocks:
          - type: paragraph
            body: >-
              Research laboratories buy controllable hardware and data-collection tooling; humanoid OEMs buy a subsystem
              that must fit their arm, control stack, and target tasks; industrial users ultimately pay for completed
              work rather than degrees of freedom. Reporting places Linkerbot with customers in scientific research,
              humanoid robotics, and industry, and company-issued materials name Samsung, Siemens, and Foxconn. Those
              references show segment breadth but not procurement depth, repeat orders, or customer economics. Near-term
              adoption can occur on existing robotic arms before general-purpose humanoids mature, which expands the
              immediate buyer set. Budget ownership should nevertheless be validated deployment by deployment: robotics
              R&D may fund pilots, while operations or automation teams must justify scaled use through integration
              effort, task success, service life, and replacement cost.
            claimRefs:
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM011
              - CM012
      - number: '2.4'
        title: Falling entry prices broaden trials; reliability governs scale
        blocks:
          - type: paragraph
            body: >-
              The principal growth drivers are more affordable hands, multiple architectures for different payload and
              control requirements, and software that converts demonstrations into reusable manipulation skills.
              Linkerbot says LinkerSkillNet contains more than 500 real-world skills, and its product range gives buyers
              options from lower-cost entry hardware to high-DOF research systems. The binding constraints are less
              visible: integration into third-party arms, repeatable task completion under variable conditions,
              maintenance, replacement cost, safety, and proof that demonstrations survive production workloads. A large
              technology company could also use scale to compress hardware margins. Financing and a possible IPO may
              fund capacity, but capital availability does not independently validate end-market size. Valuation work
              should therefore weight verified deployments and unit economics above claimed category share.
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The immediate market does not require humanoid maturity
            body: >-
              Selling hands into existing robotic arms creates a nearer-term adoption path, but the relevant denominator
              is compatible manipulation deployments rather than all humanoid or robotics spending.
            calloutType: insight
            claimRefs:
              - CM006
              - CM014
          - type: callout
            title: Share claims lack an independent denominator
            body: >-
              The reported 80%+ share cannot anchor valuation until diligence defines high-DOF eligibility, verifies
              competitor and internal-build volumes, and reconciles orders, shipments, and revenue.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Linkerbot competes in a layered market rather than against one clean peer set. Shadow Robot is the legacy
              high-articulation benchmark: Pandaily reports 24 independently controlled joints and a roughly
              $140,000-$280,000 price range. Tesla, Boston Dynamics, Figure AI, 1X, and Apptronik represent a different
              threat because they can internalize hand development inside a complete humanoid platform. At the
              lower-complexity end, conventional commercial grippers with one to six degrees of freedom remain adequate
              for constrained pick-and-place work. Buyers can also retain current automation or build an end effector
              internally. Linkerbot's component-supplier model therefore expands its addressable customer set beyond any
              single robot body, but also leaves distribution and integration power with robot OEMs and automation
              integrators.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP011
              - CP013
              - CP016
      - number: '3.2'
        title: Capability breadth and product position
        blocks:
          - type: paragraph
            body: >-
              Linkerbot's most defensible product distinction is architectural breadth, not degree-of-freedom count
              alone. Multiple reviewed sources describe linkage, direct-drive, and tendon-driven products, allowing the
              company to trade among stiffness, compactness, speed, maintainability, and biomimicry. The O6 also
              establishes a low advertised entry point: a September 2025 report listed it at RMB 6,666, while Pandaily
              described the L20 at roughly one-twentieth the cost of comparable overseas products. Those figures are
              useful positioning signals, not proof of delivered cost per successful task. RobotsBeat correctly cautions
              that active and passive joint counts do not establish reliability or maintenance burden, and Linkerbot's
              own co-founder acknowledged that earlier emphasis on peak metrics produced inconsistent stability and
              difficult customer deployments.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Pricing, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports list-price and architecture comparisons, but not realized transaction pricing,
              discounts, integration labor, service life, or replacement cost. Linkerbot's software and data layer may
              create switching cost if customers standardize workflows around LinkerSkillNet: company-originated
              material says the library has more than 500 skills, while RobotsBeat describes teleoperation, a skills
              store, and a model layer around the hardware. The same coupling can work against adoption when buyers
              already own a control stack or prefer an integrated robot OEM. Capital access may help Linkerbot subsidize
              manufacturing and channel expansion; Tech in Asia reported a RMB 1.5 billion Series B and a possible Hong
              Kong IPO, while Preqin records a subsequent Series B+ round but does not disclose total capital in its
              public preview.
            claimRefs:
              - CP007
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The emerging moat thesis combines cost-down manufacturing, multi-architecture engineering, installed
              hardware, and proprietary manipulation data. Company-originated releases claim thousands of units per
              month, more than 500 skills, and over 80% share of high-degree-of-freedom hands; Gasgoo separately reports
              a 60,000-100,000-unit annual-capacity line and more than 140 CNC machines, but its underlying operating
              metrics appear supplied by Linkerbot rather than audited. These signals support a scale hypothesis, not a
              verified market-share conclusion. Displacement risk remains meaningful from full-stack humanoid makers,
              well-capitalized component entrants, and simpler grippers that solve narrower jobs more reliably. The
              investment case should therefore treat verified task success, service life, gross margin, customer
              retention, and independently measured share as gating evidence rather than extrapolate a durable moat from
              shipment and demonstration claims.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural breadth reduces single-design risk
            body: >-
              Linkerbot is reported to offer linkage, direct-drive, and tendon-driven hands, allowing product selection
              around stiffness, speed, compactness, and maintainability rather than forcing every workload onto one
              mechanism.
            calloutType: strength
            claimRefs:
              - CP002
          - type: callout
            title: Demonstrations are not deployment benchmarks
            body: >-
              Linkerbot's co-founder acknowledged that peak-performance emphasis once produced inconsistent stability,
              difficult continuous operation, and harder-than-expected customer deployment.
            calloutType: risk
            claimRefs:
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and public pricing
        blocks:
          - type: paragraph
            body: >-
              The clearest public evidence describes a hardware-led business: Preqin says Linkerbot generates revenue
              primarily through direct sales of robotic products to enterprises and institutions, while independent
              reporting describes customers mounting its hands on existing robotic arms rather than purchasing complete
              humanoids. This broadens the near-term buyer base beyond full humanoid manufacturers, but it still leaves
              contract structure, acceptance terms, warranty obligations, and revenue recognition undisclosed. An
              independent product review reports starting prices from about $1,500 for the O6 through about $14,000 for
              the L30, with intermediate L-series tiers. Those are public starting prices, not evidence of realized
              average selling price, discounts, revenue mix, or gross margin. LinkerSkillNet may strengthen the hardware
              proposition, but no retained source establishes a separate software subscription, license, or usage-fee
              stream.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI001
