  - id: FR001
    title: Risk heatmap by impact, evidence of likelihood, and mitigation maturity
    type: matrix
    summary: >-
      Six decision-critical risks remain high-impact, while likelihood evidence and mitigation maturity are generally
      incomplete rather than demonstrably low.
    data:
      columns:
        - Impact if realized
        - Likelihood evidence
        - Mitigation maturity
      rows:
        - label: Continuous-operation reliability
          values:
            - High
            - Historical limitation acknowledged; current rate unknown
            - Developing, without an independent field cohort
        - label: Scale-up quality control
          values:
            - High
            - Ramp magnitude is evidenced; defect probability unknown
            - Manufacturing expansion disclosed; controls unverified
        - label: Product safety / liability
          values:
            - High
            - Incident frequency unknown
            - Teleoperation and sensors disclosed; certification gap remains
        - label: Integrator verticalization
          values:
            - High
            - Specific strategic threat reported; timing unknown
            - Product breadth and data strategy disclosed
        - label: Financing / IPO execution
          values:
            - High
            - IPO and valuation plans reported but not completed
            - Advisers and prior rounds reported; audited runway absent
        - label: Unit economics / warranty
          values:
            - High
            - Public price exists; cost and failure denominators absent
            - Not publicly evidenced
    approximationNotes: >-
      Qualitative matrix only. "Unknown" is preserved where the assigned source pool lacks a measured denominator; it is
      not converted into a low-likelihood score.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR008
      - CR009
      - CR010
      - CR011
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision remains research-more until reported traction can be converted into verified economics, price
      support, and exit readiness.
    data:
      nodes:
        - id: reported-traction
          label: Reported traction
          detail: Company claims on shipments, market share, production, and named customers.
        - id: independent-validation
          label: Independent validation
          detail: Reconcile customers, units, returns, and collections.
        - id: audited-economics
          label: Audited economics
          detail: Establish revenue, margin, cash use, and support burden.
        - id: capitalization
          label: Capitalization terms
          detail: Map ownership, dilution, debt, and preferences.
        - id: price-support
          label: Price support
          detail: Separate the roughly US$3B reported mark from the prospective US$6B target.
        - id: exit-readiness
          label: Exit readiness
          detail: Verify adviser process, timetable, and listing dependencies.
        - id: recommendation
          label: Research more
          detail: Advance only after the evidence gates close.
    approximationNotes: This is a decision sequence, not a quantitative probability or valuation model.
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV013
      - CV015
