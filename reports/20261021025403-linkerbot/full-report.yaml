        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder evidence is directionally consistent but not fully normalized. RobotsBeat identifies Alex Zhou as
              the founder, while KrASIA identifies Zhou Yong as founder and CTO and describes his earlier Lenovo
              research experience. The two names may refer to the same person, but the assigned sources do not establish
              that identity explicitly. KrASIA also names Cao Gang as the leader for algorithms and model training,
              which adds technical depth beyond the founder. No retained source provides a board roster, voting rights,
              succession plan, executive ownership, or leadership-change history. The investment case therefore has
              visible founder and technical leadership but material governance and key-person diligence gaps.
