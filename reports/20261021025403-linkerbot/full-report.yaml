              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Regulatory, legal, and governance diligence
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence does not establish Linkerbot's certification coverage, product-liability
              controls, export-control posture, privacy and training-data rights, patent disputes, recalls, or
              litigation status. That absence is a diligence gap, not evidence that no issue exists. BestStartup.Asia
              separately flags geopolitical scrutiny arising from state-fund investors and a Beijing-Shenzhen footprint,
              while Tech in Asia reports that a possible Hong Kong IPO remained under discussion and could change. An
              IPO process may improve disclosure discipline, but it does not currently provide audited operating or risk
              data in this source set. The regulatory register is therefore deliberately partial and uses conditional
              severity rather than invented incident probabilities.
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Dependencies, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Linkerbot depends on robot integrators continuing to buy a specialized hand rather than vertically
              integrating it. BestStartup.Asia identifies Tesla's in-house hand work and whole-robot ambitions among
              platform companies as direct strategic threats; it also frames the component supplier's ceiling as
              sensitive to whether humanoids remain a niche. The company's claimed 80% share is therefore concentration
              in a young category, not automatic durability. Financing evidence also needs reconciliation: a December
              2025 release cited $150 million raised since April 2025, Tech in Asia later reported a $220 million
              February 2026 Series B, and other reporting described a proposed $6 billion valuation after a $3 billion
              Series B+. Kill criteria should include unresolved audited funding data, a material rise in field
              failures, failed production qualification, or major integrators shifting decisively in-house.
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break conditions
            body: >-
              Pause or reject investment if diligence cannot reconcile audited funding and cash, if scaled production
              cohorts show persistent reliability or warranty deterioration, if required safety or export approvals are
              absent, or if major integrators materially shift hand design in-house without offsetting customer
              diversification.
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR011
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not buy. Independent reporting places a completed Series B+ financing
              at roughly US$3 billion while describing a US$6 billion next-round or IPO ambition as prospective; Tech in
              Asia also says advisers were hired for a possible Hong Kong offering whose plans could still change. Those
              are useful liquidity signals, but they do not establish a defendable entry price. The reviewed evidence
              lacks audited revenue, margin, cash, burn, ownership, liquidation-preference, and dilution data. Entry
              discipline should therefore be milestone-based: require a cap table, financing documents, audited
              financials, customer-level shipment and payment evidence, and a reconciled bridge from operating
              performance to the proposed valuation before underwriting a target return.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a focused hand supplier can monetize before general-purpose humanoids mature.
              Company-issued releases claim 10,000 cumulative hand shipments, more than 80% share of the
              high-degree-of-freedom segment, production above 1,000 units per month, and customers including Samsung,
              Siemens, and Foxconn. Preqin describes direct product sales to enterprises and institutions, while an
              independent review cites a 6,666 yuan O6 price point. The anti-thesis is that these commercial signals are
              mostly company assertions or secondary summaries rather than audited evidence. RobotsBeat specifically
              cautions that specification counts do not establish task reliability or maintenance burden, and that a
              fundraising ambition is not a completed valuation event.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Bull, base, and bear framework
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient for a numerical valuation range, so the scenarios use observable
              underwriting gates rather than fabricated multiples. A bull case requires independent confirmation of
              shipment volumes, repeat customers, usable gross margins, and a financing or listing near the reported
              target without punitive preferences. The base case keeps commercial traction as plausible but unverified
              and treats the last reported US$3 billion mark as context, not fair value. The bear case is triggered by
              failed shipment reconciliation, weak paid deployment, costly reliability support, a down round, or an IPO
              delay. No scenario receives a numerical probability because the evidence set lacks the operating and
              capitalization inputs needed to calibrate one.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Hiring China Merchants Bank International, Citic Securities, and HSBC for a possible Hong Kong offering
              indicates preparation, not readiness or completion. A financing-led exit could improve price discovery,
              but current reporting says talks remain ongoing and plans may change. Final diligence should obtain the
              latest capitalization table, all preference and debt terms, audited financial statements, monthly
              bookings-to-cash reconciliation, customer concentration and returns data, warranty and field-failure
              cohorts, and written adviser timelines for listing readiness. Thesis-break triggers are a valuation
              step-up without corresponding audited economics, material divergence between orders and cash collections,
              or inability to validate the shipment and customer claims that anchor the growth narrative.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No defensible public fair-value range
            body: >-
              The retained evidence supports valuation context and diligence gates, but not a numerical fair-value
              range. Treat the reported marks as financing signals until audited economics and security terms are
              available.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV015
          - type: callout
            title: Target valuation is not transaction evidence
            body: >-
              The reported US$6 billion figure is a prospective target. Underwriting it as completed value would erase
              the distinction between an ambition and an executed financing.
            calloutType: risk
            claimRefs:
              - CV005
