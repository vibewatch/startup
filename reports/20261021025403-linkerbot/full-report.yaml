      - number: '5.4'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Linkerbot's strongest visible differentiation is breadth: several actuation architectures, lightweight and
              high-DoF variants, integrated sensing, and a data-and-skills layer. Company-issued material further claims
              four factories, micrometer-level tolerance control, a two-week delivery cycle, and thousand-unit monthly
              production. Those assertions indicate an industrial ambition but remain supplier claims rather than
              independent process audits. The retained evidence contains no published MTBF, duty-cycle failure curves,
              ingress or temperature qualification, maintainability data, cybersecurity architecture, privacy controls
              for teleoperation data, functional-safety certification, recall history, or third-party comparative
              benchmark. Consequently, the investment case should treat scale, durability, safety, and data
              defensibility as testable diligence hypotheses rather than verified moats.
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE009
              - CE012
              - CE013
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specifications are not a reliability record
            body: >-
              Public pages show model breadth, point specifications, demonstrations, and supplier production claims, but
              the retained evidence does not publish customer-owned uptime, failure-rate, maintainability, security,
              safety, or task-success benchmarks.
            calloutType: risk
            claimRefs:
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              The clearest supported customer split is between research users and industrial buyers. China Robotics
              Insider describes manipulation and teleoperation research as an application, while RobotsBeat says
              research teams need learning hardware and manufacturers need end effectors that fit existing arms and
              processes. Tech in Asia further reports that Linkerbot is pursuing nearer-term demand by selling hands for
              installed robotic arms rather than waiting for mature humanoid platforms. This creates a component-led
              route to market across laboratories, automation teams, and robot integrators, but the reviewed evidence
              does not quantify revenue, units, geography, or buyer mix by segment.
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU011
      - number: '6.2'
        title: Adoption signals and named-account proof
        blocks:
          - type: paragraph
            body: >-
              Public scale signals are substantial but heterogeneous. A December 2025 report relaying company
              disclosures says monthly orders exceeded 1,000 units and gives a 2026 delivery target of 50,000 to 100,000
              hands. The Next Web, citing Reuters, separately describes the company as capable of shipping more than
              1,000 units per month. A Linkerbot release names Samsung, Siemens, and Foxconn as customers, and Tech in
              Asia repeats Samsung and Siemens. These data points indicate demand and recognizable counterparties, but
              they do not provide a common period, shipped-versus-ordered reconciliation, contract values, or
              customer-side confirmation of production deployment.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU014
      - number: '6.3'
        title: Durability, reliability, and concentration
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence comes from Linkerbot's own account in a FedEx Business Insights interview.
              The company says an earlier focus on peak performance produced inconsistent stability, difficulty
              sustaining continuous operation, and harder-than-expected customer deployment; it says priorities then
              shifted toward continuous operation, thermal stability, maintenance, and practical task-completion
              metrics. This is relevant evidence of learning, not proof that the problems are resolved. None of the
              eight retained sources supplies NRR, GRR, churn, renewals, contract duration, customer cohorts,
              top-customer share, or channel concentration, leaving durability and dependency risk unquantified.
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU013
      - number: '6.4'
        title: Expansion path and investment implication
        blocks:
          - type: paragraph
            body: >-
              Linkerbot's plausible expansion loop begins with a hand selected for research or an existing robotic arm,
              moves through integration and task qualification, and then depends on reliable production use before
              additional hardware, skills, or sites can follow. The reported RMB 6,666 O6 price could reduce an entry
              barrier, but it is a September 2025 reported price with no configuration, service, integration, or
              lifecycle-cost denominator. Linkerbot also says its hands assemble robotic arms and other hands
              internally; that is an operational proof point rather than external customer validation. Investment
              underwriting should therefore require customer-side references and cohort data before treating shipments
              as durable land-and-expand revenue.
            claimRefs:
              - CU010
              - CU011
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial scale has multiple public signals
            body: >-
              Distinct reports describe more than 1,000 monthly orders, more than 1,000 monthly shipments, and three
              recognizable customer names, although the metrics do not share a denominator.
            calloutType: strength
            claimRefs:
              - CU003
              - CU005
              - CU006
          - type: callout
            title: Shipment volume is not retention evidence
            body: >-
              The retained evidence does not disclose customer cohorts, renewal rates, repeat purchases, contract
              duration, top-customer share, or customer-side operating outcomes.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is operational reliability at scale. In a July 2026 interview, Linkerbot's
              co-founder acknowledged that earlier systems showed inconsistent stability, difficulty sustaining
              continuous operation, and harder-than-expected customer deployment; management says it has since shifted
              attention toward continuous operation, thermal stability, maintenance, and practical task completion. That
              response is directionally appropriate, but the assigned evidence contains no independently measured
              field-failure, uptime, warranty, or return-rate series. A second high exposure is scale execution: a
              company-reported 10,000th cumulative shipment in December 2025 sits against a reported target of
              50,000-100,000 deliveries in 2026. The risk is not that the target is impossible, but that quality
              controls, service capacity, and working capital are not publicly evidenced at the same level as the volume
              ambition.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR008
      - number: '7.2'
        title: Operational, quality, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Product demonstrations and degree-of-freedom specifications do not establish dependable customer outcomes.
              RobotsBeat explicitly notes that active and passive joint counts alone cannot prove task reliability or
              maintenance burden, while Linkerbot's own humanoid page describes a roughly 100 kg mobile platform, a 2 kg
              arm-end payload, and remote operation from a safe distance. Those disclosures make controls such as
              obstacle sensing and teleoperation visible, but they do not substitute for third-party functional-safety
              certification, incident history, or autonomous task-completion evidence. The O6's reported 6,666 RMB price
              may widen adoption, yet without gross-margin, warranty-cost, service-life, and replacement-cost data it
              also creates an unresolved economics and quality tradeoff. Investment underwriting should therefore
              require cohort-based reliability and cost data, not peak demonstrations.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
