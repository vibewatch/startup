              - CI005
              - CI006
              - CI008
              - CI012
      - number: '4.2'
        title: Production traction is visible; unit economics are not
        blocks:
          - type: paragraph
            body: >-
              Reuters reported production of almost 5,000 hands per month and a plan to reach 10,000 soon, a scale
              signal that is commercially meaningful but is neither revenue nor proof of utilization, sell-through, or
              profitable output. Linkerbot's own CES release claimed a two-week delivery cycle that was six times faster
              than competitors, yet the release supplies no audited baseline, order backlog, cancellation rate, or
              on-time-delivery evidence. The manufacturing footprint is also not fully reconciled: Reuters reported five
              factories and more than 400 employees, whereas the company release described four proprietary factories.
              Together these disclosures indicate a meaningful physical cost base involving factories, inventory, labor,
              quality control, warranty service, and likely working capital. They do not reveal gross margin,
              contribution margin, capex, inventory turns, warranty reserves, CAC, payback, or cash conversion.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Funding signals do not establish capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public financing reports show access to capital, but they cannot be treated as cash on hand. One
              independent review reported $150 million raised since April 2025, while Tech in Asia reported a February
              2026 Series B of CNY1.5 billion, or about $220 million. These disclosures are not reconciled and may
              overlap. Reuters then reported that a Series B+ valued Linkerbot at $3 billion and that management was
              targeting $6 billion for a subsequent financing; independent coverage correctly distinguishes the target
              from a completed transaction. Tech in Asia and The Robotics Media also reported a possible Hong Kong IPO
              that could raise a few hundred million dollars, but both characterize the process as prospective. None of
              these figures discloses current liquidity, monthly burn, committed capex, debt, project finance,
              restricted cash, or the milestone that would trigger the next raise.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence threshold
        blocks:
          - type: paragraph
            body: >-
              The public record supports a plausible direct hardware-sales model, unusually high claimed production
              scale, and continued financing access. It does not support a revenue-quality or solvency conclusion.
              Starting prices may indicate attractive revenue per unit, but there is no realized-price distribution,
              paid shipment count, customer concentration, returns data, service burden, or margin bridge. Similarly,
              factory expansion may create operating leverage at volume or may consume cash through equipment,
              inventory, and support; the available evidence cannot choose between those outcomes. Underwriting should
              therefore remain conditional on bank statements and a monthly financial package reconciling orders,
              accepted shipments, recognized revenue, bill of materials, labor, warranty, gross margin, working capital,
              capex, cash, debt, and burn. The next financing or IPO should be modeled as a dependency, not as available
              capital, until proceeds and closing conditions are documented.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              Reported capital raised, target valuations, and a possible IPO do not disclose current cash, burn,
              restrictions, debt, or closing certainty.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: callout
            title: Require a shipment-to-cash reconciliation
            body: >-
              Before underwriting scale, reconcile orders, accepted shipments, invoices, cash collection, unit costs,
              warranty expense, inventory, capex, and financing proceeds by month.
            calloutType: recommendation
            claimRefs:
