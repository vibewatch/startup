  - id: FM001
    title: Evidence-constrained addressable-market layers
    type: pyramid
    summary: >-
      The visual narrows broad robotics activity to the hand-specific hardware and enablement layer that Linkerbot can
      plausibly monetize; no numeric TAM is asserted.
    data:
      nodes:
        - label: Broad robotics and automation
          value: Excluded denominator
          detail: Includes spending unrelated to dexterous hands.
        - label: Full humanoid platforms
          value: Demand driver only
          detail: Locomotion, bodies, batteries, and whole-system software are excluded.
        - label: Existing robotic-arm deployments
          value: Served adjacency
          detail: Hands can be sold before general-purpose humanoids mature.
        - label: High-DOF hand hardware
          value: Core market
          detail: Linkage, direct-drive, and tendon-driven products for manipulation.
        - label: Hand integration and teleoperation
          value: Coupled enablement
          detail: Interfaces and data capture needed to deploy and train the hand.
        - label: Reusable manipulation skills
          value: Emerging software layer
          detail: Potential expansion beyond hardware, with monetization still undisclosed.
    approximationNotes: >-
      Layers are qualitative market boundaries, not value-proportional widths. Numeric values are intentionally omitted
      because the retained sources do not provide a defensible TAM, SAM, or SOM.
    claimRefs:
      - CM001
      - CM002
      - CM006
      - CM011
      - CM014
