chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Linkerbot is a Beijing-based robotics company founded in 2023 and focused on dexterous robotic hands,
              associated control software, and manipulation-skill infrastructure. The narrow component strategy lets it
              sell into research, humanoid-robot, and industrial workflows without underwriting the timing of a complete
              general-purpose humanoid. Preqin describes direct sales of robotic products to enterprises and
              institutions as the primary revenue model, while independent coverage describes a portfolio spanning hand
              hardware and skills software. That combination suggests a hardware-led business with a possible data and
              software layer, but no source in the assigned evidence discloses revenue mix, recurring software
              economics, gross margin, or customer concentration.
            claimRefs:
              - CO001
              - CO002
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
