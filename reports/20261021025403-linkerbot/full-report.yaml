          or revenue base.
        - Market-share definition, execution scale, and preference overhang.
        - Unassigned pending audited financial and customer evidence.
      - - Base
        - Reported traction is directionally real, but financial and capitalization disclosure remains limited.
        - Treat the roughly US$3B reported mark as transaction context, not independently underwritten fair value.
        - Opacity persists and exit timing slips.
        - Current working case; not a numerical probability.
      - - Bear
        - >-
          Shipment or customer assertions fail reconciliation, reliability costs impair economics, or the next financing
          is delayed or repriced.
        - Expect material downside or dilution because the prospective US$6B target lacks public operating support.
        - Down round, IPO delay, weak collections, and warranty burden.
        - Triggered by failed documentary or customer checks.
      - - Decision gate
        - Cap table, audited statements, cohort economics, customer proof, and adviser timetable are delivered.
        - Build a model-appropriate valuation range only after the denominator and security terms are known.
        - False precision from unreconciled public metrics.
        - No probability assigned before the gate closes.
    notes: >-
      No numerical valuation ranges or probabilities are shown because the retained public sources do not disclose
      audited operating metrics, security terms, or a complete capitalization table.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV013
      - CV015
