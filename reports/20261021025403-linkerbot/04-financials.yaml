company:
  name: "Linkerbot"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Linkerbot appears to monetize primarily through direct sales of dexterous robotic hands,
    with publicly reported starting prices spanning roughly $1,500 to $14,000 and production
    approaching 5,000 units per month. The financial case remains ununderwritable from public
    evidence because revenue, realized pricing, gross margin, cash, burn, runway, working
    capital, and debt are undisclosed, while financing headlines do not establish liquidity.
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture and public pricing"
    body: >-
      The clearest public evidence describes a hardware-led business: Preqin says Linkerbot
      generates revenue primarily through direct sales of robotic products to enterprises and
      institutions, while independent reporting describes customers mounting its hands on
      existing robotic arms rather than purchasing complete humanoids. This broadens the near-term
      buyer base beyond full humanoid manufacturers, but it still leaves contract structure,
      acceptance terms, warranty obligations, and revenue recognition undisclosed. An independent
      product review reports starting prices from about $1,500 for the O6 through about $14,000
      for the L30, with intermediate L-series tiers. Those are public starting prices, not evidence
      of realized average selling price, discounts, revenue mix, or gross margin. LinkerSkillNet
      may strengthen the hardware proposition, but no retained source establishes a separate
      software subscription, license, or usage-fee stream.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "traction-and-unit-economics"
    title: "Production traction is visible; unit economics are not"
    body: >-
      Reuters reported production of almost 5,000 hands per month and a plan to reach 10,000
      soon, a scale signal that is commercially meaningful but is neither revenue nor proof of
      utilization, sell-through, or profitable output. Linkerbot's own CES release claimed a
      two-week delivery cycle that was six times faster than competitors, yet the release supplies
      no audited baseline, order backlog, cancellation rate, or on-time-delivery evidence. The
      manufacturing footprint is also not fully reconciled: Reuters reported five factories and
      more than 400 employees, whereas the company release described four proprietary factories.
      Together these disclosures indicate a meaningful physical cost base involving factories,
      inventory, labor, quality control, warranty service, and likely working capital. They do not
      reveal gross margin, contribution margin, capex, inventory turns, warranty reserves, CAC,
      payback, or cash conversion.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: "capital-adequacy"
    title: "Funding signals do not establish capital adequacy"
    body: >-
      Public financing reports show access to capital, but they cannot be treated as cash on hand.
      One independent review reported $150 million raised since April 2025, while Tech in Asia
      reported a February 2026 Series B of CNY1.5 billion, or about $220 million. These disclosures
      are not reconciled and may overlap. Reuters then reported that a Series B+ valued Linkerbot
      at $3 billion and that management was targeting $6 billion for a subsequent financing;
      independent coverage correctly distinguishes the target from a completed transaction.
      Tech in Asia and The Robotics Media also reported a possible Hong Kong IPO that could raise
      a few hundred million dollars, but both characterize the process as prospective. None of
      these figures discloses current liquidity, monthly burn, committed capex, debt, project
      finance, restricted cash, or the milestone that would trigger the next raise.
    claimRefs: [CI013, CI014, CI015, CI016]
  - id: "financial-verdict"
    title: "Financial verdict and diligence threshold"
    body: >-
      The public record supports a plausible direct hardware-sales model, unusually high claimed
      production scale, and continued financing access. It does not support a revenue-quality or
      solvency conclusion. Starting prices may indicate attractive revenue per unit, but there is
      no realized-price distribution, paid shipment count, customer concentration, returns data,
      service burden, or margin bridge. Similarly, factory expansion may create operating leverage
      at volume or may consume cash through equipment, inventory, and support; the available
      evidence cannot choose between those outcomes. Underwriting should therefore remain
      conditional on bank statements and a monthly financial package reconciling orders, accepted
      shipments, recognized revenue, bill of materials, labor, warranty, gross margin, working
      capital, capex, cash, debt, and burn. The next financing or IPO should be modeled as a
      dependency, not as available capital, until proceeds and closing conditions are documented.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
