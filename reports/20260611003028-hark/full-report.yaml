      - number: '7.3'
        title: Privacy, Biometric, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Hark's product vision increases regulatory surface area before the first consumer device is even in
              market. The company wants a system that can listen, speak, see, remember, and act proactively across
              third-party apps and user workflows. Its privacy policy confirms that Hark collects inputs and outputs,
              device and location data, third-party app content, sandbox files, shell commands, generated code, and
              logs; it also says some image, audio, and avatar features may create data that could be treated as
              biometric under EU and U.S. state law. That means the legal exposure is not abstract. California's new
              privacy and ADMT rules are already on the clock, and official cyber guidance increasingly expects
              secure-by-design deployment for agentic systems. Because public evidence on Hark red-teaming, incident
              handling, and independent audits is absent, the mitigation story is still largely asserted rather than
              demonstrated.
