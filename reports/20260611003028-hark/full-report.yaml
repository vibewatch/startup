            body: >-
              Hark’s public surfaces describe a product that is far more concrete on user interaction than on customer
              disclosure. The homepage describes a personal-intelligence system paired with bespoke hardware, while the
              privacy policy describes accounts, payment card information, transaction history, prompts, outputs,
