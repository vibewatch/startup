  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Founder Concentration, Product-Proof Gap, and Expectation Risk
        blocks:
          - type: paragraph
            body: >-
              The current Hark case is still more founder-and-thesis than product-and-proof. Official materials show an
              unusually ambitious plan: vertically integrated models, software, and bespoke hardware; thousands of
              Nvidia B200 GPUs; and a software launch in summer 2026 with hardware shortly after. The company also
              raised more than $700 million at a $6 billion post-money valuation. But that capital sits on top of a thin
              public operating record. The reviewed materials still do not disclose named customers, pricing, revenue,
              or retention evidence, and TechCrunch explicitly noted how little Hark had revealed. That leaves Brett
              Adcock as the central underwriting object. Public sources also show that Adcock remains deeply associated
              with Figure and maintains other active ventures, so any distraction, credibility hit, or timeline miss can
              transmit into Hark before customer proof replaces founder brand as the primary support for the valuation.
            claimRefs:
