  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Hark's highest residual risk sits where founder concentration, product-proof gaps, and hardware execution all
      compound before customer evidence exists.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Founder concentration / proof gap
          values:
            - label: high
              tone: negative
              detail: The valuation arrived before public customer proof.
            - label: high
              tone: negative
              detail: Any distraction or launch miss can hit financing and credibility at once.
            - label: medium
              tone: warning
              detail: Capital and recruiting brand help, but governance depth is still opaque.
            - label: high
              tone: negative
              detail: Residual exposure stays high until launch converts into adoption evidence.
        - label: Hardware / manufacturing execution
          values:
            - label: high
              tone: negative
              detail: Hark is combining model launch with a bespoke device roadmap.
            - label: high
              tone: negative
              detail: A failed hardware launch can erase trust and cash quickly.
            - label: low-medium
              tone: warning
              detail: Talent is visible; manufacturing proof is not.
            - label: high
              tone: negative
              detail: Physical AI still faces reliability, battery, and scaling bottlenecks.
        - label: Privacy / biometric / agentic control
          values:
            - label: medium-high
              tone: warning
              detail: The product wants persistent memory and proactive action across apps and environments.
            - label: high
              tone: negative
              detail: A single incident could damage brand, enterprise trust, and regulatory posture.
            - label: low-medium
              tone: warning
              detail: Policies exist, but independent audit evidence is absent.
            - label: high
              tone: negative
              detail: Residual risk remains high until controls are evidenced in production.
        - label: Supply chain / compute dependence
          values:
            - label: medium
              tone: warning
              detail: Hark has disclosed heavy GPU dependence and undisclosed device sourcing.
            - label: high
              tone: negative
              detail: Delays can cascade into launch timing, model quality, and burn.
            - label: medium
              tone: warning
              detail: Compute access is real, but contingency planning is not public.
            - label: medium-high
              tone: warning
              detail: Supply and policy bottlenecks remain meaningful for a vertically integrated roadmap.
        - label: Valuation expectation reset
          values:
            - label: medium-high
              tone: warning
              detail: A price reset becomes more likely if launch evidence disappoints.
            - label: high
              tone: negative
              detail: Down-round or weak clearing price would affect morale, financing, and returns.
            - label: low-medium
              tone: warning
              detail: Current mitigant is capital, not visible product-market proof.
            - label: high
              tone: negative
              detail: Residual severity stays high until the market sees demand, not just demos.
