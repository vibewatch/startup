      - number: '8.4'
        title: Recommendation, discipline, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The correct investment call on the public evidence is avoid at the current price. That is not a statement
              that Hark is low quality; it is a statement that the current price already assumes a level of
              product-market proof that the public record does not yet show. The company has strong investors, founder
              credibility, a compute-heavy build plan, and a narrative that could become important if personal AI
              hardware breaks out. But price matters. At $6 billion post-money, Hark is already above Apptronik’s
              reported 2026 mark and far above Agility’s public 2026 range while still offering less public evidence on
              customers, pricing, and commercialization.


              The valuation could become supportable later, but only through evidence or price movement. The most
              obvious upgrades would be disclosed paid adoption from the summer 2026 rollout, evidence that native
              hardware materially improves usage or retention, named commercial design partners, and a transparent cap
              table showing that the preference stack does not consume too much of the downside. Absent those data,
              entry discipline should be strict: do not underwrite the announced mark as fair value, and do not confuse
              category enthusiasm with proof that Hark deserves to trade above better-evidenced peers. The right
              near-term posture is to keep researching, but only from the sidelines until either the proof improves or
              the price resets.
