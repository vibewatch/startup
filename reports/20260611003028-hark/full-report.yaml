        title: 'Revenue model visibility: product surfaces are public, monetization is not'
        blocks:
          - type: paragraph
            body: >-
              Hark has made the product architecture legible before it has made the business model legible. Official
              materials consistently describe a vertically integrated personal-AI platform that combines multimodal
              models, persistent memory, and bespoke hardware, and the homepage says the company is already reviewing
              applications for beta access. The privacy policy is also financially revealing in a narrow way: it
              references websites, apps, products and services, payment card information, transaction history, sandbox
              task execution, and a browser operator that can act across third-party pages. Those disclosures show that
              Hark expects commercial workflows involving accounts, transactions, and service usage. What they do not
              show is a public price list, subscription tier, API tariff, hardware price, or accounting treatment for
              any future bookings. The result is an unusual mix of visibility and opacity: the company is clear that it
              wants to monetize software and hardware together, but there is still no public evidence for realized
              revenue, customer counts, conversion, or any distinction between prospective demand and recognized
              revenue. For underwriting purposes, funding announcements therefore cannot substitute for top-line proof.
