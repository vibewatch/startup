  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Hark is competing on an unclear product brief against very clear alternatives
        blocks:
          - type: paragraph
            body: >-
              Hark’s public materials describe a universal interface between humans and machines built from multimodal
              AI and native hardware, but they do not yet disclose a specific robot form factor, customer workflow,
              price point, or production program. That ambiguity matters because investors still have to underwrite the
              company against the jobs that a future Hark system might try to solve. For industrial and logistics use
              cases, the reference set is already crowded with Figure, Tesla Optimus, Agility Robotics, Apptronik, and
              Boston Dynamics on the humanoid side, plus a much larger installed base of non-humanoid automation from
              Symbotic, Locus, GreyOrange, Berkshire Grey, and Amazon. For home and personal-assistant use cases, 1X is
              the clearest public humanoid adjacency. Goldman still sees a large long-run humanoid market, but Gartner
              and IEEE both argue that near-term production scale remains narrow, economics are weak, and buyers often
              prefer specialized robots with better throughput-per-dollar. Hark therefore enters not an empty category
              but a stack of already-defined choices: direct humanoids for flexible labor, polyfunctional warehouse
              robots for operational ROI, and AI-native device concepts for personal assistance.
