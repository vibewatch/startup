      - number: '1.3'
        title: Funding history, investor base, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Hark’s capital formation is unusually front-loaded. Observer and TechCrunch describe the company as having
              started late in 2025 with approximately $100 million of Adcock’s own capital. On May 21, 2026, Hark
              announced an oversubscribed Series A of more than $700 million at a $6 billion post-money valuation led by
              Parkway Venture Capital, with participation from NVIDIA, AMD Ventures, ARK Invest, Brookfield, Greycroft,
              Intel Capital, Prime Movers Lab, Qualcomm Ventures, Salesforce Ventures, Tamarack Global, and Align
              Ventures. The cap table matters strategically: it combines chip suppliers, venture firms, and
              enterprise-oriented investors whose interests align with Hark’s vertically integrated AI-device thesis.
              Qatalyst Partners advised the transaction. What remains opaque is ownership distribution. Public materials
              do not disclose dilution from Adcock’s self-funding, investor percentages, any governance rights attached
              to the round, or whether there are side agreements, secondaries, or debt facilities. The result is a
              well-capitalized but not yet transparent financing story.
