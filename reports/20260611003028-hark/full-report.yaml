      - number: '3.2'
        title: Direct embodied-AI peers already publish stronger deployment or product proof
        blocks:
          - type: paragraph
            body: >-
              Among direct humanoid peers, Figure currently sets the strongest mix of software ambition, field evidence,
              and capital. Its public Helix materials frame the company as an onboard vision-language-action stack, and
              its BMW update shows real production-line runtime that Hark has not yet matched publicly. Tesla remains
              harder to handicap because its scale and talent are obvious, but the most recent accessible coverage still
              describes a program dealing with delays, leadership churn, and unresolved usefulness inside Tesla
              factories. Agility looks more operationally mature for logistics buyers because Digit already sits inside
              a paid GXO deployment and is paired with Arc fleet software, while Apptronik has used Mercedes to validate
