      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Hark is not without real mitigants. The company has capital, a credible recruiting brand, visible
              technical ambition, and official acknowledgement that the stack must be built together rather than
              improvised after launch. Those matter. But the public evidence still leaves too much unresolved for the
              mitigants to carry the full thesis. In practice, investors should treat Hark as a gated underwriting
              exercise rather than a pure vision bet. The decision should improve only if management can show launch
              punctuality, credible privacy and safety controls, visible customer conversion, and a realistic
              manufacturing path. Until then, the right posture is to monitor a small set of measurable triggers: launch
              slip, privacy or biometric trouble, persistent hardware or supply delays, spillover from founder
              controversies at Figure, and any financing or market signal that resets the valuation story downward. If
              multiple triggers fire together, the thesis is broken, not merely delayed.
