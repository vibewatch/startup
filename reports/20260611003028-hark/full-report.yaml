      - number: '7.4'
        title: Market Skepticism, Partner Exposure, and Capital Intensity Risk
        blocks:
          - type: paragraph
            body: >-
              Even if Hark launches on time, it still has to overcome a market that is increasingly skeptical of both
              humanoid timelines and over-hyped AI devices. The strongest public comparables are not comforting. Expert
              commentary from Berkeley, MIT Technology Review, Bain, McKinsey, and TechCrunch argues that physical-AI
              commercialization will likely be slower, more verticalized, and more expensive than current valuations
              imply. The Humane AI Pin provides the consumer-hardware cautionary tale: a heavily funded AI-device story
              collapsed into discontinued hardware, returns outpacing sales, battery warnings, and a much smaller
              strategic asset sale. Hark also carries partner and capital dependency. It needs compute, third-party AI
              infrastructure, future investors, and eventually manufacturing counterparties that have not yet been
              publicly named. SEC materials add a second reminder that this is a capital-intensive build: Hark Labs
              filed a $1 billion exempt offering in March 2026, underscoring how much financing can still matter even
              after the headline Series A.
