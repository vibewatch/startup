            body: >-
              Hark’s clearest financial disclosures are on capital raised and infrastructure ambition, not on operating
              economics. The March 2026 SEC Form D for Hark Labs Inc. showed a total offering amount of $1.0 billion,
              with $50 million sold as of a first sale date of March 10, 2026, a remaining $950 million available in the
              filing, and a revenue range explicitly marked “Decline to Disclose.” Two months later, the company
              announced an oversubscribed Series A of more than $700 million at a $6 billion post-money valuation. That
              sequence matters: the public record shows financing momentum and balance-sheet support, but it still does
              not disclose cash on hand, monthly burn, runway, or any debt or project-finance structure. Capital
              intensity is also easier to see than margin. Hark’s March launch announcement said a large cluster of
              thousands of NVIDIA B200 GPUs was coming online in April, and public B200 pricing proxies suggest these
              systems are expensive, power-hungry, and often available only through enterprise contracts or scarce cloud
              capacity. Pairing that compute footprint with custom hardware development means Hark looks more like a
              compute-and-device company than a lightweight software startup. The Series A therefore appears less like
              growth capital for a proven model and more like prerequisite financing for training, tooling, hardware,
