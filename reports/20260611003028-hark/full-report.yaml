        title: >-
          Customer diligence readthrough: Hark’s present state is a proof-of-demand question, not a proven-customer
          story
        blocks:
          - type: paragraph
            body: >-
              The chapter conclusion is therefore narrow but important. Hark may ultimately sell into a very large
              market, and Brett Adcock’s ecosystem gives the company attention, talent access, and adjacent operating
              context. None of that substitutes for customer evidence in this chapter. As of the run date, the public
              record supports a buyer hypothesis, a workflow hypothesis, and a set of proof benchmarks from adjacent
              companies, but it does not support claims about Hark customer scale, production deployments, reference
              quality, retention, or renewal durability. The right diligence move is not to deny that Hark could create
              demand; it is to demand the materials that would convert conjecture into underwriting: named pilot or
              production accounts, cohort usage data, pricing and payment structure, hardware attachment assumptions,
              renewal data, top-account concentration, and references willing to discuss daily value and privacy
              concerns. Until that evidence appears, the customer chapter should be read as an evidence-gap map with a
              cautious segment hypothesis attached. Hark’s strongest public customer signal is that its product is being
              designed around persistent, account-level use. Its weakest public customer signal is that no public
