        title: Founder carryover and roadmap credibility
        blocks:
          - type: paragraph
            body: >-
              Brett Adcock’s Figure track record is relevant to Hark’s technology chapter, but only as context, not as
              proof that Hark has inherited Figure’s actual stack. Figure’s official Helix and Helix 02 disclosures show
              a very specific product philosophy: vertically integrated intelligence, high-rate control, rapid iteration
              across model layers, and a willingness to replace hand-engineered logic with learned systems when the
              product requires it. TechCrunch’s reporting on Figure’s break with OpenAI reinforces the same principle
              from Adcock directly: he argues that core AI cannot be outsourced if the hardware experience depends on
              it. That philosophy lines up closely with Hark’s own claim that models, software, and hardware must be
              designed together from the start.


              Still, public disclosure stops at philosophy. No retained source shows that Hark reuses Figure code,
              datasets, suppliers, or operational infrastructure. The better inference is narrower: Hark benefits from a
              founder who has recently run integrated AI-and-hardware programs, recruited top design talent, and taken
              adjacent systems into real-world runtime. That makes Hark’s roadmap more plausible than a random stealth
              startup’s, but it does not erase the fact that Hark remains pre-device, lightly disclosed, and dependent
              on future execution to turn architecture intent into a sellable, trusted platform.
