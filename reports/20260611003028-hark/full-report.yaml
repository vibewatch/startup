      - number: '6.3'
        title: >-
          Retention, durability, expansion, and concentration: every durable-customer metric is still null, so the
          underwriting focus shifts to trust and workflow friction
        blocks:
          - type: paragraph
            body: >-
              Hark’s public materials imply several possible expansion loops, but none are yet validated with customer
              evidence. The privacy policy suggests account-based monetization, connectors, transaction-enabled
              workflows, and a browser operator that can take action inside third-party services. If those surfaces
              become real customer behavior, Hark could expand within an account by earning broader permissions, more
              frequent autonomous tasks, higher-value subscriptions, and later hardware attachment. But this is still an
              expansion theory, not an observed land-and-expand motion. There is no disclosed NRR, GRR, logo retention,
              churn, renewal term, contract length, active-user cohort, CSAT, NPS, or public customer review corpus
              clearly tied to this Hark entity. That means durability must remain null, not guessed. The same caution
              applies to concentration. Public evidence does not reveal whether Hark’s first adopters are a handful of
              wealthy individuals, internal testers, undisclosed design partners, or a broader waitlist, so top-customer
              risk cannot be quantified. Still, the likely concentration risk is directionally obvious: before public
              launch, adoption is likely to be narrow, and the company’s trust burden is unusually high because the
              product as described wants personal data, payment credentials, connected services, and ambient
              action-taking authority. In other words, Hark may have a compelling future expansion surface, but the
              practical blockers to durable customer adoption are privacy, permissions, workflow reliability, and proof
              of daily utility.
