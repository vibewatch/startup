  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and current workflow
        blocks:
          - type: paragraph
            body: >-
              Hark’s public narrative is unusually clear on ambition and unusually thin on shipped specifics. The
              company says it is building “advanced personal intelligence” that combines multimodal models, persistent
              memory, and bespoke hardware into a universal interface, and the official site says the platform is
              entering beta. The strongest evidence for what exists today is not a product tour or pricing page; it is
              the combination of the homepage, fundraising post, privacy policy, and integration-oriented hiring.
              Together they imply a workflow in which a user gives Hark chat, voice, or file inputs, Hark carries that
              context into agentic sessions, and the system eventually acts across external tools and services on the
              user’s behalf.


              That is materially different from a conventional chatbot, but it is not the same thing as a publicly
              documented commercial product. Public sources do not disclose device form factor, supported channels, or
              named production customers, and the official beta page is still just a request-access funnel. The result
              is a product story that is strongest in customer-job language—offload digital tasks, manage context, and
              act proactively—while remaining weak on the operational details that would tell a buyer or investor
              exactly what can be used today versus what is promised for later hardware releases.
