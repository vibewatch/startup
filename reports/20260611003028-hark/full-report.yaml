              identifiable buyer and payer is likely the account holder, not a publicly named enterprise procurement
              department. The user also appears to be the operator: the person whose preferences, data, browser context,
              and connected services make the system useful. That does not rule out future enterprise adoption, but it
              does mean Hark’s current public customer story is structurally consumer- or prosumer-led in the evidence
              that is actually available. Even the careers page emphasizes AI, engineering, and design rather than a
              visible sales, implementation, or reference-customer narrative. For customer diligence, that matters
              because it pushes the chapter away from invented enterprise logos and toward a narrower, evidence-based
              interpretation: Hark appears to be building for individual or small-team accounts first, with any broader
