      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Hark is tightly identified with Brett Adcock, who is named founder and CEO across official releases and
              third-party coverage. That biography matters because investors are clearly underwriting prior execution as
              much as current product evidence: Adcock previously founded Figure AI, co-founded Archer Aviation, and
              earlier founded Vettery. Public Hark materials also highlight Abidur Chowdhury, formerly an Apple designer
              associated with iPhone and Mac programs, as the design leader responsible for translating the company’s
              personal-intelligence thesis into a new interface. What is missing is almost as important as what is
              present. The public record reviewed for this chapter does not name a broader executive bench, a board, or
              independent governance structures beyond Adcock’s role and Chowdhury’s design leadership. That
              concentration creates material key-person risk because Adcock remains publicly associated with Figure, and
              adverse coverage around Figure’s commercialization claims could spill over into Hark’s credibility.
              Investors should therefore diligence succession, allocation of founder attention, and governance controls
              rather than assume the team depth is commensurate with the size of the Series A.
