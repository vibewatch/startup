      - number: '2.3'
        title: Buyer, User, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The near-term buying center for humanoid and service robotics is still industrial and logistics
              operations, not a generalized consumer budget. McKinsey’s warehouse work emphasizes resilience, safety,
              throughput, and labor challenges as the decision frame, which means operations, automation engineering,
              and supply-chain leadership are the natural buyers. The user is usually the floor supervisor or plant
              process owner. The payer is typically a plant or supply-chain capex budget, sometimes blended with opex
              when vendors can offer robots-as-a-service or pay-per-pick structures. This makes the adoption path highly
              staged: companies start with a narrow workflow, validate reliability and safety, and only then consider
              larger fleet rollout.


              The public deployment evidence reinforces that pattern. BMW and Figure focused on a single body-shop task
              in Spartanburg before expanding physical-AI pilots elsewhere. Agility and GXO framed Digit as a
              revenue-generating commercial deployment, but still inside a tightly bounded logistics workflow. Apptronik
              and Mercedes are exploring kit and tote delivery inside manufacturing, again as a controlled application.
              In other words, early buyers are not purchasing a general-purpose robot in the abstract; they are funding
              a specific repetitive workflow that is physically demanding, ergonomically poor, or hard to staff.


              For Hark, the buyer question is still open. Its public materials describe a universal interface and
              personal intelligence rather than a named industrial workflow. That leaves two plausible adoption paths.
              One is a personal-AI and hardware route that later connects to embodied systems. The other is an
              enterprise workflow route in which Hark’s models and native devices become a control or interaction layer
              for industrial robots already deployed by third parties. The available evidence does not yet establish
              which budget owner, price point, or commercial packaging wins first.
            claimRefs:
              - CM004
              - CM005
              - CM020
              - CM021
              - CM032
              - CM033
