chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product thesis, and business model
        blocks:
          - type: paragraph
            body: >-
              Hark presents itself as an artificial-intelligence lab building “the most advanced personal intelligence
              in the world,” not as a narrow application company. Across the homepage, the March 2026 launch release,
              and the May 2026 financing announcement, the company repeats the same core architecture: its own
              foundation models, software systems, and purpose-built hardware are being developed together as a
              universal interface between humans and machines. The intended product is multimodal and agentic, combining
              speech, text, vision, contextual awareness, and persistent memory so the system can proactively manage
              parts of a user’s digital and eventually physical environment. This makes Hark closer to a next-generation
              personal-computing platform than a conventional SaaS assistant. Management says first software experiences
              and models should arrive in summer 2026, with AI-native devices to follow. As of the run date, however,
              Hark has not disclosed customers, pricing, or monetization details, so the business model should be
              treated as pre-commercial and thesis-driven rather than validated by public traction.
