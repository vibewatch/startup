    {
      "id": "direct-humanoid-peers",
      "title": "Direct embodied-AI peers already publish stronger deployment or product proof",
      "body": "Among direct humanoid peers, Figure currently sets the strongest mix of software ambition, field evidence, and capital. Its public Helix materials frame the company as an onboard vision-language-action stack, and its BMW update shows real production-line runtime that Hark has not yet matched publicly. Tesla remains harder to handicap because its scale and talent are obvious, but the most recent accessible coverage still describes a program dealing with delays, leadership churn, and unresolved usefulness inside Tesla factories. Agility looks more operationally mature for logistics buyers because Digit already sits inside a paid GXO deployment and is paired with Arc fleet software, while Apptronik has used Mercedes to validate the humanoid-in-human-designed-spaces pitch. Boston Dynamics brings the deepest enterprise-robotics pedigree, including Atlas specs and Orbit workflow integrations, even if its humanoid commercialization is still early. 1X is less direct for warehouse buyers, but it matters if Hark stays closer to an AI-native personal device than a factory labor platform. Across all six peers, the common pattern is that each has already published more concrete product, partner, or pilot evidence than Hark.",
