    {
      "id": "durability-and-displacement",
      "title": "Moat durability is weak until Hark can prove workflow lock-in, not just hardware ambition",
      "body": "The strongest adverse evidence in this chapter is not a scandal at a competitor; it is the combination of limited production readiness for humanoids and abundant substitute automation for structured work. Gartner argues that humanoids remain expensive, immature, and usually inferior to polyfunctional robots on throughput and uptime, while IEEE Spectrum argues the real bottleneck is not manufacturing robots but finding reliable, safe, economically sound demand at scale. Those critiques land especially hard on Hark because its public record is still earlier than the direct peers. Hark has capital, design talent, and founder credibility, but it has not yet shown pricing, customer wins, deployment metrics, or a software-control layer comparable to Agility Arc or Boston Dynamics Orbit. That means switching costs remain hypothetical. If hardware costs keep falling, basic robot bodies risk commoditizing, shifting value toward workflow software, data, service, and channel partnerships. Hark\u2019s best path to durable differentiation is therefore not merely shipping a capable robot or device; it is owning a workflow where direct humanoids do not yet dominate and where substitutes cannot already prove better ROI.",
