    {
      "id": "substitutes-and-status-quo",
      "title": "Warehouse and factory substitutes already solve the buyer job with higher proof",
      "body": "The biggest competitive mistake would be to frame Hark only against other humanoid startups. In warehouse and factory automation, buyers do not need a humanoid body to justify a purchase. Symbotic already sells end-to-end warehouse automation and has a Walmart-backed development and deployment path for hundreds of accelerated pickup and delivery sites. Locus shows the appeal of robots-to-goods AMRs that drop into existing facilities with named customer case studies and measured productivity gains. GreyOrange positions itself as orchestration software plus robots across warehouses, stores, and supply chains, while Berkshire Grey automates piece picking and trailer unloading directly. Amazon is the clearest proof that specialized physical AI can absorb huge amounts of warehouse labor without ever building a general humanoid. McKinsey\u2019s warehouse automation review reinforces the point: operators can already choose from mature AMRs, goods-to-person systems, shuttles, and fee structures that reduce capital friction. If Hark wants to sell into logistics or manufacturing, it is competing against proven throughput systems, not just against headline humanoid brands.",
