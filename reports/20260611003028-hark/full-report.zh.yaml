            body: >-
              Hark 的资本形成异常前置。Observer 和 TechCrunch 称，公司于 2025 年末启动，约有 $100 million 来自 Adcock 自有资金。2026 年 5 月 21 日，Hark
              宣布完成超额认购的 Series A，融资超过 $700 million，投后估值 $6 billion；本轮由 Parkway Venture Capital 领投，NVIDIA、AMD
              Ventures、ARK Invest、Brookfield、Greycroft、Intel Capital、Prime Movers Lab、Qualcomm Ventures、Salesforce
              Ventures、Tamarack Global 和 Align Ventures 参投。股权结构表具有战略意义：它把芯片供应商、风险投资机构和偏企业端的投资人组合在一起，与 Hark 垂直整合 AI
              设备的投资逻辑相匹配。Qatalyst Partners 担任交易顾问。仍不透明的是所有权分布。公开材料没有披露 Adcock
              自筹资金带来的稀释、投资人持股比例、本轮附带的治理权利，也没有说明是否存在侧函、老股交易或债务工具。结果是一段资本很充足、但尚不透明的融资故事。
