  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 规模野心、缺失验证、品类怀疑和当前价格如何共同导向最终建议。
    data:
      nodes:
        - id: n1
          label: Hark 按 $6B 估值融资 >$700M
        - id: n2
          label: 垂直整合 + 大 TAM 叙事
        - id: n3
          label: 未公开收入 / 定价 / 客户
        - id: n4
          label: 验证更充分的同业估值在 $2.1B-$5.3B
        - id: n5
          label: 品类怀疑与硬件下行情景先例
        - id: n6
          label: 回避 / 中置信度 / 高风险 / 昂贵
      edges:
        - from: n1
          to: n2
          label: 支撑上行
        - from: n1
          to: n3
          label: 未解决
        - from: n2
          to: n6
          label: 单独不够
        - from: n3
          to: n6
          label: 大幅折价
        - from: n4
          to: n6
          label: 定价高于可比公司
        - from: n5
          to: n6
          label: 抬高下行风险
    approximationNotes: 该图为定性分析，但每个节点都有明确主张支撑：融资事实、战略叙事、缺失验证、可比公司区间和反向研究。
