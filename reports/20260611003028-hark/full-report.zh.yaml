      - - 基准
        - Hark 发布产品，但公开证据仍好坏参半；软件价值存在，硬件仍昂贵，市场给 Hark 的估值更接近证据更充分的私营机器人同业。
        - $2.5B-$4.0B 结果；按当前入场计算，毛 MOIC 约 0.4x-0.7x；更接近 Agility/Apptronik 式基准，而不是突破型平台定价。
        - 上线延期，定价仍不透明，市场折价处理缺失的变现证据。
