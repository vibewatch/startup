    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 有证据支撑的理由
      - 缓释方式 / 尽调要求
    rows:
      - - 集成 AI 加原生硬件
        - Figure 已经用更强的现场验证讲同一个软件加机器人一体化故事
        - 高
        - Figure 有 Helix、BMW 运营数据和更高估值，而 Hark 仍没有披露具名落地工作流
        - 要求 Hark 展示其界面独有地改善了哪类用户工作流，以及为什么 Figure 不能快速补上
