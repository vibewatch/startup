              detail: 人才可见；制造证明不可见。
            - label: 高
              tone: negative
              detail: Physical AI 仍面临可靠性、电池和规模化瓶颈。
        - label: 隐私 / 生物识别 / 智能体控制
          values:
            - label: 中-高
              tone: warning
              detail: 产品想要跨应用和环境使用持久记忆并主动行动。
            - label: 高
              tone: negative
              detail: 一次事件就可能损害品牌、企业信任和监管姿态。
            - label: 低-中
              tone: warning
              detail: 政策存在，但独立审计证据缺席。
            - label: 高
              tone: negative
              detail: 在控制机制经生产环境证明之前，剩余风险仍然很高。
        - label: 供应链 / 算力依赖
          values:
            - label: 中
              tone: warning
              detail: Hark 已披露对 GPU 的重度依赖，设备采购来源未披露。
            - label: 高
              tone: negative
              detail: 延误会级联影响发布时间、模型质量和烧钱速度。
            - label: 中
              tone: warning
              detail: 算力访问是真实的，但应急规划并不公开。
            - label: 中-高
              tone: warning
              detail: 对垂直整合路线图来说，供应和政策瓶颈仍然重要。
        - label: 估值预期重置
          values:
            - label: 中-高
              tone: warning
              detail: 如果发布证据令人失望，价格重置的可能性会升高。
            - label: 高
              tone: negative
              detail: 降价轮或疲弱成交价会影响士气、融资和回报。
            - label: 低-中
              tone: warning
              detail: 当前缓释因素是资本，不是可见的产品市场证明。
            - label: 高
              tone: negative
              detail: 在市场看到需求而不只是 demo 之前，剩余严重度仍然很高。
    approximationNotes: null
    claimRefs:
      - CR007
      - CR008
      - CR011
      - CR012
