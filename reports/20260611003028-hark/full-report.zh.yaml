      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              人形和服务机器人近期的购买中心仍在工业和物流运营，而不是泛化的消费者预算。McKinsey
              的仓库研究把韧性、安全、吞吐和劳动力挑战作为决策框架，这意味着运营、自动化工程和供应链负责人是天然买方。用户通常是现场主管或工厂流程负责人。付款方一般是工厂或供应链资本开支预算；如果供应商能提供机器人即服务或按拣选付费结构，有时会混入运营开支。采用路径因此高度分阶段：企业从狭窄工作流开始，验证可靠性和安全性，然后才考虑更大规模的机队
              rollout。


              公开部署证据强化了这一模式。BMW 和 Figure 先聚焦 Spartanburg 的一个车身车间任务，然后再把 physical-AI 试点扩展到其他地方。Agility 和 GXO 把 Digit
              定位为产生收入的商业部署，但仍处在边界很清楚的物流工作流内。Apptronik 和 Mercedes
              探索的是制造场景中的套件和料箱配送，同样是受控应用。换句话说，早期买方并不是抽象购买一台通用机器人；他们资助的是一个具体、重复、体力强度高、人体工学差或难招人的工作流。


              对 Hark 来说，买方问题仍未解决。它的公开材料描述的是通用接口和个人智能，而不是具名工业工作流。因此存在两条可能的采用路径。一条是个人 AI 与硬件路线，之后连接到具身系统。另一条是企业工作流路线，即
              Hark 的模型和原生设备成为第三方已部署工业机器人的控制层或交互层。现有证据尚不能证明哪个预算所有者、价格点或商业包装会先跑出来。
