        blocks:
          - type: paragraph
            body: >-
              第一台消费设备上市之前，Hark 的产品愿景已经扩大了监管暴露面。公司想要一个系统，能在第三方应用和用户工作流中听、说、看、记忆，并主动行动。隐私政策确认，Hark
              会收集输入和输出、设备和位置数据、第三方应用内容、沙盒文件、shell 命令、生成的代码和日志；政策还称，一些图像、音频和 avatar
              功能可能产生在欧盟和美国州法下可被视为生物识别的数据。这意味着法律暴露不是抽象风险。California 新隐私和 ADMT 规则已经进入倒计时，官方网络安全指引也越来越期待智能体系统按
              secure-by-design 部署。由于公开证据缺少 Hark 红队测试、事件处理和独立审计，缓释叙事仍主要停留在主张，而不是证明。
