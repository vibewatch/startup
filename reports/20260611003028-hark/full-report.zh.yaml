  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Hark 在不同里程碑验证状态下的示意公允价值中点，不只看公布价格。
    data:
      items:
        - label: 无付费验证 / 发布延迟
          value: 1000
        - label: 仅推出软件
          value: 2500
        - label: 软件发布 + 早期付费队列
