          - type: callout
            title: 资本入口是真实的
            body: 融资本身证明，顶级资本提供方愿意激进资助 Hark 的投资逻辑。这一点不应被忽视。它降低了近期融资风险，也给公司真实机会，比多数发布前同行更快证明产品。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: callout
            title: 价格已经跑在公开商业化证明之前
            body: Hark 的估值高于 Apptronik，也远高于 Agility 和 Boston Dynamics 基准，同时仍未披露通常支撑溢价所需的指标。这种错配是核心承销风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV032
              - CV033
              - CV034
              - CV037
          - type: callout
            title: 当前 $6B 标记应回避
            body: 价格未来可能变得合理，但当前公开证据不支持在这里进入。概率加权区间低于要价，从这一水平出发的上行相对于下行风险也不够有吸引力。
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV045
              - CV048
          - type: callout
            title: 优先权悬顶仍是重大未知
            body: 融资数学告诉我们可见稀释，但没有说明真实经济堆叠。没有条款清单，投资人无法知道普通股之前压着多少清算优先权或反稀释保护。
            calloutType: assumption
            claimRefs:
              - CV010
              - CV043
              - CV044
