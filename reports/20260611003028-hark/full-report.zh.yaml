      - number: '7.2'
        title: 硬件、制造与供应链执行风险
        blocks:
          - type: paragraph
            body: >-
              Hark 不只是交付软件。公司自己的材料称，产品依赖紧密耦合的模型、设备和始终可用的个人界面。这会成倍放大执行负担。公司招募了有经验的硬件运营人才，也签下了大量算力，但除 Nvidia
              外，尚未公开披露制造伙伴、认证路径、可靠性数据或组件采购策略。更广泛的市场证据给出的是警示。Figure 自己的 BMW 披露在有意义运行时长之后仍突出一个头部硬件故障点，BMW
              也把德国部署描述为试点，而不是成熟的规模化项目。MIT Technology Review、Berkeley、Bain、McKinsey 和 TechCrunch 的独立研究都指向同一个信息：人形机器人和物理
              AI 系统在灵巧性、电池、正常运行时间、安全、监管和供应商准备度上，仍有硬瓶颈。因此，Hark 正试图切入曲线最难的部分，而不是容易的部分。
