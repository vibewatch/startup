        - 2026 年夏季模型发布转化为付费使用；硬件顺利上线；已披露经济性支撑平台叙事；后续投资者把 Hark 重新定价为消费 / 具身 AI 领导者。
        - $8B-$12B 结果；按今天 $6B 入场计算、后续稀释前，毛 MOIC 约 1.3x-2.0x；所需证据要比 Agility 更接近高端 1X / Figure 叙事。
