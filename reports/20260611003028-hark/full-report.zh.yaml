      - number: '8.3'
        title: 概率加权结果仍低于要价
        blocks:
          - type: paragraph
            body: >-
              Hark 的上行情景并非凭空想象。Goldman 的品类 TAM 工作说明，为什么投资人愿意为人形机器人或具身 AI 的真正赢家支付很高价格；Hark
              自身融资也证明，资本市场愿意资助雄心勃勃的界面加硬件押注。如果 Hark 2026
              年夏季模型推出能转化成真实付费使用，如果公司能证明硬件显著改善留存或效用，并且如果它能披露早期经常性经济性，高于今天价格的估值是可能的。问题在于，公开证据尚不足以让外部投资人给这种上行情景赋予高概率。Gartner、IEEE
              Spectrum、IEEE RAS、Rodney Brooks 和 McKinsey 都指向同一个方向：人形机器人和具身自动化市场仍难以规模化、容易被过度炒作，也容易被已经交付仓储 ROI 的专用替代方案冲击。


              因此，情景表保持保守。基准情景假设 Hark 拿到的估值更接近后期证明型同行，但低于当前标记；悲观情景假设发布失误或变现疲弱，让公司暴露在类似其他 AI 硬件失望案例的重估中；乐观情景假设 Hark
              成为少数平台赢家之一，把产品雄心转成持久付费意愿。对这些路径加权后，中点仍低于当前 $6 billion
              价格。同样重要的是，从当前进入价看，回报曲线并不吸引：即便结果非常好，也只产生有限的总上行；而下行仍严重，因为已融资资本、可能的优先权和未来稀释都排在普通股上行之前。
