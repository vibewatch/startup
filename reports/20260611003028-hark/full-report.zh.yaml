      - number: '2.2'
        title: 规模测算视角与预测分散
        blocks:
          - type: paragraph
            body: >-
              最强的公开上行情景仍是 Goldman Sachs 的预测：到 2035 年，人形机器人总可用市场（TAM）可能达到 $38 billion，同期出货量达 1.4
              million。这一预测很重要，因为它解释了资本为何持续流入具身 AI 和硬件平台。但同一来源也说明，不能用一个头条 TAM 概括这个市场。Goldman
              的逻辑依赖大幅降本、更快商业化，以及最终的工业和消费端采用；而 Gartner 的 2026 年报告称，到 2028 年，真正进入制造和供应链生产使用的公司可能少于 20 家。两句话可以同时大方向成立：长期
              TAM 很大，同时近期可服务市场很窄。


              更受证据约束的规模测算框架，不应是单一数字，而是一组视角。第一，是 2035 年远期人形机器人 TAM。第二，是工业自动化当前装机基础和资本开支基线；IFR 仍预计到 2028 年，每年工业机器人安装量超过
              700,000 台，并报告各地区自动化密度差异很大。第三，是相邻的个人和辅助需求池；WHO 预计，到 2050 年，需要辅助产品的人数将超过 3.5 billion，同时也记录了严重的可及性和劳动力缺口。具体到
              Hark，公开证据还不足以拆出可信的可服务市场（SAM）或可获取市场（SOM）：公司没有披露首个买方细分、定价模型、部署模型，也没有说明首个产品偏消费者、企业，还是机器人控制。结果是一个显然重要、显然可投、但仍过早，无法用一个宽泛估计可信定价的市场。
