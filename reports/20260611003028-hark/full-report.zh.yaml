      - - 标价、折扣和合同结构
        - 阻碍任何实现价格或收入质量分析
        - 要求提供当前价目表、已签订单、折扣政策和合作伙伴转售条款。
      - - 硬件 ASP、BOM、保修准备金和退货假设
        - 阻碍硬件毛利率建模和营运资本分析
        - 按 SKU 要求提供 BOM、目标 ASP、保修计提、退货准备金和库存计划。
      - - 算力合同条款和利用率
        - 阻碍训练 / 推理成本分摊，以及资本开支 vs 运营开支评估
