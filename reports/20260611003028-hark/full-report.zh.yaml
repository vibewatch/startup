        - label: Form D 发行上限（USD M）
          value: 1000
          note: 2026 年 3 月 SEC Form D 总发行金额
        - label: Agility 估值参考（USD M）
          value: 2150
          note: 2026 年公开参考点，已有具名部署
        - label: Apptronik 估值参考（USD M）
          value: 5300
          note: 据报道为 2026 年 2 月投后估值，公开商业化验证更强
        - label: Humane 下行资产出售基准（USD M）
          value: 116
          note: 显示 AI 硬件下行可能很剧烈
    approximationNotes: 该图混合使用 Hark、同业和下行参考数字。除隐含持股比例直接以百分比表示外，其余单位均为百万美元。
