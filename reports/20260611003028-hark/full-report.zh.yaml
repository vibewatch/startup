  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Hark 并未在公开材料中把自己呈现为仓库机器人 OEM。它自己的材料描述的是一套垂直整合的个人智能栈，组合多模态模型、记忆和专用硬件。做市场分析时，相关边界因此比单一机器人品类更宽，但比泛 AI
              软件更窄。核心市场包括人形机器人和其他必须在人类既有空间中运行的服务机器人，以及让这些机器在工业和物流场景中有用所需的控制软件、部署服务、界面和数据系统。这是最接近 Hark
              的公开市场框架，因为公司谈的是人与机器之间的通用接口，而不是已披露的一支固定功能仓库机器队伍。


              同一边界也必须排除重要替代品。固定式工业机器人、AMR 和仓库软件自动化已经解决了同一劳动力与吞吐问题中的重要部分，只是不声称采用通用类人形态。Gartner
              明确认为，多功能轮式系统在许多供应链任务中可能优于人形机器人；Amazon 已部署超过百万台机器人，也说明买方已经拥有规模化的非人形选项。因此，定义 Hark 机会的正确方式，是把它看作具身
              AI、工业自动化和个人机器人之间的相邻层：如果它证明自己比专用替代方案更有用，就可能作为控制、界面或硬件层参与这些预算。


              第二个相邻领域是个人和辅助机器人。Goldman 的乐观情景假设，消费机器人年销量最终可超过 100 万台；WHO 的数据则显示，人口老龄化正在形成巨大的未满足辅助技术需求。这并不等于养老护理或家用机器人今天就是
              Hark 已验证的近期市场，但足以说明，个人机器人是一个真实的相邻支出池，不能简单当成科幻。
