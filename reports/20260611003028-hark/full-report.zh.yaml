        - 维持回避；要求价格重置或数据室证据
      - - 硬件护城河缺席
        - 原生硬件看起来可有可无，或相较纯软件入口没有差异
        - 相比纯模型或应用竞争者，溢价倍数的主要理由被拿掉
        - 估值下调至纯软件或失败设备先例附近
      - - 品类估值回调
        - 类人机器人 / 具身 AI 同行在下一轮融资周期明显重估下行
        - 支撑 Hark 当前估值标记的可比倍数会收缩
        - 收紧下行假设，要求更深折价
      - - 隐藏优先权堆叠
        - Series A 条款显示激进优先权、棘轮条款或大规模老股出售
        - 即便企业价值增长，新投资人与普通股股东的上行空间也会被压低
        - 除非价格补偿结构性下行，否则回避
    notes: 每个触发器都能靠公开公告或尽调室监测。资本结构触发器目前无法靠公开证据解决，因此也列入证据缺口。
    claimRefs:
      - CV003
      - CV007
      - CV025
      - CV031
      - CV039
      - CV040
      - CV043
      - CV044
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表与优先权
        - Series A 条款清单、清算优先权、反稀释和期权池处理
        - 判定普通股与新投资人的下行风险是否远差于标题估值暗示的水平
        - 向公司法律顾问和领投方索取最终交割文件
      - - 付费采用
        - 2026 年夏季上线后的用户数、付费转化、流失、留存和队列行为
        - 区分产品好奇心与可变现的产品市场匹配
        - 董事会材料、增长看板和支付处理商摘录
      - - 客户证据
        - 具名企业或渠道伙伴、设计伙伴和硬件试点经济性
        - 验证 Hark 的界面或设备是否解决真实购买问题
        - 客户访谈和已签商业协议
      - - 单位经济性
        - 硬件 BOM、保修准备金、支持负担和软件毛利率桥
        - 看原生硬件是在创造价值，还是只是在吃掉资本
        - CFO / 运营复核加供应商报价
      - - 独立估值标记
        - 支撑 $6B 标记的老股交易、投资人信或第三方估值备忘录
        - 检验公布价格是被广泛接受，还是只是融资标题
        - 领投方附函复核和基金 LP 材料
      - - 竞争差异化
        - Hark 在留存或付费意愿上能跑赢纯软件助手以及证据更充分的机器人同行的证据
        - 没有这类证据，相比 Agility / Apptronik 的溢价倍数很难自洽
        - 产品演示、基准测试套件和比较用户研究
    notes: 从公开市场叙事走向可承销的估值意见，至少需要这些材料。若干尽调问题直接对应两个尚未解决的研究问题。
    claimRefs:
      - CV007
      - CV037
      - CV043
      - CV044
      - CV046
      - CV049
      - CV050
