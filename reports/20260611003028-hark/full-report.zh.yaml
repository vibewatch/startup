        title: 采用轨迹与具名证明：Hark 公开上仍处部署前，而相邻机器人同行已经发布具名运营参考
        blocks:
          - type: paragraph
            body: >-
              关于 Hark 的核心客户事实不是隐藏增长，而是缺少证明。Hark 自己的 3 月发布公告称，软件体验和 AI 模型将在 2026 年夏季到来，AI-native 硬件随后推出；5
              月融资文章重复了这一时间。TechCrunch 到 5 月末仍称公司高度保密，Forbes 则明确指出，$700 million Series A 没有可命名客户，也没有可承销的牵引力。在审阅的 Hark
              官网、发布材料、融资材料、隐私披露和融资报道中，公司没有公开识别试点客户、生产部署、企业设计伙伴、付费席位数、活跃账户数，或带结果的案例研究。这不能证明没有用户；它只能证明，公开记录尚不支持超出预期发布时间的采用主张。与相邻自动化市场对比时，缺口更清楚。Figure
              发布 BMW 运行时间、吞吐和周期时间指标；Agility 和 GXO 描述了一个产生收入的商业化试点后部署；Apptronik 和 Mercedes 命名了具体制造任务；Symbotic 和 Walmart
              披露了有条件的部署经济性；Locus 和 DHL 报告在 40 多个站点完成 10 亿次仓库拣选。这些不是 Hark
              客户，本章只把它们作为证明门槛基准。但它们有用，因为它们说明，当一家公司拥有具名客户证据时，证据会长什么样。Hark 在公开层面还没到那里。
