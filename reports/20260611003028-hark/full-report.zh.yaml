  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：Hark 可以靠资金迅速打到品类相关性
        - Series A 融资超过 $700M，超额认购，主要算力和半导体投资者参与。
        - 若 2026 年夏季按时发布指标，并证明资本正在转化为产品使用，论点会增强。
      - - 投资逻辑：垂直整合可能形成有防御力的界面护城河
        - 官方材料持续描述模型、软件、记忆和定制硬件的一体化构建。
        - 如果 Hark 证明硬件相较纯软件界面，能实质提升留存、转化或任务完成率，论点会增强。
      - - 投资逻辑：品类上行空间真实存在
        - Goldman 对 $38B 人形机器人 TAM 的观点，以及 Figure、1X、Apptronik 的高估值，说明投资者会继续资助赢家。
        - 如果 Hark 证明自己属于赢家队列，而不只是炒作队列，论点会增强。
      - - 反向逻辑：公司在变现公开前就已被定价
        - 未发现公开收入、定价、客户 logo、毛利率或付费 beta 披露。
        - 如果 Hark 披露付费使用、留存和客户案例，论点会削弱。
      - - 反向逻辑：证据更充分的同业更便宜，或只是略便宜
        - Agility 和 Apptronik 在较低据报估值下已有公开部署证据；Hark 已高于 Apptronik 的据报估值标记。
        - 如果 Hark 拿出质量明显优于这些同业的证据，或价格重置，论点会削弱。
      - - 反向逻辑：整个品类可能仍被高估
        - Gartner、IEEE、Brooks、McKinsey 和 Humane 的结果都指向同一点：硬件野心可能跑在需求和 ROI 前面。
        - 如果 Hark 交付到一个付费意愿、正常运行时间和留存都清晰可见的用例中，论点会削弱。
    notes: 各行混合投资逻辑和反向逻辑，使决策保持证据敏感。多行取决于尚未公开发生的事件。
