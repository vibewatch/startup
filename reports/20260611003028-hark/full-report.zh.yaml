      - - 个人 AI 原生硬件
        - 消费级或专业消费者硬件、多模态模型、设备服务
        - 没有原生硬件或持久记忆的通用聊天机器人
        - 个人用户或企业知识工作预算
        - 这是 Hark 今天最清晰表述的品类
      - - 辅助 / 个人机器人邻近市场
        - 辅助设备、陪伴和独立生活支持系统、无障碍服务
