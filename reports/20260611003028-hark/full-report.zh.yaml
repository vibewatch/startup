        - 资金雄厚的同行和 Tesla 能在硬件、数据和人才上花得比 Hark 更多
        - 高
        - Hark 的 $6B 估值有分量，但 Figure、Tesla 和大型既有厂商仍拥有更多公开部署验证或资本杠杆
        - 要求提供招聘、算力和制造计划，说明 Hark 能在哪些环节做到同类最佳，而不只是资金充足
      - - 人形机器人在面向人类空间中的灵活性
        - 多功能机器人和仓储自动化替代品可能以每美元带来更高吞吐
        - 高
        - Gartner、McKinsey、Symbotic、Locus、GreyOrange、Berkshire Grey 和 Amazon 都支撑专用自动化逻辑
        - 要求给出工作流地图，说明哪些环节必须使用人形机体，而不只是可以接受
      - - 潜在个人 AI 和家庭场景相邻性
        - 如果 Hark 继续以设备为中心，1X 和其他消费级具身 AI 项目可能挤占叙事
        - 中
        - 1X 明确优先家庭场景；Hark 公开描述个人 AI 和原生硬件，但没有固定工业切入点
        - 说明 Hark 优先做消费辅助、企业机器人，还是混合进入市场路径
      - - 工作流软件和车队锁定效应
        - Agility Arc 和 Boston Orbit 已经定义了控制层切换成本
        - 高
        - 机体只是企业锁定效应的一部分；集成、地图、故障排查和数据系统会随时间变得更重要
        - 在假设存在持久切换成本前，先要求 Hark 说明计划中的控制软件、数据护城河和集成 API
      - - 硬件成本下降
        - 组件成本下行会让基础机器人机体商品化
        - 中
