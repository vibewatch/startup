    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品逻辑与商业模式
        blocks:
          - type: paragraph
            body: >-
              Hark 把自己定位为一家人工智能实验室，要打造「世界上最先进的个人智能」，而不是一家狭窄的应用公司。从官网、2026 年 3 月发布稿到 2026 年 5
              月融资公告，公司反复讲同一套核心架构：自有基础模型、软件系统和专用硬件一起开发，作为人与机器之间的通用接口。目标产品是多模态且具备智能体能力，整合语音、文本、视觉、上下文感知和持久记忆，让系统主动管理用户数字环境，并最终延伸到物理环境的部分任务。因此，Hark
              更接近下一代个人计算平台，而不是传统 SaaS 助手。管理层称，首批软件体验和模型将在 2026 年夏季推出，AI-native 设备随后跟进。但截至本报告日期，Hark
              尚未披露客户、定价或变现细节，商业模式应被视为尚未商业化、由投资逻辑驱动，而不是已经被公开牵引力验证。
