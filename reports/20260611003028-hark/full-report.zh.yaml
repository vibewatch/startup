      - number: '5.3'
        title: 创始人延续性与路线图可信度
        blocks:
          - type: paragraph
            body: >-
              Brett Adcock 在 Figure 的履历与 Hark 技术章节相关，但只能作为语境，不能证明 Hark 继承了 Figure 的实际技术栈。Figure 官方 Helix 和 Helix 02
              披露展示了一套很具体的产品哲学：垂直整合智能、高频控制、跨模型层快速迭代，并在产品需要时愿意用学习系统替代手工工程逻辑。TechCrunch 关于 Figure 与 OpenAI 分手的报道，从 Adcock
              本人角度强化了同一原则：如果硬件体验依赖核心 AI，就不能把核心 AI 外包。这一哲学与 Hark 自己关于模型、软件和硬件必须从一开始共同设计的说法高度一致。


              但公开披露止步于哲学。保留来源没有显示 Hark 复用 Figure 代码、数据集、供应商或运营基础设施。更好的推断应更窄：Hark 受益于一位近期运营过整合 AI
              与硬件项目、招募过顶级设计人才，并把相邻系统带入真实运行环境的创始人。这让 Hark 的路线图比随机 stealth startup 更可信，但不能抹去一个事实：Hark
              仍处于设备前阶段、披露很轻，并且依赖未来执行，才能把架构意图变成可销售、可信任的平台。
