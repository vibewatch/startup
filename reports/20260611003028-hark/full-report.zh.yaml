        title: 留存、耐久性、扩张和集中度：所有耐久客户指标仍为空，因此承销重点转向信任和工作流摩擦
        blocks:
          - type: paragraph
            body: >-
              Hark
              的公开材料暗示了几条可能的扩张回路，但还没有客户证据验证。隐私政策显示，公司可能靠账号变现、连接器、可交易的工作流，以及能在第三方服务里执行动作的浏览器操作员来扩张。一旦这些界面变成真实客户行为，Hark
              可以在单个账号里拿到更广权限、更高频的自主任务、更高价值订阅，并在后续叠加硬件。但这仍是扩张理论，不是已经观察到的 land-and-expand 动作。公司没有披露 NRR、GRR、logo
              留存、流失率、续约条款、合同期限、活跃用户队列、CSAT、NPS，也没有公开客户评论语料能明确对应到这个 Hark 实体。因此，耐久性必须保持为空，不能猜。同样需要谨慎看待集中度。公开证据无法说明 Hark
              的首批采用者究竟是少数富裕个人、内部测试者、未披露的设计伙伴，还是更广泛的候补名单，因此无法量化头部客户风险。不过，可能的集中度风险在方向上很清楚：公开发布前，采用面大概率很窄；而产品按描述需要个人数据、支付凭证、已连接服务，以及环境式动作执行权限，信任负担异常高。换句话说，Hark
              未来的扩张界面可能很有吸引力，但要让客户长期使用，现实障碍是隐私、权限、工作流可靠性，以及日常效用证明。
