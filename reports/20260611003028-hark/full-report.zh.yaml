      - number: '8.2'
        title: 可比融资显示，Hark 的定价领先于证据更充分的同行
        blocks:
          - type: paragraph
            body: >-
              检验 Hark $6 billion 价格最干净的方法，是对照近期机器人融资和交易，且这些案例的公开记录不止一条融资标题。Figure 给出两个锚点：2024 年 2 月估值 $2.6
              billion，Microsoft、Nvidia、OpenAI 和 Bezos 参与；随后在 2025 年 9 月估值 $39 billion，当时它已在披露的软件和生产证明上走得更远。Figure 后来的
              BMW 部署展示了可衡量的产线活跃运行时长、搬运零件数量和触达车辆数量。Apptronik 是 2026 年高可信人形机器人初创公司的最近下界：在 TechCrunch 报道大约 $5.3 billion
              估值前，公司已有 Mercedes-Benz、GXO、DeepMind 邻近性，以及近 $1 billion 融资。Agility 在 2026 年公开引用中更便宜，约 $2.1 billion 至 $2.15
              billion，但它已经有多年期 GXO 协议和更清晰的物流工作流。


              因此，Hark 落在一个尴尬的相对位置。尽管披露的商业证明少于任何一家，它仍比 Apptronik 更贵，也远比 Agility 和 Boston Dynamics 已披露的并购基准更贵。唯一明显高于 Hark
              的可比对象，是 Figure 2025 年末的领导者估值和 1X 据报道 $10 billion 的融资目标，但两者都不能有力防守今天的价格。Figure 的更高估值背后有多得多的证据；1X
              的更高估值只是据报道的目标，不是已关闭融资。这让 Hark 看起来更像一个以溢价购买未来品类领导权的期权，而不是一个已经被公开运营证据验证的价格。
