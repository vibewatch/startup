      - number: '5.2'
        title: 架构、训练与关键依赖
        blocks:
          - type: paragraph
            body: >-
              最具体的产品与技术证据来自法律和招聘页面。Hark 的隐私政策描述了一套系统：可接受多模态输入，可与第三方应用协作，可在既有会话中操作浏览器扩展，并可在隔离沙盒中运行智能体任务。招聘板进一步勾勒出图景：Hark
              正在招聘预训练、多模态语音和视觉、后训练和 RL、大规模训练基础设施、集成、嵌入式软件、音频固件、隐私工程和 AI
              安全岗位。这一组合暗示了一个垂直整合架构，至少有四个可见层：模型训练和数据管线；智能体运行时与连接器层；面向 AI-native 硬件的嵌入式设备栈；以及信任与安全控制平面。


              公开证据也揭示了主要依赖。Hark 的基础设施岗位指向 10,000+ GPU 雄心，融资材料称其已锁定 B200 容量，因此算力获取是一阶依赖。连接器广度是另一项依赖：只有 Hark
              能让工具使用在电子邮件、日历、浏览器和第三方 API 之间安全、快速、可靠地运行，产品才会变得真正有用。最后，硬件侧依赖 NPI 纪律、合同制造、可靠性测试，以及兼顾功耗和延迟的 OS
              设计。这些依赖已经足够可见，可以画出地图；但还不够可见，无法承销为已经解决。
