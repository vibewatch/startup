  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与当前工作流
        blocks:
          - type: paragraph
            body: >-
              Hark 的公开叙事对雄心讲得异常清楚，对已交付细节却异常稀薄。公司称其正在打造「高级个人智能」，把多模态模型、持久记忆和定制硬件组合成通用接口；官网也称平台正在进入
              beta。判断今天到底有什么，最强证据不是产品演示或定价页，而是官网、融资文章、隐私政策和偏集成的招聘。合在一起，它们暗示了一套工作流：用户向 Hark 输入聊天、语音或文件；Hark
              把这些上下文带入智能体会话；系统最终代表用户在外部工具和服务之间行动。


              这与传统聊天机器人有实质差异，但并不等于已经公开记录的商业产品。公开来源没有披露设备形态、支持渠道或具名生产客户，官方 beta
              页面也仍只是一个申请访问漏斗。结果是，产品故事在客户任务语言上最强——卸下数字任务、管理上下文、主动行动；但在运营细节上仍弱，买方或投资人还无法明确知道今天可用的是什么、哪些只是为后续硬件发布承诺的内容。
