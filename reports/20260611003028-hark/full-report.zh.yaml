      - number: '5.4'
        title: 信任、安全与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Hark 值得认可的一点是，它比许多 stealth hardware 叙事释放了更多信任与安全信号。隐私政策有实质内容，不是占位文本，并且覆盖沙盒执行、浏览器操作员行为、连接器、删除权利和第三方 AI
              提供商使用。隐私和安全岗位描述也说明，公司预期会面对围绕数据删除、去标识化、审核分类器、生产监控和事件响应的真实运营负担。这些都是有意义的产品信号，因为一个会读取页面、执行任务并记住用户上下文的通用接口，如果没有这些能力，商业上会失败。


              但公开信任包仍不完整。没有保留下来的 trust center、状态页、认证清单、硬件安全报告、公开 SLA 或独立可靠性证据。产品侧更广泛地存在同一张力：Hark
              显然已经为一套雄心很大的多模态、智能体、软硬件平台配置团队，但公开记录仍缺少模型卡、基准、设备规格、beta 使用指标和制造细节。出于尽调目的，核心承销结论因此是：对架构严肃性正面，对公开就绪证明负面。Hark
              很可能确实在搭建它描述的技术栈；问题在于，外部观察者仍看不到足够信息，无法验证它到底走到了哪一步。
