      - - 悲观
        - 上线延期或转化不佳；硬件经济性仍不清楚；公司在证明付费意愿前还需要更多资本；品类倍数压缩。
        - $0.75B-$1.5B 结果；毛 MOIC 约 0.1x-0.25x；下行更像估值重置或战略出售，而不是高溢价增长轮。
        - 下轮融资保护条款、需求偏弱和替代自动化方案限制恢复价值。
        - 30%
    notes: 情景价值是分析师估计，依据是当前私营机器人可比公司、公开品类怀疑，以及 Hark 已知价格。概率加权中点约 $4.3B，低于当前 $6B 要价。
