              和 TechCrunch 的专家评论认为，物理 AI 商业化大概率比当前估值所暗示的更慢、更垂直，也更昂贵。Humane AI Pin 提供了消费硬件的警示故事：一个融资充足的 AI
              设备叙事，最终变成硬件停产、退货超过销售、电池警告，以及规模小得多的战略资产出售。Hark 还背着伙伴和资本依赖。它需要算力、第三方 AI 基础设施、未来投资人，以及最终还未公开具名的制造交易对手。SEC
