      - number: '2.4'
        title: 增长驱动、替代品与商业约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑很容易讲清楚。Goldman 称，组件可得性已经改善，成本下降快于预期；当工作危险、肮脏、枯燥或难招人时，工业需求最强。McKinsey
              解释了物流买方为何在失败后仍继续追求自动化：他们仍需要韧性、安全、准确性和吞吐。IFR 的区域密度和安装量预测确认，工业自动化预算真实存在且仍在增长。WHO
              的辅助技术数据则增加了更长期的个人机器人相邻机会，因为人口老龄化和护理缺口会持续扩大对支持独立生活技术的需求。


              更难的问题是商业化时点。Gartner 和 IEEE 都认为 hype 跑在了准备度前面。Gartner 称，到 2028
              年，多数人形机器人部署仍局限在严格受控环境，并警告多功能轮式机器人往往经济性更好。IEEE 把瓶颈说得更具体：电池取舍、关键运营中约 99.99%
              可靠性的要求、平衡型机器人尚未解决的安全要求，以及一个基础需求问题——还没有设施级 killer app 在千台机器人规模上浮现。Rodney Brooks 还补充了更广泛的警示：原型成功不等于规模部署。


              这组约束对估值的意义大于头部 TAM。今天的买方在把人形机器人与 Amazon 非人形机队等已验证替代品比较，而不只是与人工比较。如果品类转向高端控制层或界面层，Hark
              仍可能受益；但公开证据尚未证明，市场奖励一个宽泛个人智能平台的速度，会快于奖励边界清晰、按工作流定制的自动化。因此，本章同时保留上行和矛盾：资本和预测在加速，但采用仍窄，基准数据仍薄，胜出的形态仍未定。
