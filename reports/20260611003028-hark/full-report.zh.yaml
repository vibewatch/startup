        - 执行委派任务、文件和 shell 级工作流
        - 依赖稳健隔离、日志、回滚和滥用检测
        - 沙箱薄弱会带来严重安全和信任风险
      - - 连接器和工具协议
        - 把外部服务映射成可调用的模式和动作
        - 依赖 OAuth、webhook、API 标准化和合作伙伴在线稳定性
        - 模式漂移、授权过期和不稳定的第三方 API 都可能打断产品
