      - number: '6.4'
        title: 客户尽调通读：Hark 当前要回答的是需求是否存在，不是客户已经跑通
        blocks:
          - type: paragraph
            body: >-
              本章结论因此很窄，但重要。Hark 最终可能卖进一个很大的市场，Brett Adcock
              的生态也给公司带来关注度、人才入口和相邻运营语境。但本章里，这些都不能替代客户证据。截至本次报告日期，公开记录支持买方假设、工作流假设，以及来自相邻公司的若干证明基准；但不足以支撑关于 Hark
              客户规模、生产部署、推荐质量、留存或续约耐久性的主张。正确的尽调动作不是否认 Hark
              可能创造需求，而是要求能把推测转成承销依据的材料：具名试点或生产账号、队列使用数据、定价和支付结构、硬件附着假设、续约数据、头部账号集中度，以及愿意讨论日常价值和隐私顾虑的客户推荐。在证据出现前，客户章节应被视为一张证据缺口地图，并附带谨慎的客群假设。Hark
              最强的公开客户信号，是产品围绕持续的账号级使用来设计；最弱的公开客户信号，是还没有任何公开客户具名为产品背书。
