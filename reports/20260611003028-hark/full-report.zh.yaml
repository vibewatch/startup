  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Hark 的主要风险通过发布时间、信任和融资传导，而不是来自单一孤立失效模式。
    data:
      nodes:
        - id: founder
          label: 创始人集中度
          description: Adcock 仍是主要可信度和资本节点。
        - id: launch
          label: 发布证明缺口
          description: 目前还没有公开客户、定价或收入证据。
        - id: hardware
          label: 硬件执行
          description: 模型和定制设备必须一起发布。
        - id: privacy
          label: 隐私 / 生物识别风险
          description: 持久记忆和智能体工作流扩大监管接触面。
        - id: supply
          label: 算力 / 组件依赖
          description: GPU、组件和未披露的制造伙伴都很关键。
        - id: trust
          label: 用户与监管者信任
          description: 信任决定采用速度和法律容忍度。
        - id: adoption
          label: 客户采用
          description: 发布质量必须转化为习惯和付费意愿。
        - id: financing
          label: 未来融资 / 估值
          description: 下一次定价事件会检验当前叙事。
      edges:
        - from: founder
          to: launch
        - from: hardware
          to: launch
        - from: supply
          to: hardware
        - from: privacy
          to: trust
        - from: launch
          to: adoption
        - from: trust
          to: adoption
        - from: adoption
          to: financing
        - from: launch
          to: financing
        - from: hardware
          to: financing
    approximationNotes: null
    claimRefs:
      - CR003
      - CR008
      - CR011
      - CR021
      - CR023
      - CR029
      - CR037
      - CR043
      - CR044
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 设备市场证明出现很久以前，Hark 路线图就已经依赖一整套外部系统和交易对手。
    data:
      nodes:
        - id: hark
          label: Hark
          description: 产品尚未发布的个人智能平台与设备路线图。
        - id: nvidia
          label: NVIDIA / GPU 生态
          description: 多模态模型的训练与推理算力。
        - id: mfg
          label: 未披露制造商
          description: 负责 AI 原生设备的制造、认证和规模化。
        - id: thirdparty
          label: 第三方 AI 提供商 / 应用
          description: 外部系统的政策、质量与权限边界。
        - id: regs
