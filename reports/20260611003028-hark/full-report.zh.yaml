        blocks:
          - type: paragraph
            body: >-
              目前的 Hark 案例仍更像创始人加投资逻辑，而不是产品加证明。官方材料展示了一项异常激进的计划：垂直整合模型、软件和定制硬件；数千块 Nvidia B200 GPU；2026
              年夏季发布软件，随后推出硬件。公司还以 $6 billion 投后估值融资超过 $700 million。但这笔资本之下，公开运营记录很薄。已审阅材料仍未披露具名客户、定价、收入或留存证据，TechCrunch
              也明确指出 Hark 透露的信息很少。因此，Brett Adcock 成为核心承销对象。公开来源还显示，Adcock 仍与 Figure
              深度绑定，并维持其他活跃项目；在客户证明取代创始人品牌、成为估值主要支撑之前，任何分心、信誉受损或时间线失误，都可能传导到 Hark。
