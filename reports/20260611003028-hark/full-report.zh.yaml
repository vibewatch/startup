      - number: '1.2'
        title: 创始人、领导层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Hark 与 Brett Adcock 高度绑定，官方发布和第三方报道都把他列为创始人兼 CEO。这段履历很关键，因为投资人显然在承销过往执行力，权重不低于当下产品证据：Adcock 此前创立 Figure
              AI、联合创办 Archer Aviation，更早还创立 Vettery。Hark 公开材料还重点介绍 Abidur Chowdhury；他曾是 Apple 设计师，参与过 iPhone 和 Mac
              项目，如今负责设计，把公司的个人智能逻辑转译成新界面。缺失的信息几乎同样重要。本章审阅的公开记录没有列出更完整的高管梯队、董事会，或 Adcock 角色与 Chowdhury
              设计领导之外的独立治理结构。这种集中度带来实质性关键人风险：Adcock 仍公开关联 Figure，而 Figure 商业化说法引发的负面报道可能外溢到 Hark
              的可信度。因此，投资人应尽调接班安排、创始人精力分配和治理控制，而不能假设团队深度已经匹配 Series A 的规模。
