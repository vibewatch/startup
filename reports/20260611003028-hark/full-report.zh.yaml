            body: >-
              Hark 的公开页面在用户交互上比客户披露具体得多。官网描述了搭配定制硬件的个人智能系统；隐私政策则描述账户、支付卡信息、交易历史、提示词、输出、第三方应用、连接器、沙盒执行，以及能在用户自己的浏览器会话中行动的
              Browser
              Operator。合在一起，这些披露暗示了一种直接账户关系：第一个可识别买方和付款方很可能是账户持有人，而不是公开具名的企业采购部门。用户看起来也是操作者：个人偏好、数据、浏览器上下文和已连接服务让系统变得有用的那个人。这并不排除未来企业采用，但确实意味着，在实际可得证据中，Hark
              当前公开客户故事的结构更偏消费者或 prosumer 主导。即便招聘页也强调 AI、工程和设计，而不是可见的销售、实施或参考客户叙事。对客户尽调而言，这很重要，因为它会把本章从编造企业 logo
              拉回更窄、基于证据的解读：Hark 似乎先在为个人或小团队账户构建，任何更广泛的买方层级仍未披露。
