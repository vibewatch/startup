          description: CPPA、安全指引，以及未来产品责任立场。
        - id: figure
          label: Figure / BMW 叙事
          description: 创始人身边资源带来的信誉信号，指向物理 AI 落地能力。
        - id: investors
          label: 未来投资者
          description: 下一次定价事件将验证或重置预期。
      edges:
        - from: nvidia
          to: hark
