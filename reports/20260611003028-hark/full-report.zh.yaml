      - number: '4.4'
        title: 财务结论：收入、毛利和硬件经济性缺口仍阻断承销
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接。Hark 融到了一笔异常巨大的资金，从顶级硬件和 AI
              项目招来人才，并公开承诺搭建一套垂直整合栈；如果跑通，这套栈可能很难复制。悲观情景同样直接。公开证据仍没有显示确认收入、订单、付费用户数、实际定价、硬件
              ASP、BOM、毛利率、质保准备金、烧钱速度或现金跑道。独立报道反复指出，公司很少披露发布市场、目标价格或客户管线；品类历史也提示谨慎：Humane 曾为 AI Pin 融资超过 $230 million，随后
              HP 以 $116 million 收购关键资产，设备也被关闭。Hark 的执行可能远好于此前 AI 硬件尝试，但公开投资人还无法把雄心与经济性分开。正确的财务结论因此不是 Hark
              没有商业模式；而是公开记录主要证明了融资能力和资本需求，同时让收入质量与毛利路径未被验证。尽调应聚焦三座桥：从 beta 需求到经常性软件收入，从定制硬件到正向单位毛利，以及从头条 Series A
              到持久现金充足性。
