      - number: '8.4'
        title: 建议、纪律与尽调要求
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确的投资结论是在当前价格回避。这不是说 Hark 质量低，而是说当前价格已经假设了某种产品市场证明，而公开记录尚未展示这种证明。公司有强投资人、创始人可信度、重算力建设计划，以及如果个人 AI
              硬件突破就可能变得重要的叙事。但价格很重要。以 $6 billion 投后估值计算，Hark 已经高于 Apptronik 据报道的 2026 年估值，也远高于 Agility 的 2026
              年公开区间，同时在客户、定价和商业化上提供的公开证据更少。


              未来估值可能变得可支撑，但只能靠证据或价格变动。最明显的上调因素包括：2026
              年夏季推出后披露的付费采用；证明原生硬件实质改善使用或留存；具名商业设计伙伴；透明的股权结构表，显示优先股堆叠没有吃掉太多下行空间。缺少这些数据时，进入纪律应当严格：不要把宣布的估值承销为公允价值，也不要把品类热情混同于
              Hark 理应高于证据更充分同行交易的证明。正确的近期姿态是继续研究，但在证明改善或价格重置之前，只能站在场边。
