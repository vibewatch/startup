      - number: '4.3'
        title: 资本强度与融资依赖：融资可见，内部现金方程不可见
        blocks:
          - type: paragraph
            body: >-
              Hark 最清晰的财务披露是已融资本和基础设施雄心，而不是运营经济性。Hark Labs Inc. 2026 年 3 月 SEC Form D 显示，发行总额为 $1.0 billion；截至 2026 年 3
              月 10 日首次销售日已售出 $50 million，文件中剩余 $950 million 可供发行，收入区间明确标为「Decline to Disclose」。两个月后，公司宣布完成超额认购的 Series
              A，融资超过 $700 million，投后估值 $6
              billion。这一顺序很关键：公开记录显示融资动能和资产负债表支持，但仍未披露账上现金、月度烧钱速度、现金跑道，或任何债务或项目融资结构。资本强度也比毛利率更容易看见。Hark 3 月发布公告称，一个由数千块
              NVIDIA B200 GPU 组成的大型集群将在 4 月上线；公开 B200 定价代理显示，这些系统价格高、耗电大，并且通常只能通过企业合同或稀缺云容量获得。把这一算力足迹与定制硬件开发配在一起，Hark
              看起来更像一家算力加设备公司，而不是轻量软件创业公司。因此，Series A 看起来不像是给已验证模型的增长资本，更像是训练、工具、硬件和上市前时间所需的前置融资。
            claimRefs:
              - CI012
