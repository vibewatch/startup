evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Named board members, observer rights, broader executive roster, and any formal governance structure for Hark.
    whyItMatters: >-
      A $700M+ Series A normally comes with meaningful governance rights and management depth, both of which affect
      founder concentration risk and control analysis.
    diligencePath: >-
      Request the current board list, governance documents, org chart, and financing term sheet or side-letter summary
      from management.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-and-beta-evidence
    missingEvidence: >-
      Named early-access users, beta partners, letters of intent, or commercial pilot descriptions for the summer-2026
      software release.
    whyItMatters: >-
      Without user evidence, it is impossible to distinguish between a credible pre-launch platform and a highly
      financed concept narrative.
    diligencePath: >-
      Ask for beta pipeline, signed design-partner agreements, product demos, and usage metrics from any closed pilot
      cohort.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: economics-and-pricing
    missingEvidence: >-
      Revenue model, pricing architecture, expected hardware gross-margin structure, and any usage-based software
      economics.
    whyItMatters: >-
      Valuation and capital intensity cannot be underwritten rigorously without a view on how Hark expects to monetize
      software, hardware, or subscriptions.
    diligencePath: >-
      Request internal pricing drafts, model hosting assumptions, device BOM estimates, and early unit-economics
      forecasts.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: minor
    topic: legal-entity-and-address
    missingEvidence: Exact legal entity name, incorporation date, and a published headquarters address for Hark.
    whyItMatters: >-
      The chapter can place Hark in San Jose, but legal diligence and jurisdictional analysis need a filed entity and
      address rather than release datelines.
    diligencePath: Pull Secretary of State filings, cap table paperwork, and company legal docs to confirm entity details.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: hark-som-gap
    missingEvidence: >-
      Hark first buyer segment, pricing model, hardware roadmap, and whether initial commercialization is consumer,
      enterprise, or embodied-control software.
    whyItMatters: >-
      Without those facts the chapter can define the market and size adjacencies, but it cannot produce a credible
      Hark-specific SAM or SOM.
    diligencePath: >-
      Request product roadmap, pricing hypotheses, design-partner list, and any internal segmentation or pilot data from
      management.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: forecast-dispersion
    missingEvidence: Independent reconciliation between bullish long-dated TAM forecasts and cautious near-term production forecasts.
    whyItMatters: >-
      The value of the category depends on whether commercialization bottlenecks are temporary delays or evidence that
      forecasts are structurally too optimistic.
    diligencePath: >-
      Request third-party scenario analysis that normalizes adoption pace, uptime assumptions, and substitute economics
      across Goldman, Gartner, and OEM case studies.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: benchmarking-gap
    missingEvidence: >-
      Independent benchmark comparing humanoids, wheeled polyfunctional robots, and fixed automation on identical
      warehouse and manufacturing tasks.
    whyItMatters: >-
      Without benchmark data it is impossible to say whether humanoids are winning because of real economics or because
      pilots are still promotional and unstandardized.
    diligencePath: >-
      Obtain customer-side benchmarking, integrator tests, or insurer / safety assessments that compare throughput,
      uptime, intervention, and TCO across form factors.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: assistive-tech-robotics-bridge
    missingEvidence: >-
      Public sources connecting WHO assistive-technology need directly to commercially deployed personal robots rather
      than broader device categories.
    whyItMatters: >-
      The adjacency is real, but current public evidence proves need more clearly than it proves monetization for
      personal robotics vendors.
    diligencePath: >-
      Collect public payer programs, care-provider procurement examples, and device-level robotics case studies focused
      on eldercare or independence support.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: hark-pricing-and-customers
    missingEvidence: Named customers, pricing or contract model, and at least one live workflow deployment for Hark.
    whyItMatters: >-
      Without these proofs, Hark cannot be compared cleanly to Figure, Agility, Apptronik, or warehouse substitutes on
      commercial readiness.
    diligencePath: Request customer references, pilot KPIs, pricing sheets, and deployment photos or videos tied to a named workflow.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: hark-product-form-factor
    missingEvidence: >-
      A detailed public or shared-private description of whether Hark is building a humanoid robot, a wearable or
      handheld device, or another physical interface.
    whyItMatters: >-
      The answer changes the correct competitive set and determines whether 1X or warehouse humanoids or consumer-device
      adjacencies matter most.
    diligencePath: Request product architecture, hardware roadmap, and target use-case documentation from the company.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: hark-software-lock-in
    missingEvidence: Evidence that Hark has a control layer, workflow integration stack, or service process comparable to Arc or Orbit.
    whyItMatters: A durable moat is more likely to come from software and integration than from the hardware shell alone.
    diligencePath: >-
      Ask for API docs, systems architecture, and examples of how Hark would integrate with WMS, MES, or
      consumer-service ecosystems.
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: Recognized revenue, ARR, bookings, deferred revenue, and customer concentration metrics.
    whyItMatters: Without top-line and cohort data, funding cannot be translated into revenue quality or commercial traction.
    diligencePath: >-
      Request monthly management P&L, bookings waterfall, deferred revenue rollforward, and top-customer concentration
      schedule.
    relatedQuestionRefs:
      - QI004
      - QI011
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: pricing-gap
    missingEvidence: Current software price book, hardware price targets, contract templates, and discount policy.
    whyItMatters: List pricing and realized pricing drive conversion, gross margin, and revenue-recognition analysis.
    diligencePath: Request current SKU and contract package, including beta terms, enterprise terms, and planned hardware pricing.
    relatedQuestionRefs:
      - QI008
      - QI016
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: margin-gap
    missingEvidence: Hardware BOM, warranty reserve assumptions, compute contracts, and gross margin by product line.
    whyItMatters: >-
      A vertically integrated model-and-device company can destroy value if price realization does not cover compute and
      hardware cost.
    diligencePath: Request BOM, COGS bridge, compute hosting contracts, depreciation policy, and gross-margin dashboard.
    relatedQuestionRefs:
      - QI003
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-gap
    missingEvidence: Cash balance, monthly burn, runway scenarios, and any debt, lease, or supplier-prepayment obligations.
    whyItMatters: Capital adequacy cannot be judged from headline financing alone.
    diligencePath: Request treasury report, monthly cash bridge, debt schedule, lease schedule, and runway model.
    relatedQuestionRefs:
      - QI005
      - QI010
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: commercial-visibility-gap
    missingEvidence: Launch market, preorder funnel, customer pipeline, beta conversion, and paying-user counts.
    whyItMatters: Without early demand metrics, Hark's GTM economics and next-round trigger remain speculative.
    diligencePath: Request beta dashboard, pipeline review, geography plan, and launch KPI pack.
    relatedQuestionRefs:
      - QI002
      - QI022
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: supply-constraint
    missingEvidence: Actual GPU procurement, hosting commitments, utilization plans, and any supply-allocation guarantees.
    whyItMatters: Compute scarcity and power requirements could materially change cash burn and time to launch.
    diligencePath: Request signed GPU, datacenter, and power/cooling agreements plus utilization forecasts.
    relatedQuestionRefs:
      - QI015
      - QI024
    relatedTableRefs:
      - TI003
      - TI004
  - type: missing-source
    severity: material
    topic: device-form-factor
    missingEvidence: >-
      Named device categories, industrial design renders beyond teaser video, launch market, pricing, and manufacturing
      partner details for the first hardware product.
    whyItMatters: >-
      Without form factor, market, and partner disclosure, investors cannot judge ergonomics, channel fit, BOM risk, or
      whether the device concept is closer to earbuds, glasses, a wearable pendant, or something else entirely.
    diligencePath: >-
      Request product requirement docs, EVT/DVT/PVT schedule, BOM ranges, contract manufacturer shortlist, and any
      pre-launch regulatory submissions.
    relatedQuestionRefs:
      - QE020
      - QE026
    relatedTableRefs:
      - TE001
      - TE005
  - type: private-evidence-only
    severity: material
    topic: beta-usage
    missingEvidence: >-
      Beta user counts, usage frequency, retention, task success, and what percentage of the promised workflow is
      currently live in the beta.
    whyItMatters: >-
      A request-access page alone does not prove real usage or that the current software can deliver the cross-service
      assistant workflow implied by marketing and job descriptions.
    diligencePath: >-
      Request beta cohort metrics, task taxonomy, prompt-to-action success rates, and anonymized product analytics for
      active users.
    relatedQuestionRefs:
      - QE001
      - QE026
  - type: missing-source
    severity: material
    topic: trust-artifacts
    missingEvidence: >-
      Public trust center, security architecture, certifications, external audits, status page, SLA terms, or hardware
      safety testing disclosures.
    whyItMatters: >-
      Ambient multimodal systems handling browser sessions, conversations, files, and agentic execution need stronger
      external assurance than a privacy policy and open job requisitions.
    diligencePath: >-
      Request SOC 2 or ISO status, penetration-test reports, incident logs, hardware safety validation, and
      vulnerability disclosure process documents.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: proprietary-model-evidence
    missingEvidence: >-
      Model cards, benchmark results, latency targets, inference split between cloud and device, and direct evidence
