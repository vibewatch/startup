- id: TI004
  title: Capital adequacy table
  columns:
  - metric
  - current value/status
  - source-backed implication
  - diligence ask
  rows:
  - - Cash on hand
    - 'null'
    - Public sources do not disclose current cash balance
    - Provide latest cash, cash equivalents, restricted cash, and post-close proceeds actually received.
  - - Monthly burn
    - 'null'
    - No public burn figure, despite obvious compute, hiring, and hardware spend requirements
    - Provide last six months of net burn and expected burn after product launch.
  - - Runway months
    - 'null'
    - Runway cannot be derived without cash and burn disclosures
    - Provide base, downside, and upside runway model.
  - - Founder seed capital
    - TechCrunch says Brett Adcock seeded Hark with $100M in late 2025
    - Shows significant pre-Series-A capital support before external revenue proof
    - Provide capitalization table and whether seed capital remains as cash or funded early capex.
  - - Form D authorized offering
    - SEC Form D listed a $1.0B total offering amount on 2026-03-24
    - Shows financing dependency exceeded a conventional seed/Series A scale even before the May round announcement
    - Provide full closing schedule and whether the filing covered the same Series A or parallel securities.
  - - Form D amount sold by 2026-03-10
    - $50M sold; $950M remaining; two investors
    - Shows only a fraction of the filed amount had sold by the first-sale date, implying financing was still in progress
    - Provide tranche-by-tranche close dates and investor-level proceeds received.
  - - Series A disclosed on 2026-05-21
    - Over $700M at $6B post-money valuation, oversubscribed
    - Demonstrates strong financing access but not revenue quality or self-funded cash generation
    - Provide liquidation preferences, pro rata rights, milestone covenants, and board terms.
  - - Planned use of funds
    - Recruiting, compute/components, models, and next-generation hardware
    - Proceeds appear earmarked for capital-intensive buildout rather than pure go-to-market scaling
    - Provide use-of-proceeds budget across R&D, hardware, compute, and commercial launch.
  - - Next-round trigger
    - Not publicly disclosed
    - Public sources do not identify a revenue, usage, or hardware milestone for the next financing event
    - Provide internal financing plan and minimum metrics required to raise next capital.
  - - Debt / project finance obligations
    - No public debt disclosed; infrastructure commitments remain opaque
    - A B200 cluster and hardware program may involve prepayments, leases, or hosting commitments that are not yet public
    - Provide all debt, lease, supply, hosting, and project-finance obligations.
  notes: Funding chronology is reduced to the financing facts needed for forward adequacy, not a full historical round list. Null means the metric is not publicly disclosed.
