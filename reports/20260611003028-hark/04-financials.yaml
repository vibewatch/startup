  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: Recognized revenue, ARR, bookings, deferred revenue, and customer concentration metrics.
    whyItMatters: Without top-line and cohort data, funding cannot be translated into revenue quality or commercial traction.
    diligencePath: Request monthly management P&L, bookings waterfall, deferred revenue rollforward, and top-customer concentration schedule.
    relatedQuestionRefs:
    - QI004
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: pricing-gap
    missingEvidence: Current software price book, hardware price targets, contract templates, and discount policy.
    whyItMatters: List pricing and realized pricing drive conversion, gross margin, and revenue-recognition analysis.
    diligencePath: Request current SKU and contract package, including beta terms, enterprise terms, and planned hardware pricing.
    relatedQuestionRefs:
    - QI008
    - QI016
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: margin-gap
    missingEvidence: Hardware BOM, warranty reserve assumptions, compute contracts, and gross margin by product line.
    whyItMatters: A vertically integrated model-and-device company can destroy value if price realization does not cover compute and hardware cost.
    diligencePath: Request BOM, COGS bridge, compute hosting contracts, depreciation policy, and gross-margin dashboard.
    relatedQuestionRefs:
    - QI003
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-gap
    missingEvidence: Cash balance, monthly burn, runway scenarios, and any debt, lease, or supplier-prepayment obligations.
    whyItMatters: Capital adequacy cannot be judged from headline financing alone.
    diligencePath: Request treasury report, monthly cash bridge, debt schedule, lease schedule, and runway model.
    relatedQuestionRefs:
    - QI005
    - QI010
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: commercial-visibility-gap
    missingEvidence: Launch market, preorder funnel, customer pipeline, beta conversion, and paying-user counts.
    whyItMatters: Without early demand metrics, Hark's GTM economics and next-round trigger remain speculative.
    diligencePath: Request beta dashboard, pipeline review, geography plan, and launch KPI pack.
    relatedQuestionRefs:
    - QI002
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: supply-constraint
    missingEvidence: Actual GPU procurement, hosting commitments, utilization plans, and any supply-allocation guarantees.
    whyItMatters: Compute scarcity and power requirements could materially change cash burn and time to launch.
    diligencePath: Request signed GPU, datacenter, and power/cooling agreements plus utilization forecasts.
    relatedQuestionRefs:
    - QI015
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
