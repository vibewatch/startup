- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Recognized revenue, ARR, and bookings
    - Impossible to separate financing momentum from actual commercial traction
    - Request monthly management accounts, revenue recognition policy, bookings waterfall, and deferred revenue detail.
  - - Paying user and customer counts
    - Prevents CAC, pipeline conversion, and concentration analysis
    - Request cohort file with beta users, paying users, enterprise pilots, and churn.
  - - List pricing, discounts, and contract structure
    - Blocks any realized-price or revenue-quality analysis
    - Request current price book, signed order forms, discount policy, and partner resale terms.
  - - Hardware ASP, BOM, warranty reserves, and return assumptions
    - Blocks hardware gross-margin modeling and working-capital analysis
    - Request BOM, target ASP, warranty accrual, return reserve, and inventory plan by SKU.
  - - Compute contract terms and utilization
    - Blocks training/inference cost allocation and capex-versus-opex assessment
    - Request GPU procurement, hosting, depreciation, utilization, and power/cooling contracts.
  - - Cash balance, burn, and runway
    - Prevents solvency and financing-dependency underwriting
    - Request monthly cash bridge, board burn package, and runway scenario model.
  - - Debt, leases, supply prepayments, or project-finance obligations
    - Could materially change effective runway and dilution needs
    - Request all debt schedules, lease schedules, and supplier commitment letters.
  - - Launch pricing, launch market, and customer pipeline
    - Prevents a credible first-year revenue forecast
    - Request launch plan, geography, channel mix, preorder or waitlist conversion, and pipeline review.
  notes: Each row is a blocker where the public record stops before a core underwriting input is available.
  enumerationScope:
    coverage: partial
    basis: Rows cover the highest-impact missing financial disclosures needed to underwrite Hark from public evidence as of the run date.
