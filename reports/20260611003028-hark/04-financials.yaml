chapter:
  number: 4
  title: Financials
  summary: 'Hark has raised extraordinary capital and disclosed unusually explicit compute ambition for such an early company, but the public record still stops short of investable financial transparency. Official and filing evidence shows a $1.0 billion Form D, an over-$700 million Series A at a $6 billion valuation, and a strategy built around in-house models plus custom hardware. What remains missing is decisive: revenue, pricing, customer counts, gross margin, burn, runway, and hardware economics are still undisclosed.'
sections:
- id: revenue-visibility
  title: 'Revenue model visibility: product surfaces are public, monetization is not'
  body: 'Hark has made the product architecture legible before it has made the business model legible. Official materials consistently describe a vertically integrated personal-AI platform that combines multimodal models, persistent memory, and bespoke hardware, and the homepage says the company is already reviewing applications for beta access. The privacy policy is also financially revealing in a narrow way: it references websites, apps, products and services, payment card information, transaction history, sandbox task execution, and a browser operator that can act across third-party pages. Those disclosures show that Hark expects commercial workflows involving accounts, transactions, and service usage. What they do not show is a public price list, subscription tier, API tariff, hardware price, or accounting treatment for any future bookings. The result is an unusual mix of visibility and opacity: the company is clear that it wants to monetize software and hardware together, but there
    is still no public evidence for realized revenue, customer counts, conversion, or any distinction between prospective demand and recognized revenue. For underwriting purposes, funding announcements therefore cannot substitute for top-line proof.'
