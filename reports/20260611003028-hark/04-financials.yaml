  - diligence ask
  rows:
  - - Recognized revenue / ARR
    - 'null'
    - Low
    - Top-line proof is the core missing input for any underwriting model
    - Provide monthly recognized revenue, ARR, bookings, and deferred revenue bridge.
  - - Paying customers / paid accounts
    - 'null'
    - Low
    - Customer count is needed to judge launch traction and revenue concentration
    - Provide active users, paying accounts, pipeline, and concentration by customer type.
  - - Hardware ASP
    - 'null'
    - Low
    - ASP determines whether custom hardware can cover BOM, warranty, and support cost
    - Provide target ASP by device, financing terms, and expected attachment to software plans.
  - - Gross margin
    - 'null'
    - Low
    - Margin path is the key question for a compute-heavy, hardware-linked model
    - Provide gross margin by software, hardware, and blended company basis.
  - - Compute cost proxy
    - Thousands of B200 GPUs; public B200 MSRP proxy ~$30k-$40k each and 1000W power draw
    - Medium
    - Shows training and inference economics are likely material even before customer support or hardware COGS
    - Provide actual GPU procurement or hosting contracts, depreciation policy, and utilization.
  - - Cloud B200 proxy
    - Public hourly B200 price examples span roughly $2.80-$27.04 per GPU-hour
    - Medium
    - Useful for bounding inference/training opex where Hark discloses no internal cost data
    - Provide actual blended cost per training hour, inference hour, and token or request.
  - - Headcount proxy
    - '>45 team members in March; ~70 employees by May'
    - Medium
    - Payroll is likely a major burn driver while revenue is still undisclosed
    - Provide fully loaded payroll, stock comp, and hiring plan by function.
  - - Public financing visibility
    - Form D total offering $1.0B; >$700M Series A disclosed by May
    - High
    - Capital raised is the clearest public input into runway estimation, even though cash burn remains private
    - Provide close schedule, cash balance, restricted cash, and financing costs.
  notes: Null means no public company-specific disclosure was found. Non-null numeric ranges are explicit proxies from public sources and should not be mistaken for Hark reported unit economics.
