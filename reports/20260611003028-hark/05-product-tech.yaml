chapter:
  number: 5
  title: Product & Technology
  summary: Hark’s public record supports a real full-stack product ambition—multimodal models, tool use,
    privacy controls, and AI-native hardware—but not yet a fully specified shipped device. The strongest
    evidence comes from legal and hiring surfaces, which make the software runtime, training stack, and
    hardware org design more concrete than the actual product specs, leaving readiness, reliability, and
    trust assurance materially under-disclosed.
sections:
- id: product-definition-and-current-workflow
  title: Product definition and current workflow
  body: 'Hark’s public narrative is unusually clear on ambition and unusually thin on shipped specifics.
    The company says it is building “advanced personal intelligence” that combines multimodal models,
    persistent memory, and bespoke hardware into a universal interface, and the official site says the
    platform is entering beta. The strongest evidence for what exists today is not a product tour or pricing
    page; it is the combination of the homepage, fundraising post, privacy policy, and integration-oriented
    hiring. Together they imply a workflow in which a user gives Hark chat, voice, or file inputs, Hark
    carries that context into agentic sessions, and the system eventually acts across external tools and
    services on the user’s behalf.


    That is materially different from a conventional chatbot, but it is not the same thing as a publicly
    documented commercial product. Public sources do not disclose device form factor, supported channels,
    or named production customers, and the official beta page is still just a request-access funnel. The
    result is a product story that is strongest in customer-job language—offload digital tasks, manage
    context, and act proactively—while remaining weak on the operational details that would tell a buyer
    or investor exactly what can be used today versus what is promised for later hardware releases.'
