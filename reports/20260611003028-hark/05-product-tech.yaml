- id: architecture-training-and-dependencies
  title: Architecture, training, and critical dependencies
  body: 'The most concrete product-and-technology evidence comes from legal and recruiting surfaces. Hark’s
    privacy policy describes a system that can accept multimodal inputs, work with third-party apps, operate
    a browser extension inside existing sessions, and run agentic tasks in isolated sandboxes. The job
    board sharpens that picture: Hark is staffing pretraining, multimodal speech and vision, post-train
    and RL work, large-scale training infrastructure, integrations, embedded software, audio firmware,
    privacy engineering, and AI safety. That combination implies a vertically integrated architecture
    with four visible layers: model training and data pipelines; an agent runtime and connectors layer;
    an embedded device stack for AI-native hardware; and a trust-and-safety control plane.


    Public evidence also reveals the main dependencies. Hark’s infrastructure roles point to 10,000-plus
    GPU ambitions and the fundraising materials say it has secured B200 capacity, so compute access is
    a first-order dependency. Connector breadth is another: the product becomes meaningfully useful only
    if Hark can make tool-use safe, fast, and reliable across email, calendars, browsers, and third-party
    APIs. Finally, the hardware side depends on NPI discipline, contract manufacturing, reliability testing,
    and power- and latency-aware OS design. These dependencies are visible enough to map, but not yet
    visible enough to underwrite as solved.'
