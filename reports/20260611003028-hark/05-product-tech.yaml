- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Hark solution
  - Measurable benefit
  - Limitation
  rows:
  - - Offload recurring digital admin
    - User asks through chat, voice, or files
    - Hark frames itself as an agentic assistant with memory and proactive behavior
    - Potentially reduces mental workload and context switching, per company positioning
    - No public proof yet of task success rates or saved time
  - - Work across existing tools
    - Browser sessions, apps, and third-party services stay fragmented
    - Integration layer is meant to connect email, calendar, productivity, communication, and developer
      tools
    - Broader action surface than a standalone chat box
    - Supported services and permission granularity are not public
  - - Let AI act in the browser
    - User remains logged into local services
    - Browser Operator and sandbox execution imply task delegation inside real sessions
    - Could enable practical automation without rebuilding user workflows from scratch
    - Ambient privacy and failure-handling controls remain undisclosed
  - - Use multimodal interaction
    - Voice, text, files, and visual context are separate today
    - Hark says its models combine speech, text, vision, and contextual awareness
    - More natural interface if latency and reliability are good enough
    - No model card or latency disclosure yet
  - - Move from software to device-native access
    - Current AI mostly lives inside phones and chat apps
    - Hark promises AI-native hardware designed with its models from the start
    - Could create tighter, lower-friction interaction loops than retrofitted devices
    - No hardware form factor, ergonomics, or distribution plan is public
  - - Operate with privacy and safety controls
    - Agentic systems create data-handling and abuse risk
    - Privacy and safety roles plus policy point to deletion, moderation, and incident workflows
    - Necessary foundation for a trusted universal interface
    - No external assurance artifacts are public
  notes: Benefits remain source-backed directional claims, not verified ROI or user-adoption metrics.
