  evidenceGaps:
  - type: missing-source
    severity: material
    topic: device-form-factor
    missingEvidence: Named device categories, industrial design renders beyond teaser video, launch market,
      pricing, and manufacturing partner details for the first hardware product.
    whyItMatters: Without form factor, market, and partner disclosure, investors cannot judge ergonomics,
      channel fit, BOM risk, or whether the device concept is closer to earbuds, glasses, a wearable pendant,
      or something else entirely.
    diligencePath: Request product requirement docs, EVT/DVT/PVT schedule, BOM ranges, contract manufacturer
      shortlist, and any pre-launch regulatory submissions.
    relatedQuestionRefs:
    - QE020
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: beta-usage
    missingEvidence: Beta user counts, usage frequency, retention, task success, and what percentage of
      the promised workflow is currently live in the beta.
    whyItMatters: A request-access page alone does not prove real usage or that the current software can
      deliver the cross-service assistant workflow implied by marketing and job descriptions.
    diligencePath: Request beta cohort metrics, task taxonomy, prompt-to-action success rates, and anonymized
      product analytics for active users.
    relatedQuestionRefs:
    - QE001
    - QE026
  - type: missing-source
    severity: material
    topic: trust-artifacts
    missingEvidence: Public trust center, security architecture, certifications, external audits, status
      page, SLA terms, or hardware safety testing disclosures.
    whyItMatters: Ambient multimodal systems handling browser sessions, conversations, files, and agentic
      execution need stronger external assurance than a privacy policy and open job requisitions.
    diligencePath: Request SOC 2 or ISO status, penetration-test reports, incident logs, hardware safety
      validation, and vulnerability disclosure process documents.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: proprietary-model-evidence
    missingEvidence: Model cards, benchmark results, latency targets, inference split between cloud and
      device, and direct evidence that Hark already has proprietary models in production quality.
    whyItMatters: Public hiring and fundraising language support ambition, but they do not prove technical
      differentiation or that proprietary models are already outperforming commodity alternatives.
    diligencePath: Request benchmark decks, architecture reviews, model ownership map, training datasets,
      and side-by-side comparisons versus third-party baselines.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: manufacturing-readiness
    missingEvidence: Named manufacturing partners, field-test program details, reliability metrics, and
      factory validation data for the first hardware platform.
    whyItMatters: The hiring signal is consistent with serious hardware effort, but it does not prove
      that Hark has solved the transition from architecture to repeatable high-volume production.
    diligencePath: Request CM agreements, FATP plans, HALT or HASS results, DFM reviews, and early-unit
      failure analysis from prototype builds.
    relatedQuestionRefs:
    - QE020
    - QE026
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: minor
    topic: figure-transfer-boundary
    missingEvidence: A clear statement about whether Hark shares data, personnel allocation, vendor relationships,
      or intellectual property with Figure.
    whyItMatters: Founder overlap makes the relationship strategically important, but the absence of a
      disclosed boundary keeps it ambiguous whether Hark merely inherits philosophy or also benefits from
      deeper technical spillovers.
    diligencePath: Ask management for governance, IP-assignment, shared-services, and conflict-management
      documents across Hark and Figure.
    relatedQuestionRefs:
    - QE018
