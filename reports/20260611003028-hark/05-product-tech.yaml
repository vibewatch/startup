- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Data curation and synthetic-data loop
    - Filters, deduplicates, and augments multimodal training corpora
    - Depends on data rights, labeling discipline, and quality controls
    - Public evidence says this exists, but not whether the data moat is proprietary or durable
  - - Foundation-model pretraining stack
    - Builds core text, audio, and vision model capability
    - Depends on distributed training frameworks, benchmarks, and experimentation speed
    - No direct benchmark or model-card disclosure
  - - Large-scale GPU infrastructure
    - Runs pretraining and later inference workloads
    - Depends on B200 supply, cluster reliability, network fabric, and SLO discipline
    - Compute concentration and cost are material dependencies
  - - Agent runtime and sandboxes
    - Executes delegated tasks, files, and shell-level workflows
    - Depends on robust isolation, logging, rollback, and abuse detection
    - A weak sandbox would create severe security and trust risk
  - - Connectors and tool protocols
    - Maps external services into callable schemas and actions
    - Depends on OAuth, webhooks, API normalization, and partner uptime
    - Schema drift, auth expiry, and flaky third-party APIs can break the product
  - - Embedded OS and device stack
    - Coordinates BSP, kernel, middleware, apps, OTA, and audio subsystems
    - Depends on silicon selection, power management, secure boot, and hardware/software co-design
    - Public evidence is staffing-led, not product-led, so readiness remains uncertain
  - - Manufacturing and factory test
    - Translates prototypes into repeatable shipped devices
    - Depends on contract manufacturers, reliability testing, and line validation
    - No public evidence yet of DVT/PVT completion or field reliability
  - - Privacy and safety control plane
    - Handles deletion, consent, moderation, and incident response
    - Depends on legal interpretation, policy tooling, and production observability
    - Control failures would be existential for an ambient assistant product
  notes: This table reconstructs the public stack from legal pages, fundraising posts, and developer-signal
    sources; it is not an internal Hark architecture diagram.
