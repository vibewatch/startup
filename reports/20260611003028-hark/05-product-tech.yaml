tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Personal AI platform beta
    - Early users / waitlist applicants
    - Beta access open; production scope undisclosed
    - Promises proactive personal intelligence rather than a narrow chatbot
    - Need live beta feature list, user counts, and task-success metrics
  - - Omni multimodal foundation models
    - End users through Hark experiences
    - Planned for summer 2026; no public model card
    - Text, audio, and vision are staffed together with pretraining and post-train roles
    - Need benchmarks, latency targets, ownership map, and inference split
  - - Agent runtime and computer-use layer
    - Users delegating digital tasks
    - Partially evidenced through privacy and integrations surfaces
    - Sandboxed execution, browser operator, and tool schemas suggest real action-taking ambitions
    - Need supported tools, permission model, rollback controls, and failure rates
  - - Integrations and connectors layer
    - Users connecting existing services
    - Strong hiring evidence; public product documentation sparse
    - Email, calendar, productivity, developer tools, MCP, OAuth, and webhook support are explicitly staffed
    - Need connector roster, API docs, auth scopes, and rate-limit handling
  - - AI-native hardware devices
    - Future device buyers
    - Publicly promised; no form factor disclosed
    - Hardware is being co-designed with models and OS stack rather than added later
    - Need device category, BOM range, launch market, and EVT/DVT timing
  - - Embedded OS and audio platform
    - Hardware / firmware teams
    - Staffing strongly evidenced
    - AI-first OS architecture, OTA, secure boot, DSP, microphones, speakers, and always-on listening
      are visible in roles
    - Need board architecture, SoC choice, battery targets, and thermal envelope
  - - Privacy and safety control plane
    - Users, regulators, and internal ops
    - Operational intent evidenced; external assurance thin
    - Dedicated privacy and safety engineering roles match policy language on deletion and moderation
    - Need audits, certifications, status reporting, and incident history
  notes: Maturity labels reflect what the retained public evidence supports, not Hark’s internal roadmap
    confidence.
