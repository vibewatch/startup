- id: trust-safety-and-disclosure-gaps
  title: Trust, safety, and disclosure gaps
  body: 'Hark deserves credit for having more trust-and-safety signal than many stealth hardware narratives.
    The privacy policy is substantive, not a stub, and it addresses sandbox execution, browser-operator
    behavior, connectors, deletion rights, and the use of third-party AI providers. The privacy and safety
    job descriptions also suggest the company expects real operational burdens around data deletion, de-identification,
    moderation classifiers, production monitoring, and incident response. Those are meaningful product
    signals because a universal interface that reads pages, executes tasks, and remembers user context
    will fail commercially without them.


    But the public trust package is still incomplete. There is no retained trust center, status page,
    certification list, hardware safety report, public SLA, or independent reliability evidence. The same
    tension exists on the product side more broadly: Hark has clearly staffed for an ambitious multimodal,
    agentic, hardware-software platform, yet the public record still lacks model cards, benchmarks, device
    specs, beta usage metrics, and manufacturing details. For diligence purposes, that means the core
    underwriting conclusion is positive on architectural seriousness and negative on public proof of readiness.
    Hark may well be building the stack it describes; the problem is that outside observers still cannot
    see enough to verify how far along it really is.'
