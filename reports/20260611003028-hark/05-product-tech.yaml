- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality area
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy
    - Public and substantive
    - Covers accounts, prompts, outputs, sandbox execution, browser operator, connectors, and rights requests
    - Does not replace a trust center, audit package, or system-architecture disclosure
  - - Deletion / DSAR / de-identification infrastructure
    - Actively staffed
    - Privacy Engineer role says Hark plans DSAR, deletion, retention, tokenization, and de-identification
      systems
    - No public evidence yet that the stack is live or audited
  - - Safety classifiers and incident response
    - Actively staffed
    - AI Safety role says Hark plans moderation classifiers, production monitoring, and abuse mitigation
    - No public safety taxonomy, abuse-reporting transparency, or model guardrail metrics
  - - Browser-session handling
    - Partially disclosed
    - Policy says Hark can read authorized pages and does not store login credentials
    - No public detail on credential delegation, secrets storage, or browser-extension review status
  - - Secure boot / OTA / provisioning
    - Implied by hardware roles
    - OS architecture role references secure boot chains, OTA updates, and production provisioning
    - No public device-security white paper or update policy
  - - External assurance artifacts
    - Not publicly visible in retained sources
    - No retained status page, certification list, SLA, or hardware safety documentation
    - High-priority diligence request before underwriting broad consumer deployment
  notes: Rows separate controls that are directly evidenced from controls that are only implied by staffing
    and therefore still need third-party assurance.
