  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-bench
    missingEvidence: Named executives beyond Adcock and Chowdhury, board composition, founder time-allocation, and succession planning.
    whyItMatters: Founder concentration is currently underwritten more by reputation than by independently visible governance depth.
    diligencePath: Request org chart, board deck, founder time-allocation plan, and key-hire scorecard for hardware, safety, legal, and go-to-market functions.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: blocking
    topic: device-manufacturing-and-certification
    missingEvidence: Manufacturing partners, component vendors, certification plan, reliability testing results, and field-failure metrics for AI-native devices.
    whyItMatters: The biggest operational risk is hardware launch and scale; without build, test, and certification evidence, the market is underwriting a concept rather than an execution system.
    diligencePath: Obtain contract manufacturer list, EVT/DVT/PVT schedule, certification roadmap, reliability dashboards, and initial BOM and gross-margin assumptions.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: model-safety-and-audit
    missingEvidence: Red-team results, incident response playbooks, model-evaluation metrics, human escalation boundaries, and any external privacy or safety audits.
    whyItMatters: Hark wants persistent memory, proactive behavior, and agentic execution; absent audit evidence, privacy and safety controls remain asserted rather than demonstrated.
    diligencePath: Request safety case, red-team summaries, incident taxonomy, secure-development controls, and evidence of independent privacy review before launch.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: Named pilots, paid users, pricing, retention, waitlist quality, and any early conversion or usage data.
    whyItMatters: A $6 billion valuation with no public customer proof creates asymmetric downside if launch excitement does not translate into adoption.
    diligencePath: Ask for pipeline funnel, beta waitlist quality, pilot contracts, pricing tests, and post-launch activation targets tied to financing milestones.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: risk-register-coverage
    missingEvidence: Jurisdiction-by-jurisdiction map of privacy, product-liability, export-control, and workplace-safety obligations for all planned markets.
    whyItMatters: The legal register below captures the highest-severity items, but it is not an exhaustive multi-jurisdiction legal memo.
    diligencePath: Commission launch-market legal memo covering U.S., EU, and priority APAC obligations before broad device distribution.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
