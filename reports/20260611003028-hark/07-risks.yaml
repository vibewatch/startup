- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Product-proof gap
    - Launch slips, early-access conversion is weak, or management still cannot disclose meaningful user activation
    - Any material delay beyond the promised 2026 software window or no credible early adoption signal after launch
    - Treat the $6B mark as founder-premium only and pause further underwriting until usage proof appears
  - - Privacy / biometric / agentic-control failure
    - Regulator inquiry, security incident, bystander-capture controversy, or leaked unsafe behavior
    - Any confirmed privacy incident involving persistent memory, biometric handling, or unauthorized task execution
    - Re-rate Hark as a higher-regulation asset and require independent safety review before supporting more capital
  - - Hardware and supply-chain execution
    - Certification slip, low device reliability, or visible component bottleneck
    - Repeated hardware launch delays, failed qualification milestones, or unresolved critical component shortages
    - Cut launch assumptions, extend burn analysis, and test whether the business becomes capital-inefficient
  - - Founder concentration and reputation spillover
    - New Figure controversy, governance stress, or visible founder overextension
    - Another material transparency dispute or evidence that Adcock bandwidth is constraining Hark execution
    - Escalate board and delegation diligence; do not assume founder reputation still offsets proof gaps
  - - Valuation reset / capital intensity
    - Next financing or secondary signal clears well below current expectations
    - A price-setting event or term sheet that materially undercuts the current valuation narrative
    - Rebuild dilution, recruiting, and return assumptions from the new clearing price rather than the headline Series A story
  notes: These kill criteria are intentionally observable. Hark can still de-risk quickly, but only if launch evidence starts replacing reputation and capital as the main support for the story.
