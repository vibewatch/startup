tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / Case / Obligation
  - Jurisdiction
  - Current Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - Biometric, image, voice, and persistent-memory privacy obligations
    - U.S. states; EU-linked use cases
    - Hark policy already contemplates biometric treatment and consent requirements
    - Medium-High
    - High
    - Policy language acknowledges biometric consent, retention, and destruction duties
    - Public controls are descriptive, but no external audit or production evidence shows how those duties are operationalized in a shipped product
    - Request biometric data-flow map, consent UX, retention schedule, deletion workflow, and jurisdiction-by-jurisdiction launch memo
  - - California privacy, risk-assessment, and ADMT rules
    - California
    - CPPA rules effective 2026-01-01; risk-assessment requirements begin in 2026 and ADMT obligations begin in 2027
    - Medium
    - High
    - Hark already maintains a detailed privacy policy and can design toward compliance before broad launch
    - Any proactive assistant making meaningful recommendations can attract scrutiny if notices, risk assessments, or opt-out mechanics are weak
    - Obtain counsel memo mapping current product plans to CPPA risk-assessment and ADMT requirements
  - - Agentic-AI secure deployment expectations
    - U.S. federal / enterprise security
    - CISA and related guidance emphasize careful adoption, secure deployment, and secure-by-design controls for agentic systems
    - Medium
    - High
    - Hark can still build launch processes before scale if it prioritizes security engineering early
    - A personal assistant that can execute tasks, access third-party apps, and store persistent context creates high trust sensitivity if permissions or boundaries fail
    - Review threat model, privilege model, red-team results, human override design, and vendor-management controls
  - - Advanced-chip export-control and due-diligence rules
    - U.S. export-control regime
    - BIS updated advanced-computing guidance again in 2026 and extended IC designer timelines through year-end
    - Medium
    - Medium-High
    - Hark has already secured compute access and can use established vendors
    - A fast-changing chip policy regime can slow procurement, compliance, and global supply options for model training or future device roadmaps
    - Request chip sourcing plan, export-control compliance ownership, and contingency plan for constrained supply
  - - Product liability and youth-safety scrutiny for always-on AI devices
    - U.S. consumer and product-liability environment
    - No public launch litigation exists yet, but Hark targets proactive devices while stating services are not directed to children under 18
    - Medium
    - High
    - Pre-launch stage leaves room to tighten disclosures, age gating, and safety boundaries
    - Always-on devices that perceive environments and act on behalf of users can create outsized liability if misuse, bystander capture, or unsafe automation emerges
    - Review age-gating, testing protocol, incident response, insurance coverage, and product-liability assumptions before consumer release
  notes: Rows are ordered by residual severity based on the public evidence set available on 2026-06-11. This is a partial register focused on the highest-priority issues rather than an exhaustive launch-market legal memo.
  enumerationScope:
    coverage: partial
    basis: Register covers the five highest-severity legal and regulatory exposures surfaced in reviewed Hark policy, regulatory, security-guidance, and capital-markets materials; it is not a full multi-jurisdiction legal opinion.
