- id: hardware-manufacturing-and-supply-chain-risk
  title: Hardware, Manufacturing, and Supply-Chain Execution Risk
  body: 'Hark is not just shipping software. Its own materials say the product depends on tightly coupled models, devices, and an always-available personal interface. That multiplies execution burden. The company has recruited experienced hardware operators and signed for substantial compute, but it has not publicly disclosed manufacturing partners, certification pathways, reliability data, or component sourcing strategy beyond Nvidia. The broader market evidence is cautionary. Figure''s own BMW disclosure still highlighted a top hardware failure point after meaningful runtime, while BMW described its German deployment as a pilot, not a mature scaled program. Independent research from MIT Technology Review, Berkeley, Bain, McKinsey, and TechCrunch all converges on the same message: humanoid and physical-AI systems still face hard bottlenecks in dexterity, batteries, uptime, safety, supervision, and supplier readiness. Hark is therefore trying to launch into the hardest part of the curve, not the easy one.'
