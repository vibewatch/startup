company:
  name: Hark
chapter:
  number: 7
  title: Risks
  summary: 'Hark''s biggest risks are not subtle: the company is trying to compress a difficult hardware-and-robotics execution curve into a $6 billion valuation before public customer proof exists. The evidence supports meaningful founder concentration around Brett Adcock, heavy dependence on undeclared manufacturing and compute partners, broad privacy and biometric exposure from a persistent-memory product vision, and real downside precedent from robotics skepticism and failed AI-device launches. Capital and talent mitigate some of that risk, but residual exposure stays high until Hark clears launch, safety, and commercial adoption milestones with observable evidence.'
sections:
- id: founder-concentration-and-proof-gap
  title: Founder Concentration, Product-Proof Gap, and Expectation Risk
  body: 'The current Hark case is still more founder-and-thesis than product-and-proof. Official materials show an unusually ambitious plan: vertically integrated models, software, and bespoke hardware; thousands of Nvidia B200 GPUs; and a software launch in summer 2026 with hardware shortly after. The company also raised more than $700 million at a $6 billion post-money valuation. But that capital sits on top of a thin public operating record. The reviewed materials still do not disclose named customers, pricing, revenue, or retention evidence, and TechCrunch explicitly noted how little Hark had revealed. That leaves Brett Adcock as the central underwriting object. Public sources also show that Adcock remains deeply associated with Figure and maintains other active ventures, so any distraction, credibility hit, or timeline miss can transmit into Hark before customer proof replaces founder brand as the primary support for the valuation.'
