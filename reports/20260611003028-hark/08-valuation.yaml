- id: comparable-benchmarks
  title: Comparable rounds argue that Hark is priced ahead of better-evidenced peers
  body: 'The cleanest way to test Hark’s $6 billion price is against recent robotics rounds and transactions where the public record contains more than a fundraising headline. Figure gives two anchors: $2.6 billion in February 2024 with Microsoft, Nvidia, OpenAI, and Bezos involved, and then $39 billion in September 2025 after it had moved much further on disclosed software and production proof. Figure’s BMW deployment later showed measurable active-line runtime, parts moved, and vehicles touched. Apptronik is the closest lower bound for a high-credibility humanoid startup in 2026: the company had Mercedes-Benz, GXO, DeepMind adjacency, and almost $1 billion of funding before TechCrunch reported a roughly $5.3 billion mark. Agility is even cheaper at around $2.1 billion to $2.15 billion in public 2026 references, yet it already has a multi-year GXO agreement and a clearer logistics workflow.


    Hark therefore lands in an awkward relative position. It is more expensive than Apptronik and far more expensive than Agility and Boston Dynamics’ disclosed M&A benchmark, despite disclosing less commercial proof than any of them. The only comps clearly above Hark are Figure’s late-2025 leader valuation and 1X’s reported $10 billion fundraising target, but those are not strong defenses of today’s price. Figure’s higher mark comes with far more evidence; 1X’s higher mark was a reported target, not a closed round. This leaves Hark looking more like a premium-priced option on future category leadership than a price already validated by public operating evidence.'
