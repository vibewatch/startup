  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: capital-structure-terms
    missingEvidence: Final Series A term sheet showing liquidation preferences, anti-dilution, option-pool treatment, and any secondary allocations.
    whyItMatters: Without the economic terms, investors cannot quantify preference overhang or downside protection ahead of common equity.
    diligencePath: Request the final financing documents and cap-table bridge from company counsel and the lead investor.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: independent-valuation-marks
    missingEvidence: Secondary trades, investor letters, or independent valuation memos corroborating the announced $6B mark.
    whyItMatters: A single financing headline can overstate where the market would actually clear a broader set of shares.
    diligencePath: Ask the lead investor for internal memos or LP materials and review any brokered secondary indications.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: paid-adoption
    missingEvidence: Paid-user counts, conversion, churn, retention, and customer concentration from the promised 2026 rollout.
    whyItMatters: The valuation argument cannot move from narrative to underwriting without real willingness-to-pay data.
    diligencePath: Request product analytics, payment data, and cohort reports after launch.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: material
    topic: hardware-unit-economics
    missingEvidence: Device BOM, warranty reserves, support costs, and gross-margin bridge between hardware and software.
    whyItMatters: Native hardware could create a moat or could simply absorb capital; the current public record does not resolve which.
    diligencePath: Review supplier quotes, manufacturing plans, and CFO model outputs.
    relatedQuestionRefs:
    - QV019
    - QV026
  - type: missing-source
    severity: material
    topic: named-customers
    missingEvidence: Signed enterprise or channel agreements and any paid design-partner contracts.
    whyItMatters: Named counterparties would materially improve confidence that the product solves a real workflow rather than merely attracting attention.
    diligencePath: Customer-reference calls and review of signed commercial agreements.
    relatedQuestionRefs:
    - QV004
    - QV030
  - type: stale
    severity: minor
    topic: peer-private-valuations
    missingEvidence: Fresh official filings or company confirmations for 1X and Agility beyond reported or secondary references.
    whyItMatters: Some of the peer valuation anchors used here rely on well-attributed reports and secondary valuation references instead of final company disclosures.
    diligencePath: Refresh peer comp sourcing on the next run and favor closed rounds or company-confirmed marks.
    relatedQuestionRefs:
    - QV010
    - QV011
    relatedTableRefs:
    - TV004
