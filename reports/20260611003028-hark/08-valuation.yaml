- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Launch timing slips
    - No meaningful public rollout of the promised summer 2026 models by Q4 2026
    - Undercuts the core execution case behind paying a premium valuation before revenue proof exists
    - Hard no-buy; move fair value closer to bear range
  - - Paid adoption missing
    - No disclosed paying users, customer logos, or monetization proof within two quarters of launch
    - Turns the current price into a pure narrative bet rather than a product-market fit bet
    - Maintain avoid; require price reset or data-room proof
  - - Hardware moat absent
    - Native hardware appears optional or undifferentiated versus software-only access
    - Removes the main argument for a premium multiple versus pure-model or app competitors
    - Mark valuation down toward software-only or failed-device precedents
  - - Category correction
    - Humanoid / embodied-AI peers reprice materially lower in the next financing cycle
    - Shrinks the comparable-multiple support for Hark’s current mark
    - Tighten downside assumptions and demand a steeper discount
  - - Hidden preference stack
    - Series A terms reveal aggressive preferences, ratchets, or large secondary allocations
    - Reduces upside to new and common shareholders even if enterprise value grows
    - Avoid unless price compensates for the structural downside
  notes: Each trigger is monitorable from public announcements or a diligence room. The capital-structure trigger cannot be resolved from public evidence today and is therefore also carried into evidence gaps.
