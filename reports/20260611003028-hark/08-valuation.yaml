- id: scenario-and-downside
  title: Probability-weighted outcomes still sit below the ask
  body: 'The upside case for Hark is not imaginary. Goldman’s category TAM work shows why investors can pay very high prices for a real winner in humanoids or embodied AI, and Hark’s own financing proves that capital markets want to fund ambitious interface-plus-hardware bets. If Hark’s summer 2026 model rollout converts into genuine paid usage, if the company demonstrates that its hardware meaningfully improves retention or utility, and if it can disclose early recurring economics, a valuation above today’s price is possible. The problem is that public evidence does not yet let an outside investor assign that upside a high probability. Gartner, IEEE Spectrum, IEEE RAS, Rodney Brooks, and McKinsey all point in the same direction: humanoid and embodied-automation markets remain hard to scale, easy to overhype, and vulnerable to specialized substitutes that already deliver warehouse ROI.


    That is why the scenario table stays conservative. The base case assumes Hark earns a valuation more in line with late-stage proof peers but below the current mark; the bear case assumes either a launch miss or weak monetization, which would expose the company to a reset similar to other AI hardware disappointments; the bull case assumes Hark becomes one of the rare platform winners that turns product ambition into durable willingness to pay. When those paths are weighted, the midpoint remains below the current $6 billion price. Just as important, the return profile from the current entry is unattractive: even a very good outcome only produces modest gross upside, while the downside remains severe because the capital raised, likely preferences, and future dilution all sit ahead of common-equity upside.'
