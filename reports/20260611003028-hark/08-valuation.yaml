- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Summer 2026 model rollout converts into paid usage; hardware launches cleanly; disclosed economics support a platform narrative; follow-on investors reprice Hark as a consumer/embodied-AI leader.
    - $8B-$12B outcome; about 1.3x-2.0x gross MOIC from today’s $6B entry before later dilution; requires evidence more comparable to upper-end 1X / Figure narratives than to Agility.
    - Consumer hardware adoption disappoints; retention weak; future financing still needed.
    - 25%
  - - Base
    - Hark launches product but public proof remains mixed; software value exists, hardware is still expensive, and the market values Hark closer to better-evidenced private robotics peers.
    - $2.5B-$4.0B outcome; roughly 0.4x-0.7x gross MOIC from current entry; closer to Agility/Apptronik-style benchmarking than to breakout-platform pricing.
    - 'Launch slips, pricing remains opaque, and the market discounts missing monetization. '
    - 45%
  - - Bear
    - Launch slips or converts poorly; hardware economics remain unclear; the company needs more capital before proving willingness to pay; category multiples compress.
    - $0.75B-$1.5B outcome; roughly 0.1x-0.25x gross MOIC; downside resembles a reset or strategic sale rather than a premium growth round.
    - Down-round preferences, weak demand, and substitute automation options limit recovery value.
    - 30%
  notes: Scenario values are analyst estimates grounded in current private robotics comparables, public category skepticism, and Hark’s known price. Probability-weighted midpoint is about $4.3B, below the current $6B ask.
