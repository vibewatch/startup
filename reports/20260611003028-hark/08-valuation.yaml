- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Current evidence
  - What would change the view
  rows:
  - - 'Thesis: Hark can fund its way to category relevance quickly'
    - More than $700M raised at Series A, oversubscribed, with major compute and semiconductor investors involved.
    - Would strengthen with on-time summer 2026 launch metrics and proof that the capital is translating into product usage.
  - - 'Thesis: Vertical integration could create a defensible interface moat'
    - Official materials consistently describe models, software, memory, and bespoke hardware being built together.
    - Would strengthen if Hark shows that hardware materially improves retention, conversion, or task completion relative to software-only interfaces.
  - - 'Thesis: Category upside is real'
    - Goldman’s $38B humanoid-TAM view and the high valuations of Figure, 1X, and Apptronik show investors will fund winners.
    - Would strengthen if Hark demonstrates it belongs in the winner cohort rather than merely in the hype cohort.
  - - 'Anti-thesis: The company is being priced before monetization is public'
    - No public revenue, pricing, customer logos, gross margin, or paid-beta disclosures were found.
    - Would weaken if Hark discloses paid usage, retention, and customer case studies.
  - - 'Anti-thesis: Better-evidenced peers are cheaper or only modestly cheaper'
    - Agility and Apptronik have public deployment evidence at lower reported valuations; Hark is already above Apptronik’s reported mark.
    - Would weaken if Hark shows proof that is qualitatively better than those peers or if the price resets.
  - - 'Anti-thesis: The whole category may still be overvalued'
    - Gartner, IEEE, Brooks, McKinsey, and the Humane outcome all argue that hardware ambition can outrun demand and ROI.
    - Would weaken if Hark ships into a use case where willingness to pay, uptime, and retention are clearly visible.
  notes: Rows mix the pro and con sides of the thesis so the decision remains evidence-sensitive. Several rows depend on events that have not yet occurred publicly.
