callouts:
- calloutType: strength
  title: Capital access is real
  body: The round itself is evidence that elite capital providers are willing to fund Hark’s thesis aggressively. That should not be dismissed. It reduces near-term financing risk and gives the company a real chance to prove the product faster than most prelaunch peers.
  claimRefs:
  - CV001
  - CV002
  - CV004
- calloutType: risk
  title: Price already outruns public commercialization proof
  body: Hark is being valued above Apptronik and far above Agility and Boston Dynamics benchmarks while still withholding the metrics that would normally justify a premium. That mismatch is the central underwriting risk.
  claimRefs:
  - CV007
  - CV032
  - CV033
  - CV034
  - CV037
- calloutType: recommendation
  title: Avoid at the current $6B mark
  body: The price could become reasonable later, but current public evidence does not support entering here. The probability-weighted range sits below the ask and the upside from this level is not attractive enough relative to downside risk.
  claimRefs:
  - CV041
  - CV042
  - CV045
  - CV048
- calloutType: assumption
  title: Preference overhang remains a material unknown
  body: The round math tells us the visible dilution, but not the actual economic stack. Without the term sheet, investors cannot know how much liquidation preference or anti-dilution protection sits ahead of common equity.
  claimRefs:
  - CV010
  - CV043
  - CV044
