- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Hark
    - Series A, May 2026
    - $6.0B post-money on >$700M raised
    - Current underwriting reference point
    - No public revenue, customer, or pricing proof
  - - Figure AI
    - Series B, Feb 2024
    - $2.6B post-money on $675M raised
    - Shows what investors paid for a leading humanoid name before later scaling
    - Now stale relative to 2026 and still pre-profit
  - - Figure AI
    - Series C, Sep 2025
    - $39B post-money on >$1B committed
    - High-end leader benchmark for the category
    - Much stronger public product and deployment evidence than Hark
  - - Apptronik
    - Series A extension, Feb 2026
    - ~$5.3B post-money; >$935M total Series A
    - Closest high-credibility private humanoid comp below Figure
    - Valuation reported by TechCrunch, not officially disclosed by Apptronik
  - - Agility Robotics
    - Series C / 2026 public references
    - ~$2.1B-$2.15B after ~$400M 2025 round
    - Commercial deployment benchmark with clearer workflow evidence
    - Public valuation references are secondary, not a fresh company press release
  - - 1X
    - Series B, Jan 2024
    - $100M closed round; valuation not disclosed publicly
    - Useful consumer-home humanoid comp for Hark’s interface vision
    - No clean official round valuation
  - - 1X
    - Reported 2025 target
    - Seeking up to $1B at $10B+ target valuation
    - Shows how public imagination prices consumer-humanoid upside
    - Target only; not a closed financing
  - - Boston Dynamics
    - Hyundai acquisition, Jun 2021
    - $1.1B transaction value
    - Only fully disclosed robotics M&A valuation in this set
    - Older transaction and different product / buyer context
  - - Humane
    - Asset sale, Feb 2025
    - $116M asset sale after >$230M raised
    - Adverse AI-hardware downside benchmark
    - Not a robotics company and outcome reflects a failed consumer device
  notes: The table blends private rounds, a disclosed M&A transaction, and one adverse AI-hardware outcome because Hark lacks the revenue data needed for clean public-market multiple benchmarking. Reported valuations are used only where public sourcing exists; some are company disclosures and others are well-attributed press reports.
  enumerationScope:
    coverage: partial
    basis: Rows cover the closed private rounds, reported valuation targets, and M&A or failure references most relevant to Hark’s current personal-AI plus hardware thesis through the 2026 run date, not every robotics company globally.
