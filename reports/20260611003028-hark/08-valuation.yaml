- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and preferences
    - Series A term sheet, liquidation preferences, anti-dilution, and option-pool treatment
    - Determines whether the downside for common and new investors is much worse than the headline valuation suggests
    - Ask company counsel and lead investor for final closing documents
  - - Paid adoption
    - User counts, paid conversion, churn, retention, and cohort behavior from the summer 2026 launch
    - Separates product curiosity from monetizable product-market fit
    - Board deck, growth dashboard, and payment processor extracts
  - - Customer proof
    - Named enterprise or channel partners, design partners, and hardware pilot economics
    - Validates that Hark’s interface or device solves a real buying problem
    - Customer interviews and signed commercial agreements
  - - Unit economics
    - Hardware BOM, warranty reserves, support burden, and software gross-margin bridge
    - Shows whether native hardware creates value or simply absorbs capital
    - CFO / operations review plus supplier quotes
  - - Independent marks
    - Secondary trades, investor letters, or third-party valuation memos supporting the $6B mark
    - Tests whether the announced price is broadly accepted or simply a financing headline
    - Lead investor side letter review and fund LP materials
  - - Competitive differentiation
    - Evidence that Hark can outperform software-only assistants and better-proven robotics peers on retention or willingness to pay
    - Without this, a premium multiple over Agility/Apptronik is hard to defend
    - Product demo, benchmark suite, and comparative user research
  notes: These are the minimum items needed to move from a public-market narrative to an underwritable valuation opinion. Several diligence asks directly address the two unresolved research questions.
