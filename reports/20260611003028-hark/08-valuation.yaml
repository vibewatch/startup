company:
  name: Hark
chapter:
  number: 8
  title: Valuation
  summary: Hark’s May 2026 Series A set a clear price — more than $700M at a $6B post-money valuation — but public evidence still stops well short of proving that price. Hark has capital, compute, and ambition, yet no disclosed revenue, pricing, customer, or unit-economics data. Against better-evidenced robotics comps such as Apptronik (~$5.3B), Agility (~$2.1B-$2.15B), Figure ($2.6B in 2024 and $39B in 2025), and Boston Dynamics ($1.1B M&A), the public record supports an avoid recommendation, medium confidence, high risk, and an expensive valuation stance.
sections:
- id: price-vs-proof
  title: Current price versus public proof
  body: 'Hark’s public price is unusually explicit and its operating proof is unusually thin. The company announced a May 2026 Series A of more than $700 million at a $6 billion post-money valuation, and the March 2026 Form D suggests the company had already set up a financing process with a $1.0 billion offering ceiling before the public announcement. That capital access matters. It gives Hark real resources to hire, buy scarce compute, and launch products faster than most prelaunch AI hardware companies can. But the same public record still leaves out the basic underwriting inputs that would normally justify a price this high: there is no disclosed revenue, pricing grid, paid customer list, retention data, or hardware gross-margin evidence. The official story is still largely forward-looking: models later in summer 2026, hardware after that, and a vertically integrated vision for personal intelligence.


    The result is a market signal without a public operating ledger. Investors can verify that Hark raised the round, who backed it, what the Form D said, and that the company is building both models and native hardware. They cannot yet verify whether users will pay, whether the product category is sticky, or whether the hardware path creates better economics than a pure software interface. At current terms, the valuation is therefore a bet on capability and ambition rather than on demonstrated monetization. That distinction is the core reason this chapter stays price-sensitive rather than founder-sensitive.'
