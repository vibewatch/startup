company:
  name: Hark
chapter:
  number: 1
  title: Company Overview
  summary: Hark is a San Jose-based private AI lab founded by Brett Adcock in 2025 to build a vertically integrated personal-intelligence platform spanning multimodal models, software, and AI-native hardware. The company self-funded early development with $100 million before raising an oversubscribed $700 million Series A at a $6 billion post-money valuation on May 21, 2026, led by Parkway Venture Capital. Public disclosures point to a team that grew from more than 45 people at launch in March 2026 to around 70 by the financing, but Hark remains pre-product with no disclosed customers, pricing, or revenue.
sections:
- id: identity-and-product
  title: Identity, product thesis, and business model
  body: 'Hark presents itself as an artificial-intelligence lab building “the most advanced personal intelligence in the world,” not as a narrow application company. Across the homepage, the March 2026 launch release, and the May 2026 financing announcement, the company repeats the same core architecture: its own foundation models, software systems, and purpose-built hardware are being developed together as a universal interface between humans and machines. The intended product is multimodal and agentic, combining speech, text, vision, contextual awareness, and persistent memory so the system can proactively manage parts of a user’s digital and eventually physical environment. This makes Hark closer to a next-generation personal-computing platform than a conventional SaaS assistant. Management says first software experiences and models should arrive in summer 2026, with AI-native devices to follow. As of the run date, however, Hark has not disclosed customers, pricing, or monetization details,
    so the business model should be treated as pre-commercial and thesis-driven rather than validated by public traction.'
  claimRefs:
  - CO001
  - CO002
  - CO003
