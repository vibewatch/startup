  - TO003
- id: scale-disclosures-and-dependencies
  title: Scale signals, disclosure limits, and operational dependencies
  body: 'Public scale indicators are narrow but meaningful. The launch release said Hark had assembled more than 45 researchers, engineers, and designers from Apple, Meta, Google, Tesla, and leading AI labs; the May financing post said the team had grown to around 70. The same materials say Hark secured a new NVIDIA B200 data center and thousands of GPUs to support multimodal model training, reinforcing that compute access is a first-order operating dependency. Public disclosures also place the company in San Jose, California. Beyond those signals, however, Hark reveals very little: no revenue, ARR, pricing, gross margin, customer count, or named pilot users are public. The company instead describes early access to its personal-AI platform later in summer 2026 and future hardware thereafter. For diligence purposes, Hark should be treated as a heavily funded, pre-product company with strong talent and infrastructure signals but minimal public evidence on demand generation, conversion, or
    commercial unit economics.'
  claimRefs:
