    - Confirm current ownership %, voting control, related-party arrangements, and time allocation across Hark and Figure.
  - - Parkway Venture Capital
    - Series A lead
    - Likely the anchor governance voice for the $700M+ round and key shaper of valuation expectations.
    - Confirm board seat, protective provisions, liquidation preferences, and follow-on reserve strategy.
  - - NVIDIA
    - Investor and compute supplier
    - Strategic importance extends beyond capital because Hark is training on NVIDIA B200 infrastructure.
    - Clarify supply commitments, pricing, exclusivity, and whether compute access is tied to financing milestones.
