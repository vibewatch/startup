- id: milestones-and-risk-context
  title: Milestones, founder-risk context, and what later chapters should reuse
  body: 'The chapter chronology is short because Hark is new, but it is already consequential. The company was founded in 2025, emerged publicly in March 2026 with a launch press release, and converted into one of the largest AI hardware Series A rounds by May 2026. Public milestones include Chowdhury’s addition as design lead, NVIDIA-backed compute build-out, the move from roughly 45 to 70 employees, and a promised software launch window in summer 2026. The main adverse lens comes from founder adjacency and sector hype rather than company-specific operating failures. TechCrunch reported that Figure — Adcock’s other major company — faced skepticism around commercialization claims and public-demo transparency, while broader robotics coverage continues to question how quickly humanoid and AI-hardware visions can turn into durable commercial businesses. Later chapters should therefore treat the following as ground truth: Hark is a private Series A company, its public valuation anchor is $6
    billion post-money, its disclosed external raise is $700 million+, its product is still pre-launch, and the next 12 months are the decisive proof window for whether capital and pedigree translate into product-market evidence.'
