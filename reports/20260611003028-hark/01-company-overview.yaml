- id: founder-and-leadership
  title: Founders, leadership, and key-person dependence
  body: 'Hark is tightly identified with Brett Adcock, who is named founder and CEO across official releases and third-party coverage. That biography matters because investors are clearly underwriting prior execution as much as current product evidence: Adcock previously founded Figure AI, co-founded Archer Aviation, and earlier founded Vettery. Public Hark materials also highlight Abidur Chowdhury, formerly an Apple designer associated with iPhone and Mac programs, as the design leader responsible for translating the company’s personal-intelligence thesis into a new interface. What is missing is almost as important as what is present. The public record reviewed for this chapter does not name a broader executive bench, a board, or independent governance structures beyond Adcock’s role and Chowdhury’s design leadership. That concentration creates material key-person risk because Adcock remains publicly associated with Figure, and adverse coverage around Figure’s commercialization claims could
    spill over into Hark’s credibility. Investors should therefore diligence succession, allocation of founder attention, and governance controls rather than assume the team depth is commensurate with the size of the Series A.'
  claimRefs:
  - CO008
  - CO009
  - CO013
  - CO014
  - CO015
  - CO029
  - CO033
  - CO034
  tableRefs:
  - TO002
- id: capital-and-stakeholders
  title: Funding history, investor base, and stakeholder map
  body: 'Hark’s capital formation is unusually front-loaded. Observer and TechCrunch describe the company as having started late in 2025 with approximately $100 million of Adcock’s own capital. On May 21, 2026, Hark announced an oversubscribed Series A of more than $700 million at a $6 billion post-money valuation led by Parkway Venture Capital, with participation from NVIDIA, AMD Ventures, ARK Invest, Brookfield, Greycroft, Intel Capital, Prime Movers Lab, Qualcomm Ventures, Salesforce Ventures, Tamarack Global, and Align Ventures. The cap table matters strategically: it combines chip suppliers, venture firms, and enterprise-oriented investors whose interests align with Hark’s vertically integrated AI-device thesis. Qatalyst Partners advised the transaction. What remains opaque is ownership distribution. Public materials do not disclose dilution from Adcock’s self-funding, investor percentages, any governance rights attached to the round, or whether there are side agreements, secondaries,
    or debt facilities. The result is a well-capitalized but not yet transparent financing story.'
  claimRefs:
  - CO010
  - CO016
  - CO017
  - CO018
