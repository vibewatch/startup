    - Investor
    - Adds semiconductor ecosystem validation and enterprise distribution adjacency.
    - Determine whether Intel has any commercial partnership rights, information rights, or preferred-access terms.
  - - AMD Ventures
    - Investor
    - Provides alternative chip-ecosystem signaling and optionality versus a single-vendor narrative.
    - Ask whether AMD involvement is purely financial or linked to future inference/deployment hardware plans.
  - - Qualcomm Ventures
    - Investor
    - Suggests potential relevance to edge, mobile, or wearable-device distribution for future Hark hardware.
    - Verify if Qualcomm has roadmap visibility, co-development rights, or channel leverage.
  - - Salesforce Ventures
    - Investor
    - Introduces enterprise software connectivity that could matter if Hark expands beyond consumer workflows.
    - Test whether Salesforce expects enterprise integration, agent tooling, or purely portfolio exposure.
