  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Named board members, observer rights, broader executive roster, and any formal governance structure for Hark.
    whyItMatters: A $700M+ Series A normally comes with meaningful governance rights and management depth, both of which affect founder concentration risk and control analysis.
    diligencePath: Request the current board list, governance documents, org chart, and financing term sheet or side-letter summary from management.
    relatedQuestionRefs:
    - QO008
    - QO009
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-and-beta-evidence
    missingEvidence: Named early-access users, beta partners, letters of intent, or commercial pilot descriptions for the summer-2026 software release.
    whyItMatters: Without user evidence, it is impossible to distinguish between a credible pre-launch platform and a highly financed concept narrative.
    diligencePath: Ask for beta pipeline, signed design-partner agreements, product demos, and usage metrics from any closed pilot cohort.
    relatedQuestionRefs:
    - QO020
  - type: private-evidence-only
    severity: material
    topic: economics-and-pricing
    missingEvidence: Revenue model, pricing architecture, expected hardware gross-margin structure, and any usage-based software economics.
    whyItMatters: Valuation and capital intensity cannot be underwritten rigorously without a view on how Hark expects to monetize software, hardware, or subscriptions.
    diligencePath: Request internal pricing drafts, model hosting assumptions, device BOM estimates, and early unit-economics forecasts.
    relatedQuestionRefs:
    - QO021
  - type: missing-source
    severity: minor
    topic: legal-entity-and-address
    missingEvidence: Exact legal entity name, incorporation date, and a published headquarters address for Hark.
    whyItMatters: The chapter can place Hark in San Jose, but legal diligence and jurisdictional analysis need a filed entity and address rather than release datelines.
    diligencePath: Pull Secretary of State filings, cap table paperwork, and company legal docs to confirm entity details.
    relatedQuestionRefs:
    - QO014
