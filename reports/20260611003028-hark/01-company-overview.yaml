- calloutType: risk
  title: Founder concentration is both the asset and the risk
  body: Adcock’s prior wins and public profile are clearly part of Hark’s financing story, but the same concentration creates diligence risk because Hark depends heavily on a founder who remains publicly linked to Figure and carries spillover reputation exposure from that company’s execution debates.
  claimRefs:
  - CO009
  - CO029
  - CO033
  - CO040
- calloutType: strength
  title: Capital and compute access are unusually strong for a pre-product company
  body: Hark has already secured founder capital, a mega-round led by Parkway, and NVIDIA-backed compute infrastructure, giving it far more room than a typical Series A startup to recruit talent and train large multimodal systems before commercial launch.
  claimRefs:
  - CO016
  - CO018
  - CO023
  - CO038
- calloutType: assumption
  title: The current valuation underwrites a moat, not yet a market
  body: The public evidence supports Hark’s capital base and ambition, but not product-market fit. Until summer-2026 software release claims turn into named users, usage evidence, or hardware adoption, the $6B valuation should be interpreted as a founder-and-resource bet rather than proof of commercial traction.
