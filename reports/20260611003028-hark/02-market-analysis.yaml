callouts:
- calloutType: risk
  title: Bullish TAM does not equal near-term served market
  body: Goldman Sachs supports a large long-dated upside case, but Gartner and IEEE indicate the near-term market is still constrained by narrow deployments, unresolved reliability thresholds, and strong substitute technologies. Investors can overstate category maturity if they use the $38B headline without adjusting for commercialization bottlenecks.
  claimRefs:
  - CM008
  - CM016
  - CM017
  - CM026
  - CM029
- calloutType: insight
  title: Warehouse buyers compare humanoids against scaled substitutes, not against manual work alone
  body: Amazon’s million-plus deployed robots and Gartner’s preference for polyfunctional systems show that the real benchmark is proven warehouse automation. A new entrant must beat existing throughput, uptime, and operating-model economics rather than merely promise to replace labor in the abstract.
  claimRefs:
  - CM018
  - CM036
  - CM037
- calloutType: assumption
  title: Hark’s credible wedge is an interface or control layer until a first buyer is proven
  body: Hark’s public materials clearly support a personal-intelligence and hardware thesis, but they do not yet prove whether the first monetizable buyer is consumer, enterprise, or robotics-specific. Treating Hark as an embodied-AI adjacency rather than a disclosed robot OEM keeps the chapter evidence-led and preserves the unresolved SAM/SOM question.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM005
  - CM044
