  - type: missing-source
    severity: material
    topic: benchmarking-gap
    missingEvidence: Independent benchmark comparing humanoids, wheeled polyfunctional robots, and fixed automation on identical warehouse and manufacturing tasks.
    whyItMatters: Without benchmark data it is impossible to say whether humanoids are winning because of real economics or because pilots are still promotional and unstandardized.
    diligencePath: Obtain customer-side benchmarking, integrator tests, or insurer / safety assessments that compare throughput, uptime, intervention, and TCO across form factors.
    relatedQuestionRefs:
