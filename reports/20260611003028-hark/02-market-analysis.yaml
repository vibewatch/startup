  - type: private-evidence-only
    severity: material
    topic: hark-som-gap
    missingEvidence: Hark first buyer segment, pricing model, hardware roadmap, and whether initial commercialization is consumer, enterprise, or embodied-control software.
    whyItMatters: Without those facts the chapter can define the market and size adjacencies, but it cannot produce a credible Hark-specific SAM or SOM.
    diligencePath: Request product roadmap, pricing hypotheses, design-partner list, and any internal segmentation or pilot data from management.
    relatedQuestionRefs:
