- id: drivers-and-constraints
  title: Growth Drivers, Substitutes, and Commercial Constraints
  body: 'The growth case is easy to articulate. Goldman says component availability has improved, costs have fallen faster than expected, and industrial demand is strongest where work is dangerous, dirty, dull, or hard to staff. McKinsey shows why logistics buyers keep pursuing automation despite failures: they still need resilience, safety, accuracy, and throughput. IFR’s regional density and installation forecasts confirm that industrial automation budgets are real and still growing. WHO’s assistive-technology data adds a longer-dated personal-robotics adjacency because aging populations and care gaps will keep expanding the need for technology that supports independence.


    The harder question is commercialization timing. Gartner and IEEE both argue that hype is outpacing readiness. Gartner says most humanoid deployments through 2028 remain confined to tightly controlled environments and warns that wheeled polyfunctional robots often offer better economics. IEEE makes the bottlenecks concrete: battery trade-offs, the need for roughly 99.99% reliability in critical operations, unresolved safety requirements for balancing robots, and a basic demand problem because no facility-level killer app has yet surfaced at thousand-robot scale. Rodney Brooks adds a broader caution that prototype success is not the same as deployment at scale.


    That set of constraints matters more for valuation than the top-line TAM. Today’s buyers are comparing humanoids against proven substitutes such as Amazon’s non-humanoid fleet, not against manual labor alone. Hark may still benefit if the category shifts toward a premium control or interface layer, but public evidence does not yet prove that the market will reward a broad personal-intelligence platform faster than it rewards tightly scoped, workflow-specific automation. The chapter therefore preserves both the upside and the contradiction: capital and forecasts are accelerating, but adoption remains narrow, benchmark data remains thin, and the winning form factor is still unsettled.'
