- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Faster component cost decline and improved supply options
    - driver
    - Near term
    - Supports more pilot activity and more ambitious TAM models
    - Ask which parts of Hark’s hardware bill of materials benefit from the same cost curve
  - - Industrial automation remains a live capex category
    - driver
    - Near term
    - IFR density and installation growth show adjacent budgets already exist
    - Determine whether Hark sells into existing automation budgets or creates a new line item
  - - Warehouse resilience, safety, and throughput needs
    - driver
    - Now
    - Keeps buyers funding automation even when projects fail
    - Identify one workflow where Hark can improve economics over incumbent automation
  - - Aging-driven assistive-technology need
    - driver
    - Long term
    - Creates a large adjacent personal-robotics demand pool
    - Clarify whether Hark’s roadmap includes care, accessibility, or companion-device use cases
  - - Demand concentration in tightly controlled environments
    - constraint
    - Now through 2028
    - Limits near-term SOM to narrow workflows rather than general-purpose deployments
    - Quantify Hark’s first controlled use case and deployment criteria
  - - Polyfunctional robots often offer better warehouse economics
    - constraint
    - Now
    - Humanoids and embodied-AI entrants must beat strong substitutes, not just manual labor
    - Benchmark Hark against wheeled, non-humanoid alternatives in a real workflow
  - - Reliability, battery life, and downtime tolerance remain severe gates
    - constraint
    - Now
    - Commercial buyers will not scale systems that fail uptime thresholds
    - Request uptime, recharge, intervention, and maintenance metrics from Hark or partners
  - - Safety standards and liability models are still evolving
    - constraint
    - Near to medium term
    - Compliance work can slow deployment in human-shared spaces
    - Assess whether Hark participates in standards, safety tooling, or partner compliance stacks
  notes: Table blends public demand signals with commercialization blockers. The category can be strategically attractive and still commercially narrow if substitutes, reliability thresholds, and standards work remain unresolved.
