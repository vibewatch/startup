  - type: conflicting-data
    severity: material
    topic: forecast-dispersion
    missingEvidence: Independent reconciliation between bullish long-dated TAM forecasts and cautious near-term production forecasts.
    whyItMatters: The value of the category depends on whether commercialization bottlenecks are temporary delays or evidence that forecasts are structurally too optimistic.
    diligencePath: Request third-party scenario analysis that normalizes adoption pace, uptime assumptions, and substitute economics across Goldman, Gartner, and OEM case studies.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
