tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Hark
  rows:
  - - Industrial humanoid robots
    - Robot hardware, embodied-AI software, deployment, maintenance
    - Fixed industrial cells already purpose-built for one task
    - Plant ops, automation engineering, manufacturing capex
    - Direct adjacent market if Hark becomes an embodied-control or interface layer
  - - Warehouse and logistics service robotics
    - Picking, tote movement, line-side delivery, orchestration software
    - Conventional WMS-only spending and manual staffing alone
    - Supply-chain ops, fulfillment leadership, logistics capex/opex
    - Most plausible near-term enterprise adjacency because buyers already fund robotics here
  - - Personal AI-native hardware
    - Consumer or prosumer hardware, multimodal models, device services
    - Generic chatbots without native hardware or persistent memory
    - Individual users or enterprise knowledge-work budgets
    - This is Hark’s clearest stated category today
  - - Assistive / personal robotics adjacency
    - Assistive devices, companion and independence-supporting systems, access services
    - Generic healthcare spend without device or interaction layer
    - Households, caregivers, health systems, public programs
    - Long-dated adjacency; large unmet need but not proven Hark core market
  - - Control / interface software layer
    - Voice, vision, memory, orchestration, safety and fleet interfaces
    - Pure analytics without direct human-machine interaction
    - OEMs, integrators, enterprise innovation teams
    - Most defensible bridge between Hark’s public positioning and robotics budgets
  - - Status-quo substitutes
    - Existing AMRs, wheeled manipulators, fixed robots, workflow software
    - n/a
    - Same buyers as above
    - These alternatives already absorb today’s automation budgets and define the competitive baseline
  notes: Boundary logic combines Hark’s own positioning with Gartner, McKinsey, IFR, Amazon, and WHO evidence; substitutes are excluded from the core market but kept visible because they compete for the same industrial and personal-technology budgets.
