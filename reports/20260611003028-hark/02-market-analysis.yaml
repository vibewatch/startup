- id: market-sizing
  title: Sizing Lenses and Forecast Dispersion
  body: 'The strongest openly published upside case remains Goldman Sachs’ projection that humanoid robots could reach a $38 billion total addressable market by 2035, with 1.4 million shipments over the same horizon. That forecast matters because it helps explain why capital keeps flowing into embodied-AI and hardware platforms. Yet the same source also reveals why this market cannot be summarized with a single headline TAM. Goldman’s logic relies on a large cost decline, faster commercialization, and eventual industrial plus consumer adoption, while Gartner’s 2026 note says fewer than 20 companies are likely to reach actual production use in manufacturing and supply chain by 2028. Both statements can be directionally true at once: a large long-dated TAM can coexist with a very narrow near-term served market.


    A better evidence-constrained sizing frame is a set of lenses rather than a single number. First, there is the long-dated 2035 humanoid TAM. Second, there is the current installed-base and capex baseline for industrial automation, where IFR still expects more than 700,000 industrial robot installations annually by 2028 and reports very different automation density by region. Third, there is the adjacent personal and assistive demand pool, where WHO expects need for assistive products to exceed 3.5 billion people by 2050 but also documents severe access and workforce gaps. For Hark specifically, public evidence is not yet sufficient to isolate a credible SAM or SOM: the company has not disclosed its first buyer segment, pricing model, deployment model, or whether its first product is consumer, enterprise, or robotics-control oriented. The result is a market that is clearly important, clearly investable, and still too early to size credibly with one broad estimate.'
