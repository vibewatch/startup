- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - More account permissions and connectors
    - Activation could stall if users will not grant broad data and browser access
    - Weakens daily utility and slows expansion beyond initial curiosity
    - Review permission-grant funnel, connector attach rates, and privacy-related churn
  - - Future AI-native hardware attachment
    - Hardware channel or manufacturing concentration could dominate economics before software retention is known
    - Raises margin and support risk while obscuring software durability
    - Request device roadmap, channel model, attach assumptions, and gross-margin bridge
  - - Enterprise or team rollout
    - No named reference accounts means procurement could stall at security, privacy, and audit review
    - Delays higher-ACV motion and makes enterprise demand hard to underwrite
    - Request pilot list, security packet, admin controls, and implementation references
  - - Small initial launch cohort
    - Early revenue could be concentrated in a tiny number of beta users, partners, or design customers
    - Creates volatile demand signals and fragile reference quality
    - Request top-account concentration, cohort mix, and paid-versus-free usage by launch month
  - - Investor and ecosystem halo
    - Strategic-capital attention can be mistaken for organic customer pull
    - Can overstate true adoption readiness and expansion velocity
    - Separate investor-led introductions from repeatable pipeline and organic demand
  notes: This table focuses on the mechanisms by which a sparse early customer base can distort perceived momentum, especially when public proof is thinner than financing visibility.
