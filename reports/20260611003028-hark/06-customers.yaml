- id: adoption-proof-gap
  title: 'Adoption trajectory and named proof: Hark is publicly pre-deployment, while adjacent robotics peers already publish named operational references'
  body: The central customer fact about Hark is not hidden growth; it is missing proof. Hark’s own March launch announcement said software experiences and AI models would arrive in summer 2026, with AI-native hardware to follow, and the May financing post repeated that timing. TechCrunch still described the company as highly secretive in late May, and Forbes argued explicitly that the $700 million Series A came with no customers to name and no traction to underwrite. Across the reviewed Hark homepage, launch materials, financing materials, privacy disclosures, and financing coverage, the company does not publicly identify a pilot customer, production deployment, enterprise design partner, paid-seat count, active-account count, or case study with outcomes. That does not prove there are no users; it proves only that the public record does not yet support adoption claims beyond prospective launch timing. The gap becomes clearer when contrasted with adjacent automation markets. Figure publishes
    BMW runtime, throughput, and cycle-time metrics; Agility and GXO describe a commercial post-pilot deployment generating revenue; Apptronik and Mercedes name specific manufacturing tasks; Symbotic and Walmart disclose conditional deployment economics; Locus and DHL report one billion warehouse picks across more than 40 sites. Those are not Hark customers, and this chapter treats them only as proof-bar benchmarks. But they are useful because they show what named customer evidence looks like when a company has it. Hark is not there yet in public.
