  - - BMW + Figure
    - Comparable context, not a Hark customer
    - Sheet-metal loading on active assembly line at Spartanburg; rollout discussed for Leipzig
    - Production deployment
    - Figure reports 90,000+ parts, 1,250+ runtime hours, 30,000+ X3 vehicles, and >99% placement target
    - Useful proof benchmark for operational deployment, but not evidence about Hark demand
  - - GXO + Agility Robotics
    - Comparable context, not a Hark customer
    - Digit moves totes from cobots to conveyors in live logistics environment
    - Commercial deployment after proof of concept
    - Agility says the deployment is revenue-generating and under a multi-year agreement
    - Warehouse humanoid use case differs from Hark personal-AI product
  - - Mercedes-Benz + Apptronik
    - Comparable context, not a Hark customer
    - Apollo handles kit delivery, tote delivery, and related manufacturing support tasks
    - Commercial agreement / pilot stage
    - Named use case and customer quote show real buyer and workflow specificity
    - Still earlier-stage than BMW/Figure and not directly translatable to Hark
  - - Walmart + Symbotic
    - Comparable context, not a Hark customer
    - Automation for accelerated pickup and delivery centers
    - Conditional multi-year deployment
    - Agreement includes development funding and up to 400 APD deployments if criteria are met
    - Warehouse-automation economics differ sharply from consumer/agentic-AI adoption
  - - DHL + Locus Robotics
    - Comparable context, not a Hark customer
    - AMR picking across 40+ DHL-managed sites
    - Scaled production deployment
    - Locus cites one billion picks, 30-180% productivity gains, and 80% lower training time
    - AMR proof is instructive on proof quality, but not on Hark’s end market
