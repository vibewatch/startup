  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-customers
    missingEvidence: Named Hark pilot or production customers, reference calls, deployment scope, and outcome metrics.
    whyItMatters: Without named references, the chapter cannot distinguish hidden traction from mere launch intent.
    diligencePath: Request a customer list segmented by pilot versus production with at least two reference calls and supporting usage dashboards.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: adoption-metrics
    missingEvidence: Beta, waitlist, active-account, paid-seat, and repeat-usage metrics with time series and denominators.
    whyItMatters: Adoption trajectory cannot be underwritten if the only visible momentum is capital raised and headcount growth.
    diligencePath: Request cohort file for applicants, activated users, paying users, weekly actives, and task-completion rates by launch month.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: blocking
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal terms, contract length, CSAT, NPS, and support-ticket trends for live customers.
    whyItMatters: Durability is a core gate for a customer chapter and is currently completely absent in public evidence.
    diligencePath: Request retention deck, renewal cohort exports, referenceable customers, and support-quality metrics.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-account concentration, revenue split between software and hardware, and customer mix by segment and geography.
    whyItMatters: A narrow initial cohort can create misleading traction signals and material downside if one launch account or partner dominates spend.
    diligencePath: Request top-10 account concentration, segment mix, geography mix, and software-versus-hardware revenue bridge.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
