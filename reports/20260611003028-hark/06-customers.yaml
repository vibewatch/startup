company:
  name: Hark
chapter:
  number: 6
  title: Customers
  summary: Hark’s public customer story is still mostly a buyer hypothesis, not a verified adoption story. Official materials and coverage show a personal-account product surface with payments, connectors, and future hardware, but no public named Hark customer, deployment metric, retention KPI, or referenceable outcome. Compared with adjacent automation companies that already publish named deployment evidence, Hark remains publicly pre-proof and should be diligenced as such.
sections:
- id: buyer-user-payer-map
  title: 'Buyer, user, and payer structure: the public record points to direct accounts first, not named enterprise buyers'
  body: 'Hark’s public surfaces describe a product that is far more concrete on user interaction than on customer disclosure. The homepage describes a personal-intelligence system paired with bespoke hardware, while the privacy policy describes accounts, payment card information, transaction history, prompts, outputs, third-party apps, connectors, sandbox execution, and a Browser Operator that can act inside a user’s own browser session. Taken together, those disclosures imply a direct account relationship in which the first identifiable buyer and payer is likely the account holder, not a publicly named enterprise procurement department. The user also appears to be the operator: the person whose preferences, data, browser context, and connected services make the system useful. That does not rule out future enterprise adoption, but it does mean Hark’s current public customer story is structurally consumer- or prosumer-led in the evidence that is actually available. Even the careers page emphasizes
    AI, engineering, and design rather than a visible sales, implementation, or reference-customer narrative. For customer diligence, that matters because it pushes the chapter away from invented enterprise logos and toward a narrower, evidence-based interpretation: Hark appears to be building for individual or small-team accounts first, with any broader buyer hierarchy still undisclosed.'
