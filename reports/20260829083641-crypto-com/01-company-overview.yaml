  - FO001
- id: traction-transparency-and-open-questions
  title: Traction signals, transparency strengths, and unresolved gaps
  body: 'Public traction signals are real but uneven in quality. Crypto.com’s own surfaces support 150 million users, 90 countries, over 300,000 Pay merchants or shops, 350-plus trading instruments, and substantial product velocity in tokenized stocks, travel, prediction markets, and institutional integrations. Business of Apps adds a more underwritable but lower-confidence operating lens: approximately $1.5 billion of revenue in 2024, roughly $750 billion of transaction volume, 1.2 million active traders, and 14.8 million app downloads in 2024. The App Store rating of 4.7 across 333,000 ratings adds consumer-scale evidence, but not a direct read on monetization quality. Transparency is strongest around security certifications and reserve-verification workflows, where Crypto.com claims 1:1 backing and multiple ISO, PCI DSS, and SOC control layers. Transparency is weakest around board structure, consolidated entity economics, headcount after the 2026 layoffs, and the precise bridge between
    group-level user marketing and active monetizing customers. Those are not cosmetic gaps; they directly affect later underwriting and valuation work.'
  claimRefs:
