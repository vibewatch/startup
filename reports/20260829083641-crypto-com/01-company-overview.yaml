chapter:
  number: 1
  title: Company Overview
  summary: Crypto.com is now best understood as a late-stage private crypto-financial platform with unusual breadth, real regulatory reach, and a newly priced institutional valuation, but still with material public-company-style transparency gaps on governance, active economics, and current headcount.
sections:
- id: identity-scale-and-scope
  title: Identity, scale, and current platform scope
  body: 'Crypto.com began in 2016 under the Monaco brand and now presents itself as a multi-surface crypto and financial-services platform rather than a single exchange product. The strongest current identity evidence comes from the company’s own about page and exchange surfaces: Crypto.com markets a mission of ‘Cryptocurrency in Every Wallet’, says it serves 150 million users across 90 countries, and highlights a platform spanning the Crypto.com App, Exchange, Pay, Visa card, Onchain wallet, tokenized stocks, prediction markets, and NFT workflows. Third-party exchange profiles broadly confirm the breadth but lag on scale definitions. CoinGecko describes the exchange business as launched in 2019 and registered in Malta, while CoinMarketCap says the exchange was launched three years after founding and now operates from Singapore. The diligence takeaway is that the business is unquestionably global and broad, but the company’s public surfaces still blend group-level marketing metrics, product-level
    facts, and legal-entity details in ways that later chapters must keep disentangled.'
  claimRefs:
  - CO001
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO003
  - CO009
  tableRefs:
  - TO004
  figureRefs:
  - FO002
  - FO003
- id: founders-leadership-and-location
  title: Founders, leadership, and organizational control points
  body: 'The best-supported founder record comes from a combination of the current about page and third-party company histories. Crypto.com’s current executive page explicitly identifies Kris Marszalek as co-founder and CEO, Rafael Melo as co-founder and CFO, and Bobby Bao as co-founder and head of Crypto.com Capital. Business of Apps and CoinMarketCap add Gary Or to the original founding roster and place the 2016 founding in Hong Kong before the business rebranded to Crypto.com in 2018. The current public leadership bench is broader than just the founders: Eric Anziani is presented as President and COO, and in June 2026 the company announced Iskandar Vanblarcum as managing director of the exchange to expand institutional distribution and regulated prediction-market and RWA offerings. What remains less transparent is formal governance. The public source set is rich on operating executives and product heads but thin on board composition, voting control, and legal-entity ownership, which is
    notable for a company now valued at $20 billion.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO002
  - CO014
  - CO015
  - CO016
  - CO017
  tableRefs:
