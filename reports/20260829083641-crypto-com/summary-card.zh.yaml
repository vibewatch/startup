  topStrengths:
    - 真正跨越多个触点的平台宽度：交易所、支付、卡、钱包、代币化资产和机构通道都有布局。
    - Citadel Securities 以 $20B 估值入场，提供了新的机构验证，而不只是沿用过时的私募市场标记。
