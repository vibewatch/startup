  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和 Crypto.com 要争夺的任务
        blocks:
          - type: paragraph
            body: >-
              Crypto.com 不在一个边界清晰的单一市场竞争。核心业务位于全球中心化加密交易所活动，但产品足迹已经延伸到加密支付、代币化股票入口、自托管钱包使用、商户结账，以及借助 Cronos 和 API
              界面延展的开发者基础设施。因此，更合适的市场边界是「全球数字资产金融基础设施」，其中有三类可变现任务：支撑零售和机构交易，支撑加密商业和付款，支撑 24/7 代币化资产分发。这一点重要，因为泛泛的「加密
              TAM」估计若不区分投机交易量、受监管的类托管使用、商户受理和开发者 /
              平台采用，就会夸大公司真实可变现界面。公开证据支持一个巨大且增长中的市场，但也显示流量高度集中在头部交易平台；广泛加密持有者与真正驱动可变现交易所或支付活动的人群之间，也有很大落差。
