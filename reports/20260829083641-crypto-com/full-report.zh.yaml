      - number: '7.4'
        title: 客户、声誉和披露风险
        blocks:
          - type: paragraph
            body: >-
              客户触达可见，但客户质量披露不可见。缺少公开留存、细分经济性、集中度或当前员工数，会在运营风险之上叠加信息风险。公司可以很大，但如果支持质量走弱、产品限制按辖区扩大，或信任事件复发，它仍可能比表面更脆。声誉风险在加密领域尤其重要，因为零售和商户信心可能比审计数据移动得更快。Crypto.com
              的公开证据说明它有实质强项，也说明在披露改善前，应维持较高剩余风险评级。换句话说，投资者被要求在缺少通常用于确认耐久性的完整仪表盘时，相信其战略宽度。可见增长与隐藏质量之间的不对称，本身就是核心尽调风险。悲观情景也可能由信心冲击驱动，程度不亚于正式报告的财务恶化。在披露改善前，外部投资者几乎必须把治理不透明与运营波动赋予同等权重。
