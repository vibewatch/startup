      - number: '8.4'
        title: 建议立场与剩余尽调
        blocks:
          - type: paragraph
            body: >-
              正确立场不是直接否定 $20 billion 标记，而是在更深尽调完成前，把它视为合理到略偏高。公司的业务宽度、规模信号、监管覆盖和战略融资，
              说明它不应相对低梯队交易所同业大幅折价。但缺少审计财务、资产负债表透明度、董事会透明度、商户 GMV 和留存指标，使高确信度溢价判断站不住。 从 IC 视角看，Crypto.com 应归入「认真研究 /
              观察」：足够强，值得投入工作；但透明度不够，不能只靠公开证据激进承销。下一笔尽调资源应该投向验证单位经济性、
              流动性和治理，而不是继续追逐更多表层合作伙伴头条。在这些关口打通前，当前估值标记可以视为可信，但只部分去风险。它适合作为尽调立场， 还不是现在就开空白支票。
            claimRefs:
              - CV021
              - CV014
              - CV015
