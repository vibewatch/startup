      - number: '8.3'
        title: 基准、悲观和乐观情景
        blocks:
          - type: paragraph
            body: >-
              如果收入代理指标被高估，活跃交易者深度低于 150 million 注册用户的宣传口径，支付和代币化股票等相邻业务仍有战略意义但经济贡献很小，
              或未来披露显示激励与合规挤压利润率，估值就会落到本轮以下的悲观情景。若 Crypto.com 确实是多条业务线并行、交易所经济性扎实、支付可选性可信， 且 Citadel
              验证了其机构角色正在扩大，那么围绕本轮估值的基准情景可以成立。要支撑高于本轮的乐观情景，私下尽调必须证明代币化资产、受监管支付和机构轨道正在复合成
              持久的高毛利增长，而不是只把业务表面铺宽。公开证据可以支撑一个估值区间；它无法完整证明乐观情景。实际产出应是一条区间，而不是一个点估值；区间上沿需要的证据， 远强于目前公开材料能给出的证据。
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
