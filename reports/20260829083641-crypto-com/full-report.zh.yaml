  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合和 Crypto.com 的位置
        blocks:
          - type: paragraph
            body: >-
              Crypto.com 面对的是交易所和加密金融平台混合竞争，而非单一同业组。Binance 仍是全球份额领先者；Coinbase 仍是美国上市公司中信任和披露最强的基准；Kraken
              以安全声誉和交易者工具竞争；OKX 以全球产品宽度和强衍生品资质竞争；Bybit 在交易导向价格和 VIP 分层上仍很激进。Crypto.com
              的差异化在于，它试图把消费者品牌触达、支付、卡片分发、交易所功能和相邻代币化资产轨道放进同一个品牌。结果是，一个比纯交易场所更宽、但透明度低于最佳上市可比公司的平台。实际问题不是 Crypto.com
              有没有竞争对手，而是其宽度能否抵消两项劣势：既不是全球成交量绝对龙头，也不是最干净的上市信任基准。另一个看法是按购买场景划分同业：谨慎的美国零售客户通常会拿 Crypto.com 与 Coinbase 或
              Kraken 比；重度交易者更可能拿它与 Binance、OKX 或 Bybit 比。这意味着 Crypto.com 必须同时赢下多套购买逻辑。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
