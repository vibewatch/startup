      - number: '8.2'
        title: 倍数逻辑和公开可比公司框架
        blocks:
          - type: paragraph
            body: >-
              沿用约 $1.5 billion 的 2024 年公开收入代理指标，$20 billion 标记意味着约 13.3x 的估值 /
              收入倍数。对一个已成规模、受监管、战略宽度较大的基础设施平台来说，这并不显然荒谬；但考虑到缺少经审计利润率、且加密交易有周期性，这个倍数仍偏激进。公开可比公司有助于框定区间。CompaniesMarketCap
              显示，截至 2026 年 8 月下旬，Coinbase 约为 $47.13 billion，Robinhood 约为 $93.73 billion；Yahoo Finance
              和其他市场数据界面显示的区间也相近。因此，Crypto.com 的 $20 billion 标记约相当于 Coinbase 市值的 40%-43%，约相当于 Robinhood 的 20%-21%。如果
              Crypto.com
              确实是一项已成规模、但透明度较低的全球基础设施资产，这个位置说得通；如果宽广产品叙事掩盖了弱利润率，或实际活跃经济性小于预期，这个位置就显得偏紧。可比公司分析因此只能给方向，不能机械套用，因为披露质量本身就是倍数的一部分。上市公司投资者关系和申报中心也会降低不确定性，这是私营发行人无法匹配的优势。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
