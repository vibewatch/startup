      - number: '2.2'
        title: 规模测算视角：交易活动、储备和可触达采用
        blocks:
          - type: paragraph
            body: >-
              最具体的市场规模视角来自交易所活动，而不是泛泛的加密市值。TokenInsight 称，2026 年 Q2 交易所总交易量为 $16.5 trillion，其中现货 $4.5 trillion、衍生品 $12.0
              trillion；衍生品仍占交易量的 73%。CoinGecko 的 2026 现货报告补充说，仅 2025 年，前 12 大中心化交易所处理了近 $21 trillion 的现货交易量，并在 2026 年初持有
              $225.4 billion 储备。这些市场体量巨大，但并非均可触达。Chainalysis 和 Gemini 显示，多国消费者加密货币持有率在增长；Business of Apps
              则暗示，相比标称用户数，Crypto.com 自身只从一个很薄的活跃交易者子集中变现。两者合起来意味着：漏斗顶部很大，但可触达的变现核心要小得多。因此，Crypto.com
              的市场测算需要多重视角：总交易活动、高价值交易人群、商户结账赋能，以及会采用代币化证券或受监管支付流、而不只是被动持有加密资产的用户子集。
