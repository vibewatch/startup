        title: 谁在哪些场景胜出，以及这意味着什么
        blocks:
          - type: paragraph
            body: >-
              没有一家同业能在所有购买标准上都占优。Binance 看起来在原始全球规模上最强，Coinbase 强在美国中心的信任和披露，Kraken 强在服务质量和声誉，OKX 强在宽广交易平台的成熟度，Bybit
              强在面向活跃交易者的激进交易所定价。当买方看重从消费者到交易者再到商户的一体化旅程、支付邻近性，以及跨地区受监管选择权时，Crypto.com
              对比最好。当买方想要上市公司级透明度，或者只是想要最深的全球份额和流动性网络效应时，Crypto.com 对比最弱。尽调上，应把 Crypto.com
              写成可信的一线偏上竞争者，且拥有少见的业务宽度；而不是该市场明确的主导平台。这个区别在投委会里很关键：一线偏上的
