              Vanblarcum 出任交易所董事总经理，用于扩展机构分销、受监管预测市场和 RWA
              产品。透明度较弱的是正式治理。公开资料对运营高管和产品负责人很丰富，但对董事会构成、投票控制权和法律实体所有权披露很薄；对一家如今估值 $20 billion 的公司，这一点值得注意。
