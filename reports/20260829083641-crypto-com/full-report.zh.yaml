      - number: '6.2'
        title: 客户真实性和规模证据
        blocks:
          - type: paragraph
            body: >-
              客户真实性是 Crypto.com 较强的公开属性之一。公司 About 页面披露 90 个国家的 150 million 用户，App Store 显示约 333,000 个评分下的 4.7
              评分，Business of Apps 估计 2024 年 App 下载量为 14.8 million，其中 42%
              来自美国。这些不是同一个指标，但合在一起证明了大众市场触达。商户和伙伴证据也强于许多私营交易所：Stripe、Emirates、Dubai Duty Free 和 REAL Jet 都提供外部可见证据，显示
              Crypto.com 正嵌入真实支付或旅行旅程。证据宽度很重要，因为它展示了不止一个界面的采用：不仅是 App
              安装，还有结账、旅行预订和机构托管式工作流。这种证据多样性降低了整个客户故事只是单一夸大营销指标的概率，也解释了公司为何有可能随时间在不止一条用户旅程上变现。
