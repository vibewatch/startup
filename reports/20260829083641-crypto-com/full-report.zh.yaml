              最有支撑的创始人记录来自当前 About 页面与第三方公司史的交叉印证。Crypto.com 现任高管页面明确列出 Kris Marszalek 为联合创始人兼 CEO，Rafael Melo 为联合创始人兼
              CFO，Bobby Bao 为联合创始人兼 Crypto.com Capital 负责人。Business of Apps 和 CoinMarketCap 又把 Gary Or 纳入最初创始团队，并把 2016
