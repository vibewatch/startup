      - number: '2.3'
        title: 买方细分、采用驱动因素和结构性约束
        blocks:
          - type: paragraph
            body: >-
              Crypto.com
              服务多类买方和用户，预算来源和采用触发点差异很大。零售交易者看重资产宽度、UX、杠杆、奖励和信任。机构更在意流动性深度、连接能力、结算质量和监管确定性。商户关注结账转化、法币结算、合规和集成难度。稳定币和代币化证券增长尤其关键，因为它们把这些人群接入更持久的
              24/7 金融工作流。Federal Reserve、BIS、Brookings 和 Visa
              的资料都指向同一方向：稳定币和代币化现金正与主流支付和国债市场基础设施更深绑定。但这些资料也强调政策摩擦、货币主权顾虑，以及稳定币里「同风险、同监管」原则的边界。这对 Crypto.com
              很重要，因为它的市场上行越来越依赖监管跟上 24/7 资产分发，而不只是周期性零售风险偏好。
