            body: >-
              公开牵引信号真实存在，但质量不均。Crypto.com 自有页面支撑 150 million 用户、90 个国家、超过 300,000 家 Pay 商户或店铺、350
              多种交易工具，以及代币化股票、旅行、预测市场和机构集成上的高产品速度。Business of Apps 补充了更适合投资测算、但置信度较低的经营视角：2024 年收入约 $1.5 billion、交易量约
              $750 billion、1.2 million 活跃交易者，以及 2024 年 14.8 million 次 App 下载。App Store 在 333,000 个评分中拿到
              4.7，为消费者规模提供证据，但不能直接说明变现质量。透明度在安全认证和储备验证工作流上最强，Crypto.com 声称 1:1 支持，并有多层 ISO、PCI DSS 和 SOC
              控制。透明度最弱的是董事会结构、合并实体经济、2026 年裁员后的员工数，以及集团级用户营销与活跃变现客户之间的精确桥梁。这些不是表面缺口；它们直接影响后续投资测算和估值工作。
