              长期被视为更依赖创始人融资和经营自筹。融资叙事如今与广泛的监管叙事交叉。公司官方披露显示：2023 年取得 Singapore Major Payment Institution 牌照，2025 年获得
              Malta MiCA 授权，2025 年 Dubai 衍生品牌照扩展，2026 年取得 UAE Stored Value Facilities
              牌照，使其可为政府服务提供受监管虚拟资产支付。这些批准是真正的战略资产，但不会抹掉反向历史：公开资料同样记录了 2024 年荷兰罚款上诉和 2026 年裁员，提醒投资者，合规覆盖和执行压力正在同步抬升。
