      - number: '6.3'
        title: 客户旅程和交叉销售路径
        blocks:
          - type: paragraph
            body: >-
              平台为初次获客后的扩张而设计。零售用户可以从 App 起步，进入交易所做高阶交易，采用卡片或用加密货币支付工作流，或迁移到 Onchain
              做自托管。商户可以从结账开始，之后采用订阅、付款或插件。机构用户可以从市场准入或托管开始，之后使用由合作伙伴分发的渠道。这种多界面旅程是真正优势，因为它创造了多个留存挂钩；但它也让公开队列分析更难，因为公司没有拆出转化或留存指标。换句话说，可见客户漏斗宽且可信，但每一步的经济性大多仍是私有信息，客户分析因此不能止于品牌触达。交叉销售逻辑在战略上有吸引力，正因为它能同时把上行和弱点藏在公开外部视野之外。
