      - number: '7.2'
        title: 安全、托管和运营风险
        blocks:
          - type: paragraph
            body: >-
              一家公司被托付客户资金并处理实时交易，安全和运营可靠性就是核心。Crypto.com 的公开控制姿态强于平均水平：零信任、安全
              SDLC、多项认证、已发布的储备表述和机构托管信息，都是正面因素。但门槛很高，不低。2022 年未授权活动事件、明确限定为仅银行倒闭时适用的 FDIC
              保护，以及同时运营交易所、支付、托管和钱包界面的复杂性，都让剩余风险维持在高位。储备证明改善客户信心；它不能抹掉运营或偿付能力风险。每新增一个产品界面，都会多一条错误、延迟、宕机或集成失败影响用户的路径。在混合托管与交易的业务里，即便短暂事件也可能留下长期声誉后果。公开控制组合令人鼓舞，但外部读者仍无法像阅读上市公司披露那样，验证内部损失场景、恢复演练或异常量。
