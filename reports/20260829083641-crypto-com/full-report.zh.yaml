      - number: '2.4'
        title: 什么会限制采用和市场获取
        blocks:
          - type: paragraph
            body: >-
              主要采用约束是集中度、监管、信任和渠道摩擦。TokenInsight 显示，最大交易平台仍在整合份额，意味着规模会继续复利。CoinGecko 和 CoinMarketCap
              都显示，储备更深、流动性更好、产品更宽的交易所会拿到不成比例的流量。与此同时，BIS、Federal Reserve 和 Brookings
              的资料显示，稳定币和代币化资产的政策边界仍在演进；这既可能帮助既有平台，也可能拖慢终端市场转化。对商户而言，支付采用取决于结算可靠性和监管，程度不亚于加密热情。对机构用户而言，法律确定性和托管架构可能比表面品牌知名度更重要。如果市场继续走向多资产、全天候金融轨道，Crypto.com
              位置不错。若监管进一步按地区碎片化，或用户增长宽而浅，只有小部分可变现人群转化为高价值交易和支付使用，它的位置就会弱一些。
