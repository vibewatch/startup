      - number: '3.2'
        title: 产品和定价重叠
        blocks:
          - type: paragraph
            body: >-
              重叠最重的是交易所核心。Crypto.com、Coinbase、Kraken、OKX 和 Bybit 都使用按近期交易量分层的 maker-taker 定价模型，但 Crypto.com
              比较特殊：它明确把费率优势与 CRO 余额绑定，并在满足余额要求时让入门层级也享有 0% maker 费。这个设计可以拉新，但也让经济性部分挂钩代币。产品重叠不止现货：Crypto.com
              营销现货、保证金、永续、期货、预测市场数据、代币化股票和机构 API。OKX 和 Bybit 同样覆盖多种工具；Coinbase 在美国信任和上市公司报告上强于前沿产品宽度；Kraken
              强调支持、安全和交易者工具。Crypto.com 的产品挑战在于，它必须足够宽，才能留住重度用户；又不能复杂到损害主流消费者信任。
