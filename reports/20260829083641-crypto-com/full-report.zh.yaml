  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点及其重要性
        blocks:
          - type: paragraph
            body: >-
              Crypto.com 在大型私营加密平台中比较少见，因为它的当前估值锚点不是上一轮牛市留下的旧融资，而是 2026 年 7 月的新机构融资。公司和独立媒体一致认为，Citadel Securities 以 $20
              billion 估值投资 $400
              million；公司称这笔交易是首轮机构融资。它立刻给了投资者一个当前市场定价锚，但不是最终答案。单一战略投资者轮次可以验证基础设施故事的下限信心，却不能证明公开市场投资者或更广泛的私募投资团会接受同一价格。因此，估值起点是一个真实的
              $20 billion 标记，同时必须打上核心财务披露稀疏的折扣。新的定价事件有价值，因为它大幅降低旧估值风险；但它仍未说明这一轮是否反映广泛共识、治理让步，或特定战略选择权。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
