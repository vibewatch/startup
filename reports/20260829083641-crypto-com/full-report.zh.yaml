            body: >-
              Crypto.com 仍是私营公司，没有公开的经审计合并财务报表，因此财务图景只能三角测算，无法直接观察。最有用的公开锚点包括：2026 年 7 月 Citadel 以 $20 billion 估值投资 $400
              million；Business of Apps 对 2024 年 $1.5 billion 收入和 $750 billion
              交易量的估计；交易所费率表；以及公司自有产品文档，显示其在交易所交易、支付、卡片权益、代币化股票、机构
              API、相邻托管或合作伙伴渠道中的变现界面。这足以勾勒可信的商业模式和粗略规模区间，但不足以有把握地测算常态化利润率、现金生成或资本效率。也就是说，任何看似精确的结论都应被当作区间判断。新价格锚有用，但没有审计支撑的价格锚仍可能掩盖弱利润率、异常营运资本需求，或那些战略上有趣、财务上无足轻重的产品线。
