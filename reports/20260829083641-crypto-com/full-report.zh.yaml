  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是最持久的单一类别。Crypto.com
              的运营模式依赖它在多个辖区、按产品划分的规则，以及围绕交易所、衍生品、稳定币、代币化资产和支付的快速政策变化中穿行。公司拥有有分量的牌照和注册，但它们只能降低、不能消除法律风险。荷兰罚款争议、按辖区定制条款和风险声明的需求，以及
              SEC 和 CFTC
              执法背景，都说明公司仍暴露在法律解释变化中。一家公司若试图连接零售加密、机构交易和受监管支付，就必然在每个产品待遇不同的地区背上法律复杂性。即便拿到牌照，持续监管、报告义务和范围限制仍可能约束产品推出并抬高成本。这一点重要，因为快速增长的平台可能需要逐国本地化产品、披露、杠杆设置和客户开户工作流，而不能依赖一个全球运营模板。
            claimRefs:
              - CR001
