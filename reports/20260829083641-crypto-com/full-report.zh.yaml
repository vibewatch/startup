    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、规模和当前平台范围
        blocks:
          - type: paragraph
            body: >-
              Crypto.com 2016 年以 Monaco 品牌起步，如今呈现为一个多界面的加密与金融服务平台，而不是单一交易所产品。当前身份最强证据来自公司 About 页面和交易所页面：Crypto.com
              宣称使命是「让每个钱包都装有加密货币」，称服务 90 个国家的 150 million 名用户，并强调平台覆盖 Crypto.com App、Exchange、Pay、Visa 卡、Onchain
              钱包、代币化股票、预测市场和 NFT 工作流。第三方交易所资料大体确认了业务宽度，但在规模定义上滞后。CoinGecko 将交易所业务描述为 2019 年上线、注册地在 Malta；CoinMarketCap
              则称交易所在公司创立三年后推出，如今从 Singapore 运营。尽调结论是：公司无疑全球化且业务很宽，但公开页面仍把集团级营销指标、产品级事实和法律实体细节混在一起，后续章节必须持续拆开看。
