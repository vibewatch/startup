  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户是谁
        blocks:
          - type: paragraph
            body: >-
              Crypto.com 同时服务几类客户。漏斗顶部是使用消费者 App 和卡生态的大众用户。更窄的活跃交易人群使用交易所和相邻高阶交易产品。商户以及旅行或零售伙伴使用 Pay
              栈。机构和专业伙伴则出现在托管、TradingView
              和交易所连接工作流中。公开证据支持这些人群都存在，但没有说明它们的精确收入结构或留存曲线。这一区别很重要：客户多元化是优势，因为它降低对单一用例的依赖；但也提高了理解门槛，投资者必须分清哪些人群真正变现，哪些主要是战略分销渠道。实际尽调中，应把公司看作有几本相互重叠的客户账，而不是一个统一客户群、外加一个给全球投资者使用的干净
              KPI 定义。
