      - number: '6.4'
        title: 质量信号和开放风险
        blocks:
          - type: paragraph
            body: >-
              客户质量信号正面但不完整。评分、商户标识和真实伙伴上线显示了真实采用。但公开记录仍缺少已入金账户留存、NPS、商户 GMV、机构集中度或队列流失。反向历史也重要：2022 年提现事件和 2026
              年裁员提醒投资者，即便客户基础已成规模，仍可能面对可靠性和服务风险。因此，客户尽调应拆分触达与深度。Crypto.com
              已证明它能获取并吸引多类用户；它尚未公开证明每个细分的留存经济性。这也是客户章节最终支持兴趣、而非完整确信的原因：证据足以认真看待这门生意，但不足以精确打分客户耐久性。对投资者来说，剩下的主要任务，是把广泛使用证据转化为细分层面的质量证据。在这座桥出现之前，客户宽度应被视为鼓励性证据，而不是单独决定承保结论的证明。
