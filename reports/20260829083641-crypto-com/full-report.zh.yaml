companyProfile:
  summary: >-
    Crypto.com 是一家全球加密金融平台，2016 年以 Monaco 品牌创立，后更名为 Crypto.com。如今业务覆盖消费者 App、交易所、支付栈、Visa
    卡生态、自托管钱包、代币化股票、预测市场数据，以及面向机构的连接和托管界面。公司披露在 90 个国家拥有 150 million 名用户；2026 年 7 月，Citadel Securities 以 $20 billion
    估值投资 $400 million，成为公司首轮机构融资；公司还在新加坡、EEA、UAE 等辖区建立了有分量的监管布局。公开证据能够支撑真实规模和业务宽度，但财务透明度仍明显不足。
