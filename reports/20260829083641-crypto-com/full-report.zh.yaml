      - number: '7.3'
        title: 商业模式和战略风险
        blocks:
          - type: paragraph
            body: >-
              公司的业务宽度同时带来护城河和脆弱性。Crypto.com 暴露于市场周期性、衍生品集中、活跃交易者竞争、代币经济复杂性，以及支付或代币化股票等相邻业务在叙事上有战略意义、但财务规模小于暗示的风险。2026
              年裁员显示，成本纪律仍是一个活跃挑战。公司也依赖关键领导层，并可能难以证明众多产品界面提供的是连贯价值，而不是运营蔓延。增长放缓时，宽度很快会从护城河变成成本负担。因此，投资者不仅要承保规模，也要承保管理层判断哪些业务值得持续投入的能力。宽广路线图只有在管理层能保持高执行标准、同时抵制靠补贴堆出低质量交易量时，才有吸引力。
