      - number: '3.4'
        title: Who wins where and what that means
        blocks:
          - type: paragraph
            body: >-
              No single peer dominates every buying criterion. Binance appears strongest on raw global scale, Coinbase
              on U.S.-centric trust and disclosure, Kraken on service quality and reputation, OKX on broad
              trading-platform sophistication, and Bybit on aggressive exchange pricing for active traders. Crypto.com
              compares best when the buyer values an all-in-one consumer-to-trader-to-merchant journey, payments
              adjacency, and regulated optionality across regions. It compares worst when the buyer wants
              public-company-grade transparency or simply the deepest global share and liquidity network effects. For
              diligence purposes, Crypto.com should be underwritten as a credible upper-tier competitor with unusual
              breadth, not as the clearly dominant venue in its market. That distinction matters in investment
              committees: upper-tier franchises can still be attractive, but they usually require price discipline and
              clearer evidence of category leadership before investors should underwrite them like the market-defining
              winner.
