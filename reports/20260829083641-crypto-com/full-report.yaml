  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: What is publicly knowable about the financial picture
        blocks:
          - type: paragraph
            body: >-
              Crypto.com is still a private company with no public audited consolidated financial statements, so the
              financial picture must be triangulated rather than observed directly. The most useful public anchors are
              the July 2026 $400 million Citadel investment at a $20 billion valuation, Business of Apps’ 2024 estimate
              of $1.5 billion of revenue and $750 billion of transaction volume, the exchange fee schedule, and the
              company’s own product documentation showing monetization surfaces in exchange trading, payments,
              card-linked benefits, tokenized stocks, institutional APIs, and adjacent custody or partner channels. This
              is enough to outline a credible business model and rough scale band, but not enough to underwrite
              normalized margins, cash generation, or capital efficiency with confidence. It also means every apparently
              precise conclusion should be treated as a range judgment. A fresh price anchor is useful, but a price
              anchor without audited support can still conceal weak margins, unusual working-capital needs, or product
              segments that are strategically interesting and financially immaterial.
