      - number: '2.4'
        title: What could constrain adoption and market capture
        blocks:
          - type: paragraph
            body: >-
              The main adoption constraints are concentration, regulation, trust, and channel friction. TokenInsight
              shows that the largest venues continue to consolidate market share, meaning scale compounds. CoinGecko and
              CoinMarketCap both indicate that exchanges with deeper reserves, better liquidity, and broader product
              breadth capture disproportionate flow. At the same time, BIS, Federal Reserve, and Brookings sources show
              that the policy perimeter around stablecoins and tokenized assets is still evolving, which can both help
              incumbents and slow end-market conversion. For merchants, payment adoption depends on settlement
              reliability and regulation as much as on crypto enthusiasm. For institutional users, legal certainty and
              custody architecture can matter more than headline brand awareness. Crypto.com is well positioned to
              benefit if markets keep moving toward multi-asset, always-on financial rails. It is less well positioned
              if regulation fragments further by region or if user growth stays broad but shallow, with only a small
              monetizing cohort converting to high-value trading and payment usage.
            claimRefs:
              - CM004
              - CM030
              - CM031
              - CM027
              - CM015
              - CM029
