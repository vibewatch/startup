      - number: '4.2'
        title: How Crypto.com likely monetizes
        blocks:
          - type: paragraph
            body: >-
              The monetization logic is diversified even if disclosure is not. The clearest direct revenue engine is
              exchange trading fees, where the fee schedule shows maker-taker pricing, VIP tiers, CRO-linked discounts,
              and liquidation fees. The exchange and API surfaces also show margin, perpetuals, futures, OTC, and
              prediction-market data as monetizable workflows. The Pay documentation indicates merchant-facing payment
