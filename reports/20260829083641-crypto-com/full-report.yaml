            body: >-
              A bear case below the current round would emerge if the revenue proxy is too high, if active-trader depth
              is thinner than the 150 million user headline suggests, if payments and tokenized-stock adjacencies remain
              strategically interesting but economically small, or if future disclosure reveals margin pressure from
              incentives and compliance. A base case around the current round is justified if Crypto.com is indeed a
              multi-line business with real exchange economics, credible payments optionality, and a widening
              institutional role validated by Citadel. A bull case above the current round requires private diligence to
              show that tokenized assets, regulated payments, and institutional rails are compounding into durable
              high-margin growth rather than simply broadening surface area. Public evidence can support a range; it
              cannot fully prove the bull case. The practical output is a band, not a point estimate, with the upper end
              needing much stronger evidence than public materials currently provide.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
          - type: table
            tableRef: TV004
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV005
            claimRefs:
              - CV009
              - CV015
              - CV020
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV044
              - CV019
      - number: '8.4'
        title: Recommendation stance and remaining diligence
        blocks:
          - type: paragraph
            body: >-
              The right stance is not to reject the $20 billion mark outright, but to treat it as
              fair-to-slightly-stretched pending deeper diligence. The company’s breadth, scale signals, regulatory
              footprint, and strategic financing argue against a deep discount to lower-tier exchange peers. Yet the
              lack of audited financials, balance-sheet visibility, board transparency, merchant GMV, and retention
              metrics prevents a high-conviction premium call. In IC terms, Crypto.com earns a serious-investigate /
              track rating: strong enough to merit work, but not transparent enough to underwrite aggressively on public
              evidence alone. The next diligence dollar should go toward validating unit economics, liquidity, and
              governance rather than looking for still more top-line partnership headlines. Until those gates clear, the
              current mark should be treated as credible but only partially de-risked. That is a workable stance for
              diligence, not a blank check for now.
            claimRefs:
              - CV021
              - CV014
              - CV015
              - CV022
          - type: table
            tableRef: TV006
            claimRefs:
              - CV022
              - CV015
          - type: figure
            figureRef: FV005
            claimRefs:
              - CV014
              - CV001
              - CV015
              - CV021
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The $20B mark is real—but it is not the whole story
            body: >-
              A fresh institutional round is far more meaningful than a stale historical mark, yet it still needs to be
              tested against margin quality, retention depth, and balance-sheet strength.
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV015
          - type: callout
            title: The multiple is hard to defend without private proof
            body: >-
              At roughly 13x a third-party revenue proxy, the current mark requires confidence that Crypto.com is more
              than a cyclical exchange with marketing scale.
            calloutType: risk
            claimRefs:
              - CV009
              - CV019
