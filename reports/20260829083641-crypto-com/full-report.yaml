  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and where Crypto.com fits
        blocks:
          - type: paragraph
            body: >-
              Crypto.com competes against a mixed set of exchanges and crypto-financial platforms rather than a single
              peer group. Binance remains the global share leader, Coinbase remains the strongest U.S.-listed trust and
              disclosure benchmark, Kraken competes on security reputation and trader tooling, OKX competes on broad
              global product breadth with strong derivatives credentials, and Bybit remains aggressive on
              trading-centric price and VIP segmentation. Crypto.com is differentiated by trying to combine
              consumer-brand reach, payments, card distribution, exchange functionality, and adjacent tokenized-asset
              rails in one brand. The result is a platform that is broader than a pure trading venue but less
              transparent than the best public comp. The practical question is not whether Crypto.com has competitors;
              it is whether its breadth offsets the disadvantages of being neither the dominant global volume leader nor
              the cleanest listed trust benchmark. Another way to frame the peer set is by purchase context: a cautious
              U.S. retail customer will usually compare Crypto.com with Coinbase or Kraken, while a power trader is more
              likely to compare it with Binance, OKX, or Bybit. That means Crypto.com is forced to win across multiple
              buying logics at the same time.
            claimRefs:
              - CP001
              - CP002
              - CP003
