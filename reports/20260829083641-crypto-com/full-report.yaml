      - number: '8.2'
        title: Multiple logic and public comp framing
        blocks:
          - type: paragraph
            body: >-
              Using the retained public revenue proxy of about $1.5 billion for 2024, the $20 billion mark implies a
              roughly 13.3x valuation-to-revenue multiple. That is not obviously absurd for a scaled, regulated,
              strategically broad infrastructure platform, but it is aggressive given the absence of audited margins and
              the cyclicality of crypto trading. Public comps help bound the range. CompaniesMarketCap pegs Coinbase at
              roughly $47.13 billion and Robinhood at about $93.73 billion as of late August 2026, while Yahoo Finance
              and other market-data surfaces show similar bands. Crypto.com’s $20 billion mark therefore sits at roughly
              40%-43% of Coinbase’s market cap and roughly 20%-21% of Robinhood’s. That feels plausible if Crypto.com is
              genuinely a scaled but less transparent global infrastructure asset; it feels stretched if the broad
              product narrative is masking weaker margins or smaller active economics than expected. The comp exercise
              is therefore directional, not mechanical, because disclosure quality is itself part of the multiple.
              Public-company investor-relations and filing hubs also reduce uncertainty in a way private issuers cannot
              match.
