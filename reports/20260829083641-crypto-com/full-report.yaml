      - number: '3.2'
        title: Product and pricing overlaps
        blocks:
          - type: paragraph
            body: >-
              The overlap is heaviest in the exchange core. Crypto.com, Coinbase, Kraken, OKX, and Bybit all use tiered
              maker-taker pricing models linked to recent volume, but Crypto.com is unusual in explicitly tying fee
              advantages to CRO balance and offering 0% maker fees at entry tiers when balance requirements are met.
              That design can be an acquisition lever but also makes economics partially token-linked. Product overlap
              extends beyond spot: Crypto.com markets spot, margin, perpetuals, futures, prediction-market data,
              tokenized stocks, and institutional APIs. OKX and Bybit are similarly multi-instrument, while Coinbase is
              stronger in U.S. trust and public-company reporting than in frontier product breadth. Kraken emphasizes
              support, security, and trader tooling. Crypto.com’s product challenge is that it must remain broad enough
              to retain power users without becoming too operationally complex for mainstream consumer trust.
