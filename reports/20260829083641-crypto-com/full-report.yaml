  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the jobs Crypto.com is trying to win
        blocks:
          - type: paragraph
            body: >-
              Crypto.com does not compete in a single neatly bounded market. The core business sits in global
              centralized crypto exchange activity, but the product footprint now extends into crypto-enabled payments,
              tokenized-stock access, self-custody wallet usage, merchant checkout, and adjacent developer
              infrastructure through Cronos and API surfaces. The right market boundary is therefore ‘global
              digital-asset financial infrastructure’ with three monetizable jobs-to-be-done: enabling retail and
              institutional trading, enabling crypto-linked commerce and payouts, and enabling 24/7 tokenized-asset
              distribution. This matters because generic ‘crypto TAM’ estimates can overstate the company’s real
              monetization surface if they fail to distinguish between speculative trading volume, regulated
              custody-like usage, merchant acceptance, and developer/platform adoption. The public evidence supports a
              large and growing market, but it also shows strong concentration in the largest venues and a wide gap
              between broad crypto ownership and the narrower population that actually drives monetizable exchange or
              payment activity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
