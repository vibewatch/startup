        title: Identity, scale, and current platform scope
        blocks:
          - type: paragraph
            body: >-
              Crypto.com began in 2016 under the Monaco brand and now presents itself as a multi-surface crypto and
              financial-services platform rather than a single exchange product. The strongest current identity evidence
              comes from the company’s own about page and exchange surfaces: Crypto.com markets a mission of
              ‘Cryptocurrency in Every Wallet’, says it serves 150 million users across 90 countries, and highlights a
              platform spanning the Crypto.com App, Exchange, Pay, Visa card, Onchain wallet, tokenized stocks,
              prediction markets, and NFT workflows. Third-party exchange profiles broadly confirm the breadth but lag
              on scale definitions. CoinGecko describes the exchange business as launched in 2019 and registered in
              Malta, while CoinMarketCap says the exchange was launched three years after founding and now operates from
              Singapore. The diligence takeaway is that the business is unquestionably global and broad, but the
              company’s public surfaces still blend group-level marketing metrics, product-level facts, and legal-entity
              details in ways that later chapters must keep disentangled.
