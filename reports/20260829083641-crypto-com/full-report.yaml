  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation anchor and why it matters
        blocks:
          - type: paragraph
            body: >-
              Crypto.com is unusual among large private crypto platforms because its current valuation anchor is not a
              stale bull-market round but a fresh July 2026 institutional financing. The company and independent press
              agree that Citadel Securities invested $400 million at a $20 billion valuation, and the company described
              the deal as its first institutional funding round. That immediately gives investors a current market-based
              anchor, but not a definitive one. One strategic investor round can validate floor confidence in the
              infrastructure story without proving that public-market investors or a broad private syndicate would clear
              at the same price. The starting point for valuation is therefore a real $20 billion mark—tempered by the
              fact that core financial disclosure remains sparse. A fresh priced event is valuable because it sharply
              reduces stale-mark risk, but it still leaves open whether the round reflected broad consensus, governance
              concessions, or specific strategic optionality.
