      - number: '2.3'
        title: Buyer segments, adoption drivers, and structural constraints
        blocks:
          - type: paragraph
            body: >-
              Crypto.com serves multiple buyer and user groups whose budgets and adoption triggers differ sharply.
              Retail traders respond to asset breadth, UX, leverage, rewards, and trust. Institutions care more about
              liquidity depth, connectivity, settlement quality, and regulatory certainty. Merchants care about checkout
              conversion, fiat settlement, compliance, and ease of integration. Stablecoin and tokenized-securities
              growth are particularly important because they connect these groups to more durable 24/7 financial
              workflows. Federal Reserve, BIS, Brookings, and Visa sources all point in the same direction: stablecoins
              and tokenized cash are becoming more intertwined with mainstream payment and Treasury-market
              infrastructure. Yet the same sources also stress policy friction, monetary-sovereignty concerns, and the
              limits of ‘same risk, same regulation’ in stablecoins. That matters for Crypto.com because its market
              upside increasingly depends on regulation catching up to 24/7 asset distribution rather than only on
              cyclical retail risk appetite.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM018
              - CM019
              - CM020
