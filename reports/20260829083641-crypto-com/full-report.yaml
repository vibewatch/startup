companyProfile:
  summary: >-
    Crypto.com is a global crypto-financial platform founded in 2016 under the Monaco brand and later rebranded to
    Crypto.com. It now spans a consumer app, exchange, payments stack, Visa card ecosystem, self-custody wallet,
    tokenized stocks, prediction-market data, and institutional connectivity and custody surfaces. The company reports
    150 million users across 90 countries, raised its first institutional round in July 2026 when Citadel Securities
    invested $400 million at a $20 billion valuation, and has built a meaningful regulatory footprint across Singapore,
    EEA, UAE, and other jurisdictions. Public evidence supports real scale and breadth, but financial transparency
    remains materially incomplete.
