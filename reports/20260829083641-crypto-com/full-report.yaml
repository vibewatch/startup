        title: Exhibits
        blocks:
          - type: callout
            title: The right market is not “crypto”; it is monetizable digital-asset infrastructure
            body: >-
              Crypto.com participates where trading, payments, and tokenized-asset distribution meet. That is a better
              diligence frame than a single speculative crypto TAM.
            calloutType: insight
            claimRefs:
