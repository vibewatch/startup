        title: Capital, liquidity, and balance-sheet read
        blocks:
          - type: paragraph
            body: >-
              Capital visibility is strongest around the new institutional funding and reserve language, not around
              GAAP-style balance-sheet detail. The Citadel round provides a fresh capital marker and signals external
              confidence in the infrastructure story. Separately, Crypto.com says customer assets are backed 1:1, held
              in institutional-grade reserve accounts, and auditable via proof-of-reserves workflows. U.S. fiat balances
              are said to sit with network banks and enjoy pass-through FDIC protection only if a bank fails, not if
              Crypto.com itself fails. These disclosures help frame custody practices but do not substitute for audited
              liquidity, debt, equity, or legal-entity cash balances. Investors should distinguish reserve attestations
              and custody controls from enterprise solvency disclosure. The practical implication is that customer-asset
              trust may be better evidenced than enterprise-level durability, which is the reverse of what public-market
