      - number: '2.2'
        title: 'Sizing lenses: exchange activity, reserves, and addressable adoption'
        blocks:
          - type: paragraph
            body: >-
              The most concrete market-size lens comes from exchange activity rather than generic crypto market
              capitalization. TokenInsight says total exchange trading volume in Q2 2026 was $16.5 trillion, of which
              $4.5 trillion was spot and $12.0 trillion derivatives, while derivatives still represented 73% of volume.
              CoinGecko’s 2026 spot report adds that the top 12 centralized exchanges processed nearly $21 trillion of
              spot volume in 2025 alone and held $225.4 billion of reserves by early 2026. Those are enormous markets,
              but they are not evenly accessible. Chainalysis and Gemini show that consumer crypto ownership is growing
              across countries, while Business of Apps suggests Crypto.com itself monetizes only a thin active-trader
              subset relative to headline users. That combination implies a large top-of-funnel opportunity but a much
              smaller addressable monetization core. Market sizing for Crypto.com therefore needs multiple lenses: gross
              exchange activity, high-value trading cohorts, merchant checkout enablement, and the subset of users who
              will adopt tokenized securities or regulated payment flows rather than just hold crypto passively.
