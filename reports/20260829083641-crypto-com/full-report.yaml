      - number: '1.3'
        title: Funding, valuation, and regulatory inflection points
        blocks:
          - type: paragraph
            body: >-
              The single most important new company-overview fact is the July 2026 Citadel Securities transaction.
              Crypto.com and three independent news sources align that Citadel invested $400 million at a $20 billion
              valuation, and the company itself states that this was its first institutional funding round in a
              decade-long history. That matters because Crypto.com had long been viewed as largely founder-financed and
              operationally self-funded relative to major venture-backed peers. The funding narrative now intersects
              with a broad regulatory narrative. Official company disclosures show a 2023 Singapore Major Payment
              Institution license, a 2025 MiCA authorization in Malta, a 2025 Dubai derivatives-license expansion, and a
              2026 UAE Stored Value Facilities license that enables regulated virtual-asset payments for government
              services. Those approvals are real strategic assets, but they do not eliminate adverse history: public
              sources also document a 2024 Dutch fine appeal and 2026 layoffs, reminding investors that compliance
              breadth and execution pressure are rising in parallel.
