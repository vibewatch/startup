            body: >-
              Crypto.com’s product stack is wider than many private crypto peers. The company currently markets consumer
              trading in the main app, advanced trading in the exchange, a Visa card program, a merchant payment stack,
              a self-custodial onchain wallet, an NFT marketplace, tokenized stocks, prediction markets, institutional
