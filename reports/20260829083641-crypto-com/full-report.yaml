  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the single most persistent category. Crypto.com’s operating model depends on
              navigating many jurisdictions, product-specific rules, and fast-changing policy around exchanges,
              derivatives, stablecoins, tokenized assets, and payments. The company has meaningful licenses and
              registrations, but those reduce rather than eliminate legal risk. The Dutch fine dispute, the need for
              jurisdiction-specific terms and risk statements, and the presence of SEC and CFTC enforcement backdrops
              all show how exposed the company remains to changing legal interpretations. A company trying to bridge
              retail crypto, institutional trading, and regulated payments inevitably carries legal complexity in every
              region where those products are treated differently. Even when a licence is obtained, ongoing supervision,
              reporting, and scope limits can still constrain product rollout and raise cost. That matters because a
              fast-growing platform may need to localize products, disclosures, leverage settings, and customer
              onboarding workflows country by country instead of relying on one global operating template.
