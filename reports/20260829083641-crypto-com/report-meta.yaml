  topStrengths:
  - Real multi-surface platform breadth spanning exchange, payments, card, wallet, tokenized assets, and institutional rails.
  - Fresh institutional validation from Citadel Securities at a $20B valuation rather than only stale private-market marks.
  - Meaningful regulatory breadth across Singapore, EEA, UAE, and other jurisdictions supports strategic optionality.
  topRisks:
  - No audited public financials, segment economics, or board-level governance transparency for a company at this scale.
  - High residual exposure to regulatory fragmentation, security/custody risk, and global exchange competition.
  - Customer breadth is visible, but retention, merchant GMV, and institutional concentration remain mostly private.
  unresolvedGaps:
  - Audited revenue, margins, cash, and debt by legal entity and product line.
  - Merchant GMV, take rates, and payments retention.
  - Funded-account retention, active-trader depth, and cohort monetization quality.
  - Current headcount, board composition, and control-rights schedule after the Citadel round.
