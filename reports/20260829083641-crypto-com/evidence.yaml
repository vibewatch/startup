evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, investor rights schedule, and legal-entity ownership chart.
    whyItMatters: >-
      Control rights, board oversight, and related-party economics matter materially once a private company is valued at
      $20 billion.
    diligencePath: Request cap table, board composition, director appointments, and intercompany ownership documents.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited consolidated revenue, margin, cash, and entity-level balance-sheet data.
    whyItMatters: Public revenue proxies are low-confidence and not sufficient for underwriting a private-market price.
    diligencePath: Request audited financial statements and a product-line revenue bridge.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
