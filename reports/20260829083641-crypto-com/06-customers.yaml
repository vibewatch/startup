company:
  name: Crypto.com
chapter:
  number: 6
  title: Customers
  summary: Crypto.com has unusually broad public customer proof for a private crypto platform across consumer, merchant, travel, and institutional segments, but retention, GMV, and concentration data remain mostly private.
sections:
- id: who-the-customers-are
  title: Who the customers are
  body: 'Crypto.com serves several customer classes at once. At the top of funnel are mass-market users of the consumer app and card ecosystem. A narrower active-trading cohort uses the exchange and adjacent advanced-trading products. Merchants and travel or retail partners use the Pay stack. Institutions and professional partners show up through custody, TradingView, and exchange-connectivity workflows. The public evidence supports the existence of all of these cohorts, but not their exact revenue mix or retention profiles. That is an important distinction: customer diversity is a strength because it reduces reliance on one use case, but it also raises the bar for understanding which cohorts are truly monetizing and which are mainly strategic distribution channels. In practical diligence, the company should be thought of as having several overlapping customer books rather than one unified customer base with one clean KPI definition for investors globally.'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof-of-customer-reality
  title: Proof of customer reality and scale
  body: 'Customer reality is one of Crypto.com’s stronger public attributes. The company’s about page reports 150 million users across 90 countries, the App Store shows a 4.7 rating across roughly 333,000 ratings, and Business of Apps estimates 14.8 million app downloads in 2024 with 42% from the United States. Those are not the same metric, but together they prove mass-market reach. Merchant and partner proof is also stronger than for many private exchanges: Stripe, Emirates, Dubai Duty Free, and REAL Jet all provide externally visible evidence that Crypto.com is being embedded into real payment or travel journeys. The breadth of proof matters because it shows adoption across more than one surface: not only app installs, but also checkout, travel booking, and institutional custody style workflows. That diversity of evidence lowers the chance that the entire customer story is just one inflated marketing metric. It also helps explain why the company can plausibly monetize across more than
    one user journey over time too.'
  claimRefs:
  - CU003
  - CU008
  - CU009
  - CU010
  - CU012
  - CU013
  - CU014
  - CU015
  tableRefs:
  - TU003
  - TU005
  figureRefs:
  - FU002
  - FU003
- id: customer-journeys-and-expansion
  title: Customer journeys and cross-sell paths
  body: The platform is built for expansion after initial acquisition. A retail user can start in the app, move into the exchange for advanced trading, adopt the card or pay-with-crypto workflows, or migrate into self-custody via Onchain. Merchants can begin with checkout and later adopt subscriptions, payouts, or plugins. Institutional users can begin with market access or custody and later use partner-distributed channels. This multi-surface journey is a real strength because it creates multiple retention hooks, but it also makes public cohort analysis harder because the company does not break out conversion or retention metrics. In other words, the visible customer funnel is broad and plausible, but the economics of each step remain mostly private, which is why customer analysis cannot stop at brand reach alone. The cross-sell logic is strategically attractive precisely because it can hide both upside and weakness from public outsiders.
  claimRefs:
  - CU018
  - CU020
  - CU021
  - CU019
  - CU022
  tableRefs:
  - TU002
  figureRefs:
  - FU004
- id: quality-signals-and-open-risks
  title: Quality signals and open risks
  body: 'Customer quality signals are positive but incomplete. Ratings, merchant logos, and live partner launches show real adoption. Yet the public record still lacks funded-account retention, NPS, merchant GMV, institutional concentration, or cohort churn. Adverse history matters too: the 2022 withdrawal incident and the 2026 layoffs remind investors that a scaled customer base can still face reliability and service risk. Customer diligence should therefore separate reach from depth. Crypto.com has proven that it can acquire and attract many kinds of users; it has not publicly proven retention economics for each segment. That is why the customer chapter ultimately supports interest, not full conviction: there is enough evidence to take the business seriously, but not enough to score customer durability precisely. For investors, the main remaining task is to convert broad proof-of-use into segment-level quality proof. Until that bridge exists, customer breadth should be treated as encouraging
    evidence rather than decisive underwriting proof on its own.'
  claimRefs:
  - CU023
  - CU028
  - CU029
  - CU024
  - CU025
  tableRefs:
  - TU004
  figureRefs: []
