      - number: '8.2'
        title: 资本化历史、私人市场估值与 S-1 注册动态
        blocks:
          - type: paragraph
            body: >-
              Kraken 的资本化历史体现出两条分化的估值轨迹：一级财团融资轮与私人二级交易各自定价 [CV001, CV003, CV011, CV013]。2025 年末和 2026 年中完成的一级融资成功建立并守住了
              $20 billion 的 headline 股权估值：2025 年 11 月完成 $800 million 战略融资，其中 $200 million 由 Citadel Securities 领投，Jane
              Street、DRW Trading 和 Apollo Global Management 共同参与；随后在 2026 年 5 月完成 $300 million 的 pre-IPO tranche [CV003,
              CV013]。TechStackIPO 等公开聚合平台追踪到一份 2026 年 9 月向 SEC 提交、仍处于有效状态的 S-1 注册声明，并给出自有 IPO 准备度评分 78/100（B 级），同时记载累计募资
              $4.22 billion [CV001, CV011]。不过，直到 2026 年初至年中，二级市场成交价和承销财团估值仍在 $13.3 billion 至 $15.0 billion 之间，相对 $20
              billion 一级融资基准形成 25% 至 34% 的投资判断折价 [CV003, CV012, CV013]。自动化平台搜索还捕捉到自动化无人水面艇海事防务公司 Kraken Technology Group
              在 2026 年 7 月由 DTCP 领投、按 $1.0 billion 估值完成的 $175 million Series B；这与加密货币交易所 Payward, Inc.
              完全是两个实体，不能混入公司估值倍数 [CV002, CV004, CV005]。历史收购和员工股权池也进一步影响 Payward 股权结构表上的实际稀释程度 [CV007, CV013]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景投资判断、建议立场与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的估值框架把 Payward, Inc. 放进三种运营情景：乐观情景（隐含 EV $24.0B 至 $28.0B，上行空间 20% 至 40%）、基准情景（隐含 EV $16.0B 至 $20.0B，下行
              20% 至持平）和悲观情景（隐含 EV $9.0B 至 $12.0B，下行 40% 至 55%）[CV009, CV010, CV013]。乐观情景下，借助 NinjaTrader
              整合和机构质押，非交易收入占总收入的比例升至 65%+；调整后 EBITDA 在 $2.6B+ 收入基础上回升至 $600M+，支持与 Coinbase 交易高峰期相当的 8.0x EV/收入倍数 [CV009,
              CV013]。基准情景预计稳定收入为 $2.1B 至 $2.3B，手续费压缩抵消账户增长后 EBITDA 为 $250M，支持 6.0x 倍数和 $16.0B 至 $18.0B 的合理估值 [CV009,
              CV010]。悲观情景下，现货交易量进一步收缩，手续费率压低至 8 bps 以下，反复的监管合规摩擦使 EBITDA 低于 $100M，估值降至 4.0x 收入，即 $9.0B 至 $11.0B [CV009,
              CV010]。基于这一画像，我们给出“跟踪”投资建议，信心中等、风险高，并认为当前 $20B headline 估值偏高 [CV009, CV010, CV015]。最终投资判断仍需核实 SEC 和 CFTC
              在驳回后出具的审计清关文件、经审计的 FY2025 GAAP 财务报表，以及股权结构表上的清算优先权安排 [CV010, CV015]。
            claimRefs:
              - CV009
