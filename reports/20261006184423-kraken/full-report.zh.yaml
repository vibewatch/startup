        blocks:
          - type: paragraph
            body: >-
              Kraken 的财务画像达到机构级，拥有真实盈利能力、$2.2 billion 收入和经验证的交易对手安全性，但上市前仍面临估值摩擦 [CI001, CI004]。Payward 虽于 2025 年 11 月向
              SEC 提交保密 S-1 注册声明草案，目标是 2026 年初上市，但 IPO 在 2026 年 3 月因市场疲软及 CFO Stephanie Lemmerman 于 2026 年 2 月突然离职而正式暂停
              [CI013]。Primary rounds 成功守住 $20 billion 估值，但 2026 年 4 月私募二级交易价格约为 $13.3 billion，形成 34% 的 mark-to-market 脱节
              [CI012]。调整后收入在 Q2 2026 稳定于 $508 million（同比 +17%）；若按 $20 billion 企业价值评估 Kraken，则需要依靠 NinjaTrader 和代币化
              xStocks 持续扩大非交易收入，抵消交易量周期性波动 [CI001, CI003, CI004, CI012]。
            claimRefs:
