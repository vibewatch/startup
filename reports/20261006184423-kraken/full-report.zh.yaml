      - number: '4.3'
        title: 盈利能力、成本结构与资本充足
        blocks:
          - type: paragraph
            body: >-
              Payward 在 FY2025 实现经营盈利，$2.2 billion 收入对应调整后 EBITDA $530.6 million（利润率约 24%）[CI004]。但 2026
              年上半年加密交易量收缩，经营杠杆显著下降：调整后 EBITDA 在 Q1 2026 压缩至 $18 million、Q2 2026 压缩至 $23 million，H1 合计 $41 million（利润率约
              4.0%）[CI004]。激进的并购行动在 18 个月内吸收了五家大型实体，包含 $1.5 billion 的 NinjaTrader、$550 million 的 Bitnomial 和 $600
              million 的 Reap 收购，固定间接费用因此上升 [CI004, CI012]。面对利润率压力，管理层于 2026 年 5 月部署自动化 AI 客服运营并削减约 150 个岗位（占员工 5% 至
              8%）[CI011]。历史资本充足性由 $1.3B+ 累计股权融资支撑，其中包括 2025 年 11 月的 $800M 和 2026 年 5 月由 Apollo、Jane Street、Citadel
              Securities 等机构投资者提供的 $300M，轮次估值为 $20 billion [CI012]。监管遗留成本包括 2023 年 2 月导致美国零售质押停止的 $30 million SEC
              和解金，凸显持续的监管合规义务 [CI010]。
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
