  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与相邻领域
        blocks:
          - type: paragraph
            body: >
              数字资产交易与基础设施市场包括中心化加密货币现货交易、零售开户、机构合格托管、多资产衍生品经纪，以及新兴的代币化现实世界资产（RWA）基础设施。纳入的核心支出包括交易所 maker/taker
              交易费、零售即时购买处理利润、托管管理费，以及质押服务带来的验证者基础设施报酬。相反，市场边界明确排除没有中心交易对手的去中心化自动做市池、非托管点对点软件转账，以及与数字资产工作流无关的一般传统股票清算服务。

              在这一边界内，交易所运营商正不断连接相邻金融科技领域。Kraken 的战略范围覆盖零售现货执行、通过 Kraken Pro 界面进行的高频专业订单路由、机构托管，以及收购 NinjaTrader
              等企业后新整合的衍生品接入。传统替代方案——提供合成加密敞口的老牌股票经纪商、自托管冷钱包和 OTC
              流动性交易台——都在重叠客户群中争夺钱包份额。对估值建模而言，保持边界清晰很重要：交易型零售收入波动极大，而经常性的机构托管和受监管多资产产品则拥有差异化费率结构和企业留存特征。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
      - number: '2.2'
        title: 市场规模、分部交易量与增长轨迹
        blocks:
          - type: paragraph
            body: >
              评估数字资产基础设施的可触达市场，必须把总名义交易量与跨周期可变现的交易所净收入分开。全球最宽口径下，中心化交易所现货交易量在 2024 年超过 $10 trillion，全球市场领导者 Binance
              的年现货成交额达到 $7.4 trillion。按净收入计算，Coinbase FY2024 在约 $1.3 trillion 现货成交额上实现 $6.3 billion 净收入；Kraken 则从
              2022–2023 年加密市场收缩中反弹，FY2024 在 $665 billion 现货交易量上实现 $1.5 billion 收入，同比增长 128%。

              Kraken 的可服务市场受地域和监管边界约束。在美国，Coinbase 保持市场领先，Kraken 在受监管数字资产交易所中稳居第二，受益于陷入困境及不合规运营商退出后形成的整合。在欧洲，Kraken 与
              Bitstamp 等区域平台共同获得了可观市场份额。核心现货交易之外，新兴市场提供第二增长曲线：机构研究预计，在 CLARITY Act 等有利法律框架下，代币化现实世界资产这一可触达分部将从 $16
              billion 增至超过 $30 billion。不过，交易所变现高度依赖底层代币价格波动，长期 TAM 扩张仍受反复出现的加密寒冬和零售费率长期压缩限制。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
