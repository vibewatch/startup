      - number: '5.2'
        title: 平台架构、运营实体路由与技术基础设施
        blocks:
          - type: paragraph
            body: >
              Kraken 的运营架构是软件与受监管实体组成的混合基础设施，旨在把全球流动性聚合与严格的司法辖区合规协调起来。不同于非托管去中心化协议或单一牌照的单体经纪商，Kraken
              按各国监管边界，通过专门的企业子公司路由客户订单流、资产托管和清算。托管服务是架构的基础层：美国账户由 Wyoming 颁发牌照的特殊目的存款机构（SPDI）Payward Financial,
              Inc.（d/b/a Kraken Financial）负责，欧盟业务则由 Payward Europe Solutions Limited 负责；后者获爱尔兰央行授权为加密资产服务提供商（CASP）。

              程序化连接通过三类主要 API 标准运行，服务低延迟做市和高频自动执行。做市商及机构参与者使用 Kraken 的 FIX（Financial Information
              eXchange）协议端点进行高吞吐订单路由和低延迟交易报告，并通过双向 WebSocket 流推送实时订单簿 level-2/level-3 市场数据。标准账户管理、头寸对账和余额转账则通过认证 REST
              端点执行，并配有细粒度加密 API key 权限。这种分层 API 拓扑允许机构基金共同托管，或将算法交易策略直接路由到 Kraken 的中心化撮合引擎，同时保持托管隔离边界。
