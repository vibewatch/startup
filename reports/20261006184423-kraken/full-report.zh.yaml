            title: 多司法辖区企业隔离与监管摩擦
            body: >
              将现货交易、保证金杠杆、托管、传统股票和代币化证券分散路由到不同地区的法律实体（例如爱尔兰的 Payward Europe Solutions、Wyoming 的 Kraken Financial、BVI 的
              Payward Trading 和百慕大的 PDSL），会产生大量架构与合规开销。数字资产分类或跨境关联方交易规则突然变化，会持续给 Kraken 的全球运营模式带来运营和诉讼风险。
