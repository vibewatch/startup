    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与战略范围
        blocks:
          - type: paragraph
            body: >-
              Kraken 的法定实体为 Payward, Inc.，由 Jesse Powell、Thanh Luu 和 Michael Gronager 于 2011 年 7 月在旧金山创立；此前 Powell 曾就
              Mt. Gox 的安全架构提供咨询。平台于 2013 年 9 月正式开放公众现货交易，后来扩展为国际多资产金融基础设施提供商，提供现货交易、保证金工具、机构质押、通过 CF Benchmarks
              提供的指数服务及受监管衍生品。公司在现代远程优先运营框架下依托一系列全球企业实体运营，工程、风险和运营团队分布各地，而非集中在一座总部园区。Kraken 服务全球超过 1,500
              万零售交易者、专业交易台和机构，覆盖 300 多种数字资产及六条主要法币结算通道，并以机构级流动性、较早开展的储备证明透明度和多司法辖区合规塑造品牌。
            claimRefs:
