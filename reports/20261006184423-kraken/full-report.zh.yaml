  - id: FE001
    title: Kraken 多资产技术与运营架构
    type: stack
    summary: 结构化分层展示 Kraken 的多资产客户界面、执行引擎、受监管托管实体和加密透明度保障。
    data:
      layers:
        - label: 客户入口与开发者界面
          detail: 通过网页、移动端和 API 界面提供用户展示及程序化执行访问。
          modules:
            - Kraken 消费者移动端与网页应用
            - Kraken Pro 高级交易界面
            - 程序化 API 套件（REST、WebSocket 和 FIX 协议）
        - label: 执行、撮合与资产桥接
          detail: 核心交易路由、限价订单撮合和合成资产桥接。
          modules:
            - 高吞吐中央限价订单簿撮合引擎
            - Kraken Securities 经纪业务网关（11,000+ 美国股票与 ETF）
            - Payward Digital Solutions 代币化股票引擎（xStocks）
        - label: 受监管法律与托管基础设施
          detail: 按司法辖区提供资产托管、清算和实体隔离。
          modules:
            - Payward Financial, Inc.（怀俄明州 SPDI 银行托管）
            - Payward Europe Solutions Ltd（爱尔兰中央银行 CASP）
            - Payward Oceanic Ltd（OTC 现货、衍生品与借贷交易台）
        - label: 安全工程与加密保障
          detail: 加密审计、风险控制和资产准入合规。
          modules:
            - Merkle Tree 加密储备证明审计引擎
            - 自动资产准入器（100+ 受限代币排除筛选器）
            - 冷存储密钥管理与多重签名钱包安全
        - label: 企业数据与基础设施运营
          detail: 可扩展的数据接入、审计日志和开发者运营平台。
          modules:
            - 运营审计轨迹与访问管理
            - 自动化持续集成与同行审批防护机制
            - 跨区域韧性与网络冗余
        - label: 全球银行业务与法币清算结算
          detail: 多币种法币网关与机构电汇清算网络。
          modules:
            - 自动清算所（ACH）国内通道
            - 单一欧元支付区（SEPA）欧洲通道
            - SWIFT 跨境机构银行渠道
    approximationNotes: 架构分层反映 Kraken 已公布的运营子公司、监管牌照、开发者 API 规范和储备证明披露。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户生命周期从认知、账户入金到核心交易执行，再延伸至跨资产拓展。
    data:
      nodes:
        - stage: Discovery & Onboarding
          label: 认知与 KYC 核验
          description: 用户通过品牌赞助或合作伙伴 API 认识产品，再完成自动化身份核验和司法管辖区合规检查。
        - stage: Initial Funding
          label: 法币入金与充值
          description: 通过国内银行通道或借记卡网关为账户入金，即可立即进行现货交易。
        - stage: Core Trading
          label: 现货与主动交易执行
          description: 通过移动端、网页或 Kraken Pro 交易界面，在 640 多种资产上进行高频现货交易。
        - stage: Advisory & Bundles
          label: 自动化投资组合代理
          description: 使用在 SEC 注册的 Kraken Adviser LLC，借助 AI 调整投资组合并配置资产组合。
        - stage: Multi-Asset Expansion
          label: 证券与衍生品交叉销售
          description: 通过 Alpaca 拓展美国股票，并提供受监管的期货，以提高客户钱包份额。
        - stage: Institutional Scale
          label: API 程序化做市
          description: B2B 交易平台和基金利用 FIX 与 WebSocket 行情流进行联合托管，并按交易量层级获得佣金返还。
    approximationNotes: 代表在零售、投顾和 API 合作伙伴客群中观察到的标准化产品驱动客户生命周期。
