      - number: '1.4'
        title: 战略扩张、运营里程碑与监管审查
        blocks:
          - type: paragraph
            body: >-
              在十五年的发展中，Kraken 通过有纪律的内部产品开发和 16 次以上战略收购扩展平台能力，并于 2025 年 3 月同意以 $1.5 billion 收购在 CFTC 注册的期货佣金商
              NinjaTrader，将加密货币期货与传统金融期货连接起来。与此同时，平台应对复杂的监管与安全压力。2025 年 3 月，SEC 针对其无注册经营证券交易所提起的备受关注的 2023
              年民事诉讼，被联邦法院带有禁止再次起诉效力地驳回，消除了继 Kraken 此前因质押服务支付 $30 million 和解金后的一项重大结构性阴影。不过，消费者保护审查仍在持续：截至 2026
              年初，消费者金融保护局记录了 492 起投诉，其中 44% 涉及欺诈和未经授权的交易。2025 年初，一起未经授权的内部支持访问事件进一步检验了运营韧性，约 2,000
              个用户账户受到影响但托管储备未受损；事件促使联邦执法介入并强化安全协议，同时公司还推进了 Atlassian Williams 一级方程式车队等高知名度消费者合作。
