            body: >
              私募二级交易价格约比 $20 billion 的 Series D 估值低 42%，凸显投资者对 Kraken 退出时间表和竞争地位的显著怀疑。作为 Binance 和 Coinbase
              之后的第三大交易所，如果全球机构流动性在加密周期低迷时进一步集中到前两大市场领导者，Kraken 将面临结构性风险。
