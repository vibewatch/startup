      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 加密透明度作为机构竞争护城河
            body: >
              在交易对手资不抵债和客户存款不透明再质押长期困扰的交易所行业中，Kraken 率先实施每半年一次的加密储备证明审计，成为重要的技术信任机制。存款人可以在经过认证的 Merkle
              树结构中加密核验账户余额，Kraken 因此建立可证明的 1:1 资产支持，降低风险厌恶型机构资本和企业资金的交易对手尽调摩擦。
            calloutType: insight
