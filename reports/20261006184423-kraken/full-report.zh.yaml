  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反方论点与战略投资判断框架
        blocks:
          - type: paragraph
            body: >-
              Payward, Inc. 的核心投资论点建立在几项基础上：它是全球一线数字资产交易所，拥有顶级安全履历，在欧洲和北美铺设了稳健的法币银行通道，并持续扩大多资产机构业务版图 [CV001, CV007,
              CV008, CV013]。Kraken 注册用户超过 1000 万，且拥有加密货币行业最早持续运行的储备证明加密审计架构；即使经历多次历史性市场剧烈波动，它仍保持了机构交易对手的信誉
              [CV007]。管理层还积极拓展受监管的零售和机构衍生品业务：签署 $1.5 billion 协议收购 CFTC 注册的期货佣金商 NinjaTrader，收购机构衍生品平台 Bitnomial，并通过
              Payward, Inc. 旗下 Kraken Securities LLC 推出代币化股票交易，意在把收入顶线与波动的加密现货交易量周期脱钩 [CV008,
              CV014]。反方论点则聚焦于运营杠杆的剧烈波动，以及市场下行时 EBITDA 利润率的急剧压缩 [CV001, CV003, CV013]。FY2025 收入为 $2.2 billion，调整后 EBITDA
              为 $530.6 million（约 24% EBITDA 利润率）；但在 H1 2026，年化 EBITDA 骤降至 $41 million，对应 $1.02 billion 总收入（约 4% EBITDA
              利润率），原因是交易量下滑 18%，且 18 个月内完成五笔收购推高了固定开支 [CV003, CV013]。此外，辖区合规摩擦（包括欧盟 CASP/MiCA
              许可框架下广泛的地区性代币限制）压低了局部市场的交易量上限 [CV006]。投资者需要在平台的多资产基础设施与加密周期反复造成的交易费率压缩之间权衡 [CV001, CV007, CV008]。
