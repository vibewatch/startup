      - number: '6.4'
        title: 留存韧性、迁移摩擦与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              尽管规模可观且多资产客户牵引力强，Kraken 仍面临明显的客户留存动态、司法辖区限制和企业部署风险。零售和程序化交易收入与整体数字资产市场波动及投机交易量高度相关。此外，合规过滤器在特定司法辖区严格限制 100
              多种单独数字代币的充值、提现和交易能力，压制跨监管边界的资产流速。

              在企业和自动化运营中，客户留存取决于部署摩擦与运营治理。对公用事业自主智能体
              部署的独立分析指出，初始发布可以很快完成，但生产转型必须严格证明客户保护措施、例外路由和监管责任没有被削弱。企业平台迁移存在显著运营摩擦：区域部署需要 185 个工作日，多百万账户公用事业转型则可延续 2.5
              年。此外，Kraken 的证券咨询模式高度依赖第三方清算伙伴 Alpaca Securities LLC 执行订单和托管资产，使非加密财富扩张策略引入交易对手和分佣依赖。
            claimRefs:
              - CU005
              - CU008
              - CU012
              - CU013
