      - number: '4.2'
        title: 单位经济与交易量动态
        blocks:
          - type: paragraph
            body: >-
              相较零售导向同业，Kraken 的商业规模表现为较高的平均交易额和客户余额快速积累 [CI006, CI015]。Q2 2026，入金账户同比增长 42% 至 660 万（Q1 2026 为 610
              万），反映其在欧洲和机构司法辖区持续赢得市场份额 [CI008]。平台客户资产名义值稳定在 $40 billion，经价格调整的实际资产余额却同比增长 48% 至 $65
              billion，说明即使市场价格下跌，法币和代币仍有正向净流入 [CI009]。但 Q2 2026 平台总交易量同比收缩 18% 至 $310 billion（低于 Q1 2026 的 $357
              billion），与全行业现货成交额收缩 38% 同步 [CI007]。Kraken 约 0.11% 的综合 take rate 显著低于 Coinbase 以零售为主的实现水平，说明其交易量基础高度偏向机构
              OTC 交易台和算法流动性提供商 [CI002, CI006]。客户获取成本（CAC）和客户群留存计划仍属私有信息，但交易回撤期活跃账户仍增长，显示客户留存具韧性 [CI008]。
