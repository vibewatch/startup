  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Payward 运营以加密现货交易、衍生品、机构主经纪和资产收益产品为支柱的多元化金融基础设施模式 [CI001]。FY2025，平台处理 $2.0 trillion 总交易量（同比 +34%），按估计约
              0.11% 的综合 take rate 转化为 $2.2 billion 净收入 [CI001, CI002, CI006]。核心现货撮合引擎采用 0.00% 至 0.26% 的分层 maker/taker
              费率，既鼓励做市商提供深度流动性，也从零售和机构 taker 变现 [CI006]。现货佣金过去主导收入，但 Payward 已转向资产型收入，驱动因素包括质押服务、机构托管和 Wyoming SPDI 银行牌照
              [CI005, CI014]。截至 2026 年第二季度，资产型及其他非交易服务占总收入 60%，高于 Q2 2025 的 55%，显著缓冲数字资产价格整体下跌对收入的冲击 [CI005]。
