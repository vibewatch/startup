              - CO004
              - CO006
      - number: '1.3'
        title: 资本化历史、私有估值与股权结构表构成
        blocks:
          - type: paragraph
            body: >-
              Kraken 的股权资本化策略将纪律化的早期风险投资，与后期大额流动性融资及 IPO 前财团轮次结合起来。公司在 A 轮至 D 轮融资事件中累计获得约 $866 million 的 primary
              funding，早期投资伙伴包括 Hummingbird Ventures、SBI Group 和 Tribe Capital。2025 年末，Payward, Inc. 完成一轮 $800 million 的
              IPO 前成长融资，由机构做市商 Citadel Securities 领投，Jane Street 和 DRW Trading Group 共同投资，对应约 $20 billion 的 headline
              私募股权估值。2025 年 11 月，Payward, Inc. 向美国证券交易委员会提交了保密的 Form S-1 注册声明草案，使 Kraken 成为仅次于 Coinbase 的美国加密货币交易所 IPO
              最有力候选者。尽管二级市场股价估值在 2026 年初随整体上市环境变化而回落，创始人和公司员工仍掌握多数股权投票控制权。
            claimRefs:
              - CO003
              - CO005
              - CO006
