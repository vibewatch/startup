      - number: '2.3'
        title: 买方细分、工作流采用与预算归属
        blocks:
          - type: paragraph
            body: >
              Kraken 的交易和基础设施服务面向三类买方：零售活跃交易者、机构资产管理人和对冲基金，以及企业合作伙伴。零售用户将个人投机储蓄或财富多元化资金投入平台，并依据超过 250
              种受支持数字代币的资产广度、安全记录和教育式开户触点作出转化决策。CoinGecko 嵌入式实时价格等第三方市场数据集成，成为推动平台获客和用户参与的关键发现入口。

              机构客户包括量化基金、家族办公室和企业资金部门，受正式投资授权和受托责任控制。对这些买方而言，预算由首席投资官、财务主管或首席风险官掌握，他们评估执行延迟、API 可靠性和监管隔离。Kraken Pro
              面向系统化流动性提供商，执行延迟低于毫秒；算法订单流贡献了近一半的日加密货币交易量。与此同时，Kraken Custody 在 SOC 2 Type II 控制下将机构资本隔离存放于冷钱包，FY2025 管理
              $14.2 billion 客户托管余额，并形成直接的托管到交易结算流。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
