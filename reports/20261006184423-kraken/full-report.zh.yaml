      - number: '7.3'
        title: 安全托管与偿付能力验证
        blocks:
          - type: paragraph
            body: >-
              安全性和运营韧性这一块，Kraken 在数字资产行业长期享有最强的声誉之一：自 2011 年持续运营以来，从未遭遇导致客户资金被盗的灾难性网络攻击。交易所提供严格的账户级防护机制，包括 WebAuthn
              通行密钥、硬件双因素认证密钥，以及不可逆的 Global Settings Lock，以阻止凭证被未授权篡改。为缓解市场对偿付能力的担忧，Kraken 每季度利用 Merkle
              树执行加密储备证明。不过，独立法证审查强调，储备证明只是把链上钱包余额与申报负债进行静态、时点式核对，并不是对链下受限资产、运营偿付能力或公司或有债务的全面财务审计。此外，平台对数字资产采取保守筛选，限制一百多种高波动或法律属性模糊的代币用于用户存款和交易。
            claimRefs:
