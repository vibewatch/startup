      - number: '6.3'
        title: 已命名的企业部署、战略合作与参考客户
        blocks:
          - type: paragraph
            body: >-
              主要机构和企业部署合作伙伴为客户采用与商业分销提供了实证。围绕传统资本市场整合，Kraken 与 Alpaca Securities LLC 建立战略经纪合作，将美国上市股票和零碎 ETF 交易直接提供给
              Kraken 用户，在注册经纪交易商监管下把加密持仓连接到传统金融资产。机构市场基础设施则由 Deutsche Börse Group 与 Kraken（Payward
              Inc.）联手推进：双方建立全面战略合作，把受监管的欧洲交易所基础设施连接到加密原生交易，重点涵盖衍生品、代币化资产分销和机构流动性接入。

              在企业软件运营中，Kraken 的平台为大型公用事业供应商提供支持，其中包括英国能源供应商 Octopus Energy。Kraken 在 Octopus Energy 部署生成式 AI
              客服工具，签约服务数千万客户账户，自动起草复杂邮件回复，同时在发送给客户前保留人工复核。此外，Kraken 与对话式 AI 服务商 Sierra 在一家未具名大型公用事业公司快速完成四周自主智能体 部署，覆盖
              130 万账户。这些已命名关系表明，Kraken 的基础设施已在关键零售经纪、机构交易所清算和高量公用事业客户运营场景得到验证。
