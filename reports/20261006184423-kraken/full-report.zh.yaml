      - number: '7.2'
        title: 银行交易对手与清算机制
        blocks:
          - type: paragraph
            body: >-
              Kraken
              战略定位的核心支柱之一，是与传统支付架构直接相连，最突出的是获得堪萨斯城联邦储备银行授予的有限用途联邦储备主账户。不过，这项历史性权限遭到商业银行业协会和国会议员的强烈反对；他们指责其缺乏透明度、无视监管流程，并认为监管宽松的加密公司会带来系统性传染风险。更关键的是，账户协议设置了严格的运营限制：Kraken
              不得从央行储备余额中赚取利息，不能使用贴现窗口紧急贷款或央行信贷工具，也无法接入 FedNow 和自动清算所系统。Kraken Financial
              是一家在怀俄明州获特许、但没有保险的存款机构，因此客户存款完全不受联邦存款保险公司保护；在流动性极端紧张时，用户和机构交易对手都暴露于信用与结算风险之下。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
