  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管执法与全球牌照风险
        blocks:
          - type: paragraph
            body: >-
              Kraken
              在日益复杂且争议不断的全球监管环境中运营，需要在机构扩张与主要金融中心不断加码的合规要求之间取得平衡。在欧洲经济区，公司通过爱尔兰央行获得《加密资产市场法案》（MiCA）制度下的授权，并持有衍生品交易 MiFID
              权限，使其受监管 OTC 交易台走在 2026 年 7 月 1 日严格执法期限之前。相反，高昂监管开支和严格本地化要求过去迫使 Kraken
              退出日本等限制性市场；当地金融服务机构严苛的托管规则使本地运营不具经济性。此外，Kraken 依据金融行动特别工作组和英国 OFSI 指令严格遵守国际制裁，严禁来自 14
              个高风险司法辖区的客户和资金流入。应对这一碎片化的全球架构，需要持续法律支出，也不断增加国际零售扩张的摩擦。
