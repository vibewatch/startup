      - number: '3.3'
        title: 护城河韧性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >
              评估 Kraken
              竞争护城河的持久性，需要观察结构性切换成本、流动性聚合机制和外部替代威胁。中心化交易具有强大的流动性反馈回路：更深的订单簿降低滑点和买卖价差，自然吸引高频机构做市商及大型零售订单流。零售用户几乎无摩擦地在多个移动应用间同时使用，因此
              Kraken 的客户黏性主要依赖机构客户、Kraken Pro 的高级交易工具，以及加密专营平台难以复制的多资产能力。

              Kraken 的主要竞争风险来自收入周期性、市场集中度和执行复杂度。公开市场及二级市场评估显示，Kraken 按交易量是 Binance 和 Coinbase
              之后明确的第三名；若交易量进一步集中到前两大平台，公司将更脆弱。此外，Coinbase 享有上市 SEC 文件带来的透明度溢价，Binance 拥有巨大的规模经济，Kraken 却还要整合
              NinjaTrader、Small Exchange 和 Bitnomial 等多项收购，并应对私募市场二级股权折价。相反的市场证据显示，二级交易价格约比 primary round 估值低 42%，反映市场对
              IPO 时点、加密交易量波动和激烈费率压缩的谨慎。
