  - id: TV003
    title: 看多 / 基准 / 看空情景建模
    columns:
      - 运营情景
      - 隐含估值
      - 收入与 EBITDA 假设
      - 估值倍数与逻辑
      - 下行触发因素与概率
    rows:
      - - 乐观情景
        - $24.0B - $28.0B
        - 2027 财年收入增长至 $2.8B - $3.2B；受 NinjaTrader TradFi 协同效应推动，EBITDA 回升至 $650M - $800M（利润率约 25%）。
        - EV / 收入为 8.5 倍至 9.5 倍，EV / EBITDA 为 35 倍至 40 倍；多资产交易量多元化后，估值溢价与上市同行持平。
        - 由加密市场扩张、美国市场结构立法和成功 IPO 触发。概率：25%。
      - - 基准情景
        - $16.0B - $19.0B
        - 2027 财年收入稳定在 $2.2B - $2.4B；调整后 EBITDA 温和恢复至 $250M - $350M（利润率约 12%—15%）。
        - EV / 收入为 7.0 倍至 8.0 倍，EV / EBITDA 为 50 倍至 65 倍；与私募融资定价一致，体现增长与利润率恢复的平衡。
        - 由加密资产价格区间震荡、机构资金持续流入和 TradFi 零售业务温和采用触发。概率：55%。
      - - 悲观情景
        - $9.0B - $12.0B
        - 2027 财年收入降至 $1.6B - $1.8B；在严重费率压力下，调整后 EBITDA 压缩至 $50M - $100M（利润率低于 5%）。
        - EV / 收入为 5.0 倍至 6.5 倍，EV / EBITDA 超过 100 倍；倍数收缩，反映周期性交易 beta 和经营去杠杆。
        - 由加密寒冬持续、监管执法延迟或并购整合失败触发。概率：20%。
    notes: 情景估值依据不同宏观交易量周期及 EBITDA 利润率恢复路径，对企业价值建模。
