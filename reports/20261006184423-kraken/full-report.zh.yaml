  - id: TV002
    title: 投资论点 / 反论点矩阵
    columns:
      - 分析角度
      - 投资论点（看多驱动因素）
      - 投资反论点（看空风险）
      - 关键证据来源
      - 哪些变化会改变判断
    rows:
      - - 市场地位与品牌信任
        - 全球前三大西方加密交易所之一，核心托管业务 15 年无瑕疵，并率先在行业内采用储备证明。
        - Binance、Coinbase 和低费率 DEX 聚合器激烈争夺零售市场份额，侵蚀交易量。
        - 官方招聘披露中提到的 10M+ 用户；储备证明框架；活跃交易平台。
        - 全球交易量份额跌破 3%，或托管 / 运营安全遭遇系统性失陷。
      - - 收入多元化
        - 通过 $1.5B 收购 NinjaTrader 战略性进入 TradFi 期货业务，同时 xStocks 股票业务将非交易收入占比推至 60%。
        - 传统金融期货和代币化股票面临复杂的 CFTC、SEC 监管摩擦，零售端费率也更低。
        - Kraken Securities 的 FINRA 经纪交易商披露；NinjaTrader 交易记录；收入结构披露。
        - NinjaTrader 交易未能完成，或监管执法叫停代币化股票扩张。
      - - 盈利能力与单位经济
        - 2025 财年收入 $2.2B、调整后 EBITDA $530.6M，证明了市场上行周期中的经营杠杆。
        - 交易量下滑时经营去杠杆严重：2026 年上半年调整后 EBITDA 降至 $41M，利润率为 4%。
        - 2026 年上半年交易量收缩期间的财务报告；2026 年 5 月运营成本削减。
        - 连续多个市场下行季度的 EBITDA 利润率持续超过 30%。
      - - 治理与资本结构
        - Citadel Securities、Jane Street 和 Apollo Global Management 组成的机构财团提供支持，且公司拥有经验丰富的联合 CEO。
        - 主席 Jesse Powell 带来的关键人物风险、双 CEO 运营复杂性，以及历史 CFO 高管更替。
        - Arjun Sethi 与 Dave Ripley 的联合 CEO 架构；Citadel Securities 领衔的 $800M 财团轮融资。
        - 公开上市后全面重组董事会，由独立董事占多数，并采用单一 CEO 治理模式。
      - - 监管与合规护城河
        - SEC 指控其未注册交易所运营的执法行动于 2025 年 3 月被有既判力地驳回；CASP / MiCA 监管牌照已建立。
        - 多司法辖区合规成本持续高企，代币限制压缩全球客户产品的一致性。
        - 爱尔兰中央银行 CASP 注册；支持门户列出大量受限资产。
        - 美国联邦法律明确加密市场结构，消除 SEC / CFTC 之间的管辖冲突。
    notes: 论点与反论点驱动因素用于评估结构性运营杠杆与市场、监管风险。
    claimRefs:
