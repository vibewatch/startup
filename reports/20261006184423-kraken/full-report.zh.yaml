  - id: FV001
    title: 建议逻辑链
    type: flow
    summary: 从运营规模和收入多元化出发，经由周期性风险因素，推导出最终的持续跟踪建议。
    data:
      nodes:
        - id: scale
          label: 规模与品牌护城河
          description: 注册客户达 10M+，历史交易量达 $2.0T，并拥有先行者储备证明安全传统。
          tone: positive
        - id: diversification
          label: 多资产策略
          description: 收购 NinjaTrader 支出 $1.5B，并拓展 xStocks，推动非交易收入占比接近 60%。
          tone: positive
        - id: margin_pressure
          label: EBITDA 利润率压缩
          description: 2026 年上半年，受现货交易量周期性下滑 18% 影响，调整后 EBITDA 压缩至 $41M（利润率约 4%）。
          tone: risk
        - id: valuation_gap
          label: 估值分化
          description: 一级财团轮融资基准为 $20.0B，而二级私人市场成交价为 $13.3B-$15.0B。
          tone: risk
        - id: governance_audit
          label: IPO 前审计治理
          description: 必须经过审计的财务披露，才能确认 GAAP 盈利、现金消耗和 NinjaTrader 备考整合情况。
          tone: neutral
        - id: recommendation
          label: 建议：持续跟踪
          description: 估值立场偏高；持续关注公开 S-1 审计财务披露和利润率企稳情况。
          tone: neutral
      edges:
        - from: scale
          to: diversification
          relationship: 支持将资本投入
          label: 资本规模
        - from: diversification
          to: margin_pressure
          relationship: 抵消但目前受其拖累
          label: 周期性贝塔
        - from: margin_pressure
          to: valuation_gap
          relationship: 推动估值折价
          label: 倍数压缩
        - from: valuation_gap
          to: governance_audit
          relationship: 提高对其开展尽调的必要性
          label: 审计要求
        - from: governance_audit
          to: recommendation
          relationship: 影响对价格敏感的
          label: 投资判断立场
    approximationNotes: 流程图展示了从商业规模到投资判断立场的分析推演过程。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
