      - number: '1.2'
        title: 高管治理、管理架构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Payward, Inc. 的公司治理围绕 2024 年 10 月建立的双首席执行官模式展开。Dave Ripley 曾长期担任平台首席运营官，并于 2022 年接替 Jesse Powell
              出任首席执行官；如今他与联合首席执行官 Arjun Sethi 并任。Sethi 是 Tribe Capital 的联合创始人兼普通合伙人，此前曾主导对公司的风险融资。创始人 Jesse Powell
              转任董事会主席，仍是 Kraken 最大的个人股东，在投票和公司文化上拥有重大影响。职能高管包括负责公司会计、资产负债表资本化和 IPO 准备工作的首席财务官 Stephanie
              Lemmerman，以及首席法务官 Ben Gray 和首席安全官 Nick Percoco。双 CEO 架构把运营和技术连续性与符合投资者利益的资本配置结合起来，但创始人 Powell
              的公众地位和多数股权仍带来显著的关键人物依赖，是治理尽调的核心事项。
            claimRefs:
              - CO001
              - CO004
              - CO006
          - type: table
