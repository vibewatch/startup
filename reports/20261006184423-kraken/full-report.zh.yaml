  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围、多资产执行与用户工作流
        blocks:
          - type: paragraph
            body: >
              Kraken
              为机构、专业和零售市场参与者提供一体化数字金融运营平台，覆盖加密货币现货交易、法币入口通道、机构托管、受监管衍生品和传统证券经纪。从客户工作流看，市场参与者通过三类主要界面获取流动性：用于法币直接入金和现货兑换的消费者网页及移动应用；面向活跃交易者的高性能
              Kraken Pro 执行套件；以及支持 REST、WebSocket 和 FIX 协议的低延迟程序化交易接口。平台通过这些触点把零售投机资本、算法对冲基金和企业资金直接连接到中心化订单簿。

              核心交易工作流把数百个加密货币交易对的现货执行与专业资本管理服务结合起来。对符合条件的全球客户，OTC 交易台通过 Payward Oceanic Ltd.
              提供大宗现货交易、衍生品合约和机构借贷。与此同时，零售及机构账户利用 Payward Trading Ltd. 等离岸企业结构提供的杠杆现货保证金交易。在美国，Kraken 通过 Kraken
              Securities LLC（FINRA/SIPC 成员）把数字资产连接到传统股票，为国内投资者在注册经纪交易商监管下提供股票和 ETF。国际上，符合条件的非美国账户通过百慕大持牌的 Payward
              Digital Solutions Ltd. 接入由 Backed Assets (JE) Limited 发行的代币化股票（xStocks），在传统资本市场和数字钱包之间搭建合成桥梁。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
