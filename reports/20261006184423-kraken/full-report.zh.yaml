      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 多资产防线抵御交易所商品化
            body: >
              国际折扣平台和自动化流动性池持续压低加密现货交易费，Kraken
              向代币化股票（xStocks）、零佣金美国股票和受监管期货扩展，构成抵御交易所费率压缩的战略防线。把高价值交易者转化为多资产平台用户后，Kraken 提高客户终身价值，并把切换成本抬到纯加密经纪商之上。
            calloutType: insight
