      - number: '7.4'
        title: 保证金信贷与清算治理
        blocks:
          - type: paragraph
            body: >-
              零售和机构杠杆产品使 Kraken 及其交易客户在加密货币大幅下跌时面临抵押品快速贬值和市场级连锁风险。按照 Kraken
              的全球服务条款，客户账户不构成银行存款，也没有法定保险缓冲。在保证金借贷框架下，Kraken
              保留不受限制的单方面权力，可立即且无需通知地发出追加保证金通知并清算已质押抵押资产，包括在标准营业时间之外。数字资产可能在数秒内暴跌，因此 Kraken
              明确不承诺在变现担保资产、保护交易所流动性之前提供补救期限或提前警告。要在全球分散的远程工程组织中管理这类杠杆信贷敞口，需要自动化风险引擎既能瞬时执行清算，也能避免订单簿滑点和引擎宕机。
