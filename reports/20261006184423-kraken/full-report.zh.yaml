      - number: '5.3'
        title: 安全工程、储备证明与合规控制
        blocks:
          - type: paragraph
            body: >
              安全工程和监管风险缓释是 Kraken 在中心化数字资产交易所领域的核心运营护城河。作为拥有超过 1,000 万注册用户的全球分布式组织，Kraken
              建立了数字资产行业首个常规加密储备证明审计框架。该加密验证机制让账户持有人通过 Merkle 树证明独立核验链上账户余额是否由交易所持有的储备资产足额支持，同时不泄露账户级隐私或专有钱包配置。

              除加密可审计性外，Kraken 还执行细粒度资产准入及区域排除控制，以保护运营完整性并维持西方司法辖区的监管地位。平台虽支持广泛多资产交易，但合规网关会在受限账户和司法辖区自动限制 100
              多种高风险、未经审查或不合规代币的充值、提现和现货交易，包括新兴 meme
              代币、未经审查的稳定币和未注册的投机资产。质押服务同样严格隔离法律风险；质押奖励代表扣除佣金前的历史估算利率，并明确披露削减、黑客攻击和流动性锁定风险。平台还要求所有生产工程遵守严格内部安全标准，在关键服务部署前完成严谨审查、自动化测试和全面的同伴审批。
