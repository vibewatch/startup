      - number: '6.2'
        title: 采用轨迹、交易速度与账户扩张
        blocks:
          - type: paragraph
            body: >-
              Kraken 的采用轨迹显示，公司从早期加密货币现货交易所持续扩展为多元化全球交易基础设施提供商。2025 年全年，平台在现货及衍生品订单簿中处理约 $2 trillion 总交易量；其自有撮合引擎基础设施已运行
              14+ 年，为算法和高频交易客户保持 99.9% 的运营在线率。这一交易规模由超过 1,500 万客户的全球注册账户基础支撑，使 Kraken 成为数字资产生态中最大的流动性枢纽之一。

              平台扩张越来越聚焦于通过多资产产品发布和开放开发者接口扩大客户钱包份额。借助 Open Kraken 以及基于 Model Context Protocol（MCP）网关构建的无头 AI 接入层，Kraken
              让第三方开发者、机构客户和企业运营方直接把自定义 AI 智能体
              与分析工作流接入核心客户账户数据和合规执行管道。不过，活跃账户速度的披露仍然受限；公开报告只汇总账户历史累计注册量，没有拆分月活跃交易者（MAUs）、入金账户或客户资产分布曲线，因此评估零售客户群韧性存在重大尽调缺口。
            claimRefs:
              - CU001
