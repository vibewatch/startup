  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分、买方画像与多分部规模
        blocks:
          - type: paragraph
            body: >-
              Kraken 的客户群覆盖三类核心商业分部：零售自主交易者、程序化 B2B 和机构交易对手，以及企业运营平台许可方。平台在零售业务中服务遍布 190+ 个国家的超过 1,500
              万注册账户，用于加密货币现货兑换、杠杆保证金交易和法币结算通道。在美国，Kraken Adviser LLC 进一步拓展零售客户关系；该 SEC 注册投资顾问提供算法化投资组合资产包和 AI 驱动的
              Portfolio Agent，账户交易经由经纪交易商关联方 Kraken Securities LLC 路由，并通过 Alpaca Securities LLC 清算。

              与此同时，机构对冲基金、做市商和金融科技平台通过 Kraken API Partner Program 接入。该程序化渠道将外部经纪商和活跃交易公司连接到 640+
              个现货加密交易对、受监管期货合约和代币化美国股票（xStocks）的深度流动性，并按交易量分级分佣。Kraken 的企业技术业务则通过 Kraken Technologies
              覆盖公用事业基础设施市场，商业触达不断扩大，全球签约公用事业账户超过 5,400 万。多元化买方结构将消费者交易流与经常性的 B2B 清算和软件授权关系结合起来。
