callouts:
  - calloutType: "insight"
    title: "Volume Cyclicality Governs Exchange Monetization"
    body: "While gross trading volumes rebounded dramatically in 2024, exchange revenues remain heavily sensitive to market volatility and retail sentiment. Kraken's expansion into institutional custody ($14.2B AUM) and regulated derivatives represents a deliberate structural shift to capture counter-cyclical and recurring revenue streams."
    claimRefs:
      - "CM003"
      - "CM007"
      - "CM013"
  - calloutType: "risk"
    title: "Regulatory Fragmentation Restricts Global Addressable Demand"
    body: "Stringent regulatory compliance frameworks across North America and Europe force localized asset delistings and restricted margin capabilities. These geographic and jurisdictional compliance boundaries prevent single-license global scale, capping retail SOM relative to offshore venues."
    claimRefs:
      - "CM005"
      - "CM010"
      - "CM016"
