      - number: '5.2'
        title: Platform Architecture, Operating Entity Routing, and Technical Infrastructure
        blocks:
          - type: paragraph
            body: >
              Kraken’s operating architecture functions as a hybrid software and regulated entity infrastructure
              designed to reconcile global liquidity aggregation with strict jurisdictional compliance. Unlike unhosted
              decentralized protocols or monolithic single-license brokers, Kraken routes customer order flow, asset
              custody, and clearing through specialized corporate subsidiaries tailored to national regulatory
              boundaries. Custody services represent a fundamental architectural layer, segregated between
              Wyoming-chartered Special Purpose Depository Institution (SPDI) Payward Financial, Inc. (d/b/a Kraken
              Financial) for domestic accounts and Payward Europe Solutions Limited for European Union operations, which
              maintains authorization as a Crypto Asset Service Provider (CASP) under the Central Bank of Ireland.


              Programmatic connectivity operates through three primary application programming interface (API) standards
              designed for low-latency market making and high-frequency automated execution. Market makers and
              institutional participants utilize Kraken’s FIX (Financial Information eXchange) protocol endpoints for
              high-throughput order routing and low-latency trade reporting, alongside bi-directional WebSocket
              streaming feeds for real-time order book level-2/level-3 market data updates. Standard account management,
              position reconciliation, and balance transfers execute via authenticated REST endpoints with granular
              cryptographic API key permissions. This multi-tiered API topology allows institutional funds to co-locate
              or route algorithmic trading strategies directly against Kraken's centralized matching engines while
              maintaining segregated custody boundaries.
            claimRefs:
              - CE003
              - CE006
