      - number: '8.3'
        title: Scenario Underwriting, Recommendation Stance, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our valuation framework evaluates Payward, Inc. across three operating scenarios: Bull ($24.0B to $28.0B
              implied EV; 20% to 40% upside), Base ($16.0B to $20.0B implied EV; -20% downside to flat), and Bear ($9.0B
              to $12.0B implied EV; -40% to -55% downside) [CV009, CV010, CV013]. In the bull case, non-trading revenues
              scale to 65%+ of gross revenue via NinjaTrader integration and institutional staking, with adjusted EBITDA
              rebounding to $600M+ on $2.6B+ revenue, supporting an 8.0x EV/revenue multiple aligned with Coinbase
              trading peaks [CV009, CV013]. The base case projects $2.1B to $2.3B in stabilized revenue with $250M in
              EBITDA as fee compression offsets account growth, supporting a 6.0x multiple and $16.0B to $18.0B fair
              valuation [CV009, CV010]. In the bear case, spot volume contracts further, fee margin compresses below 8
              bps, and recurring regulatory compliance friction limits EBITDA to under $100M, dragging valuation down to
              4.0x revenue ($9.0B to $11.0B) [CV009, CV010]. Based on this profile, we assign an overall investment
              recommendation of track with medium confidence, high risk rating, and a stretched valuation stance at the
              current $20B headline mark [CV009, CV010, CV015]. Final underwriting requires verification of
              post-dismissal SEC and CFTC audit clearances, audited FY2025 GAAP financials, and cap table liquidation
              preference schedules [CV010, CV015].
