            title: Federal Reserve Master Account Under Political and Regulatory Fire
            body: >-
              Kraken's limited-purpose master account at the Kansas City Fed provides landmark direct clearing access,
              but faces intense opposition from commercial banks and congressional lawmakers who warn of systemic
              contagion risks from uninsured crypto institutions.
            calloutType: risk
            claimRefs:
