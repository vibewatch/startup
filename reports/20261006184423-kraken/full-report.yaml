  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope, Multi-Asset Execution, and User Workflows
        blocks:
          - type: paragraph
            body: >
              Kraken provides institutional, professional, and retail market participants with an integrated digital
              finance operating platform that spans cryptocurrency spot trading, fiat gateway rails, institutional
              custody, regulated derivatives, and traditional securities brokerage. From a client workflow perspective,
              market participants access liquidity via three primary interaction surfaces: consumer web and mobile
              applications for direct fiat on-ramping and spot conversions, the high-performance Kraken Pro execution
              suite for active traders, and low-latency programmatic trading interfaces supporting REST, WebSocket, and
              FIX protocols. Across these touchpoints, the platform connects retail speculative capital, algorithmic
              hedge funds, and corporate treasuries directly to centralized order books.


              The core trading workflow integrates spot execution across hundreds of cryptocurrency pairs with
              specialized capital management services. For eligible global clients, Over-the-Counter (OTC) desks
              facilitate block-sized spot trades, derivatives contracts, and institutional lending via Payward Oceanic
              Ltd. Concurrently, retail and institutional accounts utilize leveraged spot margin trading provided
              through offshore corporate structures such as Payward Trading Ltd. In the United States, Kraken bridges
              digital assets into traditional equities via Kraken Securities LLC (member FINRA/SIPC), granting domestic
              investors access to equities and ETFs under registered broker-dealer oversight. Internationally, eligible
              non-U.S. accounts access tokenized equities (xStocks) issued by Backed Assets (JE) Limited via
              Bermuda-licensed Payward Digital Solutions Ltd., creating a synthetic bridge between traditional capital
              markets and digital wallets.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
