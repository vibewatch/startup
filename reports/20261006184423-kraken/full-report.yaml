  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Enforcement and Global Licensing Exposure
        blocks:
          - type: paragraph
            body: >-
              Kraken operates within an increasingly complex and contested global regulatory environment, balancing
              institutional expansion with intensifying compliance demands across major financial centers. In the
              European Economic Area, the company secured authorization under the Markets in Crypto-Assets (MiCA)
              regulatory regime via the Central Bank of Ireland and holds MiFID permissions for derivatives trading,
              positioning its regulated over-the-counter desk ahead of the strict July 1, 2026 enforcement deadline.
              Conversely, high regulatory overhead and strict localization requirements have historically forced Kraken
              to withdraw from restrictive markets such as Japan, where onerous Financial Services Agency custody rules
              rendered local operations uneconomical. Furthermore, Kraken maintains rigid compliance with international
              sanctions, strictly prohibiting clients and capital inflows from 14 high-risk jurisdictions following
              Financial Action Task Force and UK OFSI directives. Navigating this fragmented global architecture
              requires ongoing legal expenditures and introduces perpetual friction to international retail expansion.
            claimRefs:
