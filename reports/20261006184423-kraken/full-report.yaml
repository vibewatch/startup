      - number: '8.2'
        title: Capitalization History, Private Marks, and S-1 Registration Dynamics
        blocks:
          - type: paragraph
            body: >-
              Kraken's capitalization history reflects a bifurcated valuation trajectory between primary consortium
              rounds and secondary private transactions [CV001, CV003, CV011, CV013]. Primary funding events in late
              2025 and mid-2026 successfully established and defended a $20 billion headline equity valuation, anchored
              by an $800 million strategic financing round in November 2025 with $200 million led by Citadel Securities
              alongside Jane Street, DRW Trading, and Apollo Global Management, followed by a $300 million pre-IPO
              tranche in May 2026 [CV003, CV013]. Public aggregators including TechStackIPO track an active S-1
              registration statement filed with the SEC in September 2026 (assigning a proprietary IPO readiness score
              of 78/100, Grade B), noting cumulative capital raised of $4.22 billion [CV001, CV011]. However, secondary
              marketplace prints and syndicate marks through early-to-mid 2026 traded between $13.3 billion and $15.0
              billion, establishing an underwriting discount of 25% to 34% against the $20 billion primary round
              benchmark [CV003, CV012, CV013]. Automated platform searches also capture autonomous maritime defense firm
              Kraken Technology Group's $175 million Series B round at a $1.0 billion valuation led by DTCP in July
              2026, which represents an entirely distinct entity from cryptocurrency exchange Payward, Inc. and must not
              be commingled in corporate valuation multiples [CV002, CV004, CV005]. True equity dilution across
              Payward's cap table is further impacted by historical acquisitions and employee equity pools [CV007,
              CV013].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
