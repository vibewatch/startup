      - number: '7.2'
        title: Banking Counterparties and Clearing Mechanics
        blocks:
          - type: paragraph
            body: >-
              A central pillar of Kraken's strategic positioning is its direct connectivity to traditional payment
              architecture, most notably through a limited-purpose Federal Reserve master account granted by the Federal
              Reserve Bank of Kansas City. However, this historic access has triggered fierce pushback from commercial
              banking trade associations and leading congressional lawmakers, who cite lack of transparency, flouted
              regulatory protocols, and systemic contagion hazards from lightly supervised crypto firms. Crucially, the
              account agreement includes severe operational safeguards: Kraken is prohibited from earning interest on
              central bank reserve balances, cannot access emergency discount window lending or central credit
              facilities, and is excluded from FedNow and automated clearing house systems. Because Kraken Financial is
              an uninsured depository institution chartered in Wyoming, client deposits are completely excluded from
              Federal Deposit Insurance Corporation protections, leaving users and institutional counterparties exposed
              to credit and settlement risks in extreme liquidity events.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
