      - number: '7.3'
        title: Security Custody and Solvency Verification
        blocks:
          - type: paragraph
            body: >-
              On security and operational resilience, Kraken maintains one of the strongest historical reputations in
              the digital asset industry, having operated continuously since 2011 without suffering a catastrophic
              cyberattack resulting in client fund theft. The exchange provides rigorous account-level defense
              mechanisms, incorporating WebAuthn passkeys, hardware two-factor authentication keys, and an irreversible
              Global Settings Lock to thwart unauthorized credential tampering. To mitigate market-wide solvency
              anxieties, Kraken conducts quarterly cryptographic proof-of-reserves procedures utilizing Merkle trees.
              Nevertheless, independent forensic reviews emphasize that proof-of-reserves represents only a static,
              point-in-time verification of on-chain wallet balances against declared liabilities, rather than a
              comprehensive financial audit of off-chain encumbrances, operating solvency, or contingent corporate
              debts. In addition, the platform enforces conservative digital asset curation, restricting more than one
              hundred volatile or legally ambiguous tokens from user deposits and trading.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.4'
        title: Margin Credit and Liquidation Governance
        blocks:
          - type: paragraph
            body: >-
              Retail and institutional leverage products expose Kraken and its trading base to rapid collateral
              degradation and potential market cascade risks during severe cryptocurrency drawdowns. Under Kraken's
              global terms of service, client accounts do not constitute banking deposits and lack statutory insurance
              cushions. In its margin borrowing framework, Kraken reserves unrestricted, unilateral authority to trigger
              margin calls and liquidate pledged collateral assets immediately and without notice, including outside
              standard business hours. Because digital asset values can drop violently within seconds, Kraken explicitly
              disclaims any obligation to provide cure periods or advance warning before realizing secured assets to
              protect exchange liquidity. Managing these leveraged credit exposures across a globally distributed remote
              engineering organization requires automated risk engines capable of executing instantaneous liquidations
              while preventing order-book slippage and engine outages.
            claimRefs:
              - CR008
              - CR009
              - CR013
          - type: figure
