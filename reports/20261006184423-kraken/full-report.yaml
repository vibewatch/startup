            body: >-
              Despite substantial scale and multi-asset customer traction, Kraken faces pronounced customer durability
              dynamics, jurisdictional restrictions, and enterprise deployment risks. In retail and programmatic
              trading, revenue remains heavily correlated with broader digital asset market volatility and speculative
              trading volumes. Furthermore, compliance filters strictly restrict deposit, withdrawal, and trading
              capabilities across more than 100 individual digital tokens in specific jurisdictions, constraining asset
