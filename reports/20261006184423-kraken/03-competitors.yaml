callouts:
  - calloutType: "insight"
    title: "The Multi-Asset Defense Against Exchange Commoditization"
    body: >
      While spot cryptocurrency trading fees face relentless downward pressure from international discount venues and automated liquidity pools, Kraken's expansion into tokenized equities (xStocks), commission-free U.S. equities, and regulated futures represents a strategic defense against exchange fee compression. By converting high-value traders into multi-asset platform users, Kraken increases customer lifetime value and raises switching costs above pure-play crypto brokers.
    claimRefs:
      - "CP004"
      - "CP008"
      - "CP011"
  - calloutType: "risk"
    title: "Secondary Valuation Disconnect and Market Consolidation Pressure"
    body: >
      Trading at roughly 42% below its $20 billion Series D valuation in private secondary transactions highlights significant investor skepticism regarding Kraken's exit timeline and competitive position. As a number-three exchange behind Binance and Coinbase, Kraken faces structural risk if global institutional liquidity concentrates further onto the top two market leaders during crypto cyclical downturns.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP014"
      - "CP015"
