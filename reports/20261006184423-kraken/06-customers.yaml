callouts:
- calloutType: insight
  title: Multi-Asset Partner Infrastructure as a Customer Retention Flywheel
  body: Kraken’s expansion beyond pure crypto spot trading into tokenized US equities (via Backed Assets) and domestic equities
    (via Alpaca Securities) transforms the platform from a cyclical exchange into a diversified brokerage hub. By integrating
    securities and crypto under a unified API partner framework, Kraken deepens partner switching costs and insulates client
    transaction volume from digital asset market drawdowns.
  claimRefs:
  - CU003
  - CU005
  - CU006
- calloutType: risk
  title: Operational Governance Risks in Automated and Enterprise Customer Deployments
  body: While accelerated deployment velocity—such as four-week autonomous agent rollouts—demonstrates platform agility, enterprise
    customer deployments in regulated utility and financial environments require rigorous operational safeguards. As independent
    analyses emphasize, rapid cutovers without proven exception containment, transparent human escalation pathways, and customer
    protection guarantees risk triggering regulatory sanctions and customer churn.
  claimRefs:
  - CU008
  - CU012
  - CU013
