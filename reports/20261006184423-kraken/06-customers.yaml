company:
  name: Kraken
chapter:
  number: 6
  title: Customers
  summary: Kraken serves over 15 million global retail traders, institutional market makers, and B2B brokerage partners across
    190+ countries, supporting $2 trillion in 2025 transaction volume. The company’s commercial model balances high-volume digital
    asset trading with expanding multi-asset partnerships such as Alpaca and Deutsche Börse, while navigating complex regulatory
    restrictions and enterprise customer deployment risks.
sections:
- id: customer-segmentation-and-buyer-topology
  title: Customer Base Segmentation, Buyer Personas, and Multi-Segment Scale
  body: 'Kraken’s customer base spans three core commercial segments: retail self-directed traders, programmatic B2B and institutional
    counterparties, and enterprise operating platform licensees. Across its retail footprint, the platform serves more than
    15 million registered accounts across 190+ countries who utilize Kraken for spot cryptocurrency conversion, leveraged
    margin trading, and fiat settlement rails. In the United States, retail client relationships are further expanded through
    Kraken Adviser LLC, an SEC-registered investment adviser offering algorithmic portfolio asset bundles and an AI-driven
    Portfolio Agent, with account transactions routed through broker-dealer affiliate Kraken Securities LLC and cleared via
    Alpaca Securities LLC.


    Concurrently, institutional hedge funds, market makers, and fintech platforms interface through the Kraken API Partner
    Program. This programmatic channel connects external brokerages and active trading firms to deep liquidity across 640+
    spot crypto pairs, regulated futures contracts, and tokenized US equities (xStocks) with volume-tiered commission sharing.
    In parallel, Kraken’s enterprise technology footprint—operating across utility infrastructure markets via Kraken Technologies—demonstrates
    expanding commercial reach, contracting over 54 million utility accounts globally. This diversified buyer topology combines
    consumer transactional flow with recurring B2B clearing and software licensing relationships.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU009
  - CU014
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-volume-metrics
  title: Adoption Trajectory, Transaction Velocity, and Account Expansion
  body: 'Kraken’s adoption trajectory reflects continuous scaling from early cryptocurrency spot exchange operations into
    a diversified global trading infrastructure provider. In calendar year 2025, the platform processed approximately $2 trillion
    in aggregate transaction volume across spot and derivative order books, supported by 14+ years of proprietary matching
    engine infrastructure maintaining 99.9% operational uptime for algorithmic and high-frequency trading clients. This transaction
    scale is anchored by a global registered account base exceeding 15 million clients, establishing Kraken as one of the
    largest liquidity hubs in the digital asset ecosystem.


    Platform expansion has increasingly focused on widening customer wallet share through multi-asset product launches and
    open developer interfaces. Through initiatives like Open Kraken and its headless AI access layer built on Model Context
    Protocol (MCP) gateways, Kraken enables third-party developers, institutional clients, and enterprise operators to integrate
    custom AI agents and analytical workflows directly into core customer account data and compliant execution pipelines.
    However, disclosure of active account velocity remains constrained; public reporting aggregates total lifetime account
    registrations without breaking out monthly active traders (MAUs), funded accounts, or client asset distribution curves,
    creating a material diligence gap in assessing retail cohort durability.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU009
  - CU015
  tableRefs:
  - TU002
- id: named-customer-and-partner-proof
  title: Named Enterprise Deployments, Strategic Partnerships, and Reference Accounts
  body: 'Verified customer adoption and commercial distribution are substantiated by major institutional and enterprise deployment
    partnerships. In traditional capital markets integration, Kraken entered into a strategic brokerage partnership with Alpaca
    Securities LLC to deliver US-listed equities and fractional ETF trading directly to Kraken users, bridging cryptocurrency
    holdings into traditional financial assets under registered broker-dealer oversight. At the institutional market-infrastructure
    level, Deutsche Börse Group and Kraken (Payward Inc.) formed a comprehensive strategic partnership to connect regulated
    European exchange infrastructure with crypto-native trading, focusing on derivatives, tokenized asset distribution, and
    institutional liquidity access.


    In enterprise software operations, Kraken’s platform powers major utility providers, headlined by UK energy supplier Octopus
    Energy. At Octopus Energy, Kraken deployed generative AI customer service tools contracted to serve tens of millions of
    customer accounts, automating complex email draft responses while maintaining human-in-the-loop review before customer
    dispatch. Furthermore, Kraken and conversational AI provider Sierra completed rapid four-week autonomous agent deployments
    at an unnamed major utility covering 1.3 million accounts. These named relationships confirm that Kraken’s infrastructure
    is validated across mission-critical retail brokerage, institutional exchange clearing, and high-volume utility customer
    operations.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU010
  - CU011
  tableRefs:
  - TU003
- id: retention-durability-and-concentration-risks
  title: Durability Dynamics, Migration Friction, and Customer Concentration Risks
  body: 'Despite substantial scale and multi-asset customer traction, Kraken faces pronounced customer durability dynamics,
    jurisdictional restrictions, and enterprise deployment risks. In retail and programmatic trading, revenue remains heavily
    correlated with broader digital asset market volatility and speculative trading volumes. Furthermore, compliance filters
    strictly restrict deposit, withdrawal, and trading capabilities across more than 100 individual digital tokens in specific
    jurisdictions, constraining asset velocity across regulatory borders.


    In enterprise and automated operations, customer retention is governed by deployment friction and operational governance.
    Independent analysis of autonomous agent deployments at utilities highlights that while initial releases can occur rapidly,
    production transformations require rigorous proof that customer protection safeguards, exception routing, and regulatory
    responsibilities are not compromised. Enterprise platform migrations reflect substantial operational friction, with migration
    timelines extending from 185 business days for regional deployments to 2.5 years for multi-million account utility transformations.
    Additionally, Kraken’s securities advisory model depends heavily on third-party clearing partner Alpaca Securities LLC
    for order execution and custody, introducing counterparty and fee-sharing dependencies into its non-crypto wealth expansion
    strategy.'
  claimRefs:
  - CU005
  - CU008
  - CU012
  - CU013
