evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosures
    missingEvidence: >-
      Audited financial statements confirming annual GAAP revenue, operating margins, cash flow, and balance sheet
      assets for Payward, Inc.
    whyItMatters: >-
      Without formal S-1 public disclosures or audited financials, revenue estimates and valuation multiples rely on
      unofficial secondary marks.
    diligencePath: >-
      Review public SEC Form S-1 registration statement once Payward, Inc. converts its confidential draft into an
      effective public filing.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: >-
      Comprehensive roster of all Payward, Inc. board of directors members, independent committee chairs, and functional
      senior vice presidents.
    whyItMatters: >-
      Partial governance disclosure obscures committee-level oversight and key-person succession planning below the
      co-CEO tier.
    diligencePath: Request confidential governance register and board committee charters as part of pre-IPO management diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-cap-table
    missingEvidence: >-
      Fully diluted capitalization table detailing exact equity ownership percentages, share classes, liquidation
      preferences, and secondary transaction discounts.
    whyItMatters: >-
      Founders and early employees reportedly retain majority control, but institutional voting agreements and preferred
      covenants remain undisclosed.
    diligencePath: Obtain official stock ledger and investor rights agreement during formal investment allocation diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: institutional-revenue-split
    missingEvidence: >-
      Audited financial breakdown distinguishing net transaction revenues between retail instant-buy margins and
      institutional Kraken Pro taker fees.
    whyItMatters: >-
      Retail transaction margins represent higher take rates (~1.5%) compared to institutional tiers (0.10%–0.26%),
      making blended revenue multiple durability dependent on segment mix.
    diligencePath: >-
      Review confidential Form S-1 registration statement disclosures or audited pre-IPO financial revenue
      disaggregation tables.
    relatedQuestionRefs:
      - QM008
  - id: EGM002
    type: conflicting-data
    severity: minor
    topic: fy2025-run-rate
    missingEvidence: >-
      Reconciliation between secondary market H1 2025 volume run-rates ($884B) and third-party analyst estimates citing
      $350B+ FY2025 volume.
    whyItMatters: >-
      Conflicting volume benchmarks create variance in projected forward fee velocity and valuation multiples ahead of
      the 2026 IPO window.
    diligencePath: Request management quarterly financial review packs and primary exchange trading volume settlement audits.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: institutional-market-share
    missingEvidence: >-
      Audited institutional trading volume breakdown and institutional custody market share figures comparing Kraken
      Prime against Coinbase Institutional and Binance VIP.
    whyItMatters: >-
      Determines whether Kraken's institutional moat is expanding or losing ground to Coinbase's dominant ETF custody
      services.
    diligencePath: >-
      Review Kraken's S-1 registration statement upon confidential or public filing, or request institutional AUM data
      from management during secondary diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited customer acquisition cost (CAC), payback period, and cohort churn schedules across retail Pro and
      Institutional client segments.
    whyItMatters: >-
      Without segmented CAC and retention schedules, underwriters cannot evaluate sales efficiency or gross margin
      durability against public peers like Coinbase.
    diligencePath: >-
      Request private pre-IPO cohort data from management detailing marketing spend per newly funded account and
      24-month gross margin retention.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: latency-and-matching-throughput
    missingEvidence: >-
      Audited order book matching engine throughput (peak TPS) and end-to-end P99 latency benchmarks under volatile
      market conditions.
    whyItMatters: >-
      Institutional market makers evaluate execution reliability and slippage risk based on verified peak-load
      processing latency.
    diligencePath: >-
      Request institutional infrastructure SLA disclosures and historical latency reports from Kraken institutional
      account executives.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: enterprise-customer-retention-and-churn
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and enterprise churn rates across
      institutional trading counterparties and utility platform licensees.
    whyItMatters: >-
      Without audited customer retention and cohort expansion data, long-term customer lifetime value and recurring
      revenue durability cannot be independently verified against cyclical trading downturns.
    diligencePath: >-
      Request confidential customer cohort retention schedules and license renewal histories during pre-IPO financial
      diligence.
    relatedTableRefs:
