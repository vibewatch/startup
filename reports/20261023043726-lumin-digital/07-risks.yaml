  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-resilience
      missingEvidence: >-
        Audited revenue, ARR, gross margin, profitability, free cash flow, cash, debt, monthly
        burn, committed spend, and runway with period definitions and reconciliations.
      whyItMatters: >-
        Funding raised cannot establish cash available or whether Lumin can execute its broad
        roadmap without another financing.
      diligencePath: >-
        Obtain audited statements, current management accounts, bank and debt schedules,
        board-approved budget, monthly cash bridge, and base and downside runway cases.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: security-controls
      missingEvidence: >-
        Current SOC and ISO materials, penetration tests, exception logs, incident history,
        uptime methodology, SLA attainment, RTO/RPO tests, data-residency maps, and AI controls.
      whyItMatters: >-
        Public frameworks and hiring signals do not prove the operating effectiveness of
        Lumin's controls across customer deployments.
      diligencePath: >-
        Conduct a security and resilience data-room review with the CISO, control owners,
        auditors, and a sample of client institutions.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR001, TR002]
    - type: enumeration-incomplete
      severity: material
      topic: legal-regulatory
      missingEvidence: >-
        Complete litigation, enforcement, complaint, license, examination, privacy, and
        contractual-responsibility records for Lumin and relevant subsidiaries.
      whyItMatters: >-
        An adverse search with no retained result cannot establish the absence of a proceeding,
        complaint, control exception, or legal exposure.
      diligencePath: >-
        Run counsel-led federal and state docket and regulator checks, obtain management
        representations, and reconcile results to insurer and client disclosures.
      relatedQuestionRefs: [QR002, QR007]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Revenue and transaction concentration by client, client-investor, core processor,
        cloud service, critical vendor, and third-party integration.
      whyItMatters: >-
        The public integration count and client-investor participation do not provide the
        denominators needed to assess correlated operating, revenue, and governance exposure.
      diligencePath: >-
        Obtain top-customer revenue, renewal, ownership, voting-right, vendor-spend, dependency,
        and failure-impact schedules with tested exit and contingency plans.
