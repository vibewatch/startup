schemaVersion: "report-v2"
artifact: risks
slug: lumin-digital
runDate: 2026-10-23
company:
  name: Lumin Digital
chapter:
  number: 7
  title: Risks
  summary: >-
    Lumin's largest underwritable risks are not proven failures but the combination of a
    mission-critical banking surface, more than 200 reported partner integrations, private
    security and financial evidence, and a widening AI and product roadmap. The investment
    case should remain conditional on direct verification of controls, incident history,
    contractual resilience, concentration, and runway.
sections:
  - id: risk-hierarchy
    title: Risk hierarchy and decision frame
    body: >-
      The highest-priority diligence issue is assurance, not a documented breach or outage:
      the assigned evidence does not establish Lumin's incident history, contractual service
      levels, recovery performance, certification inventory, or regulatory examination
      results. RFP Wiki specifically flags that contractual SLA terms and historical incident
      transparency are not fully public. This matters because Lumin is the primary retail and
      commercial digital-banking provider for at least one named bank and because a failure at
      the engagement layer could affect customer access, transactions, and support. The
      heatmap therefore ranks evidence risk and plausible operating impact; it does not assign
      incident probabilities or claim that a control failure has occurred.
    claimRefs: [CR003, CR009, CR010, CR015]
    figureRefs: [FR001]
  - id: regulatory-security
    title: Regulatory, privacy, and security exposure
    body: >-
      Lumin serves regulated financial institutions and handles a digital layer through which
      customer information and banking workflows pass. The FTC's Safeguards Rule requires
      covered companies to maintain administrative, technical, and physical safeguards, but
      the assigned evidence does not establish Lumin's precise legal role or the allocation of
      duties between Lumin and each client institution. NIST and CISA provide credible control
      frameworks, while a current Lumin job description indicates that AI standards, review
      processes, decision rights, and escalation paths are being formalized with Risk,
      Compliance, and Legal. That hiring signal is a mitigation effort, not proof that controls
      are complete or effective.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR001]
  - id: operational-resilience
    title: Operational resilience and execution risk
    body: >-
      NewView Capital claims 99.999% uptime and a single-tenant architecture, but it is an
      investor and the evidence set contains no independent SLA measurement or status-history
      record. Operational risk also extends beyond hosting: RFP Wiki says digital-banking
      replacements remain multi-month programs with data-migration and change-management
      dependencies. Lumin's AI governance role is charged with evaluating model capability,
      cost, reliability, security, and business fit, which shows management attention while
      also revealing a broad control surface. Investment approval should require customer-level
      launch records, severity-one incident data, recovery tests, model inventories, and
      evidence that controls operate consistently across deployments.
    claimRefs: [CR002, CR003, CR004, CR005, CR007, CR008]
    tableRefs: [TR002]
  - id: dependency-financial-kill-criteria
    title: Dependencies, financial opacity, and kill criteria
    body: >-
      NewView reports more than 200 third-party integrations, so core processors and partner
      services are both a distribution asset and a failure-propagation surface. Separately,
      15 additional clients reportedly invested in the July 2026 financing. Customer capital
      can align incentives, but public evidence does not disclose revenue concentration,
      governance rights, pricing concessions, or whether client-investors receive different
      commercial terms. More than $115 million of fresh financing is not cash available or
      runway, and revenue, ARR, profitability, burn, and debt remain undisclosed. Kill criteria
      should include unresolved material control exceptions, repeated severe outages, failed
      recovery tests, unacceptable top-customer or vendor concentration, or a runway below
      the board's next financing milestone after verified cash and burn are obtained.
    claimRefs: [CR001, CR011, CR012, CR013, CR014, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule or exposure
      - Jurisdiction
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Customer-information safeguards / GLBA Safeguards Rule
        - United States
        - "FTC requirements are public; Lumin applicability, responsibility allocation, and control evidence are not established."
        - "Medium applicability and control-verification risk; not an allegation of noncompliance."
        - "High if applicable safeguards fail because customer information could be affected."
        - "Not publicly evidenced in the assigned source set."
        - "High evidence risk until legal scope and tested controls are verified."
        - "Obtain counsel's applicability memo, client responsibility matrix, latest SOC report, exceptions, and remediation status."
      - - Banking compliance and auditability
        - United States financial-institution clients
        - "RFP Wiki says public audit-trail and regulatory-reporting detail is thin."
        - "Medium verification risk; event likelihood is not quantified."
        - "High because weak auditability can impair client compliance and examinations."
        - "Product controls are described, but an auditable control package is not public."
        - "Medium-high pending client and auditor evidence."
        - "Review KYC/AML/BSA/GLBA control mappings, audit logs, data residency, regulatory updates, and examination findings."
      - - AI governance, privacy, and model risk
        - United States and client contractual regimes
        - "A September 2026 Lumin job description says standards, decision rights, reviews, and escalation paths are being established."
        - "Medium execution risk during governance buildout; no incident rate is available."
        - "High where AI touches sensitive data or regulated decisions."
        - "Developing; the hiring signal does not prove operating effectiveness."
        - "Medium-high until model inventory, use restrictions, and monitoring are tested."
        - "Inspect model and vendor inventory, data-flow maps, approval records, evaluations, human override, and incident playbooks."
    notes: >-
      Partial public-source register, ordered by assessed impact and evidence risk rather than
      observed violation frequency; categorical likelihoods are diligence assessments, not
      measured probabilities, and no assigned source establishes a Lumin enforcement action.
    enumerationScope:
      coverage: partial
      basis: >-
        Public obligations and control gaps visible in the assigned sources as of 2026-10-23;
        private contracts, audits, dockets, examinations, and incident records are excluded.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Platform outage or failed recovery
        - "Medium evidence risk; actual incident frequency is unknown."
        - "Critical for affected financial institutions and account holders."
        - "Investor claims 99.999% uptime; contractual SLA, credits, status history, RTO, and RPO are not public."
        - "High until independently measured availability and recovery results are reviewed."
        - "Severity-one incident log, uptime calculations, disaster-recovery tests, and customer SLA attainment."
      - - Core integration or data-migration failure
        - "Medium; RFP Wiki identifies multi-month migrations and core complexity as continuing risks."
        - "High because errors can delay launches or disrupt customer data and workflows."
        - "Cloud and abstraction claims are positive, but deployment-specific evidence is required."
        - "Medium-high, varying by core vendor, release, data quality, and rollout design."
        - "Implementation variance, reconciliation results, rollback tests, and references on each supported core."
      - - Third-party integration or supply-chain compromise
        - "Medium exposure signal from more than 200 reported integrations; failure frequency is unknown."
        - "High because a partner failure can propagate into banking journeys."
        - "CISA and NIST provide control baselines, but Lumin's vendor-control implementation is private."
        - "Medium-high pending dependency tiering and tested failover."
        - "Critical-vendor inventory, subprocessor list, security clauses, monitoring, contingency plans, and concentration."
      - - AI cost, reliability, privacy, or model-control failure
        - "Medium execution risk as AI investment expands; no loss rate is available."
        - "High where outputs affect service, sensitive data, or regulated workflows."
        - "A senior governance role is being recruited to evaluate models, vendors, spend, security, and reviews."
        - "Medium-high until operating standards and production evaluations are demonstrated."
        - "Use-case inventory, model evaluations, cost limits, red-team results, data retention, overrides, and escalation metrics."
    notes: >-
      Qualitative likelihood and severity assessments combine company- or investor-issued
      architecture claims with independent procurement guidance; they do not establish that a
      Lumin outage, breach, migration failure, or AI incident occurred.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR007, CR008]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Core and fintech integration ecosystem
        - "Core processors and more than 200 reported third-party solutions"
        - "Account data, transaction, fraud, identity, support, and engagement workflows"
        - "Unknown by transaction volume, client, partner, and criticality tier."
        - "A core or partner change, outage, or compromise disrupts dependent journeys."
        - "High"
        - "Require dependency tiering, contractual controls, monitoring, failover, and tested exit plans."
        - "High until critical-path concentration and recovery are measured."
      - - Customer-investor overlap
        - "Fifteen additional clients reportedly joined the July 2026 financing"
        - "Customers, capital providers, references, and potential governance participants"
        - "Revenue, ownership, voting rights, and commercial-term concentration are unknown."
        - "A major client departure affects revenue, reference quality, and investor alignment simultaneously."
        - "High if a small cohort dominates revenue or governance."
        - "Review cap table, side letters, pricing, board rights, renewals, and non-investor customer cohorts."
        - "Medium-high evidence risk; the public record does not establish a conflict."
      - - Growth capital and roadmap execution
        - "Light Street Capital, client investors, and other shareholders"
        - "Funds AI, payments, CRM, lending, and operating scale"
        - "More than $115 million was raised, but cash available, debt, burn, and runway are undisclosed."
        - "Roadmap breadth outpaces resources or forces financing on unfavorable terms."
        - "High under a short-runway scenario; current runway is unknown."
        - "Tie roadmap gates to verified cash, burn, customer demand, implementation capacity, and board-approved milestones."
        - "High evidence risk until audited financials and liquidity are supplied."
    notes: >-
      The financing amount is funding raised, not cash available; concentration and runway
      values are intentionally shown as unknown because the assigned public sources do not
      disclose the required denominators or current balance-sheet data.
    claimRefs: [CR001, CR010, CR011, CR012, CR013, CR014, CR016]
figures:
  - id: FR001
    title: Diligence-priority risk heatmap
    type: matrix
    summary: >-
      Categorical prioritization of exposure signals and evidence gaps; likelihood labels are
      not measured incident probabilities.
    data:
      columns:
        - label: Exposure likelihood signal
          detail: "Qualitative signal from the assigned evidence, not a measured probability."
        - label: Impact
          detail: "Potential consequence if the failure mode occurs."
        - label: Mitigation evidence
          detail: "Maturity visible in public evidence."
        - label: Residual exposure
          detail: "Post-mitigation diligence priority given missing evidence."
      rows:
        - label: Security and incident assurance
          note: "No assigned source establishes an incident history in either direction."
          values:
            - label: Medium
              detail: "Mission-critical exposure is clear; event frequency is unknown."
            - label: Critical
            - label: Limited public evidence
            - label: High
        - label: Availability and disaster recovery
          note: "Investor uptime claim is not an independently measured SLA record."
          values:
            - label: Medium
            - label: Critical
            - label: Claimed, not verified
            - label: High
        - label: Core migration and implementation
          values:
            - label: Medium
            - label: High
            - label: Partial
            - label: Medium-high
        - label: Third-party integration chain
          values:
            - label: Medium
            - label: High
            - label: Not public
            - label: Medium-high
        - label: AI governance and execution
          values:
            - label: Medium
            - label: High
            - label: Developing
            - label: Medium-high
        - label: Financial runway and roadmap breadth
          note: "Funding raised is not cash available or runway."
          values:
            - label: Unknown
            - label: High
            - label: Funding disclosed
            - label: High evidence risk
    approximationNotes: >-
      Ordinal labels synthesize cited exposure and disclosure gaps without numeric scoring,
      probability estimates, or claims that an incident has occurred.
    claimRefs: [CR003, CR004, CR005, CR009, CR012, CR013, CR015]
callouts:
  - calloutType: recommendation
    title: Evidence-based kill criteria
    body: >-
      Pause or reject an investment if direct diligence finds unresolved material security
      exceptions, repeated severe outages, failed recovery tests, unacceptable customer or
      critical-vendor concentration, or verified cash and burn that leave insufficient runway
      to the next board-approved financing or product milestone.
    claimRefs: [CR003, CR009, CR012, CR013, CR014, CR016]
