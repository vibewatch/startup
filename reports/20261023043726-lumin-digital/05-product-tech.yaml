  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public developer activity, API adoption, package downloads, repository activity, or practitioner-community usage metrics tied specifically to Lumin.
      whyItMatters: SDK and API extensibility are part of the product thesis, but adoption and ecosystem depth affect implementation leverage and switching risk.
      diligencePath: Request API usage, active developer counts, integration inventory, sandbox documentation, release notes, and reference calls with institution engineering teams.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: security-disclosure
      missingEvidence: Current independent control reports, penetration-test summary, incident history, recovery-test results, and contractual uptime remedies.
      whyItMatters: Financial institutions carry regulated access and continuity obligations even when the digital channel is vendor-hosted.
      diligencePath: Obtain current SOC 2 Type II and relevant ISO reports, security questionnaire responses, RTO/RPO evidence, incident register, and SLA schedules.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
