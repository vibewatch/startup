schemaVersion: "report-v2"
artifact: product-tech
slug: lumin-digital
runDate: 2026-10-23
company:
  name: Lumin Digital
chapter:
  number: 5
  title: Product & Technology
  summary: Lumin Digital is positioned as a cloud-native engagement layer above an institution's core systems, combining retail, commercial, account-opening, analytics, and extensibility capabilities. Public evidence supports a modular, integration-heavy operating model, but detailed architecture, certification evidence, production reliability, and developer adoption remain insufficiently disclosed for high-confidence technical underwriting.
sections:
  - id: product-and-user-workflow
    title: Product definition and buyer workflow
    body: >-
      Lumin Digital sells an institutional digital-banking layer rather than a consumer
      banking account. The assigned evidence describes retail and commercial banking,
      digital account opening, engagement, analytics, risk tooling, and SDK/API
      extensibility. The buyer is a bank or credit union; the end user is its member,
      customer, business user, or applicant. This distinction matters because value
      depends on the institution's core integrations, journey configuration, staff
      adoption, and change-management capacity, not only on the quality of a mobile
      interface. The platform is therefore best assessed as a workflow and orchestration
      product above existing ledger infrastructure.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-deployment-and-maturity
    title: Architecture, deployment, and maturity
    body: >-
      The strongest public technical description is a vendor-positioned architecture
      summary: microservices are described as independently scalable, each client as
      having a dedicated hosting environment, and web and mobile as sharing a
      consistent code base. The same source says Lumin advertises weekly updates,
      99.999% uptime, APIs, an SDK, and a Developer Portal; these are company claims
      that require contract, deployment, and operational evidence. External procurement
      guidance adds a material implementation caveat: digital-banking replacements can
      take substantially longer than headline vendor timelines when data migration,
      core integration, and lending are included. Eclipse Bank's selection supports
      retail-plus-commercial scope and third-party extensibility, but does not prove
      production outcomes or technical performance.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-trust-and-gaps
    title: Differentiation, trust, and diligence gaps
    body: >-
      Differentiation appears to come from a combination of cloud delivery, release
      cadence, configurable journeys, institutional integrations, and an ecosystem of
      fraud, payments, and other partners rather than from a publicly demonstrated
      proprietary algorithm. Customer evidence is directionally positive: archived G2
      material includes high ratings and reports of smooth implementation, responsive
      support, and continuous updates, while also noting feature velocity can leave
      some releases less fully developed and that support timing and customization
      deserve scrutiny. Financial-institution authentication guidance makes access
      risk, multifactor controls, and equivalent-strength safeguards part of the
      buyer's control environment. No assigned source verifies Lumin's SOC 2/ISO
      reports, incident history, disaster-recovery tests, API adoption, or public
      developer activity. FIDO's passkey guidance and BioCatch's behavioral-risk
      tooling show relevant control patterns, but neither proves that Lumin has
      implemented those controls. These are explicit diligence gaps rather than
      inferred weaknesses.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015, CE016]
    tableRefs: []
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate product capability from evidence quality. Company and
      partner materials establish the stated product scope and roadmap, while
      independent procurement guidance, customer reviews, and regulatory guidance
      identify the implementation, support, security, and evidence checks required
      before treating those claims as verified technical maturity. They should be
      read as a diligence map, not as a substitute for a customer-specific technical
      evaluation: the same platform can have different migration effort, controls,
      module availability, and outcomes across core systems and institution sizes.
    claimRefs: [CE005, CE011, CE013]
    tableRefs: []
    figureRefs: []
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Primary user, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Retail banking", "Consumer members and customers", "Product scope publicly described", "Online and mobile banking experience above the core", "Validate adoption and production reliability by core platform"]
      - ["Commercial banking", "Business users and relationship teams", "Product scope publicly described", "Retail-plus-commercial coverage in one platform", "Validate treasury depth and workflow completeness"]
      - ["Digital account opening", "Applicants and operations teams", "Product scope publicly described", "Identity, liveness, and KYC workflow configuration is described", "Obtain control mappings, conversion rates, and exception-handling evidence"]
      - ["Engagement, analytics, and risk", "Institution product and risk teams", "Product scope publicly described", "Data-driven targeting and fraud/risk tooling", "Verify module attach, measurable outcomes, and third-party dependencies"]
      - ["SDK, APIs, and Developer Portal", "Institution developers and integration teams", "Extensibility is described; adoption is unverified", "Allows custom navigation, tiles, and third-party connections", "Request API documentation, usage metrics, versioning, and support SLAs"]
    notes: >-
      Scope and maturity labels reflect public descriptions, not an independent product
      audit. “Publicly described” does not establish general availability, contractual
      inclusion, or production performance.
    claimRefs: [CE001, CE003, CE005, CE006]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit or proof, Limitation]
    rows:
      - ["Serve consumer banking needs", "Fragmented or legacy online and mobile channels", "Unified retail digital-banking experience", "BCU case material reports 89% of daily logins from mobile devices", "BCU behavior is one customer case and not a platform-wide benchmark"]
      - ["Open a new account", "Application, identity, and onboarding steps may be split", "Configurable account-opening flow with identity, liveness, and KYC checks", "Workflow components are described, but conversion and false-positive data are unavailable", "Validate control mappings and operating metrics"]
      - ["Support business banking", "Separate or less integrated commercial workflows", "Commercial banking layer with permissions and transaction controls", "Commercial coverage is repeatedly described in assigned sources", "Validate treasury and relationship-manager depth"]
      - ["Extend the experience", "Vendor roadmap alone may limit institution-specific changes", "SDK, APIs, Developer Portal, and partner integrations", "Extensibility is a stated capability, not evidence of developer adoption or time-to-integrate", "Request sandbox and integration references"]
      - ["Protect digital access", "Password and credential risks remain in the customer journey", "Risk controls and partner fraud tooling are part of the described ecosystem", "FDIC guidance requires institution-specific authentication risk management", "Lumin control evidence and incident history are not public in this pool"]
    notes: >-
      The BCU metric is a customer-case observation; no common denominator supports
      comparison across Lumin customers. Security rows distinguish regulatory
      expectations from evidence of Lumin's implementation.
    claimRefs: [CE004, CE007, CE010, CE013, CE014, CE015, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Institution systems", "Accounts and connected services", "Existing core and third-party systems", "Require reference deployments on the institution's exact core and data flows"]
      - ["Integration and orchestration", "Connects institution systems to platform workflows", "Core connectors, APIs, migration, and configuration", "Validate connector coverage, latency, reconciliation, and rollback"]
      - ["Lumin platform", "Banking, account opening, engagement, analytics, and risk capabilities", "Vendor-hosted service and partner components", "Verify tenant isolation, release controls, SLA credits, and roadmap dependencies"]
      - ["Customization and developer layer", "Navigation, tiles, and third-party integrations", "SDK, APIs, Developer Portal, and institution engineering capacity", "Obtain documentation, version policy, sandbox access, and support metrics"]
      - ["Web and mobile channels", "Customer-facing experience", "Shared code base and institution branding/configuration", "Test accessibility, release acceptance, and channel parity"]
      - ["Trust and operations", "Authentication, fraud, support, and continuity", "Institution controls plus vendors such as fraud partners", "Request SOC 2/ISO evidence, penetration tests, RTO/RPO, incidents, and recovery tests"]
    notes: >-
      This is an evidence-bounded operating model, not a verified system diagram.
      Several dependencies and controls are diligence requests because the assigned
      public sources do not provide architecture diagrams, audit reports, or service
      telemetry.
    claimRefs: [CE005, CE006, CE008, CE009, CE013, CE014, CE015, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Lumin is described as an engagement layer connecting institution systems to configurable digital workflows and customer-facing channels.
    data:
      layers:
        - label: Institution systems
          detail: Existing core and connected services remain dependencies for the customer-facing layer.
          items:
            - Core accounts and services
            - Risk and decision inputs
        - label: Lumin platform
          detail: Banking, onboarding, engagement, analytics, and risk capabilities are described as the hosted product layer.
          items:
            - Retail and commercial banking
            - Account opening and engagement
        - label: Experience and extensibility
          detail: Customer-facing channels and integration tooling expose the configured experience to members and institution teams.
          items:
            - Web and mobile channels
            - SDK, APIs, and partners
        - label: Integration and migration
          detail: Core connectivity, configuration, data migration, and partner services determine implementation effort and time to value.
          items:
            - Core connectors and data mapping
            - Migration, testing, and rollout
        - label: Trust and access
          detail: Authentication, fraud controls, and institution risk management govern access to financial services.
          items:
            - Multifactor and phishing-resistant controls
            - Fraud and identity signals
        - label: Support and continuity
          detail: Release acceptance, incident response, service levels, and recovery processes remain buyer-side diligence requirements.
          items:
            - Release and support operations
            - Recovery and SLA evidence
    approximationNotes: >-
      Layer order expresses the described operating relationship, not measured
      dependency direction or technical completeness. It omits undisclosed services
      and does not imply that every listed module is included in every contract.
    claimRefs: [CE005, CE006, CE007]
callouts:
  - calloutType: strength
    title: Clear institutional product thesis
    body: >-
      Lumin's product scope is coherent for banks and credit unions seeking a
      customer-facing digital layer without replacing the core ledger, with retail,
      commercial, onboarding, and extensibility capabilities described across multiple
      assigned sources.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Technical maturity is not independently proven
    body: >-
      The most consequential claims—99.999% uptime, weekly releases, dedicated
      environments, security certifications, implementation performance, and API
      adoption—need buyer-side evidence, contract review, and reference checks.
    claimRefs: [CE005, CE008, CE009, CE013]
  - calloutType: recommendation
    title: Make integration and controls the next gate
    body: >-
      A technical diligence process should require an exact-core reference,
      migration rehearsal, API and sandbox review, release-acceptance process,
      incident history, recovery tests, and current independent control reports before
      underwriting deployment maturity.
    claimRefs: [CE008, CE009, CE013, CE014]
