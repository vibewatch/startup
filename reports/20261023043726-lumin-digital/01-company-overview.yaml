company:
  name: "Lumin Digital"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Lumin Digital is a San Ramon-based, founder-led digital banking platform whose July 2026 financing put the company at a reported $1.6 billion valuation. Customer participation in the round is a notable alignment signal, but the assigned public evidence does not disclose revenue, ARR, headcount, cash, a complete leadership team, or board composition."
sections:
  - id: "identity-and-business-model"
    title: "Identity, stage, and business model"
    body: >-
      Founded in 2016 and headquartered in San Ramon, California, Lumin Digital provides a cloud-native engagement layer for banks and credit unions rather than operating as a consumer-facing bank. The product evidence spans online and mobile banking, digital account opening, user engagement, analytics, and retail and commercial modules. A July 2026 financing valued the private company at $1.6 billion, supporting a growth-stage or unicorn description but not a conclusion about public-market readiness. FinTech Futures reported roughly 90 financial-institution customers. That customer count is a current scale marker, while revenue, ARR, headcount, profitability, and cash remain unavailable in the assigned evidence and should not be inferred from capital raised or modeled customer value.
    claimRefs: [CO001, CO002, CO003, CO007, CO010, CO011]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance visibility"
    body: >-
      Jeff Chambers is consistently identified as Lumin Digital's founder and CEO, making founder continuity the clearest leadership fact in the pool. The same evidence does not provide a complete executive roster, board membership, committee structure, succession plan, or record of material leadership changes. This is an evidence limitation, not proof that those governance mechanisms are absent. Publicly visible strategy and financing commentary is therefore concentrated around Chambers, creating a diligence need around delegation, technical and go-to-market bench strength, and investor or customer representation in governance. Management biographies, the board register, reserved matters, and key-person provisions should be reviewed before assigning a lower governance-risk rating.
    claimRefs: [CO004, CO005]
    tableRefs: [TO002]
  - id: "capital-and-stakeholder-alignment"
    title: "Capital history and stakeholder alignment"
    body: >-
      On July 15, 2026, Lumin announced more than $115 million of new capital: more than $70 million from 15 client investors and $45 million of Light Street Capital-led growth equity. The financing followed a $170 million growth round in December 2024 and more than $75 million of client investment announced in March 2025. One third-party profile estimates cumulative funding of at least $484 million across six rounds, but that estimate is not audited and does not equal cash available. The client-investor model creates unusually direct economic alignment with users, while also raising questions about customer concentration, commercial preferences, governance rights, and whether investor-clients receive terms that differ from non-investing customers.
    claimRefs: [CO006, CO007, CO008, CO009, CO012, CO013]
    tableRefs: [TO003]
  - id: "milestones-and-diligence-risks"
    title: "Milestones, expansion, and diligence risks"
    body: >-
      The disclosed chronology shows a 2016 founding, a 2018 market launch, financings in 2019 and 2021, larger growth rounds from 2024 onward, and a 2026 roadmap broadening into AI, payments, CRM, and lending. Eclipse Bank's selection of Lumin for retail and commercial digital banking provides a fresh customer-expansion signal. The assigned adverse evidence is narrower: RFP Wiki highlights custom pricing, core-integration and implementation costs, and proprietary-stack lock-in, while Renascence warns that shared platforms can homogenize customer experience. No regulator, court, outage, or breach record was available in the assigned successful pool. That absence is a source-coverage gap rather than evidence that no incident occurred.
    claimRefs: [CO001, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
