companyProfile:
  summary: >-
    Lumin Digital is a San Ramon-based digital banking platform founded in 2016 and built for credit unions and
    community banks. Its cloud-native engagement layer spans online and mobile banking, digital account opening,
    analytics, retail and commercial modules, and partner-led workflows. The company has reported roughly 90
    financial-institution customers and a July 2026 financing at an approximately $1.6 billion valuation, while public
    evidence does not disclose the operating metrics or transaction terms needed to underwrite that mark.
