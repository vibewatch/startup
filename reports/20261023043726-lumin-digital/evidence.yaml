evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive biographies, board and committee roster, governance rights, succession planning, and material
      leadership-change history.
    whyItMatters: >-
      Founder dependence and the oversight implications of investor-client ownership cannot be evaluated from one
      publicly named executive.
    diligencePath: >-
      Request the current organization chart, board register, committee mandates, cap-table rights matrix, succession
      plan, and three-year leadership-change log.
    relatedQuestionRefs:
      - QO002
      - QO003
