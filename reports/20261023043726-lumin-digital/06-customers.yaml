    enumerationScope:
      coverage: partial
      basis: "Publicly named institutions and customer-review evidence available in the assigned pool as of October 23, 2026"
    columns: [Customer or cohort, Segment / use case, Production vs pilot, Outcome or signal, Limitation]
    rows:
      - ["Freedom Credit Union", "Credit union digital banking", "Production go-live", "Named among seven latest go-lives", "No retention or outcome metric disclosed"]
      - ["Premier America Credit Union", "Credit union digital banking", "Production go-live", "Named among seven latest go-lives", "No retention or outcome metric disclosed"]
      - ["Wings Credit Union", "Credit union digital banking and client-investor relationship", "Production go-live and client investor", "Named in latest go-lives and March 2025 client-investment announcement", "Investment is not renewal or usage proof"]
      - ["Eclipse Bank", "Community bank retail and commercial banking", "Provider selection; rollout outcome not yet disclosed", "CEO described a need for customized digital banking", "Announcement does not establish launch, adoption, or ROI"]
      - ["BCU / Redwood Credit Union / Consumers Credit Union / Summit Credit Union", "Credit-union client community", "Existing clients named as investors or advisory participants", "Client-investment announcement says five investors would serve on a Member Advisory Committee", "Governance participation does not disclose cohort retention"]
      - ["Anonymous G2 reviewers", "Mid-market financial institutions", "Existing customer reviews", "Archived G2 page reports 19 reviews and 4.7/5 overall rating", "Reviews are dated 2024–2025 and are not a current representative sample"]
    notes: "This is a partial public enumeration, not a complete customer list; named production status is based on the source wording, while review outcomes and investor participation are separate evidence categories."
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from institution selection to expansion
    type: journey-map
    summary: Public evidence supports a journey from institution selection through complex migration and multi-module operation, but retention and expansion outcomes remain open.
    data:
      nodes:
        - id: institution-fit
          label: Institution fit
          title: Institution fit
          detail: Credit unions and community banks evaluate a cloud-native digital-banking platform for retail and commercial workflows.
          touchpoints: ["Buyer: institution leadership", "Users: members and customers"]
        - id: provider-selection
          label: Provider selection
          title: Provider selection
          detail: Eclipse Bank selected Lumin as its primary digital-banking provider for retail and commercial offerings.
          touchpoints: ["Procurement and strategic fit", "Customization expectations"]
        - id: migration
          label: Migration and integration
          title: Migration and integration
          detail: Recent launches covered platform conversion, integrations, data migration, and launch readiness across three core systems.
          touchpoints: ["Symitar", "Corelation Keystone", "Fiserv DNA"]
        - id: go-live
          label: Go-live
          title: Go-live
          detail: Seven institutions went live in just over four months, including two institutions navigating an active merger.
          touchpoints: ["Consumer banking", "Business banking", "Digital account opening"]
        - id: engagement
          label: Engagement and support
          title: Engagement and support
          detail: Customer reviews cite partnership, support, usability, and continuing feature updates, with some reservations about pricing and feature completeness.
          touchpoints: ["Support", "Analytics", "Enhancement pricing"]
        - id: expansion-proof
          label: Expansion proof still pending
          title: Expansion proof still pending
          detail: Public sources do not disclose renewal, churn, net retention, module attach, or customer-level revenue outcomes.
          touchpoints: ["Required: cohort retention", "Required: utilization", "Required: concentration"]
    claimRefs: [CU002, CU005, CU009, CU014, CU015]
callouts:
  - calloutType: strength
    title: Recent implementation breadth is credible but company-issued
    body: The October 2026 go-live release names institutions, modules, core systems, and merger complexity, providing more customer proof than an undifferentiated logo wall. The evidence remains a company announcement rather than an independently audited deployment dataset.
    claimRefs: [CU001, CU005, CU006]
  - calloutType: risk
    title: Retention and concentration cannot be underwritten publicly
    body: Neither the assigned current sources nor the archived customer-review evidence establishes GRR, NRR, churn, contract duration, customer revenue concentration, or post-launch utilization. These are material diligence blockers for a platform whose valuation depends on durable institutional relationships.
    claimRefs: [CU016, CU017]
  - calloutType: recommendation
    title: Request cohort and economics schedules
    body: Obtain customer-level cohorts showing go-live date, contract value, modules purchased, active-user utilization, renewal status, gross and net retention, implementation cost, and the top-ten customer revenue share, with client-investor relationships identified separately.
    claimRefs: [CU016, CU017]
