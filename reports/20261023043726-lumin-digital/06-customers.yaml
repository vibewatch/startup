company:
  name: Lumin Digital
chapter:
  number: 6
  title: Customers
  summary: Lumin's customer evidence points to a scaled bank and credit-union platform with recent go-lives, named client participation in financing, and positive customer reviews. Public evidence is strongest for implementation breadth and customer advocacy; retention, revenue concentration, contract economics, and post-launch usage remain unverified.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: Lumin sells to financial institutions rather than directly to consumers. The buyer is typically a bank or credit union seeking a digital front end for retail and commercial users, while the users are the institution's members, account holders, and business customers. The October 2026 go-live announcement names Freedom Credit Union, Premier America Credit Union, Wings Credit Union, Neighbors Federal Credit Union, and Point Breeze Credit Union, and describes consumer banking, business banking, digital account opening, payments, fraud protection, and analytics across the launches. This supports a segment view based on institution type, customer workflow, and implementation complexity rather than a consumer-app user count alone. The Eclipse announcement adds a community-bank example spanning retail and commercial banking, but its claims are largely promotional and do not disclose contract value or active usage. Public sources do not establish Lumin's pricing, revenue band by account, or concentration by institution.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption and deployment trajectory
    body: The clearest current adoption signal is deployment activity. Lumin said seven financial institutions went live in just over four months, representing 19 platform modules across three core systems and nearly one million users; the same release says two institutions migrated during a merger and that implementations included platform conversion, integrations, data migration, and launch readiness. These are company-issued implementation claims, not independently audited active-user or revenue metrics. A separate customer-platform profile reports nearly eight million consumer accounts across 90 financial institutions and more than eight million users under contract, while its source attribution points to Lumin materials. The figures are directionally consistent with scale but use different denominators and should not be combined into a conversion funnel. The evidence supports meaningful deployment breadth, not utilization, renewal, or realized economic value.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof and durability
    body: >-
      Named customer evidence is broader than a logo list but still uneven in quality. The current go-live release identifies five institutions and describes work through mergers; FF News reports Eclipse Bank selected Lumin as its primary digital-banking provider for retail and commercial offerings, with Eclipse's CEO describing the intended relationship and customization. Archived G2 material supplies independent user-level evidence: 19 reviews with a 4.7 out of 5 rating, praise for partnership, support, and smooth implementation, and reservations about core parity, enhancement pricing, feature completeness, and analytics being separately included. These reviews are dated 2024–2025 and therefore are not proof of current retention. The March 2025 client-investment announcement says more than 20 clients invested and names BCU, Redwood Credit Union, Wings Credit Union, Consumers Credit Union, and Summit Credit Union in a Member Advisory Committee, which is evidence of commercial alignment but not a disclosed renewal cohort.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: retention-and-concentration
    title: Retention, expansion, and concentration gaps
    body: Lumin's public narrative emphasizes expansion through additional modules, analytics, payments, lending, and CRM, and its latest go-live release says clients continued serving members during migrations. However, no assigned source discloses gross retention, net retention, churn, contract length, cohort behavior, customer-level revenue, or top-customer concentration. The client-investor model may align customers with the vendor, but it can also make customer references and capital participation a poor proxy for ordinary renewal behavior. G2 reviewers describe strong vendor support and ongoing product updates while also noting additional costs for enhancements or integrations and some feature immaturity. RFP guidance similarly frames fit constraints around institutions needing a broad, integrated platform, but it is a third-party market description rather than a verified customer outcome. The investment case therefore depends on obtaining cohort-level retention, attach, utilization, implementation cost, and concentration schedules.
    claimRefs: [CU014, CU015, CU016, CU017]
