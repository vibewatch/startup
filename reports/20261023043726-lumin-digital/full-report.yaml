        title: Capital history and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              On July 15, 2026, Lumin announced more than $115 million of new capital: more than $70 million from 15
              client investors and $45 million of Light Street Capital-led growth equity. The financing followed a $170
              million growth round in December 2024 and more than $75 million of client investment announced in March
