      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2016 and headquartered in San Ramon, California, Lumin Digital provides a cloud-native
              engagement layer for banks and credit unions rather than operating as a consumer-facing bank. The product
              evidence spans online and mobile banking, digital account opening, user engagement, analytics, and retail
              and commercial modules. A July 2026 financing valued the private company at $1.6 billion, supporting a
              growth-stage or unicorn description but not a conclusion about public-market readiness. FinTech Futures
              reported roughly 90 financial-institution customers. That customer count is a current scale marker, while
              revenue, ARR, headcount, profitability, and cash remain unavailable in the assigned evidence and should
              not be inferred from capital raised or modeled customer value.
