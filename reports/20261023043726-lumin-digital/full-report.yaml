              Public coverage says Lumin exceeded financial goals while improving margins and operational efficiency,
              but it supplies no revenue denominator, margin definition, cash balance, burn rate, runway, debt schedule,
              or free-cash-flow bridge. A cited 145% five-year return on investment measures modeled value for client
              institutions; it is neither Lumin revenue nor vendor CAC payback. The strongest financial conclusion is
              therefore mixed: current adoption and fresh capital support continued investment, yet revenue quality,
              delivery cost, contribution margin, liquidity, and financing dependence remain unquantified. Underwriting
              should remain conditional on management financials, contract cohorts, implementation economics, and a
              post-financing liquidity bridge rather than treating funding raised as cash available.
            claimRefs:
