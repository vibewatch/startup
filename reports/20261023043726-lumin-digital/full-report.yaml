            body: >-
              The visible go-to-market motion is relationship-led enterprise selling into financial institutions.
              Kirtland described a long-term digital partner decision, and Eclipse selected Lumin as its primary
              provider across retail and commercial banking. RFP Wiki reports that pricing is custom-quoted and that
              total cost depends on licensed editions, core integration, migration, implementation services, and roadmap
