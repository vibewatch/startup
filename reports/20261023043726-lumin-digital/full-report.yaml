  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is institution-facing digital banking infrastructure for U.S. credit unions and
              community banks: online and mobile banking, digital account opening, engagement, payments, fraud controls,
              analytics, and the integrations required to operate those channels. It includes software subscriptions,
              implementation, migration, and ongoing platform services bought by regulated financial institutions. It
              excludes consumer neobanks, core banking systems outside the digital channel, payment-rail volume itself,
              and discretionary marketing software unless it is part of the digital-banking workflow. The status quo is
              not a single competitor; it is a legacy core-integrated wrapper, an incumbent bundled suite, an internal
              build, or delayed modernization. The boundary matters because a $2.43 trillion credit-union asset base and
              144.7 million members describe the served institution pool, not Lumin revenue or a software TAM.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports multiple market lenses but not a defensible single TAM/SAM/SOM number. The
              NCUA provides a regulated credit-union population, member count, assets, and loans; FDIC data provides a
              current health and scale context for insured banks and community banks; and Lumin-related sources show
              that platform demand converts into multi-institution implementations. These are complementary
              denominators, not additive revenue estimates. The practical serviceable market is narrower than all assets
              and wider than any one client cohort: it depends on institutions that can fund a multi-year digital
              transformation, operate across supported cores, and choose an external platform. Public sources do not
              disclose contract values, pricing, conversion rates, or Lumin's share, so the sizing conclusion is
              directional and should remain explicitly evidence-constrained.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM006
              - CM008
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is usually the financial institution's executive team and board, while the operational
              buyer spans digital, technology, operations, and vendor-management functions. The user population is the
              institution's consumer or business account holders; the payer is the institution, funded from technology
              and transformation budgets rather than directly by consumers. Adoption is triggered by a mobile-experience
              gap, a core conversion or merger, the need for digital account opening, fraud and payment modernization,
              or pressure to compete with national banks. Lumin's October 2026 launch evidence is especially relevant to
              the adoption path: seven institutions moved across 19 modules and three core systems, with two
              implementations occurring during mergers. That is evidence of a complex transformation motion, not proof
              that every institution will buy every module.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by the need for institutions to keep pace with mobile and remote payments, improve
              digital engagement, and obtain scale without building a full platform internally. The Federal Reserve's
              2025 payment-choice findings show mobile usage is especially high among younger adults, while the CSBS
              survey identifies technology implementation cost as a major external risk and cybersecurity as the leading
              internal risk for community banks. Those same facts describe the adoption friction: buyers need measurable
              member or customer outcomes, security and resilience, integration confidence, and a migration plan that
              does not interrupt service. Lumin's go-live claims suggest implementation capability can be a
              differentiator, but independent evidence on retention, contract economics, and sustained ROI remains
              limited. The market can grow while vendor economics remain constrained by long sales cycles, concentrated
              institutional budgets, and implementation capacity.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: What the market evidence supports
            body: >-
              The strongest investable market signal is not a generic digital-banking TAM; it is repeated institutional
              willingness to undertake expensive, regulated, multi-core migrations while preserving local-bank or
              credit-union relationships.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM012
          - type: callout
            title: Sizing gap
            body: >-
              Public evidence does not disclose Lumin pricing, contract duration, addressable institution counts by fit,
              or conversion share, so valuation should not capitalize the full asset or member denominator as software
              revenue.
            calloutType: risk
            claimRefs:
