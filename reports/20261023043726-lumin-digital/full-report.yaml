      - number: '5.2'
        title: Architecture, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest public technical description is a vendor-positioned architecture summary: microservices are
              described as independently scalable, each client as having a dedicated hosting environment, and web and
              mobile as sharing a consistent code base. The same source says Lumin advertises weekly updates, 99.999%
              uptime, APIs, an SDK, and a Developer Portal; these are company claims that require contract, deployment,
              and operational evidence. External procurement guidance adds a material implementation caveat:
              digital-banking replacements can take substantially longer than headline vendor timelines when data
              migration, core integration, and lending are included. Eclipse Bank's selection supports
              retail-plus-commercial scope and third-party extensibility, but does not prove production outcomes or
              technical performance.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
              - CE013
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Differentiation, trust, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Differentiation appears to come from a combination of cloud delivery, release cadence, configurable
              journeys, institutional integrations, and an ecosystem of fraud, payments, and other partners rather than
              from a publicly demonstrated proprietary algorithm. Customer evidence is directionally positive: archived
              G2 material includes high ratings and reports of smooth implementation, responsive support, and continuous
              updates, while also noting feature velocity can leave some releases less fully developed and that support
              timing and customization deserve scrutiny. Financial-institution authentication guidance makes access
              risk, multifactor controls, and equivalent-strength safeguards part of the buyer's control environment. No
              assigned source verifies Lumin's SOC 2/ISO reports, incident history, disaster-recovery tests, API
              adoption, or public developer activity. FIDO's passkey guidance and BioCatch's behavioral-risk tooling
              show relevant control patterns, but neither proves that Lumin has implemented those controls. These are
              explicit diligence gaps rather than inferred weaknesses.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate product capability from evidence quality. Company and partner materials establish
              the stated product scope and roadmap, while independent procurement guidance, customer reviews, and
              regulatory guidance identify the implementation, support, security, and evidence checks required before
              treating those claims as verified technical maturity. They should be read as a diligence map, not as a
              substitute for a customer-specific technical evaluation: the same platform can have different migration
              effort, controls, module availability, and outcomes across core systems and institution sizes.
            claimRefs:
              - CE005
              - CE011
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clear institutional product thesis
            body: >-
              Lumin's product scope is coherent for banks and credit unions seeking a customer-facing digital layer
              without replacing the core ledger, with retail, commercial, onboarding, and extensibility capabilities
              described across multiple assigned sources.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Technical maturity is not independently proven
            body: >-
              The most consequential claims—99.999% uptime, weekly releases, dedicated environments, security
              certifications, implementation performance, and API adoption—need buyer-side evidence, contract review,
              and reference checks.
            calloutType: risk
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE013
          - type: callout
            title: Make integration and controls the next gate
            body: >-
              A technical diligence process should require an exact-core reference, migration rehearsal, API and sandbox
              review, release-acceptance process, incident history, recovery tests, and current independent control
              reports before underwriting deployment maturity.
            calloutType: recommendation
            claimRefs:
              - CE008
              - CE009
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              Lumin sells to financial institutions rather than directly to consumers. The buyer is typically a bank or
              credit union seeking a digital front end for retail and commercial users, while the users are the
              institution's members, account holders, and business customers. The October 2026 go-live announcement
              names Freedom Credit Union, Premier America Credit Union, Wings Credit Union, Neighbors Federal Credit
              Union, and Point Breeze Credit Union, and describes consumer banking, business banking, digital account
              opening, payments, fraud protection, and analytics across the launches. This supports a segment view based
              on institution type, customer workflow, and implementation complexity rather than a consumer-app user
              count alone. The Eclipse announcement adds a community-bank example spanning retail and commercial
              banking, but its claims are largely promotional and do not disclose contract value or active usage. Public
              sources do not establish Lumin's pricing, revenue band by account, or concentration by institution.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU009
              - CU014
              - CU015
      - number: '6.2'
        title: Adoption and deployment trajectory
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption signal is deployment activity. Lumin said seven financial institutions went
              live in just over four months, representing 19 platform modules across three core systems and nearly one
              million users; the same release says two institutions migrated during a merger and that implementations
              included platform conversion, integrations, data migration, and launch readiness. These are company-issued
              implementation claims, not independently audited active-user or revenue metrics. A separate
              customer-platform profile reports nearly eight million consumer accounts across 90 financial institutions
              and more than eight million users under contract, while its source attribution points to Lumin materials.
              The figures are directionally consistent with scale but use different denominators and should not be
              combined into a conversion funnel. The evidence supports meaningful deployment breadth, not utilization,
              renewal, or realized economic value.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence is broader than a logo list but still uneven in quality. The current go-live
              release identifies five institutions and describes work through mergers; FF News reports Eclipse Bank
              selected Lumin as its primary digital-banking provider for retail and commercial offerings, with Eclipse's
              CEO describing the intended relationship and customization. Archived G2 material supplies independent
              user-level evidence: 19 reviews with a 4.7 out of 5 rating, praise for partnership, support, and smooth
              implementation, and reservations about core parity, enhancement pricing, feature completeness, and
              analytics being separately included. These reviews are dated 2024–2025 and therefore are not proof of
              current retention. The March 2025 client-investment announcement says more than 20 clients invested and
              names BCU, Redwood Credit Union, Wings Credit Union, Consumers Credit Union, and Summit Credit Union in a
              Member Advisory Committee, which is evidence of commercial alignment but not a disclosed renewal cohort.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Retention, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Lumin's public narrative emphasizes expansion through additional modules, analytics, payments, lending,
              and CRM, and its latest go-live release says clients continued serving members during migrations. However,
              no assigned source discloses gross retention, net retention, churn, contract length, cohort behavior,
              customer-level revenue, or top-customer concentration. The client-investor model may align customers with
              the vendor, but it can also make customer references and capital participation a poor proxy for ordinary
              renewal behavior. G2 reviewers describe strong vendor support and ongoing product updates while also
              noting additional costs for enhancements or integrations and some feature immaturity. RFP guidance
              similarly frames fit constraints around institutions needing a broad, integrated platform, but it is a
              third-party market description rather than a verified customer outcome. The investment case therefore
              depends on obtaining cohort-level retention, attach, utilization, implementation cost, and concentration
              schedules.
            claimRefs:
              - CU014
              - CU015
              - CU016
              - CU017
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recent implementation breadth is credible but company-issued
            body: >-
              The October 2026 go-live release names institutions, modules, core systems, and merger complexity,
              providing more customer proof than an undifferentiated logo wall. The evidence remains a company
              announcement rather than an independently audited deployment dataset.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU006
          - type: callout
            title: Retention and concentration cannot be underwritten publicly
            body: >-
              Neither the assigned current sources nor the archived customer-review evidence establishes GRR, NRR,
              churn, contract duration, customer revenue concentration, or post-launch utilization. These are material
              diligence blockers for a platform whose valuation depends on durable institutional relationships.
            calloutType: risk
            claimRefs:
              - CU016
              - CU017
          - type: callout
            title: Request cohort and economics schedules
            body: >-
              Obtain customer-level cohorts showing go-live date, contract value, modules purchased, active-user
              utilization, renewal status, gross and net retention, implementation cost, and the top-ten customer
              revenue share, with client-investor relationships identified separately.
            calloutType: recommendation
            claimRefs:
              - CU016
              - CU017
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk hierarchy and decision frame
        blocks:
          - type: paragraph
            body: >-
              The highest-priority diligence issue is assurance, not a documented breach or outage: the assigned
              evidence does not establish Lumin's incident history, contractual service levels, recovery performance,
              certification inventory, or regulatory examination results. RFP Wiki specifically flags that contractual
              SLA terms and historical incident transparency are not fully public. This matters because Lumin is the
              primary retail and commercial digital-banking provider for at least one named bank and because a failure
              at the engagement layer could affect customer access, transactions, and support. The heatmap therefore
              ranks evidence risk and plausible operating impact; it does not assign incident probabilities or claim
              that a control failure has occurred.
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR009
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, privacy, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Lumin serves regulated financial institutions and handles a digital layer through which customer
              information and banking workflows pass. The FTC's Safeguards Rule requires covered companies to maintain
              administrative, technical, and physical safeguards, but the assigned evidence does not establish Lumin's
              precise legal role or the allocation of duties between Lumin and each client institution. NIST and CISA
              provide credible control frameworks, while a current Lumin job description indicates that AI standards,
              review processes, decision rights, and escalation paths are being formalized with Risk, Compliance, and
              Legal. That hiring signal is a mitigation effort, not proof that controls are complete or effective.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational resilience and execution risk
        blocks:
          - type: paragraph
            body: >-
              NewView Capital claims 99.999% uptime and a single-tenant architecture, but it is an investor and the
              evidence set contains no independent SLA measurement or status-history record. Operational risk also
              extends beyond hosting: RFP Wiki says digital-banking replacements remain multi-month programs with
              data-migration and change-management dependencies. Lumin's AI governance role is charged with evaluating
              model capability, cost, reliability, security, and business fit, which shows management attention while
              also revealing a broad control surface. Investment approval should require customer-level launch records,
              severity-one incident data, recovery tests, model inventories, and evidence that controls operate
              consistently across deployments.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
      - number: '7.4'
        title: Dependencies, financial opacity, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              NewView reports more than 200 third-party integrations, so core processors and partner services are both a
              distribution asset and a failure-propagation surface. Separately, 15 additional clients reportedly
              invested in the July 2026 financing. Customer capital can align incentives, but public evidence does not
              disclose revenue concentration, governance rights, pricing concessions, or whether client-investors
              receive different commercial terms. More than $115 million of fresh financing is not cash available or
              runway, and revenue, ARR, profitability, burn, and debt remain undisclosed. Kill criteria should include
              unresolved material control exceptions, repeated severe outages, failed recovery tests, unacceptable
              top-customer or vendor concentration, or a runway below the board's next financing milestone after
              verified cash and burn are obtained.
            claimRefs:
              - CR001
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-based kill criteria
            body: >-
              Pause or reject an investment if direct diligence finds unresolved material security exceptions, repeated
              severe outages, failed recovery tests, unacceptable customer or critical-vendor concentration, or verified
              cash and burn that leave insufficient runway to the next board-approved financing or product milestone.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR009
              - CR012
              - CR013
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Lumin Digital's investment case rests on a specialized cloud-native digital-banking position for U.S.
              banks and credit unions, a July 2026 financing that included both a $45 million growth-equity component
              and more than $70 million from client investors, and reported deployment across approximately 90 financial
              institutions. The client-led financing is a meaningful alignment signal, but it is not an independent
              valuation benchmark. The anti-thesis is price opacity: public sources do not disclose revenue, ARR, gross
              margin, free cash flow, retention, contract duration, or preference terms. Third-party company databases
              also conflict on Lumin's ownership and funding history, reducing confidence in unsourced cap-table
              summaries. Comparable public vendors report materially different scale and profitability metrics, so
              applying their multiples to Lumin without a reconciled denominator would create false precision. A
              positive decision requires verified company financials and transaction documents, not only the headline
              valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.2'
        title: Entry discipline and financing context
        blocks:
          - type: paragraph
            body: >-
              The latest reported transaction is a mixed financing rather than a disclosed operating performance round:
              Lumin Digital said it raised more than $115 million at an approximately $1.6 billion valuation, combining
              client investment with growth equity led by Light Street Capital. Multiple current reports describe the
              same headline, but several are syndicated or publisher summaries of company-provided information and
              should be treated as corroboration of the announcement, not independent marks of fair value. A buyer or
              investor should obtain the capitalization table, security terms, liquidation preferences, option pool,
              pro-rata rights, debt, and the exact pre- and post-money definitions before translating the headline into
              common-equity value. Public pricing is also quote-based, with implementation, integration, training, and
              module scope affecting total cost of ownership.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The scenario table is intentionally evidence-constrained. A bull case is plausible if Lumin can
              substantiate scalable recurring revenue, strong retention, margin expansion, and successful adoption of
              AI, payments, CRM, and lending modules. The base case reflects a credible platform with unresolved
              economics and implementation risk. The bear case reflects multiple compression, slower bank and
              credit-union technology spending, customer concentration, or a down-round if the current mark is
              unsupported by revenue growth and cash generation. Public Alkami and Q2 disclosures provide
              model-appropriate operating references, including revenue, gross margin, and adjusted EBITDA, but their
              public-company scale, reporting definitions, and capital structures are not directly interchangeable with
              Lumin's private-company disclosures. An archived May 2024 Alkami valuation snapshot is useful only as
              historical context and is not a current multiple for the October 2026 run date.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Decision, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is research-more rather than buy or avoid. The platform and customer-investor
              model provide a credible operating thesis, while the absence of public revenue and cash-flow denominators
              prevents a defensible price-sensitive return case. Exit readiness is also unproven: no public evidence in
              the assigned pool establishes an IPO timetable, sale process, secondary liquidity, or the economics
              available to common holders. The decision should move toward buy only after receiving audited or
              management- certified financials, cohort retention, customer concentration, contract and pricing data,
              cap-table terms, security and incident history, and a valuation bridge. Thesis break triggers include a
              down round, material churn, failed implementations, repeated outages, inability to expand beyond the core
              digital channel, or evidence that the client-investor structure creates conflicts rather than durable
              retention.
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at the current mark
            body: >-
              The $1.6 billion headline valuation is current transaction context, not a demonstrated fair-value
              conclusion; require operating denominators and security terms before underwriting an entry price.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV014
              - CV015
          - type: callout
            title: Primary downside trigger
            body: >-
              A down round or weaker-than-expected retention and margin profile would expose the gap between financing
              headline and supportable common-equity value.
            calloutType: risk
            claimRefs:
              - CV013
              - CV016
