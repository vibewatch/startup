  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Lumin Digital sells an institutional digital-banking layer rather than a consumer banking account. The
              assigned evidence describes retail and commercial banking, digital account opening, engagement, analytics,
              risk tooling, and SDK/API extensibility. The buyer is a bank or credit union; the end user is its member,
              customer, business user, or applicant. This distinction matters because value depends on the institution's
              core integrations, journey configuration, staff adoption, and change-management capacity, not only on the
              quality of a mobile interface. The platform is therefore best assessed as a workflow and orchestration
              product above existing ledger infrastructure.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
          - type: table
