  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Lumin's relevant market is not limited to a short list of similarly branded fintechs. The buyer is a bank
              or credit union selecting the engagement layer above its core system, so alternatives include a modern
              specialist platform, an incumbent banking-software suite, a point solution assembled across vendors, an
              internal build, or simply extending the existing digital channel. RFP.wiki describes digital banking
              platforms as the layer that shapes the day-to-day digital experience above core banking systems, while
              warning that core integration and migration can turn an advertised six-to-twelve-month implementation into
              an 18-to-24-month program. That makes integration proof, deployment references, and operating risk as
              important as feature breadth. Lumin's own positioning emphasizes cloud-native architecture and
              extensibility, while the independent selection guidance says buyers should test packaged best practices
              against institution-specific configuration needs. In practice, this creates a segmented contest: Lumin is
              strongest where a community institution wants a unified retail and commercial experience without building
              a platform, while incumbent suites retain an advantage where existing contracts, core connectors, or
              procurement familiarity dominate.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP009
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, distribution, and switching comparison
        blocks:
          - type: paragraph
            body: >-
              The competitive decision turns on more than a feature checklist. Lumin's product surface spans retail and
              commercial banking, onboarding, engagement, risk, analytics, and API or SDK extensibility, but public
              evidence does not establish that every workflow has parity with an incumbent or that every integration is
              included in the base commercial package. G2 customer reviews provide useful implementation and usability
              signals: reviewers describe a smooth implementation, strong support, and an active feedback loop, but also
              mention waiting for configuration depth, enhancement costs, expensive integrations, missing core parity,
              and analytics that may be an add-on. Those observations point to a differentiated service model rather
              than a proven universal product moat. Lumin's client-community model can improve trust and references, and
              client participation in the 2026 financing is a distribution signal, but it may also increase
              concentration in the same buyer ecosystem. nCino's public scale illustrates the incumbent-like benchmark
              Lumin faces: nCino reported 2,700-plus customers worldwide and fiscal-2025 subscription revenue of $469.2
              million. That is not a like-for-like Lumin metric, but it demonstrates the scale and cross-sell resources
              available to a public competitor.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP011
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP009
              - CP014
              - CP015
              - CP016
      - number: '3.3'
        title: Pricing opacity and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing does not support a clean price-led comparison. RFP.wiki describes Lumin as quote-based,
              with no public list prices, implementation fees, migration fees, support-tier premiums, or module add-on
              amounts. It also identifies core integration, data migration, training, and partner components as material
              total-cost drivers. G2 reviewers independently echo the commercial friction in qualitative terms,
              including enhancement costs, integration pricing that can be expensive for credit-union budgets, and some
              pricing that seems high. This is a buyer diligence issue rather than evidence that Lumin is uncompetitive
              on realized price. Lumin's product velocity and AI roadmap may help defend relevance: the company
              announced AI-enabled targeting, secure-form, and FAQ tools in December 2025, and its founder said the
              platform releases more than 200 enhancements per year. However, an independent Renascence article
              identifies a structural displacement risk: if many credit unions use the same platform, the digital
              touchpoint can become a commodity and dilute the local differentiation institutions seek. The durable moat
              therefore depends on implementation outcomes, workflow depth, data and integration assets, and
              retention—not merely on a cloud label or a growing feature list.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer-led service can reinforce distribution
            body: >-
              G2 reviewers repeatedly describe Lumin as collaborative and easy to work with, while the 2026 financing
              included additional client investors. That combination can strengthen references and ecosystem
              distribution, although the assigned evidence does not quantify retention by cohort.
            calloutType: strength
            claimRefs:
              - CP005
              - CP008
          - type: callout
            title: Feature velocity does not equal durable differentiation
            body: >-
              Lumin's announced AI tools and high enhancement cadence support continued product relevance, but reviewers
              also report configuration gaps, add-on analytics, and pricing concerns. An independent article warns that
              shared platforms can homogenize the digital experience, making implementation depth and customer outcomes
              the more durable moat tests.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Lumin sells a cloud-native digital banking platform to banks and credit unions rather than operating a
              consumer-facing bank. Public descriptions identify retail banking, commercial banking, digital account
              opening, and embedded platform scopes, while procurement analysis characterizes the commercial model as
              quote-based. This supports an institution-level software relationship with module, implementation, and
              integration choices, but it does not establish whether fees are primarily subscription, account-based,
              transaction-based, or services-based. Customer selections by Kirtland Credit Union and Eclipse Bank
