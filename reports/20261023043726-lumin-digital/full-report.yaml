          A defensible entry range could be established from verified recurring revenue and peer-supported multiples;
          target return depends on entry price and dilution
        - Lower probability until financials are verified
        - Execution, implementation, security, and competition
      - - Base
        - >-
          Platform remains a credible growth software vendor; customer-investor model persists; economics remain private
          and implementation costs are material
        - No defensible numeric fair-value range from current public evidence; retain research-more stance
        - Most supportable current case
        - Opaque denominator, concentration, pricing, preference terms, and conflicting third-party data
      - - Bear
        - Growth slows, churn rises, module expansion disappoints, or financing conditions force a down round
        - Current headline mark is impaired; common-equity return may be negative after dilution and preferences
        - Material downside cannot be probability-weighted precisely
        - Multiple compression, down round, liquidity, and execution failure
      - - Exit / hold trigger
        - >-
          No public evidence establishes an IPO, sale, or secondary timetable; operating proof and terms remain
          prerequisites
        - Hold or defer entry until a valuation bridge and exit/liquidity path are documented
        - Unresolved
        - Liquidity and governance
    notes: >-
      Scenario ranges are deliberately not fabricated: the assigned evidence does not provide a Lumin revenue, ARR,
      cash-flow, or capitalization denominator from which a numeric range could be responsibly calculated.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
