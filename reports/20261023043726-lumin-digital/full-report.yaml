  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Lumin is described as an engagement layer connecting institution systems to configurable digital workflows and
      customer-facing channels.
    data:
      layers:
        - label: Institution systems
          detail: Existing core and connected services remain dependencies for the customer-facing layer.
          items:
            - Core accounts and services
            - Risk and decision inputs
        - label: Lumin platform
          detail: Banking, onboarding, engagement, analytics, and risk capabilities are described as the hosted product layer.
          items:
            - Retail and commercial banking
            - Account opening and engagement
        - label: Experience and extensibility
          detail: >-
            Customer-facing channels and integration tooling expose the configured experience to members and institution
            teams.
          items:
            - Web and mobile channels
            - SDK, APIs, and partners
        - label: Integration and migration
          detail: >-
            Core connectivity, configuration, data migration, and partner services determine implementation effort and
            time to value.
          items:
            - Core connectors and data mapping
            - Migration, testing, and rollout
        - label: Trust and access
          detail: Authentication, fraud controls, and institution risk management govern access to financial services.
          items:
            - Multifactor and phishing-resistant controls
            - Fraud and identity signals
        - label: Support and continuity
          detail: >-
            Release acceptance, incident response, service levels, and recovery processes remain buyer-side diligence
            requirements.
          items:
            - Release and support operations
            - Recovery and SLA evidence
    approximationNotes: >-
      Layer order expresses the described operating relationship, not measured dependency direction or technical
      completeness. It omits undisclosed services and does not imply that every listed module is included in every
      contract.
    claimRefs:
      - CE005
      - CE006
      - CE007
