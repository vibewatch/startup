        title: Public traction and financing capacity
        blocks:
          - type: paragraph
            body: >-
              FinTech Futures reported that Lumin serves around 90 financial institutions, while July 2026 coverage
              reported more than $115 million of new financing, including more than $70 million from client investors
              and $45 million of growth equity led by Light Street Capital. The proceeds were described as supporting
              AI, payments, CRM, lending, and other platform expansion. Fifteen additional clients participated, which
              is a useful alignment and customer-conviction signal. It is not equivalent to recurring revenue,
              retention, cash available, or operating profitability. The customer-investor structure also warrants
