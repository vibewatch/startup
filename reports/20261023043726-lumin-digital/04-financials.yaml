    claimRefs: [CI001, CI004, CI005, CI013]
  - id: TI002
    title: Pricing and monetization table
    columns: [Pricing input, Public evidence, List versus realized, Confidence, Why it matters, Diligence ask]
    rows:
      - [Platform price, "Custom enterprise quote", "No public list or realized amount", medium, "Sets recurring-revenue denominator", "Provide standard rate card and realized cohort pricing"]
      - [Edition or module price, "Retail, commercial, account-opening, and embedded scopes described", "Add-on premiums unavailable", medium, "Tests expansion revenue", "Provide attach, discount, and renewal waterfall"]
      - [Implementation price, "Implementation and migration identified as TCO drivers", "Fee schedule unavailable", medium, "Separates recurring software from services", "Provide statements of work and revenue treatment"]
      - [Integration and partner cost, "Core integration and partner components identified as cost drivers", "Pass-through and margin treatment unavailable", low, "Can compress contribution margin", "Provide third-party fees and gross-margin bridge"]
      - [Contract duration and escalators, "Not publicly disclosed", "Realized terms unavailable", low, "Determines durability and price realization", "Provide term, renewal, escalator, and termination clauses"]
    notes: "RFP Wiki supplies directional procurement analysis but no Lumin contract dollars; buyer ROI, funding, and valuation are not pricing evidence."
    claimRefs: [CI004, CI005, CI012]
  - id: TI003
    title: Unit economics and capital adequacy table
    columns: [Metric, Public value, Confidence, Interpretation, Diligence ask]
    rows:
      - [Customer ROI, "145% over five years, as cited in coverage", medium, "Modeled client value; not Lumin revenue", "Review full study methodology and sample"]
      - [Financial-institution customers, "Around 90, reported July 2026", medium, "Traction signal without contract economics", "Reconcile contracted, live, and revenue-generating cohorts"]
      - [Recognized revenue or ARR, null, low, "No public denominator for valuation or growth", "Provide audited revenue and ARR bridge"]
      - [Gross margin, null, low, "Delivery scalability cannot be assessed", "Provide margin bridge by edition and services mix"]
      - [CAC and vendor payback, null, low, "Sales efficiency cannot be assessed", "Provide CAC, bookings, sales cycle, and payback by channel"]
      - ["Cash, burn, and runway", null, low, "Funding raised is not cash available", "Provide post-financing liquidity and cash-flow forecast"]
    notes: "Customer ROI and customer count retain their stated populations and periods. Null means the assigned evidence did not disclose a usable value."
    claimRefs: [CI009, CI010, CI013, CI014, CI015]
