company:
  name: Lumin Digital
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a quote-based enterprise platform model, current customer adoption, and more than $115 million of July 2026 financing. It does not disclose Lumin's recognized revenue, ARR, realized pricing, gross margin, cash, burn, or runway, so the financing signals capacity to invest rather than a complete basis for underwriting revenue quality or capital adequacy.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Lumin sells a cloud-native digital banking platform to banks and credit unions rather than operating a consumer-facing bank. Public descriptions identify retail banking, commercial banking, digital account opening, and embedded platform scopes, while procurement analysis characterizes the commercial model as quote-based. This supports an institution-level software relationship with module, implementation, and integration choices, but it does not establish whether fees are primarily subscription, account-based, transaction-based, or services-based. Customer selections by Kirtland Credit Union and Eclipse Bank validate demand for the platform, not contract value, recognized revenue, or recurring-revenue quality. The retained evidence therefore supports a directional revenue mechanism but no ARR estimate.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing, GTM motion, and sales-efficiency proxies
    body: >-
      The visible go-to-market motion is relationship-led enterprise selling into financial institutions. Kirtland described a long-term digital partner decision, and Eclipse selected Lumin as its primary provider across retail and commercial banking. RFP Wiki reports that pricing is custom-quoted and that total cost depends on licensed editions, core integration, migration, implementation services, and roadmap modules. Those observations indicate complex contracts and meaningful implementation work, but they do not reveal sales-cycle length, CAC, vendor CAC payback, discounting, renewal economics, or channel margins. A generic category warning that complex deployments can extend to 18-24 months is an adverse diligence prompt, not proof of Lumin's own implementation duration.
    claimRefs: [CI002, CI003, CI004, CI005, CI012]
    tableRefs: [TI002]
  - id: traction-and-capital
    title: Public traction and financing capacity
    body: >-
      FinTech Futures reported that Lumin serves around 90 financial institutions, while July 2026 coverage reported more than $115 million of new financing, including more than $70 million from client investors and $45 million of growth equity led by Light Street Capital. The proceeds were described as supporting AI, payments, CRM, lending, and other platform expansion. Fifteen additional clients participated, which is a useful alignment and customer-conviction signal. It is not equivalent to recurring revenue, retention, cash available, or operating profitability. The customer-investor structure also warrants concentration and governance diligence because commercial relationships and cap-table participation can overlap.
    claimRefs: [CI006, CI007, CI010, CI011, CI014, CI016]
  - id: economics-and-verdict
    title: Unit economics, capital adequacy, and verdict
    body: >-
      Public coverage says Lumin exceeded financial goals while improving margins and operational efficiency, but it supplies no revenue denominator, margin definition, cash balance, burn rate, runway, debt schedule, or free-cash-flow bridge. A cited 145% five-year return on investment measures modeled value for client institutions; it is neither Lumin revenue nor vendor CAC payback. The strongest financial conclusion is therefore mixed: current adoption and fresh capital support continued investment, yet revenue quality, delivery cost, contribution margin, liquidity, and financing dependence remain unquantified. Underwriting should remain conditional on management financials, contract cohorts, implementation economics, and a post-financing liquidity bridge rather than treating funding raised as cash available.
    claimRefs: [CI008, CI009, CI013, CI014, CI015]
    tableRefs: [TI003]
callouts:
  - calloutType: strength
    title: Customer capital reinforces alignment
    body: More than $70 million of the July 2026 financing came from client investors, and 15 additional clients participated, providing a tangible customer-conviction signal without proving retention or profitability.
    claimRefs: [CI006, CI011]
  - calloutType: risk
    title: Core underwriting metrics remain private
    body: The retained public evidence does not disclose recognized revenue, ARR, realized contract pricing, gross margin, cash, burn, runway, debt obligations, or free cash flow.
    claimRefs: [CI013, CI015]
