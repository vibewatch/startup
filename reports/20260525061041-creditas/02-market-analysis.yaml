callouts:
  - calloutType: insight
    title: Rate-arbitrage is the core adoption hook
    body: >-
      Creditas is not trying to create a brand-new borrowing need. Its strongest product logic is refinancing: replace
      personal-loan or revolving-card pricing with a house-, car-, or payroll-backed structure that lowers monthly cost.
    claimRefs:
      - CM004
      - CM005
      - CM038
      - CM039

  - calloutType: strength
    title: Crédito do Trabalhador is the biggest incremental TAM unlock
    body: >-
      The combination of CTPS Digital, eSocial deduction, and FGTS-linked guarantees makes private payroll credit more
      searchable, comparable, and portable than legacy employer-convênio lending, which should help digital lenders.
    claimRefs:
      - CM019
      - CM024
      - CM026
      - CM027
      - CM034

  - calloutType: risk
    title: The market is large, but the clean denominator is still missing
    body: >-
      Home-equity, vehicle-equity, and payroll evidence are all public, yet they are reported in different units and with
      different boundaries. That makes TAM usable for direction, not for a precise market-share claim.
    claimRefs:
      - CM040
      - CM041
      - CM043

