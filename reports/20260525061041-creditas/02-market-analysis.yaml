  - id: buyer-segmentation
    title: Buyer segmentation, payer economics, adoption triggers
    body: >-
      The market is segmented less by abstract income bracket than by collateral type and repayment rail. In home equity,
      the buyer, user, and payer are usually the same household finance decision-maker; the trigger is rate-arbitrage
      against expensive unsecured debt or access to larger-ticket capital for renovation, business investment, or other
      life events. Vehicle equity serves a similar borrower logic but with smaller ticket sizes and a stronger overlap with
      self-employed drivers and microentrepreneurs who need liquidity without selling the car. In both products, the budget
      owner is effectively the household or owner-operator balance sheet.

      Payroll credit introduces a more complex buyer-user-payer triangle. The worker chooses the loan, salary cash flow pays
      it back, but the employer and eSocial rails operationalize deduction, and HR can become a distribution gate when
      payroll credit is packaged alongside salary advance or benefits. CAIXA and government material show a digitally enabled
      adoption path: discover the product in CTPS Digital or the bank app, authorize data sharing, receive offers within 24
      hours, clear Dataprev/eSocial checks, and then move into a salary-deducted repayment path with optional portability.
      Creditas’ own app and benefits surfaces reinforce that this is a multi-product borrower journey rather than a single
      isolated loan transaction.
    claimRefs:
