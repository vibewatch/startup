  evidenceGaps:
    - type: missing-source
      severity: material
      topic: home-equity-stock
      missingEvidence: "An official or regulator-grade breakout of outstanding Brazilian home-equity / refinance balances separate from traditional purchase mortgages."
      whyItMatters: "Current public evidence is strongest on origination flow and projections, not on the outstanding stock that would anchor a cleaner TAM denominator."
      diligencePath: "Pull BCB SCR / IF.Data or lender-level disclosures that isolate home-equity or cash-out real-estate collateral balances."
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM002]

    - type: missing-source
      severity: material
      topic: vehicle-equity-stock
      missingEvidence: "A public split between generic auto loans and true vehicle-equity refinance balances in Brazil."
      whyItMatters: "Without that breakout, vehicle TAM is bounded only by a broad auto-loan proxy and may overstate what is truly serviceable for Creditas' use case."
      diligencePath: "Use SCR or lender disclosures to separate purchase finance from refinance or collateralized vehicle-equity products."
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM002]

    - type: private-evidence-only
      severity: material
      topic: conversion-and-unit-economics
      missingEvidence: "Creditas' approval rates, take rates, CAC, delinquency, and loss performance by modality."
      whyItMatters: "Those metrics determine how much of the public market range is actually reachable and profitable, especially under high Selic conditions."
      diligencePath: "Request modality-level funnel, unit-economics, and credit-performance cohorts in a management or data-room session."
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM003, TM004]

    - type: conflicting-data
      severity: minor
      topic: lens-comparability
      missingEvidence: "One normalized dataset that aligns stock, origination, contracted volume, and pricing by collateral type."
      whyItMatters: "Today the market can be bounded directionally, but the public data does not support a single precise market-share number."
      diligencePath: "Normalize regulator, association, and company lenses into a common unit before using market size in valuation output."
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM002]