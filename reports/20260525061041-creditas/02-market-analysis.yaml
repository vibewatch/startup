chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Creditas operates in a narrow but expanding slice of Brazilian household credit: secured lending against real estate,
    vehicles, payroll, and FGTS-linked worker guarantees rather than the full Sistema Financeiro Nacional credit book.
    Public evidence points to a multi-lens opportunity built from R$30.5B of 2025 free-funding real-estate originations,
    more than R$40.4B of pre-rollout private payroll resources, and a broader Brazilian auto-loan market that Mordor sizes
    at US$24.02B in 2025, while Creditas' observed footprint remains R$7.6B of portfolio and roughly R$4.4B of annualized
    origination. Growth drivers are Crédito do Trabalhador, eSocial rails, and rate-arbitrage versus unsecured credit;
    key constraints are high Selic, low home-equity penetration, formal-employment gating, and imperfect public data on
    subsegment stocks.

sections:
  - id: market-boundary
    title: Market boundary and structure of Brazilian secured lending
    body: >-
      The relevant market for Creditas is not “all Brazilian credit” and not even all household credit; it is the subset
      of household borrowing inside the Sistema Financeiro Nacional where collateral, payroll deduction, or FGTS-linked
      guarantees materially change underwriting and price. In practical terms, this chapter includes home-equity lending,
      vehicle-equity lending, private payroll consignado for CLT workers, and the newer worker-credit rail that uses
      eSocial and FGTS-linked guarantees. It also treats multibank home and vehicle financing as adjacent acquisition paths,
      because Creditas uses them to reach the same borrower intent even when the balance-sheet product differs.

      The chapter excludes corporate credit, agricultural credit, unsecured personal lending, and revolving card balances.
      Those categories matter as substitutes or benchmarks, but they are not the same underwriting market that Creditas is
      building around house, car, or salary collateral. The company’s own product surfaces make that boundary explicit: the
      marketed products are secured or payroll-linked, the homepage contrasts them against expensive unsecured credit, and
      transparency material places Creditas inside an SCD/correspondent model rather than a universal-bank consumer stack.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM007
      - CM008
      - CM009
      - CM038
      - CM039
      - CM044
    tableRefs:
      - TM001
    figureRefs:
      - FM001

  - id: sizing-lenses
    title: "Sizing: TAM, SAM, SOM through multiple evidence lenses"
    body: >-
      Public market sizing for Brazilian secured lending is inherently lens-dependent. Banco Central data gives the broad
      macro backdrop — SFN credit still expanded 11.5% in 2024, the 2025 forecast was first revised down to 7.7% in March
      and later revised up to 8.8% in September, and 2026 was projected at 8.0% — but that macro lens is too broad for a
      direct Creditas TAM. More useful submarket lenses come from ABECIP’s free-funding real-estate data, government and
      CAIXA evidence on the private payroll/Crédito do Trabalhador corridor, and an auto-finance demand proxy from Mordor.
      Each of these captures a different part of the addressable secured-borrower universe.

      The result is a layered sizing view rather than a single “Brazilian secured lending market is X” claim. A conservative
      near-term SAM can be framed around roughly R$70B–95B of equivalent annual opportunity by combining home-credit and
      payroll lenses with overlap haircuts and without assuming Creditas can capture generic auto lending. An upside TAM lens
      of roughly R$100B–140B emerges only if free-funding housing credit continues to expand and worker-credit rollout
      approaches the government’s four-year scenario. Creditas’ current SOM is much narrower and is best anchored in observed
      scale: R$7.6B portfolio and R$1.1B of quarterly origination in Q1-26.
    claimRefs:
      - CM011
      - CM012
      - CM014
      - CM015
