    {
      "id": "section-4",
      "title": "Exit pathways, diligence blockers, and what would change the view",
      "body": "Exit analysis for Creditas remains suggestive rather than confirmed. The company is large enough in revenue terms to fit the profile of a future IPO candidate or strategic M&A target, and the Andbank transaction proves there is at least some strategic buyer interest around the funding stack and banking-licence optionality. Yet no official IPO timeline is visible, no public banker mandate has been identified, and there is no public secondary-market evidence showing where non-strategic investors would currently clear size. That makes the exit menu real but poorly evidenced. Investors should assume that exit timing will be driven by operating profitability, macro conditions in Brazil, and the success of the bank-integration funding strategy, not simply by the company’s scale.\n\nThe most material blockers are all private-data requests. First, the public record still does not show NPL by product, delinquency buckets, or vintage-loss curves. Without that disclosure, investors cannot determine whether 40% gross-profit margin is durable or merely the visible side of a latent credit-cost problem. Second, public materials are insufficient to reconstruct a fully audited multi-year P&L and cash runway. Third, the preference stack above common equity remains opaque, which means even a sensible enterprise-value range cannot be translated cleanly into common-equity return. These gaps are not cosmetic; they directly affect entry-price discipline and downside protection.\n\nThe practical implication is that the chapter’s recommendation should change only on hard evidence. A better-than-expected Q2-26 operating result, credible proof of deposit ramp from the Andbank licence, and first-pass NPL disclosure that does not show a hidden deterioration would justify moving from watchlist posture toward investable conviction. Conversely, a renewed operating-loss spike, two quarters of sub-35% gross-profit margin, or adverse first-look credit metrics would justify stepping away unless pricing resets materially below the Series G mark.",
