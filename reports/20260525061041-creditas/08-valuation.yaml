  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Creditas remains a large, growing Brazilian secured-credit platform, but the December 2025 Series G mark of US$3.3 billion still prices in a relatively clean path to operating break-even, stable credit quality, and successful monetization of the newly acquired banking licence. The operating trajectory improved sharply into Q1-26, with 40.0% gross-profit margin and operating loss narrowing to R$34.9 million, yet the company still does not publicly disclose NPL, cash, or full preference-stack detail. The result is a price-sensitive recommendation: Track / Conditional Watch, with preferred entry closer to US$2.5-3.0 billion unless break-even and credit quality are demonstrated over the next two quarters."
  },
  "sections": [
    {
      "id": "section-1",
      "title": "Round context, reset valuation, and strategic floor support",
      "body": "The starting point for Creditas valuation is the clear reset from the January 2022 Series F peak to the December 2025 Series G. Series F raised US$260 million at a US$4.8 billion valuation with Fidelity and SoftBank in the syndicate, a mark struck in a much easier global capital environment when Brazil’s SELIC rate was materially lower and growth equity still rewarded revenue expansion over profitability. By contrast, Series G raised US$108 million at a US$3.3 billion post-money valuation, a 31.25% markdown from the 2022 peak. That makes the latest round unambiguously a down-round, but not a distressed one. The price was set at the same moment Creditas closed the acquisition of Bank Andbank Brasil, converting a multi-year strategic initiative into an operating banking licence and bringing Andbank in as both investor and acquired institution.\n\nThat strategic configuration matters. The Series G lead is not a passive late-stage crossover fund but a commercially informed counterparty that diligenced both Creditas’s lending platform and the banking asset being folded into the group. VEF’s disclosures reinforce that the round was not purely cosmetic. VEF’s prior carrying mark on Creditas was roughly US$2.79 billion, and conversion of its convertible notes at the US$3.3 billion Series G price generated an 8.2% NAV uplift for VEF and an implied 17.8% step-up versus its prior mark. Put differently, the new round sits below the 2022 peak but above at least one informed institutional holder’s internal valuation.\n\nEven so, the new price is not automatically attractive. Creditas has raised roughly US$987 million across seven rounds, so the company already carries a substantial preferred-capital stack above common equity. Public evidence does not disclose participation rights, seniority details, or liquidation preferences across historical rounds. That means investors can observe the latest price but cannot fully underwrite what that price means for common-equity return in middling exits. The current valuation therefore deserves to be treated as a credible strategic mark with some floor support, not as proof that the risk-adjusted entry is compelling on its own.",
