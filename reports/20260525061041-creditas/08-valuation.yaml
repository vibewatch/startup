    {
      "id": "section-3",
      "title": "Scenario analysis and recommendation discipline",
      "body": "The valuation debate is best framed through three scenarios rather than a single point estimate. In the bull case, Creditas reaches operating break-even by Q3-26, the Andbank banking licence translates into meaningful deposit or CDB funding by late 2026, and SELIC begins easing below 13% in the second half of the year. Under that mix, gross-profit margins can remain near 40%, revenue growth stays above the broader Brazilian credit system, and a US$5.5-7.0 billion exit in 2027-28 becomes conceivable. At a US$3.3 billion entry that produces solid upside, but still depends on several things public evidence does not yet confirm: NPL stability, deposit-ramp timing, and durable break-even.\n\nThe base case is more conservative and more plausible. Losses narrow but do not disappear in 2026, deposit benefits arrive only gradually, and public-market or private-market buyers value Creditas as a scaled but still not fully de-risked lender. That points to a US$3.5-4.5 billion exit range over a five-year horizon, which is only modestly attractive from the current mark. The bear case is not hard to imagine either. If SELIC stays near current levels into 2027, if the first meaningful NPL disclosure disappoints, or if customer-service issues worsen, valuation could reset toward US$2.0-2.5 billion or lower in a restructuring or pressured financing scenario.\n\nThose branches lead to a recommendation of Track / Conditional Watch rather than buy. The business has enough scale, strategic funding optionality, and recent operating improvement to justify continued diligence. But the correct discipline is price-sensitive: a preferred entry range of roughly US$2.5-3.0 billion better compensates for NPL opacity, preference-stack uncertainty, and macro headwinds. Paying the full US$3.3 billion Series G mark is only supportable if Q2-26 confirms continued operating-loss improvement and if management discloses enough credit-quality data to show that the recent margin recovery is not masking future provisioning pain.",
