company:
  name: Creditas

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Creditas is a São Paulo-based fintech founded in 2012 by Spanish-born Sergio Furio as BankFacil, rebranded after
    transitioning from a comparator to a direct collateralized lender. It is the leading platform for collateralized
    lending, insurance, and investment solutions in Latin America, with US$987M raised across seven equity rounds,
    a peak valuation of US$4.8B in January 2022, and a December 2025 Series G at US$3.3B — an explicit
    down-round — led by Andbank Group in conjunction with the acquisition of Andbank Brasil's bank licence.
    As of Q1-26, the company operates a R$7.6B loan portfolio, generates annualized revenues of R$2.5B, has
    narrowed its operating loss to R$34.9M, and is targeting operational break-even in the near term; exact
    headcount and customer count are not publicly disclosed.

sections:
  - id: identity-and-business-model
    title: Identity, founding story, and business model
    body: >-
      Creditas is a privately held Brazilian fintech headquartered in São Paulo, Brazil. The company's legal entity
      is Creditas Financial Solutions, Ltd., and it operates as a Sociedade de Crédito Direto (SCD) authorised by
      the Banco Central do Brasil since 2019. Following the December 2025 acquisition of Andbank Brasil's full
      banking licence, Creditas also holds a Brazilian banco múltiplo licence, materially broadening its regulatory
      perimeter and reducing funding costs.

      The company was founded in 2012 by Sergio Furio under the original name BankFacil. Furio, a Spanish national
      with twelve-plus years in financial markets, was introduced to the opportunity by his then-girlfriend (now wife)
      Silvia Furio, who drew his attention to the extreme interest-rate spreads charged by Brazilian banks. BankFacil
      launched as a financial-product comparator and lead-generation blog before evolving into a direct lender.
      The first eight months were unprofitable; Furio sold his New York apartment to extend the runway. A 2013
      merger with GranaAqui, which already operated in collateralized credit, accelerated the move into direct
      lending. By 2016 BankFacil had completed end-to-end credit operations using its own balance sheet and
      subsequently rebranded to Creditas to reflect the pivot to a full collateralized-credit platform.

      Creditas describes itself as "the leading platform for collateralized lending, insurance, and investment
      solutions in Latin America." The core business model is anchored in secured consumer credit: borrowers
      pledge real estate (home equity), automobiles (auto equity), or their payroll (consignado privado) as
      collateral, enabling Creditas to underwrite at lower rates than unsecured consumer lenders while capturing
      the margin spread between capital-markets funding and borrower yields. Collateral reduces default risk,
      lengthens loan tenure (up to 240 months for home equity), and creates deeper, stickier customer
      relationships. The company has described its strategy as "cross-sell" — using the primary credit relationship
      as an anchor to distribute insurance, financial benefits for employers, salary-advance products, and
      eventually investment services via the private-banking joint venture with Andbank Wealth. As of Q1-26
      Creditas reports having lent more than R$12.1B cumulatively and saved customers more than R$6.2B relative
      to prevailing market rates.
