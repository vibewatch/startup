      severity: material
      topic: customer-count
      missingEvidence: "Total active borrower count, unique customer count, and retention/churn rate by product."
      whyItMatters: "Customer count is fundamental to cohort unit-economics analysis, CAC recovery benchmarking, and competitive positioning."
      diligencePath: "Request from management; inspect BCB Cadastro de Clientes filings if available."
