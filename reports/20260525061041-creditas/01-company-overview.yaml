  - id: leadership-and-governance
    title: Leadership, founder profile, and key-person risk
    body: >-
      Sergio Furio is the sole publicly disclosed founder and serves as CEO. His background spans private equity,
      investment banking, and financial-services entrepreneurship across Spain, the United States, and Brazil.
      Furio's deep product intuition and capital-markets relationships are central to Creditas' story; no
      co-founder or secondary executive has been positioned as an alternative to Furio in public materials, making
      him a classic key-person risk for investors.

      In December 2025 Creditas made a significant leadership addition by appointing Ricardo Forcano as Chief
      Technology and Operations Officer (CTO/COO), overseeing Technology, Operations, and People. Forcano brings
      more than two decades of experience, most prominently as CIO and CHRO at Spain's BBVA — one of Europe's
      largest banks — where he led the technology modernisation, cultural transformation, and Latin American
      expansion. Furio framed Forcano's hire as a mission to make Creditas "AI-native," and Forcano has publicly
      stated that AI agents are being deployed for end-to-end collections and origination automation.

      Shirlei Silva serves as Director of Investor Relations, a role that appears in public press releases and IR
      communications. Beyond Furio, Forcano, and Silva, the composition of the full leadership team, the board of
      directors, investor observer rights, and formal governance structures are not documented in publicly
      available materials — a diligence gap.
    claimRefs:
