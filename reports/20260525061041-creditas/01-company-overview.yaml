callouts:
  - calloutType: strength
    title: "Collateralized model + bank licence: structural cost advantage"
    body: >-
      Creditas' secured lending model structurally limits credit losses relative to unsecured peers, enabling
      competitive pricing that drives customer acquisition. The December 2025 acquisition of the Andbank Brasil
      bank licence extends this advantage by unlocking deposit-side funding and reducing securitisation-spread
      dependency — a meaningful structural improvement to unit economics at scale.
    claimRefs:
      - CO003
      - CO029
      - CO030

  - calloutType: risk
    title: "Down-round valuation and persistent operating losses"
    body: >-
      The Series G at US$3.3B is a 31% haircut from the US$4.8B Series F peak, reflecting both macro multiple
      compression and the company's delayed path to profitability. The operating loss of R$34.9M in Q1-26, while
      sharply improved, means Creditas remains loss-making. Break-even timing is not publicly committed, and
      the high-SELIC environment in Brazil continues to pressure gross profit margins below the cohort-level
      40–45% target at the reported level.
    claimRefs:
      - CO025
      - CO026
      - CO035
      - CO036

  - calloutType: insight
    title: "Reclame Aqui 'Regular' rating warrants customer-experience diligence"
    body: >-
      Creditas carries 1,949 active complaints on Reclame Aqui (Nov 2025–Apr 2026), a 'Regular' reputation
      score of 6.4/10, and only 46.5% of consumers saying they would re-engage the company. In a collateralized-
      lending model where multi-year relationships are the core value driver, elevated complaint rates and low
      re-engagement scores are strategic risks that later chapters should probe.
    claimRefs:
      - CO043
      - CO044

