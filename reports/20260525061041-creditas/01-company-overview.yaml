  - id: funding-history-and-valuation
    title: Funding history, valuation, and investor base
    body: >-
      Creditas' capital formation culminated in seven equity rounds totalling US$987M through December 2025,
      as highlighted on its official Investor Relations page. An additional US$28.3M conventional-debt facility
      was provided by the Inter-American Development Bank in February 2021, bringing total external capital to
      just over US$1B.

      The first five rounds (Series A through D approximately, with Series E at US$255M in December 2020 valuing
      the company at around US$1.75B) established Creditas as a major Brazilian fintech. The Series F in January
      2022 — US$260M led by Fidelity Management and Research at a US$4.8B valuation, with participation from
      QED Investors, VEF, SoftBank Vision Fund 1, SoftBank Latin America Fund, Kaszek Ventures, Lightrock,
      Headline, Wellington Management, and Advent International — was a landmark. Creditas characterised it as
      a pre-IPO round, with investors reportedly expecting a US$10B public-market valuation. A US$50M Series F
      extension in July 2022, led by Andbank, was announced alongside the initial agreement to acquire Andbank
      Brasil's bank licence.

      The Series G in December 2025, at US$108M and a US$3.3B valuation, represents a significant down-round
      from the US$4.8B Series F peak — a 31% decline. The round was led by Andbank Group (a European institution
      with over US$60B in AuM per Creditas' official release, though Valor Econômico cited US$30B) and was
      structured to coincide with the final closing of the Andbank Brasil acquisition. VEF, Creditas' largest
      reporting investor, converted its outstanding convertible notes into equity at the US$3.3B valuation and
      described the transaction as having an 8.2% positive effect on its NAV (implying VEF's pre-G carry was
      below US$3.3B). Furio publicly acknowledged the down-round, stating that "the valuation reflects today's
      multiples and the good growth of the company."
