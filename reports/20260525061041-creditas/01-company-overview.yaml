  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: "Total employee count as of a specific recent date; breakdown by business unit or geography."
      whyItMatters: "Headcount is a key efficiency and burn metric; without it, operating leverage analysis in later chapters relies on revenue-per-employee estimates only."
      diligencePath: "Request from management or monitor LinkedIn active employee count; check BCB regulatory submissions."
      relatedQuestionRefs: [QO005]

