  - id: milestones-adverse-signals
    title: Milestone chronology and adverse signals
    body: >-
      The table in this section provides a dated milestone chronology as the single record for later chapters.
      Notable adverse signals include: (1) the 2025 Series G is an explicit down-round — US$3.3B versus the
      US$4.8B Series F peak, a 31% haircut — attributed to broader LatAm fintech multiple compression after
      the 2022 rate-rise cycle; (2) Creditas carries persistent operating losses (R$34.9M in Q1-26) and has
      not disclosed a break-even date; (3) the Reclame Aqui consumer-complaint platform rates Creditas as
      "Regular" with a 6.4/10 average score, 1,949 complaints in the last six months, and 70.1% resolution
      rate, indicating meaningful consumer friction, with top categories including indevida billing, misleading
      advertising, and difficulty completing transactions.

      The milestone table contains 10 dated entries covering founding, financing, product pivots, regulatory
      approvals, partnerships, scale milestones, and adverse events. The Series G down-round and ongoing
      operating losses are logged as adverse-type milestones.
