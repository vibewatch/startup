  - id: section-2
    title: 'Gross profit dynamics: cohort profitability above 40% versus reported margin compressed by SELIC and IFRS'
    body: >-
      There is a persistent and important gap between cohort-level profitability and reported gross profit margin.
      Creditas consistently states that profitability at the cohort level remains above its 40% gross-profit target.
      The argument is that IFRS front-loads provisioning when origination accelerates — because expected credit losses
      are recognized at origination — and that high SELIC raises funding costs on securitizations. Both effects
      depress reported gross margin during a growth phase even when underlying cohort economics are sound.


      Reported gross profit margins confirm this squeeze: Q3-25 GP margin was 37.1% (recovering from Q2-25's 32.6%),
      Q4-25 came in at 36.2%, and Q1-26 reached 40.0% — the first quarter meeting the stated target. Creditas
      management frames the Q1-26 result as evidence that margins are now "stabilizing and converging toward our
      target cohort-level profitability of 40-45%". In absolute terms, quarterly gross profit grew from R$211.2mn in
      Q4-25 to R$253.5mn in Q1-26 (+20.0% QoQ, +24.1% YoY), the highest on record. Annualized gross profit as of
      Q1-26 was R$1,012mn per the IR homepage.


      Costs below gross profit (selling, general and administrative expenses plus customer acquisition costs)
      have held near R$288-292mn per quarter across Q3-25, Q4-25, and Q1-26, with Q1-26 showing a -1.3% QoQ
      improvement to R$288.4mn. CAC specifically fell -6.1% QoQ in Q4-25 while origination grew +10.7% QoQ, a
      signal of improving operating leverage. The resulting operating loss narrowed from R$87mn in Q2-25 to R$68.2mn
      in Q3-25, R$80.9mn in Q4-25 (the step-up partly reflects consolidation of Andbank's corporate structure), and
      R$34.9mn in Q1-26 — approximately one-tenth of the Q1-22 operating loss despite meaningfully higher origination
      volumes. Management's near-term guidance targets operating break-even by year-end 2026.


      The tension between cohort claims and reported results is the central financial underwriting question. The
      company does not publish vintage-level NPL curves, realized recovery rates on non-accruing pools, or loan-level
      loss data that would allow an independent investor to verify cohort economics. Until that disclosure is made,
      the cohort profitability claim can be neither confirmed nor refuted from public sources.
    claimRefs:
