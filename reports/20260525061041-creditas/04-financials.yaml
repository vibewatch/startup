    figureRefs:
      - FI004
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - revenue stream
      - mechanism
      - unit/pricing
      - current status (Q1-26)
      - revenue quality
      - diligence ask
    rows:
      - - Home Equity lending (empréstimo com garantia de imóvel)
        - Interest income on mortgage-backed secured loans; collateral is residential/commercial property
        - Variable rate indexed to IPCA or CDI; typical APR significantly below unsecured rates
        - Part of R$7.6bn total portfolio; contributes to R$633mn quarterly revenue; all-time-high volumes in Q1-26
        - High — lowest default risk in portfolio; long duration; IPCA indexation provides revenue hedge vs inflation
        - Disclose product-level NPL, average LTV, and origination concentration by property type
      - - Auto Equity lending (empréstimo com garantia de veículo)
        - Interest income on vehicle-backed secured loans; collateral is car or motorcycle
        - Variable rate; more sensitive to SELIC via CDI-indexed securitization funding
        - Scaling rapidly; all-time-high origination volumes in Q1-26; new credit scoring model validated in Q1-26
        - Medium-high — lower duration than HE; collateral depreciates; credit model improvements cited by management
        - Disclose auto NPL trend, loss severity, and collateral coverage ratios
      - - e-Consignado (private payroll-deductible lending)
        - Interest income on payroll-linked loans where employer deducts installments from salary
        - Fixed rate; lower credit risk because deduction is at source
        - Growing cautiously; cited as a vertical where Creditas is normalizing unit economics; regaining pace in Q1-26
        - Medium — regulatory risk from Brazilian payroll lending rules; concentration if employer base is narrow
        - Disclose employer concentration, default rate, and regulatory exposure to private consignado rule changes
      - - Auto insurance (Creditas Seguros)
        - Premium income on vehicle insurance policies; likely underwritten with reinsurance partner
        - Monthly/annual premium; pricing based on vehicle profile, driver, region
        - Listed as active product; Andbank acquisition adds complementary investment products
        - Low-medium standalone; strategic value as cross-sell channel and retention tool within ecosystem
        - Disclose written premium, loss ratio, and combined ratio
      - - Employee benefits and payroll advance (Creditas Benefícios)
        - Fee/subscription income from employers; salary advance income on payroll advances
        - SaaS-like per-employee or per-employer fee; advance income on salary pre-payment
        - Active; marketed to corporates via B2B channel; synergistic with e-Consignado
        - Medium — recurring B2B revenue; but size and margins undisclosed
        - Disclose employer client count, ARR, and revenue mix vs. consumer lending
    notes: >-
      All revenue categories are company-disclosed product lines. Pricing structures derived from official product
      pages (creditas.com). Quarterly revenue and portfolio figures are from Q1-26 and Q4-25 results releases.
      Revenue split by product line is not publicly disclosed.
