callouts:
  - calloutType: insight
    title: Q1-26 marks the first quarter where reported GP margin meets the stated 40% cohort target
    body: >-
      After several quarters where IFRS front-loaded provisioning and high SELIC funding costs compressed reported
      margins below the cohort claim, Q1-26 delivered 40.0% gross profit margin and the highest absolute gross
      profit on record. Management now explicitly states margins are "stabilizing and converging toward 40-45%."
      This is the first externally verifiable data point partially consistent with the cohort-level claim.
    claimRefs:
      - CI006
      - CI019
      - CI009
  - calloutType: risk
    title: Group-level operating loss and opaque NPL data are unresolved underwriting blockers
    body: >-
      Despite cohort claims, the company still reports an operating loss at the group level, and delinquency
      data is not public. Customer complaint data at Reclame Aqui adds a softer adverse signal. The 31%
      down-round in Series G and ongoing losses make this a track-until-break-even story.
    claimRefs:
      - CI013
      - CI035
      - CI036
      - CI037
      - CI038
      - CI039
  - calloutType: recommendation
    title: Require NPL detail and audited financials before extending new capital
    body: >-
      Key financial inputs — NPL by vintage, NIM decomposition, cash balance, full audited income statement — are
      not in the public record. Revenue trajectory and GP recovery are encouraging, but a financial verdict
      cannot be investor-complete without this private data room.
    claimRefs:
      - CI038
      - CI039
      - CI040
