  - id: TI003
    title: Unit economics table
    columns:
      - metric
      - value / status
      - confidence
      - why it matters
      - diligence ask
    rows:
      - - Reported gross profit margin
        - 40.0% in Q1-26 (recovering from 32.6% in Q2-25 trough)
        - medium
        - Shows whether pricing + funding cost + provision load support sustainable economics
        - Request audited product-level gross margin breakdown and quarterly IFRS provision charge vs cash provision
      - - Cohort-level gross profit margin (company claim)
        - '>40% target, management says well above threshold'
        - low
        - Cohort economics determine whether vintage-level lending is profitable before corporate overhead
        - Require vintage-level loss curves and recovery rates to independently verify
      - - Annualized revenues per employee
        - R$1.4mn (Q1-26, up from R$1.1mn 6 months prior)
        - medium
        - Productivity KPI confirms operational leverage; context requires headcount to compute
        - Confirm headcount and exclude contractor mix
      - - Customer acquisition cost trend
        - "Declining: -6.1% QoQ in Q4-25 while origination +10.7% QoQ"
        - medium
        - Lower CAC at higher volumes = improving unit economics; key metric for scalability
        - Request CAC by product and channel with absolute R$ figure
      - - NPL / delinquency rates
        - Not publicly disclosed
        - null
        - Determines whether cohort profitability claims hold against actual credit losses
        - Obtain delinquency rate by bucket (>30d, >60d, >90d, >180d) by product and vintage
      - - Net interest margin (NIM)
        - Not explicitly disclosed; implied range ~10-15% based on revenue/portfolio ratio
        - low
        - NIM determines how much of revenue comes from spread vs. fees; sensitive to SELIC and funding cost
        - Request NIM bridge by product with funding cost, credit spread, and provision charge decomposition
      - - LTV ratios by product
        - Not publicly disclosed
        - null
        - LTV drives collateral coverage and determines loss-given-default in stressed scenarios
        - Obtain average and distribution of LTV at origination and current for HE and Auto pools
    notes: >-
      Revenue/portfolio ratio used to estimate NIM range is an approximation; not a disclosed metric. NPL and LTV
      metrics are absent from public results releases and IR disclosures. Annualized revenue per employee derived
      from Q1-26 company disclosure. CAC decline from Q4-25 results.
    claimRefs:
      - CI006
      - CI009
      - CI019
      - CI029
      - CI030
