  - id: section-3
    title: 'Funding mix and capital adequacy: equity + 70-plus capital markets issuances + banking license'
    body: "Creditas' capital structure combines equity, debt-capital-market funding and deposits within the acquired banking operation. It reports US$987mn raised through seven rounds through the December 2025 Series G, which valued the company at US$3.3bn. Its IR site lists 70-plus capital-markets issuances and separates bonds from securitizations. The audited filing identifies financial obligations to FIDC quota-holders as well as borrowings and deposits; these are distinct liabilities, not interchangeable sources of unrestricted corporate cash.\n\nThe full 2025 consolidated balance sheet is public. At December 31, 2025 it reports cash and cash equivalents of R$777.086mn, assets of R$9,234.457mn, liabilities of R$8,855.051mn and equity of R$379.406mn. Deposits totaled R$3,567.477mn and, according to note 15, came entirely from Andbank operations. A significant portion of the deposit base is pledged to structured lending; the acquired deposit stock is not proof that the same amount is new, freely deployable funding for Creditas originations. Notes 15 and 16 disclose deposit maturities and IPCA/CDI-indexed FIDC obligations. Realized savings versus securitization funding still require a matched cost-of-funds analysis rather than assuming all liabilities carry the same index or cost.\n\nA complete cash-flow statement is also available. Net cash used in operating activities was R$548.224mn in 2025, compared with R$130.013mn generated in 2024. The 2025 statement reports R$91.145mn of net investing inflow and R$682.127mn of net financing inflow, a R$225.048mn increase before foreign-exchange effects. These consolidated flows include lending, funding and acquisition-related movements; neither the annual operating cash outflow nor the accounting loss is a stand-alone monthly corporate burn rate. Management's cash-neutral guardrail therefore requires reconciliation to this statutory cash-flow basis rather than being treated as proof that portfolio growth consumes no external capital.\n\nThe management report additionally discloses a December 2025 Equity Ratio of 62.7% against management's target above 15%. Its numerator is adjusted equity and its denominator is assets at risk; this is not ordinary accounting equity divided by total assets, nor a standard regulatory capital ratio. KPMG expressly excludes the management report from its assurance conclusion. This disclosed corporate-debt framework does not establish a complete current securitization covenant schedule or stressed headroom. December 2025 group cash likewise does not establish Q1-26 available corporate cash, transferability between entities, monthly burn or 12-month runway."
