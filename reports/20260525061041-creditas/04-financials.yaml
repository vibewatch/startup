  - id: section-3
    title: 'Funding mix and capital adequacy: equity + 70-plus capital markets issuances + banking license'
    body: >-
      Creditas' capital structure has three distinct layers. The first is equity: US$987mn raised through seven
      financing rounds from 2013 through the December 2025 Series G, the last of which valued the company at
      US$3.3bn. The second is debt capital markets: 70-plus securitization issuances in the form of FIDCs
      (receivables investment funds), CRIs (real estate receivables certificates), and FIIs (real estate investment
      funds), plus bonds. Creditas' IR site lists bonds and securitizations as separate debt capital market
      categories and operates a public DCM investor-relations page with a subscription for updates. The third layer
      is institutional funding from Andbank: the banking license acquired in December 2025 allows Creditas to raise
      deposits and issue CDBs (bank certificates of deposit), which should lower the average cost of funding versus
      purely market-sourced securitizations.


      The SELIC sensitivity is structurally important. Securitization funding is priced off CDI (which tracks SELIC),
      so sustained high SELIC — Brazil's central bank raised the policy rate in its September 2025 and prior meetings
      and expects it to remain elevated — directly compresses net interest margin on existing pools and increases
      the cost of new issuances. The BCB's September 2025 Monetary Policy Report projected nominal system credit
      growth of 8.8% for 2025 and 8.0% for 2026, well below Creditas' 20-22%+ portfolio growth pace, reflecting a
      restrictive macro backdrop. Creditas states it has targeted cash-neutral operations since end-2023, meaning it
      is financing its loan book primarily through DCM issuances and internally generated cash rather than burning
      equity capital for operations.


      Public evidence does not disclose: current cash and liquid assets, monthly operating burn in cash terms,
      remaining runway, balance-sheet asset totals, details of individual securitization covenants, or Andbank
      deposit volumes post-acquisition. The audited 2025 consolidated financial statements were filed but the
      publicly accessible portion of the PDF is limited to a management business review section without a full
      balance-sheet or income statement visible in the cached content.
