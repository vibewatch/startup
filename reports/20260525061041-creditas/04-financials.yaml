  - id: section-2
    title: 'Gross profit dynamics: cohort profitability above 40% versus reported margin compressed by SELIC and IFRS'
    body: >-
      There is a persistent and important gap between cohort-level profitability and reported gross profit margin.
      Creditas consistently states that profitability at the cohort level remains above its 40% gross-profit target.
      The argument is that IFRS front-loads provisioning when origination accelerates — because expected credit losses
      are recognized at origination — and that high SELIC raises funding costs on securitizations. Both effects
      depress reported gross margin during a growth phase even when underlying cohort economics are sound.


      The original Q3-25 release reported a 37.1% gross-profit margin versus 32.6% in Q2-25. The Q4-25 release
      subsequently reconciled results from January 1, 2025 after changing IFRS interest-accrual and provisioning
      methodologies, and reported a 36.2% Q4-25 margin. Q1-26 reached 40.0%. These disclosure vintages are not a
      like-for-like four-quarter margin series, and they do not establish that Q1-26 was the first quarter to meet
      40%. Creditas management frames the Q1-26 result as evidence that margins are now "stabilizing and converging
      toward our target cohort-level profitability of 40-45%". In absolute terms, quarterly gross profit grew from
      R$211.2mn in Q4-25 to R$253.5mn in Q1-26 (+20.0% QoQ, +24.1% YoY), the highest on record. The IR homepage
      advertised annualized gross profit of R$1,012mn in the May 17, 2026 archive, before this report date. That
      company-disclosed headline is distinct from mechanically multiplying the rounded Q1-26 gross profit of
      R$253.5mn by four, which gives R$1,014mn. The reviewed sources do not reconcile the R$2mn difference;
      neither figure should silently replace the other.


      Costs below gross profit (selling, general and administrative expenses plus customer acquisition costs)
      have held near R$288-292mn per quarter across Q3-25, Q4-25, and Q1-26, with Q1-26 showing a -1.3% QoQ
      improvement to R$288.4mn. CAC specifically fell -6.1% QoQ in Q4-25 while origination grew +10.7% QoQ, a
      signal of improving operating leverage. The original Q3-25 release reported operating loss narrowing from
      R$87mn in Q2-25 to R$68.2mn in Q3-25. After the reconciliation, the Q4-25 release described its R$80.9mn
      operating loss as stable; comparing it with the unreconciled R$68.2mn does not establish a deterioration
      caused by Andbank consolidation. The Q1-26 release reported operating loss narrowing from the Q4-25 R$80.9mn
      to R$34.9mn — approximately one-tenth of the Q1-22 operating loss despite meaningfully higher origination
      volumes. The Q1-26 release targets a return to operational break-even in the near term. Its separate year-end
      aspiration for a new phase combining growth and profitability is not a firm operating-break-even deadline.


      The tension between cohort claims and reported results is the central financial underwriting question. The
      company does not publish vintage-level NPL curves, realized recovery rates on non-accruing pools, or loan-level
      loss data that would allow an independent investor to verify cohort economics. Until that disclosure is made,
      the cohort profitability claim can be neither confirmed nor refuted from public sources.
