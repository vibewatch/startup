chapter:
  number: 4
  title: Financials
  summary: "Creditas has built a meaningful collateralized-lending platform in Brazil: Q1-26 annualized revenues exceed R$2.5bn (+23% YoY), portfolio reached R$7.6bn, and company-reported gross profit margin recovered to 40.0%. Its reported Q1-26 operating loss was R$34.9mn, versus R$80.9mn in Q4-25. The public 2025 audited consolidated statements include 2024 comparatives, a balance sheet, cash flows and notes; they report 2025 revenue of R$2,192.139mn and a loss for the year of R$558.219mn on the statutory basis. Those annual figures are not interchangeable with management-adjusted quarterly highlights. Remaining underwriting gaps concern product/vintage credit performance, Q1-26 liquidity, forward runway and current instrument-level covenant headroom, not the absence of audited annual accounts."
sections:
  - id: section-1
    title: 'Revenue model: interest income on a growing secured portfolio, compressed by SELIC and IFRS provisioning'
    body: "Creditas reports interest revenue and fees/commission revenue, not simply net interest income. The audited 2025 consolidated income statement shows R$1,928.615mn of interest revenue plus R$263.524mn of fees and commissions, totaling R$2,192.139mn before the separately reported interest expense and expected-credit-loss allowance expense. The three core products are Home Equity (empréstimo com garantia de imóvel), Auto Equity (empréstimo com garantia de veículo), and e-Consignado (private payroll-deductible lending). Secondary revenue streams include auto insurance via Creditas Seguros, vehicle financing, and employee-benefit products sold to employers. The company also operates as a Direct Credit Company (SCD) licensed by Brazil's Banco Central, allowing it to originate loans on its own balance sheet, and its 2025 Andbank Brasil acquisition expanded the consolidated group to include bank deposits and a private-banking loan portfolio.\n\nRevenue recognition follows IFRS. A 2026 methodology revision tightened the non-accrual thresholds: Creditas now stops accruing interest on Home Equity loans past due more than 180 days (previously 730 days) and on all other products past due more than 90 days (previously 365 days). The company applied this change retroactively across all 2025 periods and reports the non-cash impact as -6.4% on revenues and -1.7% on gross profit for full-year 2025. Any future payments on these non-accruing assets are recognized as recovery income on receipt. This change does not affect unit economics or cash generation on a flow basis, but it is material to investors reading reported revenue trends because it makes 2025 results incomparable to older published figures at face value.\n\nThe highest-quality revenue driver is portfolio scale. Quarterly origination reached R$1.1bn in both Q4-25 and Q1-26, growing above 29-35% YoY. The cumulative loan portfolio was R$7.6bn as of March 2026 (+22.4% YoY). Annualizing Q1-26 quarterly revenues of R$633mn implies a run-rate above R$2.5bn, which Creditas confirms on its IR homepage. Asset-yield repricing and funding cost must be assessed separately: higher rates on securitization liabilities are an expense, not by themselves evidence of higher lending revenue.\n\nThe full public filing contains the 2025 consolidated IFRS statements of Creditas Financial Solutions LTD, with 2024 comparative figures. KPMG's opinion is dated March 26, 2026 and explicitly excludes assurance on the management report. The selected statutory figures in TI006 come from the income statement, balance sheet and cash-flow statement, converted from R$ thousands to R$ millions by dividing by 1,000. The filing also provides management-to-statutory reconciliations: 2025 managerial adjusted gross profit of R$821.419mn bridges to statutory gross profit of R$747.265mn. That management bridge is useful context, not an extension of the audit opinion to adjusted metrics. The 2024 comparative column does not establish that a separate 2024 audit opinion was reviewed."
