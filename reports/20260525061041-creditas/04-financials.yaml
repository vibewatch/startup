company:
  name: Creditas
chapter:
  number: 4
  title: Financials
  summary: >-
    Creditas has built a meaningful collateralized-lending platform in Brazil: Q1-26 annualized revenues exceed R$2.5bn
    (+23% YoY), portfolio reached R$7.6bn, and gross profit margins recovered to 40.0% in Q1-26 after several quarters of
    IFRS-provisioning headwinds. At the group level, however, the company still runs an operating loss (R$34.9mn in
    Q1-26, down sharply from R$80.9mn in Q4-25), and critical financial inputs — audited multi-year revenue, NPL detail,
    cash balance, and full balance-sheet data — remain outside the public record, limiting underwriting precision.
sections:
  - id: section-1
    title: 'Revenue model: interest income on a growing secured portfolio, compressed by SELIC and IFRS provisioning'
    body: >-
      Creditas generates revenue almost entirely as net interest income on its secured lending book. The three core
      products are Home Equity (empréstimo com garantia de imóvel), Auto Equity (empréstimo com garantia de veículo),
      and e-Consignado (private payroll-deductible lending). Secondary revenue streams include auto insurance via
      Creditas Seguros, vehicle financing, and employee-benefit products sold to employers. The company also operates
      as a Direct Credit Company (SCD) licensed by Brazil's Banco Central, allowing it to originate loans on its own
      balance sheet, and it completed the acquisition of Andbank Brasil's banking license in December 2025, which
      expands its capacity to fund loans through deposits.


      Revenue recognition follows IFRS. A 2026 methodology revision tightened the non-accrual thresholds: Creditas
      now stops accruing interest on Home Equity loans past due more than 180 days (previously 730 days) and on all
      other products past due more than 90 days (previously 365 days). The company applied this change retroactively
      across all 2025 periods and reports the non-cash impact as -6.4% on revenues and -1.7% on gross profit for
      full-year 2025. Any future payments on these non-accruing assets are recognized as recovery income on receipt.
      This change does not affect unit economics or cash generation on a flow basis, but it is material to investors
      reading reported revenue trends because it makes 2025 results incomparable to older published figures at face
      value.


      The highest-quality revenue driver is portfolio scale. Quarterly origination reached R$1.1bn in both Q4-25 and
      Q1-26, growing above 29-35% YoY. The cumulative loan portfolio was R$7.6bn as of March 2026 (+22.4% YoY).
      Annualizing Q1-26 quarterly revenues of R$633mn implies a run-rate above R$2.5bn, which Creditas confirms on
      its IR homepage. Repricing tailwinds — driven by SELIC-indexed securitizations rolling over at current higher
      rates — continue to support revenue per unit of portfolio even when volumes grow at high single-digit percent
      of portfolio balance per quarter.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI020
