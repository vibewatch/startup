  - id: section-4
    title: 'Financial verdict: revenue quality is improving, but underwriting blockers remain'
    body: >-
      The positive financial case for Creditas is grounded in observable operating trajectory. Revenue is growing
      above 20% per year on a large and accelerating loan book. Gross profit margins reached 40% in Q1-26, a level
      management says confirms cohort-level thesis. Operating losses are narrowing rapidly — down roughly 90% from
      Q1-22 levels at higher origination volumes. Customer acquisition costs are falling while origination scales.
      Productivity per employee rose from R$1.1mn to R$1.4mn in annualized revenues over six months, and AI
      initiatives are compressing product development cycles. The banking license acquisition gives a structural
      funding-cost advantage.


      The adverse signals temper this view. At the group level the company still loses money — R$34.9mn in Q1-26
      even by the company's own operating loss definition, which likely excludes some cash items. Consumer
      complaints at Reclame Aqui show a "Regular" reputation score (6.4/10) with nearly 2,000 complaints in a
      six-month window (November 2025 to April 2026), only 70.1% resolved, and 46.5% of evaluators willing to do
      business again — a below-average score that could signal customer service friction or product dissatisfaction.
      Top complaint categories include improper charges, misleading advertising, and difficulty completing
      transactions. These signals do not prove financial loss quality issues but they raise questions about customer
      experience that could weigh on retention and CAC in future cohorts.


      The key underwriting blockers are data gaps: NPL rates by product, vintage loss curves, cash and liquidity
      position, covenant headroom on securitizations, balance-sheet leverage ratios, and audited multi-year income
      statements. Until those are available, a financial verdict can be directionally positive but cannot be
      investor-complete.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI038
      - CI039
      - CI040
