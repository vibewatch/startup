    type: flow
    summary: Traces the path from secured asset (home, car, payroll) through origination, loan book, interest
      accrual, IFRS provision, and funding cost to arrive at reported gross profit.
    data:
      nodes:
        - id: borrower-asset
          label: Borrower asset (home / car / payroll)
          description: Collateral deposited by borrower; determines product category and LTV
        - id: origination
          label: Loan origination
          description: Secured loan funded from FIDC/CRI securitization or banking deposits; Q1-26 R$1.1bn/quarter
        - id: loan-portfolio
          label: Loan portfolio (R$7.6bn, Q1-26)
          description: Outstanding principal on all collateralized loans; grows with net origination minus repayments
        - id: interest-income
          label: Gross interest income
          description: Contractual interest charged on portfolio; indexed to CDI/IPCA depending on product
        - id: ifrs-provision
          label: IFRS provision charge
          description: Expected credit loss provisioned at origination; front-loads cost during growth; tightened in 2026 methodology change
        - id: funding-cost
          label: Funding cost (CDI-linked)
          description: Interest paid on FIDC/CRI securitizations indexed to CDI; rises with SELIC; offset partially by Andbank deposits
        - id: gross-profit
          label: Gross profit (R$253.5mn Q1-26, 40.0% margin)
          description: Interest income minus provision charge and funding cost; converging to cohort-level target
      edges:
        - from: borrower-asset
          to: origination
        - from: origination
          to: loan-portfolio
        - from: loan-portfolio
          to: interest-income
        - from: interest-income
          to: ifrs-provision
          label: deducted
        - from: interest-income
          to: funding-cost
          label: deducted
        - from: interest-income
          to: gross-profit
          label: net of provision + funding cost
    approximationNotes: >-
      Provision charge and funding cost are not separately disclosed in press releases; their individual sizes are
      inferred from the GP margin compression narrative. The Andbank deposit contribution to funding cost is not
      yet quantified.
    claimRefs:
    - CI005
    - CI006
    - CI020
    - CI028
  - id: FI002
    title: Q1-26 reported margin and mechanical annualization
    type: bar
    summary: >-
      The quarterly release supports a reported gross-profit margin and simple four-times-quarter flow
      calculations. These are not trailing-twelve-month results, low/base/high forecasts, or source-backed scenario
      bounds.
    data:
      items:
        - label: Annualized revenue
          value: 2532
          unit: R$mn
          note: "Derived: reported Q1-26 revenue of R$633.0mn x 4 = R$2,532mn."
        - label: Annualized gross profit
          value: 1014
          unit: R$mn
          note: "Derived: reported Q1-26 gross profit of R$253.5mn x 4 = R$1,014mn. The historical IR headline separately stated R$1,012mn."
        - label: Reported Q1-26 gross-profit margin
          value: 40
          unit: '%'
          note: Company-reported quarterly margin; percentages are not annualized. This does not independently verify cohort profitability.
        - label: Annualized operating result (loss)
          value: -139.6
          unit: R$mn
          note: "Derived: Q1-26 operating loss of R$34.9mn x 4 = R$139.6mn; the negative sign denotes a loss."
    approximationNotes: >-
      Annualization repeats a single quarter mechanically; it is not a trailing-twelve-month observation or a 2026
      forecast and does not establish seasonality. The old bounds are withdrawn: the 2025 methodology impact cannot
      be reapplied as a Q1-26 haircut, costs below gross profit cannot justify a gross-profit adjustment, and
      aspirational break-even language does not establish a loss bound. The historical IR headline of R$1,012mn
      remains a separate company disclosure; the reviewed sources do not reconcile it with the R$1,014mn arithmetic
      result.
    claimRefs:
    - CI003
    - CI005
    - CI006
    - CI009
    - CI036
  - id: FI003
    title: Q1-26 revenue, gross profit and their arithmetic difference
    type: bar
    summary: Reported revenue and gross profit imply a R$379.5mn arithmetic difference. The release does not provide
      the individual funding-cost and provision amounts needed for the previous numerical waterfall.
    data:
      items:
        - label: Reported revenue
          value: 633
          unit: R$mn
          note: "Creditas Q1-26 company release: revenue of R$633.0mn."
        - label: Revenue less gross profit (derived)
          value: 379.5
          unit: R$mn
          note: "Arithmetic difference: R$633.0mn - R$253.5mn = R$379.5mn. This is not a separately disclosed expense line or a verified allocation between funding costs and provisions."
        - label: Reported gross profit
          value: 253.5
          unit: R$mn
          note: "Creditas Q1-26 company release: gross profit of R$253.5mn, with a reported margin of 40.0%."
    approximationNotes: >-
      All amounts are Q1-26 R$mn. Only the revenue and gross-profit totals are company-reported; the middle value is
      their arithmetic difference, not a validated cost decomposition. The unsupported R$820mn interest-income,
      R$390mn funding-cost and R$180mn provision estimates are withdrawn. No annual yield is treated as a quarterly
      amount, and no separate SELIC or IFRS component is inferred.
