  - id: FI003
    title: Capital intensity and funding cost map — SELIC transmission to gross profit
    type: waterfall
    layout: standard
    summary: Illustrates how portfolio-level gross interest income is reduced by estimated funding costs and
      IFRS provision charges to arrive at reported gross profit, with SELIC as the key lever.
