  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: npls-absent
    missingEvidence: >-
      NPL rates, delinquency buckets (>30d, >60d, >90d, >180d), vintage-level loss curves, and recovery rates on
      non-accruing pools by product (Home Equity, Auto, e-Consignado).
    whyItMatters: >-
      Cohort profitability claims cannot be independently verified without NPL data; this is the single most
      important missing input for credit quality assessment.
    diligencePath: >-
      Request credit risk dashboard from management with vintage-level delinquency, provision coverage, and
      actual loss-given-default by product for all cohorts originated since 2021.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-balance
    missingEvidence: >-
      Current cash, liquid securities, restricted cash, monthly IFRS operating cash outflow, and 12-month
      forward cash consumption under a flat-growth scenario.
    whyItMatters: >-
      Without cash position, runway, and burn data, capital adequacy and need for next equity round cannot be
      assessed; the "cash-neutral" claim is unverifiable from public sources.
    diligencePath: >-
      Obtain monthly management accounts with cash waterfall, operating cash flow statement, and board-approved
      12-month budget and downside runway scenario.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: disclosure-limits
    missingEvidence: >-
      Audited multi-year income statement with IFRS P&L line items (finance income, finance cost by instrument,
      provision charge, tax, EBITDA), comparatives for 2024, and full balance sheet.
    whyItMatters: >-
      Quarterly press-release highlights cannot substitute for filing-grade financial statements; the 2025 audited
      PDF is publicly filed but only the management review section was accessible in cached content.
    diligencePath: >-
      Obtain full audited consolidated financial statements for 2024 and 2025 directly from the company or
      recheck the PDF URL for full access.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: securitization-covenants
    missingEvidence: >-
      Individual FIDC, CRI, and bond covenant terms — including early-amortization triggers, performance ratios,
      cross-default, and LTV tests embedded in trust documents.
    whyItMatters: >-
      Securitization covenants could accelerate amortization in a credit downturn, constraining liquidity and
      forcing asset disposals or equity injections.
    diligencePath: >-
      Request full trust documents for the five largest outstanding FIDC/CRI facilities and any bond indentures
      with covenant schedule and compliance certificates.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: cumulative-loss-experience
    missingEvidence: >-
      Total loans originated since inception, cumulative charge-offs, average historical loss rate, and implied
      lifetime credit loss experience across Home Equity, Auto, and e-Consignado products.
    whyItMatters: >-
      Without cumulative origination volume and realized loss data, the sufficiency of provision coverage and the
      quality of underwriting models across an economic cycle cannot be independently assessed.
    diligencePath: >-
      Request vintage-level origination ledger with realized loss and recovery data from inception through Q1-26;
      cross-reference against FIDC trust reports and audited reserve levels.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
figures:
  - id: FI001
    title: Revenue model bridge — how collateral activity converts to gross profit
    type: flow
    layout: standard
    summary: Traces the path from secured asset (home, car, payroll) through origination, loan book, interest
      accrual, IFRS provision, and funding cost to arrive at reported gross profit.
    data:
      nodes:
        - id: borrower-asset
          label: Borrower asset (home / car / payroll)
          description: Collateral deposited by borrower; determines product category and LTV
        - id: origination
          label: Loan origination
          description: Secured loan funded from FIDC/CRI securitization or banking deposits; Q1-26 R$1.1bn/quarter
        - id: loan-portfolio
          label: Loan portfolio (R$7.6bn, Q1-26)
          description: Outstanding principal on all collateralized loans; grows with net origination minus repayments
        - id: interest-income
          label: Gross interest income
          description: Contractual interest charged on portfolio; indexed to CDI/IPCA depending on product
        - id: ifrs-provision
          label: IFRS provision charge
          description: Expected credit loss provisioned at origination; front-loads cost during growth; tightened in 2026 methodology change
        - id: funding-cost
          label: Funding cost (CDI-linked)
          description: Interest paid on FIDC/CRI securitizations indexed to CDI; rises with SELIC; offset partially by Andbank deposits
        - id: gross-profit
          label: Gross profit (R$253.5mn Q1-26, 40.0% margin)
          description: Interest income minus provision charge and funding cost; converging to cohort-level target
      edges:
        - from: borrower-asset
          to: origination
        - from: origination
          to: loan-portfolio
        - from: loan-portfolio
          to: interest-income
        - from: interest-income
          to: ifrs-provision
          label: deducted
        - from: interest-income
          to: funding-cost
          label: deducted
        - from: interest-income
          to: gross-profit
          label: net of provision + funding cost
    approximationNotes: >-
      Provision charge and funding cost are not separately disclosed in press releases; their individual sizes are
      inferred from the GP margin compression narrative. The Andbank deposit contribution to funding cost is not
      yet quantified.
    claimRefs:
    - CI005
    - CI006
    - CI020
    - CI028
  - id: FI002
    title: Financial estimate range — annualized revenue and gross profit bounds (Q1-26 annualized basis)
    type: range
    layout: standard
    summary: Source-backed low/base/high ranges for Creditas' annualized revenue and gross profit run rate as of
      Q1-26, with explicit provenance for each bound.
    data:
      items:
        - label: Annualized Revenue (R$mn)
          low: 2400
          mid: 2532
          high: 2640
          unit: R$mn
          note: >-
            Low: applying -6.4% IFRS methodology haircut to base. Base: Q1-26 quarterly R$633mn × 4.
            High: assumes +4% QoQ growth rate continues. Sources: IR homepage (R$2.5bn stated),
            Q1-26 results (R$633mn).
        - label: Annualized Gross Profit (R$mn)
