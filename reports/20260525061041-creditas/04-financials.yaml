  - id: TI005
    title: Public financial gaps table
    columns:
      - missing metric
      - impact on analysis
      - diligence path
    rows:
      - - NPL rates by product and vintage
        - Cannot verify cohort profitability claims; delinquency trend determines credit loss assumptions
        - Request internal credit risk dashboard with >30d, >60d, >90d, >180d buckets by product and vintage quarter
      - - Audited multi-year income statement with IFRS line items
        - Quarterly press releases lack COGS decomposition, finance costs, tax, and full P&L; audited 2025 FS PDF only partially accessible
        - Obtain full audited consolidated income statement with comparatives for 2024 and 2025
      - - Cash and liquid assets balance sheet
        - Runway and covenant headroom cannot be assessed; cash-neutral claim cannot be independently verified
        - Request balance sheet with cash, restricted cash, and financial liabilities as of Q1-26
      - - Funding cost decomposition (securitization vs deposit)
        - NIM bridge cannot be built without separating asset yield from CDI-indexed funding cost
        - Request weighted-average cost of funds by instrument type with SELIC sensitivity scenario
      - - LTV distribution and collateral coverage
        - Stress-test loss scenarios require LTV at origination and current by product; absent from public record
        - Request credit quality annex with average and P75 LTV for Home Equity and Auto Equity pools
      - - Revenue by product line
        - Cannot assess mix shift between Home Equity, Auto, and e-Consignado, or whether mix improves/degrades revenue quality
        - Request management accounts with quarterly revenue and gross profit by product
    notes: >-
      Gaps identified by comparing metrics routinely disclosed by public-market lenders (NU, banks) against what
      Creditas publishes. Null cells represent fully missing public data rather than estimated or partial data.
