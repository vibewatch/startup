    rows:
      - - Total equity raised (lifetime)
        - US$987mn across 7 rounds through Series G (Dec 2025)
        - high
        - Adequate total equity raised, but Series G was at a 31% down-valuation vs Series F; pace of dilution matters
        - Confirm cap table, preference stack, and liquidation waterfall
      - - Latest round (Series G, Dec 2025)
        - US$108mn at US$3.3bn valuation; led by Andbank; VEF convertible notes converted to equity
        - high
        - Down-round vs Series F ($4.8bn); signals investor discipline or macro reset; Andbank strategic motivation
        - Confirm whether further closings of Series G are planned and at what terms
      - - Capital markets issuances (DCM)
        - 70+ FIDCs, CRIs, FIIs between bonds and securitizations (per IR homepage)
        - medium
        - Primary source of on-going loan book funding; SELIC sensitivity is the key cost driver
        - Obtain weighted-average funding cost and covenant schedule for existing securitizations
      - - Cash and liquidity (current)
        - Not publicly disclosed
        - null
        - Cannot determine runway, covenant headroom, or need for next round from public sources
        - Obtain latest cash balance, liquid securities, and 12-month cash flow forecast
      - - Monthly cash burn / operational cash flow
        - Targeting cash-neutral since end-2023; Q1-26 operating loss R$34.9mn; cash impact unknown
        - low
        - Distinction between IFRS operating loss and actual cash consumption is critical for runway assessment
        - Request operating cash flow statement from audited financials
      - - Andbank banking license
        - Closed December 2025; allows deposit-taking and CDB issuance; Andbank also 25% partner in private banking
        - high
        - Structural funding-cost reduction; lowers dependence on market-rate securitizations under high SELIC
        - Disclose cost of deposit funding vs. securitization funding and ramp plan for deposit base
    notes: >-
      Series G terms from official Creditas IR press release (Dec 2025) and VEF LSE RNS filing. Total equity from
      IR homepage. DCM issuances count from IR homepage. Cash balance and burn are not in the public record.
