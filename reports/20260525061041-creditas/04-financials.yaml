  - id: section-4
    title: 'Financial verdict: revenue quality is improving, but underwriting blockers remain'
    body: "The positive financial case for Creditas is grounded in observable operating trajectory. Revenue is growing above 20% per year on a large and accelerating loan book. Gross profit margins reached 40% in Q1-26, a level management says confirms cohort-level thesis. Operating losses are narrowing rapidly — down roughly 90% from Q1-22 levels at higher origination volumes. Customer acquisition costs are falling while origination scales. Productivity per employee rose from R$1.1mn to R$1.4mn in annualized revenues over six months, and AI initiatives are compressing product development cycles. The banking acquisition provides a potential funding-cost lever; the disclosed deposit stock alone does not demonstrate realized savings.\n\nThe adverse signals temper this view. At the group level the company still loses money — R$34.9mn in Q1-26 on the company's reported operating-loss basis. The separate audited statutory loss for full-year 2025 was R$558.219mn; neither figure should be equated with cash burn. Consumer complaints at Reclame Aqui show a \"Regular\" reputation score (6.4/10) with nearly 2,000 complaints in a six-month window (November 2025 to April 2026), only 70.1% resolved, and 46.5% of evaluators willing to do business again — a below-average score that could signal customer service friction or product dissatisfaction. Top complaint categories include improper charges, misleading advertising, and difficulty completing transactions. These signals do not prove financial loss quality issues but they raise questions about customer experience that could weigh on retention and CAC in future cohorts.\n\nThe filing closes the blanket annual-statement and historical-balance-sheet availability gaps. Note 8 also discloses gross and net loans by IFRS impairment stage, expected-credit-loss movements and maturity information: Creditas gross Stage 3 loans were R$497.457mn at December 2025, distinct from the R$93.281mn net Stage 3 balance. Those are balances, not product-level NPL rates; mixing a net numerator with a gross denominator would be misleading. Remaining blockers are product/vintage delinquency and loss curves, Q1-26 usable liquidity and forward runway, a current instrument-level covenant schedule, and product-level financial reconciliation. Historical accounting leverage can be computed from the public balance sheet, but it does not substitute for current liquidity or regulatory-capital analysis. The recommendation remains conditional on these specific gaps rather than an assertion that audited accounts are unavailable."
