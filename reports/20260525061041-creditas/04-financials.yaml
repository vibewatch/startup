callouts:
  - calloutType: insight
    title: Q1-26 marks the first quarter where reported GP margin meets the stated 40% cohort target
    body: >-
      After several quarters where IFRS front-loaded provisioning and high SELIC funding costs compressed reported
      margins below the cohort claim, Q1-26 delivered 40.0% gross profit margin and the highest absolute gross
      profit on record. Management now explicitly states margins are "stabilizing and converging toward 40-45%."
      This is the first externally verifiable data point partially consistent with the cohort-level claim.
    claimRefs:
      - CI006
      - CI019
      - CI009
