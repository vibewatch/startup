    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立故事和商业模式
        blocks:
          - type: paragraph
            body: >-
              Creditas 是一家总部位于巴西 São Paulo 的私营金融科技公司。公司的法律实体是 Creditas Financial Solutions, Ltd.，自 2019 年起以 Sociedade de
              Crédito Direto（SCD）身份获得 Banco Central do Brasil 授权运营。December 2025 收购 Andbank Brasil 完整银行牌照后，Creditas
              也持有巴西 banco múltiplo 牌照，监管边界明显扩大，资金成本也被压低。

              公司由 Sergio Furio 于 2012 年创立，最初名为 BankFacil。Furio 是西班牙人，在金融市场有 12 年以上经验；他的当时女友、现在的妻子 Silvia Furio
              让他看到了这个机会——巴西银行收取的利差极端高。BankFacil 起步时是金融产品比价工具和获客博客，之后演进为直接放贷机构。最初 8 个月没有盈利；Furio 卖掉了自己在 New York
              的公寓来延长现金跑道。2013 年与已经经营抵押信贷的 GranaAqui 合并，加快了公司转向直接放贷。到 2016 年，BankFacil 已经用自有资产负债表跑通端到端信贷业务，并随后更名为
              Creditas，以体现向完整抵押信贷平台的转型。

              Creditas 将自己描述为「拉美领先的抵押贷款、保险和投资解决方案平台」。核心商业模式锚定有抵押消费信贷：借款人以房地产（房屋净值）、汽车（车辆净值）或工资（consignado
              privado）作抵押或还款保障，使 Creditas 能以低于无抵押消费贷机构的利率承保，同时赚取资本市场资金成本与借款人收益率之间的利差。抵押品降低违约风险，拉长贷款期限（房屋净值贷款最高 240
              个月），也让客户关系更深、更黏。公司把自己的策略称为「交叉销售」——用核心信贷关系作为锚点，分销保险、雇主金融福利、工资预支产品，并最终通过与 Andbank Wealth 的私人银行合资项目提供投资服务。截至
              Q1-26，Creditas 披露累计放贷超过 R$12.1B，按现行市场利率口径为客户节省超过 R$6.2B。
