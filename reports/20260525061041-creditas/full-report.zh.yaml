  - id: FR002
    title: 风险传导图：核心风险如何流入 Creditas 的估值和运营
    type: dag
    summary: 两条杀伤力最大的路径都收敛到估值：SELIC 高企挤压利润率、拖慢盈利；整合或信用问题会放大运营亏损，堵住 IPO 路径。
    data:
      nodes:
        - id: r1
          label: SELIC 持续高位
          detail: BCB 政策利率维持高位；预计 2026 年 SFN 信贷增速降至 8 %。
        - id: r2
          label: 证券化资金成本上升
          detail: FIDC/CRI 结构按 CDI 定价；每次 SELIC 变动都会立刻推高成本。
        - id: r3
          label: 毛利率被挤压
          detail: GP 利润率 Q4-25 降至 36.2 %，低于 40 % 目标；Q1-26 回升至 40.0 %。
        - id: r4
          label: 运营盈亏平衡推迟
          detail: 运营亏损从 Q4-25 的 R$80.9 mn 收窄至 Q1-26 的 R$34.9 mn；盈利路径被拉长。
        - id: r5
          label: Andbank 整合摩擦
          detail: Q4-25 损益表已看到成本并表；审慎合规要求是新增负担。
        - id: r6
          label: IFRS 拨备前置
          detail: 放款快速增长会推高前置拨备，压缩报表利润率。
        - id: r7
          label: NPL / 信用质量恶化（潜在）
          detail: 产品级 NPL 未披露；应计方法调整意味着审查更严。
        - id: r8
          label: 客服 / 声誉缺口
          detail: Reclame Aqui 6.4/10，低于 Nubank 的 8.6/10；重复业务意愿 46 %。
        - id: r9
          label: CAC 压力与流失风险
          detail: NPS 偏弱会迫使公司花更多营销费用来补回流失客户。
        - id: r10
          label: 竞争侵蚀（Nubank / 银行）
          detail: Nubank 进入薪资扣款贷 / 抵押贷垂直领域，CAC 更低、信任度更高。
        - id: r11
          label: 估值 / IPO 路径受损
          detail: 已比 Series F 峰值低 31 %；进一步亏损或估值下调轮会拖延退出。
        - id: r12
          label: 投资逻辑破裂：资本不足 / 被迫重组
          detail: 如果未达盈利目标且资本市场关闭，契约或稀释风险会上升。
      edges:
        - from: r1
          to: r2
          label: 直接推高
        - from: r2
          to: r3
          label: 挤压
        - from: r3
          to: r4
          label: 拉长路径
        - from: r5
          to: r4
          label: 增加成本
        - from: r6
          to: r3
          label: 前置压力
        - from: r7
          to: r6
          label: 放大
        - from: r8
          to: r9
          label: 推高
        - from: r9
          to: r4
          label: 恶化
        - from: r10
          to: r9
          label: 加剧
        - from: r4
          to: r11
          label: 损害
        - from: r11
          to: r12
          label: 可能升级为
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR008
      - CR026
      - CR039
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 该建议来自权衡：运营改善和战略资金可选性在变好，但信用质量不透明、消费者声誉拖累和未解尽调缺口抵消了上行。 所引 BCB 信贷专栏载有 2025 年当时作出的贷款余额预测，并非经核实的 2026 年初政策利率记录。
    data:
      nodes:
        - id: evidence-base
          label: 证据基础（Q1-26 财务、Series G 轮、BCB 数据、消费者声誉）
        - id: operating-metrics
          label: 运营指标（R$633mn 收入、40% GP 利润率、R$34.9mn 运营亏损）
        - id: adverse-signals
          label: 反向信号（NPL 不透明、6.4/10 声誉、历史利率比较尚未核实）
        - id: valuation-context
          label: 估值背景（US$3.3B Series G 轮，较 Series F 低 31%，Andbank 战略锚点）
        - id: diligence-gaps
          label: 尽调缺口（分产品／批次 NPL、当前流动性、清算优先权分配顺序）
        - id: bull-triggers
          label: 乐观触发因素（Q3-26 前盈亏平衡、存款爬坡、SELIC 降息）
        - id: bear-triggers
          label: 悲观触发因素（SELIC 持续、NPL 意外、利润率压缩）
        - id: recommendation
          label: 建议：观察 / 有条件跟踪，偏好入场估值为 US$2.5-3.0B
      edges:
        - from: evidence-base
          to: operating-metrics
        - from: evidence-base
          to: adverse-signals
        - from: operating-metrics
          to: valuation-context
        - from: adverse-signals
          to: valuation-context
        - from: valuation-context
          to: diligence-gaps
        - from: bull-triggers
          to: recommendation
        - from: bear-triggers
          to: recommendation
    claimRefs:
      - CV001
      - CV010
      - CV015
      - CV020
      - CV040
      - CV046
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 示例股权估值将分析师选定的倍数用于取整后的 US$500mn 年化收入代理值；标签代表情景，不是已观察到的市场底价或经验证的退出价值。
    data:
      series:
        - name: 隐含入场估值（US$B）
          points:
            - label: 4x 收入（悲观底部）
              value: 2
            - label: 5x 收入（目标入场）
              value: 2.5
            - label: 6x 收入（纪律性入场）
              value: 3
            - label: 6.6x 收入（Series G 轮）
              value: 3.3
            - label: 8x 收入（基准退出）
              value: 4
            - label: 10x 收入（乐观）
              value: 5
    approximationNotes: >-
      代理值由 Q1-26 收入 R$633mn × 4 / 5 = US$506.4mn 取整为 US$500mn，采用 R$5 兑 US$1 的示例约定，而非有来源支持的市场汇率。每根柱子的数值等于代理值乘以标签倍数。6.6x
      柱按定义重现 Series G 的 US$3.3bn 股权估值。这些既不是过去十二个月倍数，也不是企业价值倍数；退出情景柱没有预测未来收入。
    claimRefs:
      - CV012
      - CV040
  - id: FV003
    title: 不同入场价下的公司股权价值变动示例
    type: range
    summary: 百分比变动由表中的股权价值区间计算得出，不是年化回报，也不是股东所得预测；以较低价格入场仍有下行风险。
    data:
      items:
        - label: 悲观情景（US$3.3B 入场）
          low: -39.4
          mid: -31.8
          high: -24.2
          unit: '%'
          note: 假设退出股权价值 US$2.0-2.5B，中点 US$2.25B。SELIC 持续高企、NPL 出现负面意外和声誉拖累均为分析师设定的条件；该区间不是不可突破的下限。
        - label: 基准情景（US$3.3B 入场）
          low: 6.1
          mid: 21.2
          high: 36.4
          unit: '%'
          note: 假设退出股权价值 US$3.5-4.5B，中点 US$4.0B。分析师情景设定为 2026 年仍亏损，存款收益仅部分兑现；不假设在 2027 年中达到盈亏平衡。
        - label: 乐观情景（US$3.3B 入场价）
          low: 66.7
          mid: 89.4
          high: 112.1
          unit: '%'
          note: 假设退出股权价值 US$5.5-7.0B，中点 US$6.25B。Q3-26 前达到盈亏平衡、银行牌照带来收益，是分析师设定的条件，并非管理层承诺。
        - label: 三种情景总区间（US$2.5B 入场）
          low: -20
          mid: 80
          high: 180
          unit: '%'
          note: >-
            跨情景退出价值总区间 US$2.0-7.0B，以 US$2.5B 入场，对应变动 -20.0% 至 +180.0%。圆点代表总区间中点（+80.0%，退出价值
            US$4.5B），不是预期结果，也不是基准区间中点；退出价值 US$4.0B 对应的变动为 +60.0%。本行复用同样的三种情景，并非独立的第四种情景。
    claimRefs:
      - CV015
      - CV019
      - CV032
      - CV037
      - CV040
      - CV001
    approximationNotes: >-
      公式：（假设退出股权价值 / 入场股权价值 - 1）× 100，百分比保留一位小数。圆点先取退出价值区间的中点，再换算百分比并取整；它们不是预期或概率加权结果。最后一行是在另一入场价下，同样三种情景构成的总区间。不使用此前的
      2027-28 年、三至四年和五年期限，也不计算年化回报。模型未纳入稀释、优先权、费用、税费和分配，实际亏损可能超出这些示例区间。
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 评分卡在市场机会、战略融资余地，与披露薄弱、未解信用风险之间权衡。
    data:
      items:
        - label: 市场机会
          value: 7
          note: 巴西有担保贷款市场大、渗透率低，但 BCB 利率逆风仍在
        - label: 收入验证
          value: 6
          note: Q1-26 收入 R$633mn、同比增长 23%，证明规模，不证明盈利能力
        - label: 竞争护城河
          value: 7
          note: 银行牌照叠加 DCM 基础设施，以及十年经营记录
        - label: 单位经济模型
          value: 5
          note: 40% GP 毛利率是积极信号，但队列经济性仍无法用公开资料验证
        - label: 风险校准
          value: 4
          note: NPL 不透明、SELIC 敞口、IFRS 收紧，以及消费者口碑偏弱
        - label: 估值吸引力
          value: 5
          note: 6.6x 年化收入示例采用取整后的 US$500mn 代理值，假设 R$5 兑 US$1；对亏损贷款机构而言并不便宜，不过 Andbank 提供了战略支持。
        - label: 证据完整性
          value: 5
          note: 尚缺分产品／批次 NPL、Q1-26 可用现金与未来现金跑道，以及优先权条款；2025 年经审计财报及 2024 年对比数据已公开
    claimRefs:
      - CV009
      - CV012
      - CV017
      - CV020
      - CV033
      - CV040
      - CV046
