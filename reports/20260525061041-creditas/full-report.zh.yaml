      - number: '8.4'
        title: 退出路径、尽调阻断项，以及哪些信号会改变判断
        blocks:
          - type: paragraph
            body: >-
              Creditas 的退出分析仍只是可能路径，尚未得到确认。收入规模已符合未来 IPO 候选或战略并购标的的轮廓，Andbank 交易也说明融资结构与银行牌照的潜在价值至少吸引过战略买方。但尚未见官方 IPO
              时间表，未找到公开投行委任，也没有公开老股交易证据显示非战略投资者目前会以什么价格承接大额股份。退出选项存在，证据却薄弱。投资者应假设退出时点取决于经营盈利、巴西宏观环境及银行整合后的融资策略，而不只是公司规模。


              真正重要的剩余缺口涉及当前数据、分产品信息和投资者权利，不能笼统归结为公开财报缺失。首先，已审阅证据尚不能确认分产品、分放款批次 NPL 及损失曲线；经审计文件确实包含汇总 IFRS
              信用阶段余额。缺少细分披露，投资者无法判断 40% 毛利率能否持续，还是掩盖了潜在信用成本。其次，完整的 2025 年经审计合并财报包含 2024 年对比数据、资产负债表、现金流量表及附注。2025 年 12
              月现金及现金等价物 R$777.086mn 已披露，但不能据此确认 Q1-26 可用现金或未来现金跑道。本次纠错尚未审阅更早的 2022–2023
              年报，应继续查找和审阅，而不是断言其不可得。第三，普通股之上的优先股堆叠仍不透明，即使企业价值区间合理，也无法直接换算成普通股回报。缺口并非细节问题，而是直接影响入场价格纪律和下行保护。


              建议只能随硬证据改变。若 Q2-26 经营业绩超预期、Andbank 牌照带来的存款增长得到可信验证，且首次 NPL
              披露未显示隐性恶化，可从观察名单转向具备投资信心。反过来，若经营亏损再度扩大、连续两个季度毛利率低于 35%，或首次信用指标不利，应考虑放弃，除非价格显著低于 G 轮估值。
