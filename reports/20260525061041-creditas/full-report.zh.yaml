      - number: '3.5'
        title: 反向证据：既有银行赢在哪里，Creditas 面对哪些逆风
        blocks:
          - type: paragraph
            body: >-
              Creditas 的不利证据很具体，并非纸上推演。最清晰的反证来自客户体验：Reclame Aqui 显示，Creditas 在评分、响应时间、问题解决率和客户再次使用意愿上明显落后于
              Nubank。公司常将自己定位为传统信贷的更好数字替代方案，这一差距不能忽视。第二项不利证据来自财务。Creditas 仍在增长，Q1-26 利润率有所改善，但公司尚未盈利；Q4-25 明确提到高 SELIC
              环境，Banco Central 的 2025 年政策报告也指出，即使私营部门工资代扣信贷扩张，偏紧的金融条件仍限制信贷供给。Andbank 牌照可能有帮助，但尚未消除高利率周期对专业贷款机构经营效益的影响。

              第三，估值本身就是警示。2025 年 Series G 估值为 US$3.3 billion，较 2022 年 Series F 峰值 US$4.8 billion 下调
              31.25%，公开市场式的倍数压缩已经反映在股权结构表中。最后，当速度比复杂能力更重要时，Creditas 容易受到冲击：Rebel 可凭简单的数字无抵押信贷胜出；Caixa 和 BB 可凭工资代扣与 INSS
              分销优势胜出；借款人没有抵押品或不愿抵押时，FGTS 或个人贷款替代品也可能更有吸引力。因此，Creditas 更像一家位置有利的专业机构，而非已经占据整个品类的公司。
