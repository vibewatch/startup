      - number: '7.7'
        title: 执行风险：产品宽度、银行整合和领导层过渡
        blocks:
          - type: paragraph
            body: >-
              Creditas 现在运营六条或更多不同产品线（Home Equity、Auto
              Equity、e-Consignado、保险、灵活员工福利、车辆融资和房产融资），同时还有新收购的银行子公司，以及一家私人银行合资公司的 25 % 股权。在追求 25 %+
              年组合增长的同时管理这套宽产品矩阵，并同步整合一家银行，会带来实质执行风险。Q4 2025 业绩明确指出，运营成本上升部分来自“整合 Andbank 公司结构”，说明整合摩擦已经出现在 P&L
              中。Creditas 在 December 2025 任命 Ricardo Forcano 为 CTO 和 COO，正是银行收购完成的同一个月。Forcano 是经验丰富的高管，在 BBVA
              等全球大型机构有二十多年经历，但截至运行日，他刚加入 Creditas。新最高运营高管到任与银行收购完成同步发生，叠加了执行不确定性。Creditas 的 AI 优先平台叙事可信——Q1 2026
              报告员工生产率创纪录（年化 R$1.4 mn vs 六个月前 R$1.1 mn），管理层描述 AI agents 端到端处理早期催收，并用 AI
              加速软件开发，把周期从三周压到四天。不过，在相似增长阶段的金融科技公司中，AI 平台承诺跑在交付前面是常见模式，而公开材料没有对所称生产率提升的独立审计。公司成立以来放款 R$12.1
              billion，并称为客户节省 R$6.2 billion，这提供了可信的运营历史；但银行集团整合增加了性质不同的合规和运营复杂度，在 Creditas 过往记录中没有直接先例。
