        title: 留存、集中度与扩张信号
        blocks:
          - type: paragraph
            body: >-
              Creditas 没有公开披露任何客户分层的留存指标（NRR、GRR、流失率）。最强的代理信号是：(1) 汽车保险“10 人中有 9 人”的续保率（公司自称，未验证）；(2)
              管理层反复把“高客户复购”作为增长基础，但未量化；以及 (3) Benefits 平台的结构性产品设计：雇主—雇员关系一旦与薪资和 HR
              流程整合，就会形成嵌入式切换成本。公司明确把交叉销售列为提高单客收入的机制：金融画像改善的借款人可从 consignado 交叉销售到 Home Equity，也可交叉销售保险。

              从大众消费属性、高贷款笔数，以及 R$7.6bn 组合和典型抵押贷款规模所隐含的分散度看，单个客户层面的集中度风险结构性较低。但 B2B 集中度风险未知：如果少数大型雇主客户贡献了 Benefits 平台收入或
              consignado 发起量的过高比例，公开数据无法看见。合作伙伴渠道（correspondentes）又增加一层集中度：如果少数大型 API 合作伙伴驱动了汽车或 Home Equity
              发起量的大部分，关键合作伙伴退出或重谈条款会对发起量造成实质影响。公司没有公开披露合作伙伴集中度数据。
