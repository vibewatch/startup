      - number: '2.3'
        title: 买方分层、付款方经济和采用触发因素
        blocks:
          - type: paragraph
            body: >-
              这个市场与其按抽象收入档位切分，不如按抵押品类型和还款通道切分。在房屋净值贷款里，买方、用户和付款方通常是同一个家庭财务决策者；触发因素是相对昂贵无抵押债务的利率套利，或为装修、商业投资、其他人生事件获取更大额度资金。车辆净值贷款服务类似的借款逻辑，但票面更小，并且与需要流动性但不想卖车的自雇司机和微型企业主重叠更高。两个产品中，预算所有者本质上都是家庭或业主经营者资产负债表。

              工资代扣贷款引入更复杂的买方—用户—付款方三角。员工选择贷款，工资现金流负责偿还，但雇主和 eSocial 通道负责落地扣款；当工资信贷与工资预支或福利打包时，HR 还可能成为分销入口。CAIXA
              和政府材料展示了一条数字化采用路径：在 CTPS Digital 或银行 app 中发现产品，授权数据共享，24 小时内收到报价，通过 Dataprev/eSocial
              检查，然后进入工资扣款还款路径，并可选择可携带性。Creditas 自己的 app 和福利触点也强化了这一点：这是一个多产品借款旅程，而不是单笔孤立贷款交易。
