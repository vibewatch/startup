      - number: '1.4'
        title: 财务表现、运营规模和牵引力
        blocks:
          - type: paragraph
            body: >-
              Creditas 通过投资者关系门户和 VEF 投资者更新披露季度财务结果。Q1-26 公告（May 2026）显示，贷款组合为 R$7.6B（同比 +22.4%），由创纪录的 R$1.1B 放款额支撑（同比
              +29.2%）。年化收入为 R$2.5B，年化毛利润为 R$1.012B，隐含毛利率约 40%——正在靠近公司队列层面 40–45% 的目标。Q1-26 经营亏损收窄至
              R$34.9M，尽管放款规模显著更高，仍约为 Q1-22 水平的十分之一，显示公司正在释放经营杠杆。

              Creditas 自 2023 年末起以现金中性运营为目标，并将其强调为避免进一步股权融资的护栏。公司已发行 70 多个资本市场工具（FIDC、CRI 和 FII），Andbank
              银行牌照预计会进一步降低资金成本：公司可直接吸收存款，减少对证券化利差的依赖。Q1-26 每名员工年化生产率达到 R$1.4M，高于 6 个月前的 R$1.1M。

              尚未公开披露的关键指标包括准确员工数、客户数和净收入留存率。这个阶段的私营公司常有客户指标披露缺口，但它限制了与公开市场金融科技同行的比较。

              产品层面，房屋净值贷款最高 R$3M、期限最高 240 个月；车辆净值贷款最高 R$150K、期限最高 60 个月；工资代扣贷款面向私营部门员工（CLT 和 MEI）。Google Play 上的 app
              是主要消费者渠道。
