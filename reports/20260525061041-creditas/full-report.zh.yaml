  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与分发渠道
        blocks:
          - type: paragraph
            body: >-
              Creditas 通过不同触达渠道服务四类客户。核心 B2C 客群是持有不动产净值（房主）、车辆净值（车主，包括仍有车贷的车主）或正式雇佣合同（有资格做工资扣款贷款的 CLT 员工）的巴西个人消费者。Home
              Equity 借款人偏向中高收入巴西房主，寻求 R$50K–R$3M 的大额信贷，利率显著低于无抵押替代品。Auto Equity
              借款人更接近大众市场，因为贷款最低额较低（R$5K），且巴西车辆保有面广。Consignado 客群在 2025 年随 Crédito do Trabalhador 监管扩大后，除标准 CLT 员工外，也覆盖
              MEI、农村工人和家政工人，拓宽了可触达的正式劳动力市场。

              B2B 客群由采用 Creditas Benefícios 平台的雇主组成，用于向员工提供灵活福利、工资预支和金融教育。这些雇主通过直销动作入驻（HR 团队触达和员工推荐），实施周期为 30
              天。任何公开来源中都没有披露具名雇主客户。B2B2C 合作伙伴渠道使用接入 API 的 correspondente bancário 合作伙伴，由其代表终端借款人发起贷款；从 Q4 2025 Auto
              Equity 的扩张可以看出，该渠道是 Creditas 通过合作伙伴主导放款来降低 CAC 的核心。所有客群的分发都以数字化为先：网页试算、移动应用和 Portal do RH，没有线下网点网络。
