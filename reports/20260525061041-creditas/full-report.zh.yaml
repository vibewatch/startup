        - 截至 Series G（2025 年 12 月），7 轮累计 US$987mn
        - 高
        - 累计股权融资规模充足，但 Series G 较 Series F 估值下调 31%；稀释速度很重要
        - 确认股权结构表、优先股堆叠和清算分配顺序
      - - 最新轮次（Series G，2025 年 12 月）
        - US$108mn，估值 US$3.3bn；Andbank 领投；VEF 可转债转换为股权
