        - 确认 Series G 是否计划追加交割，以及条款
      - - 资本市场发行（DCM）
        - IR 首页显示，债券和证券化之间共有 70+ 只 FIDC、CRI、FII
        - 中
        - 现有贷款簿的主要持续资金来源；SELIC 敏感性是关键成本驱动
        - 获取现有证券化的加权平均资金成本和契约时间表
