      - number: '5.2'
        title: 技术架构和分销
        blocks:
          - type: paragraph
            body: >-
              Creditas 的架构足迹由监管结构塑造。公司以 BCB 第 CMN 4.935 号决议下的 Correspondente Bancário、4.656/5.050 号决议下的 Sociedade de
              Crédito Direto（SCD）运营；自 December 2025 起，又持有 Banco Andbank Brasil 的完整 banco múltiplo 牌照，并把 SCD 纳入 Andbank
              的审慎监管集团。Home Equity 贷款由 Oxy Companhia Hipotecária S.A.（CNPJ 18.282.093/0001-50）和 Creditas SCD（CNPJ
              32.997.490/0001-39）发起；汽车和 consignado 贷款也通过 Socinal S.A.（CNPJ 03.881.423/0001-56）运行。拿到银行牌照后，Andbank
              的机构和私人银行客户可以认购 Creditas 结构化的信贷基金，Creditas 的资金成本因此下降。

              分发渠道包括：(1) creditas.com 网页平台，用于直接面向消费者发起贷款；(2) Android
              移动应用（br.com.creditas.mobile），整合试算、文件提交、合同签署、福利余额和工资预支；(3) developers.creditas.com.br 上发布的合作伙伴 API，文档写明先
              staging、后 production 的两阶段接入流程；以及 (4) 面向雇主福利管理者的 Portal do RH。API 合作伙伴入驻时，技术联系人邮箱和 CNPJ
              必须与已签署的中介合同匹配；staging 通过验证后，production 凭证才会发放，且每个邮箱只发一次。合作伙伴以 correspondentes bancários 身份入驻，并接入 Academia
              Creditas 中枢，获取产品培训、网络研讨会和 24/7 支持。更深层的技术栈——云厂商、核心银行系统、数据库层、微服务拓扑——没有公开披露；研究窗口内也没有找到由 Creditas 作者身份可验证的
              GitHub 仓库或工程会议演讲，这是深层基础设施层面的开发者信号缺口。
