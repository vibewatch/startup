      - number: '4.4'
        title: 财务结论：收入质量正在改善，但承保阻塞点仍在
        blocks:
          - type: paragraph
            body: >-
              Creditas 的财务正面逻辑来自可观察的经营趋势。收入年增速超过 20%，贷款组合规模大且仍在加速增长。Q1-26 毛利率达到 40%，管理层称其验证了放款批次的盈利逻辑。放款增长的同时，经营亏损较
              Q1-22 缩小约 90%，获客成本也在下降。半年内，员工人均年化收入从 R$1.1mn 升至 R$1.4mn，AI
              项目缩短了产品开发周期。收购银行可能降低融资成本，但已披露的存款规模本身不能证明成本节省已兑现。


              反向信号仍需重视。集团尚在亏损：按公司披露口径，Q1-26 经营亏损为 R$34.9mn。另一组数据来自经审计财报，2025 年全年亏损为 R$558.219mn；两者均不应等同于烧钱规模。Reclame
              Aqui 将公司口碑评为「Regular」，得分 6.4/10；2025 年 11 月至 2026 年 4 月的六个月内，投诉接近 2,000 条，解决率仅 70.1%，评价者中愿意再次交易的比例为
              46.5%。低于平均的评分可能反映服务摩擦或产品不满，投诉主要涉及不当收费、误导性宣传及交易办理困难。这些信号不能证明金融资产损失质量存在问题，但客户体验风险可能拖累后续批次留存并推高 CAC。


              完整文件已消除「年度财报和历史资产负债表不可得」这一笼统缺口。附注 8 还披露按 IFRS 减值阶段划分的贷款原值、净值、预期信用损失变动及期限信息：2025 年 12 月 Creditas 第三阶段贷款原值为
              R$497.457mn，扣除减值后的净值为 R$93.281mn。它们是余额，不是分产品 NPL 比率；拿净额作分子、原值作分母会误导。尚待补齐的是分产品、分放款批次的逾期及损失曲线、Q1-26
              可用流动性和未来现金跑道、当前各融资工具契约清单，以及分产品财务调节。公开资产负债表足以计算历史会计杠杆，却不能替代当前流动性或监管资本分析。建议仍以这些具体缺口为条件，而不再建立在「经审计财报不可得」的错误判断上。
