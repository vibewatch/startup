        - 放弃入场，或按接近 US$2B 重新承销
      - - 毛利率压缩
        - 毛利率连续两个季度低于 35%
        - 说明 IFRS 收紧叠加资金成本压力，正在吞噬经营杠杆
        - 将目标入场估值下调至 US$2.0-2.5B，并下调投资逻辑评级
      - - 不利 NPL 披露
        - 首次有实质性的 NPL 披露显示，任何主要产品按未偿本金计算的 NPL 超过 5%
        - 推翻毛利修复背后的信贷质量假设
        - 投资逻辑立即破裂，大概率退出
      - - 消费者声誉恶化
        - Reclame Aqui 评分跌破 6.0，或愿意再次交易的比例跌破 40%
        - 抬高流失和 CAC 风险，削弱客户体验假设
