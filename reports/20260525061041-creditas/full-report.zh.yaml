      - number: '5.4'
        title: 监管、信任与合规
        blocks:
          - type: paragraph
            body: >-
              Creditas 处在多层监管框架之下。Transparency Center 发布了伦理准则（公司及第三方）、反腐政策、信息安全政策（金融科技实体和 SCD 实体分别发布）、AML/CFT 政策，以及
              PRSAC（环境 / 社会 / 气候责任政策）。公司发布 2023/1 至 2025/2 各期半年度 ombudsman（ouvidoria）报告，连续六期提供 BCB 要求的问责披露。Creditas 是
              ABCD（Associação Brasileira de Crédito Digital）成员，并遵守其自律准则。隐私政策确认遵循 LGPD。SCR（Sistema de Informações de
              Crédito）页面解释了受监管贷款机构如何按 BCB 报告义务与 Banco Central 共享信贷数据。

              反欺诈披露较具体：Creditas 表示不会通过 WhatsApp 或社交媒体私信谈判贷款，不会要求预付费用，并在 Facebook、Instagram 和 WhatsApp
              上维护带蓝勾的认证账号。官方支持电话也已公开。公司在 2020、2021 和 2022 年获得 Reclame Aqui 最佳在线贷款公司奖（汽车保险自称“4x 冠军”），但最近一个 Reclame Aqui
              周期（Nov 2025–Apr 2026）得分为 6.4/10、评级为「Regular」，显示投诉解决表现下滑。没有找到 ISO 27001、SOC 2 或 PCI DSS 认证证据；这是重要的安全缺口。
