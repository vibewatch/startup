      - number: '1.3'
        title: 融资历史、估值和投资者基础
        blocks:
          - type: paragraph
            body: >-
              截至 December 2025，Creditas 已完成 7 轮股权融资，合计 US$987M；这是其官方投资者关系页面强调的资本形成结果。Inter-American Development Bank 还在
              February 2021 提供 US$28.3M 常规债务融资，使外部资本总额略高于 US$1B。

              前 5 轮融资（大致为 Series A 至 D，其中 December 2020 的 Series E 融资 US$255M、估值约 US$1.75B）让 Creditas
              成为巴西主要金融科技公司。January 2022 的 Series F 是一个标志性事件：Fidelity Management and Research 领投 US$260M，估值 US$4.8B，QED
              Investors、VEF、SoftBank Vision Fund 1、SoftBank Latin America Fund、Kaszek
              Ventures、Lightrock、Headline、Wellington Management 和 Advent International 参投。Creditas
              将其称为上市前融资轮；据报道，投资者期待上市估值达到 US$10B。July 2022，Andbank 领投 US$50M 的 Series F 扩展轮，同时宣布初步协议，拟收购 Andbank Brasil
              的银行牌照。

              December 2025 的 Series G 融资 US$108M、估值 US$3.3B，较 Series F 峰值 US$4.8B 大幅下调，跌幅 31%。该轮由 Andbank Group
              领投（Creditas 官方公告称这家欧洲机构管理资产超过 US$60B，但 Valor Econômico 引用为 US$30B），交易结构与 Andbank Brasil 收购最终交割同步。Creditas
              最大的披露投资者 VEF 将未偿可转债按 US$3.3B 估值转换为股权，并称该交易对其 NAV 有 8.2% 的正面影响（意味着 VEF 在 G 轮前的账面持有价值低于 US$3.3B）。Furio
              公开承认这是估值下调轮，并表示「估值反映了今天的倍数和公司的良好增长」。
