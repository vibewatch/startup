      - number: '4.3'
        title: 资金组合和资本充足性：股权 + 70 多次资本市场发行 + 银行牌照
        blocks:
          - type: paragraph
            body: >-
              Creditas 的资本结构有三层。第一层是股权：2013 年至 December 2025 的 Series G 共 7 轮融资，募资 US$987mn，最后一轮估值
              US$3.3bn。第二层是债务资本市场：70 多次证券化发行，形式包括 FIDC（应收账款投资基金）、CRI（房地产应收账款证书）和 FII（房地产投资基金），外加债券。Creditas
              的投资者关系网站将债券和证券化列为单独债务资本市场类别，并运营公开 DCM 投资者关系页面，投资者可订阅更新。第三层是来自 Andbank 的机构资金：December 2025 收购的银行牌照允许
              Creditas 吸收存款并发行 CDB（银行存单），相较完全市场化来源的证券化，这应会降低平均资金成本。


              SELIC 敏感性在结构上很重要。证券化资金按 CDI 定价（CDI 跟踪 SELIC），因此持续高 SELIC——巴西央行在 September 2025
              及此前会议上上调政策利率，并预计其将保持高位——会直接压缩现有资产池的净息差，并提高新发行成本。BCB September 2025 Monetary Policy Report 预计 2025
              年名义系统信贷增长 8.8%、2026 年增长 8.0%，远低于 Creditas 20-22%+ 的贷款组合增速，反映限制性宏观背景。Creditas 称自 2023
              年末以来一直以现金中性运营为目标，也就是说，公司主要通过 DCM 发行和内部生成现金为贷款账簿融资，而不是烧股权资本维持运营。


              公开证据未披露：当前现金和流动资产、现金口径月度经营烧钱、剩余现金跑道、资产负债表总资产、单个证券化契约细节，或收购后 Andbank 存款规模。经审计的 2025
              年合并财务报表已经提交，但缓存内容中可公开访问的 PDF 部分仅限于管理层业务回顾，没有可见的完整资产负债表或利润表。
