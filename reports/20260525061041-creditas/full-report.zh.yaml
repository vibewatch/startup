      - - 报表经营现金流与公司烧钱速度
        - 2025 年经营活动现金净流出 R$548.224mn；每月公司烧钱速度尚未确认
        - 中
        - 年度合并现金流包括贷款和融资变动，不能等同于经营亏损或每月烧钱速度
        - 将管理层现金中性约束与报表现金流调节一致，并取得月度公司现金预测
      - - 收购银行带来的存款
