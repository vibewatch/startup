      - number: '4.4'
        title: 财务结论：收入质量正在改善，但承保阻塞点仍在
        blocks:
          - type: paragraph
            body: >-
              Creditas 的正面财务案例建立在可观察的运营轨迹上。收入在大且加速的贷款账簿上保持 20% 以上年增速。Q1-26 毛利率达到 40%，管理层称这验证了队列层面逻辑。经营亏损快速收窄——在更高放款规模下，较
              Q1-22 水平下降约 90%。客户获取成本下降，同时放款规模扩大。每名员工年化收入在 6 个月内从 R$1.1mn 升至 R$1.4mn，AI 项目正在压缩产品开发周期。银行牌照收购带来结构性资金成本优势。


              反向信号削弱了这一观点。集团层面公司仍亏损——Q1-26 按公司自己的经营亏损定义仍为 R$34.9mn，而这一定义很可能排除部分现金项目。Reclame Aqui
              的消费者投诉数据显示，公司声誉评分为「Regular」（6.4/10），6 个月窗口内（November 2025 至 April 2026）有近 2,000 起投诉，只有 70.1% 已解决，46.5%
              的评价者愿意再次交易——这是低于平均水平的分数，可能指向客户服务摩擦或产品不满。主要投诉类别包括不当收费、误导性广告和交易完成困难。这些信号不能证明财务损失质量有问题，但会提出客户体验问题，未来队列的留存和
              CAC 可能承压。


              关键承保阻塞点是数据缺口：按产品划分的 NPL 率、vintage
              损失曲线、现金和流动性状况、证券化契约余量、资产负债表杠杆率，以及经审计的多年利润表。在这些信息可得前，财务结论可以方向性正面，但不能达到投资者完整度。
