  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合和抵押机制
        blocks:
          - type: paragraph
            body: >-
              Creditas 围绕三类抵押品——房地产、车辆和工资——组织金融产品，并叠加保险经纪、多银行融资市场和企业福利平台。房屋净值贷款（Empréstimo com Garantia de Imóvel）额度
              R$50K–R$3M，利率从 1.09%/month + IPCA 起，期限最高 240 个月，面向在整个贷款期内继续持有房屋的业主。即便房产仍有未偿按揭，只要已支付价值至少
              50%，也可用作抵押。车辆净值贷款（Empréstimo com Garantia de Veículo）覆盖 R$5K–R$150K，利率从 1.49%/month 起，期限最高 60
              个月；融资车辆可作为抵押，并继续日常使用。两个产品都借助抵押品，将利率显著压到 creditas.com 产品页面发布的个人贷款（6.47%/month）和信用卡循环（14.06%/month）基准之下。

              工资代扣贷款（Consignado Privado）面向 CLT 员工，通过 eSocial 和 Carteira de Trabalho Digital 做工资扣款，额度 R$300–R$70K，利率从
              1.49%/month 起，期限最高 60 个月。January 2025，巴西私营部门 consignado 监管扩张（Crédito do Trabalhador），把 Creditas 的可服务人群扩大到
              MEI、农村工人和家政工人。汽车保险以线上经纪（corretora）方式运营，聚合最多 16 家承保合作方，供用户比价和投保，Creditas 不承担承保风险。车辆和按揭融资补齐了市场：车辆融资最多接入 5
              家银行，multibanco 按揭模拟最多接入 8 家银行。Creditas Benefícios 在消费者平台之上叠加 B2B 雇主栈：零成本、7 类别 Mastercard 福利卡，可在 2+ million
              个地点使用；零成本工资预支（最高为月薪 40%）；以及由 IBOPE Inteligência 研究支持的企业金融教育项目。
