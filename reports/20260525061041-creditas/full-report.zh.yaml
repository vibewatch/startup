        - 融资成本改善的乐观逻辑被拖延数年，估值底部走弱
        - 将基准情景估值下修至 US$2.5B
    notes: 每个触发点都设计成外部可监测，并且绑定清晰的估值立场变化，而不是泛泛的风险表述。
