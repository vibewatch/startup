      - - Creditas 薪资代扣贷
        - App 内 1.49%/month 起；R$1k–R$70k；最长 60 个月
        - 同一 App 和雇主生态内的薪资代扣贷款
        - 雇主覆盖、可携带性结果和实际 APR 未公开
        - 宽度有用，但该品类挤满银行和 fintech
      - - Nubank 薪资贷 + FGTS + 个人贷款
        - 官方产品线覆盖个人贷款、薪资代扣贷和最多 5 期的 FGTS 预支
        - App 原生的无抵押和工资关联替代方案
