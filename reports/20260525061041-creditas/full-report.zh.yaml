  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式：增长中的有抵押贷款组合贡献利息收入，但受 SELIC 和 IFRS 拨备压缩
        blocks:
          - type: paragraph
            body: >-
              Creditas 披露的是利息收入及手续费、佣金收入，不能简单视为净利息收入。2025 年经审计合并利润表列示利息收入 R$1,928.615mn、手续费及佣金收入 R$263.524mn，合计
              R$2,192.139mn；利息支出和预期信用损失计提另行扣除。三项核心产品是 Home Equity（empréstimo com garantia de imóvel）、Auto
              Equity（empréstimo com garantia de veículo）和 e-Consignado（私营企业工资代扣贷款）。其他收入来源包括 Creditas Seguros
              汽车保险业务、车辆融资及面向雇主的员工福利产品。公司还经营巴西 Banco Central 持牌的直接信贷公司（SCD），可在自身资产负债表内发放贷款；2025 年收购 Andbank Brasil
              后，合并范围新增银行存款及私人银行贷款组合。


              收入确认遵循 IFRS。2026 年，公司收紧停止计息标准：Home Equity 贷款逾期超过 180 天即停止计息，此前为 730 天；其他产品逾期超过 90 天停止计息，此前为 365 天。公司追溯调整了
              2025 年各期数据，并披露非现金调整使 2025 年全年收入减少 6.4%、毛利润减少
              1.7%。此类停息资产后续收到的款项，在到账时确认为回收收入。该调整不改变单位经济效益或当期现金创造，但会影响收入趋势的解读，不能将调整后的 2025 年数据与旧版披露直接比较。


              贷款组合规模是最具质量的收入驱动因素。Q4-25 和 Q1-26 单季放款均达到 R$1.1bn，同比增幅超过 29–35%。截至 2026 年 3 月，累计贷款组合为 R$7.6bn，同比增长
              22.4%。Q1-26 单季收入 R$633mn 对应超过 R$2.5bn 的年化收入运行率，公司 IR
              首页也披露了这一量级。资产收益率重新定价与融资成本应分开分析：证券化负债利率上升首先增加费用，本身不能证明贷款收入提高。


              完整公开文件包含 Creditas Financial Solutions LTD 的 2025 年 IFRS 合并财报及 2024 年对比数据。KPMG 的审计报告日期为 2026 年 3 月 26
              日，并明确不对管理层报告发表鉴证结论。TI006 选取利润表、资产负债表和现金流量表中的报表数据，将原始单位千雷亚尔除以 1,000，换算为百万雷亚尔。文件还提供管理层口径与财务报表口径的调节表：2025
              年管理层调整后毛利润为 R$821.419mn，调节后报表毛利润为 R$747.265mn。调节表可帮助理解差异，但不能据此将审计意见扩大到调整后指标。2024 年对比列也不代表本次已另行审阅 2024
              年审计意见。
