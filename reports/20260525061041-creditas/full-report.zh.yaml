      - number: '5.2'
        title: 技术架构和分销
        blocks:
          - type: paragraph
            body: >-
              Creditas 的技术架构受监管结构约束。公司按 BCB 第 CMN 4.935 号决议以 Correspondente Bancário 身份经营，并按 4.656/5.050 号决议经营 Sociedade
              de Crédito Direto（SCD）；集团还持有具备完整 banco múltiplo 牌照的 Banco Andbank Brasil。经审计文件将银行收购日期列为 2025 年 11 月 28
              日，早于 2025 年 12 月 1 日公告。公开描述将 SCD 列为 Andbank 审慎监管集团的一部分，但不能假定收购日期也是单独核实过的审慎监管整合生效日。Home Equity 贷款由 Oxy
              Companhia Hipotecária S.A.（CNPJ 18.282.093/0001-50）及 Creditas SCD（CNPJ 32.997.490/0001-39）发起；汽车和
              consignado 贷款也经 Socinal S.A.（CNPJ 03.881.423/0001-56）开展。收购旨在拓宽融资渠道，包括 Andbank 的机构及私人银行分销网络。银行与 APW（Andbank
              Wealth）不是同一项权益：Creditas 于 2025 年 11 月 28 日取得后者非控股 25% 权益。持股和分销渠道本身，不能量化已兑现的成本节省或贷款平台可自由支配的融资。

              分销渠道包括四类：一是 creditas.com 网页平台，直接面向消费者放贷；二是 Android
              移动应用（br.com.creditas.mobile），整合试算、文件提交、合同签署、福利余额及工资预支；三是 developers.creditas.com.br 上的合作伙伴
              API，文档规定先测试环境、后生产环境的两阶段接入；四是面向雇主福利管理者的 Portal do RH。API 合作伙伴入驻时，技术联系人邮箱及 CNPJ
              必须与已签中介合同一致；测试环境通过验证后，才发放生产环境凭证，每个邮箱仅发一次。合作伙伴以 correspondentes bancários 身份入驻，并可访问 Academia
              Creditas，获取产品培训、网络研讨会及 24/7 支持。云厂商、核心银行系统、数据库层及微服务拓扑等底层技术栈未公开披露；研究窗口内也未找到署名可核实为 Creditas 的 GitHub
              仓库或工程会议演讲，深层基础设施仍缺开发者侧证据。
