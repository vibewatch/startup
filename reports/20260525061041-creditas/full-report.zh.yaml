  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资轮背景、估值重置与战略定价支撑的局限
        blocks:
          - type: paragraph
            body: >-
              Creditas 估值首先要看清从 2022 年 1 月 Series F 峰值到 2025 年 12 月 Series G 的重置。Series F 融资 US$260 million，估值 US$4.8
              billion，Fidelity 和 SoftBank 参与投资。当时全球资本环境宽松得多，巴西 SELIC 利率显著更低，成长股权投资也更看重收入扩张，而非盈利。Series G 则融资 US$108
              million，投后估值 US$3.3 billion，较 2022 年峰值下调 31.25%。相较 2022 年，这是一轮估值下调融资，但仅凭价格不能判断它是否属于困境融资。2025 年 12 月 1
              日的公告同时披露了 Series G 首次交割和 Banco Andbank Brasil 收购；审计财报将银行交割日列为 2025 年 11 月 28 日。Creditas 收购了一家持牌银行，Andbank
              Group 则成为投资者和战略合作伙伴。公告没有另行给出融资的确切法律交割日期。


              这一交易结构很重要。Series G 领投方不是被动的后期跨界基金，而是了解业务的交易对手，既对 Creditas 贷款平台做了尽调，也审查了即将并入集团的银行资产。VEF 公告披露，在将票据转为股份的同时，其对
              Creditas 的估值较 Q3-25 上调 17.8%，对 VEF 的 Q3-25 NAV 带来 8.2% 的正面影响。公告另行列示本轮估值为 US$3.3 billion，但没有披露此前的公司整体估值为
              US$2.79 billion。在核对票据转股和持股变化之前，不能把持仓价值的变化机械地等同于公司股权总价值的变化。VEF 是现有股东，其公告及转载版本并不构成独立的价格发现。


              不过，新价格并不自动等于好买点。Creditas 七轮累计融资约 US$987
              million，普通股之上已有规模可观的优先资本。公开证据未披露历史各轮的参与权、优先级细节或清算优先权。投资者能看到最新价格，却无法充分判断：若退出表现平平，这个价格究竟能为普通股带来多少回报。本轮提供了可观察的战略交易价格，但不保证估值底部，也不能仅凭价格就证明风险调整后的入场回报足够有吸引力。
