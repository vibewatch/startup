  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 单位 / 定价
      - 当前状态（Q1-26）
      - 收入质量
      - 尽调要求
    rows:
      - - 房产抵押贷款（empréstimo com garantia de imóvel）
        - 以住宅 / 商业地产作抵押的贷款利息收入
        - 浮动利率，锚定 IPCA 或 CDI；典型 APR 明显低于无抵押贷款
        - 纳入 R$7.6bn 总组合；支撑 R$633mn 季度收入；Q1-26 放款量创历史新高
        - 高——组合内违约风险最低；期限长；IPCA 指数化对冲通胀，稳定收入
        - 披露产品级 NPL、平均 LTV，以及按房产类型拆分的发起集中度
      - - 汽车抵押贷款（empréstimo com garantia de veículo）
        - 以汽车或摩托车作抵押的贷款利息收入
        - 浮动利率；证券化资金锚定 CDI，对 SELIC 更敏感
        - 快速扩张；Q1-26 发起量创历史新高；新信用评分模型在 Q1-26 通过验证
        - 中高——期限短于房产抵押；抵押品会折旧；管理层强调信用模型已改善
        - 披露汽车贷款 NPL 趋势、损失严重度和抵押覆盖率
      - - e-Consignado（私营部门工资代扣贷款）
        - 与工资挂钩的贷款利息收入，由雇主从工资中扣还款
        - 固定利率；源头扣款降低信用风险
        - 谨慎增长；Creditas 称该垂直正在让单位经济性回归正常；Q1-26 恢复节奏
        - 中——巴西工资代扣贷款规则带来监管风险；若雇主基础较窄，会形成集中度风险
        - 披露雇主集中度、违约率，以及私营 consignado 规则变化下的监管暴露
      - - 保险经纪（Creditas Seguros）
        - 保险中介及分销佣金，不能假定为赚取保费的承保业务
        - 服务完成时确认佣金；客户支付的保单保费不一定属于 Creditas 收入
        - 经营中的数字保险经纪业务；文件披露保险分销及佣金确认政策
        - 具备交叉销售潜力，但所审阅披露尚不能确认独立佣金业务的经济效益及承保风险敞口
        - 披露经纪佣金收入、保险公司合作安排、获客成本及留存；不能假定存在再保险结构或套用保险公司赔付率
      - - 员工福利与工资预支（Creditas Benefícios）
        - 来自雇主的费用 / 订阅收入；工资预支产生的收入
        - 按员工或雇主计费，类似 SaaS；工资提前支付产生预支收入
        - 活跃；通过 B2B 渠道面向企业销售；与 e-Consignado 有协同
        - 中——B2B 收入可重复，但规模和利润率未披露
        - 披露雇主客户数、ARR，以及相对消费贷款的收入结构
    notes: >-
      收入类别均来自公司披露的产品线。定价结构据官方产品页面（creditas.com）整理，季度收入及贷款组合数据来自 Q1-26 和 Q4-25 业绩公告。公司未公开披露分产品收入占比。经审计文件附注 1 和 3
      描述保险经纪业务及佣金确认方式，不支持将 Creditas Seguros 视为保留保单保费的承保公司。
