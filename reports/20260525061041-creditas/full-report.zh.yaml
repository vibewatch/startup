      - number: '8.3'
        title: 情景分析与建议纪律
        blocks:
          - type: paragraph
            body: >-
              估值争论最好放进三种情景，而不是压成一个点估计。乐观情景下，Creditas 到 Q3-26 达到运营盈亏平衡，Andbank 银行牌照到 late 2026 转化为有意义的存款或 CDB 资金，SELIC
              在下半年开始降至 13% 以下。在这组条件下，毛利率可保持在接近 40%，收入增速高于巴西整体信贷系统，2027-28 年 US$5.5-7.0 billion 退出变得可以想象。以 US$3.3 billion
              入场可产生扎实上行，但仍依赖几件公开证据尚未确认的事：NPL 稳定、存款爬坡时点，以及持久盈亏平衡。


              基准情景更保守，也更可信。亏损在 2026 年收窄但不消失，存款收益只会逐步到来，公开市场或私募买方把 Creditas 视为一家规模化、但尚未完全去风险的贷款机构。这指向五年维度 US$3.5-4.5
              billion 的退出区间，从当前标记看吸引力只是温和。悲观情景也不难想象。如果 SELIC 到 2027 年仍接近当前水平，如果第一次有意义的 NPL
              披露令人失望，或客户服务问题恶化，估值可能在重组或压力融资情景中重置到 US$2.0-2.5 billion 或更低。


              这些分支指向观察 / 有条件观察，而不是买入。公司规模足够、战略融资可选性足够，近期运营改善也足以支持继续尽调。但正确纪律必须对价格敏感：约 US$2.5-3.0 billion 的优先入场区间，能更好补偿
              NPL 不透明、优先股堆叠不确定性和宏观逆风。只有当 Q2-26 确认运营亏损继续改善，且管理层披露足够信贷质量数据以证明近期利润率恢复没有掩盖未来拨备痛点时，支付完整 US$3.3 billion Series
              G 标记才说得通。
