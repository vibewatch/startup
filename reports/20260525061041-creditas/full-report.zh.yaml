      - - 产品
        - 银行牌照叠加既有 FIDC 和 CRI 基础设施，可能带来相对纯金融科技贷款方的结构性资金成本优势。
        - 牌照红利可能需要 12-24 个月才能落地；存款产品推出计划仍未披露。
        - 牌照激活后 12 个月内可见的 CDB 或存款规模
      - - 财务
        - 毛利率回升至 40%，Q1-26 经营亏损大幅收窄，说明经营杠杆开始发挥作用。
        - 如果 IFRS 保守性和隐藏 NPL 压力重新出现，Q1-26 利润率可能只是暂时反弹。
        - 首次 NPL 披露，加上两个季度利润率趋势
      - - 竞争
        - Nubank 证明投资人仍愿意押注拉美数字金融；Creditas 则靠抵押信贷保持差异化。
        - Nubank 和传统银行仍享有资金成本和信任优势，可能挤压 Creditas 的 CAC 和定价权。
        - 有抵押信贷份额提升，或客户服务指标优于对手
      - - 估值
        - Andbank 按 US$3.3B 本轮估值投资；VEF 披露，其对 Creditas 的估值较 Q3-25 上调 17.8%，对 NAV 带来 8.2% 的正面影响。
        - US$3.3B 仍比 2022 年峰值低 31%，此前第三方标记也显示外部价格发现有限。
        - 第三方老股交易，或非战略投资人的下一轮定价
    notes: >-
      每行把主要支撑估值的正向论点，与最可能证伪或强化该论点的证据配对。 BCB 信贷增速数字来自 2025 年 9 月对贷款余额名义增长的预测，不是收入增速，也不是已核实的 2026
