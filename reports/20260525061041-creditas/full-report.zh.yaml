      - number: '7.6'
        title: 估值与再融资风险：31 % 估值下调融资、IPO 延后和投资者回报压力
        blocks:
          - type: paragraph
            body: >-
              Creditas 从 Series F 的 US$4.8 billion 估值（January 2022）降至 Series G 的 US$3.3 billion 估值（December
              2025），意味着近四年名义估值折损 31 %。VEF 披露，其在这轮融资中将可转债转为股份，并将对 Creditas 的估值较 Q3-25 上调 17.8 %，并非减记；对 VEF 的 Q3-25 NAV
              带来的正面影响为 8.2%。因此，本轮公司估值可以低于 Creditas 的 2022 年估值，同时高于某位现有股东较近期的投资账面估值，两项比较的基准不同。七轮累计股权融资为 US$987
              million，最后一轮仅 US$108 million，小于此前三轮中的任一轮。2022 年，巴西媒体曾报道市场预期 IPO 估值为 US$10 billion；截至运行日，没有 IPO
              流程被公告或确认。多重风险因素叠加：(1) 公司尚未证明运营盈利，而这通常是多数 LatAm 公开市场上市的前提；(2) Andbank 收购引入更复杂的合并主体，需要额外审计师审阅和财务披露准备；(3)
              2022 年后全球金融科技公开市场倍数大幅压缩，尚未完全恢复；(4) 巴西资本市场对 SELIC 敏感，SELIC
              直接影响上市金融股倍数。估值下调融资也暗示员工期权池价值可能承压，进而带来人才留存风险。Creditas 已表示目标是在“近期”重回运营盈亏平衡，1Q26 显示显著改善（运营亏损从 R$80.9 mn 环比收窄至
              R$34.9 mn），但当前表现与 IPO 准备就绪之间仍有实质差距。若盈利前还需进一步估值下调融资 或桥接资本，将显著增加投资者情绪和稀释风险。
