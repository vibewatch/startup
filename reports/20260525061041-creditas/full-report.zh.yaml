      - number: '7.3'
        title: 监管与合规风险：SCD / correspondente bancário 框架、银行收购和 LGPD 义务
        blocks:
          - type: paragraph
            body: >-
              Creditas 同时涉及三类监管框架，各有监督义务。第一，Sociedade de Crédito Direto（SCD）受 Resolução CMN 4.656 约束，须遵守 Banco Central
              对持牌非银金融机构的完整审慎及行为要求，包括最低资本、运营风险、AML/CFT 和定期 SCR 报送。第二，Correspondente Bancário 须遵守 Resolução CMN
              4.935，涉及贷款发起、信息披露及所代理银行的监督。第三，BCB 于 2025 年 11 月批准 Andbank 巴西实体重组（包括 DTVM 分拆）后，经审计文件记载，Creditas 于 2025 年 11
              月 28 日完成 Banco Andbank Brasil 收购；2025 年 12 月 1 日是正式公告日，而非法律交割日。收购为集团增加了完整银行牌照，也带来更严格的审慎资本、流动性及治理要求。从最初的
              2022 年公告到完成，交易历时约三年，但不能据此认定 BCB 独自审查了整段时间。今后涉及新增牌照、受监管产品或国际扩张的结构变化也可能耗时较长，不能用本次交易推定具体期限。Creditas 以最后更新于
              2025 年 3 月的第 3 版隐私政策、独立伦理渠道，以及截至 2025 年下半年的半年度 ouvidoria（申诉专员）报告应对 LGPD
              义务。公开网络安全材料包括两份独立信息安全政策，分别面向金融科技实体和 SCD，另有 AML/CFT 政策（PLDFT）。不过，研究资料中未找到公开 SOC 2、ISO 27001
              或同等第三方认证，也未找到数据泄露或重大事件披露。机构投资者及企业客户评估 Creditas 的 B2B 平台和 API 时，独立安全认证的证据缺口仍属重要问题。若无法维持 BCB
              合规、银行子公司违反资本充足率要求，或遭遇执法行动，业务可能暂停，投资逻辑也会立即受损。
