      - number: '5.3'
        title: AI、自动化与路线图
        blocks:
          - type: paragraph
            body: >-
              Q3 2025、Q4 2025 和 Q1 2026 业绩稿显示，Creditas 正在加速 AI 优先投入，且已经落到可见运营结果。Q4 2025，公司称持续漏斗自动化使 CAC 同比下降 0.9%、环比下降
              6.1%，同时放款额同比增长 +35.4%；这说明营销效率在结构性改善，而不只是每笔贷款砸更多钱。Q1 2026，公司披露两项具体 AI 部署：(1) AI agents
              端到端处理早期催收体验，目标把解决时间从数小时或数天压到分钟级；(2) 软件开发中的 AI 主导的 pull requests 把产品发布周期从三周压缩到四天。员工生产率（按员工数折算的年化收入）在截至 Q1
              2026 的六个月里从 R$1.1M 升至 R$1.4M（+27%），公司称部分来自这些 AI 驱动收益。Q4 2025 部署的更成熟 Auto Equity
              信用评分模型，使公司能够在“保住资产质量的同时推动激进的合作伙伴主导增长”——这是公开材料中对自研 ML 模型最具体的引用。

              新任 CTO/COO Ricardo Forcano（前 BBVA CIO/CHRO，December 2025 上任）负责推进这些项目；他此前在一家欧洲银行有大规模技术现代化经验。Q1 2026 展望称
              Creditas“正越来越演进为 AI 优先平台，把自动化嵌入运营每一层”，覆盖获客、信贷管理和后台。2026 年全年放款增长目标为 25%+，并以 2026
              年底运营盈亏平衡为目标。公开材料中没有找到路线图日期、产品更新日志或开发者发布说明；这是重要的路线图证据缺口。
