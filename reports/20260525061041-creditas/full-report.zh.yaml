      - number: '2.5'
        title: 矛盾、规模缺口和证据边界
        blocks:
          - type: paragraph
            body: >-
              主要分析矛盾不是来源在某个精确数字上互相打架，而是它们用不同单位描述市场。Banco Central 讨论系统增长和业务品类表现；ABECIP 报告房地产放款流量；政府和 CAIXA
              材料描述合同工资潜力和担保机制；Mordor 用 USD 报告更宽的汽车贷款市场。这些镜头没有错，但不能直接相加。因此，任何 TAM、SAM 或 SOM
              数字都嵌入判断：重叠如何处理、谁具备资格、应以存量、流量还是合同金额代理作为分母。

              公开证据在产品条款、漏斗顶部需求信号和 Creditas
              自己已观察到的规模上最强。证据在巴西房屋净值和车辆净值子板块的准确未偿余额、各产品的批准率和接受率，以及新劳动者信贷推出后有多少会流向金融科技机构发起的资产负债表而非既有银行方面更弱。尽调和估值应得出的正确结论不是虚假的精确度，而是有边界的机会：市场显然大到值得关注，利率下降和工资通道数字化后显然更有利，但仍过于不透明，无法支持单点市场份额主张。
