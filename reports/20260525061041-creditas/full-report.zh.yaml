      - number: '1.2'
        title: 领导团队、创始人画像和关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Sergio Furio 是唯一公开披露的创始人，并担任 CEO。他的履历横跨西班牙、美国和巴西的私募股权、投资银行和金融服务创业。Furio 的产品直觉和资本市场关系是 Creditas
              故事的核心；公开材料中没有联合创始人或第二位高管被塑造成 Furio 的替代人选，投资者面对的是典型关键人物风险。

              December 2025，Creditas 任命 Ricardo Forcano 为首席技术与运营官（CTO/COO），负责技术、运营和人事，补强了领导层。Forcano 有 20
              多年经验，最突出的是曾在西班牙的 BBVA 担任 CIO 和 CHRO——BBVA 是欧洲最大银行之一——并主导技术现代化、文化转型和拉美扩张。Furio 将 Forcano 的加入定义为让 Creditas
              变成「AI 原生」的任务；Forcano 也公开表示，公司正在部署 AI 智能体，用于端到端催收和获客自动化。

              Shirlei Silva 担任投资者关系总监，这一角色出现在公开新闻稿和投资者关系沟通中。除 Furio、Forcano 和 Silva
              之外，完整领导团队构成、董事会成员、投资者观察员权利和正式治理结构，都没有在公开材料中记录——这是一个尽调缺口。
