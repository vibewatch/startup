  - id: TM001
    title: 市场定义表
    columns:
      - 层级 / 模式
      - 本章纳入
      - 明确排除
      - 买方 / 用户 / 付款方
      - 与 Creditas 的相关性
    rows:
      - - 房屋净值贷款
        - 以住宅物业作抵押的贷款，包括以已拥有或大部分还清住房为抵押的再融资式借款
        - 企业房地产贷款；广义按揭贷款市场
        - 通常同一家庭决策者兼具各角色
        - Creditas 核心产品，也是利率最低的消费端产品
      - - 车辆净值贷款
        - 以自有或贷款车辆作抵押、借款人保留用车权的贷款
        - 经销商库存融资、车队融资、通用商业汽车租赁
        - 通常为同一家庭或 MEI 司机
        - Creditas 核心产品和关键流动性桥梁
      - - 民营部门薪资扣款贷款
        - 面向 CLT 员工的工资扣款贷款，包括与 eSocial 关联的工人信贷
        - 公共部门 consignado 和仅面向 INSS 养老金领取者的贷款
        - 员工选择；工资还款；雇主 / eSocial 执行扣款
        - Creditas 核心薪资贷款通道，也是 2025-26 主要扩张向量
      - - 与 FGTS 关联的员工担保
        - 将 FGTS 余额和遣散罚款作为工人信贷的信用增级
        - 不绑定贷款的独立 FGTS 提款
        - 员工是用户；担保近似抵押品
        - 薪资信贷的重要减损和采用通道
      - - 多银行住房金融邻近业务
        - 由经纪撮合的房产融资和再融资流程，来源是同一批有住房需求的借款人
        - 纯开发商融资或企业项目贷款
        - 家庭买方与银行承销方
        - 获客和交叉销售邻近业务，不等于全部 TAM
      - - 多银行车辆金融邻近业务
        - 由经纪撮合的汽车金融流程，协助借款人在多家贷款方之间比较
        - 商业车队或 OEM 批发融资
        - 购车者付款；经纪方和银行共享流程
        - 有助于为有抵押汽车产品导流
      - - 无抵押替代品
        - 个人贷款和循环信用卡余额仅作对照基准
        - 所有无抵押消费贷款均不纳入核心边界
        - 同一类家庭借款人，但没有硬抵押
        - 排除在 TAM 外，但对利率套利叙事关键
    notes: 边界落在 SFN 内的家庭信贷。纳入项是有抵押或薪资挂钩借款旅程；排除项是替代品类或邻近银行市场。
