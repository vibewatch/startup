        - 索取月度管理账和董事会批准的预算
      - - 优先股堆叠和股权结构表
        - 各轮融资的参与权、清算瀑布、转换比例和反稀释条款
        - 普通股的退出结果很大程度取决于偿付顺位和优先权包袱
        - 索取法律版股权结构表和股东协议条款摘要
      - - 银行牌照存款路线图
        - BCB 启用状态、产品上线日期、前 12 个月存款量目标
        - 愿意用高于困境倍数价格买入的核心战略理由，是未来融资成本改善
        - 索取管理层路线图及 BCB 流程支持文件
    notes: 这些追问按影响排序：它们越直接改变下行情景承销和当前估值标记的可信度，优先级越高。
    claimRefs:
      - CV017
      - CV033
      - CV034
      - CV040
