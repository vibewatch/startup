  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 宏观与 SELIC 风险：高利率结构性挤压证券化融资利润率
        blocks:
          - type: paragraph
            body: >-
              Creditas 的商业模式对巴西政策利率异常敏感，因为几乎所有资金都来自资本市场结构——FIDCs、CRIs 和 FIIs——而不是银行存款。截至 Q1 2026，IR 页面列出 70+
              笔资本市场发行，作为主要融资工具；每一个新融资分层都按 CDI/SELIC 定价。SELIC 上升时，这些融资分层 的成本同步上升，而现有贷款组合重定价更慢，净息差因此被压缩。Banco Central do
              Brasil 的 September 2025 Monetary Policy Report（Relatório de Política Monetária）记录了这条传导：在限制性货币周期压制 SFN
              新发放后，信贷系统名义增速从 July 2025 的 10.7 % YoY 放缓到 2026 年预计 8.0 %。March 2025 BCB 报告已将 2025 年信贷增长预期从 9.6 % 下调至 7.7
              %，理由包括更久维持高利率、家庭过度负债和信贷供给收紧。Creditas 自身财务数据也确认了这条传导。Q3 2025 毛利同比下降 7.4 %——即便收入同比增长 14.4 %——明确原因是证券化融资中的
              SELIC 固化推高了存量结构成本。Q4 2025 毛利率为 36.2 %，低于公司所称 40–45 % 队列层面目标，公司再次归因于“持续高 SELIC 环境”。Q1 2026 利润率恢复到正好 40.0
              %，但管理层自己警告 SELIC 正在“更久维持高位”，BCB Focus survey 也强化这一判断。因此剩余风险不在 SELIC
              进一步飙升，而在它维持高位的时间足够长，使公司无法积累达到运营盈亏平衡所需的现金储备。Creditas 自 end-2023
              起确实运行现金中性护栏，降低了急性流动性风险；但这也意味着资金成本每增加一个基点，都会直接拖慢盈利路径。
