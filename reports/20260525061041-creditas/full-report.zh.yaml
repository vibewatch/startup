      - number: '7.2'
        title: 信贷表现与拨备风险：IFRS 方法调整、前置拨备和不透明的 NPL 数据
        blocks:
          - type: paragraph
            body: >-
              Creditas 持有抵押贷款组合，底层资产——房屋和车辆——在违约时提供可回收价值；但公开信贷质量证据存在重大披露缺口：没有发布产品级 NPL
              或违约率时间序列。投资者只能依赖管理层评论和间接信号。本次研究期最重要的信号，是 Q4 2025 业绩（February 2026）披露的一项追溯 IFRS 方法调整：Creditas 现在对 Home
              Equity 在逾期 180 天时停止计息（此前为 730 天），对所有其他产品在逾期 90 天时停止计息（此前为 365 天）。这种更保守处理对 2025 年收入产生减少 6.4 %
              的非现金影响，对毛利产生减少 1.7 % 的影响；Creditas 为保持可比性，将调整追溯适用于 2025 年所有期间。管理层把该调整定义为自愿提高 IFRS 严谨度。反向解读是，过去计息窗口异常宽松——对逾期
              365–730 天贷款仍确认利息——这次调整修正了恶化资产上净利息收入可能被高估的问题。第二个信贷风险驱动因素是前置 IFRS
              拨备：会计规则要求在发起时按预期损失确认拨备，因此即便队列层面信贷质量仍健康，快速组合增长也会机械压低报告毛利。管理层称 40–45 %
              的队列层面盈利能力在所有年份批次中延续，但公开来源没有找到审计师审阅的队列表，也没有独立第三方信贷意见。公司运营层面仍亏损：Q4 2025 运营亏损为 R$80.9 mn，Q1 2026 收窄至 R$34.9
              mn。Q1 2026 年化收入达到 R$2.5 bn，年化毛利 R$1.0 bn，管理层目标是在“近期”实现运营盈亏平衡。在这一里程碑达成前，信贷表现恶化会放大亏损，而不是被利润缓冲吸收。
