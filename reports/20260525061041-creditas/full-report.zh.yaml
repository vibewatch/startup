      - number: '3.2'
        title: 竞争者画像：每个玩家是谁、卖什么
        blocks:
          - type: paragraph
            body: >-
              Creditas 进入本章时是专业机构，而不是全栈银行。官方公司和业绩材料显示，公司贷款组合 R$7.6 billion、Q1-26 放款创纪录达到 R$1.1 billion、累计放贷超过 R$12.1
              billion，产品集锚定房屋净值、车辆净值、工资信贷、correspondentes 和雇主福利渠道。放在巴西私营金融科技公司里，这已经是不小的运营规模；独立评论来源也持续把 Creditas
              描述为巴西最大的有抵押信贷平台之一。公司也不再只是一个依赖资本市场资金的 SCD：Andbank 交易后，它进入更宽的审慎监管边界，并拥有银行牌照可选性。

              同行集合按资金模式聚类。Nubank 和 Inter 是数字银行生态，日常银行触达远宽于 Creditas，但保留的公开证据显示，它们在抵押产品上更浅。Itaú、Bradesco 和 Santander
              是公开上市、存款供资的既有银行；它们的优势不是金融科技式新鲜感，而是能把信贷打包进往来账户、工资关系、分行和既有客户信任。Rebel
              是最接近的金融科技风格对照：一家风投支持、完全线上的无抵押贷款机构，优化目标是简单个人信贷，而非抵押深度。Caixa 和 Banco do Brasil 不是创业公司同行，但在实务承保中，它们争夺的是
              Creditas 想捕捉的同一批工资和退休金挂钩借款人流量。
