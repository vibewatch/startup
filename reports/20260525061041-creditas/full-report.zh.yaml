      - number: '7.8'
        title: 展示材料
        blocks:
          - type: callout
            title: 终止标准 1 — 毛利率连续两个季度低于 30 %
            body: >-
              如果 SELIC 维持高位，而 Andbank 存款基础无法抵消证券化融资成本，毛利率可能跌破 30
              %。在这一水平，即便运营现金中性，也需要外部股权；此类资本条款很可能意味着进一步估值下调融资。应同时监控季度利润率、BCB SELIC 决策和已披露的年化融资成本数据。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 终止标准 2 — 银行子公司遭 BCB 执法或触发资本充足率违规
            body: >-
              正式 BCB 执法行动，或 Banco Andbank Brasil 披露资本充足率违规，都会立即击穿投资逻辑。银行牌照是降低融资成本的入口，也正是 Andbank
              收购溢价的依据。任何限制子公司吸收存款或放贷业务的 BCB 行动，都会否定战略理由并迅速摧毁价值。
            calloutType: risk
            claimRefs:
              - CR018
              - CR019
              - CR020
          - type: callout
            title: 终止标准 3 — 估值跌破 US$2 billion，且看不到运营盈亏平衡路径
            body: >-
              如果公司在达到运营盈亏平衡前还需要进一步估值下调融资（低于 US$2 B），投资者疲劳、期权稀释和人才留存压力可能触发自我强化循环。当前运营亏损趋势（R$80.9 mn → R$34.9
              mn，一个季度内）令人鼓舞，但若信贷质量恶化或整合成本超支导致趋势反转，该循环可能重启。
            calloutType: risk
            claimRefs:
              - CR039
              - CR040
              - CR041
              - CR042
          - type: callout
            title: 核心尽调要求：按产品披露 NPL、证券化到期结构和 Andbank 资本充足率
            body: >-
              要形成公共证据无法支持的扎实风险判断，需要三项披露：(1) 按产品和年份批次拆分的 NPL 率及违约曲线；(2) 展示 FIDC 和 CRI 到期日及再融资悬崖的完整负债计划；(3) Banco Andbank
              Brasil 向 BCB 报告的资本充足率，以及收购批准附带的任何条件。没有这些披露，两个最高严重度风险（信贷质量和银行整合）都存在重大证据缺口，无法高置信度承保。
            calloutType: recommendation
            claimRefs:
