        - Caixa 和 BB 已掌握薪资贷或福利触点，可从默认通道发起贷款
        - 关键
        - Caixa 和 BB 官方页面显示，其薪资贷和 INSS 分发已根深蒂固，并具备可携带性
        - 按 correspondentes、雇主渠道、App 和再融资路径量化 CAC 与批准率
      - - Andbank 带来的资金改善
        - 高 Selic 和持续经营亏损，可能削弱新牌照带来的任何资金成本优势
        - 高
        - Q4-25 和 Q1-26 业绩仍显示经营亏损，并明确提到 Selic 压力
        - 索取 Andbank 后存款结构爬坡、证券化利差和净息差桥
      - - 数字 fintech 定位
        - Nubank 在信任和服务质量上胜过 Creditas，削弱纯数字体验护城河
        - 高
        - Reclame Aqui 显示 Nubank 为 RA1000，Creditas 为 Regular
        - 在 NDA 下调取产品级投诉队列、NPS 和重复借款行为
      - - 速度与抵押复杂度
        - Rebel、FGTS 和个人贷款替代品去掉材料和留置权摩擦
        - 中
        - Rebel 主打简单的全线上无抵押信贷，Nubank 突出 FGTS 预支和个人贷款
        - 衡量资料、估值、留置权登记环节的转化流失
      - - 工资代扣品类控制权
        - Crédito do Trabalhador 正在变得可搜索、可转移，削弱单一发起方的排他性
        - 高
        - 政府挂钩的工资代扣通道已支持可携带和更广泛的劳动者触达，BCB 数据显示私营部门工资贷正在提速
        - 不要押注排他性，护城河要靠审批速度、雇主合作和交叉销售的单位经济性守住
    notes: 严重程度是分析师用于确定尽调优先级的判断，不是建模后的亏损预测；证据汇总了针对各项护城河主张最清晰的公开反证信号。
