      - number: '3.4'
        title: 护城河耐久度：切换成本、资金模式和渠道权力
        blocks:
          - type: paragraph
            body: >-
              Creditas 的护城河是真实的，但比「专业金融科技公司胜出」这种简单故事更窄、也更有条件。第一，公开证据确实显示，公司拥有不常见的有抵押信贷深度：房屋净值、车辆净值、工资代扣、correspondentes
              和雇主渠道都出现在保留来源中。第二，Andbank 交易应会随着时间改善资金栈：公司对纯证券化的依赖下降，银行边界扩大。第三，correspondentes 和雇主福利合作意味着获客并非完全 app
              驱动；纯无抵押 app 不容易快速复制这种混合获客路径。

              但耐久度受中等切换成本和强大的既有渠道所有权限制。借款人仍会积极比价，工资信贷正在变得更容易搜索和携带，许多替代产品也不需要房产或车辆留置权带来的文件和抵押摩擦。Caixa 和 Banco do Brasil
              已经坐在工资或福利通道上，放款时可以降低 CAC。既有银行还天然拥有存款、分行和交叉销售经济，而这些是 Creditas 历史上缺少的。实务结论是，Creditas
              的防御力更可能来自资金成本、承保、审批速度和合作伙伴触达，而不是永久锁定效应。
