      - number: '8.4'
        title: 退出路径、尽调阻断项，以及哪些信号会改变判断
        blocks:
          - type: paragraph
            body: >-
              Creditas 的退出路径分析目前只能算有迹象，尚未被证实。按收入规模看，公司已经足够大，符合未来 IPO 候选或战略并购标的画像；Andbank
              交易也证明，围绕资金结构和银行牌照可选性，至少存在一定战略买方兴趣。但目前看不到官方 IPO
              时间表，也未识别出公开的投行委任，也没有公开老股交易证据显示非战略投资人目前愿意以何价承接大额筹码。因此，退出选项真实存在，但证据很薄。投资人应假设，退出时点取决于运营盈利、巴西宏观环境以及银行整合融资策略是否跑通，而不是只看公司规模。


              最关键的阻碍都要靠私有数据补齐。第一，公开资料仍未披露按产品划分的 NPL、逾期分桶或 vintage-loss 曲线。没有这些披露，投资人无法判断 40%
              毛利率是可持续的，还是潜在信用成本问题露出的那一面。第二，公开材料不足以重建完整、经审计的多年损益表和现金跑道。第三，普通股之上的优先股堆叠仍不透明，也就是说，即便企业价值区间合理，也无法干净地折算成普通股回报。这些缺口不是表面瑕疵；它们直接影响入场价格纪律和下行保护。


              实操含义是，本章建议只有在硬证据出现后才应改变。如果 Q2-26 运营结果好于预期、Andbank 牌照带来的存款增长有可信证据、首轮 NPL
              披露没有显示隐藏恶化，就足以支持从观察姿态转向可投资信念。反过来，如果运营亏损再次冲高、连续两个季度毛利率低于 35%，或首次信用指标呈现反向信号，除非定价大幅低于 Series G 标记，否则应选择退出。
