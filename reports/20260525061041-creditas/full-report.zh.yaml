        - 综合银行捆绑个人信贷、透支和投资者信贷
        - 本章留存证据未把 Itaú 当前利率与 Creditas 列表利率标准化对比
        - 留存样本中与 Creditas 包装最接近的既有银行
      - - Caixa / BB INSS 薪资代扣贷
        - 薪资代扣分期；Caixa 最长 108 个月；BB 长期限线上薪资代扣贷
