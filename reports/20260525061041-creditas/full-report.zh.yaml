  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式：增长中的有抵押贷款组合贡献利息收入，但受 SELIC 和 IFRS 拨备压缩
        blocks:
          - type: paragraph
            body: >-
              Creditas 的收入几乎全部来自其有抵押贷款账簿的净利息收入。三大核心产品是房屋净值贷款（empréstimo com garantia de imóvel）、车辆净值贷款（empréstimo com
              garantia de veículo）和 e-Consignado（私营工资代扣贷款）。次要收入流包括通过 Creditas Seguros
              提供的汽车保险、车辆融资，以及卖给雇主的员工福利产品。公司也以直接信贷公司（SCD）身份运营，获得巴西 Banco Central 许可，可在自有资产负债表上发放贷款；December 2025，公司完成
              Andbank Brasil 银行牌照收购，从而扩大了用存款为贷款供资的能力。


              收入确认遵循 IFRS。2026 年方法论修订收紧了停止计息阈值：Creditas 现在对逾期超过 180 天的房屋净值贷款停止计息（此前为 730 天），对所有其他逾期超过 90 天的产品停止计息（此前为
              365 天）。公司将这一变化追溯适用于所有 2025 年期间，并披露其非现金影响为全年 2025 收入 -6.4%、毛利润
              -1.7%。这些非计息资产未来若收到付款，将在收到时确认为回收收入。这一变化不影响流量口径的单位经济或现金生成，但投资者阅读披露收入趋势时必须注意，因为它让 2025 年结果无法按表面值与更早发布的数字直接比较。


              最高质量的收入驱动因素是组合规模。Q4-25 和 Q1-26 的季度放款都达到 R$1.1bn，同比增速超过 29-35%。截至 March 2026，累计贷款组合为 R$7.6bn（同比 +22.4%）。将
              Q1-26 季度收入 R$633mn 年化，意味着运行率超过 R$2.5bn；Creditas 在投资者关系首页也确认了这一点。重新定价顺风——由 SELIC
              指数化证券化以当前更高利率滚动续作驱动——继续支撑单位贷款组合收入，即便季度新增量仍以贷款组合余额高个位数百分比增长。
