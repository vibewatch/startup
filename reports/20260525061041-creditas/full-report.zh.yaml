      - number: '3.3'
        title: 能力对比和客户信任信号
        blocks:
          - type: paragraph
            body: >-
              能力宽度是 Creditas 看起来有差异、但还谈不上主导的地方。基于保留的公开证据，Creditas 是本章唯一一个清楚把房屋净值、车辆净值、工资信贷、API 连接的 correspondentes
              和雇主福利分销放在同一栈里的贷款机构。这很重要，因为公司不用变成完整全能银行，也能同时服务大额抵押借款人和较小额工资借款人。Nubank 的反向定位正好相反：保留证据中有抵押贷款更弱，但日常银行触达更强，app
              驱动的消费者旅程更简单，信任信号也成熟得多。Inter 在概念上类似 Nubank，但保留的公开页面过于稀疏，很难有把握地给能力深度打分。Itaú
              是最强的既有银行功能基准，因为它明确展示房屋净值和工资代扣，并配有更宽的银行产品套件。

              信任信号削弱了对 Creditas 竞争叙事的过度乐观。Reclame Aqui 只给 Creditas「Regular」评级，分数为 6.4/10，解决率 70.1%，愿意再次交易的比例
              46.5%。Nubank 是反向基准：RA1000、8.6/10、响应更快，解决率和复购意愿都高得多。Bradesco 尽管规模大、网点模式重，得分仍高于 Creditas；Santander
              则低于它。结果是一幅混合图景：Creditas 的专业产品深度优于多数数字贷款机构，但服务质量目前不是清晰护城河，在某些对比中甚至是竞争弱点。
