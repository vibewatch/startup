  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资轮背景、估值重置和战略底部支撑
        blocks:
          - type: paragraph
            body: >-
              Creditas 估值的起点，是从 January 2022 Series F 峰值到 December 2025 Series G 的明确重置。Series F 融资 US$260 million，估值
              US$4.8 billion，Fidelity 和 SoftBank 在投资团中；当时全球资本环境宽松得多，巴西 SELIC 利率显著更低，成长股权仍奖励收入扩张胜过盈利。相比之下，Series G 融资
              US$108 million，投后估值 US$3.3 billion，较 2022 年峰值下调 31.25%。这使最新一轮毫无疑问成为估值下调融资，但还不是困境融资。定价发生在 Creditas 完成收购
              Bank Andbank Brasil 的同一时点：一项多年战略动作转化为运营中的银行牌照，Andbank 也同时成为投资方和被收购机构。


              这种战略结构很重要。Series G 领投方不是被动的后期跨界基金，而是一个带商业信息的交易对手，既尽调了 Creditas 的贷款平台，也尽调了被并入集团的银行资产。VEF
              的披露进一步说明，这一轮不是纯粹装点门面。VEF 对 Creditas 的此前账面标记约为 US$2.79 billion；其可转债按 US$3.3 billion Series G 价格转换，为 VEF 带来
              8.2% NAV 提升，并相对于此前标记隐含 17.8% 上调。换句话说，新一轮低于 2022 年峰值，但高于至少一位知情机构持有人的内部估值。


              即便如此，新价格并不会自动变得有吸引力。Creditas 七轮累计融资约 US$987
              million，因此公司普通股之上已经有相当厚的优先资本堆叠。公开证据没有披露各历史轮次的参与权、优先级细节或清算优先权。这意味着投资者能看到最新价格，却无法完全承保该价格在中等退出情景下对普通股回报意味着什么。因此，当前估值更应被视为带一定底部支撑的可信战略标记，而不是风险调整后入场点本身已经有吸引力的证明。
