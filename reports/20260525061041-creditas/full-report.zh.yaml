  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 巴西有抵押贷款的市场边界和结构
        blocks:
          - type: paragraph
            body: >-
              Creditas 的相关市场不是「全部巴西信贷」，甚至也不是全部家庭信贷，而是 Sistema Financeiro Nacional 内那些因抵押品、工资扣款或 FGTS
              挂钩担保而实质改变承保和定价的家庭借款子集。实务上，本章包括房屋净值贷款、车辆净值贷款、面向 CLT 员工的私营工资代扣贷款，以及使用 eSocial 和 FGTS
              挂钩担保的新劳动者信贷通道。同时，本章也把多银行住房和车辆融资视为相邻获客路径，因为即便资产负债表产品不同，Creditas 也借这些产品触达同一种借款意图。

              本章排除企业信贷、农业信贷、无抵押个人贷款和循环信用卡余额。这些品类可作为替代品或基准，但不是 Creditas
              围绕房屋、汽车或工资抵押构建的同一承保市场。公司自己的产品触点把这一边界说得很清楚：营销产品是有抵押或工资挂钩，首页拿它们与昂贵的无抵押信贷对比，透明度材料也把 Creditas 放在
              SCD/银行代理模式中，而不是全能银行消费产品栈。
