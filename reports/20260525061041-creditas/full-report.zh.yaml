      - number: '5.5'
        title: 证据缺口与未知基础设施
        blocks:
          - type: paragraph
            body: >-
              现有证据较好覆盖了 Creditas 的公开产品界面、监管结构、API 文档和季度投资者沟通，但几项技术关键问题仍未解决。深层技术基础设施——云厂商、核心银行系统、微服务拓扑、CI/CD 流水线和 SLA
              承诺——在公开材料中完全缺席。没有找到 ISO 27001、SOC 2 或 PCI DSS 认证。Creditas 移动应用的 iOS App Store 状态、当前应用商店评分和下载量没有得到验证。最多 16
              家具名保险承保方的完整名单，以及车辆和房贷融资中的具名银行合作伙伴均未披露。细分 NPL 率、LTV-to-collateral 比率和年份批次信贷表现，只能从汇总投资者指标中看到。放款耗时基准、cartório
              接入 SLA、DETRAN 电子留置权处理时间在任何公开来源中都没有出现。这些缺口属于私营公司常见证据限制，但在基础设施和运营风险可评估之前，尽调必须补齐。
