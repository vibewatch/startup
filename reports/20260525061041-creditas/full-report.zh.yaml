      - number: '4.2'
        title: 毛利润动态：队列盈利能力高于 40%，披露利润率受 SELIC 和 IFRS 压缩
        blocks:
          - type: paragraph
            body: >-
              队列层面盈利能力与披露毛利率之间存在持续且重要的缺口。Creditas 一直表示，队列层面盈利能力仍高于其 40% 毛利润目标。公司的论点是，IFRS 在放款加速时前置拨备——因为预期信用损失在发放时确认——而高
              SELIC 会抬高证券化资金成本。即便底层队列经济健康，这两个因素也会在增长阶段压低披露毛利率。


              Q3-25 原始公告披露的毛利率为 37.1%，Q2-25 为 32.6%。此后，Q4-25 公告调整了 IFRS 利息计提和拨备方法，重新核算自 2025 年 1 月 1 日起的业绩，并披露 Q4-25
              毛利率为 36.2%。Q1-26 毛利率达到 40.0%。这些数据采用不同披露口径，不能拼成同口径的四季度毛利率序列，也不足以认定 Q1-26 是首个达到 40% 的季度。Creditas 管理层将 Q1-26
              结果描述为证据，说明利润率正在「稳定，并向 40-45% 的目标队列层面盈利能力收敛」。绝对值上，季度毛利润从 Q4-25 的 R$211.2mn 增至 Q1-26 的 R$253.5mn（环比
              +20.0%，同比 +24.1%），创历史新高。报告发布前的 2026 年 5 月 17 日存档显示，投资者关系首页列示的年化毛利润为 R$1,012mn。这是公司披露的首页数字，不能等同于将已取整的 Q1-26
              毛利润 R$253.5mn 直接乘以四所得的 R$1,014mn。审阅的来源没有解释 R$2mn 差额；不能不作说明就用其中一个数字替换另一个。


              毛利润以下成本（销售、一般及行政费用加上客户获取成本）在 Q3-25、Q4-25 和 Q1-26 基本保持在每季度 R$288-292mn 附近，Q1-26 环比改善 -1.3% 至 R$288.4mn。CAC
              在 Q4-25 环比下降 -6.1%，同时放款环比增长 +10.7%，这是经营杠杆改善信号。Q3-25 原始公告称，经营亏损从 Q2-25 的 R$87mn 收窄至 Q3-25 的
              R$68.2mn。重新核算后，Q4-25 公告将该季 R$80.9mn 的经营亏损描述为基本稳定；不能拿它与未经重新核算的 R$68.2mn 相比，就认定 Andbank 并表导致亏损恶化。Q1-26
              公告称，经营亏损从 Q4-25 的 R$80.9mn 收窄至 R$34.9mn——尽管放款规模显著更高，仍约为 Q1-22 经营亏损的十分之一。Q1-26
              公告将近期恢复经营盈亏平衡列为目标。公司另称希望到年底进入兼具增长与盈利的新阶段；这并非对经营盈亏平衡设定明确截止日期。


              队列主张和披露结果之间的张力，是核心财务承保问题。公司没有发布 vintage 层面的 NPL
              曲线、非计息资产池的实际回收率，或可让独立投资者验证队列经济的贷款级损失数据。在这些披露出现前，公开来源既不能确认、也不能证伪队列盈利能力主张。
