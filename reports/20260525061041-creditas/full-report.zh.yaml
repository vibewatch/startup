      - number: '7.5'
        title: 竞争与渠道替代风险：Nubank、传统银行和 e-Consignado 市场动态
        blocks:
          - type: paragraph
            body: >-
              Creditas 的核心贷款垂直——Home Equity、Auto Equity 和 e-Consignado——正面对三类竞争加剧。第一，Nubank 是巴西领先数字银行，拥有 100+ million
              客户和 RA1000 声誉，已公开推出 consignado 产品（INSS、公共部门和私营 CLT 工资扣款），并正在扩展到有担保贷款。Nubank 的分发优势——客户已经入驻、无需新增
              KYC——以及信任溢价（Reclame Aqui 8.6 vs Creditas 6.4），意味着它能在 Creditas 目标借款人群中压低获客成本。第二，Itaú、Bradesco 和 Santander
              都通过网点和数字渠道提供 Home Equity、车辆净值贷款和私营 consignado 产品。尽管它们的数字 UX 和速度过去落后于 Creditas，但 SELIC
              高企时，这些传统银行有显著资产负债表融资优势：它们按存款成本融资，而不是 FIDC/CDI 利差，从而形成天然利率优势。第三，e-Consignado 工资扣款市场受监管和雇主关系动态影响；Creditas
              明确称 Q4 2025 e-Consignado 出现“缓慢加速”，只有在“看清单位经济性并让运营流程正常化”后交易量才正常化，说明该垂直仍在成熟，而非已经整合。合作伙伴渠道模式（API 驱动发起、B2B
              雇主关系）通过锁定雇主层面的分发部分保护了 Creditas，但如果竞争对手给出更好的佣金经济性，雇主关系可以切换。Rebel 是应收账款领域一家未验证的金融科技公司，在 Reclame Aqui
              上登记零投诉；今天规模太小，不构成实质威胁，但代表了一条产品专项长尾竞争者，可能侵蚀细分小市场。
