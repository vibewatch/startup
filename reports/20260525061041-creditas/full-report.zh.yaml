      - number: '2.2'
        title: 规模测算：用多重证据镜头看 TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >-
              巴西有抵押贷款的公开市场规模天然取决于采用哪种镜头。Banco Central 数据给出宽口径宏观背景——SFN 信贷在 2024 年仍增长 11.5%，2025 年预测先在 March 下调至 7.7%、随后在
              September 上调至 8.8%，2026 年预计为 8.0%——但这个宏观镜头过宽，无法直接用于 Creditas TAM。更有用的子市场镜头来自 ABECIP 的自由资金房地产数据、政府和 CAIXA
              关于私营工资代扣 / Crédito do Trabalhador 通道的证据，以及 Mordor 提供的汽车金融需求代理指标。每个镜头都捕捉了可触达有抵押借款人宇宙中的不同部分。

              因此，规模判断应是分层视图，而不是一句「巴西有抵押贷款市场是 X」。保守的近期 SAM 可以围绕约 R$70B–95B 的等效年度机会来框定：合并住房信贷和工资代扣镜头，扣除重叠，并且不假设 Creditas
              能拿到泛汽车贷款。只有当自由资金住房信贷继续扩张、劳动者信贷推进接近政府 4 年情景时，上行情景 TAM 才会达到约 R$100B–140B。Creditas 当前 SOM
              要窄得多，最好锚定在已观察规模：Q1-26 贷款组合 R$7.6B、季度放款 R$1.1B。
