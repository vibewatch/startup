      - number: '6.4'
        title: 投诉信号与反向客户证据
        blocks:
          - type: paragraph
            body: >-
              Reclame Aqui 提供了 Creditas 最结构化的独立客户证据。01 November 2025 至 30 April 2026 六个月内，Creditas 收到 1,949 起投诉，回复率
              91.2%（访问日仍有 162 起待回复），解决率 70.1%，并在 597 起已评价投诉中取得平均满意度 5.28/10。只有 46.5% 的评价客户表示愿意再次与 Creditas 交易。平台综合声誉分为
              6.4/10，被归为「Regular」（在 Reclame Aqui 量表上介于「Good」与「Bad」之间）。Creditas 数据库中全部活跃投诉的历史总量为 15,673，说明公司 12
              年经营过程中投诉持续累积。

              投诉类别拆分显示的是结构性问题，而非孤立事件。不当收费（cobrança indevida）以 2,231 起居首，其后是误导性广告（propaganda enganosa）1,628 起，以及操作完成困难
              1,547 起。未履行协议（826）、高利率（820）和糟糕客服（655）也位居前列。“误导性广告”成为第二大类别，说明 Creditas
              的营销主张（强调最低利率、简单、快速）与客户在利率复杂度、流程摩擦或费用披露上的实际体验之间存在系统性缺口。作为背景，同一研究窗口抓取的 Nubank Reclame Aqui 得分更高，说明 Creditas
              的「Regular」评级低于关键数字原生竞争对手。再对比 Creditas 自己在 2020–2022 年获得的 Reclame Aqui 奖项，可以看出近几个周期的投诉解决表现已经恶化。
