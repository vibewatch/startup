      - number: '2.4'
        title: 增长驱动因素和 Selic/监管约束
        blocks:
          - type: paragraph
            body: >-
              2025-26 年最重要的增长驱动因素，是通过 Crédito do Trabalhador 将私营工资信贷正式化。政府指引称，该通道可触达约 19 million 名 celetistas，并在 4
              年内带来超过 R$120B 贷款；CAIXA 则解释了实操机制：CTPS Digital 比价、银行直接报价、35% 保证金规则，以及 FGTS/遣散挂钩担保。这降低了工人切换摩擦；过去他们面对的是碎片化的雇主
              convênio 流程。它还把可服务工资代扣人群扩大到 eSocial 记录中的农村工人、家政工人和 MEI 员工。

              约束同样清楚。Banco Central 报告显示，长期限和自由信贷品类仍对限制性政策敏感；Creditas 自己的 Q1-26 披露也称 SELIC
              更高更久，并压迫利润率环境。相对巴西更大的住房金融市场，房屋净值贷款仍显得渗透率不足，自由资金房地产信贷只是最近才开始放量。车辆信贷仍竞争激烈、银行主导，工资 TAM 仍排除非 CLT
              工人，以及部分休假或处于通知期的工人。运营信任也很重要：消费者投诉仍然足够大，即使产品经济性有吸引力，服务质量也可能拖慢采用。
