  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 证据
      - Creditas 影响
      - 尽调问题
    rows:
      - - Crédito do Trabalhador 推出
        - 正向
        - 2025-26
        - 政府称 ~19M CLT 员工，四年 >R$120B
        - 扩大薪资贷 TAM，降低搜索摩擦
        - 跟踪迁移和新增薪资贷合同中 fintech 的实际份额
      - - eSocial / CTPS Digital / Dataprev 集成
        - 正向
        - 立即
        - 报价比较、薪资代扣和可携带性都已数字化
        - 提高转化率，降低运营摩擦
        - 衡量从批准到放款的周期，并与传统 convênio 流程对比
      - - FGTS 与解雇补偿担保
        - 正向
        - 2025-26
        - 最高 10% 的 FGTS 余额，加 100% 解雇罚金，可支撑劳动者信贷
        - 可降低预期损失，扩大可报价人群
        - 先取得实证违约曲线，再假设利润率抬升
      - - 高 Selic / 利率更高更久
        - 负向
        - 立即
        - BCB 和 Creditas 都把紧缩政策与长期限 / 自由用途信贷动能放缓、利润率压力联系起来
        - 挤压单位经济模型，也可能拖慢借款需求
        - 在利率正常化更慢的情景下，对贡献利润率做压力测试
      - - 房产抵押贷渗透率低
        - 双向
        - 中期
        - 相对整体住房金融，自由资金住房信贷从小基数上升
        - 空间很大，但品类教育仍必需
        - 寻找监管方或贷款机构数据，确认真实房产抵押贷存量
      - - 正式雇佣与资格门槛
        - 负向
        - 立即
        - CLT 登记、可扣额度、休假状态和通知期规则限制资格
        - 相对表面工人数量，压窄薪资贷 SAM
        - 量化 Creditas 目标雇主中的合格工人占比
      - - 车辆信贷竞争以银行为主
        - 负向
        - 持续
        - 即便 fintech 参与，汽车贷款市场仍集中在银行手里
        - 车辆产品拿份额可能更慢，或价格竞争更激烈
        - 按车辆渠道梳理贷款方份额和合作伙伴经济性
      - - 消费者信任 / 投诉负担
        - 负向
        - 立即
        - Reclame Aqui 给 Creditas 的评级为 Regular，分数 6.4/10，最近六个月有 1,949 起投诉
        - 服务摩擦会推高 CAC，减少转介绍
        - 按产品和旅程阶段拆分投诉结构
    notes: 各项驱动因素和约束按其对采用时间的实际相关性排序。近期最强正向因素是薪资贷通道数字化和劳动者信贷监管；最强负向因素是利率压力、资格门槛和服务摩擦。
