  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有银行、相邻贷款机构和替代品
        blocks:
          - type: paragraph
            body: >-
              Creditas 在巴西面对的不是单一清晰可比公司。直接重叠首先来自那些能完成同一借款人任务的贷款机构——「用可预测还款来源换取更便宜现金」——但竞争者集合会分成非常不同的类别。Nubank 和 Banco
              Inter 是相邻数字银行同行：它们在 app 驱动的无抵押、工资代扣，以及 Nubank 的 FGTS 挂钩产品上很强，但保留的官方页面没有显示 Creditas 公开宣传的同等房屋净值和车辆净值深度。Itaú
              是最强的直接既有银行可比对象，因为其官方页面清楚地同时展示个人信贷、工资代扣贷款和房屋净值贷款。Bradesco 和 Santander
              的重要性略低，因为保留页面细节更少；但作为全能银行，它们仍处在借款人的同一个决策集合中。

              替代品集合同样重要。Caixa 和 Banco do Brasil 从政府挂钩或工资挂钩通道进攻，尤其是 Crédito do Trabalhador 和 INSS
              consignado；在这些场景里，网点覆盖、福利触达和可携带性可能胜过专业产品深度。只要速度比最低利率更重要，FGTS 预支和无抵押个人贷款就会胜出。更边缘处，联邦政府围绕帮助工人「摆脱 agiotas
              之手」的公开口径，证实非正规贷款机构仍是那些被正式抵押品或工资通道排除的借款人的现状之一。简言之，Creditas 的竞争不是一对一金融科技对抗，而是一个由专业机构、数字银行、既有银行和替代品叠起来的市场。
