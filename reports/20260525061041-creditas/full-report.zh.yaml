      - number: '6.3'
        title: 具名客户证明与客户引用质量
        blocks:
          - type: paragraph
            body: >-
              对一家 B2C 金融科技公司而言，Creditas
              公开材料中的具名客户证明非常有限。官方福利页面（creditas.com/beneficios-empresas）包含类似推荐语的证明模块，但没有点名具体雇主客户。汽车保险页面称“10 人中有 9
              人会续保”，作为留存证明，但这是公司自述，没有独立佐证。消费者评测平台（iDinheiro、Guia do Investidor、Plusdin）一致把 Creditas
              描述为巴西可靠且领先的抵押贷款平台，但依据是编辑评测，不是经过验证的客户案例。Series F 投资方 Fidelity 的引述称 Creditas
              正在建立“与客户的深度关系，并大幅降低信贷成本”，为关系型银行逻辑提供了第三方确认，但没有证明具体客户部署。Google Play
              应用评论（抓取内容中存在，但未披露评分）是最易取得的个人客户反馈形式，不过研究窗口内没有取得结构化评分。

              B2B 福利业务没有公开披露具名雇主客户、客户基数对应的员工规模或渗透率统计。这对希望验证 B2B 牵引力的投资者是重要缺口。B2B AWARDS 最佳福利管理软件奖认可了产品，但没有量化客户基础。
