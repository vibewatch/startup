      - number: '7.7'
        title: 执行风险：产品宽度、银行整合和领导层过渡
        blocks:
          - type: paragraph
            body: >-
              Creditas 运营六条或更多不同产品线，包括 Home Equity、Auto Equity、e-Consignado、保险、灵活员工福利、车辆融资及房产融资；此外还有新收购的银行子公司，以及单独持有的
              APW（Andbank Wealth）非控股 25% 权益。文件将两项收购均列于 2025 年 11 月 28 日，并明确区分集团的银行 100% 股权与 APW 权益；按 IFRS
              10，后者不赋予控制权。公司同时追求贷款组合年增长 25% 以上、管理多条产品线并整合银行，面临实质执行风险。Q4 2025 业绩明确提到，运营成本上升部分来自「整合 Andbank
              公司结构」，说明整合摩擦已进入 P&L。2025 年 12 月 1 日公告宣布 Ricardo Forcano 出任 CTO 和 COO，距离 2025 年 11 月 28
              日银行交割不久；公告日期不能确定其实际入职日。Forcano 在 BBVA 等全球大型机构有二十多年经验，但截至报告运行日仍是 Creditas
              新人。高管任命公告与银行交割时间接近，增加执行不确定性，但不表示两件事发生于同一天或同一个月。Creditas 的 AI 优先平台叙事有可信支撑：Q1 2026 报告员工人均生产率创纪录，年化收入为 R$1.4
              mn，六个月前为 R$1.1 mn；管理层描述 AI Agent 覆盖早期催收全流程，并以 AI 加速软件开发，将周期从三周缩至四天。不过，相似增长阶段的金融科技公司常出现 AI
              承诺快于交付的情况，公开资料也没有独立审计验证公司所称的生产率提升。Creditas 自成立以来放款 R$12.1 billion，并称为客户节省 R$6.2
              billion，构成可信的经营记录；但银行集团整合带来的合规及运营复杂度具有不同性质，在公司过往经历中没有直接先例。
