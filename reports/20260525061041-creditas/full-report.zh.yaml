      - number: '8.2'
        title: 运营轨迹、隐含倍数，以及为什么价格仍显得要求不低
        blocks:
          - type: paragraph
            body: >-
              支持 Series G 价格的最强论据，是运营表现到 Q1-26 已经明显改善。Creditas 报告季度收入 R$633 million，同比增长 23.1%；毛利 R$253.5 million，毛利率
              40.0%。Q1-26 公告称，季度经营亏损从 Q4-25 的 R$80.9 million 收窄至 R$34.9 million。Q3-25 原始公告披露的亏损为 R$68.2 million，早于 Q4-25
              公告所述的历史业绩重新核算；不能把这个数字与后续口径的数据拼成同口径序列。贷款组合达到 R$7.6 billion，季度放款达到 R$1.1 billion，均为公司报告的新高。Q1-26
              公告支持的是公司所述的较 Q4-25 改善，而不是跨越此前口径变更推导出的持续复苏；员工生产率也在六个月内从约 R$1.1 million 年化收入 / 员工提高到 R$1.4 million。


              问题在于，估值已经反映了相当一部分运营改善。将 Q1-26 数据直接年化，收入为 R$2,532 million（R$633 million × 4），毛利润为 R$1,014 million（R$253.5
              million × 4）。历史投资者关系首页另列年化毛利润 R$1,012 million；这不是同一项算术计算。估值示例统一假设 R$5 兑 US$1，并采用粗略取整后的代理值：年化收入 US$500
              million、年化毛利润 US$200 million。这只是示例汇率约定，并非有来源支持的 2026 年 5 月市场汇率。以这两个代理值计算，Series G 的 US$3.3 billion 股权估值隐含
              6.6x 年化收入倍数和 16.5x 年化毛利润倍数，既不是过去十二个月倍数，也不是企业价值倍数。按 R$5 兑 US$1 换算而不进一步取整，两个分母分别为 US$506.4 million 和
              US$202.8 million；不能将粗略代理值误当作更精确的计量。Creditas 仍在亏损，主要依赖资本市场融资，也没有披露产品级 NPL
              或现金可支撑时长，因此这些倍数并非困境定价。更准确地说，倍数偏满，仍需后续执行兑现。


              宏观条件也不支持太快追高。引用的 Banco Central do Brasil 信贷预测分属两个时点：2025 年 3 月预测，2025 年 SFN 贷款余额名义增速为 7.7%；2025 年 9 月将
              2025 年预测上调至 8.8%，并预计 2026 年增长 8.0%。这些是当时的预测，既不是已核实的年末实际结果，也不是截至 2026 年 5 月的最新预测。拿全系统贷款余额增速与 Creditas
              收入增速比较，不能证明信贷市场份额上升；有效比较需要统一期间、贷款细分市场和贷款组合定义。两份信贷预测专栏讨论了紧缩货币环境，但不足以确定 2026 年初的准确 SELIC 利率，也不能据此计算相较 2022 年
              1 月的利差。资金成本传导仍是风险：如果政策利率持续高企，CDI 挂钩证券化融资成本可能居高不下；若 Andbank 牌照带来的存款资金增长慢于预期，报告利润率也可能承压。与此同时，Creditas 的
              Reclame Aqui 得分为 6.4/10，再交易意愿 46.5%，落后于 Nubank 和 Bradesco。运营趋势在改善，但公司还没有好到、透明到足以让当前标记显得明显便宜。
