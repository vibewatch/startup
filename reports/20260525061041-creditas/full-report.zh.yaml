      - number: '2.5'
        title: 矛盾、规模缺口和证据边界
        blocks:
          - type: paragraph
            body: >-
              主要矛盾不是不同来源对某个精确数字各执一词，而是它们用不同单位描述市场。Banco Central 讨论整个信贷体系的增长和各业务品类表现；ABECIP 报告房地产放款流量；政府与 CAIXA
              材料描述工资代扣信贷的签约潜力和担保机制；Mordor 则用 USD 衡量范围更宽的汽车贷款市场。这些视角各有价值，却不能直接相加。任何 TAM、SAM 或 SOM
              数字都离不开判断：如何处理重叠、哪些借款人符合资格，以及应以存量、流量还是签约金额代理作为分母。

              公开证据对产品条款、漏斗顶部需求信号和 Creditas
              已观察到的自身规模支持最强。薄弱处包括：巴西房屋净值与车辆净值子市场究竟有多少未偿余额，各产品批准率和接受率是多少，以及新劳动者信贷推广后，多少贷款会由金融科技机构发起并进入其资产负债表，而非流向既有银行。尽调与估值不应追求虚假精确，而应界定机会范围：市场足够大，值得关注；利率下降、工资代扣通道数字化会让环境更有利；但信息仍不透明，无法支持单点市场份额断言。
