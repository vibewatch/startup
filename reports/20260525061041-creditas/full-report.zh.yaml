      - number: '8.3'
        title: 情景分析与建议纪律
        blocks:
          - type: paragraph
            body: >-
              估值讨论宜采用分析师选定的三种情景，而非单点估计。下列退出区间假设的是公司股权总价值，不是企业价值、经验证的成交价，也不是投资者所得预测。乐观情景下，Creditas 到 Q3-26
              达到运营盈亏平衡，Andbank 银行牌照到 late 2026 转化为有意义的存款或 CDB 资金，SELIC 在下半年开始降至 13% 以下。在这组条件下，毛利率可保持在接近
              40%，收入增速高于巴西整体信贷系统，US$5.5-7.0 billion 的示例退出股权价值区间具有一定可能性，但这不是已经确认的 2027-28 年退出时间表。相较 US$3.3 billion
              的入场股权价值，该区间对应公司股权价值上升 +66.7% 至 +112.1%，尚未计入稀释、优先权、费用、税费或分配，但仍依赖几件公开证据尚未确认的事：NPL 稳定、存款爬坡时点，以及持久盈亏平衡。


              基准情景是更保守的分析师示例。亏损在 2026 年收窄但不消失，存款收益只会逐步到来，公开市场或私募买方把 Creditas 视为一家规模化、但尚未完全去风险的贷款机构。US$3.5-4.5 billion
              的示例退出股权价值区间，对应公司股权价值较当前估值变动 +6.1% 至 +36.4%。这并不构成五年内退出的承诺，也不能据此确定投资者年化回报。悲观情景也不难想象。如果 SELIC 到 2027
              年仍接近当前水平，如果第一次有意义的 NPL 披露令人失望，或客户服务问题恶化，股权价值可能在重组或承压融资情景中降至 US$2.0-2.5 billion，甚至更低。相较 US$3.3
              billion，该区间对应公司股权价值变动 -39.4% 至 -24.2%，并非不可突破的下限。


              这些分支指向观察 / 有条件观察，而不是买入。公司规模足够、战略融资可选性足够，近期运营改善也足以支持继续尽调。但正确纪律必须对价格敏感：约 US$2.5-3.0 billion 的优先入场区间，能更好补偿
              NPL 不透明、优先股堆叠不确定性和宏观逆风。只有当 Q2-26 确认运营亏损继续改善，且管理层披露足够信贷质量数据以证明近期利润率恢复没有掩盖未来拨备痛点时，支付完整 US$3.3 billion Series
              G 标记才说得通。


              计算公式为（假设退出股权价值 / 入场股权价值 - 1）× 100，百分比保留一位小数。25% / 50% / 25% 的情景权重由分析师选定，并非经实证确定的概率；本报告不计算概率加权回报。此前互不一致的
              2027-28 年、三至四年和五年退出期限，不用于这里的回报计算。假设以 US$2.5 billion 入场，同一组情景的退出股权价值总区间为 US$2.0-7.0 billion，对应变动 -20.0% 至
              +180.0%，下限仍有亏损。基准区间中点 US$4.0 billion 对应 +60.0%。图中圆点先取退出价值区间的中点，再换算百分比并取整；它们不是预期结果，跨情景总区间也不是独立的第四种情景。
