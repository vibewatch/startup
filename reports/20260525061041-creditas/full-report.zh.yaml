      - number: '8.2'
        title: 运营轨迹、隐含倍数，以及为什么价格仍显得要求不低
        blocks:
          - type: paragraph
            body: >-
              支持 Series G 价格的最强论据，是运营表现到 Q1-26 已经明显改善。Creditas 报告季度收入 R$633 million，同比增长 23.1%；毛利 R$253.5 million，毛利率
              40.0%。季度运营亏损从 Q4-25 的 R$80.9 million 收窄至 R$34.9 million，而 Q3-25 和 Q4-25 此前分别亏损 R$68.2 million 和 R$80.9
              million。贷款组合达到 R$7.6 billion，季度放款达到 R$1.1 billion，均为公司报告的新高。管理层关于 IFRS
              方法收紧后利润率正在恢复的叙事，因此有数字上的方向性支持；员工生产率也在六个月内从约 R$1.1 million 年化收入 / 员工提高到 R$1.4 million。


              问题在于，估值已经资本化了相当多运营进步。将 Q1-26 年化，可得到约 R$2.5 billion 收入和 R$1,012 million 毛利；按证据集中隐含的粗略汇率约定，分别约为 US$500
              million 和 US$200-250 million。在此基础上，US$3.3 billion Series G 隐含约 6.6x 滚动收入和 13.2x
              滚动毛利。对一家仍在亏损、仍主要依赖资本市场融资、且未披露产品级 NPL 或现金跑道的贷款机构来说，这些不是困境倍数。更准确地说，它们是偏满的中等倍数，需要后续执行继续兑现。


              宏观条件也不支持太快追高。Banco Central do Brasil 到 early 2026 仍把 SELIC 维持在约 14.75%，并预计 2025 年系统信贷增长仅 7.7%、2026 年仅
              8.0%。Creditas 增速快于系统，但同样的限制性利率背景会推高 CDI 挂钩 证券化融资成本；如果 Andbank 牌照带来的存款资金爬坡慢于预期，也会压制报告利润率。与此同时，Creditas 的
              Reclame Aqui 得分为 6.4/10，再交易意愿 46.5%，落后于 Nubank 和 Bradesco。运营趋势在改善，但公司还没有好到、透明到足以让当前标记显得明显便宜。
