              相比无抵押同行，Creditas 的有抵押贷款模式在结构上限制了信用损失，使其能用有竞争力的定价获客。December 2025 收购 Andbank Brasil
              银行牌照进一步扩大这一优势：存款端资金被打开，对证券化利差的依赖下降，规模化单位经济获得有意义的结构性改善。
