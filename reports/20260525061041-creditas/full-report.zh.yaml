  - id: FM001
    title: 市场规模金字塔
    type: pyramid
    layout: wide
    summary: 测算 Creditas 市场规模时，应先从狭义有抵押贷款视角向上推，而不是不加筛选地从整个巴西信贷体系往下切。
    approximationNotes: 各层是用不可相加的公开视角推导出的方向性 TAM/SAM/SOM 边界。它们混合了放款额、签约量和公司运行率证据，不应视为经审计存量总额。
    data:
      items:
        - label: TAM — 广义有抵押家庭信贷机会视角
          value: R$100–140B
          unit: estimated annual opportunity
          detail: 上行情景结合了预计的住房信贷自由资金扩张和广义劳动者信贷铺开，同时剔除了大部分无抵押消费信贷。
        - label: SAM — 近期可服务的有抵押 / 薪资贷款视角
          value: R$70–95B
          unit: estimated annual opportunity
          detail: 保守综合当前薪资贷款资源、住房信贷自由资金规模，以及资格折减。
        - label: SOM — Creditas 已观测规模视角
          value: R$4–8B
          unit: annualized origination / current portfolio proxy
          detail: 以 Q1-26 创纪录放款额 R$1.1B 和公司披露贷款组合 R$7.6B 为锚。
