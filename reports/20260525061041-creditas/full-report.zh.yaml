      - number: '7.3'
        title: 监管与合规风险：SCD / correspondente bancário 框架、银行收购和 LGPD 义务
        blocks:
          - type: paragraph
            body: >-
              Creditas 同时处在三层监管之中，每一层都有不同监督义务。第一，作为 Sociedade de Crédito Direto（SCD），公司受 Resolução CMN 4.656 约束，并承担
              Banco Central 对持牌非银金融机构施加的完整审慎和行为要求，包括最低资本、运营风险、AML/CFT 以及定期 SCR 报告。第二，作为 Correspondente Bancário，公司必须遵守
              Resolução CMN 4.935，该规则约束发起实践、披露义务，以及其分销产品所属银行机构的监督。第三，在 BCB 于 November 2025 批准 Andbank 巴西实体重组（包括 DTVM
              分拆）后，Creditas 于 December 1, 2025 完成对 Banco Andbank Brasil 的收购。这给集团结构增加了一张完整银行牌照，也带来更重的审慎资本、流动性和治理要求。BCB
              审批流程从最初 2022 年公告算起约三年，提醒投资者监管时间表不可预测；任何未来结构变化（进一步扩展牌照、推出需新审批的产品，或国际扩张）都可能同样漫长。Creditas 通过最后更新于 March
              2025（version 3）的隐私政策、独立伦理渠道，以及截至 2025 年下半年的半年度 ouvidoria（ombudsman）报告来处理 LGPD
              义务。网络安全姿态通过两份独立信息安全政策披露——一份面向金融科技实体，一份面向 SCD——另有 AML/CFT 政策（PLDFT）。不过，研究集中没有找到公开 SOC 2、ISO 27001
              或同等第三方认证，也没有找到数据泄露或重大事件披露。独立安全认证的证据缺口，对评估 Creditas B2B 平台和 API 的机构投资者及企业客户都很重要。若无法维持 BCB
              合规、银行子公司触发资本充足率违规，或遭遇执法行动，运营可能暂停，投资逻辑会立即受损。
