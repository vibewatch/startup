  - id: FI001
    title: 收入模型桥：抵押活动如何转化为毛利
    type: flow
    summary: 追踪有抵押资产（房产、汽车、工资）如何经过放款、贷款账本、利息计提、IFRS 拨备和融资成本，最终落到披露毛利。
    data:
      nodes:
        - id: borrower-asset
          label: 借款人资产（房产 / 汽车 / 工资）
          description: 借款人提供的抵押物；决定产品类别和 LTV
        - id: origination
          label: 贷款发放
          description: 通过 FIDC/CRI 证券化或银行存款供资的有抵押贷款；Q1-26 为 R$1.1bn/季度
        - id: loan-portfolio
          label: 贷款组合（R$7.6bn，Q1-26）
          description: 所有有抵押贷款的未偿本金；随净放款增加、随还款减少
        - id: interest-income
          label: 总利息收入
          description: 向贷款组合收取的合同利息；按产品挂钩 CDI/IPCA
        - id: ifrs-provision
          label: IFRS 拨备费用
          description: 预期信用损失在放款时计提；增长期成本前置；2026 年方法调整后收紧
        - id: funding-cost
          label: 融资成本（挂钩 CDI）
          description: 为挂钩 CDI 的 FIDC/CRI 证券化支付利息；随 SELIC 上升；部分由 Andbank 存款抵消
        - id: gross-profit
          label: 毛利（R$253.5mn Q1-26，40.0% 利润率）
          description: 利息收入减拨备费用和融资成本；向队列层面目标收敛
      edges:
        - from: borrower-asset
          to: origination
        - from: origination
          to: loan-portfolio
        - from: loan-portfolio
          to: interest-income
        - from: interest-income
          to: ifrs-provision
          label: 扣除
        - from: interest-income
          to: funding-cost
          label: 扣除
        - from: interest-income
          to: gross-profit
          label: 扣除拨备 + 融资成本后净额
    approximationNotes: 新闻稿没有单独披露拨备费用和融资成本；各自规模由 GP 利润率压缩叙事推断。Andbank 存款对融资成本的贡献尚未量化。
