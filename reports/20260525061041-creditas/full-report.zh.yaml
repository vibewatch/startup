      - number: '4.3'
        title: 资金组合和资本充足性：股权 + 70 多次资本市场发行 + 银行牌照
        blocks:
          - type: paragraph
            body: >-
              Creditas 的资本结构包括股权、债务资本市场融资及收购银行经营产生的存款。公司披露，截至 2025 年 12 月 G 轮，七轮融资累计募集 US$987mn；G 轮估值为 US$3.3bn。IR 网站列出
              70 多次资本市场发行，并将债券与证券化产品分列。经审计文件披露了应付 FIDC 份额持有人的金融负债，以及借款和存款。这些是不同类别的负债，不能一概视为可自由支配的公司现金。


              2025 年完整合并资产负债表已公开。截至 2025 年 12 月 31 日，现金及现金等价物为 R$777.086mn，总资产为 R$9,234.457mn，总负债为 R$8,855.051mn，权益为
              R$379.406mn。存款合计 R$3,567.477mn，附注 15 明确其全部来自 Andbank 业务。相当一部分存款已质押用于结构化贷款；收购带来的存量存款，不等于同额资金可新增投入 Creditas
              放款。附注 15 和 16 披露存款期限，以及与 IPCA、CDI 挂钩的 FIDC 负债。相较证券化融资究竟节省多少成本，仍需同口径比较，不能假定所有负债采用相同指数或承担相同成本。


              完整现金流量表也已公开。2025 年经营活动现金净流出为 R$548.224mn，2024 年则为净流入 R$130.013mn。2025 年投资活动现金净流入为 R$91.145mn，筹资活动现金净流入为
              R$682.127mn；计入汇率影响前，现金增加
              R$225.048mn。合并现金流包含贷款、融资和收购等变动，年度经营现金流出与会计亏损均不能单独作为每月公司烧钱速度。管理层提出的现金中性约束，仍需与财务报表中的现金流口径调节，不能直接证明贷款组合增长不消耗外部资本。


              管理层报告还披露，2025 年 12 月 Equity Ratio 为 62.7%，管理层目标为超过 15%。该比率以调整后权益为分子、风险资产为分母，既非普通会计权益除以总资产，也非标准监管资本比率。KPMG
              明确不对管理层报告发表鉴证结论。已披露的公司债务契约框架，不等于完整的当前证券化契约清单或压力情景余量。同样，2025 年 12 月集团现金不能回答 Q1-26
              可用公司现金、实体间资金划转限制、月度烧钱速度或未来 12 个月现金跑道。
