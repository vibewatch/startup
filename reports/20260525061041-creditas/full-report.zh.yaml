  - id: FR002
    title: 风险传导图：核心风险如何流入 Creditas 的估值和运营
    type: dag
    layout: wide
    summary: 两条杀伤力最大的路径都收敛到估值：SELIC 高企挤压利润率、拖慢盈利；整合或信用问题会放大运营亏损，堵住 IPO 路径。
    data:
      nodes:
        - id: r1
          label: SELIC 持续高位
          detail: BCB 政策利率维持高位；预计 2026 年 SFN 信贷增速降至 8 %。
        - id: r2
          label: 证券化资金成本上升
          detail: FIDC/CRI 结构按 CDI 定价；每次 SELIC 变动都会立刻推高成本。
        - id: r3
          label: 毛利率被挤压
          detail: GP 利润率 Q4-25 降至 36.2 %，低于 40 % 目标；Q1-26 回升至 40.0 %。
        - id: r4
          label: 运营盈亏平衡推迟
          detail: 运营亏损从 Q4-25 的 R$80.9 mn 收窄至 Q1-26 的 R$34.9 mn；盈利路径被拉长。
        - id: r5
          label: Andbank 整合摩擦
          detail: Q4-25 损益表已看到成本并表；审慎合规要求是新增负担。
        - id: r6
          label: IFRS 拨备前置
          detail: 放款快速增长会推高前置拨备，压缩报表利润率。
        - id: r7
          label: NPL / 信用质量恶化（潜在）
          detail: 产品级 NPL 未披露；应计方法调整意味着审查更严。
        - id: r8
          label: 客服 / 声誉缺口
          detail: Reclame Aqui 6.4/10，低于 Nubank 的 8.6/10；重复业务意愿 46 %。
        - id: r9
          label: CAC 压力与流失风险
          detail: NPS 偏弱会迫使公司花更多营销费用来补回流失客户。
        - id: r10
          label: 竞争侵蚀（Nubank / 银行）
          detail: Nubank 进入薪资扣款贷 / 抵押贷垂直领域，CAC 更低、信任度更高。
        - id: r11
          label: 估值 / IPO 路径受损
          detail: 已比 Series F 峰值低 31 %；进一步亏损或估值下调轮会拖延退出。
        - id: r12
          label: 投资逻辑破裂：资本不足 / 被迫重组
          detail: 如果未达盈利目标且资本市场关闭，契约或稀释风险会上升。
      edges:
        - from: r1
          to: r2
          label: 直接推高
        - from: r2
          to: r3
          label: 挤压
        - from: r3
          to: r4
          label: 拉长路径
        - from: r5
          to: r4
          label: 增加成本
        - from: r6
          to: r3
          label: 前置压力
        - from: r7
          to: r6
          label: 放大
        - from: r8
          to: r9
          label: 推高
        - from: r9
          to: r4
          label: 恶化
        - from: r10
          to: r9
          label: 加剧
        - from: r4
          to: r11
          label: 损害
        - from: r11
          to: r12
          label: 可能升级为
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR008
      - CR026
      - CR039
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 该建议来自权衡：运营改善和战略资金可选性在变好，但信用质量不透明、消费者声誉拖累和未解尽调缺口抵消了上行。
    data:
      nodes:
        - id: evidence-base
          label: 证据基础（Q1-26 财务、Series G 轮、BCB 数据、消费者声誉）
        - id: operating-metrics
          label: 运营指标（R$633mn 收入、40% GP 利润率、R$34.9mn 运营亏损）
        - id: adverse-signals
          label: 反向信号（NPL 不透明、6.4/10 声誉、SELIC 14.75%）
        - id: valuation-context
          label: 估值背景（US$3.3B Series G 轮，较 Series F 低 31%，Andbank 战略锚点）
        - id: diligence-gaps
          label: 尽调缺口（NPL、现金、优先清算瀑布、经审计 P&L）
        - id: bull-triggers
          label: 乐观触发因素（Q3-26 前盈亏平衡、存款爬坡、SELIC 降息）
        - id: bear-triggers
          label: 悲观触发因素（SELIC 持续、NPL 意外、利润率压缩）
        - id: recommendation
          label: 建议：观察 / 有条件跟踪，偏好入场估值为 US$2.5-3.0B
      edges:
        - from: evidence-base
          to: operating-metrics
        - from: evidence-base
          to: adverse-signals
        - from: operating-metrics
          to: valuation-context
        - from: adverse-signals
          to: valuation-context
        - from: valuation-context
          to: diligence-gaps
        - from: bull-triggers
          to: recommendation
        - from: bear-triggers
          to: recommendation
    claimRefs:
      - CV001
      - CV010
      - CV015
      - CV020
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 按收入倍数框架看，纪律性入场价与当前 Series G 估值之间几乎没有多少估值余地。
    data:
      series:
        - name: 隐含入场估值（US$B）
          points:
            - label: 4x 收入（悲观底部）
              value: 2
            - label: 5x 收入（目标入场）
              value: 2.5
            - label: 6x 收入（纪律性入场）
              value: 3
            - label: 6.6x 收入（Series G 轮）
              value: 3.3
            - label: 8x 收入（基准退出）
              value: 4
            - label: 10x 收入（乐观）
              value: 5
    claimRefs:
      - CV012
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 回报结果仍高度取决于入场价，以及悲观情景最终只是暂时放缓还是信用质量重估。
    data:
      items:
        - label: 悲观情景（US$3.3B 入场）
          low: -39
          mid: -28
          high: -15
          unit: '% total return (5yr)'
          note: SELIC 持续 + NPL 意外 + 声誉拖累
        - label: 基准情景（US$3.3B 入场）
          low: 6
          mid: 22
          high: 36
          unit: '% total return (5yr)'
          note: 2027 年中左右盈亏平衡，并以 US$3.5-4.5B 退出
        - label: 乐观情景（US$3.3B 入场价）
          low: 50
          mid: 80
          high: 112
          unit: '% total return (3-4yr)'
          note: 到 Q3-26 实现盈亏平衡，银行牌照释放收益，并以 US$5.5-7.0B 退出
        - label: 最佳入场价（US$2.5B）
          low: 20
          mid: 55
          high: 120
          unit: '% total return (5yr)'
          note: 情景不变，但较 Series G 估值折让 24%
    claimRefs:
      - CV015
      - CV019
      - CV032
      - CV037
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 评分卡在市场机会、战略融资余地，与披露薄弱、未解信用风险之间权衡。
    data:
      items:
        - label: 市场机会
          value: 7
          note: 巴西有担保贷款市场大、渗透率低，但 BCB 利率逆风仍在
        - label: 收入验证
          value: 6
          note: Q1-26 收入 R$633mn、同比增长 23%，证明规模，不证明盈利能力
        - label: 竞争护城河
          value: 7
          note: 银行牌照叠加 DCM 基础设施，以及十年经营记录
        - label: 单位经济模型
          value: 5
          note: 40% GP 毛利率是积极信号，但队列经济性仍无法用公开资料验证
        - label: 风险校准
          value: 4
          note: NPL 不透明、SELIC 敞口、IFRS 收紧，以及消费者口碑偏弱
        - label: 估值吸引力
          value: 5
          note: 一家亏损放贷机构按 6.6x 收入估值，并不便宜；不过 Andbank 提供战略支持
        - label: 证据完整性
          value: 5
          note: 关键缺口仍是 NPL、现金、经审计多年 P&L 和优先股条款
    claimRefs:
      - CV009
      - CV012
      - CV017
      - CV020
      - CV033
      - CV040
