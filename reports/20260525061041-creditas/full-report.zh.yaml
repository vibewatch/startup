  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Creditas
        - 专业抵押贷款机构
        - R$7.6bn 组合；US$108m Series G 后估值 US$3.3bn；SCD 叠加银行牌照选择权
        - 拥有抵押物的家庭、CLT 员工、雇主
        - 在房产抵押贷、车辆抵押贷、薪资贷、correspondentes 和雇主渠道上，留存公开栈最深
        - 仍在亏损，日常银行触达窄于综合银行或数字银行
      - - Nubank
        - 数字银行 / 相邻直接贷款方
        - 公开数字银行生态，由 App 触达、资产负债表供给资金
        - 大众消费者、薪资贷用户、FGTS 用户、个人贷款借款人
        - 留存样本中最强的数字品牌和客服标杆
        - 留存官方页面未显示房产或车辆抵押贷
      - - Banco Inter
        - 数字银行 / 相邻贷款方
        - 公开数字银行，贷款伞面宽，并有官方薪资代扣贷渠道
        - App 优先消费者和薪资贷借款人
        - 综合银行 App，带数字化薪资贷分发
        - 留存公开页面对抵押深度和定价细节披露稀疏
      - - Itaú
        - 既有综合银行
        - 大型上市银行，以存款供给资金，分发能力完整
        - 主流零售客群、薪资贷借款人、投资者、房产业主
        - 留存证据清楚显示个人信贷、薪资贷、房产抵押贷和投资者关联信贷
        - 数字化差异化不如 Nubank 明显，定价透明度也不完整
      - - Bradesco
        - 既有综合银行
        - 大型上市银行，以存款供给资金，渠道覆盖全国
        - 大众零售客群和薪资贷借款人
        - 贷款和融资菜单宽，并具备全渠道触达
        - 留存产品页面对详细定价和抵押产品细节披露较薄
      - - Santander
        - 既有综合银行
        - 大型上市银行，以存款供给资金，零售触达广
        - 主流借款人和薪资关联客群
        - 综合银行分发能力和宽口径贷款中心
        - 主要基准中留存信任分最低，留存页面细节有限
      - - Caixa / BB INSS 薪资代扣贷
        - 政府关联替代品 / 既有渠道
        - 以存款供给资金的既有机构，具备福利关联分发和长期限薪资贷产品
        - 退休人员、养老金领取者、薪资关联借款人
        - 直连 INSS 或薪资贷通道、网点、代理点和可携带性
        - 用例窄于完整抵押信贷平台
      - - FGTS 预支 / 劳动者信贷渠道
        - 替代产品组
        - 由银行和 App 分发的短周期信贷，不依赖硬资产抵押
        - 有 FGTS 余额或 CLT 薪资的工人
        - 用更少材料快速获得工资关联流动性
        - 票额低于房产抵押贷，资金灵活性也更弱
      - - Rebel
        - 无抵押 fintech
        - 风投支持的数字个人贷款方；2019 年披露融资 US$10m
        - 重视速度和简单线上申请的消费者
        - 快速、100% 线上个人贷款旅程
        - 没有留存证据显示其有抵押产品、薪资贷深度或成熟声誉
      - - 非正规放贷人 / agiotas
        - 现状替代品
        - 平台外、未受监管的资金
        - 缺少正式资格、被排除或承压的借款人
        - 材料很少即可即时获得资金
        - 惩罚性定价、监管风险，且没有机构信任
