      - number: '4.2'
        title: 毛利润动态：队列盈利能力高于 40%，披露利润率受 SELIC 和 IFRS 压缩
        blocks:
          - type: paragraph
            body: >-
              队列层面盈利能力与披露毛利率之间存在持续且重要的缺口。Creditas 一直表示，队列层面盈利能力仍高于其 40% 毛利润目标。公司的论点是，IFRS 在放款加速时前置拨备——因为预期信用损失在发放时确认——而高
              SELIC 会抬高证券化资金成本。即便底层队列经济健康，这两个因素也会在增长阶段压低披露毛利率。


              披露毛利率验证了这种挤压：Q3-25 毛利率为 37.1%（从 Q2-25 的 32.6% 回升），Q4-25 为 36.2%，Q1-26 达到 40.0%——首次达到公司目标的季度。Creditas 管理层将
              Q1-26 结果描述为证据，说明利润率正在「稳定，并向 40-45% 的目标队列层面盈利能力收敛」。绝对值上，季度毛利润从 Q4-25 的 R$211.2mn 增至 Q1-26 的 R$253.5mn（环比
              +20.0%，同比 +24.1%），创历史新高。按投资者关系首页，Q1-26 年化毛利润为 R$1,012mn。


              毛利润以下成本（销售、一般及行政费用加上客户获取成本）在 Q3-25、Q4-25 和 Q1-26 基本保持在每季度 R$288-292mn 附近，Q1-26 环比改善 -1.3% 至 R$288.4mn。CAC
              在 Q4-25 环比下降 -6.1%，同时放款环比增长 +10.7%，这是经营杠杆改善信号。由此，经营亏损从 Q2-25 的 R$87mn 收窄至 Q3-25 的 R$68.2mn、Q4-25 的
              R$80.9mn（这一步上升部分反映 Andbank 公司结构并表），以及 Q1-26 的 R$34.9mn——尽管放款规模显著更高，仍约为 Q1-22 经营亏损的十分之一。管理层近期指引是到 2026
              年底达到经营盈亏平衡。


              队列主张和披露结果之间的张力，是核心财务承保问题。公司没有发布 vintage 层面的 NPL
              曲线、非计息资产池的实际回收率，或可让独立投资者验证队列经济的贷款级损失数据。在这些披露出现前，公开来源既不能确认、也不能证伪队列盈利能力主张。
