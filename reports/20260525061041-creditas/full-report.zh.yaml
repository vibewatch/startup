      - number: '7.4'
        title: 声誉与客服风险：Reclame Aqui「Regular」评级和持续投诉量
        blocks:
          - type: paragraph
            body: >-
              在巴西，面向消费者的金融科技品牌对公共投诉平台高度敏感，Reclame Aqui 实际上承担了消费者保护记录的角色。Creditas 在 November 2025–April 2026
              六个月期间的评级为「Regular」，得分 6.4/10，处在倒数第二档。期间公司收到 1,949 起投诉，解决 70.1 %，只有 46.5 % 的评价者表示会再次交易。平均响应时间为 18 天 11
              小时，明显慢于最佳实践。平台全部记录历史显示 15,673 起活跃投诉，总量最大的类别为金融 / 银行（6,623）、银行产品相关（4,146）和贷款专项投诉（6,209）。最主要问题类别是不当计费（2,231
              起）和误导性广告（1,628 起）；后者尤其敏感，因为 Creditas 大量使用利率比较和“市场最低利率”营销语言。竞争背景进一步放大风险：Nubank 获得 RA1000 评级（8.6/10），解决率
              91.9 %，复购意愿 79.7 %，在每一项指标上都与 Creditas 形成鲜明对比。大型传统银行 Bradesco 得分 7.1/10（「Bom」）。与 Nubank 的差距尤其重要，因为 Nubank
              正在进入抵押和 consignado 贷款，正是 Creditas 竞争的垂直领域。如果客户体验继续落后，Nubank 的营销和信任优势会叠加产品竞争风险。Creditas 曾在 2020、2021 和 2022
              年获得 Reclame Aqui 最佳在线贷款公司奖，说明当前「Regular」评级可能反映业务扩张后复杂度和投诉量上升，而不是质量突然崩塌。即便如此，当前轨迹偏反向，需要持续监控。
