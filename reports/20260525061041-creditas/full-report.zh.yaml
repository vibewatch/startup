      - number: '6.2'
        title: 采用、增长与交叉销售策略
        blocks:
          - type: paragraph
            body: >-
              Creditas 的组合层面指标是目前最清晰的客户采用信号。总贷款组合从 Q3 2025 的 R$6.77bn 增至 Q1 2026 的 R$7.6bn，同比增长 +22.4%。Q1 2026 单季放款创纪录达到
              R$1.1bn（同比 +29.2%），公司称“所有贷款业务单元都保持强劲动能，Auto 和 Home Equity 单季量均创历史新高”。公司称自 2012 年以来累计放款超过 R$12.1
              billion，并为客户节省 R$6.2 billion。这些都是公司总体层面的说法，公开材料中没有按借款人数、平均贷款规模或产品级组合占比拆分。

              交叉销售是公司明示的客户扩张战略重点。管理层把“通过交叉销售扩张增长”描述为降低 CAC、显著提高单客收入的根本路径。Q4 2025 获客成本同比下降 0.9%、环比下降 6.1%，同时放款同比增长
              +35.4%，说明回流客户或合作伙伴带来的放款正在压低单位获客成本。不过，任何公开投资者沟通或产品页面都没有披露 NRR、GRR、流失率、队列留存数据或复借率。Q1 2026
              展望出现“高客户复购”表述，但没有量化。这是最主要的客户证据缺口：组合层面的采用轨迹可信，但个人客户生命周期层面完全没有得到验证。
