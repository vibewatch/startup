      - number: '3.5'
        title: 反向证据：既有银行赢在哪里，Creditas 面对哪些逆风
        blocks:
          - type: paragraph
            body: >-
              反对 Creditas 的案例是具体的，不是理论性的。最干净的反证信号是客户体验：Reclame Aqui 显示，Creditas 在分数、响应时间、解决率和客户复购意愿上明显落后 Nubank。Creditas
              经常把自己定位为传统信贷的更好数字替代方案，这个差距很重要。第二个反向信号是财务。Creditas 正在增长，Q1-26 利润率改善，但公司仍亏损；Q4-25 明确提到高 SELIC 环境；Banco
              Central 自己的 2025 政策报告也说，即便私营工资代扣扩张，偏紧条件仍限制信贷供给。Andbank 牌照可能有帮助，但还没有抹掉高利率周期中专业贷款机构的经济现实。

              第三，估值本身带有警示。2025 年 Series G 估值 US$3.3 billion，较 2022 年 Series F 峰值 US$4.8 billion 明确重置
              31.25%，说明公开市场式倍数压缩已经进入股权结构。最后，只要速度胜过复杂度，Creditas 就会脆弱：Rebel 可以在简单数字无抵押信贷上赢，Caixa 和 BB 可以在工资代扣和 INSS
              分销上赢，FGTS 或个人贷款替代品也会在借款人没有抵押品或不想抵押时赢。因此，Creditas 更像一个位置不错的专业机构，而不是已经锁定整个品类的公司。
