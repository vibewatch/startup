    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立故事和商业模式
        blocks:
          - type: paragraph
            body: >-
              Creditas 是一家总部位于巴西 São Paulo 的非上市金融科技公司。法律实体为 Creditas Financial Solutions, Ltd.，自 2019 年起以 Sociedade de
              Crédito Direto（SCD）身份获得 Banco Central do Brasil 授权运营。经审计文件记载，Banco Andbank Brasil 收购于 2025 年 11 月 28
              日完成，公司于 2025 年 12 月 1 日公告。集团因此纳入一家持有 banco múltiplo 牌照的银行，而非单独购入牌照。截至 2025 年 12 月 31 日，Creditas 直接及间接持有该银行
              100% 股权。监管范围随之扩大，也带来潜在融资成本收益，但尚不能据此证明成本节省已兑现。

              公司由 Sergio Furio 于 2012 年创立，最初名为 BankFacil。Furio 是西班牙人，在金融市场有十二年以上经验。当时的女友、后来的妻子 Silvia Furio
              提醒他关注巴西银行高昂的利差，促使他发现了创业机会。BankFacil 起步于金融产品比价及获客博客，随后转向直接放贷。最初八个月未能盈利，Furio 卖掉 New York 公寓以延长现金跑道。2013
              年与已经营抵押信贷的 GranaAqui 合并，加快了业务转型。到 2016 年，BankFacil 已用自有资产负债表跑通信贷全流程，之后更名为 Creditas，体现其向完整抵押信贷平台转型。

              Creditas 自称「拉美领先的抵押贷款、保险和投资解决方案平台」。核心业务是有担保消费信贷：借款人以房产（Home Equity）、汽车（Auto Equity）或工资（consignado
              privado）提供抵押或还款保障，公司以低于无抵押消费贷机构的利率承保，并赚取资本市场融资成本与借款人收益率之间的利差。抵押品降低违约风险、延长贷款期限（Home Equity 最长 240
              个月），也加深客户关系、增强黏性。公司将策略称为「交叉销售」：用核心信贷关系分销保险、雇主金融福利、工资预支产品，最终借助 APW（Andbank Wealth）的非控股 25%
              权益提供投资服务。文件将这笔投资的日期列为 2025 年 11 月 28 日，并明确指出，按 IFRS 10，该权益不赋予控制权；它与银行股权是两项不同权益。截至 Q1-26，Creditas 披露累计放款超过
              R$12.1B，并按现行市场利率口径为客户节省超过 R$6.2B。
