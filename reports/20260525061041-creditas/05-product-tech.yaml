  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: tech-infrastructure
      missingEvidence: >-
        Cloud provider, core banking platform, database layer, microservices topology, CI/CD pipeline
        architecture, and infrastructure SLA commitments.
      whyItMatters: >-
        Without knowing the infrastructure stack, operational resilience, disaster recovery, and scalability
        under load cannot be assessed. Collateralized lending requires high uptime for origination and lien
        registration workflows.
      diligencePath: >-
        Request technical architecture documentation in due diligence; review engineering blog posts,
        job postings referencing infrastructure stack, or engineering conference talks from Creditas staff.
      relatedQuestionRefs: [QE008, QE018, QE019, QE021]

    - type: missing-source
      severity: material
      topic: security-certifications
      missingEvidence: >-
        ISO 27001, SOC 2 Type II, or PCI DSS certification evidence for Creditas fintech and SCD entities.
      whyItMatters: >-
        Security certification status is a standard investor and enterprise-customer diligence checkpoint.
        Absence of public evidence is a gap, not a confirmed absence.
      diligencePath: >-
        Request certificates directly; check BCB-published audit requirements for SCD entities; ask for
        penetration test results and bug bounty program details.
      relatedQuestionRefs: [QE009, QE013, QE023]
      relatedTableRefs: [TE004]

    - type: missing-source
      severity: minor
      topic: mobile-app-ratings
      missingEvidence: >-
        Current Google Play star rating, total review count, and iOS App Store presence and ratings for the
        Creditas mobile app.
      whyItMatters: >-
        App store ratings provide an independent customer satisfaction and product-quality signal not
        controlled by the company.
      diligencePath: >-
        Re-fetch the Google Play listing with JavaScript rendering enabled; check Apple App Store for
        equivalent listing under developer ID matching Creditas Financial Solutions.
      relatedQuestionRefs: [QE015, QE024]

    - type: enumeration-incomplete
      severity: minor
      topic: partner-panels
      missingEvidence: >-
        Names of the up to 16 auto insurance underwriters, up to 5 vehicle financing institutions, and
        up to 8 mortgage banks in the Creditas multi-bank panels.
      whyItMatters: >-
        Panel composition determines rate competitiveness, panel concentration risk, and ability to replace
        a partner if terms deteriorate.
      diligencePath: >-
        Request current partner lists in due diligence; check SUSEP and BCB registrations for correspondente
        and corretora partnerships.
      relatedQuestionRefs: [QE011, QE017]
      relatedTableRefs: [TE001]
    - type: missing-source
      severity: material
      topic: employer-adoption
      missingEvidence: >-
        Named employer clients of Creditas Benefícios, adoption statistics (number of employers,
        total employees covered), and employer churn or retention rates for the B2B benefits platform.
      whyItMatters: >-
        Without named employer clients and adoption scale, the B2B contribution to consignado origination
        and the revenue durability of the benefits platform cannot be assessed from public evidence.
      diligencePath: >-
        Request anonymized employer client list, top-3 concentration data, and eSocial payroll integration
        coverage in due diligence; check Glassdoor, LinkedIn, or job listings for references to Creditas
        Benefícios implementations.
      relatedQuestionRefs: [QE010, QE025]

    - type: private-evidence-only
      severity: material
      topic: collateral-operations
      missingEvidence: >-
        Time-to-disbursement benchmarks by product, cartório integration SLA, DETRAN electronic lien
        processing times, and judicial execution statistics for defaulted loans.
      whyItMatters: >-
        Collateral management efficiency is central to Creditas' competitive differentiation; operational
        delays directly affect borrower experience and cost structure.
      diligencePath: >-
        Request operational KPIs in due diligence; review cartório partner contracts; check BCB supervisory
        data on SCD operational metrics.
      relatedQuestionRefs: [QE003, QE012, QE016, QE022, QE026]
      relatedTableRefs: [TE003]
