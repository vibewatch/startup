callouts:
  - calloutType: strength
    title: "Three-Tier Regulatory Architecture Lowers Cost of Capital"
    body: >-
      Owning Banco Andbank Brasil (banco múltiplo) in addition to the SCD and correspondente authorizations
      reduces funding costs and broadens the product scope. The banking license allows institutional and
      private banking clients (via Andbank Wealth) to invest in Creditas-structured credit funds, diversifying
      the liability base and reducing dependency on ABS-only funding.
    claimRefs:
      - CE001
      - CE031
      - CE032

  - calloutType: strength
    title: "AI-First Platform Producing Measurable Efficiency Gains"
    body: >-
      Q1 2026 data shows annualized revenue per headcount rising from R$1.1M to R$1.4M (+27%) in six months.
      AI-led pull requests compress the product release cycle from three weeks to four days. Collections AI
      agents targeting end-to-end early-stage resolution in minutes represent a concrete operational
      deployment—not just a roadmap aspiration.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE036

  - calloutType: risk
    title: "Deep Technology Infrastructure Entirely Undisclosed"
    body: >-
      Cloud provider, core banking platform, microservices topology, CI/CD pipeline, and SLA commitments are
      absent from all public materials. No ISO 27001, SOC 2, or PCI DSS certificates were found. This is a
      material diligence gap: infrastructure risk and resilience cannot be assessed from public evidence alone.
    claimRefs:
      - CE013
      - CE015

  - calloutType: risk
    title: "Multi-Entity Counterparty Structure Adds Operational Complexity"
    body: >-
      Loans originate under multiple legal entities (Creditas SCD, Oxy Companhia Hipotecária, Socinal S.A.)
      with partner correspondentes adding a fourth origination layer. Government platform dependencies
      (eSocial, DETRAN, cartório) introduce single-point disruption risk. The prudential conglomerate
      compliance requirements post-Andbank acquisition are a recent addition whose full operational scope
      is not yet publicly measurable.
    claimRefs:
      - CE022
      - CE023
      - CE031

