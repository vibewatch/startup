  - id: ai-automation-roadmap
    title: AI, Automation, and Roadmap
    body: >-
      The Q3 2025, Q4 2025, and Q1 2026 results releases describe an accelerating AI-first investment program
      with tangible operational outcomes. In Q4 2025, Creditas reported deploying continuous funnel automation
      to achieve CAC decline of 0.9% YoY and 6.1% QoQ while origination grew +35.4% YoY—demonstrating
      structural marketing efficiency rather than simply spending more per loan. In Q1 2026, the company
      disclosed two specific AI deployments: (1) AI agents handling end-to-end early-stage collections
      experience, targeting resolution in minutes rather than hours or days; and (2) AI-led pull requests in
      software development compressing the product release cycle from three weeks to four days. Productivity
      per employee (annualized revenues per headcount) rose from R$1.1M to R$1.4M (+27%) over the six months
      to Q1 2026, attributed in part to these AI-driven gains. A more evolved Auto Equity credit scoring
      model deployed in Q4 2025 enabled "aggressive partner-led growth while preserving asset quality"—the
      most specific public reference to a proprietary ML model.

      New CTO/COO Ricardo Forcano (ex-BBVA CIO/CHRO, appointed December 2025) is overseeing these
      initiatives with prior experience in large-scale technology modernization at a European bank. The Q1
      2026 outlook frames Creditas as "increasingly evolving into an AI-first platform, embedding automation
      into every layer of our operations," including customer acquisition, credit management, and back office.
      Annual origination growth target for 2026 is stated at 25%+, with operational break-even targeted by
      year-end 2026. No public roadmap dates, product changelog, or developer release notes were found; this
      is a material roadmap evidence gap.
    claimRefs:
