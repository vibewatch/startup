company:
  name: Creditas
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Creditas operates a multi-product collateralized lending and benefits platform backed by three regulatory
    tiers—Correspondente Bancário, Sociedade de Crédito Direto, and the newly acquired Banco Andbank Brasil
    banking license—enabling lower-cost funding and broader product capability. The product suite spans nine
    modules covering consumer lending (Home Equity, Auto Equity, Consignado), insurance brokerage, vehicle
    and mortgage financing, and a B2B employer benefits stack. Technology differentiation centers on funnel
    automation and an accelerating AI-first strategy: AI agents for early-stage collections, an upgraded Auto
    Equity scoring model deployed in Q4 2025, and AI-assisted software development compressing release cycles
    from three weeks to four days. Deep technical infrastructure (stack, cloud, core banking systems, ISO
    certifications) remains entirely undisclosed and constitutes a material diligence gap.
sections:
  - id: product-suite
    title: Product Suite and Collateral Mechanics
    body: >-
      Creditas delivers financial products organized around three collateral types—real estate, vehicles, and
      payroll—plus an insurance brokerage, multi-bank financing marketplace, and a corporate benefits platform.
      Home Equity (Empréstimo com Garantia de Imóvel) offers R$50K–R$3M at rates from 1.09%/month + IPCA with
      up to 240-month tenors, targeting homeowners who retain possession throughout the loan term. Properties
      with at least 50% of value already paid can be used even if they carry an outstanding mortgage balance.
      Auto Equity (Empréstimo com Garantia de Veículo) covers R$5K–R$150K at rates from 1.49%/month over up
      to 60 months; financed vehicles are accepted as collateral and remain in daily use. Both products leverage
      collateral to achieve interest rates substantially below the personal loan (6.47%/month) and credit-card
      revolving (14.06%/month) benchmarks published on creditas.com product pages.

      Payroll (Consignado Privado) targets CLT workers via payroll deduction through eSocial and the Carteira
      de Trabalho Digital, offering R$300–R$70K at rates from 1.49%/month for up to 60 months. The January
      2025 expansion of Brazil's private-sector consignado regulation (Crédito do Trabalhador) broadened
      Creditas' eligible population to MEIs, rural workers, and domestic workers. Auto Insurance operates as
      an online brokerage (corretora) aggregating up to 16 underwriting partners for comparison shopping and
      placement without Creditas bearing underwriting risk. Vehicle and mortgage financing complete the
      marketplace: up to five banks for vehicle financing and up to eight banks for multibanco mortgage
      simulation. Creditas Benefícios layers a B2B employer stack atop the consumer platform: a zero-cost
      7-category Mastercard benefits card accepted at 2+ million locations, a zero-cost payroll advance (up
      to 40% of monthly salary), and a corporate financial education program backed by IBOPE Inteligência
      research.
    claimRefs:
