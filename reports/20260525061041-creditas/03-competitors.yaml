callouts:
  - calloutType: strength
    title: Secured-credit depth is Creditas' clearest competitive edge
    body: >-
      On retained public evidence, Creditas is the only player here that visibly combines home equity, vehicle equity,
      payroll, correspondentes, and employer-channel distribution in one product stack.
    claimRefs:
      - CP002
      - CP003
      - CP006
      - CP007
      - CP041

  - calloutType: risk
    title: Nubank disproves any assumption that digital UX is already a moat for Creditas
    body: >-
      Reclame Aqui puts Nubank far ahead of Creditas on score, resolution, repeat-intent, and response time, which means
      Creditas cannot currently claim best-in-class digital trust despite its fintech positioning.
    claimRefs:
      - CP029
      - CP030
      - CP037

  - calloutType: insight
    title: The key battleground is payroll and distribution, not only secured underwriting
    body: >-
      Caixa, Banco do Brasil, Nubank, and other banks can attack the same borrower need through payroll, INSS, FGTS, and
      app distribution even without matching Creditas on property- and vehicle-backed depth.
    claimRefs:
