chapter:
  number: 3
  title: Competitors
  summary: >-
    Creditas competes less with one like-for-like secured-lending fintech than with a stack of alternatives: Nubank and
    Inter on digital convenience, Itaú/Bradesco/Santander on funding and distribution, Caixa/BB on payroll and INSS
    rails, and FGTS or unsecured products on borrower speed. Creditas' edge remains unusual public depth in home and
    vehicle equity plus hybrid partner distribution, but adverse evidence is material: weaker Reclame Aqui outcomes than
    Nubank, persistent losses in a high-Selic backdrop, and a down-round from US$4.8B to US$3.3B.
sections:
  - id: landscape
    title: "Landscape: direct peers, incumbents, adjacent lenders, and substitutes"
    body: >-
      Creditas does not face only one clean comparator in Brazil. The direct overlap starts with lenders that can solve
      the same borrower job of “raise cheaper cash against a predictable repayment source,” but the competitor set splits
      into very different classes. Nubank and Banco Inter are adjacent digital-bank peers: they are strong in app-led
      unsecured, payroll, and in Nubank's case FGTS-linked offers, yet the retained official pages do not show the same
      home-equity and vehicle-equity depth that Creditas advertises publicly. Itaú is the strongest direct incumbent
      comparator because its official pages visibly combine personal credit, payroll lending, and home equity. Bradesco
      and Santander matter less because the retained pages are thinner on detail, but as universal banks they still sit in
      the same decision set for borrowers.

      The substitute set is just as important. Caixa and Banco do Brasil attack from government-linked or payroll-linked
      rails, especially in Crédito do Trabalhador and INSS consignado, where branch reach, benefit access, and portability
      can beat specialist product depth. FGTS advance and unsecured personal loans win whenever speed matters more than
      lowest possible rate. At the far edge, the federal government's own messaging around getting workers “out of the
      hands of agiotas” confirms that informal lenders remain part of the status quo for borrowers excluded from formal
      collateral or payroll channels. In short, Creditas' competition is a layered market of specialists, digital banks,
      incumbents, and substitutes rather than one-to-one fintech rivalry.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP014
      - CP015
