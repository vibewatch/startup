  - id: competitor-profiles
    title: "Competitor profiles: who each player is and what they sell"
    body: >-
      Creditas enters this chapter as a specialist rather than a full-stack bank. Official company and results material
      show a R$7.6 billion portfolio, record Q1-26 origination of R$1.1 billion, more than R$12.1 billion lent
      cumulatively, and a product set anchored in home equity, vehicle equity, payroll credit, correspondentes, and
      employer-benefit channels. That is a meaningful operating scale for a private Brazilian fintech, and independent
      review sources consistently describe Creditas as one of the country's largest secured-credit platforms. The company
      is also no longer only an SCD with capital-markets funding: after the Andbank transaction it sits inside a broader
      prudential perimeter with banking-licence optionality.

      The peer set clusters by funding model. Nubank and Inter are digital-bank ecosystems with far broader everyday-bank
      reach but shallower retained public evidence on collateralized products. Itaú, Bradesco, and Santander are public,
      deposit-funded incumbents whose advantage is not fintech-like novelty but the ability to bundle credit into current
      accounts, payroll relationships, branches, and existing customer trust. Rebel is the closest fintech-style contrast:
      a venture-backed, fully online unsecured lender optimized for simple personal credit rather than collateralized depth.
      Caixa and Banco do Brasil are not startup peers, but in practical underwriting they compete for the same payroll and
      retirement-linked borrower flows that Creditas wants to capture.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP025
      - CP026
      - CP027
      - CP028
      - CP035
      - CP036
