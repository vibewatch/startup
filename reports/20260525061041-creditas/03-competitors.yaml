  - id: adverse-evidence
    title: "Adverse evidence: where incumbents win and where Creditas faces headwinds"
    body: >-
      The adverse case against Creditas is concrete, not theoretical. The cleanest disconfirming signal is customer
      experience: Reclame Aqui shows Creditas materially behind Nubank on score, response time, resolution, and customer
      willingness to return. For a company that often presents itself as a better digital alternative to traditional credit,
      that gap matters. A second adverse signal is financial. Creditas is growing and margins improved in Q1-26, but the
      company remains loss-making, Q4-25 explicitly cited a high-Selic environment, and Banco Central's own 2025 policy
      report says tighter conditions still restrict credit supply even as private payroll expands. The Andbank licence may
      help, but it has not yet erased the economics of a specialist lender in a high-rate cycle.

      Third, valuation itself carries a warning. The 2025 Series G at US$3.3 billion is an explicit 31.25% reset from the
      US$4.8 billion 2022 Series F peak, so public market-style multiple compression has already shown up in the cap table.
      Finally, Creditas is vulnerable wherever speed beats sophistication: Rebel can win on simple digital unsecured credit,
      Caixa and BB can win on payroll and INSS distribution, and FGTS or personal-loan substitutes can win when borrowers do
      not have, or do not want to pledge, collateral. Creditas therefore looks more like a well-positioned specialist than a
      company that has already locked up the category.
    claimRefs:
      - CP009
