      - number: '2.2'
        title: 'Sizing: TAM, SAM, SOM through multiple evidence lenses'
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for Brazilian secured lending is inherently lens-dependent. Banco Central data gives
              the broad macro backdrop — SFN credit still expanded 11.5% in 2024, the 2025 forecast was first revised
              down to 7.7% in March and later revised up to 8.8% in September, and 2026 was projected at 8.0% — but that
              macro lens is too broad for a direct Creditas TAM. More useful submarket lenses come from ABECIP’s
              free-funding real-estate data, government and CAIXA evidence on the private payroll/Crédito do Trabalhador
              corridor, and an auto-finance demand proxy from Mordor. Each of these captures a different part of the
              addressable secured-borrower universe.

              The result is a layered sizing view rather than a single “Brazilian secured lending market is X” claim. A
              conservative near-term SAM can be framed around roughly R$70B–95B of equivalent annual opportunity by
              combining home-credit and payroll lenses with overlap haircuts and without assuming Creditas can capture
              generic auto lending. An upside TAM lens of roughly R$100B–140B emerges only if free-funding housing
              credit continues to expand and worker-credit rollout approaches the government’s four-year scenario.
              Creditas’ current SOM is much narrower and is best anchored in observed scale: R$7.6B portfolio and R$1.1B
              of quarterly origination in Q1-26.
