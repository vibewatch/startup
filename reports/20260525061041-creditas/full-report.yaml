      - number: '1.4'
        title: Financial performance, operating scale, and traction
        blocks:
          - type: paragraph
            body: >-
              Creditas provides quarterly financial results through its Investor Relations portal and via VEF's investor
              updates. The Q1-26 release (May 2026) shows a loan portfolio of R$7.6B (+22.4% YoY) supported by record
              origination of R$1.1B (+29.2% YoY). Annualised revenues stand at R$2.5B and annualised gross profit at
              R$1.012B, implying a ~40% gross profit margin — converging with the company's cohort-level target of
              40–45%. The Q1-26 operating loss narrowed to R$34.9M, roughly one-tenth of the Q1-22 level despite
              significantly higher origination volumes, underscoring the operational leverage the company is realising.

              Creditas has targeted cash-neutral operations since end-2023 and emphasises this as a guardrail against
              needing further equity capital. The company has issued 70-plus capital-markets instruments (FIDCs, CRIs,
              and FIIs), and the Andbank bank licence is expected to lower funding costs further by enabling direct
              deposit-taking and reducing reliance on securitisation spreads. Productivity per employee reached R$1.4M
              annualised in Q1-26, up from R$1.1M six months earlier.

              Key metrics not publicly disclosed include exact headcount, customer count, and net revenue retention
              rate. The absence of disclosed customer metrics is a standard information gap for a private company at
              this stage, but it limits comparisons with public-market fintech peers.

              At the product level, home equity loans offer up to R$3M with up to 240 months, auto equity up to R$150K
              with up to 60 months, and payroll consignado is offered to private-sector workers (CLT and MEI). The app
              on Google Play is the primary consumer channel.
