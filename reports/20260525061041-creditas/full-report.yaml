      - number: '7.4'
        title: 'Reputation and customer-service risk: Reclame Aqui ''Regular'' rating and persistent complaint volume'
        blocks:
          - type: paragraph
            body: >-
              Consumer-facing fintech brands are acutely sensitive to public-complaint platforms in Brazil, where
              Reclame Aqui serves as the de facto consumer-protection record. Creditas's rating for the six-month period
              November 2025–April 2026 is classified as "Regular" with a score of 6.4/10—the second tier from the
              bottom. In that period the company received 1,949 complaints, resolved 70.1 %, and saw only 46.5 % of
              reviewers say they would do business again. The average response time was 18 days and 11 hours, which is
              materially slower than best-in-class. Across all recorded history the platform shows 15,673 total active
              complaints, with the largest categories being financial/banking (6,623), bank-product related (4,146), and
              loan-specific complaints (6,209). The top problem categories are improper billing (2,231 complaints) and
              misleading advertising (1,628 complaints)—the latter being particularly sensitive given Creditas's heavy
              use of rate comparisons and "lowest rate in the market" marketing language. The competitive context
              sharpens the risk: Nubank carries an RA1000 rating (8.6/10) with a 91.9 % resolution rate and 79.7 %
              repeat-business intention—a stark contrast to Creditas's metrics on every dimension. Bradesco, a large
              incumbent bank, scores 7.1/10 ("Bom"). The gap to Nubank is particularly relevant because Nubank is now
              entering collateralised and consignado lending, the exact verticals where Creditas competes. If customer
              experience remains inferior, Nubank's marketing and trust advantage compounds the product-competition
              risk. Creditas did win the Reclame Aqui award for best online lending company in 2020, 2021, and 2022,
              suggesting the current "Regular" rating may reflect growing complexity and complaint volume as the
              business scaled, rather than a sudden quality collapse. Nevertheless, the current trajectory is adverse
              and demands monitoring.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
          - type: table
            tableRef: TR004
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
      - number: '7.5'
        title: 'Competition and channel-substitution risk: Nubank, incumbent banks, and e-Consignado market dynamics'
        blocks:
          - type: paragraph
            body: >-
              Creditas's core lending verticals—home equity, auto equity, and e-Consignado—face intensifying competition
              from three distinct sources. First, Nubank, the dominant Brazilian digital bank with 100+ million
              customers and an RA1000 reputation, has publicly launched consignado products (INSS, public-sector, and
              private CLT payroll) and is expanding into secured lending. Nubank's distribution
              advantage—already-onboarded customers requiring no new KYC—and its trust premium (Reclame Aqui 8.6 vs
              Creditas 6.4) mean it can undercut Creditas's customer acquisition cost in exactly the borrower segments
              Creditas targets. Second, Itaú, Bradesco, and Santander all offer home-equity and vehicle-equity loans and
              private consignado products through their branch and digital channels. While their digital UX and speed
              have historically lagged Creditas's, these incumbents have substantial balance-sheet funding advantages
              when SELIC is high: they fund at deposit cost rather than FIDC/CDI spreads, creating a natural rate
              advantage. Third, the e-Consignado payroll deduction market is subject to regulatory and
              employer-relationship dynamics; Creditas explicitly describes a "slow acceleration" in e-Consignado in Q4
              2025, normalising volumes only as it "gained visibility into unit economics and normalised operational
              processes," suggesting this vertical is still maturing rather than consolidated. The partner-channel model
              (API-driven origination, B2B employer relationships) partially insulates Creditas by locking in
              distribution at the employer level, but employer relationships can switch if a competitor offers better
              commission economics. Rebel, an unverified fintech in the receivables space, registered zero complaints on
              Reclame Aqui—too small to be material today but representative of a long tail of product-specific
              competitors that could erode niche sub-segments.
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
          - type: table
            tableRef: TR005
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
      - number: '7.6'
        title: 'Valuation and refinancing risk: 31 % down-round, deferred IPO, and investor-return pressure'
        blocks:
          - type: paragraph
            body: >-
              The move from Creditas's Series F valuation of US$4.8 billion (January 2022) to the Series G valuation of
              US$3.3 billion (December 2025) represents a 31 % nominal haircut over nearly four years. VEF, one of the
              most transparent institutional investors, disclosed that it converted its convertible notes into shares at
              the new lower valuation, writing down its prior mark by 17.8 % (from VEF's internal Q3-25 mark to the
              Series G price). The total equity raised across all seven rounds is US$987 million, and the last round was
              for only US$108 million—smaller than each of the three preceding rounds. In 2022, Brazilian media reported
              expectations of a US$10 billion IPO valuation; as of the run date no IPO process has been announced or
              confirmed. Multiple risk factors converge: (1) the company has not yet demonstrated operating
              profitability, which is a prerequisite for most LatAm public markets listings; (2) the Andbank acquisition
              introduces a more complex consolidated entity that requires additional auditor review and financial
              disclosure preparation; (3) global fintech public-market multiples compressed sharply after 2022 and have
              not fully recovered; (4) Brazilian capital markets are sensitive to SELIC, which directly affects listed
              financial equity multiples. The down-round also signals potential pressure on employee option-pool value,
              which can create talent-retention risk. Creditas has stated it is targeting a return to operational
              break-even "in the near-term," and 1Q26 shows meaningful improvement (operating loss narrowed from R$80.9
              mn to R$34.9 mn QoQ), but the gap between current performance and IPO-readiness remains material. Any
              further down-round or need for bridge capital before profitability would add significant
              investor-sentiment and dilution risk.
            claimRefs:
              - CR039
              - CR040
              - CR041
              - CR042
              - CR043
              - CR044
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR026
              - CR039
      - number: '7.7'
        title: 'Execution risk: product-breadth bandwidth, bank integration, and leadership transition'
        blocks:
          - type: paragraph
            body: >-
              Creditas now operates six or more distinct product lines (home equity, auto equity, e-Consignado,
              insurance, flexible employee benefits, vehicle financing, and property financing) plus a newly acquired
              banking subsidiary and a 25 % stake in a private-banking joint venture. Managing this breadth while
              pursuing 25 %+ annual portfolio growth and simultaneously integrating a bank creates material execution
              risk. The Q4 2025 results explicitly noted that operating costs rose partly due to "consolidation of
              Andbank corporate structure," indicating that integration friction is already appearing in the P&L.
              Creditas appointed Ricardo Forcano as CTO and COO in December 2025—the same month the bank acquisition
              closed. Forcano is an experienced executive with over two decades at major global institutions including
              BBVA, but he is new to Creditas as of the run date. The simultaneous arrival of a new top operational
              executive and the closing of a bank acquisition compounds execution uncertainty. Creditas's AI-first
              platform narrative is credible—Q1 2026 reports record productivity per employee (R$1.4 mn annualised vs
              R$1.1 mn six months prior), and management describes AI agents handling end-to-end early-stage collections
              and AI-accelerated software development compressing cycle times from three weeks to four days. However,
              AI-platform promises that outrun delivery have been a common pattern among fintech companies in similar
              growth phases, and no independent audit of the claimed productivity gains is available. The company has
              lent R$12.1 billion since founding and claims R$6.2 billion in customer savings, which provides credible
              operational history, but the banking-group integration adds a qualitatively different compliance and
              operational complexity layer that has no direct precedent in Creditas's track record.
            claimRefs:
              - CR045
              - CR046
              - CR047
              - CR048
              - CR049
              - CR050
              - CR051
          - type: table
            tableRef: TR006
            claimRefs:
              - CR045
              - CR046
              - CR047
              - CR048
              - CR049
              - CR050
              - CR051
      - number: '7.8'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criterion 1 – gross profit margin below 30 % for two consecutive quarters
            body: >-
              If SELIC remains elevated and the Andbank deposit base fails to offset securitisation funding costs, gross
              profit margin could fall below 30 %. At that level, even a cash-neutral operation would require external
              equity, and the terms of such capital would likely imply a further down-round. Monitor quarterly margin
              alongside BCB SELIC decisions and the disclosed annualised funding-cost data.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Kill criterion 2 – BCB enforcement action or capital-adequacy breach in the banking subsidiary
            body: >-
              A formal BCB enforcement action—or a disclosed capital-adequacy breach in Banco Andbank Brasil—would be an
              immediate thesis-break event. The banking licence is the gateway to the funding-cost reduction that
              justifies the Andbank acquisition premium. Any BCB action that restricts deposit-taking or lending
              operations in the subsidiary would negate the strategic rationale and destroy value rapidly.
            calloutType: risk
            claimRefs:
              - CR018
              - CR019
              - CR020
          - type: callout
            title: Kill criterion 3 – valuation falls below US$2 billion with no visible path to operational break-even
            body: >-
              If a further down-round (below US$2 B) is required before the company reaches operational break-even,
              investor fatigue, option dilution, and talent-retention pressures could trigger a self-reinforcing cycle.
              The current operating-loss trend (R$80.9 mn → R$34.9 mn in one quarter) is encouraging, but a reversal
              driven by credit-quality deterioration or integration cost overruns could restart that cycle.
            calloutType: risk
            claimRefs:
              - CR039
              - CR040
              - CR041
              - CR042
          - type: callout
            title: 'Primary diligence ask: NPL by product, securitisation maturity profile, and Andbank capital ratio'
            body: >-
              Three disclosures are required to form a well-grounded risk view that public evidence cannot provide: (1)
              product-level NPL rates and default curves by vintage; (2) the full liability schedule showing FIDC and
              CRI maturities and refinancing cliffs; (3) Banco Andbank Brasil's BCB-reported capital adequacy ratio and
              any conditions attached to the acquisition approval. Without these, the two highest-severity risks (credit
              quality and banking integration) carry material evidence gaps that preclude high-confidence underwriting.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR012
              - CR018
              - CR019
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Round context, reset valuation, and strategic floor support
        blocks:
          - type: paragraph
            body: >-
              The starting point for Creditas valuation is the clear reset from the January 2022 Series F peak to the
              December 2025 Series G. Series F raised US$260 million at a US$4.8 billion valuation with Fidelity and
              SoftBank in the syndicate, a mark struck in a much easier global capital environment when Brazil’s SELIC
              rate was materially lower and growth equity still rewarded revenue expansion over profitability. By
              contrast, Series G raised US$108 million at a US$3.3 billion post-money valuation, a 31.25% markdown from
              the 2022 peak. That makes the latest round unambiguously a down-round, but not a distressed one. The price
              was set at the same moment Creditas closed the acquisition of Bank Andbank Brasil, converting a multi-year
              strategic initiative into an operating banking licence and bringing Andbank in as both investor and
              acquired institution.


              That strategic configuration matters. The Series G lead is not a passive late-stage crossover fund but a
              commercially informed counterparty that diligenced both Creditas’s lending platform and the banking asset
              being folded into the group. VEF’s disclosures reinforce that the round was not purely cosmetic. VEF’s
              prior carrying mark on Creditas was roughly US$2.79 billion, and conversion of its convertible notes at
              the US$3.3 billion Series G price generated an 8.2% NAV uplift for VEF and an implied 17.8% step-up versus
              its prior mark. Put differently, the new round sits below the 2022 peak but above at least one informed
              institutional holder’s internal valuation.


              Even so, the new price is not automatically attractive. Creditas has raised roughly US$987 million across
              seven rounds, so the company already carries a substantial preferred-capital stack above common equity.
              Public evidence does not disclose participation rights, seniority details, or liquidation preferences
              across historical rounds. That means investors can observe the latest price but cannot fully underwrite
              what that price means for common-equity return in middling exits. The current valuation therefore deserves
              to be treated as a credible strategic mark with some floor support, not as proof that the risk-adjusted
              entry is compelling on its own.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
