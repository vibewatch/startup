  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and structure of Brazilian secured lending
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Creditas is not “all Brazilian credit” and not even all household credit; it is
              the subset of household borrowing inside the Sistema Financeiro Nacional where collateral, payroll
              deduction, or FGTS-linked guarantees materially change underwriting and price. In practical terms, this
              chapter includes home-equity lending, vehicle-equity lending, private payroll consignado for CLT workers,
              and the newer worker-credit rail that uses eSocial and FGTS-linked guarantees. It also treats multibank
              home and vehicle financing as adjacent acquisition paths, because Creditas uses them to reach the same
              borrower intent even when the balance-sheet product differs.

              The chapter excludes corporate credit, agricultural credit, unsecured personal lending, and revolving card
              balances. Those categories matter as substitutes or benchmarks, but they are not the same underwriting
              market that Creditas is building around house, car, or salary collateral. The company’s own product
              surfaces make that boundary explicit: the marketed products are secured or payroll-linked, the homepage
              contrasts them against expensive unsecured credit, and transparency material places Creditas inside an
              SCD/correspondent model rather than a universal-bank consumer stack.
            claimRefs:
              - CM001
              - CM002
              - CM003
