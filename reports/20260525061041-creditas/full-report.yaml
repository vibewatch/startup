      - number: '2.4'
        title: Growth drivers and Selic/regulatory constraints
        blocks:
          - type: paragraph
            body: >-
              The most important growth driver in 2025-26 is the formalization of private payroll credit through Crédito
              do Trabalhador. Government guidance says the rail can address around 19 million celetistas and more than
              R$120B of loans over four years, while CAIXA explains the practical mechanics: CTPS Digital comparison,
              direct bank offers, 35% margin rules, and FGTS/severance-linked guarantees. This lowers switching
              frictions for workers who previously faced fragmented employer-convênio processes, and it expands the
              serviceable payroll universe to rural workers, domestic workers, and MEI employees recorded in eSocial.

              The constraints are equally clear. Banco Central reports show that long-duration and free-credit
              modalities remain sensitive to restrictive policy, and Creditas’ own Q1-26 disclosure says SELIC stayed
              higher for longer and pressured the margin environment. Home equity still looks underpenetrated relative
              to Brazil’s larger housing-finance market, with free-funding real-estate credit only recently scaling.
              Vehicle credit remains competitive and bank-heavy, and payroll TAM still excludes non-CLT workers and some
              workers on leave or notice period. Operational trust also matters: consumer complaints remain material
              enough that service quality can slow adoption even when product economics are attractive.
            claimRefs:
