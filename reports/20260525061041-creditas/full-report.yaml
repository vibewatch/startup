      - number: '5.4'
        title: Regulatory, Trust, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Creditas operates under a multilayered regulatory framework. The Transparency Center publishes ethics
              codes (company and third-party), anti-corruption policy, information security policies (separate for the
              fintech and SCD entities), AML/CFT policy, and a PRSAC (environmental/social/climate responsibility
              policy). Semi-annual ombudsman reports (ouvidoria) are published for periods 2023/1 through 2025/2,
              providing six continuous periods of BCB-mandated accountability reporting. Creditas is a member of ABCD
              (Associação Brasileira de Crédito Digital) and adheres to its self-regulation code. The privacy policy
              affirms LGPD compliance. The SCR (Sistema de Informações de Crédito) page explains how credit data is
              shared with Banco Central per BCB reporting obligations for regulated lenders.

              Fraud prevention disclosures are specific: Creditas states it does not conduct loan negotiations via
              WhatsApp or direct social media messages, does not request upfront fees, and maintains verified
              blue-checkmark accounts on Facebook, Instagram, and WhatsApp. Official support numbers are published. The
              company won the Reclame Aqui award for best online lending company in 2020, 2021, and 2022 (auto insurance
              is claimed as "4x champion"), but the most recent Reclame Aqui period (Nov 2025–Apr 2026) shows a
              "Regular" 6.4/10 score—signaling a decline in complaint resolution performance. No ISO 27001, SOC 2, or
              PCI DSS certification evidence was found; this is a material security gap.
