              loan portfolio grew from R$6.77bn in Q3 2025 to R$7.6bn in Q1 2026, representing +22.4% year-over-year
              growth. Record quarterly origination of R$1.1bn in Q1 2026 (+29.2% YoY) was described as "sustained robust
              momentum across all lending business units, with Auto and Home Equity posting all-time-high quarterly
              volumes." The company claims over R$12.1 billion loaned and R$6.2 billion saved for customers cumulatively
              since 2012. These are aggregate company-level claims without segment-level breakdowns by borrower count,
              average loan size, or product-level portfolio shares in publicly accessible materials.

              Cross-sell is the stated strategic priority for customer expansion. Management describes the strategy of
              "scaling growth via cross-sell" as fundamental to reducing CAC and significantly increasing revenue per
              customer. Customer acquisition costs declined 0.9% YoY and 6.1% QoQ in Q4 2025 while origination grew
