      - number: '2.5'
        title: Contradictions, sizing gaps, evidence limits
        blocks:
          - type: paragraph
            body: >-
              The main analytical contradiction is not that sources disagree on a single precise number, but that they
              describe the market in different units. Banco Central discusses system growth and modality behavior;
              ABECIP reports real-estate origination flow; government and CAIXA material describe contracted payroll
              potential and guarantee mechanics; Mordor reports a broader auto-loan market in USD. None of those lenses
              is wrong, but they are not directly additive. Any TAM, SAM, or SOM number therefore embeds judgment about
              overlap, eligibility, and whether stock, flow, or contracted-volume proxies are the right denominator.

              Public evidence is strongest on product terms, top-of-funnel demand signals, and Creditas’ own observed
              scale. It is weaker on exact outstanding balances for Brazilian home-equity and vehicle-equity
              subsegments, on approval and take rates by modality, and on how much of the new worker-credit rollout will
              accrue to fintech-originated balance sheets rather than incumbent banks. For diligence and valuation, the
              correct takeaway is not false precision but bounded opportunity: the market is clearly large enough to
              matter, clearly more favorable when rates fall and payroll rails digitize, and still too opaque for a
              single-point market-share claim.
            claimRefs:
              - CM040
              - CM041
              - CM042
              - CM043
              - CM046
              - CM047
