            body: >-
              Capability breadth is where Creditas looks differentiated but not dominant. On retained public evidence,
              Creditas is the only lender in this chapter that visibly combines home equity, vehicle equity, payroll
              credit, API-linked correspondentes, and employer-benefit distribution in one stack. That matters because
              it lets the company meet both large-ticket collateral borrowers and smaller payroll borrowers without
              becoming a full universal bank. Nubank's counter-position is the mirror image: weaker retained evidence on
              secured lending, but stronger everyday-bank reach, a simpler app-led consumer journey, and a much more
              developed trust signal. Inter resembles Nubank conceptually, but the retained public pages are sparse
              enough that capability depth is harder to score with conviction. Itaú is the strongest incumbent feature
              benchmark because it clearly shows home equity and payroll alongside a broader banking suite.

              Trust signals cut against an overly bullish competitive narrative for Creditas. Reclame Aqui rates
              Creditas only “Regular” at 6.4/10, with 70.1% resolution and 46.5% willingness to return. Nubank is the
