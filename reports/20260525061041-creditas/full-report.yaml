  - id: FR002
    title: 'Risk transmission map: how primary risks flow into Creditas''s valuation and operations'
    type: dag
    layout: wide
    summary: >-
      The two most damaging pathways both converge on the valuation: elevated SELIC squeezes margins and delays
      profitability, while integration or credit failures amplify operating losses that block the IPO path.
    data:
      nodes:
        - id: r1
          label: Sustained high SELIC
          detail: BCB policy rate remains elevated; projected deceleration of SFN credit growth to 8 % in 2026.
        - id: r2
          label: Securitisation funding cost rises
          detail: FIDC/CRI structures priced against CDI; cost rises immediately with each SELIC move.
        - id: r3
          label: Gross profit margin compression
          detail: GP margin fell to 36.2 % in Q4-25 vs 40 % target; recovered to 40.0 % in Q1-26.
        - id: r4
          label: Delayed operational break-even
          detail: Operating loss R$80.9 mn (Q4-25) → R$34.9 mn (Q1-26); profitability path extended.
        - id: r5
          label: Andbank integration friction
          detail: Cost consolidation already visible in Q4-25 P&L; prudential compliance requirements new.
        - id: r6
          label: IFRS provisioning front-load
          detail: Rapid origination growth forces up-front provisions that compress reported margins.
        - id: r7
          label: NPL / credit-quality deterioration (latent)
          detail: Product-level NPL not disclosed; accrual methodology change signals closer scrutiny.
        - id: r8
          label: Customer-service / reputation gap
          detail: Reclame Aqui 6.4/10 vs Nubank 8.6/10; 46 % repeat-business intention.
        - id: r9
          label: CAC pressure and churn risk
          detail: Poor NPS forces higher marketing spend to replace lost customers.
        - id: r10
          label: Competition encroachment (Nubank / banks)
          detail: Nubank entering consignado/collateralised verticals with lower CAC and higher trust.
        - id: r11
          label: Valuation / IPO path impaired
          detail: Already 31 % below Series F peak; further losses or down-rounds delay exit.
        - id: r12
          label: 'Thesis break: insufficient capital / forced restructuring'
          detail: If profitability target missed and capital markets close, covenant or dilution risk rises.
      edges:
        - from: r1
          to: r2
          label: directly raises
        - from: r2
          to: r3
          label: compresses
