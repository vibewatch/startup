      - number: '3.4'
        title: 'Moat durability: switching costs, funding model, and channel power'
        blocks:
          - type: paragraph
            body: >-
              Creditas' moat is real, but it is narrower and more conditional than a simple “specialist fintech wins”
              story. First, the company does appear to own unusual secured-credit depth in public evidence: home equity,
              vehicle equity, payroll, correspondentes, and employer channels all show up in the retained source set.
              Second, the Andbank deal should improve the funding stack over time by reducing dependence on pure
              securitization and giving Creditas more of a banking perimeter. Third, correspondentes and
              employer-benefit partnerships mean acquisition is not purely app-led; that hybrid go-to-market is harder
              for a pure unsecured app to copy quickly.

              But durability is limited by moderate switching costs and very strong incumbent channel ownership.
              Borrowers still compare rates aggressively, payroll credit is becoming more searchable and portable, and
              many alternatives do not require the paperwork or collateral friction of property and vehicle liens. Caixa
              and Banco do Brasil already sit on salary or benefit rails that can lower CAC at origination. Incumbent
              banks also start with deposits, branches, and cross-sell economics that Creditas historically lacked. The
              practical conclusion is that Creditas' defensibility is likely to come from funding cost, underwriting,
              approval speed, and partner access more than from permanent lock-in.
