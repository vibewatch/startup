      - number: '8.2'
        title: Operating trajectory, implied multiples, and why the price still looks demanding
        blocks:
          - type: paragraph
            body: >-
              The strongest argument in favor of the Series G price is that operating performance improved materially
              through Q1-26. Creditas reported R$633 million of quarterly revenue, up 23.1% year on year, and R$253.5
              million of gross profit at a 40.0% margin. Quarterly operating loss narrowed to R$34.9 million from R$80.9
              million in Q4-25, after Q3-25 and Q4-25 had shown losses of R$68.2 million and R$80.9 million
              respectively. The loan portfolio reached R$7.6 billion and quarterly origination reached R$1.1 billion,
              both company-reported highs. Management’s narrative that margins are recovering after the IFRS methodology
              tightening is therefore directionally supported by the numbers, and employee productivity also improved
              from roughly R$1.1 million to R$1.4 million of annualized revenue per employee over six months.


              The trouble is that valuation already capitalizes much of that operational progress. Annualizing Q1-26
              gives approximately R$2.5 billion of revenue and R$1,012 million of gross profit, or about US$500 million
              and US$200-250 million respectively using the rough exchange-rate convention embedded in the evidence set.
              On that basis, the US$3.3 billion Series G implies roughly 6.6x trailing revenue and 13.2x trailing gross
              profit. For a lender that remains loss-making, still depends primarily on capital-markets funding, and has
              not disclosed product-level NPL or cash runway, those are not distressed multiples. They are better
              described as moderately full multiples that require further execution.


              Macro conditions also argue against paying up too quickly. The Banco Central do Brasil kept SELIC around
              14.75% into early 2026 and projected system credit growth of only 7.7% in 2025 and 8.0% in 2026. Creditas
              is growing faster than the system, but the same restrictive rate backdrop raises the cost of CDI-linked
              securitization funding and can suppress reported margins if deposit funding from the Andbank licence ramps
              more slowly than hoped. At the same time, Creditas’s Reclame Aqui score of 6.4/10 with 46.5% willingness
              to do business again trails Nubank and Bradesco. The operating trend is improving, but the company is not
              yet good enough, or transparent enough, to make the current mark look clearly cheap.
            claimRefs:
