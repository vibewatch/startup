  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Distribution Channels
        blocks:
          - type: paragraph
            body: >-
              Creditas targets four distinct customer segments through different access channels. The primary B2C
              segment consists of individual Brazilian consumers holding real-estate equity (homeowners), vehicle equity
              (car owners, including those with financed vehicles), or formal employment contracts (CLT workers eligible
              for payroll deduction). Home Equity borrowers skew toward middle-to-upper income Brazilian homeowners
              seeking large-ticket credit (R$50K–R$3M) at significantly lower rates than unsecured alternatives. Auto
              Equity borrowers are a more accessible mass-market segment given lower loan minimums (R$5K) and the broad
              ownership of vehicles in Brazil. The Consignado segment, expanded in 2025 under the Crédito do Trabalhador
              regulation, now reaches MEIs, rural workers, and domestic workers in addition to standard CLT employees,
              broadening the accessible formal labor market.

              The B2B segment consists of employers that adopt the Creditas Benefícios platform to provide their
              employees with flexible benefits, salary advance, and financial education. These employers are onboarded
              through a direct sales motion (HR team outreach and employee referral) with a 30-day implementation
              period. No named employer clients are disclosed in any public source. The B2B2C partner channel uses
              API-integrated correspondente bancário partners who originate loans on behalf of end borrowers; this
              channel is central to Creditas' strategy of reducing CAC through partner-led origination, as evidenced by
              the Auto Equity scaling in Q4 2025. Distribution is digital-first across all segments: web simulation,
              mobile app, and Portal do RH, with no physical branch network.
