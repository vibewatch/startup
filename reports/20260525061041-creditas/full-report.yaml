        - Useful benchmark for what deposit-funded Brazilian digital banking can trade at
        - Different asset mix, lower yield profile, and not centered on secured collateralized lending
      - - Creditas Series F (Jan 2022)
        - Same company at prior private-market peak
        - US$4.8B valuation on US$260M new capital; implied about 5-6x 2022 revenue
        - Best historical internal baseline for Creditas during a higher-growth phase
        - ZIRP-era private market peak is not a clean comp for late-2025 Brazil rates
      - - LatAm private fintech post-correction
        - Late-stage private rounds across 2023-25
        - Typical 4-8x revenue range after the fintech rerating
        - Provides a realistic corridor for unprofitable scaled fintechs
        - Wide range and no single disclosed transaction is a perfect secured-lender analogue
      - - VEF carrying mark before Series G
        - Continuous mark from Creditas largest institutional backer
        - Prior implied mark about US$2.79B; Series G represented a 17.8% uplift to US$3.3B
        - Useful insider reference for where an informed holder carried the asset before the round
        - VEF is an existing shareholder and the mark may reflect strategic value, not arm’s-length clearing
    notes: >-
      The comparable set spans public LatAm fintechs, Creditas’s own historical private mark, generalized late-stage
      private fintech ranges, and VEF’s pre-round carrying value.
    enumerationScope:
      coverage: partial
      coverageNote: >-
        Covers public company comps, historical private rounds, broad post-correction private fintech ranges, and an
        insider carrying mark.
      basis: >-
        Five entries selected from the best-documented public LatAm fintech comparables, Creditas historical financing
        evidence, and VEF marking disclosures available in the public record.
    claimRefs:
      - CV003
      - CV006
      - CV012
      - CV022
      - CV035
      - CV041
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold / event
      - transmission to thesis
      - action implication
    rows:
      - - Operating loss widens
        - Q2-26 operating loss exceeds R$80mn without a clear one-off explanation
        - Break-even trajectory reverses and both bull and base cases weaken materially
        - Abort entry or re-underwrite closer to US$2B
      - - Gross-profit margin compression
        - Two consecutive quarters with gross-profit margin below 35%
        - Suggests IFRS tightening plus funding-cost pressure is overwhelming operating leverage
        - Cut target entry to US$2.0-2.5B and downgrade the thesis
      - - Adverse NPL disclosure
        - First meaningful NPL disclosure shows more than 5% NPL by outstanding principal in any major product
        - Invalidates the credit-quality assumption embedded in margin recovery
        - Immediate thesis break and likely exit
      - - Consumer reputation deterioration
        - Reclame Aqui score falls below 6.0 or willingness-to-do-business-again falls below 40%
        - Raises churn and CAC risk, weakening customer-experience assumptions
        - Reduce conviction and move to watch-only posture
      - - Banking-licence deposit ramp fails
        - Less than R$500mn of visible deposits or CDB funding within 18 months of licence activation
        - The funding-cost bull thesis is delayed by years and valuation floor weakens
        - Revise base-case valuation toward US$2.5B
    notes: >-
      Each trigger is designed to be externally monitorable and tied to a clear change in valuation stance rather than a
      generic risk statement.
    claimRefs:
      - CV019
      - CV020
      - CV025
      - CV033
      - CV037
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / path
    rows:
      - - NPL by product and vintage
        - >-
          Delinquency buckets beyond 30, 60, 90, and 180 days for Home Equity, Auto, and payroll products plus vintage
          loss curves since 2021
        - Determines whether gross-profit recovery is durable or only temporarily masking credit deterioration
        - Request directly from management and credit committee before committing capital
      - - Audited multi-year P&L
        - >-
          Full IFRS income statements for 2022-2025 including finance income, finance cost, provisions, tax, and
          comparatives
        - Public releases are insufficient to reconstruct true earnings quality or the path to break-even
        - Request from IR and the auditor packet for the 2025 statements
      - - Cash and runway
        - Current cash balance, monthly operating cash burn, and 12-month downside budget
        - Without cash data investors cannot assess runway, refinancing pressure, or Series H timing
        - Request monthly management accounts and board-approved budget
      - - Preference stack and cap table
        - Participation rights, liquidation waterfall, conversion ratios, and anti-dilution terms across all rounds
        - Exit outcomes for common equity depend materially on seniority and preference overhang
        - Request legal cap table and summary of shareholder agreement terms
      - - Banking-licence deposit roadmap
        - BCB activation status, product launch date, and deposit-volume targets for the first 12 months
        - The main strategic reason to pay above a distressed multiple is future funding-cost improvement
        - Request management roadmap plus supporting BCB process documentation
    notes: >-
      These asks are prioritized by how directly they change downside underwriting and the credibility of the current
      valuation mark.
    claimRefs:
      - CV017
      - CV033
      - CV034
      - CV040
