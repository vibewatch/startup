  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Macro and SELIC risk: elevated rates structurally compress securitisation-funded margins'
        blocks:
          - type: paragraph
            body: >-
              Creditas's business model is unusually exposed to Brazil's policy rate because virtually all of its
              funding comes from capital-markets structures—FIDCs, CRIs, and FIIs—rather than bank deposits. As of Q1
              2026 the IR page lists 70+ capital-markets issuances as the primary funding vehicle, and every new tranche
              is priced against CDI/SELIC. When SELIC rises, the cost of these tranches rises in parallel, while the
              repricing of the existing loan portfolio occurs more slowly, compressing net interest spread. The Banco
              Central do Brasil's September 2025 Monetary Policy Report (Relatório de Política Monetária) documented
              this transmission: credit-system nominal growth decelerated from 10.7 % YoY in July 2025 to a projected
              8.0 % for 2026, as the restrictive monetary cycle suppressed new origination across the SFN. The March
              2025 BCB report had already revised 2025 credit growth downward from 9.6 % to 7.7 %, citing
              higher-for-longer rates, household over-indebtedness, and tighter credit supply conditions. Creditas's own
              financials confirm the transmission. Q3 2025 gross profit fell 7.4 % YoY—even as revenues grew 14.4 %
              YoY—explicitly because SELIC consolidation in securitisation funding raised the cost of outstanding
              structures. Q4 2025 gross profit margin was 36.2 %, below the company's stated 40–45 % cohort-level
              target, again attributed to the "sustained high-SELIC environment." Margins recovered to exactly 40.0 % in
              Q1 2026 but management itself warned that SELIC is "remaining higher for longer," and the BCB Focus survey
              reinforces that view. The residual risk is therefore not that SELIC spikes further but that it stays
              elevated long enough to prevent the company from building the cash reserves needed to reach operational
              break-even. Creditas does operate a cash-neutral guardrail since end-2023, which limits the acute
              liquidity risk, but it also means every incremental basis point of funding-cost increase directly reduces
              the speed of the profitability path.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
