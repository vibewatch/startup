      - number: '5.2'
        title: Technology Architecture and Distribution
        blocks:
          - type: paragraph
            body: >-
              Creditas' architectural footprint is shaped by its regulatory structure. The company operates as a
              Correspondente Bancário under BCB Resolution CMN 4.935, a Sociedade de Crédito Direto (SCD) under
              Resolutions 4.656/5.050, and—since December 2025—owns Banco Andbank Brasil under a full multiple-bank
              (banco múltiplo) license, integrating the SCD into Andbank's prudential conglomerate. Home Equity loans
              are originated under Oxy Companhia Hipotecária S.A. (CNPJ 18.282.093/0001-50) and the Creditas SCD (CNPJ
              32.997.490/0001-39); auto and consignado loans also run through Socinal S.A. (CNPJ 03.881.423/0001-56).
              The banking license acquisition lowers Creditas' cost of funds by enabling Andbank institutional and
              private banking clients to subscribe to Creditas-structured credit funds.

              Distribution channels include: (1) the web platform at creditas.com for direct consumer origination; (2)
              the Android mobile app (br.com.creditas.mobile) integrating simulation, document submission, contract
              signing, benefits balance, and salary advance; (3) a partner API published at developers.creditas.com.br
              with a documented two-phase staging-then-production integration process; and (4) the Portal do RH for
