              - CV015
              - CV019
              - CV032
              - CV037
              - CV040
      - number: '8.4'
        title: Exit pathways, diligence blockers, and what would change the view
        blocks:
          - type: paragraph
            body: >-
              Exit analysis for Creditas remains suggestive rather than confirmed. The company is large enough in
              revenue terms to fit the profile of a future IPO candidate or strategic M&A target, and the Andbank
              transaction proves there is at least some strategic buyer interest around the funding stack and
              banking-licence optionality. Yet no official IPO timeline is visible, no public banker mandate has been
              identified, and there is no public secondary-market evidence showing where non-strategic investors would
              currently clear size. That makes the exit menu real but poorly evidenced. Investors should assume that
              exit timing will be driven by operating profitability, macro conditions in Brazil, and the success of the
              bank-integration funding strategy, not simply by the company’s scale.


              The most material blockers are all private-data requests. First, the public record still does not show NPL
              by product, delinquency buckets, or vintage-loss curves. Without that disclosure, investors cannot
              determine whether 40% gross-profit margin is durable or merely the visible side of a latent credit-cost
              problem. Second, public materials are insufficient to reconstruct a fully audited multi-year P&L and cash
              runway. Third, the preference stack above common equity remains opaque, which means even a sensible
              enterprise-value range cannot be translated cleanly into common-equity return. These gaps are not
              cosmetic; they directly affect entry-price discipline and downside protection.


              The practical implication is that the chapter’s recommendation should change only on hard evidence. A
              better-than-expected Q2-26 operating result, credible proof of deposit ramp from the Andbank licence, and
              first-pass NPL disclosure that does not show a hidden deterioration would justify moving from watchlist
              posture toward investable conviction. Conversely, a renewed operating-loss spike, two quarters of sub-35%
              gross-profit margin, or adverse first-look credit metrics would justify stepping away unless pricing
              resets materially below the Series G mark.
            claimRefs:
              - CV017
              - CV019
              - CV020
              - CV032
              - CV033
              - CV034
              - CV040
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV017
              - CV033
              - CV034
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track / Conditional Watch — prefer entry at US$2.5-3.0B
            body: >-
              Creditas is strong enough to keep diligencing, but not transparent enough to justify paying the full
              Series G price without evidence that break-even and credit quality are both holding into Q2-26.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV019
              - CV040
          - type: callout
            title: Series G anchor investor Andbank is a fully informed commercial party at US$3.3B
            body: >-
              Because Andbank was both the lead investor and the banking asset being acquired, the Series G price
              carries more strategic-information value than a typical venture financing mark.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV028
          - type: callout
            title: NPL opacity is the single most material unresolved underwriting blocker
            body: >-
              Public evidence shows improving gross margin and narrowing losses, but the absence of product-level
              delinquency and vintage-loss data prevents investors from testing whether those improvements are durable.
            calloutType: risk
            claimRefs:
              - CV019
              - CV033
              - CV040
