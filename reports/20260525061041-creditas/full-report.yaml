              customer experience: Reclame Aqui shows Creditas materially behind Nubank on score, response time,
              resolution, and customer willingness to return. For a company that often presents itself as a better
              digital alternative to traditional credit, that gap matters. A second adverse signal is financial.
              Creditas is growing and margins improved in Q1-26, but the company remains loss-making, Q4-25 explicitly
              cited a high-Selic environment, and Banco Central's own 2025 policy report says tighter conditions still
              restrict credit supply even as private payroll expands. The Andbank licence may help, but it has not yet
              erased the economics of a specialist lender in a high-rate cycle.

              Third, valuation itself carries a warning. The 2025 Series G at US$3.3 billion is an explicit 31.25% reset
