      - number: '6.4'
        title: Complaint Signals and Adverse Customer Evidence
        blocks:
          - type: paragraph
            body: >-
              Reclame Aqui provides the most structured independent customer evidence available for Creditas. For the
              six-month period 01 November 2025 to 30 April 2026, Creditas received 1,949 complaints, responded to 91.2%
              of them (162 complaints still awaiting response at access date), resolved 70.1% of received complaints,
              and achieved an average satisfaction score of 5.28/10 from 597 evaluated complaints. Only 46.5% of
              evaluating customers said they would do business with Creditas again. The platform's composite reputation
              score is 6.4/10, classified as "Regular" (the middle tier between "Good" and "Bad" on the Reclame Aqui
              scale). The total historical complaint count of 15,673 across all active complaints in the Creditas
              database indicates sustained complaint accumulation over the company's 12-year history.

              The complaint category breakdown reveals structural issues rather than isolated incidents. Unfair charges
              (cobrança indevida) lead at 2,231 complaints, followed by misleading advertising (propaganda enganosa) at
              1,628, and difficulty completing operations at 1,547. Non-compliance with agreements (826), abusive
              interest rates (820), and poor customer service (655) round out the top categories. The prominence of
              "misleading advertising" as the second-largest category suggests a systemic gap between Creditas'
              marketing claims (emphasizing lowest rates, ease, and speed) and actual customer experience with rate
              complexity, process friction, or fee disclosure. For context, Nubank's Reclame Aqui score (fetched in the
              same research window) is higher, suggesting Creditas' "Regular" rating is below key digital-native
              competitors. The contrast with Creditas' own Reclame Aqui awards for 2020–2022 points to a deterioration
              in complaint resolution performance in recent periods.
