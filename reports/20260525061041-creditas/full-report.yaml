              up in the cap table. Finally, Creditas is vulnerable wherever speed beats sophistication: Rebel can win on
              simple digital unsecured credit, Caixa and BB can win on payroll and INSS distribution, and FGTS or
              personal-loan substitutes can win when borrowers do not have, or do not want to pledge, collateral.
              Creditas therefore looks more like a well-positioned specialist than a company that has already locked up
