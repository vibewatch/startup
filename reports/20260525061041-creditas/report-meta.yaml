companyProfile:
  summary: "Creditas is a São Paulo-based secured-lending fintech founded in 2012 by Sergio Furio. It began as BankFacil, evolved from a comparator into a direct lender, and now anchors its model in home-equity, auto-equity, and payroll-backed credit, with adjacent insurance, employee-benefit, and investment distribution products. The December 2025 Series G and Andbank Brasil acquisition gave Creditas a banking licence and fresh equity, but public diligence still lacks full credit-quality and capital-structure transparency."
  foundedDate: "2012-01-01"
  founders:
    - name: "Sergio Furio"
      role: "Founder & CEO"
      background: "Spanish entrepreneur and financial-services operator who moved from comparator-led distribution into direct secured lending in Brazil."
      claimRefs: [CO001, CO002, CO013]
  foundingLocation: "São Paulo, Brazil"
  headquarters: "São Paulo, Brazil"
  productSummary: "Secured lending products backed by home equity, vehicle equity, and payroll, plus auto insurance, vehicle and home financing, salary advance, flexible benefits, and investment distribution via Andbank Wealth."
  customerFocus: "Brazilian households seeking lower-cost credit and employers offering payroll-linked financial benefits."
  businessModel: "Earn net interest income on secured consumer loans funded through capital-markets instruments and, increasingly, bank funding, then cross-sell insurance and employer-benefit products."
  stage: "Series G"
  fundingStatus: "US$108M Series G in December 2025 at a US$3.3B valuation, down from the US$4.8B Series F peak in 2022, alongside the acquisition of Andbank Brasil."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO019, CO025]
