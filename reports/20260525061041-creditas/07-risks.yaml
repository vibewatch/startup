  - id: regulatory-and-compliance-risk
    title: "Regulatory and compliance risk: SCD/correspondente bancário framework, bank acquisition, and LGPD obligations"
    body: >-
      Creditas occupies three regulatory layers simultaneously, each with distinct supervisory
      obligations. First, as a Sociedade de Crédito Direto (SCD), it is subject to Resolução
      CMN 4.656 and the full prudential and conduct requirements the Banco Central applies to
      licensed non-bank financial institutions—including minimum capital, operational risk, AML/CFT,
      and regular SCR reporting. Second, as a Correspondente Bancário it must comply with Resolução
      CMN 4.935, which governs origination practices, disclosure obligations, and supervision of
      the banking institutions whose products it distributes. Third, following BCB approval in
      November 2025 of Andbank's Brazilian entity reorganisation (including the DTVM spin-off),
      Creditas completed the acquisition of Banco Andbank Brasil on December 1, 2025. This adds a
      full banking licence—with its more onerous prudential capital, liquidity, and governance
      requirements—to the group structure. The BCB's approval process took approximately three
      years from the initial 2022 announcement, a reminder that regulatory timelines are
      unpredictable and that any future structural change (further licence expansion, product
      launch requiring new approvals, or international expansion) could be similarly protracted.
      Creditas addresses LGPD obligations through a privacy policy last updated March 2025 (version
      3), an independent ethics channel, and published semi-annual ouvidoria (ombudsman) reports
      through the second half of 2025. The cybersecurity posture is disclosed through two separate
      Information Security policies—one for the fintech entity and one for the SCD—and an
      AML/CFT policy (PLDFT). However, no public SOC 2, ISO 27001, or equivalent third-party
      certification has been located, and no data breach or significant incident disclosure was
      found in the research set. The evidence gap on independent security certification is material
      for institutional investors and enterprise clients evaluating the Creditas B2B platform and
      API. Failure to maintain BCB compliance, a capital-adequacy breach in the banking subsidiary,
      or an enforcement action could suspend operations and immediately impair the thesis.
