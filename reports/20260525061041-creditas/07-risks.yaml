  - id: reputation-and-customer-service-risk
    title: "Reputation and customer-service risk: Reclame Aqui 'Regular' rating and persistent complaint volume"
    body: >-
      Consumer-facing fintech brands are acutely sensitive to public-complaint platforms in Brazil,
      where Reclame Aqui serves as the de facto consumer-protection record. Creditas's rating for
      the six-month period November 2025–April 2026 is classified as "Regular" with a score of
      6.4/10—the second tier from the bottom. In that period the company received 1,949 complaints,
      resolved 70.1 %, and saw only 46.5 % of reviewers say they would do business again. The
      average response time was 18 days and 11 hours, which is materially slower than best-in-class.
      Across all recorded history the platform shows 15,673 total active complaints, with the
      largest categories being financial/banking (6,623), bank-product related (4,146), and
      loan-specific complaints (6,209). The top problem categories are improper billing (2,231
      complaints) and misleading advertising (1,628 complaints)—the latter being particularly
      sensitive given Creditas's heavy use of rate comparisons and "lowest rate in the market"
      marketing language. The competitive context sharpens the risk: Nubank carries an RA1000
      rating (8.6/10) with a 91.9 % resolution rate and 79.7 % repeat-business intention—a stark
      contrast to Creditas's metrics on every dimension. Bradesco, a large incumbent bank, scores
      7.1/10 ("Bom"). The gap to Nubank is particularly relevant because Nubank is now entering
      collateralised and consignado lending, the exact verticals where Creditas competes. If
      customer experience remains inferior, Nubank's marketing and trust advantage compounds the
      product-competition risk. Creditas did win the Reclame Aqui award for best online lending
      company in 2020, 2021, and 2022, suggesting the current "Regular" rating may reflect
      growing complexity and complaint volume as the business scaled, rather than a sudden quality
      collapse. Nevertheless, the current trajectory is adverse and demands monitoring.
    claimRefs:
