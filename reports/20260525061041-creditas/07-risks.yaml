company:
  name: Creditas
chapter:
  number: 7
  title: Risks
  summary: >-
    Creditas's risk profile is dominated by three interlocking forces: a SELIC rate that remains
    structurally elevated and squeezes securitization-funded gross margins; a valuation that was
    marked down 31 % from Series F ($4.8 B) to Series G ($3.3 B) with no IPO date visible; and
    a newly acquired banking subsidiary (Banco Andbank Brasil, December 2025) that layers prudential
    capital requirements and integration execution risk onto an already complex multi-vertical
    fintech. Regulatory exposure is real but well-documented: Creditas holds active SCD and
    correspondente bancário licences and publishes the compliance policies required by the Banco
    Central do Brasil. Customer service reputation lags leading fintechs—Reclame Aqui rates
    Creditas "Regular" (6.4/10) versus Nubank's RA1000 (8.6/10)—while operating losses persist
    (R$80.9 mn in Q4-25, narrowing to R$34.9 mn in Q1-26). The thesis survives if SELIC normalises,
    bank integration completes cleanly, and the company reaches operational break-even; it breaks
    if elevated rates compress margins below 30 % for multiple quarters, BCB imposes capital
    add-ons on the new banking group, or a further down-round accelerates investor fatigue.

