callouts:
  - calloutType: risk
    title: "Kill criterion 1 – gross profit margin below 30 % for two consecutive quarters"
    body: >-
      If SELIC remains elevated and the Andbank deposit base fails to offset securitisation funding
      costs, gross profit margin could fall below 30 %. At that level, even a cash-neutral
      operation would require external equity, and the terms of such capital would likely imply
      a further down-round. Monitor quarterly margin alongside BCB SELIC decisions and the
      disclosed annualised funding-cost data.
    claimRefs:
      - CR003
      - CR004
      - CR005

  - calloutType: risk
    title: "Kill criterion 2 – BCB enforcement action or capital-adequacy breach in the banking subsidiary"
    body: >-
      A formal BCB enforcement action—or a disclosed capital-adequacy breach in Banco Andbank
      Brasil—would be an immediate thesis-break event. The banking licence is the gateway to the
      funding-cost reduction that justifies the Andbank acquisition premium. Any BCB action that
      restricts deposit-taking or lending operations in the subsidiary would negate the strategic
      rationale and destroy value rapidly.
    claimRefs:
      - CR018
      - CR019
      - CR020

  - calloutType: risk
    title: "Kill criterion 3 – valuation falls below US$2 billion with no visible path to operational break-even"
    body: >-
      If a further down-round (below US$2 B) is required before the company reaches operational
      break-even, investor fatigue, option dilution, and talent-retention pressures could trigger
      a self-reinforcing cycle. The current operating-loss trend (R$80.9 mn → R$34.9 mn in one
      quarter) is encouraging, but a reversal driven by credit-quality deterioration or integration
      cost overruns could restart that cycle.
    claimRefs:
      - CR039
      - CR040
      - CR041
      - CR042

  - calloutType: recommendation
    title: "Primary diligence ask: NPL by product, securitisation maturity profile, and Andbank capital ratio"
    body: >-
      Three disclosures are required to form a well-grounded risk view that public evidence cannot
      provide: (1) product-level NPL rates and default curves by vintage; (2) the full liability
      schedule showing FIDC and CRI maturities and refinancing cliffs; (3) Banco Andbank Brasil's
      BCB-reported capital adequacy ratio and any conditions attached to the acquisition approval.
      Without these, the two highest-severity risks (credit quality and banking integration) carry
      material evidence gaps that preclude high-confidence underwriting.
    claimRefs:
      - CR010
      - CR012
      - CR018
      - CR019

