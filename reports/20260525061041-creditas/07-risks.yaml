  - id: credit-performance-and-provisioning-risk
    title: "Credit performance and provisioning risk: IFRS methodology change, front-loaded provisions, and opaque NPL data"
    body: >-
      Creditas carries a collateralised portfolio where the underlying assets—homes and
      vehicles—provide recoverable value in default, yet the public evidence on credit quality
      contains a significant disclosure gap: no product-level NPL or default-rate time-series
      is published. Investors must rely on management commentary and indirect signals. The most
      important signal in the period under review is a retroactive IFRS methodology change
      disclosed in the Q4 2025 results (February 2026): Creditas now ceases interest accrual at
      180 days past due for Home Equity (previously 730 days) and at 90 days past due for all
      other products (previously 365 days). This more conservative treatment had a non-cash
      impact of minus 6.4 % on 2025 revenues and minus 1.7 % on gross profit, and Creditas
      applied the change retroactively to all 2025 periods for comparability. Management frames
      the change as a voluntary improvement to IFRS rigour. The adverse interpretation is that
      the prior accrual window was unusually lenient—accruing interest on loans 365–730 days
      overdue—and the change corrects a potential overstatement of net interest income on
      deteriorating assets. A second credit risk driver is front-loaded IFRS provisioning:
      accounting rules require provisions to be recognised at origination based on expected loss,
      so rapid portfolio growth mechanically compresses reported gross profit even when cohort-level
      credit quality remains sound. Management claims cohort-level profitability of 40–45 %
      persists across all vintages, but no auditor-reviewed cohort table or independent third-party
      credit opinion has been located in public sources. The company remains operationally
      loss-making: operating loss was R$80.9 mn in Q4 2025 and narrowed to R$34.9 mn in Q1 2026.
      Annualised revenues reached R$2.5 bn and annualised gross profit R$1.0 bn in Q1 2026,
      and management targets operational break-even "in the near-term." Until that milestone
      is reached, deterioration in credit performance would amplify losses rather than absorb
      them against a profit buffer.
