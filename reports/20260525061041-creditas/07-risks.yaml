  - id: valuation-and-refinancing-risk
    title: "Valuation and refinancing risk: 31 % down-round, deferred IPO, and investor-return pressure"
    body: >-
      The move from Creditas's Series F valuation of US$4.8 billion (January 2022) to the Series G
      valuation of US$3.3 billion (December 2025) represents a 31 % nominal haircut over nearly
      four years. VEF, one of the most transparent institutional investors, disclosed that it
      converted its convertible notes into shares at the new lower valuation, writing down its
      prior mark by 17.8 % (from VEF's internal Q3-25 mark to the Series G price). The total
      equity raised across all seven rounds is US$987 million, and the last round was for only
      US$108 million—smaller than each of the three preceding rounds. In 2022, Brazilian media
      reported expectations of a US$10 billion IPO valuation; as of the run date no IPO process
      has been announced or confirmed. Multiple risk factors converge: (1) the company has not
      yet demonstrated operating profitability, which is a prerequisite for most LatAm public
      markets listings; (2) the Andbank acquisition introduces a more complex consolidated entity
      that requires additional auditor review and financial disclosure preparation; (3) global
      fintech public-market multiples compressed sharply after 2022 and have not fully recovered;
      (4) Brazilian capital markets are sensitive to SELIC, which directly affects listed financial
      equity multiples. The down-round also signals potential pressure on employee option-pool
      value, which can create talent-retention risk. Creditas has stated it is targeting a return
      to operational break-even "in the near-term," and 1Q26 shows meaningful improvement (operating
      loss narrowed from R$80.9 mn to R$34.9 mn QoQ), but the gap between current performance
      and IPO-readiness remains material. Any further down-round or need for bridge capital before
      profitability would add significant investor-sentiment and dilution risk.
    claimRefs:
      - CR039
      - CR040
      - CR041
      - CR042
