  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "credit / provisioning risk"
      missingEvidence: "Product-level NPL rates and default curves by origination vintage for Home Equity, Auto Equity, and e-Consignado."
      whyItMatters: "Without NPL by product the credit-quality claim rests entirely on management's word. A deteriorating auto-equity vintage (accelerated in 2025) could be masked by a larger, lower-NPL home-equity book."
      diligencePath: "Request from management a vintage analysis table covering origination cohorts 2022–2025 with 30-DPD, 90-DPD, and write-off rates by product."
      relatedQuestionRefs:
        - QR006
        - QR007
        - QR008

    - type: missing-source
      severity: material
      topic: "macro / SELIC risk"
      missingEvidence: "Maturity schedule and refinancing cliff analysis for Creditas's 70+ FIDC, CRI, and FII structures."
      whyItMatters: "If a disproportionate share of securitisation funding matures in 2026–2027 during a high-SELIC environment, the refinancing cost spike could materially exceed the blended portfolio repricing and temporarily destroy gross profit."
      diligencePath: "Request liability schedule from IR team; cross-check against Debt Capital Markets IR page for disclosed structures."
      relatedQuestionRefs:
        - QR005

    - type: missing-source
      severity: material
      topic: "regulatory / compliance risk"
      missingEvidence: "Banco Andbank Brasil's BCB-reported capital-adequacy ratio post-acquisition and any conditions attached to the regulatory approval."
      whyItMatters: "If the acquired bank is undercapitalised relative to BCB minimums, Creditas may need to inject equity into the subsidiary, consuming cash and potentially requiring a new funding round."
      diligencePath: "Request consolidated capital-adequacy report (BIS ratio) and BCB approval letter from management."
      relatedTableRefs:
        - TR003
      relatedQuestionRefs:
        - QR011
        - QR013
        - QR020

    - type: missing-source
      severity: material
      topic: "regulatory / compliance risk"
      missingEvidence: "Third-party cybersecurity certification (SOC 2 Type II or ISO 27001) for Creditas's platform and SCD entity."
      whyItMatters: "The absence of independent certification creates a trust gap for institutional clients and regulated-industry partners who require vendor security attestations. It is also an indicator of potential audit exposure under BCB cybersecurity rules for financial institutions."
      diligencePath: "Request SOC 2 report or ISO 27001 certificate from management; check BCB supervisory letters."
      relatedQuestionRefs:
        - QR015
        - QR018

    - type: private-evidence-only
      severity: minor
      topic: "execution risk"
      missingEvidence: "Integration roadmap and milestone schedule for Banco Andbank Brasil post-acquisition."
      whyItMatters: "Integration execution risk is elevated when the roadmap is opaque; Q4-25 cost evidence confirms integration friction is already occurring."
      diligencePath: "Request integration roadmap and BCB integration plan, including IT migration timeline and staff-structure rationalisation."
