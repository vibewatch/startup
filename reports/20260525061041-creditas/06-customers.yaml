callouts:
  - calloutType: strength
    title: "Strong Portfolio Momentum with CAC Efficiency Improvement"
    body: >-
      Q1 2026 record origination of R$1.1bn (+29.2% YoY) alongside declining CAC (-0.9% YoY, -6.1% QoQ
      in Q4 2025) indicates Creditas is acquiring and retaining enough customers to justify continued scale
      without a proportional increase in marketing spend. The cross-sell strategy is structurally sound
      given the multiproduct platform.
    claimRefs:
      - CU006
      - CU009
      - CU010

  - calloutType: risk
    title: "Reclame Aqui Score (6.4/10, Regular) Is a Material Adverse Signal"
    body: >-
      A "Regular" rating with only 46.5% repurchase intent, a 70.1% resolution rate, and 18-day average
      response times represents a structural customer experience gap for a digital fintech. The dominance
      of "misleading advertising" and "unfair charges" complaint categories points to a product/marketing
      alignment problem rather than isolated service incidents.
    claimRefs:
      - CU011
      - CU013
      - CU014
      - CU015
      - CU034

  - calloutType: risk
    title: "No Retention Metrics Disclosed: Customer Durability Unverifiable"
    body: >-
      NRR, GRR, churn, cohort retention, and repeat-borrowing rates are absent from all public materials.
      Portfolio growth alone cannot distinguish between customer acquisition and durable retention.
      "High client recurrence" is management's stated basis for the growth outlook but is entirely
      unquantified in public sources.
    claimRefs:
      - CU031
      - CU037
      - CU038

  - calloutType: insight
    title: "B2B Benefícios Creates Embedded Channel but Lacks Public Validation"
    body: >-
      The zero-cost benefits platform (card, salary advance, financial education) creates an employer-
      mediated channel for consignado and other products with structural switching costs once payroll
      integration is active. However, no named employer clients or adoption statistics are public,
      making the B2B contribution to revenue entirely opaque from the outside.
