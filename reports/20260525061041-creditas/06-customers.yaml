  - id: adoption-and-trajectory
    title: Adoption, Growth, and Cross-Sell Strategy
    body: >-
      Creditas' aggregate portfolio metrics provide the clearest available signal of customer adoption. Total
      loan portfolio grew from R$6.77bn in Q3 2025 to R$7.6bn in Q1 2026, representing +22.4% year-over-year
      growth. Record quarterly origination of R$1.1bn in Q1 2026 (+29.2% YoY) was described as "sustained
      robust momentum across all lending business units, with Auto and Home Equity posting all-time-high
      quarterly volumes." The company claims over R$12.1 billion loaned and R$6.2 billion saved for customers
      cumulatively since 2012. These are aggregate company-level claims without segment-level breakdowns
      by borrower count, average loan size, or product-level portfolio shares in publicly accessible materials.

      Cross-sell is the stated strategic priority for customer expansion. Management describes the strategy of
      "scaling growth via cross-sell" as fundamental to reducing CAC and significantly increasing revenue per
      customer. Customer acquisition costs declined 0.9% YoY and 6.1% QoQ in Q4 2025 while origination grew
      +35.4% YoY, suggesting that returning customers or partner-driven origination is reducing unit
      acquisition cost. However, no NRR, GRR, churn rate, cohort retention data, or repeat-borrowing rate
      is disclosed in any public investor communication or product page. The phrase "high client recurrence"
      appears in the Q1 2026 outlook but is not quantified. This is the primary customer evidence gap: the
      adoption trajectory is credible at portfolio level but entirely unvalidated at individual customer
      lifecycle level.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU031
    tableRefs:
      - TU002
    figureRefs:
      - FU001

  - id: named-customer-proof
    title: Named Customer Proof and Customer Reference Quality
    body: >-
      Creditas' public materials contain very limited named-customer proof appropriate for a B2C fintech.
      The official benefits page (creditas.com/beneficios-empresas) includes testimonial-style proof sections
      but does not name individual employer clients. The auto insurance page claims "9 in 10 people renew
      their insurance with us" as a retention proof point, but this is company-stated with no independent
      corroboration. Consumer review platforms (iDinheiro, Guia do Investidor, Plusdin) consistently
      characterize Creditas as a reliable and leading secured-loan platform in Brazil but rely on editorial
      review rather than verified customer case studies. The Series F investor quote from Fidelity described
      Creditas as building "deep relationships with customers, drastically lowering the cost of credit,"
      providing third-party confirmation of the relationship-banking thesis but not of specific customer
      deployments. Google Play app reviews (present but without a disclosed rating in the fetched content)
      represent the most accessible form of individual customer feedback, though the structured rating was
      not retrieved in the research window.

      For the B2B benefits segment, no named employer clients, headcount size of client base, or penetration
      statistics are publicly disclosed. This is a material gap for investors seeking evidence of B2B traction.
      The B2B AWARDS recognition for best benefits management software validates the product but does not
      quantify the customer base.
    claimRefs:
      - CU011
      - CU017
      - CU018
      - CU022
      - CU028
      - CU029
      - CU030
    tableRefs:
      - TU003
    figureRefs:
      - FU003

  - id: complaint-signals
    title: Complaint Signals and Adverse Customer Evidence
    body: >-
      Reclame Aqui provides the most structured independent customer evidence available for Creditas. For
      the six-month period 01 November 2025 to 30 April 2026, Creditas received 1,949 complaints, responded
      to 91.2% of them (162 complaints still awaiting response at access date), resolved 70.1% of received
      complaints, and achieved an average satisfaction score of 5.28/10 from 597 evaluated complaints.
      Only 46.5% of evaluating customers said they would do business with Creditas again. The platform's
      composite reputation score is 6.4/10, classified as "Regular" (the middle tier between "Good" and
      "Bad" on the Reclame Aqui scale). The total historical complaint count of 15,673 across all active
      complaints in the Creditas database indicates sustained complaint accumulation over the company's
      12-year history.

      The complaint category breakdown reveals structural issues rather than isolated incidents. Unfair
      charges (cobrança indevida) lead at 2,231 complaints, followed by misleading advertising (propaganda
      enganosa) at 1,628, and difficulty completing operations at 1,547. Non-compliance with agreements
      (826), abusive interest rates (820), and poor customer service (655) round out the top categories.
      The prominence of "misleading advertising" as the second-largest category suggests a systemic gap
      between Creditas' marketing claims (emphasizing lowest rates, ease, and speed) and actual customer
      experience with rate complexity, process friction, or fee disclosure. For context, Nubank's Reclame
      Aqui score (fetched in the same research window) is higher, suggesting Creditas' "Regular" rating
      is below key digital-native competitors. The contrast with Creditas' own Reclame Aqui awards for
      2020–2022 points to a deterioration in complaint resolution performance in recent periods.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU023
      - CU024
      - CU025
      - CU034
      - CU035
      - CU036
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: retention-and-expansion
    title: Retention, Concentration, and Expansion Signals
    body: >-
      Creditas has no publicly disclosed retention metrics (NRR, GRR, churn) for any customer segment.
      The strongest proxy signals are: (1) auto insurance renewal rate of "9 in 10" (company-claimed,
      unverified), (2) management's repeated use of "high client recurrence" as a growth foundation without
      quantifying it, and (3) the structural product design of the Benefits platform, where the employer-
      employee relationship creates embedded switching costs once the payroll and HR processes are integrated.
      Cross-sell is explicitly cited as the mechanism for expanding revenue per customer: consignado-to-
      home-equity and insurance cross-sell opportunities exist for borrowers whose financial profile improves.

      Concentration risk at the individual customer level is structurally low given the mass-market consumer
      orientation and high loan count implied by the R$7.6bn portfolio and typical collateralized loan sizes.
      However, B2B concentration risk is unknown: if a small number of large employer clients represent a
      disproportionate share of Benefits platform revenue or consignado origination, this is not visible in
      public data. The partner channel (correspondentes) adds another concentration dimension: if a small
      number of large API partners drive a significant portion of auto or home equity origination, departure
      or renegotiation of a key partner would have a material impact on origination volumes. No partner
      concentration data is publicly disclosed.
    claimRefs:
      - CU008
      - CU009
      - CU017
      - CU019
      - CU031
      - CU032
      - CU033
      - CU037
      - CU038
