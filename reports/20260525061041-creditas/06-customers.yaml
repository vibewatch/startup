company:
  name: Creditas
chapter:
  number: 6
  title: Customers
  summary: >-
    Creditas serves three primary customer segments: (1) individual Brazilian consumers using home equity,
    vehicle equity, or payroll deduction as collateral for personal loans; (2) employers (B2B) onboarding
    the Creditas Benefícios platform for employees; and (3) partner correspondentes (B2B2C) originating loans
    via the API channel. Portfolio traction is strong—Q1 2026 record origination of R$1.1bn (+29.2% YoY)
    and a total loan portfolio of R$7.6bn—but named individual customers, retention cohorts, NRR, and churn
    metrics are entirely absent from public evidence. Adverse signals are material: Reclame Aqui rates Creditas
    as "Regular" (6.4/10) in the six-month period to April 2026, with 1,949 complaints, a 70.1% resolution
    rate, and only 46.5% of reviewers willing to do business again. Misleading advertising (1,628 complaints)
    and unfair charges (2,231 complaints) are the top complaint categories, indicating a structural gap
    between marketing claims and customer experience.
sections:
  - id: customer-segmentation
    title: Customer Segments and Distribution Channels
    body: >-
      Creditas targets four distinct customer segments through different access channels. The primary B2C
      segment consists of individual Brazilian consumers holding real-estate equity (homeowners), vehicle
      equity (car owners, including those with financed vehicles), or formal employment contracts (CLT workers
      eligible for payroll deduction). Home Equity borrowers skew toward middle-to-upper income Brazilian
      homeowners seeking large-ticket credit (R$50K–R$3M) at significantly lower rates than unsecured
      alternatives. Auto Equity borrowers are a more accessible mass-market segment given lower loan minimums
      (R$5K) and the broad ownership of vehicles in Brazil. The Consignado segment, expanded in 2025 under
      the Crédito do Trabalhador regulation, now reaches MEIs, rural workers, and domestic workers in addition
      to standard CLT employees, broadening the accessible formal labor market.

      The B2B segment consists of employers that adopt the Creditas Benefícios platform to provide their
      employees with flexible benefits, salary advance, and financial education. These employers are onboarded
      through a direct sales motion (HR team outreach and employee referral) with a 30-day implementation
      period. No named employer clients are disclosed in any public source. The B2B2C partner channel uses
      API-integrated correspondente bancário partners who originate loans on behalf of end borrowers; this
      channel is central to Creditas' strategy of reducing CAC through partner-led origination, as evidenced
      by the Auto Equity scaling in Q4 2025. Distribution is digital-first across all segments: web simulation,
      mobile app, and Portal do RH, with no physical branch network.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU019
      - CU021
      - CU026
    tableRefs:
      - TU001
    figureRefs:
