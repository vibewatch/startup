  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: >-
        NRR, GRR, churn rate, repeat-borrowing rate, and cohort-level retention curves by product and
        vintage for Home Equity, Auto Equity, and Consignado.
      whyItMatters: >-
        Customer durability is the single most important unknown for the customers chapter. Portfolio growth
        can be driven by new customer acquisition alone; without retention data, recurring revenue quality
        cannot be assessed.
      diligencePath: >-
        Request retention schedules by product cohort and vintage in due diligence; request monthly active
        borrower counts; request cross-sell conversion rates.
      relatedQuestionRefs: [QU007, QU013, QU019]
      relatedTableRefs: [TU002]

    - type: missing-source
      severity: material
      topic: named-B2B-clients
      missingEvidence: >-
        Named employer clients of Creditas Benefícios, with headcount covered and product adoption (card,
        salary advance, financial education, consignado) for each named client.
      whyItMatters: >-
        Without named clients, B2B traction is entirely unverifiable; employer churn, concentration, and
        contribution to consignado origination cannot be assessed.
      diligencePath: >-
        Request anonymized client list and top-3-client concentration; check Glassdoor, LinkedIn, or job
        postings mentioning Creditas Benefícios to find employer names.
      relatedQuestionRefs: [QU002, QU003, QU008, QU024]
      relatedTableRefs: [TU001, TU003]

    - type: private-evidence-only
      severity: material
      topic: app-ratings
      missingEvidence: >-
        Current Google Play star rating, review count, and full iOS App Store listing with ratings and
        review sentiment for the Creditas mobile app.
      whyItMatters: >-
        App ratings are the most accessible independent signal of product quality and customer satisfaction;
        absence leaves a gap in the customer experience assessment.
      diligencePath: >-
        Re-fetch Google Play listing with JavaScript rendering; search Apple App Store for Creditas
        Financial Solutions developer; review recent user comments for product quality signals.
      relatedQuestionRefs: [QU011, QU026]

    - type: missing-source
      severity: material
      topic: complaint-resolution-improvement
      missingEvidence: >-
        Evidence of Creditas' internal actions to address the top Reclame Aqui complaint categories
        (unfair charges, misleading advertising, difficulty completing operations) or their trajectory.
      whyItMatters: >-
        The 6.4/10 "Regular" score with only 46.5% repurchase intent is a customer experience risk; without
        evidence of corrective action, the risk of continued reputational and conversion drag is material.
      diligencePath: >-
        Request NPS tracking data and complaint root-cause analysis; check for recent Reclame Aqui
        improvement in subsequent months; review ombudsman reports (ouvidoria) for complaint trend data.
      relatedQuestionRefs: [QU004, QU009, QU017]
      relatedTableRefs: [TU004]

    - type: missing-source
      severity: minor
      topic: partner-channel-concentration
      missingEvidence: >-
        Top-10 API partner correspondentes by origination volume and their share of total quarterly
        origination, particularly for Auto Equity.
      whyItMatters: >-
        Departure or renegotiation of a major partner could materially impact origination volumes; the
        Q4 2025 Auto Equity record was explicitly described as partner-led.
      diligencePath: >-
        Request partner concentration data in due diligence; review BCB correspondente registration
        database for Creditas-linked entities.
      relatedQuestionRefs: [QU018]
      relatedTableRefs: [TU005]
