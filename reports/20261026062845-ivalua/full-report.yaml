chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Ivalua was founded in 2000 by David Khuat-Duy, and an August 2026 independent vendor profile places its
              headquarters in Redwood City, California (CO001, CO002). The product is positioned as an enterprise
              source-to-pay suite: sourcing, contracting, procurement, supplier management, payments and related
              processes share a unified data model (CO003). JAGGAER, a direct competitor, describes Ivalua as
              configurable and oriented toward complex procurement; that comparison is useful as attributed positioning,
              not as an independent benchmark (CO003). The operational implication is a wide workflow footprint, while
              the evidence does not establish implementation outcomes or customer economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.2'
        title: Financing, ownership and milestones
        blocks:
          - type: paragraph
            body: >-
              Public transaction histories indicate two earlier growth-equity rounds: KKR's reported $70 million
              investment in April 2017 and a $60 million round in May 2019, when the company announced a valuation above
              $1 billion (CO005-CO009). Ivalua's release described 2019 annual revenue as on pace to exceed $100
              million; this is a company forecast, not a verified result, ARR, or current run rate (CO010). Multiples.vc
              reports an Hg acquisition on December 1, 2024 for an undisclosed price, while a later profile still lists
              earlier investors without clarifying the post-transaction ownership structure (CO004). The timeline
              therefore records reported events rather than implying current valuation or financing capacity. The
              stakeholder table is deliberately partial.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
