      - - Low adoption or benefits not realized
        - Medium screening concern; a guidance provider calls adoption a genuine challenge, without a measured cohort.
        - High if expected workflow and savings benefits fail.
        - Unverified; no retention, utilization, or outcome cohort in the assigned evidence.
        - Unquantified; partner-promoted savings are not realized customer results.
        - Named-user adoption, active use, cycle time, benefits baseline, and post-go-live references.
      - - Undetected security or privacy exposure
        - Unassessed; available profile pages do not show check-level results or a complete incident history.
        - Potentially high given enterprise supplier and transaction data.
        - Unverified from retained material.
        - High information gap; no clean-history inference.
        - >-
          Current assurance reports, certification scope, penetration-test remediation, incident log, DPA, and
          subprocessors.
      - - Regulatory, legal, or IP constraint
        - Unassessed; the assigned sources do not establish current status.
        - Potentially high if an authorization, injunction, or obligation limits use.
        - Unverified.
        - Unknown pending counsel review.
        - Legal register, jurisdiction map, relevant proceedings, and applicable product approvals.
    notes: >-
      Screening ratings are analyst judgments tied to the cited evidence. Unknown incidence, control maturity, or
      outcomes are stated as gaps, not as proof of failure or safety.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Implementation design and configuration
        - Systems integrator plus Ivalua customer product owner
        - Not disclosed; named public partner material does not establish exclusivity.
        - Insufficient ownership or delivery capacity delays adoption or increases total program cost.
        - High if a critical deployment misses agreed acceptance.
        - >-
          Require accountable customer owner, scoped SOW, alternate qualified-provider options, and milestone-based
          acceptance; residual remains unquantified.
      - - Strategic alliance delivery
        - Deloitte and Ivalua
        - Alliance announced; share of pipeline or delivery is not stated.
        - Expected client outcomes or delivery capacity do not materialize.
        - Medium screening concern; no realized outcome data in the announcement.
        - Verify executed project references, responsibilities, and non-exclusive alternatives.
      - - Partner-promoted value case
        - Capgemini Ivalua solution material
        - Not applicable to a single named deployment; customer mix is not disclosed.
        - Promoted productivity or operating-cost claims fail to transfer to the buyer's baseline.
        - Medium screening concern; no named sample or methodology in the fetched page.
        - Build a customer-specific baseline and validate outcomes independently before underwriting savings.
      - - Sponsor and financial information
        - Hg / Genesis 10; Ivalua management
        - Ownership is identified, but control, leverage, and transaction terms are not disclosed in retained evidence.
        - Private financial or governance constraints change capital availability or strategic priorities.
        - High information risk; actual leverage and liquidity are unknown.
        - >-
          Request current accounts, debt and cash schedules, transaction terms, board/control rights, and exit-related
          governance.
    notes: >-
      The register records observable information limits and plausible dependency scenarios, not confirmed exclusivity,
      financial distress, excessive leverage, or partner failure.
