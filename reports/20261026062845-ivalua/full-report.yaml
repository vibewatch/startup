  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the category before sizing it
        blocks:
          - type: paragraph
            body: >-
              Procurement software is a workflow category, not a synonym for all corporate spend or supply-chain
              technology. Mordor Intelligence describes procurement software as covering online ordering, purchase
              orders, invoice matching and payment, alongside electronic sourcing requests; Gartner's product
              description places Ivalua across sourcing, supplier management, contracts, procurement, and invoice
              processing. Those descriptions show material overlap, but do not establish that every procurement-software
              dollar is addressable by Ivalua. The more defensible company-relevant boundary is enterprise source-to-pay
              workflows spanning source-to-contract and procure-to-pay. Adjacent ERP, corporate-card, expense, and
              broader supply-chain budgets are not separately valued by the evidence available here and should not be
              added to the market total.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: Category growth is not an Ivalua TAM
        blocks:
          - type: paragraph
            body: >-
              Mordor Intelligence estimates the global procurement-software market at USD 9.81 billion in 2025 and USD
              10.74 billion in 2026, and forecasts USD 17.11 billion by 2031, a 9.76% CAGR for 2026–2031. Its
              application, organization-size, and regional cuts indicate where spending is concentrated, but they are
              different denominators and not additive addressable-market layers. The chart therefore separates the
              category time series from selected 2025 shares; it does not imply that those shares sum to 100% or form a
              nested TAM/SAM/SOM. The report's proprietary estimation framework is not detailed in the fetched text. No
              public Ivalua-specific market share, module-level spend base, or qualifying customer count is established,
              so SAM and SOM remain open diligence questions rather than estimates.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM015
      - number: '2.3'
        title: Buyers and budget paths vary by workflow
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates that large enterprises remain the largest spending cohort, while SME
              procurement-software spending is forecast to grow quickly; neither statistic identifies Ivalua's own
              customer mix. The likely buyer group for a complex suite is procurement leadership working with finance,
              IT, legal, and operational stakeholders, but the actual budget owner and approval path are not disclosed.
              Forrester Consulting's Ivalua-commissioned TEI combines interviews with four decision-makers into a
              hypothetical composite organization; its assumptions illustrate the scale of one modeled buyer, not a
              representative customer or market average. A competitor's comparison describes Ivalua implementations as
              requiring upfront design and an internal configuration owner; that is a commercially interested view, not
              an independent benchmark.
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM016
      - number: '2.4'
        title: Adoption drivers face data and execution constraints
        blocks:
          - type: paragraph
            body: >-
              Workflow consolidation and procurement automation are the market's stated value proposition, but adoption
              depends on the buyer's ability to integrate systems, govern data, and absorb implementation and change
              costs. A Capgemini-Ivalua solution page advertises sizable cycle-time and savings outcomes without
              disclosing the underlying sample or calculation on that page; these are partner claims, not independently
              verified benchmarks. Separately, an Ardent Partners-Ivalua study as reported by The SCXchange describes
              substantial AI ambition alongside fragmented data, integration concerns, and governance gaps. The
              respondent base and sampling method are not in the fetched excerpt, so these percentages are directional
              survey evidence rather than a market-wide adoption rate. Diligence should test a target buyer's
              source-system landscape, data quality, process ownership, implementation capacity, and realized savings
              before applying category growth to Ivalua's sales opportunity.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans suites, adjacent tools, and orchestration
        blocks:
          - type: paragraph
            body: >-
              Gartner Peer Insights places Ivalua in Strategic Sourcing Application Suites and names Coupa, Zycus,
              JAGGAER, GEP, IBM, Synertrade, SAP, and Corcentric in its all-time alternatives list (CP001). Its separate
              overview says reviewers also considered Coupa, Zycus, and JAGGAER before buying Ivalua (CP003). These are
              buyer-consideration signals, not market shares or proof that every product is interchangeable. JAGGAER's
              own comparison presents Ramp as a card-led finance and spend-management platform with procurement layered
              in, making it adjacent rather than a full source-to-pay peer on the evidence reviewed (CP013).
              ProcurementMag describes Zip and ORO Labs as orchestration challengers, but its promotional tone and
              unsupported claims make that an early signal rather than a measured share shift (CP016). Manual processes,
              spreadsheets, and fragmented legacy tools remain a documented status-quo alternative in the four-interview
              Forrester study, not a vendor competitor (CP006).
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP012
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP015
      - number: '3.2'
        title: Breadth and configuration capacity are the key trade-off
        blocks:
          - type: paragraph
            body: >-
              Forrester describes Ivalua as covering sourcing, contracts, suppliers, and procurement operations, while
              JAGGAER's comparison describes a unified source-to-pay suite and attributes low-code configuration and a
              unified data model to Ivalua (CP012). The latter is a competitor's characterization, not an independent
              feature benchmark. JAGGAER also says Ivalua's model requires an internal configuration owner and upfront
              design work, whereas its own modular model can be activated in phases; the source has an incentive to
              favor JAGGAER (CP012). In a separate comparison, JAGGAER characterizes Ramp as oriented around cards,
              expenses, and accounts payable, and says it lacks direct-materials sourcing; treat those statements as
              competitor-authored positioning, not verified product tests (CP013). The matrix therefore marks
              unsupported vendor-by-vendor cells as unknown. In particular, this source pool does not substantiate
              comparable security, integration, channel reach, or switching-cost advantages across the named suites.
            claimRefs:
              - CP006
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Published pricing and modeled returns are not comparable quotes
        blocks:
          - type: paragraph
            body: >-
              The only captured directory price for Ivalua is Software Advice's displayed starting price of $150,000 per
              year, alongside a 3.8 rating from six reviews (CP004, CP005). Software Advice discloses that providers pay
              for sponsored profiles, so neither the price nor rating should be mistaken for an audited quote or broad
              customer benchmark. Forrester's commissioned Total Economic Impact study uses four decision-maker
              interviews and a modeled composite organization; its three-year benefit, cost, NPV, and ROI figures are
              scenario outputs, not Ivalua revenue, a customer guarantee, or a competing-vendor comparison
              (CP006-CP010). It estimates eight months of implementation and $845,000 in implementation costs for that
              composite (CP011). JAGGAER says both its own platform and Ivalua are custom-priced, while its Ramp
              comparison quotes a Ramp Plus starting price; these vendor-comparison statements still do not normalize
              modules, users, term, discounts, or implementation scope (CP014).
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP011
              - CP014
      - number: '3.4'
        title: Durability depends on implementation proof that public data does not settle
        blocks:
          - type: paragraph
            body: >-
              A unified platform may reduce fragmentation, but the available sources do not quantify the switching cost,
              customer multi-homing, renewal behavior, channel exclusivity, or module-level retention needed to
              establish durable lock-in. Gartner's captured profile shows 3.0 from 35 ratings and includes both
              favorable and critical reviewer excerpts; Gartner explicitly cautions that reviews are individual
              opinions, not statements of fact (CP001, CP002). The third-party RFP.wiki snapshot provides its own score
              and feature-score fields, but the captured text gives no scoring methodology, so those values should not
              be treated as a validated benchmark (CP015). Its plotted values are shown only as that publisher's
              display, not as validated comparative product performance. ProcurementMag's modular-ecosystem thesis
              raises a plausible displacement question, but its claims about vendor growth and outcomes lack
              substantiation in the fetched article (CP016). Before underwriting moat durability, diligence should
              obtain comparable customer references, full implementation plans and costs, realized discount schedules,
              renewal and churn cohorts, and proof of which workflows customers actually consolidate.
            claimRefs:
              - CP001
              - CP002
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public pricing is not underwriting evidence
            body: >-
              The directory starting price, commissioned TEI scenario, and competitor-published price claims use
              different scopes and issuers; obtain current, like-for-like quotes and implementation statements of work
              before comparing unit economics.
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
              - CP011
              - CP014
          - type: callout
            title: Suite breadth is not the only selection axis
            body: >-
              The available evidence distinguishes enterprise source-to-pay suites from adjacent card-led spend tools
              and orchestration challengers, but does not quantify switching costs or prove which category is displacing
              installed suites.
            calloutType: insight
            claimRefs:
              - CP001
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The available evidence describes Ivalua as a subscription software business whose enterprise pricing is
              negotiated rather than published. Reported pricing varies with modules, users, organization size, and
              implementation scope; the sources do not disclose realized contract values, recurring-revenue mix,
              implementation revenue, or revenue-recognition terms. A Forrester study describes license fees tied to
              modules and user counts, while a JAGGAER-authored comparison also says both vendors use custom quotes.
              These are pricing mechanisms, not proof of Ivalua's realized price or gross margin (CI001, CI002).
              Historical revenue evidence is dated and ambiguous. Multiples.vc lists $100 million of revenue for May
              2019 but explicitly says figures may be revenue or ARR and may be run-rate or trailing-twelve-month
              revenue. Gartner Peer Insights lists an annual-revenue band of $50 million–$250 million without a
              measurement date or method. Neither can establish current revenue, ARR, growth, or recognition quality;
              the source values should not be combined or treated as current (CI005, CI006).
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI005
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI009
      - number: '4.2'
        title: Buyer economics and delivery costs
        blocks:
          - type: paragraph
            body: >-
              Ivalua's customer value case is directionally plausible but not independently established as realized
              economics. Forrester Consulting says Ivalua commissioned its TEI study; the study interviews four
              decision-makers and models their experience as one composite retailer. Its reported $24.2 million in
              three-year, risk-adjusted present-value procurement-efficiency savings uses a composite with $500 million
              of annual procurement spend, not a representative audited customer result. The same model assumes $500,000
              in annual fees for 300 users and full platform functionality, with license costs flat for three years
              (CI007, CI008, CI009). Separately, Capgemini and Ivalua market potential productivity and operating-cost
              outcomes, including up to 50% higher productivity and 70% operational cost savings. These are
              partner-published outcome claims without customer-level baselines or calculation detail in the reviewed
              page, so they should not be compared directly with Forrester's modeled savings. A competitor-authored
              comparison says Ivalua requires more upfront design work and a dedicated internal configuration owner;
              that is a plausible implementation and service-delivery burden, but it is not a measured cost estimate. A
              Gartner user review also reports slow issue resolution, including a reviewer-reported average of up to
              three months for major issues (CI010, CI012, CI013).
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI008
              - CI010
              - CI012
      - number: '4.3'
        title: Capital needs and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $134 million raised across three rounds and identifies a $60 million May 2019 round;
              Multiples.vc reports a $130 million total across two rounds. The different historical totals appear to
              reflect different round coverage, and neither figure represents cash currently available. Multiples.vc
              says Hg acquired Ivalua in December 2024 for an undisclosed price, leaving transaction valuation,
              financing structure, and any acquisition debt unquantified in this evidence set (CI003, CI004). There is
              no current public evidence here for audited revenue or ARR, gross margin, cash, debt, operating cash flow,
              burn, runway, customer concentration, churn, or sales payback. Consequently, capital adequacy and a
              valuation-linked financial verdict cannot be underwritten from disclosed figures. Request current audited
              statements and a recurring-revenue bridge, then reconcile cash and debt, cash conversion, implementation
              economics, retention, and the sponsor's financing structure before setting a growth or valuation case. The
              specific data-room requests and their underwriting relevance are summarized in the unit-economics table.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Sources describe Ivalua as an enterprise source-to-pay suite, not a narrow purchasing tool: the named
              surface spans sourcing, contracts, supplier management, intake, eProcurement, invoice processing, payments
              and spend analysis (CE001, CE002). A competitor-authored comparison characterizes its architecture as a
              unified data model with low-code workflow changes (CE003); this is a useful product-positioning clue, not
              an independent benchmark or technical architecture review. BriefGlance reports that Ivalua introduced IVA
              Studio on June 11, 2026 and describes IVA as able to execute end-to-end S2P processes autonomously
              (CE004). That is a current product claim, not proof of production autonomy, model safeguards, or
              performance. The module matrix and product-surface stack therefore map publicly described capabilities
              while marking maturity and validation gaps explicitly.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
      - number: '5.2'
        title: Implementation evidence and outcome attribution
        blocks:
          - type: paragraph
            body: >-
              Ivalua’s implementation case should be underwritten as a complex enterprise deployment rather than an
              assumed self-serve SaaS rollout. A Forrester Consulting Total Economic Impact study commissioned by Ivalua
              interviewed four users and modeled their experiences as a composite retail organization (CE007, CE008).
              For that composite, the study estimates procurement-efficiency savings of $24.2 million in three-year
              risk-adjusted present value, based in part on annual savings of 2.25%–2.35% of $500 million in procurement
              spend (CE009); it also reports an 80% reduction from a 336-hour average supplier-onboarding process
              (CE010). These are study-specific estimates, not Ivalua-wide realized outcomes. The same study assigns
              eight months and $845,000 of internal resource, planning, and deployment costs to its composite
              implementation (CE016). Capgemini’s partner page separately advertises “up to” gains without disclosing a
              sample denominator (CE011), while Lemon Learning frames in-application guidance as an adoption aid
              (CE012). Test these claims against named references, scope, services costs, and post-go-live ownership
              before treating them as repeatable economics.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE016
      - number: '5.3'
        title: Configuration, integration, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              Public descriptions point to configurability and breadth as the core differentiation, but the evidence is
              not a component-level architecture specification. JAGGAER’s comparison says Ivalua uses a low-code
              framework and unified data model, while also warning that rollout needs upfront design and an internal
              configuration owner (CE003); because JAGGAER is a competitor, neither side of that comparison is an
              independent implementation benchmark. Fincons describes its own Ivalua competence center as providing
              implementation, configuration, integration, and management services (CE005). The Forrester study says the
              platform supports integrations and adaptation to complex organizational needs, but its commissioned,
              interview-based design limits generalization (CE006, CE007). Buyers should validate ERP and master-data
              interfaces, customization governance, upgrade behavior, supplier onboarding responsibility, and the effort
              needed to maintain workflows across entities. The architecture table separates what the sources name from
              what remains to be demonstrated.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, assurance, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not establish Ivalua’s service-level performance, security certifications,
              data-residency controls, AI permission boundaries, incident record, or independent penetration-test
              results. UpGuard’s page says its vendor risk report uses continuous monitoring across several risk
              categories, but the fetched public page does not disclose Ivalua’s score or individual findings (CE014). A
              SoftwareConnect testimonial describes a regulated-company deployment with little customization and a
              desire for compliance and control, but it is an unattributed individual account rather than assurance
              evidence (CE013). RFP Wiki recommends testing exception handling across intake, approvals, supplier data,
              policy, and ERP synchronization rather than relying on a happy-path demo (CE015). The pool also has no
              credible developer or practitioner-community activity signal; nor does it provide independently validated
              architecture or reliability evidence. These are diligence gaps, not proof of weak controls or an incident,
              and should be closed with current documentation, assurance reports, customer references, and
              scenario-based testing.
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Visible customer segments are enterprise-weighted, not a customer census
        blocks:
          - type: paragraph
            body: >-
              The available material points to large and operationally complex procurement environments, but it does not
              establish Ivalua's customer-base mix. G2 displays reviews from both enterprise users (more than 1,000
              employees) and mid-market users (51–1,000 employees); those are reviewer profile labels, not account
              counts or revenue segments (CU001). Forrester's Ivalua-commissioned study describes CACI as a $7.7 billion
              government contractor with 40,000 suppliers, while its separate composite organization is explicitly a
              model, not a named customer (CU009, CU010). A Procurement Magazine profile repeats Ivalua's statement that
              it manages more than US$500 billion in direct and indirect spend; this is spend processed/managed, not
              company revenue or customer count (CU012). The evidence therefore supports enterprise fit examples, but
              not geographic, vertical, payer, or account-size distributions. The table separates observed user profiles
              and named examples from modeled or company-issued scale claims, and records what each leaves unresolved.
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption proof mixes user reviews with a commissioned modeled study
        blocks:
          - type: paragraph
            body: >-
              Public adoption signals are not a consistent time series. G2's captured page lists a 4.3 rating from 114
              reviews and a nine-month average implementation time, but the page does not define the underlying sample,
              period, or implementation measure (CU001, CU002). G2 reviewers praise flexibility while also describing
              setup, partner-guidance, and supplier-onboarding obstacles (CU003). A SoftwareConnect testimonial from an
              unnamed regulated business describes replacing Excel, Word, and Access for contract work with an
              end-to-end Ivalua implementation and little customization; it supplies no customer name or quantified
              outcome (CU004). Forrester says Ivalua commissioned its TEI study, which interviewed four decision-makers
              and modeled a composite organization (CU005). Within those different bases, the G2 page's nine-month
              figure and Forrester's composite six-month implementation assumption both describe multi-month work, not a
              comparable benchmark (CU006). The CACI account in that study reports a 1.5-year selection and a phased
              full-scope rollout over two years, alongside supplier-onboarding outcomes (CU007, CU008). These examples
              support diligence on implementation planning, but not a promise of typical time-to-value or recurring
              adoption.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
