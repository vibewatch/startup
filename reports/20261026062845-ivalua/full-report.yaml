  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Implementation, adoption, and value capture
        blocks:
          - type: paragraph
            body: >
              The clearest evidenced execution risk is not a documented outage or failure rate; it is the organizational
              burden of configuring and adopting a broad source-to-pay suite. Softwr says that Ivalua configuration
              requires a systems integrator and an internal product owner, and JAGGAER's competitor comparison
              independently describes upfront design work and a dedicated owner. Lemon Learning, which sells in-app
              guidance for Ivalua, calls user adoption a genuine challenge. These sources differ in incentives and
              provide no comparable implementation cohort, so they establish a credible diligence issue, not a measured
              probability of failure (CR001, CR002, CR003).


              The cost envelope is also uncertain. Softwr says pricing is unpublished and implementation is priced
              separately; it gives no customer-specific invoice. Capgemini's partner page promotes productivity and
              operating-cost outcomes without a named sample or methodology in the fetched text. Do not capitalize those
              promoted savings or infer payback from managed spend: procurement throughput is not Ivalua revenue or cash
              generation (CR004, CR009, CR010). Before underwriting a rollout, require a named executive owner, scoped
              implementation statement of work, customer references at comparable complexity, adoption measures, and
              acceptance milestones. Missing ownership, a material schedule/cost deviation, or adoption below
              contractually agreed thresholds should pause expansion pending a recovery plan (CR016).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Security, legal, and reliability assurance
        blocks:
          - type: paragraph
            body: >
              The assigned security material is a diligence lead, not a security verdict. UpGuard describes continuous
              monitoring using 330+ external checks but the fetched Ivalua page does not disclose a score or check-level
              results. Nudge Security describes categories a vendor profile may cover and asks about breach history, yet
              its fetched page supplies no Ivalua-specific incident or control finding. Neither page establishes a clean
              incident history; absence of a disclosed event in these pages is not proof of absence (CR011, CR012,
              CR013).


              The retained evidence likewise does not establish Ivalua's current licenses or approvals, litigation or
              enforcement status, IP disputes, privacy terms, or AI-data controls. These remain open verification items
              rather than asserted adverse findings. For a product that may process enterprise supplier, contract,
              invoice, and spend data, request current independent assurance reports, certification scope and expiry,
              penetration-test remediation, incident history, data-flow and subprocessor inventories, contractual
              notification terms, and counsel's jurisdiction-by-jurisdiction legal review before treating the risk as
              controlled (CR014). The three-row register is intentionally partial: it identifies unresolved exposures,
              not a complete census of legal matters.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR014
      - number: '7.3'
        title: Sponsor, financial disclosure, and partner dependencies
        blocks:
          - type: paragraph
            body: >
              The available ownership record supports a transaction, not an assessment of current leverage or
              governance. Multiples.vc reports that Hg acquired Ivalua for an undisclosed price on 1 December 2024; MC
              Capital's January 2025 investment item identifies Hg's Genesis 10 fund but also gives no transaction
              terms. Multiples.vc's latest recorded revenue and valuation figures are both dated May 2019. Those
              historical revenue and valuation figures cannot substitute for current ARR, recognized revenue, cash,
              debt, burn, margin, or working-capital data (CR005, CR006, CR015).


              Deloitte announced a strategic alliance with Ivalua in August 2026, and Capgemini publishes an Ivalua
              solution page. This shows named ecosystem relationships, not exclusivity, a concentrated delivery channel,
              or realized commercial outcomes. Treat partner claims as commercially interested evidence and verify
              delivery capacity, alternative integrators, customer references, and the actual division of implementation
              responsibility (CR007, CR008, CR009). The financing and partner registers therefore rank disclosure and
              concentration as unquantified exposures; they do not assert that Ivalua has excessive leverage, a specific
              partner dependency, or weak governance.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
      - number: '7.4'
        title: Decision gates and thesis-break conditions
        blocks:
          - type: paragraph
            body: >
              Current evidence supports process gates rather than invented numeric risk thresholds. Before a deployment
              is treated as an underwritable expansion case, diligence should require a named accountable owner, an
              implementation baseline with scope and cost, customer-validated adoption and outcome measures, and
              independent evidence for security and regulatory controls. Set numeric tolerances in the contract and
              investment case using the buyer's own baseline; the assigned sources do not support a universal
              implementation duration, failure rate, or savings threshold (CR001, CR003, CR009, CR016).


              Pause or reprice the thesis if the company cannot provide current financial statements and
              transaction/governance terms, if a required certification or legal authorization is absent or out of
              scope, if an incident review reveals unresolved material exposure, or if a rollout misses buyer-agreed
              acceptance and adoption milestones without a credible remediation plan. These are diligence triggers, not
              claims that any such event has occurred. The main residual risk is therefore evidence asymmetry: public
              partner and vendor pages describe capabilities, while the information needed to quantify downside remains
              private or unverified (CR013, CR014, CR015, CR016).
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public security pages are not a clean bill of health
            body: >-
              The fetched UpGuard and Nudge pages do not disclose enough Ivalua-specific findings to establish either a
              breach or a clean incident history; request underlying assurance and incident evidence.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: callout
            title: Do not underwrite partner marketing as realized ROI
            body: >-
              Named partner pages establish commercial relationships and promoted outcomes, not independent validation,
              partner concentration, or customer-specific payback.
            calloutType: insight
            claimRefs:
