              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a broad source-to-pay platform with a long operating history and reported use across
              large enterprises. Hg's fetched portfolio page describes Ivalua as trusted by hundreds of brands, while a
              Supply Chain Digital article carrying company-issued material says dozens of leading financial
              institutions use the platform; neither statement is audited customer evidence. Procurement Magazine's
              profile describes a suite spanning supplier risk, sourcing, contracts, eProcurement, invoicing, payments,
              and spend analysis, but product breadth does not demonstrate current monetization. The counter-case is
              valuation opacity: the only concrete valuation/revenue reference in this pool is from 2019, and the Hg and
              Agila materials do not disclose consideration. A competitor- authored comparison describes
              implementation/configuration effort, while an archived Capterra review contains an individual complaint
              about slowness and errors; both are diligence signals, not prevalence estimates. UpGuard's current public
              page describes continuous monitoring but exposes no rating or findings, so it is neither evidence of a
              security incident nor proof of clean controls.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
              - CV010
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
              - CV009
              - CV017
      - number: '8.2'
        title: Entry price and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              The best-supported historical anchor is not a current mark: Ardian's May 2019 release reported a $60
              million growth-equity round valuing Ivalua at more than $1 billion and said the company was on pace to
              exceed $100 million in annual revenue that year. Multiples.vc records the same round as $1 billion on $100
              million of revenue and displays a 10.0x revenue multiple, but that is a secondary database calculation,
              not an audited financial statement or a current comparable. Hg's portfolio page associates Ivalua's
              partnership with Hg with 2024; AgilaCapital describes a minority investment alongside Hg and explicitly
              says the transaction terms were not disclosed. A VendorBenchmark page advertises 2026 pricing figures
              across 38+ commitments, but the fetched text discloses no transparent sample or methodology, so it is not
              a verified price or valuation input. Thus the assigned public evidence cannot establish the present
              enterprise value, equity value, dilution, preference stack, or sponsor return hurdle.       JAGGAER's
              competitor-authored comparison describes quote-based, scope-dependent arrangements rather than a published
              list price; it is not an independent benchmark. Do not translate historical revenue, funding raised, or
              product breadth into cash available or a present valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV014
              - CV015
              - CV007
              - CV017
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios, comparables, and diligence
        blocks:
          - type: paragraph
            body: >-
              Bull, base, and bear cases are decision frameworks rather than numerical forecasts. A credible bull case
              requires time-matched evidence of recurring revenue growth, retention, gross margin, and efficient
              implementation, plus a verified entry price and deal rights; none can be inferred from the 2019 revenue
              figure. The base case gives no credit for unverified growth or margins and treats the undisclosed Hg and
              Agila transaction terms as an unresolved entry-risk premium. The bear case is triggered if diligence finds
              slowing growth, weaker renewals, concentrated customers, margin pressure, implementation friction, or
              material security-control deficiencies; UpGuard's fetched page exposes no findings, so it is not evidence
              of either a breach or clean controls. Old individual reviews are prompts to test, not proof of current
              incidence. The available Multiples.vc screen is insufficient as a current comparable set: it is anchored
              to 2019 and does not provide a time-matched, verified peer cohort with consistent revenue definitions and
              operating metrics. VendorBenchmark's 2026 pricing figures also lack a transparent sample and methodology,
              so they are not a verified valuation reference. Obtain the current cap table and transaction documents,
              audited financials, cohort retention and customer concentration, debt/cash details, and a screened
              peer/transaction set before setting a price, return target, or exit window.
            claimRefs:
              - CV003
              - CV010
              - CV014
              - CV015
              - CV016
              - CV009
              - CV017
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV009
              - CV014
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV014
              - CV015
