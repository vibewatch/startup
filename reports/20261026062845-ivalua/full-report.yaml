      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Available sources identify founder David Khuat-Duy and name Franck Lheureux as CEO in an Ivalua-issued
              release; that release also identifies Khuat-Duy as Founder and Chief AI Officer (CO001, CO012). Its
              publication date is not visible in the fetched text, so it does not establish that these titles remain
              current on the report date. No assigned source supplies a complete executive or board roster, appointment
              history, control rights, or succession arrangements. The two named leaders give only a partial view of
              functional coverage; key-person dependence cannot be assessed from titles alone. The leadership table
              distinguishes attributed roles from diligence questions rather than treating an incomplete list as
              exhaustive.
            claimRefs:
              - CO001
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO012
      - number: '1.4'
        title: Scale, product claims and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Ivalua's release says it is trusted by over 500 admired brands, but that company-reported brand reach is
              not an independently verified customer count (CO013). The same release describes IVA Studio and
              platform-level permissions and logging; those are product claims, not independently tested controls, and
              the fetched text does not establish the product's current availability (CO012). UpGuard's public page
              describes continuous security monitoring but does not expose a rating or check-level findings in the
              retrieved text (CO014). ERP Research reports lengthy implementations and a steep learning curve, while
              Lemon Learning, which sells in-application learning services, also characterizes adoption as a challenge
              (CO016). Current revenue, ARR, valuation, headcount, exact customer count, debt, and adverse-event status
              remain unverified in this assigned evidence set.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO016
