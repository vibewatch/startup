      - number: '6.3'
        title: Named cases exist, but retention and expansion evidence is not disclosed
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof in this pool is CACI: the commissioned Forrester study describes the government
              contractor's deployment and reports supplier onboarding moving from an average of 21 days to one day, with
              98% of suppliers enabled (CU007, CU008). These are study-reported customer outcomes, not audited or
              independently sampled results. FeaturedCustomers' captured page lists customer-case-study titles for Maxim
              Healthcare Services, Cengage, Covea, Arval, and Technip, but the fetched text does not provide deployment
              status, dates, outcomes, or reference contacts for those entries (CU011). Capgemini's co-branded Ivalua
              page promotes performance figures for its combined solution without naming a customer or supplying the
              denominators and study design in the captured text (CU013). Across the retained materials, no customer
              retention, churn, renewal, cohort, expansion, or top-account concentration metric is reported (CU015,
              CU016). Competitor and alternatives pages discuss configuration, training, and implementation trade-offs
              but do not quantify customers switching from Ivalua (CU017). The named-proof table is consequently
              partial; logos and case-study headings cannot establish production status, outcomes, retention, or
              concentration.
            claimRefs:
              - CU007
              - CU008
              - CU011
