      - ["CACI selection process", "1.5 years", "Forrester's Ivalua-commissioned CACI account.", "Medium; study-reported case.", "Enterprise procurement selection may be lengthy.", "One named case; not a typical sales-cycle benchmark."]
      - ["CACI full S2P rollout", "Full scope deployed over two years in phased rollout.", "Forrester's Ivalua-commissioned CACI account.", "Medium; study-reported case.", "Implementation and benefit realization were phased.", "One account; not comparable with G2's page-level average."]
      - ["CACI supplier onboarding time", "Average 21 days to one day after implementation.", "Forrester's Ivalua-commissioned CACI account.", "Medium; study-reported outcome.", "Potential process-efficiency value in that case.", "Baseline and post-period are case-specific; no independent audit stated."]
      - ["CACI suppliers enabled", "98% of suppliers; the account context identifies 40,000 suppliers.", "Forrester's Ivalua-commissioned CACI account.", "Medium; study-reported outcome.", "Signals breadth of supplier enablement in that case.", "Study does not define the exact eligible-supplier denominator."]
      - ["Forrester composite implementation", "Six-month implementation assumption.", "Forrester composite financial model, derived from four interviews.", "Medium; modeled assumption.", "A scenario input, not a measured typical result.", "Composite assumptions are not an actual customer cohort."]
