      - ["Maxim Healthcare Services", "Customer-case-study title listed; use case details not present in captured text.", "Not stated.", "Not stated.", "Directory page exposes a title only."]
      - ["Cengage", "Customer-case-study title listed; use case details not present in captured text.", "Not stated.", "Not stated.", "Directory page exposes a title only."]
      - ["Covea", "Title references a single unified platform across a decentralized procurement organization.", "Not stated.", "Not stated.", "Directory page exposes a title only; no dates or quantified outcomes."]
      - ["Arval", "Customer-case-study title listed; use case details not present in captured text.", "Not stated.", "Not stated.", "Directory page exposes a title only."]
      - ["Technip", "Title references Ivalua supporting e-sourcing for a global industrial supply chain.", "Not stated.", "Not stated.", "Directory page exposes a title only; no dates or quantified outcomes."]
    enumerationScope:
      coverage: partial
      basis: "Partial set of named customer references visible in assigned prefetched case-study and commissioned-study text, not a complete or independently verified deployment census."
    notes: "The Forrester CACI account is an Ivalua-commissioned study. FeaturedCustomers supplies only case-study titles in the captured text; do not infer production status, active use, outcomes, or customer references from a title."
    claimRefs: [CU007, CU008, CU011]
