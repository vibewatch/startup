    title: Evidence map across the customer journey
    type: journey-map
    summary: "A source-bounded map of where adoption evidence exists and where durability or expansion proof is missing; it is not a claim that every customer follows this path."
    data:
      items:
        - label: Selection
          stage: Buyer evaluation
          detail: "Forrester's commissioned CACI account reports a 1.5-year selection process; this is one named case, not a typical sales cycle."
        - label: Implementation
          stage: Deployment
          detail: "CACI's full S2P rollout is reported over two years; G2 lists a nine-month average and Forrester models six months, with different bases."
        - label: Supplier onboarding
          stage: Early operational use
          detail: "Forrester reports CACI onboarding averaging 21 days before and one day after, with 98% of suppliers enabled; commissioned-study result."
        - label: User workflows
          stage: Adoption
          detail: "G2 reviews include enterprise and mid-market users, but review profiles do not measure active usage or account penetration."
        - label: Renewal and retention
          stage: Durability
          detail: "The assigned sources do not report NRR, GRR, churn, renewal rates, or retention cohorts."
        - label: Expansion and concentration
          stage: Expansion
          detail: "No customer-level module expansion, top-account share, or revenue concentration is disclosed in the assigned evidence."
    claimRefs: [CU006, CU007, CU008, CU015, CU016, CU017]
