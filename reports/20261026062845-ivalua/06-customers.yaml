company:
  name: Ivalua
chapter:
  number: 6
  title: Customers
  summary: Public customer evidence is strongest for enterprise-scale deployments and user experience, but remains a sparse, selected sample rather than a disclosed customer census. A commissioned Forrester study and review/testimonial pages document adoption examples and implementation friction; retention, expansion, concentration, and a representative adoption trajectory remain unverified.
sections:
  - id: visible-customer-segments
    title: Visible customer segments are enterprise-weighted, not a customer census
    body: >-
      The available material points to large and operationally complex procurement
      environments, but it does not establish Ivalua's customer-base mix. G2 displays
      reviews from both enterprise users (more than 1,000 employees) and mid-market
      users (51–1,000 employees); those are reviewer profile labels, not account
      counts or revenue segments (CU001). Forrester's Ivalua-commissioned study
      describes CACI as a $7.7 billion government contractor with 40,000 suppliers,
      while its separate composite organization is explicitly a model, not a named
      customer (CU009, CU010). A Procurement Magazine profile repeats Ivalua's
      statement that it manages more than US$500 billion in direct and indirect
      spend; this is spend processed/managed, not company revenue or customer count
      (CU012). The evidence therefore supports enterprise fit examples, but not
      geographic, vertical, payer, or account-size distributions. The table separates
      observed user profiles and named examples from modeled or company-issued scale
      claims, and records what each leaves unresolved.
    claimRefs: [CU001, CU009, CU010, CU012]
    tableRefs: [TU001]
  - id: adoption-and-implementation
    title: Adoption proof mixes user reviews with a commissioned modeled study
    body: >-
      Public adoption signals are not a consistent time series. G2's captured page
      lists a 4.3 rating from 114 reviews and a nine-month average implementation
      time, but the page does not define the underlying sample, period, or
      implementation measure (CU001, CU002). G2 reviewers praise flexibility while
      also describing setup, partner-guidance, and supplier-onboarding obstacles
      (CU003). A SoftwareConnect testimonial from an unnamed regulated business
      describes replacing Excel, Word, and Access for contract work with an
      end-to-end Ivalua implementation and little customization; it supplies no
      customer name or quantified outcome (CU004). Forrester says Ivalua commissioned
      its TEI study, which interviewed four decision-makers and modeled a composite
      organization (CU005). Within those different bases, the G2 page's nine-month
      figure and Forrester's composite six-month implementation assumption both
      describe multi-month work, not a comparable benchmark (CU006). The CACI
      account in that study reports a 1.5-year selection and a phased full-scope
      rollout over two years, alongside supplier-onboarding outcomes (CU007, CU008).
      These examples support diligence on implementation planning, but not a promise
      of typical time-to-value or recurring adoption.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named cases exist, but retention and expansion evidence is not disclosed
    body: >-
      The strongest named proof in this pool is CACI: the commissioned Forrester
      study describes the government contractor's deployment and reports supplier
      onboarding moving from an average of 21 days to one day, with 98% of suppliers
      enabled (CU007, CU008). These are study-reported customer outcomes, not
      audited or independently sampled results. FeaturedCustomers' captured page
      lists customer-case-study titles for Maxim Healthcare Services, Cengage,
      Covea, Arval, and Technip, but the fetched text does not provide deployment
      status, dates, outcomes, or reference contacts for those entries (CU011).
      Capgemini's co-branded Ivalua page promotes performance figures for its
      combined solution without naming a customer or supplying the denominators
      and study design in the captured text (CU013). Across the retained
      materials, no
      customer retention, churn, renewal, cohort, expansion, or top-account
      concentration metric is reported (CU015, CU016). Competitor and alternatives
      pages discuss configuration, training, and implementation trade-offs but do
      not quantify customers switching from Ivalua (CU017). The named-proof table
      is consequently partial; logos and case-study headings cannot establish
      production status, outcomes, retention, or concentration.
    claimRefs: [CU007, CU008, CU011, CU013, CU015, CU016, CU017]
    tableRefs: [TU003]
