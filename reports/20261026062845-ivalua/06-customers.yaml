    notes: "Values retain each source's metric, population, and time basis. The G2 aggregate, CACI account, and Forrester composite are not a common cohort or comparable time series; modeled and commissioned-study outcomes are not independently verified."
    claimRefs: [CU001, CU002, CU006, CU007, CU008, CU010]
