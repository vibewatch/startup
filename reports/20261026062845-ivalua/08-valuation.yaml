company:
  name: Ivalua
chapter:
  number: 8
  title: Valuation
  summary: Ardian reported a $60 million 2019 growth round at a valuation above $1 billion, but that historical mark is not a current entry price. Hg's portfolio page associates Ivalua's partnership with Hg with 2024, while AgilaCapital describes a minority investment alongside Hg without disclosing terms. The assigned evidence supplies no current financial denominator for a multiple or return; research-more is appropriate.
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is a broad source-to-pay platform with a long operating history and
      reported use across large enterprises. Hg's fetched portfolio page describes Ivalua
      as trusted by hundreds of brands, while a Supply Chain Digital article carrying
      company-issued material says dozens of leading financial institutions use
      the platform; neither statement is audited customer evidence. Procurement Magazine's
      profile describes a suite spanning supplier risk, sourcing, contracts, eProcurement,
      invoicing, payments, and spend analysis, but product breadth does not demonstrate
      current monetization. The counter-case is
      valuation opacity: the only concrete valuation/revenue reference in this pool is from
      2019, and the Hg and Agila materials do not disclose consideration. A competitor-
      authored comparison describes implementation/configuration effort, while an archived
      Capterra review contains an individual complaint about slowness and errors; both are
      diligence signals, not prevalence estimates. UpGuard's current public page describes
      continuous monitoring but exposes no rating or findings, so it is neither evidence
      of a security incident nor proof of clean controls.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
      - CV010
      - CV009
    tableRefs:
      - TV002
  - id: entry-discipline
    title: Entry price and valuation evidence
    body: >-
      The best-supported historical anchor is not a current mark: Ardian's May 2019 release
      reported a $60 million growth-equity round valuing Ivalua at more than $1 billion and
      said the company was on pace to exceed $100 million in annual revenue that year.
      Multiples.vc records the same round as $1 billion on $100 million of revenue and
      displays a 10.0x revenue multiple, but that is a secondary database calculation, not
      an audited financial statement or a current comparable. Hg's portfolio page associates
      Ivalua's partnership with Hg with 2024; AgilaCapital describes a minority investment
      alongside Hg and explicitly says the transaction terms were not disclosed. A
      VendorBenchmark page advertises 2026 pricing figures across 38+ commitments, but the
      fetched text discloses no transparent sample or methodology, so it is not a verified
      price or valuation input. Thus the
      assigned public evidence cannot establish the present enterprise value, equity value,
      dilution, preference stack, or sponsor return hurdle.       JAGGAER's competitor-authored comparison describes quote-based, scope-dependent
      arrangements rather than a published list price; it is not an independent benchmark.
      Do not translate historical revenue, funding raised, or product breadth into cash
      available or a present valuation.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV014
      - CV015
      - CV007
      - CV017
    tableRefs:
      - TV001
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and diligence
    body: >-
      Bull, base, and bear cases are decision frameworks rather than numerical forecasts.
      A credible bull case requires time-matched evidence of recurring revenue growth,
      retention, gross margin, and efficient implementation, plus a verified entry price
      and deal rights; none can be inferred from the 2019 revenue figure. The base case
      gives no credit for unverified growth or margins and treats the undisclosed Hg and
      Agila transaction terms as an unresolved entry-risk premium. The bear case is triggered
      if diligence finds slowing growth, weaker renewals, concentrated customers, margin
      pressure, implementation friction, or material security-control deficiencies; UpGuard's
      fetched page exposes no findings, so it is not evidence of either a breach or clean
      controls. Old individual reviews are prompts to test, not proof of current incidence.
      The available Multiples.vc screen is insufficient as a
      current comparable set: it is anchored to 2019 and does not provide a time-matched,
      verified peer cohort with consistent revenue definitions and operating metrics.
      VendorBenchmark's 2026 pricing figures also lack a transparent sample and methodology,
      so they are not a verified valuation reference.
      Obtain the current cap table and transaction documents, audited financials, cohort
      retention and customer concentration, debt/cash details, and a screened peer/transaction
      set before setting a price, return target, or exit window.
    claimRefs:
      - CV003
      - CV010
      - CV014
      - CV015
      - CV016
      - CV009
      - CV017
    tableRefs:
      - TV003
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision element
      - Current assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Current transaction price and operating metrics are not established in the retained evidence.
        - Do not make a buy decision until entry terms and current financials are verified.
      - - Confidence
        - Low
        - The key valuation anchor is from May 2019; the later investment terms are undisclosed.
        - Reassess after primary deal and financial diligence.
      - - Risk rating
        - High valuation and information risk; operating risk is not fully assessed here.
        - Current multiple, capital structure, and downside protection cannot be verified.
        - Require downside protection and a documented diligence record.
      - - Valuation stance
        - Not assessable at a current price
        - No current enterprise/equity value or time-matched financial denominator is disclosed.
        - Do not carry forward the 2019 valuation as an entry mark.
      - - Investment implication
        - Track / diligence before pricing
        - Product breadth and reported enterprise usage are positives, not a valuation method.
        - A price-sensitive call requires verified growth, margins, retention, and deal rights.
    notes: >-
      Historical financing and investor statements are attributed to their issuers; no
      current price, return, or probability is estimated from undisclosed terms.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV014
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence and limitation
      - What would strengthen it
      - What would weaken it
    rows:
      - - Unified source-to-pay product and enterprise use support a credible strategic asset.
        - Hg describes Ivalua as trusted by hundreds of brands; a company-issued article reports financial-institution use; neither is audited.
        - Customer references, deployments, module expansion, and renewal cohorts independently verified.
        - Evidence of stalled implementations, limited adoption, or declining renewal rates.
      - - Historical financing supports sponsor and investor interest, not today's valuation.
        - Ardian reported a 2019 growth round above $1B; Hg associates the partnership with 2024, and Agila says its terms are undisclosed.
        - Current price, capitalization, preference stack, and sponsor underwriting case disclosed.
        - A high entry mark unsupported by growth, margins, or cash conversion.
      - - Product investment may support durable workflow relevance.
        - Procurement Magazine describes a broad product suite; current attach rates and monetization are unproven.
        - Current attach rates, customer outcomes, and incremental recurring revenue by module.
        - Product breadth raises implementation costs without corresponding retention or expansion.
      - - Implementation and user-experience signals merit testing, not extrapolation.
        - A competitor comparison and individual archived Capterra reviews mention configuration effort and errors.
        - Recent independent customer interviews, support metrics, deployment timelines, and implementation economics.
        - Repeated, corroborated reports of delays, support failures, or performance issues.
      - - Public security evidence is incomplete, not a verified red flag.
        - UpGuard's current page describes continuous monitoring but exposes no Ivalua rating or findings.
        - Obtain the full report, review its scope and findings, and verify controls, certifications, and incident history.
        - A scoped assessment identifies material unremediated control gaps or significant incidents.
      - - Commercial pricing benchmarks are not verified valuation inputs.
        - VendorBenchmark advertises 2026 figures across 38+ commitments but provides no transparent sample or methodology.
        - Request the underlying cohort, contract dates, unit definitions, and anonymized deal-level support.
        - The claimed benchmarks cannot be reproduced or conflict with verified customer contract data.
    notes: >-
      Company and investor statements, a competitor comparison, selected historical reviews,
      a security-vendor summary, and an unverified commercial benchmark have different
      incentives and coverage; the signals are not treated as independent price or prevalence
      measures.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
      - CV009
      - CV017
  - id: TV003
    title: Bull, base, and bear valuation cases
    columns:
      - Case
      - Explicit assumptions to test
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Verified recurring-revenue growth, retention, and margins support durable expansion; current deal rights are acceptable.
        - No numeric range is supportable until current financials, entry price, and capitalization are disclosed.
        - Conditional upside only; probability not assigned.
        - Growth or retention fails diligence, or the entry multiple embeds unsupported expectations.
      - - Base
        - Product remains relevant, but current growth, margins, cash conversion, and Hg/Agila transaction terms remain unverified.
        - No defensible return or hold-period estimate without a current price and operating denominator.
        - Research-more; no probability weight assigned.
        - Verified metrics show weaker growth, lower margins, or materially adverse preference/debt terms.
      - - Bear
        - Growth slows or implementations, concentration, retention, or margin pressure impair the earnings trajectory.
        - Downside cannot be quantified without current capitalization and entry value; avoid implying a numeric floor.
        - Material downside is plausible but unweighted pending evidence.
        - Diligence confirms churn/concentration, poor cash conversion, material security-control gaps, or a highly dilutive/senior claim stack.
    notes: >-
      These are conditional cases, not forecasts. Valuation ranges and probability weights
      are intentionally unavailable because current company financials, transaction
      consideration, and security terms are missing from the assigned evidence. VendorBenchmark's
      stated pricing sample is not used because its methodology is not disclosed.
    claimRefs:
      - CV003
      - CV010
      - CV009
      - CV014
      - CV015
      - CV016
      - CV017
