evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-private-company-metrics
    missingEvidence: >-
      Current audited revenue, ARR, growth, margins, cash flow, headcount, exact customer count, concentration, and
      valuation.
    whyItMatters: >-
      Historical funding and company-reported brand reach do not establish current operating scale, profitability,
      retention, or valuation.
    diligencePath: >-
      Request audited financial statements, monthly KPI and ARR bridges, customer cohorts, employee roster, and the
      latest financing or valuation materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-hg-ownership-and-governance
    missingEvidence: >-
      Hg transaction price and structure, current capitalization, debt or credit facilities, board composition, voting
      rights, and management rollover.
    whyItMatters: >-
      The reported 2024 acquisition and older investor disclosures do not show current economic ownership, leverage, or
      control incentives.
    diligencePath: >-
      Obtain transaction documents or a management-approved cap table, debt schedule, board roster, and
      governance-rights summary.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: leadership-and-key-person-dependence
    missingEvidence: A current dated executive and board roster, role histories, succession plans, and named functional owners.
    whyItMatters: >-
      Two named leaders and undated title claims are insufficient to assess leadership continuity or key-person
      dependency.
    diligencePath: >-
      Verify current roles with the company and request an organization chart, board list, succession coverage, and
      retention arrangements.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: security-and-adverse-events
    missingEvidence: >-
      UpGuard's underlying rating and check-level findings, plus current independent evidence on material security
      incidents or regulatory matters.
    whyItMatters: >-
      A monitoring methodology or missing public result cannot establish either a security weakness or the absence of
      incidents.
    diligencePath: >-
      Request the full dated UpGuard report, current independent assurance reports, incident disclosures, and relevant
      regulatory or legal records.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: company-milestones
    missingEvidence: >-
      At least two additional independently dateable company milestones, including dated product, partnership,
      regulatory, or adverse-event history.
    whyItMatters: >-
      Only six dated entries meet the timeline evidence available here; the fetched IVA Studio release lacks a visible
      publication date and is not dated as an event.
    diligencePath: >-
      Check dated company newsroom and investor materials against independent reporting, filings, and legal or
      regulatory records.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Ivalua-specific market share, eligible customer universe, module-level addressable spend, and an evidenced
      serviceable obtainable market.
    whyItMatters: >-
      The global procurement-software forecast includes categories and buyers that may not fit Ivalua's enterprise
      source-to-pay scope, so applying its total market value to Ivalua would overstate the opportunity.
    diligencePath: >-
      Obtain Ivalua's current customer and module revenue segmentation, independently validate eligible enterprise spend
      and procurement software penetration by geography, then build a bottom-up SAM/SOM with explicit customer,
      contract, and adoption assumptions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: procurement-adoption-evidence
    missingEvidence: >-
      Full survey questionnaire, respondent count, sampling frame, geography, survey date, weighting, and segment
      breakdown for the Ardent Partners-Ivalua procurement AI study.
    whyItMatters: >-
      Without the sample and method, reported AI-readiness and data-barrier percentages cannot be generalized to
      enterprise procurement buyers or used to quantify adoption timing.
    diligencePath: >-
      Request the complete study methodology and tables, then test the findings against independent procurement leaders
      across enterprise, SME, public-sector, and regulated-industry cohorts.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: competitor scale and funding
    missingEvidence: >-
      Comparable current revenue, funding, customer counts, installed-base overlap, and target-segment data for Ivalua
