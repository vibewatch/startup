schemaVersion: "report-v2"
artifact: company-overview
slug: ivalua
runDate: 2026-10-26
company:
  name: Ivalua
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ivalua is a private enterprise source-to-pay software provider founded in
    2000, with a reported 2024 acquisition by Hg and a broad unified-platform
    proposition. Available evidence establishes historical financing and
    selected product claims, but not current financial scale, transaction
    terms, post-transaction control, or a complete leadership roster.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: >-
      Ivalua was founded in 2000 by David Khuat-Duy, and an August 2026
      independent vendor profile places its headquarters in Redwood City,
      California (CO001, CO002). The product is positioned as an enterprise
      source-to-pay suite: sourcing, contracting, procurement, supplier
      management, payments and related processes share a unified data model
      (CO003). JAGGAER, a direct competitor, describes Ivalua as configurable
      and oriented toward complex procurement; that comparison is useful as
      attributed positioning, not as an independent benchmark (CO003). The
      operational implication is a wide workflow footprint, while the evidence
      does not establish implementation outcomes or customer economics.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: financing-and-control
    title: Financing, ownership and milestones
    body: >-
      Public transaction histories indicate two earlier growth-equity rounds:
      KKR's reported $70 million investment in April 2017 and a $60 million
      round in May 2019, when the company announced a valuation above $1
      billion (CO005-CO009). Ivalua's release described 2019 annual revenue as
      on pace to exceed $100 million; this is a company forecast, not a
      verified result, ARR, or current run rate (CO010). Multiples.vc reports
      an Hg acquisition on December 1, 2024 for an undisclosed price, while a
      later profile still lists earlier investors without clarifying the
      post-transaction ownership structure (CO004). The timeline therefore
      records reported events rather than implying current valuation or
      financing capacity. The stakeholder table is deliberately partial.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Available sources identify founder David Khuat-Duy and name Franck
      Lheureux as CEO in an Ivalua-issued release; that release also identifies
      Khuat-Duy as Founder and Chief AI Officer (CO001, CO012). Its publication
      date is not visible in the fetched text, so it does not establish that
      these titles remain current on the report date. No assigned source
      supplies a complete executive or board roster, appointment history,
      control rights, or succession arrangements. The two named leaders give
      only a partial view of functional coverage; key-person dependence cannot
      be assessed from titles alone. The leadership table distinguishes
      attributed roles from diligence questions rather than treating an
      incomplete list as exhaustive.
    claimRefs: [CO001, CO012]
    tableRefs: [TO002]
  - id: scale-product-and-risk
    title: Scale, product claims and diligence limits
    body: >-
      Ivalua's release says it is trusted by over 500 admired brands, but that
      company-reported brand reach is not an independently verified customer
      count (CO013). The same release describes IVA Studio and platform-level
      permissions and logging; those are product claims, not independently
      tested controls, and the fetched text does not establish the product's
      current availability (CO012). UpGuard's public page describes continuous
      security monitoring but does not expose a rating or check-level findings
      in the retrieved text (CO014). ERP Research reports lengthy
      implementations and a steep learning curve, while Lemon Learning,
      which sells in-application learning services, also characterizes
      adoption as a challenge (CO016). Current revenue, ARR, valuation,
      headcount, exact customer count, debt, and adverse-event status remain
      unverified in this assigned evidence set.
    claimRefs: [CO012, CO013, CO014, CO016]
