      - ["Ardian Growth", "Ivalua's release identifies Ardian as an early investor increasing its investment in 2019; it says support began in 2011.", "Current stake after the Hg transaction is unknown.", "Confirm any continuing investment, rollover, or exit."]
      - ["Tiger Global Management", "Named as a new investor in the 2019 $60 million round.", "Current stake after the Hg transaction is unknown.", "Confirm exit or retained economics and any secondary sales."]
      - ["KKR", "Multiples.vc reports a $70 million 2017 round; Ivalua's 2019 release still lists KKR among shareholders.", "Current stake after the Hg transaction is unknown.", "Confirm exit, rollover, and historical/current governance rights."]
    notes: >-
      Partial historical stakeholder map, not a current cap table. Transaction
      announcements and database summaries do not establish current ownership,
      cash available, or control rights.
    enumerationScope:
      coverage: partial
      basis: "Named investors and management from public transaction reporting spanning 2017-2024; not an exhaustive current cap table."
    claimRefs: [CO004, CO005, CO006, CO008, CO011]
