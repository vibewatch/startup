      - [Current valuation, null, "As of 2026-10-26", "Gap", "Last reported valuation in the assigned sources was above $1 billion in 2019; not a current mark."]
      - [Total funding, "$130 million across two rounds, as reported by Multiples.vc", "Through 2019", "Medium", "No post-2019 funding, secondary, or debt total is established."]
      - [Revenue, null, "Current", "Gap", "Company said in 2019 it was on pace to exceed $100 million in annual revenue; forecast is not actual revenue."]
      - [ARR, null, "Current", "Gap", "No current ARR disclosure in the assigned sources; do not substitute revenue."]
      - [Customer count, null, "Current", "Gap", "Ivalua claims over 500 admired brands; that wording is not an exact customer count."]
      - [Headcount, null, "Current", "Gap", "No current employee count in the assigned sources."]
      - [Debt or credit, null, "Current", "Gap", "No debt balance, facility size, or terms are established."]
    notes: >-
      Values retain the source's period and attribution. Null means the current
      amount or count was not established in the assigned evidence, not zero.
      A forecast, ARR, revenue, valuation, and funding raised are distinct
      measures.
    claimRefs: [CO001, CO002, CO004, CO005, CO008, CO009, CO010, CO013]
