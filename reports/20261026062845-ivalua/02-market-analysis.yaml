  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Ivalua-specific market share, eligible customer universe, module-level
        addressable spend, and an evidenced serviceable obtainable market.
      whyItMatters: >-
        The global procurement-software forecast includes categories and buyers
        that may not fit Ivalua's enterprise source-to-pay scope, so applying
        its total market value to Ivalua would overstate the opportunity.
      diligencePath: >-
        Obtain Ivalua's current customer and module revenue segmentation,
        independently validate eligible enterprise spend and procurement
        software penetration by geography, then build a bottom-up SAM/SOM with
        explicit customer, contract, and adoption assumptions.
      relatedQuestionRefs:
