company:
  name: Ivalua
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Ivalua participates in the broad enterprise source-to-pay market, but the
    available public evidence does not isolate an Ivalua-specific serviceable
    market or buyer budget. Mordor Intelligence estimates a growing global
    procurement-software category, while buyer evidence points to integration,
    data readiness, adoption, and implementation effort as constraints on
    converting category growth into vendor revenue.
sections:
  - id: category-boundary
    title: Define the category before sizing it
    body: >-
      Procurement software is a workflow category, not a synonym for all
      corporate spend or supply-chain technology. Mordor Intelligence describes
      procurement software as covering online ordering, purchase orders,
      invoice matching and payment, alongside electronic sourcing requests;
      Gartner's product description places Ivalua across sourcing, supplier
      management, contracts, procurement, and invoice processing. Those
      descriptions show material overlap, but do not establish that every
      procurement-software dollar is addressable by Ivalua. The more defensible
      company-relevant boundary is enterprise source-to-pay workflows spanning
      source-to-contract and procure-to-pay. Adjacent ERP, corporate-card,
      expense, and broader supply-chain budgets are not separately valued by
      the evidence available here and should not be added to the market total.
    claimRefs:
      - CM001
      - CM002
    tableRefs:
      - TM001
  - id: market-sizing
    title: Category growth is not an Ivalua TAM
    body: >-
      Mordor Intelligence estimates the global procurement-software market at
      USD 9.81 billion in 2025 and USD 10.74 billion in 2026, and forecasts USD
      17.11 billion by 2031, a 9.76% CAGR for 2026–2031. Its application,
      organization-size, and regional cuts indicate where spending is
      concentrated, but they are different denominators and not additive
      addressable-market layers. The chart therefore separates the category
      time series from selected 2025 shares; it does not imply that those shares
      sum to 100% or form a nested TAM/SAM/SOM. The report's proprietary
      estimation framework is not detailed in the fetched text. No public
      Ivalua-specific market share, module-level spend base, or qualifying
      customer count is established, so SAM and SOM remain open diligence
      questions rather than estimates.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-segments
    title: Buyers and budget paths vary by workflow
    body: >-
      The available evidence indicates that large enterprises remain the
      largest spending cohort, while SME procurement-software spending is
      forecast to grow quickly; neither statistic identifies Ivalua's own
      customer mix. The likely buyer group for a complex suite is procurement
      leadership working with finance, IT, legal, and operational stakeholders,
      but the actual budget owner and approval path are not disclosed. Forrester
      Consulting's Ivalua-commissioned TEI combines interviews with four
      decision-makers into a hypothetical composite organization; its
      assumptions illustrate the scale of one modeled buyer, not a
      representative customer or market average. A competitor's comparison
      describes Ivalua implementations as requiring upfront design and an
      internal configuration owner; that is a commercially interested view,
      not an independent benchmark.
    claimRefs:
      - CM005
      - CM006
      - CM009
      - CM010
      - CM016
    tableRefs:
      - TM003
  - id: adoption-economics
    title: Adoption drivers face data and execution constraints
    body: >-
      Workflow consolidation and procurement automation are the market's
      stated value proposition, but adoption depends on the buyer's ability to
      integrate systems, govern data, and absorb implementation and change
      costs. A Capgemini-Ivalua solution page advertises sizable cycle-time and
      savings outcomes without disclosing the underlying sample or calculation
      on that page; these are partner claims, not independently verified
      benchmarks. Separately, an Ardent Partners-Ivalua study as reported by The
      SCXchange describes substantial AI ambition alongside fragmented data,
      integration concerns, and governance gaps. The respondent base and
      sampling method are not in the fetched excerpt, so these percentages are
      directional survey evidence rather than a market-wide adoption rate.
      Diligence should test a target buyer's source-system landscape, data
      quality, process ownership, implementation capacity, and realized
      savings before applying category growth to Ivalua's sales opportunity.
    claimRefs:
      - CM011
      - CM012
      - CM013
      - CM014
      - CM016
