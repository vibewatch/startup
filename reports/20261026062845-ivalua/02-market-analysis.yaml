  - id: TM003
    title: Buyer and adoption map
    columns:
      - Buyer archetype
      - User and likely budget stakeholders
      - Adoption trigger
      - Evidence in assigned sources
      - Diligence limitation
    rows:
      - - Large, multi-entity enterprise
        - >-
          Procurement leadership and sourcing/AP teams; finance and IT likely
          participate in budget and integration decisions.
        - >-
          Consolidating fragmented systems, standardizing workflows, and
          improving spend visibility.
        - >-
          Large enterprises represented 58.82% of 2025 spending in Mordor's
          estimate; Forrester's composite has 300 users and 10,000 suppliers.
        - >-
          Budget-owner roles are not established as universal; the Forrester
          composite is not a representative customer.
      - - SME or midmarket buyer
        - >-
          Procurement or finance lead; CFO/finance budget ownership is a
          hypothesis to test.
        - >-
          Lower-friction adoption and demonstrable process savings would matter
          where procurement teams are smaller.
        - >-
          Mordor forecasts SME category spending growth of 9.77% CAGR for
          2026–2031.
        - >-
          The evidence does not establish Ivalua's SME penetration, price,
          win rate, or expected deployment cost.
      - - Regulated or public-sector organization
        - >-
          Procurement, IT/security, legal, and compliance stakeholders may
          shape selection.
        - >-
          Auditability, supplier controls, data governance, and integration
          with existing systems.
        - >-
          Forrester's four interviewees include insurance, national-security
          and defense, and other complex organizations; Mordor discusses
          compliance and integration restraints.
        - >-
          Interview examples do not establish prevalence or public-sector
          procurement budgets.
      - - High-volume procure-to-pay buyer
        - >-
          Accounts payable and procurement operations, with finance involved
          in process economics.
        - >-
          Invoice workflow automation, matching, and purchase-order controls.
        - >-
          Mordor reports P2P at 62.81% of 2025 application revenue; Gartner
          describes requisition, purchase-order, and payment capabilities.
        - >-
          Segment share does not establish Ivalua's product-level revenue or
          customer-specific ROI.
      - - Direct-materials or complex-sourcing buyer
        - >-
          Category management, procurement, and supply-chain operations.
        - >-
          Supplier and sourcing workflows aligned to direct-materials or
          multi-entity needs.
        - >-
          JAGGAER's competitor comparison describes Ivalua coverage of direct
          materials and sourcing, while also asserting configuration effort.
        - >-
          Competitor content is commercially interested and not an independent
          implementation benchmark.
    notes: >-
      Partial analytical archetypes, not an exhaustive enumeration of buyers.
      Stakeholder and budget-owner assignments are hypotheses; validate actual
      procurement ownership, contract scope, implementation resources, and
      approval path with customers.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM009
      - CM016
