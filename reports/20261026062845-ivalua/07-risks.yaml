      - [Strategic alliance delivery, "Deloitte and Ivalua", "Alliance announced; share of pipeline or delivery is not stated.", "Expected client outcomes or delivery capacity do not materialize.", "Medium screening concern; no realized outcome data in the announcement.", "Verify executed project references, responsibilities, and non-exclusive alternatives."]
      - [Partner-promoted value case, "Capgemini Ivalua solution material", "Not applicable to a single named deployment; customer mix is not disclosed.", "Promoted productivity or operating-cost claims fail to transfer to the buyer's baseline.", "Medium screening concern; no named sample or methodology in the fetched page.", "Build a customer-specific baseline and validate outcomes independently before underwriting savings."]
      - [Sponsor and financial information, "Hg / Genesis 10; Ivalua management", "Ownership is identified, but control, leverage, and transaction terms are not disclosed in retained evidence.", "Private financial or governance constraints change capital availability or strategic priorities.", "High information risk; actual leverage and liquidity are unknown.", "Request current accounts, debt and cash schedules, transaction terms, board/control rights, and exit-related governance."]
    notes: "The register records observable information limits and plausible dependency scenarios, not confirmed exclusivity, financial distress, excessive leverage, or partner failure."
    claimRefs: [CR001, CR005, CR006, CR007, CR008, CR009, CR015]
