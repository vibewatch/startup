company:
  name: Ivalua
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a subscription, custom-quoted enterprise model, but does not establish current revenue, margins, sales efficiency, or capital adequacy. Historical financing and a commissioned buyer-economics model are useful context, not substitutes for current audited company financials.
sections:
  - id: revenue-model
    title: Revenue model and disclosure quality
    body: >-
      The available evidence describes Ivalua as a subscription software business whose enterprise pricing is negotiated rather than published. Reported pricing varies with modules, users, organization size, and implementation scope; the sources do not disclose realized contract values, recurring-revenue mix, implementation revenue, or revenue-recognition terms. A Forrester study describes license fees tied to modules and user counts, while a JAGGAER-authored comparison also says both vendors use custom quotes. These are pricing mechanisms, not proof of Ivalua's realized price or gross margin (CI001, CI002).
      Historical revenue evidence is dated and ambiguous. Multiples.vc lists $100 million of revenue for May 2019 but explicitly says figures may be revenue or ARR and may be run-rate or trailing-twelve-month revenue. Gartner Peer Insights lists an annual-revenue band of $50 million–$250 million without a measurement date or method. Neither can establish current revenue, ARR, growth, or recognition quality; the source values should not be combined or treated as current (CI005, CI006).
    claimRefs: [CI001, CI002, CI005, CI006]
    tableRefs: [TI001, TI002]
  - id: customer-economics
    title: Buyer economics and delivery costs
    body: >-
      Ivalua's customer value case is directionally plausible but not independently established as realized economics. Forrester Consulting says Ivalua commissioned its TEI study; the study interviews four decision-makers and models their experience as one composite retailer. Its reported $24.2 million in three-year, risk-adjusted present-value procurement-efficiency savings uses a composite with $500 million of annual procurement spend, not a representative audited customer result. The same model assumes $500,000 in annual fees for 300 users and full platform functionality, with license costs flat for three years (CI007, CI008, CI009).
      Separately, Capgemini and Ivalua market potential productivity and operating-cost outcomes, including up to 50% higher productivity and 70% operational cost savings. These are partner-published outcome claims without customer-level baselines or calculation detail in the reviewed page, so they should not be compared directly with Forrester's modeled savings. A competitor-authored comparison says Ivalua requires more upfront design work and a dedicated internal configuration owner; that is a plausible implementation and service-delivery burden, but it is not a measured cost estimate. A Gartner user review also reports slow issue resolution, including a reviewer-reported average of up to three months for major issues (CI010, CI012, CI013).
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital needs and underwriting verdict
    body: >-
      Tracxn reports $134 million raised across three rounds and identifies a $60 million May 2019 round; Multiples.vc reports a $130 million total across two rounds. The different historical totals appear to reflect different round coverage, and neither figure represents cash currently available. Multiples.vc says Hg acquired Ivalua in December 2024 for an undisclosed price, leaving transaction valuation, financing structure, and any acquisition debt unquantified in this evidence set (CI003, CI004).
      There is no current public evidence here for audited revenue or ARR, gross margin, cash, debt, operating cash flow, burn, runway, customer concentration, churn, or sales payback. Consequently, capital adequacy and a valuation-linked financial verdict cannot be underwritten from disclosed figures. Request current audited statements and a recurring-revenue bridge, then reconcile cash and debt, cash conversion, implementation economics, retention, and the sponsor's financing structure before setting a growth or valuation case. The specific data-room requests and their underwriting relevance are summarized in the unit-economics table.
    claimRefs: [CI003, CI004, CI005, CI006]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and disclosure
    columns: [Stream or metric, What the evidence says, Current company value, Underwriting implication]
    rows:
      - [Platform subscription, "Multiples.vc describes a subscription revenue model.", Not disclosed, "Potential recurring base; verify contract term and recognition policy."]
      - [Modules and user scope, "Forrester interviewees describe annual license fees based on modules and users.", Not disclosed, "Expansion can increase license costs; segment price realization is unknown."]
      - [Professional services and support, "Forrester describes implementation and professional-service costs borne by the composite buyer.", Not disclosed, "Ivalua's services revenue and delivery margin are not separately disclosed."]
      - [Historical revenue, "$100M listed for May 2019; source notes figures can be revenue or ARR and run-rate or LTM.", Not disclosed for 2026, "Do not treat this historical, ambiguous figure as current revenue or ARR."]
    notes: >-
      Values reflect third-party descriptions and a dated historical metric, not company financial statements. Revenue and ARR are not interchangeable; no current revenue mix or recognition detail was found in the assigned evidence.
    claimRefs: [CI001, CI005, CI009]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing input, Evidence, Value or status, Diligence implication]
    rows:
      - [Published list price, "The company does not publish a list price; VendorBenchmark posts unverified deal estimates.", "No company list price; benchmark estimates lack disclosed deal-level evidence", "Obtain executed contracts and realized price by segment."]
      - [Quote drivers, "Module selection, user count, organization size, and deployment scope are cited.", Qualitative only, "Separate committed recurring license from optional modules and services."]
      - [Modeled annual fee, "Forrester composite assumption: full functionality for 300 users.", "$500,000 per year assumed, not actual company ASP", "Test current quote and renewal terms against the model."]
      - [Buyer returns, "Forrester composite's procurement-efficiency savings are risk-adjusted PV.", "$24.2M over three years on $500M annual procurement spend", "Validate baseline spend, attribution, implementation costs, and realized benefits."]
    notes: >-
      The Forrester values are assumptions and modeled results for a composite organization in an Ivalua-commissioned study. VendorBenchmark claims a 38+ commitment sample but provides no deal-level evidence in the retrieved page; treat its estimates as unverified. Partner and competitor descriptions do not establish realized customer pricing.
    claimRefs: [CI002, CI007, CI008, CI009]
  - id: TI003
    title: Unit-economics and capital diligence gaps
    columns: [Metric, Public evidence in assigned sources, Status, Diligence request]
    rows:
      - [Revenue / ARR, "One third-party May 2019 figure is labeled revenue but may be ARR, run-rate, or LTM.", "Current value unavailable; metric basis unresolved.", "Audited revenue bridge by recurring license, services, and other revenue."]
      - [Gross margin, No current company-level gross-margin disclosure identified., Unavailable, "Gross margin by subscription and services; hosting and support cost allocation."]
      - [CAC and payback, "No company-level CAC, sales-cycle, or payback data identified.", Unavailable, "Bookings, sales and marketing expense, cohort CAC, and payback by segment."]
      - [Retention and concentration, "No current churn, net retention, or customer concentration data identified.", Unavailable, "Gross/net retention, cohort expansion, churn, and top-customer revenue shares."]
      - [Implementation economics, "The sources describe implementation effort and modeled buyer costs, not Ivalua delivery margin.", "Company delivery cost and services margin unavailable.", "Implementation hours, partner share, services utilization, and margin by deployment."]
      - [Cash and financing, "The sources report historical funding and an undisclosed-price Hg acquisition, not current balance-sheet resources.", "Cash, debt, burn, and runway unavailable.", "Latest balance sheet, cash flow, debt schedule, acquisition financing, and liquidity forecast."]
    notes: >-
      “Unavailable” means not disclosed in the successful assigned sources reviewed for this chapter, not that the metric is zero or that no evidence exists elsewhere. Historical funding raised is not cash on hand.
    claimRefs: [CI003, CI004, CI005, CI006, CI012]
figures:
  - id: FI001
    title: From enterprise scope to buyer value
    type: flow
    summary: Quote-based scope and implementation shape buyer cost, while the available savings evidence is modeled or partner-published rather than verified Ivalua revenue or customer returns.
    data:
      nodes:
        - id: scope
          label: Enterprise procurement scope
          detail: "The evidence describes an enterprise platform whose quote depends on the buyer's deployment scope."
        - id: quote
          label: Negotiated annual license
          detail: "No standard list price or current realized contract value is disclosed in the assigned sources."
        - id: design
          label: Configuration and implementation
          detail: "A competitor-authored comparison describes upfront design work before deployment."
        - id: owner
          label: Internal configuration owner
          detail: "The same comparison says a dedicated internal owner is needed; customer-specific delivery costs are unavailable."
        - id: value
          label: Modeled buyer value
          detail: "Forrester reports a commissioned composite model; Capgemini and Ivalua separately publish potential outcome claims."
        - id: disclosure
          label: Issuer financial disclosure
          detail: "The reviewed sources do not establish current recognized revenue or gross margin for Ivalua."
      edges:
        - from: scope
          to: quote
          label: shapes quote
        - from: quote
          to: design
          label: precedes configuration
        - from: design
          to: owner
          label: requires internal ownership
        - from: owner
          to: value
          label: study models potential benefits
        - from: value
          to: disclosure
          label: does not establish issuer results
    claimRefs: [CI002, CI005, CI006, CI008, CI010, CI012]
