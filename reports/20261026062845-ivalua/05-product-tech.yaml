schemaVersion: "report-v2"
artifact: product-tech
slug: ivalua
runDate: 2026-10-26
company:
  name: Ivalua
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    The assigned evidence describes Ivalua as a broad source-to-pay platform spanning
    sourcing, contracts, supplier management, procurement, invoicing and payments, with
    a shared-data-model and configurable-workflow positioning plus newly announced IVA
    Studio. Yet implementation and outcome evidence is largely sponsored, partner- or
    competitor-authored, and the pool does not establish underlying architecture,
    independent security controls, reliability, or public developer activity.
sections:
  - id: product-surface
    title: Product surface and workflow coverage
    body: >-
      Sources describe Ivalua as an enterprise source-to-pay suite, not a narrow
      purchasing tool: the named surface spans sourcing, contracts, supplier
      management, intake, eProcurement, invoice processing, payments and spend
      analysis (CE001, CE002). A competitor-authored comparison characterizes its
      architecture as a unified data model with low-code workflow changes (CE003);
      this is a useful product-positioning clue, not an independent benchmark or
      technical architecture review. BriefGlance reports that Ivalua introduced IVA
      Studio on June 11, 2026 and describes IVA as able to execute end-to-end S2P
      processes autonomously (CE004). That is a current product claim, not proof of
      production autonomy, model safeguards, or performance. The module matrix and
      product-surface stack therefore map publicly described capabilities while
      marking maturity and validation gaps explicitly.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: deployment-and-outcomes
    title: Implementation evidence and outcome attribution
    body: >-
      Ivalua’s implementation case should be underwritten as a complex enterprise
      deployment rather than an assumed self-serve SaaS rollout. A Forrester Consulting
      Total Economic Impact study commissioned by Ivalua interviewed four users and
      modeled their experiences as a composite retail organization (CE007, CE008).
      For that composite, the study estimates procurement-efficiency savings of
      $24.2 million in three-year risk-adjusted present value, based in part on annual
      savings of 2.25%–2.35% of $500 million in procurement spend (CE009); it also
      reports an 80% reduction from a 336-hour average supplier-onboarding process
      (CE010). These are study-specific estimates, not Ivalua-wide realized outcomes.
      The same study assigns eight months and $845,000 of internal resource, planning,
      and deployment costs to its composite implementation (CE016). Capgemini’s
      partner page separately advertises “up to” gains without disclosing a sample
      denominator (CE011), while Lemon Learning frames in-application guidance as an
      adoption aid (CE012). Test these claims against named references, scope, services
      costs, and post-go-live ownership before treating them as repeatable economics.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE016
    tableRefs:
      - TE002
  - id: architecture-and-dependencies
    title: Configuration, integration, and operating dependencies
    body: >-
      Public descriptions point to configurability and breadth as the core
      differentiation, but the evidence is not a component-level architecture
      specification. JAGGAER’s comparison says Ivalua uses a low-code framework and
      unified data model, while also warning that rollout needs upfront design and an
      internal configuration owner (CE003); because JAGGAER is a competitor, neither
      side of that comparison is an independent implementation benchmark. Fincons
      describes its own Ivalua competence center as providing implementation,
      configuration, integration, and management services (CE005). The Forrester
      study says the platform supports integrations and adaptation to complex
      organizational needs, but its commissioned, interview-based design limits
      generalization (CE006, CE007). Buyers should validate ERP and master-data
      interfaces, customization governance, upgrade behavior, supplier onboarding
      responsibility, and the effort needed to maintain workflows across entities.
      The architecture table separates what the sources name from what remains to be
      demonstrated.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
    tableRefs:
      - TE003
  - id: trust-and-technical-proof
    title: Trust, assurance, and evidence gaps
    body: >-
      The assigned pool does not establish Ivalua’s service-level performance,
      security certifications, data-residency controls, AI permission boundaries,
      incident record, or independent penetration-test results. UpGuard’s page says
      its vendor risk report uses continuous monitoring across several risk
      categories, but the fetched public page does not disclose Ivalua’s score or
      individual findings (CE014). A SoftwareConnect testimonial describes a
      regulated-company deployment with little customization and a desire for
      compliance and control, but it is an unattributed individual account rather
      than assurance evidence (CE013). RFP Wiki recommends testing exception handling
      across intake, approvals, supplier data, policy, and ERP synchronization rather
      than relying on a happy-path demo (CE015). The pool also has no credible
      developer or practitioner-community activity signal; nor does it provide
      independently validated architecture or reliability evidence. These are
      diligence gaps, not proof of weak controls or an incident, and should be closed
      with current documentation, assurance reports, customer references, and
      scenario-based testing.
    claimRefs:
      - CE013
      - CE014
      - CE015
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or product surface
      - Buyer or user
      - Publicly described status
      - Differentiation signal
      - Validation gap
    rows:
      - - Sourcing and contracts
        - Category managers and legal/procurement teams
        - Described as part of the source-to-pay suite
        - Shared workflow/data-model positioning
        - Verify contract-to-purchasing enforcement and exception handling in production
      - - Supplier management and risk
        - Supplier owners and procurement teams
        - Named in platform profiles and partner material
        - Supplier records, performance, and risk are presented within the wider suite
        - Validate risk-data sources, monitoring coverage, and supplier adoption
      - - Intake and eProcurement
        - Employees, approvers, and procurement operations
        - Intake and guided buying are described in a competitor comparison
        - Routing requests into procurement workflows
        - Confirm release availability, configuration burden, and ERP handoffs
      - - Invoicing, AP, and payments
        - Accounts-payable and finance teams
        - Named as platform capabilities in external profiles
        - Purchase-to-payment workflow breadth
        - Verify country coverage, matching accuracy, controls, and live customer results
      - - IVA and IVA Studio
        - Procurement users and workflow owners
        - IVA Studio launch is reported; autonomy is not independently verified
        - AI-assisted or agentic process execution is the stated direction
        - Inspect model choices, permissions, human approval points, audit logs, and production limits
    notes: >-
      Module descriptions are sourced from company/partner materials, profiles, and a
      competitor comparison; they do not establish general availability, customer
      adoption, or technical maturity. Validate each row against current product
      documentation and reference deployments.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Prior/current workflow in the cited evidence
      - Ivalua solution described
      - Reported measurable benefit
      - Limitation and diligence ask
    rows:
      - - Procurement efficiency and spend control
        - Composite interviewees described fragmented tools and manual processes
        - Centralized source-to-pay workflows
        - "Forrester composite: $24.2 million three-year risk-adjusted PV savings; 2.25%–2.35% of $500 million annual procurement spend"
        - Commissioned composite estimate, not a company-wide result; request customer-level baselines and realized savings
      - - Supplier onboarding
        - Forrester composite baseline averaged 336 hours (14 days) per supplier
        - Digitized and automated supplier onboarding
        - Forrester reports an 80% reduction in onboarding time for its composite
        - Validate the starting population, process boundary, time period, and post-implementation distribution
      - - Partner-marketed productivity and operating cost
        - Capgemini page describes procurement operating friction
        - Capgemini/Ivalua integrated solution
        - Partner page says “up to 50%” productivity increase and “70%” operational cost savings
        - No underlying sample, baseline, or denominator is supplied on the fetched page; treat as promotional claims
      - - Adoption and user support
        - Lemon Learning describes source-to-pay complexity as an adoption challenge
        - In-application walkthroughs supplied by Lemon Learning alongside Ivalua
        - No quantified adoption or support outcome in the fetched text
        - Establish whether an overlay is used, who maintains guidance, and how usage or support burden changes
      - - Deployment and internal effort
        - Forrester composite implementation
        - Configuration and deployment of the platform
        - Eight months and $845,000 in internal resource time, planning, and deployment costs in the composite
        - Study-specific estimate; reconcile scope, services, integrations, and training with customer references
    notes: >-
      Forrester Consulting was commissioned by Ivalua and modeled four interviewees’
      experiences as a composite; its financial figures are study outputs, not audited
      Ivalua metrics. Capgemini is an implementation partner and does not disclose the
      basis for its “up to” figures on this page. Keep these denominators and
      qualifications attached to each value.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE016
  - id: TE003
    title: Technology and operating architecture evidence
    columns:
      - Layer or dependency
      - Role described by sources
      - Evidence and relationship
      - Technical or operating risk
      - Diligence needed
    rows:
      - - Shared platform and data model
        - Connects product modules across source-to-pay
        - Unified model described by competitor-authored material
        - Underlying schema, tenancy, and data boundaries are not documented in the pool
        - Request architecture diagrams, data-flow maps, and change/upgrade documentation
      - - Workflow configuration
        - Shapes approvals and procurement processes
        - Low-code/configurable positioning; competitor notes need for an internal owner
        - Customization may increase implementation and support burden
        - Demonstrate configuration ownership, test/release controls, and upgrade compatibility
      - - ERP and enterprise integration
        - Connects procurement processes with existing systems
        - Forrester study and implementation-partner material describe integration capability/services
        - No interface list, API limits, or production reliability data in assigned evidence
        - Validate named ERP connectors, master-data synchronization, failure recovery, and monitoring
      - - AI and IVA execution
        - Supports the announced AI workflow direction
        - IVA Studio capability is reported by BriefGlance
        - Model governance, access boundaries, human oversight, and performance are unverified
        - Test permissions, citations, audit trails, fallback behavior, and prohibited actions
      - - Security and service operations
        - Supports procurement records and vendor risk review
        - UpGuard public report page describes its monitoring method but withholds Ivalua-specific findings
        - No verified certification, uptime/SLA, incident, or independent control evidence in the pool
        - Obtain current assurance artifacts, SLAs, incident history, and customer security references
    notes: >-
      This is an evidence map, not a verified implementation diagram. Architecture,
      integrations, AI controls, and security operations remain unverified where
      sources provide only product positioning or commissioned/partner descriptions.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE014
      - CE015
