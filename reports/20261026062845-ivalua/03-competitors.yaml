company:
  name: Ivalua
chapter:
  number: 3
  title: Competitors
  summary: "Ivalua competes most directly with broad source-to-pay suites, while card-led spend tools and procurement-orchestration products address narrower or adjacent jobs. Available comparisons point to a trade-off between suite breadth and configuration effort, but competitor scale, realized pricing, and comparable implementation outcomes remain poorly evidenced."
sections:
  - id: competitive-landscape
    title: The competitive set spans suites, adjacent tools, and orchestration
    body: "Gartner Peer Insights places Ivalua in Strategic Sourcing Application Suites and names Coupa, Zycus, JAGGAER, GEP, IBM, Synertrade, SAP, and Corcentric in its all-time alternatives list (CP001). Its separate overview says reviewers also considered Coupa, Zycus, and JAGGAER before buying Ivalua (CP003). These are buyer-consideration signals, not market shares or proof that every product is interchangeable. JAGGAER's own comparison presents Ramp as a card-led finance and spend-management platform with procurement layered in, making it adjacent rather than a full source-to-pay peer on the evidence reviewed (CP013). ProcurementMag describes Zip and ORO Labs as orchestration challengers, but its promotional tone and unsupported claims make that an early signal rather than a measured share shift (CP016). Manual processes, spreadsheets, and fragmented legacy tools remain a documented status-quo alternative in the four-interview Forrester study, not a vendor competitor (CP006)."
    claimRefs: [CP001, CP003, CP013, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: product-fit
    title: Breadth and configuration capacity are the key trade-off
    body: "Forrester describes Ivalua as covering sourcing, contracts, suppliers, and procurement operations, while JAGGAER's comparison describes a unified source-to-pay suite and attributes low-code configuration and a unified data model to Ivalua (CP012). The latter is a competitor's characterization, not an independent feature benchmark. JAGGAER also says Ivalua's model requires an internal configuration owner and upfront design work, whereas its own modular model can be activated in phases; the source has an incentive to favor JAGGAER (CP012). In a separate comparison, JAGGAER characterizes Ramp as oriented around cards, expenses, and accounts payable, and says it lacks direct-materials sourcing; treat those statements as competitor-authored positioning, not verified product tests (CP013). The matrix therefore marks unsupported vendor-by-vendor cells as unknown. In particular, this source pool does not substantiate comparable security, integration, channel reach, or switching-cost advantages across the named suites."
    claimRefs: [CP006, CP012, CP013]
    tableRefs: [TP002]
  - id: buyer-economics
    title: Published pricing and modeled returns are not comparable quotes
    body: "The only captured directory price for Ivalua is Software Advice's displayed starting price of $150,000 per year, alongside a 3.8 rating from six reviews (CP004, CP005). Software Advice discloses that providers pay for sponsored profiles, so neither the price nor rating should be mistaken for an audited quote or broad customer benchmark. Forrester's commissioned Total Economic Impact study uses four decision-maker interviews and a modeled composite organization; its three-year benefit, cost, NPV, and ROI figures are scenario outputs, not Ivalua revenue, a customer guarantee, or a competing-vendor comparison (CP006-CP010). It estimates eight months of implementation and $845,000 in implementation costs for that composite (CP011). JAGGAER says both its own platform and Ivalua are custom-priced, while its Ramp comparison quotes a Ramp Plus starting price; these vendor-comparison statements still do not normalize modules, users, term, discounts, or implementation scope (CP014)."
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP014]
    tableRefs: [TP003]
  - id: durability-and-gaps
    title: Durability depends on implementation proof that public data does not settle
    body: "A unified platform may reduce fragmentation, but the available sources do not quantify the switching cost, customer multi-homing, renewal behavior, channel exclusivity, or module-level retention needed to establish durable lock-in. Gartner's captured profile shows 3.0 from 35 ratings and includes both favorable and critical reviewer excerpts; Gartner explicitly cautions that reviews are individual opinions, not statements of fact (CP001, CP002). The third-party RFP.wiki snapshot provides its own score and feature-score fields, but the captured text gives no scoring methodology, so those values should not be treated as a validated benchmark (CP015). Its plotted values are shown only as that publisher's display, not as validated comparative product performance. ProcurementMag's modular-ecosystem thesis raises a plausible displacement question, but its claims about vendor growth and outcomes lack substantiation in the fetched article (CP016). Before underwriting moat durability, diligence should obtain comparable customer references, full implementation plans and costs, realized discount schedules, renewal and churn cohorts, and proof of which workflows customers actually consolidate."
    claimRefs: [CP001, CP002, CP015, CP016]
