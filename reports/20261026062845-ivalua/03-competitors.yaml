callouts:
  - calloutType: risk
    title: Public pricing is not underwriting evidence
    body: "The directory starting price, commissioned TEI scenario, and competitor-published price claims use different scopes and issuers; obtain current, like-for-like quotes and implementation statements of work before comparing unit economics."
    claimRefs: [CP004, CP006, CP011, CP014]
  - calloutType: insight
    title: Suite breadth is not the only selection axis
    body: "The available evidence distinguishes enterprise source-to-pay suites from adjacent card-led spend tools and orchestration challengers, but does not quantify switching costs or prove which category is displacing installed suites."
    claimRefs: [CP001, CP013, CP016]
