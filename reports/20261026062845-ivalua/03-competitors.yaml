      - ["Ivalua — Software Advice listing", "3.8 from 6 reviews", "Listing rating / review count", "Snapshot displayed on the product profile", "Small sample; not a representative satisfaction or retention measure"]
      - ["Ivalua — Forrester commissioned TEI composite", "$845,000", "Implementation cost over an eight-month implementation", "Modeled composite organization", "Not an actual Ivalua contract or universal implementation cost"]
      - ["Ivalua — Forrester commissioned TEI composite", "$1.4 million license fees", "Three years", "Modeled full Source-to-Pay platform cost", "Composite scenario; scope, negotiated terms, and customer variation matter"]
      - ["JAGGAER / Ivalua — JAGGAER comparison", "Custom-priced; no standard price stated", "Modules, users, and scope", "Competitor's own characterization of enterprise pricing", "Not a verified quote or an independent pricing survey"]
      - ["Ramp — JAGGAER comparison", "$15 per user per month for Ramp Plus", "Per user / month", "Competitor-published comparison statement", "Plan scope and current vendor terms were not independently verified"]
    notes: "Forrester reports risk-adjusted three-year present values for its hypothetical composite; Software Advice is a third-party listing with disclosed commercial relationships; JAGGAER's comparison is competitor-issued. These figures are not normalized across vendors or contract scopes."
    claimRefs: [CP004, CP005, CP006, CP008, CP011, CP014]
