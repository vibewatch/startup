    title: "Telematics Transition Evolving From Pricing Shield to Parity Requirement"
    body: "Marshmallow's original moat rested on ingesting non-UK driving data that incumbents ignored. As digital peers and legacy underwriters introduce telematics black boxes and app-based tracking to score newcomer risk, telematics shifts from an optional differentiator into an essential defense against margin erosion."
    claimRefs:
      - "CP008"
      - "CP010"
  - calloutType: risk
    title: "Incumbent Distribution Scale and Broker Dominance in Non-Standard Lines"
    body: "While legacy insurers such as AA and Sabre struggle with automated non-UK driving licence recognition, their established presence across UK price comparison websites and broker networks allows them to capture drivers once UK residency history passes initial qualification thresholds."
