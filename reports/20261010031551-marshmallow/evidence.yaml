evidenceGaps:
  - type: missing-source
    severity: material
    topic: claims-inflation-loss-ratios
    missingEvidence: >-
      Audited statutory underwriting loss ratios, claims frequency figures, and reinsurance treaty pass-through rates
      for fiscal years 2024 through 2026.
    whyItMatters: >-
      UK motor insurance experienced severe industry-wide claims cost inflation; without disclosed loss ratios,
      underwriting sustainability cannot be verified.
    diligencePath: >-
      Review annual Solvency II Public Disclosure reports (SFCR) for Marshmallow Insurance Limited and statutory filings
      at Companies House.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: stakeholder-cap-table
    missingEvidence: >-
      Complete shareholder cap table showing exact ownership percentages, liquidation preference seniority, and voting
      rights for Series C investors.
    whyItMatters: >-
      Enables assessment of founder control, investor alignment, and waterfall payouts under downside or IPO valuation
      scenarios.
    diligencePath: >-
      Request confirmation of full confirmation statement filings and shareholder register on Companies House or via
      company investor relations.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: UK motor-insurance premium totals and a consistent estimate of the newcomer share.
    whyItMatters: Without a total premium pool and newcomer denominator, TAM and SAM cannot be separated from company scale.
    diligencePath: Obtain current ABI or regulator premium data and an ONS or equivalent newcomer-driver population bridge.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Eligible applicants, quotes, bind rate, active policies, renewal, retention, average premium, and underwriting
      capacity.
    whyItMatters: >-
      These metrics are required to estimate obtainable market and distinguish cumulative reach from current
      penetration.
    diligencePath: Request a management cohort export reconciled to policy administration and audited revenue records.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: buyer-map
    missingEvidence: Channel mix, broker or partner roles, premium-finance mechanics, and household budget ownership by product.
    whyItMatters: Buyer and payer assumptions determine acquisition cost, conversion friction, and expansion economics.
    diligencePath: Review distribution agreements, customer research, quote-flow analytics, and product-level payment records.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: operating-scale
    missingEvidence: >-
      Metric definitions, periods, and source methodology needed to reconcile the $500 million turnover run rate with
      the $155.4 million annual-returns estimate.
    whyItMatters: Conflating unlike metrics would distort company scale and any top-down penetration calculation.
    diligencePath: Obtain audited group revenue, gross written premium, turnover definitions, and the CompWorth estimate methodology.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-retention-metrics
    missingEvidence: >-
      Publicly disclosed renewal rates, policy churn, and loss ratios broken down between Marshmallow's newcomer
      telematics cohort and legacy competitor cohorts.
    whyItMatters: >-
      Without granular cohort retention and underwriting margin disclosures, it is difficult to quantify whether
      competitor telematics launches are eroding Marshmallow's customer lifetime value or switching costs.
    diligencePath: >-
      Request audited cohort retention tables, customer renewal rates by driver tenure, and gross loss ratios comparing
      migrant drivers against standard UK motor books.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: audited-financials-and-loss-ratios
    missingEvidence: >-
      Audited statutory accounts detailing consolidated gross and net written premiums, claims loss ratios, and
      reinsurance quota-share treaty terms.
    whyItMatters: >-
      Without segmented underwriting loss ratios and reinsurance cession percentages, net margin durability and capital
      risk cannot be validated for investment underwriting.
    diligencePath: >-
      Request audited statutory financial statements, solvency capital requirement (SCR) coverage ratios, and
      reinsurance treaty schedules from management.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-cash-runway
    missingEvidence: >-
      Current debt covenants, interest service obligations, collateral pledges for the Triple Point credit line, and net
      cash balance on hand.
    whyItMatters: >-
      Verifying cash runway and capital adequacy requires understanding debt servicing claims on insurance entity
      capital and parent holding company assets.
    diligencePath: >-
      Obtain credit facility documentation, covenant compliance certificates, and current monthly cash burn and runway
      forecasts.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: proprietary-pricing-algorithms
    missingEvidence: >-
      Empirical loss ratio telemetry, feature weightings, and model drift metrics for Marshmallow's proprietary risk
