      - number: '4.3'
        title: 成本结构、毛利率驱动因素与单位经济桥接
        blocks:
          - type: paragraph
            body: >-
              保险科技的单位经济性与传统软件毛利率有根本差异，因为保单持有人的理赔、承保能力分出和法定损失准备金，构成主要交付成本。Marshmallow 的成本结构由已发生净理赔（包括人身伤害、第三方责任和车辆维修成本）、向
              SCOR 等能力提供方分出的再保险合同保费、客户身份和外国驾照核验费用，以及云数据基础设施开销决定。外部私募市场研究对营收估计差异很大：QuantLogix 估算 2024 年收入为 $370
              million，同比增长 62%；Compworth 则估算年收入为 $155.4 million，对应员工数超过 700 人。              Marshmallow
              的公开公司资料称，公司在扩大数百万美元车辆贷款的资产负债表业务时已经实现盈利。但由于已披露的赔付率、净佣金率和再保险风险分担比例并不公开，外部投资者应把表面营收视为运营吞吐量，而不是净留存贡献毛利。
