      - number: '1.4'
        title: 运营规模、里程碑与人才动态
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的增长轨迹显示商业扩张很快，组织也在逐步成熟。平台员工数从 2021 年初不足 100 人，增至 2026 年在英国和匈牙利分布式办公的 700 多人。随着营收运行率达到
              $500M、在英国各比价平台累计覆盖超过一百万名受保司机，收入端明显加速。不过，2026 年末的近期人才信号显示组织可能正在转向：公开招聘职位环比减少 31%，降至 11 个，其中仅 18%
              投向产品、工程和研究，其余集中在市场拓展和运营职能。招聘收紧之际，英国汽车保险业也面临更强的宏观压力；理赔通胀这一相关表述和 Admiral、Direct Line
              等老牌承运人的激烈定价竞争，要求公司加强运营纪律、守住利润率。
