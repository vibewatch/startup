chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与产品模式
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              是一家总部位于伦敦的数字保险提供商和持牌保险承运人，成立目的是为英国的外国公民、外籍人士和服务不足的司机，改造个人保险。英国传统保险公司依赖本国信用记录和本地驾驶年限，实际上会向新移民收取高得离谱的保费。Marshmallow
              用自有算法和更广泛的驾驶历史数据评估国际背景下的风险，解决这一结构性定价低效。公司主要通过 Marshmallow Financial Services Limited 和受监管的承保实体 Marshmallow
              Insurance Limited 运营，已从最初的汽车保险扩展到面包车和家庭保险，以及车辆金融。总部地址为 1st Floor, The Featherstone Building, 66 City Road,
              London, EC1Y 1BD，并在布达佩斯设有欧洲技术运营团队。Marshmallow 将数字保单管理、自动化客户服务和算法承保结合起来，据公司称，自成立以来已服务超过一百万名客户。
            claimRefs:
              - CO004
              - CO006
              - CO008
              - CO014
