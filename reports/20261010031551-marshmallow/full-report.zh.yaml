            body: >-
              Marshmallow
              采用面向新移民的消费者直销数字获客模式，服务刚到英国、需要处理复杂行政手续的人群。获客来自定向数字营销、国际社区合作、外籍人士网络中的口碑推荐和搜索引擎发现。与主要依靠价格比较网站（PCW）聚合平台竞价的英国传统汽车保险公司不同，Marshmallow
              借助自有数据接入管线，为那些在标准征信算法下风险画像被人为抬高的消费者报价。公司同时提供年度预付和按月分期保费融资，从流动性受限的司机身上获取利差和融资费。但公开申报没有清晰披露实际定价和续保折扣结构。初始保费相较未经校准的传统公司报价可以节省不少，             
              但如果没有自有分组数据，未来留存和相对于获客成本（CAC）的客户终身价值（LTV）无法审计。
            claimRefs:
