      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              公开规模指标支持需求存在，却不能证明市场规模。Marshmallow 称自成立以来已为超过一百万名司机提供保险，并达到 $500 million
              的营收运行率。前者是累计服务人口，后者是公司运营指标；两者都不是市场分母、有效保单数、保费池、TAM、SAM 或 SOM。另一个目录称年收入约为 $155.4
              million，但抓取文本没有披露期间或方法，因此既不能与营收运行率勾稽，也不能作为佐证。本次检索池里有四份看似相关的市场报告，但它们都把 marshmallows
              定义为糖果。因此，其中的美元预测应排除，不能改称保险市场证据。要形成可用于决策的规模判断，仍需英国汽车保费总额、新移民贡献的份额、资格和报价量、有效保单、留存率以及可实现的渗透率。
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
