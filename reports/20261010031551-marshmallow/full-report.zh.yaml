            title: 从保费和 cohort 开始搭建规模
            body: 应要求从英国汽车保费一路向下拆到新移民保费、符合资格的报价、有效保单、留存率和承保能力；每一层都要与已披露的累计司机数和营收运行率勾稽。
            calloutType: recommendation
