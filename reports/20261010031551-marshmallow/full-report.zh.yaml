              Marshmallow 以风险投资股权和结构化授信共同支撑受监管保险及借贷实体。公司于 2025 年 4 月完成由 Portage Capital Solutions 领投的 $90 million C
              轮股权融资，企业估值略高于 $2.0 billion。C 轮之前，公司于 2023 年 5 月获得由 Triple Point 主导的 $18.6 million
              债务或信用额度，用于支持持续的资产负债表需求。QuantLogix 等尽调估值追踪机构对当前 $2.0 billion
              估值的置信度较低，指出私营公司股权并不持续交易，估值仍锚定历史融资公告，缺少活跃二级流动性或公开 S-1 注册。此外，自动化金融检索经常因词义同名而出现无关的糖果和游戏记录。最终承保判断是：Marshmallow
              已证明产品市场匹配度、规模和运营势头都很强，但法定资本准备金、债务契约和经审计净承保盈利缺乏公开披露，仍是主要尽调阻碍。
