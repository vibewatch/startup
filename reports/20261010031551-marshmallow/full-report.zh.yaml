  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、核心产品与客户流程
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              提供数字优先的个人保险和消费金融平台，专门解决国际新移民和迁入英国的迁居者遇到的结构性摩擦。在标准英国汽车保险流程中，没有多年英国信用历史、本国驾驶年限或本国无赔款折扣（NCD）记录的申请人，会被传统承保算法系统性地归类为无法评分或高风险，结果是保费高得无法接受，甚至直接被拒绝报价。Marshmallow
              的核心申请流程通过移动端优化的数字开户门户，接受国际驾驶记录、外国驾驶执照和跨境文件证明，绕开这一限制。客户可以完全通过自助式网页和移动界面管理保单文件、车辆信息、期中调整和理赔相关表述的发起。除旗舰私人汽车保险外，Marshmallow
              还扩展到轻型商用车（面包车）保险、家庭财物和建筑保险，以及销售点直接汽车融资，把公司定位为服务流动人口的综合金融服务平台。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
