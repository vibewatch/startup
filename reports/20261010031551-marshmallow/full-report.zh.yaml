  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 保险科技同业与细分市场
        blocks:
          - type: paragraph
            body: >-
              英国数字汽车保险市场由一批面向特定客群的保险科技公司组成，它们并非争夺完全相同的司机。Zego 凭借灵活的按驾驶付费保单，切入商业车队和零工配送；Cuvva 则主导短期和按小时汽车共享。Urban Jungle
              通过简化风险问卷和透明的数字客户流程，瞄准年轻城市租户和司机。RatingFacts 的聚合排名也反映了这种碎片化，把 Epicvin 这类车辆历史和检验服务与其他数字品牌并列。Marshmallow
              专门服务持外国驾照、缺少英国信用档案的移民，因此很少直接与零工或按小时保单竞争。它真正的竞争边界，是在新移民建立本国信用记录之前，把信用不可见的客户转化为黏性更高的年度个人汽车保险客户。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 传统保险公司与专业承保人
        blocks:
          - type: paragraph
            body: >-
              包括 Automobile Association（AA）和 Admiral
              在内的英国传统汽车保险公司，依靠价格比较网站取得分销规模，但高度依赖传统征信分数和本国无赔款折扣（NCD）记录。因此，传统公司会自动把刚到英国的居民归入高风险精算层级，并报出惩罚性保费。Sabre
              Insurance Group 等专业承保人通过经纪网络服务非标准和高风险英国车主，但没有专门的外国数据接入管线。Marshmallow 让数据工程师搭建自动接入系统，验证非英国驾驶记录，并通过
              TransUnion 和 Percayso 接入替代数据，从而跨过这一门槛。市场数据搜索还经常出现 Kraft Heinz、Mondelez 等糖果行业集团，以及 Hudson Valley
              Marshmallow Co. 之类的零售供应商，说明这是品牌名称歧义，而非金融服务竞争。
            claimRefs:
              - CP006
              - CP007
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP008
              - CP010
              - CP012
      - number: '3.3'
        title: 远程信息处理转型与定价持久性
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              最初凭借有效承保外国驾驶历史，成为英国首批数字保险公司之一，并建立了可防守的利润优势。但竞争者能力已经提升，其他承保人越来越多地利用手机和硬件远程信息设备，根据真实道路行为而不是信用历史给非标准司机定价。为保持竞争力、避免只靠折扣定价，Marshmallow
              于 2025 年 12 月推出专门的远程信息处理产品。内部客户研究显示，新移民司机主要是年收入约 £37,000 的医疗专业人士；他们对黑盒监控和环保评分持怀疑态度，需要至少 20%
              的保费折扣才愿意采用追踪设备。到 2026 年 4 月，远程信息处理迅速扩大，已覆盖 Marshmallow 超过 40% 的客户保单，形成了补充最初人口定位的行为数据护城河。
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
      - number: '3.4'
        title: 护城河持久性与切换壁垒
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              的长期竞争护城河取决于能否把短期的新移民保险转化为持久的客户终身价值。移民司机在三到五年内积累本国驾驶历史和信用记录后，传统保险公司会成为低成本选择，天然带来客户流失压力。Marshmallow 用 $90
              million C
              轮资金投入直接汽车金融和家庭保险等相邻金融业务，来对冲被替代的风险。公司试图转型为更综合的金融服务平台，通过多产品锁定提高切换摩擦。远程信息处理的采用可以让公司在短期内抵御数字同业的激进定价，但要持续差异化，仍需在司机进入传统优质保险市场前拓宽客户关系。
