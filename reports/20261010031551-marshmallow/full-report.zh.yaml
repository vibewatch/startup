              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: 创始人、领导架构与治理
        blocks:
          - type: paragraph
            body: >-
              公司由双胞胎兄弟 Oliver Kent-Braham 和 Alexander Kent-Braham 于 2017 年与技术联合创始人 David Goate 共同创立。两兄弟现任联合
              CEO；他们观察到伦敦移民专业人士被收取明显更高的保费后，构想了这项业务。管理层分工覆盖战略增长、机构投资者关系、资本配置和新业务线的产品开发。Goate
              最初负责技术基础设施和微服务系统，之后工程和架构团队扩充，以支持英国各大比价平台的高吞吐报价。保险承保和治理由首席保险官 David Coughlan 负责；他同时担任受监管承保实体 Marshmallow
              Insurance Limited 的 CEO，确保公司符合英国金融行为监管局和审慎监管局的标准。Marshmallow 董事会将创始人领导力与资深机构投资者代表结合起来，其中包括非执行董事 Guy
              Phillips，负责监督资本部署和公司治理。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 资本化轨迹、债务工具与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              自 2018 年首次获得机构融资以来，Marshmallow 已通过多轮融资积累了可观的股权和债务支持。早期资本化包括 2018 年 $1.2M 的种子轮，以及 2020 年 11 月由 Outrun
              Ventures、Passion Capital 和 Investec 支持的 $30M A 轮。2021 年 9 月，Marshmallow 通过 $85M 的 B 轮融资达到独角兽地位，投后估值为
              $1.25B，成为英国最早由黑人创始人创立的科技独角兽之一。为分散融资来源、提高资本效率，Marshmallow 于 2023 年 5 月从 Triple Point 获得 $18.5M 的传统债务授信。2025
              年 4 月，公司完成由成长型投资者 Portage Capital Solutions 领投的关键一轮 $90M C 轮融资，BlackRock 和 Columbia Lake Partners
              参与。Companies House 的配股申报显示，公司定价发行的股份对应 $2.1B 或更高估值，使 Marshmallow 稳居欧洲头部保险科技平台之列。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO011
