        title: 技术差异化、从业者生态信号与运营风险
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的主要技术护城河不在自有消费硬件或孤立专利资产，而在自有多信号风险模型、数据访问层，以及基于超过一百万名受保司机整理出的跨境驾驶数据集。尽调发现，对 marshmallow
              软件命名空间的自动化技术检索经常与广泛采用的开源 Python marshmallow 序列化库相交。这个开源库可以提供生产级模式设计、声明式对象序列化，以及 Python
              微服务验证边界性能方面的开发者信号基准，但它是独立的开源工具，与 Marshmallow 的企业保险科技实体不同。Marshmallow
              的核心技术和运营风险包括特征管线漂移、依赖第三方云基础设施（AWS）和信用增强合作方（Percayso Inform、TransUnion）、受 FCA
              运营韧性框架审查，以及随着承保模型扩展到国际地区、持续维持低推理延迟的技术挑战。
            claimRefs:
              - CE001
              - CE006
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 向自动化特征管理演进的架构
            body: 从手工管理的特征表迁移到带抽象数据访问层的 Amazon SageMaker Feature Store 后，Marshmallow 可以在不重新部署托管端点的情况下更新模型特征，并消除风险模型之间的重复计算。
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: 运营基础设施与上游数据依赖
            body: Marshmallow 的实时报价 SLA 直接依赖云端特征库和外部核验 API 的低延迟响应，因此承保流程暴露于第三方可用性和延迟风险。
            calloutType: risk
            claimRefs:
              - CE008
