  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              的可防守市场边界始于英国汽车保险，目标是已经迁居他国、尤其是非英国驾驶历史无法被现有定价流程妥善处理的司机。公司自述，其成立是为了让迁居者获得更公平的金融服务；第三方简介则将当前产品描述为面向英国新移民和迁入者的汽车保险。家庭保险和汽车金融属于相邻产品，不应计入核心汽车保险收入池；公司提出增加产品、进入新国家的目标，是扩张论点，并不证明这些市场已经实现规模化服务。相关现状包括基于本国记录的主流承保、手工证明海外经历，以及客户接受更高报价，但本次分配的市场池没有量化这些替代路径或其支出。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
