        title: 展示项
        blocks:
          - type: callout
            title: 名称冲突使看似相关的市场数据集失效
            body: 四个指定来源估算的是糖果 marshmallows，而不是 Marshmallow 的保险市场。尽管搜索结果中的公司名称相同，这些预测也不能用作 TAM 证据。
            calloutType: risk
            claimRefs:
