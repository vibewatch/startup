      - - 基准情景
        - 50%
        - $550M
        - 3.5x
        - $1.93B
        - 英国汽车保险增长稳定在 15-20%，理赔通胀相关表述保持温和，综合成本率为 96-99%，估值维持在接近 C 轮的水平
      - - 悲观情景
        - 25%
        - $450M
        - 2.2x
        - $0.99B
        - 理赔成本相关表述上升、英国老牌公司激烈价格竞争、偿债拖累、下行轮倍数压缩
    notes: 营业额运行率反映公司披露的年化保费基线。隐含估值是根据公开保险科技公司和专业汽车保险承保人的收入倍数校准后推导出的企业价值。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
