            body: Marshmallow 最初的护城河在于接入传统公司忽略的非英国驾驶数据。随着数字同业和传统承保人引入黑盒设备和基于应用的追踪，对新移民风险进行评分，远程信息处理正从可选差异化能力变成防止利润被侵蚀的必要防线。
