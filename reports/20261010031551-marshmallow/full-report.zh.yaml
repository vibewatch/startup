  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、变现机制与营收扩张
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              的商业变现以英国个人保险承保为核心，起步于面向国际外籍人士和外国出生司机的私人汽车保险。公司接受国际驾驶经验和非英国驾照记录；传统综合保险公司通常拒保或大幅加价，这正是公司的核心收入机制。业务后来从汽车承保扩展到家庭建筑和财物保险、轻型商用车（面包车）保单，以及直接汽车金融。上述产品带来的收入包括法定总签单保费、保单发起和文件管理费、分期贷款安排费，以及汽车故障保障和法律费用保障等可选附加产品。官方披露显示，累计受保司机已超过一百万名保单持有人，管理层报告的营收运行率达到
              $500 million。不过，外部利益相关者必须区分总保单营收和净赚取保险收入：前者反映向消费者收取的全部保费，后者则是在扣除再保险能力成本和承保合作方分出额后由公司留存的收入。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
