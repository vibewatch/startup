        title: 展示项
        blocks:
          - type: callout
            title: 外籍人士承保中的自有数据护城河
            body: Marshmallow 的定价引擎将传统英国保险公司会打折看待的海外驾驶记录纳入评估，因此能够覆盖超过 1,000,000 名司机，并达到 $500M 的营收运行率。
