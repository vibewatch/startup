      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              已有证据显示，用户是寻求英国汽车保险的新移民或迁入者。在直接面向消费者的保险模式下，此人很可能同时是买方、被保险人和保费付款人，但本次分配的来源没有披露分销结构、雇主赞助、经纪人参与、保费融资机制，或由哪个家庭成员掌握预算。最近迁居、缺少长期英国驾驶记录，而传统定价又造成明显公平性惩罚时，采用动因最强。扩展产品可以靠家庭保险和汽车金融提高客户终身价值，国际扩张则可复制面向迁居者的产品逻辑。但在把相关收入池纳入
              SAM 或 SOM 之前，两条路径都需要分别验证当地承保规则、获客渠道、保单经济性和客户资格。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
