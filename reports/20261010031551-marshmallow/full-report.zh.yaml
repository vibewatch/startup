              - CE004
      - number: '5.2'
        title: 客户流程、运营用例与价值实现
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              全套产品的客户互动靠三件事撑住：低摩擦数字自助服务、实时数据接入，以及报价和保单服务的快速周转。在主要的汽车保险开户场景中，刚到英国的司机提交个人信息、车辆登记数据和外国驾驶年限；Marshmallow
              的接入引擎解析这些属性，在几分钟内返回可承保报价，而不需要电话经纪介入。保单持续维护期间，客户可以通过自助门户更换车辆、添加第二驾驶人和下载保险证明。发生事故和理赔相关表述时，Marshmallow
              提供结构化数字报案入口，先收集损失通知、损坏细节、对方信息和照片证据，再把文件转入第三方理赔判定和维修网络。数字开户大幅减少了行政负担、缩短了报价时间，但在核验非标准国际文件和跨司法辖区驾照转换时，客户仍无法完全脱离人工例外处理。
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE005
      - number: '5.3'
        title: 技术架构、数据基础设施与特征库现代化
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的技术基础设施建立在 AWS 云原生运营模式之上，支持高吞吐风险计算、动态定价和自动化欺诈检测。为提升数据管理和模型服务能力，Marshmallow 与 AWS 实施合作伙伴
              Automat-It 展开工程合作，评估通过 Amazon SageMaker Feature Store
              现代化机器学习特征架构。在旧架构下，手工管理特征库带来版本复杂性、多个独立模型的重复计算，以及特征更新就必须全面重新部署模型的运营耦合。现代化架构利用 Amazon SageMaker Feature Store
              保存未经转换的原始数据记录，再由抽象出的数据访问层（DAL）在读取时动态应用转换。实时在线特征查询由内存型 ElastiCache for Redis 层提供，以支持极低延迟的模型推理；批量历史数据则保存到
              Amazon S3，并用 AWS Glue 编目，供 Athena 和 Presto 查询分析。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
