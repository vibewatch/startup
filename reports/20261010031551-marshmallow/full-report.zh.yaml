              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与尽调含义
        blocks:
          - type: paragraph
            body: >-
              主要增长机制是公司所称的：用更丰富的客户数据和自有技术，更公平地为新移民定价，再将这套方法复制到更多产品和地区。增加产品可以加深钱包份额，进入新国家可以扩大可服务人口，             
              但现有证据没有量化这两种效果。信任、数据处理、承保准确性、监管、理赔体验、切换摩擦，以及证明相较现有保险公司确有节省的需要，都会限制采用。Marshmallow
              的隐私中心确认，收集、使用和分享个人信息是客户关系的重要组成部分，但这不能证明客户信任或监管优势。因此，估值工作应把一百万名司机和营收运行率视为增长信号，而不是市场规模的替代品；在赋予扩张价值前，还应要求自下而上的分组和保费桥接分析。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM012
              - CM013
              - CM016
