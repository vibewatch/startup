  - id: FE001
    title: 产品与数据架构栈
    type: stack
    summary: 展示 Marshmallow 客户交互层、API 服务、Amazon SageMaker 特征存储和底层 AWS 分析持久化的一体化架构栈。
    data:
      layers:
        - label: 客户体验与接入层
          detail: 提供数字报价采集、文档上传和保单全生命周期管理的自助网页门户及移动端响应式应用。
        - label: API 网关与外部数据丰富
          detail: 接入端点连接 DVLA 车辆查询、身份核验、信用情报和第三方保险数据提供商。
        - label: 数据访问层（DAL）
          detail: 抽象转换服务在检索时动态执行数据清洗、编码和模式转换，不修改存储记录。
        - label: 实时在线特征存储
          detail: 由内存型 ElastiCache for Redis 支撑的 Amazon SageMaker Feature Store，为实时承保提供超低延迟特征向量。
        - label: 预测性机器学习引擎
          detail: 专有梯度提升和神经网络定价算法、风险分类模型以及自动化理赔相关表述欺诈检测流水线。
        - label: 分析离线持久化层
          detail: 可扩展的 Amazon S3 数据湖按接入时间戳分区，通过 AWS Glue 编目，并用 Athena 和 Presto 查询以训练模型。
    approximationNotes: 架构层映射源自 AWS 实施合作伙伴 Automat-It 的文档；专有模型超参数和内部微服务名称仍属机密。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示客户从初抵英国、购买保单到建立信用、续保，并交叉销售汽车金融和家庭保险的旅程。
    approximationNotes: 旅程阶段和触点转变综合公开产品、合作伙伴数据协议及已披露的服务流程；各阶段转化率为专有信息。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
    data:
      items:
        - label: 1. 搬迁与发现
          touchpoints:
            - 抵达英国时没有本土驾驶记录
            - 数字搜索与外籍人士社区推荐
            - 价格比较引擎与直接移动端注册
        - label: 2. 承保与驾照评估
          touchpoints:
            - 提交国际驾驶证件资料
            - 算法定价绕开英国本土罚金附加费
            - 通过 Percayso Inform 集成丰富车辆数据
        - label: 3. 保单签发与注册
          touchpoints:
            - 数字化汽车保单交付与即时保险证明
            - 灵活支付选项与月度直接扣款设置
            - 设置客户门户以管理账户和保单
        - label: 4. 理赔与运营支持
          touchpoints:
            - 24/7 数字理赔通知与文档提交
            - 通过 SageMaker 特征存储自动筛查欺诈
            - 通过应用内聊天和数字工作流提供客户支持
        - label: 5. 保单续期与留存
          touchpoints:
            - 纳入累计英国驾驶历史的年度续保报价
            - 无理赔折扣核验与忠诚度定价审查
            - 在合同到期前开展客户留存触达
        - label: 6. 多产品交叉销售
          touchpoints:
            - 通过 TransUnion 信用数据提供预批准汽车金融选项
            - 为住宅物业保障提供家庭保险附加项
            - 面向多业务线账户的整合财务仪表盘
