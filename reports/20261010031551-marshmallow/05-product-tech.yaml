      - CE002
      - CE004
  - id: TE002
    title: Workflow and Use Case Matrix
    columns:
      - User Job / Stage
      - Current / Legacy Workflow
      - Marshmallow Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Initial Insurance Quoting
        - Manual phone brokerage or decline on aggregator sites due to foreign license
        - Real-time digital onboarding accepting overseas licensing credentials
        - Quoting completed in under 5 minutes; lower pricing for newcomers
        - Manual review triggered for unsupported foreign licensing jurisdictions
      - - No Claims Discount (NCD) Verification
        - Paper letter requests and postal verification from overseas insurers
        - Digital document upload and automated proof parsing
        - Elimination of multi-week administrative delays
        - Language barriers and fraudulent foreign document verification risks
      - - Policy Mid-Term Adjustments
        - Call center queuing with administrative processing fees
        - Self-service portal for address, vehicle, and driver amendments
        - Instant policy endorsement generation with zero call overhead
        - Complex multi-vehicle or high-risk modifications still require agent review
      - - First Notice of Loss (FNOL) Claims
        - Paper forms and fragmented phone interviews with legacy claims handlers
        - Digital claims intake interface with direct photo and data submission
        - Rapid triage into repair and third-party administration networks
        - Adjudication and physical vehicle inspection depend on external partner networks
    notes: >-
      Workflow stages derived from Tracxn functional summaries and Marshmallow operational disclosures; manual
      exceptions persist for edge-case licensing verifications.
    claimRefs:
      - CE003
      - CE004
      - CE005
  - id: TE003
    title: Technology and Operating Architecture Table
    columns:
      - Architecture Layer
      - Core Component / Service
      - Operational Role
      - Critical Dependencies
      - Key Failure Mode / Technical Risk
    rows:
      - - Client Experience Layer
        - React / Mobile Web App & Customer Portal
        - Digital onboarding, policy management, and claims notification
        - Public internet availability, CDN, and browser compatibility
        - UI/UX degradation or session drops during document upload
      - - API & Integration Gateway
        - RESTful API Services & Partner Connectors
        - External data lookup (DVLA, TransUnion, Percayso Inform)
        - Third-party data provider APIs and network stability
        - Upstream partner latency spikes delaying real-time quotation
      - - Real-Time ML Feature Store
        - Amazon SageMaker Feature Store & ElastiCache Redis
        - Low-latency feature serving for dynamic pricing and fraud detection
        - AWS SageMaker service health and ElastiCache in-memory capacity
        - Cache miss latency penalties and feature group versioning conflicts
      - - Analytical & Training Store
        - Amazon S3 Offline Store, AWS Glue, Athena / Presto
        - Long-term batch feature storage, data lineage, and model retraining
        - AWS S3 bucket integrity and IAM policy governance
        - Data pipeline processing delays and schema evolution drift
    notes: >-
      Architectural components verified through AWS partner case study documentation by Automat-It and corporate
      technical profiles.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE010
figures:
  - id: FE001
    title: Product and Data Architecture Stack
    type: stack
    summary: >-
      End-to-end architectural stack illustrating Marshmallow's customer interaction layer, API services, Amazon
      SageMaker feature store, and underlying AWS analytical persistence.
    data:
      layers:
        - label: Customer Experience & Intake Layer
          detail: >-
            Self-service web portal and mobile responsive application providing digital quote capture, document upload,
            and policy lifecycle administration.
        - label: API Gateway & External Data Enrichment
          detail: >-
            Ingestion endpoints connecting DVLA vehicle lookups, identity verification, credit intelligence, and
            third-party insurance data providers.
        - label: Data Access Layer (DAL)
          detail: >-
            Abstracted transformation service applying dynamic data cleansing, encoding, and schema transformations on
            retrieval without modifying stored records.
        - label: Real-Time Online Feature Store
          detail: >-
            Amazon SageMaker Feature Store backed by in-memory ElastiCache for Redis delivering ultra-low-latency
            feature vectors for live underwriting.
        - label: Predictive Machine Learning Engines
          detail: >-
            Proprietary gradient-boosted and neural pricing algorithms, risk classification models, and automated claims
            fraud detection pipelines.
        - label: Analytical Offline Persistence Layer
          detail: >-
            Scalable Amazon S3 data lake partitioned by ingestion timestamp, cataloged via AWS Glue, and queried via
            Athena and Presto for model training.
    approximationNotes: >-
      Architectural layer mapping derived from AWS implementation partner documentation by Automat-It; proprietary model
      hyper-parameters and internal microservice names remain confidential.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
callouts:
  - calloutType: insight
    title: Architectural Evolution Toward Automated Feature Management
    body: >-
      Transitioning from manually managed feature tables to Amazon SageMaker Feature Store with an abstracted Data
      Access Layer allows Marshmallow to update model features without redeploying hosted endpoints, eliminating
      redundant computation across risk models.
    claimRefs:
      - CE006
      - CE007
      - CE008
  - calloutType: risk
    title: Operational Infrastructure and Upstream Data Dependencies
    body: >-
      Marshmallow's real-time quoting SLA depends directly on low-latency response times from cloud-hosted feature
      stores and external verification APIs, exposing underwriting workflows to third-party availability and latency
      risks.
    claimRefs:
      - CE008
      - CE010
      - CE014
