        - Standalone vs bundled policy retention rates unavailable
      - - Direct Car Finance
        - Arriving drivers purchasing vehicles in the UK
        - Scaling partner integration
        - Point-of-sale financing paired with vehicle insurance underwriting
        - Credit default exposure, underwriting covenants, and balance-sheet risk
