companyProfile:
  summary: >-
    Marshmallow is a London-based digital insurer and consumer-finance platform built for UK newcomers, expatriates, and
    foreign-licence holders. It began with motor insurance for drivers underserved by legacy underwriting models, then
    expanded into van cover, home insurance, and direct car finance while maintaining a direct-to-consumer digital
    distribution model.
