  topStrengths:
    - Distinct niche in newcomer and migrant motor insurance with clear customer pain-point fit.
    - Real commercial scale, with 1,000,000+ insured drivers and a reported $500M turnover run rate.
    - Expansion into adjacent products and geographies could raise lifetime value if underwriting holds.
  topRisks:
    - Public disclosure is too thin to underwrite statutory loss ratios, cash burn, retention, or covenant headroom.
    - Claims inflation, reinsurance dependence, and motor-finance credit exposure can compress margins quickly.
    - Competitive pressure from incumbents and specialist rivals may erode pricing advantage over time.
    - Consumer-duty, underwriting-bias, and motor-finance scrutiny add regulatory execution risk.
  unresolvedGaps:
    - Consolidated cash burn, runway, and debt-covenant terms remain opaque.
    - Active policy counts, retention, and cohort-level economics are still not publicly disclosed.
    - Underwriting loss ratios and claims benchmarking by cohort are not available in public filings.
    - Product economics for home insurance, van cover, and direct car finance remain partially visible.
