  - id: TM002
    title: Sizing lenses and evidence limits
    columns: [Lens, Publisher, Metric and period, Value, Geography, Method, Confidence and limitation]
    rows:
      - [Cumulative served scale, Marshmallow, "Drivers insured since 2017", "Over 1 million", UK, "Company statement", "Medium; cumulative, not active policies or a market denominator"]
      - [Company operating scale, Marshmallow, "Turnover run rate; announcement date not stated in fetched text", "$500 million", "Company-wide", "Company statement", "Medium; turnover run rate is not TAM, ARR, written premium, or revenue"]
      - [Third-party company estimate, CompWorth, "Annual returns; period not stated", "$155.4 million", "Company-wide", "Directory estimate; methodology not disclosed", "Low; metric and period are not comparable with turnover run rate"]
      - [Total addressable market, "No relevant source in assigned pool", "UK motor-insurance premium pool", "Not established", UK, "Requires regulator or industry premium data", "Gap; confectionery reports are excluded"]
      - [Serviceable addressable market, "No relevant source in assigned pool", "Newcomer share of motor premiums", "Not established", UK, "Requires newcomer-driver count, premium, and eligibility data", "Gap; no denominator or average premium"]
      - [Serviceable obtainable market, "No relevant source in assigned pool", "Eligible quotes, bound policies, retention, and capacity", "Not established", UK, "Requires company funnel and underwriting-capacity evidence", "Gap; cumulative insured drivers cannot establish current penetration"]
      - [False-positive sizing results, "Business Research Insights; Verified Market Reports; PW Consulting; Fact.MR", "Confectionery marshmallow forecasts across differing periods", "Excluded", Global, "Reports define an aerated sugar confection rather than Marshmallow the insurer", "Not applicable to the company market"]
    notes: >-
      Values retain the publishers' metric names and stated periods. No conversion from turnover run rate or
      cumulative drivers to insurance TAM/SAM/SOM is attempted.
    claimRefs: [CM002, CM003, CM009, CM010, CM011, CM012, CM013]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow and budget owner, Adoption trigger]
    rows:
      - [UK newcomer motor, "Newcomer or migrant driver", "Insured driver and household", "Likely policyholder; not directly disclosed", "Direct purchase is plausible; distribution mix and budget owner are unverified", "Move to the UK and limited UK driving-history recognition"]
      - [Home insurance adjacency, "Newcomer household seeking property cover", "Household members", "Policyholder; not directly disclosed", "Product availability is reported, but acquisition and budget workflow are absent", "Need to insure a home or contents after relocation"]
      - [Car finance adjacency, "Newcomer seeking vehicle finance", "Vehicle borrower or driver", "Borrower; funding structure not disclosed", "Credit decision, finance approval, and payment workflow are not described", "Difficulty accessing vehicle finance after relocation"]
      - [International expansion, "Newcomer in a future target country", "Local insured or financial-services user", "Local customer; not yet evidenced", "Requires country-specific regulation, underwriting, distribution, and pricing", "Relocation friction resembling the UK problem"]
    notes: >-
      Buyer and payer roles are analytical inferences from the product descriptions; channel mix, budget ownership,
      eligibility, and product-level conversion remain diligence gaps.
    claimRefs: [CM001, CM004, CM005, CM006, CM007, CM014, CM015]
figures:
  - id: FM001
    title: Evidence ladder for a newcomer motor-insurance sizing case
    type: pyramid
    summary: >-
      Only the cumulative served-population layer is quantified; every broader market and current-funnel layer
      remains unestablished in the assigned evidence.
    data:
      items:
        - label: Total UK motor-insurance premiums
          value: "Gap"
          detail: "No relevant regulator or industry premium total in the assigned pool."
        - label: Newcomer-attributable motor premiums
          value: "Gap"
          detail: "No newcomer share, premium denominator, or consistent population definition."
        - label: Product-eligible newcomer drivers
          value: "Gap"
          detail: "Eligibility and underwriting appetite are not publicly quantified here."
        - label: Quoted newcomer applicants
          value: "Gap"
          detail: "No quote volume, acquisition channel, or conversion data."
        - label: Bound and active policies
          value: "Gap"
          detail: "No current active-policy, renewal, or retention count."
        - label: Cumulative drivers insured since launch
          value: "Over 1 million"
          detail: "Company-reported cumulative scale; not a current customer count or market share."
    approximationNotes: >-
      This is an evidence-completeness hierarchy, not a proportional market-size chart. No numeric relationship is
      inferred between layers, and the company-reported cumulative count is preserved without conversion.
    claimRefs: [CM002, CM016]
callouts:
  - calloutType: risk
    title: Name collision invalidates the apparent market-data set
    body: >-
      Four assigned sources size confectionery marshmallows, not Marshmallow's insurance market. Their forecasts
      must not be used as TAM evidence despite matching the company name in search results.
    claimRefs: [CM010, CM011, CM012]
  - calloutType: recommendation
    title: Build sizing from premiums and cohorts
    body: >-
      Request a bottom-up bridge from UK motor premiums to newcomer premiums, eligible quotes, active policies,
      retention, and capacity; reconcile each layer to the reported cumulative driver count and turnover run rate.
    claimRefs: [CM002, CM003, CM013, CM016]
