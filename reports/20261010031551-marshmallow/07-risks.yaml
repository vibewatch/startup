callouts:
  - calloutType: "risk"
    title: "Thesis Break Trigger: Reinsurance Hardening and Motor Loss Ratio Inflection"
    body: "Marshmallow's high-valuation profile rests on proving that proprietary underwriting algorithms can durably generate underwriting profits where traditional legacy insurers struggle. If claims inflation or non-standard driver loss frequencies surge, reinsurance treaty partners may demand higher ceding fees or lower capacity, forcing Marshmallow to either retain unacceptable balance sheet risk or compress premium growth."
    claimRefs:
      - "CR001"
      - "CR009"
  - calloutType: "risk"
    title: "Capital Structure Risk: Debt Dependency in Car Finance Expansion"
    body: "Expanding from an insurance provider into a direct consumer lender introduces credit risk and asset-liability duration mismatches. Relying on structured credit and conventional debt facilities—such as lines from Triple Point, Portage, and BlackRock—exposes the firm to refinancing risk and debt covenants if consumer loan delinquencies spike in an uncertain macroeconomic environment."
    claimRefs:
      - "CR004"
      - "CR010"
