              - CU004
              - CU005
      - number: '6.2'
        title: Adoption Trajectory, Fleet Scale, and Market Growth
        blocks:
          - type: paragraph
            body: >-
              The company has demonstrated rapid customer adoption since its 2017 inception, scaling its platform to
              exceed one million cumulative insured drivers and achieving an annualized turnover run rate of $500
              million. This growth trajectory supported Marshmallow closing a $90 million Series C funding round led by
              Portage Capital in 2025, reaching a post-money corporate valuation surpassing $2 billion. External market
              intelligence estimates operational returns in excess of $155 million, corroborated by internal disclosures
              indicating profitable unit economics and workforce expansion past 700 employees across its London
              headquarters and European engineering facilities. However, reported driver figures represent cumulative
              policyholder volume rather than active in-force policies, making independent verification of ongoing
              policy counts challenging.
            claimRefs:
              - CU002
              - CU003
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
