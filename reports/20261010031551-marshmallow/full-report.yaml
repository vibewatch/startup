  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Ideal Customer Profile
        blocks:
          - type: paragraph
            body: >-
              Marshmallow focuses its customer acquisition strategy on historically underserved UK motorist
              demographics, specifically targeting foreign nationals, recent immigrants, and expatriates who lack
              domestic driving histories. Traditional UK motor underwriters routinely penalize foreign license holders
              with prohibitive premium surcharges or outright coverage refusals due to rigid actuarial models that
              discount non-UK driving records. By ingesting international driving records and evaluating broader risk
              indicators, Marshmallow establishes an attractive value proposition for newcomer drivers seeking
              affordable, comprehensive motor insurance. The platform has progressively broadened this initial wedge
              into adjacent offerings, expanding into UK home insurance products and direct consumer car finance to
              capture multi-line lifetime customer value across residential and mobility needs.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
