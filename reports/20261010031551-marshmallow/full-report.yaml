        title: Exhibits
        blocks:
          - type: callout
            title: Scale Inflection and Reported Operating Profitability
            body: >-
              Marshmallow's expansion to over one million insured drivers and a $500 million turnover run rate
              culminated in company-reported profitability and Series C institutional backing, validating customer
              demand for migrant-focused motor underwriting.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
