  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacencies
        blocks:
          - type: paragraph
            body: >-
              Marshmallow's defensible market boundary starts with UK motor insurance for people who have moved country,
              especially drivers whose non-UK history is not handled well by incumbent pricing processes. The company's
              own account says it was built to make financial services fairer for movers, while a third-party profile
              describes the current proposition as car insurance for UK newcomers and migrants. Home insurance and car
              finance are adjacent product categories, not part of the core motor-insurance revenue pool, and the stated
              ambition to add products and enter new countries is an expansion thesis rather than evidence that those
              markets are already served at scale. The relevant status quo includes mainstream underwriting based on
              domestic records, manual proof of overseas history, and customers accepting higher quoted prices, but the
              assigned pool does not quantify those substitute pathways or their spend.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators support demand but do not establish market size. Marshmallow reports that it has
              insured more than one million drivers since launch and reached a $500 million turnover run rate. Those
              are, respectively, a cumulative served-population measure and a company operating metric; neither is a
              market denominator, active-policy count, premium pool, TAM, SAM, or SOM. A directory separately reports
              annual returns of about $155.4 million without a disclosed period or methodology in the fetched text, so
              it cannot be reconciled to turnover run rate or treated as corroboration. The assigned search pool
              contains four apparent market reports, but each defines marshmallows as confectionery. Their dollar
              forecasts are therefore excluded rather than relabeled as insurance-market evidence. A decision-grade
              sizing case still requires UK motor premium totals, the share attributable to newcomers, eligibility and
              quote volumes, active policies, retention, and achievable penetration.
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
