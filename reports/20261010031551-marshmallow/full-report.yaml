      - number: '1.4'
        title: Operational Scale, Milestones, and Talent Dynamics
        blocks:
          - type: paragraph
            body: >-
              Marshmallow's growth trajectory highlights rapid commercial expansion alongside maturing organizational
              dynamics. The platform grew from fewer than 100 staff in early 2021 to a distributed workforce exceeding
              700 employees across the UK and Hungary by 2026. Top-line performance inflected sharply with the
              achievement of a $500M turnover run rate and cumulative volume exceeding one million insured drivers
