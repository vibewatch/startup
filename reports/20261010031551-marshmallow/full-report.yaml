              - CU003
              - CU006
              - CU013
              - CU014
      - number: '6.3'
        title: Commercial Partnerships and Infrastructure Deployments
        blocks:
          - type: paragraph
            body: >-
              To support its complex underwriting and lending operations, Marshmallow maintains strategic commercial
              partnerships and enterprise technology deployments that underpin customer acquisition and risk selection.
              The insurer signed a multi-year partnership with data orchestration specialist Percayso Inform and global
              credit bureau TransUnion, integrating TrueVision credit bureau data and vehicle intelligence directly into
              point-of-quote, policy renewal, and auto-finance workflows. This integration allows real-time credit
              suitability and affordability assessments for immigrant consumers who lack deep domestic credit
              footprints. Additionally, technical case studies with AWS partner Automat-it document Marshmallow
              implementing Amazon SageMaker Feature Store to eliminate redundant feature computation across proprietary
              pricing and fraud detection models.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
