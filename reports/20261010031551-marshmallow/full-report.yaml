      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidenced user is a newcomer or migrant seeking motor cover in the UK. In a direct consumer insurance
              model that person is plausibly the buyer, insured user, and premium payer, but the assigned sources do not
              disclose distribution mix, employer sponsorship, broker participation, premium-finance mechanics, or which
              household member controls the budget. The adoption trigger is strongest where a recent mover lacks a long
              UK driving record and conventional pricing creates a perceived fairness penalty. Product expansion can
              widen lifetime value through home insurance and car finance, while international expansion can replicate
              the mover-focused proposition. Both paths require separate evidence on local underwriting rules,
              acquisition channels, policy economics, and customer eligibility before their revenue pools can be
              included in SAM or SOM.
            claimRefs:
              - CM001
