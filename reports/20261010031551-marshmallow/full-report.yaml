              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The principal growth mechanism is the company's claim that richer customer data and proprietary technology
              can price newcomers more fairly, then reuse that approach across products and geographies. More products
              could deepen share of wallet, and new countries could enlarge the addressable population, but the evidence
              does not quantify either effect. Adoption is constrained by trust, data handling, underwriting accuracy,
              regulation, claims experience, switching friction, and the need to prove savings against existing
              insurers. Marshmallow's privacy center confirms that collection, use, and sharing of personal information
              are material parts of the customer relationship, but it does not prove customer trust or regulatory
              advantage. Valuation work should therefore treat the one-million-driver and turnover-run-rate claims as
              traction signals, not as substitutes for market sizing, and should require a bottom-up cohort and premium
              bridge before assigning expansion value.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM012
              - CM013
              - CM016
