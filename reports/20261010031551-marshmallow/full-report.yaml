chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Product Model
        blocks:
          - type: paragraph
            body: >-
              Marshmallow is a London-based digital insurance provider and licensed carrier founded to modernize
              personal line insurance for foreign nationals, expats, and underserved drivers in the United Kingdom.
              Traditional UK insurers rely on domestic credit histories and localized driving tenure, effectively
              penalizing newcomers by charging prohibitive premiums. Marshmallow addresses this structural pricing
              inefficiency by deploying proprietary algorithms and broader driving-history datasets to assess risk
              fairly across international profiles. Operating primarily through Marshmallow Financial Services Limited
              and its regulated underwriting vehicle Marshmallow Insurance Limited, the company has scaled from initial
              motor insurance policies into van and home insurance, as well as vehicle finance. The corporate
              headquarters is located at 1st Floor, The Featherstone Building, 66 City Road, London, EC1Y 1BD, supported
              by European technology operations in Budapest. By combining digital policy management, automated customer
              service, and algorithmic underwriting, Marshmallow reports having served more than one million customers
              since inception.
            claimRefs:
              - CO004
              - CO006
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: Founders, Leadership Architecture, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company was established in 2017 by twin brothers Oliver Kent-Braham and Alexander Kent-Braham
              alongside technical co-founder David Goate. The Kent-Braham twins, who serve as Co-CEOs, conceived the
              business after observing the disproportionate premiums charged to immigrant professionals in London. Their
              executive division balances strategic growth, institutional investor relations, capital allocation, and
              product development across emerging verticals. Technical foundation and microservice systems were
              originally directed by Goate, with engineering and architecture subsequently augmented to support
              high-throughput quoting across UK comparison aggregators. Underwriting and insurance governance are led by
              Chief Insurance Officer David Coughlan, who also serves as Chief Executive Officer of regulated
              underwriting entity Marshmallow Insurance Limited, ensuring compliance with UK Financial Conduct Authority
              and Prudential Regulation Authority standards. Marshmallow's board of directors incorporates founder
              leadership alongside experienced institutional investor representation, including non-executive director
              Guy Phillips, providing corporate governance and oversight across capital deployment.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: Capitalization Trajectory, Debt Facilities, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Marshmallow has accumulated substantial equity and debt backing across multiple funding rounds since its
              2018 institutional debut. Early capitalization included a $1.2M seed round in 2018 followed by a $30M
              Series A in November 2020 backed by Outrun Ventures, Passion Capital, and Investec. In September 2021,
              Marshmallow attained unicorn status with an $85M Series B round valuing the company at $1.25B post-money,
              establishing it as one of the UK's first Black-founded technology unicorns. To diversify funding and
              optimize capital efficiency, Marshmallow secured an $18.5M conventional debt credit facility from Triple
              Point in May 2023. In April 2025, the company closed a pivotal $90M Series C round led by growth investor
              Portage Capital Solutions with institutional participation from BlackRock and Columbia Lake Partners.
              Companies House allotment filings record priced share issues valuing the business at $2.1B or more,
              cementing Marshmallow's position among Europe's top-tier insurtech platforms.
