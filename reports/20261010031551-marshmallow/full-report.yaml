  - id: TV002
    title: Core Diligence Thesis and Anti-Thesis Balance
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - Catalyst / Diligence Ask
    rows:
      - - Underwriting Advantage
        - Proprietary pricing models accept international driving records, unlocking underserved migrant demographics.
        - Claims inflation and lack of shared cross-border loss histories may elevate loss ratios above legacy peers.
        - Inspect audited cohort loss ratios and gross combined ratios by driving license origin.
      - - Scale & Revenue
        - Over 1M drivers insured and a $500M turnover run rate demonstrate rapid market share acquisition.
        - Turnover/GWP is not net earned revenue; intermediary commissions and reinsurance costs erode net retention.
        - Audit statutory accounts to verify net earned premium vs gross written premium.
      - - Multi-Product Expansion
        - >-
          Cross-selling van insurance, home insurance, and car finance increases customer lifetime value and wallet
          share.
        - Motor finance involves credit and funding cost risk; home insurance faces established domestic incumbents.
        - Evaluate product-level unit economics, cross-sell conversion rates, and loan default metrics.
      - - Capital Structure
        - >-
          Founders Alexander and Oliver Kent-Braham retain 45.5% combined ordinary equity, aligning long-term
          leadership.
        - $63.5M in cumulative debt raises and preferred share tiers create liquidation preferences ahead of common.
        - Examine complete debt covenants, collateral liens, interest rates, and senior preference waterfalls.
    notes: >-
      Comparison of core structural strengths versus unverified operational vulnerabilities based on available filings
      and industry reporting.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV011
  - id: TV003
