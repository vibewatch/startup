    columns:
      - Scenario
      - Probability
      - Turnover Run Rate
      - Target EV / Multiple
      - Implied Valuation
      - Key Operating Assumptions & Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - $750M
        - 4.5x
        - $3.38B
        - Profitable European expansion, car finance cross-sell success, combined ratio < 92%, successful IPO readiness
      - - Base Case
        - 50%
        - $550M
        - 3.5x
        - $1.93B
        - >-
          UK motor growth stabilizes at 15-20%, claims inflation remains moderate, combined ratio 96-99%, valuation
          holds near Series C mark
      - - Bear Case
        - 25%
        - $450M
        - 2.2x
        - $0.99B
        - >-
          Rising claims costs, severe price competition from UK incumbents, debt servicing drag, down-round multiple
          compression
    notes: >-
      Turnover run rate reflects company-disclosed annualized premium baseline. Implied valuation is enterprise value
      derived from revenue multiples calibrated against public insurtech and specialty motor underwriters.
