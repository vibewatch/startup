              - CU011
      - number: '6.4'
        title: Customer Lifecycle, Retention, and Multi-Product Expansion
        blocks:
          - type: paragraph
            body: >-
              The customer journey at Marshmallow transitions from high-friction arrival in the UK through streamlined
              digital onboarding, algorithmic pricing, policy servicing, and multi-product expansion. Once newcomer
              motorists obtain vehicle coverage, Marshmallow utilizes continuous data enrichment to build longitudinal
              driver profiles. As policyholders accrue verified UK driving experience and domestic credit records, the
              platform seeks to defend against customer churn at annual policy renewal milestones. The company actively
              leverages this trusted customer relationship to cross-sell consumer car finance and residential home
              insurance, attempting to counter broader consumer sentiment trends where only 30% of surveyed motorists
              maintain a positive perception of personal lines insurers.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
