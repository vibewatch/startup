  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与定位
        blocks:
          - type: paragraph
            body: >-
              公开资料显示，Collaborative Robotics
              做的是用于共享空间物料搬运的移动协作机器人。公司刻意避开人形机器人的定位：产品要能在人类工作环境中干活、解决实际问题，而不是做研究展示。独立报道显示，最迟到 2024
              年，机器人已在真实货物转运设施（transload
              facility）运行，说明团队已从仿真走到现场部署。阶段仍早，但比只停留在路演材料里的机器人项目更有说服力。关键还在于，同一套系统能否不依赖定制工程团队，复制到不同设施。
