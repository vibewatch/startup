            body: >-
              首批买家很可能是物流或制造业运营商：重复搬运需求多、用工压力大，也有能力组织试点。公开研究和案例显示，协作机器人的采用取决于人机工效、安全和现场工作流调校。目标客户不只是「大型企业」，还得有能力承担系统集成和流程变更。医疗和生物科技也可能适用，但目前物流场景的证据明显更强。销售周期可能从试点开始，最后需要重做工作流。
