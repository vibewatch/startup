            tableRef: TO002
            claimRefs:
              - CO002
              - CO006
              - CO007
      - number: '1.2'
        title: 融资历程与运营规模
        blocks:
          - type: paragraph
            body: >-
              公司 2023 年完成 $30 million Series A，2024 年 4 月完成 $100 million Series B，披露融资累计超过 $140 million。General Catalyst
              领投 B 轮，众多投资者继续加码。硬件机器人若没有一定现场进展，通常很难同时获得战略和财务投资人的支持。GeekWire 报道，公司团队约 40 人，规模仍小于其目标，并新开了 Seattle
              办公室。这些迹象说明团队已在推进业务，但不足以证明公司已形成规模化制造或收入引擎。
