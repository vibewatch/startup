              最重要的财务问题仍未回答：烧钱速度、毛利率、单位经济性如何，客户合同有没有走出试点。公开资料不足以搭建真实的 P&L
              模型。融资背书不等于财务透明。早期机器人公司披露有限并不罕见，但投资判断只能依赖产品和客户采用证据，而非财报。当前仍是融资驱动的故事，不是财务表现驱动的业务；这些指标披露前，估值推断都应保持审慎。
