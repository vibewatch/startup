      - number: '3.3'
        title: 竞争维度的启示
        blocks:
          - type: paragraph
            body: >-
              市场机会真实，但赛道足够拥挤，执行稍弱就可能抹平先发优势。公司要拿出可复制的部署，而不只是一个巧妙的机器人概念；还要证明非人形定位是优势，不是妥协。品类尚无公认赢家，一旦有公司显现出更清晰的产品市场契合度，份额可能迅速转移。因此，未来
              12 到 24 个月的竞争窗口既宝贵又脆弱。
