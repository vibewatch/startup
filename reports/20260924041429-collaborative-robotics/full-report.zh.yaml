  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定
        blocks:
          - type: paragraph
            body: >-
              与其把 Collaborative Robotics 看作通用工业机器人公司，不如把它放在人机共处空间自动化这一类：机器人要贴近人员运行，同时搬运物料、协调任务。公司官网和 co.bot
              品牌强调行为可预测、能用于真实场景；外部资料则将其归为移动操作机器人（mobile
              manipulation）和协作机器人（cobot）。买方买的不只是一条机械臂，还要一套能适配现有安全规范、场地和用工安排的工作流系统。落地难点不仅在技术，也在设施改造和赢得操作人员信任。
            claimRefs:
              - CM001
              - CM004
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
      - number: '2.2'
        title: 买方画像与采用逻辑
        blocks:
          - type: paragraph
            body: >-
              早期买方很可能是物流或制造业运营商：重复搬运任务多、用工压力大，也有能力按流程跑试点。公开报道反复提及仓库、制造车间、医疗、零售和服务场景，这些地方都在意减轻体力负担、提高吞吐量。商业逻辑在于省人、改善人机工效、提升吞吐，而不是单为追求自主化而下注。若公司能突围，靠的是机器人能让具体工作流比纯人工更省钱或更可靠。长期市场逻辑还要证明，机器人可以标准化部署，不必每笔销售都变成定制集成项目。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM009
      - number: '2.3'
        title: 采用受限的深层原因
        blocks:
          - type: paragraph
            body: >-
              存量设施改造中的安全与集成仍是客户采用的最大阻力。共享空间机器人既要适应人员近距离作业，也要重排工作流、赢得操作人员信任。任务可以简化时，不少买方更愿意选固定式自动化或
              AMR。协作机器人品类虽在增长，不代表销售容易。尽调要看 Collaborative Robotics 能否把行业顺风转成可复制部署，并拿出足够的 ROI
              证据克服运营阻力。做得到，公司有望受益于以人为本的自动化趋势；做不到，可服务市场就会迅速收窄。
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM011
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争对手
        blocks:
          - type: paragraph
            body: >-
              竞争对手不止来自一个品类。公开资料显示，人形机器人初创公司、移动操作平台和传统仓储自动化厂商都在争夺同一批客户预算。Collaborative Robotics
              不仅要面对外形相似的同行，也要和成本更低、成熟度更高的替代方案竞争；后者能用更窄的方案解决同一工作流。产品定位必须说清楚：如果机器人能在人类工作环境中作业、但不做人形，公司就得解释它为何胜过人形机器人，也胜过更简单的
              AMR 工作流。赛道拥挤，定位含糊往往会变成价格问题。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
