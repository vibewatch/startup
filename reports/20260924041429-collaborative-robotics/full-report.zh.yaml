            body: >-
              关键进展不是一次产品发布，而是公司从 2022 年成立，到 2024 年首批机器人进入现场，再到不久后公开扩充 Seattle AI
              团队。这说明公司已走出纯研发阶段；但公开收入、确切客户数和当前估值仍是尽调缺口。二级市场信息对这些数字的披露不充分或已过时，因此估值推算只能作粗略参照，不能当作承销锚点。整体来看，公司仍是早期机器人平台：融资能力有支撑，运营规模有限，信息披露也不充分。
