              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP009
      - number: '3.2'
        title: 护城河与就绪度
        blocks:
          - type: paragraph
            body: >-
              更可能构成防线的不是专利墙，而是部署积累带来的学习效应：工作流接得更深、客户更信任，实际运营数据也更难被小型竞品复制。公开资料还看不到可对标的装机规模或性能榜单，因此护城河目前只是推测，尚未得到验证。若公司能胜出，可能凭的是其实用系统在真实场地更容易部署，而非像人形竞品那样吸睛。关键要看现场学习和集成深度，不是品牌声量。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
