  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险
        blocks:
          - type: paragraph
            body: >-
              早期机器人公司最常遇到的致命风险是安全、可靠性，以及从优秀演示走到可复制部署的落差。机器人在人身边运行，一旦出故障，信任代价高于有围栏隔离的系统。协作机器人领域的公开研究一再强调：安全不是附加功能，而是产品本身。公司公开的运行数据不足以排除停机或边缘场景故障，所以下行风险并非假设。一次严重事故就可能重置客户信心，投资人也会迅速把风险计入价格。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR011
      - number: '7.2'
        title: 商业化与执行风险
        blocks:
          - type: paragraph
            body: >-
              第二层是商业化风险：公司能否把少数部署转成可复制的客户基础？硬件公司常因部署定制化、利润薄而停滞；每新增一个站点，工程投入也可能超过销售团队预期。团队小会放大执行压力，客户现场的每个问题都可能占用创始人时间。资本密集度又加重风险：若公司需要更多硬件、更多集成工作，或销售周期比计划更长，股权稀释或下调估值融资的可能性就会上升。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR010
      - number: '7.3'
        title: 风险可承受的前提条件
        blocks:
          - type: paragraph
            body: >-
              缓解风险的思路不复杂：收窄应用场景、严谨论证安全、积累现场数据，并在产品反复证明可靠前放慢扩张。这不是低风险方案，但有机会让公司活下来。若能聚焦窄场景、快速学习，当前风险组合尚可管理；若产品还没反复验证就急着扩张，同样的风险足以拖垮公司。若客户在签约前要求接近认证级别的证据，压力会更大。公司越快拿出可信的现场数据，越容易降低销售阻力。因此，未来
              6 到 12 个月至关重要。
            claimRefs:
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 如何看待当前估值水平
        blocks:
          - type: paragraph
            body: >-
              目前最有支撑的公开估值参照，仍是与 2024 年 Series B 相关、约 $500 million 的估值信号。这不等于最新基本面估值：公开信号能说明 VC
              有信心，却不足以支撑成熟软件公司的估值倍数。当前估值更多反映潜力和融资能力，并非已经验证的经营规模。应把它当作参照，而不是结论；这是市场信号，不是今天经核实的内在价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV008
      - number: '8.2'
        title: 上行情景、下行风险与审慎立场的原因
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于部署能否复制、客户站点能否扩张，以及产品能否避免在每家客户现场都付出一轮定制工程成本。悲观情景则是典型的硬件陷阱：客户采用放缓、烧钱居高不下，下一轮估值低于当前二级市场信号。收入和客户扩张的公开数据有限，现阶段更适合跟踪公司、等待经营证据，而不是认定当前估值能够维持。这样也能避免虚假的精确判断。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV009
      - number: '8.3'
        title: 可比标的框架
        blocks:
          - type: paragraph
            body: >-
              可比对象应优先选机器人公司，而非软件公司。公开资料显示，投资人和市场数据机构仍把 Collaborative Robotics
              与其他落地风险高、收入不确定的非上市机器人公司对照，这一框架更合适。因此，当前宜把它视作值得跟踪的机器人平台，但目前还不是可以充分承销的成长型资产。要转向更积极的判断，还需要更多客户验证和更清晰的毛利率改善路径。最接近的可比公司也不够完美，只能提供方向参考。市场估值调整往往快于基本面出现实质变化。
            claimRefs:
              - CV007
              - CV008
              - CV011
