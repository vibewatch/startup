    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与领导团队
        blocks:
          - type: paragraph
            body: >-
              Collaborative Robotics 总部位于 Santa Clara，自称要造的是实用型协作机器人，而不是人形机器人展示品。Brad Porter 的 Amazon
              机器人履历是创始人与市场契合度最有力的信号，也解释了公司为何能同时吸引战略投资者和综合型机构。公开资料还显示，团队规模不大，已在 Seattle 扩张 AI 业务，并聘请 Teresa Carlson
              担任顾问。整体看，公司处于商业化早期，技术和投资人背书都不弱；但披露不足，尚不能按成熟运营企业承销。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO009
