      - number: '6.3'
        title: 落地质量与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽调关键是看公司能否从一个标志性部署走向可复制的客户和站点基础。公开资料没有披露留存指标、合同数量或完整客户名单，采用逻辑仍显脆弱。关键不是「有没有客户」，而是「有多少站点、设备运行时间如何、客户扩张了多少」。没有这些答案，现有证据只能说明早期落地，不能证明规模化。单个试点和可扩张客户基础之间，隔着故事与生意的距离。
