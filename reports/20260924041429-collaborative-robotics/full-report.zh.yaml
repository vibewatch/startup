              地区的货物转运设施。机器人进入真实工作流，而非只做演示，是投资人看重的证据。即便如此，公司仍未公布完整客户名单；现有客户基础可信，但规模小且高度集中。这能证明已有客户，却不足以证明销售引擎已规模化。
