              - CE009
      - number: '5.3'
        title: 成熟度评估与技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              产品看起来已进入部署阶段，而不是演示阶段；技术尽调仍缺硬数据。有效载荷（payload）、传感器配置、自主能力基准、设备运行时间、SDK
              和集成细节都待补。公司的差异化主张取决于可复制性：如果机器人只适用于少数环境，实际市场会比品牌暗示的小得多。还要看基础模型进步究竟能降低部署成本，还是只让实验更烧钱；这会直接影响硬件业务的经济性。
