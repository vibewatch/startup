  title: Product & Technology
  summary: Explain what is delivered, how it works, maturity, dependencies, and product/technical risks.
sections:
- id: S01
  title: What the product is
  body: 'The public evidence points to a mobile collaborative robot built for material handling in shared spaces. The company
    intentionally avoids a humanoid framing, and that distinction matters: the product is meant to be human-capable and practically
    useful, not a research showcase. The clearest independent signal is that the robot was already working in a live transload
    facility by 2024, which indicates the company had moved beyond simulation and into an actual deployment loop. That is
    still early, but it is materially more credible than a deck-only robotics startup. The main remaining question is whether
    the same system can be repeated across facilities without a bespoke engineering team.'
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE010
  - CE012
  tableRefs:
  - TE001
- id: S02
  title: How it likely works
  body: The technical story centers on multimodal AI and shared-space behavior rather than on a fully disclosed hardware stack.
    The Seattle foundation-models team suggests a product strategy built around generalization, natural interaction, and task
    learning across environments. That could be powerful if it reduces the amount of hand-tuning customers need, but the flip
    side is that the public spec sheet remains thin. We know enough to say the product is not a science project; we do not
    know enough to say the company has solved the hard parts of autonomy, manipulation, and uptime at scale. That uncertainty
    is exactly why the diligence bar stays high.
  claimRefs:
  - CE003
  - CE004
  - CE007
  - CE008
  - CE009
  - CE011
  tableRefs:
  - TE002
- id: S03
  title: Maturity and diligence gaps
  body: "The product appears to be in the deployment phase, not the demo phase, but technical diligence still needs concrete\
    \ data. The key missing items are payload, sensor stack, autonomy benchmarks, uptime, and SDK or integration detail. Those\
    \ gaps matter because the company\u2019s differentiation claim depends on repeatability: if the robot only works in a\
    \ narrow set of environments, then the market is more fragile than the branding implies. A second question is whether\
    \ foundation-model improvements translate into cheaper deployments or merely more expensive experimentation. In a hardware\
    \ business, that distinction drives the economics."
  claimRefs:
  - CE005
  - CE006
  - CE008
  - CE011
  - CE012
  tableRefs:
  - TE003
  figureRefs:
  - FE001
