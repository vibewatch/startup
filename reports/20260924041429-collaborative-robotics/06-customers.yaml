chapter:
  number: 6
  title: Customers
  summary: Identify who pays/uses the product, the proof of real adoption, durability, expansion, and concentration risks.
sections:
- id: S01
  title: What customers are visible
  body: The public customer picture is still narrow but real. The company says its first robots were in the field with a global
    logistics partner in 2024, and third-party coverage points to a transload facility deployment in the Seattle region. That
    is the kind of evidence investors want because it shows a robot living in a real workflow rather than a demo environment.
    Even so, the company still does not publish a broad customer roster, which means the report should treat the current base
    as credible but small and highly concentrated. It is enough to prove a customer exists, not enough to prove a scaled sales
    engine.
  claimRefs:
  - CU001
  - CU002
  - CU005
  - CU007
  - CU008
  tableRefs:
  - TU001
  - TU002
- id: S02
  title: Who the customer is likely to be
  body: "The likely first buyers are logistics and manufacturing operators with repetitive material movement, limited labor\
    \ slack, and enough operational discipline to run pilots. Public market research and case studies consistently show that\
    \ cobot adoption depends on ergonomics, safety, and local workflow tuning. That means the customer profile is not just\
    \ \u201Clarge company\u201D; it is \u201Clarge enough to absorb integration work and process change.\u201D Healthcare\
    \ and biotech are possible, but the visible proof remains much stronger in logistics than in other verticals. In other\
    \ words, the deal cycle probably starts with a pilot and ends with a workflow redesign."
  claimRefs:
  - CU003
  - CU004
  - CU006
  - CU009
  - CU011
  tableRefs:
  - TU003
  figureRefs:
  - FU001
- id: S03
  title: Adoption quality and gaps
  body: "The key diligence question is whether the company has moved from one notable deployment to a repeatable base of customers\
    \ and sites. Public sources do not show retention metrics, contract volume, or a broad customer list, which keeps the\
    \ adoption thesis fragile. The right next step is not to ask \u201Cis there a customer?\u201D but \u201Chow many sites,\
    \ how much uptime, and how much expansion?\u201D Without those answers, the evidence still reads like early proof, not\
    \ scaled proof. The difference between a single pilot and a scalable customer base is the difference between story and\
    \ business."
  claimRefs:
  - CU004
  - CU010
  - CU012
