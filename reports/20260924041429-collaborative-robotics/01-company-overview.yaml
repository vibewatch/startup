  title: Company Overview
  summary: Establish identity, leadership, funding, scale, and milestones that every later chapter can reuse as ground truth.
sections:
- id: S01
  title: Identity and leadership
  body: Collaborative Robotics is a Santa Clara-based robotics company that presents itself as a builder of practical collaborative
    robots rather than humanoid showpieces. The public story is anchored by Brad Porter, whose Amazon robotics pedigree is
    the main founder-market-fit signal and still the most credible single-person explanation for why the company has attracted
    both strategic and generalist capital. Public profiles also point to a compact team that expanded into Seattle for AI
    work, plus Teresa Carlson as an advisor. Taken together, the company reads like an early commercial robotics platform
    with enough technical and investor credibility to matter, but without enough disclosure to underwrite it like a mature
    operating company.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO007
  - CO009
  tableRefs:
  - TO002
- id: S02
  title: Funding and operating scale
  body: "The financing story is clear enough to support a refresh: a $30 million Series A in 2023 followed by a $100 million\
    \ Series B in April 2024, with total disclosed capital now above $140 million. General Catalyst led the later round and\
    \ a wide investor base doubled down, which matters because robotics hardware rarely wins capital from both strategic and\
    \ financial backers unless the story has already demonstrated some field traction. The company\u2019s reported headcount\
    \ remains small relative to its ambitions, with GeekWire describing roughly 40 people and a newly opened Seattle office.\
    \ That is enough to suggest real execution, but not enough to imply a scaled manufacturing or revenue machine."
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO010
  tableRefs:
  - TO001
  - TO003
- id: S03
  title: Milestones and open gaps
  body: The key milestone is not a product launch but a progression from founding in 2022 to first field robots in 2024 and
    a public AI-team expansion in Seattle soon after. That sequence indicates the company has moved beyond pure research,
    yet the biggest diligence gaps remain public revenue, exact customer counts, and current valuation. The available secondary-market
    sources still treat those numbers as opaque or stale, so the report should treat any valuation read-through as a rough
    mark rather than an underwriting anchor. In practice, the company looks like an early-stage robotics platform with credible
    capital formation, modest operating scale, and still-limited disclosure.
  claimRefs:
  - CO008
  - CO011
  - CO012
  figureRefs:
  - FO001
