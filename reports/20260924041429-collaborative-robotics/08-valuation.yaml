  title: Valuation
  summary: Convert evidence into recommendation, confidence, risk rating, valuation stance, scenarios, and diligence asks.
sections:
- id: S01
  title: How to think about the mark
  body: "The best-supported public valuation anchor is still the roughly $500 million mark associated with the 2024 Series\
    \ B. That is not the same thing as a fresh fundamental valuation, and the difference matters: the company\u2019s public\
    \ signals are strong enough to suggest venture conviction, but not strong enough to justify a confident late-stage software-style\
    \ multiple. In other words, the valuation story is real, but it is still a story built on potential and capital formation\
    \ rather than on visible operating scale. The current mark should therefore be treated as a reference point, not a conclusion.\
    \ It is a market signal, not a verified intrinsic value today."
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV011
  tableRefs:
  - TV001
  - TV002
- id: S02
  title: Upside, downside, and why the stance is cautious
  body: 'The upside case depends on repeatable deployments, expanding customer sites, and evidence that the product can scale
    without a one-off engineering tax at each customer. The downside case is a typical hardware trap: adoption slows, burn
    stays high, and the next valuation round resets lower than the current secondary signal. Because the public data are thin
    on revenue and customer expansion, the right posture is to track the company and wait for more operating proof rather
    than assume the current mark is durable. That keeps the view disciplined and avoids false precision.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV008
  - CV009
  - CV010
  - CV012
  tableRefs:
  - TV003
  figureRefs:
  - FV001
- id: S03
  title: Comparable framing
  body: 'The comp set should be robotics-first, not software-first. Public pages show that investors and market-data providers
    still frame the company against other private robotics names with deployment risk and uncertain revenue, which is the
    right way to think about it. That makes the recommendation modest: the company is investable as a monitored robotics platform,
    but not yet as a fully underwritten growth asset. Any stronger view would need more customer proof and a cleaner path
    to gross margin. That also means the nearest comparables are still imperfect and should be used directionally. Markets
    will update the mark faster than fundamentals do materially.'
  claimRefs:
  - CV007
  - CV008
  - CV011
