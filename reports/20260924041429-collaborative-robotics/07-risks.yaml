  title: Risks
  summary: Rank legal, regulatory, operational, technical, financial, partner, customer, and execution risks with mitigations
    and kill criteria.
sections:
- id: S01
  title: Primary risks
  body: 'The biggest risks are the ones that usually kill early robotics companies: safety, reliability, and the gap between
    a good demo and repeatable deployment. Because the robot is meant to work near people, any failure carries a trust penalty
    that a fenced-off system can avoid. The public literature on collaborative robotics reinforces that point repeatedly;
    safety is not an add-on, it is the product. On top of that, the company still lacks enough public telemetry to rule out
    uptime or edge-case failures, which means the downside is not theoretical. Even a single serious incident could reset
    customer confidence. Investors will price that risk immediately.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR008
  - CR009
  tableRefs:
  - TR001
  - TR002
- id: S02
  title: Commercial and execution risk
  body: 'The second risk layer is commercial: can the company turn a few deployments into a repeatable base of customers?
    Hardware companies often stall because deployments are bespoke, margins are thin, and each new site requires more engineering
    than sales teams expect. A small team raises the execution stakes because every customer issue can consume founder time.
    That risk is magnified by capital intensity: if the company needs more hardware, more integration work, or a longer sales
    cycle than planned, dilution or a reset round becomes more likely.'
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR010
  - CR012
  tableRefs:
  - TR003
  figureRefs:
  - FR001
- id: S03
  title: What would make the risk acceptable
  body: 'The mitigation path is straightforward in concept: narrower use cases, rigorous safety cases, better field data,
    and a willingness to slow expansion until the product is reliable. That is not a low-risk plan, but it is a survivable
    one. If the company can keep deployments narrow and learn quickly, the current risk stack is manageable. If it tries to
    scale before the product is repeatedly proven, the same stack becomes a company-killer. This is especially true if customers
    demand certification-like evidence before signing. The faster the company can show credible field telemetry, the easier
    it becomes to lower sales friction. That makes the next six to twelve months critical.'
  claimRefs:
  - CR011
  - CR012
