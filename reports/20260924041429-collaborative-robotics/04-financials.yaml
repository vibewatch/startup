  title: Financials
  summary: Explain revenue model, unit economics, capital needs, and which financial inputs are insufficient for underwriting.
sections:
- id: S01
  title: Funding history
  body: The financing history is the clearest public part of the financial picture. The company completed a $30 million Series
    A in 2023 and a $100 million Series B in 2024, taking total disclosed capital above $140 million. The syndicate is unusually
    broad and includes both strategic and generalist investors, which is encouraging but also means the market is still funding
    the story on future potential rather than on a visible profit engine. The most useful inference from the capital stack
    is not that the business is mature; it is that the business has enough investor conviction to keep building hardware and
    field deployments.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI010
  tableRefs:
  - TI001
  - TI003
  figureRefs:
  - FI001
- id: S02
  title: Valuation and capital intensity
  body: "External secondary-market pages imply a roughly $500 million mark around the Series B, but the company itself does\
    \ not appear to disclose a current valuation. That makes valuation analysis directional and dependent on how quickly the\
    \ company can prove repeatable deployments. The funding cadence, plus the company\u2019s hardware footprint and small\
    \ team, imply a capital-intensive model that will keep needing milestones before it can look like a self-funding software\
    \ business. For diligence purposes, the missing operating metrics matter more than the headline funding number. The valuation\
    \ case remains fragile until the company can show that capital is converting into durable customer expansion."
  claimRefs:
  - CI004
  - CI005
  - CI007
  - CI009
  - CI011
  tableRefs:
  - TI002
- id: S03
  title: What is still missing
  body: The most important unanswered financial questions are burn, gross margin, unit economics, and whether any customer
    contracts have moved beyond pilots. Public sources do not provide enough evidence to build a real P&L model. In other
    words, the company has funding credibility, but not yet financial transparency. That is normal for an early robotics company,
    but it keeps the underwriting case dependent on product and adoption proof rather than on accounting evidence. In practical
    terms, this is still a funding-led story rather than a finance-led one. Until those metrics appear, every valuation read-through
    should stay tentative.
  claimRefs:
  - CI006
  - CI008
  - CI012
