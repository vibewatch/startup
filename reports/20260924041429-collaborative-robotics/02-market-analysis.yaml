  title: Market Analysis
  summary: Define the market, buyer, sizing, drivers, and constraints that govern adoption and valuation.
sections:
- id: S01
  title: Market definition
  body: "Collaborative Robotics is best understood as a shared-workspace automation company: the market is not generic industrial\
    \ robotics, but robots that can operate near people while handling material movement and task coordination. The company\u2019\
    s own site and co.bot branding emphasize predictable behavior and real-world applicability, while external profiles place\
    \ it inside mobile manipulation and cobot categories. That matters because the buyer is not just buying a robot arm; they\
    \ are buying a workflow system that must fit existing safety, facilities, and labor constraints. In practice, the market\
    \ is constrained as much by facility redesign and operator trust as by pure technical capability."
  claimRefs:
  - CM001
  - CM004
  - CM009
  - CM010
  tableRefs:
  - TM001
- id: S02
  title: Buyer and adoption thesis
  body: The first budget owner is likely a logistics or manufacturing operator with repetitive material-handling tasks, staffing
    pressure, and enough process discipline to tolerate a pilot. Public coverage repeatedly ties the category to warehouses,
    manufacturing floors, healthcare, retail, and service environments where physical strain and throughput matter. The economic
    case is therefore labor substitution plus ergonomics plus throughput, not a science-project bet on autonomy for its own
    sake. If the company breaks out, it will be because the robot makes a concrete workflow cheaper or more reliable than
    human-only execution. A durable market thesis also needs evidence that the robot can be deployed without turning every
    sale into a custom integration project.
  claimRefs:
  - CM002
  - CM006
  - CM007
  - CM010
  tableRefs:
  - TM002
  - TM003
- id: S03
  title: Why adoption remains constrained
  body: The biggest adoption drag is still safety and integration in brownfield environments. Shared-space robot deployments
    must navigate physical proximity, workflow redesign, and operator trust at the same time, which is why many buyers prefer
    fixed automation or AMRs when the task can be simplified. Public market pages suggest the cobot category is growing, but
    that does not mean the category is easy to sell. The diligence question is whether Collaborative Robotics can translate
    category tailwinds into repeatable deployments with enough ROI evidence to overcome the operational friction. If the answer
    is yes, the company could ride a broader shift toward human-centric automation; if not, the addressable market narrows
    sharply.
  claimRefs:
  - CM003
  - CM005
  - CM008
  - CM011
  - CM012
  figureRefs:
  - FM001
