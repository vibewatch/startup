evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: Audited FY2025 and FY2026 income statements, EBITDA, gross margin by segment, and operating cash flow metrics.
    whyItMatters: >-
      As a private company, Epic does not publicly release audited financial statements, making software-margin
      sustainability and Fortnite revenue concentration difficult to quantify objectively.
    diligencePath: >-
      Obtain private secondary market offering memoranda, investor roadshow materials, or audited stakeholder
      disclosures under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-and-stakeholder-enumeration
    missingEvidence: >-
      Complete organizational roster of secondary executive leadership and full cap table breakdown across all 50+
      minority shareholders.
    whyItMatters: >-
      Private corporate status limits public visibility into complete board voting agreements, secondary liquidity
      terms, and non-executive leadership benches.
    diligencePath: Request an updated cap table ledger and executive organizational chart during formal sponsor diligence.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: epic-specific-sizing
    missingEvidence: >-
      Audited revenue, gross margin, and contribution profit by Fortnite, Unreal Engine, Epic Games Store, creator
      economy, and online services.
    whyItMatters: >-
      Without segment economics, broad category estimates cannot be translated into an Epic-specific SAM, capture rate,
      or valuation multiple.
    diligencePath: Obtain management accounts for 2024-2026 and reconcile each segment to consolidated revenue and cash flow.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-methodology
    missingEvidence: >-
      Underlying definitions, source data, and forecast methodology for the retained gaming and game-engine market
      estimates.
    whyItMatters: The estimates cover overlapping categories and cannot be compared or summed without consistent boundaries.
    diligencePath: >-
      Acquire the underlying market studies and rebuild a normalized model by geography, platform, payer, and revenue
      pool.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Independent buyer interviews, annual budget ownership, procurement cycles, win rates, retention, and
      willingness-to-pay evidence for each product line.
    whyItMatters: Product reach and favorable terms do not establish paid conversion, durable demand, or sales efficiency.
    diligencePath: >-
      Interview a stratified sample of studios, publishers, creators, and non-game Unreal customers and validate results
      against cohort data.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM007
  - type: stale
    severity: material
    topic: regulatory-status
    missingEvidence: >-
      Current primary legal records for the FTC matter and related app-distribution proceedings after the official
      page's June 2025 update.
    whyItMatters: Low-reputation 2026 summaries cannot establish current liability, remedies, or platform economics.
    diligencePath: >-
      Review the FTC docket and controlling court filings directly, then reconcile settlement, appeal, and compliance
      status.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: storefront-standalone-profitability
    missingEvidence: >-
      Audited financial breakdown of Epic Games Store standalone revenue, developer minimum guarantee commitments,
      payment processing expenses, and net operating margin.
    whyItMatters: >-
      Without segmented store P&L data, underwriters cannot independently determine whether EGS's 12% fee covers ongoing
      hosting, distribution, and payment costs or operates as a loss-leader subsidised by Fortnite.
    diligencePath: >-
      Review internal management accounts, segment reporting disclosures, or confidential court exhibits from Epic v.
      Apple / Epic v. Google antitrust proceedings.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-segment-mix
    missingEvidence: >-
      Audited current revenue, recognition policies, and segment revenue across Fortnite, Unreal Engine, Epic Games
      Store, and developer services.
    whyItMatters: >-
      Without segment data, historical revenue and third-party estimates cannot establish current growth, concentration,
      or revenue quality.
    diligencePath: >-
      Obtain audited financial statements, revenue-recognition memos, and monthly segment reporting from the investor
      data room.
    relatedQuestionRefs:
      - QI001
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, debt, operating burn, capex, working capital, committed uses of funds, runway, and
      next-round triggers.
    whyItMatters: Historical funding raised is not cash available and cannot establish present liquidity or financing dependency.
    diligencePath: >-
      Request the latest balance sheet, monthly cash bridge, debt and covenant schedule, board budget, and financing
      plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Executed store and engine contracts, exceptions, discounts, guarantees, GMV, effective take rates, refunds,
      chargebacks, and payment costs.
    whyItMatters: Published list-program terms do not establish realized net revenue or contribution margin.
    diligencePath: >-
      Sample executed agreements and reconcile contract terms to transaction-level billing, refunds, incentives, and
      general-ledger revenue.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Segment gross margin, store contribution margin, player and developer CAC, cohort retention, ARPPU, and payback.
    whyItMatters: These inputs determine whether growth is self-funding and whether engine and store economics diversify game risk.
    diligencePath: Obtain segment P&Ls and cohort-level acquisition, engagement, monetization, retention, and direct-cost schedules.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: contingent-liability
    missingEvidence: >-
      Management and counsel assessment of pending litigation and regulatory matters, insurance coverage, reserves, and
      reasonably possible loss ranges.
    whyItMatters: >-
      Public allegations and case-status pages identify exposure but do not quantify probability, defense cost, or cash
      impact.
    diligencePath: >-
      Review the legal matter schedule, counsel letters, insurance policies, settlement history, and accounting reserve
      analysis.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: developer-arr-and-engine-royalty-split
    missingEvidence: >-
      Audited financial breakdown of standalone Unreal Engine royalty revenue, enterprise subscription billings, and
      Epic Online Services fees.
    whyItMatters: >-
      Evaluating customer revenue durability requires understanding the exact revenue contribution from commercial
      developers versus Fortnite in-game purchases.
    diligencePath: >-
      Review audited segment financials or confidential private offering memorandums covering FY2025-FY2026 developer
      tools gross margin and revenue run-rate.
    relatedQuestionRefs:
      - QU001
      - QU006
  - type: missing-source
    severity: material
    topic: customer-retention-cohorts-and-nrr
    missingEvidence: >-
      Cohort-level net revenue retention (NRR), gross revenue retention (GRR), and payer churn rates for the Epic Games
      Store and Unreal Engine enterprise licensees.
    whyItMatters: >-
      Without retention curves, the commercial quality of Epic's 972 million registered accounts and the conversion rate
      of free game claimers cannot be validated.
    diligencePath: Obtain cohort retention data from internal store analytics or confidential management presentations.
    relatedQuestionRefs:
      - QU002
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-contract-values
    missingEvidence: >-
      Contract values, deployment durations, and commercial software license terms for non-gaming Unreal Engine and
      Twinmotion enterprise customers.
    whyItMatters: >-
      Validating enterprise expansion beyond core gaming requires verified commercial customer counts and contract
      sizing.
    diligencePath: >-
      Review enterprise customer agreements and vendor disclosures across architecture, automotive, and VFX customer
      deployments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory
    missingEvidence: >-
      Audited compliance monitoring reports and internal dark-pattern remediation reviews submitted under the FTC
      consent order.
    whyItMatters: >-
      Independent visibility into FTC compliance audit findings is critical to evaluate residual consent-decree
      enforcement risks and dark-pattern penalties.
    diligencePath: >-
      Request FTC compliance filings, third-party assessment audit records, and dark-pattern remediation documentation
      under NDA.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: segment-profitability
    missingEvidence: >-
      Audited GAAP financial statements showing standalone gross margin, operating expenses, and EBITDA for Fortnite,
      Unreal Engine, and Epic Games Store.
    whyItMatters: >-
      Without audited segment financials, investors cannot verify whether Unreal Engine licensing can support
      high-margin software multiples or if corporate profitability remains hostage to Fortnite's live-service lifecycle.
    diligencePath: >-
      Request confidential audited financials, auditor management letters, and segment EBITDA reconciliations through
      formal private placement data room access.
    relatedQuestionRefs:
      - QV008
  - id: GV002
    type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: >-
      Detailed capitalization table reflecting liquidation preferences, dividend covenants, and governance veto rights
      across Tencent, Sony, KIRKBI, and Disney shares.
    whyItMatters: >-
      Strategic corporate investors may hold senior liquidation preferences or restrictive consent rights that impair
      secondary common equity value in downside or exit scenarios.
    diligencePath: >-
      Obtain the operative amended and restated certificate of incorporation and investor rights agreements from Epic
      Games management.
    relatedQuestionRefs:
      - QV008
