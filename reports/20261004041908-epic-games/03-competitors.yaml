callouts:
  - calloutType: "insight"
    title: "The Take-Rate Paradox in Digital Distribution"
    body: "Epic Games Store's 88/12 split provides superior margin economics on paper, but distribution volume remains the governing variable for game developers. Because Steam's network effects generate 5x to 20x higher gross sales volumes, higher take rates are consistently rationalized by publishers prioritizing absolute cash flow over margin percentages."
    claimRefs:
      - "CP001"
      - "CP006"
  - calloutType: "risk"
    title: "Storefront Multi-Homing and Asymmetric Network Effects"
    body: "While developers can distribute simultaneously on multiple PC storefronts, consumer multi-homing is asymmetric. Gamers frequently retain their active libraries and social circles on Steam, limiting Epic's ability to convert exclusive title giveaways and fee cuts into durable, self-sustaining storefront engagement."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP010"
