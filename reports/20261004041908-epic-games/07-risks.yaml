    title: "Platform Asymmetry and Mobile Gatekeeper Headwinds"
    body: "Despite historic antitrust court victories curbing Apple's anti-steering rules and establishing Google's monopolistic store conduct, mobile gaming distribution remains economically frictionless only for incumbent platform operators. Epic continues to absorb heavy legal and technical overhead to distribute through alternative storefronts."
