callouts:
  - calloutType: "risk"
    title: "The Account Dormancy and Conversion Challenge"
    body: "While Epic reports 317 million registered PC users and 972 million cross-platform accounts, average 2025 monthly active users stood at 67 million, with daily active users at 31 million [CU002]. The free games program has successfully created hundreds of millions of user accounts, but converting promotional claimants into habitual, paying PC game consumers remains Epic's primary commercial hurdle against Steam's 74 percent market share [CU002, CU008]."
    claimRefs:
      - "CU002"
      - "CU008"
  - calloutType: "insight"
    title: "Fortnite Revenue and Engagement Concentration"
    body: "Epic's commercial customer foundation remains heavily concentrated around Fortnite, which generates approximately $6 billion in annual revenue across 110 million monthly active players [CU004]. While third-party EGS spending rose 57 percent to $400 million in 2025, Fortnite continues to subsidize platform infrastructure and developer revenue-share programs, leaving the broader enterprise vulnerable to live-service player fatigue [CU002, CU004, CU008]."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU008"
