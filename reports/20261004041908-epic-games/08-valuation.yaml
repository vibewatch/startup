callouts:
  - calloutType: "recommendation"
    title: "Diligence Stance: Maintain Research-More Posture Pending Audited Segment Financials"
    body: "While Epic Games possesses premier technological assets in Unreal Engine and strategic institutional backing from Disney and Sony, current private-market pricing indicates severe multiple contraction. Given live-service concentration in Fortnite, recurring operational expense pressures, and pending class action litigation, investors should reject historical $23B–$31.5B equity marks and maintain a research-more posture until full GAAP segment financials and cap table liquidation structures are disclosed."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV008"
      - "CV011"
      - "CV014"
  - calloutType: "risk"
    title: "Valuation Risk: Secondary Multiple Compression vs. Primary Strategic Marks"
    body: "The divergence between secondary pricing indicators ($14.96 billion Forge Price as of May 2026) and previous corporate strategic marks ($22.5 billion Disney round in 2024 and $31.5 billion peak in 2022) highlights material downside valuation risk for non-strategic investors lacking structural downside preferences."
