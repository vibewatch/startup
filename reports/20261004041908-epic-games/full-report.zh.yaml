chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与治理
        blocks:
          - type: paragraph
            body: >-
              Epic Games, Inc. 是一家总部位于北卡罗来纳州 Cary、在全球运营数十个办公室的美国电子游戏开发商、发行商和软件科技公司 [CO001]。Tim Sweeney 于 1991
              年创办公司，最初在马里兰州以 Potomac Computer Systems 商号经营，后更名为 Epic MegaGames 并将总部集中到北卡罗来纳州；公司目前仍为私营企业，由 Sweeney
              作为控制性股东领导 [CO001, CO002, CO004]。长期副总裁 Mark Rein、首席技术官 Kim Libreri 和总裁 Adam Sussman 支持高管治理
              [CO004]。美国司法部反垄断调查后，董事会格局明显变化：两名与 Tencent 相关的董事为应对 Tencent 同时参与 Riot Games 治理所引发的 Clayton / Sherman Act
              交叉董事审查而辞任 [CO005]。Epic 的多边业务覆盖第一方社交娱乐体验、面向媒体和工业领域的专有实时 3D 引擎许可、数字商业商店，以及跨平台开发者后端服务 [CO001, CO003]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
