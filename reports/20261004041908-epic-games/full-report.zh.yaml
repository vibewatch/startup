      - number: '7.3'
        title: 伙伴、平台与财务估值风险
        blocks:
          - type: paragraph
            body: >
              Epic 的多边业务高度依赖外部移动平台和开发者生态激励，造成结构性摩擦及平台对手方风险。尽管针对 Apple 和 Google 展开广泛反垄断诉讼，包括赢得推翻 Apple 反引导规则的地区法院禁令、以及针对
              Google Play Store 政策的反垄断陪审团裁决，移动游戏交易分发仍受平台守门人抵制、漫长上诉审查和不合规争议影响。移动游戏占数字应用变现的大多数，使 Epic 在 iOS 和 Android
              生态中无法充分实现直接分发效率。

              同时，Fortnite Developer Program 下的开发者参与度付款采用单方面条款，明确否认开发者审计 Epic 财务记录、内部账簿或参与度计算公式的权利。最后，Epic
              的估值标记承受严重的私人二级市场压力。The Walt Disney Company 在 2024 年 2 月以 $1.5 billion 投资将 Epic 一级估值锚定为 $22.5 billion，但
              Forge Global 后续私人二级股价显示，到 2026 年 5 月估值约为 $15.7 billion。这一约 30% 的折价反映市场对正常化 Fortnite 收入运行率、Epic Games Store
              运营亏损和宏观经济倍数压缩的怀疑。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
