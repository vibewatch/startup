  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管暴露
        blocks:
          - type: paragraph
            body: >
              Epic Games 面临日益复杂且敌意更强的全球监管环境，涉及儿童在线隐私、变现暗黑模式和内容年龄保障。FTC 2022 年 12
              月的标志性和解大幅改变了公司的合规基线：因违反《儿童在线隐私保护法》（COPPA）处以 $275 million 民事罚款，并因欺骗性计费和暗黑模式界面机制下达 $245 million 行政退款令。FTC
              事项仍受有效同意令监督，行政退款发放延续至 2025 和 2026 年，以处理延迟提出的索赔主张。

              同时，Epic 在加州州法院协调程序中面对合并的产品责任和人身伤害索赔（JCCP No. 5363）。据家庭指控，Fortnite 被刻意设计为通过多巴胺驱动的留存机制、机会型奖励和不透明 V-Bucks
              虚拟货币交易，促成未成年人强迫性行为成瘾。Epic 依据第一修正案表达保护和合同仲裁条款抗辩，但尚未达成全球和解。此外，国际平台合规增加执行摩擦，例如澳大利亚在 2026 年 9 月为 Epic Games
              Store 上的 R18+ 游戏强制推出年龄验证，迫使公司整合面部估算、信用卡授权和政府身份证扫描等多供应商身份系统。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              维护实时跨平台游戏基础设施和实时开发者工具，会带来严重技术与运营脆弱性。Unreal Engine 5.8 是重大架构演进，将 Megalights 等复杂图形创新推向生产就绪，加入面向掌机性能的 Lumen
              Lite，并改造 Mass 处理器执行，同时配套 Control Rig Physics 和 Skeletal Editor 装配工具。虽然这些进展巩固了 Epic
              的视觉和技术领先地位，但渲染管线和社区代码快速迭代，会增加高端被许可方的回归风险、构建不稳定和运行时性能瓶颈。

              Epic 的庞大基础设施生态覆盖数亿用户账户、Epic Games Store、Fortnite 大逃杀匹配器和开发者创作者门户，仍是外部威胁者、账户接管攻击和欺诈性信用活动的诱人目标。Epic 通过
              HackerOne 管理外部漏洞协调与披露，并运行公开漏洞赏金计划，借助社区识别 Web 和游戏服务漏洞。此外，近期裁员超过 1,000
              人收紧了运营余量，提高了工程师倦怠、客户支持周期变慢和大型平台更新期间安全补丁延迟的风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
