      - number: '4.3'
        title: 资本可得性有证据，资本充足性没有
        blocks:
          - type: paragraph
            body: >-
              Tracxn 报告九轮融资共筹得 $8.13 billion，其中包括 2024 年 2 月最新的 $1.5 billion
              融资。融资历史证明公司能够获得战略资本，但不能证明当前现金可用：累计资金可能已经支出、投资或被债务抵销。Multiples 给出 2024 年收入 $5.7 billion 和估值 $23 billion
              的估计值，隐含 3.9x 收入倍数，同时明确指出融资背景下没有来源说明收入或 ARR。因此本章将这些数字视为低置信度估计，而非经审计业绩。当前现金、债务、优先权、烧钱、现金跑道、营运资本、资本开支、毛利率、CAC
              和回本期仍不可得。
            claimRefs:
              - CI009
              - CI010
              - CI011
