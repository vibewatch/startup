      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 监管监督与青少年设计脆弱性
            body: >-
              监管未成年人隐私和暗黑模式的 FTC 同意令，与待决的加州州法院青少年成瘾诉讼相叠加，构成 Epic 最严重的声誉与运营风险。任何将 Fortnite
              进度和虚拟货币循环认定为侵权性有害行为的司法裁决，都可能迫使公司从根本上重做游戏变现。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 平台不对称与移动守门人阻力
            body: 尽管历史上的反垄断法院胜利限制了 Apple 的反引导规则并确认 Google 商店的垄断行为，移动游戏分发在经济上仍只对现有平台运营商顺畅。Epic 仍需承担沉重的法律和技术成本，才能通过替代商店分发。
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与核心反论点
        blocks:
          - type: paragraph
            body: >-
              Epic Games 的核心投资论点，在于其同时具备顶级实时服务游戏发行商和通过 Unreal Engine 提供基础性实时 3D 创作基础设施的差异化地位 [CV001, CV002]。Epic 从
              Sony、KIRKBI 和 The Walt Disney Company 等顶级战略伙伴累计筹得超过 $8.1 billion，建立了覆盖游戏、数字娱乐和虚拟制作的强大品牌资产与技术整合 [CV003,
              CV004]。Unreal Engine 在非游戏垂直领域不断扩张，例如虚拟摄影棚、汽车可视化和建筑模拟，为高毛利企业软件提供持久机会，并补充消费者游戏现金流 [CV002, CV005]。此外，Epic 针对
              Apple、Google 的激进反垄断诉讼已开始打开替代移动分发渠道，尤其是在欧盟，最终可能提高开发者净收入并扩大移动商店变现 [CV006, CV007]。

              反论点则突出严重的商业集中度、倍数压缩和运营摩擦。Fortnite 占消费者收入的绝大多数，使公司整体现金流暴露于玩家疲劳、季节性波动和参与度下降 [CV001, CV008]。2026 年 3
              月内部沟通中，管理层承认 Fortnite 参与度放缓期间支出超过收入，显示实时运营、服务器基础设施和开发者分成计划仍背负固定成本 [CV008]。同时，Epic
              持续面临监管和法律摩擦，包括围绕暗黑模式与青少年隐私的 $520 million FTC 和解合规，以及在加州合并的州级青少年游戏成瘾诉讼 [CV007, CV009, CV010]。在缺少多年经审计 GAAP
              财务报表和详细分部利润披露的情况下，公开证据无法验证非游戏软件许可利润是否足以抵消消费者游戏波动 [CV005, CV011]。
            claimRefs:
