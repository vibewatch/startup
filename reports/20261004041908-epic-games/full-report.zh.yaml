      - number: '8.3'
        title: 情景分析、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              评估 Epic Games，需要分别审视乐观、基准和悲观三种分化明显的经营轨迹 [CV001, CV008, CV011]。基准情景假设 Epic 的年收入稳定在 $5.8B–$6.2B，驱动力包括
              Fortnite 稳定的长期运营季节性、Unreal Engine 在企业客户中的温和渗透，以及受控的运营支出，由此支撑 $16.0B–$20.0B 的股权估值区间（收入倍数 2.7x–3.3x）[CV001,
              CV012]。乐观情景则假设 Unreal Engine 在媒体和工业企业客户中的采用加速、Disney 娱乐生态实现突破式变现，以及全球移动应用商店费率改革朝有利方向发展，从而推动股权估值回升至
              $26.0B–$32.0B （4.3x–5.2x 倍数）[CV001, CV004, CV006]。相反，悲观情景计入 Fortnite 长期运营衰退、合规和法律和解负债上升，以及 Epic Games
              Store 持续亏损经营，估值因此压缩至 $10.0B–$13.0B（1.8x–2.3x 倍数）[CV008, CV009, CV014]。


              从退出准备度看，Epic Games 尚未展现出为首次公开募股（IPO）做正式准备的迹象，仍是由少数战略伙伴集中持有的后期私营公司 [CV001,
              CV003]。考虑后期私募股权或老股交易的投资者，投入资金前必须设定严格的尽调否决标准 [CV001, CV011]。核心尽调要求包括： （1）连续多年经审计的 GAAP 分部财务报表，分别拆出
              Fortnite、Unreal Engine、Epic Games Store 和 Epic Online Services 的毛利率与 EBITDA；（2）股权结构表，披露 Sony、KIRKBI 和
              Disney 投资中的清算优先权、赎回权和偿付顺位条款；（3）Fortnite 创意模式和核心 Battle Royale
              模式的独立月活跃用户（MAU）及每用户平均收入（ARPU）趋势；以及（4）针对正在进行的加州青少年游戏集体诉讼的全面准备金和风险评估 [CV005, CV009, CV011]。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 尽调立场：在经审计的分部财务数据披露前，维持继续研究姿态
            body: >-
              Epic Games 坐拥 Unreal Engine 这一顶级技术资产，并得到 Disney 和 Sony 的战略性机构支持，但当前私募市场定价显示估值倍数严重收缩。 考虑到 Fortnite
              的长期运营业务集中度、反复出现的运营支出压力，以及尚未解决的集体诉讼，投资者应拒绝历史上的 $23B–$31.5B 股权估值，并在完整 GAAP 分部财务数据和股权结构表及清算条款披露前继续研究。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV011
              - CV014
          - type: callout
            title: 估值风险：二级市场倍数压缩相对一级市场战略投资估值
            body: >-
              二级市场定价指标（截至 2026 年 5 月的 $14.96 billion Forge Price）与此前的企业战略投资估值（2024 年 Disney 轮的 $22.5 billion，以及 2022 年峰值
              $31.5 billion）之间的分化，凸显了对缺乏结构性下行保护的非战略投资者而言的重大估值下行风险。
            calloutType: risk
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV012
              - CV014
