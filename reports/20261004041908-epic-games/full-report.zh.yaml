        - 出现开发者转向自研引擎，或竞争平台推动其商品化的证据。
      - - 正论
        - 战略生态合作
        - Disney、Sony 与 KIRKBI/LEGO 的深度战略支持及 IP 联合开发承诺扩大了整体触达。
        - 合作开发的 Disney 娱乐宇宙被取消，或变现长期延迟。
      - - 正论
        - 移动应用商店颠覆
        - 反垄断诉讼胜利及遵守欧盟 DMA，使第三方移动商店分发与更低抽成成为可能。
        - 应用商店运营商维持防御性收费体系，抹去替代商店的利润优势。
      - - 反论
        - Fortnite 收入集中
        - 公司绝大多数现金流依赖单一直播服务作品，而该作品可能出现参与度疲劳。
        - 经审计的多年披露证明 Unreal Engine 与商店收入贡献了超过 50% 的经营利润。
