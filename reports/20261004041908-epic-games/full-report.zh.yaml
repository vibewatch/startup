        - $16.0B - $20.0B
        - 2.7x - 3.3x 收入
        - Fortnite 收入稳定在 $5.8B-$6.0B；Disney 合作按计划推进；移动商店取得温和进展。
        - 参与度走弱造成现金消耗；固定基础设施成本压缩公司 EBITDA。
        - 中（55%）
      - - 悲观情景
        - $10.0B - $13.0B
        - 1.8x - 2.3x 收入
        - Fortnite 年收入降至 $5.0B 以下；商店运营仍不盈利；大量诉讼负债兑现。
        - 加利福尼亚集体诉讼责任上升；被迫裁员并重组研发。
        - 中（25%）
    notes: 情景假设 2024-2025 年收入运行率为 $5.7B-$6.0B，并参考二级市场估值基准。
    claimRefs:
      - CV001
      - CV004
      - CV008
      - CV009
      - CV012
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Epic Games 从创立、主要产品发布、标志性融资轮到结构性重组的时间演变。
    data:
      items:
        - date: '1991'
          label: 以 Potomac Computer Systems 创立
          detail: Tim Sweeney 在马里兰州成立工作室，先发布 ZZT，之后更名为 Epic MegaGames。
          claimRefs:
            - CO002
        - date: '1998'
          label: Unreal Engine 发布
          detail: Unreal 商业发布，并首次授权 Unreal Engine 3D 技术。
          claimRefs:
            - CO003
        - date: '1999'
          label: 总部整合
          detail: 工作室将开发运营集中到北卡罗来纳州 Cary，并采用 Epic Games 名称。
          claimRefs:
            - CO002
        - date: '2012'
          label: Tencent 战略投资
          detail: Tencent 收购少数股权，加速 Epic 向游戏即服务转型。
          claimRefs:
            - CO004
        - date: '2017'
          label: Fortnite Battle Royale 首发
          detail: Fortnite Battle Royale 上线，把公司的规模推向全球文化现象与直播服务现象级产品。
          claimRefs:
            - CO004
        - date: '2018'
          label: Epic Games Store 上线
          detail: PC 分发商店上线，为开发者提供 88/12 收入分成模式。
          claimRefs:
            - CO003
        - date: '2022'
          label: $2.0B F 轮融资
          detail: Kirkbi 与 Sony 投资 $2B，将 Epic 的投后股权估值锚定在 $31.5B。
          claimRefs:
            - CO007
        - date: '2022'
          label: FTC 和解协议
          detail: Epic 同意以 $520M 达成监管和解，处理儿童隐私与消费者计费退款流程。
          claimRefs:
            - CO011
        - date: '2024'
          label: Disney $1.5B 战略持股
          detail: The Walt Disney Company 投资 $1.5B 取得 9% 股权，打造互联数字宇宙。
          claimRefs:
            - CO008
        - date: '2026'
          label: 缩减员工与精简业务组合
          detail: 重组取消逾 1,000 个岗位，并剥离非核心市场，以聚焦引擎与游戏业务。
          claimRefs:
            - CO010
    approximationNotes: 里程碑时间线突出展示了经公开记录核实的公司、技术、融资与监管关键节点。
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO007
      - CO008
      - CO010
      - CO011
  - id: FM001
    title: 六个不可相加的市场与捕获视角
    type: pyramid
    summary: 宽泛的类别规模逐步收窄至 Epic 特定的规模指标，但单位混杂且缺少重叠数据，无法按比例从 TAM 换算到 SOM。
    data:
      items:
        - label: 全球电子游戏市场
          value: 299
          unit: USD billions, 2024
          detail: 宽泛的支出范围；包括 Epic 无法捕获的收入。
        - label: 全球移动游戏
          value: 175
          unit: USD billions, 2024 lower bound
          detail: 来源称收入超过该数值；它属于全球游戏市场，而非额外加总项。
        - label: 全球游戏引擎市场
          value: 3.1
          unit: USD billions, 2025
          detail: 第三方估算，没有 Epic 特定的可触达市场拆分。
        - label: 预计游戏引擎市场
          value: 8.3
          unit: USD billions, 2030
          detail: 预测值，抓取文本没有提供方法论。
        - label: Fortnite 注册用户
          value: 650
          unit: millions, August 2025
          detail: 用户规模，不代表付费用户、收入或去重后的市场人口。
        - label: Epic Games Store PC 游戏销售额
          value: 1
          unit: USD billion, 2025
          detail: 第三方销售估算；销售额不是 Epic 收入。
    approximationNotes: 数值按 Contrary Research 原样复现，未作插值。各项单位与期间混杂，不可相加，也未按比例展示 TAM/SAM/SOM 计算。
    claimRefs:
      - CM002
      - CM004
      - CM005
      - CM007
      - CM008
      - CM011
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 评估数字游戏平台，将开发者商业友好度与受众规模、分发能力进行对照。
    data:
      points:
        - label: Epic Games Store
          x: 8.5
          'y': 4.5
        - label: Valve (Steam)
          x: 4
          'y': 9.2
        - label: Apple App Store
          x: 2.5
          'y': 8.8
        - label: Google Play Store
          x: 3
          'y': 9
        - label: itch.io
          x: 9.5
          'y': 2
        - label: GOG
          x: 7
          'y': 3.5
    approximationNotes: X 轴代表开发者商业友好度（佣金分成与引擎费用减免；0=最不友好，10=最友好）。Y 轴代表受众规模、发现网络效应与销售转化速度（0=最低，10=主导）。
    claimRefs:
      - CP001
      - CP004
      - CP006
  - id: FI001
    title: Epic Games Store 收入至毛利桥
    type: flow
    summary: 官方触达、支付与激励条款定义了流程，但 GMV、Epic 净收入、直接成本与毛利仍不可得。
    data:
      nodes:
        - id: publisher
          label: 发行商列出产品
          detail: 指定证据中没有公开合同条款与资格要求。
        - id: audience
          label: 据称触达：295M+ Epic 用户
          detail: 覆盖 187 个国家；活跃用户与付费用户未披露。
        - id: checkout
          label: Epic 结账
          detail: 80+ 种支付方式与 43 种地区货币。
        - id: gross-sales
          label: 商品总值
          detail: 未披露。
        - id: publisher-economics
          label: 发行商收入分成
          detail: 二级来源称 Epic 标准抽成 12%；选择独占可在六个月内获得 100% 净分成。
        - id: royalty-waiver
          label: Unreal 版税豁免
          detail: Epic 称对经 Epic 处理的支付免收版税。
        - id: epic-net-revenue
          label: Epic 净收入
          detail: 激励、退款与例外项目后的金额未披露。
        - id: gross-profit
          label: 商店毛利
          detail: 支付、推广、担保、托管与服务成本后的金额未披露。
      edges:
        - from: publisher
          to: audience
        - from: audience
          to: checkout
        - from: checkout
          to: gross-sales
        - from: gross-sales
          to: publisher-economics
        - from: publisher-economics
          to: royalty-waiver
        - from: gross-sales
          to: epic-net-revenue
        - from: epic-net-revenue
          to: gross-profit
    approximationNotes: 不推断美元金额或转化率。列表条款无法证明实际经济结果，因此缺失值明确保留。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
  - id: FE001
    title: Epic Games 技术与平台架构栈
    type: stack
    summary: 为 Epic 互动娱乐与开发者生态提供动力的分层软件、运行时、基础设施与治理栈。
    data:
      layers:
        - label: 体验与分发层
          detail: 直面消费者的商店与大规模直播服务游戏界面
          modules:
            - Fortnite 生态
            - Epic Games Store (EGS)
        - label: 创作者工具链与引擎层
          detail: 端到端 3D 内容创作套件与程序化生成工具
          modules:
            - Unreal Engine 5 (Nanite/Lumen)
            - Fortnite Unreal Editor（UEFN）
            - Verse 编程语言
            - Twinmotion 与 MetaHuman
            - RealityScan 与 Fab Marketplace
        - label: 后端平台与服务层
          detail: 与引擎无关的跨平台服务套件，采用统一身份体系
          modules:
            - Epic 账户服务
            - EOS 大厅与会话
            - 匹配与语音
            - EOS 反作弊与制裁
        - label: 全球基础设施与边缘层
          detail: 分布式边缘服务器编排与低延迟数据包中继网络
          modules:
            - Edgegap 多云编排
            - 分布式中继服务器
            - 容器镜像仓库
            - 多云动态集群扩缩容
        - label: 信任、安全与治理层
          detail: 合规治理、青少年安全验证与计费审计控制
          modules:
            - Kids Web Services（KWS）
            - COPPA 同意验证
            - 明示计费与暗黑模式防护
            - 家长游戏时长与购买控制
        - label: 核心仿真与基础层
          detail: 基础仿真运行时、高性能 C++ 网络与物理子系统
          modules:
            - Chaos 物理系统
            - 高性能 C++ 核心
            - 原生平台硬件 HAL
    approximationNotes: 基于 Epic Developer Community 官方文档与技术合作架构提炼出的逻辑架构抽象。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE009
      - CE012
  - id: FU001
    title: 客户旅程与扩张循环
    type: journey-map
    summary: 分阶段梳理玩家与开发者的获客、参与、跨产品扩张和变现路径。
    data:
      nodes:
        - label: 账户注册引导
          description: 通过免费游戏推广与跨平台注册吸引玩家进入 972M 账户基础
          touchpoints:
            - Epic Games Store weekly free game catalog
            - Fortnite free-to-play cross-platform download
            - Epic Games Launcher registration
        - label: 消费者参与
          description: 积极参与社交游戏、文字 / 语音聊天，以及 Fortnite 赛季制实时服务玩法
          touchpoints:
            - 110M monthly active Fortnite players
            - 78M peak monthly active store users
            - Cross-game text chat, voice chat, and avatar systems
        - label: 目录变现
          description: 将免费账户持有者转化为付费第三方游戏买家和游戏内外观购买者
          touchpoints:
            - Fortnite cosmetic and battle pass purchases
            - $400M in third-party PC game spending
            - Publisher collaboration pre-order bonus cosmetics
        - label: 开发者与创作者工具
          description: 开发者借助有利于开发者的经济激励采用 Unreal Engine，并通过 EGS 分发
          touchpoints:
            - 100% net revenue share on first $1M per title annually
            - Unreal Engine 5 real-time 3D creation and UEFN tools
            - Epic Developer Portal self-service publishing
        - label: 企业与品牌生态
          description: 大型品牌和工作室部署 Epic 技术，用于虚拟世界、实时服务与云规模运营
          touchpoints:
            - AWS dynamic cloud compute scaling up to 30x peak
            - Lego Group kid-safe immersive play environments
            - Twinmotion and MetaHuman enterprise visualization
        - label: 留存与平台摩擦
          description: 持续推进平台治理、条款执行，并处理法律与监管争议
          touchpoints:
            - Standardized Terms of Service and dispute arbitration
            - FTC billing and dark patterns refund remediation
            - App store antitrust litigation and mobile expansion
    approximationNotes: 旅程阶段综合了客户获客漏斗、开发者变现模式与企业基础设施部署情况。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险严重度矩阵
    type: matrix
    summary: 从运营、监管、依赖与估值维度评估 Epic Games 面临的主要企业风险。
    data:
      columns:
        - 可忽略影响
        - 轻微影响
        - 中等影响
        - 严重影响
        - 关键影响
        - 灾难性影响
      rows:
        - label: 几乎确定
          values:
            - label: 商店年龄核验
              detail: 澳大利亚 R18+ 年龄验证带来的合规负担。
              tone: neutral
            - label: 常规补丁延迟
              detail: 本地化资产部署出现轻微延误。
              tone: neutral
            - label: 账户支持工单
              detail: 赛季更新期间工单队列出现中等程度的摩擦。
              tone: warning
            - label: 凭证填充攻击
              detail: 针对账户的大规模自动化凭证攻击。
              tone: warning
            - label: 移动平台摩擦
              detail: 对 Apple / Google App Store 费用的抵制与引导限制。
              tone: critical
            - label: 平台拉黑
              detail: 完全失去主要移动应用商店的分发渠道。
              tone: critical
        - label: 高度可能
          values:
            - label: SDK 工具弃用
              detail: 引擎插件子系统中的第三方组件被弃用。
              tone: neutral
            - label: 资产商店下架
              detail: Fab 上个别创作者遭遇版权下架争议。
              tone: neutral
            - label: 引擎流水线回归
              detail: Unreal Engine 5.8 的渲染与物理集成缺陷。
              tone: neutral
            - label: 二级市场估值下调
              detail: 二级市场定价下调至约 $15.7B。
              tone: warning
            - label: Fortnite 参与度漂移
              detail: 实时服务参与度走弱，推动成本重组。
              tone: risk
            - label: 核心 IP 崩塌
              detail: 玩家永久、结构性地离开大逃杀游戏。
              tone: critical
        - label: 可能
          values:
            - label: 社区论坛中断
              detail: 开发者门户留言板暂时停机。
              tone: neutral
            - label: 本地支付故障
              detail: 购买 V-Bucks 时区域支付网关间歇性超时。
              tone: neutral
            - label: 创作者分成争议
              detail: 开发者不满参与度计算公式不透明。
              tone: warning
            - label: Fortnite 成瘾集体侵权诉讼
              detail: 加州州法院协调处理人身伤害索赔。
              tone: risk
            - label: COPPA 不合规罚款
              detail: 因轻微隐私违规产生新的法定处罚。
              tone: critical
            - label: 系统性儿童伤害禁令
              detail: 司法机关禁止核心战斗通行证进度机制。
              tone: critical
        - label: 不太可能
          values:
            - label: 内部 Wiki 延迟
              detail: 内部工程文档门户出现延迟。
              tone: neutral
            - label: 次级域名钓鱼
              detail: 站外域名仿冒攻击未验证用户。
              tone: neutral
            - label: 区域 CDN 限速
              detail: 补丁发布期间区域 ISP 限制带宽。
              tone: neutral
            - label: 创作者大规模出走
              detail: 岛屿开发者持续迁移至竞争平台。
              tone: warning
            - label: FTC 同意令违约
              detail: 若暗黑模式整改未通过审计，将面临严厉执法。
              tone: critical
            - label: 全球匹配服务中断
              detail: 全球基础设施与身份服务中断数周。
              tone: critical
        - label: 罕见
          values:
            - label: 办公室网络故障
              detail: 区域设施本地内网短暂中断。
              tone: neutral
            - label: 测试版本泄露
              detail: 未提前公布的外观纹理文件被提早挖掘。
              tone: neutral
            - label: 关键人员流失
              detail: 裁员后资深工程师离职。
              tone: warning
            - label: 漏洞赏金利用
              detail: 补丁发布前将零日漏洞披露武器化。
              tone: risk
            - label: 反垄断上诉逆转
              detail: 高等法院撤销反引导禁令。
              tone: critical
            - label: 源代码外泄
              detail: 专有引擎与后端完整代码库遭到攻破。
              tone: critical
        - label: 极少可能
          values:
            - label: 外设固件缺陷
              detail: 不受支持的第三方手柄出现轻微输入延迟。
              tone: neutral
            - label: 静态网页镜像漂移
              detail: 旧版发布文档暂时不同步。
              tone: neutral
            - label: 轻微商标争议
              detail: 围绕附属产品命名的狭窄区域性争议。
              tone: neutral
            - label: 灾难恢复切换
              detail: 区域故障期间数据中心切换延迟较长。
              tone: warning
            - label: 企业偿付能力困境
              detail: 严重流动性紧张，需要困境资本重组。
              tone: critical
            - label: 敌意收购威胁
              detail: 被迫变更控制权，压过创始人的投票权。
              tone: critical
    approximationNotes: 可能性与影响程度的定位，是对公开诉讼记录、二级市场定价标记和技术发布信息进行定性尽调综合后的判断。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR006
      - CR007
      - CR008
      - CR010
      - CR012
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策流程将资产规模、集中度风险、估值重估和尽调门槛串联起来，最终得出「继续研究」的建议。
    data:
      nodes:
        - id: asset-scale
          label: 资产规模：用户账户超过 800M，采用行业标准的 Unreal Engine 基础设施
        - id: concentration-risk
          label: 集中度风险：高度依赖 Fortnite 收入，实时服务参与度波动较大
        - id: valuation-reset
          label: 估值重置：二级市场定价为 $14.96B，相比历史峰值 $31.5B，意味着估值收缩
        - id: regulatory-headwinds
          label: 监管逆风：加州青少年诉讼持续推进，并受 $520M FTC 和解协议下的合规要求约束
        - id: information-barrier
          label: 信息壁垒：缺少经审计的 GAAP 分部财务数据、EBITDA 和股权结构表优先级数据
        - id: final-recommendation
          label: 最终建议：相对历史定价，当前估值偏贵，建议继续研究
    approximationNotes: 以尽调证据为线索，按顺序串联至最终投资判断的逻辑流程。
