      - number: '5.3'
        title: 信任、安全、安全防护与合规治理
        blocks:
          - type: paragraph
            body: >-
              Epic 的消费者平台规模使产品架构暴露于严格监管、安全合规义务和产品责任诉讼。继 2022 年 12 月总额 $520 million 的联邦贸易委员会和解后，Epic 受管理儿童隐私和交易 UX
              设计的有效同意令约束。该监管行动包括因违反《儿童在线隐私保护法》（COPPA）而处以 $275 million 民事罚款，原因涉及未经授权收集 13 岁以下未成年人数据及默认启用语音聊天；另有 $245
              million 消费者退款补偿池，处理欺骗性暗黑模式和意外游戏内购买。同时，Epic 在加州州法院面对合并的大规模侵权诉讼（JCCP No. 5363），指控 Fortnite
              的算法参与机制、战利品机制、战斗通行证和虚拟货币（V-Bucks）在未成年人中造成强迫性心理成瘾。Epic 已部署 Kids Web Services（KWS）家长同意工具、未成年用户受限账户和 Epic
              Online Services 反作弊系统等结构性信任控制，但持续监管执法仍是关键产品风险。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
