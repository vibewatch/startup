              - CO004
      - number: '1.2'
        title: 资本结构、估值演变与所有权
        blocks:
          - type: paragraph
            body: >-
              Epic Games 累积了广泛的机构和战略资本历史，通过多轮机构及企业私募融资筹得超过 $8.1 billion [CO006, CO007]。2017 年后玩家基础快速扩张，融资最终在 2022 年 4
              月达到 $2.0 billion，由 Sony 与 LEGO 母公司 Kirkbi A/S 各半支持，建立 $31.5 billion 的峰值硬股权投后估值 [CO006, CO007]。2024 年 2
              月，The Walt Disney Company 完成 $1.5 billion 战略股权投资，共同开发互联娱乐宇宙，取得约 9% 股权，同时二级估值基准约为 $22.5 billion [CO006,
              CO007, CO008]。创始人 Tim Sweeney 保有投票控制权和约 41.4% 股权；中国科技集团 Tencent 因 2012 年关键投资持有估计 28% 至 40% 的股份，该投资推动 Epic
              转向游戏即服务 [CO004, CO007, CO008]。外部融资对应的股权结构表高度集中于战略伙伴；这些伙伴直接参与 Epic 核心游戏资产的平台和 IP 集成 [CO004, CO008]。
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO008
      - number: '1.3'
        title: 运营规模、规模理性化与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              Epic 规模庞大，报告称其在 Fortnite、Rocket League、Fall Guys 和 Epic Games Store 共有超过 800 million 个注册用户账户及超过 6 billion
              个好友连接 [CO001]。但维持多产品实时服务生态也带来组织和监管调整。2026 年 3 月，Epic 大幅裁员，影响超过 1,000 名员工，基础员工数降至约 4,000 人；公司因参与度增长放缓而削减
              $500 million 成本，随后又将 ArtStation 和 Sketchfab 出售给 Kitbash [CO006, CO009, CO010]。在监管与法律上，Epic 于 2022 年 12 月通过
              $520 million 和解解决 FTC 执法行动，其中包括 $275 million 民事罚款和 $245 million 面向消费者的行政退款基金，涉及暗黑模式和青少年计费；同时继续推进针对
              Apple、Google 应用商店分发模式的反垄断诉讼 [CO011, CO012]。此外，Epic 仍在处理与游戏设计有关的合并集体诉讼，同时保持对 Fortnite、Unreal Engine 5 开发和
              Epic Games Store 的核心运营聚焦 [CO010, CO012]。
            claimRefs:
              - CO001
              - CO006
              - CO009
              - CO010
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 双引擎业务模式韧性
            body: >-
              Epic Games 的结构较为均衡：Fortnite 带来即时消费者现金流和庞大用户参与，而 Unreal Engine、Epic Online Services 和 Fab
              提供黏性强、企业级的开发者基础设施，降低公司对典型游戏发行周期波动的暴露。
            calloutType: insight
            claimRefs:
              - CO001
              - CO003
          - type: callout
            title: 实时服务集中度与成本刚性
            body: 尽管持续投入开发者工具，消费者变现仍高度依赖 Fortnite。近期运营重组、模式停运和裁员表明，当峰值玩家参与度回落时，支撑广泛实时服务规模会暴露利润率脆弱性。
            calloutType: risk
            claimRefs:
              - CO006
              - CO010
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              不应拿一个不加区分的“游戏 TAM”来评估 Epic。经济上相关的边界包括四层变现：通过 Fortnite 和其他游戏获得的消费者支出；经 Epic Games Store 流转的第三方商业收入；Unreal
              Engine 销售的版税和工具；以及在转化为 Epic 收入前支持用户参与的创作者经济活动。Epic Online Services
              具有战略邻近性，因为它能降低跨平台开发者的采用摩擦，但已审阅证据将其描述为免费服务，而不是单独定价的市场。不同买家的替代品不同：玩家可选择竞品游戏，发行商可留在 Steam 或移动商店，工作室可使用 Unity
              或维护内部引擎。硬件、Epic 自有产品之外的广告及总媒体支出均被排除，因为分配到的证据没有将这些资金池与 Epic 的收入捕获经济联系起来。
            claimRefs:
              - CM001
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: 避免虚假精确的市场测算
        blocks:
          - type: paragraph
            body: >-
              Contrary Research 报告称，2024 年全球电子游戏市场为 $299 billion，预计 2030 年达到 $600 billion；同时分别估算游戏引擎市场 2025 年为 $3.1
              billion、2030 年为 $8.3 billion。这些估计覆盖不同人群并采用不同方法，既不能相加，也不能构成可信的 Epic TAM。同一来源称 2024 年移动游戏收入超过 $175
              billion，但移动游戏只是更广泛游戏总额的一部分，并非新的资金池。Epic 的规模指标也混合不同单位：Fortnite 用户、Unreal
              份额、商店用户和商店销售额，在缺少支出、地域、抽成率、留存和重叠数据时无法转换为 SAM 或 SOM。因此证据支持多种测算视角和尽调区间，而不是一个标题式市场数字。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM007
              - CM008
              - CM011
      - number: '2.3'
        title: 买家、用户、付款方与预算路径
        blocks:
          - type: paragraph
            body: >-
              Epic 服务于不同的经济参与者。Fortnite
              玩家使用产品，家庭为可选内容付费；创作者提供体验并获得基于参与度的分配；发行商选择商店并让渡交易价值的一部分；工作室技术负责人选择引擎，而引擎版税只有在作品成功后才会变得重要。Epic
              官方开发者页面强调创作工具、内容、服务、分发和社区，使跨产品采用路径具有可信度，但没有披露各层之间的转化率。已报告的商店条款和 Unreal
              版税门槛降低了初始采用成本；买家最终比较的是触达、工作流匹配度和预期经济性，而不只是标价。公开证据没有识别非游戏行业的年度企业预算、采购负责人或销售周期。
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              低前期成本、跨产品工具、大量玩家基础，以及面向发行商和创作者的经济激励，均有助于采用。这些机制可以相互强化：创作者增加内容，玩家创造需求，开发者工具减少构建和运营体验所需的工作。但市场规模并不能消除执行风险。第三方估计显示，Steam
              在月用户和销售额上明显领先 Epic Games Store；Hustle Fund 的模型显示 Epic 收入路径波动，并明确指出没有可确认的 2025 年数据。消费者保护风险也是采用约束：2025 年 6 月
              FTC 事项在其官方页面仍为待决状态，两个声誉较低的法律聚合网站描述了一项与计费和儿童隐私有关的 $520 million
              和解。后一个金额仅以低置信度保留，不能视为新的官方法律状态。因此，估值应奖励已经证明的收入捕获和持久单位经济，而不能只奖励宽泛的品类预测。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 广义 TAM 不是 Epic 的 SAM
            body: 已审阅来源没有披露足以推导 Epic 专属 SAM 或 SOM 的分部收入、客户重叠、地域资格或转化经济。管理层提供可核对的自下而上模型前，应把市场数字仅视为边界检查。
            calloutType: risk
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM009
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接商店、引擎与平台邻接
        blocks:
          - type: paragraph
            body: >-
              Epic Games 运营覆盖内容创作、开发者运行时基础设施和直接面向消费者数字商业的混合平台 [CP001, CP003, CP005]。在 PC 数字分发中，Epic Games Store（EGS）直接面对
              Valve Corporation 的 Steam，也面对 GOG 和 itch.io 等次级商店 [CP001, CP002, CP004]。开发者工具领域，Unreal Engine 与 Unity
              等商业运行时竞争，也与 Electronic Arts、Ubisoft 等大型发行商维护的内部专有引擎竞争 [CP002, CP003]。在核心游戏之外，学术分析观察到 Epic 的实时 3D 元宇宙目标与
              Netflix 等全球流媒体平台存在竞争重叠，争夺消费者休闲时间和互动参与 [CP007, CP008]。Epic 还因应用商店规则、应用内计费费率和跨平台安装摩擦，与 Apple、Google
              这类平台守门人发生冲突 [CP011, CP012]。尽管商店持续扩张并进行战略收购，Epic 商店仍不同于以社区为中心的平台，更重视发行商利润经济而非社交基础设施 [CP002, CP004, CP010]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP011
      - number: '3.2'
        title: 分发经济、商业条款与平台网络效应
        blocks:
          - type: paragraph
            body: >-
              Epic Games Store 与 Valve Steam 的核心商业争夺，在于抽成率经济与受众变现速度的取舍 [CP001, CP002, CP006]。Epic 对所有开发者销售统一抽取 12%
              收入，让创作者保留总收入的 88%；通过 EGS 销售的游戏还完全免除通常 5% 的 Unreal Engine 版税 [CP001, CP006]。相比之下，Steam 对最初 $10 million
              总收入抽成 30%，$10 million 至 $50 million 区间降至 25%，超过 $50 million 后为 20% [CP001, CP006]。由于独立发行的中位数终身收入只有 $5,000
              至 $15,000，绝大多数开发者面对 Steam 实际 30% 的抽成 [CP001, CP006]。不过，Valve 以庞大受众规模（每月活跃用户超过 130M，而 EGS 约
              70M）和成熟的发现机制抵消较高费用 [CP001, CP002, CP006]。同时在两家商店发行的独立开发者一贯报告，Steam 产生的收入比 Epic 多 5x 至 20x，极端情况下达到 50:1
              [CP001, CP006]。Epic 试图以区域调价和自动退款等消费者友好政策缩小差距 [CP009, CP010]。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP009
              - CP010
      - number: '3.3'
        title: 生态差异化、转换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Epic 的竞争护城河来自实时 3D 引擎、开发者后端服务与第一方文化 IP 的纵向整合 [CP002, CP003, CP005]。Epic 将 Fortnite 的社交参与、Unreal Engine
              的图形保真度和 Epic Online Services 的跨平台身份层整合起来，为复杂 3D 项目建立较高的开发者转换成本 [CP003, CP005,
              CP007]。但消费者切换商店的成本几乎为零，玩家可以轻松多栖，而持久游戏库、好友列表和社区模组仍集中在 Steam 成熟生态中 [CP001, CP004, CP010]。在更广的平台生态中，Epic 通过针对
              Apple、Google 的标志性反垄断诉讼挑战平台守门人，试图建立替代移动市场；但 $520 million FTC 罚款等监管和解显示出较大的合规与法律阻力 [CP011, CP012]。此外，Disney
              战略投资使 Epic 2024 年估值为 $23 billion，低于 2022 年 $32 billion 峰值，进一步显示投资人仍关注资本强度、对 Fortnite 的依赖和商店盈利能力 [CP002,
              CP013, CP014]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
