              - CI015
      - number: '4.4'
        title: 财务结论：变现逻辑清楚，现金创造不清楚
        blocks:
          - type: paragraph
            body: >-
              收入模式具备吸引力：声称覆盖面广的分发基础、多种支付通道、面向开发者的引擎经济，以及能把引擎采用连接到分发的商店。然而，没有任何指定来源确立当前合并收入、分部利润率、EBITDA、自由现金流或流动性。成本和负债信号也需要谨慎。原告律师事务所
              2026 年 4 月更新报告称 3 月裁员超过 1,000 人，并描述正在进行的成瘾指控；Trustpilot 抓取的评论样本反复出现支持、登录、退款和启动器投诉；FTC 截至 2025 年 6 月 25
              日仍将事项 1923203 列为待决。它们都没有量化负债，但合在一起强化了在评估前要求经审计数据和或有负债明细的必要性。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
