              - CP004
              - CP006
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 数字分发中的抽成率悖论
            body: >-
              Epic Games Store 的 88/12 分成在纸面上提供更优利润经济，但对游戏开发者而言，分发量才是决定变量。Steam 的网络效应带来高出 5x 至 20x
              的总销售额，因此发行商优先考虑绝对现金流而非利润率，较高抽成也就始终具有合理性。
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
          - type: callout
            title: 商店多栖与不对称网络效应
            body: 开发者可以同时在多个 PC 商店分发，但消费者多栖并不对称。玩家通常把活跃游戏库和社交圈留在 Steam，这限制了 Epic 将独家游戏赠送和低抽成转化为持久、自我维持的商店参与度。
            calloutType: risk
            claimRefs:
              - CP001
              - CP004
              - CP010
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构广泛，但构成不透明
        blocks:
          - type: paragraph
            body: >-
              Epic Games 有三个已获证据支持的变现支柱：自有游戏内购买、Unreal Engine 许可或版税，以及 Epic Games Store 分发费。两个独立二级来源描述了这一架构，Epic
              的开发者页面也确认更广泛的生态结合创作工具、内容、服务和分发。该模式可以在玩家和开发者之间分散收入，但分配到的证据没有提供当前分部构成、确认收入政策或按产品划分的经审计贡献。FourWeekMBA
              的历史数字显示，报告收入从 2018 年超过 $5.6 billion 降至 2019 年 $4.2 billion，原因是再投资压缩利润；这些旧数字说明波动性，不代表当前运行率。
            claimRefs:
              - CI005
              - CI008
              - CI016
