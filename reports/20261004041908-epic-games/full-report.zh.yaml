      - number: '5.2'
        title: 运营模式、基础设施与可扩展性
        blocks:
          - type: paragraph
            body: >-
              Epic 生态的技术架构需要高吞吐实时模拟和弹性后端基础设施，以支持大规模并发玩家。客户端运行时由 Unreal Engine 的高性能 C++ 和 Blueprint
              架构驱动；在线多人编排则依赖分布式微服务和混合云部署。面对季节性实时活动扩展到数百万并发用户等极端并发峰值，Epic Online Services 与 Edgegap
              等分布式边缘编排伙伴集成，在全球多云网络中缓存容器化游戏服务器。将容器自动部署到距离玩家最近的位置，可把边缘延迟降至 50 毫秒以内，并缓解严重丢包和抖动。此外，Epic Account Services 将
              PC、移动端和主机环境中的跨进度与身份抽象出来。但跨数亿账户扩展持久状态、虚拟商业交易和内容审核，会带来大量后端运营负担，并形成对第三方云托管基础设施的结构性依赖。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
