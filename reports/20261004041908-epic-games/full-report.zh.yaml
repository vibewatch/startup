  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 多边客户分层与商业角色
        blocks:
          - type: paragraph
            body: >-
              Epic Games 运营复杂的多边生态，服务三类不同客户：终端消费者玩家、专业创作者和开发者工作室，以及企业品牌伙伴 [CU001, CU002, CU003]。最大客户群是 Epic 生态中的零售玩家，包括
              972 million 个注册跨平台账户、317 million 名 PC 用户、Epic Games Store 78 million 峰值月活跃用户，以及 Fortnite 110 million 月活跃玩家
              [CU002, CU004]。玩家受 Epic 标准消费者服务条款约束，该条款为账户管理、游戏内数字商品和争议仲裁设定合同规则，覆盖 Fortnite、Rocket League 和 Fall Guys
              等第一方作品 [CU001]。开发者和创作者群体包括商业游戏开发团队、独立创作者和建筑可视化专业人士，他们使用 Unreal Engine、Twinmotion、MetaHuman 和 Epic
              Developer Portal 自助发布服务 [CU003, CU005]。企业品牌伙伴构成第三层战略客户，执行联合开发和营销计划，例如 Lego Group
              的长期数字游乐空间合作及代理主导的创作者生命周期计划 [CU003, CU006]。不过各分部的经济价值高度偏向零售游戏交易，开发者工具收入依赖分级版税和商店分发费 [CU002, CU004, CU007]。
            claimRefs:
