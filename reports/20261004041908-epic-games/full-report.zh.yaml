      - number: '8.2'
        title: 资本化历史、私人倍数与定价背景
        blocks:
          - type: paragraph
            body: >-
              Epic Games 私募股权资本化轨迹显示，2020 至 2022 年数字娱乐繁荣期间倍数极度扩张，随后又急剧收缩 [CV003, CV004, CV012]。2022 年 4 月，Epic 完成 $2.0
              billion 融资，Sony 与 KIRKBI 各半支持，每股价格 $930，建立 $31.5 billion 峰值私募投后估值，相当于记录收入 $5.7 billion 的约 5.5x [CV004,
              CV012, CV013]。但后续融资带来重大重置。2024 年 2 月，The Walt Disney Company 承诺投资 $1.5 billion，取得约 9% 战略股权以共同开发娱乐宇宙，每股定价
              $600，估值被标记在 $17.0 billion 至 $22.5 billion 之间（隐含历史收入倍数 3.0x–3.9x）[CV001, CV004, CV008, CV012]。

              二级市场数据显示私人市场折价进一步扩大。截至 2026 年 5 月 18 日，Forge Price 将 Epic Games 标为每股 $399.02，对应隐含股权估值 $14.96 billion，显著低于
              Disney 2024 年投资的每股 $600，也不到 2022 年 $930 峰值的一半 [CV001, CV014]。Epic 仍是由创始人兼 CEO Tim Sweeney 主导的私营控股公司（持有约
              41.4% 投票权），少数二级投资人面临结构性进入障碍，包括缺乏标准公开流动性、战略企业分档可能带来的优先权悬垂，以及完全没有经审计的公开季度财务 [CV001, CV003, CV012]。根据现有证据，接近
              $15 billion 的二级市场标记反映了更现实的风险调整定价；而以往 $23B–$31.5B 一级市场标记附近的进入价格仍无法支撑。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV012
              - CV013
              - CV014
