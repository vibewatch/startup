        - 私募市场估值下调
        - 估值从 2022 年的 $31.5B 降至 2024 年的 $17B-$22.5B，并在 2026 年二级市场降至 $14.96B。
        - 完成一轮定价高于 $30B、且有非战略投资者参与的机构一级融资。
