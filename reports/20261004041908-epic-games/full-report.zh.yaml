  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流整合
        blocks:
          - type: paragraph
            body: >-
              Epic Games 的产品组合分成两面：消费者互动娱乐，以及专业数字创作工作流。面向消费者，旗舰 Fortnite 生态把第一方实时服务玩法与由 Unreal Editor for
              Fortnite（UEFN）和 Verse 编程语言驱动的大量用户生成内容（UGC）及创作者岛屿结合起来。面向开发者和企业创作者，Epic 以 Unreal Engine、Twinmotion、MetaHuman
              和 RealityScan 提供端到端资产生产管线，并由统一内容市场 Fab 支持。在开发者和玩家两端，Epic Online
              Services（EOS）提供跨平台后端能力，包括身份、社交图谱、匹配、大厅、语音通信和反作弊。商业分发通过 Epic Games
              Store（EGS）完成，将消费者商店软件与开发者发布门户和自助发布工具结合。创作者工具、基础设施服务和消费者分发的紧密对齐构成闭环飞轮，但私有所有权掩盖了独立分部的运营利润。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
