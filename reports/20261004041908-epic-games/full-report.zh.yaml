              Epic 报告拥有 317 million 个注册 PC 用户和 972 million 个跨平台账户，但 2025 年平均月活跃用户为 67 million，日活跃用户为 31 million
              [CU002]。免费游戏计划成功创造数亿用户账户，但把促销领取者转化为习惯性付费 PC 游戏消费者，仍是 Epic 面对 Steam 74% 市场份额的主要商业难题 [CU002, CU008]。
