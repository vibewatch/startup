      - number: '6.2'
        title: 平台采用轨迹与商店经济
        blocks:
          - type: paragraph
            body: >-
              Epic Games Store 的平台采用显示第三方商业活动稳步扩张，但参与度差距明显 [CU002, CU007]。2025 年，Epic Games Store 总收入达到 $1.16
              billion，同比增长 6%，其中第三方 PC 游戏支出增长 57% 至 $400 million [CU002, CU004]。玩家在第三方作品中累计游玩 2.78 billion 小时，表明商店变现开始超越
              Fortnite 直接微交易经济 [CU002]。为加快开发者采用并应对 Steam 74% 的 PC 分发市场份额，Epic 自 2025 年 6 月 1 日起对每款作品每年最初 $1 million
              净收入实行 100% 分成，之后恢复标准 88/12 分成 [CU002, CU008]。然而商店采用仍受巨大转化差距限制：注册 PC 账户达到 317 million（部分分析认为已在约 295 million
              见顶），2025 年平均月活跃用户为 67 million（同比下降 1%），平均日活跃用户下降 2% 至 31 million [CU002]。这反映了 Epic
              激进免费游戏推广计划留下的摩擦：计划获得数亿注册账户，但这些账户的常规购买行为很低 [CU002, CU007]。
