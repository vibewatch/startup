              Epic 的商业客户基础仍高度集中于 Fortnite，后者在 110 million 月活跃玩家中产生约 $6 billion 年收入 [CU004]。虽然第三方 EGS 支出在 2025 年增长 57% 至
              $400 million，Fortnite 仍补贴平台基础设施和开发者分成计划，使整个企业容易受到实时服务玩家疲劳的冲击 [CU002, CU004, CU008]。
