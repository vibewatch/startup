        title: 已命名客户部署、持久性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Epic 的基础设施企业和商业采用由知名生产部署支撑，但平台集中度和监管阻力削弱其持久性 [CU003, CU005, CU006, CU009]。在企业技术领域，Epic 与 Amazon Web
              Services 密切合作支撑全球实时服务多人基础设施，在玩家并发高峰期将 Amazon EC2 计算容量动态扩展至三十倍，并为 Fortnite 服务器区域部署 AWS Local Zones
              [CU009]。在品牌娱乐领域，Lego Group 与 Epic 合作开发面向家庭的虚拟世界，将儿童安全框架集成进数字游戏环境 [CU006]。同样，Storyworthy Studios
              等创意代理机构执行生命周期营销框架，推动 Unreal Engine、Twinmotion 和 MetaHuman 的创作者采用及月活跃用户增长
              [CU003]。尽管已有这些部署，客户留存和持久性仍面临严重集中度风险 [CU002, CU004, CU010]。Epic 仍极度依赖 Fortnite，后者产生约 $6 billion 年收入并拥有 110
              million 月活跃玩家；如果品牌参与度走弱，公司将面临重大暴露 [CU002, CU004]。此外，消费者信任和留存还受到 $520 million FTC
              和解、儿童隐私及无意暗黑计费、加州州法院成瘾诉讼，以及与 Apple、Google 持续的应用商店抽成争议影响 [CU010, CU011, CU012]。
