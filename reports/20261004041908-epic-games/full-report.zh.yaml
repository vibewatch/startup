      - number: '4.2'
        title: 已发布条款偏向采用，而非评估利润空间
        blocks:
          - type: paragraph
            body: >-
              Epic 官方分发页面声称可触达 187 个国家的超过 295 million 用户，并支持超过 80 种付款方式和 43 种货币。页面还称，Epic 处理的付款免收 Unreal Engine
              版税；选择性加入的独家计划则在前六个月向开发者提供 100% 净收入分成。二级来源描述标准商店抽成 12%，以及产品收入超过 $1 million 后收取 5% Unreal
              版税。这些是清单式计划机制，而非实际实现的定价：证据没有披露折扣、退款、欺诈、支付成本、免费游戏补贴、独家保证、GMV 或有效净抽成。
