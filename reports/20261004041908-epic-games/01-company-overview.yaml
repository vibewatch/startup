callouts:
  - calloutType: "insight"
    title: "Dual-Engine Business Model Resilience"
    body: "Epic Games maintains a structurally balanced positioning where Fortnite generates immediate consumer cash flow and massive audience engagement, while Unreal Engine, Epic Online Services, and Fab provide sticky, enterprise-grade developer infrastructure that insulates the company from typical video game release cycle volatility."
    claimRefs:
      - "CO001"
      - "CO003"
  - calloutType: "risk"
    title: "Live-Service Concentration and Cost Rigidity"
    body: "Despite extensive developer tooling investments, consumer monetization remains heavily dependent on Fortnite engagement. Recent operational restructuring, mode discontinuations, and headcount cutbacks highlight the margin vulnerability of supporting broad live-service scale when peak player engagement moderates."
    claimRefs:
      - "CO006"
      - "CO010"
