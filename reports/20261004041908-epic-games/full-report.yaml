              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Oversight and Youth Design Vulnerability
            body: >-
              The convergence of the FTC consent order governing minor privacy and dark patterns with pending California
              state court youth addiction lawsuits represents Epic's most acute reputational and operational hazard. Any
              judicial determination classifying Fortnite's progression and virtual currency loops as tortiously harmful
              could force fundamental game monetization redesigns.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Platform Asymmetry and Mobile Gatekeeper Headwinds
            body: >-
              Despite historic antitrust court victories curbing Apple's anti-steering rules and establishing Google's
              monopolistic store conduct, mobile gaming distribution remains economically frictionless only for
              incumbent platform operators. Epic continues to absorb heavy legal and technical overhead to distribute
              through alternative storefronts.
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Epic Games centers on its differentiated position as both a premier
              live-service gaming publisher and a foundational real-time 3D creation infrastructure provider through
              Unreal Engine [CV001, CV002]. With over $8.1 billion in cumulative capital raised from top-tier strategic
              partners including Sony, KIRKBI, and The Walt Disney Company, Epic has established unmatched brand equity
              and technical integration spanning gaming, digital entertainment, and virtual production [CV003, CV004].
              Unreal Engine's expanding presence in non-gaming verticals—such as virtual film sets, automotive
              visualization, and architectural simulation—provides a durable high-margin enterprise software opportunity
              that complements consumer gaming cash flows [CV002, CV005]. Furthermore, Epic's aggressive antitrust
              litigation against Apple and Google has begun unlocking alternative mobile distribution avenues, notably
              in the European Union, which could eventually yield higher developer net receipts and expand mobile
              storefront monetization [CV006, CV007].


              Conversely, the anti-thesis highlights severe commercial concentration, multiple compression, and
              operational friction. Fortnite accounts for the vast majority of consumer revenues, exposing overall
              corporate cash flow to player fatigue, seasonal volatility, and engagement decline [CV001, CV008]. In
              March 2026 internal communications, leadership conceded that spending exceeded earnings during periods of
              moderated Fortnite engagement, underscoring ongoing fixed-cost burdens across live operations, server
              infrastructure, and developer revenue-share programs [CV008]. Concurrently, Epic faces persistent
              regulatory and legal friction, including compliance under its $520 million FTC settlement regarding dark
              patterns and youth privacy, as well as ongoing state-level youth gameplay addiction litigation
              consolidated in California [CV007, CV009, CV010]. Without audited multi-year GAAP financial statements and
              detailed segment profitability disclosures, public evidence cannot verify that non-gaming software
              licensing margins are sufficient to offset consumer gaming volatility [CV005, CV011].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.2'
        title: Capitalization History, Private Multiples, and Pricing Context
        blocks:
          - type: paragraph
            body: >-
              Epic Games' private equity capitalization trajectory illustrates extreme multiple expansion through the
              2020–2022 digital entertainment boom followed by sharp multiple contraction [CV003, CV004, CV012]. In
              April 2022, Epic completed a $2.0 billion financing round backed equally by Sony and KIRKBI at a per-share
              price of $930, establishing a peak private post-money valuation of $31.5 billion—representing
              approximately 5.5x on recorded revenue of $5.7 billion [CV004, CV012, CV013]. However, subsequent
              financing marked a significant reset. In February 2024, The Walt Disney Company committed $1.5 billion for
              an approximate 9% strategic equity stake to co-develop an entertainment universe, pricing Epic shares at
              $600 each and establishing a valuation marked between $17.0 billion and $22.5 billion (implied 3.0x–3.9x
              trailing revenue multiple) [CV001, CV004, CV008, CV012].


              Secondary marketplace data reflects further private market discounting. As of May 18, 2026, the Forge
              Price for Epic Games was marked at $399.02 per share, corresponding to an implied equity valuation of
              $14.96 billion—substantially below the $600 per-share level of Disney's 2024 investment and less than half
              of the $930 per-share peak reached in 2022 [CV001, CV014]. Because Epic remains a privately controlled
              corporation dominated by founder and CEO Tim Sweeney (holding ~41.4% voting equity), minority secondary
              investors face structural entry hurdles, including lack of standard public liquidity, potential preference
              overhang from strategic corporate tranches, and complete absence of audited public quarterly financials
              [CV001, CV003, CV012]. On available evidence, secondary marks near $15 billion reflect realistic
              risk-adjusted pricing, whereas entry at or near prior $23B–$31.5B primary marks remains unsupportable.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario Analysis, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Epic Games requires assessing three divergent operational trajectories spanning bull, base, and
              bear outcomes [CV001, CV008, CV011]. The base case models Epic stabilizing annual revenue around
              $5.8B–$6.2B, driven by steady Fortnite live-service seasonality, modest Unreal Engine enterprise adoption,
              and controlled operating expenditures, supporting an equity valuation range of $16.0B–$20.0B (2.7x–3.3x
              revenue multiple) [CV001, CV012]. The bull case contemplates accelerated adoption of Unreal Engine across
              media and industrial enterprise clients, breakout monetization from the Disney entertainment ecosystem,
              and favorable global mobile app store fee reform, unlocking an equity valuation recovery to $26.0B–$32.0B
              (4.3x–5.2x multiple) [CV001, CV004, CV006]. Conversely, the bear scenario accounts for persistent
              live-service decay in Fortnite, escalating compliance and legal settlement liabilities, and sustained
              loss-making operations across the Epic Games Store, compressing valuation to $10.0B–$13.0B (1.8x–2.3x
              multiple) [CV008, CV009, CV014].


              From an exit readiness perspective, Epic Games has demonstrated no formal preparation for an initial
              public offering (IPO), retaining a late-stage private structure with concentrated strategic partners
              [CV001, CV003]. Investors considering late-stage private equity or secondary transactions must establish
              strict diligence kill criteria before committing capital [CV001, CV011]. Key diligence requirements
              include: (1) multi-year audited GAAP segment financial statements isolating gross margins and EBITDA
              across Fortnite, Unreal Engine, Epic Games Store, and Epic Online Services; (2) cap table details
              disclosing liquidation preferences, redemption rights, and seniority terms across Sony, KIRKBI, and Disney
              investments; (3) independent monthly active user (MAU) and average revenue per user (ARPU) trends across
              Fortnite creative and core Battle Royale modes; and (4) exhaustive reserves and risk assessments
              concerning ongoing California youth gameplay class action litigation [CV005, CV009, CV011].
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Stance: Maintain Research-More Posture Pending Audited Segment Financials'
            body: >-
              While Epic Games possesses premier technological assets in Unreal Engine and strategic institutional
              backing from Disney and Sony, current private-market pricing indicates severe multiple contraction. Given
              live-service concentration in Fortnite, recurring operational expense pressures, and pending class action
              litigation, investors should reject historical $23B–$31.5B equity marks and maintain a research-more
              posture until full GAAP segment financials and cap table liquidation structures are disclosed.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV011
              - CV014
          - type: callout
            title: 'Valuation Risk: Secondary Multiple Compression vs. Primary Strategic Marks'
            body: >-
              The divergence between secondary pricing indicators ($14.96 billion Forge Price as of May 2026) and
              previous corporate strategic marks ($22.5 billion Disney round in 2024 and $31.5 billion peak in 2022)
              highlights material downside valuation risk for non-strategic investors lacking structural downside
              preferences.
            calloutType: risk
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV012
              - CV014
