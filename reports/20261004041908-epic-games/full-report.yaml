  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Stance
      - Pillar
      - Core Argument
      - What Would Change The View
    rows:
      - - Thesis
        - Real-Time 3D Engine Dominance
        - >-
          Unreal Engine serves as indispensable infrastructure for high-fidelity gaming and non-gaming virtual
          production.
        - Evidence of developer defection to proprietary engines or commoditization from rival platforms.
      - - Thesis
        - Strategic Ecosystem Partnerships
        - >-
          Deep strategic backing and IP co-development commitments from Disney, Sony, and KIRKBI/LEGO expand total
          reach.
        - Cancellation or prolonged monetization delays of the collaborative Disney entertainment universe.
      - - Thesis
        - Mobile App Store Disruption
        - >-
          Antitrust court victories and EU DMA compliance enable third-party mobile store distribution and lower take
          rates.
        - >-
          App store operators maintaining defensive fee architectures that eliminate margin advantages for alternative
          storefronts.
      - - Anti-Thesis
        - Fortnite Revenue Concentration
        - Vast majority of company cash flow relies on a single live-service title subject to engagement fatigue.
        - >-
          Audited multi-year disclosures demonstrating Unreal Engine and store revenue contribute >50% of operating
          profit.
      - - Anti-Thesis
        - Private Market Valuation De-Rating
        - Valuations have fallen from $31.5B in 2022 to $17B-$22.5B in 2024 and $14.96B on secondary markets in 2026.
        - A priced institutional primary financing round completed above $30B with non-strategic participants.
      - - Anti-Thesis
        - Legal and Regulatory Overhead
        - >-
          Compliance costs under the $520M FTC dark patterns consent decree and exposure to California youth gameplay
          litigation.
        - Formal dismissal or capped global settlement of all pending youth addiction and dark pattern proceedings.
    notes: Pillars derived from recorded corporate announcements, regulatory filings, and secondary market analysis.
