        - date: '2017'
          label: Fortnite Battle Royale Debut
          detail: >-
            Launch of Fortnite Battle Royale transforms company scale into a worldwide cultural and live-service
            phenomenon.
          claimRefs:
            - CO004
        - date: '2018'
          label: Epic Games Store Introduction
          detail: Launch of the PC distribution storefront offering developers an 88/12 revenue share model.
          claimRefs:
            - CO003
        - date: '2022'
          label: $2.0B Series F Capitalization
          detail: Kirkbi and Sony invest $2 billion, benchmarking Epic's post-money equity valuation at $31.5 billion.
