        - date: '1991'
          label: Founding as Potomac Computer Systems
          detail: Tim Sweeney establishes the studio in Maryland, publishing ZZT before rebranding as Epic MegaGames.
          claimRefs:
            - CO002
        - date: '1998'
          label: Unreal Engine Launch
          detail: Commercial release of Unreal and inaugural licensing of the Unreal Engine 3D technology.
          claimRefs:
            - CO003
        - date: '1999'
          label: Headquarters Consolidation
          detail: Studio centralizes development operations in Cary, North Carolina, adopting the Epic Games moniker.
          claimRefs:
            - CO002
        - date: '2012'
          label: Tencent Strategic Investment
          detail: Tencent acquires a minority stake to accelerate Epic's transition toward games-as-a-service.
          claimRefs:
