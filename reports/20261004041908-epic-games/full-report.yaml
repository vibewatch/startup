  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment / Rating
      - Key Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - >-
          Extreme valuation opacity, lack of audited financials, and Fortnite revenue concentration offset ecosystem
          strengths.
        - Withhold new growth capital; track secondary discount developments and audited operational disclosures.
      - - Confidence
        - medium
        - >-
          Documented primary rounds from Sony, Kirkbi, and Disney corroborate history, but segment profitability is
          undisclosed.
        - Require verified financial and cap table disclosures before moving to actionable underwriting.
      - - Risk Rating
        - high
        - >-
          Concentration in live-service gaming, $520M FTC settlement, and ongoing youth gameplay class action
          litigation.
        - Structure downside protections, valuation ratchets, or liquidation preference seniority.
      - - Valuation Stance
        - expensive
        - Historical $31.5B peak and $22.5B strategic marks exceed current secondary market pricing ($14.96B on Forge).
        - Reject entry at historical primary valuations; negotiate at or below prevailing secondary pricing levels.
    notes: >-
      Recommendation and stance reflect synthesis of primary investment data from Disney/Sony, secondary market marks
      from Forge Global, and litigation disclosures.
