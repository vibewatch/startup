company:
  name: "Epic Games"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence explains Epic Games' multi-product monetization architecture but does not support a current, audited view of revenue, margins, cash burn, debt, or runway. Official distribution terms and reach claims show commercial scale; secondary revenue and valuation figures remain estimates, while layoffs, customer-service complaints, litigation allegations, and a pending FTC matter add costs that cannot be quantified from the assigned evidence."
sections:
  - id: "revenue-architecture"
    title: "Revenue Architecture Is Broad, but Mix Is Opaque"
    body: "Epic Games has three evidenced monetization pillars: purchases inside its own games, Unreal Engine licensing or royalties, and Epic Games Store distribution fees. Two independent secondary sources describe that architecture, while Epic's developer surface confirms that the broader ecosystem combines creation tools, content, services, and distribution. The model can diversify revenue across players and developers, but the assigned evidence provides no current segment mix, recognized-revenue policy, or audited contribution by product. Historical figures from FourWeekMBA show that reported revenue fell from more than $5.6 billion in 2018 to $4.2 billion in 2019 as reinvestment tightened margins; those old figures illustrate volatility, not a current run rate."
    claimRefs:
      - "CI005"
      - "CI008"
      - "CI016"
    tableRefs:
      - "TI001"
  - id: "distribution-economics"
    title: "Published Terms Favor Adoption, Not Underwritten Margin"
    body: "Epic's official distribution page claims access to more than 295 million users in 187 countries and payment support for more than 80 methods and 43 currencies. It also states that Unreal Engine royalties are waived on Epic-processed payments and that an opt-in exclusivity program offers developers 100% net revenue share for the first six months. Secondary sources describe a 12% standard store take and a 5% Unreal royalty above a $1 million product-revenue threshold. These are list-program mechanics rather than realized pricing: the evidence does not disclose discounting, refunds, fraud, payment costs, free-game subsidies, exclusivity guarantees, GMV, or effective net take."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "capital-and-unit-economics"
    title: "Capital Access Is Evidenced; Capital Adequacy Is Not"
    body: "Tracxn reports $8.13 billion raised across nine rounds, including a latest $1.5 billion round in February 2024. That financing history demonstrates access to strategic capital but is not evidence of current cash availability: cumulative funding can be spent, invested, or offset by obligations. Multiples presents a $5.7 billion 2024 revenue estimate and a $23 billion valuation, implying 3.9x revenue, while explicitly noting that no source states revenue or ARR in the round context. The chapter therefore treats those figures as low-confidence estimates, not audited performance. Current cash, debt, preferences, burn, runway, working capital, capex, gross margin, CAC, and payback remain unavailable."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial Verdict: Monetization Is Legible; Cash Generation Is Not"
    body: "The revenue model has attractive structural features: a large claimed distribution base, multiple payment rails, developer-facing engine economics, and a store that can connect engine adoption with distribution. Yet no assigned source establishes current consolidated revenue, segment margins, EBITDA, free cash flow, or liquidity. Cost and liability signals also require caution. A plaintiff law firm's April 2026 update reports more than 1,000 layoffs in March and describes active addiction allegations; Trustpilot's fetched review sample contains repeated support, login, refund, and launcher complaints; and the FTC lists matter 1923203 as pending as of June 25, 2025. None provides a quantified liability, but together they reinforce the need for audited data and contingent-liability schedules before underwriting."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
callouts:
  - calloutType: "risk"
    title: "Funding Raised Is Not Cash Available"
    body: "The reported $8.13 billion cumulative funding figure establishes historical financing access only. It cannot be used as a proxy for current liquidity, burn, runway, debt capacity, or funds available for new investment without a current balance sheet and cash-flow statement."
    claimRefs:
      - "CI009"
  - calloutType: "recommendation"
    title: "Gate Underwriting on Data-Room Financials"
    body: "Require audited consolidated and segment financials, monthly cash and burn, debt and preference schedules, store GMV and effective take rate, Unreal royalty revenue, and Fortnite payer cohorts before assigning a cash-flow-based valuation."
    claimRefs:
      - "CI010"
      - "CI011"
