companyProfile:
  summary: >-
    Epic Games is a private interactive entertainment and developer-platform company built around Fortnite, Unreal
    Engine, Epic Games Store, and Epic Online Services. The business combines consumer live-service monetization, engine
    licensing and royalties, storefront distribution fees, and strategic ecosystem partnerships, while remaining
    controlled by founder Tim Sweeney and funded through large strategic rounds from Sony, Kirkbi, and Disney.
