callouts:
  - calloutType: "insight"
    title: "Dual Engine-Platform Flywheel with Heavy Infrastructure Interdependence"
    body: "Epic's technical moat lies in dogfooding: Fortnite acts as the hyper-scale proving ground for Unreal Engine, UEFN, and Epic Online Services before capabilities are packaged for third-party commercial developers. However, managing this dual consumer-enterprise architecture creates massive operational complexity, requiring hybrid edge infrastructure to sustain tens of millions of concurrent sessions while navigating heightened global regulatory scrutiny around youth data and digital commerce."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE007"
      - "CE010"
