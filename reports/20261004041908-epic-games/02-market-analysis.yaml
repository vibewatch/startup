    rows:
      - [Consumer games, "Player spending on Epic-developed games and in-game content", "Hardware and spending on unaffiliated games", "Players and households", "Direct monetization and engagement base"]
      - [Digital game distribution, "Third-party game and in-game transactions routed through Epic Games Store", "Transactions completed solely on rival stores", "Publishers fund the platform through revenue share", "Store take rate and strategic distribution control"]
      - [Real-time 3D engines, "Royalties and paid tools associated with Unreal Engine projects", "Internal-engine development with no Epic payment", "Studios and publishers", "Software economics and ecosystem adoption"]
      - [Creator economy, "Fortnite net revenue allocated by engagement and related creator commerce", "Creator activity with no Epic platform connection", "Players fund content; Epic allocates creator payouts", "Content supply, retention, and platform depth"]
      - [Online services, "Cross-platform account, game, and store services supporting Epic adoption", "General cloud infrastructure and unrelated middleware", "Developers and publishers; reviewed service is free", "Adoption enabler rather than a separately sized revenue pool"]
    notes: "Boundary is analyst-defined from the retained product evidence; categories overlap, are not additive, and do not constitute audited Epic segment reporting."
    claimRefs: [CM001, CM011, CM012, CM013, CM014]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [Publisher and lens, Period, Geography, Value, CAGR, Methodology, Confidence, Limitation]
    rows:
      - ["Contrary Research - video games", "2024 actual/estimate", Global, "$299B revenue", "Not stated", "Third-party market estimate", Medium, "Broad category includes spend Epic cannot capture"]
      - ["Contrary Research - video games", "2030 forecast", Global, "$600B revenue", "Not stated", "Third-party forecast", Low, "Forecast methodology is not disclosed in the fetched text"]
      - ["Contrary Research - mobile gaming", "2024 actual/estimate", Global, "More than $175B revenue", "Not stated", "Third-party market estimate", Medium, "Component of the broader games total; not additive"]
      - ["Contrary Research - game engines", "2025 estimate", Global, "$3.1B market", "Not stated", "Third-party market estimate", Medium, "Does not isolate Epic-addressable spend"]
      - ["Contrary Research - game engines", "2030 forecast", Global, "$8.3B market", "Not stated", "Third-party forecast", Low, "Forecast methodology is not disclosed in the fetched text"]
      - ["Contrary Research - Epic Games Store", "2025 estimate", Global, "$1B PC game sales", "Not stated", "Reported platform sales comparison", Low, "Sales are not Epic revenue and exclude other Epic businesses"]
    notes: "All values are third-party figures preserved with their stated period and denominator; no CAGR was calculated, and the rows must not be summed into TAM."
    claimRefs: [CM002, CM003, CM004, CM005, CM007]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Fortnite, "Player or household", Player, "Player or household", "Play free; optionally buy content or passes", "Household entertainment spend", "Social participation, new content, and cross-platform access"]
      - [Fortnite creator ecosystem, Creator, "Creator and player audience", "Epic allocates a share of Fortnite net revenue", "Build experiences in UEFN and earn by engagement", "Epic platform economics", "Access to a large audience and creator payout pool"]
      - [Unreal Engine, "Studio or publisher", "Developers and artists", "Project owner after commercial success", "Build and ship real-time 3D projects", "Technology or production leadership", "High-end capability with low upfront cost"]
      - [Epic Games Store, Publisher, "Publishing and commerce teams", "Publisher through revenue share", "List, distribute, and monetize a title", "Distribution and publishing leadership", "Lower platform take rate and promotional reach"]
      - [Epic Online Services, "Developer or publisher", "Engineering and live-operations teams", "No separate fee in reviewed evidence", "Add accounts, matchmaking, cross-play, and operations services", "Engineering or live operations", "Reduced cross-platform implementation friction"]
    notes: "Budget ownership and workflow are analytical mappings from the retained product evidence; enterprise procurement amounts, sales cycles, and conversion rates remain undisclosed."
    claimRefs: [CM001, CM008, CM011, CM012, CM013, CM014]
figures:
  - id: FM001
    title: Six non-additive market and capture lenses
    type: pyramid
    summary: >-
      Broad category values narrow toward Epic-specific scale indicators, but mixed
      units and missing overlap data prevent a proportional TAM-to-SOM conversion.
    data:
      items:
        - label: Global video games market
          value: 299
          unit: "USD billions, 2024"
          detail: "Broad spending envelope; includes revenue Epic cannot capture."
        - label: Global mobile gaming
          value: 175
          unit: "USD billions, 2024 lower bound"
          detail: "Source says revenue exceeded this value; it is part of, not additional to, global games."
        - label: Global game-engine market
          value: 3.1
          unit: "USD billions, 2025"
          detail: "Third-party estimate with no Epic-specific addressability split."
        - label: Projected game-engine market
          value: 8.3
          unit: "USD billions, 2030"
          detail: "Forecast with methodology absent from the fetched text."
        - label: Fortnite registered users
          value: 650
          unit: "millions, August 2025"
          detail: "User scale, not paying users, revenue, or a deduplicated market population."
        - label: Epic Games Store PC game sales
          value: 1
          unit: "USD billion, 2025"
          detail: "Third-party sales estimate; sales are not Epic revenue."
    approximationNotes: >-
      Values are reproduced from Contrary Research without interpolation. The
      items use mixed units and periods, are not additive, and are not displayed
      as a proportional TAM/SAM/SOM calculation.
    claimRefs: [CM002, CM004, CM005, CM007, CM008, CM011]
