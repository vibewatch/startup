  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Categorization, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for quantum computing divides sharply between near-term Noisy Intermediate-Scale
              Quantum (NISQ) systems and utility-scale Fault-Tolerant Quantum Computing (FTQC). PsiQuantum explicitly
              excludes noisy intermediate-scale hardware from its commercial product scope, focusing capital and
              engineering exclusively on achieving utility-scale FTQC requiring approximately one million physical
              qubits. Current commercial spend in quantum computing remains heavily weighted toward cloud-hosted
              prototype access, exploratory enterprise proof-of-concepts, and academic research grants. In contrast,
              utility-scale FTQC seeks to absorb high-performance computing budgets currently dedicated to classical
              supercomputing clusters running density functional theory, molecular dynamics simulations, Monte Carlo
              risk engines, and complex discrete optimization routines. The primary status-quo substitute for
              PsiQuantum's planned platform is not alternative quantum hardware, but dense classical high-performance
              computing clusters accelerated by GPUs and specialized accelerators, alongside emerging quantum-inspired
              tensor network algorithms. Until fault-tolerant hardware achieves demonstrable computational advantage on
              industrially relevant problem instances, classical simulation architectures retain an overwhelming
              structural cost and software-ecosystem advantage.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: Market Sizing Projections and Divergent Valuation Lenses
        blocks:
          - type: paragraph
            body: >-
              Estimates of total quantum computing market opportunity exhibit substantial variance across industry
              analysts, reflecting differing assumptions regarding the timeline to commercial fault tolerance. Market
              sizing studies project the broader quantum technology sector to expand from approximately $750 million in
              2025 toward $16 billion to $37 billion by 2030, with long-term forecasts reaching $198 billion by 2040 as
              fault-tolerant commercial utility materializes across chemicals, life sciences, finance, and mobility.
              However, these top-down figures conflate multiple underlying market segments, including sensing,
              communications, hardware components, and software services. From an operational perspective, PsiQuantum's
              immediate serviceable addressable market through 2027 is bounded by specialized government defense,
              intelligence, and sovereign capability initiatives—exemplified by its $620 million ($940 million AUD)
              Commonwealth and Queensland co-investment in Brisbane and its anchor development project at the Illinois
              Quantum and Microelectronics Park in Chicago. Private enterprise commercial software and hardware service
              spending represents a secondary expansion phase contingent upon physical demonstration of the Omega
              silicon photonic chipset and Cryogenic datacenter packaging.
            claimRefs:
              - CM005
