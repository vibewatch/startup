  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Stakeholder Architecture
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's customer and counterparty landscape fundamentally diverges from conventional enterprise
              software or hardware business models (CU001). Because utility-scale fault-tolerant quantum computing
              (FTQC) hardware remains under multi-year construction across facilities in Brisbane, Australia and
              Chicago, Illinois, the company has no general-availability hardware product deployed in production
              customer datacenters (CU002). Instead, customer engagements are stratified across three distinct tiers:
              sovereign defense and economic development authorities, national research laboratories, and Fortune 500
              enterprise algorithm co-design partners (CU003). Sovereign sponsors represent the primary financial
              counterparty base today, providing anchor funding and infrastructure site subsidies under national
              strategic mandates (CU004). Enterprise commercial clients engage primarily through joint research
              initiatives in computational chemistry, battery materials, aerodynamics, and logistics, collaborating on
              fault-tolerant algorithm development rather than procuring commercial quantum compute capacity (CU005).
              The strategic buyer in these enterprise organizations is typically the Chief Technology Officer, Head of
              R&D, or Advanced Computing Director, whereas government agencies are motivated by national technological
              sovereignty and supply-chain security.
            claimRefs:
