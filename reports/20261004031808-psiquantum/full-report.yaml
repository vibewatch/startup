  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Independent validation of integrated fault-tolerant performance; site milestones hold; commercial demand
          becomes contractible
        - Value above $10.5B is considered only after evidence supports a premium to the May 2026 reported mark
        - Scale-up, schedule, and customer-conversion risk
        - External system validation plus signed, economically meaningful demand
      - - Base
        - Engineering and site work progress, but commercialization and liquidity remain unproven
        - >-
          $7B-$10.5B is an anchor band for entry discipline, not an intrinsic-value estimate; target return remains
          uncalculated
        - Additional dilution, preference overhang, leadership execution, and delayed revenue
        - Verified milestones without enough evidence to support a premium or assign an exit
      - - Bear
        - Integration or schedule underperforms, new capital is required, or liquidity remains unavailable
        - >-
          Below $7B or impaired liquidity; downside cannot be bounded without preferences, cash needs, and ownership
          data
        - Down round, recapitalization, milestone reset, and multiple compression
        - Missed technical milestones, financing stress, or continuing absence of commercial proof
    notes: >-
      Scenario bands are decision thresholds anchored to reported financing marks, not probability-weighted forecasts;
      no numeric probabilities are assigned without operating and security-level data.
    claimRefs:
      - CV002
