              government co-investments and sovereign industrial partnerships. The Brisbane deployment is heavily
              financed by an A$940 million package from the Australian Commonwealth and Queensland governments, while
              the Chicago facility anchors a state-backed multibillion-dollar, 128-acre quantum campus supported by
