        - Semiconductor manufacturing may offer a scalable path
        - Company reports standard 300mm wafers, more than one million devices tested, and a 45nm node
        - Independent wafer-yield, packaging-yield, and reliability data at system-relevant scale
      - - Thesis
        - Planned utility-scale sites create concrete deployment pathways
        - Company identifies Brisbane and Chicago as its first planned sites
        - Auditable construction, commissioning, logical-qubit, uptime, and customer milestones
      - - Anti-thesis
        - Component integration can delay deployment and increase capital needs
        - Sacra flags source, detector, and optical-switch integration at massive scale as a manufacturing risk
        - Third-party evidence that integrated performance clears error-correction and operating thresholds
      - - Anti-thesis
        - Governance and commercialization are being tested simultaneously
        - An interim CEO was appointed during the transition toward large-scale deployment
        - Permanent leadership, disclosed operating plan, and contracted commercial demand
