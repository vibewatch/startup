      - number: '5.3'
        title: Construct Software Platform, Ecosystem Integrations, and Site Execution
        blocks:
          - type: paragraph
            body: >-
              To bridge customer workflows into fault-tolerant execution, PsiQuantum launched Construct, a quantum
              software platform and SDK providing visual quantum circuit design, Python optimization tools, and resource
              estimation for fault-tolerant algorithms. The platform supports early application exploration with
              industrial partners including Airbus, Lockheed Martin, Mercedes-Benz, Boehringer Ingelheim, and Mitsubishi
              Chemical, as well as academic collaborations with Brookhaven National Laboratory. Physical deployment
              centers on the Alpha System testing facility in Milpitas, California, alongside utility-scale facility
              groundbreakings in Brisbane, Australia, and Chicago, Illinois. Interim leadership under CEO Victor Peng
              prioritizes transitioning from foundry process development to systems integration, though complete
              fault-tolerant quantum algorithms cannot run on hardware until the entire integrated stack achieves
              threshold error rates.
            claimRefs:
              - CE010
