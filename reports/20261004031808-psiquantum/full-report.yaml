              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Probabilistic Gate Overhead and Optical Switch Losses
            body: >-
              Unlike matter-based qubits where two-qubit operations can be deterministic, linear-optics quantum
              computing suffers from inherent photon generation non-determinism with raw gate failure rates of 25% to
              50%. While spatial and temporal multiplexing mitigate raw loss, the required barium titanate (BTO) optical
              switches introduce insertion loss that consumes the majority of the system's fault-tolerance budget.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Commercial Semiconductor Fab Leverage and Thermal Independence
            body: >-
              By fabricating its Omega chipset at GlobalFoundries' Fab 8 and leveraging standard telecom optical fiber
              for inter-cabinet networking without quantum transduction, PsiQuantum avoids custom laboratory
              manufacturing bottlenecks and scales past the single-cryostat physical limits of superconducting
              architectures.
            calloutType: strength
            claimRefs:
              - CE002
