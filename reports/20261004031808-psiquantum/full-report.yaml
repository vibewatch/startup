  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Fault-Tolerant Architecture and the Million-Qubit Photonic Bet
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum approaches quantum computing on the foundational premise that commercial utility requires fault
              tolerance, necessitating approximately one million physical qubits to execute quantum error correction
              (QEC) codes. Rather than pursuing noisy intermediate-scale quantum (NISQ) systems with superconducting
              transmons or trapped ions, the company relies on single-photon optical qubits. Photons exhibit zero
              susceptibility to thermal degradation and electromagnetic interference, allowing control electronics to
              sit close to optical qubits without the massive dilution refrigeration infrastructure typical of
              matter-based qubits. However, because linear optics gate operations are inherently probabilistic with
              failure rates between 25% and 50%, the architecture consumes an extensive share of its QEC budget purely
              mitigating gate non-determinism via spatial and temporal multiplexing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
