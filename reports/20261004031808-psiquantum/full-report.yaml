      - number: '8.3'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Independent sources report that PsiQuantum raised $1.0 billion at a $7.0 billion valuation in September
              2025 and a further $1.5 billion at a $10.5 billion valuation in May 2026. The later mark is a 50% step-up
              in eight months, but funding raised is not cash available and the sources do not disclose the later
              round's liquidation preferences, dilution, debt, or other senior claims. Separately, the Forge data
              displayed by Yahoo Finance indicates a $27 derived price and $4.6 billion estimated valuation as of
              October 2, 2026. The roughly 56% gap between that estimate and the reported May round mark is a signal to
              investigate, not proof of a tradable discount: Forge explicitly states that the price may rely on limited
              data and does not indicate supply or demand.
