      - number: '8.4'
        title: Scenarios, Comparable Context, and Diligence Triggers
        blocks:
          - type: paragraph
            body: >-
              A milestone-based framework is more defensible than revenue multiples because no retained source
              establishes current revenue, margins, or contracted backlog. The bull case requires independent system
              validation and commercial demand before assigning value above the $10.5 billion reported round mark. The
              base case uses the $7.0 billion and $10.5 billion financing marks only as an entry-discipline band, not as
              appraised fair value. The bear case allows value below $7.0 billion or impaired liquidity if integration,
              schedule, or financing risks crystallize. Sacra's report of sharp drawdowns in public quantum pure-plays
              reinforces multiple-compression risk but is not a like-for-like benchmark because architectures, maturity,
              and capital structures differ. A target return, hold period, and exit path remain ununderwritable without
              instrument terms, ownership data, cash needs, and credible liquidity timing.
