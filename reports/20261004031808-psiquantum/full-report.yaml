  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Quantum Computing Landscape and Modality Architecture
        blocks:
          - type: paragraph
            body: >
              The quantum computing hardware landscape is fragmented across fundamentally divergent physical qubit
              modalities, each navigating distinct engineering trade-offs between physical gate fidelity, environmental
              isolation, interconnectivity, and industrial manufacturing scalability [CP001, CP005]. Incumbent
              technology giants including International Business Machines (IBM) and Alphabet's Google Quantum AI have
              focused primarily on superconducting transmon circuits, deploying noisy intermediate-scale quantum (NISQ)
              processors to enterprise clients via cloud platforms [CP007]. Concurrently, publicly traded pure-play
              competitor IonQ pursues trapped-ion architectures that boast superior two-qubit gate fidelities and
              all-to-all connectivity, albeit constrained by slower gate operation speeds and complex laser-steering
              scaling bottlenecks [CP007]. In contrast to these matter-based approaches, PsiQuantum was founded on the
              architectural thesis that commercially valuable quantum computing strictly requires quantum error
              correction (QEC) operating across approximately one million physical qubits, rendering intermediate
              non-error-corrected hardware commercially unviable [CP001, CP002, CP006]. To bypass the scaling limits of
              bespoke laboratory cryostats, PsiQuantum leverages silicon photonics fabricated on standard commercial
              semiconductor lines at GlobalFoundries, transmitting photonic qubits via optical waveguides and
              conventional telecom fiber [CP002, CP004, CP006]. However, this approach trades matter-qubit stability for
              severe probabilistic gate challenges: photons do not naturally interact with each other, necessitating
              measurement-based fusion gates that succeed probabilistically, demanding massive physical photon
              redundancy and extreme timing synchronization within femtoseconds [CP002]. Meanwhile, hyperscalers like
              Microsoft pursue dual-track strategies, advancing in-house topological quantum research while distributing
              external hardware through Azure Quantum and securing minority equity stakes in photonic entrants like
              PsiQuantum [CP005, CP007].
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
