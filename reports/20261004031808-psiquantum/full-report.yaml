  - id: FE001
    title: PsiQuantum Photonic FTQC Architecture Stack
    type: stack
    summary: >-
      Layered representation of PsiQuantum's fault-tolerant quantum computing architecture from application software
      down to commercial semiconductor foundry manufacturing.
    data:
      layers:
        - label: Application & Software Layer
          detail: Construct platform, Python QDK, circuit design, and resource estimation tools for enterprise algorithms.
        - label: Quantum Error Correction (QEC) Layer
          detail: Syndrome decoding and logical qubit compilation designed to correct probabilistic gate errors.
        - label: Optoelectronic Networking Layer
          detail: Standard telecom fiber interconnects distributing optical qubits between cabinets with 99.7% fidelity.
        - label: Cryogenic Rack Infrastructure
          detail: Linde 2–4K cryoplant cooling modular cabinets housing ~250 photonic chips and colocated control electronics.
        - label: Electro-Optic Switching Layer
          detail: Barium titanate (BTO) thin-film switches enabling low-power nanosecond routing and multiplexing.
        - label: Integrated Photonic Hardware Layer
          detail: Omega silicon photonics and waveguide circuits fabricated at GlobalFoundries and SkyWater fabs.
    approximationNotes: Logical architectural breakdown based on published technical papers and executive disclosures.
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: PsiQuantum Customer and Partner Adoption Journey
    type: journey-map
    summary: >-
      Multi-stage institutional progression from initial sovereign co-investment to enterprise co-design, software
      access, and future utility-scale compute.
    data:
      items:
        - label: 'Phase 1: Sovereign & Strategic Anchor'
          detail: >-
            Government agencies and defense programs commit anchor capital, grant subsidies, and industrial site
            infrastructure.
          touchpoints:
            - Bilateral state co-investments (Chicago, Moreton Bay)
            - DARPA QBI benchmarking and Commerce award
            - Site selection and semiconductor foundry capacity
          tone: positive
        - label: 'Phase 2: National Laboratory Engagement'
          detail: >-
            Government and national laboratory scientists benchmark fault-tolerant quantum algorithms on early software
            tools.
          touchpoints:
            - DOE Brookhaven National Laboratory collaboration
            - Scientific application evaluation on Construct
            - Algorithm development for high-energy physics
          tone: positive
        - label: 'Phase 3: Enterprise Algorithm Co-Design'
          detail: >-
            Fortune 500 R&D teams in aerospace, chemicals, and pharma identify intractable simulation problems and map
            fault-tolerant algorithms.
          touchpoints:
            - Direct engagement with PsiQuantum industry applications team
            - Joint algorithm formulation (chemistry, aerodynamics, materials)
            - Resource estimation for million-qubit FTQC
          tone: neutral
        - label: 'Phase 4: Construct Platform Integration'
          detail: >-
            External researchers and institutional users access secure Quantum Development Environments (QDEs) powered
            by Coder.
          touchpoints:
            - Self-hosted AWS and Kubernetes pod provisioning
            - Workbench FTQC programming framework access
            - Integration with NVIDIA CUDA-Q simulation tools
          tone: positive
        - label: 'Phase 5: Pilot Evaluation & Verification'
          detail: Academic and enterprise partners conduct algorithm optimization and compile workloads to logical gate sets.
          touchpoints:
            - Academic workshops and conference developer tracks
            - Pre-alpha software benchmarking
            - Validation of fault-tolerant algorithm efficiency
          tone: neutral
        - label: 'Phase 6: Utility-Scale Compute Monetization'
          detail: >-
            Targeted operational milestone for 2027 where commercial clients transition from simulation to live
            utility-scale photonic QPUs.
          touchpoints:
            - Online commissioning of Brisbane and Chicago systems
            - Transition from research grants to commercial compute pricing
            - Critical test of commercial retention and willingness-to-pay
          tone: warning
    approximationNotes: Illustrates institutional progression based on announced deployment roadmaps and platform capabilities.
