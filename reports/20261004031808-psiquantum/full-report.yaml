      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that PsiQuantum may convert semiconductor-scale manufacturing and modular
              photonic networking into a defensible path toward fault-tolerant quantum computing. The company says its
              platform uses standard 300mm wafers, has tested more than one million devices, and is being developed for
              planned sites in Brisbane and Chicago. Those facts establish scale intent and engineering progress, not
              commercial utility or independently verified system economics. The anti-thesis is correspondingly
              execution-heavy: Sacra identifies the integration of photon sources, detectors, and optical switches at
              massive scale as a manufacturing risk, while the February 2026 move to an interim chief executive adds
              governance-transition risk during deployment. The thesis strengthens only when external evidence validates
              yields, error-corrected operation, schedule, uptime, and customer willingness to pay.
            claimRefs:
