      - number: '7.2'
        title: Operational, Manufacturing, and Supply Chain Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              The core operational risk for PsiQuantum lies in scaling silicon photonic chipsets from pilot wafer runs
              into high-yield, high-volume production. Unlike traditional superconducting quantum architectures that
              require bespoke laboratory fabrication, PsiQuantum manufactures its Omega silicon photonic chipset at
              GlobalFoundries' Fab 8 facility in Malta, New York. While this foundries-first approach leverages
              commercial semiconductor tooling, it creates a single-point supplier dependency on GlobalFoundries for
              advanced lithography and wafer processing. Furthermore, PsiQuantum relies on specialized proprietary
              materials, specifically 300mm wafers of Barium Titanate (BTO) manufactured at its internal California
              facilities and subsequently integrated into the GlobalFoundries wafer flow to produce
              ultra-high-performance electro-optic switches. Any failure mode in wafer bonding, insertion-loss
              degradation across single-photon optical couplers, or packaging defects inside cryogenic cabinets
              operating at 2-4 Kelvin would stall hardware deployment. In addition, the company's executive governance
              is in active transition: in February 2026, co-founder Jeremy O'Brien transitioned to Executive Chairman
              while veteran semiconductor executive Victor Peng assumed the role of Interim CEO, leaving permanent
              succession open during a critical deployment cycle.
            claimRefs:
              - CR005
