  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, a high risk rating, and a stretched valuation
              stance. The reported May 2026 financing mark of $10.5 billion is a meaningful capital-market signal, but
              it is not sufficient evidence of fair value for a business whose retained public evidence does not
              disclose audited revenue, burn, runway, security terms, or a fully diluted capitalization table. Yahoo
              Finance also displays a $4.6 billion Forge estimated valuation and warns that its $27 derived price is not
              a quotation and does not indicate available supply or demand. Investors therefore cannot treat either mark
              as an executable entry or exit price. Entry should remain conditional on primary financing documents,
              preference-stack analysis, current cash data, and independently verified deployment milestones rather than
              on a generic quantum-computing premium.
