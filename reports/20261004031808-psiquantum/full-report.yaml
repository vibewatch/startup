      - number: '1.3'
        title: Industrial Milestones, Public Sector Commitments, and Deployment Roadblocks
        blocks:
          - type: paragraph
            body: >-
              The company's commercialization roadmap centers on physical deployment at two flagship hubs: Moreton Bay
              Central near Brisbane, Australia, and the Illinois Quantum and Microelectronics Park (IQMP) in Chicago,
              targeting operational utility-scale prototype systems by 2027 (CO011). In 2026, the company broke ground
              at Moreton Bay and opened an advanced test and validation laboratory at Griffith University in Brisbane,
              following earlier site work in Chicago (CO012). These physical infrastructure buildouts are supported by
              substantial non-dilutive government contracts, including a $125 million contract under DARPA's Quantum
              Benchmarking Initiative (QBI) and a finalized $100 million award from the U.S. Department of Commerce
              under the CHIPS and Science Act (CO013). Software ecosystem enablement accelerated in 2026 through the
              public release of Construct, an open-access fault-tolerant quantum computing design tool integrating
              NVIDIA CUDA-Q for GPU-accelerated simulation (CO014). Despite substantial progress, the absence of
              independent third-party verification of fault-tolerant quantum operation, coupled with complete opacity
              surrounding annual cash burn, creates material timeline and financing risks for private market investors
              (CO015).
