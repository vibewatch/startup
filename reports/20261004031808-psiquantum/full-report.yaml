      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement pathways and buyer archetypes for fault-tolerant quantum computing differ fundamentally
              between sovereign government sponsors and corporate enterprise users. Initial capital expenditure and
              facility commitments are driven by sovereign and national security buyers seeking domestic quantum
              capability, semiconductor supply-chain security, and advanced computational supremacy. In these public
              sector arrangements, budget ownership resides with federal departments of commerce, defense agencies, and
              regional economic development authorities through multi-year co-funding structures. Conversely, enterprise
              commercial adoption in pharmaceuticals, energy, and financial services follows a software-first evaluation
              path. Enterprise buyers interface with PsiQuantum primarily through early algorithm design platforms such
              as PsiQuantum Construct, alongside open-source benchmarking libraries including QREF and Bartiq. Budget
              ownership among commercial customers rests within specialized corporate R&D units, computational chemistry
              departments, and quantitative research divisions rather than central IT procurement. The transition from
              exploratory R&D line items to recurring production compute contracts represents the central hurdle for
              commercial revenue realization.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Macro Growth Drivers and Structural Adoption Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The macro expansion of quantum computing demand is propelled by the physical scaling limits of classical
              Moore's Law and the escalating computational complexity of AI-driven scientific discovery, particularly in
              molecular simulation and electro-optic materials characterization. Strategic partnerships between quantum
              developers and classical compute leaders, such as PsiQuantum's technical collaboration with NVIDIA on
              GPU-QPU integration, illustrate the emerging hybrid computing model required by advanced enterprise
              workflows. Furthermore, high-speed optical networking innovations derived from silicon photonics—such as
              Barium Titanate (BTO) optical switches—create potential adjacent commercial utility in AI supercomputing
              interconnects. Nonetheless, enterprise adoption faces severe structural constraints: extreme capital
              intensity, protracted development cycles, the requirement for massive cryogenic infrastructure, and
              unproven commercial software stacks. Additionally, secondary market share transactions and pre-IPO broker
              valuations reflect sharp pricing discrepancies, underscoring persistent uncertainty regarding commercial
              monetization timelines, profitability horizons, and dilution risks before operational utility is
              demonstrated.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dichotomy Between Long-Term Market Potential and Near-Term Revenue
            body: >-
              While market forecasts project an industry expanding to $198 billion by 2040, PsiQuantum operates
              currently as a pre-revenue deep-tech entity with substantial cash burn and no commercial product revenue,
              relying entirely on venture capital and sovereign site co-investments.
