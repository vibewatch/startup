      - number: '5.2'
        title: Foundry Manufacturing, Omega Chipsets, and Cryogenic Form Factors
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's hardware strategy relies on industrial semiconductor fabs rather than specialized boutique
              cleanrooms. The core Omega silicon photonic chipset is manufactured on 300mm wafer lines at
              GlobalFoundries' Fab 8 in Malta, New York, complemented by 200mm development engagements with SkyWater
              Technology in Minnesota. To realize low-loss optical switching, the company manufactures barium titanate
              (BTO) electro-optic wafers in California and heterogeneously integrates them with GlobalFoundries silicon
              photonics. Cryogenic cabinets operate between 2 and 4 kelvins using Linde-manufactured cryoplants to chill
              superconducting nanowire single-photon detectors (SNSPDs), housing approximately 250 photonic chips per
              rack. Standard telecom optical fiber links chips and cabinets over hundreds of meters without optical
              transduction, though waveguide coupling and switch insertion loss remain the primary technical bottleneck.
            claimRefs:
