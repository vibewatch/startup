  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Evaluating PsiQuantum's investment thesis requires balancing extraordinary technical milestones against
              severe industrialization, governance, and counterparty dependencies. PsiQuantum's strategy is predicated
              on bypassing intermediate noisy intermediate-scale quantum (NISQ) systems in favor of building
              utility-scale, million-qubit fault-tolerant quantum computers (FTQC). This all-or-nothing approach
              concentrates organizational exposure onto the operational execution of two flagship facilities: Moreton
              Bay Central in Queensland, Australia (targeted for operational delivery by the end of 2027) and the
              Illinois Quantum and Microelectronics Park in Chicago (scheduled for initial phase completion in 2027 with
              ongoing deployment into 2028). The company has secured over $1.66 billion to $1.8 billion in total equity
              financing—including a $1 billion Series E round in September 2025 valuing the firm at $7 billion—alongside
              substantial government backing such as an A$940 million Australian package and a $100 million U.S. CHIPS
              Act award. However, the operational complexity of integrating cryogenic cooling cabinets, Barium Titanate
              (BTO) optical switches, and standard telecom fiber interconnects creates significant residual
              vulnerability if schedule delays occur before commercial revenues materialize.
            claimRefs:
