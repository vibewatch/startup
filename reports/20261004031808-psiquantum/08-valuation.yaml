chapter:
  number: 8
  title: "Valuation"
  summary: "PsiQuantum's reported private valuation rose from $7.0 billion in September 2025 to $10.5 billion in May 2026, while Yahoo Finance displays a $4.6 billion Forge estimated valuation whose derived price is explicitly not a quotation. The resulting evidence supports a research-more recommendation, high risk rating, and stretched valuation stance until security terms, runway, independent system validation, and commercial demand are disclosed."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >-
      The recommendation is research-more with medium confidence, a high risk rating, and a
      stretched valuation stance. The reported May 2026 financing mark of $10.5 billion is a
      meaningful capital-market signal, but it is not sufficient evidence of fair value for a
      business whose retained public evidence does not disclose audited revenue, burn, runway,
      security terms, or a fully diluted capitalization table. Yahoo Finance also displays a
      $4.6 billion Forge estimated valuation and warns that its $27 derived price is not a
      quotation and does not indicate available supply or demand. Investors therefore cannot
      treat either mark as an executable entry or exit price. Entry should remain conditional
      on primary financing documents, preference-stack analysis, current cash data, and
      independently verified deployment milestones rather than on a generic quantum-computing
      premium.
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The investable thesis is that PsiQuantum may convert semiconductor-scale manufacturing
      and modular photonic networking into a defensible path toward fault-tolerant quantum
      computing. The company says its platform uses standard 300mm wafers, has tested more than
      one million devices, and is being developed for planned sites in Brisbane and Chicago.
      Those facts establish scale intent and engineering progress, not commercial utility or
      independently verified system economics. The anti-thesis is correspondingly
      execution-heavy: Sacra identifies the integration of photon sources, detectors, and
      optical switches at massive scale as a manufacturing risk, while the February 2026 move
      to an interim chief executive adds governance-transition risk during deployment. The
      thesis strengthens only when external evidence validates yields, error-corrected
      operation, schedule, uptime, and customer willingness to pay.
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "financing-and-valuation-context"
    title: "Financing and Valuation Context"
    body: >-
      Independent sources report that PsiQuantum raised $1.0 billion at a $7.0 billion valuation
      in September 2025 and a further $1.5 billion at a $10.5 billion valuation in May 2026. The
      later mark is a 50% step-up in eight months, but funding raised is not cash available and
      the sources do not disclose the later round's liquidation preferences, dilution, debt,
      or other senior claims. Separately, the Forge data displayed by Yahoo Finance indicates a
      $27 derived price and $4.6 billion estimated valuation as of October 2, 2026. The roughly
      56% gap between that estimate and the reported May round mark is a signal to investigate,
      not proof of a tradable discount: Forge explicitly states that the price may rely on
      limited data and does not indicate supply or demand.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV013"
  - id: "scenarios-comparables-and-diligence"
    title: "Scenarios, Comparable Context, and Diligence Triggers"
    body: >-
      A milestone-based framework is more defensible than revenue multiples because no retained
      source establishes current revenue, margins, or contracted backlog. The bull case requires
      independent system validation and commercial demand before assigning value above the
      $10.5 billion reported round mark. The base case uses the $7.0 billion and $10.5 billion
      financing marks only as an entry-discipline band, not as appraised fair value. The bear
      case allows value below $7.0 billion or impaired liquidity if integration, schedule, or
      financing risks crystallize. Sacra's report of sharp drawdowns in public quantum
      pure-plays reinforces multiple-compression risk but is not a like-for-like benchmark
      because architectures, maturity, and capital structures differ. A target return, hold
      period, and exit path remain ununderwritable without instrument terms, ownership data,
      cash needs, and credible liquidity timing.
    claimRefs:
      - "CV003"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
