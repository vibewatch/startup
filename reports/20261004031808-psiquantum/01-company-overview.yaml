company:
  name: "PsiQuantum"
chapter:
  number: 1
  title: "Company Overview"
  summary: "PsiQuantum is a late-stage quantum computing developer building utility-scale photonic quantum systems with over $1.6B to $2.4B in private capital and multi-hundred-million government commitments. The company transitioned founding CEO Jeremy O'Brien to Executive Chairman while appointing former AMD President Victor Peng as CEO to guide industrial execution across dual manufacturing sites in Brisbane and Chicago."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Executive Leadership, and Governance Architecture"
    body: "PsiQuantum Corp. is a privately held deep-tech enterprise founded in 2016 and headquartered in Palo Alto, California, with major facilities under development in Chicago, Illinois and Moreton Bay, Queensland (CO001). The company's core mission is deploying utility-scale, fault-tolerant quantum computing (FTQC) systems containing approximately one million physical qubits leveraging standard silicon photonics semiconductor manufacturing (CO002). In 2026, the company executed a strategic executive leadership realignment: co-founder Prof. Jeremy O'Brien transitioned from Chief Executive Officer to Executive Chairman, while Victor Peng—former President of Advanced Micro Devices (AMD) and former CEO of Xilinx—was appointed Chief Executive Officer to oversee industrial scaling and multi-site deployment (CO003). Executive leadership is reinforced by co-founders Dr. Pete Shadbolt (Chief Scientific Officer), Dr. Mark Thompson (Chief Technologist), and Prof. Terry Rudolph (Chief Architect) (CO004). Governance oversight expanded significantly in 2026 through the appointments of Intel CEO Lip-Bu Tan and Atomico Founder/CEO Niklas Zennström to the Board of Directors, aligning semiconductor fabrication pedigree and international venture governance (CO005). Key-person dependency remains elevated around the technical founders and executive leadership, though the appointment of veteran semiconductor operators mitigates early-stage founder-operator risk."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-scale"
    title: "Capitalization Structure, Valuation Evolution, and Operating Scale"
    body: "PsiQuantum's capitalization reflects heavy private venture syndicate backing combined with aggressive public-sector co-investment (CO006). In September 2025, the company closed a $1.0 billion Series E financing round led by BlackRock, Temasek, and Baillie Gifford, valuing the entity at $7.0 billion post-money, with participation from strategic and institutional investors including NVIDIA's NVentures, Macquarie Capital, and Qatar Investment Authority (CO007). Unverified secondary and private-market databases cite subsequent May 2026 expansions reaching $2.4B to $3.8B in cumulative capital and valuations up to $10.5B, though secondary brokerages explicitly warn that pre-IPO allocations remain illiquid, unverified, and subject to high execution risk (CO008). On operational scale, headcount is estimated between 576 and 654 employees across Palo Alto, Brisbane, and Chicago, up from approximately 150 personnel at the Series D milestone in 2021 (CO009). Commercial operating revenue remains unverified with no public ARR or product sales reported, as third-party market estimates of $250M to $500M annual revenue are unsubstantiated by primary filings and reflect model projections or government grant cash flows rather than recurring enterprise software revenue (CO010)."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "milestones-programs"
    title: "Industrial Milestones, Public Sector Commitments, and Deployment Roadblocks"
    body: "The company's commercialization roadmap centers on physical deployment at two flagship hubs: Moreton Bay Central near Brisbane, Australia, and the Illinois Quantum and Microelectronics Park (IQMP) in Chicago, targeting operational utility-scale prototype systems by 2027 (CO011). In 2026, the company broke ground at Moreton Bay and opened an advanced test and validation laboratory at Griffith University in Brisbane, following earlier site work in Chicago (CO012). These physical infrastructure buildouts are supported by substantial non-dilutive government contracts, including a $125 million contract under DARPA's Quantum Benchmarking Initiative (QBI) and a finalized $100 million award from the U.S. Department of Commerce under the CHIPS and Science Act (CO013). Software ecosystem enablement accelerated in 2026 through the public release of Construct, an open-access fault-tolerant quantum computing design tool integrating NVIDIA CUDA-Q for GPU-accelerated simulation (CO014). Despite substantial progress, the absence of independent third-party verification of fault-tolerant quantum operation, coupled with complete opacity surrounding annual cash burn, creates material timeline and financing risks for private market investors (CO015)."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
