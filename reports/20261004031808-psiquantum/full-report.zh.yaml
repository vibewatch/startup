  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 容错架构与百万量子比特光量子押注
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 切入量子计算的底层逻辑在于：具备商业实用价值的前提是实现容错，而运行量子纠错（QEC）编码需要大约 100 万个物理量子比特。公司没有走基于超导 transmon
              或离子阱的含噪声中等规模量子（NISQ）路线，而是全面押注单光子光学量子比特。光子对热退相干与电磁干扰具备天然免疫力，控制电路可与光量子比特紧密集成，无需实体物质比特所必需的庞大稀释制冷系统。然而，由于线性格子光学逻辑门操作天然具有概率性，原生失败率高达
              25% 至 50%，该架构必须借助空间与时间复用技术化解门操作的非确定性，耗费了大量的 QEC 纠错开销预算。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
