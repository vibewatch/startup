      - number: '5.3'
        title: Construct 软件平台、生态集成与现场交付
        blocks:
          - type: paragraph
            body: >-
              为将客户实际工作流对接至容错计算环境，PsiQuantum 推出了量子软件平台及 SDK 工具包 Construct，提供可视化量子线路设计、Python 优化工具以及容错算法资源开销估算功能。该平台支持公司与
              Airbus、Lockheed Martin、Mercedes-Benz、Boehringer Ingelheim、Mitsubishi Chemical 等工业伙伴开展早期场景探索，并与 Brookhaven
              National Laboratory 开展前沿科研协作。实体工程部署方面，核心试验依托位于加州 Milpitas 的 Alpha System 测试中心推进，并在澳大利亚 Brisbane 与美国伊利诺伊州
              Chicago 破土建设实用级计算基地。临时 CEO Victor Peng
