      - number: '1.3'
        title: 工业化里程碑、公共部门承诺与落地瓶颈
        blocks:
          - type: paragraph
            body: >-
              公司的商业化路线图以两大核心枢纽的实体工程建设为核心：澳大利亚 Brisbane 附近的 Moreton Bay Central，以及位于 Chicago 的伊利诺伊州量子与微电子产业园（IQMP），目标是在
              2027 年交付可运行的实用级原型系统 (CO011)。继前期在 Chicago 启动选址施工后，公司于 2026 年在 Moreton Bay 正式破土动工，并在 Brisbane 的 Griffith
              University 设立了先进测试验证实验室 (CO012)。这类重资产基础设施建设得到了大额非稀释性政府资金支持，包括 DARPA 量子基准计划（QBI）下的 $125 million
              合同，以及美国商务部根据《芯片与科学法案》（CHIPS and Science Act）敲定的 $100 million 资助 (CO013)。软件生态方面，公司于 2026 年公开发布 Construct
              工具，该工具集成了 NVIDIA CUDA-Q 以支持 GPU 加速仿真，是一套开放使用的容错量子计算设计平台
              (CO014)。尽管进展显著，但其容错量子运算至今仍缺乏独立第三方验证，加之年度烧钱速度完全不透明，给私募市场投资者带来了极大的交付周期延误与再融资风险 (CO015)。
