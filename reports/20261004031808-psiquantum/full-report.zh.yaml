  - id: FE001
    title: PsiQuantum 光量子 FTQC 架构技术栈
    type: stack
    summary: PsiQuantum 容错量子计算架构的分层展示：从顶层应用软件一路向下贯穿至底层商用半导体晶圆代工制造。
    data:
      layers:
        - label: 应用与软件层
          detail: Construct 平台、Python QDK、线路设计，以及面向企业算法的资源估算工具。
        - label: 量子纠错（QEC）层
          detail: 伴随式测量译码与逻辑量子比特编译，旨在纠正概率性门错误。
        - label: 光电互联网络层
          detail: 标准电信光纤互连，以 99.7% 保真度在机柜间分发光量子比特。
        - label: 深冷机架基础设施
          detail: Linde 2–4K 制冷机组冷却模块化机柜，机柜内集成 ~250 颗光子芯片及同置控制电子元件。
        - label: 电光开关层
          detail: 钛酸钡（BTO）薄膜开关，实现低功耗纳秒级路由与复用。
        - label: 集成光子硬件层
          detail: 在 GlobalFoundries 与 SkyWater 晶圆厂制造的 Omega 硅光及波导电路。
    approximationNotes: 逻辑架构拆解基于已发表的技术论文与高管披露。
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: PsiQuantum 客户与合作伙伴采纳历程
    type: journey-map
    summary: 机构客户推进的多阶段历程：从最初的主权协同投资，走向企业联合设计、软件使用，并最终迈向未来的实用级算力。
    data:
      items:
        - label: 'Phase 1: 主权与战略基石'
          detail: 政府机构与国防项目承诺基石资本、无偿补贴以及产业基地基础设施。
          touchpoints:
            - 双边政府协同投资（芝加哥、摩顿湾）
            - DARPA QBI 基准测试与商务部拨款
            - 厂址选择与半导体晶圆代工产能
          tone: positive
        - label: 阶段 2：国家实验室合作
          detail: 政府与国家实验室科学家在早期软件工具上测试容错量子算法的基准表现。
          touchpoints:
            - DOE Brookhaven National Laboratory 合作
            - Construct 科学应用评估
            - 面向高能物理的算法开发
          tone: positive
        - label: 阶段 3：企业算法协同设计
          detail: 航空航天、化工及制药领域的 Fortune 500 研发团队梳理棘手的模拟难题，匹配容错算法。
          touchpoints:
            - 直接对接 PsiQuantum 行业应用团队
            - 联合制定算法（化学、空气动力学、材料）
            - 百万量子比特 FTQC 资源开销估算
          tone: neutral
        - label: 阶段 4：Construct 平台集成
          detail: 外部研究人员与机构用户接入基于 Coder 的安全量子开发环境（QDE）。
          touchpoints:
            - 自托管 AWS 与 Kubernetes pod 资源调配
            - 接入 Workbench FTQC 编程框架
            - 集成 NVIDIA CUDA-Q 仿真工具
          tone: positive
        - label: 阶段 5：试点评估与验证
          detail: 高校与企业合作伙伴优化算法，并将计算负载编译为逻辑门集合。
          touchpoints:
            - 学术研讨会与行业会议开发者分论坛
            - Pre-alpha 软件基准评测
            - 验证容错算法效率
          tone: neutral
        - label: 阶段 6：实用级算力商业化变现
          detail: 定于 2027 年的投产运营里程碑：商业客户从软件模拟过渡到接入实体的实用级光量子 QPU。
          touchpoints:
            - Brisbane 与 Chicago 系统联机调试
            - 从科研资助模式转向商业算力定价
            - 检验商业客户留存与付费意愿的关键考验
          tone: warning
    approximationNotes: 根据已公布的部署路线图与平台能力，梳理机构合作推进阶段。
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU017
