figures:
  - id: FO001
    title: PsiQuantum 公司与里程碑发展时间线
    type: timeline
    summary: 贯穿 2016 年至 2026 年的关键公司、融资、技术与治理里程碑。
    data:
      items:
        - label: 公司成立
          date: '2016'
          detail: Jeremy O'Brien、Terry Rudolph、Mark Thompson 和 Pete Shadbolt 在帕洛阿尔托创立公司，旨在打造百万量子比特级光量子计算机。
          tone: neutral
        - label: D 轮融资（$450M）
          date: 2021-07
          detail: 由 BlackRock 领投完成 $450 million 融资，用于将团队扩充至 150 人并扩大硅光制造规模。
          tone: positive
        - label: E 轮融资（$1.0B）
          date: 2025-09
          detail: 以 $7.0 billion 估值完成 $1.0 billion 融资，由 BlackRock、Temasek 和 Baillie Gifford 领投，NVIDIA 参投。
          tone: positive
        - label: 芝加哥量子园区动工
          date: 2025-09
          detail: 宣布作为主力租户入驻占地 128 英亩的伊利诺伊量子与微电子园区设施。
          tone: neutral
        - label: 高管领导层调整
          date: 2026-02
          detail: 任命前 AMD 总裁 Victor Peng 为 CEO；联合创始人 Jeremy O'Brien 转任执行董事长。
          tone: warning
        - label: 董事会成员任命（Tan 与 Zennström）
          date: 2026-04
          detail: 任命 Intel CEO Lip-Bu Tan 与 Atomico 创始人兼 CEO Niklas Zennström 进入董事会。
          tone: positive
        - label: 澳大利亚摩顿湾基地动工
          date: 2026-05
          detail: 昆士兰实用级量子计算设施破土动工，并在格里菲斯大学（Griffith University）启用验证实验室。
          tone: positive
        - label: DARPA QBI 合同（$125M）
          date: 2026-08
          detail: 在 DARPA 量子基准测试计划（QBI）下签署 $125M 协议，以严格评估商业实用性。
          tone: positive
        - label: 美国商务部拨款（$100M）
          date: 2026-09
          detail: 敲定《芯片与科学法案》项下 $100M 联邦拨款的最终协议文件。
          tone: positive
        - label: Construct 平台公开发布
          date: 2026-09
          detail: 发布集成 NVIDIA CUDA-Q 的 Construct 软件套件，向算法开发者免费开放使用。
          tone: positive
    approximationNotes: 日期反映官方新闻公告；未计入老股轮次延展及非公开股票交易。
