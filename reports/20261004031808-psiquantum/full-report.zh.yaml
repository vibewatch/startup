          note: 经典超级计算（Nvidia/AMD）；商用量产规模极高，但受制于经典物理法则
    approximationNotes: 得分基于已披露的半导体晶圆代工合作与公开路线图里程碑给出的 1-10 序数排名，有证据支撑，而非连续定量遥测数据。
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP006
      - CP007
  - id: FI001
    title: 收入模式演进桥梁
    type: flow
    summary: 从企业与政府合作走向实用级 FTQC 算力商业变现的转化路径。
    data:
      nodes:
        - id: eval
          label: 企业算法范围界定与评估
          detail: 借助 Construct 软件开展早期试点评估
        - id: pilot
          label: Construct 软件平台订阅
          detail: 年度平台许可与算法资源估算
        - id: govt
          label: 政府主力协同开发
          detail: 定制化里程碑资助与数据中心基地补贴
        - id: site
          label: 深冷数据中心调试交付
          detail: 布里斯班与芝加哥模块化设施竣工
        - id: ftqc
          label: 实用级商用 QPU 算力访问
          detail: 瞄准 2027 年后按小时及预约制提供的量子算力
        - id: margin
          label: 长期利润率变现
          detail: 一旦跨过深冷固定成本门槛，即可释放高利润率的算力服务
      edges:
        - from: eval
          to: pilot
