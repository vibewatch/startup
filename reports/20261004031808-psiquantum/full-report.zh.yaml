  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设条件
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 集成容错性能获得独立验证；基地里程碑如期推进；商业需求进入可签约阶段
        - 仅当有证据支撑相比 2026 年 5 月报道估值享有溢价时，方可考虑超过 $10.5B 的估值
        - 规模化放量、进度延期及客户转化风险
        - 获得外部系统验证，外加已签署且具备实际经济价值的需求
      - - 基准情景
        - 工程与基地建设持续推进，但商业化与流动性尚未得到验证
        - $7B-$10.5B 是用于约束入场纪律的锚定区间，并非内在价值评估；目标回报仍未测算
        - 额外股权稀释、优先股积压悬顶、领导层执行力及收入推迟
        - 里程碑已获核验，但缺乏足够证据支撑估值溢价或设定退出路径
      - - 悲观情景
        - 集成或进度不及预期、需要追加融资，或流动性依然无法实现
        - 估值低于 $7B 或流动性受损；在缺乏优先股、资金需求及股权数据的情况下，下行风险无法锁定底线
        - 估值下调轮次（Down round）、资本重组、里程碑重置及估值乘数压缩
        - 技术里程碑未达成、融资压力加剧，或持续缺乏商业化证明
    notes: 情景区间以报道的融资估值为决策门槛，并非概率加权预测；由于运营数据和证券数据均缺失，不赋予具体数值概率。
    claimRefs:
      - CV002
