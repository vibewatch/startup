      - number: '2.3'
        title: 客户分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              在容错量子计算领域，主权政府资助方与企业用户的采购路径和买家画像存在本质区别。早期的重度资本开支与园区建设主要由主权及国家安全买家推动，这类客户的核心诉求在于掌控本土量子能力、保障半导体供应链安全并抢占尖端算力制高点。在此类公共部门项目中，预算归属于联邦商务部、国防机构以及地方经济发展署，通常采用多年期联合出资模式。相比之下，制药、能源及金融服务等行业的企业级商业采购则遵循“软件先行”的评估路径。企业客户主要借助
              PsiQuantum Construct 等早期算法设计平台，以及 QREF、Bartiq 等开源基准库与 PsiQuantum
              展开技术对接。在企业内部，预算权掌握在专项研发中心、计算化学实验室与量化研究部门手中，而非中央 IT 采购部门。能否从探索性研发预算科目平稳过渡至持续付费的生产级算力合同，是实现商业化收入的核心关卡。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
