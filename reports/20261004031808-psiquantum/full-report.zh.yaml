  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 量子计算行业格局与技术路线架构
        blocks:
          - type: paragraph
            body: >
              量子计算硬件行业在物理量子比特的技术路线上高度分化，各方案在物理逻辑门保真度、环境隔离度、互联互通性以及工业制造可扩展性之间做着不同的工程取舍 [CP001, CP005]。老牌科技巨头
              International Business Machines (IBM) 与 Alphabet 旗下的 Google Quantum AI 主要押注超导 transmon
              电路，并通过云平台向企业客户提供含噪声中等规模量子（NISQ）处理器接入服务 [CP007]。与此同时，已上市的纯量子计算标的 IonQ
              采用离子阱路线，该方案拥有极高的双量子比特逻辑门保真度与全互联特性，但受制于较慢的门操作速度以及复杂的激光偏转扩展瓶颈 [CP007]。与上述基于实体物质的路线不同，PsiQuantum
              的技术立论在于：具备商业实用价值的量子计算必须依赖运行在约 100 万个物理量子比特之上的量子纠错（QEC），未经纠错的过渡硬件不具备商业可行性 [CP001, CP002,
              CP006]。为了打破定制实验室稀释制冷机的扩展极限，PsiQuantum 采用 GlobalFoundries 标准商业半导体产线制造的硅光子芯片，并通过光波导与通用通信光纤传输光量子比特 [CP002,
              CP004,
              CP006]。然而，该方案在规避物质比特稳定问题的同时，引入了极其棘手的概率门难题：光子之间天然缺乏相互作用，必须依赖基于测量的融合门，而此类操作本质上是概率成功的，这就需要极其庞大的物理光子冗余度，以及飞秒（femtosecond）级的超精密时钟同步
              [CP002]。与此同时，Microsoft 等超大规模云厂商采取双轨策略，一方面推进自研拓扑量子计算研发，另一方面通过 Azure Quantum 聚合第三方硬件，并持有 PsiQuantum
              等光量子初创企业的少数股权 [CP005, CP007]。
