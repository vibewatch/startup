      - number: '3.3'
        title: 商业化变现模式、软件生态与 GTM 阻力
        blocks:
          - type: paragraph
            body: >
              当前量子计算领域的商业化模式存在明显断层，一方着眼于当下的 NISQ 实用化，另一方押注远期的容错系统算力接入 [CP004, CP007]。IBM、IonQ
              等先发竞争对手按云服务用量分级打包量子算力，通过按小时机时预订、单次运行采样（shot）计费或企业专属容量合同向客户收取费用
              [CP007]。这些服务让金融、航天、制药等领域的企业研发团队得以运行实验性的经典-量子混合算法；尽管底层硬件错误率偏高，依然借此沉淀了客户黏性与工作流切换成本 [CP007]。PsiQuantum
              坚决放弃开发过渡期商用硬件，因此目前不提供任何可计费的量子硬件计算时钟 [CP004]。为了防止在企业级客户与开发者群体中边缘化，PsiQuantum 推出 Construct
              软件平台，协助科研人员、企业合作伙伴及国家实验室设计容错量子算法并评估所需计算资源开销 [CP003, CP004]。通过与 Brookhaven National
              Laboratory、Airbus、Lockheed Martin 等机构的科研合作，PsiQuantum 以联合研发协议的形式锁定了未来终端用户，但相比其庞大的日常运营支出，这些项目贡献的商业化收入微乎其微
              [CP003, CP004]。因此，一旦竞争对手的云生态在光量子硬件投入运转前抢先锁定了企业开发者，PsiQuantum 后续将面临极大的客户使用惯性与高昂的迁移切换壁垒 [CP005, CP007]。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP007
