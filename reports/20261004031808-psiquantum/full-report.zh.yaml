  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与替代方案
        blocks:
          - type: paragraph
            body: >-
              量子计算的目标市场在近期的含噪声中等规模量子（NISQ）系统与长期的实用级容错量子计算（FTQC）之间界限分明。PsiQuantum
              明确将含噪声中等规模硬件排除在商业产品范围之外，将资金和工程力量全部押注在需要约 100 万个物理量子比特的实用级 FTQC
              上。目前量子计算领域的商业支出仍高度集中于云端原型机访问、企业探索性概念验证（PoC）以及学术研究资助。与之相对，实用级 FTQC
              旨在争夺目前投向经典高性能超算集群的高性能计算预算，这些传统集群负责运行密度泛函理论、分子动力学模拟、蒙特卡洛风险引擎及复杂离散优化算法。在当前环境下，PsiQuantum
              规划平台的首要替代品并非其他技术路线的量子硬件，而是由 GPU
              及专用硬件加速的高密度经典高性能计算集群，以及新兴的量子启发式张量网络算法。在容错硬件于工业实际问题上展现出确凿计算优势之前，经典仿真架构在成本结构与软件生态上依然占据压倒性优势。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 市场规模预测与分歧估值视角
        blocks:
          - type: paragraph
            body: >-
              行业分析师对量子计算总体市场规模的估算存在显著分歧，根源在于各方对实现商用容错的时间表假设不同。市场测算研究预计，广义量子技术产业规模将从 2025 年的约 $750 million 增长至 2030 年的
              $16 billion 至 $37 billion；随着容错商业实用价值在化工、生命科学、金融及交通领域落地，2040 年远期预测规模将达 $198
              billion。然而，这些自上而下的测算混合了量子传感、量子通信、硬件组件以及软件服务等多个异质细分市场。从实际运营角度来看，PsiQuantum 到 2027
              年可直接触达的服务有效市场（SAM），受限于政府专项国防、情报及主权能力建设项目——典型代表即澳大利亚联邦及昆士兰州政府在 Brisbane 承诺的 $620 million（$940 million
              AUD）联合投资，以及其在 Chicago 伊利诺伊州量子与微电子产业园的主力开发项目。企业级商业软件与硬件服务支出属于第二阶段扩张目标，完全取决于其 Omega
              硅光子芯片组与低温数据中心封装体系能否完成物理级验证。
