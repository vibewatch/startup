      - number: '2.4'
        title: 宏观增长驱动力与结构性落地瓶颈
        blocks:
          - type: paragraph
            body: >-
              推动量子计算需求宏观增长的底层动力，在于经典摩尔定律遭遇物理微缩极限，以及 AI 驱动的科学发现（特别是分子模拟与电光材料表征）导致计算复杂度呈指数级攀升。量子研发机构与传统算力巨头之间的战略合作，例如
              PsiQuantum 与 NVIDIA 围绕 GPU-QPU 混合集成开展的技术协同，印证了前沿企业工作流对异构混合计算模式的迫切需求。此外，源自硅光子技术的超高速光互连创新（如钛酸钡 BTO 光开关），在 AI
              超算互联场景中展现出潜在的衍生商业价值。然而，企业级应用仍面临严峻的结构性制约：极高的资本密集度、漫长的研发交付周期、庞大的低温基础设施需求，以及未经验证的商用软件栈。与此同时，二级市场股份交易与 Pre-IPO
              经纪商给出的估值存在剧烈分歧，折射出市场对其商用变现周期、盈利时间表以及在系统实际运转前所面临的股权稀释风险深感疑虑。
            claimRefs:
              - CM014
              - CM015
              - CM016
