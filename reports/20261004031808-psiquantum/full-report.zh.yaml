            body: 虽然市场预测到 2040 年行业规模将扩至 $198 billion，但 PsiQuantum 当前仍是一家商业收入为零、烧钱规模庞大的硬科技研发企业，完全依赖风险投资与主权政府园区共建资金维持运转。
