      - number: '5.2'
        title: 代工量产、Omega 芯片组与低温系统形态
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的硬件战略依托成熟的工业半导体晶圆厂，而非小规模定制洁净室。其核心 Omega 硅光子芯片组由 GlobalFoundries 位于纽约州 Malta 的 Fab 8 工厂采用 300mm
              晶圆线制造，同时由明尼苏达州 SkyWater Technology 配合进行 200mm 早期开发。为实现超低损耗光开关，公司在加州自建工厂生产钛酸钡（BTO）电光晶圆，并将其与 GlobalFoundries
              生产的硅光子芯片进行异质集成。低温机柜工作温度保持在 2 至 4 开尔文（Kelvin）之间，依靠 Linde 制造的制冷机组为超导纳米线单光子探测器（SNSPD）降温，每个机柜可容纳约 250
              颗光子芯片。标准商用通信光纤在无需光电转换的前提下，即可将芯片与机柜在数百米范围内相连；但波导耦合损耗与开关插入损耗依然是眼下最核心的工程技术瓶颈。
