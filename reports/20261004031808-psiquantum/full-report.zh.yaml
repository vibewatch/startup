      - number: '3.2'
        title: 竞争对手画像、制造规模与战略定位
        blocks:
          - type: paragraph
            body: >
              横向对比头部量子计算开发商，各方在资本实力、制造供应链、交付时间表及过渡期商业化上存在显著分水岭 [CP005, CP007]。IBM 与 Google
              依靠集团充沛的经营现金流支撑量子研发，并运营自有半导体晶圆洁净室；而风投支持的初创企业则需要巨额外部注资，以维系长达数年的先导产线研发 [CP001, CP005, CP008]。PsiQuantum 凭借估值
              $7 billion 的 $1 billion Series E 轮风投，以及在澳大利亚 Brisbane 和美国伊利诺伊州 Chicago 获得的地方与联邦大额联合投资，为其战略路线储备了充足资金
              [CP001, CP003, CP008]。这笔资金让 PsiQuantum 能够联手 GlobalFoundries 推进 300mm 晶圆加工，并在加州自主研发专有钛酸钡（BTO）电光开关 [CP001,
              CP006]。相比之下，IonQ 将离子阱芯片封装外包给晶圆代工厂，并通过 Amazon Braket、Microsoft Azure Quantum 及 Google Cloud 销售云订阅服务实现商业化
              [CP007]。Microsoft 则采取多元化布局，一方面推进旨在实现硬件级物理保护的自研拓扑量子比特研究，另一方面通过 Azure Quantum 扮演平台聚合者，将第三方量子硬件无缝接入企业级云工作流
              [CP005]。随着各国政府加速推进本国量子基础设施建设，行业竞争焦点正日益转向争夺获政府高额补贴的实用级落地产业基地 [CP001, CP003, CP008]。
            claimRefs:
