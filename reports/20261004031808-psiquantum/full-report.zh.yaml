chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司背景、管理层架构与治理机制
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum Corp. 成立于 2016 年，是一家总部位于加州 Palo Alto 的硬科技非上市企业，目前正在伊利诺伊州 Chicago 与昆士兰州 Moreton Bay 建设核心基地
              (CO001)。公司核心目标是依托成熟的标准硅光子半导体制造工艺，部署包含约 100 万个物理量子比特的实用级容错量子计算（FTQC）系统 (CO002)。2026 年，公司完成管理层战略调整：联合创始人
              Jeremy O'Brien 教授由首席执行官转任执行董事长；Advanced Micro Devices (AMD) 前总裁兼 Xilinx 前首席执行官 Victor Peng
              接任首席执行官，主导工业级规模化制造与多地交付部署 (CO003)。管理层其他核心联合创始人还包括首席科学官 Pete Shadbolt 博士、首席技术专家 Mark Thompson 博士及首席架构师
              Terry Rudolph 教授 (CO004)。2026 年公司董事会迎来重大扩充，Intel 首席执行官 Lip-Bu Tan 与 Atomico 创始人兼首席执行官 Niklas Zennström
              加入董事会，强化了半导体制造底蕴与国际风投资治能力 (CO005)。目前公司对技术创始人及核心高管的关键人员依赖度仍然较高，但引入资深半导体产业老将，有效缓解了早期由创始人兼任运营者带来的管理风险。
            claimRefs:
