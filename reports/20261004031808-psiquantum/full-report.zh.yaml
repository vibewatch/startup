companyProfile:
  summary: >-
    PsiQuantum 是一家处于后期的非上市量子计算研发商，专注于打造实用级光量子容错系统与 Construct 软件平台。从商业层面看，公司目前仍未产生实质收入，但已建立庞大资金储备，获得多项主权与国防级重大采购承诺，并在
    Brisbane 与 Chicago 推进日益工业化的大规模部署规划。目前公司由 Victor Peng 出任 CEO，联合创始人 Jeremy O'Brien
    担任执行董事长；但现有公开证据仍未解答其烧钱速度、优先股堆叠条款及客户商业化路径等核心问题。
