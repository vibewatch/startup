      - number: '4.2'
        title: 成本结构、毛利率动态与资本密集度
        blocks:
          - type: paragraph
            body: >
              PsiQuantum 的财务特征表现为极高的硬件资本密集度与前置重资产基础设施投资。与低资本开支、边际成本极低的传统软件初创企业截然不同，PsiQuantum
              必须在产生实际商业收益数年前，先行建造实体低温数据中心并投片定制半导体芯片。其系统研发依托双轨尖端制造体系：由 GlobalFoundries 位于纽约州 Malta
              的商业晶圆厂代工硅光子芯片与电子控制芯片，同时由 PsiQuantum 位于加州的自建洁净室生产专用的 300mm 钛酸钡（BTO）光开关晶圆。


              公司运营支出主要流向高精尖技术人员薪酬与底层基础设施研发。全职员工规模从 2024 年底的约 320 人扩张至 2025 年底的逾 540 人，并在 2026 年 8 月达到 670
              人；在不计入园区基建支出的前提下，其基础年度现金薪酬、股权激励与工程研发开销折算的年化现金消耗预估在 $120 million 至 $180 million 之间。在 Chicago（作为占地 128
              英亩的伊利诺伊州量子与微电子产业园的主力入驻方）与 Brisbane（Moreton
              Bay）两处实体基地的建设，涉及低温制冷站调试、光互连网络及定制数据中心装配，耗资高达数亿美元。因此，公司短期毛利率实际上无法定义或为负值，未来能否跑出正向单元经济模型，完全取决于能否通过海量高吞吐实用级计算任务摊销数十亿美元的固定资产开支。
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI012
              - CI013
      - number: '4.3'
        title: 资本充裕度、主权资本背书与尽调评估
        blocks:
          - type: paragraph
            body: >
              PsiQuantum 资金实力雄厚，汇聚了全球顶尖主权财富基金、老牌机构投资方与政府战略产业基金的大力支持。2025 年 9 月 10 日，公司以 $7 billion 投后估值完成 $1 billion
              Series E 轮融资，历经 8 轮私募股权融资累计斩获 $2.32 billion 资金。该轮融资的重要机构投资方涵盖 BlackRock、Baillie Gifford、Temasek、NVIDIA 旗下
              NVentures 以及 Qatar Investment Authority。除私募风投资金外，PsiQuantum 还锁定了澳大利亚联邦及昆士兰州政府近 $1 billion
              的主权投资承诺（双方通过股债混合工具各出资 $466.4 million），并于 2026 年 9 月正式敲定美国商务部根据《芯片与科学法案》提供的 $100 million 资助法律文件。


              尽管拥有庞大资金安全垫，公司仍面临严重的结构性融资依赖与工程执行风险。从纯实验室研发向实用级商用基础设施的跨越，促使公司于 2026 年 2 月任命 AMD 前总裁兼 Xilinx 前首席执行官 Victor
              Peng 为临时首席执行官，联合创始人 Jeremy O'Brien 则转任执行董事长。尽管 DARPA 基准测试与国防专家认为，各行业普遍可用的商用容错量子计算可能要在量子基准计划（QBI）下验证至 2033
              年，但 PsiQuantum 仍坚持 2027
              年交付投产的激进目标。任何数年维度的工期延误都将迅速吞噬现金跑道，迫使公司开展大幅稀释股权的新一轮融资或重新谈判政府还款条款。由于详尽的烧钱速度、净现金储备及政府里程碑回购条款均未公开披露，传统的投资判断模型无法对其在
              2027 年中部署窗口期之后的偿债与持续经营能力进行有效核实。
