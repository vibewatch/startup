  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业变现架构
        blocks:
          - type: paragraph
            body: >
              PsiQuantum 目前本质上属于尚无商业化收入的量子硬件与系统基础设施开发商，尚未产生任何商业经常性收入或标准化软件订阅收入。公司近期的商业化动作主要围绕新推出的软件环境 PsiQuantum
              Construct 展开；该平台旨在让企业及政府科研人员在物理硬件就绪之前，能够开发、仿真并评估容错量子算法。尽管 Construct
              为算法联合研发与资源估算提供了切入点，但该平台目前仅属于算法探索与需求推演工具，并非规模化商业变现引擎。公司与 Airbus、Lockheed Martin 以及 Brookhaven National
              Laboratory 等行业伙伴签署的商业合作协议，本质上也多为联合研发与前沿科研合作，而非标准按用量付费的软件销售合同。


              实用级量子计算的商业变现路径目前仍完全处于预期阶段。公司计划在澳大利亚 Brisbane 和美国伊利诺伊州 Chicago 建设实用级量子计算中心，目标在 2027
              年左右启动早期系统运行。未来潜在收入模式预计涵盖基于云端的量子算力即服务（QCaaS）、专属机时预订以及定制化主权算力基础设施交付。然而，实际商业定价机制、分级价格体系、每小时算力费率及长期预订合同承诺均未公开确立，这对拟进入的投资机构构成了显著的尽调信息缺口。
