      - number: '1.2'
        title: 资本结构、估值演进与运营规模
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的资本结构呈现出顶级风投财团高额注资与公共部门大规模协同投资并重的格局 (CO006)。2025 年 9 月，公司完成由 BlackRock、Temasek 与 Baillie
              Gifford 领投的 $1.0 billion Series E 轮融资，投后估值达 $7.0 billion，NVIDIA 旗下 NVentures、Macquarie Capital 及 Qatar
              Investment Authority 等战略与机构投资者跟投 (CO007)。未经证实的私募市场与二级交易平台数据显示，2026 年 5 月其累计融资规模进一步扩大至 $2.4B 至 $3.8B，估值高达
              $10.5B；但二级市场经纪商明确提示，Pre-IPO 额度缺乏流动性、未经官方证实且面临极高执行风险 (CO008)。              在运营规模上，公司在 Palo Alto、Brisbane 及
              Chicago 共有约 576 至 654 名员工，远高于 2021 年 Series D 融资时的约 150 人 (CO009)。商业化运营收入依然未经证实，且未披露公开 ARR 或产品销售额；第三方机构估算的
              $250M 至 $500M 年收入并未得到原始监管申报文件支持，本质上属于模型推算或政府补贴现金流，而非可持续的企业级软件经常性收入 (CO010)。
