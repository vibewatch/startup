            body: >-
              鉴于现有保留材料均未证实公司当前的实际收入、利润率或待履约订单量，采用基于里程碑的估值框架远比依赖收入倍数更具说服力。在乐观情景下，必须先具备独立的系统验证与明确的商业化需求，方能给予高于据报道的 $10.5
