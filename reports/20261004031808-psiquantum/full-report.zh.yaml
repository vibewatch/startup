      - number: '7.2'
        title: 运营、制造与供应链脆弱性
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 最核心的运营风险在于：能否将硅光子芯片组从试验性先导晶圆试产推进至高良率的大规模量产。与依赖定制实验室加工的传统超导量子路线不同，PsiQuantum 将其核心 Omega 硅光子芯片交由
              GlobalFoundries 位于纽约州 Malta 的 Fab 8 工厂制造。虽然这种“代工优先”模式充分借力了成熟的商用半导体工艺设备，但也使其在先进制程光刻与晶圆制造上对 GlobalFoundries
              形成了单点供应商依赖。此外，PsiQuantum 依赖自研的特殊专有材料，尤其是其在加州自有工厂生产的 300mm 钛酸钡（BTO）晶圆，随后需将其融入 GlobalFoundries
              的晶圆生产流以制备超高性能电光开关。晶圆键合失误、单光子光耦合器插入损耗超标，或工作在 2–4
              开尔文（Kelvin）低温机柜内部出现封装缺陷等任何环节出问题，都会导致硬件部署全面停滞。此外，公司高管治理层正处于过渡期：2026 年 2 月，联合创始人 Jeremy O'Brien
              转任执行董事长，半导体产业老将 Victor Peng 出任临时首席执行官，在关键的工程落地周期内，正式的接班人选仍然悬而未决。
