evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-runway
    missingEvidence: >-
      Audited financial statements detailing annual operating expenses, research cash burn rate, and remaining cash
      runway balance.
    whyItMatters: >-
      Without cash burn and operating runway metrics, underwriting PsiQuantum's solvency through its 2027 prototype
      milestone relies entirely on speculation.
    diligencePath: >-
      Obtain confidential management accounts or audited Series E financial statements through an investor access data
      room.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: missing-source
    severity: material
    topic: commercial-contracts
    missingEvidence: >-
      Binding commercial customer reservation agreements, pricing terms, or paid enterprise pilots for post-2027 quantum
      compute access.
    whyItMatters: >-
      Current enterprise software (Construct) is distributed free and open access, leaving long-term enterprise revenue
      viability unproven.
    diligencePath: Request customer contracts, commercial off-take agreements, or paid pilot statements under NDA.
    relatedQuestionRefs:
      - QO001
      - QO005
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Exhaustive equity cap table showing exact percentage ownership, voting control distribution, and liquidation
      preferences across all investor classes.
    whyItMatters: Determines minority investor governance influence and economic dilution risks ahead of potential public listing.
    diligencePath: Inspect certificate of incorporation and formal Series E cap table schedule.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-pricing-model
    missingEvidence: >-
      Absence of public pricing schedules, subscription terms, or unit economics for post-2027 commercial quantum
      compute center access.
    whyItMatters: >-
      Prevents reliable bottom-up modeling of Serviceable Obtainable Market (SOM) and revenue run-rate for commercial
      enterprise customers.
    diligencePath: >-
      Review future customer commercial pilot contracts, early access program subscription terms, or disclosures under
      U.S. and Australian facility operational frameworks.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: private-secondary-valuation
    missingEvidence: >-
      Reconciliation between the $7.0B Series E primary valuation and secondary market transactions valuing the equity
      between $4.6B and $10.5B.
    whyItMatters: >-
      Divergent valuations reflect extreme illiquidity and uncertainty regarding execution timelines toward 2027
      operational targets.
    diligencePath: >-
      Examine secondary share transfer restriction waivers, Form D filings, and broker transaction logs across Forge,
      EquityZen, and StartEngine.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: >-
      Audited financial statements detailing monthly cash burn rate, operating cash balance, and facility capex
      breakdown.
    whyItMatters: >-
      Without cash burn and runway metrics, underwriters cannot determine how long current liquidity will sustain
      capital expenditures prior to 2027 system completion.
    diligencePath: >-
      Request confidential quarterly financial management packages, cash flow statements, and capital commitment
      forecasts directly from the CFO.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: hardware-benchmarking
    missingEvidence: >-
      Independent third-party benchmarks or experimental data proving integrated single-photon gate fidelity and
      threshold error rates on Alpha System hardware.
    whyItMatters: >-
      Without physical demonstration of error-corrected logical qubit operations, the million-qubit scalability thesis
      remains a theoretical model.
    diligencePath: >-
      Review future peer-reviewed publications from Alpha System experimental runs and DARPA QBI Stage C milestone
      validation disclosures.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      No public disclosures or customer audit records detailing customer renewal rates, retention, or churn for
      PsiQuantum Construct software access.
    whyItMatters: >-
      Prevents underwriting software adoption durability and measuring whether enterprise partners convert from
      exploratory trials into ongoing users.
    diligencePath: >-
      Request customer engagement telemetry, seat growth, and renewal history for the Construct platform directly from
      management under NDA.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: blocking
    topic: commercial-contract-values
    missingEvidence: >-
      Commercial contract values, milestone delivery schedules, and licensing terms for enterprise partners (Lockheed
      Martin, Airbus, Mercedes-Benz).
    whyItMatters: >-
      Essential to determining whether industrial co-design partnerships generate near-term cash flows or merely
      represent unmonetized technology exploration.
    diligencePath: >-
      Review executed master service agreements, statement of work milestones, and IP rights sharing provisions with
      enterprise co-design partners.
    relatedQuestionRefs:
      - QU002
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Audited financial statements detailing quarterly cash burn, facility capex for Brisbane and Chicago, and operating
      budget breakdown.
    whyItMatters: >-
      Without disclosed operating burn and facility capex, investors cannot underwrite how long the $1 billion Series E
      and co-investment capital will last.
    diligencePath: Request private financial model, audited balance sheet, and capex drawdown schedule from company management.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: operating-financials
    missingEvidence: Audited revenue, gross margin, operating expense, burn, unrestricted cash, committed project funding, and runway.
    whyItMatters: >-
      Without operating and liquidity data, the capital required to reach deployment and the probability of further
      dilution cannot be modeled.
    diligencePath: >-
      Review audited financial statements, monthly management accounts, cash schedules, project budgets, and
      board-approved financing plans.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: security-terms
    missingEvidence: >-
      Fully diluted capitalization, round documents, liquidation preferences, participation rights, debt, warrants, and
      government-funding conditions.
    whyItMatters: >-
      Headline post-money valuation does not reveal the economics, seniority, dilution, or downside borne by a new
      investor.
    diligencePath: >-
      Obtain the capitalization table, charter, financing agreements, side letters, debt schedules, and government award
      contracts.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Signed customer commitments, pricing, contracted backlog, revenue recognition assumptions, and credible exit or
      liquidity timing.
    whyItMatters: >-
      Commercial proof and a realizable exit are required to translate technical progress into a target return and
      holding period.
    diligencePath: >-
      Review customer contracts and pipeline, interview counterparties, validate pricing and backlog, and obtain
      board-level liquidity planning.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: independent-technical-validation
    missingEvidence: >-
      Independent system-level validation of integrated yields, error-corrected performance, uptime, and deployment
      milestones.
    whyItMatters: >-
      Company-issued component metrics do not by themselves establish utility-scale system performance or the schedule
      assumed by a premium valuation.
    diligencePath: >-
      Commission an independent technical review and inspect foundry, packaging, networking, cooling, and
      site-commissioning data.
    relatedQuestionRefs:
      - QV002
      - QV008
