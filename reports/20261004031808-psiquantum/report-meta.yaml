companyProfile:
  summary: >-
    PsiQuantum is a late-stage private quantum-computing developer building utility-scale photonic fault-tolerant
    systems and the Construct software platform. It remains pre-revenue in the commercial sense, but it has assembled a
    substantial capital base, major sovereign and defense commitments, and an increasingly industrialized deployment
    plan across Brisbane and Chicago. The business is now run by Victor Peng as CEO with Jeremy O'Brien as Executive
    Chairman, and the public evidence still leaves cash burn, preference stack terms, and customer monetization
    unresolved.
