  topStrengths:
    - Strong capital access and sovereign backing give PsiQuantum real runway to pursue a utility-scale deployment plan.
    - The photonic, semiconductor-fabrication thesis is more industrially concrete than many quantum peers.
    - Company disclosures now show a more mature execution structure across leadership, foundry, and site buildout.
  topRisks:
    - >-
      Cash burn, runway, and full financing terms are still not publicly disclosed, so downside cannot be modeled
      cleanly.
    - System-level technical validation and schedule risk remain unresolved until independent results arrive.
    - Commercial pricing, backlog, and exit liquidity are still speculative.
    - A stretched private-market valuation leaves little margin for execution slippage.
  unresolvedGaps:
    - Audited cash burn, unrestricted cash, and runway through the 2027 deployment window.
    - Full financing documents, liquidation preferences, debt, warrants, and government award conditions.
    - Independent system-level validation of utility-scale performance, yields, uptime, and commissioning milestones.
    - Signed customer commitments, pricing, backlog, and an executable liquidity path.
