callouts:
  - calloutType: "risk"
    title: "Acute Sovereign Concentration and Absence of Commercial Recurring Revenue"
    body: "PsiQuantum's commercial posture presents a dual-edged profile for late-stage investors. While securing multi-hundred-million-dollar commitments from the Australian government and U.S. federal programs validates its technological credibility, it leaves the company virtually 100% dependent on public-sector milestones and subsidies (CU017). With zero reported commercial software ARR and no delivered hardware systems (CU002, CU010), commercial viability hinges entirely on whether exploratory enterprise partners (Lockheed Martin, Mercedes-Benz, Airbus) will convert into paying utility-scale customers post-2027 (CU013, CU016)."
    claimRefs:
      - "CU002"
      - "CU010"
      - "CU013"
      - "CU016"
      - "CU017"
  - calloutType: "insight"
    title: "Software Pre-Emption via Construct and the Coder Infrastructure Layer"
    body: "By releasing the Construct platform and embedding self-hosted Coder infrastructure, PsiQuantum has effectively decoupled developer ecosystem building from physical quantum hardware availability (CU007, CU008). This approach enables the company to seed its proprietary Workbench FTQC programming models across leading Fortune 500 research departments and national laboratories years before the Brisbane and Chicago systems achieve operational status, establishing early software lock-in and switching costs (CU009, CU015)."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU015"
