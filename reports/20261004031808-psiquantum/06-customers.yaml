chapter:
  number: 6
  title: "Customers"
  summary: "PsiQuantum operates primarily as a pre-commercial deep-tech enterprise without recurring commercial product revenue, deriving its current customer and user traction from sovereign co-development partnerships, national laboratories, and early enterprise algorithm co-design engagements. Its commercial adoption surface is currently anchored by the PsiQuantum Construct platform, while long-term utility-scale system monetization faces extreme customer concentration and unvalidated commercial willingness-to-pay."
sections:
  - id: "customer-segmentation-landscape"
    title: "Customer Base Segmentation and Stakeholder Architecture"
    body: "PsiQuantum's customer and counterparty landscape fundamentally diverges from conventional enterprise software or hardware business models (CU001). Because utility-scale fault-tolerant quantum computing (FTQC) hardware remains under multi-year construction across facilities in Brisbane, Australia and Chicago, Illinois, the company has no general-availability hardware product deployed in production customer datacenters (CU002). Instead, customer engagements are stratified across three distinct tiers: sovereign defense and economic development authorities, national research laboratories, and Fortune 500 enterprise algorithm co-design partners (CU003). Sovereign sponsors represent the primary financial counterparty base today, providing anchor funding and infrastructure site subsidies under national strategic mandates (CU004). Enterprise commercial clients engage primarily through joint research initiatives in computational chemistry, battery materials, aerodynamics, and logistics, collaborating on fault-tolerant algorithm development rather than procuring commercial quantum compute capacity (CU005). The strategic buyer in these enterprise organizations is typically the Chief Technology Officer, Head of R&D, or Advanced Computing Director, whereas government agencies are motivated by national technological sovereignty and supply-chain security."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-software-surfaces"
    title: "Commercial Adoption Trajectory and Software Access Surfaces"
    body: "In the absence of commercial quantum processor shipments, PsiQuantum's near-term user adoption trajectory is centered entirely on its software and development platforms (CU006). The company introduced PsiQuantum Construct, a web-based platform designed to enable internal algorithm teams, external academic researchers, and institutional customers to build, optimize, and simulate fault-tolerant quantum algorithms (CU007). To deliver Construct's Quantum Development Environments (QDEs) securely, PsiQuantum partnered with Coder to deploy self-hosted workspaces on AWS and Kubernetes pods, replacing multi-day manual onboarding workflows with instant environment access (CU008). This architecture provides customer researchers with pre-configured access to PsiQuantum's proprietary Workbench FTQC programming framework, Python optimization libraries, and hosted Git repositories without exfiltrating proprietary quantum intellectual property (CU009). Beyond early research workshops and academic access, broader quantitative adoption metrics such as monthly active developers, enterprise seat counts, and recurring software revenue remain completely undisclosed by the company (CU010). Third-party secondary market materials acknowledge the absence of commercial product cash flows despite private capital momentum."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof-concentration"
    title: "Named Customer Proof, Retention Realities, and Concentration Vulnerabilities"
    body: "Verification of PsiQuantum's customer traction reveals a tight cluster of high-profile exploratory partnerships rather than commercial production contracts (CU012). Official disclosures and verified industry releases confirm active collaborations with premier aerospace, automotive, chemical, and pharmaceutical leaders, including Lockheed Martin, Airbus, Mercedes-Benz, Boehringer Ingelheim, and Mitsubishi Chemical (CU013). These engagements focus on long-horizon algorithm development, such as simulating molecular catalysts for clean fertilizer, battery electrolyte chemistry, and advanced materials (CU014). Additionally, public-sector commitments include a software collaboration with the U.S. Department of Energy's Brookhaven National Laboratory to explore scientific applications on Construct, alongside a definitive $100 million U.S. Department of Commerce award (CU015). However, retention metrics like Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and customer churn rates are non-applicable given the lack of recurring subscription billing (CU016). This structure introduces acute customer and revenue concentration risk: PsiQuantum is overwhelmingly reliant on government commitments in the United States and Australia, exposing the company to major political, regulatory, and milestone verification vulnerabilities (CU017)."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
      - "CU017"
    tableRefs:
      - "TU003"
