chapter:
  number: 7
  title: "Risks"
  summary: "PsiQuantum faces concentrated operational, partner, and commercialization risks centered on delivering million-qubit systems at its Brisbane and Chicago facilities by 2027-2028. Critical exposures include sole-foundry reliance on GlobalFoundries, interim executive leadership during industrial scale-up, unverified long-term commercial software monetization, and dependency on public co-investment capital."
sections:
  - id: "executive-summary-risk-landscape"
    title: "Severity-Ranked Risk Architecture"
    body: "Evaluating PsiQuantum's investment thesis requires balancing extraordinary technical milestones against severe industrialization, governance, and counterparty dependencies. PsiQuantum's strategy is predicated on bypassing intermediate noisy intermediate-scale quantum (NISQ) systems in favor of building utility-scale, million-qubit fault-tolerant quantum computers (FTQC). This all-or-nothing approach concentrates organizational exposure onto the operational execution of two flagship facilities: Moreton Bay Central in Queensland, Australia (targeted for operational delivery by the end of 2027) and the Illinois Quantum and Microelectronics Park in Chicago (scheduled for initial phase completion in 2027 with ongoing deployment into 2028). The company has secured over $1.66 billion to $1.8 billion in total equity financing—including a $1 billion Series E round in September 2025 valuing the firm at $7 billion—alongside substantial government backing such as an A$940 million Australian package and a $100 million U.S. CHIPS Act award. However, the operational complexity of integrating cryogenic cooling cabinets, Barium Titanate (BTO) optical switches, and standard telecom fiber interconnects creates significant residual vulnerability if schedule delays occur before commercial revenues materialize."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-manufacturing-supply-chain"
    title: "Operational, Manufacturing, and Supply Chain Vulnerabilities"
    body: "The core operational risk for PsiQuantum lies in scaling silicon photonic chipsets from pilot wafer runs into high-yield, high-volume production. Unlike traditional superconducting quantum architectures that require bespoke laboratory fabrication, PsiQuantum manufactures its Omega silicon photonic chipset at GlobalFoundries' Fab 8 facility in Malta, New York. While this foundries-first approach leverages commercial semiconductor tooling, it creates a single-point supplier dependency on GlobalFoundries for advanced lithography and wafer processing. Furthermore, PsiQuantum relies on specialized proprietary materials, specifically 300mm wafers of Barium Titanate (BTO) manufactured at its internal California facilities and subsequently integrated into the GlobalFoundries wafer flow to produce ultra-high-performance electro-optic switches. Any failure mode in wafer bonding, insertion-loss degradation across single-photon optical couplers, or packaging defects inside cryogenic cabinets operating at 2-4 Kelvin would stall hardware deployment. In addition, the company's executive governance is in active transition: in February 2026, co-founder Jeremy O'Brien transitioned to Executive Chairman while veteran semiconductor executive Victor Peng assumed the role of Interim CEO, leaving permanent succession open during a critical deployment cycle."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
  - id: "partner-dependency-counterparty-exposure"
    title: "Counterparty Concentration and Sovereign Dependency"
    body: "PsiQuantum's capital structure and site deployment roadmaps demonstrate extreme concentration in government co-investments and sovereign industrial partnerships. The Brisbane deployment is heavily financed by an A$940 million package from the Australian Commonwealth and Queensland governments, while the Chicago facility anchors a state-backed multibillion-dollar, 128-acre quantum campus supported by Illinois and federal initiatives. Failure to meet construction or performance milestones could trigger clawback mechanisms, grant renegotiations, or political scrutiny in host jurisdictions. Similarly, on the software and commercialization front, PsiQuantum launched its Construct platform to enable enterprise and national laboratory algorithm development, announcing collaborations with the U.S. Department of Energy's Brookhaven National Laboratory, Airbus, and Lockheed Martin. However, with Construct made available via open and free access developer initiatives and government research collaborations, near-term commercial ARR remains unproven, leaving the company reliant on external capital markets and public financing until utility-scale hardware is demonstrated."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR003"
