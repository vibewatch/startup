callouts:
  - calloutType: "risk"
    title: "Binary Execution Profile and Sole-Foundry Vulnerability"
    body: "PsiQuantum's decision to bypass commercial NISQ systems means that value realization is entirely contingent on utility-scale deployment in 2027-2028. Sole-source fabrication of the Omega chipset at GlobalFoundries Fab 8 creates an acute operational bottleneck with no rapid second-source fallback if packaging or wafer-level defects arise."
    claimRefs:
      - "CR001"
      - "CR005"
      - "CR006"
  - calloutType: "insight"
    title: "Capital Buffer Offsets Timeline Risk"
    body: "The closing of a $1 billion Series E round in September 2025 at a $7 billion valuation, combined with $100 million in CHIPS Act support and A$940 million in Australian backing, provides PsiQuantum with substantial financial runway to absorb engineering iterations ahead of the Brisbane system launch."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR011"
