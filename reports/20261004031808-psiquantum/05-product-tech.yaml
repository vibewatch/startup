chapter:
  number: 5
  title: "Product & Technology"
  summary: "PsiQuantum bypasses noisy intermediate-scale quantum devices to build utility-scale fault-tolerant quantum supercomputers using silicon photonics manufactured at GlobalFoundries and SkyWater. While optical waveguides and superconducting single-photon detectors leverage high-volume fab processes, linear optics gate non-determinism and optical switch insertion loss impose severe quantum error correction overheads that require unvalidated million-qubit scale."
sections:
  - id: "system-concept-and-core-proposition"
    title: "Fault-Tolerant Architecture and the Million-Qubit Photonic Bet"
    body: "PsiQuantum approaches quantum computing on the foundational premise that commercial utility requires fault tolerance, necessitating approximately one million physical qubits to execute quantum error correction (QEC) codes. Rather than pursuing noisy intermediate-scale quantum (NISQ) systems with superconducting transmons or trapped ions, the company relies on single-photon optical qubits. Photons exhibit zero susceptibility to thermal degradation and electromagnetic interference, allowing control electronics to sit close to optical qubits without the massive dilution refrigeration infrastructure typical of matter-based qubits. However, because linear optics gate operations are inherently probabilistic with failure rates between 25% and 50%, the architecture consumes an extensive share of its QEC budget purely mitigating gate non-determinism via spatial and temporal multiplexing."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "hardware-stack-and-foundry-manufacturing"
    title: "Foundry Manufacturing, Omega Chipsets, and Cryogenic Form Factors"
    body: "PsiQuantum's hardware strategy relies on industrial semiconductor fabs rather than specialized boutique cleanrooms. The core Omega silicon photonic chipset is manufactured on 300mm wafer lines at GlobalFoundries' Fab 8 in Malta, New York, complemented by 200mm development engagements with SkyWater Technology in Minnesota. To realize low-loss optical switching, the company manufactures barium titanate (BTO) electro-optic wafers in California and heterogeneously integrates them with GlobalFoundries silicon photonics. Cryogenic cabinets operate between 2 and 4 kelvins using Linde-manufactured cryoplants to chill superconducting nanowire single-photon detectors (SNSPDs), housing approximately 250 photonic chips per rack. Standard telecom optical fiber links chips and cabinets over hundreds of meters without optical transduction, though waveguide coupling and switch insertion loss remain the primary technical bottleneck."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE001"
      - "TE003"
  - id: "software-stack-and-deployment-roadmaps"
    title: "Construct Software Platform, Ecosystem Integrations, and Site Execution"
    body: "To bridge customer workflows into fault-tolerant execution, PsiQuantum launched Construct, a quantum software platform and SDK providing visual quantum circuit design, Python optimization tools, and resource estimation for fault-tolerant algorithms. The platform supports early application exploration with industrial partners including Airbus, Lockheed Martin, Mercedes-Benz, Boehringer Ingelheim, and Mitsubishi Chemical, as well as academic collaborations with Brookhaven National Laboratory. Physical deployment centers on the Alpha System testing facility in Milpitas, California, alongside utility-scale facility groundbreakings in Brisbane, Australia, and Chicago, Illinois. Interim leadership under CEO Victor Peng prioritizes transitioning from foundry process development to systems integration, though complete fault-tolerant quantum algorithms cannot run on hardware until the entire integrated stack achieves threshold error rates."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
