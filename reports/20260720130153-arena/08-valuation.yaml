  - CV034
  - CV035
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Revenue quality
    - NRR/GRR, cohorts, contract duration, expansion rates
    - Determines whether run-rate growth deserves premium comp treatment
    - Management / finance data room.
  - - Customer concentration
    - Top-customer share, lab vs enterprise mix
    - Determines durability and downside risk
    - Management revenue segmentation.
  - - Pricing / commitments
    - Rate cards, minimums, true usage patterns
    - Determines gross margin and comparability against peers
    - Sales leadership and sample order forms.
  - - Benchmark governance
    - Anti-gaming, appeals, methodology oversight
    - Determines moat durability and legal / reputational resilience
    - Trust / research leadership review.
  - - Unit economics
    - Gross margin, compute cost, support burden
    - Determines whether premium infrastructure valuation is deserved
    - Finance + infra engineering diligence.
  - - Multi-homing behavior
    - How often customers also use Patronus, Langfuse, Fiddler, internal build
    - Determines whether Arena is core infrastructure or one tool in a stack
    - Customer reference calls and architecture reviews.
  notes: These asks are the minimum package required to move from narrative support to price-supported conviction.
