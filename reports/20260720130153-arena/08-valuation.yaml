- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what would change the view
  rows:
  - - Arena is becoming the public reference layer for frontier-model evaluation.
    - Evidence that rankings are easier to replicate or less decision-relevant than they appear would weaken this thesis.
  - - Arena has converted community attention into real commercial demand unusually fast.
    - If revenue quality is concentrated, one-off, or low-margin, the thesis weakens materially.
  - - Independent AI evaluation could become critical infrastructure as models proliferate.
    - If labs shift budget to internal stacks or private vendors, Arena’s category role narrows.
  - - The current valuation may still be justified if growth stays extraordinary.
    - If growth slows before disclosure quality improves, the price likely rerates downward.
  notes: The thesis is attractive, but every supporting point is still sensitive to evidence gaps around durability and conversion.
