- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Benchmark-integrity controversy
    - Credible public dispute not resolved with transparent methodology evidence
    - Damages neutral-referee moat and premium multiple support
    - Pause or avoid investment until resolved.
  - - Concentration surprise
    - Revenue heavily concentrated in a few labs or short-duration programs
    - Weakens durability and makes current valuation hard to defend
    - Require lower entry price or stronger terms.
  - - Weak attach / retention
    - High traffic but poor paid expansion or low renewal quality
    - Turns community scale into lower-quality proof
    - Move from research-more toward avoid at current price.
  - - Governance gap
    - Insufficient privacy, security, or enterprise diligence artifacts
    - Slows enterprise adoption and compresses attainable multiple
    - Assume slower commercialization and lower fair value.
  - - Adjacent platform displacement
    - Customers standardize on broader control-plane stacks
    - Narrows Arena’s role to signaling rather than core workflow
    - Reframe company as thinner product category.
  notes: These triggers are designed to convert qualitative concerns into monitorable investment rules.
