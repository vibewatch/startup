- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Arena compounds well above the June 2026 run rate, broadens enterprise adoption, and preserves neutral-referee status.
    - Current price can still work if scale and margin resemble premium AI infrastructure outcomes over time.
    - Governance controversy or attach weakness would break this path.
    - Possible, but requires multiple unverified assumptions to prove true.
  - - Base
    - Arena stays important but customers multi-home and pricing remains partly bespoke.
    - Business can justify a strong company outcome, but today's entry price likely leaves limited margin of safety.
    - Concentration, slower attach, and multiple compression.
    - Most consistent with current evidence.
  - - Bear
    - Public prestige outpaces durable enterprise economics or benchmark trust weakens.
    - Valuation compresses toward a more ordinary software or tooling multiple.
    - Trust shock, weak retention, or customer concentration.
    - A real downside path because public evidence leaves these variables unresolved.
  notes: The base case does not predict failure; it predicts a strong company with less room for multiple expansion from today’s mark.
