- id: diligence-asks-and-kill-triggers
  title: 'Diligence Asks and Kill Triggers: Price Sensitivity Should Be Explicit'
  body: 'At this valuation, diligence has to focus on what could re-rate the business down as much as what could unlock more upside. The first set of asks is revenue quality: customer mix, concentration, NRR/GRR, usage durability, gross margin, and cohort performance. The second is moat durability: anti-gaming controls, methodology governance, and proof that Arena data predicts outcomes better than alternative evaluation systems. The third is commercial structure: pricing, minimum commitments, expansion motion, and how often customers use Arena alongside other tools rather than as a system of record. Finally, investors need an explicit price discipline. If management can show diversified, sticky, high-margin usage and credible governance, the case can move toward track or buy even at a stretched valuation. If those facts disappoint, the same company quality could deserve a much lower multiple. That is why the recommendation is not avoid: the asset is strong. It is also why the recommendation
    is not buy: the evidence that supports the current mark is still incomplete.'
