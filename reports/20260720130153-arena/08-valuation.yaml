- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Arena (private)
    - US$1.7B post-money Jan 2026; ~US$100M annualized run rate by Jun 2026
    - ~17x price-to-run-rate using later June figure
    - Closest direct mark on the asset
    - Valuation date predates the higher run-rate figure; revenue is consumption-based.
  - - Palantir
    - US$317B market cap Jul 2026; 2025 revenue US$4.475B; 2026 guide +61%
    - Public market pays extraordinary premium for AI decision/intelligence leadership
    - Relevant for “AI decision layer” narrative
    - Far larger, profitable, and much more disclosed.
  - - Datadog
    - ~25.9x EV/revenue in cited public-comp set
    - Illustrates premium for trusted observability infrastructure
    - Relevant for infrastructure-like workflow criticality
    - Public SaaS with stronger retention and disclosure.
  - - Public AI software sector
    - 3.6x to 15.5x NTM revenue range in July 2026 sector frame
    - Shows broad dispersion and no single “AI multiple”
    - Useful ceiling/floor context
    - Sector aggregates are not tailored to Arena’s hybrid model.
  - - Decision intelligence market
    - US$20.7B 2026 market estimate, 14.4% CAGR to 2033
    - Supports large category backdrop
    - Relevant for TAM support
    - Too broad versus Arena’s narrower evaluation wedge.
  notes: Comps are directional. They support a premium narrative, but not false precision around intrinsic value.
