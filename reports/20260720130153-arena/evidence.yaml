evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, voting control, ownership concentration, and liquidation-preference stack.
    whyItMatters: >-
      These terms determine who controls strategic direction and how much economic value a new investor can actually
      capture.
    diligencePath: >-
      Request the current board deck, cap table, charter documents, and summary of investor rights from management or
      counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-footprint
    missingEvidence: Verified employee count, location distribution, and formal headquarters disclosure.
    whyItMatters: >-
      Hiring intensity and geographic footprint are useful proxies for burn, execution complexity, and operational
      maturity.
    diligencePath: >-
      Request an org chart, payroll headcount by function/location, and lease or registered-office detail from the
      company.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Customer concentration, contract mix, cohort retention, and the bridge from consumption run rate to recognized
      revenue.
    whyItMatters: >-
      The difference between usage-based experimentation revenue and durable contracted demand will determine the right
      valuation framework.
    diligencePath: >-
      Request a by-customer revenue bridge, cohort analysis, booking-to-revenue waterfall, and renewal data for AI
      Evaluations.
    relatedQuestionRefs:
      - QO015
  - type: conflicting-data
    severity: minor
    topic: founding-date-definition
    missingEvidence: >-
      A canonical company statement that reconciles 2022, 2023, and April 2025 dates across tracker, project, and
      incorporation narratives.
    whyItMatters: >-
      Conflicting founding dates can distort time-to-scale narratives and peer comparisons, especially in a Series A
      underwriting context.
    diligencePath: >-
      Ask management to define the official founding date convention: research-project inception, legal incorporation,
      or commercial launch.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: direct-ai-evaluation-tam
    missingEvidence: A bottom-up market model for paid AI evaluations, observability, and governance spend by customer segment.
    whyItMatters: >-
      Broad decision-intelligence TAM figures are too loose to support entry pricing or long-term revenue penetration
      assumptions.
    diligencePath: >-
      Build a bottoms-up model from target labs, enterprise AI teams, contract sizes, attach rates, and likely
      regulated-vertical budgets.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
      - TM005
  - type: private-evidence-only
    severity: material
    topic: budget-owner-standardization
    missingEvidence: Closed-won deal data by buyer function, procurement path, and average contract size.
    whyItMatters: >-
      If budgets are fragmented across research, platform, and compliance teams, sales efficiency and expansion may be
      weaker than top-line demand suggests.
    diligencePath: Request CRM exports and cohort analysis showing buyer title, deal stage, contract value, and expansion path.
    relatedQuestionRefs:
      - QM013
      - QM014
    relatedTableRefs:
      - TM003
      - TM005
  - type: private-evidence-only
    severity: material
    topic: pilot-to-production-conversion
    missingEvidence: >-
      Pipeline conversion from free leaderboard users or pilot evaluation programs into paid recurring production
      accounts.
    whyItMatters: >-
