  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, voting control, ownership concentration, and liquidation-preference stack.
    whyItMatters: These terms determine who controls strategic direction and how much economic value a new investor can actually capture.
    diligencePath: Request the current board deck, cap table, charter documents, and summary of investor rights from management or counsel.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-footprint
    missingEvidence: Verified employee count, location distribution, and formal headquarters disclosure.
    whyItMatters: Hiring intensity and geographic footprint are useful proxies for burn, execution complexity, and operational maturity.
    diligencePath: Request an org chart, payroll headcount by function/location, and lease or registered-office detail from the company.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Customer concentration, contract mix, cohort retention, and the bridge from consumption run rate to recognized revenue.
    whyItMatters: The difference between usage-based experimentation revenue and durable contracted demand will determine the right valuation framework.
    diligencePath: Request a by-customer revenue bridge, cohort analysis, booking-to-revenue waterfall, and renewal data for AI Evaluations.
    relatedQuestionRefs:
    - QO015
  - type: conflicting-data
    severity: minor
    topic: founding-date-definition
    missingEvidence: A canonical company statement that reconciles 2022, 2023, and April 2025 dates across tracker, project, and incorporation narratives.
    whyItMatters: Conflicting founding dates can distort time-to-scale narratives and peer comparisons, especially in a Series A underwriting context.
    diligencePath: 'Ask management to define the official founding date convention: research-project inception, legal incorporation, or commercial launch.'
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO004
