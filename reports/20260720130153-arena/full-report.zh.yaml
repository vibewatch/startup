      - number: '2.2'
        title: 规模信号很大，但直接市场比标题暗示的更难切出来
        blocks:
          - type: paragraph
            body: >-
              目前最强的公开市场数字仍是相邻市场，而非直接市场。Grand View 估计，全球决策智能市场 2026 年为 $20.7 billion，到 2033 年增至 $53.2 billion，CAGR 为
              14.4%；North America 份额超过 44%， 云交付份额超过 54%。这些数字重要，因为它们说明 AI 辅助企业决策、工作流仪表化和云原生分析的 预算真实且在扩大。但 Arena
              的具体切口不是整个市场。更近的机会，是 AI 预算中用于模型基准测试、 红队测试、后训练评估、可观测性和治理的那一部分。需求条件支持这个更窄切口： Forrester 称四分之三企业领导者正在采用智能体
              AI，但只有少数实现有意义的生产部署。Deloitte 同样显示， AI 访问快速上升、规模化生产预计增加，而治理成熟度严重滞后。实际含义是，Arena 受益于可信 AI 控制的强自上而下
              需求，但自下而上采用会继续不均，直到企业能治理智能体、信任其数据输入，并把评估支出挂到可衡量 ROI 上。
