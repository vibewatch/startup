      - number: '7.3'
        title: 依赖、财务和 GTM 风险：多栖和转化比流量更重要
        blocks:
          - type: paragraph
            body: >-
              Arena 的依赖画像很微妙。它不是硬件或制造创业公司，但仍依赖一组外部主体：从排名中受益的前沿模型提供商、云和推理基础设施、公共流量渠道，以及愿意为评估产品 付费、而不是把 Arena
              当作免费研究工具的企业客户。公司的融资实力降低了近期偿付风险，但没有降低模式风险。最强商业担忧是转化质量。公开流量、社区投票和发布影响力， 并不会自动证明收入多元且经常性、低流失或低集中。TechCrunch
              报道把 Arena 描述为 US$100M 业务，但来源组合仍留下不确定性：多少收入来自少数实验室、 多少由用量驱动、企业部署有多黏性。Patronus、Langfuse、Fiddler
              和内部自建选项等相邻供应商意味着客户可以多栖。下行情景不是突然崩塌，而是企业转化放慢、 重算力或支持带来利润率压力，以及非凡品牌动能与不够持久的商业质量之间出现认知缺口。
