    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格背景：本轮已计入极强执行力
        blocks:
          - type: paragraph
            body: >-
              Arena 2026 年 1 月 Series A 融资据报以 US$1.7 billion 投后估值定价，融资 US$150 million；此前 2025 年种子轮估值约 US$600 million。到
              2026 年 6 月，TechCrunch 和 Arena 均披露年化收入运行率达到 US$100 million，高于 2025 年 12 月超过 US$30 million
              的年化用量消耗运行率。这组数字解释了投资人为何兴奋：公司似乎在大约半年内把收入运行率翻了两倍，同时维持极高品类声量。按简单的估值 / 运行率口径，1 月轮估值约等于后来 6 月运行率的
              17x；但这个比较并不完美，因为估值早于收入更新，且 Arena 收入按用量消耗计费，不是传统签约 ARR。即便如此，当前估值已经假设 Arena
              能守住基准信任、把公共流量转成持久付费使用，并避免被相邻可观测性或评测厂商边缘化。换句话说，公司或许仍能用增长消化这个价格，但价格已经不给非受迫失误或证据缺口留下太多空间。
            claimRefs:
