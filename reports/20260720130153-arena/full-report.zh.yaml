  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Arena 在 June 2026 收入运行率之上继续高速复利增长，扩大企业采用，并守住中立裁判地位。
        - 如果长期规模和利润率接近高溢价 AI 基础设施结果，当前价格仍可能跑通。
        - 治理争议或附加销售疲弱会打断这条路径。
        - 有可能，但需要多个未验证假设同时成立。
      - - 基准
        - Arena 仍然重要，但客户会多栖使用，定价也部分保持定制化。
        - 业务足以支撑一家强公司，但以今天的进入价格看，安全边际可能有限。
        - 集中度、附加销售放缓和倍数压缩。
        - 最符合当前证据。
      - - 悲观
        - 公共声誉跑在可持续企业经济性前面，或基准信任走弱。
        - 估值向更普通的软件或工具倍数压缩。
        - 信任冲击、留存偏弱或客户集中。
        - 这是现实的下行情景，因为公开证据还没有解开这些变量。
    notes: 基准情景并不预测失败；它预测的是一家强公司，但从今天的估值看，倍数扩张空间更小。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Arena（未上市）
        - Jan 2026 投后估值 US$1.7B；到 Jun 2026 年化收入运行率约 US$100M
        - 使用后续 June 数据，价格 / 收入运行率为 ~17x
        - 最接近该资产的直接定价
        - 估值日期早于更高的收入运行率数据；收入按消耗计费。
      - - Palantir
        - Jul 2026 市值 US$317B；2025 收入 US$4.475B；2026 指引 +61%
        - 公开市场愿为 AI 决策 / 智能领导地位支付极高溢价
        - 与「AI 决策层」叙事相关
        - 规模大得多、已盈利，披露也多得多。
      - - Datadog
        - 引用的公开可比组中 EV/收入约 25.9x
        - 说明可信可观测性基础设施可获得溢价
        - 与类似基础设施的工作流关键性相关
        - 公开 SaaS 公司，留存和披露更强。
      - - 公开 AI 软件板块
        - July 2026 板块框架中 NTM 收入 3.6x 至 15.5x 区间
        - 显示估值分散，没有单一「AI 倍数」
        - 可作为上限 / 下限参照
        - 行业汇总并非针对 Arena 的混合模式。
      - - 决策智能市场
        - 2026 市场估计 US$20.7B，至 2033 CAGR 14.4%
        - 支撑大品类背景
        - 可支撑总可用市场（TAM）
        - 相比 Arena 更窄的评估切入点，这个口径过宽。
    notes: 可比公司只能提供方向。它们支撑溢价叙事，但不能给内在价值制造虚假精确度。
    claimRefs:
      - CV002
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
    enumerationScope:
      coverage: sample
      basis: >-
        This sample uses the most relevant retained public references for AI infrastructure and decision-intelligence
        framing rather than attempting an exhaustive private-market comp set.
  - id: TV005
    title: 投资逻辑破裂与放弃触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 基准完整性争议
        - 可信公开争议，且未用透明方法论证据解决
        - 损害中立裁判护城河和高溢价倍数支撑
        - 暂停或避开投资，直到争议解决。
      - - 集中度意外
        - 收入高度集中在少数实验室或短周期项目
        - 削弱耐久性，也让当前估值难以自洽
        - 要求更低进入价格或更强条款。
      - - 附加销售 / 留存偏弱
        - 流量高，但付费扩张差或续约质量低
        - 把社区规模变成质量较低的证据
        - 在当前价格下，从继续研究转向回避。
      - - 治理缺口
        - 隐私、安全或企业尽调材料不足
        - 拖慢企业采用，并压缩可获得的倍数
        - 假设商业化更慢，公允价值更低。
      - - 邻近平台替代
        - 客户标准化到更广的控制平面技术栈
        - 把 Arena 的角色从核心工作流收窄为信号层
        - 重新按更薄的产品品类理解公司。
    notes: 这些触发器把定性担忧转成可监控的投资规则。
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入质量
        - NRR / GRR、队列、合同期限、扩张率
        - 决定收入运行率增长是否配得上高溢价可比公司待遇
        - 管理层 / 财务数据室。
      - - 客户集中度
        - 头部客户占比、实验室与企业收入组合
        - 决定耐久性和下行风险
        - 管理层收入分拆。
      - - 定价 / 承诺
        - 价目表、最低承诺、真实使用模式
        - 决定毛利率，以及与同业的可比性
        - 销售负责人和样本订单表。
      - - 基准治理
        - 反作弊、申诉、方法论监督
        - 决定护城河耐久性和法律 / 声誉韧性
        - 信任 / 研究负责人复核。
      - - 单位经济性
        - 毛利率、计算成本、支持负担
        - 决定是否配得上高溢价基础设施估值
        - 财务 + 基础设施工程尽调。
      - - 多栖使用行为
        - 客户有多常同时使用 Patronus、Langfuse、Fiddler、内部自建
        - 决定 Arena 是核心基础设施，还是技术栈中的一个工具
        - 客户访谈和架构复核。
    notes: 这些问题是从叙事支撑走向有价格支撑的信念所需的最低材料包。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV037
      - CV038
      - CV039
      - CV040
