      - number: '2.4'
        title: 增长驱动很强，但市场仍要收一笔信任税
        blocks:
          - type: paragraph
            body: >-
              Arena 的增长逻辑容易理解。模型竞争激烈，智能体扩散，监管者和企业也越来越需要书面证据，证明 AI 系统可测量、 可比较、可控制。Modulos 把 AI 治理描述为 2026 年的独立采购类别，EU AI
              Act 也在稳步把透明度和高风险义务 推入运营现实。与此同时，市场很嘈杂。Forrester 点出治理缺口和信任成本，Deloitte 显示只有五分之一公司对 自主智能体建立了成熟治理，Observer
              分析认为许多智能体项目低估了数据、监控和工作流重设计成本。 FTC 的 AI 执法活动又增加了一层警示：欺骗性或治理薄弱的 AI 主张会招来审查。这组因素给 Arena 创造了经典基础设施式
              市场：需求信号强，但赢家会是进入客户控制平面的供应商，而不是锦上添花的基准层。投资判断的问题不是有没有需求， 而是 Arena 能否把评估做得足够不可或缺，从而顶住更广 AI 平台供应商整合。
