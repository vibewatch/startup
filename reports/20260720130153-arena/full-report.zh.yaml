              Arena 看起来远低于前沿模型实验室的资本强度，因为没有迹象表明它资助基础模型训练，或持有大量模型库存。相反，成本基础似乎集中在评估基础设施、
              云服务、数据管道、排名和评分系统、内容审核、企业产品开发，以及运行大规模对比所需的任何第三方模型或算力访问。Built In 招聘信息在这里很有启发： 公司正在围绕低延迟
              API、流式传输、可观测性、计费、多租户、认证、用量计量和耐用评估产品招聘。这听起来像软件，但并不免费。 Datadog
              的公开文件是这类业务的有用基准，因为它说明，即便成功的基于用量基础设施供应商，也会受到第三方云服务带来的毛利率压力。 Arena 新近完成的 $150 million Series A 和约 $250
              million 累计融资，意味着近期资本充足性很强；但公开来源没有披露账上现金、月度烧钱、
