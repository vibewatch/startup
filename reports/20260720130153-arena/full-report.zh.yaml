      - number: '8.2'
        title: 可比框架：上市 AI 基础设施赢家估值很高，但 Arena 披露深度不够
        blocks:
          - type: paragraph
            body: >-
              上市可比公司只能提供方向性框架，不能给出干净标尺。Multiples.vc 显示，到 2026 年中，高质量 AI 或数据基础设施公司可以按较高远期收入倍数交易。Palantir 和 Datadog
              尤其重要：二者都把高增长和基础设施级战略相关性结合起来。Palantir 2026 年 7 月市值虽然经历股价大幅波动，仍高于 US$317 billion；Datadog 在所引用的数据基础设施样本中约按
              26x EV/revenue 交易。但两家公司在客户增长、现金生成、毛利率和风险因素上的披露，都比今天的 Arena 深得多。Arena 阶段更早、仍是私有公司，而且可能比一般可观测性或 SaaS
              公司更独特；这种独特性能支撑溢价叙事，却不能替代披露。更谨慎的行业框架来自软件倍数分化和决策智能市场报告：广义市场确实支持 AI 原生平台获得有意义估值，但并非每家沾 AI 的公司都配得上 Palantir 或
              Datadog 式溢价。因此，只有在 Arena 能持续突破式增长，并证明基准品牌能转成有韧性的企业经济性，而不只是注意力时，当前估值才说得通。
