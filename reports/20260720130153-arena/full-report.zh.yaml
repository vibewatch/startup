      - number: '1.4'
        title: 里程碑、行业参照价值和重要警示
        blocks:
          - type: paragraph
            body: >-
              Arena 的里程碑显示，公司正从学术可信度转向行业基础设施。Berkeley 和 ICML 材料奠定早期方法论合法性： 原始论文记录超过 240,000 张投票，并发现众包判断与专家评分大体一致。Felicis
              和 TechCrunch 随后描述 商业化阶段：脱离 Berkeley 基础设施、迁移到 LMArena、2025 年注册、September 2025 推出 AI Evaluations， 以及 January
              2026 融资——该轮把可信第三方评估视为更广 AI 生态的基础设施。到 March 2026，Arena 已扩大 产品界面，加入 Document Arena、Video Edit
              Arena、更丰富的价格和上下文窗口排行榜列，以及 Arena Max router。 同样重要的是，外部主体现在会引用这块记分牌：xAI 的 Grok 4.1 发布页明确用 LMArena
              排名证明性能。风险在于， 可见度是双刃剑。Leaderboard Illusion 论文认为，私下测试和数据访问不对称会扭曲排名；Arena 自己的隐私和条款 页面也表明，用户内容可能与第三方 AI
              提供商共享，甚至被公开。Arena 的影响力真实存在，但围绕中立性、数据治理 和基准过拟合的尽调负担也真实存在。
