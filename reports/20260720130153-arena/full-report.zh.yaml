      - number: '8.4'
        title: 尽调问题与否决触发器：价格纪律必须明确
        blocks:
          - type: paragraph
            body: >-
              在这个估值下，尽调不仅要看什么能打开更多上行，也要看什么会让业务被下调重估。第一组问题是收入质量：客户组合、集中度、NRR/GRR、使用持久性、毛利率和队列表现。第二组是护城河耐久性：反作弊控制、方法论治理，以及
              Arena 数据比替代评测系统更能预测结果的证明。第三组是商业结构：定价、最低承诺、扩张动作，以及客户有多常把 Arena
              和其他工具并用，而不是把它当作记录系统。最后，投资者需要明确的价格纪律。如果管理层能证明使用是多元、黏性强、高毛利的，并且治理可信，即便估值偏高，结论也可能转向观察或买入。如果这些事实不达预期，同样优秀的公司质量也可能只配更低倍数。因此，建议不是回避：资产本身很强。建议也不是买入：支撑当前估值的证据仍不完整。
