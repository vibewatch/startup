      - number: '7.4'
        title: 人员、执行和投资逻辑破局点：Arena 必须比自身扩张更快完成制度化
        blocks:
          - type: paragraph
            body: >-
              Arena
              仍是一家年轻公司，正把研究出身的项目快速商业化。这带来典型执行风险：管理层要把一个学术信誉和社区基础都很强的项目，变成可复制的企业平台，同时守住中立性。招聘信号显示，公司还在补工程和基础设施核心能力；这很正常，但也意味着组织厚度还在形成。Arena
              同时要处理消费级规模、前沿实验室关系和企业销售，执行风险因此加大。这些能力并不相同。若公司过度追逐公众关注，企业级控制可能跟不上；若过度转向定制化企业项目，公共数据飞轮可能变弱。因此，否决条件必须写清楚：一旦出现重大的基准完整性争议、社区增长明显放缓且企业扩张无法弥补、客户高度集中证据，或隐私
              / 治理姿态被迫重写，投资逻辑都会受挑战。反过来，如果 Arena 能证明反作弊控制强、客户组合够广、公共流量能持续转化为付费评测，当前风险组合就更容易接受。
