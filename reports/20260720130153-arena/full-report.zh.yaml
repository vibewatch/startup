  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接对手稀少，相邻对手密集
        blocks:
          - type: paragraph
            body: >-
              Arena 的竞争格局至少分为五类。第一类是直接的众包评估同行，试图把公开模型对比转成商业价值。这类公司很少， 现有最佳公开证据显示，最明显的 Yupp 已经关闭。第二类是 LLM 可观测性和控制平面供应商，如
              Langfuse、Fiddler、 Arthur、Arize 和 Braintrust。这些公司没有复制 Arena 的人类偏好飞轮，但会争夺围绕模型质量、追踪、评估和治理的
              同一笔企业预算。第三类是评估和可靠性专家，如 Patronus AI，正在走向更丰富的智能体模拟和自动化压力测试。 第四类是人类标注或 RLHF 替代方案，如 Scale 风格服务；实验室可以用它们替代
              Arena 式公开信号生成。第五类是内部自建 和现状工作流：电子表格、内部评估框架，以及模型提供商原生基准测试。战略含义是，Arena 的护城河不在于拿下每一种
              评估工作流，而在于占住公开、社区扎根的那一层；相邻供应商很难复刻它。
