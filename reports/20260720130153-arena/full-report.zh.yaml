  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Arena 位于 AI 评估、治理和决策基础设施之内
        blocks:
          - type: paragraph
            body: >-
              Arena 不应被按泛化的决策智能供应商来投资判断，即便一些决策智能市场报告提供了有用的规模参照。 公司自己的产品和商业界面更窄，也更可防守：它帮助模型实验室、开发者和企业对比模型、衡量质量，
              并围绕真实用户偏好记录性能。最接近的支出类别是 AI 评估、LLM 可观测性、智能体监控、模型治理工具， 以及夹在模型部署和业务采用之间的信任层。决策智能报告仍有用，因为它们勾勒了可审计 AI 辅助决策的
              更大预算池；但这些报告也包含工作流分析、模拟、业务规则和更广企业软件类别，Arena 目前并未覆盖。 正确边界因此包括付费模型评估服务、排行榜和基准基础设施、AI 系统运行时可观测性，以及把实验性 AI
              使用转成受治理生产使用的控制能力。它不包括原始模型训练、通用 BI 仪表盘和大多数经典工作流自动化预算。
