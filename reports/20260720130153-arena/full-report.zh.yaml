              反向证据：如果客户相信排名可被操纵，或系统性偏向大型实验室，Arena 的权威就会变弱。Yupp 关闭说明公开众包对比并不容易变现， 但并不能证明这个模式坚不可摧。内部自建也是有意义的替代。FutureAGI
