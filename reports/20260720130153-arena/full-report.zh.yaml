    rows:
      - - 基准完整性
        - 出现排名操纵或重大方法论争议的公开证据
        - 具名事件遭客户或实验室挑战，且未及时解决
        - 暂停 / 重新审视护城河和信任假设。
      - - 客户集中度
        - 头部客户占比或实验室依赖仍极端
        - 管理层无法证明收入结构已分散
        - 转为继续研究，或要求价格让步。
      - - 转化质量
        - 流量或投票增长，但付费使用停滞
        - 社区指标上升，但企业绑定率或 NRR 偏弱
        - 把消费者侧增长视为质量较低的验证。
      - - 治理成熟度
