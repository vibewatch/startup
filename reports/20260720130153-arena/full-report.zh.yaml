      - number: '2.3'
        title: 买方、用户和付款方图谱：预算从前沿实验室起步，并扩展到企业控制平面
        blocks:
          - type: paragraph
            body: >-
              公开 Arena 材料和报道指向三类主要买方。第一类是前沿模型实验室，它们用 Arena 式评估来优化模型发布、 与竞品模型对比，并验证后训练调整。第二类是把 LLM 功能或智能体部署进生产工作流的企业；
              这些买方不太在意公开炫耀，更在意性能一致性、政策合规和可审计性。第三类是开发者和产品团队，他们迭代 AI 功能时需要评估、追踪和性价比可见度。不同细分的预算归属不同。实验室可能从模型研究或 GTM
              预算支付评估费用，因为公开排名会直接影响产品发布。企业更可能从平台工程、安全、合规或业务部门 AI 转型
              预算付款。因此采用路径不是简单卖席位：买方通常先从免费或非正式模型对比开始，升级到结构化内部评估，之后才为治理、 路由或生产监控标准化工具。Arena 在 March 2026
              扩展到文档、视频和路由界面，支撑了这条路径，因为它把使用场景 扩展到文本聊天之外，能证明预算项更有必要。
