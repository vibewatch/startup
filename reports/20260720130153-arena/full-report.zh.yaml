companyProfile:
  summary: >-
    Arena 是一家私人 AI 评估和决策智能公司，脱胎于 UC Berkeley 的 Chatbot Arena 研究项目，并在 2025 年商业化。 公司把公开模型对比和排行界面，同面向实验室、企业和开发者的付费 AI
    评估产品结合起来。公开证据显示， 它的品类重要性、社区规模和切入前沿模型发布的势头都异常强，但客户集中度、收入持久性、治理成熟度和 单位经济等关键问题仍未回答。
