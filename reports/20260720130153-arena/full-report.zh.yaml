      - number: '6.3'
        title: 留存、扩张和集中度：使用势头强，公开留存披露弱
        blocks:
          - type: paragraph
            body: >-
              公开证据对增长更充分，对留存则弱得多。Arena 业务似乎基于消耗，因此 NRR 和 GRR 这类经典 SaaS 指标，内部甚至未必是主要管理语言。即便如此，
              未披露客户数、队列行为、合同期限或集中度数据，仍是真实尽调缺口。从 January 2026 的 $30 million 年化消耗运行率快速提升到 June 2026 的 $100 million
              年化收入运行率，说明组合层面的使用扩张很强。Agent Mode 又提供了一个相信产品扩张能帮助留存的理由：公司称 Agent Mode 已达到每月 5 million 轮交互，且周环比增长
              10%；任务组合数据也显示，使用场景已经超过简单聊天。但同样事实也支持集中度警示。 如果实验室是主导付费队列，同时又驱动基准价值，Arena
              收入可能对少数大账户或模型发布周期敏感。没有头部客户披露时，审慎假设应是： 扩张存在，但集中风险重大。
