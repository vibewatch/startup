        title: 收入模型：免费基准界面、付费评估和消耗驱动变现
        blocks:
          - type: paragraph
            body: >-
              Arena 变现的是一个公开评估网络，而不是传统按席位收费的应用。公开来源一致把免费消费者排行榜描述为漏斗顶部，把 AI Evaluations
              描述为付费产品。这项服务让模型实验室、企业和开发者获得更深的性能分析，底层还是让排行榜一开始变得有价值的社区评估界面。 对这样年轻的公司而言，最强牵引数字异常大：PR Newswire 称，到 December
              2025，商业产品已超过 $30 million 年化消耗运行率； TechCrunch 后来报道，公司到 June 2026 已达到 $100 million
              年化收入运行率。关键细节在收入质量。Angelopoulos 告诉 TechCrunch， Arena 按消耗向客户收费，这意味着该数字不是经典 SaaS 意义上的经常性
              ARR。需求存在这一点并未削弱，但投资人必须换一种方式思考 留存、订单储备和未来收入持久性。
