  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Arena 正在成为前沿模型评估的公共参考层。
        - 如果有证据表明排名比看起来更容易复制，或对决策的重要性更低，这一逻辑会被削弱。
      - - Arena 以异常快的速度把社区注意力转成真实商业需求。
        - 如果收入质量表现为集中、一次性或低毛利，投资逻辑会明显削弱。
      - - 模型增多后，独立 AI 评估可能成为关键基础设施。
        - 如果实验室把预算转向内部技术栈或私有供应商，Arena 的品类角色会收窄。
      - - 如果增长持续异常强劲，当前估值仍可能说得通。
        - 如果披露质量改善前增长先放缓，价格大概率会向下重估。
    notes: 投资逻辑有吸引力，但每个支撑点都还卡在耐久性和转化的证据缺口上。
