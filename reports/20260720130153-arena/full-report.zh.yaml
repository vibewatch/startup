      - number: '7.2'
        title: 运营和安全风险：规模、速度和产品宽度推高可靠性压力
        blocks:
          - type: paragraph
            body: >-
              Arena 最新增长口径令人印象深刻，但这些数字本身就意味着运营压力。公司称，商业化数月内就达到 10M+ 月访问者、700M+ 对话、82M+ 投票和 US$100M 年化收入。 仅 Agent Mode
              就达到每月 5M+ 轮交互。这种规模在战略上是正面信号，但也意味着宕机、排名质量下降或滥用，会迅速传导到声誉和收入。Arena 的招聘和工程材料指向
              低延迟、在线评估栈，而不是偶尔跑一次的批处理基准。挑战在于，高吞吐公开评估产品天然暴露在垃圾流量、Sybil 行为、提示词污染、排名操纵、
              审核失败和简单服务可靠性问题面前。公司产品界面也从文本排名扩展到图像、视频、搜索、代码和智能体，拉大了需要仪表化、QA 和方法论纪律的评估体系数量。 因此，投资人不应只把 Arena
              当作媒体式目的地或基准品牌，而要按关键基础设施来判断：一旦事故叠加，信任侵蚀可能比收入恢复更快。
