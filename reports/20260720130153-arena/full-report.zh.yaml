  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险：Arena 处理敏感评估流，却尚未公开展示完整治理深度
        blocks:
          - type: paragraph
            body: >-
              Arena 的公开材料清楚表明，它运营着一个大规模用户反馈和评估系统，但还没有拿出成熟受监管软件平台通常会展示的同等公开治理细节。隐私政策说明 Arena 收集
              用户内容和使用数据；使用条款限制用户行为、禁止违法或有害活动，并保留广泛执行裁量权。这些基础动作必要，但不充分。更强风险来自 EU AI Act 和 FTC 姿态与 Arena 业务的交互。Arena
              会影响模型被如何感知、排名和选择。如果客户或监管者越来越把这些排名视为决策关键证据，透明度、来源、可质疑性、数据处理和 基准操纵等问题就会更实质。Leaderboard Illusion
              论文不是监管行动，但它制造了一类公开批评；一旦客户指称不公平或评估结果失真，这类批评
              可能变得重要。因此，法律风险与其说是今天已有的已知诉讼，不如说是在公司公开证明穷尽式治理、申诉和反作弊控制之前，就已经运营了一个后果重大的评估场所。
