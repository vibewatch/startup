            body: >-
              概括 Arena 财务，最好的说法是：它已经证明自身有价值，但还没有证明公开市场级质量。上行情景很强：公司商业化极快，在几个月内达到有意义的收入运行率，
              而且似乎没有承受模型训练同行的资本负担。下行情景是，公开报道仍更强调叙事和速度，而不是更硬的问题：多少收入是经常性收入，头部账户有多集中，
