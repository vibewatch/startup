      - number: '1.2'
        title: 创始人、成立背景和治理姿态
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Arena 脱胎于 UC Berkeley 研究，而不是常规创业剧本。TechCrunch、Founded、 Berkeley Sky Computing Lab 页面和 ICML 论文都把起源指向
              Chatbot Arena：一个在 2023 年启动、 用人类偏好评估模型表现的研究项目。运营公司更晚才出现：TechCrunch 和 Felicis 创始人画像称， Anastasios
              Angelopoulos 与 Wei-Lin Chiang 在 April 2025 注册 LMArena，Ion Stoica 作为联合创始人，
              并担任有影响力的顾问或董事长。创始团队组合不寻常，且是加分项。Angelopoulos 提供统计和可靠性框架， Chiang 带来系统与模型评估工程深度，Stoica 则通过 Databricks 和
              Anyscale 增加公司建设可信度。 不过，治理披露按公开市场标准仍偏薄。公司和投资人提到 Felicis 的董事会观察员角色，但公开记录没有
              完整董事会名单、创始人持股、投资人控制权或继任细节。这个缺口不否定业务，却意味着 Series A 投资人 仍在押注一家以创始人和实验室为中心、正式治理能见度有限的机构。
