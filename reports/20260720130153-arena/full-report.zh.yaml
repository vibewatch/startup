  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础和分层：实验室优先，企业其次，社区始终在场
        blocks:
          - type: paragraph
            body: >-
              Arena 的客户结构不寻常，因为免费用户社区与付费客户基础紧密相连。数百万人使用平台对比模型输出、投票，并生成让排行榜有价值的人类偏好数据。 付费客户坐在这套系统之上。公开来源一致把 AI
              实验室识别为最可见的商业细分，企业和开发者则是 AI Evaluations 的次级买方。这个模式有战略合理性：
              同样是那些模型出现在公开排行榜上的实验室，最有动力购买更深分析、领域特定评估和发布验证。企业也重要，尤其是需要为代码、法律、医学、研究和面向搜索的
              工作流选择模型的企业；但保留公开来源还没有逐一说出很多名字。结果是三层客户栈：社区用户生成信号，实验室购买洞察和定位，企业在公开基准不够时 购买模型选择信心。
