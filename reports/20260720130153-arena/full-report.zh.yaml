chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围，以及 Arena 究竟是什么
        blocks:
          - type: paragraph
            body: >-
              Arena 把自己定位为一个社区驱动的平台，用来理解 AI 在真实世界的表现；官网也始终围绕比较、 评分、测试、评估和排序第三方 AI 模型来描述产品。这个定位重要，因为一个知名独角兽追踪器简介 把 Arena
              写成帮助商业领袖做决策的平台，但公司自己的产品界面更具体：它是一家 AI 评估和排行榜 公司，既有面向公众消费者的触点，也有企业评估业务。用户流程简单，但战略含金量高。用户提交提示词，
              看到两个模型匿名并排输出，投票选出更好答案，然后才看到模型名称；Arena 称这些投票进入基于 Bradley-Terry 的排名系统，而不是静态基准测试。随着时间推移，平台从文本对比网站扩展成覆盖
              代码、智能体、文档、搜索、图像和视频排行榜的更广评估界面。核心尽调结论是：Arena 正在围绕测量 和发现建立市场权威，而不是押注自有前沿模型。
