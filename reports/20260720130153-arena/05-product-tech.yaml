company:
  name: Arena
chapter:
  number: 5
  title: Product & Technology
  summary: Arena’s product is best understood as a live evaluation and discovery stack for frontier AI models, not as a single benchmark webpage. The stack combines anonymous pairwise voting, ranking logic, public leaderboards across multiple modalities, and a paid evaluation product for labs and enterprises. Product breadth expanded materially by 2026, spanning text, agents, documents, vision, code, image generation, image editing, search, and video workflows. The strongest technical differentiation is the combination of real-world human-preference data and public benchmark visibility, while the most material product risks are benchmark neutrality, privacy/confidentiality boundaries, and the still-limited public disclosure around enterprise integrations, SLAs, certifications, and roadmap commitments.
sections:
- id: product-definition-and-module-map
  title: 'Product Definition and Module Map: Arena Is a Multi-Modal Evaluation Stack'
  body: 'Arena’s public surface shows that the company has evolved far beyond a single chatbot ranking page. The core identity remains the same: users compare model responses, vote on quality, and contribute to a ranking system that tries to measure real-world performance. But by July 2026 the module map spans much more than text chat. Arena operates dedicated public leaderboards for text, agents, documents, vision, web development, text-to-image, image editing, text-to-video, and video editing, while the FAQ and TechCrunch reporting confirm a paid AI Evaluations product for enterprises, model labs, and developers. That breadth matters because it changes the underwriting question from “is this just a leaderboard?” to “can this become the evaluation layer for multiple AI workflows?” The product increasingly looks like a family of benchmark surfaces wrapped around a shared evaluation engine and monetized through enterprise-grade services, integrations, and developer tooling.'
