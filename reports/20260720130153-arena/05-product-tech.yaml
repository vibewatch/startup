  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-trust-controls
    missingEvidence: SOC 2 / ISO evidence, status operations, DPA detail, incident history, and formal security architecture.
    whyItMatters: Enterprise evaluation products are hard to scale into sensitive workflows without strong trust and compliance proof.
    diligencePath: Request trust-center materials, certifications, penetration-test summary, incident log, and customer security questionnaires.
    relatedQuestionRefs:
    - QE019
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: integration-and-sla-depth
    missingEvidence: Named integrations, deployment case studies, uptime targets, support model, and implementation burden.
    whyItMatters: The transition from admired benchmark to durable enterprise control plane depends on operational integration depth, not only methodology.
    diligencePath: Request customer architecture diagrams, SLA language, and implementation timelines for deployed accounts.
    relatedQuestionRefs:
    - QE010
    - QE012
    - QE022
    relatedTableRefs:
    - TE002
    - TE004
  - type: private-evidence-only
    severity: material
    topic: anti-gaming-and-quality-controls
    missingEvidence: Detailed public explanation of anti-fraud, anti-gaming, private-testing policies, and benchmark-integrity controls.
    whyItMatters: Methodology trust is the core asset supporting both public authority and enterprise monetization.
    diligencePath: Request internal policy docs, abuse controls, rate-limit logic, and appeals / audit workflows.
    relatedQuestionRefs:
    - QE020
    - QE024
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: module-level-usage-and-adoption
    missingEvidence: Usage, customer adoption, and monetization by module or modality.
    whyItMatters: Not every public leaderboard surface will mature into a commercially meaningful product.
    diligencePath: Request DAU/MAU, enterprise usage, and revenue attribution by module.
    relatedQuestionRefs:
    - QE004
    - QE005
    - QE021
    relatedTableRefs:
    - TE001
    - TE005
