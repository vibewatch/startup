- id: retention-expansion-and-concentration
  title: 'Retention, Expansion, and Concentration: Strong Usage Momentum, Weak Public Retention Disclosure'
  body: 'Public evidence is much better on growth than on retention. Arena’s business appears consumption-based, so classic SaaS metrics like NRR and GRR may not even be the primary management language internally. That said, the absence of disclosed customer counts, cohort behavior, contract lengths, or concentration data remains a real diligence gap. The rapid movement from a $30 million annualized consumption run rate in January 2026 to $100 million annualized revenue run rate in June 2026 suggests that usage expansion is strong at the portfolio level. Agent Mode adds a second reason to believe product expansion could help retention: the company says Agent Mode is already seeing 5 million turns per month and growing 10% week over week, while task mix data shows usage beyond simple chat. But the same facts support a concentration caution. If labs are the dominant paying cohort and they also drive benchmark relevance, Arena’s revenue could be sensitive to a handful of large accounts or model-launch
    cycles. Without top-customer disclosure, the prudent assumption is that expansion exists but concentration risk is material.'
