- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - More modalities (document, agent, search, video)
    - Large labs may remain the dominant paying cohort
    - Expansion can raise ACV but concentration can still dominate revenue
    - Request revenue by modality and by customer segment.
  - - Agent Mode adoption
    - Revenue could concentrate around a few heavy lab or power users
    - Could boost spend quickly while masking concentration
    - Request top-customer spend and Agent Mode revenue mix.
  - - Community growth as funnel
    - Free users may not convert into enterprise accounts
    - High traffic without conversion lowers monetization efficiency
    - Request funnel from visitor to trial to paid customer.
  - - Named lab prestige
    - Same labs being ranked may account for much of revenue
    - Creates conflict-of-interest and customer-loss cliff risk
    - Request top-5 customer share and minimum commitments.
  - - Enterprise vertical expansion
    - Lack of named non-lab customer proof may mean enterprise is still early
    - Could cap TAM if labs remain the only real buyers
    - Request named enterprise references and case studies.
  notes: Expansion signals are real, but concentration risk remains central until Arena discloses customer-mix detail.
