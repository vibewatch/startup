- id: adoption-trajectory-and-proof
  title: 'Adoption Trajectory and Proof: Massive Community Scale With Strongest Named Proof From xAI'
  body: Arena’s adoption curve is unusually well supported for a company this young. PR Newswire and TechCrunch said that by January 2026 the platform had over 5 million monthly users across 150 countries generating more than 60 million conversations per month. Arena’s June 2026 revenue milestone post then raised the bar materially, claiming over 10 million monthly visitors, 700 million total conversations, and 82 million total votes. Those metrics do not directly prove enterprise retention, but they do show large-scale customer and user engagement. The best named customer proof is xAI. Its Grok 4.1 page explicitly cited LMArena Text Arena rankings and described continuous blind pairwise evaluations on live production traffic, giving Arena rare primary-source validation from a frontier lab. The rest of the public customer proof is more inferential. TechCrunch and PR materials name OpenAI, Google, Anthropic, and xAI as labs drawing on Arena’s evaluations, and the series A blog says adoption
    by AI labs grew rapidly, but most of those relationships are not publicly broken out as paid contracts or case studies.
