  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-enterprise-customers
    missingEvidence: Named non-lab enterprise customers, use cases, outcomes, and deployment maturity.
    whyItMatters: Without named enterprise proof, it is hard to know whether Arena has diversified beyond frontier-model labs.
    diligencePath: Request customer references and case studies outside the major labs.
    relatedQuestionRefs:
    - QU011
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, ACV, paying-customer count, and top-customer revenue share.
    whyItMatters: Customer durability depends more on concentration and repeat spend than on gross community traffic.
    diligencePath: Request cohort analyses and customer concentration tables from management.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU016
    - QU025
    relatedTableRefs:
