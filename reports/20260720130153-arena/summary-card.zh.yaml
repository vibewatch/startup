  topStrengths:
    - 稀缺的公开基准测试品牌，加上实时人类偏好数据护城河，切中快速增长的 AI 评测赛道
    - 2026 年商业化和采用势头强，包括据称 $100M 的收入运行率，以及在前沿模型发布中的可见相关性
    - 产品宽度已覆盖多模态和多类工作流，提高 Arena 从单一排行榜变成耐久基础设施的概率
  topRisks:
    - 据称 $1.7B 估值已经押注极高的耐久性，但留存、集中度和单位经济仍披露不足
    - 基准完整性或治理争议可能直接削弱 Arena 护城河，并压缩高溢价叙事
    - 客户很可能同时使用 Arena、Patronus、Langfuse、Fiddler 和内部栈；即便 Arena 保持影响力，钱包份额也会受限
  unresolvedGaps:
    - 需要收入质量证据：NRR/GRR、队列留存、合同期限、毛利率和客户集中度。
    - 需要治理证据：反作弊控制、隐私姿态、方法论监督和企业信任材料。
    - 需要商业结构证据：定价、社区流量转化附加率，以及客户在多大比例上标准化使用 Arena，而不是多平台并用。
