- id: TM005
  title: Sizing / adoption diligence gaps table
  columns:
  - gap
  - why it matters
  - public signal retained
  - contradiction or limitation
  - exact diligence path
  rows:
  - - Direct AI-evaluation TAM
    - Needed for price-sensitive valuation
    - Only adjacent decision-intelligence and governance market sizes are public
    - Adjacency can overstate Arena’s real market by a wide margin
    - Build bottom-up TAM from labs, enterprise AI teams, likely contract sizes, and regulated vertical adoption.
  - - Production deployment penetration
    - Determines how quickly free usage converts to paid tooling
    - Forrester says production remains rare; Deloitte says scaling should increase
    - Intent and actual production are not the same
    - Request customer funnel by pilot, production, expansion, and renewal.
  - - Budget owner standardization
    - Explains sales motion and CAC
    - Sources point to research, engineering, compliance, and BU buyers
    - Fragmented budgets can slow enterprise standardization
    - Request closed-won deals by function and procurement path.
  - - Regulated-industry conversion
    - Important for long-term defensibility
    - EU AI Act and governance demand are rising
    - Arena has not yet published broad regulated-industry case studies in retained sources
    - Ask for named regulated customers, implementation evidence, and compliance mappings.
