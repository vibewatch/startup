- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Agentic AI adoption
    - positive
    - near term
    - Expands demand for eval, tracing, and governance as agents touch more workflows
    - Measure how much Arena revenue comes from agentic use cases versus leaderboard traffic.
  - - Governance maturity gap
    - positive for Arena, negative for market speed
    - current
    - Creates need for tools but slows conversion from pilot to scaled budget
    - Request pipeline split by pilot versus contracted production deployment.
  - - Regulatory hardening (EU AI Act, enforcement scrutiny)
    - positive
    - 2026 onward
    - Pushes buyers toward audit trails, logging, and quality controls
    - Test whether Arena’s product already maps controls to compliance workflows.
  - - ROI uncertainty
    - negative
    - current
    - Can trap buyers in experimentation rather than standardized spend
    - Request proof of measurable customer outcomes and renewal logic.
  - - Data readiness and integration burden
    - negative
    - current
    - Makes deployment harder and lengthens payback
    - Assess implementation effort, connector breadth, and required customer data cleanliness.
  - - Platform consolidation risk
    - negative
    - medium term
    - Broader AI platform vendors may absorb evaluation into a suite
    - Clarify why Arena can remain a control-plane layer rather than a feature.
  notes: The same force can be positive for demand but negative for speed of monetization; the table keeps both effects explicit.
