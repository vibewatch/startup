- id: sizing-and-adoption-state
  title: Sizing Signals Are Large, but Direct Market Isolation Is Much Harder Than the Headlines Suggest
  body: 'The strongest public market numbers available are still adjacent rather than direct. Grand View estimates the global decision-intelligence market at $20.7 billion in 2026, growing to $53.2 billion by 2033 at a 14.4% CAGR, with North America above 44% share and cloud delivery above 54% share. Those numbers matter because they imply that budgets for AI-assisted enterprise decisions, workflow instrumentation, and cloud-native analytics are real and expanding. But Arena''s specific wedge is not that whole market. Its nearer opportunity is the subset of AI budgets devoted to model benchmarking, red-teaming, post-training evaluation, observability, and governance. Demand conditions support that narrower wedge: Forrester says three-quarters of enterprise leaders are adopting agentic AI, yet only a small minority have meaningful production deployments. Deloitte likewise shows access to AI rising quickly, scaled production expected to increase, and governance maturity lagging badly. The
    practical implication is that Arena benefits from strong top-down demand for trusted AI controls, but bottom-up adoption will remain uneven until enterprises can govern agents, trust the data feeding them, and attach evaluation spending to measurable ROI.'
