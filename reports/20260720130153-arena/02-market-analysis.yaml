  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: direct-ai-evaluation-tam
    missingEvidence: A bottom-up market model for paid AI evaluations, observability, and governance spend by customer segment.
    whyItMatters: Broad decision-intelligence TAM figures are too loose to support entry pricing or long-term revenue penetration assumptions.
    diligencePath: Build a bottoms-up model from target labs, enterprise AI teams, contract sizes, attach rates, and likely regulated-vertical budgets.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: private-evidence-only
    severity: material
    topic: budget-owner-standardization
    missingEvidence: Closed-won deal data by buyer function, procurement path, and average contract size.
    whyItMatters: If budgets are fragmented across research, platform, and compliance teams, sales efficiency and expansion may be weaker than top-line demand suggests.
    diligencePath: Request CRM exports and cohort analysis showing buyer title, deal stage, contract value, and expansion path.
    relatedQuestionRefs:
    - QM013
    - QM014
    relatedTableRefs:
    - TM003
    - TM005
  - type: private-evidence-only
    severity: material
    topic: pilot-to-production-conversion
    missingEvidence: Pipeline conversion from free leaderboard users or pilot evaluation programs into paid recurring production accounts.
    whyItMatters: The most important underwriting question is whether Arena becomes a standardized control-plane budget or remains episodic spend.
    diligencePath: Request funnel data from community usage to pilot to paid deployment to renewal.
    relatedQuestionRefs:
    - QM017
    - QM025
    relatedTableRefs:
    - TM004
    - TM005
  - type: conflicting-data
    severity: minor
    topic: decision-intelligence-label
    missingEvidence: A company-approved market-definition statement that explains whether management wants to pitch Arena as evaluation infrastructure, governance software, or decision intelligence.
    whyItMatters: Different labels imply different comparable sets, TAM stories, and valuation frameworks.
    diligencePath: Ask management for the official category narrative used in board materials, fundraising, and sales qualification.
    relatedQuestionRefs:
    - QM001
    - QM002
    relatedTableRefs:
    - TM001
