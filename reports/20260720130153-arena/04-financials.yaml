- id: pricing-gtm-and-unit-economics-visibility
  title: 'Pricing, GTM, and Unit-Economics Visibility: Enough to See Shape, Not Enough to Underwrite Precision'
  body: 'The public record says a surprising amount about how Arena sells, but very little about what customers actually pay or how efficient the motion is. The company positions AI Evaluations for enterprises, model labs, and developers, while job postings show the infrastructure needed for a real B2B product: rate limiting, auth, billing, usage metering, RBAC, multi-tenancy, and enterprise-grade APIs. Those clues suggest an account-based or high-touch technical sale rather than a purely self-serve prosumer motion. Yet there is no public list pricing, no disclosed contract model, no cohort data, and no public CAC or payback disclosure. Third-party reporting indicates that Arena partnered with select labs such as OpenAI, Google, and Anthropic when it began pursuing revenue, which implies that early commercial traction may have been relationship-led and concentrated. Financial underwriting therefore has to separate what is knowable today — strong demand, usage-based monetization, and product-market
    pull — from what is still opaque, including realized pricing, renewal patterns, upsell mechanics, and the balance between lighthouse accounts and broad enterprise adoption.'
