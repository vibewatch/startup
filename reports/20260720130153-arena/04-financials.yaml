  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-ledger
    missingEvidence: Recognized revenue history, deferred revenue, usage-to-revenue bridge, and revenue mix by segment.
    whyItMatters: Run-rate headlines are insufficient to price a consumption-led business without understanding durability and accounting conversion.
    diligencePath: Request monthly P&L extracts, revenue-recognition policy, deferred-revenue detail, and segment revenue breakout.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, cost of revenue, CAC, payback, ACV, NRR, and top-customer concentration.
    whyItMatters: These metrics determine whether rapid growth is efficient, repeatable, and resilient to usage volatility.
    diligencePath: Request management KPI dashboard and cohort analysis by customer segment.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI014
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: runway-and-burn
    missingEvidence: Cash balance, monthly burn, hiring plan, board budget, and next-round trigger.
    whyItMatters: Fresh capital reduces immediate financing risk but does not eliminate dilution or operating-leverage questions.
    diligencePath: Request balance sheet, budget versus actuals, and 18–24 month operating plan.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: minor
    topic: pricing-architecture
    missingEvidence: Realized pricing schedules, minimum commitments, discounting patterns, and any API/data-product monetization roadmap.
    whyItMatters: Without pricing architecture, it is difficult to model ACV distribution, expansion, or the boundary between services and software.
    diligencePath: Request sample order forms, pricing cards, and redlined customer contracts.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI019
    relatedTableRefs:
    - TI002
    - TI005
