  productSummary: Arena sells public AI ranking surfaces plus paid AI evaluation products that use live human-preference and workflow data to compare models across text, agents, documents, search, coding, image, and video tasks.
  customerFocus: Frontier AI labs, enterprises, and developers that need third-party model evaluation or benchmark visibility.
  businessModel: Freemium public product that drives traffic, data, and reference value, monetized through consumption-based evaluation services and related enterprise/lab workflows.
  stage: Series A
  fundingStatus: Raised a $150M Series A in January 2026 at a reported $1.7B post-money valuation after a prior 2025 seed round; total public capital raised is about $250M.
