companyProfile:
  summary: Arena is a private AI evaluation and decision-intelligence company that grew out of UC Berkeley's Chatbot Arena research project and commercialized in 2025. The company combines a public model-comparison and ranking surface with paid AI evaluation products for labs, enterprises, and developers. Public evidence supports unusually strong category relevance, community scale, and momentum into frontier-model launches, but it still leaves important questions unanswered around customer concentration, revenue durability, governance maturity, and unit economics.
