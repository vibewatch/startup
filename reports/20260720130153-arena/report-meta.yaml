  topStrengths:
  - Rare public benchmark brand and live human-preference data moat in a fast-growing AI evaluation category
  - Strong 2026 commercialization and adoption momentum, including a reported $100M run-rate and visible relevance to frontier-model launches
  - Product breadth now spans multiple modalities and workflows, improving the chance Arena becomes durable infrastructure rather than a single leaderboard
  topRisks:
  - The reported $1.7B valuation already assumes exceptional durability, while retention, concentration, and unit economics remain under-disclosed
  - Benchmark-integrity or governance disputes could directly weaken Arena's moat and compress the premium multiple narrative
  - Customers can plausibly multi-home across Arena, Patronus, Langfuse, Fiddler, and internal stacks, limiting wallet share even if Arena remains influential
  unresolvedGaps:
  - 'Revenue-quality proof needed: NRR/GRR, cohort retention, contract duration, gross margin, and customer concentration.'
  - 'Governance proof needed: anti-gaming controls, privacy posture, methodology oversight, and enterprise trust artifacts.'
  - 'Commercial-structure proof needed: pricing, attach rates from community traffic, and how often customers standardize on Arena versus multi-home.'
