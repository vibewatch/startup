- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Benchmark integrity
    - Public evidence of ranking manipulation or major methodological dispute
    - Named incident with customer or lab challenge not promptly resolved
    - Pause / re-underwrite moat and trust assumptions.
  - - Customer concentration
    - Top-customer share or lab dependence remains extreme
    - Management cannot show diversified revenue mix
    - Move to research-more or require price concession.
  - - Conversion quality
    - Traffic or votes grow but paid usage stagnates
    - Community metrics up while enterprise attach or NRR is weak
    - Treat consumer traction as lower-quality proof.
  - - Governance maturity
    - Enterprise data / privacy controls lag buyer requirements
    - Unable to provide DPA, retention, or audit-ready controls
    - Assume slower enterprise expansion and lower attainable multiple.
  - - Operational resilience
    - Repeated outage / abuse incidents
    - Multiple material incidents over two quarters
    - Haircut growth and brand assumptions.
  notes: Kill criteria are framed so an IC can monitor the company post-investment rather than rely on qualitative unease.
