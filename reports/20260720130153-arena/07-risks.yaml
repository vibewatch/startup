chapter:
  number: 7
  title: Risks
  summary: 'Arena’s biggest risks cluster around benchmark integrity, privacy/compliance, concentration on frontier-model and cloud ecosystems, and the possibility that community traffic does not convert into durable enterprise economics. None of these are fatal alone, but several interact: if neutrality is questioned, large labs and enterprises have stronger incentives to multi-home or shift budget toward private evaluation stacks such as Patronus, Langfuse, Fiddler, or internal tools. The company has strong momentum, but the current valuation leaves little room for unresolved governance or conversion problems.'
sections:
- id: regulatory-and-legal
  title: 'Regulatory and Legal Risk: Arena Handles Sensitive Evaluation Flows Without Publicly Showing Full Governance Depth'
  body: Arena’s public materials make clear that it operates a large-scale user-feedback and evaluation system, but they do not yet provide the same level of public governance detail that a mature regulated-software platform might show. The privacy policy states that Arena collects user content and usage data, while the terms of use restrict user behavior, prohibit unlawful or harmful activity, and reserve broad enforcement discretion. Those basics are necessary, not sufficient. The stronger risk comes from how the EU AI Act and FTC posture interact with Arena’s business. Arena influences how models are perceived, ranked, and selected. If customers or regulators increasingly treat those rankings as decision-critical evidence, questions about transparency, provenance, contestability, data handling, and benchmark manipulation become more material. The Leaderboard Illusion paper is not a regulatory action, but it creates the kind of public critique that could matter if customers allege unfairness
    or distorted evaluation outcomes. The legal risk is therefore less about known litigation today and more about operating a consequential evaluation venue before the company has publicly demonstrated exhaustive governance, appeals, and anti-gaming controls.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
