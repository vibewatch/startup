  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Arena Sits Inside AI Evaluation, Governance, and Decision Infrastructure'
        blocks:
          - type: paragraph
            body: >-
              Arena should not be underwritten as a generic decision-intelligence vendor even though some market reports
              on decision intelligence provide useful sizing context. The company's own product and commercial surfaces
              are much narrower and more defensible: it helps model labs, developers, and enterprises compare models,
              measure quality, and document performance against real user preferences. The closest spend categories are
              AI evaluation, LLM observability, agent monitoring, model-governance tooling, and the trust layer that
              sits between model deployment and business adoption. Decision-intelligence reports are still relevant
              because they frame the much larger budget pools for auditable AI-assisted decision-making, but those
              reports also include workflow analytics, simulation, business rules, and broader enterprise software
              categories that Arena does not currently capture. The right boundary therefore includes paid
              model-evaluation services, leaderboard and benchmark infrastructure, runtime observability for AI systems,
              and governance controls that convert experimental AI use into governed production usage. It excludes raw
              model training, generic BI dashboards, and most classic workflow automation budgets.
