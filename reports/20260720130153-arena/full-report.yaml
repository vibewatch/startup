  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Current Price Context: The Round Prices In Exceptional Execution'
        blocks:
          - type: paragraph
            body: >-
              Arena’s January 2026 Series A priced the business at a reported US$1.7 billion post-money valuation after
              a US$150 million raise, following a 2025 seed valuation around US$600 million. By June 2026, TechCrunch
              and Arena both reported a US$100 million annualized run-rate revenue milestone, up from an annualized
              consumption run rate above US$30 million in December 2025. That combination explains the investor
              enthusiasm: the company appears to have tripled revenue run rate within roughly half a year while
              maintaining intense category visibility. On a simple price-to-run-rate basis, the January round implied
              roughly 17x the later June run rate, although that comparison is imperfect because the valuation predates
              the revenue update and Arena’s revenue is consumption-based rather than classic contracted ARR. Even so,
              the current mark already assumes Arena can defend benchmark trust, convert public traffic into durable
              paid usage, and avoid being marginalized by adjacent observability or evaluation vendors. In other words,
              the company may still grow into the price, but the price no longer leaves much room for unforced errors or
              evidence gaps.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
