  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Model: Free Benchmark Surface, Paid Evaluations, and Consumption-Led Monetization'
        blocks:
          - type: paragraph
            body: >-
              Arena monetizes a public evaluation network rather than a conventional seat-based application. Public
              sources consistently describe the free consumer leaderboard as the top of the funnel and AI Evaluations as
              the paid product. That service gives model labs, enterprises, and developers access to deeper performance
              analytics grounded in the same community evaluation surface that made the leaderboard relevant in the
              first place. The strongest traction numbers are unusually large for such a young company: PR Newswire said
              the commercial product had already surpassed a $30 million annualized consumption run rate by December
              2025, and TechCrunch later reported that the company had reached $100 million in annualized run-rate
              revenue by June 2026. The critical nuance is revenue quality. Angelopoulos told TechCrunch that Arena
              charges customers on consumption, which means the figure is not recurring ARR in the classic SaaS sense.
              That does not weaken the existence of demand, but it changes how an investor should think about retention,
              backlog, and the durability of future revenue.
