      - number: '7.4'
        title: 'People, Execution, and Thesis-Breakers: Arena Must Institutionalize Faster Than It Scales'
        blocks:
          - type: paragraph
            body: >-
              Arena remains a young company commercializing quickly out of a research-led origin. That creates classic
              execution risk: management has to turn a high-credibility academic and community project into a repeatable
              enterprise platform while preserving neutrality. Hiring signals show the company is still building core
              engineering and infrastructure capabilities, which is normal but means organizational depth is still
              forming. Execution risk also rises because Arena operates across consumer-style scale, frontier-lab
              relationships, and enterprise selling at once. Those are different muscles. If the company over-optimizes
              for public attention, enterprise controls may lag; if it over-optimizes for bespoke enterprise work, the
              public data flywheel may weaken. The kill criteria therefore need to be explicit. A material
              benchmark-integrity controversy, meaningful slowdown in community growth without compensating enterprise
              expansion, evidence of heavy customer concentration, or a forced rewrite of privacy/governance posture
              would all challenge the investment case. Conversely, if Arena can show strong anti-gaming controls, broad
              customer mix, and durable attach from public traffic into paid evaluations, the current risk stack becomes
              much easier to accept.
            claimRefs:
              - CR031
              - CR032
