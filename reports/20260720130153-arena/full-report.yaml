      - number: '2.3'
        title: 'Buyer, User, and Payer Map: The Budget Starts With Frontier Labs but Expands Into Enterprise Control Planes'
        blocks:
          - type: paragraph
            body: >-
              Public Arena materials and reporting point to three primary buyer clusters. First are frontier model labs,
              which use Arena-style evaluation to optimize model launches, compare models against rivals, and validate
              post-training changes. Second are enterprises deploying LLM features or agents into production workflows;
              these buyers care less about public bragging rights and more about performance consistency, policy
              compliance, and auditability. Third are developers and product teams that need evaluation, tracing, and
              cost-performance visibility as they iterate on AI features. Budget ownership differs by segment. Labs may
              fund evaluation from model-research or go-to-market budgets because public rankings directly influence
              product launches. Enterprises are more likely to pay from platform engineering, security, compliance, or
              business-unit AI transformation budgets. The adoption path is therefore not a simple seat sale: a buyer
              usually starts with free or informal model comparison, escalates into structured internal evaluation, and
              only later standardizes tooling for governance, routing, or production monitoring. Arena's March 2026
              expansion into document, video, and routing surfaces supports this progression because it broadens the use
              cases that can justify a budget line beyond text chat alone.
