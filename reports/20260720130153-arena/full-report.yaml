      - number: '5.2'
        title: 'Workflow and Architecture: Human Preference, Ranking Logic, and Evaluation Feedback Loops'
        blocks:
          - type: paragraph
            body: >-
              Arena’s technical architecture is publicly visible at a high level even if the implementation details
              remain private. Users submit prompts, receive side-by-side anonymous outputs from competing models, vote
              for the better answer, and only then see model identities. Arena says the results feed a
              Bradley-Terry-based ranking process, while the Berkeley project page and ICML paper provide the
              methodological roots and early evidence that crowd judgments can align with expert raters. The
              architecture therefore combines three layers: data collection from live user interactions, ranking and
              evaluation logic that turns those interactions into comparative scores, and public or enterprise surfaces
              that expose the result. The paid AI Evaluations product appears to sit on top of that loop, using the same
              evaluation engine for deeper performance analytics. This architecture is strategically important because
              it lets Arena turn community activity into a reusable testing and measurement asset. It also creates the
              main technical risk: if users or model providers lose confidence that the ranking loop is fair, the entire
              product stack weakens.
