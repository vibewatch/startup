      - number: '3.2'
        title: 'Competitor Profiles: Arena Faces Better-Priced Tooling and Stronger Enterprise Control Planes'
        blocks:
          - type: paragraph
            body: >-
              Arena’s adjacent competitors often look more conventional and procurement-friendly than Arena itself.
              Langfuse is the clearest example: it offers transparent cloud pricing from free through enterprise tiers,
              open-source availability, self-hosting, and deep developer workflow integration. Fiddler and Arthur lean
              harder into enterprise governance, observability, and on-prem or VPC deployment options that appeal to
              regulated buyers. Patronus is the most credible “next-wave” evaluation rival because it combines
              reliability testing with simulation infrastructure and reported 15x revenue growth, making it more
              aggressive than a simple benchmarking tool. Braintrust and Arize reflect another pattern: free or low-cost
              entry tiers that make it easy for engineering teams to adopt evaluation tooling before centralized
              procurement even happens. Arena’s own pricing remains opaque and consumption-based. That helps preserve
              flexibility for bespoke lab or enterprise engagements, but it also weakens comparability and makes the
              product harder to benchmark against vendors that publish clearer entry points and deployment models.
