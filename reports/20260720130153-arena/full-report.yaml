chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and What Arena Actually Is
        blocks:
          - type: paragraph
            body: >-
              Arena presents itself as a community-powered platform for understanding AI performance in the real world,
              and the official site consistently frames the product around comparing, rating, testing, evaluating, and
              ranking third-party AI models. That matters because one high-profile unicorn tracker blurb describes Arena
              as a platform that helps business leaders make decisions, but the company’s own product surface is much
              more specific: it is an AI evaluation and leaderboard company with public consumer touchpoints and an
              enterprise evaluation business. The user workflow is simple but strategically powerful. Users submit
              prompts, see anonymous side-by-side responses from two models, vote for the better answer, and then reveal
              the model names; Arena says those votes feed a Bradley-Terry-based ranking system rather than a static
              benchmark. Over time, the platform has expanded from a text comparison site into a broader evaluation
              surface spanning code, agent, document, search, image, and video leaderboards. The core underwriting
              takeaway is that Arena is building market authority around measurement and discovery, not around owning a
              proprietary frontier model.
            claimRefs:
