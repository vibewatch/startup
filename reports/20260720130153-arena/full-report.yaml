      - number: '7.2'
        title: 'Operational and Security Risk: Scale, Speed, and Product Breadth Raise Reliability Pressure'
        blocks:
          - type: paragraph
            body: >-
              Arena’s recent growth claims are impressive but themselves imply operational stress. The company says it
              reached 10M+ monthly visitors, 700M+ conversations, 82M+ votes, and US$100M annualized revenue within
              months of commercialization. Agent Mode alone reached 5M+ turns per month. That kind of scale is
              strategically positive, but it means outages, degraded ranking quality, or abuse can transmit quickly into
              reputation and revenue. Arena’s jobs and engineering materials imply a low-latency, online evaluation
              stack rather than an occasional batch benchmark. The challenge is that high-throughput public evaluation
              products are inherently exposed to spam, sybil behavior, prompt contamination, ranking manipulation,
              moderation failures, and simple service reliability issues. The company’s product surface has also
              expanded from text rankings into image, video, search, coding, and agents, which broadens the number of
              evaluation regimes that need instrumentation, QA, and methodology discipline. Investors should therefore
              underwrite Arena not just as a media-like destination or benchmark brand, but as critical infrastructure
              whose trust can erode faster than revenue can recover if incidents compound.
