      - number: '1.2'
        title: Founders, Formation, and Governance Posture
        blocks:
          - type: paragraph
            body: >-
              The public record shows Arena emerging from UC Berkeley research rather than from a conventional
              startup-formation playbook. TechCrunch, Founded, the Berkeley Sky Computing Lab page, and the ICML paper
              all tie the origin to Chatbot Arena, a research project launched in 2023 to evaluate model performance by
              human preference. The operating company came later: TechCrunch and the Felicis founder profile say
              Anastasios Angelopoulos and Wei-Lin Chiang incorporated LMArena in April 2025 with Ion Stoica as
              co-founder and influential advisor or chairman. The founding team mix is unusual in a favorable way.
              Angelopoulos brings a statistics and reliability framing, Chiang brings systems and model-evaluation
              engineering depth, and Stoica adds company-building credibility through Databricks and Anyscale.
              Governance disclosure, however, remains thin by public-market standards. The company and investors
              describe a board observer role for Felicis, but the public record does not provide a full board roster,
              founder ownership, investor control rights, or succession detail. That gap does not invalidate the
              business, but it means a Series A investor is still underwriting a founder- and lab-centered institution
              with limited formal governance visibility.
