      - number: '7.3'
        title: 'Dependency, Financial, and Go-to-Market Risk: Multi-Homing and Conversion Matter More Than Traffic'
        blocks:
          - type: paragraph
            body: >-
              Arena’s dependency profile is subtle. It is not a hardware or manufacturing startup, but it still depends
              on a set of external actors: frontier-model providers that benefit from rankings, cloud and inference
              infrastructure, public traffic channels, and enterprise customers willing to pay for evaluation products
              rather than treat Arena as a free research utility. The company’s financing strength reduces near-term
              solvency risk, but not model risk. The strongest commercial concern is conversion quality. Public traffic,
              community votes, and launch relevance do not automatically prove diversified recurring revenue, low churn,
              or low concentration. TechCrunch’s reporting frames Arena as a US$100M business, yet the source mix still
              leaves uncertainty around how much revenue comes from a handful of labs, how much is usage-driven, and how
              sticky enterprise deployments are. Adjacent vendors such as Patronus, Langfuse, Fiddler, and internal
              build options mean customers can multi-home. The downside scenario is not sudden collapse; it is slower
              enterprise attach, margin pressure from heavy compute or support, and a perception gap between
              extraordinary brand momentum and less durable commercial quality.
            claimRefs:
