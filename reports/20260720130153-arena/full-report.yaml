            body: >-
              Arena’s customer structure is unusual because the free user community and the paying customer base are
              tightly linked. The platform itself is used by millions of people who compare model outputs, cast votes,
              and generate the human-preference data that makes the leaderboard useful. The paying customers sit on top
              of that system. Public sources consistently identify AI labs as the most visible commercial segment, with
              enterprises and developers as secondary buyers for AI Evaluations. That pattern makes strategic sense: the
              same labs whose models appear on the public leaderboard also have the strongest incentive to buy deeper
              analytics, domain-specific evaluations, and launch validation. Enterprises matter too, especially those
              needing to choose models for coding, law, medicine, research, and search-oriented workflows, but retained
              public sources do not yet name many of them individually. The result is a three-layer customer stack:
              community users generate signal, labs buy insight and positioning, and enterprises buy model-selection
              confidence where public benchmarks alone are insufficient.
