  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Rivals Are Sparse, Adjacent Rivals Are Dense'
        blocks:
          - type: paragraph
            body: >-
              Arena’s competitor landscape breaks into at least five categories. First are direct crowdsourced
              evaluation peers that try to turn public model comparisons into commercial value. Those are rare, and the
              best public evidence suggests the most obvious one, Yupp, already shut down. Second are LLM observability
              and control-plane vendors such as Langfuse, Fiddler, Arthur, Arize, and Braintrust. These companies do not
              replicate Arena’s human-preference flywheel, but they do compete for the same enterprise budget around
              model quality, tracing, evaluation, and governance. Third are evaluation and reliability specialists such
              as Patronus AI, which are moving toward richer simulation and automated stress testing for agents. Fourth
              are human-labeling or RLHF substitutes such as Scale-style services, which labs can use instead of
              Arena-style public signal generation. Fifth are internal build and status-quo workflows: spreadsheets,
              internal eval harnesses, and model-provider-native benchmarks. The strategic implication is that Arena’s
              moat is less about owning every evaluation workflow and more about owning the public, community-grounded
              layer that adjacent vendors struggle to reproduce.
            claimRefs:
