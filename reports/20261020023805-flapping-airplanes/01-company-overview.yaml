company:
  name: "Flapping Airplanes"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Flapping Airplanes is a San Francisco AI research lab founded in 2025 by
    Ben Spector, Asher Spector, and Aidan Smith to pursue more data-efficient
    learning methods. It announced a $180 million seed backed by GV, Sequoia,
    and Index, but the reviewed evidence does not establish valuation,
    operating scale, governance, or current commercialization.
sections:
  - id: "identity-and-research-mandate"
    title: "Identity and research mandate"
    body: >-
      Flapping Airplanes is a San Francisco-based AI lab founded in 2025 by
      Ben Spector, Asher Spector, and Aidan Smith. Public descriptions
      consistently frame it as research-first: the lab is exploring training
      methods that use materially less data than prevailing large-model
      approaches, taking inspiration from the human brain without committing
      to reproducing biological mechanisms. This is not yet a conventional
      product business model in the reviewed record. The available material
      describes a scientific program whose prospective commercial value would
      come from enabling capabilities in data-constrained settings. The
      snapshot therefore separates established identity and financing facts
      from unavailable valuation and operating metrics.
    claimRefs: [CO001, CO002, CO003, CO004, CO011]
    tableRefs: [TO001]
  - id: "leadership-capital-and-control"
    title: "Leadership, capital, and control"
    body: >-
      The three named co-founders are the only consistently identified
      leadership group in the assigned evidence. Their public commentary
      spans learning efficiency, brain-inspired algorithmic search, computer
      systems, and the transition from fundamental research toward possible
      applications. The company announced $180 million from GV, Sequoia, and
      Index, while an independent funding directory describes the same amount
      as total disclosed funding and the latest round as a February 2026
      seed. That figure is capital raised, not cash currently available.
      Undisclosed extensions, secondaries, debt, preference terms, board
      rights, and founder ownership remain outside the reviewed public record,
      preventing a control or runway conclusion.
    claimRefs: [CO002, CO005, CO006, CO007, CO012, CO016]
    tableRefs: [TO002, TO003]
  - id: "milestones-commercialization-and-gaps"
    title: "Milestones, commercialization, and underwriting gaps"
    body: >-
      The public chronology is concentrated around launch. The company was
      founded in 2025, announced itself and its financing on January 28, 2026,
      received launch coverage over the following weeks, and used a February
      founder interview to explain its data-efficiency thesis and possible
      applications. One contemporaneous report said no commercial products
      had launched, while another cautioned that the research approach offered
      no guarantee of rapid earnings and could require a five-to-ten-year
      horizon. Those observations are meaningful but not a current product
      audit. The assigned sources do not establish current valuation, revenue,
      ARR, customers, headcount, board composition, IP ownership, or a complete
      product and partnership history, so each remains a diligence item rather
      than a zero value.
    claimRefs: [CO008, CO009, CO010, CO011, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
