artifact: "customers"
slug: "flapping-airplanes"
runDate: "2026-10-20"
company:
  name: "Flapping Airplanes"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Flapping Airplanes remains a research-first laboratory rather than a publicly evidenced
    commercial vendor: the reviewed sources name no customer, design partner, pilot,
    production deployment, adoption metric, or retention measure. Robotics and scientific
    discovery are described as prospective application areas, but buyer, payer, procurement,
    expansion, and concentration evidence remains private or unavailable.
sections:
  - id: "customer-segments"
    title: "Prospective users are visible; actual buyers and payers are not"
    body: >-
      Public evidence frames data-efficient AI as potentially useful where training data is
      constrained, especially robotics and scientific discovery, but it does not identify a
      commercial product, named buyer, end user, payer, geography, company-size band, or
      channel. Those application areas should therefore be treated as hypotheses about future
      demand rather than present customer segments. The official launch message emphasizes a
      research mission and financing, while third-party descriptions emphasize fundamental
      research and possible eventual commercialization. For underwriting, the key distinction
      is between technical beneficiaries and paying customers: neither the economic buyer nor
      a procurement path is publicly verified. The segmentation table consequently records
      what is suggested, what is absent, and the evidence needed before assigning revenue or
      strategic value.
    claimRefs: ["CU002", "CU003", "CU005", "CU007", "CU012", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-trajectory"
    title: "Commercial adoption has not entered the public evidence trail"
    body: >-
      The evidence supports a January 2026 public launch, a substantial research mandate, and
      an expected long development horizon, not an adoption curve. One independent article
      explicitly reported that no commercial products had launched, and the remaining
      retained sources supply no customer count, active-user count, paid account count,
      locations, deployments, utilization, repeat purchase, or revenue-linked usage measure.
      This prevents construction of a comparable growth series and makes any inferred
      conversion rate inappropriate. Altis advertises customer, go-to-market, and retention
      coverage, but its fetched public excerpt does not expose the underlying observations.
      The correct current baseline is therefore “not publicly disclosed,” with dates,
      denominators, and production status requested directly from management.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU008", "CU010"]
    tableRefs: ["TU002"]
  - id: "proof-durability-and-concentration"
    title: "No named proof supports retention, expansion, or concentration analysis"
    body: >-
      Across the eight retained sources, no named organization is identified as a customer,
      design partner, pilot participant, production user, or reference account, and no
      attributable customer outcome is reported. The same evidence set contains no NRR, GRR,
      churn, renewal, contract-length, satisfaction, expansion, pricing, channel, or
      customer-revenue concentration disclosure. This is not proof that commercial
      relationships do not exist; it is a boundary on what can be verified from the assigned
      public evidence. A diligence sequence should move from a reproducible product result to
      a named design partner, scoped pilot, production deployment, renewal, and multi-workload
      expansion. Until management supplies those records, both durability and concentration
      remain unmeasurable, and logo-level assertions should receive no underwriting credit.
    claimRefs: ["CU004", "CU006", "CU009", "CU011", "CU013", "CU015", "CU016"]
    tableRefs: ["TU003"]
    figureRefs: ["FU001"]
tables:
  - id: "TU001"
    title: "Customer segmentation evidence status"
    columns:
      - "Potential segment"
      - "Buyer"
      - "User"
      - "Payer"
      - "Public evidence"
      - "Diligence gap"
    rows:
      - ["Robotics developers", null, "Model or robotics teams", null, "Prospective application area only", "Identify product, buyer, deployment stage, and budget owner"]
      - ["Scientific-discovery organizations", null, "Research teams", null, "Prospective application area only", "Identify workflow, measurable benefit, and procurement path"]
      - ["Foundation-model developers", null, "AI research teams", null, "Research mission implies relevance; no customer proof", "Confirm whether technology will be licensed, sold, or retained internally"]
      - ["Other data-constrained enterprises", null, null, null, "No segment-specific evidence in retained sources", "Provide ICP, geography, company size, channel, and revenue band"]
    notes: >-
      Potential segments are analytical hypotheses derived from cited application commentary,
      not verified customers; null means the retained sources do not disclose the field.
    claimRefs: ["CU005", "CU007", "CU009", "CU012", "CU014"]
  - id: "TU002"
    title: "Customer growth and adoption evidence"
    columns:
      - "Metric or milestone"
      - "Public value"
      - "Period"
      - "Evidence quality"
      - "Implication"
      - "Missing denominator or proof"
    rows:
      - ["Public laboratory launch", "Announced", "January 2026", "Company and third-party reports", "Research organization became public", "No commercial conversion implied"]
      - ["Commercial product launch", "None reported by one retained article", "2026 source vintage", "Single independent report", "Commercial stage was pre-product in that account", "Current product catalog and launch date"]
      - ["Named design partners or pilots", null, "Through 2026-10-20 evidence review", "No retained source names one", "Pilot traction cannot be verified", "Partner name, scope, start date, and success criteria"]
      - ["Production deployments", null, "Through 2026-10-20 evidence review", "No retained source documents one", "Production adoption cannot be verified", "Live workload, usage, and deployment date"]
      - ["Active customers or users", null, "Through 2026-10-20 evidence review", "No retained metric", "No adoption trajectory can be calculated", "Count, definition, geography, and comparison period"]
      - ["Retention or expansion", null, "Through 2026-10-20 evidence review", "No retained metric", "Durability cannot be assessed", "NRR, GRR, churn, renewal, cohorts, and contract length"]
    notes: >-
      This is an evidence-status table, not a growth series; null means no supportable public
      value was found in the assigned prefetched sources, not that the underlying value is zero.
    claimRefs: ["CU002", "CU003", "CU004", "CU007", "CU008", "CU010", "CU011", "CU013"]
