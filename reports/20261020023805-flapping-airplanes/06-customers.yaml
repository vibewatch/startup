      - ["Design partner or pilot", null, null, "Not evidenced", null, "No pilot scope, date, or success criterion is disclosed"]
      - ["Production outcome reference", null, null, "Not evidenced", null, "No deployment, measured outcome, or attributable customer quotation is disclosed"]
    notes: >-
      Partial enumeration of the assigned public evidence through 2026-10-20; null denotes
      unavailable proof and must not be read as evidence that no private relationship exists.
    enumerationScope:
      coverage: "partial"
      basis: "Eight successful assigned prefetched sources reviewed through 2026-10-20."
    claimRefs: ["CU001", "CU004", "CU008", "CU009", "CU013"]
figures:
  - id: "FU001"
    title: "Customer-evidence maturity journey"
    type: "journey-map"
    summary: >-
      A diligence sequence from public research thesis to durable expansion, with only the
      first stage supported and later commercial stages still unverified.
    data:
      items:
        - label: "Research thesis"
          detail: "Public mission targets radically more data-efficient AI."
          status: "Publicly described"
        - label: "Reproducible product result"
          detail: "No customer-ready product or benchmark is established by retained customer evidence."
          status: "Not verified"
        - label: "Named design partner"
          detail: "No named organization or scoped co-development relationship is disclosed."
          status: "Not verified"
        - label: "Measured pilot"
          detail: "No pilot baseline, success criterion, duration, or outcome is disclosed."
          status: "Not verified"
        - label: "Production deployment"
          detail: "No live workload, utilization measure, or attributable customer outcome is disclosed."
          status: "Not verified"
        - label: "Renewal and expansion"
          detail: "No renewal, retention, expansion, or cohort evidence is disclosed."
          status: "Not verified"
    approximationNotes: >-
      Ordered diligence framework only; it does not assert that the company has reached any
      unverified stage or imply conversion rates between stages.
    claimRefs: ["CU004", "CU005", "CU013", "CU015"]
callouts:
