companyProfile:
  summary: >-
    Flapping Airplanes is a San Francisco AI research lab founded in 2025 by Ben Spector, Asher Spector, and Aidan
    Smith. It is pursuing brain-inspired but silicon-native approaches to training capable models with materially less
    data and compute, backed by a reported $180 million seed round from GV, Sequoia, and Index. The retained evidence
    establishes the research mandate and financing but not a current commercial product, customer base, revenue model,
    operating scale, or independently reproduced benchmark.
