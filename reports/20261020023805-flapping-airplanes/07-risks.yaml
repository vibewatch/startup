chapter:
  number: 7
  title: Risks
  summary: >-
    Flapping Airplanes is a high-risk research-stage investment whose central technical thesis remains
    unbenchmarked in the assigned public evidence and whose product, governance, compliance, burn, and
    runway controls remain undisclosed. The $180 million seed financing and ability to test radical ideas
    at small scale are meaningful mitigants, but they do not resolve scientific, commercialization,
    key-person, or follow-on-capital exposure.
sections:
  - id: risk-hierarchy
    title: Scientific and commercialization risk dominate
    body: >-
      The highest residual risk is that a research-first lab does not convert its data-efficiency thesis
      into repeatable benchmark gains or a commercially usable system. Public coverage describes a goal
      of training models with materially less data and compute, while one outlet reports an aspirational
      1,000-times efficiency improvement; neither is a published result. The strategy also contemplates
      long-horizon, low-probability research bets, and one retained source reported that no commercial
      product had launched at publication. The financing provides room to experiment, and coverage says
      radical ideas can be explored at small scale, but mitigation maturity remains early until independent
      benchmarks, reproducible methods, product milestones, and customer evidence appear. The core thesis
      should be treated as broken if the company reaches its next financing need without credible technical
      validation and a product path.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR014, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-governance
    title: Governance and compliance posture are not publicly underwritable
    body: >-
      The assigned evidence identifies three founders and prominent financial backers, but it does not
      disclose board composition, investor rights, founder vesting, intellectual-property assignments,
      privacy controls, security controls, safety governance, licenses, certifications, litigation, or
      enforcement status. This is an evidence limitation, not evidence that defects or incidents exist,
      and the absence of a recorded incident cannot establish safety. Current deployment exposure may be
      lower while the lab remains research-first and without a reported commercial product, yet that
      stage-based mitigant expires as external users, sensitive data, or autonomous capabilities are
      introduced. Investment approval should therefore be conditioned on primary documents, management
      representations, and specialist legal, security, privacy, and model-safety review rather than on
      secondary launch coverage.
    claimRefs: [CR002, CR004, CR010, CR011, CR012]
    tableRefs: [TR001]
  - id: capital-people-dependencies
    title: Capital, founder, and ecosystem dependencies remain concentrated
    body: >-
      Multiple outlets report a $180 million seed round backed by GV, Sequoia, and Index, which diversifies
      the named investor group and is a meaningful resource signal. It is not evidence of cash on hand,
      runway, burn, compute commitments, financing terms, or future capital availability. Execution is
      also concentrated around the three publicly named founders and a hiring model that values creative,
      unconventional talent; that approach may widen the talent funnel but does not substitute for
      succession, retention, and operating controls. No design partners, customers, cloud counterparties,
      or commercialization partners were identified in the retained evidence. The practical mitigations
      are milestone-based capital plans, founder succession coverage, documented decision rights, and
      partner diversification before product deployment.
    claimRefs: [CR001, CR002, CR009, CR010, CR013, CR015]
    tableRefs: [TR003]
  - id: monitoring-kill-criteria
    title: Monitoring plan and thesis-break triggers
    body: >-
      Quarterly monitoring should separate scientific progress from financing optics. Required indicators
      are independently reproducible data-efficiency gains against named baselines; research-to-prototype
      and prototype-to-product milestones; compute spend and committed capacity versus board-approved
      budget; cash runway under base and downside cases; founder and critical-researcher retention; and
      completion of IP, privacy, security, safety, and regulatory controls before external deployment.
      Immediate thesis-break triggers are material benchmark underperformance after a management-agreed
      validation window, repeated milestone resets without falsifiable results, loss of a founder or core
      technical cohort without succession, a material undisclosed IP or regulatory defect, or a financing
      need arriving without demonstrated technical and product progress. Until those indicators are
      available, residual severity remains high and the investment posture should remain diligence-led.
    claimRefs: [CR007, CR010, CR011, CR013, CR014, CR015, CR016]
