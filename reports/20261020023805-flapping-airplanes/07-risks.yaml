    claimRefs: [CR003, CR004, CR005, CR010, CR011, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: >-
      The reported $180 million seed round demonstrates fundraising capacity, but the evidence does not
      disclose cash available, burn, compute commitments, financing terms, or runway.
    claimRefs: [CR001, CR013]
  - calloutType: recommendation
    title: Underwrite milestones, not the announcement
    body: >-
      Require independent technical benchmarks, a product validation plan, governance and IP documentation,
      and a downside runway model before treating the research thesis as investable.
    claimRefs: [CR010, CR011, CR013, CR016]
