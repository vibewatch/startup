evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive and board roster, leadership-change history, founder ownership, and key-person protections.
    whyItMatters: >-
      Concentrated research leadership and investor rights could materially affect control, continuity, and decision
      quality.
    diligencePath: >-
      Obtain the cap table, charter, voting agreement, board minutes, employment agreements, and leadership roster from
      management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Current valuation, financing allocation, cash balance, debt, secondaries, preference stack, and investor rights.
    whyItMatters: >-
      Capital raised cannot be translated into ownership, runway, liquidation economics, or current cash without these
      records.
    diligencePath: >-
      Request financing documents, bank statements, debt schedules, the fully diluted cap table, and preference
      waterfall.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Revenue, ARR, customer count, headcount, locations, burn, compute commitments, and runway.
    whyItMatters: The financing amount alone does not reveal commercial traction, organizational scale, or capital sufficiency.
    diligencePath: >-
      Obtain management accounts, customer and pipeline extracts, payroll roster, infrastructure contracts, and monthly
      cash forecast.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: At least two additional independently dated product, scale, regulatory, partnership, or adverse milestones.
    whyItMatters: The six supportable timeline points cluster around launch and do not establish a broader operating history.
    diligencePath: Request a management milestone log and corroborate each event against dated primary or independent records.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: product-status
    missingEvidence: >-
      Current product roadmap, published benchmark results, named pilots or design partners, and commercialization
      status.
    whyItMatters: >-
      The core thesis cannot be translated into product readiness, differentiation, or revenue timing without measurable
      outputs.
    diligencePath: Request technical benchmark packs, research artifacts, product roadmap, and customer or design-partner references.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent market data with a defined category, geography, period, value, growth rate, and methodology tied to a
      monetizable Flapping Airplanes offering.
    whyItMatters: Without a product-specific denominator, broad AI forecasts cannot support TAM, SAM, SOM, or valuation.
    diligencePath: >-
      Obtain management's bottom-up market model and validate its category assumptions against independent analyst or
      government data.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-evidence
    missingEvidence: >-
      Named design partners or customers, buyer roles, budget ownership, procurement steps, willingness to pay, and
      sales-cycle evidence.
    whyItMatters: Buyer and payer evidence is required to turn broad application areas into a serviceable and obtainable market.
    diligencePath: Review customer discovery notes, pilot agreements, letters of intent, procurement feedback, and CRM pipeline data.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Reproducible benchmark results showing the magnitude, quality trade-offs, compute requirements, and task scope of
      any data-efficiency gain.
    whyItMatters: >-
      Technical proof is the first conversion point from a research thesis to a potentially differentiated product
      market.
    diligencePath: >-
      Commission technical review of benchmark protocols, baselines, training data, compute budgets, ablations, and
      reproducibility artifacts.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Product roadmap, packaging, pricing, go-to-market ownership, integration requirements, and commercialization
      milestones.
    whyItMatters: >-
      These inputs determine which spend is in scope, when adoption could begin, and how a realistic SAM or SOM should
      be modeled.
    diligencePath: >-
      Obtain the board-approved product roadmap, milestone plan, pricing hypotheses, design-partner pipeline, and
      commercialization budget.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-primary-evidence
    missingEvidence: >-
      Primary product, pricing, security, compliance, customer, and strategy materials for OpenAI, DeepMind, direct
      research-lab peers, and relevant internal-build alternatives.
    whyItMatters: >-
      Without equivalent primary evidence, the landscape cannot support a fair company-level ranking or a buyer-criteria
      comparison.
    diligencePath: >-
      Obtain and review current official product documentation, pricing, model evaluations, security materials,
      procurement records, and customer references for each named option.
    relatedQuestionRefs:
      - QP001
