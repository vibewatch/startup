    title: Differentiation is technically specific but not yet measurable
    body: >-
      Lower-level GPU primitives and a nonliteral brain-inspired search strategy
      are more specific than generic "efficient AI" positioning. Their value
      remains contingent on reproducible model-quality and data-efficiency results.
    claimRefs: [CE004, CE005, CE009, CE013]
  - calloutType: risk
    title: Productization and trust evidence are both missing
    body: >-
      The retained evidence does not establish a public developer surface,
      production deployment, reliability record, or documented security,
      privacy, safety, compliance, and quality controls.
    claimRefs: [CE006, CE013, CE014]
