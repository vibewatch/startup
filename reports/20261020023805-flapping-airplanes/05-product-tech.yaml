company:
  name: Flapping Airplanes
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Flapping Airplanes is publicly described as a research-first AI lab pursuing
    radically more data-efficient model training, with disclosed ideas spanning
    brain-inspired algorithms, lower-level GPU interaction, and applications in
    data-poor domains. The evidence does not yet establish a commercial product,
    benchmarked model, production deployment, public developer surface, or
    documented safety and compliance controls.
sections:
  - id: product-definition-and-maturity
    title: The current product is a research program, not a deployable SKU
    body: >-
      The public proposition is a fundamental-research program intended to train
      large models with materially less data than the dominant scaling approach.
      Independent summaries consistently describe that objective, while the
      company's own launch language frames the ambition as human-level thinking
      without consuming half the internet. That is a thesis and target outcome,
      not evidence of a shipped product. Aibase explicitly reported that no
      commercial product had launched at publication, and the assigned evidence
      identifies no named model, API, software package, customer deployment, or
      generally available SKU. For diligence purposes, the investable asset is
      therefore the team's research agenda and prospective know-how. Product
      maturity should remain pre-product until management supplies a prototype
      inventory, release criteria, benchmark results, and a roadmap connecting
      research milestones to an external user workflow.
    claimRefs: [CE001, CE006, CE007, CE012, CE013]
    tableRefs: [TE001]
  - id: disclosed-technical-hypothesis
    title: A differentiated hypothesis exists, but the implementation is not inspectable
    body: >-
      The most specific public technical description comes from the founders'
      AI Ascent appearance: the approach involves new primitives for interacting
      with GPU hardware and seeks algorithmic territory that mainstream
      frameworks such as PyTorch do not easily expose. Separate founder comments
      characterize the brain as evidence that other learning algorithms can
      exist, not as a blueprint to copy; silicon's compute, locality, and
      data-movement trade-offs should produce systems that differ from both the
      brain and today's transformer orthodoxy. This is a coherent research
      direction with a plausible systems component, but it is not a verified
      architecture. No retained source exposes model topology, training method,
      code, hardware configuration, ablation study, or reproducible benchmark.
      The architecture figure consequently maps only the disclosed hypothesis,
      not an inferred production stack.
    claimRefs: [CE002, CE004, CE005, CE009, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: workflows-deployment-and-roadmap
    title: Use cases are economically relevant hypotheses rather than deployments
    body: >-
      The founders connect data efficiency to domains where training data is
      structurally scarce, including robotics, trading, scientific discovery,
      and the long tail of industry problems. These are credible problem areas
      for a learning-efficiency breakthrough, but the evidence describes
      opportunity rather than customer workflow integration. No retained source
      identifies a design partner, pilot, production endpoint, latency or
      reliability target, support model, integration method, or measured user
      outcome. Public reporting also contrasts the lab's long-horizon research
      posture with cluster-scale programs optimized for nearer-term wins. The
      roadmap should therefore be underwritten as milestone risk: investors need
      dated evidence for prototype capability, independent reproduction,
      developer access, domain-specific evaluation, and commercialization
      sequencing before assigning value to the application layer.
    claimRefs: [CE003, CE006, CE008, CE010, CE011, CE015, CE016]
    tableRefs: [TE002]
  - id: trust-safety-and-technical-verdict
    title: Trust and operating controls are unverified
    body: >-
      None of the retained assigned sources documents a security program,
      privacy architecture, model-safety evaluation regime, quality-management
      system, incident process, external certification, or regulatory posture.
      That evidence gap must not be interpreted as proof that controls are
      absent, but it prevents a positive assessment of technical governance.
      The same limitation applies to reliability: without a public product,
      status history, service objective, or evaluation record, there is no basis
      to characterize uptime, robustness, or deployment support. The technical
      thesis is differentiated enough to merit continued diligence, especially
      because lower-level GPU primitives could create meaningful know-how.
      Investment readiness, however, depends on inspectable proof: reproducible
      data-efficiency gains, a documented developer surface, a productization
      plan, and trust controls proportionate to the intended domains.
    claimRefs: [CE004, CE013, CE014]
tables:
