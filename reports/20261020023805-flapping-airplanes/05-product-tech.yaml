        - Intended to explore algorithmic territory not easily reached through PyTorch
        - Code, interface design, hardware support matrix, profiling, and reproducibility
      - - Brain-inspired learning exploration
        - Internal research team
        - Research hypothesis rather than disclosed model architecture
        - Treats the brain as evidence of alternative algorithms without copying it literally
        - Algorithm specification, ablations, failure modes, and comparison baselines
      - - Domain application layer
        - Prospective robotics, trading, science, and industry users
        - Use-case hypothesis; no named deployment in retained evidence
        - Targets problems where data scarcity limits conventional training
        - Design partners, workflow integration, measured outcomes, and commercial packaging
    notes: >-
      Statuses reflect the retained 2026 source set; no row should be read as a
      production release, verified benchmark, or complete inventory of private research.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE010, CE013]
  - id: TE002
    title: Proposed workflows and evidence maturity
    columns:
      - User job
      - Current constraint
      - Publicly described solution
      - Measurable benefit
      - Limitation
    rows:
      - - Train capable models for data-poor problems
        - Limited domain data relative to internet-scale corpora
        - Improve learning efficiency through new model-training approaches
        - A 1,000-fold goal is reported, but no achieved result is published
        - No benchmark definition, denominator, task set, or independent reproduction
      - - Build robotics intelligence
        - Real-world interaction data is expensive and slow to collect
        - Apply more data-efficient learning to robotics
        - No measured benefit disclosed
        - No robot platform, task, deployment, partner, or safety evidence identified
      - - Accelerate scientific discovery
        - High-value scientific domains often have constrained observations
        - Use data-efficient models to expand feasible discovery problems
        - No measured benefit disclosed
        - No scientific domain, dataset, evaluator, or result identified
      - - Explore long-tail industry and trading problems
        - Proprietary or sparse data limits conventional frontier-model training
        - Lower the data threshold for domain-specific model development
        - No measured benefit disclosed
        - No customer, integration, economics, or production validation identified
    notes: >-
      The listed workflows are founder-described application hypotheses, not
      evidence of pilots, commercial availability, customer adoption, or achieved outcomes.
    claimRefs: [CE003, CE009, CE010, CE013, CE015, CE016]
  - id: TE003
    title: Evidence-bounded technology and operating architecture
    columns:
      - Layer or process
      - Disclosed role
      - Critical dependency
      - Principal technical risk
    rows:
      - - Problem selection
        - Prioritize domains where data scarcity constrains model capability
        - Valid tasks and representative evaluation data
        - Chosen tasks may not generalize or support commercial value
      - - Learning algorithm research
        - Search beyond current transformer and gradient-descent conventions
        - Novel algorithms that improve sample efficiency without losing capability
        - Research may fail to beat strong scaling baselines
      - - Brain-inspired hypothesis
        - Use biological learning as evidence that alternative algorithms exist
        - Correctly translating insights across radically different substrates
        - Analogy may not yield an implementable or superior method
      - - Systems primitives
        - Interact with GPU hardware below the abstractions readily exposed by PyTorch
        - Specialized compiler, kernel, and systems expertise
        - Performance, portability, and maintainability are undisclosed
      - - Evaluation and productization
        - Convert research gains into reproducible models and domain workflows
        - Benchmarks, developer interfaces, reliability, support, and trust controls
        - No public evidence yet supports this layer
    notes: >-
      This architecture is a synthesis of publicly described research concepts;
      internal components, interfaces, dependencies, and implementation maturity remain unverified.
    claimRefs: [CE002, CE004, CE005, CE007, CE013, CE014]
