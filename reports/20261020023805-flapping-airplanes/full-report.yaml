      - number: '2.3'
        title: Prospective buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The company names enterprise settings, robotics, trading, and scientific discovery as eventual
              applications, and independent summaries emphasize robotics and science where training data can be
              intrinsically limited. Those statements identify plausible segments, not customers. Likely users would be
              model researchers, machine-learning engineers, roboticists, scientists, or quantitative researchers;
              likely payers would sit in research, product, technology, or enterprise-AI budgets. The retained evidence
              does not identify a named buyer, user, payer, procurement route, or budget owner. Adoption would first
              require benchmarked efficiency gains, then a product or licensable asset, security and integration review,
              and a buyer-specific ROI case. The absence of those links prevents a credible near-term SAM or sales-cycle
              estimate.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
