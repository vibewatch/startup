              - CU009
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU005
              - CU013
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is the gating commercial diligence item
            body: >-
              Require named references, deployment records, usage cohorts, commercial terms, and renewal evidence before
              underwriting adoption, retention, expansion, or concentration.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Scientific and commercialization risk dominate
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is that a research-first lab does not convert its data-efficiency thesis into
              repeatable benchmark gains or a commercially usable system. Public coverage describes a goal of training
              models with materially less data and compute, while one outlet reports an aspirational 1,000-times
              efficiency improvement; neither is a published result. The strategy also contemplates long-horizon,
              low-probability research bets, and one retained source reported that no commercial product had launched at
              publication. The financing provides room to experiment, and coverage says radical ideas can be explored at
              small scale, but mitigation maturity remains early until independent benchmarks, reproducible methods,
              product milestones, and customer evidence appear. The core thesis should be treated as broken if the
              company reaches its next financing need without credible technical validation and a product path.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
