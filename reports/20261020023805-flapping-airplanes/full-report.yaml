      - number: '3.3'
        title: Pricing, distribution, and switching economics remain open
        blocks:
          - type: paragraph
            body: >-
              None of the substantive retained items provides a price, contract unit, packaging tier, buyer-specific
              discount, named customer deployment, integration, reseller, or partner channel for Flapping Airplanes. The
              same assigned evidence is insufficient to compare OpenAI, DeepMind, internal build, or status-quo tools on
              equivalent commercial terms. Consequently, there is no support for claims of customer lock-in, low
              switching cost, multi-homing, or distribution advantage. The appropriate comparison is a diligence matrix
              of knowns and unknowns, not a fabricated price sheet. Buyers could eventually value lower data
              requirements, but the sources do not yet connect that research objective to a product, procurement path,
              implementation burden, or realized total cost of ownership.
            claimRefs:
              - CP008
