      - number: '3.2'
        title: Differentiation is a research thesis, not yet a benchmarked capability
        blocks:
          - type: paragraph
            body: >-
              The company's strongest disclosed contrast is conceptual: it wants models that can reach human-level
              thinking without ingesting half the internet, drawing inspiration from the brain as evidence that
              alternative algorithms exist. Reporting also describes research ahead of concrete products and suggests
              that small-scale tests of radical ideas may be cheaper than incremental scaling experiments. That could
              matter in robotics and scientific discovery, where training data can be constrained. However, no retained
              source supplies a benchmark, model card, product specification, customer deployment, or head-to-head
              result. The positioning is therefore differentiated in intent but unproven in buyer value. The evidence
              map scores public substantiation rather than technical merit and deliberately keeps unsupported incumbent
              cells unknown.
