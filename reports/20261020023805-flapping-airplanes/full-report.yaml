              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Data scarcity and the cost of scaling are the central demand-side logic: materially more sample-efficient
              models could expand what is feasible in environments where proprietary, physical-world, or scientific data
              are limited. The counterweight is time and proof. Coverage contrasts compute-first projects seeking one-
              to two-year wins with research-first bets that may require five to ten years, and Flapping Airplanes says
              it is not currently commercializing. Its large seed financing can fund the search, but investor conviction
              is not independent evidence of end-market demand. For valuation, the critical milestones are reproducible
              benchmarks, a defined product boundary, named design partners, pricing, and evidence that an operating
              budget—not only venture capital—will pay for the improvement. None appears in the allocated public
              evidence.
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
