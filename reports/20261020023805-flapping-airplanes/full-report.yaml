        title: Exhibits
        blocks:
          - type: callout
            title: Market size is not yet underwritable
            body: >-
              The public record supports a technical problem and several possible applications, but not a product
              category, paying buyer, price, or bottom-up demand model. Treat broad AI market forecasts as out of scope.
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
              - CM015
          - type: callout
            title: Financing buys research time, not commercial validation
            body: >-
              The $180 million seed round expands the lab's ability to pursue long-horizon research, but it does not
              establish cash remaining, customer demand, or a serviceable market.
            calloutType: insight
            claimRefs:
