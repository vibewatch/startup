  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is broad but weakly disclosed
        blocks:
          - type: paragraph
            body: >-
              The retained evidence identifies OpenAI and DeepMind as the clearest incumbent reference points, while
              describing a broader class of frontier laboratories that prioritize larger datasets, compute clusters, and
              nearer-term scaling gains. Flapping Airplanes instead presents itself as a research-first laboratory
              searching for materially more data-efficient learning methods. No retained source identifies a
              like-for-like direct peer, and the pool does not substantiate competitor funding, target-customer,
              pricing, or product-scope profiles beyond those named incumbents. Internal AI research, existing frontier
              tools, and academic or open research therefore belong in the landscape as buyer alternatives, but they
              remain diligence hypotheses rather than evidenced competitors. This distinction prevents a thin source set
              from becoming a false market ranking.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP014
