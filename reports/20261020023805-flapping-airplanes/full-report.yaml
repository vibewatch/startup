        title: Commercialization follows uncertain research milestones
        blocks:
          - type: paragraph
            body: >-
              Management describes an explicit sequence: pursue foundational research first, test radical ideas cheaply
              at small scale, demonstrate material data-efficiency gains, and only then seek real-world feedback and
