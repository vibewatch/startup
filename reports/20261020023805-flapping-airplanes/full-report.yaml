      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financing provides room to investigate a high-upside technical thesis, but the public record does not
              support underwriting revenue durability, margins, sales efficiency, or capital adequacy. Independent
              coverage is largely derivative of founder interviews and the launch announcement, so repeated reporting of
              the same round is not independent validation of operating performance. The adverse case is a long research
              horizon, continued compute consumption, and another financing requirement before product-market evidence
              appears; one reviewed article frames research projects as potentially taking five to ten years and
              cautions against rapid-earnings expectations. Investment diligence should prioritize management accounts,
              compute contracts, cash and burn, research milestones, commercial pilot evidence, and the financing
              trigger that would force a new round.
