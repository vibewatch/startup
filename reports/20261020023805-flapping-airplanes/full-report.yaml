        title: Compute is the only disclosed cost signal
        blocks:
          - type: paragraph
            body: >-
              The clearest capital-use statement is the founder quotation that the $180 million raise is primarily for
              compute. That points to a potentially capital-intensive research program, but it does not quantify prepaid
              capacity, cloud commitments, hardware ownership, staffing, or the timing of expenditure. Nor do the
              reviewed sources disclose cash on hand, burn, runway, debt, working-capital needs, gross margin, or an
              itemized use-of-funds plan. The headline financing therefore cannot be treated as available cash or as
              proof of adequate runway. A defensible capital assessment requires bank balances, monthly burn by
