        title: Leadership, capital, and control
        blocks:
          - type: paragraph
            body: >-
              The three named co-founders are the only consistently identified leadership group in the assigned
              evidence. Their public commentary spans learning efficiency, brain-inspired algorithmic search, computer
              systems, and the transition from fundamental research toward possible applications. The company announced
              $180 million from GV, Sequoia, and Index, while an independent funding directory describes the same amount
              as total disclosed funding and the latest round as a February 2026 seed. That figure is capital raised,
              not cash currently available. Undisclosed extensions, secondaries, debt, preference terms, board rights,
