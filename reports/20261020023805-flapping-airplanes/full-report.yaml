  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and research mandate
        blocks:
          - type: paragraph
            body: >-
              Flapping Airplanes is a San Francisco-based AI lab founded in 2025 by Ben Spector, Asher Spector, and
              Aidan Smith. Public descriptions consistently frame it as research-first: the lab is exploring training
              methods that use materially less data than prevailing large-model approaches, taking inspiration from the
              human brain without committing to reproducing biological mechanisms. This is not yet a conventional
              product business model in the reviewed record. The available material describes a scientific program whose
              prospective commercial value would come from enabling capabilities in data-constrained settings. The
              snapshot therefore separates established identity and financing facts from unavailable valuation and
              operating metrics.
