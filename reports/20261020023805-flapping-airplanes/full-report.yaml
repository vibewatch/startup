  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Flapping Airplanes defines its field around foundational research that reduces the data required to train
              capable models, while expressly declining to focus on one technical method or vertical. That makes the
              relevant market narrower than total artificial-intelligence spending: today it consists of research inputs
              such as specialist talent, model training, evaluation, and compute directed at data efficiency. Potential
              downstream model licensing or application revenue belongs outside the current boundary until a product
              exists. The status-quo substitute is the prevailing scaling approach—more training data and larger compute
              clusters—rather than a directly comparable commercial vendor. Independent coverage consistently frames the
              lab as a counter-position to that approach, but does not establish that buyers have moved budget toward
              it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies a market value, growth rate, geography, or methodology that can support a
              conventional TAM, SAM, or SOM. Broad AI forecasts would be misleading because the company has neither
              selected a vertical nor defined a monetizable unit. The disclosed $180 million financing measures capital
              raised, not revenue, available cash, customer demand, or addressable spend. Likewise, the company's
              estimate that humans are 100,000 to 1,000,000 times more sample-efficient than existing models describes a
              technical motivation, not a market size. The defensible sizing sequence is therefore qualitative: prove an
              efficiency gain, package it into an offering, identify a budget owner, and only then estimate reachable
              spend. Until those links exist, valuation rests on research option value rather than a bottom-up
              commercial forecast.
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM012
              - CM013
