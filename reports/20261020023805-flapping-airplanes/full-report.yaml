      - number: '5.2'
        title: A differentiated hypothesis exists, but the implementation is not inspectable
        blocks:
          - type: paragraph
            body: >-
              The most specific public technical description comes from the founders' AI Ascent appearance: the approach
              involves new primitives for interacting with GPU hardware and seeks algorithmic territory that mainstream
              frameworks such as PyTorch do not easily expose. Separate founder comments characterize the brain as
              evidence that other learning algorithms can exist, not as a blueprint to copy; silicon's compute,
              locality, and data-movement trade-offs should produce systems that differ from both the brain and today's
              transformer orthodoxy. This is a coherent research direction with a plausible systems component, but it is
              not a verified architecture. No retained source exposes model topology, training method, code, hardware
              configuration, ablation study, or reproducible benchmark. The architecture figure consequently maps only
              the disclosed hypothesis, not an inferred production stack.
            claimRefs:
              - CE002
