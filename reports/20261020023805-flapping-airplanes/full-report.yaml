    title: Customers
    sections:
      - number: '6.1'
        title: Prospective users are visible; actual buyers and payers are not
        blocks:
          - type: paragraph
            body: >-
              Public evidence frames data-efficient AI as potentially useful where training data is constrained,
              especially robotics and scientific discovery, but it does not identify a commercial product, named buyer,
              end user, payer, geography, company-size band, or channel. Those application areas should therefore be
              treated as hypotheses about future demand rather than present customer segments. The official launch
              message emphasizes a research mission and financing, while third-party descriptions emphasize fundamental
              research and possible eventual commercialization. For underwriting, the key distinction is between
              technical beneficiaries and paying customers: neither the economic buyer nor a procurement path is
              publicly verified. The segmentation table consequently records what is suggested, what is absent, and the
              evidence needed before assigning revenue or strategic value.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU012
              - CU014
      - number: '6.2'
        title: Commercial adoption has not entered the public evidence trail
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a January 2026 public launch, a substantial research mandate, and an expected long
              development horizon, not an adoption curve. One independent article explicitly reported that no commercial
              products had launched, and the remaining retained sources supply no customer count, active-user count,
              paid account count, locations, deployments, utilization, repeat purchase, or revenue-linked usage measure.
              This prevents construction of a comparable growth series and makes any inferred conversion rate
              inappropriate. Altis advertises customer, go-to-market, and retention coverage, but its fetched public
              excerpt does not expose the underlying observations. The correct current baseline is therefore “not
              publicly disclosed,” with dates, denominators, and production status requested directly from management.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU010
              - CU011
              - CU013
      - number: '6.3'
        title: No named proof supports retention, expansion, or concentration analysis
        blocks:
          - type: paragraph
            body: >-
              Across the eight retained sources, no named organization is identified as a customer, design partner,
              pilot participant, production user, or reference account, and no attributable customer outcome is
              reported. The same evidence set contains no NRR, GRR, churn, renewal, contract-length, satisfaction,
              expansion, pricing, channel, or customer-revenue concentration disclosure. This is not proof that
              commercial relationships do not exist; it is a boundary on what can be verified from the assigned public
              evidence. A diligence sequence should move from a reproducible product result to a named design partner,
              scoped pilot, production deployment, renewal, and multi-workload expansion. Until management supplies
              those records, both durability and concentration remain unmeasurable, and logo-level assertions should
              receive no underwriting credit.
            claimRefs:
              - CU004
              - CU006
              - CU009
              - CU011
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU003
