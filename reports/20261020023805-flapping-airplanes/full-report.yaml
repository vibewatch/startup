              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Governance and compliance posture are not publicly underwritable
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies three founders and prominent financial backers, but it does not disclose
              board composition, investor rights, founder vesting, intellectual-property assignments, privacy controls,
              security controls, safety governance, licenses, certifications, litigation, or enforcement status. This is
              an evidence limitation, not evidence that defects or incidents exist, and the absence of a recorded
              incident cannot establish safety. Current deployment exposure may be lower while the lab remains
              research-first and without a reported commercial product, yet that stage-based mitigant expires as
              external users, sensitive data, or autonomous capabilities are introduced. Investment approval should
              therefore be conditioned on primary documents, management representations, and specialist legal, security,
              privacy, and model-safety review rather than on secondary launch coverage.
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Capital, founder, and ecosystem dependencies remain concentrated
        blocks:
          - type: paragraph
            body: >-
              Multiple outlets report a $180 million seed round backed by GV, Sequoia, and Index, which diversifies the
              named investor group and is a meaningful resource signal. It is not evidence of cash on hand, runway,
              burn, compute commitments, financing terms, or future capital availability. Execution is also concentrated
              around the three publicly named founders and a hiring model that values creative, unconventional talent;
              that approach may widen the talent funnel but does not substitute for succession, retention, and operating
              controls. No design partners, customers, cloud counterparties, or commercialization partners were
              identified in the retained evidence. The practical mitigations are milestone-based capital plans, founder
              succession coverage, documented decision rights, and partner diversification before product deployment.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Monitoring plan and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Quarterly monitoring should separate scientific progress from financing optics. Required indicators are
              independently reproducible data-efficiency gains against named baselines; research-to-prototype and
              prototype-to-product milestones; compute spend and committed capacity versus board-approved budget; cash
              runway under base and downside cases; founder and critical-researcher retention; and completion of IP,
              privacy, security, safety, and regulatory controls before external deployment. Immediate thesis-break
              triggers are material benchmark underperformance after a management-agreed validation window, repeated
              milestone resets without falsifiable results, loss of a founder or core technical cohort without
              succession, a material undisclosed IP or regulatory defect, or a financing need arriving without
              demonstrated technical and product progress. Until those indicators are available, residual severity
              remains high and the investment posture should remain diligence-led.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The reported $180 million seed round demonstrates fundraising capacity, but the evidence does not disclose
              cash available, burn, compute commitments, financing terms, or runway.
            calloutType: risk
            claimRefs:
              - CR001
              - CR013
          - type: callout
            title: Underwrite milestones, not the announcement
            body: >-
              Require independent technical benchmarks, a product validation plan, governance and IP documentation, and
              a downside runway model before treating the research thesis as investable.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR011
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and financing context
        blocks:
          - type: paragraph
            body: >-
              The investable conclusion is research-more, with medium confidence and high underwriting risk. A
              company-issued announcement and independent coverage consistently identify a $180 million seed round
              backed by GV, Sequoia, and Index, while the lab's stated objective is to train capable models with
              materially less data. That combination validates substantial sponsor support and a differentiated research
              mission, but not the entry price. Funding raised is neither company valuation nor current cash available,
              and the retained evidence does not disclose the financing instrument, ownership sold, liquidation
              preferences, governance rights, burn, or committed compute. The decision should therefore remain
              contingent on primary financing documents and operating evidence. A priced recommendation, target return,
              or hold period would create false precision from facts that are not public.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that data efficiency could open valuable domains where training data are scarce and could
              reduce dependence on brute-force scaling. The evidence supports that this is the lab's explicit research
              direction, not that the technical result has been achieved. The anti-thesis is correspondingly severe:
              AIBase reported that no commercial product had launched, a founder declined to provide a commercialization
              timeline, and Mezha framed research-led development as a class of long-horizon bets rather than a
              rapid-earnings proposition. No retained source supplies revenue, customers, benchmark results, or a
              current valuation mark. The core risk is thus conversion rather than idea novelty: substantial capital may
              finance a long discovery period without generating a measurable product or an observable basis for
              pricing.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Scenarios and price discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case requires independently reproducible evidence that the lab's methods improve data efficiency
              and then translate into a product, licensing relationship, or strategic asset. The base case is an
              extended research program funded by the seed round, with optionality but no supportable valuation range
              until milestones, spend, and financing terms are visible. The bear case is prolonged research without a
              commercial product, followed by additional capital needs or weak negotiating leverage. None of these cases
              can responsibly carry a numeric valuation or probability from the assigned evidence. Price discipline
              therefore means requiring primary cap-table and preference data, a milestone-linked budget, and technical
              proof before underwriting. The scenario table uses qualitative decision signals rather than invented
              ranges.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Final diligence should obtain the signed financing documents, fully diluted capitalization, preference
              stack, board and protective rights, cash balance, monthly burn, compute commitments, and milestone plan.
              The company should also provide reproducible benchmark protocols, baseline comparisons, product
              hypotheses, design-partner evidence, and a financing plan tied to technical and commercial milestones. A
              validated efficiency gain with a credible route to deployment would improve the view; a lower price alone
              would not cure missing technical proof. Thesis-break triggers include failure to reproduce claimed
              efficiency, material preference or governance overhang, runway that ends before the next measurable
              milestone, or continued absence of a commercial path as capital needs rise. Until these items are
              documented, exit readiness remains unassessable.
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate capital raised with value supported
            body: >-
              The $180 million figure establishes the size of the reported seed round. It does not establish company
              valuation, proceeds still available, preference seniority, or an acceptable entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV014
