      - number: '5.3'
        title: Use cases are economically relevant hypotheses rather than deployments
        blocks:
          - type: paragraph
            body: >-
              The founders connect data efficiency to domains where training data is structurally scarce, including
              robotics, trading, scientific discovery, and the long tail of industry problems. These are credible
              problem areas for a learning-efficiency breakthrough, but the evidence describes opportunity rather than
              customer workflow integration. No retained source identifies a design partner, pilot, production endpoint,
              latency or reliability target, support model, integration method, or measured user outcome. Public
              reporting also contrasts the lab's long-horizon research posture with cluster-scale programs optimized for
              nearer-term wins. The roadmap should therefore be underwritten as milestone risk: investors need dated
              evidence for prototype capability, independent reproduction, developer access, domain-specific evaluation,
              and commercialization sequencing before assigning value to the application layer.
            claimRefs:
