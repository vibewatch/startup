      - number: '5.4'
        title: Trust and operating controls are unverified
        blocks:
          - type: paragraph
            body: >-
              None of the retained assigned sources documents a security program, privacy architecture, model-safety
              evaluation regime, quality-management system, incident process, external certification, or regulatory
              posture. That evidence gap must not be interpreted as proof that controls are absent, but it prevents a
              positive assessment of technical governance. The same limitation applies to reliability: without a public
              product, status history, service objective, or evaluation record, there is no basis to characterize
              uptime, robustness, or deployment support. The technical thesis is differentiated enough to merit
              continued diligence, especially because lower-level GPU primitives could create meaningful know-how.
              Investment readiness, however, depends on inspectable proof: reproducible data-efficiency gains, a
              documented developer surface, a productization plan, and trust controls proportionate to the intended
              domains.
