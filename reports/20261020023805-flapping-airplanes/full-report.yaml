              - CP011
              - CP014
      - number: '3.4'
        title: Capital extends the research window but does not establish a moat
        blocks:
          - type: paragraph
            body: >-
              The announced $180 million seed financing gives the laboratory unusual capacity to pursue fundamental
              research, yet funding raised is not evidence of cash available, burn, runway, compute commitments, or
              commercial readiness. The central competitive risk is that the thesis remains easier to describe than to
              defend: incumbents can continue scaling while also researching alternative algorithms, and no public
              benchmark in the assigned evidence demonstrates a durable performance, cost, data, or adaptation
              advantage. A five-to-ten-year research horizon further increases displacement and execution risk before
              product-market proof arrives. The moat case should therefore be treated as conditional on reproducible
              benchmark gains, defensible intellectual property, productization, and distribution evidence, none of
              which is established by this chapter's source pool.
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Moat remains conditional
            body: >-
              Treat the data-efficiency thesis as an option on future technical proof, not as a current product moat,
              until reproducible benchmarks, customer adoption, pricing, and distribution evidence are available.
            calloutType: risk
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is still a hypothesis
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a research-first operating model, not an operating revenue model. A founder told
              TBPN Digest that the company was not yet working with enterprise customers, while the TechCrunch interview
              explains that signing large contracts now could redirect the team from foundational research toward
              delivery. The eventual opportunity is framed around data-constrained domains such as robotics, scientific
              discovery, and enterprise customization, but no source specifies a product, contract form,
              revenue-recognition policy, list price, or realized price. Accordingly, potential licensing, API access,
              and customization are diligence hypotheses rather than forecastable streams. Revenue quality cannot be
              scored until management provides signed contracts, deployment obligations, renewal terms, and the split
              between recurring software and service-heavy work.
