  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The current product is a research program, not a deployable SKU
        blocks:
          - type: paragraph
            body: >-
              The public proposition is a fundamental-research program intended to train large models with materially
              less data than the dominant scaling approach. Independent summaries consistently describe that objective,
              while the company's own launch language frames the ambition as human-level thinking without consuming half
              the internet. That is a thesis and target outcome, not evidence of a shipped product. Aibase explicitly
              reported that no commercial product had launched at publication, and the assigned evidence identifies no
              named model, API, software package, customer deployment, or generally available SKU. For diligence
              purposes, the investable asset is therefore the team's research agenda and prospective know-how. Product
              maturity should remain pre-product until management supplies a prototype inventory, release criteria,
              benchmark results, and a roadmap connecting research milestones to an external user workflow.
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE012
              - CE013
