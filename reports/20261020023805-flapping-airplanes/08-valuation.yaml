      - [Risk rating, High, "No launched commercial product was reported and the commercialization timeline is open.", "Require milestone and runway protection."]
      - [Valuation stance, Not supportable, "No current valuation, cap-table terms, secondary mark, or comparable range appears in the retained evidence.", "Do not infer valuation from funding raised."]
      - [Exit readiness, Unassessable, "No revenue, customer, return, hold-period, or exit inputs are publicly supported.", "Underwrite only after operating and financing evidence is produced."]
    notes: "Judgments use only the assigned public evidence; unavailable price, return, and operating inputs are shown as gaps rather than estimated."
    claimRefs: [CV001, CV005, CV009, CV010, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "The lab is explicitly pursuing materially more data-efficient model training.", "Reproducible benchmarks against named baselines would strengthen the thesis."]
      - [Thesis, "A large seed round permits a research-first program without immediate commercialization.", "A milestone-linked budget and documented runway would make the capital advantage underwritable."]
      - [Anti-thesis, "No commercial product had been launched in the retained reporting.", "A paid product, licensing agreement, or named design partner would reduce conversion risk."]
      - [Anti-thesis, "Public sources provide no valuation support and describe the research model as long-horizon.", "Primary round terms, cap table, and a credible next-financing plan would reduce price and dilution uncertainty."]
    notes: "Arguments distinguish verified company intent from unverified technical outcomes and private financing terms."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV012, CV013, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Reproducible data-efficiency gains and a credible product or licensing path emerge.", "Numeric range withheld until benchmark, ownership, and price evidence exists.", "Technical gains may not translate into deployable economics.", "Independent benchmark replication plus commercial counterparty evidence."]
      - [Base, "The seed round funds a multi-year research program while commercialization remains open.", "Value remains milestone-contingent; no public input supports a target return.", "Burn and compute commitments may consume runway before proof.", "Audited budget, runway, and milestone completion."]
      - [Bear, "Research remains prolonged, no commercial product emerges, and additional financing is required.", "Downside cannot be quantified without preference and ownership terms.", "Dilution, preference overhang, and weak financing leverage.", "Missed technical milestones or capital needs preceding product evidence."]
    notes: "Scenarios are qualitative because the assigned sources do not disclose valuation, probability, cap-table, burn, revenue, or exit inputs."
    claimRefs: [CV005, CV008, CV009, CV011, CV012, CV013, CV014, CV016]
