callouts:
  - calloutType: recommendation
    title: Do not equate capital raised with value supported
    body: >-
      The $180 million figure establishes the size of the reported seed round.
      It does not establish company valuation, proceeds still available,
      preference seniority, or an acceptable entry price.
    claimRefs: [CV001, CV010, CV014]
