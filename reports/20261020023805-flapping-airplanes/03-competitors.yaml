    notes: >-
      Cells report only what the retained sources substantiate; competitor comparisons are not
      independent benchmarks, and unknown cells must not be interpreted as inferior capability.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP013, CP014]
  - id: TP003
