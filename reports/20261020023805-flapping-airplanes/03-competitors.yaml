      - [OpenAI, "Unknown in assigned evidence", "Unknown in assigned evidence", "Unknown in assigned evidence", "No equivalent commercial comparison is supportable"]
      - [Google DeepMind, "Unknown in assigned evidence", "Unknown in assigned evidence", "Unknown in assigned evidence", "No equivalent commercial comparison is supportable"]
      - [Internal build, "Internal labor and compute not quantified", "Organization-specific", "No retained implementation evidence", "Build-versus-buy economics remain open"]
