        - label: Research thesis
          x: 5
          y: 3
          detail: "The data-efficiency objective is repeatedly described and company-confirmed."
        - label: Product availability
          x: 3
          y: 5
          detail: "One retained report states that no commercial product had launched."
        - label: Benchmark differentiation
          x: 1
          y: 5
          detail: "No benchmark or head-to-head performance result appears in the assigned evidence."
        - label: Pricing transparency
          x: 1
          y: 5
          detail: "No price, contract unit, or packaging term appears in the assigned evidence."
        - label: Distribution proof
          x: 1
          y: 5
          detail: "No named customer, deployment, integration, or channel appears in the assigned evidence."
    approximationNotes: >-
      Scores are ordinal analyst assessments of evidence completeness and diligence risk, not
      measured market performance or independent competitor benchmarks.
    claimRefs: [CP001, CP002, CP003, CP009, CP010, CP012, CP013]
callouts:
  - calloutType: risk
    title: Moat remains conditional
    body: >-
      Treat the data-efficiency thesis as an option on future technical proof, not as a current
      product moat, until reproducible benchmarks, customer adoption, pricing, and distribution
      evidence are available.
    claimRefs: [CP003, CP009, CP010, CP013]
