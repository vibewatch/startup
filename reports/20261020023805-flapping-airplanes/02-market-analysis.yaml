      Each narrower layer requires evidence not yet disclosed; widths and labels
      show analytical sequence rather than market magnitude.
    data:
      nodes:
        - label: Broad AI value pool
          value: Unquantified
          detail: Broad industry spend is excluded because it is not specific to data-efficient learning.
        - label: Data-efficiency research
          value: Defined thesis
          detail: The company focuses on reducing the data required to train capable models.
        - label: Proven technical advantage
          value: Not evidenced
          detail: No retained benchmark establishes a reproducible efficiency or capability gain.
        - label: Productized offering
          value: Not launched
          detail: The company says it is not currently trying to commercialize.
        - label: Budgeted buyer segment
          value: Not identified
          detail: No named buyer, payer, budget owner, customer, or design partner is disclosed.
        - label: Obtainable commercial market
          value: Not supportable
          detail: SOM requires pricing, conversion, capacity, and sales-cycle evidence that is not public.
    approximationNotes: >-
      This is a qualitative evidence hierarchy, not a value-proportional market
      pyramid; no unsupported numeric TAM, SAM, SOM, or conversion rate is shown.
