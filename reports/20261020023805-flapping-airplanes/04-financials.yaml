company:
  name: Flapping Airplanes
chapter:
  number: 4
  title: Financials
  summary: >-
    Flapping Airplanes has substantial seed financing but remains a research-stage
    company with no publicly evidenced customer revenue, pricing, or unit economics.
    The financial case therefore depends on converting a compute-heavy research program
    into differentiated models and then into commercial contracts before capital needs
    outrun an undisclosed cash and runway position.
sections:
  - id: revenue-model
    title: Revenue model is still a hypothesis
    body: >-
      Public evidence supports a research-first operating model, not an operating
      revenue model. A founder told TBPN Digest that the company was not yet working
      with enterprise customers, while the TechCrunch interview explains that signing
      large contracts now could redirect the team from foundational research toward
      delivery. The eventual opportunity is framed around data-constrained domains such
      as robotics, scientific discovery, and enterprise customization, but no source
      specifies a product, contract form, revenue-recognition policy, list price, or
      realized price. Accordingly, potential licensing, API access, and customization
      are diligence hypotheses rather than forecastable streams. Revenue quality cannot
      be scored until management provides signed contracts, deployment obligations,
      renewal terms, and the split between recurring software and service-heavy work.
    claimRefs: [CI005, CI006, CI010, CI013, CI016]
    tableRefs: [TI001, TI002]
  - id: cost-base-and-capital
    title: Compute is the only disclosed cost signal
    body: >-
      The clearest capital-use statement is the founder quotation that the $180 million
      raise is primarily for compute. That points to a potentially capital-intensive
      research program, but it does not quantify prepaid capacity, cloud commitments,
      hardware ownership, staffing, or the timing of expenditure. Nor do the reviewed
      sources disclose cash on hand, burn, runway, debt, working-capital needs, gross
      margin, or an itemized use-of-funds plan. The headline financing therefore cannot
      be treated as available cash or as proof of adequate runway. A defensible capital
      assessment requires bank balances, monthly burn by function, committed compute
      obligations, hiring plans, debt and preference terms, and milestone-based downside
      scenarios.
    claimRefs: [CI001, CI003, CI014, CI015]
    tableRefs: [TI003]
  - id: commercialization-path
    title: Commercialization follows uncertain research milestones
    body: >-
      Management describes an explicit sequence: pursue foundational research first,
      test radical ideas cheaply at small scale, demonstrate material data-efficiency
      gains, and only then seek real-world feedback and commercialization. The founders
      target a 1000-fold data-efficiency improvement, but they also say they cannot
      provide a timeline for solving the research problem or commercializing it. The
      resulting financial model is milestone-driven rather than period-driven. Near-term
      spending can be observed only through the compute allocation; product readiness,
      pilots, customer conversion, pricing, and gross profit remain future gates. The
      diagram is therefore a dependency map, not a forecast, and no conversion rate or
      duration should be inferred from its ordering.
    claimRefs: [CI003, CI006, CI007, CI008, CI009, CI010]
    figureRefs: [FI001]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The financing provides room to investigate a high-upside technical thesis, but
      the public record does not support underwriting revenue durability, margins, sales
      efficiency, or capital adequacy. Independent coverage is largely derivative of
      founder interviews and the launch announcement, so repeated reporting of the same
      round is not independent validation of operating performance. The adverse case is
      a long research horizon, continued compute consumption, and another financing
      requirement before product-market evidence appears; one reviewed article frames
      research projects as potentially taking five to ten years and cautions against
      rapid-earnings expectations. Investment diligence should prioritize management
      accounts, compute contracts, cash and burn, research milestones, commercial pilot
      evidence, and the financing trigger that would force a new round.
    claimRefs: [CI007, CI011, CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
