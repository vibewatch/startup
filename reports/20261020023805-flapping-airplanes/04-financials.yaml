      - Revenue quality
      - Diligence ask
    rows:
      - [Fundamental research, "No monetization mechanism disclosed", "Not applicable", "Active research phase", "No evidenced revenue", "Provide management accounts and revenue ledger"]
      - [Enterprise customization, "Potential future model adaptation", "Contract unit not disclosed", "No enterprise customers reported", "Hypothesis only", "Provide pipeline, pilots, contract form, and delivery obligations"]
      - [Robotics and scientific discovery, "Potential future vertical deployment", "Product and price unit not disclosed", "Opportunity discussed; no launch evidenced", "Hypothesis only", "Provide product roadmap, design partners, and paid-pilot evidence"]
      - [Research artifacts, "Planned public research releases", "No commercial unit disclosed", "Research output, not an evidenced revenue stream", "Non-revenue in current evidence", "Separate open research from proprietary monetizable assets"]
    notes: >-
      Partial public-evidence view as of 2026-10-20; proposed mechanisms are explicitly
      identified as hypotheses, and no row should be read as recognized or contracted revenue.
    claimRefs: [CI005, CI006, CI007, CI010, CI013, CI016]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offering or contract
      - List price
      - Realized price
      - Discounts or unknowns
      - Evidence status
    rows:
      - [Enterprise research contract, "Not disclosed", "Not disclosed", "Scope, term, and discounting unknown", "No current enterprise customers reported"]
      - [Model or API access, "Not disclosed", "Not disclosed", "No public product, usage unit, or packaging found", "Future possibility only"]
      - [Vertical customization, "Not disclosed", "Not disclosed", "Implementation and service burden unknown", "Commercial hypothesis without contract evidence"]
    notes: >-
      No retained source disclosed list or realized pricing; all unknowns require primary
      contracts, invoices, or an approved pricing schedule before modeling.
    claimRefs: [CI005, CI006, CI007, CI013]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue and ARR, "Not disclosed", "High confidence in disclosure gap", "Establishes whether monetization has begun", "Provide monthly recognized revenue, ARR bridge, and customer concentration"]
      - [Gross margin, "Not disclosed", "High confidence in disclosure gap", "Tests whether compute and service delivery can support attractive economics", "Provide COGS policy and gross margin by product or project"]
      - ["CAC, payback, and sales cycle", "Not disclosed", "High confidence in disclosure gap", "Measures repeatability of future go-to-market spending", "Provide funnel, acquisition cost, sales-cycle, and payback cohorts"]
      - ["Cash, burn, and runway", "Not disclosed", "High confidence in disclosure gap", "Determines financing dependency and next-round timing", "Provide bank balance, monthly burn, runway case, and financing trigger"]
      - [Compute commitments and utilization, "Raise reported as primarily for compute; amount not allocated", "Medium", "Likely largest disclosed capital-use driver", "Provide vendor contracts, committed spend, utilization, and experiment-level cost"]
    notes: >-
      Values are disclosure gaps rather than zeroes; the $180 million amount is funding
      raised, not cash available, burn, or runway.
    claimRefs: [CI001, CI003, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Capital-to-commercialization dependency path
    type: flow
    summary: >-
      Public evidence supports the ordering of dependencies, but not their timing,
      conversion rates, or eventual revenue magnitude.
    data:
      nodes:
        - id: seed-capital
          label: "$180M seed capital"
          detail: "Financing event, not a cash-on-hand or runway measure."
        - id: compute-program
          label: Compute-led research spend
          detail: "Founder said the raise was primarily for compute; allocation is undisclosed."
        - id: fundamental-research
          label: Fundamental research
          detail: "Current priority ahead of enterprise delivery."
        - id: efficiency-milestone
          label: "Target: 1000x data efficiency"
          detail: "Company aspiration, not a demonstrated operating metric."
        - id: real-world-validation
          label: Real-world validation
          detail: "Pilots, design partners, and measurable product evidence are not public."
        - id: commercial-revenue
          label: Commercial contracts and gross profit
          detail: "Product, pricing, revenue recognition, and delivery costs remain undisclosed."
      edges:
        - from: seed-capital
          to: compute-program
          label: funds
        - from: compute-program
          to: fundamental-research
          label: enables
        - from: fundamental-research
          to: efficiency-milestone
          label: seeks
        - from: efficiency-milestone
          to: real-world-validation
          label: must support
        - from: real-world-validation
          to: commercial-revenue
          label: could precede
    approximationNotes: >-
      Dependency sequence only; node spacing and ordering do not represent time, probability,
      value, or conversion, and later nodes remain unsupported commercial milestones.
    claimRefs: [CI003, CI006, CI007, CI008, CI009, CI010, CI016]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $180 million round is the only public capital magnitude in the retained evidence.
      Without current cash, burn, compute commitments, debt, and hiring plans, it cannot
      establish how long the company can fund its research program.
    claimRefs: [CI001, CI003, CI014, CI015]
