    CRED 是一家印度私营消费金融科技公司，2018 年由 Kunal Shah 创立，总部位于 Bengaluru。它最初是面向高端信用卡账单支付的奖励产品，如今已扩展为更宽的受监管平台，覆盖
    UPI、钱包和商户结账、借贷、财富、保险、旅行，以及由 Garage 牵头的车辆服务。公开证据指向超过 25 million 高信用会员、FY25 经营收入 ₹2,735 crore、月交易用户约 1.26 crore、支付规模约
