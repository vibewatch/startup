      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              CRED 仍然强烈地与创始人兼 CEO Kunal Shah 绑定。这一面是正面的：Shah 之前打造并退出
              FreeCharge，给他带来真实的支付市场模式识别、后期投资者信用，以及在印度创业和金融科技受众中有共鸣的个人品牌。另一面是集中度风险。已审阅来源显示，Shah 是战略、融资和产品方向的核心公开发言人；以
              CRED 的规模和监管复杂度来看，当前围绕更广泛董事会构成和继任规划的公开披露仍有限。


              可公开核验的非创始人管理层信息很少。产品发布和平台延展经常引用负责产品和增长的 Akshay Aedula，而客诉和受监管投诉则流向具名官员，而不是一个清晰披露的高管梯队。这留下治理不对称：CRED
              已拿到严肃牌照和安全认证，但对内部领导覆盖和董事会监督的披露，仍明显少于一家接近公开市场标准的金融科技公司应有水平。尽调角度看，公司运营成熟速度快于治理透明度表层。
            claimRefs:
