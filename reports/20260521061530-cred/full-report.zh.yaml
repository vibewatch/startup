      - number: '6.2'
        title: 采用轨迹与交叉销售深度
        blocks:
          - type: paragraph
            body: >-
              最有支撑的采用轨迹，不来自相互冲突的会员总数头条数字，而来自 FY24 和 FY25 的经营披露。FY24 材料披露月交易用户 11.5 million、月活用户 13 million，同时变现用户增长
              58%、获客成本下降 40%。FY25 披露又把月交易用户推到 12.6 million，交易频次达到每名用户每月 14.4
              笔。这一走势比静态会员口径更关键，因为它指向支付核心里的重复使用，而不是一个庞大但沉睡的安装基盘。


              交叉销售深度已经能看见，只是披露仍不均衡。Economic Times 报道称，近 45% 活跃会员使用三种或更多产品；这很有力地说明 CRED 不只是一款一次性的奖励 app。最清晰的相邻业务是
              Garage：2023 年 9 月开始向全体会员铺开；ETBFSI 后来称截至 2024 年 9 月平台上已有超过 60 lakh 辆车；Hindu BusinessLine 则报道，到 2025 年 7 月已有
              1.1 crore 辆车及超过 10 lakh 辆已投保车辆。公开发布报道还列出 Swiggy、BookMyShow、Urban Company 等钱包商户品牌，说明这不是停留在 PPT
              里的商户故事，而是真实上线的生产部署。


              较新的相邻业务是真实存在的，但表述要谨慎。2025 年初，e₹ 钱包显然仍处于 beta 和白名单阶段，并带有视频 KYC 和交易限额。Kuvera 则证明 CRED 想把财富管理扩展到支付之外。PA
              批准可能进一步扩大付款方和商户侧触达面。但公开披露在支付吞吐量、Garage 采用和钱包推出上的信息，仍远比商户数量、钱包 MAU 或财富产品客户结果丰富。
