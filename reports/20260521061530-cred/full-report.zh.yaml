        - 次优质或低频用卡用户，对专用 app 需求弱
        - 用户通常也是家庭预算负责人；伙伴靠触达变现
        - 最接近 CRED SAM 的口径
      - - 伙伴变现层
        - 发卡方获客、贷款、保险、商业，以及高端品牌触达富裕用户
        - 不面向富裕用户的普通大众商户收单
        - 伙伴是买方和付款方，会员是用户
        - 解释 CRED 为什么能在账单支付之外变现
      - - 排除的大众支付行为
        - 小额日常 UPI 转账、现金占比高的支出，以及单一 app 超级应用工具行为
