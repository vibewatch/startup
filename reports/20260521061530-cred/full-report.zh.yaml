      - number: '4.3'
        title: 经营杠杆与单位经济模型
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的是方向，而不是完整的单位经济模型桥。FY24 评论称，营销支出下降 36%，已变现客户增长 58%，月交易用户增长 34%，贡献利润率连续九个季度为正。FY25 报道随后显示更高交易频次，以及更大的
              TPV 和借贷 AUM。合在一起，这些信号支撑一个可信的经营杠杆故事：CRED 似乎在更有效地变现既有富裕用户基础，同时降低显性获客支出强度。


              仍然缺失的，正是投资者判断这种杠杆是否耐久所需的东西。公开资料没有 take-rate 拆解、没有毛利率披露、没有 CAC
              或回本计算，也没有可见的信用损失历史，无法让模型把借贷规模接到风险调整后贡献上。与上市同业相比，反差很强。PB Fintech、MobiKwik、Zaggle 和 Fino
              都在收入、直接成本、EBITDA、交易规模或其他运营指标上发布了丰富得多的公开披露。因此，CRED 方向上更强，但在精确投资核验所需输入上仍达不到公开市场级别。
