      - number: '8.3'
        title: 情景区间、入场纪律与退出路径
        blocks:
          - type: paragraph
            body: >-
              正确结论不是 $3.5 billion 荒谬，而是当前估值已经计入相当多的执行成功。乐观情景需要 FY26 收入大致落在 ₹3,200-3,500 crore 区间，亏损进一步压缩，并且披露进展足够充分，让
              IPO 准备从愿景变成可验证事项。在这些条件下，约 ₹38,000-47,000 crore 的估值是可能的，因为 CRED
              可以争取接近印度公开市场可比公司上沿的优质消费金融科技倍数。基准情景更克制：十几个百分点的增长、进一步运营杠杆，以及只部分改善的披露，支撑约 ₹26,000-34,000
              crore，基本包住当前估值。悲观情景则更尖锐地提醒：没有条款清单细节，私募市场保护很弱；如果上市金融科技倍数压缩、信贷表现令人失望，或伙伴复杂度比公开证据显示的更棘手，价值可能滑向约
              ₹14,000-22,000 crore。


              因此，入场纪律是投资建议的核心。仅靠公开信息的投资者不需要证明 CRED 被高估；只要认定按今天的估值，上行并不明显非对称就够了。更可投资的设置，要么是更低价格，大致低于 ₹24,000-27,000
              crore；要么是在当前估值上配套更好的尽调材料包。退出逻辑也重要。最现实的路径是 IPO 或大额老股交易，而不是干净的战略出售，因为公司如今横跨多个受监管且伙伴很重的产品。如果 IPO
              级披露材料包不到位，当前价格更可能表现为高端私募估值，而不是便宜入场点。
