      - number: '4.5'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              正确的财务结论是有层次的。收入动能真实，经营杠杆在改善，平台也明显越过了狭窄的信用卡提醒 app 开始变现。与此同时，公开记录仍不足以支撑投资级核验。最大阻塞点是分部结构未解、take-rate
              披露缺失、没有毛利率拆解、未披露现金和资金续航，以及即便借贷和 DLG 敞口已经重要，也没有公开信用损失历史。


              这意味着第 4 章不应过度声称。证据支持这是一个营收增长、支付、借贷、保险和财富经济性越来越相关的业务。证据不支持对常态化毛利、稳态 CAC 或自我造血耐久性做精确陈述，也不支持对每一条收入线做干净的自营 vs
              代理判断。投资核验模型需要审计后的 FY25 报表、产品级收入和成本披露、信用表现分群、DLG 历史和当前流动性。在那之前，CRED 的财务故事方向上改善，但披露仍不足，无法给出精确投资核验信心。
