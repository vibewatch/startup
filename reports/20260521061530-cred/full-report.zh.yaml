  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级或流程
      - 公开证据
      - 交付角色
      - 关键依赖
      - 主要风险 / 约束
    rows:
      - - 会员应用和准入门槛
        - 关于页面，加 Android 和 iOS 商店文案
        - 控制入驻、卡片验证、评分提示和入口导航
        - Apple 和 Google 分发，加征信局关联的准入检查
        - 公开入口显示有门槛，但不披露各模块的具体评分阈值逻辑
      - - AWS 托管的安全边界
        - 安全页面
        - 提供计算、存储、分段、防火墙、CDN 和 DDoS 防护
        - AWS 基础设施和内部变更管理纪律
