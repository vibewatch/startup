      - number: '6.4'
        title: 集中度与客户结论
        blocks:
          - type: paragraph
            body: >-
              因此，CRED 的客户结论是：采用质量为正，但持久性和证据广度仍要打折。公司似乎已经在信用良好的印度持卡人中建立起有规模的用户资产，具备重复支付行为、高应用商店互动、真实 Garage
              采用，以及向保险、钱包和财富入口先落地再扩张的清晰证据。对一个设有高端门槛的金融科技产品来说，这是实质性的客户牵引。


              主要风险不在于没有用户，而在于集中度和证据盲区。第一类集中风险是客群筛选：CRED 仍绑定富裕、高信用分持卡人，所以即便下载量大，也比开放接入的大众 UPI 网络更窄。第二类是产品集中：ETBFSI 称超过
              90% 收入仍来自支付、贷款和保险，这意味着即便入口变宽，变现仍集中在少数金融垂直领域。第三类是伙伴集中：商户扩张、保险公司、保荐银行和转售流程都依赖第三方，而这些第三方的交易量和服务水平只部分公开。


              最关键的是，公开记录撑不起一个清晰的留存故事。客户数量标签互相冲突；商户结果数据稀疏；服务质量证据也混合。投资者可以把 CRED
              看作一个有选择性但已经规模化的消费金融科技客户基盘，并且具备可见交叉销售；但在把这项用户资产视为完全持久之前，仍应要求管理层交付对齐后的会员定义、队列留存、商户钱包 MAU、保险转化和工单解决指标。
