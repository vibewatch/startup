      - number: '1.5'
        title: 负面信号与未决问题
        blocks:
          - type: paragraph
            body: >-
              公司概览层面的结论方向上偏正面，但并不干净。最清晰的负面信号是 2025 年降价融资：收入更强、经营亏损更低，投资者仍把 CRED 从 $6.4 billion 下调到 $3.5
              billion。这说明市场正在折价处理以下一项或多项因素：变现耐久性、治理不透明、消费金融科技风险偏好，或者把高端用户品牌转化为公开市场质量盈利的不确定性。对一家拥有支付、借贷、保险和财富邻近业务的公司来说，公开治理披露也相对偏薄。


              第二个未解问题，是用户口径不清。官网在访问日称拥有超过 25 million 高信用会员，2026 年 3 月支付新闻稿提到 1.5 crore 富裕印度人，FY25 经营材料则指向 12.6 million
              月交易用户。这些数字不一定相互矛盾，但也没有被清晰对齐。最后，公开来源仍未披露当前合并口径员工数，也没有提供正式 IPO 文件。这些缺口不推翻投资逻辑，但会降低任何简单化「高端超级应用」叙事的可信度。
