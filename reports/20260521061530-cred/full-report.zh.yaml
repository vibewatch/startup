  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 已披露规模与收入质量
        blocks:
          - type: paragraph
            body: >-
              FY24 和 FY25 显示出真实放量，但证据大多仍是管理层说法经媒体转述，而不是已提交财报。支撑最强的数字是 FY24 收入 Rs 2,473 crore、FY25 经营收入 Rs 2,735
              crore，同期经营亏损从 Rs 609 crore 收窄到 Rs 298 crore。方向上很强，但这不等于已有审计后的产品级披露。公司显然在处理很大的交易规模：FY24 TPV 达到 Rs 6.87 lakh
              crore，FY25 TPV 达到 Rs 8.5 lakh crore，FY25 月交易用户升至约 1.26 crore，借贷 AUM 据报约为 Rs 22,000 crore。


              质量问题不是收入是否存在；收入确实存在。问题是，其中多少收入是经常性、高毛利、低激励依赖，并且能穿越监管和合作伙伴组合变化。来源包支持有意义的收入动能，但也显示 CRED
              仍通过选择性外部报道沟通财务表现。对尽调来说，这意味着规模可以承认为真实，但围绕结构、take rate 和利润率的精度必须明确设边界。
