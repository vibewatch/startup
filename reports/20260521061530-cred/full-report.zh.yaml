    title: 流程 / 使用场景表
    columns:
      - 用户任务
      - 现有流程证据
      - CRED 方案
      - 明示收益或承诺
      - 限制 / 约束
    rows:
      - - 在一处管理并偿还多张信用卡
        - 关于页面和应用商店描述
        - 统一管理信用卡、提醒还款，并绑定信用评分奖励
        - 减少应用切换，也给出更多还款纪律提示
        - 公开材料没有披露奖励经济性和失败率指标
      - - 不暴露完整身份信息也能向商户付款
        - CRED Pay 页面
        - 别名 UPI ID 和二维码支付
        - 商户看到的敏感信息更少
        - 商户受理范围和争议指标未公开
      - - 用手机快速线下非接触支付
        - Tap to Pay 页面
        - 借助 NFC 和 HCE 把手机当卡使用
        - 没有实体卡，也能更快完成现场刷卡流程
        - Android NFC 和合作卡门槛大幅收窄覆盖面
      - - 预存余额并在合作商户结账
        - 2024 年 10 月上线报道
        - 钱包、商户奖励和设备令牌化的已存卡结账
        - 在支持商户减少重复录入摩擦
        - 需要 KYC，商户侧经济性不透明
      - - 用 CBDC 转账和向商户消费
        - 2025 年 1 月 CNBC 测试报道
        - 带视频 KYC、由 YES BANK 支持的 e₹ 钱包
        - 可转至绑定 UPI 的账户和其他 CBDC 钱包，商户不额外付费
        - 仍处测试、白名单阶段，并受已披露转账和余额上限约束
      - - 管理车辆保养和保险
        - Garage 上线及保险方扩张报道
        - DigiLocker 文件、提醒、数字理赔发起、保费比较、礼宾服务
        - 把账单支付习惯延伸到更黏的车辆生命周期流程
        - 官方模块页面过薄，无法完整走查运营流程
      - - 投资，或以投资组合资产质押借款
        - Mint 页面和应用商店贷款文案
        - 通过 Liquiloans 做 P2P 投资，并以共同基金质押借款
        - 不卖出共同基金，也能获得收益、流动性或杠杆
        - 公开风险、转化和已实现经济性信息仍稀疏
      - - 解决支付或账户问题
        - 客服页面和评论界面
        - 应用内支持、社交私信路径、申诉升级
        - 支持嵌在会员已使用的同一应用流程里
        - 没有公开的语音优先支持热线，故障时会放大感知风险
    notes: 收益只限于保留页面明确承诺的内容；各行不推断隐藏的转化、留存或可靠性指标。
