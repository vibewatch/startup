      - number: '6.3'
        title: 支持、证据质量与持久性缺口
        blocks:
          - type: paragraph
            body: >-
              公开客户证据最强的地方，是移动平台直接摊开的数据。Google Play 显示 50M+ 下载量、约 2.95 million 条评论和 4.8 评分；Apple 查询 API 则显示 4.8 分和
              593,339 个评分。即便 CRED
              承认自己的会员基盘带有筛选门槛，这也足以证明公司已经摆脱纯小众状态。它还给本章提供了第二个有价值的视角：不同于创始人引述或公司页面，应用商店会把真实用户的大规模认可与批评同时摊开。


              批评也不轻。近期 Google Play 评论抱怨奖励和返现变得没那么有用，客服工单未解决就被关闭。App Store
              评论还提到新增卡片或更换手机号后支付失败，以及很难绕开机器人主导的客服。这些片段无法量化投诉占比，但确实暴露出公开反复出现的反向主题：奖励稀释、服务闭环受挫，以及支付或身份流程出问题时的可靠性疼点。客服模式本身也明确偏数字优先，因为
              CRED 称支持入口在 app 内、邮件和社交私信，而不是公开电话线。


              持久性是公开证据明显变薄的地方。本章没有可信的公开净留存率（NRR）、总留存率（GRR）、流失率、续约、队列留存或合同期限数据可依赖。具名证据也有限：公开记录能看到商户、保险公司、保荐银行和转售伙伴，但量化的终端客户案例并不多。因此，合适的尽调立场是承认强采用证据和可见交叉销售，同时拒绝把留存或客户满意度夸大到评分和评论片段之外。
