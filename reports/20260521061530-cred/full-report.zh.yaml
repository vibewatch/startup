      - number: '3.4'
        title: 负面证据与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              最清晰的负面证据是，行业正在走向更重监管、更标准化的轨道和更严苛的资本市场审视。The Times of India 报道信用卡账单支付迁入 BBPS
              路由，这会改善信任和客诉处理，但也压缩第三方覆盖层在后端做差异化的空间。Business Standard 2026 年 5 月的金融科技重置文章称，公开市场投资者现在把现金流、治理、合规可信度和 ROE 放在
              GMV 或用户增长叙事之前；Economic Times 则称，包括 MobiKwik 和 Paytm
              在内的上市金融科技公司正在收集多张牌照，因为监管者越来越偏好完整的受监管实体。对任何产品复制速度快于经济性复利速度的玩家来说，这都是负面因素。

              Fi 在 2026 年 3 月的转型，是这一组证据中最具体的合作伙伴依赖警示：Fi app 不能再开立新储蓄账户，用户被推向 Federal Bank 的 app，Fi-Points 累积也结束。CRED
              不是新银行克隆，但教训可以迁移。只要银行、发卡方或支付轨道仍是受监管锚点，一个打磨精良的 UX 层就未必真正拥有客户。RuPay credit-card-on-UPI
              扩张带来第二条负面向量，因为它把日常信用受理面扩大给大众 app 和商户网络，而不只是专业覆盖层。因此，护城河判断偏谨慎：CRED
              仍有差异化高端品牌和强信任信号，但除非它能让富裕用户参与度、合作伙伴变现和监管可信度持续领先于已经拥有分发或核心经济性的生态，否则商品化风险很高。
