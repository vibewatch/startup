  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层客户基础
        blocks:
          - type: paragraph
            body: >-
              CRED 的客户基础从一开始就刻意自上而下分层。官网、关于页面和应用商店文案都把会员资格锚定在高信用上，公开门槛表达为 750+ 信用分或等效高端信用画像。这让核心用户不同于大众开放式 UPI
              钱包：公司并不试图赢下印度每一个支付用户，而是瞄准想要一个控制面板来管理账单、信用分跟踪、奖励和邻近金融产品的富裕持卡人。这个选择性门槛很重要，因为它同时解释了 CRED
              的品牌定位和集中度风险：公司最强的地方，是高端信用卡行为已经密集的地方。


              在这个选择性切口内部，公开证据至少支持五个有意义的客户群。第一类是为信用卡账单支付和信用分管理加入的富裕或高分持卡人。第二类是从账单支付扩展到两个或更多邻近产品的多产品活跃会员；FY25 报道称，近 45%
              活跃会员使用三个或更多产品。第三类是车辆所有者群体，现在通过 Garage 处理提醒、保险和转售流程。第四类是白名单 CBDC beta 客群，在 video-KYC 和余额限制下使用 e₹
              钱包。第五类是大众应用商店受众：即便会员资格有选择性，CRED 仍显示 50M+ Google Play 下载、近 3 million 条 Play 评论，以及超过 593,000 个 App Store 评分。


              关键限制是，CRED 的总客户数高度口径敏感。官网称超过 25 million 高信用会员，应用商店称 1.4Cr+ 会员，2024 年 10 月报道把会员和商户用户基础定在 14 million，2026 年
              3 月 PA 报道则称超过 15 million 用户。这些数字应作为相互冲突的公开界面被保留，而不是压缩成一个整齐数字。
