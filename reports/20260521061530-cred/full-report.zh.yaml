        - 直接市场估值和可比数据扎实，但核心单位经济性仍未公开。
      - - 风险评级
        - 高
        - 合作伙伴、牌照、信贷和披露复杂度会迅速压缩 IPO 区间。
      - - 估值立场
        - $3.5B 估值介于合理与偏高
        - 约 11x FY25 收入，只有在披露和执行继续改善时才站得住。
      - - 入场纪律
        - 除非尽调改善，否则偏好 ≤₹24,000-27,000 crore
        - 相比上市同业可比估值，这一区间上行空间更清晰。
      - - 可能退出路径
        - IPO 或大型后期老股交易
        - 对一个多轨道、重合作伙伴的平台来说，战略出售逻辑较弱。
    notes: 汇总结论仅基于公开信息，并有意避免对条款、稀释或分部利润率给出虚假的精确度。
