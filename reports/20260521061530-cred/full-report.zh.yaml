  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 何种证据会改变判断
    rows:
      - - 市场 / 品牌
        - 高端用户定位和宽金融产品面，可能支撑比大众市场同业更高质量的变现。
        - 高端品牌力本身不能证明抽成率或复购经济性可持续。
        - 展示队列留存、付费用户深度和产品层面贡献利润率。
      - - 经营轨迹
        - FY24-FY25 收入增长且经营亏损收窄，说明纪律在改善。
        - 净亏损仍大；公开证据无法区分结构性经营杠杆、会计因素或业务组合影响。
        - 提供经审计的 FY25-FY26 从收入到贡献利润和净利润的桥接。
      - - 可比公司定位
        - 当前定价可以参照 Paytm / PB 这类高质量可比公司，而不是低倍数边界样本。
        - 这些高倍数同业已经上市、披露更充分；PB 还已盈利。
        - 缩小披露差距，证明 CRED 应进入这个溢价桶。
      - - 产品宽度
        - 支付、贷款、保险、财富和车辆流程打开多条变现路径。
        - 产品摊子过大，会遮住疲弱的单位经济性，也会增加合作伙伴和合规复杂度。
        - 说明哪些产品扣除支持、风险和合作伙伴成本后仍有吸引力回报。
      - - 融资重置
        - 2025 年估值下调已经消化了 2022 年大部分泡沫，把预期拉回更接近 IPO 逻辑。
        - 如果仍可能再降评级，估值重置并不会让当前价格自动变得有吸引力。
        - 先证明 FY26 增长韧性和 IPO 准备度，再期待重估。
      - - 披露质量
        - 官方披露已经确认合作伙伴名单、DLG 敞口和支付权限。
        - 最能支撑决策的数据仍未公开，包括融资条款、亏损和分部经济性。
        - 开放数据室，提供融资条款、信贷损失和分部报告。
    notes: 估值判断的关键不只是 CRED 是否是一家好公司，而是当前价格、披露和风险是否匹配。
    claimRefs:
      - CV003
      - CV010
