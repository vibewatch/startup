      - number: '4.2'
        title: 变现机制与收入确认细节
        blocks:
          - type: paragraph
            body: >-
              变现栈现在比最初的信用卡提醒产品宽得多。支付变现体现在 UPI 扫码支付、商户 QR 受理、钱包预充值和设备 token 化结账。借贷变现体现在合作伙伴发放的个人贷款和
              cash+，后者被明确呈现为以共同基金为抵押的借款。保险变现也很明确：CRED Garage 被描述为佣金驱动的市场，其车辆基础扩张很快，足以让这条业务线具备经济意义。Kuvera 则把同样模式延伸到财富分销。


              这种宽度很重要，因为它改变了财务报表应被解读的方式。公开证据强烈显示，CRED
              的很多经济性更像代理或分销，而不是纯本金风险或纯软件订阅收入。商户支付依赖受监管支付轨道，借贷依赖合作贷款方和联合贷款结构，保险依赖承保方佣金，财富依赖分销关系。结果是收入多元性改善，但也带来一个很大的确认问题：投资者仍看不清已披露收入哪里是总额、哪里是净额，也看不清披露营收中有多少绑定在合作伙伴提供的资产负债表和佣金经济性上。
