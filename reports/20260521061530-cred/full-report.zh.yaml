      - number: '5.3'
        title: 信任、隐私、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              CRED 最好的公开技术证据集中在信任和合规披露，而不是工程深潜。对一个消费金融科技营销页面来说，安全页异常具体：AWS Virtual Private Cloud、防火墙和 WAF 层、DDoS
              防护、CDN、三层分段、静态加密、敏感数据应用层加密、备份与恢复实践、变更管理、NOC 和 ISMS 流程，以及定期经过 CERT-In
              审计的测试。隐私页补充说明，用户可以撤回权限并要求删除，同时警告某些留存可能因法律原因继续存在。合在一起，这些页面支撑了真实的控制叙事，即便它们没有提供架构图或认证编号。


              合规宽度也很重要，因为它直接映射到产品范围。CRED 公开声称 PCI DSS v4.0.1 Level 1、ISO 27001:2022、ISO 27701:2019、tokenisation 合规、UPI
              合规和印度数据本地化。2026 年 3 月 PA 材料在安全文案之外增加了监管宽度：PPI 批准、PA 授权，以及集团层面的 IRDAI、SEBI 和 NPCI 权限。借贷方面，官方披露比大多数金融科技消费
              app 走得更远，列出了贷款方、DLG 敞口、分包商和催收机构。限制在于，这些证据主要证明控制和义务存在；它们并不能独立证明事故频率、商户质量指标，或每项控制在生产环境中的表现。
