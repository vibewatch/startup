      - number: '7.2'
        title: 运营与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险很高，因为 CRED 的产品承诺如今建立在有规模、重度依赖伙伴的流程之上。UPI 争议会穿过 TPAP、PSP 银行、账户银行、NPCI 和 Ombudsman 多层。贷款披露显示，12 家技术提供商和
              47 家催收或回收机构会触达信贷产品。保险分销依赖外部承保方和理赔体验。即便公开控制看起来认真，客户体验仍只会和链条里最慢的支付通道、申诉流程或服务供应商一样强。


              这形成了独特的传导模式。部分资产负债表风险由贷款方和保险公司承担，但投诉风险、信任流失和监管审视仍可能落到 CRED 身上，因为用户只看见一个 app。同样的问题也出现在客服设计上：只在 app
              内提供支持可以降低诈骗面，也契合数字化运营模式；但一旦支付失败、退款拖久或催收互动变得对抗，这种设计就会变成瓶颈。产品扩张会放大这项负担。Garage、支付、贷款、保险和相邻金融产品一起扩大了必须同时被控制住的失败模式集合。
