      - number: '5.5'
        title: 产品技术结论
        blocks:
          - type: paragraph
            body: >-
              产品技术结论是，CRED 已演进为受监管消费金融科技控制平面，而不是狭窄奖励覆盖层。证据清晰支持它在支付、商户结账、卡片相关借贷和投资、Garage 主导的保险和车辆流程，以及新的 CBDC beta
              上有真实宽度。证据也支持真实控制叙事：云安全披露、隐私和本地化承诺、明确 UPI 角色框定、具名贷款合作伙伴和供应商，以及如今出现在 RBI 运营商名单上的直接 PA 授权。


              主要谨慎点不是产品虚构，而是公开证据质量在不同模块间差异很大。支付、权限和信任控制的证据相对充分。Garage
              的外部描述足以支持流程分析。但几个更新或邻近界面仍然在官方文本层面披露不足，公开开发者信号也弱。这意味着投资者可以把 CRED
              核验为一个宽广、重合作伙伴的金融科技平台，并承认其合规成熟度有意义；但在把每个模块都视为同等成熟之前，仍应要求产品级流程走查、商户指标、事故历史和内部架构证据。
