      - - UPI TPAP / PSP 银行栈
        - UPI FAQ 加 CRED Pay 营销材料
        - 支撑 UPI ID、争议升级、可审计性和数据本地化义务
        - PSP 银行、NPCI 规则和 RBI 监管
        - 保留材料未捕捉到官方 TPAP 注册名录的直接证据
      - - 商户支付、钱包和 PA 层
        - 2024 年 10 月上线报道，加 2026 年 3 月 PA 来源
        - 支撑商户入驻、收款、结算、退款，以及消费者储值场景
        - PA 和 PPI 许可、商户合同、结算运营
        - 商户规模、退款账龄和备付实践大多不公开
      - - 卡令牌化和 Tap 层
        - Tap 页面加钱包上线报道
        - 把已存卡结账和 NFC 现场刷卡体验接入应用
        - Visa 令牌化、Google HCE、发卡方卡片开通
        - 设备和发卡方依赖限制全面铺开
      - - 贷款编排层
        - 应用商店贷款文案和法律披露
        - 支撑 DLA 和 LSP 流程、贷款方分发、DLG 披露和催收交接
        - 贷款方、KYC 供应商、支付供应商和债务咨询机构
        - 单位经济性、行为质量和合作方集中度没有完全公开
      - - Garage 和保险运营
        - Moneycontrol 和 BusinessLine 报道
        - 延伸到文件、提醒、保险比较、理赔发起和礼宾支持
        - DigiLocker 和保险合作方网络
        - 外部流程描述不错，但官方一手架构细节仍弱
      - - 支持和申诉流程
        - 客服、隐私和 UPI FAQ 页面
        - 承接支持、欺诈警示、投诉状态和升级路径
        - 内部支持运营和申诉官流程
        - 未发布公开 SLA、回拨渠道或事件响应指标
    notes: 该表只映射公开可支撑的运营模型；刻意不虚构内部服务边界或专有数据管道细节。
