      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              只有保留多重视角，才能给这个市场定规模。RBI 的 Payment Systems Report 是最好的外层系统基准：截至 2024 年的十年里，数字支付量增长 38x，金额增长超过 3x，UPI 占 2025
              年 H1 支付笔数的 85%。DigiDhan 仪表盘同样显示，FY25 有 23,834 crore 笔数字交易，仅 2025 年 3 月 UPI 交易就有 1,830.151 crore
              笔。这些数字重要，因为它们解释了 CRED 所搭乘轨道的规模；但它们本身并不描述一款专业信用 app 的可变现市场。

              在这个更宽系统内部，卡片层增长足够快，值得重视。ET 引用 RBI 数据称，2025 年信用卡交易量达到 570 crore 笔，金额达到 Rs 23.2 lakh crore，即便借记卡使用在下降。PwC
              预计到 FY30 仍会保持强势，但分析型市场数据提供商对「信用卡市场」本身的含义分歧很大。6Wresearch 给出 2026-2032 年 11.7% CAGR，而 IMARC 把市场框定为 2025 年
              USD 20.1 billion，到 2034 年增至 USD 39.5 billion，CAGR 为
              7.49%。这些不是可以拿来求平均的算术输入。它们很可能在不同时间窗口里混合了交易活动、发卡方经济性和生态价值。对尽调来说，矛盾本身就是重点：市场增长乐观是真实的，但精确 TAM 主张高度依赖定义。
