chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              CRED 是一家总部位于 Bengaluru 的印度消费金融科技公司，由 Kunal Shah 于 2018
              年创立。它最初的切口窄但有价值：帮助高信用消费者按时支付信用卡账单，用奖励强化这种行为，再借由形成的信任信号搭建高端商业和金融服务生态。产品明确不是面向大众市场的支付工具。官网和关于页面都把它描述为面向高信用人群的会员制俱乐部，公司也继续以高信用分设门槛；发布早期和当前材料都反复提到
              750+ 门槛。


              当前运营模式已经远超最初的账单支付产品。CRED 现在把卡片和账单管理、UPI 支付、奖励、钱包预充值、借贷、P2P
              投资、旅行、财富和车辆服务放在同一界面。各来源呈现出的战略模式一致：公司先抓住可信的富裕会员基础，切入高频支付流，再靠邻近金融产品和高端合作伙伴体验把关系变现。公开披露还显示，这已不再是轻量导流模型；CRED
              现在踩在支付、保险、顾问和借贷相关牌照轨道上，而这些轨道对业务已很关键。
