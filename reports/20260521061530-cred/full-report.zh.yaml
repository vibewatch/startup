        - e₹ 钱包转账和商户交易
        - 仅测试、视频 KYC 门槛、余额受限的钱包
        - 显示 CRED 愿意用高端用户试验新支付轨
        - 推出进度和重复使用指标未公开
      - - 大众应用商店受众
        - 下载者或评论者，不一定是准入会员
        - 应用发现、评估和广泛零售触达
        - 50M+ 下载、约 2.95M 条 Play 评论、593,339 个 iOS 评分
        - 证明选择性准入仍坐落在大规模发现漏斗上
        - 下载和评分不等于有资金沉淀或发生交易的会员
      - - 商户和合作方界面
        - 商户、保险方或转售合作方承接会员需求
        - 钱包结账、保险分销、转售
