  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与行为风险
        blocks:
          - type: paragraph
            body: >-
              CRED 的风险画像不取决于某一个牌照是否拿到，而是由多套规则叠加塑造。留存的公开材料显示，公司直接或间接暴露在 RBI 数字贷款指引、UPI 和 NPCI TPAP 规则、支付聚合商义务、IRDAI
              分销约束，以及贷款方层面的申诉和数据共享职责之下。只有合规、控制和伙伴治理能跟上产品宽度，这种复杂度才可管理。正面信号是，审阅材料中没有出现专门针对 CRED 的重大公开执法行动；2026 年 3 月 PA
              批准也说明公司至少跨过了一个关键许可门槛。


              但批准不等于风险出清。一旦 CRED 开始大规模直接管理商户入驻、清算、退款和支付失败处理承诺，监管错误就会变成用户、商户、伙伴和监管者都能看见的运营失败。最尖锐的法律和行为问题包括 DLG
              不透明、外包催收行为、保险定价可解释性、隐私和第三方数据共享，以及让 CRED、银行、NBFC 和 NPCI
              之间的多层申诉链条持续运转的负担。公开披露显示公司确实在缓释风险，但也证明如今有多少受监管触点已经被装进产品壳里。
