      - number: '4.4'
        title: 资本充足性与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事同时改善又变弱。CRED 2025 年仍能从既有支持者处筹得 Rs 617 crore，但估值只有 $3.5 billion，而 2022 年标记为 $6.4
              billion。这才是解读降价融资的正确方式：不是融资渠道崩塌，而是证据显示，未来融资将更多取决于盈利能力和 IPO
              准备度，而不是只靠叙事。公开报道把估值下调与上市准备联系起来，这与一家正在扩张但仍亏损的公司相符。


              合作伙伴依赖让资本问题更尖锐。官方披露显示，截至 2026 年 4 月，CRED 拥有广泛贷款方名单、联合贷款结构，以及约 Rs 4,646 crore 的 CRED-app DLG 覆盖 AUM，横跨 19
              个匿名化组合，同时还有 12 家分包商和 47 家催收或债务咨询机构。RBI 2025 年 Digital Lending Directions 和 DLG FAQ 对损失支持设上限，并施加正式 LSP
              义务。与此同时，支付聚合商批准扩大了商户变现，也增加了结算和退款责任。因此，CRED 表面上是轻资产负债表模式，但仍实质依赖合作伙伴资本、合作伙伴风险偏好，以及受监管损失分担机制。
