  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现实 SAM
        blocks:
          - type: paragraph
            body: >-
              印度支付市场巨大，但这个外层边界不是 CRED 的市场。RBI、DigiDhan 和 PwC 都在描述一个由 UPI 和小额零售行为主导的全国级数字支付系统。CRED
              自己的官方主张窄得多：一款面向高信用人群的会员制 app，设有 750+
              分门槛，支持主要发卡方，并把奖励与信用卡账单行为绑定。因此纳入的市场从信用卡账单支付、信用管理，以及高信用用户可变现的邻近金融行为开始；它排除了大多数现金使用、相当一部分日常借记卡替代，以及大量没有理由迁移到高端第三方覆盖层的小额
              UPI 活动。

              现实 SAM 位于印度银行卡经济内部，而不是所有印度支付内部。RBI 统计到 2025 年 6 月底未偿信用卡为 111.197 million 张，IMARC 称 701-850 分区间在 2025 年占卡市场
              51.2%，Business Standard 报道 CRED 的 FY25 支付规模超过 Rs 8.5 trillion，来自 15 million+
              用户。这些数字彼此不能完美映射，但合在一起给出了正确的嵌套视角：外层是庞大的数字支付 TAM，内层是与卡相关的高信用用户 SAM，再往里是 CRED 基于用户自愿使用 app 的
              SOM。反复出现的尽调错误，是因为 CRED 技术上能坐在支付轨道上，就把所有印度数字支付都叫成它的 TAM。
