      - number: '1.4'
        title: 规模、产品与监管里程碑
        blocks:
          - type: paragraph
            body: >-
              公司概览层面最强的证据，是 CRED 已把高端品牌参与度转成真实交易规模。FY24 收入达到 Rs 2,473 crore，FY25 收入达到 Rs 2,735 crore，同期经营亏损大幅收窄。FY25
              支付规模超过 Rs 8.5 lakh crore，公开材料还显示 CRED 在印度信用卡账单支付品类中已扮演有分量的角色。平台变现结构也显著变化：独立报道称，超过 90%
              的收入现在来自支付、借贷和保险，而不再只是奖励驱动的商业。


              产品和监管里程碑进一步印证了这种成熟。CRED 收购 Kuvera 以加深财富管理，推出钱包和 token 化结账功能，把 Garage 扩展到保险和二手车转售，与 RBI 和 YES BANK 试点 e₹
              钱包，并最终在 2026 年 3 月取得支付聚合商授权。官方法律披露同时显示出广泛的贷款方网络和实时违约损失担保敞口，确认 CRED
              已不再只是卡片上的奖励层。它正在变成更全栈的受监管消费金融平台，机会和风险也随之变大。
