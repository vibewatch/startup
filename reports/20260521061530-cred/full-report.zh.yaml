      - number: '8.2'
        title: 当前估值标记与公开可比公司组
        blocks:
          - type: paragraph
            body: >-
              仅靠公开信息做尽调，最干净的锚点是用官方文件加实时交易所报价，把 CRED 2025 年 6 月估值与印度上市金融科技公司比较。在这个基础上，CRED 隐含约 10.9-11.1x 的过去十二个月收入倍数，接近
              Paytm 约 10.7x 的市值 / FY25 收入倍数，低于 PB Fintech 约 12.4x 的市值 / FY26 收入倍数。这比把 CRED 拿去和组内最低倍数公司相比更合理。问题在于，Paytm 和
              PB Fintech 的披露深得多，PB 也已经盈利。因此，CRED 进入了相似定价区间，却没有给公开投资者相似的承销可见度。


              其余可比公司组更多是在提醒风险，而不是提供支撑。MobiKwik 是更接近的消费钱包和信贷相邻业务参照，但其交易价格仅约为 FY25 收入的 1.3x。Zaggle 和 Fino
              按收入倍数更低，不过二者都不完美：Zaggle 更像 B2B 软件加支付，Fino
              是受监管交易银行模式。最好把这些公司当作边界标尺，而不是直接可比对象；但它们仍说明，印度公开市场会大幅折价缺少头部两家公司规模或感知质量溢价的金融科技模型。正确读法是，CRED
              需要一套混合可比框架，而不是单一明星可比对象：用 Paytm 看规模和监管复杂度，用 PB Fintech 看分销质量，用 MobiKwik 看消费钱包相邻性，再用 Zaggle 和 Fino 作为低倍数护栏。
