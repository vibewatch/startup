  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性价值区间
      - 隐含倍数视角
      - 概率信号
      - 推动因素
    rows:
      - - 乐观
        - FY26 收入 ~₹3,200-3,500 crore，亏损进一步压缩，没有糟糕的信贷意外，IPO 工作流清晰可见。
        - 估值 ₹38,000-47,000 crore
        - FY26E 收入约 12x-14x
        - 低中
        - 需要经审计的分部证据和可信的 IPO 路线图。
      - - 基准
        - 十几个百分点中段增长，经营杠杆继续释放一部分，披露只部分改善，没有重大风险爆雷。
        - 估值 ₹26,000-34,000 crore
        - 基于 FY25-FY26 桥接约 9.5x-11.5x
        - 中
        - 这大致框住当前估值。
      - - 悲观
        - 公开市场倍数压缩，合作伙伴或监管问题暴露，或信贷质量不及预期。
        - 估值 ₹14,000-22,000 crore
        - FY25 收入约 5x-8x
        - 中
        - 再一次估值下调轮或难看的信贷披露，可能把价值推到这里。
    notes: 区间有意给得较宽，因为公开证据不支持精确 DCF 或 EV 桥接；这是一套有纪律的情景框架，而不是点估值目标。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 最新官方收入口径
      - 当前市值 / 估值
      - 市值收入比
      - 相关性
      - 与 CRED 的关键差异
    rows:
      - - CRED
        - FY25 收入 ₹2,735 crore
        - 私募估值 ~₹29,750-30,450 crore ($3.5B)
        - ~10.9x-11.1x
        - 参照公司；高端消费金融科技组合，兼有支付和贷款规模
        - 私有、披露不足、亏损，且重合作伙伴
      - - Paytm
        - FY25 收入 ₹6,900 crore
        - NSE 股权价值 ~₹73,685 crore
        - ~10.7x
        - 支付规模和监管复杂度上最接近的上市可比公司
        - 商户和 MSME 组合更广；披露更多
      - - PB Fintech
        - FY26 收入 ₹6,794 crore；FY26 PAT ₹670 crore
        - NSE 股权价值 ~₹84,372 crore
        - ~12.4x
        - 金融分销和披露深度上最佳上市质量可比
        - 保险和市场平台组合并非支付轨道类比
      - - MobiKwik
        - FY25 总收入 ₹1,192.5 crore
        - NSE 股权价值 ~₹1,536 crore
        - ~1.3x
        - 最接近的上市消费钱包 / 信贷邻近参照
        - 规模更小，公开市场估值评级低得多
      - - Zaggle
        - FY25 收入 ₹1,303.8 crore
        - NSE 股权价值 ~₹2,867 crore
        - ~2.2x
        - 金融科技软件和支出管理经济性的有用边界标尺
        - B2B 占比高，终端市场结构不同
      - - Fino Payments Bank
        - FY26 收入 ₹1,587.9 crore
        - NSE 股权价值 ~₹1,011 crore
        - ~0.6x
        - 监管交易经济性和吞吐纪律的有用边界标尺
        - 银行业务模型，而不是高端消费者应用层
    notes: 收入使用官方公司文件或投资者材料，市场价值使用 NSE 官方报价数据。这里看的是市值收入比，不是企业价值，因为在只看公开资料的情况下，无法对净现金和债务做标准化调整。
    enumerationScope:
