      - number: '7.3'
        title: 财务 / 模型与透明度风险
        blocks:
          - type: paragraph
            body: >-
              CRED 的财务模型风险不只是增长能否延续；关键在于有多少经济性依赖伙伴资产负债表、不透明的 DLG 暴露，以及尚未公开分部的业务线。公开报道支持公司确有规模：FY25 收入 ₹2,735
              crore、极大的支付吞吐量，以及经营亏损收窄。公开报道也支持持续脆弱性：到 FY25，总亏损仍然很大；2024 年末据称超过 90% 收入仍来自支付、贷款和保险；2025 年 6 月融资把估值重置到约 $3.5
              billion。


              更大的风险在于，公开记录仍太薄，无法干净承销。没有公开分部组合能够对齐支付、贷款、保险、财富和其他相邻业务；没有披露 DLG
              触发历史；也没有清晰的投诉、宕机或回收批次数据。这一弱点格外显眼，因为印度上市金融科技同业通常会例行发布年报、业绩材料、交易所文件和投资者关系档案。因此，CRED
              在运营风险之上还背着透明度折价：投资者能看见势能，但看不到足够经审计的细节，无法用 IPO 级信心给模型定价。
