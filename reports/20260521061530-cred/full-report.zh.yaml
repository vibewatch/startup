      - number: '2.4'
        title: 增长驱动、约束与市场结构
        blocks:
          - type: paragraph
            body: >-
              最强的市场增长驱动因素很直接。即便 UPI 主导零售笔数，卡片使用仍在复合增长；奖励、联名、EMI 场景、金融科技接入和更广的商户受理继续把更多消费拉到信用侧；RuPay-on-UPI
              则实质扩大了信用可用场景。因此本章不应写成 UPI 杀死了信用卡。更好的理解是，印度仍是 UPI 主导的系统，但信用层还能通过拿走借记卡份额、进入 QR 受理场景，以及围绕持卡人打包高端奖励和金融管理功能来扩张。

              约束同样重要。BBPS
              可以提高信任和标准化，同时也会商品化后端账单支付轨道。监管收紧迫使金融科技公司拿牌照、提高资本实力、加强合规，这会抬高固定成本，也压缩轻差异化增长黑客的空间。围绕更宽金融科技板块的公开市场报道现在显示，估值溢价较少取决于用户增长，更多取决于自由现金流、ROE
              和合规可信度。分发是另一项结构性约束：PhonePe、Paytm 和其他广谱 app 已经拥有日常支付习惯。因此，CRED
              受益于增长中的品类，但护城河取决于一个问题：当轨道本身更开放、更标准化后，高端用户是否还会继续选择一个专业卡片管理界面。
