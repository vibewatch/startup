      - number: '1.3'
        title: 融资历史与资本背景
        blocks:
          - type: paragraph
            body: >-
              CRED 的融资弧线同时解释了它的战略野心和当下受到的审视。公司 2018 年以很大的种子轮式融资启动，到 2020 年底估值加速到 $800 million，2021 年 4 月越过 $2.2
              billion，2021 年 10 月达到约 $4.0 billion，并在 2022 年由 GIC 领投时触及 $6.4 billion。这条路径给了 CRED
              印度消费金融科技里最陡的估值曲线之一，背后是投资者对高质量金融科技分发和富裕用户参与度的强烈胃口。


              2025 年叙事变了。CRED 仍拿到新资金，但估值是 $3.5 billion，比 2022 年标记低约 45%。重要的是，这不是由陌生投资者推动的救援融资；此轮由 GIC/Lathe
              领投，已知内部投资者参与，说明支持仍在，但估值重置更符合公开市场纪律。ET 把这次估值下调与未来两年的 IPO
              准备联系起来。因此概览判断不是简单好坏：公司仍能接触资本和高端投资者，但公开证据显示，市场现在把变现、治理和上市准备放在叙事之前。
