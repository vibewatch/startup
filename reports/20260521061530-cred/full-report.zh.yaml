      - number: '5.2'
        title: 支付栈与运营模式
        blocks:
          - type: paragraph
            body: >-
              支付运营模式明显是受监管、由合作伙伴居间的，而不是自由形态。CRED 自己的 UPI FAQ 明确把公司定位为 TPAP 参与者，通过 PSP bank
              运营，继承数据本地化和审计义务，并必须支持结构化客诉升级。同一批第一方材料与 CRED Pay 页面合在一起，显示了产品差异化所在：用别名 UPI ID 向商户隐藏敏感信息，给消费者一个支付安全网承诺，并在银行和
              NPCI 治理的轨道上叠加 app 级体验设计。Tap to Pay 又增加了一层合作伙伴依赖，因为它的安全和 UX 主张依赖 Google HCE、发卡方支持和启用 NFC 的 Android 设备。


              商户侧扩张是另一项主要运营模式转变。2024 年 10 月报道显示出钱包、商户奖励和 Visa 相关设备 token 化；2026 年 3 月监管和新闻证据显示支付聚合商获批，这让 CRED
              更接近直接商户接入、收款、结算和退款责任。这有意义，因为它扩大了对支付流的控制，却没有把 CRED 变成资产负债表银行。它也抬高了尽调门槛：商户数量、退款账龄、结算 SLA
              表现和准备金实践，在公开资料包中仍大多缺席，尽管权限栈现在显然更宽。
