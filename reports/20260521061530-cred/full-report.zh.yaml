      - number: '8.4'
        title: 最终尽调要求与结论
        blocks:
          - type: paragraph
            body: >-
              底线是一个对价格和证据都敏感的判断：观察或继续研究，置信度中等，风险评级高。FY24-FY25 的改善轨迹是真实的，2025 年重置已经剔除了 2022 年峰值中最夸张的溢价；如果 CRED 确实在迈向 IPO
              级披露，乐观情景也自洽。但仅靠公开信息，证据仍太不完整，无法称这项投资主张有吸引力。投资者能看见规模、伙伴宽度和经营亏损收窄；却仍看不到核心承销细节，而这些细节决定下一轮变现红利归股东，还是归交易对手。


              真正会改变判断的，不是又一个头条产品发布。所需材料包非常明确：经审计 FY25 和 FY26 YTD 财务、分部组合、抽佣率测算、信贷损失和 DLG 表现、伙伴集中度、轮次条款清晰度，以及可见的 IPO
              工作流。如果这些材料证明，CRED
              的高端用户基盘确实比大众市场同业变现显著更好，且下行保护并不过分苛刻，那么当前估值以后可能显得合理，甚至略保守。没有这套材料，谨慎做法是保留未解缺口，而不是把它们藏起来。CRED
              仍可能成为一个可投的后期金融科技标的，但今天的公开档案更支持纪律，而不是热情。
