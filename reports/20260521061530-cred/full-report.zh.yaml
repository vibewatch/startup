  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接，但有条件。CRED 已经在真实支付和贷款规模之上，做出一个面向高端会员的消费金融科技品牌；FY24 到 FY25 的公开轨迹指向更好的变现和运营纪律，而不是单纯的虚荣增长。FY25 收入达到约
              ₹2,735 crore，经营亏损大幅收窄，支付量达到约 ₹8.5 lakh crore，贷款 AUM 达到约 ₹22,000
              crore。产品足迹也从一个旗舰习惯扩展到商户支付、有担保贷款、保险、财富和车辆入口。这种宽度很重要，因为它让 2025 年降估值融资看起来更像是从 2022 年狂热向 IPO
              准备期基线的重新定价，而不是商业模式失败。


              反向逻辑同样重要。即便经历降估值融资，隐含过去十二个月收入倍数仍约为 FY25 收入的 11x，让 CRED 更接近 Paytm 和 PB Fintech，而不是 MobiKwik、Zaggle 或 Fino
              等规模较小的印度金融科技公司。但 CRED 的披露深度远不到 Paytm 或 PB Fintech 水平。投资者仍看不到经审计 FY25 报表、分部组合、抽佣率、CAC、信贷损失曲线、DLG
              触发数据或轮次条款细节。官方披露还显示庞大的伙伴和催收版图，以及匿名组合下超过 ₹5,364 crore 的已披露 DLG 覆盖
              AUM。这个组合意味着业务可能正在改善，但估值仍要求投资者为公开证据只部分证明的质量买单。
