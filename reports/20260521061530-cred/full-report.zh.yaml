        - 大众零售付款方通常没有专门买方
        - 支付量大，但对 CRED 经济性意义弱
    notes: 本表区分外层支付 TAM、卡片主导层和优质用户层，因为 CRED 不可能现实地捕获全部印度数字支付活动。
