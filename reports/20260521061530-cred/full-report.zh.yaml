          label: 催收扰动
          detail: 外包催收质量引发投诉或整改
        - id: security-event
          label: 安全或隐私事件
          detail: 泄露、误用或重大控制失效
        - id: growth-hit
          label: 增长受冲击
          detail: 发放量下降、交叉销售走弱或商户扩张放慢
