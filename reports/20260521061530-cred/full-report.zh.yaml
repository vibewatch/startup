      - number: '3.3'
        title: 转换成本与多栖使用
        blocks:
          - type: paragraph
            body: >-
              CRED 的转换成本真实存在，但比银行或超级应用更软。用户离开 CRED 时不会失去底层信用额度，因为卡片关系仍在发卡方手里；BBPS 标准化还款轨道也让账单支付管道更容易在不同 app
              间迁移。这使多栖使用在结构上很容易：富裕用户可以保留同一张 HDFC 或 SBI 卡，在 Paisabazaar 上比较另一个发卡方优惠，再根据奖励时点、结算紧迫性或优惠可见度，通过
              CRED、CheQ、PhonePe 或发卡方 app 付款。这个品类更像是对习惯和钱包份额的争夺，而不是一个封闭网络。

              但转换成本并非为零。当提醒、信用分刷新、奖励历史、高端品牌身份、合作伙伴优惠和邻近金融产品都集中在一个体验中时，CRED 仍会受益。拥有多张卡的直接用户可能保留不止一个
              app，但实际使用仍可能集中到那个在到期还款时感觉最快、最有奖励或最可信的 app。竞争问题在于，大型玩家可以从其他利润池补贴这种便利：发卡方拥有 interchange 和循环信用经济性，PhonePe 与
              Paytm 可以变现广泛支付频次和商户服务，邻近资金 app 可以把借贷或储蓄经济性混入获客。因此，CRED 的护城河更多是行为性的，而不是基础设施性的。
