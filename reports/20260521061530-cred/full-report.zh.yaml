      - number: '5.4'
        title: 支持、合作伙伴依赖与公开证据限制
        blocks:
          - type: paragraph
            body: >-
              支持栈符合数字优先运营模式。CRED 的客服页面明确说明，主要路径是 app 内支持，辅以社交平台 DM，并可升级到具名申诉官；反欺诈语言则提醒会员不要分享 UPI PIN、OTP、CVV
              或银行信息。这让支持模式具备运营可扩展性，但出事时也留下感知风险，因为没有公开的电话优先客服号码。Apple 评论界面直接呈现了这种风险：总体评分很高，同时反复出现支付失败、支持响应、奖励稀释和催收行为投诉。


              公开证据缺口集中在产品界面视觉很丰富但文本很薄的地方。Garage、Money、Cash+、pay-via-UPI、UPI on credit
              和卡片落地页，在本轮抓取中都只有标题或接近只有标题；招聘网站也只暴露外壳标题，而不是岗位级工程细节。因此，CRED
              的架构看起来很宽，但不是每个模块都能以同等精度描述。正确尽调姿态，是相信这些模块存在及其品类，同时在拿到更丰富抓取或内部材料之前，对更深的流程、商户规模、事故历史或开发者信号主张设边界。
