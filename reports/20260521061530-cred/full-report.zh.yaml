      - - 超级 App 替代压力有限
        - PhonePe 和 Paytm 已经占住日常支付习惯和 UPI 信贷入口
        - 高
        - PhonePe 的规模、Paytm 的商户基础和上市公司披露，抬高了替代压力
        - 没有日常默认使用场景时，还能留住高端用户吗？
      - - 相邻类 App 的威胁低于直接对手
        - slice、Jupiter 和 Fi 覆盖更广的资金行为
        - 中
        - 相邻产品栈不只争夺账单支付，也争夺注意力和交叉销售
        - 哪些相邻产品类别对 CRED 参与度影响最大？
      - - 合作伙伴依赖可控
        - Fi 转型说明，App 层控制权可能很快松动
        - 高
        - Fi 于 2026 年 3 月停止在 App 内新增储蓄开户，并终止 Fi-Points 累积
        - 若一个主要合作伙伴产品调整条款，CRED 韧性有多强？
      - - 奖励驱动的增长能跑赢审查
        - 2026 年公开市场更看重合规和现金流，而不是 GMV 故事
        - 高
        - Business Standard 称，金融科技估值倍数正在整体压缩
        - 有什么证据证明 CRED 能在不推高补贴的情况下持续变现？
    notes: 严重程度衡量的是 CRED 覆盖层模型的持久性风险，而不是威胁列中竞争对手本身的绝对业务质量。
