          label: 利润率受冲击
          detail: 合规成本、拨备、退款或整改支出上升
        - id: brand-hit
          label: 品牌 / 信任受冲击
          detail: 可见失败后，高端会员信任被侵蚀
        - id: funding-hit
          label: 融资 / 估值受冲击
          detail: 再次减记，或 IPO 准备度走弱
        - id: thesis-break
          label: 投资逻辑破裂
