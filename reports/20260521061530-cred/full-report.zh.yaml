  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接类比产品与替代生态
        blocks:
          - type: paragraph
            body: >-
              CRED 的竞争集合不是一张整齐的排行榜，因为买方可以用几种不同方式完成同一项任务。直接类比层很窄：CheQ 在多卡账单支付、奖励、信用仪表盘和邻近金融产品上重叠最紧；OneCard
              也争夺同一批富裕、重视奖励的用户，但它从发卡方一侧切入，而不是纯覆盖层。存量巨头层更宽，也更有结构性意义。SBI Card、HDFC Bank、ICICI Bank 和 Axis Bank
              都在营销大型卡片目录和直接发卡服务，这意味着它们拥有底层信用关系、还款紧迫性，以及 CRED 只能居间撮合的很大一部分奖励经济性。

              更大的战略风险来自替代生态，而不只是直接复制者。PhonePe、Paytm 和 MobiKwik 可以把同样的支付意图吸收到更宽的日用 app 中；slice、Jupiter 以及历史上的 Fi 则展示邻近资金
              app 如何把 UPI、储蓄、卡片、贷款和奖励打包成一个界面。BankBazaar 和 Paisabazaar 的作用不同：它们不是习惯型
              app，但会在用户进入闭环忠诚或账单支付流程之前，影响卡片发现和比较。实际结论是，CRED 同时在三层竞争：直接功能重叠、替代习惯养成，以及发卡方层面的产品所有权。
