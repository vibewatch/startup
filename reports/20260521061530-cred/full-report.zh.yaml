      - number: '3.2'
        title: 能力、定价、分发与信任
        blocks:
          - type: paragraph
            body: >-
              当用户想在一个地方管理多张卡、还款、跟踪信用并拿到奖励时，能力重叠最强。CheQ 是这条轴线上最干净的直接竞争者，因为它的官方界面把 1%
              账单支付奖励、水电煤账单、钱包功能、仪表盘工具、即时现金和共同基金质押贷款组合在一起。OneCard 的主张不同但相邻：无入会费、无年费、app 原生控制，以及热门类别 5x
              奖励，让它成为高端卡片用户的强替代选择，尤其是那些更愿意把价值集中在发卡方产品，而不是第三方覆盖层里的用户。CRED
              自己的公开主页刻意保持高端调性，但对标准化奖励经济性相对含糊；这对品牌定位很优雅，对尽调透明度则较弱。

              分发和信任是替代生态开始压过直接同业的地方。PhonePe 官网称三分之一印度人使用该 app，服务 65+ crore 注册用户和 4.7+ crore 商户，并已支持信用卡支付、RuPay credit
              card on UPI、联名卡和商户支付。Paytm 的消费者界面和年报材料也展示了类似宽度的支付生态，再加上上市公司披露。CRED 通过最终 RBI
              支付聚合商批准强化了信任姿态，但比较现在必须放在系统层面：用户可以在巨型 app、发卡方 app 或合作伙伴支持的新银行里获得支付功能，所以 CRED
              必须靠高端体验和交叉销售质量取胜，而不能只靠接入轨道。CheQ、OneCard、Jupiter 和发卡方卡片页面的定价证据最强；CRED、Paytm、PhonePe 和 MobiKwik
              的实际经济性证据明显较弱，因此本章保留明确缺口，而不是编造费率平价。
