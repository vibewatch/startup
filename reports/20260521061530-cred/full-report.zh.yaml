  - id: TV005
    title: 投资逻辑破坏与终止触发项表
    columns:
      - 触发项
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 公开来源监控
      - 行动含义
    rows:
      - - FY26 增长不及预期
        - 收入增速滑向低个位数或转负
        - 打破 2025 年估值重置背后的经营改善叙事
        - 未来业绩、新闻稿和任何 IPO 文件
        - 除非估值重置，否则从观察转为回避
      - - 信贷或 DLG 质量恶化
        - DLG 被调用，或损失曲线显示经济性显著差于隐含预期
        - 摧毁对贷款驱动上行的信心，并抬高下行风险
        - 放款方材料、监管披露或未来公司文件
        - 按悲观情景倍数重新评估
      - - 合作伙伴集中度收紧
        - 主要放款方、PSP 或保险公司退出，或重新定价经济性
        - 暴露的是平台依赖，而非平台力量
        - 官方披露、放款方公告或更新后的合作伙伴名单
        - 假设更低增长和更低倍数
      - - 监管负担加重
        - RBI、NPCI 或行为监管新压力抬高合规成本，或限制产品
        - 降低 IPO 质量倍数，并可能迫使战略收缩
        - RBI 指引、交易所文件和公司披露
        - 将估值区间下调至边界可比公司附近
      - - IPO 进程延后
        - 看不到披露路线图，或 IPO 准备清晰前又进行内部轮融资
        - 让当前估值变成长期私募价格，而不是近期可退出估值
        - 投资者关系式披露、投行、治理岗位招聘或未来媒体确认
        - 要求更大折价，或等待
    notes: 这些是实用的终止标准，而非穷尽风险；每项触发都重要，因为当前估值已经假设通往更好披露和执行的合理路径。
    claimRefs:
      - CV004
      - CV013
      - CV016
      - CV039
      - CV043
      - CV046
      - CV048
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
      - 是否阻断
    rows:
      - - 经审计的 FY25 和 FY26 YTD 财务数据
        - 经审计报表，加按产品线拆分的月度 MIS
        - 用来检验 FY25 改善是否可持续、可重复
        - 财务数据室、董事会材料、审计师桥接
        - 是
      - - 分部组合和抽成率
        - 支付、贷款、保险、财富和其他变现拆分，以及实际抽成率
        - 没有这些，当前倍数无法映射到商业模型
        - 产品 P&L、队列报告、定价仪表盘
        - 是
      - - 信贷损失和 DLG 表现
        - 分批账龄损失、回收、已调用 DLG，以及逐放款方敞口
        - 没有已实现信贷证据，就无法信任贷款上行空间
        - 风险仪表盘、放款方材料、DLG 合同
        - 是
      - - 股权结构表和融资条款
        - 清算优先权、稀释、新股 / 老股拆分和投资者保护条款
        - 只看名义估值，无法评估下行风险或收益分配
        - 法律文件、股权结构表、融资摘要备忘录
        - 是
      - - 合作伙伴集中度和行为指标
        - 按收入、AUM、吞吐量、投诉和催收表现列出的头部合作伙伴
        - CRED 重合作伙伴，运营复杂度高
        - 合作伙伴评分卡、合规指标、投诉日志
        - 重要
      - - IPO 准备包
        - 审计准备度、治理升级、承销商沟通和上市公司控制
        - 如果 2025 年确实是 IPO 正常化轮，基准情景最成立
        - 投行材料、治理工作流计划、报告路线图
        - 重要
    notes: 这里列出的每一项，都直接对应当前公开材料为何不足以支持在当前私募估值下给出明确买入判断。
    claimRefs:
      - CV015
      - CV016
      - CV027
      - CV041
      - CV044
      - CV045
      - CV047
