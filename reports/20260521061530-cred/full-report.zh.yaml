      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              CRED
              不是单边支付产品。在用户层，核心客户是重视提醒、奖励、身份感和信用分维护的高信用持卡人。在变现层，发卡方、贷款方、保险公司和品牌为接触这批用户或底层支付流付费。因此，相关买方-用户-付款方地图同时包含富裕消费者和金融
              / 分销合作伙伴。IMARC 的分数段数据、CRED 的 750+ 门槛，以及 CRED 关于 FY25 15 million+ 支付用户的说法，都指向同一个结论：最相关的用户不是普通印度 UPI
              付款人，而是高分持卡人，其钱包份额足够高，值得使用一款专门 app。

              替代集合也比其他信用卡账单支付 app 更宽。CheQ 是功能层面最接近的类比产品，但 PhonePe 和 Paytm 可以把常规账单支付行为吸收到大众规模超级应用中；OneCard 和 SBI Card
              从发卡方一侧进攻高端卡片人群；slice、Jupiter 和 Fi 则显示，邻近资金 app 正越来越多地把 UPI、奖励、储蓄、贷款和卡片打包进同一个界面。换句话说，CRED
              既在争夺一个具体流程，也在争夺富裕数字金融用户的注意力。因此，采用问题不只是纯支付问题，更是习惯养成和交叉销售问题。
