  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模块地图与产品面扩张
        blocks:
          - type: paragraph
            body: >-
              CRED 已不再像一款单一用途的信用卡账单 app。截至报告日，证据最清晰支持的地图是：一款高端会员 app，以信用卡账单支付和信用分门槛为锚，叠加 UPI
              和商户支付，再围绕同一批富裕会员扩展邻近金融和生活方式模块。最宽的当前产品面证据来自移动应用商店列表、关于页面，以及 2024-2026 年发布报道：账单支付、QR/UPI、tap to pay、钱包和
              token 化结账、e₹ 钱包 beta、Mint、Garage、借贷界面，以及证据较薄的新模块，如 Money、UPI on credit 和联名卡页面。


              重要的尽调点不只是宽度，还有证据质量不均。Garage 的外部描述足够详细，可以支持一行流程；e₹ 钱包有明确 beta 机制和限额；钱包和商户奖励有发布报道；Mint
              有专门页面并列出合作伙伴。相对地，Money、Cash+、pay-via-UPI、UPI on credit、Garage 自己的落地页和卡片页面，在抓取时都只有标题或接近只有标题。这意味着第 5
              章可以支持模块地图，但不应假装公开记录对每个模块都给出了同等架构级清晰度。
