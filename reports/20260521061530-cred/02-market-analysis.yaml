  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: active-cred-cardholders
      missingEvidence: A reconciled split between CRED's 25 million-plus members monthly active payers and prime cardholders who meet the 750-plus filter at run date.
      whyItMatters: Without that funnel, investors cannot convert broad membership claims into a clean SAM or active-user-based monetisation model.
      diligencePath: Request current MAU card-linked active-user and multi-card-user cohorts from management and tie them to bill-pay frequency and partner monetisation.
      relatedQuestionRefs: [QM023]
      relatedTableRefs: [TM001, TM003]
    - type: missing-source
      severity: material
      topic: official-rupay-on-upi-adoption
      missingEvidence: Direct NPCI or RBI public disclosure for merchant count volume share and value share of RuPay credit-on-UPI instead of relying on secondary Bernstein reporting.
      whyItMatters: Merchant-acceptance and share numbers drive the argument that credit-on-UPI materially expands the category, but the strongest current public statistic is still secondary.
      diligencePath: Pull the underlying NPCI circulars statistics releases or product-note PDFs once the public product-documents hub surfaces them directly.
      relatedQuestionRefs: [QM024]
      relatedTableRefs: [TM004]
    - type: stale
      severity: material
