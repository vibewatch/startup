  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: standard
    summary: CRED still has a defendable niche, but the scorecard is dominated by distribution and economics it does not fully own.
    data:
      items:
        - label: Direct-analogue pressure
          value: Medium
          note: CheQ is close, but the direct-peer set is still relatively small.
        - label: Super-app substitution pressure
          value: High
          note: PhonePe and Paytm already own daily payment habit and credit surfaces.
        - label: Issuer control of core economics
          value: High
          note: Banks still own the card relationship, servicing, and much of rewards funding.
        - label: Switching-cost friction
          value: Medium-Low
          note: Users can multi-home because card ownership and BBPS rails sit outside CRED.
        - label: Brand / affluent segmentation advantage
          value: Medium
          note: The strongest moat remains premium identity rather than exclusive infrastructure.
    approximationNotes: null
    claimRefs: [CP020, CP022, CP026, CP037, CP038, CP040]
  - id: FP004
    title: Adverse pressure stack
    type: bar
    layout: standard
    summary: The heaviest competitive pressure comes from standardized rails, scale substitutes, and harsher economics.
    data:
      items:
        - label: BBPS standardization
          value: 9
          unit: /10
          detail: More trust but less back-end differentiation.
        - label: Super-app distribution
          value: 10
          unit: /10
          detail: PhonePe and Paytm can absorb payment intent inside existing habits.
        - label: Issuer depth
          value: 9
          unit: /10
          detail: Banks own card issuance servicing and on-us rewards.
        - label: Partner-model fragility
          value: 7
          unit: /10
          detail: Fi shows app-layer continuity can change when partner structures move.
        - label: Regulatory / public-market pressure
          value: 8
          unit: /10
          detail: Compliance and profitability matter more than pure growth in 2026.
    approximationNotes: >-
      Scores are ordinal severity estimates derived from retained adverse evidence, not published weighted risk indices.
    claimRefs: [CP029, CP030, CP031, CP033, CP034, CP040]
callouts:
  - calloutType: strength
    title: CRED's best moat is segmentation, not exclusive plumbing
    body: >-
      The evidence supports a niche with real appeal to affluent multi-card users, but it does not support a claim that
      CRED owns unique payment rails. Its strongest differentiation is premium positioning plus cross-sell potential.
    claimRefs: [CP004, CP020, CP026, CP038]
  - calloutType: risk
    title: The substitute threat is larger than the direct-peer threat
    body: >-
      CheQ is the closest feature match, but PhonePe, Paytm, issuer apps, and adjacent money apps are structurally more
      dangerous because they own daily habit, card economics, or regulated control.
    claimRefs: [CP011, CP022, CP023, CP025, CP031, CP040]
  - calloutType: insight
    title: Fi's March 2026 transition is a real cautionary analogue
    body: >-
      Partner-backed UX layers can look sticky until the regulated partner or product structure changes. That does not map
      one-to-one onto CRED, but it is relevant adverse evidence for any fintech thesis built mostly on interface ownership.
    claimRefs: [CP010, CP028, CP029]
