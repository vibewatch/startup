company:
  name: CRED
chapter:
  number: 4
  title: Financials
  summary: 'CRED''s public financial arc is directionally strong: FY24 and FY25 revenue scaled, operating losses narrowed, and payments plus lending became economically meaningful. But the business remains materially under-disclosed for underwriting because segment mix, take rate, gross margin, credit losses, and runway are still absent even as partner-led lending and a 2025 down round make capital discipline more important.'
sections:
- id: reported-scale-and-revenue-quality
  title: Reported Scale & Revenue Quality
  body: |-
    FY24 and FY25 show real scale-up, but the evidence remains mostly management statements relayed through media rather than filed financials. The best-supported figures are Rs 2,473 crore of FY24 revenue and Rs 2,735 crore of FY25 operating revenue, with operating loss narrowing from Rs 609 crore to Rs 298 crore over the same period. That is directionally strong, yet it is not the same as having audited product-level disclosure. The company is clearly processing large throughput: FY24 TPV reached Rs 6.87 lakh crore, FY25 TPV reached Rs 8.5 lakh crore, FY25 monthly transacting users rose to about 1.26 crore, and lending AUM was reported at roughly Rs 22,000 crore.

    The quality question is not whether revenue exists; it does. The question is what portion of that revenue is recurring, high-margin, incentive-light, and durable across regulation and partner mix. The source pack supports meaningful revenue momentum, but it also shows that CRED still communicates financial performance through selective external reporting. For diligence, that means scale can be acknowledged as real while precision around mix, take rate, and margin must stay explicitly bounded.
