- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Source basis
  - What it implies
  - Missing diligence
  rows:
  - - 2025 equity raise
    - Rs 617 crore / about $72 million
    - ET and CNBC-TV18 down-round coverage
    - Fresh capital was available, but the cheque size is modest relative to platform scale
    - Need post-raise cash balance and planned use of funds
  - - Private valuation mark
    - $3.5 billion versus $6.4 billion in 2022
    - ET, CNBC-TV18, Entrackr
    - Investors reset price discovery toward IPO-readiness and profitability discipline
    - Need cap-table changes, liquidation terms, and internal mark history
  - - Cash on hand
    - null
    - Not disclosed in reviewed pack
    - Capital adequacy cannot be judged precisely from round size alone
    - Request unrestricted cash, restricted cash, and treasury policy
  - - Runway months
    - null
    - Not disclosed in reviewed pack
    - Still-loss-making companies need explicit runway planning
    - Request monthly cash burn and runway base / upside / downside
  - - CRED-app DLG-covered outstanding AUM
    - About Rs 4,646 crore across 19 anonymised portfolios at 2026-04-30
    - Derived from official portfolio buckets on CRED legal disclosures
    - Lending may be balance-sheet light, but loss-sharing exposure is economically meaningful
    - Request partner mapping, DLG cover by cohort, and invocation history
  - - Lender and servicing network complexity
    - 12 subcontractors and 47 recovery / debt-counselling agencies disclosed
    - Official CRED legal disclosures
    - Execution and conduct risk scale with partner complexity
    - Request partner concentration, collections KPIs, and oversight controls
  - - Regulatory DLG cap
    - 5% cap on disbursed DLG set; cover cannot be reinstated
    - RBI FAQ and 2025 directions
    - Loss support is bounded by regulation, limiting how much economics can be smoothed by guarantees
    - Request product design by category and excluded products
  - - Payment-aggregator working-capital exposure
    - Merchant onboarding, settlement, and refunds now sit under PA approval
    - March 2026 PA licence reporting
    - Payments economics may carry settlement and liquidity responsibilities even without visible inventory
    - Request nodal-account balances, reserve policy, refund aging, and settlement SLA data
  notes: The table deliberately separates capital raised from capital adequacy because public disclosure still lacks cash, runway, and obligation detail.
