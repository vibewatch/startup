- id: operating-leverage-and-unit-economics
  title: Operating Leverage & Unit Economics
  body: |-
    Public evidence is strongest on direction, not on a complete unit-economics bridge. FY24 commentary said marketing spend fell 36%, monetised customers grew 58%, monthly transacting users rose 34%, and contribution margin stayed positive for nine consecutive quarters. FY25 reporting then showed higher transaction frequency and larger TPV and lending AUM. Put together, those signals support a credible operating-leverage story: CRED appears to be monetising an existing affluent base more effectively while lowering obvious customer-acquisition spend intensity.

    What remains missing is exactly what an investor would need to decide whether that leverage is durable. There is no public take-rate bridge, no gross-margin disclosure, no CAC or payback calculation, and no visible credit-loss history that would let a model connect lending scale to risk-adjusted contribution. The contrast with listed peers is stark. PB Fintech, MobiKwik, Zaggle, and Fino all publish materially richer public disclosure on revenue, direct costs, EBITDA, throughput, or other operating metrics. CRED therefore looks directionally stronger, but still not public-market grade on the inputs needed for precise underwriting.
