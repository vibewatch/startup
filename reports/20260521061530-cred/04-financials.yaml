- id: capital-adequacy-and-partner-dependence
  title: Capital Adequacy & Partner Dependence
  body: |-
    The capital story improved and weakened at the same time. CRED was still able to raise Rs 617 crore in 2025 from existing backers, but only at a $3.5 billion valuation versus the $6.4 billion mark from 2022. That is the right way to read the down round: not a collapse in access to capital, but evidence that future financing depends more on profitability and IPO readiness than on narrative alone. Public reporting tied the markdown to listing preparation, which is consistent with a business that is scaling but still loss-making.

    Partner dependence makes that capital question more acute. Official disclosures show a wide lender roster, co-lending structures, and around Rs 4,646 crore of CRED-app DLG-covered AUM across 19 anonymised portfolios as of April 2026, alongside 12 subcontractors and 47 recovery or debt-counselling agencies. RBI's 2025 Digital Lending Directions and DLG FAQ cap loss support and impose formal LSP obligations. Meanwhile, payment-aggregator approval expands merchant monetisation but also adds settlement and refund duties. CRED therefore appears balance-sheet light in headline form, yet still materially dependent on partner capital, partner risk appetite, and regulated loss-sharing mechanics.
