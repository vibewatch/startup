tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public scale / signal
  - Likely economics lens
  - Evidence quality
  - Diligence ask
  rows:
  - - Payments bill pay and UPI
    - Acquire and retain affluent members through recurring payment behaviour
    - FY25 TPV Rs 8.5 lakh crore; FY24 TPV Rs 6.87 lakh crore
    - Likely net payment fees plus engagement-led cross-sell rather than one simple MDR stream
    - medium
    - Break out bill pay, UPI, merchant checkout, incentives, and payment-processing costs
  - - Merchant checkout and wallet
    - Wallet preload, tokenised card-on-file, and merchant checkout expansion
    - Wallet and Visa tokenisation launched in October 2024; PA approval in March 2026
    - Potential merchant-fee or value-added checkout economics, but realised yield is undisclosed
    - medium
    - Provide merchant count, merchant TPV, take rate, refunds, and reserve policy
  - - Lending distribution
    - Partner-originated unsecured and secured credit products
    - Loan book signal around Rs 15,000 crore in 2024; FY25 lending AUM around Rs 22,000 crore
    - Distribution, sourcing, servicing, and possibly DLG-linked economics rather than disclosed net interest margin
    - medium
    - Provide originations, revenue share, servicing fees, credit losses, and DLG costs by partner
  - - Cash+ secured lending
    - Borrow against mutual funds through loan-against-securities workflow
    - Official live product page confirms cash+ is active
    - Could be higher-quality secured credit economics, but pricing and conversion are undisclosed
    - medium
    - Provide AUM, LTV bands, pricing, losses, and margin versus unsecured lending
  - - Insurance distribution via Garage
    - Earn commissions from policy comparison and conversion on vehicle base
    - Garage grew to 1.1 crore vehicles and over 10 lakh insured vehicles without lapse
    - Likely pure commission economics with limited balance-sheet risk but partner dependence
    - medium
    - Provide quote-to-bind conversion, commission rates, and renewal retention
  - - Wealth distribution
    - Kuvera acquisition extends mutual funds and investment-product distribution
    - Wealth push confirmed, but no public revenue figure
    - Likely advice or distribution income with strong agent-model characteristics
    - low
    - Provide AUA, active investors, revenue per client, and platform take rate
  notes: Mechanism and economics lens are intentionally separated because public sources confirm product activity more clearly than they disclose realised revenue recognition or margin by line.
