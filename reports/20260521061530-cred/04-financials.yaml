- id: monetisation-mechanics-and-recognition-nuance
  title: Monetisation Mechanics & Recognition Nuance
  body: |-
    The monetisation stack is now broader than the original credit-card reminder product. Payments monetisation is visible through UPI scan-and-pay, merchant QR acceptance, wallet preload, and device-tokenised checkout. Lending monetisation is visible through partner-originated personal loans and cash+, which is explicitly presented as borrowing against mutual funds. Insurance monetisation is explicit as well: CRED Garage is described as a commission-driven marketplace, and its vehicle base scaled sharply enough to make that line economically meaningful. Kuvera extends the same pattern into wealth distribution.

    That breadth matters because it changes how financial statements should be interpreted. Public evidence strongly suggests that much of CRED's economics are agent-like or distribution-like rather than pure principal risk or pure software subscription revenue. Merchant payments rely on regulated payment rails, lending relies on partner lenders and co-lending structures, insurance relies on carrier commissions, and wealth depends on distribution relationships. The result is improving revenue diversity, but also a large recognition question: investors still cannot see where reported revenue is gross versus net, nor how much of the reported top line is tied to partner-supplied balance sheet and commission economics.
