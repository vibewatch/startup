- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict & Diligence Blockers
  body: |-
    The correct financial verdict is nuanced. Revenue momentum is real, operating leverage is improving, and the platform has clearly monetised beyond a narrow credit-card reminder app. At the same time, the public record still does not support investment-grade underwriting. The biggest blockers are unresolved segment mix, absent take-rate disclosure, no gross-margin bridge, no disclosed cash or runway, and no public credit-loss history even though lending and DLG exposure now matter.

    That means chapter 4 should not over-claim. The evidence supports a business with growing top line and increasingly relevant payments, lending, insurance, and wealth economics. It does not support a precise statement about normalized gross profit, steady-state CAC, or self-funded durability. Nor does it support a clean principal-versus-agent read across every revenue line. An underwriting model needs audited FY25 statements, product-level revenue and cost disclosure, credit-performance cohorts, DLG history, and current liquidity. Until then, CRED's financial story is directionally improving but still too under-disclosed for precise underwriting confidence.
