- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public status
  - Underwriting impact
  - Best public proxy
  - Exact diligence path
  rows:
  - - Segment revenue mix
    - Not publicly segmented
    - Cannot know whether growth is mostly payments, lending, insurance, or wealth
    - Management commentary that 90% of revenue comes from payments, lending, and insurance
    - Request audited segment note or management-account bridge
  - - Payment take rate
    - Not disclosed
    - TPV cannot be converted into sustainable revenue quality
    - TPV growth from FY24 to FY25
    - Request payments revenue and net fee take rate by channel
  - - Gross margin / direct cost
    - Not disclosed
    - Operating leverage may be overstated if direct costs are hidden in opex
    - Contribution-margin commentary only
    - Request direct-cost bridge from gross profit to EBITDA
  - - CAC / payback
    - Not disclosed
    - Cannot test whether lower marketing reflects efficiency or slower acquisition
    - Marketing spend fell 36% and monetised base grew 58%
    - Request channel CAC, conversion, retention, and payback by cohort
  - - Cash and runway
    - Not disclosed
    - Capital adequacy cannot be modelled
    - 2025 raise size and down-round valuation
    - Request latest cash waterfall and runway scenario planning
  - - Credit-loss and DLG invocation history
    - Not disclosed
    - Lending contribution cannot be risk-adjusted
    - Official DLG-covered AUM and RBI DLG rules
    - Request vintages, PAR, charge-offs, recoveries, and DLG calls by partner
  - - Principal-versus-agent recognition
    - Not disclosed by line
    - Revenue multiple and margin assumptions may be wrong
    - Product and partner structure imply agency economics in several lines
    - Request accounting policy memo and sample commercial agreements
  - - Settlement float and reserve balances
    - Not disclosed
    - Merchant-payments economics may hide liquidity and refund risk
    - PA approval shows settlements and refunds are now in scope
    - Request nodal-account architecture, refund aging, and reserve policy
  notes: Each gap is specific enough to become a management diligence request; this is the minimum package needed to move from narrative analysis to underwriting.
