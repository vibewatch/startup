  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payment-take-rate
    missingEvidence: Line-item payments revenue and merchant MDR or net take-rate bridge across bill pay, QR, and checkout flows.
    whyItMatters: Without a take-rate bridge, payments scale cannot be converted into revenue quality or margin durability.
    diligencePath: Request audited FY25 payments P&L by product, including gross TPV, net revenue, incentives, chargebacks, and payment-processing costs.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Audited revenue mix by payments, lending, insurance, wealth, rewards, and other adjacencies.
    whyItMatters: The current narrative says 90% of revenue comes from three lines, but underwriting needs actual segment shares and trend lines.
    diligencePath: Request management accounts or statutory notes that reconcile segment revenue for FY24 and FY25 to consolidated revenue.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross-margin bridge and direct-cost detail for payments, lending distribution, insurance distribution, and wealth.
    whyItMatters: Operating leverage can be misread if direct cost absorption, incentives, payment processing, and collections costs are hidden inside opex.
    diligencePath: Request product-level direct-cost schedules, contribution-margin definitions, and reconciliation from contribution margin to EBITDA and total loss.
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: credit-loss-data
    missingEvidence: Vintage curves, delinquency buckets, DLG invocation history, recoveries, and partner-level credit performance for on-platform lending.
    whyItMatters: Lending can look capital-light while still being economically fragile if losses migrate through DLG, collections, or partner-pricing changes.
    diligencePath: Request monthly cohorts by product and partner covering originations, PAR, charge-offs, recoveries, DLG calls, and pricing resets.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, unrestricted cash, monthly cash burn, and management runway planning base case.
    whyItMatters: Capital adequacy cannot be judged from valuation and revenue alone when the company is still loss-making and running a large payments and lending surface.
    diligencePath: Request latest board pack or monthly MIS with cash waterfall, burn by function, and covenant or reserve constraints.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: Accounting policy detail showing where CRED is principal versus agent across merchant payments, lending distribution, insurance, and wealth.
    whyItMatters: Revenue multiples and margin assumptions change materially if reported revenue is net commission-like rather than gross transaction economics.
    diligencePath: Request audited accounting policies, product P&L mappings, and sample contracts with lenders, insurers, merchants, and wealth partners.
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: settlement-float
    missingEvidence: Merchant settlement timelines, refund reserves, nodal-account structure, and any working-capital facilities supporting PA operations.
    whyItMatters: Payment-aggregator economics can carry low visible margin but meaningful settlement, liquidity, and refund-risk exposure.
    diligencePath: Request payment-operations dashboard metrics, nodal-account architecture, settlement SLAs, refund aging, and reserve policy.
    relatedTableRefs:
    - TI004
    - TI005
