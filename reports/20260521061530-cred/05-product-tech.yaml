chapter:
  number: 5
  title: Product & Technology
  summary: >-
    CRED's product surface is now far broader than credit-card bill pay, spanning UPI, tap-to-pay,
    wallet and merchant checkout, CBDC beta, lending and investing surfaces, and Garage-led vehicle
    services. The strongest evidence is around regulated rails, partner dependencies, security and
    privacy controls, and lending-vendor disclosures; several official module pages remain too
    text-thin to support fine-grained workflow claims.
sections:
  - id: module-map-and-surface-expansion
    title: Module Map & Surface Expansion
    body: |-
      CRED no longer reads like a single-purpose card-bill app. The cleanest run-date-supported map is a premium member app anchored in credit-card bill pay and score gating, with UPI and merchant payments layered on top, then adjacent financial and lifestyle modules layered around the same affluent member base. The broadest current product-surface evidence comes from the mobile store listings, the about page, and the 2024-2026 launch coverage: bill pay, QR/UPI, tap to pay, wallet and tokenised checkout, e₹ wallet beta, Mint, Garage, lending surfaces, and newer thinly evidenced modules such as Money, UPI on credit, and the co-branded card page.

      The important diligence point is not just breadth, but uneven evidence quality. Garage is externally described in enough detail to support a workflow row; e₹ wallet has explicit beta mechanics and limits; wallet and merchant rewards have launch coverage; and Mint has a dedicated page with a partner named. By contrast, Money, Cash+, pay-via-UPI, UPI on credit, Garage's own landing page, and the card page all fetched as title-only or near-title-only surfaces. That means chapter 5 can support the module map, but it should not pretend the public record gives architecture-level clarity for every module equally.
