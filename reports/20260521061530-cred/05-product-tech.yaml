    - type: access-blocked
      severity: material
      topic: thin-pages
      missingEvidence: Rich captures or fuller text extraction for Garage, Money, Cash+, pay-via-UPI, UPI on credit, and card pages.
      whyItMatters: These modules clearly exist, but title-only fetches leave workflow depth, eligibility nuance, and product constraints under-supported.
      diligencePath: Capture screenshots or richer first-party text for each thin module page and reconcile them against app-store or press descriptions.
      relatedQuestionRefs:
        - QE019
      relatedTableRefs:
        - TE001
        - TE002
    - type: missing-source
      severity: material
      topic: tpap-evidence-gap
      missingEvidence: A direct official NPCI record or operator-list row naming CRED or Dreamplug as a current TPAP participant.
      whyItMatters: The UPI FAQ explains obligations, but a direct official registry artifact would strengthen confidence in the current regulatory mapping.
      diligencePath: Retrieve an NPCI operator, participant, or partner directory row or official TPAP approval artifact that names the entity directly.
      relatedQuestionRefs:
        - QE021
    - type: missing-source
      severity: material
      topic: merchant-scale-gap
      missingEvidence: Merchant count, merchant TPV, refund ageing, reserve balances, and settlement SLA metrics for wallet and PA flows.
      whyItMatters: PA approval matters economically only if merchant onboarding and settlement operations scale with acceptable quality and liquidity discipline.
      diligencePath: Request a merchant-payments operating deck or management KPI pack covering merchant count, volume, refunds, reserves, and settlement performance.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE003
        - TE005
    - type: missing-source
      severity: material
      topic: incident-history
      missingEvidence: A public status page, outage ledger, RCA archive, or uptime disclosure for the product stack.
      whyItMatters: Security and process claims are public, but resilience cannot be judged well without incident and recovery evidence.
      diligencePath: Search for official status communications or request historical outage and major-incident reporting from the company.
      relatedQuestionRefs:
        - QE023
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public engineering-role detail, repo activity, package distribution, tech talks, or other practitioner-facing signals beyond the careers shell.
      whyItMatters: Product breadth and compliance maturity are visible, but public evidence of engineering depth and hiring priorities is weak.
      diligencePath: Obtain a richer openings export, engineering talk record, or other practitioner-surface evidence that shows payments, infra, data, or security hiring.
