  - id: trust-privacy-security-and-compliance-controls
    title: Trust, Privacy, Security & Compliance Controls
    body: |-
      CRED's best public technical evidence is concentrated in trust and compliance disclosures rather than engineering deep dives. The security page is unusually concrete for a consumer fintech marketing surface: AWS Virtual Private Cloud, firewall and WAF layers, DDoS protection, CDN, three-tier segmentation, encryption at rest, application-level encryption for sensitive data, backup and restore practices, change management, NOC and ISMS processes, and periodic CERT-In-audited testing. The privacy page complements that by stating users can revoke permissions and request deletion, while warning that some retention can continue for legal reasons. Taken together, those pages support a real controls narrative, even if they do not provide architecture diagrams or certification numbers.

      Compliance breadth is also important because it maps directly to product scope. CRED publicly claims PCI DSS v4.0.1 Level 1, ISO 27001:2022, ISO 27701:2019, tokenisation compliance, UPI compliance, and India data localisation. March 2026 PA materials add regulatory breadth beyond security copy: PPI approval, PA authorisation, and group-level IRDAI, SEBI, and NPCI permissions. For lending, official disclosures go further than most fintech consumer apps by naming lenders, DLG exposure, subcontractors, and collections agencies. The limitation is that this evidence mostly proves controls and obligations exist; it does not independently prove incident frequency, merchant-quality metrics, or how every control performs in production.
