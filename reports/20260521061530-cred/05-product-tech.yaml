figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Evidence-backed layered view of CRED's product architecture, from member-facing payment UX through
      compliance, security, and partner rails.
    approximationNotes: >-
      CRED has not published a formal architecture diagram. Layers are synthesized from official product,
      security, legal, app-store, and regulatory materials and should be read as an operating-model map.
    data:
      layers:
        - label: Member access and identity layer
          detail: High-score membership gate, card linking, score tracking, rewards, and CRED Protect cues
          modules:
            - Members-only onboarding
            - Credit score and card management
            - Rewards and premium experiences
        - label: Payment interaction layer
          detail: Bill pay, QR and UPI, alias ID, tap to pay, autopay, and transfer flows inside the app
          modules:
            - Credit-card bill payments
            - CRED Pay and UPI
            - Tap to Pay
            - Wallet and merchant checkout
        - label: Adjacent product layer
          detail: Financial and lifestyle modules cross-sold from the same app shell
          modules:
            - Garage
            - Mint
            - Cash+
            - Money
            - e₹ wallet
            - UPI on credit / card pages
        - label: Compliance and service-operations layer
          detail: KYC, grievance handling, DLA and LSP workflows, collections disclosures, and support operations
          modules:
            - Grievance redressal
            - Customer support
            - DLG and collections disclosures
        - label: Security and data-controls layer
          detail: AWS VPC, segmentation, WAF and DDoS controls, encryption, localisation, audits
          modules:
            - AWS infrastructure
            - Data localisation controls
            - PCI / ISO claims
            - Incident and change management
        - label: External rails and partner layer
          detail: Regulated permissions and partner-supplied inventory underpin most modules
          modules:
            - RBI and NPCI frameworks
            - PSP and sponsor banks
            - Visa and Google HCE
            - Lenders and insurers
            - Merchant and KYC vendors
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE014
