        - KYC is required and merchant-side economics are opaque
      - - Use CBDC for transfers and merchant spends
        - Jan 2025 CNBC beta coverage
        - e₹ wallet with video KYC and YES BANK sponsorship
        - Transfers to UPI-linked accounts and other CBDC wallets at no extra merchant cost
        - Still beta, whitelisted, and capped at disclosed transfer and balance limits
      - - Manage vehicle maintenance and insurance
        - Garage launch and insurer-expansion coverage
        - DigiLocker docs, reminders, digital claims initiation, premium comparison, concierge
        - Extends bill-pay habit into sticky vehicle lifecycle workflows
        - Official module page remains too thin for a full operating walkthrough
