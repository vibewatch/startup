  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow evidence
      - CRED solution
      - Explicit benefit or promise
      - Limitation / constraint
    rows:
      - - Manage and pay multiple credit cards in one place
        - About page and app-store descriptions
        - Consolidated card management, reminders, and score-linked rewards
        - Less app switching and more payment discipline cues
        - Public reward economics and failure-rate metrics are not disclosed
      - - Pay a merchant without exposing full identity details
        - CRED Pay page
        - Alias UPI ID and QR-based payments
        - Merchant sees less sensitive information
        - Merchant acceptance breadth and dispute metrics are not public
      - - Make quick offline contactless payments from the phone
        - Tap to Pay page
        - Phone-as-card using NFC and HCE
        - Faster card-present flow without the physical card
        - Android NFC and partner-card gating sharply narrow reach
      - - Preload value and check out at partner merchants
        - Oct 2024 launch coverage
        - Wallet plus merchant rewards plus device-tokenised saved-card checkout
