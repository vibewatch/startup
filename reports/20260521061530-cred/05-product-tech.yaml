  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Representative member journey from eligibility and card linking into payments, adjacent-module cross-sell,
      and support escalation.
    approximationNotes: >-
      This flow abstracts multiple public surfaces into one member journey; it does not imply every user touches
      every module or that the sequence is the same for all cohorts.
    data:
      nodes:
        - id: join
          label: Join as an eligible member
          detail: Member clears the public credit-score gate and verifies card details
        - id: link
          label: Link cards and view score / spend data
          detail: App becomes the control panel for cards, reminders, and score insights
        - id: pay
          label: Choose payment rail
          detail: Credit-card bill pay, QR and UPI, transfer, autopay, or merchant checkout
        - id: privacy
          label: Add payment protections
          detail: Alias UPI ID, tokenised checkout, or NFC tap flow depending on the use case
        - id: crosssell
          label: Enter adjacent module
          detail: Wallet, Garage, Mint, Cash+, or e₹ wallet cross-sell from the same app shell
        - id: issue
          label: Raise support or grievance if needed
          detail: In-app support, social DM, or grievance escalation for payment and account issues
        - id: continue
          label: Return to ongoing member engagement
          detail: Repeated payments and cross-sell reinforce the app as a financial control plane
      edges:
        - from: join
          to: link
        - from: link
          to: pay
        - from: pay
          to: privacy
        - from: privacy
          to: crosssell
        - from: crosssell
          to: issue
        - from: issue
          to: continue
    claimRefs:
