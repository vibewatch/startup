  - id: support-partners-and-public-evidence-limits
    title: Support, Partner Dependence & Public-Evidence Limits
    body: |-
      The support stack is consistent with a digital-first operating model. CRED's customer-care page is explicit that the primary route is in-app support, supplemented by social DMs and escalation to a named grievance officer, while anti-fraud language warns members never to share UPI PINs, OTPs, CVVs, or bank details. That makes the support model operationally scalable, but it also leaves a perception risk when something goes wrong because there is no public voice-first customer-care number. The Apple review surface illustrates that risk directly: strong aggregate ratings coexist with recurring complaints about payment failures, support responsiveness, rewards dilution, and collections behaviour.

      Public evidence gaps are concentrated where the product surface is visually rich but text-light. Garage, Money, Cash+, pay-via-UPI, UPI on credit, and the card landing page all fetched as title-only or near-title-only surfaces during this run, and the careers site exposed only shell headings rather than role-level engineering detail. As a result, CRED's architecture looks broad, but not every module can be described with equal precision. The right diligence posture is to trust the existence and category of those modules while bounding any deeper workflow, merchant-scale, incident-history, or developer-signal claim until richer captures or internal materials are available.
