callouts:
  - calloutType: strength
    title: Regulatory breadth now matches product breadth better than in earlier CRED vintages
    body: >-
      The combination of PA approval, pre-existing PPI permission, public UPI-role framing, and detailed lender/
      vendor disclosures means CRED's public control evidence is now materially stronger than the thin product pages
      alone would suggest. The company still depends heavily on partners, but the permissions stack and control claims
      are no longer just bill-pay era marketing.
    claimRefs:
      - CE007
      - CE025
      - CE026
      - CE027
      - CE030
  - calloutType: risk
    title: Partner-heavy architecture creates both leverage and concentrated execution risk
    body: >-
      CRED can widen product scope quickly by layering UX over regulated rails and partner inventory, but that same
      model makes it dependent on banks, lenders, insurers, vendors, app stores, and collections partners. The public
      record is good enough to see the dependency map, but not good enough to quantify partner concentration, outage
      exposure, or merchant-service quality with confidence.
    claimRefs:
      - CE023
      - CE030
      - CE032
      - CE033
      - CE040
      - CE043
  - calloutType: insight
    title: Official product-page thinness is itself a diligence signal
    body: >-
      Several modules clearly exist because their URLs, launch coverage, or app-store descriptions are live, but the
      official landing pages fetch as near-empty shells. That should not be mistaken for evidence of non-existence; it
      should be treated as a sign that public workflow and architecture support is uneven, so deeper module claims need
      screenshots, internal demos, or operator materials.
    claimRefs:
      - CE038
      - CE039
      - CE041
