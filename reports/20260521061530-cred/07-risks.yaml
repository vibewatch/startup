- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - DLG / credit-performance opacity
    - DLG invocation or delinquency disclosure
    - Any evidence of material invocation without richer vintage data
    - Pause underwriting until lender mapping and recovery data are provided
  - - Payment-operations strain
    - Refund ageing, dispute backlog, or PSP audit issues
    - Persistent SLA misses or rising complaint escalations
    - Re-rate operational risk upward and revisit growth assumptions
  - - Partner withdrawal
    - Lender, insurer, PSP-bank, or major vendor exit
    - Loss of a top lending, insurance, or payments partner
    - Cut growth expectations and require replacement economics before conviction
  - - Collections conduct
    - Ombudsman cases, public complaints, or partner remediation
    - Pattern of conduct complaints across agencies or lender partners
    - Treat as thesis damage, not only a compliance footnote
  - - Security / privacy incident
    - Confirmed breach, regulator notice, or major data-misuse event
    - Material incident with user impact or regulator scrutiny
    - Move to avoid or at minimum reset valuation and confidence
  - - Disclosure gap / financing risk
    - Next financing or IPO step without audited segment detail
    - Another markdown or capital raise before disclosure improves
    - Treat as evidence of weak governance readiness and demand price discipline
  notes: Triggers are intentionally observable from public evidence or standard diligence requests so the chapter can be monitored after publication rather than only debated conceptually.
