- id: operational-and-partner-dependency-risk
  title: Operational & Partner-Dependency Risk
  body: |-
    Operational risk is high because CRED's product promise now rests on partner-heavy workflows at meaningful scale. UPI disputes pass across TPAP, PSP bank, account bank, NPCI, and Ombudsman layers. Lending disclosures show twelve technology providers and forty-seven collections or recovery agencies touching credit products. Insurance distribution depends on external carriers and claims experience. Even where public controls look serious, the customer experience is still only as strong as the slowest payment rail, grievance workflow, or servicing vendor inside the chain.

    That creates a distinctive transmission pattern. Some balance-sheet risk sits with lenders and insurers, but complaint risk, trust erosion, and regulatory scrutiny can still sit with CRED because the user only sees one app. The same problem appears in support design: app-only support reduces scam surface and fits a digital operating model, but it can become a bottleneck when payments fail, refunds age, or recovery interactions turn adversarial. Product sprawl multiplies that burden. Garage, payments, lending, insurance, and adjacent finance products all widen the set of failure modes that must stay controlled at once.
