  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dlg-counterparty-concentration
    missingEvidence: Names, exposure shares, and contract terms for the lenders behind each anonymised DLG bucket.
    whyItMatters: Without lender mapping, investors cannot judge whether DLG exposure is diversified or concentrated in weaker counterparties.
    diligencePath: Request lender-by-bucket mapping, top-partner exposure shares, and concentration history by product line.
    relatedQuestionRefs:
    - QR005
    - QR007
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: material
    topic: credit-performance
    missingEvidence: Vintage curves, delinquency buckets, DLG invocation amounts, recoveries, and net credit-loss data.
    whyItMatters: These inputs determine whether CRED's lending economics are truly partner-light or merely partner-mediated.
    diligencePath: Request monthly vintage tables, invoked-versus-available DLG schedules, and recovery timelines by portfolio.
    relatedQuestionRefs:
    - QR004
    - QR019
    - QR023
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: complaints-and-incidents
    missingEvidence: Complaint volumes, dispute ageing, refund ageing, outage logs, and security incident history.
    whyItMatters: Payments-scale responsibility cannot be underwritten cleanly without operational loss or complaint-frequency data.
    diligencePath: Request last 12 months of complaints, ombudsman escalations, refund SLA breaches, and incident postmortems.
    relatedQuestionRefs:
    - QR009
    - QR011
    - QR017
    - QR023
    - QR026
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner concentration by lender, insurer, PSP bank, collections agency, and critical vendor.
    whyItMatters: A partner-heavy model can fail through concentration long before top-line metrics show stress.
    diligencePath: Request top-10 partner exposure, contract duration, renewal terms, and recent partner churn or remediation events.
    relatedQuestionRefs:
    - QR007
    - QR014
    - QR021
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: transparency-gap
    missingEvidence: Audited product-level revenue, take rate, contribution margin, and profitability by payments, lending, insurance, and other adjacencies.
    whyItMatters: The absence of segmented disclosure turns both model risk and valuation risk into judgment calls.
    diligencePath: Request FY25 audited statements, FY26 YTD MIS, and a bridge from product revenue to consolidated margin.
    relatedQuestionRefs:
    - QR023
    - QR024
    - QR028
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: minor
    topic: regulatory-history
    missingEvidence: Litigation schedule, material regulator correspondence, and a complete record of any show-cause, remediation, or warning notices.
    whyItMatters: The retained public pack did not surface major enforcement, but public silence is not the same thing as confirmed absence.
    diligencePath: Request legal-proceedings schedule and regulator-correspondence log covering RBI, NPCI, IRDAI, SEBI, and ombudsman matters.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR001
