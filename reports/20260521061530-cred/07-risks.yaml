- id: mitigations-monitors-and-thesis-breaks
  title: Mitigations, Monitors & Thesis-Break Triggers
  body: |-
    The mitigating evidence is real. CRED publicly discloses lending partners, grievance routes, security controls, privacy commitments, data-localisation claims, and DLG buckets. Partner grievance pages show regulated institutions standing behind at least some user journeys. PA approval indicates regulatory trust has not broken down. These factors are enough to argue that CRED is not operating as an unmanaged grey-zone fintech.

    Still, the right underwriting posture is high-complexity rather than low-risk. This chapter treats regulatory and partner complexity as strategic risk, not housekeeping. The monitors that matter are observable: invoked DLG and delinquency trends, PSP or lender exits, refund and dispute ageing, complaint escalation volumes, security incidents, and whether management closes the disclosure gap before the next financing or IPO attempt. A thesis break would not require one catastrophic event. It could come from several smaller failures arriving together — tighter rules, weaker partner appetite, noisier collections, slower refunds, or another markdown without corresponding disclosure improvement. That is why mitigation maturity should be viewed as credible but still incomplete.
