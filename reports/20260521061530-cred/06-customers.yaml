- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Best public scale signal
  - Strategic value
  - Gap
  rows:
  - - Affluent high-score core
    - Individual cardholder is user and payer
    - Card-bill pay, score tracking, rewards
    - 750+ gate plus 11.5M FY24 MTU and 12.6M FY25 MTU
    - High-frequency payment anchor and premium positioning
    - Exact active-cardholder count is not disclosed
  - - Multi-product actives
    - Existing members expanding usage
    - Wallet, lending, Garage, insurance, wealth adjacencies
    - Nearly 45% of active members use three or more products
    - Best proof that CRED can land-and-expand beyond bill pay
    - No product-by-product MAU or cohort split is public
  - - Vehicle users
    - Member is user and insurance / resale buyer
    - Garage reminders, claims, renewal, resale
    - 4.2M vehicles in FY24, 60 lakh by Sep 2024, 1.1 crore by Jul 2025
    - Concrete adjacency with repeated engagement hooks
    - Vehicle-user conversion from the core member base is not public
  - - CBDC beta users
    - Whitelisted member is wallet user and payer
    - e₹ wallet transfers and merchant transactions
    - Beta-only, video-KYC-gated, capped wallet
    - Shows willingness to trial new payment rails with premium users
    - Rollout and repeat-usage metrics are not public
  - - Mass app-store audience
    - Downloader or reviewer, not necessarily admitted member
    - App discovery, evaluation, and broad retail reach
    - 50M+ downloads, ~2.95M Play reviews, 593,339 iOS ratings
    - Proof that selective onboarding still sits on a large discovery funnel
    - Downloads and ratings are not the same as funded or transacting members
  - - Merchant-and-partner surface
    - Merchant, insurer, or resale partner serves member demand
    - Wallet checkout, insurance distribution, resale
    - Named merchants, seven insurers, and CARS24 / Spinny disclosed
    - Supports production deployment and future monetisation breadth
    - Merchant count, insurer conversion, and partner economics remain private
  notes: Rows mix end-user cohorts and named partner-facing surfaces because public reporting alternates between members, users, MTU, vehicles, and merchant proof rather than one clean customer taxonomy.
