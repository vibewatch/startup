- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - Bill-pay wedge into 3+ products
    - Cross-sell still measured only at a high level
    - Expansion story may be overstated if depth sits in a few products
    - 45% of active members use 3+ products but no product-level cohort is public
    - Request MAU and revenue by product cohort
  - - Selective affluent admission gate
    - Addressable base is narrower than open-access payments apps
    - Growth could saturate if premium-card acquisition slows
    - 750+ gate and affluent-user framing are explicit across official surfaces
    - Request cohort growth by score band and city tier
  - - Garage scaling and insurer expansion
    - Partner-heavy insurance and resale flows depend on third-party service quality
    - Claims, renewal, or resale experience can degrade outside CRED's direct control
    - Seven insurers plus CARS24 / Spinny partnerships are public
    - Request partner SLA, conversion, and complaint rates
  - - PA and merchant rollout
    - Merchant count and merchant TPV remain largely private
    - Merchant-side expansion may be harder to underwrite than consumer payments scale
    - PA approval and named wallet brands prove deployment but not merchant density
    - Request active merchant count, TPV mix, refunds, and settlement ageing
  - - Digital-first support model
    - No public phone line and recurring ticket-closure complaints create service perception risk
    - Poor support can damage retention even if ratings remain high
    - Customer-care page and review snippets point to written-channel dependence
    - Request service-level dashboard, reopen rate, and escalated grievance volumes
  notes: Impact and diligence paths are analytic judgments synthesized from the retained public evidence rather than disclosed company metrics.
