  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A reconciled monthly bridge between members, admitted members, users, MAU, MTU, and merchant-user labels.
    whyItMatters: Without a definition bridge, headline scale claims can be overstated or compared incorrectly across time and sources.
    diligencePath: Ask management for a dated definitions appendix and the monthly member / MAU / MTU series used internally.
    relatedQuestionRefs:
    - QU001
    - QU021
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, repeat-payment retention, and cohort tables by major product line.
    whyItMatters: Ratings and transaction frequency cannot prove durability or revenue stickiness on their own.
    diligencePath: Request monthly cohort retention, churn bridge, repeat-usage tables, and customer-service resolution trends by cohort.
    relatedQuestionRefs:
    - QU013
    - QU022
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: named-proof
    missingEvidence: Quantified merchant, insurer, and wealth-customer outcomes for the named proof surfaces listed in the chapter.
    whyItMatters: Named partners prove deployment, but they do not prove adoption quality, conversion, or economic value without operating metrics.
    diligencePath: Request merchant GMV, insurer conversion, resale lead-to-close rates, and Kuvera migration or activation metrics.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof
    missingEvidence: A complete list of production merchants, insurers, sponsor banks, and partner platforms tied to customer-facing surfaces.
    whyItMatters: The current named-proof roster is enough for partial evidence but not for a full deployment census or channel-concentration analysis.
    diligencePath: Ask for the active merchant roster, insurer-partner list, sponsor-bank list, and launch dates for each customer-facing deployment.
    relatedQuestionRefs:
    - QU008
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: merchant-proof
    missingEvidence: Merchant count, merchant TPV, wallet MAU, refund ageing, and settlement SLA data for the wallet and PA businesses.
    whyItMatters: Public merchant names and PA approval do not show whether the merchant business is broad, deep, or operationally resilient.
    diligencePath: Request an internal merchant dashboard covering active merchants, payment mix, refunds, chargebacks, and settlement performance.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU019
    relatedTableRefs:
    - TU005
