- id: support-proof-quality-and-durability
  title: Support, Proof Quality & Durability Gaps
  body: |-
    Public customer proof is strongest where mobile platforms expose it directly. Google Play shows 50M+ downloads, about 2.95 million reviews, and a 4.8 rating, while Apple shows a 4.8 score and 593,339 ratings in the lookup API. That is meaningful proof that CRED has escaped pure niche status even though its admitted member base is selective. It also gives the chapter a valuable second lens: unlike founder quotes or company pages, app stores expose both endorsement and criticism from real users at scale.

    That criticism is not trivial. Recent Google Play reviews complain that rewards and cashback have become less useful and that support tickets are closed without fixing the issue. App Store reviews add complaints about failed payments after card additions or phone-number changes, plus difficulty escaping bot-led support. Those snippets do not quantify complaint prevalence, but they do show the adverse themes that recur publicly: rewards dilution, service-resolution frustration, and reliability pain when payment or identity flows break. The support model itself is explicitly digital-first, because CRED says support lives in-app, by email, and via social DMs rather than through a public phone line.

    Durability is where public evidence thins out sharply. There is no credible public NRR, GRR, churn, renewal, cohort-retention, or contract-length dataset for this chapter to lean on. Named proof is also limited: the public record offers merchants, insurers, sponsor banks, and resale partners, but not many quantified end-customer case studies. So the right diligence stance is to recognise strong adoption proof and visible cross-sell while refusing to overclaim retention or customer happiness beyond ratings and review snippets.
