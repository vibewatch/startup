evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: >-
      Current board composition, independent director roster, investor board rights, and any documented succession plan
      for the founder-CEO.
    whyItMatters: >-
      A late-stage consumer fintech with lending exposure and IPO ambitions should disclose stronger governance evidence
      than is publicly visible today.
    diligencePath: Request the latest board deck, cap table governance matrix, and shareholder agreement summary in the data room.
    relatedQuestionRefs:
      - QO010
      - QO013
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: >-
      A clean reconciliation of total capital raised by round, split between primary and secondary, including secondary
      liquidity and current preference stack.
    whyItMatters: >-
      The valuation reset matters differently if the company also has heavy preference overhang or large undisclosed
      secondary transfers.
    diligencePath: Request cap-table history, share-class schedule, and every financing board resolution from 2018 through 2025.
    relatedQuestionRefs:
      - QO002
      - QO011
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current, consolidated employee headcount with geography or function breakdown.
    whyItMatters: >-
      Headcount is a core maturity signal and helps assess fixed-cost leverage, compliance staffing, and pre-IPO
      readiness.
    diligencePath: Ask management for the latest HR MIS, org chart, and employee count by function and legal entity.
    relatedQuestionRefs:
      - QO003
      - QO018
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: member-definitions
    missingEvidence: >-
      A metric dictionary reconciling total members, active members, monthly transacting users, and affluent Indians
      cited in marketing and regulatory communications.
    whyItMatters: Confusing user definitions can overstate traction and distort valuation or cross-sell assumptions.
    diligencePath: >-
      Request monthly cohort definitions and the exact metric glossary used in investor updates and regulator-facing
      statements.
    relatedQuestionRefs:
      - QO003
      - QO023
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: ipo-readiness
    missingEvidence: Any formal IPO preparation timeline, appointed bankers, audit readiness memo, or filed draft documents.
    whyItMatters: >-
      The valuation reset is partly justified by IPO readiness, so the absence of concrete filings or preparation
      artefacts lowers confidence in timing.
    diligencePath: Request IPO readiness workstreams, advisor mandates, and an updated listing timeline from management.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: active-cred-cardholders
    missingEvidence: >-
      A reconciled split between CRED's 25 million-plus members monthly active payers and prime cardholders who meet the
      750-plus filter at run date.
    whyItMatters: >-
      Without that funnel, investors cannot convert broad membership claims into a clean SAM or active-user-based
      monetisation model.
    diligencePath: >-
      Request current MAU card-linked active-user and multi-card-user cohorts from management and tie them to bill-pay
      frequency and partner monetisation.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM001
      - TM003
  - type: missing-source
    severity: material
    topic: official-rupay-on-upi-adoption
    missingEvidence: >-
      Direct NPCI or RBI public disclosure for merchant count volume share and value share of RuPay credit-on-UPI
      instead of relying on secondary Bernstein reporting.
    whyItMatters: >-
      Merchant-acceptance and share numbers drive the argument that credit-on-UPI materially expands the category, but
      the strongest current public statistic is still secondary.
    diligencePath: >-
      Pull the underlying NPCI circulars statistics releases or product-note PDFs once the public product-documents hub
      surfaces them directly.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: stale
    severity: material
    topic: bbps-post-mandate-coverage
    missingEvidence: >-
      Post-mandate bank coverage payment success-rate and grievance-resolution outcomes for credit-card bill-pay through
      BBPS as experienced by CRED and other apps.
    whyItMatters: >-
      This determines whether BBPS is merely a regulatory hygiene step or a structural margin and differentiation change
      for specialist card-payment apps.
    diligencePath: >-
      Ask management for current bank-integration coverage failed-payment rates pre and post BBPS and any change in unit
      economics or support burden since July 2024.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Publicly comparable realized reward economics and fee schedules for CRED, PhonePe, Paytm, and MobiKwik
      card-bill-pay behavior.
    whyItMatters: >-
      Without realized economics, the chapter can compare package signals but cannot underwrite who is subsidizing
      growth most aggressively.
    diligencePath: >-
      Pull official MITC documents, card-program terms, merchant-fee schedules, and investor commentary for each
      platform's relevant card or bill-pay product.
    relatedQuestionRefs:
      - QP010
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: payment-share-by-channel
    missingEvidence: >-
      Public channel-share data showing how much credit-card bill payment volume flows through CRED versus issuer apps,
      super-apps, and other third-party fronts.
    whyItMatters: >-
      Competitive intensity depends on actual user behavior, not just feature overlap; the biggest unresolved question
      is who owns recurring repayment habit in practice.
    diligencePath: >-
      Request internal channel-mix data from CRED or third-party acquiring partners and triangulate with issuer-side
      settlement reporting.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: minor
    topic: reward-subsidy-sustainability
    missingEvidence: >-
      Consistent public reporting on the funding source and persistence of rewards across overlays, issuer programs, and
      co-branded products.
    whyItMatters: >-
      The category can look sticky when rewards are subsidized, but durability depends on whether those incentives
      survive a tighter regulatory and profitability regime.
    diligencePath: >-
      Compare partner-program terms, annual-report disclosures, and promotional-history snapshots over time to see which
      reward promises have actually endured.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: payment-take-rate
    missingEvidence: Line-item payments revenue and merchant MDR or net take-rate bridge across bill pay, QR, and checkout flows.
    whyItMatters: Without a take-rate bridge, payments scale cannot be converted into revenue quality or margin durability.
    diligencePath: >-
      Request audited FY25 payments P&L by product, including gross TPV, net revenue, incentives, chargebacks, and
      payment-processing costs.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Audited revenue mix by payments, lending, insurance, wealth, rewards, and other adjacencies.
    whyItMatters: >-
      The current narrative says 90% of revenue comes from three lines, but underwriting needs actual segment shares and
      trend lines.
    diligencePath: >-
      Request management accounts or statutory notes that reconcile segment revenue for FY24 and FY25 to consolidated
      revenue.
    relatedQuestionRefs:
      - QI011
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross-margin bridge and direct-cost detail for payments, lending distribution, insurance distribution, and wealth.
    whyItMatters: >-
      Operating leverage can be misread if direct cost absorption, incentives, payment processing, and collections costs
      are hidden inside opex.
    diligencePath: >-
      Request product-level direct-cost schedules, contribution-margin definitions, and reconciliation from contribution
      margin to EBITDA and total loss.
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: credit-loss-data
    missingEvidence: >-
      Vintage curves, delinquency buckets, DLG invocation history, recoveries, and partner-level credit performance for
      on-platform lending.
    whyItMatters: >-
      Lending can look capital-light while still being economically fragile if losses migrate through DLG, collections,
      or partner-pricing changes.
    diligencePath: >-
      Request monthly cohorts by product and partner covering originations, PAR, charge-offs, recoveries, DLG calls, and
      pricing resets.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, unrestricted cash, monthly cash burn, and management runway planning base case.
    whyItMatters: >-
      Capital adequacy cannot be judged from valuation and revenue alone when the company is still loss-making and
      running a large payments and lending surface.
    diligencePath: >-
      Request latest board pack or monthly MIS with cash waterfall, burn by function, and covenant or reserve
      constraints.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Accounting policy detail showing where CRED is principal versus agent across merchant payments, lending
      distribution, insurance, and wealth.
    whyItMatters: >-
      Revenue multiples and margin assumptions change materially if reported revenue is net commission-like rather than
      gross transaction economics.
    diligencePath: >-
      Request audited accounting policies, product P&L mappings, and sample contracts with lenders, insurers, merchants,
      and wealth partners.
    relatedTableRefs:
      - TI001
      - TI002
      - TI005
  - type: missing-source
    severity: material
    topic: settlement-float
    missingEvidence: >-
      Merchant settlement timelines, refund reserves, nodal-account structure, and any working-capital facilities
      supporting PA operations.
    whyItMatters: >-
      Payment-aggregator economics can carry low visible margin but meaningful settlement, liquidity, and refund-risk
      exposure.
    diligencePath: >-
      Request payment-operations dashboard metrics, nodal-account architecture, settlement SLAs, refund aging, and
      reserve policy.
    relatedTableRefs:
      - TI004
      - TI005
  - type: access-blocked
    severity: material
    topic: thin-pages
    missingEvidence: Rich captures or fuller text extraction for Garage, Money, Cash+, pay-via-UPI, UPI on credit, and card pages.
    whyItMatters: >-
      These modules clearly exist, but title-only fetches leave workflow depth, eligibility nuance, and product
      constraints under-supported.
    diligencePath: >-
      Capture screenshots or richer first-party text for each thin module page and reconcile them against app-store or
      press descriptions.
    relatedQuestionRefs:
      - QE019
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: tpap-evidence-gap
    missingEvidence: A direct official NPCI record or operator-list row naming CRED or Dreamplug as a current TPAP participant.
    whyItMatters: >-
      The UPI FAQ explains obligations, but a direct official registry artifact would strengthen confidence in the
      current regulatory mapping.
    diligencePath: >-
      Retrieve an NPCI operator, participant, or partner directory row or official TPAP approval artifact that names the
      entity directly.
    relatedQuestionRefs:
      - QE021
  - type: missing-source
    severity: material
