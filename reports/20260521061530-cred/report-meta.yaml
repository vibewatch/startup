companyProfile:
  summary: >-
    CRED is an Indian private consumer-fintech company founded in 2018 by Kunal
    Shah and headquartered in Bengaluru. What began as a premium credit-card
    bill-pay rewards product has expanded into a broader regulated platform that
    now spans UPI, wallet and merchant checkout, lending, wealth, insurance,
    travel, and Garage-led vehicle services. Public evidence points to over 25
    million creditworthy members, FY25 operating revenue of ₹2,735 crore,
    monthly transacting users of roughly 1.26 crore, payment volume of about
    ₹8.5 lakh crore, and lending AUM of roughly ₹22,000 crore. At the same time,
    the June 2025 down round to a $3.5 billion valuation and persistent gaps in
    segment economics and credit disclosure keep the business only partially
    underwritten from public sources.
