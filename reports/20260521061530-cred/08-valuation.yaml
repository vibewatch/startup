  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: A clean cap-table view for the 2025 round, including liquidation preferences, anti-dilution protections, secondary versus primary split, and any MFN or ratchet features.
    whyItMatters: Without the real round terms, downside cannot be sized from the headline $3.5 billion mark alone because preference structure can absorb most equity value in a weak exit.
    diligencePath: Request the post-round cap table, financing documents, and board materials summarising rights for the 2025 investors.
    relatedQuestionRefs:
    - QV003
    - QV021
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited FY25 statements plus FY26 YTD MIS with segment revenue, take rates, contribution margins, CAC, repeat behaviour, and cohort-level monetisation by payments, lending, insurance, and wealth.
    whyItMatters: The current valuation can only be underwritten if the improving revenue line converts into high-quality, repeatable, and reasonably durable unit economics rather than one-off product sprawl.
    diligencePath: Obtain audited FY25 financials, monthly management reporting, and product-level dashboards used in board reviews.
    relatedQuestionRefs:
    - QV013
    - QV017
    - QV018
    - QV030
    relatedTableRefs:
    - TV003
    - TV004
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: credit-performance
    missingEvidence: Portfolio-level delinquency, vintage loss, DLG invocation, recovery, and partner concentration data across all credit products and lender buckets.
    whyItMatters: Lending and DLG economics are large enough to influence valuation, but the public record shows only anonymised exposure and no realised credit performance, which makes both upside and downside estimation fragile.
    diligencePath: Request lender-by-lender books, DLG contracts, monthly portfolio performance packs, and exception reporting on collections conduct.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV019
    - QV028
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Evidence on IPO timetable, auditor readiness, legal clean-up, underwriter engagement, and public-company control maturity beyond press framing.
    whyItMatters: The 2025 reset is easiest to justify if CRED is genuinely moving toward an IPO-quality disclosure standard; otherwise the current mark may still be too generous for a private, under-disclosed asset.
    diligencePath: Request banker materials, audit-completion status, governance workstreams, and a draft external-reporting roadmap.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV022
    - QV030
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
