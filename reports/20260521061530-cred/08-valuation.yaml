- id: current-mark-and-public-comps
  title: Current Mark & Public Comp Set
  body: |-
    For a public-only diligence pass, the cleanest anchor is to compare CRED's June 2025 mark with listed Indian fintechs using official filings plus live exchange quotes. On that basis, CRED's implied trailing multiple of roughly 10.9-11.1x sits near Paytm's roughly 10.7x market-cap-to-FY25-revenue and below PB Fintech's roughly 12.4x market-cap-to-FY26-revenue. That sounds more reasonable than comparing CRED to the lowest-multiple names in the set. The problem is that Paytm and PB Fintech both carry far deeper disclosure, while PB is also profitable. CRED therefore arrives at a similar pricing zone without giving public investors similar underwriting visibility.

    The rest of the comp set is more cautionary than supportive. MobiKwik is a closer consumer wallet and credit-adjacency analogue, but it trades at only about 1.3x FY25 revenue. Zaggle and Fino trade even lower on a revenue basis, though both are imperfect because Zaggle is more B2B software-and-payments and Fino is a regulated transaction-bank model. These companies are best treated as boundary markers rather than direct comps, but they still show how much the Indian public market discounts fintech models that lack the scale or perceived quality premium of the top two names. The right read-through is that CRED deserves a blended comp framework, not a single hero comp: Paytm for scale and regulatory complexity, PB Fintech for distribution quality, MobiKwik for consumer-wallet adjacency, and Zaggle plus Fino as lower-multiple guardrails.
