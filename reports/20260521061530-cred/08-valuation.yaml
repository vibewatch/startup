- id: TV004
  title: Comparable valuation table
  columns:
  - Company
  - Latest official revenue basis
  - Current market / valuation
  - Mcap-to-revenue
  - Why relevant
  - Key mismatch versus CRED
  rows:
  - - CRED
    - FY25 revenue ₹2,735 crore
    - Private mark ~₹29,750-30,450 crore ($3.5B)
    - ~10.9x-11.1x
    - Reference company; premium consumer-fintech mix with payments and lending scale
    - Private, under-disclosed, loss-making, and partner-heavy
  - - Paytm
    - FY25 revenue ₹6,900 crore
    - NSE equity value ~₹73,685 crore
    - ~10.7x
    - Closest listed comp on payments scale and regulatory complexity
    - Broader merchant and MSME mix; more disclosed
  - - PB Fintech
    - FY26 revenue ₹6,794 crore; FY26 PAT ₹670 crore
    - NSE equity value ~₹84,372 crore
    - ~12.4x
    - Best listed quality comp for financial distribution and disclosure depth
    - Insurance and marketplace mix is not a payments-rail analogue
  - - MobiKwik
    - FY25 total income ₹1,192.5 crore
    - NSE equity value ~₹1,536 crore
    - ~1.3x
    - Closest listed consumer wallet / credit-adjacency reference
    - Smaller scale and much lower public-market rating
  - - Zaggle
    - FY25 revenue ₹1,303.8 crore
    - NSE equity value ~₹2,867 crore
    - ~2.2x
    - Useful boundary marker for fintech software and spend-management economics
    - B2B-heavy and structurally different end market
  - - Fino Payments Bank
    - FY26 revenue ₹1,587.9 crore
    - NSE equity value ~₹1,011 crore
    - ~0.6x
    - Useful boundary marker for regulated transaction economics and throughput discipline
    - Banking model rather than premium consumer app layer
  notes: Uses official company filings or investor materials for revenue and official NSE quote data for market value. This is market-cap-to-revenue, not enterprise value, because net cash and debt are not normalised in a public-only pass.
