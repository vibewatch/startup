- id: scenario-ranges-entry-discipline-and-exit
  title: Scenario Ranges, Entry Discipline & Exit Path
  body: |-
    The right conclusion is not that $3.5 billion is absurd; it is that the mark already prices in a meaningful amount of execution success. The bull case needs FY26 revenue in roughly the ₹3,200-3,500 crore range, further loss compression, and enough disclosure progress to make IPO preparation tangible rather than aspirational. Under those conditions, a valuation of roughly ₹38,000-47,000 crore is plausible because CRED could argue for a premium consumer-fintech multiple near the top end of Indian public comps. The base case is more restrained: mid-teens growth, some further operating leverage, and only partial disclosure improvement support about ₹26,000-34,000 crore, which brackets the current mark. The bear case is a much sharper reminder that private-market protection is weak without term-sheet detail: if listed-fintech multiples compress, credit performance disappoints, or partner complexity proves uglier than public evidence suggests, value can drift toward roughly ₹14,000-22,000 crore.

    That makes entry discipline central to the recommendation. A public-only investor does not need to prove that CRED is overvalued; it is enough to conclude that upside is not obviously asymmetric at today's mark. The more investable setup is either a lower price, roughly below ₹24,000-27,000 crore, or the current mark plus a much better diligence package. Exit logic also matters. The most realistic paths are an IPO or a large secondary transaction, not a clean strategic sale, because the company now straddles multiple regulated and partner-heavy products. If the IPO-quality disclosure package does not arrive, the current price is more likely to behave like an upper-end private mark than a bargain entry.
