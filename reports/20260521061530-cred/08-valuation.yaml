- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Implication
  rows:
  - - Recommendation
    - Track / research-more
    - Do not pay the current private mark on public evidence alone.
  - - Confidence
    - Medium
    - Direct market mark and comp data are solid, but core unit economics remain private.
  - - Risk rating
    - High
    - Partner, licence, credit, and disclosure complexity can compress the IPO band quickly.
  - - Valuation stance
    - Fair-to-stretched at $3.5B
    - About 11x FY25 revenue is defensible only if disclosure and execution keep improving.
  - - Entry discipline
    - Prefer ≤₹24,000-27,000 crore unless diligence improves
    - That range creates clearer upside versus listed-peer comparables.
  - - Likely exit path
    - IPO or large late-stage secondary
    - Strategic-sale logic is weaker for a multi-rail, partner-heavy platform.
  notes: Summary judgments are based on public information only and intentionally avoid false precision on terms, dilution, or segment margins.
