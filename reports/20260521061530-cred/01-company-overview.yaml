  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: Current board composition, independent director roster, investor board rights, and any documented succession plan for the founder-CEO.
    whyItMatters: A late-stage consumer fintech with lending exposure and IPO ambitions should disclose stronger governance evidence than is publicly visible today.
    diligencePath: Request the latest board deck, cap table governance matrix, and shareholder agreement summary in the data room.
    relatedQuestionRefs:
    - QO010
    - QO013
    - QO025
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: A clean reconciliation of total capital raised by round, split between primary and secondary, including secondary liquidity and current preference stack.
    whyItMatters: The valuation reset matters differently if the company also has heavy preference overhang or large undisclosed secondary transfers.
    diligencePath: Request cap-table history, share-class schedule, and every financing board resolution from 2018 through 2025.
    relatedQuestionRefs:
    - QO002
    - QO011
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current, consolidated employee headcount with geography or function breakdown.
    whyItMatters: Headcount is a core maturity signal and helps assess fixed-cost leverage, compliance staffing, and pre-IPO readiness.
    diligencePath: Ask management for the latest HR MIS, org chart, and employee count by function and legal entity.
    relatedQuestionRefs:
    - QO003
    - QO018
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: member-definitions
    missingEvidence: A metric dictionary reconciling total members, active members, monthly transacting users, and affluent Indians cited in marketing and regulatory communications.
    whyItMatters: Confusing user definitions can overstate traction and distort valuation or cross-sell assumptions.
    diligencePath: Request monthly cohort definitions and the exact metric glossary used in investor updates and regulator-facing statements.
    relatedQuestionRefs:
    - QO003
    - QO023
    relatedTableRefs:
    - TO001
  - type: stale
    severity: material
    topic: ipo-readiness
    missingEvidence: Any formal IPO preparation timeline, appointed bankers, audit readiness memo, or filed draft documents.
    whyItMatters: The valuation reset is partly justified by IPO readiness, so the absence of concrete filings or preparation artefacts lowers confidence in timing.
    diligencePath: Request IPO readiness workstreams, advisor mandates, and an updated listing timeline from management.
    relatedQuestionRefs:
    - QO006
    - QO025
    relatedTableRefs:
    - TO004
