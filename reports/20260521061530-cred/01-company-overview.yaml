callouts:
- calloutType: strength
  title: Regulatory maturation is real
  body: The March 2026 PA licence, combined with prior PPI, NPCI, SEBI, and IRDAI-linked permissions, is the strongest evidence that CRED has moved beyond a thin reward layer into more regulated financial infrastructure.
  claimRefs:
  - CO026
  - CO027
  - CO039
- calloutType: insight
  title: The affluent wedge still matters
  body: CRED's identity is not just marketing. The premium, creditworthy member filter is what makes its rewards economics, Garage adjacency, and wealth/lending cross-sell plausible in the first place.
  claimRefs:
  - CO003
  - CO028
  - CO049
- calloutType: risk
  title: Valuation narrative now needs proof
  body: The 2025 down round means future diligence should assume the market wants audited evidence of durable earnings, governance maturity, and listing readiness—not just growth or brand cachet.
