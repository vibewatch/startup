      - number: '2.3'
        title: Buyer Segments & Adoption Path
        blocks:
          - type: paragraph
            body: >-
              CRED is not a single-sided payments product. At the user layer, its core customer is a prime cardholder
              who values reminders, rewards, status, and credit-score maintenance. At the monetisation layer, issuers,
              lenders, insurers, and brands buy access to that user base or to the underlying payment flow. That is why
              the relevant buyer-user-payer map includes both affluent consumers and financial/distribution partners.
              IMARC's score-band data, CRED's 750+ gate, and CRED's 15 million+ FY25 payment-user claim all point toward
              the same conclusion: the most relevant user is not the average Indian UPI payer but the high-score
              cardholder with enough wallet share to justify a dedicated app.

              The substitute set is also broader than other credit-card bill-pay apps. CheQ is the closest feature-level
              analogue, but PhonePe and Paytm can absorb routine bill-pay behavior inside mass-scale super-apps; OneCard
              and SBI Card attack the premium-card segment from the issuer side; and slice, Jupiter, and Fi show how
              adjacent money apps increasingly bundle UPI, rewards, savings, loans, and cards in one surface. In other
              words, CRED competes both for a specific workflow and for attention from affluent digital-finance users.
              That makes adoption less a pure payments problem and more a habit-formation and cross-sell problem.
