            body: >-
              The payments operating model is visibly regulated and partner-mediated rather than free-form. CRED's own
              UPI FAQ explicitly frames the company as a TPAP participant that operates through a PSP bank, inherits
              data-localisation and audit duties, and must support structured grievance escalation. The same first-party
              material, combined with the CRED Pay page, shows where product differentiation sits: alias UPI IDs that
              hide sensitive details from merchants, a consumer-facing payment safety-net promise, and app-level
              experience design layered over bank- and NPCI-governed rails. Tap to Pay adds another partner-dependent
              layer, because its security and UX claims rely on Google HCE, issuer support, and NFC-enabled Android
              devices.


              Merchant-side expansion is the other major operating-model shift. October 2024 reporting showed wallet,
              merchant rewards, and Visa-linked device tokenisation; March 2026 regulatory and press evidence showed
              payment-aggregator approval, which moves CRED closer to direct merchant onboarding, collection,
              settlement, and refund responsibility. That is meaningful because it expands control over payment flows
              without turning CRED into a balance-sheet bank. It also raises the diligence bar: merchant count, refund
              ageing, settlement SLA performance, and reserve practices remain mostly absent from the public pack even
              though the permissions stack is now clearly broader.
