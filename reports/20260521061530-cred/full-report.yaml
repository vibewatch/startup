      - number: '1.2'
        title: Founder, Leadership & Governance
        blocks:
          - type: paragraph
            body: >-
              CRED is still overwhelmingly identified with founder-chief executive Kunal Shah. That is partly positive:
              Shah previously built and exited FreeCharge, giving him real payments-market pattern recognition,
              credibility with late-stage investors, and a public brand that resonates with Indian startup and fintech
              audiences. It is also a concentration risk. The reviewed source set shows Shah as the central public
              spokesperson on strategy, capital raising, and product direction, while current public disclosure on
              broader board composition and succession planning remains limited for a company of this scale and
              regulatory complexity.


              Publicly verifiable non-founder leadership is sparse. Product launches and platform extensions frequently
              quote Akshay Aedula from product and growth roles, while grievance handling and regulated complaints are
              routed through named officers rather than a visibly disclosed executive bench. That leaves a governance
              asymmetry: CRED has accumulated serious licenses and security certifications, yet still discloses much
              less about internal leadership coverage and board oversight than a public-market-ready fintech likely
              would. In diligence terms, the company looks operationally maturing faster than its governance
              transparency surface.
            claimRefs:
