          messaging on card page
        - Savings UPI loans rewards and partner-bank account stack
        - Full realized fees depend on tier minimum-balance and product choice
        - Adjacent apps can bundle multiple monetization pools into one front end
      - - slice
        - Instant cashback and 5.25 percent savings-yield messaging with UPI credit card
        - Payments savings and money-management bundle
        - Retrieved page does not show standardized card-fee schedule
        - Adjacents can compete by blending yield cashback and credit
      - - PhonePe / Paytm / MobiKwik
        - Broad payment utility and promotional surfaces rather than one stable card-bill-pay fee sheet
        - UPI bill pay merchant payments lending or wallet adjacencies
        - Retrieved pages do not disclose one comparable consumer pricing model for card-bill-pay users
        - Super-apps compete more on habit and reach than on transparent premium pricing
      - - Issuer apps
        - Rewards and fee economics vary card by card with wide catalogs and co-brands
        - Direct application servicing bill pay and issuer-specific rewards
        - No single issuer-platform price comparable to CRED overlay economics
        - Incumbents can segment users by card rather than one app-wide offer
      - - BankBazaar / Paisabazaar
        - Comparison marketplace rather than a closed-loop rewards model
        - Cross-issuer card discovery compare-and-apply workflow
        - Marketplace monetization and ranking incentives not disclosed here
        - These players pressure acquisition and card-choice economics rather than bill-pay ARPU directly
