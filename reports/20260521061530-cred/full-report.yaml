  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / sign
      - Transmission to thesis
      - Monitor in public sources
      - Action implication
    rows:
      - - FY26 growth disappoints
        - Revenue growth drifts to low single digits or turns negative
        - Breaks the operating-improvement narrative behind the 2025 reset
        - Future results, press statements, and any IPO filing
        - Move from track to avoid unless valuation resets
      - - Credit or DLG quality degrades
        - Invoked DLG or loss curves show materially worse economics than implied
        - Destroys confidence in lending-led upside and raises downside risk
        - Lender packs, regulatory disclosures, or future company filings
        - Re-underwrite using bear-case multiple
      - - Partner concentration tightens
        - Major lender, PSP, or insurer exits or reprices economics
        - Reveals platform dependence rather than platform power
        - Official disclosures, lender announcements, or revised partner lists
        - Assume lower growth and lower multiple
      - - Regulatory burden increases
        - New RBI, NPCI, or conduct pressure raises compliance cost or constrains products
        - Reduces IPO-quality multiple and can force strategic retrenchment
        - RBI directions, exchange filings, and company disclosures
        - Cut valuation range toward boundary comps
      - - IPO process slips
        - No visible disclosure roadmap or another internal round before IPO prep is clear
        - Turns the current mark into a long-duration private price rather than an exitable near-term mark
        - IR-style disclosures, bankers, governance hires, or future media confirmation
        - Demand larger discount or wait
    notes: >-
      These are practical kill criteria rather than exhaustive risks; each trigger matters because the current mark
      already assumes a reasonable path to better disclosure and execution.
    claimRefs:
      - CV004
      - CV013
      - CV016
      - CV039
      - CV043
      - CV046
      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
      - Blocking?
    rows:
      - - Audited FY25 and FY26 YTD financials
        - Audited statements plus monthly MIS by product line
        - Needed to test whether the FY25 improvement is durable and repeatable
        - Finance data room, board packs, auditor bridge
        - 'Yes'
      - - Segment mix and take rates
        - Payments, lending, insurance, wealth, and other monetisation splits with realised take rates
        - Without this, the current multiple cannot be mapped to a business model
        - Product P&Ls, cohort reports, pricing dashboards
        - 'Yes'
      - - Credit losses and DLG performance
        - Vintage losses, recoveries, invoked DLG, and lender-by-lender exposure
        - Lending upside is impossible to trust without realised credit evidence
        - Risk dashboards, lender packs, DLG contracts
        - 'Yes'
      - - Cap table and round terms
        - Liquidation preferences, dilution, primary-secondary split, and investor protections
        - Headline valuation is not enough to assess downside or return sharing
        - Legal docs, cap table, financing summary memo
        - 'Yes'
      - - Partner concentration and conduct metrics
        - Top partners by revenue, AUM, throughput, complaint, and collections performance
        - CRED is partner-heavy and operationally complex
        - Partner scorecards, compliance metrics, complaint logs
        - Important
      - - IPO readiness package
        - Audit readiness, governance uplift, underwriter conversations, and public-company controls
        - The base case works best if 2025 really was an IPO-normalisation round
        - Banker materials, governance workstream plan, reporting roadmap
        - Important
    notes: >-
      Every item listed here is directly tied to why the current public file is insufficient to support a clear buy call
      at the present private valuation.
    claimRefs:
