      - number: '3.4'
        title: Adverse Evidence & Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse evidence is that the sector is moving toward heavier regulation, more standardized
              rails, and harsher capital-market scrutiny. The Times of India reported that credit-card bill payments
              moved into BBPS routing, which improves trust and grievance handling but also reduces the scope for
              backend differentiation by third-party overlays. Business Standard's May 2026 fintech-reset piece says
              public-market investors are now prioritizing cash flow, governance, compliance credibility, and ROE over
              GMV or user-growth narratives, while Economic Times says listed fintechs including MobiKwik and Paytm are
              collecting multiple licences because regulators increasingly prefer full-fledged regulated entities. That
              is adverse for any player whose product can be copied faster than its economics can compound.

              Fi's March 2026 transition is the most concrete partner-dependence warning in the set: new savings
              accounts could no longer be opened in the Fi app, users were pushed to Federal Bank's app, and Fi-Points
              accrual ended. CRED is not a neobank clone, but the lesson is transferable. A polished UX layer does not
              necessarily own the customer if the bank, card issuer, or payment rail remains the regulated anchor. RuPay
              credit-card-on-UPI expansion adds a second adverse vector because it broadens everyday credit acceptance
              for mass apps and merchant networks, not just for specialist overlays. The resulting moat view is
              cautious: CRED still has a differentiated premium brand and strong trust signals, but commoditization risk
              is high unless it can keep affluent engagement, partner monetization, and regulatory credibility ahead of
              ecosystems that already own either distribution or the core economics.
