      - number: '1.3'
        title: Funding History & Capital Context
        blocks:
          - type: paragraph
            body: >-
              CRED's financing arc explains both its strategic ambition and its current scrutiny. The company launched
              with a very large seed-style backing round in 2018, accelerated to an $800 million valuation by late 2020,
              crossed $2.2 billion in April 2021, reached roughly $4.0 billion in October 2021, and touched $6.4 billion
              in 2022 with GIC leading the round. That path gave CRED one of the richest valuation curves in Indian
              consumer fintech, supported by strong investor appetite for high-quality fintech distribution and
              affluent-user engagement.


              The narrative changed in 2025. CRED still raised fresh capital, but it did so at $3.5 billion, roughly 45%
              below the 2022 mark. Importantly, this was not a rescue financing by unknown investors; it was led by
              GIC/Lathe with participation from known insiders, suggesting continued support but at a valuation reset
              more consistent with public-market discipline. ET tied the markdown to IPO preparation over the next two
              years. That makes the overview judgment nuanced rather than binary: the company retains access to capital
              and premium investors, but public evidence now says the market is prioritising monetisation, governance,
              and listing readiness over narrative alone.
