      - number: '3.3'
        title: Switching Costs & Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              CRED's switching costs are real but softer than a bank's or a super-app's. Users do not lose the
              underlying credit line when they leave CRED because the card relationship still sits with the issuer, and
              BBPS-standardized repayment rails make the bill-pay plumbing more portable across apps. That makes
              multi-homing structurally easy: an affluent user can keep the same HDFC or SBI card, compare another
              issuer offer on Paisabazaar, and pay through CRED, CheQ, PhonePe, or the issuer app depending on reward
              timing, settlement urgency, or offer visibility. In that sense, the category behaves more like a contest
              for habit and wallet share than a closed network.

              But switching costs are not zero. CRED still benefits when reminders, credit-score refreshes, reward
              history, premium-brand identity, partner offers, and adjacent financial products are all concentrated in
              one experience. Direct users with multiple cards may keep more than one app installed, yet usage can still
              cluster around whichever app feels fastest, most rewarding, or most trusted for due-date payments. The
              competitive problem is that larger players can subsidize this convenience from other pools: issuers own
              interchange and revolving economics, PhonePe and Paytm can monetize broad payment frequency and merchant
              services, and adjacent money apps can blend lending or savings economics into acquisition. That makes
              CRED's moat more behavioral than infrastructural.
            claimRefs:
              - CP022
              - CP030
              - CP036
              - CP037
              - CP038
              - CP039
