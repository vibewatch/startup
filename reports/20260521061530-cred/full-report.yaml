  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmented Customer Base
        blocks:
          - type: paragraph
            body: >-
              CRED's customer base is deliberately segmented from the top down. The official site, about page, and
              app-store copy all anchor membership on high creditworthiness, with the public threshold expressed as a
              750+ credit score or equivalent premium-credit profile. That makes the core user different from a mass
              open-access UPI wallet: the company is not trying to win every payments user in India, but rather affluent
              cardholders who want one control panel for bills, score tracking, rewards, and adjacent financial
              products. This selective gate matters because it explains both CRED's brand positioning and its
              concentration risk: the company is strongest where premium credit-card behaviour is already dense.


              Within that selective wedge, the public evidence supports at least five meaningful customer cohorts. First
              is the affluent or high-score cardholder who joins for card-bill payments and score management. Second is
              the multi-product active member who has expanded from bill pay into two or more adjacent products; FY25
              reporting says nearly 45% of active members use three or more products. Third is the vehicle-owner cohort
              that now interacts with Garage for reminders, insurance, and resale flows. Fourth is the whitelisted CBDC
              beta cohort using the e₹ wallet under video-KYC and balance limits. Fifth is the mass app-store audience:
              even though membership is selective, CRED still shows 50M+ Google Play downloads, nearly 3 million Play
              reviews, and over 593,000 App Store ratings.


              The critical caveat is that CRED's top-line customer count is definition-sensitive. The homepage says over
              25 million creditworthy members, app stores say 1.4Cr+ members, October 2024 reporting pegs the
              member-and-merchant user base at 14 million, and March 2026 PA coverage cites more than 15 million users.
              Those figures should be preserved as conflicting public surfaces rather than collapsed into one neat
              number.
