            body: >-
              For a public-only diligence pass, the cleanest anchor is to compare CRED's June 2025 mark with listed
              Indian fintechs using official filings plus live exchange quotes. On that basis, CRED's implied trailing
              multiple of roughly 10.9-11.1x sits near Paytm's roughly 10.7x market-cap-to-FY25-revenue and below PB
