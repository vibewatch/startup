      - number: '6.2'
        title: Adoption Trajectory & Cross-sell Depth
        blocks:
          - type: paragraph
            body: >-
              The best-supported adoption trajectory comes from FY24 and FY25 operating disclosures rather than from the
              conflicting headline member counts. The FY24 pack reported 11.5 million monthly transacting users and 13
              million monthly active users, alongside a 58% increase in monetised users and a 40% reduction in
              customer-acquisition cost. FY25 reporting then moved monthly transacting users to 12.6 million and
              transaction frequency to 14.4 transactions per user per month. That pattern matters more than the static
              member headline because it suggests repeated usage at the payment core rather than a large but dormant
              install base.


              Cross-sell depth is visible, though still unevenly disclosed. Economic Times coverage says nearly 45% of
              active members use three or more products, which is unusually strong evidence that CRED is not just a
              one-shot rewards app. The clearest adjacency is Garage: rollout to all members began in September 2023;
              ETBFSI later cited more than 60 lakh vehicles on the platform as of September 2024; and Hindu BusinessLine
              reported 1.1 crore vehicles plus over 10 lakh insured vehicles by July 2025. Public launch coverage also
              shows named wallet merchant brands such as Swiggy, BookMyShow, and Urban Company, which supports real
              production deployment rather than a slideware merchant story.


              Newer adjacencies are real but should be described carefully. The e₹ wallet was clearly still beta and
              whitelisted in early 2025, with video KYC and transaction limits. Kuvera adds evidence that CRED wants
              wealth-management expansion beyond payments. PA approval could widen the payer and merchant surface
              further. But public disclosure is still far richer on payment throughput, Garage adoption, and wallet
