            body: >-
              CRED's best public technical evidence is concentrated in trust and compliance disclosures rather than
              engineering deep dives. The security page is unusually concrete for a consumer fintech marketing surface:
              AWS Virtual Private Cloud, firewall and WAF layers, DDoS protection, CDN, three-tier segmentation,
