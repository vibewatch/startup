chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & Operating Model
        blocks:
          - type: paragraph
            body: >-
              CRED is a Bengaluru-headquartered Indian consumer fintech founded in 2018 by Kunal Shah. Its original
              wedge was narrow but valuable: help high-creditworthiness consumers pay credit card bills on time, reward
              them for that behaviour, and use the resulting trust signal to build a premium commerce and
              financial-services ecosystem. The product is explicitly not positioned as a mass-market payments utility.
              Both the homepage and the about page describe a members-only club for the creditworthy, and the company
              continues to gate access on a high credit-score requirement, with a 750-plus threshold repeatedly cited in
              launch-era and current materials.


              The current operating model is much broader than the original bill-pay product. CRED now combines card and
              bill management, UPI payments, rewards, wallet preload, lending, peer-to-peer investing, travel, wealth,
              and vehicle services in one interface. The strategic pattern is consistent across sources: the company
              starts with a trusted affluent member base, inserts itself into high-frequency payment flows, and then
              monetises that relationship through adjacent financial products and premium partner experiences. Public
              disclosures also show that this is no longer a lightweight affiliate model; CRED now sits on licensed
              payment, insurance, advisory, and lending-related rails that are material to the business.
            claimRefs:
              - CO001
              - CO002
              - CO003
