        - Recharge bill-pay wallet and lending-adjacent users
        - Broad utility and public-market benchmark value
        - Retrieved public surface is thin on differentiated card-management proof
      - - slice
        - Adjacent money app
        - Bank-style positioning and UPI credit card bundle
        - Younger digital-first money app users
        - Combines UPI credit savings cashback and money management
        - Not centered on premium multi-card bill-pay identity
      - - Jupiter
        - Adjacent money app
        - 3M+ smart earners and 30 lakh+ Indians
        - Salary account savings and rewards-oriented users
        - Rewards plus savings loans UPI and explicit regulated-partner architecture
        - Still partner-dependent rather than a licensed bank
      - - Fi
        - Adverse adjacent precedent
        - Transitioning users away from Fi app banking in March 2026
        - Existing neobank-style users
        - Previously bundled savings rewards and card layer
        - Partner transition shows discontinuity risk for app-layer ownership
