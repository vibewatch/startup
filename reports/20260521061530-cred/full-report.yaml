              not provide architecture diagrams or certification numbers.


              Compliance breadth is also important because it maps directly to product scope. CRED publicly claims PCI
              DSS v4.0.1 Level 1, ISO 27001:2022, ISO 27701:2019, tokenisation compliance, UPI compliance, and India
