      - number: '2.4'
        title: Growth Drivers, Constraints & Market Structure
        blocks:
          - type: paragraph
            body: >-
              The strongest market-growth drivers are straightforward. Card usage is still compounding even while UPI
              dominates retail volume; rewards, co-brands, EMI use cases, fintech onboarding, and wider merchant
              acceptance continue to pull more spend onto credit; and RuPay-on-UPI materially expands where credit can
              be used. This is why the chapter should not read as UPI killed cards. The better reading is that India
              remains a UPI-led system in which the credit layer can still expand by taking share from debit, by moving
              into QR-led acceptance, and by bundling premium rewards and financial-management features around
              cardholders.

              The constraints are equally important. BBPS can increase trust and standardisation while commoditising
              backend bill-pay rails. Regulatory tightening is forcing fintechs to become licensed, better-capitalised,
              and more compliant, which raises fixed costs and narrows the room for lightly differentiated growth hacks.
              Public-market reporting on the broader fintech sector now says valuation premia depend less on user growth
              and more on free cash flow, ROE, and compliance credibility. Distribution is another structural
              constraint: PhonePe, Paytm, and other broad apps already own daily payment habit. CRED therefore benefits
              from a growing category, but its moat depends on whether premium users keep choosing a specialist
              card-management surface after the rails themselves become more open and more standardised.
