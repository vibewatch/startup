        - Daily-use UPI habit merchant reach credit card payment and co-branded cards
        - Not positioned as a premium card-management brand
      - - Paytm
        - Substitute ecosystem
        - Public company with annual report and IR disclosures
        - General digital-payments and merchant ecosystem users
        - Broad payment utility plus public-company disclosure and merchant orientation
        - Premium credit-user curation is weaker than CRED
      - - MobiKwik
        - Substitute ecosystem
