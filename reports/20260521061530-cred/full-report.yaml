      - number: '8.4'
        title: Final Diligence Asks & Call
        blocks:
          - type: paragraph
            body: >-
              The bottom line is a price-sensitive and evidence-sensitive call: track or research-more, with medium
              confidence and a high risk rating. The improving FY24-FY25 arc is real, the 2025 reset already removed the
              most egregious excess of the 2022 peak, and there is a coherent bull case if CRED is genuinely marching
              toward IPO-quality disclosure. But public-only evidence is still too incomplete to call the proposition
              attractive. Investors can see scale, partner breadth, and a narrowing operating-loss line; they still
              cannot see the core underwriting details that determine whether the next turn of monetisation belongs to
              shareholders or to counterparties.


              What would move the view is not another headline product launch. The needed package is explicit: audited
              FY25 and FY26 YTD financials, segment mix, take-rate math, credit-loss and DLG performance, partner
              concentration, round-term clarity, and visible IPO workstreams. If those materials prove that CRED's
              premium user base monetises materially better than mass-market peers and that downside protections are not
              overly punitive, the current mark could later look fair or even mildly conservative. Without that package,
              the prudent posture is to preserve unresolved gaps rather than hide them. CRED may still become an
              investable late-stage fintech entry, but the public file today supports discipline more than enthusiasm.
            claimRefs:
