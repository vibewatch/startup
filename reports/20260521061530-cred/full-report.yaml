      - number: '2.2'
        title: Sizing Lenses & Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              The market can be sized only by preserving multiple lenses. RBI's Payment Systems Report is the best
              outer-system benchmark: digital payments grew 38x in volume and more than 3x in value over the decade
              ending 2024, and UPI captured 85% of H1 2025 payment volume. DigiDhan's dashboard likewise shows 23,834
              crore digital transactions in FY25 and 1,830.151 crore UPI transactions in March 2025 alone. Those numbers
              matter because they explain the scale of the rail CRED rides on; they do not by themselves describe the
              monetisable market for a specialist credit app.

              Inside that broader system, the card layer is growing fast enough to matter. ET, citing RBI data, said
              2025 credit-card transaction volume reached 570 crore and value hit Rs 23.2 lakh crore, even as debit-card
              usage fell. PwC projects continued strength through FY30, but analyst-market-data providers disagree
              materially on what the credit card market itself means. 6Wresearch gives an 11.7% CAGR for 2026-2032,
              while IMARC frames the market as USD 20.1 billion in 2025 growing to USD 39.5 billion by 2034 at 7.49%
              CAGR. Those are not arithmetic inputs to average together. They likely mix transaction activity, issuer
              economics, and ecosystem value over different time windows. For diligence purposes, the contradiction is
              the point: market-growth optimism is real, but precise TAM claims remain highly definition-sensitive.
            claimRefs:
