  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary & Realistic SAM
        blocks:
          - type: paragraph
            body: >-
              India's payments market is enormous, but that outer envelope is not CRED's market. RBI, DigiDhan, and PwC
              all describe a country-scale digital-payments system dominated by UPI and small-ticket retail behavior.
              CRED's own official proposition is much narrower: a members-only app for creditworthy people, with a 750+
              score threshold, support for major issuers, and rewards tied to card-bill behavior. The included market
              therefore starts with credit-card bill payments, credit management, and adjacent monetisable financial
              behavior from prime users; it excludes most cash usage, much of everyday debit substitution, and a large
              share of low-ticket UPI activity that has little reason to migrate into a premium third-party overlay.

              A realistic SAM sits inside the Indian card economy, not inside all Indian payments. RBI counted 111.197
              million outstanding credit cards at end-June 2025, IMARC says the 701-850 score band held 51.2% of the
              card market in 2025, and Business Standard reported that CRED handled more than Rs 8.5 trillion of FY25
              payment volume from 15 million+ users. Those figures do not map perfectly to one another, but together
              they define the right nested lens: large digital-payments TAM outside, card-linked prime-user SAM inside,
              and CRED's voluntary app-based SOM inside that. The recurring diligence mistake would be to call all
              Indian digital payments CRED's TAM simply because CRED can technically sit on payment rails.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM037
