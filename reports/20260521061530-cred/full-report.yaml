            body: >-
              CRED's financial-model risk is not only about whether growth continues; it is about how much of the
              economics depend on partner balance sheets, opaque DLG exposure, and lines of business that are not
              publicly segmented. Public reporting supports real scale: FY25 revenue of ₹2,735 crore, very large payment
              throughput, and narrowing operating losses. It also supports ongoing fragility: large total losses
              persisted through FY25, more than ninety percent of revenue was still said to come from payments, lending,
              and insurance in late 2024, and the June 2025 fundraise reset valuation down to about $3.5 billion.


              The bigger risk is that the public record remains too thin for clean underwriting. There is no public
              segment mix that reconciles payments, lending, insurance, wealth, and other adjacencies; no disclosed DLG
