      - number: '3.2'
        title: Capability, Pricing, Distribution & Trust
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is strongest where the user wants one place to manage multiple cards, pay dues, track
              credit, and extract rewards. CheQ is the cleanest direct competitor on that axis because its official
              surface combines 1% bill-pay rewards, utility bills, wallet functionality, dashboard tools, instant cash,
              and loan-against-mutual- funds. OneCard competes on a different but adjacent proposition: no joining fee,
              no annual fee, app-native control, and 5x rewards on top categories make it a strong alternative for
              premium card users who prefer to consolidate value in the issuer product rather than in a third-party
              overlay. CRED's own public homepage is intentionally premium but comparatively vague on standardized
              reward economics, which is strategically elegant for brand positioning but less transparent for diligence.

              Distribution and trust are where substitute ecosystems start to overpower direct peers. PhonePe's official
              site says one in three Indians uses the app, that it serves 65+ crore registered users and 4.7+ crore
              merchants, and that it already supports credit-card payment, RuPay credit card on UPI, co-branded cards,
              and merchant payments. Paytm's consumer surface and annual-report stack show a similarly broad payments
              ecosystem plus public-company disclosure. CRED has strengthened its trust posture with final RBI
              payment-aggregator approval, but the comparison now matters at system level: users can get payment utility
              inside giant apps, issuer apps, or partner-backed neobanks, so CRED must win on premium experience and
              cross-sell quality rather than on access to rails alone. Pricing evidence is strongest for CheQ, OneCard,
              Jupiter, and issuer card pages; it is noticeably weaker for realized economics at CRED, Paytm, PhonePe,
              and MobiKwik, which is why the chapter preserves explicit gaps instead of inventing fee parity.
