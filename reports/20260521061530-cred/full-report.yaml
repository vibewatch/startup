        title: Regulatory, Legal & Conduct Risk
        blocks:
          - type: paragraph
            body: >-
              CRED's risk profile is shaped less by one binary licence question than by overlapping rulebooks. The
              retained public pack shows direct or mediated exposure to RBI digital-lending directions, UPI and NPCI
              TPAP rules, payment-aggregator obligations, IRDAI distribution constraints, and lender-level grievance and
              data-sharing duties. That complexity is manageable only if compliance, controls, and partner governance
              scale with product breadth. The positive read-through is that no major public enforcement action
              specifically against CRED surfaced in the reviewed materials, and the March 2026 PA approval suggests the
              company has cleared at least one key permission hurdle.


              But approval is not de-risking. Once CRED directly manages merchant onboarding, settlement, refunds, and
              payment-failure promises at scale, regulatory mistakes become operating failures visible to users,
              merchants, partners, and supervisors. The most acute legal and conduct issues are DLG opacity, outsourced
              collections behaviour, insurance-pricing explainability, privacy and third-party data sharing, and the
              burden of keeping multiple grievance ladders working across CRED, banks, NBFCs, and NPCI. Public
              disclosures show real mitigation effort, yet they also prove how many regulated touchpoints now sit inside
              the product shell.
