    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market / brand
        - >-
          Premium user positioning and broad financial-product surface can support higher monetisation quality than
          mass-market peers.
        - Premium-brand strength does not by itself prove durable take rates or repeat economics.
        - Show cohort retention, monetised-user depth, and product-level contribution margins.
      - - Operating trajectory
        - FY24-FY25 revenue growth with narrowing operating losses suggests discipline is improving.
        - >-
          Net losses remain large and public evidence cannot separate structural leverage from accounting or mix
          effects.
        - Provide audited FY25-FY26 bridge from revenue to contribution and net profit.
      - - Comp positioning
        - Current pricing can be argued off Paytm/PB-style quality comps rather than low-multiple boundary names.
        - Those higher-multiple peers are public, more disclosed, and in PB's case profitable.
        - Close the disclosure gap and prove CRED belongs in that premium bucket.
      - - Product breadth
        - Payments, lending, insurance, wealth, and vehicle workflows create multiple monetisation paths.
        - Product sprawl can hide weak unit economics and increase partner and compliance complexity.
        - Show which products earn attractive returns after support, risk, and partner costs.
      - - Financing reset
        - The 2025 markdown already removed much of the 2022 excess and reset expectations closer to IPO logic.
        - A reset does not make the current mark automatically attractive if another derating is still possible.
        - Demonstrate FY26 growth durability and IPO readiness before expecting rerating.
      - - Disclosure quality
        - Official disclosures now acknowledge partner lists, DLG exposure, and payment permissions.
        - The most decision-useful data still remain private, including round terms, losses, and segment economics.
        - Open the data room on round terms, credit losses, and segment reporting.
    notes: >-
      The valuation call hinges less on whether CRED is a good company and more on whether current price, disclosure,
      and risk are aligned.
