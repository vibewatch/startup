      - number: '1.4'
        title: Scale, Products & Regulatory Milestones
        blocks:
          - type: paragraph
            body: >-
              The strongest company-overview evidence is that CRED has translated premium-brand engagement into real
              transaction scale. FY24 revenue reached Rs 2,473 crore and FY25 revenue reached Rs 2,735 crore, while
              operating losses narrowed sharply across both years. Payment scale exceeded Rs 8.5 lakh crore in FY25, and
              public materials suggest CRED now plays a meaningful role in India's credit-card bill-pay category. The
              platform's monetisation mix has also changed substantially: independent reporting says more than 90% of
              revenue now comes from payments, lending, and insurance rather than rewards-led commerce alone.


              Product and regulatory milestones reinforce that maturation. CRED acquired Kuvera to deepen wealth
              management, launched wallet and tokenised checkout features, expanded Garage into insurance and car
              resale, piloted an e₹ wallet with RBI and YES BANK, and finally secured payment-aggregator authorisation
              in March 2026. Official legal disclosures simultaneously show a broad lender network and live
              default-loss-guarantee exposure, confirming that CRED is no longer simply a reward layer on top of cards.
              It is becoming a fuller-stack regulated consumer-finance platform, with all the opportunity and risk that
              implies.
