      - number: '1.5'
        title: Adverse Signals & Open Questions
        blocks:
          - type: paragraph
            body: >-
              The company-overview layer is directionally positive, but it is not clean. The clearest adverse signal is
              the 2025 down round: despite stronger revenue and lower operating loss, investors still marked CRED down
              from $6.4 billion to $3.5 billion. That suggests the market is discounting one or more of the following:
              monetisation durability, governance opacity, consumer-fintech risk appetite, or the uncertainty of
              converting a premium user brand into public-market quality earnings. Public governance disclosure is also
              comparatively thin for a company with payment, lending, insurance, and wealth adjacencies.


              A second unresolved issue is definitional clarity around users. The homepage claimed over 25 million
              creditworthy members at access date, while the March 2026 payments press release cited 1.5 crore affluent
              Indians and FY25 operating materials pointed to 12.6 million monthly transacting users. These numbers are
              not necessarily inconsistent, but they are not clearly reconciled either. Finally, public sources still do
              not disclose a current consolidated headcount or provide formal IPO artefacts. Those omissions do not
              break the thesis, but they lower confidence in any simplistic “premium super-app” narrative.
            claimRefs:
