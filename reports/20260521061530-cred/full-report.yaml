  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis & Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is straightforward but conditional. CRED has built a premium-member consumer-fintech
              brand on top of real payment and lending scale, and the public arc from FY24 to FY25 points to better
              monetisation and operating discipline rather than simple vanity growth. FY25 revenue reached about ₹2,735
              crore, operating losses narrowed sharply, payment volume hit about ₹8.5 lakh crore, and lending AUM
              reached about ₹22,000 crore. The product footprint also expanded beyond one flagship habit into merchant
              pay, secured lending, insurance, wealth, and vehicle surfaces. That breadth matters because it makes the
              2025 down round look less like business-model failure and more like a repricing from 2022 exuberance
              toward an IPO-prep baseline.


              The anti-thesis is just as important. Even after the down round, the implied trailing multiple is still
              around 11x FY25 revenue, which places CRED much closer to Paytm and PB Fintech than to smaller Indian
              fintechs such as MobiKwik, Zaggle, or Fino. Yet CRED does not provide anything close to Paytm or PB
              Fintech disclosure depth. Investors still do not have audited FY25 statements, segment mix, take rates,
              CAC, credit-loss curves, DLG invocation data, or round-term detail. Official disclosures also show a large
              partner and collections footprint plus more than ₹5,364 crore of disclosed DLG-covered AUM across
              anonymised portfolios. That combination means the business may be improving, but the valuation still asks
              investors to pay for quality that is only partially proven in public.
