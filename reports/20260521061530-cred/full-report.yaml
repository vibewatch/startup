  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Analogues vs Substitute Ecosystems
        blocks:
          - type: paragraph
            body: >-
              CRED's competitive set is not one neat leaderboard because the buyer can solve the same job in several
              different ways. The direct analogue tier is narrow: CheQ overlaps most closely on multi-card bill payment,
              rewards, credit dashboard, and adjacent financial products, while OneCard competes for the same affluent
              and rewards-oriented user but from the card-issuer side rather than from a pure overlay. The incumbent
              tier is broader and more structurally important. SBI Card, HDFC Bank, ICICI Bank, and Axis Bank all market
              large card catalogs and direct issuer servicing, which means they own the underlying credit relationship,
              the repayment urgency, and much of the rewards economics that CRED only intermediates.

              The bigger strategic risk comes from substitute ecosystems, not just from direct clones. PhonePe, Paytm,
              and MobiKwik can absorb the same payment intent inside broader daily-use apps, while slice, Jupiter, and
              historically Fi show how adjacent money apps bundle UPI, savings, cards, loans, and rewards into a single
              surface. BankBazaar and Paisabazaar matter differently: they are not habit apps, but they influence card
              discovery and comparison before a user ever commits to a closed-loop loyalty or bill-pay workflow. The
              practical takeaway is that CRED is competing at three layers at once—direct feature overlap, substitute
              habit formation, and issuer-level product ownership.
