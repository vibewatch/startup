      - number: '6.4'
        title: Concentration & Customer Verdict
        blocks:
          - type: paragraph
            body: >-
              CRED's customer verdict is therefore positive on adoption quality but qualified on durability and breadth
              of proof. The company appears to have built a meaningfully scaled user franchise among creditworthy Indian
              cardholders, with recurring payment behaviour, high app-store engagement, real Garage adoption, and clear
              evidence of land-and-expand into insurance, wallet, and wealth surfaces. For a premium-gated fintech, that
              is substantial customer traction.


              The main risks sit in concentration and evidence blind spots rather than in an absence of users. The first
              concentration risk is segment selection: CRED is still tied to affluent, high-score cardholders, so it is
              narrower than an open-access mass UPI network even if downloads are large. The second is product
              concentration: ETBFSI says more than 90% of revenue still comes from payments, lending, and insurance,
              which means monetisation is concentrated in a few financial verticals even as the interface widens. The
              third is partner concentration: merchant expansion, insurers, sponsor banks, and resale flows all depend
              on third parties whose volumes and service levels are only partially public.


              Most importantly, the public record does not support a clean retention story. Customer-count labels
              conflict; merchant outcome data is sparse; and service-quality evidence is mixed. Investors can underwrite
              CRED as a selective but scaled consumer-fintech customer base with visible cross-sell, but should still
              ask management for reconciled member definitions, cohort retention, merchant-wallet MAU, insurer
              conversion, and ticket-resolution metrics before treating the franchise as fully durable.
