              disclosure, while PB is also profitable. CRED therefore arrives at a similar pricing zone without giving
              public investors similar underwriting visibility.


              The rest of the comp set is more cautionary than supportive. MobiKwik is a closer consumer wallet and
              credit-adjacency analogue, but it trades at only about 1.3x FY25 revenue. Zaggle and Fino trade even lower
              on a revenue basis, though both are imperfect because Zaggle is more B2B software-and-payments and Fino is
              a regulated transaction-bank model. These companies are best treated as boundary markers rather than
              direct comps, but they still show how much the Indian public market discounts fintech models that lack the
              scale or perceived quality premium of the top two names. The right read-through is that CRED deserves a
              blended comp framework, not a single hero comp: Paytm for scale and regulatory complexity, PB Fintech for
              distribution quality, MobiKwik for consumer-wallet adjacency, and Zaggle plus Fino as lower-multiple
