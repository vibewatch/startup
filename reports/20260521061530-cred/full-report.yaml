      - - OneCard
        - No joining fee no annual fee no rewards redemption fee and 5x rewards on top categories
        - App-controlled card EMI and digital onboarding
        - Actual interchange-funded economics not disclosed publicly
        - Strong issuer-led underpricing threat for affluent users
      - - Jupiter
        - >-
