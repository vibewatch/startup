figures:
  - id: FP001
    title: Evidence-backed ordinal competitive positioning
    type: quadrant
    summary: >-
      Crusoe scores highly on physical-stack integration and breadth of deployment form,
      while peers and substitutes retain advantages in scale, installed relationships, or specialization.
    data:
      xAxis:
        label: Physical-stack integration
        min: 1
        max: 5
      yAxis:
        label: Deployment-form breadth
        min: 1
        max: 5
      points:
        - label: Crusoe
          x: 5
          y: 5
          detail: Energy, manufacturing, hyperscale campuses, modular Spark, cloud, and managed inference.
        - label: CoreWeave
          x: 3
          y: 4
          detail: Scaled specialist cloud with storage and CPU adjacencies; energy integration not established here.
        - label: Lambda
          x: 2
          y: 3
          detail: Developer cloud and private GPU clusters; site and energy integration not established here.
        - label: Nebius
          x: 3
          y: 3
          detail: Full-stack AI infrastructure; modular edge and energy integration are unknown in assigned evidence.
        - label: Hyperscalers
          x: 4
          y: 5
          detail: Broad global service and deployment footprint, but not positioned around Crusoe's energy-first integration.
        - label: Modular incumbents
          x: 3
          y: 2
          detail: Established physical infrastructure and channels without a fully integrated managed AI cloud in this comparison.
    approximationNotes: >-
      Analyst-assigned ordinal scores from 1 (low) to 5 (high) synthesize documented scope;
      they are not market share, benchmark performance, or verified relative quality.
    claimRefs: [CP001, CP002, CP006, CP008, CP016]
callouts:
  - calloutType: strength
    title: Integration is the differentiator
    body: >-
      Crusoe's unusual combination of power development, manufacturing, campus construction,
      GPU cloud, and managed inference can compress handoffs that buyers otherwise coordinate
      across several vendors.
    claimRefs: [CP006, CP007, CP016]
  - calloutType: risk
    title: Category economics can overwhelm differentiation
    body: >-
      Falling GPU rental rates and alternative supply from hyperscalers, specialist clouds,
      modular vendors, and internal clusters make sustained pricing power unproven.
    claimRefs: [CP002, CP009, CP010, CP011, CP012]
