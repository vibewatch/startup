    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >-
        Current official rate cards, realized discounts, egress and support charges, service
        levels, and matched competitor quotations for identical hardware and commitment terms.
      whyItMatters: >-
        Category averages cannot establish Crusoe's customer total cost, pricing power, or margin.
      diligencePath: >-
        Obtain current Crusoe and competitor proposals for the same GPU cluster, utilization,
        region, duration, networking, storage, and support specification.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: >-
        Customer-level renewal, churn, workload migration, reserved-capacity termination,
        and multi-cloud usage data.
      whyItMatters: >-
        Product integration does not prove contractual or technical lock-in without observed retention.
      diligencePath: >-
        Review top-customer contracts and interview customers that renewed, reduced, and migrated workloads.
      relatedQuestionRefs: [QP005, QP009]
    - type: conflicting-data
      severity: material
      topic: energy-mix
      missingEvidence: >-
        Independently audited site-level electricity mix, emissions intensity, backup-runtime,
