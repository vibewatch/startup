    rows:
      - - Crusoe
        - Energy-first neocloud and data-center developer
        - "Reported 1.2 GW Abilene campus; four cloud regions; >$10B expected valuation after initial Series E close"
        - AI labs, enterprises, hyperscalers, sovereign and edge deployments
        - Integrated energy, manufacturing, campuses, cloud, and managed inference
        - Private pricing, utilization, contract concentration, and realized margins are undisclosed
      - - CoreWeave
        - Direct neocloud peer
        - "Independent sources place it ahead in disclosed capital and footprint; source vintages differ"
        - Large AI labs, hyperscalers, and enterprises
        - Large GPU fleet plus storage and CPU-cluster adjacencies
        - Capital intensity and price competition remain category risks
      - - Lambda
        - Direct neocloud peer
        - Nvidia-backed; no comparable current revenue disclosed in assigned evidence
        - Developers and enterprises
        - Developer experience, one-click clusters, and private-cloud GPU systems
        - Scale and contract depth are not quantified in assigned evidence
      - - Nebius
        - Direct neocloud peer
        - "$55.3M quarterly revenue reported by NetworkWorld; company target of $750M-$1B ARR is not revenue"
        - Enterprises and AI developers
        - Full-stack AI infrastructure and European footprint
        - Forecast ARR and current quarterly revenue are different metrics
      - - AWS, Azure, and Google Cloud
        - Incumbent hyperscalers
        - Global installed platforms and enterprise relationships
        - Existing enterprise cloud customers
        - Broad product, compliance, procurement, and management ecosystems
        - Higher aggregate GPU pricing in the cited Uptime comparison
      - - Vertiv, Schneider Electric, and Equinix
        - Modular and colocation incumbents
        - Long-standing modular offerings; no like-for-like scale in assigned evidence
        - Enterprises and data-center operators
        - Established physical-infrastructure products and channels
        - Not a full substitute for an integrated managed AI cloud
      - - Customer-owned dedicated cluster
        - Internal-build substitute
        - Scale depends on customer capital and operations
        - High-utilization enterprises and research organizations
        - Maximum control over hardware, data, and operating policy
        - Uptime analysis indicates a 66% utilization threshold to beat a neocloud in its scenario
    notes: >-
      Scale signals use different dates, units, and business models; funding raised is not cash
      available, valuation is not revenue, and the Nebius ARR target is not current revenue.
      Unknown or non-comparable fields are stated rather than estimated.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP008, CP010]
