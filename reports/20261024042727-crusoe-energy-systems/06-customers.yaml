company:
  name: Crusoe Energy Systems
chapter:
  number: 6
  title: Customers
  summary: Crusoe's public customer evidence spans AI-cloud users, strategic infrastructure customers, and energy/data-center partners, but the record is much stronger on named relationships and contracted or planned capacity than on realized revenue, retention, or concentration. The customer thesis is therefore promising but still dependent on conversion from announced capacity and bookings into durable, disclosed production usage.
sections:
  - id: buyer-segments
    title: Buyer and user segmentation
    body: >-
      Crusoe serves several distinct customer groups rather than a single homogeneous buyer. AI developers and enterprises use Crusoe Cloud for GPU training, inference, storage, and networking; TechStartups names Cursor, Decart, Fireworks, Odyssey, and Together AI as cloud customers, while EnergyTechReview describes Fortune 500 reliance on the platform. Large technology customers also buy or lease dedicated data-center capacity: Summit Ventures Partners identifies Oracle as leasing Crusoe's Abilene space to serve OpenAI and describes a separate Wyoming project for an unnamed Fortune 100 technology customer. Forbes reports a Microsoft-linked 900MW development. Energy and infrastructure counterparties supply the physical inputs or capital for deployment, including Digital Realty, Equinix, and atNorth as cloud-region partners and Blue Owl/Primary Digital as project partners. These relationships represent different jobs-to-be-done and economics, so logos or partnership announcements should not be treated as equivalent to active recurring customers.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU010]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest public adoption indicators are operational footprint, named deployments, and reported cloud-customer growth rather than audited customer counts. DCD reports four cloud regions across the United States and Europe and states that the first phase of the 1.2GW Abilene campus went live in September 2025. TechStartups reports that the customer base grew more than sevenfold over the prior year, but it does not disclose the starting base, ending count, revenue denominator, or cohort definition. EnergyTechReview provides a product-level signal that clusters range from eight to more than 8,000 GPUs and that Fortune 500 companies rely on the platform, yet it does not name those users or quantify workloads. BuiltIn reports more than 6GW of contracted capacity against about 1GW operational as of September 2026, but labels its own page as AI-generated and potentially unverified. The customer proof is consequently real but uneven: Abilene is a named production-oriented infrastructure deployment, whereas several growth assertions remain company-adjacent, unspecific, or expressly unverified.
    claimRefs: [CU006, CU007, CU008, CU009, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: Public materials do not establish Crusoe's net revenue retention, gross retention, churn, renewal terms, contract lengths, cancellation rights, or customer-level revenue concentration. BuiltIn's October 2026 page explicitly warns that its figures are generated from popular-LLM responses, have not been reviewed or approved by Crusoe, and rely heavily on bookings and contracted capacity rather than recognized revenue or audited financials; it therefore supports a diligence gap, not a retention metric. The commercial model appears to have expansion potential because a single relationship can progress from cloud usage to reserved capacity and then to dedicated campus development, but that progression is an analytical possibility rather than verified cohort evidence. Concentration risk is material because publicly named counterparties include Oracle/OpenAI and Microsoft, while large campus announcements can make a small number of relationships economically important; the public record does not disclose each customer's share of revenue, committed capacity, or cancellation protections.
    claimRefs: [CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: customer diligence implications
    title: Customer diligence implications
    body: Crusoe's customer case is strongest where physical delivery is observable and counterparties are named, and weakest where management-style growth language substitutes for customer-level operating data. The Abilene campus going live and the existence of four cloud regions support genuine deployment capability, while the reported sevenfold customer-base increase and named cloud users indicate commercial reach. They do not prove utilization, renewal, margin, or cash conversion. The patent dispute reported by Blockspace is not a customer churn event, but it is an adverse signal about legacy DFM/bitcoin-era intellectual-property exposure and a reason to separate the durability of the AI customer proposition from the durability of older technology claims. Investment diligence should obtain customer-level bookings-to-revenue bridges, active-account and GPU-utilization cohorts, contract and renewal schedules, top-customer concentration, and evidence that announced campuses are contracted and commissioned rather than merely planned.
    claimRefs: [CU015, CU016, CU013, CU014]
