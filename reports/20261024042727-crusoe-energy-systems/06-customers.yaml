          touchpoints: ["Obtain renewal schedules", "Reconcile bookings to recognized revenue", "Measure top-customer concentration"]
        - label: "Reference validation"
          title: "Customer reference checks"
          detail: "Named relationships require direct customer confirmation of production use and outcomes."
          touchpoints: ["Interview named users", "Verify production versus pilot status"]
