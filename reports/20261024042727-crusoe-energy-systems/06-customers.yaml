          title: "Cash and margin conversion"
          detail: "Bookings and capacity announcements must be reconciled to collected revenue and gross margin."
          touchpoints: ["Review invoices and collections", "Test unit economics by workload"]
    claimRefs: [CU001, CU002, CU003, CU006, CU010, CU011, CU013, CU014]
callouts:
  - calloutType: risk
    title: Concentration and conversion are unresolved
    body: Large named relationships and campus announcements may create strong growth, but the assigned evidence does not disclose customer revenue shares, renewal rights, utilization, or recognized-revenue conversion.
    claimRefs: [CU011, CU013, CU014]
