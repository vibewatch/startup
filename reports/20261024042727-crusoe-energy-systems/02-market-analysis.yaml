    claimRefs: [CM004, CM005, CM006, CM007, CM012, CM015]
callouts:
  - calloutType: insight
    title: Power-ready capacity is the scarce product
    body: "The market's bottleneck is increasingly access to reliable electricity and interconnection, so Crusoe's differentiation is most relevant when it converts power access into commissioned compute rather than merely announcing pipeline capacity."
    claimRefs: [CM004, CM007, CM009]
  - calloutType: risk
    title: Pipeline is not realized market share
    body: "More than 6 GW of gross contracted capacity alongside about 1 GW delivered and operational creates a large execution and conversion gap; public evidence does not establish the timing, margin, or cancellation terms for the remainder."
    claimRefs: [CM006, CM011]
