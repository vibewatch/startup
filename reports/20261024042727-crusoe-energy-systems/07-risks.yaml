company:
  name: Crusoe Energy Systems
chapter:
  number: 7
  title: Risks
  summary: Crusoe's risk profile is dominated by execution at very large AI campuses, dependence on power and infrastructure partners, regulatory uncertainty around methane and flaring, and limited public disclosure of unit economics. The evidence supports a high residual-risk posture even as new financing and customer commitments improve capacity to execute.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break indicators
    body: >-
      Crusoe is scaling an unusually capital-intensive infrastructure model while its
      public evidence remains weighted toward announced projects, financing, and company
      descriptions rather than audited operating outcomes. The most material risk is
      execution: the company is simultaneously financing large campuses, deploying
      modular systems, operating cloud regions, and selling inference and GPU capacity.
      A five-year, $13 billion cloud contract reported for Jane Street would increase
      customer and delivery concentration if confirmed, while the Series F announcement
      says funding will finance existing projects and smaller Spark factories rather than
      disclose project-level returns. The thesis breaks if contracted capacity does not
      convert to commissioned, utilized infrastructure, if power interconnections or
      construction slip materially, or if a major customer can cancel or defer capacity.
      Monitoring should therefore track commissioned MW and GPU availability versus
      announced MW, utilization and renewal by major customer, construction milestones,
      capex and project-finance covenants, and customer concentration.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Crusoe's original operating model is exposed to a moving methane-policy baseline.
      The Harvard Environmental & Energy Law Program records that BLM delayed enforcement
      of two provisions of the Waste Prevention Rule in November 2025, that litigation is
      held in abeyance, and that the Department of the Interior proposed revisions in
      June 2026. EDF separately reports that EPA issued 2026 guidance on flaring
      compliance while reaffirming an intention to roll back methane standards. These
      sources do not establish that Crusoe violated a rule, but they do show that the
      value of capturing and monetizing flared gas, compliance incentives for counterparties,
      and permitting assumptions can change with agency action and litigation. Project
      approvals, environmental obligations, local opposition, and safety requirements for
      high-density data centers remain diligence items because the assigned evidence does
      not provide a complete permit, incident, or litigation inventory for Crusoe.
      A kill criterion is a material project delay or adverse order that removes expected
      power access, prevents gas capture, or makes a major site uneconomic.
    claimRefs: [CR005, CR006, CR007, CR008, CR011]
    tableRefs: [TR002]
  - id: operational-financial
    title: Operational, technical, and financial risks
    body: >-
      The operating model combines remote energy assets, generation, data-center
      construction, GPU procurement, cooling, networking, cloud software, and customer
      service. That vertical integration can shorten deployment, but it also creates more
      failure points than a single-purpose colocation model. Crusoe's public descriptions
      identify four cloud regions and multiple partners, while the Series F reporting
      describes both leased customer GPU infrastructure and Crusoe-owned GPUs. The
      assigned sources do not disclose uptime, incident rates, gross margin, burn, debt
      service, insurance, or project-level power costs. Those are material gaps, not
      evidence of failure. Financial risk rises if construction and GPU capex precede
      binding customer cash receipts, if utilization or inference pricing compresses, or
      if a power or hardware outage strands capacity. Management should report uptime by
      region, time-to-repair, GPU utilization, contracted backlog, capex committed versus
      funded, cash runway, and counterparty exposure.
    claimRefs: [CR009, CR010, CR012, CR013, CR015]
    tableRefs: [TR003]
  - id: mitigations-and-gaps
    title: Mitigations, monitoring, and unresolved diligence
    body: >-
      Several mitigants are visible but remain only partially validated. New capital and
      a broad institutional investor base can fund construction, while modular Spark
      systems may reduce dependence on a single hyperscale build. Geographic diversity
      across US and European regions and a mix of owned, leased, and partner facilities
      may reduce single-site exposure. Those mitigants do not substitute for evidence on
      contract enforceability, customer concentration, reliability, environmental
      performance, or returns. The next diligence package should obtain executed customer
      contracts and termination terms; a site-by-site permit and interconnection schedule;
      independent uptime, outage, and safety records; capex, debt, insurance, and
      covenant schedules; methane accounting with baseline and verification method; and
      a concentration table covering energy suppliers, landlords, hardware suppliers, and
      customers. The residual risk remains high until those controls are documented and
      tested against commissioned operations rather than announced capacity.
    claimRefs: [CR014, CR015, CR016]
