    columns: [Rule or exposure, Jurisdiction, Status in assigned evidence, Likelihood, Severity, Mitigation or diligence path, Residual exposure]
    rows:
      - [BLM Waste Prevention Rule enforcement, US federal and Indian lands, "Two provisions delayed and rule under review", medium, high, "Track Federal Register revisions and site-level applicability", high]
      - [BLM rule litigation, Eighth Circuit and North Dakota, "Litigation held in abeyance", medium, high, "Obtain counsel's site-by-site rule analysis and docket monitoring", high]
      - [EPA methane and flaring standards, US federal, "2026 guidance issued; rollback intent reported", medium, high, "Verify current OOOOb/OOOOC obligations for each operating site", high]
      - ["Local permitting, environmental, and safety approvals", "site jurisdictions", "Complete inventory not disclosed in assigned sources", unknown, high, "Obtain permit matrix, environmental reviews, and incident history", high]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and legal items identified in assigned 2026 evidence; not a complete site-by-site legal inventory."
    notes: "The regulatory sources describe policy and litigation status, not Crusoe-specific violations; unknown fields identify missing company or site evidence."
    claimRefs: [CR005, CR006, CR007, CR008, CR011]
  - id: TR003
    title: Operational, quality, security, and dependency register
    columns: [Failure mode or dependency, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Remote energy asset or generator interruption, medium, high, partial, high, "Independent availability and repair-time data by site"]
      - [Cloud region or networking outage, medium, high, low, high, "Uptime, incident, redundancy, and service-credit records"]
      - [GPU supply and hardware obsolescence, medium, high, partial, medium-high, "Procurement commitments, refresh cadence, and resale assumptions"]
      - [Construction and capital overrun, high, critical, partial, high, "Committed capex, project debt, covenants, insurance, and cash runway"]
      - [Regional hosting or leased-facility interruption, medium, high, partial, high, "Redundancy tests, portability plans, and recovery-time evidence"]
    notes: "Rows distinguish disclosed operating structure from unavailable performance data; residual exposure is not a claim that an incident occurred."
    claimRefs: [CR009, CR010, CR012, CR013, CR015]
