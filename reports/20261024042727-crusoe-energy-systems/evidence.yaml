evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Audited revenue, ARR, gross margin, cash burn, runway, and project-finance covenant terms.
    whyItMatters: Financing and contract-value headlines cannot establish operating quality, liquidity, or downside protection.
    diligencePath: >-
      Request audited financial statements, latest management accounts, debt schedules, and project-finance agreements
      under NDA.
    relatedQuestionRefs:
      - QO006
      - QO009
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: identity
    missingEvidence: A current legal-entity record confirming Crusoe's headquarters and principal operating office.
    whyItMatters: >-
      The retained sources identify Denver as headquarters but one current profile identifies San Francisco with major
      Denver operations.
    diligencePath: Obtain current legal-entity registrations and a management-confirmed principal-office statement.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete current leadership and board roster with verified roles, committee memberships, and succession
      coverage.
    whyItMatters: Large project delivery and financing depend on governance depth beyond the few publicly named executives.
    diligencePath: Request the current board and executive roster, committee charters, and key-person succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      A complete investor, lender, strategic-partner, and project-counterparty register with ownership and control
      rights.
    whyItMatters: Stakeholder concentration and contractual control can materially affect financing, supply, and delivery risk.
    diligencePath: Request the capitalization table, debt schedule, major project agreements, and counterparty concentration report.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: >-
      A reconciled schedule separating closed equity, anticipated round amounts, debt, project financing, and employee
      secondaries.
    whyItMatters: >-
      Funding raised is not cash available, and mixed financing categories cannot support a comparable total-raised
      figure.
    diligencePath: >-
      Reconcile bank statements and closing documents to a financing schedule by instrument, close date, and use of
      proceeds.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A common-denominator market model separating data-center infrastructure revenue, power-related spend, GPU cloud
      revenue, and serviceable Crusoe segments.
    whyItMatters: >-
      External TWh and GW forecasts establish demand pressure but cannot support Crusoe market share, SAM, SOM, or
      valuation math.
    diligencePath: >-
      Obtain management's segment revenue, contracted-versus-available capacity, geography, utilization, and customer
      eligibility definitions, then reconcile them to an external market denominator.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: capacity
    missingEvidence: >-
      Binding contract terms, commissioning schedule, cancellation rights, utilization, and gross-margin economics for
      the reported contracted gigawatts.
    whyItMatters: >-
      The reported gap between more than 6 GW contracted and about 1 GW operational determines whether pipeline converts
      into recurring capacity and cash generation.
    diligencePath: >-
      Review signed customer and project agreements, energization milestones, reserved power terms, and project-finance
      disclosures under confidentiality.
    relatedQuestionRefs:
      - QM008
      - QM009
  - type: conflicting-data
    severity: minor
    topic: power-constraints
    missingEvidence: Region-specific, independently audited connection and commissioning timelines for Crusoe's active campuses.
    whyItMatters: >-
      Global four-to-ten-year grid timing is a useful constraint lens, but it may not describe every Crusoe site or
      behind-the-meter configuration.
    diligencePath: >-
      Request utility interconnection studies, permits, construction schedules, and energization records for each
      announced campus.
    relatedQuestionRefs:
      - QM007
      - QM010
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current official rate cards, realized discounts, egress and support charges, service levels, and matched
      competitor quotations for identical hardware and commitment terms.
    whyItMatters: Category averages cannot establish Crusoe's customer total cost, pricing power, or margin.
    diligencePath: >-
      Obtain current Crusoe and competitor proposals for the same GPU cluster, utilization, region, duration,
      networking, storage, and support specification.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Customer-level renewal, churn, workload migration, reserved-capacity termination, and multi-cloud usage data.
    whyItMatters: Product integration does not prove contractual or technical lock-in without observed retention.
    diligencePath: Review top-customer contracts and interview customers that renewed, reduced, and migrated workloads.
    relatedQuestionRefs:
      - QP005
      - QP009
  - type: conflicting-data
    severity: material
    topic: energy-mix
    missingEvidence: >-
      Independently audited site-level electricity mix, emissions intensity, backup-runtime, and avoided-emissions
      baselines for Abilene and future campuses.
