chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Crusoe was founded in 2018 by Chase Lochmiller and Cully Cavness. Its original model placed modular data
              centers at oil and gas sites, converting stranded gas that would otherwise be flared into electricity for
              compute. The company has since pivoted from cryptocurrency mining toward AI infrastructure, while
              retaining the energy-first operating thesis. Its current model combines large data-center campuses, Crusoe
              Cloud GPU capacity, managed inference, and modular AI-factory products. The company describes itself as
              vertically integrated because it sources power, develops sites, manufactures selected electrical
              equipment, and operates cloud services. Public descriptions differ on headquarters: Forbes lists Denver,
              while another profile says San Francisco with major Denver operations; this remains an identity detail to
              verify directly with the company.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
