  - id: FP001
    title: Evidence-backed ordinal competitive positioning
    type: quadrant
    summary: >-
      Crusoe scores highly on physical-stack integration and breadth of deployment form, while peers and substitutes
      retain advantages in scale, installed relationships, or specialization.
    data:
      xAxis:
        label: Physical-stack integration
        min: 1
        max: 5
      yAxis:
        label: Deployment-form breadth
        min: 1
        max: 5
      points:
        - label: Crusoe
          x: 5
          'y': 5
          detail: Energy, manufacturing, hyperscale campuses, modular Spark, cloud, and managed inference.
        - label: CoreWeave
          x: 3
          'y': 4
          detail: Scaled specialist cloud with storage and CPU adjacencies; energy integration not established here.
        - label: Lambda
          x: 2
          'y': 3
          detail: Developer cloud and private GPU clusters; site and energy integration not established here.
        - label: Nebius
          x: 3
          'y': 3
          detail: Full-stack AI infrastructure; modular edge and energy integration are unknown in assigned evidence.
        - label: Hyperscalers
          x: 4
          'y': 5
          detail: Broad global service and deployment footprint, but not positioned around Crusoe's energy-first integration.
        - label: Modular incumbents
          x: 3
          'y': 2
          detail: >-
            Established physical infrastructure and channels without a fully integrated managed AI cloud in this
            comparison.
    approximationNotes: >-
      Analyst-assigned ordinal scores from 1 (low) to 5 (high) synthesize documented scope; they are not market share,
      benchmark performance, or verified relative quality.
    claimRefs:
      - CP001
      - CP002
      - CP006
      - CP008
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer compute demand can convert into cloud, managed-service, and dedicated-capacity revenue, but the public
      record does not quantify the mix or gross profit conversion.
    data:
      nodes:
        - id: demand
          label: AI training and inference demand
          details: Customer workloads require scarce GPU capacity and power.
        - id: cloud
          label: Crusoe Cloud
          details: GPU instances and related storage/networking services.
        - id: managed
          label: Managed AI services
          details: Managed Inference and orchestration services described publicly.
        - id: dedicated
          label: Dedicated campuses
          details: Lease-backed or contracted AI-factory capacity.
        - id: energy
          label: Energy and modular infrastructure
          details: Power sourcing, generation, and modular data-center capability.
        - id: economics
          label: Revenue less infrastructure costs
          details: Gross-profit conversion is not publicly disclosed.
      edges:
        - from: demand
          to: cloud
        - from: demand
          to: managed
        - from: demand
          to: dedicated
        - from: energy
          to: cloud
        - from: energy
          to: dedicated
        - from: cloud
          to: economics
        - from: managed
          to: economics
        - from: dedicated
          to: economics
    approximationNotes: >-
      The diagram is a qualitative operating model; it does not estimate revenue, conversion rates, margins, or cash
      flow.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI008
  - id: FE001
    title: Crusoe product architecture map
    type: stack
    summary: >-
      The offer moves from energy and site development through physical facilities and GPU systems to cloud and managed
      services, with reliability required across every layer.
    data:
      layers:
        - label: Energy and site
          detail: Select sites and assemble power from grid, natural-gas, renewable, and battery resources.
          modules:
            - label: Energy sourcing
              detail: Large-scale generation, storage, and interconnection strategy.
            - label: Site development
              detail: Location, permits, civil work, and dedicated power design.
        - label: Electrical manufacturing
          detail: Produce and prefabricate long-lead electrical equipment for campus installation.
          modules:
            - label: In-house components
              detail: Electrical equipment manufactured in Colorado, Oklahoma, and Louisiana.
            - label: Prefabrication
              detail: Equipment shipped ready for installation to compress delivery schedules.
        - label: Facility delivery
          detail: Build custom campuses and modular systems for high-density AI workloads.
          modules:
            - label: Custom AI campuses
              detail: Large purpose-built facilities for hyperscale customers.
            - label: Crusoe Spark
              detail: Modular units integrating power, cooling, and GPU racks.
        - label: Compute infrastructure
          detail: Operate GPU, networking, storage, cooling, and cluster-control systems.
          modules:
            - label: GPU systems
              detail: NVIDIA and AMD infrastructure for training and inference.
            - label: Cluster control
              detail: Networking, storage, drivers, and workload orchestration.
        - label: Customer services
          detail: Expose infrastructure through cloud capacity and managed model serving.
          modules:
            - label: Crusoe Cloud
              detail: GPU access for training, inference, and high-performance computing.
            - label: Managed Inference
              detail: Managed serving layer described by an investor source.
        - label: Operations and assurance
          detail: Maintain reliability, security, safety, support, and service quality across the stack.
          modules:
            - label: Site operations
              detail: Commissioning, maintenance, monitoring, and incident response.
            - label: Customer assurance
              detail: Service levels and control evidence that remain diligence priorities.
    approximationNotes: Conceptual operating stack; it does not represent component market share, capacity, or measured performance.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE013
      - CE014
  - id: FU001
    title: Customer journey from workload to expansion
    type: journey-map
    summary: >-
      Public evidence supports a path from cloud workload access to dedicated capacity, while retention and expansion
      economics remain unverified.
    data:
      items:
        - label: Cloud discovery
          title: GPU training and inference
          detail: Developers and enterprises access Crusoe Cloud resources.
          touchpoints:
            - On-demand or reserved GPU instances
            - CPU, storage, InfiniBand, VPC and firewall services
        - label: Workload adoption
          title: Named AI-cloud usage
          detail: Public coverage names Cursor, Decart, Fireworks, Odyssey, and Together AI.
          touchpoints:
            - AI model development
            - Training and inference workloads
        - label: Capacity commitment
          title: Dedicated infrastructure
          detail: Large customers can be served through purpose-built campuses and reserved capacity.
          touchpoints:
            - Abilene 1.2GW campus
            - Oracle/OpenAI relationship
            - Microsoft-linked project
        - label: Expansion and durability
          title: Renewal and revenue conversion
          detail: The public record does not disclose cohort retention, utilization, or customer-level economics.
          touchpoints:
            - Obtain renewal schedules
            - Reconcile bookings to recognized revenue
            - Measure top-customer concentration
        - label: Reference validation
          title: Customer reference checks
          detail: Named relationships require direct customer confirmation of production use and outcomes.
          touchpoints:
            - Interview named users
            - Verify production versus pilot status
        - label: Revenue realization
          title: Cash and margin conversion
          detail: Bookings and capacity announcements must be reconciled to collected revenue and gross margin.
          touchpoints:
            - Review invoices and collections
            - Test unit economics by workload
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU010
      - CU011
      - CU013
      - CU014
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Residual exposure remains highest where large project commitments meet incomplete public evidence on contracts,
      reliability, regulation, and financing.
    data:
      columns:
        - Likelihood
        - Medium impact
        - High impact
        - Critical impact
        - Financial impact
        - Regulatory impact
      rows:
        - label: Low
          values:
            - No material item
            - No material item
            - No material item
            - No material item
            - No material item
            - No material item
        - label: Medium
          values:
            - No material item
            - Regulatory change
            - Outage
            - Customer concentration
            - Margin compression
            - Rule revision
        - label: High
          values:
            - No material item
            - Power access
            - GPU economics
            - Campus delivery; capital overrun
            - Capital overrun
            - Permit delay
    approximationNotes: Placement is a qualitative synthesis of the cited evidence and documented gaps; it is not a probability model.
    claimRefs:
      - CR001
      - CR005
      - CR011
      - CR016
