        - id: risks
          label: 'Risks: power, construction, financing, concentration'
        - id: valuation
          label: 'Valuation: above $10B reported private mark'
        - id: decision
          label: 'Decision: research-more'
        - id: trigger
          label: 'Upgrade trigger: verified contracted economics'
      edges:
        - from: scale
          to: proof
        - from: proof
          to: valuation
        - from: risks
          to: valuation
        - from: valuation
          to: decision
        - from: proof
          to: trigger
    claimRefs:
