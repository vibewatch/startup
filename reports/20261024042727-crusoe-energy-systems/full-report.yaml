  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is power-secured AI infrastructure: data-center capacity, energy systems, and GPU
              cloud or managed inference sold to organizations that need high-density training and inference. It
              includes Crusoe's modular Spark deployments, permanent AI campuses, energy procurement and generation, and
              cloud services. It excludes general-purpose cloud software, ordinary colocation without AI-specific power
              and cooling, and upstream GPUs as a standalone component. The buyer is usually a hyperscaler,
              frontier-model developer, enterprise AI team, or infrastructure investor; the user is an engineering or
              model-operations team; and the payer is a technology or infrastructure budget owner. Forbes describes
              Crusoe as finding untapped energy and building data centers for compute-heavy workloads, while DCD
              describes its combination of physical infrastructure and Crusoe Cloud.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
      - number: '2.2'
        title: Sizing lenses and demand drivers
        blocks:
          - type: paragraph
            body: >-
              Public estimates should be read as different lenses, not added together. Global electricity demand for
              data centers, U.S. IT-load capacity, contracted AI-campus gigawatts, and cloud bookings measure different
              populations and units. The strongest external demand evidence is infrastructure-constrained: the World
              Economic Forum reports that grid connections can take four to ten years while AI data centers are
              typically planned and built in two to three, Data Center Frontier reports U.S. IT load rising from roughly
              80 GW in 2025 to about 150 GW by 2028, and EnkiAI's secondary synthesis cites a 15% CAGR in U.S.
              data-center power demand through 2030. Crusoe's September 2026 profile reports more than 6 GW of gross
              contracted capacity but about 1 GW delivered and operational; that gap makes pipeline conversion, not
              headline gigawatts, the key valuation question. The market is large, but the addressable portion is
              constrained by power, permitting, cooling, transmission, and capital.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
      - number: '2.3'
        title: Buyer segments, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              Crusoe's adoption path differs by segment. Hyperscalers and frontier-model companies can sign multi-year
              capacity or campus contracts and value time-to-power, density, and reliability; enterprise and developer
              users are more likely to buy cloud or managed inference without underwriting a campus. Energy and
              infrastructure partners supply sites, generation, land, or financing, so their economic role is
              complementary rather than interchangeable with the end customer. The principal drivers are AI workload
              growth, the scarcity of grid capacity, and demand for faster deployment. The constraints are project
              execution, long equipment and interconnection lead times, permitting, cooling and water, power-source
              reliability, and the capital intensity of owning more of the stack. BriefGlance explicitly flags supply
              chain, labor, delay, competition, and sustainable-power risks; WEF adds flexible connections,
              behind-the-meter assets, and demand controls as possible mitigants rather than eliminating the bottleneck.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits preserve the distinction between market demand, company positioning, and execution evidence.
              They do not convert contracted capacity into revenue, or external forecasts into Crusoe-specific market
              share. The market-definition table separates power, facilities, and cloud services so that overlapping
              spend is not double-counted. The sizing table keeps TWh, GW, and timing measures separate, while the buyer
              map makes budget ownership explicit. The pyramid is therefore a comparison of evidence lenses rather than
              a forecast of Crusoe's revenue or an implied conversion funnel. The principal unresolved issue is whether
              announced capacity becomes commissioned, utilized capacity on terms that support attractive economics.
            claimRefs:
              - CM006
              - CM007
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Power-ready capacity is the scarce product
            body: >-
              The market's bottleneck is increasingly access to reliable electricity and interconnection, so Crusoe's
              differentiation is most relevant when it converts power access into commissioned compute rather than
              merely announcing pipeline capacity.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM009
          - type: callout
            title: Pipeline is not realized market share
            body: >-
              More than 6 GW of gross contracted capacity alongside about 1 GW delivered and operational creates a large
              execution and conversion gap; public evidence does not establish the timing, margin, or cancellation terms
              for the remainder.
            calloutType: risk
            claimRefs:
              - CM006
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Crusoe is not competing in a single category. For cloud buyers, its closest direct alternatives are
              CoreWeave, Lambda, and Nebius, while AWS, Azure, and Google Cloud remain incumbent substitutes with
              broader product suites and established enterprise controls. For customers seeking dedicated capacity,
              internal GPU clusters are another option when utilization can remain high enough to justify ownership.
              Spark also places Crusoe against long-standing modular infrastructure vendors such as Vertiv, Schneider
              Electric, and Equinix. This broad set matters because a buyer can unbundle Crusoe's proposition: procure
              power and a site, buy modular infrastructure, and operate compute internally rather than purchase the
              integrated stack. Public scale comparisons favor CoreWeave in disclosed capital and footprint, while
              Crusoe's reported 1.2 GW Abilene campus and four cloud regions demonstrate meaningful but differently
              configured scale.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP010
      - number: '3.2'
        title: Capability, packaging, and pricing
        blocks:
          - type: paragraph
            body: >-
              Crusoe's clearest differentiation is vertical scope rather than a uniquely evidenced GPU service feature.
              The company says it combines energy sourcing, in-house modular and hyperscale construction, cloud
              infrastructure, and managed inference. Its March 2026 Spark expansion adds a productized route to deploy
              roughly one-megawatt units for distributed inference and sovereign or on-premise use cases, complementing
              gigawatt campuses. Yet published pricing evidence is neither audited nor directly comparable: an Uptime
              Institute aggregation reported a large neocloud discount to hyperscalers, while other market research
              reported materially different H100 ranges and break-even levels. The evidence therefore supports a
              category-level cost advantage, not a verified Crusoe-specific realized-price advantage. Contract
              discounts, service levels, egress, support, and actual utilization remain necessary for a buyer-level
              comparison.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP016
      - number: '3.3'
        title: Switching costs, distribution, and supply access
        blocks:
          - type: paragraph
            body: >-
              Crusoe can create switching costs at several layers: reserved capacity commitments, workload
              orchestration, high-performance networking, data gravity, and dedicated site design. Those mechanisms are
              plausible, but the assigned evidence does not disclose renewal rates, migration costs, contract
              termination rights, or customer-level multi-homing. Distribution power is also shared. Nvidia invests
              across several neoclouds, hyperscalers can remain both customers and competitors of specialists, and
              enterprises already have procurement and compliance relationships with incumbent clouds. Crusoe's
              power-development and manufacturing capabilities may improve access to constrained capacity, but they also
              increase capital and execution exposure. The reported decision by Oracle not to expand beyond the initial
              Abilene scope, which Crusoe disputed as mischaracterized, illustrates why announced campus capacity should
              not be treated as durable customer lock-in.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The most defensible element is Crusoe's organizational ability to coordinate energy, construction,
              manufacturing, and compute deployment faster than a customer assembling those inputs separately. Spark may
              broaden that capability from hyperscale training campuses into distributed inference. However, modular
              infrastructure itself has established incumbents, specialist clouds compete aggressively on price, and
              newer accelerators can compress the useful economic life of GPU fleets. Crusoe's climate positioning is
              also not a settled trust advantage: reporting identified planned on-site gas generation at Abilene and
              argued that the claimed benefit depends on an unobservable counterfactual about what a different developer
              would have built. On the available record, vertical integration is a credible execution advantage but not
              yet a proven durable moat. The stronger underwriting test is repeatable deployment, diversified contracted
              demand, and independently measured cost and emissions outcomes.
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the differentiator
            body: >-
              Crusoe's unusual combination of power development, manufacturing, campus construction, GPU cloud, and
              managed inference can compress handoffs that buyers otherwise coordinate across several vendors.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP016
          - type: callout
            title: Category economics can overwhelm differentiation
            body: >-
              Falling GPU rental rates and alternative supply from hyperscalers, specialist clouds, modular vendors, and
              internal clusters make sustained pricing power unproven.
            calloutType: risk
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Crusoe monetizes several connected activities rather than a single SaaS subscription. Its cloud platform
              sells GPU compute for training and inference, while enterprise and hyperscale relationships support
              dedicated capacity and large campus development. Sacra reports estimated revenue of $276 million in 2024
              and describes on-demand, reserved, storage, networking, and support tiers, but explicitly presents the
              figures as estimates rather than GAAP disclosures. DCD reports four cloud regions and partnerships with
              Digital Realty, Equinix, and atNorth, while Forbes identifies the Abilene campus as a large dedicated
              infrastructure program. These sources indicate multiple revenue surfaces, but they do not establish the
              mix between cloud consumption, construction/development income, leases, energy services, or
              project-finance proceeds. The core underwriting question is therefore not whether Crusoe has activity, but
              which activity converts into recurring, high-margin revenue after GPU depreciation, power, cooling, labor,
              and financing costs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI008
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is directional rather than a realized revenue schedule. Sacra describes GPU
              compute sold by the second, with on-demand and multi-year reserved commitments, and gives an illustrative
              100-H100 customer example; that example is a model, not a disclosed contract. ComputeForecast places
              normalized H100 rental rates at $2.85 to $3.50 per hour and describes utilization and depreciation
              thresholds for the broader neocloud market, not Crusoe-specific margins. The cost base is structurally
              heavy: GPU purchases, data-center construction, power generation and procurement, networking, liquid
              cooling, operations, support, and sales all precede revenue collection. McKinsey's interview describes a
              350-megawatt gas plant at Abilene and modular components manufactured off-site, showing how Crusoe may
              reduce schedule risk while increasing owned-asset exposure. Without utilization by GPU generation,
              realized price after discounts, power cost per deployed kilowatt, maintenance, depreciation, and gross
              margin by product, a conventional CAC-payback or SaaS-margin analysis would be misleading.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI009
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI010
              - CI012
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Crusoe has demonstrated access to substantial equity and infrastructure financing, but financing capacity
              is not the same as cash available for operations. AICurator and DCD report an October 2025 Series E
              initial close of approximately $1.375 billion and total funding near $3.9 billion; Forbes reports $3.4
              billion of joint-venture funding for the first Abilene buildings and describes a 15-year lease structure
              discussed by project participants. The same Forbes reporting records a 45-hour cloud outage and customer
              dissatisfaction, an adverse signal for service credits, renewal risk, and the cost of maintaining
              redundancy. Sacra reports large debt and construction financing figures for Abilene, but those are
              third-party estimates and do not disclose covenants, recourse, draw conditions, interest expense, or
              Crusoe's ownership share. The verdict is positive on demand and capital access but cautious on revenue
              quality, margin path, and liquidity: a financial diligence decision requires audited statements,
              contracted backlog by counterparty, GPU utilization, project-level cash waterfalls, and debt terms before
              the valuation can be underwritten.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital access is a strategic asset, not proof of self-funding
            body: >-
              Large equity and project-finance announcements show investor appetite and can accelerate capacity, but
              proceeds, debt, and joint-venture commitments must be separated from operating cash and attributable
              revenue.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
              - CI011
          - type: callout
            title: Margin and reliability remain underwriting blockers
            body: >-
              Public evidence does not disclose gross margin, burn, runway, or customer concentration, while reported
              cloud downtime and a capital-heavy build model create downside if utilization, pricing, or delivery falls
              short.
            calloutType: risk
            claimRefs:
              - CI008
              - CI013
          - type: callout
            title: Request project-level and product-level financial schedules
            body: >-
              Underwriting should require audited statements, realized GPU economics, contracted backlog, service-level
              performance, and debt or lease waterfalls before treating the reported valuation as supportable.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI009
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Crusoe serves two related customer workflows rather than offering a single product. Hyperscalers and large
              AI operators can procure purpose-built data-center capacity, while developers and enterprise teams can
              consume GPU infrastructure through Crusoe Cloud. Spark extends the model to prefabricated, edge or
              on-premise deployments, and the investor description of Managed Inference adds a managed model-serving
              layer. The common customer proposition is to remove energy, facility, hardware, and orchestration work
              from the buyer's critical path. Maturity is uneven: custom campuses have operational buildings, Cloud
              spans reported regions in the United States and Europe, and Spark has a live one-megawatt demonstration,
              but the managed inference and cloud-control surfaces have less independent operating evidence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: Energy-to-cloud operating architecture
        blocks:
          - type: paragraph
            body: >-
              The technical thesis is vertical integration across site power, electrical manufacturing, data-center
              construction, GPU systems, and cloud services. Crusoe says it co-develops power and construction,
              manufactures long-lead electrical components in three US states, and ships prefabricated equipment for
              installation. That can compress schedules and reduce handoffs, but it also concentrates execution risk
              inside Crusoe. The Abilene disclosure provides a concrete maturity marker: two buildings were operational
              and six were under construction as of June 2026. The Nevada Spark demonstration shows that the modular
              layer can combine solar, second-life battery storage, cooling, and NVIDIA GPUs off-grid, although one
              proof of concept does not establish fleet-level economics or reliability.
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE013
              - CE014
      - number: '5.3'
        title: Scale evidence and differentiation
        blocks:
          - type: paragraph
            body: >-
              Crusoe's strongest differentiation is the attempt to coordinate energy supply and compute delivery as one
              system. Company-issued June 2026 figures put contracted AI infrastructure at 4.9 GW and the broader
              development pipeline above 40 GW; these measures are not equivalent, and neither proves commissioned
              capacity. Independent reporting supports the existence of large operating and construction programs,
              including Abilene and four reported cloud regions, but the scale thesis still depends on converting
              construction and pipeline into reliable service. Reliability matters economically because large GPU
              clusters incur meaningful idle-time costs. This makes deployment speed useful only if networking, storage,
              drivers, and orchestration remain stable under sustained customer workloads.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.4'
        title: Reliability, trust, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Practitioner evidence is the main counterweight to the buildout narrative. ClusterMAX reported that
              Crusoe's Slurm-on-Kubernetes product was not usable out of the box for larger research labs because it
              lacked partitions, RBAC, and SSO, and separately described driver mismatches, filesystem unmounts, and
              manual storage configuration. These observations are one reviewer's experience rather than a measured
              incident-rate series, but they identify concrete integration and support risks to test. The retained
              source set does not establish current security certifications, privacy controls, service-level attainment,
              incident history, or quality-management procedures. Diligence should therefore require control reports,
              uptime and severity data, architecture diagrams, support metrics, and customer references before treating
              the infrastructure stack as enterprise-ready end to end.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Physical execution is visible
            body: >-
              Operational buildings at Abilene and an online off-grid Spark demonstration provide more tangible maturity
              evidence than a roadmap alone.
            calloutType: strength
            claimRefs:
              - CE006
              - CE010
          - type: callout
            title: Cloud maturity trails infrastructure ambition
            body: >-
              Practitioner testing flags missing enterprise controls and reliability problems, while the available
              evidence does not disclose auditable service-level or security control performance.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              Crusoe serves several distinct customer groups rather than a single homogeneous buyer. AI developers and
              enterprises use Crusoe Cloud for GPU training, inference, storage, and networking; TechStartups names
              Cursor, Decart, Fireworks, Odyssey, and Together AI as cloud customers, while EnergyTechReview describes
              Fortune 500 reliance on the platform. Large technology customers also buy or lease dedicated data-center
              capacity: Summit Ventures Partners identifies Oracle as leasing Crusoe's Abilene space to serve OpenAI and
              describes a separate Wyoming project for an unnamed Fortune 100 technology customer. Forbes reports a
              Microsoft-linked 900MW development. Energy and infrastructure counterparties supply the physical inputs or
              capital for deployment, including Digital Realty, Equinix, and atNorth as cloud-region partners and Blue
              Owl/Primary Digital as project partners. These relationships represent different jobs-to-be-done and
              economics, so logos or partnership announcements should not be treated as equivalent to active recurring
              customers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption indicators are operational footprint, named deployments, and reported
              cloud-customer growth rather than audited customer counts. DCD reports four cloud regions across the
              United States and Europe and states that the first phase of the 1.2GW Abilene campus went live in
              September 2025. TechStartups reports that the customer base grew more than sevenfold over the prior year,
              but it does not disclose the starting base, ending count, revenue denominator, or cohort definition.
              EnergyTechReview provides a product-level signal that clusters range from eight to more than 8,000 GPUs
              and that Fortune 500 companies rely on the platform, yet it does not name those users or quantify
              workloads. BuiltIn reports more than 6GW of contracted capacity against about 1GW operational as of
              September 2026, but labels its own page as AI-generated and potentially unverified. The customer proof is
              consequently real but uneven: Abilene is a named production-oriented infrastructure deployment, whereas
              several growth assertions remain company-adjacent, unspecific, or expressly unverified.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public materials do not establish Crusoe's net revenue retention, gross retention, churn, renewal terms,
              contract lengths, cancellation rights, or customer-level revenue concentration. BuiltIn's October 2026
              page explicitly warns that its figures are generated from popular-LLM responses, have not been reviewed or
              approved by Crusoe, and rely heavily on bookings and contracted capacity rather than recognized revenue or
              audited financials; it therefore supports a diligence gap, not a retention metric. The commercial model
              appears to have expansion potential because a single relationship can progress from cloud usage to
              reserved capacity and then to dedicated campus development, but that progression is an analytical
              possibility rather than verified cohort evidence. Concentration risk is material because publicly named
              counterparties include Oracle/OpenAI and Microsoft, while large campus announcements can make a small
              number of relationships economically important; the public record does not disclose each customer's share
              of revenue, committed capacity, or cancellation protections.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
      - number: '6.4'
        title: Customer diligence implications
        blocks:
          - type: paragraph
            body: >-
              Crusoe's customer case is strongest where physical delivery is observable and counterparties are named,
              and weakest where management-style growth language substitutes for customer-level operating data. The
              Abilene campus going live and the existence of four cloud regions support genuine deployment capability,
              while the reported sevenfold customer-base increase and named cloud users indicate commercial reach. They
              do not prove utilization, renewal, margin, or cash conversion. The patent dispute reported by Blockspace
              is not a customer churn event, but it is an adverse signal about legacy DFM/bitcoin-era
              intellectual-property exposure and a reason to separate the durability of the AI customer proposition from
              the durability of older technology claims. Investment diligence should obtain customer-level
              bookings-to-revenue bridges, active-account and GPU-utilization cohorts, contract and renewal schedules,
              top-customer concentration, and evidence that announced campuses are contracted and commissioned rather
              than merely planned.
            claimRefs:
              - CU015
              - CU016
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration and conversion are unresolved
            body: >-
              Large named relationships and campus announcements may create strong growth, but the assigned evidence
              does not disclose customer revenue shares, renewal rights, utilization, or recognized-revenue conversion.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break indicators
        blocks:
          - type: paragraph
            body: >-
              Crusoe is scaling an unusually capital-intensive infrastructure model while its public evidence remains
              weighted toward announced projects, financing, and company descriptions rather than audited operating
              outcomes. The most material risk is execution: the company is simultaneously financing large campuses,
              deploying modular systems, operating cloud regions, and selling inference and GPU capacity. A five-year,
              $13 billion cloud contract reported for Jane Street would increase customer and delivery concentration if
              confirmed, while the Series F announcement says funding will finance existing projects and smaller Spark
              factories rather than disclose project-level returns. The thesis breaks if contracted capacity does not
              convert to commissioned, utilized infrastructure, if power interconnections or construction slip
              materially, or if a major customer can cancel or defer capacity. Monitoring should therefore track
              commissioned MW and GPU availability versus announced MW, utilization and renewal by major customer,
              construction milestones, capex and project-finance covenants, and customer concentration.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Crusoe's original operating model is exposed to a moving methane-policy baseline. The Harvard
              Environmental & Energy Law Program records that BLM delayed enforcement of two provisions of the Waste
              Prevention Rule in November 2025, that litigation is held in abeyance, and that the Department of the
              Interior proposed revisions in June 2026. EDF separately reports that EPA issued 2026 guidance on flaring
              compliance while reaffirming an intention to roll back methane standards. These sources do not establish
              that Crusoe violated a rule, but they do show that the value of capturing and monetizing flared gas,
              compliance incentives for counterparties, and permitting assumptions can change with agency action and
              litigation. Project approvals, environmental obligations, local opposition, and safety requirements for
              high-density data centers remain diligence items because the assigned evidence does not provide a complete
              permit, incident, or litigation inventory for Crusoe. A kill criterion is a material project delay or
              adverse order that removes expected power access, prevents gas capture, or makes a major site uneconomic.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
      - number: '7.3'
        title: Operational, technical, and financial risks
        blocks:
          - type: paragraph
            body: >-
              The operating model combines remote energy assets, generation, data-center construction, GPU procurement,
              cooling, networking, cloud software, and customer service. That vertical integration can shorten
              deployment, but it also creates more failure points than a single-purpose colocation model. Crusoe's
              public descriptions identify four cloud regions and multiple partners, while the Series F reporting
              describes both leased customer GPU infrastructure and Crusoe-owned GPUs. The assigned sources do not
              disclose uptime, incident rates, gross margin, burn, debt service, insurance, or project-level power
              costs. Those are material gaps, not evidence of failure. Financial risk rises if construction and GPU
              capex precede binding customer cash receipts, if utilization or inference pricing compresses, or if a
              power or hardware outage strands capacity. Management should report uptime by region, time-to-repair, GPU
              utilization, contracted backlog, capex committed versus funded, cash runway, and counterparty exposure.
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Mitigations, monitoring, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Several mitigants are visible but remain only partially validated. New capital and a broad institutional
              investor base can fund construction, while modular Spark systems may reduce dependence on a single
              hyperscale build. Geographic diversity across US and European regions and a mix of owned, leased, and
              partner facilities may reduce single-site exposure. Those mitigants do not substitute for evidence on
              contract enforceability, customer concentration, reliability, environmental performance, or returns. The
              next diligence package should obtain executed customer contracts and termination terms; a site-by-site
              permit and interconnection schedule; independent uptime, outage, and safety records; capex, debt,
              insurance, and covenant schedules; methane accounting with baseline and verification method; and a
              concentration table covering energy suppliers, landlords, hardware suppliers, and customers. The residual
              risk remains high until those controls are documented and tested against commissioned operations rather
              than announced capacity.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain executed customer and power contracts, site permits and interconnection schedules, independent
              reliability records, and project-level capex and financing data before underwriting announced capacity as
              durable revenue.
            calloutType: risk
            claimRefs:
              - CR002
              - CR008
              - CR012
              - CR016
          - type: callout
            title: Regulatory uncertainty is not a compliance finding
            body: >-
              The assigned regulatory sources establish changing policy and litigation status, not a Crusoe violation;
              site-specific legal and environmental review remains open.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Crusoe controls a scarce combination of energy access, data-center
              development, GPU cloud operations, and AI workload software. The Series E was reported at approximately
              $1.375 billion and above a $10 billion valuation, while public reporting describes a 1.2-GW Abilene
              campus, a 45-GW development pipeline, and five-times year-over-year cloud-bookings growth in 2025. These
              are meaningful signals of financing access and customer demand, but they are not equivalent to recognized
              revenue, free cash flow, or realized project returns. The anti-thesis is that the platform is unusually
              capital intensive and exposed to power, permitting, construction, hardware, tenant, and financing
              execution. A valuation above $10 billion therefore requires diligence that separates announced capacity
              and bookings from contracted, commissioned, profitable capacity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The October 2025 financing provides the clearest public price anchor: Converge Digest reported a $1.375
              billion Series E valuing Crusoe above $10 billion, and DCPulse reported approximately $3.9 billion of
              cumulative equity funding since 2018. The earlier Series D benchmark was $600 million at a $2.8 billion
              valuation, according to CarbonCredits, implying a rapid step-up in private marks, but the comparison is
              imperfect because the rounds differ in timing, capital structure, and business scale. A public comparable
              is available in CoreWeave: Multiples describes a March 2025 IPO valued at $23 billion equity value and $30
              billion enterprise value, with 2024 revenue of $1.9 billion and a $863 million net loss. That benchmark
              demonstrates both the market’s willingness to fund AI infrastructure and the danger of comparing valuation
              without Crusoe revenue, margin, debt, and utilization data. Entry should be conditioned on verified
              contracted economics rather than the headline round valuation.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be capacity- and cash-flow-driven rather than based on a single headline
              multiple. The bull case assumes that Crusoe converts its energy portfolio and campus pipeline into
              binding, creditworthy tenant contracts, ramps GPU utilization, and demonstrates margins that justify
              infrastructure-like financing. The base case assumes strong AI demand but slower commissioning, continued
              heavy capital needs, and incomplete disclosure, which supports monitoring rather than an immediate
              purchase. The bear case assumes power scarcity, permitting or construction delays, cost inflation,
              customer concentration, or multiple compression prevent the reported valuation from compounding. DCPulse
              explicitly reports that execution remains the key risk and quotes the CEO that power is scarce; these are
              observable downside variables, not abstract concerns. Probabilities below are decision signals, not
              statistical forecasts, because public evidence does not disclose the full operating model.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: Diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Crusoe has credible strategic visibility: DCD reports four cloud regions and the Abilene campus for OpenAI
              and Oracle, while Silicon Republic reports international expansion and the company’s exclusive focus on AI
              after divesting Bitcoin mining. Those facts improve the strategic narrative but do not establish exit
              readiness. Before underwriting a return target, an investor should obtain the cap table, liquidation
              preferences, debt and project-finance covenants, tenant contracts, renewal and cancellation terms, backlog
              conversion, GPU ownership and depreciation schedules, site-level gross margin, cash burn, and
              commissioning milestones. The recommendation should move upward only if these materials show contracted
              cash flows and acceptable leverage; it should move downward if announced gigawatts lack binding tenants,
              if customer concentration is material, or if financing terms shift downside to common equity. CoreWeave’s
              public customer concentration and net loss illustrate why scale alone is not an adequate exit or valuation
              proxy.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              The reported financing mark and strategic demand justify continued diligence, not an immediate buy.
              Require verified contracted revenue, site economics, leverage, preferences, and commissioning evidence
              before underwriting a return.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV015
          - type: callout
            title: Denominator risk
            body: >-
              Crusoe’s headline valuation is public, but the assigned evidence does not disclose sufficient revenue,
              margin, utilization, burn, or net-debt data to calculate a defensible entry multiple or target return.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV015
