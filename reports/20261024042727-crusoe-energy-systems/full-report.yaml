  - id: FM001
    title: Market sizing lenses, not additive share
    type: pyramid
    summary: A layered view of global demand, U.S. capacity, and Crusoe's contracted-versus-operational footprint.
    data:
      items:
        - label: Global data-center electricity demand
          value: '945'
          unit: TWh by 2030
          valueNote: World Economic Forum article citing IEA; global electricity consumption, not revenue
        - label: U.S. data-center IT load
          value: '150'
          unit: GW by 2028
          valueNote: Data Center Frontier citing Bloom Energy report; U.S. IT-load capacity forecast
        - label: Crusoe gross contracted capacity
          value: '6'
          unit: GW+ in September 2026
          valueNote: AI Magazine profile; contracted capacity is not delivered capacity
        - label: Crusoe delivered and operational
          value: '1'
          unit: GW approx. in September 2026
          valueNote: AI Magazine profile; operational footprint is a subset of gross contracted capacity
        - label: Grid connection timing
          value: 4-10
          unit: years in many regions
          valueNote: World Economic Forum citing DNV; timing is a constraint lens, not a market size
        - label: AI campus build timing
          value: 2-3
          unit: years typically
          valueNote: World Economic Forum citing DNV; comparison basis differs from grid connection timing
        - label: U.S. data-center power-demand growth
          value: '15'
          unit: '% CAGR through 2030'
          valueNote: EnkiAI citing Goldman Sachs; secondary forecast, not Crusoe revenue growth
    approximationNotes: >-
