company:
  name: Crusoe Energy Systems
chapter:
  number: 1
  title: Company Overview
  summary: Crusoe has evolved from a 2018 flare-gas bitcoin-mining business into a vertically integrated AI infrastructure company spanning power sourcing, data-center development, manufacturing, and cloud services. Public evidence supports strong financing and project momentum, but private-company disclosure leaves revenue, profitability, customer concentration, and delivered-capacity conversion as material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Crusoe was founded in 2018 by Chase Lochmiller and Cully Cavness. Its original model
      placed modular data centers at oil and gas sites, converting stranded gas that would
      otherwise be flared into electricity for compute. The company has since pivoted from
      cryptocurrency mining toward AI infrastructure, while retaining the energy-first
      operating thesis. Its current model combines large data-center campuses, Crusoe Cloud
      GPU capacity, managed inference, and modular AI-factory products. The company describes
      itself as vertically integrated because it sources power, develops sites, manufactures
      selected electrical equipment, and operates cloud services. Public descriptions differ
      on headquarters: Forbes lists Denver, while another profile says San Francisco with
      major Denver operations; this remains an identity detail to verify directly with the
      company.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-governance-and-scale
    title: Leadership, governance, and operating scale
    body: >-
      Lochmiller remains co-founder, chief executive, and chairman, while Cavness is identified
      as co-founder, president, and chief strategy officer. A September 2026 analysis also
      identifies Michael Gordon as COO and CFO following a December 2025 appointment, adding
      public-company finance experience to the operating team. The retained sources do not
      provide a complete executive or board roster, committee rights, succession plan, or
      current ownership schedule, so founder-market fit is clearer than governance depth.
      Reported employee counts provide dated snapshots rather than an audited growth series:
      Forbes lists 1,300 as of April 2026, while the September analysis reports more than
      1,800. The later figure is directionally consistent with expansion but cannot establish
      hiring pace, functional mix, or employee retention.
    claimRefs: [CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: financing-milestones-and-gaps
    title: Financing, milestones, and diligence gaps
    body: >-
      Crusoe's financing scale increased materially between the Series D and Series E:
      CarbonCredits reports a $600 million Series D at a $2.8 billion valuation, while
      Data Center Dynamics reports the initial closing of an anticipated $1.375 billion
      Series E at an expected valuation above $10 billion. A September 2026 analysis then
      reports the initial closing of an anticipated $3.9 billion Series F at a $30.9 billion
      post-money valuation and relays the company's claim of more than $140 billion in total
      contracted value. Those are financing and contract-value measures, not revenue or cash
      available. Data Center Dynamics separately reported four cloud regions across the
      United States and Europe. The evidence also records a company-issued May 2026 status
      incident, syndicated by IsDown, classified as major and lasting about 20 hours. Public
      evidence does not establish audited revenue, cash burn, gross margin, customer count,
      ownership, secondary-sale economics, or current debt covenants, so headline scale
      should not be treated as verified operating performance.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
