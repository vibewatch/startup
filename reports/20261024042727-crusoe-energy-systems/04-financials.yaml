        - from: energy
          to: cloud
        - from: energy
          to: dedicated
        - from: cloud
          to: economics
        - from: managed
          to: economics
        - from: dedicated
          to: economics
    approximationNotes: "The diagram is a qualitative operating model; it does not estimate revenue, conversion rates, margins, or cash flow."
    claimRefs: [CI001, CI004, CI005, CI008]
callouts:
  - calloutType: strength
    title: Capital access is a strategic asset, not proof of self-funding
    body: Large equity and project-finance announcements show investor appetite and can accelerate capacity, but proceeds, debt, and joint-venture commitments must be separated from operating cash and attributable revenue.
    claimRefs: [CI009, CI010, CI011]
  - calloutType: risk
    title: Margin and reliability remain underwriting blockers
    body: Public evidence does not disclose gross margin, burn, runway, or customer concentration, while reported cloud downtime and a capital-heavy build model create downside if utilization, pricing, or delivery falls short.
    claimRefs: [CI008, CI013]
  - calloutType: recommendation
    title: Request project-level and product-level financial schedules
    body: Underwriting should require audited statements, realized GPU economics, contracted backlog, service-level performance, and debt or lease waterfalls before treating the reported valuation as supportable.
    claimRefs: [CI006, CI009, CI012, CI013]
