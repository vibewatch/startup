company:
  name: Crusoe Energy Systems
chapter:
  number: 4
  title: Financials
  summary: Crusoe combines GPU cloud, dedicated AI-campus development, and energy infrastructure, but public evidence does not disclose audited revenue, gross margin, cash burn, or customer-level economics. The available evidence supports strong demand and financing access while leaving underwriting dependent on utilization, long-term contracts, capital intensity, and project-finance obligations.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: "Crusoe monetizes several connected activities rather than a single SaaS subscription. Its cloud platform sells GPU compute for training and inference, while enterprise and hyperscale relationships support dedicated capacity and large campus development. Sacra reports estimated revenue of $276 million in 2024 and describes on-demand, reserved, storage, networking, and support tiers, but explicitly presents the figures as estimates rather than GAAP disclosures. DCD reports four cloud regions and partnerships with Digital Realty, Equinix, and atNorth, while Forbes identifies the Abilene campus as a large dedicated infrastructure program. These sources indicate multiple revenue surfaces, but they do not establish the mix between cloud consumption, construction/development income, leases, energy services, or project-finance proceeds. The core underwriting question is therefore not whether Crusoe has activity, but which activity converts into recurring, high-margin revenue after GPU depreciation, power, cooling, labor, and financing costs."
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-costs-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: "Public pricing evidence is directional rather than a realized revenue schedule. Sacra describes GPU compute sold by the second, with on-demand and multi-year reserved commitments, and gives an illustrative 100-H100 customer example; that example is a model, not a disclosed contract. ComputeForecast places normalized H100 rental rates at $2.85 to $3.50 per hour and describes utilization and depreciation thresholds for the broader neocloud market, not Crusoe-specific margins. The cost base is structurally heavy: GPU purchases, data-center construction, power generation and procurement, networking, liquid cooling, operations, support, and sales all precede revenue collection. McKinsey's interview describes a 350-megawatt gas plant at Abilene and modular components manufactured off-site, showing how Crusoe may reduce schedule risk while increasing owned-asset exposure. Without utilization by GPU generation, realized price after discounts, power cost per deployed kilowatt, maintenance, depreciation, and gross margin by product, a conventional CAC-payback or SaaS-margin analysis would be misleading."
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: "Crusoe has demonstrated access to substantial equity and infrastructure financing, but financing capacity is not the same as cash available for operations. AICurator and DCD report an October 2025 Series E initial close of approximately $1.375 billion and total funding near $3.9 billion; Forbes reports $3.4 billion of joint-venture funding for the first Abilene buildings and describes a 15-year lease structure discussed by project participants. The same Forbes reporting records a 45-hour cloud outage and customer dissatisfaction, an adverse signal for service credits, renewal risk, and the cost of maintaining redundancy. Sacra reports large debt and construction financing figures for Abilene, but those are third-party estimates and do not disclose covenants, recourse, draw conditions, interest expense, or Crusoe's ownership share. The verdict is positive on demand and capital access but cautious on revenue quality, margin path, and liquidity: a financial diligence decision requires audited statements, contracted backlog by counterparty, GPU utilization, project-level cash waterfalls, and debt terms before the valuation can be underwritten."
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or basis, Current public value/status, Quality, Diligence ask]
    rows:
      - [GPU cloud compute, "On-demand and reserved GPU instances for training/inference", "GPU-hour or commitment", "Publicly described; no audited mix", "Company/product descriptions plus third-party reporting", "Revenue by GPU generation, utilization, realized price, credits, and churn"]
      - [Managed AI services, "Managed Inference and orchestration layered on GPU infrastructure", "Pay-per-token or provisioned throughput", "Product and pricing model described; revenue unavailable", "Third-party profile; not independently audited", "Bookings, gross margin, service-level credits, and renewal rates"]
      - [Dedicated AI campuses, "Long-term capacity and lease-backed data-center infrastructure", "MW/GW capacity and lease term", "Abilene 1.2 GW campus reported; revenue allocation unavailable", "Independent reporting and company interview", "Binding backlog, counterparty, lease economics, and construction completion tests"]
      - [Energy and modular infrastructure, "Power generation, modular data centers, and energy sourcing supporting compute", "MW deployed/developed", "Integrated operating model; standalone revenue unavailable", "Company-claimed and reported", "Segment accounting, power cost, maintenance capex, and third-party obligations"]
    notes: "Streams are analytically separated because public sources do not disclose revenue recognition or mix; capacity and funding figures are not revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, Price or contract basis, List versus realized, Confidence, Implication]
    rows:
      - [GPU cloud on-demand, "$2-$3 per GPU-hour cited by Sacra", "Illustrative public estimate; realized price unknown", "Low", "Revenue depends on utilization and GPU mix"]
      - [Reserved GPU capacity, "Six-month to three-year commitments described by Sacra", "Discount schedule described; contract realization unknown", "Low", "Improves visibility but may transfer utilization and price risk to Crusoe"]
      - [Managed Inference, "Pay-per-token or provisioned-throughput model described", "Public model; realized pricing and costs unknown", "Low", "Could improve software attachment but requires benchmark-to-margin proof"]
      - [Hyperscale campus lease, "Long-term lease structure; Forbes cites 15 years in project context", "Contract terms not public", "Medium", "Potentially supports financing but creates concentration and execution exposure"]
    notes: "Pricing entries mix third-party estimates, described packaging, and reported contract structure; none should be treated as Crusoe's realized revenue or gross margin."
    claimRefs: [CI005, CI009, CI011]
  - id: TI003
    title: Unit economics and underwriting gaps
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$276M estimated for 2024", "Low", "Provides a scale indicator but not audited revenue quality", "Obtain audited income statement and revenue-recognition policy by segment"]
      - [H100 market rental rate, "$2.85-$3.50 per hour normalized market range", "Medium for market; low for Crusoe", "Sets external price pressure and a utilization sensitivity", "Obtain Crusoe realized rates, discounts, credits, and GPU-level utilization"]
      - [Gross margin, null, "Unavailable", "Determines whether growth creates cash or consumes it", "Obtain gross margin by cloud, managed services, lease, and development activity"]
      - [CAC/payback, null, "Unavailable", "Sales efficiency cannot be inferred from infrastructure bookings", "Obtain acquisition spend, sales cycle, cohort contribution margin, and payback"]
      - [Cash burn and runway, null, "Unavailable", "Equity and debt raised do not establish liquidity", "Obtain cash balance, operating burn, capex commitments, debt service, and runway case"]
    notes: "Nulls are deliberate evidence gaps; market benchmarks and third-party estimates are not Crusoe-specific operating metrics."
    claimRefs: [CI002, CI006, CI007, CI010, CI012]
