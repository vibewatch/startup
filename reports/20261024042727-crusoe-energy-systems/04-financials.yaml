    title: Revenue model bridge
    type: flow
    summary: Customer compute demand can convert into cloud, managed-service, and dedicated-capacity revenue, but the public record does not quantify the mix or gross profit conversion.
    data:
      nodes:
        - id: demand
          label: AI training and inference demand
          details: "Customer workloads require scarce GPU capacity and power."
        - id: cloud
          label: Crusoe Cloud
          details: "GPU instances and related storage/networking services."
        - id: managed
          label: Managed AI services
          details: "Managed Inference and orchestration services described publicly."
        - id: dedicated
          label: Dedicated campuses
          details: "Lease-backed or contracted AI-factory capacity."
        - id: energy
          label: Energy and modular infrastructure
          details: "Power sourcing, generation, and modular data-center capability."
        - id: economics
          label: Revenue less infrastructure costs
          details: "Gross-profit conversion is not publicly disclosed."
