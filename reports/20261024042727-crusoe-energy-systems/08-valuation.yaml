      - [Confidence, "Financing and project evidence are public; revenue and margin disclosure is incomplete", "Medium", "Require primary diligence before changing the call"]
      - [Risk rating, "Power scarcity, construction, permitting, tenant and capital intensity exposure", "High", "Size conservatively and monitor milestone slippage"]
      - [Valuation stance, "Headline valuation is available but denominator metrics are not", "Stretched / unproven", "Seek price protection or wait for verified cash-flow evidence"]
    notes: "Qualitative decision summary; the public record does not provide a complete Crusoe income statement, cap table, or project-level return schedule."
    claimRefs: [CV001, CV009, CV010, CV016]
  - id: TV002
    title: Financing and comparable reference points
    columns: [Reference, Period, Reported metric, Comparability caveat]
    rows:
      - [Crusoe Series D, "2024", "$600M raise at $2.8B valuation", "Earlier business scale and market conditions; source is secondary reporting"]
      - [Crusoe Series E, "October 2025", "$1.375B raise; valuation above $10B", "Private mark; revenue, margin, debt and preferences not disclosed here"]
      - [Crusoe cumulative equity, "Since 2018", "Approximately $3.9B", "Funding raised is not revenue or cash available after investment"]
      - [CoreWeave IPO, "March 2025 / FY2024", "$23B equity value, $30B EV; $1.9B revenue; $863M net loss", "Public comparable with different leverage, disclosure and scale"]
    notes: "Reference points are not a common-multiple analysis because Crusoe revenue, EBITDA, net debt, utilization, and share-class terms are unavailable in the assigned evidence."
    claimRefs: [CV001, CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Binding multi-year tenants; on-time campuses; high GPU utilization; improving margins", "A premium infrastructure multiple could be justified by contracted cash flows", "Low-to-medium", "Bookings fail to convert into contracted capacity"]
      - [Base, "Demand remains strong; commissioning and disclosure lag; capital needs remain high", "Hold or monitor; no precise target without revenue and cash-flow inputs", "Medium-to-high", "Cash burn or leverage rises faster than commissioned revenue"]
      - [Bear, "Power, permitting, cost inflation or tenant delays; AI infrastructure multiples compress", "Headline $10B mark loses support and dilution/down-round risk rises", "Medium", "Material schedule slippage, covenant pressure, or customer cancellations"]
      - [Decision gate, "Verify contracts, site economics, cap table, debt and utilization", "Upgrade only after primary evidence closes denominator gap", "Required", "Any material gap remains unresolved"]
    notes: "Scenario probabilities are qualitative signals, not statistical estimates; valuation ranges are intentionally not invented because public Crusoe revenue and cash-flow inputs are missing."
    claimRefs: [CV009, CV010, CV011, CV012, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public scale and strategic access support interest, while missing denominator data and execution risks keep the recommendation at research-more.
    data:
      nodes:
        - {id: scale, label: "Reported scale: Series E, campuses, cloud regions"}
        - {id: proof, label: "Proof to verify: contracts, utilization, margins, cash flow"}
        - {id: risks, label: "Risks: power, construction, financing, concentration"}
        - {id: valuation, label: "Valuation: above $10B reported private mark"}
        - {id: decision, label: "Decision: research-more"}
        - {id: trigger, label: "Upgrade trigger: verified contracted economics"}
      edges:
        - {from: scale, to: proof}
        - {from: proof, to: valuation}
        - {from: risks, to: valuation}
        - {from: valuation, to: decision}
        - {from: proof, to: trigger}
    claimRefs: [CV001, CV002, CV009, CV015]
callouts:
  - calloutType: recommendation
    title: Research-more
    body: >-
      The reported financing mark and strategic demand justify continued diligence, not an
      immediate buy. Require verified contracted revenue, site economics, leverage,
      preferences, and commissioning evidence before underwriting a return.
    claimRefs: [CV001, CV007, CV015]
  - calloutType: risk
    title: Denominator risk
    body: >-
      Crusoe’s headline valuation is public, but the assigned evidence does not disclose
      sufficient revenue, margin, utilization, burn, or net-debt data to calculate a defensible
      entry multiple or target return.
    claimRefs: [CV007, CV008, CV015]
