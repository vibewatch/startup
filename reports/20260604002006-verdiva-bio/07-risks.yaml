- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Lead clinical failure
    - EVOLVE-2 topline disclosure
    - Weight-loss efficacy or discontinuation profile is not clearly competitive against oral peers / approved oral therapy
    - Treat as thesis break; underwrite only a reset scenario, not premium phase 3 value
  - - Regulatory package expansion
    - FDA / EMA feedback, protocol changes, new safety-study commitments
    - Requirement for materially larger or longer registrational package than current public path implies
    - Rebuild cash-need model and delay-driven valuation assumptions
  - - CMC / scale-up miss
    - Batch-validation, tech-transfer, or supplier readiness updates
    - Commercial-scale oral peptide manufacturing remains unvalidated by the time phase 3 planning starts
    - Pause underwriting of gross-margin and access assumptions until CMC evidence is shared
  - - Competitive displacement
    - Lilly / Structure / other oral or amylin data releases
    - Peer efficacy, tolerability, or convenience benchmark moves materially ahead of Verdiva before phase 2b readout or phase 3 start
    - Reframe asset as follower rather than category shaper; compress valuation multiple
  - - Financing / runway gap
    - Next financing, IPO filings, or internal budget request
    - Need for additional capital before phase 3 without clearly differentiated data
    - Assume down-round risk and tighter investor protections
  - - Key-person loss
    - Executive departures or unfilled leadership gaps
    - Loss of CEO, CMO, CTO, or chair without clearly visible succession
    - Escalate diligence on governance and execution; treat as yellow-to-red flag depending on timing
  notes: These are deliberately binary triggers designed for investment underwriting rather than management scorekeeping; each one maps directly to a probable valuation reset or stop-work decision.
