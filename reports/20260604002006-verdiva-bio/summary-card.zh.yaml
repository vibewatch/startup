    - 精确股权结构表条款、烧钱速度、现金跑道或清算优先权仍无公开可见度
    - Eli Lilly、Novo Nordisk、Structure、Viking 及其他减重项目带来的竞争压力正在加剧
    - 口服平台的 CMC、专利范围和 freedom-to-operate 细节披露仍明显不足
  unresolvedGaps:
