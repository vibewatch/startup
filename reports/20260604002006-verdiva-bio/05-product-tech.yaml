  evidenceGaps:
  - type: missing-source
    severity: material
    topic: small-molecule-disclosure-gap
    missingEvidence: A clear public asset map showing whether any oral small-molecule GLP-1 program is inside Verdiva's owned pipeline, including a Verdiva code, development stage, and scope of licensed rights.
    whyItMatters: Without a named asset map, investors cannot cleanly underwrite whether Verdiva's oral platform includes only peptide programs or also a nonpeptide path that changes the competitive and CMC profile.
    diligencePath: Request the executed Sciwind asset schedule, internal portfolio codex, and freedom-to-operate memo that maps each licensed program to current Verdiva asset codes.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: ip-disclosure-gap
    missingEvidence: Patent-family numbers, composition-of-matter detail for T2026, and any coformulation-specific IP around VRB-101 plus VRB-103.
    whyItMatters: The platform's defensibility depends on enhancer chemistry and formulation claims that are not visible in public materials, making it hard to judge moat depth or expiry timing.
    diligencePath: Obtain patent schedule, patentability opinions, and claim charts for T2026, VRB-101 oral formulation, and VRB-103 combination filings.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: clinical-disclosure-gap
    missingEvidence: Full phase 1 clinical study report, food-effect testing, dose-by-dose tolerability tables, and discontinuation narratives for oral VRB-101.
    whyItMatters: Poster-level PK is directionally helpful, but registrational risk sits in variability, dropout, and adherence details that are not disclosed publicly.
    diligencePath: Request the phase 1 CSR, blinded exposure-response analysis, food-effect protocol, and raw discontinuation listings before underwriting phase 3 probability.
    relatedQuestionRefs:
    - QE022
    - QE026
  - type: private-evidence-only
    severity: material
    topic: cmc-quality-gap
    missingEvidence: Detailed manufacturing, release-testing, and stability package for T2026-enabled oral tablets and for the VRB-101 plus VRB-103 coformulation.
    whyItMatters: Scalability and patient-friendliness are central company claims, yet there is no public CMC package showing lot reproducibility, excipient stability, or commercial readiness.
    diligencePath: Review GMP site list, analytical methods, formulation stability studies, and tech-transfer documentation tied to the oral tablet programs.
