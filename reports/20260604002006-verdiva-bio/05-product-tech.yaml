  - - Safety follow-up window
    - Documented
    - Public trial listings include four-week post-treatment safety follow-up
    - Longer-term safety persistence and re-treatment strategy are not public
  - - Public technical dissemination
    - Active
    - ADA 2025, EASD 2025, and ADA 2026 outputs provide practitioner-facing updates
    - Conference materials are not a substitute for full peer-reviewed oral clinical datasets
  - - Manufacturing / scalability controls
    - Claimed only
    - Verdiva says weekly oral dosing and T2026 can support scalable manufacturing
    - No public GMP site, validation, release-testing, or excipient-quality package is disclosed
  notes: This table distinguishes documented development controls from broader CMC-quality evidence, which remains thin in public materials.
