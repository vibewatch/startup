- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Randomized placebo-controlled trial design
    - Documented
    - Phase 1, EVOLVE-2, and maintenance studies are described as randomized and blinded
    - Detailed protocol deviations and site-monitoring outputs are not public
  - - Eligibility and safety exclusions
    - Documented
    - Phase 1 public poster lists pancreatitis, diabetes, weight-loss-medication, and related exclusions
    - No public integrated safety-management plan across phase 2 programs
  - - Dose-escalation / titration framework
    - Documented at high level
    - EVOLVE-2 is designed to identify starting, maintenance, and titration schedules
