- id: TE002
  title: Workflow / use-case table
  columns:
  - User job / clinical use case
  - Current workflow
  - Verdiva solution
  - Measurable public benefit
  - Limitation
  rows:
  - - Injection-averse weight-loss induction
    - Weekly injectable GLP-1 or daily oral semaglutide with fasting constraints
    - VRB-101 once-weekly oral peptide
    - Poster-level PK modelling targets semaglutide-like weekly exposure; oral route may improve convenience
    - No phase 2 efficacy or adherence data yet
  - - Long-term weight maintenance after initial loss
    - Continue chronic injectable therapy or step down to less potent agents
    - Separate VRB-101 maintenance study (NCT07553299)
    - Public maintenance study indicates Verdiva is designing for chronic use, not only induction
    - Maintenance efficacy is unreported and optimal weekly dose is still being identified
  - - GLP-1 intolerance or partial response
    - Switch between injectable GLP-1s or add another agent later
    - VRB-103 oral amylin monotherapy or oral combo path
    - Company argues amylin can address segments underserved by GLP-1 alone
    - No human proof yet for tolerability or efficacy advantage
  - - Dual-hormone oral regimen in one pill
    - Use separate products or injectables to add amylin biology
    - VRB-101 plus VRB-103 coformulated tablet with T2026
    - Cynomolgus-monkey data show both peptides retained plasma exposure in one tablet
    - Human coformulation PK and tablet manufacturability remain undisclosed
  - - Convenience benchmark versus other oral GLP-1s
    - Daily oral semaglutide still requires fasting and water timing restrictions
    - Verdiva is aiming for weekly oral dosing rather than daily timing burden
    - Weekly schedule could offset enhancer complexity if exposure is reliable
    - Unlike small-molecule orforglipron, Verdiva has not yet shown a no-food/no-water administration profile
  notes: Benefits are limited to public PK, registry, and comparator disclosures; no real-world persistence or adherence data are public.
