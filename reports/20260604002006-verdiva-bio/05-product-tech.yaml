  rows:
  - - VRB-101 oral GLP-1 peptide analog
    - Adults with obesity or overweight seeking weekly oral weight-loss induction and maintenance
    - Phase 2b active; EVOLVE-2 enrolled
    - Once-weekly oral peptide built on cAMP-biased ecnoglutide plus T2026; no refrigeration claim
    - No public phase 2 efficacy readout, food-effect package, or full GI discontinuation detail
  - - VRB-103 oral amylin analog
    - Patients needing amylin monotherapy or oral add-on when GLP-1 alone is insufficient or poorly tolerated
    - Preclinical / phase-1-ready
    - Potential once-weekly oral amylin with monotherapy and combo optionality
    - No human PK, safety, or dose-ranging data yet
  - - VRB-101 + VRB-103 coformulated oral tablet
    - Patients who may benefit from dual-hormone efficacy in one weekly oral regimen
    - Preclinical coformulation concept
    - Single-tablet oral GLP-1/amylin exposure maintained in cynomolgus-monkey work
    - No public human combination study, stability package, or ratio-optimization dataset
  - - VRB-104 injectable dual agonist
    - High-BMI patients where a stronger induction agent could justify injection
    - Preclinical
    - Unimolecular GLP-1 plus amylin co-agonist extends platform beyond oral peptides
    - No human data or detailed dosing plan publicly disclosed
  - - Possible licensed small-molecule GLP-1 path (not clearly named by Verdiva)
    - Broader oral GLP-1 market if Verdiva controls a nonpeptide program
    - Public linkage unclear
    - Would remove peptide-enhancer complexity if it were in-scope
    - Verdiva has not publicly mapped any named company asset to Sciwind's separately disclosed small-molecule GLP-1 program
  notes: Rows reflect only publicly disclosed assets and pathways; the fifth row is framed as a disclosure question rather than a confirmed Verdiva program.
