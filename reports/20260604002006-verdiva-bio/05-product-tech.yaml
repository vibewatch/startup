- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Ecnoglutide cAMP-biased peptide core
    - Provides GLP-1 receptor agonism with weekly pharmacology rationale
    - Sciwind-origin peptide engineering and pharmacology package
    - Injectable ecnoglutide data do not guarantee oral reproducibility
  - - T2026 oral absorption enhancer
    - Supports peptide delivery and underpins weekly oral strategy
    - Undisclosed enhancer chemistry, excipient interactions, and scale-up know-how
    - Public evidence is company-run and lacks full food-effect and CMC disclosure
  - - PK modelling and titration logic
    - Translates phase 1 exposure into weekly clinical dosing plans
    - Accurate exposure-response link and GI tolerability management
    - Modelled equivalence to injectable semaglutide may not hold in broader obesity populations
  - - VRB-103 oral amylin module
    - Extends platform to oral amylin monotherapy and combo use
    - Human translatability of preclinical receptor and exposure findings
    - Rodent receptor mismatch reduces confidence in preclinical efficacy extrapolation
  - - Clinical execution layer
    - Runs EVOLVE-2 and the follow-on maintenance study to define dosing workflow
    - Enrollment quality, site execution, and retention across chronic obesity studies
    - Public disclosures do not yet show discontinuation patterns or subgroup performance
  - - Licensing and tech-transfer interface
    - Determines asset provenance, IP control, and manufacturing handoff from Sciwind
    - Partner alignment and complete transfer of formulation know-how
    - Public asset mapping is incomplete and could complicate diligence on ownership and freedom to operate
  notes: Architecture rows synthesize official and technical disclosures; chemistry and CMC details remain partly inferred because Verdiva has not published full formulation specifications.
