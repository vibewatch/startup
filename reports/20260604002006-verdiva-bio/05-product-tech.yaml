company:
  name: Verdiva Bio
chapter:
  number: 5
  title: Product & Technology
  summary: Verdiva Bio's public product story is anchored on VRB-101, a once-weekly oral ecnoglutide peptide paired with the proprietary T2026 enhancer, not on a clearly disclosed small-molecule GLP-1 asset. Public disclosures support the pharmacology and weekly-dosing rationale through posters, registry records, and an active phase 2b trial, but they leave material gaps around IP specificity, oral CMC reproducibility, and long-term tolerability.
sections:
- id: product-definition-and-asset-map
  title: Product definition and disclosed asset map
  body: 'Verdiva Bio''s public product story is more specific than the prompt''s small-molecule framing: the company''s lead disclosed oral GLP-1 candidate is VRB-101, an oral peptide formulation of ecnoglutide rather than a named small-molecule program. The homepage, launch materials, and conference releases show a modular obesity portfolio built around once-weekly oral and injectable hormones: VRB-101 for GLP-1 biology, VRB-103 for oral amylin, a VRB-101 plus VRB-103 oral combination path, and VRB-104 as a preclinical injectable dual-agonist. That architecture matters because Verdiva is trying to cover both weight-loss induction and maintenance with different mechanistic combinations instead of a single hero asset. The public record also shows a material disclosure boundary: although Verdiva licensed Sciwind''s obesity portfolio, Verdiva''s own materials do not clearly map a Verdiva code to Sciwind''s separately disclosed oral small-molecule GLP-1 program. For diligence, that means the
    named and citable Verdiva oral GLP-1 product is the enhancer-enabled peptide VRB-101, while any small-molecule angle remains a portfolio-adjacency question rather than a cleanly disclosed company asset today.'
  claimRefs:
