- id: clinical-development-path-and-use-case
  title: Clinical development path and use-case workflow
  body: 'Verdiva''s public development path is already shaped around obesity-treatment workflow rather than only molecule science. EVOLVE-2 is positioned as the dose-finding and titration-optimization study for weight-loss induction, with about 206 participants, five active arms, a placebo arm, and 20 weeks of weekly oral dosing. The endpoint package is straightforward and commercial in orientation: mean percentage body-weight change from baseline, plus the dose and titration information needed to decide how to run phase 3. Importantly, Verdiva has also disclosed a separate phase 2 study for weight maintenance, which signals that the company is designing the product around chronic use after initial weight-loss response rather than assuming one regimen will do everything. That is strategically sensible because oral therapy economics and adherence can look different in induction versus maintenance. The weakness is that public disclosures still emphasize enrollment milestones, registry text,
    and future topline timing more than actual patient-level tolerability or dropout data. Until those data arrive, the workflow logic is credible, but the clinical operating model is still only partially de-risked.'
  claimRefs:
  - CE015
