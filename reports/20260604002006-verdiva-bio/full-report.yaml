  - id: TM004
    title: Oral Versus Injectable GLP-1 Adoption Comparison
    columns:
      - Dimension
      - Current oral benchmark
      - Injectable / market benchmark
      - Why it matters for Verdiva
    rows:
      - - Administration
        - Rybelsus requires fasting-like administration with water and a 30-minute wait before food or other oral drugs
        - Weekly injections avoid daily fasting routine but require needles
        - A once-weekly oral profile could remove friction from both current oral and injectable options
      - - Efficacy benchmark
        - Orforglipron beat oral semaglutide on A1C and body-weight reduction in ACHIEVE-3
        - Injectables remain the reference for double-digit obesity weight loss
        - Verdiva must show convenience without a clinically meaningful efficacy penalty
      - - Prescriber familiarity
        - Existing Rybelsus use gives oral semaglutide a familiarity advantage
        - Injectables already dominate obesity prescribing patterns
        - Oral familiarity can shorten education cycles in primary care
      - - Preference evidence
        - Surveyed PCPs were highly willing to prescribe oral semaglutide soon after launch
        - Injectables remain preferred where efficacy confidence dominates convenience
        - Adoption may be strongest in PCP-led and needle-averse cohorts
      - - Tolerability and persistence
        - Daily oral and newer oral entrants still face GI side effects and discontinuation risk
        - Injectables also face discontinuation, but persistence support programs are more mature
        - Long-term refill behavior is a bigger value driver than trial initiation
      - - Coverage logic
        - Diabetes-label oral products have clearer reimbursement pathways today
        - Obesity-label injectables still face patchy coverage despite larger installed base
        - Verdiva may need to sequence clinical and payer strategy around the most reimbursable use cases
    notes: >-
      This table compares route-specific adoption mechanics rather than claiming one modality will universally win. Oral
      convenience matters most where it changes prescriber behavior, patient willingness, or payer economics.
