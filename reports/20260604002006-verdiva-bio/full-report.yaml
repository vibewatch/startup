    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal foundation, and product thesis
        blocks:
          - type: paragraph
            body: >-
              Verdiva’s public identity is straightforward even though its legal history is short. Companies House shows
              the UK entity incorporated on 29 July 2024 as MNCO BIO LIMITED, renamed VERDIVA BIO LIMITED on 9 September
              2024, and now registered at 5 Swallow Place in London after moving from Guildford in August 2025. The
              operating story presented to investors and media then begins with the 9 January 2025 public launch, when
              Verdiva introduced itself as a London-and-San-Francisco clinical-stage biopharmaceutical company focused
              on obesity and other cardiometabolic disorders. The company’s own materials consistently frame the
              business model around differentiated, patient-friendly obesity medicines rather than around any disclosed
              commercial platform or current revenue base. The most concrete product thesis is the combination of
              once-weekly oral delivery and modular pipeline design: VRB-101 is positioned as an oral ecnoglutide
              program in phase 2, T2026 is the enabling oral absorption technology, and the broader portfolio adds oral
              and injectable amylin options plus further undisclosed candidates. That gives later chapters a clean
              identity baseline: Verdiva is a heavily financed, still pre-commercial clinical builder whose public scale
              case currently rests on pipeline quality and execution milestones, not on disclosed operating metrics.
