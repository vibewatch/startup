  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Recommendation logic moves from market and strategic scarcity through proof and structure gaps to a track verdict.
    data:
      nodes:
        - id: market
          label: Market tailwind
          detail: >-
            Anti-obesity drugs and the broader incretin market are expanding rapidly, with oral formats opening new
            access channels.
          tone: positive
        - id: scarcity
          label: Strategic scarcity
          detail: >-
            Kailera, Metsera, and Zealand/Roche show that differentiated obesity assets can command exceptional
            financing and deal values.
          tone: positive
        - id: proof
          label: Direct proof gap
          detail: >-
            Verdiva still lacks public company-generated Phase 2 efficacy data and detailed disclosed Phase 1
            benchmarking.
          tone: warning
        - id: structure
          label: Structure gap
          detail: Exact cap-table terms, CMC package, and fuller license obligations are not public.
          tone: warning
        - id: valuation
          label: Estimated ~$2.5B entry
          detail: Rich relative to disclosed proof, though below later-stage strategic obesity anchors.
          tone: warning
        - id: verdict
          label: Verdict — Track
          detail: Wait for EVOLVE-2 and diligence closure before upgrading; be ready to walk if data or structure disappoints.
          tone: neutral
      edges:
        - from: market
          to: valuation
          label: supports premium
        - from: scarcity
          to: valuation
          label: supports premium
        - from: proof
          to: verdict
          label: blocks buy
        - from: structure
          to: verdict
          label: blocks buy
        - from: valuation
          to: verdict
          label: demands discipline
    approximationNotes: null
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV032
      - CV038
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Stage-adjusted valuation anchors in USD billions show where the estimated Series A mark sits relative to cautious,
      base, bull, and strategic-ceiling reference points.
    data:
      items:
        - label: Bear-case reset
          value: 1
          detail: Mixed EVOLVE-2 or sector de-rating compresses value toward a down-round range.
          tone: negative
        - label: Base-case triangulation
          value: 2.2
          detail: Positive but not clearly differentiated data keeps value near flat versus the estimated mark.
          tone: neutral
        - label: Estimated Series A mark
          value: 2.5
          detail: Dealroom-derived estimate quoted by PEDB for Verdiva's launch valuation.
          tone: warning
        - label: Bull-case triangulation
          value: 3.8
          detail: Clean EVOLVE-2 plus credible Phase 3 path supports a higher scarcity premium.
          tone: positive
        - label: Metsera upfront strategic anchor
          value: 4.9
          detail: Pfizer's initial enterprise value for Metsera before additional CVR payments.
          tone: positive
        - label: Zealand total collaboration ceiling
          value: 5.3
          detail: Roche/Zealand total consideration for petrelintide, including milestones.
          tone: positive
    approximationNotes: >-
      Bars blend disclosed transaction anchors with chapter estimates for IC use; they are not company guidance and
      should not be read as a formal DCF output.
    claimRefs:
      - CV018
      - CV023
      - CV025
      - CV030
      - CV033
      - CV034
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Three-scenario valuation outcomes from the estimated ~$2.5B entry show asymmetric downside and only moderate
      upside unless Verdiva clears its next proof gate decisively.
    data:
      items:
        - label: Bear case
          low: 0.7
          mid: 1
          high: 1.3
          displayValue: $0.7B-$1.3B
          detail: Mixed data or sector de-rating; roughly 0.3x-0.5x of the estimated entry mark.
          tone: negative
        - label: Base case
          low: 1.8
          mid: 2.2
          high: 2.6
          displayValue: $1.8B-$2.6B
          detail: Positive but not clearly differentiated proof; roughly flat return profile.
          tone: neutral
        - label: Bull case
          low: 3.2
          mid: 3.8
          high: 4.3
          displayValue: $3.2B-$4.3B
          detail: Strong EVOLVE-2 and strategic scarcity sustain a 1.3x-1.7x gross upside case.
          tone: positive
    approximationNotes: >-
      Ranges are comp-plus-rNPV chapter estimates in USD billions and assume the PEDB / Dealroom figure is directionally
      close to the true round valuation.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV039
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring shows a very strong market and financing backdrop but materially weaker evidence quality and
      downside protection at the current estimated price.
    data:
      items:
        - label: Market tailwind
          score: 9
          detail: Market forecasts and J.P. Morgan's incretin outlook support a very large category.
          tone: positive
        - label: Lead-asset promise
          score: 7
          detail: >-
            Weekly oral positioning and external ecnoglutide data are attractive, but Verdiva-specific proof is still
            limited.
          tone: positive
        - label: Platform optionality
          score: 7
          detail: Oral and injectable amylin follow-ons add strategic breadth beyond one molecule.
          tone: positive
        - label: Financing quality
          score: 8
          detail: A $411M round led by top-tier investors gives real runway and external validation.
          tone: positive
        - label: Valuation support
          score: 4
          detail: The estimated mark sits ahead of what public proof alone can fully justify.
          tone: warning
        - label: Evidence quality
          score: 4
          detail: Public cap-table, detailed Phase 1, and CMC/IP evidence remain incomplete.
          tone: warning
        - label: Downside resilience
          score: 3
          detail: Obesity assets have shown sharp one-day de-ratings when data disappoint expectations.
          tone: negative
    approximationNotes: >-
      Scores are 0-10 ordinal judgments synthesized from public evidence for investment-committee use and are not
      outputs of a quantitative factor model.
    claimRefs:
      - CV013
      - CV014
      - CV029
      - CV031
      - CV038
