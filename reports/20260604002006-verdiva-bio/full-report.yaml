      - number: '5.4'
        title: Amylin expansion and comparative positioning versus other oral GLP-1 approaches
        blocks:
          - type: paragraph
            body: >-
              Verdiva is not relying on VRB-101 alone. The company is using VRB-103 and VRB-104 to widen the product
              surface and to argue that its obesity platform can serve patients who need more than a single GLP-1
              mechanism. The VRB-103 poster is meaningful because it goes beyond generic combination rhetoric: it shows
              additive weight-loss effects with VRB-101 in rodents, preserved exposure for both peptides in a
              coformulated cynomolgus-monkey tablet, and a receptor profile explicitly designed around amylin biology.
              That gives the company a plausible oral dual-hormone roadmap. Still, the competitive bar is rising
              quickly. Small-molecule oral GLP-1 programs such as HRS-7535 and orforglipron are now publishing phase 2
              and phase 3 data, and those programs matter even if they are not disclosed Verdiva assets. They show what
              a nonpeptide oral GLP-1 can promise: no injection burden, easier combination logic, and in Lilly's case no
              food or water restrictions. That comparison cuts both ways for Verdiva. Weekly oral peptide dosing could
              be differentiated if exposure remains robust, but enhancer-dependent peptide delivery may prove less
              frictionless than the best small-molecule alternatives.
