  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              For Verdiva Bio, the relevant market is not all obesity care and not even all GLP-1 spending. The
              investable boundary is narrower: oral GLP-1 and adjacent metabolic pharmacotherapy for obesity, overweight
              with comorbidities, and type 2 diabetes patients where oral administration changes adoption behavior.
              Verdiva’s own positioning is consistent with that framing. The company says its lead asset, VRB-101, is a
              once-weekly oral formulation of ecnoglutide for obesity and presents convenience and patient-friendly
              treatment as core differentiation, which places it directly against existing oral semaglutide benchmarks
              and indirectly against injectable GLP-1 or GLP-1/GIP therapies. Included spend therefore covers branded
              obesity medicines, oral GLP-1 diabetes prescriptions that can serve as a commercial bridge, and the payer
              or self-pay channels that finance long-term treatment. Excluded spend includes bariatric surgery, general
              wellness subscriptions, and most lifestyle-only interventions, though those remain status-quo substitutes.
              The substitutes that matter most are weekly injectables, not non-pharma care, because they set the
              efficacy bar and already shape prescriber expectations.
            claimRefs:
