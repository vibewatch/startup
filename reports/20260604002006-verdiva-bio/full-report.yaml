  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pre-revenue status
        blocks:
          - type: paragraph
            body: >-
              Verdiva currently looks like a classic pre-revenue clinical-stage biotech rather than a company with
              observable product revenue. Across the company website, launch materials, enrollment release, and
              independent trade coverage, the disclosed economic engine is still equity-funded drug development around
              VRB-101 and the amylin portfolio, not commercial sales. Public evidence supports only future monetization
              paths: eventual prescription product sales if VRB-101 or follow-on assets reach market; regional or
              strategic partnership upfronts, milestones, and royalties tied to licensed or co-developed assets; and
              broader business-development transactions if management expands the cardiometabolic portfolio. What is
              missing is just as important as what is disclosed: no public list pricing, no reimbursement strategy, no
              customer contracts, no product sales, and no realized revenue mix. Financially, that means this chapter
              has to underwrite Verdiva on milestone conversion and capital efficiency rather than on present-day
              revenue quality.
