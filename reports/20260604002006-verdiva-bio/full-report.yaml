      - - Novo oral semaglutide / amycretin
        - Incumbent oral semaglutide plus next-wave amycretin expansion
        - Deep diabetes and obesity channel control; oral sema already trains behavior
        - Daily oral platform already commercial; amycretin adds internal succession path
        - Very high
      - - Structure GSBR-1290
        - Public biotech with explicit combination-platform ambition
        - No commercial channel yet, but public-market access improves staying power
        - Management explicitly frames small-molecule manufacturing as globally scalable
        - Moderate
      - - Viking oral VK2735
        - Public biotech with both oral and injectable VK2735 programs
        - Phase 3 injectable program could cross-pull physicians into oral lifecycle strategy
        - One molecule across oral and injectable formulations can streamline franchise building
        - High
      - - Terns TERN-601
