      - number: '7.2'
        title: Competition, Manufacturing, and Partner Dependencies
        blocks:
          - type: paragraph
            body: >-
              Verdiva’s product thesis is attractive on paper — a weekly oral peptide for obesity with follow-on oral
              and injectable amylin programs — but the competitive context has shifted materially since launch. By 2026,
              Lilly already had an FDA-approved oral obesity pill, while Structure, AstraZeneca, Pfizer-related assets,
              Novo programs, and multiple amylin challengers were also advancing. That does not invalidate a weekly oral
              positioning, but it sharply reduces the room for a “good enough” phase 2b outcome. Verdiva must show not
              only weight loss, but differentiated adherence, tolerability, maintenance logic, and eventual pricing
              power.


              Manufacturing scale-up is the second major operational risk. Verdiva repeatedly describes T2026 as
              clinically validated and compatible with scalable manufacturing, yet public evidence does not include
              batch reproducibility, supplier map, cost-of-goods, or process-validation disclosure. The oral peptide
              patent literature and Sciwind’s own commentary both point to the same structural challenge: oral peptide
              absorption in the fasted stomach is technically feasible but formulation-sensitive, and the industry still
              treats manufacturing, affordability, and reliable access as open problems rather than solved ones.


              Dependency risk reinforces both points. Verdiva relies on Sciwind-originated assets and know-how, future
              clinical execution for a larger global program, and a market-access environment currently being shaped by
              Lilly and Novo. The weekly oral story is therefore exposed to three external actors at once: the licensor,
              the regulator, and better capitalized incumbents. If any one of those pillars moves against the company,
              the transmission to valuation is immediate because public evidence of an independent moat remains thin.
