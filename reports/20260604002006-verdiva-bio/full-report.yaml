      - number: '3.2'
        title: Lilly, Novo, and Structure Set the Oral Benchmark
        blocks:
          - type: paragraph
            body: >-
              Lilly is the most important direct pressure point on Verdiva because orforglipron already behaves like a
              launch-stage asset rather than a science project. Lilly says global submissions are underway, expects U.S.
              obesity action in Q2 2026, and has shown in ACHIEVE-3 that once-daily orforglipron can outperform oral
              semaglutide on both glycemic control and weight loss while avoiding food and water restrictions. Even
              though ACHIEVE-3 is a diabetes study, it tells Verdiva what commercial buyers will care about: oral
              convenience, clinically meaningful weight reduction, and manufacturing scalability in a small-molecule
              format. Novo remains the incumbent oral reference because oral semaglutide has already trained prescribers
              and patients to accept daily oral incretin treatment, even if the regimen still carries fasting
              instructions and familiar GLP-1 GI warnings.


              Novo also matters because it is not standing still at oral semaglutide. Amycretin extends Novo into the
              next generation of GLP-1-plus-amylin biology and puts pressure on Verdiva's combination thesis from the
              high end of the market. Structure is the most relevant mid-cap oral GLP-1 peer because GSBR-1290 is
              already showing meaningful 12-week efficacy, cleaner liver-language than the discontinued small-molecule
              failures, and a non-peptide manufacturing story explicitly framed around global scale. Taken together,
              Lilly, Novo, and Structure establish three different bars Verdiva must clear: late-stage execution,
              oral-category incumbency, and credible biotech-level efficacy with scalable chemistry.
