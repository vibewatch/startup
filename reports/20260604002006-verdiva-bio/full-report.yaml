      - number: '6.4'
        title: Reimbursement and repeat-use risk will define real commercial value
        blocks:
          - type: paragraph
            body: >
              Public payer evidence shows why reimbursement is the central commercial bottleneck. KFF and CMS data show
              GLP-1 utilization and spending were already surging before broad obesity coverage: gross Medicare Part D
              spending on GLP-1s reached $27.5 billion in 2024, and two million Part D enrollees used Ozempic that year.
              CMS's BALANCE model and Medicare GLP-1 Bridge indicate that obesity-drug access is expanding, including
              for oral products, but they do not eliminate the payer gate. Prior authorization, negotiated eligibility
              criteria, manufacturer participation, and state or plan opt-in still determine whether a labeled obesity
              drug actually reaches patients.


              Repeat use is the second commercial constraint. ICER and AAFP both highlight that obesity-drug persistence
              is weak in the real world because of side effects, cost, and long-term treatment fatigue. Public
              benchmarks suggest that many patients stop therapy within the first year and very few remain on treatment
              at two years. For Verdiva, this means that the eventual commercial question is not only how many patients
              can start VRB-101, but how many can stay on therapy long enough to produce durable refill revenue and
              payer confidence. Without evidence that a once-weekly oral peptide materially improves persistence, public
              obesity-market demand could translate into much lower realized customer lifetime value than headline
              prevalence numbers suggest.
