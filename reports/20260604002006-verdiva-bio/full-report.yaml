      - number: '7.3'
        title: Leadership, Burn, Cash, and Valuation Risks
        blocks:
          - type: paragraph
            body: >-
              The January 2025 Series A was unusually large for a private biotech launch and clearly gave Verdiva more
              room than a typical single-asset obesity startup. Even so, management has already acknowledged that phase
              3 obesity programs are large and expensive enough that IPO or additional financing remains a realistic
              future path. Public evidence does not disclose current cash balance, monthly burn, phase 3 budget, or
              expected timing of the next financing, so the key question is not whether the company is well-funded
              today, but whether the current capital base is sufficient to fund a full late-stage program if EVOLVE-2 is
              merely good rather than clearly category-leading.


              Valuation risk is amplified by sector conditions. UK financing data show that Q1 2025 venture activity was
              concentrated in a few megadeals, including Verdiva, rather than broad-based. CNBC’s 2026 coverage of
              Deloitte’s R&D analysis points to a separate but related risk: obesity has become so central to pharma
              pipeline value that new entrants are exposed to a “bubble effect,” where returns look strong at the sector
              level but are increasingly vulnerable to therapeutic-area-specific disappointments. That is especially
              relevant for Verdiva because its round size may have embedded expectations of category leadership rather
              than simple execution.


              Key-person dependence compounds the capital question. The CEO, president of R&D, CTO, and board chair all
              come with meaningful prior exit and drug-development credentials, but the same fact creates concentration
              around a narrow leadership cohort. The team’s credibility helps the company raise money and advance
              partnered assets; if one or more of those operators leaves before the lead program is de-risked, financing
              and partnering leverage would likely weaken faster than the public narrative implies.
