      - number: '6.3'
        title: Broader market evidence supports demand for oral obesity therapies
        blocks:
          - type: paragraph
            body: >
              The category backdrop is large enough to support a credible commercialization story if Verdiva's data are
              strong. WHO says obesity affects more than one billion people globally, while CDC estimates more than 100
              million U.S. adults have obesity. That population burden alone does not guarantee customer conversion, but
              it explains why prescribers, payers, and pharma companies keep expanding the obesity market despite rising
              budget pressure.


              The more useful analogs are oral-launch and prescriber-intent data. IQVIA reported that oral Wegovy
              captured roughly one-third of new-to-brand prescriptions within eight weeks of launch, and most of that
              volume came from people new to any GLP-1 therapy rather than simple switching. FiercePharma, citing a
              Spherix survey of about 100 primary care physicians and endocrinologists, found around 90% expected to
              prescribe oral semaglutide within six months of launch and more than 70% of PCPs ranked it their most
              preferred upcoming obesity medicine. Those are meaningful demand signals for Verdiva because they suggest
              convenience can widen the market, not just reshuffle it. But current oral comparators also show
              convenience has limits: RYBELSUS has strict fasting rules, and Lilly's head-to-head oral data show higher
              discontinuation from side effects than oral semaglutide. Verdiva therefore needs to prove not merely that
              it is oral, but that its once-weekly format and peptide profile genuinely improve the user experience.
