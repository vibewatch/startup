          Weekly oral peptide plus absorption enhancer could be differentiated if scalable, but public COGS are
          undisclosed
        - Pressure is execution-driven rather than concept-driven
      - - Lilly orforglipron
        - Global submissions in 40+ countries; obesity decision expected in Q2 2026
