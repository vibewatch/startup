  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical, Regulatory, and IP Risks
        blocks:
          - type: paragraph
            body: >-
              The lead risk remains clinical failure dressed up as a timing risk. Verdiva’s investment case still rests
              primarily on VRB-101, a once-weekly oral ecnoglutide program that had completed phase 2b enrollment but
              had not disclosed topline efficacy or full tolerability data as of the run date. Public materials support
              the existence of EVOLVE-2, its >200-patient US design, and management’s aspiration to enter phase 3 in
              2027, but that path is explicitly conditional on positive data. In practice, positive is not enough: the
              asset must look differentiated versus an already approved Lilly obesity pill and a crowded oral / amylin
              pipeline, while also avoiding the discontinuation patterns that have derailed peer oral obesity programs.


              Regulatory risk is not merely generic biotech risk. FDA’s January 2025 draft guidance specifically
              addresses long-term maintenance of weight reduction, while WHO’s late-2025 obesity guideline makes only
              conditional recommendations for GLP-1 use because long-term efficacy, discontinuation, affordability, and
              health-system readiness are still incompletely resolved. That combination means Verdiva is developing into
              a moving evidentiary environment: the nearer-term phase 2b milestone is public and concrete, but the
              ultimate registration package may need broader or longer proof than current company messaging implies.


              Legal and IP risk are also real even without any disclosed litigation. Verdiva’s core portfolio is
              licensed from Sciwind on territorially carved-out terms and carries large milestone and royalty
              obligations. At the same time, public patent material shows dense formulation IP around oral peptide
              delivery and GLP-1 compositions. No public freedom-to-operate opinion or litigation disclosure was
              identified in the materials reviewed, so the prudent conclusion is not that IP risk is low, but that it
              remains unresolved pending diligence.
