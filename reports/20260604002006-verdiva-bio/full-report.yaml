      - number: '3.3'
        title: 'Next-Wave and Adjacent Pressure: Viking, Terns, Zealand, Pfizer, AstraZeneca'
        blocks:
          - type: paragraph
            body: >-
              The second tier of competition matters because it determines whether Verdiva's weekly-oral story will feel
              unique by the time VRB-101 is ready for pivotal work. Viking is especially important: the company already
              has both subcutaneous and oral VK2735, and the oral formulation produced up to 12.2% mean weight loss at
              13 weeks with no plateau, which is the sort of trajectory investors normally associate with category
              leaders rather than followers. If oral VK2735 reaches Phase 3 quickly, Verdiva will face a dual-agonist
              oral challenger with public-market access and an obvious injection-to-oral lifecycle strategy. Terns is
              the opposite lesson. Phase 1 looked respectable, but the later readout described by Fierce showed that
              subscale efficacy, high GI event rates, and liver injury signals can end the commercial case quickly.


              Adjacent programs also threaten Verdiva's planned combination wedge. Zealand's petrelintide is not an oral
              GLP-1, but it is directly relevant because it is a credible amylin-based weight-management platform with
              Roche attached and Phase 3 now planned. Pfizer's lotiglipron discontinuation and AstraZeneca's licensed
              elecoglipron program bookend the small-molecule risk-reward curve: Pfizer shows how liver signals can end
              a program, while AstraZeneca and Eccogene show that large pharma still wants oral GLP-1 assets badly
              enough to license and scale them. For Verdiva, those signals cut both ways - they validate demand for oral
              obesity drugs but also ensure the field stays crowded.
