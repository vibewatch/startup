      - number: '3.4'
        title: Moat Durability, Switching Logic, and Competitive Verdict
        blocks:
          - type: paragraph
            body: >-
              Verdiva's moat is real but narrow. The strongest part of the story is format differentiation: weekly oral
              peptide dosing is more distinctive than another daily small molecule, and the VRB-103 plus VRB-101
              combination concept gives Verdiva a reason to talk about maintenance, muscle preservation, and
              next-generation regimen design instead of just joining the me-too oral GLP-1 queue. The weakest part of
              the story is that almost every moat claim still depends on projected rather than observed human outcomes.
              Public data do not yet show the actual obesity efficacy, discontinuation burden, or head-to-head
              performance that would prove weekly oral dosing is enough to offset Verdiva's stage gap.


              Commercially, switching costs in obesity pharmacotherapy are low once an alternative can be prescribed, so
              share tends to accrue to products with better payer access, distribution scale, physician familiarity, and
              evidence density. That favors Lilly and Novo today, and it means Verdiva cannot win on route alone. The
              investment verdict is therefore nuanced: Verdiva is differentiated enough to matter, especially if peptide
              modality helps it avoid the liver issues that hurt some small molecules, but the company is still several
              evidence turns behind the leaders. The likely pressure on Verdiva is intense rather than existential: if
              EVOLVE-2 is strong, weekly oral dosing could earn a real lane; if not, the market will treat Lilly, Novo,
              Viking, Structure, and amylin-based combinations as better-capitalized substitutes.
