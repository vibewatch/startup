      - number: '8.4'
        title: Bull, base, and bear cases around the current entry price
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on Verdiva turning platform promise into clear lead-asset proof over the next 12 to
              18 months. That means a strong EVOLVE-2 readout in late 2026, a credible Phase 3 start in 2027, and
              evidence that weekly oral dosing and the cAMP-biased mechanism can compete on efficacy, tolerability, and
              convenience against a rapidly crowding oral field. If those conditions are met, the current mark can be
              re-read as an early strategic entry into a scarce obesity platform, and valuation can move into a
              low-to-mid $3B range or higher as investors start capitalizing both the lead asset and discounted amylin
              optionality.

              The base case is more modest: EVOLVE-2 works, but not so decisively that Verdiva escapes the need for
              another expensive proof cycle and continued head-to-head skepticism versus better-documented peers. In
              that world the valuation stays around flat to slightly down from the estimated Series A level because
              investors acknowledge a large market and real asset quality, but refuse to keep awarding scarcity
              multiples without company-specific differentiation. The bear case is harsher because obesity investors
              have shown they punish anything that looks second-best. Zealand's more-than-30% one-day drop after
              underwhelming mid-stage data is a reminder that this sector derates fast when expectations outrun
              evidence, and skeptical commentary such as Nemo's argues that recent obesity M&A has already inflated
              expectations. If Verdiva's next proof points are mixed, a down-round or financing reset becomes plausible.
