  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Round context and what the ~$2.5B mark is really buying
        blocks:
          - type: paragraph
            body: >-
              Verdiva launched in January 2025 with an oversubscribed $411M Series A co-led by Forbion and General
              Atlantic and backed by RA Capital, OrbiMed, Logos, Lilly Asia Ventures, and LYFE Capital. Independent
              coverage framed that raise as historically large for Europe: C&EN called it the biggest first financing
              ever for a European biotech, while Fierce quoted management calling it probably the largest UK biotech
              Series A. The key valuation complication is that the ~$2.5B figure is not company-disclosed; it appears as
              a Dealroom estimate quoted by PEDB, so the price anchor is directionally useful but not a fully documented
              cap-table fact. Even so, a $2.5B post-money estimate would imply only about 16% dilution on $411M raised,
              meaning investors likely underwrote substantial future clinical and strategic value at launch rather than
              paying only for present-stage proof.

              What they bought is a specific obesity platform thesis: a Phase 2-ready once-weekly oral GLP-1, plus oral
              and injectable amylin options, all licensed ex-Greater China and South Korea from Sciwind. The license
              economics are themselves strategic-scale, with about $70M upfront and more than $2.4B of downstream
              milestones plus royalties, which means Verdiva's Series A capital is funding development on top of a
              meaningful pre-existing rights burden. By June 2026 the lead program had advanced into Phase 2b, with
              EVOLVE-2 fully enrolled and topline data targeted for the end of 2026. So the launch valuation was never
              about today's revenue or commercial traction; it was a forward purchase on a large oral-obesity option
              package reaching its first decisive catalyst.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Why conventional DCF is weak here and why rNPV matters more
        blocks:
          - type: paragraph
            body: >-
              A standard DCF is the wrong primary tool for Verdiva because there are no operating cash flows to discount
              and because the existence, timing, and scale of future revenues depend on binary clinical and regulatory
              events that have not yet occurred. The valuation literature reviewed for this chapter makes the point
              directly: pre-revenue biotech companies often spend years without revenue, rely on milestone-based value
              creation, and should be framed using probability-weighted rather than straight-line cash-flow assumptions.
              That matters acutely for Verdiva because the lead asset has not yet produced publicly disclosed
              company-run Phase 2 efficacy data, the two amylin assets remain earlier, and the competitive oral-GLP-1
              field is moving quickly.

              The better framing is rNPV triangulated with disclosed strategic transactions. In that frame, investors
              value the lead oral GLP-1 on a probability-weighted path from EVOLVE-2 into Phase 3, then add heavily
              discounted option value for oral and injectable amylin follow-ons. The same methodology also makes the
              downside legible: early-stage assets typically carry much higher discount rates than late-stage programs,
              and small changes in probability of success can move present value dramatically. This is why Verdiva's
              current mark feels stretched on public evidence yet not irrational in strategic context. The market size
              backdrop is clearly large — anti-obesity drug forecasts cluster around an ~$8.7B 2026 market and a
              $65B-plus 2034-2035 market, while J.P. Morgan sees the broader incretin market reaching $200B by 2030 —
              but TAM alone does not eliminate stage risk. Investors are effectively paying for a probability-weighted
              shot at owning a scarce weekly oral obesity platform before the cleanest proof event arrives.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
