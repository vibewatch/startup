  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and disclosed asset map
        blocks:
          - type: paragraph
            body: >-
              Verdiva Bio's public product story is more specific than the prompt's small-molecule framing: the
              company's lead disclosed oral GLP-1 candidate is VRB-101, an oral peptide formulation of ecnoglutide
              rather than a named small-molecule program. The homepage, launch materials, and conference releases show a
              modular obesity portfolio built around once-weekly oral and injectable hormones: VRB-101 for GLP-1
              biology, VRB-103 for oral amylin, a VRB-101 plus VRB-103 oral combination path, and VRB-104 as a
              preclinical injectable dual-agonist. That architecture matters because Verdiva is trying to cover both
              weight-loss induction and maintenance with different mechanistic combinations instead of a single hero
              asset. The public record also shows a material disclosure boundary: although Verdiva licensed Sciwind's
              obesity portfolio, Verdiva's own materials do not clearly map a Verdiva code to Sciwind's separately
              disclosed oral small-molecule GLP-1 program. For diligence, that means the named and citable Verdiva oral
              GLP-1 product is the enhancer-enabled peptide VRB-101, while any small-molecule angle remains a
              portfolio-adjacency question rather than a cleanly disclosed company asset today.
