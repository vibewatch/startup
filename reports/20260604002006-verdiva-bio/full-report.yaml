companyProfile:
  summary: >-
    Verdiva Bio is a UK-incorporated clinical-stage obesity company that emerged publicly in January 2025 after
    licensing oral and injectable metabolic assets from Sciwind for markets outside Greater China and South Korea. Its
    lead program, VRB-101, is a once-weekly oral ecnoglutide candidate using the T2026 absorption enhancer and had
    advanced into the EVOLVE-2 Phase 2b obesity study by mid-2026. The disclosed portfolio also includes oral and
    injectable amylin programs, giving Verdiva a broader cardiometabolic option set than a single-asset startup. The
    company is unusually well capitalized for its stage after a $411M Series A co-led by Forbion and General Atlantic,
    but public disclosure remains thin on headcount, cash runway, governance rights, exact valuation terms, and the
    depth of CMC/IP support for the oral thesis.
