      - number: '6.5'
        title: Pharma BD demand is real, but Verdiva still faces concentration risk
        blocks:
          - type: paragraph
            body: >
              The obesity market is attracting unusual levels of business-development capital. Deloitte says obesity has
              displaced oncology as the largest contributor to late-stage pipeline value, while IQVIA counted more than
              193 obesity assets in development by late 2025. Roche's multibillion-dollar deal with Zealand for
              petrelintide shows that amylin assets now carry strategic value well before launch, which supports
              optionality for Verdiva's amylin portfolio. This is the strongest public evidence that Verdiva has a
              credible partner audience even without current customers.


              The same data also sharpen the risk. A crowded pipeline means Verdiva cannot rely on oral format alone,
              and it may be commercially dependent on a small number of future gating events: a successful Phase 2b
              readout, a financeable Phase 3 package, at least one payer pathway that proves the product is affordable
              enough to reimburse, and potentially one or two strategic BD outcomes that validate the platform. If any
              one of those channels slips, the company could find itself with broad market enthusiasm for obesity drugs
              but very limited practical access to end customers.
