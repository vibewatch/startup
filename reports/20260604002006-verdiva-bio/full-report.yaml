  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Verdiva's Starting Position
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set for Verdiva is broader than a simple list of oral GLP-1 pills. Buyers,
              prescribers, payers, and strategic partners can choose among at least four substitutes for the same
              obesity-treatment job: (i) marketed and near-file oral GLP-1s, led by Novo's oral semaglutide franchise
              and Lilly's submission-stage orforglipron; (ii) earlier-stage oral GLP-1 challengers such as Structure,
              Viking, and Terns; (iii) adjacent next-generation regimens that combine GLP-1 with amylin or GIP; and (iv)
              status-quo injectables from Lilly and Novo that set the efficacy benchmark and already control payer,
              physician, and patient mindshare. Verdiva therefore is not competing only on route of administration; it
              is competing on whether weekly oral dosing can close enough of the efficacy and tolerability gap to
              justify switching into a less mature product.


              Verdiva's starting position is credible but early. The company launched with $411 million, licensed global
              rights outside greater China and South Korea to a Sciwind obesity portfolio, and quickly moved VRB-101
              into a 200+ patient Phase 2b study. Its scientific pitch is clear: a cAMP-biased oral peptide GLP-1, based
              on ecnoglutide, with a proprietary oral absorption technology and projected once-weekly exposure that
              management argues can approach or exceed weekly injectable semaglutide. That claim matters because it
              differentiates Verdiva from the daily small-molecule oral programs. The problem is timing: while Verdiva
              is still proving dose selection and human efficacy durability, the category leaders already have either
              commercial oral infrastructure or late-stage packages.
            claimRefs:
              - CP001
              - CP002
              - CP003
