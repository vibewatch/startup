      - number: '5.5'
        title: Dependencies, IP posture, and public-disclosure risks
        blocks:
          - type: paragraph
            body: >-
              The strongest product-technology risk is not whether GLP-1 and amylin biology can work; the market has
              already answered that. The risk is whether Verdiva can prove that a partner-sourced peptide portfolio plus
              a proprietary enhancer can become a reproducible, scalable, defensible oral platform. Public evidence is
              thin on the parts investors need most for underwriting: patent-family specificity, T2026 chemistry,
              coformulation stability, detailed GI discontinuation behavior, food-effect exposure variability, and any
              manufacturing or quality system evidence behind the company's scalability claims. Even the
              developer-signal is mainly conference dissemination rather than peer-reviewed phase 2 outputs. That does
              not negate the platform, but it keeps the diligence burden high. In addition, the Sciwind licensing
              structure means Verdiva is operationally dependent on external portfolio provenance, tech-transfer
              quality, and aligned development priorities. The upshot is that Verdiva has a coherent product concept and
              real early clinical momentum, but its public package still supports the pharmacology story much better
              than the CMC, IP, and long-term tolerability story.
