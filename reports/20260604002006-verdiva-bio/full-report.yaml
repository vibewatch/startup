      - number: '7.4'
        title: Residual Exposure, Contradictions, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The biggest contradiction in the public record is straightforward: Verdiva markets a scalable,
              patient-friendly, weekly oral platform, while independent and quasi-primary sources still describe obesity
              pharmacotherapy as constrained by long-term safety, access, affordability, and manufacturing readiness.
              That contradiction does not prove failure, but it does mean investors should treat the current story as a
              thesis awaiting proof rather than a platform already validated in the market.


              A second contradiction concerns first-mover advantage. Verdiva and Sciwind position the lead asset as
              potentially first-in-class within weekly oral GLP-1s, but by 2026 the commercial reality is already
              defined by approved oral obesity therapy and multiple late-stage challengers. The consequence is that
              “weekly oral” cannot be valued as a category-creation claim on its own; it must translate into superior
              patient behavior, better tolerability, lower cost, or stronger maintenance outcomes.


              Accordingly, the underwriting framework should stay brutally milestone-based. A miss on EVOLVE-2 efficacy
              or discontinuation rates, an FDA request that materially enlarges the registration package, delayed CMC
              validation for T2026, a down-round or meaningful financing gap before phase 3, or departure of one of the
              core Aiolos-era operators should all be treated as thesis-break events rather than ordinary startup
              volatility. The chapter’s mitigation table therefore doubles as a kill-criteria checklist: Verdiva is
              investable only if those triggers continue moving in the right direction.
