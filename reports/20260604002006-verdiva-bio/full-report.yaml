      - number: '1.4'
        title: Milestones, scale markers, and public risks
        blocks:
          - type: paragraph
            body: >-
              The retained chronology shows a company that moved quickly from legal formation to financed clinical
              execution. After incorporation and renaming in 2024, October 2024 filings reset the board and share
              structure ahead of the January 2025 launch. The company then sustained a visible milestone cadence through
              scientific presentations, recognition, and clinical execution: ADA data in June 2025, EASD data in
              September 2025, a Fierce 15 selection later that month, EVOLVE-2 enrollment completion in February 2026,
              and fresh ADA abstract acceptance in May 2026. The cleanest scale markers are therefore not revenue or
              headcount, which remain undisclosed, but rather capital raised, the seven-plus disclosed leadership
              biographies, and the EVOLVE-2 footprint of 206 actual participants and 22 U.S. sites. Public risk signals
              are also visible. Companies House shows additional 2026 allotment filings without investor names or
              pricing, keeping ownership economics opaque. One General Atlantic page appears to mis-stamp the launch
              date as January 2024, a minor but real chronology conflict. More importantly, independent reporting puts
              Verdiva into an intensely crowded obesity race against Novo Nordisk, Eli Lilly, and multiple new entrants,
              while a broader 2026 biotech outlook still warns about valuation pressure, China competition, and
              regulatory unpredictability. That means Verdiva’s early public story is impressive, but it remains a
              well-funded execution case rather than a de-risked operating business.
