              financing context. External benchmarking suggests average Phase 1 development costs in the low
              single-digit millions, while Phase 2 efficacy studies typically cluster in the low-to-high teens of
              millions with 100 to 300 participants and 18 to 24 months of duration. EVOLVE-2 is already a substantial
