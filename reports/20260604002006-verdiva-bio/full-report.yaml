      - number: '5.2'
        title: VRB-101 mechanism, formulation, and PK logic
        blocks:
          - type: paragraph
            body: >-
              Mechanistically, VRB-101 combines a cAMP-biased GLP-1 peptide core with a proprietary oral absorption
              enhancer, T2026. The peer-reviewed ecnoglutide discovery paper gives confidence that the base peptide is
              not generic semaglutide mimicry: Sciwind engineered the molecule for potent cAMP signaling, limited
              receptor internalization, long half-life, and simpler manufacturing relative to some earlier peptide
              designs. Verdiva's own poster then extends that biology into an oral-delivery thesis, arguing that T2026
              improves bioavailability and gastric stability relative to SNAC and that the resulting plasma exposures
              can support weekly dosing. This is the heart of the product-technology bet. Oral peptide GLP-1 therapy
              usually fails on reproducibility, fasting burden, or poor exposure; Verdiva is claiming that peptide
              engineering plus the enhancer overcomes enough of those problems to get weekly rather than daily dosing.
              The encouraging part is that phase 1 public materials include a real randomized study design and modeled
              exposure targets. The unresolved part is that all of the key oral-formulation evidence remains
              poster-level and company-curated, without a peer-reviewed oral clinical paper, food-effect package, or
              public CMC detail for T2026.
            claimRefs:
              - CE009
