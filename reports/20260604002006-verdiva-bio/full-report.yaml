  - id: TP004
    title: Moat Durability and Competitive Risk Register for Verdiva
    columns:
      - Moat claim or risk
      - Evidence today
      - Main threat source
      - Severity
      - Diligence ask
    rows:
      - - Weekly oral peptide dosing is differentiated
        - Verdiva public materials position VRB-101 as once-weekly oral versus the mainly once-daily oral field
        - Lilly, Viking, and Structure can still win if daily efficacy and access are better
        - High
        - Need EVOLVE-2 human efficacy and dropout data by dose cohort
      - - Peptide modality may avoid some small-molecule liver risk
        - >-
          Lotiglipron was discontinued and TERN-601 later showed DILI-consistent cases, while Verdiva and Structure
          emphasize peptide or cleaner packages
        - Class-wide GI burden and unknown peptide-specific scale economics
        - Moderate
        - Need full liver, gallbladder, and GI dataset from EVOLVE-2
      - - Oral amylin combination optionality could extend franchise life
        - VRB-103 is positioned for additive combination with VRB-101
        - Novo amycretin and Zealand-Roche are already moving amylin biology into later-stage development
        - High
        - Need first-in-human VRB-103 timing and human combo tolerability plan
      - - Licensed-asset model speeds entry but weakens exclusivity story
        - Verdiva licensed core programs from Sciwind rather than originating the platform internally
        - Large pharma can license competing oral assets too, as AstraZeneca did with Eccogene
        - Moderate
        - Need detail on formulation IP, territorial protections, and control over CMC know-how
      - - Commercial power in obesity sits with established franchises
        - Lilly and Novo already own payer and prescriber attention in obesity and diabetes
        - Even good Verdiva data may face reimbursement and channel friction
        - Critical
        - Need planned launch partner strategy, pricing thesis, and payer-access assumptions
      - - Stage gap remains the single biggest risk
        - >-
          Verdiva is in Phase 2b while multiple rivals are late stage, marketed, or already planning phase 3
          combinations
        - Time-to-market compression can turn differentiation into a niche instead of a franchise
        - Critical
        - Need a realistic timeline from EVOLVE-2 to registrational studies and manufacturing readiness
    notes: >-
      Severity is an analytical judgment about competitive damage to Verdiva if the issue breaks unfavorably. The table
      mixes direct evidence and investor-style inference, and each row should be read as a diligence prompt rather than
      a verdict by itself.
