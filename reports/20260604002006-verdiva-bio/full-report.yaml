  - id: TM003
    title: Buyer / User / Payer Map for Oral GLP-1 Adoption
    columns:
      - Segment
      - Buyer / decision-maker
      - End user
      - Budget owner / payer
      - Adoption trigger
      - Access constraint
    rows:
      - - Commercial obesity treatment
        - Primary care physician and plan-approved prescriber
        - Adult with obesity or overweight plus comorbidity
        - Commercial plan, employer, PBM, or self-pay patient
        - Convenient oral option with competitive efficacy
        - Prior authorization and high out-of-pocket exposure
      - - Self-pay obesity channel
        - Patient plus telehealth / consumer-health intermediary
        - Needle-averse adult willing to pay cash
        - Household out-of-pocket budget
        - Lower-friction oral initiation and easier refill behavior
        - Price sensitivity and long-term persistence
      - - Diabetes-label oral GLP-1
        - Primary care and endocrinology prescribers
        - Adult with type 2 diabetes
        - Commercial insurance or Medicare Part D for covered indications
        - A1C lowering plus weight loss with oral convenience
        - Formulary placement and comparative efficacy versus incumbents
      - - Public coverage pathway
        - Government program plus prescriber documentation
        - Medicare or Medicaid beneficiary
        - Public payer budget
        - Label outside obesity exclusion or future policy reform
        - Weight-loss exclusion and uneven state Medicaid coverage
      - - Employer / PBM benefit design
        - Benefit manager and pharmacy committee
        - Covered employee population
        - Employer health budget or plan sponsor
        - Evidence of downstream medical-cost savings and adherence
        - Short-term budget shock and demand elasticity
    notes: >-
      The patient is the user but not always the economic buyer. Oral GLP-1 launches depend on payer and employer budget
      choices almost as much as on prescriber enthusiasm.
