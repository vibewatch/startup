  - id: FU001
    title: Future stakeholder journey map
    type: journey-map
    layout: wide
    summary: >-
      Six-stage journey from obesity diagnosis to durable repeat use, showing how Verdiva must satisfy patients,
      prescribers, payers, and regulators in sequence rather than winning a single enterprise sale.
    data:
      items:
        - label: Disease recognition
          detail: >-
            Adult patient and clinician identify obesity or overweight plus comorbidity as requiring pharmacologic
            support rather than lifestyle intervention alone.
        - label: Evidence review
          detail: >-
            Prescriber evaluates Phase 2b and later Phase 3 data for weight loss, safety, titration practicality, and
            maintenance potential.
        - label: Coverage determination
          detail: >-
            Payer or PBM decides whether the product is covered, under what prior-authorization criteria, and with what
            patient cost share.
        - label: First prescription
          detail: >-
            Patient starts therapy; administration burden, side effects, and education quality determine early drop-off
            risk.
        - label: Maintenance and refill
          detail: >-
            Repeat use depends on durable efficacy, tolerability, affordability, and whether prescribers believe the
            therapy supports weight-loss maintenance.
        - label: Platform expansion
          detail: >-
            Successful use of the lead GLP-1 could open combination, amylin, and partner-channel opportunities across
            broader cardiometabolic segments.
    approximationNotes: >-
      Journey is an analytical commercialization map, not a disclosed Verdiva go-to-market process. It synthesizes
      public payer, prescriber, and adherence evidence into the likely sequence of stakeholder gates.
    claimRefs:
      - CU002
      - CU004
      - CU014
      - CU031
      - CU037
      - CU042
