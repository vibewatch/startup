    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - EVOLVE-2 readout disappoints
        - Efficacy or tolerability fails to look clearly competitive for oral obesity therapy
        - Breaks the core weekly-oral differentiation thesis
        - Move from track toward avoid and expect valuation reset risk.
      - - Phase 3 path slips materially
        - No credible Phase 3 start path after late-2026 data
        - Extends financing duration and weakens rNPV support
        - Re-underwrite with higher discount rates and likely lower fair value.
      - - Competitive oral field outruns Verdiva
        - Peers show clearly better efficacy, convenience, or manufacturability
        - Shrinks strategic scarcity premium and exit optionality
        - Mark the current estimate as stretched and require lower entry.
      - - Financing structure proves unfavorable
        - Material preferences, aggressive dilution, or overhang from follow-on capital needs
        - Reduces common-equity return even if science works
        - Shift focus from asset quality to downside protection.
      - - Sector de-rates on weaker obesity data
        - Public or strategic comps sell off sharply after second-best outcomes
        - Compresses transaction comps used to defend the current mark
        - Tighten valuation range and assume down-round probability rises.
    notes: >-
      Kill triggers are observable events that can be monitored between EVOLVE-2 and any next financing or strategic
      process.
