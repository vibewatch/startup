      - number: '2.2'
        title: Epidemiology and Multi-Lens Market Sizing
        blocks:
          - type: paragraph
            body: >-
              The demand foundation is unusually strong. WHO estimates that more than 890 million adults were living
              with obesity in 2022, while CDC data show that 40.3% of U.S. adults had obesity and 9.7% had severe
              obesity in the latest NHANES-based update. On the diabetes side, the IDF estimates 589 million adults
              globally were living with diabetes in 2024, with more than 90% of cases being type 2 diabetes, and the CDC
              estimates 40.1 million people in the United States had diabetes in 2023. Those epidemiology figures define
              the broad clinical need, but the best financial sizing lens is the obesity-medicines market rather than
              the full patient pool. IQVIA estimates global obesity-medicine sales reached $66 billion in 2025 and will
              rise to $92 billion in 2026, with 2027-and-beyond scenarios spanning $105 billion to $200 billion. That
              range is wide, but it is already large enough to make oral differentiation commercially meaningful. The
              cleaner conclusion is that Verdiva is entering a category with blockbuster-scale demand; the harder
              question is how much of that demand can migrate from injections or from diabetes-label reimbursement into
              durable oral obesity treatment.
