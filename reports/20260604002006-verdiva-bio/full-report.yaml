      - number: '1.3'
        title: Series A syndicate and investor thesis
        blocks:
          - type: paragraph
            body: >-
              The central financing fact is clear: Verdiva emerged from stealth with an oversubscribed Series A of about
              $411 million, co-led by Forbion and General Atlantic, with RA Capital Management, OrbiMed, Logos Capital,
              Lilly Asia Ventures, and LYFE Capital also named publicly. Independent coverage made the size of the round
              itself a story, with Fierce describing it as possibly the largest UK biotech Series A and BioPharma Dive
              calling it one of the largest recent biotech financings in its dataset. The more interesting diligence
              point is why the round happened. Forbion said it was a founding investor, that the deal was the first
              investment out of its Growth Opportunities III fund, and that the thesis combined proven leadership,
              next-generation oral therapies, and a large cardiometabolic unmet need. Launch materials and General
              Atlantic messaging emphasized the same themes in product language: patient-friendly once-weekly oral
              dosing, scalable manufacturing, and the chance to broaden access. That thesis was not built on disclosed
              commercial traction. It was built on licensed science and execution confidence. Verdiva obtained rights
              outside Greater China and South Korea to Sciwind’s metabolic portfolio, and Sciwind’s own release says the
              deal carries about $70 million upfront plus more than $2.4 billion of milestones and royalties. The
              financing is therefore both a strength and a future obligation stack, and public materials still do not
              reveal the post-money valuation or fully diluted cap table that would show how much control the new
              syndicate actually bought.
