        title: Leadership bench and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The public leadership pack is stronger on operating pedigree than on governance transparency. Verdiva’s
              own biographies identify Khurem Farooq as chief executive and co-founder, with Jane Hughes, Mohamed Eid,
              Ashley Taylor, Tapan Maniar, Weidong Zhong, and Mark Pruzanski giving the company a bench drawn from
              Aiolos Bio, Gyroscope Therapeutics, Boehringer Ingelheim, Genentech, Roche, Bain Capital Life Sciences,
              and Sciwind. That is unusually experienced human capital for a newly launched private biotech and helps
              explain why investors were willing to back the platform at such scale. Public governance visibility is
              thinner. UK filings show eight officers and one resignation, with active directors including Farooq,
              Wouter Joustra, Mark Pruzanski, Carl Gordon, Graham Walmsley, Laura Smith, and Brett Zbar, but those
              filings do not disclose committee structure, observer rights, or exact investor control. They also do not
              support the user-brief names Knut Elstner or Tim Knöfel: after targeted searches and review of the
              retained public pack, no disclosed executive or director role for either person could be substantiated.
              The right working conclusion is that Verdiva’s operating bench is credible and relevant, while governance
              economics and any off-register private influence remain diligence items.
