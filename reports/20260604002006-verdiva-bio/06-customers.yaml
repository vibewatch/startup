chapter:
  number: 6
  title: Customers
  summary: |
    Verdiva Bio has no current commercial customers, so its future customer map is really a stakeholder conversion problem: patients with obesity need a more convenient therapy, prescribers need differentiated efficacy and tolerability, payers need affordability and utilization controls, and pharma partners need assets that can still stand out in an increasingly crowded obesity market. Public evidence supports strong category demand for oral and amylin-based obesity therapies, but Verdiva's commercial path remains gated by Phase 2b/3 execution, regulatory clearance, formulary access, and proving that a once-weekly oral peptide can deliver better durability than current GLP-1 benchmarks.
sections:
  - id: future-stakeholder-map
    title: Future customer map, not current customer proof
    body: |
      Verdiva is a precommercial clinical-stage company with no approved product and no disclosed revenue-generating customers. That makes this chapter less about current logos and more about the future conversion chain required for commercialization. The eventual economic buyer is likely to be a payer or pharmacy benefit design decision-maker, the prescribing decision sits with primary care physicians, obesity specialists, and endocrinologists, and the end user is an adult patient with obesity or overweight plus weight-related comorbidity. In parallel, Verdiva also needs pharma and regional commercialization partners to validate the platform and absorb late-stage execution risk.

      Public company materials consistently position Verdiva around patient-friendly, less-frequent-dosing oral therapies and combination options intended to improve access, adherence, and maintenance. That positioning matters because the company is trying to sell into a market where route of administration, persistence, reimbursement and combination potential are all part of the product definition. The oversubscribed $411 million launch financing also matters commercially: it does not prove demand from future prescribers or payers, but it does show that sophisticated biotech investors believe the obesity market is large enough and differentiated enough to support another entrant before any revenue exists.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
