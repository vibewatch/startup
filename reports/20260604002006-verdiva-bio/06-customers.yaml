callouts:
  - calloutType: insight
    title: No current customers means the diligence focus shifts to gatekeeper conversion
    body: |
      Verdiva does not yet need to prove renewal economics or logo retention. It needs to prove that it can clear a sequence of stakeholder gates: data strong enough for prescribers, a label broad enough for payers, economics acceptable to formularies, and platform optionality attractive enough for partners. That is a narrower but more fragile commercial story than a typical growth-stage customer chapter.
    claimRefs:
      - CU001
      - CU002
      - CU011
      - CU014
      - CU031
  - calloutType: strength
    title: Oral once-weekly positioning is aligned with observable market demand
    body: |
      Public analogs now show that oral obesity therapies can expand the market rather than merely cannibalize injectables. Prescriber surveys, early oral Wegovy uptake, and Verdiva's own positioning around access and maintenance all point in the same direction: convenience is commercially valuable if efficacy and tolerability remain competitive.
    claimRefs:
      - CU004
      - CU020
      - CU021
      - CU022
      - CU023
  - calloutType: risk
    title: The biggest commercial risk is persistence plus payer math, not lack of category demand
    body: |
      Payer-policy pilots and Medicare spend data prove obesity-drug demand is real. The harder problem is whether a new entrant can deliver enough refill durability and budget justification to survive prior authorization, rebate negotiations, and drop-off after initiation. Verdiva has no public data yet that answers that question.
    claimRefs:
      - CU029
      - CU031
      - CU032
      - CU036
      - CU037
