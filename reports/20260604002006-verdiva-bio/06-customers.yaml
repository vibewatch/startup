        - label: Payers / PBMs
          values:
            - High — spending and policy attention prove importance
            - Low — no price corridor or contracting evidence for Verdiva
            - Medium — BALANCE helps but prior auth remains
            - Medium — repeat-use economics are known to be a concern
        - label: Pharma partners
