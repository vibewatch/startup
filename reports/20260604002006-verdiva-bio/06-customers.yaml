        - Largest value pool; no Verdiva-specific preference or willingness-to-pay data
      - - PCPs, endocrinologists, obesity specialists
        - Prescriber / gatekeeper
        - Evidence of efficacy, tolerability, simple dosing, and reimbursement confidence
        - 2026 survey shows high intent to prescribe oral obesity agents
        - Critical adoption surface; no named KOL advocacy for Verdiva yet
      - - Payers, PBMs, Medicare / Medicaid plans, employers
        - Economic buyer / coverage gatekeeper
        - Budget-manageable obesity therapy with prior-auth controls and repeat-use value
        - GLP-1 spending and policy pilots show demand but also cost anxiety
        - Determines net access; no Verdiva price corridor or payer engagement disclosed
