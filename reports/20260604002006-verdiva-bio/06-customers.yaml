figures:
  - id: FU001
    title: Future stakeholder journey map
    type: journey-map
    layout: wide
    summary: >-
      Six-stage journey from obesity diagnosis to durable repeat use, showing how Verdiva must satisfy patients, prescribers, payers, and regulators in sequence rather than winning a single enterprise sale.
    data:
      items:
        - label: Disease recognition
          detail: >-
            Adult patient and clinician identify obesity or overweight plus comorbidity as requiring pharmacologic support rather than lifestyle intervention alone.
        - label: Evidence review
          detail: >-
            Prescriber evaluates Phase 2b and later Phase 3 data for weight loss, safety, titration practicality, and maintenance potential.
        - label: Coverage determination
          detail: >-
            Payer or PBM decides whether the product is covered, under what prior-authorization criteria, and with what patient cost share.
        - label: First prescription
          detail: >-
            Patient starts therapy; administration burden, side effects, and education quality determine early drop-off risk.
        - label: Maintenance and refill
          detail: >-
            Repeat use depends on durable efficacy, tolerability, affordability, and whether prescribers believe the therapy supports weight-loss maintenance.
        - label: Platform expansion
          detail: >-
            Successful use of the lead GLP-1 could open combination, amylin, and partner-channel opportunities across broader cardiometabolic segments.
    approximationNotes: >-
      Journey is an analytical commercialization map, not a disclosed Verdiva go-to-market process. It synthesizes public payer, prescriber, and adherence evidence into the likely sequence of stakeholder gates.
    claimRefs:
      - CU002
      - CU004
      - CU014
      - CU031
      - CU037
      - CU042
  - id: FU002
    title: Verdiva adoption funnel
    type: funnel
    layout: standard
    summary: >-
      Relative drop-off from broad obesity need to durable repeat use, emphasizing that patient prevalence dramatically overstates the number of patients who will become sustained reimbursed customers.
    data:
      items:
        - label: Total addressable obesity / overweight need
          value: 100
          detail: Broad population burden and unmet need
        - label: Clinically appropriate launch population
          value: 40
          detail: Adults matching likely label and comorbidity requirements rather than the whole obesity universe
        - label: Covered / reimbursable population
          value: 20
          detail: Patients whose payer permits access under formulary and prior-authorization rules
        - label: First prescriptions written
          value: 10
          detail: Patients whose prescribers choose the product over injectable or oral competitors
        - label: Early-treatment continuers
          value: 6
          detail: Patients who tolerate initiation and remain on therapy after initial side-effect and administration friction
        - label: Durable repeat users
          value: 3
          detail: Patients who persist long enough to generate meaningful refill economics and payer confidence
    approximationNotes: >-
      Funnel values are relative stage sizes, not disclosed Verdiva forecasts. They are anchored on public prevalence, reimbursement friction, and real-world GLP-1 persistence data to show where commercial attrition is likely to occur.
