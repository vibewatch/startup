  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: verdiva-retention-proof
      missingEvidence: Verdiva-specific persistence, refill, or patient-preference data showing that once-weekly oral dosing improves repeat use versus current GLP-1 benchmarks.
      whyItMatters: Repeat-use durability is the central missing input for underwriting customer lifetime value and payer confidence.
      diligencePath: Request modeled persistence assumptions, patient-support design, discontinuation mitigation plans, and any internal preference work tied to VRB-101.
      relatedQuestionRefs: [QU018]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: verdiva-pricing-and-formulary-strategy
      missingEvidence: Public or investor-level disclosure of Verdiva's target gross-to-net pricing corridor, reimbursement sequencing, and prior-authorization assumptions.
      whyItMatters: A drug can show strong clinical demand and still fail commercially if the payer math is unattractive.
      diligencePath: Ask management for launch archetype, target payer cohorts, proposed comparator set, and whether cash-pay channels are part of the base case.
      relatedQuestionRefs: [QU019, QU026]
      relatedTableRefs: [TU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-demand-proof-coverage
      missingEvidence: Named prescriber pilots, payer memoranda, LOIs, or regional commercialization discussions tied specifically to Verdiva rather than category analogs.
      whyItMatters: External proof points validate category demand, but they do not substitute for company-specific prelaunch buyer intent.
      diligencePath: Seek any named trial investigators willing to reference the asset, payer-science dialogues, or ex-US partner process evidence.
      relatedQuestionRefs: [QU019, QU024]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: prescriber-education-plan
      missingEvidence: Named obesity KOLs, education strategy, and evidence dissemination plan that could accelerate post-readout prescribing.
      whyItMatters: Strong data alone may not translate into prescriptions without credible medical-education and field-market development.
      diligencePath: Request the company's planned KOL map, congress strategy, and any advisory-board or investigator-engagement details.
      relatedQuestionRefs: [QU024, QU026]
