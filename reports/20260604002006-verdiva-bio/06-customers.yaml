      - - Regulators and guideline bodies
        - Approval / practice gatekeeper
        - Sustained efficacy, safety, maintenance, and appropriate patient selection
        - FDA and WHO frameworks are supportive but cautious
        - Not a paying customer but essential gate for all other segments
