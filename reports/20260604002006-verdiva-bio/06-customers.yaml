  - id: adoption-path-and-regulatory-gates
    title: Adoption runs through trials, regulators, and label design
    body: |
      Verdiva has moved beyond pure asset acquisition into operational execution: EVOLVE-2 has enrolled 206 participants across 22 U.S. sites, the company expects topline data by the end of 2026, and management says positive results could support a Phase 3 start in 2027. Those milestones are the first real bridge from investor enthusiasm to future customer conversion. Until that bridge is crossed, prescribers and payers are not evaluating a marketable product; they are evaluating an investigational thesis.

      Regulators remain a decisive gatekeeper. FDA's January 2025 obesity guidance makes clear that weight-reduction products are judged on sustained benefit, not short-lived signal generation, and frames long-term weight maintenance, safety, and endpoint design as core requirements. WHO's 2025 obesity guidance is directionally supportive of GLP-1 use, but it is explicitly conditional because of cost, long-term evidence gaps, and health-system readiness. In other words, Verdiva does not face a demand problem first; it faces an evidence problem first. Trial inclusion criteria also matter commercially, because EVOLVE-2 excludes recent GLP-1 exposure and diabetes, narrowing the first target population and reducing how much of the broad obesity market can be addressed at launch.
    claimRefs:
      - CU009
      - CU010
      - CU011
