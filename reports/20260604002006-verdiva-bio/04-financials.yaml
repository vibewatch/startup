- id: gtm-proxies-and-disclosure-limits
  title: GTM proxies and disclosure limits
  body: 'Traditional GTM and sales-efficiency metrics barely exist yet because Verdiva is not selling into a commercial channel.
    The observable proxies are developmental rather than commercial: a Phase 2-ready lead asset at launch, Phase 1 PK data
    presented at ADA in 2025, full enrollment of EVOLVE-2 by February 2026, and an explicit expectation of topline Phase 2b
    data by the end of 2026 with Phase 3 targeted for 2027 if results are positive. Management also frames the value proposition
    in commercially relevant language such as patient-friendly weekly oral dosing, scalability, and broader access, but those
    remain strategic aspirations rather than measured unit economics. The public record also stays unusually thin for underwriting.
    Companies House shows the entity is active and approaching its first accounts deadline, yet there are still no filed statutory
    accounts, no disclosed cash balance, no revenue, and no cap-table or valuation detail. In practice, GTM efficiency here
    means speed to a high-value clinical inflection, not CAC, payback, or retention.'
