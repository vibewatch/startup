company:
  name: Verdiva Bio
chapter:
  number: 4
  title: Financials
  summary: Verdiva is a pre-revenue clinical-stage obesity biotech whose $411 million launch financing is unusually large
    relative to Phase I/II benchmark costs and should fund the current EVOLVE-2 readout plus adjacent pipeline work. Public
    evidence still does not disclose cash on hand, burn, valuation, or Sciwind license economics, so runway can only be bracketed
    through scenario analysis rather than directly underwritten. The financial verdict is that near-term financing risk is
    deferred by the size and quality of the syndicate, but full pivotal obesity development likely still needs partnership
    capital, new equity, or both.
sections:
- id: revenue-model-and-pre-revenue-status
  title: Revenue model and pre-revenue status
  body: 'Verdiva currently looks like a classic pre-revenue clinical-stage biotech rather than a company with observable product
    revenue. Across the company website, launch materials, enrollment release, and independent trade coverage, the disclosed
    economic engine is still equity-funded drug development around VRB-101 and the amylin portfolio, not commercial sales.
    Public evidence supports only future monetization paths: eventual prescription product sales if VRB-101 or follow-on assets
    reach market; regional or strategic partnership upfronts, milestones, and royalties tied to licensed or co-developed assets;
    and broader business-development transactions if management expands the cardiometabolic portfolio. What is missing is
    just as important as what is disclosed: no public list pricing, no reimbursement strategy, no customer contracts, no product
    sales, and no realized revenue mix. Financially, that means this chapter has to underwrite Verdiva on milestone conversion
    and capital efficiency rather than on present-day revenue quality.'
