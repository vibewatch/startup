- id: capital-efficiency-and-clinical-cost-benchmarks
  title: Capital efficiency and clinical cost benchmarks
  body: 'Verdiva''s capital efficiency should be judged against both clinical cost benchmarks and obesity-peer financing context.
    External benchmarking suggests average Phase 1 development costs in the low single-digit millions, while Phase 2 efficacy
    studies typically cluster in the low-to-high teens of millions with 100 to 300 participants and 18 to 24 months of duration.
    EVOLVE-2 is already a substantial U.S. multicenter study, yet even an above-average Phase 2b budget is only one part of
    the cash equation: oral-delivery CMC, formulation work, amylin follow-ons, combination development, regulatory preparation,
    and core team costs all sit on top. That is why Verdiva''s $411 million raise stands out. BioPharma Dive, C&EN, and BioSpace
    all place the round among the largest obesity-startup financings of the current cycle, alongside peers such as Kailera
    and Metsera. The capital advantage is real, but so is the execution test: the company now needs to show that a megaround
    can buy differentiated clinical data rather than simply more time.'
