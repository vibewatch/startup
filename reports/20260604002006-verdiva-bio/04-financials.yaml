- id: capital-base-and-runway-framing
  title: Capital base and runway framing
  body: 'On gross capital raised, Verdiva is exceptionally well funded for a new European obesity biotech. The $411 million
    oversubscribed Series A, co-led by Forbion and General Atlantic with a blue-chip life-sciences syndicate behind it, was
    explicitly positioned to finance development of the existing assets and portfolio expansion. Relative to generic clinical
    cost benchmarks, that amount is far larger than a single Phase 1 or Phase 2 study budget and should comfortably fund the
    current 206-patient EVOLVE-2 study plus adjacent preclinical, CMC, and organizational work. But gross financing is not
    the same as available cash. Public materials do not disclose how much of the round remains on hand, what economics were
    attached to the Sciwind license, what burn is today, or whether additional assets have already consumed part of the budget.
    The most defensible framing is therefore milestone-based: Verdiva appears financed through its next major readout, but
    not fully de-risked against future capital needs.'
