- id: TI003
  title: Capital adequacy and use-of-funds frame
  columns:
  - item
  - public-value-or-status
  - evidence-basis
  - underwriting-read
  - diligence-ask
  rows:
  - - Gross Series A announced
    - $411M oversubscribed Series A
    - Company launch materials and multiple trade reports
    - Unusually large for a Series A and adequate for near-term clinical execution
    - Request gross-to-net bridge including fees and any contemporaneous secondary or option pools
  - - Public cash on hand
    - Undisclosed
    - No statutory accounts or company cash disclosure reviewed
    - Gross raise cannot be treated as current unrestricted cash
    - Request latest month-end cash, short-term investments, and restricted cash
  - - Public monthly burn
    - Undisclosed
    - No company burn guidance or filed accounts reviewed
    - Runway must be estimated indirectly rather than directly underwritten
    - Request monthly burn by R&D, G&A, and business development
  - - Working annual burn scenario
    - $70M-$130M estimated
    - Scenario derived from Phase 2 benchmark costs plus multi-asset pre-revenue biotech spend patterns
    - Suggests a high-eight-figure to low-nine-figure annual spend is plausible once trial, CMC, and portfolio work overlap
    - Request board-approved operating plan and sensitivity cases
  - - Gross runway on announced financing
    - ~3.2-5.9 years on the working burn scenario
    - Simple gross financing divided by estimated annual burn
    - Good enough for current readout and portfolio work, but not a substitute for disclosed cash runway
    - Request monthly runway model with base, upside, and delay cases
  - - Management-stated use of funds
    - Progress clinical development of existing assets and expand the cardiometabolic portfolio
    - Quoted in launch materials
    - Signals capital will be spread across development and external growth rather than just one study
    - Request budget split across VRB-101, amylin assets, CMC, and BD
  - - Next-round trigger
    - Likely before fully self-funding pivotal obesity development or additional in-licensing
    - Inferred from Phase 3 cost escalation and management comments about expensive Phase 3 studies
    - Financing risk is deferred to the next inflection rather than removed
    - Request financing trigger memo and minimum cash threshold for starting Phase 3
  - - Debt / project-finance obligations
    - No public debt or structured-finance obligations disclosed
    - Reviewed public sources did not surface debt facilities
    - No evidence of leverage today, but absence of disclosure is not proof of absence
    - Request debt schedule, covenants, and any royalty or synthetic-financing structures
