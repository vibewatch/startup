- id: TI004
  title: Phase I / II oral GLP-1 development cost benchmarks
  columns:
  - phase-or-study
  - benchmark-total-cost
  - benchmark-enrollment-or-duration
  - verdiva-read-across
  - implication
  rows:
  - - Phase I benchmark (ProRelix)
    - $5.26M average total cost
    - 39 average participants; $136,783 per patient
    - Useful baseline for the completed Australian Phase 1 work underlying VRB-101
    - Shows that Phase 1 alone cannot explain a $411M raise; most capital must support later stages and broader portfolio
      work
  - - Phase I benchmark (Abacum)
    - $1M-$2M typical range
    - Early-stage safety work; lower-cost than efficacy studies
    - Supports the view that early clinical proof is relatively cheap versus later obesity development
    - Verdiva's financing is clearly sized beyond simple Phase 1 replication
  - - Phase II benchmark (ProRelix)
    - $18.49M average total cost
    - 143 average participants; $129,777 per patient
    - Closer to EVOLVE-2 scale but still a generic benchmark
    - Even a full Phase 2 budget is only a fraction of the Series A
  - - Phase II benchmark (Abacum)
    - $7M-$20M typical range; $13.5M average
    - 100-300 participants; 18-24 months average duration
    - Comfortably brackets a typical mid-stage obesity efficacy study
    - Supports near-term adequacy but not full-pivotal self-funding
  - - EVOLVE-2 registry / company snapshot
    - 206 actual participants enrolled
    - 22 U.S. sites; study start 2025-11-25; primary completion estimated July 2026
    - Lead program is already consuming meaningful multicenter trial resources
    - The next financing debate will happen around Phase 3 readiness, not whether Verdiva could afford the current Phase 2b
  - - Phase 3 escalation signal
    - Management says Phase 3 obesity studies are large and expensive
    - Future-stage cost jump rather than current disclosed budget
    - Material burn acceleration is likely if EVOLVE-2 is positive
    - Investors should underwrite another capital event or partnership before full pivotal commercialization
  enumerationScope:
    coverage: partial
    basis: Benchmarks combine two external cost-estimation sources with the public EVOLVE-2 registry and company disclosures;
      they are directional, not Verdiva-specific budgets.
  notes: Clinical cost benchmarks are external averages. They should be used to frame order-of-magnitude capital needs, not
    as a substitute for Verdiva's internal study budget.
