  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash on hand, trailing monthly burn, and management's formal runway model.
    whyItMatters: Without direct cash and burn disclosure, the chapter can only bracket runway through rough external benchmarks
      and scenario analysis.
    diligencePath: Request the latest board or finance packet showing month-end cash, trailing six-month burn, and a 24-month
      base/upside/downside runway model.
    relatedQuestionRefs:
    - QI017
    - QI019
  - type: private-evidence-only
    severity: blocking
    topic: valuation-and-cap-table
    missingEvidence: Post-money valuation, ownership percentages, option pool, liquidation preferences, and any structure
      attached to the Series A.
    whyItMatters: Returns analysis, dilution risk, and downside protection cannot be modeled without the cap table and financing
      terms.
    diligencePath: Request the latest cap table, Series A term sheet, and a preference waterfall prepared by counsel or finance.
    relatedQuestionRefs:
    - QI018
    - QI023
  - type: private-evidence-only
    severity: material
    topic: sciwind-license-economics
    missingEvidence: Upfront, milestone, royalty, and manufacturing or supply obligations attached to the Sciwind rights package.
    whyItMatters: License economics can materially reduce usable cash and change the implied capital efficiency of the Series
      A.
    diligencePath: Request the executed Sciwind agreement summary and any board-approved payment schedule or contingent milestone
      tracker.
    relatedQuestionRefs:
    - QI024
  - type: private-evidence-only
    severity: material
    topic: margin-and-cmc
    missingEvidence: Dose economics, oral delivery CMC cost, clinical supply cost, and any gross-margin bridge for commercial
      scenarios.
    whyItMatters: Without unit-cost data, the chapter cannot assess whether Verdiva's patient-friendly weekly oral thesis
      also yields an attractive margin path.
    diligencePath: Request CMC budget, dose-manufacturing assumptions, supply-chain contracts, and a commercial gross-margin
      model for lead assets.
    relatedQuestionRefs:
    - QI025
  - type: private-evidence-only
    severity: material
    topic: commercialization-strategy
    missingEvidence: Launch sequencing, pricing corridor, payer strategy, regional partnering intent, and commercial hiring
      plan beyond Phase 2.
    whyItMatters: Future revenue quality and future capital needs are tightly linked to whether Verdiva plans to partner,
      self-commercialize, or pursue a hybrid approach.
    diligencePath: Request management's commercialization strategy memo, payer-access assumptions, and any partnering or IPO
      decision framework.
    relatedQuestionRefs:
    - QI027
  - type: private-evidence-only
    severity: material
    topic: asset-budget-allocation
    missingEvidence: An asset-by-asset budget showing how much of the Series A is earmarked for VRB-101, VRB-103, combinations,
      CMC, and new business development.
    whyItMatters: Capital efficiency cannot be judged fairly if the market only sees total financing but not how many programs
      it is meant to carry.
    diligencePath: Request a program budget by asset with milestone gates, resourcing assumptions, and contingency reserves.
    relatedQuestionRefs:
    - QI007
    - QI019
    - QI023
