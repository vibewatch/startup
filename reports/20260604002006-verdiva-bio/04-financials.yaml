- id: TI007
  title: Public financial gaps and diligence requests
  columns:
  - gap
  - why-it-blocks-underwriting
  - current-public-substitute
  - specific-diligence-path
  - severity
  rows:
  - - Cash balance and monthly burn
    - Without disclosed cash and burn, runway cannot be directly underwritten
    - Scenario ranges anchored on external cost benchmarks and milestone timing
    - Request current cash, trailing six-month burn, and 24-month runway model
    - blocking
  - - Post-money valuation and cap table
    - Without valuation and ownership data, dilution and return math are impossible
    - Only financing amount is public; valuation is not
    - Request latest cap table, option pool, and liquidation waterfall
    - blocking
  - - Sciwind license economics
    - Upfronts, milestones, and royalties could materially change usable cash runway
    - Public sources confirm the rights transfer but not economics
    - Request full Sciwind agreement economics and contingent payment schedule
    - material
  - - Gross margin / CMC cost stack
    - Oral peptide delivery economics and T2026 manufacturing cost are not disclosed
    - Company references scalability but gives no cost basis
    - Request CMC cost model, dose economics, and gross-margin bridge
    - material
  - - Commercialization and reimbursement plan
    - No payer or launch architecture is public, so future revenue quality is speculative
    - Only broad access and affordability aspirations are public
    - Request target geographies, payer strategy, and launch timing assumptions
    - material
  - - Audited or filed statutory financials
    - No public P&L, balance sheet, or cash flow statement is available yet
    - Companies House shows first accounts due in July 2026
    - Request audited 2025 accounts and 2026 management accounts
    - blocking
  - - Program-level budget by asset
    - Capital could be diluted across VRB-101, VRB-103, combo work, and new assets
    - Management says it will fund existing assets and expand the portfolio
    - Request asset-by-asset budget allocation and stop/go criteria
    - material
  enumerationScope:
