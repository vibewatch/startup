  title: Oral GLP-1 Adoption Flow and Friction Points
  type: flow
  layout: standard
  summary: The route to scale runs from patient eligibility through prescribing, coverage approval, initiation, and persistence; convenience helps at initiation, but cost and discontinuation dominate later-stage attrition.
