- id: TM001
  title: Verdiva Bio Market Definition — Included Spend, Excluded Spend, and Core Substitutes
  columns:
  - Segment
  - Included spend
  - Excluded / substitute
  - Primary buyer / payer
  - Why it matters
  rows:
  - - Obesity medicines
    - Branded anti-obesity pharmacotherapy and related pharmacy benefit spend
    - Bariatric surgery and lifestyle-only care are outside the core market
    - Commercial plans, employers, PBMs, self-pay patients
    - Core economic category measured by IQVIA and policy sources
  - - Oral GLP-1 obesity therapies
    - Oral obesity prescriptions, patient support, and cash-pay channels
    - Injectable GLP-1/GIP therapies are the main substitute
    - Primary care prescribers plus payer prior authorization
    - Direct route where Verdiva seeks differentiated adoption
  - - Oral GLP-1 diabetes therapies
    - Type 2 diabetes oral GLP-1 prescriptions reimbursed through diabetes label
    - Obesity-only reimbursement is usually excluded or narrower
    - Health plans, Medicare Part D for covered indications, PBMs
    - Provides the clearest reimbursement bridge and prescriber familiarity
  - - Injectable incretins
    - Weekly injectable obesity and diabetes spending
    - Not excluded; they are benchmark competitors
    - Broad commercial and public reimbursement for labeled indications
    - Set efficacy expectations and can slow switching unless oral convenience is compelling
  - - General obesity management
    - Nutrition counseling and behavior-change programs only when tied to drug adoption
    - Standalone wellness, surgery, and consumer fitness are outside this chapter TAM
    - Employers, providers, patients
    - Relevant as status-quo alternatives, not direct oral GLP-1 revenue pool
  notes: Boundary logic is inferred from Verdiva’s stated pipeline focus, current oral GLP-1 labeling, and obesity-market analyst framing; it is intended to define investable spend rather than total social cost.
