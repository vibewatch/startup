      label: Obesity / T2D clinical need
      detail: Large prevalence pool defined by WHO, CDC, and IDF epidemiology
    - id: prescriber
      label: Prescriber willingness
      detail: Primary care and endocrinology decide whether oral route changes behavior
    - id: coverage
      label: Coverage approval
      detail: Commercial plans, employers, PBMs, and public programs determine affordability
    - id: start
      label: Therapy initiation
      detail: Route convenience helps new starts, especially for needle-averse patients
    - id: persist
      label: Persistence / refill
      detail: GI effects, cost, and weight-regain anxiety drive early drop-off
    - id: value
      label: Long-term market value
      detail: Realized value depends on durable adherence and reimbursed volume, not only first script demand
    edges:
