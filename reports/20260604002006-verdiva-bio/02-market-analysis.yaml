    - Commercial plan, employer, PBM, or self-pay patient
    - Convenient oral option with competitive efficacy
    - Prior authorization and high out-of-pocket exposure
  - - Self-pay obesity channel
    - Patient plus telehealth / consumer-health intermediary
    - Needle-averse adult willing to pay cash
