- id: buyer-user-payer
  title: Buyer, User, Payer, and Reimbursement Path
  body: The user is the patient living with obesity or type 2 diabetes, but the buying path is mediated by prescribers and payers. In obesity, the practical buyer is often a commercial plan, PBM, employer, or self-paying patient, because Medicare still generally excludes drugs used for weight loss even while covering the same class for diabetes or cardiovascular risk-reduction indications. KFF’s coverage analysis shows the obesity indication remains the weak point in public reimbursement, and state Medicaid coverage is still uneven. That means oral GLP-1 launches benefit from two distinct commercialization routes. First, the diabetes-labelled oral GLP-1 pathway already has reimbursement muscle, prescriber familiarity, and pharmacy benefit infrastructure. Second, obesity-labelled orals can expand the market through self-pay, employer carve-ins, and commercial coverage where convenience improves acceptance. For Verdiva, the strategic implication is that payer access is at least as important
    as pharmacology. A clinically differentiated oral profile may still stall if coverage policy treats obesity as optional while continuing to finance the diabetes label for the same molecular class.
