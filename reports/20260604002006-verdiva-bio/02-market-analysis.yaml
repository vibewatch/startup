- id: oral-vs-injectable-adoption
  title: Injectable Versus Oral Preferences, Adoption Drivers, and Friction
  body: 'The central adoption question is whether oral GLP-1s expand the category or mainly steal share from injectables. Current evidence points to some of both, with convenience creating genuine category expansion. Lilly’s head-to-head ACHIEVE-3 data show an oral agent can outperform Novo’s existing oral semaglutide benchmark on A1C and weight loss, while physician survey data collected by Spherix and reported by Fierce Pharma suggest strong latent interest in oral obesity options, especially among primary care physicians. Oral dosing convenience matters because daily oral semaglutide still carries meaningful administration friction: RYBELSUS must be taken at least 30 minutes before food, beverage, or other oral medications with only a small amount of water. That leaves room for newer oral candidates to differentiate on convenience as well as efficacy. At the same time, injectables remain formidable. They have more real-world familiarity, proven double-digit weight loss, and entrenched
    formulary positions. The result is that oral GLP-1 adoption should be viewed less as a simple “pill beats needle” story and more as a route-specific segmentation story: oral therapy can open needle-averse or primary-care-led segments, but only if tolerability, adherence, and reimbursement improve versus existing options.'
