- id: growth-drivers-and-open-gaps
  title: Growth Drivers, Adoption Constraints, and Remaining Diligence Gaps
  body: 'The strongest growth drivers are straightforward: disease prevalence is massive, obesity has become one of the most valuable innovation categories in pharma, and large market researchers now describe 2026 as the inflection point when oral therapies, generic semaglutide, and broader geographic access begin reshaping the category. But those tailwinds are offset by three practical constraints. First, payer affordability is still unresolved, with annual GLP-1 list prices above $11,000 in the U.S. and policy analysts expecting aggressive prior authorization and formulary management as volume grows. Second, persistence remains weak: primary-care literature cites near-65% first-year discontinuation, usually driven by cost, adverse effects, and weight regain after stopping. Third, the public evidence base still does not isolate a clean oral-obesity TAM or durable once-weekly oral adherence curve for new assets like Verdiva’s VRB-101. That is why the most defensible conclusion is not a precise
    TAM/SAM/SOM stack. It is that Verdiva is entering a market with unquestioned demand, meaningful route-of-administration white space, and equally meaningful reimbursement and persistence risk that will determine realized value.'
