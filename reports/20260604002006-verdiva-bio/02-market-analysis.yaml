  evidenceGaps:
  - type: missing-source
    severity: material
    topic: oral-obesity-tam
    missingEvidence: A public, methodologically transparent estimate for the oral GLP-1 obesity subsegment that isolates obesity-only use from broader incretin sales.
    whyItMatters: Without a clean oral-obesity subsegment estimate, TAM and SAM can be overstated by leaning on the full obesity-medicines market or diabetes-adjacent spend.
    diligencePath: Request payer and channel data from management or a specialist market model that separates oral obesity, oral diabetes, and injectable substitution effects.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: net-pricing-and-coverage
    missingEvidence: Real net pricing, rebate levels, and coverage terms for oral GLP-1 obesity launches by employer, commercial, and public lines of business.
    whyItMatters: Gross list prices and policy summaries do not reveal the actual budget impact or speed of uptake in Verdiva’s likely launch channels.
    diligencePath: Obtain payer research, PBM channel checks, or confidential management materials showing target price corridor and expected authorization rates.
    relatedQuestionRefs:
    - QM015
    - QM022
    relatedTableRefs:
    - TM003
    - TM005
  - type: stale
    severity: material
    topic: long-run-persistence
    missingEvidence: Longitudinal real-world persistence data for once-weekly oral GLP-1 treatment rather than daily oral semaglutide or injectable benchmarks.
    whyItMatters: Convenience is central to Verdiva’s thesis, but the market outcome depends on whether convenience translates into better long-term refill and adherence behavior.
    diligencePath: Track real-world refill cohorts after launch or seek extension-study and pharmacy-claims evidence as soon as once-weekly oral products produce enough exposure time.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
    - TM005
  - type: conflicting-data
    severity: minor
    topic: market-forecast-dispersion
    missingEvidence: A reconciled methodology for comparing IQVIA sales forecasts, policy-spending scenarios, and epidemiology-driven market narratives.
    whyItMatters: Different sources size different things—drug sales, reimbursed volume, and social cost—so a naive average would be misleading.
    diligencePath: Maintain separate market lenses in the investment model and force each forecast to declare whether it measures patients, reimbursed scripts, or total drug sales.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
