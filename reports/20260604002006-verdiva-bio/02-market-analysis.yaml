- id: TM002
  title: Obesity and Oral GLP-1 Sizing Lenses
  columns:
  - Lens
  - Metric
  - 2024-2026 value
  - Forward trajectory
  - Implication for Verdiva
  rows:
  - - Global obesity burden
    - Adults living with obesity
    - 890000000
    - Still rising; obesity more than doubled since 1990
    - Clinical need is enormous even before narrowing to treatable, reimbursed patients
  - - U.S. obesity burden
    - Adult obesity prevalence / severe obesity prevalence
    - 40.3% / 9.7%
    - Nearly half of U.S. adults projected to have obesity by 2030
    - The U.S. remains the highest-value launch market but also the harshest payer market
  - - Global diabetes burden
    - Adults living with diabetes
    - 589000000
    - Projected 853 million by 2050; over 90% is type 2 diabetes
    - Diabetes provides adjacent reimbursement and prescriber familiarity for oral GLP-1s
  - - U.S. diabetes burden
    - People with diagnosed or undiagnosed diabetes
    - 40100000
    - Prediabetes pool remains far larger
    - Creates a large oral-therapy bridge market even if obesity coverage stays constrained
  - - Global obesity medicines market
    - List-price sales
    - $66B in 2025; $92B in 2026
    - $105B-$200B from 2027 onward
    - Verdiva does not need category creation; it needs share and durable access
  - - Economic burden lens
    - Global annual cost of overweight and obesity
    - $3T by 2030 (projected)
    - '>$18T by 2060 if trend persists'
    - Supports payer and policy interest but does not itself guarantee drug reimbursement
  notes: Table mixes epidemiology counts and market-value lenses intentionally to show why a single TAM number is misleading; the most defensible sizing frame is a stack of disease burden, reimbursed population, and drug-sales estimates.
