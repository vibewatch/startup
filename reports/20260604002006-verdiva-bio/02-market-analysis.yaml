- id: TM005
  title: Growth Drivers and Adoption Constraints for Oral GLP-1 Obesity Therapies
  columns:
  - Factor
  - Direction
  - Timing
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Massive obesity and diabetes prevalence
    - Driver
    - Current
    - WHO, CDC, IDF epidemiology
    - Category demand does not depend on awareness creation
    - Size addressable treated population after payer filtering
  - - Rapid obesity-medicines market expansion
    - Driver
    - Current to near term
    - IQVIA 2026 outlook; Deloitte GLP-1 boom analysis
    - Supports blockbuster revenue potential for differentiated entrants
    - Pressure-test market-size assumptions against net price erosion
  - - Convenience of oral administration
    - Driver
    - Near term
    - Lilly, Fierce Pharma, BioSpace, RYBELSUS label
    - Can unlock needle-averse and primary-care-led segments
    - Verify whether once-weekly oral dosing materially improves adherence
  - - Existing diabetes reimbursement pathway
    - Driver
    - Current
    - KFF, FDA label, RYBELSUS site
    - Oral diabetes channels can de-risk prescriber and payer education
    - Assess whether obesity pathway can piggyback on diabetes coverage
  - - Weight-loss coverage exclusion and patchy public reimbursement
    - Constraint
    - Current
    - KFF policy analysis and Medicare spending work
    - Limits obesity-only TAM realization despite strong demand
    - Map payer policy by line of business and state
  - - High price and utilization management
    - Constraint
    - Current to near term
    - KFF and ICER policy sources
    - Prior auth, formulary management, and out-of-pocket cost can slow uptake
    - Model net pricing and authorization denial rates
  - - Persistence and discontinuation risk
    - Constraint
    - Current to near term
    - AAFP review and IQVIA persistence commentary
    - Lifetime-value assumptions can be far too optimistic if early dropout remains high
    - Gather real-world persistence data once oral weekly therapy is in market
  notes: Factors are ranked for market relevance rather than scientific importance. The biggest uncertainty is not whether demand exists, but how much of it converts into reimbursed, persistent use.
