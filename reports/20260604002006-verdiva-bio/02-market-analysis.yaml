      label: Convenience and tolerability shape continuation
    - from: persist
      to: value
      label: Longer persistence increases lifetime value
    - from: coverage
      to: value
      label: Coverage breadth caps total reachable volume
  approximationNotes: Flow is schematic rather than contractual. It highlights where oral convenience helps and where payer or persistence friction still dominates.
