callouts:
- calloutType: strength
  title: Demand risk is low; conversion risk is high
  body: Obesity prevalence, diabetes prevalence, and obesity-medicine sales already establish very large category demand. The key diligence issue for Verdiva is not market existence but how much of that demand converts into reimbursed and persistent oral use.
  claimRefs:
  - CM004
  - CM012
  - CM015
  - CM016
- calloutType: insight
  title: Oral convenience matters most in primary-care and self-pay segments
  body: Physician-survey evidence and existing oral benchmark friction both suggest that oral GLP-1s can unlock patients who resist injections or prefer simpler initiation pathways. That benefit is strongest in PCP-led and cash-pay or employer-sponsored channels, not automatically across every payer segment.
  claimRefs:
  - CM027
  - CM032
  - CM033
  - CM039
- calloutType: risk
  title: Coverage policy can keep obesity TAM far below epidemiology TAM
  body: Public reimbursement remains structurally weaker for obesity than for diabetes or cardiovascular risk-reduction indications. Unless oral obesity therapies meaningfully change payer willingness, the addressable population will remain much smaller than headline obesity prevalence suggests.
  claimRefs:
  - CM021
  - CM022
  - CM023
  - CM041
- calloutType: risk
  title: Persistence is the hardest missing variable
  body: Even if oral GLP-1s improve initiation, the market still depends on whether patients stay on therapy. Existing reviews cite heavy first-year discontinuation driven by cost, side effects, and weight regain after stopping, leaving long-run revenue and health-outcome assumptions highly sensitive.
  claimRefs:
  - CM036
  - CM037
  - CM045
