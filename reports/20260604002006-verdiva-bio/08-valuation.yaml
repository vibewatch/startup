      - CV036
      - CV039
      - CV041
      - CV042

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Lead-asset dataset
        - Full Phase 1 VRB-101 efficacy, PK, and tolerability package, including dose-response and discontinuations
        - Public sources cite promise but do not let investors benchmark the asset cleanly versus oral peers
        - Request management data room and direct discussion with the CMO.
      - - Series A structure
        - Exact pre-money, post-money, percent sold, option pool treatment, and liquidation preferences
        - Return math cannot be trusted without the actual entry structure
        - Obtain charter, financing docs, and cap-table model.
      - - License economics
        - Program-by-program milestone burden, royalty tiers, sublicensing rights, and manufacturing obligations
        - The Sciwind deal may absorb more value than the headline round implies
        - Review definitive license agreement and any amendments.
      - - IP and freedom to operate
        - Patent scope on ecnoglutide oral formulation, T2026 enhancer, combinations, and territorial carve-outs
        - A strategic premium is hard to defend if exclusivity or enforceability is weaker than assumed
        - Commission IP counsel memo and chain-of-title review.
      - - CMC and scale economics
        - Manufacturing cost, supply plan, absorption-enhancer robustness, and quality controls for weekly oral dosing
        - Verdiva's access thesis depends on manufacturability and affordable scale
        - Review CMC package, process data, and CDMO plans.
      - - Runway to value inflection
        - Budget through EVOLVE-2 readout and Phase 3 initiation, including contingency capital needs
        - The current mark is far less attractive if a near-term insider round is required
        - Rebuild bottom-up cash runway with management assumptions.
    notes: >-
      These asks are the minimum set required to convert the chapter from a public-evidence track call into a fully underwritten investment decision.
    claimRefs:
      - CV040
      - CV041
      - CV042
