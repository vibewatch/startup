  - id: valuation-method
    title: Why conventional DCF is weak here and why rNPV matters more
    body: >-
      A standard DCF is the wrong primary tool for Verdiva because there are no operating cash flows to discount and because the existence, timing, and scale of future revenues depend on binary clinical and regulatory events that have not yet occurred. The valuation literature reviewed for this chapter makes the point directly: pre-revenue biotech companies often spend years without revenue, rely on milestone-based value creation, and should be framed using probability-weighted rather than straight-line cash-flow assumptions. That matters acutely for Verdiva because the lead asset has not yet produced publicly disclosed company-run Phase 2 efficacy data, the two amylin assets remain earlier, and the competitive oral-GLP-1 field is moving quickly.

      The better framing is rNPV triangulated with disclosed strategic transactions. In that frame, investors value the lead oral GLP-1 on a probability-weighted path from EVOLVE-2 into Phase 3, then add heavily discounted option value for oral and injectable amylin follow-ons. The same methodology also makes the downside legible: early-stage assets typically carry much higher discount rates than late-stage programs, and small changes in probability of success can move present value dramatically. This is why Verdiva's current mark feels stretched on public evidence yet not irrational in strategic context. The market size backdrop is clearly large — anti-obesity drug forecasts cluster around an ~$8.7B 2026 market and a $65B-plus 2034-2035 market, while J.P. Morgan sees the broader incretin market reaching $200B by 2030 — but TAM alone does not eliminate stage risk. Investors are effectively paying for a probability-weighted shot at owning a scarce weekly oral obesity platform before the cleanest proof event arrives.
    claimRefs:
      - CV013
      - CV014
      - CV015
