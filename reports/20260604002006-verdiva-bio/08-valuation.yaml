  evidenceGaps:
    - type: missing-source
      severity: material
      topic: series-a-terms
      missingEvidence: Exact pre-money and post-money valuation, percent sold, option-pool treatment, and liquidation preferences for the Series A.
      whyItMatters: These inputs determine whether the estimated ~$2.5B mark is merely rich or economically unacceptable for common-equity returns.
      diligencePath: Request the financing documents, cap-table model, charter, and investor-rights agreement from management.
      relatedQuestionRefs:
        - QV004
        - QV027
    - type: private-evidence-only
      severity: material
      topic: phase1-dataset
      missingEvidence: Full Phase 1 VRB-101 efficacy, tolerability, and PK dataset with enough detail to benchmark against oral GLP-1 peers.
      whyItMatters: The current valuation depends on believing in company-specific differentiation before EVOLVE-2 is public.
      diligencePath: Review the full clinical study report or management deck and compare it directly with peer oral-obesity datasets.
      relatedQuestionRefs:
        - QV009
        - QV030
    - type: missing-source
      severity: material
      topic: ip-cmc-license
      missingEvidence: Detailed patent, freedom-to-operate, manufacturing, and full license-obligation package for VRB-101, T2026, and the amylin assets.
      whyItMatters: Strategic scarcity value is fragile if the company lacks strong exclusivity, scalable oral manufacturing, or clean operating rights.
      diligencePath: Commission IP counsel review, inspect CMC documentation, and review the definitive Sciwind agreements.
      relatedQuestionRefs:
        - QV028
        - QV030
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set
      missingEvidence: A fuller disclosed universe of private obesity financings and transaction values across oral and amylin programs.
      whyItMatters: Many private valuations remain undisclosed, so the comparable table is a sampled decision set rather than a full market map.
      diligencePath: Pull subscription databases or banker books to widen the comp set beyond public disclosures.
      relatedQuestionRefs:
        - QV015
      relatedTableRefs:
        - TV004
    - type: missing-source
      severity: material
      topic: runway
      missingEvidence: Bottom-up cash runway and spending plan from the June 2026 point through EVOLVE-2 readout and Phase 3 initiation.
      whyItMatters: The attractiveness of today's entry price changes materially if another insider-led financing is needed before the next major value inflection.
      diligencePath: Rebuild runway from management budget, hiring plan, and trial spend assumptions.
      relatedQuestionRefs:
        - QV030
