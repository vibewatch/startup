company:
  name: Verdiva Bio
chapter:
  number: 8
  title: Valuation
  summary: >-
    Verdiva Bio's January 2025 launch with a $411M Series A is exceptional, and a Dealroom-derived estimate quoted by PEDB puts the round at up to roughly $2.5B — a price that already embeds meaningful success odds for weekly oral VRB-101 and follow-on amylin options. Strategic obesity transactions such as Metsera/Pfizer and Zealand/Roche show why investors can defend scarcity pricing for differentiated assets, but Verdiva is materially earlier on direct proof and still lacks public cap-table, detailed Phase 1, and CMC/IP disclosure. The result is a track recommendation: the mark is stretched on public evidence today, yet still defensible in a bull case if EVOLVE-2 reads cleanly and the company converts modality promise into Phase 3-ready evidence.
sections:
  - id: round-context
    title: Round context and what the ~$2.5B mark is really buying
    body: >-
      Verdiva launched in January 2025 with an oversubscribed $411M Series A co-led by Forbion and General Atlantic and backed by RA Capital, OrbiMed, Logos, Lilly Asia Ventures, and LYFE Capital. Independent coverage framed that raise as historically large for Europe: C&EN called it the biggest first financing ever for a European biotech, while Fierce quoted management calling it probably the largest UK biotech Series A. The key valuation complication is that the ~$2.5B figure is not company-disclosed; it appears as a Dealroom estimate quoted by PEDB, so the price anchor is directionally useful but not a fully documented cap-table fact. Even so, a $2.5B post-money estimate would imply only about 16% dilution on $411M raised, meaning investors likely underwrote substantial future clinical and strategic value at launch rather than paying only for present-stage proof.

      What they bought is a specific obesity platform thesis: a Phase 2-ready once-weekly oral GLP-1, plus oral and injectable amylin options, all licensed ex-Greater China and South Korea from Sciwind. The license economics are themselves strategic-scale, with about $70M upfront and more than $2.4B of downstream milestones plus royalties, which means Verdiva's Series A capital is funding development on top of a meaningful pre-existing rights burden. By June 2026 the lead program had advanced into Phase 2b, with EVOLVE-2 fully enrolled and topline data targeted for the end of 2026. So the launch valuation was never about today's revenue or commercial traction; it was a forward purchase on a large oral-obesity option package reaching its first decisive catalyst.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
