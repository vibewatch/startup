  - id: recommendation-and-diligence
    title: Recommendation, diligence asks, and thesis-break triggers
    body: >-
      The recommended posture is track rather than buy. Public evidence is strong enough to say the company is real, well financed, and operating in one of biotech's most attractive strategic categories, but not strong enough to underwrite the current estimated price with conviction. The direct proof gap remains too large: Verdiva's own detailed Phase 1 data are not public, the exact Series A valuation mechanics and preference stack are not public, and the CMC/IP package behind the T2026-enabled oral delivery thesis is not public. Put differently, the current mark appears to capitalize a material portion of future upside before the first company-controlled efficacy readout has arrived.

      The upgrade path is also clear, which is why this is not an avoid call today. A clean EVOLVE-2 outcome, better transparency on cap table and financing overhang, and diligence confirmation on license economics, manufacturing, and IP could justify moving from track to buy even without a lower price, because those items would convert speculative optionality into underwriteable probability. The downgrade path is equally clear: weak or merely average data, an unfavorable financing structure, or evidence that Verdiva's oral-differentiation story does not hold up against peers should move the stance toward avoid. In short, the valuation is best described as stretched but defensible — provided investors are honest that what defends it is future milestone probability, not present public proof.
    claimRefs:
      - CV031
