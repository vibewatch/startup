  - id: TP001
    title: 与 Verdiva 相关的直接和相邻肥胖症竞争对手画像
    enumerationScope:
      coverage: partial
      basis: >-
        Ten most decision-relevant direct and adjacent programs around oral obesity treatment as of June 2026,
        emphasizing oral incretins, oral amylin concepts, and major adjacent challengers.
    columns:
      - 项目 / 公司
      - 形态
      - 阶段（Jun-2026）
      - 最强公开疗效信号
      - 关键安全性 / 耐受性信号
      - 战略位置
    rows:
      - - VRB-101 / Verdiva
        - 每周一次口服肽类 GLP-1（ecnoglutide）
        - Phase 2b EVOLVE-2 已入组
        - Phase 1 PK 模型显示，每周口服 90 mg 的暴露量可匹配 2.4 mg SC semaglutide；120 mg 预计高于该水平
        - 公开数据仍早期；肥胖症疗效尚未公开读出
        - $411M A 轮；Sciwind 授权的大中华区 / 韩国以外权益；后续口服 amylin 增加组合选项
      - - Orforglipron / Lilly
        - 每日一次口服小分子 GLP-1
        - 申报阶段 / 主要项目 Phase 3 已完成
        - ACHIEVE-3 糖尿病头对头中，52 周减重 9.2%，口服 semaglutide 14 mg 为 5.3%
        - GI 不良事件符合类别特征；长期真实世界持久性和可负担性仍不确定
        - 大药企规模、40+ 国家监管申报、成熟肥胖症产品线
      - - 口服 semaglutide / Novo
        - 每日一次口服肽类 GLP-1
        - 已上市口服 semaglutide，加肥胖症 OASIS 项目
        - OASIS 综述称 OASIS 1、2、4 在体重减轻上优于安慰剂
        - 标签带有 GI、胰腺炎、胆囊和空腹服用负担
        - 既有口服 GLP-1 基准，并有处方医生培训优势
      - - 口服 amycretin / Novo
        - 每日一次口服 GLP-1 / amylin 激动剂
        - Phase 2 阳性；2026 年计划 Phase 3
        - 口服组 36 周最高减重 10.1%；SC 组 14.5%
        - 披露的 Phase 2 更新中，GI 事件多为轻度至中度
        - Novo 从 semaglutide 延伸到下一代组合生物学
      - - GSBR-1290 / Structure
        - 每日一次口服非肽小分子 GLP-1
        - 已准备进入 Phase 2b / 中期阶段
        - 12 周安慰剂调整后减重 6.2%；片剂 PK 研究最高 6.9%
        - 披露研究报告早期 GI AE 且逐渐减弱；未报告药物性肝损伤或持续肝酶升高
        - 上市生物科技公司，明确讲规模化和组合骨架叙事
      - - VK2735 口服 / Viking
        - 每日一次口服双重 GLP-1 / GIP 激动剂
        - Phase 2 阳性；口服 Phase 3 计划 2026 年后期启动
        - 13 周平均减重 12.2%，安慰剂调整后减重 10.9%
        - TEAE 多为轻度或中度；GI 事件随时间减弱
        - 同一分子也推进 Phase 3 皮下项目，带来生命周期灵活性
      - - TERN-601 / Terns
        - 每日一次口服小分子 GLP-1
        - Phase 2 后降优先级 / 搁置
        - Phase 1 在 28 天达到最高 4.9% 安慰剂调整后减重；随后 Phase 2 在 12 周最高 4.6%
        - Phase 2 出现恶心、呕吐、11.9% AE 停药，以及符合 DILI 的肝脏病例
        - 上市 biotech 未能跨过值得合作的差异化门槛
      - - Petrelintide / Zealand-Roche
        - 每周一次皮下注射 amylin 类似物
        - Phase 3 计划 2026 年 H2
        - Phase 1b 显示，4.8 mg 和 9.0 mg 维持剂量组 16 周减重 8.6% 和 8.3%
        - GI 事件多为轻度；Zealand 强调耐受性和瘦体重潜力
        - Roche 合作抬高了组合 / 维持定位上的相邻竞争压力
      - - Lotiglipron / Pfizer
        - 每日一次口服小分子 GLP-1
        - 2023 年终止
        - 项目在终止前已推进到进行中的 Phase 2
        - 转氨酶升高导致终止；未报告肝衰竭或症状
        - 口服小分子安全性尽调的重要负面先例
      - - Elecoglipron / AstraZeneca-Eccogene
        - 每日一次口服小分子 GLP-1
        - 中国 Phase 1b 阳性；计划全球 Phase 3
        - Eccogene 报告中国 16 周 Phase 1b 中，体重减轻和血糖改善具备临床意义
        - 中国 Phase 1b 研究未报告肝脏安全性信号
        - 大药企背书，但成熟度仍落后 Lilly 和 Novo
