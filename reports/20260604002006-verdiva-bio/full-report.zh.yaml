      - number: '5.3'
        title: 临床开发路径与使用场景工作流
        blocks:
          - type: paragraph
            body: >-
              Verdiva 的公开开发路径已经围绕肥胖治疗工作流塑形，而不只是分子科学。EVOLVE-2 被定位为减重诱导的剂量探索和滴定优化研究，约 206 名受试者，五个活性给药臂，一个安慰剂臂，进行 20
              周每周一次口服给药。终点组合直接且面向商业：相对基线的平均体重百分比变化，加上决定 Phase 3 如何推进所需的剂量和滴定信息。重要的是，Verdiva 还披露了一个单独的 Phase 2
              体重维持研究，说明公司围绕初始减重反应后的慢性使用来设计产品，而不是假设一种方案解决所有问题。这在战略上合理，因为口服疗法在诱导和维持阶段的经济性与依从性可能不同。弱点是，公开披露仍更强调入组里程碑、登记文本和未来顶线时间，而不是实际患者层面的耐受性或退出数据。在这些数据到来前，工作流逻辑可信，但临床运营模型仍只部分去风险。
