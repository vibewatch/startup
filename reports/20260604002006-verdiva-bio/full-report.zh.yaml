      - number: '3.4'
        title: 护城河耐久性、切换逻辑与竞争结论
        blocks:
          - type: paragraph
            body: >-
              Verdiva 的护城河真实存在，但很窄。故事最强之处是剂型差异化：每周一次口服肽给药比又一个每日小分子更独特，VRB-103 加 VRB-101 的组合概念，也让 Verdiva
              有理由讨论维持治疗、肌肉保留和下一代方案设计，而不是单纯加入跟随式口服 GLP-1
              队列。故事最弱之处在于，几乎每个护城河主张仍依赖预测，而不是已观察到的人体结果。公开数据尚未显示实际肥胖疗效、停药负担或头对头表现，无法证明每周一次口服给药足以抵消 Verdiva 的阶段差距。


              商业上，一旦替代方案可以开具，肥胖药物治疗的切换成本很低，所以份额往往流向支付方准入更好、分销规模更大、医生更熟悉、证据密度更高的产品。这今天有利于 Lilly 和 Novo，也意味着 Verdiva
              不能只靠给药路径取胜。因此，投资结论需要细分：Verdiva 足够差异化，值得关注，尤其如果肽模态帮助它避开伤害部分小分子的肝脏问题；但公司在证据上仍比领导者落后几轮。Verdiva
              面临的压力可能是强烈的，而不是生死攸关的：如果 EVOLVE-2 很强，每周一次口服给药可以赢得一条真实赛道；如果不强，市场会把 Lilly、Novo、Viking、Structure 和 amylin
              基础组合视为资本更充足的替代品。
