companyProfile:
  summary: >-
    Verdiva Bio 是一家在英国注册、处于临床阶段的减重公司。公司从 Sciwind 获得大中华区和韩国以外市场的口服及注射代谢资产授权后，于 2025 年 1 月公开亮相。其主导项目 VRB-101 是一款每周一次口服的
    ecnoglutide 候选药，采用 T2026 吸收增强剂，到 2026 年中已推进至 EVOLVE-2 Phase 2b 肥胖研究。已披露的管线还包括口服和注射 amylin 项目，让 Verdiva
    不只是单资产初创公司，而是拥有更宽的心血管代谢选择。Forbion 与 General Atlantic 共同领投的 $411M Series A
    轮，使公司在当前阶段资本异常充足；但公开披露在员工数、现金跑道、治理权利、准确估值条款，以及口服假设背后的 CMC/IP 支撑深度上仍很有限。
