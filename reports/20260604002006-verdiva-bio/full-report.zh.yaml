            body: >
              Verdiva
              还不需要证明续约经济性或客户标识留存。它需要证明自己能连续穿过一串利益相关方闸门：数据强到足以打动处方医生，标签宽到足以说服支付方，经济性被药品目录接受，平台可选性也足够吸引合作伙伴。这比典型成长期客户章节更窄，也更脆弱。
