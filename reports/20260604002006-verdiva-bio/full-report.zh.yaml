      - number: '7.3'
        title: 领导层、烧钱、现金和估值风险
        blocks:
          - type: paragraph
            body: >-
              2025 年 1 月的 A 轮对一家私营生物技术公司启动来说异常庞大，显然给了 Verdiva 比典型单资产肥胖初创公司更多空间。即便如此，管理层已经承认，肥胖 3 期项目规模大、成本高，IPO
              或追加融资仍是现实的未来路径。公开证据没有披露当前现金余额、月度烧钱、3 期预算或下一轮融资预期时间，因此关键问题不是公司今天是否资金充足，而是如果 EVOLVE-2
              只是不错、而非明确的品类领先，现有资本基础是否足以支持完整后期项目。


              行业条件会放大估值风险。英国融资数据显示，2025 年一季度风险投资活动集中在少数巨额交易上，包括 Verdiva，而不是广泛铺开。CNBC 2026 年对 Deloitte
              研发分析的报道指向另一项相关风险：肥胖已经成为药企管线价值如此核心的部分，以至于新进入者暴露在“泡沫效应”下——行业层面回报看起来强，但越来越容易受到治疗领域特定失望事件的冲击。对 Verdiva
              尤其如此，因为其融资规模可能已经嵌入了品类领导者预期，而不只是简单执行预期。


              关键人物依赖让资本问题更复杂。CEO、研发总裁、CTO
              和董事会主席都具备有意义的过往退出和药物开发资历，但同一事实也让风险集中在一个狭窄领导层小组上。团队信誉帮助公司融资并推进合作资产；如果其中一名或多名操盘手在核心项目前风险出清前离开，融资和合作议价力可能会比公开叙事暗示的更快变弱。
