  - id: TM002
    title: 肥胖和口服 GLP-1 规模测算视角
    columns:
      - 视角
      - 指标
      - 2024-2026 数值
      - 未来轨迹
      - 对 Verdiva 的含义
    rows:
      - - 全球肥胖负担
        - 肥胖成年人
        - 890000000
        - 仍在上升；肥胖人数自 1990 年以来增加超过一倍
        - 即便先收窄到可治疗、可报销患者，临床需求仍极大
      - - 美国肥胖负担
        - 成人肥胖患病率 / 重度肥胖患病率
        - 40.3% / 9.7%
        - 预计到 2030 年近一半美国成年人将患有肥胖
        - 美国仍是价值最高的上市市场，但也是支付方最严苛的市场
      - - 全球糖尿病负担
        - 糖尿病成年人
        - 589000000
        - 到 2050 年预计 8.53 亿人；超过 90% 为 2 型糖尿病
        - 糖尿病为口服 GLP-1 提供相邻报销和处方医生熟悉度
      - - 美国糖尿病负担
        - 已诊断或未诊断糖尿病人群
        - 40100000
        - 糖尿病前期人群池仍大得多
        - 即便肥胖覆盖仍受限，也能创造一个大型口服疗法桥接市场
      - - 全球肥胖药物市场
        - 标价销售额
        - 2025 年 $66B；2026 年 $92B
        - 2027 年起 $105B-$200B
        - Verdiva 不需要创造品类；它需要份额和持久准入
      - - 经济负担视角
        - 全球超重和肥胖年度成本
        - $3T，2030 年（预测）
        - 若趋势延续，2060 年 >$18T
        - 能支撑支付方和政策层面的关注，但本身不保证药物报销
    notes: 本表有意把流行病学人数和市场价值视角放在一起，说明单一 TAM 数字会误导；更稳妥的市场规模框架，是按疾病负担、可报销人群和药品销售额估算逐层叠加。
