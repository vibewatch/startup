  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 临床、监管和 IP 风险
        blocks:
          - type: paragraph
            body: >-
              首要风险仍是披着时间风险外衣的临床失败。Verdiva 的投资逻辑主要仍压在 VRB-101 上，这是一项每周一次口服 ecnoglutide 项目；截至运行日，该项目已完成 2b
              期入组，但尚未披露顶线疗效或完整耐受性数据。公开材料支持 EVOLVE-2 的存在、其超过 200 名患者的美国设计，以及管理层希望在 2027 年进入 3
              期的目标，但这条路径明确以正面数据为条件。实际情况是，正面还不够：该资产必须相对已经获批的 Lilly 肥胖口服药和拥挤的口服 / 胰淀素管线显得差异化，同时避开曾拖垮同类口服肥胖项目的停药模式。


              监管风险也不是泛泛的生物技术风险。FDA 2025 年 1 月的指南草案专门谈到减重长期维持；WHO 2025 年末的肥胖指南只对 GLP-1
              使用给出有条件推荐，因为长期疗效、停药、可负担性和卫生系统准备度仍未完全解决。这意味着 Verdiva 正在一个移动的证据环境中开发产品：较近期的 2b
              期里程碑公开且具体，但最终注册包可能需要比公司当前表述更宽或更长的证据。


              即便没有披露任何诉讼，法律和 IP 风险也真实存在。Verdiva 的核心组合来自 Sciwind 许可，条款按地域切分，并带有大额里程碑和特许权使用费义务。与此同时，公开专利材料显示，口服多肽递送和 GLP-1
              组合物周围的制剂 IP 很密。已审阅材料中没有发现公开的自由实施意见或诉讼披露，因此审慎结论不是 IP 风险低，而是风险仍待尽调澄清。
