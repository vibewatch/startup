      - number: '6.3'
        title: 更广市场证据支持口服肥胖疗法需求
        blocks:
          - type: paragraph
            body: >
              如果 Verdiva 的数据足够强，这个品类底盘足以支撑一个可信的商业化故事。WHO 称全球有超过 10 亿人受肥胖影响，CDC 估计美国有超过 1
              亿成年人患有肥胖。单靠这个人群负担并不能保证客户转化，但它解释了为什么在预算压力上升的情况下，处方医生、支付方和药企仍在扩大肥胖市场。


              更有用的参照是口服药上市和处方意愿数据。IQVIA 报告称，口服 Wegovy 上市八周内拿下了约三分之一的新品牌处方，其中大部分来自此前未用过任何 GLP-1 治疗的人，而不是简单换药。FiercePharma
              援引 Spherix 对约 100 名初级保健医生和内分泌科医生的调查发现，约 90% 的医生预计会在口服 semaglutide 上市后六个月内开具处方，超过 70% 的 PCP
              将其列为最偏好的在研肥胖药。这些信号对 Verdiva 有意义，因为它们说明便利性可以把市场做大，而不只是重新分配存量。但现有口服参照也说明便利性有边界：RYBELSUS 有严格的空腹要求，Lilly
              的头对头口服数据则显示，副作用导致的停药率高于口服 semaglutide。因此，Verdiva 需要证明的不只是“它是口服药”，而是每周一次的给药方式和多肽特征确实改善了用户体验。
