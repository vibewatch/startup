  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与已披露资产图谱
        blocks:
          - type: paragraph
            body: >-
              Verdiva Bio 的公开产品故事比提示中的小分子框架更具体：公司已披露的主导口服 GLP-1 候选药是 VRB-101，一种 ecnoglutide
              的口服肽制剂，而不是某个具名小分子项目。官网、发布材料和会议公告显示，公司围绕每周一次口服和注射激素搭建了模块化肥胖管线：VRB-101 负责 GLP-1 生物学，VRB-103 负责口服 amylin，另有
              VRB-101 加 VRB-103 的口服组合路径，以及作为临床前注射双激动剂的 VRB-104。这个架构重要，因为 Verdiva
              不是靠单个英雄资产，而是试图用不同机制组合覆盖减重诱导和维持治疗。公开记录也显示重要披露边界：虽然 Verdiva 授权了 Sciwind 的肥胖管线，但 Verdiva 自有材料并没有清楚地把某个
              Verdiva 代码映射到 Sciwind 单独披露的口服小分子 GLP-1 项目。对尽调而言，这意味着具名且可引用的 Verdiva 口服 GLP-1 产品，是由吸收增强剂支持的肽药
              VRB-101；任何小分子角度今天仍是管线相邻问题，而不是清晰披露的公司资产。
