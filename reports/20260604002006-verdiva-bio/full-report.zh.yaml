      - number: '7.2'
        title: 竞争、制造和合作方依赖
        blocks:
          - type: paragraph
            body: >-
              Verdiva 的产品逻辑在纸面上有吸引力——面向肥胖的每周一次口服多肽，后续还有口服和注射胰淀素项目——但上市以来，竞争背景已经明显变化。到 2026 年，Lilly 已经拥有 FDA
              批准的肥胖口服药，Structure、AstraZeneca、Pfizer 相关资产、Novo 项目以及多个胰淀素挑战者也在推进。这并不否定每周一次口服定位，但它大幅压缩了“足够好”的 2b
              期结果空间。Verdiva 不仅要证明减重效果，还要证明差异化依从性、耐受性、维持逻辑和最终定价能力。


              制造放大是第二个重大运营风险。Verdiva 反复称 T2026 已获临床验证，并且兼容可规模化制造，但公开证据没有披露批次可重复性、供应商地图、销货成本或工艺验证。口服多肽专利文献和 Sciwind
              自身评论都指向同一个结构性挑战：空腹胃内口服多肽吸收在技术上可行，但高度依赖制剂；行业仍把制造、可负担性和可靠准入视为开放问题，而不是已经解决的问题。


              依赖风险进一步强化上述两点。Verdiva 依赖源自 Sciwind 的资产和技术诀窍，依赖未来更大规模全球项目的临床执行，也依赖一个正由 Lilly 和 Novo
              塑造的市场准入环境。因此，每周一次口服故事同时暴露在三个外部角色之下：许可方、监管方和资本实力更强的既有巨头。只要任一支柱转向不利，公司估值会立刻受影响，因为公开证据中独立护城河仍很薄。
