  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与 Verdiva 的起点
        blocks:
          - type: paragraph
            body: >-
              Verdiva 的相关竞争集不只是简单的口服 GLP-1 药片名单。买方、处方医生、支付方和战略伙伴至少可在四类替代方案中选择，完成同一个肥胖治疗任务：(i) 已上市和接近申报的口服 GLP-1，以 Novo
              口服 semaglutide 系列和 Lilly 处于申报阶段的 orforglipron 为首；(ii) Structure、Viking 和 Terns 等更早期口服 GLP-1 挑战者；(iii) 将
              GLP-1 与 amylin 或 GIP 组合的相邻下一代方案；以及 (iv) Lilly 和 Novo 的现状注射剂，它们设定疗效标杆，并已控制支付方、医生和患者心智。因此，Verdiva
              竞争的不只是给药路径；它竞争的是每周一次口服给药能否足够缩小疗效和耐受性差距，从而让市场愿意切换到一个成熟度更低的产品。


              Verdiva 的起点可信，但仍早。公司以 $411M 启动，获得 Sciwind 肥胖管线在大中华区和韩国以外的全球权利，并迅速把 VRB-101 推进到一项 200 多名患者的 Phase 2b
              研究中。其科学卖点很清晰：基于 ecnoglutide 的 cAMP 偏向性口服肽 GLP-1，配有专有口服吸收技术，并预计可实现每周一次暴露；管理层称其可接近或超过每周一次注射
              semaglutide。这个说法重要，因为它让 Verdiva 区别于每日小分子口服项目。问题在时间：Verdiva 仍在证明剂量选择和人体疗效持久性，而品类领导者已经拥有商业化口服基础设施或后期数据包。
