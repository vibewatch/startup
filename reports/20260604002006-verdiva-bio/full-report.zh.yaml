        title: 图表
        blocks:
          - type: callout
            title: 当前判断
            body: 把 Verdiva 视为一个高质量肥胖平台，值得密切跟踪；但在 EVOLVE-2 和交易结构尽调之前，估计约 $2.5B 的价格还不是明确买入。
            calloutType: recommendation
            claimRefs:
              - CV031
              - CV038
          - type: callout
            title: 为什么这个价格并不荒唐
            body: 肥胖领域的战略稀缺性已经催生多十亿美元级融资、M&A 和合作交易，因此专业投资者可以合理化：为差异化口服平台提前支付高价。
            calloutType: insight
            claimRefs:
              - CV023
              - CV025
              - CV032
          - type: callout
            title: 什么最快打破投资逻辑
            body: 正如近期肥胖股票反应所示，一组仅仅平均水平的口服肥胖数据，就可能迅速摧毁稀缺性溢价。
            calloutType: risk
            claimRefs:
