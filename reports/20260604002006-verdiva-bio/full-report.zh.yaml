              带来异常强的未来融资或战略讨论网络。下行风险是预期膨胀。如此强的财团，本质上在承销同类最佳证据和清晰的 Phase 3 准备度；如果没有这些，未披露现金、现金消耗、估值和授权经济性的缺口只会变得更刺眼。
