      - number: '6.5'
        title: 药企 BD 需求真实存在，但 Verdiva 仍面临集中度风险
        blocks:
          - type: paragraph
            body: >
              肥胖市场正在吸引异常高的商务拓展资本。Deloitte 称，肥胖已经取代肿瘤，成为后期管线价值的最大贡献者；IQVIA 统计，到 2025 年底有超过 193 个肥胖资产在开发中。Roche 与 Zealand
              围绕 petrelintide 达成的数十亿美元交易说明，胰淀素资产在上市前很早就已经具备战略价值，这支撑了 Verdiva 胰淀素组合的可选性。这是最强的公开证据，说明即便眼下没有客户，Verdiva
              也有可信的潜在合作方受众。


              同一组数据也放大了风险。管线拥挤意味着 Verdiva 不能只靠口服形态，并且商业上可能依赖少数几个未来闸门事件：成功的 2b 期读出、可融资的 3
              期方案、至少一条支付方路径证明产品价格足够可报销，以及可能的一两个战略 BD 结果来验证平台。只要其中任一通道延迟，公司就可能面对一个普遍看好肥胖药的市场，却几乎拿不到终端客户的实际入口。
