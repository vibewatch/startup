      - number: '2.2'
        title: 流行病学与多视角市场测算
        blocks:
          - type: paragraph
            body: >-
              需求基础异常强。WHO 估计，2022 年全球超过 890M 成年人患有肥胖；CDC 基于最新 NHANES 更新的数据则显示，美国成年人肥胖率为 40.3%，重度肥胖率为 9.7%。糖尿病侧，IDF 估计
              2024 年全球 589M 成年人患有糖尿病，其中超过 90% 为 2 型糖尿病；CDC 估计 2023 年美国有 40.1M
              人患糖尿病。这些流行病学数字界定了广泛临床需求，但更好的财务测算视角是减重药市场，而不是全部患者池。IQVIA 估计，全球减重药销售额 2025 年达到 $66B，2026 年将升至 $92B；2027
              年及以后情景横跨 $105B 至 $200B。区间很宽，但已经足够大，让口服差异化具有商业意义。更干净的结论是，Verdiva
              正进入一个有重磅药物级需求的品类；更难的问题是，多少需求能从注射剂迁移过来，或从糖尿病标签报销迁移到持久的口服肥胖治疗。
