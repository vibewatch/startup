  - id: TP002
    title: 阶段、疗效和安全性对比：Verdiva 相比口服基准的位置
    enumerationScope:
      coverage: partial
      basis: >-
        The same ten most relevant programs are compared on the evidence points most likely to drive investor and
        partner triage: stage, dose schedule, efficacy, and known tolerability risk.
    columns:
      - 项目
      - 给药频率
      - 已发表或披露的关键减重信号
      - 肝脏 / 耐受性读穿
      - 对 Verdiva 的意义
    rows:
      - - VRB-101 / Verdiva
        - 每周一次口服
        - 尚无公开肥胖症疗效读出；相对每周 semaglutide 的建模 PK 是披露的主要差异点
        - 肥胖症验证层面未知；早期数据被表述为支持每周给药
        - 需要 EVOLVE-2 疗效，把差异化转化为竞争主张
      - - Orforglipron / Lilly
        - 每日一次口服，无食物 / 饮水限制
        - ACHIEVE-3 中 52 周减重 9.2%，口服 semaglutide 14 mg 为 5.3%
        - GI 特征符合类别；综述文章仍提示长期准入和持久性问题
        - 设定近期最难跨过的口服疗效和便利性门槛
      - - 口服 semaglutide / Novo
        - 每日一次口服，需遵守空腹 / 饮水时间说明
        - OASIS 综述称 OASIS 1、2、4 在肥胖症中优于安慰剂
        - 官方标签包含 GI、胰腺炎、肾脏 / 容量不足和胆囊警告
        - 每日口服肽类实用性和支付方熟悉度的基准
      - - 口服 amycretin / Novo
        - 每日一次口服
        - 口服组 36 周最高减重 10.1%
        - 公司称该特征安全且耐受性良好，GI 事件多为轻度至中度
        - 在 Verdiva 拿出人体组合数据前，就威胁其下一代组合叙事
      - - GSBR-1290 / Structure
        - 每日一次口服
        - 12 周安慰剂调整后 6.2%；片剂 PK 研究最高 6.9%
        - 披露研究未报告 DILI 或持续肝酶升高
        - 为小分子既可规模化又不伤肝提供可信案例
      - - VK2735 口服 / Viking
        - 每日一次口服
        - 13 周平均减重 12.2%，安慰剂调整后 10.9%
        - GI 事件多为轻度或中度；至第 13 周未见平台期
        - 当前同业中最激进的口服生物科技公司疗效信号
      - - TERN-601 / Terns
        - 每日一次口服
        - Phase 2 12 周最高安慰剂调整后 4.6%
        - Phase 2 出现 11.9% AE 停药和符合 DILI 的病例
        - 说明疗效平庸叠加肝脏信号，会迅速摧毁合作价值
      - - Petrelintide / Zealand-Roche
        - 每周一次 SC
        - Phase 1b 维持剂量组 16 周减重 8.6% 和 8.3%
        - GI 事件多为轻度；耐受性和瘦体重叙事是核心定位
        - 不是直接口服替代品，但会严重威胁 Verdiva 的 amylin 组合故事
      - - Lotiglipron / Pfizer
        - 每日一次口服
        - 没有后期疗效案例撑过开发
        - Phase 1 和 Phase 2 转氨酶升高导致终止
        - 强化对口服小分子骨架和肝脏安全性的尽调重点
      - - Elecoglipron / AstraZeneca-Eccogene
        - 每日一次口服
        - 中国 Phase 1b 称 16 周体重减轻具备临床意义
        - 该研究未观察到肝脏安全性信号
        - 又增加一个大药企进入者，但仍落后领先口服项目
    notes: 对比强调已披露信号，而非试图调和不同持续时间、患者人群和估计目标。Verdiva 仍处早期，因为目前没有公开 EVOLVE-2 疗效数据。
