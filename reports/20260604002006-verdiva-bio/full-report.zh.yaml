  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 轮次背景，以及约 $2.5B 估值真正买的是什么
        blocks:
          - type: paragraph
            body: >-
              Verdiva 于 2025 年 1 月启动，完成超额认购的 $411M A 轮，由 Forbion 和 General Atlantic 共同领投，RA Capital、OrbiMed、Logos、Lilly
              Asia Ventures 和 LYFE Capital 跟投。独立报道将这轮融资描述为欧洲历史上罕见的大额融资：C&EN 称其为欧洲生物技术公司史上最大首轮融资，Fierce
              则引用管理层说法称其可能是英国生物技术公司最大 A 轮。关键估值复杂点在于，约 $2.5B 不是公司披露数字；它是 PEDB 引用的 Dealroom
              估计，因此这个价格锚有方向参考价值，但不是完整记录的股权结构事实。即便如此，$2.5B 投后估计意味着 $411M 融资只带来约 16%
              稀释，说明投资者在启动时承销的是大量未来临床和战略价值，而不是只为现阶段证据付钱。

              他们买的是一个具体的肥胖平台假设：一个 2 期就绪、每周一次口服 GLP-1，加上口服和注射胰淀素选项，全部从 Sciwind 获得大中华区和韩国以外许可。许可经济本身就是战略级别，包含约 $70M 首付款和超过
              $2.4B 的后续里程碑付款加特许权使用费，这意味着 Verdiva 的 A 轮资金是在一个已有且不轻的权利负担之上资助开发。到 2026 年 6 月，核心项目已推进至 2b 期，EVOLVE-2
              完成全部入组，顶线数据目标在 2026 年底公布。因此，启动估值从来不是关于今天的收入或商业牵引，而是对一个大型口服肥胖期权包的远期购买；这个期权包正走向第一个决定性催化剂。
            claimRefs:
