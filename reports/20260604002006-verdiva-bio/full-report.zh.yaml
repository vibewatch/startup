  - id: FM002
    title: 口服 GLP-1 采用的买方-用户-支付方矩阵
    type: matrix
    layout: standard
    summary: 口服 GLP-1 采用取决于便利性在哪里重要、谁为治疗买单：自费和商业肥胖渠道重视易用性，公共项目仍主要受适应症报销规则支配。
    data:
      columns:
        - 商业肥胖覆盖
        - 自费 / 现金支付
        - 公共覆盖路径
        - 糖尿病适应症路径
      rows:
        - label: 主要患者群体
          values:
            - 寻求覆盖药物治疗的肥胖成年人
            - 愿意现金支付、抗拒针剂的成年人
            - 受法律或项目规则限制的受益人
            - 需要血糖控制兼体重获益的 2 型糖尿病成年人
        - label: 预算所有者
          values:
            - 雇主、健康计划、PBM
            - 家庭预算
            - Medicare / Medicaid 项目规则
            - 覆盖适应症下的商业计划或 Medicare Part D
        - label: 口服为何重要
          values:
            - 可能提升基层医疗采用和续方意愿
            - 避开针剂抗拒，拓宽进入点
            - 只有覆盖路径存在时才重要
            - 借助既有口服认知和覆盖基础设施
        - label: 主要门槛摩擦
          values:
            - 事先授权和价格
            - 初期减重后的持续用药
            - 减重排除条款或州政策不均
            - 与成熟品牌的处方集竞争
