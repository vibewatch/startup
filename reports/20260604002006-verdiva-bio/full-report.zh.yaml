  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Verdiva Bio 的相关市场不是全部肥胖照护，甚至也不是全部 GLP-1 支出。可投资边界更窄：面向肥胖、伴并发症超重，以及口服给药会改变采纳行为的 2 型糖尿病患者的口服 GLP-1
              和相邻代谢药物治疗。Verdiva 自身定位也符合这一框架。公司称其主导资产 VRB-101 是用于肥胖的每周一次口服 ecnoglutide 制剂，并把便利性和对患者友好作为核心差异化，因此它直接对标现有口服
              semaglutide 标杆，也间接对抗注射 GLP-1 或 GLP-1/GIP 疗法。纳入支出因此覆盖品牌减重药、可作为商业桥梁的口服 GLP-1
              糖尿病处方，以及为长期治疗买单的支付方或自费渠道。排除支出包括减重手术、泛健康订阅和大多数仅靠生活方式的干预，尽管这些仍是现状替代品。最重要的替代品是每周一次注射剂，而不是非药物照护，因为它们设定疗效门槛，并已经塑造医生预期。
