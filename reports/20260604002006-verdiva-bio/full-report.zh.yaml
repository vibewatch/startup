  - id: TM001
    title: Verdiva Bio 市场定义——纳入支出、排除支出和核心替代品
    columns:
      - 细分
      - 纳入支出
      - 排除 / 替代
      - 主要买方 / 支付方
      - 为什么重要
    rows:
      - - 肥胖药物
        - 品牌抗肥胖药物治疗及相关药房福利支出
        - 减重手术和仅生活方式干预不属于核心市场
        - 商业保险计划、雇主、PBM、自费患者
        - IQVIA 和政策来源衡量的核心经济品类
      - - 口服 GLP-1 肥胖疗法
        - 口服肥胖处方、患者支持和现金支付渠道
        - 注射 GLP-1/GIP 疗法是主要替代品
        - 初级保健处方医生加支付方事前授权
        - Verdiva 寻求差异化采用的直接路径
      - - 口服 GLP-1 糖尿病疗法
        - 通过糖尿病标签报销的 2 型糖尿病口服 GLP-1 处方
        - 仅肥胖报销通常被排除或更窄
        - 医疗保险计划、覆盖适应症下的 Medicare Part D、PBM
        - 提供最清晰的报销桥梁和处方医生熟悉度
      - - 注射肠促胰素
        - 每周一次注射肥胖和糖尿病支出
        - 不排除；它们是基准竞争对手
        - 获批适应症下广泛的商业和公共报销
        - 设定疗效预期；除非口服便利性足够强，否则会减慢切换
      - - 一般肥胖管理
        - 营养咨询和行为改变项目，仅在与药物采用绑定时纳入
        - 独立健康管理、手术和消费者健身不属于本章 TAM
        - 雇主、服务提供方、患者
        - 作为现状替代方案有意义，但不是直接口服 GLP-1 收入池
    notes: 边界逻辑根据 Verdiva 声明的管线重点、当前口服 GLP-1 标签和肥胖市场分析师框架推断；目的在于定义可投资支出，而不是总社会成本。
