      - number: '3.2'
        title: Lilly、Novo 和 Structure 设定口服标杆
        blocks:
          - type: paragraph
            body: >-
              Lilly 是 Verdiva 最重要的直接压力点，因为 orforglipron 已经更像临近上市资产，而不是科学项目。Lilly 称全球申报正在推进，预计美国肥胖适应症将在 2026 年 Q2
              有监管行动，并在 ACHIEVE-3 中显示，每日一次 orforglipron 可在血糖控制和减重上超过口服 semaglutide，同时避开食物和饮水限制。即便 ACHIEVE-3 是糖尿病研究，它也告诉
              Verdiva 商业买方会关心什么：口服便利性、临床上有意义的减重，以及小分子形式下的制造可扩展性。Novo 仍是既有口服参照，因为口服 semaglutide 已经教育医生和患者接受每日口服 incretin
              治疗，哪怕方案仍有空腹要求和熟悉的 GLP-1 胃肠道警示。


              Novo 也重要，因为它没有停留在口服 semaglutide 上。Amycretin 把 Novo 推向 GLP-1 加 amylin 生物学的下一代，并从高端市场压迫 Verdiva
              的组合假设。Structure 是最相关的中型市值口服 GLP-1 同行，因为 GSBR-1290 已经显示有意义的 12
              周疗效，肝脏表述比那些已终止的小分子失败项目更干净，并且明确围绕全球规模讲述非肽制造故事。合在一起，Lilly、Novo 和 Structure 为 Verdiva
              设定了三道不同门槛：后期执行、口服品类既有地位，以及具备可扩展化学基础的可信生物科技公司级疗效。
