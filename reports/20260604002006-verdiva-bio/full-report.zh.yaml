      - number: '1.2'
        title: 领导团队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开领导层更强在运营履历，而不是治理透明度。Verdiva 自有履历资料显示，Khurem Farooq 是 CEO 兼联合创始人；Jane Hughes、Mohamed Eid、Ashley
              Taylor、Tapan Maniar、Weidong Zhong 和 Mark Pruzanski 则让公司拥有来自 Aiolos Bio、Gyroscope Therapeutics、Boehringer
              Ingelheim、Genentech、Roche、Bain Capital Life Sciences 和 Sciwind
              的团队底座。对一家新近推出的私营生物科技公司来说，这样的人才资本很少见，也解释了投资人为何愿意以如此规模支持平台。公开治理可见度则弱得多。英国备案显示有八名高管和一项辞任，现任董事包括 Farooq、Wouter
              Joustra、Mark Pruzanski、Carl Gordon、Graham Walmsley、Laura Smith 和 Brett
              Zbar，但这些文件不披露委员会结构、观察员权利或投资人控制权细节。它们也无法支持用户简报中的 Knut Elstner 或 Tim
              Knöfel：经过定向检索并复核保留的公开材料，没有证据能证实二人在公司担任已披露的高管或董事角色。合理的工作结论是，Verdiva
              的运营班底可信且高度相关；但治理经济性，以及任何不在登记册上的私下影响力，仍是尽调项。
