      - number: '1.4'
        title: 里程碑、规模标记与公开风险
        blocks:
          - type: paragraph
            body: >-
              保留下来的时间线显示，公司从法律设立到获得融资并进入临床执行，推进很快。2024 年注册和更名之后，2024 年 10 月的备案在 2025 年 1
              月发布前重置了董事会和股本结构。随后，公司通过科研展示、荣誉和临床执行维持了可见的里程碑节奏：2025 年 6 月 ADA 数据、2025 年 9 月 EASD 数据、同月入选 Fierce 15、2026 年
              2 月完成 EVOLVE-2 入组，以及 2026 年 5 月新的 ADA 摘要获接收。因此，最干净的规模标记不是收入或员工数——二者仍未披露——而是已募集资本、七位以上已披露领导层履历，以及 EVOLVE-2
              的 206 名实际受试者和 22 个美国中心。公开风险信号同样可见。Companies House 显示 2026 年还有增发备案，但没有投资人名称或定价，所有权经济性继续不透明。General Atlantic
              的一个页面似乎把发布日期误标为 2024 年 1 月，这是小问题，但确实造成时间线冲突。更重要的是，独立报道把 Verdiva 放入一场拥挤的肥胖赛跑，对手包括 Novo Nordisk、Eli Lilly
              和多个新进入者；更广泛的 2026 年生物科技行业展望也继续警示估值压力、中国竞争和监管不可预测性。也就是说，Verdiva 早期公开故事很亮眼，但它仍是一宗资金充足的执行案例，而不是已经去风险的运营型公司。
