      - number: '5.4'
        title: Amylin 扩展及相对其他口服 GLP-1 路径的定位
        blocks:
          - type: paragraph
            body: >-
              Verdiva 不只依赖 VRB-101。公司用 VRB-103 和 VRB-104 扩大产品表面，并主张其肥胖平台可服务那些需要超过单一 GLP-1 机制的患者。VRB-103
              海报有意义，因为它不只是泛泛谈组合：它显示与 VRB-101 在啮齿动物中产生叠加减重效果、在共制剂食蟹猴片剂中两种肽暴露都被保留，并且受体谱明确围绕 amylin
              生物学设计。这给公司提供了一条可信的口服双激素路线图。不过，竞争门槛正在快速升高。HRS-7535 和 orforglipron 等小分子口服 GLP-1 项目正在发布 Phase 2 和 Phase 3
              数据，即便它们不是已披露的 Verdiva 资产，也很重要。它们展示了非肽口服 GLP-1 能承诺什么：没有注射负担、更容易做组合，且在 Lilly 案例中没有食物或饮水限制。这个对比对 Verdiva
              有利也有压迫。如果暴露保持强劲，每周一次口服肽给药可以形成差异化；但依赖增强剂的肽递送可能不如最好的小分子替代品那样无摩擦。
