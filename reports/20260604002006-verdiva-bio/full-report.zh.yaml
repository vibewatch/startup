      - number: '3.3'
        title: 下一波和相邻压力：Viking、Terns、Zealand、Pfizer、AstraZeneca
        blocks:
          - type: paragraph
            body: >-
              第二梯队竞争重要，因为它决定当 VRB-101 准备进入关键研究时，Verdiva 的每周一次口服故事是否还显得独特。Viking 尤其重要：公司已经同时拥有皮下和口服 VK2735，口服制剂在 13 周产生最高
              12.2% 的平均减重，且未见平台期。这类轨迹通常让投资人联想到品类领导者，而不是追随者。如果口服 VK2735 很快进入 Phase 3，Verdiva
              将面对一个有公开市场融资能力、并拥有明显注射转口服生命周期策略的双激动剂口服挑战者。Terns 则给出相反教训。Phase 1 看起来不错，但 Fierce
              所描述的后续读出显示，疗效规模不足、高胃肠道事件率和肝损伤信号会迅速终结商业论证。


              相邻项目也威胁 Verdiva 计划中的组合切口。Zealand 的 petrelintide 不是口服 GLP-1，但直接相关，因为它是一个可信的 amylin 基础体重管理平台，背后有 Roche，Phase
              3 也已计划推进。Pfizer 终止 lotiglipron 与 AstraZeneca 授权 elecoglipron 项目，分别框定了小分子风险收益曲线的两端：Pfizer
              说明肝脏信号可以终结一个项目；AstraZeneca 和 Eccogene 则说明大型制药公司仍然非常想要口服 GLP-1 资产，愿意授权并放大规模。Verdiva
              看到的是一体两面：这些信号验证了口服减重药需求，也确保赛道持续拥挤。
