      - number: '6.4'
        title: 报销和重复使用风险将决定真实商业价值
        blocks:
          - type: paragraph
            body: >
              公共支付方证据说明，报销才是核心商业瓶颈。KFF 和 CMS 数据显示，在肥胖广泛覆盖之前，GLP-1 使用量和支出已经快速上升：2024 年 Medicare Part D 对 GLP-1 的总支出达到
              $27.5 billion，当年有 200 万 Part D 参保人使用 Ozempic。CMS 的 BALANCE 模型和 Medicare GLP-1 Bridge
              表明，肥胖药可及性正在扩大，也包括口服产品，但它们没有取消支付方闸门。事前授权、谈判后的资格标准、药企参与以及州或计划的选择加入，仍决定一款获批肥胖药能否真正触达患者。


              重复使用是第二个商业约束。ICER 和 AAFP 都强调，现实世界中的肥胖药持续用药很弱，原因包括副作用、成本和长期治疗疲劳。公共基准显示，许多患者在第一年内停药，能在两年时仍留在治疗上的人很少。对
              Verdiva 来说，最终的商业问题不只是有多少患者能开始使用
              VRB-101，而是有多少人能持续治疗到足以产生耐久续方收入和支付方信心。若没有证据证明每周一次的口服多肽能实质改善持续用药，公共肥胖市场需求转化出的真实客户终身价值，可能远低于患病率头条数字暗示的水平。
