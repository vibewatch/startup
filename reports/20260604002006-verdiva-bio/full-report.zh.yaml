            body: >-
              按已募集总资本看，作为一家新的欧洲减重生物科技公司，Verdiva 资金异常充足。由 Forbion 和 General Atlantic 共同领投、背后有蓝筹生命科学财团支持的 $411M 超额认购
              Series A，明确用于支持现有资产开发和管线扩张。相对于通用临床成本基准，这一金额远高于单个 Phase 1 或 Phase 2 研究预算，应能从容资助当前 206 名患者的 EVOLVE-2
              研究，以及相邻临床前、CMC 和组织建设工作。但总融资不等于可用现金。公开材料没有披露这轮资金还剩多少、Sciwind
              授权附带了什么经济条款、当前现金消耗是多少，或新增资产是否已经消耗部分预算。因此，最可辩护的框架是里程碑导向：Verdiva 看起来已获得资金，可撑到下一个重大读出，但尚未完全去除未来资本需求风险。
