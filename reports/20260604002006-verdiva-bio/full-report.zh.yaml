              传统 GTM 和销售效率指标几乎还不存在，因为 Verdiva 尚未进入商业渠道销售。可观察代理指标偏开发而非商业：发布时已有可进入 Phase 2 的主导资产，2025 年在 ADA 展示 Phase 1 PK
              数据，2026 年 2 月完成 EVOLVE-2 全部入组，并明确预计 2026 年底给出 Phase 2b 顶线数据；若结果积极，2027 年目标启动 Phase
              3。管理层也用具备商业相关性的语言描述价值主张，例如对患者友好的每周一次口服给药、可扩展性和更广可及性，但这些仍是战略愿景，而不是可测量单位经济。公开记录对承销也异常稀薄。Companies House
              显示实体处于存续状态，并接近首份账目截止日期，但仍没有已提交法定账目、没有披露现金余额、没有收入，也没有股权结构或估值细节。实际而言，这里的 GTM 效率不是 CAC、回本期或留存，而是多快抵达高价值临床拐点。
