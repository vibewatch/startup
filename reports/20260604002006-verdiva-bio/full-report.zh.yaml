  - id: TI003
    title: 资本充足性与资金用途框架
    columns:
      - 项目
      - 公开数值或状态
      - 证据基础
      - 核算解读
      - 尽调问题
    rows:
      - - 已宣布 Series A 轮总额
        - $411M 超额认购 Series A 轮
        - 公司发布材料及多篇行业报道
        - 对 Series A 轮而言异常庞大，足以支撑近期临床执行
        - 要求提供从总额到净额的桥接，包括费用及同期任何老股交易或期权池
      - - 公开在手现金
        - 未披露
        - 未审阅到法定账目或公司现金披露
        - 融资总额不能直接视为当前不受限现金
        - 要求提供最近月末现金、短期投资和受限现金
      - - 公开月烧钱速度
        - 未披露
        - 未审阅到公司烧钱速度指引或已提交账目
        - 现金跑道只能间接估算，无法直接核算
        - 要求按 R&D、G&A 和业务开发拆分月烧钱速度
      - - 工作版年度烧钱情景
        - 估计 $70M-$130M
        - 情景来自 2 期基准成本，以及多资产、尚未产生收入的生物科技公司支出模式
        - 一旦试验、CMC 和管线工作重叠，年度支出落在高八位数到低九位数区间是合理的
        - 要求提供董事会批准的运营计划和敏感性情景
      - - 按已宣布融资额计算的总现金跑道
        - 工作版烧钱情景下约 3.2-5.9 年
        - 简单用融资总额除以估计年度烧钱速度
        - 足够支撑当前读出和管线工作，但不能替代已披露现金跑道
        - 要求提供月度现金跑道模型，包含基准、乐观和延迟情景
      - - 管理层所述资金用途
        - 推进现有资产临床开发，并扩展心血管代谢管线
        - 引自发布材料
        - 表明资金会分配给开发和外部增长，而不只是一项研究
        - 要求提供 VRB-101、胰淀素资产、CMC 和 BD 预算拆分
      - - 下一轮融资触发点
        - 可能出现在公司完全自筹关键性肥胖症开发或追加授权引进之前
