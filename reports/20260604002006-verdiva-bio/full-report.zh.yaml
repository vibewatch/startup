  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 领先资产数据集
        - 完整 Phase 1 VRB-101 疗效、PK 和耐受性包，包括剂量反应和停药情况
        - 公开来源提到潜力，但不足以让投资人把该资产与口服同行干净对标
        - 向管理层索取数据室材料，并与 CMO 直接讨论。
      - - Series A 结构
        - 精确投前估值、投后估值、出售比例、期权池处理和清算优先权
        - 没有实际入场结构，回报测算不可信
        - 获取章程、融资文件和股权结构模型。
      - - 授权经济条款
        - 分项目里程碑负担、版税梯度、再授权权利和制造义务
        - Sciwind 交易吸走的价值可能高于首轮标题数字暗示
        - 审阅最终授权协议及所有修订。
      - - IP 和自由实施
        - ecnoglutide 口服制剂、T2026 吸收增强剂、组合方案和地域排除条款的专利范围
        - 如果独占性或可执行性弱于假设，战略溢价很难站住
        - 委托 IP 律师备忘录和权属链审查。
      - - CMC 和规模经济
        - 周服口服给药的制造成本、供应计划、吸收增强剂稳健性和质量控制
        - Verdiva 的可及性论点靠可制造性和可负担规模支撑
        - 审阅 CMC 包、工艺数据和 CDMO 计划。
      - - 跑到价值拐点的资金续航
        - 覆盖 EVOLVE-2 读数和 Phase 3 启动的预算，包括应急资本需求
        - 如果近期需要内部人续投轮，当前标记吸引力会低得多
        - 用管理层假设自下而上重建现金续航。
    notes: 这些问题是将本章从基于公开证据的“跟踪”判断，转成完整承销投资决策的最低集合。
