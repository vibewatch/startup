            - 持续依赖授权方 / 伙伴 know-how
    approximationNotes: 可能性分组是定性判断，仅基于公开证据；EVOLVE-2 顶线数据和任何监管反馈出现后，应立即更新。
    claimRefs:
      - CR003
      - CR010
      - CR015
      - CR022
      - CR037
      - CR043
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要传导路径是 2b 期 / CMC / 竞争 -> Phase 3 论证延后或变弱 -> 资本依赖 -> 估值受损。
    data:
      nodes:
        - id: n1
          label: EVOLVE-2 不及预期
          detail: 疗效或停药率达不到竞争门槛
        - id: n2
          label: 监管包扩大
          detail: 需要更长 / 更广的研究
        - id: n3
          label: CMC 放大延误
          detail: T2026 / peptide 验证滞后
        - id: n4
          label: 口服竞争者抢先
          detail: Lilly / Structure / 其他公司抬高基准
        - id: n5
          label: 关键人物离职
          detail: 管理层高度集中，连续性被打断
        - id: n6
          label: Phase 3 启动推迟
          detail: 注册计划向右延后
        - id: n7
          label: 资金需求上升
          detail: 去风险前需要更多现金
        - id: n8
          label: 谈判筹码变弱
          detail: 以溢价条款融资或合作更难
        - id: n9
          label: 估值重置
          detail: 下轮估值下调，或战略价值降低
        - id: n10
          label: 投资逻辑破裂
          detail: 每周一次口服叙事不再支撑溢价投资判断
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n8
        - from: n5
          to: n8
        - from: n6
          to: n7
        - from: n7
          to: n8
        - from: n8
          to: n9
        - from: n1
          to: n10
        - from: n4
          to: n10
        - from: n9
          to: n10
    approximationNotes: 图中呈现的是方向关系，不是概率判断；少数运营失误可能层层叠加，最后传导到融资和估值。
    claimRefs:
      - CR003
      - CR010
      - CR016
      - CR022
      - CR030
      - CR037
      - CR044
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Verdiva 夹在许可方、监管方、集中的领导班子，以及大型口服减重药既有玩家之间；这些玩家共同塑造证据门槛和定价预期。
    data:
      nodes:
        - id: d1
          label: Sciwind
          detail: 许可方、上游技术诀窍、地域切分
        - id: d2
          label: FDA / 监管机构
          detail: 审批和证据门槛把关方
        - id: d3
          label: 核心领导团队
          detail: CEO、CMO、R&D、CTO、董事长
        - id: d4
          label: 合同生产商 / 供应商
          detail: 未披露的商业化 CMC 网络
        - id: d5
          label: 投资者 / IPO 市场
          detail: 未来 Phase 3 资金来源
        - id: d6
          label: Lilly / Novo / 口服挑战者
          detail: 竞争与定价基准制定者
        - id: d7
          label: 支付方 / 医疗系统
          detail: 准入和可负担性筛选关口
        - id: d8
          label: Verdiva Bio
          detail: 当前运营中心
      edges:
        - from: d1
          to: d8
        - from: d2
          to: d8
        - from: d3
          to: d8
        - from: d4
          to: d8
        - from: d5
          to: d8
        - from: d6
          to: d8
        - from: d7
          to: d8
        - from: d8
          to: d5
        - from: d8
          to: d7
    approximationNotes: 这张图是依赖关系快照，不是法律所有权图；未披露的生产商和私营交易对手以概念方式呈现。
    claimRefs:
      - CR015
      - CR021
      - CR023
      - CR031
      - CR038
      - CR047
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从市场顺风和战略稀缺性出发，再看证明与结构缺口，最后落到「跟踪」结论。
    data:
      nodes:
        - id: market
          label: 市场顺风
          detail: 减重药和更广泛的肠促胰素市场快速扩张，口服剂型打开新的触达渠道。
          tone: positive
        - id: scarcity
          label: 战略稀缺性
          detail: Kailera、Metsera、Zealand/Roche 证明，差异化肥胖药资产能拿到异常高的融资和交易对价。
          tone: positive
        - id: proof
          label: 直接证据缺口
          detail: Verdiva 仍缺少公司自己生成且公开的 Phase 2 疗效数据，也缺少已披露的详细 Phase 1 对标。
          tone: warning
        - id: structure
          label: 结构缺口
          detail: 准确股权结构条款、CMC 包和更完整的许可义务尚未公开。
          tone: warning
        - id: valuation
          label: 估计入场价约 $2.5B
          detail: 相对已披露证明偏贵，但仍低于更后期的肥胖药战略交易锚点。
          tone: warning
        - id: verdict
          label: 结论——跟踪
          detail: 升级前先等 EVOLVE-2 和尽调闭环；如果数据或结构不及预期，要准备退出。
          tone: neutral
      edges:
        - from: market
          to: valuation
          label: 支撑溢价
        - from: scarcity
          to: valuation
          label: 支撑溢价
        - from: proof
          to: verdict
          label: 挡住买入
        - from: structure
          to: verdict
          label: 挡住买入
        - from: valuation
          to: verdict
          label: 要求纪律
    approximationNotes: null
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV032
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 按阶段调整、以十亿美元计的估值锚点，展示估算 Series A 估值相对谨慎、基准、乐观和战略上限参照点的位置。
    data:
      items:
        - label: 悲观情景重置
          value: 1
          detail: EVOLVE-2 数据好坏参半，或板块估值下修，会把价值压向下轮估值下调区间。
          tone: negative
        - label: 基准情景三角测算
          value: 2.2
          detail: 数据为正但差异化不清，会让估值相对估算值大致持平。
          tone: neutral
        - label: 估算 Series A 估值
          value: 2.5
          detail: PEDB 引用的、源自 Dealroom 的 Verdiva 启动估值估算。
          tone: warning
        - label: 乐观情景三角测算
          value: 3.8
          detail: EVOLVE-2 干净，加上可信的 Phase 3 路径，可支撑更高稀缺性溢价。
          tone: positive
        - label: Metsera 首付款战略锚点
          value: 4.9
          detail: 不含额外 CVR 支付前，Pfizer 对 Metsera 给出的初始企业价值。
          tone: positive
        - label: Zealand 合作总额上限
          value: 5.3
          detail: 包含里程碑在内，Roche/Zealand 围绕 petrelintide 的总对价。
          tone: positive
    approximationNotes: 柱形将已披露交易锚点与本章估算混合，供 IC 使用；它们不是公司指引，也不应被读作正式 DCF 输出。
    claimRefs:
      - CV018
      - CV023
      - CV025
      - CV030
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 按估计约 $2.5B 入场价推演的三情景估值结果显示，下行不对称；除非 Verdiva 明确跨过下一道验证门槛，否则上行也只是中等。
    data:
      items:
        - label: 悲观情景
          low: 0.7
          mid: 1
          high: 1.3
          displayValue: $0.7B-$1.3B
          detail: 数据好坏参半，或板块估值下修；约为估计入场估值的 0.3x-0.5x。
          tone: negative
        - label: 基准情景
          low: 1.8
          mid: 2.2
          high: 2.6
          displayValue: $1.8B-$2.6B
          detail: 证明为正但差异化不清；回报大致持平。
          tone: neutral
        - label: 乐观情景
          low: 3.2
          mid: 3.8
          high: 4.3
          displayValue: $3.2B-$4.3B
          detail: 强劲 EVOLVE-2 数据和战略稀缺性支撑 1.3x-1.7x 的总上行情景。
          tone: positive
    approximationNotes: 区间是本章基于 comp-plus-rNPV 得出的估算，单位为十亿美元；前提是 PEDB / Dealroom 数字大体接近真实轮次估值。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的评分显示，市场和融资背景很强，但在当前估算价格下，证据质量和下行保护明显偏弱。
    data:
      items:
        - label: 市场顺风
          score: 9
          detail: 市场预测和 J.P. Morgan 对肠促胰素的展望，支撑一个很大的品类。
          tone: positive
        - label: 主资产潜力
          score: 7
          detail: 每周一次口服定位和外部 ecnoglutide 数据有吸引力，但 Verdiva 自身证据仍有限。
          tone: positive
        - label: 平台可选性
          score: 7
          detail: 口服和注射 amylin 后续管线，把战略宽度从单一分子拉开。
          tone: positive
        - label: 融资质量
          score: 8
          detail: 顶级投资者领投的 $411M 轮次，给了真实 runway 和外部背书。
          tone: positive
        - label: 估值支撑
          score: 4
          detail: 估算值高于仅靠公开证据能充分解释的水平。
          tone: warning
        - label: 证据质量
          score: 4
          detail: 公开股权结构、详细 Phase 1 以及 CMC/IP 证据仍不完整。
          tone: warning
        - label: 下行韧性
          score: 3
          detail: 数据低于预期时，肥胖药资产曾出现单日大幅估值下修。
          tone: negative
    approximationNotes: 评分是 0-10 的序数判断，由公开证据综合而来，供投资委员会使用；不是量化因子模型的输出。
    claimRefs:
      - CV013
      - CV014
      - CV029
      - CV031
      - CV038
