  - id: TP004
    title: Verdiva 护城河耐久性与竞争风险登记表
    columns:
      - 护城河主张或风险
      - 当前证据
      - 主要威胁来源
      - 严重程度
      - 尽调问题
    rows:
      - - 每周一次口服肽给药具备差异化
        - Verdiva 公开材料把 VRB-101 定位为每周一次口服，区别于以每日一次为主的口服赛道
        - 如果每日给药方案疗效和可及性更好，Lilly、Viking 和 Structure 仍可能胜出
        - 高
        - 需要 EVOLVE-2 按剂量队列划分的人体疗效和退出数据
      - - 肽类路径可能避开部分小分子肝脏风险
        - Lotiglipron 已停用，TERN-601 随后出现符合药物性肝损伤（DILI）的病例；Verdiva 和 Structure 则强调肽类或更干净的数据包
        - 全类别胃肠道（GI）负担，以及肽类特有规模经济仍未知
        - 中等
        - 需要 EVOLVE-2 完整肝脏、胆囊和胃肠道（GI）数据集
      - - 口服胰淀素组合选择权可能延长产品线寿命
        - Verdiva 将 VRB-103 定位为可与 VRB-101 叠加组合
        - Novo amycretin 和 Zealand-Roche 已把胰淀素生物学推进到更后期开发
        - 高
        - 需要 VRB-103 首次人体试验时间，以及人体联合用药耐受性计划
      - - 授权引进资产模式加快入场，但削弱独占性叙事
        - Verdiva 的核心项目来自 Sciwind 授权，而非内部原创平台
        - 大型药企也能授权引进口服竞品资产，AstraZeneca 与 Eccogene 的交易就是例子
        - 中等
        - 需要制剂 IP、地域保护和 CMC know-how 控制权细节
      - - 肥胖症商业权力掌握在既有产品线手里
        - Lilly 和 Novo 已占住肥胖症与糖尿病支付方和处方医生心智
        - 即便 Verdiva 数据不错，也可能遇到报销和渠道摩擦
        - 关键
        - 需要上市伙伴策略、定价逻辑和支付方准入假设
      - - 阶段差距仍是最大单一风险
        - Verdiva 仍处于 2b 期，而多个对手已在后期、已上市，或已在规划 3 期组合方案
        - 上市时间被挤压，可能把差异化压成小众定位，而不是产品线
        - 关键
        - 需要从 EVOLVE-2 到注册性研究和制造就绪的现实时间表
    notes: 严重程度是对问题不利发展时 Verdiva 竞争受损程度的分析判断。这张表混合直接证据与投资人式推断；每一行应被视为尽调提示，而不是单独结论。
    claimRefs:
      - CP038
      - CP039
      - CP040
      - CP041
      - CP042
      - CP043
      - CP044
      - CP045
