  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 未来客户图谱，而非当前客户证据
        blocks:
          - type: paragraph
            body: >
              Verdiva
              是一家商业化前临床阶段公司，没有获批产品，也没有披露任何产生收入的客户。因此，本章少谈当前客户名录，多谈未来商业化所需的转化链。最终经济买方很可能是支付方或药房福利设计决策者；处方决策掌握在基层医生、肥胖专科医生和内分泌科医生手中；终端用户则是患有肥胖，或超重并伴体重相关并发症的成年患者。同时，Verdiva
              还需要药企和区域商业化伙伴来验证平台，并吸收后期执行风险。


              公司公开材料始终把 Verdiva
              定位在对患者友好、给药频率更低的口服疗法和组合选项上，目标是改善可及性、依从性和维持治疗。这一定位重要，因为公司试图进入的市场里，给药路径、持续用药、报销和组合潜力都属于产品定义的一部分。超额认购的 $411M
              启动融资也有商业含义：它不能证明未来处方医生或支付方的需求，但确实说明，成熟生物科技投资人相信肥胖市场足够大、差异化空间足够明显，可以在任何收入出现前支持又一个进入者。
