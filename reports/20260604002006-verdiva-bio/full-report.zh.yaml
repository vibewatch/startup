      - number: '6.2'
        title: 采纳要经过试验、监管机构和标签设计
        blocks:
          - type: paragraph
            body: >
              Verdiva 已经从单纯资产收购走向运营执行：EVOLVE-2 已在 22 个美国中心入组 206 名受试者，公司预计 2026 年底给出顶线数据，管理层称若结果积极，可支持 2027 年启动 Phase
              3。这些里程碑是从投资人热情走向未来客户转化的第一座真正桥梁。在桥梁跨过去之前，处方医生和支付方评估的不是可上市产品，而是一项在研假设。


              监管机构仍是决定性关口。FDA 2025 年 1 月肥胖指南明确，减重产品按持续获益评判，而不是短期信号生成；长期体重维持、安全性和终点设计被放在核心要求上。WHO 2025 年肥胖指南方向上支持 GLP-1
              使用，但由于成本、长期证据缺口和卫生系统准备度，它明确附带条件。换句话说，Verdiva 首先面对的不是需求问题，而是证据问题。试验入排标准也有商业意义，因为 EVOLVE-2 排除了近期 GLP-1
              暴露和糖尿病人群，缩窄了第一批目标人群，也降低了广义肥胖市场在上市时能被覆盖的比例。
