        title: 融资风险、投资财团含义与结论
        blocks:
          - type: paragraph
            body: >-
              近端融资风险低于商业化前生物科技公司中位数，但没有消失。EY 和 BioSpace 描述的是一个后续资本更稀缺、单轮规模更大但集中到更少公司的市场；2024 年受评估的生物科技公司中有 39%
              跑道不足一年。BIA 的英国数据在本地讲述同一个故事：Verdiva 是该季度突出的巨额融资之一，而整体交易量下滑。同时，LifeSciVC 强调在研 GLP-1 肥胖项目超过 200
              个，这抬高了差异化门槛，也让后续融资越来越依赖里程碑。投资财团有帮助：Forbion 称自己是创始投资人，并动用 Growth Opportunities III 做这笔交易；General
