  - id: TM004
    title: 口服与注射型 GLP-1 采用对比
    columns:
      - 维度
      - 当前口服基准
      - 注射剂 / 市场基准
      - 对 Verdiva 的意义
    rows:
      - - 给药方式
        - Rybelsus 需像空腹一样用水服用，进食或服用其他口服药前还要等待 30 分钟
        - 每周注射避开每日空腹流程，但仍要用针
        - 每周一次口服若成立，可同时消除现有口服和注射方案的摩擦
      - - 疗效基准
        - ACHIEVE-3 中，Orforglipron 在 A1C 和体重降幅上胜过口服 semaglutide
        - 注射剂仍是肥胖症两位数减重的参照
        - Verdiva 必须证明便利性没有换来临床上有意义的疗效损失
      - - 处方医生熟悉度
        - Rybelsus 既有使用经验让口服 semaglutide 占据熟悉度优势
        - 注射剂已主导肥胖症处方习惯
        - 口服药熟悉度可缩短初级保健教育周期
      - - 偏好证据
        - 受访 PCP 在上市后不久就很愿意开出口服 semaglutide
        - 疗效信心压过便利性时，注射剂仍更受偏好
        - PCP 主导且排斥针剂的人群中，采用可能最强
      - - 耐受性和持续用药
        - 每日口服药和更新一代口服进入者仍要面对 GI 副作用和停药风险
        - 注射剂也有停药问题，但持续用药支持项目更成熟
        - 长期续方行为比试用启动更能驱动价值
      - - 覆盖逻辑
        - 糖尿病适应症口服产品目前报销路径更清晰
        - 肥胖症适应症注射剂装机基础更大，但覆盖仍不均
        - Verdiva 可能需要围绕最容易报销的用例安排临床和支付方策略
    notes: 本表比较给药路径带来的采用机制，而不是断言某一种形态会通吃。口服便利性只有在改变处方医生行为、患者意愿或支付方经济账时，才最有价值。
