  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与无收入状态
        blocks:
          - type: paragraph
            body: >-
              Verdiva 目前看起来是典型的商业化前临床阶段生物科技公司，而不是已有可观察产品收入的公司。公司网站、发布材料、入组公告和独立行业报道共同显示，已披露的经济引擎仍是围绕 VRB-101 和 amylin
              管线的股权融资药物开发，而不是商业销售。公开证据只支持未来变现路径：如果 VRB-101
              或后续资产上市，产生处方产品销售；与授权或共同开发资产绑定的区域或战略合作首付款、里程碑和特许权使用费；以及管理层扩展心血管代谢管线后的更广泛业务拓展交易。缺失的信息和已披露的信息同样重要：没有公开标价、没有报销策略、没有客户合同、没有产品销售，也没有已实现收入结构。财务上，这意味着本章必须基于里程碑转化和资本效率为
              Verdiva 承销，而不是基于当下收入质量。
