      - number: '7.4'
        title: 剩余暴露、矛盾和否决标准
        blocks:
          - type: paragraph
            body: >-
              公开记录中最大的矛盾很直接：Verdiva
              把自己描述为可规模化、患者友好、每周一次的口服平台，而独立和准一手来源仍在说，肥胖药物治疗受长期安全性、准入、可负担性和制造准备度制约。这个矛盾不能证明失败，但意味着投资者应把当前故事视为有待验证的假设，而不是已经被市场验证的平台。


              第二个矛盾围绕先发优势。Verdiva 和 Sciwind 将核心资产定位为每周一次口服 GLP-1 中可能的同类首创，但到 2026
              年，商业现实已经由获批口服肥胖疗法和多个后期挑战者定义。结果是，“每周一次口服”不能单独作为品类创造主张来估值；它必须转化为更好的患者行为、更佳耐受性、更低成本或更强维持效果。


              因此，承销框架应保持残酷的里程碑导向。EVOLVE-2 疗效或停药率未达标、FDA 要求实质扩大注册包、T2026 的 CMC 验证延迟、3 期前出现下轮降价或重大融资缺口，或者一名核心 Aiolos
              时期操盘手离开，都应被视为投资逻辑破裂事件，而不是普通初创波动。本章缓释表因此也兼作否决标准清单：只有这些触发项继续朝正确方向移动，Verdiva 才具备可投性。
