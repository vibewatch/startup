      - number: '8.3'
        title: 可比轮次和交易说明价格偏贵，但并不荒唐
        blocks:
          - type: paragraph
            body: >-
              最重要的可比启示是，肥胖资本市场比大多数其他生物技术品类更早、更激进地奖励差异化资产。BioPharma Dive 指出，代谢治疗投资在 2023 到 2024
              年间增长超过两倍，这波资金潮给出了大额、分阶段的参照点：Kailera 为后期肥胖管线融资 $600M，并在 2026 年 4 月完成 $718.8M IPO；Pfizer 同意以约 $4.9B
              首付款加与后续临床进展绑定的里程碑 CVR 收购 Metsera；Roche 同意向 Zealand 支付 $1.65B 首付款，围绕 petrelintide 的总潜在对价为 $5.3B。这些都比
              Verdiva 更后期，或处于更广的战略场景，但它们证明，当给药形态差异化和战略稀缺性对齐时，行业愿意为肥胖可选性支付异常高的价格。

              在这个背景下，Verdiva 估计约 $2.5B 的标价落在一个尴尬中间地带。它低于 Metsera 和 Zealand/Roche
              所代表的后期战略天花板，这有助于解释为什么专业投资者能为它辩护。但它也高于当前公开证据通常能支撑的水平，因为 Verdiva 还没有展示由公司生成、且可与 Structure 和 Viking
              用来讲述肥胖故事的数据相当的公开疗效数据集。这让本轮看起来不像一个基于已披露证据定价的常规 A 轮，更像一笔平台抢位交易：投资者在 2b 期读出风险出清前，提前高价锁定一个口服每周一次 GLP-1
              加胰淀素组合。结论应保持细致，而不是二元判断：相对证据集，价格偏贵；但在战略买家和跨市场投资者明显为稀缺性付钱的行业里，它也说得通。
