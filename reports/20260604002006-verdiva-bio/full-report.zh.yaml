      - number: '8.5'
        title: 建议、尽调问题和投资逻辑破裂触发项
        blocks:
          - type: paragraph
            body: >-
              建议姿态是观察，而不是买入。公开证据足以说明公司真实存在、资金充足，并处在生物技术最具吸引力的战略品类之一，但还不足以有把握地承销当前估计价格。直接证据缺口仍然太大：Verdiva 自己详细的 1
              期数据没有公开，A 轮具体估值机制和优先股堆叠没有公开，T2026 支持的口服递送逻辑背后的 CMC/IP
              组合也没有公开。换句话说，当前标价似乎在第一个由公司控制的疗效读出到来前，就已经资本化了未来上行的相当一部分。

              升级路径也很清晰，所以今天不是回避判断。干净的 EVOLVE-2 结果、更透明的股权结构和融资悬置，以及对许可经济、制造和 IP
              的尽调确认，可能足以支持从观察转向买入，即便价格不更低，因为这些项目会把投机性可选性转化为可承销概率。降级路径同样清楚：疲弱或只是平均的数据、不利的融资结构，或者证据显示 Verdiva
              的口服差异化故事经不起同业比较，都应把立场推向回避。简言之，最适合描述这个估值的词是拉伸但可辩护——前提是投资者诚实承认，支撑它的是未来里程碑概率，而不是眼下的公开证据。
            claimRefs:
              - CV031
              - CV032
              - CV038
