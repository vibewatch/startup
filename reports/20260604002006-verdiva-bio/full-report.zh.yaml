      - number: '2.3'
        title: 买方、用户、支付方与报销路径
        blocks:
          - type: paragraph
            body: >-
              用户是患有肥胖或 2 型糖尿病的患者，但购买路径由处方医生和支付方中介。在肥胖适应症中，实际买方往往是商业保险计划、PBM、雇主或自费患者；因为 Medicare
              仍普遍排除用于减重的药物，哪怕同一类别在糖尿病或心血管风险降低适应症中可以覆盖。KFF 的覆盖分析显示，肥胖适应症仍是公共报销的薄弱点，各州 Medicaid 覆盖也仍不均衡。这意味着口服 GLP-1
              上市可借两条不同商业化路线。第一，带糖尿病标签的口服 GLP-1
              路径已经有报销能力、医生熟悉度和药房福利基础设施。第二，带肥胖标签的口服药可通过自费、雇主纳入和商业保险扩张市场，前提是便利性能提高接受度。Verdiva
              的战略含义是，支付方准入至少和药理一样重要。即便口服临床特征有差异化，如果覆盖政策把肥胖视为可选项，却继续为同一分子类别的糖尿病标签买单，产品仍可能卡住。
