chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律基础与产品假设
        blocks:
          - type: paragraph
            body: >-
              Verdiva 的公开身份很清楚，尽管法律历史很短。Companies House 显示，英国实体 2024 年 7 月 29 日以 MNCO BIO LIMITED 名义注册，2024 年 9 月 9 日更名为
              VERDIVA BIO LIMITED，并在 2025 年 8 月从 Guildford 迁出后，注册地址变为伦敦 5 Swallow Place。公司向投资者和媒体讲述的经营故事，则从 2025 年 1 月 9
              日公开发布开始：Verdiva
              将自己定位为一家横跨伦敦和旧金山、专注肥胖及其他心血管代谢疾病的临床阶段生物制药公司。公司材料始终把商业模式落在差异化、对患者更友好的减重药上，而不是任何已披露的商业平台或当前收入基础。最具体的产品假设，是每周一次口服给药与模块化管线设计的组合：VRB-101
              被定位为 Phase 2 的口服 ecnoglutide 项目，T2026 是支撑口服吸收的技术，更宽的组合还加入口服和注射 amylin 选项，以及更多未披露候选药。由此可为后续章节确立清晰基线：Verdiva
              是一家重资本加持、仍处于商业化前的临床建设者；其公开规模化逻辑目前靠管线质量和执行里程碑支撑，而不是已披露的运营指标。
