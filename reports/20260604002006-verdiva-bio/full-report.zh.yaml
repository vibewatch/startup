        - from: need
          to: prescriber
          label: 临床需求进入医疗决策路径
        - from: prescriber
          to: coverage
          label: 处方必须跨过支付方或自费门槛
        - from: coverage
          to: start
          label: 获批或负担得起的患者启动治疗
        - from: start
          to: persist
          label: 便利性和耐受性塑造持续用药
        - from: persist
          to: value
          label: 更长持续用药提升生命周期价值
        - from: coverage
          to: value
          label: 覆盖广度封顶可触达总量
    approximationNotes: 流程是示意图而非合同结构。它突出哪里口服便利性有帮助，哪里支付方或持续用药摩擦仍占主导。
