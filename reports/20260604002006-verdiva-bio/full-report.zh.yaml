      - number: '8.2'
        title: 为什么传统 DCF 在这里很弱，而 rNPV 更重要
        blocks:
          - type: paragraph
            body: >-
              标准 DCF 不是 Verdiva
              的主要工具，因为没有可折现的经营现金流，未来收入是否存在、何时出现、规模多大，都取决于尚未发生的二元临床和监管事件。本章审阅的估值文献直接指出：未商业化生物技术公司常常多年没有收入，依赖里程碑驱动的价值创造，因此应采用概率加权，而不是直线现金流假设。对
              Verdiva 来说，这一点尤其关键，因为核心资产尚未公布由公司运行的 2 期疗效数据，两个胰淀素资产仍更早期，口服 GLP-1 竞争格局也在快速变化。

              更好的框架是 rNPV，并用已披露战略交易三角校验。在这个框架下，投资者按 EVOLVE-2 进入 3 期的概率加权路径估值核心口服
              GLP-1，再为口服和注射胰淀素后续项目加入大幅折现的期权价值。同一方法也让下行情景更清晰：早期资产通常比后期项目适用高得多的折现率，成功概率的小幅变化就能显著撬动现值。这也是为什么 Verdiva
              当前标价在公开证据上显得拉伸，但放在战略背景里并不非理性。市场规模底盘显然很大——抗肥胖药预测集中在约 $8.7B 的 2026 年市场和 2034-2035 年超过 $65B 的市场，而 J.P. Morgan
              预计更广义肠促胰素市场到 2030 年达到 $200B——但 TAM 本身不能消除阶段风险。投资者实际上是在清晰验证事件到来前，为提前拥有一个稀缺的每周一次口服肥胖平台支付概率加权下注。
            claimRefs:
              - CV013
              - CV014
              - CV015
