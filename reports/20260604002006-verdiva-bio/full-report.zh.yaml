      - number: '4.4'
        title: 资本效率与临床成本基准
        blocks:
          - type: paragraph
            body: >-
              判断 Verdiva 的资本效率，需要同时参照临床成本基准和肥胖同行融资背景。外部基准显示，Phase 1 平均开发成本在低个位数百万美元区间；Phase 2 疗效研究通常集中在低到高十几百万美元，受试者 100
              至 300 人，周期 18 至 24 个月。EVOLVE-2 已是一项相当可观的美国多中心研究，但即便高于平均的 Phase 2b 预算，也只是现金方程的一部分：口服给药 CMC、制剂工作、amylin
              后续项目、组合开发、监管准备和核心团队成本都叠加在上面。这正是 Verdiva $411M 融资显眼的原因。BioPharma Dive、C&EN 和 BioSpace
              都把这轮融资列为当前周期最大肥胖初创融资之一，与 Kailera、Metsera 等同行并列。资本优势真实存在，执行考验也真实存在：公司现在需要证明，巨额融资买到的是差异化临床数据，而不只是更多时间。
