  - id: TI004
    title: I / II 期口服 GLP-1 开发成本基准
    columns:
      - 阶段或研究
      - 基准总成本
      - 基准入组或周期
      - Verdiva 横向参照
      - 含义
    rows:
      - - I 期基准（ProRelix）
        - $5.26M 平均总成本
        - 平均 39 名参与者；每名患者 $136,783
        - 可作为 VRB-101 已完成澳大利亚 1 期工作的基线
        - 仅靠 1 期无法解释 $411M 融资；大部分资金必须支撑后期阶段和更广管线工作
      - - I 期基准（Abacum）
        - $1M-$2M 典型区间
        - 早期安全性工作；成本低于疗效研究
        - 支持这一判断：早期临床验证相较后续肥胖症开发成本较低
        - Verdiva 的融资规模明显超出简单复制 1 期的需要
      - - II 期基准（ProRelix）
        - $18.49M 平均总成本
        - 平均 143 名参与者；每名患者 $129,777
        - 更接近 EVOLVE-2 规模，但仍是通用基准
        - 即便完整 2 期预算，也只是 Series A 轮的一小部分
      - - II 期基准（Abacum）
        - $7M-$20M 典型区间；平均 $13.5M
        - 100-300 名参与者；平均周期 18-24 个月
        - 足以覆盖典型中期肥胖症疗效研究区间
        - 支持近期资金充足，但不足以证明可自筹完整关键性开发
      - - EVOLVE-2 登记 / 公司快照
        - 实际入组 206 名参与者
        - 22 个美国中心；研究开始日期 2025-11-25；主要完成时间估计为 2026 年 7 月
        - 先导项目已在消耗可观的多中心试验资源
        - 下一轮融资讨论会围绕 3 期就绪度，而不是 Verdiva 是否负担得起当前 2b 期
      - - 3 期成本上升信号
        - 管理层称肥胖症 3 期研究规模大且昂贵
        - 这是未来阶段成本跃升信号，不是当前已披露预算
        - 如果 EVOLVE-2 结果积极，烧钱速度很可能明显加快
        - 投资人应在完整关键性开发和商业化前，核算另一轮融资事件或合作
