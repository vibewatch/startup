      - number: '5.5'
        title: 依赖项、IP 姿态与公开披露风险
        blocks:
          - type: paragraph
            body: >-
              最强的产品技术风险并不是 GLP-1 和 amylin 生物学能否起效；市场已经给出答案。风险在于 Verdiva
              能否证明，一个来自伙伴的肽管线加专有增强剂，能变成可重复、可扩展、可防守的口服平台。投资人承销最需要的信息，公开证据都很薄：专利族具体性、T2026
              化学、共制剂稳定性、详细胃肠道停药行为、食物影响下的暴露变异，以及公司可扩展性主张背后的任何制造或质量体系证据。即便开发者信号，也主要是会议传播，而不是同行评议的 Phase 2
              输出。这并不否定平台，但会让尽调负担保持很高。除此之外，Sciwind 授权结构意味着 Verdiva 在运营上依赖外部管线来源、技术转移质量和一致的开发优先级。结论是，Verdiva
              有连贯产品概念和真实早期临床动能，但其公开材料对药理故事的支撑，明显强于对 CMC、IP 和长期耐受性故事的支撑。
