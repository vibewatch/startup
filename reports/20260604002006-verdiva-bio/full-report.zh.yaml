      - number: '1.3'
        title: Series A 财团与投资人假设
        blocks:
          - type: paragraph
            body: >-
              核心融资事实很清楚：Verdiva 以约 $411M 的超额认购 Series A 轮走出隐身期，由 Forbion 和 General Atlantic 共同领投，RA Capital
              Management、OrbiMed、Logos Capital、Lilly Asia Ventures 和 LYFE Capital 也被公开列名。独立报道把融资规模本身写成了故事：Fierce
              称其可能是英国生物科技史上最大 Series A，BioPharma Dive 则称其为自身数据集中近期最大生物科技融资之一。更值得尽调的问题，是这轮融资为什么发生。Forbion
              表示自己是创始投资人，这笔交易是其 Growth Opportunities III 基金的首笔投资，投资假设结合了已验证的领导力、下一代口服疗法，以及巨大的心血管代谢未满足需求。发布材料和 General
              Atlantic 的表述也用产品语言强调同样主题：对患者友好的每周一次口服给药、可规模化制造，以及扩大可及性的机会。这个假设并不是建立在已披露商业牵引力上，而是建立在授权科学和执行信心上。Verdiva 获得了
              Sciwind 代谢管线在大中华区和韩国以外的权利；Sciwind 自己的公告称，该交易包含约 $70M 首付款，加上超过 $2.4B
              的里程碑和特许权使用费。因此，融资既是优势，也形成未来义务堆栈；公开材料仍未披露投后估值或完全稀释股权结构，无法看清新财团实际买到了多少控制权。
