      - number: '8.4'
        title: 围绕当前入场价的乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Verdiva 在未来 12 到 18 个月把平台承诺转化为清晰的核心资产证据。这意味着 2026 年底 EVOLVE-2 读出强劲，2027 年启动 3
              期的路径可信，并且有证据显示每周一次口服给药和 cAMP
              偏向机制能在疗效、耐受性和便利性上，与迅速拥挤的口服领域竞争。如果这些条件满足，当前标价可以被重新解读为对稀缺肥胖平台的早期战略入场；当投资者开始同时资本化核心资产和折现后的胰淀素可选性时，估值可上移至 $3B
              低到中段区间或更高。

              基准情景更克制：EVOLVE-2 有效，但不够决定性，Verdiva 仍需要另一轮昂贵验证周期，并继续面对相较证据更充分同业的头对头质疑。在这个世界里，估值大致持平或略低于估计 A
              轮水平，因为投资者承认市场巨大、资产质量真实，但在没有公司特定差异化之前，不愿继续给予稀缺性倍数。悲观情景更严厉，因为肥胖投资者已经显示，他们会惩罚任何看起来次优的东西。Zealand
              在中期数据不及预期后单日下跌超过 30%，提醒人们当预期跑在证据前面时，这个板块会快速降估值；Nemo 等怀疑性评论则认为，近期肥胖 M&A 已经推高预期。如果 Verdiva
              的下一批验证点结果混杂，下轮降价或融资重置就会变得合理。
            claimRefs:
              - CV033
              - CV034
