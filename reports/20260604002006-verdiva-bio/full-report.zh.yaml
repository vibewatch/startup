      - number: '5.2'
        title: VRB-101 机制、制剂与 PK 逻辑
        blocks:
          - type: paragraph
            body: >-
              机制上，VRB-101 把 cAMP 偏向性 GLP-1 肽核心与专有口服吸收增强剂 T2026 结合起来。同行评议的 ecnoglutide 发现论文让人更有信心：基础肽不是普通 semaglutide
              模仿，Sciwind 将该分子工程化为具备强 cAMP 信号、有限受体内化、长半衰期，并相对部分更早肽设计更易制造。Verdiva 自己的海报随后把这套生物学延伸为口服给药假设，称 T2026 相对 SNAC
              可改善生物利用度和胃内稳定性，所得血浆暴露可支撑每周一次给药。这是产品技术赌注的核心。口服肽 GLP-1 疗法通常败在可重复性、空腹负担或暴露不足；Verdiva
              主张，肽工程加吸收增强剂已足以克服这些问题，实现每周一次而非每日给药。令人鼓舞的是，Phase 1
              公开材料包含真实随机研究设计和模型化暴露目标。未解决的是，所有关键口服制剂证据仍停留在海报层级、由公司筛选呈现，没有同行评议的口服临床论文、食物影响数据包，或关于 T2026 的公开 CMC 细节。
