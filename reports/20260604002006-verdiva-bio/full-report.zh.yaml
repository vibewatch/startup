      - number: '2.5'
        title: 增长驱动、采纳约束与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动很直接：疾病患病率巨大，肥胖已成为制药行业最有价值的创新品类之一，大型市场研究机构也开始把 2026 年描述为口服疗法、仿制 semaglutide
              和更广地理可及性开始重塑品类的拐点。但这些顺风也被三项现实约束抵消。第一，支付方可负担性仍未解决，美国 GLP-1 年标价超过
              $11,000，政策分析师预计随着用量增长，事先授权和处方集管理会趋于激进。第二，持续用药仍弱：基层医疗文献引用了接近 65%
              的首年停药率，通常由成本、不良反应和停药后体重反弹驱动。第三，公开证据仍没有拆出清晰的口服肥胖 TAM，也没有给出 Verdiva 的 VRB-101
              这类新资产的持久每周一次口服依从曲线。因此，最可辩护的结论不是精确 TAM/SAM/SOM 堆栈，而是 Verdiva
              正进入一个需求毋庸置疑、给药路径空白有意义、报销与持续用药风险同样有意义的市场；这些风险将决定最终兑现价值。
