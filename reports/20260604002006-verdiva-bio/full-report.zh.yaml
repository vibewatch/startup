      - number: '2.4'
        title: 注射与口服偏好、采纳驱动和摩擦
        blocks:
          - type: paragraph
            body: >-
              采纳的核心问题是，口服 GLP-1 会扩大品类，还是主要从注射剂抢份额。现有证据指向两者都有，便利性确实带来品类扩张。Lilly 的头对头 ACHIEVE-3 数据显示，口服药物可在 A1C 和减重上超过
              Novo 现有口服 semaglutide 标杆；Spherix 收集并由 Fierce Pharma
              报道的医生调研数据，则显示医生对口服肥胖选项有很强潜在兴趣，尤其是基层医生。口服给药便利性重要，是因为每日口服 semaglutide 仍有明显服用摩擦：RYBELSUS 必须至少在进食、饮水或服用其他口服药前
              30 分钟服用，且只能用少量水送服。这给更新的口服候选药留下了在便利性和疗效上做差异化的空间。同时，注射剂仍很强。它们有更多真实世界熟悉度、已验证的双位数减重效果，以及稳固的处方集位置。因此，口服 GLP-1
              采纳不应被看成简单的「药片战胜针剂」，更应被看成按给药路径切分的分层故事：口服疗法可以打开怕针或由基层医生主导的细分人群，但前提是耐受性、依从性和报销相较现有选项更好。
