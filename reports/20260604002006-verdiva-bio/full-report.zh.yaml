  - id: TP003
    title: Verdiva 竞争压力背后的合作、分销和准入杠杆
    enumerationScope:
      coverage: partial
      basis: >-
        Rows isolate the programs whose capital structure, partner access, or commercial channel power most directly
        affect Verdiva's ability to stand out in oral obesity therapy.
    columns:
      - 项目
      - 资本 / 合作信号
      - 分销或准入优势
      - 生产 / 供应含义
      - 对 Verdiva 的可能压力
    rows:
      - - Verdiva
        - $411M A 轮；Sciwind 大中华区和韩国以外权益
        - 尚无商业渠道；依赖未来合作或自建
        - 每周口服肽加吸收增强剂若能规模化，可能构成差异化，但公开 COGS 未披露
        - 压力来自执行，而不是概念本身
      - - Lilly orforglipron
        - 40+ 国家全球申报；肥胖症决策预计 2026 年 Q2
        - 既有肥胖症处方医生、支付方和生产基础设施
        - 相比肽类，非肽口服制造更容易扩产
        - 非常高
      - - Novo 口服 semaglutide / amycretin
        - 既有口服 semaglutide，加下一波 amycretin 扩张
        - 深度控制糖尿病和肥胖症渠道；口服 sema 已训练用药行为
        - 每日口服平台已经商业化；amycretin 提供内部接续路径
        - 非常高
      - - Structure GSBR-1290
        - 上市生物科技公司，明确有组合平台野心
        - 尚无商业渠道，但公开资本市场融资能力增强续航
        - 管理层明确把小分子制造定义为全球可规模化
        - 中等
      - - Viking 口服 VK2735
        - 上市生物科技公司，同时拥有口服和注射型 VK2735 项目
        - Phase 3 注射剂项目可把医生牵引到口服生命周期策略
        - 同一分子覆盖口服和注射剂型，可简化产品线搭建
        - 高
      - - Terns TERN-601
        - 曾寻求合作方，而不是自行出资做关键注册项目
        - Phase 2 数据偏弱后，已无明显渠道优势
        - 商业逻辑在扩产变得重要前已失败
        - 目前低，但可作为类别风险先例
      - - Zealand petrelintide / Roche 合作
        - Roche 合作，并在美国和欧洲共同商业化
        - Roche 让相邻 amylin 疗法具备真实上市执行力
        - 目前是肽类注射剂，但组合潜力会争夺同一笔下一代肥胖症预算
        - 组合方向中等偏高
      - - Pfizer lotiglipron
        - 大药企预算也没能把该资产从安全性驱动终止中救出来
        - 说明单靠资本无法抵消安全性失败
        - 若肝脏包过不了，小分子便利性就不重要
        - 间接但重要
      - - AstraZeneca-Eccogene elecoglipron 项目
        - 大药企背书的全球 Phase 3 目标
        - 数据成熟后，AstraZeneca 可全球商业化
        - 小分子每日一次且不受饮食限制的定位具备商业吸引力
        - 中等，主要是中期
      - - 现有注射剂（Wegovy / Zepbound）
        - Novo 和 Lilly 的稳固商业产品线
        - 当前医生与支付方默认路径
        - 规模与供应约束已被充分理解，且在逐步改善
        - 结构性压力：Verdiva 必须明显更好，而不只是口服
    notes: 这张表比较的是力量不对称，而不只是分子质量。在肥胖症市场，切换成本低、支付方深度介入；一旦疗效接近，分销、处方集议价能力和伙伴触达往往决定赢家。
