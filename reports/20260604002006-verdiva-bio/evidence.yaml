evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: >-
      Current board committee membership, observer rights, and independence standards for Verdiva directors and investor
      representatives.
    whyItMatters: >-
      These details determine how much control the Series A syndicate has over licensing, financing, and future
      strategic transactions.
    diligencePath: >-
      Request the current board deck, committee charter summary, and investor rights agreement from management or
      counsel.
    relatedQuestionRefs:
      - QO013
      - QO027
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: >-
      Fully diluted cap table, ownership percentages, and price-per-share details behind the October 2024, January 2026,
      and May 2026 allotments.
    whyItMatters: >-
      Without these private financing details, economic control, dilution, and any post-launch mark-up in implied
      valuation remain opaque.
    diligencePath: >-
      Obtain the share register, priced-round summary, and any secondary-transfer schedule from the CFO or company
      counsel.
    relatedQuestionRefs:
      - QO024
      - QO027
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: minor
    topic: brief-name-mismatch
    missingEvidence: Any board, advisory, legal, or financing document that connects Knut Elstner or Tim Knöfel to Verdiva Bio.
    whyItMatters: >-
      The user brief flagged both names, but retained public materials do not; that could reflect a private-side role or
      a briefing mismatch.
    diligencePath: >-
      Ask management or counsel whether either person has ever served as an officer, director, board observer, advisor,
      or investor representative.
    relatedQuestionRefs:
      - QO028
  - type: conflicting-data
    severity: minor
    topic: launch-date-conflict
    missingEvidence: >-
      A corrected General Atlantic page or archived copy clarifying whether its Verdiva launch announcement should be
      dated 2025 rather than 2024.
    whyItMatters: >-
      Launch-date integrity anchors the chronology for incorporation, financing, and board formation, so timestamp drift
      should be resolved explicitly.
    diligencePath: >-
      Treat January 2025 as canonical unless General Atlantic confirms otherwise and request a corrected permalink or
      archived screenshot.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: public-financial-disclosure
    missingEvidence: Revenue, ARR, verified headcount, cash burn, runway, and post-money valuation disclosure for the current business.
    whyItMatters: >-
      These missing scale metrics make it impossible to judge how far the unusually large Series A has translated into
      organizational maturity or capital efficiency.
    diligencePath: >-
      Request the latest investor update or board pack covering headcount, monthly burn, runway, and any priced
      valuation reference.
    relatedQuestionRefs:
      - QO013
      - QO015
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: oral-obesity-tam
    missingEvidence: >-
      A public, methodologically transparent estimate for the oral GLP-1 obesity subsegment that isolates obesity-only
      use from broader incretin sales.
    whyItMatters: >-
      Without a clean oral-obesity subsegment estimate, TAM and SAM can be overstated by leaning on the full
      obesity-medicines market or diabetes-adjacent spend.
    diligencePath: >-
      Request payer and channel data from management or a specialist market model that separates oral obesity, oral
      diabetes, and injectable substitution effects.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: net-pricing-and-coverage
    missingEvidence: >-
      Real net pricing, rebate levels, and coverage terms for oral GLP-1 obesity launches by employer, commercial, and
      public lines of business.
    whyItMatters: >-
      Gross list prices and policy summaries do not reveal the actual budget impact or speed of uptake in Verdiva’s
      likely launch channels.
    diligencePath: >-
      Obtain payer research, PBM channel checks, or confidential management materials showing target price corridor and
      expected authorization rates.
    relatedQuestionRefs:
      - QM015
      - QM022
    relatedTableRefs:
      - TM003
      - TM005
  - type: stale
    severity: material
    topic: long-run-persistence
    missingEvidence: >-
      Longitudinal real-world persistence data for once-weekly oral GLP-1 treatment rather than daily oral semaglutide
      or injectable benchmarks.
    whyItMatters: >-
      Convenience is central to Verdiva’s thesis, but the market outcome depends on whether convenience translates into
      better long-term refill and adherence behavior.
    diligencePath: >-
      Track real-world refill cohorts after launch or seek extension-study and pharmacy-claims evidence as soon as
      once-weekly oral products produce enough exposure time.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
      - TM005
  - type: conflicting-data
    severity: minor
    topic: market-forecast-dispersion
    missingEvidence: >-
      A reconciled methodology for comparing IQVIA sales forecasts, policy-spending scenarios, and epidemiology-driven
      market narratives.
    whyItMatters: >-
      Different sources size different things—drug sales, reimbursed volume, and social cost—so a naive average would be
      misleading.
    diligencePath: >-
      Maintain separate market lenses in the investment model and force each forecast to declare whether it measures
      patients, reimbursed scripts, or total drug sales.
    relatedQuestionRefs:
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: verdiva-head-to-head-evidence
    missingEvidence: >-
      A normalized or head-to-head human efficacy and discontinuation comparison between VRB-101 and at least one daily
      oral peer such as orforglipron, GSBR-1290, or oral VK2735.
    whyItMatters: >-
      Without comparable human outcome data, weekly oral convenience remains a hypothesis rather than a bankable
      competitive edge.
    diligencePath: >-
      Request EVOLVE-2 cohort-level body-weight, discontinuation, nausea, vomiting, and liver data plus any internal
      cross-trial benchmarking deck used with investors or partners.
    relatedQuestionRefs:
      - QP020
