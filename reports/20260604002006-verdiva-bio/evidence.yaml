    severity: material
    topic: verdiva-manufacturing-economics
    missingEvidence: >-
      Public cost-of-goods, oral tablet yield, stability, and scale-up evidence for VRB-101 and the T2026 delivery
      technology.
    whyItMatters: >-
      Verdiva is competing against small molecules that explicitly market manufacturing simplicity and against big
      pharma that can absorb supply-chain friction.
    diligencePath: >-
