  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: Current board committee membership, observer rights, and independence standards for Verdiva directors and investor representatives.
    whyItMatters: These details determine how much control the Series A syndicate has over licensing, financing, and future strategic transactions.
    diligencePath: Request the current board deck, committee charter summary, and investor rights agreement from management or counsel.
    relatedQuestionRefs:
    - QO013
    - QO027
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: Fully diluted cap table, ownership percentages, and price-per-share details behind the October 2024, January 2026, and May 2026 allotments.
    whyItMatters: Without these private financing details, economic control, dilution, and any post-launch mark-up in implied valuation remain opaque.
    diligencePath: Obtain the share register, priced-round summary, and any secondary-transfer schedule from the CFO or company counsel.
    relatedQuestionRefs:
    - QO024
    - QO027
    relatedTableRefs:
    - TO003
    - TO004
  - type: missing-source
    severity: minor
    topic: brief-name-mismatch
    missingEvidence: Any board, advisory, legal, or financing document that connects Knut Elstner or Tim Knöfel to Verdiva Bio.
    whyItMatters: The user brief flagged both names, but retained public materials do not; that could reflect a private-side role or a briefing mismatch.
    diligencePath: Ask management or counsel whether either person has ever served as an officer, director, board observer, advisor, or investor representative.
    relatedQuestionRefs:
    - QO028
  - type: conflicting-data
    severity: minor
    topic: launch-date-conflict
    missingEvidence: A corrected General Atlantic page or archived copy clarifying whether its Verdiva launch announcement should be dated 2025 rather than 2024.
    whyItMatters: Launch-date integrity anchors the chronology for incorporation, financing, and board formation, so timestamp drift should be resolved explicitly.
    diligencePath: Treat January 2025 as canonical unless General Atlantic confirms otherwise and request a corrected permalink or archived screenshot.
    relatedQuestionRefs:
    - QO002
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: public-financial-disclosure
    missingEvidence: Revenue, ARR, verified headcount, cash burn, runway, and post-money valuation disclosure for the current business.
    whyItMatters: These missing scale metrics make it impossible to judge how far the unusually large Series A has translated into organizational maturity or capital efficiency.
    diligencePath: Request the latest investor update or board pack covering headcount, monthly burn, runway, and any priced valuation reference.
