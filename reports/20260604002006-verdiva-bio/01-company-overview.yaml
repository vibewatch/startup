company:
  name: Verdiva Bio
chapter:
  number: 1
  title: Company Overview
  summary: Verdiva Bio is a 2024-founded, London-registered and London/San Francisco-positioned obesity biotech that emerged publicly in January 2025 with an unusually large $411 million Series A co-led by Forbion and General Atlantic. Its disclosed bench is built around former Aiolos and Gyroscope operators plus metabolic-drug veterans from Boehringer, Roche, Genentech, and Sciwind, while its core scale markers are the Sciwind-licensed oral and injectable obesity pipeline and the 206-patient EVOLVE-2 phase 2b study. The main unresolved issues are cap-table economics, governance rights, missing financial and headcount disclosure, and the lack of any public evidence tying Knut Elstner or Tim Knöfel to disclosed Verdiva leadership.
sections:
- id: identity-foundation-and-product-thesis
  title: Identity, legal foundation, and product thesis
  body: 'Verdiva’s public identity is straightforward even though its legal history is short. Companies House shows the UK entity incorporated on 29 July 2024 as MNCO BIO LIMITED, renamed VERDIVA BIO LIMITED on 9 September 2024, and now registered at 5 Swallow Place in London after moving from Guildford in August 2025. The operating story presented to investors and media then begins with the 9 January 2025 public launch, when Verdiva introduced itself as a London-and-San-Francisco clinical-stage biopharmaceutical company focused on obesity and other cardiometabolic disorders. The company’s own materials consistently frame the business model around differentiated, patient-friendly obesity medicines rather than around any disclosed commercial platform or current revenue base. The most concrete product thesis is the combination of once-weekly oral delivery and modular pipeline design: VRB-101 is positioned as an oral ecnoglutide program in phase 2, T2026 is the enabling oral absorption technology,
    and the broader portfolio adds oral and injectable amylin options plus further undisclosed candidates. That gives later chapters a clean identity baseline: Verdiva is a heavily financed, still pre-commercial clinical builder whose public scale case currently rests on pipeline quality and execution milestones, not on disclosed operating metrics.'
