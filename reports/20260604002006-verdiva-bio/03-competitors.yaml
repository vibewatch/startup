- id: TP002
  title: 'Stage, Efficacy, and Safety Comparison: How Verdiva Stacks Against Oral Benchmarks'
  enumerationScope:
    coverage: partial
    basis: 'The same ten most relevant programs are compared on the evidence points most likely to drive investor and partner triage: stage, dose schedule, efficacy, and known tolerability risk.'
  columns:
  - Program
  - Dose schedule
  - Key published or disclosed weight-loss signal
  - Liver / tolerability read-through
  - What it means for Verdiva
  rows:
  - - VRB-101 / Verdiva
    - Once-weekly oral
    - No public obesity efficacy readout yet; modeled PK vs weekly semaglutide is the main disclosed differentiator
    - Unknown at obesity proof level; early data framed as supportive of weekly dosing
    - Needs EVOLVE-2 efficacy to convert differentiation into a competitive claim
  - - Orforglipron / Lilly
    - Once-daily oral, no food/water restrictions
    - 9.2% weight loss at 52 weeks in ACHIEVE-3 vs 5.3% for oral semaglutide 14 mg
    - Class-consistent GI profile; article-level reviews still flag long-term access and durability questions
    - Sets the hardest near-term oral efficacy and convenience bar
  - - Oral semaglutide / Novo
    - Once-daily oral with fasting / water timing instructions
    - OASIS review says OASIS 1, 2, and 4 beat placebo in obesity
    - Official label carries GI, pancreatitis, kidney-volume depletion, and gallbladder warnings
    - Benchmark for daily oral peptide practicality and payer familiarity
  - - Oral amycretin / Novo
    - Once-daily oral
    - Up to 10.1% weight loss at 36 weeks in oral arm
    - Company says profile was safe and well tolerated with mostly mild to moderate GI events
    - Threatens Verdiva's next-generation combo narrative before Verdiva has human combo data
  - - GSBR-1290 / Structure
    - Once-daily oral
    - 6.2% placebo-adjusted at 12 weeks; up to 6.9% in tablet PK study
    - No DILI or persistent liver-enzyme elevations reported in disclosed studies
    - Makes a credible case that small molecules can be both scalable and liver-clean
  - - VK2735 oral / Viking
    - Once-daily oral
    - 12.2% mean and 10.9% placebo-adjusted weight loss at 13 weeks
    - Mostly mild or moderate GI events; no plateau through week 13
    - Most aggressive oral-biotech efficacy signal in the current peer set
  - - TERN-601 / Terns
    - Once-daily oral
    - Phase 2 up to 4.6% placebo-adjusted at 12 weeks
    - 11.9% AE discontinuation and DILI-consistent cases in phase 2
    - Shows mediocre efficacy plus liver signals can destroy partnering value quickly
  - - Petrelintide / Zealand-Roche
    - Once-weekly SC
    - 8.6% and 8.3% weight loss at 16 weeks in phase 1b maintenance-dose arms
    - Mostly mild GI events; tolerability and lean-mass narrative are core positioning points
    - Not a direct oral substitute, but a serious adjacent threat to Verdiva's amylin-combo story
  - - Lotiglipron / Pfizer
    - Once-daily oral
    - No late-stage efficacy case survived development
    - Elevated transaminases in phase 1 and phase 2 drove discontinuation
    - Strengthens diligence focus on scaffold and liver safety in oral small molecules
  - - Elecoglipron / AstraZeneca-Eccogene
    - Once-daily oral
    - China phase 1b described clinically meaningful weight reduction at 16 weeks
    - No liver safety signals observed in that study
    - Adds another large-pharma entrant, but one still behind the lead oral programs
  notes: Comparison emphasizes disclosed signals rather than attempting to harmonize different durations, patient populations, and estimands. Verdiva remains early because no public EVOLVE-2 efficacy data exist yet.
