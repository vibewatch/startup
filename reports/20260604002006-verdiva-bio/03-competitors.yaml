  evidenceGaps:
  - type: missing-source
    severity: material
    topic: verdiva-head-to-head-evidence
    missingEvidence: A normalized or head-to-head human efficacy and discontinuation comparison between VRB-101 and at least one daily oral peer such as orforglipron, GSBR-1290, or oral VK2735.
    whyItMatters: Without comparable human outcome data, weekly oral convenience remains a hypothesis rather than a bankable competitive edge.
    diligencePath: Request EVOLVE-2 cohort-level body-weight, discontinuation, nausea, vomiting, and liver data plus any internal cross-trial benchmarking deck used with investors or partners.
    relatedQuestionRefs:
    - QP020
    - QP023
    relatedTableRefs:
    - TP002
  - type: private-evidence-only
    severity: material
    topic: verdiva-manufacturing-economics
    missingEvidence: Public cost-of-goods, oral tablet yield, stability, and scale-up evidence for VRB-101 and the T2026 delivery technology.
    whyItMatters: Verdiva is competing against small molecules that explicitly market manufacturing simplicity and against big pharma that can absorb supply-chain friction.
    diligencePath: Ask for CMC summary, projected commercial dose cost, API yield assumptions, and any oral-tablet stability package used to support the weekly peptide thesis.
    relatedQuestionRefs:
    - QP025
    - QP027
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: verdiva-combo-clinical-proof
    missingEvidence: Human data for VRB-103 alone or combined with VRB-101, including GI tolerability, dose flexibility, and maintenance potential.
    whyItMatters: Verdiva's combo story is strategically important but currently rests on preclinical and formulation data while Novo and Zealand are moving their amylin strategies into later-stage human work.
    diligencePath: Request VRB-103 IND-enabling timeline, first-in-human protocol, and any internal tolerability modeling for a fixed-dose oral GLP-1/amylin tablet.
    relatedQuestionRefs:
    - QP021
    - QP027
    relatedTableRefs:
    - TP004
  - type: access-blocked
    severity: minor
    topic: full-text-journal-coverage
    missingEvidence: Direct full-text access to some original journal publications for OASIS and amycretin rather than review or press-release summaries.
    whyItMatters: The chapter still clears the bar with official and technical sources, but deeper protocol and subgroup detail would improve precision on comparative efficacy and safety.
    diligencePath: Pull the original Lancet and NEJM articles through a licensed research channel or corporate library before investment committee-level underwriting.
    relatedQuestionRefs:
    - QP008
    - QP009
    relatedTableRefs:
    - TP002
