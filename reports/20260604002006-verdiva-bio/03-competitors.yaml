tables:
- id: TP001
  title: Direct and Adjacent Obesity Competitor Profiles Relevant to Verdiva
  enumerationScope:
    coverage: partial
    basis: Ten most decision-relevant direct and adjacent programs around oral obesity treatment as of June 2026, emphasizing oral incretins, oral amylin concepts, and major adjacent challengers.
  columns:
  - Program / Company
  - Modality
  - Stage (Jun-2026)
  - Best public efficacy signal
  - Key safety / tolerability signal
  - Strategic position
  rows:
  - - VRB-101 / Verdiva
    - Once-weekly oral peptide GLP-1 (ecnoglutide)
    - Phase 2b EVOLVE-2 enrolled
    - Phase 1 PK modeling suggests 90 mg weekly oral exposure can match 2.4 mg SC semaglutide; 120 mg projected above it
    - Public data remain early; obesity efficacy still not publicly read out
    - $411M Series A; Sciwind-licensed ex-China/South Korea rights; oral amylin follow-on adds combo option
  - - Orforglipron / Lilly
    - Once-daily oral small-molecule GLP-1
    - Submission stage / Phase 3 completed in major programs
    - 9.2% weight loss at 52 weeks in ACHIEVE-3 diabetes head-to-head vs 5.3% for oral semaglutide 14 mg
    - GI adverse events consistent with class; long-term real-world durability and affordability still uncertain
    - Large-pharma scale, regulatory filings in 40+ countries, established obesity franchise
  - - Oral semaglutide / Novo
    - Once-daily oral peptide GLP-1
    - Marketed oral semaglutide plus obesity OASIS program
    - OASIS review says OASIS 1, 2, and 4 beat placebo on body-weight loss
    - Label carries GI, pancreatitis, gallbladder, and fasting administration burdens
    - Incumbent oral GLP-1 benchmark and prescriber-training advantage
  - - Oral amycretin / Novo
    - Once-daily oral GLP-1 / amylin agonist
    - Phase 2 positive; phase 3 planned in 2026
    - Up to 10.1% weight loss at 36 weeks in oral arm; 14.5% in SC arm
    - GI events mostly mild to moderate in disclosed phase 2 update
    - Novo extends beyond semaglutide into next-generation combo biology
  - - GSBR-1290 / Structure
    - Once-daily oral non-peptide small-molecule GLP-1
    - Phase 2b-ready / mid-stage
    - 6.2% placebo-adjusted weight loss at 12 weeks; up to 6.9% in tablet PK study
    - GI AEs early and attenuating; zero drug-induced liver injury or persistent liver enzyme elevations reported
    - Public biotech with explicit scale-up and combination-backbone narrative
  - - VK2735 oral / Viking
    - Once-daily oral dual GLP-1 / GIP agonist
    - Phase 2 positive; oral phase 3 planned later in 2026
    - 12.2% mean weight loss and 10.9% placebo-adjusted loss at 13 weeks
    - Mostly mild or moderate TEAEs; GI events diminished over time
    - Same molecule also in Phase 3 subcutaneous program, creating lifecycle flexibility
  - - TERN-601 / Terns
    - Once-daily oral small-molecule GLP-1
    - Deprioritized / shelved after phase 2
    - Phase 1 delivered up to 4.9% placebo-adjusted loss at 28 days; later phase 2 up to 4.6% at 12 weeks
    - Phase 2 showed nausea, vomiting, 11.9% AE discontinuation, and DILI-consistent liver cases
    - Public biotech failed to clear partner-worthy differentiation threshold
  - - Petrelintide / Zealand-Roche
    - Once-weekly subcutaneous amylin analog
    - Phase 3 planned H2 2026
    - Phase 1b showed 8.6% and 8.3% weight loss at 16 weeks at 4.8 mg and 9.0 mg
    - Mostly mild GI events; Zealand emphasizes tolerability and lean-mass potential
    - Roche collaboration elevates adjacent competitive pressure on combo / maintenance positioning
  - - Lotiglipron / Pfizer
    - Once-daily oral small-molecule GLP-1
    - Discontinued in 2023
    - Program had advanced into ongoing phase 2 before discontinuation
    - Elevated transaminases drove discontinuation; no liver failure or symptoms reported
    - Important negative precedent for oral small-molecule safety diligence
  - - Elecoglipron / AstraZeneca-Eccogene
    - Once-daily oral small-molecule GLP-1
    - Phase 1b China positive; global phase 3 planned
    - Eccogene reported clinically meaningful weight reduction and glycemic improvement at 16 weeks in China
    - No liver safety signals reported in the China phase 1b study
    - Big-pharma backed but still behind Lilly and Novo on maturity
  notes: Rows normalize public stage, modality, efficacy, safety, and strategic context as of the run date. Efficacy cells mix direct trial outputs and company-disclosed summaries, so read them as screening evidence rather than head-to-head equivalence.
