- id: TP003
  title: Partnering, Distribution, and Access Levers Behind Competitive Pressure on Verdiva
  enumerationScope:
    coverage: partial
    basis: Rows isolate the programs whose capital structure, partner access, or commercial channel power most directly affect Verdiva's ability to stand out in oral obesity therapy.
  columns:
  - Program
  - Capital / partner signal
  - Distribution or access advantage
  - Manufacturing / supply implication
  - Likely pressure on Verdiva
  rows:
  - - Verdiva
    - $411M Series A; Sciwind rights outside greater China and South Korea
    - No commercial channel yet; relies on future partnering or standalone build
    - Weekly oral peptide plus absorption enhancer could be differentiated if scalable, but public COGS are undisclosed
    - Pressure is execution-driven rather than concept-driven
  - - Lilly orforglipron
    - Global submissions in 40+ countries; obesity decision expected in Q2 2026
    - Existing obesity prescriber, payer, and manufacturing infrastructure
    - Non-peptide oral manufacturing simplifies scaling versus peptides
    - Very high
  - - Novo oral semaglutide / amycretin
    - Incumbent oral semaglutide plus next-wave amycretin expansion
    - Deep diabetes and obesity channel control; oral sema already trains behavior
    - Daily oral platform already commercial; amycretin adds internal succession path
    - Very high
  - - Structure GSBR-1290
    - Public biotech with explicit combination-platform ambition
    - No commercial channel yet, but public-market access improves staying power
    - Management explicitly frames small-molecule manufacturing as globally scalable
    - Moderate
  - - Viking oral VK2735
    - Public biotech with both oral and injectable VK2735 programs
    - Phase 3 injectable program could cross-pull physicians into oral lifecycle strategy
    - One molecule across oral and injectable formulations can streamline franchise building
    - High
  - - Terns TERN-601
    - Was seeking partner rather than self-funding pivotal program
    - No meaningful channel advantage after weak phase 2 data
    - Commercial case failed before scale-up became relevant
    - Low now, but instructive as class-risk precedent
  - - Zealand petrelintide / Roche
    - Roche collaboration and co-commercialization in the U.S. and Europe
    - Roche gives adjacent amylin therapy real launch muscle
    - Peptide injection today, but combo potential competes for the same next-gen obesity budget
    - Moderate to high on combinations
  - - Pfizer lotiglipron
    - Large-pharma budget did not save the asset from safety-driven termination
    - Demonstrates that capital alone does not offset safety failure
    - Small-molecule convenience is irrelevant if liver package fails
    - Indirect but important
  - - AstraZeneca-Eccogene elecoglipron
    - Big-pharma backed global phase 3 ambition
    - AstraZeneca can commercialize globally if data mature
    - Small-molecule once-daily positioning with no food restriction is commercially attractive
    - Moderate, mostly medium-term
  - - Status-quo injectables (Wegovy / Zepbound)
    - Entrenched commercial franchises from Novo and Lilly
    - Current physician and payer defaults
    - Well-understood scale and supply constraints are improving over time
    - Structural pressure because Verdiva must be clearly better, not merely oral
  notes: This table compares power asymmetry, not just molecule quality. In obesity, low switching costs and heavy payer mediation mean distribution, formulary leverage, and partner access often decide winners once efficacy is close.
