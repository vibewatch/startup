- id: FP003
  title: Competitive Durability KPIs for Verdiva vs. the Oral Obesity Field
  type: kpi
  layout: standard
  summary: Verdiva has a differentiated format and real funding, but it still trails the leaders on evidence density and launch readiness.
  approximationNotes: KPIs mix direct public facts with analytical comparisons. Values are shown as public numbers where available and as short labels where the relevant evidence is qualitative.
  claimRefs:
  - CP001
  - CP004
  - CP006
  - CP015
  - CP026
  - CP036
  - CP038
  - CP039
  - CP040
  - CP042
  - CP043
  - CP045
  data:
    items:
    - label: Verdiva financing at launch
      value: $411M
      detail: Enough to run Phase 2b and combo platform work, but still tiny beside Lilly/Novo balance sheets
      tone: positive
    - label: Verdiva dose-frequency wedge
      value: Weekly oral
      detail: Main direct oral peers are daily-dosed
      tone: positive
    - label: Verdiva public obesity efficacy
      value: Not yet disclosed
      detail: Largest near-term credibility gap versus Lilly, Novo, Structure, and Viking
      tone: warning
    - label: Best cited oral-biotech efficacy peer
      value: VK2735 oral 12.2% at 13 weeks
      detail: Shows how fast the oral bar is moving outside big pharma
      tone: warning
    - label: Most important class-risk precedent
      value: Lotiglipron / TERN-601 liver signals
      detail: Supports diligence on scaffold and hepatic safety, but does not automatically favor Verdiva
      tone: neutral
    - label: Most important adjacent combo threat
      value: Novo amycretin and Zealand-Roche petrelintide
      detail: Both attack the same next-generation maintenance / combo narrative Verdiva wants to own
      tone: warning
callouts:
- calloutType: strength
  title: Weekly oral dosing is a real wedge
  body: Verdiva is one of the few obesity companies trying to turn weekly dosing into an oral convenience claim rather than an injectable one, and that is the clearest basis for differentiation in a crowded field.
  claimRefs:
  - CP006
  - CP008
  - CP039
- calloutType: risk
  title: Leaders can compress Verdiva before Phase 3
  body: Lilly and Novo already control the commercial obesity conversation, and Viking plus Structure mean Verdiva will not get a long period of small-company whitespace in oral obesity.
  claimRefs:
  - CP036
  - CP037
  - CP042
- calloutType: insight
  title: The next battle line is amylin, not just oral GLP-1
  body: Verdiva's oral amylin strategy is strategically correct, but Novo and Zealand-Roche are already proving that the market is moving quickly toward amylin-based combinations and maintenance regimens.
  claimRefs:
  - CP015
  - CP029
  - CP040
