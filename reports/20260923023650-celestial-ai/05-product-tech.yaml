    - ~800 Gbps per transceiver
  - - Energy efficiency
    - ~3.1 pJ/bit end-to-end (2.4 electronics + 0.7 laser)
    - <5 pJ/bit full link
    - ~15–20 pJ/bit
  - - Modulator technology
    - EAM (Electro-Absorption Modulator) on TSMC SiPh
    - MRM (Microring Resonator)
    - EML or silicon photonics MZM
  - - Thermal tuning required
    - No — EAMs tolerate >85°C swings without heaters
    - Yes — MRMs require integrated thermal heaters
    - N/A (pluggable module self-contained)
  - - Integration model
    - In-die co-packaged (2.5D SiP CoWoS, placed under die)
    - Co-packaged chiplet (AIB interface; UCIe roadmap)
    - Pluggable cage on PCB edge
  - - Laser source
    - External CW laser integrated in module
    - External SuperNova multi-wavelength remote laser
    - Integrated DFB laser in transceiver
  - - Optical reach
    - Chip-to-chip; rack-scale disaggregation
    - mm to 2 km per specification
    - 100 m to 10 km depending on variant
  - - Manufacturing process
    - TSMC SiPh + CoWoS 5nm custom ASIC
    - GlobalFoundries / TSMC silicon photonics process
    - Standard module assembly supply chain
  - - Standards compliance
    - OIF CPO (evolving); NVLink Fusion ecosystem
    - CW-WDM MSA; UCIe (roadmap)
    - IEEE 400G/800G; OIF CMIS 5.0
  - - Production status (as of May 2026)
    - 4 TSMC tapeouts complete; volume qualification in progress
    - Customer demos; limited production
    - High-volume production across multiple vendors
  notes: 'Celestial AI bandwidth figures are company-claimed from OFC 2025 (W3D.1) and Hot Chips 2025.

    Ayar Labs TeraPHY figures from BusinessWire March 2023 demo announcement and OCP listing.

    Pluggable optics energy figures are industry estimates from OIF and EDN. No independent

    head-to-head silicon characterization comparing all three approaches under identical conditions

    has been published as of the report date.

    '
