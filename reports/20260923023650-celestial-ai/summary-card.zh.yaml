summary:
  headline: |
    Marvell 在关键拐点先付 $3.25B，买下市面上技术最先进的硅光 scale-up 互连资产。
    交易逻辑成立：借助 Marvell 与 hyperscaler 的关系，把 Celestial AI 的 Photonic
    Fabric 在 FY2028 做到 $500M+ ARR。但这套逻辑仍压在收购时尚未产生收入的基础上，
    距离收入确认还有 18+ 个月执行窗口。6.5x 的 2 年远期 ARR 倍数处于 AI 硅片可比
    交易偏保守一端；只要 earn-out 节点兑现，先付款有防御性；$2.25B 或有对价也能
    对齐激励。技术、时间和人才执行变量叠加，风险评级偏高。
