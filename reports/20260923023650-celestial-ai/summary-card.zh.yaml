  topStrengths:
    - 结构性顺风：铜互连在 400G+ SerDes 速度下逼近物理极限，光 scale-up chiplet 对 hyperscaler AI 集群扩展已是刚需
    - Marvell 渠道：被领先的定制 AI 硅片公司收购，Marvell 已有 hyperscaler 关系（Microsoft Maia、Google 等），大幅压缩 go-to-market 周期
    - TSMC 和 AMD 作为战略投资人（Series C 和 C1）验证了技术成熟度和制造路径
    - NVIDIA NVLink Fusion 与 Marvell 的合作，把 Celestial AI 的 Photonic Fabric 放到最重要 AI scale-up 生态中心
    - 2024 年以低成本收购困境中的 Rockley Photonics IP，补强了有价值的波导 IP 和专利位置
    - 创始团队（Dave Lazovsky、Phil Winterbottom）有深厚硅光和电信 IP 积累
  topRisks:
    - 收购时尚未产生收入：交割时生产收入为零；FY2028 做到 $500M ARR 仍未验证，取决于 2–3 个大型 hyperscaler design-win 转入量产
    - EAM 技术成熟度风险：良率曲线、插入损耗，以及与高热 XPU 共封装的热性能尚未在量产规模公开验证
    - TSMC CoWoS 产能约束：先进封装供给是闸门；产能短缺会延后收入，即便客户需求存在
    - Ayar Labs（NVIDIA 支持，MRM 技术）：NVIDIA 同时投资 Marvell 的 NVLink Fusion 和 Ayar Labs，形成双重对冲，也制造生态竞争
    - 关键人才留存：约 141–152 名硅光专家；earn-out 锁定能提供 2–3 年留任激励，但 earn-out 之后流失风险高
    - 美国对 AI 互连技术的出口管制可能限制国际销售，压低 TAM
  unresolvedGaps:
    - scale-up 光 chiplet 细分市场没有独立规模预测；Marvell 的 $500M ARR 目标无法对照独立 SAM 估算
    - Celestial AI 实际 Photonic Fabric 带宽、能效和良率规格没有独立发布；所有技术主张来自公司材料或基于竞品对比推断
    - 量产客户身份未披露；客户管线承诺深度（已签 LOI 还是非正式接触）未知
    - earn-out 触发条件（$2.25B 或有对价）未公开；$500M ARR 是否足以拿满 earn-out 仍不清楚
    - Rockley Photonics IP 收购的权属链未独立验证；破产 IP 转让可能带有不完整权属链
