  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: |
              Celestial AI 在 2021 年 1 月至 2025 年 3 月之间完成五轮外部融资，合计约 $515 million。
              2021 年 1 月 $2.87 million 种子轮为推进 Photonic Fabric 概念提供初始资金。2022 年 2 月，
              Lux Capital 领投 $56 million Series A，支持早期芯片设计和首批流片。2023 年 6 月，
              Tiger Global Management 领投 $100 million Series B；当时公司推进首批商业原型，并扩大工程团队。

              2024 年 3 月由 U.S. Innovative Technology Fund（USIT）领投的 $175 million Series C，
              是一个关键战略里程碑：它引入 AMD Ventures、TSMC Ventures（VentureTech Alliance）、
              Samsung Catalyst 以及多家与超大规模云厂商相邻的投资人，在供应链层面验证了 AI 光子化命题。
              该轮投后估值 $1.22 billion，使 Celestial AI 成为独角兽。十三个月后，2025 年 3 月，
              Celestial AI 完成由 Fidelity Management and Research 领投的 $250 million Series C1，
              BlackRock、Maverick Silicon 新加入，Lip-Bu Tan 个人出资（他同时加入董事会）。该轮投后估值
              $2.5 billion。

              Series C 与 Series C1 之间，Celestial AI 于 2024 年 10 月以约 $20 million 收购 Rockley
              Photonics IP 组合——这是一笔资产负债表层面的现金部署，以困境资产价格买入 200 多项专利，
              覆盖电吸收调制器、光电系统级封装和光交换技术。Rockley 2023 年初申请 Chapter 11，所以这是
              一笔机会型战略收购，在最大一轮融资和最终退出前加固了 Celestial AI 的 IP 护城河。
