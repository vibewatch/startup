      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: |
              Celestial AI 在 Marvell 收购前共披露五轮风险融资，合计约 $515 million。
              最早有记录的是 2021 年 1 月约 $2.87 million 种子轮。2022 年 2 月，公司完成
              $56 million Series A，由 imec.xpand 领投，Koch Disruptive Technologies、
              M Ventures、The Engine、Tyche Partners 和 Xora Innovation（Temasek 子公司）参投。

              2023 年 6 月，$100 million Series B 交割，由 IAG Capital Partners、Koch
              Disruptive Technologies 和 Xora Innovation 领投；Samsung Catalyst Fund、
              Smart Global Holdings、Porsche Automobil Holding SE、The Engine、imec.xpand、
              M Ventures 和 Tyche Partners 也参投。Series B 对公司的估值约 $500 million。

              2024 年 3 月，公司完成 $175 million Series C，由 U.S. Innovative Technology
              Fund（USIT）领投，估值约 $1.22 billion。AMD Ventures 作为新的战略投资人加入，
              老股东也继续支持。2024 年 10 月，Celestial AI 收购 Rockley Photonics 专利组合，
              以加强 Photonic Fabric IP。

              Series C1 —— $250 million（部分报道称 $255 million）于 2025 年 3 月交割 ——
              由 Fidelity Management & Research 领投，引入 BlackRock、Maverick Capital
              （Maverick Silicon）、Tiger Global Management 和 Lip-Bu Tan 等新投资人。TSMC 的
              VentureTech Alliance 和 Samsung Catalyst Fund 也参投。此轮对 Celestial AI 估值
              $2.5 billion，较 Series C 翻倍以上。

              2025 年 12 月 2 日，Marvell Technology 宣布签署最终协议，以 $3.25 billion
              前置对价收购 Celestial AI（$1 billion 现金加约 27.2 million 股 Marvell 股票）；
              若 Celestial AI 达到累计收入里程碑，还可获得最高约 $2.25 billion 的额外股权
              或有对价。收购于 2026 年 2 月 2 日完成。
            claimRefs:
