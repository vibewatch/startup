      - number: '2.3'
        title: 买方与细分客群
        blocks:
          - type: paragraph
            body: |
              scale-up 光互连技术有三类主要买方画像：

              **细分 1 — 超大规模云厂商：** AWS、Google、Microsoft、Meta、Alibaba、Oracle
              和其他大型云运营商，是采购包含光互连的 AI 基础设施的最终买方。它们 2025 年合计
              投入 $315–320B 数据中心资本开支。预算由 CTO 下的基础设施工程组织（VP/SVP 级）掌握；
              采购通常跨多年。采用触发点：AI 集群超出铜互连的有效距离（400G 下约 1m），并需要
              把 AI 集群扩展到数万至数百万个 XPU。

              **细分 2 — AI 芯片公司 / XPU 设计方：** NVIDIA、AMD、Intel、定制 ASIC 设计公司
              （包括 Marvell 自己的定制 XPU 客户）。这些客户购买或授权光互连芯粒，直接集成进
              XPU 芯片封装。预算在芯片架构和封装工程团队。采用触发点：电 I/O 带宽密度超过上限
              （铜约 3 Tbps/mm²，对比硅光子约 10 Tbps/mm），并降低每 bit 功耗，以支持更高 TDP 封装。

              **细分 3 — 系统集成商和 ODM：** Super Micro、Quanta、Foxconn 等公司为超大规模云
              厂商部署 AI 服务器系统。它们设计承载光芯粒的板卡和封装。这是衍生需求，取决于细分
              1 和 2 的采用决策。

              买方旅程漫长且技术复杂。超大规模云厂商通常需要 12–36 个月联合硬件认证，才会进入
              生产部署。芯粒集成模式（与 XPU 共封装）要求在 XPU 设计阶段就早期介入，即量产前
              24–36 个月——也就是说，销售周期在产品尚未出货时就已启动。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: |
              AI 数据中心光互连竞争格局中，有四个与 Celestial AI 的 Photonic Fabric 平台相关的
              层级。第一层是直接光芯粒同行——这些公司开发用于 XPU-to-XPU 和 XPU-to-memory
              scale-up 链路的封装内或共封装硅光子芯粒——最重要的是 Ayar Labs，其次是 Ranovus。
              第二层是平台型既有厂商，它们依托既有半导体或系统优势，已推出或正积极开发硅光子
              光芯粒：Intel Silicon Photonics、Broadcom（CPO）和 NVIDIA（NVLink 生态）。第三层
              是成熟光组件制造商，主要是 Coherent Corp，在相邻 CPO/LPO 产品线规模化竞争。第四层
              是 LightMatter，这家光计算和互连初创公司的 Passage 光子中介层采用不同架构，但用例
              与 Celestial AI 的互连场景重叠。

              整个光芯粒品类必须替代的现状技术，是 NVIDIA 铜基 NVLink scale-up 架构。第五代
              （Blackwell）NVLink 支持每块 GPU 1.8 TB/s 总带宽，并可组成最高 576 块 GPU 的 pod。
              UALink 联盟——成员包括 Broadcom、AMD、Intel、Google、Microsoft、Cisco 和 Meta——于
              2025 年 4 月发布开放标准 UALink 1.0 规范，目标是每个 AI pod 最多连接 1,024 个加速器；
              但硬件预计最早也要到 2026 年末，因此截至报告日，NVLink 仍是唯一已出货的高带宽
              scale-up 架构。

              竞争对手融资明显提速：Ayar Labs 2026 年初完成 $500M Series E（累计 $870M），
              LightMatter 2024 年 10 月完成 $400M 融资（累计 $850M，估值 $4.4B），Ranovus 2025 年
              8 月承诺在 Ottawa 投入 $100M+ 扩建制造。竞争强度很高，制造就绪度、生态入口和架构
              针对性将决定设计定点。
