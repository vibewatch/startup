  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概览与定位
        blocks:
          - type: paragraph
            body: |
              Celestial AI 的 Photonic Fabric 是硅光子光互连平台，设计目标是在 AI 数据中心基础设施中替代
              铜基 scale-up 互连架构。在客户流程中，部署 XPU 集群的 AI 系统运营商——GPU、TPU 或定制 AI
              加速器——面临根本的带宽和延迟约束：NVLink、UALink 等铜互连限制总带宽、每 bit 功耗，以及
              可在单一 scale-up domain 中紧密耦合的 XPU 数量。Photonic Fabric 的解决方式，是把光芯粒直接
              与 XPU 共封装，提供芯片到芯片光链路：每模块带宽超过 10 Tbps，端到端功耗约 3.1 pJ/bit；
              相比之下，可插拔光模块为 15 pJ/bit 或更高，同等规模下铜互连功耗更高。

              主要用例是 scale-up（在服务器内或跨机架连接 XPU-to-XPU）和内存解耦（通过 Photonic Fabric
              Appliance 连接 XPU 到远端内存池；该设备支持最高 32 TB 统一 HBM3e-backed DDR5 内存，访问延迟
              低于 200 ns）。这些用例直接对应超大规模云厂商需求：突破单服务器节点物理限制，扩展 LLM 推理和
              训练工作负载，让传统内存架构无法支持的批量大小和序列长度成为可能。

              Photonic Fabric Module 以芯粒形式交付，用于与 XPU 直接共封装。它在 2.5D 系统级封装中
              集成 TSMC 5nm 定制控制 ASIC、HBM3e 和 DDR5 内存控制器、硅光子中介层和多光纤阵列。Photonic
              Fabric Appliance 是机架形态产品（2U），在内存解耦场景下提供最高 115 Tbps 总光带宽；它使用
              同一底层芯粒技术，配有 16 端口交换网络。这两种形态覆盖 scale-up（芯粒、共封装）和
              scale-out（appliance、机架连接）连接需求。

              2026 年 2 月 Marvell 完成收购后，Photonic Fabric 让 Marvell 成为唯一能以共封装组件提供全光
              scale-up 连接的定制 XPU 供应商。与 NVIDIA 的 NVLink Fusion 合作，加上 NVIDIA 2026 年 3 月对
              Marvell 的 $2 billion 投资，把 TAM 扩展到 NVIDIA 生态 AI 集群，而不只是 UALink 架构。
