      - number: '7.2'
        title: 市场时点与采用风险
        blocks:
          - type: paragraph
            body: |
              Marvell 的业绩对价结构——2028 财年目标为 $500M ARR，达到最高支付额需要 $2B ARR——
              与超大规模云厂商采用 CPO 的节奏高度绑定。三项因素带来实质性时点风险。

              CPO 采用时间线。LightCounting 2025 年 7 月对首届虚拟 CPO 会议的分析认为，初始
              大规模 CPO 部署会在 2026 年开始，但高出货量铺开更可能在 2027 年。这与超大规模场景
              定制硅从导入设计到量产通常需要 24–36 个月一致，也与 Marvell 对 Celestial AI
              到 2027 财年收入仍微乎其微的指引一致。任何进一步滑移——超大规模客户项目延期、集成
              挑战、采购优先级重排——都会把首批实质性收入推向 FY2028，压缩业绩对价窗口。

              铜基础设施寿命。基于铜的 NVLink、InfiniBand 和 Ethernet 互连系统已在 400G 验证
              可靠性，并正升级到 800G。若超大规模云厂商认为，到 2020 年代后期铜方案仍足以支撑
              AI 系统——或者 AI 集群扩展在需要纯光互连之前见顶——Photonic Fabric 的可服务机会总量
              可能明显缩小，或比 Marvell 内部模型假设更晚出现。

              AI 资本开支集中风险。Marvell 的 $500M ARR 目标意味着，早期收入绝大部分将来自两到三家
              超大规模云客户。领先超大规模云厂商一旦放缓 AI 基础设施资本开支——原因可能是宏观压力、
              资本开支纪律周期，或 AI 工作负载特征变化——Photonic Fabric 需求会直接下降。这种集中度
              意味着，单一超大规模云厂商的量产排期延误，实质上就是公司的收入延误。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 竞争与战略风险
        blocks:
          - type: paragraph
            body: |
              光学 chiplet 市场仍处萌芽期，但争夺已迅速升温。Marvell/Celestial AI 面临三项可信
              竞争威胁，以及一项来自 NVIDIA 关系的结构性战略风险。

              Ayar Labs。Ayar Labs 2025 年 3 月发布 TeraPHY，称其为行业首款 UCIe 光互连 chiplet，
              借助 16 波长 SuperNova 光源实现 8 Tbps 带宽。NVIDIA、AMD 和 Intel 均已投资 Ayar Labs。
              关键在于，NVIDIA 的投资绑定让 Ayar Labs 有机会成为 NVIDIA 生态部署的首选光学 chiplet
              供应商。Ayar 与 Global Unichip Corp (GUC)——TSMC 生态中关键 ASIC 设计服务公司——合作，
              瞄准超大规模客户，并计划把 TeraPHY 嵌入参考 AI 设计。Ayar Labs 目标在 2026 年中进入
              量产，到 2028 年把出货放大到数亿颗 chiplet。若 Ayar Labs 跑出这条爬坡曲线，
              Marvell/Celestial AI 可能在业绩对价里程碑要求之前就遭遇规模化竞争。

              Intel OCI 与 Broadcom CPO。Intel 自有光连接（OCI）硅光子平台服务
              Intel Gaudi 客户，形成封闭客户群内的竞争替代。Broadcom 集成 CPO 的 Tomahawk 6 交换机，
              则在 AI 交换层构成竞争产品。Intel OCI 和 Broadcom CPO 目前都不瞄准 Photonic Fabric
              的同一 scale-up 互连位置，但相邻层的竞争压力会限制 Marvell 的定价权和生态覆盖。

              NVLink Fusion 战略依赖。NVIDIA 2026 年 4 月宣布向 Marvell 投资 $2B，并与其建立
              NVLink Fusion 合作，一方面验证光互连论点，另一方面也制造战略依赖。若 NVIDIA 调整
              合作条款、收购替代光学 chiplet 供应商，或推进自研光子项目，Marvell 的 NVLink Fusion
              渠道就会承压。该合作的商业条款未公开披露，独家性、定价和终止条款都不透明。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 交易概览与隐含交易倍数
        blocks:
          - type: paragraph
            body: |
              Marvell Technology 于 2026 年 2 月 2 日完成对 Celestial AI 的收购，距离 2025 年 12 月
              2 日随 FY2026 财年第三季度业绩一同宣布交易约两个月。交易结构包括两个不同批次。前期
              对价合计约 $3.25B：$1B 现金，加上约 27.2M 股新发行 MRVL 普通股；
              该股票部分按公告前 10 日成交量加权均价估值约 $2.25B。或有业绩对价最高再增加
              27.2M 股 MRVL 股票（约 $2.25B），按截至 Marvell 2029 财年年末的
              Celestial AI 累计收入里程碑分批支付。

              按传统历史收入指标，这笔交易无法建立基准，因为 Celestial AI 收购时尚未产生收入——收入
              微乎其微，且尚未实现商业部署。Marvell 管理层给出了前瞻收入指引：Celestial AI 到
              FY2028 Q4 达到 $500M 年化运行率（约为 2027 自然年下半年，交易完成后约 18 个月），
              到 FY2029 Q4 达到 $1B 年化运行率。以这些目标作分母，隐含 EV / 前瞻 ARR 倍数为：
              （1）$3.25B 前期对价除以 $500M 两年前瞻 ARR = 6.5× NTM ARR；（2）
              $5.5B 完整业绩对价价值除以 $500M ARR = 首个里程碑 11.0×；（3）
              $5.5B 除以 $1.0B FY2029 ARR = 5.5×。上一轮 VC 估值是 2025 年 3 月
              Series C1 的 $2.5B，意味着前期价格溢价 30%，完整业绩对价下理论最高溢价 120%。
              五轮融资投入资本合计约 $515M，对应前期价格约为投入资本的 6.3×。

              财务顾问提供了独立定价信号。Celestial AI 的顾问为 Morgan Stanley（财务）和
              Latham & Watkins（法律）。Marvell 的顾问为 Citigroup（财务）和 Wilson Sonsini
              Goodrich & Rosati（法律）。两组顾问都符合半导体行业一线竞争性 M&A 流程的配置。公告日
              MRVL 股价上涨约 9–13%，反映投资者认可战略逻辑。市场当时也在消化强劲的 FY2026 Q3 业绩
              和上调后的指引，因此股价涨幅不能完全归因于收购公告本身；不过，市场并未因一家无收入公司
              获得 $3.25B 出价而出现负面反应，这说明买方共识认为价格公平，或至少有战略正当性。
