      - number: '4.2'
        title: 收购财务条款
        blocks:
          - type: paragraph
            body: |
              Marvell Technology 于 2025 年 12 月 2 日随 FY2026 第三财季业绩宣布最终收购协议，并于
              2026 年 2 月 2 日完成交易。交易结构由两部分组成。前置对价约为 $1.0 billion 现金，加约
              27.2 million 股 MRVL 普通股；按公告前 10 天成交量加权平均价计算，股票价值约 $2.25 billion，
              合计前置价值约 $3.25 billion。或有对价最高约为额外 27.2 million 股 MRVL 股票
              （约 $2.25 billion），与 Marvell 2029 财年结束前的累计收入里程碑挂钩。或有对价分档：若到
              2029 财年末 Celestial AI 累计收入至少达到 $500 million，释放三分之一；只有累计收入超过
              $2.0 billion，全部或有对价才归属。

              现金部分来自 Marvell 现有现金，交割时现金余额减少 $1 billion，并使预期年度利息收入减少约
              $38 million。股票对价需要发行约 27 million 股 MRVL 新股，使稀释加权平均股数增加同等数量。
              作为更广泛战略合作的一部分，Marvell 同时向 Amazon 发行一份认股权证，可按每股 $87.0029
              购买约 1,045,171 股 MRVL，归属基于 Amazon 截至 2030 年底累计购买 Photonic Fabric 产品的金额。
              此次收购还使 Marvell 年化 non-GAAP 运营费用基准增加约 $50 million，反映
              Celestial AI 工程和开发团队成本。
