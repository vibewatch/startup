      - number: '6.2'
        title: 战略投资人信号作为客户代理指标
        blocks:
          - type: paragraph
            body: |
              在半导体行业，战略性企业风险投资通常可靠地传递供应链协同，以及潜在客户或制造合作伙伴意图。Celestial AI
              在 Series C（2024 年 3 月）和 Series C1（2025 年 3 月至 8 月）中的投资人名单，包含多家战略投资方；它们同时很可能是
              客户、制造合作伙伴或关键生态参与者。

              AMD Ventures 参与 Series C，显示 AMD 对未来 XPU 架构所需光互连技术感兴趣。AMD 是主要 AI 加速器供应商，其 XPU 产品可
              直接集成 Photonic Fabric，用于池化内存 scale-up。这一协同让 AMD 成为高概率设计合作伙伴，也可能通过使用 AMD 芯片的
              超大规模云厂商委托定制芯片项目成为间接客户。

              TSMC VentureTech Alliance 参与 Series C，并在 2025 年 8 月最终 Series C1 交割中继续参投，确认代工厂层面制造协同。
              TSMC 是 Celestial AI 先进节点硅光子芯粒唯一可信的量产制造商；这项投资有助于争取优先产能、工艺共同开发和供应链准备，
              支撑 Photonic Fabric 转向量产。Samsung Catalyst 两轮参投，传递 HBM 内存集成兴趣；Samsung 的先进封装与 HBM 能力，是
              Photonic Fabric 内存解耦架构直接需要的能力。

              Amazon 的角色最直接，也最具商业意义。Marvell 宣布收购 Celestial AI 时，向 Amazon 发行可购买约 1,045,171 股 MRVL 的
              认股权证，行权价每股 $87.0029；归属完全绑定 Amazon 到 2030 年 12 月累计购买 Photonic Fabric 产品的金额，并可行权至
              2031 年 12 月。这一结构在法律和财务上把 Amazon 绑定为前瞻客户，并用股权激励推动 Photonic Fabric 采用，让 Marvell 获得
              多年需求可见度；分析师形容，这等同于把 Amazon 锁定为基础客户。生态还包括 Broadcom（定制芯片与 ASIC 设计服务）和
              Samsung（HBM 与先进封装），构成服务超大规模云厂商量产客户所需的供应链。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Marvell 客户渠道与具名终端客户
        blocks:
          - type: paragraph
            body: |
              收购后，Marvell 既有定制 AI 芯片关系，是 Celestial AI 的 Photonic Fabric 触达超大规模云厂商终端客户的主要商业渠道。
              Marvell 目前服务三个超大规模云厂商定制芯片项目，商业关系已确认或接近确认。

              Microsoft 是 Marvell 最大且战略意义最强的定制 AI 芯片客户。Microsoft Project Maia300——Maia200 的后续项目——正在与
              Marvell 作为主要 ASIC 设计伙伴共同开发，目标采用 2nm 工艺节点并集成 HBM4 内存。预计到 2026 自然年末出货 300,000 至
              400,000 颗，2027 年爬坡至 1.2 million 至 1.5 million 颗。Maia300 项目正好需要 Photonic Fabric 提供的共封装光学 scale-up 连接，
              因此是最清晰的近期集成路径，可带来首批 Photonic Fabric 收入贡献。

              Amazon 是 Marvell 第二个主要定制芯片客户，项目包括 Trainium AI 训练和 Inferentia AI 推理。作为 Marvell-Celestial AI
              收购协议一部分授予的 Amazon MRVL 股票专项认股权证，确认 Amazon 是所有可公开识别方中承诺最明确的未来 Photonic Fabric 客户。
              虽然 Alchip 在下一代 Trainium 变体上的竞争压力，为 Marvell 在核心 XPU 中的长期角色带来一些不确定性，但认股权证结构把
              Amazon 股权收益明确绑定到 Photonic Fabric 采购，确保激励一致。

              据报道，Google 在 2026 年初与 Marvell 进行后期谈判，可能成为其第三个主要定制 AI 芯片伙伴，用 Marvell 设计的推理导向芯片
              补充其 Broadcom 和 TPU 基础设施。这将为 Photonic Fabric 创造第三条分销渠道。NVIDIA 于 2026 年 3 月 31 日宣布的 NVLink
              Fusion 合作，则创造第四条路径：让第三方定制芯片接入 NVIDIA NVLink 互连网络；NVIDIA 向 Marvell 投资 $2 billion，以共同
              大规模开发光网络和硅光子能力。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术执行风险
        blocks:
          - type: paragraph
            body: |
              Celestial AI 的 Photonic Fabric 是一款硅光子光学 chiplet，采用在 TSMC 先进制程节点
              制造的电吸收调制器（EAM），并通过 CoWoS 先进封装共封装。四类相互咬合的技术风险
              可能拖累收入爬坡。

              制造良率与产能。高产量下，基于 EAM 的 chiplet 硅光子良率尚未公开披露。
              Celestial AI 已报告至少四次成功流片，以及在 -10 dBm OMA 输入下低于 1e-8 的 FEC
              前误码率；这些数据与可量产的光子良率相符，但量产良率曲线仍未公开。更紧迫的近端
              约束是 TSMC CoWoS 先进封装产能：TSMC 的 CoWoS 产线到 2026 年都已售罄，NVIDIA
              预计为 Blackwell 和 Rubin GPU 项目预留了 CoWoS-L 产能的 60–70%。即便 TSMC 目标
              在 2026 年底前把 CoWoS 月产能从约 70,000 片晶圆扩至 130,000 片，独立分析师仍预计
              需求会继续超过供给。这给 Marvell 带来预留时点风险：只要 CoWoS 档期锁定延迟，
              Photonic Fabric 的放量和 $500M ARR 目标就会直接后延。TrendForce 2026 年 4 月报道称，
              CoWoS 先进封装晶圆 ASP 据称正接近 7nm 晶圆水平，显著推高单位成本压力。

              热管理。共封装光学把光引擎放到高温 XPU 裸片近旁，规模化后热协同管理并不简单。
              EAM 在这里有明显优势：Celestial AI CTO Phil Winterbottom 在 Hot Chips 2025 演示，
              EAM 能承受最高 200°C/秒的温度突变，并在超过 85°C 的温度摆幅下运行而不损伤信号
              完整性——相较需要精细热控的环形调制器，这是直接优势。不过，把 XPU 裸片和激光泵浦源
              放进同一个先进封装后，二者合并热包络的管理仍待工程上持续解决。

              集成软件与技术过时。跨多机架 AI 集群管理光 I/O 的固件和软件栈，整个行业都还不成熟。
              配置管理、故障隔离、光链路动态重构，相比铜互连都会增加复杂度。与此同时，替代光子平台——
              绝缘体上铌酸锂（LNOI）、磷化铟（InP）和 III-V 族化合物半导体——仍在推进；其中 LNOI
              因超低插入损耗和高带宽密度尤其受到研究关注。若任一替代平台以有竞争力的成本跑通
              CMOS 兼容量产，EAM 硅光子在 5–7 年周期内可能面临技术过时风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
