      - number: '5.2'
        title: 核心技术架构
        blocks:
          - type: paragraph
            body: |
              Photonic Fabric 的技术基础落在三项相互关联的创新上：以电吸收调制器（EAM）作为主要光调制元件；
              将光 I/O 放在裸片内任意位置，而不是只能在芯片边缘；以及 Optical Multi-Chip Interconnect
              Bridge（OMIB），把光子器件集成进封装桥，以实现多芯粒连接。

              电吸收调制器靠移动半导体材料的吸收边工作——通常是在 TSMC 硅光子工艺上的 Ge/Si 量子阱——
              外加电压后调制光强，无需谐振腔。因此 EAM 天然能承受超过 85°C 的温度变化和每秒 200°C 的瞬态
              热爬升；这些条件会让微环谐振器难以工作，因为后者需要主动热调谐加热器，每个环都会增加功耗。
              纯模拟 SerDes 设计中，电子部分约 2.4 pJ/bit，激光部分 0.7 pJ/bit，总计约 3.1 pJ/bit；采用
              数字信号处理器（DSP）的竞争方案（包括可插拔光模块）则为 5–15 pJ/bit。

              裸片内光 I/O 架构通过 TSMC 5nm CoWoS 封装中的硅光子中介层嵌入光子结构，消除了传统边缘 I/O
              约束。这样光收发器可放在裸片表面任意位置，释放裸片边缘给 HBM 和 DDR I/O，提高总光带宽密度，
              并可把光引擎放到 500W–900W GPU 裸片下方，而不会在相邻电路中造成热点。

              OMIB（Optical Multi-Chip Interconnect Bridge）把光连接延伸到一个封装内的多个芯粒，以及
              多芯片模块中的多个封装。OMIB 链路实现低于 200 ns 的端到端芯片到内存延迟，对延迟容忍型
              操作而言可比本地 HBM 访问。波分复用（WDM）用于最大化每根光纤的带宽密度，在 -10 dBm OMA 输入下，
              pre-FEC BER 低于 1e-8。

              截至 OFC 2025 和 Hot Chips 2025 演示，已完成四次 TSMC 5nm/4nm 流片，验证了 TSMC 硅光子工艺集成。
              制造依赖 TSMC SiPh 工艺结合 CoWoS 2.5D 中介层封装；TSMC 当时正将该能力向 CPO 量产成熟推进——目标是
              在 H2 2025 为领先 AI 客户量产 1.6 Tbps 光模块。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: IP 与技术栈
        blocks:
          - type: paragraph
            body: |
              Celestial AI 的知识产权组合，既包括公司 2020 年创立以来自主申请的专利，也包括 2024 年 10 月
              以困境资产价格收购的 Rockley Photonics 专利组合。合并后全球专利超过 200 项，覆盖已授权和待审申请，横跨三大技术支柱：
              光电系统级封装、电吸收调制器和光交换技术。

              Phil Winterbottom（CTO）来自 Bell Labs 1127 Computer Science Research Center，拥有深厚电信光子经验，
              也是连续创业者（Entrisphere 和 Gainspeed）。他的架构贡献——特别是裸片内 EAM 布局和 OMIB 桥概念——
              被广泛认为是 Photonic Fabric 区别于环形谐振器竞争方案的核心。David Lazovsky（CEO）和 Preet Virk（COO）
              带来半导体商业化背景，与 CTO 的技术深度互补。

              Rockley Photonics IP 于 2024 年 10 月以约 $20 million 收购，当时 Rockley 刚经历 Chapter 11 破产保护和
              后续重组。Rockley 专利最早可追溯到 2014 年，早于多数硅光子初创公司，包含基础 EAM 波导结构和光电封装
              权利要求，可直接用于 Celestial AI 的裸片内架构。此次收购在 Series C1 融资和 Marvell 收购前加固了 IP 护城河。

              技术栈的制造层完全依赖 TSMC SiPh 工艺与 CoWoS 2.5D 先进封装，形成单一代工厂依赖：这既是优势
              （TSMC 先进节点质量和 TSMC Ventures 战略协同），也是风险（CoWoS 产能受到 NVIDIA 和 Broadcom 大量需求挤压）。
              软件层提供互连网络管理、遥测、可靠性 / 可用性 / 可维护性（RAS）和面向超大规模云厂商集群集成的 AI 驱动分析。
              软件栈对于生产级超大规模云厂商部署的成熟度和完整性，尚未得到独立验证。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户概览与市场位置
        blocks:
          - type: paragraph
            body: |
              Celestial AI 在 2026 年 2 月 2 日被 Marvell Technology 收购时仍未产生收入。公司所处的半导体硬件品类，
              只有当芯片以量产规模部署到超大规模云厂商数据中心后才能确认收入；从初始设计导入到首笔收入通常需要
              24 至 36 个月。收购时没有公开确认的量产客户。Marvell 明确指引，Celestial AI 对 2026 财年和 2027 财年的收入贡献极小。

              虽然没有量产收入，Celestial AI 并非没有可记录的客户进展。2024 年 3 月，在 Optical Fiber Communication（OFC）
              会议上，公司宣布一家领先（未具名）超大规模云厂商已正式采用 Photonic Fabric，用于下一代 AI 处理器——公司称这是
              AI 系统设计中最早一批用光学替代方案取代铜互连的大规模承诺之一。CEO Dave Lazovsky 多次接受采访时表示，更多
              超大规模云厂商正基于 NDA 进行技术评估。该设计定点暗示的产量——量产爬坡时每季度数十万颗芯粒——说明管线具有
              实质规模，而非探索性概念验证。

              Photonic Fabric 最终买方是超大规模云和 AI 基础设施运营商：Amazon Web Services、Microsoft Azure、Google Cloud
              和 Meta。这些公司为训练和推理工作负载构建定制 AI 加速器（XPU）。Photonic Fabric 通过每方向每芯粒 16 Tbps 的光学
              scale-up 连接，缓解处理单元与内存池之间的带宽瓶颈——AI Memory Wall。Celestial AI 的客户触达模式要求与超大规模云厂商和
              ASIC 封装合作伙伴深入协同设计导入，这也解释了为什么收入前的接触期会持续多年。收购后，Marvell Technology 既是
              Photonic Fabric 技术的主要托管方，也是主要内部客户，将其整合进 Data Center Group 的定制芯片项目，再交付给超大规模云厂商
              终端客户。
