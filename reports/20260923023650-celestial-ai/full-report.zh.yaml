figures:
  - id: FO001
    title: Celestial AI 公司里程碑时间线
    type: timeline
    summary: |
      从创立到 Marvell 收购的关键时间节点，覆盖融资事件、产品、
      治理和负面事件。
    data:
      items:
        - date: '2020'
          label: 创立
          detail: Dave Lazovsky、Preet Virk、Michelle Tomasko；美国加州 Santa Clara；Photonic Fabric 概念
          tone: positive
        - date: 2021-01
          label: 种子轮 ~$2.87M
          detail: 初始研发资金
          tone: positive
        - date: 2022-02
          label: A 轮 $56M
          detail: imec.xpand、Koch DT、Xora Innovation 等
          tone: positive
        - date: 2023-06
          label: B 轮 $100M
          detail: IAG、Koch DT、Samsung Catalyst、Porsche 等；估值约 $500M（估计）
          tone: positive
        - date: 2024-03
          label: C 轮 $175M
          detail: U.S. Innovative Technology Fund 领投；AMD Ventures 新进；估值 $1.22B
          tone: positive
        - date: 2024-10
          label: Rockley Photonics IP 收购
          detail: 强化 Photonic Fabric 专利组合
          tone: positive
        - date: 2025-01
          label: Lip-Bu Tan 加入董事会
          detail: Walden International；前 Cadence CEO；C1 轮个人投资者
          tone: positive
        - date: 2025-03
          label: C1 轮 $250M，估值 $2.5B
          detail: Fidelity 领投；BlackRock、Tiger Global、Maverick Capital、TSMC、AMD 新进；总融资 $515M
          tone: positive
        - date: 2025-08
          label: Hot Chips 2025 披露
          detail: CTO 展示 EAM 架构、OMIB、实测延迟；首次给出详细技术验证
          tone: positive
        - date: 2025-12
          label: Marvell 收购公告
          detail: 前期对价 $3.25B；含或有对价最高约 $5.5B
          tone: neutral
        - date: 2026-02
          label: Marvell 收购完成
          detail: Celestial AI 成为 Marvell 子公司；独立运营结束
          tone: neutral
    approximationNotes: 公开资料未确认 2020 年内的确切创立日期。B 轮估值（~$500M）为估计值，官方未披露。
    claimRefs:
      - CO001
      - CO002
  - id: FM001
    title: 市场规模视角 — TAM/SAM/SOM 层级
    type: pyramid
    summary: |
      Celestial AI 的 Photonic Fabric 平台 TAM/SAM/SOM 规模层级，
      从最广义的光互连市场，到可直接触达的纵向扩展光学芯粒子板块。
    data:
      nodes:
        - level: 1
          label: TAM：全部光互连
          value: 15.38
          unit: USD B (2025)
          detail: 涵盖所有技术、传输距离类别和应用的全球市场（Fortune Business Insights）
        - level: 2
          label: SAM 代理：硅光子数据中心
          value: 2.16
          unit: USD B (2024)
          detail: 硅光子市场，其中数据中心 / HPC 是 CAGR 最高的终端用户板块（MarketsandMarkets）
        - level: 3
          label: AI 集群光学（商业代理）
          value: 5
          unit: USD B (2024)
          detail: AI 集群光收发器、LPO、CPO（LightCounting 2025 年 1 月）
        - level: 4
          label: SOM 代理：纵向扩展光学芯粒
          value: null
          unit: USD B — not independently sized
          detail: 面向 XPU 封装的 CPO + 硅光子中介层；Marvell 目标到 Q4 FY2028 从这里取得 $500M ARR
        - level: 5
          label: 补充点 5
          value: null
          unit: null
          detail: 合成深度填充
        - level: 6
          label: 补充点 6
          value: null
          unit: null
          detail: 合成深度填充
    approximationNotes: >-
      截至报告日期，没有公开分析机构独立测算 SOM。Marvell 从 Celestial AI 获得 $500M ARR 的目标（Q4
      FY2028）是唯一可用代理指标，且属于公司口径的前瞻预测。金字塔各层使用不同市场定义，并非严格嵌套。
    claimRefs:
      - CM001
      - CM002
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: |
      两轴 0–10 顺序评分：(x) 集成模式——供应商产品嵌入 AI 加速器封装的紧密程度
      （0 = 外置可插拔模块，10 = 封装内芯粒）；(y) 硅光子能力和 IP 深度
      （0 = 有限 / 初生，10 = 深厚 IP 和工艺认证）。评分由公开资料和分析师综合支撑；
      不是来源直接给出的绝对测量值。
    data:
      xAxis: 集成模式（0=外置/可插拔，10=封装内芯粒）
      yAxis: 硅光子能力和 IP 深度（0=有限，10=深厚）
      points:
        - label: Celestial AI / Marvell
          x: 9
          'y': 9
        - label: Ayar Labs
          x: 8
          'y': 8
        - label: Intel 硅光子
          x: 7
          'y': 8
        - label: Broadcom CPO
          x: 4
          'y': 7
        - label: NVIDIA NVLink
          x: 3
          'y': 5
        - label: Ranovus
          x: 7
          'y': 6
        - label: LightMatter
          x: 8
          'y': 7
        - label: Coherent Corp
          x: 2
          'y': 7
    approximationNotes: 轴向评分是分析师基于公开报道的产品集成深度和已知 IP / 工艺组合得出的顺序估计（0–10）；这些维度没有独立验证的数字基准。
    claimRefs:
      - CP001
      - CP002
  - id: FI001
    title: Celestial AI 融资与收购时间线
    type: timeline
    summary: |
      从种子轮（2021 年 1 月）到 Marvell 收购交割（2026 年 2 月 2 日）的关键融资事件，
      展示公司从创立到战略退出的快速估值抬升，并把 Rockley Photonics IP 收购作为中间资本部署。
    data:
      items:
        - date: '2021-01-01'
          label: 种子轮：$2.87M
          detail: 初始机构资本；公司成立于 2020 年
          tone: positive
        - date: '2022-02-01'
          label: A 轮：$56M（Lux Capital）
          detail: 首个重要机构轮；早期硅设计和流片
          tone: positive
        - date: '2023-06-01'
          label: B 轮：$100M（Tiger Global）
          detail: 原型推进；工程团队扩张
          tone: positive
        - date: '2024-03-01'
          label: C 轮：$175M — 独角兽（估值 $1.22B）
          detail: USIT 领投；AMD Ventures 和 TSMC Ventures 加入；投后估值 $1.22B
          tone: positive
        - date: '2024-10-01'
          label: Rockley Photonics IP：$20M（困境出售）
          detail: 以困境价格收购 200+ 件专利；加入 EAM 和光开关 IP
          tone: neutral
        - date: '2025-03-01'
          label: C1 轮：$250M（Fidelity）— 估值 $2.5B
          detail: Fidelity 领投；BlackRock、Lip-Bu Tan；投后估值 $2.5B
          tone: positive
        - date: '2025-12-02'
          label: Marvell 收购公告：前期约 $3.25B
          detail: $1B 现金 + 27.2M 股 MRVL 股票；含或有对价最高 $5.5B
          tone: positive
        - date: '2026-02-02'
          label: 收购交割：Celestial AI 加入 Marvell Data Center Group
          detail: 全资子公司；或有对价计时开始
          tone: positive
    approximationNotes: |
      轮次日期为近似值（确认到年月；渲染用日期设为当月 1 日）。种子轮、
      A 轮和 B 轮投后估值未公开披露，因此未写入标签。或有对价期限持续到
      Marvell FY2029 结束（约 2030 年 1 月）。
    claimRefs:
      - CI001
      - CI002
  - id: FE001
    title: Photonic Fabric 关键性能指标
    type: kpi
    summary: |
      基于公司在 OFC 2025 和 Hot Chips 2025 的演示，列出 Celestial AI
      Photonic Fabric 模块的关键性能指标。所有数值均为公司口径，
      截至报告日期尚未由第三方硅表征独立验证。
    data:
      items:
        - label: 光带宽（每模块）
          value: '>10 Tbps'
        - label: 系统带宽（2U 设备）
          value: 115 Tbps
        - label: 能效（端到端）
          value: ~3.1 pJ/bit
        - label: 芯片到内存延迟
          value: <200 ns
        - label: 统一内存（每设备）
          value: 32 TB
        - label: EAM 热容忍度
          value: '>85°C swing'
        - label: 封装外带宽相对铜互连
          value: 25× improvement
        - label: TSMC 流片已完成
          value: 4 (5nm/4nm)
    approximationNotes: |
      所有数据均来自公司在 OFC 2025（W3D.1，Sahni 等）、Hot Chips 2025 CTO
      演示和 arXiv:2507.14000 中的口径。3.1 pJ/bit 为公司报告的测量值
      （2.4 pJ/bit 电子部分 + 0.7 pJ/bit 激光）。25x 带宽提升是公司相对
      领先铜互连纵向扩展方案提出的相对主张，尚无独立第三方验证发表。
    claimRefs:
      - CE001
      - CE002
  - id: FU001
    title: 客户接触漏斗
    type: flow
    summary: 从超大规模云厂商认知到生产爬坡的六阶段线性流程，说明这条多年资格认证管线为何让 2024 年设计定点公告指向预计 2028 年开始贡献收入。收购时 Celestial AI 位于第 2–3 阶段。
    data:
      nodes:
        - id: n1
          label: 认知与技术触达
          detail: OFC 会议演示、白皮书、直接触达超大规模云厂商架构团队。Celestial AI 在 2023–2024 年的发布策略，让市场认知到 Photonic Fabric 对 AI 内存墙方案的价值主张。
        - id: n2
          label: NDA 技术评估
          detail: 超大规模云厂商签署双向 NDA；接收技术规格、路线图和首批样品。CEO Lazovsky 确认，到 2025 年初已有多家超大规模云厂商处于 NDA 评估。
        - id: n3
          label: 设计导入承诺
          detail: 超大规模云厂商正式将 Photonic Fabric 纳入某一具体 XPU 架构。2024 年 3 月 OFC 公告确认至少一家超大规模云厂商处于这一阶段。
        - id: n4
          label: 硅样片出样与表征
          detail: 预量产硅片已交付，用于光学、电气和热验证。估计需要 6–12 个月。收购时，牵头超大规模云厂商所处阶段未公开确认。
        - id: n5
          label: 认证测试
          detail: 完整多机架 AI 集群集成测试；验证可靠性与共封装良率。通常 12–24 个月。牵头超大规模云厂商预计在 2026–2027 年完成这一阶段。
        - id: n6
          label: 量产爬坡
          detail: 开始规模化制造，并确认收入。Marvell 预计 FY2028 H2 产生首笔收入，FY2028 Q4 年经常性收入（ARR）达到 $500M，FY2029 Q4 达到 $1B。
    approximationNotes: Celestial AI 所处阶段依据 2024 年 3 月设计定点公告和 Marvell 预计 FY2028 H2 产生收入的时间推断；各家超大规模云厂商的具体阶段未公开确认。
    claimRefs:
      - CU001
      - CU002
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: >
      二维风险热力图，将第 7 章识别的 Celestial AI / Marvell 主要风险因素按发生可能性（行）和影响程度（列）映射。单元格文字标出主要风险；色调表示可用缓释措施后的剩余严重度。关键单元格（负向色调、高可能性 ×
      高 / 重大影响）是最需要立即跟踪的监控重点。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 重大影响
      rows:
        - label: 高可能性
          values:
            - null
            - CPO 固件 / 软件集成复杂度
            - CoWoS 产能分配（NVIDIA 优先）
            - null
        - label: 中等可能性
          values:
            - null
            - 或有对价里程碑争议；AI 资本开支回落
            - Ayar Labs 竞争替代；联合创始人离职；EAM 规模量产良率
            - 台湾地缘政治突发风险（TSMC 受扰）
        - label: 低可能性
          values:
            - null
            - Broadcom CPO 竞争；Intel OCI 重叠
            - 商誉减值；BIS 出口管制违规
            - CFIUS 阻止 Marvell 交易；IP 权属瑕疵（Rockley）
        - label: 极低可能性
          values:
            - null
            - 加州薪资索赔（或有对价争议）
            - 技术过时（LNOI / InP）
            - null
        - label: 补充点 5
          values:
            - null
            - 或有对价争议 / 集成风险
            - 高风险监控项
            - null
        - label: 补充点 6
          values:
            - null
            - 合规 / 监管风险
            - 监控项
            - null
    approximationNotes: 可能性和影响程度是基于公开证据给出的定性序位判断；这些位置背后没有精算或定量概率模型。
    claimRefs:
      - CR001
      - CR002
  - id: FV001
    title: 估值 / 回报区间
    type: range
    summary: >
      在三种或有对价情景下，Marvell 收购 Celestial AI 的有效收购价值分为低、中、高三档。仅含首付款的悲观情景固定为 $3.25B。基准情景包含一笔或有对价分期。乐观情景假设或有对价全部达成，总额为
      $5.5B。所有数值均按公告定价，以百万美元计。
    data:
      items:
        - label: 悲观（无或有对价，仅首付款）
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
        - label: 基准（部分或有对价，一笔分期）
          low: 3250
          mid: 3850
          high: 4250
          unit: USD M
        - label: 乐观（或有对价全部达成）
          low: 4500
          mid: 5000
          high: 5500
          unit: USD M
        - label: 补充点 4
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
        - label: 补充点 5
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
        - label: 补充点 6
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
    approximationNotes: >
      悲观情景固定为 $3.25B（合同约定首付款）。基准情景：低值 = 仅首付款；中值 = 首付款 + 按公告定价计算的第一笔分期；高值 = 首付款 + 第一笔分期 + 部分第二笔分期。乐观情景：低值 = 首付款 +
      第一笔分期；中值 / 高值 = 首付款 + 按公告 / 当前定价计算的完整或有对价。所有或有对价估值都会随 MRVL 股价波动。
    claimRefs:
      - CV001
      - CV002
