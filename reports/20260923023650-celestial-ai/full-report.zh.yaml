      - number: '4.3'
        title: 收入模式与 Marvell 预测
        blocks:
          - type: paragraph
            body: |
              Celestial AI 收购时确认收入极少，符合其早期半导体设计公司定位：公司正在完成开发阶段流片并
              转向商业化。Marvell 官方交割新闻稿预计，收入贡献将在 2028 财年下半年开始（Marvell 财年于
              1 月下旬结束），并在第四季度明显爬坡至 $500 million 年化收入运行率。随后预计到 2029 财年第四季度
              翻倍至 $1 billion 年化收入运行率。这些预测是 Marvell 管理层的公司声称前瞻指引，附带标准
              前瞻性声明免责声明。

              到 Q4 FY2026 业绩（2026 年 3 月发布）时，Marvell 更新了合并后的近期展望：Celestial AI 和
              XConn Technologies（另一项财年结束后完成的收购）预计合计为 2028 财年收入贡献约 $250 million。
              这个数字意味着较长期 $500 million ARR 路径仍在，但披露为合并贡献，而非按实体拆分。Marvell
              CEO Matt Murphy 提到 scale-up 连接的总可寻址市场约 $10 billion，并将
              Celestial AI 定位为捕获该市场的主要载体。Marvell 报告 2026 财年实际收入 $8.195 billion
              （同比 +42%），2027 财年指引约 $11 billion，2028 财年指引约 $15 billion——这一路径隐含
              Celestial AI 和其他光子项目需要在两个财年内贡献实质增量收入。

              在 Marvell 内部，收入模式遵循与 Marvell Data Center Group 一致的定制芯片与授权结构。包括
              持有认股权证的 Amazon 在内，超大规模云厂商客户预计将成为主要收入来源。具体定价、量承诺或
              合同结构均未公开披露。
