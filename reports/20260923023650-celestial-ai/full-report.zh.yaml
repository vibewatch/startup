companyProfile:
  summary: |
    Celestial AI 是一家位于 Santa Clara 的硅光子初创公司，成立于 2020 年。
    公司开发 Photonic Fabric —— 一种光芯粒，目标是替代 AI 加速器集群中的
    铜基 scale-up 互连（NVLink、UALink）。公司五年内通过五轮融资募资
    $515M，并于 2026 年 2 月被 Marvell Technology 以 $3.25B 前置对价收购。
    收购时公司尚无收入，正与未披露的超大规模云厂商客户进行硬件验证。
    Marvell 预计，到 Q4 FY2028，Celestial AI 可贡献 $500M ARR。
