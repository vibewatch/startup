  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: |
              Celestial AI 的 Photonic Fabric 所在相关市场，是 AI 数据中心 scale-up 光互连市场——
              具体是 AI 加速器系统内部及系统之间，面向芯片到芯片、芯片到内存、封装到封装
              光链路的细分市场。它与更广义的光互连市场有三点关键不同：（1）它瞄准短距、
              系统内部域，而不是长距或城域数据中心互连；（2）它要求光子器件以共封装或中介层
              方式直接与加速器芯片（XPU）集成，不是可插拔光模块；（3）它直接对标 NVIDIA 的
              NVLink，以及由 AMD 和 Broadcom 支持的 UALink 等专有铜基 scale-up 互连架构。

              纳入口径：硅光子中介层、共封装光学（CPO）、光芯粒，以及为 XPU-to-XPU 和
              XPU-to-memory 连接设计的 scale-up 光互连模块。排除口径：传统可插拔光模块
              （800G/1.6T）、scale-out Ethernet/InfiniBand 交换、设施之间的数据中心互连（DCI）、
              机架内短距连接用铜质有源 / 无源电缆，以及相干 DCI 光模块。

              邻近市场包括更广义的硅光子市场（MarketsandMarkets 口径，2024 年 $2.16B，
              2030 年增至 $9.65B）、完整数据中心互连市场（MarketsandMarkets 和 Fortune
              Business Insights 口径，2025 年 $15.38B），以及 LightCounting 跟踪的 AI 集群
              光学细分市场（2024 年 $5B，到 2026 年翻倍至 $10B+）。现状替代方案包括 NVIDIA
              的铜基 NVLink scale-up 架构，以及 AMD/Broadcom 的 UALink 铜方案——这些正是
              Celestial AI/Marvell 希望替代的主导架构。
