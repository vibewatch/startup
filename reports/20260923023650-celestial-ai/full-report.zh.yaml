      - number: '3.2'
        title: 直接光芯粒竞争对手
        blocks:
          - type: paragraph
            body: |
              Ayar Labs 是 Celestial AI 最直接的竞争对手。Ayar Labs 成立于 2015 年，是 UC Berkeley
              孵化公司，已打造 TeraPHY 光 I/O 芯粒，采用微环调制器（MRM）和 UCIe 芯粒互连标准，
              集成进 AI 加速器封装。TeraPHY 单芯粒最高 8 Tbps 带宽；配套 SuperNova 多波长光源支持
              16 个波长，作为外部激光输入。Ayar Labs 目标能效约 5 pJ/bit，并规划降至 1 pJ/bit 以下。
              公司 2024 年 12 月完成 $155M Series D——AMD Ventures、Intel Capital 和 NVIDIA 与
              Advent Global Opportunities 同轮投资——随后在 2026 年初完成由 Neuberger Berman 领投的
              $500M Series E，AMD、NVIDIA、MediaTek 和 Alchip 参投，使累计融资达到 $870M，估值达到
              $3.75–3.8B。

              关键架构差异在于：Celestial AI 采用电吸收调制器（EAM）和 3D EIC-on-PIC 堆叠，而
              Ayar Labs 采用 MRM，并在既有 CMOS 工艺流内共封装。EAM 在温度容忍度、带宽密度和
              消光比上有优势；MRM 插入损耗更低，但需要更严格的温度管理。Celestial AI 的 3D 堆叠
              架构独特地面向大规模解耦内存访问——这是 Ayar Labs 未明确覆盖的用例——可能让
              Celestial AI 拿到差异化小众市场。

              NVIDIA 同时直接投资 Ayar Labs（Series D 和 Series E），又与 Marvell 在 NVLink Fusion
              上合作，这形成了需要持续跟踪的结构性利益冲突。如果 NVIDIA 最终在其平台内偏向
              Ayar Labs 的 TeraPHY 路线，Marvell/Celestial AI 进入 NVIDIA scale-up 生态的通道可能受损。

              Ranovus（Ottawa，2012 年成立）是次一级直接竞争对手。其 Odin 直接驱动 CPO 3.0
              平台支持每光通道 100 Gbps，面向 AI/ML ASIC 集成。2024 年 3 月，Ranovus 宣布与
              MediaTek 联合开发 6.4 Tbps 共封装光学方案。Ranovus 2023 年获得加拿大 Strategic
              Innovation Fund $36M，并于 2025 年 8 月宣布在 Ottawa 进行 $100M+ 制造扩张。尽管
              Ranovus 活跃在 CPO 领域，但缺少 Ayar Labs 那样深厚的超大规模云厂商投资人背书和广泛生态关系。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 平台型与既有厂商竞争对手
        blocks:
          - type: paragraph
            body: |
              Intel Silicon Photonics 在商业硅光子领域机构历史最久，2012 年以来一直运营光模块业务。
              Intel 的 Optical Connectivity for AI（OCI）计划代表其光 I/O 芯粒项目。OFC 2024 上，
              Intel 展示了首个与 Intel CPU 共封装的全集成双向 OCI 光 I/O 芯粒。OCI 芯粒支持 64 个通道、
              每向 32 Gbps（双向 4 Tbps），功耗效率低于 3–5 pJ/bit，并支持标准光纤最长 100 米。
              Intel 优势在垂直整合：内部硅光子 R&D、封装和代工能力。Intel 还通过收编式收购光学团队
              （包括 Glofast）补强该项目。Intel 的竞争风险主要体现在 Intel CPU 平台客户上；Intel 可能
              偏好内部光芯粒，从而压缩 Celestial AI/Marvell 在 Intel 平台 AI 部署中的可服务市场。

              Broadcom 的 CPO 项目聚焦 scale-out Ethernet 交换，而不是 Celestial AI 所竞争的 scale-up
              XPU-to-XPU 互连域。2024 年 3 月，Broadcom 发布 Bailly，这是业界首款 51.2 Tbps CPO Ethernet
              交换机，把八个 6.4 Tbps 硅光子光引擎与 Tomahawk5 芯片集成——较可插拔光模块降低 70% 功耗——
              并在 Meta 做现场验证。路线图延伸到 102.4 Tbps 的 Davisson。Broadcom 还向 NVIDIA 供应
              NVLink Switch 芯片，并是 UALink 联盟创始成员。Hot Chips 2024 上，Broadcom 展示了
              带光学连接的 AI 计算 ASIC 早期工作，显示其可能扩展到 scale-up 相邻领域。若 Broadcom 把
              CPO 转向 XPU scale-up 空间，凭借其超大规模云厂商关系和制造规模，将构成资源最强的竞争威胁。

              NVIDIA 通过 NVLink 控制 scale-up 生态。NVLink v5（Blackwell）每 GPU 达到 1.8 TB/s；
              NVSwitch 可支持最高 576 GPU pods。Computex 2025 上，NVIDIA 发布 NVLink Fusion——这是一种
              芯粒接口，可让包括 Marvell 在内的定制 XPU 芯片原生连接 NVIDIA NVLink 生态。Marvell 与
              NVIDIA 合作 NVLink Fusion，支持最高 1.8 TB/s 芯粒双向带宽。NVLink Fusion 打开了合作渠道，
              但也确保 NVIDIA 掌握其生态内光学采用节奏。
