        - 直接：同一收购方；云数据中心光子市场
      - - NVIDIA / Mellanox（InfiniBand 网络）
        - '2020'
        - $6.9B
        - ~5.3x TTM
        - 宽泛：AI 集群连接先例
      - - Cisco / Acacia Communications（光模块）
        - '2021'
        - $4.5B
        - ~12x TTM
        - 直接：面向超大规模数据中心的光互连硅
      - - AMD / Pensando Systems（数据中心 DPU）
        - '2022'
        - $1.9B
        - 未产生收入 / IP 溢价
        - 结构高度相似：收入前 AI 芯片创业公司退出
      - - Marvell / Innovium（以太网交换）
        - '2021'
        - $1.1B
        - 约 5x TTM
        - 背景参照：Marvell 为数据中心硅资产支付溢价
      - - Celestial AI — 前期对价（本交易）
        - '2026'
        - $3.25B
        - 6.5x 2 年远期 ARR
        - 参考项；收入前光子资产收购
    notes: >-
      Inphi、Mellanox、Acacia 和 Innovium 的收入倍数基于公告时的过去 12 个月收入。Pensando 处于商业化前阶段，按收入口径不适用倍数。Celestial AI 倍数使用 Marvell
      管理层的前瞻指引。
    claimRefs:
      - CV003
      - CV004
    enumerationScope:
      coverage: sample
