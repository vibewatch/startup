      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: |
              David（Dave）Lazovsky 现任联合创始人兼 CEO。创办 Celestial AI 之前，
              Lazovsky 于 2004 年创立 Intermolecular, Inc.，并从公司创立一路带到
              2011 年 IPO；他担任总裁、CEO 和董事至 2014 年 10 月。此后，他担任
              POET Technologies 执行董事长、ESS, Inc. 董事，在复杂半导体技术规模化
              商业化上积累了很深经验。

              Preet Virk 是联合创始人兼 COO。Phil Winterbottom 任 CTO；职业起点在
              Bell Labs 的 Computer Research 小组，随后联合创办 Entrisphere（被 Ericsson
              收购）和 Gainspeed（被 Nokia 收购）。CTO 的架构工作支撑了 Photonic Fabric
              核心设计，包括电吸收调制器（EAM）路线和纯模拟 SerDes。

              Kelyn Brannon 于 2024 年 6 月出任 CFO，为公司进入商业化阶段补上财务领导力。
              高管团队还包括 Narayan Kaniyur（SVP Engineering）、Steven Metz（VP Sales）、
              Ankur Aggarwal（VP Advanced Packaging & Supply Chain）、Subal Sahni
              （VP Photonics Engineering）和 Victoria Sevilla（VP People）。

              董事会由 Lip-Bu Tan 主持（Walden International 创始管理合伙人；Cadence
              Design Systems 前 CEO；2025 年 1 月加入），他还以个人身份投资 Series C1。
              其他董事包括 Diane Bryant（独立董事；2024 年 4 月任命）、Bethany Mayer
              （网络安全背景）、Peter Tague（投资人代表）、Alonso Galvan（IAG Capital
              Partners 联合创始人）和 Isaac Sigron（Koch Disruptive Technologies 管理合伙人）。
              CEO 也在董事会，形成关键人高度集中的单点。
            claimRefs:
