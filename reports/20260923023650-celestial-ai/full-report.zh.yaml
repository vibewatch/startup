      - number: '2.2'
        title: 市场规模测算 — 多重视角
        blocks:
          - type: paragraph
            body: |
              没有任何一份分析师报告能干净地单独切出 Celestial AI 的 SAM（面向 AI XPU 的
              scale-up 光芯粒）。最有用的测算视角如下：

              **视角 1 — 最宽 TAM（全部光互连）：** Fortune Business Insights 将全球光互连市场
              估为 2025 年 $15.38B，到 2034 年以 12.2% CAGR 增至 $43.14B。这个口径包含所有
              距离等级、技术和应用，显著高估 Celestial AI 的可服务市场。

              **视角 2 — 数据中心互连（DCI）市场：** MarketsandMarkets 估算 DCI
              市场 2025 年为 $15.38B，到 2030 年以 11% CAGR 增至 $25.89B。这个口径同时包含
              光学和分组交换 DCI 方案；它更能捕捉数据中心光学支出，但仍纳入过多非 AI 应用和
              跨设施链路。

              **视角 3 — 硅光子（最聚焦的技术视角）：** MarketsandMarkets 估算
              硅光子市场 2024 年为 $2.16B，到 2030 年以 29.5% CAGR 增至 $9.65B。数据中心和
              HPC 是 CAGR 最高的终端用户细分。这个视角最贴近 Celestial AI 所处的技术层。

              **视角 4 — AI 集群光学（最具商业相关性的视角）：** LightCounting 2025 年
              1 月的 Optics for AI Clusters 报告估算，AI 集群光学市场 2024 年为 $5B，到 2026 年
              增至 $10B+，近期 CAGR 约 40%+。该口径既包括计算节点光模块，也包括 scale-up 网络
              光学器件；随着 LPO 和 CPO 放量，到 2028–2030 年增速回落到两位数。

              **视角 5 — 共封装光学（最直接的产品类比）：** 分析师对 CPO 市场的预测差异
              很大（2025 年 CPO 专项为 $95M–$2B），到 2030 年以 30–40% CAGR 增至
              $575M–$4.67B。按 AI2Work/Mordor Intelligence 口径，2026 年 CPO 在 AI 数据中心的
              渗透率仅约 0.5%，预计到 2030 年达到 35%。

              对 Celestial AI 的 scale-up 光芯粒产品，最可信的 SAM 估计是到 2028–2029 年约
              $2–5B；这与 Marvell 的 $500M ARR（Q4 FY2028）收入目标一致，前提是 Celestial AI
              能拿下这个新兴细分 10–25% 份额。该估计受证据约束，且鉴于技术仍处收入前阶段，
              不确定性很高。
