      - number: '8.2'
        title: 可比 M&A 交易
        blocks:
          - type: paragraph
            body: |
              给一家无收入半导体光子公司估值，需要参照硅光子、光互连和 AI 相邻芯片设计领域的可比
              M&A 交易。最直接相关的先例，既与收购方口径一致，也与技术方向对位。

              Marvell 自身收购 Inphi Corporation（2020 年 10 月宣布，2021 年 4 月完成），作价约
              $10B，是最有力的同一收购方基准。Inphi 是一家成长中的、有收入的硅光子和电 DSP
              公司，公告时过去十二个月收入约 $683M，隐含约 14.6× TTM 收入倍数。Inphi 服务
              云数据中心和 5G 电信，与 Celestial AI 的 Photonic Fabric 光学 scale-up 平台高度相邻。
              Inphi 交易确立了 Marvell 愿意为光连接领导地位支付溢价倍数；若收入爬坡按计划兑现，
              Celestial AI 前期价格 6.5× 前瞻 ARR 相比之下显得保守。

              NVIDIA 以 $6.9B 收购 Mellanox Technologies（2020 年 4 月完成），是关键的
              AI 网络先例。Mellanox 当时年收入约 $1.3B，隐含约 5× TTM 收入倍数。Mellanox
              交易验证了连接硅——该案例中是 InfiniBand 交换——对 AI 集群性能至关重要这一战略命题。
              Celestial AI 把这一命题延伸到光学层，且前瞻逻辑更强。

              Cisco 以 $4.5B 收购 Acacia Communications（2021 年 3 月完成）也直接相关：
              Acacia 生产高速光互连硅，是数据中心和 AI 基础设施的关键组成。该交易最初在 2019 年以
              $2.6B 宣布，但在反垄断延误后重新定价到 $4.5B，反映当期光子资产价值上升。

              AMD 以 $1.9B 收购 Pensando Systems（2022 年 4 月），提供了更接近的结构类比：
              Pensando 是一家数据中心网络创业公司，聚焦可编程 DPU 硅，退出时收入有限；AMD 主要为
              工程人才、IP 组合和未来设计定点管线付费。这笔交易最接近 Celestial AI 的交易结构——
              收购方买的是一家无收入或早期收入 AI 芯片创业公司的 IP 和路线图，而非当期现金流。

              在这组可比交易中，有收入标的的 EV/TTM 收入倍数约为 5× 至 14.6×。对无收入人才收购
              或 IP 溢价型交易，倍数框架不能直接套用；但 $1.1B 至 $10B 的交易规模提供了可信区间，
              Celestial AI 的 $3.25B 前期价格自然落在区间内，尤其考虑到 Photonic Fabric 对
              Marvell $10B scale-up TAM 叙事的战略重要性。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 可比上市公司与私募融资基准
        blocks:
          - type: paragraph
            body: |
              上市 AI 硅公司和近期私募融资轮提供了额外估值锚。最相关的上市可比公司，是那些在 AI
              芯片设计、定制硅和光互连上有实质暴露的公司。

              在 AI 半导体创业公司中，Cerebras Systems 于 2026 年 4 月提交 Nasdaq IPO 申请，目标
              估值区间为 $23–35B，对应披露的 2025 年收入 $510M——约为 2025 年收入的
              45–69×。Cerebras 通过与 OpenAI 的多年大型算力合同和 AWS 合作取得这部分收入，可比性
              较弱，但为当前周期 AI 芯片估值提供了有参考意义的上限。SambaNova Systems 仍保持私有，
              报道估值超过 $5B，未披露收入。AI 推理芯片公司 Groq 在 2023 年 Series D 轮估值
              约 $2.8B。

              硅光子领域里，Ayar Labs 是一家共封装光互连公司，技术与 Celestial AI 的 Photonic Fabric
              有重叠；截至 2024 年初，该公司通过 Series C 累计融资约 $870M，但未公开披露投后
              估值。商业化阶段缺少可比上市硅光子公司，因此只能更多依赖 M&A 可比交易和市场规模代理，
              而不是上市公司 EV / 收入基准。

              在上市半导体公司中，Marvell 自身给出了最有用的收购方参照点。Marvell 的 AI 驱动收入在
              FY2025 增长 78%，估计达到 $1.7–$2.0B；公司报告 FY2026 总收入约 $8.2B
              （同比 +42%）。公告时，Marvell 自身企业价值约 $55–65B，对 FY2026 预估收入隐含
              7–8× 前瞻收入倍数。因此，Marvell 为 Celestial AI 支付 6.5× 两年前瞻 ARR，
              与 Marvell 自身市场倍数一致，说明董事会采用的是有纪律的定价逻辑，而不是战略性高价收购。

              MarketsAndMarkets 硅光子市场报告（2025 版）预计，全球硅光子市场 2025 年约
              $2.1–3.1B，到 2030 年增至 $9.6–11.8B，CAGR 约 27–30%。按 Marvell 所称
              $500M ARR 目标，Celestial AI 将占 2028 年估算 $4–5B 市场约 15–24%。
              对一家拿到超大规模云厂商设计定点、且在 5 nm 制程节点共封装光学领域没有直接等价对手
              的先发公司而言，这个份额雄心很大但可以实现。GrandView Research 光互连市场报告预计，
              整体光互连市场到 2030 年达到 $34.5B，为硅光子细分市场提供更大的 TAM 背景。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
