      - number: '3.2'
        title: Direct Optical Chiplet Competitors
        blocks:
          - type: paragraph
            body: |
              Ayar Labs is Celestial AI's most direct competitor. Founded in 2015 as a UC Berkeley
              spin-out, Ayar Labs has built the TeraPHY optical I/O chiplet, which uses micro-ring
              modulators (MRMs) and the UCIe chiplet interconnect standard for integration into AI
              accelerator packages. TeraPHY achieves up to 8 Tbps bandwidth per chiplet; the
              companion SuperNova multi-wavelength light source supports 16 wavelengths as an
              external laser input. Ayar Labs targets approximately 5 pJ/bit energy efficiency with
              a roadmap to under 1 pJ/bit. The company raised $155M in a Series D in December 2024
              — with AMD Ventures, Intel Capital, and NVIDIA as investors alongside Advent Global
              Opportunities — and followed with a $500M Series E in early 2026 led by Neuberger
              Berman with AMD, NVIDIA, MediaTek, and Alchip participating, bringing total raised
              to $870M and valuation to $3.75–3.8B.

              The key architectural contrast: Celestial AI uses electro-absorption modulators (EAMs)
              and 3D EIC-on-PIC stacking, while Ayar Labs uses MRMs and co-packaging within
              existing CMOS process flows. EAMs offer advantages in thermal tolerance, bandwidth
              density, and extinction ratio; MRMs offer lower insertion loss but require tighter
              temperature management. Celestial AI's 3D stacking architecture uniquely targets
              disaggregated memory access at scale — a use case Ayar Labs does not explicitly
              address — potentially giving Celestial AI a differentiated niche.

              NVIDIA's simultaneous direct investment in Ayar Labs (both Series D and Series E)
              while partnering with Marvell on NVLink Fusion represents a structural conflict of
              interest that requires monitoring. If NVIDIA ultimately favors Ayar Labs'
              TeraPHY-based approach within its platforms, Marvell/Celestial AI's access to
              NVIDIA's scale-up ecosystem could be compromised.

              Ranovus (Ottawa, founded 2012) is a secondary direct competitor. Its Odin
              direct-drive CPO 3.0 platform supports 100 Gbps per optical channel and targets
              AI/ML ASIC integration. In March 2024 Ranovus announced a 6.4 Tbps co-packaged
              optics solution jointly developed with MediaTek. Ranovus received $36M from Canada's
              Strategic Innovation Fund in 2023 and announced a $100M+ manufacturing expansion in
              Ottawa in August 2025. While Ranovus is active in the CPO space, it lacks the deep
              hyperscaler investor backing and broad ecosystem relationships of Ayar Labs.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Platform and Incumbent Competitors
        blocks:
          - type: paragraph
            body: |
              Intel Silicon Photonics has the longest institutional history in commercial silicon
              photonics, having operated a transceiver business since 2012. Intel's Optical
              Connectivity for AI (OCI) initiative represents its optical I/O chiplet program. At
              OFC 2024, Intel demonstrated the first fully integrated bidirectional OCI optical
              I/O chiplet co-packaged with an Intel CPU. The OCI chiplet supports 64 channels at
              32 Gbps each way (4 Tbps bidirectional), achieves less than 3–5 pJ/bit power
              efficiency, and supports reach up to 100 meters over standard fiber. Intel's
              advantage lies in vertical integration: internal silicon photonics R&D, packaging,
              and foundry capabilities. Intel has acqui-hired optical teams including from Glofast
              to bolster the program. The competitive risk from Intel is primarily on Intel CPU
              platform customers, where Intel may prefer an internal optical chiplet, narrowing
              Celestial AI/Marvell's addressable market among Intel-platform AI deployments.

              Broadcom's CPO program focuses on scale-out Ethernet switching rather than the
              scale-up XPU-to-XPU interconnect domain where Celestial AI competes. In March 2024
              Broadcom launched Bailly, the industry's first 51.2 Tbps CPO Ethernet switch,
              integrating eight 6.4 Tbps silicon photonics optical engines with its Tomahawk5
              chip — achieving a 70% power reduction versus pluggable transceivers — with field
              validation at Meta. The roadmap extends to Davisson at 102.4 Tbps. Broadcom also
              supplies NVLink Switch chips to NVIDIA and is a foundational member of the UALink
              consortium. At Hot Chips 2024, Broadcom presented early work on AI compute ASICs
              with optical attach, signaling potential expansion into scale-up adjacency. If
              Broadcom pivots CPO into the XPU scale-up space, it would represent the highest-
              resource competitive threat given Broadcom's hyperscaler relationships and
              manufacturing scale.

              NVIDIA controls the scale-up ecosystem through NVLink. NVLink v5 (Blackwell)
              achieves 1.8 TB/s per GPU; NVSwitch enables up to 576 GPU pods. At Computex 2025,
              NVIDIA unveiled NVLink Fusion — a chiplet interface enabling custom XPU silicon,
              including from Marvell, to natively connect to NVIDIA's NVLink ecosystem. Marvell
              partnered with NVIDIA on NVLink Fusion supporting up to 1.8 TB/s chiplet
              bidirectional bandwidth. NVLink Fusion creates a cooperative channel but also
              ensures NVIDIA controls optical adoption timing within its ecosystem.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: |
              Celestial AI raised approximately $515 million across five external financing rounds between
              January 2021 and March 2025. The seed round of $2.87 million in January 2021 provided initial
              capital to advance the Photonic Fabric concept. A $56 million Series A led by Lux Capital
              followed in February 2022, enabling early silicon design work and initial tape-outs. Tiger Global
              Management led a $100 million Series B in June 2023 as the company advanced its first commercial
              prototypes and expanded its engineering team.

              The March 2024 Series C of $175 million, led by U.S. Innovative Technology Fund (USIT), was a
              pivotal strategic milestone: it introduced AMD Ventures, TSMC Ventures (VentureTech Alliance),
              Samsung Catalyst, and multiple hyperscaler-adjacent investors, validating the photonics-for-AI
              thesis at the supply-chain level. The round valued Celestial AI at $1.22 billion post-money,
              making it a unicorn. Thirteen months later, in March 2025, Celestial AI closed a $250 million
              Series C1 led by Fidelity Management and Research, with new participation from BlackRock,
              Maverick Silicon, and personal investment from Lip-Bu Tan (who simultaneously joined the board).
              This round valued the company at $2.5 billion post-money.

              Between the Series C and Series C1, Celestial AI acquired the Rockley Photonics IP portfolio in
              October 2024 for approximately $20 million — a balance-sheet use deploying cash at distressed
              prices to add over 200 patents covering electro-absorption modulators, optoelectronic
              systems-in-package, and optical switch technologies. Rockley had filed for Chapter 11 in early
              2023, making this a strategic opportunistic purchase that reinforced Celestial AI's IP moat
              ahead of its largest financing round and eventual exit.
