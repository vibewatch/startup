    title: Risk Heatmap
    type: matrix
    layout: wide
    summary: |
      Two-dimensional risk heatmap mapping likelihood (rows) against impact (columns) for the
      principal Celestial AI / Marvell risk factors identified in Chapter 7. Cell text identifies
      the primary risk; tone encodes residual severity after available mitigations are applied.
      Critical cells (negative tone, high likelihood × high/critical impact) are the most
      immediate monitoring priorities.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - null
            - CPO firmware/software integration complexity
            - CoWoS capacity allocation (NVIDIA priority)
            - null
        - label: Medium Likelihood
          values:
            - null
            - Earn-out milestone dispute; AI capex pullback
            - Ayar Labs competitive displacement; co-founder departure; EAM yield at volume
            - Taiwan geopolitical contingency (TSMC disruption)
        - label: Low Likelihood
          values:
            - null
            - Broadcom CPO competition; Intel OCI overlap
            - Goodwill impairment; BIS export control violation
            - CFIUS block on Marvell transaction; IP title defect (Rockley)
        - label: Very Low Likelihood
          values:
            - null
            - California wage claim (earn-out dispute)
            - Technology obsolescence (LNOI/InP)
            - null
        - label: Additional point 5
          values:
            - null
            - Earn-out dispute / integration risk
            - High-risk monitoring item
            - null
        - label: Additional point 6
          values:
            - null
            - Compliance / regulatory risk
            - Monitoring item
            - null
    approximationNotes: >-
      Likelihood and impact are qualitative ordinal assessments derived from public evidence. No actuarial or
      quantitative probability model underlies the placements.
