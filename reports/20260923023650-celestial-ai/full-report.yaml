      - CR001
      - CR002
  - id: FV001
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: |
      Low, mid, and high effective acquisition value for Marvell's Celestial AI purchase
      across three earn-out scenarios. The upfront-only bear case is fixed at $3.25B.
      The base case includes one earn-out tranche. The bull case reflects full earn-out
      achievement at $5.5B. All values are in USD millions at announcement pricing.
    data:
      items:
        - label: Bear (no earn-out, upfront only)
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
        - label: Base (partial earn-out, one tranche)
          low: 3250
          mid: 3850
          high: 4250
          unit: USD M
        - label: Bull (full earn-out achieved)
          low: 4500
          mid: 5000
          high: 5500
          unit: USD M
        - label: Additional point 4
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
        - label: Additional point 5
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
        - label: Additional point 6
          low: 3250
          mid: 3250
          high: 3250
          unit: USD M
    approximationNotes: |
      Bear scenario is fixed at $3.25B (the contractual upfront price). Base scenario
      low = upfront only; mid = upfront + first tranche at announcement pricing; high =
      upfront + first tranche + partial second tranche. Bull scenario low = upfront +
      first tranche; mid/high = upfront + full earn-out at announcement/current pricing.
      All earn-out valuations fluctuate with MRVL share price.
