      - number: '3.3'
        title: Pricing, Distribution, and Switching Costs
        blocks:
          - type: paragraph
            body: |-
              None of these vendors, including Vi, publishes transparent list pricing; healthcare data and analytics
              platforms are sold as multi-year enterprise contracts negotiated per deployment, with value tied to
              data access, seats, and outcomes. Distribution power is a key differentiator. Veeva and IQVIA enjoy
              deep, sticky relationships across nearly the entire pharmaceutical industry, and their data and CRM
              systems carry high switching costs once embedded in regulated commercial and clinical workflows.
              Provider-focused platforms like Innovaccer, Arcadia, and Health Catalyst lock in health systems through
              data integration, custom analytics, and care-management workflows that are expensive to rip out.
              Komodo's moat is its proprietary patient-level Healthcare Map. Vi's switching costs are plausibly real
              once its Data Web is integrated and its agents are embedded in operational workflows, but with limited
              public evidence of contract length, retention, or multi-homing behavior, its lock-in is harder to
              verify than incumbents'. Buyers frequently multi-home — using one vendor for provider analytics and
              another for pharma commercialization — which both opens a wedge for Vi's cross-vertical breadth and
              limits any single vendor's ability to fully displace the others.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP032
          - type: table
            tableRef: TP003
            claimRefs:
