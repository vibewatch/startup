        title: Exhibits
        blocks:
          - type: callout
            title: Cross-Vertical Breadth Is Genuinely Differentiated
            body: |-
              Vi's combination of provider, pharma, and wellness use cases on one data-and-agent platform is rare;
              most rivals are deep in a single vertical. If Vi can prove depth in each, its breadth becomes a durable
              wedge against single-vertical specialists and generic horizontal AI tools.
            calloutType: strength
