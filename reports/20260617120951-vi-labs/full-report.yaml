            title: Sizing Dispersion and Adoption Friction
            body: |-
              Published forecasts diverge by more than 4x by the early-2030s, and Vi's realistic SAM/SOM is a small
              fraction of headline TAM after excluding diagnostics, imaging, and EHRs. Long sales cycles, HIPAA
              compliance, AI-regulatory uncertainty, and hype skepticism all slow conversion of the addressable market
              into recognized revenue.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM021
              - CM022
              - CM024
          - type: callout
            title: Boundary Discipline Changes the Investment Case
            body: |-
              Whether Vi is a multi-hundred-billion-dollar opportunity or a low-single-digit-billion one depends
              entirely on how the market is bounded. Treating the enterprise data-platform layer — not the entire
              AI-in-healthcare total — as the serviceable market is the more defensible lens for underwriting Vi's
              $1.64 billion valuation.
            calloutType: insight
            claimRefs:
              - CM031
