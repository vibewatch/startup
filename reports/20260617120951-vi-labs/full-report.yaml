  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Substitutes
        blocks:
          - type: paragraph
            body: |-
              The competitive set around Vi spans four layers. Direct peers are venture-backed healthcare data and
              population-health platforms — Komodo Health, Innovaccer, Arcadia, and Lightbeam — that, like Vi,
              aggregate clinical and claims data and sell analytics and engagement to providers, payers, and pharma.
              Incumbents are large public companies: Veeva Systems, the dominant life-sciences cloud and CRM vendor;
              IQVIA, the largest healthcare data and contract-research organization; and Health Catalyst, a
              provider-focused data-and-analytics company. Adjacent competitors include electronic health record
              vendors (Epic, Oracle Health) that increasingly add analytics, and the major cloud and horizontal AI
              providers whose general-purpose models Vi explicitly positions against. The most persistent substitute
              is the status quo: enterprises building data-science teams in-house or stitching together point
              solutions and systems integrators. Vi's strategic bet is that a vertically specialized, productized
              execution layer spanning provider, pharma, and wellness use cases will out-compete both single-vertical
              specialists and generic horizontal tools. That bet is credible but unproven, because most named rivals
              disclose revenue, customer counts, or public-market scale that Vi does not, making head-to-head
              comparison difficult and tilting near-term advantage toward incumbents with established distribution.
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP011
              - CP012
              - CP030
          - type: table
            tableRef: TP001
