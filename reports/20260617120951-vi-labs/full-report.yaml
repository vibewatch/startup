      - number: '5.3'
        title: Deployment, Roadmap, and Differentiation
        blocks:
          - type: paragraph
            body: |-
              Deploying Vi into an enterprise involves connecting the customer's data and systems to the platform,
              configuring modules to the customer's workflows, and validating model outputs against the customer's
              population — a process that, like most enterprise health-IT, is integration-heavy and bounded by
              security and compliance review. Vi's reliability, support model, and formal SLAs are not publicly
              documented, a gap for diligence. On roadmap, the clearest signal is the May 2026 launch of the AI-agent
              suite, which extends the platform from analytics-and-engagement toward autonomous execution and is the
              company's primary stated direction; further roadmap detail is not public. Vi's differentiation rests on
              four pillars. First, data: the scale and household coverage of Data Web is a genuine asset if it is
              differentiated against IQVIA's and Komodo's data. Second, vertical specialization: Vi's agents and
              models are purpose-built for healthcare workflows rather than general-purpose. Third, breadth across
              provider, pharma, and wellness on one platform. Fourth, an early-mover position in agentic healthcare
              AI. The durability of these is uncertain: the data moat is unverified against incumbents, and the agent
              layer is the capability every competitor is racing to add, creating commoditization risk. The most
              important product-diligence questions are how defensible the data asset is and how rigorously the models
              and agents are validated for clinical safety.
