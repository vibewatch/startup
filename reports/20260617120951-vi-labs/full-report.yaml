  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization
        blocks:
          - type: paragraph
            body: |-
              Vi's revenue model is enterprise software monetization layered on a proprietary data asset. The primary
              stream is multi-year platform subscriptions to its modules — Data Web, Activate, Engage, Operate, and
              Pulse — sold to health systems, pharmaceutical companies, and wellness enterprises. A second stream is
              data licensing and access to its de-identified Data Web, a high-margin asset class comparable to how
              IQVIA and Komodo Health monetize real-world data. A third, newer stream is the AI-agent suite launched
              in May 2026, which Vi positions as an execution layer that can be sold as expansion on top of existing
              deployments. Professional services and implementation likely contribute lower-margin revenue, as is
              typical for enterprise health-IT vendors. Vi markets outcome-oriented value — more than $2 billion in
              measurable value delivered and roughly 4x return on investment for customers — which implies some
              willingness to anchor pricing to outcomes, though there is no public evidence of formal outcomes-based
              contracts. Critically, Vi discloses none of the revenue mix, recognition policies, or contract terms
              that would let an investor verify revenue quality. The composition described here is inferred from the
              company's product structure and sector norms, not from disclosed financial statements, and should be
              confirmed directly with management before underwriting.
