              - CP021
      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: |-
              Vi's potential moats are its large proprietary Data Web, cross-vertical breadth, and an early agent
              layer, reinforced by blue-chip investors. Their durability is uncertain. The data moat is meaningful
              only if Vi's dataset is genuinely differentiated against IQVIA's and Komodo's at-scale real-world data
              assets, which is unproven from public evidence. The breadth advantage could become a focus disadvantage
              if specialists out-execute Vi in each vertical. Most importantly, the AI-agent layer that Vi is
              marketing as a differentiator is precisely the capability every competitor and the horizontal AI
              providers are racing to add, creating real commoditization risk. Incumbents also have structural
              advantages Vi lacks: public-company balance sheets, decades of regulatory and compliance track record,
              and entrenched distribution. The principal adverse scenarios are that incumbents bundle comparable AI
              agents into existing contracts at low marginal price, that Vi's undisclosed scale proves smaller than
              its narrative implies, and that long sales cycles let better-resourced rivals win the enterprise
              standard. These risks make competitive positioning the most consequential swing factor in underwriting
              Vi's $1.64 billion valuation.
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP033
              - CP034
