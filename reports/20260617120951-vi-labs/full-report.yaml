  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: |-
              In customer-workflow terms, Vi is the intelligence-and-execution layer that sits between an
              enterprise's systems of record and the decisions its teams need to make about patients, members, and
              markets. A health system uses Vi to identify and activate at-risk patients; a pharmaceutical company
              uses it to find and engage the right providers and patients for a therapy; a wellness enterprise uses
              it to personalize member engagement. These workflows are delivered through five named modules. Data Web
              is the data foundation — a de-identified dataset spanning more than 190 million patient records with
              roughly 96% US-household coverage. Activate drives population identification and patient activation.
              Engage powers digital and multi-channel engagement. Operate handles operational and care-coordination
              workflows. Pulse provides real-time analytics and insights. Layered on top is a suite of AI agents,
              launched in May 2026, that Vi describes as an execution layer automating next-best actions across these
              modules. The modules are sold as a connected platform rather than standalone tools, which is central to
              Vi's positioning: the value comes from combining a large proprietary dataset with applications that act
              on it. Because most product detail comes from Vi's own pages, technical depth and exact module
              boundaries should be confirmed in a product demonstration during diligence.
            claimRefs:
              - CE001
              - CE002
