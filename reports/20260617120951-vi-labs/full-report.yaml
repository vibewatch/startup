      - number: '3.2'
        title: Capability and Feature Comparison
        blocks:
          - type: paragraph
            body: |-
              On capability breadth, Vi's pitch is unusually horizontal: a single platform combining a large data
              layer (Data Web), patient activation and engagement, operational workflows, real-time analytics, and a
              new suite of AI agents spanning provider, pharma, and wellness use cases. Most competitors are deeper
              but narrower. Veeva is strongest in life-sciences commercial and clinical software and CRM but is not a
              provider-side population-health platform. IQVIA's advantage is the scale and depth of its real-world
              data and analytics for pharma, plus contract-research capabilities Vi does not offer. Komodo Health
              centers on its "Healthcare Map" of patient-level data for life sciences. Innovaccer, Arcadia, Health
              Catalyst, and Lightbeam are provider- and payer-focused population-health and data-platform companies
              with strong analytics but less emphasis on pharma commercialization. Where Vi can credibly claim an
              edge is the combination of breadth across all three verticals and an agent layer that drives next-best
              actions; where it is most exposed is depth and proof, since incumbents have larger datasets, deeper
              regulatory and compliance track records, and disclosed enterprise customer bases. The capability matrix
              should therefore be read as breadth-versus-depth rather than a simple feature checklist.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
              - CP017
              - CP031
