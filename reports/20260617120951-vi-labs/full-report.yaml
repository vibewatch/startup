      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: |-
              Vi's architecture can be read as a stack. At the base is the Data Web data layer: ingestion,
              de-identification, linkage, and storage of clinical, claims, and consumer signals across hundreds of
              millions of records. Above it sits a machine-learning and analytics layer that builds predictive and
              segmentation models on that data — the company's heritage is described as applying signal-processing and
              "neural" techniques, reflecting roots its leadership frames as coming from aerospace and radar. On top
              of the model layer is the newer agentic execution layer: AI agents that translate model outputs into
              recommended or automated actions. The five modules are the application surface that exposes these
              capabilities to specific user personas, and an integration layer connects the platform to enterprise
              systems of record. Interoperability with electronic health records and adherence to healthcare data
              standards such as HL7 FHIR are effectively prerequisites for deployment in provider environments, and
              US interoperability policy under ONC/HealthIT.gov is steadily raising the baseline for data exchange.
              Operationally, Vi runs as a multi-tenant cloud platform serving 100-plus enterprise customers, which
              implies meaningful investment in data engineering, model operations, and cloud infrastructure. The
              public record does not disclose Vi's specific cloud provider, model stack, or uptime metrics, so the
              architecture described here is reconstructed from the company's product pages and sector norms rather
              than from technical documentation.
