      - number: '5.4'
        title: Trust, Security, Privacy, and Compliance
        blocks:
          - type: paragraph
            body: |-
              Because Vi processes protected health information at scale, trust, security, privacy, and compliance are
              core to the product, not peripheral. Vi's central privacy mechanism is de-identification: it describes
              its Data Web as composed of de-identified patient records, which under US law (HIPAA) can be used and
              shared more freely than identifiable PHI provided de-identification is done to standard. Vi publishes a
              privacy policy governing its data practices. Operating in healthcare also subjects Vi to HIPAA's
              security and privacy rules, evolving FDA thinking on AI/ML in healthcare, and FTC scrutiny of health
              data — areas covered in this report's risk chapter. For the product, the key trust questions are the
              robustness of de-identification (re-identification risk rises as datasets grow and link more signals),
              the governance and validation of AI models and agents to prevent unsafe or biased recommendations, and
              the security controls protecting a high-value health dataset from breach. Vi's public materials assert
              compliance and de-identification but do not publish independent audits (for example SOC 2 or HITRUST),
              model-validation methodologies, or breach history, so these must be verified directly. The combination
              of a large PHI-derived dataset and an action-taking agent layer raises the stakes: errors or breaches
              would carry regulatory, reputational, and clinical consequences, making demonstrable trust controls a
              gating condition for enterprise adoption and for investment.
            claimRefs:
              - CE013
