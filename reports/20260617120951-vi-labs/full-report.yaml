      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: |-
              Vi's founder and chief executive officer is Omri Yoffe, who is credited in executive interviews and
              company databases with building Vi around the integration of artificial intelligence and data science
              into healthcare and life-sciences outcomes. The company's origin story is unusual: Vi describes itself
              as "born from aerospace," inspired by a silent systems failure that killed a co-founder's Air Force
              pilot friend, and frames its technology as a "neural radar for health" that surfaces critical signals
              buried in noise. Beyond the chief executive, public-facing pages identify a functional leadership bench
              including Product Lead Yiftach Meitar, Senior Director of Client Performance Chelsea Pincus, VP of
              Growth for Healthcare Davis Miller, and Client Strategy and Activation Lead Laurén DiVenere, while a
              partner interview references a chief revenue officer named Spencer. Board composition, equity holdings,
              and formal governance arrangements are not disclosed, so key-person dependence on Yoffe and the
              completeness of the executive roster cannot be fully verified from public sources. This leadership
              opacity is a recurring theme across the company-overview evidence base and is preserved as a gap.
