            title: Large, Fast-Growing, Software-Heavy Market
            body: |-
              Every major analyst sizes AI in healthcare at roughly $37-40 billion in 2025 with 35-44% CAGRs and a
              software-dominated mix, giving Vi a large and expanding TAM with structural tailwinds from value-based
              care and interoperability.
            calloutType: strength
