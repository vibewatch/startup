- id: scale-and-traction
  title: Scale and Traction Metrics
  body: 'Vi''s public scale claims are large and consistent across its press release and founder blog.
    The

    company states it serves more than 100 large-scale enterprise customers, including Fortune 500

    companies and many leading healthcare, life-sciences, and wellness organizations. It says it supports

    more than 190 million patients and members, has contributed to the development and commercialization
    of

    more than 50 drugs across oncology, pediatric epilepsy, and diabetes, and has generated more than
    $2

    billion in measurable value across its partner ecosystem. The differentiating asset underpinning these

    claims is the Data Web, which Vi describes as one of the world''s largest datasets of clinical,

    behavioral, and operational signals integrating physiographic, demographic, usage, and licensed partner

    data into a single AI-ready layer; database descriptions also reference household-level data coverage.

    These figures are company-reported and not independently audited, and core financial metrics such
    as

    revenue, annual recurring revenue, gross margin, and net revenue retention remain undisclosed, so
    the

    quality and durability of the traction cannot yet be corroborated by third parties.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO030
  - CO032
  - CO040
  - CO036
- id: milestones-and-history
  title: Milestones, History, and Open Questions
  body: 'Vi''s documented history is uneven because the company has historically maintained a low public
    profile.

    Company branding references roots reaching back to roughly 2011, Crunchbase has associated the company

    with a mid-2010s founding, and PitchBook''s first recorded institutional round is a 2018 later-stage

    venture financing — a genuine conflict in the founding chronology that diligence should resolve. The

    clearest dated milestones are financial and product events from 2024 onward: a $131 million round
    in

    June 2024, the May 2026 launch of the AI agent suite, and the simultaneous $145 million transaction
    at

    a $1.64 billion valuation. Vi has also published "State of AI" reports for healthcare, biopharma,
    and

    wellness in 2025 and 2026, and its privacy policy governs handling of de-identified data. PitchBook

    lists roughly 123 employees, a figure that sits in tension with the company''s very large scale claims

    and reinforces the need to verify headcount, revenue, and the founding timeline directly. The Pulse

    module provides real-time analytics, and marketing partners cite a "4X ROI" figure that remains

    company-sourced and unverified.'
