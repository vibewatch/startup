  title: Large Proprietary Data Asset and Blue-Chip Backers
  body: 'Vi''s Data Web — described as one of the world''s largest datasets of clinical, behavioral, and

    operational signals — combined with shareholders such as General Atlantic, Revelstoke, and Pritzker-

    managed 1902 Capital gives the company a credible data moat and capital base for a healthcare AI

    platform at a $1.64 billion valuation.'
  claimRefs:
  - CO011
  - CO008
  - CO002
- calloutType: risk
  title: Opaque Financials and Conflicting Founding Timeline
  body: 'Vi discloses no revenue, margin, or net-retention figures, and public databases conflict on when
    the

    company was founded (brand materials cite ~2011 while PitchBook''s first round is 2018). A ~123-person

    headcount also sits awkwardly against claims of 190M+ lives and $2B+ in value. These gaps make the

    $1.64 billion mark difficult to underwrite from public evidence.'
  claimRefs:
  - CO036
  - CO017
  - CO014
