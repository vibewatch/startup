company:
  name: Vi Labs
chapter:
  number: 1
  title: Company Overview
  summary: 'Vi (legally Vi Labs) is a New York-based enterprise AI platform for healthcare, life sciences,
    and

    wellness that productizes a large clinical, behavioral, and operational dataset ("Data Web") into

    patient and operational ROI. In May 2026 Vi launched a suite of vertically specialized AI agents and

    completed a $145M primary-and-secondary transaction valuing the company at $1.64B, backed by General

    Atlantic, Revelstoke, 1902 Capital, Square Peg, Savano Capital, and Island Green. Public databases

    give conflicting founding dates and disclose almost no financials, which is the central diligence
    gap.'
sections:
- id: identity-and-model
  title: Identity and Business Model
  body: 'Vi, the brand for Vi Labs, is an enterprise artificial-intelligence platform built for healthcare,

    life sciences, and wellness organizations and operated from New York. The company describes itself
    as

    "productized AI for health enterprises" and positions its software as the "AI execution layer" that

    sits on top of customers'' existing systems of record. Its commercial proposition is to convert a
    large

    proprietary dataset and domain-specific models into measurable patient and operational return on

    investment across the enterprise value chain, from patient engagement through operational efficiency.

    The platform is organized around five named modules — Data Web (the data layer), Activate, Engage,

    Operate, and Pulse — and in May 2026 Vi layered a suite of vertically specialized AI agents across
    the

    Activate, Engage, and Operate applications to drive next-best actions for patients, care teams, and

    operational workflows. Revenue is generated through enterprise relationships with health systems,

    pharmaceutical and life-sciences companies, and wellness organizations rather than a direct-to-consumer

    model, though Vi does not publicly disclose its pricing structure or contract economics.'
  claimRefs:
  - CO001
  - CO021
  - CO010
  - CO026
  - CO023
  - CO035
  - CO011
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, Founders, and Governance
  body: 'Vi''s founder and chief executive officer is Omri Yoffe, who is credited in executive interviews
    and

    company databases with building Vi around the integration of artificial intelligence and data science

    into healthcare and life-sciences outcomes. The company''s origin story is unusual: Vi describes itself

    as "born from aerospace," inspired by a silent systems failure that killed a co-founder''s Air Force

    pilot friend, and frames its technology as a "neural radar for health" that surfaces critical signals

    buried in noise. Beyond the chief executive, public-facing pages identify a functional leadership
    bench

    including Product Lead Yiftach Meitar, Senior Director of Client Performance Chelsea Pincus, VP of

    Growth for Healthcare Davis Miller, and Client Strategy and Activation Lead Laurén DiVenere, while
    a

    partner interview references a chief revenue officer named Spencer. Board composition, equity holdings,

    and formal governance arrangements are not disclosed, so key-person dependence on Yoffe and the

    completeness of the executive roster cannot be fully verified from public sources. This leadership

    opacity is a recurring theme across the company-overview evidence base and is preserved as a gap.'
  claimRefs:
  - CO009
  - CO027
  - CO028
  - CO037
  - CO013
  tableRefs:
  - TO002
- id: funding-and-valuation
  title: Funding, Valuation, and Investors
  body: 'In May 2026 Vi announced it had completed a $145 million transaction valuing the company at $1.64

    billion. The company states the deal combined both primary and secondary capital and was aimed at

    supporting talent retention and acquisition, investing in the platform and new products, and

    strengthening the balance sheet. The press release, reprinted across PRNewswire and Morningstar and

    covered independently by Pulse 2.0, lists Vi''s shareholders as General Atlantic, Revelstoke, 1902

    Capital (managed by The Pritzker Organization), Square Peg, Savano Capital, Island Green, and others;

    Revelstoke Capital separately lists Vi Labs in its investment portfolio. The most recent prior

    financing visible in databases is a $131 million later-stage venture round that PitchBook records
    as

    completed on 28 June 2024, alongside a 2022 secondary transaction. Combining the disclosed 2024 round

    and the 2026 transaction implies on the order of $276 million of cumulative capital, although Vi has

    never published a complete round-by-round funding history, revenue, or margin, leaving the underlying

    financial trajectory that justifies the $1.64 billion mark unverifiable from public evidence alone.'
  claimRefs:
