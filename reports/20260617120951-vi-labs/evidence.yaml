evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Vi discloses no revenue, ARR, gross margin, or net revenue retention, and no audited financials.
    whyItMatters: Without margins and retention the durability of the $1.64B valuation cannot be underwritten.
    diligencePath: Request audited management accounts and a revenue-by-module bridge under NDA.
    relatedQuestionRefs:
      - QO010
      - QO015
  - type: conflicting-data
    severity: material
    topic: founding date and history (milestone table)
    missingEvidence: Public sources conflict on Vi's founding year (~2011 vs 2016 vs first 2018 round).
    whyItMatters: An unclear founding timeline undermines confidence in the company's narrative and maturity claims.
    diligencePath: Obtain incorporation records and a verified corporate timeline from company counsel.
    relatedQuestionRefs:
      - QO007
      - QO013
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: leadership and founder table
    missingEvidence: Surnames, board seats, and equity holdings for Vi's executives are not public.
    whyItMatters: Key-person concentration on the CEO cannot be sized without board and equity detail.
    diligencePath: Request the org chart, board roster, and cap table during diligence.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: Ownership percentages, liquidation preferences, and round allocation per shareholder are undisclosed.
    whyItMatters: The preference stack and control rights materially affect downside outcomes.
    diligencePath: Request the cap table and investor rights agreements under NDA.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: scale verification
    missingEvidence: The 100+ customers, 190M+ lives, 50+ drugs, and $2B+ value figures are company-reported and unaudited.
    whyItMatters: Headline traction underpins the valuation but is not independently corroborated.
    diligencePath: Verify customer logos, covered-lives definitions, and value methodology with management.
    relatedQuestionRefs:
      - QO014
  - type: conflicting-data
    severity: material
    topic: market sizing dispersion
    missingEvidence: AI-in-healthcare forecasts diverge by more than 4x by the early-2030s and use different scopes.
    whyItMatters: Vi's valuation case depends heavily on which sizing lens is adopted.
    diligencePath: Reconcile scope definitions and obtain a bottom-up SAM from comparable enterprise platform peers.
    relatedQuestionRefs:
      - QM021
      - QM023
  - type: enumeration-incomplete
    severity: material
    topic: serviceable market (SOM) estimation
    missingEvidence: Vi's SAM/SOM are derived top-down and not corroborated by a bottom-up build or company pipeline data.
    whyItMatters: Without a bottom-up SOM, revenue potential and valuation cannot be tied to a defensible reachable market.
    diligencePath: Request Vi's pipeline, ACV, and win-rate data to build a bottom-up SOM under NDA.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: minor
    topic: buyer budget thresholds
    missingEvidence: Specific budget sizes and approval thresholds for healthcare AI platform purchases are not public.
    whyItMatters: Budget ownership affects deal size and sales-cycle length, which drive revenue modeling.
    diligencePath: Interview buyers and obtain anonymized deal economics during diligence.
    relatedQuestionRefs:
      - QM009
  - type: stale
    severity: minor
    topic: market estimate freshness
    missingEvidence: Some cited market reports are updated periodically and may lag the latest funding cycle.
    whyItMatters: Outdated estimates could misstate current growth rates.
    diligencePath: Refresh estimates against the most recent analyst updates at diligence time.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: competitive scale benchmarking
    missingEvidence: Vi does not disclose revenue or customer counts, so it cannot be benchmarked against peers that do.
    whyItMatters: Competitive position and the durability of Vi's data moat cannot be sized without comparable scale data.
    diligencePath: Obtain Vi's revenue, customers, and dataset metrics under NDA and benchmark against IQVIA and Komodo.
    relatedQuestionRefs:
      - QP018
  - type: missing-source
    severity: material
    topic: AI-agent defensibility
    missingEvidence: There is no public evidence on how defensible Vi's AI agents are versus incumbents' and horizontal AI providers'.
    whyItMatters: Commoditization of the agent layer would erode Vi's headline differentiator and pricing power.
    diligencePath: Assess agent architecture, data dependencies, and switching costs in a technical diligence session.
    relatedQuestionRefs:
      - QP016
  - type: missing-source
    severity: minor
    topic: partner and analyst ratings
    missingEvidence: Vi's standing in independent vendor ratings (e.g., KLAS) and partner ecosystems is not established publicly.
    whyItMatters: Independent ratings and partner access influence enterprise buying decisions.
    diligencePath: Request analyst evaluations and partner agreements during diligence.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: stale
    severity: minor
    topic: competitive intelligence freshness
    missingEvidence: Competitor scale figures rely on periodically updated public filings and databases.
    whyItMatters: Stale competitor data could misstate the relative gap to Vi.
    diligencePath: Refresh competitor financials against latest filings at diligence time.
    relatedQuestionRefs:
