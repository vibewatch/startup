            body: >-
              Vi 通过直接企业销售动作面向大型医疗健康、生命科学和健康管理买方销售，这种模式的特点是销售周期长且复杂，采购涉及多方利益相关者，并需要安全和合规审查。以 100 多家企业客户和 16.4
              亿美元估值推算，平均合同价值很可能处于高六位数到七位数区间，但 Vi 既不披露平均合同价值，也不披露获客成本、回本周期或净收入留存。因此，本章所有单位经济数字都是从上市公司可比对象三角测算而来：Veeva
              等企业医疗健康数据 SaaS 同业的毛利率约为 70-75%，而 Health Catalyst 等服务占比更高的分析厂商更低。Vi 的混合毛利率可能在 55-70%
              区间，取决于高利润率数据授权与低利润率服务的组合，但这一点未经验证。销售效率同样不透明；唯一代理指标是公司声称的 ROI 和已交付价值数字，它们是营销说法而非审计指标。CAC、回本和留存未披露，是评估 Vi
              增长究竟高效还是资本密集时最重要的缺口，并实质限制了对其底层盈利能力和可扩展性的信心。
