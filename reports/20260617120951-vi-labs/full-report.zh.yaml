  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              Vi 周围的竞争集合横跨四层。直接同业是有风险资本支持的医疗健康数据和人群健康平台——Komodo Health、Innovaccer、Arcadia 和 Lightbeam——它们和 Vi
              一样聚合临床与理赔数据，并向提供方、支付方和制药公司销售分析与互动能力。既有厂商是大型上市公司：Veeva Systems，生命科学云和 CRM 的主导厂商；IQVIA，最大的医疗健康数据和合同研究机构；以及
              Health Catalyst，一家面向服务提供方的数据与分析公司。相邻竞争者包括电子健康记录厂商（Epic、Oracle Health），它们越来越多地加入分析能力；还包括主要云厂商和横向 AI 提供商，Vi
              明确把自己放在与后者相对的位置。最持久的替代方案是现状：企业自建数据科学团队，或把点状方案和系统集成商拼在一起。Vi
              的战略押注是，一个横跨提供方、制药和健康管理用例的垂直专业化、产品化执行层，能胜过单一垂直专家和通用横向工具。这个押注可信但尚未证明，因为多数具名对手披露了 Vi
              未披露的收入、客户数或公开市场规模，导致正面对比困难，并让拥有既有分销的既有厂商在短期更占优势。
