      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Vi 面向三类不同企业买方销售，每类都有不同预算所有者和采用触发点。医疗系统和服务提供机构购买人群健康、患者互动和护理导航能力，通常由首席医疗、数字或运营官赞助，并用 value-based care
              经济性和运营效率证明合理性。制药和生命科学公司购买药物商业化、患者发现和临床试验加速分析，预算由商业和医学事务负责人掌握，触发因素是上市 ROI
              和试验时间线。健康管理和支付方相邻企业购买会员互动和生命周期价值优化。用户通常是分析师、护理经理或商业运营人员，而经济付款方是企业本身，不是单个患者。采用路径从数据集成开始，经过试点、ROI
              证明、部门部署，最终到企业标准化——这是一个跨多个季度的周期，受数据治理、安全和采购审查约束。漫长的企业销售周期以及连接既有记录系统的需求，是主要摩擦点，并会实质影响 Vi 把大型可寻址市场转化为确认收入的速度。
