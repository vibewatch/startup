      - number: '5.4'
        title: 信任、安全、隐私和合规
        blocks:
          - type: paragraph
            body: >-
              Vi 大规模处理受保护健康信息，因此信任、安全、隐私和合规是产品核心，不是外围事项。Vi 的核心隐私机制是去标识化：它称 Data Web
              由去标识化患者记录构成；按美国法律（HIPAA），只要去标识化达到标准，这类数据就能比可识别 PHI 更自由地使用和共享。Vi 发布了约束其数据实践的隐私政策。在医疗健康领域运营，也让 Vi 受到 HIPAA
              安全和隐私规则、FDA 对医疗健康 AI/ML 的演进思路，以及 FTC
              对健康数据审查的约束——这些在本报告风险章节中覆盖。对产品而言，关键的信任问题是：去标识化是否稳健（数据集越大、连接信号越多，重新识别风险越高）；AI
              模型和智能体的治理与验证能否防止不安全或有偏见的建议；以及保护高价值健康数据集免受泄露的安全控制。Vi 的公开材料宣称合规和去标识化，但未发布独立审计（例如 SOC 2 或
              HITRUST）、模型验证方法或泄露历史，因此必须直接验证。大型 PHI 衍生数据集与会采取行动的智能体层叠加，会抬高风险：错误或泄露会带来监管、声誉和临床后果，使可证明的信任控制成为企业采用和投资的门槛条件。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
              - CE025
              - CE026
