      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Vi 的潜在护城河包括大型专有 Data Web、跨垂直广度和早期智能体层，并由蓝筹投资者强化。耐久性仍不确定。数据护城河只有在 Vi 的数据集相较 IQVIA 和 Komodo
              的大规模真实世界数据资产确实差异化时才有意义，而公开证据尚未证明这一点。如果各垂直领域的专家执行得比 Vi 更好，广度优势可能转为焦点劣势。最重要的是，Vi 作为差异化卖点营销的 AI
              智能体层，正是每个竞争者和横向 AI 提供商都在竞相添加的能力，因此存在真实的商品化风险。既有厂商还拥有 Vi
              缺乏的结构性优势：上市公司资产负债表、数十年的监管与合规记录，以及根深蒂固的分销。主要不利情景包括：既有厂商以低边际价格把可比 AI 智能体打包进既有合同；Vi
              未披露的规模小于其叙事所暗示；以及漫长销售周期让资源更强的对手赢得企业标准。这些风险使竞争定位成为承销 Vi 16.4 亿美元估值时最关键的摆动因素。
