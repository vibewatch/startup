      - number: '8.2'
        title: 建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们的建议是有条件买入，置信度中等，风险评级中到高，估值立场是在 $1.64B 上公平到略贵。理由是 Vi
              结合了真正差异化的数据资产、可信的代理式执行产品扩张、已验证的企业需求，以及顶级投资人背书——如果未披露的基本面健康，这组组合能够支撑当前标记，并提供有意义的上行。置信度被压在中等而非高，正是因为基本面未披露：投资人无法核验收入规模、增长、利润率或留存，因此建议必须明确带条件。估值立场反映出，按规模和叙事与私有医疗
              AI 可比公司相比，$1.64B 是合理的，但没有披露就无法锚定收入倍数；如果 Vi
              收入处在合理区间低端，倍数就会偏贵。入场纪律上，一轮估值上调的后期私募轮有常见问题：清算优先权和稀释悬置没有公开细节，必须审查；2026
              年交易包含二级转让成分，意味着部分资金用于股东流动性，而非增长。实际建议是推进确认性尽调，签署以经审计财务、留存和集中度数据、安全与合规认证为前提的投资条款书——买入这一论点，但通过结构和条件给披露缺口定价并加保护，而不是按表面估值照单全收。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV021
              - CV022
