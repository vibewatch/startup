      - number: '1.4'
        title: 规模与牵引指标
        blocks:
          - type: paragraph
            body: >-
              Vi 的公开规模主张很大，并且在新闻稿和创始人博客中保持一致。公司称其服务 100 多家大型企业客户，包括 Fortune 500 公司以及许多领先的医疗健康、生命科学和健康管理机构。公司称平台支持 1.9
              亿多名患者和会员，参与推动 50 多种药物在肿瘤学、儿童癫痫和糖尿病领域的开发与商业化，并在合作伙伴生态中创造了 20 亿美元以上可衡量价值。支撑这些主张的差异化资产是 Data Web。Vi
              将其描述为全球最大的临床、行为和运营信号数据集之一，把生理特征、人口统计、使用行为和授权合作伙伴数据整合进一个可供 AI
              使用的单一层；数据库描述也提到家庭层面的数据覆盖。这些数字均为公司报告，未经独立审计；收入、ARR、毛利率和净收入留存等核心财务指标仍未披露，因此第三方目前还无法佐证牵引的质量和耐久性。
