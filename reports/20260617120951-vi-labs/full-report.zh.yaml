  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              用客户工作流来理解，Vi 是一个智能与执行层，位于企业记录系统和团队需要围绕患者、会员、市场做出的决策之间。医疗系统用 Vi
              识别并激活高风险患者；制药公司用它为某项疗法找到并触达合适的服务提供者和患者；健康管理企业用它个性化会员互动。这些工作流由五个具名模块交付。Data Web 是数据基础——一个去标识化数据集，覆盖 1.9
              亿多条患者记录，并约覆盖 96% 的美国家庭。Activate 推动人群识别和患者激活。Engage 支撑数字化和多渠道互动。Operate 处理运营和护理协同工作流。Pulse
              提供实时分析和洞察。其上叠加的是一套 2026 年 5 月发布的 AI 智能体；Vi 称其为执行层，可在这些模块之间自动化最佳下一步行动。这些模块作为一个连接平台销售，而不是独立工具；这正是 Vi
              定位的核心：价值来自把大型专有数据集与能基于数据采取行动的应用结合起来。由于多数产品细节来自 Vi 自有页面，技术深度和具体模块边界应在尽调产品演示中确认。
