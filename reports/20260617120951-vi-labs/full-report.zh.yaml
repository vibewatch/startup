      - number: '3.3'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              这些厂商都不公布透明标价，Vi 也一样；医疗健康数据和分析平台通常以多年企业合同销售，按部署谈判，价值与数据访问、席位和结果挂钩。分销能力是关键差异。Veeva 和 IQVIA
              几乎覆盖整个制药行业，关系深且粘性强；其数据和 CRM 系统一旦嵌入受监管的商业和临床工作流，切换成本很高。Innovaccer、Arcadia 和 Health Catalyst
              等面向服务提供方的平台，则通过数据集成、定制分析和护理管理工作流锁住医疗系统，这些能力替换成本高。Komodo 的护城河是其专有患者级 Healthcare Map。Vi 的 Data Web
              一旦完成集成、智能体嵌入运营工作流，切换成本看起来也是真实的；但由于公开证据很少涉及合同期限、留存或多供应商并用行为，其锁定效应比既有厂商更难验证。买方经常多供应商并用——一个厂商用于提供方分析，另一个用于制药商业化——这既为
              Vi 的跨垂直广度打开切口，也限制了任何单一厂商彻底替代其他厂商的能力。
