  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是 Vi 最重大的暴露，因为公司处在美国健康数据监管中心，同时向 AI 延伸。基础制度是由 HHS 管理的 HIPAA，规范受保护健康信息的使用和披露；Vi
              能广泛使用数据，靠的是去标识化。因此，一旦去标识化方法存在弱点，或监管收紧去标识化标准，就会直接威胁其核心数据资产。其上叠加的是医疗 AI 监管仍在演进：FDA 对 AI/ML-enabled software
              as a medical device 的框架，取决于 Vi 智能体的使用方式，可能把部分功能纳入受监管医疗器械路径，而监管姿态仍在成熟。FTC
              已经释放强执法信号，聚焦健康数据隐私和敏感数据误用，包括在未取得充分同意或披露不足时共享健康信息的公司。州隐私法（如加州 CCPA/CPRA）以及任何国际数据适用的欧盟 GDPR，都会增加义务；美国联邦 AI
              政策格局也未稳定。公开记录中没有 IP 风险或诉讼证据，但没有披露诉讼不等于不存在。整体监管图景是：高概率、高影响暴露。Vi
              称自己靠去标识化和公开隐私政策管理风险，但没有用审计、认证或监管往来文件加以证明——最关键的风险类别，反而最难从公开来源核验。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR020
