      - number: '8.4'
        title: 退出准备度、触发条件与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度上，Vi 具备在多年期视野内通过战略收购或 IPO 退出的画像：战略买家（大型医疗 IT、药企服务或数据公司）会看重其数据集和跨垂直领域足迹；医疗 AI 市场持续强劲，也会让 IPO
              路径保持打开。但退出时点和估值仍取决于同一组未披露基本面；2026 年融资或退出环境收紧，也增加不确定性。应使建议失效的
              thesis-break（kill）触发条件很具体：发现收入或留存显著低于估值所隐含水平；发生重大数据泄露或监管执法；监管变化削弱去标识化；关键数据供给关系丧失；在位者以低价打包同类能力，商品化智能体层；或创始人兼
              CEO 离职且没有可信继任者。对应最终尽调要求，就是任何投资的前提条件：经审计财务报表和收入结构；净收入留存、流失和客户集中度数据；数据供给和关键客户合同；SOC 2/HITRUST 以及模型验证 /
              偏见测试文件；诉讼、IP 和事故历史；完整 cap table、优先权和期权池细节。总体投资姿态是建设性但有纪律：Vi
              是一个可信的品类竞争者，价格也可辩护；正确动作是继续推进，但用结构和条件把今天的披露缺口转化为可核验证据后，再投入资本。
            claimRefs:
              - CV014
              - CV015
