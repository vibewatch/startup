      - number: '7.5'
        title: 缓释、监测与终止触发条件
        blocks:
          - type: paragraph
            body: >-
              Vi 有公开证据支撑的缓释措施并不完整。监管和隐私上，公司依赖去标识化和公开隐私政策；运营上，依赖运营一个 100+
              客户平台所隐含的能力；资本上，依赖蓝筹投资人背书。公开记录缺少的是企业买家和投资人预期的可核验装置：独立安全认证、成文的模型治理和偏见测试、泄露与事故历史、SLA，以及财务和集中度数据披露。对投资人最有用的框架，是一组监测指标和
              thesis-break 触发条件。监测指标包括 HHS/OCR 或 FTC 的任何执法行动或调查、HHS 门户上的任何已报告泄露、HIPAA 去标识化标准或 FDA AI/ML
              设备政策变化、客户流失或集中度证据，以及在位者商品化智能体的迹象。Thesis-break（kill）触发条件包括重大数据泄露或监管执法、削弱去标识化的监管变化、关键数据供给关系丧失、收入或留存远低于估值所隐含水平的证据，或创始人兼
              CEO 离职且没有可信继任者。对应尽调要求很直接：拿到经审计财务、安全与合规认证、模型验证文件、数据供给和客户合同，以及诉讼和事故历史。在这些要求满足前，Vi
              的风险画像应按高不确定性承销，并包含多个高影响、验证不足的暴露。
            claimRefs:
              - CR016
              - CR019
              - CR027
              - CR028
              - CR029
              - CR030
