      - number: '6.2'
        title: 采用与部署轨迹
        blocks:
          - type: paragraph
            body: >-
              Vi 提供的最清晰量化牵引信号，是其声称拥有 100 多家企业客户，并叠加平台级规模指标：Data Web 覆盖 1.9 亿多条去标识化记录、约 96% 美国家庭覆盖、支持 50 多种药物上市，以及交付 20
              亿美元以上可衡量价值。这些数字暗示相当的采用深度，但 Vi 没有发布时间序列，说明客户数、活跃使用或部署如何增长，也不披露利用率、复购或扩张率。公司 2024 年后期轮融资，以及 2026 年以更高估值完成的
              1.45 亿美元交易，是投资者看到持续商业动能的间接证据；2026 年 5 月 AI 智能体发布，也暗示公司正在既有客户基础中做扩张。具名的 Minnesota 心理健康客户，是 Vi
              最具体的部署证明；公司称该客户把护理规模扩大约五倍，说明平台能在真实生产环境中推动大型运营增益。不过，单个有日期的案例研究加总量指标，仍是证明持久、广泛采用轨迹的薄弱证据。没有客户增长时间序列或客户队列层面的使用数据，尽调无法区分公司是在快速复合增长，还是靠早期客户
              logo 撑起较平的基数；因此采用轨迹是最需要向管理层和客户访谈直接验证的事项之一。
            claimRefs:
              - CU005
