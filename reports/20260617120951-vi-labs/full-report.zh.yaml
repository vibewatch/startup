  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现
        blocks:
          - type: paragraph
            body: >-
              Vi 的收入模式，是把企业软件变现叠加在专有数据资产之上。主要收入流来自面向医疗系统、制药公司和健康管理企业销售的多年平台订阅，覆盖 Data Web、Activate、Engage、Operate 和
              Pulse 等模块。第二条收入流是数据授权，以及对其去标识化 Data Web 的访问；这是一类高利润率资产，类似 IQVIA 和 Komodo Health 变现真实世界数据的方式。第三条、更新的收入流，是
              2026 年 5 月推出的 AI 智能体套件；Vi 将其定位为执行层，可作为既有部署之上的扩展销售。专业服务和实施很可能贡献较低利润率收入，这符合企业医疗 IT 厂商的典型模式。Vi 营销面向结果的价值——已交付
              20 亿美元以上可衡量价值，客户投资回报约 4 倍——这暗示公司可能愿意用结果锚定定价，但没有公开证据显示存在正式的结果付费合同。关键在于，Vi
              没有披露收入结构、确认政策或合同条款，投资者无法据此验证收入质量。本节所述构成来自公司产品结构和行业常态的推断，并非披露的财务报表；承销前应直接向管理层确认。
