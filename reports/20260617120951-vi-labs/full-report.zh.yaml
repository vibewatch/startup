      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 大型、高速增长、软件占比高的市场
            body: >-
              主要分析机构都把 2025 年医疗健康 AI 市场规模测算在约 370-400 亿美元，CAGR 为 35-44%，且由软件主导；这给 Vi 提供了一个巨大且扩张中的 TAM，并受到 value-based
              care 和互操作性的结构性顺风支撑。
            calloutType: strength
            claimRefs:
              - CM001
              - CM003
              - CM018
              - CM019
          - type: callout
            title: 规模测算分散且采用存在摩擦
            body: >-
              已发布预测到 2030 年代初的差异超过 4 倍；在剔除诊断、影像和 EHR 之后，Vi 的现实 SAM/SOM 只是头部 TAM 的小部分。长销售周期、HIPAA 合规、AI
              监管不确定性和对炒作的怀疑，都会放慢可寻址市场转化为确认收入的速度。
