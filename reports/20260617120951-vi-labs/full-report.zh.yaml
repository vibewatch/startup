chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Vi 是 Vi Labs 的品牌，是一个为医疗健康、生命科学和健康管理机构打造的企业人工智能平台，总部位于纽约并由纽约团队运营。公司将自己描述为“面向健康企业的产品化
              AI”，并把软件定位为架在客户既有记录系统之上的“AI
              执行层”。它的商业主张，是把大型专有数据集和垂直领域模型转化为可衡量的患者和运营投资回报，覆盖从患者互动到运营效率的企业价值链。平台围绕五个具名模块组织——Data
              Web（数据层）、Activate、Engage、Operate 和 Pulse；2026 年 5 月，Vi 又在 Activate、Engage 和 Operate 应用之上叠加了一套垂直专业化 AI
              智能体，用来为患者、护理团队和运营工作流推动最佳下一步行动。收入来自与医疗系统、制药和生命科学公司、健康管理机构的企业关系，而不是直接面向消费者的模式；但 Vi 未公开披露定价结构或合同经济性。
