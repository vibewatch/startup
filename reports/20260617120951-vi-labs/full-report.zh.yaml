      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Vi 的架构可以读作一套技术栈。底层是 Data Web
              数据层：摄取、去标识化、链接并存储跨数亿条记录的临床、理赔和消费者信号。其上是机器学习和分析层，在这些数据上构建预测和分群模型——公司传承被描述为应用信号处理和“神经”技术，呼应其领导层所讲的航空航天和雷达根源。模型层之上，是更新的智能体式执行层：AI
              智能体把模型输出转化为推荐或自动化行动。五个模块构成应用表面，把这些能力暴露给具体用户画像；集成层则把平台连接到企业记录系统。与电子健康记录的互操作性，以及遵守 HL7 FHIR
              等医疗健康数据标准，实际上是进入提供方环境部署的前提；ONC/HealthIT.gov 下的美国互操作性政策也在持续抬高数据交换基线。运营上，Vi 以多租户云平台服务 100
              多家企业客户，这意味着其在数据工程、模型运营和云基础设施上投入不小。公开记录没有披露 Vi 的具体云提供商、模型栈或可用性指标，因此本节架构是根据公司产品页面和行业常态重建，而非来自技术文档。
