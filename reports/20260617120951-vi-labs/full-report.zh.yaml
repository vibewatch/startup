        title: 展示材料
        blocks:
          - type: callout
            title: 具名生产客户案例，有明确结果
            body: Vi 称，明尼苏达州一家心理健康客户把护理规模扩大约五倍。这个案例有客户名称、已在生产环境落地，并给出具体且可观的结果；如果能在更多客户中复现，就能验证 Vi 的价值主张。
