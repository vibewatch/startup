              - CR011
              - CR015
      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Vi 的运营和安全风险，集中在它的核心优势上：一个庞大、敏感、源自 PHI 的数据集，正在喂给越来越多会采取或建议行动的 AI 模型。最严重的运营风险是数据泄露。医疗是美国被泄露最多的行业，HHS
              设立公开泄露报告门户，正是因为事件常见且后果重大；如果 Vi 超过 1.9 亿条记录的 Data Web
              发生泄露，可能带来监管处罚、客户流失和声誉损害。紧密相关的是重新识别风险：去标识化数据集越大、连接信号越多，理论上重新识别个人的能力就越强，这既是隐私风险，也是合规风险。第二类是模型质量和安全。Vi
              的智能体会产出影响患者识别、触达和运营的建议；模型错误、漂移或偏见，可能造成临床、公平性或商业损害，而 Vi
              没有公开模型验证或偏见测试方法。第三类是可靠性：一个嵌入企业工作流、会采取行动的平台，必须满足严格的可用性和支持预期，但 Vi 没有公布 SLA、可用性历史或事故记录。最后，企业买家通常要求的安全认证（SOC
              2、HITRUST）也没有公开证据。切换成本和 Vi 的规模化记录暗示其运营能力不差，但公开记录几乎拿不出可核验的运营控制证据。因此，在证明相反情况前，运营和安全风险应被视为重大且很大程度上未被缓释。
            claimRefs:
