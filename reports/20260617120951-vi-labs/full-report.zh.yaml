            title: 边界纪律改变投资判断
            body: >-
              Vi 究竟是一个数千亿美元机会，还是一个低个位数十亿美元机会，完全取决于如何界定市场。承销 Vi 的 16.4 亿美元估值时，把企业数据平台层——而不是整个医疗健康 AI
