      - number: '7.4'
        title: 财务、模型与团队风险
        blocks:
          - type: paragraph
            body: >-
              财务和执行风险会放大监管与运营图景。最核心的财务风险是透明度：Vi 没有披露收入、毛利 / 利润率、留存、烧钱速度或现金续航期，投资人无法核验支撑 $1.64B
              估值的单位经济和资本充足性，也无法排除利润率受压、高烧钱或弱留存。尽管 2026
              年交易包含二级转让成分且有顶级投资人参与，未披露盈利能力意味着一旦增长放缓，融资依赖是真实存在的。模型风险是紧邻财务的独立风险：如果 Vi 的 AI
              智能体是价值主张核心，而这些智能体表现不佳、被打包同类能力的在位者商品化，或需要持续重投入才能维持，经济论点就会变弱。团队和执行风险在一家约 123 人的公司里也很重要：对创始人兼 CEO Omri Yoffe
              和小型高管团队的依赖，形成关键人风险；扩张一家企业级医疗 AI
              公司，需要深厚且稀缺、昂贵的监管、临床和商业人才。公开资料没有治理缺陷或高管离职证据，但也没有披露继任计划或董事会构成。合在一起，财务、模型和团队风险单项或许可管理，但共同抬高了尽调门槛：没有财务披露和组织深度证据，就无法确认商业模式和团队的耐久性。
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR025
              - CR026
