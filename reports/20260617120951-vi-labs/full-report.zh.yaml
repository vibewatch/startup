      - number: '1.3'
        title: 融资、估值和投资者
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Vi 宣布完成一笔 1.45 亿美元交易，公司估值 16.4 亿美元。公司称该交易同时包含一级和二级资本，目的在于支持人才留任与招聘、投资平台和新产品，并加强资产负债表。新闻稿由
              PRNewswire 和 Morningstar 转载，Pulse 2.0 也独立报道；稿中列出的 Vi 股东包括 General Atlantic、Revelstoke、1902 Capital（由 The
              Pritzker Organization 管理）、Square Peg、Savano Capital、Island Green 等；Revelstoke Capital 也单独在其投资组合中列出 Vi
              Labs。数据库中可见的最近一轮此前融资，是 PitchBook 记录于 2024 年 6 月 28 日完成的 1.31 亿美元后期风险投资轮，另有一笔 2022 年二级交易。把已披露的 2024 年融资和
              2026 年交易合并计算，累计资本大约为 2.76 亿美元；但 Vi 从未发布完整逐轮融资历史、收入或利润率，因此仅靠公开证据无法验证支撑 16.4 亿美元估值的底层财务轨迹。
