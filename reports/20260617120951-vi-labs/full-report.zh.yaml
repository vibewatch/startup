      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Vi 的平台依赖一串外部关系，每一环都可能失效。最根本的是数据供给：Vi 的 Data Web
              由临床、理赔和消费者数据来源拼成，公司经济模型和产品都依赖持续、合规地获取这些数据。如果关键数据供给关系因为合同、监管或合作方自建竞品而被削弱，Vi 的核心资产就会被侵蚀。第二是云和基础设施依赖：和所有现代 AI
              平台一样，Vi 依赖云服务商；其智能体层也很可能依赖第三方模型和工具提供商，因此暴露于定价、可用性和政策变化，而这些不在公司控制之内。第三是客户集中度：Vi
              没有披露少数大客户是否贡献过高收入占比，这是典型依赖风险，公开资料无法评估。第四是资本提供方依赖：蓝筹投资人是优势，但未披露盈利能力的私人公司，最终仍依赖持续投资人支持；融资环境收紧会抬高这一风险。第五是监管依赖：Vi
              经营在监管制度允许的边界内，而规则可能改变，尤其是去标识化和 AI。依赖图谱很宽；由于 Vi 既不披露数据供给合同、云安排，也不披露客户集中度，多数依赖无法量化——第三方和集中度尽调因此优先级很高。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR023
              - CR024
