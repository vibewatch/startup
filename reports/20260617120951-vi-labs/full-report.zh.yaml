      - number: '8.3'
        title: 情景与可比估值
        blocks:
          - type: paragraph
            body: >-
              我们设定三个情景。多头情景下，Vi 的数据护城河被证明耐久，智能体层推动存量客户先落地再扩张，公司向品类领导者复合增长；若路径成功，退出时 $4-6B+ 的未来估值是可能的，对 $1.64B
              入场价意味着强回报。基准情景下，Vi 仍是强劲的专业化玩家，份额扎实但不占主导，通过战略收购或 IPO 以约 $2-3B
              退出——带来中等正回报。空头情景下，竞争将智能体层商品化，监管或安全事件损害信任，或未披露财务被证明偏弱，估值停滞或收缩到当前标记以下，产生持平到负回报。可比公司为这些情景提供锚点。公开同业
              Veeva（市值数百亿美元、收入倍数高）和 IQVIA（约 $40B）设定品类天花板；Health Catalyst（规模更小、倍数更低）显示服务占比更重模型的下行。最相关的私有可比公司是 Innovaccer
              和 Komodo Health，估值都在低个位数十亿美元区间，这使 Vi 的 $1.64B 标记与风投支持的医疗数据平台定价大体一致——前提是 Vi 的规模可比。由于 Vi
              没有披露收入，可比分析只能基于估值水平和定性规模，而非倍数；因此，可比分析支持该标记的合理性，但不能确认它。所有情景中最关键的摇摆因素，是未披露财务能否验证估值和可比公司所假设的规模。
            claimRefs:
              - CV010
              - CV011
