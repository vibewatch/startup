      - number: '6.4'
        title: 留存、扩张和集中风险
        blocks:
          - type: paragraph
            body: >-
              留存和客户耐久性，是 Vi 客户画像里证据最薄的部分。Vi 没有披露净收入留存、总留存、流失率、续约率、合同期限或 cohort
              存续数据——这些指标才能说明客户是否留下来并扩张。作为一个带多年期合同、且嵌入数据层的企业平台，Vi 一旦落地，切换成本大概率较高，这会支撑留存；2026 年 AI
              智能体发布，也天然可以靠先落地再扩张的方式向存量客户扩张。但这些都没有公开量化。集中度风险同样不透明：Vi
              没有披露客户集中度，因此无法判断少数大客户是否贡献了过高收入占比；若是如此，就是实质风险。渠道和合作伙伴依赖也没有记录，不过直销企业客户的打法意味着渠道依赖可能有限。采购摩擦是结构性逆风——医疗行业企业销售周期长，安全和合规审查重，会拖慢新增签约和扩张。综合看，Vi
              的留存和集中度几乎是完整披露缺口，只是叠加在一个可能有粘性的产品之上。客户耐久性和集中度，是判断经常性收入质量的核心，因此获取 cohort 留存、NRR
              和头部客户集中度数据，应列为最高优先级尽调事项之一；没有负面流失证据，不应被误读为低流失已获确认。
