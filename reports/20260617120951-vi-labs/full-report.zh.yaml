      - number: '5.3'
        title: 部署、路线图和差异化
        blocks:
          - type: paragraph
            body: >-
              将 Vi 部署进企业，需要把客户数据和系统接入平台，按客户工作流配置模块，并用客户自身人群验证模型输出；这个过程和大多数企业医疗 IT 一样，集成负担重，并受到安全与合规审查约束。Vi 的可靠性、支持模式和正式
              SLA 未公开记录，是尽调缺口。路线图上，最清晰的信号是 2026 年 5 月 AI 智能体套件发布，它把平台从分析与互动延伸到自主执行，也是公司公开陈述的主要方向；进一步路线图细节未公开。Vi
              的差异化建立在四根支柱上。第一是数据：如果 Data Web 的规模和家庭覆盖相较 IQVIA 与 Komodo 的数据确实差异化，它就是一项真实资产。第二是垂直专业化：Vi
              的智能体和模型专为医疗健康工作流打造，而不是通用目的。第三是一个平台横跨提供方、制药和健康管理。第四是在智能体式医疗健康 AI
              中的早期进入位置。这些优势的耐久性不确定：数据护城河尚未相对既有厂商得到验证，而智能体层正是每个竞争对手都在竞相添加的能力，带来商品化风险。最重要的产品尽调问题，是数据资产有多可防御，以及模型和智能体是否经过足够严格的临床安全验证。
