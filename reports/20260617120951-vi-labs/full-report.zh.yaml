companyProfile:
  summary: >-
    Vi Labs（vi.co）是一家总部位于纽约的企业 AI 平台，服务医疗健康、生命科学和健康管理机构。公司成立于 2011 年，提供一组 AI 驱动模块，包括 Data Web、Activate、Engage、Operate 和
    Pulse，帮助企业使用患者数据、触达人群，并推动可衡量的健康结果。截至 2026 年 5 月，Vi Labs 完成一笔 1.45 亿美元的一二级混合交易，估值 16.4 亿美元，投资方包括 General
    Atlantic、Revelstoke Capital 及其他成长型投资者。平台覆盖 1.9 亿多条去标识化患者记录，约覆盖 96% 的美国家庭，服务 100 多家企业客户，并称已交付 20 亿美元以上可衡量价值。
