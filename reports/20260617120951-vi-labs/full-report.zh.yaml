  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Vi 位于医疗健康人工智能市场之内，但更适合用一个更窄的边界理解：服务医疗服务提供方、生命科学和制药公司、健康管理机构的企业 AI
              与数据平台。纳入的支出包括医疗健康数据平台和分析、患者互动与激活软件、人群健康和护理导航工具，以及制药商业化和临床试验分析。不属于 Vi 核心边界的，是临床级诊断 AI
              和医学影像设备、机器人辅助手术、电子健康记录系统以及直接卖给个人的消费者健康应用，尽管其中一些会被计入最宽口径的医疗健康 AI 市场总量。Vi
              所替代的现状方案，是企业内部数据科学团队、由系统集成商拼接的点状方案、传统分析套件，以及手工护理管理和商业化工作流。Vi 将自己定位为横向“AI
              执行层”，在既有记录系统之上编排这些功能；这既扩大了可触达版图，也让它暴露在每个相邻类别的既有厂商竞争中。先定义边界再测算市场很关键，因为医疗健康 AI 的头部总量会高估 Vi 能现实捕获的支出。
