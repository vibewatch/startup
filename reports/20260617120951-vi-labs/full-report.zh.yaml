      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 监管 + 安全暴露影响大、验证弱
            body: HIPAA、FDA AI/ML 和 FTC 健康隐私暴露，叠加一个 1.9 亿条记录数据集上缺乏证据支撑的安全和模型治理状态，构成 Vi 最关键的风险。一次泄露或执法行动，就可能触发客户流失和估值受损。
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
          - type: callout
            title: 数据供给依赖是单点故障
            body: Vi 的核心资产依赖持续、合规地获取外部数据。如果关键数据供给关系因合同、监管或合作方转为竞争者而丧失或收缩，Data Web 护城河会被侵蚀；但公司没有披露任何数据合同。
            calloutType: risk
            claimRefs:
              - CR011
              - CR023
          - type: callout
            title: 将可核验控制作为投资前提
            body: 把经审计财务、SOC 2/HITRUST 认证、模型验证文件、数据供给和客户合同、诉讼 / 事故历史，设为投资条件。在满足前，应把 Vi 的风险画像视为高不确定性，并包含多个高影响、验证不足的暴露。
            calloutType: recommendation
