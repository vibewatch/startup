      - number: '2.2'
        title: 多重口径下的市场规模
        blocks:
          - type: paragraph
            body: >-
              独立市场研究机构对医疗健康 AI 的规模和增速分歧很大，因此本报告保留区间，而不是给出单一数字。Grand View Research 估算，2025 年全球医疗健康 AI 市场为 366.7 亿美元，并以
              38.9% CAGR 增至 2033 年的 5055.9 亿美元。Precedence Research 将 2025 年收入估为 369.6 亿美元，并预计以 35.0% CAGR 增至 2035 年的
              7443.4 亿美元。Mordor Intelligence 测算 2025 年为 401.4 亿美元，并预测以 36.2% CAGR 增至 2031 年的 2513.6 亿美元；Fortune Business
              Insights 最激进，预计市场从 2025 年的 393.4 亿美元增至 2034 年的 1.03 万亿美元，CAGR 为 44.0%。北美始终占最大份额，约 44-54%；软件是主导构成，约占支出的
              46%。自上而下打折，隔离出 Vi 实际销售进入的企业医疗健康 / 生命科学数据平台层，得到 2026 年约 80-180 亿美元的可服务市场，其中 Vi 可现实取得的份额是低个位数十亿美元级
              SOM。这些受约束估算为推导值，并非来源直接陈述，已按此标注。
