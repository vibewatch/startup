      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              几个长期因素在扩大 Vi 的市场。向 value-based care 转型，并由 CMS Innovation Center
              支付模型强化，会奖励能够预测并管理人群健康的机构，直接利好数据与分析平台。Office of the National Coordinator 推进的联邦互操作性规则，包括 TEFCA 和基于 FHIR
              的交换，提高了 Vi 的 Data Web 这类平台所依赖的临床数据可得性和可携带性。企业 AI 采用，以及成本受压行业对可衡量 ROI 的需求，把预算推向垂直专业化工具。逆风同样真实：数据隐私和 HIPAA
              义务提高了处理受保护健康信息的成本；围绕临床决策支持的 AI 专属监管不确定性让买方谨慎；切换成本和集成复杂性拉长销售周期；更广泛的怀疑也在压低买方紧迫感，即近期 AI
              采用是否能兑现炒作。一些分析师还警告，既有厂商和初创公司都在涌向同一批企业预算，市场可能变得拥挤。净效果是：市场巨大、增长很快，但竞争激烈；能否捕获可用支出，取决于执行速度和信任，而不只是技术。
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
