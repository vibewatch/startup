      - number: '3.2'
        title: 能力与功能对比
        blocks:
          - type: paragraph
            body: >-
              从能力广度看，Vi 的卖点异常横向：一个平台把大型数据层（Data Web）、患者激活与互动、运营工作流、实时分析，以及覆盖提供方、制药和健康管理用例的新 AI
              智能体套件组合在一起。多数竞争者更深但更窄。Veeva 在生命科学商业和临床软件及 CRM 上最强，但不是服务提供方侧的人群健康平台。IQVIA 的优势在于面向制药的真实世界数据和分析的规模与深度，加上 Vi
              不提供的合同研究能力。Komodo Health 围绕其患者级数据“Healthcare Map”服务生命科学。Innovaccer、Arcadia、Health Catalyst 和 Lightbeam
              是面向提供方与支付方的人群健康和数据平台公司，分析能力强，但对制药商业化的强调较弱。Vi
              可以可信声称的优势，是横跨三个垂直领域的广度，以及驱动最佳下一步行动的智能体层；它最暴露的地方则是深度和证明，因为既有厂商拥有更大的数据集、更深的监管与合规记录，以及已披露的企业客户基础。因此，能力矩阵应被理解为广度与深度的权衡，而不是简单的功能清单。
