      - number: '6.3'
        title: 具名客户证明与客户访谈质量
        blocks:
          - type: paragraph
            body: >-
              Vi 的具名客户证据，主要来自一家 Minnesota 心理健康服务提供方的详细故事。Vi 称该客户使用平台后，护理交付规模扩大约五倍——这是一个生产部署，且有具体、较大的结果主张。Vi
              还营销汇总证明点，包括支持 50 多种药物上市、20 亿美元以上可衡量价值数字；一份合作伙伴案例研究还引用约 4 倍客户 ROI。证据质量是混合的。Minnesota
              故事是真实、具名、生产环境的客户证明，并带有具体结果，这一点很强。但它很大程度上只是一个深度客户证明；Vi 没有发布广泛客户 logo
              墙、多条独立具名客户证明，或第三方验证的结果研究，最强数字（交付价值、ROI）来自公司或合作伙伴，而非独立审计。证据新鲜度合理——融资和智能体发布材料日期为 2026
              年，案例研究也属近期——但客户证明的广度和独立性有限。对于一个声称拥有 100
              多家客户的企业平台，头部客户数与少量公开可验证、具名、结果支撑的客户证明之间的落差值得注意。尽调应要求完整客户名单、跨垂直领域的多次客户访谈，以及任何第三方或同行评审结果证据，以佐证其营销中的价值和 ROI
              主张。
