        title: 图表与要点
        blocks:
          - type: callout
            title: 数据加行动平台是连贯的产品论点
            body: Vi 把大型专有数据基础（Data Web）与模块和智能体层配对，让系统能基于数据采取行动。如果数据集确实差异化，广度加执行的组合，就是横跨提供方、制药和健康管理工作流的强产品论点，也很难复制。
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE011
          - type: callout
            title: 模型验证和去标识化未经验证
            body: Vi 宣称去标识化和合规，但未发布独立审计、模型验证方法或泄露历史。在 PHI 衍生数据之上叠加会采取行动的智能体层，未经验证的信任控制会成为企业采用和投资的门槛风险。
            calloutType: risk
            claimRefs:
              - CE013
              - CE016
              - CE025
          - type: callout
            title: 智能体层既是战略押注，也是商品化风险
            body: 2026 年 5 月的 AI 智能体套件是 Vi 公开陈述的主要方向和关键差异化，但它也是每个竞争对手都在竞相添加的能力，因此智能体可防御性是最关键的产品问题。
            calloutType: insight
