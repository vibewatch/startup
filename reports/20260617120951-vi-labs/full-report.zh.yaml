        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              Vi 已披露的资本化，是其最强的财务信号。公司于 2024 年 6 月完成 1.31 亿美元后期轮融资，并于 2026 年 5 月以 16.4 亿美元估值完成 1.45 亿美元一二级混合交易，背后有
              General Atlantic 和 Revelstoke Capital 等蓝筹投资者支持。由于 2026 年交易包含为既有股东提供流动性的二级部分，并非全部 1.45
              亿美元都进入资产负债表，因此新增现金的精确数额不清楚。Vi
              不披露账上现金、现金消耗速度或资金可支撑时间，因此无法量化资本充足性；但能在估值上行的情况下从顶级投资者处融资，说明公司拥有资本获取能力，并降低了近期融资风险。财务结论是混合的。考虑到数据授权组件，收入质量可能较高；按行业常态看，利润率路径可能健康；资本强度看起来适中。但这些都未经验证。决定性的尽调阻碍，是审计财务的完全缺失：没有收入、利润率、留存和现金数据，16.4
              亿美元估值无法与基本面调和，只能用规模主张和可比公司承销。在 NDA 下取得审计财务，是任何投资最重要的条件。
