              记录的第一笔机构轮融资是 2018 年后期风险投资——成立时间线存在真实冲突，尽调需要厘清。最清晰、有日期的里程碑是 2024 年以来的财务和产品事件：2024 年 6 月 1.31 亿美元融资、2026 年 5
