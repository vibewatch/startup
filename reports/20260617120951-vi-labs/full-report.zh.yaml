      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 有条件买入，取决于披露
            body: Vi 的数据加智能体平台、企业需求和投资人质量支持买入，但缺少经审计财务把置信度限制在中等。应推进确认性尽调，并以财务、留存和控制证据作为投资条款书前提，而不是按 $1.64B 标记照单全收。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV017
          - type: callout
            title: 如果规模成立，标记相对私有同业可辩护
            body: Vi 的 $1.64B 估值低于私有可比公司 Innovaccer 和 Komodo（约 $3B+），按规模看与该品类大体一致。这个比较支持合理性，但没有收入披露就无法确认。
            calloutType: insight
            claimRefs:
              - CV013
              - CV023
          - type: callout
            title: 披露缺口是决定性摇摆因素
            body: 在多头、基准和空头情景中，结果都取决于未披露的收入、利润率和留存能否验证估值所假设的规模。最限制信念的，不是市场或产品，而是这个单一缺口。
            calloutType: risk
            claimRefs:
              - CV010
              - CV015
              - CV025
