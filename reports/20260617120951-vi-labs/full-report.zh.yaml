  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Vi
              主要按垂直领域划分客户基础：医疗系统和服务提供方、制药与生命科学公司，以及健康管理和消费者健康企业。每个垂直领域内，买方和用户画像不同。在服务提供机构中，买方通常是人群健康、护理管理和临床运营负责人，护理团队是终端用户。在生命科学领域，买方是商业、医学事务和患者服务负责人，目标是识别并触达服务提供者和患者。在健康管理领域，买方是会员互动和增长负责人。地理上，Vi
              的足迹锚定在美国，这与 Data Web 声称约覆盖 96% 美国家庭一致；国际存在未公开记录。按规模看，16.4 亿美元估值和企业定价所暗示的客户是大型机构，而不是小型诊所；不过具名的 Minnesota
              心理健康客户显示，Vi 也服务中型专科提供方。用例覆盖患者识别与激活、治疗相关的提供者和患者互动、运营护理协同，以及分析。Vi 没有披露 100
              多家客户在这些分层中的分布、各自收入贡献或任何收入区间拆分，因此本节分层是定性的，来自 Vi 的定位和一个详细案例研究，而不是已披露的客户名册。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU020
