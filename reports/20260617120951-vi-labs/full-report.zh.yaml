  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Vi 的多头论点建立在本报告前文已经确立的五根相互强化支柱上。市场：医疗 AI 市场大且增长快——多家独立预测都把当前市场规模放在数百亿美元级别，并以每年 30-40% 复合增长——给 Vi
              留出很长跑道。产品：Vi 将大型专有 Data Web（超过 1.9 亿条去标识化记录、约覆盖 96% 美国家庭）与模块和 2026 年 AI 智能体层结合，形成一个横跨医疗服务方、药企和健康管理的“数据 +
              行动”平台。客户：100+ 企业客户、一个具名生产案例将护理规模扩大约五倍、以及宣称交付 $2B+
              可衡量价值，都显示真实需求。财务：企业订阅加高毛利数据授权，意味着有吸引力的模型；顶级投资人验证了融资渠道。竞争：垂直专业化和覆盖广度，使 Vi 同时区别于单垂直领域专家和横向 AI
              工具。反论点同样清晰。财务故事无法验证：没有收入、利润率、留存或现金披露。数据护城河面对 IQVIA 和 Komodo 尚未证明。AI
              智能体差异点，正是每个在位者都在竞相商品化的能力。监管和安全暴露（HIPAA、FDA AI/ML、FTC、泄露风险）影响大且证据弱。公司也很小（约 123 名员工），存在关键人依赖。投资问题在于：Vi
              真实的数据和分发资产，是否足以支撑 $1.64B 标记，尽管披露几乎完全缺失——公开证据能界定这个问题，但无法解决它。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV020
