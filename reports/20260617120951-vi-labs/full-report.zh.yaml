        blocks:
          - type: paragraph
            body: >-
              Vi 的成本结构只能推断，不能从披露中读取。作为 AI 与数据平台，它最大的成本很可能是工程和数据科学人才、数据获取与去标识化、在 1.9
              亿多条患者记录上运行模型的云基础设施，以及企业销售和客户成功组织。PitchBook 显示其约 123 名员工，相对上市既有厂商很小，暗示两种可能：收入 /
              人效率很高，或收入基数小于估值所暗示；没有披露无法区分二者。公开牵引方面，可验证事实仅限于非财务证明点：100 多家企业客户、1.9 亿多条去标识化记录、96% 美国家庭覆盖、支持 50 多种药物上市，以及 20
              亿美元以上可衡量价值主张。投资者通常依赖的财务牵引指标——收入、ARR、增长率、毛利率、开票额或活跃用户经济性——均未公开。强运营证明点与缺失财务披露之间的落差，是 Vi
              财务画像的定义性特征：叙事很有吸引力，但能验证叙事的数字不可得，估值只能落在规模主张和可比公司倍数上，而不是已观察到的财务表现上。
