      - number: '1.2'
        title: 领导层、创始人和治理
        blocks:
          - type: paragraph
            body: >-
              Vi 的创始人兼首席执行官是 Omri Yoffe。高管访谈和公司数据库都将 Vi 的搭建归功于他把人工智能和数据科学整合进医疗健康与生命科学结果。公司的起源叙事并不寻常：Vi
              称自己“诞生于航空航天”，灵感来自一次无声系统故障导致一位联合创始人的空军飞行员朋友身亡，并把自身技术称为“健康领域的神经雷达”，用于从噪声中浮现关键信号。除 CEO
              之外，公开页面还显示了一套职能型领导班子，包括产品负责人 Yiftach Meitar、客户绩效高级总监 Chelsea Pincus、医疗健康增长 VP Davis Miller，以及客户策略与激活负责人
              Laurén DiVenere；一篇合作伙伴访谈还提到一位名为 Spencer 的首席营收官。董事会构成、股权持有和正式治理安排均未披露，因此无法从公开来源完整验证公司对 Yoffe
              的关键人物依赖以及高管名册是否完整。领导层透明度不足，是公司概览证据基础中的反复主题，本报告将其保留为缺口。
