callouts:
- calloutType: risk
  title: Regulatory + Security Exposure Is High-Impact and Poorly Verified
  body: 'HIPAA, FDA AI/ML, and FTC health-privacy exposure combined with an unevidenced security and

    model-governance posture on a 190M-record dataset is Vi''s most consequential risk. A breach or

    enforcement action could trigger churn and valuation impairment.'
  claimRefs:
  - CR001
  - CR006
  - CR007
- calloutType: risk
  title: Data-Supply Dependency Is a Single Point of Failure
  body: 'Vi''s core asset depends on continued, compliant access to external data. Loss or curtailment
    of a key

    data-supply relationship — by contract, regulation, or a partner turning competitor — would erode
    the

    Data Web moat, yet no data contracts are disclosed.'
  claimRefs:
  - CR011
  - CR023
- calloutType: recommendation
  title: Condition Investment on Verifiable Controls
  body: 'Make audited financials, SOC 2/HITRUST attestations, model-validation documentation, data-supply
    and

    customer contracts, and litigation/incident history conditions of investment. Until satisfied, treat

    Vi''s risk profile as high-uncertainty with several high-impact, poorly verified exposures.'
  claimRefs:
  - CR016
  - CR019
  - CR030
