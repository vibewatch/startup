company:
  name: Vi Labs
chapter:
  number: 4
  title: Financial Profile
  summary: 'Vi is a late-stage private company that does not disclose revenue, ARR, gross margin, or cash
    position.

    What is verifiable is its capitalization: a $145 million primary-and-secondary transaction completed
    in

    May 2026 at a $1.64 billion valuation, preceded by a $131 million later-stage round in June 2024.
    The

    business monetizes through enterprise subscriptions, data licensing, and increasingly an AI-agent
    layer,

    with marketing claims of $2 billion-plus in measurable value and roughly 4x ROI for customers. Because
    no

    public financials exist, unit economics, margin path, and runway are estimated from public-company

    comparables and must be treated as unverified. Financial opacity is the central diligence blocker.'
sections:
- id: revenue-and-monetization
  title: Revenue Streams and Monetization
  body: 'Vi''s revenue model is enterprise software monetization layered on a proprietary data asset.
    The primary

    stream is multi-year platform subscriptions to its modules — Data Web, Activate, Engage, Operate,
    and

    Pulse — sold to health systems, pharmaceutical companies, and wellness enterprises. A second stream
    is

    data licensing and access to its de-identified Data Web, a high-margin asset class comparable to how

    IQVIA and Komodo Health monetize real-world data. A third, newer stream is the AI-agent suite launched

    in May 2026, which Vi positions as an execution layer that can be sold as expansion on top of existing

    deployments. Professional services and implementation likely contribute lower-margin revenue, as is

    typical for enterprise health-IT vendors. Vi markets outcome-oriented value — more than $2 billion
    in

    measurable value delivered and roughly 4x return on investment for customers — which implies some

    willingness to anchor pricing to outcomes, though there is no public evidence of formal outcomes-based

    contracts. Critically, Vi discloses none of the revenue mix, recognition policies, or contract terms

    that would let an investor verify revenue quality. The composition described here is inferred from
    the

    company''s product structure and sector norms, not from disclosed financial statements, and should
    be

    confirmed directly with management before underwriting.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI020
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-and-unit-economics
  title: GTM Motion and Unit Economics
  body: 'Vi sells through a direct enterprise motion to large healthcare, life-sciences, and wellness
    buyers,

    a model characterized by long, complex sales cycles, multi-stakeholder procurement, and security and

    compliance review. With more than 100 enterprise customers and a $1.64 billion valuation, implied

    average contract values are likely in the high-six- to seven-figure range, but Vi discloses neither

    average contract value, customer acquisition cost, payback period, nor net revenue retention. As a

    result, every unit-economics figure in this chapter is an estimate triangulated from public-company

    comparables: enterprise health-data SaaS peers such as Veeva operate at roughly 70-75% gross margins,

    while services-heavier analytics vendors such as Health Catalyst run lower. Vi''s blended gross margin
    is

    plausibly in the 55-70% range depending on the mix of high-margin data licensing versus lower-margin

    services, but this is unverified. Sales efficiency is similarly opaque; the only proxies are the

    company''s claimed ROI and value-delivered figures, which are marketing assertions rather than audited

    metrics. The absence of disclosed CAC, payback, and retention is the most important gap in assessing

    whether Vi''s growth is efficient or capital-intensive, and it materially limits confidence in the

    business''s underlying profitability and scalability.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI021
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003
- id: cost-structure-and-traction
  title: Cost Structure and Public Traction
  body: 'Vi''s cost structure is inferred rather than disclosed. As an AI-and-data platform, its largest
    costs

    are likely engineering and data-science talent, data acquisition and de-identification, cloud

    infrastructure to run models across 190 million-plus patient records, and an enterprise sales and

    customer-success organization. Its roughly 123-person headcount, per PitchBook, is small relative
    to

    public incumbents, suggesting either high revenue-per-employee efficiency or a smaller revenue base

    than the valuation implies — the two cannot be distinguished without disclosure. On public traction,

    the verifiable facts are limited to non-financial proof points: 100-plus enterprise customers, 190

    million-plus de-identified records, 96% US-household coverage, 50-plus drugs supported to market,
    and

    the $2 billion-plus measurable-value claim. None of the financial traction metrics an investor would

    normally rely on — revenue, ARR, growth rate, gross margin, billings, or active-user economics — are

    public. This gap between strong operational proof points and absent financial disclosure is the defining

    feature of Vi''s financial profile: the narrative is compelling, but the numbers that would confirm
    it

    are unavailable, leaving valuation to rest on scale claims and comparable-company multiples rather
    than

    on observed financial performance.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI022
  - CI023
  tableRefs:
  - TI005
  figureRefs:
  - FI004
- id: capital-adequacy-and-verdict
  title: Capital Adequacy and Financial Verdict
  body: 'Vi''s disclosed capitalization is its strongest financial signal. The company completed a $131
    million

    later-stage round in June 2024 and a $145 million primary-and-secondary transaction in May 2026 at
    a

    $1.64 billion valuation, backed by blue-chip investors including General Atlantic and Revelstoke

    Capital. Because the 2026 transaction included a secondary component providing liquidity to existing

    shareholders, not all $145 million flowed to the balance sheet, so the precise cash added is unclear.

    Vi discloses neither cash on hand, burn rate, nor runway, so capital adequacy cannot be quantified;

    however, raising at a stepped-up valuation from premier investors signals access to capital and reduces

    near-term financing risk. The financial verdict is mixed. Revenue quality is plausibly high given
    the

    data-licensing component, the margin path is likely healthy by sector norms, and capital intensity

    appears moderate, but none of this is verified. The decisive diligence blocker is the complete absence

    of audited financials: without revenue, margin, retention, and cash data, the $1.64 billion valuation

    cannot be reconciled to fundamentals and must be underwritten on scale claims and comparables. Obtaining

    audited financials under NDA is the single most important condition for any investment.'
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI024
  - CI025
