  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited financials
    missingEvidence: Vi discloses no revenue, ARR, gross margin, retention, or cash data.
    whyItMatters: The $1.64B valuation cannot be reconciled to fundamentals without audited financial
      statements.
    diligencePath: Request audited financials, revenue mix, and retention under NDA before underwriting.
    relatedQuestionRefs:
    - QI009
    - QI015
  - type: missing-source
    severity: material
    topic: unit economics
    missingEvidence: CAC, payback, NRR, and average contract value are undisclosed.
    whyItMatters: Sales efficiency and revenue durability cannot be assessed, leaving growth quality unknown.
    diligencePath: Obtain cohort retention and CAC/payback data from management.
    relatedQuestionRefs:
    - QI006
    - QI008
  - type: conflicting-data
    severity: minor
    topic: ROI and value claims
    missingEvidence: Vi's 4x ROI and $2B measurable-value claims are marketing assertions without independent
      verification.
    whyItMatters: Unverified ROI claims could overstate customer value and pricing power.
    diligencePath: Request customer references and methodology behind the value-delivered figure.
    relatedQuestionRefs:
    - QI012
  - type: missing-source
    severity: material
    topic: cash split of 2026 transaction
    missingEvidence: The primary-versus-secondary split of the $145M transaction is not disclosed.
    whyItMatters: It is unclear how much capital was added to the balance sheet versus paid to shareholders.
    diligencePath: Confirm primary/secondary split and resulting cash position with the company.
    relatedQuestionRefs:
    - QI014
    - QI016
    - QI004
