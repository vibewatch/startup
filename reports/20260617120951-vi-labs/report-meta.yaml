companyProfile:
  summary: "Vi Labs (vi.co) is a New York-based enterprise AI platform serving healthcare, life sciences, and wellness organizations. Founded in 2011, the company offers a suite of AI-powered modules—including Data Web, Activate, Engage, Operate, and Pulse—that help enterprises leverage patient data, engage populations, and drive measurable health outcomes. As of May 2026, Vi Labs completed a $145M primary-and-secondary transaction at a $1.64B valuation, backed by General Atlantic, Revelstoke Capital, and other growth investors. The platform spans 190M+ de-identified patient records covering roughly 96% of US households, serving 100+ enterprise customers and claiming $2B+ in measurable value delivered."
