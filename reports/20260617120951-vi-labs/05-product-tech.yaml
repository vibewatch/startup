  evidenceGaps:
  - type: missing-source
    severity: material
    topic: model validation and security audits
    missingEvidence: Vi does not publish SOC 2/HITRUST audits, model-validation methodologies, or breach
      history.
    whyItMatters: Without independent trust evidence, clinical safety and data security cannot be assured
      for an action-taking platform.
    diligencePath: Request security certifications, model-governance documentation, and incident history
      under NDA.
    relatedQuestionRefs:
    - QE016
    - QE017
  - type: missing-source
    severity: material
    topic: architecture and deployment detail
    missingEvidence: Vi's cloud provider, model stack, uptime, support model, and forward roadmap are
      not disclosed.
    whyItMatters: Deployment reliability and technical risk cannot be assessed without architecture and
      SLA detail.
    diligencePath: Obtain architecture documentation, SLAs, and roadmap in a technical diligence session.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE025
  - type: private-evidence-only
    severity: material
    topic: data defensibility
    missingEvidence: Vi's data asset cannot be benchmarked against IQVIA and Komodo from public evidence.
    whyItMatters: The durability of Vi's core data moat is the pivotal product question.
    diligencePath: Benchmark dataset scope, freshness, and linkage against incumbents under NDA.
    relatedQuestionRefs:
    - QE013
  - type: missing-source
    severity: minor
    topic: re-identification risk
    missingEvidence: Vi's de-identification methodology and re-identification-risk testing are not published.
    whyItMatters: Re-identification risk grows with dataset scale and linkage, raising privacy exposure.
    diligencePath: Review de-identification methodology and independent re-identification risk assessments.
    relatedQuestionRefs:
    - QE021
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: Every product, standards, and competitor source cited here was retrieved through this run's
    fetch-url trail; residual warnings reflect URL canonicalization, not uncited evidence.
- dimension: paywallRisk
  reason: Product evidence relies mainly on Vi's own accessible pages and public standards bodies; the
    few third-party sources are reputable and openly accessible.
