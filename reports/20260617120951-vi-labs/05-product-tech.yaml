company:
  name: Vi Labs
chapter:
  number: 5
  title: Product and Technology
  summary: 'Vi is a vertically specialized AI platform for healthcare, life sciences, and wellness, built
    on a

    proprietary data foundation (Data Web spanning 190 million-plus de-identified records and 96% US

    household coverage) and exposed through five modules — Activate, Engage, Operate, Pulse, and Data
    Web —

    plus a suite of AI agents launched in May 2026. The architecture layers data, machine-learning models,

    and an agentic execution layer over enterprise integrations into provider, pharma, and wellness

    workflows. Its differentiation rests on data breadth, vertical specialization, and an early agent
    layer;

    its principal technical risks are dependence on data-supply relationships, model trust and validation,

    and the security and privacy obligations inherent to handling protected health information at scale.'
sections:
- id: product-definition
  title: Product Definition and Module Map
  body: 'In customer-workflow terms, Vi is the intelligence-and-execution layer that sits between an

    enterprise''s systems of record and the decisions its teams need to make about patients, members,
    and

    markets. A health system uses Vi to identify and activate at-risk patients; a pharmaceutical company

    uses it to find and engage the right providers and patients for a therapy; a wellness enterprise uses

    it to personalize member engagement. These workflows are delivered through five named modules. Data
    Web

    is the data foundation — a de-identified dataset spanning more than 190 million patient records with

    roughly 96% US-household coverage. Activate drives population identification and patient activation.

    Engage powers digital and multi-channel engagement. Operate handles operational and care-coordination

    workflows. Pulse provides real-time analytics and insights. Layered on top is a suite of AI agents,

    launched in May 2026, that Vi describes as an execution layer automating next-best actions across
    these

    modules. The modules are sold as a connected platform rather than standalone tools, which is central
    to

    Vi''s positioning: the value comes from combining a large proprietary dataset with applications that
    act

    on it. Because most product detail comes from Vi''s own pages, technical depth and exact module

    boundaries should be confirmed in a product demonstration during diligence.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE020
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture
  title: Architecture and Operating Model
  body: 'Vi''s architecture can be read as a stack. At the base is the Data Web data layer: ingestion,

    de-identification, linkage, and storage of clinical, claims, and consumer signals across hundreds
    of

    millions of records. Above it sits a machine-learning and analytics layer that builds predictive and

    segmentation models on that data — the company''s heritage is described as applying signal-processing
    and

    "neural" techniques, reflecting roots its leadership frames as coming from aerospace and radar. On
    top

    of the model layer is the newer agentic execution layer: AI agents that translate model outputs into

    recommended or automated actions. The five modules are the application surface that exposes these

    capabilities to specific user personas, and an integration layer connects the platform to enterprise

    systems of record. Interoperability with electronic health records and adherence to healthcare data

    standards such as HL7 FHIR are effectively prerequisites for deployment in provider environments,
    and

    US interoperability policy under ONC/HealthIT.gov is steadily raising the baseline for data exchange.

    Operationally, Vi runs as a multi-tenant cloud platform serving 100-plus enterprise customers, which

    implies meaningful investment in data engineering, model operations, and cloud infrastructure. The

    public record does not disclose Vi''s specific cloud provider, model stack, or uptime metrics, so
    the

    architecture described here is reconstructed from the company''s product pages and sector norms rather

    than from technical documentation.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE021
  - CE022
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE003
- id: deployment-and-differentiation
  title: Deployment, Roadmap, and Differentiation
  body: 'Deploying Vi into an enterprise involves connecting the customer''s data and systems to the platform,

    configuring modules to the customer''s workflows, and validating model outputs against the customer''s

    population — a process that, like most enterprise health-IT, is integration-heavy and bounded by

    security and compliance review. Vi''s reliability, support model, and formal SLAs are not publicly

    documented, a gap for diligence. On roadmap, the clearest signal is the May 2026 launch of the AI-agent

    suite, which extends the platform from analytics-and-engagement toward autonomous execution and is
    the

    company''s primary stated direction; further roadmap detail is not public. Vi''s differentiation rests
    on

    four pillars. First, data: the scale and household coverage of Data Web is a genuine asset if it is

    differentiated against IQVIA''s and Komodo''s data. Second, vertical specialization: Vi''s agents
    and

    models are purpose-built for healthcare workflows rather than general-purpose. Third, breadth across

    provider, pharma, and wellness on one platform. Fourth, an early-mover position in agentic healthcare

    AI. The durability of these is uncertain: the data moat is unverified against incumbents, and the
    agent

    layer is the capability every competitor is racing to add, creating commoditization risk. The most

    important product-diligence questions are how defensible the data asset is and how rigorously the
    models

    and agents are validated for clinical safety.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE023
  - CE024
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-and-compliance
  title: Trust, Security, Privacy, and Compliance
  body: 'Because Vi processes protected health information at scale, trust, security, privacy, and compliance
    are

    core to the product, not peripheral. Vi''s central privacy mechanism is de-identification: it describes

    its Data Web as composed of de-identified patient records, which under US law (HIPAA) can be used
    and

    shared more freely than identifiable PHI provided de-identification is done to standard. Vi publishes
    a

    privacy policy governing its data practices. Operating in healthcare also subjects Vi to HIPAA''s

    security and privacy rules, evolving FDA thinking on AI/ML in healthcare, and FTC scrutiny of health

    data — areas covered in this report''s risk chapter. For the product, the key trust questions are
    the

    robustness of de-identification (re-identification risk rises as datasets grow and link more signals),

    the governance and validation of AI models and agents to prevent unsafe or biased recommendations,
    and

    the security controls protecting a high-value health dataset from breach. Vi''s public materials assert

    compliance and de-identification but do not publish independent audits (for example SOC 2 or HITRUST),

    model-validation methodologies, or breach history, so these must be verified directly. The combination

    of a large PHI-derived dataset and an action-taking agent layer raises the stakes: errors or breaches

    would carry regulatory, reputational, and clinical consequences, making demonstrable trust controls
    a

    gating condition for enterprise adoption and for investment.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE025
  - CE026
