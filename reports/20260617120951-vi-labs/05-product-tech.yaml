callouts:
- calloutType: strength
  title: Data-Plus-Action Platform Is a Coherent Product Thesis
  body: 'Vi pairs a large proprietary data foundation (Data Web) with modules and an agent layer that
    act on it.

    If the dataset is genuinely differentiated, the combination of breadth and execution is a strong,

    hard-to-copy product thesis across provider, pharma, and wellness workflows.'
  claimRefs:
  - CE001
  - CE005
  - CE011
- calloutType: risk
  title: Model Validation and De-Identification Are Unverified
  body: 'Vi asserts de-identification and compliance but publishes no independent audits, model-validation

    methods, or breach history. With an action-taking agent layer over PHI-derived data, unverified trust

    controls are a gating risk for enterprise adoption and investment.'
  claimRefs:
  - CE013
  - CE016
  - CE025
- calloutType: insight
  title: Agent Layer Is the Strategic Bet and the Commoditization Risk
  body: 'The May 2026 AI-agent suite is Vi''s primary stated direction and key differentiator, but it
    is also the

    capability every competitor is racing to add — making agent defensibility the pivotal product question.'
