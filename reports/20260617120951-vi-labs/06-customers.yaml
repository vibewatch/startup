company:
  name: Vi Labs
chapter:
  number: 6
  title: Customers and Traction
  summary: 'Vi reports more than 100 enterprise customers across health systems, pharmaceutical and life-sciences

    companies, and wellness organizations, and claims more than $2 billion in measurable value delivered
    and

    support for 50-plus drugs to market. Its strongest public proof point is a named customer story —
    a

    Minnesota mental-health provider that Vi says scaled care roughly fivefold. Beyond aggregate counts
    and

    a small set of testimonials, however, Vi discloses little verifiable customer evidence: no named logo

    list at scale, no churn, net-revenue-retention, or renewal data, and limited independent references.

    The result is a credible but thinly evidenced traction story whose concentration, durability, and

    reference quality cannot be confirmed from public sources and must be tested directly in diligence.'
sections:
- id: segmentation
  title: Customer Base and Segmentation
  body: 'Vi segments its customer base primarily by vertical: health systems and providers, pharmaceutical
    and

    life-sciences companies, and wellness and consumer-health enterprises. Within each vertical the buyer

    and user profiles differ. In provider organizations, buyers are typically population-health,

    care-management, and clinical-operations leaders, with care teams as end users. In life sciences,

    buyers are commercial, medical-affairs, and patient-services leaders seeking to identify and engage

    providers and patients. In wellness, buyers are member-engagement and growth leaders. Geographically,

    Vi''s footprint is anchored in the United States, consistent with a Data Web that claims roughly 96%
    US

    household coverage; international presence is not documented publicly. By size, the customers implied
    by

    a $1.64 billion valuation and enterprise pricing are large organizations rather than small clinics,

    though the named Minnesota mental-health customer shows Vi also serves mid-sized specialty providers.

    The use cases span patient identification and activation, provider and patient engagement for therapies,

    operational care coordination, and analytics. What Vi does not disclose is the distribution of its

    100-plus customers across these segments, the revenue contribution of each, or any revenue-band

    breakdown, so the segmentation described here is qualitative and drawn from Vi''s positioning and
    a

    single detailed case study rather than from a disclosed customer roster.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU020
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption and Deployment Trajectory
  body: 'The clearest quantitative traction signal Vi provides is its claim of more than 100 enterprise

    customers, combined with platform-scale metrics: a Data Web spanning 190 million-plus de-identified

    records, roughly 96% US-household coverage, support for 50-plus drugs brought to market, and more
    than

    $2 billion in measurable value delivered. These figures imply meaningful adoption depth, but Vi does
    not

    publish a time series showing how customer count, active usage, or deployments have grown, nor does
    it

    disclose utilization, repeat-purchase, or expansion rates. The company''s 2024 later-stage round and
    2026

    $145 million transaction at a stepped-up valuation are indirect evidence that investors saw continued

    commercial momentum, and the May 2026 AI-agent launch suggests an expansion motion into the existing

    base. The named Minnesota mental-health customer, which Vi says scaled care roughly fivefold, is the

    most concrete deployment proof and indicates the platform can drive large operational gains in a live

    production setting. Still, a single dated case study and aggregate counts are thin evidence of a

    durable, broad-based adoption trajectory. Without a customer-growth time series or cohort-level usage

    data, diligence cannot distinguish between a rapidly compounding base and a flatter one padded by

    early logos, making the adoption trajectory one of the most important things to verify directly with

    management and customer references.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU021
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof
  title: Named Customer Proof and Reference Quality
  body: 'Vi''s named-customer evidence is led by a detailed story about a Minnesota mental-health provider
    that

    Vi reports scaled its care delivery roughly fivefold using the platform — a production deployment
    with a

    specific, sizable outcome claim. Vi also markets aggregate proof points, including the 50-plus drugs

    supported to market and the $2 billion-plus measurable-value figure, and a partner case study cites

    roughly 4x customer ROI. The quality of this proof is mixed. The Minnesota story is a genuine,

    named, production reference with a concrete outcome, which is strong. But it is largely a single deep

    reference; Vi does not publish a broad logo wall, multiple independent named references, or third-party

    validated outcome studies, and the strongest numbers (value delivered, ROI) are company- or

    partner-sourced rather than independently audited. Evidence freshness is reasonable — the funding
    and

    agent-launch material is dated to 2026 and the case study is current — but the breadth and independence

    of references are limited. For an enterprise platform claiming 100-plus customers, the gap between
    the

    headline count and the small number of publicly verifiable, named, outcome-backed references is notable.

    Diligence should request a full customer list, multiple reference calls across verticals, and any

    third-party or peer-reviewed outcome evidence to corroborate the marketed value and ROI claims.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU022
  - CU023
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-and-concentration
  title: Retention, Expansion, and Concentration Risk
  body: 'Retention and durability are the weakest-evidenced parts of Vi''s customer profile. Vi discloses
    no net

    revenue retention, gross retention, churn, renewal rate, contract length, or cohort-survival data
    — the

    metrics that would show whether customers stay and expand. For an enterprise platform with multi-year

    contracts and an embedded data layer, switching costs are plausibly high once deployed, which would

    support retention, and the 2026 AI-agent launch provides a natural expansion lever into the installed

    base via land-and-expand. But none of this is quantified publicly. Concentration risk is similarly

    opaque: Vi does not disclose customer concentration, so it is unknown whether a handful of large

    accounts drive a disproportionate share of revenue, which would be a material risk. Channel and partner

    dependence are also undocumented, though the direct-enterprise motion implies limited channel reliance.

    Procurement friction is a structural headwind — long, security- and compliance-heavy enterprise sales

    cycles in healthcare slow both new bookings and expansion. The net picture is that Vi''s retention
    and

    concentration profile is a near-total disclosure gap layered on a plausibly sticky product. Because

    customer durability and concentration are central to underwriting recurring revenue quality, obtaining

    cohort retention, NRR, and top-customer concentration data is among the highest-priority diligence

    asks, and the absence of any adverse churn evidence should not be mistaken for confirmation of low
    churn.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU024
  - CU025
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
