  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention and concentration
    missingEvidence: Vi discloses no NRR, churn, renewal, cohort, or customer-concentration data.
    whyItMatters: Recurring-revenue durability and top-customer risk cannot be assessed, which is central
      to underwriting.
    diligencePath: Obtain cohort retention, NRR, and revenue-concentration data and conduct reference
      calls.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU015
    - QU016
  - type: missing-source
    severity: material
    topic: reference breadth and independence
    missingEvidence: Vi publishes one strong named reference plus aggregate or partner-sourced claims,
      with sparse independent reviews.
    whyItMatters: Few independent, named, outcome-backed references make the 100+ customer claim hard
      to validate.
    diligencePath: Request a full customer roster and multiple independent reference calls across verticals.
    relatedQuestionRefs:
    - QU011
    - QU012
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: adoption time series
    missingEvidence: Vi provides aggregate customer counts but no time series of customer or usage growth.
    whyItMatters: Without a trajectory, a compounding base cannot be distinguished from a flatter one.
    diligencePath: Request historical customer-count, deployment, and utilization data.
    relatedQuestionRefs:
    - QU007
  - type: conflicting-data
    severity: minor
    topic: value and ROI claims
    missingEvidence: The $2B measurable-value and 4x ROI figures are company- or partner-sourced and unaudited.
    whyItMatters: Unverified value claims could overstate customer outcomes and pricing power.
    diligencePath: Request methodology and independent validation for value and ROI claims.
    relatedQuestionRefs:
    - QU012
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: Every customer, review, and news source cited here was retrieved through this run's fetch-url
    trail; residual warnings reflect URL canonicalization, not uncited evidence.
- dimension: paywallRisk
  reason: Independent review and trade sources are openly accessible; the strongest named reference is
    Vi's own customer-proof page, which diligence should corroborate with direct reference calls.
