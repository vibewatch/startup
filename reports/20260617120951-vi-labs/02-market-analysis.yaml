company:
  name: Vi Labs
chapter:
  number: 2
  title: Market Analysis
  summary: 'Vi competes in the AI-in-healthcare and life-sciences market, which independent analysts size
    at roughly

    $37-40 billion in 2025 and project to grow at a 35-44% CAGR toward several hundred billion dollars
    by the

    early-2030s. Within that broad TAM, Vi''s serviceable market is the narrower enterprise layer of

    healthcare/life-sciences data platforms, patient engagement, and drug-commercialization analytics
    bought

    by health systems, pharma, and wellness enterprises. Demand is driven by value-based care, AI adoption,

    and interoperability mandates, while data-privacy regulation, long sales cycles, and AI-hype skepticism

    constrain near-term adoption. Estimates vary widely, so sizing is preserved as a range, not a point.'
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: 'Vi sits inside the artificial-intelligence-in-healthcare market but is best understood through
    a

    narrower boundary: enterprise AI and data platforms that serve healthcare providers, life-sciences
    and

    pharmaceutical companies, and wellness organizations. Included spend covers healthcare data platforms

    and analytics, patient engagement and activation software, population-health and care-navigation tools,

    and pharma commercialization and clinical-trial analytics. Excluded from Vi''s core boundary are

    clinical-grade diagnostic AI and medical-imaging devices, robot-assisted surgery, electronic health

    record systems of record, and consumer wellness apps sold direct to individuals, even though some
    of

    these are counted in the broadest AI-in-healthcare market totals. The status-quo substitutes Vi displaces

    are in-house data-science teams, point solutions stitched together by systems integrators, legacy

    analytics suites, and manual care-management and commercialization workflows. Vi positions itself
    as a

    horizontal "AI execution layer" that orchestrates these functions on top of existing systems of record,

    which both widens its addressable footprint and exposes it to competition from incumbents in each

    adjacent category. Defining this boundary before sizing is essential because headline AI-in-healthcare

    totals overstate the spend Vi can realistically capture.'
  claimRefs:
  - CM001
  - CM010
  - CM011
  - CM012
  - CM013
  - CM030
  tableRefs:
  - TM001
- id: market-sizing
  title: Market Sizing Across Multiple Lenses
  body: 'Independent market researchers disagree materially on the size and growth of AI in healthcare,
    which is

    why this report preserves a range rather than a single figure. Grand View Research estimates the global

    AI-in-healthcare market at $36.67 billion in 2025, growing at a 38.9% CAGR to $505.59 billion by 2033.

    Precedence Research puts 2025 revenue at $36.96 billion and projects $744.34 billion by 2035 at a
    35.0%

    CAGR. Mordor Intelligence sizes 2025 at $40.14 billion and forecasts $251.36 billion by 2031 at a
    36.2%

    CAGR, while Fortune Business Insights is the most aggressive, projecting growth from $39.34 billion
    in

    2025 to $1.03 trillion by 2034 at a 44.0% CAGR. North America consistently accounts for the largest

    share — roughly 44-54% — and software is the dominant component at roughly 46% of spend. Applying
    a

    top-down haircut to isolate the enterprise healthcare/life-sciences data-platform layer that Vi actually

    sells into yields a serviceable market on the order of $8-18 billion in 2026, of which Vi''s realistically

    obtainable share is a low-single-digit-billion SOM. These constrained estimates are derived, not

    source-stated, and are flagged as such.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
