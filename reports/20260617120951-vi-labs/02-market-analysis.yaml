- id: buyers-and-adoption
  title: Buyers, Users, Payers, and Adoption Path
  body: 'Vi sells to three distinct enterprise buyer types, each with a different budget owner and adoption

    trigger. Health systems and provider organizations buy population-health, patient-engagement, and

    care-navigation capabilities, typically sponsored by a chief medical, digital, or operating officer
    and

    justified by value-based-care economics and operational efficiency. Pharmaceutical and life-sciences

    companies buy drug-commercialization, patient-finding, and clinical-trial-acceleration analytics,
    with

    budget owned by commercial and medical-affairs leaders and triggered by launch ROI and trial timelines.

    Wellness and payer-adjacent enterprises buy member engagement and lifetime-value optimization. The
    user

    is usually an analyst, care manager, or commercial operator, while the economic payer is the enterprise

    itself rather than an individual patient. The adoption path runs from data integration through pilot,

    proof of ROI, departmental deployment, and finally enterprise standardization — a multi-quarter cycle

    gated by data-governance, security, and procurement reviews. Long enterprise sales cycles and the
    need to

    connect to existing systems of record are the principal friction points, and they materially affect
    how

    quickly Vi can convert its large addressable market into recognized revenue.'
  claimRefs:
  - CM010
  - CM012
  - CM014
  - CM015
  - CM016
  - CM017
  - CM033
