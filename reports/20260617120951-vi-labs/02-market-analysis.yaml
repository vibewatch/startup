  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing dispersion
    missingEvidence: AI-in-healthcare forecasts diverge by more than 4x by the early-2030s and use different
      scopes.
    whyItMatters: Vi's valuation case depends heavily on which sizing lens is adopted.
    diligencePath: Reconcile scope definitions and obtain a bottom-up SAM from comparable enterprise platform
      peers.
    relatedQuestionRefs:
    - QM021
    - QM023
  - type: enumeration-incomplete
    severity: material
    topic: serviceable market (SOM) estimation
    missingEvidence: Vi's SAM/SOM are derived top-down and not corroborated by a bottom-up build or company
      pipeline data.
    whyItMatters: Without a bottom-up SOM, revenue potential and valuation cannot be tied to a defensible
      reachable market.
    diligencePath: Request Vi's pipeline, ACV, and win-rate data to build a bottom-up SOM under NDA.
    relatedQuestionRefs:
    - QM007
  - type: missing-source
    severity: minor
    topic: buyer budget thresholds
    missingEvidence: Specific budget sizes and approval thresholds for healthcare AI platform purchases
      are not public.
    whyItMatters: Budget ownership affects deal size and sales-cycle length, which drive revenue modeling.
    diligencePath: Interview buyers and obtain anonymized deal economics during diligence.
    relatedQuestionRefs:
    - QM009
  - type: stale
    severity: minor
    topic: market estimate freshness
    missingEvidence: Some cited market reports are updated periodically and may lag the latest funding
      cycle.
    whyItMatters: Outdated estimates could misstate current growth rates.
    diligencePath: Refresh estimates against the most recent analyst updates at diligence time.
    relatedQuestionRefs:
    - QM022
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: Every cited URL was retrieved through this run's fetch-url trail; residual unverifiedSource
    warnings reflect query-string canonicalization on database pages, not uncited evidence.
- dimension: paywallRisk
  reason: A minority of market-data sources (Statista, Rock Health, Becker's) are js-only or broken; their
    headline figures are corroborated by accessible analyst reports and do not change conclusions.
