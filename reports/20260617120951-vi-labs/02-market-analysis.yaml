callouts:
- calloutType: strength
  title: Large, Fast-Growing, Software-Heavy Market
  body: 'Every major analyst sizes AI in healthcare at roughly $37-40 billion in 2025 with 35-44% CAGRs
    and a

    software-dominated mix, giving Vi a large and expanding TAM with structural tailwinds from value-based

    care and interoperability.'
  claimRefs:
  - CM001
  - CM003
  - CM018
  - CM019
- calloutType: risk
  title: Sizing Dispersion and Adoption Friction
  body: 'Published forecasts diverge by more than 4x by the early-2030s, and Vi''s realistic SAM/SOM is
    a small

    fraction of headline TAM after excluding diagnostics, imaging, and EHRs. Long sales cycles, HIPAA

    compliance, AI-regulatory uncertainty, and hype skepticism all slow conversion of the addressable
    market

    into recognized revenue.'
  claimRefs:
  - CM004
  - CM005
  - CM021
  - CM022
  - CM024
- calloutType: insight
  title: Boundary Discipline Changes the Investment Case
  body: 'Whether Vi is a multi-hundred-billion-dollar opportunity or a low-single-digit-billion one depends

    entirely on how the market is bounded. Treating the enterprise data-platform layer — not the entire

    AI-in-healthcare total — as the serviceable market is the more defensible lens for underwriting Vi''s

    $1.64 billion valuation.'
  claimRefs:
  - CM031
  - CM032
