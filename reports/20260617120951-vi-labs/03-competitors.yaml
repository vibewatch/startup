callouts:
- calloutType: strength
  title: Cross-Vertical Breadth Is Genuinely Differentiated
  body: 'Vi''s combination of provider, pharma, and wellness use cases on one data-and-agent platform
    is rare;

    most rivals are deep in a single vertical. If Vi can prove depth in each, its breadth becomes a durable

    wedge against single-vertical specialists and generic horizontal AI tools.'
  claimRefs:
  - CP013
  - CP031
  - CP030
- calloutType: risk
  title: Incumbents Are Larger, Entrenched, and Adding Agents
  body: 'Veeva and IQVIA hold deep pharma distribution and disclosed multi-billion-dollar scale, while
    Innovaccer,

    Arcadia, and Health Catalyst lock in providers. Each is racing to add AI agents Vi markets as a

    differentiator, creating commoditization and bundling risk that could compress Vi''s pricing and slow

    enterprise standardization.'
  claimRefs:
  - CP014
  - CP015
  - CP024
  - CP034
- calloutType: risk
  title: Undisclosed Scale Prevents Like-for-Like Comparison
  body: 'Because Vi does not disclose revenue or customer counts while most peers do, diligence cannot
    benchmark

    Vi''s competitive position with confidence. Verifying Vi''s scale against IQVIA''s and Komodo''s data
    assets

    is the single most important competitive question to resolve.'
  claimRefs:
  - CP025
  - CP033
