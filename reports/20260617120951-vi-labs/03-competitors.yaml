  evidenceGaps:
  - type: missing-source
    severity: material
    topic: competitive scale benchmarking
    missingEvidence: Vi does not disclose revenue or customer counts, so it cannot be benchmarked against
      peers that do.
    whyItMatters: Competitive position and the durability of Vi's data moat cannot be sized without comparable
      scale data.
    diligencePath: Obtain Vi's revenue, customers, and dataset metrics under NDA and benchmark against
      IQVIA and Komodo.
    relatedQuestionRefs:
    - QP018
  - type: missing-source
    severity: material
    topic: AI-agent defensibility
    missingEvidence: There is no public evidence on how defensible Vi's AI agents are versus incumbents'
      and horizontal AI providers'.
    whyItMatters: Commoditization of the agent layer would erode Vi's headline differentiator and pricing
      power.
    diligencePath: Assess agent architecture, data dependencies, and switching costs in a technical diligence
      session.
    relatedQuestionRefs:
    - QP016
  - type: missing-source
    severity: minor
    topic: partner and analyst ratings
    missingEvidence: Vi's standing in independent vendor ratings (e.g., KLAS) and partner ecosystems is
      not established publicly.
    whyItMatters: Independent ratings and partner access influence enterprise buying decisions.
    diligencePath: Request analyst evaluations and partner agreements during diligence.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: stale
    severity: minor
    topic: competitive intelligence freshness
    missingEvidence: Competitor scale figures rely on periodically updated public filings and databases.
    whyItMatters: Stale competitor data could misstate the relative gap to Vi.
    diligencePath: Refresh competitor financials against latest filings at diligence time.
    relatedQuestionRefs:
    - QP023
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: Every cited competitor and analyst URL was retrieved through this run's fetch-url trail; residual
    warnings reflect canonicalization of vendor query strings, not uncited evidence.
- dimension: paywallRisk
  reason: A minority of sources (CB Insights, Becker's) are js-only or broken; competitor positioning
    is corroborated by accessible official vendor sites and trade press.
