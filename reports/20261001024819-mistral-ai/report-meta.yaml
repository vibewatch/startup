companyProfile:
  summary: >-
    Mistral AI is a Paris-headquartered frontier AI company founded in April 2023 by former Meta and Google DeepMind
    researchers Arthur Mensch, Guillaume Lample, and Timothée Lacroix. It sells open-weight models, hosted APIs, Vibe
    productivity tooling, sovereign enterprise deployments, model customization, and dedicated infrastructure to
    regulated and industrial customers that want local control over data, weights, and compute. The company closed a €3
    billion Series D in September 2026 at a post-money valuation above €21 billion, extending a capital-heavy path that
    still leaves audited financials, retention, and cash generation undisclosed.
