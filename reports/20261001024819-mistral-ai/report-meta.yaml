  topStrengths:
    - Strong sovereign AI positioning in Europe with local-control deployment options.
    - Broad monetization surface spanning APIs, seats, private deployments, customization, and infrastructure.
    - Rapid enterprise adoption and strategic industrial backing from Samsung, ASML, and other partners.
  topRisks:
    - Audited revenue, margin, retention, and cash-flow disclosures remain unavailable.
    - Capital intensity and debt/compute commitments could pressure flexibility if growth slows.
    - Hyperscaler and frontier-model competition remains structurally asymmetric.
    - Regulatory and copyright exposure stay material for open-weight model distribution.
  unresolvedGaps:
    - Audited FY2024 and FY2025 revenue, gross margin, and customer cohort retention remain undisclosed.
    - Cash balance, burn rate, compute commitments, and debt covenant terms are still unavailable.
    - Top-customer concentration and paid-versus-pilot split across the 125+ enterprise accounts are not public.
    - EU AI Act compliance cost and copyright liability trajectory remain uncertain.
    - >-
      A management-certified bridge reconciling the $183.2 million, $400 million, and $1 billion revenue/ARR labels is
      still missing.
