summary:
  headline: >-
    Mistral AI remains Europe's leading sovereign frontier AI lab, but the new €3 billion Series D and ~$400 million ARR
    run-rate still leave a high-risk, track-worthy underwriting case until audited margins, retention, and cash
    generation are disclosed.
