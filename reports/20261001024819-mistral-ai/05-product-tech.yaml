callouts:
  - calloutType: "strength"
    title: "Granular Mixture of Experts Architecture Drives Compute Efficiency"
    body: "Mistral's deployment of granular MoE in Mistral Large 3 activates only 41 billion of its 675 billion parameters per token. Paired with Sliding Window Attention and rolling buffer KV caching, this architecture delivers frontier-level multilingual and reasoning performance while dramatically reducing memory requirements and hardware operational expenditure relative to monolithic dense models."
    claimRefs:
      - "CE003"
      - "CE004"
  - calloutType: "risk"
    title: "Infrastructure Capital Intensity and Self-Hosted Operational Burden"
    body: "While self-hosted and sovereign European deployments provide enterprise data residency and regulatory compliance, they place substantial operational demands on internal engineering teams for GPU optimization and cluster management. Simultaneously, Mistral's ambition to build 1 GW of sovereign European compute requires billions in capital expenditure, exposing the business to datacenter power constraints and hardware availability risks."
    claimRefs:
      - "CE006"
      - "CE009"
      - "CE011"
      - "CE013"
