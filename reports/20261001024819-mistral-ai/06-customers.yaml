figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Enterprise customer adoption lifecycle progressing from open-weight evaluation to embedded production and sovereign
    infrastructure co-development.
  data:
    items:
    - label: 1. Open-Weight Discovery
      segment: Developer & Data Science
      detail: Engineers and researchers download open-weight models (Mistral 7B, Ministral, Codestral) via Hugging Face and
        GitHub for localized prototyping.
      touchpoints:
      - Hugging Face model repository
      - Local experimentation on commodity GPUs
      - Open-source community documentation and API forums
    - label: 2. Managed API Evaluation
      segment: Product Engineering & Mid-Market
      detail: Teams transition successful prototypes to La Plateforme managed API endpoints or cloud marketplace integrations
        (Azure, AWS, GCP, Snowflake).
      touchpoints:
      - La Plateforme developer console
      - Cloud marketplace billing and cloud credit drawdowns
      - Serverless inference benchmarking and model evaluation
    - label: 3. Workplace Assistant Adoption
      segment: Knowledge Workers & Teams
      detail: Enterprises roll out Vibe Chat, Vibe Work, and Vibe Code to knowledge workers with centralized administrative
        controls and privacy boundaries.
      touchpoints:
      - SAML Single Sign-On and domain verification
      - Enterprise productivity connectors (Google Workspace, Slack)
      - Per-seat team subscriptions ($24.99/user/month)
    - label: 4. Hybrid & Self-Hosted Pilot
      segment: Regulated Enterprise IT
      detail: Regulated organizations deploy customized models within private corporate clouds, edge environments, or on-premises
        servers without data leakage.
      touchpoints:
      - Koyeb-orchestrated serverless GPU environments
      - Strategic workshops with AI Deployment Strategists
      - Strict GDPR compliance and data sovereignty audits
    - label: 5. Production Workflow Embedding
      segment: Core Enterprise Operations
      detail: Deep integration of frontier models into mission-critical workflows such as Snowflake Cortex Analyst, ERP systems,
        or factory floor anomaly detection.
      touchpoints:
      - Custom domain adaptation and fine-tuning
      - Joint customer case studies and partner co-marketing
      - Enterprise service-level agreements and support
    - label: 6. Sovereign Strategic Partnership
      segment: Industrial Champions & Public Sector
      detail: Multi-year capital and operational partnerships involving dedicated GPU clusters, physical AI neural simulation,
        and sovereign compute infrastructure.
      touchpoints:
      - Multi-year capital commitments (€100M+ scale)
      - Co-engineered proprietary models (BOM tools, physics surrogates)
      - Dedicated European datacenter capacity allocation
  approximationNotes: Adoption sequence synthesized from published go-to-market job specifications, customer case studies,
    and enterprise deployment options.
