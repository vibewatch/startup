callouts:
- calloutType: insight
  title: Sovereignty-Driven Enterprise Moat in European Industrial Base
  body: Mistral AI's deliberate positioning as an independent European AI champion has enabled it to capture strategic accounts
    that foreign hyperscalers struggle to penetrate. By providing on-premises deployments, open-weight transparency, and sovereign
    cloud infrastructure, Mistral appeals directly to European industrial champions and defense organizations bound by stringent
    data sovereignty and regulatory mandates.
  claimRefs:
  - CU001
  - CU005
  - CU006
  - CU014
- calloutType: risk
  title: Retention Transparency and Top-Customer Concentration Gaps
  body: Despite rapid ARR expansion toward $400 million and over 125 corporate accounts, Mistral provides no audited cohort
    retention metrics or customer concentration figures. High reliance on large strategic partnerships (such as CMA CGM and
    Snowflake) creates potential revenue vulnerability if key deployment agreements fail to expand or experience contract
    restructuring.
  claimRefs:
  - CU002
  - CU007
  - CU011
  - CU012
