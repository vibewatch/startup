callouts:
  - calloutType: "risk"
    title: "Do not underwrite the $1 billion figure as audited revenue"
    body: "The retained evidence characterizes roughly $1 billion as ARR, with conflicting timing, while separate publishers label much lower values as revenue. The company must reconcile metric definition, contract start dates, fiscal period, and recognition policy before the figure can anchor valuation."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI016"
  - calloutType: "recommendation"
    title: "Gate the next decision on a financial data room"
    body: "Require audited statements, a revenue-to-ARR bridge, product-level gross margin, retention cohorts, concentration, sales-efficiency data, cash and burn, capex commitments, and complete debt terms. Financing size alone does not close any of those underwriting questions."
    claimRefs:
      - "CI009"
      - "CI012"
      - "CI014"
      - "CI015"
