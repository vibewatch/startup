company:
  name: "Mistral AI"
chapter:
  number: 4
  title: "Financials"
  summary: "Mistral has multiple monetization surfaces and announced €3 billion of new equity, but the public financial record does not support a conventional underwriting model. Third-party figures variously describe $183.2 million of estimated annual revenue, $400 million of revenue, and roughly $1 billion of projected or already-achieved ARR; audited revenue, gross margin, retention, burn, cash, runway, and debt terms remain unavailable."
sections:
  - id: "monetization-and-list-pricing"
    title: "Monetization spans usage, seats, private deployment, and services"
    body: >-
      Mistral's own product surface supports a diversified revenue architecture rather than a single
      API business: customers can consume hosted services in Mistral Cloud, deploy in their own
      environments, buy through cloud providers, train or customize models, and engage deployment
      services. A secondary September 2026 catalog adds seat subscriptions and metered API prices,
      including Vibe Pro at $14.99 per month, Vibe Team at $24.99 per user per month, Small 4 at
      $0.15 per million input tokens and $0.60 per million output tokens, and Medium 3.5 at $1.50
      and $7.50 on the same units. Those are list prices, not realized revenue: the same source says
      batch processing and cached input can reduce billed rates. Enterprise, private-deployment,
      customization, infrastructure, and support pricing remains custom or undisclosed, so neither
      revenue mix nor contract quality can be inferred from the catalog.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-revenue-quality"
    title: "Public traction figures are not comparable financial statements"
    body: >-
      The available top-line figures use different labels, periods, and evidence standards. Latka
      reports $400 million of 2026 "revenue" and attributes the number to another publisher, while
      CompWorth estimates $183.2 million annually. A separate analysis reports Reuters projecting
      roughly $1 billion of ARR by year-end 2026 and correctly notes that ARR is a run-rate measure,
      not audited annual revenue. Tech Insider introduces a further conflict: it describes the
      $1 billion figure both as a CFO expectation and, through separate reporting, as already
      exceeded. Mistral's announcement of more than 125 enterprises across 20 countries establishes
      commercial breadth but gives no contract values, paid-versus-pilot split, concentration, or
      retention. These data cannot be combined into a growth rate or revenue bridge without
      management definitions and period-matched records.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI013"
      - "CI014"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-and-financing-dependency"
    title: "New capital expands capacity but does not establish runway"
    body: >-
      Mistral announced a €3 billion Series D at a post-money valuation above €21 billion. The
      company says the proceeds will expand frontier research, training compute, infrastructure,
      commercial growth, and international operations, which identifies both growth priorities and
      continuing capital intensity. Tracxn separately reports $6.54 billion of total funding across
      nine rounds and an $830 million conventional-debt event dated March 30, 2026. These figures
      are not cash-on-hand disclosures: they mix currencies and financing types, do not show
      transaction costs or prior spending, and provide no debt rate, maturity, covenant, collateral,
      drawdown, or repayment schedule. The financing therefore increases apparent funding capacity
      but cannot support a runway calculation or a conclusion that future capital will not be needed.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI014"
      - "CI015"
  - id: "underwriting-verdict"
    title: "Financial verdict: credible monetization surface, insufficient unit economics"
    body: >-
      The investable positive is breadth: Mistral can monetize usage, seats, customization,
      deployment control, infrastructure, and expert services, while a large financing supplies
      resources for expansion. The underwriting constraint is evidence quality. No retained source
      provides audited statements, recognized revenue by period, gross margin, inference and
      service-delivery cost, CAC or payback, NRR, customer concentration, working capital, capex,
      cash balance, burn, runway, or debt terms. An independent review explicitly cautions that
      funding and valuation demonstrate investor demand and capital capacity, not sustainable
      economics. The next decision gate should therefore be a management data room that reconciles
      revenue and ARR, separates recurring software and usage from services, and connects contract
      economics to compute and support costs before any valuation multiple or capital-adequacy
      conclusion is accepted.
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI008"
      - "CI012"
      - "CI014"
      - "CI015"
      - "CI016"
