evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-audits
    missingEvidence: >-
      Audited FY2024-FY2025 financial statements, GAAP/IFRS revenue breakdown between model licensing and API usage, and
      exact gross margins.
    whyItMatters: >-
      Reported ARR figures ($400M run-rate toward $1B) derive from media leaks and management expectations rather than
      statutory audit reports.
    diligencePath: >-
      Review French commercial registry (Infogreffe) filings for Mistral AI SAS or request confidential financial review
      during Series D diligence.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: leadership-and-founder-governance
    missingEvidence: >-
      Full board of directors roster, independent governance committee members, and complete functional VP leadership
      appointments beyond the co-founders and CFO.
    whyItMatters: >-
      Concentrated founder governance and undisclosed executive succession plans heighten key-person dependency risks
      across core scientific and infrastructure operations.
    diligencePath: >-
      Inspect official French corporate registry filings (Kbis and Statuts) for Mistral AI SAS to identify formal board
      appointments and statutory officers.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: cap-table
    missingEvidence: >-
      Fully diluted capitalization table detailing founder equity stakes, liquidation preference seniority, and
      Samsung's exact Series D check size.
    whyItMatters: >-
      Prevents independent determination of voting control, founder dilution, and downside liquidation preferences
      across Series A through Series D.
    diligencePath: Inspect shareholder agreement covenants and board composition filings in French corporate registry.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: audited-market-share-and-segment-arr
    missingEvidence: >-
      Audited breakdown of Mistral AI's ARR by customer segment, separating sovereign public sector, industrial
      engineering, and developer API consumption.
    whyItMatters: >-
      Without segmented financial disclosures, the true proportion of recurring enterprise contract revenue cannot be
      verified against broad TAM projections.
    diligencePath: >-
      Request audited customer segment revenue and Net Revenue Retention (NRR) disclosures during prospective Series E
      management diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-retention
    missingEvidence: >-
      Audited net revenue retention (NRR) and multi-year contract renewal rates comparing Mistral enterprise API
      customers against OpenAI Enterprise.
    whyItMatters: >-
      Determines whether Mistral's pricing and sovereign data advantages translate into durable account retention or if
      enterprises multi-home across providers.
    diligencePath: Request customer cohort renewal data, ACV breakdowns, and churn metrics under NDA during commercial diligence.
    relatedQuestionRefs:
      - QP002
  - id: GP001
    type: missing-source
    severity: minor
    topic: forge-production-accuracy
    missingEvidence: >-
      Direct third-party head-to-head accuracy and domain evaluation benchmarks between Mistral Forge custom models and
      OpenAI fine-tuning.
    whyItMatters: >-
      Validates whether custom pre-training on proprietary data delivers statistically significant domain ROI over
      fine-tuning or advanced RAG.
    diligencePath: >-
      Review technical whitepapers and comparative pilot evaluations from early enterprise adopters such as ASML and
      Ericsson.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Segmented sales cycle, CAC, CAC payback, partner economics, pipeline conversion, and bookings data.
    whyItMatters: The enterprise footprint does not reveal the cost or time required to acquire recurring revenue.
    diligencePath: >-
      Request quarterly funnel, sales expense, commissions, partner fees, bookings, and new-ARR schedules by customer
      segment.
    relatedQuestionRefs:
      - QI003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      A management-certified reconciliation of the $183.2 million and $400 million revenue labels with the roughly $1
      billion ARR reports.
    whyItMatters: >-
      The figures use different metrics and may use different periods, so they cannot establish growth or valuation
      multiples.
    diligencePath: >-
      Obtain audited monthly recognized revenue and a contract-level ARR bridge with definitions, currencies, start
      dates, and exclusions.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin and cost-of-delivery schedules for hosted APIs, private deployment, customization, infrastructure,
      and services.
    whyItMatters: >-
      List prices cannot establish contribution margin without compute, infrastructure, implementation, and support
      costs.
    diligencePath: >-
      Request product-level recognized revenue, compute consumption, depreciation, support labor, service costs, and
      gross-margin reconciliation.
    relatedQuestionRefs:
