      - number: '6.2'
        title: Commercial Adoption and Scale Trajectory
        blocks:
          - type: paragraph
            body: >-
              Commercial momentum has scaled rapidly since Mistral began enterprise monetization in late 2023. From
              approximately $10 million in initial revenue, annualized recurring revenue expanded to an estimated $400
              million by early 2026, representing one of the fastest growth trajectories in European enterprise
              technology. The company reports more than 125 corporate enterprise customers across 20 countries, driven
              by the conversion of open-weight developer pilots into paid commercial licenses and dedicated enterprise
              contracts. Developer engagement acts as an efficient top-of-funnel customer acquisition engine, previously
              demonstrated when consumer platform Le Chat reached one million downloads within two weeks of launch
              before evolving into the Vibe workplace productivity ecosystem. While top-line expansion appears steep,
              historical financial disclosures remain privately held and audited revenue figures are unverified.
            claimRefs:
