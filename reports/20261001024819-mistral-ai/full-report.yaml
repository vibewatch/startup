        title: Expansion Dynamics, Retention, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Mistral executes a multi-tiered land-and-expand motion bridging bottom-up developer experimentation with
              high-touch executive transformation. Field organizations deploy specialized AI Deployment Strategists who
              embed within strategic client accounts to co-create multi-year transformation roadmaps across both
              presales and operational rollout phases. Commercial expansion transitions accounts from per-token API
              consumption and team productivity seats ($24.99 per user monthly) into custom sovereign infrastructure
              deployments and multi-million-euro co-development partnerships. However, key durability risks remain
              unresolved: audited net revenue retention, gross churn rates, and revenue concentration among top-five
              accounts are undisclosed. Additionally, while independent security tracking confirms zero data breaches in
