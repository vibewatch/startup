              - CO012
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Mistral's executive leadership remains tightly anchored around its three co-founders: CEO Arthur Mensch,
              Chief Science Officer Guillaume Lample, and CTO Timothée Lacroix. The trio commands critical strategic and
              technical authority, creating an acute key-person dependency common to frontier research labs where
              foundational architectures and research talent retention dictate capability parity. Corporate governance
              has expanded through strategic minority equity stakes; Dutch semiconductor lithography leader ASML became
              Mistral's largest shareholder at approximately 11% fully diluted following its €1.3 billion lead
              commitment in the €1.7 billion Series C in September 2025, taking an advisory seat on Mistral's strategic
              committee. The cap table further diversified in September 2026 with industrial conglomerate Samsung
              Electronics leading the Series D alongside European institutional investors, while Microsoft maintains a
              multi-billion commercial compute alliance without holding Series D equity.
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
