chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Foundational Roots
        blocks:
          - type: paragraph
            body: >-
              Mistral AI was founded in Paris in April 2023 by Arthur Mensch (CEO, formerly of Google DeepMind),
              Guillaume Lample (Chief Science Officer, formerly of Meta), and Timothée Lacroix (CTO, formerly of Meta).
              The enterprise established itself as an explicit European sovereign counterweight to closed-source
              American foundation model developers, focusing on open-weight and commercial large language models,
              enterprise infrastructure, and localized control. Mistral's commercial offering spans developer APIs on La
              Plateforme, custom deployments via Forge, and consumer/developer productivity tooling through its Vibe
              assistant ecosystem (formerly Le Chat). The company maintains its corporate headquarters in Paris, France,
              and has expanded its operational footprint to Munich, Germany, alongside data center infrastructure
              investments in France and Sweden.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
