      - number: '6.3'
        title: Named Deployments and Technical Validation
        blocks:
          - type: paragraph
            body: >-
              Public customer case studies demonstrate deep production integration rather than superficial promotional
              logos. In cloud data warehousing, Snowflake integrated Mistral Large and Codestral into Cortex Analyst,
              its structured data text-to-SQL assistant. Snowflake's engineering evaluations demonstrated that Mistral
              models delivered close to 2x higher accuracy than single-shot evaluations of state-of-the-art alternative
              models and consistently exceeded 90% accuracy across customer benchmarks. In global logistics, maritime
              leader CMA CGM committed to a reported €100 million partnership deploying Mistral Search Toolkit and audio
              models to generate real-time routing alerts across multi-source shipping data within 15 seconds.
              Additional industrial co-development initiatives with ASML, Stellantis, and Airbus illustrate that
              enterprise customers rely on Mistral for complex, core operational workflows.
