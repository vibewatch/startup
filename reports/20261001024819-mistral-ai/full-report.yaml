      - number: '1.3'
        title: Capitalization Trajectory, Valuation, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Mistral has executed an unprecedented capital accumulation velocity for a European software enterprise,
              raising over €5.8 billion in lifetime equity and debt capital within 41 months of inception. In September
              2026, Mistral closed a €3 billion Series D round led by Samsung Electronics with participation from
              Scaleup Europe Fund (EQT), PSG Equity, Advent, BlackRock-managed funds, and the Grand Duchy of Luxembourg,
              lifting post-money valuation above €21 billion (approximately $24 billion). This equity expansion was
              preceded by an $830 million debt financing secured in March 2026 from a syndicate of seven commercial
              banks to fund roughly 13,800 Nvidia GPUs for an owned Paris-area data center in Bruyères-le-Châtel.
              Operating revenue metrics indicate substantial commercial momentum, with ARR run-rate reaching
              approximately $400 million in 2026, though unaudited management targets aiming at $1 billion by year-end
              2026 reflect aggressive forward expectations across more than 125 enterprise accounts.
