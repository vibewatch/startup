      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Granular Mixture of Experts Architecture Drives Compute Efficiency
            body: >-
              Mistral's deployment of granular MoE in Mistral Large 3 activates only 41 billion of its 675 billion
              parameters per token. Paired with Sliding Window Attention and rolling buffer KV caching, this
              architecture delivers frontier-level multilingual and reasoning performance while dramatically reducing
              memory requirements and hardware operational expenditure relative to monolithic dense models.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Infrastructure Capital Intensity and Self-Hosted Operational Burden
            body: >-
              While self-hosted and sovereign European deployments provide enterprise data residency and regulatory
              compliance, they place substantial operational demands on internal engineering teams for GPU optimization
              and cluster management. Simultaneously, Mistral's ambition to build 1 GW of sovereign European compute
              requires billions in capital expenditure, exposing the business to datacenter power constraints and
              hardware availability risks.
            calloutType: risk
            claimRefs:
              - CE006
              - CE009
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Enterprise Verticals
        blocks:
          - type: paragraph
            body: >-
              Mistral AI targets high-stakes enterprise sectors where data sovereignty, computational efficiency, and
              deployment autonomy dictate procurement decisions. Approximately 60% of commercial revenue originates
              within Europe, contrasting sharply with US-centric frontier competitors. Enterprise buyers span aerospace,
              automotive engineering, defense, logistics, and cloud infrastructure platforms. Key institutional
              relationships include Airbus across aircraft engineering divisions, Stellantis in automotive supply chain
              intelligence, BMW Group in multimodal physical simulation, and defense specialist Helsing for
              Vision-Language-Action tactical systems. Buyers prioritize Mistral's open-weight flexibility and
              on-premises deployment capabilities to satisfy stringent General Data Protection Regulation and sovereign
              compliance frameworks without routing sensitive corporate data through centralized foreign cloud
              infrastructure.
            claimRefs:
