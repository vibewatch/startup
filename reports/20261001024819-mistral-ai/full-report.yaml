  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Compliance, and Intellectual Property Exposure
        blocks:
          - type: paragraph
            body: >-
              Mistral AI operates at the intersection of European regulatory ambition and global artificial intelligence
              governance. The enforcement of the EU AI Act introduces stringent obligations for General Purpose AI
              (GPAI) models with systemic risk capabilities, requiring transparent model evaluations, adversarial
              red-teaming documentation, and continuous systemic risk reporting to the EU AI Office. Although Mistral
              has positioned itself as Europe's sovereign champion, compliance costs and technical reporting burdens
              threaten to compress operating margins. Furthermore, intellectual property risks remain acute. Benchmark
              evaluations by Patronus AI demonstrated that Mistral's Mixtral-8x7B-Instruct reproduced copyrighted book
              content verbatim across 22% of evaluation prompts. While this exposure is lower than proprietary peers
              like OpenAI's GPT-4, it confirms that open-weight architectures remain legally vulnerable to copyright
              infringement claims and licensing litigation. In addition, Mistral's open-weight release strategy creates
              downstream governance liabilities: once model weights are distributed under permissive or research
              licenses, post-release alignment and filtering cannot be enforced centrally, exposing the company to
              reputational and regulatory blowback if bad actors modify open weights for malicious deployments.
            claimRefs:
              - CR001
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR012
