      - number: '5.2'
        title: Model Architecture, Inference Optimization, and Compute Infrastructure
        blocks:
          - type: paragraph
            body: >-
              At the architectural level, Mistral AI differentiates its models through memory-efficient transformer
              engineering and sparse computation. Mistral Large 3 deploys a granular Mixture of Experts (MoE)
              architecture with 41 billion active parameters per token out of 675 billion total parameters, enabling
              massive model capacity while restraining inference compute requirements. To accelerate generation and
              control memory footprint across extended sequence lengths up to 256,000 tokens, Mistral integrates Sliding
              Window Attention (SWA), Grouped-Query Attention (GQA), and a rolling buffer key-value cache. For
              enterprise deployment, Mistral provides three distinct operational surfaces: fully self-hosted deployments
              on customer virtual cloud or on-premises infrastructure, a managed Mistral cloud hosted entirely within
              the European Union, and managed endpoints across hyperscaler marketplaces including Microsoft Azure,
              Amazon Web Services, and Google Cloud. Physical infrastructure is underpinned by colocation partnerships
              with datacenter operators such as Digital Realty to deliver low-latency European inference, supporting
              Mistral's long-term roadmap to establish up to 1 gigawatt of dedicated AI compute capacity across Europe
              by 2030.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE009
              - CE011
              - CE012
