            body: >-
              Mistral AI's deliberate positioning as an independent European AI champion has enabled it to capture
              strategic accounts that foreign hyperscalers struggle to penetrate. By providing on-premises deployments,
              open-weight transparency, and sovereign cloud infrastructure, Mistral appeals directly to European
