callouts:
  - calloutType: "insight"
    title: "The MoE Efficiency Advantage in Commercial Inference"
    body: "Mistral's structural adoption of Mixture-of-Experts (MoE) architectures—activating only 41 billion parameters per token out of 675 billion total parameters in Mistral Large 3—enables a 40% reduction in inference compute while delivering a 300ms Time to First Token. This technical efficiency underpins Mistral's 70% to 75% output token discount against dense models like GPT-5, rendering it highly compelling for price-sensitive production enterprise workloads."
    claimRefs:
      - "CP006"
      - "CP008"
      - "CP010"
  - calloutType: "risk"
    title: "Custom Model Market Narrowness and Enterprise Data Readiness"
    body: "While Mistral Forge positions the company uniquely against hyperscaler fine-tuning by enabling full-lifecycle custom pre-training on proprietary data, market research indicates that 42% of enterprise data teams spend more than half their time merely maintaining unorganized data. Full pre-training is economically justified only for data-mature organizations with domain-critical IP, creating risk that Forge remains restricted to a narrow cohort of high-end industrial accounts like ASML and Ericsson rather than achieving broad enterprise SaaS scale."
    claimRefs:
      - "CP004"
      - "CP015"
      - "CP016"
