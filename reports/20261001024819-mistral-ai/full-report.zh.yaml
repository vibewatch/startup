        - label: 1. 开权重模型探索
          segment: Developer & Data Science
          detail: 工程师与研究人员经由 Hugging Face 与 GitHub 下载开权重模型（Mistral 7B、Ministral、Codestral），用于本地原型开发。
          touchpoints:
            - Hugging Face 模型仓库
            - 消费级 GPU 本地实验
            - 开源社区文档与 API 论坛
        - label: 2. 托管 API 评估
          segment: Product Engineering & Mid-Market
          detail: 业务团队将验证成功的原型迁移至 La Plateforme 托管 API 端点，或接入主流云市场（Azure、AWS、GCP、Snowflake）。
          touchpoints:
            - La Plateforme 开发者控制台
            - 云市场账单结算与云额度抵扣
            - Serverless 推理性能基准与模型评测
        - label: 3. 办公助手采纳
          segment: Knowledge Workers & Teams
          detail: 企业向知识工作者推广 Vibe Chat、Vibe Work 与 Vibe Code，并配置集中化管理权限与数据隐私边界。
          touchpoints:
            - SAML 单点登录与域名验证
            - 企业生产力工具连接器（Google Workspace、Slack）
            - 按席位团队订阅（$24.99/user/month）
        - label: 4. 混合与私有化试点
          segment: Regulated Enterprise IT
          detail: 受监管行业机构在私有企业云、边缘环境或本地服务器中部署定制模型，严防数据外泄。
          touchpoints:
            - Koyeb 编排的 Serverless GPU 环境
            - AI 部署策略专家战略研讨会
            - 严格的 GDPR 合规与数据主权审计
        - label: 5. 生产工作流嵌入
          segment: Core Enterprise Operations
          detail: 将前沿模型深度集成至核心业务流，例如 Snowflake Cortex Analyst、ERP 系统或工厂车间异常检测。
          touchpoints:
            - 定制领域适配与模型微调
            - 联合客户案例研究与合作伙伴联合营销
            - 企业级服务等级协议（SLA）与专属支持
        - label: 6. 主权战略合作
          segment: Industrial Champions & Public Sector
          detail: 达成多年期资本与运营合作，涵盖专用 GPU 集群、物理 AI 神经仿真及主权算力基础设施。
          touchpoints:
            - 多年期资本承诺（€100M+ 规模）
            - 联合研发专有模型（BOM 工具、物理代理模型）
            - 专属欧洲数据中心算力容量配额
    approximationNotes: 采纳演进序列综合自公开的 GTM 岗位职责要求、客户案例研究及企业级部署方案。
