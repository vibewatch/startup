      - number: '1.2'
        title: 高管领导力、治理架构与核心人员依赖
        blocks:
          - type: paragraph
            body: >-
              Mistral 的核心领导层高度凝聚于三位联合创始人：CEO Arthur Mensch、首席科学官 Guillaume Lample 与 CTO Timothée
              Lacroix。三人执掌核心战略与技术决策大权，构成了前沿研究实验室常见的高度关键人员依赖——在此类机构中，底层架构演进与顶尖科研人才留存直接决定模型能否紧咬第一梯队。公司通过引入战略少数股权扩充治理结构：荷兰半导体光刻巨头
              ASML 在 2025 年 9 月 €1.7 billion 的 Series C 融资中领投 €1.3 billion，以完全稀释后约 11% 的持股比例成为 Mistral
              最大股东，并获得战略委员会顾问席位。2026 年 9 月，工业巨头 Samsung Electronics 领投 Series D 轮，协同欧洲机构投资者进一步优化其股权结构表代表席位；Microsoft
              则维持数十亿美元的商业算力联盟，未持有 Series D 股权。
