  - id: FV001
    title: Mistral AI 估值与投资建议决策链
    type: flow
    summary: 从资本规模与商业拓展动能出发，经由关键风险权衡，最终得出明确跟踪建议的逻辑演进链路。
    data:
      nodes:
        - id: scale-proof
          label: 资本规模与资金壁垒
          value: €21B+ Valuation ($24B)
          unit: EUR
          notes: 完成由 Samsung 领投的 €3B D 轮融资，以及来自 ASML 的 €11.7B C 轮融资
        - id: commercial-traction
          label: 商业化运行率
          value: $400M ARR
          unit: USD
          notes: 管理层指引设定 2026 年底达到 $1B 营收目标，覆盖 125+ 家企业客户
        - id: operational-risks
          label: 执行与资本风险
          value: $830M Debt Facility
          unit: USD
          notes: 推进巴黎 13,800 GPU 数据中心建设，面对与科技巨头（Big Tech）悬殊的资源不对称挑战
        - id: valuation-multiple
          label: 估值研判立场
          value: ~21x - 24x Forward ARR
          unit: Multiple
          notes: 从 A 轮的 200x 压缩至 ~21x 远期倍数，成长定价趋于公允
        - id: decision-outcome
          label: 最终研判立场
          value: Track (High Risk)
          unit: Rating
          notes: 维持列入观察名单；等待经审计确认的财务数据与 $1B ARR 达成实证
        - id: monitoring-triggers
          label: 尽调触发条件
          value: Audited FY26 Proof
          unit: Milestone
          notes: 在参与后续股权加注前，严格核实经审计毛利率与贷款契约合规情况
      edges:
        - from: scale-proof
          to: commercial-traction
        - from: commercial-traction
          to: operational-risks
        - from: operational-risks
          to: valuation-multiple
        - from: valuation-multiple
          to: decision-outcome
        - from: decision-outcome
          to: monitoring-triggers
    approximationNotes: 流程图展示推导得出最终投资立场的前置定性与定量门槛决策序列。
