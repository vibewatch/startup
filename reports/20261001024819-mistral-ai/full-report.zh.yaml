      - number: '2.2'
        title: 目标市场空间测算与约束性视角
        blocks:
          - type: paragraph
            body: >-
              评估 Mistral AI 的市场潜力需结合多重视角穿透测算，而非单一依赖自上而下的整体潜在市场总额。从宏观体量看，Gartner 预计全球人工智能支出将从 2025 年的近 $1.5 trillion 扩大至
              2026 年的超 $2.0 trillion；Global Market Insights 则预测生成式 AI 软件及服务市场规模将从 2026 年的 $83.3 billion 飙升至 2035 年的
              $988.4 billion。论及可服务市场（SAM），Mistral CEO Arthur Mensch 提出激进判断，认为现有企业软件中 50% 以上最终将被自主 AI Agent
              框架替代或颠覆。至于可获取市场（SOM），公司披露 2025 年收入运行率已超 $400 million，并确立 2026 年底 ARR 突破 $1.0 billion
              的明确目标。然而，行业监测数据存在分歧：部分商业追踪机构将 $1 billion ARR 标注为已达成，一手行业报道则认定其为年底奋斗目标，要求承销团队对合同履约周期与经常性收入界定开展严格核实。
