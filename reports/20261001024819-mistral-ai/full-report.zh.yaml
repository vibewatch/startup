companyProfile:
  summary: >-
    Mistral AI 是一家总部位于巴黎的前沿 AI 企业，由前 Meta 与 Google DeepMind 研究员 Arthur Mensch、Guillaume Lample 和 Timothée Lacroix 于 2023
    年 4 月创立。公司向高度注重数据、权重与算力本地控制权的受监管及工业客户销售开源权重模型、托管 API、Vibe 生产力工具、主权企业级私有化部署、模型定制以及专用基础设施。2026 年 9 月，公司以超 €21 billion
    的投后估值完成 €3 billion 的 Series D 轮融资，延续重资本扩张路线，但目前仍未披露经审计的财务数据、客户留存率及实际造血能力。
