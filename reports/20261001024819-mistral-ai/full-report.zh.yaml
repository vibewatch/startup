      - number: '8.2'
        title: 估值背景、融资脉络与投资建议立场
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 8 日完成 €3.0 billion Series D 融资后，Mistral AI 投后估值突破 €21.0 billion（约 $24.0 billion），较 2025 年 9 月
              Series C 的 €11.7 billion 与 2024 年 6 月 Series B 的 €5.8 billion 显著提升。成立 41 个月内，Mistral 历经股权与债权共 9
              轮融资，累计筹得承诺资本超 $6.5 billion。按 $24.0 billion 估值计算，其交易倍数对应 $400 million ARR run-rate 约为 60.0x，对应 $1.0 billion
              远期 ARR 目标约为 21.0x 至 24.0x。尽管该倍数相较早期轮次有所压缩——例如 Series A 阶段 200.0x 的营收倍数与 Series C 阶段的
              34.3x——但作为欧洲唯一规模化前沿实验室，其稀缺价值使交易倍数相对广泛软件可比标的享有溢价。然而，由于公司未公开披露经审计财务报表、分客户群净留存率或法定毛利率，目前无法给出明确买入建议。因此，正式评级为维持跟踪（track），风险等级高，估值立场中性合理。资本配置纪律要求：在参与追加股权投资前，须持续追踪其
              125+ 家企业客户群体的商业化转化，核实 $1.0 billion ARR 里程碑交付情况，并评估其 1-gigawatt 主权算力路线图的执行力度。
            claimRefs:
