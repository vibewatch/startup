        title: 扩客路径、留存指标与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Mistral 采取自下而上的开发者尝鲜与高层自上而下数字化变革相结合的立体拓客模式。一线团队派驻专属 AI
              交付专家进驻核心标杆大客户，贯穿售前规划与生产上线全流程，联合制定数年期智能化演进路线图。商业化扩张引导客户从基础按 token 计费 API 及团队生产力席位（每人每月
              $24.99）向定制化主权基础设施部署及数百万欧元级联合研发合作阶梯式升级。然而，商业模式可持续性风险犹存：经审计的净收入留存率（NRR）、总流失率以及前五大客户集中度未予披露。此外，尽管独立安全监控显示
              2026 年未发生数据泄露，但 2025 年记录在册的一起内部聊天日志外泄事件，依然凸显出企业数据合规治理的长期重任。
