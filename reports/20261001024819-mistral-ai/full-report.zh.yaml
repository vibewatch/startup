      - number: '3.2'
        title: 能力基准评测、推理经济模型与定价博弈
        blocks:
          - type: paragraph
            body: >-
              实测跑分表明，旗舰模型 Mistral Large 以及专用引擎 Codestral 在标准语言与代码评测集上兼具顶尖竞争力与显著推理成本优势。在多任务语言理解评测中，Mistral Large 于 MMLU
              Pro 跑出 85.5%，紧追 GPT-5 等闭源前沿系统（88.7%）；在代码合成任务中，其 HumanEval 达 92.0%，几乎齐平
              GPT-5（92.4%）。然而在博士级多步骤科学推理场景下，Mistral 呈现断崖式差距，GPQA Diamond 表现落后于闭源思维链架构（43.9% 对 89.4%）。Mistral
              凭借算力效率与激进定价弥补推理短板：Mistral Large 3 输入每百万 token 定价 $0.50、输出每百万 token 定价 $1.50，较 GPT-5（输入 $0.63、输出 $5.00）实现
              78% 的综合成本降幅；Mistral Small 3.2 更以每百万输入 token $0.07 提供极低延迟吞吐。高达 9 倍的输入成本优势，对预算敏感型企业业务与高并发 API 集成方极具吸引力。
