              Mistral 创下欧洲软件企业前所未有的资本积聚速度，成立仅 41 个月便累计融入超 €5.8 billion 股债资金。2026 年 9 月，Mistral 完成由 Samsung Electronics
              领投的 €3 billion Series D 融资，Scaleup Europe Fund (EQT)、PSG Equity、Advent、贝莱德旗下基金及卢森堡大公国参投，推升投后估值突破 €21
