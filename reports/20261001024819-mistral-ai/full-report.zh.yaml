  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场分类：直接竞对、在位巨头与替代架构
        blocks:
          - type: paragraph
            body: >-
              Mistral AI 面对的竞争格局交织着基础模型直属实验室、超大规模云在位巨头、开源社区替代方案以及企业自研工作流。在前沿梯队，以 OpenAI、Google DeepMind 和 Anthropic
              为代表的美国闭源实验室把控着前沿性能分水岭，引领以 GPT-5 和 Claude 系列为首的深度推理模型，坐拥海量风投资金与庞大开发者生态。Microsoft、Amazon Web Services 与
              Google Cloud 等超大规模云厂商扮演着双重角色，既是关键分发渠道，又是直接结构性竞手——一边在 Azure 和 Bedrock 上托管 Mistral 接口，一边力推 Amazon Nova 和
              Google Gemini 等竞品模型。以 Meta Llama 家族为核心的开源阵营持续带来同质化压力，其免费开放的权重不断挤压基模定价权。与此同时，企业买方日益将 RAG 与开源权重自研微调视作替代闭源
              API 合同的高性价比路径，促使 Mistral 推出 Mistral Forge 全生命周期预训练服务，以锁定高价值的企业定制模型需求。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
