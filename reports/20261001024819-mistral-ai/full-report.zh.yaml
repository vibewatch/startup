figures:
  - id: FO001
    title: Mistral AI 公司与融资历程大事记
    type: timeline
    summary: Mistral AI 自 2023 年 4 月创立至 2026 年 9 月完成 €3B D 轮融资的发展历程。
    data:
      items:
        - label: 2023 年 4 月
          detail: Arthur Mensch、Guillaume Lample 与 Timothée Lacroix 于巴黎共同创立公司。
        - label: 2023 年 6 月
          detail: 完成 €105M（$113M）种子轮融资，创下欧洲迄今最大种子轮融资纪录。
        - label: 2023 年 9 月
          detail: 发布公司基础开源权重模型 Mistral 7B。
        - label: 2023 年 12 月
          detail: 以逾 €2B 估值完成 €385M A 轮融资；发布 Mixtral 8x7B MoE 架构。
        - label: 2024 年 2 月
          detail: 推出旗舰模型 Mistral Large 并宣布与 Microsoft Azure 达成合作。
        - label: 2024 年 6 月
          detail: 以 €5.8B 估值完成 €600M B 轮融资。
        - label: 2024 年 9 月
          detail: 组织规模突破 100 名员工。
        - label: 2025 年 9 月
          detail: 以 €11.7B 估值完成 €1.7B C 轮融资，由 ASML 领投 €1.3B 定盘。
        - label: 2026 年 3 月
          detail: 获得 7 家银行提供的 $830M 债务授信，用于建设巴黎 Bruyères-le-Châtel GPU 数据中心。
        - label: 2026 年 5 月
          detail: 将面向消费者及开发者的平台 Le Chat 更名为 Vibe，整合 Work 与 Code 双智能体模式。
        - label: 2026 年 9 月
          detail: 由 Samsung Electronics 领投，以逾 €21B 估值完成 €3B D 轮融资。
    approximationNotes: 日期代表公司一手日志与财务报告所记录的公历发布及融资交割日期。
