      - number: '8.3'
        title: 情景分析、退出准备度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              为确立严谨的建仓与持仓纪律，本报告在 24 至 36 个月时间跨度内，分乐观（bull）、基准（base）与悲观（bear）三种情景评估 Mistral 的商业轨迹。在乐观情景下，Mistral
              成功斩获欧洲主权采购订单，将 Samsung 与 ASML 的工业 AI 集成拓展至全球制造基地，并在 2028 年前将 ARR 规模推升至 $1.8 billion；按 20.0x 倍数计算，可支撑 $36.0
              billion 估值。在基准情景下，伴随 200+ 家受监管企业客户稳步落地，企业 ARR 于 2027 年底达到 $1.1 billion；尽管算力折旧与模型通用化挤压利润率，公司估值仍将在 22.7x
              倍数下稳定在 €22.0 billion 至 €25.0 billion（约 $25.0B）。在悲观情景下，海外替代方案加剧开放权重商品化竞争，超大规模云厂商发起激进的云端推理价格战，$830 million
              银行授信的固定偿债负担迫使估值倍数压缩至 12.0x；按未达预期的 $600 million ARR 计，将引发估值降至 $7.2 billion
              的下轮低价融资（down-round）。当前退出就绪度受限：鉴于未经审计的财务披露以及高昂资本支出需求，2028 年前在 Euronext Paris 或 Nasdaq
              实施首次公开发行（IPO）几无可能；而并购出售（trade sale）路径在主权资产审查机制下亦面临欧洲监管机构的严厉阻挠。当前亟待推进的尽调诉求聚焦于：调取经审计的 FY2024–FY2025 财务报表、核实前
              5 大客户（top-5 accounts）集中度、审查 $830 million 银团贷款的债务契约比率，以及确认 Series D 银团的清算优先权条款。
