            body: >-
              Mistral AI 于 2023 年 4 月在巴黎创立，联合创始人包括 Arthur Mensch（CEO，曾任职于 Google DeepMind）、Guillaume Lample（首席科学官，曾任职于
              Meta）和 Timothée Lacroix（CTO，曾任职于
              Meta）。公司明确定位为抗衡美国闭源基础模型开发商的欧洲主权核心力量，聚焦开源权重与商业化大语言模型、企业级基础设施及本地化控制权。Mistral 的商业化产品线覆盖 La Plateforme 开发者
              API、Forge 定制部署，以及依托 Vibe 助手生态（原 Le Chat）构建的个人与开发者生产力工具。公司总部设于法国巴黎，运营版图已拓展至德国慕尼黑，并在法国和瑞典投资布局数据中心基础设施。
