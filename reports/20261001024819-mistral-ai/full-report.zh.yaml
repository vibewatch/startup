  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定与边界范围
        blocks:
          - type: paragraph
            body: >-
              Mistral AI 将其目标市场界定在两大核心方向：横向企业级基础模型及 Agent 编排平台，以及纵向工业工程 AI
              系统。在横向企业部署中，目标软件支出涵盖领域模型定制适配、微调、检索增强生成（RAG）框架，以及用于自动化重复多步骤任务的 Agent 工作流（如 Vibe Work Mode 与 Code
              Mode）。排除在外的支出包括缺乏企业级安全与领域定制能力的传统规则型业务流程管理工具及通用消费级聊天机器人订阅。在纵向维度上，Mistral 重点切入工业工程领域——特别是航空航天、汽车与半导体制造——将收购
              Emmi AI 获得的物理仿真能力直接整合到特定领域工程工作流中。这一清晰边界将 Mistral 与同质化模型 API 供应商区分开来，依托私有云、本地化及主权部署架构，直击要求数据绝对掌控权的企业 CIO
              与研发负责人的核心诉求。
