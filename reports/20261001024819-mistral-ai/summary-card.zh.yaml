  topStrengths:
    - 欧洲主权 AI 卡位优势明确，提供本地可控部署方案。
    - 商业化切面宽，覆盖 API、席位、私有化部署、定制开发与基础设施。
    - 企业级客户落地迅速，并获得 Samsung、ASML 等战略级产业伙伴支持。
  topRisks:
    - 仍未披露经审计的收入、利润率、留存率及现金流数据。
    - 资本开支强度高，一旦增长放缓，算力采购与债务承诺将严重挤压运营灵活性。
    - 相比超大规模云厂商与前沿模型巨头，竞争态势存在结构性不对称。
    - 开源权重模型分发面临的监管合规与版权诉讼风险依然显著。
  unresolvedGaps:
    - 尚未披露经审计的 FY2024 与 FY2025 收入、毛利率及客户队列留存率。
    - 现金余额、烧钱速度、算力承诺及债务契约条款仍未公开。
    - 125+ 家企业客户的头部客户集中度，以及付费客户与试点客户的比例均未公开。
    - 欧盟《AI 法案》合规成本与版权侵权责任走势仍存不确定性。
    - 管理层尚未给出明确核对说明，用以解释 $183.2 million、$400 million 与 $1 billion 这些收入 / ARR 统计口径的差异。
