  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-expansion-metrics
      missingEvidence: Audited customer renewal rates, cohort net revenue retention (NRR), gross revenue retention (GRR), and average contract length across top-25 and mid-tier firm cohorts.
      whyItMatters: Without retention and expansion disclosures, it is impossible to verify whether early Top 25 accounting firm pilots convert into durable, expanding multi-year enterprise contracts or suffer from high post-tax-season churn.
      diligencePath: Request cohort-level retention data, annual contract value (ACV) distributions, and historical logo churn figures under NDA during management diligence.
      relatedQuestionRefs:
        - QU009
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: Comprehensive roster of all approximately 7 Top 25 accounting firm customers and full Top 150 firm deployments currently active on the platform.
      whyItMatters: Public sources name only 6 major firms (Boulay, Clark Nuber, MarksNelson, Pinion, UHY, Wiss) and one boutique firm, leaving the remaining enterprise accounting clients undisclosed under mutual non-disclosure agreements.
      diligencePath: Review reference client list and case study disclosures in vendor data room or conduct blind customer reference calls with partner CPAs.
      relatedTableRefs:
        - TU003
