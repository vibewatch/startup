  title: Customers
  summary: Basis has demonstrated rapid early penetration into enterprise accounting firms, serving approximately 30% of the top 25 US accounting firms and 25% of the top 150 firms across CAS, tax, and audit practices. Adoption is driven by critical CPA labor shortages and self-reported 20% to 50% time savings, but commercial durability remains untested by published retention, renewal, or customer-concentration disclosures.
sections:
  - id: customer-base-segmentation
    title: Accounting Firm Base Segmentation and Buyer Economics
    body: 'Basis focuses its go-to-market strategy specifically on professional accounting firms rather than enterprise accounts payable departments or generic internal corporate finance teams. Within the accounting profession, the company segments its addressable customer base into three primary tiers: Top 25 national accounting firms, Top 150 regional and mid-tier practices, and boutique small accounting firms. The core economic buyer across all segments is the firm managing partner or practice leader, while senior CPAs and staff accountants serve as the primary daily users. Payer authority is funded from firm operating and technology budgets, driven by a structural talent crisis across the United States where retiring CPAs outnumber new entrants. By targeting client accounting services (CAS), tax return preparation, and audit testing workflows simultaneously within a unified platform, Basis captures multi-practice budget allocations rather than competing as a point solution. Enterprise AP departments are intentionally excluded to avoid commoditized ERP optical character recognition competition, allowing the platform to tailor its procedures to external client accounting engagements.'
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU010
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-efficiency
    title: Adoption Trajectory, Capacity Expansion, and Efficiency Proof
    body: 'The adoption trajectory for Basis has accelerated rapidly since its 2023 founding, fueled by acute industry-wide CPA labor shortages and intense busy-season workload compression. Independent reporting from Reuters and venture disclosures confirm that Basis currently serves approximately 30% of the top 25 accounting firms in the United States—representing roughly seven national firms—alongside approximately 25% of the top 150 regional accounting firms. Practitioner adoption is underpinned by substantial efficiency gains across core compliance processes: partner studies and customer reports document an average of up to 30% time savings across routine tasks, with broader workflow gains ranging between 20% and 50% across practices. For smaller accounting practices, sole practitioners and managing partners report recapturing 10 to 20 hours per week, compressing multi-hour review tasks to thirty minutes. To accelerate deployment velocity and reduce initial implementation friction, Basis equips accounting teams with more than 350 pre-built accounting procedures authored by in-house accountants in residence, facilitating immediate trial balance mapping and K-1 footnote extraction without custom software engineering.'
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU008
    tableRefs:
      - TU002
  - id: named-customer-deployments
    title: Production Deployments and Named Firm Case Proof
    body: 'Public evidence confirms that Basis has transitioned from preliminary proof-of-concept trials to production deployments across multiple prominent accounting firms. Confirmed enterprise and mid-market accounts include UHY LLC (a Top 25 US accounting firm), Boulay PLLP, Clark Nuber PS, MarksNelson LLC, Pinion LLC, and Wiss & Company, alongside boutique practices such as Whitcomb & Sheridan LLP. Client deployments span complex production workflows rather than isolated marketing pilots: accounting teams at Wiss & Company describe the platform as trajectory-defining in freeing professional staff from tedious manual reconciliations to focus on higher-margin advisory relationships. At mid-tier firms such as Pinion and Boulay, agents execute multi-step tax preparation schedules, audit testing procedures, and client write-ups, connecting directly to client general ledgers, QuickBooks, Xero, and enterprise resource planning systems. Human CPAs remain in an active supervisory loop, reviewing and approving agent-prepared workpapers and journal entries. However, because client accounts are managed under mutual non-disclosure agreements, the full distribution of seats, practice groups, and active client files remains partially undisclosed across top-tier accounts.'
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU009
    tableRefs:
      - TU003
  - id: retention-expansion-and-concentration-risks
    title: Customer Journey, Expansion Dynamics, and Retention Risks
    body: The long-term commercial durability of Basis depends on its land-and-expand trajectory across firm practice areas and the sustainability of its outcomes-based pricing model. Accounting firms typically initiate engagement within client accounting services (CAS) for monthly close reconciliations before expanding into seasonal tax return preparation and audit testing. Unlike prevailing software vendors that charge seat-based subscription fees or mark up raw model tokens, Basis prices engagements based on completed accounting outcomes, aligning customer expense directly with delivered firm revenue. Nevertheless, significant diligence risks persist regarding customer concentration and long-term retention. Because accounting partners bear personal regulatory and legal liability for filed tax returns and certified audit workpapers, any agent hallucination or procedural error creates severe liability risks that software code generation tools do not face. Furthermore, Basis has disclosed neither annual recurring revenue (ARR) nor customer retention metrics such as Net Revenue Retention (NRR) or gross renewal rates, leaving open whether early Top 25 penetration represents durable multi-year commitments or volatile seasonal trial software usage.
    claimRefs:
      - CU007
      - CU011
      - CU012
      - CU013
      - CU014
    figureRefs:
      - FU001
