company:
  name: "Basis"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Basis targets the multi-billion-dollar professional accounting and tax advisory services market, addressing structural practitioner shortages across CAS, tax, and audit practices with autonomous agentic workflows."
sections:
  - id: "market-boundary-and-scope"
    title: "Market Boundary: Agentic Accounting Workflows vs. Status-Quo Software"
    body: "The addressable market for Basis is defined by the end-to-end execution of complex accounting procedures across client accounting services (CAS), corporate tax compliance, and audit preparation. Unlike horizontal general ledgers or point bookkeeping utilities such as QuickBooks, Xero, or NetSuite that require human accountants to manually enter transactions and reconcile statements, Basis automates multi-step workflows autonomously. The platform targets mid-market and enterprise public accounting practices as well as corporate finance organizations seeking to scale client volume without adding headcount. Included spend encompasses workflow automation, tax workbook preparation, and trial balance mapping, while excluding general-purpose ERP licenses and core database hosting. This boundary positions Basis directly against manual labor hours rather than existing software seat budgets."
    claimRefs:
      - "CM001"
      - "CM008"
      - "CM012"
    tableRefs:
      - "TM001"
  - id: "tam-sam-som-sizing"
    title: "Addressable Market Sizing: Multi-Lens Sizing Across Practice Areas"
    body: "Market sizing for agentic accounting platforms cannot be captured by a single top-down software figure because the technology displaces manual professional services hours. Across the United States, roughly 3 million accountants generate over $150 billion in gross professional services revenue. The serviceable market is concentrated in accounting firms where routine compliance work, monthly closing, and tax preparation consume up to 70% of professional staff hours. Software and external automation budgets within this labor pool represent an addressable software market of $15 billion to $20 billion annually. Basis focuses on the Top 150 accounting firms and regional practices, where early deployments across Top 25 accounting firms validate immediate willingness to pay for scalable capacity. Investor confidence was reinforced in February 2026 with a $100 million Series B round at a $1.15 billion valuation led by Accel and GV."
    claimRefs:
      - "CM002"
      - "CM004"
      - "CM006"
      - "CM009"
      - "CM013"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-segmentation-procurement"
    title: "Buyer Personas, Practice Segmentation, and Procurement Mechanics"
    body: "Adoption dynamics vary significantly across accounting firm size tiers and practice groups. In Top 25 and large national accounting firms, economic buyers are managing partners, practice leaders, and national managing partners who oversee CAS, tax, or advisory service lines. Procurement frequently involves dual governance structures due to alternative practice models separating licensed attest partnerships from advisory corporate entities. In mid-market and regional firms, managing partners prioritize capacity release to avoid turning away client engagements during peak tax deadlines. Basis aligns its commercial model with firm economics by employing outcomes-based pricing tied to completed accounting procedures and deliverables rather than per-seat licensing, mitigating firm concerns over software license shelfware."
    claimRefs:
      - "CM005"
      - "CM007"
      - "CM010"
    tableRefs:
      - "TM003"
  - id: "adoption-drivers-and-constraints"
    title: "Adoption Drivers and Constraints: Demographic Headwinds vs. Regulatory Verification"
    body: "The primary growth driver for agentic accounting adoption is an acute, structural demographic crisis across the accounting profession. With approximately 300,000 accountants retiring within a two-year window and an estimated 75% of practitioners retiring over the coming decade, firms cannot hire enough CPAs to fulfill compliance demand. Autonomous agents that execute multi-step closes and tax returns deliver documented time savings of up to 30%, unlocking critical operational capacity. However, adoption is bounded by strict professional liability, AICPA standards, and circular review mandates. Because CPAs sign tax returns and attest opinions under legal penalty, AI platforms must provide transparent audit trails, source citations, and confidence scores rather than black-box outputs. Furthermore, audited commercial disclosures regarding customer retention and gross margins remain an open diligence gap."
    claimRefs:
      - "CM003"
      - "CM011"
      - "CM013"
      - "CM014"
