    title: "Accountant Retirement Wave Replaces Incremental IT Replacement Cycles"
    body: "The retirement of roughly 300,000 accountants within a two-year window and an anticipated 75% exit over the next decade shifts AI adoption from discretionary productivity software to essential operational survival for partner-led practices."
    claimRefs:
      - "CM003"
      - "CM006"
  - calloutType: "risk"
    title: "Strict Liability and AICPA Standards Preclude Fully Autonomous Execution"
    body: "Because accounting and attest opinions carry partner liability and strict regulatory oversight, agentic systems must maintain granular audit logs, source provenance, and confidence scores so practitioners retain review control."
    claimRefs:
      - "CM010"
      - "CM011"
