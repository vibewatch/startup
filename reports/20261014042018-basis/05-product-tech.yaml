artifact: product-tech
slug: basis
runDate: '2026-10-14'
company:
  name: Basis
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Basis delivers an agentic AI platform designed for accounting and CPA firms that automates multi-step workflows
    across client accounting services, tax preparation, and audit trails. Powered by OpenAI frontier reasoning models
    (o3, o3-Pro, GPT-4.1, and GPT-5) coupled with deterministic accounting constraints and local firm learning, the
    system deploys goal-oriented supervising and specialized sub-agents with mandatory human review gates.
sections:
  - id: sec-product-overview
    title: Core Product Architecture and Agentic Operating Model
    body: >-
      Basis provides an agentic artificial intelligence platform designed specifically for certified public accountant
      firms and professional accounting teams. Rather than implementing a conversational chatbot that requires
      continuous user prompting or simple text-in, text-out assistance, Basis treats accounting operations as
      autonomous, multi-step workflows. The platform deploys goal-oriented artificial intelligence agents capable of
      ingesting financial source records, interpreting trial balances, categorizing transactions, preparing workpapers,
      and generating filing-ready tax returns. Each multi-step process operates under accountant supervision, ensuring
      that practitioners retain complete visibility and control over all calculations, mappings, and staged journal
      entries before posting to client ledgers. The platform was founded in 2023 by Matt Harp and Mitchell Troyanovsky
      and raised a $100 million Series B funding round in February 2026 at a $1.15 billion valuation to expand its
      multi-agent platform across professional services practices.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
  - id: sec-workflows-modules
    title: Accounting Workflows and Pre-Built Procedure Modules
    body: >-
      The platform addresses critical operational bottlenecks across client accounting services, tax compliance, and
      audit support. In client accounting services, Basis connects directly to client general ledgers to perform
      automated write-ups, clean up messy ledgers, and stage journal entries with account codes, descriptions, and
      linked source documentation. For tax compliance practices, the platform extracts complex financial information at
      scale—such as partnership Schedule K-1 footnotes and passive versus non-passive allocations—while mapping book
      trial balances to tax lines and drafting Form 1065 partnership returns. Basis provides over 350 pre-built
      accounting Procedures crafted by internal accountants in residence, allowing firms to codify review preferences,
      materiality thresholds, and client-specific quirks into repeatable execution workflows. Practitioners review
      proposed entries in structured stages, eliminating tedious manual data transcription while preserving
      institutional review standards.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE001
      - TE002
  - id: sec-technology-infrastructure
    title: Model Routing, Local Context Learning, and Tool Calling
    body: >-
      Basis’s underlying technical architecture couples frontier reasoning models from OpenAI with deterministic
      accounting logic and entity-specific local context. Task execution begins with a supervising agent, originally
      built on OpenAI o3 and migrated to GPT-5, that evaluates incoming jobs and decomposes them into coordinated
      sub-agent workflows. The orchestrator routes specialized tasks across frontier models based on latency and
      complexity requirements, leveraging GPT-4.1 for speed-critical interaction loops and GPT-5 for deep multi-step
      reasoning, transaction disambiguation, and financial reconciliations. On internal benchmarks evaluating parallel
      tool execution with code interpreter and web search enabled, GPT-5 achieved a perfect 100 percent success rate in
      coordinating structured accounting actions. Rather than relying solely on global models that miss client-specific
      nuances, Basis crystallizes local entity rules, account mappings, and business conventions, compounding system
      precision as firms expand usage.
    claimRefs:
      - CE002
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: sec-governance-security
    title: Auditability, Deterministic Guardrails, and Risk Controls
    body: >-
      In regulated accounting and audit environments, accuracy, auditability, and data security represent non-negotiable
      operational requirements. Basis enforces strict rules-based accounting constraints alongside foundation model
      reasoning, ensuring that agents cannot reason freely outside established tax codes, debit-credit balance
      constraints, and firm-specific approval parameters. Every figure, journal adjustment, and tax line generated by
      the platform links directly to its underlying source documentation with an immutable action log and confidence
      scoring. Cloud deployment integrates with accounting firm file stores and general ledgers without storing client
      credentials on Basis servers. However, because Basis operates autonomously rather than in an assistive mode,
      platform reliability depends fundamentally on upstream foundation model precision, and the absence of a public
      self-serve application programming interface concentrates deployment support on direct enterprise engagements.
    claimRefs:
      - CE003
      - CE004
      - CE011
      - CE013
      - CE014
tables:
  - id: TE001
    title: Product Module / Asset Matrix
    columns:
      - Module / Capability
      - Target User
      - Maturity / Status
      - Core Differentiation
      - Diligence Gap
    rows:
      - - Client Accounting Services (CAS)
        - Staff & Senior Accountants
        - Production GA
        - Automated GL cleanup, write-ups, and draft journal entries staged for review
        - Real-world error and human override rates across diverse GL systems
      - - Tax Preparation & QC
        - Tax Preparers & Reviewers
        - Production GA (1065 demonstrated)
        - Document extraction (K-1s), book-to-tax mapping, M-1 workpapers, source citations
        - Edge-case handling for multi-tier partnership footnotes and rare state codes
      - - Audit Workpaper & Trail Support
        - Audit Staff & Managers
        - Production GA
        - Structured/unstructured data extraction, immutable action logs, 7-year retention
        - Formal SOC compliance validation across mid-tier firm environments
      - - Custom Procedure Builder
        - Firm Partners & Quality Leads
        - Production GA (350+ pre-built)
        - Captures firm-specific review rules, client quirks, and review thresholds
        - Lack of public self-serve documentation and third-party developer extensibility
    notes: >-
      Module maturity and capabilities compiled from official Basis solutions documentation, partner case studies, and
      independent technology reviews. All modules enforce accountant review before posting.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job
      - Current Manual Workflow
      - Basis Solution
      - Measurable Benefit
      - Technical / Operational Limitation
    rows:
      - - Month-End Reconciliation
        - Manual transaction matching across bank statements and general ledger in Excel
        - Supervising agent matches transactions, flags discrepancies, and drafts adjusting entries
        - Up to 30% firm time savings and turnaround collapsed from hours to minutes
        - Requires active ERP/GL integration; cannot autonomously post without review
      - - Tax Workpaper & Return QC
        - Manual tick-and-tie of source documents against draft tax returns
        - Automated document ingestion, trial balance line mapping, and discrepancy flagging with citations
        - Source-document citations on every figure; 10-20 hours saved weekly per partner
        - Autonomous tax execution depends heavily on frontier model accuracy under unusual rules
      - - K-1 Partnership Extraction
        - Manual entry of footnotes, passive/non-passive allocations across dozens of entities
        - Batch ingestion of partnership K-1 documents with automated extraction and citation
        - Eliminates manual rekeying across complex multi-entity investor structures
        - Unstructured footnotes with non-standard disclosures require human manual intervention
      - - Financial Reporting & Deliverables
        - Manual assembly of variance reports, cash flow forecasts, and executive packs
        - Automated report drafting, 13-week cash flow projections, and variance explanations
        - Frees practitioner capacity for client advisory services rather than compilation
        - Relies on historical GL hygiene; messy client ledgers require initial cleanup pass
    notes: >-
      Workflow benefits and limitations synthesized from official product descriptions, practitioner case study quotes,
      and third-party architecture analyses.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role & Function
      - Core Dependencies
      - Technical Risk & Diligence Focus
    rows:
      - - Supervising Agent Orchestration
        - Decomposes high-level accounting goals, routes tasks to sub-agents, and enforces workflow gates
        - OpenAI GPT-5 and o3/o3-Pro reasoning models; internal benchmark evaluation suite
        - High dependency on frontier model reasoning stability and OpenAI API availability
      - - Specialized Execution Sub-Agents
        - Executes targeted accounting steps such as transaction classification, data extraction, and JE drafting
        - Multi-model ensemble (GPT-5 for deep reasoning, GPT-4.1 for speed-critical interactions)
        - Model drift across upstream API version updates altering classification consistency
      - - Accounting Rules & Constraint Engine
        - Enforces deterministic accounting logic, tax code rules, and balance validations over LLM outputs
        - Proprietary accounting rulesets, 350+ pre-built Procedures, firm review policies
        - Ruleset gaps in novel or jurisdiction-specific regulations leading to unflagged errors
      - - Integration & Ledger Connector Layer
        - Connects to firm file systems, client ledgers, and ERPs without storing client credentials
        - Direct firm deployment integrations; ledger/ERP APIs and document storage connectors
        - Lack of public self-serve API surface limits third-party auditing and bespoke firm tooling
    notes: >-
      Architecture components based on OpenAI technical case study, ZenML LLMOps database profile, and TeachUsTechnology
      technical overview.
    claimRefs:
      - CE002
      - CE003
      - CE009
      - CE011
figures:
  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: >-
      Six-tier architectural stack illustrating Basis multi-agent orchestration, model routing, deterministic rules, and
      enterprise integration boundaries.
    data:
      layers:
        - label: User Interaction & Oversight Layer
          detail: Web workspace for CPAs to assign goals, inspect cited workpapers, and approve staged journal entries
          modules:
            - Goal Assignment Interface
            - Workpaper Inspection & Review Console
            - Audit Log & Confidence Score Viewer
        - label: Supervising Orchestration Layer
          detail: Goal decomposition engine coordinating multi-step accounting workflows across specialized sub-agents
          modules:
            - Goal Decomposer & Planner
            - Parallel Tool Calling Coordinator
            - Review Threshold Dispatcher
        - label: Specialized Sub-Agent Layer
          detail: Domain-specific autonomous agents executing discrete accounting, tax, and audit procedures
          modules:
            - CAS & Reconciliation Agent
            - Tax Extraction & 1065 Filing Agent
            - Audit Trail & Verification Agent
        - label: Model Routing & Inference Layer
          detail: Multi-model routing assigning specialized frontier LLMs based on task complexity and latency
          modules:
            - OpenAI GPT-5 for Deep Reasoning
            - OpenAI GPT-4.1 for Low-Latency Interaction
            - Internal Benchmark Routing Controller
        - label: Accounting Rules & Local Context Layer
          detail: Deterministic guardrails combining 350+ accounting Procedures with firm- and client-specific learning
          modules:
            - 350+ Pre-built Accounting Procedures
            - Local Firm Context Crystallization
            - Rules-Based Validation Constraints
        - label: Data & Enterprise Integration Layer
          detail: Secure ledger connectors and document ingestion pipes operating without client credential storage
          modules:
            - ERP & General Ledger Connectors
            - Document Parser (K-1s, Statements)
            - SOC 2 Type II Secure Storage
    approximationNotes: >-
      Architectural layers conceptualize Basis technical implementation as documented across official product
      disclosures, OpenAI partnership technical details, and LLMOps analyses.
    claimRefs:
      - CE002
      - CE009
      - CE010
      - CE012
callouts:
  - calloutType: insight
    title: Workflow Delegation Rather Than Conversational Assistance
    body: >-
      Unlike conversational chatbots that assist users inside office documents, Basis architecturally treats accounting
      as an end-to-end multi-step workflow, decoupling execution from manual prompting while enforcing review gates.
    claimRefs:
      - CE001
      - CE003
  - calloutType: risk
    title: Foundation Model Dependency and Frontier API Exposure
    body: >-
      Basis multi-agent routing heavily concentrates operational reliance on OpenAI frontier models, creating potential
      exposure to upstream API latency, model version updates, and unannounced behavioral shifts.
    claimRefs:
      - CE002
      - CE014
