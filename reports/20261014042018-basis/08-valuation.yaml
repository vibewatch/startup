    title: "Investment Verdict: Research-More with Stretched Valuation Stance"
    body: "Basis has demonstrated category-leading technical execution by deploying autonomous multi-agent workflows into 30% of Top 25 US accounting firms. However, committing growth capital at a $1.15 billion valuation without verified recurring revenue, gross margin, or contract expansion metrics creates unacceptable risk of multiple compression. We recommend research-more and tracking pilot-to-production conversion."
    claimRefs:
