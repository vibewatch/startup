  - calloutType: "risk"
    title: "Valuation Vulnerability: Absence of Disclosed Revenue Fundamentals"
    body: "With $138 million raised and a $1.15 billion post-money mark, Basis carries an implied revenue multiple far above mature vertical software peers. Historical precedent shows earlier automated accounting startups stumbled on edge cases and liability. Without disclosed ARR or net retention data, the risk of a down-round or valuation overhang in subsequent financings is substantial."
