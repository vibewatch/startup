company:
  name: "Basis"
chapter:
  number: 4
  title: "Financials"
  summary: "Basis operates on an outcomes-based monetization architecture that charges accounting firms for verified completed deliverables across CAS, tax, and audit practices rather than traditional per-seat licensing. With approximately $138 million in total venture capital raised—anchored by a $100 million Series B in February 2026 at a $1.15 billion valuation—the company maintains substantial capital adequacy to fund its New York-based engineering headcount and multi-model inference cost structure. However, private revenue run rate, gross margin, and customer concentration metrics remain undisclosed, presenting key diligence gaps for financial underwriting."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Pricing Architecture"
    body: "Basis differentiates its commercial model from traditional horizontal SaaS and vertical accounting software by rejecting per-seat subscription licenses in favor of outcomes-based monetization. Rather than charging accounting firms based on user headcount or raw compute token consumption, Basis bills firms based on verified accounting work completed across client accounting services, tax compliance, and audit workflows. This model directly addresses the structural economics of professional services firms, where client billing is tied to deliverable output rather than software seat utilization. The platform packages over 350 pre-built accounting procedures developed by in-house accountants in residence, enabling firm-wide adoption across entire practice areas. Early commercialization required discipline, as Basis accepted slower initial revenue growth to establish precise deliverable attribution and ensure commercial incentives remain tightly aligned with accounting throughput."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs: []
  - id: "gtm-motion-and-workflow-economic-conversion"
    title: "GTM Motion and Workflow Economic Conversion"
    body: "Basis's go-to-market motion focuses on top-down firm partnerships across major U.S. accounting practices, targeting leadership teams facing severe professional talent shortages and margin pressures. The commercial deployment pipeline converts unstructured client financial source records into finalized accounting workpapers and return filings through a multi-agent orchestration architecture. Adopting accounting firms report an average of 30 percent time savings across routine tasks, freeing professional staff for higher-margin advisory services and enabling practice capacity expansion without proportional headcount growth. Autonomous agents within the system operate independently for extended multi-hour sessions, tackling end-to-end tasks such as trial balance mapping, multi-entity K-1 document extraction, complex bank reconciliations, and Form 1065 partnership tax returns with transparent source citations."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI005"
      - "CI006"
    tableRefs: []
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-unit-economics-drivers"
    title: "Cost Structure and Unit Economics Drivers"
    body: "The core cost structure of Basis differs substantially from conventional software companies due to significant foundation model inference expenses and specialized engineering compensation. Basis routes each step of complex accounting workflows to optimal models across OpenAI's frontier suite, including o3, o3-Pro, GPT-4.1, and GPT-5, creating a direct cost of goods sold tied to test-time compute scaling and reasoning depth. Operating expenditures are heavily concentrated in personnel costs for approximately 120 employees located in New York City, where the firm competes directly with leading AI research labs for machine learning talent. Forward gross margins remain highly sensitive to inference unit costs, token consumption per deliverable, and onboarding services delivered by its internal Deployed Intelligence team to validate client accuracy and build firm trust."
    claimRefs:
      - "CI004"
      - "CI009"
      - "CI014"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "capital-adequacy-and-financial-underwriting-verdict"
    title: "Capital Adequacy and Financial Underwriting Verdict"
    body: "Basis maintains exceptional capital adequacy following its February 2026 Series B financing of $100 million led by Accel and Google Ventures, which elevated its post-money valuation to $1.15 billion and pushed cumulative venture capital raised to approximately $138 million. This balance sheet expansion provides several years of cash runway to absorb high research, compute, and payroll costs while expanding market penetration beyond its current footprint in 30 to 40 percent of the top 25 U.S. accounting firms. Prominent institutional partnerships, such as Top 50 accounting firm Sikich deploying Basis across practice lines, validate strong enterprise demand. Nonetheless, from an underwriting perspective, the $1.15 billion valuation carries significant forward execution risk given historical accounting technology automation failures, undisclosed contracted ARR, unverified realized gross margins, and opaque customer retention cohorts."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs: []
    figureRefs: []
