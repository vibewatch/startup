  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Professional Practice Liability
        blocks:
          - type: paragraph
            body: >-
              The deployment of autonomous AI agents across licensed accounting, tax, and audit practices introduces a
              complex layer of statutory liability and professional governance. In the United States, professional
              standards governed by the AICPA, state accountancy boards, and IRS Circular 230 place non-delegable legal
              responsibility on licensed practitioners. While Basis automates structured workpaper creation, trial
              balance mapping, and Form 1065 filings, software vendors cannot assume professional attest or preparer
              liabilities. Enterprise accounting firm partners require rigorous human-in-the-loop review policies
              because regulatory frameworks and clients mandate documented oversight of automated outputs. Customer
              agreements, exemplified by public disclaimers from firms such as Sikich, explicitly disclaim liability
              arising from third-party reliance on AI-generated content. Furthermore, maintaining compliance requires
              stringent data governance; Basis addresses this baseline through SOC 2 Type II certification and
              contractual assurances that client financial records remain in U.S. regions and are not used to train
              foundation models.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Execution, Model Routing, and Verification Controls
        blocks:
          - type: paragraph
            body: >-
              Operational reliability in accounting automation differs fundamentally from consumer or developer software
              because financial calculations demand zero tolerance for silent error propagation. Basis has engineered
              long-horizon autonomous agents designed to execute sustained, multi-hour workflows across accounting
              systems, including complex Form 1065 partnership returns that require intricate K-1 footnote extraction
              and schedule reconciliation. To mitigate reasoning hallucinations, the architecture incorporates
              multi-agent supervisory layers that trace source citations back to client documentation. However,
              independent industry reporting highlights that accounting firms are expanding artificial intelligence
              software budgets substantially faster than they are implementing formal oversight frameworks. In complex
              multi-step close procedures across heterogeneous enterprise ERP environments, unverified edge-case
              classifications or variance anomalies risk propagating into finalized ledgers unless firm review protocols
              enforce strict secondary verification.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
