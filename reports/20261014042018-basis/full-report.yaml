  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Architecture and Agentic Operating Model
        blocks:
          - type: paragraph
            body: >-
              Basis provides an agentic artificial intelligence platform designed specifically for certified public
              accountant firms and professional accounting teams. Rather than implementing a conversational chatbot that
              requires continuous user prompting or simple text-in, text-out assistance, Basis treats accounting
              operations as autonomous, multi-step workflows. The platform deploys goal-oriented artificial intelligence
              agents capable of ingesting financial source records, interpreting trial balances, categorizing
              transactions, preparing workpapers, and generating filing-ready tax returns. Each multi-step process
              operates under accountant supervision, ensuring that practitioners retain complete visibility and control
              over all calculations, mappings, and staged journal entries before posting to client ledgers. The platform
              was founded in 2023 by Matt Harp and Mitchell Troyanovsky and raised a $100 million Series B funding round
              in February 2026 at a $1.15 billion valuation to expand its multi-agent platform across professional
              services practices.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Accounting Workflows and Pre-Built Procedure Modules
        blocks:
          - type: paragraph
            body: >-
              The platform addresses critical operational bottlenecks across client accounting services, tax compliance,
              and audit support. In client accounting services, Basis connects directly to client general ledgers to
              perform automated write-ups, clean up messy ledgers, and stage journal entries with account codes,
              descriptions, and linked source documentation. For tax compliance practices, the platform extracts complex
              financial information at scale—such as partnership Schedule K-1 footnotes and passive versus non-passive
              allocations—while mapping book trial balances to tax lines and drafting Form 1065 partnership returns.
              Basis provides over 350 pre-built accounting Procedures crafted by internal accountants in residence,
              allowing firms to codify review preferences, materiality thresholds, and client-specific quirks into
              repeatable execution workflows. Practitioners review proposed entries in structured stages, eliminating
              tedious manual data transcription while preserving institutional review standards.
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
      - number: '5.3'
        title: Model Routing, Local Context Learning, and Tool Calling
        blocks:
          - type: paragraph
            body: >-
              Basis’s underlying technical architecture couples frontier reasoning models from OpenAI with deterministic
              accounting logic and entity-specific local context. Task execution begins with a supervising agent,
              originally built on OpenAI o3 and migrated to GPT-5, that evaluates incoming jobs and decomposes them into
              coordinated sub-agent workflows. The orchestrator routes specialized tasks across frontier models based on
              latency and complexity requirements, leveraging GPT-4.1 for speed-critical interaction loops and GPT-5 for
              deep multi-step reasoning, transaction disambiguation, and financial reconciliations. On internal
              benchmarks evaluating parallel tool execution with code interpreter and web search enabled, GPT-5 achieved
              a perfect 100 percent success rate in coordinating structured accounting actions. Rather than relying
              solely on global models that miss client-specific nuances, Basis crystallizes local entity rules, account
              mappings, and business conventions, compounding system precision as firms expand usage.
            claimRefs:
              - CE002
              - CE009
              - CE010
              - CE011
              - CE012
