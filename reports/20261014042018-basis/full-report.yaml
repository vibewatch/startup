        - Post-money Series B mark is $1.15B; ARR and unit economics undisclosed
        - Defer investment until audit data confirms ARR scale and retention
      - - Confidence
        - medium
        - High-conviction technical validation offset by opaque financial metrics
        - Sufficient evidence to identify leadership, insufficient for valuation
      - - Risk Rating
        - high
        - Extreme implied multiple (>50x ARR) and high execution liability
        - Down-round risk if outcomes monetization lags pilot expansion
      - - Valuation Stance
        - stretched
        - Enterprise multiple substantially exceeds vertical software benchmarks
        - Priced for flawless execution and hyper-growth through 2028
    notes: >-
      Summarizes core recommendation dimensions, confidence rating, risk rating, and decision implications as of October
      2026.
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV015
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Analytical Vector
      - Investment Thesis (Bull Perspective)
      - Anti-Thesis (Bear Perspective)
      - What Would Change the View
    rows:
      - - Market Demand & Labor Dynamics
        - >-
          Structural shortage of CPAs and 300,000 recent retirements create non-discretionary enterprise demand for
          automation
        - Firms exhibit cultural inertia and historical skepticism toward software automating core judgment tasks
        - Audit confirmation of firm-wide software adoption and expanding seat/workload deployment across Top 100 firms
      - - Product & Model Architecture
        - >-
          Proprietary multi-agent orchestration combining OpenAI GPT-5, o3, and o3-Pro achieves 20-50% practice
          efficiency
        - Underlying foundation model labs could absorb specialized reasoning or commoditize workflow wrappers
        - Documented technical defensibility via proprietary system integrations and patent/IP filings
      - - Commercial Model & Pricing
        - Outcomes-based pricing directly captures economic value of automated work rather than deflating token markups
        - Outcomes attribution is difficult to measure across complex workflows; slower sales velocity vs seat models
        - Audited net revenue retention figures and multi-year contract renewals under outcomes-based billing
      - - Enterprise Traction
        - Deployed across approximately 30% of Top 25 US accounting firms, including Top 100 IPA firm Sikich
        - Pilot engagements may be limited in scope and contract dollar commitment without proven full-firm expansion
        - Verified annual recurring revenue scale exceeding $30M and average contract value data
