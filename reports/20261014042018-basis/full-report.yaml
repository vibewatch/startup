      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Talent Strategy
        blocks:
          - type: paragraph
            body: >-
              Basis is led by co-founder and Chief Executive Officer Matthew Harpe alongside technical co-founder
              Mitchell Troyanovsky. Harpe brings a multidisciplinary background in economic analytics and healthcare
              operations from his prior work at Boston Consulting Group and SoftBank, providing domain insight into
              complex billing and compliance workflows. Troyanovsky leads the company technical architecture, focusing
              on probabilistic programming and autonomous multi-agent orchestration. Following the company Series B
              financing in February 2026, Basis expanded its corporate governance by appointing Miles Clements of Accel
              and Keith Rabois of Khosla Ventures to its board of directors. The company maintains an estimated
              workforce of 51 to 100 employees, with core research and machine learning engineering concentrated in New
              York City. Basis recruits heavily from leading research institutions, maintaining a dedicated internal
              operations group termed Atlas that deploys autonomous agents internally across company operations.
            claimRefs:
