      - number: '6.3'
        title: Production Deployments and Named Firm Case Proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence confirms that Basis has transitioned from preliminary proof-of-concept trials to
              production deployments across multiple prominent accounting firms. Confirmed enterprise and mid-market
              accounts include UHY LLC (a Top 25 US accounting firm), Boulay PLLP, Clark Nuber PS, MarksNelson LLC,
              Pinion LLC, and Wiss & Company, alongside boutique practices such as Whitcomb & Sheridan LLP. Client
              deployments span complex production workflows rather than isolated marketing pilots: accounting teams at
              Wiss & Company describe the platform as trajectory-defining in freeing professional staff from tedious
              manual reconciliations to focus on higher-margin advisory relationships. At mid-tier firms such as Pinion
              and Boulay, agents execute multi-step tax preparation schedules, audit testing procedures, and client
              write-ups, connecting directly to client general ledgers, QuickBooks, Xero, and enterprise resource
              planning systems. Human CPAs remain in an active supervisory loop, reviewing and approving agent-prepared
              workpapers and journal entries. However, because client accounts are managed under mutual non-disclosure
              agreements, the full distribution of seats, practice groups, and active client files remains partially
              undisclosed across top-tier accounts.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
