        title: Operational Milestones, Technical Execution, and Market Traction
        blocks:
          - type: paragraph
            body: >-
              Basis has established rapid commercial traction across the United States accounting market, securing
              deployments across approximately 30% of the Top 25 accounting firms, including prominent practices such as
              Boulay, Clark Nuber, MarksNelson, Pinion, and UHY. Deploying firms report measurable operational
