              - CR012
      - number: '7.4'
        title: Commercial Model Sustainability and Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              From a commercial standpoint, Basis has pursued an outcomes-based pricing structure tied to completed
              accounting deliverables rather than conventional per-seat licenses or pass-through token consumption. This
              approach aligns customer incentives with measurable automation value but introduces execution friction:
              verifying completed outcomes requires precise client attribution and consistent agent completion rates.
              While pure token-consumption models suffer margin compression as model API prices drop, outcomes-based
              contracts demand sustained technical performance to justify premium pricing. Investors evaluating Basis at
              its $1.15 billion valuation following its $100 million Series B raise must monitor specific thesis-break
              triggers. Key monitoring indicators include enterprise contract churn following mandatory tax season
              audits, partner pushback on AI error indemnification terms, and any defensive API gating or native agent
              competition introduced by dominant accounting software incumbents.
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sole Provider Dependency on OpenAI Reasoning Models
            body: >-
              Basis's supervisory orchestration and long-horizon multi-step reasoning rely heavily on OpenAI models
              including GPT-5 and o3-series architectures. While multi-model routing is advertised for sub-agents, the
              supervisory tier's tight coupling to OpenAI creates acute exposure to upstream API latency spikes, price
              changes, or terms of service shifts in professional services automation.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The bull investment thesis for Basis rests on structural secular tailwinds in professional accounting: a
              severe demographic shortage of qualified certified public accountants combined with immense repetitive
              manual compliance workloads across Client Advisory Services (CAS), tax compliance, and audit preparation.
              Basis has built an autonomous agentic architecture designed specifically to execute end-to-end multi-step
              procedures rather than generic conversational chatbots, leveraging leading foundation models including
              OpenAI GPT-5, o3, o3-Pro, and GPT-4.1. By adopting an outcomes-based pricing philosophy where accounting
              firms pay for completed deliverables rather than seat licenses or metered token usage, Basis directly
              aligns software spend with firm billables and gross margin expansion. Early enterprise validation is
              substantiated by partnerships across approximately 30% of the top 25 US accounting firms, including Top
              100 IPA firm Sikich.


              Conversely, the critical anti-thesis centers on extreme valuation multiples detached from disclosed
              recurring revenue fundamentals, coupled with execution and model liability risks. Although Basis completed
              a $100 million Series B round in February 2026 valuing the entity at $1.15 billion, the company has not
              publicly disclosed annual recurring revenue (ARR), gross retention, net revenue retention (NRR), or gross
              margins. Furthermore, accounting workflows carry strict regulatory standards, liability for tax return
              errors, and complex review requirements where any silent hallucination or mapping failure in partnership
              tax returns or financial statements risks firm disengagement. Historical attempts by earlier
              venture-backed accounting automation startups over the past five to seven years encountered severe
              customer skepticism and plateaued before achieving sustainable workflow delegation, underscoring the risk
              of multiple compression if adoption fails to scale into firm-wide contract commitments.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: Financing Context and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Basis has raised a cumulative $138 million across three institutional venture capital rounds since its
              founding in 2023. The capitalization history includes an initial $3.6 million Seed round in October 2023,
              followed by a $34 million Series A round in December 2024, and culminating in the marquee $100 million
              Series B financing announced on February 24, 2026. The Series B round was led by premier venture capital
              firm Accel, with significant participation from GV (Google Ventures), existing lead investor Khosla
              Ventures, and former Goldman Sachs Chief Executive Lloyd Blankfein. This financing established an implied
              post-money valuation of $1.15 billion, conferring unicorn status upon the company within three years of
              inception.


              From an entry discipline perspective, the $1.15 billion valuation benchmark presents an elevated hurdle
              for prospective growth-stage investors. In the absence of disclosed ARR figures, even under generous
              private market estimates of $10 million to $20 million in annualized run-rate software revenue, the entry
              multiple ranges between 57.5x and 115x ARR. This represents a substantial premium over publicly traded
              vertical software and tax compliance peers, which trade at median enterprise value multiples of 6x to 12x
              revenue. While the capitalization table exhibits high-pedigree syndicate sponsorship with substantial dry
              powder, downstream liquidation preference overhang and dilution from the $100 million infusion necessitate
              exceptional revenue compounding and sustained software gross margins to avoid down-round risk or
              structured secondary discounts in subsequent funding rounds.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Scenario Valuation Modeling and Exit Outlook
        blocks:
          - type: paragraph
            body: >
              To evaluate whether public evidence supports the prevailing $1.15 billion valuation, we synthesize bull,
              base, and bear operating scenarios projecting performance through FY2028. In the bull case, Basis
              successfully deepens penetration across the Top 150 US accounting firms, expanding its outcomes-based
              pricing from initial CAS pilot engagements into comprehensive firm-wide tax workpaper and audit
              deployments. Under this scenario, Basis scales to $100 million in ARR by 2028 with 75% software gross
              margins, supporting a $2.5 billion valuation at a 25x revenue multiple upon public market flotation or
              strategic acquisition by financial software incumbents such as Intuit or Thomson Reuters.


              In the base case, Basis achieves steady but measured enterprise adoption, reaching $45 million in ARR by
              2028 as accounting firms maintain human review loops and restrict autonomous agent operations to
              structured CAS reconciliations and trial balance mapping. Valued at a market-standard 16x forward ARR
              multiple, the resulting enterprise value of $720 million falls below the February 2026 post-money mark,
              highlighting meaningful multiple compression and flat-to-down exit valuations. In the bear scenario,
              persistent customer skepticism, foundational model commoditization, or regulatory scrutiny surrounding
              autonomous tax preparation limits enterprise rollout, stranding ARR at $18 million. Applying an 8x
              multiple yields an enterprise valuation of $144 million, representing an 87% impairment from the Series B
              peak. Consequently, our valuation stance remains stretched and our recommendation is research-more pending
              verified commercial ARR audit data.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Verdict: Research-More with Stretched Valuation Stance'
            body: >-
              Basis has demonstrated category-leading technical execution by deploying autonomous multi-agent workflows
              into 30% of Top 25 US accounting firms. However, committing growth capital at a $1.15 billion valuation
              without verified recurring revenue, gross margin, or contract expansion metrics creates unacceptable risk
              of multiple compression. We recommend research-more and tracking pilot-to-production conversion.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
              - CV015
          - type: callout
            title: 'Valuation Vulnerability: Absence of Disclosed Revenue Fundamentals'
            body: >-
              With $138 million raised and a $1.15 billion post-money mark, Basis carries an implied revenue multiple
              far above mature vertical software peers. Historical precedent shows earlier automated accounting startups
              stumbled on edge cases and liability. Without disclosed ARR or net retention data, the risk of a
              down-round or valuation overhang in subsequent financings is substantial.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
