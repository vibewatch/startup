              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid Penetration in Top-Tier US Accounting Practices
            body: >-
              Basis has secured adoption across approximately 30% of the Top 25 and 25% of the Top 150 US accounting
              firms within two years of founding, establishing a formidable beachhead in an industry historically
              resistant to software vendor switching.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Absence of Audited Retention and Expansion Metrics
            body: >-
              Despite high-profile customer references, neither Basis nor its customers have publicly reported audited
              Net Revenue Retention (NRR), gross renewal rates, or multi-year contract durations, leaving long-term
              software durability and expansion velocity unverified.
            calloutType: risk
            claimRefs:
