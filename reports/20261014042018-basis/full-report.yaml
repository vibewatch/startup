      - number: '1.3'
        title: Capitalization History, Series B Valuation, and Institutional Investor Base
        blocks:
          - type: paragraph
            body: >-
              In February 2026, Basis achieved unicorn status after closing a $100 million Series B financing round at a
              post-money valuation of $1.15 billion. This round elevated the company cumulative equity funding to
              approximately $138 million, following an initial $3.6 million seed round and a $34 million Series A round
              completed in December 2024. The Series B was led by Accel, with substantial participation from GV
              (formerly Google Ventures), existing backer Khosla Ventures, and former Goldman Sachs Chairman Lloyd
              Blankfein. The financing also attracted a prominent syndicate of technology executives and angel
              investors, including Aaron Levie of Box, Adam D'Angelo of Quora, Amjad Masad of Replit, and Nat Friedman.
              Basis rapid capital accumulation reflects growing investor conviction that vertical AI agents in
              high-stakes regulated knowledge work deliver defensible enterprise software value.
