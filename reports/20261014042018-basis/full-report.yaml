      - number: '5.4'
        title: Auditability, Deterministic Guardrails, and Risk Controls
        blocks:
          - type: paragraph
            body: >-
              In regulated accounting and audit environments, accuracy, auditability, and data security represent
              non-negotiable operational requirements. Basis enforces strict rules-based accounting constraints
              alongside foundation model reasoning, ensuring that agents cannot reason freely outside established tax
              codes, debit-credit balance constraints, and firm-specific approval parameters. Every figure, journal
              adjustment, and tax line generated by the platform links directly to its underlying source documentation
              with an immutable action log and confidence scoring. Cloud deployment integrates with accounting firm file
              stores and general ledgers without storing client credentials on Basis servers. However, because Basis
              operates autonomously rather than in an assistive mode, platform reliability depends fundamentally on
              upstream foundation model precision, and the absence of a public self-serve application programming
              interface concentrates deployment support on direct enterprise engagements.
            claimRefs:
              - CE003
              - CE004
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow Delegation Rather Than Conversational Assistance
            body: >-
              Unlike conversational chatbots that assist users inside office documents, Basis architecturally treats
              accounting as an end-to-end multi-step workflow, decoupling execution from manual prompting while
              enforcing review gates.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
          - type: callout
            title: Foundation Model Dependency and Frontier API Exposure
            body: >-
              Basis multi-agent routing heavily concentrates operational reliance on OpenAI frontier models, creating
              potential exposure to upstream API latency, model version updates, and unannounced behavioral shifts.
            calloutType: risk
            claimRefs:
              - CE002
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Accounting Firm Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              Basis focuses its go-to-market strategy specifically on professional accounting firms rather than
              enterprise accounts payable departments or generic internal corporate finance teams. Within the accounting
              profession, the company segments its addressable customer base into three primary tiers: Top 25 national
              accounting firms, Top 150 regional and mid-tier practices, and boutique small accounting firms. The core
              economic buyer across all segments is the firm managing partner or practice leader, while senior CPAs and
              staff accountants serve as the primary daily users. Payer authority is funded from firm operating and
              technology budgets, driven by a structural talent crisis across the United States where retiring CPAs
              outnumber new entrants. By targeting client accounting services (CAS), tax return preparation, and audit
              testing workflows simultaneously within a unified platform, Basis captures multi-practice budget
              allocations rather than competing as a point solution. Enterprise AP departments are intentionally
              excluded to avoid commoditized ERP optical character recognition competition, allowing the platform to
              tailor its procedures to external client accounting engagements.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU010
      - number: '6.2'
        title: Adoption Trajectory, Capacity Expansion, and Efficiency Proof
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory for Basis has accelerated rapidly since its 2023 founding, fueled by acute
              industry-wide CPA labor shortages and intense busy-season workload compression. Independent reporting from
              Reuters and venture disclosures confirm that Basis currently serves approximately 30% of the top 25
              accounting firms in the United States—representing roughly seven national firms—alongside approximately
              25% of the top 150 regional accounting firms. Practitioner adoption is underpinned by substantial
              efficiency gains across core compliance processes: partner studies and customer reports document an
              average of up to 30% time savings across routine tasks, with broader workflow gains ranging between 20%
              and 50% across practices. For smaller accounting practices, sole practitioners and managing partners
              report recapturing 10 to 20 hours per week, compressing multi-hour review tasks to thirty minutes. To
              accelerate deployment velocity and reduce initial implementation friction, Basis equips accounting teams
              with more than 350 pre-built accounting procedures authored by in-house accountants in residence,
              facilitating immediate trial balance mapping and K-1 footnote extraction without custom software
              engineering.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU008
          - type: table
            tableRef: TU002
