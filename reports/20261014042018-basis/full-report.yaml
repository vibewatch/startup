              - CU009
      - number: '6.4'
        title: Customer Journey, Expansion Dynamics, and Retention Risks
        blocks:
          - type: paragraph
            body: >-
              The long-term commercial durability of Basis depends on its land-and-expand trajectory across firm
              practice areas and the sustainability of its outcomes-based pricing model. Accounting firms typically
              initiate engagement within client accounting services (CAS) for monthly close reconciliations before
              expanding into seasonal tax return preparation and audit testing. Unlike prevailing software vendors that
              charge seat-based subscription fees or mark up raw model tokens, Basis prices engagements based on
              completed accounting outcomes, aligning customer expense directly with delivered firm revenue.
              Nevertheless, significant diligence risks persist regarding customer concentration and long-term
              retention. Because accounting partners bear personal regulatory and legal liability for filed tax returns
              and certified audit workpapers, any agent hallucination or procedural error creates severe liability risks
              that software code generation tools do not face. Furthermore, Basis has disclosed neither annual recurring
              revenue (ARR) nor customer retention metrics such as Net Revenue Retention (NRR) or gross renewal rates,
              leaving open whether early Top 25 penetration represents durable multi-year commitments or volatile
              seasonal trial software usage.
            claimRefs:
              - CU007
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
