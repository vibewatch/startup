        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Basis differentiates its commercial model from traditional horizontal SaaS and vertical accounting
              software by rejecting per-seat subscription licenses in favor of outcomes-based monetization. Rather than
              charging accounting firms based on user headcount or raw compute token consumption, Basis bills firms
              based on verified accounting work completed across client accounting services, tax compliance, and audit
              workflows. This model directly addresses the structural economics of professional services firms, where
              client billing is tied to deliverable output rather than software seat utilization. The platform packages
              over 350 pre-built accounting procedures developed by in-house accountants in residence, enabling
              firm-wide adoption across entire practice areas. Early commercialization required discipline, as Basis
              accepted slower initial revenue growth to establish precise deliverable attribution and ensure commercial
              incentives remain tightly aligned with accounting throughput.
