  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Six-stage adoption lifecycle from CPA staffing constraint discovery to firmwide procedure codification and
      outcomes renewal.
    data:
      items:
        - label: 'Stage 1: Staffing Constraint Discovery'
          stage: Discovery
          touchpoints:
            - Managing partner inquiry
            - Webinar demonstration
          description: >-
            Accounting firm leadership recognizes acute CPA hiring shortages and tax-season workload compression that
            cannot be solved through traditional recruiting.
        - label: 'Stage 2: Sandbox Evaluation & Mapping'
          stage: Pilot
          touchpoints:
            - Sample client GL ingestion
            - Trial balance mapping test
          description: >-
            Firm practice leads run controlled pilot evaluations on prior-year client datasets, verifying accuracy of
            trial balance mapping and workpaper drafting.
        - label: 'Stage 3: Supervised CAS Production Rollout'
          stage: Deployment
          touchpoints:
            - Live ledger connection
            - Journal entry review queue
          description: >-
            Firm deploys agents into live client accounting services; human accountants transition from manual data
            entry to supervisory reviewers.
        - label: 'Stage 4: Cross-Practice Expansion'
          stage: Expansion
          touchpoints:
            - Tax return prep module
            - Audit testing procedures
          description: >-
            Successful CAS results prompt expansion into seasonal tax preparation (1065 schedules) and audit testing
            procedures across additional practice groups.
        - label: 'Stage 5: Firm-Specific Procedure Codification'
          stage: Customization
          touchpoints:
            - 350+ procedure library
            - Custom rule drafting
          description: >-
            Firm codifies proprietary accounting conventions and client nuances into firmwide procedures, deepening
            vendor lock-in and workflow stickiness.
        - label: 'Stage 6: Enterprise Renewal & Outcomes Economics'
          stage: Durability
          touchpoints:
            - Outcomes attribution review
            - Multi-year contract renewal
          description: >-
            Firm transitions to mature commercial contract where billing ties to automated work output rather than seat
            count, integrating Basis into firm economics.
    claimRefs:
      - CU003
      - CU007
      - CU011
