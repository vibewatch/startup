  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: >-
      Six-tier architectural stack illustrating Basis multi-agent orchestration, model routing, deterministic rules, and
      enterprise integration boundaries.
    data:
      layers:
        - label: User Interaction & Oversight Layer
          detail: Web workspace for CPAs to assign goals, inspect cited workpapers, and approve staged journal entries
          modules:
