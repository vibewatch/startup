            - Workpaper Inspection & Review Console
            - Audit Log & Confidence Score Viewer
        - label: Supervising Orchestration Layer
          detail: Goal decomposition engine coordinating multi-step accounting workflows across specialized sub-agents
          modules:
            - Goal Decomposer & Planner
            - Parallel Tool Calling Coordinator
            - Review Threshold Dispatcher
        - label: Specialized Sub-Agent Layer
          detail: Domain-specific autonomous agents executing discrete accounting, tax, and audit procedures
          modules:
            - CAS & Reconciliation Agent
            - Tax Extraction & 1065 Filing Agent
            - Audit Trail & Verification Agent
        - label: Model Routing & Inference Layer
          detail: Multi-model routing assigning specialized frontier LLMs based on task complexity and latency
          modules:
            - OpenAI GPT-5 for Deep Reasoning
            - OpenAI GPT-4.1 for Low-Latency Interaction
            - Internal Benchmark Routing Controller
        - label: Accounting Rules & Local Context Layer
          detail: Deterministic guardrails combining 350+ accounting Procedures with firm- and client-specific learning
          modules:
            - 350+ Pre-built Accounting Procedures
            - Local Firm Context Crystallization
            - Rules-Based Validation Constraints
        - label: Data & Enterprise Integration Layer
          detail: Secure ledger connectors and document ingestion pipes operating without client credential storage
          modules:
