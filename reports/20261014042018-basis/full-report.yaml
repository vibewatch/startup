      - number: '7.3'
        title: Upstream Model Concentration and Accounting Firm Dependencies
        blocks:
          - type: paragraph
            body: >-
              Basis exhibits substantial architectural dependency on third-party foundational model infrastructure,
              primarily OpenAI. The platform relies on a supervisory agent migrated from OpenAI o3 to GPT-5 to direct
              end-to-end task delegation and evaluate reasoning consistency. Lightweight sub-agents leverage GPT-4.1 for
              low-latency queries while high-context operations like month-end reconciliations route back to GPT-5.
              While this tight alignment enables Basis to capture frontier reasoning advances rapidly, it leaves the
              platform acutely exposed to OpenAI service outages, API rate limits, and model behavior drifts during peak
              tax seasons. On the customer side, adoption is heavily concentrated among top accounting practices: while
              Basis reports deployments across approximately 40 percent of the top 25 U.S. accounting firms and key
              clients like Sikich deploy the tool across thousands of team members, independent reviews note that
              firm-level penetration does not equate to pervasive individual seat utilization across all practice areas.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
