  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Agentic Accounting Workflows vs. Status-Quo Software'
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Basis is defined by the end-to-end execution of complex accounting procedures
              across client accounting services (CAS), corporate tax compliance, and audit preparation. Unlike
              horizontal general ledgers or point bookkeeping utilities such as QuickBooks, Xero, or NetSuite that
              require human accountants to manually enter transactions and reconcile statements, Basis automates
              multi-step workflows autonomously. The platform targets mid-market and enterprise public accounting
              practices as well as corporate finance organizations seeking to scale client volume without adding
              headcount. Included spend encompasses workflow automation, tax workbook preparation, and trial balance
              mapping, while excluding general-purpose ERP licenses and core database hosting. This boundary positions
              Basis directly against manual labor hours rather than existing software seat budgets.
            claimRefs:
              - CM001
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM012
      - number: '2.2'
        title: 'Addressable Market Sizing: Multi-Lens Sizing Across Practice Areas'
        blocks:
          - type: paragraph
            body: >-
              Market sizing for agentic accounting platforms cannot be captured by a single top-down software figure
              because the technology displaces manual professional services hours. Across the United States, roughly 3
              million accountants generate over $150 billion in gross professional services revenue. The serviceable
              market is concentrated in accounting firms where routine compliance work, monthly closing, and tax
              preparation consume up to 70% of professional staff hours. Software and external automation budgets within
              this labor pool represent an addressable software market of $15 billion to $20 billion annually. Basis
              focuses on the Top 150 accounting firms and regional practices, where early deployments across Top 25
              accounting firms validate immediate willingness to pay for scalable capacity. Investor confidence was
              reinforced in February 2026 with a $100 million Series B round at a $1.15 billion valuation led by Accel
              and GV.
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM013
      - number: '2.3'
        title: Buyer Personas, Practice Segmentation, and Procurement Mechanics
        blocks:
          - type: paragraph
            body: >-
              Adoption dynamics vary significantly across accounting firm size tiers and practice groups. In Top 25 and
              large national accounting firms, economic buyers are managing partners, practice leaders, and national
              managing partners who oversee CAS, tax, or advisory service lines. Procurement frequently involves dual
              governance structures due to alternative practice models separating licensed attest partnerships from
              advisory corporate entities. In mid-market and regional firms, managing partners prioritize capacity
              release to avoid turning away client engagements during peak tax deadlines. Basis aligns its commercial
              model with firm economics by employing outcomes-based pricing tied to completed accounting procedures and
              deliverables rather than per-seat licensing, mitigating firm concerns over software license shelfware.
            claimRefs:
              - CM005
              - CM007
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM010
      - number: '2.4'
        title: 'Adoption Drivers and Constraints: Demographic Headwinds vs. Regulatory Verification'
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver for agentic accounting adoption is an acute, structural demographic crisis
              across the accounting profession. With approximately 300,000 accountants retiring within a two-year window
              and an estimated 75% of practitioners retiring over the coming decade, firms cannot hire enough CPAs to
              fulfill compliance demand. Autonomous agents that execute multi-step closes and tax returns deliver
              documented time savings of up to 30%, unlocking critical operational capacity. However, adoption is
              bounded by strict professional liability, AICPA standards, and circular review mandates. Because CPAs sign
              tax returns and attest opinions under legal penalty, AI platforms must provide transparent audit trails,
              source citations, and confidence scores rather than black-box outputs. Furthermore, audited commercial
              disclosures regarding customer retention and gross margins remain an open diligence gap.
            claimRefs:
              - CM003
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Accountant Retirement Wave Replaces Incremental IT Replacement Cycles
            body: >-
              The retirement of roughly 300,000 accountants within a two-year window and an anticipated 75% exit over
              the next decade shifts AI adoption from discretionary productivity software to essential operational
              survival for partner-led practices.
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
          - type: callout
            title: Strict Liability and AICPA Standards Preclude Fully Autonomous Execution
            body: >-
              Because accounting and attest opinions carry partner liability and strict regulatory oversight, agentic
              systems must maintain granular audit logs, source provenance, and confidence scores so practitioners
              retain review control.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Paradigms
        blocks:
          - type: paragraph
            body: >
              The competitive landscape surrounding Basis spans five distinct alternatives: legacy accounting software
              and ERP suites, emerging vertical accounting AI agents, general-purpose foundation model labs, offshore
              staffing networks, and entrenched status-quo manual workflows. Incumbent software providers such as
              Intuit, Thomson Reuters, Wolters Kluwer, and major enterprise ERPs maintain entrenched records systems and
              client accounting data, yet their historical architectures remain centered on deterministic rule engines,
              forms processing, and workflow management rather than autonomous agentic execution. Thomson Reuters
              Institute research indicates that professional services have transitioned from exploratory generative
              experimentation into a strategic deployment phase where firms demand deep workflow automation directly
              integrated into operational strategy. Concurrently, general-purpose foundation labs like OpenAI continue
              to advance raw test-time compute, reasoning models, and tool-calling execution. However, specialized
              accounting workflows require fine-grained integrations into diverse general ledgers, multi-step
              verification against primary source workpapers, and local firm conventions. In response to severe
              accountant labor shortages and partner burnout, accounting firms evaluate whether to adopt specialized
              agent platforms like Basis, experiment with internal scripts wrapping frontier models, or rely on
              status-quo manual preparation supported by offshore teams.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: Competitor Profiles, Technical Capabilities, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              Diligence across alternative approaches reveals sharp divergences in technical architecture,
              specialization, and defensibility. General-purpose model labs provide frontier reasoning power—such as
              OpenAI o3, o3-Pro, GPT-4.1, and GPT-5—which Basis itself leverages as modular underlying components rather
              than competing as a foundation model provider. Basis argues that frontier labs naturally commercialize
              adjacent broad knowledge tasks like search, document generation, and basic spreadsheet manipulations,
              leaving complex domain-specific financial controls and accounting procedures defensible for vertical
              specialists. Meanwhile, legacy suites offer deterministic calculation and compliance filing modules, but
              require continuous human manual input to bridge disconnected unstructured documents, trial balances, and
              schedule adjustments. In contrast, Basis deploys a supervising agent that orchestrates multi-agent
              delegation across specialized sub-agents, cites every numerical deliverable to its primary source
              document, and provides over 350 pre-built accounting Procedures designed by accountants in residence. This
              architecture enables Basis to achieve enterprise adoption across approximately 30 percent of the top 25
              United States accounting firms, including partnerships with Baker Tilly and Sikich, and deployment across
              approximately 25 percent of the top 150 firms. Nevertheless, long-term moat durability faces pressure if
              foundation model labs enhance native system-of-record tooling or if legacy vendors aggressively integrate
              agentic capabilities natively into incumbent practice management software.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP008
      - number: '3.3'
        title: Switching Costs, Lock-in, and Adverse Competitive Risks
        blocks:
          - type: paragraph
            body: >
              Switching costs and procurement dynamics in the accounting vertical present meaningful barriers to entry
              alongside distinct adoption risks. Accounting firms face significant risk aversion due to regulatory
              liability, partner sign-off requirements, and stringent client confidentiality obligations. Once a
              professional firm embeds custom Procedures, historical trial balance mappings, and client-specific context
              into an agent platform, procedural lock-in increases steadily over time. Furthermore, Basis enforces
              enterprise compliance through SOC 2 Type II, ISO 27001, and ISO 42001 certifications, US infrastructure
              hosting, and an explicit policy of zero client data model training. However, independent evaluations by
              industry monitors like RECATOOLS highlight notable operational limitations: Basis provides no transparent
              public pricing list, restricts access behind enterprise demo waitlists, hosts infrastructure strictly
              within United States regions, and designs its published case studies primarily around United States tax
              and audit conventions such as Form 1065 partnership returns and K-1 aggregation. For international firms
              and multi-jurisdictional practices, this creates an adoption barrier. Furthermore, reliance on proprietary
              foundation model APIs creates a dual risk of platform dependency and upstream model cost shifts, while
              vendor outcome-based pricing models remain subject to negotiation and enterprise contract scrutiny.
            claimRefs:
              - CP003
              - CP006
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Foundation Lab Threat Boundary
            body: >-
              Basis navigates competitive risk from major LLM labs by positioning its software above the model commodity
              layer. Large AI labs focus on general-purpose capabilities across text, coding, and generic productivity,
              whereas professional accounting requires deep general ledger integrations, strict audit paper trails, and
              compliance with statutory filing frameworks that generalist labs are unlikely to engineer directly.
            calloutType: insight
            claimRefs:
              - CP004
              - CP007
              - CP011
          - type: callout
            title: Enterprise Distribution and International Expansion Barriers
            body: >-
              While Basis has penetrated roughly 30 percent of the top 25 US accounting firms, its near-term expansion
              is constrained by closed pricing, US-only data residency, and workflows engineered around US tax returns.
              Incumbent software vendors possessing global accounting distribution could counter-attack if they
              integrate competent agentic capabilities before Basis globalizes its platform.
            calloutType: risk
            claimRefs:
              - CP001
              - CP003
              - CP014
              - CP015
