chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Mission, and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              Basis is a New York-based enterprise software company founded in 2023 by Matthew Harpe and Mitchell
              Troyanovsky. The company operates as a growth-stage private developer of agentic artificial intelligence
              systems designed to automate end-to-end accounting workflows for professional services firms. Unlike
              conversational chat interfaces or narrow task-specific point tools, Basis deploys autonomous agents
              capable of executing multi-hour procedures across client accounting services (CAS), tax preparation, and
              audit testing. The company core mission centers on alleviating structural labor shortages within the
              accounting profession, where retiring certified public accountants significantly outnumber new entrants.
              Basis positions its software to transition accountants from manual preparers into reviewers, expanding
              firm revenue capacity while operating on an outcomes-based pricing structure aligned with delivered work
              rather than traditional per-seat licensing.
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
