evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements, contractual ARR, revenue run-rate, gross margin percentage, and customer contract
      counts.
    whyItMatters: >-
      Without audited ARR and margin figures, valuation multiples and software economics cannot be independently
      validated against public SaaS benchmarks.
    diligencePath: >-
      Request customer contract schedules, revenue recognition workpapers, and audited 2025/2026 GAAP financial
      statements under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing-economics
    missingEvidence: >-
      Audited annualized recurring revenue (ARR), customer concentration percentages, average contract duration, and
      gross margins across top-25 versus small accounting firm cohorts.
    whyItMatters: >-
      Without segmented ARR and contract length disclosures, it is impossible to verify whether reported customer
      expansion reflects enterprise-wide licenses or small exploratory pilots.
    diligencePath: >-
      Request customer cohort retention schedules, ACV breakdown by firm tier, and services-to-software revenue ratios
      under diligence NDA.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: gross-margin-benchmarks
    missingEvidence: >-
      Audited gross margin data, token inference expense breakdowns across OpenAI models, and cloud infrastructure cost
      of goods sold.
    whyItMatters: >-
      Without audited COGS and gross margins, underwriters cannot verify whether outcomes-based pricing produces durable
      software-like gross margins above 70% or service-like margins.
    diligencePath: >-
      Request management's monthly hosting and API billing schedules, model routing token expenses, and unit-level gross
      margin calculations for CAS and tax workflows.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-metrics-and-arr
    missingEvidence: >-
      Contracted Annual Recurring Revenue (ARR), realized revenue run rate, net revenue retention (NRR), and customer
      concentration across top accounting firms.
    whyItMatters: >-
      Valuing Basis at $1.15 billion requires understanding actual revenue scale, expansion velocity, and contract
      duration rather than headline funding and logo counts.
    diligencePath: >-
      Obtain confidential customer contract schedules, cohort retention analyses, and trailing twelve-month revenue
      figures under non-disclosure agreement.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: technical-error-rates-and-model-dependencies
    missingEvidence: >-
      Empirical data on human override rates, benchmark error frequencies in tax/audit filings, and failover protocols
      for upstream foundation model outages.
    whyItMatters: >-
      Because Basis delegates autonomous multi-step accounting workflows to upstream frontier LLMs, undocumented failure
      rates or upstream API latencies directly impact accounting firm liability and regulatory filing accuracy.
    diligencePath: >-
      Request production exception logs, human-in-the-loop override percentages across client accounting services, and
      SLA agreements for OpenAI API dependencies during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion-metrics
    missingEvidence: >-
      Audited customer renewal rates, cohort net revenue retention (NRR), gross revenue retention (GRR), and average
      contract length across top-25 and mid-tier firm cohorts.
    whyItMatters: >-
      Without retention and expansion disclosures, it is impossible to verify whether early Top 25 accounting firm
      pilots convert into durable, expanding multi-year enterprise contracts or suffer from high post-tax-season churn.
    diligencePath: >-
      Request cohort-level retention data, annual contract value (ACV) distributions, and historical logo churn figures
      under NDA during management diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive roster of all approximately 7 Top 25 accounting firm customers and full Top 150 firm deployments
      currently active on the platform.
    whyItMatters: >-
      Public sources name only 6 major firms (Boulay, Clark Nuber, MarksNelson, Pinion, UHY, Wiss) and one boutique
      firm, leaving the remaining enterprise accounting clients undisclosed under mutual non-disclosure agreements.
    diligencePath: >-
      Review reference client list and case study disclosures in vendor data room or conduct blind customer reference
      calls with partner CPAs.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: Contractual Liability and Audit Indemnification Terms
    missingEvidence: >-
      Direct inspection of standard enterprise customer master service agreements (MSAs), specifically warranty
      disclaimers, error liability caps, and AICPA compliance indemnities.
    whyItMatters: >-
      Without public contract terms, investors cannot determine whether Basis or its accounting firm customers bear
      ultimate legal and financial liability for automated filing inaccuracies.
    diligencePath: >-
      Request standard MSA and Business Associate Agreement / DPA templates during confirmatory legal diligence,
      reviewing limitation of liability clauses.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: Regulatory / legal risk register
    missingEvidence: >-
      State-by-state catalog of accountancy board rulings regarding unlicensed software performing substantive tax
      workpaper preparation and attest testing.
    whyItMatters: >-
      State boards may introduce varying restrictions on non-CPA software systems performing direct audit tests,
      impacting multi-state accounting firm rollouts.
    diligencePath: >-
      Monitor NASBA and state CPA society legislative tracking committees for emerging restrictions on automated agentic
      workpapers.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial disclosure of current annual recurring revenue (ARR), revenue run-rate, and services revenue mix
      backing the February 2026 valuation.
    whyItMatters: >-
      Without verified ARR or revenue run-rate, determining whether the $1.15 billion valuation multiple is defensible
      vs historical vertical SaaS comps remains impossible.
    diligencePath: >-
      Request confidential CFO financial summary, audited income statement, and current ARR schedule during formal
      investment committee diligence.
    relatedQuestionRefs:
      - QV001
      - QV004
      - QV008
