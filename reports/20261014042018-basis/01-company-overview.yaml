callouts:
  - calloutType: insight
    title: Agentic Architecture vs. Generative Copilots
    body: Basis differentiates itself from conventional AI copilots by constructing long-horizon autonomous workflows rather than prompt-response chat interfaces. By leveraging multi-agent orchestration and outcomes-based commercial models, the firm aligns its economics directly with professional services throughput.
    claimRefs:
      - CO002
      - CO008
      - CO013
