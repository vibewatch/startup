company:
  name: Basis
chapter:
  number: 1
  title: Company Overview
  summary: Basis is an agentic AI accounting platform founded in 2023 that reached a $1.15 billion valuation in February 2026 following a $100 million Series B led by Accel. Deployed across approximately 30% of the top 25 U.S. accounting firms, the company automates complex tax, audit, and client accounting workflows, though private financial metrics including ARR and gross margins remain undisclosed.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity, Operating Mission, and Core Business Model
    body: Basis is a New York-based enterprise software company founded in 2023 by Matthew Harpe and Mitchell Troyanovsky. The company operates as a growth-stage private developer of agentic artificial intelligence systems designed to automate end-to-end accounting workflows for professional services firms. Unlike conversational chat interfaces or narrow task-specific point tools, Basis deploys autonomous agents capable of executing multi-hour procedures across client accounting services (CAS), tax preparation, and audit testing. The company core mission centers on alleviating structural labor shortages within the accounting profession, where retiring certified public accountants significantly outnumber new entrants. Basis positions its software to transition accountants from manual preparers into reviewers, expanding firm revenue capacity while operating on an outcomes-based pricing structure aligned with delivered work rather than traditional per-seat licensing.
    claimRefs:
      - CO001
      - CO002
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership, Governance Structure, and Talent Strategy
    body: Basis is led by co-founder and Chief Executive Officer Matthew Harpe alongside technical co-founder Mitchell Troyanovsky. Harpe brings a multidisciplinary background in economic analytics and healthcare operations from his prior work at Boston Consulting Group and SoftBank, providing domain insight into complex billing and compliance workflows. Troyanovsky leads the company technical architecture, focusing on probabilistic programming and autonomous multi-agent orchestration. Following the company Series B financing in February 2026, Basis expanded its corporate governance by appointing Miles Clements of Accel and Keith Rabois of Khosla Ventures to its board of directors. The company maintains an estimated workforce of 51 to 100 employees, with core research and machine learning engineering concentrated in New York City. Basis recruits heavily from leading research institutions, maintaining a dedicated internal operations group termed Atlas that deploys autonomous agents internally across company operations.
    claimRefs:
      - CO001
      - CO006
      - CO012
      - CO015
    tableRefs:
      - TO002
  - id: capitalization-and-investors
    title: Capitalization History, Series B Valuation, and Institutional Investor Base
    body: In February 2026, Basis achieved unicorn status after closing a $100 million Series B financing round at a post-money valuation of $1.15 billion. This round elevated the company cumulative equity funding to approximately $138 million, following an initial $3.6 million seed round and a $34 million Series A round completed in December 2024. The Series B was led by Accel, with substantial participation from GV (formerly Google Ventures), existing backer Khosla Ventures, and former Goldman Sachs Chairman Lloyd Blankfein. The financing also attracted a prominent syndicate of technology executives and angel investors, including Aaron Levie of Box, Adam D'Angelo of Quora, Amjad Masad of Replit, and Nat Friedman. Basis rapid capital accumulation reflects growing investor conviction that vertical AI agents in high-stakes regulated knowledge work deliver defensible enterprise software value.
    claimRefs:
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO003
  - id: operational-milestones-and-market-traction
    title: Operational Milestones, Technical Execution, and Market Traction
    body: Basis has established rapid commercial traction across the United States accounting market, securing deployments across approximately 30% of the Top 25 accounting firms, including prominent practices such as Boulay, Clark Nuber, MarksNelson, Pinion, and UHY. Deploying firms report measurable operational efficiency gains of 20% to 50% across CAS, tax, and audit engagements, enabling firms to expand service capacity without proportional hiring. From a technical standpoint, Basis coordinates specialized sub-agents powered by foundation models from partner OpenAI, including GPT-4.1, GPT-5, o3, and o3-Pro. A key product milestone was achieved in early 2026 when Basis demonstrated an AI agent capable of autonomously completing an end-to-end Form 1065 partnership tax return, establishing proof of concept for autonomous execution in high-complexity tax compliance.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
    figureRefs:
      - FO001
  - id: adverse-industry-factors-and-diligence-gaps
    title: Sector Skepticism, Implementation Headwinds, and Information Gaps
    body: Despite rapid top-line valuation expansion, Basis operates in a domain with a documented history of software failures and persistent professional skepticism. Enterprise accounting technology has historically suffered from well-funded ventures overpromising automation capabilities, only to struggle with the messy reality of legacy general ledgers, inconsistent client documentation, and zero-tolerance compliance standards. Furthermore, as a private company, Basis does not publicly disclose crucial financial fundamentals, including annual recurring revenue (ARR), gross margin profile, net revenue retention (NRR), or customer churn metrics. Evaluating whether Basis valuation of $1.15 billion reflects sound recurring software unit economics or speculative venture enthusiasm remains a primary diligence challenge for prospective partners and investors.
    claimRefs:
      - CO011
      - CO014
