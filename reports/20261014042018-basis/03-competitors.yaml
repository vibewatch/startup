callouts:
  - calloutType: insight
    title: The Foundation Lab Threat Boundary
    body: Basis navigates competitive risk from major LLM labs by positioning its software above the model commodity layer. Large AI labs focus on general-purpose capabilities across text, coding, and generic productivity, whereas professional accounting requires deep general ledger integrations, strict audit paper trails, and compliance with statutory filing frameworks that generalist labs are unlikely to engineer directly.
    claimRefs:
      - CP004
      - CP007
      - CP011
  - calloutType: risk
    title: Enterprise Distribution and International Expansion Barriers
    body: While Basis has penetrated roughly 30 percent of the top 25 US accounting firms, its near-term expansion is constrained by closed pricing, US-only data residency, and workflows engineered around US tax returns. Incumbent software vendors possessing global accounting distribution could counter-attack if they integrate competent agentic capabilities before Basis globalizes its platform.
    claimRefs:
      - CP001
      - CP003
      - CP014
      - CP015
