callouts:
  - calloutType: risk
    title: Sole Provider Dependency on OpenAI Reasoning Models
    body: >-
      Basis's supervisory orchestration and long-horizon multi-step reasoning rely heavily on OpenAI models including
      GPT-5 and o3-series architectures. While multi-model routing is advertised for sub-agents, the supervisory tier's
      tight coupling to OpenAI creates acute exposure to upstream API latency spikes, price changes, or terms of service
      shifts in professional services automation.
    claimRefs:
      - CR009
      - CR010
