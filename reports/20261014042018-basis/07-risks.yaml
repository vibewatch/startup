  title: Risks
  summary: >-
    Comprehensive diligence evaluation of Basis's regulatory exposure, operational and model dependencies, enterprise
    partner concentration, and outcomes-based commercial model vulnerabilities.
sections:
  - id: regulatory-legal-exposure
    title: Regulatory and Professional Practice Liability
    body: >-
      The deployment of autonomous AI agents across licensed accounting, tax, and audit practices introduces a complex
      layer of statutory liability and professional governance. In the United States, professional standards governed by
      the AICPA, state accountancy boards, and IRS Circular 230 place non-delegable legal responsibility on licensed
      practitioners. While Basis automates structured workpaper creation, trial balance mapping, and Form 1065 filings,
      software vendors cannot assume professional attest or preparer liabilities. Enterprise accounting firm partners
      require rigorous human-in-the-loop review policies because regulatory frameworks and clients mandate documented
      oversight of automated outputs. Customer agreements, exemplified by public disclaimers from firms such as Sikich,
      explicitly disclaim liability arising from third-party reliance on AI-generated content. Furthermore, maintaining
      compliance requires stringent data governance; Basis addresses this baseline through SOC 2 Type II certification
      and contractual assurances that client financial records remain in U.S. regions and are not used to train
      foundation models.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    tableRefs:
      - TR001
  - id: operational-quality-architecture
    title: Operational Execution, Model Routing, and Verification Controls
    body: >-
      Operational reliability in accounting automation differs fundamentally from consumer or developer software because
      financial calculations demand zero tolerance for silent error propagation. Basis has engineered long-horizon
      autonomous agents designed to execute sustained, multi-hour workflows across accounting systems, including complex
      Form 1065 partnership returns that require intricate K-1 footnote extraction and schedule reconciliation. To
      mitigate reasoning hallucinations, the architecture incorporates multi-agent supervisory layers that trace source
      citations back to client documentation. However, independent industry reporting highlights that accounting firms
      are expanding artificial intelligence software budgets substantially faster than they are implementing formal
      oversight frameworks. In complex multi-step close procedures across heterogeneous enterprise ERP environments,
      unverified edge-case classifications or variance anomalies risk propagating into finalized ledgers unless firm
      review protocols enforce strict secondary verification.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: partner-model-dependencies
    title: Upstream Model Concentration and Accounting Firm Dependencies
    body: >-
      Basis exhibits substantial architectural dependency on third-party foundational model infrastructure, primarily
      OpenAI. The platform relies on a supervisory agent migrated from OpenAI o3 to GPT-5 to direct end-to-end task
      delegation and evaluate reasoning consistency. Lightweight sub-agents leverage GPT-4.1 for low-latency queries
      while high-context operations like month-end reconciliations route back to GPT-5. While this tight alignment
      enables Basis to capture frontier reasoning advances rapidly, it leaves the platform acutely exposed to OpenAI
      service outages, API rate limits, and model behavior drifts during peak tax seasons. On the customer side,
      adoption is heavily concentrated among top accounting practices: while Basis reports deployments across
      approximately 40 percent of the top 25 U.S. accounting firms and key clients like Sikich deploy the tool across
      thousands of team members, independent reviews note that firm-level penetration does not equate to pervasive
      individual seat utilization across all practice areas.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR003
  - id: financial-governance-kill-criteria
    title: Commercial Model Sustainability and Diligence Kill Criteria
    body: >-
      From a commercial standpoint, Basis has pursued an outcomes-based pricing structure tied to completed accounting
      deliverables rather than conventional per-seat licenses or pass-through token consumption. This approach aligns
      customer incentives with measurable automation value but introduces execution friction: verifying completed
      outcomes requires precise client attribution and consistent agent completion rates. While pure token-consumption
      models suffer margin compression as model API prices drop, outcomes-based contracts demand sustained technical
      performance to justify premium pricing. Investors evaluating Basis at its $1.15 billion valuation following its
      $100 million Series B raise must monitor specific thesis-break triggers. Key monitoring indicators include
      enterprise contract churn following mandatory tax season audits, partner pushback on AI error indemnification
      terms, and any defensive API gating or native agent competition introduced by dominant accounting software
      incumbents.
    claimRefs:
      - CR013
      - CR014
      - CR015
