chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营使命与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Basis 是一家总部位于纽约、由 Matthew Harpe 和 Mitchell Troyanovsky 于 2023
              年创立的企业软件公司。公司处于成长期，开发面向专业服务机构的智能代理人工智能系统，自动化端到端会计流程。Basis
              不做对话式聊天界面或单点任务工具，而是部署能连续执行数小时流程的自主代理，覆盖客户会计服务（CAS）、税务准备和审计测试。公司的核心使命是缓解会计行业的结构性人力短缺：退休注册会计师人数远超新入行者。Basis
              希望把会计师从手工编制者变成复核者，扩大事务所的收入承载能力，并按已交付工作而不是传统席位授权收费。
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
              - CO014
              - CO015
      - number: '1.2'
        title: 高管领导、治理结构与人才策略
        blocks:
          - type: paragraph
            body: >-
              Basis 由联合创始人兼 CEO Matthew Harpe 和技术联合创始人 Mitchell Troyanovsky 共同领导。Harpe 曾在 Boston Consulting Group 和
              SoftBank 从事经济分析与医疗运营，熟悉复杂计费和合规流程。Troyanovsky 负责技术架构，专注概率编程和自主多智能体编排。Basis 于 2026 年 2 月完成 B 轮融资后，任命 Accel 的
              Miles Clements 和 Khosla Ventures 的 Keith Rabois 加入董事会，扩充公司治理。公司预计有 51 至 100 名员工，核心研究与机器学习工程团队集中在纽约市。Basis
              大量从顶尖研究机构招聘，并设有名为 Atlas 的内部运营团队，在公司各项运营中部署自主代理。
            claimRefs:
              - CO001
              - CO006
              - CO012
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO012
      - number: '1.3'
        title: 资本化历史、B 轮估值与机构投资者基础
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月，Basis 以 1 亿美元 B 轮融资、融资后估值 11.5 亿美元完成交易，跻身独角兽。该轮融资使公司累计股权融资约 1.38 亿美元，此前公司于 2024 年 12 月完成 360
              万美元种子轮和 3400 万美元 A 轮。B 轮由 Accel 领投，GV（前身为 Google Ventures）、老股东 Khosla Ventures 以及前 Goldman Sachs 董事长 Lloyd
              Blankfein 大额参与。融资还吸引了 Box 的 Aaron Levie、Quora 的 Adam D’Angelo、Replit 的 Amjad Masad 和 Nat Friedman
              等知名科技高管与天使投资者。Basis 快速积累资本，反映投资者越来越相信：高风险、受监管知识工作中的垂直 AI 代理能够交付可防御的企业软件价值。
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO008
      - number: '1.4'
        title: 运营里程碑、技术执行与市场 traction
        blocks:
          - type: paragraph
            body: >-
              Basis 已在美国会计市场建立快速商业 traction，覆盖前 25 大会计师事务所约 30%，其中包括 Boulay、Clark Nuber、MarksNelson、Pinion 和 UHY
              等知名事务所。采用公司的事务所报告称，在 CAS、税务和审计项目中，运营效率提升 20% 至 50%，事务所无需同比例招聘就能扩大服务能力。技术上，Basis 协调由合作方 OpenAI
              基础模型驱动的专业子代理，包括 GPT-4.1、GPT-5、o3 和 o3-Pro。2026 年初，公司展示了能自主完成端到端 Form 1065 合伙企业纳税申报的 AI
              代理，完成了高复杂度税务合规自主执行的概念验证（PoC）。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
