      - number: '7.3'
        title: 上游模型集中度与会计事务所依赖
        blocks:
          - type: paragraph
            body: >-
              Basis 的架构高度依赖第三方基础模型基础设施，主要是 OpenAI。平台依靠从 OpenAI o3 迁移到 GPT-5 的监督代理，指挥端到端任务委派并评估推理一致性。轻量子代理使用 GPT-4.1
              处理低延迟查询，而月末调节等高上下文任务则回到 GPT-5。这样的紧密结合让 Basis 能快速吸收前沿推理进展，却也使平台在报税高峰期暴露于 OpenAI 服务中断、API
              速率限制和模型行为漂移。客户侧采用同样高度集中在头部事务所：Basis 报告称已覆盖美国前 25 大事务所约 40%，Sikich
              等关键客户在数千名团队成员中部署工具；但独立评估指出，事务所层面的渗透不等于所有业务线都普遍使用席位。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 商业模式可持续性与尽调否决条件
        blocks:
          - type: paragraph
            body: >-
              从商业模式看，Basis 按已完成会计交付物收费，而不是采用传统席位授权或原始 token
              转嫁。这种方式让客户激励与可量化的自动化价值一致，但也增加执行摩擦：核验交付物完成情况需要准确归因客户，并保持代理完成率稳定。纯 token 消耗模式会随着模型 API
              价格下降而压缩利润；结果导向合同则要求技术表现持续达标，才能支撑溢价。投资者在 Basis 完成 1 亿美元 B 轮、估值 11.5
              亿美元后评估公司时，应跟踪明确的论点失效触发器，包括强制性报税季审计后企业合同流失、合伙人反对 AI 错误赔偿条款，以及大型会计软件厂商设置防御性 API 门槛或推出原生代理竞争。
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对 OpenAI 推理模型的单一供应商依赖
            body: >-
              Basis 的监督编排和长链路多步骤推理高度依赖 OpenAI 模型，包括 GPT-5 和 o3 系列架构。虽然公司宣称子代理可多模型路由，但监督层与 OpenAI 的紧密耦合，使专业服务自动化暴露于上游 API
              延迟激增、价格变化或服务条款调整。
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正论与反论
        blocks:
          - type: paragraph
            body: >
              Basis 的看多投资逻辑建立在专业会计的结构性长期顺风上：合格注册会计师严重短缺，同时 CAS、税务合规和审计准备存在大量重复人工合规工作。Basis
              构建了专门执行端到端多步骤流程的自主智能代理架构，而非通用对话式聊天机器人，并利用 OpenAI GPT-5、o3、o3-Pro 和 GPT-4.1 等领先基础模型。公司按已完成交付物收费，而非按席位授权或
              token 用量计费，使软件支出直接对应事务所账单收入和毛利率扩张。前 25 大美国会计师事务所约 30% 的合作关系（包括前 100 大 IPA 事务所
              Sikich）为早期企业验证提供了支撑。\n+\n+\n+              反过来，看空逻辑集中在脱离已披露经常性收入基本面的极端估值倍数，以及执行与模型责任风险。Basis 虽于 2026 年 2
              月完成 1 亿美元 B 轮、估值 11.5 亿美元，但没有公开披露 ARR、总体留存、NRR
              或毛利率。会计工作流还受到严格监管标准、纳税申报错误责任和复杂复核要求约束；合伙企业申报或财务报表中的任何无声幻觉或映射失败，都可能让事务所停止合作。过去五至七年中，早期风险投资支持的会计自动化创业公司曾遭遇严重客户质疑，并在实现可持续工作流委派前陷入停滞；如果采用无法扩展到事务所范围的合同承诺，估值倍数压缩风险不容忽视。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
