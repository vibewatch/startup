  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 连接市场机会、企业级证明、估值门槛和“继续研究”建议的逻辑决策链。
    data:
      nodes:
        - id: market-tailwinds
          label: 劳动力短缺：会计人才严重不足，创造不可自由裁量的需求
        - id: technical-proof
          label: 代理验证：多代理 GPT-5 架构已部署于约 30% 的 Top 25 CPA 事务所
        - id: commercial-traction
          label: 成果计费：与 Sikich 等 IPA 100 领导者的部署建立企业立足点
        - id: valuation-hurdle
          label: 倍数偏高：$1.15B B 轮投后估值意味着 ARR 倍数 >50 倍
        - id: downside-risks
          label: 执行风险：历史初创失败、未经核实的 ARR 和倍数压缩
        - id: recommendation-call
          label: 结论：等待 ARR 和留存指标审计确认后再继续研究
      edges:
        - from: market-tailwinds
          to: technical-proof
          label: 推动采用
        - from: technical-proof
          to: commercial-traction
          label: 促成变现
        - from: commercial-traction
          to: valuation-hurdle
          label: 激进定价
        - from: valuation-hurdle
          to: downside-risks
          label: 放大敞口
        - from: downside-risks
          to: recommendation-call
          label: 需要尽调
    approximationNotes: 代表投资委员会的定性综合判断；不是量化财务计算。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV011
      - CV012
      - CV015
