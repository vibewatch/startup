  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 工作流转化管线展示会计业务合作如何从原始财务记录转化为自主交付成果和基于成果的收入。
    approximationNotes: 根据披露的产品流程和模型路由机制，概括展示运营与经济转化架构。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
    data:
      nodes:
        - label: 事务所全业务合作
          tone: neutral
        - label: 客户数据摄取与流程映射
          tone: neutral
        - label: 监督代理任务路由
          tone: neutral
        - label: 多模型执行与引用
          tone: positive
        - label: 会计师复核与签字
          tone: positive
        - label: 基于成果的价值实现
          tone: positive
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈展示 Basis 的多代理编排、模型路由、确定性规则和企业集成边界。
    data:
      layers:
        - label: 用户交互与监督层
          detail: CPA 使用的网页工作区，可分配目标、检查带引用的工作底稿并批准分阶段记账分录
          modules:
            - 目标分配界面
            - 工作底稿检查与复核控制台
            - 审计日志与置信度评分查看器
        - label: 监督编排层
          detail: 目标分解引擎，协调跨专业子代理的多步骤会计工作流
          modules:
            - 目标分解器与规划器
            - 并行工具调用协调器
            - 复核阈值调度器
        - label: 专业子代理层
          detail: 执行离散会计、税务和审计流程的领域专属自主代理
          modules:
            - CAS 与对账代理
            - 税务提取与 1065 申报代理
            - 审计轨迹与验证代理
        - label: 模型路由与推理层
          detail: 根据任务复杂度和延迟，为专业任务分配不同前沿 LLM 的多模型路由
          modules:
            - 用于深度推理的 OpenAI GPT-5
            - 用于低延迟交互的 OpenAI GPT-4.1
            - 内部基准路由控制器
        - label: 会计规则与本地上下文层
          detail: 确定性护栏结合 350+ 项会计流程，以及事务所和客户特定的学习结果
          modules:
            - 350+ 项预构建会计流程
            - 本地事务所上下文固化
            - 基于规则的验证约束
        - label: 数据与企业集成层
          detail: 安全的分类账连接器和文档摄取管道，无需存储客户凭证即可运行
          modules:
            - ERP 与总账连接器
            - 文档解析器（K-1、报表）
            - SOC 2 Type II 安全存储
    approximationNotes: 架构层概念化呈现 Basis 的技术实现，依据包括官方产品披露、OpenAI 合作技术细节和 LLMOps 分析。
    claimRefs:
      - CE002
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从发现 CPA 人员约束，到全所流程固化和成果续约的六阶段采用生命周期。
    data:
      items:
        - label: 阶段 1：发现人员约束
          stage: 发现
          touchpoints:
            - 管理合伙人咨询
            - 网络研讨会演示
          description: 会计师事务所管理层认识到 CPA 招聘严重短缺、报税季工作量压缩，传统招聘无法解决这些问题。
        - label: 阶段 2：沙盒评估与映射
          stage: 试点
          touchpoints:
            - 示例客户总账数据摄取
            - 试算表映射测试
          description: 事务所业务负责人在往年客户数据集上进行受控试点评估，核验试算表映射和工作底稿起草的准确性。
        - label: 阶段 3：受监督的 CAS 生产部署
          stage: 部署
          touchpoints:
            - 实时总账连接
            - 记账分录复核队列
          description: 事务所将代理部署到实时客户会计服务中；会计师从人工数据录入转为监督复核。
        - label: 阶段 4：跨业务扩张
          stage: 扩张
          touchpoints:
            - 税务申报准备模块
            - 审计测试流程
          description: CAS 的成功结果推动产品扩展到季节性税务准备（1065 表附表）和其他业务组的审计测试流程。
        - label: 阶段 5：事务所专属流程固化
          stage: 定制
          touchpoints:
            - 350+ 项流程库
            - 定制规则起草
          description: 事务所把专有会计惯例和客户细节固化到全所流程中，加深供应商锁定和工作流黏性。
        - label: 阶段 6：企业续约与成果经济学
          stage: 持久性
          touchpoints:
            - 成果归因复核
            - 多年合同续约
          description: 事务所转向成熟的商业合同：计费与自动化工作产出挂钩，而非与席位数挂钩，Basis 由此嵌入事务所的经济模型。
    claimRefs:
      - CU003
      - CU007
      - CU011
