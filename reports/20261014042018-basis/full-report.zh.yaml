        - CPA 结构性短缺，加上近 30 万人退休，带来不可自由裁量的企业自动化需求。
        - 事务所存在文化惯性，长期不信任自动化核心判断工作的软件。
        - 审计确认全所采用软件，并确认 Top 100 事务所的席位数 / 工作量部署持续扩大。
      - - 产品与模型架构
        - 自研多代理编排结合 OpenAI GPT-5、o3 和 o3-Pro，可使事务所效率提升 20–50%。
        - 底层基础模型实验室可能吸收专用推理能力，或将工作流封装层商品化。
