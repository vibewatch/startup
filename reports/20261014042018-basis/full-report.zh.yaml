  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与专业执业责任
        blocks:
          - type: paragraph
            body: >-
              在持牌会计、税务和审计业务中部署自主 AI 代理，会引入复杂的法定责任和专业治理层。在美国，AICPA、州会计委员会和 IRS Circular 230
              规范的专业标准，把不可转让的法律责任放在持牌专业人员身上。Basis 可自动创建工作底稿、映射试算平衡表和准备 Form
              1065，但软件供应商不能承担专业鉴证或申报责任。企业会计事务所合伙人要求严格的人在回路复核政策，因为监管框架和客户都要求对自动化输出保留书面监督。Sikich 等事务所公开免责声明也明确排除因第三方依赖 AI
              生成内容而产生的责任。合规还需要严格的数据治理；Basis 通过 SOC 2 Type II 认证及合同保证，确保客户财务记录留在美国区域且不用于训练基础模型。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
