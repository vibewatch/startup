          detail: 美国约 300 万名执业会计师创造的总收入。
        - label: 可触达的会计软件与 IT 支出
          value: 18000
          unit: USD M
          detail: 公共会计师事务所和企业财务部门的年度软件、托管服务及自动化支出。
        - label: 可服务的 CAS、税务与审计业务支出
          value: 4500
          unit: USD M
          detail: Top 150 事务所和区域性会计师事务所可由工作流自动化平台切入的外部支出。
        - label: Top 25 会计师事务所企业机会
          value: 1100
          unit: USD M
          detail: 最大型全国性和多办公室会计网络中集中的自动化预算。
        - label: 目标事务所早期采用部署
          value: 200
          unit: USD M
          detail: 面向近期可触达的业务管线，覆盖遭遇严重产能瓶颈的中型市场会计业务。
        - label: Basis 当前可触达运行率
          value: 1150
          unit: USD M
          detail: 2026 年 2 月 B 轮融资后的私人企业资本化；经审计 ARR 仍未披露。
    approximationNotes: 数值综合公开行业劳动力总量、典型垂直软件支出占比和据报道的事务所渗透率；公司 ARR 仍未披露。
    claimRefs:
