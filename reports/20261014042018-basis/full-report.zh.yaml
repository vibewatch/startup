              - CO010
      - number: '1.5'
        title: 行业质疑、实施阻力与信息缺口
        blocks:
          - type: paragraph
            body: >-
              尽管估值快速上升，Basis
              所处行业有软件失败的记录，也长期面对专业人士的怀疑。企业会计科技过去常见的情况是：资金充足的创业公司过度承诺自动化能力，最终却被遗留总账、客户资料不一致和零容错合规要求拖住。作为私人公司，Basis
              也没有公开披露 ARR、毛利率、净收入留存率（NRR）或客户流失等关键财务基本面。对潜在合作方和投资者而言，Basis 11.5
              亿美元估值究竟代表扎实的经常性软件单位经济，还是投机性的创业投资热情，仍是首要尽调难题。
            claimRefs:
              - CO011
              - CO014
      - number: '1.6'
        title: 展示项
        blocks:
          - type: callout
            title: 智能代理架构与生成式 Copilot 对比
            body: Basis 不同于传统 AI Copilot：它构建长链路自主工作流，而不是提示词—响应式聊天界面。公司借助多智能体编排和结果导向商业模式，让自身经济收益直接跟专业服务吞吐量挂钩。
            calloutType: insight
            claimRefs:
              - CO002
              - CO008
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：智能代理会计工作流与现状软件
        blocks:
          - type: paragraph
            body: >-
              Basis 的可服务市场由 CAS、企业税务合规和审计准备中的复杂会计流程端到端执行构成。QuickBooks、Xero 或 NetSuite
              等横向总账和单点记账工具仍要求会计师手动录入交易、核对报表；Basis
              则自主完成多步骤工作流。平台面向希望在不增加员工的情况下扩大客户量的中端和大型公共会计事务所及企业财务部门。可计入的支出包括工作流自动化、税务工作底稿准备和试算平衡表映射，不包括通用 ERP
              授权和核心数据库托管。因此，Basis 直接与人工工时竞争，而不是与既有软件席位预算竞争。
            claimRefs:
              - CM001
              - CM008
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM012
      - number: '2.2'
        title: 可服务市场规模：跨业务线的多视角测算
        blocks:
          - type: paragraph
            body: >-
              智能代理会计平台不能用单一自上而下的软件数字来衡量，因为这项技术替代的是人工专业服务工时。美国约有 3m 名会计师，创造超过 $150b
              的专业服务总收入。可服务市场集中在会计师事务所：日常合规、月结和税务准备最多占专业员工工时的 70%。这部分劳动力对应的软硬件及外部自动化预算，构成每年 $15b 至 $20b 的可服务软件市场。Basis
              聚焦前 150 大会计师事务所和区域性事务所；前 25 大事务所的早期部署，已验证市场短期付费购买可扩展产能的意愿。2026 年 2 月，Accel 和 GV 领投的 $100m B 轮融资、$1.15b
              估值进一步增强了投资者信心。
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM013
      - number: '2.3'
        title: 买方画像、业务分层与采购机制
        blocks:
          - type: paragraph
            body: >-
              不同规模事务所和业务组的采用逻辑差异明显。在前 25 大和大型全国性会计师事务所，经济买方通常是管理合伙人、业务负责人和全国管理合伙人，他们负责
              CAS、税务或咨询业务线。由于替代性执业模式把持牌鉴证合伙企业与咨询公司主体分开，采购往往需要双重治理。在中端和区域性事务所，管理合伙人优先释放产能，避免在报税高峰拒绝客户项目。Basis
              按已完成的会计流程和交付物收费，而非按席位授权，使商业模式贴合事务所经济，也减轻了软件闲置浪费的担忧。
            claimRefs:
              - CM005
              - CM007
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM010
      - number: '2.4'
        title: 采用驱动与约束：人口逆风对监管验证
        blocks:
          - type: paragraph
            body: >-
              智能代理会计采用的首要增长动力，是整个行业严重且结构性的人员危机。约 30 万名会计师将在两年内退休，预计未来十年有 75% 的从业者退休，事务所无法招聘足够 CPA
              满足合规需求。能执行多步骤月结和纳税申报的自主代理，可节省最多 30% 的时间，释放关键运营产能。但严格的专业责任、AICPA 标准和交叉复核要求限制了采用。CPA 需在法律责任下签署纳税申报表和鉴证意见，因此
              AI 平台必须提供透明审计轨迹、来源引用和置信度评分，而不能只是黑箱输出。关于客户留存和毛利率的经审计商业披露也仍然缺失。
            claimRefs:
              - CM003
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 会计师退休潮取代渐进式 IT 更新周期
            body: 两年内约 30 万名会计师退休、未来十年预计退出 75%，使 AI 采用从可选的生产力软件变成合伙人主导事务所维持运营的必需品。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
          - type: callout
            title: 严格责任与 AICPA 标准排除了完全自主执行
            body: 会计和鉴证意见涉及合伙人责任及严格监管，因此智能代理系统必须保留细粒度审计日志、来源链路和置信度评分，让专业人员继续掌握复核权。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代路径
        blocks:
          - type: paragraph
            body: >
              Basis 面对五类替代方案：传统会计软件和 ERP 套件、新兴垂直会计 AI 代理、通用基础模型实验室、离岸人力网络，以及根深蒂固的人工流程。Intuit、Thomson Reuters、Wolters
              Kluwer 和大型企业 ERP 厂商掌握既有记录系统和客户会计数据，但其架构仍以确定性规则引擎、表单处理和工作流管理为中心，而不是自主代理执行。Thomson Reuters Institute
              研究显示，专业服务业已从探索式生成式试验进入战略部署阶段，事务所要求深度工作流自动化直接嵌入运营战略。与此同时，OpenAI
              等通用基础模型厂商继续推进原始测试时计算、推理模型和工具调用。但专业会计工作流需要接入多种总账、对照一手工作底稿进行多步骤核验，并适配本地事务所惯例。面对会计师严重短缺和合伙人职业倦怠，事务所在专用代理平台、内部封装前沿模型的脚本，以及离岸团队支持的人工准备之间做选择。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: 竞争者画像、技术能力与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              对替代路径的尽调显示，技术架构、专业化程度和防御性存在明显分化。OpenAI o3、o3-Pro、GPT-4.1 和 GPT-5 等通用模型实验室提供前沿推理能力，Basis
              自身也将其作为模块化底层组件，而不是基础模型供应商。Basis
              认为，前沿实验室会自然商业化搜索、文档生成和基础表格操作等广泛知识任务，复杂的领域金融控制与会计流程仍能由垂直专家守住。传统套件提供确定性计算和合规申报模块，却需要人工持续输入，才能打通非结构化文档、试算平衡表和账期调整。相比之下，Basis
              部署监督代理，在专业子代理之间编排多智能体委派；每项数字交付物都引用一手来源文档，并提供 350 多个由内部驻场会计师设计的预构建会计 Procedures。该架构帮助 Basis 覆盖美国前 25
              大会计师事务所约 30%，包括与 Baker Tilly 和 Sikich 的合作，并覆盖前 150 大事务所约
              25%。不过，如果基础模型厂商增强原生记录系统工具，或传统供应商把代理能力深度集成进现有事务所管理软件，长期护城河仍会承压。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP008
      - number: '3.3'
        title: 切换成本、锁定与竞争不利风险
        blocks:
          - type: paragraph
            body: >
              会计行业的切换成本和采购机制既构成进入壁垒，也带来独特采用风险。监管责任、合伙人签字要求和严格客户保密义务，使事务所高度厌恶风险。一旦专业事务所把定制
              Procedures、历史试算平衡表映射和客户上下文嵌入代理平台，流程锁定会随时间加深。Basis 还通过 SOC 2 Type II、ISO 27001 和 ISO 42001
              认证、美国基础设施托管，以及不使用客户数据训练模型的明确政策，落实企业合规。不过，行业监测机构 RECATOOLS 的独立评估指出，Basis
              没有透明的公开价格表，访问受企业演示候补名单限制，基础设施严格位于美国区域，公开案例主要围绕美国税务和审计惯例，如 Form 1065 合伙企业申报和 K-1
              汇总。对国际事务所和多司法辖区业务而言，这构成采用障碍。对专有基础模型 API 的依赖还带来平台依赖与上游模型成本变化的双重风险，结果导向定价则仍需谈判并接受企业合同审查。
            claimRefs:
              - CP003
              - CP006
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 基础模型实验室的威胁边界
            body: >-
              Basis 将软件定位在模型商品层之上，以应对大型 LLM 实验室的竞争风险。大型 AI
              实验室专注文本、编程和通用生产力，而专业会计需要深度总账集成、严格审计底稿链路以及法定申报框架合规，通用实验室不太可能直接工程化这些能力。
            calloutType: insight
            claimRefs:
              - CP004
              - CP007
              - CP011
          - type: callout
