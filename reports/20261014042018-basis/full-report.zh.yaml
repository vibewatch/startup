      - number: '8.2'
        title: 融资背景与资本结构
        blocks:
          - type: paragraph
            body: >
              Basis 自 2023 年成立以来，通过三轮机构风险投资累计融资 $138 million。资本化历程包括 2023 年 10 月 的 $3.6 million 种子轮、2024 年 12 月的 $34
              million A 轮，以及 2026 年 2 月 24 日宣布的标志性 $100 million B 轮融资。B 轮由顶级风险投资机构 Accel 领投，GV (Google Ventures)、现有领投方
              Khosla Ventures 及前 Goldman Sachs 首席执行官 Lloyd Blankfein 大额跟投。本轮融资对应的投后估值 为 $1.15 billion，使公司在成立三年内跻身独角兽。


              从入场纪律看，$1.15 billion 的估值基准给潜在成长期投资者设下了很高的门槛。在 ARR 未披露的情况下， 即便采用私募市场对年化软件收入 $10 million 至 $20 million
              的乐观估算，入场倍数仍达 ARR 的 57.5x 至 115x。相比之下，上市垂直软件和税务合规同业的企业价值收入中位数倍数为 6x 至 12x，这一价格
              溢价显著。资本表虽显示有高质量投资人组成的联合体支持、账上弹药充足，但后续清算优先权压力以及 $100 million 注资带来的稀释，要求收入高速复合增长并长期维持软件毛利率，才能避免后续融资降价轮
              或结构化二级折价。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 情景估值建模与退出展望
        blocks:
          - type: paragraph
            body: >
              为评估公开证据是否支持当前 $1.15 billion 估值，我们综合多空及基准运营情景，预测至 FY2028。 在乐观情景下，Basis 成功加深在美国排名前 150
              家会计师事务所中的渗透，将结果导向定价从最初 的 CAS 试点拓展至全所税务工作底稿和审计部署。按此情景，Basis 到 2028 年 ARR 达到 $100 million， 软件毛利率为 75%，若上市或被
              Intuit、Thomson Reuters 等财务软件龙头战略收购，按 25x 收入倍数 估值可达 $2.5 billion。


              基准情景下，Basis 以稳健但克制的速度获得企业客户，到 2028 年 ARR 达到 $45 million；会计师事务所 保留人工复核环节，并将自主代理限制在结构化 CAS
              对账和试算平衡表映射。按市场标准的远期 ARR 16x 倍数估值，企业价值为 $720 million，低于 2026 年 2 月的投后估值，意味着倍数明显压缩，退出估值
              持平甚至下行。悲观情景下，客户持续存疑、基础模型商品化，或围绕自主报税的监管审查限制企业推广， ARR 被困在 $18 million。按 8x 倍数计算，企业价值仅 $144 million，较 B 轮峰值缩水
              87%。因此， 我们仍认为估值偏高，建议继续研究，等待经过核验的商业 ARR 审计数据。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资结论：估值偏高，继续研究
            body: >-
              Basis 已将自主多代理工作流部署到美国前 25 家会计师事务所中的 30%，展现出品类领先的技术执行力。 但在经常性收入、毛利率或合同扩张指标均未核验的情况下，以 $1.15 billion
              估值投入成长资本，会 面临不可接受的倍数压缩风险。建议继续研究，并跟踪试点转生产的转化情况。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
              - CV015
          - type: callout
            title: 估值脆弱性：收入基本面未披露
            body: >-
              Basis 已融资 $138 million，投后估值为 $1.15 billion，隐含收入倍数远高于成熟垂直软件同业。历史 经验表明，早期自动化会计创业公司曾在边界案例和责任风险上受挫。ARR
              或净留存数据未披露，后续 融资出现降价轮或估值悬压的风险很高。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
