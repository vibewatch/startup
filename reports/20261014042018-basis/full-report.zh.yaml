            body: >-
              会计自动化的运营可靠性与消费软件或开发者软件根本不同，因为财务计算容不得无声错误传播。Basis 设计了能在会计系统中持续运行数小时的长链路自主代理，包括处理需要复杂 K-1 脚注提取和附表调节的 Form
              1065 合伙企业申报。为减少推理幻觉，架构加入多智能体监督层，把来源引用追溯到客户文档。不过，行业独立报道指出，会计师事务所扩大 AI 软件预算的速度明显快于建立正式监督框架的速度。在异构企业 ERP
              环境中执行复杂多步骤结账时，如果事务所复核制度没有强制二次验证，未经核验的边界分类或差异异常可能一路传导进最终总账。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
