callouts:
  - calloutType: "risk"
    title: "Credit Market Dependency and Balance Sheet Gearing"
    body: >-
      Imprint's rapid scaling from $15M in 2023 revenue to $70M in 2024 was accompanied by an expansion into $2.0 billion of total debt capacity [CR004, CR007]. With 60% of revenues derived from lending and an outstanding portfolio exhibiting a 4.86% gross charge-off rate and 1.78% 60+ day delinquency rate, any macroeconomic deterioration could impair warehouse borrowing bases and jeopardize profitability targets [CR005, CR006].
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "Operational Friction in Legacy Portfolio Takeovers"
    body: >-
      Replacing legacy bank issuers such as Citibank and Synchrony creates significant customer transition risks [CR010, CR011]. Reviews on WalletHub highlight substantial consumer frustration with physical card delivery times, automated customer service limitations, and misallocated payments on transferred accounts, which threaten to undermine the customer loyalty proposition Imprint markets to brand partners [CR010, CR011, CR012].
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
