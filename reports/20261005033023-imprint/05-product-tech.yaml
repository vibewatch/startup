callouts:
  - calloutType: "insight"
    title: "Strategic Impact of Proprietary Core Ledgering"
    body: "By developing and maintaining ImprintCore internally rather than licensing third-party core banking platforms, Imprint achieves granular SKU-level reward orchestration and sub-second digital issuing. However, owning the core expands engineering maintenance overhead and places the burden of regulatory ledger reconciliation directly on internal systems."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE010"
  - calloutType: "risk"
    title: "Critical External Dependencies in Regulated Card Issuance"
    body: "Although Imprint owns its software and ledger layer, its operational model remains dependent on sponsor banks (First Electronic Bank and First Bank & Trust) for legal card issuance and credit origination. Any disruption in sponsor bank licensing or heightened regulatory scrutiny on fintech-bank partnerships represents an existential operational risk."
    claimRefs:
      - "CE003"
      - "CE011"
      - "CE012"
