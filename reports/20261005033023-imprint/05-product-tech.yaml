  title: "Product & Technology"
  summary: "Imprint operates a vertically integrated co-branded credit card platform called ImprintCore that combines proprietary core ledgers, real-time SKU-level rewards, and an underwriting engine deployed on AWS EKS with partner-led bank issuance and payment network integrations."
sections:
  - id: "product-overview-and-workflow"
    title: "Product Definition and Workflow Integration"
    body: "Imprint delivers white-label co-branded credit card programs and bespoke financial products that embed directly into consumer brand mobile applications, e-commerce checkout flows, and in-store purchase environments. Operating as a B2B2C platform, Imprint positions itself between merchant partners, consumer cardholders, and regulated financial institutions to modernize card issuing, transaction processing, and customer rewards. Retail partners integrate Imprint's software development kits (SDKs) and merchant application programming interfaces (APIs) to provide instant credit application decisions, enabling consumers to receive immediate digital wallet provisioning alongside physical metal or recycled plastic cards. By managing the end-to-end user lifecycle from digital onboarding to payment servicing, the platform aims to expand customer lifetime value, lift retail checkout conversion, and drive repeat engagement through customized merchant rewards. Independent market evaluations and publication registries distinguish Imprint Payments financial technology products from unrelated entities sharing the name, including creative agency Imprint Projects and academic journals like MIT Architecture's Imprint."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE002"
    figureRefs: []
  - id: "imprintcore-architecture"
    title: "Operating Model and ImprintCore Technical Architecture"
    body: "Imprint's core technical differentiation rests on owning its proprietary processing and ledger infrastructure, designated ImprintCore, rather than outsourcing ledgering to generic banking-as-a-service intermediaries or relying on legacy issuer-processor mainframes. The backend infrastructure is structured as a service-oriented architecture implemented primarily in Go (with selected Java services) running on managed Amazon Elastic Kubernetes Service (EKS) across Amazon Web Services (AWS), with infrastructure provisioned via Terraform. Data persistence is decoupled across discrete microservices, where each backend service maintains a dedicated MySQL database to enforce strict transactional boundaries and data isolation. On top of this infrastructure, Imprint operates proprietary credit card and rewards ledgers capable of real-time line-item and SKU-level reward calculation, allowing merchant partners to target specific product categories with differentiated cash-back incentives."
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "modules-underwriting-and-security"
    title: "Platform Modules, Underwriting Capabilities, and Compliance Governance"
    body: "The ImprintCore platform comprises specialized functional modules including Predict for proprietary credit underwriting, Insights for merchant transaction analytics, Marketing for programmatic loyalty campaigns, and Rewards for granular redemption logic. The Predict underwriting engine applies custom risk models to extend smaller initial credit lines that scale incrementally as cardholders demonstrate consistent repayment behavior, supported by consumer-friendly grace periods and first-time fee forgiveness policies. Imprint operates a hybrid infrastructure model: regulated credit origination and card issuance are executed through partner industrial banks including First Electronic Bank and First Bank & Trust across Visa, Mastercard, and American Express payment networks, while bank account verification and linking leverage Plaid. Security controls, compliance oversight, and operational reliability are reinforced through automated CI/CD pipelines, containerized deployment controls, and 24/7 on-call engineering rotations."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE001"
    figureRefs: []
