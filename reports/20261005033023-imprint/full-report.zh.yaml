  - id: TP002
    title: Imprint 与竞争者类别的功能及架构能力矩阵
    columns:
      - 购买标准 / 能力
      - Imprint（ImprintCore）
      - 直接金融科技公司（Cardless / Deserve）
      - 传统银行（Synchrony / Bread）
      - 嵌入式 BaaS（Stripe / Marqeta）
    rows:
      - - SKU 级奖励定制
        - 原生云账本支持商品级规则（例如自有品牌 5%，普通商品 1.5%）
        - 通过现代 API 支持部分项目
        - 不支持；传统主机系统只能汇总商户类别码（MCC）
        - 需要商户侧逻辑；未集成进信用卡奖励引擎
      - - 上市时间 / 发布速度
        - 借助模块化 SDK 和 API，可在数月内快速部署
        - 通过现代 API 集成，可在数月内快速部署
        - 速度较慢（9 至 18 个月以上），因为银行流程复杂且 IT 管线定制化
        - 虚拟卡开发者集成速度快，但需要第三方信用评估
      - - 信用额度设定与授信
        - 专有实时引擎可逐步提高额度，并支持软查询预审批
        - 现代替代性授信，支持多网络
        - 传统征信机构 FICO 评分，信用等级门槛僵化
        - 平台提供底层通道；品牌方或合作银行必须提供信用授信引擎
      - - 资产负债表与资本模式
        - 批发仓储融资额度（$1.5B）和 AAA 评级定期 ABS（$500M）
        - 批发仓储融资额度及合作银行信用承诺
        - 大规模低成本零售存款融资（例如 Synchrony 的 84% 由存款融资）
        - 非放贷技术通道，或转由合作银行资产负债表承接
      - - 数字优先用户体验
        - 通过原生移动应用 SDK 即时配置虚拟钱包
        - 即时配置数字钱包并完成移动端集成
        - 主要邮寄实体卡；传统移动应用门户套着笨重的网页封装
        - 为数字钱包和虚拟卡令牌化提供出色的开发者 API
    notes: 能力评估基于已披露的平台规格、技术架构拆解及行业分析师判断；具体客户实施可能有所不同。
