  - id: FI001
    title: 商业收入与资本流动桥
    type: flow
    summary: 按顺序展示持卡人消费和循环余额如何产生交换费与利息、支付债务服务并带来净经营利润。
    data:
      nodes:
        - id: spend
          label: 持卡人消费与借款
          detail: 各持卡人的总交易量和循环余额累积
        - id: gross-rev
          label: 总收益率与交换费
          detail: 60% 贷款利息收入 + 40% 商户交换费和卡费收入
        - id: debt-cost
          label: 资金成本与银行费用
          detail: 仓储融资工具利息、ABS 票息支付和合作银行发卡费用
        - id: credit-loss
          label: 损失准备与奖励
          detail: 总核销率（4.86%）和已出资的商户合作伙伴忠诚度奖励
        - id: operating-cost
          label: 运营与技术管理费用
          detail: 工程基础设施、账本处理和客服运营
        - id: net-margin
          label: 运营贡献利润率
          detail: 剩余经营现金流及迈向 GAAP 盈利的轨迹
      edges:
        - from: spend
          to: gross-rev
        - from: gross-rev
          to: debt-cost
        - from: debt-cost
          to: credit-loss
        - from: credit-loss
          to: operating-cost
        - from: operating-cost
          to: net-margin
    approximationNotes: 流程架构依据 Sacra 商业模式分析和 Fitch ABS 绩效指标，模拟商业运作机制。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI011
  - id: FE001
    title: ImprintCore 多层技术架构
    type: stack
    summary: 拆解 Imprint 横跨展示层、服务微服务、核心账本、数据基础设施和银行通道的多层技术架构。
    data:
      layers:
        - label: 客户端与展示层
          detail: 原生 Swift（iOS）和 Kotlin（Android）应用、TypeScript/React 网页嵌入 SDK，以及商户结账组件。
        - label: API 网关与路由层
          detail: RESTful 集成网关，管理合作伙伴认证、SDK 请求和数字钱包凭证配置。
        - label: 服务与业务逻辑层
          detail: 由运行于 AWS EKS 的 Go（及少量 Java）微服务构成的面向服务架构，编排持卡人操作。
        - label: ImprintCore 账本层
          detail: 专有复式核心账本和按服务隔离的 MySQL 数据库，确保严格的数据隔离。
        - label: 数据工程与分析层
          detail: 使用 Python、Airflow、DBT、Snowflake 和 Jupyter 的数据管道，为风险特征提取和授信模型提供支持。
        - label: 银行与网络结算层
          detail: 持牌工业银行合作伙伴（First Electronic Bank、First Bank & Trust）及卡组织（Visa、Mastercard、Amex）。
    approximationNotes: 架构图依据 Imprint 官方工程披露、技术博客文章和合作伙伴集成情况绘制。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE010
      - CE011
