  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按日期排列的里程碑区分股权融资、商业合作成果和应收款融资，不将它们合并为单一资本总额。
    data:
      items:
        - date: '2020'
          label: 公司成立
          detail: 独立资料显示 Imprint 于 2020 年在纽约成立。
          tone: neutral
        - date: 2021-11
          label: $38 million Series A 轮
          detail: Sacra 报道该轮 Series A 由 Kleiner Perkins 和 Stripe 共同领投。
          tone: positive
        - date: 2023-11
          label: $75 million Series B 轮
          detail: Sacra 报道该轮 Series B 由 Ribbit Capital 领投。
          tone: positive
        - date: 2024-10
          label: $75 million Series C 轮
          detail: Sacra 报道该轮融资由 Khosla Ventures 领投，估值为 $600 million。
          tone: positive
        - date: '2025'
          label: Rakuten 项目委托
          detail: Forbes 报道 Imprint 通过竞标赢得了为 Rakuten 联名卡提供支持的项目。
          tone: positive
        - date: 2025-10
          label: 首笔 $300 million ABS
          detail: 债务融资记录披露了首笔 AAA 评级证券化交易。
          tone: positive
        - date: 2025-12
          label: $150 million Series D 轮
          detail: Sacra 及后续融资记录披露估值为 $1.2 billion。
          tone: positive
        - date: 2026-08
          label: $2 billion 债务额度方案
          detail: 据报道，该方案包括新增 $1.5 billion 仓储融资工具和 $500 million ABS。
          tone: neutral
    approximationNotes: 月份精度以引用记录为准；Rakuten 委托仅报道到年份。债务额度和 ABS 发行不视为股权或可用现金。
