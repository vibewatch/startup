  - id: FR001
    title: 风险热力图矩阵
    type: matrix
    summary: 按剩余影响和可能性评估关键法律、财务、合作伙伴及运营风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重程度：极高
          values:
            - label: 赞助银行监管行动
              tone: negative
            - label: 仓储融资契约违约及信用风险激增
              tone: critical
            - label: 核心商户流失（H-E-B 项目损失）
              tone: critical
        - label: 严重程度：高
          values:
            - label: 核心处理系统中断
              tone: warning
            - label: 法院重新认定真实贷款人
              tone: negative
            - label: 资产组合迁移服务积压
              tone: negative
        - label: 严重程度：中高
          values:
            - label: 次级客户层级的信用损失加速
              tone: warning
            - label: 单一商户资产组合 SLA 罚款
              tone: negative
            - label: 合作伙伴品牌声誉受损
              tone: negative
        - label: 严重程度：中
          values:
            - label: 支付网络规则争议
              tone: neutral
            - label: 监管导致交换费压缩
              tone: warning
            - label: 消费者投诉及负面公开评分
              tone: warning
        - label: 严重程度：中低
          values:
            - label: 实体卡承运商配送延误
              tone: neutral
            - label: 客服人员流失
              tone: warning
            - label: 多合作伙伴 API 版本碎片化
              tone: warning
        - label: 严重程度：低
          values:
            - label: 与商业同名者的域名混淆
              tone: neutral
            - label: App Store 评价轻微波动
              tone: neutral
            - label: 奖励凭证到期摩擦
              tone: neutral
    approximationNotes: 可能性和严重程度分类是定性评估，依据包括公开 ABS 表现指标、收入集中度估算和监管环境趋势。
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR007
      - CR008
      - CR010
  - id: FV001
    title: 建议决策逻辑流程
    type: flow
    summary: 决策架构梳理 Imprint 的规模指标、风险脆弱点和估值指标，并导出继续研究的结论。
    data:
      nodes:
        - label: 商业轨迹
          detail: 主要零售品牌贡献 $70M 2024 年收入（同比 +367%）
        - label: 资本获取
          detail: 已落地 $2B 债务融资，并完成 AAA 评级的 $500M ABS 发行
        - label: 模式脆弱性
          detail: 60% 收入来自贷款利息，2024 年烧掉 $35M
        - label: 竞争劣势
          detail: 依赖批发债务融资，对比之下既有零售机构拥有存款基础
        - label: 估值倍数
          detail: Series D 轮定价对应 $1.2B（过去收入的 8.6x 倍数）
        - label: 投资建议
          detail: 继续研究评级，估值偏高且风险高
    approximationNotes: 流程图展示资产负债表证据点与盈利脆弱性的定性综合，以及由此得出的投资结论。
    claimRefs:
      - CV003
