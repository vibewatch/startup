      - number: '3.4'
        title: 护城河防御力、切换摩擦与消费者替代威胁
        blocks:
          - type: paragraph
            body: >-
              Imprint 的竞争护城河一方面来自企业合作伙伴较高的切换成本，另一方面也暴露于明显的面向消费者的替代风险。对 B2B 合作伙伴而言，联名信用卡项目天然具有运营黏性：企业零售商一旦把 Imprint
              的账本接入销售点结账和客户忠诚度数据库，将数十万活跃持卡人账户迁移到替代供应商，就会面临严重的运营摩擦、数据迁移风险和客户支持中断。这些多年期合作承诺让 H-E-B、Booking.com、Shell 和
              Rakuten 等成熟项目带来较持久的收入可见性。然而，在消费者采用端，通用奖励卡和销售点结账融资替代品都在削弱 Imprint 的防御力。NerdWallet
              等消费者倡导机构的独立信用卡评价指出，Imprint 零售联名卡兑换摩擦较大，包括只能在指定商户使用的奖励券、90 天有效期，以及非品牌消费的积分兑换率较低。对非忠诚消费者而言，Chase 和 Capital
              One 等主要发卡方的灵活返现卡和高端旅行奖励卡能覆盖所有商户类别，效用更高。此外，在电商结账时，Klarna、Afterpay 和 Affirm
              等先买后付服务无需另行申请信用卡即可提供即时分期融资，争夺结账份额并限制自然持卡人增长。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 核心现代化切入点
            body: >-
              Imprint 相对 Synchrony 等传统银行发卡方的主要竞争切入点是软件敏捷性，而非资产负债表规模。它提供 SKU 级商户奖励和即时数字发卡，因此能赢得无法接受传统银行 18
              个月部署周期的品牌忠诚度项目。
            calloutType: insight
            claimRefs:
              - CP001
