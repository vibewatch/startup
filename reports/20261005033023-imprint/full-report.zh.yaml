            - 授信审核
        - label: 激活
          detail: 获批客户获得品牌卡体验的使用权限。
          touchpoints:
            - 虚拟卡
            - 实体卡
        - label: 消费、赚取奖励并兑换
          detail: 卡片活动带来奖励和与品牌绑定的用户互动。
          touchpoints:
            - 购买
            - 奖励兑换
        - label: 项目扩张
          detail: 增加持卡人、产品或合作项目都可能扩大规模。
          touchpoints:
            - 钱包份额
            - 新产品
            - 新合作伙伴
    approximationNotes: 这是根据指定来源综合出的定性流程；不代表经过测量的转化率或已披露的续约表现。
