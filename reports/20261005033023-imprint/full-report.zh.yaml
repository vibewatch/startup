      - number: '2.3'
        title: 买方、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              经济买方是寻求差异化忠诚度和信贷项目的消费品牌；终端用户是品牌客户，持牌合作银行则发行卡片。保留的资料没有确定内部预算负责人、实施价格、收入分成、损失分担条款或合同期限，因此付款方经济性仍是尽调缺口。品牌希望更快上线、定制化、掌控客户数据和提供更精准奖励，这些需求支持采用。Imprint
              报告合作伙伴的钱包份额和消费更高，但这些结果没有独立队列验证。约束来自两端：消费者可能偏好灵活的通用奖励卡，NerdWallet
              也指出其产品组合的兑换限制、赚取选择有限、积分价值偏低及缺少旅行权益。供给端则依赖发卡银行和资本市场关系；据报道新增 20 亿美元债务能力只是融资余量，不代表市场需求、收入或可自由使用的现金。
