              年底估值记录。累计融资尚未对账：Imprint 称融资超过 2 亿美元，Sacra 估算股权融资约 3.52 亿美元，Forbes 列示融资额 4.33 亿美元，三者口径并不一致。另据报道，2026 年的 20
