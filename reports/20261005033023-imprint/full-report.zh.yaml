  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现渠道与定价机制
        blocks:
          - type: paragraph
            body: >-
              Imprint 是一个专业化联名信用卡和品牌忠诚度平台，处在品牌合作伙伴、发卡银行和零售持卡人之间。在商业信用卡项目中，公司收入主要来自两大支柱：贷款收入和交易交换费。Sacra 发布的二手研究估算，贷款收入约占
              Imprint 总收入的 60%，来源是循环信贷利息；据估算，约 50% 的持卡人持有未偿余额，平均余额为 1,200 美元。其余 40%
              的收入主要来自消费者在第三方商户使用联名卡时产生的商户交换费（35%），以及部分高端产品的滞纳金和年费（5%）。对品牌合作伙伴，Imprint 提供白标信用卡基础设施、定制化 SKU
              级忠诚度账本和即时数字发卡。商业报酬并非传统软件许可费，而是与项目组合规模、持卡人消费速度和利息利润分成紧密挂钩。然而，Imprint 是私营公司，具体合同条款、与 H-E-B、Shell 和
              Booking.com 等品牌的交换费分成安排及具体收费结构仍是未经验证的私有指标，对潜在投资人构成重大尽调缺口。
            claimRefs:
