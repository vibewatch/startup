      - number: '3.2'
        title: 架构差异化：ImprintCore 对比传统主机系统
        blocks:
          - type: paragraph
            body: >-
              Imprint 相对传统信用卡银行的竞争差异化，核心在于其名为 ImprintCore 的专有技术架构。Synchrony、Bread Financial
              等传统私牌卡发卡方依赖传统主机系统，主要按宽泛的商户类别码（MCC）汇总持卡人交易，严重限制商户定制和多层级忠诚度方案。相比之下，ImprintCore
              提供专有云原生账本和交易处理栈，可在商户移动应用和结账流程中直接支持实时 SKU 级奖励逻辑。该架构让 H-E-B 等企业零售合作伙伴能针对私牌品牌商品发放 5% 返现，同时对其他商品提供 1.5%；也让
              Crate & Barrel 能编排多层级 10% 家居用品奖励和延期融资选项。此外，Imprint 在集成速度和数字化开户体验上也有差异。传统银行项目通常需要 9 至 18
              个月的定制系统开发和大量纸质的信用审批流程；Imprint
              则利用模块化软件开发工具包（SDK）和即时数字钱包开通，让消费者在结账时即可通过软信用查询立即获得预批虚拟卡，接受报价后才进行硬信用机构查询。这一现代数字架构由 CTO Will Larson 负责，其在
              Stripe、Carta 和 Uber 的工程领导经历增强了 Imprint 执行复杂企业卡基础设施的技术可信度。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 商业经济性、收入模式与资本成本劣势
        blocks:
          - type: paragraph
            body: >-
              Imprint 将自己宣传为高毛利企业品牌软件平台，但其底层商业经济性和竞争防御力很大程度上由消费信贷资产负债表机制决定。据估算，Imprint 总收入约 60%
              来自循环持卡人的贷款利息收入，第三方商户支付的交换费约占 35%，卡费或滞纳金贡献剩余 5%。这一变现结构使 Imprint 与传统店卡银行出现明显的结构性差异。Synchrony Financial
              等传统发卡方用低成本零售客户存款为其庞大贷款组合提供约 84% 的资金，从而获得深厚的净息差保护和极低资本成本。相反，Imprint
              没有存款机构牌照，必须通过批发信贷工具和资本市场债务为循环信贷应收账款融资。Imprint 在 2026 年年中通过获得 20 亿美元承诺债务能力扩大资产负债表余量，其中包括 Citi、Mizuho、Truist
              和 HSBC 等银团提供的 15 亿美元银行仓储额度，以及一笔定价约为基准利率加 160 个基点、获 AAA 评级的 5
              亿美元资产支持证券化；但其边际资金成本相对存款融资银行仍有结构性溢价。因此，宏观利率下调或信用利差扩大可能令 Imprint 更脆弱，并比存款充足的传统银行更严重地压缩贷款利润率。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
              - CP014
