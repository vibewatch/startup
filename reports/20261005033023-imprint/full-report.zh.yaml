            body: >-
              Imprint 的核心技术差异在于拥有自己的处理和账本基础设施，即 ImprintCore，而不是把账本外包给通用银行即服务中介，或依赖传统发卡处理主机。后端采用面向服务的架构，主要用 Go（部分 Java
              服务）实现，运行在 Amazon Web Services（AWS）上的托管 Amazon Elastic Kubernetes Service（EKS）中，基础设施通过 Terraform
              配置。数据持久化在不同微服务之间解耦，每个后端服务维护专用 MySQL 数据库，以严格划分事务边界并隔离数据。在此基础上，Imprint 运行专有信用卡和奖励账本，可实时计算行项目和 SKU
