              - CP007
              - CP008
          - type: callout
            title: 存款不对称与批发债务敞口
            body: >-
              Imprint 已搭建灵活的软件栈，但传统信用卡发卡方凭借低成本零售存款保持结构性的资产负债表优势。Synchrony 84% 由存款提供资金的贷款组合能抵御批发利率冲击，而 Imprint 依赖仓储银团和
              ABS 债务，其净息差容易受到宏观利率变化影响。
            calloutType: risk
