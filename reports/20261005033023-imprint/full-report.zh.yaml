      - number: '4.2'
        title: 成本结构、毛利率驱动因素与组合单位经济性
        blocks:
          - type: paragraph
            body: >-
              信用卡发卡平台的成本结构中可变成本占比较高，主要包括信用损失、债务工具利息支出、合作伙伴奖励资金和收入分成。Imprint 没有银行牌照，依靠 First Electronic Bank 和 First Bank
              & Trust 等合作银行发放贷款，因此毛利率根本受资本成本和贷款表现约束。根据 Fitch Ratings 在 PRNT 2026-A 证券化附近报告的指标，底层循环组合的逾期 60 天以上比率为
              1.78%（低于 2025 年 12 月的 2.22%），总冲销率为 4.86%，月度还款率为 35.77%。Sacra 还称，Imprint 在 2024 年产生 $70m 收入并消耗约 $35m
              运营现金。净息差取决于持卡人 APR 与仓储信贷额度或证券化分层融资成本之间的利差。运营费用主要投向工程、合规风险管理和客户支持。Sacra 的早期分析指出，Imprint 2024 年运营现金消耗约 3,500
              万美元、收入 7,000 万美元，管理层目标是在 2026 年实现 GAAP 盈利。但在不压缩奖励支付或面临合作伙伴流失上升的情况下能否达到这一盈利里程碑，仍未得到验证，因为完整 GAAP
              财务报表和获客成本数据均为私有。
