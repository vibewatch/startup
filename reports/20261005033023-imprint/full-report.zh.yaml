  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              相关市场不是泛金融科技，也不是全部信用卡消费。Imprint 向希望推出联名信用卡，并日益推出存款账户和分期贷款的品牌销售 B2B2C
              运营层。因此，经济边界包括项目设计、发起和服务、承销、奖励，以及品牌赞助产品带来的交易或贷款经济性；恰好使用 “imprint”
              一词的无关业务和技术则被排除，包括自对准光刻、纳米压印胶和促销商品。通用奖励卡也不属于核心供给类别，但它们是重要的现状替代品，因为消费者可在更多商户使用，兑换限制更少。这一边界避免把宽泛的卡消费或同名词市场估算当成
              Imprint 的可触达收入池。
