        - 放贷利息收入、商户交换费分成及平台软件费
        - 循环余额净息差、逾期费及商户项目费
        - 交易处理费、按活跃卡计收的 SaaS 费及交换费分成
      - - 商户收入分成
        - 根据商户忠诚度业务量定制交换费和利息分成
        - 根据项目贷款规模定制收入分成协议
        - 传统联名卡利润分成公式受银行较高门槛收益率约束
        - 几乎不分担或完全不分担信用风险；品牌方按每张卡或每次 API 调用支付软件费
      - - 资产负债表融资成本
        - 批发银行银团（定价约为基准利率上浮 160 bps）和仓储融资额度
        - 批发债务融资额度及合作银行仓储协议
        - 超低成本零售存款，为净息差提供更厚缓冲
        - 没有资产负债表敞口；资本由底层发起银行提供
      - - 商户实施成本
        - 前期软件集成开销较低；SDK 可减少品牌方工程投入
        - 相比传统银行迁移，现代 API 集成开销更低
        - 定制系统集成成本高，且有多年期项目设置费
        - 按使用量计费的开发者定价，品牌方仍需承担前期软件开发
      - - 合同灵活性与条款
        - 多年期企业合同，带绩效 SLA；合作方条款为私有信息
        - 多年期商户合作协议；条款为私有信息
        - 5 至 10 年的僵化独家项目协议，终止罚金高
        - 灵活的月度 SaaS / API 使用协议，不锁定长期排他性
    notes: 商业条款和收入分成动态综合自财务披露、分析师估算及行业标准联名卡经济模型；确切的保密商户收入分成比例未公开。
