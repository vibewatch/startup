  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、传统银行与替代通道
        blocks:
          - type: paragraph
            body: >-
              Imprint 所处的是快速变化的企业联名信用卡和品牌忠诚度生态，竞争者呈现不同类型。它并非传统持牌存款机构，而是与受联邦存款保险的工业银行和州立银行合作，作为专业化 B2B2C
              技术平台和服务商运营，主要合作方为 First Electronic Bank 和 First Bank & Trust；这些银行在 Visa、Mastercard 和 American Express
              支付网络上依法发起信用账户。在这一格局中，Imprint 面临 Cardless 和 Deserve 等现代 API
              优先金融科技发卡方的直接竞争；它们都提供交钥匙联名卡项目，帮助消费品牌摆脱传统银行基础设施。例如，Cardless 强调 Visa、Mastercard 和 Amex 的多网络定制，面向 Qatar
              Airways、Alibaba 等全球知名品牌，并报告收入快速增长、获得风险投资支持以加速企业扩张。与此同时，Synchrony Financial、Bread
              Financial、Barclays、Capital One 和 Citigroup 等传统私牌卡银行仍主导联名零售店卡领域。仅 Synchrony 就拥有根深蒂固的店卡业务，未偿贷款组合超过 1,000
              亿美元，约为 Imprint 贷款组合规模的 200 倍。除专业发卡方外，Stripe Issuing、Marqeta 和 Adyen
              等横向嵌入式金融基础设施供应商，把面向开发者的发卡能力打包进更广泛的银行即服务套件，为评估拆分式金融基础设施的品牌带来间接竞争压力。在零售结账端，Klarna、Afterpay 和 Affirm
              等销售点融资及先买后付（BNPL）平台是不要求正式承诺联名信用卡的顺畅支付替代品，也会争夺消费者交易量。
