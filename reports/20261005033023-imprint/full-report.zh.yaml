              Imprint 的快速扩张与持续获得低成本债务工具和资产支持证券化市场融资密不可分。在拥有 20 亿美元新增债务能力、且 ABS 结构要求 26.10% 信用增级的情况下，组合信用质量一旦恶化（例如总冲销率升至
              4.86% 以上，或 60 天以上逾期率升至 1.78% 以上），就可能压缩仓储借款能力或抬高证券化融资成本，威胁净息差。
