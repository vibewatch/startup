        blocks:
          - type: paragraph
            body: >-
              Imprint 声称其钱包份额高两倍、终身价值高八倍、持卡人消费较上一项目高 20%，这些结果颇具吸引力。这些指标由公司发布，没有披露样本量和期间，保留证据也没有将其对应到具体客户。更重要的是，资料集没有
              NRR、GRR、品牌客户流失率、续约率、合同期限、队列留存或客户满意度序列。Sacra
              还指出客户服务规模化可能带来服务水平罚金和合作伙伴流失，但没有提供已量化的流失事件。因此，投资判断应把留存视为未经验证，不能从上线、融资或持卡人总体增长推断持久性，并应索取合作伙伴层面的队列和续约证据。
