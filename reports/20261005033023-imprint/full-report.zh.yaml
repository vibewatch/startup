  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律结构：依赖合作银行与合规敞口
        blocks:
          - type: paragraph
            body: >-
              Imprint 不是持牌银行，也不是直接存款机构；它以专业化技术平台、项目管理方和服务商身份运营。核心贷款活动和发卡完全依赖州立特许合作银行，具体为 First Bank & Trust（总部位于南达科他州
              Brookings）和 First Electronic Bank（位于犹他州 Salt Lake City 的工业贷款公司）[CR001]。First Electronic Bank 是 Turkish
              Airlines、H-E-B、Booking.com、Kroger 和 Shell 等主要项目的持牌发卡银行[CR013]。这一银行—金融科技合作模式使 Imprint 能依据联邦银行法在全国适用利率，购买
              APR 为 19.99% 至 33.49%；Crate & Barrel Visa Signature 卡等项目的罚息和现金预借 APR 最高达到
              36.00%[CR002]。然而，该结构使公司暴露于围绕“真实贷款方”标准和反规避原则不断变化的州及联邦监管审查[CR008]。威斯康星州参议院第 759
              号法案等州立法倡议，试图采用主要经济利益测试，将非银行项目管理方重新认定为贷款方；若出口利率超过州高利贷上限，利息和收费模式的可执行性将受到威胁[CR008]。此外，Imprint
              持卡人协议普遍包含带集体诉讼放弃条款的强制仲裁，虽然能降低集体诉讼敞口，但消费者在个人或行政程序中提出的索赔主张仍是持续的运营负债[CR003]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR013
