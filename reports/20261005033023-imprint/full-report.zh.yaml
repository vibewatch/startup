      - number: '7.2'
        title: 信用表现、仓储契约与资本市场再融资
        blocks:
          - type: paragraph
            body: >-
              信用卡贷款天然资本密集，需要大额承诺批发债务工具来支持持卡人应收账款。Imprint 建立了 20 亿美元债务融资结构，包括 15 亿美元银行仓储信贷额度和 5
              亿美元资产支持证券（ABS）主信托[CR004]。仓储融资由 Bank of Nova Scotia、Royal Bank of Canada、TD Bank Group、Citi、Mizuho、Truist 和
              HSBC 等全球银行机构组成银团[CR004]。Imprint 成功为其 2026-A 系列 ABS 票据定价，获得 Fitch Ratings 的 AAA 评级并达到 4.7
              倍超额认购，但底层联名应收账款循环组合存在明显信用波动[CR005]。截至 2026 年 8 月，Fitch 报告 60 天以上逾期率为 1.78%（低于 2025 年 12 月的 2.22%），总冲销率为
              4.86%，月度还款率为 35.77%，A 类票据信用增级为 26.10%[CR005]。尽管有这些指标，Imprint 的商业模式仍约 60% 依赖持卡人利息收入；活跃持卡人中约一半持有循环余额，平均为
              1,200 美元[CR006]。对循环消费信贷的高度依赖，使公司对宏观经济下行、借款人违约激增和潜在仓储契约触发高度敏感，这些因素可能限制流动性或加速债务摊还[CR006]。
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
