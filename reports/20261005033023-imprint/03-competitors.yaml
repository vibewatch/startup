callouts:
  - calloutType: "insight"
    title: "The Core Modernization Wedge"
    body: "Imprint's primary competitive wedge against legacy bank issuers like Synchrony is software agility rather than balance sheet scale. By offering SKU-level merchant rewards and instant digital issuance, Imprint wins brand loyalty programs that cannot tolerate 18-month legacy bank deployment cycles."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP007"
      - "CP008"
  - calloutType: "risk"
    title: "Deposit Asymmetry and Wholesale Debt Exposure"
    body: "While Imprint has built a flexible software stack, incumbent credit card issuers maintain a structural balance sheet advantage through low-cost retail deposits. Synchrony's 84% deposit-funded loan portfolio shields it from wholesale rate shocks, whereas Imprint's reliance on warehouse syndicates and ABS debt leaves its net interest margins vulnerable to macro rate shifts."
    claimRefs:
