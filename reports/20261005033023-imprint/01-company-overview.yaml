callouts:
  - calloutType: "insight"
    title: "Platform economics depend on regulated counterparties"
    body: "Imprint controls the co-branded product and loyalty experience, but issuer banks originate the cards. Investment diligence therefore needs both software execution evidence and the private contracts that allocate credit, compliance, reserve, and termination risk."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
  - calloutType: "risk"
    title: "Headline capital figures are not interchangeable"
    body: "The $1.2 billion valuation, cumulative equity or funding disclosures, and $2 billion of debt capacity measure different things. None establishes current cash, ARR, recognized revenue, borrowing utilization, or runway."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
