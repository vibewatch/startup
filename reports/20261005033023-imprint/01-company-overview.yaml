company:
  name: "Imprint"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Imprint is a New York-based co-branded financial-products platform founded in 2020, with a $1.2 billion Series D valuation reported in late 2025. Its disclosed equity totals remain unreconciled, while a separately reported $2 billion of 2026 debt funding capacity supports receivables rather than representing cash available to the company."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      Independent profiles consistently place Imprint's founding in 2020 and its headquarters in New York. The company positions itself as infrastructure for brand-specific financial products rather than as a bank: its current site markets credit cards, deposit accounts, and installment loans, while NerdWallet describes Imprint as the designer and manager of co-branded programs issued through partner banks. That distinction matters because software and loyalty-program execution sit with Imprint, but regulated issuance remains with First Electronic Bank and First Bank & Trust. The assigned pool also contains an unrelated education-app profile named Imprint; its imprintapp.com identity, 2019 founding date, and education focus make it a disambiguation control, not evidence about Imprint Payments. The snapshot below therefore excludes that entity and treats private-market promotional material as context rather than valuation proof.
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      Forbes identifies Daragh Murphy and Gaurav Ahuja as founders, while Imprint's current team page names Murphy as Founder and CEO and shows functional executives spanning legal and business affairs, capital, revenue, technology, risk, and product. This is useful evidence of operating coverage, but it is not a governance map. The assigned sources do not disclose the board, independent directors, founder ownership, investor voting rights, liquidation preferences, or Ahuja's current operating role. Accordingly, the leadership table records only disclosed titles and treats key-person dependence as a diligence question rather than a measured fact. The breadth of named executives may reduce single-function concentration, but founder authority and investor control cannot be inferred from job titles or financing participation.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization and Scale"
    body: >-
      Sacra reports a financing sequence of a $38 million Series A in November 2021, a $75 million Series B in November 2023, and a $75 million Series C at a $600 million valuation in October 2024. It then reports a $150 million Series D in December 2025 at a $1.2 billion valuation, which is corroborated by the later debt-funding account and broadly consistent with Forbes' late-2025 valuation entry. Cumulative funding is not reconciled: Imprint says it has raised over $200 million, Sacra estimates approximately $352 million of equity, and Forbes lists $433 million of funding without a common definition. Separately, the reported $2 billion 2026 package is debt capacity, comprising warehouse facilities and an asset-backed securitization; it is neither equity raised nor cash on hand. Sacra's $70 million 2024 revenue figure is an estimate, not ARR or current recognized revenue.
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "milestones-and-diligence-boundary"
    title: "Milestones and Diligence Boundary"
    body: >-
      The evidence supports a trajectory from venture-funded platform buildout to scaled brand programs and institutional receivables financing. Forbes reports that Imprint won the Rakuten co-brand mandate in 2025, and the company currently highlights Kroger, Shell, and Rakuten programs. That commercial signal should be balanced against NerdWallet's consumer-level critique: co-branded cards can be less flexible than general rewards cards, with limited earning or redemption choices and weak value in some programs. The timeline preserves dated financing milestones without treating announced facilities as utilization or liquidity. It also does not infer a clean legal, regulatory, outage, or complaint history from the assigned adverse search returning no retained result. Those subjects remain diligence gaps, as do current customer count, headcount, recognized revenue, margins, profitability, and board control.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
