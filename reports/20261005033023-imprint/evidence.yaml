evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board membership, founder and investor ownership, voting rights, liquidation preferences, and Gaurav Ahuja's
      current operating role.
    whyItMatters: >-
      Leadership titles and financing participation do not reveal who controls strategic, financing, or liquidity
      decisions.
    diligencePath: >-
      Request the current cap table, charter, voting and investor-rights agreements, board roster, committee charters,
      and succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current recognized revenue, ARR if management uses that metric, gross margin, contribution margin, profitability,
      cash balance, cash burn, runway, active customer count, and headcount.
    whyItMatters: >-
      A 2024 revenue estimate and named programs cannot establish current scale, economics, liquidity, or operating
      leverage.
    diligencePath: >-
      Obtain audited 2024-2025 statements, 2026 management accounts, KPI definitions, partner-level revenue, payroll
      records, and a current cash and debt schedule.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      A round-by-round reconciliation of primary equity, secondaries, debt, and any amounts included in the $433 million
      Forbes funding total.
    whyItMatters: >-
      Funding raised is not cash available, and differing totals can misstate dilution, liquidity, or capital
      requirements.
    diligencePath: >-
      Reconcile executed financing documents, cash proceeds, secondaries, fees, debt draws, and current cash with the
      capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-history
    missingEvidence: >-
      Authoritative legal, regulatory, complaint, outage, and incident records tied to Imprint Payments and its
      issuer-bank programs.
    whyItMatters: >-
      An assigned adverse search with no retained result is a coverage limitation and cannot establish that no incident
      or enforcement action exists.
    diligencePath: >-
      Run entity-specific regulator, court, CFPB complaint, state banking, network, and status-history checks outside
      this constrained chapter pool.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A primary market census with product definition, brand and consumer denominators, spend or revenue pools,
      geography, vintage, and methodology.
    whyItMatters: >-
      Without denominator-complete evidence, the reported penetration signals cannot be converted into a defensible TAM,
      SAM, SOM, or valuation input.
    diligencePath: >-
      Obtain the underlying Nilson analysis and reconcile it with network, issuer-bank, and brand-level program data for
      a common U.S. period.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Program pricing, brand revenue shares, loss allocation, implementation costs, contract duration, renewal terms,
      and internal budget ownership.
    whyItMatters: >-
      Adoption signals do not establish Imprint's obtainable revenue or the return on investment for a prospective brand
      buyer.
    diligencePath: >-
      Review representative partner contracts and interview brand loyalty, finance, and risk owners using a standardized
      unit-economics template.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption
    missingEvidence: >-
      Independent cohort definitions, baselines, sample sizes, retention, credit performance, and attribution for the
      reported wallet-share, spend, cardholder-growth, and lifetime-value outcomes.
    whyItMatters: >-
      Company-reported outcomes may reflect partner mix, selection effects, or different observation windows rather than
      repeatable product impact.
    diligencePath: >-
      Request partner-level cohort analyses and validate them against issuer servicing data and direct references from
      multiple mature programs.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: partner-contract-terms
    missingEvidence: >-
      Granular partner contract terms, exact duration of merchant exclusivity agreements, interchange and interest
      revenue-share splits, and renewal schedules for anchor brands including H-E-B and Booking.com.
    whyItMatters: >-
      Partner concentration is acute, with H-E-B alone driving an estimated 35% of Imprint's 2024 revenue. Contract
      expiration dates or unfavorable revenue-sharing shifts could severely impair platform unit economics and
      competitive defensibility.
    diligencePath: >-
      Request confidential commercial partner contract schedules, master services agreements, and interchange net
      revenue-share audit summaries directly from management under NDA.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Fully reconciled GAAP financial statements disclosing exact net interest margin, gross margin, customer
      acquisition cost (CAC), and partner interchange sharing splits.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot independently verify actual contribution margins or
      determine whether profitability targets can be reached without unsustainable loss rates.
    diligencePath: >-
      Obtain Imprint's audited financial statements, program-level P&L statements, and partner revenue-share contract
      schedules during confirmatory financial diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: transaction-latency-benchmarks
    missingEvidence: Audited transaction processing latency and authorization throughput benchmarks under peak holiday retail loads.
    whyItMatters: High concurrency during major retail events could stress microservice database connections and payment routing.
    diligencePath: >-
      Request production APM latency distribution reports, SLA compliance logs, and stress-testing reports from Imprint
      engineering.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: minor
    topic: public-api-documentation
    missingEvidence: Publicly accessible API specifications, developer sandbox environments, and software integration changelogs.
    whyItMatters: >-
      Assessing developer integration ergonomics and API backward compatibility requires inspecting detailed API
      specifications.
    diligencePath: Obtain partner SDK documentation and developer portal integration guides under commercial NDA.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-risk
    missingEvidence: Partner-level NRR, GRR, logo churn, renewal rate, contract duration, satisfaction, and cohort utilization.
    whyItMatters: Launches and cardholder growth cannot establish recurring partner durability or renewal economics.
    diligencePath: >-
      Request a partner-level cohort export, contracts and renewal calendar, churn bridge, SLA history, and reference
      calls with at least three current partners.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-programs
    missingEvidence: >-
      A complete current customer roster distinguishing signed, implementation, pilot, launched, active, and terminated
      programs.
    whyItMatters: Public names cannot establish the total customer base, deployment mix, or failed-program rate.
    diligencePath: Reconcile the CRM and servicing-system customer roster to signed contracts and active card accounts.
    relatedQuestionRefs:
      - QU002
      - QU004
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: customer-concentration
    missingEvidence: Company-confirmed current partner revenue concentration and a bridge from the third-party 2024 H-E-B estimate.
    whyItMatters: >-
      A roughly 35% partner share, if accurate and persistent, would materially affect renewal and bargaining-power
      risk.
    diligencePath: Obtain audited partner revenue by year, current top-five concentration, contract expiry dates, and renewal status.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: regulatory-enforcement
    missingEvidence: >-
      Public verification of any active non-public regulatory supervisory agreements, CFPB consent decrees, or state
      attorney general investigations regarding Imprint or its sponsor banks.
    whyItMatters: >-
      Supervisory restrictions on First Bank & Trust or First Electronic Bank could halt program expansion, cap balance
      sheet growth, or mandate operational changes.
    diligencePath: >-
      FOIA requests to South Dakota Division of Banking and Utah Department of Financial Institutions, plus review of
      partner bank regulatory exam disclosures.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
