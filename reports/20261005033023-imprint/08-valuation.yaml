callouts:
  - calloutType: "recommendation"
    title: "Why Growth Traction Does Not Equal a Buy"
    body: "While Imprint has demonstrated undeniable top-line velocity and executed tier-1 debt packaging ($2B total capacity), private growth investors should exercise price discipline. Paying 8.6x trailing revenue for a balance-sheet-dependent lender that derives 60% of revenues from consumer interest balances exposes capital to macroeconomic interest rate headwinds and customer support scaling bottlenecks."
