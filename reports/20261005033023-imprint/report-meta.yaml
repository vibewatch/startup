companyProfile:
  summary: >-
    Imprint is a New York-based co-branded financial-products platform founded in 2020. It designs and manages
    brand-specific credit cards, deposit accounts, and installment loans for large consumer brands while partner banks
    handle regulated issuance. The business has raised multiple equity rounds, reached a reported $1.2 billion Series D
    valuation in late 2025, and added $2 billion of debt funding capacity in 2026, but current audited economics,
    governance, and partner retention remain opaque.
