  topStrengths:
    - Named programs and partner-bank relationships show real commercial adoption.
    - Repeated capital access, including a reported Series D and $2 billion of debt capacity.
    - Public evidence shows visible customer growth and product breadth across use cases.
  topRisks:
    - Current GAAP revenue, margins, and profitability timing remain unverified.
    - Partner concentration and renewal economics are opaque.
    - Wholesale debt funding and portfolio credit performance create macro sensitivity.
    - Governance, ownership, and board control remain unreconciled.
  unresolvedGaps:
