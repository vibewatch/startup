figures:
  - id: FM001
    title: Non-nested market adoption lens
    type: pyramid
    summary: >-
      Six evidence layers show category penetration and company-reported
      adoption without presenting them as a mathematical TAM funnel.
    data:
      nodes:
        - label: General-purpose card ownership
          value: 69%
          unit: U.S. consumers
          detail: Broad substitute-category comparator, not addressable revenue.
          claimRefs:
            - CM007
        - label: Co-branded card ownership
          value: 24%
          unit: U.S. consumers
          detail: Category adoption indicator with an undisclosed sample.
          claimRefs:
            - CM007
        - label: Major brands with open-loop programs
          value: "Fewer than 200"
          unit: Major U.S. consumer brands
          detail: Secondary citation; the qualifying brand universe is unavailable.
          claimRefs:
            - CM008
        - label: Significant retail-chain penetration
          value: 8%
          unit: Significant U.S. retail chains
          detail: Denominator and weighting are unavailable.
          claimRefs:
            - CM009
        - label: Grocery penetration
          value: 2-3%
          unit: U.S. grocery brands
          detail: Grocery universe and product definition are unavailable.
          claimRefs:
            - CM009
        - label: Imprint partner cardholder growth
          value: 200%
          unit: Year over year
          detail: Company-reported outcome without cohort or base disclosure.
          claimRefs:
            - CM006
    approximationNotes: >-
      Values preserve their reported units and denominators. The layers are not
      nested, additive, or a conversion funnel, and no midpoint or dollar value
      is inferred from the reported 2-3% range.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
callouts:
  - calloutType: risk
    title: Dollar market size remains unproven
    body: >-
      The retained pool supports product boundaries and penetration signals but
      not a defensible dollar TAM, SAM, or SOM; an investor should require the
      underlying category census, contract economics, and serviceable account
      list before using market size in a valuation case.
    claimRefs:
      - CM016
