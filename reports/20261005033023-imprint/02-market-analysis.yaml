  - id: TM003
    title: Segment, buyer, user, and adoption map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Large retail brands
        - Brand program sponsor
        - Loyal retail customer
        - Commercial allocation not disclosed
        - Apply, receive credit, spend, and redeem brand rewards
        - Not established in retained evidence
        - Faster launch and configurable loyalty economics
      - - Grocery brands
        - Grocery program sponsor
        - Grocery shopper
        - Commercial allocation not disclosed
        - Earn differentiated rewards on private-label and other spend
        - Not established in retained evidence
        - Higher wallet share and targeted rewards
      - - Travel and hospitality brands
        - Travel loyalty-program sponsor
        - Traveler or property customer
        - Commercial allocation not disclosed
        - Apply, spend, and redeem travel-specific value
        - Not established in retained evidence
        - Brand-specific rewards and broader customer engagement
      - - Digital commerce and rewards brands
        - Digital-platform program sponsor
        - Platform member
        - Commercial allocation not disclosed
        - Link card use with the existing rewards ecosystem
        - Not established in retained evidence
        - Customer-data control and customized rewards
      - - Issuer and funding partners
        - Imprint and program sponsor
        - Cardholder served through partner-bank issuance
        - Lending and transaction economics support the program
        - Issue cards and fund receivables
        - Not established in retained evidence
        - Scalable receivables funding and licensed issuance
    notes: >-
      Segment examples are partial rather than exhaustive; pricing, budget
      ownership, revenue shares, loss allocation, and contract terms were not
      disclosed in the retained sources.
