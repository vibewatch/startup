  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A primary market census with product definition, brand and consumer
        denominators, spend or revenue pools, geography, vintage, and methodology.
      whyItMatters: >-
        Without denominator-complete evidence, the reported penetration signals
        cannot be converted into a defensible TAM, SAM, SOM, or valuation input.
      diligencePath: >-
        Obtain the underlying Nilson analysis and reconcile it with network,
        issuer-bank, and brand-level program data for a common U.S. period.
      relatedQuestionRefs:
        - QM002
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: >-
        Program pricing, brand revenue shares, loss allocation, implementation
        costs, contract duration, renewal terms, and internal budget ownership.
      whyItMatters: >-
        Adoption signals do not establish Imprint's obtainable revenue or the
