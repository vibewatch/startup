company:
  name: Imprint
chapter:
  number: 6
  title: Customers
  summary: >-
    Imprint shows credible adoption through named issued-card programs, a company-reported
    200% year-over-year increase in cardholders, and a current website counter of roughly
    13 million transactions. Evidence of durability is materially weaker: no retained
    source discloses NRR, GRR, churn, renewal terms, or audited partner concentration.
sections:
  - id: customer-architecture
    title: Customer architecture and segmentation
    body: >-
      Imprint serves a two-sided customer architecture. The commercial buyer is a consumer
      brand seeking a tailored card and loyalty program; the user is the brand's cardholder,
      who applies, spends, earns, and redeems through a brand-linked experience. The current
      official surface identifies issued programs across grocery, travel, fuel, ecommerce,
      and specialty retail, including H-E-B, Booking.com, Kroger, Shell, Rakuten, and Fetch.
      This breadth supports the existence of several enterprise use cases, but it does not
      disclose how economics differ by vertical, which party bears implementation cost, or
      whether partner contracts contain minimum volumes. First Electronic Bank remains an
      explicit issuing-bank dependency, so the buyer relationship is not the only durable
      link required to keep a program operating.
    claimRefs: [CU001, CU002, CU012]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named-program proof
    body: >-
      Public evidence indicates substantial growth, but its comparability is limited.
      Imprint said its cardholder base increased 200% year over year in December 2025;
      CardRates repeated that attributed figure, while Sacra separately reported more than
      400,000 cardholders. The official website now displays approximately 13 million
      transactions and counting. These are meaningful usage signals, yet none supplies a
      common starting population, measurement window, active-user definition, or cohort.
      Named-program proof is stronger than logo-only evidence because the official legal
      disclosures identify issued cards and the 2025 release says several partnerships
      launched. Customer-specific outcomes, migration completion, utilization, and
      production uptime are not independently reported, so the evidence supports adoption
      rather than verified customer success.
    claimRefs: [CU002, CU003, CU007, CU010, CU013, CU016]
    tableRefs: [TU002, TU003]
  - id: durability
    title: Retention, durability, and reference quality
    body: >-
      Imprint publishes attractive aggregate outcome claims: two times higher wallet share,
      eight times higher lifetime value, and 20% higher cardholder spend versus a prior
      program. Those metrics are company-issued, lack disclosed sample sizes and periods,
      and are not tied to individual customers in the retained evidence. More importantly,
      the source set contains no NRR, GRR, logo churn, renewal rate, contract duration,
      cohort retention, or customer-satisfaction series. Sacra also flags customer-service
      scaling as a potential source of service-level penalties and partner churn, but does
      not provide a measured churn event. The underwriting case should therefore treat
      retention as unverified, not infer durability from launches, funding, or aggregate
      cardholder growth, and request partner-level cohort and renewal evidence.
    claimRefs: [CU004, CU005, CU006, CU015]
  - id: expansion-concentration
    title: Expansion paths and concentration risk
    body: >-
      The company's stated journey runs from application through spend, earn, redeem, and
      repeat, creating plausible expansion surfaces through more cardholders, higher wallet
      share, additional products, and more partner programs. Imprint also says that its 2026
      debt funding increases capacity to support programs as they scale. Capacity is not
      proof of customer demand, however, and the retained sources do not disclose signed
      backlog or partner-level expansion. Sacra estimates that H-E-B represented about 35%
      of 2024 revenue, which would be material concentration if accurate, but the estimate
      is neither company-confirmed nor reconciled to current revenue. CardRates additionally
      notes a consumer-side tradeoff: value may fragment across multiple brand cards. The
      next diligence step is a partner revenue, renewal, and pipeline bridge.
    claimRefs: [CU008, CU009, CU011, CU014]
    figureRefs: [FU001]
