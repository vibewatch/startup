      - [Rakuten, Ecommerce, "Rakuten American Express Card", "Issued-card disclosure and company-stated launch", null, "No customer-authored outcome or renewal evidence"]
      - [Shell, Fuel, "Shell Performance Elite World Mastercard", "Issued-card disclosure supports production, not pilot", null, "No launch timing, program scale, or partner-specific outcome"]
