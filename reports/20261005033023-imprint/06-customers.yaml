          touchpoints: ["Mobile app", "Checkout flow"]
        - label: Cardholder application
          detail: "A consumer applies through the brand-linked experience."
          touchpoints: ["Application", "Underwriting"]
        - label: Activation
          detail: "An approved customer receives access to a branded card experience."
          touchpoints: ["Virtual card", "Physical card"]
        - label: Spend, earn, and redeem
          detail: "Card activity generates rewards and brand-linked engagement."
          touchpoints: ["Purchases", "Rewards redemption"]
        - label: Program expansion
          detail: "Additional cardholders, products, or partner programs can increase scale."
          touchpoints: ["Wallet share", "New products", "New partners"]
    approximationNotes: "This is a qualitative sequence synthesized from assigned sources; it does not imply measured conversion rates or disclosed renewal performance."
    claimRefs: [CU001, CU009, CU011, CU014]
callouts:
  - calloutType: risk
    title: Retention is the central customer diligence gap
    body: >-
      Launches and cardholder growth demonstrate acquisition, not durability. Request
      partner-level revenue concentration, renewal dates, gross and net retention, active
      cards, cohort spend, service-level breaches, and reference calls before underwriting
      recurring customer value.
    claimRefs: [CU008, CU015]
