  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not generic fintech and not all credit-card spending. Imprint sells a B2B2C
              operating layer for brands that want co-branded credit cards and, increasingly, deposit accounts and
              installment loans. The economic perimeter therefore includes program design, origination and servicing,
              underwriting, rewards, and transaction or lending economics associated with brand-sponsored products. It
              excludes unrelated businesses and technologies that happen to use the word "imprint," including
              self-aligned lithography, nano-imprint glue, and promotional merchandise. General-purpose rewards cards
              are also outside the core supply category, but they are a meaningful status-quo substitute because
              consumers can use them across merchants with fewer redemption restrictions. This boundary prevents broad
              card-spend or homonym market estimates from being presented as Imprint's addressable revenue pool.
            claimRefs:
