  - id: TV002
    title: Thesis and anti-thesis evaluation matrix
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - What Would Change View
    rows:
      - - Commercial Scale
        - Grew revenue 367% YoY to $70M in 2024 with premier brands like H-E-B and Booking.com.
        - High revenue concentration where H-E-B alone drove roughly 35% of total 2024 revenue.
        - Evidence of top-3 partner concentration dropping below 25% of total platform volume.
      - - Balance Sheet & Funding
        - Secured $2B in debt capacity, including $1.5B in bank warehouses and $500M in AAA ABS.
        - Wholesale capital structure lacks deposit insulation, elevating cost of funds relative to bank peers.
        - Securing an industrial bank charter or lower-cost persistent retail funding mechanism.
      - - Monetization Model
        - Dual monetization capturing 60% lending interest and 40% merchant interchange and card fees.
        - Extreme vulnerability to benchmark interest rate cuts and consumer credit deterioration.
        - Expansion of software SaaS fees or brand subscription revenues reducing pure credit reliance.
      - - Path to Profitability
        - Management targets GAAP profitability by 2026 through operational leverage and AI automation.
        - Burned $35M in 2024 with reported customer support turnover and scaling friction.
        - Audited confirmation of consecutive positive GAAP operating quarters and lower support cost ratios.
    notes: >-
      Core thesis pillars contrast commercial and balance-sheet execution against concentration, structural funding, and
      profitability hurdles.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
  - id: TV003
    title: Scenario analysis and return expectations
    columns:
      - Scenario
      - Operating & Financial Assumptions
      - Valuation / Multiple Logic
      - Probability Signal
      - Downside Triggers
    rows:
      - - Bull Case
        - >-
          Cardholder growth sustains >100% YoY; annual revenue reaches $200M+; GAAP profitability attained; net credit
          losses <3.5%.
        - >-
          $2.0B - $2.5B valuation based on 10x-12x forward revenue multiple as a market-leading embedded fintech
          franchise.
        - 25%
        - Execution bottleneck in tier-1 enterprise onboarding or customer service SLA penalties.
      - - Base Case
        - >-
          Revenue expands to $110M-$130M; loan book reaches $750M; ABS spreads tighten; breakeven delayed into late
          2026.
        - $1.0B - $1.2B valuation holding flat to Series D levels (~8x-9x normalized revenue multiple).
        - 50%
        - Moderate retail spending deceleration and gradual benchmark rate cuts compressing lending margins.
      - - Bear Case
        - Fed rate cuts compress net interest margins; major brand partner churns; gross charge-offs breach 6.0%.
        - $500M - $700M valuation representing 50% multiple haircut and potential structured down-round.
        - 25%
        - H-E-B non-renewal, severe credit losses in retail portfolios, or warehouse debt covenant tightening.
    notes: >-
      Scenario ranges reflect sensitivity to interest rate trends, wholesale debt spreads, and enterprise partner
      retention.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
