callouts:
  - calloutType: "risk"
    title: "Debt Dependency and Credit Performance Exposure"
    body: "Imprint's rapid scale is inextricably linked to continuous access to low-cost debt facilities and asset-backed securitization markets. With $2.0B in new debt capacity and an ABS structure requiring 26.10% credit enhancement, any deterioration in portfolio credit quality (such as spikes in the 4.86% gross charge-off rate or 1.78% 60+-day delinquency rate) could constrain warehouse borrowing capacity or elevate securitization financing costs, threatening net interest margins."
    claimRefs:
      - "CI008"
      - "CI012"
      - "CI014"
      - "CI016"
  - calloutType: "insight"
    title: "Bifurcated Revenue Engine: Revolving Interest vs. Transaction Interchange"
    body: "Unlike pure interchange-driven fintechs, Imprint generates roughly 60% of estimated revenue from revolving cardholder interest, with the remaining 40% coming from transaction interchange and card fees. This dual model yields higher revenue per cardholder than transactional debit models, but introduces balance-sheet credit exposure and sensitivity to consumer default cycles."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
