evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited or management-reported revenue, product-level monetization, active customers, headcount, burn, runway, and
      gross margin.
    whyItMatters: >-
      The $1 billion valuation cannot be assessed against operating scale or cash requirements without these
      denominators.
    diligencePath: >-
      Request monthly management accounts, product revenue split, cohort metrics, payroll/headcount schedule, and cash
      runway bridge.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive, board, legal-entity, cap-table, and investor-rights documentation.
    whyItMatters: >-
      Founder dependence, control, dilution, and related-party exposure cannot be evaluated from named stakeholders
      alone.
    diligencePath: >-
      Obtain corporate registry extracts, organizational chart, board minutes, cap table, shareholder agreements, and
      beneficial-owner disclosures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: licensing
    missingEvidence: Current licensing and compliance status for the planned US and EU expansion.
    whyItMatters: >-
      The strategy explicitly depends on regulatory and compliance infrastructure, while the predecessor TON project had
      a major SEC enforcement history.
    diligencePath: >-
      Request jurisdiction-by-jurisdiction legal opinions, licenses, registrations, compliance policies, and regulator
      correspondence.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: TOP product-level revenue, pricing, take rates, paid-account counts, retention, and customer concentration.
    whyItMatters: >-
      Without payer conversion and monetization data, ecosystem reach cannot be translated into SAM, SOM, or valuation
      support.
    diligencePath: >-
      Request a product-level revenue bridge, pricing sheets, cohort retention, customer concentration, and signed
      commercial pipeline under NDA.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A third-party market study that isolates Telegram/TON infrastructure spend by geography and buyer segment.
    whyItMatters: >-
      Current sources measure audience, wallets, or API practices but do not establish a comparable TOP market
      denominator.
    diligencePath: >-
      Commission or obtain an analyst bottom-up sizing by Mini App, wallet, payment, and developer-tooling spend, with
      explicit exclusions.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: ecosystem-reach
