      - [5, "Financial opacity and runway", "Unknown", "High", "Unverified", "High", "Runway cannot fund compliance, security, and product operations"]
    notes: "Likelihood and residual exposure are analytical ratings anchored to the cited regulatory and dependency evidence; public sources do not disclose TOP's internal control testing or financial runway."
    claimRefs: [CR001, CR004, CR008, CR010, CR011, CR013, CR016, CR018]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Crypto-asset authorization, disclosure, and supervision", "European Union", "MiCA framework and measures in application", "Medium", "High", "Map each product and entity to CASP obligations", "High", "Obtain legal-entity and license matrix by EEA country"]
      - ["Virtual-asset activities, custody, AML/CFT, and sanctions", "ADGM / UAE", "FSRA framework requires approval for authorized-person virtual-asset use", "Medium", "Critical", "Confirm licensed entity, scope, custody, and controls", "High", "Request licenses, permissions, policies, and latest compliance testing"]
      - ["Virtual-asset activities in Dubai", "Dubai / UAE", "VARA framework issued and subject to refinement", "Medium", "High", "Confirm applicable VARA activity and authorization", "High", "Obtain regulator correspondence and jurisdictional permissions"]
      - ["Sanctions screening and blocked-party exposure", "United States / cross-border", "OFAC maintains active country and thematic programs", "Medium-high", "Critical", "Test wallet screening, geofencing, escalation, and recordkeeping", "High", "Review sanctions-control design, exceptions, and audit results"]
      - ["Telegram founder criminal investigation", "France", "Investigation reported as ongoing in March 2025", "Low-medium", "High", "Assess contractual and distribution contingency", "Medium-high", "Obtain current counterparty-risk assessment and fallback-channel plan"]
    enumerationScope:
      coverage: partial
      basis: "Publicly identified regulatory and legal issues for TOP-related products and distribution as of 2026-10-23"
    notes: "This is a partial public-register, not a complete legal opinion; status describes the cited source, and no row establishes a TOP violation."
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR015]
  - id: TR003
    title: Operational, partner, and financial risk register
    columns: [Failure mode, Likelihood, Severity, Evidence, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Telegram or TON policy change", "High", "High", "TON Connect exclusivity and migration requirement reported", "Partially evidenced", "High", "No quantified fallback distribution or migration impact"]
      - ["Wallet custody, key, or transaction-control failure", "Medium", "Critical", "Self-custodial product and regulatory custody controls are material", "Unverified", "High", "No public incident, recovery, insurance, or control-testing record"]
      - ["Sanctions or illicit-finance control failure", "Medium-high", "Critical", "OFAC programs and ADGM/ESMA control requirements", "Unverified", "High", "No public screening, monitoring, or escalation metrics"]
      - ["Compliance and security cost overrun", "Unknown", "High", "Multi-jurisdictional obligations and multi-product portfolio", "Unverified", "High", "No burn, runway, margin, or compliance-cost disclosure"]
      - ["Telegram ecosystem trust or access shock", "Medium", "High", "French investigation and reported developer backlash", "Partially evidenced", "Medium-high", "No disclosed contractual protection or alternative channel"]
    notes: "Rows distinguish documented external conditions from TOP-specific unknowns; 'unverified' does not mean absent, and the evidence column is not a substitute for internal control testing."
    claimRefs: [CR005, CR006, CR010, CR011, CR013, CR014, CR015, CR016, CR018, CR019]
