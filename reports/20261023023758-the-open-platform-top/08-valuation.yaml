      - [Risk rating, "High", "Regulatory, disclosure, concentration, and commercialization risks remain material.", medium]
      - [Valuation stance, "Stretched / not fully testable", "$1 billion is a financing reference, not a demonstrated fair-value output.", medium]
    notes: "Assessment uses public sources available on 2026-10-23; no revenue, ARR, margin, retention, cap-table, or preference data were found in the retained evidence."
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV010, CV011]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Investment implication]
    rows:
      - ["Telegram/TON distribution can lower customer-acquisition friction.", "TOP and coverage describe Telegram-native applications and a billion-user distribution thesis.", "Verified active users, conversion, retention, and monetization by product.", "Supports upside, but reach is not revenue."]
      - ["Institutional financing validates strategic potential.", "Ribbit-led $28.5 million extended Series A and reported $70 million total funding.", "A new round at an independently verified price with operating disclosures.", "Positive signal, not a return guarantee."]
      - ["The headline price may be ahead of fundamentals.", "No retained source reports TOP revenue, ARR, margin, or net retention.", "Audited or reconciled financials and a defensible denominator.", "Favors research-more at the stated mark."]
      - ["Regulatory execution is a gating risk.", "TOP's expansion plan includes licensing and compliance; the SEC record shows Telegram ecosystem legal precedent.", "Jurisdiction-specific approvals and a clean compliance record.", "Requires a downside adjustment until verified."]
    notes: "Rows separate strategic evidence from the missing denominators and conditions that would change the investment view."
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Regional expansion succeeds; licensing is obtained; Telegram distribution produces repeatable paid usage and improving margins.", "A future round above $1 billion could be justified if verified growth and margins support it; no target multiple is supportable today.", "Regulatory delay, product adoption, and platform dependency.", "Low-to-medium; requires several unverified milestones."]
      - [Base, "The $1 billion mark remains a financing reference while revenue, retention, and ownership terms stay opaque.", "Track or conduct diligence rather than assign a fabricated return; entry discipline should require a risk-adjusted discount.", "Information asymmetry and dilution/preference uncertainty.", "Medium; closest to current public evidence."]
      - [Bear, "Expansion or monetization underperforms, regulatory friction rises, or the next financing is below the prior mark.", "Down-round or multiple compression can impair holders; downside cannot be quantified without the cap table and preference stack.", "Liquidity, regulatory, customer concentration, and commercialization failure.", "Material; adverse evidence makes it non-trivial."]
    notes: "Scenarios are qualitative probability signals, not a numerical valuation model; public evidence lacks the denominators required to calculate target returns or precise ranges."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]

