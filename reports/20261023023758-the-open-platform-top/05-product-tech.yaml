    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or control question]
    rows:
      - ["Distribution layer", "Telegram messages, channels, bots, and mini apps expose discovery", "Telegram platform availability and policy", "What happens to acquisition and access if platform rules or APIs change"]
      - ["Wallet interface layer", "Wallet connection, signing, and UI components", "TON wallets and TonConnect packages", "Verify version compatibility, signing semantics, and supply-chain controls"]
      - ["Settlement layer", "TON blockchain transactions and assets", "TON network and external wallet infrastructure", "Quantify confirmation, congestion, fee, and recovery behavior"]
      - ["EVM adapter layer", "EVM application access through TON and Telegram", "TAC adapter, bridges, protocols, and liquidity", "Establish bridge limits, audit coverage, pause authority, and loss allocation"]
      - ["Application portfolio layer", "Consumer and DeFi applications built around the distribution channel", "Portfolio companies and third-party dApps", "Map code ownership, data boundaries, and shared incident response"]
      - ["Wallet signing controls", "Connection and confirmation UI components are publicly documented", "TonConnect and wallet implementations", "Request threat model, key-handling boundaries, and recovery design"]
      - ["Bridge security", "TAC lists 2026 post-mortems for a Cosmos EVM exploit and a TAC Bridge incident", "TAC bridge and adapter infrastructure", "Obtain incident reports, audits, remediation evidence, and loss allocation"]
      - ["Platform dependency", "Telegram is the distribution context for mini apps and wallet use", "Telegram platform, APIs, and policy", "Request API-change process and platform contingency plan"]
      - ["Reliability and support", "No TOP SLA or uptime data appears in the assigned evidence", "TOP services and ecosystem dependencies", "Request uptime history, SLOs, incident register, and support targets"]
      - ["Entity and data boundaries", "Product and portfolio relationships are not fully disclosed", "TOP, associated products, and third-party dApps", "Obtain group structure, code ownership, data map, and intercompany agreements"]
    notes: "This is an evidence-bounded operating model synthesized from public integration descriptions; TOP's internal deployment topology is not disclosed in the assigned pool."
    claimRefs: [CE002, CE005, CE006, CE008, CE010]
figures:
  - id: FE001
    title: Telegram-to-TON product architecture
    type: stack
    summary: Public evidence supports a layered path from Telegram distribution to wallet connectivity, TON settlement, and EVM application access.
    data:
      layers:
        - label: Distribution
          modules:
            - label: Telegram messages, bots, and channels
              detail: Discovery and entry points for mini apps and wallet workflows.
              note: Platform dependency is not independently quantified.
        - label: Application surface
          modules:
            - label: Telegram Mini Apps
              detail: In-message application context described by external ecosystem coverage.
              note: TOP-specific adoption and support metrics are unavailable.
        - label: Wallet connectivity
          modules:
            - label: TonConnect SDK
              detail: SDK for connecting dApps to TON wallets.
            - label: TonConnect UI and React UI
              detail: UI components for wallet connection, selection, and confirmation.
        - label: Settlement
          modules:
            - label: TON blockchain
              detail: Underlying blockchain environment for TON wallet interactions.
              note: Assigned evidence does not establish TOP control of the network.
        - label: EVM expansion
          modules:
            - label: TAC adapter and mainnet
              detail: Public TAC material describes EVM applications reaching TON and Telegram.
              note: Any TOP relationship, audit scope, and incident boundaries require verification.
        - label: Security and operations
          modules:
            - label: Reliability, audit, and incident controls
              detail: Control evidence and operating metrics require private diligence.
              note: No TOP-wide SLA or certification is verified in the assigned pool.
    approximationNotes: "Layer order is an analytical representation of public integration surfaces, not a disclosed TOP internal architecture or dependency graph."
    claimRefs: [CE003, CE005, CE006, CE008, CE010]
