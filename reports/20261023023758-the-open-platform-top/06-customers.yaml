schemaVersion: "report-v2"
artifact: customers
slug: the-open-platform-top
runDate: 2026-10-23
company:
  name: The Open Platform (TOP)
chapter:
  number: 6
  title: Customers
  summary: TOP's disclosed customer surface is an ecosystem of Telegram-native consumer applications and infrastructure rather than a transparent enterprise account base. The evidence shows broad distribution and several live products, but not enough public denominators to verify active users, retention, revenue concentration, or repeat usage.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: TOP's customer architecture spans at least three distinct populations. Consumers use Wallet in Telegram, Tonkeeper, Notcoin and other applications for asset management, payments, games, and digital-asset activity. Creators and community operators use Tribute to monetize subscriptions, donations, and physical or digital goods inside Telegram. Developers and ecosystem projects use TON-oriented infrastructure and marketplaces, while liquidity providers and traders interact with STON.fi, Getgems, and related products. TOP's own 2025 description names Wallet in Telegram, Tonkeeper, STON.fi, Getgems, Tribute, and Notcoin as portfolio products, and says the portfolio is intended to leverage Telegram as a distribution channel. The segment map is therefore credible as a product-and-use-case taxonomy, but it is not a disclosed customer-count or revenue segmentation. The available materials do not identify payer mix, average revenue per user, contract terms, geographic revenue, or the share attributable to each product.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption evidence and named product proof
    body: Evidence of real customer-facing operation is strongest where a product exposes a live workflow, a named license, or a public marketplace. Wallet in Telegram's regulatory update identifies a custodial wallet embedded in Telegram and names the Uzbek operating entity TGHAMYON, with an official launch date of 9 December 2025. Tribute's live service page states that more than 70,000 authors use the platform and describes subscriptions, donations, digital goods, physical goods, Telegram-native operation, and a 10% fee; those figures remain company-controlled and are not independently corroborated in this pool. Getgems exposes live offers, auctions, fixed-price sales, bundles, and Telegram Stars purchasing, while CoinGecko lists TON ecosystem assets and DEX activity, including STON.fi and DeDust. These are useful proof points for product availability and transaction surfaces, not proof of TOP-level active customers, retention, or revenue.     TOP's portfolio announcement names Notcoin but supplies no adoption metric for it.
    claimRefs: [CU002, CU005, CU006, CU007, CU008, CU009, CU014, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-risk
    title: Durability, expansion, and concentration risk
    body: >
      The customer thesis depends on distribution through Telegram and on continued activity across the TON ecosystem, but the assigned evidence does not disclose cohorts, gross retention, net retention, churn, renewal rates, contract length, or product-level monetization. Tribute describes twice-monthly payouts and a transparent 10% fee, which demonstrates an operating monetization workflow for creators but does not establish creator retention or TOP revenue. The ecosystem is also exposed to infrastructure and partner interruptions: the TAC post-mortem reports a May 2026 bridge exploit, a temporary pause of the TON/TAC cross-chain framework, and disruption to wallet, staking-related, and Telegram Mini App integrations across the TAC ecosystem. TAC is not a TOP operating disclosure, so this is ecosystem context rather than proof of a TOP incident; it nevertheless illustrates why partner, bridge, and platform dependencies matter to customer durability. TOP's public valuation announcement says capital will support expansion across the US, EU, and other regions, but gives no customer-level expansion targets. Key diligence remains product-level active users, retention, revenue concentration, cohort behavior, and dependency exposure.
      Separately, the SEC's 2020 settlement with Telegram concerned the Gram token offering, not TOP, but it demonstrates historical regulatory constraints around blockchain distribution through Telegram.
    claimRefs: [CU010, CU011, CU012, CU013, CU015]
    callouts:
      - calloutType: strength
        title: Distribution-led customer acquisition
        body: TOP has a coherent consumer and creator acquisition surface through Telegram-native products, but public evidence measures reach and product availability more readily than durable monetization.
        claimRefs: [CU001, CU002, CU005]
      - calloutType: risk
        title: Retention and concentration remain unverified
        body: No assigned source provides TOP-level cohorts, NRR, GRR, churn, customer concentration, or revenue by product; these are material diligence gaps rather than zero values.
        claimRefs: [CU010, CU011, CU013]
    figureRefs: [FU001]
