    notes: Values retain the source's unit and qualification. The table mixes distribution, creator count, fee, ecosystem rank, and launch date; it is not a single comparable funnel and does not imply conversion.
    claimRefs: [CU003, CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: Publicly named TOP portfolio products and adjacent TON customer-facing services visible in assigned sources as of 2026-10-23; not an exhaustive customer list.
    columns: [Named product or service, Segment, Deployment or use case, Production versus pilot, Outcome or observed surface, Limitation]
    rows:
      - ["Wallet in Telegram", "Consumers", "Custodial storage, management, and transfers inside Telegram", "Production operation evidenced by an official Uzbek license and launch notice", "Licensed local operation identified as TGHAMYON", "No user or transaction denominator"]
      - ["Tribute", "Creators and community operators", "Paid subscriptions, donations, and digital or physical goods in Telegram", "Production service page", "More than 70,000 authors claimed and 10% fee stated", "Company-controlled count and no independent retention evidence"]
      - ["Getgems", "Collectors and traders", "NFT, gift, bundle, and Telegram Stars marketplace", "Live marketplace surface", "Offers, auctions, fixed-price sales, bundles, and Stars purchase paths visible", "No TOP customer attribution or volume history"]
      - ["STON.fi", "Traders and liquidity providers", "TON swaps and liquidity provision", "Live ecosystem product listed by TOP and CoinGecko", "CoinGecko lists STON.fi market activity", "No TOP revenue or user cohort evidence"]
      - ["Notcoin", "Telegram consumers and gamers", "Tap-to-earn game described by TOP", "Product named in TOP portfolio disclosure", "Named portfolio product", "TOP's portfolio announcement supplies no usage detail"]
    notes: Named products are not equivalent to independently verified TOP customers. The production/pilot classification records the observed public surface, not contractual status or revenue contribution.
    claimRefs: [CU002, CU005, CU006, CU007, CU008, CU009, CU014, CU016]
figures:
  - id: FU001
    title: Customer journey from Telegram distribution to expansion
    type: journey-map
    summary: Public evidence shows a plausible Telegram-to-product-to-monetization path, while retention and expansion measurement remain unreported.
    data:
      items:
        - label: Distribution
          stage: Distribution
          title: Telegram access
          detail: TOP describes Telegram's global reach as a distribution channel; audience size is company-stated.
          value: "1 billion users"
          unit: users
        - label: Consumer onboarding
          stage: Consumer onboarding
          title: Wallet and app entry
          detail: Wallet in Telegram is described as embedded custodial crypto functionality; Uzbekistan licensing and launch are documented.
          value: "9 Dec 2025"
          unit: launch date
        - label: Creator onboarding
          stage: Creator onboarding
          title: Tribute authors
          detail: Tribute states that more than 70,000 authors use its subscription, donation, and goods tools.
          value: "70,000+"
          unit: authors
        - label: Transaction activity
          stage: Transaction activity
          title: Trading and marketplace surfaces
          detail: CoinGecko lists TON DEX activity and Getgems exposes live offers, auctions, bundles, and Stars purchase paths.
          value: null
          unit: public surface
        - label: Monetization
          stage: Monetization
          title: Platform fee and payouts
          detail: Tribute states a 10% commission and twice-monthly payouts.
          value: "10%"
          unit: commission
        - label: Expansion
          stage: Expansion
          title: Portfolio and geographic expansion
          detail: TOP says new capital supports portfolio expansion across the US, EU, and other regions.
          value: null
          unit: target geography
    approximationNotes: The stages are an evidence map, not a measured conversion funnel; the sources do not establish a common population, period, or conversion rate.
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU008, CU013, CU016]
callouts:
  - calloutType: recommendation
    title: Request product-level customer diligence
    body: Obtain monthly active and paying users, cohorts, retention, gross payment volume, revenue, and concentration by Wallet, Tonkeeper, STON.fi, Getgems, Tribute, Notcoin, and infrastructure products before underwriting the unicorn valuation.
    claimRefs: [CU010, CU011, CU013]
  - calloutType: insight
    title: Customer proof is broad but shallow
    body: The pool supports a multi-sided Telegram-native product map and several live production surfaces, but it does not support a durable customer or revenue base with disclosed denominators.
    claimRefs: [CU001, CU005, CU006, CU007, CU008]
