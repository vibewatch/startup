    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "The map places alternatives by evidenced TON specialization and distribution breadth; coordinates are ordinal analytical placements, not measured market scores."
    data:
      xAxis:
        label: Distribution breadth
        min: 1
        max: 5
        lowLabel: Narrow
        highLabel: Broad
        description: "Ordinal placement based on the breadth of user or developer distribution explicitly described in the retained sources."
      yAxis:
        label: TON specialization
        min: 1
        max: 5
        lowLabel: Generalist
        highLabel: TON-native
        description: "Ordinal placement based on explicit TON-native product or development scope in the retained sources."
      points:
        - {label: TOP / AppKit, x: 4, y: 5, tone: positive, detail: "Telegram-linked TON infrastructure and application toolkit; AppKit is alpha", claimRefs: [CP001, CP002, CP010]}
        - {label: Walt, x: 4, y: 3, tone: neutral, detail: "Telegram-native custodial app with broad crypto and tokenized-asset scope", claimRefs: [CP005, CP006]}
        - {label: Keeper, x: 5, y: 2, tone: neutral, detail: "Multichain self-custody wallet with TON among supported networks", claimRefs: [CP007]}
        - {label: DeDust, x: 2, y: 5, tone: neutral, detail: "TON-native DEX with protocol-specific scope", claimRefs: [CP011]}
        - {label: EvaCodes, x: 3, y: 4, tone: neutral, detail: "Vendor-described TON development provider", claimRefs: [CP003, CP004]}
        - {label: Status quo / internal build, x: 2, y: 3, tone: risk, detail: "Buyer-owned engineering; no public capability or cost evidence in this pool", claimRefs: [CP014]}
    claimRefs: [CP001, CP003, CP005, CP007, CP011, CP014]
callouts:
  - calloutType: strength
    title: Distribution is the clearest differentiator
    body: TOP's strongest evidenced advantage is the combination of Telegram reach and TON-specific infrastructure, not a disclosed price or service-level moat.
    claimRefs: [CP001, CP002]
  - calloutType: risk
    title: Competitor comparability remains weak
    body: Public pages expose features and starting prices, but not comparable customer scale, retention, switching costs, realized pricing, or win/loss data.
    claimRefs: [CP003, CP009, CP014]
