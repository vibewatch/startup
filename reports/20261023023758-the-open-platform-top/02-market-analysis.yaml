callouts:
  - calloutType: insight
    title: Distribution is the wedge, not the TAM
    body: Telegram reach and TON activity make distribution and integration speed plausible advantages, but the public record does not convert that reach into TOP revenue, paid accounts, or obtainable share.
    claimRefs: [CM005, CM006, CM009]
  - calloutType: risk
    title: Commercial proof remains the gating evidence
    body: TOP-specific pricing, take rates, customer concentration, retention, and product-level revenue are not disclosed in the assigned evidence, so valuation relevance remains sensitive to unverified conversion assumptions.
    claimRefs: [CM009, CM014]
