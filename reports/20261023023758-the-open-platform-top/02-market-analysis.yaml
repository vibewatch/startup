      - [TON Stat, 2026, TON network, "61.38 million on-chain activated wallets", null, "Displayed network metric", medium, "Definition and measurement methodology require diligence"]
      - [TON Stat, 2026, TON network, "3.385 million monthly active wallets", null, "Displayed network metric", medium, "Activity is not revenue, users of TOP, or paying accounts"]
      - [TON Stat, 2026, TON network, "4.207 million transactions per day", null, "Displayed network metric", medium, "Transactions are not revenue and may include automated activity"]
      - [Postman, 2025, Global survey, "82% adopted some API-first approach; 65% report API-program revenue", null, "Survey of over 5,700 developers, architects, and executives", medium, "API-wide survey is not a TON/TOP market estimate"]
    notes: "Values are separate lenses with different populations, units, and methods; they must not be summed or presented as a conventional TAM/SAM/SOM funnel."
    claimRefs: [CM005, CM006, CM007, CM008, CM015]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Mini App developers, Product and engineering teams, Telegram users, Developer or product budget, Build WebView app through bot integration, Head of product/engineering, Better UX than a bot and access to Telegram distribution]
      - [Wallet and payment operators, "Product, compliance, and engineering teams", Users and merchants, "Operator or transaction budget", "Connect wallets and process payments on TON", Product/finance/compliance, "Standardized connection and payment flows"]
      - [TON application builders, Engineering/platform teams, dApp users, Platform or developer budget, Use SDKs and TON APIs, CTO or platform lead, Faster integration and lower blockchain-specific effort]
      - [API-intensive organizations, "Engineering and developer-experience teams", "Internal and external API consumers", API/platform budget, "Document, test, govern, and monetize APIs", CTO or developer-platform lead, "Reusable API products and AI/API adoption"]
    notes: "The map is an evidence-constrained operating hypothesis based on platform documentation and industry surveys; TOP-specific contract values, pricing, and payer identities are not publicly disclosed."
    claimRefs: [CM002, CM003, CM010, CM011, CM012]
