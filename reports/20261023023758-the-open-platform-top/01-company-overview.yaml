company:
  name: The Open Platform (TOP)
chapter:
  number: 1
  title: Company Overview
  summary: TOP is a Telegram-native blockchain infrastructure and application company founded by Andrew Rogozov in Abu Dhabi in 2023. Public evidence supports a $28.5 million Series A at a $1 billion valuation and more than $70 million raised, but legal-entity structure, operating economics, board governance, and current scale remain materially undisclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and distribution
    body: "TOP presents as a Telegram-native blockchain infrastructure and consumer-application platform built on The Open Network (TON). Fortune describes TOP as a key company working on TON apps and identifies Wallet in Telegram as its most prominent wallet product, while the company-oriented coverage describes a wider portfolio including blockchain games, NFT marketplaces, a decentralized exchange, and AI applications. The distribution thesis is unusually concentrated: TOP is designed to place crypto products inside Telegram rather than acquire users through a standalone consumer channel. That creates potential reach and lower onboarding friction, but it also makes the company dependent on Telegram access, TON ecosystem health, and regulatory permissions in each target market. The public record does not establish TOP's revenue mix, product-level monetization, active customers, or whether the cited ecosystem usage belongs to TOP itself rather than TON or Telegram overall."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: funding-and-leadership
    title: Founding, leadership, and financing
    body: Andrew Rogozov is the consistently identified founder and chief executive. Fortune reports that he incorporated TOP in Abu Dhabi in 2023 and that the company raised $28.5 million in a Series A at a $1 billion valuation, with Ribbit Capital leading and Pantera Capital participating; the article says the round represented about 5% of equity and did not include cryptocurrency allocations. The Block separately reports total funding of $70 million and expansion priorities spanning the United States, European Union, go-to-market, licensing, compliance, and infrastructure. Rogozov's prior VK leadership and earlier involvement with TON-related work provide relevant founder-market fit, but the available pool does not document a complete executive roster, board, voting rights, ownership percentages, or succession depth. Those omissions make key-person dependence and entity-level control important diligence items.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-gaps
    title: Milestones, regulatory context, and unresolved gaps
    body: TOP's chronology is inseparable from the regulatory history of Telegram's original blockchain project. The SEC states that Telegram and TON Issuer settled charges in 2020, agreed to return more than $1.2 billion to investors, and pay an $18.5 million civil penalty. That enforcement action concerned Telegram's Gram offering, not a finding against TOP, but it is a material predecessor risk for a company building on the successor TON ecosystem. Public reporting then places Rogozov's TON Foundation role in 2022 and TOP's incorporation in 2023, followed by the 2025 Series A and stated expansion into the US and Europe. The timeline therefore shows resilience and financing momentum alongside regulatory path dependence. Current licensing, legal-entity boundaries, board oversight, headcount, revenue, burn, and runway are not disclosed in the assigned evidence and should remain explicit gaps rather than inferred metrics.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
