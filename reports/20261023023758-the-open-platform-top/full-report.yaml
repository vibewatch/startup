              - CI014
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing provides a concrete capital anchor, but not a runway calculation. The Block says
              the new financing is intended to fund U.S., EU, and other regional expansion, including go-to-market,
              regulatory licensing, compliance, and infrastructure; Coin Edition similarly quotes management that
              Western compliance and operations are expensive. Without cash on hand, monthly burn, debt obligations,
              restricted cash, or a forward budget, the $70 million cumulative funding figure cannot be treated as cash
              available today. The regulatory history of the Telegram ecosystem also matters to cost and timing: the SEC
              described its 2019 emergency action as alleging an unregistered $1.7 billion token offering, and the 2020
              settlement required Telegram to return more than $1.2 billion and pay an $18.5 million penalty. Those
              actions concern Telegram's earlier token offering, not a finding about TOP's current finances, but they
              illustrate why the Western rollout can carry substantial legal and compliance expense. The financial
              verdict is research-more: distribution and financing are credible, while revenue quality, margin path,
              capital adequacy, and financing dependency remain unverified.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is a real financial asset
            body: >-
              Wallet activation and Telegram embedding create a plausible low-friction acquisition channel, but the
              value must be proven through conversion, retention, volume, and net monetization.
            calloutType: strength
            claimRefs:
