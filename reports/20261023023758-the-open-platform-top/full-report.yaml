            title: Require management accounts before underwriting
            body: >-
              Request product-level revenue, take rates, partner settlements, gross margin, cash, burn, runway, and a
              compliance budget before treating the valuation as supported by operating performance.
            calloutType: recommendation
            claimRefs:
