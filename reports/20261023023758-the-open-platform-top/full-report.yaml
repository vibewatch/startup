  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              TOP's public product description is best understood as a set of surfaces around the Telegram-to-TON
              workflow rather than one disclosed monolith. External coverage describes TOP as the main developer of the
              crypto wallet inside Telegram and says its platform supports developers building on TON, while historical
              ecosystem material names Wallet in Telegram, Tonkeeper, TON Connect, and related Telegram integrations. In
              customer terms, a user discovers an app or wallet in Telegram, connects a TON wallet, signs or sends an
              on-chain action, and returns to the messaging environment; a developer needs a wallet-connection protocol
              and UI components rather than a separate consumer app. Adjacent TON infrastructure such as TAC targets EVM
              applications seeking Telegram distribution, but the assigned evidence does not establish that TOP owns
              TAC. This creates distribution leverage while making product boundaries, ownership, and shared-service
              dependencies important diligence questions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE009
      - number: '5.2'
        title: Architecture, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence is strongest at the integration boundary. The TonConnect repository lists SDK,
              protocol, UI, and React UI packages, and describes the SDK as a way for decentralized applications to
              connect users to TON wallets. TAC's public material describes an EVM-compatible bridge into TON and a
              mainnet intended to expose EVM-based DeFi protocols through Telegram, with roadmap phases for core
              infrastructure, mainnet, governance, and optimization. These artifacts show concrete developer-facing
              components and a layered operating model, but they are not a substitute for TOP's private architecture
              diagrams, deployment topology, code-ownership map, or production service metrics. The product therefore
              appears technically extensible at the protocol and adapter layers while remaining difficult to underwrite
              for latency, throughput, change-management, or dependency isolation.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE010
      - number: '5.3'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The defensible feature is the combination of Telegram distribution, TON-native wallet connectivity, and
              developer infrastructure that can lower onboarding friction for blockchain applications. That advantage is
              ecosystem-dependent: Telegram is the access layer, TON is the settlement environment, and external
              wallets, protocols, bridges, and portfolio applications are part of the delivery chain. Public material
              also documents an adverse technical signal in the surrounding ecosystem: TAC lists post-mortem reports for
              a Cosmos EVM exploit and a TAC Bridge incident in 2026. Those reports concern TAC rather than proving a
              TOP-wide compromise, but they increase the importance of isolating entity ownership, bridge controls,
              incident response, audit coverage, and user-loss allocation. No assigned source verifies TOP-wide uptime,
              formal certifications, penetration-test results, privacy controls, or a complete vulnerability-disclosure
              process.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
