  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption surface
        blocks:
          - type: paragraph
            body: >-
              TOP's relevant market is not all of cryptocurrency or all messaging software. The defensible boundary is
              infrastructure and applications that help developers and users transact, build, distribute, and monetize
              inside Telegram's TON-linked ecosystem. Included spend comprises wallet and payment infrastructure,
              developer SDK/API tooling, integration and transaction services, and consumer applications distributed
              through Telegram. Excluded spend includes Telegram's general advertising and messaging revenue, unrelated
              public-chain infrastructure, and speculative token-market capitalization. Telegram describes Mini Apps as
              WebView applications layered on bots, while TON documentation describes TON Connect as a standardized
              wallet connection protocol; together these define an application-enablement layer rather than a generic
              blockchain TAM. The practical substitutes are conventional web applications, centralized wallets, other
              chains' SDKs, and status-quo bot interfaces. Telegram's channel and group scale can lower distribution
              friction, but platform dependence remains a boundary condition rather than proof of paid demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Multiple sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several market lenses, not a single additive TAM. Telegram's reach provides an
              upper-bound distribution lens: SiliconANGLE reported more than 1 billion monthly active users for Telegram
              in March 2025, but that is a messaging audience, not a crypto buyer count. TON Stat reports 61.38 million
              on-chain activated wallets, 3.385 million monthly active wallets, and 4.207 million daily transactions;
              these are network-activity indicators whose definitions and capture methodology require diligence.
              Postman's 2025 survey supplies a developer/API budget lens: 82% of organizations had adopted some
              API-first approach and 65% reported API-program revenue, but the survey is not a TON or TOP market
              estimate. These lenses support an adoption thesis while leaving SAM and SOM unisolated. The $1 billion
              valuation and $28.5 million financing reported for TOP are financing facts, not market size or revenue
              evidence. A valuation-to-market conversion would therefore be false precision.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
