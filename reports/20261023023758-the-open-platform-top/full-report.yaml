              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Financing context and comparability
        blocks:
          - type: paragraph
            body: >-
              The latest public financing evidence is specific about round size and headline valuation but not about the
              full capitalization table or investor protections. The Block reports a $28.5 million extended Series A led
              by Ribbit Capital, with Pantera Capital participating, and total funding of $70 million; Crunchbase
              independently lists TOP as a $1 billion-valued Web3 unicorn in its June 2025 board. These sources
              corroborate the existence of the mark, not its current fair value. QuickNode offers a directional
              infrastructure reference at an $800 million valuation in January 2023, but its disclosed scale, revenue
              growth, customer set, and uptime are not disclosed for TOP on the same basis. Coinbase's public market
              capitalization is a broader crypto-market reference, not a directly comparable operating multiple.
              Comparable evidence therefore informs market context while leaving a valuation multiple, revenue multiple,
              and probability-weighted return calculation unsupported.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios, decision discipline, and diligence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate because the public record supports a
              financing mark but not the operating denominators needed for a conventional venture or software valuation.
              The bull case requires successful regional expansion, licensing and compliance execution, and conversion
              of Telegram distribution into monetized, retained usage. The base case assumes the $1 billion mark remains
              a financing reference while economics remain opaque, which supports tracking or research-more at entry.
              The bear case includes multiple compression, down-round risk, commercialization shortfall, or regulatory
              friction around digital assets and Telegram-linked distribution. A decision should move toward buy only
              after management supplies audited or at least reconciled revenue and margin data, a cap-table and
              preference schedule, product-level cohort metrics, and evidence that the regulatory plan is executable in
              target jurisdictions.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              TOP's reported expansion plan into the United States, European Union, and other regions creates a
              plausible path to a larger financing or strategic outcome, but it also creates execution and compliance
              milestones that should be monitored explicitly. Public evidence does not show a defined exit timetable,
              public-market readiness, audited reporting cadence, or liquidity mechanism for existing holders. A thesis
              break would be a failed licensing or compliance rollout, a financing below the $1 billion reference
              without offsetting operating improvement, material deterioration in TON or Telegram distribution, or
              evidence that usage is not translating into repeatable gross profit. Conversely, independently verified
              recurring revenue, retention, contribution margin, and a clean ownership structure would reduce the
              current information discount and could justify revisiting the stance.
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more: the $1 billion mark is corroborated as a financing valuation, but public evidence does not
              support a price-sensitive buy case without financial, ownership, and regulatory diligence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV011
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a financing below the $1 billion reference, failed regional licensing, or evidence of weak retained
              monetization as a thesis-break signal unless independently verified operating improvement offsets it.
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV013
