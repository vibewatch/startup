              - CR018
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR010
              - CR013
              - CR016
              - CR018
      - number: '7.2'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              The regulatory perimeter is jurisdiction-specific and cannot be inferred from the absence of a public TOP
              enforcement action. MiCA's stated framework covers crypto-asset offers and services through transparency,
              disclosure, authorization, supervision, and consumer-risk information. Dubai VARA states that its
              framework is designed for permissible virtual-asset activities in Dubai and may be modified as the
              industry evolves. ADGM guidance says an authorized person must obtain approval to use virtual assets and
              identifies AML/CFT, sanctions, custody, origin and destination of funds, and systems recovery as risk
              areas. The US Treasury sanctions page lists active programs across terrorism, cyber, Iran, Russia, North
              Korea, and other categories. TOP's US launch therefore creates a compliance-control question, not proof of
              a violation: the public record does not identify each operating entity, license, permitted activity, or
              control owner.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.3'
        title: Dependencies, resilience, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              TOP's product portfolio is concentrated around Telegram-native distribution and TON connectivity. TOP's
              own site says its flagship wallet is built into Telegram, while the US launch calls Wallet in Telegram a
              gateway to the TON ecosystem. The independent account of Telegram's TON Connect policy shows that
              ecosystem rules can change quickly and can disadvantage third-party developers. Telegram's founder also
              remained under a French criminal investigation in the cited 2025 report; that is a risk to the surrounding
              distribution relationship, not evidence that TOP is implicated. Public sources do not establish TOP's
              burn, runway, gross margin, security incidents, outage history, customer concentration, or contingency
              architecture. Monitoring should focus on license status and enforcement, Telegram/TON policy changes,
              wallet migration or suspension notices, sanctions-control exceptions, material outages or losses, and
              financing runway. A thesis break would be a loss of required authorization, a forced platform migration
              that materially reduces active use, a material custody/security loss without remediation, or inability to
              fund compliance and product operations.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR010
