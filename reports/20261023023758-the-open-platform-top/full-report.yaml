  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              TOP's public financial picture is primarily a financing and distribution story rather than a revenue
              disclosure. The Block reports a $28.5 million extended Series A led by Ribbit Capital, with Pantera
              Capital participating, taking total funding to $70 million and the valuation to $1 billion. The financing
              was equity, not a token issuance, and the stated uses included geographic expansion, go-to-market,
              licensing, compliance, and infrastructure. That allocation is consistent with a platform still investing
              ahead of monetization, not evidence of realized revenue or cash generation. CNBC reported that more than
              100 million users globally had activated the wallet in 2024, while the U.S. launch was delayed by
              regulatory uncertainty; activation is a reach metric, not paid conversion, assets under custody,
              transaction revenue, or gross profit. In April 2026, Wallet in Telegram announced perpetual futures for
              50+ assets with up to 50x leverage, but the announcement gives no fee schedule or TOP revenue share. The
              principal diligence question is therefore whether wallet activity, trading, developer infrastructure, and
              portfolio products convert into repeatable net revenue after partner, compliance, and ecosystem costs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
