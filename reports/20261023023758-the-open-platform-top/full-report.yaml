      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >
              The customer thesis depends on distribution through Telegram and on continued activity across the TON
              ecosystem, but the assigned evidence does not disclose cohorts, gross retention, net retention, churn,
              renewal rates, contract length, or product-level monetization. Tribute describes twice-monthly payouts and
              a transparent 10% fee, which demonstrates an operating monetization workflow for creators but does not
              establish creator retention or TOP revenue. The ecosystem is also exposed to infrastructure and partner
              interruptions: the TAC post-mortem reports a May 2026 bridge exploit, a temporary pause of the TON/TAC
              cross-chain framework, and disruption to wallet, staking-related, and Telegram Mini App integrations
              across the TAC ecosystem. TAC is not a TOP operating disclosure, so this is ecosystem context rather than
              proof of a TOP incident; it nevertheless illustrates why partner, bridge, and platform dependencies matter
              to customer durability. TOP's public valuation announcement says capital will support expansion across the
              US, EU, and other regions, but gives no customer-level expansion targets. Key diligence remains
              product-level active users, retention, revenue concentration, cohort behavior, and dependency exposure.
              Separately, the SEC's 2020 settlement with Telegram concerned the Gram token offering, not TOP, but it
              demonstrates historical regulatory constraints around blockchain distribution through Telegram.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
