        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the moat; observability is the gap
            body: >-
              TOP's public differentiation is a Telegram-native route from discovery to wallet action, but the assigned
              evidence does not disclose the operating metrics or controls needed to prove that this route is reliable
              and safe at scale.
            calloutType: insight
            claimRefs:
              - CE003
              - CE005
