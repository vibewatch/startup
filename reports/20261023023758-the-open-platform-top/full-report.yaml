              - CR015
              - CR016
              - CR018
              - CR019
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary risk
            body: >-
              The combination of regulated crypto activity and Telegram/TON dependence can create correlated compliance,
              distribution, and liquidity shocks; the public evidence does not yet demonstrate that TOP has
              jurisdiction-by-jurisdiction controls or a credible fallback channel.
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR013
              - CR018
          - type: callout
            title: Evidence limitation
            body: >-
              No cited source documents a TOP-specific breach, outage, enforcement action, or financial distress event;
              that absence is an evidence gap rather than evidence that those events did not occur.
            calloutType: assumption
            claimRefs:
              - CR016
              - CR017
              - CR019
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              TOP's strongest investment case is distribution leverage: the company describes its strategy as building
              and investing in blockchain infrastructure for Telegram's billion-user economy, while independent coverage
              reports that the business combines developer infrastructure with consumer applications on TON. The
              financing syndicate and the reported $70 million cumulative funding provide external validation that
              sophisticated investors funded the platform at scale. The anti-thesis is that the observable price is a
              unicorn mark without public operating metrics. The evidence does not establish revenue, recurring revenue,
              gross margin, net retention, cash balance, dilution, liquidation preferences, or product-level
              monetization. The result is a potentially valuable distribution-and-infrastructure option whose
              underwriting is constrained by disclosure, regulatory exposure inherited from the Telegram ecosystem, and
              uncertain conversion of reach into durable cash flows.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
