  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and distribution
        blocks:
          - type: paragraph
            body: >-
              TOP operates across several layers rather than a single product category: consumer wallet access inside
              Telegram, TON developer infrastructure, and ecosystem applications. Independent coverage describes TOP as
              providing support for developers on TON and combining infrastructure with consumer-facing apps, while the
              company's AppKit announcement shows an effort to package recurring wallet, transaction, DeFi, and
              gas-management work for application builders. This creates direct competition with TON-focused development
              firms and protocol-native applications, but also with general-purpose multichain wallets and decentralized
              exchanges. Telegram distribution is a meaningful advantage in the evidence reviewed, yet it is not
              exclusive to TOP: users can reach independent wallets and DeFi products through Telegram or other
              interfaces. The landscape therefore includes direct platform peers, specialist builders, protocol
              applications, and status-quo internal engineering.
