      - number: '1.3'
        title: Milestones, regulatory context, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              TOP's chronology is inseparable from the regulatory history of Telegram's original blockchain project. The
              SEC states that Telegram and TON Issuer settled charges in 2020, agreed to return more than $1.2 billion
              to investors, and pay an $18.5 million civil penalty. That enforcement action concerned Telegram's Gram
              offering, not a finding against TOP, but it is a material predecessor risk for a company building on the
              successor TON ecosystem. Public reporting then places Rogozov's TON Foundation role in 2022 and TOP's
              incorporation in 2023, followed by the 2025 Series A and stated expansion into the US and Europe. The
              timeline therefore shows resilience and financing momentum alongside regulatory path dependence. Current
              licensing, legal-entity boundaries, board oversight, headcount, revenue, burn, and runway are not
              disclosed in the assigned evidence and should remain explicit gaps rather than inferred metrics.
