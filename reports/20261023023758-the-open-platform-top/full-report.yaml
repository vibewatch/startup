  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              TOP's customer architecture spans at least three distinct populations. Consumers use Wallet in Telegram,
              Tonkeeper, Notcoin and other applications for asset management, payments, games, and digital-asset
              activity. Creators and community operators use Tribute to monetize subscriptions, donations, and physical
              or digital goods inside Telegram. Developers and ecosystem projects use TON-oriented infrastructure and
              marketplaces, while liquidity providers and traders interact with STON.fi, Getgems, and related products.
              TOP's own 2025 description names Wallet in Telegram, Tonkeeper, STON.fi, Getgems, Tribute, and Notcoin as
              portfolio products, and says the portfolio is intended to leverage Telegram as a distribution channel. The
              segment map is therefore credible as a product-and-use-case taxonomy, but it is not a disclosed
              customer-count or revenue segmentation. The available materials do not identify payer mix, average revenue
              per user, contract terms, geographic revenue, or the share attributable to each product.
            claimRefs:
              - CU001
              - CU002
              - CU003
