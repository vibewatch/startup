        title: Founding, leadership, and financing
        blocks:
          - type: paragraph
            body: >-
              Andrew Rogozov is the consistently identified founder and chief executive. Fortune reports that he
              incorporated TOP in Abu Dhabi in 2023 and that the company raised $28.5 million in a Series A at a $1
              billion valuation, with Ribbit Capital leading and Pantera Capital participating; the article says the
              round represented about 5% of equity and did not include cryptocurrency allocations. The Block separately
              reports total funding of $70 million and expansion priorities spanning the United States, European Union,
              go-to-market, licensing, compliance, and infrastructure. Rogozov's prior VK leadership and earlier
              involvement with TON-related work provide relevant founder-market fit, but the available pool does not
              document a complete executive roster, board, voting rights, ownership percentages, or succession depth.
              Those omissions make key-person dependence and entity-level control important diligence items.
