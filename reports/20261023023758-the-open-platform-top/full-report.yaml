              - CI006
              - CI008
              - CI009
      - number: '4.2'
        title: Pricing, cost drivers, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public sources do not establish a list-price or realized-price model for TOP's core products. The product
              surface spans a self-custodial wallet, TON developer infrastructure, and ecosystem incubation, so a single
              SaaS ARPU or gross-margin assumption would be misleading. CNBC says the wallet supports stablecoin
              transfers, token swaps, and zero-fee crypto purchases via MoonPay, and that TOP partners with licensed
              providers for on- and off-ramps. Zero-fee purchase language describes the user-facing offer; it does not
              show who pays processing costs or whether TOP earns a referral, spread, or other fee. The Lighter launch
              likewise describes advanced trading access and a 150M+ registered-user platform, but supplies neither
              execution fees nor the commercial split. Compliance, licensing, support, security, liquidity, and partner
              economics are therefore material cost drivers. A defensible underwriting model should keep price, take
              rate, transaction volume, contribution margin, and customer acquisition cost as separate fields until
              contracts or management accounts reconcile them.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
