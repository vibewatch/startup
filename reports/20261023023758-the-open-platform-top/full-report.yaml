      - number: '6.2'
        title: Adoption evidence and named product proof
        blocks:
          - type: paragraph
            body: >-
              Evidence of real customer-facing operation is strongest where a product exposes a live workflow, a named
              license, or a public marketplace. Wallet in Telegram's regulatory update identifies a custodial wallet
              embedded in Telegram and names the Uzbek operating entity TGHAMYON, with an official launch date of 9
              December 2025. Tribute's live service page states that more than 70,000 authors use the platform and
              describes subscriptions, donations, digital goods, physical goods, Telegram-native operation, and a 10%
              fee; those figures remain company-controlled and are not independently corroborated in this pool. Getgems
              exposes live offers, auctions, fixed-price sales, bundles, and Telegram Stars purchasing, while CoinGecko
              lists TON ecosystem assets and DEX activity, including STON.fi and DeDust. These are useful proof points
              for product availability and transaction surfaces, not proof of TOP-level active customers, retention, or
              revenue.     TOP's portfolio announcement names Notcoin but supplies no adoption metric for it.
            claimRefs:
              - CU002
              - CU005
              - CU006
