      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              TOP's apparent moat is a combination of Telegram reach, TON-specific know-how, and a portfolio of reusable
              infrastructure components rather than a disclosed proprietary price advantage. The Block reports that TOP
              intends to use financing for geographic expansion, go-to-market, licensing, compliance, and launch
              infrastructure, indicating that execution and regulatory readiness are part of the competitive contest.
              AppKit is explicitly in alpha and its feature timelines may change, so the developer-platform proposition
              is not yet a mature proof of lock-in. Meanwhile, Keeper spans multiple chains and DeDust markets native
              TON protocol capability, showing that specialist and multichain alternatives can occupy adjacent layers.
              The principal displacement risks are platform dependence on Telegram and TON, rapid commoditization of
              wallet and integration components, and better-capitalized competitors using broader chain coverage or
              stronger distribution. No source in this pool discloses TOP's customer concentration, churn, switching
              cost, or competitor win/loss data.
