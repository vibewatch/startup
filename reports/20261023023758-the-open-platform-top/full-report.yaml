      - number: '3.2'
        title: Buyer criteria, capability, and packaging
        blocks:
          - type: paragraph
            body: >-
              Buyers choosing a TON infrastructure partner appear to trade off speed, ecosystem specialization, custody
              model, breadth, and evidence of delivery. EvaCodes' comparison frames providers around use case, industry,
              public review counts, and starting prices, but it is vendor-authored and should not be treated as an
              independent benchmark. AppKit's alpha feature set addresses common implementation components, which can
              reduce duplicated engineering for teams that want a Telegram-native launch, while self-custody wallets
              such as Keeper differentiate on keys remaining on the device and no account or KYC requirement. Walt
              presents the opposite tradeoff: a custodial Telegram-native service with a broader trading and
              tokenized-asset surface, but with service fees for some external transactions. These are materially
              different products, so a single feature score would obscure custody, regulatory, and workflow choices.
              Public sources do not establish realized discounts, enterprise contract terms, retention, or switching
              costs.
