chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and distribution
        blocks:
          - type: paragraph
            body: >-
              TOP presents as a Telegram-native blockchain infrastructure and consumer-application platform built on The
              Open Network (TON). Fortune describes TOP as a key company working on TON apps and identifies Wallet in
              Telegram as its most prominent wallet product, while the company-oriented coverage describes a wider
              portfolio including blockchain games, NFT marketplaces, a decentralized exchange, and AI applications. The
              distribution thesis is unusually concentrated: TOP is designed to place crypto products inside Telegram
              rather than acquire users through a standalone consumer channel. That creates potential reach and lower
              onboarding friction, but it also makes the company dependent on Telegram access, TON ecosystem health, and
              regulatory permissions in each target market. The public record does not establish TOP's revenue mix,
              product-level monetization, active customers, or whether the cited ecosystem usage belongs to TOP itself
              rather than TON or Telegram overall.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
