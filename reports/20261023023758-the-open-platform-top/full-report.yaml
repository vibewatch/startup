      - number: '2.3'
        title: Buyers, users, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map separates the people who use a product from the parties who control budget. Wallet and
              consumer applications target Telegram users and merchants, with TOP or an application operator bearing
              product and compliance costs; developer infrastructure targets teams building Mini Apps, wallets, and TON
              services, with engineering or product leaders controlling budget. TON documentation identifies SDKs,
              payment processing, and standardized wallet connections as distinct integration jobs, while Postman
              reports that API work is substantial and that security and collaboration remain material concerns. Stack
              Overflow's 2025 developer survey ranks security or privacy, prohibitive pricing, and better alternatives
              as the top reasons developers reject technology. Those constraints imply a staged adoption path: prototype
              through Telegram/TON tooling, validate user activity and reliability, then expand paid infrastructure or
              transaction services. Regulation, wallet trust, platform policy, liquidity, and switching costs can delay
              conversion even when distribution is strong. TOP's public materials do not disclose product-level pricing,
              take rates, customer counts, or retention, so budget ownership and commercial conversion remain open
              diligence items.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
