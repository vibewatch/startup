  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence exposure is regulatory and platform concentration rather than a documented
              TOP-specific incident. TOP describes Wallet in Telegram as self-custodial and integrated into Telegram,
              while its US launch describes access to trading, staking, yield protocols, and withdrawals. That product
              surface can trigger different licensing, consumer-protection, AML, sanctions, custody, and disclosure
              obligations by jurisdiction. ESMA describes MiCA as imposing transparency, disclosure, authorization, and
              supervision requirements, and ADGM guidance treats custody, wallet controls, financial crime, client-asset
              protection, and systems recovery as material risk areas. This is a material diligence issue even without
              evidence of enforcement against TOP itself. Telegram and TON create a second high-impact dependency: an
              independent report says Telegram required third-party wallets to use TON Connect and that wallets failing
              to migrate would not be supported. A policy or technical change could therefore reduce distribution, force
              migrations, or narrow multichain utility.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR010
