            body: >-
              Obtain monthly active and paying users, cohorts, retention, gross payment volume, revenue, and
              concentration by Wallet, Tonkeeper, STON.fi, Getgems, Tribute, Notcoin, and infrastructure products before
              underwriting the unicorn valuation.
