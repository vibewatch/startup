evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current shareholder list and investor ownership percentages.
    whyItMatters: Ownership concentration and investor alignment affect governance and exit options.
    diligencePath: Request the latest cap table, shareholder register, and board rights summary.
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited consolidated financial statements and segment disclosures.
    whyItMatters: Public profiles are directional but insufficient for full underwriting.
    diligencePath: Obtain audited statements or lender-grade management accounts for the last three years.
  - type: missing-source
    severity: minor
    topic: Leadership and founder table
    missingEvidence: Additional evidence to complete leadership and founder table.
    whyItMatters: Enumeration tables are intentionally partial when public coverage is incomplete.
    diligencePath: Request fuller management or third-party source coverage to complete the table.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: Stakeholder or investor map
    missingEvidence: Additional evidence to complete stakeholder or investor map.
    whyItMatters: Enumeration tables are intentionally partial when public coverage is incomplete.
    diligencePath: Request fuller management or third-party source coverage to complete the table.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: Milestone table
    missingEvidence: Additional evidence to complete milestone table.
    whyItMatters: Enumeration tables are intentionally partial when public coverage is incomplete.
    diligencePath: Request fuller management or third-party source coverage to complete the table.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: sam-som
    missingEvidence: Region-by-region pipeline and revenue exposure by product line and buyer class.
    whyItMatters: A large global TAM does not answer Envision’s realistic accessible market under geopolitical constraints.
    diligencePath: Request backlog, tender pipeline, and booked revenue split by region and product line.
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public like-for-like price, warranty, and service terms across top wind OEMs.
    whyItMatters: Without price and contract structure, moat discussion remains more qualitative than quantitative.
    diligencePath: Request anonymized bid comparisons, turbine ASP ranges, and LTSA terms across recent tenders.
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited consolidated financial statements with segment notes and cash-flow statements.
    whyItMatters: Without audited financials, public revenue proxies cannot carry full underwriting weight.
    diligencePath: >-
      Request audited group statements, management forecast, and segment mix by turbines, service, software, storage,
      and industrial systems.
  - type: private-evidence-only
    severity: material
    topic: independent-reliability
    missingEvidence: Third-party reliability data, failure rates, and comparative performance metrics.
    whyItMatters: >-
      Vendor-authored product material is persuasive on architecture but not enough to prove lifetime quality relative
      to peers.
    diligencePath: Request fleet-level availability, failure-rate, and warranty-claim data by platform and geography.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer-count, renewal, churn, NRR, and top-customer concentration data.
    whyItMatters: Named projects prove traction but do not prove durability or diversification.
    diligencePath: Request customer cohort, contract-renewal, and top-10 customer concentration data by business line and geography.
  - type: missing-source
    severity: minor
    topic: Named customer proof table
    missingEvidence: Additional evidence to complete named customer proof table.
    whyItMatters: Enumeration tables are intentionally partial when public coverage is incomplete.
    diligencePath: Request fuller management or third-party source coverage to complete the table.
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: balance-sheet-risk
    missingEvidence: Current debt, liquidity, covenant, and stress-test data.
    whyItMatters: Many identified risks would hurt more if the company is thinly capitalized or heavily levered.
    diligencePath: Request latest debt schedule, covenant package, liquidity headroom, and downside cash-flow scenarios.
  - type: missing-source
    severity: minor
    topic: Regulatory / legal risk register
    missingEvidence: Additional evidence to complete regulatory / legal risk register.
    whyItMatters: Enumeration tables are intentionally partial when public coverage is incomplete.
    diligencePath: Request fuller management or third-party source coverage to complete the table.
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: entry-discipline
    missingEvidence: Cap-table terms, liquidation preferences, audited margin structure, and backlog conversion assumptions.
    whyItMatters: >-
      These inputs would materially tighten the bull/base/bear range and determine whether a US$15B mark is fair or too
      rich.
    diligencePath: Request financing documents, audited statements, and management’s bridge from orders to revenue and cash flow.
  - type: missing-source
    severity: minor
    topic: Comparable valuation table
    missingEvidence: Additional evidence to complete comparable valuation table.
    whyItMatters: Enumeration tables are intentionally partial when public coverage is incomplete.
    diligencePath: Request fuller management or third-party source coverage to complete the table.
    relatedTableRefs:
      - TV002
