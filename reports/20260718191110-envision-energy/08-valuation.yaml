    "title": "Valuation",
    "summary": "The retained public evidence supports a serious industrial company with meaningful optionality, but not a clean premium-growth underwriting case at any price. Hurun’s US$15 billion valuation anchor, Craft’s FY2023 revenue proxy, and Envision’s order scale all suggest a company large enough for public-comp framing."
  },
  "sections": [
    {
      "id": "s1",
      "title": "Thesis versus anti-thesis",
      "body": "The retained public evidence supports a serious industrial company with meaningful optionality, but not a clean premium-growth underwriting case at any price. Hurun’s US$15 billion valuation anchor, Craft’s FY2023 revenue proxy, and Envision’s order scale all suggest a company large enough for public-comp framing. This section focuses on thesis versus anti-thesis and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Hurun 2025 values Envision Energy at US$15 billion. Craft’s FY2023 revenue estimate of RMB 80.6 billion implies a low-single-digit revenue multiple against Hurun’s US$15 billion mark. Vestas reported EUR 18.8 billion of 2025 revenue and EUR 71.9 billion of combined order backlog. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
