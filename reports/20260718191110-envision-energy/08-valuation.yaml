    {
      "id": "s3",
      "title": "Scenario cases",
      "body": "The retained public evidence supports a serious industrial company with meaningful optionality, but not a clean premium-growth underwriting case at any price. Hurun’s US$15 billion valuation anchor, Craft’s FY2023 revenue proxy, and Envision’s order scale all suggest a company large enough for public-comp framing. This section focuses on scenario cases and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Envision order and installation scale suggest it belongs in a public-comp discussion rather than being valued like a pre-scale climate startup. At the same time, Envision disclosure quality is materially weaker than that of listed comparators. Strategic upside exists because Envision is trying to add software, storage, green fuels, and industrial-park economics to a large wind base. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
