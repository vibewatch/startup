      "title": "Public comp frame",
      "body": "The retained public evidence supports a serious industrial company with meaningful optionality, but not a clean premium-growth underwriting case at any price. Hurun’s US$15 billion valuation anchor, Craft’s FY2023 revenue proxy, and Envision’s order scale all suggest a company large enough for public-comp framing. This section focuses on public comp frame and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include GE Vernova reported US$9.11 billion of 2025 Wind segment revenue. Goldwind 2025 annual results reported RMB 72.78 billion of operating revenue. Siemens Energy reported about EUR 39.1 billion of 2025 revenue, but it is a broader group rather than a pure wind comparator. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
