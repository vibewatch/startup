  topStrengths:
    - >-
      Public evidence supports real industrial scale, including a reported 30.6 GW of 2024 turbine orders and 14.5 GW of
      new installations.
    - >-
      The product stack is broader than hardware alone, spanning wind, storage, EnOS software, green hydrogen, and
      industrial decarbonization systems.
    - >-
      Installed-base signals such as 90.3 GW for Galileo and 100+ GW cumulative company wind installations support
      meaningful fleet relevance.
    - >-
      Named customer and project proof across India, Brazil, the Philippines, and MENA suggest credible export-market
      traction.
    - >-
      The US$15B Hurun anchor is not obviously absurd relative to private-company scale, public comps, and strategic
      optionality.
  topRisks:
    - >-
      Europe and other markets are increasingly scrutinizing Chinese wind suppliers through subsidy, security, and
      industrial-policy lenses.
    - Rare-earth and broader materials concentration can disrupt cost, delivery timing, and competitiveness.
    - Public disclosure remains thin on audited financials, debt, liquidity, backlog conversion, and segment margins.
    - >-
      The strategic move into parks, fuels, storage, and digital orchestration raises execution complexity beyond a pure
      wind-OEM model.
    - >-
      Customer evidence is strongest on milestones and named projects, not on retention, cohort quality, or
      concentration disclosure.
  unresolvedGaps:
    - Audited consolidated financial statements with segment, margin, and cash-flow detail.
    - Current cap-table terms, investor rights, and any preference-stack economics behind the private valuation anchor.
    - Backlog conversion, domestic versus export revenue split, and working-capital or debt maturity profile.
    - Fleet-level reliability and warranty-performance data by current turbine and storage platform.
    - Customer concentration, renewal, and service-attachment metrics across the major business lines.
