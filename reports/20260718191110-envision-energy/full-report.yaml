              management marketing at face value. Key signals include GE Vernova materials explicitly place Envision,
              Vestas, Siemens-Gamesa, Nordex, and Goldwind in the same wind competitive set. Vestas remains the clearest
              listed global service-and-backlog incumbent in wind. Goldwind is the strongest directly comparable listed
              Chinese wind OEM because it discloses detailed financials and order commentary. The evidence is useful
              because it triangulates official materials with third-party market, media, regulatory, or filing sources
              where available. That still leaves unresolved diligence questions on pricing, margin quality, contract
