companyProfile:
  summary: >-
    Envision Energy is a private Chinese climate-industrial platform founded in 2007 and led by founder Lei Zhang.
    Public sources support meaningful global relevance in wind-turbine manufacturing, storage systems, industrial
    decarbonization, and EnOS software, with credible evidence of large-scale orders and a material installed base. The
    company appears far beyond startup scale, but still discloses more like a private industrial group than a public
    comp.
  foundedDate: '2007-01-01'
  founders:
    - name: Lei Zhang
      role: Founder and CEO
      background: >-
        World Economic Forum and TED materials identify Lei Zhang as the founder and chief executive behind Envision's
        wind, software, and net-zero industrial-park strategy.
      claimRefs:
        - CO003
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    Smart wind turbines, wind-farm software, utility-scale storage systems, EnOS digital controls, green hydrogen
    systems, and net-zero industrial-park infrastructure.
  customerFocus: >-
    Utilities, renewable developers, industrial parks, governments, and large project counterparties in China and export
    markets such as India, Southeast Asia, Brazil, and MENA.
  businessModel: >-
    Industrial equipment, systems integration, software-enabled asset optimization, storage, and long-dated project or
    service relationships rather than a single-product pure-play model.
  stage: Late-stage private / industrial unicorn
  fundingStatus: >-
