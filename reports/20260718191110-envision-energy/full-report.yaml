      - number: '7.4'
        title: Financial thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The strongest public risk signals around Envision relate to geopolitical market access, concentrated
              supply chains, capital intensity, export controls on rare-earth inputs, and the complexity of scaling from
              turbine supply into industrial parks and green-fuel systems. This section focuses on financial
              thesis-breakers and synthesizes the retained public evidence rather than repeating management marketing at
              face value. Key signals include The public file does not provide a comprehensive external cyber-assurance
              or product-liability dataset. Capital intensity remains a structural risk because equipment, service,
              storage, and industrial systems all require execution capital and working capital. The public record is
              too thin on debt and liquidity to rule out financing stress during weaker order cycles. The evidence is
              useful because it triangulates official materials with third-party market, media, regulatory, or filing
              sources where available. That still leaves unresolved diligence questions on pricing, margin quality,
              contract terms, capital intensity, or geography-specific execution, so the section should be read as a
              directional synthesis rather than a complete underwriting file. In practice, the chapter points to both
              industrial scale and material uncertainty, which is why later diligence should test management claims,
              compare peers, and request private operating data before a stronger investment call is made.
            claimRefs:
