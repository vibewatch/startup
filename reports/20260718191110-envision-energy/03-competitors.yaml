  "sections": [
    {
      "id": "s1",
      "title": "Competitive field",
      "body": "Envision competes in a crowded wind landscape where listed incumbents disclose more backlog and segment detail than Envision does, while Chinese peers pressure pricing in the domestic market. The strongest comparators are Vestas, GE Vernova, Siemens Gamesa, Goldwind, SANY Renewable, and CSSC Haizhuang. This section focuses on competitive field and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include GE Vernova materials explicitly place Envision, Vestas, Siemens-Gamesa, Nordex, and Goldwind in the same wind competitive set. Vestas remains the clearest listed global service-and-backlog incumbent in wind. Goldwind is the strongest directly comparable listed Chinese wind OEM because it discloses detailed financials and order commentary. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
