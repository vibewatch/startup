      "title": "Switching and substitutes",
      "body": "Envision competes in a crowded wind landscape where listed incumbents disclose more backlog and segment detail than Envision does, while Chinese peers pressure pricing in the domestic market. The strongest comparators are Vestas, GE Vernova, Siemens Gamesa, Goldwind, SANY Renewable, and CSSC Haizhuang. This section focuses on switching and substitutes and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Envision’s 30.6 GW order claim indicates it is big enough to matter against top-tier incumbents, not just smaller domestic peers. Chinese domestic competition likely compresses pricing even for scaled players because multiple large OEMs coexist in the same home market. Western regulated markets are easier for Vestas, GE Vernova, and Siemens Gamesa to defend than for Chinese OEMs. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
