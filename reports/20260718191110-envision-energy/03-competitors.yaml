    "summary": "Envision competes in a crowded wind landscape where listed incumbents disclose more backlog and segment detail than Envision does, while Chinese peers pressure pricing in the domestic market. The strongest comparators are Vestas, GE Vernova, Siemens Gamesa, Goldwind, SANY Renewable, and CSSC Haizhuang."
