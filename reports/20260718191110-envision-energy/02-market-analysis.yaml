      "title": "Geographic access",
      "body": "Envision addresses a very large wind market, but its practical opportunity is narrower than a top-down global TAM because auctions, permitting, local content, and market-access politics matter. Public evidence is strongest on record global wind installations, China’s manufacturing scale, and the importance of offshore, storage, hydrogen, and industrial-park adjacencies. This section focuses on geographic access and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include GWEC treats floating offshore wind as increasingly important rather than niche. Envision’s opportunity extends beyond turbines into storage, hydrogen, and industrial-park systems. The likely buyer set includes utilities, IPPs, renewable developers, industrial groups, and governments. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
