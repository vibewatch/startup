    "title": "Market Analysis",
    "summary": "Envision addresses a very large wind market, but its practical opportunity is narrower than a top-down global TAM because auctions, permitting, local content, and market-access politics matter. Public evidence is strongest on record global wind installations, China’s manufacturing scale, and the importance of offshore, storage, hydrogen, and industrial-park adjacencies."
