      "id": "s4",
      "title": "Constraints and sizing gaps",
      "body": "Envision addresses a very large wind market, but its practical opportunity is narrower than a top-down global TAM because auctions, permitting, local content, and market-access politics matter. Public evidence is strongest on record global wind installations, China’s manufacturing scale, and the importance of offshore, storage, hydrogen, and industrial-park adjacencies. This section focuses on constraints and sizing gaps and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Orders materials say Envision exceeded 10 GW of international orders among Chinese OEMs in 2024. The Chifeng materials show Envision trying to commercialize industrial decarbonization rather than generation equipment alone. The global wind market remains policy-heavy because auctions, permitting, grid build-out, and local-content rules shape demand timing. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
