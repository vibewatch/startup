      "title": "Demand drivers",
      "body": "Envision addresses a very large wind market, but its practical opportunity is narrower than a top-down global TAM because auctions, permitting, local content, and market-access politics matter. Public evidence is strongest on record global wind installations, China’s manufacturing scale, and the importance of offshore, storage, hydrogen, and industrial-park adjacencies. This section focuses on demand drivers and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Wind remained China’s third-largest generation source in 2024 according to CWEA. GWEC frames wind installations as needing to double by 2030 to stay on a 1.5°C pathway. WindEurope says the EU wants to increase wind capacity from 220 GW to 425 GW by 2030 and 1,300 GW by 2050. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
