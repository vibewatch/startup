      "title": "Durability and concentration",
      "body": "Public customer proof for Envision is strongest on named project developers and deployment milestones rather than on retention or software-usage disclosure. The best evidence points to Juniper Green Energy in India, Alternergy in the Philippines, Casa dos Ventos in Brazil, and ACWA-linked Egypt references. This section focuses on durability and concentration and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Net-zero industrial-park materials imply Envision’s customer set also includes industrial parks, data-center ecosystems, and clean-fuel projects. Public proof is materially stronger on named project wins than on recurring software or lifecycle customer economics. The public file does not disclose total customer count, retention, NRR, or churn for any major business line. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
