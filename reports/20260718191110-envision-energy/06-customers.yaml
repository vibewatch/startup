      "id": "s2",
      "title": "Named customer proof",
      "body": "Public customer proof for Envision is strongest on named project developers and deployment milestones rather than on retention or software-usage disclosure. The best evidence points to Juniper Green Energy in India, Alternergy in the Philippines, Casa dos Ventos in Brazil, and ACWA-linked Egypt references. This section focuses on named customer proof and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include The Brazil Casa dos Ventos deal shows Envision can win named developer business with both turbine supply and long-term service. The 2024 order announcement cites projects across India, Egypt, Saudi Arabia, and the Philippines. The order materials identify a 1.1 GW ACWA-related wind-farm order in Egypt featuring Envision 8 MW turbines. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
