    "title": "Customers",
    "summary": "Public customer proof for Envision is strongest on named project developers and deployment milestones rather than on retention or software-usage disclosure. The best evidence points to Juniper Green Energy in India, Alternergy in the Philippines, Casa dos Ventos in Brazil, and ACWA-linked Egypt references."
  },
  "sections": [
    {
      "id": "s1",
      "title": "Buyer map",
      "body": "Public customer proof for Envision is strongest on named project developers and deployment milestones rather than on retention or software-usage disclosure. The best evidence points to Juniper Green Energy in India, Alternergy in the Philippines, Casa dos Ventos in Brazil, and ACWA-linked Egypt references. This section focuses on buyer map and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Juniper Green Energy ordered 1 GW of wind turbines and 320 MWh of battery storage from Envision in India. The Philippines Alabat project is a 64 MW wind project developed by Alternergy using Envision’s 8 MW turbines. The Philippines installation is framed as Envision’s first wind project in the country and its largest international turbine delivery to date. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
