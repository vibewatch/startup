    "number": 4,
    "title": "Financials",
    "summary": "The retained public evidence supports a company with real industrial revenue scale and large recent order flow, but not a company whose margin quality or capital structure can be cleanly underwritten from public sources alone. Craft’s FY2023 revenue estimate and Envision’s 30.6 GW 2024 order claim are the strongest financial anchors."
  },
  "sections": [
    {
      "id": "s1",
      "title": "Revenue engine",
      "body": "The retained public evidence supports a company with real industrial revenue scale and large recent order flow, but not a company whose margin quality or capital structure can be cleanly underwritten from public sources alone. Craft’s FY2023 revenue estimate and Envision’s 30.6 GW 2024 order claim are the strongest financial anchors. This section focuses on revenue engine and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Craft lists Envision Energy FY2023 revenue at RMB 80.6 billion. Envision’s 30.6 GW 2024 order claim indicates significant booked commercial momentum even without audited backlog disclosure. The Juniper package includes 1 GW of wind turbines and 320 MWh of battery storage. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
