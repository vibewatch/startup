    {
      "id": "s2",
      "title": "Regulatory and geopolitical",
      "body": "The strongest public risk signals around Envision relate to geopolitical market access, concentrated supply chains, capital intensity, export controls on rare-earth inputs, and the complexity of scaling from turbine supply into industrial parks and green-fuel systems. This section focuses on regulatory and geopolitical and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include The Parliament note says export restrictions can create higher prices, shortages, and delays for downstream industries. Envision’s slavery statement says the company performs sanction screening and supply-chain compliance monitoring. The 2023 and 2024 slavery statements both emphasize supply-chain risk identification, auditing, and monitoring. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
