  "sections": [
    {
      "id": "s1",
      "title": "Top risks",
      "body": "The strongest public risk signals around Envision relate to geopolitical market access, concentrated supply chains, capital intensity, export controls on rare-earth inputs, and the complexity of scaling from turbine supply into industrial parks and green-fuel systems. This section focuses on top risks and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include WindEurope says the EU launched a foreign-subsidies investigation into Chinese wind-turbine suppliers because of competitiveness and economic-security concerns. CNN reports the EU probe is part of a broader effort to prevent Chinese excess-capacity competition in strategic clean-tech sectors. The European Parliament note says China’s 2025 rare-earth export restrictions exposed major supply-chain vulnerabilities. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
