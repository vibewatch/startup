companyProfile:
  summary: >-
    Envision Energy 是 2007 年创立的中国私营气候工业平台，由创始人 Lei Zhang 领导。公开来源支持其在风机制造、储能系统、工业脱碳和 EnOS
    软件上具备明显全球存在感，并有大规模订单和实质装机基础的可信证据。公司看起来早已越过初创规模，但披露方式仍更像私营工业集团，而非上市可比公司。
  foundedDate: '2007-01-01'
  founders:
    - name: Lei Zhang
      role: 创始人兼 CEO
