        title: 主要风险
        blocks:
          - type: paragraph
            body: >-
              围绕
              Envision，公开材料里最强的风险信号集中在几件事：地缘政治下的市场准入、供应链集中、资本强度、稀土投入品出口管制，以及从风机供应扩到产业园和绿色燃料系统时的复杂度。本节聚焦主要风险，整合已保留公开证据，不按管理层营销说法照单全收。关键信号包括：WindEurope
              称，欧盟出于竞争力和经济安全担忧，已对中国风机供应商启动外国补贴调查；CNN 报道，欧盟调查属于更大范围行动的一部分，目标是在战略清洁技术领域防止中国过剩产能竞争；European Parliament
              说明称，中国 2025
              年稀土出口限制暴露出重大供应链脆弱性。这些证据有用，是因为在可能的地方把官方材料与第三方市场、媒体、监管或文件来源交叉验证。但定价、利润率质量、合同条款、资本强度和特定地区执行仍有待尽调，因此本节应视为方向性综合，而不是完整承销材料。实际看，本章同时指向工业规模和重大不确定性；后续尽调需要检验管理层说法、对比同业，并索取非公开经营数据，之后才适合给出更强投资判断。
