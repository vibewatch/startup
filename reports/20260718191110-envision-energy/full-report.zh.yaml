    sections:
      - number: '1.1'
        title: 身份与范围
        blocks:
          - type: paragraph
            body: >-
              Envision Energy 是 2007 年创立的私营气候工业平台，由 Lei Zhang 领导，总部位于上海。公开证据最能支撑风电规模、平台宽度，以及公司向储能、氢能、EnOS
              软件和零碳产业园扩展；所有权和审计财务披露则较弱。本节聚焦身份与范围，综合留存的公开证据，而不是照单全收管理层营销。关键信号包括：公开档案来源将 Envision Energy 的创立时间定在
              2007；公开档案来源显示 Envision Energy 总部在中国上海；World Economic Forum 认定 Lei Zhang 是 Envision 的创始人兼
              CEO。这些证据有价值，因为在可用处把官方材料与第三方市场、媒体、监管或备案来源交叉验证。但定价、利润率质量、合同条款、资本强度、具体地区执行仍有未解尽调问题，因此本节应被视为方向性综合，而不是完整承销文件。实际判断上，本章同时指向工业规模和重大不确定性；因此后续尽调需要检验管理层说法、对比同业，并索取私有经营数据，之后才能给出更强投资判断。
