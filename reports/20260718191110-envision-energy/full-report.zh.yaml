        title: 市场边界
        blocks:
          - type: paragraph
            body: >-
              Envision
              面向的风电市场很大，但实际机会比自上而下的全球总可用市场（TAM）更窄，因为招标、许可、本地化内容和市场准入政治都会左右需求。公开证据最能支撑全球风电装机创纪录、中国制造规模，以及海上风电、储能、氢能和产业园邻近业务的重要性。本节聚焦市场边界，综合留存的公开证据，而不是照单全收管理层营销。关键信号包括：GWEC
              Global Wind Report 2026 称 2025 是全球风电新增装机创纪录的一年，新增 165 GW；GWEC 称中国在 2025 新增近 120 GW 风电；CWEA 年报称中国 2024 新增
              80 GW 风电，累计装机达到 520
              GW。这些证据有价值，因为在可用处把官方材料与第三方市场、媒体、监管或备案来源交叉验证。但定价、利润率质量、合同条款、资本强度、具体地区执行仍有未解尽调问题，因此本节应被视为方向性综合，而不是完整承销文件。实际判断上，本章同时指向工业规模和重大不确定性；因此后续尽调需要检验管理层说法、对比同业，并索取私有经营数据，之后才能给出更强投资判断。
