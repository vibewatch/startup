  topStrengths:
    - 公开证据支撑真实工业规模：据报道，2024 年风机订单 30.6 GW，新增装机 14.5 GW。
    - 产品栈不只是硬件，还覆盖风电、储能、EnOS 软件、绿氢和工业脱碳系统。
    - Galileo 90.3 GW、公司累计风电装机 100+ GW 等存量信号，说明机队相关性已经可观。
    - 印度、巴西、菲律宾和 MENA 的具名客户与项目案例，显示出口市场牵引力可信。
    - 相对私营公司规模、上市可比和战略可选性，Hurun 的 US$15B 估值锚点不算明显离谱。
  topRisks:
    - 欧洲等市场正从补贴、安全和产业政策角度加大对中国风电供应商的审查。
    - 稀土及更广泛材料集中度，可能扰动成本、交付节奏和竞争力。
    - 审计财务、债务、流动性、订单转化和分部利润率的公开披露仍很薄。
    - 从纯风机 OEM 扩到园区、燃料、储能和数字编排，执行复杂度明显上升。
    - 客户证据更偏里程碑和具名项目，而不是留存、队列质量或集中度披露。
  unresolvedGaps:
    - 含分部、利润率和现金流细节的经审计合并财务报表。
    - 当前股权结构条款、投资者权利，以及支撑私募估值锚点的任何优先股堆叠经济账。
    - 订单转化、国内与出口收入拆分，以及营运资金或债务到期结构。
    - 按现有风机和储能平台拆分的机队级可靠性与质保表现数据。
    - 主要业务线的客户集中度、续约和服务附着率指标。
