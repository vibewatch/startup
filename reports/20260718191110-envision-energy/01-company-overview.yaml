    "title": "Company Overview",
    "summary": "Envision Energy is a 2007-founded private climate-industrial platform led by Lei Zhang and headquartered in Shanghai. Public evidence is strongest on wind scale, platform breadth, and the company’s move into storage, hydrogen, EnOS software, and net-zero industrial parks; it is weaker on ownership and audited financial disclosure."
