      "body": "Envision Energy is a 2007-founded private climate-industrial platform led by Lei Zhang and headquartered in Shanghai. Public evidence is strongest on wind scale, platform breadth, and the company’s move into storage, hydrogen, EnOS software, and net-zero industrial parks; it is weaker on ownership and audited financial disclosure. This section focuses on disclosure gaps and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include The 2026 Net Zero Action Report says cumulative global wind installations surpassed 100 GW in 2025. The onshore portfolio says Galileo turbines had reached 90.3 GW of cumulative installed capacity by July 2025. Official materials say Envision maintains R&D and engineering centers across China, the US, the UK, France, Germany, and Denmark. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
