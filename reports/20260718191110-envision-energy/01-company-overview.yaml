  "sections": [
    {
      "id": "s1",
      "title": "Identity and scope",
      "body": "Envision Energy is a 2007-founded private climate-industrial platform led by Lei Zhang and headquartered in Shanghai. Public evidence is strongest on wind scale, platform breadth, and the company’s move into storage, hydrogen, EnOS software, and net-zero industrial parks; it is weaker on ownership and audited financial disclosure. This section focuses on identity and scope and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Public profile sources place Envision Energy’s founding in 2007. Public profile sources place Envision Energy headquarters in Shanghai, China. World Economic Forum identifies Lei Zhang as founder and CEO of Envision. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
