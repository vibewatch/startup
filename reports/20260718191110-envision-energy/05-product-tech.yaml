    "number": 5,
    "title": "Product & Technology",
    "summary": "Envision’s product story is strongest when treated as a stack: smart wind turbines, wind-farm lifecycle software, battery storage hardware, EnOS digital control, and industrial decarbonization infrastructure. Public materials support meaningful technology depth in onshore and offshore turbines, anti-typhoon design, digital forecasting and control, and 5 MWh-class storage systems."
  },
  "sections": [
    {
      "id": "s1",
      "title": "Product stack",
      "body": "Envision’s product story is strongest when treated as a stack: smart wind turbines, wind-farm lifecycle software, battery storage hardware, EnOS digital control, and industrial decarbonization infrastructure. Public materials support meaningful technology depth in onshore and offshore turbines, anti-typhoon design, digital forecasting and control, and 5 MWh-class storage systems. This section focuses on product stack and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include Envision’s wind-turbine page says the company pioneered smart turbines using smart control, advanced measurement, data analysis, and active performance control. The wind-farm page says Envision offers full lifecycle wind-farm management from siting through maintenance. The wind-farm materials say EnOS Smart Wind software and the KONG forecast system are part of the operating stack. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
