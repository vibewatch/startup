      "title": "Wind platforms",
      "body": "Envision’s product story is strongest when treated as a stack: smart wind turbines, wind-farm lifecycle software, battery storage hardware, EnOS digital control, and industrial decarbonization infrastructure. Public materials support meaningful technology depth in onshore and offshore turbines, anti-typhoon design, digital forecasting and control, and 5 MWh-class storage systems. This section focuses on wind platforms and synthesizes the retained public evidence rather than repeating management marketing at face value. Key signals include The onshore portfolio says Model T Pro and Model Z Pro include an EN-202/8.35 MW land-based turbine. The onshore portfolio says Galileo turbines reached 90.3 GW of cumulative installed capacity by July 2025. The offshore portfolio says Envision installed China’s first 4 MW offshore smart turbine in Jiangsu in 2013. The evidence is useful because it triangulates official materials with third-party market, media, regulatory, or filing sources where available. That still leaves unresolved diligence questions on pricing, margin quality, contract terms, capital intensity, or geography-specific execution, so the section should be read as a directional synthesis rather than a complete underwriting file. In practice, the chapter points to both industrial scale and material uncertainty, which is why later diligence should test management claims, compare peers, and request private operating data before a stronger investment call is made.",
