  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Exact repeat-purchase, churn, customer count, and cohort retention metrics by geography and channel.
      whyItMatters: These metrics determine whether Vuori's acquisition proof converts into durable customer economics.
      diligencePath: Request cohort retention, repeat-order frequency, return-rate, and customer-service data by DTC, store, and wholesale channels.
      relatedQuestionRefs: [QU004, QU008]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Channel mix, wholesale concentration, and any top-partner dependence disclosures.
      whyItMatters: Omnichannel reach can still mask dependence on a small number of retail or paid-media partners.
      diligencePath: Ask management for channel revenue split, top wholesale accounts, and any customer or partner concentration thresholds.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: Public end-customer references or case studies that show real usage, outcomes, and freshness beyond channel partners.
      whyItMatters: Named customer proof distinguishes broad brand awareness from verifiable adoption and repeat use.
      diligencePath: Collect customer testimonials, wholesale sell-through case studies, or third-party review-volume data tied to named products or cohorts.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
