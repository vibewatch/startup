company:
  name: Vuori
chapter:
  number: 6
  title: Customers
  summary: >-
    Vuori has credible public proof of omnichannel demand and customer acquisition, but most of
    the evidence is indirect: third-party review breadth, a partner case study on paid acquisition,
    and external descriptions of wholesale and store expansion rather than disclosed customer
    counts or cohorts. Durability looks directionally positive through service policy and review
    signal, yet retention, concentration, and true channel economics remain largely undisclosed.
sections:
  - id: customer-mix
    title: Customer mix is consumer-led but already omnichannel
    body: >-
      The public record supports a consumer apparel model centered on direct-to-consumer demand,
      but it no longer looks like a single-channel website business. Vuori's own surfaces position
      the brand as premium performance apparel across men's, women's, and accessories categories,
      while third-party marketing analysis describes a three-channel model spanning DTC,
      wholesale, and owned retail. That combination matters because it suggests the brand can
      acquire and serve customers through multiple touchpoints even without publishing customer
      counts, cohort data, or channel mix. The strongest support is around the existence of these
      surfaces rather than their economics: public materials show assortment breadth and
      expansion intent, but not what percentage of sales or repeat behavior each route carries.
    claimRefs: [CU001, CU002, CU011, CU012, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is real, but mostly proxied through channel efficiency and assortment breadth
    body: >-
      Public adoption evidence is strongest where a third party can observe it directly. Top
      Consumer Reviews counted a broad live assortment across women's and men's items, which is
      consistent with a scaled consumer catalog rather than a narrow launch collection. Wpromote's
      case study gives the clearest external proof of acquisition execution: before the engagement
      Google spend had barely scaled, then YouTube and Google Ads were used to add new-customer
      growth outside paid social while improving efficiency metrics. That does not prove repeat
      purchase or customer lifetime value on its own, but it does show Vuori can open new demand
      channels beyond Meta-style social acquisition. The store and international footprint claims
      add to the picture, though those depend on lower-confidence third-party reporting and still
      lack audited channel-level denominators.
    claimRefs: [CU005, CU008, CU009, CU010, CU013, CU014]
    tableRefs: [TU002]
  - id: durability-and-risk
    title: Durability signals are positive but retention and concentration remain opaque
    body: >-
      Customer durability is the weakest part of the public evidence set. Vuori's own promise of
      free returns and "Investment in Happiness" lowers purchase friction and signals willingness
      to absorb service costs, while third-party reviewers report favorable customer sentiment and
      repeat buying behavior. At the same time, the same review surface still notes complaints
      about returns and product quality, which means the adverse signal is limited but not zero.
      More importantly, none of the accessible sources disclose customer count, repeat-purchase
      rates, churn, NRR, wholesale concentration, or store-level productivity. Even one of the
      more elaborate external case-study pages explicitly says public, brand-specific detail on
      Vuori is limited and omits facts that are not public. That leaves the chapter's core
      conclusion as a qualified one: demand and brand reach look credible, but durability and
      concentration still need private diligence.
    claimRefs: [CU003, CU006, CU007, CU015]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / public proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Direct-to-consumer e-commerce
        - Consumer buyer = user = payer
        - Shop men's, women's, and accessories online
        - Official site spans major apparel categories; review surface counted 1,787 live items
        - Core owned relationship and data-rich purchase path
        - No disclosed revenue mix, repeat rate, or CAC by cohort
      - - Owned retail stores
        - Consumer buyer = user = payer with staff-assisted discovery
        - Community and brand immersion in physical locations
        - Third-party sources describe a 100+ store global footprint or target by end-2026
        - Adds offline acquisition, trial, and community touchpoints
        - No store productivity, traffic, or same-store sales disclosed
      - - Premium wholesale partners
        - Retail buyers plus end consumers
        - Distribution through premium partner shelves and websites
        - OptiMonk names Nordstrom and REI as wholesale partners
        - Can broaden reach without fully self-funding customer acquisition
        - No disclosed wholesale sell-through, margin mix, or contract dependence
    notes: >-
      Mix combines official and third-party descriptions; public sources identify access surfaces
      but not channel revenue shares or retention by segment.
    claimRefs: [CU002, CU005, CU011, CU012, CU013, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Women's assortment breadth
        - "909 items"
        - "2026-10-15"
        - Top Consumer Reviews
        - medium
        - Broad women's catalog supports scaled consumer demand targeting
        - No stock depth, turns, or revenue contribution disclosed
      - - Men's assortment breadth
        - "878 items"
        - "2026-10-15"
        - Top Consumer Reviews
        - medium
        - Men's catalog remains broad alongside women's expansion
        - No stock depth, turns, or repeat-purchase data disclosed
      - - Google / YouTube acquisition efficiency
        - Spend +389% MoM; CPA -87% MoM; ROAS +140% MoM
        - Undisclosed case-study period
        - Wpromote PDF
        - medium
        - Vuori found an incremental acquisition channel outside paid social
        - Absolute spend, revenue, and retention are not disclosed
      - - Retail and international access surface
        - 100+ stores globally; e-commerce in 18 countries
        - "2026"
        - WhoIsTheOwnerOf / OptiMonk
        - low
        - Customer access extends beyond the core U.S. website
        - No regional sales mix, store maturity, or utilization disclosed
    notes: >-
      Adoption metrics are observable public proxies rather than disclosed cohort data; low
      confidence rows rely on weaker third-party reporting and should be verified privately.
    claimRefs: [CU005, CU008, CU009, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Nordstrom
        - Premium wholesale retail
        - Third-party cited distribution partner that can expose Vuori to premium apparel buyers
        - Production / commercial
        - Supports the claim that Vuori is not purely DTC
        - No disclosed sell-through, shelf allocation, or economics
      - - REI
        - Outdoor / active wholesale retail
        - Third-party cited partner for customer reach outside Vuori-owned channels
        - Production / commercial
        - Suggests adjacencies beyond pure athleisure DTC traffic
        - No disclosed duration, exclusivity, or conversion data
      - - Wpromote / Google Ads / YouTube
        - Acquisition partner and channel proof, not an end customer
        - Paid-media program used to add new-customer acquisition outside paid social
        - Production / commercial
        - Lower CPA, higher ROAS, and incremental revenue stream per case study
        - Proves channel effectiveness, not end-customer retention or concentration
    notes: >-
      Public end-customer names are sparse, so this partial table captures named commercial proof
      surfaces visible in public materials rather than a true customer-reference roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Named commercial or externally described customer-access surfaces visible in public
        materials as of the 2026-10-15 run date; direct end-customer references are mostly absent.
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a journey that starts with social/search discovery, moves through
      broad online assortment, and loops into returns, repeat messaging, and store/wholesale
      expansion rather than a disclosed cohort funnel.
    data:
      nodes:
        - id: discover
          label: Discover
          title: Discover
          detail: External acquisition expands beyond paid social into Google and YouTube.
          touchpoints:
            - Google Ads
            - YouTube TrueView
            - social media
        - id: browse
          label: Browse
          title: Browse
          detail: Official site presents men's, women's, and accessories categories.
          touchpoints:
            - men's category
            - women's category
            - accessories
        - id: evaluate
          label: Evaluate
          title: Evaluate
          detail: Large live assortment and clear pricing reduce browsing friction.
          touchpoints:
            - 909 women's items
            - 878 men's items
            - price range $12 to $398
        - id: purchase
          label: Purchase
          title: Purchase
          detail: DTC purchase path is supported by free shipping threshold and simple returns.
          touchpoints:
            - free shipping over $75
            - 120-day returns
        - id: service
          label: Service and trust
          title: Service and trust
          detail: Investment in Happiness and review sentiment support post-purchase trust.
          touchpoints:
            - product guarantee
            - 4.6-star average rating
            - some return and quality complaints
        - id: expand
          label: Expand
          title: Expand
          detail: Expansion happens through stores, wholesale partners, and repeat-product prompts.
          touchpoints:
            - Nordstrom
            - REI
            - recommendation emails for returning customers
    claimRefs: [CU002, CU003, CU005, CU006, CU009, CU011, CU012]
callouts:
  - calloutType: strength
    title: Public evidence supports demand breadth more than customer metrics
    body: >-
      The best public customer proof is operational rather than financial: broad live assortment,
      omnichannel access, and a partner case study that shows new-customer acquisition efficiency.
    claimRefs: [CU005, CU009, CU011, CU014]
  - calloutType: risk
    title: Retention, concentration, and cohort durability are still private
    body: >-
      No accessible source in the assigned pool discloses customer count, repeat-purchase rates,
      wholesale concentration, or store-level productivity, so the chapter cannot underwrite
      durability beyond service-policy and review proxies.
    claimRefs: [CU003, CU006, CU007, CU015]
