  topStrengths:
    - Premium brand positioning with durable consumer appeal and strong list-price power.
    - Omnichannel distribution across DTC, owned retail, and selective wholesale.
    - Evidence of disciplined early unit economics and repeatable customer-acquisition execution.
  topRisks:
    - No audited revenue, gross margin, EBITDA, cash-flow, or liquidity disclosure.
    - Supply-chain transparency stops at policy language rather than factory-level operating evidence.
    - Store expansion and broader growth could outrun the premium niche if execution slips.
    - Legal/compliance and customer-service friction remain visible but not fully quantified.
  unresolvedGaps:
    - Audited FY2024-FY2025 revenue, EBITDA, gross margin, and cash-flow disclosure.
    - Detailed cap table, preference waterfall, and secondary-tender terms from the 2021 and 2024 transactions.
    - Channel-level unit economics across e-commerce, owned retail, wholesale, and international stores.
    - Cohort retention, repeat purchase, return-rate, and customer-service performance data by geography.
    - >-
      Factory concentration, third-party audit coverage, and mitigation plans for tariff or forced-labor enforcement
      changes.
