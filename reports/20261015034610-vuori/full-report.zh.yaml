          tone: neutral
          claimRefs:
            - CO001
        - date: '2015'
          label: Vuori 推出
          detail: Vuori 于 2015 年正式推出，专注于多用途男士运动服。
          tone: positive
          claimRefs:
            - CO001
        - date: '2016'
          label: 首家永久门店开业
