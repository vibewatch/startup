    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与覆盖范围
        blocks:
          - type: paragraph
            body: >-
              Vuori 由 Joe Kudla 于 2015 年在 Encinitas
              创立，至今仍将自己定位为围绕健身、冲浪、运动与艺术打造的加州海岸功能服饰品牌。现有资料支持其高端运动服饰和运动休闲定位，而非纯粹的技术运动细分市场；分销覆盖直营电商、品牌门店以及 REI、Nordstrom 和
              Equinox 等精选批发伙伴。公开地点表述不如品牌叙事清晰：第三方来源将公司置于圣迭戈北郡，但对当前总部应标为 Carlsbad 还是 Encinitas
              存在分歧，这是后续报告使用时一个虽小但真实的尽调清理项。
