      - number: '1.2'
        title: 管理层梯队与控制权
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最强的治理信号是创始人持续掌控。公开资料称 Kudla 仍任 CEO 和大股东；目前可见的运营管理层主要覆盖财务、人力、技术和营销，并非拥有异常完整的公开董事会或治理披露。Exa
              的领导层目录显示，公司已有一定规模的高管层，包括财务负责人 Desiree Swanson、人力负责人 Jennifer Frisch、技术负责人 Matt King、营销负责人 Karen
              Riley-Grant 和数字技术负责人 Harsh Kulkarni。这降低了纯粹的单一高管执行风险，但公司的所有权、创始故事和战略控制仍明显围绕 Kudla，指定来源池也没有提供完整董事名单或治理图谱。
