  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Vuori 实际销售的产品
        blocks:
          - type: paragraph
            body: >-
              指定证据支持将 Vuori 的市场定义为高端功能生活方式服饰，而不是整个服装、运动服饰或户外市场。Vuori
              自身定位围绕融合健身、冲浪、运动和艺术的“功能服饰”；独立报道则将其最初切入口描述为低调的男士运动服饰，面向希望拥有技术舒适性、但不想要醒目标志或硬核运动美学的人群。这个边界很重要，因为相关替代品不只有其他运动服饰品牌，还包括高端休闲服、从瑜伽穿到早午餐的运动休闲服，以及更偏技术训练的装备；后者面向更重视耐用性或吸湿管理、而非柔软度和生活方式表达的买家。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM014
