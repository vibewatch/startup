              - CV012
              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              由于保留来源没有公开经审计的当前财务报表或透明的当前成交股价，情景分析必须保持方向性。在乐观情景中，Vuori 将高端定位和计划中的零售扩张转化为持久的国际增长，同时守住品牌定价权。在基准情景中，公司继续扩张，但
              2024
              年估值已计入其中很大一部分执行成果，容错空间有限。在悲观情景中，即使公司运营仍稳健，估值倍数压缩、退出流动性不足或运营表现走弱也会损害回报。因此，关注下行触发因素和尽调问题，比围绕点估值制造虚假的精确度更有决策价值。
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.4'
        title: 最终尽调问题与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              从跟踪转为买入，需要公共来源池中仍缺失的证据：当前经审计的收入、毛利率、EBITDA 和现金流披露；更清楚地了解 2024
              年要约收购的优先级分配瀑布及任何当前二级市场成交价；以及渠道层面的留存和退货经济性，证明品牌可以在不稀释利润率的情况下国际化扩张。实际的论点破坏因素并不抽象，包括门店扩张跑在需求质量之前、二级市场条款明显不如
              headline 估值，或消费者需求和高端定价不再足够有韧性，无法支撑现有估值直到未来退出窗口。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
