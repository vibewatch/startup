            title: 流动性仍是承销判断的盲区
            body: 指定公开来源没有披露当前现金、烧钱速度、现金跑道、债务或经审计的 FY2024-FY2025 业绩，因此对资本充足性的任何结论仍需依赖私下尽调，而非公开证据。
