      - number: '4.2'
        title: 定价姿态与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Vuori 似乎依靠标价定位高端，而不是走折扣驱动的规模路线。TopConsumerReviews 发现其价格从 $12 的袜子到 $398
              的男士派克大衣不等，紧身裤、运动胸罩和夹克等核心服饰也处于高端价格，Hivelr 和 OptiMonk 都将其模式描述为高价且全渠道。DTC 体验还包括满 $75
              免运费和免费退货，这可能有助于转化，但也带来公开来源未量化的履约和逆向物流成本。最积极的经济性信号是定性表述：Joe Kudla 声称 Vuori
              从未以亏损获取客户。这一方向性信号令人鼓舞，但渠道层面的毛利率、退货率、CAC 和回本期仍未出现在指定公开来源池中。
