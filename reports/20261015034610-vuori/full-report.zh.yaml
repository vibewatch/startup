      - number: '1.3'
        title: 融资、估值与当前阶段
        blocks:
          - type: paragraph
            body: >-
              即使具体股权结构表不可得，Vuori 的公开融资里程碑仍较为连贯。指定来源池支持以下信息：2019 年 Norwest 的 $45 million 成长轮；2021 年 10 月 SoftBank Vision
              Fund 2 以约 $4 billion 估值投资 $400 million；以及 2024 年 11 月 General Atlantic 和 Stripes 主导、按约 $5.5 billion 估值完成的
              $825 million 二级要约收购。关键在于，2024 年交易被描述为二级要约收购，因此不应把全部 headline 金额视为进入经营资产负债表的新现金。现有证据仍指向一家后期私营公司，市场持续猜测其
              IPO，但指定来源池没有公开上市证据。
