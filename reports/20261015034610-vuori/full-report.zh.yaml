      - number: '2.3'
        title: 买家、付款方和采用路径清晰，规模化约束却不明朗
        blocks:
          - type: paragraph
            body: >-
              来源池中的买家地图比市场规模测算更连贯。现有证据指向成年消费者，他们从家庭可选支出中购买可从训练穿到旅行和日常休闲的装备；门店和精选批发伙伴承担发现与试穿渠道的作用，之后再把消费者导向直营关系。Vuori
              网站上的品类广度以及男女产品组合支持较宽的使用场景，但相同来源也暗示了一个约束：增长目前锚定在富裕、追求舒适的买家上，证据并未显示 Vuori
              已将这个细分市场转化为广泛且国际多元化的收入基础。因此，尽调时，买家扩张、富裕集群以外的门店生产率和渠道层面经济性，比泛泛而谈的“运动休闲市场很大”这一说法更重要。
