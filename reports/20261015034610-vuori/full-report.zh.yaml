            body: 来源池中最有力的反证信号不是品类太小，而是当前需求似乎高度集中于富裕家庭。如果 Vuori 无法在不稀释高端经济性的情况下扩大采用，估值支撑就将依赖公开市场证据尚未证明的假设。
