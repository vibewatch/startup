  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代品集合
        blocks:
          - type: paragraph
            body: >-
              保留的来源将 Vuori 描述为介于技术性能型 incumbent 与高端生活方式专家之间的品牌，而非独立成类。Keedia 将品类两极描述为以技术性能见长的 Nike 和 Under
              Armour，以及高价、偏女性生活方式/瑜伽的 Lululemon；Keedia 和 OptiMonk 都认为 Vuori 以“从健身房到日常生活”的男士优先极简主张切入市场。AskCyborg 和 Keedia
              还把 Lululemon、Nike、Under Armour、Alo Yoga、Rhone、Set Active 和 Outdoor Voices 列入现实竞争集合。真正的替代品横跨直接挑战者、分销更大的
              incumbent、高端生活方式同业以及多品牌零售渠道；后者无需消费者对 Vuori 产生品牌忠诚，也能满足同样的穿衣需求。就消费服饰而言，指定证据中没有真正的“内部自建”类比；最接近的现状替代方案，是继续从大众
              incumbent 品牌或多品牌零售商购买，而不是切换到 Vuori 的高端生态。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP011
