            body: >-
              当前证据指向一个集中度较高但仍极具吸引力的品牌，因此主要投资风险不在于创造需求，而在于能否走出已经跑通的细分市场。Morning Consult 发现 Vuori 的知名度仅为
              9.3%，但在知道它的消费者中相关性很强；Business Model Analyst
              则称收入集中于超富裕家庭和高收入城市专业人士。这一组合当前支持高端定价，但也意味着新门店和更广泛的营销必须提升知名度，同时不能削弱最初吸引这些买家的高端、低标志定位。Forbes 2024 年关于门店从 50
              多家走向 2026 年 100 家的报道进一步凸显运营风险：如果扩张过程中门店经济性、渠道纪律或产品一致性变弱，Vuori 可能用较低回报的增长换走品牌稀缺性。
