          tone: positive
          claimRefs:
            - CO008
        - date: 2021-10
          label: SoftBank 放大公司规模
          detail: SoftBank Vision Fund 2 投资 $400 million，对应估值约 $4 billion。
          tone: positive
          claimRefs:
            - CO009
        - date: '2022'
          label: 开始国际化铺开
