      - number: '2.2'
        title: 规模口径显示品类庞大，但 Vuori 专属 SAM 尚未证实
        blocks:
          - type: paragraph
            body: >-
              现有来源池不足以支撑层级数学精确的 TAM/SAM/SOM 金字塔，但能提供几种有用的规模口径。最宽的口径是北美女性运动服饰市场：Forbes 引用其 2023 年规模为 $158 billion，预计到
              2027 年 CAGR 为 6%，说明女性业务扩张具有战略意义，尽管该数字远超 Vuori 实际服务的细分市场。更窄的外部口径来自竞争对手发布的比较材料，其引用 P&S Intelligence
              称美国高端运动服饰市场 2024 年为 $29.6 billion，到 2030 年将增长至 $47.5 billion。不过，对 Vuori 近期渗透最相关的口径是买家集中度：Business Model
              Analyst 称其客户群偏向富裕家庭，并指出 vuoriclothing.com 的收入约 99% 仍来自美国。因此，估值叙事仍在押注品类和地域扩张，而公开证据尚未完全证明这一点。
