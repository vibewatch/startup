        title: 当前运营信号与待解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              来源池中最新的运营信号不是财务申报，而是 2026 年 10 月活动日历：其中显示 Vuori 在多家美国门店举办品牌课程和社区活动，包括 Carlsbad、Seattle、Houston、Bellevue 和
              Washington Square。结合第三方对全渠道扩张的评论，这说明公司仍在积极建设以品牌为核心的零售互动。相同来源也暴露了尽调薄弱处：Top Consumer Reviews
              提到退货和产品质量方面的零散投诉，Wikipedia 的公开门店数量停留在 2023
              年，而当前员工数尚未独立核实，因为两个非一手来源给出了明显不同的数字。公司也披露了可持续发展目标，但缺乏足够的经审计运营指标，无法仅凭该来源池确定收入、客户数或当前员工数。
