  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在集中度和供应链可见性，而不是迫在眉睫的致命法律事件。
    data:
      columns:
        - label: 可能性
          note: 基于指定证据的分析概率。
        - label: 影响
          note: 对增长质量、利润率或品牌持久性的下行影响。
        - label: 缓释成熟度
          note: 有公开证据支持的成熟度，不是管理层意图。
      rows:
        - label: 富裕买家集中度与门店铺开
          note: 需求集中度叠加 100 家门店的目标。
          values:
            - label: 中
              tone: high
              note: 核心细分市场之外的认知度仍然较低。
            - label: 高
              tone: critical
              note: 铺开失败会损害高端业务的单位经济。
            - label: 中
              tone: warning
              note: 管理层意识到这一点，但运营证明仍未公开。
        - label: Tier 1 以下的供应链可见性
          note: 公开控制措施只覆盖 Tier-1 供应商。
          values:
            - label: 中
              tone: high
              note: 业务覆盖多个采购国。
            - label: 高
              tone: critical
              note: 合规或关税问题可能冲击利润率和库存。
            - label: 低-中
              tone: warning
              note: 有政策文字，但审计证据未公开。
        - label: 无障碍与客户体验暴露
          note: 包括 2024 年的投诉，以及退货和质量信号。
          values:
            - label: 中
              tone: warning
              note: 已有记录在案的投诉，也有一些负面评论证据。
            - label: 中-高
              tone: high
              note: 服务下滑会给高端品牌带来超比例的声誉损害。
            - label: 中
              tone: warning
              note: 保证和补救措施可见，但结果不可见。
        - label: 国际化与渠道执行复杂度
          note: 全球扩张仍领先于已披露的收入多元化。
          values:
            - label: 中
              tone: warning
              note: 公开证据中还看不到国际收入贡献。
            - label: 中
              tone: warning
              note: 在带来实质盈利之前，复杂度可能先分散管理层注意力。
            - label: 低-中
              tone: neutral
              note: 选择性批发和自营零售提供了一定灵活性。
        - label: 对批发伙伴和渠道协同的依赖
          note: 合作伙伴扩大触达，但也增加协同风险。
          values:
            - label: 中
              tone: warning
              note: 高端批发只有在售罄率和品牌标准守住时才有效。
            - label: 中
              tone: warning
              note: 渠道冲突或伙伴执行不力会模糊定位。
            - label: 中
              tone: warning
              note: 管理层看起来有所筛选，但集中度数据仍未公开。
        - label: 高端定价与服务摩擦敏感性
          note: 满意保证会放大服务失误带来的下行。
          values:
            - label: 中
              tone: warning
              note: 尽管整体评价较强，已有一些投诉。
            - label: 中-高
              tone: high
              note: 信任下滑时，高端品牌可能很快失去复购行为。
            - label: 中
              tone: warning
              note: 保证和退货政策有所帮助，但缺陷和退货指标仍未公开。
    approximationNotes: 热力图单元格是根据引用证据综合出的分析严重度标签，不是公司披露的评分。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR008
      - CR009
      - CR012
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据支持关注 Vuori，但不足以在最近一次可见估值上给出买入建议。
    data:
      nodes:
        - label: 品牌证明
          detail: 高端性能服装定位和产品体验表达保持一致。
          tone: positive
        - label: 扩张跑道
          detail: 保留来源仍指向覆盖 18 个国家，以及 2026 年门店超过 100 家的计划。
          tone: positive
        - label: 2024 年融资锚点
          detail: 估值 $5.5B 的 $825M 二级要约仍是最近一次可见的定价事件。
          tone: warning
        - label: 披露缺口
          detail: 可见来源仍未披露经审计的当前收入、利润率或现金流支撑。
          tone: risk
        - label: 流动性与条款摩擦
          detail: 二级市场交易仍属私下且缺乏流动性，可见的清算顺序和成交价细节也不完整。
          tone: risk
        - label: 建议 = 跟踪
          detail: 等待更充分的披露或明显更好的入场条款，再把买入纳入投资判断。
          tone: warning
      edges:
        - from: Brand proof
          to: Expansion runway
          label: 支持增长逻辑
        - from: Expansion runway
          to: 2024 financing anchor
          label: 解释投资者兴趣
        - from: 2024 financing anchor
          to: Disclosure gap
          label: 仍需运营证明
        - from: Disclosure gap
          to: Liquidity and term friction
          label: 叠加投资判断风险
        - from: Liquidity and term friction
          to: Recommendation = track
          label: 保持严格价格纪律
