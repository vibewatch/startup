companyProfile:
  summary: >-
    Vuori
    是一个围绕加州海岸生活方式定位打造的高端运动服饰品牌，拥有直营网站、自营门店和精选批发分销。公开材料及第三方报道支持其品牌需求强劲、定价高端，但公司仍未披露足以让投资者有把握评估利润率、流动性和采购风险的经审计财务及运营细节。
  foundingLocation: Encinitas, California, USA
  headquarters: Carlsbad, California, USA
  productSummary: 面向男女的高端功能服饰和运动休闲服饰，覆盖直营线上、零售和批发渠道。
  customerFocus: 追求高端运动服饰、希望从训练穿到日常生活的富裕且注重风格的消费者
  businessModel: 通过 DTC 电商、自营零售和精选批发伙伴销售品牌服饰
  stage: Late-stage private / pre-IPO
  fundingStatus: 2024 年二级要约收购后 Vuori 估值达到 $5.5B，此前曾于 2021 年获得机构融资
  disclosureProfile: private-disclosed
