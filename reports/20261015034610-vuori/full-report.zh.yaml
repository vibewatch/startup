      - number: '3.3'
        title: 耐久性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              证据表明 Vuori
              的护城河真实存在，但结构上并不坚固。其公开信任姿态依靠供应链标准、可持续发展表述、宽松的服务政策和连贯的加州生活方式品牌，而不是可见的专有技术栈或独特分销锁定。在高端服饰中这仍有价值，但也意味着如果另一个品牌能匹配外观、版型、服务或文化信号，买家可以同时购买多个品牌。Keedia
              的市场评论认为品类正在分化，而不是收敛到单一赢家，并指出 incumbent 反击以及国际化/零售执行仍是持续风险。Top Consumer Reviews
              对退货和产品质量的零散投诉进一步强化了这一谨慎判断，尽管整体客户反馈仍然正面。结论是：Vuori 看起来确有差异化，但耐久性更多取决于持续的品牌执行和渠道纪律，而非深厚的技术锁定。
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开增长信号
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Vuori 通过多个相互连接的渠道变现，而不是依靠单一店面。官网是一个在运营中的 DTC 交易界面，分别提供 Women、Men、Accessories 和 Gifting 路径；Forbes
              报道称 Vuori 在成立第二年已达到 $1 million DTC 收入并实现盈利，随后到 2018 年销售额超过 $30 million，而批发当时仍贡献了早期大部分销量。同一 Forbes
              资料还提到独立的线上店、批发和国际渠道负责人，以及到 2024 年初已达到 50+ 家门店的自营门店网络。Particl 的 2026
              年更新增加了一个有用但有限的售罄代理指标，显示标准化销量上升，而不是披露公司收入，因此证据更清楚地支持增长势头，而不是经审计的收入质量。
