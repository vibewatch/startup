      - number: '4.3'
        title: 资本充足性与承销缺口
        blocks:
          - type: paragraph
            body: >-
              本章最难的缺口不是需求，而是足以评估投资判断的披露。Forbes 明确称 Vuori 仍是私营公司，除少量摘录外不披露销售数据，因此公众仍缺乏经审计的收入、毛利率、EBITDA、营运资本和现金流证据。2026
              年一份追踪所有权的资料进一步称，2024 年 11 月的 $825 million
              交易采用二级要约收购结构，流动性可能流向现有持有人，而非明确披露的新经营现金；这是有用的背景信息，但在直接核实交易材料或管理层尽调前，应按低置信度处理。与此同时，Vuori
              自己对供应链标准的披露仍停留在政策表述：它说明供应商行为准则要求，却没有说明工厂集中度、审计覆盖或关税敏感性。因此，财务结论在品牌需求和渠道广度上偏正面，但收入质量、利润率可见度和当前流动性仍无法判断。
            claimRefs:
              - CI007
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 展品
        blocks:
          - type: callout
            title: 公开证据指向有纪律的全渠道增长
            body: 渠道组合看起来是层层叠加而非杂乱无章：先是 DTC 盈利，再由批发建立信誉和覆盖，随后在在线及国际分销之上扩张自营零售。
