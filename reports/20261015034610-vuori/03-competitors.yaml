      - [Lululemon, "High prices referenced qualitatively; no assigned pool price scrape", "Per-item consumer purchase", "Premium lifestyle association in retained sources", "Can match Vuori's premium end of the market even if assigned evidence lacks detailed price bands"]
      - ["Nike / Under Armour", "No assigned pool price scrape", "Per-item consumer purchase across broader distribution", "Technical-performance brand recognition", "Likely compete on breadth and performance identity more than on Vuori's minimalist lifestyle packaging"]
      - ["Rhone / Set Active / Outdoor Voices / Alo", "No assigned pool price scrape", "Per-item consumer purchase", "Compete for premium-activewear budget with aggressive marketing or category momentum", "Pressure is credible, but the assigned pool does not provide enough direct pricing pages for a normalized comparison"]
      - ["Multi-brand retail or status quo", "Mixed by retailer and brand", "Multi-brand shopping rather than one-brand commitment", "Convenience, assortment breadth, and easier side-by-side substitution", "Makes multi-homing easy and weakens any apparel moat based only on style preference"]
    notes: >-
      Only Vuori has explicit assigned-pool price and service detail here; competitor
      pricing remains intentionally sparse until direct rival storefront evidence is
      reviewed in a later diligence pass.
    claimRefs: [CP002, CP003, CP007, CP008, CP009, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map where higher x implies more direct brand/distribution control and
      higher y implies clearer premium-lifestyle differentiation in the assigned
      evidence.
    data:
      points:
        - label: Vuori
          x: 5
          y: 4
          detail: >-
            DTC, owned retail, and selective wholesale support high channel control,
            while official positioning and third-party analysis support a strong
            premium-lifestyle identity.
        - label: Lululemon
          x: 5
          y: 5
          detail: >-
            Retained sources frame Lululemon as the historical premium lifestyle / yoga
            incumbent with a mature retail playbook.
        - label: Nike
          x: 2
          y: 2
          detail: >-
            Sources describe Nike as a technical-performance incumbent defending share
            through scale distribution rather than Vuori's minimalist premium-lifestyle
            niche.
        - label: Under Armour
          x: 2
          y: 1
          detail: >-
            Retained category analysis says Under Armour is declining and lacks a clear
            position between pure performance and lifestyle.
        - label: Alo Yoga
          x: 4
          y: 4
          detail: >-
            Keedia cites Alo Yoga as gaining share in premium U.S. activewear, making it
            a credible premium-lifestyle peer even though this pool lacks direct pricing
            or channel detail.
        - label: Multi-brand retail status quo
          x: 1
          y: 2
          detail: >-
            Department-store or specialty-retail shopping offers breadth and convenience
            but not the same direct brand relationship or focused lifestyle identity.
    approximationNotes: >-
      Scores are ordinal 1-5 synthesis judgments derived from the retained source text
      on channel control and premium-lifestyle differentiation; they are not measured
      market-share, revenue, or conversion data.
    claimRefs: [CP005, CP007, CP009, CP010, CP011, CP012]
