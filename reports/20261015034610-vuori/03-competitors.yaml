      - ["Nike / Under Armour", Technical-performance incumbents, "Large-scale incumbents with broad distribution; no comparable funding detail in assigned pool", "Mass and premium athletic buyers who prioritize performance breadth", "Technical-performance brand recognition and distribution scale", "Assigned sources imply weaker fit for buyers seeking understated premium lifestyle apparel"]
      - [Alo Yoga, Premium lifestyle direct peer, "Keedia cites share gains in premium U.S. activewear; no funding detail in assigned pool", "Premium aspirational activewear buyer", "Premium lifestyle brand with momentum in the same broad category", "Assigned sources do not expose precise pricing, channel mix, or retention versus Vuori"]
      - ["Rhone / Set Active / Outdoor Voices", Emerging challengers, "Competitive pressure noted, but assigned pool gives no quantified scale or funding by brand", "Adjacent premium activewear and athleisure customers", "Aggressive marketing around similar premium-lifestyle territory", "Public evidence in this pool is directional rather than profile-complete"]
      - ["Multi-brand retail or status quo wardrobe", Substitute / status quo, "Scale comes from retailer breadth rather than a single brand; no one-brand funding analogue", "Shoppers who can satisfy the same apparel job without joining one ecosystem", "Breadth, convenience, and easy cross-shopping across brands", "Lower brand identity and weaker direct relationship than Vuori's owned channels"]
    notes: >-
      Assigned evidence is rich on category positioning but thin on comparable funding,
      realized pricing, and store productivity for named rivals; unknowns are left
      explicit instead of inferred from outside sources.
    claimRefs: [CP004, CP005, CP007, CP009, CP010, CP011]
