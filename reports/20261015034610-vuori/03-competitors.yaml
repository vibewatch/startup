      - ["Women's activewear strength", "Broad catalog now spans women, but category leadership is not proven in assigned pool", "Strong category association in retained sources", "Broad assortment", "Likely relevant, but assigned pool does not provide clean share or retention comparisons"]
      - ["Technical feature emphasis", "Lower emphasis; sources stress versatility and comfort over compression-style feature marketing", "Unknown in assigned pool beyond premium positioning", "Higher emphasis in retained category descriptions", "Unknown by brand from assigned pool"]
      - ["Channel control", "High: DTC, selective wholesale, and growing owned retail", "Likely high, but retained evidence here is directional not exhaustive", "Lower relative control because assigned sources emphasize distribution scale", "Varies; assigned pool only says competition is intensifying"]
      - ["Trust / service posture", "Visible guarantee, free returns, sustainability and supplier-code messaging", "Unknown from assigned pool", "Unknown from assigned pool", "Unknown from assigned pool"]
    notes: >-
      This matrix keeps unsupported cells as unknown because the assigned pool is mostly
