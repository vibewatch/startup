  evidenceGaps:
    - type: missing-source
      severity: material
      topic: disclosure-gap
      missingEvidence: Current audited revenue, gross margin, EBITDA, and cash-flow disclosure for the most recent fiscal year and trailing period.
      whyItMatters: The recommendation is price-sensitive, and public valuation support is weak without audited operating performance.
      diligencePath: Request audited financial statements or lender-grade board materials covering revenue, margins, EBITDA, and cash generation.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: cap-table-opacity
      missingEvidence: Detailed 2024 tender waterfall, transfer restrictions, employee versus investor liquidity split, and any current secondary clearing price.
      whyItMatters: Headline valuation without term detail can materially overstate common-share attractiveness for a new investor.
      diligencePath: Obtain the tender memorandum, cap table, and any broker or company-approved secondary transaction summaries.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: channel-economics
      missingEvidence: Channel-level retention, return-rate, and contribution-margin evidence across e-commerce, wholesale, and international stores.
      whyItMatters: Scenario confidence depends on whether brand expansion preserves economics instead of simply increasing footprint.
      diligencePath: Request cohort and channel dashboards with repeat purchase, return-rate, CAC payback, and store four-wall margin data.
      relatedQuestionRefs: [QV008]
