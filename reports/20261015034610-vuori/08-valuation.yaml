    claimRefs: [CV001, CV007, CV009, CV010, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - Evidence
      - What would change the view
    rows:
      - ["Premium brand with omnichannel expansion runway", thesis, "Lifestyle positioning, 18-country reach, and >100-store 2026 plan support real scale potential", "Show audited growth and margin durability at the current mark"]
      - ["2024 tender validates demand for shares but not fresh primary capital need", anti-thesis, "Secondary structure priced liquidity for holders rather than proving new operating capital scarcity", "Disclose current operating metrics and why the tender price still clears on fundamentals"]
      - ["Private-market access and term opacity weaken underwriteability", anti-thesis, "Visible secondary pages stress illiquidity and do not expose current clearing price or full waterfall terms", "Provide current share pricing, preference stack, and transfer constraints"]
    notes: "Arguments are price-sensitive and evidence-sensitive rather than a generic company-quality score."
    claimRefs: [CV005, CV006, CV007, CV009, CV010, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Brand momentum, international scaling, and store rollout sustain premium demand", "Current mark can work only if new disclosure confirms durable growth and strong margins", "Execution slip, fashion cyclicality, or international missteps", "Would need audited financial proof plus healthy new secondary demand"]
      - [Base, "Company keeps growing but public disclosure stays sparse", "Operational success is offset by little room for multiple expansion from $5.5B", "Returns depend on entry discipline and exit timing", "Best fit with today's visible evidence"]
      - [Bear, "Demand softens or margins compress while liquidity stays constrained", "Headline valuation compresses before a liquid exit is available", "Private-market illiquidity amplifies mark-to-exit gap", "Triggered by weak operating disclosure or unattractive secondary terms"]
    notes: "Directional scenario frame only; retained sources do not expose audited current financials or a current clearing share price."
    claimRefs: [CV001, CV007, CV009, CV010, CV012, CV014]
