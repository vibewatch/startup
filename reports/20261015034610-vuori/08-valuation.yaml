company:
  name: Vuori
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports interest in Vuori as a scaled premium activewear
    brand, but the underwriteable price anchor remains the November 2024 $825 million
    secondary tender at a $5.5 billion valuation rather than a fresh operating disclosure.
    With store-expansion proof and brand momentum offset by private-market illiquidity,
    sparse cap-table detail, and no current audited financials in the visible record,
    the evidence-backed call remains track rather than buy.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The strongest public valuation anchor is still the November 2024 secondary tender
      that priced Vuori at $5.5 billion, with no newer public operating disclosure in this
      pool showing audited revenue, margin, or cash-flow support for underwriting
      additional upside at that mark. The business still looks attractive on brand,
      category, and expansion evidence, but the investable question is price sensitivity,
      not whether Vuori is a quality company. Because the accessible share path is still
      private, secondary, and explicitly illiquid, the prudent stance is to keep Vuori in
      track status until either operating disclosure improves or entry terms move enough to
      create a clearer return cushion.
    claimRefs: [CV001, CV007, CV009, CV010, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: support-for-the-thesis-and-anti-thesis
    title: Support for the thesis and anti-thesis
    body: >-
      The long case is real: Vuori still presents as a premium performance-apparel brand
      with a differentiated lifestyle identity, broadening omnichannel reach, and a store
      expansion plan that management and third-party market-data pages still point toward
      2026. That helps explain why investors accepted a $5.5 billion mark in the 2024
      tender. The anti-thesis is equally important: the 2024 deal was secondary rather
      than primary financing, public pages still do not expose current revenue or EBITDA
      multiples for Vuori itself, and visible secondary-market pages emphasize illiquidity
      and incomplete term visibility. That combination supports interest in the company
      while weakening conviction in the current entry price.
    claimRefs: [CV003, CV005, CV006, CV007, CV012, CV013]
    tableRefs: [TV002]
  - id: scenario-frame
    title: Bull, base, and bear scenario frame
    body: >-
      The scenario work has to stay directional because the retained sources do not expose
      audited current financial statements or a transparent current clearing share price.
      In the bull case, Vuori converts its premium positioning and planned retail rollout
      into durable international growth while protecting brand pricing power. In the base
      case, the company keeps expanding but the 2024 valuation already prices in much of
      that execution, leaving limited room for error. In the bear case, multiple
      compression, weak exit liquidity, or softer operating performance can hurt returns
      even if the company remains operationally sound. That makes downside triggers and
      diligence asks more decision-useful than false precision around a point estimate.
    claimRefs: [CV001, CV007, CV009, CV010, CV012, CV014]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      A move from track to buy needs evidence that is still missing from the public pool:
      current audited revenue, gross margin, EBITDA, and cash-flow disclosure; a clearer
      read on the 2024 tender's preference waterfall and any current secondary clearing
      price; and channel-level retention and return economics that show the brand can
      scale internationally without margin dilution. The practical thesis breakers are not
      abstract. They include evidence that store expansion is outrunning demand quality,
      that secondary-market terms are materially less favorable than the headline
      valuation, or that consumer demand and premium pricing are no longer resilient
      enough to support the existing mark through a future exit window.
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
