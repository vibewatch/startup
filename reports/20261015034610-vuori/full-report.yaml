      - number: '6.2'
        title: Adoption proof is real, but mostly proxied through channel efficiency and assortment breadth
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest where a third party can observe it directly. Top Consumer Reviews
              counted a broad live assortment across women's and men's items, which is consistent with a scaled consumer
              catalog rather than a narrow launch collection. Wpromote's case study gives the clearest external proof of
              acquisition execution: before the engagement Google spend had barely scaled, then YouTube and Google Ads
              were used to add new-customer growth outside paid social while improving efficiency metrics. That does not
              prove repeat purchase or customer lifetime value on its own, but it does show Vuori can open new demand
              channels beyond Meta-style social acquisition. The store and international footprint claims add to the
              picture, though those depend on lower-confidence third-party reporting and still lack audited
              channel-level denominators.
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU010
              - CU013
