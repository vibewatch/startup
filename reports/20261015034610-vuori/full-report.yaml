  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product promise and portfolio shape
        blocks:
          - type: paragraph
            body: >-
              Vuori's product promise is not narrowly technical sports gear; it is premium apparel built to move between
              exercise and everyday wear. Official pages repeatedly frame the brand around a Coastal California
              lifestyle that blends fitness, surf, sport, and art, while independent commentary says the brand won early
              share by avoiding loud logos and overly sport-specific design. The current consumer surface supports that
              positioning with women, men, and accessories navigation, activity-based filters, and hero collections
              rather than a deeply spec-heavy product taxonomy. Independent retail and catalog evidence suggests the
              assortment is now broad enough to support multiple use cases, but category economics still appear to be
              concentrated in a few bottoms and jogger franchises instead of a uniformly diversified catalog.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
