              - CE015
      - number: '5.3'
        title: Trust controls, support mechanics, and product-tech risk
        blocks:
          - type: paragraph
            body: >-
              Vuori does disclose some customer and supplier-control primitives. Official help and brand pages say
              tier-1 vendors must follow a code covering labor, health, safety, and environmental practices, and both
              official and third-party surfaces emphasize the Investment in Happiness return promise to reduce online
              apparel fit risk. Those are useful trust signals, but they are not the same as a mature public control
              environment. Public materials do not identify factory concentration, independent audit coverage below tier
              1, or quantified reliability metrics for returns, defects, or fulfillment. Independent review coverage
              also records isolated complaints about returns friction and product quality, which means the brand story
              is stronger than the disclosed operating evidence behind it.
            claimRefs:
              - CE002
              - CE011
              - CE012
