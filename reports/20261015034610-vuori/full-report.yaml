  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual risk clusters around concentration and supply-chain visibility rather than an immediate
      existential legal event.
    data:
      columns:
        - label: Likelihood
          note: Analytical probability based on assigned evidence.
        - label: Impact
          note: Downside to growth quality, margins, or brand durability.
        - label: Mitigation maturity
          note: Publicly evidenced maturity, not management intent.
      rows:
        - label: Affluent-buyer concentration and store rollout
          note: Demand concentration plus 100-store ambition.
          values:
            - label: Medium
              tone: high
              note: Awareness is still low outside the core niche.
            - label: High
              tone: critical
              note: Failed rollout would impair premium unit economics.
            - label: Medium
              tone: warning
              note: Management shows awareness, but operating proof is private.
        - label: Supply-chain visibility below tier 1
          note: Public controls stop at tier-1 vendors.
          values:
            - label: Medium
              tone: high
              note: The footprint spans multiple sourcing countries.
            - label: High
              tone: critical
              note: Compliance or tariff issues can hit margin and inventory.
            - label: Low-Medium
              tone: warning
              note: Policy language exists, but audit evidence is not public.
        - label: Accessibility and customer-experience exposure
          note: Includes the 2024 complaint plus returns and quality signals.
          values:
            - label: Medium
              tone: warning
              note: There is a documented complaint and some adverse review evidence.
            - label: Medium-High
              tone: high
              note: Premium brands suffer outsized reputation damage from service slippage.
            - label: Medium
              tone: warning
              note: Guarantees and remediation are visible, but outcomes are not.
        - label: International and channel-execution complexity
          note: Global expansion remains ahead of disclosed revenue diversification.
          values:
            - label: Medium
              tone: warning
              note: International revenue contribution is not yet visible in public evidence.
            - label: Medium
              tone: warning
              note: Complexity can distract management before adding material earnings.
            - label: Low-Medium
              tone: neutral
              note: Selective wholesale and owned retail provide some flexibility.
        - label: Wholesale partner and channel-coordination dependence
          note: Partner visibility adds reach but also coordination risk.
          values:
            - label: Medium
              tone: warning
              note: Premium wholesale works only if sell-through and brand standards hold.
            - label: Medium
              tone: warning
              note: Channel conflict or weak partner execution can blur positioning.
            - label: Medium
              tone: warning
              note: Management appears selective, but concentration data is private.
        - label: Premium price and service-friction sensitivity
          note: A happiness guarantee raises downside from service mistakes.
          values:
            - label: Medium
              tone: warning
              note: Some complaints already exist despite generally strong reviews.
            - label: Medium-High
              tone: high
              note: Premium brands can lose repeat behavior quickly when trust slips.
            - label: Medium
              tone: warning
              note: Guarantee and returns policy help, but defect and return metrics are private.
    approximationNotes: Heatmap cells express analytical severity labels synthesized from cited evidence, not disclosed company scores.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR008
      - CR009
      - CR012
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports interest in Vuori, but not a buy call at the last visible mark.
    data:
      nodes:
        - label: Brand proof
          detail: Premium performance-apparel positioning and product-experience messaging remain consistent.
          tone: positive
        - label: Expansion runway
          detail: The retained sources still point to 18-country reach and a plan to exceed 100 stores in 2026.
          tone: positive
        - label: 2024 financing anchor
          detail: $825M secondary tender at a $5.5B valuation remains the latest visible price-setting event.
          tone: warning
        - label: Disclosure gap
          detail: Visible sources still do not expose audited current revenue, margin, or cash-flow support.
          tone: risk
        - label: Liquidity and term friction
          detail: Secondary access remains private and illiquid, with incomplete visible waterfall and clearing-price detail.
          tone: risk
        - label: Recommendation = track
          detail: Wait for better disclosure or meaningfully better entry terms before underwriting a buy.
          tone: warning
      edges:
        - from: Brand proof
          to: Expansion runway
          label: supports growth case
        - from: Expansion runway
          to: 2024 financing anchor
          label: explains investor appetite
        - from: 2024 financing anchor
          to: Disclosure gap
          label: still needs operating proof
        - from: Disclosure gap
          to: Liquidity and term friction
          label: compounds underwriting risk
        - from: Liquidity and term friction
          to: Recommendation = track
          label: keeps price discipline high
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV010
      - CV013
      - CV014
