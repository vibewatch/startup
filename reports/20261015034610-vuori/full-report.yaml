      - number: '2.2'
        title: Sizing lenses show a large category but an unproven Vuori-specific SAM
        blocks:
          - type: paragraph
            body: >-
              The available pool does not justify a clean TAM/SAM/SOM pyramid with precise layer math, but it does
              support several useful sizing lenses. The broadest lens is the North American women's athletic apparel
              market, which Forbes cites at $158 billion in 2023 with 6% CAGR through 2027, showing why women's
              expansion matters strategically even though that figure far exceeds Vuori's actual served niche. A
              narrower external lens comes from a competitor-issued comparison citing P&S Intelligence for a $29.6
              billion U.S. premium sportswear market in 2024 growing to $47.5 billion by 2030. The most relevant lens
              for Vuori's near-term adoption, however, is buyer concentration: Business Model Analyst describes a
              customer base skewed to affluent households and notes that roughly 99% of vuoriclothing.com revenue still
              comes from the United States. That means the valuation narrative is still underwriting category and
              geography expansion that the public evidence has not yet fully demonstrated.
            claimRefs:
