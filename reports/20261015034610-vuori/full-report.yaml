      - number: '2.3'
        title: Buyer, payer, and adoption path are clear; the scaling constraint is less so
        blocks:
          - type: paragraph
            body: >-
              The buyer map in the pool is more coherent than the market-size math. The current evidence points to adult
              consumers paying out of household discretionary budgets for gear that can move from training to travel and
              casual daily wear, with stores and selected wholesale partners acting as discovery and trial channels that
              later feed direct relationships. Vuori's category breadth on-site and its women-plus-men assortment
              support a wide workflow surface, but the same sources also imply a constraint: growth is currently
              anchored in affluent, comfort-seeking buyers, and the evidence does not show that Vuori has already
              translated that niche into a broad, internationally diversified revenue base. For diligence, that makes
              buyer expansion, store productivity outside wealthy clusters, and channel-level economics more important
              than any generic "athleisure is big" claim.
            claimRefs:
