      - number: '6.3'
        title: Durability signals are positive but retention and concentration remain opaque
        blocks:
          - type: paragraph
            body: >-
              Customer durability is the weakest part of the public evidence set. Vuori's own promise of free returns
              and "Investment in Happiness" lowers purchase friction and signals willingness to absorb service costs,
              while third-party reviewers report favorable customer sentiment and repeat buying behavior. At the same
              time, the same review surface still notes complaints about returns and product quality, which means the
              adverse signal is limited but not zero. More importantly, none of the accessible sources disclose customer
              count, repeat-purchase rates, churn, NRR, wholesale concentration, or store-level productivity. Even one
              of the more elaborate external case-study pages explicitly says public, brand-specific detail on Vuori is
              limited and omits facts that are not public. That leaves the chapter's core conclusion as a qualified one:
              demand and brand reach look credible, but durability and concentration still need private diligence.
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU015
          - type: table
