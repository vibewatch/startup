        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence points to disciplined omnichannel growth
            body: >-
              The channel mix looks additive rather than chaotic: early DTC profitability, wholesale-led credibility and
              reach, then owned-retail expansion layered on top of online and international distribution.
            calloutType: insight
            claimRefs:
