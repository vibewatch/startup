      - number: '1.3'
        title: Funding, valuation, and current stage
        blocks:
          - type: paragraph
            body: >-
              Vuori's public financing story is coherent at a milestone level even if the exact cap table is not. The
              assigned pool supports a $45 million Norwest growth round in 2019, a $400 million SoftBank Vision Fund 2
              investment at about a $4 billion valuation in October 2021, and an $825 million secondary tender led by
              General Atlantic and Stripes in November 2024 at roughly a $5.5 billion valuation. The important nuance is
              that the 2024 event was described as a secondary tender, so readers should not treat the full headline
              number as new cash on the operating balance sheet. The available evidence still points to a late-stage
              private company with recurring IPO speculation but no public-listing evidence in this assigned pool.
            claimRefs:
              - CO008
