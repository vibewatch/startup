      - number: '1.4'
        title: Current operating signals and open diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The freshest operational signal in the pool is not a financial filing but the October 2026 events
              calendar, which shows Vuori-branded classes and community activations across many U.S. stores, including
              Carlsbad, Seattle, Houston, Bellevue, and Washington Square. Combined with third-party commentary on
              omnichannel expansion, that supports a company that is still actively building brand-led retail
              engagement. The same sources also show where diligence remains weak: Top Consumer Reviews notes scattered
              complaints around returns and product quality, Wikipedia's public store count is dated to 2023, and
              current headcount is not independently verified because two non-primary sources cite materially different
              figures. The company also discloses sustainability ambition, but not enough audited operating metrics to
              settle revenue, customers, or present-day headcount from this pool alone.
