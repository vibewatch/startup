      - number: '3.3'
        title: Durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence suggests Vuori's moat is real but not structurally hard. Its public trust posture leans on
              supply-chain standards, sustainability language, generous service policies, and a coherent
              California-lifestyle brand rather than a visible proprietary technology stack or a unique distribution
              lock. That can still be valuable in premium apparel, but it points to a buyer base that can multi-home if
              another brand matches the look, fit, service, or cultural signal. Keedia's market commentary argues the
              category is fragmenting instead of collapsing into a single winner, and it flags both incumbent response
              and international/retail execution as ongoing risks. Top Consumer Reviews strengthens that caution by
              noting scattered complaints about returns and product quality even while the overall customer response
              remains favorable. Net: Vuori appears differentiated, but its durability depends on continued brand
              execution and channel discipline more than on deep technical lock-in.
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction signals
        blocks:
          - type: paragraph
            body: >-
              The public evidence shows Vuori monetizing through several connected channels rather than a single
              storefront. The official site is a live DTC commerce surface with distinct Women, Men, Accessories, and
              Gifting paths, while Forbes reports that Vuori had already reached $1 million of DTC revenue and
              profitability by year two, then scaled to more than $30 million of sales by 2018 with wholesale still
              doing much of the early volume. That same Forbes profile describes separate online-store, wholesale, and
              international channel leads plus an owned-store footprint that had already reached 50+ stores in early
              2024. Particl's 2026 refresh adds a useful but limited sell-through proxy, showing rising normalized sales
              volume rather than disclosed company revenue, so the evidence supports momentum more clearly than audited
              top-line quality.
