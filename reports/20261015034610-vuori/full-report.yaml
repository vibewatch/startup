  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The retained sources frame Vuori as a premium activewear brand that sits between technical-performance
              incumbents and premium lifestyle specialists rather than in a category of its own. Keedia describes the
              category poles as Nike and Under Armour on technical performance versus Lululemon on high-price,
              female-skewed lifestyle/yoga, while both Keedia and OptiMonk argue that Vuori entered through a men-first,
              minimalist "gym to daily life" proposition. AskCyborg and Keedia also place Vuori in a live set that
              includes Lululemon, Nike, Under Armour, Alo Yoga, Rhone, Set Active, and Outdoor Voices, which means the
              real substitute set spans direct challengers, incumbents with larger distribution, premium lifestyle
              peers, and multi-brand retail channels that can satisfy the same wardrobe job without brand loyalty to
              Vuori. For consumer apparel there is no true "internal build" analogue in the assigned evidence; the
              closest status quo substitute is continuing to buy from generalist incumbent brands or multi-brand
              retailers rather than switching into Vuori's premium ecosystem.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP011
