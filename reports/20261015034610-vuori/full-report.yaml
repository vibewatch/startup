        title: Exhibits
        blocks:
          - type: callout
            title: Growth depends on expanding beyond today's richest households
            body: >-
              The strongest disconfirming signal in the pool is not that the category is small; it is that current
              demand appears unusually concentrated in affluent households. If Vuori cannot widen adoption without
              diluting its premium economics, valuation support will depend on assumptions that public market evidence
              has not yet proven.
