chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and footprint
        blocks:
          - type: paragraph
            body: >-
              Vuori was founded by Joe Kudla in 2015 in Encinitas and still frames itself as a coastal-California
              performance-apparel brand built around fitness, surf, sport, and art. The accessible record supports a
              premium activewear and athleisure positioning rather than a pure technical-sports niche, with distribution
              spanning direct e-commerce, branded stores, and selected wholesale partners such as REI, Nordstrom, and
              Equinox. Public location language is less clean than the brand narrative: third-party sources place the
              company in North County San Diego but disagree on whether current headquarters should be labeled Carlsbad
              or Encinitas, which is a small but real diligence cleanup item for later use in the report.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
