  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Vuori is actually selling
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports defining Vuori's market as premium performance-lifestyle apparel rather
              than the full apparel, sportswear, or outdoor market. Vuori's own positioning centers on "performance
              apparel" that integrates fitness, surf, sport, and art, while independent coverage describes the original
              wedge as understated men's activewear for people who wanted technical comfort without heavy logos or
              hard-core performance aesthetics. That boundary matters because the relevant substitutes are not only
              other activewear brands; they also include casual premium apparel, yoga-to-brunch athleisure, and more
              technical training gear for buyers who care more about durability or moisture management than softness and
              lifestyle signaling.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM014
              - CM016
