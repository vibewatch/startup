      - number: '3.2'
        title: Buyer tradeoffs across product, pricing, and channels
        blocks:
          - type: paragraph
            body: >-
              Vuori's public comparison points skew toward comfort, aesthetic versatility, and customer experience
              rather than proprietary technical features. Official pages and third-party review coverage show a premium
              storefront with free shipping over $75, a free-return guarantee, broad men's and women's catalogs, and
              price points ranging from accessory entry items up to premium outerwear. OptiMonk says Vuori's omnichannel
              model combines DTC, premium wholesale partners, and growing owned retail, while AskCyborg highlights DTC
              control and selective retailer expansion. That creates a tradeoff versus incumbents: Nike can win on scale
              and breadth, Lululemon can match the premium-lifestyle end of the market, and emerging peers can contest
              the same premium customer without having to beat Vuori on core performance technology. The public evidence
              is strongest on Vuori's own package and channel mix and materially thinner on competitor-by-competitor
              pricing, feature depth, and funding specifics, so unsupported cells are marked as unknown rather than
              guessed.
