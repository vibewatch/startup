      - number: '5.2'
        title: Operating architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The operating architecture visible from public sources is omnichannel and deliberately sequenced.
              Third-party case studies describe Vuori using selective wholesale partners such as REI, Nordstrom, and
              Equinox to validate demand before pushing harder into its own direct-to-consumer channel and store fleet.
              That matters because the operating model looks more like a controlled merchandising system than a pure
              e-commerce business: stores are used as community and assortment nodes, localized e-commerce is launched
              before heavier market commitment, and product mix changes by geography and local demand signals. The
              chapter's central diligence gap is that public sources describe this playbook at a narrative level but do
              not disclose the inventory, personalization, order-routing, or forecasting systems that make it durable at
              larger international scale.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
