      - CM015
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map where higher x implies more direct brand/distribution control and higher y implies clearer
      premium-lifestyle differentiation in the assigned evidence.
    data:
      points:
        - label: Vuori
          x: 5
          'y': 4
          detail: >-
            DTC, owned retail, and selective wholesale support high channel control, while official positioning and
            third-party analysis support a strong premium-lifestyle identity.
        - label: Lululemon
          x: 5
          'y': 5
          detail: >-
            Retained sources frame Lululemon as the historical premium lifestyle / yoga incumbent with a mature retail
            playbook.
        - label: Nike
          x: 2
          'y': 2
          detail: >-
            Sources describe Nike as a technical-performance incumbent defending share through scale distribution rather
            than Vuori's minimalist premium-lifestyle niche.
        - label: Under Armour
          x: 2
          'y': 1
          detail: >-
            Retained category analysis says Under Armour is declining and lacks a clear position between pure
            performance and lifestyle.
        - label: Alo Yoga
          x: 4
          'y': 4
          detail: >-
            Keedia cites Alo Yoga as gaining share in premium U.S. activewear, making it a credible premium-lifestyle
            peer even though this pool lacks direct pricing or channel detail.
        - label: Multi-brand retail status quo
          x: 1
          'y': 2
          detail: >-
            Department-store or specialty-retail shopping offers breadth and convenience but not the same direct brand
            relationship or focused lifestyle identity.
    approximationNotes: >-
      Scores are ordinal 1-5 synthesis judgments derived from the retained source text on channel control and
      premium-lifestyle differentiation; they are not measured market-share, revenue, or conversion data.
    claimRefs:
      - CP005
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows Vuori moving demand into revenue through DTC, stores, and selective wholesale, with
      profitability hinging on return and margin data that remain private.
    data:
      nodes:
        - id: awareness
          label: Demand generation
          note: Lifestyle/community marketing and premium brand positioning drive traffic.
        - id: dtc
          label: DTC site
          note: Official site sells directly, shows pricing, and offers free shipping over $75.
        - id: stores
          label: Owned retail
          note: 50+ stores reported in early 2024; stores also function as community hubs.
        - id: wholesale
          label: Wholesale partners
          note: Selective wholesale includes partners such as REI and Nordstrom.
        - id: orders
          label: Orders / sell-through
          note: Free returns and premium list pricing influence realized sell-through and net revenue.
        - id: revenue
          label: Recognized revenue
          note: Public evidence shows channel breadth, not audited revenue recognition or mix.
        - id: profit
          label: Gross profit / reinvestment
          note: Management emphasizes cash flow and profitable unit economics, but public margin data are absent.
      edges:
        - from: awareness
          to: dtc
          label: Digital conversion
        - from: awareness
          to: stores
          label: Visit / try-on
        - from: awareness
          to: wholesale
          label: Partner discovery
        - from: dtc
          to: orders
          label: Checkout
        - from: stores
          to: orders
          label: In-store purchase
        - from: wholesale
          to: orders
          label: Sell-in / sell-through
        - from: orders
          to: revenue
          label: Net of returns / promotions
        - from: revenue
          to: profit
          label: After product and fulfillment costs
    approximationNotes: >-
      Bridge is structural rather than numeric because the assigned evidence does not disclose channel mix, revenue
      recognition, or gross margin.
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
  - id: FE001
    title: Product operating architecture map
    type: stack
    summary: >-
      Public evidence points to a layered merchandising and channel stack rather than a disclosed application
      architecture.
    data:
      layers:
        - label: Brand promise
          detail: Coastal California performance-lifestyle positioning defines the entry point.
          modules:
            - label: Fitness, surf, sport, and art identity
            - label: Versatile premium activewear
          outputs:
            - label: Everyday-plus-workout use case
        - label: Hero franchise layer
          detail: Demand concentrates in a narrow set of bottoms and jogger franchises.
          modules:
            - label: Halo and Performance Jogger
            - label: Kore Short and Sunday Jogger
          outputs:
            - label: Focused assortment economics
        - label: Channel engine
          detail: DTC commerce is complemented by selective wholesale and owned stores.
          modules:
            - label: First-party e-commerce
            - label: REI / Nordstrom / Equinox validation
          outputs:
            - label: Omnichannel reach with brand control
        - label: Localization loop
          detail: Markets are tested digitally and assortments flex by local demand signals.
          modules:
            - label: Market-specific store assortments
            - label: 18+ countries with 11 localized e-commerce launches
          outputs:
            - label: Country and city expansion sequencing
        - label: Trust and support layer
          detail: Supplier-code and return-policy signals reduce buyer friction.
          modules:
            - label: Tier-1 vendor code
            - label: Investment in Happiness returns
          outputs:
            - label: Baseline quality and service trust
        - label: Diligence blind spots
          detail: Public materials omit the systems and factory detail behind the visible promise.
          modules:
            - label: No public OMS / inventory / personalization stack
            - label: No public factory concentration or audit depth
          outputs:
            - label: Scaling-risk diligence blockers
    claimRefs:
