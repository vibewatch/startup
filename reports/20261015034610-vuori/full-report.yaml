      - number: '4.3'
        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              This chapter's hardest gap is not demand but underwriteable disclosure. Forbes explicitly says Vuori
              remains private and does not reveal sales data beyond selected snippets, which means public readers still
              lack audited revenue, gross margin, EBITDA, working-capital, and cash-flow evidence. A 2026
              ownership-tracking profile further says the November 2024 $825 million transaction was structured as a
              secondary tender, implying liquidity for existing holders rather than clearly disclosed new operating
              cash; that is useful context but should be treated as low-confidence until verified directly in
              transaction materials or management diligence. Meanwhile, Vuori's own disclosures on supply chain
              standards remain policy-level: they show vendor-code expectations, not factory concentration, audit
              coverage, or tariff sensitivity. The financial verdict is therefore positive on brand demand and channel
              breadth, but still blocked on revenue quality, margin visibility, and current liquidity.
            claimRefs:
              - CI007
              - CI011
              - CI012
              - CI013
              - CI014
