  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is consumer-led but already omnichannel
        blocks:
          - type: paragraph
            body: >-
              The public record supports a consumer apparel model centered on direct-to-consumer demand, but it no
              longer looks like a single-channel website business. Vuori's own surfaces position the brand as premium
              performance apparel across men's, women's, and accessories categories, while third-party marketing
              analysis describes a three-channel model spanning DTC, wholesale, and owned retail. That combination
              matters because it suggests the brand can acquire and serve customers through multiple touchpoints even
              without publishing customer counts, cohort data, or channel mix. The strongest support is around the
              existence of these surfaces rather than their economics: public materials show assortment breadth and
              expansion intent, but not what percentage of sales or repeat behavior each route carries.
