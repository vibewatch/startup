      - number: '4.2'
        title: Pricing posture and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Vuori appears positioned as a premium brand on list price rather than a discount-led volume play.
              TopConsumerReviews found price ranges from $12 socks to a $398 men's parka, with core apparel such as
              leggings, sports bras, and jackets priced at premium levels, while Hivelr and OptiMonk both describe the
              model as premium-priced and omnichannel. The DTC experience also includes free shipping above $75 and free
              returns, which likely help conversion but create fulfillment and reverse-logistics costs that public
              sources do not quantify. The best positive economics signal is qualitative: Joe Kudla's claim that Vuori
              never acquired a customer at a loss. That is directionally encouraging, but channel-level gross margin,
              return rates, CAC, and payback are still absent from the assigned public pool.
