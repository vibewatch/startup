      - number: '1.2'
        title: Leadership bench and control
        blocks:
          - type: paragraph
            body: >-
              The strongest governance signal in the assigned pool is continued founder control. Public profiles say
              Kudla remains CEO and majority owner, while the best visible operating bench clusters around finance,
              people, technology, and marketing rather than an unusually broad public board or governance disclosure
              set. Exa's leadership directory shows a reasonably scaled executive layer, including Desiree Swanson in
              finance, Jennifer Frisch in people, Matt King in technology, Karen Riley-Grant in marketing, and Harsh
              Kulkarni in digital technology. That reduces pure single-executive execution risk, but the company is
              still visibly keyed to Kudla on ownership, origin story, and strategic control, and the assigned pool does
              not provide a complete board roster or governance map.
