  evidenceGaps:
    - type: missing-source
      severity: material
      topic: internal-systems
      missingEvidence: Public evidence does not disclose the OMS inventory planning personalization or fulfillment systems that support localized merchandising and omnichannel execution.
      whyItMatters: Without the underlying systems stack it is hard to judge whether current product breadth and store expansion are operationally repeatable.
      diligencePath: Request a product-and-operations architecture walkthrough covering commerce platform OMS WMS forecasting and localization workflows.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: supplier-depth
      missingEvidence: Public materials do not disclose factory concentration below tier 1, third-party audit coverage, or remediation performance for supplier issues.
      whyItMatters: Product quality and geopolitical resilience depend on more than a published code of conduct when the store and international footprint is scaling quickly.
      diligencePath: Request the supplier map by country plus third-party audit cadence, corrective-action history, and concentration thresholds.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
