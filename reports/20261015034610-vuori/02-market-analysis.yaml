  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som-isolation
      missingEvidence: >-
        Channel-level revenue mix, repeat-purchase, and geography disclosure
        sufficient to convert broad category estimates into a Vuori-specific SAM
        or SOM.
      whyItMatters: >-
        Without a company-specific served-market cut, the public evidence supports
        directional sizing lenses but not a defensible underwriting model for how
        much of those categories Vuori can actually capture.
      diligencePath: >-
        Request management reporting that breaks out DTC, stores, wholesale, and
        international revenue plus cohort behavior by major customer segment and
        geography.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: minor
      topic: basket-size-estimates
      missingEvidence: >-
        Direct company disclosure or audited channel analytics that reconcile
        third-party average-ticket estimates of roughly $185 versus $214.
      whyItMatters: >-
        Basket size affects assumptions about pricing power, store productivity,
        and how much growth can come from deeper wallet share versus new-customer
        acquisition.
      diligencePath: >-
        Request internal AOV and units-per-order data by channel, plus the
        definitions behind each external estimate.
      relatedQuestionRefs: [QM003]
