company:
  name: "Vuori"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Vuori remains a founder-controlled private premium activewear brand with a
    credible brand and retail expansion story, but public disclosure is still
    thin relative to the 2024 $5.5 billion valuation mark. The assigned pool
    supports the founding story, leadership bench, funding milestones, and
    current community footprint more clearly than it supports current revenue,
    customer count, headcount, or a fully verified cap table.
sections:
  - id: "identity-positioning-and-footprint"
    title: "Identity, positioning, and footprint"
    body: >-
      Vuori was founded by Joe Kudla in 2015 in Encinitas and still frames
      itself as a coastal-California performance-apparel brand built around
      fitness, surf, sport, and art. The accessible record supports a premium
      activewear and athleisure positioning rather than a pure technical-sports
      niche, with distribution spanning direct e-commerce, branded stores, and
      selected wholesale partners such as REI, Nordstrom, and Equinox. Public
      location language is less clean than the brand narrative: third-party
      sources place the company in North County San Diego but disagree on
      whether current headquarters should be labeled Carlsbad or Encinitas,
      which is a small but real diligence cleanup item for later use in the
      report.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: "leadership-and-control"
    title: "Leadership bench and control"
    body: >-
      The strongest governance signal in the assigned pool is continued founder
      control. Public profiles say Kudla remains CEO and majority owner, while
      the best visible operating bench clusters around finance, people,
      technology, and marketing rather than an unusually broad public board or
      governance disclosure set. Exa's leadership directory shows a reasonably
      scaled executive layer, including Desiree Swanson in finance, Jennifer
      Frisch in people, Matt King in technology, Karen Riley-Grant in
      marketing, and Harsh Kulkarni in digital technology. That reduces pure
      single-executive execution risk, but the company is still visibly keyed
      to Kudla on ownership, origin story, and strategic control, and the
      assigned pool does not provide a complete board roster or governance map.
    claimRefs: [CO005, CO006, CO007, CO015]
    tableRefs: [TO002, TO003]
  - id: "funding-valuation-and-stage"
    title: "Funding, valuation, and current stage"
    body: >-
      Vuori's public financing story is coherent at a milestone level even if
      the exact cap table is not. The assigned pool supports a $45 million
      Norwest growth round in 2019, a $400 million SoftBank Vision Fund 2
      investment at about a $4 billion valuation in October 2021, and an $825
      million secondary tender led by General Atlantic and Stripes in November
      2024 at roughly a $5.5 billion valuation. The important nuance is that
      the 2024 event was described as a secondary tender, so readers should not
      treat the full headline number as new cash on the operating balance
      sheet. The available evidence still points to a late-stage private
      company with recurring IPO speculation but no public-listing evidence in
      this assigned pool.
    claimRefs: [CO008, CO009, CO010, CO011, CO015]
    figureRefs: [FO001]
  - id: "current-operating-signals-and-gaps"
    title: "Current operating signals and open diligence gaps"
    body: >-
      The freshest operational signal in the pool is not a financial filing but
      the October 2026 events calendar, which shows Vuori-branded classes and
      community activations across many U.S. stores, including Carlsbad,
      Seattle, Houston, Bellevue, and Washington Square. Combined with
      third-party commentary on omnichannel expansion, that supports a company
      that is still actively building brand-led retail engagement. The same
      sources also show where diligence remains weak: Top Consumer Reviews notes
      scattered complaints around returns and product quality, Wikipedia's
      public store count is dated to 2023, and current headcount is not
      independently verified because two non-primary sources cite materially
      different figures. The company also discloses sustainability ambition,
      but not enough audited operating metrics to settle revenue, customers, or
      present-day headcount from this pool alone.
    claimRefs: [CO012, CO013, CO014, CO016]
