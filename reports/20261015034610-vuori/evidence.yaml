evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: scale-disclosure
    missingEvidence: A current company-confirmed store count, headcount, customer count, and revenue/run-rate disclosure.
    whyItMatters: These are the cover metrics most likely to anchor valuation and operating-scale judgments later in the report.
    diligencePath: >-
      Request an updated company fact sheet or investor deck and reconcile it against payroll, store list, and
      commerce-system exports.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-coverage
    missingEvidence: A complete executive roster and board list with current titles, start dates, and reporting coverage.
    whyItMatters: >-
      Later operational diligence depends on knowing whether the visible bench is representative or only a public-facing
      subset.
    diligencePath: >-
      Obtain an org chart, board list, and recent executive biographies directly from the company or from diligence
      data-room materials.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: Current ownership percentages, tender recipients, liquidation terms, and investor governance rights.
    whyItMatters: >-
      The 2024 valuation headline is difficult to underwrite without knowing who sold, who bought, and what control
      rights changed.
    diligencePath: Request the latest cap table, shareholder agreements, board consents, and the 2024 tender materials.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Channel-level revenue mix, repeat-purchase, and geography disclosure sufficient to convert broad category
      estimates into a Vuori-specific SAM or SOM.
    whyItMatters: >-
      Without a company-specific served-market cut, the public evidence supports directional sizing lenses but not a
      defensible underwriting model for how much of those categories Vuori can actually capture.
    diligencePath: >-
      Request management reporting that breaks out DTC, stores, wholesale, and international revenue plus cohort
      behavior by major customer segment and geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: basket-size-estimates
    missingEvidence: >-
      Direct company disclosure or audited channel analytics that reconcile third-party average-ticket estimates of
      roughly $185 versus $214.
    whyItMatters: >-
      Basket size affects assumptions about pricing power, store productivity, and how much growth can come from deeper
      wallet share versus new-customer acquisition.
    diligencePath: Request internal AOV and units-per-order data by channel, plus the definitions behind each external estimate.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: rival-pricing-and-scale
    missingEvidence: >-
      Direct rival storefront pricing, funding history, and retention or productivity disclosures for Lululemon, Nike,
      Under Armour, Alo Yoga, Rhone, Set Active, and Outdoor Voices.
    whyItMatters: >-
      Without direct rival evidence, the comparison tables can establish category structure and buyer tradeoffs but
      cannot normalize realized pricing or operating scale across named peers.
    diligencePath: >-
      Collect assigned-pool-compliant direct rival storefront, filing, or investor-document evidence in a future pass
      before making harder claims about relative pricing power or scale.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: channel-economics-and-retention
    missingEvidence: >-
      Channel-level conversion, repeat purchase, wholesale economics, and store productivity data for Vuori and named
      rivals.
    whyItMatters: >-
      Distribution durability and switching-cost analysis are much stronger with repeat-rate and store-level economics
      than with marketing descriptions and customer-service cues alone.
    diligencePath: >-
      Request cohort retention, store productivity, and channel mix disclosures from management or obtain
      public-company-style segment reporting for closer peers.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: material
    topic: channel-unit-economics
    missingEvidence: >-
      Channel-level gross margin, CAC, payback period, return rate, and fulfillment cost for DTC, owned retail, and
      wholesale.
    whyItMatters: >-
      Without channel economics, investors cannot test whether premium pricing really converts into durable contribution
      margin.
    diligencePath: Request FY2024-FY2025 channel P&Ls, cohort CAC/payback decks, and return-cost analyses from management.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: >-
      Current cash balance, burn or free cash flow, debt obligations, covenant headroom, and management's base-case
      runway view.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from store growth and brand strength alone; liquidity determines financing
      dependency and downside resilience.
    diligencePath: Obtain the latest balance sheet, cash-flow statement, debt schedule, and board runway materials.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited FY2024-FY2025 revenue, EBITDA, gross margin, revenue mix, and revenue-recognition policy.
    whyItMatters: >-
      Public traction proxies cannot substitute for audited revenue quality when assessing scalability, margin path, or
      valuation support.
    diligencePath: Request audited or reviewed financial statements plus management reporting on channel mix and revenue recognition.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: minor
    topic: supplier-concentration
    missingEvidence: >-
      Factory concentration, audit pass rates, country-of-origin mix, and tariff or forced-labor contingency
      disclosures.
    whyItMatters: Supply-chain concentration can shape gross margin volatility, working-capital needs, and regulatory exposure.
    diligencePath: Request supplier concentration schedules, third-party audit summaries, and trade-compliance monitoring materials.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: internal-systems
    missingEvidence: >-
      Public evidence does not disclose the OMS inventory planning personalization or fulfillment systems that support
      localized merchandising and omnichannel execution.
    whyItMatters: >-
      Without the underlying systems stack it is hard to judge whether current product breadth and store expansion are
      operationally repeatable.
    diligencePath: >-
      Request a product-and-operations architecture walkthrough covering commerce platform OMS WMS forecasting and
      localization workflows.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: supplier-depth
    missingEvidence: >-
      Public materials do not disclose factory concentration below tier 1, third-party audit coverage, or remediation
      performance for supplier issues.
    whyItMatters: >-
      Product quality and geopolitical resilience depend on more than a published code of conduct when the store and
      international footprint is scaling quickly.
    diligencePath: >-
      Request the supplier map by country plus third-party audit cadence, corrective-action history, and concentration
      thresholds.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Exact repeat-purchase, churn, customer count, and cohort retention metrics by geography and channel.
    whyItMatters: These metrics determine whether Vuori's acquisition proof converts into durable customer economics.
    diligencePath: >-
      Request cohort retention, repeat-order frequency, return-rate, and customer-service data by DTC, store, and
      wholesale channels.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Channel mix, wholesale concentration, and any top-partner dependence disclosures.
    whyItMatters: Omnichannel reach can still mask dependence on a small number of retail or paid-media partners.
    diligencePath: >-
      Ask management for channel revenue split, top wholesale accounts, and any customer or partner concentration
      thresholds.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Public end-customer references or case studies that show real usage, outcomes, and freshness beyond channel
      partners.
    whyItMatters: Named customer proof distinguishes broad brand awareness from verifiable adoption and repeat use.
    diligencePath: >-
      Collect customer testimonials, wholesale sell-through case studies, or third-party review-volume data tied to
      named products or cohorts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: factory-audit-coverage
    missingEvidence: >-
      Factory list, country-level production mix, audit cadence, corrective-action history, and forced-labor screening
      below tier 1.
    whyItMatters: >-
      The public source set shows policy language but not enough operating proof to underwrite supply-chain resilience
      or compliance quality.
    diligencePath: Request the current factory map, third-party audit summaries, and import-compliance controls by sourcing country.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: store-economics
    missingEvidence: Store cohort payback, same-store sales, four-wall margins, and new-market productivity by geography.
    whyItMatters: >-
      Vuori's path from strong niche brand to 100+ stores can destroy value if store economics deteriorate outside its
      affluent core customer base.
    diligencePath: >-
      Obtain store cohort tables, market-entry assumptions, and the post-opening productivity curve for recent classes
      of stores.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR007
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: litigation-status
    missingEvidence: >-
      Court docket status, remediation actions, and any settlement, dismissal, or consent terms related to the
      accessibility complaint.
    whyItMatters: >-
      The current source documents the allegation but does not show whether the issue was remediated, dismissed, or
      expanded.
    diligencePath: >-
      Pull the case docket and management's remediation memo, then confirm current site accessibility controls with
      independent testing.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: service-and-quality-metrics
    missingEvidence: Return-rate, defect-rate, customer-service response-time, and satisfaction metrics by channel and geography.
    whyItMatters: >-
      A premium brand that markets happiness and free returns is unusually exposed to small changes in service quality
      and product durability.
    diligencePath: Request returns and complaints dashboards, defect tracking, and NPS or CSAT trends for the last eight quarters.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: disclosure-gap
    missingEvidence: >-
      Current audited revenue, gross margin, EBITDA, and cash-flow disclosure for the most recent fiscal year and
      trailing period.
    whyItMatters: The recommendation is price-sensitive, and public valuation support is weak without audited operating performance.
    diligencePath: >-
      Request audited financial statements or lender-grade board materials covering revenue, margins, EBITDA, and cash
      generation.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: >-
      Detailed 2024 tender waterfall, transfer restrictions, employee versus investor liquidity split, and any current
      secondary clearing price.
    whyItMatters: Headline valuation without term detail can materially overstate common-share attractiveness for a new investor.
    diligencePath: Obtain the tender memorandum, cap table, and any broker or company-approved secondary transaction summaries.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: channel-economics
    missingEvidence: >-
      Channel-level retention, return-rate, and contribution-margin evidence across e-commerce, wholesale, and
      international stores.
    whyItMatters: Scenario confidence depends on whether brand expansion preserves economics instead of simply increasing footprint.
    diligencePath: >-
      Request cohort and channel dashboards with repeat purchase, return-rate, CAC payback, and store four-wall margin
      data.
    relatedQuestionRefs:
      - QV008
