        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              Octane 可观察到的变现首先来自消费者分期贷款：公开网站展示即时融资、软信用查询流程，以及分别面向优质借款人、信用重建和首次购房者的项目；较早的官方材料则展示了嵌入 OEM
              的预审流程，将合格购物者导入经销商。较新的 Forest River 项目把同一套能力延伸到制造商品牌专属融资，由 Roadrunner
