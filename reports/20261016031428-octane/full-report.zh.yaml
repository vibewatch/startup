  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 指定资料池中有最直接证据支持的竞争者类别序位图。
    data:
      xAxis:
        label: 经销商 / OEM 分销控制力
        min: 1
        max: 5
        low: 轻度渠道控制
        high: 深度嵌入渠道控制
        description: Evidence-backed ordinal score derived from source-described dealer, OEM, or workflow integration.
        scale: 1-5 ordinal
      yAxis:
        label: 全栈融资范围
        min: 1
        max: 5
        low: 狭窄融资环节
        high: 覆盖工作流、授信、服务和品牌项目的广泛全栈
        description: Evidence-backed ordinal score derived from the breadth of functions explicitly described in the assigned pool.
        scale: 1-5 ordinal
      points:
        - label: Octane
          x: 5
          'y': 5
          note: 4,000+ 家经销商、60+ 个 OEM 品牌、消费者预资格、内部服务，以及 OEM 品牌专属金融项目。
          claimRefs:
            - CP002
            - CP005
            - CP012
            - CP013
        - label: RouteOne
          x: 4
          'y': 3
          note: 被描述为经销商金融平台和贷款机构路由网络，处理申请与融资决策。
          claimRefs:
            - CP008
            - CP014
        - label: Capital One Auto Finance
          x: 4
          'y': 4
          note: 被描述为大型汽车贷款机构，提供连接经销商的汽车融资。
          claimRefs:
            - CP008
            - CP014
        - label: Westlake Financial
          x: 4
          'y': 4
          note: 被描述为间接汽车贷款机构，尤其专注于次级和准优质客户的经销商融资。
          claimRefs:
            - CP008
            - CP014
        - label: Lendbuzz
          x: 3
          'y': 3
          note: 被描述为数据驱动的销售点消费者融资，面向信用记录有限的买家。
          claimRefs:
