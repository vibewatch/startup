              - CO015
      - number: '1.2'
        title: 领导层、治理与利益相关者集中度
        blocks:
          - type: paragraph
            body: >-
              相比 Octane 的规模，公开领导层披露相当有限。现有证据始终将 Jason Guss 列为联合创始人兼 CEO，Steven Fernald 为总裁兼 CFO，Mark Davidson 为联合创始人兼
              CRO，但没有完整董事会名单、委员会架构或更新后的股权结构表。控制权、清算优先权和继任梯队因此留下明显尽调盲点。公开记录也显示创始人影响力较集中：Guss
              仍是战略合作与公司定位的主要发言人，而外部资本及渠道关系集中在一小批反复合作的股权、银行和远期转让交易对手手中。
