              - CP010
              - CP011
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 能够支持的护城河是工作流深度，而非已证明的最低价格
            body: 综合现有证据，Octane 最有力的防守位置是经销商 / OEM 分销、品牌专属项目、服务和工作流工具的组合。同一批来源并未证明 Octane 主要靠透明的公开定价赢得客户。
