            body: >-
              Octane 的 2026 年证据基础从两个与估值相关的维度改善。第一，官方和独立来源称 2025 年放款额达到 21 亿美元，调整后 EBITDA 达到 8,000 万美元，GAAP
              盈利连续第三年保持。第二，2026 年公告显示累计放款额超过 90 亿美元，2026 年上半年放款额同比增长 37%。这些运营信号与更大的非稀释性资本渠道相配套：Nuveen 远期转让协议将承诺额度推高至 22
              亿美元以上，2026 年 10 月的融资安排又新增一笔 14 亿美元承诺。综合来看，这些事实支持 Octane 正以资本市场驱动的贷款机构身份扩张，而非依赖近期股权融资。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
