            body: 第三方竞争格局显示，经销商路由网络和大型间接汽车贷款机构已处于同一申请路由及经销商发起的融资工作流中。因此，即使 Octane 的休闲金融定位有所差异，竞争替代仍是现实的渠道风险。
            calloutType: risk
