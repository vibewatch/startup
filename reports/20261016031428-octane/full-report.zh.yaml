        title: 融资概览与规模质量
        blocks:
          - type: paragraph
            body: >-
              开源融资与业绩数据方向上很强，但尚未完全核对。Octane 2025 年 12 月的 F 轮和 2026 年 10 月的远期转让公告，显示其仍能获得股权和结构化信贷；Multiples 与 2026 年 8
              月的资料页也支持以 2025 年末为基准的独角兽估值框架。不过，第三方来源对累计融资总额并不完全一致，同一批公开材料在引用盈利信号的同时，也提醒公开数字跨来源不一致。实际结论是：Octane
              获取机构资金的能力日益成熟，但投资人仍需公司核对累计融资、经审计财务数据和借款人信用指标。
