        title: 产品对比
        blocks:
          - type: paragraph
            body: >-
              Octane 的材料始终将公司呈现为不止于销售点贷款机构。主页强调即时报价、软查询预审，以及覆盖优质借款人到首次购房者的产品；合作公告又把这套能力延伸到 OEM
              品牌专属融资项目、经销商工作流工具、服务和营销支持。相比之下，第三方资料页点名的竞争者只覆盖更窄的环节，例如申请路由、数字汽车金融或间接贷款。能够稳妥支持的结论是：Octane
              依靠打包后的工作流广度竞争，而不只是依靠能否提供贷款。
