      - number: '8.3'
        title: 反方论点是透明度不足，而不是商业牵引力不足
        blocks:
          - type: paragraph
            body: >-
              不应仅凭公开信息积极评估公司的主要原因，是披露透明度不足。Auto Finance News 将 F
              轮描述为巩固资本并分散融资渠道的一环；估值取决于稳定接入债务市场的贷款机构，这一逻辑是成立的。更重要的是，2026 年 8 月的 SVIC
              资料称，公开数字跨来源不一致，且仅限于融资、估值、放款和盈利参考，同时明确表示完整股东登记册并未公开。公开记录没有完整呈现当前的优先股堆叠、稀释情况或贷款组合质量；上一轮披露的估值可能公平，但作为真实成交价信号仍不完整。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 哪些因素会改变建议
        blocks:
          - type: paragraph
            body: >-
              公开证据支持继续跟踪，但必须严格控制入场。更有把握的建议需要私下尽调核实当前信用表现、融资成本、仓储与远期转让条款，以及二级交易占比较高的 F
              轮之后准确的股权结构表经济性。若尽调确认盈利持久且不存在隐藏的优先权负担，上一轮公开估值相对于当前运营规模可能颇具吸引力；若损失、逾期或退出价值上的优先受偿权主张比公开记录显示的更差，同一个 13
              亿美元锚点就会显得过于慷慨。因此，估值判断既取决于增长，也同样取决于信息质量。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持有纪律地参与，而不是盲目接受价格
            body: Octane 的规模、盈利能力和融资广度都在改善，值得继续跟踪；但公开资料仍未充分揭示优先股堆叠或信用质量，不能凭信念为上一轮披露估值之上再支付溢价。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
          - type: callout
            title: 最大的估值折价来自信息质量
            body: 核心下行风险不是收入增长乏力，而是独立来源仍将公开估值数据描述为不完整且不一致，披露的只是估计稀释，而不是完整股权结构表和清算瀑布。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
