              - CM013
      - number: '2.2'
        title: 市场规模视角：类别集合很大，但公开拆分较弱
        blocks:
          - type: paragraph
            body: >-
              现有证据能支持的最强市场规模结论是：Octane 服务于一大组休闲金融类别，而不是公开来源已经清晰拆出了其 SAM 或 SOM。二手资料反复将这些服务类别描述为约 1,500
              亿美元的机会，这对界定边界有方向性帮助，但范围仍过宽，且部分为衍生估算，不能单独作为合格的尽调规模数据。更可靠的公开证据来自平台实际吞吐量：Octane 报告 2025 年放款额为 21 亿美元，随后称 2026
              年上半年放款额同比增长 37%，累计放款额超过 90 亿美元。这些数字显示出真实采用和放贷速度，但衡量的是公司交易量，而不是整个类别的支出。拖车细分市场的 50
              亿美元规模可作为更窄的相邻市场代理指标，但仍只是公司描述的单一视角，并非独立市场模型。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
