            body: >-
              刷新后的证据显示，公司持续在核心休闲贷款业务上叠加相邻垂直领域和融资能力。早期里程碑记录了业务从拖车扩展到更广泛的休闲金融，再进入数十亿美元放款规模；2024—2026
              年的信号则集中于扩大资本市场业务、专属融资项目和 OEM / 经销商战略关系。2026 年的变化尤其关键：Octane
              不再只是报告历史放款和股权轮次，还开始宣布大额远期转让额度及合作品牌融资项目，进一步巩固其嵌入式贷款机构、服务商和资本市场运营方的角色。
