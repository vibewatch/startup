      - number: '3.3'
        title: 转换成本与渠道力量
        blocks:
          - type: paragraph
            body: >-
              本批资料对护城河最有力的证据是分销集成。Forest River、BRP 和 Huntington / Scag 的材料都把 Octane 描述为品牌合作伙伴工作流的一部分，而不是外挂式消费贷款机构。Octane
              明确将 Captive-as-a-Service 定位为无需内部自建即可获得专属贷款机构好处的方式。“自行建设”仍是替代方案，但成本很高。若这些项目具有黏性，Octane 的优势来自 OEM
              与经销商工作流控制、自营服务和全生命周期营销支持，而非公开证明的最低价格。
            claimRefs:
              - CP005
              - CP007
              - CP012
              - CP013
      - number: '3.4'
        title: 持久性风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              支持 Octane
              广度的同一批证据，也显示出明显的替代风险。第三方竞争格局包含已经嵌入同一汽车信贷和经销商工作流的经销商路由网络及大型间接贷款机构；而泛化的“相似公司”数据库将同行集合扩张得过宽，已不再适合作为可靠的直接比较工具。同样重要的是，本批公开材料从未披露并列
              APR、商户费经济性、服务结果、投诉率或胜负数据。因此，投资人对定价权、信任状况以及相较资本更强竞争者的渠道锁定持久性，仍应保持谨慎。
            claimRefs:
