              网站预审，将合格购物者导入经销商交易流程。合作方托管的 Octane Marine
              申请表提供了具体部署证据：多步骤表单收集身份、住房、就业、收入、抵押物、首付和经销商交接信息，但公开证据没有披露完成率、审批率或转化率。
