      - number: '4.2'
        title: 资本市场引擎与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开材料中最有力的财务优势，是 Octane 能持续将融资资产移出资产负债表。2026 年官方和第三方来源称，公司累计放款额已超过 90 亿美元，ABS 发行额超过 50 亿美元，远期转让和整笔贷款承诺超过 63
              亿美元，其中包括 2026 年 10 月宣布的 14
              亿美元远期转让额度。这是有意义的流动性信号，但不等于手头现金或持久盈利：证据显示公司能接入融资渠道且有投资人需求，却没有披露留存经济性、仓储成本、债务契约，或在证券化及贷款出售市场转弱时的资产负债表容量。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
              - CI015
      - number: '4.3'
        title: 单位经济与承保缺口
        blocks:
          - type: paragraph
            body: >-
              公开财务快照仍不足以完成全面投资评估。独立数据库重复给出 2025 年约 4 亿美元收入和约 8,000 万美元调整后
              EBITDA，但这些数字没有对应经审计报表，第三方融资数据集甚至对累计融资及部分轮次金额存在分歧。更重要的是，现有来源明确警告公开数据有限，因此毛利率、获客成本 /
              回收期、服务盈利能力、出售收益率、逾期与核销批次、客户集中度和现金跑道都没有得到支持。财务结论因此是：增长和融资渠道方向积极，但收入质量、损失吸收能力和利润率持久性仍不完整。
