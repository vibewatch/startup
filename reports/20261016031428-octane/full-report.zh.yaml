  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：特色消费金融，而非一般消费贷款
        blocks:
          - type: paragraph
            body: >-
              Octane 的市场边界更多由购买流程界定，而不是由单一产品类别界定。公司围绕经销商和 OEM
              销售的大额休闲及户外资产展开业务，包括动力运动车辆、房车、船舶产品、户外动力设备，以及拖车等相邻类别。现有来源反复呈现的是销售点或交易前融资，而非广泛的无担保信贷、大范围汽车金融或无关的售后服务。这个区别很重要，因为
              Octane 的差异化依赖经销商集成、预审和全生命周期融资项目，而不只是提供消费贷款。拖车业务上线材料也说明了相邻市场的意义：公司明确进入一个被其描述为现金交易驱动、运营分散的细分市场，说明 Octane
              瞄准的是融资摩擦能够改变转化率的领域，而不只是为本已高效的贷款再融资。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
