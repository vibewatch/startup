chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、业务版图与运营模式
        blocks:
          - type: paragraph
            body: >-
              Octane 将自己定位为总部位于纽约的金融科技贷款机构和软件平台，而非纯粹的线索生成商。公司与第三方来源对其当前身份的描述基本一致：Octane Lending, Inc. 成立于 2014
              年，在纽约运营，并通过 Roadrunner 旗下实体开展放贷、服务和专属融资业务。其模式把消费者预审、经销商工作流软件、承保和资本市场融资串在一起，因此后续尽调应同时把 Octane
              看作技术供应商和拥有资产负债表能力的特色贷款机构。规模信号很强，但主要来自公司自述：Octane 称其服务 80 个 OEM 品牌、4,000 多家经销商，并拥有 600 多名员工；公开证据没有披露活跃借款人数。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
