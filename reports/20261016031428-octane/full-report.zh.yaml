      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 牛市
        - 2026 年增长持续高于已披露的上半年 37% 速度，融资渠道继续拓宽，且非公开尽调确认不存在隐藏的优先权负担。
        - 过时的 $1.3B 估值会显得有吸引力，因为运营规模届时已超过上一公开股权价格所反映的水平。
        - 信贷环境正常化或投资者撤退，仍可能限制上行空间。
        - 需要第三方重新确认当前收入、利润率和资产组合质量。
      - - 基准
        - 增长保持健康、盈利能力延续，债务市场融资渠道保持开放，但没有新的定价融资轮，也没有股权结构表透明度提升。
        - 上次披露的估值足以继续跟踪，但还不足以支撑追逐高于市场的定价。
        - 不透明的清算优先权和不完整的损失数据，使信心维持在中等水平。
        - 与现有公开证据最相符。
      - - 熊市
        - 消费者需求转弱，ABS 或远期转让利差扩大，或隐藏的高级债权经济利益压低普通股价值。
        - 定价过时且披露不完整的贷款机构，可能应获得低于上一公开估值的倍数。
        - 由于公开证据没有揭示完整瀑布结构或当前信用表现，下行风险会被放大。
        - 融资渠道转弱、信用表现出现负面意外，或下行轮 / 内部估值会发出信号。
    notes: 情景分析是定性的，因为指定公开资料池没有披露当前定价融资轮、完整股权结构表或经审计的信用损失指标。
    claimRefs:
