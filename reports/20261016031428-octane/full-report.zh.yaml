  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              现有资料不足以支持“一个直接对手”的狭窄框架。第三方资料和数据库将 Octane 与连接经销商的汽车贷款机构、经销商工作流平台及更广泛的金融科技信贷产品放在一起；Octane
              自身材料则显示其已进入动力运动、房车、船舶、户外动力设备及相邻品牌融资项目。因此，真实替代集合包括数字直接贷款机构、传统间接汽车金融供应商、经销商路由层，以及 OEM
              或银行自行运营品牌专属融资项目而非外包整套能力的选项。
