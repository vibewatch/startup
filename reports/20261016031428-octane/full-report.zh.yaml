  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持这样一条融资工作流：从获客开始，最终由资本市场渠道服务并循环利用 Roadrunner 发起的资产。
    data:
      nodes:
        - id: leads
          label: 消费者与 OEM / 经销商线索获取
          detail: OEM 网站、经销商渠道和 Octane 购物流程汇入需求
        - id: prequal
          label: 软查询预资格
          detail: 展示实际利率和还款额，且不触发硬查询
        - id: underwrite
          label: Roadrunner 授信
          detail: 优质客户、信用建立和首次购车者项目都在此环节
        - id: close
          label: 经销商成交与文件处理
          detail: 融资嵌入销售点购买流程
        - id: service
          label: 服务与生命周期运营
          detail: Roadrunner Account Services 为品牌项目处理服务
        - id: fund
          label: 远期转让、整笔贷款出售与 ABS 执行
          detail: 2026 年公开来源提到已发行 >$5B ABS，且已出售或承诺 >$6.3B
      edges:
        - from: leads
          to: prequal
          label: 合格买家进入融资流程
        - from: prequal
          to: underwrite
          label: 信用决策与贷款结构设计
        - from: underwrite
          to: close
          label: 经销商完成交易
        - from: close
          to: service
          label: 贷款进入服务生命周期
        - from: service
          to: fund
          label: 应收款通过资本市场变现或再融资
    approximationNotes: 这是结构性流程，不是价值瀑布；公开来源没有披露转化率、费率或各步骤经济效益。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI007
      - CI008
  - id: FE001
    title: 受证据约束的产品架构图
    type: stack
    summary: 已披露的运营栈从买家获客，逐步延伸到合作伙伴分销、信贷运营、服务和资金筹措。
    data:
      layers:
        - label: 买家获客
          items:
            - 即时融资报价
            - 软查询利率检查
          modules:
            - 消费者网页体验
          outputs:
            - 获得预资格的买家
        - label: OEM 与经销商分销
          items:
            - OEM 网站预资格
            - 经销商交易交接
          modules:
            - 预资格工具
            - Dealer Portal 2.0
          outputs:
            - 合格经销商线索
        - label: 品牌专属金融项目
          items:
            - 制造商支持的融资
            - 合作伙伴品牌客户旅程
          modules:
            - Captive-as-a-Service
          outputs:
            - OEM 品牌融资项目
        - label: 信贷运营
          items:
            - 授信
            - 贷款处理
          modules:
            - Roadrunner Financial
          outputs:
            - 发起的分期贷款
        - label: 服务与合规
          items:
            - 端到端服务
            - 合规流程
          modules:
            - Roadrunner Account Services
          outputs:
            - 管理中的借款人账户
        - label: 资金与规模化
          items:
            - RV 与船舶 ABS
            - 贷款出售渠道
          modules:
            - 资本市场执行
          outputs:
            - 支持新增发放的流动性
    approximationNotes: 分层顺序是受证据约束的运营模型综合，而不是已披露的系统图；不意味着存在未披露的软件基础设施或控制认证。
    claimRefs:
      - CE003
      - CE010
      - CE011
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，Octane 覆盖需求生成、经销商工作流、OEM 品牌项目和成交后服务，而不是只参与单一的放贷环节。
    data:
      nodes:
        - label: 需求创造
          touchpoints:
            - Customer acquisition tools on OEM and dealer surfaces
            - Prequalification before dealership visit
        - label: 即时预资格
          touchpoints:
            - Soft credit pull with real rates and payments
            - Consumer knows financing options before shopping
        - label: 经销商工作流
          touchpoints:
            - Dealer portal manages terms, documentation, and closing
            - Scag dealerships use a single platform from prequalification through closing
        - label: OEM 品牌专属金融项目
          touchpoints:
            - BRP Financial Services uses Captive-as-a-Service under the OEM brand
            - Forest River Finance launches across a broad RV portfolio
        - label: 贷款服务
          touchpoints:
            - Mobile wallet and guest payments support account management
            - Borrowers receive reminders and self-service payment options
        - label: 扩张循环
          touchpoints:
            - Lifecycle marketing and repeat-purchase support
            - New vertical entry into RV, OPE, trailers, and adjacent markets
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在指定资料池中，资金依赖和运营规模增长超过控制层面披露的地方，剩余风险最严重。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 资本市场续作
          values:
            - label: 高
              detail: 远期转让、整笔贷款和 ABS 执行仍是该模型的核心。
            - label: 高
              detail: 融资工具续期或 ABS 执行转弱，会挤压流动性和发放额。
            - label: 中
              detail: 多个交易对手有帮助，但契约和续期细节在此处并未公开。
        - label: 监管 / 牌照不透明
          values:
            - label: 中
              detail: 放贷和服务业务均在开展，但没有展示完整的州覆盖范围和检查历史。
            - label: 高
              detail: 牌照或行为问题可能同时影响发放、服务和合作伙伴项目。
            - label: 低
              detail: 指定来源没有披露相匹配的控制文件包。
        - label: OEM / 合作伙伴集中度
          values:
            - label: 中高
              detail: 已披露大型 OEM 项目和合作伙伴数量，但没有披露集中度。
            - label: 高
              detail: 主要合作伙伴受挫，可能打击分销增长和品牌可信度。
            - label: 中
              detail: 网络广度有帮助，但缺少结构数据。
        - label: 发布 / 服务执行
          values:
            - label: 中
              detail: 2026 年的项目上线增加了授信、服务和经销商支持的运营负担。
            - label: 高
              detail: 执行失败会动摇即时决策和无缝购车承诺。
            - label: 中
              detail: 交钥匙平台的说法暗示流程已较成熟，但没有披露上线 KPI。
        - label: 信贷周期恶化
          values:
            - label: 中
              detail: 广泛的信贷覆盖和增长，需要稳定的损失表现来避免逆向选择。
            - label: 高
              detail: 资产表现转弱，会同时打击资金方意愿和单位经济效益。
            - label: 中
              detail: 投资者反复支持有帮助，但缺少公开的贷款层面指标。
        - label: 安全 / 隐私透明度缺口
          values:
            - label: 中
              detail: 公司处理融资申请和服务数据，但此处没有公开控制细节。
            - label: 中高
              detail: 严重事件会损害经销商、借款人和资本合作伙伴的信任。
            - label: 低
              detail: 指定来源没有披露认证、事件历史或信任中心细节。
    approximationNotes: 定性评分是分析师根据引用证据和明确披露缺口作出的综合判断，而不是公司发布的风险评级。
    claimRefs:
      - CR007
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论建立在已验证的增长和盈利能力之上，经过更大的融资能力，落到一个虽已过时但仍可辩护的估值锚点；披露不透明使该锚点应打折。
    data:
      nodes:
        - id: proof
          label: 2025 年验证点
          note: 发放额达到 $2.1B，EBITDA 达到 $80M，且盈利能力延续。
          claimRefs:
            - CV004
            - CV005
            - CV006
        - id: scale
          label: 2026 年势头
          note: 历史累计发放额超过 $9B，2026 年上半年发放额同比增长 37%。
          claimRefs:
            - CV007
            - CV008
        - id: funding
          label: 融资广度
          note: Nuveen 的 $350M 融资额度和后续 $1.4B 融资工具，降低了短期对股权融资的依赖。
          claimRefs:
            - CV009
            - CV010
            - CV011
        - id: anchor
          label: 上次公开股权估值
          note: Series F 设定了 $1.3B 的投后估值锚点；Multiples.vc 根据 2025 年 9 月收入推算收入倍数约为 3.3x。
          claimRefs:
            - CV001
            - CV002
            - CV003
        - id: frictions
          label: 仍阻碍形成确信的因素
          note: 公开来源没有展示完整的股东名册、清算层级或当前信用质量细节。
          claimRefs:
            - CV012
            - CV013
            - CV014
            - CV015
        - id: decision
          label: 建议
          note: 保持跟踪并纪律性地寻找入场点，而不是仅凭公开证据判断估值可以上调。
          claimRefs:
            - CV016
      edges:
        - from: proof
          to: scale
        - from: scale
          to: funding
        - from: funding
          to: anchor
        - from: anchor
          to: frictions
        - from: frictions
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
