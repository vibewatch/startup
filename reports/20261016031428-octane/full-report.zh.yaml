        blocks:
          - type: paragraph
            body: >-
              Octane 当前模式紧密依赖内部受监管实体和外部资本提供方。公司发布的合作方材料显示，Roadrunner Financial 为品牌合作贷款项目承保，Roadrunner Account Services
              为这些贷款提供服务，放贷、服务和消费者披露风险因此集中在同一运营体系内。同时，2026 年融资公告表明 Octane
              依靠反复执行远期转让、整笔贷款转让和证券化来维持扩张。这种多元化有帮助，但仍是资本市场渠道内部的多元化，并不能证明当保险买方、ABS
              投资者或评级环境转坏时，放款仍能维持。本批资料中最重要的法律和监管问题并非已披露的执法行动，而是被审阅来源没有核实州级牌照矩阵、检查历史、隐私控制或契约结构，投资人因而无法清晰限定下行风险。
