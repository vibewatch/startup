      - number: '2.3'
        title: 买方图谱、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              Octane 的采用路径贯穿多边渠道。终端借款人希望即时看到利率并获得更广泛的信贷准入；经销商希望提高成交率并简化融资流程；OEM
              希望拥有品牌化融资项目而无需自建专属贷款机构；资本合作方则希望获得差异化的消费信贷资产。这一结构解释了公司近期向房车和户外动力设备扩张：Captive-as-a-Service 与联合放贷项目把 Octane
              从纯粹贷款机构变成嵌入式金融基础设施。但同一结构也带来约束。需求取决于可选消费，部分相邻类别仍由现金交易驱动，持续增长还依赖仓储融资、整笔贷款转让和 ABS
              融资渠道保持开放。由于本批公开记录没有披露独立的分部份额、审批漏斗或各垂直领域的损失曲线，估值应更多权衡执行力和资本连续性，而不是只看醒目的 TAM 叙事。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 估值更取决于执行和资本连续性，而非醒目的 TAM
            body: >-
              现有证据支持一个真实且正在扩张、渠道契合度很高的细分市场，但不能独立证明清晰的 SAM 或持久的市场份额曲线。投资人应把 Octane 当作经销商 / OEM
              金融基础设施故事来评估，同时要求其补足渗透率、融资韧性和信用表现的分部级证据。
            calloutType: risk
            claimRefs:
