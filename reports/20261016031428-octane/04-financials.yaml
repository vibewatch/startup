schemaVersion: report-v2
artifact: financials
slug: octane
runDate: 2026-10-16
company:
  name: Octane
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence shows a strong financing engine built on consumer lending,
    OEM/dealer distribution, and repeated capital-markets execution, but not a
    fully underwritable income statement. Octane's 2026 disclosures emphasize
    origination growth, ABS issuance, and forward-flow capacity, while realized
    pricing, margin structure, credit losses, cash runway, and covenant headroom
    remain undisclosed.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: >-
      Octane's observable monetization starts with consumer installment lending:
      the public website shows instant financing, a soft-credit-pull flow, and
      separate prime, credit builder, and first-time buyer programs, while older
      official materials show OEM-embedded prequalification that routes qualified
      shoppers into dealerships. The newer Forest River program extends that
      same stack into manufacturer-branded captive finance, with Roadrunner as
      the underwriter and servicer. What remains missing is the money layer:
      list pricing is described only qualitatively as competitive rates,
      promotional financing, and flexible terms, so the public record supports
      distribution breadth and product structure, but not realized APRs,
      partner subsidies, take rates, or fee capture by stream.
    claimRefs: [CI001, CI002, CI003, CI004, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-markets-engine-and-funding-dependency
    title: Capital-markets engine and funding dependency
    body: >-
      The best-supported financial strength in public materials is Octane's
      ability to keep financing assets moving off balance sheet. Official and
      third-party 2026 sources say the company had surpassed $9 billion of
      all-time originations, more than $5 billion of ABS issuance, and more
      than $6.3 billion of forward-flow and whole-loan commitments, including
      a $1.4 billion forward-flow facility announced in October 2026. That is a
      meaningful liquidity signal, but not the same thing as cash on hand or
      durable profitability: the evidence shows access to funding channels and
      investor demand, yet it does not disclose retained economics, warehouse
      costs, debt covenants, or balance-sheet capacity if securitization or loan
      sale markets weaken.
    claimRefs: [CI005, CI006, CI007, CI008, CI011, CI012, CI015]
  - id: unit-economics-and-underwriting-gaps
    title: Unit economics and underwriting gaps
    body: >-
      The public financial snapshot is still too thin for full underwriting.
      Independent databases repeat a roughly $400 million 2025 revenue figure
      and about $80 million of adjusted EBITDA, but those numbers are not tied
      to audited statements, and even third-party funding datasets disagree on
      total capital raised and certain round amounts. More importantly, the
      available sources explicitly warn that public figures are limited, leaving
      gross margin, CAC/payback, servicing profitability, gain-on-sale margin,
      delinquency and charge-off vintages, customer concentration, and runway
      unsupported. The financial verdict is therefore directionally positive on
      growth and funding access, but incomplete on revenue quality, loss
      absorption, and margin durability.
    claimRefs: [CI009, CI010, CI013, CI014, CI015]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Consumer installment lending
        - Roadrunner-originated retail loans at point of sale
        - Financed purchase / loan
        - Active across powersports, RV, marine, OPE, and trailers
        - Strong mechanism evidence; realized yield undisclosed
        - Provide APR/yield mix, approval mix, and net interest economics by product
      - - Captive-as-a-Service programs
        - White-label manufacturer-backed finance programs using Octane underwriting, servicing, and compliance stack
        - OEM / dealer program
        - Active in RV and other verticals; Forest River launched for Oct 2026
        - Company-described model; partner economics undisclosed
        - Provide revenue share, minimum volume, subsidy, and servicing-fee terms by partner
      - - Dealer/OEM software and lead generation
        - Embedded prequalification, dealer portal workflow, and customer acquisition tools
        - Dealer / OEM relationship
        - Publicly visible offering, but no standalone pricing shown
        - Mechanism observed; monetization unclear
        - Clarify which software/services are bundled versus separately billed
      - - Capital-markets monetization
        - ABS issuance, forward-flow, and whole-loan sales that recycle funded receivables
        - Loan principal sold / notes issued
        - More than $5B ABS issued; more than $6.3B sold or committed through forward-flow and whole-loan channels
        - Well corroborated on volume; accounting treatment undisclosed
        - Provide gain-on-sale, servicing strip, warehouse spread, and retained-interest economics
    notes: >-
      Public sources support the existence and scale of each stream, but not the
      realized pricing, revenue recognition policy, or margin contribution by stream.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI007, CI008, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Consumer financing offers
        - Competitive rates and flexible terms; exact APR schedule not public
        - List marketing only; realized pricing not disclosed
        - Promotional financing may be OEM-subsidized, but subsidy mechanics are undisclosed
        - Official homepage plus Forest River program materials
      - - Soft-pull prequalification
        - No-impact credit prequalification flow
        - Feature is public; fee model not public
        - No disclosed pricing to dealers or consumers
        - Official homepage and historical dealer/OEM workflow description
      - - Captive-as-a-Service OEM programs
        - Manufacturer-branded financing with underwriting, servicing, and compliance included
        - Productized publicly; commercial pricing not disclosed
        - Unknown setup fees, rev-share, or minimum-volume commitments
        - Forest River and Octane growth-archive materials
      - - Dealer/OEM sales and marketing support
        - Sales/marketing resources and digital-retail enablement
        - Value proposition public; billing model not public
        - Unknown whether billed directly, embedded in financing economics, or both
        - Historical trailer-market and current partner materials
    notes: >-
      This table intentionally separates public feature claims from missing realized
      economics; no public source discloses APR bands, partner fee schedules, or take rates.
    claimRefs: [CI001, CI002, CI003, CI004, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue
        - "~$400M for 2025 per Multiples; unaudited secondary data"
        - Medium
        - Size anchors underwriting only if revenue quality and recognition are understood
        - Reconcile audited GAAP revenue, net revenue, and revenue mix by stream
      - - Adjusted EBITDA
        - "~$80M for 2025 per third-party profiles; unaudited"
        - Medium
        - Profitability claim matters for self-funding capacity and next-round need
        - Provide audited EBITDA bridge, GAAP operating income, and cash-from-operations
      - - Gross margin / net interest margin
        - null
        - Low
        - Lending businesses can grow originations while destroying spread economics
        - Provide yield, funding cost, servicing cost, and credit-cost bridge by product
      - - CAC / payback / dealer acquisition cost
        - null
        - Low
        - GTM efficiency determines whether growth is scalable without new equity
        - Provide blended CAC, dealer activation cost, marketing payback, and cohort retention
      - - Credit performance
        - null
        - Low
        - Delinquency, charge-off, and recovery curves drive true unit economics
        - Provide vintage-level 30/60/90+, net charge-off, and recovery data by channel
      - - Cash / runway / covenant headroom
        - null
        - Low
        - Capital adequacy cannot be inferred from fundraising history or securitization volume
        - Provide cash balance, warehouse capacity, covenant tests, and downside liquidity plan
    notes: >-
      Nulls are evidence gaps, not zeros. Public materials emphasize origination
      and capital-markets scale but do not disclose the operating and credit metrics
      required for full lending-model underwriting.
    claimRefs: [CI006, CI009, CI010, CI012, CI013, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a financing workflow that starts with shopper
      acquisition and ends with Roadrunner-originated assets being serviced and
      recycled through capital-markets channels.
    data:
      nodes:
        - id: leads
          label: Consumer and OEM/dealer lead capture
          detail: OEM sites, dealer channels, and Octane shopping flows feed demand
        - id: prequal
          label: Soft-pull prequalification
          detail: Real rates and payments are shown without a hard-credit hit
        - id: underwrite
          label: Roadrunner underwriting
          detail: Prime, credit builder, and first-time buyer programs sit here
        - id: close
          label: Dealer closing and documentation
          detail: Financing is integrated into the point-of-sale purchase flow
        - id: service
          label: Servicing and lifecycle engagement
          detail: Roadrunner Account Services handles servicing for branded programs
        - id: fund
          label: Forward-flow, whole-loan sale, and ABS execution
          detail: Public 2026 sources cite >$5B ABS issued and >$6.3B sold or committed
      edges:
        - from: leads
          to: prequal
          label: Qualified shopper enters financing flow
        - from: prequal
          to: underwrite
          label: Credit decision and loan structuring
        - from: underwrite
          to: close
          label: Dealer finalizes transaction
        - from: close
          to: service
          label: Loan enters servicing lifecycle
        - from: service
          to: fund
          label: Receivable monetized or refinanced through capital markets
    approximationNotes: >-
      This is a structural flow, not a value waterfall; public sources do not
      disclose conversion rates, take rates, or per-step economics.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI007, CI008]
callouts:
  - calloutType: risk
    title: Public materials do not yet clear the lending-underwrite bar
    body: >-
      Octane's public footprint is strong on origination growth and funding
      access, but a lender can look healthy on those outputs while still hiding
      weak margin capture or deteriorating credit performance. Without audited
      revenue recognition, spread economics, loss vintages, and liquidity
      headroom, the financial case is directionally positive but still diligence-bound.
    claimRefs: [CI008, CI009, CI010, CI012, CI015]
