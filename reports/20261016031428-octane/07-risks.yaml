        - Medium
        - High
        - Medium
        - High
        - Loan-level delinquency, charge-off, and vintage performance are not in the assigned pool.
      - - Launch and onboarding breakdown in new OEM captive programs
        - Forest River and other 2026 partner launches require Octane to execute financing tech, underwriting, servicing, and dealer support under partner brands.
        - Medium
        - High
        - Medium
        - Medium-High
        - No public implementation KPIs, rollout error rates, or dealer-support metrics are surfaced here.
      - - Servicing or workflow failure against the instant-decision promise
        - The homepage markets instant offers, soft pulls, and lightning-fast decisions as core product commitments.
        - Medium
        - Medium-High
        - Medium
        - Medium
        - No uptime, SLA, complaint, or response-time disclosure appears in the assigned pool.
      - - Security and privacy transparency gap
        - The assigned sources do not surface trust-center, certification, incident, or privacy-control detail despite Octane handling financing applications and servicing.
        - Medium
        - Medium-High
        - Low
        - Medium-High
        - Need SOC or equivalent controls, incident history, vendor map, and data-retention practices.
    notes: Missing public control disclosures keep mitigation-maturity scoring conservative even where growth evidence is strong.
