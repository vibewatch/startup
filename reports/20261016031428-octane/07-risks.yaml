      - CR011
      - CR012
      - CR014
      - CR016
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Forward-flow and private-credit capital
        - Nuveen and the insurer syndicate named in 2026 forward-flow deals
        - Loan funding and balance-sheet recycling
        - Not publicly quantified by counterparty
        - Facility renewal slows or investor appetite weakens, constraining originations and liquidity planning.
        - High
        - Multiple facilities, repeat investors, and ABS issuance diversify counterparties inside the same channel.
        - High
      - - Securitization investor base
        - ABS investors and rating-sensitive funding markets
        - Term funding and distribution for originated loans
        - Broadening investor base, but market access remains essential
        - Spread widening or weak execution raises funding costs and reduces strategic flexibility.
        - High
        - Repeat issuance and multiple bookrunners show execution capability.
        - Medium-High
      - - Large OEM captive launches
        - Forest River and other 2026 OEM programs
        - Distribution growth, brand leverage, and partner-branded finance
        - OEM-level exposure undisclosed
        - A troubled launch or program underperformance hurts volume, brand credibility, and dealer confidence.
        - Medium-High
        - Captive-as-a-Service bundles underwriting, servicing, compliance, and marketing support.
        - Medium-High
      - - Dealer and OEM network concentration
        - 4,000+ dealers and 60-80 OEM brands cited across company and market-data sources
        - Origination funnel and partner acquisition
        - Concentration not disclosed
        - A small number of dealers or brands could dominate originations without public visibility.
        - Medium-High
        - Network breadth suggests some diversification, but mix data is missing.
        - Medium-High
    notes: Counterparty concentration is ranked from disclosed funding and distribution dependencies; exact share-of-volume data is missing.
    claimRefs:
