    title: Regulatory / legal risk register
    columns:
      - Risk
      - Evidence
      - Jurisdiction / status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - State lending and servicing license opacity
        - Partner materials identify Roadrunner Financial and Roadrunner Account Services with NMLS IDs, but the assigned pool does not provide a state-by-state license matrix or exam history.
        - Multi-state U.S. lending and servicing footprint; public coverage incomplete in this pool
        - Medium
        - High
        - Centralized in-house lender and servicer create a single accountable control stack.
        - High
        - Request current state license map, regulator exam summaries, and any remediation plans for Roadrunner entities.
      - - Capital-markets documentation and offering risk
        - 2025-2026 ABS and forward-flow activity depends on private-offering execution, ratings, and institutional buyers.
        - Active U.S. private credit / ABS program
        - Medium
        - High
        - Octane has repeat issuance history, named structuring agents, and multiple capital partners.
        - Medium-High
        - Review warehouse, forward-flow, and ABS covenants; inspect rating surveillance and early-amortization triggers.
      - - Partner-brand consumer disclosure and servicing conduct risk
        - Forest River Finance is offered solely by Roadrunner Financial under a partner brand while Roadrunner Account Services handles servicing.
        - Active 2026 partner-branded program structure
        - Medium
        - Medium-High
        - Program terms, servicing, and compliance sit inside Octane's captive-finance stack.
        - Medium-High
        - Review partner-brand disclosures, complaint taxonomy, UDAAP controls, and servicing scripts for OEM-branded programs.
    notes: Severity reflects analyst ranking from cited structure and disclosure gaps, not disclosed company scoring.
    enumerationScope:
      coverage: partial
      basis: Covers the highest-severity legal and regulatory exposures surfaced in the assigned public evidence set through 2026-10-16.
    claimRefs:
