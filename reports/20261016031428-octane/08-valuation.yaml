artifact: valuation
slug: octane
runDate: 2026-10-16
company:
  name: Octane
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still anchors Octane's last priced equity mark at the December 2025
    Series F round of $100 million at a $1.3 billion post-money valuation, while
    2026 disclosures show stronger scale, profitability, and non-dilutive funding capacity.
    That combination supports a disciplined track posture: the last disclosed price can be
    defended on growth and profitability, but not underwritten aggressively without private
    diligence on credit performance, the preference stack, and the current market-clearing price.
sections:
  - id: valuation-anchor
    title: Last public equity mark still frames the entry debate
    body: >-
      The strongest public valuation anchor is still the December 2025 Series F: multiple
      independent sources describe a $100 million round at a $1.3 billion post-money
      valuation, with roughly half the proceeds used for primary capital and half for
      secondary liquidity. Multiples.vc also records about $400 million of revenue as of
      September 2025, which implies a 3.3x revenue multiple at that valuation. That does
      not look obviously stretched for a profitable specialty lender with strong origination
      growth, but it is also not a fresh 2026 clearing price. Public evidence therefore
      supports using the last round as a reference point, not as proof that any step-up
      price is justified today.
    claimRefs: [CV001, CV002, CV003, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: operating-proof
    title: Operating momentum and funding breadth support the base case
    body: >-
      Octane's 2026 evidence base improved in two ways that matter for valuation. First,
      official and independent sources say 2025 originations reached $2.1 billion, adjusted
      EBITDA reached $80 million, and GAAP profitability continued for a third straight year.
      Second, 2026 announcements show that all-time originations surpassed $9 billion while
      first-half 2026 originations grew 37% year over year. Those operating signals are paired
      with larger non-dilutive capital channels: the Nuveen forward-flow agreement lifted
      committed forward-flow capacity above $2.2 billion, and the October 2026 facility added
      a separate $1.4 billion commitment. Together, those facts support the thesis that Octane
      is scaling as a capital-markets-enabled lender rather than depending on near-term equity.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: anti-thesis
    title: The anti-thesis is opacity, not lack of commercial traction
    body: >-
      The main reason not to underwrite the company aggressively from public information is
      disclosure opacity. Auto Finance News framed the Series F as part of an effort to shore
      up capital and diversify funding channels, which is logical for a lender whose valuation
      depends on stable access to debt markets. More importantly, the August 2026 SVIC profile
      says public figures are inconsistent across sources and limited to funding, valuation,
      originations, and profitability references, and it explicitly says the full shareholder
      register is not public. That means the public record does not fully expose the current
      preference stack, dilution, or loan-book quality, so the last disclosed valuation may be
      fair but remains incomplete as a true clearing-price signal.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: final-diligence
    title: What would move the recommendation
    body: >-
      The public evidence supports staying engaged, but only with entry discipline. A tighter
      recommendation would require private diligence that verifies current credit performance,
      funding costs, warehouse and forward-flow terms, and the exact cap-table economics after
      the secondary-heavy Series F. If that diligence confirms durable profitability with no
      hidden preference overhang, the last public valuation could look attractive relative to
      current operating scale. If instead losses, delinquencies, or senior claims on exit value
      prove worse than the public record suggests, the same $1.3 billion anchor would look too
      generous. The valuation call therefore hinges on information quality as much as on growth.
    claimRefs: [CV003, CV010, CV011, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, "Track / diligence before underwriting a step-up", "Stay engaged, but do not assume the 2025 mark clears unchanged in 2026."]
      - [Confidence, Medium, "Growth and profitability evidence are solid, but valuation inputs are still incomplete."]
      - [Risk rating, Medium-high, "Funding-market and credit-performance opacity can still compress realized exit value."]
      - [Valuation stance, "Fair at the last disclosed anchor; unproven above it", "Require private validation before paying above the December 2025 mark."]
    notes: >-
      Analyst synthesis from retained public sources; judgments depend on stale public pricing
      and incomplete cap-table and loan-performance disclosure.
    claimRefs: [CV001, CV002, CV003, CV010, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Frame
      - What the evidence says
      - What would change the view
    rows:
      - ["Thesis", "2025 originations reached $2.1B, EBITDA reached $80M, profitability continued, and all-time originations surpassed $9B in 2026.", "A current third-party mark or audited credit-performance pack confirming those economics would justify a more constructive entry view."]
      - ["Funding resilience", "Nuveen's $350M forward flow and the later $1.4B facility show expanding non-dilutive capital access.", "Evidence of tighter spreads, durable investor demand, and clean warehouse covenants would strengthen the underwriting case."]
      - ["Anti-thesis", "The public record still does not show the full preference stack, current clearing price, or loan-level credit performance.", "A cap table, liquidation waterfall, and recent portfolio data could remove the biggest valuation discount."]
      - ["Thesis-break", "If debt-market access weakens or hidden senior claims absorb exit value, the last round becomes a poor anchor.", "Material deterioration in delinquencies, funding terms, or preference seniority would push the stance from fair to expensive."]
    notes: >-
      Combines company-issued operating updates with independent valuation and diligence
      summaries; the anti-thesis rows reflect missing evidence rather than invented downside.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "2026 growth sustains above the disclosed 37% first-half pace, funding channels keep widening, and private diligence confirms no hidden preference overhang.", "The stale $1.3B mark would screen attractive because operating scale would have moved ahead of the last public equity price.", "Credit normalization or investor pullback could still cap upside.", "Would require new third-party confirmation of current revenue, margins, and portfolio quality."]
      - ["Base", "Growth remains healthy, profitability persists, and debt-market access stays open, but no fresh priced round or cap-table transparency emerges.", "The last disclosed valuation looks fair enough to track, but not robust enough to chase above-market pricing.", "Opaque liquidation preferences and incomplete loss data keep confidence at medium.", "Best fit with the retained public evidence."]
      - ["Bear", "Consumer demand softens, ABS or forward-flow spreads widen, or hidden senior economics reduce common-equity value.", "A lender with stale pricing and incomplete disclosure would likely deserve a lower multiple than the last public mark.", "Downside is amplified because public evidence does not reveal the full waterfall or current credit performance.", "Would be signaled by weaker funding access, negative credit surprises, or a down-round / insider mark."]
    notes: >-
      Scenario analysis is qualitative because the assigned public pool does not disclose a
      current priced round, a full cap table, or audited credit-loss metrics.
    claimRefs: [CV003, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation flows from proven growth and profitability, through larger funding
      capacity, into a stale but defendable valuation anchor that is discounted for disclosure opacity.
    data:
      nodes:
        - id: proof
          label: 2025 proof points
          note: "Originations reached $2.1B, EBITDA reached $80M, and profitability continued."
          claimRefs: [CV004, CV005, CV006]
        - id: scale
          label: 2026 momentum
          note: "All-time originations surpassed $9B and first-half 2026 originations grew 37% year over year."
          claimRefs: [CV007, CV008]
        - id: funding
          label: Funding breadth
          note: "$350M Nuveen capacity and a later $1.4B facility reduce immediate equity dependence."
          claimRefs: [CV009, CV010, CV011]
        - id: anchor
          label: Last public equity mark
          note: "Series F set a $1.3B post-money anchor; Multiples.vc implies about 3.3x revenue on Sep-2025 revenue."
          claimRefs: [CV001, CV002, CV003]
        - id: frictions
          label: What still blocks conviction
          note: "Public sources do not show the full shareholder register, liquidation stack, or current credit-quality detail."
          claimRefs: [CV012, CV013, CV014, CV015]
        - id: decision
          label: Recommendation
          note: "Track with disciplined entry rather than underwriting a step-up on public evidence alone."
          claimRefs: [CV016]
      edges:
        - from: proof
          to: scale
        - from: scale
          to: funding
        - from: funding
          to: anchor
        - from: anchor
          to: frictions
        - from: frictions
          to: decision
    approximationNotes: null
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Public evidence supports disciplined engagement, not blind price acceptance
    body: >-
      Octane looks good enough to keep tracking because scale, profitability, and funding
      breadth all improved, but the public pool still does not expose enough about the
      preference stack or credit quality to justify paying above the last disclosed round on faith.
    claimRefs: [CV003, CV007, CV009, CV014, CV015, CV016]
  - calloutType: risk
    title: The biggest valuation discount is information quality
    body: >-
      The core downside is not weak top-line momentum; it is that independent sources still
      describe incomplete, inconsistent public valuation data and estimated dilution instead
      of a fully disclosed cap table and liquidation waterfall.
    claimRefs: [CV013, CV014, CV015]
