    title: "Technology / operating architecture table"
    columns:
      - "Layer / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Consumer acquisition", "Present offers and soft-pull prequalification before dealer purchase", "Octane consumer surface and partner entry points", "No public latency, availability, fraud-screening, or conversion evidence"]
      - ["OEM and dealer distribution", "Route qualified shoppers into branded or dealer workflows", "OEM web placement, Prequal tools, and Dealer Portal", "No public API, CRM/DMS integration, onboarding, or support detail"]
      - ["Credit and loan processing", "Underwrite and originate full-spectrum installment credit", "Roadrunner Financial and underwriting controls", "Credit-model governance and program-level performance are not public"]
      - ["Servicing and compliance", "Support borrowers and administer loans after closing", "Roadrunner Account Services and disclosed compliance process", "No public SLA, control certification, complaint metric, or incident history"]
      - ["Funding and liquidity", "Recycle capital through ABS and other loan-sale channels", "Investor demand and execution for originated receivables", "Funding-market disruption could constrain scale despite front-end demand"]
    notes: "This evidence-bounded operating model is reconstructed from public company, partner, and syndicated release material; it is not a disclosed system architecture and does not imply undocumented infrastructure."
    claimRefs: ["CE004", "CE008", "CE009", "CE010", "CE015"]
