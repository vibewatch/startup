  topStrengths:
    - Strong origination growth and profitability signals support commercial momentum.
    - OEM/dealer distribution plus partner-branded captive programs broaden the operating moat.
    - Large forward-flow, ABS, and whole-loan capacity show durable access to institutional capital.
  topRisks:
    - Audited financials, loan-level credit performance, and margin economics remain undisclosed.
    - The model still depends on securitization, forward-flow, and partner execution to scale.
    - Third-party funding totals and the current cap-table / preference stack are still inconsistent or opaque.
  unresolvedGaps:
    - Audited GAAP financial statements and a reconciliation from originations to recognized revenue and EBITDA.
    - Loan-level delinquency, charge-off, recovery, and margin data by vintage and product line.
    - A reconciled cap table, preference stack, and current clearing-price reference after the December 2025 Series F.
    - State-by-state licensing, examination history, and complaint trends for Roadrunner entities.
