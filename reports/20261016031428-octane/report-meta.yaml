companyProfile:
  summary: >-
    Octane is a private, disclosed fintech lender founded in 2014 and headquartered in New York that combines consumer
    prequalification, dealer and OEM workflow tools, in-house lending and servicing, and partner-branded captive-finance
    programs for powersports, RV, marine, trailers, and outdoor power equipment. Public evidence now shows a scaled
    distribution base, continued profitability signals, and meaningful capital-markets access, but it still leaves
    audited financial statements, loan-level credit performance, and a reconciled cap table unresolved.
