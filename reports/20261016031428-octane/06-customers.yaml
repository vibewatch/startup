artifact: customers
slug: octane
runDate: 2026-10-16
company:
  name: Octane
chapter:
  number: 6
  title: Customers
  summary: >-
    Octane's public customer evidence is strongest at the channel layer: by late 2026 the company
    was publicly tying its financing stack to more than 4,000 dealers, 80 OEM brand partners, and
    newly launched branded programs with BRP, Forest River, and Scag. Borrower-adoption evidence
    exists through ACI's servicing case study, but retention, concentration, and renewal durability
    remain largely undisclosed in public materials.
sections:
  - id: customer-segmentation
    title: Customer base is multi-sided, with OEMs, dealers, and borrowers all participating in the same financing loop
    body: >-
      Octane does not sell into a single customer archetype. The retained evidence shows a
      multi-sided model in which OEMs and branded finance partners use Captive-as-a-Service to
      launch white-label lending programs, dealers use Octane's platform to prequalify shoppers and
      manage financing workflows, and end borrowers use the platform for rate discovery, checkout,
      and loan servicing. The company has also widened its served verticals over time from
      powersports into RV, marine, outdoor power equipment, and trailers, which broadens the buyer
      and dealer base but also makes customer quality harder to judge from aggregate counts alone.
      Public materials point to scale in channel relationships, but they do not break out revenue or
      usage by segment.
    claimRefs: [CU001, CU002, CU003, CU004, CU012]
    tableRefs: [TU001]
  - id: adoption-signals
    title: Public adoption signals show channel expansion and servicing usage, but not cohort durability
    body: >-
      Public adoption evidence is credible but uneven. Company and partner materials show a
      meaningful dealer and OEM footprint, plus continued expansion in 2026 through new branded
      programs and originations growth. The strongest borrower-side usage proof comes from ACI's
      case study, which says Octane's expanding customer base was driving billing and collections
      call volume and that nearly 70 percent of customers preferred mobile payments. That is a real
      usage signal, and ACI also reports a shift of payment activity into self-service channels after
      implementation. What remains missing is the durability layer that investors usually want:
      public NRR, churn, renewal, contract-length, and concentration disclosures are absent from the
      retained source set.
    claimRefs: [CU003, CU005, CU009, CU010, CU011, CU013, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named customer proof is production-oriented, but public evidence still favors launch narratives over steady-state economics
    body: >-
      The chapter's clearest proof of real deployment comes from named partner launches rather than
      anonymous logo walls. BRP's August 2026 launch extended a decade-long relationship into a
      branded captive finance program. Forest River's September 2026 launch brought the same
      Captive-as-a-Service stack into a broad RV portfolio with lifecycle servicing. Octane's July
      2026 Scag announcement, done with Huntington, shows the company extending the same model into
      outdoor power equipment dealer workflows. Together these sources support production use cases
      and channel expansion, but they do not disclose dealer activation, financed-loan volume,
      renewal behavior, or the revenue concentration of any one OEM relationship.
    claimRefs: [CU006, CU007, CU008, CU012, CU014]
    tableRefs: [TU003]
