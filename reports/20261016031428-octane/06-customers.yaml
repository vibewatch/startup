callouts:
  - calloutType: insight
    title: OEM/dealer distribution is the strongest proof of real customer adoption
    body: >-
      The chapter's best evidence is not a raw customer-count boast but a series of named,
      production-oriented channel relationships plus borrower servicing usage. That makes Octane's
      customer proof credible at the ecosystem level even though borrower-cohort economics remain
      thin publicly.
    claimRefs: [CU003, CU005, CU006, CU007, CU008, CU010, CU011]
  - calloutType: risk
    title: Durability and concentration remain under-disclosed
    body: >-
      Public sources show launch momentum, but they do not disclose renewal rates, churn, contract
      length, top-partner mix, or partner-level economics. That means the visible customer proof is
      stronger on acquisition and deployment than on retention and concentration risk.
    claimRefs: [CU013, CU014]
