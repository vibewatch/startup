  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-durability
      missingEvidence: NRR, GRR, borrower or dealer churn, renewal rates, average contract duration, and cohort retention by channel.
      whyItMatters: Without durability metrics, it is hard to distinguish launch momentum from stable recurring customer economics.
      diligencePath: Request partner-level retention dashboards, renewal cohorts, and contract summary data from management or the data room.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: Exhaustive list of named production customer programs with launch dates, active dealers or accounts, and current status.
      whyItMatters: The chapter can show credible proof points, but it cannot prove whether the visible examples are representative of the broader base.
      diligencePath: Ask for a full customer reference list or deployment register segmented by OEM, dealer group, and program stage.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-partner revenue share, financed-loan volume by OEM and dealer group, and renewal or attrition data for major channel relationships.
      whyItMatters: Channel-led growth can create hidden dependence on a few OEM or dealer relationships even when headline partner counts look diversified.
      diligencePath: Request top-10 partner concentration tables, renewal histories, and termination-right summaries for major programs.
