      - number: '5.2'
        title: Operating model, deployment, and architecture
        blocks:
          - type: paragraph
            body: >-
              The public operating model connects embedded distribution to regulated credit operations. Octane's 2026
              materials describe Captive-as-a-Service as combining technology, underwriting, loan processing, servicing,
              and compliance under an OEM's brand. The same materials identify Roadrunner Financial as the lender and
              Roadrunner Account Services as the servicer for a manufacturer-backed program, while RV and marine
              securitization evidence identifies fixed-rate installment loans originated by Roadrunner Financial. This
              makes the architecture deeper than lead generation, but also creates dependencies across borrower
              acquisition, dealer workflows, underwriting controls, servicing continuity, and capital-markets execution.
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
