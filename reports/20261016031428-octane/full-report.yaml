              - CP012
      - number: '3.2'
        title: Offering comparison
        blocks:
          - type: paragraph
            body: >-
              Octane’s materials consistently present the company as more than a point-of-sale lender. The homepage
              emphasizes instant offers, soft-pull prequalification, and prime through first-time-buyer coverage;
              partnership releases extend that stack into OEM-branded captive programs, dealer workflow tools,
              servicing, and marketing support. In contrast, the named competitors in the third-party tear sheet are
              described as covering narrower slices such as application routing, digital auto finance, or indirect
              lending. The supportable conclusion is that Octane competes on bundled workflow breadth, not just on loan
              availability.
            claimRefs:
