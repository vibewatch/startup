              - CR006
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: The investment can work, but only with measurable kill criteria and a tighter diligence package
        blocks:
          - type: paragraph
            body: >-
              The mitigating case is real: Octane is not reliant on a single investor, a single program, or a single
              channel, and both company and third-party sources describe repeat ABS issuance plus multiple institutional
              funding relationships. Still, the residual-risk picture stays elevated because the evidence set shows
              scale expanding faster than control disclosure. The practical kill criteria are therefore monitorable. A
              failed facility renewal, materially weaker ABS execution, or evidence that originations are being pushed
              through broader credit boxes without stable loss performance would directly challenge the funding thesis.
              Likewise, any diligence result showing patchy licensing, weak complaint handling, or heavy concentration
              in a small number of OEMs, dealers, or capital partners would make the model less attractive at a
              2025-anchored unicorn valuation. Without that package, the right posture is not to assume hidden breakage,
              but to underwrite the unknowns explicitly.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
