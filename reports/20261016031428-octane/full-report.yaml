      - number: '6.2'
        title: Public adoption signals show channel expansion and servicing usage, but not cohort durability
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is credible but uneven. Company and partner materials show a meaningful dealer
              and OEM footprint, plus continued expansion in 2026 through new branded programs and originations growth.
              The strongest borrower-side usage proof comes from ACI's case study, which says Octane's expanding
              customer base was driving billing and collections call volume and that nearly 70 percent of customers
              preferred mobile payments. That is a real usage signal, and ACI also reports a shift of payment activity
              into self-service channels after implementation. What remains missing is the durability layer that
              investors usually want: public NRR, churn, renewal, contract-length, and concentration disclosures are
              absent from the retained source set.
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU010
              - CU011
