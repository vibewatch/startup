          - type: callout
            title: Control quality remains unverified
            body: >-
              Public materials establish product breadth but do not independently validate security certifications,
              privacy controls, uptime, incident response, implementation SLAs, or developer-surface maturity.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is multi-sided, with OEMs, dealers, and borrowers all participating in the same financing loop
        blocks:
          - type: paragraph
            body: >-
              Octane does not sell into a single customer archetype. The retained evidence shows a multi-sided model in
              which OEMs and branded finance partners use Captive-as-a-Service to launch white-label lending programs,
              dealers use Octane's platform to prequalify shoppers and manage financing workflows, and end borrowers use
              the platform for rate discovery, checkout, and loan servicing. The company has also widened its served
              verticals over time from powersports into RV, marine, outdoor power equipment, and trailers, which
              broadens the buyer and dealer base but also makes customer quality harder to judge from aggregate counts
              alone. Public materials point to scale in channel relationships, but they do not break out revenue or
              usage by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
