chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Octane presents itself as a New York-headquartered fintech lender and software platform rather than a pure
              lead generator. The current public identity is stable across company and third-party sources: Octane
              Lending, Inc. was founded in 2014, operates from New York, and uses Roadrunner entities for lending,
              servicing, and captive-finance execution. The operating model combines consumer prequalification, dealer
              workflow software, underwriting, and capital-markets funding, which matters because later diligence
              chapters should treat Octane as both a technology vendor and a balance-sheet-enabled specialty lender.
              Scale signals are meaningful but mostly company-issued: Octane says it serves 80 OEM brands, 4,000+
              dealers, and employs more than 600 people, while open evidence does not disclose active borrower count.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO004
              - CO010
              - CO011
              - CO012
              - CO015
      - number: '1.2'
        title: Leadership, governance, and stakeholder concentration
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is narrow relative to Octane's scale. The assigned evidence consistently
              names Jason Guss as co-founder and CEO, with Steven Fernald as President and CFO and Mark Davidson as
              co-founder and CRO, but it does not provide a full board roster, committee structure, or updated cap
              table. That leaves real diligence blind spots around control rights, liquidation preferences, and
              succession depth. The public record also suggests meaningful founder concentration: Guss remains the lead
              spokesperson on strategic partnerships and company positioning, while external capital and channel
              relationships are concentrated in a relatively small set of repeat equity, bank, and forward-flow
              counterparties.
            claimRefs:
              - CO005
              - CO009
              - CO014
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO016
