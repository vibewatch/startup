      - number: '4.2'
        title: Capital-markets engine and funding dependency
        blocks:
          - type: paragraph
            body: >-
              The best-supported financial strength in public materials is Octane's ability to keep financing assets
              moving off balance sheet. Official and third-party 2026 sources say the company had surpassed $9 billion
              of all-time originations, more than $5 billion of ABS issuance, and more than $6.3 billion of forward-flow
              and whole-loan commitments, including a $1.4 billion forward-flow facility announced in October 2026. That
              is a meaningful liquidity signal, but not the same thing as cash on hand or durable profitability: the
              evidence shows access to funding channels and investor demand, yet it does not disclose retained
              economics, warehouse costs, debt covenants, or balance-sheet capacity if securitization or loan sale
              markets weaken.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
              - CI015
      - number: '4.3'
        title: Unit economics and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The public financial snapshot is still too thin for full underwriting. Independent databases repeat a
              roughly $400 million 2025 revenue figure and about $80 million of adjusted EBITDA, but those numbers are
              not tied to audited statements, and even third-party funding datasets disagree on total capital raised and
              certain round amounts. More importantly, the available sources explicitly warn that public figures are
              limited, leaving gross margin, CAC/payback, servicing profitability, gain-on-sale margin, delinquency and
              charge-off vintages, customer concentration, and runway unsupported. The financial verdict is therefore
              directionally positive on growth and funding access, but incomplete on revenue quality, loss absorption,
              and margin durability.
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public materials do not yet clear the lending-underwrite bar
            body: >-
              Octane's public footprint is strong on origination growth and funding access, but a lender can look
              healthy on those outputs while still hiding weak margin capture or deteriorating credit performance.
              Without audited revenue recognition, spread economics, loss vintages, and liquidity headroom, the
              financial case is directionally positive but still diligence-bound.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI012
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Octane's product is best understood as a financing workflow rather than a single loan application. The
              current consumer surface starts with instant offers and a soft credit pull, supports prime,
              credit-builder, and first-time-buyer programs, and describes an experience spanning online shopping
              through in-store purchase. Older official materials add online document upload and OEM-site
              prequalification that directs qualified shoppers into dealership transaction flows. A partner-hosted
              Octane Marine application provides tangible deployment evidence: its multi-step form collects identity,
              housing, employment, income, collateral, down-payment, and dealer-handoff information, although the public
              evidence does not disclose completion, approval, or conversion rates.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
