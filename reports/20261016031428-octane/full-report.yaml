          Growth remains healthy, profitability persists, and debt-market access stays open, but no fresh priced round
          or cap-table transparency emerges.
        - The last disclosed valuation looks fair enough to track, but not robust enough to chase above-market pricing.
        - Opaque liquidation preferences and incomplete loss data keep confidence at medium.
        - Best fit with the retained public evidence.
      - - Bear
        - >-
          Consumer demand softens, ABS or forward-flow spreads widen, or hidden senior economics reduce common-equity
          value.
        - >-
          A lender with stale pricing and incomplete disclosure would likely deserve a lower multiple than the last
          public mark.
        - >-
          Downside is amplified because public evidence does not reveal the full waterfall or current credit
          performance.
        - Would be signaled by weaker funding access, negative credit surprises, or a down-round / insider mark.
    notes: >-
      Scenario analysis is qualitative because the assigned public pool does not disclose a current priced round, a full
      cap table, or audited credit-loss metrics.
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
