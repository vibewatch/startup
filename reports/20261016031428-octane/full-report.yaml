              - CE015
      - number: '5.3'
        title: Maturity, differentiation, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Product breadth is supported more strongly than product quality. A company release syndicated by
              RVBusiness says Octane introduced more than 100 products and enhancements in 2024, including Dealer Portal
              2.0, and that both Prequal tools were used by more than 1,200 dealers, sending nearly 400,000 powersports
              applications to partner dealers. Auto Finance News separately reported the marine-market entry, while
              later company-issued evidence describes continuing RV and marine expansion and white-label captive
              programs. The differentiator is the combined workflow, lender, servicer, and funding stack; the missing
              proof is independently measured deployment speed, reliability, approval performance, and partner
              economics.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
              - CE012
              - CE015
      - number: '5.4'
        title: Trust, technical risk, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The assigned public source set does not substantiate the controls needed to underwrite a finance
              platform's technical risk. Octane describes compliance as part of Captive-as-a-Service, but the retained
              pages do not provide a security or trust center, control certifications, privacy architecture, uptime or
              incident history, disaster-recovery targets, model-governance detail, or service-level performance. The
              same evidence set contains no public API documentation, SDK, package, repository, engineering talk, or
              practitioner-community discussion that could serve as developer signal. These are evidence gaps rather
              than proof of weak controls; diligence should test them directly before treating vertical integration as a
              durable technical moat.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A vertically integrated workflow
            body: >-
              Octane's disclosed product spans consumer acquisition, dealer and OEM distribution, underwriting,
              servicing, and funding rather than stopping at a referral or checkout widget.
            calloutType: strength
            claimRefs:
