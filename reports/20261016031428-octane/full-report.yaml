  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Last public equity mark still frames the entry debate
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor is still the December 2025 Series F: multiple independent sources
              describe a $100 million round at a $1.3 billion post-money valuation, with roughly half the proceeds used
              for primary capital and half for secondary liquidity. Multiples.vc also records about $400 million of
              revenue as of September 2025, which implies a 3.3x revenue multiple at that valuation. That does not look
              obviously stretched for a profitable specialty lender with strong origination growth, but it is also not a
              fresh 2026 clearing price. Public evidence therefore supports using the last round as a reference point,
              not as proof that any step-up price is justified today.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Operating momentum and funding breadth support the base case
        blocks:
          - type: paragraph
            body: >-
              Octane's 2026 evidence base improved in two ways that matter for valuation. First, official and
              independent sources say 2025 originations reached $2.1 billion, adjusted EBITDA reached $80 million, and
              GAAP profitability continued for a third straight year. Second, 2026 announcements show that all-time
              originations surpassed $9 billion while first-half 2026 originations grew 37% year over year. Those
              operating signals are paired with larger non-dilutive capital channels: the Nuveen forward-flow agreement
              lifted committed forward-flow capacity above $2.2 billion, and the October 2026 facility added a separate
              $1.4 billion commitment. Together, those facts support the thesis that Octane is scaling as a
              capital-markets-enabled lender rather than depending on near-term equity.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: The anti-thesis is opacity, not lack of commercial traction
        blocks:
          - type: paragraph
            body: >-
              The main reason not to underwrite the company aggressively from public information is disclosure opacity.
              Auto Finance News framed the Series F as part of an effort to shore up capital and diversify funding
              channels, which is logical for a lender whose valuation depends on stable access to debt markets. More
              importantly, the August 2026 SVIC profile says public figures are inconsistent across sources and limited
              to funding, valuation, originations, and profitability references, and it explicitly says the full
              shareholder register is not public. That means the public record does not fully expose the current
              preference stack, dilution, or loan-book quality, so the last disclosed valuation may be fair but remains
              incomplete as a true clearing-price signal.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: What would move the recommendation
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports staying engaged, but only with entry discipline. A tighter recommendation
              would require private diligence that verifies current credit performance, funding costs, warehouse and
              forward-flow terms, and the exact cap-table economics after the secondary-heavy Series F. If that
              diligence confirms durable profitability with no hidden preference overhang, the last public valuation
              could look attractive relative to current operating scale. If instead losses, delinquencies, or senior
              claims on exit value prove worse than the public record suggests, the same $1.3 billion anchor would look
              too generous. The valuation call therefore hinges on information quality as much as on growth.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports disciplined engagement, not blind price acceptance
            body: >-
              Octane looks good enough to keep tracking because scale, profitability, and funding breadth all improved,
              but the public pool still does not expose enough about the preference stack or credit quality to justify
              paying above the last disclosed round on faith.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
          - type: callout
            title: The biggest valuation discount is information quality
            body: >-
              The core downside is not weak top-line momentum; it is that independent sources still describe incomplete,
              inconsistent public valuation data and estimated dilution instead of a fully disclosed cap table and
              liquidation waterfall.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
