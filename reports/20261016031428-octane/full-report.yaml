            tableRef: TO003
            claimRefs:
              - CO009
              - CO014
              - CO015
              - CO016
      - number: '1.3'
        title: Funding snapshot and scale quality
        blocks:
          - type: paragraph
            body: >-
              Open-source funding and performance data is directionally strong but not fully reconciled. Octane's
              December 2025 Series F and the October 2026 forward-flow announcement show continued access to both equity
              and structured credit, while Multiples and the August 2026 tear sheet both support a unicorn valuation
              framework around late 2025. However, these third-party sources do not fully agree on total capital raised,
              and the same public package that cites profitability also warns that public figures are inconsistent
              across sources. The practical conclusion is that Octane looks increasingly institutionalized in funding
              access, but investors still need company-backed reconciliation of total funding, audited financials, and
              borrower-credit metrics.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
