  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a financing workflow that starts with shopper acquisition and ends with
      Roadrunner-originated assets being serviced and recycled through capital-markets channels.
    data:
      nodes:
        - id: leads
          label: Consumer and OEM/dealer lead capture
          detail: OEM sites, dealer channels, and Octane shopping flows feed demand
        - id: prequal
          label: Soft-pull prequalification
          detail: Real rates and payments are shown without a hard-credit hit
        - id: underwrite
          label: Roadrunner underwriting
          detail: Prime, credit builder, and first-time buyer programs sit here
        - id: close
          label: Dealer closing and documentation
          detail: Financing is integrated into the point-of-sale purchase flow
        - id: service
          label: Servicing and lifecycle engagement
          detail: Roadrunner Account Services handles servicing for branded programs
        - id: fund
          label: Forward-flow, whole-loan sale, and ABS execution
          detail: Public 2026 sources cite >$5B ABS issued and >$6.3B sold or committed
      edges:
        - from: leads
          to: prequal
          label: Qualified shopper enters financing flow
        - from: prequal
          to: underwrite
          label: Credit decision and loan structuring
        - from: underwrite
          to: close
          label: Dealer finalizes transaction
        - from: close
          to: service
          label: Loan enters servicing lifecycle
        - from: service
          to: fund
          label: Receivable monetized or refinanced through capital markets
    approximationNotes: >-
      This is a structural flow, not a value waterfall; public sources do not disclose conversion rates, take rates, or
      per-step economics.
    claimRefs:
