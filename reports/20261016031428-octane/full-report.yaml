              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Switching costs and channel power
        blocks:
          - type: paragraph
            body: >-
              The strongest moat evidence in this pool is distribution integration. Forest River, BRP, and
              Huntington/Scag materials all describe Octane as part of branded partner workflows rather than a bolt-on
              consumer lender. Octane explicitly positions Captive-as-a-Service as a way to get captive-lender benefits
              without building that capability internally, which implies that “build it yourself” remains a substitute
              but an expensive one. If those programs are sticky, Octane’s advantage comes from OEM and dealer workflow
              control, in-house servicing, and lifecycle marketing support rather than from a publicly proven
              lowest-cost price position.
            claimRefs:
              - CP005
              - CP007
              - CP012
              - CP013
      - number: '3.4'
        title: Durability risks and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports Octane’s breadth also shows meaningful displacement risk. The third-party
              competitor landscape includes dealer-routing networks and large indirect lenders that already sit inside
              the same auto-credit and dealership workflow, while generic “similar company” databases expand the peer
              set so broadly that they cease to be reliable direct-comparison tools. Just as important, the public
              material in this pool never discloses side-by-side APRs, merchant-fee economics, servicing outcomes,
              complaint rates, or win/loss data. That limits confidence on pricing power, trust posture, and how durable
              channel lock-in really is versus better-capitalized incumbents.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The supportable moat is workflow depth, not proven lowest-cost pricing
            body: >-
              Across the assigned evidence, Octane’s strongest defended position is the combination of dealer/OEM
              distribution, branded captive programs, servicing, and workflow tooling. The same sources do not prove
              that Octane wins primarily on transparent public pricing.
            calloutType: strength
            claimRefs:
              - CP012
              - CP013
              - CP015
          - type: callout
            title: Large incumbents already overlap the same workflow
            body: >-
              The third-party competitor landscape places dealer-routing networks and major indirect auto lenders inside
              the same application-routing and dealer-originated finance workflow. That makes competitive displacement a
              real channel risk even if Octane’s recreational focus is differentiated.
            calloutType: risk
            claimRefs:
              - CP009
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Octane's observable monetization starts with consumer installment lending: the public website shows
              instant financing, a soft-credit-pull flow, and separate prime, credit builder, and first-time buyer
              programs, while older official materials show OEM-embedded prequalification that routes qualified shoppers
              into dealerships. The newer Forest River program extends that same stack into manufacturer-branded captive
              finance, with Roadrunner as the underwriter and servicer. What remains missing is the money layer: list
              pricing is described only qualitatively as competitive rates, promotional financing, and flexible terms,
              so the public record supports distribution breadth and product structure, but not realized APRs, partner
              subsidies, take rates, or fee capture by stream.
            claimRefs:
              - CI001
