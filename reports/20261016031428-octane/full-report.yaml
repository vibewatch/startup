              - CU012
      - number: '6.3'
        title: >-
          Named customer proof is production-oriented, but public evidence still favors launch narratives over
          steady-state economics
        blocks:
          - type: paragraph
            body: >-
              The chapter's clearest proof of real deployment comes from named partner launches rather than anonymous
              logo walls. BRP's August 2026 launch extended a decade-long relationship into a branded captive finance
              program. Forest River's September 2026 launch brought the same Captive-as-a-Service stack into a broad RV
              portfolio with lifecycle servicing. Octane's July 2026 Scag announcement, done with Huntington, shows the
              company extending the same model into outdoor power equipment dealer workflows. Together these sources
              support production use cases and channel expansion, but they do not disclose dealer activation,
              financed-loan volume, renewal behavior, or the revenue concentration of any one OEM relationship.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
