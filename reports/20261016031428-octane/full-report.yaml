  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity is highest where funding dependence and operating scale outpace control-level disclosure in the
      assigned pool.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
      rows:
        - label: Capital-market rollover
          values:
            - label: High
              detail: Forward-flow, whole-loan, and ABS execution remain core to the model.
            - label: High
              detail: Weak facility renewal or ABS execution would pressure liquidity and originations.
            - label: Medium
              detail: Multiple counterparties help, but covenant and renewal detail is not public here.
        - label: Regulatory / license opacity
          values:
            - label: Medium
              detail: Lending and servicing are active, but full state coverage and exam history are not shown.
            - label: High
              detail: A license or conduct issue could affect originations, servicing, and partner programs at once.
            - label: Low
              detail: Assigned sources do not surface a matching control-disclosure package.
        - label: OEM / partner concentration
          values:
            - label: Medium-High
              detail: Large OEM programs and partner counts are disclosed, but concentration is not.
            - label: High
              detail: A major partner setback could hit distribution growth and brand credibility.
            - label: Medium
              detail: Network breadth helps, but mix data is absent.
        - label: Launch / servicing execution
          values:
            - label: Medium
              detail: 2026 launches increase operational load across underwriting, servicing, and dealer support.
            - label: High
              detail: Failures would undermine the instant-decision and seamless-buying promise.
            - label: Medium
              detail: Turnkey platform claims suggest process maturity, but no rollout KPIs are disclosed.
        - label: Credit-cycle deterioration
          values:
            - label: Medium
              detail: Broad credit coverage and growth require stable loss performance to avoid negative selection.
            - label: High
              detail: Weak asset performance would hit both funding appetite and unit economics.
            - label: Medium
              detail: Repeat investor support helps, but public loan-level metrics are missing.
        - label: Security / privacy transparency gap
          values:
            - label: Medium
              detail: The company handles financing applications and servicing data, but control detail is not public here.
            - label: Medium-High
              detail: A serious incident would damage trust with dealers, borrowers, and capital partners.
            - label: Low
              detail: No assigned source surfaces certifications, incident history, or trust-center detail.
    approximationNotes: >-
      Qualitative scoring is analyst synthesis from cited evidence and explicit disclosure gaps rather than
      company-published risk ratings.
    claimRefs:
      - CR007
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation flows from proven growth and profitability, through larger funding capacity, into a stale but
      defendable valuation anchor that is discounted for disclosure opacity.
    data:
      nodes:
        - id: proof
          label: 2025 proof points
          note: Originations reached $2.1B, EBITDA reached $80M, and profitability continued.
          claimRefs:
            - CV004
            - CV005
            - CV006
        - id: scale
          label: 2026 momentum
          note: All-time originations surpassed $9B and first-half 2026 originations grew 37% year over year.
          claimRefs:
            - CV007
            - CV008
        - id: funding
          label: Funding breadth
          note: $350M Nuveen capacity and a later $1.4B facility reduce immediate equity dependence.
          claimRefs:
            - CV009
            - CV010
            - CV011
        - id: anchor
          label: Last public equity mark
          note: Series F set a $1.3B post-money anchor; Multiples.vc implies about 3.3x revenue on Sep-2025 revenue.
          claimRefs:
            - CV001
            - CV002
            - CV003
        - id: frictions
          label: What still blocks conviction
          note: >-
            Public sources do not show the full shareholder register, liquidation stack, or current credit-quality
            detail.
          claimRefs:
            - CV012
            - CV013
            - CV014
            - CV015
        - id: decision
          label: Recommendation
          note: Track with disciplined entry rather than underwriting a step-up on public evidence alone.
          claimRefs:
            - CV016
      edges:
        - from: proof
          to: scale
        - from: scale
          to: funding
        - from: funding
          to: anchor
        - from: anchor
          to: frictions
        - from: frictions
          to: decision
