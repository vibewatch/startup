        title: Milestones and refresh deltas
        blocks:
          - type: paragraph
            body: >-
              The refresh evidence shows a company that has kept layering adjacent verticals and funding capacity onto a
              core recreational-lending base. Earlier milestones track expansion from trailers into broader recreational
              lending and then into multi-billion-dollar originations, while 2024-2026 signals focus on scaling capital
              markets, captive-finance programs, and strategic OEM or dealer relationships. The 2026 delta is especially
              important: Octane is no longer just reporting historical originations and equity rounds, but also
              announcing large forward-flow facilities and partner-branded finance programs that deepen its role as
              embedded lender, servicer, and capital-markets orchestrator.
