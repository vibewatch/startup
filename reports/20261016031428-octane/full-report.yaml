              - CR003
              - CR004
              - CR007
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: New OEM programs increase execution, servicing, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Octane's 2026 partner launches show commercial momentum, but they also raise the operating bar. The Forest
              River launch placed Octane's technology, underwriting, servicing, and sales-support workflows behind a
              manufacturer-backed RV finance program scheduled to go live on October 1, 2026, and the press archive
              shows similar expansion across BRP, Scag, and other OEM-linked channels. That is attractive when execution
              is clean, yet it also increases the blast radius of underwriting mistakes, servicing bottlenecks, dealer
              onboarding friction, and partner-specific brand issues. The homepage promise of instant offers, soft-pull
              prequalification, and lightning-fast decisions makes customer experience part of the product thesis, so
              any workflow slowdown or control failure would hit both dealer conversion and consumer trust. Public
              materials repeatedly cite thousands of dealers and dozens of OEM brands, but the assigned pool does not
              quantify how much volume or profitability sits with the largest counterparties.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
              - CR013
              - CR014
