              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital access is the most important thesis-break vector
            body: >-
              Octane has diversified counterparties inside capital markets, but the evidence set still shows repeated
              dependence on forward-flow, whole-loan, and ABS execution rather than a self-funding balance sheet.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR015
              - CR016
          - type: callout
            title: The missing diligence is mostly control disclosure, not demand evidence
            body: >-
              The assigned pool gives strong evidence of partner launches and funding scale, but it does not verify the
              control package an investor would want around licensing, servicing complaints, asset performance, privacy,
              and concentration.
            calloutType: insight
            claimRefs:
