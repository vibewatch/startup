      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: OEM/dealer distribution is the strongest proof of real customer adoption
            body: >-
              The chapter's best evidence is not a raw customer-count boast but a series of named, production-oriented
              channel relationships plus borrower servicing usage. That makes Octane's customer proof credible at the
              ecosystem level even though borrower-cohort economics remain thin publicly.
            calloutType: insight
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
          - type: callout
            title: Durability and concentration remain under-disclosed
            body: >-
              Public sources show launch momentum, but they do not disclose renewal rates, churn, contract length,
              top-partner mix, or partner-level economics. That means the visible customer proof is stronger on
              acquisition and deployment than on retention and concentration risk.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital markets and regulated-entity dependence drive the top-tier risk stack
        blocks:
          - type: paragraph
            body: >-
              Octane's current model is tightly coupled to both its in-house regulated entities and to external capital
              providers. Company-issued partner materials show that Roadrunner Financial underwrites partner-branded
              credit programs and that Roadrunner Account Services services those loans, which means lending, servicing,
              and consumer-disclosure risk are concentrated inside the same operating stack. At the same time, 2026
              funding announcements show that Octane depends on repeated forward-flow, whole-loan, and securitization
              execution to keep scaling. That diversification is helpful, but it is still diversification inside the
              capital-markets channel rather than proof that originations can hold up if insurance buyers, ABS
              investors, or rating conditions turn. The most material legal and regulatory problem is not a disclosed
              enforcement action in this pool; it is that the reviewed sources do not verify the state license matrix,
              examination history, privacy controls, or covenant structure that would let an investor bound downside
              cleanly.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
