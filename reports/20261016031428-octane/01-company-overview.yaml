callouts:
  - calloutType: "insight"
    title: "Capital-markets depth is now a core part of the company story"
    body: "By late 2026, Octane's identity is no longer just a recreational-finance originator; the company is increasingly presenting itself as a platform that combines embedded lending with repeated access to large institutional capital pools."
    claimRefs: ["CO015", "CO016"]
  - calloutType: "risk"
    title: "Open-source disclosure still lags company scale"
    body: "Public materials support Octane's growth trajectory, but they still leave unresolved questions around reconciled funding totals, board governance, audited financial statements, and borrower-credit performance."
    claimRefs: ["CO011", "CO012", "CO013", "CO014"]
