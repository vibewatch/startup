company:
  name: "Octane"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Octane is a New York specialty-lending fintech founded in 2014 that still centers its public narrative on co-founder CEO Jason Guss, a dealer/OEM distribution network of 80 brands and 4,000+ dealers, and a Dec. 2025 Series F that third-party trackers value at about $1.3 billion. The refresh evidence shows continued 2026 scale-up through a $1.4 billion forward-flow facility and 9+ billion cumulative originations, but public funding totals, governance detail, and audited financial disclosure remain incomplete or inconsistent across open sources."
sections:
  - id: "identity-model"
    title: "Identity, footprint, and operating model"
    body: "Octane presents itself as a New York-headquartered fintech lender and software platform rather than a pure lead generator. The current public identity is stable across company and third-party sources: Octane Lending, Inc. was founded in 2014, operates from New York, and uses Roadrunner entities for lending, servicing, and captive-finance execution. The operating model combines consumer prequalification, dealer workflow software, underwriting, and capital-markets funding, which matters because later diligence chapters should treat Octane as both a technology vendor and a balance-sheet-enabled specialty lender. Scale signals are meaningful but mostly company-issued: Octane says it serves 80 OEM brands, 4,000+ dealers, and employs more than 600 people, while open evidence does not disclose active borrower count."
    claimRefs: ["CO001", "CO002", "CO003", "CO004"]
    tableRefs: ["TO001"]
  - id: "leadership-governance"
    title: "Leadership, governance, and stakeholder concentration"
    body: "Public leadership disclosure is narrow relative to Octane's scale. The assigned evidence consistently names Jason Guss as co-founder and CEO, with Steven Fernald as President and CFO and Mark Davidson as co-founder and CRO, but it does not provide a full board roster, committee structure, or updated cap table. That leaves real diligence blind spots around control rights, liquidation preferences, and succession depth. The public record also suggests meaningful founder concentration: Guss remains the lead spokesperson on strategic partnerships and company positioning, while external capital and channel relationships are concentrated in a relatively small set of repeat equity, bank, and forward-flow counterparties."
    claimRefs: ["CO005", "CO009", "CO014", "CO015", "CO016"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-scale"
    title: "Funding snapshot and scale quality"
    body: "Open-source funding and performance data is directionally strong but not fully reconciled. Octane's December 2025 Series F and the October 2026 forward-flow announcement show continued access to both equity and structured credit, while Multiples and the August 2026 tear sheet both support a unicorn valuation framework around late 2025. However, these third-party sources do not fully agree on total capital raised, and the same public package that cites profitability also warns that public figures are inconsistent across sources. The practical conclusion is that Octane looks increasingly institutionalized in funding access, but investors still need company-backed reconciliation of total funding, audited financials, and borrower-credit metrics."
    claimRefs: ["CO009", "CO010", "CO011", "CO012", "CO013", "CO014", "CO015"]
  - id: "milestones-refresh"
    title: "Milestones and refresh deltas"
    body: "The refresh evidence shows a company that has kept layering adjacent verticals and funding capacity onto a core recreational-lending base. Earlier milestones track expansion from trailers into broader recreational lending and then into multi-billion-dollar originations, while 2024-2026 signals focus on scaling capital markets, captive-finance programs, and strategic OEM or dealer relationships. The 2026 delta is especially important: Octane is no longer just reporting historical originations and equity rounds, but also announcing large forward-flow facilities and partner-branded finance programs that deepen its role as embedded lender, servicer, and capital-markets orchestrator."
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO015", "CO016"]
    figureRefs: ["FO001"]
