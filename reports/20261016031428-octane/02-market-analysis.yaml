company:
  name: "Octane"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Octane operates in a narrow but expanding specialty-finance corridor: dealer-originated
    financing for powersports, RV, marine, outdoor-power, and adjacent trailer purchases.
    Public evidence supports strong channel-led adoption and real throughput growth, but the
    usable sizing record is still mostly company disclosures and compiled secondary profiles
    rather than an independently bounded TAM/SAM/SOM model.
sections:
  - id: "boundary-and-channel"
    title: "Market boundary: specialty purchase finance, not general consumer lending"
    body: >-
      Octane's market boundary is defined more by purchase workflow than by a single product
      category. The company is positioned around large-ticket recreational and outdoor assets
      sold through dealers and OEMs: powersports vehicles, RVs, marine products, outdoor power
      equipment, and selected adjacent categories such as trailers. The recurring pattern across
      the assigned sources is point-of-sale or pre-deal financing rather than broad unsecured
      credit, auto finance writ large, or unrelated aftermarket services. That distinction matters
      because Octane's differentiation depends on dealer integration, prequalification, and
      lifecycle financing programs rather than simply offering consumer loans. The trailer launch
      source also shows why adjacency matters: the company explicitly entered a niche it described
      as cash-driven and operationally fragmented, suggesting Octane is targeting markets where
      financing friction can change conversion, not just refinance already-efficient lending.
    claimRefs: ["CM001", "CM002", "CM003", "CM007", "CM013"]
    tableRefs: ["TM001", "TM003"]
  - id: "sizing-lenses"
    title: "Sizing lenses: large category stack, but weak public decomposition"
    body: >-
      The strongest market-size conclusion from the assigned evidence is that Octane serves a
      large collection of recreational-finance categories, not that public sources cleanly isolate
      its SAM or SOM. Secondary profiles repeatedly frame the served categories as a roughly
      $150 billion opportunity, which is directionally useful for boundary-setting but still too
      broad and partly derivative to stand alone as diligence-grade sizing. More reliable public
      evidence comes from realized platform throughput: Octane reported $2.1 billion of 2025
      originations, then said first-half 2026 originations were up 37% year over year with
      cumulative originations above $9 billion. Those figures show real adoption and lending
      velocity, but they measure company volume rather than total category spend. The $5 billion
      trailer subvertical is helpful as a narrower adjacency proxy, yet it is still a single
      company-described lens rather than an independent market model.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM012"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-drivers-and-constraints"
    title: "Buyer map, adoption drivers, and constraints"
    body: >-
      Octane's adoption path runs through a multi-sided channel. The end borrower wants instant
      rate visibility and broader credit access; the dealer wants faster close rates and a simpler
      finance workflow; the OEM wants a branded finance program without building a captive lender;
      and the capital partner wants differentiated consumer-credit collateral. That structure helps
      explain the company's recent expansion into RV and outdoor power equipment, where
      Captive-as-a-Service and co-lending programs turn Octane from a pure lender into embedded
      finance infrastructure. The same structure also creates constraints. Demand is tied to
      discretionary purchases, some adjacent categories remain cash-driven, and sustained growth
      depends on keeping warehouse, whole-loan, and ABS funding channels open. Because the public
      record in this pool does not disclose independent segment shares, approval funnels, or loss
      curves by vertical, valuation should weight execution and capital continuity more heavily
      than headline TAM rhetoric.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM012", "CM013"]
