callouts:
  - calloutType: "risk"
    title: "Valuation depends more on execution and capital continuity than on a headline TAM"
    body: >-
      The assigned evidence supports a real, expanding niche with strong channel fit, but it does
      not independently prove a clean SAM or durable market share curve. Investors should underwrite
      Octane as a dealer/OEM finance infrastructure story that still needs segment-level proof on
      penetration, funding resilience, and credit performance.
    claimRefs: ["CM003", "CM004", "CM006", "CM011", "CM012"]
