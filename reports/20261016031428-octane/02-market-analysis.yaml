      - ["Dealer partner", "Needs higher close rates and a faster F&I workflow", "Sales and finance staff", "Dealer bears workflow friction and lost conversion when finance is slow", "Single platform manages prequalification through closing", "Dealer GM / F&I operating budget", "Better conversion, shorter cycle times, and support for more credit tiers"]
      - ["OEM / manufacturer", "Wants branded finance without building its own captive lender", "Sales, finance, and channel-marketing teams", "OEM funds promotions and program design while capital partners fund receivables", "Captive-as-a-Service launch with partner-branded finance", "Retail-finance and channel budget", "Higher dealer loyalty, promotional control, and incremental unit sales"]
      - ["Capital partner", "Seeks exposure to niche consumer-credit collateral", "Private-credit and ABS teams", "Institutional capital funds receivables or purchases loans", "Forward-flow, whole-loan sale, or ABS channel", "Private credit / securitized products allocation", "Validated credit performance and differentiated asset class"]
      - ["Co-lending partner", "Covers prime borrowers while Octane serves near-prime applicants", "Bank dealer-finance team plus Octane underwriting stack", "Prime lender or Roadrunner depending on credit box", "Shared dealer portal from prequalification through closing", "Consumer-lending budget plus dealer-enablement budget", "One workflow spanning prime and near-prime borrowers"]
    notes: >-
