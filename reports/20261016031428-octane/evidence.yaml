evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board roster, board rights, voting control, cap-table ownership percentages, and any liquidation
      preference or side-letter terms.
    whyItMatters: >-
      Without governance and control data, later judgment on stakeholder influence, founder dependence, and downside
      protection remains incomplete.
    diligencePath: >-
      Request the latest board deck or governance appendix plus a fully diluted cap table from management or lead
      investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      A reconciled funding ledger separating primary equity, secondaries, warehouse lines, forward-flow facilities, and
      securitization commitments.
    whyItMatters: >-
      Conflicting public tallies make it hard to judge dilution, capital efficiency, and how much current valuation
      support comes from equity versus structured credit.
    diligencePath: Ask management for a round-by-round financing schedule that reconciles company, investor, and database figures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: borrower-and-financial-disclosure
    missingEvidence: Active borrower count, audited revenue and EBITDA, charge-offs, delinquency by vintage, and unit-economics detail.
    whyItMatters: >-
      The business depends on underwriting quality and capital-markets credibility, so topline and originations alone
      are insufficient for investment judgment.
    diligencePath: >-
      Request audited financial statements, servicing KPIs, and a portfolio performance pack from management or
      financing partners.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent vertical-by-vertical spend, financing penetration, and geography splits for powersports, RV, marine,
      OPE, and trailer finance.
    whyItMatters: Without an external decomposition, TAM/SAM/SOM remains too broad for precise share or valuation underwriting.
    diligencePath: >-
      Pull industry association shipment and registration datasets, lender securitization collateral mixes, and any
      management segmentation that isolates financed volume by vertical.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: capital-intensity
    missingEvidence: >-
      Segment-level approval rates, conversion funnels, delinquency curves, charge-offs, and funding economics by
      vertical.
    whyItMatters: >-
      These data determine whether Octane's growth is durable and profitable across adjacent categories or still
      dependent on favorable credit and funding conditions.
    diligencePath: >-
      Request vintage loss data, warehouse and ABS investor materials, and management reporting that breaks conversion
      and credit outcomes out by market.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public APR ranges, merchant-fee economics, dealer discounting, and contract terms for Octane and its named rivals.
    whyItMatters: >-
      Without disclosed commercial terms, the chapter can compare packaging and workflow breadth but not true pricing
      power or margin pressure.
    diligencePath: >-
      Request dealer rate sheets, merchant agreements, and win/loss analyses for Octane, RouteOne-connected lenders,
      Capital One Auto Finance, Westlake, and Santander.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: trust-and-regulatory-posture
    missingEvidence: >-
      Complaint volumes, servicing performance metrics, licensing coverage, and regulatory examination history for
      Roadrunner Financial and named incumbents.
    whyItMatters: >-
      Trust and regulatory posture are part of the comparison brief, but the assigned pool has no public
      apples-to-apples record on those dimensions.
    diligencePath: >-
      Collect NMLS records, state licensing inventories, CFPB or BBB complaint extracts, and OEM diligence packages for
      Octane and key lenders.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Partner retention, multi-homing rates, dealer conversion lifts versus alternatives, and OEM renewal history.
    whyItMatters: Moat durability depends on whether partners actually standardize on Octane or keep multiple financing stacks live.
    diligencePath: >-
      Request cohort retention, multi-lender routing data, renewal terms for Polaris, BRP, Forest River, and Huntington
      programs, plus dealer win/loss studies.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: Audited GAAP income statement, balance sheet, and cash-flow statement for 2024-2026 YTD
    whyItMatters: >-
      Revenue quality, true profitability, and self-funding capacity cannot be underwritten from press releases and
      secondary summaries
    diligencePath: Request audited financial statements plus a management bridge from originations to recognized revenue and EBITDA
    relatedQuestionRefs:
      - QI003
      - QI007
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-margin
    missingEvidence: >-
      CAC, dealer activation cost, payback, gross margin, gain-on-sale margin, servicing margin, and subsidy economics
      by product line
    whyItMatters: Growth can be high while contribution margin is negative or partner-funded promotions distort economics
    diligencePath: >-
      Request cohort economics by channel and product, including marketing spend, contribution margin, and retained
      spread
    relatedQuestionRefs:
      - QI002
      - QI005
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: credit-performance
    missingEvidence: Vintage-level delinquency, charge-off, recovery, and loss-severity data for Roadrunner-originated portfolios
    whyItMatters: Lending-model durability depends on credit quality, not only origination growth or ABS market access
    diligencePath: Obtain loan-performance tapes and warehouse / securitization performance reports by vintage and asset class
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI007
  - type: conflicting-data
    severity: material
    topic: funding-history-consistency
    missingEvidence: Reconciled cap table and signed financing history that resolves discrepancies between third-party funding datasets
    whyItMatters: Historical fundraising should not be used as a proxy for current cash or dilution when public datasets disagree
    diligencePath: Request cap-table summary, round documents, and a management memo reconciling primary versus secondary proceeds
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-covenants
    missingEvidence: Cash balance, warehouse capacity, covenant package, and downside liquidity plan
    whyItMatters: Repeated ABS and forward-flow execution shows access to funding, but not resilience if financing markets tighten
    diligencePath: Request treasury liquidity schedule, warehouse agreements, covenant headroom, and scenario-based runway analysis
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Independent or primary evidence for security certifications, privacy controls, uptime and incident history,
      disaster recovery, model governance, and quality-control testing.
    whyItMatters: >-
      Product breadth does not establish whether a regulated financing workflow meets institutional standards for
      security, privacy, resilience, and control execution.
    diligencePath: >-
      Request SOC 2 or equivalent reports, penetration-test summaries, security and privacy architecture,
      business-continuity targets, model-governance documentation, and historical incident and uptime reporting.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: integration-performance
    missingEvidence: >-
      Dealer and OEM implementation metrics including onboarding time, integration effort, approval latency, conversion
      lift, active use, support SLA attainment, and partner economics.
    whyItMatters: >-
      The value and defensibility of embedded finance and branded captive programs depend on measurable deployment and
      operating performance, not launch announcements alone.
    diligencePath: >-
      Request implementation plans and KPI dashboards for representative OEM and dealer programs, plus reference calls
      covering integration workload, reliability, support, and realized economics.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public or private developer and practitioner evidence such as API documentation, SDKs, integration guides,
      engineering talks, repository activity, package usage, or technical partner references.
    whyItMatters: >-
      Without a developer or practitioner trail, outside investors cannot assess integration ergonomics, technical
      depth, external builder adoption, or the maintenance burden placed on partners.
    diligencePath: >-
      Ask management for API and integration documentation, engineering architecture reviews, partner technical
      references, and any internal developer-adoption and integration-support metrics.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: NRR, GRR, borrower or dealer churn, renewal rates, average contract duration, and cohort retention by channel.
