  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >
        Dated repeat-purchase, customer-cohort, churn, customer concentration,
        and lifetime-value measures with population definitions and channel or
        city denominators.
      whyItMatters: >
        Store openings and campaign examples do not show that customers return,
        spend more over time, or are diversified across geographies and
        channels; without these measures customer durability and concentration
        cannot be assessed.
      diligencePath: >
        Request monthly transaction cohorts, loyalty and repeat-purchase
        measures by city and channel, top-city/store and customer concentration
        schedules, and definitions reconciling active users with transactions.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU002
    - type: missing-source
      severity: material
      topic: customer-engagement
      missingEvidence: >
        Representative campaign engagement, satisfaction, purchase conversion,
        and repeat-use outcomes with sample sizes and measurement periods.
      whyItMatters: >
        Qualitative positive reactions and isolated examples cannot show whether
        campaigns acquire incremental customers or deepen durable engagement.
      diligencePath: >
        Request campaign-level reach, redemption, conversion, and repeat-order
        reports with control periods and channel-specific denominators.
      relatedQuestionRefs:
        - QU008
      relatedTableRefs:
        - TU003
tables:
  - id: TU001
    title: Customer segmentation supported by public evidence
    columns:
      - Segment or use case
      - Buyer, user, payer
      - Supported proposition
      - Scale or value evidence
      - Unresolved diligence point
    rows:
      - - Urban office workers
        - End consumer; payer is not separately identified
        - Lower-priced coffee and office-area convenience
        - Qualitatively described by Bamboo Works and CBBC; no segment share
        - Customer count, sales mix, and repeat frequency
      - - City-centre convenience seekers
        - Retail consumer; payer not separately identified
        - Small-format stores and fast pickup or delivery
        - World Coffee Portal reports format and use case, not channel mix
        - Order channel split, utilization, and realized basket value
      - - Consumers reached by co-branded campaigns
        - End consumer
        - Co-branded drink and mini-program pickup interaction
        - Dao Insights describes the activation and qualitative reactions
        - Participation, conversion, and incremental repeat purchase
    notes: >
      Segment descriptions are qualitative third-party reporting, not a
      measured customer census; unknown means the assigned sources do not
      report the quantity.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU009
  - id: TU002
    title: Reported store-count trajectory, not customer growth
    columns:
      - Report period
      - Reported Manner store count
      - Source and count definition
      - Customer-adoption interpretation
    rows:
      - - 2021
        - 194
        - Bamboo Works; reported store count
        - Physical footprint only; no customer denominator
      - - November 2022
        - More than 300
        - World Coffee Portal; mainland China stores
        - Physical footprint only; no repeat or usage measure
      - - June 2024
        - 1,295
        - Global Times; company-operated stores nationwide
        - Physical footprint only; no utilization measure
      - - November 13, 2025
        - 2,234
        - FoodTalks citing Narrow Door Restaurant Eye; directly operated nationwide
        - Physical footprint only; no transaction or retention denominator
    notes: >
      Publication-reported counts have differing dates, geographic wording,
      and cited underlying sources; they are not a harmonized customer series
      and do not measure active users, transactions, same-store sales, or
      retention.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
  - id: TU003
    title: Named customer proof table
    columns:
      - Public example
      - Evidence observed in the assigned sources
      - Proof category
      - Limitation
    rows:
      - - Manner–Kimi campaign
        - Co-branded drink and mini-program pickup interaction reported in 2025
        - Customer-facing digital activation
        - No audience, conversion, or repeat-purchase data
      - - Trip.com North Bund user post
        - Recommends securing seating first and says to expect a wait
        - Customer-review signal
        - Self-selected, undated, and not representative
      - - Shanghai customer–barista incidents
        - Three conflicts and Manner's response reported in June 2024
        - Adverse customer-experience evidence
        - Article does not establish incidence across the store base
      - - Jinhongqiao International Center review
        - One Tripadvisor review says it is not ideal for quick visits during busy hours
        - Individual customer account
        - Anecdotal; no prevalence or verified date in fetched text
    notes: >
      Manner is a consumer retail chain, so these are named consumer touchpoints
      and public reviews rather than enterprise customer deployments. They are
      a selected sample, not an exhaustive list, and do not establish
      satisfaction prevalence or measured business outcomes.
    enumerationScope:
      coverage: sample
      basis: >
        Selected public-facing cases in the assigned source pool from
        2022–2025 plus undated user reviews; not a census of outlets, customers,
        or campaigns.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU015
figures:
