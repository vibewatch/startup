chapter:
  number: 6
  title: Customers
  summary: >
    Public evidence describes Manner as a small-format, value-oriented coffee
    chain aimed at urban office and convenience use, with reported store counts
    rising from 194 in 2021 to 2,234 as of November 13, 2025. That footprint is
    an adoption proxy, not a customer count or proof of repeat purchase; public
    evidence in this allocation does not quantify retention, cohorts, customer
    concentration, or unit-level customer economics.
sections:
  - id: customer-segments
    title: Customer segments and purchase proposition
    body: >
      The available sources describe a predominantly urban convenience
      proposition rather than a measured customer mix. Bamboo Works reported
      that Manner became popular with young office workers for lower-priced
      coffee, while World Coffee Portal described small shops in high-footfall
      office locations and demand for speed, pickup, and delivery. These reports
      support an office-worker and convenience-seeker use case, but neither
      provides the share of sales, active users, or revenue attributable to
      those segments (CU001, CU002). A 2025 FoodTalks article put reported
      product prices primarily at RMB 15–25; this is a published price range,
      not evidence of realized average transaction value or price elasticity
      (CU003). The reported Kimi collaboration shows a digital ordering
      touchpoint, but no participant count or conversion result (CU009).
      Accordingly, segment sizes and payer mix remain unquantified.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU009
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-footprint
    title: Store footprint is the clearest adoption proxy
    body: >
      Publicly reported store totals indicate substantial footprint expansion:
      Bamboo Works reported 194 stores in 2021, World Coffee Portal reported
      more than 300 mainland stores in November 2022, Global Times reported
      1,295 company-operated stores in June 2024, and a November 2025
      FoodTalks article cited 2,234 directly operated stores as of November 13,
      2025 (CU004–CU007). These are dated, source-attributed counts compiled
      from different publications and underlying data providers; they should
      not be treated as a harmonized series of unique customers, transactions,
      utilization, same-store sales, or revenue. The 2022 report also described
      a Hong Kong location under renovation and anticipated a market entry
      (CU008), but that historical report does not verify a completed opening
      or current Hong Kong operations. Outlet expansion therefore establishes
      wider physical reach, while the commercial quality and durability of
      adoption remain unresolved.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU002
  - id: customer-proof-and-friction
    title: Public customer-facing proof is mixed and thin
    body: >
      Named public examples establish customer-facing activity, not a reference
      base. Dao Insights described a Manner–Kimi campaign that paired a
      co-branded drink with pickup lines delivered through Manner’s mini
      program; it characterized online reactions as positive but supplied no
      sample size or conversion measure (CU009). World Coffee Portal’s account
      of the proposed Hong Kong shop is historical expansion evidence, not a
      customer outcome (CU008). Counterevidence is material: Global Times
      described three customer–barista conflicts following long waits and
      reported Manner’s apology and promised operating changes in June 2024
      (CU010, CU011). Trip.com user posts include praise for coffee and
      ambience alongside wait warnings; one North Bund post recommends
      securing seating before ordering, while an undated TripAdvisor review
      tied to Jinhongqiao says the location is not ideal for quick visits
      during busy hours (CU012, CU015). These self-selected accounts cannot
      establish complaint prevalence. No assigned source supplies a
      representative satisfaction survey or independently verified
      named-customer reference with measured business outcomes. The examples
      below are a selected public sample, not a census.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: durability-and-concentration
    title: Retention, expansion, and concentration remain diligence gaps
    body: >
      The allocated sources do not establish repeat-purchase rates, customer
      cohorts, churn, store-level frequency, lifetime value, or customer
      concentration (CU013). The Atlantis Press conference abstract frames
      its paper around promotion and consumer engagement but does not report a
      quantified engagement or retention outcome in the fetched abstract
      (CU014). This evidence gap prevents a distinction between sustained
      customer loyalty and footprint-led reach, and leaves the durability of
      demand and dependence on any particular geography or channel uncertain.
      Customer concentration is also not directly measurable for a consumer
      retail chain from the store totals and isolated customer-facing examples
      available here. Diligence should request dated same-store sales and
      transaction cohorts, repeat-purchase and loyalty data by city and
      channel, customer complaint and service-level trends, and store-level
      contribution data with clear denominators. Until those records are
      available, expansion is observable but retention and customer economics
      should remain open questions.
    claimRefs:
      - CU013
      - CU014
