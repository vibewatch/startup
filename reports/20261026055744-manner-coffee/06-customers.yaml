    title: Evidence-linked customer journey and unresolved return loop
    type: journey-map
    summary: >
      Public sources describe convenience, ordering, service, and isolated
      feedback, while measured repeat behavior remains unavailable.
    data:
      nodes:
        - id: discovery
          label: Office-area discovery
          details: Small-format locations are described near busy office areas.
          touchpoints:
            - Office workers
            - High-footfall locations
        - id: choice
          label: Value-oriented choice
          details: A 2025 article reports product prices primarily at RMB 15–25.
          touchpoints:
            - Coffee and latte
            - Reported price range
        - id: order
          label: Ordering interaction
          details: A 2025 co-brand campaign used Manner's mini program.
          touchpoints:
            - Mini-program ordering
            - AI-generated pickup line
        - id: fulfillment
          label: Pickup and service
          details: Reports describe speed and pickup demand alongside wait-time complaints.
          touchpoints:
            - Pickup or delivery use case
            - Reported wait-time friction
        - id: feedback
          label: Customer feedback
          details: Public evidence includes customer reviews and reported customer incidents.
          touchpoints:
            - Trip.com and Tripadvisor user reviews
            - 2024 reported conflicts
        - id: return
          label: Repeat purchase unknown
          details: No assigned source quantifies cohorts, retention, or repeat frequency.
          touchpoints:
            - Retention data gap
            - City and channel cohorts needed
    claimRefs:
      - CU002
      - CU003
      - CU009
