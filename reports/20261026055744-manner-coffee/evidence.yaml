evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, ARR, EBITDA, cash balance, debt, current valuation, employee count and a reconciled current cap
      table.
    whyItMatters: >-
      Without current financial and capitalization evidence, reported fundraising and IPO speculation cannot establish
      liquidity, operating performance or investor returns.
    diligencePath: >-
      Request audited financial statements, current management accounts, cash and debt schedules, cap-table records,
      employee count and any current valuation materials.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      A dated executive roster, board and committee composition, leadership-change history, decision rights and
      succession documentation.
    whyItMatters: Founder names alone do not establish current leadership coverage, governance quality or key-person dependence.
    diligencePath: >-
      Request a current organization chart, board materials, committee mandates, leadership-change log and succession
      plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: trademark-and-legal-risk
    missingEvidence: >-
      Primary trademark records, court or administrative filings, and a current company or counsel explanation of the
      reported Josef Manner dispute.
    whyItMatters: >-
      The available teaching-case excerpt is not a primary legal record and cannot establish whether the reported issue
      remains active or affects operating rights.
    diligencePath: >-
      Review relevant trademark registries and court records, then obtain company counsel's status and market-by-market
      rights analysis.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Dated primary or independent records for product launches, regulatory milestones, partnerships, governance changes
      and adverse events beyond the selected timeline.
    whyItMatters: The timeline is a source-constrained subset and should not be read as a complete corporate history.
    diligencePath: >-
      Reconcile company announcements, regulatory records, investor materials and dated news coverage into a milestone
      register.
  - type: conflicting-data
    severity: material
    topic: coffee-market-sizing
    missingEvidence: >-
      A comparable, source-linked China coffee consumption and retail-sales series with a clear product boundary,
      channel coverage, geography, and vintage is unavailable in the assigned evidence.
    whyItMatters: >-
      The retained market-value and per-capita figures use unclear or unreconciled definitions and cannot support a
      defensible TAM, SAM, or Manner share.
    diligencePath: >-
      Obtain the underlying datasets and definitions from a named industry body or analyst, then reconcile them with
      consumer café transactions and channel splits before modeling.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: manner-store-economics
    missingEvidence: >-
      Current store-level sales, same-store growth, average ticket, repeat purchase, promotion-adjusted price, labor
      cost, and mature-store contribution margins are not disclosed in the assigned sources.
    whyItMatters: >-
      Without these company-specific inputs, broad category growth or store counts cannot establish Manner's serviceable
      revenue or attractive unit economics.
    diligencePath: >-
      Request a dated store cohort and unit-economics pack by city, format, and store maturity, with definitions and
      reconciliation to audited financial statements.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      A current, city-level estimate of buyer counts, occasion frequency, willingness to pay, and channel substitution
      by consumer segment is unavailable.
    whyItMatters: >-
      Descriptive buyer archetypes do not quantify how much demand can support Manner's locations or distinguish trial
      from repeat purchasing.
    diligencePath: >-
      Obtain consumer research and transaction cohorts segmented by city, occasion, order channel, price paid, and
      repeat frequency.
    relatedQuestionRefs:
      - QM004
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: Manner current competitive economics
    missingEvidence: >-
      Current audited or management-reconciled store count, same-store sales, realized prices, store contribution
      margin, payback, and city-level cohorts for Manner.
    whyItMatters: >-
      Historical sources describe a differentiated format but cannot show whether it remains profitable or scales
      outside its concentrated urban base.
    diligencePath: >-
      Obtain the latest monthly operating pack by store vintage and city, with definitions for sales, labor, rent,
      delivery mix, and closures.
    relatedQuestionRefs:
      - QP002
      - QP007
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: customer switching and multi-homing
    missingEvidence: >-
      Independent cohort, loyalty, repeat-purchase, switching, and multi-homing evidence across Manner and its
      competitors.
    whyItMatters: >-
      Without retention and substitution evidence, format differentiation cannot be translated into durable
      customer-level advantage.
    diligencePath: >-
      Request anonymized repeat-purchase cohorts and commission independent customer research across comparable cities
      and price tiers.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
