  - id: TV003
    title: Bull, base, and bear underwriting cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation range
      - Probability signal
      - Decision trigger
    rows:
      - - Bull
        - >-
          Audited cohorts validate repeatable contribution and payback beyond core cities; current terms show manageable
          dilution.
        - Not supportable from assigned evidence; the reported USD 3 billion possible IPO value is not an anchor.
        - Conditional upside; no calibrated probability.
        - Reconsider only when audited expansion returns and fully diluted terms support the proposed price.
      - - Base
        - >-
          The reported store footprint remains meaningful, but consolidated profit, cash conversion, and listing terms
          remain unverified.
        - Not supportable; dated private marks are not a current fair-value range.
        - Working diligence case, not a probability estimate.
        - Maintain research-more until current financials and transaction documents are reviewed.
      - - Bear
        - >-
          Demand outside the core is insufficient or labor, price competition, or trademark constraints reduce returns
          or expansion.
        - Not supportable; downside cash flows, debt, and preference claims are undisclosed.
        - Material downside; magnitude and probability are uncalibrated.
        - Defer or reject if audited cohorts fail the return hurdle or legal/financing terms impair common equity.
    notes: >-
      These are conditional underwriting cases, not forecasts. The retained sources do not establish audited earnings,
      current equity value, capital structure, or comparable multiples, so numeric ranges and probability weights would
      be false precision.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
