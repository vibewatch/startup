      - number: '5.2'
        title: Store workflow and operating model
        blocks:
          - type: paragraph
            body: >-
              The evidence points to an operating system in which coffee sourcing and equipment meet skilled in-store
              preparation, with the customer receiving a made-to-order drink through a compact retail footprint. A
              KrASIA article reports small stores, direct sales and semi-automatic machines; its throughput figures are
              media claims, not audited company data or a comparable benchmark (CE006, CE007, CE015). A China
              Entrepreneur article republished by FoodTalks describes the early outlet as a two-square- metre window
              shop and reports direct operation at the time of its account (CE008). It also reports an employee survey
              about possible franchising, but quotes a person close to Manner saying there were no near-term plans then
              (CE009). Manner's own website says it has never opened a franchise or agency; that statement does not
              establish the current legal status of every store arrangement (CE010). The workflow's customer benefit,
              queue time, quality consistency and store-level economics are not independently quantified.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE011
              - CE012
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE011
              - CE013
              - CE015
      - number: '5.3'
        title: Maturity, trust and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence is uneven: media profiles describe equipment and training, while reporting identifies
              operational pressure points that can affect service quality. Global Times reported customer-barista
              conflicts in 2024 after long waits and described Manner's stated plans to reduce waiting time and improve
              barista care (CE011, CE012). The reported incidents make labor capacity, queue management and escalation
              procedures diligence priorities; they do not quantify incident rates or prove a persistent failure. A 2024
              brand-communication profile asserts automated ordering and scheduling, but gives no system names,
              implementation evidence or reliability measures (CE005). The 2025 academic case-study materials mention
              technological innovation without identifying an architecture or technical proof (CE014) and identify a
              trademark dispute affecting brand identity (CE004). The retained evidence does not establish uptime,
              support commitments, privacy/security controls, food-safety audit cadence, certification scope or roadmap
              delivery. These are evidence gaps, not proof that controls or systems are absent.
            claimRefs:
              - CE004
              - CE005
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and purchase proposition
        blocks:
          - type: paragraph
            body: >
              The available sources describe a predominantly urban convenience proposition rather than a measured
              customer mix. Bamboo Works reported that Manner became popular with young office workers for lower-priced
              coffee, while World Coffee Portal described small shops in high-footfall office locations and demand for
              speed, pickup, and delivery. These reports support an office-worker and convenience-seeker use case, but
              neither provides the share of sales, active users, or revenue attributable to those segments (CU001,
              CU002). A 2025 FoodTalks article put reported product prices primarily at RMB 15–25; this is a published
              price range, not evidence of realized average transaction value or price elasticity (CU003). The reported
              Kimi collaboration shows a digital ordering touchpoint, but no participant count or conversion result
              (CU009). Accordingly, segment sizes and payer mix remain unquantified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU010
              - CU012
              - CU013
              - CU015
      - number: '6.2'
        title: Store footprint is the clearest adoption proxy
        blocks:
          - type: paragraph
            body: >
              Publicly reported store totals indicate substantial footprint expansion: Bamboo Works reported 194 stores
              in 2021, World Coffee Portal reported more than 300 mainland stores in November 2022, Global Times
              reported 1,295 company-operated stores in June 2024, and a November 2025 FoodTalks article cited 2,234
              directly operated stores as of November 13, 2025 (CU004–CU007). These are dated, source-attributed counts
              compiled from different publications and underlying data providers; they should not be treated as a
              harmonized series of unique customers, transactions, utilization, same-store sales, or revenue. The 2022
              report also described a Hong Kong location under renovation and anticipated a market entry (CU008), but
              that historical report does not verify a completed opening or current Hong Kong operations. Outlet
              expansion therefore establishes wider physical reach, while the commercial quality and durability of
              adoption remain unresolved.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Public customer-facing proof is mixed and thin
        blocks:
          - type: paragraph
            body: >
              Named public examples establish customer-facing activity, not a reference base. Dao Insights described a
              Manner–Kimi campaign that paired a co-branded drink with pickup lines delivered through Manner’s mini
              program; it characterized online reactions as positive but supplied no sample size or conversion measure
              (CU009). World Coffee Portal’s account of the proposed Hong Kong shop is historical expansion evidence,
              not a customer outcome (CU008). Counterevidence is material: Global Times described three customer–barista
              conflicts following long waits and reported Manner’s apology and promised operating changes in June 2024
              (CU010, CU011). Trip.com user posts include praise for coffee and ambience alongside wait warnings; one
              North Bund post recommends securing seating before ordering, while an undated TripAdvisor review tied to
              Jinhongqiao says the location is not ideal for quick visits during busy hours (CU012, CU015). These
              self-selected accounts cannot establish complaint prevalence. No assigned source supplies a representative
              satisfaction survey or independently verified named-customer reference with measured business outcomes.
              The examples below are a selected public sample, not a census.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU015
      - number: '6.4'
        title: Retention, expansion, and concentration remain diligence gaps
        blocks:
          - type: paragraph
            body: >
              The allocated sources do not establish repeat-purchase rates, customer cohorts, churn, store-level
              frequency, lifetime value, or customer concentration (CU013). The Atlantis Press conference abstract
              frames its paper around promotion and consumer engagement but does not report a quantified engagement or
              retention outcome in the fetched abstract (CU014). This evidence gap prevents a distinction between
              sustained customer loyalty and footprint-led reach, and leaves the durability of demand and dependence on
              any particular geography or channel uncertain. Customer concentration is also not directly measurable for
              a consumer retail chain from the store totals and isolated customer-facing examples available here.
              Diligence should request dated same-store sales and transaction cohorts, repeat-purchase and loyalty data
              by city and channel, customer complaint and service-level trends, and store-level contribution data with
              clear denominators. Until those records are available, expansion is observable but retention and customer
              economics should remain open questions.
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant documented risks are the unresolved brand-rights issue reported in 2021 and the
              2024 reports of employee-customer incidents, long waits, and staffing pressure. Neither establishes the
              present status of the trademark matter or the frequency of current operating problems. Later reports
              describe only preliminary Hong Kong listing discussions, not completed financing or cash availability.
              Historical reporting also placed much of Manner's footprint in a small set of major cities; that is a
              concentration signal, not a current store map. The qualitative matrix therefore separates potential impact
              from unknown likelihood and unverified mitigation. No public evidence in this allocation establishes a
              Manner food-safety violation, current license deficiency, or post-incident control failure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The China Project reported that an Austrian confectionery company named Manner had registered a logo in a
              category including coffee, while Manner Coffee had encountered repeated trademark-registration rejections;
              the article quoted an unnamed lawyer describing the ground as questionable. This is a dated report, not
              confirmation of a live case or a current prohibition, but it warrants current counsel-led status
              verification before treating brand rights as secure. Separately, CIRS summarized SAMR food-business
              licensing review requirements for chain-enterprise headquarters and stores, and the State Council
              Information Office reported a 2025 government guideline strengthening food-safety supervision across the
              supply chain. These sources describe the operating environment, not Manner's compliance status. A
              license-by-license map, inspection history, audit cadence, and corrective-action records are absent from
              the allocated evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
      - number: '7.3'
        title: Frontline staffing, service, and quality
        blocks:
          - type: paragraph
            body: >-
              Global Times and Radii reported separate June 2024 accounts of customer-barista altercations, long waits,
              and criticism of staffing arrangements. Global Times also reported Manner's stated response: reduce
              waiting time, optimize store operations, and pay more attention to baristas. Those reports support a
              historical labor-and-service risk, but the evidence does not quantify recurrence, employee turnover,
              injuries, food-safety outcomes, or the effectiveness of the promised changes. Rapid service growth can
              make staffing, training, and quality controls mutually reinforcing: inadequate coverage may increase waits
              and pressure, while throughput demands can weaken execution. The company-specific leading indicators
              needed to test that mechanism—staffing by shift, wait-time distributions, complaints, attrition, training
              completion, and audit exceptions—are not supplied here.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
      - number: '7.4'
        title: Market, financial, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Industry coverage describes aggressive delivery-platform subsidies and price-led competition, while a
              China-market advisory article discusses margin pressure among competitors; neither provides Manner's own
              realized prices, margins, or promotion exposure. The risk is conditional: if Manner responds to discounts
              without preserving store-level contribution economics, the price-value proposition could erode returns,
              but the public evidence cannot quantify that sensitivity. KrASIA's 2023 account cited third-party
              store-location estimates showing concentration in leading cities; these are historical estimates and
              should not be treated as the current footprint. MARKETECH APAC, citing Bloomberg, described preliminary
              Hong Kong IPO talks with changeable terms and timing. A possible listing is not funding raised or cash
              available. Supplier, landlord, delivery-platform, and capital-provider concentrations remain unmeasured,
              so investment underwriting should require current store cohorts, partner exposure, financing status, and
              downside triggers.
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical marks do not establish a current entry price
        blocks:
          - type: paragraph
            body: >-
              The investment call is research-more, with low confidence in any point estimate and high risk from
              financial and transaction opacity. ARC Group reported a USD 2.5 billion valuation in June 2021 and an IPO
              plan for 2022; BambooWorks later described a market value estimated above USD 2 billion. November 2025
              coverage was still conditional: World Coffee Portal said Manner could fetch USD 3 billion in a Hong Kong
              listing, while GuruFocus News reported a possible USD 3–4.5 billion range. These are dated or
              forward-looking media reports, not priced transactions or issuer-confirmed current equity values. The
              sources also do not provide current fully diluted ownership, preference terms, debt, cash, or audited
              earnings with which to translate a headline valuation into common-equity value. Do not set a target return
              or treat the reported IPO values as an entry anchor.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Store economics are promising reports, not underwriting-grade evidence
        blocks:
          - type: paragraph
            body: >-
              The affirmative case is a scaled, direct-operated coffee chain with reported store income that could
              support compact-format economics. KrASIA attributes average daily income of RMB 7,000–8,000 per store to a
              Zheshang Securities analysis and describes a monthly net-profit estimate using a 23.75% margin; both are
              secondary figures, and the profit calculation assumes the high end of the income range. The same 2023
              coverage reports 88% of stores in five cities and says lower-tier demand may not reproduce first-tier
              results. Global Times reported 1,295 company-operated stores in 2024, but store count does not establish
              profitability. Its report also describes customer- barista conflicts, workload criticism, and a staffing
              rule attributed to other media. An IGI Global teaching-case abstract flags a trademark issue affecting
              brand identity and expansion, without providing a current legal-status record. These are material
              sensitivities to store contribution, rollout returns, and exit value.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: No defensible comparable multiple or scenario range is available
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a numeric bull, base, or bear valuation range, return target, or
              probability weight. The dated private-company marks use no disclosed common valuation basis, while the
              2025 IPO figures are possibilities rather than completed financing terms. KrASIA's store estimates are not
              audited consolidated earnings, and the fetched Starbucks investor page is a company-issued index of annual
              reports, quarterly results, and SEC filings—not a normalized Manner-versus-peer valuation benchmark.
              Competitor comparisons in editorial coverage are useful for identifying pressure on price and format, but
              they are not independent transaction benchmarks. A public-comparable method would require current Manner
              revenue, earnings, net debt, share count, and transaction terms alongside peer metrics on a consistent
              basis. Until those inputs exist, the scenarios below state conditions and decision triggers rather than
              invented values.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.4'
        title: Primary financial and legal evidence should determine the next decision
        blocks:
          - type: paragraph
            body: >-
              Before reconsidering an entry, request audited consolidated accounts and a reconciled store cohort pack
              showing revenue, store contribution, rent and labor, maintenance capex, mature-store performance, and
              expansion payback by city and vintage. Obtain the current cap table, fully diluted share count,
              share-class rights, liquidation preferences, anti-dilution provisions, debt, cash, and any secondary-sale
              or IPO documents; funding raised is not cash available to common shareholders. Confirm whether a Hong Kong
              listing process has advanced beyond the conditional 2025 media reports. For the trademark issue, obtain
              current registry and court records plus counsel's assessment of any naming or expansion constraints.
              Upgrade the thesis only if independently reviewable unit economics repeat outside the concentrated core
              and transaction terms leave a supportable return after dilution. Reassess downward if audited cohorts fail
              to cover operating and reinvestment costs, or if labor, demand, or legal constraints impair expansion.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
