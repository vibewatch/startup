        - Test mature and new-store cohorts by city, vintage, and local price level.
      - - Labor and service
        - Global Times reported customer-barista conflicts and a staffing rule attributed to media reports.
        - Service capacity and labor cost may constrain throughput and expansion.
        - Review incident rates, staffing, turnover, and remediation outcomes.
      - - Brand and legal status
        - An IGI Global case abstract describes a trademark issue affecting brand identity and expansion.
        - Potential rebranding or geographic constraints could impair exit readiness.
        - Obtain current trademark registry, court, and counsel records.
      - - Financing and exit
        - 2025 articles described a possible Hong Kong IPO, not a completed or priced transaction.
        - IPO speculation is not a liquidity event or a common-share valuation.
        - Verify listing filings, financing terms, share classes, and dilution.
    notes: >-
      Operating and valuation figures are attributed to their publishers and retain their stated periods and
      denominators; no company-audited figures or legal-status conclusions are inferred from these reports.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
