  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The contestable market is urban prepared coffee, not all coffee spend
        blocks:
          - type: paragraph
            body: >-
              The most defensible core boundary is consumer spending on prepared coffee bought from cafés and compact
              takeaway formats, with Manner's reported positioning concentrated in urban, high-traffic locations. This
              is narrower than all coffee consumption: home brewing, instant and ready-to-drink products, coffee beans,
              equipment, and non-coffee beverages are adjacent occasions or upstream markets, not automatically Manner
              revenue. Published descriptions characterize Manner as a compact, affordable, quality-led chain, while
              other accounts distinguish specialty experiences from discount-led coffee. Those descriptions help frame
              the competitive set but do not demonstrate the company's current sales mix or the size of the segment it
              can serve (CM001, CM002, CM003). The reported Shanghai café count is from March 2021, and Manner's city
              concentration figures are from 2023; neither should be presented as a 2026 addressable-market count
              (CM004).
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
      - number: '2.2'
        title: Public sizing indicators do not yet support a defensible TAM or SAM
        blocks:
          - type: paragraph
            body: >-
              Available estimates measure different things and vintages. A 2026-updated statistics page gives a $48
              billion China coffee-market figure for 2022, but the fetched page does not expose its underlying source
              links and also reports consumption quantities that cannot be reconciled from the displayed methodology;
              treat its numbers as unverified, not as a valuation input (CM006). A coffee-industry article reports
              2024/25 domestic production in bags and a separate per-capita consumption figure, which are supply and
              consumption indicators rather than prepared-café retail sales (CM007, CM009). A dated Shanghai café count
              and company store counts are useful distribution proxies, not spend estimates (CM003, CM005). Starbucks
              footprint reports show the scale of an incumbent, while separate coverage describes pressure from
              lower-priced local chains; neither establishes Manner's share or its serviceable geography (CM008, CM010).
              The schematic below makes the nested sizing questions explicit without assigning unsupported values. TAM,
              SAM, and SOM remain unquantified until channel, geography, transaction, and company-level data can be
              reconciled.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM007
              - CM009
      - number: '2.3'
        title: Buyer segments differ by occasion, price sensitivity, and operating constraints
        blocks:
          - type: paragraph
            body: >-
              For café purchases, the consumer is generally both user and payer; the available sources describe distinct
              occasions rather than a single institutional buyer. Office and commute users value convenient access and
              short waits, while quality-seeking consumers may value bean origin, preparation, and specialty cues.
              Discount-led chains compete for price-sensitive daily purchases, and packaged coffee is an adjacent
              substitute rather than evidence of demand for Manner's stores (CM002, CM010). The adoption case therefore
              depends on local footfall, repeat purchase, realized price after promotions, labor availability, and store
              throughput. Reporting on 2024 service disputes linked wait-time and workload concerns to rapid expansion;
              the assigned 2026 recruitment page exposes no role-level or wage data. These are constraints to diligence,
              not proof of current unit economics or of a sector-wide labor shortage (CM011, CM012, CM014). A 2021
              industry article's per-capita cup figures differ by city tier, but it does not disclose enough methodology
              to size either segment or use the figures as current adoption rates (CM015, CM016).
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM010
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Store counts are distribution evidence, not market share
            body: >-
              The available Shanghai café and chain-footprint figures are dated counts with different publishers and
              definitions; they cannot be converted into Manner's share or addressable revenue.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
          - type: callout
            title: Local economics remain unverified
            body: >-
              Reported wait-time and workload issues make throughput and staffing diligence material, while the assigned
              recruitment page does not disclose roles or wages.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Manner competes across several distinct jobs rather than against one uniform chain. The assigned reporting
              describes its small-footprint, quick-order format as a boutique alternative, while Luckin and Cotti are
              associated with app-led convenience and aggressive promotions, and Starbucks and Peet's with a more
              explicit café or premium experience. These are positioning descriptions, not proof that customers view the
              brands as interchangeable. Manner's reported scale also remains geographically concentrated: a 2023
              analysis citing GeoHey data put about 88% of its stores in five cities and about 56% in Shanghai. That
              concentration may strengthen local density while limiting evidence of repeatable expansion beyond major
              urban markets.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: Price and operating-model trade-offs
        blocks:
          - type: paragraph
            body: >-
              Historical sources place Manner's cup prices around RMB 15–20, with a 2022 British business-council
              article describing prices 30–40% below Western counterparts. These are dated descriptions, not current
              realized prices or a like-for-like price audit. In contrast, 2023 reporting described Luckin and Cotti
              promotions around RMB 9.9, while also portraying Starbucks as selling a café experience rather than only
              takeaway coffee. This leaves Manner exposed to a two-sided choice: preserve a quality-led, small-store
              proposition or respond to promotion-led rivals without evidence here on realized discounts, gross margin,
              or store payback. Public comparisons do not disclose Manner's current unit economics.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP013
      - number: '3.3'
        title: Capability, distribution, and buyer choice
        blocks:
          - type: paragraph
            body: >-
              Available materials distinguish the brands more clearly on format and route to purchase than on product
              quality or customer outcomes. Manner's compact shops and direct-operated footprint contrast with Luckin's
              reported digital capabilities and partnership-store network; Starbucks is described as
              experience-oriented, while Peet's has publicly resisted sacrificing quality for price competition. The
              sources do not provide a comparable blind product test, current delivery coverage, customer retention,
              switching costs, or a verified feature-by-feature menu and service audit. Cells marked unknown therefore
              represent evidence gaps, not evidence that a capability is absent. Substitutes such as office coffee,
              convenience retail, and at-home coffee are not enumerated in this pool.
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP010
              - CP011
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Differentiation durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Manner's small-store, value-led specialty positioning is recognizable, but the sources do not establish
              whether the model's quality, cost, or customer-loyalty advantages persist outside its concentrated city
              base. A 2024 report described staffing arrangements tied to store sales and multiple customer-barista
              conflicts; Manner apologized and said it would address waiting times and barista support. These reports
              are adverse execution signals, not a measure of incident prevalence. A 2025 academic case abstract also
              describes trademark uncertainty involving Josef Manner, without establishing the legal merits or outcome.
              Current private-company economics, labor controls, geographic expansion results, and independent customer
              evidence remain material diligence gaps.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Manner's positioning is a narrow, evidence-backed wedge
            body: >-
              The strongest supported distinction is the combination of small-format operations and historical
              mid-market pricing; neither establishes current store-level returns or a durable moat.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: callout
            title: Scale competitors raise the execution bar
            body: >-
              Luckin's reported store growth coexists with lower same-store sales growth and lower store-level margins
              in Q1 2026; scale alone is not evidence of stronger economics.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: A transaction-led store model, not a disclosed revenue base
        blocks:
          - type: paragraph
            body: >-
              The evidence describes Manner primarily as a direct-operated retail coffee chain: customer purchases at
              compact stores generate the visible revenue stream, with reported cup prices clustered around RMB 15–20 in
              2023 coverage (CI001, CI002). A Day9 directory also lists a 5-yuan bring-your-own-cup discount, but its
              page does not establish whether the offer remains available (CI005). Jiemian Global reported that Manner
              expected to open its 1,000th store in October 2023 and characterized the expansion as achieved without
              franchising (CI001); this is a dated store-count milestone, not a current location count or proof of the
              present operating mix. A British Chamber of Commerce in China article described small shops near business
              centers and office towers as a grab-and-go acquisition model (CI013), but does not quantify channel
              contribution or customer-acquisition cost. The assigned evidence does not establish a consolidated revenue
              figure, revenue mix, recognized revenue policy, or realized net price after discounts and delivery
              commissions. Treat the dated price points as reported price context, not a current price list or revenue
              forecast.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
      - number: '4.2'
        title: Store economics look promising in press estimates, but do not reconcile
        blocks:
          - type: paragraph
            body: >-
              Two 2023 articles offer snapshots rather than a consistent, audited unit-economics series. Jiemian
              reported average daily store revenue of about RMB 7,500, average customer spend near RMB 20 and an implied
              output of approximately 400 cups a day (CI003, CI004). KrASIA later described average store sales above
              500 cups daily, an approximate RMB 11 per-cup cost, a 23.75% net margin and store net profit that “can
              reach” RMB 57,000, without a clear denominator or period for that profit figure (CI006–CI009). The
              differences may reflect timing, store mix or source methodology; the pool does not resolve them. Neither
              reported net margin nor per-cup cost can be promoted to company-wide gross margin, EBITDA, or cash
              generation. Historical estimates can frame diligence questions, but they are not underwriting inputs until
              management supplies definitions, cohort distributions, supporting records and reconciliations.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Compact footprints may help, while labor intensity creates execution risk
        blocks:
          - type: paragraph
            body: >-
              KrASIA reported that claims had surfaced of RMB 300,000 in initial store investment and break-even in just
              over three months (CI010). These are unverified historical claims, not a current capex schedule or
              measured payback cohort; the source does not provide lease obligations, maintenance spend or store-level
              cash flows. In 2024, Global Times reported a staffing allocation attributed to other media: one worker for
              stores below RMB 5,000 in daily sales and two at RMB 6,000 or more (CI011). It also reported
              customer-service incidents and quoted Manner’s commitment to reduce waiting times and improve barista
              support (CI012). This is adverse operating evidence, not a measured labor-cost ratio or proof that
              incidents are systemic. If low staffing is part of the margin model, service capacity, wage levels,
              turnover and peak-period coverage need to be tested alongside rent and store throughput.
            claimRefs:
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Capital adequacy and returns remain unresolved
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not establish current cash, debt, burn, working capital, store-level cash
              conversion, or a financing requirement. Historical funding announcements and valuation references
              elsewhere would not answer those questions even if current: capital raised is not cash available. A 2025
              university study used documentary research and recommended online-channel development and employee-process
              improvements, but it did not quantify channel economics or verify management accounts (CI014). A 2025
              academic case identifies trademark uncertainty as a potential source of operating cost and expansion
              friction, without quantifying exposure (CI015). A July 2025 Zhihu post offers forward store and listing
              scenarios but says its data come from public online information; the retrieved text supplies no auditable
              basis, so these are not company guidance or financing evidence (CI016). The verdict is therefore
              conditional: the small-store model merits diligence, but revenue quality, margin durability, capital
              intensity and runway cannot be underwritten without current primary financials and store cohorts.
            claimRefs:
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI009
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer offer and product components
        blocks:
          - type: paragraph
            body: >-
              Manner's product is a prepared coffee experience rather than a disclosed standalone software or hardware
              product. A 2023 KRASIA account describes classic drinks and semi-automatic preparation, while a 2022 CBBC
              profile discusses Yunnan bean sourcing and barista training (CE001, CE002, CE003, CE006). These are
              historical media descriptions, not a current menu, supplier register, training audit or controlled quality
              comparison. A separate brand feature recounts an early roasting operation, but does not establish its
              present capacity or controls (CE013). An academic case-study abstract refers generally to technological
              innovation without naming a technical product or measured outcome (CE014). Manner's official notice states
              that it has never opened a franchise or agency, a company position rather than an independently audited
              store-ownership list (CE010). Current specifications, system integrations and comparative performance
              remain unverified.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
