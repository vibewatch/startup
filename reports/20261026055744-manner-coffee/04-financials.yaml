schemaVersion: "report-v2"
artifact: financials
slug: manner-coffee
runDate: 2026-10-26
company:
  name: Manner Coffee
chapter:
  number: 4
  title: Financials
  summary: >-
    Public reporting describes a small-format, direct-operated coffee business
    with attractive but highly uncertain store-level economics. The available
    figures are dated secondary estimates, not audited company disclosures;
    current revenue quality, margins, cash needs and runway remain
    un-underwritable from this evidence.
sections:
  - id: revenue-model
    title: A transaction-led store model, not a disclosed revenue base
    body: >-
      The evidence describes Manner primarily as a direct-operated retail
      coffee chain: customer purchases at compact stores generate the visible
      revenue stream, with reported cup prices clustered around RMB 15–20 in
      2023 coverage (CI001, CI002). A Day9 directory also lists a 5-yuan
      bring-your-own-cup discount, but its page does not establish whether the
      offer remains available (CI005). Jiemian Global reported that Manner
      expected to open its 1,000th store in October 2023 and characterized the
      expansion as achieved without franchising (CI001); this is a dated
      store-count milestone, not a current location count or proof of the
      present operating mix. A British Chamber of Commerce in China article
      described small shops near business centers and office towers as a
      grab-and-go acquisition model (CI013), but does not quantify channel
      contribution or customer-acquisition cost. The assigned evidence does
      not establish a consolidated revenue figure, revenue mix, recognized
      revenue policy, or realized net price after discounts and delivery
      commissions. Treat the dated price points as reported price context,
      not a current price list or revenue forecast.
    claimRefs: [CI001, CI002, CI005, CI013]
    tableRefs: [TI001, TI002]
  - id: reported-unit-economics
    title: Store economics look promising in press estimates, but do not reconcile
    body: >-
      Two 2023 articles offer snapshots rather than a consistent, audited
      unit-economics series. Jiemian reported average daily store revenue of
      about RMB 7,500, average customer spend near RMB 20 and an implied
      output of approximately 400 cups a day (CI003, CI004). KrASIA later
      described average store sales above 500 cups daily, an approximate
      RMB 11 per-cup cost, a 23.75% net margin and store net profit that
      “can reach” RMB 57,000, without a clear denominator or period for that
      profit figure (CI006–CI009). The differences may reflect timing,
      store mix or source methodology; the pool does not resolve them.
      Neither reported net margin nor per-cup cost can be promoted to
      company-wide gross margin, EBITDA, or cash generation. Historical
      estimates can frame diligence questions, but they are not underwriting
      inputs until management supplies definitions, cohort distributions,
      supporting records and reconciliations.
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: operating-costs
    title: Compact footprints may help, while labor intensity creates execution risk
    body: >-
      KrASIA reported that claims had surfaced of RMB 300,000 in initial
      store investment and break-even in just over three months (CI010).
      These are unverified historical claims, not a current capex schedule or
      measured payback cohort; the source does not provide lease obligations,
      maintenance spend or store-level cash flows. In 2024, Global Times
      reported a staffing allocation attributed to other media: one worker for stores
      below RMB 5,000 in daily sales and two at RMB 6,000 or more (CI011).
      It also reported customer-service incidents and quoted Manner’s
      commitment to reduce waiting times and improve barista support (CI012).
      This is adverse operating evidence, not a measured labor-cost ratio or
      proof that incidents are systemic. If low staffing is part of the
      margin model, service capacity, wage levels, turnover and peak-period
      coverage need to be tested alongside rent and store throughput.
    claimRefs: [CI010, CI011, CI012]
  - id: capital-adequacy-verdict
    title: Capital adequacy and returns remain unresolved
    body: >-
      The assigned sources do not establish current cash, debt, burn, working
      capital, store-level cash conversion, or a financing requirement.
      Historical funding announcements and valuation references elsewhere
      would not answer those questions even if current: capital raised is not
      cash available. A 2025 university study used documentary research and
      recommended online-channel development and employee-process
      improvements, but it did not quantify channel economics or verify
      management accounts (CI014). A 2025 academic case identifies trademark
      uncertainty as a potential source of operating cost and expansion
      friction, without quantifying exposure (CI015). A July 2025 Zhihu
      post offers forward store and listing scenarios but says its data come
      from public online information; the retrieved text supplies no
      auditable basis, so these are not company guidance or financing
      evidence (CI016). The verdict is therefore conditional: the small-store
      model merits diligence, but revenue quality, margin durability,
      capital intensity and runway cannot be underwritten without current
      primary financials and store cohorts.
    claimRefs: [CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Public value or status, Evidence quality, Diligence ask]
    rows:
      - [In-store beverage sales, Direct retail sale to customers, "RMB per cup", "Press reports place a cup around RMB 15–20 in 2023; Day9 lists a 5-yuan BYO discount, but current terms and realized pricing are unknown.", "Dated secondary reporting and an undated directory listing; no transaction reconciliation.", "Obtain current SKU price book, discount data, delivery commissions and realized net price."]
      - [Delivery or digital orders, Customer ordering channel, "Orders / RMB", "A 2025 university study recommends developing online channels; it does not quantify current sales mix.", "Documentary study and recommendation, not company transaction data.", "Request channel-level orders, net revenue, commissions, refunds and repeat rates."]
      - [Franchise or license income, Store network economics, "RMB / store", "Jiemian described the 1,000th-store milestone as reached without franchising in 2023; current mix is not established.", "One dated news report; not a current store or revenue reconciliation.", "Confirm current owned, licensed and managed-store counts and the associated revenue recognition."]
      - [Other commercial income, Partnerships or ancillary sales, "RMB", "No retained source provides a supportable amount or revenue contribution.", "Evidence gap; no stream-level disclosure in the assigned material.", "Request audited revenue disaggregation and material contract terms."]
    notes: >-
      Dated reported values are not current realized revenue. The retained
      evidence does not provide audited stream mix, accounting policies or
      net-of-promotion figures; “not established” is limited to this assigned
      source set.
    claimRefs: [CI001, CI002, CI005, CI014]
  - id: TI002
    title: Reported price points are not realized pricing
    columns: [Source vintage, Reported price, Scope / comparison, Interpretation, Confidence, Diligence ask]
    rows:
      - ["Undated Day9 listing", "5-yuan bring-your-own-cup discount", "Eligibility, redemption frequency and current availability are not established.", "Directory-reported offer; not a realized-price measure.", "Low; no current company terms or transaction data.", "Verify current offer terms, redemption and impact on net price."]
      - ["2023-10 Jiemian", "About RMB 20 per cup", "Individual cup price reported by the article.", "A dated approximate price point; promotions and product mix are unknown.", "Medium for what the article reported; low as a current realized-price proxy.", "Reconcile list price, discounts, tax, delivery fees and recognized revenue."]
      - ["2023-12 KrASIA", "Typically RMB 15–20 per cup", "Article description of classic drinks.", "Overlaps the Jiemian snapshot but does not establish realized transaction prices.", "Medium for the reported range; no transaction-level corroboration.", "Obtain current menu and transaction-level price realization."]
    notes: >-
      Nominal reported prices come from differently dated secondary sources;
      the undated discount listing does not establish current offer terms.
      These figures are not realized revenue per order. No company-issued
      price schedule or transaction extract was retained.
    claimRefs: [CI002, CI005]
  - id: TI003
    title: Public unit-economics estimates and underwriting gaps
    columns: [Metric, Reported value and period, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Average daily store revenue", "About RMB 7,500 per store per day; Jiemian, 2023-10.", "Low; secondary estimate, denominator and store cohort not supplied.", "Starting point for store productivity, not company revenue.", "Request monthly store P&Ls by opening cohort, city and maturity."]
      - ["Average customer spend", "About RMB 20; Jiemian, 2023-10.", "Low; approximate press figure.", "Does not establish order size or net price after promotions.", "Reconcile POS tickets, product mix, discounts and tax."]
      - ["Daily cup volume", "Approximately 400 cups per store per day; Jiemian, 2023-10.", "Low; derived/report-stated proxy.", "Throughput drives labor utilization and rent productivity.", "Request transaction counts by hour, day and store cohort."]
      - ["Daily cup volume", "More than 500 cups per average store per day; KrASIA, 2023-12.", "Low; secondary report; differs from another dated estimate.", "The spread makes store mix and methodology material.", "Reconcile the two reported vintages to POS and define the average-store denominator."]
      - ["Reported per-cup cost", "Around RMB 11; KrASIA, 2023-12.", "Low; cost definition and inclusions are unspecified.", "Cannot calculate gross margin without a consistent revenue and cost basis.", "Request bill of materials, waste, delivery fees and labor treatment by SKU."]
      - ["Reported net margin", "23.75%; KrASIA, 2023-12.", "Low; store/company scope and accounting basis are not supplied.", "Not a verified consolidated net margin or cash margin.", "Obtain store-level and consolidated reconciliations to audited statements."]
      - ["Reported store net profit", "Could reach RMB 57,000; KrASIA, 2023-12; period not specified in the retrieved article.", "Low; peak wording, period and denominator are unclear.", "Cannot infer recurring monthly profit, payback or cash availability.", "Request distribution of store profits, period definitions and cash-to-profit bridges."]
      - ["Store opening cost and payback", "KrASIA said claims had surfaced of RMB 300,000 initial investment and break-even in just over three months; 2023.", "Low; unverified claim with no cohort or cash-flow basis.", "Not a current capex schedule or measured payback.", "Request current capex by format, lease deposits and cohort cash payback."]
      - ["CAC, working capital and runway", "Not established by the assigned sources.", "Unavailable.", "These determine sales efficiency and capital adequacy.", "Request channel CAC, inventory/payables, cash, debt, burn and a 24-month cash forecast."]
    notes: >-
      Every numeric figure is an attributed historical third-party estimate,
      not an audited company metric. The sources use different vintages and
      undefined denominators; blank current private metrics are evidence gaps,
      not zeros. Net profit is not cash burn, and no ARR or company-wide
      revenue is inferred.
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI009, CI010]
