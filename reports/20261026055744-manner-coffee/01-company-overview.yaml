company:
  name: Manner Coffee
chapter:
  number: 1
  title: Company Overview
  summary: Manner is a Shanghai-founded, small-format coffee chain whose historical fundraising and reported store growth show meaningful expansion. The available sources also flag execution pressure, concentrated geography, and material gaps in current financial, governance, and legal-status evidence.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Multiple independent profiles identify Manner Coffee as founded in Shanghai in 2015 by Han Yulong and Lu Jianxia, beginning with a very small shop in the city (CO001). Its reported positioning pairs specialty coffee with accessible pricing and compact, grab-and-go locations rather than a large café footprint (CO002). This is a useful description of the historical model, not proof that every current location or product follows the same format. Manner has also been described as directly operating its stores, a structure that gives it control over execution but leaves store-level labor, rent, and operating responsibilities with the company (CO009). The cited materials do not establish a current executive roster, board composition, or changes in leadership; the founder names should not be mistaken for a complete current leadership map.
    claimRefs: [CO001, CO002, CO009]
  - id: people-capital-and-disclosure
    title: Founders, capital and disclosure
    body: >-
      The source set names two co-founders, Han Yulong and Lu Jianxia, but does not establish their current operating roles or the composition of Manner's board (CO001).       Historical reporting describes a RMB 80 million 2018 Series A involving Capital Today, Temasek and ByteDance, followed by a reported RMB 100 million strategic financing from H Capital and Coatue Management in December 2020 and additional investor activity in 2021 (CO010, CO011, CO012). These are dated financing reports, not a current cap table or evidence of cash available. Indexed.vc separately lists four rounds, four investors and US$23.5 million in total funding, with a most recent US$11.5 million Corporate Round in June 2021; that database figure should not be treated as a reconciled lifetime total because the retrieved source does not explain its coverage or currency methodology (CO013). A Marketing-Interactive report dated 19 November 2025 relayed Bloomberg reporting of possible Hong Kong IPO discussions and a potential valuation of up to US$3 billion; this is not evidence of a filing or completed transaction (CO014).
    claimRefs: [CO001, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002, TO003]
  - id: scale-and-execution
    title: Scale, geography and store execution
    body: >-
      A June 2024 Global Times report cited media reports that Manner then had 1,295 company-operated stores nationwide (CO004). More recent-looking retrieved pages describe the network as around or above 2,000 locations, but one gives no clear as-of date and the other attributes its figure to the company website; treat these as reported scale signals rather than an audited current store count (CO008). Daxue Consulting reports that 73.9% of stores were in first-tier cities in 2025, suggesting that geographic breadth remains a question even as the reported network grows (CO007). The store model has also faced frontline execution pressure: Global Times reported three customer-barista conflicts in recent weeks in 2024, alongside a company apology and promised operational changes (CO005, CO006). The specific staffing thresholds reported by Global Times are a further reason to request store-level labor and service data; they are media-reported rules, not a verified company-wide staffing policy (CO007).
    claimRefs: [CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO001]
  - id: milestones-and-open-diligence
    title: Milestones and open diligence
    body: >-
      The dated record available in this pool spans the 2015 founding, early financing and store growth, 2020–2021 capital events, and 2024 operating incidents; the 2025 store-location estimate adds a more recent but still secondary-data point (CO001, CO010, CO011, CO012, CO016, CO004, CO005, CO007). A 2025-published teaching-case preview also reports a trademark dispute involving Josef Manner and Comp AG, but the accessible excerpt does not supply primary legal documents or establish the dispute's current status (CO015). That is a diligence lead rather than a verified present-day legal conclusion. No cited source provides audited revenue, ARR, EBITDA, cash, debt, current valuation, or a current headcount figure. The next review should obtain dated company financials and store-level economics, a current leadership and governance pack, a reconciled store roster, and primary legal records or counsel confirmation.
    claimRefs: [CO001, CO004, CO005, CO007, CO010, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
