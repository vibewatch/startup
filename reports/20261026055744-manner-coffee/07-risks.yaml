        - "Exposure is conditional on Manner's pricing and promotion decisions."
        - "Material if discounting lowers contribution without adequate volume or cost offsets."
        - "No current store-level unit economics or promotion controls are evidenced."
        - "Unquantified; peer pricing does not establish Manner's profitability."
        - "Track realized net price, cups per labor hour, contribution per store, and mature-store payback."
    notes: "Historical media accounts and sector reporting identify mechanisms to test; they do not establish present incident frequency or Manner's current unit economics."
