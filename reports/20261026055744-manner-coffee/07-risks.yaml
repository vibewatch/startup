        - "Unquantified beyond the reported episodes."
        - "Material if persistent: service, retention, and execution may weaken together."
        - "Company said it would improve staffing arrangements and barista care; implementation is unverified."
        - "Material until current shift coverage and labor outcomes are reviewed."
        - "Escalate if staffing per shift, attrition, or grievance rates deteriorate or commitments are not evidenced."
      - - "Customer-service incidents and long waits"
        - "Two outlets were described in 2024 reports; Global Times also recounted additional recent conflicts."
        - "Historical events are documented; current recurrence rate is unknown."
        - "Potentially high for brand trust if repeated across a large footprint."
        - "Company response included a stated focus on reducing waits and improving store operations."
        - "Unresolved because wait-time and complaint trends after 2024 are absent."
        - "Require store-level wait-time distributions, complaint closure data, and repeat-incident logs."
      - - "Food-safety execution under scale"
        - "Government and licensing sources describe wider chain and supply-chain oversight; they do not report a Manner incident."
        - "Company-specific likelihood cannot be estimated from these sources."
        - "Potentially high if a systemic control failure is found; no such failure is evidenced."
        - "Training, inspection, traceability, and corrective-action maturity are unknown."
        - "Material information gap, not an allegation."
