  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-architecture
      missingEvidence: >-
        Named machine models, recipe controls, ordering and scheduling systems,
        integrations, maintenance procedures, uptime and support commitments.
      whyItMatters: >-
        Without implementation and performance evidence, investors cannot assess
        reproducibility, bottlenecks or the scalability of the store workflow.
      diligencePath: >-
        Request a current equipment register, system architecture, vendor list,
        operational KPIs, incident log and service-level documentation from Manner.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        A public developer or practitioner-community signal, or company materials
        establishing whether a public software/developer surface exists.
      whyItMatters: >-
        The assigned evidence contains no verifiable developer adoption or
        practitioner proxy, so the technology maturity and external ecosystem
        cannot be assessed.
      diligencePath: >-
        Confirm whether Manner operates proprietary ordering or store software;
        request usage and release data, and validate any relevant professional
        community evidence or explain why no proxy applies to this retail model.
      relatedQuestionRefs: [QE010]
    - type: private-evidence-only
      severity: material
      topic: trust-quality-controls
      missingEvidence: >-
        Food-safety audit cadence, certification scope, training records, privacy
        and security controls, incident rates and post-2024 queue outcomes.
      whyItMatters: >-
        Store-level service depends on people, equipment and process controls, but
        company descriptions do not establish independently verified outcomes.
      diligencePath: >-
        Obtain the current food-safety and quality audit pack, training curriculum,
        certification documents, privacy/security policies and dated incident and
