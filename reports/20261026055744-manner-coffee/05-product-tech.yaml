    rows:
      - [Obtain prepared coffee, Customer orders a drink at a compact retail outlet, Small-store direct-sales model is reported, No independently comparable customer outcome, Current order channel and menu workflow are not fully documented]
      - [Prepare a specialty drink, Barista uses semi-automatic equipment according to secondary reporting, KRASIA describes equipment and CBBC describes trained baristas, KRASIA reports store-level cups per day but no service-time series, Product-level quality and speed data are unavailable]
      - [Receive consistent service, Media profiles describe barista training, Training is reported but no current curriculum or audit is supplied, No audit or consistency metric is disclosed, Certification scope and training outcomes need verification]
      - [Avoid excessive waiting, 2024 reporting describes long waits and customer-barista conflicts, Manner said it would optimize store arrangements, No post-response wait-time result is disclosed, Staffing and queue KPI history is unavailable]
    notes: >-
      Throughput figures are third-party-reported, not an audited benefit or
      comparable benchmark; unavailable outcomes are stated as gaps.
    claimRefs: [CE003, CE005, CE006, CE007, CE011, CE012, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role in service, Dependency, Evidence and risk]
    rows:
      - [Coffee inputs and roasting, Supplies coffee for drink preparation, Bean sourcing plus roasting capability, CBBC reports Yunnan sourcing and a brand feature describes roasting; current supplier and capacity details are absent]
      - [Store equipment, Supports grinding and drink preparation, Equipment availability maintenance and calibration, Media profiles describe semi-automatic preparation; independent specifications are absent]
      - [Barista training and quality control, Supports preparation skill and service standards, Training time certification scope and staffing, Media profiles describe training; outcome measures and audit evidence are absent]
      - [Store operations and queue handling, Converts customer demand into prepared orders, Staffing store layout and peak-load management, 2024 reporting documented wait-related incidents; current queue and incident rates are unavailable]
      - [Digital ordering and scheduling, Potentially coordinates orders and staffing, Software vendor integrations and operational data, A low-reputation brand post asserts automation but names no systems or uptime]
    notes: >-
      The map is an evidence-bounded operating model, not a verified technical
      architecture; unsupported dependencies and controls remain diligence asks.
    claimRefs: [CE002, CE003, CE005, CE011, CE013, CE015]
