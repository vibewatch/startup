company:
  name: Manner Coffee
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Manner is presented as a specialty-coffee retail service built around compact
    stores, barista-prepared drinks and media-described equipment and training.
    Available sources describe parts of that operating model, but do not establish
    independently audited quality, reliability, technical architecture or safety
    controls.
sections:
  - id: customer-offer
    title: Customer offer and product components
    body: >-
      Manner's product is a prepared coffee experience rather than a disclosed
      standalone software or hardware product. A 2023 KRASIA account describes
      classic drinks and semi-automatic preparation, while a 2022 CBBC profile
      discusses Yunnan bean sourcing and barista training (CE001, CE002, CE003,
      CE006).
      These are historical media descriptions, not a current menu, supplier
      register, training audit or controlled quality comparison. A separate
      brand feature recounts an early roasting operation, but does not establish
      its present capacity or controls (CE013). An academic case-study abstract
      refers generally to technological innovation without naming a technical
      product or measured outcome (CE014). Manner's official notice states that
      it has never opened a franchise or agency, a company position rather than
      an independently audited store-ownership list (CE010). Current
      specifications, system integrations and comparative performance remain
      unverified.
    claimRefs: [CE001, CE002, CE003, CE006, CE010, CE013, CE014]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: operating-workflow
    title: Store workflow and operating model
    body: >-
      The evidence points to an operating system in which coffee sourcing and
      equipment meet skilled in-store preparation, with the customer receiving
      a made-to-order drink through a compact retail footprint. A KrASIA article
      reports small stores, direct sales and semi-automatic machines; its
      throughput figures are media claims, not audited company data or a
      comparable benchmark (CE006, CE007, CE015). A China Entrepreneur
      article republished by FoodTalks describes the early outlet as a two-square-
      metre window shop and reports direct operation at the time of its account
      (CE008). It also reports an employee survey about possible franchising, but
      quotes a person close to Manner saying there were no near-term plans then
      (CE009). Manner's own website says it has never opened a franchise or agency;
      that statement does not establish the current legal status of every store
      arrangement (CE010). The workflow's customer benefit, queue time, quality
      consistency and store-level economics are not independently quantified.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE015]
    tableRefs: [TE002, TE003]
  - id: maturity-and-controls
    title: Maturity, trust and technical diligence
    body: >-
      Public evidence is uneven: media profiles describe equipment and training,
      while reporting identifies operational pressure points that can affect
      service quality. Global Times reported customer-barista conflicts in 2024
      after long waits and described Manner's stated plans to reduce waiting time
      and improve barista care (CE011, CE012). The reported incidents make labor
      capacity, queue management and escalation procedures diligence priorities;
      they do not quantify incident rates or prove a persistent failure. A 2024
      brand-communication profile asserts automated ordering and scheduling, but
      gives no system names, implementation evidence or reliability measures
      (CE005). The 2025 academic case-study materials mention technological
      innovation without identifying an architecture or technical proof (CE014)
      and identify a trademark dispute affecting brand identity (CE004).
      The retained evidence does not establish uptime, support commitments,
      privacy/security controls, food-safety audit cadence, certification scope
      or roadmap delivery. These are evidence gaps, not proof that controls or
      systems are absent.
    claimRefs: [CE004, CE005, CE011, CE012, CE014]
    tableRefs: []
