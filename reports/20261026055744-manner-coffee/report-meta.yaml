  topStrengths:
    - >-
      Manner has a differentiated compact-store and accessible specialty-coffee positioning supported by multiple
      historical profiles.
    - >-
      Reported store growth indicates substantial physical reach, although the counts are dated and not a harmonized
      current census.
    - >-
      Historical store-economics estimates provide testable diligence hypotheses, even though they are not audited
      underwriting evidence.
  topRisks:
    - Private-company opacity leaves revenue, cash, debt, runway, margins, and store-cohort returns unverified.
    - >-
      Reported geographic concentration and lower-tier expansion uncertainty limit extrapolation from the strongest
      markets.
    - >-
      Reported service incidents and workload concerns raise execution and staffing questions without establishing
      current incident prevalence.
    - A reported trademark dispute lacks current primary legal-status evidence.
  unresolvedGaps:
    - >-
      Obtain audited financial statements and reconciled store-level cohorts, including same-store sales, mature-store
      contribution, capex, and payback.
    - >-
      Verify current store counts and geography, and establish repeat purchase, customer concentration, and price
      realization.
    - >-
      Obtain the current cap table, share-class rights, debt and cash schedules, and primary evidence of any IPO or
      secondary transaction.
    - >-
      Confirm current trademark status, leadership, governance, and labor and service-control metrics using primary
      records.
