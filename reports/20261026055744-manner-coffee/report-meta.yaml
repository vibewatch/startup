companyProfile:
  summary: >-
    Manner Coffee is a Shanghai-founded private coffee chain whose reported model combines compact, directly operated
    stores with accessible, specialty-oriented coffee. Historical financing and store-growth reports show meaningful
    expansion, but the public evidence does not establish current audited financials, a reconciled store base, or a
    complete current leadership and governance picture.
