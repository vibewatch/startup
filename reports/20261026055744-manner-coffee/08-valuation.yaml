company:
  name: Manner Coffee
chapter:
  number: 8
  title: Valuation
  summary: Public sources describe historical private-company valuation marks and conditional Hong Kong IPO scenarios, but do not establish a current price or audited earnings base. Reported store economics and scale support further diligence, while geographic concentration, labor execution, and unresolved trademark status constrain confidence; the evidence supports research-more with no numeric valuation range.
sections:
  - id: recommendation-and-entry
    title: Historical marks do not establish a current entry price
    body: >-
      The investment call is research-more, with low confidence in any point estimate and
      high risk from financial and transaction opacity. ARC Group reported a USD 2.5 billion
      valuation in June 2021 and an IPO plan for 2022; BambooWorks later described a market
      value estimated above USD 2 billion. November 2025 coverage was still conditional:
      World Coffee Portal said Manner could fetch USD 3 billion in a Hong Kong listing, while
      GuruFocus News reported a possible USD 3–4.5 billion range. These are dated or
      forward-looking media reports, not priced transactions or issuer-confirmed current
      equity values. The sources also do not provide current fully diluted ownership,
      preference terms, debt, cash, or audited earnings with which to translate a headline
      valuation into common-equity value. Do not set a target return or treat the reported
      IPO values as an entry anchor.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: underwriting-thesis-and-counterweights
    title: Store economics are promising reports, not underwriting-grade evidence
    body: >-
      The affirmative case is a scaled, direct-operated coffee chain with reported store
      income that could support compact-format economics. KrASIA attributes average daily
      income of RMB 7,000–8,000 per store to a Zheshang Securities analysis and describes a
      monthly net-profit estimate using a 23.75% margin; both are secondary figures, and the
      profit calculation assumes the high end of the income range. The same 2023 coverage
      reports 88% of stores in five cities and says lower-tier demand may not reproduce
      first-tier results. Global Times reported 1,295 company-operated stores in 2024, but
      store count does not establish profitability. Its report also describes customer-
      barista conflicts, workload criticism, and a staffing rule attributed to other media.
      An IGI Global teaching-case abstract flags a trademark issue affecting brand identity
      and expansion, without providing a current legal-status record. These are material
      sensitivities to store contribution, rollout returns, and exit value.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: No defensible comparable multiple or scenario range is available
    body: >-
      The assigned evidence does not support a numeric bull, base, or bear valuation range,
      return target, or probability weight. The dated private-company marks use no disclosed
      common valuation basis, while the 2025 IPO figures are possibilities rather than
      completed financing terms. KrASIA's store estimates are not audited consolidated
      earnings, and the fetched Starbucks investor page is a company-issued index of annual
      reports, quarterly results, and SEC filings—not a normalized Manner-versus-peer
      valuation benchmark. Competitor comparisons in editorial coverage are useful for
      identifying pressure on price and format, but they are not independent transaction
      benchmarks. A public-comparable method would require current Manner revenue, earnings,
      net debt, share count, and transaction terms alongside peer metrics on a consistent
      basis. Until those inputs exist, the scenarios below state conditions and decision
      triggers rather than invented values.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV008, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-thesis-breaks
    title: Primary financial and legal evidence should determine the next decision
    body: >-
      Before reconsidering an entry, request audited consolidated accounts and a reconciled
      store cohort pack showing revenue, store contribution, rent and labor, maintenance
      capex, mature-store performance, and expansion payback by city and vintage. Obtain the
      current cap table, fully diluted share count, share-class rights, liquidation
      preferences, anti-dilution provisions, debt, cash, and any secondary-sale or IPO
      documents; funding raised is not cash available to common shareholders. Confirm whether
      a Hong Kong listing process has advanced beyond the conditional 2025 media reports.
      For the trademark issue, obtain current registry and court records plus counsel's
      assessment of any naming or expansion constraints. Upgrade the thesis only if
      independently reviewable unit economics repeat outside the concentrated core and
      transaction terms leave a supportable return after dilution. Reassess downward if
      audited cohorts fail to cover operating and reinvestment costs, or if labor, demand,
      or legal constraints impair expansion.
    claimRefs: [CV005, CV006, CV009, CV010, CV012, CV013, CV014, CV016]
tables:
  - id: TV001
    title: Recommendation and entry discipline
    columns: [Decision field, Assessment, Evidence basis and condition]
    rows:
      - ["Recommendation", "Research-more", "Historical marks and conditional IPO reports do not establish a current price."]
      - ["Confidence", "Low", "Private financials, cap table, and current transaction terms are not established in the assigned sources."]
      - ["Risk rating", "High", "Reported city concentration, labor incidents, and trademark uncertainty limit extrapolation."]
      - ["Valuation stance", "Unknown", "No current issuer-confirmed equity value or audited earnings base supports a fair-value conclusion."]
      - ["Entry and return", "No target price or return set", "Revisit after audited cohort economics, current fully diluted terms, and a confirmed transaction status."]
    notes: >-
      USD 2.0–2.5 billion historical marks and 2025 possible IPO values are attributed
      press reports from different dates, not comparable financing observations or current
      fair value. No target return is calculable from the retained evidence.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV016]
  - id: TV002
    title: Investment thesis and anti-thesis
    columns: [Argument, Public evidence, Valuation implication, What would change the view]
    rows:
      - ["Scale", "Global Times cited media reports of 1,295 company-operated stores in 2024.", "Scale is not proof of store contribution or cash generation.", "Verify current store count, closures, and company-operated scope."]
      - ["Unit economics", "KrASIA relayed RMB 7,000–8,000 average daily income per store and an estimated RMB 57,000 monthly net profit using a 23.75% margin.", "Potentially attractive economics if representative, but the figures are secondary estimates.", "Reconcile source data with audited store cohorts, margin definitions, and capex."]
      - ["Geographic reach", "KrASIA reported 88% of stores in five cities and uncertainty about lower-tier demand.", "Concentration raises the risk that new-city returns differ from the core.", "Test mature and new-store cohorts by city, vintage, and local price level."]
      - ["Labor and service", "Global Times reported customer-barista conflicts and a staffing rule attributed to media reports.", "Service capacity and labor cost may constrain throughput and expansion.", "Review incident rates, staffing, turnover, and remediation outcomes."]
      - ["Brand and legal status", "An IGI Global case abstract describes a trademark issue affecting brand identity and expansion.", "Potential rebranding or geographic constraints could impair exit readiness.", "Obtain current trademark registry, court, and counsel records."]
      - ["Financing and exit", "2025 articles described a possible Hong Kong IPO, not a completed or priced transaction.", "IPO speculation is not a liquidity event or a common-share valuation.", "Verify listing filings, financing terms, share classes, and dilution."]
    notes: >-
      Operating and valuation figures are attributed to their publishers and retain their
      stated periods and denominators; no company-audited figures or legal-status conclusions
      are inferred from these reports.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull, base, and bear underwriting cases
    columns: [Case, Explicit assumptions, Valuation range, Probability signal, Decision trigger]
    rows:
      - ["Bull", "Audited cohorts validate repeatable contribution and payback beyond core cities; current terms show manageable dilution.", "Not supportable from assigned evidence; the reported USD 3 billion possible IPO value is not an anchor.", "Conditional upside; no calibrated probability.", "Reconsider only when audited expansion returns and fully diluted terms support the proposed price."]
      - ["Base", "The reported store footprint remains meaningful, but consolidated profit, cash conversion, and listing terms remain unverified.", "Not supportable; dated private marks are not a current fair-value range.", "Working diligence case, not a probability estimate.", "Maintain research-more until current financials and transaction documents are reviewed."]
      - ["Bear", "Demand outside the core is insufficient or labor, price competition, or trademark constraints reduce returns or expansion.", "Not supportable; downside cash flows, debt, and preference claims are undisclosed.", "Material downside; magnitude and probability are uncalibrated.", "Defer or reject if audited cohorts fail the return hurdle or legal/financing terms impair common equity."]
    notes: >-
      These are conditional underwriting cases, not forecasts. The retained sources do not
      establish audited earnings, current equity value, capital structure, or comparable
      multiples, so numeric ranges and probability weights would be false precision.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV014, CV016]
