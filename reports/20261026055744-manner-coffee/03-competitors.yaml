      - ["Price positioning", "Historical RMB 15–20 per cup; source dates differ", "RMB 9.9 promotional offers reported in 2023 coverage", "Experience-led / premium comparison in historical coverage", "RMB 9.9 promotions reported in 2023 coverage", "Peet's spokesperson said it would not compete on price", "The evidence indicates price segmentation, not a current realized-price comparison"]
      - ["Store network / distribution", "Reportedly concentrated in Shanghai and four other large cities", "Self-operated and partnership-store network; over 33,000 global stores at Q1 2026 end", "6,806 China stores reported in October 2023", "Rapid expansion described in 2023 coverage", "Peet's described growth across China and a 2026 target", "Density, franchise mix, delivery reach, and city-level productivity are not consistently measured"]
      - ["Quality / service proof", "No independent sensory or service benchmark", "No comparable independent product test", "No comparable independent product test", "No comparable independent product test", "Peet's spokesperson emphasized quality", "Do not treat vendor positioning as an independent quality benchmark"]
