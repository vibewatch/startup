        label: Value accessibility
        min: 1
        max: 5
        low: Less accessible
        high: More accessible
        description: "Analyst ordinal interpretation of source-reported pricing and format; not a measured price index."
        scale: ordinal
      yAxis:
        label: Experience emphasis
        min: 1
        max: 5
        low: Convenience-led
        high: Experience-led
        description: "Analyst ordinal interpretation of source descriptions; not a customer survey or quality score."
        scale: ordinal
      points:
        - label: Manner
          x: 4
          y: 3
          summary: "Historical mid-market price and small specialty format; current positioning and customer perception unmeasured."
        - label: Luckin
          x: 5
          y: 2
          summary: "Promotional price and digital convenience described in 2023–2026 sources."
        - label: Starbucks
          x: 2
          y: 5
          summary: "Historical reporting emphasizes café experience; no current comparable price retained."
        - label: Cotti
          x: 5
          y: 1
          summary: "2023 coverage describes low-price promotions; experience evidence unavailable."
        - label: Peet's
          x: 2
          y: 4
          summary: "Premium positioning and stated quality-over-price approach; no current price comparison."
        - label: M Stand
          x: 3
          y: 5
          summary: "Secondary commentary describes a design-forward destination proposition; no current price benchmark."
    approximationNotes: "Positions are ordinal analyst judgments anchored to the claims cited below, not measured values, rankings, or market thresholds. The sources do not support precise numeric axes."
    claimRefs: [CP001, CP003, CP004, CP011, CP012, CP013]
