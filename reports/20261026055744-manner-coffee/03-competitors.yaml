      - [Luckin, "RMB 9.9 promotions / vouchers", "Per cup or voucher offer; reported in 2023 coverage", "Promotion-led convenience", "Not a current list price or realized average"]
      - [Cotti, "RMB 9.9 offers reported", "Promotional offer; 2023 coverage", "Low-price competition", "Offer scope, duration, and current pricing unknown"]
      - [Starbucks, "No comparable numeric price retained", "Not established", "Café experience / premium comparison in historical coverage", "No current like-for-like menu comparison"]
      - [Peet's, "No comparable numeric price retained", "Not established", "Spokesperson said the brand would not sacrifice quality for price competition", "Company position, not observed realized price"]
    notes: "Prices are source-reported historical offers and are not adjusted for cup size, product, geography, tax, discounts, or date. No current price or realized transaction-price benchmark was available."
    claimRefs: [CP003, CP004, CP012, CP013]
