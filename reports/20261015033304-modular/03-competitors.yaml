  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Price / unit / contract model
      - Included capabilities
      - Unknowns or discounting
      - Implication
    rows:
      - - Modular shared endpoints
        - "Pay-per-token"
        - "Hosted inference, OpenAI-compatible test path, free exploration funnel"
        - "Assigned sources do not publish live unit rates"
        - "Good trial path, but not enough public data to underwrite realized TCO"
      - - Modular dedicated endpoints
        - "Pay-per-minute"
        - "Reserved NVIDIA or AMD capacity, tuning help, predictable performance"
        - "No public rate card or workload-specific discounts in pool"
        - "Enterprise motion competes on operating economics, not sticker transparency"
      - - Modular BYOC / VPC-style deployment
        - "Custom / quote-led"
        - "Customer environment, custom kernels, policy and data-residency control"
        - "Contract structure and minimum commits undisclosed"
        - "Useful for regulated buyers, but sales friction is higher"
      - - Simpler managed alternatives
        - "Transparent per-request or per-hour pricing per scored.tools"
        - "Easy deployment and managed infrastructure"
        - "Assigned pool does not give equivalent control or portability detail"
        - "Likely easier win when hardware neutrality is not the deciding criterion"
    notes: >-
      Packaging and price-unit language come from third-party reviews plus Modular's official
      cloud positioning; realized enterprise rates and discounts are still a diligence gap.
    claimRefs: [CP002, CP004, CP006, CP009]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal map of where Modular sits between portability/control and
      managed deployment simplicity.
    data:
      xAxis:
        label: Portability and operator control
        min: 1
        max: 5
        low: Vendor-locked / opaque
        high: Portable / tunable
        description: Ordinal placement from assigned source claims, not benchmark scores
        scale: ordinal
      yAxis:
        label: Managed deployment simplicity
        min: 1
        max: 5
        low: Buyer-operated
        high: Turnkey managed
        description: Ordinal placement from packaging and workflow evidence
        scale: ordinal
      points:
        - label: Modular shared endpoints
          x: 4
          y: 4
          tone: positive
          note: "OpenAI-compatible shared endpoints plus hardware-portability messaging make trial and migration relatively easy."
        - label: Modular dedicated / BYOC
          x: 5
          y: 3
          tone: positive
          note: "Highest source-backed control through custom kernels, customer environments, and tuning support, but with heavier enterprise process."
        - label: Managed endpoint vendors
          x: 2
          y: 5
          tone: neutral
          note: "Third-party reviews frame these as the easiest alternative when portability and deep tuning are not required."
        - label: Proprietary APIs
          x: 1
          y: 5
          tone: neutral
          note: "Fastest turnkey consumption path in the evidence set, but with the least runtime and hardware control."
        - label: Self-hosted open-source stacks
          x: 5
          y: 2
          tone: risk
          note: "Maximum control is offset by setup, tuning, and operator burden staying with the buyer."
        - label: Internal build
          x: 5
          y: 1
          tone: risk
          note: "Most customizable option, but also the highest staffing and maintenance load in the assigned evidence."
    approximationNotes: >-
      Coordinates are ordinal 1-5 placements synthesized from assigned source descriptions of
      control, portability, and deployment burden; they are not measured market-share or
      performance values.
    claimRefs: [CP002, CP005, CP006, CP007, CP009]
callouts:
  - calloutType: insight
    title: Modular's wedge is control without full self-hosting
    body: >-
      The strongest competitive angle is not "best model API" but "portable stack with
      production help" for teams that want multi-accelerator choice without building and
      tuning everything themselves.
    claimRefs: [CP001, CP002, CP009]
  - calloutType: risk
    title: The moat is conditional, not settled
    body: >-
      If Qualcomm ownership undermines perceived neutrality or independent benchmark proof
      never materializes, Modular becomes easier to substitute with simpler managed endpoints
      or open-source serving stacks.
    claimRefs: [CP010, CP011, CP012]
