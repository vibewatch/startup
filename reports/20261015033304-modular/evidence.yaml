evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin
    missingEvidence: Current revenue, ARR, services mix, gross margin, retention, and cash runway by product surface.
    whyItMatters: >-
      Public scale claims cannot be translated into commercial quality or valuation support without monetization
      evidence.
    diligencePath: Request a current board deck or KPI pack with revenue, ARR, margin, retention, and deployment-mix bridges.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: transaction-terms
    missingEvidence: >-
      Acquisition consideration mix, rollover treatment, liquidation preferences, option treatment, and realized
      proceeds by class.
    whyItMatters: The gap prevents comparison between the last private valuation and actual value realization at exit.
    diligencePath: Request the purchase agreement summary, post-close cap table, and option settlement schedules.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance-and-board
    missingEvidence: Current board composition, governance cadence, and post-close reporting lines below Chris Lattner.
    whyItMatters: Control moved from a venture-backed startup to a strategic parent, but the public governance surface is opaque.
    diligencePath: Request the current org chart, governance memo, and any board or steering committee materials.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: headquarters-and-headcount
    missingEvidence: Official legal headquarters and current employee count.
    whyItMatters: These are core scale markers and help anchor cost structure and recruiting footprint.
    diligencePath: Request legal entity records, HR headcount by function, and office-footprint disclosures.
  - type: private-evidence-only
    severity: material
    topic: benchmark-validation
    missingEvidence: Neutral third-party benchmarks and reference-customer validation for latency, throughput, and cost claims.
    whyItMatters: >-
      Public performance claims are central to the thesis but remain vendor-reported or commentary-level rather than
      independently audited.
    diligencePath: >-
      Run a benchmark pilot against native CUDA, ROCm, and vLLM/TensorRT-LLM stacks on representative models and
      production traffic.
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A public bottom-up SAM or SOM for vendor-neutral inference software, BYOC support, or agentic-serving spend.
    whyItMatters: >-
      Broad AI infrastructure and GPU TAMs are too large to underwrite the revenue opportunity that Modular itself can
      realistically capture.
    diligencePath: >-
      Request Modular or Qualcomm market decks, pipeline segmentation, or third-party demand studies that isolate paid
      portability software from overall AI infrastructure.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-conversion
    missingEvidence: >-
      Enterprise contract values, conversion from free or open-source usage into paid cloud or BYOC accounts, and
      customer concentration by deployment mode.
    whyItMatters: >-
      Without pricing and conversion evidence, the chapter can describe buyer pain but cannot estimate how much of the
      market is monetizable today.
    diligencePath: >-
      Ask for cohort conversion data, representative contracts, and revenue mix by self-hosted, shared cloud, dedicated,
      and BYOC offerings.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: benchmark-independence
    missingEvidence: >-
      Independent post-acquisition benchmarks comparing latency, throughput, and neutrality across NVIDIA, AMD, and
      Qualcomm hardware.
    whyItMatters: >-
      The adoption case still leans on company framing and low-reputation commentary, which is not strong enough to
      prove durable buyer ROI.
    diligencePath: >-
      Request third-party proof-of-concept results, customer benchmark packs, or analyst testing that can verify
      performance and portability claims.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Realized per-token and per-minute rates, minimum commits, discounts, and gross-margin profile by shared,
      dedicated, and BYOC deployment.
    whyItMatters: >-
      Without realized pricing, the chapter cannot rank Modular against managed rivals on total cost of ownership or
      payback confidence.
    diligencePath: Request current rate cards or redacted customer contracts segmented by deployment model.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Independent win/loss studies or benchmark methodology against vLLM, proprietary APIs, and managed endpoint vendors
      on common workloads.
    whyItMatters: >-
      Portability and performance are central to differentiation, but the current evidence remains mostly vendor-framed
      or synthesized by reviewers.
    diligencePath: >-
      Collect third-party bakeoffs, named migration case studies, and benchmark runbooks with reproducible workload
      settings.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: deployment-mix
    missingEvidence: Customer mix by shared, dedicated, and BYOC deployments plus renewal, expansion, and concentration data.
    whyItMatters: >-
      The competitive verdict depends on whether Modular is winning repeatable platform accounts or only a narrow set of
      showcase deployments.
    diligencePath: Request cohort data, top-account concentration, and deployment-model mix from management.
    relatedQuestionRefs:
      - QP004
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing
    missingEvidence: >-
      Actual contracted ASPs, discounts, usage mix, and conversion rates across shared, dedicated, BYOC, and services
      plans.
    whyItMatters: >-
      List pricing alone cannot establish revenue quality, monetization mix, or whether quoted commercial complexity is
      translating into durable net revenue.
    diligencePath: >-
      Request customer-level or cohort-level bookings, usage, and realized pricing by deployment model, including
      discount schedules and renewal terms.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin, infrastructure COGS, support cost, and utilization by shared cloud, dedicated, and BYOC deployments.
    whyItMatters: >-
      Margin path is the core financial debate for an infrastructure platform whose value proposition depends on
      efficiency and support-heavy execution.
    diligencePath: >-
      Obtain product-line P&Ls or at least gross-margin bridges by deployment mode, plus utilization and
      support-assumption sensitivity tables.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Customer count, concentration by account or partner, renewal cadence, expansion behavior, and NRR.
    whyItMatters: >-
      A handful of impressive logos can mask concentration risk or weak repeatability if the install base is narrow or
      highly bespoke.
    diligencePath: Request customer cohort tables, top-10 revenue concentration, renewal histories, and logo-to-revenue mapping.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: post-close-capital-allocation
    missingEvidence: >-
      Modular-only cash or burn disclosures, parent-funded investment budgets, integration milestones, and any
      post-close product profitability targets.
    whyItMatters: >-
      The acquisition reduces external fundraising pressure but replaces it with internal capital-allocation risk that
      can materially shape growth and neutrality.
    diligencePath: >-
      Request Qualcomm integration plans, budgeted opex and capex for the product line, and management targets for
      investment cadence and return thresholds.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Direct Modular trust-center, privacy, or status documentation covering SOC 2 scope, incident handling, data
      retention, and data-residency controls.
    whyItMatters: >-
      Enterprise buyers need to distinguish marketing shorthand about private deployment from auditable control evidence
      before underwriting regulated or high-sensitivity workloads.
    diligencePath: >-
      Request current trust-center materials, status/SLA documents, and a security architecture review tied to shared,
      dedicated, and BYOC environments.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: operational-reliability
    missingEvidence: >-
      Independent uptime, latency, support-SLA, or deployment-success evidence across shared cloud, dedicated, and BYOC
      configurations.
    whyItMatters: >-
      The product story depends on production readiness, but the public pool does not show whether reliability and
      support quality hold once deployments move beyond evaluation.
    diligencePath: >-
      Ask for customer references, uptime reports, incident summaries, and standard support terms segmented by
      self-hosted, cloud, and BYOC plans.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: benchmark-proof
    missingEvidence: >-
      Neutral benchmark studies or named customer metrics validating throughput, cost, or hardware-portability claims
      against vLLM or vendor-specific alternatives.
    whyItMatters: >-
      The investment case leans on performance-per-dollar and hardware flexibility, so unsupported benchmark claims
      create risk of overestimating technical defensibility.
    diligencePath: >-
      Request reproducible benchmark methodology, customer before/after studies, and version-controlled comparisons on
      identical hardware.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Current customer count, gross and net retention, renewal cadence, and churn by deployment model.
    whyItMatters: >-
      Durability is the core missing input for judging whether named references represent a broad recurring base or a
      handful of showcase deployments.
    diligencePath: >-
      Request a customer KPI pack showing logo count, NRR, GRR, churn, average contract term, and cohort retention split
      across self-hosted, cloud, and BYOC motions.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-users
    missingEvidence: >-
      Production versus pilot status, spend level, and contract duration for named users such as Inworld, Hippocratic
      AI, TensorWave, and AWS.
    whyItMatters: >-
      Named logos without scope or spend make it hard to separate real production revenue from strategic pilots or
      partner references.
    diligencePath: >-
      Ask management for a customer reference list with deployment status, go-live date, annualized spend, and current
      expansion or renewal stage.
    relatedQuestionRefs:
      - QU002
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-segments
    missingEvidence: Segmented revenue mix by self-hosted/community, Modular Cloud, BYOC, and partner-driven demand.
    whyItMatters: >-
      Without payer mix and channel mix, the diligence case cannot tell whether growth is driven by durable enterprise
      accounts or by low-monetization developer adoption.
    diligencePath: Request segment revenue bridges, top-10 customer concentration, and partner-sourced pipeline conversion data.
    relatedQuestionRefs:
      - QU001
      - QU005
      - QU007
  - type: missing-source
    severity: material
    topic: production-benchmark
    missingEvidence: >-
      Independent customer or benchmark evidence showing latency, throughput, and reliability at production inference
      scale outside Modular-controlled tests.
    whyItMatters: >-
      The public story asks investors to believe the software can win live inference workloads, but the strongest
      adverse source says that proof is not yet demonstrated outside Modular's own benchmarks.
    diligencePath: >-
      Request named deployment references, architecture reviews, and third-party benchmark or procurement data tied to
      live workloads.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: commercial-terms
    missingEvidence: >-
      Standard enterprise pricing, SLA, support staffing, and change-control terms for BYOC and Enterprise after the
      Qualcomm integration.
    whyItMatters: >-
      Quote-only terms and services-heavy delivery can slow procurement, hide support burden, and compress margins
      before revenue durability is visible.
    diligencePath: Obtain current order form, MSA/SLA language, support model, and any post-close pricing or renewal policy changes.
    relatedQuestionRefs:
      - QR004
      - QR009
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: compliance-and-concentration
    missingEvidence: >-
      Customer concentration, cloud and hardware partner exposure, and the privacy, security, export-control, and
      open-source governance packet used in enterprise diligence.
    whyItMatters: >-
      Without quantified concentration and compliance materials, investors cannot tell whether portability risk is
      diversified or resting on a narrow set of counterparties and unverified governance processes.
    diligencePath: >-
      Request customer and partner mix, procurement packet, DPA/security documents, export-control posture, and
      post-close open-source governance policy.
    relatedQuestionRefs:
      - QR008
      - QR009
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: operating-disclosure-gap
    missingEvidence: Current revenue or ARR by product line, gross margin by deployment mode, renewal data, and customer concentration.
    whyItMatters: >-
      Those metrics are required to test whether the strategic takeout maps to durable standalone software economics or
      only to buyer-specific synergies.
    diligencePath: >-
      Request a management or data-room package with revenue, margin, cohort retention, and top-customer concentration
      by MAX, Modular Cloud, and BYOC.
    relatedQuestionRefs:
      - QV005
      - QV009
  - type: private-evidence-only
    severity: material
    topic: security-terms-gap
    missingEvidence: >-
      Series C preference stack, option dilution, acquisition share-count waterfall, and any earnout or retention
      package that affects proceeds.
    whyItMatters: >-
      Headline enterprise value does not tell investors what common or preferred holders actually realized, nor whether
      a future secondary would inherit unfavorable terms.
    diligencePath: >-
      Obtain the last financing documents, cap table, and merger consideration schedule before underwriting any
      derivative or secondary exposure.
    relatedQuestionRefs:
      - QV006
      - QV008
