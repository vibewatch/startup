        - label: "AI compute / GPU expansion"
          displayValue: "Hundreds of billions over the next decade"
          detail: "Founders Magazine also frames data-center GPU TAM as very large and expanding."
          note: "Hardware TAM overstates the software portability wedge."
          claimRefs: ["CM010"]
        - label: "Hardware-neutral compute layer"
          displayValue: "Build once, deploy anywhere"
          detail: "Qualcomm and Gate both describe the core wedge as cross-hardware portability without rewriting the stack."
          claimRefs: ["CM003", "CM013"]
        - label: "Agentic inference loop"
          displayValue: "10-50 calls per task"
          detail: "Modular's current solution page emphasizes sequential agentic workloads where latency compounds."
          claimRefs: ["CM007"]
        - label: "Deployment-constrained buyers"
          displayValue: "Cloud, dedicated, BYOC, and on-device"
          detail: "Public evidence points to private VPC, offline, and mixed-hardware deployments as the highest-friction use cases."
          claimRefs: ["CM006", "CM008"]
        - label: "Procurement filter"
          displayValue: "Quote-only pricing and neutrality diligence"
          detail: "Pricing opacity and post-acquisition credibility questions narrow the near-term buyer set."
          claimRefs: ["CM014"]
    approximationNotes: "Upper layers use the public market lenses reported in this pool; lower layers are evidence-backed buying-center filters, not a derived SAM or SOM."
    claimRefs: ["CM003", "CM007", "CM009", "CM010", "CM014"]
