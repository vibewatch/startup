    title: "Market wedge from broad AI infrastructure demand to Modular's current buying center"
    type: "pyramid"
    summary: "The numeric ceiling is broad AI infrastructure and GPU expansion, but the actionable wedge narrows quickly to heterogeneous inference, agentic loops, controlled deployment, and procurement filters."
