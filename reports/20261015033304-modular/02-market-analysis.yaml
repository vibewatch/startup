company:
  name: "Modular"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Public evidence supports a real market wedge around hardware-portable AI inference, orchestration, and agentic serving, but not a clean standalone SAM or SOM for Modular. The best-supported buyers are ML platform and AI infrastructure teams trying to lower latency, preserve hardware choice, and satisfy private-deployment requirements, while pricing opacity and post-acquisition neutrality questions still narrow the near-term addressable market."
sections:
  - id: "market-boundary"
    title: "Market boundary: heterogeneous inference infrastructure, not generic AI software"
    body: |-
      The assigned evidence supports a narrow market definition for Modular: infrastructure software that helps developers and enterprises deploy generative and agentic AI across heterogeneous compute environments without rewriting the serving layer for every accelerator. Qualcomm framed the acquisition around developers, OEMs, ODMs, cloud service providers, and model creators that need a more open compute layer across devices, edge systems, and data centers, while Gate and ai2.work both describe the alternative as continued dependence on vendor-specific stacks such as CUDA-centered tooling or ROCm-centered migration paths. That means the included spend is inference serving, orchestration, kernel optimization, and deployment portability, while the excluded spend is foundation-model creation, generic application software, and undifferentiated chatbot APIs.
    claimRefs: ["CM001", "CM003", "CM004", "CM017"]
    tableRefs: ["TM001"]
  - id: "buyers-and-adoption-path"
    title: "Buyer, user, and payer path centers on platform teams under latency and deployment pressure"
    body: |-
      The current buyer evidence is more specific than a broad enterprise-AI story. BERI describes the ideal buyer as the head of ML platform or a comparable infrastructure owner serving open models across mixed hardware fleets, while Modular's current agentic page shifts the narrative toward teams running multi-step workflows where latency compounds across 10 to 50 calls per task. Those two views fit together: the user is usually an ML or systems engineer, the economic buyer is a platform, infrastructure, or CTO budget owner, and the trigger is either cost pressure from GPU concentration or a need to deploy in customer VPCs, regulated settings, or offline environments. Public evidence therefore points to a workflow-led adoption path rather than a top-down seat-based software market.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM008"]
    tableRefs: ["TM003"]
  - id: "sizing-lenses"
    title: "Sizing lenses are broad, so the most honest read is directional rather than bottom-up"
    body: |-
      The public sizing evidence in this pool is useful for ceiling-setting, not for underwriting a precise revenue opportunity. Founders Magazine cites one 2025 AI infrastructure forecast at about $87.6 billion with strong growth to 2030 and separately describes the data-center GPU opportunity in the hundreds of billions over the next decade, while ai2.work offers modeled ROI ranges tied to heterogeneous deployment rather than a published market census. Taken together, these sources imply that the problem Modular addresses is attached to a very large AI infrastructure spend base, but they do not isolate how much of that spend belongs to vendor-neutral inference software, paid cloud endpoints, or BYOC support. The right conclusion is that the top of the funnel is large, but the public SAM/SOM remains unproven and should stay flagged as a diligence gap.
    claimRefs: ["CM009", "CM010", "CM011", "CM012", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "constraints-and-diligence-gaps"
    title: "Adoption constraints are neutrality credibility, pricing opacity, and missing independent benchmarks"
    body: |-
      The same evidence that makes the market story plausible also narrows it. Gate's analysis says the value proposition is helping customers switch chips without rewriting code, but it explicitly warns that the thesis weakens if Qualcomm turns the stack into Qualcomm-first software. BERI adds two procurement frictions that matter immediately: some enterprise pricing remains quote-only, and buyers cannot yet treat long-term hardware neutrality as guaranteed. Qualcomm's post-close statement that Mojo, MAX, and Modular Cloud will continue as products reduces short-term continuity risk, but it does not solve the deeper diligence problem that public sources still lack independent post-acquisition benchmarks, conversion data from free to paid deployments, and a standalone market model for the paid software wedge.
    claimRefs: ["CM004", "CM013", "CM014"]
