figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence supports a layered stack from Mojo/compiler assets through MAX runtime layers to deployment surfaces and developer access points.
    data:
      layers:
        - label: OpenAI-compatible API / max serve
          detail: Public repo and code-trace sources point to a serving surface that can replace a managed-only front end.
        - label: Self-hosted, cloud, and BYOC options
          detail: Independent directories describe deployment modes that wrap the same software base in community, managed, and private-cloud forms.
        - label: MAX inference server
          detail: The runtime layer handles serving, model execution, and developer-facing features such as structured outputs and tool-calling.
        - label: Pipeline registry, configs, and manifests
          detail: Architecture-to-implementation mapping and model configuration logic organize support breadth and onboarding.
        - label: MAX kernels / accelerator library
          detail: Hardware-tuned primitives and accelerator-specific optimization assets sit beneath the runtime.
        - label: Mojo compiler + stdlib
          detail: Portable language and compiler assets support custom kernel development and low-level performance work.
    approximationNotes: This figure is a structural synthesis from repo paths, docs, and code-trace summaries; it is not a latency or data-flow benchmark.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
