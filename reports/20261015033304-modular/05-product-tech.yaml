  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Direct Modular trust-center, privacy, or status documentation covering SOC 2 scope, incident handling, data retention, and data-residency controls.
      whyItMatters: Enterprise buyers need to distinguish marketing shorthand about private deployment from auditable control evidence before underwriting regulated or high-sensitivity workloads.
      diligencePath: Request current trust-center materials, status/SLA documents, and a security architecture review tied to shared, dedicated, and BYOC environments.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: operational-reliability
      missingEvidence: Independent uptime, latency, support-SLA, or deployment-success evidence across shared cloud, dedicated, and BYOC configurations.
      whyItMatters: The product story depends on production readiness, but the public pool does not show whether reliability and support quality hold once deployments move beyond evaluation.
      diligencePath: Ask for customer references, uptime reports, incident summaries, and standard support terms segmented by self-hosted, cloud, and BYOC plans.
      relatedQuestionRefs: [QE005]
    - type: missing-source
      severity: material
      topic: benchmark-proof
      missingEvidence: Neutral benchmark studies or named customer metrics validating throughput, cost, or hardware-portability claims against vLLM or vendor-specific alternatives.
      whyItMatters: The investment case leans on performance-per-dollar and hardware flexibility, so unsupported benchmark claims create risk of overestimating technical defensibility.
      diligencePath: Request reproducible benchmark methodology, customer before/after studies, and version-controlled comparisons on identical hardware.
      relatedQuestionRefs: [QE004, QE008]
