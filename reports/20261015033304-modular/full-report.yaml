        title: Capability and packaging comparison
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is real enough to matter in a shortlist. Across the official cloud page, DeepWiki's
              product summary, and third-party reviews, Modular consistently shows a stack that spans shared endpoints,
              dedicated deployments, BYOC-style environments, custom kernels, and multi-accelerator support. That makes
              it more than a thin hosted wrapper, but the packaging also reveals the GTM tradeoff. Buyers can test
              through self-serve shared endpoints, yet the high-value motion leans on dedicated plans, customer VPCs,
              and tuning help from forward-deployed engineers. In practice, the product is closer to an enterprise
              infrastructure sale than a purely self-serve API.
