chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company identity and current stage
        blocks:
          - type: paragraph
            body: >-
              Modular now presents as a Qualcomm-backed AI software platform rather than a still-independent venture
              stage company. The assigned official surfaces are consistent on the product thesis: a unified stack that
              lets developers deploy inference workloads across heterogeneous hardware, with MAX, Mojo, and hosted or
              VPC deployment options positioned as one integrated platform. The refresh changes the stage and control
              story materially because Qualcomm says the acquisition is complete, yet the product brands continue.
              Public customer proof remains directional rather than fully quantified: the evidence names reference users
              and ecosystem partners, but it does not disclose a current paying-customer count, retention base, or
              revenue scale.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO011
