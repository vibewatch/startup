              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Expansion thesis is plausible, but durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The visible land-and-expand motion is coherent: a free self-hosted or lightweight trial can lead to shared
              endpoints, then dedicated production or BYOC deployments, with Modular engineers helping tune performance
              in customer environments. That gives the business a credible expansion loop around performance tuning,
              private deployment, and broader hardware portability. The problem for diligence is that public materials
              still do not disclose customer count, NRR, GRR, churn, renewal cadence, top-account exposure, or channel
              concentration. Independent commentary also flags a real post-acquisition risk: if Qualcomm prioritizes its
              own accelerators or changes pricing, Modular’s hardware-neutral positioning could weaken precisely where
              enterprise buyers value it most.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Proof is strongest where Modular shows deployment path plus named user
            body: >-
              The best customer evidence combines a named organization with a specific deployment mode or outcome—Qwerky
              AI for custom-model portability, MiniMax for scaled dedicated deployment, and TensorWave for AMD cost
              savings.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Retention and concentration are still the core missing customer metrics
            body: >-
              Public sources support live adoption and multiple deployment surfaces, but they do not disclose the
              customer denominator, renewal quality, or top-customer dependence needed to judge durability.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
          - type: callout
            title: The expansion loop depends on deployment complexity, not just seat growth
            body: >-
              Modular’s monetization path appears to deepen as workloads move from free or shared usage into dedicated
              and BYOC environments where forward-deployed engineering matters.
            calloutType: insight
            claimRefs:
              - CU003
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Highest residual risk sits in neutrality and proof, not in transaction close
        blocks:
          - type: paragraph
            body: >-
              The acquisition itself is no longer the primary public risk because Qualcomm said the deal closed on July
              29, 2026 and that Mojo, MAX, and Modular Cloud will continue as products and brands. The harder residual
              question is whether those products can remain credible as a hardware-neutral layer after becoming part of
              one silicon vendor. Independent coverage is unusually consistent on that point: Qualcomm bought Modular to
              loosen CUDA lock-in, but that strategy only works if developers still treat the stack as a portable layer
              rather than a proprietary sales extension. Public sources also continue to leave production-scale proof
              thin, with independent reporting explicitly noting that the large-scale performance case remains unproven
              outside Modular's own benchmarks.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR012
              - CR014
      - number: '7.2'
        title: Legal and governance risk is mostly a disclosure and commitment problem
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not show an active public lawsuit, enforcement action, or blocked approval, but
              that is not the same thing as a clean bill of health. Instead, the legal and governance issue is narrower
              and more practical: Qualcomm's public mitigation is an open-ecosystem commitment, yet the retained
              documents do not disclose contractual neutrality protections, enterprise service commitments, pricing
              safeguards, or concentration metrics that would let outside investors test whether that commitment
              survives commercialization pressure. That makes regulatory and legal diligence less about reacting to a
              known case and more about verifying what procurement, privacy, export-control, open-source, and
              partner-governance materials actually exist beyond the press narrative.
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Operational execution still hinges on proof outside vendor-controlled benchmarks
        blocks:
          - type: paragraph
            body: >-
              Independent evidence keeps pointing back to the same operational bottleneck: Modular's technical story is
              compelling, but public proof that it can sustain latency, throughput, and developer adoption at meaningful
              production scale is limited. Eastern Herald explicitly says the real-world performance case has not been
              demonstrated outside Modular's own benchmarks, while Beri's review adds procurement and support friction
              by describing quote-only enterprise terms and a services-heavy BYOC model that uses forward-deployed
              engineers. Founders Magazine adds a second-order risk that portability itself can hide vendor-specific
              accelerations, meaning the software may need to preserve deep optimization hooks or it risks disappointing
              exactly the sophisticated buyers it wants to win.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Dependency risk is really a commercialization test against entrenched CUDA behavior
        blocks:
          - type: paragraph
            body: >-
              Modular does not merely need good tooling; it needs to overcome entrenched developer and buyer behavior
              that still defaults to Nvidia and CUDA as the lowest-risk operating choice. That makes partner and
              ecosystem dependency the core commercialization risk. If Qualcomm prioritizes its own accelerators too
              aggressively, if third-party hardware support degrades, or if pricing and support terms tighten after the
              integration, Modular's portability value proposition weakens before public revenue durability is visible.
              The practical kill criteria are therefore monitorable: loss of third-party hardware support, evidence of
              closed or less portable roadmaps, persistent quote-only enterprise contracting without standard service
              commitments, or failure to produce third-party production metrics and customer references that show the
              stack winning live inference share.
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR010
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break risk
            body: >-
              If Modular stops looking like a neutral portability layer and starts looking like a Qualcomm-only
              route-to-market, the acquisition can destroy the very reason Qualcomm paid a premium for it.
            calloutType: risk
            claimRefs:
              - CR004
              - CR011
              - CR014
          - type: callout
            title: Minimum diligence gates before underwriting upside
            body: >-
              Require third-party production benchmarks, standard enterprise pricing/support terms, and evidence that
              multi-vendor hardware support remains intact after the close; without those, the public story is still
              ahead of the public proof.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current mark and investment call
        blocks:
          - type: paragraph
            body: >-
              The latest public valuation anchor is no longer a hypothetical next round but a realized change-of-control
              outcome. Qualcomm and Modular announced the deal on June 24, 2026 and Qualcomm said it completed the
              acquisition on July 29, 2026, while independent sources place the consideration at roughly $3.9-4.0
              billion. That step-up from the September 2025 Series C is meaningful for existing holders, but it also
              changes the underwriting problem: there is no visible standalone primary entry point left for a new
              investor to price. For a fresh investment decision, the disciplined call is to pass on any hypothetical
              mark that simply reuses the strategic takeout without new operating disclosure and explicit security-level
              access.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV010
              - CV013
              - CV014
      - number: '8.2'
        title: Why the strategic premium happened, and why it should not be blindly reused
        blocks:
          - type: paragraph
            body: >-
              Public and company-controlled evidence lines up on why Qualcomm paid a premium: Modular's core pitch is a
              hardware-portable AI stack spanning compilation, inference, orchestration, and managed deployment, and
              Qualcomm explicitly tied the acquisition to an open software layer that could extend its edge-to-cloud AI
              strategy. Post-close sources still describe MAX, Mojo, and Modular Cloud as active products, which
              supports the idea that the buyer wanted continuity rather than a talent-only tuck-in. The anti-thesis is
              just as important for valuation discipline. Independent product reviews and analyses warn that Qualcomm
              ownership could dilute perceived hardware neutrality, change pricing power, or make vendor claims hard to
              verify. Without disclosed ARR, gross margin, retention, or customer concentration, investors cannot
              convert strategic logic into a durable standalone software multiple.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.3'
        title: Scenario framing and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario analysis should be anchored on what is actually observable. Existing holders appear to have
              realized an attractive exit multiple versus the last private mark, but public evidence does not disclose
              the liquidation stack, share-count waterfall, or post-close earnout structure that would be needed to
              judge investor proceeds precisely. For a new buyer, the strategic transaction is best used as a
              ceiling-shaped reference, not as proof that a fresh minority round would clear at the same level. The
              gating diligence asks remain straightforward: get product-level revenue and margin by deployment model,
              verify renewal and concentration, and inspect the security-level terms behind both the last private round
              and the Qualcomm exit before underwriting any derivative or secondary opportunity.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
