      - number: '4.3'
        title: Capital adequacy after the Qualcomm close
        blocks:
          - type: paragraph
            body: >-
              The earlier funding chronology belongs in Company Overview; for underwriting purposes here, the more
              important financial update is that Qualcomm announced the deal in June 2026 and completed it in July 2026,
              then said Mojo, MAX, and Modular Cloud would continue with expanded investment and support. That
              materially changes the near-term financing question: Modular no longer reads like a standalone company
              racing toward its next venture round. However, public evidence still does not show Modular-only cash on
              hand, burn, runway, internal capital budgets, or purchase-accounting assumptions. The capital question
              therefore shifts from “can it raise again?” to “how aggressively will Qualcomm fund growth, neutrality,
              and go-to-market support, and what returns must the product line clear inside a larger parent?”
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI016
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, the business looks more like an infrastructure platform with several monetization levers than
              a mature company with underwritable operating metrics. Public evidence is good enough to describe the
              bridge from free adoption to cloud usage, dedicated capacity, and services support, and the acquisition
              reduces immediate external financing risk. It is not good enough to judge revenue quality, margin
              durability, sales efficiency, or customer concentration. The biggest blockers are realized pricing by
              channel, gross margin by deployment model, cohort retention, and post-close capital allocation discipline.
              Until those are disclosed in diligence, the prudent conclusion is that Modular may have real commercial
              leverage, but the public record still supports a research-more stance rather than a conviction
              underwriting case.
            claimRefs:
              - CI002
              - CI006
              - CI008
              - CI011
              - CI014
              - CI015
              - CI016
