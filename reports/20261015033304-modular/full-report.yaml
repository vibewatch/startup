        - label: Proprietary APIs
          x: 1
          'y': 5
          tone: neutral
          note: Fastest turnkey consumption path in the evidence set, but with the least runtime and hardware control.
        - label: Self-hosted open-source stacks
          x: 5
          'y': 2
          tone: risk
          note: Maximum control is offset by setup, tuning, and operator burden staying with the buyer.
        - label: Internal build
          x: 5
          'y': 1
          tone: risk
          note: Most customizable option, but also the highest staffing and maintenance load in the assigned evidence.
    approximationNotes: >-
      Coordinates are ordinal 1-5 placements synthesized from assigned source descriptions of control, portability, and
      deployment burden; they are not measured market-share or performance values.
    claimRefs:
      - CP002
      - CP005
      - CP006
      - CP007
      - CP009
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a progression from free adoption into token, capacity, and support-linked monetization,
      while gross profit remains undisclosed.
    data:
      nodes:
        - id: entry
          label: Free self-hosted entry
          value: $0
          unit: community/open-source
          note: Beri says self-hosting MAX and Mojo is free.
        - id: shared
          label: Shared cloud usage
          value: $ / 1M tokens
          note: Selected Modular Cloud endpoints publish token prices.
        - id: dedicated
          label: Dedicated production deployment
          value: $ / GPU minute
          note: Dedicated endpoints are billed per GPU minute.
        - id: byoc
          label: BYOC deployment
          value: Quote / reserved GPU capacity
          note: Runs in the customer's VPC with custom terms.
        - id: services
          label: Services and tuning
          value: Forward-deployed engineers
          note: Support work is part of the offer on some plans.
        - id: margin
          label: Gross profit outcome
          value: Undisclosed
          note: Depends on hardware mix, utilization, and support load.
      edges:
        - from: entry
          to: shared
