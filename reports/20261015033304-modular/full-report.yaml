      - CE003
      - CE004
      - CE006
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests a motion from low-friction developer trial into higher-touch dedicated and BYOC
      production deployments, with post-acquisition neutrality risk affecting expansion.
    data:
      items:
        - label: Self-hosted evaluation
          actor: Developer or ML platform team
          touchpoints:
            - Free self-hosted MAX and Mojo
            - OpenAI-compatible endpoints
            - Community support via Discord and GitHub
          note: Entry point is low-friction and developer-led rather than procurement-led.
        - label: Custom model port
          actor: Research or kernel engineering team
          touchpoints:
            - Port proprietary architectures with MAX APIs
            - Write kernels once in Mojo
            - Avoid parallel CUDA and HIP codebases
          note: Qwerky AI is the clearest named proof of this stage.
        - label: Benchmark on shared cloud
          actor: Platform team
          touchpoints:
            - Shared per-token endpoints
            - Benchmark latency and throughput
            - Test portability across NVIDIA and AMD
          note: This stage validates economics before heavier deployment.
        - label: Dedicated production rollout
          actor: Enterprise deployment owner
          touchpoints:
            - Dedicated endpoints billed per GPU minute
            - Forward-deployed engineers
            - High-scale production inference
          note: MiniMax is the strongest public proof of scaled production.
        - label: BYOC / private deployment
          actor: Security-conscious enterprise
          touchpoints:
            - Deploy in the customer VPC
            - Keep data in the customer environment
            - Use enterprise support and tuning
          note: Private deployment expands the addressable buyer set but raises support intensity.
        - label: Expansion or churn test
          actor: CIO, platform lead, or procurement
          touchpoints:
            - Add more workloads or hardware targets
            - Assess pricing after Qualcomm integration
            - Decide whether hardware neutrality remains credible
          note: Independent sources flag neutrality and pricing as the key post-acquisition risk.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU010
      - CU011
