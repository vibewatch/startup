      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The milestone record is good enough to establish chronology even if it leaves commercialization gaps
              unresolved. The sources place founding in 2022, platform launch in 2023, a major financing reset in
              September 2025, acquisition signing in June 2026, close in July 2026, and product-level milestones around
              Mojo in August 2026. That sequence supports a credible narrative of fast technical execution and strategic
              relevance. It also sharpens the remaining diligence ask: after the Qualcomm sale, investors now need proof
              that Modular's neutrality, customer traction, and benchmark edge survive inside a parent whose own silicon
              priorities could influence optimization choices.
