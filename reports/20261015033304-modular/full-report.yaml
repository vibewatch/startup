      - number: '5.3'
        title: Deployment maturity and packaging
        blocks:
          - type: paragraph
            body: >-
              Public packaging appears broader than the repo alone suggests. Independent directories describe a free
              self-hosted motion, Modular Cloud shared endpoints, dedicated capacity, and BYOC/private-cloud
              deployments, while Qualcomm and Modular both framed the acquisition around extending that same stack
              across edge, cloud, and heterogeneous compute. That implies a credible productization path for enterprise
              evaluation, but it does not yet prove renewal strength, support economics, or how much of the commercial
              surface is standardized versus engineer-assisted.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE010
      - number: '5.4'
        title: Trust controls and product risks
        blocks:
          - type: paragraph
            body: >-
              The main product risks are not whether Modular has code, but whether it can sustain neutral cross-vendor
              credibility and enterprise-grade controls after becoming part of Qualcomm. Independent sources still
              repeat the cross-hardware and cost narrative, but they also note that performance claims remain
              vendor-reported and that commercial terms for private deployments are often quote-based. The assigned pool
              is also light on first-party trust, status, and privacy disclosures, so diligence should treat compliance
              and reliability maturity as only partially evidenced rather than proven by marketing shorthand.
            claimRefs:
