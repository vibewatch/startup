  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow
        blocks:
          - type: paragraph
            body: >-
              Modular's public materials describe a developer-facing inference platform that starts at kernel authoring
              and ends at production serving, not just a managed API. The open repository points to MAX serving, model
              pipelines, and Mojo compiler assets, while third-party directories describe the commercial wrappers around
              that software as self-hosted, managed cloud, and BYOC/VPC deployments. In workflow terms, the buyer is an
              ML platform or infrastructure team that wants to run open models, preserve API compatibility, and avoid
              rewriting the stack whenever hardware choices change.
