      - number: '1.2'
        title: Founders, leadership, and control transition
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit remains one of Modular's clearest strengths. Chris Lattner's compiler pedigree is
              repeatedly used to explain why the company pursued hardware-portable AI infrastructure, and third-party
              coverage still names Tim Davis alongside him as a co-founder. The key 2026 leadership change is that
              Lattner moved from Modular CEO to Qualcomm EVP after the close, which should help product continuity but
              also concentrates roadmap credibility in one person. Public governance disclosure is otherwise thin in the
              assigned pool: there is no authoritative board list, no post-close org chart below Lattner, and no
              official headquarters or exact headcount disclosure.
