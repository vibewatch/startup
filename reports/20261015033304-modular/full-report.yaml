      - number: '3.3'
        title: Switching costs and moat durability
        blocks:
          - type: paragraph
            body: >-
              Modular lowers one kind of switching cost while creating another. Source-backed portability across NVIDIA,
              AMD, CPUs, and other accelerators can reduce dependency on a single hardware path, especially for buyers
              who want to move off black-box managed endpoints or CUDA-centric deployment choices. But teams still have
              to absorb a new platform and, often, Mojo-based optimization work. Third-party reviews repeatedly flag the
              learning curve, immature ecosystem, and missing independent benchmark proof. The post-Qualcomm setup
              sharpens the risk: if buyers conclude future optimization priority will tilt toward Qualcomm's hardware,
              Modular's "neutral layer" narrative weakens and simpler managed or open-source substitutes become more
              credible.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modular's wedge is control without full self-hosting
            body: >-
              The strongest competitive angle is not "best model API" but "portable stack with production help" for
              teams that want multi-accelerator choice without building and tuning everything themselves.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: The moat is conditional, not settled
            body: >-
              If Qualcomm ownership undermines perceived neutrality or independent benchmark proof never materializes,
              Modular becomes easier to substitute with simpler managed endpoints or open-source serving stacks.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and price visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a multi-surface monetization model rather than a single SaaS contract structure.
              Beri's October 2026 review says self-hosting MAX and Mojo is free, shared Modular Cloud endpoints publish
              per-token rates for selected models, dedicated hosted deployments bill per GPU minute, and BYOC or
              enterprise engagements remain quote-based. Qualcomm and Modular frame the stack as a hardware-agnostic
              layer that can run across heterogeneous accelerators, so the commercial thesis is not only software
              licensing but also operating revenue tied to inference traffic, reserved capacity, and support-heavy
              deployments. That menu is directionally helpful, but it is still list-pricing evidence, not proof of
              realized ASPs, discounts, or mix.
            claimRefs:
