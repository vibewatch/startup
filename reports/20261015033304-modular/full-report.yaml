        title: Customer base is clearest by workflow and deployment need, not by disclosed account count
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence supports a buyer and user segmentation anchored in workload and deployment
              model rather than in disclosed revenue bands or customer counts. Modular’s clearest buyer appears to be
              the head of ML platform or AI infrastructure team that wants to serve open models across multiple hardware
              vendors without rewriting kernels for each accelerator stack. Company pages and third-party directories
              also point to adjacent segments: custom-model builders that need graph or kernel programmability,
              enterprises that require private deployment in their own VPC, and broader developer, hyperscaler,
              model-creator, and OEM ecosystems that Qualcomm says it wants to serve after the acquisition. What is
              still missing is payer mix by segment, contract size, or the split between self-hosted usage, Modular
              Cloud, and BYOC revenue.
