        title: Funding history, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The cleanest public financing fact pattern is still the September 2025 Series C. Modular's own
              announcement says the company raised $250 million, reached $380 million total funding, and was valued at
              $1.6 billion, with USIT leading and DFJ Growth plus existing investors participating. That is enough to
              anchor a pre-exit private-market reference point, but not enough to underwrite realized value creation
              from the Qualcomm outcome because the assigned sources do not disclose acquisition consideration mix,
              rollover treatment, liquidation preferences, or any revenue and margin evidence that would contextualize
              the private mark. Independent commentary also keeps pointing investors back to benchmark proof rather than
              to disclosed commercial results.
