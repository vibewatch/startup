        title: Public traction proxies and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are named references rather than audited commercial metrics. Forbes
              reported live traffic on OpenRouter plus paying or production references including MiniMax, Hippocratic
              AI, and Jane Street, while Beri listed additional named users such as Inworld, TensorWave, and AWS. Those
              logos indicate relevance across shared cloud, dedicated, and partner-led deployments, but they do not
              disclose seat counts, contract values, renewal behavior, or customer concentration. The same pattern shows
              up in unit economics: public materials discuss performance, portability, and support workflows, and
              DeepWiki's technical summary points to real serving and distributed-systems complexity, yet the retained
              sources still do not show gross margin, support load per account, CAC, payback, or retention.
