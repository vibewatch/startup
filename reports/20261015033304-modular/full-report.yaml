  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows the realized exit mark, the strategic-product rationale, the missing operating
      disclosure, and the lack of a fresh entry point.
    data:
      nodes:
        - id: last-private-mark
          label: Last private mark
          detail: $250 million Series C at a $1.6 billion post-money valuation in September 2025.
        - id: strategic-proof
          label: Strategic proof
          detail: Qualcomm and Modular both positioned the stack as open and portable across heterogeneous hardware.
        - id: takeout-mark
          label: Takeout mark
          detail: Independent sources place the all-stock acquisition at roughly $3.9-4.0 billion.
        - id: disclosure-gap
          label: Disclosure gap
          detail: Public sources still omit revenue, margin, retention, concentration, and liquidation preferences.
        - id: entry-constraint
          label: Entry constraint
          detail: >-
            Qualcomm said it completed the acquisition on July 29, 2026, leaving no visible fresh standalone primary
            round.
        - id: recommendation
          label: Recommendation
          detail: >-
            Pass for new primary capital; reopen only for a distinct security with full commercial and term-sheet
            diligence.
      edges:
        - from: last-private-mark
          to: strategic-proof
          label: Shows the pre-exit baseline
        - from: strategic-proof
          to: takeout-mark
          label: Helps explain the strategic premium
        - from: takeout-mark
          to: disclosure-gap
          label: Headline value still needs operating support
        - from: disclosure-gap
          to: entry-constraint
          label: Missing proof matters more because the standalone security is gone
        - from: entry-constraint
          to: recommendation
          label: No fresh price-sensitive entry is publicly supportable
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV010
      - CV013
      - CV014
