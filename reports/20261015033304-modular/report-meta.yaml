companyProfile:
  summary: >-
    Modular is a Qualcomm-owned AI infrastructure platform built around MAX, Mojo, and Modular Cloud. Its public pitch
    is hardware portability: the stack is intended to let teams run inference and custom kernels across NVIDIA, AMD,
    CPUs, and other accelerators without maintaining separate vendor codebases. The company has clear technical
    differentiation and some named customer proof, but the public record still does not disclose revenue, margin,
    retention, or customer concentration.
  founders:
    - name: Chris Lattner
      role: Co-founder; former CEO; Qualcomm EVP of Advanced AI Software and Platforms
      background: LLVM and Swift creator whose compiler pedigree underpins Modular's portable-compute thesis
      claimRefs:
        - CO003
        - CO004
    - name: Tim Davis
      role: Co-founder
      background: Named alongside Lattner in third-party company profiles
      claimRefs:
        - CO003
  headquarters: Palo Alto, CA, USA
  productSummary: >-
    MAX inference serving, Mojo kernel development, and Modular Cloud deployment across shared, dedicated, and
    customer-VPC modes
  customerFocus: >-
    ML platform, AI infrastructure, and enterprise teams that need hardware-portable deployment across heterogeneous
    accelerators
  businessModel: >-
