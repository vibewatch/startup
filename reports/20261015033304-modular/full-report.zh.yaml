      - number: '3.2'
        title: 能力与产品包装比较
        blocks:
          - type: paragraph
            body: >-
              能力覆盖足以影响入围筛选。官方云页面、DeepWiki 产品摘要和第三方评测都显示，Modular 覆盖共享端点、 专用部署、BYOC 环境、自定义内核和多加速器支持，不只是薄薄的托管封装。但包装也暴露了 GTM
              取舍：买方可通过自助共享端点测试，高价值销售则依赖专用方案、客户 VPC 和前线工程师调优。实际更接近企业基础设施销售，而非纯自助 API。
