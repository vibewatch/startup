              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: 创始人、领导层与控制权过渡
        blocks:
          - type: paragraph
            body: >-
              创始团队与市场的匹配度仍是 Modular 最明确的优势之一。外界反复用 Chris Lattner 的编译器履历解释公司 为何押注硬件可移植 AI 基础设施；第三方报道仍将 Tim Davis
              与他并列为联合创始人。2026 年的关键变化是 交易完成后 Lattner 从 Modular CEO 转任 Qualcomm 执行副总裁，这有助于产品延续，但也让路线图可信度集中
              在一人身上。除此之外，公开治理信息很少：没有权威董事会名单、Lattner 以下的交易后组织架构、官方总部 或准确员工人数。
            claimRefs:
              - CO003
              - CO004
              - CO012
              - CO014
