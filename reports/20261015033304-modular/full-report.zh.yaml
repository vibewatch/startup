companyProfile:
  summary: >-
    Modular 是 Qualcomm 旗下的 AI 基础设施平台，核心产品包括 MAX、Mojo 和 Modular Cloud。它对外主打跨硬件 可移植性：团队无需维护各厂商独立代码库，就能在 NVIDIA、AMD、CPU
    及其他加速器上运行推理和自定义内核。公司技术差异化明确，也有一些具名客户证据，但公开记录仍未披露收入、利润率、留存或客户集中度。
