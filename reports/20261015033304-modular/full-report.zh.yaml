      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务上，这更像拥有多种变现杠杆的基础设施平台，而非具备可承销经营指标的成熟公司。公开证据足以描述 从免费采用到云使用、专用容量和服务支持的路径，收购也降低了即时外部融资风险；但不足以判断收入质量、
              利润率持久性、销售效率或客户集中度。最大阻碍是各渠道实际价格、各部署模式毛利率、队列留存以及交易后 资本配置纪律。在尽调披露这些数据前，审慎结论是 Modular
              可能拥有真实商业杠杆，但公开记录支持“继续研究”，而不是高确信度投资判断。
