  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持这样一套分层技术栈：从 Mojo / 编译器资产，经 MAX 运行时层，延伸至部署界面和开发者访问入口。
    data:
      layers:
        - label: 兼容 OpenAI 的 API / max serve
          detail: 公开代码仓库和代码追踪来源指向一个服务界面，可替代仅支持托管的前端。
        - label: 自托管、云和 BYOC 选项
          detail: 独立目录描述了几种部署模式：基于同一软件底座，分别包装为社区版、托管版和私有云版。
        - label: MAX 推理服务器
          detail: 运行时层负责服务、模型执行，以及结构化输出、工具调用等面向开发者的功能。
        - label: 流水线注册表、配置和清单
          detail: 架构到实现的映射和模型配置逻辑，组织起支持范围与上手流程。
        - label: MAX 内核 / 加速器库
          detail: 硬件调优原语和面向特定加速器的优化资产位于运行时之下。
        - label: Mojo 编译器 + 标准库
          detail: 可移植的语言和编译器资产支持定制内核开发及底层性能工作。
    approximationNotes: 该图根据代码仓库路径、文档和代码追踪摘要进行结构化综合；并非延迟或数据流基准测试。
