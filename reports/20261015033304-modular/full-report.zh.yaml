            title: 公开变现细节仍不足以支持投资判断
            body: 可见价目表说明 Modular 如何收费，但公开资料仍未披露实际价格、客户集中度、毛利率或留存，因此收入质量 基本无法检验。
            calloutType: risk
            claimRefs:
