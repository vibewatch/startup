            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO012
              - CO014
      - number: '1.3'
        title: 融资历史、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开融资事实仍是 2025 年 9 月的 C 轮。Modular 自己宣布融资 $250M，累计融资达到 $380M，估值为 $1.6B，由 USIT 领投，DFJ Growth
              和老股东参与。这足以作为退出前私募市场参考点，却不足以 评估 Qualcomm 交易创造的实际价值，因为材料未披露收购对价构成、滚存安排、清算优先权，也没有收入和
              利润率证据来解释这笔私募估值。独立评论仍把投资者引向基准测试，而不是已披露的商业结果。
            claimRefs:
