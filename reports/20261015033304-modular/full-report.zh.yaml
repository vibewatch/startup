            body: >-
              保留的公开证据支持以工作负载和部署模式，而非收入区间或客户数，来划分买方和用户。最清晰的买方似乎是 ML 平台或 AI 基础设施负责人，希望在多个硬件厂商上服务开放模型而不为每种加速器重写内核。公司页面和
              第三方目录还指向相邻客群：需要图或内核可编程性的自定义模型构建者、要求在自身 VPC 私有部署的企业，以及 Qualcomm 收购后希望服务的开发者、超大规模云厂商、模型创作者和 OEM
              生态。仍缺少的是按客群划分 的付款方组合、合同规模，以及自托管、Modular Cloud 和 BYOC 收入的拆分。
