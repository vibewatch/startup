      - number: '7.4'
        title: 依赖风险本质上是对抗根深蒂固 CUDA 习惯的商业化测试
        blocks:
          - type: paragraph
            body: >-
              Modular 不只需要好工具，还要改变开发者和买方根深蒂固的习惯：默认把 Nvidia 和 CUDA 视为最低风险的 运营选择。因此伙伴和生态依赖是核心商业化风险。若 Qualcomm
              过度优先自有加速器、第三方硬件支持变差，或整合后价格和支持条款收紧，Modular 的可移植性价值会在公开收入持久性显现前先削弱。可监测的退出标准
              包括失去第三方硬件支持、路线图封闭或更不可移植、企业合同长期只能询价且无标准服务承诺，或拿不出第三方 生产指标和客户案例证明其技术栈赢得真实推理份额。
