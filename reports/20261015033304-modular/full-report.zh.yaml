        title: 当前估值与投资判断
        blocks:
          - type: paragraph
            body: >-
              最新公开估值锚点不再是假设的下一轮，而是已经实现的控制权变更。Qualcomm 与 Modular 于 2026 年 6 月 24 日宣布交易，Qualcomm 称 7 月 29 日完成收购；独立来源估计对价约
              $3.9-4.0B。相较 2025 年 9 月 C 轮，这对现有持有人是有意义的跃升，但也改变了投资判断问题：新投资者已看不到可定价的独立一级
              进入点。新的投资决策应保持纪律：若没有新的经营披露和明确的证券层面访问，不要简单复用战略收购价。
