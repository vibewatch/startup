        title: 法律与治理风险主要是披露和承诺问题
        blocks:
          - type: paragraph
            body: >-
              现有材料没有显示正在进行的公开诉讼、执法行动或被阻止的审批，但这不等于风险清零。更实际的问题是：Qualcomm 的公开缓释措施是开放生态承诺，可保留文件没有披露合同层面的中立性保护、企业服务承诺、定价
              保障或集中度指标，外部投资者无法检验承诺能否经受商业化压力。因此法律和监管尽调的重点不是应对已知 案件，而是核实新闻叙事之外究竟有哪些采购、隐私、出口管制、开源和伙伴治理材料。
