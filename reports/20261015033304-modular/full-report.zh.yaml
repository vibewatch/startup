  - id: FM001
    title: 从广泛 AI 基础设施需求到 Modular 当前买方中心的市场切口
    type: pyramid
    summary: 数字上限来自广泛的 AI 基础设施和 GPU 扩张，但可执行的切口很快收窄到异构推理、智能体循环、受控部署和采购筛选。
    data:
      items:
        - label: 广泛的 AI 基础设施需求
          displayValue: ~$87.6B in 2025
          detail: Founders Magazine 引用了一项预测，认为广泛的 AI 基础设施将强劲增长至 2030 年。
          note: 这是需求的有用上限，不是 Modular 特定的 SAM。
          claimRefs:
            - CM009
        - label: AI 计算 / GPU 扩张
          displayValue: Hundreds of billions over the next decade
          detail: Founders Magazine 还将数据中心 GPU TAM 描述为规模庞大且持续扩张。
          note: 硬件 TAM 高估了软件可移植性切口。
          claimRefs:
            - CM010
        - label: 硬件中立计算层
          displayValue: Build once, deploy anywhere
          detail: Qualcomm 和 Gate 都将核心切口描述为跨硬件可移植，无需重写技术栈。
          claimRefs:
            - CM003
            - CM013
        - label: 智能体推理循环
          displayValue: 10-50 calls per task
          detail: Modular 当前解决方案页面强调连续的智能体工作负载，其中延迟会层层累积。
          claimRefs:
            - CM007
        - label: 受部署约束的买方
          displayValue: Cloud, dedicated, BYOC, and on-device
          detail: 公开证据指向私有 VPC、离线和混合硬件部署，这些是摩擦最大的使用场景。
          claimRefs:
            - CM006
            - CM008
        - label: 采购筛选
          displayValue: Quote-only pricing and neutrality diligence
          detail: 定价不透明以及收购后的可信度问题收窄了近期买方范围。
          claimRefs:
            - CM014
    approximationNotes: 上层采用该来源池报告的公开市场视角；下层是有证据支持的买方中心筛选，不是推导出的 SAM 或 SOM。
