        blocks:
          - type: paragraph
            body: >-
              独立证据不断指向同一运营瓶颈：Modular 的技术故事很有吸引力，但公开证据有限，尚不能证明它能在有意义 的生产规模维持延迟、吞吐量和开发者采用。Eastern Herald 明确称真实性能在 Modular
              自有基准之外尚未 得到证明；Beri 则称企业条款需询价，BYOC 模式服务投入高且使用前线工程师，增加采购和支持摩擦。Founders Magazine
              还指出二阶风险：可移植性本身可能掩盖厂商专属加速，因此软件必须保留深度优化钩子，否则会让 它最想赢得的高级买方失望。
