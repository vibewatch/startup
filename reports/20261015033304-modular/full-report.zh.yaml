      - number: '3.3'
        title: 切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Modular 降低了一类切换成本，却制造了另一类。跨 NVIDIA、AMD、CPU 和其他加速器的可移植性可减少对单一 硬件路径的依赖，尤其适合想摆脱黑箱托管端点或 CUDA
              部署的买方。但团队仍要吸收新平台，常常还要做 Mojo 优化。第三方反复指出学习曲线、生态不成熟和缺乏独立基准证据。Qualcomm 收购后，若买方认为未来 优化会偏向 Qualcomm
              硬件，“中立层”叙事就会削弱，简单的托管或开源替代方案更可信。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
      - number: '3.4'
        title: 证据图表
        blocks:
          - type: callout
            title: Modular 的切入口是在不完全自托管下获得控制力
            body: 最强竞争角度不是“最佳模型 API”，而是为希望选择多种加速器、却不想自行构建和调优全部系统的团队提供 “带生产支持的可移植技术栈”。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: 护城河有条件，尚未坐实
            body: 如果 Qualcomm 持有削弱市场对中立性的认知，或独立基准证据始终无法出现，Modular 就更容易被简单托管端点 或开源服务技术栈替代。
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
