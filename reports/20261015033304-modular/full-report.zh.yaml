              战略的开放软件层联系起来。交易后来源 仍把 MAX、Mojo 和 Modular Cloud 描述为活跃产品，支持买方寻求产品延续而非仅收购人才的判断。估值纪律 同样要看反方：独立评测警告 Qualcomm
              持有可能稀释硬件中立性、改变定价权，或让厂商主张难以核实。没有 ARR、毛利率、留存和客户集中度披露，投资者无法把战略逻辑转换成持久的独立软件倍数。
