        title: 里程碑与尽调含义
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足以厘清时间线，但商业化缺口仍未解决。资料显示公司 2022 年成立、2023 年推出平台、 2025 年 9 月完成重大融资重置、2026 年 6 月签署收购、7 月完成交割，并在 2026 年 8
              月取得 Mojo 产品里程碑。这条线支持“技术执行快、战略价值高”的叙事，也明确了下一步尽调：Qualcomm 收购后，需要证明 Modular
              的中立性、客户进展和基准优势能在母公司内部延续，而母公司的芯片优先级可能影响 优化选择。
