          to: strategic-proof
          label: 展示退出前基准
        - from: strategic-proof
          to: takeout-mark
          label: 有助于解释战略溢价
        - from: takeout-mark
          to: disclosure-gap
          label: 主标题估值仍需要运营数据支撑
        - from: disclosure-gap
          to: entry-constraint
          label: 独立证券已消失，缺失的证明因此更关键
        - from: entry-constraint
          to: recommendation
          label: 公开信息不足以支持新的价格敏感型入场
