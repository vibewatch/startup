      - 证据所示
      - 什么会改变判断
    rows:
      - - 正论：战略相关性
        - Qualcomm 和 Modular 都将交易定位为开放且可跨硬件移植的 AI 软件层，覆盖 CPU、GPU、NPU 和定制芯片。
        - 若有独立证据证明这一定位在交易完成后转化为持久收入增长，信心会增强。
      - - 正论：产品连续性
        - Qualcomm 表示 Mojo、MAX 和 Modular Cloud 将继续作为产品和品牌存在；第三方资料仍描述广泛的部署方式和多厂商支持。
        - 交易完成后第三方硬件支持持续、客户扩张的证据，会让战略溢价更容易站得住。
      - - 反论：中立性风险
        - 独立评审者和分析认为，Qualcomm 旗下业务最终可能优先支持 Qualcomm 加速器或调整定价，削弱硬件中立的叙事。
        - 若有合同或技术证据显示对非 Qualcomm 硬件提供同等支持和商业待遇，这一担忧会减轻。
      - - 反论：经营披露薄弱
        - 留存公开记录仍缺少当前收入 / ARR、毛利率、留存、集中度和清算优先权信息。
        - 需要数据室提供产品层面的商业指标和证券条款，才能从战略故事走向可投资定价。
    notes: 各行将买方逻辑与投资评估缺口分开，避免把正论误当成独立估值支撑的证明。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Qualcomm 保持真正的硬件中立，在第三方加速器上扩大 MAX 和 Mojo 的规模，收购背后的战略协同在商业上得到验证。
        - Qualcomm 交易仍是合理的已实现基准，对战略买方而言甚至可能偏保守；但这部分上行空间主要属于收购方和原持有人，而不是新的少数股权投资者。
        - 中立性削弱、整合放缓，或客户采用集中在少数展示性账户。
        - 有可能，但无法仅凭公开记录直接投资。
      - - 基准
        - 收购价格反映真实战略价值，但公开经营披露仍很薄弱，当前证券也无法作为独立股权交易。
        - 将约 $3.9-4.0 billion 视为战略上限参考，将 $1.6 billion Series C 视为最后一个可复用的私募估值标记；没有新的尽调，不要评估两者之间的新一轮融资。
        - 投资者过度围绕醒目的退出价格建模，忽视收入、利润率、留存和股权结构表证据的缺失。
        - 与留存证据最一致。
      - - 悲观
        - Qualcomm 旗下的硬件中立性减弱，客户牵引力比公开案例暗示的更窄，且由于证券条款，投资者所得与醒目估值存在重大差异。
        - 独立估值可能明显更接近此前私募估值，而非战略收购价，因此在退出价或接近退出价的位置进行任何假设性后续融资都难以辩护。
        - 优先股堆叠、股份数量分配瀑布或集中度数据证明情况不如头条叙事所暗示的有利。
        - 证券条款尽调未补齐缺口前，必须保留这一情景。
    notes: 情景行有意避开缺乏支持的点估计，而是将每种情景绑定到已披露的估值锚点和明确列出的证据缺口。
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
