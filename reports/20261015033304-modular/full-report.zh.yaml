    sections:
      - number: '7.1'
        title: 最大剩余风险在中立性和证据，而非交易交割
        blocks:
          - type: paragraph
            body: >-
              收购本身不再是主要公开风险，因为 Qualcomm 表示交易已于 2026 年 7 月 29 日完成，Mojo、MAX 和 Modular Cloud
              将继续作为产品和品牌。更难的问题是，成为一家芯片厂商的一部分后，这些产品能否继续作为 硬件中立层获得信任。独立报道对此高度一致：Qualcomm 收购 Modular 是为削弱 CUDA 锁定，但前提是开发者
              仍把它视为可移植层，而不是专有销售延伸。公开资料对生产规模证据仍很薄弱，独立报道明确称大规模性能 案例在 Modular 自有基准之外仍未得到证明。
