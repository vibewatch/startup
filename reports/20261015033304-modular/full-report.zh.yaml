    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与价格透明度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多层变现模式，而非单一 SaaS 合同。Beri 2026 年 10 月评测称，MAX 和 Mojo 自托管免费；共享 Modular Cloud 端点对部分模型公布按 token
              费率；专用托管部署按 GPU 分钟计费；BYOC 或企业合作仍 需询价。商业逻辑不仅是软件许可，也包括推理流量、预留容量和高支持投入部署带来的运营收入。但这些只是 标价证据，并不能证明实际
              ASP、折扣或收入组合。
