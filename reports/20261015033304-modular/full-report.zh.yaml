  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该建议依据已实现的退出估值、战略产品逻辑、缺失的运营披露，以及缺乏新的入场机会得出。
    data:
      nodes:
        - id: last-private-mark
          label: 最近一轮私募估值
          detail: September 2025 完成 $250 million 的 C 轮融资，投后估值为 $1.6 billion。
        - id: strategic-proof
          label: 战略证明
          detail: Qualcomm 和 Modular 均将这套技术栈定位为开放、可跨异构硬件移植。
        - id: takeout-mark
          label: 收购估值
          detail: 独立来源称全股票收购价格约为 $3.9-4.0 billion。
        - id: disclosure-gap
          label: 披露缺口
          detail: 公开来源仍未披露收入、利润率、留存、集中度和清算优先权。
        - id: entry-constraint
          label: 入场约束
          detail: Qualcomm 表示已于 July 29, 2026 完成收购，因此目前看不到新的独立公司一级融资。
        - id: recommendation
          label: 建议
          detail: 放弃新的一级资本投资；只有在出现独立证券、并完成商业和条款清单尽调后才重新评估。
      edges:
