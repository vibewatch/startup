  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，客户可能从低门槛开发者试用进入高接触度的专用端点和 BYOC 生产部署；收购后的中立性风险可能影响扩张。
    data:
      items:
        - label: 自托管评估
          actor: 开发者或 ML 平台团队
          touchpoints:
            - 免费自托管 MAX 和 Mojo
            - 兼容 OpenAI 的端点
            - 通过 Discord 和 GitHub 获取社区支持
          note: 入口低门槛，由开发者主导，而不是采购主导。
        - label: 定制模型移植
          actor: 研究或内核工程团队
          touchpoints:
            - 用 MAX API 移植专有架构
            - 用 Mojo 编写一次内核
            - 避免并行维护 CUDA 和 HIP 代码库
          note: Qwerky AI 是这一阶段最明确的具名案例。
        - label: 在共享云上做基准测试
          actor: 平台团队
          touchpoints:
            - 按 token 计费的共享端点
            - 测试延迟和吞吐量
            - 验证 NVIDIA 与 AMD 之间的可移植性
          note: 这一阶段先验证经济性，再进入更重的部署。
        - label: 专用生产上线
          actor: 企业部署负责人
          touchpoints:
            - 按 GPU 分钟计费的专用端点
            - 前置部署工程师
            - 大规模生产推理
          note: MiniMax 是规模化生产最有力的公开案例。
        - label: BYOC / 私有部署
          actor: 重视安全的企业
          touchpoints:
            - 部署在客户 VPC 中
            - 数据留在客户环境内
            - 使用企业支持和调优服务
          note: 私有部署扩大可触达买方范围，但也提高支持强度。
        - label: 扩张或流失测试
          actor: CIO、平台负责人或采购方
          touchpoints:
            - 增加更多工作负载或硬件目标
            - 评估 Qualcomm 整合后的定价
            - 判断硬件中立性是否仍可信
          note: 独立来源将中立性和定价列为收购后的主要风险。
