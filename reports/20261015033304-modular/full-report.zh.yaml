      - number: '6.3'
        title: 扩张逻辑合理，但持久性和集中度仍披露不足
        blocks:
          - type: paragraph
            body: >-
              可见的“先落地、再扩张”路径是连贯的：免费自托管或轻量试用可导向共享端点，再进入专用生产或 BYOC 部署，由 Modular
              工程师在客户环境中调优性能。性能调优、私有部署和更广泛硬件可移植性共同构成了可信的扩张回路。但公开材料仍未披露客户数、NRR、GRR、流失、续约节奏、头部账户暴露或渠道集中度。独立评论还指出 真实的交易后风险：若
