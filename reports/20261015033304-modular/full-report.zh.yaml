  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：异构推理基础设施，而非通用 AI 软件
        blocks:
          - type: paragraph
            body: >-
              现有证据支持对 Modular 采用较窄的市场定义：帮助开发者和企业在异构算力环境部署生成式及 agentic AI，无需为每种加速器重写服务层的基础设施软件。Qualcomm
              将收购对象描述为服务开发者、OEM、ODM、云服务商 和模型创作者的开放计算层；Gate 与 ai2.work 则把替代方案描述为继续依赖 CUDA 工具链或 ROCm 迁移路径。
              因此纳入的是推理服务、编排、内核优化和部署可移植性；不纳入基础模型创建、通用应用软件和无差异聊天 机器人 API。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM017
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM007
              - CM008
              - CM017
      - number: '2.2'
        title: 延迟与部署压力下的平台团队是核心买方
        blocks:
          - type: paragraph
            body: >-
              当前买方证据比泛泛的企业 AI 叙事更具体。BERI 将理想买方描述为 ML 平台负责人或类似基础设施负责人，负责在混合硬件集群上服务开放模型；Modular 当前的 agentic
              页面则强调多步骤工作流团队，每项任务会调用 10 至 50 次，延迟不断累积。两者可以统一：用户通常是 ML 或系统工程师，经济买方是平台、基础设施或 CTO 预算负责人；触发因素要么是 GPU
              集中的成本压力，要么是需要在客户 VPC、受监管环境或离线环境部署。因此公开证据更像工作流驱动的采用路径，而不是自上而下、按席位计价的软件市场。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.3'
        title: 市场测算口径很宽，最诚实的判断只能是方向性的，而非自下而上
        blocks:
          - type: paragraph
            body: >-
              这组公开测算适合设定上限，不足以承销精确的收入机会。Founders Magazine 引用一项 2025 年 AI 基础设施 预测，规模约 $87.6B，预计到 2030 年强劲增长；它还称未来十年数据中心
              GPU 机会达数千亿美元。ai2.work 提供的是异构部署相关的模型化 ROI 区间，而非公开市场普查。合并来看，Modular 解决的问题依附于庞大的 AI
              基础设施支出，但资料无法拆出其中有多少属于厂商中立推理软件、付费云端点或 BYOC 支持。结论应是 漏斗顶部很大，但公开 SAM/SOM 仍未得到证明，应继续标记为尽调缺口。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM010
              - CM014
      - number: '2.4'
        title: 采用约束是中立性可信度、定价不透明和缺少独立基准
        blocks:
          - type: paragraph
            body: >-
              同一批证据既让市场故事成立，也在收窄它。Gate 称价值主张是让客户无需重写代码即可切换芯片，但明确 警告：若 Qualcomm 把技术栈变成 Qualcomm 优先的软件，论点就会削弱。BERI
              还指出两个立即存在的采购摩擦：部分企业价格仍需询价，买方也不能把长期硬件中立性视为已获保证。Qualcomm 交易后表示 Mojo、MAX 和 Modular Cloud
              会继续作为产品，这降低了短期连续性风险，却没有解决更深的尽调问题：公开资料仍缺少 收购后的独立基准、免费转付费部署的转化数据，以及付费软件切入点的独立市场模型。
            claimRefs:
              - CM004
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争者与定位
        blocks:
          - type: paragraph
            body: >-
              现有证据指向广泛竞争集，而非单一直接对手。Modular 主打硬件可移植推理、OpenAI 兼容端点和内核级调优，最近的替代方案是托管端点厂商、专有
              API、开源自托管技术栈和内部平台，而不是另一家相同的可移植内核厂商。Qualcomm 交易也改变了框架：Modular 不再只是中立创业挑战者，而是大型芯片平台内部的软件层；Qualcomm 表示
              Modular Cloud、MAX 和 Mojo 会继续，并扩展其端到云 AI 技术栈。渠道触达扩大了，但中立性 也从默认假设变成了尽调问题。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP012
