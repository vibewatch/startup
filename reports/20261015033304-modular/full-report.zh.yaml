        title: Qualcomm 交割后的资本充足性
        blocks:
          - type: paragraph
            body: >-
              早期融资时间线已在公司概览说明；对这里的投资判断而言，更重要的更新是 Qualcomm 于 2026 年 6 月宣布交易、7 月完成交割，并称会继续投资和支持 Mojo、MAX、Modular
              Cloud。这改变了短期融资问题：Modular 不再像一家急着完成下一轮融资的独立公司。但公开证据仍未显示 Modular 单独的现金、烧钱速度、现金跑道、
              内部资本预算或购买会计假设。资本问题因此从“还能否再融资”转为“Qualcomm 会多积极地为增长、中立性和 GTM 支持投入，以及产品线在大公司内部必须达到什么回报”。
