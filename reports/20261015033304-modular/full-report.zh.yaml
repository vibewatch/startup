chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Modular 现在是 Qualcomm 支持的 AI 软件平台，而非仍独立运营的创业公司。官方材料对产品主张基本一致：用统一技术栈让开发者在异构硬件上部署推理工作负载，MAX、Mojo 以及托管或 VPC
              部署共同构成一个平台。Qualcomm 表示收购已完成，但产品品牌仍在延续，因此公司的阶段和控制权叙事已发生实质变化。公开客户证据
              仍偏方向性：材料列出参考用户和生态伙伴，却未披露当前付费客户数、留存基础或收入规模。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO006
