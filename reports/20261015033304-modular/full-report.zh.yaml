  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于证据的序数定位图，展示 Modular 在可移植性 / 控制力与托管部署简易度之间所处的位置。
    data:
      xAxis:
        label: 可移植性与运营方控制力
        min: 1
        max: 5
        low: 供应商锁定 / 不透明
        high: 可移植 / 可调优
        description: Ordinal placement from assigned source claims, not benchmark scores
        scale: ordinal
      yAxis:
        label: 托管部署简易度
        min: 1
        max: 5
        low: 买方运营
        high: 交钥匙托管
        description: Ordinal placement from packaging and workflow evidence
        scale: ordinal
      points:
        - label: Modular 共享端点
          x: 4
          'y': 4
          tone: positive
          note: 兼容 OpenAI 的共享端点，加上硬件可移植性的产品叙事，让试用和迁移相对容易。
        - label: Modular 专用端点 / BYOC
          x: 5
          'y': 3
          tone: positive
          note: 借助定制内核、客户环境和调优支持，获得有来源支撑的最高控制力；但企业流程也更重。
        - label: 托管端点供应商
          x: 2
          'y': 5
          tone: neutral
          note: 第三方评测将其视为最容易的替代方案，但前提是买方不需要可移植性和深度调优。
        - label: 专有 API
          x: 1
          'y': 5
          tone: neutral
          note: 在现有证据中，这是最快的交钥匙使用路径，但运行时和硬件控制力也最低。
        - label: 自托管开源技术栈
          x: 5
          'y': 2
          tone: risk
          note: 控制力最大，但部署、调优和运营负担都留给买方。
        - label: 内部自建
          x: 5
          'y': 1
          tone: risk
          note: 定制空间最大，但在现有证据中人员配置和维护负担也最高。
    approximationNotes: 坐标是根据指定来源对控制力、可移植性和部署负担的描述综合出的 1-5 序数位置；并非经过测量的市场份额或性能数值。
