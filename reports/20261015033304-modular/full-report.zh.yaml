        title: 公开增长代理指标与单位经济性边界
        blocks:
          - type: paragraph
            body: >-
              最强的公开增长信号是具名案例，而非经审计的商业指标。Forbes 报道 OpenRouter 有实际流量，并列出 MiniMax、Hippocratic AI、Jane Street 等付费或生产客户；Beri
              还列出 Inworld、TensorWave、AWS 等。这些 logo 说明共享云、专用部署和伙伴部署都具有关联性，但没有披露席位数、合同金额、续约行为或客户
              集中度。单位经济性也一样：资料讨论性能、可移植性和支持流程，DeepWiki 指出真实服务与分布式系统复杂度，但保留来源仍未给出毛利率、每账户支持负荷、CAC、回本期或留存。
