  name: "Modular"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public customer evidence for Modular is real but still reference-based rather than portfolio-wide. The strongest proof is a small set of named users and deployment modes—Qwerky AI, MiniMax, Inworld, Hippocratic AI, TensorWave, and AWS—plus shared, dedicated, and BYOC deployment options, while retention, customer count, and concentration disclosures remain absent after the Qualcomm acquisition.
sections:
  - id: "customer-base-segmentation"
    title: "Customer base is clearest by workflow and deployment need, not by disclosed account count"
    body: >-
      The retained public evidence supports a buyer and user segmentation anchored in workload and deployment model rather than in disclosed revenue bands or customer counts. Modular’s clearest buyer appears to be the head of ML platform or AI infrastructure team that wants to serve open models across multiple hardware vendors without rewriting kernels for each accelerator stack. Company pages and third-party directories also point to adjacent segments: custom-model builders that need graph or kernel programmability, enterprises that require private deployment in their own VPC, and broader developer, hyperscaler, model-creator, and OEM ecosystems that Qualcomm says it wants to serve after the acquisition. What is still missing is payer mix by segment, contract size, or the split between self-hosted usage, Modular Cloud, and BYOC revenue.
    claimRefs: ["CU001", "CU002", "CU003", "CU008", "CU013"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "named-customer-proof"
    title: "Named deployment proof exists, but most references still lack commercial denominators"
    body: >-
      Modular has more than logo-level evidence, but the public proof is uneven. The most concrete signals are named users in independent directories, a first-party Qwerky AI case-study quote about avoiding separate accelerator-specific codebases, and MiniMax’s reported dedicated M3 deployment serving billions of tokens per minute. TensorWave is cited for cost savings on AMD, while Inworld and Hippocratic AI are presented as real-time voice and chat users. These references are directionally helpful because they show workload fit across custom models, low-latency inference, and heterogeneous hardware, but they still do not establish fleet-wide customer count, renewal rates, or production depth for every named logo.
    claimRefs: ["CU004", "CU005", "CU006", "CU007", "CU009"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion-and-concentration"
    title: "Expansion thesis is plausible, but durability and concentration remain under-disclosed"
    body: >-
      The visible land-and-expand motion is coherent: a free self-hosted or lightweight trial can lead to shared endpoints, then dedicated production or BYOC deployments, with Modular engineers helping tune performance in customer environments. That gives the business a credible expansion loop around performance tuning, private deployment, and broader hardware portability. The problem for diligence is that public materials still do not disclose customer count, NRR, GRR, churn, renewal cadence, top-account exposure, or channel concentration. Independent commentary also flags a real post-acquisition risk: if Qualcomm prioritizes its own accelerators or changes pricing, Modular’s hardware-neutral positioning could weaken precisely where enterprise buyers value it most.
    claimRefs: ["CU010", "CU011", "CU012", "CU013"]
callouts:
  - calloutType: "strength"
    title: "Proof is strongest where Modular shows deployment path plus named user"
    body: >-
      The best customer evidence combines a named organization with a specific deployment mode or outcome—Qwerky AI for custom-model portability, MiniMax for scaled dedicated deployment, and TensorWave for AMD cost savings.
    claimRefs: ["CU005", "CU006", "CU007"]
  - calloutType: "risk"
    title: "Retention and concentration are still the core missing customer metrics"
    body: >-
      Public sources support live adoption and multiple deployment surfaces, but they do not disclose the customer denominator, renewal quality, or top-customer dependence needed to judge durability.
    claimRefs: ["CU008", "CU012"]
  - calloutType: "insight"
    title: "The expansion loop depends on deployment complexity, not just seat growth"
    body: >-
      Modular’s monetization path appears to deepen as workloads move from free or shared usage into dedicated and BYOC environments where forward-deployed engineering matters.
    claimRefs: ["CU003", "CU013"]
