  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Self-hosted MAX/Mojo", "$0 self-hosted/community", "List entry point is public; realized revenue depends on later conversion.", "Paid support or upsell conversion is undisclosed.", "Beri review"]
      - ["Shared endpoints", "Examples include DeepSeek V4 at $1.74 / $3.48 and Qwen 3.5 9B at $0.17 / $0.25 per 1M tokens", "List token prices are public for selected models.", "Volume discounts, credits, and workload mix are unknown.", "Beri review"]
      - ["Dedicated endpoints", "Per GPU minute", "Commercial model is public, but broad rates are not.", "Utilization, minimum commits, and support terms are undisclosed.", "Beri review"]
      - ["BYOC / Enterprise", "Quote-only or custom engagement", "No public realized pricing.", "Implementation scope, contract duration, and post-close repricing are unknown.", "Beri review"]
    notes: This table captures public list mechanics only; it does not establish actual ASPs or margin by plan.
    claimRefs: [CI002, CI014, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue or ARR by product surface", null, "Low", "Without revenue mix, it is impossible to weight self-hosted conversion against cloud or services revenue.", "Provide run-rate revenue or ARR by shared cloud, dedicated, BYOC, and services."]
      - ["Gross margin by deployment model", null, "Low", "Cloud economics depend on hardware cost, utilization, and support intensity.", "Provide COGS and gross margin by shared, dedicated, and BYOC deployments."]
      - ["Support intensity", "Forward-deployed engineers included on cloud/BYOC plans", "Medium", "Services load can improve conversion while compressing software-like margins.", "Provide services hours or FTE load by customer cohort."]
      - ["Performance proof", "Vendor cost and throughput claims; independent validation still pending", "Medium", "Payback depends on whether cost or speed deltas survive external testing.", "Provide benchmark methodology and third-party validation on customer workloads."]
      - ["Retention and concentration", null, "Low", "Large-account concentration can dominate value even when headline logos look strong.", "Provide customer count, top-account share, renewal cadence, and NRR."]
    notes: Public evidence is strongest on product mechanics and weakest on realized unit economics; null means undisclosed in retained sources.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI015]
figures:
