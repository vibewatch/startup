        - id: entry
          label: Free self-hosted entry
          value: "$0"
          unit: "community/open-source"
          note: "Beri says self-hosting MAX and Mojo is free."
        - id: shared
          label: Shared cloud usage
          value: "$ / 1M tokens"
          note: "Selected Modular Cloud endpoints publish token prices."
        - id: dedicated
          label: Dedicated production deployment
          value: "$ / GPU minute"
          note: "Dedicated endpoints are billed per GPU minute."
        - id: byoc
          label: BYOC deployment
          value: "Quote / reserved GPU capacity"
          note: "Runs in the customer's VPC with custom terms."
        - id: services
          label: Services and tuning
          value: "Forward-deployed engineers"
          note: "Support work is part of the offer on some plans."
        - id: margin
          label: Gross profit outcome
          value: "Undisclosed"
          note: "Depends on hardware mix, utilization, and support load."
      edges:
        - from: entry
          to: shared
          label: conversion to managed usage
        - from: shared
          to: dedicated
          label: higher-volume production
        - from: dedicated
          to: byoc
          label: data-residency or control needs
        - from: byoc
          to: services
          label: deployment and optimization support
        - from: services
          to: margin
          label: realized economics depend on execution
    approximationNotes: The bridge is directional and based on public plan mechanics, not disclosed conversion rates or gross-margin math.
    claimRefs: [CI001, CI002, CI008, CI011, CI015]
