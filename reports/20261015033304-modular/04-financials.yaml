  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: realized-pricing
      missingEvidence: Actual contracted ASPs, discounts, usage mix, and conversion rates across shared, dedicated, BYOC, and services plans.
      whyItMatters: List pricing alone cannot establish revenue quality, monetization mix, or whether quoted commercial complexity is translating into durable net revenue.
      diligencePath: Request customer-level or cohort-level bookings, usage, and realized pricing by deployment model, including discount schedules and renewal terms.
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Gross margin, infrastructure COGS, support cost, and utilization by shared cloud, dedicated, and BYOC deployments.
      whyItMatters: Margin path is the core financial debate for an infrastructure platform whose value proposition depends on efficiency and support-heavy execution.
      diligencePath: Obtain product-line P&Ls or at least gross-margin bridges by deployment mode, plus utilization and support-assumption sensitivity tables.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer count, concentration by account or partner, renewal cadence, expansion behavior, and NRR.
      whyItMatters: A handful of impressive logos can mask concentration risk or weak repeatability if the install base is narrow or highly bespoke.
      diligencePath: Request customer cohort tables, top-10 revenue concentration, renewal histories, and logo-to-revenue mapping.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: post-close-capital-allocation
      missingEvidence: Modular-only cash or burn disclosures, parent-funded investment budgets, integration milestones, and any post-close product profitability targets.
      whyItMatters: The acquisition reduces external fundraising pressure but replaces it with internal capital-allocation risk that can materially shape growth and neutrality.
      diligencePath: Request Qualcomm integration plans, budgeted opex and capex for the product line, and management targets for investment cadence and return thresholds.
      relatedQuestionRefs: [QI006, QI007]
