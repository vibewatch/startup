      - ["Shared Modular Cloud", "Managed shared inference endpoints", "Per 1M input/output tokens", "Selected model token prices are publicly listed.", "List pricing only; no realized yield.", "Token volume, blended take rate, and gross margin."]
      - ["Dedicated endpoints", "Hosted production deployments", "Per GPU minute", "Billing basis is public but broad rate cards are not.", "Mechanics visible, contracted economics hidden.", "Reserved capacity, utilization, and minimum commits."]
      - ["BYOC", "Runs in customer VPC with Modular support", "Reserved GPU capacity / quote", "Commercial motion is public, price card is not.", "Weak for underwriting realized pricing.", "Standard contract terms, support scope, and deployment costs."]
      - ["Enterprise/services", "Custom engagement plus engineering support", "Quote-based services/support", "Forward-deployed engineers are explicitly part of the offer.", "Support-heavy revenue can dilute software margins.", "Services attach rate, delivery margin, and renewal behavior."]
    notes: Public sources describe monetization mechanics; realized pricing, discounting, and revenue mix are not disclosed.
