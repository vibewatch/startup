callouts:
  - calloutType: "risk"
    title: "Primary thesis-break risk"
    body: "If Modular stops looking like a neutral portability layer and starts looking like a Qualcomm-only route-to-market, the acquisition can destroy the very reason Qualcomm paid a premium for it."
    claimRefs: [CR004, CR011, CR014]
  - calloutType: "recommendation"
    title: "Minimum diligence gates before underwriting upside"
    body: "Require third-party production benchmarks, standard enterprise pricing/support terms, and evidence that multi-vendor hardware support remains intact after the close; without those, the public story is still ahead of the public proof."
    claimRefs: [CR005, CR006, CR012]
