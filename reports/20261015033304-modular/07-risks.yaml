chapter:
  number: 7
  title: "Risks"
  summary: "The cleanest current read is that transaction-close risk has already rolled into post-close execution risk: Qualcomm completed the acquisition, but the highest residual exposure is whether Modular can stay hardware-neutral and prove production-scale performance under its new owner. Public evidence also leaves commercial, compliance, and concentration disclosure thin, so the risk posture is investable only with explicit diligence gates rather than trust in strategic narrative alone."
sections:
  - id: "ranked-risk-posture"
    title: "Highest residual risk sits in neutrality and proof, not in transaction close"
    body: "The acquisition itself is no longer the primary public risk because Qualcomm said the deal closed on July 29, 2026 and that Mojo, MAX, and Modular Cloud will continue as products and brands. The harder residual question is whether those products can remain credible as a hardware-neutral layer after becoming part of one silicon vendor. Independent coverage is unusually consistent on that point: Qualcomm bought Modular to loosen CUDA lock-in, but that strategy only works if developers still treat the stack as a portable layer rather than a proprietary sales extension. Public sources also continue to leave production-scale proof thin, with independent reporting explicitly noting that the large-scale performance case remains unproven outside Modular's own benchmarks."
    claimRefs: [CR002, CR003, CR004, CR005, CR011, CR014]
    figureRefs: [FR001]
  - id: "legal-governance-and-disclosure"
    title: "Legal and governance risk is mostly a disclosure and commitment problem"
    body: "The assigned pool does not show an active public lawsuit, enforcement action, or blocked approval, but that is not the same thing as a clean bill of health. Instead, the legal and governance issue is narrower and more practical: Qualcomm's public mitigation is an open-ecosystem commitment, yet the retained documents do not disclose contractual neutrality protections, enterprise service commitments, pricing safeguards, or concentration metrics that would let outside investors test whether that commitment survives commercialization pressure. That makes regulatory and legal diligence less about reacting to a known case and more about verifying what procurement, privacy, export-control, open-source, and partner-governance materials actually exist beyond the press narrative."
    claimRefs: [CR001, CR002, CR011, CR012, CR013]
    tableRefs: [TR001]
  - id: "operational-and-technical-execution"
    title: "Operational execution still hinges on proof outside vendor-controlled benchmarks"
    body: "Independent evidence keeps pointing back to the same operational bottleneck: Modular's technical story is compelling, but public proof that it can sustain latency, throughput, and developer adoption at meaningful production scale is limited. Eastern Herald explicitly says the real-world performance case has not been demonstrated outside Modular's own benchmarks, while Beri's review adds procurement and support friction by describing quote-only enterprise terms and a services-heavy BYOC model that uses forward-deployed engineers. Founders Magazine adds a second-order risk that portability itself can hide vendor-specific accelerations, meaning the software may need to preserve deep optimization hooks or it risks disappointing exactly the sophisticated buyers it wants to win."
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: "dependency-and-kill-criteria"
    title: "Dependency risk is really a commercialization test against entrenched CUDA behavior"
    body: "Modular does not merely need good tooling; it needs to overcome entrenched developer and buyer behavior that still defaults to Nvidia and CUDA as the lowest-risk operating choice. That makes partner and ecosystem dependency the core commercialization risk. If Qualcomm prioritizes its own accelerators too aggressively, if third-party hardware support degrades, or if pricing and support terms tighten after the integration, Modular's portability value proposition weakens before public revenue durability is visible. The practical kill criteria are therefore monitorable: loss of third-party hardware support, evidence of closed or less portable roadmaps, persistent quote-only enterprise contracting without standard service commitments, or failure to produce third-party production metrics and customer references that show the stack winning live inference share."
    claimRefs: [CR004, CR006, CR008, CR010, CR012, CR014]
    tableRefs: [TR003]
