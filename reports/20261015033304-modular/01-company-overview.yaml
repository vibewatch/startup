      - ["US Innovative Technology fund", "Lead investor in Sep 2025 Series C", "Set the headline financing signal on the last private round", "Request ownership %, board rights, and liquidation preferences from the Series C documents"]
      - ["DFJ Growth", "New investor in Sep 2025 Series C", "Adds outside validation to the round and may influence governance", "Request check size, pro rata rights, and any information rights"]
      - ["GV", "Existing investor participating in the round", "Signals continued support from a prior backer and possible ecosystem leverage", "Confirm historical entry price, ownership, and follow-on reserve capacity"]
      - ["General Catalyst", "Existing investor participating in the round", "Represents another carry-forward institutional backer in the cap table", "Request ownership, board observer rights, and any structured terms"]
      - ["Greylock Ventures", "Existing investor participating in the round", "Rounds out the named core venture syndicate behind the 2025 raise", "Confirm ownership dilution through the Qualcomm exit and any side letters"]
      - ["Qualcomm", "Acquirer and current owner", "Now controls capital allocation, product priorities, and the route to broad distribution", "Request post-close operating plan, retention packages, and product independence guardrails"]
    notes: >-
      Publicly named stakeholders cover the disclosed 2025 financing syndicate plus
      the current owner; this is not a full cap table and does not reveal economics
      such as preferences, rollover, or employee option outcomes.
    enumerationScope:
      coverage: partial
      basis: Rows cover the publicly named financing counterparties from the Sep 2025 raise plus the post-close owner, not a complete cap table.
    claimRefs: [CO006, CO007, CO009, CO010, CO014]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Public evidence supports a fast chronology from 2022 founding to 2026 acquisition and post-close product milestones, but not commercialization metrics.
    data:
      items:
        - date: "2022"
          label: Company founded
          detail: Third-party profile and the 2025 funding post place Modular's founding in 2022 and attribute the company to Chris Lattner and Tim Davis.
          tone: positive
          claimRefs: [CO003]
        - date: "2023"
          label: Platform launch
          detail: Modular says it launched the platform in 2023, starting the current kernels-to-cloud product arc.
          tone: positive
          claimRefs: [CO005]
        - date: "2025-09-24"
          label: Series C announced
          detail: Modular announces a $250M third financing round led by USIT, with DFJ Growth and existing investors participating.
          tone: positive
          claimRefs: [CO006]
        - date: "2025-09-24"
          label: Valuation reaches $1.6B
          detail: The same financing post says total capital reached $380M and valuation reached $1.6B.
          tone: positive
          claimRefs: [CO007]
        - date: "2026-06-24"
          label: Qualcomm signs acquisition
          detail: Qualcomm and Modular say the transaction would deepen Qualcomm's edge-to-cloud AI software foundation.
          tone: neutral
          claimRefs: [CO008]
        - date: "2026-07-29"
          label: Acquisition closes
          detail: Qualcomm says the deal completed and Chris Lattner moved into an EVP role while core Modular products continue.
          tone: neutral
          claimRefs: [CO009]
        - date: "2026-08-11"
          label: Mojo 1.0 ships
          detail: A third-party October 2026 profile dates Mojo 1.0 to the Modular 26.5 release.
          tone: positive
          claimRefs: [CO015]
        - date: "2026-08-18"
          label: Compiler open-sourced
          detail: The same profile says the compiler was open-sourced under Apache 2.0 with LLVM exceptions on Aug. 18, 2026.
          tone: positive
          claimRefs: [CO016]
    claimRefs: [CO003, CO005, CO006, CO007, CO008, CO009, CO015, CO016]
