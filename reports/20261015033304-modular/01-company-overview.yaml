      - ["Tim Davis", "Co-founder", "Named in third-party company profile alongside Lattner as an original founder", "Provides evidence that Modular was not a single-founder story, but public role detail remains sparse", "Medium - founder importance is evident, but the current operational remit is not publicly documented"]
      - ["Cristiano Amon", "Qualcomm President and CEO; post-close executive sponsor", "Runs the parent company that now controls Modular's capital allocation and roadmap context", "His platform strategy determines how aggressively Qualcomm funds a cross-hardware software layer", "High at parent level - Modular's autonomy now depends on Qualcomm priorities"]
    notes: >-
      Partial public leadership cut: assigned sources clearly identify founders and the
      post-close parent sponsor, but not a full executive bench, board roster, or
      reporting structure below the EVP layer.
    enumerationScope:
      coverage: partial
      basis: Public sources in the assigned pool name founders and the post-close acquirer sponsor, not the full executive team or board.
    claimRefs: [CO003, CO004, CO012, CO014]
  - id: TO003
    title: Stakeholder or investor map
    columns:
