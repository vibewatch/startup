schemaVersion: report-v2
artifact: company-overview
slug: modular
runDate: 2026-10-15
company:
  name: Modular
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Modular's refresh story is no longer a standalone Series C infrastructure startup
    but a Qualcomm-owned AI software platform whose public identity still centers on
    hardware-portable inference, MAX, Mojo, and cloud/VPC deployment. The strongest
    verified public facts are the September 2025 $250 million round at a $1.6
    billion valuation and the July 2026 acquisition close that moved Chris Lattner
    into an EVP role while keeping Mojo, MAX, and Modular Cloud live. What remains
    thin is just as important: no assigned source discloses revenue, customer count,
    margin, board structure, or detailed transaction terms, so scale and realized
    economics still need diligence.
sections:
  - id: current-positioning
    title: Company identity and current stage
    body: >-
      Modular now presents as a Qualcomm-backed AI software platform rather than a
      still-independent venture stage company. The assigned official surfaces are
      consistent on the product thesis: a unified stack that lets developers deploy
      inference workloads across heterogeneous hardware, with MAX, Mojo, and hosted
      or VPC deployment options positioned as one integrated platform. The refresh
      changes the stage and control story materially because Qualcomm says the
      acquisition is complete, yet the product brands continue. Public customer proof
      remains directional rather than fully quantified: the evidence names reference
      users and ecosystem partners, but it does not disclose a current paying-customer
      count, retention base, or revenue scale.
    claimRefs: [CO001, CO002, CO009, CO010, CO011]
    tableRefs: [TO001]
  - id: leadership-control
    title: Founders, leadership, and control transition
    body: >-
      Founder-market fit remains one of Modular's clearest strengths. Chris Lattner's
      compiler pedigree is repeatedly used to explain why the company pursued
      hardware-portable AI infrastructure, and third-party coverage still names Tim
      Davis alongside him as a co-founder. The key 2026 leadership change is that
      Lattner moved from Modular CEO to Qualcomm EVP after the close, which should
      help product continuity but also concentrates roadmap credibility in one person.
      Public governance disclosure is otherwise thin in the assigned pool: there is
      no authoritative board list, no post-close org chart below Lattner, and no
      official headquarters or exact headcount disclosure.
    claimRefs: [CO003, CO004, CO012, CO014]
    tableRefs: [TO002]
  - id: capital-stakeholders
    title: Funding history, valuation, and stakeholder map
    body: >-
      The cleanest public financing fact pattern is still the September 2025 Series C.
      Modular's own announcement says the company raised $250 million, reached $380
      million total funding, and was valued at $1.6 billion, with USIT leading and
      DFJ Growth plus existing investors participating. That is enough to anchor a
      pre-exit private-market reference point, but not enough to underwrite realized
      value creation from the Qualcomm outcome because the assigned sources do not
      disclose acquisition consideration mix, rollover treatment, liquidation
      preferences, or any revenue and margin evidence that would contextualize the
      private mark. Independent commentary also keeps pointing investors back to
      benchmark proof rather than to disclosed commercial results.
    claimRefs: [CO006, CO007, CO010, CO011, CO013]
    tableRefs: [TO003]
  - id: milestones-and-implications
    title: Milestones and diligence implications
    body: >-
      The milestone record is good enough to establish chronology even if it leaves
      commercialization gaps unresolved. The sources place founding in 2022, platform
      launch in 2023, a major financing reset in September 2025, acquisition signing
      in June 2026, close in July 2026, and product-level milestones around Mojo in
      August 2026. That sequence supports a credible narrative of fast technical
      execution and strategic relevance. It also sharpens the remaining diligence ask:
      after the Qualcomm sale, investors now need proof that Modular's neutrality,
      customer traction, and benchmark edge survive inside a parent whose own silicon
      priorities could influence optimization choices.
    claimRefs: [CO005, CO008, CO009, CO014, CO015, CO016]
    figureRefs: [FO001]
