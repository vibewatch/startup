  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-opacity
      missingEvidence: Current post-money valuation, security terms, liquidation preferences, option pool, and any investor rights from the latest financing.
      whyItMatters: Without round terms, the chapter cannot test whether new money bought attractive economics or simply preserved headline momentum.
      diligencePath: Request the latest financing documents, board materials, and cap-table summary from management or lead investors.
      relatedQuestionRefs: [QV002]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Verified 2025/2026 revenue, gross margin, burn, cash runway, and commercial throughput for the Brazil and Weirton programs.
      whyItMatters: Scenario valuation cannot move from milestone logic to price logic without seeing the underlying economic engine and cash needs.
      diligencePath: Obtain current budget-to-actuals, plant throughput dashboards, customer purchase orders, and board KPI packs.
      relatedQuestionRefs: [QV006, QV008]
      relatedTableRefs: [TV003]
    - type: stale
      severity: material
      topic: commercialization-timeline
      missingEvidence: Updated milestones for Brazil restart performance, customer qualification, steel-reactor durability, and first licensing or offtake timing after the 2025 milestone run.
      whyItMatters: The speed of commercialization determines whether Boston Metal deserves premium optionality or should be treated as a longer-duration technology bet.
      diligencePath: Ask management for the refreshed commercialization roadmap, milestone slippage history, and customer diligence references.
      relatedQuestionRefs: [QV004, QV005, QV008]
      relatedTableRefs: [TV002, TV003]
