company:
  name: Boston Metal
chapter:
  number: 7
  title: Risks
  summary: >-
    Boston Metal's highest underwriteable risks are not abstract technology risk but concentrated
    execution risk: a January 2026 industrial accident in Brazil broke a financing milestone,
    triggered layoffs and a Woburn shutdown, and pushed the company harder toward a still-unproven
    critical-metals restart. The 2025 steel-cell milestone de-risks core electrochemistry, but the
    public evidence still stops short of bankable uptime, cost, permitting, partner, and customer
    proof for commercial steel deployment.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The risk stack is led by one concentrated chain: Boston Metal's Brazil operating base suffered
      an industrial accident in January 2026, the resulting critical equipment failure caused the
      company to miss a financing milestone, and management then cut 71 jobs while closing Woburn
      pilot, office, and warehouse sites. That sequence turns technical reliability, plant restart,
      and capital access into one combined risk rather than separable issues. The March 2025
      multi-anode steel run matters because it shows the science is not stuck in the lab, but both
      independent and company-issued materials still describe steel as a scale-up and economics
      problem rather than a finished commercial product.
    claimRefs: [CR001, CR005, CR006, CR007, CR010, CR011]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory, safety, and legal exposure
    body: >-
      The public file does not show a live litigation or enforcement event, but that is not the same
      as a cleared legal or regulatory posture. The accessible evidence confirms Boston Metal now has
      meaningful industrial surfaces in Brazil, Woburn, and a DOE-linked West Virginia project path,
      so any restart or scale-up depends on permits, environmental controls, safety systems, and
      industrial insurance that are not disclosed in the assigned pool. The Brazil accident therefore
      matters as both an operational and compliance diligence issue: underwriting should require the
      root-cause report, corrective actions, and regulator-facing restart package before treating the
      2025 steel milestone as a de-risked bridge to commercialization.
    claimRefs: [CR001, CR005, CR010, CR012]
    tableRefs: [TR001]
  - id: operational-and-financial
    title: Operational and financial model risk
    body: >-
      Independent reporting and the company's own materials point to a business that has made real
      technical progress but still lacks public proof of industrial cadence and unit economics.
      Technology Review reported that larger runs were still needed to understand cost, while an
      independent 2026 assessment argued that green iron remains a separate proof burden from
      critical-metals recovery. That makes Boston Metal's model unusually sensitive to uptime, power
      cost, refractory and anode life, and working-capital discipline. The January 2026 financing
      miss demonstrates that this sensitivity is already commercial rather than theoretical: one
      plant failure was enough to interrupt committed capital and force a burn-rate reset.
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: partner-and-thesis-break
    title: Partner dependency, mitigation maturity, and thesis-break triggers
    body: >-
      Boston Metal's near-term mitigation is credible but incomplete. The company has raised large
      rounds, attracted strategic investors, and can point to a real 2025 steel-cell run, which
      reduces pure-science risk. But the dependency chain remains long: Brazil must restart cleanly,
      high-value-metal output still has to qualify with paying customers, future steel deployment
      still relies on unnamed licensees or adopters, and the public file does not disclose the
      financing terms or covenant structure that would show how much room management has for another
      slip. The thesis should break if Brazil cannot restore operations on schedule, if new capital
      arrives only with punitive terms, or if steel commercialization stays at milestone language
      without named counterparties and cost evidence.
    claimRefs: [CR003, CR004, CR006, CR007, CR008, CR009, CR013]
    tableRefs: [TR003]
