  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: brazil-incident-root-cause
      missingEvidence: Independent root-cause analysis, repair scope, and restart validation for the Jan. 2026 Brazil incident.
      whyItMatters: Without a verified restart package, investors cannot tell whether the accident was a one-off event or a recurring scale-up risk.
      diligencePath: Request the incident report, insurer correspondence, regulator notices, and first-post-restart operating data.
      relatedQuestionRefs: [QR003, QR006]
      relatedTableRefs: [TR001, TR002]
    - type: missing-source
      severity: material
      topic: permits-and-compliance
      missingEvidence: Plant permits, environmental conditions, safety audits, and any litigation or enforcement record for Brazil, Woburn, and West Virginia activities.
      whyItMatters: Legal and regulatory status can delay restart, expansion, and future project finance even if the core technology works.
      diligencePath: Pull regulator and court records in each jurisdiction and compare them with management's permit matrix and HSE controls.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financing-terms-and-customers
      missingEvidence: Updated runway, financing covenants, valuation, named offtake or qualification counterparties, and customer revenue evidence for the Brazil critical-metals plan.
      whyItMatters: The current thesis depends on partner and capital availability, but public sources do not show the contractual proof that would bound dilution and go-to-market risk.
      diligencePath: Review the financing deck, cap table, bank statements, customer pipeline, and signed commercial agreements under NDA.
      relatedQuestionRefs: [QR004, QR007]
      relatedTableRefs: [TR003]
