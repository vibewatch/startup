  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and commercialization path
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's product is not a standalone component; it is an electro-metallurgy platform sold through
              two customer workflows. For mining and alloy customers, the nearer-term offer is critical-metals
              production from low-grade waste streams, with Brazil positioned as the first commercial bridge. For
              steelmakers, the company is pitching MOE as a future process replacement that can turn iron ore into
              molten iron and then be licensed into customer mills rather than operated as Boston Metal-owned steel
              capacity. That sequencing matters because the public record repeatedly shows critical metals as the bridge
              product intended to fund learning and de-risk the harder steel scale-up.
