  - id: FE001
    title: Product architecture map
    type: stack
    summary: MOE is one reactor platform expressed through multiple feedstocks, assets, and delivery routes.
    data:
      layers:
        - label: Feedstocks
          items:
            - Medium- and low-grade iron ores
            - Mining waste and industrial slag
          outputs:
            - Input flexibility across steel and critical-metals use cases
        - label: Electrochemistry core
          modules:
            - Molten oxide electrolysis reactor at about 1,600 C
            - Power delivery into the molten bath
            - Oxygen off-gas instead of carbon-emitting furnace chemistry
          outputs:
            - Molten iron or target metal stream
        - label: Durability and control layer
          modules:
            - Inert anodes that conduct current without consumable-carbon chemistry
            - Refractory and thermal management
            - Process controls and tapping operations
          outputs:
            - Stable cell operation at industrial scale
        - label: Industrial assets
          items:
            - Woburn industrial steel cell
            - Brazil critical-metals plant
            - Planned Weirton chromium facility
          outputs:
            - Pilot steel proof, critical-metals production, and domestic alloy manufacturing
        - label: Output streams
          items:
            - Molten iron / steel pathway
            - Niobium and chromium-adjacent critical-metals pathway
          outputs:
            - Two product lines from one reactor family
        - label: Commercial delivery
          items:
            - Critical-metals sales
            - Future steel-process licensing
          outputs:
            - Revenue bridge before full steel-scale deployment
    approximationNotes: null
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Boston Metal's public customer path moves from tailored alloy/customer work and first commercial critical-metals
      output toward later steel licensing.
    data:
      items:
        - label: Tailor MOE to customer feedstocks
          actor: Boston Metal and unnamed industrial customers
          phase: Pre-commercial application fit
          touchpoints:
            - >-
              2021 release says Boston Metal 'works closely with customers to tailor the MOE technology for specific
              alloys, feedstocks, and business needs.'
            - No customer names or qualification counts are disclosed.
        - label: Funded proof for industrial steel and ferroalloys
          actor: Investors and development partners
          phase: Commercial readiness build
          touchpoints:
            - >-
              Mintz says the Series A would allow Boston Metal to 'commission an industrial steel production system' and
              'develop a demonstration plant to produce ferrovanadium.'
            - This is commercialization preparation rather than customer revenue proof.
        - label: Brazil critical-metals plant
          actor: Boston Metal do Brasil and steelmaking-input buyers
          phase: First commercial-scale plant
          touchpoints:
            - Canary reports the plant will sell extracted metals to steelmakers as additives.
            - Public evidence still omits buyer names and booked volumes.
        - label: Woburn steel-cell milestone
          actor: Future steel customers and licensees
          phase: Technology qualification
          touchpoints:
            - Official and MIT Technology Review sources show tonnage steel output from the multi-anode reactor.
            - This improves customer credibility but does not show paid production deployment.
        - label: Larger demo plant
          actor: Prospective steelmaking hosts
          phase: Scale-up bridge
          touchpoints:
            - >-
              MIT Technology Review says the next demonstration plant should come online in late 2026 and begin
              operation in 2027.
            - Economics and host-customer identity remain undisclosed.
        - label: Long-term steel licensing
          actor: Steelmakers
          phase: Expansion loop
          touchpoints:
            - MIT Technology Review says Boston Metal ultimately hopes to license its technology to steelmakers.
            - No public licensee, renewal, or concentration data is yet available.
