            body: >-
              The strongest public proof of adoption is technical and operational rather than commercial-density
              metrics. Boston Metal's March 2025 announcement says its multi-inert anode steel cell is operating in
              Woburn and de-risks commercial production, while MIT Technology Review reports that the company produced
              over a ton of steel from that system after several weeks of operation. Independent reporting also shows
              the company prioritizing the Brazil critical-metals plant as the first commercial-scale deployment, with a
              10,000-metric-ton niobium target at full 2026 operations. These are meaningful readiness signals, but they
              are not the same as disclosed customer counts, contract wins, repeat purchase rates, or production volumes
              sold into market.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration remain the main diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Customer durability is still largely untestable from public materials. Across the assigned official and
              independent sources, Boston Metal does not disclose customer count, renewal rates, churn, average contract
              length, or top-customer share. Named market proof is also thinner than the operating story: the press
              archive signals an Outokumpu collaboration, but the assigned pool does not include the linked release or
              any public volume, pricing, or deployment outcome. That leaves the investment case dependent on conversion
              from partner/investor validation and plant milestones into repeat commercial demand. Until Boston Metal
              discloses reference customers or booked volumes, concentration risk is better framed as an unresolved
              diligence item than as a solved go-to-market question.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Near-term customer logic is clearer in critical metals than in steel
            body: >-
              The public go-to-market story is strongest where Boston Metal can sell higher-value metals into existing
              steel and advanced-materials chains before asking customers to adopt full green-steel systems.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU012
          - type: callout
            title: Customer proof is still mostly indirect
            body: >-
              Boston Metal has better operating proof than customer disclosure: public sources show technical milestones
              and project buildouts, but not named production customers, retention metrics, or concentration detail.
            calloutType: risk
            claimRefs:
              - CU007
              - CU009
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The risk stack is led by one concentrated chain: Boston Metal's Brazil operating base suffered an
              industrial accident in January 2026, the resulting critical equipment failure caused the company to miss a
              financing milestone, and management then cut 71 jobs while closing Woburn pilot, office, and warehouse
              sites. That sequence turns technical reliability, plant restart, and capital access into one combined risk
              rather than separable issues. The March 2025 multi-anode steel run matters because it shows the science is
              not stuck in the lab, but both independent and company-issued materials still describe steel as a scale-up
              and economics problem rather than a finished commercial product.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Regulatory, safety, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The public file does not show a live litigation or enforcement event, but that is not the same as a
              cleared legal or regulatory posture. The accessible evidence confirms Boston Metal now has meaningful
              industrial surfaces in Brazil, Woburn, and a DOE-linked West Virginia project path, so any restart or
              scale-up depends on permits, environmental controls, safety systems, and industrial insurance that are not
              disclosed in the assigned pool. The Brazil accident therefore matters as both an operational and
              compliance diligence issue: underwriting should require the root-cause report, corrective actions, and
              regulator-facing restart package before treating the 2025 steel milestone as a de-risked bridge to
              commercialization.
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
              - CR013
      - number: '7.3'
        title: Operational and financial model risk
        blocks:
          - type: paragraph
            body: >-
              Independent reporting and the company's own materials point to a business that has made real technical
              progress but still lacks public proof of industrial cadence and unit economics. Technology Review reported
              that larger runs were still needed to understand cost, while an independent 2026 assessment argued that
              green iron remains a separate proof burden from critical-metals recovery. That makes Boston Metal's model
              unusually sensitive to uptime, power cost, refractory and anode life, and working-capital discipline. The
              January 2026 financing miss demonstrates that this sensitivity is already commercial rather than
              theoretical: one plant failure was enough to interrupt committed capital and force a burn-rate reset.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
      - number: '7.4'
        title: Partner dependency, mitigation maturity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's near-term mitigation is credible but incomplete. The company has raised large rounds,
              attracted strategic investors, and can point to a real 2025 steel-cell run, which reduces pure-science
              risk. But the dependency chain remains long: Brazil must restart cleanly, high-value-metal output still
              has to qualify with paying customers, future steel deployment still relies on unnamed licensees or
              adopters, and the public file does not disclose the financing terms or covenant structure that would show
              how much room management has for another slip. The thesis should break if Brazil cannot restore operations
              on schedule, if new capital arrives only with punitive terms, or if steel commercialization stays at
              milestone language without named counterparties and cost evidence.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
