      - number: '4.4'
        title: 'Verdict: compelling platform logic, but insufficient disclosure for underwriting'
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's public materials support the strategic logic of starting with higher-value critical metals,
              using grants and strategic investors to fund first-of-a-kind plants, and keeping steel licensing as a
              later upside case. What they do not support is a full underwriting view of revenue quality, margin path,
              or capital adequacy. The company has not publicly disclosed realized 2025 or 2026 revenue, gross profit,
              plant-level uptime, working-capital needs, customer contract structure, or post-restart runway. MIT
              Technology Review's reporting that current steel equipment produces a ton or two per month and that the
              next demo targets ton-per-day output reinforces how much scale-up work still sits between technical
              success and commercial licensing. Until Boston Metal can show stable output from Brazil and more concrete
              plant economics, the financial case remains promising but incomplete.
