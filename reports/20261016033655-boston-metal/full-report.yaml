      - number: '5.2'
        title: Operating architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              Technically, the architecture is a high-temperature electrolysis stack rather than a generic climate-tech
              brand story. Inputs are metal oxides or waste-derived feedstocks; current passes through an inert anode
              into a molten bath at roughly 1,600 C; oxygen is released and liquid metal is tapped out. Boston Metal's
              strongest disclosed differentiator is the inert-anode system, which both company and independent reporting
              describe as the key to running large cells without consumable-carbon chemistry. The 2025 Woburn milestone,
              tonnage steel from a multi-anode industrial cell, matters because it tests the transition from
              single-anode laboratory reactors to larger, more plant-like configurations. The same core architecture
              also underpins chromium and niobium pathways, widening feedstock and end-market optionality.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
