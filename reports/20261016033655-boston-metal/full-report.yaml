        title: Public traction exists as milestones and market proxies, not as disclosed unit economics
        blocks:
          - type: paragraph
            body: >-
              Public traction is mostly developmental rather than financial. Boston Metal said in January 2024 that its
              high-value metals business could start generating revenue as early as 2024, and independent reporting
              later described a 10,000-metric-ton niobium plant in Brazil and a steel reactor that had produced roughly
              one ton of material. Those datapoints help establish operating ambition and scale targets, but they do not
              answer the core underwriting questions. None of the retained public sources disclose realized pricing,
              customer concentration, revenue mix, CAC or payback, gross margin, or burn. The best public proxy for the
              business logic is the spread between higher-value alloying metals and crude steel, which explains the
