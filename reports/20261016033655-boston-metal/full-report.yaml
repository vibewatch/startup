  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: decarbonized steel plus a critical-metals wedge'
        blocks:
          - type: paragraph
            body: |-
              The retained sources define Boston Metal's market boundary more narrowly than a generic
              "climate tech" narrative. Independent and company-issued evidence both describe Molten
              Oxide Electrolysis as an electro-metallurgical process aimed first at decarbonized primary
              steelmaking and, in parallel, at recovering higher-value metals from oxide feedstocks and
              waste streams. That distinction matters because the company is not selling generic carbon
              avoidance; it is trying to win budgets inside steelmaking, alloy inputs, and metallurgical
              recovery workflows that currently rely on blast furnaces, conventional ferroalloy routes,
              or leaving low-grade materials unmonetized.

              The same evidence also explains why the initial commercialization path is narrower than the
              headline steel opportunity. Independent reporting says the company is currently prioritizing
              metals such as niobium, tantalum, nickel, and chromium because they carry materially higher
              value per unit than bulk steel and can therefore support earlier revenue and proof-of-market.
              Company statements reinforce that sequencing by tying 2024 funding to Asian steel exposure,
              commercialization, and high-value-metals revenue rather than to immediate mass-market steel
              deployment. For valuation work, the right boundary is therefore a long-duration steel
              decarbonization platform with a nearer-term critical-metals wedge, not a single undifferentiated
              TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
