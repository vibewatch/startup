      - number: '3.3'
        title: The moat case depends on timing, feedstock flexibility, and cost path
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's best moat argument is that MOE attacks primary steelmaking with a route that can use a
              wider ore set and skip several incumbent process steps. The harder counterpoint is economic: Canary's
              reporting shows why management is commercializing higher-value metals first, because commodity steel
              pricing gives startups less room for error than specialty metals do. In practice, that means Boston
              Metal's near-term competition is as much about whether it can climb the learning curve faster than
              hydrogen or retrofit pathways as it is about whether the chemistry works in a lab. Public sources
              therefore support a watchful, not settled, view of moat durability.
