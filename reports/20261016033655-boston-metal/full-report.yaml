  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Track follows from real technical and capital progress offset by missing price discovery and still-unproven steel
      economics.
    data:
      nodes:
        - label: Capital support
          value: >-
            $75M raised in May 2026; cumulative funding above $500M; DOE-linked Weirton project adds non-dilutive
            support.
          note: Financing depth is strong, but price terms remain undisclosed.
          claimRefs:
            - CV001
            - CV010
        - label: Technical proof
          value: 2025 multi-anode steel run produced more than a ton of metal.
          note: Technical scale-up is progressing beyond laboratory proof.
          claimRefs:
            - CV007
        - label: Commercial path
          value: Critical metals are the earlier monetization path; steel remains the larger but later opportunity.
          note: Near-term commercialization is not yet the same as steel-scale revenue proof.
          claimRefs:
            - CV005
            - CV006
            - CV009
        - label: Economics risk
          value: Cost discovery and equipment durability are still being worked through at larger scale.
          note: Independent reporting still frames steel economics as unresolved.
          claimRefs:
            - CV011
            - CV014
        - label: Price visibility
          value: No retained source discloses current valuation, cap table, or preference stack.
          note: Public evidence cannot anchor entry discipline.
          claimRefs:
            - CV013
        - label: Recommendation
          value: Track / valuation unknown / risk high.
          note: Wait for commercial metrics or clearer terms before underwriting.
          claimRefs:
            - CV015
    approximationNotes: Sequence indicates underwriting logic only; it is not a weighted score or a probabilistic model.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
