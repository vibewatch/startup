    sections:
      - number: '6.1'
        title: Staged customer base and monetization path
        blocks:
          - type: paragraph
            body: >-
              The assigned sources show Boston Metal serving two different buyer paths rather than one fully mature
              customer base. The near-term path is selling high-value metals into existing industrial supply chains: the
              2021 and 2024 company releases describe deployment with customers beginning in ferroalloys and high-value
              metals, while Canary reports the Brazil facility will sell extracted metals to steelmakers as additives.
              The longer-term path is green-steel commercialization, where the company is still moving from
              proof-of-process toward a licensing model for steelmakers rather than reporting current production
              contracts. Geography matters: management tied the 2024 round to Asia expansion, explicitly because the
              region represents more than 70% of global steel production, and the West Virginia chromium project
