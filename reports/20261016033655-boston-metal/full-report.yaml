      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Retained sources support Boston Metal as a commercialization-stage platform company rather than a
              conventional steel producer. Company pages consistently describe Molten Oxide Electrolysis as one platform
              spanning steel decarbonization and high-value or critical-metals recovery, while the steel-specific
              product page makes clear that Boston Metal intends to license MOE Steel and sell inert anodes instead of
              producing steel itself. Independent reporting ties the company back to MIT-origin research but conflicts
              on whether Boston Metal was founded in 2012 or 2013; this chapter preserves that discrepancy rather than
              selecting a year. Company-issued financing materials anchor the current footprint in Woburn, Massachusetts
              with a wholly owned Brazilian subsidiary. That is enough to ground later chapters on technology, market,
              and operations, but not enough to support broader claims about undisclosed customer count, current revenue
              scale, or valuation.
