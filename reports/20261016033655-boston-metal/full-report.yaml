    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model pivots from steel ambition to critical-metals monetization
        blocks:
          - type: paragraph
            body: >-
              The retained sources show Boston Metal sequencing commercialization around higher-value critical metals
              rather than trying to underwrite green steel economics first. The company and third-party coverage both
              describe MOE as a platform that can recover niobium, tantalum, vanadium, nickel, and chromium from
              low-grade feedstocks, with steel decarbonization positioned as the larger but later market. That
              sequencing matters financially: public evidence does not show realized steel revenue, but it does show
              management repeatedly framing critical metals as the first market where unit economics could work without
              waiting for a green premium. The result is a revenue bridge where feedstock processing and metals sales
              are the near-term monetization path, while steel-scale licensing remains contingent on larger reactor
              proof and customer adoption later in the decade.
