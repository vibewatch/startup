              - CR008
              - CR009
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment call: track, not underwrite'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a differentiated-technology thesis, but not a priced investment thesis. Boston
              Metal's May 2026 financing added $75 million and pushed cumulative funding above $500 million, while
              independent reporting shows the company has advanced from lab cells to a multi-anode steel run that
              produced more than a ton of metal. At the same time, the same public record still lacks a current
              post-money valuation, preference stack, audited revenue, gross margin, burn, or cash-runway disclosure.
              Independent reporting also keeps emphasizing that steel-scale economics and equipment durability are still
              being worked through. That mix of proof and missing price context supports a track recommendation rather
              than an immediate underwriting decision.
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing depth exists, but price discipline cannot be anchored publicly
        blocks:
          - type: paragraph
            body: >-
              Boston Metal has shown repeated financing access across cycles: a $50 million Series B in 2021, a $20
              million Series C2 extension in January 2024 that brought that series to $282 million, and a $75 million
              May 2026 round that brought cumulative capital raised above $500 million. Public evidence also points to a
              $50 million U.S. federal grant linked to a Weirton critical-metals project, which broadens the capital
              stack beyond equity alone. The problem for valuation is not lack of funding; it is lack of price
              transparency. None of the retained public sources disclose the current valuation, liquidation preferences,
              dilution structure, or updated operating metrics needed to test whether the latest price is justified by
              realized commercialization rather than technology promise.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario logic is milestone-driven until economics and terms are visible
        blocks:
          - type: paragraph
            body: >-
              The upside case depends on Boston Metal converting technical momentum into commercial proof first in
              critical metals and later in steel licensing or plant deployments. The base case remains progress without
              sufficient disclosure for valuation conviction: the company shows financing depth, strategic partners, and
              technical scaling milestones, yet still does not show public revenue quality or steel-unit economics. The
              downside case is a schedule or cost slippage story. Independent reporting says the current reactor can
              make only a ton or two of material in about a month, while the next system is meant to compress that
              output into about a day, and management has separately framed 2026 commercialization ambitions. If those
              milestones slip, or if a future round prices below implied expectations, the thesis could reset quickly.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline remains the gating issue
            body: >-
              Boston Metal is interesting enough to keep diligencing, but not transparent enough to price from public
              evidence alone.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV015
          - type: callout
            title: The fastest thesis-breakers are economic or schedule slippage
            body: >-
              A slower-than-expected ramp to commercial critical-metals output, weaker larger-cell durability, or a
              future down round would weaken the current track posture quickly.
            calloutType: risk
            claimRefs:
              - CV008
              - CV014
              - CV016
