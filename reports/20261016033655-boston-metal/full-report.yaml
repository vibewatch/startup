      - number: '4.3'
        title: Capital support is meaningful, but it is still tied to execution and plant delivery
        blocks:
          - type: paragraph
            body: >-
              Boston Metal has raised substantial capital, but the 2026 evidence reads more like repair-and-deployment
              financing than proof of self-funding operations. Company-issued announcements said the May 2026 round
              added $75 million and brought total funding above $500 million, while the U.S. Senate described a separate
              $50 million DOE-backed grant inside a $161 million Weirton project. That support improves Boston Metal's
              ability to keep building, but it does not substitute for disclosed cash balances or runway. The
              independent Blizzard Power profile is especially important because it links the January 2026 Brazil
              refractory failure to a missed financing milestone, voided committed capital, layoffs, and halted Woburn
              operations. In other words, capital access is available, but still conditional on proving plant
              reliability and restarting commercial output.
