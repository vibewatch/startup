    notes: Architecture is synthesized from retained public descriptions; absent safety, quality, and support materials are treated as diligence gaps.
    claimRefs: [CE002, CE003, CE008, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: MOE is one reactor platform expressed through multiple feedstocks, assets, and delivery routes.
    data:
      layers:
        - label: Feedstocks
          items:
            - Medium- and low-grade iron ores
            - Mining waste and industrial slag
          outputs:
            - Input flexibility across steel and critical-metals use cases
        - label: Electrochemistry core
          modules:
            - Molten oxide electrolysis reactor at about 1,600 C
            - Power delivery into the molten bath
            - Oxygen off-gas instead of carbon-emitting furnace chemistry
          outputs:
            - Molten iron or target metal stream
        - label: Durability and control layer
          modules:
            - Inert anodes that conduct current without consumable-carbon chemistry
            - Refractory and thermal management
            - Process controls and tapping operations
          outputs:
            - Stable cell operation at industrial scale
        - label: Industrial assets
          items:
            - Woburn industrial steel cell
            - Brazil critical-metals plant
            - Planned Weirton chromium facility
          outputs:
            - Pilot steel proof, critical-metals production, and domestic alloy manufacturing
        - label: Output streams
          items:
            - Molten iron / steel pathway
            - Niobium and chromium-adjacent critical-metals pathway
          outputs:
            - Two product lines from one reactor family
        - label: Commercial delivery
          items:
            - Critical-metals sales
            - Future steel-process licensing
          outputs:
            - Revenue bridge before full steel-scale deployment
    approximationNotes: null
    claimRefs: [CE001, CE004, CE006, CE010]
callouts:
  - calloutType: strength
    title: Pilot-scale electrochemistry looks materially de-risked
    body: >-
      The combination of inert-anode durability evidence and the 2025 tonnage-steel run is the
      strongest proof that Boston Metal has moved beyond lab science into industrial pilot
      execution.
    claimRefs: [CE003, CE004]
  - calloutType: insight
    title: Critical metals are the bridge product, not just an adjacency
    body: >-
      The public product map is really two businesses sharing one reactor core: direct
      critical-metals production now and steel-process licensing later.
    claimRefs: [CE005, CE006, CE010]
  - calloutType: risk
    title: Commercial proof still depends on asset execution and economics
    body: >-
      Brazil ramp, Weirton build-out, and demo-plant economics appear more decisive for diligence
      than the next fundraising headline.
    claimRefs: [CE006, CE010, CE013]
