  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercial-economics
      missingEvidence: Public cost per ton, electricity intensity, anode-life statistics, uptime, and yield data for Woburn or Brazil operations.
      whyItMatters: Without operating economics, the pilot milestone does not convert into an underwritable view on gross margin or licensing attractiveness.
      diligencePath: Request pilot runbooks, costed mass-and-energy balances, anode replacement data, and plant-level throughput history for Woburn and Brazil.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: assurance-surface
      missingEvidence: Public security, status, quality, certification, safety, and implementation documentation for Boston Metal's operating platform.
      whyItMatters: Product maturity for industrial buyers depends on operating controls and assurance surfaces, not only on pilot milestone announcements.
      diligencePath: Ask for ISO or equivalent quality materials, EHS procedures, reliability dashboards, customer implementation plans, and any public or private certification packs.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE001, TE003]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A Boston Metal-owned public developer or practitioner surface such as repositories, packages, forums, or technical talks tied directly to deployment.
      whyItMatters: The current proxy shows very limited external technical community signal, which weakens outside-in validation of product depth and integration readiness.
      diligencePath: Look for company-owned code, conference talks, hiring talks, partner engineering posts, or private customer integration materials.
      relatedQuestionRefs: [QE008]
