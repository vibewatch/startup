company:
  name: Boston Metal
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Boston Metal is commercializing one molten-oxide-electrolysis platform across a nearer-term
    critical-metals business and a longer-cycle steel-licensing business. Public evidence shows
    real technical progress, including tonnage steel from a multi-anode Woburn cell and a
    DOE-backed chromium plant plan, but the public surface still lacks plant-level economics,
    product documentation, and operational-assurance detail.
sections:
  - id: product-scope
    title: Product scope and commercialization path
    body: >-
      Boston Metal's product is not a standalone component; it is an electro-metallurgy platform
      sold through two customer workflows. For mining and alloy customers, the nearer-term offer is
      critical-metals production from low-grade waste streams, with Brazil positioned as the first
      commercial bridge. For steelmakers, the company is pitching MOE as a future process
      replacement that can turn iron ore into molten iron and then be licensed into customer mills
      rather than operated as Boston Metal-owned steel capacity. That sequencing matters because the
      public record repeatedly shows critical metals as the bridge product intended to fund learning
      and de-risk the harder steel scale-up.
    claimRefs: [CE001, CE005, CE006, CE009]
    tableRefs: [TE001, TE002]
  - id: architecture
    title: Operating architecture and technical differentiation
    body: >-
      Technically, the architecture is a high-temperature electrolysis stack rather than a generic
      climate-tech brand story. Inputs are metal oxides or waste-derived feedstocks; current passes
      through an inert anode into a molten bath at roughly 1,600 C; oxygen is released and liquid
      metal is tapped out. Boston Metal's strongest disclosed differentiator is the inert-anode
      system, which both company and independent reporting describe as the key to running large
      cells without consumable-carbon chemistry. The 2025 Woburn milestone, tonnage steel from a
      multi-anode industrial cell, matters because it tests the transition from single-anode
      laboratory reactors to larger, more plant-like configurations. The same core architecture
      also underpins chromium and niobium pathways, widening feedstock and end-market optionality.
    claimRefs: [CE002, CE003, CE004, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-risks
    title: Deployment maturity, dependencies, and diligence risks
    body: >-
      Deployment maturity is no longer purely conceptual, but it is not yet bankable commercial
      proof. Public evidence supports three real asset paths: a Woburn industrial steel cell, a
      Brazil critical-metals plant path, and a DOE-supported Weirton chromium project. The weaker
      surface is around operating assurance. The retained official material is release-heavy, with
      no public API, status, security, or certification corpus in this pool, and the
      developer-signal proxy is a single GitHub topic entry rather than Boston Metal-owned
      repositories. Independent reporting also still frames cost learning, multi-reactor
      throughput, and demo-plant siting as open work. That leaves underwriting dependent on
      diligence around uptime, anode life, power economics, and customer qualification rather than
      on published operating KPIs.
    claimRefs: [CE007, CE008, CE011, CE012, CE013]
