company:
  name: Boston Metal
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to a staged customer path: Boston Metal's nearer-term revenue
    case is selling high-value metals into steel and advanced-materials supply chains,
    while green-steel licensing remains a later commercialization step. Adoption proof
    improved materially with the 2025 Woburn steel-cell run and plant buildouts in
    Brazil and West Virginia, but the company still does not publicly disclose named
    production customers, retention metrics, or concentration exposure.
sections:
  - id: staged-customer-base
    title: Staged customer base and monetization path
    body: >-
      The assigned sources show Boston Metal serving two different buyer paths rather
      than one fully mature customer base. The near-term path is selling high-value
      metals into existing industrial supply chains: the 2021 and 2024 company releases
      describe deployment with customers beginning in ferroalloys and high-value metals,
      while Canary reports the Brazil facility will sell extracted metals to steelmakers
      as additives. The longer-term path is green-steel commercialization, where the
      company is still moving from proof-of-process toward a licensing model for
      steelmakers rather than reporting current production contracts. Geography matters:
      management tied the 2024 round to Asia expansion, explicitly because the region
      represents more than 70% of global steel production, and the West Virginia
      chromium project broadens the relevant end-market base beyond steel alone.
    claimRefs: [CU001, CU002, CU003, CU006, CU010, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is operational, not customer-count driven
    body: >-
      The strongest public proof of adoption is technical and operational rather than
      commercial-density metrics. Boston Metal's March 2025 announcement says its
      multi-inert anode steel cell is operating in Woburn and de-risks commercial
      production, while MIT Technology Review reports that the company produced over a
      ton of steel from that system after several weeks of operation. Independent
      reporting also shows the company prioritizing the Brazil critical-metals plant as
      the first commercial-scale deployment, with a 10,000-metric-ton niobium target at
      full 2026 operations. These are meaningful readiness signals, but they are not
      the same as disclosed customer counts, contract wins, repeat purchase rates, or
      production volumes sold into market.
    claimRefs: [CU003, CU004, CU005, CU007, CU008, CU013, CU014]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration remain the main diligence gaps
    body: >-
      Customer durability is still largely untestable from public materials. Across the
      assigned official and independent sources, Boston Metal does not disclose customer
      count, renewal rates, churn, average contract length, or top-customer share.
      Named market proof is also thinner than the operating story: the press archive
      signals an Outokumpu collaboration, but the assigned pool does not include the
      linked release or any public volume, pricing, or deployment outcome. That leaves
      the investment case dependent on conversion from partner/investor validation and
      plant milestones into repeat commercial demand. Until Boston Metal discloses
      reference customers or booked volumes, concentration risk is better framed as an
      unresolved diligence item than as a solved go-to-market question.
    claimRefs: [CU009, CU011, CU012, CU014]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation and revenue path
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Critical-metals additives
        - Steelmakers buying niobium, chromium, and related alloy inputs
        - Use extracted metals as additives in steel furnaces
        - Brazil facility described as the first commercial-scale MOE deployment
        - Nearest public route to product revenue and customer usage
        - No named buyers, contracts, or repeat-order data disclosed
      - - Tailored industrial customers
        - Unnamed customers working with Boston Metal on alloy, feedstock, and business-fit requirements
        - Adapt MOE to specific alloys, feedstocks, and plant economics
        - 2021 release says the company works closely with customers and planned deployment with customers
        - Shows application-led selling motion before broad platform rollout
        - No customer names, number of trials, or conversion rate to production
      - - Future green-steel licensees
        - Steelmakers that could license MOE rather than buy alloy output
        - Deploy large-scale emissions-free steelmaking systems
        - MIT Technology Review says licensing to steelmakers is the hoped-for end state after a larger demo plant
        - Long-duration upside if technical and cost milestones convert into licenses
        - Still pre-commercial; no named licensee, term sheet, or timetable beyond demo milestones
      - - Public-sector-backed advanced-materials channel
        - U.S. industrial and defense supply-chain counterparties indirectly supported by the Weirton project
        - Buy ultrapure chromium metal and high-temperature alloys
        - Senate announcement cites a $161 million project and 200 expected jobs in Weirton
        - Diversifies addressable demand beyond green steel alone
        - Public policy support is not the same as customer bookings or plant utilization
    notes: >-
      Mixes official company, independent reporting, and government project evidence;
      public sources identify segments and commercialization path, but not contracted
      revenue, customer counts, or cohort durability.
    claimRefs: [CU001, CU002, CU003, CU010, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - High-value metals revenue timing
        - As early as 2024
        - "2024-01-30"
        - Boston Metal Series C2 release
        - Medium
        - Management framed critical metals as the first monetization step before full steel scale-up
        - No disclosed actual 2024 revenue, booked customers, or shipment volume
      - - Brazil commercial plant output target
        - 10,000 metric tons per year of niobium at full operations
        - 2026 target disclosed in 2023 reporting
        - Canary Media
        - Medium
        - Gives the clearest public throughput marker for the first commercial customer-facing plant
        - No disclosed off-take commitments, utilization ramp, or customer mix
      - - Woburn steel run
        - Over a ton of metal produced after several weeks of operation
        - 2025-02-17 run reported on 2025-03-12
        - MIT Technology Review
        - High
        - Confirms tonnage steel output and improves credibility with future steel customers
        - Not evidence of paid production sales, repeat runs, or customer acceptance
      - - Next steel demo scale
        - Ton or two per month at current size; larger system targets that amount per day
        - "2025-03-12"
        - MIT Technology Review
        - Medium
        - Shows the gap between current proof and economically relevant customer scale
        - No disclosed capex, operating cost, or signed demo host / licensee
    notes: >-
      Table mixes disclosed current metrics with forward-looking company and journalist
      statements; values indicate adoption readiness, not verified revenue or customer
      count.
    claimRefs: [CU004, CU005, CU007, CU008, CU009, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Outokumpu
        - Steel-industry counterparty
        - Boston Metal press archive references a collaboration and points readers to Outokumpu's release
        - Undisclosed
        - Shows at least one named industry collaboration on the public surface
        - Assigned pool does not include the linked release, deployment status, or commercial terms
      - - BHP ecosystem
        - Strategic mining and steel value-chain participant
        - BHP Ventures said the investment supports decarbonisation across its value chain and for BHP customers
        - Ecosystem signal, not a customer contract
        - Supports buyer relevance inside incumbent metals networks
        - BHP is an investor; the source does not show BHP as a paying Boston Metal customer
      - - Steelmakers buying alloy additives
        - Target buyer class for Brazil plant output
        - Canary says Boston Metal will sell extracted metals to steelmakers for stronger or corrosion-resistant steel
        - Pre-ramp commercial deployment
        - Confirms a specific buyer/user category for the first commercial plant
        - Public evidence does not name any steelmaker, price, or recurring order pattern
      - - Weirton advanced-materials buyers
        - Aerospace, chemical, nuclear, and energy-materials supply chains
        - Senate-backed chromium and alloy plant aims to onshore strategic materials
        - Project buildout
        - Broadens commercial relevance beyond the steel decarbonization narrative
        - Government support and hiring plans do not prove actual customer commitments
    notes: >-
      This is a partial public enumeration of named counterparties and buyer classes,
      not a complete customer roster; available evidence is stronger on market relevance
      than on production deployment or retention.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly disclosed named counterparties and buyer classes in the assigned
        2021-2026 sources; Boston Metal does not publish a complete customer roster.
    claimRefs: [CU002, CU003, CU011, CU012]
figures:
