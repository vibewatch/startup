  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-metrics
      missingEvidence: Named production customers, customer count, renewal/churn data, and average contract length.
      whyItMatters: These metrics determine whether Boston Metal has durable demand or only milestone-driven interest.
      diligencePath: Request a current customer list, cohort / renewal data, and top-customer revenue share from management.
      relatedQuestionRefs: [QU003, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer exposure, booked volumes, and any dependence on a single plant, geography, or counterparty.
      whyItMatters: Concentration risk could be high if commercialization depends on one Brazil plant, one demo host, or one industrial buyer.
      diligencePath: Ask for signed off-take, pipeline staging by buyer, and any customer concentration thresholds used internally.
