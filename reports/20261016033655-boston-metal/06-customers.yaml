    title: Customer journey map
    type: journey-map
    summary: >-
      Boston Metal's public customer path moves from tailored alloy/customer work and
      first commercial critical-metals output toward later steel licensing.
    data:
      items:
        - label: Tailor MOE to customer feedstocks
          actor: Boston Metal and unnamed industrial customers
          phase: Pre-commercial application fit
          touchpoints:
            - "2021 release says Boston Metal 'works closely with customers to tailor the MOE technology for specific alloys, feedstocks, and business needs.'"
            - "No customer names or qualification counts are disclosed."
        - label: Funded proof for industrial steel and ferroalloys
          actor: Investors and development partners
          phase: Commercial readiness build
          touchpoints:
            - "Mintz says the Series A would allow Boston Metal to 'commission an industrial steel production system' and 'develop a demonstration plant to produce ferrovanadium.'"
            - "This is commercialization preparation rather than customer revenue proof."
        - label: Brazil critical-metals plant
          actor: Boston Metal do Brasil and steelmaking-input buyers
          phase: First commercial-scale plant
          touchpoints:
            - "Canary reports the plant will sell extracted metals to steelmakers as additives."
            - "Public evidence still omits buyer names and booked volumes."
        - label: Woburn steel-cell milestone
          actor: Future steel customers and licensees
          phase: Technology qualification
          touchpoints:
            - "Official and MIT Technology Review sources show tonnage steel output from the multi-anode reactor."
            - "This improves customer credibility but does not show paid production deployment."
        - label: Larger demo plant
          actor: Prospective steelmaking hosts
          phase: Scale-up bridge
          touchpoints:
            - "MIT Technology Review says the next demonstration plant should come online in late 2026 and begin operation in 2027."
            - "Economics and host-customer identity remain undisclosed."
        - label: Long-term steel licensing
          actor: Steelmakers
          phase: Expansion loop
          touchpoints:
            - "MIT Technology Review says Boston Metal ultimately hopes to license its technology to steelmakers."
            - "No public licensee, renewal, or concentration data is yet available."
    claimRefs: [CU001, CU007, CU009, CU010, CU012]
callouts:
  - calloutType: strength
    title: Near-term customer logic is clearer in critical metals than in steel
    body: >-
      The public go-to-market story is strongest where Boston Metal can sell higher-value
      metals into existing steel and advanced-materials chains before asking customers to
      adopt full green-steel systems.
    claimRefs: [CU001, CU003, CU012]
  - calloutType: risk
    title: Customer proof is still mostly indirect
    body: >-
      Boston Metal has better operating proof than customer disclosure: public sources
      show technical milestones and project buildouts, but not named production customers,
      retention metrics, or concentration detail.
    claimRefs: [CU007, CU009, CU011]
