company:
  name: Boston Metal
chapter:
  number: 1
  title: Company Overview
  summary: Boston Metal is a Woburn-based Molten Oxide Electrolysis commercialization company with a Brazil critical-metals deployment, company-claimed total funding above $500 million, and a 2025 tonnage-steel milestone that independent reporting still treats as pre-commercial. The identity and capital story are reasonably well supported, but valuation, governance rights, current revenue, and customer disclosure remain material gaps.
sections:
- id: identity-and-platform
  title: Identity, footprint, and operating model
  body: Retained sources support Boston Metal as a commercialization-stage platform company rather than a conventional steel producer. Company pages consistently describe Molten Oxide Electrolysis as one platform spanning steel decarbonization and high-value or critical-metals recovery, while the steel-specific product page makes clear that Boston Metal intends to license MOE Steel and sell inert anodes instead of producing steel itself. Independent reporting ties the company back to MIT-origin research but conflicts on whether Boston Metal was founded in 2012 or 2013; this chapter preserves that discrepancy rather than selecting a year. Company-issued financing materials anchor the current footprint in Woburn, Massachusetts with a wholly owned Brazilian subsidiary. That is enough to ground later chapters on technology, market, and operations, but not enough to support broader claims about undisclosed customer count, current revenue scale, or valuation.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO016
  tableRefs:
  - TO001
- id: leadership-and-capital-base
  title: Leadership visibility and capital base
  body: 'The public leadership picture is concentrated around a small group of named operators: CEO Tadeu Carneiro, Chief Scientist Guillaume Lambotte, business-development lead Adam Rauwerdink, and Brazil subsidiary president Itamar Resende. That gives investors enough surface area to identify key-person dependence, but not enough to assess board composition, observer rights, voting control, or succession depth from public evidence alone. Financing releases show a broad syndicate across industrial, climate, and strategic capital, from the 2021 Series B group through Marunouchi Innovation Partners in 2024 and Tata Steel joining the 2026 financing. Company-issued materials support more than $500 million of cumulative funding as of May 2026, but they do not disclose a current post-money valuation or cap-table detail.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO014
  - CO015
  tableRefs:
  - TO002
  - TO003
- id: milestones-and-open-risks
  title: Milestones, near-term focus, and unresolved execution risk
  body: The retained milestone set supports a company moving from research and pilot work into staged commercialization, but not yet an industrial rollout that can be treated as fully de-risked. In March 2024 Boston Metal inaugurated its first Brazil facility for high-value metals, disclosed the clearest public staffing datapoint for that subsidiary, and framed critical metals as the earlier monetization path. By February and March 2025, independent and company reporting both pointed to tonnage steel output from the multi-anode Woburn reactor. Even so, MIT Technology Review still described major remaining milestones around scale, plant economics, and a larger demonstration system targeted for late 2026 and 2027 operations, so those future dates should be read as progress markers rather than achieved proof points.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  figureRefs:
  - FO001
