  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current post-money valuation, cap-table ownership, and dilution terms for the 2026 financing.
    whyItMatters: Valuation and ownership concentration are necessary to judge entry price, downside, and governance leverage.
    diligencePath: Request the latest financing deck, cap table, and signed term documents from management or lead investors.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Verified 2025-2026 revenue, gross margin, burn, runway, customer count, and named commercial steel or critical-metals customers.
    whyItMatters: These metrics determine whether the company has moved from technical progress into durable commercial traction.
    diligencePath: Obtain current management accounts, bookings pipeline, customer roll-forward, and cash planning materials.
    relatedQuestionRefs:
    - QO007
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, investor governance rights, observer seats, reserved matters, and formal succession planning.
    whyItMatters: The public leadership picture is narrow, so governance depth and control rights materially affect key-person and execution risk.
    diligencePath: Request board lists, governance documents, investor side letters, and succession planning materials.
    relatedQuestionRefs:
    - QO003
    relatedTableRefs:
    - TO002
  - type: stale
    severity: material
    topic: steel-commercialization-path
    missingEvidence: Current demo-plant budget, customer qualification milestones, and evidence that the late-2026 / 2027 steel timeline remains on track.
    whyItMatters: The strongest independent source still frames steel economics and scale timing as unresolved, which affects underwriting confidence.
    diligencePath: Request the steel demonstration plan, qualification schedule, and updated commercialization milestones from management.
    relatedQuestionRefs:
    - QO006
  - type: conflicting-data
    severity: minor
    topic: founding
    missingEvidence: A primary corporate or registry record that resolves whether Boston Metal was founded in 2012 or 2013.
    whyItMatters: The discrepancy is not investment-critical, but later chapters should not present one founding year as settled fact.
    diligencePath: Request the certificate of incorporation or another dated primary formation record from the company.
