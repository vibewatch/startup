evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current post-money valuation, cap-table ownership, and dilution terms for the 2026 financing.
    whyItMatters: Valuation and ownership concentration are necessary to judge entry price, downside, and governance leverage.
    diligencePath: Request the latest financing deck, cap table, and signed term documents from management or lead investors.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      Verified 2025-2026 revenue, gross margin, burn, runway, customer count, and named commercial steel or
      critical-metals customers.
    whyItMatters: These metrics determine whether the company has moved from technical progress into durable commercial traction.
    diligencePath: Obtain current management accounts, bookings pipeline, customer roll-forward, and cash planning materials.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, investor governance rights, observer seats, reserved matters, and formal succession planning.
    whyItMatters: >-
      The public leadership picture is narrow, so governance depth and control rights materially affect key-person and
      execution risk.
    diligencePath: Request board lists, governance documents, investor side letters, and succession planning materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: steel-commercialization-path
    missingEvidence: >-
      Current demo-plant budget, customer qualification milestones, and evidence that the late-2026 / 2027 steel
      timeline remains on track.
    whyItMatters: >-
      The strongest independent source still frames steel economics and scale timing as unresolved, which affects
      underwriting confidence.
    diligencePath: >-
      Request the steel demonstration plan, qualification schedule, and updated commercialization milestones from
      management.
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: minor
    topic: founding
    missingEvidence: A primary corporate or registry record that resolves whether Boston Metal was founded in 2012 or 2013.
    whyItMatters: >-
      The discrepancy is not investment-critical, but later chapters should not present one founding year as settled
      fact.
    diligencePath: Request the certificate of incorporation or another dated primary formation record from the company.
    relatedQuestionRefs:
      - QO001
  - type: missing-source
    severity: material
    topic: sam-som-disclosure
    missingEvidence: >-
      A disclosed bridge from steel and critical-metals category lenses to Boston Metal-specific SAM, customer volumes,
      and signed demand.
    whyItMatters: >-
      Without company-specific demand conversion, the market case remains directional rather than underwritten to
      revenue capture.
    diligencePath: >-
      Request customer pipeline, geography split, capacity-ramp assumptions, and management's own SAM/SOM framework
      during diligence.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-economics
    missingEvidence: >-
      Plant-level cost per ton, electricity intensity, anode replacement economics, and margin bridge from critical
      metals to steel.
    whyItMatters: >-
      Adoption timing and valuation depend on whether technical progress converts into repeatable unit economics, not
      just successful runs.
    diligencePath: >-
      Obtain internal techno-economic model, pilot-to-demo learning curve, and operating assumptions for Brazil and
      future steel plants.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: buyer-commitments
    missingEvidence: Named offtake, supply, or licensing commitments that identify budget owners and timing by segment.
    whyItMatters: >-
      The buyer map is credible but still inferred, so procurement timing and willingness to pay remain only partially
      evidenced.
    diligencePath: >-
      Ask for executed or near-executed customer agreements, partner scopes, and procurement or qualification milestones
      by segment.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: license-economics
    missingEvidence: >-
      Boston Metal's steel license pricing, customer contract structure, and target returns for a first commercial
      deployment.
    whyItMatters: >-
      Without commercial terms, it is not possible to judge whether MOE is merely technically differentiated or truly
      bankable for incumbents.
    diligencePath: >-
      Obtain a customer presentation, term sheet, or management interview that discloses steel license economics and
      first-project assumptions.
  - type: missing-source
    severity: material
    topic: named-peer-transparency
    missingEvidence: Public operating metrics and pricing disclosures for named green-steel startup peers on a like-for-like basis.
    whyItMatters: >-
      Route-level comparison is possible today, but a sharper underwriting view of direct startup rivalry needs peer
      economics and customer adoption data.
    diligencePath: >-
      Collect peer financing decks, public offtake announcements, and independent cost benchmarks for hydrogen-DRI and
      other green-steel entrants.
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized pricing by metal, contract duration, discounting, and customer concentration for the critical-metals
      business.
    whyItMatters: >-
      Revenue quality cannot be judged from commodity proxies alone because purity, offtake terms, and buyer
      concentration drive actual monetization.
    diligencePath: >-
      Request current customer contracts, weighted-average realized price by product, and top-10 customer revenue
      concentration.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin bridge, electricity intensity, refractory replacement cost, labor content, and logistics cost per
      tonne or kilogram.
    whyItMatters: >-
      The investment case depends on whether higher-value metals can generate attractive contribution margin before the
      steel business reaches scale.
    diligencePath: >-
      Obtain plant-level unit-economics models for Brazil and Weirton, including sensitivity to power price, uptime, and
      product mix.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: >-
      Current cash balance, monthly burn, grant draw schedule, and management's runway assumptions after the May 2026
      financing.
    whyItMatters: >-
      A large round and a grant improve optionality, but they do not establish whether Boston Metal can fund restart
      delays or the next demo without another raise.
    diligencePath: >-
      Request the latest board-approved cash bridge, covenant summary, and downside runway case tied to Brazil restart
      timing.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: brazil-restart
    missingEvidence: Post-September 2026 confirmation of Brazil restart, ramp profile, and actual shipment cadence.
    whyItMatters: >-
      The most important near-term proof point is whether the first commercial plant moved from announced restart
      expectations to stable output.
    diligencePath: Request October 2026 operating KPIs, first-shipment evidence, and any updated commissioning or outage disclosures.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: private-evidence-only
    severity: material
    topic: commercial-economics
    missingEvidence: >-
      Public cost per ton, electricity intensity, anode-life statistics, uptime, and yield data for Woburn or Brazil
      operations.
    whyItMatters: >-
      Without operating economics, the pilot milestone does not convert into an underwritable view on gross margin or
      licensing attractiveness.
    diligencePath: >-
      Request pilot runbooks, costed mass-and-energy balances, anode replacement data, and plant-level throughput
