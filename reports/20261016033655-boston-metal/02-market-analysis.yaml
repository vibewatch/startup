company:
  name: "Boston Metal"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Boston Metal's addressable market is best understood as a two-step adoption path:
    a broad, regulation- and decarbonization-driven steel opportunity, and a narrower
    near-term critical-metals wedge that offers clearer buyer economics. The retained
    evidence supports multiple sizing lenses around steel emissions, Asian steel
    concentration, niobium demand, and supply concentration, but it does not support a
    source-backed SAM, signed demand curve, or commercial steel pricing model.
sections:
  - id: "market-boundary"
    title: "Market boundary: decarbonized steel plus a critical-metals wedge"
    body: |-
      The retained sources define Boston Metal's market boundary more narrowly than a generic
      "climate tech" narrative. Independent and company-issued evidence both describe Molten
      Oxide Electrolysis as an electro-metallurgical process aimed first at decarbonized primary
      steelmaking and, in parallel, at recovering higher-value metals from oxide feedstocks and
      waste streams. That distinction matters because the company is not selling generic carbon
      avoidance; it is trying to win budgets inside steelmaking, alloy inputs, and metallurgical
      recovery workflows that currently rely on blast furnaces, conventional ferroalloy routes,
      or leaving low-grade materials unmonetized.

      The same evidence also explains why the initial commercialization path is narrower than the
      headline steel opportunity. Independent reporting says the company is currently prioritizing
      metals such as niobium, tantalum, nickel, and chromium because they carry materially higher
      value per unit than bulk steel and can therefore support earlier revenue and proof-of-market.
      Company statements reinforce that sequencing by tying 2024 funding to Asian steel exposure,
      commercialization, and high-value-metals revenue rather than to immediate mass-market steel
      deployment. For valuation work, the right boundary is therefore a long-duration steel
      decarbonization platform with a nearer-term critical-metals wedge, not a single undifferentiated
      TAM.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM015"]
    tableRefs: ["TM001"]
  - id: "sizing-and-buyers"
    title: "Evidence-constrained sizing lenses and buyer map"
    body: |-
      Public sources do not provide a clean TAM/SAM/SOM stack for Boston Metal, so the chapter
      has to size the market through multiple lenses instead of one broad market-estimate slide.
      The outer lens is steelmaking itself: retained independent reporting frames steel as an
      enormous emissions problem and production system, which is why the company continues to
      pursue eventual steel licensing or deployment. A second lens is geographic concentration:
      Boston Metal said Asia represents more than 70% of world steel production, which helps
      explain why market access there matters even before the company discloses customer volumes.
      A third lens is the initial critical-metals wedge, where niobium demand, import reliance,
      and the company's planned Brazil output create a smaller but more monetizable starting point.

      The buyer map follows that same sequence. Near-term buyers and payers are not only future
      green-steel producers; they also include mining and metallurgical operators with oxide-rich
      waste streams, steel and alloy producers buying recovered inputs, and counterparties such as
      Outokumpu that can sit on both sides of the transaction as feedstock supplier and technology
      customer. That combination is strategically useful because it lets Boston Metal test product-market
      fit in narrower, higher-value workflows before it has to prove full steel-scale economics.
    claimRefs: ["CM004", "CM005", "CM006", "CM008", "CM009", "CM010", "CM014"]
    tableRefs: ["TM002", "TM003"]
    figureRefs: ["FM001"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers and constraints"
    body: |-
      The strongest external drivers in the retained evidence are regulatory pressure, supply-chain
      security, and economics in constrained critical-metals niches. The EU's definitive CBAM regime
      now applies to iron and steel imports, which raises the value of lower-carbon production paths
      even if Boston Metal's direct monetization may arrive first in adjacent metals. USGS data adds
      a second demand-side signal: niobium is heavily consumed in steels and superalloys, the United
      States remains fully import-reliant, and Brazil dominates global production. Those facts do not
      prove Boston Metal will win the market, but they do show why a critical-metals wedge can matter
      to buyers concerned with both decarbonization and supply resilience.

      The main constraint is timing. Independent reporting shows the company has demonstrated ton-scale
      steel output and improved anode durability, but commercial steel volumes remain a next-step story
      rather than a current product line. The Brazil plant delay after the refractory leak, plus management's
      continued focus on lowering production cost per ton, make the adoption path execution-sensitive.
      In other words, regulation and category need are real, but underwriting still depends on whether
      Boston Metal can translate technical milestones into repeatable plant economics and customer programs.
    claimRefs: ["CM007", "CM009", "CM011", "CM012", "CM013"]
  - id: "underwriting-gaps"
    title: "What remains unproven for underwriting"
    body: |-
      The current source set is good enough to define the market, identify likely buyers, and bound
      the opportunity with several credible lenses. It is not good enough to publish a source-backed
      SAM or SOM, nor to convert Boston Metal's technical progress into a commercial demand model.
      The accessible refresh evidence does not disclose signed offtake volumes, steel-license timing,
      commercial steel pricing, plant-level cost curves, or realized revenue from the critical-metals
      business. Those omissions are important because they determine whether the market should be
      underwritten as a niche critical-metals recovery business, a future steel-technology licensing
      platform, or both.

      The chapter therefore preserves the market case as conditional rather than definitive. Steel
      emissions, Asian concentration, EU compliance pressure, and niobium supply concentration all
      support real demand drivers. But until Boston Metal or counterparties disclose customer commitments,
      cost economics, and the bridge from pilot cells to industrial steel units, valuation has to treat
      market size as a set of directional lenses rather than a contracted revenue base.
    claimRefs: ["CM011", "CM012", "CM013", "CM014", "CM015"]
