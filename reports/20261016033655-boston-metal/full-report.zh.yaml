  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式从钢铁愿景转向关键金属变现
        blocks:
          - type: paragraph
            body: >-
              留存来源显示，Boston Metal 围绕高价值关键金属安排商业化顺序，而不是先验证绿色钢铁经济性。公司及第三方报道均称，MOE
              可以从低品位原料中回收铌、钽、钒、镍和铬，钢铁脱碳则被定位为更大但更晚的市场。这种排序具有财务意义：公开证据没有显示已实现的钢铁收入，但反复显示管理层把关键金属定位为首个可能在无需等待绿色溢价的情况下跑通单位经济性的市场。由此形成的收入桥梁是，原料处理和金属销售构成近期变现路径，而钢铁规模授权则要等到更大反应器得到验证、客户在本十年后期采用后才能成立。
