              先在关键金属、再在钢铁授权或工厂部署中，把技术势头转化为商业证明。基准情景是继续进展，但披露不足以形成估值信心：公司展示了融资深度、战略合作伙伴和技术规模化里程碑，却仍未展示公开收入质量或钢铁单位经济性。下行情景则是进度或成本延期。独立报道称，当前反应器约一个月只能生产一两吨材料，而下一套系统计划把这项产出压缩到约一天；管理层也单独提出了
              2026 年商业化目标。如果这些里程碑延期，或未来一轮融资价格低于隐含预期，投资论点可能迅速重置。
