      - number: '4.3'
        title: 资本支持有分量，但仍与执行和工厂交付绑定
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 已筹集大量资本，但 2026 年证据更像修复与部署融资，而不是自我造血运营的证明。公司公告称，2026 年 5 月融资新增 $75M，累计融资额超过 $500M；美国参议院则描述了
              Weirton 项目 $161M 总投资中一笔独立的、由 DOE 支持的 $50M 赠款。这些支持提高了 Boston Metal 持续建设的能力，却不能替代已披露的现金余额或资金可支撑期限。独立的
              Blizzard Power 资料尤其重要，因为它将 2026 年 1
              月巴西耐火材料故障与错失融资里程碑、已承诺资本失效、裁员和沃本运营暂停联系起来。换句话说，资本仍可获得，但前提是证明工厂可靠性并恢复商业产出。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.4'
        title: 结论：平台逻辑有吸引力，但披露不足以支持投资判断
        blocks:
          - type: paragraph
            body: >-
              Boston Metal
              的公开材料支持以下战略逻辑：先从高价值关键金属切入，用赠款和战略投资者为首座工厂提供资金，并把钢铁授权保留为更晚的上行空间。但这些材料不足以支持对收入质量、利润率路径或资本充足性的完整判断。公司尚未公开披露
              2025 或 2026 年实际收入、毛利、工厂层面开工率、营运资金需求、客户合同结构或重启后的资金可支撑期限。MIT Technology Review
              报道称，当前钢铁设备每月只能产出一两吨，而下一座示范装置目标是每天产出一吨，这进一步说明技术成功与商业授权之间仍有大量规模化工作。在 Boston Metal
              展示出巴西稳定产出和更具体的工厂经济性之前，财务逻辑仍然有希望，但并不完整。
