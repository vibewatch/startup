    summary: 留存证据从广泛的钢铁脱碳问题逐步收敛到 Boston Metal 近期更现实的关键金属切入口。
    data:
      items:
        - label: 全球钢铁产量基础
          displayValue: 2.0B mt/year
          note: MIT Technology Review 在 2025 年对 Boston Metal 最终目标钢铁系统规模的观察。
