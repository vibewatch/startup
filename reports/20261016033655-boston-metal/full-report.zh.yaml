      - number: '3.2'
        title: Boston Metal 的定位有差异化，但仍处于规模化之前
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的公开定位在结构上不同于这些替代方案。公司称，MOE
              是一种一步式电气化工艺，可以把铁矿石转化为液态金属，并在反应点产生氧气；第三方报道称，其商业化模式是向现有钢铁生产商授权模块化电解槽，而不是成为完全一体化生产商。这种模式具有战略吸引力，因为公司可以借助现有厂商的下游关系，但证据也显示
              Boston Metal 仍在证明规模化：工业反应器已经产出吨级钢铁，但下一套示范系统仍是未来里程碑，而非已经部署的商业机群。
