    rows:
      - - Boston Metal MOE
        - 工业钢铁反应器在 2025 年 2 月产出吨级金属；下一座更大的示范工厂仍在未来规划中
        - 向钢厂许可模块化 MOE 电解槽；先销售高价值金属
        - 一步式电气化路径，副产氧气，并声称可适应不同矿石
        - 仍需证明可重复的工业经济性和客户采用
      - - 现有 BF-BOF 钢厂
        - 预计 2026 年全球钢铁需求为 1,722 Mt；现有高炉群规模庞大且寿命较长
        - 拥有成熟供应链的现有综合钢厂
        - 装机基础、采购议价能力和已验证的运营模式
        - 煤炭 / 焦炭路径仍然排放密集，并承受脱碳压力
      - - 基于废钢的 EAF 生产商
        - 全球废钢路径已经供应了相当一部分钢铁原料
        - 能获得废钢且拥有 EAF 产能的买方
        - 在废钢可得地区，这是成熟的低能耗替代方案
        - 仅靠废钢无法满足炼钢的全部原材料需求
      - - 基于氢的 DRI 开发商
        - IEA 路径预计到 2050 年，基于氢的 DRI 将占原生钢产量略低于 15%
        - 能获得廉价清洁电力和新基础设施的原生钢生产商
        - 不依赖 Boston Metal 新型电解化学的低碳原生钢路径
        - 需要大规模建设氢能和电力基础设施
      - - 现有设施改造 / CCUS 路径
        - IEA 表示，多类工艺仍然可行，具体取决于地区和政策
        - 升级现有资产的钢厂
        - 可以利用现有厂址、资产负债表和政策支持
        - 较新的现有资产基础可能减缓对 MOE 这类全新路径的采用
    notes: 公开证据最充分的是路径类别和市场结构，而不是私营初创公司的透明运营指标清单。
