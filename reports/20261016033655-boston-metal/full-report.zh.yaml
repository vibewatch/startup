            - 约 1,600 C 的熔融氧化物电解反应器
            - 向熔池供电
            - 以氧气尾气替代排放碳的炉内化学过程
          outputs:
            - 熔融铁或目标金属流
        - label: 耐久与控制层
          modules:
            - 采用惰性阳极导电，不依赖消耗性碳化学
            - 耐火材料和热管理
            - 工艺控制与出铁操作
          outputs:
            - 工业规模下稳定运行的电解单元
        - label: 工业资产
          items:
            - Woburn 工业钢铁电解单元
            - 巴西关键金属工厂
            - 规划中的 Weirton 铬工厂
          outputs:
            - 钢铁试点验证、关键金属生产和本土合金制造
        - label: 产出流
          items:
            - 熔融铁 / 钢铁路径
            - 铌和铬相关关键金属路径
          outputs:
            - 一套反应器家族带出两条产品线
        - label: 商业交付
          items:
            - 关键金属销售
            - 未来钢铁工艺许可
          outputs:
            - 在全面钢铁规模部署前搭建收入桥梁
    approximationNotes: null
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Boston Metal 公开可见的客户路径，从定制合金和客户协作、首批商业化关键金属产出，逐步走向后续钢铁许可。
    data:
      items:
        - label: 按客户原料定制 MOE
          actor: Boston Metal 和未具名工业客户
          phase: 商业化前应用适配
          touchpoints:
            - 2021 年公告称，Boston Metal “与客户密切合作，为特定合金、原料和业务需求定制 MOE 技术”。
            - 未披露客户名称或验证数量。
        - label: 为工业钢铁和铁合金验证提供资金
          actor: 投资者和开发合作伙伴
          phase: 商业准备度建设
          touchpoints:
            - Mintz 称，A 轮融资将支持 Boston Metal “投产一套工业钢铁生产系统”，并“建设一座生产钒铁的示范工厂”。
            - 这是商业化准备，不是客户收入证明。
        - label: 巴西关键金属工厂
          actor: Boston Metal do Brasil 和炼钢原料买家
          phase: 首座商业规模工厂
          touchpoints:
            - Canary 报道称，该工厂会把提取出的金属作为添加剂卖给钢厂。
            - 公开证据仍未披露买家名称和已签约销量。
        - label: Woburn 钢铁电解单元里程碑
          actor: 未来钢铁客户和被许可方
          phase: 技术验证
          touchpoints:
            - 官方来源和 MIT Technology Review 显示，多阳极反应器已经产出吨级钢材。
            - 这提升了客户信心，但不代表已实现付费生产部署。
        - label: 更大规模示范工厂
          actor: 潜在炼钢厂址合作方
          phase: 扩大规模的桥接阶段
          touchpoints:
            - MIT Technology Review 称，下一座示范工厂应在 2026 年末上线，并于 2027 年开始运行。
            - 经济性和厂址客户身份仍未披露。
        - label: 长期钢铁许可
          actor: 钢厂
          phase: 扩张循环
          touchpoints:
            - MIT Technology Review 称，Boston Metal 最终希望向钢厂授权其技术。
            - 目前没有公开的被许可方、续约或客户集中度数据。
    claimRefs:
      - CU001
      - CU007
      - CU009
      - CU010
      - CU012
