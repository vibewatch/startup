      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              留存证据中最强的外部驱动因素是监管压力、供应链安全，以及受限关键金属细分市场的经济性。欧盟 CBAM 终局制度现已适用于铁和钢进口，这提高了低碳生产路径的价值，即使 Boston Metal
              的直接变现可能首先来自相邻金属。USGS 数据提供了第二个需求信号：铌大量用于钢材和超合金，美国仍完全依赖进口，而巴西占据全球主导产量。这些事实不能证明 Boston Metal
              会赢得市场，但说明了为什么关键金属切入口能同时满足关注脱碳和供应韧性的买方。


              主要约束是时间。独立报道显示，公司已经实现吨级钢铁产出并改善阳极耐久性，但商业钢铁产量仍是下一步，而非当前产品线。耐火材料泄漏导致巴西工厂延期，加上管理层仍在努力降低每吨生产成本，使采用路径高度依赖执行。换句话说，监管和品类需求都是真实的，但投资判断仍取决于
              Boston Metal 能否把技术里程碑转化为可重复的工厂经济性和客户项目。
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 投资判断仍无法证明的部分
        blocks:
          - type: paragraph
            body: >-
              现有来源足以定义市场、识别可能的买家，并用几种可信视角框定机会。但它不足以发布有来源支撑的 SAM 或 SOM，也不足以把 Boston Metal
              的技术进展转化为商业需求模型。可获得的更新证据没有披露已签署的包销量、钢铁授权时间、商业钢铁定价、工厂层面成本曲线，或关键金属业务的实际收入。这些缺口很重要，因为它们决定市场应被投资评估为关键金属回收细分业务、未来的钢铁技术授权平台，还是二者兼具。


              因此，本章将市场判断保留为有条件的结论，而非确定结论。钢铁排放、亚洲集中度、欧盟合规压力和铌供应集中度都支持真实的需求驱动因素。但在 Boston Metal
              或交易对手披露客户承诺、成本经济性以及从试点电解槽到工业钢铁设备的过渡之前，估值只能把市场规模视为方向性视角的集合，而不是已签约收入基础。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争首先发生在工艺路线，而非公司
        blocks:
          - type: paragraph
            body: >-
              最直接的竞争集合不是单一同行群，而是一组都能追求低碳钢铁的路线替代方案。传统高炉—转炉路线仍然重要，因为它处在庞大市场和不会迅速消失的存量产能中，尽管传统炼钢仍然高碳。废钢电弧炉生产在废钢充足的地方是成熟替代方案；氢基直接还原铁项目和
              CCUS 改造，则是 IEA 路径研究识别出的主要初级钢铁替代方案。              因此，Boston Metal 进入的是一个买方可以继续使用煤基现有路线、转向废钢、改造现有工厂，或在选择 MOE
              之前采用氢路线的市场。
            claimRefs:
