  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的产品不是一个独立零部件，而是通过两条客户流程销售的电冶金平台。对矿业和合金客户而言，近期产品是从低品位废物流中生产关键金属，巴西项目是第一座商业化桥梁。对钢铁生产商而言，公司把 MOE
              推销为未来的工艺替代方案：将铁矿石转化为熔融铁，再授权给客户钢厂使用，而不是由 Boston Metal
              自己运营钢铁产能。这种排序很重要，因为公开记录反复显示，关键金属是用于支持学习、降低更难钢铁规模化风险的桥接产品。
