      items:
        - period: 2012-2013
          label: 不同来源给出的成立年份不同
          detail: Canary Media 报道成立于 2012 年；MIT Technology Review 则称，MIT 开发的熔融氧化物电解技术于 2013 年实现商业化。
          claimRefs:
            - CO004
            - CO016
        - date: '2021-01-11'
          label: Series B 已披露
          detail: Boston Metal 宣布完成由 Piva Capital、BHP Ventures 和 Devonshire Investors 领投的 $50M Series B。
          claimRefs:
            - CO007
        - date: '2024-01-30'
          label: Series C2 已披露
          detail: Boston Metal 宣布获得 Marunouchi 提供的 $20M Series C2，并称该轮总额达到 $282M。
          claimRefs:
            - CO008
        - date: '2024-03-07'
          label: 巴西工厂落成
          detail: 公司在巴西启用了首个高价值金属 MOE 部署，并披露了当地团队扩张计划。
          claimRefs:
            - CO010
            - CO011
        - date: '2025-02-17'
          label: 最大规模炼钢运行完成
          detail: MIT Technology Review 报道称，公司在工业炼钢反应器运行数周后抽出约一吨材料。
          claimRefs:
            - CO012
        - date: '2025-03-12'
          label: 调试里程碑公开
          detail: Boston Metal 称吨级钢铁已从其 Woburn 多惰性阳极电解槽中产出，并将结果定位为可规模化的证明。
          claimRefs:
            - CO012
        - date: '2026-05-20'
          label: 关键金属融资完成
          detail: Boston Metal 宣布融资 $75M，称累计融资超过 $500M，并强调 Tata Steel 加入该轮。
