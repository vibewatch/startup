  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：脱碳钢铁加关键金属切入口
        blocks:
          - type: paragraph
            body: >-
              留存来源对 Boston Metal
              市场边界的定义，比泛泛的“气候科技”叙事更窄。独立及公司来源均将氧化物熔融电解描述为一种电冶金工艺，首先面向脱碳初级炼钢，同时从氧化物原料和废物流中回收更高价值的金属。这个区分很重要：公司卖的不是泛化的碳减排，而是试图在钢铁生产、合金原料和冶金回收流程中争取预算；这些流程目前依赖高炉、传统铁合金路线，或直接放弃低品位材料的变现。


              同一组证据也解释了为什么最初的商业化路径比表面上巨大的钢铁机会更窄。独立报道称，公司当前优先推进铌、钽、镍和铬等金属，因为它们单位价值明显高于大宗钢铁，因此更能支撑早期收入和市场验证。公司表述也强化了这种排序：2024
              年融资被用于亚洲钢铁业务、商业化和高价值金属收入，而非立即进行大众市场钢铁部署。因此，估值时应把市场边界理解为一项长期钢铁脱碳平台，加上一块更近端的关键金属切入口，而不是一个没有区分的 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
      - number: '2.2'
        title: 受证据约束的市场规模视角与买方图谱
        blocks:
          - type: paragraph
            body: >-
              公开来源没有提供 Boston Metal 清晰的 TAM/SAM/SOM
              层级，因此本章必须从多个视角估算市场，而不是依赖一页宽泛的市场规模幻灯片。最外层是钢铁生产本身：留存的独立报道将钢铁描述为巨大的排放问题和生产体系，这解释了公司为何继续追求最终的钢铁授权或部署。第二个视角是地域集中度：Boston
              Metal 称，亚洲占全球钢铁产量的 70%
              以上，这也解释了即使公司尚未披露客户数量，亚洲市场准入为何仍然重要。第三个视角是初始关键金属切入口：铌需求、进口依赖以及公司计划中的巴西产量，共同构成一个规模更小但更容易变现的起点。


              买方图谱遵循同样的顺序。近期买家和付款方不只是未来的绿色钢铁生产商，还包括拥有富含氧化物废料流的矿业和冶金运营商、购买回收原料的钢铁及合金生产商，以及 Outokumpu
              这样的交易对手——它们既可以是原料供应商，也可以是技术客户。这种组合具有战略价值：在证明完整钢铁规模经济性之前，Boston Metal 可以先在更窄、价值更高的流程中验证产品与市场的匹配。
