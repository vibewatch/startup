      - number: '3.3'
        title: 护城河取决于时间、原料灵活性与成本路径
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 最有力的护城河论点是，MOE 以更宽泛的矿石适配能力切入初级炼钢，并跳过若干现有工艺步骤。更难的反面是经济性：Canary
              的报道解释了管理层为何先商业化高价值金属——大宗钢铁定价给创业公司的容错空间小于特种金属。实际上，Boston Metal
              短期竞争的关键，不只是化学反应能否在实验室中工作，还在于它能否比氢路线或改造路线更快爬过学习曲线。因此，公开来源支持的是谨慎观察、尚未定型的护城河判断。
