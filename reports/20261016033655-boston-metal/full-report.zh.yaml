            body: >-
              留存来源支持这样的判断：Boston Metal
              是处于商业化阶段的平台公司，而非传统钢铁生产商。公司页面始终将氧化物熔融电解描述为一个覆盖钢铁脱碳以及高价值或关键金属回收的平台；钢铁产品页则明确表示，Boston Metal 计划授权 MOE Steel
              并销售惰性阳极，而不是自行生产钢铁。独立报道将公司追溯至 MIT 的源头研究，但对 Boston Metal 成立于 2012 年还是 2013
              年存在冲突；本章保留这一差异，不擅自选定年份。公司发布的融资材料显示，公司当前总部位于马萨诸塞州沃本，并拥有一家全资巴西子公司。这足以支撑后续对技术、市场和运营的分析，但不足以支持关于未披露客户数量、当前收入规模或估值的更广泛主张。
