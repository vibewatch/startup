      - number: '5.2'
        title: 运营架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              从技术上看，这是一套高温电解系统，而不是泛泛的气候科技品牌故事。输入物是金属氧化物或废料衍生原料；电流通过惰性阳极进入约 1,600 C 的熔池，释放氧气并产出液态金属。Boston Metal
              已披露的最强差异化在于惰性阳极系统：公司和独立报道都将其描述为在没有消耗性碳化学的情况下运行大型电解槽的关键。2025
              年沃本多阳极工业电解槽实现吨级钢铁产出，意义在于它检验了从单阳极实验室反应器向更大、更接近工厂配置的过渡。同一核心架构也支持铬和铌路线，扩大了原料与终端市场的选择空间。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
