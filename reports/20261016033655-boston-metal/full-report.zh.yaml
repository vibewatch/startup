      - number: '4.2'
        title: 公开牵引力体现为里程碑和市场代理，而不是已披露的单位经济性
        blocks:
          - type: paragraph
            body: >-
              公开牵引力主要仍处于发展阶段，而非财务阶段。Boston Metal 于 2024 年 1 月称，高价值金属业务最早可以在 2024 年开始产生收入；随后独立报道提到其在巴西建设年产 10,000
              公吨铌的工厂，以及钢铁反应器已经产出约一吨材料。这些数据点有助于确认运营目标和规模目标，但没有回答核心投资判断问题。留存的公开来源均未披露实际定价、客户集中度、收入结构、CAC
              或回本周期、毛利率或现金消耗。业务逻辑最好的公开代理是高价值合金金属与粗钢之间的价差；它解释了商业转向，却不能证明 Boston Metal 的实际贡献利润率。
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI012
