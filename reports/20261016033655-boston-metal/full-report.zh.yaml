            body: >-
              部署成熟度已经不再停留在概念阶段，但还不是可融资的商业证明。公开证据支持三条真实资产路径：沃本工业钢铁电解槽、巴西关键金属工厂路径，以及 DOE 支持的 Weirton
              铬项目。薄弱环节在运营保障。留存的官方材料以公告为主，本资料池中没有公开 API、状态、安全或认证资料；开发者信号也只有一个 GitHub 主题条目，而非 Boston Metal
              自有代码库。独立报道仍把成本学习、多反应器吞吐量和示范工厂选址视为开放问题。因此，投资判断依赖于对开工率、阳极寿命、电力经济性和客户认证的尽调，而不是已公布的运营 KPI。
