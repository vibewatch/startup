  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条跟踪建议建立在真实的技术和资本进展之上，但定价发现缺失、钢铁经济性仍未验证，抵消了这些进展。
    data:
      nodes:
        - label: 资本支持
          value: >-
            $75M raised in May 2026; cumulative funding above $500M; DOE-linked Weirton project adds non-dilutive
            support.
          note: 融资深度较强，但定价条款仍未披露。
          claimRefs:
            - CV001
            - CV010
        - label: 技术验证
          value: 2025 multi-anode steel run produced more than a ton of metal.
          note: 技术规模化已超出实验室验证阶段。
          claimRefs:
            - CV007
        - label: 商业路径
          value: Critical metals are the earlier monetization path; steel remains the larger but later opportunity.
          note: 短期商业化还不等于钢铁规模收入已得到验证。
          claimRefs:
            - CV005
            - CV006
            - CV009
        - label: 经济性风险
          value: Cost discovery and equipment durability are still being worked through at larger scale.
          note: 独立报道仍认为钢铁经济性尚未解决。
          claimRefs:
            - CV011
            - CV014
        - label: 定价可见度
          value: No retained source discloses current valuation, cap table, or preference stack.
          note: 公开证据不足以锚定入场纪律。
          claimRefs:
            - CV013
        - label: 推荐
          value: Track / valuation unknown / risk high.
          note: 等待商业指标或更明确的条款，再把上行空间计入投资判断。
          claimRefs:
            - CV015
    approximationNotes: 该顺序只表示投资判断逻辑，不是加权分数，也不是概率模型。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
