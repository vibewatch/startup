schemaVersion: report-v2
artifact: customers
slug: kreditbee
runDate: 2026-10-19
company:
  name: KreditBee
chapter:
  number: 6
  title: Customers
  summary: >-
    KreditBee has credible public evidence of broad borrower reach across salaried,
    self-employed, and small-business use cases, with multiple 2026 sources pointing
    to tens of millions of loans and loan customers. The harder diligence gap is
    durability: public evidence does not disclose retention, renewal, concentration,
    or cohort quality with the same precision as the headline scale claims.
sections:
  - id: served-segments
    title: Served segments are broad, but the payer and underwriter are shared across the lending stack
    body: >-
      The public customer picture starts with KreditBee positioning itself as a
      distribution and servicing layer between borrowers and regulated lenders,
      not as a pure single-balance-sheet lender. Its own site says approvals and
      sanctions come from RBI-registered NBFCs and banks, while third-party
      coverage adds that the company works with more than 10 financial institutions
      through co-lending partnerships. That architecture matters for the customer
      chapter because the borrower uses the app, but the economic counterparty,
      underwriting capital, and regulatory obligations are shared with lending
      partners. Public segment descriptions are also fairly consistent: personal
      loans remain the entry product, but the product menu extends into business
      loans, two-wheeler finance, and loans against property, implying a mix of
      consumer, self-employed, and MSME-oriented borrowers rather than a single
      narrowly defined persona.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is real, but the public metrics use different denominators
    body: >-
      KreditBee's scale story is strong enough that the question is less whether
      adoption exists and more how cleanly the public numbers can be reconciled.
      External coverage points to 230+ million app downloads, more than 18 million
      loan customers, more than 15 million unique loan customers, over 80 million
      registered customers, and more than 60 million loans facilitated. Those
      metrics all suggest meaningful customer adoption, but they do not describe
      the same stage of the funnel, so they should not be treated as interchangeable
      customer counts. The strongest inference is that repeat borrowing is likely
      material because loan volume materially exceeds disclosed unique or loan-customer
      counts, yet no public source in the assigned pool closes the loop with cohort,
      renewal, or repeat-frequency disclosure.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-gaps
    title: Durability and concentration remain the key unresolved customer risks
    body: >-
      The weakest part of the public customer record is not acquisition but proof
      of durability and service quality. The official site includes one named
      positive testimonial, which is useful as evidence of a live borrower journey
      but not enough to validate portfolio-wide retention or satisfaction. The
      assigned pool's adverse evidence is a first-person complaint alleging EMI-day
      support failure, misuse of a branded payment form, and inactive escalation
      contacts; that is only one account, but it is directionally relevant because
      it highlights servicing and grievance-redressal risk in a regulated lending
      context. Public disclosures also do not quantify top-customer exposure,
      channel mix, partner concentration, or renewal behavior, so the current
      evidence supports adoption and product breadth more than it supports customer
      quality, stickiness, or concentration resilience.
    claimRefs: [CU013, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Real scale, even if the funnel is messy
    body: >-
      Multiple independent sources converge on KreditBee having facilitated more
      than 60 million loans by 2026, which is enough to treat adoption as real.
      The diligence challenge is reconciling downloads, registered users, and loan-customer
      counts into a comparable funnel rather than proving demand exists at all.
    claimRefs: [CU007, CU009, CU010, CU011, CU013]
  - calloutType: risk
    title: Public durability proof lags the scale narrative
    body: >-
      Public evidence does not disclose churn, renewal, NRR, or customer concentration,
      and the named proof set is thin relative to the headline scale claims. That
      gap matters because repeat borrowing, service quality, and partner/channel
      dependence are central to credit-platform durability.
    claimRefs: [CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - Salaried professionals
        - Individual borrower is buyer, user, and payer
        - Instant personal loans and short-duration liquidity
        - Official site and FinTech Magazine both position this as a core cohort
        - Core acquisition funnel and likely high-frequency repeat-demand segment
        - No public split by income band, geography, or credit-quality cohort
      - - Self-employed borrowers
        - Individual borrower is buyer, user, and payer
        - Personal and business-purpose borrowing
        - FinTech Magazine and external profiles describe self-employed / new-to-credit use
        - Expands reach beyond salaried users and supports underserved-credit thesis
        - No disclosed conversion or loss rates by self-employed segment
      - - Small business / MSME owners
        - Borrower and payer are business owners or operators
        - Business loans and MSME credit
        - Official product menu and external coverage both cite business-loan expansion
        - Broadens TAM and gives KreditBee a land-and-expand path beyond consumer credit
        - No public disclosure of MSME share, repeat behavior, or unit economics
      - - Asset-backed / vehicle borrowers
        - Individual borrower is buyer, user, and payer
        - Two-wheeler finance and loan against property
        - Official site and 2026 press coverage show secured and semi-secured products
        - Diversifies product mix beyond unsecured small-ticket loans
        - No public data on cross-sell, ticket size, or delinquency by product
    notes: >-
      Rows summarize public product-and-segment signals rather than disclosed revenue
      mix; KreditBee does not publish a borrower breakdown by segment, geography,
      or vintage in the assigned evidence pool.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - App downloads
        - 230+ million
        - 2026 article
        - Business Outreach
        - Low
        - Suggests large top-of-funnel reach and app-led acquisition
        - No active-user, approved-loan, or repeat-user conversion rate
      - - Loan customers
        - More than 18 million
        - "2026-04-08"
        - Financial Express
        - Medium
        - Indicates broad borrower penetration
        - Not reconciled to registered users or active borrowers
      - - Registered customers
        - More than 80 million
        - "2026-04-11"
        - Global Banking Monitor
        - Low
        - Shows a wide registration base beyond funded borrowers
        - Registration is not the same as funded or active customer count
      - - Unique loan customers
        - More than 15 million
        - "2026-04-11"
        - Global Banking Monitor
        - Medium
        - Anchors the live borrowing base more tightly than download data
        - Still not a retention or renewal metric
      - - Loans facilitated
        - More than 60 million
        - 2026 sources
        - Financial Express, Global Banking Monitor, Business Outreach
        - High
        - Implies repeat usage is likely material at platform scale
        - No disclosed repeat-borrower rate, cohort curve, or renewal share
    notes: >-
      Adoption data mixes funnel stages; downloads, registrations, loan customers,
      and total loans should not be treated as a single conversion series without
      additional company disclosure.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Raviraj Patil (Mumbai)
        - Consumer borrower
        - Official website testimonial about completed online application and disbursal
        - Production / live-use claimed
        - Positive proof that at least one borrower journey reached disbursal
        - Company-published, undated, and not independently verified
      - - Anonymous EMI-day complainant
        - Existing repayment customer
        - Forum post describing repayment support failure and a fraudulent branded payment form
        - Production / live-use implied by repayment-stage issue
        - Adverse evidence on servicing and grievance escalation quality
        - Single unverified complaint rather than a corroborated pattern
      - - Public aggregate borrower base (no named account)
        - Consumer and small-business borrower cohorts
        - External articles citing loan-customer and loan-volume scale
        - Production / scaled adoption inferred
        - Confirms that public proof is not limited to logo-wall style marketing
        - Not a named reference and not suitable as retention proof
    notes: >-
      Enumeration is partial because the assigned pool contains one named positive
      testimonial and one first-person adverse account, but no broad set of fresh,
      independent customer case studies with disclosed outcomes.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to customer-proof surfaces in the assigned prefetched pool for this
        chapter, which contains one official testimonial, one complaint forum post,
        and aggregate third-party adoption reporting rather than a full customer
        reference set.
    claimRefs: [CU008, CU009, CU010, CU011, CU013, CU015, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence points to an app-led borrower journey with broad top-of-funnel reach, quick onboarding, product expansion, and a weaker servicing-proof loop.
    data:
      items:
        - label: Discover via mobile app
          detail: App-first acquisition replaces branch distribution.
          touchpoints:
            - 230+ million app downloads cited by Business Outreach
            - Reach described across Tier-1, 2, and 3 cities
        - label: Eligibility and KYC
          detail: Borrowers move through online signup and screening.
          touchpoints:
            - Sign-up and credit eligibility check described in FinTech Magazine
            - Salary / employment and bank-account criteria described in public profiles
        - label: Instant personal-loan conversion
          detail: Small-ticket personal credit is the lead product.
          touchpoints:
            - Official site says registration-to-disbursal takes an average of 10 minutes
            - Personal loans are the first product emphasized on the official surface
        - label: Repeat borrowing signal
          detail: Public loan-volume data implies reuse, but not formal retention disclosure.
          touchpoints:
            - 60+ million loans exceed reported unique or loan-customer counts
            - No published renewal, churn, or cohort curve in the assigned pool
        - label: Cross-sell into broader credit
          detail: Product breadth expands the customer lifecycle beyond one loan type.
          touchpoints:
            - Business loans
            - Two-wheeler loans
            - Loan against property
        - label: Servicing and escalation loop
          detail: The weakest public proof point is customer support quality during repayment.
          touchpoints:
            - Official surface points users to app and website repayment flows
            - Complaint forum alleges EMI-day help and escalation failures
    approximationNotes: >-
      This journey map is a qualitative synthesis from public borrower-flow evidence;
      it is not a measured conversion funnel because the sources do not publish a
      common denominator across acquisition, approval, disbursal, and repeat usage.
    claimRefs: [CU002, CU005, CU007, CU012, CU014, CU016]
