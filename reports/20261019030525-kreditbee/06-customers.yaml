  evidenceGaps:
    - type: missing-source
      severity: material
      topic: customer-durability
      missingEvidence: Public NRR, GRR, churn, renewal, repeat-borrower, and cohort-vintage disclosure.
      whyItMatters: These metrics determine whether loan volume is compounding through healthy reuse or masking weak customer quality.
      diligencePath: Request borrower-cohort tables, repeat-loan frequency, delinquency by vintage, and renewal behavior from management or audited filing support.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
