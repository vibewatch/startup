  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Alternative set spans peers, incumbents, and status quo
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a narrow view of competition as only other loan apps. KreditBee
              competes for the same borrowing job against adjacent fintech lenders, direct digital channels from banks
              and NBFCs, and the slower status quo of branch-led or informal borrowing. Markhub's industry summary
              explicitly names LendenClub, CASHe, Kredivo/Olyv, Axio, and Navi Technologies as adjacent competitors, but
              the same source also frames a more structural split between marketplace fintechs and balance-sheet
              lenders. That matters because the buyer's substitution set is shaped not just by brand discovery but by
              who can legally disburse credit, how fast underwriting happens, and whether a borrower trusts the
              servicing and collections experience. KreditBee's competitive arena is therefore broad: direct peers can
              copy app-led discovery, incumbents can lean on cheaper regulated capital and trust, and the status quo can
              still win when borrowers prioritize familiarity over speed.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP012
      - number: '3.2'
        title: Differentiation rests on hybrid capital access and underwriting execution
        blocks:
          - type: paragraph
            body: >-
              KreditBee's clearest public differentiation is architectural rather than cosmetic. Financial Express and
              BankCreds both point to a regulated KrazyBee NBFC plus multiple partner lenders, while Digitap's case
              study adds evidence that onboarding and credit decisioning have been pushed deeper into automated
              underwriting. In practice, that places KreditBee between pure marketplace apps that can originate demand
              without owning much balance-sheet control and incumbent lenders that own capital but may move more slowly
              on acquisition and onboarding. The product menu is now broad enough to reach beyond one instant-loan
              wedge, but the evidence does not show a proprietary feature lead that would by itself lock borrowers in.
              Public pricing signals are also incomplete: KreditBee's own package is partially visible through secondary
              guides and press coverage, yet the assigned pool does not surface a like-for-like pricing grid for named
              peers, so the more durable moat appears to be lender access, underwriting throughput, and capital
              readiness rather than a clearly lowest public price.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP012
              - CP013
              - CP014
              - CP016
