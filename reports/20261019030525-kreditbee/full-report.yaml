              - CM016
      - number: '2.3'
        title: Growth drivers, constraints, and remaining diligence asks
        blocks:
          - type: paragraph
            body: >-
              Growth drivers are visible, but so are the boundaries. Fortune India ties KreditBee's non-metro reach to
              low-cost data, Aadhaar-based eKYC, and broader banking access, while Business Connect frames the post-UPI,
              post-digital-identity environment as the underlying distribution enabler for app-based lending. At the
              same time, public-market relevance here depends on whether reach stays disciplined. Fortune also says the
              RBI's December 2025 Financial Stability Report flagged unsecured loans as more than 53% of retail loan
              slippages, while a 2025 borrower complaint on India Consumer Complaints Forum alleged broken EMI-day
              support and branding misuse. Together with BankCreds' disclosed APR range, the message is that adoption in
              this market is governed as much by compliance, servicing, and pricing trust as by download volume or
              top-line borrower counts.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
