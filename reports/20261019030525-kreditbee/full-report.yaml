            body: |-
              The founder roster is stable across current profiles even though the public
              record is not: Madhusudan E, Karthikeyan Krishnaswamy, and Vivek Veda appear
              repeatedly as the core founding and executive trio, with Madhusudan as CEO,
              Karthikeyan as CTO, and Vivek as CFO. That continuity matters because the same
              team is steering the company's transition from a fast-growing private lender into
              a pre-IPO structure. The latest financing syndicate is broad enough to matter for
