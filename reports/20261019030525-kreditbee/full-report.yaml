        title: Exhibits
        blocks:
          - type: callout
            title: The strongest published sizing evidence is a funnel, not a textbook TAM
            body: >-
              The reviewed public record narrows from a broad national credit gap to KreditBee's own underwritten and
              active-borrower cohorts, which is useful for market framing but still falls short of an independently
              audited SAM/SOM bridge.
