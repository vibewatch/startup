  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              KreditBee's real market boundary is narrower than broad labels such as Indian fintech or consumer finance.
              Across the reviewed sources, the company sits in app-led consumer and SME lending, with the app handling
              acquisition and underwriting UX while regulated NBFC and bank partners supply a meaningful share of
              capital. Product expansion into business loans, two-wheeler finance, and property-backed lending broadens
              wallet share, but the adoption wedge still starts with small-ticket borrowing that branch-led lenders have
              historically served slowly or uneconomically. Public sizing evidence is therefore best treated as a stack
              of lenses rather than a formal TAM model: one tertiary investor note frames a large underserved-credit
              population, while company-reported operating-funnel metrics show how much of that demand KreditBee has
              actually touched. That is useful for boundary-setting, but it is not the same as a defensible public SAM
              or SOM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
              - CM016
