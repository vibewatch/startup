figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      KreditBee's public path runs from a 2016 founding narrative to a 2026 unicorn round, with adverse support noise
      and several disclosure mismatches along the way.
    data:
      items:
        - date: '2016'
          label: Founding narrative begins
          detail: >-
            Multiple 2026 profiles describe the company as founded by Madhusudan E, Karthikeyan Krishnaswamy, and Vivek
            Veda in 2016.
          tone: positive
          claimRefs:
            - CO011
            - CO012
        - date: 2023-01
          label: Extended Series D resets the valuation baseline
          detail: >-
            KnowStartup says the prior major round was a $100 million extended Series D in January 2023 at roughly a
            $700 million to $800 million valuation.
          tone: neutral
          claimRefs:
            - CO003
        - period: FY2023
          label: Profitability appears for the first time
          detail: Financial Express says FY23 was the first year in which KreditBee made profits.
          tone: positive
          claimRefs:
            - CO007
        - date: 2024-03
          label: Public round history becomes inconsistent
          detail: >-
            Financial Express, citing Tracxn, says the last disclosed round in March 2024 was $9.4 million at about a
            $184 million valuation, which conflicts with other funding narratives.
          tone: warning
          claimRefs:
            - CO015
        - date: '2025-08-18'
          label: Borrower-support complaint is posted publicly
          detail: >-
            A forum post alleged a fake EMI payment form, inactive escalation channels, and denied responsibility after
            a payment loss.
          tone: adverse
          claimRefs:
            - CO016
        - period: 2026-Q1
          label: Domicile and merger work start before listing
          detail: >-
            Times of India says the parent entity reverse-flipped from Singapore to India and that the technology and
            NBFC entities were being merged before filing.
          tone: neutral
          claimRefs:
            - CO014
        - date: '2026-04-08'
          label: Series E creates a unicorn valuation
          detail: >-
            Multiple sources align on a $280 million round at a $1.5 billion valuation, with one report splitting it
            between primary and secondary capital.
          tone: positive
          claimRefs:
            - CO003
            - CO004
        - period: 2026-H2 / 2027-Early
          label: IPO target enters the public narrative
          detail: >-
            Current management-guided coverage points to a possible listing by late 2026 or early 2027, subject to board
            and market conditions.
          tone: opportunity
          claimRefs:
            - CO014
