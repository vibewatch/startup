      - number: '2.2'
        title: Buyer segments, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The reviewed evidence points to a market with multiple borrower segments rather than one generic
              personal-loan category. Fortune India describes a high-frequency lending engine anchored in personal
              loans, but with business loans, two-wheeler finance, and loan-against-property layered on top, each with
              different ticket sizes, tenure expectations, and risk signals. Budget ownership is also split: the end
              borrower chooses the product and carries repayment, but the effective supply of credit depends on KrazyBee
              Services or other RBI-registered NBFC partners that actually disburse the loans. That structure matters
              for adoption, because the market opens where digital onboarding, compliant disclosures, and co-lending
              capital lower friction enough for underserved borrowers to prefer formal app-based credit over slower bank
              processes or informal alternatives.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM003
