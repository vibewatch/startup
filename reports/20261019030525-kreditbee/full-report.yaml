              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.3'
        title: Trust, servicing, and metric inconsistency limit moat durability
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence in the assigned pool is about trust, not app growth. Trustpilot reviews and
              a detailed India Consumer Complaints Forum post both describe rude collections, broken support, or
              inactive escalation channels; even if these are anecdotal rather than statistically representative, they
              matter because unsecured retail-credit products are easy to multi-home unless the platform protects
              borrower trust. At the same time, public benchmarking is noisy: Financial Express cites official filings
              with FY25 revenue of Rs 589.7 crore, while Inc42 shows FY25 revenue at Rs 682.1 crore plus a separate
              total-funding estimate. That inconsistency weakens clean peer benchmarking and makes it harder to prove
              that KreditBee's scale is translating into an unusually strong competitive cost position. The result is a
              business that looks stronger than a pure origination app on regulatory alignment and funding access, but
              whose moat could still compress if collections discipline or disclosure quality pushes borrowers back
              toward incumbents.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid structure is the main competitive edge
            body: >-
              KreditBee's most defensible public advantage is not a visibly unique front-end feature but the combination
              of an owned regulated NBFC, multiple partner lenders, and automated underwriting that lets it bridge
              pure-origination apps and slower incumbents.
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP012
          - type: callout
            title: Trust leakage can send borrowers back to incumbents
            body: >-
              The adverse evidence in this pool is mostly about servicing and collections; because unsecured
              digital-credit offers are easy to compare across apps, poor borrower experience can compress competitive
              advantage even if acquisition remains strong.
            calloutType: risk
            claimRefs:
              - CP011
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed pricing
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a hybrid lending model rather than a pure SaaS or marketplace story. A 2023
              external case study says KreditBee monetized through lender commissions, borrower processing fees, and
              spread on loans carried on its own balance sheet; later 2026 coverage still describes the company as
              operating through its RBI-registered NBFC while also working with more than 10 financial institutions
              through co-lending partnerships. That means the revenue engine likely combines origination economics with
              balance-sheet lending economics. What is still missing is the current mix: public sources do not break
              revenue by product, channel, or on-book versus partner-funded loans. Borrower-facing pricing is also only
              partly visible. A third-party guide publishes interest, APR, fee, and penalty ranges, but those are
              lender-dependent public terms, not evidence of realized net yield, take rate, or gross margin.
            claimRefs:
              - CI003
              - CI010
              - CI011
              - CI012
              - CI014
