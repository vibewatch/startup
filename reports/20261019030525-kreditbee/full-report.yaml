  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The strongest public lens narrows from India's broad credit gap to KreditBee's current underwritten and
      active-borrower cohorts.
    data:
      items:
        - label: India working-age adults
          value: 700
          unit: million people
          detail: Broad national population lens cited by Value For Startups.
        - label: Adults with formal-credit history
          value: 150
          unit: million people
          detail: Subset that the same tertiary source says has ever accessed formal credit.
        - label: Credit-eligible but underserved
          value: 550
          unit: million people
          detail: Remainder framed as underserved in the reviewed investor note.
        - label: KreditBee individuals underwritten
          value: 85
          unit: million people
          detail: Fortune India interview-based operating funnel.
        - label: KreditBee customers lent
          value: 18
          unit: million people
          detail: Borrowers that Fortune says have received loans.
        - label: Active monthly borrowers
          value: 5.5
          unit: million people
          detail: Borrowers from whom Fortune says repayments are collected each month.
    approximationNotes: >-
      This is an evidence-backed narrowing lens rather than a formal TAM/SAM/SOM model; the upper layers are national
      credit-gap proxies and the lower layers are company operating cohorts.
    claimRefs:
      - CM003
      - CM010
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning suggests KreditBee sits above pure marketplace apps on regulatory control and above incumbents
      on app-led borrower reach, but trust frictions keep it short of an uncontested upper-right moat.
    data:
      xAxis:
        label: Regulatory control and balance-sheet access
        min: 1
        max: 5
        low: Low
        high: High
        description: Evidence-backed ordinal scoring from assigned public sources; not market-share data
      yAxis:
        label: Borrower reach and acquisition speed
        min: 1
        max: 5
        low: Narrow or slower
        high: Broad or faster
        description: Evidence-backed ordinal scoring from assigned public sources; not a benchmark survey
      points:
        - label: KreditBee
          x: 4
          'y': 4
          detail: Hybrid NBFC plus marketplace with disclosed scale, partner lenders, and app-led origination
        - label: Pure marketplace fintechs
          x: 2
          'y': 4
          detail: Digital acquisition can be strong, but assigned evidence is thinner on owned regulated-capital depth
        - label: Captive-NBFC digital lenders
          x: 5
          'y': 3
          detail: Strong regulatory footing, but assigned pool is thinner on app-scale acquisition signals
        - label: Bank digital channels
          x: 5
          'y': 2
          detail: Trust and capital depth are high, while public evidence here suggests slower fintech-style acquisition
        - label: Offline branch or status quo
          x: 4
          'y': 1
          detail: Familiar and regulated, but slower and more manual for small-ticket digital borrowers
        - label: Unregulated loan apps
          x: 1
          'y': 3
          detail: Fast access can exist, but regulatory legitimacy and borrower protection are weak
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores from 1-5 derived from assigned public sources on regulatory
      footing, capital access, and borrower-acquisition posture; they are not measured market shares, win rates, or
      benchmark-survey outputs.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP011
      - CP012
      - CP015
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the operating path from borrower demand to lending revenue, but not the final bridge into
      disclosed gross profit or free cash flow.
    data:
      nodes:
        - id: demand
          label: Borrower demand
          detail: Personal, business, property, and two-wheeler loan demand through a mobile interface
        - id: underwriting
          label: Digital underwriting and KYC
          detail: Credit assessment and approval determine whether activity turns into funded loans
        - id: funding
          label: Funding route
          detail: RBI-registered NBFC balance sheet plus 10+ co-lending or partner institutions
        - id: disbursement
          label: Disbursement and servicing
          detail: 60M+ loans disbursed at platform scale; repayment support quality can affect loss outcomes
        - id: monetization
          label: Revenue capture
          detail: Processing fees, lender commissions, and interest spread are the visible public mechanisms
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: >-
            Public sources do not disclose cost of funds, credit losses, servicing cost, or cash runway well enough to
            complete the bridge
      edges:
        - from: demand
          to: underwriting
          label: approved applications
        - from: underwriting
          to: funding
          label: routed to NBFC or partner lender
        - from: funding
          to: disbursement
          label: capital deployed
        - from: disbursement
          to: monetization
          label: fees, spread, and servicing economics
        - from: monetization
          to: gross-profit
          label: less funding, credit, servicing, and compliance costs
    approximationNotes: Qualitative process map only; the public evidence does not support numeric gross-profit or free-cash-flow steps.
    claimRefs:
      - CI003
      - CI005
      - CI010
      - CI012
      - CI013
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered stack spanning borrower acquisition, automated verification, regulated
      origination, and repayment/compliance servicing.
    data:
      layers:
        - label: Borrower-facing product surface
          detail: App- and web-led interface for loan discovery, application, and document upload.
          items:
            - Personal loans
            - Business loans
            - Loans against property
            - Two-wheeler finance
            - Credit-score / UPI-linked surfaces
        - label: Digital onboarding and verification
          detail: Application intake, identity capture, employment/income details, and automated checks.
          modules:
            - Electronic document upload
            - Identity verification
            - Automated verification systems
        - label: Decisioning and workflow control
          detail: AI / data-analytics-assisted application processing and underwriting workflow.
          modules:
            - Data analytics
            - Loan processing
            - Approval workflow
            - Offer generation
        - label: Regulated lending and funding layer
          detail: KrazyBee Services plus co-lending and financial-institution partners.
          modules:
            - RBI-registered NBFC
            - 10+ financial institutions
            - Balance-sheet support
        - label: Servicing, reconciliation, and compliance
          detail: Repayment schedules, EMI calendars, balances, support handling, and disclosure reporting.
          outputs:
            - Loan status
            - Disbursement and repayment schedules
            - EMI calendars
            - Outstanding balances
            - Complaint / escalation workflow
        - label: Capital and listing-readiness overlay
          detail: Balance-sheet strengthening and entity-combination work tied to IPO preparation.
          outputs:
            - Lending-book capacity
            - Entity merger readiness
            - IPO preparation
    approximationNotes: This is an external reconstruction from assigned public evidence, not a first-party system diagram.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to an app-led borrower journey with broad top-of-funnel reach, quick onboarding, product
      expansion, and a weaker servicing-proof loop.
    data:
      items:
        - label: Discover via mobile app
          detail: App-first acquisition replaces branch distribution.
          touchpoints:
            - 230+ million app downloads cited by Business Outreach
            - Reach described across Tier-1, 2, and 3 cities
        - label: Eligibility and KYC
          detail: Borrowers move through online signup and screening.
          touchpoints:
            - Sign-up and credit eligibility check described in FinTech Magazine
            - Salary / employment and bank-account criteria described in public profiles
        - label: Instant personal-loan conversion
          detail: Small-ticket personal credit is the lead product.
          touchpoints:
            - Official site says registration-to-disbursal takes an average of 10 minutes
            - Personal loans are the first product emphasized on the official surface
        - label: Repeat borrowing signal
          detail: Public loan-volume data implies reuse, but not formal retention disclosure.
          touchpoints:
            - 60+ million loans exceed reported unique or loan-customer counts
            - No published renewal, churn, or cohort curve in the assigned pool
        - label: Cross-sell into broader credit
          detail: Product breadth expands the customer lifecycle beyond one loan type.
          touchpoints:
            - Business loans
            - Two-wheeler loans
            - Loan against property
        - label: Servicing and escalation loop
          detail: The weakest public proof point is customer support quality during repayment.
          touchpoints:
            - Official surface points users to app and website repayment flows
            - Complaint forum alleges EMI-day help and escalation failures
    approximationNotes: >-
      This journey map is a qualitative synthesis from public borrower-flow evidence; it is not a measured conversion
      funnel because the sources do not publish a common denominator across acquisition, approval, disbursal, and repeat
      usage.
    claimRefs:
      - CU002
      - CU005
      - CU007
      - CU012
      - CU014
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence keeps regulatory/disclosure dependence and servicing controls in the highest-risk zone, with
      partner and model dependencies still material.
    data:
      columns:
        - label: Likelihood
          note: 1 low to 3 high based on current public evidence.
        - label: Residual severity
          note: Post-mitigation severity based on currently visible controls.
        - label: Mitigation maturity
          note: Higher is better; low maturity means public mitigations are thin or unverified.
      rows:
        - label: Regulatory / disclosure dependence
          note: RBI-linked architecture plus pre-IPO reporting burden.
          values:
            - label: High
              score: 3
              tone: high
              note: Partner-lender compliance and public-metric reconciliation both remain live risks.
            - label: High
              score: 3
              tone: high
              note: A disclosure failure would hit both underwriting confidence and IPO readiness.
            - label: Medium
              score: 2
              tone: medium
              note: Secondary evidence shows frameworks, but direct regulator and audit evidence are still needed.
        - label: Servicing / fraud controls
          note: Complaint-led signal, not proof of systemic failure.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: The assigned pool shows at least one EMI-day failure narrative and misused branding path.
            - label: High
              score: 3
              tone: high
              note: Complaint and fraud-control slippage can damage collections, trust, and regulator posture.
            - label: Low
              score: 1
              tone: low
              note: Public evidence of response SLAs or incident-control metrics is thin.
        - label: Funding / partner execution
          note: Scale depends on capital, lender, and data-infrastructure partners.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: The platform already has multiple partners, but their concentration is undisclosed.
            - label: High
              score: 3
              tone: high
              note: Funding or partner disruption would affect growth and lending-book resilience directly.
            - label: Medium
              score: 2
              tone: medium
              note: Fresh capital and partner breadth help, but concentration and vintage performance remain unverified.
        - label: Portfolio / credit quality
          note: Public scale and profit data do not disclose vintage losses or delinquency.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: Large customer and loan volumes increase exposure to underwriting drift as the book expands.
            - label: High
              score: 3
              tone: high
              note: Credit deterioration would pressure capital needs, profitability, and IPO readiness.
            - label: Low
              score: 1
              tone: low
              note: No assigned source provides vintage-loss or delinquency controls.
        - label: Product / control complexity
          note: Expansion beyond unsecured personal loans adds distinct operating demands.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: The broader product suite is already reported in current sources.
            - label: Medium
              score: 2
              tone: medium
              note: Complexity is material but not shown as a realized failure in the assigned pool.
            - label: Medium
              score: 2
              tone: medium
              note: Product breadth may diversify exposure while requiring additional controls.
        - label: AI / model execution
          note: Capital is earmarked for AI-enabled risk assessment and technology.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: Model deployment is an active execution priority rather than a hypothetical roadmap item.
            - label: Medium
              score: 2
              tone: medium
              note: Underperforming models could weaken underwriting or borrower outcomes.
            - label: Low
              score: 1
              tone: low
              note: Independent model-governance and override evidence is not public in the assigned pool.
    approximationNotes: This heatmap is a qualitative synthesis from the assigned public-source pool, not a statistical loss model.
    claimRefs:
      - CR004
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays price-sensitive because operating proof and IPO intent are real, but disclosure and
      downside-risk gaps remain unresolved.
    data:
      nodes:
        - id: scale-proof
          label: Scale and profitability proof
          note: >-
            Public sources report profitability, large loan volumes, and sizable AUM/disbursal metrics, though not from
            one reconciled operating base.
        - id: private-mark
          label: April 2026 round set the mark
          note: The latest disclosed price is a $280 million Series E at a $1.5 billion post-money valuation.
        - id: ipo-path
          label: IPO path is active
          note: >-
            Management and follow-on coverage frame this as the last private round before listing, subject to merger and
            approval steps.
        - id: disclosure-gap
          label: Key valuation inputs are still missing
          note: >-
            Public evidence does not disclose the preference stack, audited FY26 combineds, or a reconciled historical
            valuation bridge.
        - id: downside-signal
          label: Downside signals still matter
          note: Support/control complaints and general multiple-reset risk argue against paying up without more diligence.
        - id: recommendation
          label: Recommendation = research-more
          note: Wait for stronger diligence evidence or a more investor-friendly entry before moving positive.
      edges:
        - from: scale-proof
          to: private-mark
        - from: private-mark
          to: ipo-path
        - from: ipo-path
          to: disclosure-gap
        - from: disclosure-gap
          to: downside-signal
        - from: downside-signal
          to: recommendation
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
