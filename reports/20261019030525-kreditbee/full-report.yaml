      - number: '4.2'
        title: Public traction, profitability, and disclosure conflicts
        blocks:
          - type: paragraph
            body: >-
              KreditBee's latest financing round at least confirms that external investors were willing to capitalize a
              scaled lender rather than an early experiment. Multiple 2026 sources converge on roughly $1.5 billion of
              assets under management and more than 60 million loans disbursed, and Financial Express cites MCA filings
              showing FY25 net profit of Rs 237 crore. That is the strongest public sign that the model can generate
              earnings at scale. The harder problem is top-line comparability. Financial Express reports FY25 revenue
              from operations of Rs 589.7 crore, Inc42 lists FY25 revenue at Rs 682.1 crore+, and Multiples records $29
              million of latest revenue while explicitly noting that its round-side figure may reflect run-rate revenue
              or reported LTM revenue. Those figures may be using different entity scopes or definitions, but the public
              record does not reconcile them well enough to anchor valuation on one clean revenue multiple.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI009
              - CI012
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The April 2026 Series E matters less as a historical milestone than as a clue to forward capital needs.
              Global Banking Monitor says the money is primarily for strengthening the lending book and balance sheet
              ahead of IPO, while other coverage adds market expansion and AI investment. That is consistent with a
              lender whose growth still depends on capital access, underwriting capacity, and servicing discipline, not
              just software distribution. Because the business uses an NBFC structure and co-lending partners, its
              growth path is sensitive to cost of funds, warehouse or debt availability, and credit performance, yet
              none of the reviewed public sources disclose current cash on hand, burn, runway, debt maturities, or
              product-level delinquency vintages. A borrower complaint about inactive escalation channels and fraud
              exposure during EMI repayment is only anecdotal, but it is still a useful adverse signal that servicing
              controls can become part of the credit-cost story when the platform scales.
            claimRefs:
              - CI002
              - CI003
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive on scale and profitability but still incomplete on
              underwriting quality. Public evidence supports that KreditBee has a large loan platform, positive reported
              earnings, and enough investor support to raise a large pre-IPO round at unicorn valuation. What it does
              not support is a reliable view on revenue quality, margin durability, or current liquidity. The missing
              bridge from disbursement activity to net revenue, gross profit, and free cash generation is still too
              large. Investors should treat list pricing, case-study estimates, and round-side revenue shorthand as
              context rather than as underwritten financial inputs, and should demand audited FY26 statements, current
              cash and borrowing capacity, delinquency/vintage tables, and product-level yield and cost disclosures
              before sizing downside or underwriting IPO readiness.
            claimRefs:
              - CI001
              - CI007
              - CI012
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability signal is stronger than revenue-quality disclosure
            body: >-
              Reported FY25 net profit suggests operating leverage is possible, but conflicting FY25 revenue baselines
              still make valuation multiples and underwriting assumptions unstable.
            calloutType: insight
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI015
          - type: callout
            title: Capital access is still part of the product
            body: >-
              KreditBee's balance-sheet lending and co-lending model means continued growth depends on external capital,
              cost of funds, and servicing discipline; public cash and runway disclosure is still missing.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product surface and customer workflow
        blocks:
          - type: paragraph
            body: |-
              KreditBee's public product surface looks materially broader than a single instant-loan
              app. Multiple independent sources describe a mobile-first digital lending platform that
              now spans unsecured personal loans, business loans, property-backed loans, and
              two-wheeler financing, with some sources also referencing credit-score monitoring and
              UPI-linked features. The user-facing workflow is consistently described as app- or
              web-led, with digital document upload, automated verification, and direct transfer of
              approved funds into the borrower's bank account. That combination suggests the product
              is not just a lead-generation layer: it owns the borrower journey from discovery and
              application through approval, disbursal, and repayment servicing, even when the
              regulated lending balance sheet sits behind the interface.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
