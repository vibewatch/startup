chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and reported scale
        blocks:
          - type: paragraph
            body: |-
              Current secondary coverage consistently describes KreditBee as a Bengaluru-based
              digital lending platform focused on consumer and small-business credit through a
              mobile app, with adjacent products such as loans against property, two-wheeler
              loans, credit-report features, and UPI-linked services. The operating structure
              is also broadly consistent across sources: the platform lends through
              RBI-registered NBFC KrazyBee Services Limited and supplements origination with
              co-lending relationships across more than ten financial institutions. Scale
              claims are directionally strong but not perfectly reconciled. Multiple 2026
              reports agree on more than 60 million loans facilitated and about $1.5 billion
              of AUM by March 2026, while customer counts diverge between 15 million, 18
              million, and 80 million-plus depending on whether the source is measuring unique
              borrowers or registered accounts. Headcount is weaker still: the assigned pool
              only surfaced a vendor-style directory estimate, so the chapter keeps workforce
              size as an explicit diligence gap rather than treating it as settled.
