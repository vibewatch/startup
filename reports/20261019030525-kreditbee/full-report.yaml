      - number: '1.3'
        title: Funding path, IPO preparation, and disclosure tensions
        blocks:
          - type: paragraph
            body: |-
              The strongest confirmed milestone is the April 2026 Series E: multiple sources
              align on a $280 million round at a $1.5 billion valuation, and one detailed
              write-up adds that the capital split was roughly $220 million primary and $60
              million secondary. The same cluster of reports says KreditBee has reverse-flipped
              its parent entity from Singapore to India and is merging the technology and NBFC
              entities before a possible late-2026 or early-2027 IPO filing. Where the record
              gets messy is in the baseline numbers investors would normally use as ground
              truth. Management-reported FY2025 revenue and profit are far above filing-based
              FY25 revenue-from-operations and net-profit figures reported elsewhere, lifetime
              capital raised ranges from roughly $540 million to $642.65 million-plus, and the
              founding year is reported as both 2016 and 2018. A 2025 borrower complaint post
              also flags support-channel failures and scam exposure, which is too thin to prove
              a systematic issue but strong enough to keep customer-protection execution on the
              watchlist.
