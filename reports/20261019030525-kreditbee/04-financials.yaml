  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["FY25 revenue from operations", "Rs 589.7 crore (Financial Express) vs Rs 682.1 crore+ (Inc42)", "Conflicting", "Top-line baseline is not reconciled, so revenue multiple work is fragile", "Audited FY25 and FY26 consolidated revenue bridge by entity and metric definition"]
      - ["FY25 net profit", "Rs 237 crore", "Medium", "Suggests reported profitability rather than pure growth-at-all-costs", "PAT-to-cash-flow bridge and one-offs"]
      - ["AUM as of Mar 2026", "$1.5 billion", "High", "Shows scale but also balance-sheet intensity and funding needs", "On-book versus off-book AUM split and funding stack"]
      - ["Latest round-side revenue proxy", "$29 million with Multiples caveat that the figure may be run-rate revenue or reported LTM", "Low", "Useful for market framing, not audited underwriting", "Definition of 'revenue' used in the April 2026 raise deck"]
      - ["Borrower pricing proxy", "12%-28.5% interest; 17%-50% APR; fees and penalties also disclosed", "Low", "Puts an upper bound on customer economics, not on realized margin", "Weighted-average APR, fee yield, and collection effectiveness"]
      - ["CAC / payback / retention / vintage losses", null, "Unavailable", "Without these metrics, sales efficiency and credit durability cannot be underwritten", "Cohort CAC, payback, repeat-borrow share, delinquency, charge-off, and recovery data"]
    notes: "Unavailable values are genuinely undisclosed in the reviewed public sources, not zero."
    claimRefs: ["CI004", "CI006", "CI007", "CI008", "CI009", "CI012", "CI014", "CI015"]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the operating path from borrower demand to lending revenue, but not
      the final bridge into disclosed gross profit or free cash flow.
    data:
      nodes:
        - id: demand
          label: Borrower demand
          detail: Personal, business, property, and two-wheeler loan demand through a mobile interface
        - id: underwriting
          label: Digital underwriting and KYC
          detail: Credit assessment and approval determine whether activity turns into funded loans
        - id: funding
          label: Funding route
          detail: RBI-registered NBFC balance sheet plus 10+ co-lending or partner institutions
        - id: disbursement
          label: Disbursement and servicing
          detail: 60M+ loans disbursed at platform scale; repayment support quality can affect loss outcomes
        - id: monetization
          label: Revenue capture
          detail: Processing fees, lender commissions, and interest spread are the visible public mechanisms
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: Public sources do not disclose cost of funds, credit losses, servicing cost, or cash runway well enough to complete the bridge
      edges:
        - from: demand
          to: underwriting
          label: approved applications
        - from: underwriting
          to: funding
          label: routed to NBFC or partner lender
        - from: funding
          to: disbursement
          label: capital deployed
        - from: disbursement
          to: monetization
          label: fees, spread, and servicing economics
        - from: monetization
          to: gross-profit
          label: less funding, credit, servicing, and compliance costs
    approximationNotes: "Qualitative process map only; the public evidence does not support numeric gross-profit or free-cash-flow steps."
    claimRefs: ["CI003", "CI005", "CI010", "CI012", "CI013", "CI014"]
callouts:
  - calloutType: insight
    title: Profitability signal is stronger than revenue-quality disclosure
    body: >-
      Reported FY25 net profit suggests operating leverage is possible, but conflicting FY25 revenue
      baselines still make valuation multiples and underwriting assumptions unstable.
    claimRefs: ["CI006", "CI007", "CI008", "CI015"]
  - calloutType: risk
    title: Capital access is still part of the product
    body: >-
      KreditBee's balance-sheet lending and co-lending model means continued growth depends on
      external capital, cost of funds, and servicing discipline; public cash and runway disclosure
      is still missing.
    claimRefs: ["CI002", "CI003", "CI013", "CI014"]
