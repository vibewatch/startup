company:
  name: KreditBee
chapter:
  number: 4
  title: Financials
  summary: >-
    KreditBee's public record supports real scale, reported profitability, and fresh growth capital,
    but it still does not support a clean underwriting model for revenue quality or runway. The key
    blocker is not lack of growth signals; it is conflicting revenue baselines, thin disclosure on
    realized unit economics, and no public cash or funding-stack bridge.
sections:
  - id: revenue-model-pricing
    title: Revenue model and disclosed pricing
    body: >-
      The public evidence supports a hybrid lending model rather than a pure SaaS or marketplace
      story. A 2023 external case study says KreditBee monetized through lender commissions,
      borrower processing fees, and spread on loans carried on its own balance sheet; later 2026
      coverage still describes the company as operating through its RBI-registered NBFC while also
      working with more than 10 financial institutions through co-lending partnerships. That means
      the revenue engine likely combines origination economics with balance-sheet lending economics.
      What is still missing is the current mix: public sources do not break revenue by product,
      channel, or on-book versus partner-funded loans. Borrower-facing pricing is also only partly
      visible. A third-party guide publishes interest, APR, fee, and penalty ranges, but those are
      lender-dependent public terms, not evidence of realized net yield, take rate, or gross margin.
    claimRefs: ["CI003", "CI010", "CI011", "CI012", "CI014"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: public-scale-profitability
    title: Public traction, profitability, and disclosure conflicts
    body: >-
      KreditBee's latest financing round at least confirms that external investors were willing to
      capitalize a scaled lender rather than an early experiment. Multiple 2026 sources converge on
      roughly $1.5 billion of assets under management and more than 60 million loans disbursed, and
      Financial Express cites MCA filings showing FY25 net profit of Rs 237 crore. That is the
      strongest public sign that the model can generate earnings at scale. The harder problem is
      top-line comparability. Financial Express reports FY25 revenue from operations of Rs 589.7
      crore, Inc42 lists FY25 revenue at Rs 682.1 crore+, and Multiples records $29 million of
      latest revenue while explicitly noting that its round-side figure may reflect run-rate revenue
      or reported LTM revenue. Those figures may be using different entity scopes or definitions,
      but the public record does not reconcile them well enough to anchor valuation on one clean
      revenue multiple.
    claimRefs: ["CI001", "CI004", "CI005", "CI006", "CI007", "CI008", "CI009", "CI015"]
    tableRefs: ["TI003"]
  - id: capital-adequacy-financing-dependency
    title: Capital adequacy and financing dependency
    body: >-
      The April 2026 Series E matters less as a historical milestone than as a clue to forward
      capital needs. Global Banking Monitor says the money is primarily for strengthening the
      lending book and balance sheet ahead of IPO, while other coverage adds market expansion and AI
      investment. That is consistent with a lender whose growth still depends on capital access,
      underwriting capacity, and servicing discipline, not just software distribution. Because the
      business uses an NBFC structure and co-lending partners, its growth path is sensitive to cost
      of funds, warehouse or debt availability, and credit performance, yet none of the reviewed
      public sources disclose current cash on hand, burn, runway, debt maturities, or product-level
      delinquency vintages. A borrower complaint about inactive escalation channels and fraud
      exposure during EMI repayment is only anecdotal, but it is still a useful adverse signal that
      servicing controls can become part of the credit-cost story when the platform scales.
    claimRefs: ["CI002", "CI003", "CI013", "CI014"]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is directionally positive on scale and profitability but still
      incomplete on underwriting quality. Public evidence supports that KreditBee has a large loan
      platform, positive reported earnings, and enough investor support to raise a large pre-IPO
      round at unicorn valuation. What it does not support is a reliable view on revenue quality,
      margin durability, or current liquidity. The missing bridge from disbursement activity to net
      revenue, gross profit, and free cash generation is still too large. Investors should treat
      list pricing, case-study estimates, and round-side revenue shorthand as context rather than
      as underwritten financial inputs, and should demand audited FY26 statements, current cash and
      borrowing capacity, delinquency/vintage tables, and product-level yield and cost disclosures
      before sizing downside or underwriting IPO readiness.
    claimRefs: ["CI001", "CI007", "CI012", "CI014", "CI015"]
