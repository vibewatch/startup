  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: fy25-revenue
      missingEvidence: Audited FY25 and FY26 consolidated statements with a bridge between statutory revenue, group revenue, and any run-rate or LTM revenue used in fundraising materials.
      whyItMatters: Without a reconciled top-line definition, valuation multiples and margin comparisons are unstable.
      diligencePath: Obtain the latest audited financial statements and management reporting bridge used in the Series E process.
      relatedQuestionRefs: ["QI001", "QI004", "QI008"]
      relatedTableRefs: ["TI003"]
    - type: private-evidence-only
      severity: blocking
      topic: runway
      missingEvidence: Current cash balance, unrestricted liquidity, debt or warehouse facilities, monthly burn or cash generation, and contractual maturities.
      whyItMatters: Capital adequacy cannot be underwritten for a lender without knowing available liquidity and refinancing needs.
      diligencePath: Request treasury pack, lender facility schedule, debt covenants, and monthly cash-flow forecast.
      relatedQuestionRefs: ["QI006", "QI008"]
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: Cohort CAC, payback, repeat-borrow behavior, channel mix, and retention by customer segment.
      whyItMatters: Public loan-volume growth does not show whether acquisition remains efficient or whether repeat economics are deteriorating.
      diligencePath: Request channel-by-channel acquisition and repeat-borrow cohort tables from management.
      relatedQuestionRefs: ["QI003"]
      relatedTableRefs: ["TI003"]
