      - number: '5.3'
        title: 信任、合规与技术风险姿态
        blocks:
          - type: paragraph
            body: >-
              最重要的风险是快速信贷流程能否在服务端保持受控。借款人披露、还款处理、投诉解决和数据报告都是核心控制点。资料池中最强的反向证据是一项投诉，描述 EMI
              日客服失灵、升级渠道不活跃和品牌支付指令被滥用；这不足以证明系统性失败，却足以把服务和防诈骗列为尽调事项。指定证据也没有独立验证重大新产品路线图、公开状态监控或详细安全架构。
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: KreditBee 看起来像一套规模化信贷运营系统
            body: 最一致的证据围绕贷款产品广度、数字化借款流程和与受监管放贷通道的紧密耦合。
            calloutType: insight
            claimRefs:
