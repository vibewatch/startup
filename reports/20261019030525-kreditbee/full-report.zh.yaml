      - number: '1.3'
        title: 融资路径、IPO 准备与披露张力
        blocks:
          - type: paragraph
            body: >-
              已确认度最高的里程碑是 2026 年 4 月 E 轮：多来源一致指向 $280 million、投后估值 $1.5 billion；一篇详细报道称其中约 $220 million 为新增股本、$60
              million 为老股转让。报道还称母公司已从新加坡反向迁册至印度，并将在可能于 2026 年末或 2027 年初提交 IPO 申请前合并技术实体和 NBFC 实体。管理层 FY2025
              收入和利润远高于其他来源按申报文件计算的 FY25 数字；累计融资额约为 $540 million 至 $642.65 million-plus，创立年份则同时被报道为 2016 年和 2018 年。2025
              年借款人投诉还指出客服渠道失灵和诈骗风险，虽不足以证明系统性问题，却足以让客户保护执行留在观察清单上。
