        title: 情景、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景区间应保持方向性，不要假装精确。乐观情景成立的前提是：经审计 FY26 合并报表验证近期盈利和 AUM 叙事，技术/NBFC 合并按计划完成，公司在没有信贷或服务意外的情况下达到 IPO
              申报准备度。基准情景更窄：现有证据足以让 KreditBee
              留在可投资名单，却不足以证明按上一轮私募估值买入很划算。悲观情景是退出延迟或折价——公开投资人发现披露缺口未解、经济性弱于报道，或借款人支持与控制问题反复出现。最终尽调仍需要融资文件、经审计 FY26
              合并财务数据、对账后的融资历史，以及更充分的服务控制证据，之后才有理由给出正面建议。
            claimRefs:
              - CV001
