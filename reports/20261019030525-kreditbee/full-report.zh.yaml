            title: 公开持久性证据落后于规模主张叙事
            body: 公开证据没有披露流失、续贷、NRR 或客户集中度；相对于公开的规模主张，具名证明样本也很薄。这一缺口关系到重复借款、服务质量和伙伴或渠道依赖。
            calloutType: risk
