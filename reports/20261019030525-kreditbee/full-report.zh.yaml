  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 替代集合覆盖同业、传统机构和现状方案
        blocks:
          - type: paragraph
            body: >-
              指定证据不支持把竞争狭义理解为其他贷款应用。KreditBee 同时面对相邻金融科技放贷方、银行和 NBFC 的数字渠道，以及分支机构驱动或非正规借款。Markhub 点名
              LendenClub、CASHe、Kredivo/Olyv、Axio 和 Navi
              Technologies；买方替代集合还取决于谁能合法放贷、承保速度以及借款人是否信任服务和催收。直接同业可复制应用获客，传统机构可依靠更便宜的受监管资本和信任，现状方案也可能因熟悉感胜出。
