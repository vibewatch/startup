      - number: '3.3'
        title: 信任、服务和指标不一致限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最强的反向证据针对信任，而不是应用增长。Trustpilot 和 India Consumer Complaints Forum
              描述粗暴催收、客服失灵或升级渠道不活跃；即使只是轶闻，也说明无担保零售信贷容易被多平台使用。Financial Express 引用 FY25 收入 Rs 589.7 crore，Inc42 则给出 Rs
              682.1 crore 并另列融资估算。这削弱同业比较，也使人难以证明规模已转化为异常强的竞争成本位置；公司比纯贷款发起应用更能对齐监管、获取融资，但护城河仍可能收窄。
