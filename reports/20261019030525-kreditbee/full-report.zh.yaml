      - number: '6.2'
        title: 采用证据真实存在，但公开指标使用不同分母
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的规模已经足够大，真正的问题是公开数字能否对账。外部报道提到 230+ million 次应用下载、超过 18 million 名贷款客户、超过 15 million 名独立贷款客户、超过
              80 million 名注册客户，以及促成超过 60 million
              笔贷款。这些指标对应漏斗的不同阶段，不能互换成客户数；但贷款量明显高于已披露的独立客户数或贷款客户数，说明重复借款可能占据重要位置。不过，指定资料池中没有公开来源披露客户队列、续贷或重复频率数据，这条链仍未闭合。
