        title: 持久性与集中度仍是未解决的客户风险
        blocks:
          - type: paragraph
            body: >-
              公开客户记录最弱的部分是持久性和服务质量。官方网站的一条正面评价不足以验证全组合留存或满意度；指定资料池中的反向证据是一条投诉，称 EMI
              日客服失灵、品牌支付表单被滥用、升级联系人不活跃。公开披露也没有量化大客户敞口、渠道组合、合作伙伴集中度或续贷行为，因此证据更支持采用和产品广度，而非客户质量、粘性或集中度韧性。
