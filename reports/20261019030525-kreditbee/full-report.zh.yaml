              KreditBee 最新一轮融资至少证明，外部投资者愿意为一家已有规模的放贷方注资，而不是为早期试验项目买单。多份 2026 年来源指向约 $1.5 billion 管理资产和超过 60 million
              笔已放款；Financial Express 引用 MCA 文件称 FY25 净利润 Rs 237 crore。收入可比性更难：Financial Express 报告 FY25 经营收入 Rs 589.7
              crore，Inc42 列 Rs 682.1 crore+，Multiples 记录最新收入 $29 million，并称其可能是年化或 LTM 收入。公开记录不足以用单一收入倍数锚定估值。
