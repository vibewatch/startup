  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最清晰的估值事实是 2026 年 4 月 E 轮：多家媒体称 $280 million、投后估值 $1.5
              billion，且同时包含新增股本和老股转让。这证明投资人有兴趣并提供当前私募定价，却不能单独证明价格有吸引力。指定来源没有披露清算优先权、下行保护或经审计 FY26
              合并报表。在已披露估值下，审慎结论是继续研究，等待对齐运营基线和融资历史或改善入场条款。
