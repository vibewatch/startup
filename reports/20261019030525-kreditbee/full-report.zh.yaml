            title: 信任流失可能把借款人推回传统机构
            body: 资料池中的反向证据主要指向服务和催收；无担保数字信贷容易跨应用比较，糟糕体验会压缩竞争优势。
            calloutType: risk
            claimRefs:
              - CP011
