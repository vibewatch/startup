        - 据报道的盈利能力、放款量和 AUM，说明其运营证明比早期金融科技叙事所暗示的更充分。
        - 经审计的 FY26 合并报表和信贷批次数据需要确认这种证明具有持久性。
      - - 投资逻辑
        - 官方产品广度以及合作伙伴 / NBFC 结构，可以支撑交叉销售和更广泛的有抵押放贷变现。
        - 公开披露产品层面的利润率、损失率和合作方经济状况，会强化这一论点。
      - - 反向逻辑
        - 公开客户、收入和估值参照点无法足够清晰地对账，不足以开展精确的倍数分析。
        - 董事会可用的融资桥接和经审计报表会降低不确定性折价。
      - - 反向逻辑
        - 随着公司接近公开市场，服务 / 控制方面的担忧以及未披露的投资者保护条款，影响可能更大。
        - 关于申诉控制和融资条款的独立证据会缓解这一担忧。
    notes: 论点仅限于指定公开证据所支持的范围；本表不假设未发布的队列、损失或条款清单数据。
    claimRefs:
