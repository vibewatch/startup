      - number: '5.2'
        title: 运营架构与差异化
        blocks:
          - type: paragraph
            body: >-
              公开记录指向围绕数字发起、自动评分、受监管放贷通道和还款运营搭建的系统。Financial Express 和 Global Banking Monitor 都将应用与 RBI 注册 NBFC KrazyBee
              Services 关联；Financial Express 还称 KreditBee 通过联合放贷与十多家金融机构合作。第三方资料强调高吞吐、多产品信贷流程、对账以及贷款状态、放款、还款和 EMI 日历字段；在
              RBI 2025 年数字借贷规则下，这些都是重要的运营数据面。可见护城河更多在规模化承保与服务编排，而非公开开发者工具或专有模型。
