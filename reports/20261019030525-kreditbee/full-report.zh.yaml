  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模判断
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的真实市场边界窄于“印度金融科技”或“消费金融”。公司处于应用驱动的消费者和 SME 借贷领域：应用负责获客和承保体验，受监管 NBFC
              及银行伙伴提供重要资本。商业贷款、两轮车融资和房产抵押贷款扩大了钱包份额，但切入点仍是小额借款。公开规模证据更适合作为多组观察视角，而非正式 TAM
              模型：第三方资料描绘服务不足的信贷人群，公司漏斗指标则显示实际触达需求。这有助于划界，但不能替代有说服力的公开 SAM 或 SOM。
