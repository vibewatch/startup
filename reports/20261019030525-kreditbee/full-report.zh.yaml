            body: >-
              当前资料反复列出 Madhusudan E、Karthikeyan Krishnaswamy 和 Vivek Veda，分别担任 CEO、CTO 和
              CFO。团队连续性很重要，因为其正推动公司从高速增长的私人放贷机构转向 IPO 前架构。2026 年 4 月报道点名 Motilal Oswal Alternates、Hornbill Capital、MUFG
