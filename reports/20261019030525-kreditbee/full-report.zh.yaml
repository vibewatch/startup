    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与已披露规模
        blocks:
          - type: paragraph
            body: >-
              当前二手资料一致将 KreditBee 描述为总部位于 Bengaluru、通过移动应用开展消费者和小企业信贷的数字借贷平台，产品还包括房产抵押贷款、两轮车贷款、信用报告功能和 UPI 关联服务。平台通过 RBI
              注册 NBFC KrazyBee Services Limited 放贷，并与十多家金融机构联合放贷。规模主张方向一致但尚未完全对账：多份 2026 年报告称截至 2026 年 3 月撮合贷款超过 60
              million 笔、管理资产约 $1.5 billion；客户数则因统计独立借款人还是注册账户而出现 15 million、18 million 和 80
              million-plus。员工数证据更弱，资料池仅找到供应商式目录估算，因此本章将其列为明确尽调缺口。
