              财务结论对规模和盈利持正面看法，但承保质量仍不完整。公开证据支持大型贷款平台、已报告盈利和独角兽估值融资，却不足以判断收入质量、利润率持久性或流动性。投资人应把目录定价、案例估算和轮融资收入简写视为背景，并要求经审计
              FY26 报表、现金及借款能力、逾期/vintage 表和产品级收益率与成本披露。
