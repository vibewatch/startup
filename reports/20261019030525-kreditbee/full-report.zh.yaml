      - number: '2.3'
        title: 增长驱动、约束与待完成尽调
        blocks:
          - type: paragraph
            body: >-
              Fortune India 将 KreditBee 的非大都会覆盖归因于低成本数据、Aadhaar eKYC 和更广泛的银行服务；Business Connect 将 UPI
              和数字身份环境视为应用借贷的分发基础。RBI 2025 年 12 月报告称无担保贷款占零售贷款逾期损失超过 53%；2025 年借款人投诉还称 EMI 日客服失灵、品牌被滥用。结合 BankCreds 披露的
              APR 区间，市场采用同样受合规、服务和定价信任支配。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 最有力的公开规模证据是漏斗，而不是教科书式 TAM
            body: 公开记录从全国信贷缺口收窄到 KreditBee 自身的已承保和活跃借款人群体，这有助于市场定位，但仍不足以构成独立审计的 SAM/SOM 桥接。
            calloutType: insight
            claimRefs:
              - CM003
              - CM010
          - type: callout
            title: 分发规模仍取决于对受监管资本和服务的信任
            body: 应用可以降低贷款发起摩擦，但持久的市场渗透仍取决于透明定价、合规 NBFC 合作和可靠的借款人支持。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM013
