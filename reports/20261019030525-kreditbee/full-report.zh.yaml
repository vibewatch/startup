      - number: '2.2'
        title: 买方分群、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Fortune India 将个人贷款描述为高频借贷引擎，其上还叠加商业贷款、两轮车融资和房产抵押贷款，各自的贷款金额、期限预期和风险信号不同。借款人选择产品并承担还款，但实际信贷供给取决于 KrazyBee
              Services 或其他 RBI 注册 NBFC 合作伙伴。只有数字化开户、合规披露和联合放贷资本足以降低摩擦时，服务不足的借款人才会偏好正规应用信贷。
            claimRefs:
