        title: 展示项
        blocks:
          - type: callout
            title: 混合架构是主要竞争优势
            body: 自有受监管 NBFC、多家合作放贷方和自动化承保的组合，是 KreditBee 连接纯发起应用与较慢传统机构的主要公开优势。
            calloutType: strength
            claimRefs:
