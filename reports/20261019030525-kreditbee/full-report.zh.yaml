  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付产品面与客户流程
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的产品面不止一个即时贷款应用，覆盖无担保个人贷款、商业贷款、房产抵押贷款和两轮车融资，部分来源还提到信用评分监测和 UPI
              功能。流程由应用或网页驱动，包括数字文件上传、自动验证和资金直转。产品掌握从发现、申请到审批、放款和还款服务的借款人全流程，即使受监管资产负债表位于界面之后。
