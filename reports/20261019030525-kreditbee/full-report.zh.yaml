  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与已披露定价
        blocks:
          - type: paragraph
            body: >-
              公开证据支持混合借贷模式，而非纯 SaaS 或平台故事。一份 2023 年外部案例研究称，KreditBee 通过贷款方佣金、借款人手续费和自有资产负债表贷款利差变现；到 2026 年的报道仍称，公司依托 RBI
              注册 NBFC
              运营，并通过联合放贷伙伴与十多家金融机构合作。收入引擎可能结合贷款发起和资产负债表放贷经济性，但公开来源没有按产品、渠道或自营与合作方出资拆分收入。第三方指南的利率、APR、费用和罚金区间是放贷方依赖的公开条款，并非实际净收益率、费率或毛利率。
