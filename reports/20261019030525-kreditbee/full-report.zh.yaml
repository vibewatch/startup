  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 服务分群广泛，但付款方和承保方贯穿整个借贷体系
        blocks:
          - type: paragraph
            body: >-
              KreditBee 将自己定位为借款人与受监管放贷方之间的分发和服务层，而非单一资产负债表放贷方。公司网站称审批和授信来自 RBI 注册 NBFC
              及银行；第三方资料称其通过联合放贷与十多家金融机构合作。个人贷款是入口，产品还包括商业贷款、两轮车融资和房产抵押贷款，客户涵盖消费者、个体经营者和 MSME 借款人。
