        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月 E 轮更像未来资本需求的线索。Global Banking Monitor 称资金主要用于 IPO 前强化贷款账簿和资产负债表，其他报道还提到市场扩张和
              AI。公司增长依赖资本获取、承保能力和服务纪律；但公开来源没有披露现金、消耗速度、跑道、债务到期日或产品级逾期 vintage。借款人投诉虽属轶闻，却提示规模扩大后服务控制可能成为信贷成本的一部分。
