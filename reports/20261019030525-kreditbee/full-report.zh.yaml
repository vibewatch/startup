        title: 展示项
        blocks:
          - type: callout
            title: 在已披露估值下，建议仍是继续研究
            body: KreditBee 看起来具备融资条件，也可能走向 IPO，但融资条款、财务对账和下行保护仍留下太多定价错误空间，不足以支持买入判断。
            calloutType: recommendation
