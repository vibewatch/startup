            title: 规模真实，即使漏斗仍然混乱
            body: 多个独立来源一致认为，截至 2026 年 KreditBee 已撮合超过 60 million 笔贷款，足以把采用视为真实存在；难点是将下载量、注册用户和贷款客户数对齐为可比漏斗。
            calloutType: strength
