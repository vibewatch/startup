      - number: '8.2'
        title: 投资主线与反主线
        blocks:
          - type: paragraph
            body: >-
              正面情景是：KreditBee 已经更像规模化的后期放贷方，而不是脆弱的增长故事。官方和第三方资料都把它描述为覆盖广泛的数字信贷平台，背后有 RBI
              关联的放贷结构、数百万借款人，以及足以支持上市路径的后期融资。Financial Express 还根据 MCA 关联申报报道 FY25 已实现盈利，Outlook Business 则报道 FY25-26
              前后的大额放款和 AUM。

              反方情景是：同一组公开资料仍不足以支持精确的投资判断。不同来源的客户数、收入和历史估值基准对不齐，最新一轮融资背后的优先股堆叠和投资人保护也没有披露。这样的组合依然可能造就一家可融资、但入场价格偏高的公司。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
