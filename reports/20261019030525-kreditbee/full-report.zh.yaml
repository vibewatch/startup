    KreditBee 是一家总部位于 Bengaluru、以应用为核心的数字借贷平台，通过 RBI 注册 NBFC 通道和联合放贷合作伙伴服务消费者及小企业借款人。公开记录支持其规模可观的叙事，包括最新 E
    轮估值；但创立历史、客户数、累计融资额和 FY25 业绩口径仍存在偏差。
