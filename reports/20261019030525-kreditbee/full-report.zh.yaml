  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的 FY26 合并报表验证已报道的盈利能力和规模，技术 / NBFC 合并完成，且 IPO 申报前没有出现重大信贷或服务问题。
        - 随着 IPO 准备度提升，KreditBee 可以守住上一轮私募 $1.5 billion 估值，甚至小幅超过。
        - 公开市场金融科技倍数压缩，或披露的资产质量较弱。
        - 需要对账后的经审计报表和简单标准的融资条款。
      - - 基准
        - 公司仍具备融资能力，但尽调只能填补部分披露缺口，投资者仍需谨慎评估承保。
        - 最新私募估值只有在完成尽调后才大致合理，上行空间更多来自披露改善，而不是倍数扩张。
        - IPO 延迟、实际盈利能力薄于暗示，或历史桥接仍然混乱。
        - 与今天指定的证据最一致。
      - - 悲观
        - 估值桥接仍未解决、经济状况令人失望，或服务 / 控制问题削弱上市前的信心。
        - 投资者可能要求相对上一轮私募估值折价，或接受延后的流动性路径，而不是按 $1.5 billion 估值进行投资判断。
        - 下轮融资、IPO 估值重置或上市后需求疲弱。
        - 如果尽调无法对账 FY26 或轮次条款，该情景的可能性会上升。
    notes: 情景估值措辞是方向性的，而非点估计，因为指定来源没有披露稳健的可比公司倍数集合或 Series E 优先股堆叠。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
