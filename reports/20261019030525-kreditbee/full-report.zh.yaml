        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              最高严重度风险是对受监管放贷伙伴、披露质量和纪律化承保的结构性依赖。KreditBee 通过一家 RBI 注册 NBFC 及十多家联合放贷或金融机构伙伴运营，而 2026 年 4 月资料对 FY25
              收入和独立客户数并不完全一致。最新 $280 million 融资被定位为 IPO 前支持资产负债表和贷款账簿，因此合规、组合质量或 KPI 一致性的弱点会直接影响估值持久性。
