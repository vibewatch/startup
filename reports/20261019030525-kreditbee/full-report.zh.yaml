        title: 运营与交易对手执行风险
        blocks:
          - type: paragraph
            body: >-
              资料池中最清晰的反向证据是一项借款人投诉，描述 EMI
              日客服失灵、欺诈性品牌表单和不活跃升级号码。一项投诉不能证明系统性控制失灵，却显示服务摩擦如何转化为品牌、诈骗和催收风险。合作放贷方、联合放贷机构、技术供应商、支付网关和征信机构，以及新产品扩张，都扩大了运营面；组合控制、投诉指标和伙伴集中度需要直接测试。
