  topStrengths:
    - >-
      Fresh $1.5 billion valuation and continued investor backing suggest the market still underwrites the platform's
      growth narrative.
    - >-
      The business combines app-led distribution with regulated NBFC and co-lending rails, which gives it operational
      scale and funding flexibility.
    - Public sources support meaningful scale in loans facilitated, app downloads, and borrower reach.
  topRisks:
    - >-
      Public sources still disagree on core baseline metrics such as customer counts, lifetime funding, and FY25
      revenue/profit definitions.
    - Tightening RBI digital-lending rules raise compliance, servicing, and asset-quality scrutiny.
    - Borrower-support complaints and disclosure drift keep trust and execution risk elevated.
  unresolvedGaps:
