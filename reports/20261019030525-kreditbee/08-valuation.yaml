    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [
          "Thesis",
          "Fresh capital plus explicit IPO preparation show continued access to financing and a visible liquidity path.",
          "The point weakens if the entity merger or IPO timetable slips."
        ]
      - [
          "Thesis",
          "Reported profitability, disbursals, and AUM imply more operating proof than an early-stage fintech narrative would suggest.",
          "Audited FY26 combined statements and credit-vintage data need to confirm that this proof is durable."
        ]
      - [
          "Thesis",
          "Official product breadth and a partner/NBFC structure can support cross-sell and broader secured-lending monetization.",
          "Public disclosure of product-level margins, loss rates, and partner economics would strengthen this point."
        ]
      - [
          "Anti-thesis",
          "Public customer, revenue, and valuation reference points do not reconcile cleanly enough for precise multiple work.",
          "A board-ready financing bridge and audited statements would reduce the discount for uncertainty."
        ]
      - [
          "Anti-thesis",
          "Servicing/control concerns and undisclosed investor protections could matter more as the company approaches public markets.",
          "Independent evidence on grievance controls and financing terms would soften this concern."
        ]
    notes: >-
      Arguments are limited to what the assigned public evidence supports; the
      table does not assume unpublished cohort, loss, or term-sheet data.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV010, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [
          "Bull",
          "Audited FY26 combineds validate reported profitability and scale, the technology/NBFC merger closes, and no material credit or servicing issue appears before IPO filing.",
          "KreditBee can defend or modestly exceed the last private $1.5 billion mark as IPO readiness improves.",
          "Public-market fintech multiple compression or weaker disclosed asset quality.",
          "Requires reconciled audited statements plus plain-vanilla financing terms."
        ]
      - [
          "Base",
          "The company remains financeable, but diligence closes only part of the disclosure gap and investors still need caution on underwriting.",
          "The latest private mark looks roughly fair only after diligence, with upside driven more by better disclosure than by multiple expansion.",
          "IPO delay, thinner profitability than implied, or still-messy historical bridge.",
          "Most consistent with today's assigned evidence."
        ]
      - [
          "Bear",
          "The valuation bridge stays unresolved, economics disappoint, or servicing/control issues reduce confidence ahead of listing.",
          "Investors would likely demand a discount to the last private mark or accept a delayed liquidity path instead of underwriting at $1.5 billion.",
          "Down-round, IPO reset, or weak aftermarket demand.",
          "Becomes more plausible if diligence cannot reconcile FY26 or the round terms."
        ]
    notes: >-
      Scenario valuation language is directional rather than point-estimated
      because the assigned sources do not disclose a robust comparable-company
      multiple set or the Series E preference stack.
    claimRefs: [CV001, CV003, CV007, CV008, CV010, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays price-sensitive because operating proof and IPO
      intent are real, but disclosure and downside-risk gaps remain unresolved.
    data:
      nodes:
        - id: scale-proof
          label: Scale and profitability proof
          note: >-
            Public sources report profitability, large loan volumes, and sizable
            AUM/disbursal metrics, though not from one reconciled operating base.
        - id: private-mark
          label: April 2026 round set the mark
          note: >-
            The latest disclosed price is a $280 million Series E at a $1.5
            billion post-money valuation.
        - id: ipo-path
          label: IPO path is active
          note: >-
            Management and follow-on coverage frame this as the last private
            round before listing, subject to merger and approval steps.
        - id: disclosure-gap
          label: Key valuation inputs are still missing
          note: >-
            Public evidence does not disclose the preference stack, audited FY26
            combineds, or a reconciled historical valuation bridge.
        - id: downside-signal
          label: Downside signals still matter
          note: >-
            Support/control complaints and general multiple-reset risk argue
            against paying up without more diligence.
        - id: recommendation
          label: Recommendation = research-more
          note: >-
            Wait for stronger diligence evidence or a more investor-friendly
            entry before moving positive.
      edges:
        - from: scale-proof
          to: private-mark
        - from: private-mark
          to: ipo-path
        - from: ipo-path
          to: disclosure-gap
        - from: disclosure-gap
          to: downside-signal
        - from: downside-signal
          to: recommendation
    claimRefs: [CV001, CV003, CV007, CV008, CV011, CV012, CV013]
callouts:
  - calloutType: recommendation
    title: Recommendation stays research-more at the disclosed mark
    body: >-
      KreditBee looks financeable and plausibly IPO-bound, but the public
      evidence still leaves too much room for pricing error on round terms,
      financial reconciliation, and downside protection to justify a buy call.
    claimRefs: [CV001, CV003, CV010, CV011, CV013, CV014]
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Treat an IPO delay, weaker-than-reported FY26 economics, unresolved round
      opacity, or repeated servicing/control complaints as reasons to move from
      research-more toward avoid.
    claimRefs: [CV003, CV010, CV012, CV013, CV014]
