  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation-bridge
      missingEvidence: A reconciled round-by-round cap-table and valuation bridge covering the 2023, 2024, and 2026 financing history.
      whyItMatters: Without a clean bridge, investors cannot tell whether the April 2026 price reflects step-change fundamentals, structure, or inconsistent public reporting.
      diligencePath: Request the board-approved financing history, cap-table bridge, and the investor presentation used for the Series E.
    - type: private-evidence-only
      severity: material
      topic: ipo-underwriting
      missingEvidence: Audited FY26 combined statements, loan-vintage and credit-loss detail, and definitive Series E preference or downside-protection terms.
      whyItMatters: These inputs determine whether the last private mark offers acceptable risk-adjusted upside or simply transfers underwriting risk to the next investor.
      diligencePath: Obtain the audited FY26 consolidated financials, the latest credit-vintage deck, and executed financing documents before taking a positive price view.
