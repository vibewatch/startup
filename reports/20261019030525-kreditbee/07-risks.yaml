company:
  name: KreditBee
chapter:
  number: 7
  title: Risks
  summary: >-
    KreditBee's risk stack is led by regulatory and disclosure dependence, then
    by servicing/control failures and partner-funded execution risk. The
    evidence is directionally constructive on scale and profitability, but the
    company still relies on a partner-lender structure, fresh capital to expand
    the lending book before IPO, and public data points that do not yet
    reconcile cleanly across outlets.
sections:
  - id: ranked-risk-overview
    title: Ranked risk view
    body: >-
      The highest-severity risk is not a single lawsuit or incident visible in
      the assigned pool; it is structural dependence on regulated lending
      partners, disclosure quality, and disciplined underwriting while the
      company scales toward a public-market process. KreditBee is described as
      operating through an RBI-registered NBFC with more than 10 co-lending or
      financial-institution partners, while April 2026 public references do not
      fully agree on core operating metrics such as FY25 revenue and unique
      customer counts. That combination matters because the latest $280 million
      round is framed as balance-sheet and lending-book support ahead of IPO,
      which means any weakness in compliance, portfolio quality, or KPI
      consistency would directly affect valuation durability rather than only
      optics.
    claimRefs: [CR004, CR005, CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-and-borrower-protection
    title: Regulatory and borrower-protection risk
    body: >-
      The chapter pool supports a real regulatory and borrower-protection risk,
      even without a direct regulator filing in the assigned URLs. Secondary
      reviews say KreditBee appears on the RBI digital-lending-app list via 13
      regulated lenders, and separate commentary says the app itself is not
      directly RBI-approved because borrower protection sits with KrazyBee
      Services Limited and other partner NBFCs. Independent commentary also
      frames the RBI digital-lending regime as requiring explicit disclosure,
      grievance handling, data-use controls, and borrower-protection practices.
      That architecture can still work well, but it creates a diligence burden:
      investors need direct confirmation of lender mapping, complaint
      resolution, and disclosure quality rather than relying on app-brand trust
      alone.
    claimRefs: [CR001, CR002, CR003, CR004, CR013]
    tableRefs: [TR002]
  - id: operational-and-counterparty-execution
    title: Operational and counterparty execution risk
    body: >-
      The clearest adverse evidence in the pool is a borrower complaint that
      describes EMI-day support failure, a fraudulent branded form, and inactive
      escalation numbers. One complaint does not prove a systemic control
      breakdown, but it does show how quickly servicing friction can become
      brand, fraud, and collections risk in digital lending. That risk is
      amplified by business-model dependencies: KreditBee is described as
      relying on partner lenders, co-lending institutions, technology providers,
      payment gateways, and credit bureaus, while product expansion into
      business loans, loans against property, and two-wheeler finance broadens
      the operating surface. The right conclusion is not that the model is
      broken; it is that portfolio controls, complaint resolution metrics, and
      partner concentration need to be tested directly before underwriting the
      next phase of growth.
    claimRefs: [CR004, CR011, CR012, CR014, CR015]
    tableRefs: [TR003]
  - id: kill-criteria-and-diligence-gates
    title: Kill criteria and diligence gates
    body: >-
      The report should treat three diligence outcomes as thesis-breaking if
      they fail. First, audited KPI reconciliation must close the gap between
      conflicting public revenue and customer-count references; if management
      cannot bridge those numbers cleanly, the pre-IPO narrative is too fragile
      for confident valuation work. Second, direct evidence on complaint
      handling, vintage losses, and partner concentration must show that the
      model is scaling with control rather than merely with capital. Third,
      capital use should validate a stronger lending book and technology stack
      without hiding higher risk appetite or weaker unit economics. If those
      checks clear, the current risk stack becomes monitorable rather than
      disqualifying; if they do not, the downside is structural.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Disclosure quality is itself a risk signal
    body: >-
      Public FY25 revenue and unique-loan-customer figures do not reconcile
      cleanly across the assigned 2026 sources, so IPO-readiness and investor
      reporting should be treated as an explicit diligence workstream rather
      than a clerical cleanup item.
    claimRefs: [CR005, CR007, CR008, CR009, CR010]
  - calloutType: recommendation
    title: Treat servicing controls as a go/no-go check
    body: >-
      A single complaint is not dispositive, but the combination of fraud
      exposure, inactive escalation numbers, and dependence on formal grievance
      processes means complaint logs, resolution SLAs, and lender-level
      escalation evidence should be requested before underwriting further scale.
    claimRefs: [CR012, CR013]
