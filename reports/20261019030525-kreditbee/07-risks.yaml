figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence keeps regulatory/disclosure dependence and servicing
      controls in the highest-risk zone, with partner and model dependencies
      still material.
    data:
      columns:
        - label: Likelihood
          note: 1 low to 3 high based on current public evidence.
        - label: Residual severity
          note: Post-mitigation severity based on currently visible controls.
        - label: Mitigation maturity
          note: Higher is better; low maturity means public mitigations are thin or unverified.
      rows:
        - label: Regulatory / disclosure dependence
          note: RBI-linked architecture plus pre-IPO reporting burden.
          values:
            - label: High
              score: 3
              tone: high
              note: Partner-lender compliance and public-metric reconciliation both remain live risks.
            - label: High
              score: 3
              tone: high
              note: A disclosure failure would hit both underwriting confidence and IPO readiness.
            - label: Medium
              score: 2
              tone: medium
              note: Secondary evidence shows frameworks, but direct regulator and audit evidence are still needed.
        - label: Servicing / fraud controls
          note: Complaint-led signal, not proof of systemic failure.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: The assigned pool shows at least one EMI-day failure narrative and misused branding path.
            - label: High
              score: 3
              tone: high
              note: Complaint and fraud-control slippage can damage collections, trust, and regulator posture.
            - label: Low
              score: 1
              tone: low
              note: Public evidence of response SLAs or incident-control metrics is thin.
        - label: Funding / partner execution
          note: Scale depends on capital, lender, and data-infrastructure partners.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: The platform already has multiple partners, but their concentration is undisclosed.
            - label: High
              score: 3
              tone: high
              note: Funding or partner disruption would affect growth and lending-book resilience directly.
            - label: Medium
              score: 2
              tone: medium
              note: Fresh capital and partner breadth help, but concentration and vintage performance remain unverified.
        - label: Portfolio / credit quality
          note: Public scale and profit data do not disclose vintage losses or delinquency.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: Large customer and loan volumes increase exposure to underwriting drift as the book expands.
            - label: High
              score: 3
              tone: high
              note: Credit deterioration would pressure capital needs, profitability, and IPO readiness.
            - label: Low
              score: 1
              tone: low
              note: No assigned source provides vintage-loss or delinquency controls.
        - label: Product / control complexity
          note: Expansion beyond unsecured personal loans adds distinct operating demands.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: The broader product suite is already reported in current sources.
            - label: Medium
              score: 2
              tone: medium
              note: Complexity is material but not shown as a realized failure in the assigned pool.
            - label: Medium
              score: 2
              tone: medium
              note: Product breadth may diversify exposure while requiring additional controls.
        - label: AI / model execution
          note: Capital is earmarked for AI-enabled risk assessment and technology.
          values:
            - label: Medium
              score: 2
              tone: medium
              note: Model deployment is an active execution priority rather than a hypothetical roadmap item.
            - label: Medium
              score: 2
              tone: medium
              note: Underperforming models could weaken underwriting or borrower outcomes.
            - label: Low
              score: 1
              tone: low
              note: Independent model-governance and override evidence is not public in the assigned pool.
    approximationNotes: >-
      This heatmap is a qualitative synthesis from the assigned public-source
      pool, not a statistical loss model.
    claimRefs: [CR004, CR010, CR011, CR012, CR013, CR014, CR015]
