evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-and-control
    missingEvidence: >-
      Named board members, control rights, liquidation preferences, and debt-facility counterparties for the current
      pre-IPO structure.
    whyItMatters: >-
      Governance and capital-stack terms determine real control, downside protection, and refinancing risk far better
      than a public valuation headline.
    diligencePath: >-
      Obtain the latest cap-table summary, shareholder agreement extracts, debt-facility schedule, and any
      board-composition deck from management or lead investors.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: baseline-metrics
    missingEvidence: >-
      A reconciled metric pack for founding year, cumulative funding, unique borrowers versus registered users, and
      verified headcount.
    whyItMatters: >-
      Later market, customer, financial, and valuation analysis will otherwise inherit inconsistent denominators and
      overstate precision.
    diligencePath: >-
      Request an investor KPI sheet or audited board pack that defines each metric and reconciles public round history
      against internal records.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: audited-fy26-and-ipo-readiness
    missingEvidence: Audited FY26 combined financials, merger completion status, and the timetable for any DRHP or other IPO filing.
    whyItMatters: >-
      The current investment case leans heavily on pre-IPO positioning, but public evidence does not yet show the
      combined entity's audited base or filing readiness.
    diligencePath: >-
      Review audited combined statements, counsel or banker readiness materials, and any filed draft prospectus
      materials once available.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      An independent market study or lender filing that isolates app-led consumer and SME credit volumes by borrower
      segment, product, and secured versus unsecured mix.
    whyItMatters: >-
      Without that bridge, any TAM/SAM/SOM claim risks overstating how much of India's broad credit gap is realistically
      reachable and profitably lendable.
    diligencePath: >-
      Request management's internal market model and reconcile it against RBI, industry-association, or listed-NBFC
      segment disclosures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: >-
      Vintage losses, approval rates, repeat-borrow behavior, and contribution margins by personal, SME, and secured
      products.
    whyItMatters: >-
      Valuation depends on whether product diversification improves economics or simply shifts risk to new segments with
      different servicing costs.
    diligencePath: Ask for product-level cohort decks, credit vintages, and CAC-to-lifetime-value bridges by borrower segment.
  - type: private-evidence-only
    severity: minor
    topic: borrower-protection-operations
    missingEvidence: Complaint volumes, first-response times, fraud-resolution metrics, and grievance-escalation outcomes by channel.
    whyItMatters: >-
      Public anecdotes can flag trust issues, but only operating data can show whether service frictions are isolated
      incidents or adoption-limiting patterns.
    diligencePath: Request customer-support SLA dashboards, complaint ageing reports, and RBI or ombudsman escalation statistics.
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Named competitors' current APRs, fees, ticket sizes, and tenure grids from their own surfaces or independent
      comparisons.
    whyItMatters: >-
      Without like-for-like peer pricing, the report cannot prove whether KreditBee wins on economics or only on
      acquisition and underwriting speed.
    diligencePath: >-
      Pull current official pricing pages or lender disclosures for the named peer apps and map them into the existing
      pricing table.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-and-multi-homing
    missingEvidence: >-
      Repeat-borrower rates, cross-app shopping behavior, approval-to-disbursal conversion, and borrower retention
      cohorts.
    whyItMatters: These metrics determine whether KreditBee has real switching costs or only temporary acquisition momentum.
    diligencePath: Request cohort, repeat-loan, and channel-conversion data from management or verified lender-side analytics.
    relatedQuestionRefs:
      - QP008
  - type: conflicting-data
    severity: material
    topic: benchmark-metrics
    missingEvidence: >-
      Reconciled FY25 revenue and total-funding numbers from audited filings or management-confirmed cap-table
      materials.
    whyItMatters: Inconsistent public metrics distort scale and efficiency comparisons against peers and can overstate moat quality.
    diligencePath: >-
      Reconcile statutory filings, round announcements, and management-confirmed investor materials before using
      benchmark multiples.
    relatedQuestionRefs:
      - QP008
  - type: conflicting-data
    severity: material
    topic: fy25-revenue
    missingEvidence: >-
      Audited FY25 and FY26 consolidated statements with a bridge between statutory revenue, group revenue, and any
      run-rate or LTM revenue used in fundraising materials.
    whyItMatters: Without a reconciled top-line definition, valuation multiples and margin comparisons are unstable.
    diligencePath: Obtain the latest audited financial statements and management reporting bridge used in the Series E process.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Current cash balance, unrestricted liquidity, debt or warehouse facilities, monthly burn or cash generation, and
      contractual maturities.
