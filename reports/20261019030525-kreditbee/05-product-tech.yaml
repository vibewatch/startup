      - "Dependency"
      - "Risk"
    rows:
      - ["Borrower interface", "Mobile-first and web-led acquisition, application, and document collection", "Sustained app usability and borrower trust", "No first-party product docs or uptime telemetry in this pool"]
      - ["Verification and scoring", "Automated verification plus AI / data-analytics-led application processing", "Data availability, model governance, and exception handling", "No public evidence here on approval quality, drift control, or fraud-screen effectiveness"]
      - ["Regulated lender / capital layer", "Origination through RBI-registered KrazyBee Services and partner lenders", "NBFC license, co-lending relationships, and balance-sheet capacity", "Compliance failure or partner friction would directly affect product availability"]
