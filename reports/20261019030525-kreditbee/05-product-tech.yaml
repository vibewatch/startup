company:
  name: "KreditBee"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Public evidence supports KreditBee as a scaled, app-led digital credit platform whose
    visible product advantage is breadth across multiple retail and SME loan products plus
    deep integration with an RBI-regulated NBFC and co-lending partners. The same evidence
    is much thinner on primary technical documentation, uptime history, and security
    controls, so underwriting and servicing infrastructure look material but only partially
    transparent from outside.
sections:
  - id: "product-surface"
    title: "Delivered product surface and customer workflow"
    body: |-
      KreditBee's public product surface looks materially broader than a single instant-loan
      app. Multiple independent sources describe a mobile-first digital lending platform that
      now spans unsecured personal loans, business loans, property-backed loans, and
      two-wheeler financing, with some sources also referencing credit-score monitoring and
      UPI-linked features. The user-facing workflow is consistently described as app- or
      web-led, with digital document upload, automated verification, and direct transfer of
      approved funds into the borrower's bank account. That combination suggests the product
      is not just a lead-generation layer: it owns the borrower journey from discovery and
      application through approval, disbursal, and repayment servicing, even when the
      regulated lending balance sheet sits behind the interface.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "operating-architecture"
    title: "Operating architecture and differentiation"
    body: |-
      The public record points to an operating stack built around digital origination,
      automated scoring, regulated lending rails, and repayment operations rather than a
      pure software marketplace. Financial Express and Global Banking Monitor both tie the
      app to RBI-registered NBFC KrazyBee Services, while Financial Express adds that
      KreditBee works with more than 10 financial institutions through co-lending
      partnerships. Third-party architecture commentary then describes the product as
      optimized for high-throughput processing, multi-product credit workflows, and
      reconciliation, while an integration-focused source highlights structured loan-status,
      disbursement, repayment, and EMI-calendar fields as the operational data surfaces that
      matter under the RBI's 2025 digital-lending rules. That makes the visible moat more
      about scaled underwriting-and-servicing orchestration than about public developer
      tooling or openly documented proprietary models.
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE011"
    tableRefs:
      - "TE003"
  - id: "trust-controls-risks"
    title: "Trust, compliance, and technical-risk posture"
    body: |-
      The most important risk theme is not whether KreditBee has product-market fit; it is
      whether a fast credit workflow stays controlled at the servicing edge. External
      explainers distinguish the app layer from the regulated NBFC and partner lenders,
      which means borrower disclosures, repayment handling, complaint resolution, and data
      reporting are central control points rather than back-office details. The strongest
      adverse evidence in this pool is a consumer complaint describing failed EMI-day
      support, inactive escalation channels, and misuse of branded payment instructions,
      which is not enough to prove systemic failure but is enough to flag servicing and
      fraud-prevention as diligence items. Separately, recent funding coverage says the new
      capital is aimed mainly at strengthening the lending book, balance sheet, and IPO
      preparation, so the assigned evidence does not independently verify a major new
      product roadmap, public status instrumentation, or detailed security architecture.
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
