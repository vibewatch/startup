      - [Round size, "$280M", "2026-04", high, null]
      - [AUM, "$1.5B", "2026-03", high, null]
      - [Loans facilitated, "60M+", "2026-03", high, null]
      - [Unique loan customers, "15M-18M supported; 80M+ appears to refer to registered users", "2026-04", medium, "Need a company or filing definition that reconciles borrower versus registered-user counts."]
      - [FY25 performance, "Management says Rs 2,700 crore revenue and Rs 470 crore PAT; filing-based coverage says Rs 589.7 crore revenue from operations and Rs 237 crore net profit", "FY2025", medium, "Need audited FY25 consolidated statements and accounting definitions behind the management figures."]
      - [Lifetime funding, "$540M to $642.65M+ across public sources", "2026", medium, "Need a cap-table or round ledger that reconciles primary capital, secondary sales, and historical extensions."]
      - [Headcount, null, "2026", low, "Assigned evidence only surfaced an Inc42 directory estimate of 1,905 employees without methodology; treat as unverified until company or filing support is available."]
    notes: >-
      Snapshot mixes company-reported, media-reported, and vendor-directory metrics;
      rows preserve public disagreements instead of forcing one canonical number.
    claimRefs: [CO001, CO002, CO003, CO006, CO007, CO008, CO009, CO010, CO014, CO015]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit / coverage
      - Key-person dependency
    rows:
      - [Madhusudan E / Madhusudan Ekambaram, CEO, "Presented as co-founder and chief executive across current profiles.", "Owns lending strategy, investor narrative, and IPO preparation messaging.", "High; the latest funding and IPO timeline are both tied to CEO statements."]
      - [Karthikeyan Krishnaswamy, CTO, "Named as co-founder and CTO; Financial Express links prior experience to NTT Solutions.", "Connects credit products to underwriting and platform execution.", "Medium; technology leadership is concentrated but not uniquely described in the assigned pool."]
      - [Vivek Veda, CFO, "Named as co-founder and CFO; Financial Express links prior experience to Societe Generale.", "Bridges finance, funding, and public-market readiness.", "High; finance-function continuity matters because public disclosures already conflict on core KPIs."]
    enumerationScope:
      coverage: partial
      basis: Current public profiles and April 2026 financing coverage name founders and top executives, but do not disclose the wider board or independent governance roster.
    notes: >-
      Table is intentionally limited to founders and named executives because the
      assigned evidence did not include a verified board list or committee structure.
    claimRefs: [CO011, CO012, CO013]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - [Motilal Oswal Alternates, "Series E co-lead", "Named lead in the unicorn round; likely influential in pricing and deal structure.", "Confirm ownership percentage, board rights, and whether exposure was primary or secondary."]
      - [Hornbill Capital, "Series E co-lead", "Named co-lead investor in April 2026 coverage.", "Confirm whether the fund took governance rights or information rights."]
      - [Dragon Funds (MUFG-backed), "Series E co-lead", "Links Japanese institutional capital to the pre-IPO round.", "Clarify whether MUFG linkage carries debt, distribution, or strategic partnership implications."]
      - [WhiteOak Capital, "Series E participant", "Signals support from an established Indian asset manager.", "Confirm stake size and any follow-on rights before IPO."]
      - [A.P. Moller Holding, "Series E participant", "Adds long-duration capital to the syndicate.", "Test whether the investment is passive or tied to broader financial-services theses."]
      - [Premji Invest, "Existing investor / Series E participant", "Repeat participation indicates continuity from earlier backing.", "Reconcile ownership and liquidation terms across old and new rounds."]
      - [Advent International, "Existing investor / Series E participant", "Existing global growth investor that also joined the new round.", "Confirm whether Advent sold any secondary shares or increased its position."]
    enumerationScope:
      coverage: partial
      basis: April 2026 financing coverage names the visible Series E syndicate, but not the full cap table, debt stack, or beneficial-control structure behind KreditBee.
    notes: >-
      Stakeholder map captures named Series E participants only; it does not prove
      board control, preference stack, or lender concentration.
    claimRefs: [CO003, CO005, CO015]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: KreditBee's public path runs from a 2016 founding narrative to a 2026 unicorn round, with adverse support noise and several disclosure mismatches along the way.
    data:
      items:
        - date: "2016"
          label: Founding narrative begins
          detail: Multiple 2026 profiles describe the company as founded by Madhusudan E, Karthikeyan Krishnaswamy, and Vivek Veda in 2016.
          tone: positive
          claimRefs: [CO011, CO012]
        - date: "2023-01"
          label: Extended Series D resets the valuation baseline
          detail: KnowStartup says the prior major round was a $100 million extended Series D in January 2023 at roughly a $700 million to $800 million valuation.
          tone: neutral
          claimRefs: [CO003]
        - period: FY2023
          label: Profitability appears for the first time
          detail: Financial Express says FY23 was the first year in which KreditBee made profits.
          tone: positive
          claimRefs: [CO007]
        - date: "2024-03"
          label: Public round history becomes inconsistent
          detail: Financial Express, citing Tracxn, says the last disclosed round in March 2024 was $9.4 million at about a $184 million valuation, which conflicts with other funding narratives.
          tone: warning
          claimRefs: [CO015]
        - date: "2025-08-18"
          label: Borrower-support complaint is posted publicly
          detail: A forum post alleged a fake EMI payment form, inactive escalation channels, and denied responsibility after a payment loss.
          tone: adverse
          claimRefs: [CO016]
        - period: "2026-Q1"
          label: Domicile and merger work start before listing
          detail: Times of India says the parent entity reverse-flipped from Singapore to India and that the technology and NBFC entities were being merged before filing.
          tone: neutral
          claimRefs: [CO014]
        - date: "2026-04-08"
          label: Series E creates a unicorn valuation
          detail: Multiple sources align on a $280 million round at a $1.5 billion valuation, with one report splitting it between primary and secondary capital.
          tone: positive
          claimRefs: [CO003, CO004]
        - period: "2026-H2 / 2027-Early"
          label: IPO target enters the public narrative
          detail: Current management-guided coverage points to a possible listing by late 2026 or early 2027, subject to board and market conditions.
          tone: opportunity
          claimRefs: [CO014]
    approximationNotes: null
    claimRefs: [CO003, CO004, CO007, CO014, CO015, CO016]
callouts:
  - calloutType: risk
    title: Disclosure drift is part of the diligence thesis
    body: >-
      The April 2026 unicorn round is well corroborated, but founding year, customer
      counts, lifetime funding, and FY25 performance all vary across public sources.
      That makes disclosure quality itself a core diligence issue rather than just a
      footnote.
    claimRefs: [CO006, CO007, CO009, CO010, CO012, CO013, CO015]
