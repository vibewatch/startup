artifact: company-overview
slug: kreditbee
runDate: 2026-10-19
company:
  name: KreditBee
chapter:
  number: 1
  title: Company Overview
  summary: >-
    KreditBee's April 2026 Series E put the company into India's unicorn cohort at a
    $1.5 billion valuation and reinforced its positioning as an app-led digital lender
    operating through an RBI-registered NBFC structure. The same secondary-source
    record also shows material disclosure drift on founding year, customer scale,
    lifetime funding, and FY25 performance definitions, so later chapters should treat
    those metrics as bounded rather than exact.
sections:
  - id: identity-and-operating-model
    title: Identity, product scope, and reported scale
    body: |-
      Current secondary coverage consistently describes KreditBee as a Bengaluru-based
      digital lending platform focused on consumer and small-business credit through a
      mobile app, with adjacent products such as loans against property, two-wheeler
      loans, credit-report features, and UPI-linked services. The operating structure
      is also broadly consistent across sources: the platform lends through
      RBI-registered NBFC KrazyBee Services Limited and supplements origination with
      co-lending relationships across more than ten financial institutions. Scale
      claims are directionally strong but not perfectly reconciled. Multiple 2026
      reports agree on more than 60 million loans facilitated and about $1.5 billion
      of AUM by March 2026, while customer counts diverge between 15 million, 18
      million, and 80 million-plus depending on whether the source is measuring unique
      borrowers or registered accounts. Headcount is weaker still: the assigned pool
      only surfaced a vendor-style directory estimate, so the chapter keeps workforce
      size as an explicit diligence gap rather than treating it as settled.
    claimRefs: [CO001, CO002, CO008, CO009, CO010]
    tableRefs: [TO001]
  - id: leadership-and-capital-base
    title: Founders, executive continuity, and financing stakeholders
    body: |-
      The founder roster is stable across current profiles even though the public
      record is not: Madhusudan E, Karthikeyan Krishnaswamy, and Vivek Veda appear
      repeatedly as the core founding and executive trio, with Madhusudan as CEO,
      Karthikeyan as CTO, and Vivek as CFO. That continuity matters because the same
      team is steering the company's transition from a fast-growing private lender into
      a pre-IPO structure. The latest financing syndicate is broad enough to matter for
      diligence: Motilal Oswal Alternates, Hornbill Capital, MUFG-backed Dragon Funds,
      WhiteOak Capital, A.P. Moller Holding, Premji Invest, and Advent International
      were all named in April 2026 coverage. Even so, the assigned evidence does not
      disclose board seats, protective rights, liquidation preferences, or the current
      debt-facility stack, so any ownership or control assessment remains incomplete at
      this stage.
    claimRefs: [CO005, CO011, CO012, CO013]
    tableRefs: [TO002, TO003]
  - id: disclosure-tensions-and-milestones
    title: Funding path, IPO preparation, and disclosure tensions
    body: |-
      The strongest confirmed milestone is the April 2026 Series E: multiple sources
      align on a $280 million round at a $1.5 billion valuation, and one detailed
      write-up adds that the capital split was roughly $220 million primary and $60
      million secondary. The same cluster of reports says KreditBee has reverse-flipped
      its parent entity from Singapore to India and is merging the technology and NBFC
      entities before a possible late-2026 or early-2027 IPO filing. Where the record
      gets messy is in the baseline numbers investors would normally use as ground
      truth. Management-reported FY2025 revenue and profit are far above filing-based
      FY25 revenue-from-operations and net-profit figures reported elsewhere, lifetime
      capital raised ranges from roughly $540 million to $642.65 million-plus, and the
      founding year is reported as both 2016 and 2018. A 2025 borrower complaint post
      also flags support-channel failures and scam exposure, which is too thin to prove
      a systematic issue but strong enough to keep customer-protection execution on the
      watchlist.
    claimRefs: [CO003, CO004, CO006, CO007, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
