  - id: comparable-set-and-market-context
    title: Comparable set and market context
    body: >
      The most direct public comparable is Tempus AI (NASDAQ: TEM), which traded at an enterprise value of approximately
      $9 billion as of Q1 2026 on trailing twelve-month revenue of approximately $1.36 billion — a trailing EV/Revenue
      multiple of roughly 6.6x. Tempus is larger (diagnostics + data platform, acquired Paige and Ambry), more
      diversified, and faces comparable reimbursement and integration challenges, making it a directionally valid but
      structurally imperfect comparable for PathAI. The Tempus 2025 10-K, filed with the SEC on February 24, 2026,
      confirmed FY2025 revenue of $1.27 billion (83% YoY growth), $759.7 million in cash, and net loss of $245 million,
      with 2026 guidance of $1.59 billion. Tempus's forward EV/Revenue on 2026 guidance (at current EV) approximates
      5.6x — compressing as revenue scales.

      The Paige-Tempus acquisition is the direct deal comparable for digital pathology AI: Tempus paid $81.25 million for
      Paige in August 2025, primarily in stock, plus assuming Microsoft Azure cloud commitments. Paige had raised over
      $220 million since its 2017 founding, making the acquisition price less than 40% of its disclosed funding — a
      stark reminder that FDA-cleared digital pathology AI does not guarantee premium exit pricing without a strategic
      buyer commitment. PathAI's $750 million upfront is 9.3x larger than Paige's exit, reflecting PathAI's superior
      scale, deeper Roche integration, and AIM-MASH regulatory milestones.

      In the private market, Proscia raised a $50 million Series D in April 2025 for AI pathology IMS and AP-Dx platform,
      suggesting that well-funded private digital pathology companies can still attract growth capital but at a stage
      far earlier and at valuations well below PathAI's implied exit. HealthTech M&A multiples analysis for mid-2025
      pegged AI diagnostics companies with proven platforms at 6–8x ARR, with the upper bound of 8–10x reserved for
      biotech-adjacent late-stage innovators. Roche Diagnostics itself reported CHF 13.8 billion in 2025 sales (2% CER
      growth), placing the $750 million PathAI deal at approximately 5.4% of its annual diagnostics revenue — a
      bolt-on investment, not a transformative bet.

      No verified transaction comparable at PathAI's exact profile (private, FDA-cleared IMS + biopharma AI + CDx
      partnership, $100M+ revenue estimate) has been publicly disclosed, so the comp set relies on adjacent transactions
      and public market proxies with material limitations.
