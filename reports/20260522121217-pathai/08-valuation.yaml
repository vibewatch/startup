  - id: adverse-evidence-and-kill-triggers
    title: Adverse evidence, overvaluation risk, and kill triggers
    body: >
      Three independent analytical sources raise concerns that moderate the positive deal-price signal. First, the
      Discoveries in Health Policy analysis explicitly states that digital pathology "still suffers from a persistent
      reimbursement problem" and that PathAI's value is "operational" rather than from broadly reimbursed standalone AI
      products — a structural ceiling on clinical revenue that does not disappear post-acquisition. Second, the LucidQuest
      diligence brief flags two red flags: platform neutrality risk (if Roche prioritizes its own assays, rival biopharma
      partners may migrate to neutral AI platforms like Paige or Aignostics) and integration lag (the H2 2026 closing
      window leaves a period of uncertainty that may stall PathAI's current hospital sales cycles). Third, the Paige
      exit at $81.25M versus $220M+ raised demonstrates that no implicit floor exists for FDA-cleared AI pathology
      companies facing suboptimal exit timing.

      Overvaluation risk is real but bounded. The $750M upfront implies approximately 7x on third-party revenue estimates,
      consistent with the 6–8x range analysts cite for proven AI diagnostics platforms. The risk is not that the multiple
      is implausible, but that the revenue estimate itself is unreliable — a $108M figure with no company confirmation and
      a potential ±50% error band is not a credible anchor for high-precision valuation work. Any diligence process that
      discovers materially lower revenue (e.g., $60–70M) would retroactively frame the deal as a 10–12x+ transaction,
      well outside sector norms for a company with no public EBITDA.

      Governance risk post-close centers on integration execution and key-person retention. PathAI's CEO Andy Beck and
      CTO Aditya Khosla built the AI research and regulatory credibility that Roche is paying for. Post-close departure
      of either executive would undermine the data-flywheel thesis, disrupt Roche's PCCP maintenance cadence, and signal
      a talent drain to independent AI startups. No public retention package terms have been disclosed.
