chapter:
  number: 8
  title: Valuation
  summary: >
    As of May 22, 2026, PathAI's equity value is anchored almost entirely by the pending Roche acquisition at $750 million
    upfront plus up to $300 million in milestones — the most credible price signal available in the absence of audited
    financials, disclosed ARR, or gross margin. The implied revenue multiple of approximately 7x on a third-party-estimated
    $108 million revenue base is consistent with the upper range of HealthTech AI M&A multiples (4–8x) and well above
    the Paige-Tempus precedent ($81.25M on $220M+ raised). The appropriate recommendation is a conditional hold pending
    deal close in H2 2026, with conservative treatment of the contingent milestone tranche. Standalone underwriting
    without the Roche deal is not supportable given the depth of financial opacity.

sections:
  - id: recommendation-and-stance
    title: Recommendation, confidence, and valuation stance
    body: >
      PathAI's valuation cannot be underwritten from first principles using public financial data: no audited revenue,
      gross margin, burn rate, ARR, or customer concentration figure has been disclosed. The only defensible anchor is
      the May 7, 2026 Roche merger agreement — $750 million upfront plus up to $300 million in contingent milestones —
      which Roche's official press release confirmed and Davis Polk & Wardwell (advising Roche) and Latham & Watkins
      (advising PathAI) independently corroborated. On a third-party-estimated $108 million revenue base, the upfront
      payment implies approximately 7x EV/Revenue, rising to 9.7x if all milestones are achieved. This multiple sits
      within the 6–8x range that HealthTech analysts assigned to proven AI diagnostics platforms in mid-2025 but above
      the median of 4–6x for the broader HealthTech M&A market. The recommendation is conditional positive with a hold
      stance: the Roche deal price is credible and consistent with sector comps, but the milestone tranche should not be
      underwritten without knowledge of specific milestone triggers. Risk rating is high owing to deal-close uncertainty
      (H2 2026 antitrust and regulatory approvals outstanding), financial opacity (no confirmed standalone metrics),
      and reimbursement-ceiling risk on the clinical revenue segment. False-precision risk is material: the $108 million
      revenue estimate derives from third-party databases (Growjo, ZoomInfo), not company disclosure, and a ±50% error
      band on that estimate would shift the implied multiple from roughly 3.5x to roughly 14x upfront. Evidence
      sensitivity is therefore rated high — any independent verification of PathAI's revenue would change the valuation
      conclusion significantly.
