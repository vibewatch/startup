  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Roche deal fails or is formally terminated
        - Public announcement of deal termination or material adverse change invoked
        - Removes primary value anchor; standalone PathAI underwriting requires new base case at ~5x unconfirmed revenue
        - Exit secondary positions; recalibrate to standalone bear case ($300–540M); seek alternate strategic buyer intelligence
      - - Antitrust challenge filed at DOJ, FTC, or EU DG COMP
        - Public filing or material press coverage of regulatory review with remedies demanded
        - Delays H2 2026 close; increases integration uncertainty; introduces renegotiation risk on price or structure
        - Monitor closely; do not add exposure; hold through initial review if no structural remedies demanded
      - - Verified revenue materially below $75M
        - CFO confirmation or data room disclosure showing PathAI revenue below $75M trailing twelve months
        - Retroactively frames $750M deal at 10x+, well above sector norms; undermines valuation discipline thesis
        - Reassess; $750M still a Roche-committed price but signals high strategic premium rather than financial value
      - - CEO Andy Beck or CTO Aditya Khosla departs pre-close
        - Public announcement or credible press report of founder departure before deal close
        - Undermines data flywheel and PCCP maintenance thesis; may trigger MAC clause or Roche price renegotiation
        - Assess MAC risk; verify retention package; monitor deal timeline closely
      - - Roche renegotiates upfront below $650M
        - Public amended agreement with upfront payment < $650M
        - Reduces exit consideration materially; signals Roche discovered adverse information in due diligence
        - Exit secondary positions at first liquidity; treat as bear-case signal
    notes: >
      Thresholds are illustrative and editorial given absence of deal contract details; actual MAC clause definitions
      and Roche's legal rights to renegotiate are not publicly available. Trigger monitoring depends on
      public disclosure; private deal developments would not be detectable from public sources alone.
    claimRefs:
