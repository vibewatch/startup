    enumerationScope:
      coverage: partial
      basis: >
        Comparable set is limited to publicly available transaction and market data; no comprehensive
        private-market database of all digital pathology AI transactions exists. Multiples for PathAI
        rely on a third-party revenue estimate, not company-disclosed financials.
    rows:
      - - "Tempus AI (NASDAQ: TEM) — public AI diagnostics + data platform"
        - Trailing EV/Revenue (Q1 2026)
        - ~6.6x on ~$1.36B TTM revenue; EV ~$9.0B
        - Closest public comp — AI diagnostics + data platform with regulatory traction and pharma partnerships
        - Much larger scale ($1.36B vs. ~$108M est.), diversified (Ambry + Paige acquired), different revenue mix
      - - Paige — AI digital pathology, acquired by Tempus Aug 2025
        - M&A transaction value vs. disclosed funding
        - $81.25M acquisition price; <40% of $220M+ disclosed funding (implied sub-1x revenue)
        - Direct comp — FDA-cleared digital pathology AI with pharma and CDx focus
        - Distressed-exit dynamic; Tempus paid primarily in stock; PathAI's deal is 9x larger and cash-upfront
      - - Proscia — private AI pathology IMS, FDA 510(k) cleared (AP-Dx)
        - Series D round (April 2025)
        - $50M Series D; total funding undisclosed; private
        - Peer IMS competitor — FDA-cleared, biopharma focused, but smaller and no CDx partnership at scale
        - No disclosed valuation multiple; Series D round only; no acquisition price anchor
      - - HealthTech AI diagnostics sector — M&A multiples (2025)
        - EV/Revenue range for AI diagnostics M&A
        - 6–8x revenue for proven AI platforms; 4–6x for broader HealthTech
        - Sector-level benchmark for PathAI's implied multiple (~7x upfront / ~9.7x full deal)
        - Aggregate market data; not a specific transaction; not calibrated to PathAI's exact profile
      - - Roche Diagnostics — strategic context for deal size
