  - id: exit-readiness-and-final-diligence-asks
    title: Exit readiness and final diligence asks
    body: >
      PathAI is in exit mode as of May 22, 2026: the Roche deal is the sole actionable liquidity path for VC investors.
      Secondary market activity reportedly preceded the announcement, and with deal close expected in H2 2026, the window
      for secondary transactions is narrow and increasingly priced to the deal. Any secondary participant pricing above
      the $750M upfront equivalent is effectively buying optionality on the $300M milestone tranche — a position that
      requires detailed knowledge of milestone definitions, probability estimates, and post-close integration execution
      that is not available from public sources.

      The most critical remaining diligence gaps are: (1) audited or CFO-confirmed revenue, gross margin, and burn rate
      — without these, the 7x multiple cannot be stress-tested; (2) the full milestone structure including thresholds,
      measurement periods, and Roche's ability to accelerate or delay milestones post-close; (3) cap table composition
      and preference overhang — Series C investors at $165M may hold liquidation preferences that affect LP-level returns
      differently from the headline $750M figure; (4) antitrust filing status and any remedies proposed or under review;
      (5) key-person retention packages for Andy Beck, Aditya Khosla, and the top 10–20 technical staff.

      Thesis-break triggers that should prompt a negative reassessment include: antitrust challenge at DOJ or EU DG COMP
      that delays close beyond Q1 2027; verification of revenue below $75 million (which would imply 10x+ on upfront
      alone); public departure of CEO Beck pre-close; or evidence that Roche is renegotiating the upfront price as a
      condition of close. None of these events has occurred as of May 22, 2026, but the monitoring obligation is active
      until deal close is publicly confirmed.
