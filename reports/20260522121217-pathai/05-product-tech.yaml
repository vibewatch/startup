  - id: TE002
    title: Pathology workflow and use-case table
    columns:
      - User Job / Step
      - Current Workflow
      - AISight Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Case initiation
        - LIS order creation, manual specimen linking
        - HL7 interface auto-creates AISight case on order receipt
        - Reduces manual data entry and specimen matching errors
        - Requires HL7 interface setup; legacy LIS may need middleware
      - - Slide digitization
        - Manual scan initiation on scanner workstation
        - Barcode-matched upload to AISight cloud via scanner integration
        - Eliminates manual file transfer; links slide to case
        - Limited to PCCP-cleared scanner models for Dx use
      - - AI triage and case prioritization
        - Manual pathologist queue assignment
        - AI assigns urgency, auto-routes high-priority cases
        - Supports workload balancing; reduces turnaround time
        - AI triage accuracy data not independently published
      - - Primary diagnosis review
        - Microscope review of glass slides
        - Browser-based viewer with AI overlays, annotations, multi-user
        - Remote access; real-time collaboration; annotated AI findings
        - Performance depends on display calibration and PCCP compliance
      - - Tumor board and consultation
        - Printed slide photos or slide transport
        - Synchronized multi-slide navigation; dynamic presentation queue
        - Digital case sharing eliminates physical slide logistics
        - Network bandwidth requirements for large image files
      - - Biopharma biomarker assay (AIM-MASH)
        - Manual expert pathologist H&E scoring (NASH CRN)
        - AIM-MASH AI scores steatosis, ballooning, inflammation, fibrosis
        - Reproducible, FDA/EMA-qualified DDT biomarker scoring
        - Restricted to MASH clinical trial context; not standalone Dx
      - - Clinical trial tissue QC (AIM-TC)
        - Manual pathologist tumor-cellularity estimation
        - AIM-TC whole-slide quantification across 14+ tumor types
        - Standardized input for NGS tissue adequacy decisions
        - Not FDA-cleared as standalone diagnostic
    notes: "Workflow steps based on PathAI official content, LigoLab integration documentation, and clinical deployment announcements. Performance claims are company-stated or partner-reported; independent validation not confirmed."
