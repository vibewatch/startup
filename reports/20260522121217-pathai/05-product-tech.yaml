callouts:
  - calloutType: strength
    title: AIM-MASH dual US-EU regulatory qualification
    body: >
      AIM-MASH is the first AI-based pathology tool to receive both FDA Drug Development Tool Biomarker Qualification (December 2025)
      and EMA CHMP Qualification (March 2025). This dual regulatory status removes revalidation burden for MASH trial sponsors in both
      jurisdictions and positions PathAI as the regulatory-proof biopharma pathology partner of record for MASH drug development programs.
    claimRefs:
      - CE019
      - CE020

  - calloutType: risk
    title: Scanner ecosystem bottleneck and integration complexity
    body: >
      AISight Dx's primary-diagnosis clearance is tied to a small PCCP-cleared scanner list (four models as of May 2026). Each new scanner
      addition requires PCCP-documented validation, creating procurement friction and potential lab-specific delays. Integration with legacy
      LIS platforms is complex and requires custom HL7 configuration at each institution—a material adoption barrier that Roche explicitly
      cited as motivation for its acquisition.
    claimRefs:
      - CE040
      - CE041
      - CE043

