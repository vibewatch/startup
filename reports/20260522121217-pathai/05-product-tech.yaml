  - id: trust-compliance-and-quality-controls
    title: Trust, compliance, and quality controls
    body: >
      AISight Dx holds FDA 510(k) clearance K243391 (June 2025) under 21 CFR 864.3700, Class II, product code QKQ. The clearance is
      distinguished by an authorized Predetermined Change Control Plan (PCCP), one of fewer than 60 such cleared PCCPs in the FDA device
      database at the time of clearance. The PCCP allows PathAI to update supported scanners, displays, file formats, and web browsers
      with documented validation but without a new 510(k) submission, significantly reducing the regulatory cycle for platform upgrades.
      AISight Dx received CE-IVD marking in August 2024 under EU IVDR for use in the EEA, UK, and Switzerland, with a parallel Agilent
      CE-IVD-marked distribution channel. PathAI states HIPAA compliance for handling protected health information, and DICOM support
      provides interoperability alignment with health enterprise standards. LIS integration via HL7 is documented through the LigoLab
      reference deployment. PathAI's GCLP histopathology lab (built 2022) provides Good Clinical Laboratory Practice-compliant tissue
      processing for biopharma studies. Independent confirmation of ISO 27001 or SOC2 Type II certification has not been located in
      public sources, which is a diligence gap for enterprise and regulated-lab procurement. AIM-MASH is qualified by FDA as a DDT
      biomarker tool (not cleared for standalone clinical diagnosis), and its use is expressly bounded to MASH clinical trial contexts.
      The regulatory classifications are distinct: AISight Dx is cleared as a diagnostic device; AIM-MASH is qualified as a DDT
      biomarker tool; AIM-TumorCellularity is a research-support tool not cleared as a standalone diagnostic.
