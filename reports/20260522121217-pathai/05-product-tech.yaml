company:
  name: PathAI
chapter:
  number: 5
  title: Product & Technology
  summary: >
    PathAI's core product is AISight, a cloud-native (AWS-hosted) image management system for digital pathology available in a research-use
    (RUO) and FDA-cleared clinical (AISight Dx, K243391, June 2025) edition. The biopharma stack is anchored by AIM-MASH, which in December
    2025 became the first AI drug-development tool qualified by the FDA, and AIM-TumorCellularity, deployed in clinical-trial and molecular
    pathology workflows. Open-source repositories on GitHub, technical presentations at USCAP and ECP, and partnerships with Agilent and
    LigoLab provide the developer-signal evidence. Key limiting factors include a short list of FDA-cleared scanner models, integration
    complexity with legacy LIS platforms, limited public clinical performance data, and a pending Roche acquisition that introduces transition
    uncertainty.

sections:
  - id: product-definition-and-module-map
    title: Product definition and module map
    body: >
      PathAI operates a two-tier product architecture: a clinical digital pathology platform (AISight/AISight Dx) and a biopharma precision
      pathology stack (AIM tools and the Precision Pathology Network). AISight is described on the PathAI website as a cloud-native,
      open enterprise image management system serving as the hub for case management, whole-slide image management, and AI application
      orchestration in pathology labs. The clinical variant, AISight Dx, received FDA 510(k) clearance K243391 in June 2025 for primary
      diagnosis use, becoming a Class II device (21 CFR 864.3700, product code QKQ). Agilent resells the RUO edition as a branded product
      through its own distribution channel, extending PathAI's commercial reach into research-oriented labs. The biopharma stack centers on
      AIM (AI-based Measurement) tools: AIM-MASH (formerly AIM-NASH) for MASH liver-biopsy scoring, AIM-TumorCellularity for molecular
      pathology support, and AIM-Derm for dermatopathology. AIM-MASH achieved a landmark regulatory milestone in December 2025 when the
      FDA qualified it as the first AI drug-development tool through the Drug Development Tools Biomarker Qualification Program, allowing
      biopharma sponsors to use it in phase 2/3 MASH trial submissions without revalidation. EMA issued a parallel CHMP qualification in
      March 2025. The Precision Pathology Network (PPN), launched July 2025, connects participating labs, research institutions, and
      biopharma partners in a shared digital infrastructure for biomarker discovery and standardized data contributions.
