chapter:
  number: 3
  title: Competitors
  summary: >-
    The digital pathology AI market is entering a post-consolidation phase defined by two landmark 2025–2026
    acquisitions—Roche acquiring PathAI for up to $1.05B and Tempus acquiring Paige for $81.25M—that are
    rapidly reshaping competitive dynamics. PathAI's most direct AI-platform peers are Proscia (FDA-cleared
    Concentriq AP-Dx, $130M raised, 16 of top 20 pharma customers) and Ibex Medical Analytics (FDA-cleared
    Prostate Detect 2025, >70% YoY customer growth), while scanner hardware leaders Leica Aperio and the
    incumbent Roche/navify stack exert structural influence over IMS selection. Across all competitors, list
    pricing is undisclosed and CMS reimbursement remains constrained to Category III tracking codes, shifting
    durable competitive value toward biopharma and companion-diagnostic revenue rather than clinical fee-for-service.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      PathAI competes across at least four competitor categories that buyers weigh simultaneously. Direct digital-
      pathology AI peers—Proscia, Paige (now Tempus), and Ibex Medical Analytics—offer AI algorithms and image
      management systems targeting overlapping clinical lab and biopharma customer bases. Incumbent scanner and
      platform vendors—Roche/Ventana/navify, Leica Biosystems (Aperio), and Philips IntelliSite—control
      scanner hardware selection and deeply influence IMS purchasing; their integrated stacks represent a
      structural entrenchment risk for pure-software AI platforms. Adjacent research-focused players—Visiopharm,
      Indica Labs, Aiforia—compete in pharma R&D and academic markets but have limited clinical FDA footprints.
      Status-quo and substitute alternatives—manual glass-slide microscopy, outsourced histopathology, and
      academic or internal-build AI programs—represent the reference point buyers measure any digital pathology
      investment against. The market consolidation of 2025–2026 is significant: Signify Research characterized
      Tempus acquiring Paige as a "hard reset" for the sector, and the Roche/PathAI deal creates the first
      vertically integrated stack spanning scanner hardware through FDA-cleared AI algorithms and companion
      diagnostics. As of May 2026, fewer than 15% of US healthcare organizations have selected a digital
      pathology vendor (KLAS 2026), leaving the majority of the total addressable market still uncontested.
      Competitive dynamics among vendors are therefore simultaneously about displacing each other at the margins
      while all together evangelizing adoption against the far larger status-quo base. Roche's pending acquisition
      of PathAI has not yet closed as of the report date, so PathAI still operates as an independent entity in
      its commercial relationships; the combined competitive posture post-close is anticipated but not yet realized.
    claimRefs:
      - CP001
      - CP006
      - CP019
      - CP040
      - CP036
