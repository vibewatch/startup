chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The AI-powered digital pathology market is estimated at USD 2.01 billion in 2026 (Mordor Intelligence)
    growing at a 9.9% CAGR to 2031, but analyst estimates diverge sharply—Fortune Business Insights puts
    the same market at USD 1.47 billion with an 18.56% CAGR, reflecting inconsistent scope definitions that
    make precise sizing difficult. The computational/AI pathology software subset (PathAI's closer analogy)
    is estimated at USD 728–798 million in 2026, while the adjacent companion diagnostics market is at
    USD 9.56–11.2 billion. Adoption remains in early stages with fewer than 15% of US healthcare
    organizations having selected a digital pathology vendor per KLAS 2026, held back by a CMS reimbursement
    Catch-22, high capex, and interoperability fragmentation.

sections:
  - id: market-boundary
    title: Market Boundary and Taxonomy
    body: >-
      PathAI competes across three overlapping market perimeters that are often conflated in analyst reports:
      AI-powered digital pathology workflow software (the clinical segment anchored by AISight), computational
      pathology analytics sold to biopharma sponsors (the research/drug-development segment), and AI-enabled
      companion diagnostic tools co-developed with pharma partners (a regulatory product category). These
      perimeters share technology but differ sharply in buyer, budget, regulatory pathway, and revenue model.
      The clinical workflow segment covers whole-slide image management, AI diagnosis modules, cloud storage,
      and interoperability layers—but explicitly excludes scanner hardware, manual microscopy equipment, routine
      laboratory information systems without imaging capability, and professional pathologist billing. The
      biopharma analytics segment covers spatial biomarker quantification, digital tissue archives, and
      trial endpoint packages sold to pharma R&D teams—it is not reimbursed by payers and is not subject
      to FDA 510(k) clinical device regulation. The companion diagnostics segment is a distinct regulated
      product class where an AI biomarker test is co-labelled with a therapy, requiring a separate PMA or
      510(k) submission. Status-quo substitutes for all three segments include manual glass-slide microscopy,
      outsourced histopathology laboratories, and contract research organizations providing histology services.
      Digital pathology historically progressed in adoption stages: scanner hardware first, then image
      management systems, then AI-integrated clinical workflows—meaning PathAI enters different buyers at
      different stages of their digitization journey.
    claimRefs:
      - CM015
      - CM016
      - CM023
    tableRefs:
      - TM001

  - id: market-sizing
    title: Market Sizing and Contradictory Estimates
    body: >-
      Multiple analyst firms have sized the digital pathology market with estimates for 2026 that diverge
      by more than 35%, reflecting inconsistent definitions of hardware versus software versus services scope.
      Mordor Intelligence, in a January 2026 press release, values the total digital pathology market at
      USD 2.01 billion in 2026, growing to USD 3.21 billion by 2031 at a 9.9% CAGR. Fortune Business
      Insights reports a more aggressive growth trajectory, sizing the market at USD 1.47 billion in 2026
      and projecting USD 5.75 billion by 2034 at an 18.56% CAGR. Signify Research, whose methodology is
      disclosed as including proprietary surveys, projected the market would grow to approximately USD 2.1
      billion cumulatively from 2024 through 2029—a different scoping convention. The computational or AI
      pathology software subset (excluding scanner hardware) is sized at USD 798 million in 2026 per Coherent
      Market Insights and USD 728 million in 2025 per Grand View Research, both projecting approximately
      9.2–9.3% CAGR to 2033. This software-only lens is arguably more relevant to PathAI's revenue model
      than the all-inclusive hardware-and-services figures. The adjacent companion diagnostics market—where
      AI biomarker tools support targeted therapies—is substantially larger, at USD 9.56 billion in 2025
      per Grand View Research growing at 10.07% CAGR to 2033, versus Precedence Research's USD 11.20 billion
      in 2026 at 12.18% CAGR. The companion diagnostics market includes assays, reagents, PCR, and NGS
      platforms far beyond AI pathology software, but oncology's share (approximately 60% per research) is
      the relevant overlap with PathAI's clinical and pharma-facing algorithms. No analyst has published
      a clean PathAI-specific SAM or SOM estimate in this run; any such number would be highly speculative
      given the pending Roche acquisition and undisclosed private revenue.
    claimRefs:
      - CM001
