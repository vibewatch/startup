callouts:
  - calloutType: risk
    title: CMS Reimbursement Catch-22 Constrains Lab Market Growth
    body: >-
      The absence of permanent CMS Category I reimbursement for digital pathology CPT add-on codes is the
      single most consequential near-term constraint on PathAI's clinical lab addressable market. Only 1.1%
      of eligible encounters used the digital pathology codes in 2024, and CMS will not upgrade the codes
      until utilization rises—a self-reinforcing trap. Until reimbursement is resolved (DPA targets
      2026–2028), most clinical labs cannot justify the capex required for full DP deployment,
      meaning PathAI's Labcorp and MedStar deployments remain outlier early adopters rather than
      indicators of broad market pull-through.
    claimRefs:
      - CM026
      - CM027
      - CM028

  - calloutType: insight
    title: PathAI's Roche Acquisition Validates Market But Removes Independent Sizing Signal
    body: >-
      Roche's agreement to acquire PathAI for USD 750 million upfront plus up to USD 300 million in
      milestones implicitly endorses the thesis that AI-powered digital pathology commands a premium
      valuation within the USD 2B+ and growing market. However, the pending acquisition also removes
      the clearest independent signal of PathAI's financial trajectory: once closed, revenue will be
      consolidated into Roche's diagnostics division and no longer separately disclosed, making future
      market-share analysis harder for independent researchers.
    claimRefs:
      - CM001
      - CM025

