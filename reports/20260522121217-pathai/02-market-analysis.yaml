  - id: adoption-constraints
    title: Adoption Constraints and Diligence Gaps
    body: >-
      Despite strong structural tailwinds, digital pathology faces a cluster of adoption constraints that
      collectively explain why fewer than 15% of US healthcare organizations have selected a vendor in 2026.
      The most consequential is the CMS reimbursement Catch-22: digital pathology add-on CPT codes introduced
      in 2023 (Category III, 0751T–0763T) show only approximately 1.1% utilization in 2024 CMS data—almost
      certainly under-reported because labs lack incentive to report codes that carry no payment. CMS has
      stated it will not elevate these codes to permanent Category I status until utilization appears
      "meaningful," trapping adoption in a self-fulfilling loop. The Digital Pathology Association's
      Reimbursement Task Force acknowledged this explicitly in a Q1 2026 update and partnered with healthcare
      consulting firm McDermott+ to advocate for policy change. Second, whole-slide scanner capex of $250,000
      to $500,000 or more per scanner, combined with storage and software costs, requires capital budget
      approval and ROI justification that smaller or financially constrained labs cannot easily provide.
      Third, LIS and EHR interoperability remains fragmented: DICOM WSI standards are only now reaching
      production-ready multi-vendor maturity in 2026 per Meditecs, and integration with Epic, Cerner, or
      Sunquest LIS platforms is complex and not yet standardized. Fourth, labs must perform analytical and
      clinical validation for each AI algorithm they deploy—a time-consuming process that can take months
      and requires dedicated pathology and IT resources. Fifth, the 2025 MDPI study co-authored by AstraZeneca
      and Health Advances identified financial concerns, workflow disruption, and regulatory uncertainty as
      the top three barriers, adding peer-reviewed weight to the adoption challenge. The 2026 Medicare
      Physician Fee Schedule included efficiency adjustments and practice expense redistributions that ASCP
      argues will negatively affect facility-based specialists including pathologists, potentially reducing
      lab budgets for discretionary technology investments.
    claimRefs:
