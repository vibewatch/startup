  evidenceGaps:
    - type: missing-source
      severity: material
      topic: adoption-barriers
      missingEvidence: >-
        Systematic ROI data from community hospital digital pathology deployments—specifically
        capex-to-throughput ratios, payback period, and post-implementation case volume changes
        at smaller labs with fewer than 25,000 annual cases.
      whyItMatters: >-
        Without concrete ROI evidence at community scale, PathAI's TAM expansion beyond large
        reference labs and academic centers cannot be validated; the addressable clinical market
        may be significantly smaller than headline analyst estimates.
      diligencePath: >-
        Request PathAI/Roche to disclose anonymized deployment economics from Labcorp nationwide
        rollout; seek published ROI studies from DPA or CAP; review any customer case studies
        PathAI has published post-FDA clearance.
      relatedQuestionRefs:
        - QM020

    - type: enumeration-incomplete
      severity: minor
      topic: non-oncology-adoption
      missingEvidence: >-
        Market sizing and penetration data for digital pathology AI in non-oncology disease areas
        such as dermatopathology, nephropathology, and neuropathology.
      whyItMatters: >-
        If AI pathology adoption is concentrated in oncology (breast, prostate, lung), the long-term
        SAM growth may be slower than total market CAGR suggests, and PathAI's algorithm roadmap
        diversity matters for TAM expansion claims.
      diligencePath: >-
        Survey PathAI's published algorithm catalog and clinical deployment scope; review Ibex and
        Paige.ai regulatory filings for non-oncology algorithms to benchmark the category.
      relatedQuestionRefs:
        - QM025

    - type: private-evidence-only
      severity: material
      topic: pharma-r-and-d-spend
      missingEvidence: >-
        Disclosed pharma and biopharma spend on AI pathology tools specifically—current data
        is only available at broad R&D budget level without AI pathology as a distinct line item.
      whyItMatters: >-
        Without a credible pharma-specific spend estimate, PathAI's biopharma SAM sizing cannot
        be validated; the Roche acquisition rationale cites CDx but no third-party quantifies the
        commercial opportunity size for PathAI's pharma services specifically.
      diligencePath: >-
        Seek disclosures from pharma CDx program budgets in SEC filings; survey CRO pricing for
        AI-assisted tissue analysis to infer demand; review PathAI publications disclosing
        number of active pharma partnerships.
      relatedQuestionRefs:
        - QM011

    - type: missing-source
      severity: minor
      topic: validation-timeline
      missingEvidence: >-
        Quantitative data on typical pathology AI algorithm validation timelines at US clinical labs—
        specifically, average elapsed time from vendor contract to go-live for a new AI algorithm.
      whyItMatters: >-
        Validation duration directly affects PathAI's revenue recognition timing and competitive
        moat: if validation takes 12–18 months, installed-base lock-in is high but new customer
        acquisition is slow.
      diligencePath: >-
        Request PathAI to disclose average time-to-activation metrics from Labcorp and MedStar
        deployments; review CAP/ASCP validation guidance documents for algorithmic pathology tools.
      relatedQuestionRefs:
        - QM024
