callouts:
  - calloutType: risk
    title: Labcorp / Quest channel concentration is PathAI's primary customer risk
    body: >
      Two accounts — Labcorp and Quest Diagnostics — represent PathAI's entire confirmed US commercial reference-lab footprint.
      Labcorp's nationwide rollout is the single largest deployment proof event in PathAI's history, which makes it both the strongest
      clinical validation and the most dangerous single point of revenue concentration. Post-Roche acquisition, Labcorp's commitment
      to the AISight platform will depend on integration decisions made by Roche — a risk that is externally visible but unquantified.
    claimRefs:
      - CU025
      - CU033
      - CU029

  - calloutType: risk
    title: Retention and satisfaction data are fully opaque
    body: >
      PathAI publishes no NRR, GRR, churn rate, customer satisfaction score, or cohort metric. The absence of adverse public disclosure
      is not equivalent to confirmed retention. Diligence must obtain contractual retention data, reference checks with named customers,
      and clarity on whether Roche's acquisition affects existing multi-year agreements.
    claimRefs:
      - CU018
      - CU023

  - calloutType: insight
    title: Digital pathology market penetration is still below 15%, creating long expansion runway
    body: >
      KLAS Research (February 2026) found fewer than 15% of US healthcare organizations had adopted any digital pathology vendor.
      PathAI's current named deployments are concentrated in large reference labs and academic centers. Community labs represent
      the largest volume tier in US pathology but remain largely unserved — a structural growth opportunity contingent on solving
      scanner cost, reimbursement, and integration barriers.
    claimRefs:
      - CU026
      - CU027
      - CU028

