  - id: named-customer-proof-and-adoption-trajectory
    title: Named customer proof and adoption trajectory
    body: >
      The strongest named customer proof for PathAI is Labcorp's February 2026 announcement of a nationwide AISight Dx expansion across
      its entire U.S. anatomic pathology network and hospital collaborations. Labcorp's investor relations press release confirms this as
      an expansion of a pre-existing collaboration, signaling a multi-year durable relationship, not a pilot. MedStar Health's April 2026
      multi-year strategic partnership — deploying AISight Dx and AIM algorithms (ArtifactDetect, TumorDetect) across multi-site labs
      supporting 40+ pathologists — is the second-strongest health-system proof event, and the press release quotes MedStar pathology
      leadership directly. University Hospital Zurich's January 2026 deployment of AISight Dx and AIM-TumorCellularity for routine clinical
      molecular pathology workflows is the most substantive EU clinical-routine deployment evidence: USZ's head of pathology is quoted,
      and Zurich published preliminary clinical evaluation data at USCAP and ECP. UMC Utrecht in December 2025 selected AISight Dx for
      AI algorithm research, qualifying as an academic-center deployment with research-use framing. Moffitt Cancer Center (August 2025)
      and Northwestern Medicine (June 2025) announced multi-year strategic collaborations with co-development components — production
      deployment is underway but specific utilization metrics have not been published. Quest Diagnostics' 2024 IR filing confirms AISight
      licensing as part of the Memphis lab acquisition; Quest's position as a preferred provider for PathAI's biopharma clinical lab
      services creates a structural dependency that extends the relationship beyond a pure licensing agreement. CBInsights lists Hoag
      Memorial Hospital Presbyterian, Discovery Life Sciences, Vizia Diagnostics, and Quantum Pathology as additional named customers,
      though depth of deployment for these is not publicly confirmed. PathAI's clinical trial platform for biopharma is backed by the
      February 2026 launch of AIM-HI UC and IBDExplore, developed in partnership with the FNIH Biomarkers Consortium and multiple life
      science companies for IBD clinical trial endpoints.
