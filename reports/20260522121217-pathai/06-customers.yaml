chapter:
  number: 6
  title: Customers
  summary: >
    PathAI's named customer base spans four segments — national reference labs, health systems, academic and cancer centers, and biopharma —
    with Labcorp's February 2026 nationwide AISight Dx rollout and MedStar Health's April 2026 multi-site deployment representing the
    strongest production-proof events on the clinical side. Biopharma engagement is broad but largely undisclosed; PathAI claims relationships
    with the majority of the top-15 global pharma companies, and AIM-HI UC / IBDExplore (2026) and AIM-MASH (DDT qualified) anchor
    the clinical trial platform. Retention data is opaque — no NRR, GRR, or cohort metrics are publicly available — but repeat partnership
    expansions (Labcorp, Roche, MedStar EAP to production) provide proxy evidence of durable engagement. Material concentration risk
    exists: Labcorp and Quest together represent the dominant share of US commercial lab access, and fewer than 15% of US healthcare
    organizations had adopted any digital pathology vendor as of early 2026.

sections:
  - id: customer-base-segmentation
    title: Customer base segmentation
    body: >
      PathAI operates across four primary customer segments differentiated by buyer, use case, and product surface. The first segment
      is national reference labs and independent pathology labs — Labcorp and Quest Diagnostics are the two anchors. Labcorp uses AISight
      Dx for nationwide clinical digital pathology workflows; Quest licensed AISight in 2024 as part of a $100 million acquisition of
      PathAI Diagnostics, retaining ongoing licensing rights for its own labs. This segment is the most commercially visible but also the
      most concentrated: Labcorp and Quest together represent the majority of the US reference lab market for anatomic pathology, creating
      channel dependence. The second segment is multi-site health systems — MedStar Health (40+ pathologists across multiple sites), Northwestern
      Medicine (95 pathologists across 11 hospitals), and Hoag Memorial are named deployments. Health system buyers require LIS integration,
      HIPAA compliance, and multi-site coordination, making procurement complex but contracts multi-year. The third segment is academic and
      precision oncology centers — University Hospital Zurich, University Medical Center Utrecht, and Moffitt Cancer Center have confirmed
      deployments. These buyers are primarily research-driven, use AISight Dx alongside AIM algorithms for biomarker discovery, and feed into
      the PathAI Precision Pathology Network. The fourth segment is biopharma and pharma — the oldest commercial relationship category for
      PathAI. PathAI claims relationships with the majority of the top-15 global pharma companies for clinical trial support, AIM tool use,
      and companion diagnostic co-development. Roche, PathAI's acquirer, started as a biopharma collaboration partner in 2021. The buyer
      for biopharma is typically a clinical operations or precision medicine function, with products being the AISight Clinical Trials Platform,
      AIM-MASH, AIM-TumorCellularity, and the newly launched AIM-HI UC and IBDExplore tools.
