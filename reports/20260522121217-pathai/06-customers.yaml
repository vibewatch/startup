  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion Driver / Concentration Risk
      - Type
      - Impact
      - Diligence Path
    rows:
      - - Labcorp + Quest dual dependence
        - Concentration risk
        - Two accounts control the majority of US reference lab access; Labcorp national rollout = single-account exposure at scale
        - Request % revenue from top-3 customers; assess what happens if Labcorp renegotiates post-Roche integration
      - - Biopharma customer concentration (unknown)
        - Concentration risk
        - Undisclosed; if 2–3 sponsors = majority of biopharma revenue, loss of one trial program = material impact
        - Request biopharma customer count, top-3 concentration, contract length distribution
      - - Precision Pathology Network (PPN) enrollment
        - Expansion driver
        - PPN raises switching cost for member labs; data-sharing flywheel could accelerate algorithm improvement
        - Request PPN member count, data contribution volume, and biopharma matchmaking revenue generated
      - - Community pathology lab untapped market
        - Expansion driver (long runway)
        - Fewer than 15% of US orgs adopted digital pathology; community labs = largest volume tier
        - Assess whether PathAI's per-slide economics and hardware requirements can serve community labs
      - - Reimbursement uncertainty (US clinical)
        - Concentration risk (procurement barrier)
        - No dedicated CPT code for AI-assisted digital pathology; limits ROI case for non-large-lab buyers
        - Monitor CMS coverage decisions; assess whether Labcorp / Quest contracts include AI algorithm billing
      - - Roche acquisition integration risk
        - Concentration risk
        - Post-close, PathAI roadmap aligns to Roche priorities; existing customers on non-Roche scanners face uncertainty
        - Assess existing customer contracts for change-of-control clauses; map scanner fleet overlap
    notes: "Risk/driver classification is qualitative. Impact assessments are derived from public evidence; none are verified by PathAI or customer disclosures. Reimbursement column reflects US clinical landscape as of May 2026 per KLAS Research and CLP Magazine."
