      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: CMS 报销 Catch-22 限制实验室市场增长
            body: >-
              数字病理 CPT 附加代码缺乏永久 CMS Category I 报销，是 PathAI 临床实验室可服务市场近期最关键的限制。2024 年只有 1.1% 的合格就诊使用了数字病理代码，而 CMS
              要等使用率上升才会升级代码——这是一个自我强化的陷阱。报销问题解决前（DPA 目标 2026–2028），多数临床实验室无法证明完整 DP 部署所需资本开支合理；这意味着 PathAI 在 Labcorp 和
              MedStar 的部署仍是少数早期采用者， 不能直接当作广泛市场拉动的信号。
