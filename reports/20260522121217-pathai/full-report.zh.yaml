      - number: '3.2'
        title: 竞争者画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              Paige 现在已并入 Tempus，源于 2025 年 8 月一笔 $81.25M 的收购；它曾是第一家获得两项 FDA 许可组织病理 AI 工具的公司， 并从 45 个国家近 7 million
              张数字化病理切片中建立数据位置。收购后，Tempus 在 2026 年初推出 “Paige Predict”—— 一款覆盖 16 种癌症类型、123 个生物标志物、来自超过 200,000
              个去标识化病例的多模态工具——把合并后实体定位为基础模型优先的肿瘤数据平台， 而不是纯工作流 IMS 玩家。收购价格明显低于 Paige 约 $241M 的累计融资；Signify Research
              将这个折价解读为证据： 没有大型分销伙伴的独立 AI 病理供应商面临结构性商业扩张障碍。Proscia 是美国临床市场中最常被引用的 PathAI IMS 替代方案（据 KLAS 2026）。公司 2025 年
              3 月融资 $50M，累计资本达到 $130M；其 Concentriq 平台拥有主要诊断 FDA 510(k) 许可（Concentriq AP-Dx，2024），并被全球前 20 大药企中的 16
              家使用。Proscia 报告称，Concentriq 每天支持超过 22,000 例患者诊断，并估计 2026 年收入约 $16.4M；其 Concentriq Embeddings 功能让药企客户的 AI
              模型开发加速 13x，是生物制药板块加深护城河的差异化因素。 Ibex Medical Analytics 2025 年 2 月获得首个 FDA 510(k) 许可（Ibex Prostate
              Detect，阳性预测值 99.6%，并证明能找回 13% 最初漏诊癌症），持有 CE-IVDR 认证，并报告进入 2026 年时客户同比增长超过 70%，平台病例量连续第二年翻倍。2026 年初，Ibex 与
              mTuitive 合作，把 AI 诊断发现自动填入结构化病理报告，扩大临床工作流足迹。Ibex 也在向生物制药扩张，通过 IHC 生物标志物量化支持抗体偶联药物开发。 Leica Biosystems 是
              Danaher 子公司，被 KLAS 2026 认定为美国临床扫描仪硬件的明确市场领导者，Aperio GT 450 DX 是主导性临床扫描仪。2026 年初，Leica 推出 Aperio GT Elite 和
              Aperio CS5，并与 Indica Labs 合作推出 Aperio HALO AP DX——一个完全集成的扫描仪-IMS-AI 诊断工作流，使 Leica 客户对 PathAI 或 Proscia
              这类独立 IMS 供应商的依赖降低。 Philips IntelliSite 在企业可靠性上得分正面，但 KLAS 指出，其 AI 集成速度落后于 PathAI 和 Proscia。PathAI 交割后，
              Roche 的 navify Digital Pathology IMS 将继承 PathAI 的 AISight 技术，并成为完整纵向栈的基础——扫描仪（Ventana/Roche）、
              IMS（navify/AISight）、AI 算法（PathAI）和伴随诊断（Ventana CDx）——使 Roche 成为唯一在每一层都拥有临床级资产的玩家。
