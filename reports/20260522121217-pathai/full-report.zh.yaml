      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              进入 Roche 收购阶段时，PathAI 可防守的护城河包括：（1）获得 FDA 许可的 AISight Dx IMS，带有已批准的预定变更控制计划（PCCP）——它允许算法更新走简化流程，
              无需完整重新提交，这是目前没有竞争者在 IMS 层面匹配的监管先发；（2）在 Labcorp（2026 年全国部署）和 MedStar 的嵌入位置，形成纯算法竞争者缺乏的临床数据飞轮和切换成本深度；（3）与
              Roche 多年生物制药 CDx 共同开发合作，早于收购存在，能在 CMS 报销解决之外提供收入稳定性；（4）开放、扫描仪无关的架构，不同于 Leica 硬件捆绑的 HALO AP DX，让 AISight
              可与多家扫描仪供应商集成。护城河耐久度分析也暴露出四项重要反证风险。第一，Tempus/Paige 合并后的数据位置——约 7 million 张切片、200,000+ 个多模态病例，以及 Tempus 与
              AstraZeneca 的 $200M 数据合作——可能追平或超过 PathAI 的自有切片库；如果 Roche 自己的数据池无法以相当速度扩张，CDx
              数据护城河会被侵蚀。第二，算法趋同是真实的：多家供应商在前列腺癌、 乳腺癌和结直肠癌上达到相近的诊断敏感性和特异性后，竞争差异越来越转向工作流、分销和监管基础设施，而不是算法准确率；这尤其威胁较小的独立 AI
              供应商，但也给所有玩家带来平台既有者风险。第三，扫描仪生态锁定是双刃剑：Leica Aperio 与 Indica Labs 联合开发的新 HALO AP DX 方案，降低了 Leica 扫描仪站点对
              PathAI AISight 这类独立 IMS 的需求，而 Leica 是美国主导性扫描仪基盘。交割后， Roche 是否有动力用 AISight 服务 Leica
              扫描仪客户（竞争者硬件），结构上并不确定。第四，CMS 报销缺口持续存在——2026 年仍只有 Category III 追踪代码——意味着临床 AI
              收入天花板取决于政策倡导结果，而没有任何供应商能控制它。利润率薄的实验室不愿采用不能产生可报销增量收入的数字病理基础设施， 限制了所有供应商的市场扩张；如果药企 R&D
              预算收缩，也会让生物制药相邻收入中的护城河耐久度承压。内部自建和开源路径（QuPath、MONAI
              Label）对具备数据科学能力的大型学术中心仍然可行，作为现状替代方案，会拖慢商业产品在高声誉机构中的采用，而这些机构往往承担早期临床验证研究。
