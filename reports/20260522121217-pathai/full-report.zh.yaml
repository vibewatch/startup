      - number: '1.2'
        title: 创始人、管理层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层记录足以识别控制点，但还不足以排除集中风险。PathAI 当前公开领导层片段列出 Andy Beck 为 CEO 兼联合创始人，并列出 Brandon Eldredge、Liz Storti、Eric
              Walk、Nick Brown 和 Chris Kirby 分管财务、 人才、医疗、增长和法务。创始人连续性最强的仍是 Beck 和 Aditya Khosla。2021 年融资稿仍称 Khosla
              为联合创始人兼 CTO；MIT 托管的个人履历则称他为 PathAI 创始人 / CTO，并拥有计算机视觉和机器学习博士学位。 这组搭档给公司提供了清晰的“医学 +
              AI”起源叙事，但也意味着，公开材料中支撑战略和技术可信度的叙事仍高度依赖两位创始人。 已抓取的官方页面没有给出干净的现任董事会名单，因此执行层以下的治理仍是真实尽调缺口，而不是公开披露已经打勾的问题。
