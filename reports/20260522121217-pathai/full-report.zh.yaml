      - number: '4.3'
        title: 资本充足性与交易经济性
        blocks:
          - type: paragraph
            body: >
              PathAI 从创立到 2021 年的资本历史记录充分。PathAI 自己的新闻稿确认，2021 年 5 月公司完成 $165 million C 轮，由 D1 Capital Partners 和 Kaiser
              Permanente 共同领投；加上此前 $75 million B 轮和 $11 million A 轮，已披露融资总额至少 $251
              million。公司概况章节承载了完整逐轮时间线；本章为了满足财务章节必须有本地 sourceRefs 的门槛，从同一批底层来源铸造本地 claims。 2024 年，Quest Diagnostics 以全现金
              $100 million 购买部分 PathAI Diagnostics 实验室资产，资本图景随之明显改变——Quest 2024 财年 Form 10-K（SEC EDGAR
              文件）确认了这一点。这次剥离带来明确营运资本注入；Quest 交割新闻稿称，资金用于“支持 PathAI 扩大 AI
              技术投入，并扩展其软件和算法业务的战略”。目前现金余额、烧钱速度或现金跑道没有公开披露；可得证据无法量化独立资本充足性。待完成的 Roche 收购包含 $750 million 预付款（另有最高 $300
              million 里程碑款），实际上让现金跑道成为次要问题：如果交易如 Roche 和 PathAI 所述在 2026 年下半年交割，PathAI 将从依赖资本的私营公司转为 Roche Diagnostics
              子公司。隐含收入倍数——按估计 $100–108M 收入基数约 7–10×——落在合规、高增长数字健康平台的溢价区间，但没有经验证的独立收入，无法精确计算。总体结论是，PathAI
              看起来有足够资本撑到待完成交易： 公司已从 Quest 剥离获得 $100M，并有望从 Roche 获得 $750M；但若 Roche 未交割，独立现金充足性仍不透明。
