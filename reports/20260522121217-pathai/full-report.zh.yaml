companyProfile:
  summary: >-
    PathAI 是一家总部位于 Boston 的私营数字病理公司，2016 年由 Andy Beck 和 Aditya Khosla 创立。公司现在销售 AISight / AISight
    Dx——一套云原生数字病理图像管理和工作流平台，已获得 FDA 主要诊断许可——同时提供 AI 赋能应用、 生物制药 / 转化研究服务。2024–2026 年的公开证据显示，PathAI 正从研究驱动的病理 AI
    初创公司，转向拥有点名企业部署、 待完成 Roche 退出交易的合规病理基础设施公司；但独立收入、利润率、员工数和治理披露仍然明显不完整。
