        - 中
        - 跟踪 FDA 向 Proscia/Ibex 批准 PCCP 的比例；确认 Roche 整合后 PCCP 优势是否仍存在
      - - Roche 分销把 PathAI 触达放大到全球企业实验室
        - 收购后，Roche 可能优先向非 Roche 扫描仪客户推广 navify；AISight 的扫描仪中立性可能被削弱
        - 高
        - 收购完成后获取 PathAI 关于多扫描仪支持的路线图；核查 navify/AISight 集成条款
      - - 不绑定扫描仪的 PathAI IMS，相比 Leica 和 Roche 这类硬件捆绑方案有差异化
        - Leica Aperio HALO AP DX（与 Indica Labs 合作）会降低美国主流 Leica 扫描仪站点对独立 IMS 的需求
        - 高
        - 确认 Leica 扫描仪站点的 AISight 商业管线；评估 HALO AP DX 的临床采用速度
      - - PathAI/Roche 的 CDx 数据地位和生物医药合作深度，抬高了合作伙伴切换成本
        - Tempus/Paige 的合并数据集（约 7M 张切片、200K+ 个多模态病例）和 AstraZeneca 数据交易，冲击数据护城河
        - 高
        - 获取 PathAI 自有专有切片库总量；梳理前 5 大药企 CDx 合作合同和续约日期
      - - CMS Category III 代码只是追踪代码；数字病理 AI 还没有常规报销
        - 报销长期延迟会让临床 AI 价值主张商品化，并可能压低所有厂商的收入天花板
        - 高
        - 追踪 DPA 和 AMA 对 2027 年 CMS 编码提案的游说结果；监测转为 Category I 的时间线
      - - 生物医药伴随诊断共同开发，形成多年锁定收入，不依赖临床报销
        - Roche 之后，药企赞助方可能更偏向 Tempus/Paige 多模态方案，或选择渠道冲突更少的竞争对手
        - 中
        - 获取 PathAI 当前 CDx 管线合作伙伴名单；评估 Roche CDx 是否与 PathAI 现有药企关系冲突
      - - IMS 数据迁移成本和工作流重新验证，为已安装客户带来结构性切换成本
        - 市场成熟后，开放 DICOM/FHIR 互操作标准会逐步削弱专有锁定
        - 中
        - 评估 AISight 的 DICOM 符合深度；审查开源和标准组织的数字病理互操作路线图
      - - 各厂商算法趋同（前列腺、乳腺、结肠癌 AI），价值重心转向工作流和生态
        - 多家厂商的灵敏度和特异性接近，削弱纯 AI 差异化
        - 高
        - 追踪头对头基准论文；确认 PathAI 在共享癌种上相对 Ibex Prostate Detect 和 Paige Predict 的算法性能差异
    notes: >-
      严重性评级是基于现有证据权重的定性评估；「高」代表已有竞争动作或结构性市场动态支撑的威胁。「中」代表需要监测的潜在风险，但截至 2026 年 5
      月尚未确认反向变化。所有尽调问题都指向公开来源未提供、但达到承销级竞争评估必须取得的信息。
