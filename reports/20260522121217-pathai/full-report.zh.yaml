      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Paige 收购价格提示独立 AI 商业化天花板
            body: >-
              Paige 累计融资约 $241M，却以 $81.25M 被 Tempus 收购，约相当于投入资本每 1 美元收回 33 美分。Signify Research
              把这称为行业的“硬重置”，暗示没有大型诊断分销伙伴的独立数字病理 AI 面临结构性商业扩张障碍。这是 AI 病理平台独立商业可行性上最直接的反向信号；PathAI 待完成的 Roche
              收购，也应部分理解为对同一限制的承认。
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP036
              - CP040
          - type: callout
            title: CMS 报销缺口压住所有供应商的临床 AI 收入天花板
            body: >-
              截至 2026 年，CMS 数字病理报销仅限于追踪使用量的 Category III CPT 附加代码，没有全国 RVUs，也没有专业报销。2024 年只有约 1.1% 的合格程序通过这些代码捕获。Digital
              Pathology Association 正推动永久报销，但结果不确定。在常规报销出现之前， 临床实验室数字病理 AI 的收入模型依赖运营节省 ROI 和生物制药合同，而不是支付方增量收入；这是
              PathAI、Proscia、Paige 和 Ibex 共同面对的结构性限制。
            calloutType: risk
            claimRefs:
              - CP026
              - CP027
              - CP035
          - type: callout
            title: 整合后的格局更有利于纵向集成平台
            body: >-
              2025–2026 年两笔重大收购都把 AI 能力与大型诊断基础设施合在一起：Roche 收购 PathAI，以补齐扫描仪-IMS-AI-CDx 纵向栈；Tempus 收购
              Paige，以建设全球最大的肿瘤基础模型。剩余独立 AI IMS 玩家（Proscia、Ibex）需要找到可比的分销合作伙伴， 否则将面对 Paige 折价出售前同样的商业天花板风险。
            calloutType: insight
            claimRefs:
              - CP001
