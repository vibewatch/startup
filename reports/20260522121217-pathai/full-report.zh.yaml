      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              情景树分叉在两个连续二元事件上：交易是否交割（是 / 否），以及里程碑是否全部达成（全部 / 部分 / 无）。 乐观情景中，Roche 合并按公告在 H2 2026 交割，全部 $300 million
              里程碑因监管批准和商业表现被触发， PathAI 股东获得完整 $1.05 billion。按 $108 million 估计收入计算，这约为 9.7x EV/Revenue——如果伴随诊断和 AI
              病理市场按预期增长，且 PathAI 的生物制药合同在 Roche 网络内继续复利，这一溢价可以解释。

              基准情景中，交易按 $750 million 预付款交割。部分里程碑付款（$100–150 million）在交割后 24–36 个月窗口内， 由监管和商业触发条件赚取，总对价达到 $850–900
              million。鉴于可比诊断 M&A 交易通常只部分实现里程碑， 且尚未有反垄断反对被公开发出，这是最可能的情景。

              悲观情景中，交易要么完全失败（反垄断阻止、重大不利变化或重新谈判），要么以明显更低价格交割。若交易失败， PathAI 将独立留下，且没有已确认融资跑道。最佳可用独立可比是 Paige-Tempus
              先例：Paige 融资 $220M+， 最终以 $81.25M 被收购——相较披露融资额折价 63%——说明如果核心战略买方离场，FDA-cleared 数字病理 AI 也无法免疫困境退出定价。 若独立
              PathAI 按 5x 估计收入估值，约为 $540 million，但鉴于财务不透明，这一数字高度不确定；若没有 Roche 溢价而进入竞争性出售， 实际成交价可能明显更低。

              概率权重偏向基准情景。没有反垄断反对被公开宣布，Roche 在诊断收购上有强执行记录（Foundation Medicine、GenMark）， 而五年的既有合作大幅降低了集成逻辑风险。不可控变量是 $300
              million 里程碑部分；在不知道里程碑门槛前，应保守赋予概率。
