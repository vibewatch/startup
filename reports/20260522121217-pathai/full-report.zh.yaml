            title: 有条件正面——等待 H2 2026 交易交割
            body: >
              按 Roche 交易价格看，PathAI 属于有条件正面。$750 million 首付款是可信、战略上合理的锚点，也符合 AI 诊断可比交易。公开证据不足以把 $300 million
              里程碑款写进模型。若交割信号恶化，或经核实收入大幅不及预期，应立即重估。独立投资测算无法成立。
