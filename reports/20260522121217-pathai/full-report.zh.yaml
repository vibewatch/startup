      - number: '2.2'
        title: 市场规模与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              多家分析机构给出了 2026 年数字病理市场规模，但估算差距超过 35%，反映出硬件、软件和服务范围定义不一致。Mordor Intelligence 在 2026 年 1 月新闻稿中，将数字病理总市场估为
              USD 2.01 billion，并预计到 2031 年增至 USD 3.21 billion，CAGR 为 9.9%。Fortune Business Insights 给出更激进的增长路径：2026
              年市场规模 USD 1.47 billion，到 2034 年预计 USD 5.75 billion，CAGR 为 18.56%。Signify Research 披露的方法包含自有调研，其预测是 2024 到
              2029 年累计增长至约 USD 2.1 billion——这是另一套范围口径。计算病理或 AI 病理软件子集（排除扫描仪硬件）按 Coherent Market Insights 口径，2026 年为 USD
              798 million；按 Grand View Research 口径，2025 年为 USD 728 million，两者都预计到 2033 年 CAGR 约
              9.2–9.3%。这个只看软件的镜头，可能比囊括硬件和服务的数字更贴近 PathAI 的收入模型。相邻的伴随诊断市场更大——AI 生物标志物工具在其中支持靶向疗法——Grand View Research 估算
              2025 年为 USD 9.56 billion，到 2033 年 CAGR 为 10.07%；Precedence Research 则给出 2026 年 USD 11.20 billion、CAGR
              12.18%。伴随诊断市场包含检测、试剂、PCR 和 NGS 平台，范围远超 AI 病理软件，但肿瘤学份额（研究称约 60%）才是与 PathAI 临床和面向药企算法的相关重叠。此轮没有任何分析师发布干净的
              PathAI 专属 SAM 或 SOM 估算；鉴于 Roche 收购仍待完成且私有收入未披露，任何这类数字都将高度投机。
