        - 直接竞品 — AI IMS 平台
        - 已融资 $240M+；Roche 收购预付款 $750M
        - 临床实验室、生物制药、伴随诊断
        - AISight Dx 获 FDA 许可且带 PCCP；已在 Labcorp/MedStar 部署；Roche CDx 管线
        - 标价未披露；交割后与扫描仪生态的协同仍不确定
      - - Paige (Tempus)
        - 直接竞品 — AI 算法 + 多模态
        - 已融资 $241M；2025 年 8 月以 $81.25M 被收购
        - 临床实验室、药企研发、肿瘤学数据
        - 首批 2 个获 FDA 许可的组织病理 AI 工具；~7M 张切片数据集；Paige Predict 多模态
        - 收购价格显著低于已融资本金；收购前商业化扩张有限；与 Tempus 整合后 IMS 角色不清楚
      - - Proscia (Concentriq)
        - 直接竞品 — AI IMS 平台
        - 已融资 $130M；2026 年收入估计约 $16.4M
        - 药企研发、临床实验室
        - AP-Dx IMS 获 FDA 许可（2024）；20 家头部药企中的 16 家使用；每日 22K+ 次诊断；Concentriq Embeddings 将 AI 开发速度提升 13x
        - 无扫描仪硬件；定价未披露；CMS 报销约束对所有厂商共同存在
      - - Ibex Medical Analytics
        - 直接竞品 — AI 算法 + 结构化报告
        - 融资未披露；2025–2026 年客户同比增长 >70%
        - 临床实验室（前列腺 / 乳腺 / 胃）、生物制药
        - Prostate Detect 获 FDA 许可（2025 年 2 月）；CE-IVDR；99.6% PPV；2026 年 mTuitive 结构化报告
        - 美国装机基础小于 PathAI/Proscia；定价未披露；IMS 能力不是主要产品
      - - Roche / Ventana / navify 组合
        - 既有厂商 — 扫描仪 + IMS + 伴随诊断
        - Roche Diagnostics 事业部；2025 年集团收入 CHF 58B+
        - 大型全球实验室、药企、伴随诊断项目
        - 端到端垂直栈：扫描仪 + navify IMS + CDx；全球分销；收购 AI 能力（PathAI）
        - PathAI 收购后的整合风险；历史上扫描仪客户满意度低于 Leica（KLAS）
      - - Leica Biosystems (Aperio)
        - 既有厂商 — 扫描仪硬件 + 捆绑 IMS
        - Danaher 子公司；据 KLAS 2026，在美国临床扫描仪市场份额占优
        - 高通量临床实验室（美国为主）
        - Aperio GT 450 DX/GT Elite 是市场领先扫描仪；HALO AP DX 与 Indica Labs 配合，支撑一体化数字诊断工作流
        - IMS 功能深度不如 PathAI/Proscia 专精；需要硬件资本开支；Aperio 生态限制扫描仪无关兼容性
      - - Philips Digital Pathology (IntelliSite)
        - 既有厂商 — 企业 IMS + 扫描仪
        - Royal Philips 子公司；大型企业客户基础
        - 大型学术医学中心、企业级医疗系统
        - 企业级可靠性；可扩展云平台；继承 PACS / 放射科集成能力
        - AI 功能集成速度被评为慢于 PathAI/Proscia（KLAS 2026）；专科病理聚焦较弱
      - - Visiopharm / Indica Labs
        - 相邻厂商 — 研究 AI 分析 + IMS
        - 私营；研究阶段收入；Indica 融资金额未披露
        - 药企研发、学术研究、临床前
        - HALO AI 分析；HALO Link IMS；集成 Visiopharm Discovery AI；互操作优先
        - 以研究用途为主；临床 FDA 许可有限；不是初次诊断 IMS
      - - 现状（手工显微镜 / 外包 CRO）
        - 替代方案
        - N/A — 尚未数字化的所有实验室既有工作流
        - 没有数字病理承诺的所有实验室
        - 无需资本支出；工作流熟悉；没有新增监管风险；没有实施负担
        - 没有 AI 效率或规模；病理医生短缺压力；玻璃切片不适合远程会诊
      - - 学术 / 内部自建 AI
        - 替代方案
        - N/A — 资源密集；Mayo Clinic / MSKCC / Johns Hopkins 类项目
        - 具备数据科学能力的大型学术医学中心
        - 完全掌控数据；拥有 IP；按本地患者人群定制；可参与联邦学习
        - 临床部署有监管负担；资源密集；不适合常规或中型实验室
    notes: >-
      融资数据来自官方公告和新闻稿；收入估计为第三方分析师估计（Compworth/Tracxn），未获公司确认。Roche/Ventana/navify 行把 Roche 视作 PathAI
