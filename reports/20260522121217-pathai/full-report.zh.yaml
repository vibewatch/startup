        - 需要搭建 HL7 接口；传统 LIS 可能需要中间件
      - - 切片数字化
        - 在扫描仪工作站手动发起扫描
        - 通过扫描仪集成，将条码匹配的文件上传到 AISight 云
        - 免去手工文件传输；把切片连接到病例
        - Dx 用途限于 PCCP 核准的扫描仪型号
      - - AI 分诊和病例优先级
        - 病理医生手工分配队列
        - AI 分配紧急度，自动路由高优先级病例
        - 支持工作量均衡；缩短周转时间
        - AI 分诊准确性数据尚无独立发表
      - - 主要诊断审阅
        - 用显微镜审阅玻片
        - 基于浏览器的查看器，带 AI 叠加层、注释和多人使用
        - 远程访问；实时协作；带注释的 AI 发现
        - 表现取决于显示校准和 PCCP 合规
      - - 肿瘤委员会和会诊
        - 打印切片照片或运输切片
        - 同步多切片导航；动态演示队列
        - 数字病例共享免去实体切片物流
        - 大型图像文件需要足够网络带宽
      - - 生物医药生物标志物检测（AIM-MASH）
        - 专家病理医生手工进行 H&E 评分（NASH CRN）
        - AIM-MASH AI 评分脂肪变性、气球样变、炎症、纤维化
        - 可复现、获 FDA/EMA 认定的 DDT 生物标志物评分
        - 仅限 MASH 临床试验场景；不是独立 Dx
      - - 临床试验组织 QC（AIM-TC）
        - 病理医生手工估算肿瘤细胞含量
        - AIM-TC 覆盖 14+ 种肿瘤类型的全切片定量
        - 为 NGS 组织充足性决策提供标准化输入
        - 未获 FDA 批准作为独立诊断工具
