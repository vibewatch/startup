      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >
              AISight 以 SaaS 形式部署在 Amazon Web Services 上，实验室除了全切片成像扫描仪之外，无需投入本地服务器即可启用。 平台用 HL7 消息做双向 LIS 同步；LigoLab
              记录的集成案例显示，标本医嘱从 LIS 流入 AISight， 结果再回传，形成闭环工作流。PathAI 在 2023 年底宣布支持 DICOM（包括 DICOMweb API），承诺与大型医疗系统常见的
              VNA/PACS 环境实现企业图像架构互操作。2023 年 9 月推出的 AISight Link 是 PathAI 的开放 API 框架， 可把 PathAI 原生和第三方 AI
              算法直接接入阅片和报告工作流。平台阅片器支持多切片同步导航、标注、实时协作和 AI 叠加层渲染，供病理医生复核。面向生物制药客户，PathAI 另有一间 GCLP 认证组织病理实验室（2022 年建成）， 在
              SaaS 路径之外支持基于组织的临床试验服务。扫描仪生态受限：最初的 FDA clearance 只列明 Hamamatsu NanoZoomer S360MD 和 Leica Aperio GT 450
              DX；2025 年 8 月，依托 PCCP 的扩展加入了 Roche VENTANA DP 200 和 DP 600。继续增加扫描仪型号需要按 PCCP 文件完成验证周期，PathAI
              因此在结构上依赖扫描仪生态以及 Roche/Leica/Hamamatsu 伙伴关系。AWS 部署让平台能扩展到全国实验室网络（Labcorp 的全国铺开已经证明），
              但也要求云基础设施和带宽条件，小型实验室未必容易满足。
