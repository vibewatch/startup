      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              PathAI 的伙伴架构造成结构性集中问题。Labcorp 2026 年 2 月在全国部署 AISight Dx，Quest Diagnostics 2024 年收购 PathAI 的 Memphis
              实验室（外加授权协议和首选提供方身份），这意味着两家公司合计控制了 PathAI 美国临床分销渠道的大部分。 如果任何一段关系恶化——无论是合同不续、服务水平争议，还是 Roche 收购后的变化——PathAI
              都会面临实质性收入和渠道中断， 且短期内没有同等规模的替代渠道。Labcorp 也是 Series C 投资者，短期利益一致，但如果 Roche 所有权改变合作动态， 也可能出现潜在冲突。

              Roche 收购本身是 PathAI 的主导依赖。作为待交割收购方，Roche 同时是客户、技术伙伴和财务退出路径。若交易被阻止或实质延迟到 H2 2026 之后，PathAI
              必须在没有披露独立融资跑道的情况下继续独立运营，管理团队也会因数月交易执行而分心。 交割后的集成风险同样真实：把 PathAI 吸收到 Roche Diagnostics
              的汇报结构里，可能拖慢产品路线图决策，并造成文化错位。

              PathAI 的生物制药渠道很广，但不透明。公司称其与全球前 15 大制药公司中的多数有关系，但没有披露任何单个生物制药客户的收入占比或合同期限。
              少数大型生物制药账户很可能构成这一收入流的大部分，若没有内部数据，集中度风险无法完整评估。扫描仪供应商依赖又增加技术风险： AISight Dx clearance 覆盖 Leica Aperio GT 450
              DX、Hamamatsu NanoZoomer S360MD，以及 Roche VENTANA DP 200/600。 KLAS 报告的 Roche 扫描仪可靠性不满，形成 PathAI
              无法完全控制的云平台依赖；收购后，Roche 扫描仪产品路线图变成内部事项， 这一点尤其突出。
