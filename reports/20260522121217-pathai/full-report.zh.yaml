      - number: '6.2'
        title: 具名客户证据与采用轨迹
        blocks:
          - type: paragraph
            body: >
              PathAI 最强的具名客户证据，是 Labcorp 在 2026 年 2 月宣布把 AISight Dx 扩展到其整个美国解剖病理网络和医院合作项目。 Labcorp
              的投资者关系新闻稿确认，这是既有合作的扩展，传递出的信号是多年期、耐久的关系，而不是试点。 MedStar Health 2026 年 4 月的多年期战略合作——在支持 40+ 名病理医生的多站点实验室部署
              AISight Dx 和 AIM 算法（ArtifactDetect、TumorDetect）——是第二强的医疗系统证据事件，新闻稿还直接引用了 MedStar 病理领导层。 University
              Hospital Zurich 于 2026 年 1 月把 AISight Dx 和 AIM-TumorCellularity 用于常规临床分子病理工作流， 这是最实质性的欧盟临床常规部署证据：USZ
              病理负责人被引用，Zurich 还在 USCAP 和 ECP 发布了初步临床评估数据。 UMC Utrecht 于 2025 年 12 月选择 AISight Dx 用于 AI
              算法研究，可归为带研究用途定位的学术中心部署。 Moffitt Cancer Center（2025 年 8 月）和 Northwestern Medicine（2025 年 6
              月）宣布多年期战略合作，并带有共同开发内容—— 生产部署正在推进，但尚未发布具体使用指标。Quest Diagnostics 的 2024 年 IR 文件确认，AISight 授权是 Memphis
              实验室收购的一部分； Quest 作为 PathAI 生物制药临床实验室服务首选提供方，形成了超出单纯授权协议的结构性依赖。CBInsights 还列出 Hoag Memorial Hospital
              Presbyterian、Discovery Life Sciences、Vizia Diagnostics 和 Quantum Pathology 等其他具名客户， 但这些部署深度未获公开确认。PathAI
              面向生物制药的临床试验平台，由 2026 年 2 月推出的 AIM-HI UC 和 IBDExplore 支撑； 这两项工具与 FNIH Biomarkers Consortium
