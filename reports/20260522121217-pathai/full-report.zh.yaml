      - number: '7.4'
        title: 财务、模型与执行风险
        blocks:
          - type: paragraph
            body: >
              PathAI 的财务画像几乎完全不透明。公司没有公开披露 ARR、烧钱速度、毛利率或单位经济指标；公司仍为私有，正在推进的 Roche 收购也消除了交割前披露财务的动力。Roche 的 $750M
              预付款隐含一个交易倍数，但最高 $300M 的里程碑结构形成交割后的或有敞口； 在不知道具体里程碑定义和概率的情况下，无法给它估值。如果交易交割偏晚，PathAI 将面临更长时间的不确定性：
              员工留存压力、无法宣布新的战略合作，以及过渡期潜在营运资本约束。

              集成执行是交易后最大的风险。把一家 500 至 750 人的 AI 公司并入 Roche 45,000 人的 Diagnostics 部门，需要谨慎对齐产品路线图、 决定汇报结构，并留住关键 AI 工程师和
              medical affairs 人才。PathAI 创始人 Andy Beck（CEO、co-founder）和 Aditya
              Khosla（co-founder、CTO）推动了公司的科学可信度和商业战略。若任何一人在收购后离开或转入弱化角色， PathAI 就有可能失去在大型企业结构中维持 AISight
              路线图所需的内部倡导和技术连续性。

              报销不确定性给 PathAI 的临床 SaaS 收入加了天花板。只要数字病理 Category III codes 没有 RVU 赋值， 医院实验室就缺少为 AISight 部署成本提供直接 Medicare
              收入依据的理由。PathAI 自己的 CMS 倡议正确指出， 报销是主要商业瓶颈，但 CMS 规则制定周期意味着任何 Category I code 路径至少还要数年。医疗行业数据泄露发生频率和严重程度都在上升；
              临床试验组织数据处理是高价值攻击面，需要持续的 HIPAA 和 GDPR 控制。
