  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与估值立场
        blocks:
          - type: paragraph
            body: >
              仅靠公开财务数据无法从第一性原理承销 PathAI 的估值：公司没有披露经审计收入、毛利率、烧钱速度、ARR 或客户集中度数字。 唯一站得住的锚点是 2026 年 5 月 7 日 Roche 合并协议——$750
              million 预付款加最高 $300 million 或有里程碑—— Roche 官方新闻稿已确认，Davis Polk & Wardwell（Roche 顾问）和 Latham &
              Watkins（PathAI 顾问）也分别佐证。 在第三方估计的 $108 million 收入基础上，预付款隐含约 7x EV/Revenue；若所有里程碑达成，则升至 9.7x。 这个倍数落在
              HealthTech 分析师于 2025 年中给成熟 AI 诊断平台的 6–8x 区间内，但高于更广泛 HealthTech M&A 市场的 4–6x 中位数。建议是有条件正面并采取持有立场：Roche
              交易价格可信，也与板块可比公司一致，但在不知道具体里程碑触发条件前， 不应承销里程碑部分。风险评级为高，原因包括交易交割不确定性（H2 2026 反垄断和监管审批尚未完成）、财务不透明（没有已确认独立指标），
              以及临床收入板块的报销天花板风险。虚假精确度风险很实质：$108 million 收入估计来自第三方数据库（Growjo、ZoomInfo）， 不是公司披露；若该估计有 ±50% 误差，隐含倍数会从约 3.5x
              移到约 14x 预付款。因此，证据敏感度评为高—— 任何对 PathAI 收入的独立验证都会显著改变估值结论。
