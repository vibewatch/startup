  - id: FR002
    title: 风险传导图——PathAI 的主要风险如何级联至收入和估值
    type: dag
    layout: wide
    summary: |
      有向无环图，展示顶级风险如何沿 PathAI 业务传导，压低收入、削弱临床采纳并压缩交易估值。
    data:
      nodes:
        - id: antitrust
          label: Roche 并购反垄断审查延迟 / 失败
          detail: DOJ/FTC/EU DG COMP 审批仍待 2026 年下半年完成；尚无公开确认的 HSR 申报
        - id: pccp
          label: FDA PCCP 违规 / 触发新 510(k)
          detail: 超范围修改需要完整重新提交；PCCP 先行路径的执法先例有限
        - id: cms
          label: CMS 支付停滞
          detail: Category III 代码尚无 RVU 赋值；转为 Category I 需要多年使用数据
        - id: labcorp_conc
          label: Labcorp/Quest 集中
          detail: 两个账户占美国临床渠道主导份额；替代渠道有限
        - id: scanner_risk
          label: Roche VENTANA 扫描仪可靠性问题
          detail: KLAS 2026 记录了对 Roche 扫描仪的显著不满；PathAI 支持 VENTANA DP 200/600
        - id: adoption
          label: 数字病理采纳阻力
          detail: < 15% 美国机构已选择供应商（KLAS 2026）；LIS 集成需要 12-18 个月
        - id: exec_conc
          label: 创始人 / 高管关键人集中
          detail: Andy Beck 和 Aditya Khosla 牵住战略与技术架构
        - id: revenue
          label: 临床收入天花板
          detail: 受支付缺口和渠道集中限制
        - id: biopharma_rev
          label: 生物制药收入集中
          detail: 非临床收入大多来自未披露的制药合作关系
        - id: valuation
          label: 交易估值压缩 / 里程碑风险
          detail: 最高 $300M 为或有付款；交易延迟或失败会压垮独立估值
        - id: integration
          label: 收购后整合执行风险
          detail: Roche 交割后，产品路线图、人才留存与文化融合面临执行压力
      edges:
        - from: antitrust
          to: valuation
          label: 交易失败使 $750M 首付款落空
