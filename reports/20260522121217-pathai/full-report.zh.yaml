      - number: '2.5'
        title: 采用限制与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管结构性顺风很强，数字病理仍面对一组采用限制，它们共同解释了为什么 2026 年美国医疗机构中选择供应商的比例不到 15%。最关键的是 CMS 报销 Catch-22：2023 年引入的数字病理附加 CPT
              代码（Category III，0751T–0763T）在 2024 年 CMS 数据中的使用率仅约 1.1%——几乎肯定被低报，因为实验室没有动力申报不带付款的代码。CMS
              已表示，除非使用率看起来“有意义”，否则不会把这些代码提升为永久 Category I， 这把采用锁进了自我实现的循环。Digital Pathology Association 的 Reimbursement
              Task Force 在 2026 年 Q1 更新中明确承认这一点， 并与医疗咨询公司 McDermott+ 合作推动政策改变。第二，全切片扫描仪每台 $250,000 到 $500,000
              或更高的资本开支，加上存储和软件成本， 需要资本预算批准和 ROI 论证，小型或财务受限实验室很难轻易给出。第三，LIS 和 EHR 互操作仍碎片化：据 Meditecs，DICOM WSI 标准到 2026
              年才接近生产可用的多供应商成熟度；与 Epic、Cerner 或 Sunquest LIS 平台集成复杂，尚未标准化。第四，实验室必须为部署的每个 AI
              算法完成分析和临床验证——这个过程耗时，可能需要数月，还需要专门的病理和 IT 资源。第五，AstraZeneca 和 Health Advances 共同署名的 2025 年 MDPI
              研究把财务顾虑、工作流扰动和监管不确定性列为前三大障碍，为采用挑战增加了同行评审证据。2026 年 Medicare Physician Fee Schedule 纳入效率调整和执业费用重分配；ASCP
              认为这会负面影响包括病理医生在内的院内专科医生，可能压缩实验室的可选技术投资预算。
