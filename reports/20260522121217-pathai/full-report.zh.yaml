      - number: '4.2'
        title: 单位经济代理指标与成本结构
        blocks:
          - type: paragraph
            body: >
              PathAI 没有公开披露毛利率、收入成本、CAC、LTV、流失率或 R&D 支出；本节所有数字估算都来自第三方数据库或市场分析，而不是审计财务。第三方商业数据库
              （Growjo、ZoomInfo、compworth.com）估计 PathAI 2024 年年收入约 $108 million；meddeviceguide.com 的收购指南则给出 $100–$250
              million 区间，以反映不确定性。Deloitte Fast 500 2024 排名虽然是 PathAI 官方公告，但只建立了一个未说明测量期的 260% 增长率，没有给出基期或终期收入。2024
              年员工估计集中在 400–500 人；按收入中点估计，单员工收入约 $200,000–$270,000， 落在专业服务 / SaaS 混合公司的合理区间内，但没有实际数据无法验证。相较纯 SaaS
              同行，PathAI 资本强度更高，因为公司保留了 2022 年为内部组织分析建立的 GCLP 认证生物制药组织病理实验室。Quest 剥离拿掉了 350 人的 Memphis
              诊断运营后，固定服务交付成本明显下降； 但保留的 Memphis 生物制药实验室仍代表持续实验室基础设施成本。PathAI 2025 年向 CMS 提交公开意见，建议新增 Medicare 计费代码（HCPCS
              Level II），覆盖辅助 AI、黑箱 AI 输出和伴随诊断，并建议把医生工作价值锚定到现有专业部分病理代码（$26–$40 区间）。 这一监管努力说明，当前临床端独立 AI
              病理工具基本缺少报销，强化了这样的判断：不依赖 fee-for-service Medicare 计费的生物制药服务， 才是主要收入质量驱动。medusind.com 的报销分析指出，2026 年
              Medicare Physician Fee Schedule 的效率调整削减了多数核心病理判读 CPT 代码，给任何依赖传统计费的临床收入增加结构性下行压力。
