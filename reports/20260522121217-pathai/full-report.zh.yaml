      - number: '8.5'
        title: 反向证据、高估风险与止损触发项
        blocks:
          - type: paragraph
            body: >
              三个独立分析来源提出了需要压低正面交易价格信号权重的担忧。第一，Discoveries in Health Policy 分析明确指出， 数字病理 “still suffers from a persistent
              reimbursement problem”，PathAI 的价值是 “operational”， 而不是来自广泛报销的独立 AI 产品——这是临床收入的结构性天花板，收购后也不会消失。第二，LucidQuest
              尽调简报标出两个红旗： 平台中立性风险（如果 Roche 优先推进自有检测项目，竞争性生物制药伙伴可能迁移到 Paige 或 Aignostics 等中立 AI 平台）， 以及集成滞后（H2 2026
              交割窗口留下的不确定期，可能拖住 PathAI 当前医院销售周期）。第三，Paige 以 $81.25M 退出， 而融资额为 $220M+，说明面对不理想退出时机时，获得 FDA clearance 的 AI
              病理公司没有隐含地板价。

              高估风险真实存在，但有边界。$750M 预付款在第三方收入估计上隐含约 7x，与分析师给成熟 AI 诊断平台的 6–8x 区间一致。 风险不在于倍数本身不可信，而在于收入估计不可靠——$108M
              数字没有公司确认，且可能有 ±50% 误差带，无法作为高精度估值工作的可信锚。 任何尽调若发现收入显著更低（例如 $60–70M），都会事后把交易重新定义为 10–12x+，明显超出没有公开 EBITDA
              公司的板块常态。

              交割后的治理风险集中在集成执行和关键人物留存。PathAI CEO Andy Beck 和 CTO Aditya Khosla 搭建了 Roche 为之付款的 AI
              研究和监管可信度。交割后若任一高管离开，将削弱数据飞轮逻辑，扰乱 Roche 的 PCCP 维护节奏，并向独立 AI 初创公司释放人才流失信号。 公开来源没有披露任何留任方案条款。
