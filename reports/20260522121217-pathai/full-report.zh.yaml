      - number: '5.4'
        title: 信任、合规与质量控制
        blocks:
          - type: paragraph
            body: >
              AISight Dx 持有 FDA 510(k) clearance K243391（2025 年 6 月），适用 21 CFR 864.3700，Class II， product code QKQ。这个
              clearance 的特别之处在于获批了 Predetermined Change Control Plan（PCCP）； 获得 clearance 时，FDA 设备数据库中获批此类 PCCP 的设备少于 60
              个。PCCP 允许 PathAI 在完成文件化验证后更新受支持的扫描仪、 显示器、文件格式和网页浏览器，而无需提交新的 510(k)，显著缩短平台升级的监管周期。AISight Dx 于 2024 年 8 月根据
              EU IVDR 获得 CE-IVD 标记，可在 EEA、英国和瑞士使用，同时 Agilent 也有一条带 CE-IVD 标记的分销渠道。 PathAI 表示其处理受保护健康信息符合 HIPAA 要求，DICOM
              支持则与医疗企业标准保持互操作一致。通过 HL7 的 LIS 集成已有 LigoLab 参考部署记录。PathAI 的 GCLP 组织病理实验室（2022 年建成）为生物制药研究提供符合 Good
              Clinical Laboratory Practice 的组织处理服务。公开来源尚未找到 ISO 27001 或 SOC2 Type II 认证的独立确认， 这是企业和受监管实验室采购中的尽调缺口。FDA 将
              AIM-MASH 认定为 DDT 生物标志物工具（并非批准用于独立临床诊断）， 其使用也被明确限定在 MASH 临床试验场景。监管分类彼此不同：AISight Dx 作为诊断设备获得 clearance；
              AIM-MASH 被认定为 DDT 生物标志物工具；AIM-TumorCellularity 是研究支持工具，未获准作为独立诊断工具。
