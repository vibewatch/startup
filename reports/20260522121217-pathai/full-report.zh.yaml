  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              PathAI 横跨四类核心客户，买方、使用场景和产品界面各不相同。第一类是全国性参考实验室和独立病理实验室—— Labcorp 和 Quest Diagnostics 是两个锚点。Labcorp 用
              AISight Dx 支持全国临床数字病理工作流； Quest 在 2024 年以 $100 million 收购 PathAI Diagnostics 的同时获得 AISight
              授权，并保留其自有实验室的持续授权权利。 这一分层商业可见度最高，但集中度也最高：Labcorp 和 Quest 合计代表美国解剖病理参考实验室市场的大部分，
              造成渠道依赖。第二类是多站点医疗系统——MedStar Health（多站点 40+ 名病理医生）、Northwestern Medicine （11 家医院 95 名病理医生）和 Hoag Memorial
              都是具名部署。医疗系统买方要求 LIS 集成、HIPAA 合规和多站点协调， 采购复杂，但合同通常跨多年。第三类是学术和精准肿瘤中心——University Hospital Zurich、University
              Medical Center Utrecht 和 Moffitt Cancer Center 均已确认部署。这些买方主要由研究驱动，把 AISight Dx 与 AIM 算法一起用于生物标志物发现， 并接入
              PathAI Precision Pathology Network。第四类是生物制药和制药公司——这是 PathAI 最早的商业关系类别。 PathAI 称其与全球前 15
              大制药公司中的多数都有关系，覆盖临床试验支持、AIM 工具使用和伴随诊断共同开发。Roche 作为 PathAI 的收购方，最初在 2021
              年就是生物制药合作伙伴。生物制药买方通常是临床运营或精准医学职能，产品包括 AISight Clinical Trials
              Platform、AIM-MASH、AIM-TumorCellularity，以及新推出的 AIM-HI UC 和 IBDExplore 工具。
