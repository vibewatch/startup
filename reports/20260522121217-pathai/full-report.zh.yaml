  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              PathAI 至少跨四类竞争者与买方同时权衡。直接数字病理 AI 同行——Proscia、Paige（现属 Tempus）和 Ibex Medical
              Analytics——提供面向重叠临床实验室和生物制药客户群的 AI 算法和图像管理系统。既有扫描仪和平台供应商——Roche/Ventana/navify、 Leica Biosystems（Aperio）和
              Philips IntelliSite——控制扫描仪硬件选择，并深度影响 IMS 采购；它们的集成技术栈给纯软件 AI 平台带来结构性嵌入风险。相邻的研究导向玩家——Visiopharm、Indica
              Labs、Aiforia——在药企 R&D 和学术市场竞争，但临床 FDA 足迹有限。现状和替代方案——手工玻片显微镜、外包组织病理，以及学术或内部自建 AI 项目——是买方衡量任何数字病理投资的参照系。
              2025–2026 年市场整合很重要：Signify Research 把 Tempus 收购 Paige 形容为行业的“硬重置”，而 Roche/PathAI 交易则打造出第一个从扫描仪硬件贯通到 FDA 许可
              AI 算法和伴随诊断的纵向集成栈。截至 2026 年 5 月，美国医疗机构中选择数字病理供应商的比例低于 15%（KLAS
              2026），意味着大部分总可用市场仍未被争夺。因此，供应商之间的竞争动态一方面是在边缘互相替换，另一方面又是在共同向更大的现状基盘布道。 截至报告日期，Roche 对 PathAI 的待完成收购尚未交割，因此
              PathAI 在商业关系中仍以独立实体运营；交割后的合并竞争姿态可以预期，但尚未兑现。
