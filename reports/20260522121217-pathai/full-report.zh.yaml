  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险格局
        blocks:
          - type: paragraph
            body: >
              PathAI 的监管足迹由单个 FDA 510(k) clearance（K243391，2025 年 6 月）和已授权的 Predetermined Change Control Plan 打底，
              另有覆盖欧盟、英国和瑞士的 CE-IVD 标记。短期看，PCCP 是结构性优势——它允许扫描仪和标签扩展，无需完整重新提交——
              但也增加了一层新的合规负担：每项变更都必须留在预授权边界内，任何超范围修改都会触发新的 510(k)。 截至 2025 年 7 月，FDA 授权 PCCP 的设备少于 60 个，PathAI
              因而是在一个执法先例有限、仍在演进的监管框架中较早采用该机制的公司。

              短期最尖锐的法律风险，是 Roche 合并的反垄断和监管审批流程，预计 2026 年下半年完成交割。Roche 和 PathAI 都没有披露向 DOJ、FTC 或 EU DG COMP
              提交的文件，也没有公开证据显示 Hart-Scott-Rodino 并购前通知已经完成。若交易在这一阶段失败， PathAI 将独立运营，且没有已确认融资跑道，管理团队还会被数月交易准备分散注意力。

              CMS 报销是燃烧更慢的结构性风险。数字病理 Category III CPT codes 没有全国 RVU 赋值，意味着由 AISight 支撑的工作流拿不到直接 Medicare 付款。PathAI 在
              2025 年向 CMS 提交正式评论，建议为 AI 辅助诊断建立新的 HCPCS codes，但 CMS 已表示，在转入带支付费率的 Category I codes 之前，需要大量使用数据。这形成了一个
              catch-22： 它限制医院为 AISight 部署论证 ROI，也压制 PathAI 的临床定价权。

              PathAI 的 Privacy Notice（2025 年 2 月生效）约束通过其平台收集的个人信息，并意味着其与受监管实体客户承担 HIPAA Business Associate Agreement
              义务。截至 2026 年 5 月，可用的医疗数据泄露追踪出版物中未出现涉及 PathAI 的 HIPAA 执法行动或泄露通知。欧盟临床试验的跨境数据处理必须遵守 GDPR 和 EU MDR/IVDR
              框架；PathAI 的 CE-IVD 标记要求持续与公告机构互动， 但时间表未获公开确认。
