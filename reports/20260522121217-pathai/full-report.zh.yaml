      - number: '3.3'
        title: 定价、打包与分销
        blocks:
          - type: paragraph
            body: >-
              所有重要商业数字病理 AI 供应商都没有公开披露标价。PathAI、Proscia、Paige（Tempus）和 Ibex Medical Analytics
              都采用按客户谈判的定制企业定价，通常考虑站点数量、用户量、所需 AI 模块、集成复杂度、云存储和多年合同期限。没有正式 RFP 流程时， 这种不透明让买方无法做基准比较，也意味着竞争替换主要通过概念验证评估和
              KLAS / 分析师背书来发生，而不是靠价格表。Paige 被收购后打包进 Tempus 更广泛的精准肿瘤平台，带来把 AI 病理工具与分子诊断、临床试验数据服务交叉销售的可能性——这是 PathAI 在
              Roche 交割前还无法复制的打包动态。 Roche 的收购同样意味着，交割后 AISight 可能与 Roche 扫描仪硬件和 Ventana 伴随诊断工作流一起销售，形成纯 IMS
              供应商难以匹敌的捆绑企业定价。 Leica Aperio 的市场打法以硬件为先：实验室购买 Aperio GT 扫描仪后，就面对带有紧密集成激励的专有软件生态（HALO AP DX、Aperio
              iQC），这本质上是硬件到软件的捆绑模型，而不是单独 SaaS 定价安排。Proscia 的 Concentriq 合作伙伴包括 Agilent Technologies 和 Siemens
              Healthineers，这些渠道关系让它获得超出直销的企业分销触达。CMS 报销数字病理服务的分销仍处早期；DPA 正推动永久报销代码， 但截至 2026 年初，Category III CPT
              附加代码只用于追踪，没有全国 RVUs，也没有专业报销——这一限制压低了纯临床 AI 的支付意愿， 并把收入集中到完全绕开支付方体系的生物制药合同。2024 年只有约 1.1% 的合格数字病理程序通过 CMS
              附加代码捕获，严重低估真实采用， 也说明行政摩擦——不只是临床犹豫——限制了所有供应商的可编码市场。
