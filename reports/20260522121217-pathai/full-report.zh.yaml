      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月 22 日，PathAI 已进入退出模式：Roche 交易是 VC 投资者唯一可执行的流动性路径。据报道， 公告前已有二级市场活动；随着交易预计在 H2 2026
              交割，二级交易窗口很窄，且价格越来越贴近交易本身。 任何二级参与者若按高于 $750M 预付款等值定价，实质上是在购买 $300M 里程碑部分的期权——这一头寸需要详细了解里程碑定义、
              概率估计和交割后集成执行，而这些信息无法从公开来源获得。

              最关键的剩余尽调缺口包括：（1）经审计或 CFO 确认的收入、毛利率和烧钱速度——没有这些，7x 倍数无法压力测试； （2）完整里程碑结构，包括门槛、计量期，以及 Roche
              在交割后加速或延迟里程碑的能力；（3）股权结构表组成和优先权悬垂—— Series C 投资者投入 $165M，可能持有清算优先权，使 LP 层面回报与 $750M
              头条数字不同；（4）反垄断提交状态及任何已提出或正在审查的补救措施； （5）Andy Beck、Aditya Khosla 以及前 10–20 名技术人员的关键人物留任方案。

              应触发负面重估的打破投资逻辑事件包括：DOJ 或 EU DG COMP 提起反垄断挑战并把交割推迟到 Q1 2027 之后； 验证收入低于 $75 million（仅预付款就隐含 10x+）；CEO Beck
              在交割前公开离职；或有证据显示 Roche 正在把重新谈判预付款作为交割条件。 截至 2026 年 5 月 22 日，上述事件均未发生，但在交易公开确认交割前，监控义务仍然有效。
