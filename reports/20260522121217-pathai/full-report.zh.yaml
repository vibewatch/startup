        - $300–540M（独立情境按估计收入 5x；若竞争性出售，承受 Paige 式压力）
        - 财务不透明掩盖真实独立经营经济性；同等价格的其他战略买家选择有限
    notes: |
      概率信号是基于行业先例和公开证据的编辑判断，不是概率模型。$300–540M 悲观情境区间仅作示意；没有 Roche 时，独立 PathAI 无法靠公开证据支撑分析，实际价值可能显著更高或更低。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV027
      - CV029
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 与 PathAI 的可比性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >
        Comparable set is limited to publicly available transaction and market data; no comprehensive private-market
        database of all digital pathology AI transactions exists. Multiples for PathAI rely on a third-party revenue
        estimate, not company-disclosed financials.
    rows:
      - - 'Tempus AI（NASDAQ: TEM）—— 上市 AI 诊断 + 数据平台'
        - 过去十二个月 EV/Revenue（Q1 2026）
        - 基于约 $1.36B TTM 收入约 6.6x；EV 约 $9.0B
        - 最接近的上市可比对象 —— AI 诊断 + 数据平台，已有监管进展和药企合作
        - 规模大得多（$1.36B 与约 $108M 估计），业务更分散（收购 Ambry + Paige），收入结构不同
      - - Paige —— AI 数字病理，2025 年 8 月由 Tempus 收购
        - M&A 交易价值与披露融资额对比
        - 收购价 $81.25M；低于 $220M+ 披露融资额的 40%（隐含低于 1x 收入）
        - 直接可比 —— 获 FDA 准入的数字病理 AI，聚焦药企和 CDx
        - 困境退出属性；Tempus 主要以股票支付；PathAI 交易规模大 9x，且前置现金支付
      - - Proscia —— 私营 AI 病理 IMS，获 FDA 510(k) 准入（AP-Dx）
        - Series D 轮（2025 年 4 月）
        - $50M Series D；累计融资未披露；私营
        - 同业 IMS 竞争者 —— 获 FDA 准入、聚焦生物制药，但规模更小，且没有规模化 CDx 合作
        - 未披露估值倍数；仅有 Series D 融资；没有收购价格锚点
      - - HealthTech AI 诊断行业 —— M&A 倍数（2025）
        - AI 诊断 M&A 的 EV/Revenue 区间
        - 已验证 AI 平台为 6–8x 收入；更广义 HealthTech 为 4–6x
        - PathAI 隐含倍数的行业基准（约 7x 首付款 / 约 9.7x 全额交易）
        - 汇总市场数据；不是具体交易；未按 PathAI 精确画像校准
      - - Roche Diagnostics —— 交易规模的战略背景
        - PathAI 交易占收购方诊断业务收入百分比
        - $750M = Roche Diagnostics 2025 年收入 CHF 13.8B（约 $15.3B USD）的约 5.4%
        - 表明 Roche 将其视为战略补强，而非重塑资产负债表的大押注
        - CHF/USD 换算为近似值；2026 年收入尚未披露；补强式表述可能低估 IP 价值
    notes: >
      所有倍数均由公开市场数据或交易披露计算，不来自公司确认的 PathAI 财务。来自第三方数据库（Growjo/ZoomInfo）的 PathAI $108M 收入估计是唯一可用输入，置信度低。Roche Diagnostics
      的 CHF/USD 采用约 1.11 USD/CHF。
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV005
    title: 投资逻辑破裂与止损触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Roche 交易失败或正式终止
        - 公开宣布交易终止，或触发重大不利变化条款
        - 拿掉主要价值锚；独立 PathAI 的投资测算需要以未确认收入约 5x 重建基准情境
        - 退出老股仓位；重校独立悲观情境（$300–540M）；寻找其他战略买家情报
      - - DOJ、FTC 或 EU DG COMP 提起反垄断挑战
        - 公开申报或重要媒体报道显示监管审查要求补救措施
        - 推迟 H2 2026 交割；加大整合不确定性；引入价格或结构重谈风险
        - 密切监控；不增加敞口；若未要求结构性补救，可持有穿越初审
      - - 经验证收入显著低于 $75M
        - CFO 确认或资料室披露显示 PathAI 过去十二个月收入低于 $75M
        - 交易回看变成 10x+ 收入，明显高于行业常态；削弱估值纪律投资逻辑
        - 重新评估；$750M 仍是 Roche 承诺价格，但更像高战略溢价，而非财务价值
      - - CEO Andy Beck 或 CTO Aditya Khosla 交割前离职
        - 公开公告或可信媒体报道显示创始人在交易交割前离职
        - 削弱数据飞轮和 PCCP 维护逻辑；可能触发 MAC 条款或 Roche 重谈价格
        - 评估 MAC 风险；核验留任方案；密切跟踪交易时间表
      - - Roche 将首付款重谈至低于 $650M
        - 公开修订协议显示首付款 < $650M
        - 实质性降低退出对价；表明 Roche 在尽调中发现不利信息
        - 一有流动性就退出老股仓位；视为悲观情境信号
    notes: |
      阈值因缺少交易合同细节而只能作示意和编辑判断；实际 MAC 条款定义以及 Roche 重谈的法律权利并未公开。触发监控依赖公开披露；私人交易进展无法仅靠公开来源识别。
    claimRefs:
      - CV028
      - CV029
      - CV022
      - CV023
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务（收入、毛利率、烧钱速度）
        - 公司未披露经审计的 ARR、毛利率、EBITDA 或烧钱速度
        - 没有确认收入，7x 倍数无法压力测试；±50% 误差带会实质性改变估值立场
        - CFO 确认或资料室；SAS 70 / Big-4 审计报告；交割前财务尽调
      - - 里程碑结构和门槛
        - 最高 $300M 里程碑；触发条件、衡量周期和概率未公开披露
        - 里程碑选择权约占全额交易价值 28%；没有门槛就无法折现或承销
        - 交易文件（Merger Agreement）；由 Latham & Watkins 或 Davis Polk 确认结构；PathAI 董事会 / CFO
      - - 股权结构表和清算优先权拖累
        - Series A/B/C 投资人的清算优先权未披露；D1 Capital、Kaiser Permanente、Tiger Global 持股未知
        - 若优先股堆叠偏厚，$750M 下 LP 层面回报可能显著低于名义交易价值
        - 交割前股权结构表披露；PathAI CFO 或股东法律顾问
      - - 反垄断申报状态和监管放行时间表
        - 截至 2026 年 5 月 22 日，DOJ、FTC 或 EU DG COMP 申报或状态均未公开确认
        - 未完成批准是主要交割风险；若延至 Q1 2027 之后，将构成负面信号
        - Roche 投资者关系；SEC Form 8-K 更新；Howard Shelanski（Davis Polk 反垄断顾问）
      - - CEO 和关键人才留任方案
        - 未公开披露 Andy Beck、Aditya Khosla 或技术团队的交割后留任激励
        - 创始人留任是数据飞轮和 PCCP 维护价值的前提；离职会触发投资逻辑破裂
        - 高管薪酬（Veronica Wissel，Davis Polk）；Roche HR；PathAI 董事会主席
      - - 生物制药收入集中度和合同续约性
        - 未披露单一生物制药客户；按客户划分的收入集中度未知
        - 若 1–2 家生物制药客户占服务收入 >50%，Roche 收购后存在客户流失风险
        - 资料室中的客户名单和合同条款；CRM 记录；续约率跟踪
      - - 交割后整合计划和 AISight 开放平台承诺
        - Roche 未公开承诺交割后保留 AISight 供应商中立的开放平台架构
        - 平台中立性是 PathAI 面向非 Roche 生物制药客户的关键价值主张；失去中立性 = 客户流失
        - Roche Diagnostics 整合负责人；Roche Diagnostics Day 2026 演示；PathAI CEO 公开声明
    notes: |
      尽调问题按重要性排序。第 1 和第 2 项（收入和里程碑结构）会阻塞任何高于象征性规模的老股投资。第 4 和第 5 项（反垄断和留任）是现有利益相关方的监控项。七项均属于交割前机构尽调的标准问题。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV024
      - CV025
      - CV028
      - CV030
      - CV033
      - CV042
