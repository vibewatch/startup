      - number: '6.3'
        title: 留存、耐久性与重复合作
        blocks:
          - type: paragraph
            body: >
              PathAI 不公开披露 NRR、GRR、流失率或任何客户队列留存指标。公司尚未 IPO，也没有义务发布单位经济数据； 正在推进的 Roche
              收购进一步削弱了披露细颗粒度收入的动力。尽管如此，仍有若干留存代理指标。Labcorp 的关系至少可追溯到 2020 年，并已两次扩展（2022 年和 2026 年），显示多年留存和合同深度提升。Roche
              的参与从 2021 年合作推进到 2024 年扩大共同开发协议，再到 2026 年全面收购——这是客户转变为收购方的最极端形式。MedStar Health 在签署 2026 年正式多年期生产合作之前参加了
              PathAI 的 Early Access Program，这一有记录的分阶段推进符合客户留存和扩张打法。 Quest
              的持续授权关系，以及其作为生物制药实验室服务首选提供方的身份，构成了超越任何单一合同周期的结构性依赖。 没有具名客户公开宣布退出、取消或终止 AISight
              关系。但不能把没有反向公开披露等同于已确认留存；企业软件切换成本和多年期合同条款， 会在结构上压低这一领域可见的流失。生物制药方面，AIM-MASH 的 DDT qualification（2025 年 12
              月）让任何在 MASH 试验中使用它的生物制药申办方持续依赖 AIM-MASH——如果资格认定未来被重新审视，监管连续性风险就会变成留存威胁。 2025 年 7 月推出的 PathAI Precision
              Pathology Network 被设计成结构性留存机制：成员实验室贡献去标识化数据、 获得新算法的早期访问权，并参与生物制药撮合，从而提高早期网络成员的切换成本。
