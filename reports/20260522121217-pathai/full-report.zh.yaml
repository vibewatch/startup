      - number: '5.5'
        title: 路线图、部署规模、关键依赖与风险
        blocks:
          - type: paragraph
            body: >
              PathAI 的部署轨迹在 2025-2026 年明显加速。Labcorp 于 2026 年 2 月宣布在其整个解剖病理网络中全国铺开 AISight Dx，这是美国临床史上规模最大的 AI
              驱动数字病理部署之一。MedStar Health 于 2026 年在支持 40+ 名病理医生的多站点实验室部署 AISight Dx。Moffitt Cancer Center 和 Northwestern
              Medicine 均宣布部署 AISight Dx，并配套 AI 共同开发协议。University Hospital Zurich（2026 年 1 月）把 AISight Dx 和
              AIM-TumorCellularity 用于常规分子病理，这是已知首个同时结合两项产品的欧盟临床常规部署。PathAI 正在推进的 Roche 收购（$750M 预付款，最高 $300M 里程碑，2026 年
              5 月宣布）主导了近期路线图。Roche 给出的理由是 “to solve the digital pathology integration
              puzzle”，这等于承认集成复杂性是已知限制，而不是已经解决的问题。 收购之后，PathAI 的路线图将受 Roche 优先事项塑形，带来产品方向不确定性。关键依赖包括：（1）扫描仪生态——初始诊断只支持
              PCCP-cleared 扫描仪型号，VENTANA（Roche）和 Leica/Hamamatsu 是主要伙伴；（2）Quest 和 Labcorp 的授权关系， 它们扩大商业覆盖；（3）AIM-MASH
              和未来 AIM 工具资格认定所需的 FDA 与 EMA 监管连续性；（4）更广泛的数字病理采用 （截至 2026 年，美国机构仍只有 10-15%）。反向限制因素包括：公开临床性能数据有限（多数证据由公司赞助）、
              采用实验室承担验证负担、缺少已确认的 ISO/SOC2 认证，以及扫描仪型号依赖带来的采购锁定风险。
