      - number: '5.3'
        title: 生物制药平台、AIM 工具与开发者信号
        blocks:
          - type: paragraph
            body: >
              PathAI 的 AIM 产品线是其产品中技术差异化最强的部分。AIM-MASH 用深度学习算法在 H&E 肝活检上评分四项 NASH CRN 特征（脂肪变性、炎症、肝细胞气球样变、纤维化）；FDA 的 DDT
              qualification（2025 年 12 月） 认定它在 MASH 2/3 期试验的入组和终点评估中，可作为专家组阅片的非劣替代方案，且无需申办方重新验证。 EMA CHMP
              qualification（2025 年 3 月）给欧洲试验申报提供同样好处，使 AIM-MASH 成为首个在药物开发场景同时获得美国和欧盟监管认可的 AI 病理工具。PathAI 的
              AIM-TumorCellularity 可自动量化全切片肿瘤细胞含量，并已在 14+ 个肿瘤类型上验证， 支持临床和生物制药工作流中的 NGS 组织充分性评分与分子病理。PathAI 的 GitHub
              组织（Path-AI）维护着与同行评议论文绑定的开源仓库： hif2gene（48 stars，14 contributors；Nature 论文）、nuclear-features（癌症细胞核形态量化；npj
              Precision Oncology 2024） 和 AIM-NASH-DDT-manuscript（2 contributors）。这些仓库社区活跃度不高，但它们提供了真实的从业者社区信号： PathAI
              会发布可复现的计算方法。在 USCAP 2025，PathAI 展示了基于 48,000+ 张全切片图像训练的深度学习肿瘤检测研究。 在 ECP 2025（European Congress of
              Pathology，Vienna），PathAI 展示了与 Mindpeak、Stratipath Breast 和 Primaa 的集成； 这些均为 CE-IVD 标记的 AI 工具，可通过 AISight
              Dx 原生运行。Precision for Medicine 合作（2025 年 4 月） 把 AISight 接入符合 CLIA 要求的临床试验运营，用于生物样本工作流和生物标志物发现。
