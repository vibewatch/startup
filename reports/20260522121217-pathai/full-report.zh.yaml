              7x 隐含倍数取决于第三方数据库给出的未经审计 $108M 收入估计。若确认收入只有 $60–70M，仅首付款就意味着 10–12x+——这是溢价估值，需要极强的里程碑纪律。在拿到 CFO
              确认或审计收入前，不要把该倍数当成精确值。
