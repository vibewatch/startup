      - number: '6.4'
        title: 扩张机会与集中度风险
        blocks:
          - type: paragraph
            body: >
              客户维度上，PathAI 最重要的结构性风险是集中度。Labcorp 和 Quest 合计覆盖美国最大的两个参考实验室网络， 两者都与 AISight 有关系。Roche 收购后，如果 Labcorp
              的承诺发生变化——无论原因是集成优先级、扫描仪生态冲突还是预算重新分配—— PathAI 的临床证据叙事都会明显削弱。PathAI
              没有披露任何生物制药客户集中度数据，因此无法判断两三个申办方是否贡献了临床试验平台收入的大部分。 KLAS Research 2026 年 2 月的数字病理报告发现，采用数字病理供应商的美国医疗机构少于
              15%，这意味着可寻址市场大多尚未开发， 但当前具名客户基数在绝对值上很小。同一报告指出，扫描仪可靠性和高额前期成本是社区和中型实验室的主要采用障碍。 Decibio 2025 年数字病理工业化分析指出，AI
              病理供应商因采购摩擦和实验室预算谨慎，难以达到采用预测。 社区病理实验室承担了美国解剖病理量的大部分，但 PathAI 当前部署模式基本没有服务到这一层。常规临床使用中 AI
              辅助数字病理的报销不确定性，是影响社区实验室最严重的采购障碍，因为它们没有足够规模吸收没有补偿的基础设施投资。 Precision Pathology Network 是 PathAI
              最可信的扩张机制：它通过向实验室提供数据变现和生物制药撮合来扩大可寻址市场， 但会员数量、网络收入或增长轨迹均未公开披露，无法评估 PPN 入网是否转化为经常性收入。
