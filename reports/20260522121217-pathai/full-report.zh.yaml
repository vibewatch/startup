chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，PathAI 更应被理解为数字病理基础设施公司，而不是狭窄的单一算法供应商。公司官网把 AISight 描述为云原生、开放的企业工作流解决方案，是病理工作流中病例管理、图像管理和 AI
              应用的枢纽。2025 年 6 月的 FDA 许可公告更进一步，把 AISight Dx 定义为 PathAI 面向临床场景、可承担主要诊断的图像管理系统；也就是说，
              公司现在销售的是合规工作流软件，不只是研究工具。公司材料和 2021 年融资公告都把 PathAI 的创立时间锚定在 2016 年，FDA 510(k) 记录和官方发布则把公司地址放在 Massachusetts
              州 Boston。实际结论是：PathAI 靠病理工作流软件、AI 赋能判读工具，以及生物制药 / 转化研究支持变现，同时吃到临床实验室运营预算和药物研发预算。
