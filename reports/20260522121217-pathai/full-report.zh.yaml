      - number: '4.4'
        title: 反向证据与财务不透明
        blocks:
          - type: paragraph
            body: >
              几条独立来源观察构成重要财务尽调担忧。第一，Discoveries in Health Policy 对 Roche-PathAI 交易的分析直接写道，
              “数字病理仍是一个长期存在报销问题的领域”，并称“许多价值来自运营：更快周转、负载均衡、病理医生效率……这些收益是真实的，但支付方并未覆盖。” 这个框架来自独立健康政策分析师，而不是公司发言人，说明 PathAI
              的临床收入模型依赖企业费安排，而不是慷慨报销的按切片计费。 第二，2026 年 Medicare Physician Fee Schedule 的 CMS
              效率调整削减了多数核心病理判读代码的费率，加大了任何依赖专业部分计费的实验室服务收入压力。 第三，PathAI 自己 2025 年致 CMS 的意见信实际上承认，当前编码类别无法捕捉 AI
              病理价值；它确认了收入模型缺口，而不是解决了缺口。第四， 2026 年披露的三项重大企业交易——Labcorp、MedStar 和 Quest AISight
              许可——均未公开财务条款，无法从公开证据倒推出已实现定价或合同期限。 第五，Discoveries in Health Policy 的分析指出，行业观察者把 Roche
              收购描述为“与其说押注数字病理会突然获得慷慨报销， 不如说押注 AI
              病理会成为肿瘤诊断和药物开发的基础设施”，这与通过生物制药合同和企业级公司交易变现、而不是通过主流临床报销渠道变现的模型一致。合在一起，反向证据显示，PathAI
              的生物制药服务收入具备防守性，但临床实验室板块面临结构性压力；公开财务披露不足，使各板块贡献占比无法量化。
