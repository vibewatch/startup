      - number: '1.5'
        title: 反向信号与未解决证据缺口
        blocks:
          - type: paragraph
            body: >-
              本轮最强的负面证据不是丑闻，而是结构性问题。Discoveries in Health Policy 认为，数字病理仍受狭窄支付路径拖累； PathAI
              的价值可能更多来自工作流控制、生物制药服务和伴随诊断，而不是一个能够广泛报销的独立 AI 产品。这个判断与 Roche 自己的收购逻辑一致：买方为图像管理层、AI 分析，以及生物标志物 /
              伴随诊断可选性付钱，而不是为一个完全透明、 已成熟的软件 P&L 付钱。公开披露在投资者今天用来承销 PathAI 独立公司的指标上仍明显不完整。已抓取来源没有给出精确的当前员工数、 当前 ARR
              或收入运行率，也没有给出干净的现任董事会名单。公开来源也无法把已公布的 Roche 对价转换成干净的独立当前股权估值， 因为里程碑付款取决于条件，交割仍待批准。因此，PathAI
              的身份和战略重要性证据扎实，但其当前经济性和治理仍部分只能靠私有证据回答。
            claimRefs:
              - CO030
              - CO031
              - CO032
              - CO037
              - CO038
