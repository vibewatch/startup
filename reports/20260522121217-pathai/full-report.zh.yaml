  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分类
        blocks:
          - type: paragraph
            body: >-
              PathAI 同时参与三个相互重叠的市场边界，而分析师报告常把它们混在一起：AI 驱动的数字病理工作流软件（以 AISight 为锚的临床板块）、卖给生物制药发起方的计算病理分析（研究 /
              药物开发板块），以及与药企伙伴共同开发的 AI 赋能伴随诊断工具（监管产品类别）。 这些边界共享技术，但买方、预算、监管路径和收入模型差异很大。临床工作流板块覆盖全切片图像管理、AI 诊断模块、云存储和互操作层，
              但明确排除扫描仪硬件、手工显微镜设备、没有成像能力的常规实验室信息系统，以及专业病理医生收费。生物制药分析板块覆盖空间生物标志物量化、 数字组织档案，以及卖给药企 R&D
              团队的试验终点包——它不由支付方报销，也不受 FDA 510(k) 临床器械监管。伴随诊断板块是独立的合规产品类别， AI 生物标志物测试与疗法共同标注，需要单独提交 PMA 或
              510(k)。三类板块的现状替代方案包括手工玻片显微镜、外包组织病理实验室， 以及提供组织学服务的合同研究组织。数字病理的采用历史通常分阶段推进：先上扫描仪硬件，再上图像管理系统，最后进入 AI
              集成临床工作流——这意味着 PathAI 面对的不同买方，处在各自数字化旅程的不同阶段。
            claimRefs:
              - CM015
              - CM016
              - CM023
          - type: table
            tableRef: TM001
