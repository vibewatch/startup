            body: >
              Paige 融资 $220M+，退出价格只有 $81.25M，不到已披露融资额的 40%。这笔交易说明，若没有承诺收购的战略买方，即使是获 FDA 批准的数字病理 AI，也无法免受困境退出定价影响。PathAI
              的 $750M 交易规模是 Paige 的 9x，但如果 Roche 交易失败，Paige 结局就是悲观情景下限。
