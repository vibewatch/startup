      - number: '1.3'
        title: 融资历史、投资方与所有权转换
        blocks:
          - type: paragraph
            body: >-
              PathAI 从 A 轮开始的资本路径证据扎实。Fierce Biotech 报道称，2017 年公司完成由 General Catalyst 领投的 $11 million A 轮；PathAI 自己 2019
              年的公告称，在 Merck Global Health Innovation Fund 和 Bristol-Myers Squibb 战略投资后，公司完成由 General Atlantic / General
              Catalyst 领投的 $75 million B 轮，使创立以来累计投资超过 $90 million。2021 年 5 月 C 轮又增加 $165 million，由 D1 Capital Partners
              和 Kaiser Permanente 共同领投，General Atlantic、Tiger Global、Labcorp、 Merck GHIF 等大型财团参投。仅这些抓取到的轮次，就能支持至少 $251
              million 已披露交易前融资。所有权在 2024 年开始转向：Quest Diagnostics 买下 PathAI Diagnostics 部分实验室资产，但 PathAI 仍保持独立； 2026
              年又再次转向，Roche 签署最终协议，以 $750 million 预付款加最高 $300 million 里程碑款收购剩余公司。
              已公布对价是当前最好的价格信号，但不等同于干净的独立股权估值，因为交易尚未交割，且部分对价具有或有性。
