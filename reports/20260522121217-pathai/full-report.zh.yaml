  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >
              PathAI 采用两层产品架构：一层是临床数字病理平台（AISight/AISight Dx），另一层是生物制药精密病理工具栈 （AIM 工具和 Precision Pathology
              Network）。PathAI 官网把 AISight 描述为云原生、开放式企业图像管理系统， 是病理实验室里病例管理、全切片图像管理和 AI 应用编排的枢纽。临床版 AISight Dx 于 2025 年 6
              月获得 FDA 510(k) clearance K243391，可用于初始诊断，成为 Class II 设备（21 CFR 864.3700，product code QKQ）。 Agilent
              通过自身分销渠道转售 RUO 版品牌产品，把 PathAI 的商业触达延伸到研究型实验室。生物制药工具栈以 AIM（AI-based Measurement）工具为核心：AIM-MASH（原
              AIM-NASH）用于 MASH 肝活检评分， AIM-TumorCellularity 支持分子病理，AIM-Derm 面向皮肤病理。2025 年 12 月，AIM-MASH 取得关键监管里程碑： FDA 通过
              Drug Development Tools Biomarker Qualification Program 将其认定为首个 AI 药物开发工具， 生物制药申办方因此可以在 MASH 2/3
              期试验申报中使用它，无需重新验证。EMA 于 2025 年 3 月给出平行的 CHMP qualification。2025 年 7 月推出的 Precision Pathology
              Network（PPN）把参与实验室、研究机构和生物制药伙伴接到一套共享数字基础设施上， 用于生物标志物发现和标准化数据贡献。
