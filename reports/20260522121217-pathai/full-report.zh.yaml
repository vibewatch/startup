      - number: '2.4'
        title: 增长驱动
        blocks:
          - type: paragraph
            body: >-
              数字病理的结构性增长逻辑建立在五股力量汇合之上。第一，病理医生极度短缺：自动分诊、标记和测量的数字工具减少单病例病理医生耗时、延伸产能， 因而吞吐效率成为临床实验室买方 ROI
              的核心。第二，全球癌症发病率上升——多家分析机构把它列为病理切片量的主要驱动，直接扩大可从 AI 辅助阅片受益的病例分子。 第三，NIH Bridge2AI 项目 2025 年拨出 USD 150
              million，用于验证 AI 病理算法；这给临床采用者提供公共部门验证引擎， 降低风险，也强化提交支付方覆盖申请的证据基础。第四，2025 年 6 月 AISight Dx（K243391）获得 FDA
              许可，并带有 预定变更控制计划，显著降低了 PathAI 临床产品风险，也建立了监管先例，使未来算法扩展无需完整重新提交即可更快推进。 第五，药企 R&D 对临床试验 AI
              生物标志物分析的需求持续增长——PathAI 2022 年与 Bristol Myers Squibb 扩大合作，以及 Roche 的收购逻辑，都确认大型药企把 AI
              病理视为伴随诊断开发和个性化肿瘤药物管线的基础。Mordor Intelligence 还强调，空间组学工作流把形态学影像与蛋白组或转录组数据层融合，
              正把扫描仪和分析预算扩展到传统明场病理之外，形成一个相邻新市场；PathAI 的 AI 平台可以作为技术延伸切入。
