      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              数字病理的采用曲线既给 PathAI 创造机会，也带来运营风险。KLAS Digital Pathology 2026 报告发现，选择数字病理供应商的美国医疗机构少于 15%，确认市场仍处早期。早期临床客户对
              PathAI 主动沟通和亲自推进集成给出正面初始满意度评价；但 KLAS 也发现，使用 Roche VENTANA DP 200 和 DP 600（PathAI 支持的设备）的 Roche
              扫描仪客户，对可靠性和吞吐量非常不满。 这是反向信号，可能拖慢 Roche 扫描仪站点的 PathAI 部署，并让正在推进的收购理由更复杂。

              2025 年同行评议研究和独立咨询数据都确认，工作流集成复杂性和 LIS 兼容性是美国实验室采用数字病理的主要障碍。 即便 AI 工具表现很强，只要它们要求在主要 IMS 工作流之外另建并行 IT
              基础设施或增加验证步骤，也可能增加病理医生工作量。 2026 年 Deloitte 调查发现，只有 22% 的生命科学领导者成功规模化 AI，只有 9% 报告显著回报，说明 PathAI
              的生物制药客户也面临类似内部采用逆风。

              PathAI 的 PCCP 框架要求每项变更——增加扫描仪、更新算法、扩展标签——都按获授权的变更控制计划记录、验证并可追溯。 任何偏离都会触发新的 510(k)。随着 PathAI 把 AISight Dx
              标签扩展到更多扫描仪和显示器，这一持续验证负担会加重。 云依赖又增加一层正常运行时间和互操作风险：AISight 是云原生 SaaS 平台，尽管近期标准取得进展，多供应商环境中的 DICOM WSI
              互操作仍是活跃技术挑战。医院 IT 采购周期可拉长到 12–18 个月，即使签约后也会拖慢收入兑现。
