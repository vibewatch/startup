  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现来源
        blocks:
          - type: paragraph
            body: >
              PathAI 的变现建立在三个相互咬合的板块上。第一，AISight——PathAI 官网称其为云原生、开放平台企业工作流解决方案——作为主要临床软件产品， 授权给临床病理实验室和医疗系统。Labcorp
              全国部署（2026 年 2 月）和 MedStar 多站点上线（2026 年 4 月）是最突出的点名 AISight
              安装案例，但两份公告都未披露合同金额、年度付款条款或量级承诺。第二，生物制药服务涵盖临床试验支持、AI 驱动的生物标志物发现和转化研究—— Roche 2026 年 5
              月新闻稿明确把这一板块与伴随诊断共同开发一起列为主要收购驱动。Roche 将 PathAI “在 AI 驱动解决方案上的实力， 包括临床试验支持和转化研究” 与 Roche 伴随诊断专长结合，作为 $750M
              预付款的战略逻辑。第三，伴随诊断共同开发在 2024 年合作扩展后， 已经成为 Roche-PathAI 合作项目，提供单独的里程碑和基于版税的收入潜力。2024 年 6 月向 Quest 剥离后，PathAI
              正式退出自有诊断实验室板块（这块业务来自 2021 年收购、拥有 350 人的 Poplar Healthcare），但保留了 Memphis 的独立生物制药研究实验室。 Quest 既成为 AISight
              被许可方，也成为 PathAI 生物制药客户的优选实验室服务伙伴，由此形成收入分成和渠道安排。PathAI 的 Deloitte Technology Fast 500 公告（2024 年 11 月，第 420
              名）把 260% 增长归因于“业务两端——数字诊断和生物制药”，确认了双板块收入模型， 但没有披露绝对收入数字。
