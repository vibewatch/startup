            交易价格信号
            Roche $750M 首付款
            约 7x 估计收入
        - id: risk-layer
          label: |-
            关键风险
            交易交割不确定
            财务不透明
            支付天花板
        - id: recommendation
          label: |-
            投资建议
            有条件正向——持有
            等待 2026 年下半年交易交割
      edges:
        - from: market-scale
          to: deal-price-signal
        - from: regulatory-proof
          to: deal-price-signal
        - from: commercial-traction
          to: deal-price-signal
        - from: biopharma-moat
          to: deal-price-signal
        - from: deal-price-signal
          to: recommendation
        - from: risk-layer
          to: recommendation
    approximationNotes: |
      节点权重为编辑判断；该图未采用正式评分模型。
    claimRefs:
      - CV001
      - CV019
      - CV031
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性（按收入倍数推算的隐含股权价值）
    type: bar
    layout: standard
    summary: |
      在 $108M 第三方收入估计上套用不同 EV/Revenue 倍数，推算 PathAI 隐含股权价值，并与 Roche 交易首付款和全额对价对照。
    data:
      items:
        - label: 5x 收入 × $108M（行业低位）
          value: 540
        - label: 6.6x 收入 × $108M（Tempus 滚动 EV/Rev）
          value: 713
        - label: 7x 收入 × $108M（Roche 首付款隐含）
          value: 756
        - label: 8x 收入 × $108M（AI 诊断高区间）
          value: 864
        - label: Roche 交易首付款（实际）
          value: 750
        - label: Roche 交易总价值（含最高里程碑）
          value: 1050
    approximationNotes: |
      所有按倍数推算的项目都使用 $108M 第三方收入估计，置信度较低。Roche 交易条形代表合同金额，而非模型估计。数值单位为百万美元。
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV015
      - CV035
  - id: FV003
    title: 按情景划分的估值 / 回报区间
    type: range
    layout: wide
    summary: |
      悲观、基准、乐观情景下，PathAI 利益相关方可获得的低 / 中 / 高总对价。
    data:
      items:
        - label: 悲观情景——交易失败（独立公司 5x 估计收入或困境出售）
          low: 300
          base: 450
          high: 540
          note: 假设交易失败并承受竞售压力；Paige $81M 先例显示底部风险
        - label: 基准情景——交易以 $750M 首付款交割，部分里程碑（$100–150M）
          low: 700
          base: 850
          high: 900
          note: 最可能情景；假设 2026 年下半年满足标准 M&A 交割条件
        - label: 乐观情景——交易以 $750M + 全部 $300M 里程碑交割
          low: 950
          base: 1050
          high: 1100
          note: 需要达到里程碑门槛；上限反映生物制药表现带来的温和追加对价
        - label: 可比公司组中点（5–8x 收入 × $108M 估计）
          low: 540
          base: 756
          high: 864
          note: 基于未经确认的收入估计，区间从行业低位（5x）到 AI 诊断高位（8x）
    approximationNotes: |
      所有情景区间均为基于公开交易结构和行业可比公司的编辑估计。悲观情景底部仅作示意；困境下独立出售的实际成交价可能更低。数值单位为百万美元。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV027
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      截至 2026 年 5 月 22 日，PathAI 在八个投资维度上的投委会可用评分。
    data:
      items:
        - label: 市场机会
          value: High — $30B+ computational pathology TAM; <15% US labs selected vendor; oncology AI tailwind
        - label: 临床 / 监管验证
          value: High — FDA 510(k) K243391 with PCCP; AIM-MASH FDA + EMA qualified; CE-IVD
        - label: 商业牵引
          value: Medium-high — Labcorp, MedStar, Quest, EU academic deployments; financial terms undisclosed
        - label: 竞争护城河
          value: Medium-high — 5yr Roche CDx partnership; annotated data flywheel; PCCP maintenance lead time
        - label: 收入经济性
          value: Low-medium — ~$108M third-party estimate; no public gross margin, ARR, or burn rate confirmed
        - label: 风险画像
          value: High — deal-close antitrust risk; reimbursement ceiling; integration execution; key-person concentration
        - label: 估值纪律
          value: Medium — ~7x upfront on est. revenue; consistent with AI diagnostics comps; revenue estimate low confidence
        - label: 证据质量
          value: Medium — regulatory and commercial narrative well-supported; financial metrics opaque; no audited data
    approximationNotes: |
      评分为定性评估，综合了 PathAI 报告八个章节的证据。未使用数值评分模型；评估反映分析师对可得证据的综合判断。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
