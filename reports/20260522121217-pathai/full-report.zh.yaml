      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              投资逻辑建立在三项可叠加优势上。第一，PathAI 拥有唯一获 FDA clearance、且带获授权 Predetermined Change Control Plan 的 IMS 平台（AISight
              Dx，K243391），以及获 FDA/EMA 资格认定的 AIM-MASH 工具——这是用五年搭起来的监管护城河， 新进入者无法走捷径复制。第二，与 Roche
              的五年合作产生了自有标注临床试验数据，形成自我强化的数据飞轮： 每处理一项新试验，后续模型代际都会受益，数据集优势持续复利。第三，Roche 收购完全移除了独立融资风险， 让 PathAI 接入 Roche 覆盖
              160+ 个国家、每年 600 million 次检测的全球诊断分销网络——这是有机增长或合作路径都无法复制的加速通道。

              反向逻辑同样清晰。AI 辅助病理的报销仍受结构性限制：数字病理 Category III CPT codes 没有 RVU 赋值， 付款方不报销工作流效率收益，CMS 规则制定周期又意味着任何 Category
              I 转换都要数年。如果 Roche 把 PathAI 内部化并优先推进自己的 CDx 管线，竞争性生物制药伙伴可能迁移到中立平台（Tempus 收购后的 Paige、Proscia、Ibex）。$300
              million 里程碑部分完全或有， 计算预期对价时不应与 $750 million 预付款等权。此外，PathAI 对 Roche 的价值主要是运营和战略层面的——AI 病理作为精准医学基础设施——
              而不是一个独立 SaaS P&L，这限制了投资者原本期待独立 IPO 带来的重估空间。
