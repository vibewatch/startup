      - number: '8.4'
        title: 可比公司集合与市场背景
        blocks:
          - type: paragraph
            body: >
              最直接的公开可比是 Tempus AI（NASDAQ: TEM）。截至 Q1 2026，Tempus 的企业价值约 $9 billion， 过去十二个月收入约 $1.36 billion，追踪
              EV/Revenue 倍数约 6.6x。Tempus 规模更大（诊断 + 数据平台，并购 Paige 和 Ambry）， 业务更多元，也面临类似报销和集成挑战；因此它对 PathAI
              有方向参考价值，但结构上并不完美。Tempus 2025 10-K 于 2026 年 2 月 24 日提交 SEC，确认 FY2025 收入 $1.27 billion（YoY 增长 83%）、现金 $759.7
              million、 净亏损 $245 million，并给出 2026 年指引 $1.59 billion。按当前企业价值计算，Tempus 基于 2026 年指引的 前瞻 EV/Revenue 约为
              5.6x——随着收入规模扩大而压缩。

              Paige-Tempus 收购是数字病理 AI 的直接交易可比：Tempus 于 2025 年 8 月以 $81.25 million 收购 Paige， 主要以股票支付，并承接 Microsoft Azure
              云承诺。Paige 自 2017 年成立以来融资超过 $220 million， 收购价不到披露融资额的 40%——这清楚提醒市场：若没有战略买方承诺，获得 FDA clearance 的数字病理 AI
              并不保证高溢价退出。 PathAI 的 $750 million 预付款是 Paige 退出价的 9.3x，反映出 PathAI 规模更大、Roche 集成更深、AIM-MASH 监管里程碑更强。

              私募市场方面，Proscia 于 2025 年 4 月为 AI 病理 IMS 和 AP-Dx 平台融资 $50 million Series D，
              表明资金充足的私有数字病理公司仍能吸引成长资本，但阶段更早，估值也远低于 PathAI 隐含退出。2025 年中 HealthTech M&A 倍数分析把拥有成熟平台的 AI 诊断公司定在 6–8x ARR，上限
              8–10x 留给贴近生物技术的后期创新者。Roche Diagnostics 自身报告 2025 年销售额 CHF 13.8 billion（CER 增长 2%），$750 million 的 PathAI
              交易约相当于其年度诊断收入的 5.4%—— 这是补强型投资，不是转型性押注。

              尚无公开披露的已验证交易可比能精确匹配 PathAI 的画像（私有、获 FDA clearance 的 IMS + 生物制药 AI + CDx 合作、 $100M+
              收入估计），因此可比集合只能依赖邻近交易和公开市场代理，且存在实质限制。
