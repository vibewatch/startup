      - number: '2.3'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >-
              数字病理买方群体分成两个结构差异明显的类别，采购逻辑、预算周期和产品要求都不同。临床买方包括 Labcorp、Quest Diagnostics
              这类独立参比实验室，拥有院内病理实验室的医疗系统，以及学术医学中心；它们采购数字病理，是为了解决工作流效率、人手短缺和诊断质量问题。采购资本密集，
              涉及扫描仪硬件、服务器或云基础设施、软件许可，并由实验室管理者、医院 CIO 或病理科主任主导，具体取决于机构规模。根据 KLAS 2026
              报告，规模较小、观念更进取、病理医生更少的机构数字化进度最快，因为协调阻力更少。在处理 100,000 例或更多病例的大型机构中，即便已经开始部署， 数字化处理病例占比也低于
              40%，说明全量切换仍是多年工程。生物制药和药企买方包括 Bristol Myers Squibb、AstraZeneca 这类大型药企发起方、生物技术公司和合同研究组织；它们把 AI 病理工具作为 R&D
              和临床试验预算中的一项采购，而不是资本基础设施。 预算归属通常在 VP Translational Medicine 或 CDx 负责人手里，触发采购的常见原因是伴随诊断提交要求或生物标志物发现任务。
              这类买方完全不受 CMS 报销政策影响。PathAI 同时服务两类买方；KLAS 2026 报告确认，它与 Ibex、Visiopharm、Paige.ai 一起进入了正在被评估用于临床的 AI
              供应商短名单。买方对 AI 集成的硬要求——AI 必须嵌入 IMS 工作流，而不是作为独立系统运行——是一个关键差异化缺口； 拥有集成 AISight 平台的 PathAI 正好可以利用这一点。
