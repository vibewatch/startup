    {
      "id": "capital-history-and-ownership-transition",
      "title": "Funding history, investors, and ownership transition",
      "body": "PathAI's capital path is well supported from Series A onward. Fierce Biotech reported an $11 million Series A in 2017 led by General Catalyst, then PathAI's own 2019 release said a General Atlantic / General Catalyst-led Series B was completed at $75 million after strategic investments from Merck Global Health Innovation Fund and Bristol-Myers Squibb, bringing total investment to more than $90 million since founding. The May 2021 Series C then added another $165 million, co-led by D1 Capital Partners and Kaiser Permanente, with a large syndicate that included General Atlantic, Tiger Global, Labcorp, and Merck GHIF. Those fetched rounds alone support at least $251 million of disclosed pre-transaction financing. Ownership then changed direction in 2024 when Quest Diagnostics bought select PathAI Diagnostics lab assets but left PathAI independent, and it changed again in 2026 when Roche signed a definitive agreement to acquire the remaining company for $750 million upfront plus up to $300 million in milestones. That announced consideration is the best current price signal, but it is not the same as a clean standalone equity valuation because the close is still pending and part of the consideration is contingent.",
