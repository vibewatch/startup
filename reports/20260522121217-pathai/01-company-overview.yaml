  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "PathAI is a Boston-based digital pathology company founded in 2016 that has evolved from an AI-pathology startup into a regulated workflow and biopharma platform anchored by AISight Dx, named enterprise deployments, and a pending Roche acquisition. Fetched evidence cleanly supports the 2017/2019/2021 funding history, the 2024 Quest Diagnostics lab-asset transaction, the 2025 FDA clearance K243391, and the 2026 Labcorp, MedStar, and Roche milestones. What remains materially opaque is exact lifetime capital raised versus transaction proceeds, current headcount and revenue, and the full board / governance picture."
  },
  "sections": [
    {
      "id": "identity-and-business-model",
      "title": "Identity, headquarters, and business model",
      "body": "PathAI is best understood in 2026 as a digital pathology infrastructure company rather than a narrow single-algorithm vendor. The company homepage describes AISight as a cloud-native, open enterprise workflow solution that acts as the hub for case management, image management, and artificial-intelligence applications in pathology workflows. The June 2025 FDA clearance announcement goes further by defining AISight Dx as PathAI's primary-diagnosis-capable image management system for clinical settings, which means the company now sells regulated workflow software in addition to research tooling. Company materials and the 2021 financing announcement consistently anchor PathAI's founding in 2016, while the FDA 510(k) record and official releases place the company in Boston, Massachusetts. The practical takeaway is that PathAI monetizes a mix of pathology workflow software, AI-enabled interpretation tools, and biopharma / translational-research support, giving it exposure to both clinical-lab operations and drug-development budgets.",
