    {
      "id": "milestones-regulatory-proof-and-scale",
      "title": "Milestones, regulatory proof, and named deployment scale",
      "body": "PathAI's milestone curve shows a company moving from research credibility toward operational and regulatory infrastructure. Company history pages say PathAI expanded into clinical diagnostics in 2021 through the Poplar Healthcare acquisition and built a CAP/CLIA-certified GCLP histopathology lab in 2022 for biopharma support. The 2025 FDA release and FDA database entry then materially changed the quality of proof by confirming K243391 for AISight Dx, together with an authorized Predetermined Change Control Plan, followed by a 2025 scanner expansion that added Roche VENTANA DP 200 and DP 600 compatibility. Scale claims are also better grounded in 2026 than they were in the startup era. Labcorp announced a nationwide AISight rollout across its network of anatomic-pathology labs and hospital collaborations, and MedStar announced a multi-site deployment across laboratories supporting more than 40 pathologists. PathAI's publications hub and a Nature Communications paper with PathAI authors further show that the company has built real technical depth, not just sales collateral. Taken together, the retained evidence supports a transition from AI research vendor to regulated digital pathology platform with recognizable lab and health-system traction.",
