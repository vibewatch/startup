    {
      "id": "founders-leadership-and-key-person-risk",
      "title": "Founders, leadership, and key-person dependence",
      "body": "The leadership record is identifiable enough to establish control points, but not complete enough to dismiss concentration risk. PathAI's current public leadership snippet names Andy Beck as chief executive officer and co-founder, and lists Brandon Eldredge, Liz Storti, Eric Walk, Nick Brown, and Chris Kirby in finance, people, medical, growth, and legal roles. Founder continuity is strongest around Beck and Aditya Khosla. The 2021 financing release still called Khosla the co-founder and chief technology officer, while his MIT-hosted biography describes him as PathAI's founder / CTO with a PhD in computer vision and machine learning. That pairing gives the company a clear medicine-plus-AI origin story, but it also means the public case for strategy and technical credibility still rests heavily on two founders. The fetched official surfaces do not provide a clean current board roster, so governance below the executive layer remains a real diligence gap rather than a box checked by public disclosure.",
