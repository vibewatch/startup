company:
  name: PathAI
chapter:
  number: 4
  title: Financials
  summary: >
    PathAI's revenue model spans AISight IMS licensing, biopharma clinical-trial support, and companion-diagnostic co-development; the Quest lab divestiture in 2024 for $100 million (confirmed by Quest's 2024 10-K SEC filing) sharpened the business toward software and algorithms, while the pending Roche acquisition at $750 million upfront frames capital adequacy through a strategic exit lens rather than standalone runway. Public financial disclosure is materially incomplete: no verified ARR, gross margin, burn rate, or customer concentration is available, making conservative proxies and explicit evidence gaps the best available underwriting tools.

sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization streams
    body: >
      PathAI's monetization rests on three interlocking segments. First, AISight — described on the PathAI homepage as a cloud-native, open platform enterprise workflow solution — is licensed to clinical pathology laboratories and health systems as its primary clinical software product. The Labcorp national deployment (February 2026) and MedStar multi-site rollout (April 2026) are the most prominent named AISight installations, but neither announcement disclosed contract value, annual payment terms, or volume commitments. Second, biopharma services encompass clinical trial support, AI-powered biomarker discovery, and translational research — the segment that Roche's May 2026 press release explicitly cited as a primary acquisition driver alongside companion-diagnostic co-development. Roche frames combining PathAI's "strength in AI-driven solutions, including clinical trial support and translational research" with Roche's companion-diagnostics expertise as the strategic logic for the $750M upfront payment. Third, companion-diagnostic co-development had already begun as a Roche-PathAI partnership item after the 2024 expansion, providing a separate milestone and royalty-based revenue potential. After the June 2024 Quest divestiture, PathAI formally exited the owned-diagnostics-lab segment (the 350-person Poplar Healthcare acquisition that had operated since 2021) but retained a separate biopharma research laboratory in Memphis. Quest became both an AISight licensee and a preferred lab-services partner for PathAI's biopharma clients, creating a revenue-sharing and channel arrangement. PathAI's Deloitte Technology Fast 500 announcement (November 2024, rank 420) attributed 260% growth to "both sides of the business — digital diagnostics and biopharma," confirming a dual-segment revenue model without disclosing absolute revenue figures.
