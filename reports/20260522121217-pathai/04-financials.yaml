callouts:
  - calloutType: risk
    title: No gross margin or operating loss data available
    body: >
      PathAI has not disclosed gross margin, COGS, EBITDA, or operating loss in any publicly accessible source retained in this research run. This is the single most important underwriting gap: without margin data, the quality and sustainability of the revenue model cannot be assessed regardless of the absolute revenue level.
    claimRefs:
      - CI012
      - CI025
  - calloutType: insight
    title: Quest divestiture + Roche acquisition signals deliberate software-first pivot
    body: >
      PathAI's 2024 decision to sell the 350-person Poplar Healthcare diagnostics division to Quest for $100 million — confirmed in the Quest 2024 10-K — while retaining the software, algorithm, and biopharma lab assets, and the subsequent Roche acquisition framing AISight and biopharma services as the core value drivers, together signal a deliberate strategic shift away from capital-intensive owned-lab operations toward a software-and-services model. This improves the capital intensity profile but does not resolve the pricing opacity challenge.
    claimRefs:
      - CI015
      - CI016
      - CI034
      - CI039
  - calloutType: risk
    title: Clinical reimbursement remains an unresolved bottleneck
    body: >
      Independent analysis and PathAI's own CMS comment letter confirm that current fee-for-service reimbursement does not adequately cover AI-pathology tools. The 2026 Medicare Physician Fee Schedule cuts to core pathology codes add further pressure. Revenue quality in the clinical-lab segment therefore depends on enterprise-contract pricing power rather than reimbursement-supported baseline billing.
    claimRefs:
      - CI007
      - CI008
      - CI026
      - CI027
      - CI040

