  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: Verified annual revenue, ARR, or any company-disclosed revenue figure for any fiscal year
      whyItMatters: >
        Without a confirmed revenue figure, revenue quality, growth credibility, and the validity of the implied 7–10× revenue multiple cannot be assessed. Third-party estimates range from $80M to $250M, a 3× spread.
      diligencePath: >
        Request audited P&L or CFO-attested revenue figure in diligence data room; compare to Series C investor materials if accessible.
      relatedQuestionRefs:
        - QI006
        - QI004

    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: Current cash on hand, monthly burn rate, and runway in months
      whyItMatters: >
        Standalone capital adequacy in any scenario where the Roche close is delayed or fails cannot be assessed without these figures. PathAI has no public balance sheet.
      diligencePath: >
        Request CFO-prepared runway model and most recent management accounts (unaudited monthly financials and cash position).
      relatedQuestionRefs:
        - QI016

    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: AISight enterprise contract pricing, term length, and renewal provisions for the Labcorp, MedStar, and Quest licensing deals
      whyItMatters: >
        Revenue quality and renewability are entirely opaque without at least one redacted contract example. All three major 2026 partnership announcements explicitly declined to disclose financial terms.
      diligencePath: >
        Request redacted enterprise contract examples in diligence; ask for annual contract values, term length, and auto-renewal provisions.
      relatedQuestionRefs:
        - QI008

    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: Gross margin and cost of revenue by service line (AISight licensing vs. biopharma services vs. lab)
      whyItMatters: >
        Profitability path and operating leverage of the software model versus the services model are unknowable without COGS data. A high-services mix implies lower gross margins than a pure-SaaS model.
      diligencePath: >
        Request income statement with COGS breakdown by service line; compare to CRO peers (Labcorp, IQVIA) and digital-health SaaS benchmarks.
      relatedQuestionRefs:
        - QI012
        - QI015

    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: Revenue split between biopharma services segment and clinical/lab software segment
      whyItMatters: >
        Biopharma and lab-software carry different margin profiles, growth rates, and risk profiles. Without segment data, strategic risk concentration cannot be quantified.
      diligencePath: >
        Request segment reporting covering at least the last two fiscal years; clarify how the Quest divestiture affected segment definitions.
      relatedQuestionRefs:
        - QI020

    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: Customer revenue concentration schedule showing top-5 customers as a percentage of total revenue
      whyItMatters: >
        Labcorp and Quest together may represent a dominant share of revenue. Concentration risk is unquantifiable without a concentration schedule.
      diligencePath: >
        Request customer concentration schedule; assess risk if Roche close creates conflict of interest with Labcorp or Quest.
      relatedQuestionRefs:
        - QI024

    - type: missing-source
      severity: material
      topic: unit-economics-proxy
      missingEvidence: Credible public-company comparable data for unit economics benchmarking (CAC, LTV, gross margin for AI pathology or CRO-services peers)
      whyItMatters: >
        Without peer benchmarks, the reasonableness of inferred PathAI unit economics cannot be triangulated. No public company is a clean direct comparable.
      diligencePath: >
        Extract gross margin and unit economics data from Labcorp, IQVIA, Charles River, and Tempus (post-Paige) where disclosed; use as context, not exact benchmarks.
      relatedQuestionRefs:
        - QI010
        - QI023

    - type: private-evidence-only
      severity: minor
      topic: financial-opacity
      missingEvidence: Headcount by function and R&D investment as a percentage of revenue
      whyItMatters: >
        Investment intensity cannot be assessed without knowing how much of the workforce and spending goes to R&D versus sales and service delivery.
      diligencePath: >
        Request organizational headcount breakdown and P&L line items for R&D, S&M, and G&A.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: material
      topic: companion-diagnostics
      missingEvidence: Terms and realized milestone payments from the Roche-PathAI companion-diagnostic algorithm development partnership (2024 expansion)
      whyItMatters: >
        If milestone payments from the 2024 CDx partnership are material, they could represent non-recurring revenue that inflates the growth rate attributed to recurring contracts.
      diligencePath: >
        Request payment history from the 2021–2024 Roche partnership; obtain deal terms for the companion-diagnostic expansion agreement.
      relatedQuestionRefs:
        - QI009
        - QI018

