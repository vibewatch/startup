  - id: partner-and-dependency-risks
    title: Partner and dependency risks
    body: >
      PathAI's partner architecture creates a structural concentration problem. Labcorp's February 2026 nationwide AISight Dx deployment
      and Quest Diagnostics' 2024 acquisition of PathAI's Memphis lab (plus licensing agreements and preferred-provider status) mean two
      companies together control the majority of PathAI's US clinical distribution channel. If either relationship deteriorates — through
      contract non-renewal, service-level disputes, or changes following the Roche acquisition — PathAI would face a material revenue and
      channel disruption with no near-term replacement channel of equivalent scale. Labcorp is also a Series C investor, creating aligned
      interests in the short term but potential conflict if Roche's ownership changes the partnership dynamics.

      The Roche acquisition itself is PathAI's dominant dependency. As the pending acquirer, Roche is simultaneously a customer,
      technology partner, and financial exit. If the deal is blocked or materially delayed beyond H2 2026, PathAI would need to operate
      independently with no disclosed standalone financing runway, and the management team would be distracted after months of deal
      execution. Post-close integration risk is also real: absorbing PathAI into Roche Diagnostics' reporting structure could slow
      product roadmap decisions and create culture misalignment.

      PathAI's biopharma channel is broad but opaque. The company claims relationships with the majority of the top-15 global pharma
      companies, but no individual biopharma revenue share or contract term has been disclosed. A handful of large biopharma accounts
      likely constitute the majority of this revenue stream, creating concentration risk that cannot be fully assessed without internal
      data. Scanner vendor dependence adds technical risk: AISight Dx clearance covers Leica Aperio GT 450 DX, Hamamatsu NanoZoomer
      S360MD, and Roche VENTANA DP 200/600. Roche scanner reliability dissatisfaction reported by KLAS creates a cloud-platform
      dependency that PathAI cannot fully control, especially post-acquisition when Roche's scanner product roadmap becomes internal.
