  - id: financial-model-and-execution-risks
    title: Financial, model, and execution risks
    body: >
      PathAI's financial profile is almost entirely opaque. No ARR, burn rate, gross margin, or unit-economics metrics have been publicly
      disclosed; the company is private and the pending Roche acquisition eliminates any incentive for pre-close financial disclosure.
      Roche's $750M upfront payment implies a deal multiple, but the up-to-$300M milestone structure creates post-close contingent
      exposure that cannot be valued without knowing the specific milestone definitions and probabilities. If the deal closes late,
      PathAI faces prolonged uncertainty: employee retention pressure, inability to announce new strategic partnerships, and potential
      working capital constraints in the interim period.

      Integration execution is the largest post-deal risk. Absorbing a 500-to-750-person AI company into Roche's 45,000-person
      Diagnostics division requires careful product roadmap alignment, reporting structure decisions, and retention of key AI
      engineers and medical affairs talent. PathAI's founders — Andy Beck (CEO, co-founder) and Aditya Khosla (co-founder, CTO) —
      have driven both the scientific credibility and the commercial strategy. If either departs or transitions to a reduced role
      post-acquisition, PathAI risks losing the internal advocacy and technical continuity needed to sustain its AISight roadmap
      inside a large corporate structure.

      Reimbursement uncertainty creates a ceiling on PathAI's clinical SaaS revenue. As long as digital pathology Category III codes
      carry no RVU assignment, hospital labs lack a direct Medicare revenue justification for the AISight deployment cost. PathAI's
      own CMS advocacy correctly identifies reimbursement as the main commercial bottleneck, but the CMS rulemaking cycle means any
      Category I code pathway is years away at minimum. Healthcare sector data breaches are increasing in frequency and severity;
      clinical trial tissue data processing represents a high-value attack surface that requires continuous HIPAA and GDPR controls.
