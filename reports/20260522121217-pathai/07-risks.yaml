callouts:
  - calloutType: risk
    title: "Roche merger closing is the dominant near-term risk for PathAI"
    body: >
      The Roche acquisition is PathAI's primary value realization event and its largest single dependency. A failed or indefinitely
      delayed antitrust review would leave PathAI standalone with no confirmed financing runway, a distracted management team, and
      limited ability to announce new partnerships during deal pendency. No public evidence of completed HSR pre-merger notifications
      or EU DG COMP filings has been identified as of May 2026, making timeline certainty impossible.
    claimRefs:
      - CR001
      - CR002
      - CR026
      - CR027

  - calloutType: risk
    title: "CMS reimbursement stall structurally caps clinical revenue"
    body: >
      Digital pathology Category III CPT codes carry no national RVU assignment, eliminating direct Medicare revenue justification
      for hospital AISight deployments. PathAI's own 2025 CMS comment correctly identifies reimbursement as the main bottleneck, but
      the rulemaking path requires years of utilization data before Category I codes are possible. This creates a structural ceiling
      on clinical SaaS revenue that cannot be resolved through product or sales execution alone.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR041
      - CR042

  - calloutType: recommendation
    title: "Monitor five kill criteria before committing to any post-deal exposure"
    body: >
      Five thesis-break triggers warrant divestment or writedown if they occur: merger antitrust block or termination, FDA clearance
      revocation or PCCP enforcement, permanent CMS denial of Category I code pathway, Labcorp or Quest contract non-renewal, or
      a material HIPAA breach at PathAI or Roche post-close. These events are monitorable through public sources (FDA 510(k) database,
      HHS OCR breach portal, CMS PFS annual rulemaking, Roche investor communications) and should be tracked on a quarterly basis.
    claimRefs:
      - CR001
      - CR003
      - CR022
      - CR041
      - CR044

