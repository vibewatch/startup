      - number: '6.3'
        title: Retention, durability, and repeat engagement
        blocks:
          - type: paragraph
            body: >
              PathAI does not publicly disclose NRR, GRR, churn rate, or any customer-cohort retention metric. The
              company is pre-IPO and has no obligation to publish unit-economics data; the pending Roche acquisition
              further reduces any incentive for granular revenue disclosures. Despite this opacity, several proxy
              indicators for retention exist. Labcorp's relationship dates to at least 2020 and has expanded twice (2022
              and 2026), demonstrating multi-year retention and increasing contractual depth. Roche's involvement
              progressed from a 2021 collaboration to a 2024 expanded co-development agreement and then a 2026 full
              acquisition — the most extreme form of customer-to-acquirer progression. MedStar Health participated in
              PathAI's Early Access Program before signing the formal 2026 multi-year production partnership, a
              documented staged progression that is consistent with a customer retention and expansion playbook. Quest's
              ongoing licensing relationship and preferred-provider status for biopharma lab services constitute a
              dependency that structurally persists beyond any single contract cycle. No named customer has publicly
              announced departure, cancellation, or termination of an AISight relationship. However, the absence of
              adverse public disclosure should not be confused with confirmed retention; enterprise software switching
              costs and multi-year contract terms structurally suppress visible churn in this segment. For biopharma,
              the DDT qualification of AIM-MASH (December 2025) creates ongoing AIM-MASH dependency for any biopharma
              sponsor using it in a MASH trial — regulatory continuity risk (if the qualification were ever revisited)
              would represent a retention threat. PathAI's Precision Pathology Network, launched July 2025, is designed
              as a structural retention mechanism: member labs contribute de-identified data, gain early access to new
              algorithms, and participate in biopharma matchmaking, raising the switching cost for early network
              members.
