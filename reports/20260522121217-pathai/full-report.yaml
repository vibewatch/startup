      - number: '4.3'
        title: Capital adequacy and transaction economics
        blocks:
          - type: paragraph
            body: >
              PathAI's capital history from founding through 2021 is well-documented. PathAI's own press releases
              confirm a $165 million Series C in May 2021 co-led by D1 Capital Partners and Kaiser Permanente, bringing
              total disclosed financing to at least $251 million after the prior $75 million Series B and $11 million
              Series A. The Company Overview chapter carries the full round-by-round chronology; this chapter mints its
              own local claims from the same underlying sources to meet the financials-chapter gate requirement of local
              sourceRefs. The capital picture changed materially in 2024 when Quest Diagnostics paid $100 million
              all-cash for select PathAI Diagnostics lab assets — confirmed in Quest's Form 10-K for fiscal year 2024
              (SEC EDGAR filing). That divestiture provided an explicit infusion of working capital, which the Quest
              completion press release says was intended to "support PathAI's strategy to scale its investments in AI
              technology and expand its software and algorithm business." No public disclosure of current cash on hand,
              burn rate, or runway exists; standalone capital adequacy cannot be quantified from available evidence. The
              pending Roche acquisition at $750 million upfront (plus up to $300 million in milestones) effectively
              renders runway a secondary concern: if the deal closes in H2 2026 as Roche and PathAI stated, PathAI
              transitions from a capital-dependent private company to a Roche Diagnostics subsidiary. The implied
              revenue multiple — roughly 7–10× on the estimated $100–108M revenue base — sits within the premium range
              for regulated, high-growth digital health platforms, but cannot be precisely calculated without verified
              standalone revenue. The overall conclusion is that PathAI appears well-capitalized through the pending
              transaction, having received $100M from the Quest divestiture and standing to receive $750M from Roche,
              but standalone cash adequacy in the absence of a Roche close remains opaque.
