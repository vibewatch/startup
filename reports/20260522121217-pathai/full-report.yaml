  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              PathAI competes across three overlapping market perimeters that are often conflated in analyst reports:
              AI-powered digital pathology workflow software (the clinical segment anchored by AISight), computational
              pathology analytics sold to biopharma sponsors (the research/drug-development segment), and AI-enabled
              companion diagnostic tools co-developed with pharma partners (a regulatory product category). These
              perimeters share technology but differ sharply in buyer, budget, regulatory pathway, and revenue model.
              The clinical workflow segment covers whole-slide image management, AI diagnosis modules, cloud storage,
              and interoperability layers—but explicitly excludes scanner hardware, manual microscopy equipment, routine
              laboratory information systems without imaging capability, and professional pathologist billing. The
              biopharma analytics segment covers spatial biomarker quantification, digital tissue archives, and trial
              endpoint packages sold to pharma R&D teams—it is not reimbursed by payers and is not subject to FDA 510(k)
              clinical device regulation. The companion diagnostics segment is a distinct regulated product class where
              an AI biomarker test is co-labelled with a therapy, requiring a separate PMA or 510(k) submission.
              Status-quo substitutes for all three segments include manual glass-slide microscopy, outsourced
              histopathology laboratories, and contract research organizations providing histology services. Digital
              pathology historically progressed in adoption stages: scanner hardware first, then image management
              systems, then AI-integrated clinical workflows—meaning PathAI enters different buyers at different stages
              of their digitization journey.
            claimRefs:
              - CM015
              - CM016
              - CM023
          - type: table
            tableRef: TM001
            claimRefs:
