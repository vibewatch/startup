      - number: '2.5'
        title: Adoption Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite strong structural tailwinds, digital pathology faces a cluster of adoption constraints that
              collectively explain why fewer than 15% of US healthcare organizations have selected a vendor in 2026. The
              most consequential is the CMS reimbursement Catch-22: digital pathology add-on CPT codes introduced in
              2023 (Category III, 0751T–0763T) show only approximately 1.1% utilization in 2024 CMS data—almost
              certainly under-reported because labs lack incentive to report codes that carry no payment. CMS has stated
              it will not elevate these codes to permanent Category I status until utilization appears "meaningful,"
              trapping adoption in a self-fulfilling loop. The Digital Pathology Association's Reimbursement Task Force
              acknowledged this explicitly in a Q1 2026 update and partnered with healthcare consulting firm McDermott+
              to advocate for policy change. Second, whole-slide scanner capex of $250,000 to $500,000 or more per
              scanner, combined with storage and software costs, requires capital budget approval and ROI justification
              that smaller or financially constrained labs cannot easily provide. Third, LIS and EHR interoperability
              remains fragmented: DICOM WSI standards are only now reaching production-ready multi-vendor maturity in
              2026 per Meditecs, and integration with Epic, Cerner, or Sunquest LIS platforms is complex and not yet
              standardized. Fourth, labs must perform analytical and clinical validation for each AI algorithm they
              deploy—a time-consuming process that can take months and requires dedicated pathology and IT resources.
              Fifth, the 2025 MDPI study co-authored by AstraZeneca and Health Advances identified financial concerns,
              workflow disruption, and regulatory uncertainty as the top three barriers, adding peer-reviewed weight to
              the adoption challenge. The 2026 Medicare Physician Fee Schedule included efficiency adjustments and
              practice expense redistributions that ASCP argues will negatively affect facility-based specialists
              including pathologists, potentially reducing lab budgets for discretionary technology investments.
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: CMS Reimbursement Catch-22 Constrains Lab Market Growth
            body: >-
              The absence of permanent CMS Category I reimbursement for digital pathology CPT add-on codes is the single
              most consequential near-term constraint on PathAI's clinical lab addressable market. Only 1.1% of eligible
              encounters used the digital pathology codes in 2024, and CMS will not upgrade the codes until utilization
              rises—a self-reinforcing trap. Until reimbursement is resolved (DPA targets 2026–2028), most clinical labs
              cannot justify the capex required for full DP deployment, meaning PathAI's Labcorp and MedStar deployments
              remain outlier early adopters rather than indicators of broad market pull-through.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
              - CM028
          - type: callout
            title: PathAI's Roche Acquisition Validates Market But Removes Independent Sizing Signal
            body: >-
              Roche's agreement to acquire PathAI for USD 750 million upfront plus up to USD 300 million in milestones
              implicitly endorses the thesis that AI-powered digital pathology commands a premium valuation within the
              USD 2B+ and growing market. However, the pending acquisition also removes the clearest independent signal
              of PathAI's financial trajectory: once closed, revenue will be consolidated into Roche's diagnostics
              division and no longer separately disclosed, making future market-share analysis harder for independent
              researchers.
            calloutType: insight
            claimRefs:
              - CM001
              - CM025
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              PathAI competes across at least four competitor categories that buyers weigh simultaneously. Direct
              digital- pathology AI peers—Proscia, Paige (now Tempus), and Ibex Medical Analytics—offer AI algorithms
              and image management systems targeting overlapping clinical lab and biopharma customer bases. Incumbent
              scanner and platform vendors—Roche/Ventana/navify, Leica Biosystems (Aperio), and Philips
              IntelliSite—control scanner hardware selection and deeply influence IMS purchasing; their integrated
              stacks represent a structural entrenchment risk for pure-software AI platforms. Adjacent research-focused
              players—Visiopharm, Indica Labs, Aiforia—compete in pharma R&D and academic markets but have limited
              clinical FDA footprints. Status-quo and substitute alternatives—manual glass-slide microscopy, outsourced
              histopathology, and academic or internal-build AI programs—represent the reference point buyers measure
              any digital pathology investment against. The market consolidation of 2025–2026 is significant: Signify
              Research characterized Tempus acquiring Paige as a "hard reset" for the sector, and the Roche/PathAI deal
              creates the first vertically integrated stack spanning scanner hardware through FDA-cleared AI algorithms
              and companion diagnostics. As of May 2026, fewer than 15% of US healthcare organizations have selected a
              digital pathology vendor (KLAS 2026), leaving the majority of the total addressable market still
              uncontested. Competitive dynamics among vendors are therefore simultaneously about displacing each other
              at the margins while all together evangelizing adoption against the far larger status-quo base. Roche's
              pending acquisition of PathAI has not yet closed as of the report date, so PathAI still operates as an
              independent entity in its commercial relationships; the combined competitive posture post-close is
              anticipated but not yet realized.
            claimRefs:
