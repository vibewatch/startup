      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              AISight is deployed as a SaaS platform on Amazon Web Services, meaning labs activate without on-premise
              server investments beyond whole-slide imaging scanners. The platform uses HL7 messaging for bidirectional
              LIS synchronization; LigoLab's documented integration shows how specimen orders flow from the LIS into
              AISight and results loop back, enabling closed-loop workflows. PathAI announced DICOM support (including
              DICOMweb API) in late 2023, committing to enterprise image architecture interoperability with VNA/PACS
              environments common in large health systems. AISight Link, launched in September 2023, is PathAI's open
              API framework for integrating both PathAI-native and third-party AI algorithms directly into the viewing
              and reporting workflow. The platform's viewer supports multi-slide synchronized navigation, annotations,
              real-time collaboration, and AI overlay rendering for pathologist review. For biopharma customers, a
              separate GCLP-certified histopathology lab (built 2022) supports tissue-based clinical trial services
              outside the SaaS pathway. The scanner ecosystem is constrained: initial FDA clearance named only Hamamatsu
              NanoZoomer S360MD and Leica Aperio GT 450 DX; a PCCP-enabled expansion in August 2025 added Roche VENTANA
              DP 200 and DP 600. Adding further scanner models requires PCCP-documented validation cycles, creating a
              structural dependency on the scanner ecosystem and Roche/Leica/Hamamatsu partnerships. The AWS deployment
              offers scalability across national lab networks (demonstrated by Labcorp's nationwide rollout) but imposes
              cloud-infrastructure and bandwidth prerequisites that smaller labs may not easily meet.
