      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              The structural growth thesis for digital pathology rests on five converging forces. First, the pathologist
              workforce is acutely short: digital tools that automate triage, flagging, and measurement reduce per-case
              pathologist time and extend capacity, making throughput economics central to the ROI case for clinical lab
              buyers. Second, cancer incidence is rising globally—multiple analysts cite this as the primary volume
              driver for pathology slides, directly expanding the numerator of cases that benefit from AI-assisted
              review. Third, the NIH Bridge2AI program allocated USD 150 million in 2025 to validate AI pathology
              algorithms, providing a public-sector validation engine that reduces risk for clinical adopters and
              strengthens the evidence base for payer coverage submissions. Fourth, the June 2025 FDA clearance of
              AISight Dx (K243391) with a Predetermined Change Control Plan materially de-risked PathAI's clinical
              offering and established a regulatory precedent that enables faster future algorithm expansions without
              full new submissions. Fifth, pharma R&D demand for AI biomarker analysis in clinical trials continues to
              grow—PathAI's expanded 2022 collaboration with Bristol Myers Squibb and the Roche acquisition rationale
              both confirm that large pharma sees AI pathology as foundational to companion diagnostic development and
              personalized oncology drug pipelines. Mordor Intelligence also highlights that spatial omics workflows,
              which fuse morphological imaging with proteomic or transcriptomic data layers, are expanding scanner and
              analytics budgets beyond traditional brightfield pathology, creating an emerging adjacent market that
              PathAI's AI platform could address as a technology extension.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
