      - number: '2.2'
        title: Market Sizing and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst firms have sized the digital pathology market with estimates for 2026 that diverge by
              more than 35%, reflecting inconsistent definitions of hardware versus software versus services scope.
              Mordor Intelligence, in a January 2026 press release, values the total digital pathology market at USD
              2.01 billion in 2026, growing to USD 3.21 billion by 2031 at a 9.9% CAGR. Fortune Business Insights
              reports a more aggressive growth trajectory, sizing the market at USD 1.47 billion in 2026 and projecting
              USD 5.75 billion by 2034 at an 18.56% CAGR. Signify Research, whose methodology is disclosed as including
              proprietary surveys, projected the market would grow to approximately USD 2.1 billion cumulatively from
              2024 through 2029—a different scoping convention. The computational or AI pathology software subset
              (excluding scanner hardware) is sized at USD 798 million in 2026 per Coherent Market Insights and USD 728
              million in 2025 per Grand View Research, both projecting approximately 9.2–9.3% CAGR to 2033. This
              software-only lens is arguably more relevant to PathAI's revenue model than the all-inclusive
              hardware-and-services figures. The adjacent companion diagnostics market—where AI biomarker tools support
              targeted therapies—is substantially larger, at USD 9.56 billion in 2025 per Grand View Research growing at
              10.07% CAGR to 2033, versus Precedence Research's USD 11.20 billion in 2026 at 12.18% CAGR. The companion
              diagnostics market includes assays, reagents, PCR, and NGS platforms far beyond AI pathology software, but
              oncology's share (approximately 60% per research) is the relevant overlap with PathAI's clinical and
              pharma-facing algorithms. No analyst has published a clean PathAI-specific SAM or SOM estimate in this
              run; any such number would be highly speculative given the pending Roche acquisition and undisclosed
              private revenue.
