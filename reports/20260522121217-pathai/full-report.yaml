  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Roche deal fails or is formally terminated
        - Public announcement of deal termination or material adverse change invoked
        - Removes primary value anchor; standalone PathAI underwriting requires new base case at ~5x unconfirmed revenue
        - >-
          Exit secondary positions; recalibrate to standalone bear case ($300–540M); seek alternate strategic buyer
          intelligence
      - - Antitrust challenge filed at DOJ, FTC, or EU DG COMP
        - Public filing or material press coverage of regulatory review with remedies demanded
        - Delays H2 2026 close; increases integration uncertainty; introduces renegotiation risk on price or structure
        - Monitor closely; do not add exposure; hold through initial review if no structural remedies demanded
      - - Verified revenue materially below $75M
        - CFO confirmation or data room disclosure showing PathAI revenue below $75M trailing twelve months
        - Retroactively frames $750M deal at 10x+, well above sector norms; undermines valuation discipline thesis
        - Reassess; $750M still a Roche-committed price but signals high strategic premium rather than financial value
      - - CEO Andy Beck or CTO Aditya Khosla departs pre-close
        - Public announcement or credible press report of founder departure before deal close
        - Undermines data flywheel and PCCP maintenance thesis; may trigger MAC clause or Roche price renegotiation
        - Assess MAC risk; verify retention package; monitor deal timeline closely
      - - Roche renegotiates upfront below $650M
        - Public amended agreement with upfront payment < $650M
        - Reduces exit consideration materially; signals Roche discovered adverse information in due diligence
        - Exit secondary positions at first liquidity; treat as bear-case signal
    notes: >
      Thresholds are illustrative and editorial given absence of deal contract details; actual MAC clause definitions
      and Roche's legal rights to renegotiate are not publicly available. Trigger monitoring depends on public
      disclosure; private deal developments would not be detectable from public sources alone.
    claimRefs:
      - CV028
      - CV029
      - CV022
      - CV023
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials (revenue, gross margin, burn rate)
        - No company-disclosed or audited figure for ARR, gross margin, EBITDA, or burn rate
        - >-
          Without confirmed revenue, the 7x multiple cannot be stress-tested; ±50% error band materially changes
          valuation stance
        - CFO confirmation or data room; SAS 70 / Big-4 auditor report; pre-close financial diligence
      - - Milestone structure and thresholds
        - Up to $300M in milestones; triggers, measurement periods, and probability not publicly disclosed
        - Milestone optionality is ~28% of full deal value; without thresholds it cannot be discounted or underwritten
        - Deal documents (Merger Agreement); Latham & Watkins or Davis Polk for structure; PathAI board / CFO
      - - Cap table and preference overhang
        - >-
          Liquidation preferences for Series A/B/C investors not disclosed; D1 Capital, Kaiser Permanente, Tiger Global
          stakes unknown
        - LP-level returns at $750M may be substantially lower than headline deal value depending on preference stack
        - Pre-close cap table disclosure; PathAI CFO or shareholder legal counsel
      - - Antitrust filing status and regulatory clearance timeline
        - No DOJ, FTC, or EU DG COMP filing or status publicly confirmed as of May 22, 2026
        - Outstanding approvals are the primary deal-close risk; delay beyond Q1 2027 would constitute a negative signal
        - Roche investor relations; SEC Form 8-K updates; Howard Shelanski (Davis Polk antitrust counsel)
      - - CEO and key talent retention packages
        - No public disclosure of post-close retention incentives for Andy Beck, Aditya Khosla, or technical staff
        - >-
          Founder retention is prerequisite for data flywheel and PCCP maintenance value; departure triggers
          thesis-break
        - Executive compensation (Veronica Wissel, Davis Polk); Roche HR; PathAI board chair
      - - Biopharma revenue concentration and contract renewability
        - No individual biopharma customer disclosed; revenue concentration by customer unknown
        - If 1–2 biopharma clients represent >50% of service revenue, Roche acquisition risks losing them post-close
        - Customer list and contract terms in data room; CRM records; renewal rate tracking
      - - Post-close integration plan and AISight open platform commitment
        - No public statement from Roche on preserving AISight's vendor-neutral, open platform architecture post-close
        - >-
          Platform neutrality is PathAI's key non-Roche biopharma customer value proposition; loss of neutrality =
          customer churn
        - >-
          Roche Diagnostics integration leadership; Roche Diagnostics Day 2026 presentations; PathAI CEO public
          statements
    notes: >
      Diligence asks are ordered by materiality. Items 1 and 2 (revenue and milestone structure) are blocking for any
      secondary investment sized above token. Items 4 and 5 (antitrust and retention) are monitoring items for existing
      stakeholders. All seven items would be standard in pre-close institutional diligence.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV024
