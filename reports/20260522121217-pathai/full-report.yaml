      - number: '1.5'
        title: Adverse signals and unresolved evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest negative evidence in this run is structural rather than scandal-driven. Discoveries in
              Health Policy argues that digital pathology still suffers from narrow reimbursement pathways, and that
              PathAI's value may come more from workflow control, biopharma services, and companion diagnostics than
              from a broadly reimbursed standalone AI product. That argument is consistent with the Roche rationale
              itself: the buyer is paying for an image-management layer, AI analysis, and biomarker /
              companion-diagnostic optionality, not for a fully transparent, mature software P&L. Public disclosure
              remains materially incomplete on the metrics that would let an investor underwrite PathAI as a standalone
              company today. The fetched sources do not provide an exact current headcount, a current ARR or revenue
              run-rate, or a clean current board roster. They also do not translate the announced Roche consideration
              into a clean standalone current equity valuation because milestone payments are contingent and closing is
              still subject to approvals. As a result, PathAI's identity and strategic importance are well supported,
              but its current economics and governance remain partially private-evidence-only questions.
