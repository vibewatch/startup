        title: Funding history, investors, and ownership transition
        blocks:
          - type: paragraph
            body: >-
              PathAI's capital path is well supported from Series A onward. Fierce Biotech reported an $11 million
              Series A in 2017 led by General Catalyst, then PathAI's own 2019 release said a General Atlantic / General
              Catalyst-led Series B was completed at $75 million after strategic investments from Merck Global Health
