  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk landscape
        blocks:
          - type: paragraph
            body: >
              PathAI's regulatory footprint is anchored by a single FDA 510(k) clearance (K243391, June 2025) with an
              authorized Predetermined Change Control Plan, and a CE-IVD mark covering the EU, UK, and Switzerland. The
              PCCP is a structural advantage in the short term — it allows scanner and label expansions without full
              re-submissions — but it also creates a new layer of compliance burden: every change must stay within
              pre-authorized boundaries, and any out-of-scope modification forces a fresh 510(k). The FDA granted PCCP
              authorization to fewer than 60 devices as of July 2025, making PathAI an early adopter in an evolving
              regulatory framework with limited enforcement precedent.

              The most acute near-term legal risk is the Roche merger's antitrust and regulatory approval process,
              expected to close in the second half of 2026. Neither Roche nor PathAI has disclosed filings with the DOJ,
              FTC, or EU DG COMP, and no public evidence of a completed Hart-Scott-Rodino pre-merger notification
              exists. A deal failure at this stage would leave PathAI standalone with no confirmed financing runway and
              a management team distracted by months of deal preparation.

              CMS reimbursement represents a slower-burning structural risk. Digital pathology Category III CPT codes
              carry no national RVU assignment, meaning labs receive no direct Medicare payment for AISight-enabled
              workflows. PathAI filed formal CMS comments in 2025 recommending new HCPCS codes for AI-assisted
              diagnostics, but CMS has stated it requires substantial utilization data before transitioning to Category
              I codes with payment rates. This creates a catch-22 that limits hospital ROI justification for AISight
              deployment and constrains PathAI's clinical pricing power.

              PathAI's Privacy Notice (effective February 2025) governs personal information collected through its
              platforms and implies HIPAA Business Associate Agreement obligations with covered entity clients. No HIPAA
              enforcement actions or breach notifications involving PathAI appear in available healthcare breach
              tracking publications as of May 2026. Cross-border data handling for EU clinical trials must comply with
              GDPR and the EU MDR/IVDR framework; PathAI's CE-IVD mark requires ongoing notified body engagement, the
              timeline for which is not publicly confirmed.
