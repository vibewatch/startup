      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional positive — hold pending H2 2026 deal close
            body: >
              PathAI is a conditional positive at the Roche deal price. The $750 million upfront is a credible,
              strategically rational anchor consistent with AI diagnostics comparables. Do not underwrite the $300
              million milestone tranche from public evidence. Reassess immediately if deal-close signals deteriorate or
              if verified revenue materially disappoints. Standalone underwriting is not supportable.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV031
          - type: callout
            title: False-precision risk — revenue estimate carries ±50% uncertainty
            body: >
              The 7x implied multiple hinges on an unaudited $108M revenue estimate from third-party databases. A
              confirmed revenue of $60–70M would imply 10–12x+ on the upfront alone — a premium valuation requiring
              exceptional milestone discipline. Do not treat the multiple as precise until CFO-confirmed or audited
              revenue is obtained.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV024
          - type: callout
            title: Paige precedent sets the deal-failure floor
            body: >
              Paige raised $220M+ and exited at $81.25M — less than 40% of disclosed funding. This transaction
              establishes that FDA-cleared digital pathology AI is not immune to distress exit pricing without a
              committed strategic buyer. PathAI's $750M deal is 9x larger, but the Paige outcome is the relevant
              bear-case floor if the Roche deal fails.
            calloutType: insight
            claimRefs:
              - CV011
              - CV012
              - CV027
