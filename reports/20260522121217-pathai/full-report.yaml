  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >
              PathAI operates a two-tier product architecture: a clinical digital pathology platform (AISight/AISight
              Dx) and a biopharma precision pathology stack (AIM tools and the Precision Pathology Network). AISight is
              described on the PathAI website as a cloud-native, open enterprise image management system serving as the
              hub for case management, whole-slide image management, and AI application orchestration in pathology labs.
              The clinical variant, AISight Dx, received FDA 510(k) clearance K243391 in June 2025 for primary diagnosis
              use, becoming a Class II device (21 CFR 864.3700, product code QKQ). Agilent resells the RUO edition as a
              branded product through its own distribution channel, extending PathAI's commercial reach into
              research-oriented labs. The biopharma stack centers on AIM (AI-based Measurement) tools: AIM-MASH
              (formerly AIM-NASH) for MASH liver-biopsy scoring, AIM-TumorCellularity for molecular pathology support,
              and AIM-Derm for dermatopathology. AIM-MASH achieved a landmark regulatory milestone in December 2025 when
              the FDA qualified it as the first AI drug-development tool through the Drug Development Tools Biomarker
              Qualification Program, allowing biopharma sponsors to use it in phase 2/3 MASH trial submissions without
              revalidation. EMA issued a parallel CHMP qualification in March 2025. The Precision Pathology Network
              (PPN), launched July 2025, connects participating labs, research institutions, and biopharma partners in a
              shared digital infrastructure for biomarker discovery and standardized data contributions.
            claimRefs:
