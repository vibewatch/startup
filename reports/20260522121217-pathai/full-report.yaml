      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              PathAI is best understood in 2026 as a digital pathology infrastructure company rather than a narrow
              single-algorithm vendor. The company homepage describes AISight as a cloud-native, open enterprise
              workflow solution that acts as the hub for case management, image management, and artificial-intelligence
              applications in pathology workflows. The June 2025 FDA clearance announcement goes further by defining
              AISight Dx as PathAI's primary-diagnosis-capable image management system for clinical settings, which
              means the company now sells regulated workflow software in addition to research tooling. Company materials
              and the 2021 financing announcement consistently anchor PathAI's founding in 2016, while the FDA 510(k)
              record and official releases place the company in Boston, Massachusetts. The practical takeaway is that
              PathAI monetizes a mix of pathology workflow software, AI-enabled interpretation tools, and biopharma /
              translational-research support, giving it exposure to both clinical-lab operations and drug-development
              budgets.
