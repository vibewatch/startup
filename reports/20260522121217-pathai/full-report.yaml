      - number: '3.3'
        title: Pricing, Packaging, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Across every material commercial digital pathology AI vendor, publicly disclosed list pricing is absent.
              PathAI, Proscia, Paige (Tempus), and Ibex Medical Analytics all operate on custom enterprise pricing
              negotiated per client, typically accounting for site count, user volume, AI modules required, integration
              complexity, cloud storage, and multi-year contract length. This opacity makes buyer-side benchmarking
              impossible without a formal RFP process and means competitive displacement primarily occurs through
              proof-of-concept evaluations and KLAS/analyst reference checks rather than price lists. The post-
              acquisition bundling of Paige within Tempus's broader precision oncology platform introduces the
              possibility of cross-selling AI pathology tools alongside molecular diagnostics and clinical trial data
              services—a packaging dynamic that PathAI (pre-Roche close) cannot yet replicate. Roche's acquisition
              similarly implies that post-close, AISight will be marketed alongside Roche scanner hardware and Ventana
              companion diagnostic workflows, potentially at bundled enterprise pricing that standalone IMS-only vendors
              cannot match. Leica Aperio's go-to-market is hardware-first: labs that purchase Aperio GT scanners then
              face a proprietary software ecosystem (HALO AP DX, Aperio iQC) with tight integration incentives,
              representing a de facto hardware-to-software bundling model rather than a separate SaaS pricing
              arrangement. Proscia's Concentriq partners include Agilent Technologies and Siemens Healthineers—channel
              relationships that give it enterprise distribution reach beyond direct sales. Distribution for
              CMS-reimbursed digital pathology services remains nascent; the DPA is advocating for permanent
              reimbursement codes, but as of early 2026 Category III CPT add-on codes are tracking-only, with no
              national RVUs and no professional reimbursement—a constraint that depresses willingness-to-pay for purely
              clinical AI and concentrates revenue in biopharma contracts that avoid the payer system entirely. Only
              about 1.1% of eligible digital pathology procedures were captured via CMS add-on codes in 2024, far
              underrepresenting real adoption and signaling that administrative friction—not just clinical
              hesitancy—limits the codeable market for all vendors.
