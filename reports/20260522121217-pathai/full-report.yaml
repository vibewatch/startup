      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >
              The scenario tree branches on two sequential binary events: deal close (yes/no) and full milestone
              achievement (yes/partial/none). In the bull case, the Roche merger closes in H2 2026 as announced, all
              $300 million in milestones are triggered by regulatory approvals and commercial performance, and PathAI
              stakeholders receive the full $1.05 billion. At $108 million estimated revenue this represents roughly
              9.7x EV/Revenue — a premium justified if the companion-diagnostic and AI-pathology markets grow as
              projected and if PathAI's biopharma contracts continue compounding within Roche's network.

              In the base case, the deal closes at $750 million upfront. Partial milestone payments ($100–150 million)
              are earned over a 24–36 month post-close window from regulatory and commercial triggers, yielding total
              consideration of $850–900 million. This scenario is the most likely given that comparable diagnostics M&A
              transactions typically see partial milestone achievement and that no antitrust objection has been publicly
              signaled.

              In the bear case, the deal either fails entirely (antitrust block, material adverse change, or
              renegotiation) or closes at a materially reduced price. Under a deal-failure scenario, PathAI would be
              left standalone with no confirmed financing runway. The best available standalone comp is the Paige-Tempus
              precedent: Paige raised $220M+ and was acquired for $81.25M — a 63% haircut to disclosed funding —
              underscoring that FDA-cleared digital pathology AI is not immune to distress exit pricing if the primary
              strategic buyer walks. A standalone PathAI at 5x estimated revenue would be valued at approximately $540
              million, but that number is deeply uncertain given financial opacity, and the actual realized price could
              be substantially lower in a competitive sale absent the Roche premium.

              The probability weighting favors the base case. No antitrust objection has been publicly announced, Roche
              has a strong track record with diagnostic acquisitions (Foundation Medicine, GenMark), and the five-year
              pre-existing partnership substantially de-risks the integration thesis. The wild card is the $300 million
              milestone tranche, which merits conservative probability assignment absent knowledge of milestone
              thresholds.
            claimRefs:
