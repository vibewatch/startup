      - number: '5.5'
        title: Roadmap, deployment scale, critical dependencies, and risks
        blocks:
          - type: paragraph
            body: >
              PathAI's deployment trajectory accelerated sharply in 2025-2026. Labcorp announced a nationwide AISight Dx
              rollout across its entire anatomic-pathology network in February 2026, representing one of the largest
              AI-driven digital pathology deployments in US clinical history. MedStar Health deployed AISight Dx across
              multi-site labs supporting 40+ pathologists in 2026. Moffitt Cancer Center and Northwestern Medicine both
              announced AISight Dx deployments paired with AI co-development agreements. University Hospital Zurich
              (January 2026) deployed AISight Dx and AIM-TumorCellularity for routine molecular pathology, the first
              known EU clinical-routine deployment combining both products. PathAI's pending Roche acquisition ($750M
              upfront, up to $300M in milestones, announced May 2026) dominates the near-term roadmap. Roche's stated
              rationale—"to solve the digital pathology integration puzzle"—implicitly acknowledges that integration
              complexity is a recognized limitation, not a solved problem. Post-acquisition, PathAI's roadmap will be
              shaped by Roche priorities, creating product-direction uncertainty. Critical dependencies include: (1)
              scanner ecosystem—only PCCP-cleared scanner models supported for primary diagnosis, with VENTANA (Roche)
              and Leica/Hamamatsu as primary partners; (2) Quest and Labcorp licensing relationships that extend the
              commercial footprint; (3) FDA and EMA regulatory continuity for AIM-MASH and future AIM tool
              qualifications; (4) broader digital pathology adoption (still 10-15% of US organizations as of 2026).
              Adverse limiting factors include: limited public clinical performance data (most evidence is
              company-sponsored), validation burden on adopting labs, lack of confirmed ISO/SOC2 certification, and
              scanner-model dependence that creates procurement lock-in risks.
