      - number: '6.4'
        title: Expansion opportunities and concentration risks
        blocks:
          - type: paragraph
            body: >
              PathAI's most significant structural risk in the customer dimension is concentration. Labcorp and Quest
              together account for the two largest US reference lab networks, and both have AISight relationships. If
              Labcorp's commitment shifts post-Roche acquisition — whether due to integration priorities,
              scanner-ecosystem conflicts, or budget reallocation — PathAI's clinical proof story weakens materially.
              PathAI has not disclosed any biopharma customer concentration data, so it is unknown whether two or three
              sponsors represent the majority of clinical trial platform revenue. KLAS Research's February 2026 digital
              pathology report found that fewer than 15% of US healthcare organizations had adopted a digital pathology
              vendor, meaning the addressable market is mostly untapped but that the current named customer base is
              small in absolute terms. The same report identified scanner reliability and high upfront costs as the
              primary adoption barriers for community and mid-size labs. Decibio's 2025 digital pathology
              industrialization analysis notes that AI pathology vendors face difficulty meeting adoption forecasts due
              to procurement friction and cautious lab budgets. Community pathology labs, which make up the bulk of US
              anatomic pathology volume, are largely unserved by PathAI's current deployment model. Reimbursement
              uncertainty for AI-assisted digital pathology in routine clinical use is a procurement barrier that
              affects the community lab tier most severely, as they lack the scale to absorb uncompensated
              infrastructure investment. The Precision Pathology Network is PathAI's most credible expansion mechanism:
              it extends the addressable market by offering labs data-monetization and biopharma matchmaking, but no
              membership count, network revenue, or growth trajectory is publicly disclosed, making it impossible to
