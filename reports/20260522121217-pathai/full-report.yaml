        - label: Valuation discipline
          value: Medium — ~7x upfront on est. revenue; consistent with AI diagnostics comps; revenue estimate low confidence
        - label: Evidence quality
          value: Medium — regulatory and commercial narrative well-supported; financial metrics opaque; no audited data
