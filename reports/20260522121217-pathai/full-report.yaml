      - number: '2.3'
        title: Buyer Segmentation and Adoption Dynamics
        blocks:
          - type: paragraph
            body: >-
              The digital pathology buyer universe splits into two structurally different categories with different
              procurement logic, budget cycles, and product requirements. The clinical buyer—which includes independent
              reference laboratories such as Labcorp and Quest Diagnostics, health systems with hospital-based pathology
              labs, and academic medical centers—buys digital pathology to address workflow efficiency, workforce
              shortage, and diagnostic quality. Procurement is capital-intensive (scanner hardware, server or cloud
              infrastructure, software licensing) and governed by lab administrators, hospital CIOs, or pathology
              department chairs depending on institution size. Smaller, more progressive organizations with fewer
              pathologists are furthest along digitally because they have fewer alignment challenges per the KLAS 2026
              report. Among the larger organizations processing 100,000 or more cases, less than 40% of cases are
              handled digitally even where deployment has begun, indicating that full-volume conversion remains a
              multi-year project. The biopharma and pharma buyer— which includes large pharmaceutical sponsors such as
              Bristol Myers Squibb and AstraZeneca, biotech companies, and contract research organizations—buys AI
              pathology tools as a line item within R&D and clinical trial budgets, not as capital infrastructure.
              Budget ownership sits with VP Translational Medicine or CDx leads, and the procurement trigger is
              typically a companion diagnostic submission requirement or a biomarker discovery mandate. This buyer is
              not affected by CMS reimbursement policy at all. PathAI serves both buyer types and the KLAS 2026 report
              confirms it is in the short list of AI vendors being evaluated for clinical use alongside Ibex,
              Visiopharm, and Paige.ai. The AI integration mandate from buyers—that AI must integrate into the IMS
              workflow rather than operating as a separate system—is a key differentiator gap that PathAI with its
              integrated AISight platform is positioned to exploit.
