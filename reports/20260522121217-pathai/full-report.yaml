      - number: '7.2'
        title: Operational and technical risks
        blocks:
          - type: paragraph
            body: >
              Digital pathology's adoption curve creates both an opportunity and an operational risk for PathAI. The
              KLAS Digital Pathology 2026 report found fewer than 15% of US healthcare organizations had selected a
              digital pathology vendor, confirming early-stage market dynamics. While PathAI receives positive initial
              satisfaction ratings from early clinical customers for its proactive communication and hands-on
              integration approach, KLAS also found that Roche scanner customers — using Roche VENTANA DP 200 and DP
              600, which PathAI supports — reported significant dissatisfaction with reliability and throughput, an
              adverse signal that could slow PathAI deployments at Roche-scanner sites and complicate the pending
              acquisition rationale.

              Peer-reviewed research in 2025 and independent consultancy data confirm that workflow integration
              complexity and LIS compatibility are the dominant adoption barriers for digital pathology in US labs. Even
              high-performing AI tools can increase pathologist workload if they require parallel IT infrastructure or
              additional validation steps outside the primary IMS workflow. A 2026 Deloitte survey found only 22% of
              life sciences leaders had successfully scaled AI and just 9% reported significant returns, indicating that
              PathAI's biopharma customers face similar internal adoption headwinds.

              PathAI's PCCP framework requires that every change — scanner additions, algorithm updates, label
              expansions — be documented, validated, and traceable per the authorized change control plan. Any deviation
              triggers a new 510(k). This ongoing validation burden grows as PathAI expands the AISight Dx label to
              additional scanners and monitors. Cloud dependency adds a layer of uptime and interoperability risk:
              AISight is a cloud-native SaaS platform, and DICOM WSI interoperability across multi-vendor environments
              remains an active technical challenge despite recent standards progress. Procurement timelines for
              hospital IT can stretch 12–18 months, slowing revenue realization even after signed contracts.
