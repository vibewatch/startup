        - Roche deal closes H2 2026; $100–150M in milestones achieved over 24–36 months post-close
        - $850–900M (upfront + partial milestones)
        - Integration execution; CEO and key talent retention; biopharma client retention post-acquisition
      - - Bear — deal fails or renegotiates significantly
        - Low — no public evidence of deal stress as of May 22, 2026
        - Antitrust block or material adverse change forces deal failure or material price reduction; PathAI standalone
        - $300–540M (standalone 5x est. revenue; Paige-style pressure if competitive sale)
        - >-
          Financial opacity masks true standalone economics; limited alternate strategic buyer options at equivalent
          price
    notes: >
      Probability signals are editorial judgments based on sector precedent and publicly available evidence, not
      probabilistic models. The bear-case range of $300–540M is illustrative; standalone PathAI without Roche is not
      analytically supportable from public evidence and could be materially higher or lower.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV027
      - CV029
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance to PathAI
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >
        Comparable set is limited to publicly available transaction and market data; no comprehensive private-market
        database of all digital pathology AI transactions exists. Multiples for PathAI rely on a third-party revenue
        estimate, not company-disclosed financials.
    rows:
      - - 'Tempus AI (NASDAQ: TEM) — public AI diagnostics + data platform'
        - Trailing EV/Revenue (Q1 2026)
        - ~6.6x on ~$1.36B TTM revenue; EV ~$9.0B
        - Closest public comp — AI diagnostics + data platform with regulatory traction and pharma partnerships
        - Much larger scale ($1.36B vs. ~$108M est.), diversified (Ambry + Paige acquired), different revenue mix
      - - Paige — AI digital pathology, acquired by Tempus Aug 2025
        - M&A transaction value vs. disclosed funding
        - $81.25M acquisition price; <40% of $220M+ disclosed funding (implied sub-1x revenue)
        - Direct comp — FDA-cleared digital pathology AI with pharma and CDx focus
        - Distressed-exit dynamic; Tempus paid primarily in stock; PathAI's deal is 9x larger and cash-upfront
      - - Proscia — private AI pathology IMS, FDA 510(k) cleared (AP-Dx)
        - Series D round (April 2025)
        - $50M Series D; total funding undisclosed; private
        - Peer IMS competitor — FDA-cleared, biopharma focused, but smaller and no CDx partnership at scale
        - No disclosed valuation multiple; Series D round only; no acquisition price anchor
      - - HealthTech AI diagnostics sector — M&A multiples (2025)
        - EV/Revenue range for AI diagnostics M&A
        - 6–8x revenue for proven AI platforms; 4–6x for broader HealthTech
        - Sector-level benchmark for PathAI's implied multiple (~7x upfront / ~9.7x full deal)
        - Aggregate market data; not a specific transaction; not calibrated to PathAI's exact profile
      - - Roche Diagnostics — strategic context for deal size
        - PathAI deal as % of acquirer diagnostics revenue
        - $750M = ~5.4% of Roche Diagnostics CHF 13.8B (~$15.3B USD) 2025 revenue
        - Signals Roche views this as a strategic bolt-on, not a transformative balance-sheet bet
        - CHF/USD conversion approximation; 2026 revenue not yet reported; bolt-on framing may understate IP value
    notes: >
      All multiples are computed from publicly available market data or deal disclosures, not company-confirmed PathAI
      financials. PathAI's $108M revenue estimate from third-party databases (Growjo/ZoomInfo) is the only available
