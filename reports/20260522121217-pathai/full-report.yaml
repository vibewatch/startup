      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis rests on three compounding advantages. First, PathAI owns the only FDA-cleared IMS
              platform (AISight Dx, K243391) with an authorized Predetermined Change Control Plan and FDA/EMA-qualified
              AIM-MASH tool — a regulatory moat that took five years to assemble and cannot be shortcut by new entrants.
              Second, a five-year partnership with Roche has generated proprietary annotated clinical trial data that
              constitutes a self-reinforcing data flywheel: each new trial processed improves subsequent model
              generations, compounding the dataset advantage. Third, Roche's acquisition removes the standalone
              financing risk entirely, providing PathAI access to Roche's global diagnostics distribution network
              spanning 160+ countries and 600 million tests annually — an acceleration path no organic or partnership
              route could replicate.

              The anti-thesis is equally structured. Reimbursement for AI-enabled pathology remains structurally
              limited: digital pathology Category III CPT codes carry no RVU assignment, payers are not reimbursing
              workflow-efficiency benefits, and CMS rulemaking cycles mean any Category I transition is years away. If
              Roche internalizes PathAI and prioritizes its own CDx pipeline, rival biopharma partners may migrate to
              neutral platforms (Paige post-Tempus, Proscia, Ibex). The $300 million milestone component is entirely
              contingent and should not be weighted equally with the $750 million upfront when computing expected
              consideration. Furthermore, PathAI's value to Roche is primarily operational and strategic — AI pathology
              as precision medicine infrastructure — rather than a stand-alone SaaS P&L, which limits the re-rating
              potential that investors expected from a standalone IPO.
