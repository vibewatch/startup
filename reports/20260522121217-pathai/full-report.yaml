      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Paige Acquisition Price Signals Standalone AI Commercialization Ceiling
            body: >-
              Paige—having raised approximately $241M in venture capital—was acquired by Tempus for $81.25M, realizing
              approximately 33 cents on the dollar of invested capital. Signify Research characterized this as a "hard
              reset" for the sector, suggesting that standalone digital pathology AI without a large diagnostics
              distribution partner faces structural commercial scaling barriers. This is the most direct adverse signal
              on the standalone commercial viability of AI pathology platforms, and PathAI's pending Roche acquisition
              should be interpreted partly as a recognition of the same constraint.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP036
              - CP040
          - type: callout
            title: CMS Reimbursement Gap Caps Clinical AI Revenue Ceiling for All Vendors
            body: >-
              As of 2026, CMS digital pathology reimbursement is limited to Category III CPT add-on codes that track
              usage but carry no national RVUs and no professional reimbursement. Only approximately 1.1% of eligible
              procedures were captured via these codes in 2024. The Digital Pathology Association is advocating for
              permanent reimbursement but outcomes are uncertain. Until routine reimbursement exists, the revenue model
              for clinical-lab digital pathology AI depends on operational savings ROI and biopharma contracts—not
              incremental payer revenue—a structural constraint shared by PathAI, Proscia, Paige, and Ibex alike.
            calloutType: risk
            claimRefs:
              - CP026
              - CP027
              - CP035
          - type: callout
            title: Post-Consolidation Landscape Favors Vertically Integrated Platforms
            body: >-
              Both 2025–2026 major acquisitions combined AI capabilities with large diagnostics infrastructure: Roche
              acquires PathAI to complete a scanner-IMS-AI-CDx vertical stack, and Tempus acquires Paige to build the
              world's largest oncology foundation model. The remaining independent AI IMS players (Proscia, Ibex) will
              need to identify comparable distribution partnerships or face the risk of the same commercial ceiling that
              preceded the Paige sell-down.
            calloutType: insight
            claimRefs:
