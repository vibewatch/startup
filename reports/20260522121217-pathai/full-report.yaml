      - number: '3.2'
        title: Competitor Profiles and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Paige—now part of Tempus following an August 2025 acquisition for $81.25M—held the distinction of being
              the first company to receive two FDA-cleared histopathology AI tools and built its data position from
              nearly 7 million digitized pathology slides sourced from 45 countries. Post-acquisition, Tempus launched
              "Paige Predict" in early 2026—a multimodal tool covering 16 cancer types and 123 biomarkers from over
              200,000 de-identified cases—positioning the combined entity as a foundation-model-first oncology data
              platform rather than a pure workflow IMS player. The acquisition price was materially below Paige's
              approximately $241M total capital raised, a discount that Signify Research interpreted as evidence of
              structural commercial-scaling barriers for standalone AI pathology vendors without a large distribution
              partner. Proscia is the most consistently cited IMS alternative to PathAI in the US clinical market (per
              KLAS 2026). The company raised $50M in March 2025, bringing total capital to $130M, and its Concentriq
              platform carries FDA 510(k) clearance for primary diagnosis (Concentriq AP-Dx, 2024) and is used by 16 of
              the top 20 global pharmaceutical companies. Proscia reported over 22,000 daily patient diagnoses on
              Concentriq and estimated 2026 revenues of approximately $16.4M; its Concentriq Embeddings feature
              accelerates AI model development 13x for pharma customers, a moat-deepening differentiator in the
              biopharma segment. Ibex Medical Analytics received its first FDA 510(k) clearance in February 2025 (Ibex
              Prostate Detect, with 99.6% positive predictive value and demonstrated recovery of 13% of cancers
              initially missed), holds CE-IVDR certification, and reported over 70% year-on-year customer growth
              entering 2026, with the case volume on its platform doubling for the second consecutive year. In early
              2026 Ibex partnered with mTuitive to auto-populate AI diagnostic findings into structured pathology
              reports, expanding its clinical workflow footprint. Ibex is also expanding into biopharma, supporting
              antibody-drug conjugate development through IHC biomarker quantification. Leica Biosystems, a Danaher
              subsidiary, is identified by KLAS 2026 as the clear market leader for clinical scanner hardware in the US,
              with the Aperio GT 450 DX as the dominant clinical scanner. In early 2026 Leica launched the Aperio GT
              Elite and Aperio CS5, and partnered with Indica Labs to launch Aperio HALO AP DX—a fully integrated
              scanner-IMS- AI diagnostic workflow that reduces reliance on independent IMS vendors like PathAI or
              Proscia for Leica customers. Philips IntelliSite scored positively for enterprise reliability but was
              noted by KLAS to lag PathAI and Proscia on AI integration speed. Roche's navify Digital Pathology IMS,
              once PathAI closes, will inherit PathAI's AISight technology and become the foundation of a fully vertical
              stack—scanner (Ventana/Roche), IMS (navify/AISight), AI algorithms (PathAI), and companion diagnostics
              (Ventana CDx)—positioning Roche as the only player with clinical-grade assets at every layer.
