      - number: '4.2'
        title: Unit economics proxies and cost structure
        blocks:
          - type: paragraph
            body: >
              PathAI has not publicly disclosed gross margin, cost of revenue, CAC, LTV, churn, or R&D spend; every
              numeric estimate in this section is derived from third-party databases or market analysis rather than
              audited financials. Third-party commercial databases (Growjo, ZoomInfo, compworth.com) estimate PathAI's
              2024 annual revenue at approximately $108 million, with the meddeviceguide.com acquisition guide placing
              the range at $100–$250 million to reflect the uncertainty. The Deloitte Fast 500 2024 ranking, while an
              official PathAI announcement, establishes a 260% growth rate over an unspecified measurement period but
              does not state the base or terminal revenue. Employee estimates cluster at 400–500 as of 2024, implying a
              revenue-per-employee ratio of $200,000–$270,000 at the midpoint revenue estimate — within range for a
              professional services/SaaS hybrid but not verifiable without actuals. Capital intensity is elevated
              relative to pure SaaS peers because PathAI retains its GCLP-certified biopharma histopathology lab, built
              in 2022 for in-house tissue analytics. After the Quest divestiture eliminated the 350-person Memphis
              diagnostics operations, fixed service-delivery costs shrank materially; however, the retained Memphis
              biopharma lab represents ongoing lab infrastructure cost. PathAI submitted public comments to CMS in 2025
              proposing new Medicare billing codes (HCPCS Level II) covering assistive AI, black-box AI outputs, and
              companion diagnostics, and recommending physician work values pegged to existing professional-component
              pathology codes ($26–$40 range). This regulatory effort signals that current clinical reimbursement for
              standalone AI pathology tools is largely absent, reinforcing the read that biopharma services — which do
              not depend on fee-for-service Medicare billing — are the primary revenue-quality driver. The medusind.com
              reimbursement analysis notes that 2026 Medicare Physician Fee Schedule efficiency adjustments cut most
              core pathology interpretation CPT codes, adding structural downward pressure on any clinical revenue that
              does depend on traditional billing.
