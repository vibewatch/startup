      - number: '5.3'
        title: Biopharma platform, AIM tools, and developer signal
        blocks:
          - type: paragraph
            body: >
              PathAI's AIM product line is the most intellectually differentiated part of its offering. AIM-MASH uses
              deep-learning algorithms to score four NASH CRN features (steatosis, inflammation, hepatocyte ballooning,
              fibrosis) on H&E liver biopsies; the FDA's DDT qualification (December 2025) certifies it as a
              non-inferior alternative to expert-panel reads for enrollment and endpoint assessment in MASH phase 2/3
              trials without sponsor revalidation. EMA CHMP qualification (March 2025) provides the same benefit for
              European trial submissions, making AIM-MASH the first AI pathology tool with dual US-EU regulatory
              recognition for drug development. PathAI's AIM-TumorCellularity automates whole-slide tumor-cellularity
              quantification validated across 14+ tumor types, supporting NGS tissue adequacy scoring and molecular
              pathology in both clinical and biopharma workflows. PathAI's GitHub organization (Path-AI) maintains
              open-source repositories anchored to peer-reviewed publications: hif2gene (48 stars, 14 contributors;
              Nature paper), nuclear-features (quantification of cancer nuclear morphology; npj Precision Oncology
              2024), and AIM-NASH-DDT-manuscript (2 contributors). While these repos have modest community activity,
              they represent a genuine practitioner-community signal that PathAI publishes reproducible computational
              methods. At USCAP 2025, PathAI presented deep-learning tumor-detection research trained on 48,000+
              whole-slide images. At ECP 2025 (European Congress of Pathology, Vienna), PathAI unveiled integrations
