  topStrengths:
    - >-
      AISight Dx is an FDA-cleared digital pathology image-management system with PCCP support, making PathAI a
      regulated workflow asset rather than just a research-stage AI vendor.
    - >-
      Named 2026 deployments at Labcorp and MedStar show production adoption in enterprise pathology settings beyond
      logo-only proof.
    - >-
      Roche, Quest, and Labcorp relationships validate PathAI's strategic relevance across diagnostics, digital
      workflow, and biopharma enablement.
    - Peer-reviewed technical work and AIM-MASH / broader pathology milestones support real product and research depth.
  topRisks:
    - >-
      The Roche transaction is still pending antitrust and regulatory approval, and the $300M milestone tranche is
      contingent rather than guaranteed.
    - >-
      Public evidence does not disclose current revenue, ARR, margins, headcount, or a full board roster, limiting
      standalone underwriting confidence.
    - >-
      Digital pathology reimbursement and digitization adoption remain structurally slow, which caps PathAI's standalone
      monetization power.
    - >-
      Partner concentration and post-close integration could reduce platform neutrality and create execution risk if
      Roche reprioritizes the stack.
  unresolvedGaps:
    - Exact current revenue / ARR, gross margin, burn, and cash profile for the standalone business.
    - Current headcount and post-acquisition retention plan for key technical and commercial leaders.
    - Full board / governance structure and any transaction-related consent or preference terms.
    - Milestone definitions, probability, and expected timing inside the Roche agreement.
    - A cleaner bridge from disclosed historical funding to total capital invested and realized proceeds.
