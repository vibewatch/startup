schemaVersion: "report-v2"
artifact: product-tech
slug: modern-health
runDate: "2026-08-28"
company:
  name: Modern Health
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Modern Health's product is best understood as a configurable employer mental-health platform
    that combines assessment, care matching, coaching, therapy, psychiatry, family support,
    group-based programming, and self-guided content inside one employer-governed experience.
    Support documentation and current engineering job posts reveal a more specific operating model
    than the homepage alone: eligibility, identity and access, client configuration, reporting,
    care matching, provider operations, and web/mobile surfaces are all distinct product layers,
    supported by a modern full-stack environment centered on Python services, GraphQL and REST,
    React/React Native, PostgreSQL, Redis, Docker, and AWS. The company appears mature in core
    workflow design and compliance posture, but public technical diligence is still incomplete
    because no open API portal, formal architecture diagram, incident history, or detailed AI
    safety case is publicly visible from the retrieved sources.

sections:
  - id: product-definition-and-user-jobs
    title: Product definition in customer workflow terms
    body: >
      Modern Health is not just a directory of therapists or a meditation app. Its retrieved
      product and support surfaces describe a layered workforce mental-health benefit that begins
      with employer-sponsored access and then routes members to different care modalities depending
      on need, preferences, and plan design. The homepage describes one-on-one, group, and self-
      serve digital resources in a single platform, while the support center's care-offerings and
      types-of-care pages make the module set concrete: coaching, therapy, psychiatry and
      medication management, family care, self-guided content, Circles, Pathways, care advisors,
      crisis resources, and additional partner care. Importantly, multiple sources note that access
      depends on the member's employer-selected benefit package. That makes the product a
      configurable benefits operating system rather than a uniform direct-to-consumer app. In
      customer workflow terms, the primary jobs are rapid triage, modality matching, privacy-aware
      access, global localization, and employer reporting that turns a mental-health benefit into a
      governed enterprise program rather than a wellness perk.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE001
    figureRefs:
      - FE002

  - id: module-map-and-operating-workflow
    title: Module map and operating workflow
    body: >
      The product's support documentation fills in how these modules actually interact. Care
      Offerings describes three main one-to-one services—coaching, therapy, and psychiatry/
      medication management—while also explaining when each is appropriate and which pieces depend
      on benefit eligibility. Pathways adds a more structured program layer that combines one-to-
      one specialist sessions, interactive exercises, and assessments, and is explicitly available
      through web or mobile entry. Circles create scheduled, provider-led community sessions.
      Family care extends the workflow to couples and covered dependents, including minors, with a
      matching process that the app itself does not fully self-serve. The substance-use announcement
      adds high-acuity care coordination, screening, inpatient/outpatient navigation, and sober-
      curious group support, showing that Modern Health's workflow extends beyond low-acuity
      coaching. This is operationally important: the company is trying to own the routing and
      coordination layer across a spectrum of severity, not only deliver isolated therapy sessions.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
    tableRefs:
      - TE002
    figureRefs:
      - FE004

  - id: architecture-delivery-and-engineering-signals
    title: Architecture, delivery model, and engineering signals
    body: >
      Modern Health's public engineering-job evidence is unusually informative for a private
      company. Current staff-engineer postings say the Growth Engineering team owns eligibility
      processing, identity and access, client configuration, and the reporting platform—the core
      systems that make enterprise launches and secure member access work at scale. The same posts
      describe a full-stack environment of Python services using Django, Flask, FastAPI, and
      aiohttp; GraphQL and REST APIs; React and React Native front ends; PostgreSQL and Redis data
      systems; Docker; and AWS services including ECS, RDS, and CloudFront. The role also mentions
      SSO protocols such as SAML, OIDC, and JWT, technical specs and RFCs, unit and integration
      tests, cross-team forums, and on-call remediation. Taken together, that suggests a fairly
      mature software organization with explicit platform boundaries, not a lightly assembled vendor
      website layered over third-party care. What remains unverified is the internal detail behind
      matching algorithms, data architecture, multi-region deployment, or any production use of AI/
      LLM features beyond exploratory or optional hiring signals.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003

  - id: differentiation-maturity-and-roadmap-signals
    title: Differentiation, maturity, and roadmap signals
    body: >
      Modern Health's strongest product differentiation is operational rather than purely technical.
      The clearest wedge in public sources is the combination of an internal provider network,
      stepped-care or adaptive-care matching logic, personalization by demographics and
      specialization, and localization across global workforces. The coaching-and-therapy article
      says the provider network is built in-house and monitored through synced calendars and a
      real-time monitoring engine; it also claims a one-day global average to first available
      session, 4.9 out of 5 post-session ratings, and 98% same-day specialized matches. Those are
      meaningful maturity signals because they speak to workflow performance rather than marketing
      abstractions. Product-expansion signals also exist: Series D proceeds were earmarked in part
      for new forms of care and advanced reporting; the 2024 substance-use post introduced Care
      Connect and higher-acuity navigation; and current job descriptions mention AI/LLM-powered
      features as a desired skill area. Still, no public changelog or developer release notes show
      exactly how much of the platform is GA, in pilot, or under development, so roadmap confidence
      remains moderate rather than high.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
    tableRefs:
      - TE005

  - id: trust-safety-privacy-and-compliance
    title: Trust, safety, privacy, and compliance controls
    body: >
      Product diligence in digital mental health ultimately turns on trust and control boundaries.
      Modern Health's HIPAA notice is more substantive than its generic privacy or security landing
      pages and confirms that the company treats itself as an affiliated covered entity, describes
      treatment/payment/operations uses, says it will notify members after certain breaches, and
      explains how PHI may be shared with contracted third parties under safeguard agreements. The
      care-offerings documentation adds concrete product limits, such as benefit-based feature
      gating and a policy that Modern Health providers do not prescribe federally designated
      controlled substances because of DEA requirements. The HHS Security Rule summary and ONC
      privacy-and-security guidance show the regulatory frame into which the platform fits:
      administrative, physical, and technical safeguards, risk analysis, auditability, and minimum-
      necessary access control. Modern Health's engineering posts reinforce this by emphasizing
      HIPAA and GDPR compliance, identity protocols, and secure member access. What the public
      record does not clearly show is named certification status, penetration-test results,
      incident-response history, or a detailed safety case for AI-enabled product features. Those
      omissions do not prove weakness, but they do keep trust diligence incomplete.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
