  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: architecture-detail
      missingEvidence: "Company-published architecture diagram, API surface map, and integration documentation."
      whyItMatters: "Without these, investors cannot verify how configurable employer logic, privacy segregation, and care-routing services are actually implemented."
      diligencePath: "Request architecture diagrams, API inventory, SSO patterns, and implementation runbooks from engineering leadership."
      relatedQuestionRefs: [QE022, QE024]
    - type: private-evidence-only
      severity: material
      topic: security-attestation
      missingEvidence: "Named certifications, penetration-test summaries, incident history, and subprocessor controls."
      whyItMatters: "Policy statements and generic trust-center surfaces are not enough to assess enterprise security depth."
      diligencePath: "Request trust-center access, SOC 2 / HITRUST evidence, pentest executive summaries, incident register, and subprocessor list."
      relatedQuestionRefs: [QE023]
    - type: private-evidence-only
      severity: material
      topic: ai-governance
      missingEvidence: "Production scope, safety guardrails, evaluation method, and human-oversight design for any AI or LLM-enabled features."
      whyItMatters: "Mental-health routing and support features create elevated privacy, safety, and regulatory risk if AI is used without robust controls."
      diligencePath: "Request model inventory, risk classification, human-review checkpoints, offline evaluations, and any AI clinical-safety documentation."
      relatedQuestionRefs: [QE018, QE025]
