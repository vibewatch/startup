figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >
      Public evidence suggests a layered architecture that starts with employer-configured access,
      routes through care matching and provider operations, and exposes web/mobile experiences on a
      modern service stack.
    approximationNotes: >
      Modern Health has not published a formal architecture diagram. This stack is inferred from
      support content, HIPAA materials, and current engineering job posts.
    data:
      layers:
        - id: employer-config
          label: Employer Configuration Layer
          detail: >
            Benefit packaging, eligibility rules, plan-gated features, and reporting requirements
            set by each employer client
        - id: access-identity
          label: Identity and Access Layer
          detail: >
            Eligibility processing, secure member access, SSO support, and JWT/OIDC/SAML-driven
            authentication flows
        - id: care-routing
          label: Care Routing Layer
          detail: >
            Adaptive or stepped-care matching across coaching, therapy, psychiatry, Pathways,
            Circles, and Care Connect workflows
        - id: provider-ops
          label: Provider Operations Layer
          detail: >
            In-house provider-network vetting, scheduling, capacity balancing, and quality
            monitoring across global delivery
        - id: member-ux
          label: Member Experience Layer
          detail: >
            React web experiences and React Native mobile experiences for booking, matching,
            assessments, and content engagement
        - id: app-services
          label: Application Services Layer
          detail: >
            Python services using Django, Flask, FastAPI, aiohttp exposed via GraphQL and REST APIs
        - id: data-infra
          label: Data and Infrastructure Layer
          detail: >
            PostgreSQL, Redis, Docker, and AWS services such as ECS, RDS, and CloudFront
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017

