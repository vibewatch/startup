  topStrengths:
    - Real employer-benefit positioning with full-spectrum care and global delivery.
    - Customer proof includes hundreds of verified employers and quantified case-study outcomes.
    - Public revenue estimates imply meaningful late-stage scale rather than pilot-stage experimentation.
    - Category relevance remains validated by larger peers and partner distribution.
  topRisks:
    - The visible valuation anchor implies a premium multiple far above most public comparables.
    - Retention, gross margin, customer concentration, and current cash remain undisclosed.
    - Privacy, Part 2, and provider-access issues could compress valuation quickly.
    - The 2023 reset and later re-expansion obscure the current expense base and operating leverage.
    - IPO-grade exit readiness is not publicly evidenced.
  unresolvedGaps:
    - Current cap table, liquidation preferences, anti-dilution terms, and any 409A or recent mark support.
    - NRR, GRR, logo churn, top-customer concentration, and renewal calendar.
    - Gross margin and contribution margin by modality plus live burn and runway data.
    - Independent security or compliance attestations and a public-company-grade disclosure roadmap.
