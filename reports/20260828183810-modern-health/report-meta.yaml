      background: >-
        Watson founded Modern Health and later transitioned from CEO to Executive Chair when Matt
        Levin became CEO in April 2025.
      claimRefs: [CO009, CO010]
  foundingLocation: "San Francisco, California, United States"
  headquarters: "San Francisco, California, United States"
  productSummary: >-
    Modern Health offers a workforce mental-health platform with adaptive routing across digital
    content, coaching, therapy, psychiatry, family support, and higher-acuity behavioral-health
    workflows.
  customerFocus: >-
    Large and mid-market employers, benefits leaders, health plans, and partner channels serving
    employees and eligible dependents across geographically distributed workforces.
  businessModel: >-
    Employer-paid recurring contracts, typically structured as PEPM or similar benefit pricing,
    with value sold through access, outcomes, and healthcare-savings narratives rather than
    retail self-pay therapy demand.
  stage: "Late-stage private / Series D anchor"
  fundingStatus: >-
    Last officially disclosed financing was a US$74M Series D announced in September 2021 at a
    US$1.17B valuation. Independent trackers still cluster total funding around US$167M-170M and
    show later secondary-style marks near US$1.2B, but no new publicly documented priced round
    was verified in this run.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO010, CO017, CO021, CO024, CO026, CI025, CV039]
