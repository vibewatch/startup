companyProfile:
  summary: >-
    Modern Health is a San Francisco-based employer mental-health platform founded in 2017.
    The company sells to employers, benefits leaders, health plans, and channel partners,
    offering a full-spectrum mental-health benefit that spans self-guided support, coaching,
    therapy, psychiatry, family care, and substance-use support. Public evidence suggests the
    company now operates at meaningful scale: revenue estimates cluster around US$175M-183M,
    customer proof spans hundreds of employers, and partner distribution through Generali
    extends reach across more than 50 countries. Founder Alyson Watson moved to Executive Chair
    in 2025 while Matt Levin became CEO, signaling a shift toward later-stage operating scale.
    Even so, Modern Health remains a private company with limited public disclosure on retention,
    gross margin, and capital structure.
  foundedDate: "2017-01-01"
  founders:
