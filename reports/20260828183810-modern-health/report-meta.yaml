subtitle: "Scaled employer mental-health platform with real traction, but visible unicorn pricing still outruns disclosed proof"
coverageNotes: >-
  Public evidence through 2026-08-28 supports Modern Health as a real late-stage employer
  mental-health platform with meaningful revenue, hundreds of employer customers, global
  delivery, and a still-important category position. However, the strongest valuation anchor
  remains the September 2021 Series D at US$1.17B, while later tracker marks near US$1.2B
  are not backed by a newly disclosed priced round. Public materials still do not resolve net
  revenue retention, customer concentration, gross margin, current cash, or cap-table and
  preference detail. The report therefore treats valuation as price-sensitive and recommends a
  disciplined track posture rather than a buy call.
