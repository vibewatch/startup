artifact: market-analysis
slug: modern-health
runDate: "2026-08-28"
company:
  name: Modern Health
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Modern Health sells into the employer-sponsored behavioral health and workforce well-being
    market, a narrower commercial segment than the full U.S. or global behavioral health economy.
    Government, industry, and employer-facing sources support a large and growing backdrop driven
    by burnout, rising utilization, privacy-aware telehealth adoption, and demand for navigation
    across different severities of need, but they also show meaningful constraints from provider
    shortages, reimbursement friction, regulatory complexity, and inconsistent market-definition
    practices. Modern Health's coaching-forward, globally localized, employer-governed model fits
    the early-intervention and navigation-heavy layer of that market better than a pure therapy,
    meditation, or insurer-carve-out definition.

sections:
  - id: market-boundary-and-status-quo
    title: Market boundary, adjacencies, and status-quo substitutes
    body: >
      The relevant market for Modern Health is not simply "mental health apps" and not the entire
      behavioral health delivery economy either. The commercial category that best fits the company
      is employer-sponsored mental health and behavioral health benefits: software-enabled,
      services-enabled care that employers, health plans, or channel partners buy to support
      employees and eligible dependents across prevention, coaching, therapy, psychiatry, and
      related navigation. KFF's policy brief explicitly notes that employers may pay a per-member
      fee to behavioral health vendors to make apps and telebehavioral services available to
      employees. Modern Health's own employer and global pages reinforce that framing by emphasizing
      enterprise workflows, aggregated reporting, and a full-spectrum platform rather than retail
      subscriptions. Adjacent spend pools include legacy EAPs, managed behavioral health carve-outs,
      digital self-help apps, and chronic-condition programs that increasingly embed behavioral
      health support. Status-quo substitutes therefore include insurer-bundled behavioral health,
      traditional EAPs, in-network therapy accessed through health plans, and low-cost consumer
      mindfulness or teletherapy products. This boundary matters because broad behavioral-health TAM
      numbers overstate Modern Health's true accessible market unless filtered to employer-sponsored,
      digitally coordinated use cases.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
    tableRefs:
      - TM001
    figureRefs:
      - FM003

  - id: sizing-lenses-and-market-scale
    title: Market sizing lenses and what they do and do not measure
    body: >
      Available market-size estimates are large enough to confirm category importance but are too
      broad to be used mechanically as Modern Health's TAM. Precedence Research sizes the U.S.
      behavioral health market at $94.82B in 2025 growing to $174.78B by 2035, while its global
      behavioral health estimate is $184.94B in 2025 growing to $349.88B by 2035. Those figures
      include much more than employer-purchased digital behavioral benefits: outpatient counseling,
      facility-based care, addiction treatment, and broad disorder treatment all sit inside the
      totals. The stronger lens for Modern Health is the employer-sponsored subset described by KFF
      and UnitedHealthcare, where employers buy access, navigation, outcomes reporting, and
      graduated care options rather than reimburse every encounter directly. A bottom-up market lens
      also emerges from UHC's observation that about half of members seeking support may fit lower-
      severity options such as coaching or self-help rather than treatment-first therapy. Modern
      Health sits directly in that navigation layer. The result is a large TAM, a materially smaller
      SAM, and an even smaller SOM once geography, enterprise readiness, and employer-benefit budget
      ownership are applied.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002

  - id: buyer-user-payer-dynamics
    title: Buyer, user, payer, and adoption path dynamics
    body: >
      In this market the economic buyer is typically not the end user. Benefits, total rewards,
      HR, and sometimes health-plan or channel-partner teams own the budget and procurement
      decision, while employees and eligible family members are the actual users. Modern Health's
      employer-facing copy is explicit that the platform is designed to give HR leaders aggregated
      reporting, governance, and long-term planning support. UHC's 2026 employer trends note that
      buyers increasingly expect measurable outcomes such as reduced absenteeism, improved
      retention, and ROI rather than simple access counts. At the same time, user adoption still
      depends on lower-friction entry points, stigma-sensitive care options, and speed to support.
      This is where Modern Health's coaching-forward model matters: KFF, UHC, and the PMC coaching
      paper all describe a market in which not every employee needs traditional therapy, yet many
      workers still need structured mental health support. Competitor pages from Spring, Lyra,
      Headspace, Talkspace, and Optum show that the whole category is converging on this buyer-user
      split, but Modern Health's distinctive position is to make lower-acuity and globally localized
      support a procurement-strength rather than a clinical fallback.
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
    tableRefs:
      - TM003
    figureRefs:
      - FM004

  - id: growth-drivers-supporting-adoption
    title: Growth drivers supporting adoption
    body: >
      Four demand drivers recur across the evidence set. First, untreated or poorly managed mental
      health creates clear economic loss: WHO estimates 12 billion working days lost each year to
      depression and anxiety with about $1T of annual productivity cost, making workforce mental
      health a board-level issue rather than a soft perk. Second, employers continue to see high
      utilization pressure and budget relevance. UHC says nearly half of Americans plan to seek
      therapy within a year, behavioral health claims may rise 10% to 20% in 2026, and burnout has
      reached a six-year high. Third, digital infrastructure now supports continuous and localized
      care across geographies, which helps platforms such as Modern Health serve multinational
      workforces without forcing a U.S.-only therapy model. Fourth, the market increasingly rewards
      vendors that can prove outcomes, not just appointments. Modern Health's own economic value and
      coaching-research materials fit that trend by arguing for measurable claims savings and
      resilience gains from lower-acuity intervention. These drivers collectively favor platforms
      that can route members by need and show employer value over time.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
    tableRefs:
      - TM004

  - id: adoption-constraints-and-market-risks
    title: Adoption constraints, regulatory drag, and market-quality caveats
    body: >
      The same evidence also shows why market growth does not automatically translate into easy
      adoption. Provider shortages remain structural: the PMC coaching study cites shortages across
      many U.S. counties and frames coaching as a response to that gap, while BLS and HRSA data
      underscore a labor market that remains supply-constrained. KFF's policy analysis highlights a
      second constraint set around HIPAA, DEA prescribing rules, the FDA boundary between medical
      devices and general wellness tools, and changing telehealth flexibilities after the public
      health emergency. Those issues matter directly for vendors offering psychiatry, substance use
      support, or AI-enabled routing. Privacy and security expectations further raise procurement
      friction because employers want proof that sensitive employee data will remain segregated from
      management-level reporting. Finally, broad behavioral-health market reports often blur very
      different subsegments, making generic TAM claims unreliable for underwriting a specific vendor.
      Modern Health benefits from strong category tailwinds, but a careful investor should still
      narrow the addressable market to employer budgets, severity-mix fit, provider capacity, and
      regulatory compliance readiness.
    claimRefs:
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
      - CM039


