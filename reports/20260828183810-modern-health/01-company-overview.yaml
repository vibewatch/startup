company:
  name: Modern Health
chapter:
  number: 1
  title: Company Overview
  summary: >
    Modern Health is a San Francisco-founded employer mental health benefits platform built around
    an Adaptive Care Model that routes employees and eligible dependents across coaching, therapy,
    psychiatry, family support, substance use care, group sessions, and self-guided content.
    Official sources confirm a 2025 CEO transition from founder Alyson Watson to Matt Levin while
    Watson became Executive Chair, and third-party data sources cluster around roughly $167M-$170M
    of total funding, a last disclosed 2021 valuation of $1.17B, about 900+ employees globally,
    and a large but inconsistently disclosed employer customer base.

sections:
  - id: identity-and-business-model
    title: Identity, product scope, and business model
    body: >
      Modern Health positions itself as a workplace mental health platform sold to employers,
      benefits leaders, health plans, and channel partners rather than as a purely direct-to-
      consumer therapy marketplace. The company says its Adaptive Care Model connects support
      across the full spectrum in one platform, including self-guided content, one-on-one
      coaching, therapy, psychiatry and medication management, family care, substance use
      support, Pathways programs, and Circles group sessions. Official pages repeatedly frame the
      product as a global benefit for complex workforces, with a provider network spanning 200+
      countries and territories and 80+ languages. Commercially, the company emphasizes PEPM and
      usage-based pricing rather than public list pricing, indicating a negotiated enterprise
      sales motion. This identity matters for later chapters because Modern Health is not merely a
      digital therapy vendor; it is trying to replace or modernize legacy EAP and behavioral
      health benefit workflows with a broader, coaching-forward, employer-governed care platform.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003

  - id: founder-leadership-and-governance
    title: Founder, leadership transition, and governance signals
    body: >
      Founder Alyson Watson remains central to Modern Health's identity, but the company has now
      formalized a transition from founder-led operations to a more scaled operator model.
      Modern Health's official About page now introduces Watson as Founder and Executive Chair,
      while an April 2025 announcement named Matt Levin as CEO. The mirrored press release
      describes Levin as a long-time benefits, HR services, and healthcare executive with prior
      CEO experience at People 2.0 and Benefitfocus plus earlier roles at Aon and Hewitt.
      Publicly named board voices in that announcement included Kleiner Perkins partner Mamoon
      Hamid and 01 Advisors co-founder Dick Costolo, indicating continuing involvement from major
      capital providers. Secondary profiles also identify additional operating leaders spanning
      product, technology, finance, and operations. The combination of founder continuity,
      outside-investor governance, and an incoming CEO with benefits-industry experience suggests
      a company trying to pair mission credibility with tighter enterprise execution as it moves
      beyond the initial unicorn phase.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO002

  - id: funding-history-and-capital-profile
    title: Funding history, valuation, and capital profile
    body: >
      Modern Health's funding history is better documented than its current financial statements.
      The clearest verified financing marker is the company's September 2021 Series D
      announcement, which said Modern Health raised $74M at a $1.17B valuation. Tracxn and
      Latka both extend that chronology backward across seed, Series A, Series B, and Series C,
      but they differ modestly on total capital raised: Latka reports $167.4M across five rounds,
      while Tracxn reports roughly $170M across six rounds. That variance is small enough to use
      an approximate ~$170M total-raised framing, but it also signals why later-stage private
      company analysis must distinguish company-announced rounds from database reconstructions.
      No accessible official source reviewed in this run shows a new priced financing after 2021,
      even though third-party databases continue to describe the company as a unicorn and place
      its value around $1.2B. For valuation work, the 2021 Series D mark is the last disclosed
      hard anchor, while newer estimates should be treated as secondary and lower confidence.
    claimRefs:
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
    tableRefs:
      - TO003
      - TO005

  - id: scale-customer-footprint-and-operating-milestones
    title: Scale, customer footprint, and operating milestones
    body: >
      Modern Health's public scale disclosures are directionally strong but inconsistent in exact
      counts, which is typical for private benefits platforms. Official sources emphasize global
      reach, enterprise deployment, and outcomes rather than publishing a single canonical number
      of employers or covered lives. Independent sources partly fill the gap: Landbase lists 395
      verified company customers as of 2026, while Boring Business Nerd summarizes 250+
      enterprise customers and names examples including Dropbox, Lyft, Palo Alto Networks,
      Eventbrite, and Zendesk. Latka reports $174.6M of 2024 revenue and 922 employees by late
      2025, while RocketReach shows 912 employees and Great Place To Work shows 272 U.S.-based
      employees on its certification profile. The official case-study and outcomes pages supply
      additional proof points such as Rubrik's 63% registration rate and Midland States Bank's
      $110K reduction in behavioral health costs. Taken together, the evidence supports a company
      with meaningful multinational footprint, growing operating sophistication, and enough
      traction to support enterprise procurement, but still with private-company opacity around
      exact customer, member, and revenue definitions.
    claimRefs:
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
    tableRefs:
      - TO004
    figureRefs:
      - FO001

  - id: adverse-flags-and-open-questions
    title: Adverse flags, workforce reset, and unresolved questions
    body: >
      The available record also contains cautionary signals. External commentary describes Modern
      Health as a coaching-forward platform, but at least one independent review warns that a
      coaching-first funnel can frustrate employees who know they need therapy and can create a
      perception of delayed access if intake routing is not well calibrated. Workforce data also
      implies organizational turbulence: Latka's historical employee trail includes a sharp drop to
      375 employees in June 2024 before later rebounding above 900, while Great Place To Work's
      2024 U.S. certification profile shows only 272 domestic employees. Those figures do not by
      themselves prove the exact magnitude of a 2023 restructuring, but they do corroborate the
      user's starting note that the company went through a large workforce reset before regaining
      scale. In addition, public materials still do not provide audited financial statements,
      current board composition, exact employer count, covered lives, concentration, or a clearly
      disclosed post-2021 valuation event. Those gaps limit confidence in any high-conviction
      investment view and need explicit carry-forward into later chapters.
    claimRefs:
      - CO034
      - CO035
      - CO036
      - CO037
      - CO038
      - CO039


