      - number: '7.5'
        title: Mitigation priorities and kill criteria
        blocks:
          - type: paragraph
            body: >
              Modern Health does have visible controls. The HIPAA notice is more substantive than many startup privacy
              pages, the compliance page references supplier diligence and reporting channels, provider terms define
              misuse boundaries, and customer-facing materials consistently emphasize reporting and guided deployment
              rather than pure self-service. These are not trivial. They suggest the company understands that its risk
              profile is operational and regulatory, not just commercial.

              But visible controls are only partial mitigations until they are matched with private evidence. For this
              business, the decisive diligence questions are measurable: actual incident history, independent security
              attestations, provider wait-time and fill-rate data by geography, customer- success staffing ratios,
              top-customer concentration, churn cohorts, and current runway. The kill criteria should therefore be
              framed around events and thresholds rather than abstract concern. A material privacy event, an enforcement
              action, worsening network access, a major customer loss, or financing at clearly compressed terms would
              each materially damage the investment case.
            claimRefs:
              - CR011
              - CR040
              - CR041
              - CR043
