      - number: '1.5'
        title: Adverse flags, workforce reset, and unresolved questions
        blocks:
          - type: paragraph
            body: >
              The available record also contains cautionary signals. External commentary describes Modern Health as a
              coaching-forward platform, but at least one independent review warns that a coaching-first funnel can
              frustrate employees who know they need therapy and can create a perception of delayed access if intake
              routing is not well calibrated. Workforce data also implies organizational turbulence: Latka's historical
              employee trail includes a sharp drop to 375 employees in June 2024 before later rebounding above 900,
              while Great Place To Work's 2024 U.S. certification profile shows only 272 domestic employees. Those
              figures do not by themselves prove the exact magnitude of a 2023 restructuring, but they do corroborate
              the user's starting note that the company went through a large workforce reset before regaining scale. In
              addition, public materials still do not provide audited financial statements, current board composition,
              exact employer count, covered lives, concentration, or a clearly disclosed post-2021 valuation event.
              Those gaps limit confidence in any high-conviction investment view and need explicit carry-forward into
              later chapters.
