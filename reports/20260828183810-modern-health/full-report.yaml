  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              The relevant market for Modern Health is not simply "mental health apps" and not the entire behavioral
              health delivery economy either. The commercial category that best fits the company is employer-sponsored
              mental health and behavioral health benefits: software-enabled, services-enabled care that employers,
              health plans, or channel partners buy to support employees and eligible dependents across prevention,
              coaching, therapy, psychiatry, and related navigation. KFF's policy brief explicitly notes that employers
              may pay a per-member fee to behavioral health vendors to make apps and telebehavioral services available
              to employees. Modern Health's own employer and global pages reinforce that framing by emphasizing
              enterprise workflows, aggregated reporting, and a full-spectrum platform rather than retail subscriptions.
              Adjacent spend pools include legacy EAPs, managed behavioral health carve-outs, digital self-help apps,
              and chronic-condition programs that increasingly embed behavioral health support. Status-quo substitutes
              therefore include insurer-bundled behavioral health, traditional EAPs, in-network therapy accessed through
              health plans, and low-cost consumer mindfulness or teletherapy products. This boundary matters because
              broad behavioral-health TAM numbers overstate Modern Health's true accessible market unless filtered to
              employer-sponsored, digitally coordinated use cases.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
