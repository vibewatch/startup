      - number: '3.3'
        title: Prevention-first, teletherapy-first, and incumbent substitutes
        blocks:
          - type: paragraph
            body: >
              Headspace, Calm Health, Talkspace, Optum, and Magellan matter because enterprise buyers do not always shop
              for the same objective. Headspace sells an end-to-end proposition trusted by 4,000+ organizations with
              15k+ providers, sub-day therapy access, and an unusually powerful consumer brand in meditation and
              mindfulness. Calm Health stays more prevention and engagement oriented, using psychologist-developed
              programs, screenings, action plans, and app-native mindfulness content to drive activation inside an
              employer or health-plan benefit ecosystem. Talkspace is more therapy- and psychiatry-centric, stressing
              research depth, nationwide licensure coverage, and convenience across 150+ treated conditions. Optum and
              Magellan represent a different threat: less product elegance, but much stronger bundle and incumbent
              advantage through existing payer, PBM, or behavioral health relationships. These substitute categories can
              beat Modern Health on simplicity, perceived cost, or procurement inertia even when they lose on integrated
              user experience or coaching-forward design.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
      - number: '3.4'
        title: Pricing, distribution, switching costs, and multi-homing
        blocks:
          - type: paragraph
            body: >
              Public pricing remains intentionally opaque across this category, so the better question is not "who is
              cheapest" but "what commercial structure lowers switching friction for the buyer". Modern Health, Lyra,
              and Spring all rely on customized enterprise pricing, while Modern Health most explicitly advertises PEPM
              or usage-based flexibility. Lyra's and Spring's sites emphasize tailored pricing paired with outcomes or
              ROI narratives. Headspace and Calm can appear easier to pilot because their products retain a stronger
              self-serve or consumer- facing component, while Talkspace can be benchmarked against retail therapy
              access. Optum and Magellan often benefit from insurer or incumbent bundling, making their effective cost
              to the employer appear lower even if user experience is weaker. That dynamic raises switching costs:
              employers must justify not just product quality, but why replacing an embedded EAP, payer, or app bundle
              will materially improve access, outcomes, or cost. Multi-homing is easiest in prevention content and
              hardest where reporting, privacy architecture, vendor governance, and care navigation are deeply
              integrated into enterprise workflows.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
