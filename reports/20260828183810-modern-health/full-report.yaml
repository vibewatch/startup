              - CM037
      - number: '2.5'
        title: Adoption constraints, regulatory drag, and market-quality caveats
        blocks:
          - type: paragraph
            body: >
              The same evidence also shows why market growth does not automatically translate into easy adoption.
              Provider shortages remain structural: the PMC coaching study cites shortages across many U.S. counties and
              frames coaching as a response to that gap, while BLS and HRSA data underscore a labor market that remains
              supply-constrained. KFF's policy analysis highlights a second constraint set around HIPAA, DEA prescribing
              rules, the FDA boundary between medical devices and general wellness tools, and changing telehealth
              flexibilities after the public health emergency. Those issues matter directly for vendors offering
              psychiatry, substance use support, or AI-enabled routing. Privacy and security expectations further raise
              procurement friction because employers want proof that sensitive employee data will remain segregated from
              management-level reporting. Finally, broad behavioral-health market reports often blur very different
              subsegments, making generic TAM claims unreliable for underwriting a specific vendor. Modern Health
              benefits from strong category tailwinds, but a careful investor should still narrow the addressable market
              to employer budgets, severity-mix fit, provider capacity, and regulatory compliance readiness.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
