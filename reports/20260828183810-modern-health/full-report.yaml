      - number: '1.3'
        title: Funding history, valuation, and capital profile
        blocks:
          - type: paragraph
            body: >
              Modern Health's funding history is better documented than its current financial statements. The clearest
              verified financing marker is the company's September 2021 Series D announcement, which said Modern Health
              raised $74M at a $1.17B valuation. Tracxn and Latka both extend that chronology backward across seed,
              Series A, Series B, and Series C, but they differ modestly on total capital raised: Latka reports $167.4M
              across five rounds, while Tracxn reports roughly $170M across six rounds. That variance is small enough to
              use an approximate ~$170M total-raised framing, but it also signals why later-stage private company
              analysis must distinguish company-announced rounds from database reconstructions. No accessible official
              source reviewed in this run shows a new priced financing after 2021, even though third-party databases
              continue to describe the company as a unicorn and place its value around $1.2B. For valuation work, the
              2021 Series D mark is the last disclosed hard anchor, while newer estimates should be treated as secondary
              and lower confidence.
