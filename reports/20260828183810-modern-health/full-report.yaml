      - number: '8.4'
        title: Exit readiness and likely catalysts
        blocks:
          - type: paragraph
            body: >
              Public evidence does not support calling Modern Health IPO-ready today. Compared with public mental-
              health and benefits comps, the company still withholds exactly the information a public buyer or late-
              stage crossover investor would expect: audited revenue progression, gross margin, churn and expansion,
              concentration, current cash, and the structure of liquidation preferences or other cap-table terms. The
              Teladoc public filing and investor surface illustrates the difference clearly: public peers can be judged
              quarterly on revenue, segment mix, and capital structure, while Modern Health still requires a
              belief-based leap. That does not eliminate exit optionality. Strategic interest is plausible because
              mental-health capabilities remain valuable to employers, payers, navigation platforms, and virtual- care
              ecosystems, and recent sector outcomes such as Talkspace's acquisition and Accolade's sale show that
              scaled benefits assets can still transact. But without a disclosure step-up, the most realistic near-term
              catalysts are a data-rich private round, a secondary-supported mark reset, or clearer proof of durable
              profitability rather than a clean public-market launch.
            claimRefs:
              - CV014
