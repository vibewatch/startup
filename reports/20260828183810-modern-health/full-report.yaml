  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >
              Modern Health is not just a directory of therapists or a meditation app. Its retrieved product and support
              surfaces describe a layered workforce mental-health benefit that begins with employer-sponsored access and
              then routes members to different care modalities depending on need, preferences, and plan design. The
              homepage describes one-on-one, group, and self- serve digital resources in a single platform, while the
              support center's care-offerings and types-of-care pages make the module set concrete: coaching, therapy,
              psychiatry and medication management, family care, self-guided content, Circles, Pathways, care advisors,
              crisis resources, and additional partner care. Importantly, multiple sources note that access depends on
              the member's employer-selected benefit package. That makes the product a configurable benefits operating
              system rather than a uniform direct-to-consumer app. In customer workflow terms, the primary jobs are
              rapid triage, modality matching, privacy-aware access, global localization, and employer reporting that
              turns a mental-health benefit into a governed enterprise program rather than a wellness perk.
