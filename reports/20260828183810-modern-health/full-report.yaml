        title: Customer base segmentation and buyer profile
        blocks:
          - type: paragraph
            body: >
              Modern Health's commercial relationship is clearly employer-led rather than consumer-led. The official
              site speaks to HR, benefits, and total-rewards stakeholders; the employer page stresses embedded access
              inside HR and benefits workflows; and the customer journey repeatedly centers on governance, reporting,
              and long-term workforce planning rather than one-off member transactions. That makes the economic buyer
              the employer, while the actual users are employees and eligible dependents who move across self-guided
              tools, coaching, therapy, psychiatry, and community care.

              The best-supported customer segment is the multinational or geographically distributed employer. Modern
              Health claims service coverage across 200+ countries and territories and 80+ languages, and customer
              examples such as Autodesk and Camunda show multi-country rollouts rather than single-office pilots. The
              product is also framed as a fit for employers that need a long-term benefits partner, aggregated
              reporting, and configurable regional deployment. Independent market-data sources do not fully agree on
              customer count, but they consistently place Modern Health in the category of scaled enterprise
              mental-health vendors serving many named employers rather than a niche point solution.
