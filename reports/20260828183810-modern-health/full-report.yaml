  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Privacy / PHI breach
        - Confirmed incident or material breach notification
        - Any externally disclosed material member-data incident
        - Pause investment or re-underwrite from first principles
      - - Part 2 noncompliance
        - OCR complaint, breach report, or enforcement action
        - Any substantiated OCR action tied to SUD records
        - Escalate legal diligence and haircut valuation materially
      - - Network access degradation
        - Wait-time and fill-rate trend
        - '>20% deterioration in therapy or psychiatry access in core geographies'
        - Assume weaker renewal quality and margin pressure
      - - Customer concentration realized
        - Top-account exposure review
        - '>25% ARR in top five customers or >10% ARR in one customer'
        - Demand price protection or concentration-specific covenants
      - - Renewal weakness
        - GRR / NRR / logo churn trend
        - NRR <100% or rising churn in large employers
        - Shift stance toward track or pass
      - - Implementation quality failure
        - CSAT / support backlog / SLA misses
        - Sustained missed SLAs or worsening CSAT for two quarters
        - Treat as early warning for employer churn
      - - Financing pressure
        - Cash runway and fundraising terms
        - <12 months runway or capital raised at clearly compressed terms
        - Assume dilution and lower negotiating leverage
      - - Security-attestation gap persists
        - Independent audit and pentest evidence
        - No credible attestation package despite diligence request
        - Increase discount rate and legal holdbacks or walk away
    notes: >
      These triggers are designed to be decision-useful. They convert broad risk themes into specific diligence asks and
      re-underwriting thresholds.
