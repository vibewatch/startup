  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and stream overview
        blocks:
          - type: paragraph
            body: >
              Modern Health's public materials support a classic employer-benefit revenue model more than a
              consumer-subscription or fee-for-service care model. The company sells a workforce mental health platform
              to employers, offers multiple pricing approaches aligned to budget and variability tolerance, and frames
              value in terms of population outcomes, health care savings, and member routing across coaching, therapy,
              psychiatry, and digital resources. Third-party procurement data from Vendr provides the clearest pricing
              structure: contracts are quoted on a per-employee-per-month basis across eligible employees, with annual
              terms, tiered service packages, optional family coverage, and negotiable implementation or integration
              components. That implies revenue is mostly recurring subscription revenue tied to covered lives rather
              than volatile encounter billing. Public customer proof and partnership evidence suggest three streams: the
              core employer platform subscription; premium or add-on modules such as expanded session coverage,
              dependent coverage, or specialized programs; and partner/channel revenue in which organizations such as
              Generali distribute Modern Health into employer populations. The exact revenue mix is undisclosed, but
              recurring contracted employer spend is clearly the economic center of the business.
