      - number: '3.5'
        title: Moat durability, commoditization risk, and the most dangerous threats
        blocks:
          - type: paragraph
            body: >
              Modern Health does have real differentiation, but it is more executional than impregnable. Adaptive care,
              coaching-first adoption design, and global localization address a genuine gap between meditation-only
              products and therapy-heavy clinical platforms. The problem is that none of those advantages is impossible
              for a well-capitalized competitor to copy. Lyra and Spring both have larger funding bases and stronger
              publicly articulated outcomes engines. Headspace brings a major consumer habit loop and broader content
              brand. Optum and Magellan can weaponize bundling and incumbency. Meanwhile, independent reviews show that
              a coaching- first funnel can create user friction if not paired with clear therapy escalation, which gives
              clinical-first competitors an attack line in procurement. The highest-confidence competitive risk is
              therefore not a single better feature, but commoditization of the blended-care mental health platform: if
              buyers conclude that multiple vendors now offer comparable coaching, therapy, analytics, and localization,
              then price, existing distribution, and published proof will matter more than Modern Health's original
              category narrative.
            claimRefs:
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
              - CP039
          - type: table
            tableRef: TP004
