      - number: '1.4'
        title: Scale, customer footprint, and operating milestones
        blocks:
          - type: paragraph
            body: >
              Modern Health's public scale disclosures are directionally strong but inconsistent in exact counts, which
              is typical for private benefits platforms. Official sources emphasize global reach, enterprise deployment,
              and outcomes rather than publishing a single canonical number of employers or covered lives. Independent
              sources partly fill the gap: Landbase lists 395 verified company customers as of 2026, while Boring
              Business Nerd summarizes 250+ enterprise customers and names examples including Dropbox, Lyft, Palo Alto
              Networks, Eventbrite, and Zendesk. Latka reports $174.6M of 2024 revenue and 922 employees by late 2025,
              while RocketReach shows 912 employees and Great Place To Work shows 272 U.S.-based employees on its
              certification profile. The official case-study and outcomes pages supply additional proof points such as
              Rubrik's 63% registration rate and Midland States Bank's $110K reduction in behavioral health costs. Taken
              together, the evidence supports a company with meaningful multinational footprint, growing operating
              sophistication, and enough traction to support enterprise procurement, but still with private-company
              opacity around exact customer, member, and revenue definitions.
