      - number: '8.3'
        title: Comparable multiples and scenario ranges
        blocks:
          - type: paragraph
            body: >
              The best public valuation frame is a blended one. Modern Health is close enough to Spring Health and Lyra
              to justify using private peer marks as evidence that the category can still command unicorn-scale
              valuations, but those private marks do not solve the pricing problem because they do not come with the
              full operating disclosure investors need today. Public comps are therefore the more disciplined anchor
              even though none is perfect. Talkspace is useful for digital mental-health delivery, Teladoc for scaled
              telehealth and BetterHelp context, LifeStance for behavioral-health clinical delivery, Progyny for
              employer-benefit quality, Accolade for benefit-navigation exit precedent, and Amwell for a distressed
              lower bound. Together they show a wide but mostly modest multiple set, with a median around 1.33x
              EV/Sales. Modern Health deserves a premium to that basket because it is private, category-native, and
              still demonstrates traction, but not an unconstrained premium. That leads to a base case of roughly
              $750M-$950M, a bull range of $1.10B-$1.35B if private diligence is strong, and a bear range of $450M-$700M
              if either disclosure or execution weakens.
