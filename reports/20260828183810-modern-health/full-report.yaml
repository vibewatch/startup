      - number: '5.5'
        title: Trust, safety, privacy, and compliance controls
        blocks:
          - type: paragraph
            body: >
              Product diligence in digital mental health ultimately turns on trust and control boundaries. Modern
              Health's HIPAA notice is more substantive than its generic privacy or security landing pages and confirms
              that the company treats itself as an affiliated covered entity, describes treatment/payment/operations
              uses, says it will notify members after certain breaches, and explains how PHI may be shared with
              contracted third parties under safeguard agreements. The care-offerings documentation adds concrete
              product limits, such as benefit-based feature gating and a policy that Modern Health providers do not
              prescribe federally designated controlled substances because of DEA requirements. The HHS Security Rule
              summary and ONC privacy-and-security guidance show the regulatory frame into which the platform fits:
              administrative, physical, and technical safeguards, risk analysis, auditability, and minimum- necessary
              access control. Modern Health's engineering posts reinforce this by emphasizing HIPAA and GDPR compliance,
              identity protocols, and secure member access. What the public record does not clearly show is named
              certification status, penetration-test results, incident-response history, or a detailed safety case for
              AI-enabled product features. Those omissions do not prove weakness, but they do keep trust diligence
