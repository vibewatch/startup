  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Privacy / PHI / Part 2 issue
        - Any material incident, breach notice, or enforcement action tied to sensitive data
        - Enterprise trust and buyer confidence can deteriorate faster than growth narratives recover
        - Pause investment or re-underwrite from first principles
      - - Customer concentration revealed
        - '>25% ARR in top five customers or >10% ARR in one customer'
        - Makes headline logo breadth much less durable than it appears
        - Demand price protection, covenants, or walk away
      - - Access deterioration
        - '>20% worsening in fill rates, wait times, or match quality in core geographies'
        - Weakens outcomes, satisfaction, and renewal assumptions
        - Haircut growth and margin assumptions materially
      - - Retention shortfall
        - NRR below 105% or meaningful logo churn in core enterprise cohorts
        - Breaks the argument for a premium software-like multiple
        - Move to bear-case underwriting
      - - Financing under duress
        - Inside round, punitive terms, or emergency raise without clear growth catalyst
        - Confirms that runway and capital efficiency are weaker than hoped
        - Reset entry price materially lower
      - - Margin disappointment
        - Gross margin or contribution margin materially below diligence expectations
        - Shows the business is more services-heavy than the thesis assumes
        - Reframe Modern Health toward lower-multiple benefits/services comps
    notes: |
      These triggers are meant to be monitorable and investment-useful, not generic risk statements.
    claimRefs:
      - CV024
      - CV030
      - CV038
      - CV041
      - CV042
    sourceRefs:
      - SV012
      - SV014
      - SV031
      - SV032
      - SV033
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
      - Severity
    rows:
      - - Runway
        - Current cash balance, debt, and monthly burn
        - Determines whether investors are choosing timing or reacting to financing pressure
        - Request latest balance sheet, debt schedule, and 13-week / 12-month cash forecast
        - Critical
      - - Retention quality
        - NRR, GRR, logo churn, and renewal schedule by segment
        - Supports or breaks the premium recurring-revenue argument
        - Request cohort retention bridge by customer size and geography
        - Critical
      - - Customer concentration
        - Top-10 account exposure and largest renewal dates
        - Logo breadth can hide material concentration
        - Request concentration table and upcoming-renewal calendar
        - Critical
      - - Margin path
        - Gross margin and contribution margin by coaching, therapy, psychiatry, and digital-only mix
        - Needed to know whether growth creates operating leverage or margin compression
        - Request modality-level margin bridge and utilization sensitivity
        - Critical
      - - Cap table
        - Preference stack, anti-dilution rights, secondaries, and 409A or recent mark support
        - Determines who really benefits at exit and whether current marks are economic reality
        - Request cap table, legal summary of preferences, and recent valuation materials
        - Critical
      - - Control maturity
        - Independent security / privacy / compliance evidence
        - A regulated mental-health platform cannot justify premium value without trusted controls
        - Request SOC 2 / ISO materials, breach log, and privacy architecture review
        - Material
    notes: >
      If management cannot supply this package, the recommendation should remain track or move lower even if topline
      growth is attractive.
    claimRefs:
      - CV030
      - CV037
      - CV039
      - CV041
      - CV042
      - CV043
    sourceRefs:
      - SV009
      - SV010
      - SV028
