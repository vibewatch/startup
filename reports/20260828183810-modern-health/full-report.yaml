          - type: paragraph
            body: >
              Public retention evidence for Modern Health is materially weaker than its adoption evidence. The company
              does not disclose NRR, GRR, logo churn, renewal rates, cohort curves, or average contract length on the
              current public surfaces reviewed for this run. Instead, the public record leans on testimonials,
              case-study outcomes, and product design elements that make renewal more plausible: dependent coverage,
              multiple care modalities, global deployment support, ongoing reporting, and a client-success model
              positioned as a long-term partner. Those are helpful renewal ingredients, but they are not direct
              retention metrics.

              Satisfaction evidence is better than retention evidence. Autodesk reported 98% of members said their
              provider could help and a 4.9/5 provider rating. Midland States Bank's CHRO says Modern Health drove
              higher utilization, satisfaction, and engagement than the bank had seen with a traditional EAP. Franklin
              Pierce Schools and Nextdoor both emphasize ease of use and broad fit across locations, languages, and
              levels of need. Still, a diligence team should not confuse these signals with verified renewals. The
