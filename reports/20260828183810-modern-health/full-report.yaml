  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Positive case
      - Anti-thesis
      - Evidence quality
      - What changes the view
    rows:
      - - Market demand
        - Employer mental-health spend remains strategic rather than optional
        - Demand alone does not prevent multiple compression
        - High
        - Need proof that demand converts into durable renewals and expansion
      - - Product model
        - Modern Health offers global, multi-modality support that looks more complete than a point solution
        - Coaching-first routing can frustrate therapy-seeking users and complicate retention
        - Medium
        - Need routing, escalation, and satisfaction data by modality
      - - Customer proof
        - Hundreds of employers and multinational distribution show real commercial traction
        - Logo breadth does not prove low concentration or strong NRR
        - Medium
        - Need top-customer exposure and cohort retention
      - - Economics
        - PEPM pricing and enterprise contracts support recurring-revenue quality
        - Gross margin, contribution margin, and burn remain undisclosed
        - Medium
        - Need full unit-economics bridge and runway
      - - Competitive position
        - Private peers prove category relevance and employer willingness to pay
        - Peer scale also raises the bar for outcomes proof and speed
        - Medium
        - Need win-rate, retention, and replacement data versus Spring/Lyra/incumbents
      - - Valuation
        - A premium to public comps can be defended for category scarcity
        - Current anchor is already several turns above the public median
        - High
        - Either lower the price or show private metrics that justify premium status
    notes: >
      The most important anti-thesis is not that the category is bad. It is that Modern Health may be good while still
      being fully priced.
