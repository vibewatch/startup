      - number: '2.4'
        title: Growth drivers supporting adoption
        blocks:
          - type: paragraph
            body: >
              Four demand drivers recur across the evidence set. First, untreated or poorly managed mental health
              creates clear economic loss: WHO estimates 12 billion working days lost each year to depression and
              anxiety with about $1T of annual productivity cost, making workforce mental health a board-level issue
              rather than a soft perk. Second, employers continue to see high utilization pressure and budget relevance.
              UHC says nearly half of Americans plan to seek therapy within a year, behavioral health claims may rise
              10% to 20% in 2026, and burnout has reached a six-year high. Third, digital infrastructure now supports
              continuous and localized care across geographies, which helps platforms such as Modern Health serve
              multinational workforces without forcing a U.S.-only therapy model. Fourth, the market increasingly
              rewards vendors that can prove outcomes, not just appointments. Modern Health's own economic value and
              coaching-research materials fit that trend by arguing for measurable claims savings and resilience gains
              from lower-acuity intervention. These drivers collectively favor platforms that can route members by need
              and show employer value over time.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
          - type: table
            tableRef: TM004
