      - number: '8.2'
        title: Financing anchor and current underwriting context
        blocks:
          - type: paragraph
            body: >
              The financing story is both helpful and incomplete. Modern Health itself publicly confirmed a $74M Series
              D in September 2021 at a $1.17B valuation, while third-party trackers still cluster the company around
              roughly $167M-$170M of cumulative funding and about a $1.2B valuation in late 2025 or 2026. Revenue
              trackers also cluster tightly enough to establish real scale: Latka reports $174.6M of 2024 revenue and
              Growjo estimates about $183.4M currently. Customer-breadth and distribution proof further support that
              this is not an early-stage asset: Landbase reports 395 verified companies using Modern Health, and the
              Generali partnership extends reach to employers in more than 50 countries. At the same time, the headcount
              record suggests a company still absorbing strategic and operating resets. Public sources show a 2023
              contraction, later re-expansion into the 900-plus range, and a 2025 CEO transition from Alyson Watson to
              Matt Levin. Those signals are consistent with a real company entering a new phase, but not yet with a
              fully de-risked, exit-ready compounder.
            claimRefs:
