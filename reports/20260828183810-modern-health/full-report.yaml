      - number: '7.3'
        title: Partner, customer, and people dependencies
        blocks:
          - type: paragraph
            body: >
              Modern Health's customer model creates several hidden dependencies. The company sells into HR and benefits
              workflows, depends on provider capacity and technology vendors to deliver care, and now has visible
              channel exposure through the Generali partnership. Each of those can improve scale, but each also creates
              a failure mode. Channel partners can renegotiate economics or dilute the customer relationship. Employer
              buyers can churn quickly after implementation or privacy problems. Providers and supporting vendors can
              become bottlenecks if credentialing, policy compliance, or data-handling standards slip.

              Execution risk is amplified by organizational history. The public record shows a meaningful 2023 workforce
              reset followed by later re-expansion, while current signals point to a company with a much larger global
              organization than its U.S.-employee certification page alone would imply. That does not prove operating
              weakness, but it does mean client success, implementation, clinical governance, security operations, and
              management bandwidth should all be diligence priorities. The public customer evidence is good enough to
              show real deployments, yet it is still not good enough to prove low concentration, high renewal quality,
              or stable account coverage through periods of internal change.
            claimRefs:
