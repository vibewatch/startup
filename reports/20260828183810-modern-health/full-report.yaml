    columns:
      - Decision lens
      - Current read
      - Why
      - What would upgrade the call
      - What would downgrade the call
    rows:
      - - Recommendation
        - Track
        - Company quality looks real, but the visible price anchor already assumes proof not yet disclosed
        - Private data confirms retention, margin, and runway strength
        - Evidence of stress forces re-underwriting below current anchor
      - - Confidence
        - Medium
        - Public sources are directionally strong on scale but weak on verification of economics
        - Data room or audited package narrows uncertainty
        - Tracker estimates diverge or management declines diligence access
      - - Risk rating
        - High
        - Privacy, provider access, concentration, and financing opacity can all transmit into valuation
        - Clean control evidence plus diversification metrics lower residual risk
        - Any material control, churn, or financing issue raises loss risk
      - - Valuation stance
        - Stretched
        - Implied 6.4x-6.9x revenue sits well above the public comp median
        - A lower entry price or much better private metrics justify premium pricing
        - Flat or down round at worse terms confirms overvaluation
      - - Preferred action
        - Engage only with price discipline
        - Investors should negotiate from the disclosure gap rather than the headline unicorn label
        - Entry at or below the base-case band, or proof that bull assumptions are real
        - Chasing a premium before diligence closes key gaps
    notes: >
      This table is deliberately decision-oriented rather than celebratory. The recommendation is based on price
      relative to disclosed proof, not on whether Modern Health is an attractive product.
