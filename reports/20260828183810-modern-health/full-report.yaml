      - number: '4.3'
        title: Cost structure, margin logic, and capital intensity
        blocks:
          - type: paragraph
            body: >
              Modern Health is neither pure SaaS nor clinic-heavy care delivery; its cost structure sits in between. The
              platform's care model includes coaches, therapists, psychiatry, and digital resources, which means
              provider compensation or session reimbursement should be a material cost-of-revenue driver alongside care
              navigation, support operations, and software infrastructure. Public disclosures do not state whether
              providers are predominantly employees, contractors, or blended network partners by region, but the
              existence of multi-modality care strongly implies that gross margin should sit below pure software
              benchmarks. At the same time, Modern Health does not appear to own physical clinics or capital-intensive
              hardware, so capital expenditure should be relatively light and weighted toward product, integrations,
              analytics, and employer-reporting infrastructure. Public-company comparables illustrate the spread
              available in adjacent benefit businesses: Teladoc has software-like scale but mixed segment profitability,
              Talkspace operates at lower gross margin than pure SaaS, and Progyny's benefit-administration model
              produces still different margin and cash-flow behavior. The right conclusion is not an exact public
              gross-margin number for Modern Health, but that its margin path depends heavily on modality mix, session
              caps, international provider economics, and the share of revenue coming from higher-touch clinical
              delivery versus lower-cost coaching and digital engagement.
