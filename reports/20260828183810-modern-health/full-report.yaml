chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and business model
        blocks:
          - type: paragraph
            body: >
              Modern Health positions itself as a workplace mental health platform sold to employers, benefits leaders,
              health plans, and channel partners rather than as a purely direct-to- consumer therapy marketplace. The
              company says its Adaptive Care Model connects support across the full spectrum in one platform, including
              self-guided content, one-on-one coaching, therapy, psychiatry and medication management, family care,
              substance use support, Pathways programs, and Circles group sessions. Official pages repeatedly frame the
              product as a global benefit for complex workforces, with a provider network spanning 200+ countries and
              territories and 80+ languages. Commercially, the company emphasizes PEPM and usage-based pricing rather
              than public list pricing, indicating a negotiated enterprise sales motion. This identity matters for later
              chapters because Modern Health is not merely a digital therapy vendor; it is trying to replace or
              modernize legacy EAP and behavioral health benefit workflows with a broader, coaching-forward,
              employer-governed care platform.
