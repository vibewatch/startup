      - number: '3.2'
        title: 'Direct digital-native peers: Lyra, Spring, and Modern Health'
        blocks:
          - type: paragraph
            body: >
              Lyra Health and Spring Health are the most important direct competitors because they sell the same broad
              promise: replace or modernize employer behavioral health benefits with a more measurable digital platform.
              Lyra's official site emphasizes AI-powered provider matching, 9-in-10 member improvement, 2x faster
              recovery, 26% reduction in overall health care claims costs, family support, and more than 20 million
              directly served people globally with access pathways for 200 million via partners and plans. Spring Health
              counters with an AI-native positioning, 170+ million people reached worldwide, same-day appointments, a
              2.2x ROI claim, and strong outcomes reporting through its employer-facing platform. Against those two,
              Modern Health is distinct but not isolated: its strongest messages are adaptive care, coaching as a
              first-class modality, global localization, and enterprise pricing flexibility. In other words, Modern
              Health competes in the same platform category but uses a different wedge, arguing that serving the
              lower-acuity middle effectively is both more engaging and more cost- efficient than a therapy-heavy
              default.
