  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, regulatory, and legal exposure
        blocks:
          - type: paragraph
            body: >
              Modern Health is clearly operating in a regulated health-data environment rather than a light wellness-app
              category. Its HIPAA notice says the company uses an affiliated covered entity model, may use information
              for treatment, payment, and health-care operations, and must notify members after certain breaches. The
              same notice explicitly addresses substance-use-disorder records under 42 C.F.R. Part 2, which matters
              because Modern Health markets substance-use care and therefore touches one of the most sensitive
              confidentiality regimes in behavioral health. HHS now says OCR began enforcing Part 2 on February 16, 2026
              with HIPAA-aligned civil enforcement tools, which materially raises the downside of weak data segregation,
              consent handling, or breach processes.

              The broader sector precedent is also unfavorable. The FTC's BetterHelp matter shows that mental- health
              platforms can face enforcement not only for a breach but for privacy representations that turn out to be
              inaccurate. Modern Health's visible public controls are directionally helpful, but the legal/security
              surface retrieved in this run is still thinner than a diligence team would want: the compliance page
              emphasizes ethics and supplier diligence, the security page is sparse, the trust-center surface is
              minimally readable, and public certification or incident-history detail is not independently verifiable
              from retrieved materials. That makes privacy/regulatory risk the clearest thesis-break vector in the
              report.
