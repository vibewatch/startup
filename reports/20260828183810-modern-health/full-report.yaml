      - number: '4.5'
        title: Capital adequacy, financing dependency, and financial verdict
        blocks:
          - type: paragraph
            body: >
              Modern Health's known financing history still anchors the capital story: the company publicly announced a
              $74M Series D in September 2021, said total funding then exceeded $170M, and third-party trackers continue
              to place cumulative funding in the roughly $167M to $170M band. What public evidence does not show is
              current cash on hand or how much of that capital remains after the 2023 restructuring and subsequent
              return to growth. The headcount record is best read as evidence of both reset and recovery: Tracxn shows
              269 employees at year-end 2023, Great Place to Work shows 272 U.S.-based employees on a later
              certification page, while Latka, Growjo, and Tracxn all point to a 900-plus global workforce by late 2025
              to mid-2026. That pattern implies both substantial operating expense and meaningful rehiring after the
              downturn, which makes a live runway assessment impossible without management data. Public comparables
              argue that scale alone is not enough: Teladoc's valuation compression, Talkspace's modest public-market
              multiple, and Progyny's superior cash profile show that investors reward revenue quality and cash
              efficiency, not just sector exposure. Financial verdict: Modern Health likely has real recurring revenue
              scale and a defendable PEPM model, but the business cannot be underwritten confidently on margin path or
              capital adequacy until the company opens gross-margin, retention, burn, and cash-balance data.
