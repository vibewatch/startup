      - SV032
  - id: TV007
    title: Financing and entry-discipline anchors
    columns:
      - Anchor
      - Public value
      - Interpretation
      - Why it matters
      - Preferred investor stance
    rows:
      - - Last company-confirmed valuation
        - $1.17B
        - Series D anchor from September 2021
        - Strong historical signal but stale as a live pricing reference
        - Treat as context, not fair value
      - - Tracker-based later valuation
        - ~$1.2B
        - Secondary-style or database mark retained into 2025-2026
        - Suggests the unicorn label persists, but not why
        - Verify with 409A, secondary, or new-round evidence
      - - Revenue estimate floor
        - $174.6M
        - Latka 2024 revenue estimate
        - Establishes real scale for valuation math
        - Use as a conservative revenue anchor
      - - Revenue estimate high
        - $183.4M
        - Growjo current annual-revenue estimate
        - Helps bracket upside case but remains methodological
        - Use only as a directional ceiling
      - - Funding raised
        - ~$167M-$170M
        - Meaningful capital raised, but well below Lyra's or Spring's war chest
        - Preference overhang may be manageable, but current cash is unknown
        - Demand current capitalization detail
      - - Headcount cluster
        - 912-922 globally; 272 U.S.-based GPTW listing
        - Scaled organization after restructuring and re-expansion
        - Supports scale but implies a meaningful expense base
        - Ask for burn and productivity metrics
    notes: |
      Entry discipline should start with these anchors, then move immediately into private diligence.
