      - number: '2.3'
        title: Buyer, user, payer, and adoption path dynamics
        blocks:
          - type: paragraph
            body: >
              In this market the economic buyer is typically not the end user. Benefits, total rewards, HR, and
              sometimes health-plan or channel-partner teams own the budget and procurement decision, while employees
              and eligible family members are the actual users. Modern Health's employer-facing copy is explicit that
              the platform is designed to give HR leaders aggregated reporting, governance, and long-term planning
              support. UHC's 2026 employer trends note that buyers increasingly expect measurable outcomes such as
              reduced absenteeism, improved retention, and ROI rather than simple access counts. At the same time, user
              adoption still depends on lower-friction entry points, stigma-sensitive care options, and speed to
              support. This is where Modern Health's coaching-forward model matters: KFF, UHC, and the PMC coaching
              paper all describe a market in which not every employee needs traditional therapy, yet many workers still
              need structured mental health support. Competitor pages from Spring, Lyra, Headspace, Talkspace, and Optum
              show that the whole category is converging on this buyer-user split, but Modern Health's distinctive
              position is to make lower-acuity and globally localized support a procurement-strength rather than a
              clinical fallback.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
