              - CM039
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >
              Modern Health sits inside a multi-tier competitive environment rather than a single tidy peer set. The
              first tier contains digital-native employer mental health platforms that sell a broad workforce benefit to
              HR and benefits buyers: Lyra Health, Spring Health, and Modern Health itself. These companies all market
              integrated support across coaching, therapy, digital tools, and employer reporting, but they emphasize
              different strengths. The second tier includes prevention-first or consumer-brand-derived platforms such as
              Headspace and Calm Health, which lead with mindfulness, daily engagement, and lower-friction self-serve
              support before expanding into coaching or clinical navigation. The third tier includes teletherapy- first
              and insurer-bundled substitutes such as Talkspace, Optum, and Magellan. Those players can win on price,
              existing plan relationships, or consumer familiarity even when they do not offer Modern Health's exact
              adaptive-care positioning. Any diligence on Modern Health has to account for all three layers because
              enterprise buyers compare products against the status quo as much as against the most similar
              venture-backed peer.
            claimRefs:
