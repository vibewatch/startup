      - number: '4.2'
        title: Pricing, GTM motion, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >
              Modern Health's publicly visible pricing story is intentionally high level, which is normal for enterprise
              benefits software but limits precision in underwriting. The company markets pricing flexibility and
              predictable budgeting, while Vendr's contract dataset provides a more operational lens: standard
              deployments often land near roughly $4 to $12+ PEPM depending on employee count, tier, and negotiation,
              with larger enterprises receiving better unit pricing. Vendr further indicates that multi-year terms can
              reduce PEPM by roughly 10% to 20%, family coverage can add about $1.50 to $3 PEPM per dependent, and
              implementation fees can range from roughly $2K to $10K+. Those signals suggest that realized ACV likely
              depends more on covered population, therapy/coaching limits, geographic footprint, and procurement
              leverage than on a single list price. GTM appears to combine direct employer sales with benefits-channel
              or partner distribution. The Generali partnership matters financially because it implies a route to
              lower-CAC international distribution if channel economics prove attractive. Still, public data does not
              disclose CAC, payback, renewal rates, broker contribution, or net revenue retention, so any
              sales-efficiency view remains a proxy rather than a validated unit-economic fact.
