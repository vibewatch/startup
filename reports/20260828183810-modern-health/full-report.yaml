      - number: '2.2'
        title: Market sizing lenses and what they do and do not measure
        blocks:
          - type: paragraph
            body: >
              Available market-size estimates are large enough to confirm category importance but are too broad to be
              used mechanically as Modern Health's TAM. Precedence Research sizes the U.S. behavioral health market at
              $94.82B in 2025 growing to $174.78B by 2035, while its global behavioral health estimate is $184.94B in
              2025 growing to $349.88B by 2035. Those figures include much more than employer-purchased digital
              behavioral benefits: outpatient counseling, facility-based care, addiction treatment, and broad disorder
              treatment all sit inside the totals. The stronger lens for Modern Health is the employer-sponsored subset
              described by KFF and UnitedHealthcare, where employers buy access, navigation, outcomes reporting, and
              graduated care options rather than reimburse every encounter directly. A bottom-up market lens also
              emerges from UHC's observation that about half of members seeking support may fit lower- severity options
              such as coaching or self-help rather than treatment-first therapy. Modern Health sits directly in that
              navigation layer. The result is a large TAM, a materially smaller SAM, and an even smaller SOM once
              geography, enterprise readiness, and employer-benefit budget ownership are applied.
