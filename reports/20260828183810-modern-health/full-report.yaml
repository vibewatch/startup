      - number: '7.4'
        title: Financial, model, and valuation transmission risk
        blocks:
          - type: paragraph
            body: >
              The most important financial risk is not that demand disappears; it is that the company's private data
              opacity prevents investors from knowing how much shock absorption exists if operations or regulation go
              wrong. Public sources still do not disclose gross retention, customer concentration, gross margin by
              modality, current cash, monthly burn, or runway. That means investors cannot tell whether the business
              could absorb a major breach, litigation event, provider-cost spike, or a bad renewal cycle without
              returning to the market under pressure.

              The model itself has real operating leverage but also real mix risk. Modern Health's pricing can be PEPM
              or usage-based, and its care stack spans self-guided content, coaching, therapy, psychiatry, and
              specialized support. If the mix skews toward higher-cost clinical delivery or if contracts are underpriced
              relative to utilization, margin quality can compress. Public mental-health comparables also show how fast
              valuation can reset when investors lose confidence in privacy posture, economic quality, or growth
              durability. That makes operational risk and financing risk tightly linked: a breach, churn wave, or
              implementation-quality problem would likely show up first in renewal and margin pressure, then in
              valuation and fundraising leverage.
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR042
