  - id: TV008
    title: Exit-readiness and catalyst table
    columns:
      - Exit or catalyst
      - Public signal
      - Probability read
      - Value effect
      - What must happen next
    rows:
      - - Data-rich private financing
        - Most plausible clean catalyst if management opens the books selectively
        - Medium
        - Could validate the bull case or reset the mark credibly
        - Needs strong retention, margin, and runway evidence
      - - Strategic sale
        - Sector still values scaled employer-benefit assets and recent M&A exists
        - Medium
        - Could create liquidity even without IPO-grade disclosure
        - Needs buyer interest in mental-health capability and employer distribution
      - - Secondary-supported liquidity
        - Possible if existing investors want liquidity without headline fundraise
        - Medium-Low
        - May confirm or haircut true fair value
        - Needs transparent secondary pricing and preference context
      - - IPO path
        - Public record remains far below filing-grade readiness
        - Low
        - Would likely require a substantial disclosure step-up before adding value
        - Needs audited financials, governance detail, and clean quarterly narrative
      - - Hold and compound privately
        - Plausible if runway is long and growth remains healthy
        - Medium
        - Preserves option value but does not solve current pricing uncertainty
        - Needs proof that the company can self-fund or raise on attractive terms
    notes: >
      Exit thinking matters because the current valuation can only be rationalized if there is a believable path to
      durable financing leverage or credible strategic scarcity.
