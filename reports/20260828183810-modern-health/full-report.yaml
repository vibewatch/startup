      - number: '4.4'
        title: Public traction estimates and the largest private-data gaps
        blocks:
          - type: paragraph
            body: >
              The strongest public traction signal is that multiple independent estimators place Modern Health at
              meaningful scale rather than early-stage experimentation. Latka reports 2024 revenue of $174.6M, $167.4M
              of total funding, and roughly 922 employees by late 2025, while Growjo estimates current annual revenue of
              $183.4M with 916 employees and about $200K of revenue per employee. Tracxn is directionally similar on
              capital raised and reports 912 employees as of July 2026. Those figures disagree on timing and
              methodology, but they cluster tightly enough to support the view that Modern Health has surpassed the
              subscale venture phase. Customer proof further suggests nontrivial enterprise usage: Rubrik recorded 63%
              registration and 19% engagement in APJ, a featured analytics-platform customer reached 48% registration,
              Midland States Bank cited $110K in reduced behavioral health costs, and CEBT described 37,000 covered
              members with 89% improved well-being. Even so, the underwriting gaps are still substantial: no audited
              revenue, no gross margin actuals, no cohort retention, no customer concentration, no churn, no CAC, no
              current cash balance, and no debt schedule are publicly available. The data set is strong enough for a
              directional view, but not for precision modeling without a data room.
