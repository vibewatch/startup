        title: Expansion dynamics and concentration risks
        blocks:
          - type: paragraph
            body: >
              The visible expansion model has three layers. First, Modern Health appears designed for land-and-expand
              inside existing employers through dependents, multiple modalities, higher-acuity support, and ongoing
              reporting. Second, it expands geographically: Autodesk and Camunda show cross-border deployments, the
              global page emphasizes localized delivery, and the Generali relationship adds a partner route into
              employers in more than 50 countries. Third, pricing flexibility—PEPM or usage-based—likely helps Modern
              Health fit different procurement constraints across customers and channels.

              The risks are equally visible. Modern Health does not disclose concentration, so investors cannot tell
              whether a handful of large employers account for a large share of ARR. The strongest public customer
              stories skew toward sizable enterprises and multiemployer trusts, which suggests average contract value
              may be meaningfully concentrated in a relatively small set of sophisticated buyers. Enterprise procurement
              also creates friction: geography, provider access, demographics, privacy, reporting, and implementation
              quality all matter. Finally, the 2023 workforce reset raises a legitimate diligence question about whether
              customer support, implementation depth, and account coverage scaled smoothly through restructuring and
              subsequent rehiring. Public sources do not show major customer exits, but they also do not provide enough
