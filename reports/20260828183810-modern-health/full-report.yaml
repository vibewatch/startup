      - number: '1.2'
        title: Founder, leadership transition, and governance signals
        blocks:
          - type: paragraph
            body: >
              Founder Alyson Watson remains central to Modern Health's identity, but the company has now formalized a
              transition from founder-led operations to a more scaled operator model. Modern Health's official About
              page now introduces Watson as Founder and Executive Chair, while an April 2025 announcement named Matt
              Levin as CEO. The mirrored press release describes Levin as a long-time benefits, HR services, and
              healthcare executive with prior CEO experience at People 2.0 and Benefitfocus plus earlier roles at Aon
              and Hewitt. Publicly named board voices in that announcement included Kleiner Perkins partner Mamoon Hamid
              and 01 Advisors co-founder Dick Costolo, indicating continuing involvement from major capital providers.
              Secondary profiles also identify additional operating leaders spanning product, technology, finance, and
              operations. The combination of founder continuity, outside-investor governance, and an incoming CEO with
              benefits-industry experience suggests a company trying to pair mission credibility with tighter enterprise
              execution as it moves beyond the initial unicorn phase.
