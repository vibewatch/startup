schemaVersion: "report-v2"
artifact: financials
slug: modern-health
runDate: "2026-08-28"
company:
  name: Modern Health
chapter:
  number: 4
  title: Financials
  summary: >
    Modern Health appears to be a recurring-revenue, employer-benefit platform whose core
    monetization is enterprise PEPM or usage-based contracting rather than per-visit retail care.
    Public sources do not provide audited revenue, gross margin, cash, burn, or retention figures,
    but multiple independent estimates cluster 2024 revenue around $174.6M and 2026 revenue around
    $183.4M, implying a late-stage company with meaningful scale yet still material private-market
    opacity. Vendr's contract data suggests realized pricing often falls in a mid-single-digit to
    low-double-digit PEPM band depending on tier, geography, and session scope. Case studies and
    the economic-value page show that Modern Health sells ROI, not just access, but the largest
    underwriting gaps remain actual gross margin, realized PEPM net of discounts, CAC/payback,
    renewal behavior, and current cash runway after the 2023 workforce reset and subsequent
    re-expansion.

sections:
  - id: revenue-model-and-stream-overview
    title: Revenue model and stream overview
    body: >
      Modern Health's public materials support a classic employer-benefit revenue model more than a
      consumer-subscription or fee-for-service care model. The company sells a workforce mental
      health platform to employers, offers multiple pricing approaches aligned to budget and
      variability tolerance, and frames value in terms of population outcomes, health care savings,
      and member routing across coaching, therapy, psychiatry, and digital resources. Third-party
      procurement data from Vendr provides the clearest pricing structure: contracts are quoted on a
      per-employee-per-month basis across eligible employees, with annual terms, tiered service
      packages, optional family coverage, and negotiable implementation or integration components.
      That implies revenue is mostly recurring subscription revenue tied to covered lives rather
      than volatile encounter billing. Public customer proof and partnership evidence suggest three
      streams: the core employer platform subscription; premium or add-on modules such as expanded
      session coverage, dependent coverage, or specialized programs; and partner/channel revenue in
      which organizations such as Generali distribute Modern Health into employer populations. The
      exact revenue mix is undisclosed, but recurring contracted employer spend is clearly the
      economic center of the business.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI001
    figureRefs:
      - FI001

  - id: pricing-gtm-and-sales-efficiency-proxies
    title: Pricing, GTM motion, and sales-efficiency proxies
    body: >
      Modern Health's publicly visible pricing story is intentionally high level, which is normal
      for enterprise benefits software but limits precision in underwriting. The company markets
      pricing flexibility and predictable budgeting, while Vendr's contract dataset provides a more
      operational lens: standard deployments often land near roughly $4 to $12+ PEPM depending on
      employee count, tier, and negotiation, with larger enterprises receiving better unit pricing.
      Vendr further indicates that multi-year terms can reduce PEPM by roughly 10% to 20%, family
      coverage can add about $1.50 to $3 PEPM per dependent, and implementation fees can range from
      roughly $2K to $10K+. Those signals suggest that realized ACV likely depends more on covered
      population, therapy/coaching limits, geographic footprint, and procurement leverage than on a
      single list price. GTM appears to combine direct employer sales with benefits-channel or
      partner distribution. The Generali partnership matters financially because it implies a route
      to lower-CAC international distribution if channel economics prove attractive. Still, public
      data does not disclose CAC, payback, renewal rates, broker contribution, or net revenue
      retention, so any sales-efficiency view remains a proxy rather than a validated unit-economic
      fact.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI002
    figureRefs:
      - FI002

  - id: cost-structure-margin-and-capital-intensity
    title: Cost structure, margin logic, and capital intensity
    body: >
      Modern Health is neither pure SaaS nor clinic-heavy care delivery; its cost structure sits in
      between. The platform's care model includes coaches, therapists, psychiatry, and digital
      resources, which means provider compensation or session reimbursement should be a material
      cost-of-revenue driver alongside care navigation, support operations, and software
      infrastructure. Public disclosures do not state whether providers are predominantly employees,
      contractors, or blended network partners by region, but the existence of multi-modality care
      strongly implies that gross margin should sit below pure software benchmarks. At the same
      time, Modern Health does not appear to own physical clinics or capital-intensive hardware, so
      capital expenditure should be relatively light and weighted toward product, integrations,
      analytics, and employer-reporting infrastructure. Public-company comparables illustrate the
      spread available in adjacent benefit businesses: Teladoc has software-like scale but mixed
      segment profitability, Talkspace operates at lower gross margin than pure SaaS, and Progyny's
      benefit-administration model produces still different margin and cash-flow behavior. The right
      conclusion is not an exact public gross-margin number for Modern Health, but that its margin
      path depends heavily on modality mix, session caps, international provider economics, and the
      share of revenue coming from higher-touch clinical delivery versus lower-cost coaching and
      digital engagement.
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
    tableRefs:
      - TI003
    figureRefs:
      - FI003

  - id: traction-public-estimates-and-private-gaps
    title: Public traction estimates and the largest private-data gaps
    body: >
      The strongest public traction signal is that multiple independent estimators place Modern
      Health at meaningful scale rather than early-stage experimentation. Latka reports 2024 revenue
      of $174.6M, $167.4M of total funding, and roughly 922 employees by late 2025, while Growjo
      estimates current annual revenue of $183.4M with 916 employees and about $200K of revenue per
      employee. Tracxn is directionally similar on capital raised and reports 912 employees as of
      July 2026. Those figures disagree on timing and methodology, but they cluster tightly enough
      to support the view that Modern Health has surpassed the subscale venture phase. Customer
      proof further suggests nontrivial enterprise usage: Rubrik recorded 63% registration and 19%
      engagement in APJ, a featured analytics-platform customer reached 48% registration, Midland
      States Bank cited $110K in reduced behavioral health costs, and CEBT described 37,000 covered
      members with 89% improved well-being. Even so, the underwriting gaps are still substantial:
      no audited revenue, no gross margin actuals, no cohort retention, no customer concentration,
      no churn, no CAC, no current cash balance, and no debt schedule are publicly available. The
      data set is strong enough for a directional view, but not for precision modeling without a
      data room.
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
    tableRefs:
      - TI005

  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy, financing dependency, and financial verdict
    body: >
      Modern Health's known financing history still anchors the capital story: the company publicly
      announced a $74M Series D in September 2021, said total funding then exceeded $170M, and
      third-party trackers continue to place cumulative funding in the roughly $167M to $170M band.
      What public evidence does not show is current cash on hand or how much of that capital remains
      after the 2023 restructuring and subsequent return to growth. The headcount record is best
      read as evidence of both reset and recovery: Tracxn shows 269 employees at year-end 2023,
      Great Place to Work shows 272 U.S.-based employees on a later certification page, while
      Latka, Growjo, and Tracxn all point to a 900-plus global workforce by late 2025 to mid-2026.
      That pattern implies both substantial operating expense and meaningful rehiring after the
      downturn, which makes a live runway assessment impossible without management data. Public
      comparables argue that scale alone is not enough: Teladoc's valuation compression, Talkspace's
      modest public-market multiple, and Progyny's superior cash profile show that investors reward
      revenue quality and cash efficiency, not just sector exposure. Financial verdict: Modern
      Health likely has real recurring revenue scale and a defendable PEPM model, but the business
      cannot be underwritten confidently on margin path or capital adequacy until the company opens
      gross-margin, retention, burn, and cash-balance data.
    claimRefs:
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
      - CI039
    tableRefs:
      - TI004
    figureRefs:
      - FI004

