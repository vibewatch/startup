evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A board-approved or financing-document-supported valuation update after the 2021 Series D.
    whyItMatters: >-
      Secondary databases imply a 2025 value near $1.2B, but investment work should rely on a verified current mark or
      transaction.
    diligencePath: Request cap table, last 409A, any secondary pricing data, and investor update materials from management.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: layoffs
    missingEvidence: A company-confirmed 2023-2024 restructuring timeline with exact roles, geography, and percentage reduction.
    whyItMatters: The scale of the workforce reset affects confidence in operating discipline and cultural recovery.
    diligencePath: >-
      Request workforce history by quarter, board materials approving reductions, and management commentary on
      post-reset rehiring.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: Current official employer count, covered lives, and concentration metrics.
    whyItMatters: Customer-base quality and concentration are central to both valuation and risk assessment.
    diligencePath: Request cohort tables with active employers, covered members, top-10 customer revenue share, and renewal history.
    relatedQuestionRefs:
      - QO016
      - QO025
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and governance rights by investor class.
    whyItMatters: Board composition and control rights affect exit readiness and strategic decision velocity.
    diligencePath: Request current board observer/director list plus major investor rights summary from counsel or data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO005
  - type: missing-source
    severity: material
    topic: employer-digital-SAM
    missingEvidence: >-
      A public bottom-up dollar estimate for the employer-sponsored digital behavioral health subset that matches Modern
      Health's actual scope.
    whyItMatters: Without a clean SAM, top-down TAM figures overstate practical opportunity and can inflate valuation logic.
    diligencePath: >-
      Build a bottom-up model from qualifying employer counts, covered employees, PEPM ranges, and realistic penetration
      assumptions.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: Modern-Health-SOM
    missingEvidence: Covered lives, active employer count by segment, and regional revenue mix specific to Modern Health.
    whyItMatters: Those figures are required to estimate true SOM, market share, and expansion headroom.
    diligencePath: Request management cohort data by employer size, geography, covered lives, and annual contract value.
    relatedQuestionRefs:
      - QM019
  - type: private-evidence-only
    severity: material
    topic: pricing-and-penetration
    missingEvidence: Real-world pricing bands and average annual contract values by employer size.
    whyItMatters: Market sizing and buyer economics remain approximate without a current pricing distribution.
    diligencePath: Obtain sample MSAs or price books and benchmark against three direct competitors.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmarks
    missingEvidence: >-
      Current apples-to-apples contract pricing and package configuration data across Modern Health, Lyra, Spring, and
      Headspace.
    whyItMatters: >-
      Price discipline and packaging are central to enterprise win-loss outcomes, but public list pricing is largely
      absent.
    diligencePath: Collect anonymized customer contracts, broker benchmarks, and competitive pricing screenshots from recent RFPs.
    relatedQuestionRefs:
      - QP022
