  - id: operational-clinical-and-security-risk
    title: Operational, clinical, and security risk
    body: >
      Modern Health's service promise depends on human-provider capacity, correct triage, and reliable
      handling of sensitive data across global contexts. Public federal sources point to a structural
      workforce problem rather than a temporary hiring inconvenience: HRSA projects large 2038 shortages
      for mental-health counselors, psychologists, psychiatrists, and related roles, while BLS still
      projects fast job growth and tens of thousands of annual openings. For a platform that sells fast
      access, modality choice, and global coverage, supply tightness can transmit directly into wait
      times, member dissatisfaction, and lower renewal quality.

      Clinical-routing risk matters too. Modern Health's own care-offering sources and third-party
      reviews show a coaching-forward stepped-care model. That design can be economically attractive and
      clinically appropriate for many users, but it also creates risk if higher-acuity or therapy-ready
      members are routed suboptimally, or if escalation quality varies by region. Security risk is not
      limited to malicious breaches; it also includes whether the company can prove mature controls,
      auditability, incident response, and quality consistency across employers, dependents, providers,
      and international delivery contexts. Public evidence suggests some safeguards exist, but not enough
      technical depth to close diligence questions.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
