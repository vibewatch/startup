schemaVersion: "report-v2"
artifact: risks
slug: modern-health
runDate: "2026-08-28"
company:
  name: Modern Health
chapter:
  number: 7
  title: Risks
  summary: >
    Modern Health's most material public risks are not about demand creation; they are about whether a
    regulated, provider-dependent, globally deployed mental-health platform can keep privacy,
    clinical-quality, and customer-retention performance ahead of rising scrutiny. The top risk is
    privacy and regulatory exposure: Modern Health openly operates under HIPAA, offers substance-use
    support that can implicate Part 2 confidentiality rules, and sells into employers that will react
    sharply to any breach or misrepresentation. The second major risk is provider-supply and care
    quality: public federal sources show long-run behavioral-health workforce shortages, while third-
    party reviews warn that coaching-first routing can frustrate therapy-seeking users if triage is not
    tight. The third risk cluster is concentration and execution opacity: public customer evidence is
    real but retention, top-customer exposure, incident history, and current burn/runway remain
    undisclosed. Visible mitigations exist, but they are not strong enough to remove diligence-grade
    uncertainty without private operational data.

sections:
  - id: privacy-regulatory-and-legal-exposure
    title: Privacy, regulatory, and legal exposure
    body: >
      Modern Health is clearly operating in a regulated health-data environment rather than a light
      wellness-app category. Its HIPAA notice says the company uses an affiliated covered entity model,
      may use information for treatment, payment, and health-care operations, and must notify members
      after certain breaches. The same notice explicitly addresses substance-use-disorder records under
      42 C.F.R. Part 2, which matters because Modern Health markets substance-use care and therefore
      touches one of the most sensitive confidentiality regimes in behavioral health. HHS now says OCR
      began enforcing Part 2 on February 16, 2026 with HIPAA-aligned civil enforcement tools, which
      materially raises the downside of weak data segregation, consent handling, or breach processes.

      The broader sector precedent is also unfavorable. The FTC's BetterHelp matter shows that mental-
      health platforms can face enforcement not only for a breach but for privacy representations that
      turn out to be inaccurate. Modern Health's visible public controls are directionally helpful, but
      the legal/security surface retrieved in this run is still thinner than a diligence team would want:
      the compliance page emphasizes ethics and supplier diligence, the security page is sparse, the
      trust-center surface is minimally readable, and public certification or incident-history detail is
      not independently verifiable from retrieved materials. That makes privacy/regulatory risk the
      clearest thesis-break vector in the report.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
