schemaVersion: "report-v2"
artifact: customers
slug: modern-health
runDate: "2026-08-28"
company:
  name: Modern Health
chapter:
  number: 6
  title: Customers
  summary: >
    Modern Health has credible public proof that it is used by real enterprise customers across
    multiple geographies and workforce types, but the strongest evidence comes from selective case
    studies and customer quotes rather than a fully disclosed customer-count or retention data set.
    Official surfaces show a product built for employer buyers in HR, benefits, and wellbeing roles,
    with global reach across 200+ countries and territories and 80+ languages. Public customer-proof
    is strongest for Autodesk, Rubrik, Midland States Bank, CEBT, Camunda, Nextdoor, and Franklin
    Pierce Schools, where Modern Health discloses deployment context or outcomes such as 63%
    registration, 19% engagement, 48% registration, $110K cost savings, or 89% improved well-being.
    Independent datasets such as Landbase and historical company profiles support the view that the
    platform is used by hundreds of organizations, but Modern Health still does not publicly disclose
    current customer count, covered lives, NRR, GRR, logo churn, or top-account concentration.

sections:
  - id: customer-base-segmentation-and-buyer-profile
    title: Customer base segmentation and buyer profile
    body: >
      Modern Health's commercial relationship is clearly employer-led rather than consumer-led. The
      official site speaks to HR, benefits, and total-rewards stakeholders; the employer page stresses
      embedded access inside HR and benefits workflows; and the customer journey repeatedly centers on
      governance, reporting, and long-term workforce planning rather than one-off member transactions.
      That makes the economic buyer the employer, while the actual users are employees and eligible
      dependents who move across self-guided tools, coaching, therapy, psychiatry, and community care.

      The best-supported customer segment is the multinational or geographically distributed employer.
      Modern Health claims service coverage across 200+ countries and territories and 80+ languages,
      and customer examples such as Autodesk and Camunda show multi-country rollouts rather than
      single-office pilots. The product is also framed as a fit for employers that need a long-term
      benefits partner, aggregated reporting, and configurable regional deployment. Independent
      market-data sources do not fully agree on customer count, but they consistently place Modern
      Health in the category of scaled enterprise mental-health vendors serving many named employers
      rather than a niche point solution.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-customer-proof-and-production-evidence
    title: Named customer proof and production evidence
    body: >
      Public customer proof is meaningful but selective. Modern Health's case-studies page names
      Rubrik, Midland States Bank, and CEBT with specific deployment outcomes, and the Autodesk case
      study is especially useful because it describes customer context, employee scale, launch timing,
      and early performance. That is stronger evidence than a logo wall because it demonstrates actual
      launch, operational use, and measured outcomes. The home page adds direct customer quotes from
      Nextdoor, Midland States Bank, and Franklin Pierce Schools, while the Camunda webinar page shows
      that Modern Health is being discussed inside a live employer implementation context for a
      450-plus-employee global workforce.

      Independent sources extend the logo set but with weaker proof quality. Landbase shows 395
      verified companies using Modern Health as of its 2025 update and lists sample customers such as
      InterContinental Hotels Group, Splunk, Live Nation, TeamHealth, HubSpot, VCA Animal Hospitals,
      Denver Health, Yelp, Intapp, and Remitly. A historical company-profile source lists 250+
      enterprise customers including Dropbox, Lyft, Palo Alto Networks, Marqeta, Zendesk, and Workiva.
      Those sources support breadth, but their methodology is not equal to contract-level evidence.
      The right reading is that Modern Health has real enterprise deployment breadth, while the most
      decision-useful proof still sits in a relatively small number of public case studies.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU020
      - CU021
      - CU022
      - CU023
      - CU037
      - CU038
