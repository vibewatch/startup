      - TU002
    figureRefs:
      - FU002

  - id: retention-durability-and-satisfaction-evidence
    title: Retention, durability, and satisfaction evidence
    body: >
      Public retention evidence for Modern Health is materially weaker than its adoption evidence.
      The company does not disclose NRR, GRR, logo churn, renewal rates, cohort curves, or average
      contract length on the current public surfaces reviewed for this run. Instead, the public record
      leans on testimonials, case-study outcomes, and product design elements that make renewal more
      plausible: dependent coverage, multiple care modalities, global deployment support, ongoing
      reporting, and a client-success model positioned as a long-term partner. Those are helpful
      renewal ingredients, but they are not direct retention metrics.

      Satisfaction evidence is better than retention evidence. Autodesk reported 98% of members said
      their provider could help and a 4.9/5 provider rating. Midland States Bank's CHRO says Modern
      Health drove higher utilization, satisfaction, and engagement than the bank had seen with a
      traditional EAP. Franklin Pierce Schools and Nextdoor both emphasize ease of use and broad fit
      across locations, languages, and levels of need. Still, a diligence team should not confuse these
      signals with verified renewals. The biggest customer-quality gap remains the absence of public,
      independently auditable retention data.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU036
      - CU039
    tableRefs:
      - TU004
    figureRefs: []

  - id: expansion-dynamics-and-concentration-risks
    title: Expansion dynamics and concentration risks
    body: >
      The visible expansion model has three layers. First, Modern Health appears designed for
      land-and-expand inside existing employers through dependents, multiple modalities, higher-acuity
      support, and ongoing reporting. Second, it expands geographically: Autodesk and Camunda show
      cross-border deployments, the global page emphasizes localized delivery, and the Generali
      relationship adds a partner route into employers in more than 50 countries. Third, pricing
      flexibility—PEPM or usage-based—likely helps Modern Health fit different procurement constraints
      across customers and channels.

      The risks are equally visible. Modern Health does not disclose concentration, so investors cannot
      tell whether a handful of large employers account for a large share of ARR. The strongest public
      customer stories skew toward sizable enterprises and multiemployer trusts, which suggests average
      contract value may be meaningfully concentrated in a relatively small set of sophisticated buyers.
      Enterprise procurement also creates friction: geography, provider access, demographics, privacy,
      reporting, and implementation quality all matter. Finally, the 2023 workforce reset raises a
      legitimate diligence question about whether customer support, implementation depth, and account
      coverage scaled smoothly through restructuring and subsequent rehiring. Public sources do not show
      major customer exits, but they also do not provide enough transparency to rule concentration or
      renewal risk out.
    claimRefs:
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU039
    tableRefs:
      - TU005
    figureRefs:
      - FU004

