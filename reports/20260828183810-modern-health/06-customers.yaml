      - TU003
    figureRefs:
      - FU003

  - id: adoption-trajectory-and-outcome-signals
    title: Adoption trajectory and outcome signals
    body: >
      Modern Health does not publish a clean time series for employer count, covered lives, or
      expansion cohorts, so adoption analysis depends on point-in-time disclosures. The best available
      public numbers show meaningful enterprise usage rather than shallow trial activity. Rubrik's APJ
      deployment reached 63% registration and 19% engagement. A featured analytics-platform customer
      reached 48% registration. Midland States Bank reported $110K in reduced behavioral-health costs,
      and CEBT reported 37,000 covered members with 89% improved well-being. Autodesk adds a more
      detailed launch example: more than 14,000 employees across 48 countries, 20% registration in the
      first month, 11% first-month engagement, 15% engagement by Q2, under-one-day time-to-care,
      90% reported improvement, 98% provider helpfulness, and a 4.9/5 provider rating.

      These disclosures are still curated and company-authored, so they should not be mistaken for a
      full cohort dashboard. But taken together they do answer the most basic diligence question:
      Modern Health is not merely being marketed to employers; it is being launched, used, and measured
      inside sizable organizations. The main weakness is denominator visibility. Public evidence does
      not reveal how representative these strong examples are across the total installed base.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU024
      - CU025
      - CU037
