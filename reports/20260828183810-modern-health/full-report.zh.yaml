      - number: '2.5'
        title: 采用约束、监管阻力和市场质量注意事项
        blocks:
          - type: paragraph
            body: >
              同一组证据也说明，市场增长不会自动转化为轻松采用。提供者短缺仍是结构性问题：PMC 教练辅导研究引用了美国许多县的短缺，并把教练辅导视为对服务缺口的回应；BLS 和 HRSA
              数据也强调劳动力市场仍受供给约束。KFF 的政策分析指出第二组约束，围绕 HIPAA、DEA 处方规则、FDA
              对医疗器械与一般健康工具的边界，以及公共卫生紧急状态后远程医疗灵活性的变化。对于提供精神科、物质使用支持或 AI
              分流的供应商，这些问题都直接相关。隐私和安全预期进一步抬高采购摩擦，因为雇主需要证明敏感员工数据会与管理层级报告保持隔离。最后，宽泛的行为健康市场报告常把差异很大的子板块混在一起，用通用 TAM
              叙事承销某个具体供应商并不可靠。Modern Health 受益于强劲品类顺风，但审慎投资人仍应把可触达市场收窄到雇主预算、严重度组合适配、提供者产能和监管合规准备度。
