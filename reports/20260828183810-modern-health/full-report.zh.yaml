          type: effect
        - id: churn
          label: 流失 / 续约走弱 / 扩张降低
          type: effect
        - id: margin
          label: 利润率压缩
          type: effect
        - id: financing
          label: 估值下调或融资承压
          type: outcome
        - id: thesis
          label: 投资逻辑破裂
          type: outcome
      edges:
