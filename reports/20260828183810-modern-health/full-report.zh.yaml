  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Sample spans the most decision-useful public and private employer-mental-health comparables plus one distressed
        telehealth lower bound.
    columns:
      - 可比公司
      - 状态
      - 关键指标
      - 估值 / 倍数
      - 参考意义
      - 局限
    rows:
      - - Modern Health
        - 私营 / 最近披露融资轮 + 跟踪平台估值标记
        - 收入估计 $174.6M-$183.4M
        - $1.17B-$1.2B；隐含收入倍数约 6.4x-6.9x
        - 直接研究对象，也是进入价格纪律的最佳锚点
        - 没有当前定价融资轮、经审计收入或股权结构表细节
      - - Spring Health
        - 私营 / Series E 轮背景
        - Tracxn 估值标记
        - $3.3B
        - 雇主心理健康平台模式下最接近的直接同业
        - 收入和当前盈利能力未公开披露
      - - Lyra Health
        - 私营 / Series F 轮背景
        - Tracxn 估值标记
        - $5.58B
        - 衡量高端企业定位的品类领导者标尺
        - 私募估值标记基于 2022 年，当前财务披露有限
      - - Talkspace
        - 上市 / 2026 年被收购
        - 收入 $245.73M
        - 企业价值 $779.58M；EV/Sales 3.17x
        - 上市心理健康服务参照，以及近期 M&A 退出结果
        - 治疗优先的业务组合比 Modern Health 的雇主平台更窄
      - - Teladoc Health
        - 上市
        - 收入 $2.49B
        - 企业价值 $1.45B；EV/Sales 0.58x
        - 大型远程医疗公司的估值下限纪律
        - 多元化远程医疗并含 BetterHelp 敞口，不是干净的直接同业
      - - LifeStance
        - 上市
        - 行为健康服务倍数
        - 企业价值 $4.94B；EV/Sales 3.14x
        - 更高急性程度照护交付的临床行为健康参照
        - 诊所占比较高的模式不同于软件驱动的雇主福利
      - - Progyny
        - 上市
        - 收入 $1.31B
        - 企业价值 $1.78B；EV/Sales 1.35x
        - 具备可见盈利能力的雇主福利可比公司
        - 生育福利经济性与心理健康明显不同
      - - Accolade
        - 2025 年被收购
        - 导航类福利退出倍数
        - 企业价值 $588.0M；EV/Sales 1.32x
        - 用于思考战略退出的雇主福利 M&A 参照
        - 导航和倡导不同于行为健康服务交付
      - - American Well
        - 上市 / 困境
        - 虚拟照护估值下限
        - 企业价值 $9.44M；EV/Sales 0.03x
        - 说明虚拟照护经济性令人失望时，公开市场会变得多么严苛
        - 困境边缘案例，不是 Modern Health 的中心同业
    notes: |
      没有任何单一可比公司足够支撑估值。价值在于用直接私营同业判断品类相关性，再用上市可比公司约束定价纪律。
