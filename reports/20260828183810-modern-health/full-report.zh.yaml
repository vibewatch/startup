      - number: '2.4'
        title: 支撑采用的增长驱动因素
        blocks:
          - type: paragraph
            body: >
              证据集中反复出现四个需求驱动。第一，未经治疗或管理不善的心理健康会造成明确经济损失：WHO 估计，抑郁和焦虑每年导致 120 亿个工作日损失，并带来约 $1T
              的年度生产率成本，这让员工心理健康从软性福利变成董事会层面的议题。第二，雇主持续面临高使用压力和预算相关性。UHC 称，近半数美国人计划在一年内寻求心理治疗，行为健康理赔在 2026 年可能上升 10% 到
              20%，倦怠已达到六年来高点。第三，数字基础设施现在支持跨地域连续且本地化的照护，Modern Health
              这类平台因此能服务跨国员工群体，而不必强行套用只适用于美国的治疗模式。第四，市场越来越奖励能证明结果、而不只是安排预约的供应商。Modern Health
              自身的经济价值和教练辅导研究材料也顺着这个趋势，主张低严重度干预可以带来可衡量的理赔节省和韧性提升。这些驱动合起来，更有利于能按需求分流会员、并持续向雇主证明价值的平台。
