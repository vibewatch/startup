      - number: '1.5'
        title: 反向信号、员工重置和未解决问题
        blocks:
          - type: paragraph
            body: >
              现有记录也包含警示信号。外部评论把 Modern Health 描述为偏教练辅导的平台，但至少一篇独立评测提醒，教练优先的漏斗可能让明确知道自己需要心理治疗的员工受挫；如果 intake
              分流校准不好，也会造成延迟获得治疗的感受。员工数据也暗示组织经历过震荡：Latka 的历史员工轨迹显示 2024 年 6 月曾骤降至 375 人，之后又回升到 900 人以上；Great Place To
              Work 的 2024 年美国认证页面只显示 272 名美国员工。这些数字本身不能证明 2023
              年重组的精确规模，但确实印证了用户提供的起始信息：公司在重新扩大规模前经历过一次大规模人员重置。此外，公开材料仍没有提供经审计财务报表、当前董事会构成、准确雇主数、覆盖人数、客户集中度，或 2021
              年后的明确估值事件。这些缺口限制了任何高确信度投资判断，后续章节需要明确带入。
