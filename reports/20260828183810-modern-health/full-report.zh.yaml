      - SV006
      - SV008
      - SV009
      - SV010
      - SV030
  - id: TV008
    title: 退出准备度与催化因素表
    columns:
      - 退出或催化因素
      - 公开信号
      - 概率判断
      - 价值影响
      - 下一步必须发生什么
    rows:
      - - 信息充分的私募融资
        - 如果管理层选择性开放账本，这是最可能的干净催化因素
        - 中
        - 可能验证乐观情景，也可能可信地重置估值标记
        - 需要强留存、利润率和现金跑道证据
      - - 战略出售
        - 行业仍重视规模化雇主福利资产，且近期存在 M&A 案例
        - 中
        - 即便尚未达到 IPO 级披露，也可能创造流动性
        - 需要买方对心理健康能力和雇主分销感兴趣
      - - 老股支持的流动性
        - 如果现有投资者想在不公开融资的情况下获得流动性，则有可能发生
        - 中低
        - 可能确认真实公允价值，也可能打折
        - 需要透明的老股定价和优先权背景
      - - IPO 路径
        - 公开记录仍远未达到申报级准备度
        - 低
        - 在增值前，很可能需要大幅提升披露水平
        - 需要经审计财务、治理细节和清晰季度叙事
      - - 私有状态下持有并复利
        - 如果现金跑道长且增长保持健康，则合理
        - 中
        - 保留期权价值，但不能解决当前定价不确定性
        - 需要证明公司能自我融资，或以有吸引力的条款融资
    notes: |
      退出思考很重要，因为只有存在一条可信路径，能够带来可持续融资杠杆或可信的战略稀缺性，当前估值才说得通。
