      - number: '7.3'
        title: 合作伙伴、客户与人员依赖
        blocks:
          - type: paragraph
            body: >
              Modern Health 的客户模型埋着几类依赖。公司卖进 HR 和福利工作流，依赖服务者产能和技术供应商交付护理，现在又通过 Generali
              合作有了可见渠道暴露。每一类依赖都能放大规模，也都可能变成失效点。渠道伙伴可以重新谈经济条款，或削弱客户关系。雇主买方在实施或隐私问题后可能迅速流失。服务者和支持供应商若在资质认证、政策合规或数据处理标准上失手，也会变成瓶颈。

              组织历史放大了执行风险。公开记录显示，公司 2023
              年经历了实质性人员重置，之后重新扩张；当前信号则指向一家全球组织规模远大于其美国员工认证页面单独暗示的公司。这段记录不能证明运营薄弱，但意味着客户成功、实施、临床治理、安全运营和管理层带宽都应该是尽调重点。公开客户证据足以证明真实部署，却仍不足以证明客户集中度低、续约质量高，或内部变化期间客户覆盖稳定。
