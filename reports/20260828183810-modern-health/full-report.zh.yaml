        - 已确认事件或重大泄露通知
        - 任何对外披露的重大会员数据事件
        - 暂停投资，或从第一性原理重新承销
      - - Part 2 不合规
        - OCR 投诉、泄露报告或执法行动
        - 任何经证实、与 SUD 记录相关的 OCR 行动
        - 升级法律尽调，并大幅折减估值
      - - 网络可及性恶化
        - 等待时间和填充率趋势
        - 核心地区治疗或精神科可及性下降 >20%
        - 假设续约质量更弱且利润率承压
      - - 客户集中风险兑现
        - 头部客户敞口审查
        - 前五大客户 ARR >25%，或单一客户 ARR >10%
        - 要求价格保护或针对集中度的契约条款
      - - 续约疲弱
        - GRR / NRR / logo 流失趋势
        - NRR <100%，或大型雇主流失率上升
        - 立场转向观察或放弃
      - - 实施质量失灵
        - CSAT / 支持积压 / SLA 未达标
        - 连续两个季度 SLA 未达标或 CSAT 走弱
        - 视为雇主流失的早期预警
      - - 融资压力
        - 现金跑道和融资条款
        - <12 个月现金跑道，或融资条款明显被压低
        - 假设稀释和谈判筹码下降
      - - 安全认证缺口持续存在
        - 独立审计和渗透测试证据
        - 尽调索取后仍没有可信认证材料包
        - 提高折现率和法律留置，或直接退出
    notes: |
