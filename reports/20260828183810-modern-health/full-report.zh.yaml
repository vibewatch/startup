  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和收入流概览
        blocks:
          - type: paragraph
            body: >
              Modern Health
              的公开材料更支持一种典型雇主福利收入模式，而不是消费者订阅或按服务收费的照护模式。公司向雇主销售员工心理健康平台，提供多种与预算和波动容忍度匹配的定价方式，并围绕人群结果、医疗成本节省，以及会员在教练辅导、心理治疗、精神科和数字资源之间分流来讲价值。Vendr
              的第三方采购数据给出了最清楚的定价结构：合同以合资格员工为基数，按每员工每月报价，通常有年度期限、分层服务包、可选家庭覆盖，以及可谈判的实施或集成组件。这意味着收入大多是与覆盖人数绑定的经常性订阅收入，而不是波动较大的单次接触计费。公开客户证明和合作伙伴证据指向三条收入流：核心雇主平台订阅；扩展会话覆盖、家属覆盖或专项项目等高级或附加模块；以及
              Generali 等组织把 Modern Health 分发到雇主人群所形成的合作伙伴 / 渠道收入。具体收入结构未披露，但合同化经常性雇主支出显然是业务的经济中心。
