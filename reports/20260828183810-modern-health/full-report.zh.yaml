      - number: '7.4'
        title: 财务、模型与估值传导风险
        blocks:
          - type: paragraph
            body: >
              最重要的财务风险不是需求消失，而是私有数据不透明，让投资人无法判断一旦运营或监管出错，公司有多少抗冲击能力。公开来源仍未披露总留存率、客户集中度、各服务形态毛利率、当前现金、月度烧钱或现金跑道。因此，投资人看不出公司能否在重大泄露、诉讼事件、服务者成本飙升或糟糕续约周期下顶住压力，而不被迫回到市场融资。

              模型本身有真实经营杠杆，也有真实组合风险。Modern Health 定价可以是 PEPM
              或按使用量计费，护理栈覆盖自助内容、教练服务、治疗、精神科和专项支持。如果组合偏向成本更高的临床交付，或者合约价格相对使用量偏低，利润率质量会被压缩。公开心理健康可比公司也说明，一旦投资人对隐私姿态、经济质量或增长持久性失去信心，估值重置会多快发生。因此，运营风险和融资风险紧密相连：泄露、流失潮或实施质量问题，很可能先体现在续约和利润率压力上，再传导到估值与募资议价权。
