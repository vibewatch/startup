      - number: '1.4'
        title: 规模、客户覆盖和运营里程碑
        blocks:
          - type: paragraph
            body: >
              Modern Health
              的公开规模披露方向上很强，但精确口径并不一致，这在私营福利平台中很常见。官方来源强调全球触达、企业部署和结果，而不是发布一个标准化的雇主数或覆盖人数。独立来源部分补上缺口：Landbase 列出截至 2026 年
              395 家已验证公司客户；Boring Business Nerd 总结为 250+ 家企业客户，并点名 Dropbox、Lyft、Palo Alto Networks、Eventbrite 和 Zendesk
              等例子。Latka 报告 2024 年收入 $174.6M、截至 2025 年末员工数 922 人；RocketReach 显示 912 名员工，Great Place To Work 的认证页面显示美国员工
              272 人。官方案例和结果页面还提供了额外证明点，例如 Rubrik 63% 的注册率、Midland States Bank 行为健康成本减少
              $110K。合在一起，这些证据支持公司具备有意义的跨国覆盖、更成熟的运营能力，以及足以支撑企业采购的牵引力；但作为私营公司，它在具体客户、会员和收入定义上仍不透明。
