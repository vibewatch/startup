        - 公开来源在规模方向上有力，但对经济性的验证不足
        - 数据室或审计材料包收窄不确定性
        - 跟踪器估计分化，或管理层拒绝开放尽调
      - - 风险评级
        - 高
        - 隐私、服务提供者可及性、集中度和融资不透明都可能传导到估值
        - 清晰控制证据叠加多元化指标，可降低剩余风险
        - 任何重大控制、流失或融资问题都会抬高亏损风险
      - - 估值立场
