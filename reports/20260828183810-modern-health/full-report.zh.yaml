    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层和买方画像
        blocks:
          - type: paragraph
            body: >
              Modern Health 的商业关系明显由雇主主导，而不是消费者主导。官网面向 HR、福利和全面薪酬相关方说话；雇主页面强调嵌入 HR
              和福利工作流；客户旅程反复围绕治理、报告和长期员工规划，而不是一次性会员交易。因此，经济买方是雇主，实际用户则是员工和合资格家属，他们会在自助工具、教练辅导、心理治疗、精神科和社区照护之间流动。

              证据最扎实的客户分层，是跨国或地理分散的雇主。Modern Health 声称服务覆盖 200+ 个国家和地区、80+ 种语言；Autodesk 和 Camunda
              等客户例子展示的是多国上线，而不是单办公室试点。产品也被描述为适合需要长期福利合作伙伴、聚合报告和可配置区域部署的雇主。独立市场数据来源对客户数量并不完全一致，但它们一致把 Modern Health
              放在已成规模的企业心理健康供应商品类中，服务许多具名雇主，而不是一个小众点解决方案。
