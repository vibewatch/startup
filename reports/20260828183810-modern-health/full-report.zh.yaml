        - 索取事件日志、风险评估、BAA 模板和独立审计结果
      - - 42 C.F.R. Part 2 对物质使用记录的保密要求
        - 美国联邦
        - 生效；OCR 于 2026-02-16 开始执法
        - 中高
        - 严重
        - Modern Health 通知提到 Part 2 限制；HHS 指南和 OCR 执法框架已存在
