companyProfile:
  summary: >-
    Modern Health 是一家位于 San Francisco、成立于 2017
    年的雇主端心理健康平台。公司面向雇主、福利负责人、健康计划和渠道合作伙伴销售，提供覆盖自助支持、教练辅导、心理治疗、精神科、家庭照护和物质使用支持的全谱系心理健康福利。公开证据显示，公司目前已具备实质规模：收入估计集中在
    US$175M-183M，客户证明覆盖数百家雇主，并且借助 Generali 的合作伙伴分销触达 50 多个国家。创始人 Alyson Watson 于 2025 年转任执行董事长，Matt Levin 出任
    CEO，显示公司开始转向后期运营规模。即便如此，Modern Health 仍是一家私营公司，留存、毛利率和资本结构披露有限。
