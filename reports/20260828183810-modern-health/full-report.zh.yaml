              Modern Health 没有发布雇主数、覆盖人数或扩张队列的清晰时间序列，因此采用分析只能依赖时点披露。现有最好的公开数字显示，企业使用有意义，而不是浅层试用。Rubrik 的 APJ 部署达到 63%
              注册率和 19% 参与率。一家被点名的分析平台客户达到 48% 注册率。Midland States Bank 报告行为健康成本减少 $110K，CEBT 报告 37,000 名覆盖会员中 89%
              幸福感改善。Autodesk 又提供了更详细的上线例子：48 个国家超过 14,000 名员工，首月注册率 20%、首月参与率 11%、到 Q2 参与率 15%、获得照护不到一天、90% 报告改善、98%
              认为提供者有帮助，以及 4.9/5 的提供者评分。

