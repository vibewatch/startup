      - number: '3.4'
        title: 定价、分销、切换成本和多供应商并用
        blocks:
          - type: paragraph
            body: >
              这个品类的公开定价都刻意保持不透明，因此更好的问题不是“谁最便宜”，而是“哪种商业结构能降低买方切换摩擦”。Modern Health、Lyra 和 Spring 都依赖定制化企业定价，而 Modern
              Health 最明确宣传 PEPM 或按使用量计费的灵活性。Lyra 和 Spring 的网站强调定制价格，并配合结果或 ROI 叙事。Headspace 和 Calm
              因为产品保留更强的自助或消费者端成分，看起来更容易试点；Talkspace 则可以拿零售心理治疗访问做基准。Optum 和 Magellan
              往往受益于保险公司或既有供应商打包，让雇主看到的有效成本更低，即便用户体验更弱。这种动态抬高了切换成本：雇主不仅要证明产品质量，还要说明为什么替换一个已嵌入的 EAP、付款方或 App
              包，会实质改善可及性、结果或成本。多供应商并用在预防内容上最容易；当报告、隐私架构、供应商治理和照护导航深度嵌入企业工作流时，最难并用。
