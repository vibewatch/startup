  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围和商业模式
        blocks:
          - type: paragraph
            body: >
              Modern Health 把自己定位为面向雇主、福利负责人、健康计划和渠道合作伙伴销售的职场心理健康平台，而不是单纯的 DTC 心理治疗市场。公司称，其 Adaptive Care Model
              在一个平台内打通全谱系支持，包括自助内容、一对一教练辅导、心理治疗、精神科和用药管理、家庭照护、物质使用支持、Pathways 项目和 Circles
              小组课程。官方页面反复把产品描述为服务复杂员工群体的全球福利，提供者网络覆盖 200+ 个国家和地区、80+ 种语言。商业上，公司强调 PEPM
              和按使用量计费，而非公开标价，说明销售动作是谈判式企业销售。这种定位会影响后续章节，因为 Modern Health
              不只是数字心理治疗供应商；它试图用一个更宽、更偏教练辅导、由雇主治理的照护平台，替代或现代化传统 EAP 和行为健康福利流程。
