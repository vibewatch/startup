        - 用公开承诺对照检查分析、广告技术和数据共享做法
      - - 心理健康平等和福利设计审查
        - 美国联邦 / 雇主计划生态
        - 生效；DOL 平等规则约束计划行为和披露
        - 中
        - 中高
        - 面向雇主的实施和报告姿态
        - 如果部署或访问制造了限制性的心理健康服务摩擦，买方可能认为供应商与平等目标不一致
        - 审查 Modern Health 如何与 EAPs、计划、预授权和网络规则衔接
      - - 跨境隐私与本地化照护合规
        - 多司法辖区
        - 覆盖 200+ 个国家意味着持续义务
        - 中
        - 高
