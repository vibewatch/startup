figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: |
      战略里程碑显示，Modern Health 从 2017 年创立，演进为一家获得独角兽融资、全球分布的雇主平台；2025 年公司重置领导层，如今又用已发表的结果研究强化教练优先模式。
    data:
      items:
        - label: 成立
          date: '2017'
          detail: Modern Health 由 Alyson Watson 和 Erica T. Johnson 在旧金山创立
          tone: positive
        - label: 种子轮
          date: '2018'
          detail: 早期种子资金支持最初面向雇主的平台开发
          tone: positive
        - label: Series A 轮
          date: '2019'
          detail: Series A 轮为早期商业化提供资金
          tone: positive
        - label: Series B 轮
          date: 2020-01
          detail: $31M 融资在疫情需求激增前扩展平台
          tone: positive
        - label: Series C 轮
          date: 2020-12
          detail: $51M 后续融资扩大企业增长
          tone: positive
        - label: Series D 独角兽轮
          date: 2021-09
          detail: $74M 融资、$1.17B 估值标志公司正式成为独角兽
          tone: positive
        - label: SUD 扩展
          date: 2023-09
          detail: 扩展物质使用障碍支持，拓宽更高急性程度覆盖
          tone: positive
        - label: Generali 合作
          date: 2024-07
          detail: 与 Generali Health Solutions 的独家合作支持渠道分销
          tone: positive
        - label: CEO 交接
          date: 2025-04
          detail: Matt Levin 出任 CEO；Alyson Watson 转任执行董事长
          tone: warning
        - label: 教练研究
