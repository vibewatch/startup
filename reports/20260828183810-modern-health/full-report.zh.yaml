      - number: '3.5'
        title: 护城河耐久性、商品化风险和最危险威胁
        blocks:
          - type: paragraph
            body: >
              Modern Health
              确实有真实差异化，但更多来自执行，而不是坚不可摧的壁垒。适应式照护、教练辅导优先的采用设计和全球本地化，填补了冥想单点产品与重心理治疗临床平台之间的真实空白。问题在于，这些优势没有一项是资本充足的竞争对手不可能复制的。Lyra
              和 Spring 的融资基础更大，公开表达的结果引擎更强。Headspace 拥有重要的消费者习惯循环和更宽的内容品牌。Optum 和 Magellan
              可以把打包和既有位置武器化。与此同时，独立评测显示，如果不配套清晰的心理治疗升级路径，教练辅导优先漏斗可能制造用户摩擦，也给临床优先竞争对手在采购中提供攻击点。因此，最高置信度的竞争风险不是某个更好的功能，而是混合照护心理健康平台的商品化：如果买方认为多个供应商现在都能提供相近的教练辅导、心理治疗、分析和本地化，那么价格、既有分销和已发表证据会比
