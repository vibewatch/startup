      - number: '4.2'
        title: 定价、GTM 动作和销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Modern Health 公开可见的定价叙事刻意保持高层次，这对企业福利软件很正常，但会限制承销精度。公司营销定价灵活性和可预测预算；Vendr 的合同数据集则提供了更运营化的视角：标准部署通常落在约 $4 到
              $12+ PEPM，取决于员工数、层级和谈判，大企业可获得更好的单位价格。Vendr 还指出，多年期合同可把 PEPM 降低约 10% 到 20%；家庭覆盖可能按家属增加约 $1.50 到 $3
              PEPM；实施费大约在 $2K 到 $10K+。这些信号说明，实际年合同价值（ACV）可能比单一标价更受覆盖人数、心理治疗 / 教练辅导上限、地域范围和采购议价力影响。GTM
              看起来结合了雇主直销与福利渠道或合作伙伴分销。Generali 合作具有财务意义，因为如果渠道经济性有吸引力，它暗示了一条较低获客成本（CAC）的国际分销路径。即便如此，公开数据没有披露
              CAC、回本周期、续约率、经纪人贡献或净留存率，因此任何销售效率判断仍是代理指标，而不是已验证的单位经济事实。
