      - number: '1.2'
        title: 创始人、领导层交接和治理信号
        blocks:
          - type: paragraph
            body: >
              创始人 Alyson Watson 仍是 Modern Health 身份的核心，但公司已经把创始人主导运营正式切换为更成规模的职业经理人模式。Modern Health 官方 About 页面现在介绍
              Watson 为创始人兼执行董事长；2025 年 4 月的一则公告任命 Matt Levin 为 CEO。镜像新闻稿称，Levin 长期从事福利、HR 服务和医疗健康，曾任 People 2.0 和
              Benefitfocus 的 CEO，也曾在 Aon 和 Hewitt 任职。该公告公开点名的董事会声音包括 Kleiner Perkins 合伙人 Mamoon Hamid 和 01 Advisors
              联合创始人 Dick Costolo，说明主要资本方仍在参与治理。二级资料还列出覆盖产品、技术、财务和运营的其他高管。创始人延续、外部投资人治理，以及一位拥有福利行业经验的新任 CEO
              叠加在一起，显示公司走出最初独角兽阶段后，正在把使命可信度与更紧的企业执行力配起来。
