      - number: '8.2'
        title: 融资锚点与当前投资判断背景
        blocks:
          - type: paragraph
            body: >
              融资故事有帮助，但不完整。Modern Health 于 2021 年 9 月自行公开确认完成 $74M Series D，估值 $1.17B；第三方追踪器仍将公司聚集在累计融资约
              $167M-$170M、2025 年底或 2026 年估值约 $1.2B 附近。收入追踪器也足够集中，可以确认真实规模：Latka 报告 2024 年收入 $174.6M，Growjo 当前估计约
              $183.4M。客户广度和分销证据进一步支持它不是早期资产：Landbase 报告 395 家已验证公司使用 Modern Health，Generali 合作把触达延伸到 50
              多个国家的雇主。与此同时，员工数记录显示公司仍在消化战略和运营重置。公开来源显示 2023 年收缩，随后重新扩张到 900+ 区间，并在 2025 年由 Alyson Watson 向 Matt Levin 交接
              CEO 职位。上述信号符合一家真实公司进入新阶段，但还不足以证明它已经完全去风险、准备好退出的复利型公司。
