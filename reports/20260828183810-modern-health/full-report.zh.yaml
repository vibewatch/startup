  - id: FU001
    title: Modern Health 从雇主到员工的客户旅程
    type: flow
    description: |
      公开材料能看到的路径：从雇主采购、上线、成员激活，到效果报告，再到续约或扩张。
    data:
      nodes:
        - id: n1
          label: 雇主确认需求
          note: HR、福利或人才负责人寻求支持，应对倦怠、服务可及性、留存或理赔压力
        - id: n2
          label: 评估供应商
          note: 买方评估覆盖地区、服务提供者可及性、报告、家属覆盖和实施匹配度
        - id: n3
          label: 签约并上线
          note: Modern Health 借助雇主工作流上线，配套沟通和本地化赋能
        - id: n4
          label: 成员激活
          note: 员工和家属注册、评估需求，并选择数字支持、教练、治疗或其他照护
        - id: n5
          label: 持续使用照护
          note: 使用模式因客户和地区而异；公开案例显示注册和参与度可以被量化
        - id: n6
          label: 雇主报告
          note: 汇总洞察和价值衡量结果会共享给客户侧负责人
        - id: n7
          label: 续约或扩张
          note: 地区、家属、服务方式或合作渠道扩大后，合同规模可能继续做大
    claimRefs:
      - CU001
      - CU003
      - CU024
      - CU025
      - CU031
      - CU032
