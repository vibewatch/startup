  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: |
      决策链条从真实牵引力和品类相关性出发，经过披露和定价缺口，最后落到「观察」建议，而不是买入判断。
    data:
      nodes:
        - id: n1
          label: 规模真实
          detail: 收入、员工数和客户广度代理指标支持其后期公司状态
        - id: n2
          label: 品类相关
          detail: Spring 和 Lyra 表明，雇主心理健康品类仍有战略吸引力
        - id: n3
          label: 高倍数诱惑
          detail: Modern Health 当前锚点隐含 6.4x-6.9x 收入倍数
        - id: n4
          label: 披露缺口
          detail: NRR、毛利率、现金、集中度和股权结构表条款仍未公开
        - id: n5
          label: 风险堆叠
          detail: 隐私、可及性、集中度和融资风险都可能快速压缩价值
        - id: n6
          label: 基准情景公允价值
          detail: $750M-$950M 最符合当前公开记录
        - id: n7
          label: 建议：观察
          detail: 继续跟进，但投资前要让价格和尽调把缺口补上
      edges:
        - from: n1
          to: n3
          label: 支撑溢价
        - from: n2
          to: n3
          label: 支撑品类溢价
        - from: n3
          to: n4
          label: 需要证明
        - from: n4
          to: n6
          label: 迫使折价
        - from: n5
          to: n6
          label: 限制倍数
        - from: n6
          to: n7
          label: 决定姿态
    claimRefs:
      - CV023
      - CV027
      - CV028
      - CV030
      - CV033
      - CV038
      - CV044
  - id: FV002
    title: 选定收入倍数视角下的估值敏感性
    type: bar
    layout: wide
    summary: |
      按约 $179M 的收入中点，测算以百万美元计的示意性企业价值。
    data:
      items:
        - label: 类 Teladoc 0.58x
          value: 104
        - label: 类 Accolade 1.32x
          value: 236
        - label: 可比上市公司中位数 1.33x
          value: 238
        - label: 类 Talkspace 3.17x
          value: 567
        - label: 基准情景中点
          value: 850
        - label: 当前锚点中点
          value: 1185
        - label: 乐观情景中点
          value: 1225
    approximationNotes: |
      数值假设收入锚点中位数接近 $179M，由 $174.6M 和 $183.4M 两个公开估计推导而来。这是敏感性框架，不是管理层预测。
    claimRefs:
      - CV015
      - CV016
      - CV018
      - CV026
      - CV027
      - CV033
      - CV034
      - CV046
  - id: FV003
    title: 不同情景下的估值 / 回报区间
    type: range
    layout: wide
    summary: |
      悲观、基准和乐观情景下，以百万美元计的估值区间。
    data:
      items:
        - label: 悲观
          low: 450
          value: 575
          high: 700
          unit: USD M
        - label: 基准
          low: 750
          value: 850
          high: 950
          unit: USD M
        - label: 乐观
          low: 1100
          value: 1225
          high: 1350
          unit: USD M
    approximationNotes: |
      区间是按概率加权的分析师判断，基础是公开收入估计、可比上市公司倍数约束，以及尚未解决的私营公司风险程度。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: |
      以 IC 风格对 Modern Health 的估值设置打分，1-10 分，分数越高越好。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: 雇主心理健康需求仍具战略重要性。
        - label: 产品广度
          score: 7
          detail: Modern Health 看起来比单一服务方式的点状解决方案更完整。
        - label: 客户证明
          score: 7
          detail: 数百家客户和跨国分销看起来真实，但集中度被隐藏。
        - label: 经济性可见度
          score: 3
          detail: 毛利率、NRR、流失率和现金仍未披露。
        - label: 可比公司支撑
          score: 4
          detail: 私营同业提供支撑，但可比上市公司要求更严格的倍数纪律。
        - label: 风险控制
          score: 3
          detail: 隐私、可及性和融资不透明让剩余风险维持高位。
        - label: 可见锚点下的安全边际
          score: 3
          detail: 除非投资者拿到异常强的私有证明，否则安全边际有限。
        - label: 综合评分
          value: 5
          score: null
          detail: 观察：公司可信，但当前公开定价背景并不宽松。
    approximationNotes: |
      分数是基于本章证据综合得出的分析师判断，不是公司披露指标。
    claimRefs:
      - CV023
      - CV028
      - CV030
      - CV036
      - CV038
      - CV043
      - CV044
