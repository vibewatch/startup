      - number: '3.2'
        title: 直接数字原生同行：Lyra、Spring 与 Modern Health
        blocks:
          - type: paragraph
            body: >
              Lyra Health 和 Spring Health 是最重要的直接竞争对手，因为它们销售的是同一个宏大承诺：用一个更可衡量的数字平台替代或现代化雇主行为健康福利。Lyra 官网强调 AI
              驱动的提供者匹配、9/10 的会员改善、康复速度快 2x、整体医疗理赔成本降低 26%、家庭支持，以及全球直接服务超过 2000 万人、并通过合作伙伴和计划为 2 亿人提供访问路径。Spring Health
              则用 AI 原生定位回应，声称全球触达超过 1.7 亿人、当天预约、2.2x ROI，并通过面向雇主的平台提供强结果报告。相对这两家公司，Modern Health
              有差异但并不孤立：它最强的信息是适应式照护、把教练辅导作为一等模式、全球本地化，以及企业定价灵活性。换句话说，Modern Health
              在同一个平台品类里竞争，但使用不同切口，主张把低严重度中间人群服务好，比默认重心理治疗模式更能拉动参与，也更具成本效率。
