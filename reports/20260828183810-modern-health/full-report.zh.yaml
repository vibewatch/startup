      - number: '6.5'
        title: 扩张动态和集中度风险
        blocks:
          - type: paragraph
            body: >
              可见的扩张模型有三层。第一，Modern Health 看起来围绕现有雇主先落地、再扩张：把家属纳入覆盖，叠加多种服务形态、更高急性程度支持和持续报告。第二，地理扩张也在推进：Autodesk 和 Camunda
              案例显示跨境部署，全球业务页面强调本地化交付，Generali 关系则通过合作伙伴把 Modern Health 带进 50 多个国家的雇主。第三，PEPM 或按使用量计费的弹性定价，很可能让 Modern
              Health 适配不同客户和渠道的采购约束。

              风险同样清楚。Modern Health 未披露客户集中度，投资人看不出少数大型雇主是否贡献了大部分
              ARR。公开客户案例中，最强的样本偏向大型企业和多雇主信托，暗示平均合同价值可能明显集中在一小批成熟买方手中。企业采购也会制造摩擦：地理覆盖、服务者可及性、人群结构、隐私、报告和实施质量都重要。最后，2023
              年人员重置带来一个合理的尽调问题：重组以及后续重新招聘期间，客户支持、实施深度和客户覆盖是否顺畅扩张。公开来源没有显示重大客户流失，但也没有足够透明度，无法排除集中度或续约风险。
