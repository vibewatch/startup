      - number: '3.3'
        title: 预防优先、心理治疗优先和既有替代方案
        blocks:
          - type: paragraph
            body: >
              Headspace、Calm Health、Talkspace、Optum 和 Magellan 很重要，因为企业买方并不总是围绕同一个目标采购。Headspace 销售端到端主张，获得 4,000+
              家组织信任，拥有 15k+ 名提供者、一天内心理治疗访问能力，以及在冥想和正念上格外强的消费者品牌。Calm Health 更偏预防和参与，用心理学家开发的项目、筛查、行动计划和 App
              原生正念内容，在雇主或健康计划福利生态内拉动激活。Talkspace 更偏心理治疗和精神科，强调研究深度、全国执照覆盖，以及覆盖 150+ 种治疗状况的便利性。Optum 和 Magellan
              代表另一类威胁：产品优雅度较低，但借助既有付款方、PBM 或行为健康关系，打包和既有优势强得多。即使这些替代品在一体化用户体验或教练辅导前置设计上输给 Modern
              Health，也可能在简单性、感知成本或采购惯性上击败它。
