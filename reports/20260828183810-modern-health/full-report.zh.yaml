  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前建议与价格纪律
        blocks:
          - type: paragraph
            body: >
              Modern Health
              更像一家已经有规模的真实后期公司，而不是只有故事的独角兽。公开证据支撑可观收入、企业客户广度、全球分销，以及绑定雇主合同而非脆弱消费者订阅的变现模型。相较承压或增长更慢的上市远程医疗公司，Modern
              Health 的确应有一定溢价。不过，公开价格锚相对已披露证据仍偏高。按可见收入区间约 $174.6M 至 $183.4M、估值锚约 $1.17B 至 $1.2B 计算，Modern Health 约为 6.4x
              至 6.9x 收入。这个倍数远高于上市可比公司的中位数约 1.33x，也仍高于 Progyny 等更健康的雇主福利参照。正确结论不是 Modern Health
              已经坏掉，而是市场已经在向投资人收取管理层尚未充分披露、无法验证的留存、利润率质量和战略稀缺性溢价。这种组合支持在明确入场纪律下给出观察建议，而不是按可见锚点买入。
