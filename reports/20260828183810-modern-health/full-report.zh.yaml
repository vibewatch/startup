        blocks:
          - type: paragraph
            body: >
              Modern Health
              最强的产品差异化来自运营，而不是纯技术。公开来源中最清晰的切口，是内部提供者网络、阶梯式或适应式照护匹配逻辑、按人口特征和专长做个性化，以及覆盖全球员工群体的本地化组合。教练辅导与心理治疗文章称，提供者网络由公司自建，并通过同步日历和实时监控引擎监测；文章还声称全球平均一天即可获得首个可用会话、会后评分
              4.9/5、98% 当天完成专科匹配。这些都是有意义的成熟度信号，因为它们讲的是工作流表现，而不是营销抽象。产品扩张信号也存在：Series D 资金部分计划用于新照护形式和高级报告；2024 年物质使用文章推出
