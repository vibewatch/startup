  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >
              Modern Health 不只是一个心理治疗师目录或冥想
              App。检索到的产品和支持页面显示，它是一项分层员工心理健康福利：先通过雇主赞助接入，再根据需求、偏好和计划设计，把会员分流到不同照护模式。首页把一对一、小组和自助数字资源放在同一个平台里；支持中心的 Care
              Offerings 和 Types of Care
              页面则把模块集合讲清楚：教练辅导、心理治疗、精神科和用药管理、家庭照护、自助内容、Circles、Pathways、照护顾问、危机资源和其他合作伙伴照护。重要的是，多处来源指出，访问权限取决于会员雇主选择的福利包。这让产品更像可配置的福利操作系统，而不是统一的
              DTC 应用。放在客户工作流里，核心任务是快速分诊、照护模式匹配、有隐私意识的访问、全球本地化，以及把心理健康福利转化为受治理企业项目的雇主报告，而不是一项健康福利。
