  - id: TV005
    title: 投资逻辑破裂与叫停触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 隐私 / PHI / Part 2 问题
        - 任何与敏感数据有关的重大事件、泄露通知或执法行动
        - 企业信任和买方信心恶化的速度可能快过增长叙事的修复
        - 暂停投资，或从第一性原理重新承销
      - - 客户集中度披露
        - '>25% ARR 来自前五大客户，或 >10% ARR 来自单一客户'
        - 头部客户名单广度看起来没那么稳固
        - 要求价格保护、契约条款，或直接放弃
      - - 可及性恶化
        - '>20% 核心地区填补率、等待时间或匹配质量恶化'
        - 削弱结果、满意度和续约假设
        - 大幅下调增长和利润率假设
      - - 留存不达标
        - NRR 低于 105%，或核心企业队列出现明显客户流失
        - 打破支持软件式溢价倍数的论点
        - 转向悲观情景承销
      - - 被迫融资
        - 内部轮、惩罚性条款，或没有明确增长催化的紧急融资
        - 证实现金跑道和资本效率弱于预期
        - 将入场价格大幅下调
      - - 利润率不及预期
        - 毛利率或贡献利润率明显低于尽调预期
        - 说明业务比投资逻辑假设更偏服务
        - 按较低倍数的福利 / 服务可比公司重新定位 Modern Health
    notes: |
      这些触发因素应当可监测、对投资有用，而不是泛泛的风险表述。
    claimRefs:
      - CV024
      - CV030
      - CV038
      - CV041
      - CV042
    sourceRefs:
      - SV012
      - SV014
      - SV031
      - SV032
      - SV033
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
      - 严重程度
    rows:
      - - 现金跑道
        - 当前现金余额、债务和月度烧钱速度
        - 决定投资者是在选择入场时点，还是在回应融资压力
        - 索取最新资产负债表、债务明细，以及 13 周 / 12 个月现金预测
        - 关键
      - - 留存质量
        - 按细分拆分的 NRR、GRR、客户流失和续约日程
        - 支撑或打破高端经常性收入论点
        - 索取按客户规模和地区拆分的队列留存桥接
        - 关键
      - - 客户集中度
        - 前 10 大客户敞口和最大续约日期
        - 客户名单广度可能掩盖重大集中度
        - 索取集中度表和即将到期续约日历
        - 关键
      - - 利润率路径
        - 按教练、治疗、精神科和纯数字组合拆分的毛利率与贡献利润率
        - 需要判断增长带来经营杠杆，还是压缩利润率
        - 索取模态级利润率桥接和使用率敏感性
        - 关键
      - - 股权结构表
        - 优先股堆叠、反稀释权、老股交易，以及 409A 或近期估值标记支持
        - 决定退出时谁真正受益，以及当前估值标记是否反映经济现实
        - 索取股权结构表、优先权法律摘要和近期估值材料
        - 关键
      - - 控制成熟度
        - 独立的安全 / 隐私 / 合规证据
        - 受监管的心理健康平台没有可信控制，就无法证明溢价合理
        - 索取 SOC 2 / ISO 材料、泄露日志和隐私架构审查
        - 重大
    notes: |
      如果管理层拿不出这套材料，即使收入增长有吸引力，建议也应维持“观察”或进一步下调。
    claimRefs:
      - CV030
      - CV037
      - CV039
      - CV041
      - CV042
      - CV043
    sourceRefs:
      - SV009
      - SV010
      - SV028
      - SV031
      - SV032
  - id: TV007
    title: 融资与进入价格纪律锚点
    columns:
      - 锚点
      - 公开数值
      - 解读
      - 重要性
      - 投资者优先姿态
    rows:
      - - 公司最后确认的估值
        - $1.17B
        - 2021 年 9 月的 Series D 轮锚点
        - 历史信号强，但作为实时定价参照已经陈旧
        - 视作背景，而非公允价值
      - - 跟踪器口径的后续估值
        - ~$1.2B
        - 延续到 2025-2026 年的老股式或数据库估值标记
        - 说明独角兽标签仍在，但没解释原因
        - 用 409A、老股交易或新轮融资证据核实
      - - 收入估计下限
        - $174.6M
        - Latka 2024 年收入估计
        - 为估值计算建立真实规模
        - 用作保守收入锚点
      - - 收入估计上限
        - $183.4M
        - Growjo 当前年收入估计
        - 帮助框定上行情景，但仍受方法论限制
        - 仅作为方向性上限
      - - 已融资金
        - ~$167M-$170M
        - 已融资本可观，但远低于 Lyra 或 Spring 的弹药库
        - 优先权压力可能可控，但当前现金未知
        - 要求当前资本结构细节
      - - 员工数区间
        - 912-922 全球；GPTW 列示 272 名美国员工
        - 重组和重新扩张后的规模化组织
        - 支撑规模判断，但意味着费用基数不低
        - 要求烧钱速度和人效指标
    notes: |
      进入价格纪律应从这些锚点出发，然后立即转入私有尽调。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV022
      - CV031
