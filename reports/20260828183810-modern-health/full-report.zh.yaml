      - number: '5.2'
        title: 模块地图和运营流程
        blocks:
          - type: paragraph
            body: >
              产品支持文档补上了这些模块如何实际互动。Care Offerings 描述三类主要一对一服务——教练辅导、心理治疗，以及精神科 / 用药管理——同时解释各自适用场景，以及哪些部分取决于福利资格。Pathways
              增加了更结构化的项目层，把一对一专家会话、互动练习和评估结合起来，并明确可通过网页或移动端进入。Circles
              创建由提供者带领、按日程进行的社区小组课程。家庭照护把流程延伸到伴侣和覆盖家属，包括未成年人；匹配过程并不完全由 App 自助完成。物质使用公告又加入更高复杂度的照护协调、筛查、住院 /
              门诊导航和探索清醒生活的小组支持，说明 Modern Health 的工作流已经超出低严重度教练辅导。运营上这很重要：公司试图拥有横跨严重度谱系的分流和协调层，而不只是交付孤立的心理治疗会话。
