      - number: '4.3'
        title: 成本结构、毛利逻辑和资本强度
        blocks:
          - type: paragraph
            body: >
              Modern Health 既不是纯
              SaaS，也不是重诊所的照护交付；它的成本结构介于两者之间。平台照护模式包含教练、心理治疗师、精神科和数字资源，这意味着提供者薪酬或会话报销应是重要收入成本驱动，同时还有照护导航、支持运营和软件基础设施。公开披露没有说明各地区提供者主要是员工、承包商还是混合网络伙伴，但多模式照护的存在强烈暗示毛利率应低于纯软件基准。与此同时，Modern
              Health 似乎不拥有实体诊所或资本密集型硬件，因此资本开支应相对轻，主要投向产品、集成、分析和雇主报告基础设施。上市公司可比对象说明了相邻福利业务可能出现的差异：Teladoc
              具备软件式规模，但分部盈利能力混杂；Talkspace 的毛利率低于纯 SaaS；Progyny 的福利管理模式又产生不同的利润率和现金流表现。正确结论不是给 Modern Health
              一个精确公开毛利率，而是承认其毛利路径高度取决于服务模式组合、会话上限、国际提供者经济性，以及来自高接触临床交付与低成本教练辅导和数字参与的收入占比。
