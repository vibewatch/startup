        title: 融资历史、估值和资本画像
        blocks:
          - type: paragraph
            body: >
              Modern Health 的融资历史比当前财务报表更容易核实。最清楚的已验证融资标记是公司 2021 年 9 月的 Series D 公告，当时 Modern Health 称融资 $74M、估值
              $1.17B。Tracxn 和 Latka 都把时间线向前延伸到种子轮、Series A、Series B 和 Series C，但两者对累计融资额略有差异：Latka 报告五轮共 $167.4M，Tracxn
              报告六轮约 $170M。差异足够小，可以采用大约 ~$170M 的累计融资表述；同时也提醒后期私营公司分析必须区分公司公告的轮次和数据库重建的历史。本轮研究没有看到任何可访问的官方来源显示 2021
              年后有新的定价融资，尽管第三方数据库仍继续称公司为独角兽，并把估值放在约 $1.2B。做估值时，2021 年 Series D 是最后一个已披露的硬锚点；更新的估计应视为二级来源，置信度更低。
