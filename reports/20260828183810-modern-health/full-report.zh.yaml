      - number: '2.2'
        title: 市场规模视角及其能衡量和不能衡量的内容
        blocks:
          - type: paragraph
            body: >
              现有市场规模估计足以确认品类重要性，但过于宽泛，不能机械当作 Modern Health 的总可用市场（TAM）。Precedence Research 估计，美国行为健康市场 2025 年为 $94.82B，到
              2035 年增长至 $174.78B；全球行为健康市场 2025 年为 $184.94B，到 2035 年增长至
              $349.88B。这些数字包含远超雇主购买数字行为健康福利的范围：门诊咨询、机构式照护、成瘾治疗和广义障碍治疗都在总量里。更适合 Modern Health 的视角，是 KFF 和
              UnitedHealthcare 描述的雇主赞助子集：雇主购买的是可及性、导航、结果报告和分级照护选项，而不是直接报销每一次接触。自下而上的市场视角也来自 UHC
              的观察：寻求支持的会员中约一半可能适合教练辅导或自助等低严重度选项，而不是治疗优先。Modern Health 正坐在这层导航中。结论是：TAM
              很大；一旦加入地域、企业就绪度和雇主福利预算归属，可服务市场（SAM）会小得多，可获取市场（SOM）还会更小。
