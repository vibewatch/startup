      - number: '8.5'
        title: 最终尽调门槛与投资逻辑破坏因素
        blocks:
          - type: paragraph
            body: >
              剩下的决定性工作很直接。投资人需要当前现金、月度烧钱、按服务形态拆分的毛利率、按队列拆分的留存和扩张、客户集中度以及股权结构条款，才能判断 Modern Health
              值不值得享受高个位数私有市场倍数，还是只能相对上市可比公司有有限溢价。反向逻辑也已经足够清楚，可以现在开始跟踪。重大隐私或 Part 2
              问题会迅速削弱企业信任。服务者可及性恶化，或者证据显示教练优先漏斗伤害寻求治疗的用户，可能削弱结果和续约逻辑。承压融资流程，或客户集中度超过可接受阈值，会进一步侵蚀 Modern Health
              应享受上市可比组溢价的论点。在问题回答前，正确姿态是有条件接触：保持接近公司，但让价格和披露承担证明责任。如果尽调证明留存强、贡献利润率健康、现金跑道充足，建议可以上调；否则，当前锚点应大幅打折。
