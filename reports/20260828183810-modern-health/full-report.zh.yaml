      - number: '2.3'
        title: 买方、用户、付款方和采用路径动态
        blocks:
          - type: paragraph
            body: >
              在这个市场里，经济买方通常不是最终用户。福利、全面薪酬、HR，有时还有健康计划或渠道合作伙伴团队，掌握预算和采购决策；员工及合资格家属才是真正用户。Modern Health 面向雇主的文案明确表示，平台旨在为
              HR 负责人提供聚合报告、治理和长期规划支持。UHC 的 2026 年雇主趋势报告指出，买方越来越期待可衡量结果，例如降低缺勤率、改善留任和
              ROI，而不只是简单的访问人数。与此同时，用户采用仍取决于低摩擦入口、对污名敏感的照护选项，以及获得支持的速度。Modern Health 的教练辅导前置模式在这里变得重要：KFF、UHC 和 PMC
              教练辅导论文都描述了同一个市场现实——并非每位员工都需要传统心理治疗，但许多员工仍需要结构化心理健康支持。Spring、Lyra、Headspace、Talkspace 和 Optum
              的竞品页面显示，整个品类都在向这种买方—用户分离的结构收敛；Modern Health 的独特位置，是把低严重度和全球本地化支持做成采购优势，而不是临床退而求其次。
