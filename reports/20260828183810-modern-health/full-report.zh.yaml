      - number: '5.5'
        title: 信任、安全、隐私和合规控制
        blocks:
          - type: paragraph
            body: >
              数字心理健康的产品尽调最终取决于信任和控制边界。Modern Health 的 HIPAA 通知比其通用隐私或安全落地页更有实质内容，确认公司把自己视为关联受管实体，说明治疗 / 付款 /
              运营用途，称特定泄露后会通知会员，并解释 PHI 如何在保障协议下与签约第三方共享。Care Offerings 文档还增加了具体产品限制，例如基于福利的功能门控，以及因 DEA 要求，Modern Health
              提供者不处方联邦指定受控物质的政策。HHS Security Rule 摘要和 ONC 隐私与安全指南给出了平台所处的监管框架：行政、物理和技术保障，风险分析，可审计性，以及最小必要访问控制。Modern
              Health 的工程岗位也通过强调 HIPAA 和 GDPR 合规、身份协议和安全会员访问来强化这一点。公开记录没有清楚显示的是具名认证状态、渗透测试结果、事件响应历史，或 AI
              驱动产品功能的详细安全论证。这些缺口并不证明薄弱，但确实让信任尽调仍不完整。
