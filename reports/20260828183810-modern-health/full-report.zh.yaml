  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、监管与法律暴露
        blocks:
          - type: paragraph
            body: >
              Modern Health 显然经营在受监管的健康数据环境里，而不是轻量健康应用品类。其 HIPAA
              通知称，公司采用关联受监管实体模式，可以将信息用于治疗、支付和医疗运营，并且在部分泄露事件后必须通知会员。同一通知还明确覆盖 42 C.F.R. Part 2 下的物质使用障碍记录；Modern Health
              销售物质使用护理，因此触及行为健康领域最敏感的保密制度之一。HHS 现称，OCR 已于 2026 年 2 月 16 日开始用与 HIPAA 对齐的民事执法工具执行 Part
              2。这让数据隔离、同意管理或泄露流程薄弱的下行风险明显抬高。

              更广泛的行业先例也不利。FTC 的 BetterHelp 案例表明，心理健康平台面临的执法风险不只是数据泄露，也包括最终被证明不准确的隐私表述。Modern Health
              公开可见的控制措施方向上有帮助，但本轮检索到的法律 /
              安全面仍比尽调团队希望看到的更薄：合规页面强调道德和供应商尽调，安全页面信息稀疏，信任中心页面几乎读不出多少内容，公开认证或事故历史细节也无法从已检索材料中独立验证。因此，隐私 /
              监管风险是本报告中最明确的投资逻辑破坏因素。
