        title: 运营、临床与安全风险
        blocks:
          - type: paragraph
            body: >
              Modern Health 的服务承诺靠真人服务者产能、准确分诊，以及在全球场景里可靠处理敏感数据支撑。公开联邦资料指向结构性劳动力问题，而不是短期招聘不便：HRSA 预计到 2038
              年，心理健康咨询师、心理学家、精神科医生和相关岗位将大幅短缺；BLS 仍预计这些岗位快速增长，每年有数万空缺。一个销售快速接入、服务形态选择和全球覆盖的平台，供给紧张会直接传导为等待时间、会员不满和续约质量下降。

              临床分流风险也重要。Modern Health
              自己的护理服务资料和第三方评价都显示，它采用教练服务前置的阶梯式护理模型。这种设计对许多用户可以兼具经济吸引力和临床合理性，但如果更高急性程度或已准备接受治疗的会员被次优分流，或者升级质量因地区而异，风险也会出现。安全风险并不只等于恶意入侵；还包括公司能否证明控制成熟、可审计、能响应事件，并在雇主、家属、服务者和国际交付场景之间保持质量一致。公开证据显示公司有一些保护措施，但技术细节还不够，无法打消尽调疑问。
            claimRefs:
              - CR015
              - CR016
