      - number: '8.4'
        title: 退出准备度与可能催化剂
        blocks:
          - type: paragraph
            body: >
              公开证据还不足以说明 Modern Health 今天已具备 IPO
              准备度。相比上市心理健康和福利可比公司，它仍未披露公开市场买方或后期跨界投资人最想看的信息：经审计收入进展、毛利率、流失和扩张、客户集中度、当前现金，以及清算优先权或其他股权结构条款。Teladoc
              的公开文件和投资人页面把差异讲得很清楚：上市同业可以按季度评估收入、分部组合和资本结构；Modern Health
              仍要求投资人靠信念跨过那一步。退出可选性并未因此消失。心理健康能力对雇主、支付方、导航平台和虚拟护理生态仍有价值，战略兴趣合理；Talkspace 被收购、Accolade
              出售等近期行业结果也说明，已有规模的福利资产仍能交易。但若披露没有上台阶，近期最现实的催化剂不是干净的公开市场上市，而是数据更丰富的私募轮、由老股交易支持的估值重置，或更清晰的持久盈利证明。
