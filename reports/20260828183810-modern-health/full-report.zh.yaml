        title: 留存、耐久性和满意度证据
        blocks:
          - type: paragraph
            body: >
              Modern Health 的公开留存证据明显弱于采用证据。公司在本轮研究审阅的当前公开页面上，没有披露净留存率（NRR）、总留存率（GRR）、logo
              流失、续约率、队列曲线或平均合同期限。相反，公开记录更多依赖推荐语、案例结果，以及让续约更可信的产品设计元素：家属覆盖、多种照护模式、全球部署支持、持续报告，以及被定位为长期合作伙伴的客户成功模型。这些都是有帮助的续约要素，但不是直接留存指标。

              满意度证据强于留存证据。Autodesk 报告 98% 的会员表示提供者能够提供帮助，提供者评分为 4.9/5。Midland States Bank 的 CHRO 称，相比传统 EAP，Modern
              Health 带来了更高使用率、满意度和参与度。Franklin Pierce Schools 和 Nextdoor
              都强调易用性，以及在地点、语言和需求层级上的广泛适配。尽管如此，尽调团队不应把这些信号等同于已验证续约。最大的客户质量缺口，仍是缺少公开、可独立审计的留存数据。
