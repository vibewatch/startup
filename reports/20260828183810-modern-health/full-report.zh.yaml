  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >
              Modern Health 处在一个多层竞争环境中，而不是一个整齐的单一同行集合。第一层是数字原生的雇主端心理健康平台，面向 HR 和福利买方销售一项广义员工福利：Lyra Health、Spring
              Health 和 Modern Health 本身。这些公司都销售横跨教练辅导、心理治疗、数字工具和雇主报告的一体化支持，但强调的强项不同。第二层包括预防优先或由消费者品牌延伸而来的平台，例如 Headspace
              和 Calm Health，它们先以冥想、日常参与和低摩擦自助支持切入，再扩展到教练辅导或临床导航。第三层包括心理治疗优先和保险公司打包的替代方案，例如 Talkspace、Optum 和
              Magellan。这些玩家即使不提供 Modern Health 完全相同的适应式照护定位，也可能凭价格、既有计划关系或消费者熟悉度赢单。任何对 Modern Health
              的尽调都必须纳入这三层，因为企业买方既会拿产品与最相似的风投支持同行相比，也会与现状方案相比。
