      - number: '8.3'
        title: 可比倍数与情景区间
        blocks:
          - type: paragraph
            body: >
              最佳公开估值框架应是混合框架。Modern Health 与 Spring Health、Lyra
              足够接近，私人同业估值可以证明这个品类仍能拿到独角兽级别估值；但这些私人估值不能解决定价问题，因为它们没有附带当下投资人需要的完整运营披露。因此，上市可比公司才是更有纪律的锚，哪怕没有一个完全匹配。Talkspace
              可用于数字心理健康交付，Teladoc 可参照规模化远程医疗和 BetterHelp 背景，LifeStance 可参照行为健康临床交付，Progyny 可参照雇主福利质量，Accolade
              可参照福利导航退出先例，Amwell 则给出承压下限。合在一起，可比组显示倍数区间很宽但整体偏温和，EV/Sales 中位数约 1.33x。Modern Health
              因为是私有、原生于这个品类且仍有牵引力，应该相对这组可比公司享有溢价，但不是无限溢价。由此得到的基准情景约 $750M-$950M；若私人尽调强劲，乐观区间为
              $1.10B-$1.35B；若披露或执行走弱，悲观区间为 $450M-$700M。
