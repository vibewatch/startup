  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和现状替代方案
        blocks:
          - type: paragraph
            body: >
              Modern Health 的相关市场并不只是“心理健康
              App”，也不是整个行为健康服务经济。最贴合公司的商业品类，是雇主赞助的心理健康和行为健康福利：雇主、健康计划或渠道合作伙伴购买由软件和服务共同支撑的照护，用来覆盖员工和合资格家属，从预防、教练辅导、心理治疗、精神科到相关导航。KFF
              的政策简报明确指出，雇主可能向行为健康供应商支付按会员计的费用，让员工可以使用 App 和远程行为健康服务。Modern Health
              自己的雇主和全球页面也强化了这一框架：它强调企业工作流、聚合报告和全谱系平台，而不是零售订阅。相邻支出池包括传统 EAP、管理式行为健康 carve-out、数字自助
              App，以及越来越多嵌入行为健康支持的慢病项目。因此，现状替代方案包括保险公司打包的行为健康、传统 EAP、通过健康计划访问的网内心理治疗，以及低成本消费者冥想或远程治疗产品。这个边界很重要，因为宽泛的行为健康
              TAM 数字会高估 Modern Health 的真实可触达市场，除非先过滤到雇主赞助、数字化协调的使用场景。
