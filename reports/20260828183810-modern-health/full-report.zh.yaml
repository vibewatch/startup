        - 雇主的心理健康支出仍是战略性开支，而非可选项
        - 单靠需求挡不住倍数压缩
        - 高
        - 需要证明需求能转化为稳固续约和扩张
      - - 产品模式
        - Modern Health 提供全球、多模态支持，看起来比单点方案更完整
        - 教练优先的分流可能让寻求治疗的用户受挫，也会让留存更复杂
        - 中
        - 需要按模态拆分的分流、升级转介和满意度数据
      - - 客户证明
        - 数百家雇主和跨国分销证明公司有真实商业牵引力
        - 客户名单覆盖面不能证明集中度低或 NRR 强
        - 中
        - 需要头部客户敞口和队列留存
      - - 经济性
        - PEPM 定价和企业合同支撑经常性收入质量
        - 毛利率、贡献利润率和烧钱速度仍未披露
        - 中
        - 需要完整单位经济模型桥接和现金跑道
      - - 竞争位置
        - 私营同业证明品类相关性和雇主付费意愿
        - 同业规模也抬高了结果证明和执行速度门槛
        - 中
        - 需要相对 Spring / Lyra / 既有厂商的赢单率、留存和替换数据
      - - 估值
        - 品类稀缺性可以支撑公司相对上市可比公司的溢价
        - 当前锚点已经比上市公司中位数高出数个收入倍数
        - 高
        - 要么降低价格，要么拿出能证明溢价地位的私有指标
    notes: |
      最关键的反向逻辑不是品类不好，而是 Modern Health 可能是一家好公司，但价格已经打满。
