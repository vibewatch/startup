    rows:
      - - 大型自保险跨国雇主
        - 买方：CHRO / 福利 / 全面薪酬；用户：员工和家属；付款方：雇主
        - 用一个全球平台替代割裂的 EAP 和心理健康供应商
        - 官网强调全球交付；Autodesk 覆盖 48 个国家
        - ACV 可能最高，也最契合报告和本地化价值
        - 没有公开的分客群收入或续约数据
      - - 区域或中端市场雇主
        - 买方：HR / 人力运营；用户：员工和家属；付款方：雇主
        - 不用拼接多个点状方案，也能提供广泛心理健康支持
        - Midland States Bank 客户案例
        - 把 TAM 从超大型企业扩到更广
        - 没有公开的按规模定价或赢率披露
      - - 多雇主信托 / 汇聚会员买方
        - 买方：信托管理层 / 方案赞助方；用户：会员；付款方：信托或赞助雇主
        - 为分散的覆盖人群提供可负担、快速访问
        - CEBT 案例提到 37,000 名会员
        - 可把许多小雇主的覆盖人群聚合成一份合同
        - 没有公开的信托型合同经济性
      - - 渠道或合作伙伴分发的雇主人群
        - 买方：保险方 / 福利合作伙伴加雇主；用户：员工；付款方：合作伙伴或雇主合同结构
        - 借助保险或福利分发扩大访问
        - Generali 合作覆盖 50+ 个国家的雇主
        - 国际扩张 CAC 可能更低
        - 没有公开的渠道利润率或排他性披露
      - - 员工和家属终端用户
        - 买方：雇主；用户：会员和家庭；付款方：雇主
        - 自助式护理、辅导、治疗、精神科、社区支持、工作生活服务
        - Autodesk 福利页面列出员工及家属访问和会话设计
        - 更广的家庭覆盖可能提高粘性并支撑增购
        - 未披露家庭附加率或使用结构
      - - 地理分散的科技雇主
        - 买方：全球福利 / 全面薪酬；用户：国际员工；付款方：雇主
        - 跨国家和语言提供本地化心理健康支持
        - Camunda 和 Autodesk 示例显示 30+ 与 48 个国家场景
        - 契合 Modern Health 的本地化叙事
        - 需要各区域等待时间和按国家满意度
    notes: |
      公开分层证据最强的是跨国雇主和科技导向买方，但案例研究也显示其在银行、教育和信托型会员人群中有进展。
