  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: |
      主要下行情景是，合规或交付失误先损害雇主信任，再拖累续约质量、利润率和融资筹码。
    data:
      nodes:
        - id: breach
          label: 隐私或安全事件
          type: trigger
        - id: enforcement
          label: 监管或法律行动
          type: trigger
        - id: access
