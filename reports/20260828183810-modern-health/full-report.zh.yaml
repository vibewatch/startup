      - number: '7.5'
        title: 缓释优先级与放弃标准
        blocks:
          - type: paragraph
            body: >
              Modern Health 确实有可见控制。HIPAA
              通知比许多初创公司的隐私页面更实质，合规页面提到供应商尽调和举报渠道，服务者条款划定误用边界，面向客户的材料也一贯强调报告和引导式部署，而不是纯自助服务。上述安排并非无关紧要，说明公司明白自身风险画像主要是运营和监管，而不只是商业风险。

              但可见控制只有与私有证据匹配，才算完整缓释。对这家公司，决定性尽调问题都是可量化的：实际事故历史、独立安全证明、按地区拆分的服务者等待时间和填补率、客户成功人员配比、头部客户集中度、流失队列以及当前现金跑道。因此，放弃标准应围绕事件和阈值设定，而不是抽象担忧。重大隐私事件、执法行动、服务网络可及性恶化、重大客户流失，或融资条款明显压缩，都会实质性损害投资案例。
