      - number: '4.4'
        title: 公开牵引力估计和最大的私有数据缺口
        blocks:
          - type: paragraph
            body: >
              最强的公开牵引力信号，是多家独立估算方把 Modern Health 放在有意义规模，而不是早期试验阶段。Latka 报告 2024 年收入 $174.6M、累计融资 $167.4M，并称截至 2025 年末大约
              922 名员工；Growjo 估计当前年收入 $183.4M、员工 916 人，人均收入约 $200K。Tracxn 对融资额和员工数的方向判断类似，并报告截至 2026 年 7 月员工 912
              人。这些数字在时间点和方法上不一致，但聚集得足够紧，支持 Modern Health 已越过小规模风投阶段的判断。客户证明也显示其企业使用并不轻：Rubrik 在 APJ 录得 63% 注册率和 19%
              参与率，一家被点名分析平台客户达到 48% 注册率，Midland States Bank 称行为健康成本减少 $110K，CEBT 描述 37,000 名覆盖会员中 89%
              幸福感改善。即便如此，承销缺口仍然很大：没有经审计收入、没有实际毛利率、没有队列留存、没有客户集中度、没有流失率、没有
              CAC、没有当前现金余额，也没有债务时间表。这个数据集足以形成方向性判断，但如果没有数据室，无法做精确建模。
