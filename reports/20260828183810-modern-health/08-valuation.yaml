  - id: financing-anchor-and-current-underwriting-context
    title: Financing anchor and current underwriting context
    body: >
      The financing story is both helpful and incomplete. Modern Health itself publicly confirmed a $74M
      Series D in September 2021 at a $1.17B valuation, while third-party trackers still cluster the
      company around roughly $167M-$170M of cumulative funding and about a $1.2B valuation in late 2025
      or 2026. Revenue trackers also cluster tightly enough to establish real scale: Latka reports $174.6M
      of 2024 revenue and Growjo estimates about $183.4M currently. Customer-breadth and distribution
      proof further support that this is not an early-stage asset: Landbase reports 395 verified companies
      using Modern Health, and the Generali partnership extends reach to employers in more than 50
      countries. At the same time, the headcount record suggests a company still absorbing strategic and
      operating resets. Public sources show a 2023 contraction, later re-expansion into the 900-plus range,
      and a 2025 CEO transition from Alyson Watson to Matt Levin. Those signals are consistent with a real
      company entering a new phase, but not yet with a fully de-risked, exit-ready compounder.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV022
      - CV031
      - CV032
    tableRefs:
      - TV007
    figureRefs:
      - FV002

  - id: comparable-multiples-and-scenario-ranges
    title: Comparable multiples and scenario ranges
    body: >
      The best public valuation frame is a blended one. Modern Health is close enough to Spring Health
      and Lyra to justify using private peer marks as evidence that the category can still command
      unicorn-scale valuations, but those private marks do not solve the pricing problem because they do
      not come with the full operating disclosure investors need today. Public comps are therefore the more
      disciplined anchor even though none is perfect. Talkspace is useful for digital mental-health delivery,
      Teladoc for scaled telehealth and BetterHelp context, LifeStance for behavioral-health clinical
      delivery, Progyny for employer-benefit quality, Accolade for benefit-navigation exit precedent, and
      Amwell for a distressed lower bound. Together they show a wide but mostly modest multiple set, with a
      median around 1.33x EV/Sales. Modern Health deserves a premium to that basket because it is private,
      category-native, and still demonstrates traction, but not an unconstrained premium. That leads to a
      base case of roughly $750M-$950M, a bull range of $1.10B-$1.35B if private diligence is strong, and
      a bear range of $450M-$700M if either disclosure or execution weakens.
