  - id: final-diligence-gates-and-thesis-breakers
    title: Final diligence gates and thesis-breakers
    body: >
      The decisive missing work is straightforward. Investors need current cash, monthly burn, gross margin
      by modality, retention and expansion by cohort, customer concentration, and cap-table terms before
      they can decide whether Modern Health deserves a high-single-digit private multiple or only a modest
      premium to public comps. The anti-thesis is also clear enough to monitor now. A material privacy or
      Part 2 issue would undermine enterprise trust rapidly. Deterioration in provider access or evidence
      that a coaching-first funnel is hurting therapy-seeking users could weaken outcomes and renewal logic.
      A financing process under pressure, or concentration above acceptable thresholds, would further erode
      the argument that Modern Health merits a premium to the public group. Until those questions are
      answered, the right posture is conditional engagement: stay close to the company, but make price and
      disclosure do the work. If diligence proves strong retention, healthy contribution margins, and ample
      runway, the recommendation can upgrade. If not, the current anchor should be discounted materially.
    claimRefs:
      - CV024
      - CV030
      - CV038
      - CV041
      - CV042
      - CV043
      - CV044
