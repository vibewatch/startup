company:
  name: Modern Health
chapter:
  number: 8
  title: Valuation
  summary: >
    Public evidence supports Modern Health as a real, scaled employer mental-health platform, but not
    enough to underwrite the current roughly $1.17B-$1.2B valuation anchor as an obvious bargain.
    Direct private peers such as Spring Health and Lyra still command higher headline valuations, yet
    public comparables across telehealth, employer benefits, and behavioral-health delivery trade at
    much lower revenue multiples and with far greater disclosure. The key underwriting gap is not demand;
    it is missing proof on retention, gross margin, customer concentration, current cash, and cap-table
    terms. Recommendation: Track. Confidence: medium. Risk rating: high. Valuation stance: stretched.
    A defensible base-case range is about $750M-$950M, with bull support only if private diligence proves
    strong renewal quality and runway, and bear outcomes around $450M-$700M if risk or multiple
    compression materializes.

sections:
  - id: current-recommendation-and-price-discipline
    title: Current recommendation and price discipline
    body: >
      Modern Health looks more like a real scaled late-stage company than a narrative-only unicorn.
      Public evidence supports meaningful revenue, enterprise customer breadth, global distribution,
      and a monetization model tied to employer contracts rather than fragile consumer subscriptions.
      That matters because the company does deserve some premium to distressed or slower-growth public
      telehealth names. However, the public price anchor remains demanding relative to disclosed proof.
      Using the visible range of roughly $174.6M to $183.4M of revenue and the visible valuation anchors
      of about $1.17B to $1.2B, Modern Health screens at roughly 6.4x to 6.9x revenue. That is far above
      the public comp median near 1.33x and still above healthier employer-benefit references such as
      Progyny. The right conclusion is not that Modern Health is broken; it is that the market is already
      charging investors for retention, margin quality, and strategic scarcity that management has not yet
      disclosed well enough to verify. That combination supports a Track recommendation with explicit entry
      discipline rather than a buy call at the visible anchor.
    claimRefs:
      - CV023
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
