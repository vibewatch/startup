    {
      "id": "operational-and-security-risk",
      "title": "Operational, quality, and model-governance risk",
      "body": "Flex is trying to unify a large number of workflows that historically lived in separate systems: payments, cards, AP, AR, global accounts, rewards, underwriting, and AI coordination. That breadth is strategically attractive but operationally heavy. The company\u2019s own terms explicitly disclaim uninterrupted or error-free operation, while the electronic-consent flow makes digital delivery and supported tooling prerequisites for account access. Thread\u2019s debit-card agreement permits deactivation or cancellation controls typical of regulated card programs, which means customer access can be affected by partner-side decisions as well as Flex-side operations. Flex\u2019s public materials also lean heavily into AI for underwriting, finance assistance, and decision support. That increases model-risk management demands around explainability, drift, fraud detection, and adverse-action consistency. The issue is not that AI is inherently problematic; it is that a fast-growing fintech with multiple products and partner dependencies needs unusually strong controls to keep product quality, compliance, and customer trust aligned while the stack expands.",
      "claimRefs": [
        "CR017",
