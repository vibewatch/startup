    {
      "id": "regulatory-and-legal-risk",
      "title": "Regulatory and legal risk",
      "body": "The single most important risk cluster remains regulated-partner dependency. Flex\u2019s public disclosures show that the product stack touches deposit accounts, cards, rewards, AI workflows, and cross-border flows, but the bank and program-partner picture is not fully stable in the public record. Thread Bank documents retained in May 2026 still reference Flexbase deposit and debit programs, while current Flex pages disclose Column and Lead Bank roles in other contexts. That does not prove a problem by itself\u2014fintech stacks often evolve\u2014but it does create documentation, operational, and compliance risk because customer promises, legal agreements, bank responsibilities, and control environments need to stay synchronized during change. The risk rises further because Thread Bank has already faced regulatory scrutiny related to third-party risk management. Flex\u2019s own terms and privacy language also widen the legal surface: binding arbitration, broad data-use rights, AI-training rights, and third-party data-sharing permissions may all be commercially normal, but they increase sensitivity if a customer dispute, privacy complaint, or model-governance issue emerges. Investors should therefore underwrite Flex as a company with real regulatory-adjacency risk even if no public enforcement action targets Flex itself today.",
