    {
      "id": "partner-people-and-model-risk",
      "title": "Partner, people, and financial-model risk",
      "body": "Partner and capital dependencies convert directly into company-level execution risk. Flex\u2019s deposit, payments, card, and cross-border experiences rely on third parties including Thread, Airwallex, Column, Lead Bank, and Mastercard-linked rails. Airwallex\u2019s connected-account terms make the dependency concrete: platform providers can act as authorized users, data can be shared between counterparties, and instructions can be relied upon without separate customer confirmation. That kind of architecture can work well, but it creates failure-transmission paths that are outside Flex\u2019s sole control. Financially, the company is also carrying a debt-heavy funding model relative to disclosed equity and has not published the loss, fraud, or profitability metrics that would let investors evaluate credit quality with confidence. The public record suggests a founder-led organization scaling headcount quickly while shipping a very broad product surface. That combination can be powerful, but it also raises people-risk around regulatory hiring, operational discipline, support intensity, and the ability to keep documentation and controls current while the business doubles in size.",
