    "number": 7,
    "title": "Risks",
    "summary": "Flex\u2019s risk profile is dominated by regulated-partner dependence, underwriting and funding exposure, and the execution burden of a broad AI-native finance stack. The public record supports a constructive growth narrative, but also shows meaningful residual exposure around sponsor-bank oversight, partner migrations, data governance, and opaque credit economics."
  },
  "sections": [
    {
      "id": "risk-landscape",
      "title": "Risk landscape and severity view",
      "body": "Flex\u2019s risk surface is unusually wide for a company still at a few-thousand-customer scale. It operates across banking, cards, cross-border payments, credit, rewards, and AI-assisted workflows, but does so without its own bank charter and with visible dependence on a changing set of external partners. That means regulatory, partner, product, and financial risks are linked rather than isolated. A sponsor-bank enforcement event can affect onboarding and service continuity; a partner migration can amplify customer confusion; credit losses can tighten funding appetite; and any data-governance failure can hurt both compliance and trust. The public evidence does not suggest that these risks are hypothetical. Thread Bank\u2019s regulatory history, Flex\u2019s changing public partner disclosures, and the company\u2019s own contractual language around data use, uptime, and account controls all point to real residual exposure. The positive offset is that Flex appears conscious of these issues and is building toward a more integrated governance stack. The negative offset is that public mitigation evidence still lags the ambition of the operating model.",
