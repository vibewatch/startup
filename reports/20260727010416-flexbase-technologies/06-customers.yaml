    "summary": "Flex\u2019s public customer story is strongest on segment fit and workflow pain rather than on exact customer-count disclosure. The retained evidence supports a customer base concentrated in middle-market owner-operators across construction, wholesale, and multinational or multi-entity businesses, but public proof of retention, concentration, and scaled deployment remains thinner than the company\u2019s growth narrative."
