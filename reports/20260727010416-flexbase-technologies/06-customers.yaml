    {
      "id": "adoption-trajectory-and-scale",
      "title": "Adoption trajectory and scale visibility",
      "body": "Public customer-scale evidence is positive but imprecise. TechCrunch said in March 2025 that Flex served thousands of businesses and named several representative accounts. By December 2025, the company said customers were using an average of four or more products, which implies more than shallow trial behavior. By July 2026, several public reports described the customer base only as a few thousand, while also saying the business had crossed $10 billion in annualized payments volume and a nine-figure revenue run rate. That combination suggests that Flex may be prioritizing relatively large, high-throughput customers rather than maximizing raw logo count. The benefit of that strategy is stronger monetization per account. The drawback is that customer count alone remains too fuzzy for reliable retention or market-penetration analysis. Investors should therefore read current scale in terms of quality and throughput, not just number of logos. Later diligence should ask how many accounts are active, funded, multi-product, and meaningfully engaged rather than relying on the generic phrase \u201cfew thousand.\u201d",
      "claimRefs": [
        "CU009",
