  "sections": [
    {
      "id": "who-the-customer-is",
      "title": "Who the customer is",
      "body": "Flex\u2019s customer is best defined by operating complexity and ownership structure, not by startup identity or enterprise size alone. Across its own product and thought-leadership pages, the company repeatedly describes an owner who runs a profitable, closely held business with intertwined business and personal obligations, multiple entities, and too little internal finance capacity for the complexity they face. That framing is consistent with public round coverage, which places the target at roughly $3 million to $100 million of annual customer revenue and highlights industries such as construction, wholesale, and multinational businesses. The public pages also reinforce that the buyer is often the owner rather than a fully staffed finance department. That matters because product adoption and retention will depend on whether Flex actually reduces owner burden, not just whether it supplies another payments tool. The implication for diligence is that Flex\u2019s best-fit customer may be highly valuable, but also relatively narrow and operationally demanding to serve well.",
