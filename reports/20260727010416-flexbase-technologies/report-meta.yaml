companyProfile:
  summary: >
    Flex, the brand name for Flexbase Technologies, Inc., is a San Francisco-based
    fintech that positions itself as an AI-native private bank for high-net-worth
    middle-market business owners. Its platform bundles business banking, multi-currency
    cards, global payments (180+ countries, 32 currencies), working capital, bill-pay
    financing, accounts-payable and accounts-receivable automation, expense management,
    and an AI owner-intelligence layer called Beacon. Founded in 2022 and launched in
    September 2023, Flex reached a $1.2 billion valuation in July 2026 after raising
    a $70 million Series B1 led by Halo Fund, with total equity of $180 million and a
    $300 million debt facility. The company reported a nine-figure annualized revenue
    run rate and $10 billion+ in annualized payments volume as of July 2026.
  foundedDate: "2022-01-01"
  founders:
    - name: Zaid Rahman
      role: Founder & CEO
      background: >
        Thiel Fellow and former Columbia student; co-founded Volley prior to Flex;
        architect of the owner-centric private-bank thesis.
      claimRefs: [CO009]
    - name: Hadi Solh
      role: Co-Founder
      background: >
        Co-founded Flex with Rahman; specific prior background not publicly disclosed.
      claimRefs: [CO052]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >
    Flex sells a unified financial-operations platform for owner-led businesses: a
    Visa/Mastercard business card (net-60 / 0% for 60 days), multi-currency global
    payments, business banking (deposit accounts via Column N.A.), working capital and
    invoice financing (Bill Pay Later), AP/AR workflow automation, expense management,
    and the Beacon weekly AI owner-intelligence report. The core platform is marketed as
    free; revenue derives from interchange, FX, credit economics, and deposit earnings.
  customerFocus: >
    High-net-worth middle-market business owners generating roughly $3M–$100M in annual
    revenue, including construction, wholesale, and multinational businesses. Flex
    estimates the global cohort at ~3 million owners.
  businessModel: >
    Revenue from card interchange, a 1% foreign-exchange fee on international
    transactions, credit economics on working-capital products (Bill Pay Later, net-60),
    deposit spread, and a subscription fee for the personal platform tier. Core business
    platform is free to acquire customers.
  stage: Series B1
  fundingStatus: >
    $70M Series B1 (July 14, 2026, led by Halo Fund / Ryan Smith & Ryan Sweeney);
    $180M total equity; $300M total debt (Victory Park Capital credit facility and
    expanded warehouse). Prior rounds: $20M Series A (Sept 2023), $25M equity + $200M
    credit facility (March 2025), $60M Series B (Dec 2025, led by Portage).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO007, CO009, CO011, CO023, CO030, CO031, CO036]

