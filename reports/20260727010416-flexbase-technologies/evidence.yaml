evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, executive roster, and governance-rights disclosure for Flex.
    whyItMatters: Leadership concentration and investor control affect succession risk, operating authority, and financing leverage.
    diligencePath: Request an up-to-date board deck or cap-table summary and compare it with financing documents.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: private-evidence-only
    severity: material
    topic: secondary-liquidity
    missingEvidence: Any disclosure of secondaries, insider liquidity, or employee tender activity.
    whyItMatters: Liquidity history changes how investors interpret the true round economics and employee incentives.
    diligencePath: Ask management and lead investors for round structure, cap-table waterfalls, and any secondary allocations.
    relatedQuestionRefs:
      - QO015
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: A primary incorporation or formation document that reconciles 2020 operating genesis with 2022 official formation.
    whyItMatters: >-
      Later chapters should not overstate company age, product maturity, or founder iteration history without resolving
      the timeline.
    diligencePath: Pull state formation records and early financing documents to pin legal formation versus pre-company activity.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: An exact customer count with date stamp and methodology.
    whyItMatters: >-
      Customer-scale claims drive later customer, financial, and valuation analysis, but current public evidence is
      mostly qualitative or company-claimed.
    diligencePath: Ask for a dated KPI sheet that defines paying customers, active accounts, and product penetration.
    relatedQuestionRefs:
      - QO017
  - type: conflicting-data
    severity: material
    topic: bank-partners
    missingEvidence: A single product-by-product map of every current issuing, deposit, and settlement bank.
    whyItMatters: >-
      Different 2026 disclosures point to different banking counterparties, which creates diligence uncertainty around
      compliance, concentration, and operational migration risk.
    diligencePath: Obtain the latest partner-bank schedule from legal/compliance and reconcile it to customer-facing disclosures.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership enumeration coverage
    missingEvidence: >-
      A fully current public leadership roster with titled functional owners beyond founders and investor board
      representation.
    whyItMatters: The chapter can identify key visible people, but it cannot yet treat the public roster as exhaustive.
    diligencePath: Request the current executive team list and board observer roster from management or investor materials.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage boundary
    missingEvidence: A documentary source for every early product, financing, and governance milestone before the 2023 stealth exit.
    whyItMatters: >-
      The public chronology is directionally strong, but some earlier milestones depend on retrospective reporting
      rather than contemporaneous primary documents.
    diligencePath: >-
      Pull incorporation records, pre-seed materials, and archived press releases to convert the partial chronology into
      an exhaustive one.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 stakeholder coverage boundary
    missingEvidence: A full cap table, warehouse lenders schedule, and all active infrastructure counterparties by product.
    whyItMatters: >-
      The stakeholder map names the highest-signal public actors, but not every investor, lender, or bank counterparty
      affecting control and concentration risk.
    diligencePath: Request the latest cap table, debt schedule, and partner-bank matrix from finance and compliance.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      A bottom-up pipeline-based estimate of how many owners actually match Flex’s underwriting, geography, and
      product-eligibility rules.
    whyItMatters: >-
      Broad middle-market counts and owner anecdotes do not tell investors how many near-term accounts Flex can
      realistically win.
    diligencePath: >-
      Request internal ICP filters, historical conversion data, and corridor-level eligibility rules to build a
      serviceable obtainable market model.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: switching-willingness
    missingEvidence: >-
      Quantitative win/loss, replacement, and implementation data showing why customers switch and which tools they
      displace.
    whyItMatters: >-
      Workflow pain is evident, but later GTM and customer chapters need proof that buyers will consistently replace
      entrenched stacks.
    diligencePath: Ask for CRM win/loss reasons, migration timelines, and replacement-product logs.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: sizing-comparability
    missingEvidence: A normalized mapping from Flex’s owner-defined cohort to public middle-market firm definitions.
    whyItMatters: >-
      Without a common denominator, the 125k, 200k, and 350k figures are informative but not directly additive or
      substitutable.
    diligencePath: >-
      Create an internal segmentation crosswalk tying ownership structure, revenue band, industry, and international
      exposure to each public lens.
    relatedQuestionRefs:
      - QM021
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Actual Flex win/loss rates and displacement data versus Mercury, Ramp, Brex, AmEx, and incumbent banks.
    whyItMatters: Messaging differentiation is not enough; valuation and GTM analysis need proof of real competitive conversion.
    diligencePath: Request CRM win/loss reports, displacement logs, and segment-level conversion by primary incumbent.
    relatedQuestionRefs:
      - QP022
      - QP025
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized customer pricing, discounting, interchange economics, and attach rates across the main peer set.
    whyItMatters: Public packaging cues are useful but insufficient for true unit-economics comparison.
    diligencePath: Collect customer contracts, RFP responses, and buyer-side bills from competitive bake-offs.
    relatedQuestionRefs:
      - QP015
  - type: missing-source
    severity: minor
    topic: roadmap-overlap
    missingEvidence: A dated side-by-side roadmap showing which competitor expansions are live versus merely marketed.
    whyItMatters: The threat of platform convergence depends on shipped capabilities, not just category narratives.
    diligencePath: Track product-release notes and interview customers who recently evaluated multiple stacks.
    relatedQuestionRefs:
      - QP021
      - QP023
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized pricing, take rates, and product-level monetization mix across cards, payments, banking, and software
      modules.
    whyItMatters: Public packaging alone cannot determine revenue quality or gross-margin composition.
    diligencePath: Request customer-level pricing sheets and a revenue bridge by product family.
    relatedQuestionRefs:
      - QI005
      - QI015
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, gross margin, contribution margin, and default / fraud loss data.
    whyItMatters: These metrics determine whether headline growth is value accretive or merely volume-driven.
    diligencePath: Obtain board metrics packs or lender reporting with cohort economics and loss curves.
    relatedQuestionRefs:
      - QI010
      - QI015
  - type: private-evidence-only
    severity: material
    topic: capital
    missingEvidence: Cash balance, burn, runway months, facility utilization, covenants, and next-round trigger thresholds.
    whyItMatters: >-
      The company may be well financed or still structurally dependent on frequent fundraising; public data cannot
      distinguish clearly.
    diligencePath: Request current cash-flow statement, debt schedule, and treasury forecast.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: material
    topic: architecture-depth
    missingEvidence: System-design detail on ledgering, permissions, workflow engine accuracy, and infrastructure reliability.
    whyItMatters: Product breadth alone does not show whether the stack is technically robust enough for scale.
    diligencePath: Request engineering architecture reviews, uptime metrics, and workflow error-rate dashboards.
    relatedQuestionRefs:
      - QE010
      - QE015
  - type: private-evidence-only
    severity: material
    topic: deployment-quality
    missingEvidence: Implementation time, support SLAs, integration depth, and customer-reported reliability metrics.
    whyItMatters: Operational adoption depends on predictable deployment and exception handling, not just feature availability.
    diligencePath: Collect onboarding timelines, support dashboards, and customer reference calls by module.
    relatedQuestionRefs:
      - QE015
      - QE025
  - type: conflicting-data
    severity: material
    topic: partner-map
    missingEvidence: A current authoritative product-by-product map of every issuing, deposit, settlement, and compliance partner.
    whyItMatters: >-
      Public disclosures point to more than one partner path, which complicates product-risk assessment and customer
      disclosure consistency.
    diligencePath: Request the latest compliance partner matrix and reconcile it against every customer-facing disclosure.
    relatedQuestionRefs:
      - QE022
      - QE024
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Exact active-customer count, funded-account count, and multi-product account count with date stamp.
