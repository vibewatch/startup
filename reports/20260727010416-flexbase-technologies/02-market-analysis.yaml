    {
      "id": "sizing-lenses-and-addressable-population",
      "title": "Sizing lenses and addressable population",
      "body": "The retained market sources support a large but definition-sensitive opportunity. U.S. Chamber and RSM describe the middle market as one-third of total jobs and 40% of GDP, while RSM\u2019s 2026 redefinition expands the segment to firms with $30 million to $10 billion of revenue and counts 125,000 firms employing 50 million people. KeyBank, drawing on NCMM-style definitions, uses a lower revenue band of $10 million to $1 billion and arrives at roughly 200,000 firms employing 48 million Americans. Flex\u2019s own target claim\u2014around 350,000 U.S. owners and 3 million globally\u2014is broader still, because it centers owner complexity rather than one standard revenue bucket. Those numbers are not directly interchangeable, but they do converge on a useful conclusion: the underlying economic mass is large enough to matter, yet the exact addressable cohort depends on whether the buyer is defined by company revenue, ownership structure, cross-border needs, or operational complexity. That is why the right market read is a range of constrained lenses, not one heroic TAM headline.",
      "claimRefs": [
        "CM009",
