  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who Flex actually competes with
        blocks:
          - type: paragraph
            body: >-
              Flex’s competitive set is broader than a simple “Brex for owners” shorthand. Its own comparison materials
              place the company against Ramp and Brex, but the retained market and product evidence shows at least five
              relevant clusters: startup-banking platforms such as Mercury, spend-management and procurement platforms
              such as Ramp, broader modern-finance suites such as Brex, premium card and loyalty brands such as American
              Express, and incumbent private or commercial banks such as J.P. Morgan Private Bank and Bank of America.
              These products overlap only partially, which is exactly why Flex sees an opening. Owners with
              multi-entity, cross-border, and personal-business coordination problems often assemble several products to
              do what Flex wants to do in one system. The practical implication is that Flex rarely replaces one
              monolithic incumbent. It usually competes against a bundle of tools plus a relationship bank, and must
              prove that integration depth is more valuable than best-of-breed specialization.
