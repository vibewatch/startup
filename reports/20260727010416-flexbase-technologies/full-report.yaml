      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The retained source set points to a technology architecture that is less about exotic core infrastructure
              than about orchestration across financial primitives. Flex’s own finance-stack, AP automation, invoicing,
              and vendor-payment content all describe a system that ingests transactional data, routes approvals,
              automates repetitive actions, and exposes unified visibility to the owner. AI Inbox is a good
              micro-example of the operating model: inbound bills are captured, interpreted, and routed through approval
              workflows. Beacon extends the same orchestration logic into owner-level weekly briefings. On the payments
              side, Flex Global and Global Payments rely on cross-border rails, FX pricing, and settlement abstractions
              that hide underlying complexity from the user. None of this proves a technical moat on its own, but it
              does show that the company’s product value depends on workflow continuity, data normalization, and
              permissions control across several money-movement and record-keeping layers. The best product
              interpretation is therefore “orchestrated financial operating system,” not “single monolithic bank
              replacement.”
