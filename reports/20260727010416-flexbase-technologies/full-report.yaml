      - number: '2.3'
        title: Buyer economics, adoption triggers, and willingness to switch
        blocks:
          - type: paragraph
            body: >-
              The buyer case is strongest where operational pain is frequent, expensive, and personal to the owner.
              Flex’s own writing highlights repeated frictions: no single view of cash across entities, accountants and
              banks that do not coordinate, delayed payments, and month-end processes still trapped in spreadsheets. Its
              finance-stack guide turns those anecdotes into product categories—banking, payments, AP, payroll, credit,
              expense management, ERP integration, FP&A, and business insights—showing how many tools have to
              interoperate before the workflow feels seamless. That helps explain the adoption path. The initial budget
              owner is often the owner or a very small finance team; the user is the same owner plus whoever actually
              executes payments, closes books, or manages spend. The switching trigger is less “we want a better card”
              than “we cannot keep juggling five systems while growing into more entities or more countries.” The
              downside is that this same breadth raises switching costs and implementation friction, especially once
              accounting integrations, partner-bank KYC, and multi-entity controls are in scope.
