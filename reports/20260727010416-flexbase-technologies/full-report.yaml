  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The investment case for Flex is attractive enough to stay engaged, but not clean enough to underwrite
              aggressively without additional diligence. Publicly, the company has crossed $10 billion in annualized
              payments volume, reached a nine-figure revenue run rate, and doubled its valuation from the prior
              late-2025 round to $1.2 billion by July 2026. Those are strong proof points. The challenge is that the
              same public record still leaves the core economics underexplained: profitability is undisclosed,
              credit-loss performance is undisclosed, partner architecture has visible complexity, and customer-count
              precision remains limited. The right valuation stance is therefore not “overpriced at any cost,” but
              “premium, execution-sensitive, and deserving of tighter entry discipline.” At the current disclosed price,
              the case works best for investors who believe Flex can become a high-quality owner-finance platform rather
              than merely a fast-growing card and payments company. If that broader platform thesis stalls, the multiple
              support weakens quickly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
