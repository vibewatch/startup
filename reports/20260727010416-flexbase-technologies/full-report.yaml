              Public customer-scale evidence is positive but imprecise. TechCrunch said in March 2025 that Flex served
              thousands of businesses and named several representative accounts. By December 2025, the company said
              customers were using an average of four or more products, which implies more than shallow trial behavior.
              By July 2026, several public reports described the customer base only as a few thousand, while also saying
