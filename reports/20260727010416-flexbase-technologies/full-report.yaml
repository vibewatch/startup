        title: Exhibits
        blocks:
          - type: callout
            title: Sponsor-bank exposure is still the lead risk
            body: >-
              Even if Flex itself is not the subject of public enforcement, the retained evidence shows that
              sponsor-bank oversight and partner transitions remain the most important external risk to underwriting,
              onboarding, and customer continuity.
            calloutType: risk
