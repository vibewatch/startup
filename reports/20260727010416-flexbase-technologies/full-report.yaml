      - number: '3.2'
        title: 'Direct fintech peers: Mercury, Ramp, and Brex'
        blocks:
          - type: paragraph
            body: >-
              The closest modern fintech comparators each own a different wedge. Mercury leads with startup-oriented
              business banking, fast card issuance, AP-style workflows, and treasury cash management. Ramp leads with
              spend, accounts payable, procurement, travel, and accounting automation; its marketing emphasizes
              efficiency, speed of implementation, and department-level policy enforcement. Brex sits closest to a
              full-suite benchmark, combining checking, treasury, cards, payments, and software layers under a more
              enterprise-finance framing than an owner-life framing. Flex’s own alternative page argues that Ramp and
              Brex are still parts of a stack while Flex wants to be the stack, especially once accounts receivable,
              capital, and personal visibility are included. That is plausible, but the peer pages also show how strong
              these rivals already are: Mercury claims 300,000+ users and $20 billion+ of monthly transaction volume,
              Ramp claims 70,000+ businesses and a 30-day implementation promise, and Brex now sits inside a Capital
              One-controlled structure with multiple card issuers and a broader treasury architecture. Flex is therefore
              not competing with lightweights; it is trying to out-integrate companies that already have scale and deep
              product adjacency.
