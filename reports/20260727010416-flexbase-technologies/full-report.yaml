            body: >-
              The public retention story is mostly inferred from product depth rather than disclosed metrics. Flex has
              not published GRR, NRR, churn, cohort retention, average contract duration, or satisfaction scores that
              would let investors benchmark customer durability in a conventional SaaS or payments framework. The best
              retained proxy is product expansion: average products per customer exceeded four by December 2025, and the
              company’s whole strategy assumes that once customers trust Flex with one workflow they will add more of
              banking, payments, capital, and owner finance. That could create meaningful switching costs. It could also
              mask concentration risk if a relatively small group of high-volume accounts drives outsized throughput.
              Public sources do not reveal top-customer dependence, vertical concentration by revenue, or channel
              concentration by acquisition source. The right conclusion is that Flex’s customer base may be sticky if
              the operating-system thesis works, but current public evidence is not yet enough to separate true durable
