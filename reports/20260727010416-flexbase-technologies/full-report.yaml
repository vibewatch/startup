  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the status-quo stack
        blocks:
          - type: paragraph
            body: >-
              Flex’s market is best understood as a workflow boundary problem rather than a classic banking segment. The
              company is not serving every SMB, every middle-market company, or every wealthy individual. Its own
              positioning materials describe a closely held owner with multiple entities, mixed personal and business
              obligations, and too little internal finance capacity for the complexity they manage. That places the
              buyer between small-business point solutions and enterprise systems. The status quo is therefore not one
              incumbent but a stack: bank accounts, card products, AP tools, spreadsheets, accountants, ERP fragments,
              and a growing set of treasury and credit relationships. Flex’s own finance-stack and “overlooked customer”
              materials help define the unmet need: owners want cash visibility, entity coordination, payment execution,
              and credit access in one system. The market boundary matters because any TAM that starts with all SMBs or
              all private-bank clients will overstate the practical opportunity; the real segment is the owner whose
              business complexity outgrew basic tools but has not yet justified a corporate treasury organization.
