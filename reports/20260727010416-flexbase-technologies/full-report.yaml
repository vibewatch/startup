      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Three structural drivers make the segment more attractive now than a few years ago: digital finance
              infrastructure is more modular, owner workflows are under pressure to globalize, and stablecoin-based
              settlement is becoming more credible as a behind-the-scenes rail. Federal Reserve analysis documents why
              cross-border payments remain slow, opaque, and expensive, especially for smaller institutions that must
              rely on correspondent chains. Deloitte and other payments analysis then show why stablecoins are drawing
              attention: merchants already absorb payment costs above 2% in many cases, while card networks and hybrid
              interfaces can hide crypto complexity from end users. At the same time, the adoption barriers are real.
              Stablecoin acceptance still requires POS, accounting, tax, and compliance work; sponsor-bank and
              regulatory oversight remain binding; and the target segment itself is heterogeneous across construction,
              wholesale, professional services, and multinational operators. The market is therefore attractive because
              the pain is genuine and the infrastructure is improving, but it is not frictionless. Flex has a credible
              wedge into this demand, yet it must still prove that a rebundled owner-finance stack can scale across many
              verticals without becoming operationally heavy or regulation-bound.
