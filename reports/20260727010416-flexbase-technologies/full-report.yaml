              - CV018
              - CV019
              - CV020
      - number: '8.3'
        title: Bull, base, and bear valuation logic
        blocks:
          - type: paragraph
            body: >-
              Scenario framing is more useful than a single-point target because so much of the Flex case depends on
              path quality, not just top-line growth. The bull case assumes that Flex converts its current payments and
              run-rate momentum into broad multi-product adoption, proves loss discipline in credit, and exits the
              current partner-heavy growth phase without a regulatory or operational reset. The base case assumes strong
              but slowing growth with mixed evidence quality, enough to preserve a respectable but not elite growth
              multiple. The bear case assumes that one or more weak links—losses, partner instability, concentration, or
              support burden—forces investors to re-rate the company as a more ordinary fintech lender-payments hybrid.
              Those outcomes produce a wide range because the current price already embeds future platform value, not
              just current revenue. In other words, Flex does not need to fail to disappoint; it only needs to prove
              narrower than the full operating-system narrative currently implies.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV031
              - CV032
              - CV033
              - CV034
