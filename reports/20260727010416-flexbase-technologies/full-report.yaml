  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Flex’s product should be understood as a workflow bundle for owner-operators rather than as a discrete
              card or banking app. The homepage and product pages now present the platform as one environment for moving
              money, spending it, getting paid, funding gaps, and monitoring business health. The portfolio includes
              business banking, a business card with net-60 framing, global payments, invoicing, bill-pay and AP
              tooling, revenue-based financing, AI Inbox for invoice orchestration, and Beacon or owner-intelligence
              layers. This matters strategically because the company is not merely adding adjacent SKUs for
              merchandising reasons; it is building a data-rich operating loop in which cards, bank flows, payables,
              receivables, and credit events inform one another. The buyer experience Flex is aiming for is simple: one
              owner can approve payments, track cash, issue cards, pull capital, and receive AI-generated operating
              insight without stitching together multiple systems. The technical challenge is that each one of those
              surfaces has different compliance, integration, and support demands even if the front-end story feels
              unified.
