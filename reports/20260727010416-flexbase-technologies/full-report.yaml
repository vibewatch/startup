      - number: '8.4'
        title: Comparable-set read-through
        blocks:
          - type: paragraph
            body: >-
              Public comparables do not give a neat answer, but they do frame the plausible envelope. Mature network and
              closed-loop leaders such as Visa, Mastercard, and American Express command massive market capitalizations
              because they pair scale with trust, durability, and clear economics. Credit-led and digital-finance
              platforms such as Capital One, PayPal, Affirm, and SoFi show that market values can still be substantial
              without network dominance, but those values depend heavily on risk discipline, funding quality, and
              revenue durability. Smaller infrastructure or issuing-adjacent names such as Shift4 and Marqeta remind
              investors that valuation compression can be severe when a fintech narrative narrows or commoditizes.
              Flex’s $1.2 billion valuation therefore looks neither absurdly high nor obviously cheap in the abstract.
              It looks like a company already priced above point-solution fintechs, but still far below category
              leaders—exactly where a premium-growth but unproven platform story should sit. The comp conclusion is that
              Flex deserves a real premium for ambition and growth, but not an unlimited one for aspiration alone.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV004
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.5'
        title: Exit readiness, diligence asks, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              Flex is not at a stage where a valuation decision should rest on narrative confidence alone. The company
              has enough public momentum to justify serious interest, but not enough disclosed underwriting detail to
              remove price sensitivity. The most important next-step diligence items are not cosmetic. Investors need
              product-level revenue composition, cohort economics, credit-vintage performance, funding-covenant detail,
              partner-migration clarity, concentration by customer decile, and evidence that the broader
              operating-system stack is truly driving durable expansion instead of temporarily boosted usage. Exit
              readiness is promising in the sense that Flex now has scale signals, brand ambition, and strategic
              relevance to larger financial platforms. But exit quality will depend on whether the company becomes
              trusted infrastructure with defensible economics rather than a fast-growing, partner-dependent bundle of
              financial workflows. The thesis should break if external partners destabilize, if loss quality
              disappoints, or if multi-product expansion proves shallower than current headlines imply.
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV039
              - CV040
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV011
              - CV012
              - CV019
              - CV042
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat the round as premium, not cheap
            body: >-
              Flex’s current price can be justified by real growth and platform breadth, but only if investors believe
              the company is becoming a durable owner-finance system rather than a narrower payments-and-credit bundle.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV038
          - type: callout
            title: Opaque economics are the main valuation discount
            body: >-
              The largest drag on conviction is not lack of growth but lack of public disclosure on profitability,
              losses, and concentration.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV042
          - type: callout
            title: The upside is strategic relevance
            body: >-
              If Flex proves true wallet-share depth across owner workflows, its valuation ceiling is far above today’s
              price; if not, the market can quickly re-rate it toward more ordinary fintech bands.
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV033
              - CV034
