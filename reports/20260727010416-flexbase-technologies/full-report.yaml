      - number: '4.3'
        title: Cost structure, unit economics, and working-capital realities
        blocks:
          - type: paragraph
            body: >-
              Flex’s public narrative suggests a business that could eventually become economically attractive, but only
              after navigating the cost burdens inherent to payments, underwriting, support, and partner-bank
              compliance. The company repeatedly markets AI as a way to lower operating cost: Portage described AI
              agents across underwriting, expense workflows, payment workflows, cash management, and ERP tasks, while
              Beacon and AI Inbox pitch automation layers on top of human finance work. That may improve service
              leverage over time, but the current model still looks working-capital and partner-intensive. Credit
              products require external facilities, cross-border flows require correspondent or settlement
              infrastructure, and bank-partner compliance creates ongoing overhead regardless of product automation. The
              best public unit-economics clues are indirect: average products per customer exceeded four by December
              2025, average customer revenue was said to be about $25 million, and the company’s growth story depends on
              deeper wallet share from the same owner. That supports the idea that Flex wants strong revenue per logo
              and better acquisition efficiency through cross-sell, but public evidence still does not disclose take
              rate, CAC, payback, default loss rates, servicing cost, gross margin, or the working-capital cycle behind
              its capital products.
