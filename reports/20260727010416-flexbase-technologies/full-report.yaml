              settlement, custody, and compliance. That is not unusual for fintech, but it matters for diligence because
              operational quality is partially a coordination problem. The strongest public message is that Flex knows
              trust is essential and is trying to abstract complexity without ignoring it. The open question is whether
              the company’s compliance, partner-management, and incident-handling maturity is already strong enough for
