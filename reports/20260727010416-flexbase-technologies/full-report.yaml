  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Flex’s public revenue model is broader than a card-only or software-only story. TechCrunch reported in
              March 2025 that Flex primarily made money from transaction and interchange fees tied to cards and bill
              pay, plus deposit-product economics, while the personal platform used a subscription membership. Since
              then, official company pages have expanded the monetization surface: pricing shows international wires
              with a 1% currency fee, card pages market net-60 cash-flow value, invoicing and AI Inbox point to
              software-adjacent workflow capture, and multiple official financing posts frame Flex as a full stack
              across banking, payments, expense management, working capital, and ERP-like tooling. The financial
              implication is that Flex is trying to compound several revenue streams from the same customer
              relationship: payments margin, card interchange, credit economics, deposit or treasury value, and
              eventually workflow or premium-subscription revenue. That blend can be attractive because it raises
              revenue per customer and creates cross-sell leverage, but it also makes public revenue-recognition and
              gross-margin analysis harder because the business mixes software-like, payment-like, and credit-like
              economics in one stack.
