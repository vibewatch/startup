          - type: callout
            title: Underwrite quantitative controls, not just narrative mitigations
            body: >-
              The next diligence step should focus on loss, fraud, uptime, partner-migration, and concentration data
              because public mitigants are still much more structural than measured.
            calloutType: recommendation
            claimRefs:
