            body: >-
              Public trust controls are visible, but they also highlight how dependent the product remains on regulated
              partners. Flex’s card and legal pages emphasize FDIC-linked partner banking, regulated partners, fraud
              monitoring, SOC 2 compliance, and device or credential protection. The Thread agreement and newer legal
              disclosures show that partner-bank arrangements can vary by product or change over time. Visa, Mastercard,
              Column, Lead Bank, and Thread all illustrate the same point from different angles: modern finance software
