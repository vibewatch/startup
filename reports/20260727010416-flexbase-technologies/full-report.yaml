      - number: '1.4'
        title: Milestones, adverse signals, and what later chapters should treat cautiously
        blocks:
          - type: paragraph
            body: >-
              The milestone trail shows a company that has expanded quickly from an owner-credit wedge into a broader
              cross-border finance and AI story, but it also contains contradictions that later chapters should preserve
              rather than smooth away. TechCrunch says Flex was officially formed in 2022 and emerged from stealth in
              September 2023, while Refresh Miami says Rahman founded Flex with Hadi Solh in 2020. Those two facts can
              coexist if 2020 reflects operating genesis and 2022 reflects formal company formation, but the exact
              legal-incorporation history still needs documentary confirmation. Product milestones are clearer: the
              business credit card and expense tooling came first, then broader banking and payments, then Beacon owner
              intelligence, then the December 2025 Flex Elite announcement, and finally the July 2026 Flex Global
              launch. The main adverse signal is not a disclosed company scandal but model sensitivity: Thread Bank’s
              2024 FDIC consent order and the continuing need for sweep, issuing, and banking partners show that
              sponsor-bank oversight remains a real operating dependency for any fintech trying to look and feel like a
              private bank without owning a charter.
