              than maximizing raw logo count. The benefit of that strategy is stronger monetization per account. The
              drawback is that customer count alone remains too fuzzy for reliable retention or market-penetration
              analysis. Investors should therefore read current scale in terms of quality and throughput, not just
              number of logos. Later diligence should ask how many accounts are active, funded, multi-product, and
