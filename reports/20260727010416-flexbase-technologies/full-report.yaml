  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk landscape and severity view
        blocks:
          - type: paragraph
            body: >-
              Flex’s risk surface is unusually wide for a company still at a few-thousand-customer scale. It operates
              across banking, cards, cross-border payments, credit, rewards, and AI-assisted workflows, but does so
              without its own bank charter and with visible dependence on a changing set of external partners. That
              means regulatory, partner, product, and financial risks are linked rather than isolated. A sponsor-bank
              enforcement event can affect onboarding and service continuity; a partner migration can amplify customer
              confusion; credit losses can tighten funding appetite; and any data-governance failure can hurt both
              compliance and trust. The public evidence does not suggest that these risks are hypothetical. Thread
              Bank’s regulatory history, Flex’s changing public partner disclosures, and the company’s own contractual
              language around data use, uptime, and account controls all point to real residual exposure. The positive
              offset is that Flex appears conscious of these issues and is building toward a more integrated governance
              stack. The negative offset is that public mitigation evidence still lags the ambition of the operating
              model.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR024
              - CR029
              - CR036
      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The single most important risk cluster remains regulated-partner dependency. Flex’s public disclosures
              show that the product stack touches deposit accounts, cards, rewards, AI workflows, and cross-border
              flows, but the bank and program-partner picture is not fully stable in the public record. Thread Bank
              documents retained in May 2026 still reference Flexbase deposit and debit programs, while current Flex
              pages disclose Column and Lead Bank roles in other contexts. That does not prove a problem by
              itself—fintech stacks often evolve—but it does create documentation, operational, and compliance risk
              because customer promises, legal agreements, bank responsibilities, and control environments need to stay
              synchronized during change. The risk rises further because Thread Bank has already faced regulatory
              scrutiny related to third-party risk management. Flex’s own terms and privacy language also widen the
              legal surface: binding arbitration, broad data-use rights, AI-training rights, and third-party
              data-sharing permissions may all be commercially normal, but they increase sensitivity if a customer
              dispute, privacy complaint, or model-governance issue emerges. Investors should therefore underwrite Flex
              as a company with real regulatory-adjacency risk even if no public enforcement action targets Flex itself
              today.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
