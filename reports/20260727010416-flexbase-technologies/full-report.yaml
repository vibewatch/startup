      - number: '7.3'
        title: Operational, quality, and model-governance risk
        blocks:
          - type: paragraph
            body: >-
              Flex is trying to unify a large number of workflows that historically lived in separate systems: payments,
              cards, AP, AR, global accounts, rewards, underwriting, and AI coordination. That breadth is strategically
              attractive but operationally heavy. The company’s own terms explicitly disclaim uninterrupted or
              error-free operation, while the electronic-consent flow makes digital delivery and supported tooling
              prerequisites for account access. Thread’s debit-card agreement permits deactivation or cancellation
              controls typical of regulated card programs, which means customer access can be affected by partner-side
              decisions as well as Flex-side operations. Flex’s public materials also lean heavily into AI for
              underwriting, finance assistance, and decision support. That increases model-risk management demands
              around explainability, drift, fraud detection, and adverse-action consistency. The issue is not that AI is
              inherently problematic; it is that a fast-growing fintech with multiple products and partner dependencies
              needs unusually strong controls to keep product quality, compliance, and customer trust aligned while the
              stack expands.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
          - type: table
