      "id": "capital-adequacy-and-financing-dependence",
      "title": "Capital adequacy and financing dependence",
      "body": "Capital adequacy is the clearest financial strength and the clearest financial dependency in the public record. Flex has raised substantial capital in a short time: $25 million of equity plus a $200 million credit facility in March 2025, a $60 million Series B in December 2025, and a $70 million Series B1 in July 2026, bringing disclosed totals to $180 million of equity and $300 million of debt. That gives the company runway to build products and fund credit-related activity, but it also confirms that the business model is not yet self-funding in any publicly provable way. Credit facilities are not just optional balance-sheet accessories here; they are part of how card and capital products scale. The risk is that a business with strong TPV growth can still be constrained by warehouse terms, underwriting losses, sponsor-bank shifts, or regulatory friction. Public sources do not disclose cash on hand, debt covenants, facility utilization, burn, runway months, or next-round triggers. The practical verdict is that Flex looks well financed for growth, but still financially dependent on outside equity, debt, and regulated counterparties rather than on transparently disclosed internal cash generation.",
