      "id": "traction-and-public-scale-proxies",
      "title": "Traction and public scale proxies",
      "body": "Public traction evidence is strong enough to show commercial momentum even if it is not enough to model the income statement. The March 2025 TechCrunch profile said Flex had surpassed $1 billion of annualized payment volume within 18 months of launch and was growing about 25% month over month at that point. By December 2025, Portage and republished round coverage said revenue had quadrupled over the prior 12 months and annualized payments volume had tripled to $3 billion. By July 2026, the official Series B1 announcement and independent reports said annualized revenue had tripled again since December 2025, had exceeded nine figures, and annualized payments volume had crossed $10 billion. Those are meaningful scale signals because payments businesses usually need real throughput before the unit economics can support broad product expansion. The important caveat is that these are management-provided run-rate and TPV figures rather than audited financial statements, and there is still no public bridge from TPV and product penetration to recognized revenue, gross profit, or free cash flow.",
