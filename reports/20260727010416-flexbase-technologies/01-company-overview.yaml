  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Flex is a San Francisco-based fintech brand under Flexbase Technologies, Inc. that is trying to become an AI-native private bank for middle-market business owners by combining global payments, cards, banking, capital, and owner-facing AI workflows. Public evidence strongly supports the rapid 2025-2026 funding and scale narrative, but the exact founding date, customer count, board visibility, and current sponsor-bank stack remain less clean than the headline growth story."
  },
  "sections": [
    {
      "id": "identity-platform-and-legal-frame",
      "title": "Identity, platform scope, and legal operating frame",
      "body": "Flex now presents itself as a private-banking and financial-operations platform for business owners rather than as a point card or construction-finance tool. The homepage, pricing page, card page, global-payments page, and Beacon materials all describe one operating surface that spans banking, cards, payments, expense management, working capital, and owner intelligence. That breadth matters because the company is not selling one isolated financial feature; it is trying to be the control layer for an owner who moves money across entities, jurisdictions, and personal-business boundaries. The legal framing is equally important. Current official disclosures repeatedly say Flex is a financial technology company, not a bank, and recent legal surfaces cite partner-bank issuance and banking arrangements rather than a chartered Flex balance sheet. The retained source set therefore supports a strong product-scope claim, but it also makes clear that the company remains structurally dependent on partner-bank infrastructure and changing program terms.",
