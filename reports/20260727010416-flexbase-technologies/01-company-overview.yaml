    {
      "id": "funding-scale-and-stakeholders",
      "title": "Funding history, scale signals, and stakeholder dependencies",
      "body": "Flex\u2019s capital formation is much better documented than its underlying private-company economics. The March 2025 financing is well corroborated as a $25 million equity round plus a $200 million credit facility, while TechCrunch adds the most specific retained valuation point at just under $250 million. The December 2025 Series B is also solidly sourced: Portage led a $60 million equity round that brought total equity raised to $105 million and came with claims of revenue quadrupling and payments volume reaching $3 billion annualized. By July 2026, the company had added a $70 million Series B1 led by Halo Fund and was publicly discussed at a roughly $1.2 billion valuation, with total equity raised reaching $180 million and debt at $300 million. Those funding signals are strong, but they also show how central outside capital, warehouse-style credit, and partner infrastructure are to Flex\u2019s model. Public evidence still does not disclose profitability, board control, preference stack, or the exact split of debt across products and counterparties.",
