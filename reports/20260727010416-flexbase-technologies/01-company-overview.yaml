    {
      "id": "founders-leadership-and-segment",
      "title": "Founders, leadership concentration, and customer segment",
      "body": "The public narrative is heavily concentrated around founder-chief executive Zaid Rahman, and that is both a strength and a diligence caveat. Multiple 2025-2026 sources identify Rahman as the founder and CEO and consistently quote him as the architect of the category thesis: owners with intertwined business and personal financial lives need one platform, not a patchwork of tools. Refresh Miami and later coverage also identify Hadi Solh as co-founder, while TechCrunch ties the company\u2019s earliest product motion to construction and to a broader pivot away from a more niche Flexbase construction-platform identity. The target segment is now narrower and more lucrative than generic SMB banking. Flex says it serves high-net-worth middle-market business owners, commonly those with roughly $3 million to $100 million of annual revenue, and it repeatedly frames them as a large, underserved cohort that traditional consumer banking, enterprise fintech, and legacy private banks all miss. The external record does not yet expose a full current executive roster or board map, so key-person dependence still looks high.",
