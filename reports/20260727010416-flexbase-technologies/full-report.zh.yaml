              公开的牵引力证据足以说明商业动能强劲，只是还不足以支撑对利润表建模。TechCrunch 在 2025 年 3 月的报道称，Flex 上线 18 个月内年化支付量已突破 10 亿美元，当时环比月增速约 25%。到
              2025 年 12 月，Portage 及转载的融资报道称，过去 12 个月营收翻了两番，年化支付量增至三倍、达到 30 亿美元。到 2026 年 7 月，官方 B1 轮公告及独立报道称，年化营收自 2025 年
              12 月起再度翻三倍、突破九位数，年化支付量突破 100
              亿美元。这些都是有意义的规模信号，因为支付类业务通常需要真实的交易吞吐量，才能支撑起后续更广泛的产品扩张。需要提醒的是，这些都是管理层给出的运行率和支付总量口径，并非经审计的财务报表，公开渠道目前仍找不到从支付总量、产品渗透率到确认收入、毛利或自由现金流之间的桥接数据。
