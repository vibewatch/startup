      - number: '3.3'
        title: 传统银行与高端信用卡品牌
        blocks:
          - type: paragraph
            body: >-
              传统银行和高端信用卡品牌的竞争方式与金融科技工具栈不同。J.P. Morgan Private Bank 卖的是高触点服务、投资建议、雄厚的资产负债表、网络安全投入和网点渠道。Bank of America
              能把企业银行、卡片、贷款和私人银行能力，整合在受监管的银行牌照之下。American Express
              仍是一个重要的对比对象，因为许多富裕的经营者即便用其他工具来处理应付账款或现金管理，也会拿高端卡体验、积分权益、旅行福利和员工卡的实用性来对标
              AmEx。这些老牌机构在工作流自动化上看起来往往不如金融科技对手精致，但它们有 Flex 目前还难以复制的优势：持牌的资产负债表、长期积累的信任、顾问网络和品牌声望。这一点很重要，因为 Flex
              想服务的是企业与个人财务纠缠在一起的业主，这些买家可能同样在意「感觉上安全、有身份」，不只是应付账款自动化。因此，老牌机构给 Flex
              施加的压力，不是逐项功能对拼，而是当业主想要把财富管理、信贷、存款和服务都装进一个受监管机构时，提供一个值得信赖的默认选项。
