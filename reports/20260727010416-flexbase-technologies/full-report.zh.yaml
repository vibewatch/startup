            body: >-
              公开的客户规模证据是积极的，但不够精确。TechCrunch 在 2025 年 3 月称 Flex 服务着数千家企业，并列举了几个代表性账户。到 2025 年 12
              月，公司称客户平均使用四个以上的产品，这意味着已经超出浅层试用行为。到 2026 年 7 月，多篇公开报道仅把客户基础描述为「数千家」，同时称业务已跨过 100
              亿美元年化支付量和九位数营收运行率的门槛。这种组合暗示，Flex
              可能更倾向于优先服务体量相对较大、交易吞吐量高的客户，而不是一味追求客户数量。这一策略的好处是单账户变现更强，缺点是仅凭客户数量本身仍太模糊，不足以支撑可靠的留存或市场渗透分析。因此，投资者应该从质量和吞吐量的角度解读当前规模，而不只是看客户数量。后续尽调应追问有多少账户是活跃、已注资、多产品且深度参与的，而不能只依赖「数千家」这一笼统说法。
