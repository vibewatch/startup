      - number: '4.3'
        title: 成本结构、单位经济性与营运资金现实
        blocks:
          - type: paragraph
            body: >-
              Flex 的公开叙事暗示这可能是一个最终能变得经济上有吸引力的生意，但前提是先扛过支付、承销、客服和合作银行合规带来的固有成本负担。公司反复把 AI 作为降低运营成本的方式来营销：Portage
              描述了覆盖承销、费用工作流、支付工作流、现金管理和 ERP 任务的 AI Agent，Beacon 和 AI Inbox
              则把自动化层叠加在人工财务工作之上。这可能会随时间提升服务效率，但当前模式看起来仍然高度依赖营运资金和合作方：信贷产品需要外部信贷额度，跨境资金流动需要代理行或结算基础设施，银行合作方合规又会带来持续的运营负担，不因产品自动化而消失。目前最好的间接单位经济性线索是：截至
              2025 年 12 月，人均产品数超过 4 个，平均客户营收约为 2500 万美元，公司的增长故事也依赖于从同一批业主身上挖出更深的钱包份额。这支持了 Flex
              想通过交叉销售来提升单客户收入、改善获客效率的判断，但公开证据仍未披露抽佣比例、获客成本（CAC）、回本周期、坏账损失率、服务成本，或其信贷产品背后的营运资金周期。
