  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Flex 似乎先靠切中急迫的财务痛点打入客户,再逐步扩展到企业主层面更广泛的运营管控。
    data:
      items:
        - label: 起点分散
          detail: 企业主要同时应付多张卡、多家银行、会计、表格和供应商付款工具,缺乏统一可视化。
          tone: neutral
        - label: 初始切入点采用
          detail: 客户先为卡支出、现金流时序、银行业务或全球支付而采用 Flex。
          tone: positive
        - label: 工作流扩展
          detail: 随着信任加深,客户增加应付账款、开票、审批或资金产品。
          tone: positive
        - label: 企业主层面协同
          detail: 企业与个人规划在一个统一系统里变得更加可见。
          tone: positive
        - label: 潜在锁定或流失抉择
          detail: 留存与否,取决于更广的产品栈能否真正减负,而不是增加实施上的复杂度。
          tone: warning
    claimRefs:
