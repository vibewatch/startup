      - number: '2.2'
        title: 测算口径与可触达人群
        blocks:
          - type: paragraph
            body: >-
              现有的市场资料支持一个规模可观、但对定义高度敏感的机会。美国商会和 RSM 把中型市场定义为占全部就业的三分之一、占 GDP 的 40%，而 RSM 在 2026 年重新划定的口径，把该细分市场扩大到年营收
              3000 万至 100 亿美元的企业，共计 12.5 万家，雇佣 5000 万人。KeyBank 沿用 NCMM 式的定义，采用更低的营收区间（1000 万至 10 亿美元），得出约 20 万家企业、雇佣
              4800 万美国人的规模。Flex 自己给出的目标客群口径更为宽泛——美国约 35 万位业主、全球约 300
              万位——因为它以业主的经营复杂度为中心，而不是以某个标准营收区间为界。这些数字彼此并不能直接互换，但都指向一个有用的结论：底层的经济体量足够大，值得重视，但具体可触达的客群，取决于买家的定义是基于公司营收、股权结构、跨境需求，还是运营复杂度。这正是为什么恰当的市场判断应是一组带约束条件的口径区间，而不是一个孤立而夸张的
              TAM 标题数字。
