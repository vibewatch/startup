      - number: '4.5'
        title: 财务判断与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个积极但不完整的财务判断。正面看，Flex 拥有真实的交易吞吐量、多产品变现潜力，以及对一家年轻金融科技公司而言异常快的头部增速——年化支付量从 10 亿美元到 30 亿美元再到 100
              亿美元的递进令人印象深刻，到 2026
              年年中营收运行率跃升至九位数亦是如此。负面看，几乎所有对承销至关重要的问题在公开层面都还没有答案：收入确认结构、毛利率、按产品拆分的贡献利润、信贷损失、欺诈损失、烧钱速度、信贷额度条款、现金跑道，以及客户队列的持久度。这意味着，如果产品捆绑、交易速度和搭售率能够维持，本章可以合理地认为
              Flex
              具备良好的收入质量前景，但目前还不能断言公司已经证明了软件级的利润率或独立于外部融资的能力。因此，恰当的尽调姿态不是不信任，而是保持严谨：在为公司当前估值背书、或假设支付量增长自然会转化为持久企业价值之前，应向管理层索要队列层面的经济数据、信贷额度细节、损失率历史，以及一份现金流桥接表。
