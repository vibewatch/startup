  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              理解 Flex
              的产品，应把它当成面向业主经营者的一套工作流组合，而不是一张卡或一个银行应用。首页和产品页如今把平台呈现为一个统一环境：资金调度、支出、收款、补足资金缺口、监控经营状况全都在其中。产品组合包括企业银行、带
              net-60 框架的商业卡、全球支付、开票、账单支付与应付账款工具、基于营收的融资、用于发票编排的 AI Inbox，以及 Beacon
              业主智能层。这在战略上很关键，因为公司并不是出于产品营销考虑随意添加相邻功能，而是在搭建一个数据密集的运营闭环：卡片、银行资金流、应付账款、应收账款和信贷事件彼此互为输入。Flex
              想要达成的买家体验很简单：一位业主就能审批付款、追踪现金、发卡、提取资金，并获取 AI
              生成的经营洞察，无需拼接多个系统。技术上的挑战在于，即便前端叙事看起来是统一的，每一个业务面在合规、集成和支持上的要求都各不相同。
