        title: 身份定位、平台范围与法律运营框架
        blocks:
          - type: paragraph
            body: >-
              Flex 如今把自己定位为面向企业主的私人银行与财务运营平台，而不是一款单点信用卡或建筑业融资工具。首页、定价页、卡片页、全球支付页和 Beacon
              相关材料共同描绘出一个覆盖银行、卡片、支付、费用管理、营运资金和业主智能的统一运营界面。这种广度很关键：公司卖的不是某个孤立的金融功能，而是想成为业主跨主体、跨司法辖区、跨越个人与企业边界调度资金的控制层。法律层面的措辞同样重要——官方披露反复强调
              Flex 是一家金融科技公司，不是银行；近期的法律材料也只提到合作银行的发卡与银行安排，而非 Flex
