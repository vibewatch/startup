  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户是谁
        blocks:
          - type: paragraph
            body: >-
              定义 Flex
              的客户，最恰当的方式是看运营复杂度和股权结构，而不是单看「创业公司」身份或企业规模。在自家产品和思想领导力类页面中，公司反复描述的是这样一类业主：经营一家盈利、紧密持股的企业，企业与个人事务纠缠在一起，拥有多个经营主体，且内部财务能力跟不上他们所面对的复杂度。这与公开的融资报道一致，后者把目标客户定位在年营收大致
              300 万至 1 亿美元之间，并突出建筑、批发和跨国经营等行业。官方页面还进一步强化了这一点：买家往往是业主本人，而不是一个人手齐备的财务部门。这一点很重要，因为产品采用和留存最终取决于 Flex
              是否真的减轻了业主的负担，而不只是又提供了一个支付工具。对尽调而言，这意味着 Flex 最匹配的客户可能价值很高，但客群相对狭窄，服务起来也颇费运营功夫。
