      - number: '8.4'
        title: 可比公司组的解读
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给不出一个干净的答案，但能框出一个合理区间。成熟的网络型和闭环型龙头，比如 Visa、Mastercard 和 American Express，市值巨大，因为它们把
              规模、信任、持久性和清晰的盈利模式绑在了一起。以信贷为主的数字金融平台，比如 Capital One、PayPal、Affirm 和 SoFi 说明，没有网络垄断地位，市值也能
              做得很大，但这些估值高度依赖风控纪律、资金质量和收入的持久性。规模更小的基础设施或发卡相关公司，比如 Shift4 和 Marqeta，提醒投资人一旦金融科技叙事 变窄或走向商品化，估值压缩可以很剧烈。所以
              Flex 的 12 亿美元估值，单看数字既不算离谱地高，也不算明显便宜。它看起来像是一家定价已经高于单点金融科技
              工具、但仍远低于品类龙头的公司——这恰好是溢价增长但尚未证实的平台故事应该待的位置。可比公司给出的结论是：Flex 的野心和增长值得给真实的溢价，但光凭 愿景，撑不起无限的溢价。
