  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现有工具栈
        blocks:
          - type: paragraph
            body: >-
              理解 Flex
              的市场，更适合把它当成一个「工作流边界」问题，而不是一个经典的银行细分市场。公司服务的不是所有中小企业、所有中型市场公司或所有富裕个人，其自身的定位材料描述的是一类紧密持股的业主：拥有多个经营主体、个人与企业事务纠缠、内部财务能力跟不上其经营复杂度。这把买家定位在小企业单点方案与企业级系统之间。因此，现状不是某一个巨头对手，而是一整套拼凑的工具栈：银行账户、卡片产品、应付账款工具、电子表格、会计师，以及零散的
              ERP 模块和日渐增多的资金与信贷关系。Flex
              自己的「财务工具栈」和「被忽视的客户」类材料，帮忙界定了这个未被满足的需求：业主想要现金可视性、多主体协同、支付执行和信贷渠道一把抓。市场边界之所以重要，是因为任何从「所有中小企业」或「所有私人银行客户」起步计算的
              TAM 都会高估实际机会；真正的细分市场，是那些业务复杂度已经超出基础工具能力、但还没到设立企业司库部门那个门槛的业主。
