      - number: '8.3'
        title: 牛市、基准与熊市估值逻辑
        blocks:
          - type: paragraph
            body: >-
              用场景框架比给单一估值目标更有用，因为 Flex 这个案例的核心变量是路径质量，不只是收入增速。牛市情景假设 Flex 能把当前的支付量和收入增速势头，转化成
              大范围的多产品采用，在信贷上证明有损失纪律，并在不发生监管或运营重置的情况下，走出目前这个高度依赖合作方的增长阶段。基准情景假设增长强劲但在放缓，
              证据质量参差，足够撑住一个体面但不算顶级的增长倍数。熊市情景假设损失、合作方不稳定、集中度或客服负担这几个薄弱环节中，有一个或多个逼着投资人把公司
              重新划归为更普通的金融科技借贷—支付混合体。这几种结果之间的区间之所以这么宽，是因为当前价格已经把未来平台价值算进去了，不只是当下收入。换句话说， Flex
              不需要真的失败才算让人失望——只要它证明自己比现在这套操作系统叙事所暗示的更窄，就够了。
