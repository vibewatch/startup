  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Flex 真正的对手是谁
        blocks:
          - type: paragraph
            body: >-
              Flex 的竞争范围比「为业主打造的 Brex」这种简化说法要宽得多。它自己的对比材料把公司摆在 Ramp 和 Brex 对面，但现有市场与产品证据显示，至少有五类相关阵营：Mercury
              这样的创业公司银行平台、Ramp 这样的支出管理与采购平台、Brex 这样更广义的现代金融套件、American Express 这样的高端信用卡与积分品牌，以及 J.P. Morgan Private Bank
              和 Bank of America 这样的传统私人银行或商业银行。这些产品之间只是部分重叠，这恰恰是 Flex 看到机会的地方：面临多主体、跨境和个人—企业协同问题的业主，往往要拼凑好几款产品，才能凑出 Flex
              想要用一个系统实现的效果。这在实践中意味着，Flex 很少直接取代某一个庞然大物式的老玩家，它通常对抗的是一堆工具加一家关系银行的组合，必须证明深度集成比各自最强的单点方案更有价值。
