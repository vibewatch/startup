      - number: '5.5'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              公开的信任控制措施是看得见的，但也恰恰说明产品仍在多大程度上依赖受监管的合作方。Flex 的卡片页和法律页面强调与 FDIC 相关的合作银行发卡、受监管合作方、欺诈监测、SOC 2
              合规，以及设备或凭证保护。Thread 的协议和更新的法律披露显示，合作银行安排会因产品不同而不同，也会随时间变化。Visa、Mastercard、Column、Lead Bank 和 Thread
              从不同角度说明了同一个道理：现代金融软件可以看起来像一个无缝产品，实际上在发卡、结算、托管和合规上跨越了多个机构层级。这在金融科技行业并不罕见，但对尽调而言很重要，因为运营质量在一定程度上是一个协调问题。目前最明确的公开信息是，Flex
              知道信任至关重要，并在努力把复杂性抽象掉，而不是回避它。悬而未决的问题是，公司当前的合规、合作方管理和事件处理能力，是否已经足以支撑其现在宣传的全球化、多产品版图。
