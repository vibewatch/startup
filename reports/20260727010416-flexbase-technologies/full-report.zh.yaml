      claimRefs:
        - CO052
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >
    Flex 向业主主导型企业销售一套统一的财务运营平台：Visa/Mastercard 商业卡（net-60，60 天内 0 利息）、多币种全球支付、企业银行（存款账户由 Column N.A. 提供）、营运资金与发票融资（Bill
    Pay Later）、应付/应收账款流程自动化、费用管理，以及 Beacon 每周 AI 业主智能报告。核心平台对外宣传为免费使用，营收来自刷卡手续费、外汇价差、信贷业务收益和存款利息。
  customerFocus: |
    目标客户是年营收约 300 万至 1 亿美元的高净值中型市场企业主，涵盖建筑、批发和跨国经营等行业。Flex 估计全球这类业主群体约有 300 万人。
  businessModel: |
    营收来自卡片刷卡手续费、跨境交易 1% 的外汇手续费、营运资金产品（Bill Pay Later、net-60）的信贷收益、存款利差，以及个人版平台的订阅费。核心商业平台免费开放，用于获客。
