            body: >-
              公开的留存情况，大多要从产品深度而不是已披露指标里推断。Flex 并未公布 GRR、NRR、流失率、队列留存、平均合同期限或满意度分数，投资者无法用常规 SaaS
              或支付业务的框架去对标客户的持久度。目前最可靠的替代指标是产品扩张：截至 2025 年 12 月，人均产品数已超过四个，公司整体战略也假定客户一旦在某个工作流上信任
              Flex，就会逐步增加使用银行、支付、资金和业主财务方面的更多产品。这可能带来实实在在的转换成本，但也可能掩盖一种集中度风险——如果实际上是相对少数的大额账户，撑起了这部分超额的交易吞吐量。公开资料没有披露头部客户依赖度、按营收计的垂直行业集中度，或按获客渠道计的渠道集中度。合理的结论是：如果这套「操作系统」命题真的成立，Flex
              的客户基础可能具有很强的粘性，但目前的公开证据还不足以区分真正持久的多产品采用，和集中在少数重度用户身上的早期热情。
