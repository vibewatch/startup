        title: 合作方、团队与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              合作方和资金依赖会直接变成公司层面的执行风险。Flex 的存款、支付、卡片和跨境体验都靠 Thread、Airwallex、Column、Lead Bank 和 Mastercard 相关清算轨道
              这些第三方支撑。Airwallex 的关联账户条款把这种依赖说得很具体：平台方可以作为授权用户操作账户，数据可以在交易对手之间共享，指令也可以在没有客户单独确认 的情况下被执行。这类架构能跑得通，但也会带出
              Flex 自己控制不了的故障传导路径。财务上，相对披露的股权规模，公司的融资结构明显偏重债务，也没有公开损失率、
              欺诈率或盈利指标，让投资人无法有信心地评估信贷质量。公开记录显示，这是一家创始人主导、招人速度很快、同时铺开一条很宽产品线的组织。这种组合可以很有力量，
