  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入运行率大幅提升，合作伙伴架构趋于稳定，信贷质量表现良好，Flex 真正成长为企业主金融平台。
        - 示例估值区间为 $2.4B-$3.0B；以 $1.2B 进场计算，稀释前约为 2.0x-2.5x。
        - 执行广度、合规压力和规模化支持负担。
        - 需要持续证明产品深度，并披露更清晰的经济模型。
      - - 基准
        - 增长保持强劲但有所放缓，估值溢价延续，公开证据质量只有部分改善。
        - 示例估值区间为 $1.5B-$1.9B；以 $1.2B 进场计算，稀释前约为 1.25x-1.6x。
        - 合作伙伴、客户集中度和单位经济模型的可见度参差不齐，压制了估值倍数。
        - 与当前公开证据最为吻合。
      - - 悲观
        - 合作伙伴或信贷问题浮现，客户质量担忧上升，Flex 被重新评级为一个较窄的金融科技组合。
        - 示例估值区间为 $0.7B-$1.0B；以 $1.2B 进场计算，稀释前约为 0.6x-0.85x。
        - 亏损、发起银行不稳定，或多产品采用流于表面。
        - 亏损或合作伙伴延续性方面出现任何负面意外，都可能让公司迅速滑向这一情景。
    notes: 这些估值结果是启发式的情景区间，并非市场报价或管理层指引。
