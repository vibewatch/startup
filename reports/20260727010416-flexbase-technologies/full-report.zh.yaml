  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 增长真实、差异化明显是这一判断的支撑，但经济模型不透明、合作伙伴敏感度高，抵消了部分乐观。
    data:
      nodes:
        - id: a
          label: TPV 超 $10B，运行率达九位数
        - id: b
          label: 以业主为中心的多产品平台逻辑
        - id: c
          label: 当前估值 $1.2B
        - id: d
          label: 经济模型 / 合作伙伴不透明
        - id: e
          label: 选择性推进
        - id: f
          label: 硬性核保前需加强尽调
      edges:
        - from: a
          to: e
          label: 支撑关注度
        - from: b
          to: e
          label: 支撑溢价潜力
        - from: c
          to: f
          label: 已提前计入未来成功
        - from: d
          to: f
          label: 削弱信心
        - from: e
          to: f
          label: 把叙事转化为证据
    claimRefs:
