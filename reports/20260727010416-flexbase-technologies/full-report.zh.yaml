      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最重要的单一风险集中在受监管合作方依赖上。Flex 的公开披露显示，产品栈覆盖存款账户、卡片、返现、AI 工作流和跨境业务，但银行与项目合作方这一块，公开记录还 不完全稳定。2026 年 5 月留存的
              Thread Bank 文件仍提到 Flexbase 的存款和借记卡项目，而 Flex 当前页面在其他场景下披露的是 Column 和 Lead Bank 的角色。这本身
              不能证明有问题——金融科技的技术栈本来就常变——但客户承诺、法律协议、银行责任和控制环境要在变化中保持同步，这就带来了文档、运营和合规风险。风险还会进一步 上升，因为 Thread Bank
              此前已经因第三方风险管理受到监管审查。Flex 自己的条款和隐私政策也拉宽了法律面：强制仲裁、宽泛的数据使用权、AI 训练权和第三方数据
              共享权限，在商业上或许都算正常，但一旦客户纠纷、隐私投诉或模型治理问题出现，敏感度就会上升。因此，即便目前没有针对 Flex 本身的公开执法行动，投资人也应该把 它当作一家有真实监管邻近风险的公司来承销。
