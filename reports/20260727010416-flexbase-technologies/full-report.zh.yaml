companyProfile:
  summary: >
    Flex 是 Flexbase Technologies, Inc. 的品牌名，总部位于旧金山，定位为服务高净值中型市场企业主的 AI 原生私人银行。其平台整合了企业银行、多币种卡片、全球支付（覆盖 180 多个国家、32
    种货币）、营运资金、账单支付融资、应付账款与应收账款自动化、费用管理，以及名为 Beacon 的 AI 业主智能层。Flex 成立于 2022 年，2023 年 9 月正式上线；2026 年 7 月，Halo Fund 领投
    7000 万美元 B1 轮后估值达到 12 亿美元，累计股权融资 1.8 亿美元，另有 3 亿美元债务额度。截至 2026 年 7 月，公司年化营收运行率已达九位数，年化支付量超过 100 亿美元。
  foundedDate: '2022-01-01'
  founders:
    - name: Zaid Rahman
      role: 创始人兼首席执行官
      background: |
        Thiel Fellow（蒂尔奖学金）获得者，哥伦比亚大学肄业；创办 Flex 之前联合创立了 Volley；提出了「以业主为中心的私人银行」这一命题。
      claimRefs:
