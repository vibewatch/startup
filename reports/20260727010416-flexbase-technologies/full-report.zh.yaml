      - number: '4.4'
        title: 资本充足度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              在公开记录里，资本充足度既是最清晰的财务优势，也是最清晰的财务依赖。Flex 在短时间内融到了大量资本：2025 年 3 月 2500 万美元股权加 2 亿美元信贷额度，2025 年 12 月 6000 万美元
              B 轮，2026 年 7 月 7000 万美元 B1 轮，使已披露的累计总额达到 1.8 亿美元股权和 3
              亿美元债务。这给了公司足够的跑道去建设产品并为信贷相关业务提供资金，但也证实这套商业模式在任何可公开验证的意义上都还没有实现自我造血。信贷额度在这里不只是可选的资产负债表配件，而是卡片和资金类产品能否扩张的关键组成部分。风险在于，一家支付量增速强劲的公司，仍可能被仓库额度条款、承销损失、合作银行变动或监管摩擦所制约。公开资料未披露现金余额、债务契约、额度使用率、烧钱速度、跑道月数，或下一轮融资的触发条件。实际结论是，Flex
              在增长层面看起来资本充裕，但在财务上仍依赖外部股权、债务和受监管的交易对手，而不是透明可查的内部现金生成能力。
