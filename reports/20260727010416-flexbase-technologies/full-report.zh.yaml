  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心水平与估值立场
        blocks:
          - type: paragraph
            body: >-
              Flex 的投资故事足够吸引人，让人保持关注，但还不够干净，不足以在没有进一步尽调的情况下就大举承销。公开信息显示，公司年化支付量已经突破 100 亿美元，收入 年化跑到九位数，估值也从 2025
              年末上一轮翻倍，到 2026 年 7 月达到 12 亿美元。这些都是有力的证据点。难点在于，同一份公开记录仍然没讲清楚核心经济性：
              盈利能力未披露，信贷损失表现未披露，合作方架构明显复杂，客户数精度也有限。因此正确的估值立场不是“无论什么价格都算贵”，而是“溢价、对执行敏感，值得 更严格的入场纪律”。按目前披露的价格，这笔投资最适合那些相信
              Flex 能变成高质量企业主金融平台、而不只是一家增长快的卡片支付公司的投资人。如果这个更大 的平台叙事走不通，估值倍数的支撑会很快松动。
