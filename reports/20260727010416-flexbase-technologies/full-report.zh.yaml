      - CV035
      - CV036
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: Flex 的估值高度取决于投资者把它当作溢价平台核保，还是当作范围更窄的金融科技组合来核保。
    data:
      items:
        - label: 乐观情景：平台溢价
          value: 2.7
          claimRefs:
            - CV021
        - label: 基准情景：增长强劲但喜忧参半
          value: 1.7
          claimRefs:
            - CV022
        - label: 悲观情景：金融科技窄口径重新估值
          value: 0.85
          claimRefs:
            - CV023
            - CV034
      yAxis:
        label: 示意性估值（$B）
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV034
    approximationNotes: 敏感性柱状图把乐观/基准/悲观情景表转化为简单的估值标记，并非市场报价。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 基于已披露的 2026 年 7 月 $1.2B 估值背景，示意从入场到结果的区间。
    data:
      items:
        - label: 悲观结果
          low: 0.7
          high: 1
          unit: $B
          note: 亏损、合作伙伴问题或集中度风险压缩估值。
        - label: 基准结果
          low: 1.5
          high: 1.9
          unit: $B
          note: 增长保持强劲，但估值倍数支撑仍偏选择性。
        - label: 乐观结果
          low: 2.4
          high: 3
          unit: $B
          note: Flex 证明平台质量与溢价的持久性。
    claimRefs:
      - CV021
      - CV022
      - CV023
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 面向投委会的评分卡，权衡增长证据、护城河、证据质量与价格敏感性。
    data:
      items:
        - label: 增长证据
          value: 8
          unit: /10
          note: TPV 和运行率增长真实可见。
        - label: 平台野心
          value: 8
          unit: /10
          note: 覆盖广度和以业主为中心的定位形成差异化。
        - label: 经济模型透明度
          value: 4
          unit: /10
          note: 盈利能力和亏损细节披露仍然稀少。
        - label: 合作伙伴 / 监管韧性
          value: 4
          unit: /10
          note: 合作伙伴关系复杂，估值仍需为此打折扣。
        - label: 估值吸引力
          value: 5
          unit: /10
          note: 当前价格说得过去，但容错空间不大。
        - label: 整体信心
          value: 6
          unit: /10
          note: 机会具有吸引力，信心水平中等。
    claimRefs:
      - CV005
      - CV006
      - CV011
      - CV018
      - CV036
      - CV038
