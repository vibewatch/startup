  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 论点
      - 改变判断的因素
    rows:
      - - 以企业主为中心的私人银行平台，能够在信用卡、银行业务、资本、应付账款（AP）、应收账款（AR）和跨境 支付等业务上不断做大单客户收入。
        - 若多产品采用率在早期重度用户之外趋于停滞，这一判断就站不住脚。
      - - 当前的增长速度和产品广度，相较于单点金融科技方案，足以支撑真实的估值溢价。
        - 若增长保持强劲但经济模型不佳，或合作方风险上升，溢价理应收窄。
      - - AI、审批放款速度和跨境支付，有望支撑未来差异化的利润率与留存。
        - 若 AI 更多只是增加营销话术和运营负担，而非改善单位经济模型，这一逻辑就会弱化。
      - - 这门生意可能对大型银行、发卡机构或金融科技整合者具有战略价值。
        - 若发起银行不稳定或文件披露不一致的问题持续存在，战略价值将大幅打折。
    notes: 该表权衡了当前支撑估值的因素与可能促使重新评级的因素。
