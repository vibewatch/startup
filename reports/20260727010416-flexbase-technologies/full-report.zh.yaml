      - number: '2.4'
        title: 增长驱动因素与采用制约
        blocks:
          - type: paragraph
            body: >-
              三个结构性因素，使这个细分市场比几年前更具吸引力：数字金融基础设施更加模块化，业主的工作流被迫走向全球化，稳定币结算作为后台支付通道正变得更可信。美联储的分析记录了跨境支付为何依然缓慢、不透明且成本高昂，对于依赖代理行链路的中小机构尤其如此。德勤等支付相关分析随后说明了稳定币为何吸引关注：商户在很多情况下已经承担超过
              2% 的支付成本，而卡组织和混合式界面又能把加密货币的复杂性隐藏在终端用户看不到的地方。与此同时，采用障碍也是真实存在的：稳定币的接受度仍需要在
              POS、会计、税务和合规环节做大量工作；合作银行和监管层面的监督仍是硬约束；目标细分市场本身在建筑、批发、专业服务和跨国经营者之间也高度分化。因此，这个市场之所以有吸引力，是因为痛点真实存在、基础设施在改善，但过程并非毫无摩擦——Flex
              在这股需求中已握有可信的切入点，但仍需证明一套重新打包的业主财务工具栈，能否在众多垂直行业中扩张，而不会变得运营沉重或被监管束住手脚。
