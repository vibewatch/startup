      - number: '7.3'
        title: 运营、质量与模型治理风险
        blocks:
          - type: paragraph
            body: >-
              Flex 想把一大批原本分散在不同系统里的工作流整合起来：支付、卡片、应付账款、应收账款、全球账户、返现、授信和 AI 协同。这种广度在战略上很有吸引力，但在
              运营上很重。公司自己的条款明确声明不保证不中断或零差错运行，电子签约流程又把数字化交付和受支持的工具变成了账户访问的前提条件。Thread 的借记卡协议允许
              停用或取消账户，这是受监管卡项目的常规控制手段，也意味着客户能否用账户，既取决于 Flex 自身运营，也取决于合作方那一端的决定。Flex 的公开材料还大量依赖 AI
              来做授信、财务协助和决策支持，这对模型风险管理提出了更高要求，涉及可解释性、模型漂移、欺诈检测和不利决定的一致性。问题不在于 AI 本身有问题，而在于
              一家产品线多、合作方依赖重、增长又快的金融科技公司，要在扩张的同时守住产品质量、合规和客户信任，需要格外强的控制体系。
