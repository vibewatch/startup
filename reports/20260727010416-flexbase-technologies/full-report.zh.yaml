      - number: '8.6'
        title: 展示项
        blocks:
          - type: callout
            title: 把这轮融资当溢价，不要当便宜货看
            body: Flex 目前的定价可以靠真实的增长和平台广度来解释，但前提是投资人相信这家公司正在变成一套持久的企业主金融系统，而不只是一个更窄的支付加信贷拼盘。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV038
          - type: callout
            title: 经济性不透明，是估值折价的主因
            body: 拖累信心最大的因素，不是增长不够，而是盈利能力、损失和集中度都缺乏公开披露。
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV042
          - type: callout
            title: 上行空间来自战略相关性
            body: 如果 Flex 能证明自己在企业主各类工作流里真正拿到了钱包份额深度，估值天花板会远高于今天的价格；如果做不到，市场可以很快把它重新划归到更普通的金融 科技估值区间。
            calloutType: insight
            claimRefs:
              - CV014
