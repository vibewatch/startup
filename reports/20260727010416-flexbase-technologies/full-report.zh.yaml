        - 按头部客户、垂直行业和队列拆分的 TPV 和收入
        - 检验规模数字背后的可持续性。
        - 向财务 / 营收运营团队索取队列分析。
      - - 扩张的可持续性
        - 单客户 4 个以上产品背后的分布情况及队列留存
        - 验证操作系统式平台的投资逻辑。
        - 索取产品分析和留存队列数据。
    notes: 这些需求是把叙事性建议转化为经过审核定价决策所需的最小数据集。
    claimRefs:
      - CV011
      - CV012
      - CV019
      - CV042
