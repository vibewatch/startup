  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Flex 公开的收入模式，比单纯的卡片生意或纯软件生意都更宽。TechCrunch 在 2025 年 3 月的报道称，Flex
              的主要收入来自与卡片和账单支付绑定的交易与刷卡手续费，加上存款产品的经济收益，而个人版平台则采用订阅会员制。此后，官方页面进一步扩大了变现面：定价页显示国际电汇收取 1% 的货币兑换费，卡片页宣传 net-60
              现金流价值，开票和 AI Inbox 指向软件相邻工作流的收入捕获，多篇官方融资文章把 Flex 描述为覆盖银行、支付、费用管理、营运资金和类 ERP 工具的全栈产品。财务上的含义是，Flex
              想在同一个客户关系上叠加多条收入曲线：支付利润、卡片刷卡手续费、信贷业务收益、存款或司库价值，以及未来的工作流或高级订阅收入。这种组合可能很有吸引力，因为它能拉高单客户收入并创造交叉销售杠杆，但也让公开的收入确认和毛利率分析更难做，因为整个业务把软件式、支付式和信贷式的经济属性混在了同一个工具栈里。
