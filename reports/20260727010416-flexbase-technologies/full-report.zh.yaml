  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险版图与严重程度总览
        blocks:
          - type: paragraph
            body: >-
              Flex 客户规模还只有几千家，风险面却异常宽：银行、卡片、跨境支付、信贷、返现和 AI 辅助工作流全部覆盖，但公司自己没有银行牌照，还明显依赖一批不断变化的外部合作方。
              监管、合作方、产品和财务这几类风险因此绑在一起，不是各自独立。赞助银行一旦遭到监管处罚，开户和服务连续性都会受影响；合作方迁移会放大客户困惑；信贷损失会收紧资金
              方的胃口；数据治理一旦出问题，合规和信任都会受损。公开证据并不支持“这些风险只是假设”的说法——Thread Bank 的监管历史、Flex 不断变化的合作方披露，以及公司
              自己在数据使用、系统可用性和账户控制上的合同措辞，都指向真实存在的剩余风险。正面的一面是，Flex 似乎清楚这些问题，正在往更完整的治理体系上补；负面的一面是， 公开的缓释证据还跟不上其商业模式的野心。
