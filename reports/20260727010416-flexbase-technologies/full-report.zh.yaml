      - number: '8.5'
        title: 退出准备度、尽调诉求与否决触发条件
        blocks:
          - type: paragraph
            body: >-
              Flex 还没到可以只靠叙事信心就能做估值决定的阶段。公司的公开势头，足以让人认真关注，但披露的承销细节还不够，无法消除价格敏感度。接下来最重要的尽调
              事项不是走形式。投资人需要看到分产品的收入构成、客群经济性、信贷各批次表现、融资契约细节、合作方迁移的清晰度、按客户十分位的集中度，以及能证明这套
              更大的操作系统栈真的在带来持久扩张、而不是短期冲量的证据。从退出准备度看，Flex 现在有规模信号、品牌野心，也对更大的金融平台有战略价值，这一点是有
              希望的。但退出质量最终取决于公司能不能变成一套有防御性经济模型的可信基础设施，而不是一堆增长快、但依赖合作方的金融工作流拼盘。如果外部合作方变得
              不稳定，或损失质量令人失望，或多产品扩展被证明比现在的头条更浅，这个论点就该被判定失败。
