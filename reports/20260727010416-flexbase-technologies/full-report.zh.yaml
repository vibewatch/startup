      - number: '3.2'
        title: 直接的金融科技同行：Mercury、Ramp 和 Brex
        blocks:
          - type: paragraph
            body: >-
              最接近的现代金融科技对标公司，各自占据不同的切入点。Mercury 以面向创业公司的企业银行业务见长，发卡快，有应付账款式的工作流和司库现金管理。Ramp
              的强项是支出、应付账款、采购、出差和会计自动化，其营销主打效率、实施速度和部门级政策执行。Brex
              最接近一个全套基准产品，把支票账户、司库、卡片、支付和软件层整合在一起，其框架更偏企业财务，而不是业主生活场景。Flex 自己的竞品对比页认为，Ramp 和 Brex 仍只是工具栈的一部分，而 Flex
              想成为整套工具栈本身，尤其是在纳入应收账款、资金和个人财务可视性之后。这个说法有一定道理，但这些竞品对比页也说明了这些对手已经有多强：Mercury 宣称拥有 30 万以上用户和月度交易量超过 200
              亿美元；Ramp 宣称服务 7 万多家企业，并承诺 30 天完成实施；Brex 如今已并入 Capital One 控制的架构，拥有多家发卡机构和更完善的司库体系。因此 Flex
              面对的不是轻量级选手，而是要在集成深度上超越那些已经具备规模和深厚产品邻接优势的公司。
