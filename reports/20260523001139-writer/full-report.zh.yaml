  - id: TU005
    title: 扩张与集中度风险
    columns:
      - 因素
      - 细节
      - 风险水平
      - 影响
      - 尽调路径
    rows:
      - - 登陆后扩张机制
        - 部署从一个部门（营销、法务、内容）起步，靠口碑和可见 ROI 自然扩散到相邻职能；Qualcomm、Salesforce、N26、Commvault 均记录了跨职能扩张
        - 低（正向驱动因素）
        - NRR 核心驱动；账户内席位和用量增购；降低扩张收入的净 CAC
        - 索取 NRR 拆分：扩张收入 vs. 新 Logo 收入；确认扩张 ACV 与初始 ACV
      - - 平台粘性（切换成本）
        - >-
          Knowledge Graph 数据摄入、定制品牌规则、商标库、智能体工作流，以及 MS365/Google Workspace/Salesforce/HubSpot 集成把平台嵌得很深；Qualcomm 的 70
          条已定义工作流体现高切换成本
        - 低（正向驱动因素）
        - 降低流失倾向；让竞争对手替换既费资本又费时间
        - 索取合同续约率和多年期合同渗透率
      - - 客户集中度风险
        - 头部客户 ARR 贡献未知；300 家客户和约 $47M ARR 意味着平均 ACV 约 $157K，但 Uber、Vanguard、Salesforce、Qualcomm 等头部 Logo 收入权重可能更高
        - 高（未知）
        - 若前 5 大客户占 ARR >30%，任何一家流失都会形成重大收入风险
        - 索取按客户层级划分的 ARR（top-1/5/10/25）；索取 Fortune 500 账户 ARR 占比
      - - 垂直行业集中度
        - 医疗健康、金融服务和科技占具名案例研究多数；L'Oréal、Kenvue、Mars、Lennar 在 CPG / 房地产领域披露较少
        - 中
        - 医疗 / 金融监管逆风（HIPAA、FINRA、SEC）可能延缓扩张；行业下行会影响续约
        - 索取按垂直行业拆分的 ARR 和流失率；评估关键垂直行业监管变化敞口
      - - 美国地域集中度
        - 具名国际客户有限（N26、Go1、VOIS/Vodafone UK、EE、TELUS）；案例研究和 Series C 公告主要聚焦总部在美国的企业
        - 中
        - 单一市场集中限制 TAM 落地；欧盟扩张还面临汇率和数据主权风险
        - 要求披露国际 ARR 占比；评估欧盟数据驻留和 GDPR 合规深度
      - - 渠道和合作伙伴集中度
        - 分销主要靠企业直销；AWS Bedrock 合作带来云市场触达；Writer 伙伴计划 2026 年初宣布，但仍处早期
        - 中
        - 高度依赖直销，扩张会消耗资本；相较企业 AI 同行，SI / 经销商渠道仍不成熟
        - 评估 SI 合作深度（Accenture 既是客户，也可能成为经销商）；要求披露合作伙伴贡献收入占比
      - - 负面客户体验风险
        - G2 和 Gartner 上有两条 1 星评价（2025 年 7 月），称产品存在误导；多条评价提到品牌规则僵硬、质量不稳定；TrustRadius 评价称工作流变慢
        - 中
        - 企业采购中存在声誉风险；负面评价会拖慢新账户销售周期；也可能说明快速扩张期 CS 团队承压
        - 向客户成功团队索取 CSAT/NPS 数据；询问 Series C 后支持工单量趋势；调查 2025 年 7 月评价事件
    notes: |
      风险级别为截至 2026-05-23 可得证据下的定性评估。'高（未知）' 表示缺少数据，无法判断该因素的风险水平。客户集中度风险标为高（未知），因为 300+ 客户之间的 ARR 分布完全未披露。
    claimRefs:
      - CU005
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
  - id: TR001
    title: 监管 / 法律风险登记表
    enumerationScope:
      coverage: exhaustive
      basis: >
        All material regulatory and legal risk vectors identified as of 2026-05-23 for an enterprise AI platform with US
        and European customers, including GPAI model provider obligations, copyright training data exposure, data
        privacy law, sector-specific regulation (HIPAA, financial services compliance), and IP protection. Ordered by
        severity (Critical first).
    columns:
      - 规则 / 法律 / 风险
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - Writer 缓释措施
      - 剩余风险敞口
    rows:
      - - EU AI Act — GPAI 模型提供商义务（透明度、事件报告、训练数据摘要）
        - 欧盟
        - 已生效 — GPAI 义务 2025 年 8 月生效；透明度规则 2026 年 8 月生效
        - 高 — 按该法定义，Palmyra 属于 GPAI 模型
        - 严重 — 罚款最高 €30M 或全球营业额 6%；披露义务持续存在
        - ISO 42001:2023 AI 管理认证；符合 GDPR 的 DPA；AI 治理计划；欧盟 SCCs
        - 系统性风险 GPAI 门槛仍不确定；训练数据摘要披露尚未公开；2026 年 8 月 AI 内容标识截止
      - - 美国版权 — AI 训练数据合理使用不确定性（Copyright Office AI Report Part 3，2025 年 5 月）
        - 美国
        - 已生效 — Part 3 已于 2025 年 5 月预发布；相关案件诉讼仍在进行
        - 中 — 影响所有 AI 模型训练方；未发现 Writer 特定行动
        - 高 — 不利判例可能要求授权许可或重新训练模型；成本和时间不可预测
        - 全栈模型自有降低下游复现风险；Writer 产品输出不会逐字复现训练文本
        - 上游 Palmyra 预训练数据来源未公开披露；如果法院收窄合理使用，可能产生授权成本
      - - GDPR / CCPA / 数据隐私 — 跨境个人数据处理
        - 欧盟、英国、瑞士、加州、美国各州
        - 已生效 — 持续合规义务；爱尔兰 DPC 是 EEA 主管机构
        - 低-中 — Writer DPA 和数据处理做法看起来较扎实；风险在执行错误或泄露
        - 高 — GDPR 罚款最高为全球营业额 4%；CCPA 处罚；声誉受损
        - DPA 覆盖 GDPR、UK DPA 2018、FADP、CCPA；纳入 EU SCCs；EU-US/UK/Swiss DPF 自我认证；承诺不使用客户数据训练
        - 客户负责确保提交数据合规；Writer 无法评估客户数据内容
      - - HIPAA / HITECH — 企业 AI 工作流中的医疗数据
        - 美国
        - 已生效 — 适用于 Writer 医疗部署（CirrusMD、Medisolv、Vizient、SCAN）
        - 中 — Writer 作为受监管实体的 Business Associate 运营
        - 高 — HIPAA 数据泄露处罚每个违规类别每年最高 $1.9M；OCR 仍在执法
        - 年度 SOC 2 Type II 覆盖 HIPAA/HITECH 标准；可提供 BAA；ISO 27701 隐私管理
        - Palmyra Med 在临床决策支持中的输出需要人工监督；误分类责任分配尚未经过检验
      - - AI 生成内容责任 — 受监管专业输出中的错误（法律、金融、医疗）
        - 美国、欧盟、全球
        - 新兴 — 还没有直接针对企业 AI SaaS 责任的成型判例
        - 中 — 随着智能体 AI 扩大自主决策，风险在上升
        - 中高 — Writer（平台）与客户（部署方）之间的责任分配尚未经过检验
        - DPA 将内容验证责任交给客户；Writer 条款否认对 AI 输出准确性承担责任
        - 尚无专门处理 Writer 平台对幻觉专业内容承担责任的法院案件
      - - FTC 执法 — 营销中欺骗性或缺乏依据的 AI 性能宣称
        - 美国
        - 已生效 — FTC 已发布 AI 指引；相邻市场已有执法行动
        - 低-中 — Writer 营销包含量化 ROI 宣称（333% ROI、9x 回报），但公开方法有限
        - 中 — FTC 行动可能要求证明宣称、修改表述或发布纠正广告
        - Forrester TEI 报告引用 333% ROI 数字；多个具名客户案例给出量化结果
        - Balderton 公告中的 9x 平均 ROI 宣称未披露方法；Forrester TEI 可能是委托研究并存在样本选择偏差
    notes: >
      严重性评级基于截至 2026-05-23 的公开信息。未发现针对 Writer 的现行诉讼或监管执法行动。可能性评估反映重大不利事件发生概率，而不是规则是否适用。EU AI Act 的系统性风险门槛和 GPAI 分类可能随着
      AI Office 后续发布指引而变化。所有尽调路径都是投资人级别的投前尽调要求。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
  - id: TR002
    title: 运营、质量和安全风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余风险敞口
      - 未解决缺口
    rows:
      - - 受监管专业工作流中的 AI 幻觉 / 输出不准确（医疗编码、财务报告、法律起草）
        - 高 — McKinsey 2025：33% 的 AI 用户经历过不准确后果；Gartner 将幻觉列为企业 AI 首要障碍
        - 严重 — 在医疗和金融服务场景，模型错误可能让企业客户承担监管责任
        - 中 — RAG / Knowledge Graph 锚定、Palmyra 领域模型（Med、Fin）和可配置护栏能降低风险，但无法消除
        - 医疗和金融服务的智能体部署中，如果 Palmyra Med / Fin 输出影响下游决策且没有强制人工复核，风险仍在
        - 未发布面向生产企业工作流的 Palmyra 幻觉率基准；文档已确认 Palmyra 原生 API 的护栏缺口
      - - 智能体 AI 治理失效 — 自主智能体在拥有企业系统读 / 写 / 删除权限时执行未授权或错误动作
        - 中高 — Sacra 指出智能体监督尚未成熟；35% 高管无法立即停下失控智能体（Writer 2026 调研）
        - 严重 — 智能体删除、修改或外泄企业数据，会触发泄露通知并导致客户立即流失
        - 低-中 — 监督套件处于早期访问；最小权限访问控制和审计日志已存在，但部分智能体治理功能尚未 GA
        - 多系统连接器部署中，智能体跨连接器串联，权限集会叠加
        - 智能体监督套件 GA 时间未公开披露；未发布智能体部署事件报告
      - - 针对企业 AI 智能体的提示注入攻击（OWASP LLM01）
        - '中 — OWASP GenAI Security Project 将提示注入列为 LLM 应用 #1 威胁；处理外部内容的智能体攻击面高'
        - 高 — 成功提示注入可能重定向智能体动作、外泄企业数据或绕过护栏
        - 中 — 调用前输入护栏使用 AWS Bedrock Guardrails 和 Azure AI Content Safety 检测；但覆盖范围仅限外部供应商模型
        - Palmyra 原生智能体工作流无法使用外部供应商护栏；智能体处理来自未经筛查来源的用户上传文档
        - Palmyra 原生 API / SDK / Agent Builder 使用中的护栏覆盖缺口；未公开面向智能体注入攻击面的渗透测试结果
      - - 数据泄露 — Writer 平台处理的客户企业数据暴露给未授权第三方
        - 低 — Writer 拥有 SOC 2 Type II、ISO 27001、年度第三方渗透测试；未发现公开事件
        - 严重 — 医疗或金融服务企业数据暴露会触发 HIPAA/GDPR 通知、监管罚款和客户流失
        - 高 — 安全计划较成熟，静态数据 AES-256 加密、传输中 TLS 1.2+、有专门安全团队
        - 第三方集成中的剩余风险：数据跨出 Writer 安全边界流向合作伙伴 API
        - SOC 2 未公开审计报告摘要；访问时 trustcenter.writer.com 基本为空；完整安全态势可见性需要数据室权限
      - - 服务中断 / 可用性故障，影响关键企业智能体工作流
        - 低-中 — 云基础设施依赖 AWS / Azure / GCP；未发现公开正常运行时间 SLA 或状态页历史
        - 中 — 基于定时 Routines 的自动化智能体工作流依赖连续运行；计划外停机会打断流水线
        - 中 — 多云护栏架构降低单一供应商冲击半径；ISO 27001 包含可用性控制
        - 定时 Routines 上运行的自动化智能体工作流，一旦停机会造成 SLA 漏失或工作流链条不完整
        - 未公开 Writer 状态页或历史正常运行时间披露；企业 MSA 中 SLA 条款未公开
    notes: >
      可能性评级结合截至 2026-05-23 的独立证据和产品文档。未发现公开 Writer 安全事件报告。Writer 同时具备 SOC 2 Type II（含 HIPAA/HITECH）、ISO
      27001/27701/42001 认证，是企业 AI 写作平台竞争者中最完整的合规认证组合（Jasper、Copy.ai 未持有同等认证）。智能体治理成熟度缺口是已知的早期产品风险，并非 Writer 独有。
