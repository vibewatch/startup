      - number: '4.5'
        title: 展项
        blocks:
          - type: callout
            title: 40× ARR 倍数要求持续高增长验证
            body: >
              Writer 以约 40× 往绩 ARR（Sacra 估计 $47M）对应 $1.9B 估值，处在企业 AI 可比公司区间的高端。只有在 Writer 持续保持三位数 ARR 增长、在承担 LLM
              基础设施成本的同时实现 SaaS 级毛利率，并且避免被把 AI 打包进既有合同的平台在位者替代时，这一倍数才站得住。没有经审计财务报表，上述条件都无法验证，估值因此对不可验证的私有假设异常敏感。
