      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              按 MarketsandMarkets 数据，全球生成式 AI 市场 2025 年约为 $71.4B，预计到 2032 年达到 $890.6B，复合年增长率
              43.4%——这是企业软件史上最激进的扩张轨迹之一。Statista 对同一市场的估计为 2025 年 $63B（低 13%），反映其定义更窄，排除了部分 AI 基础设施成本。包含基础设施在内的更广义 AI
              市场，2025 年估计为 $371.7B，到 2032 年增至 $2.4T（CAGR 30.6%）。这些数字为任何处在 GenAI 能力与企业部署交汇处的企业 AI 平台，确立了宏观 TAM。

              在 GenAI 内，企业智能体 AI 子市场最贴近 Writer 当前产品定位；该市场从 2023 年几乎为零，增长到 2025 年估计 $6.8B，并以 47% CAGR 迈向 2030 年
              $46.0B。另一个相关子板块是检索增强生成（RAG），也是 Writer 知识平台的核心技术组件；2025 年估计为 $1.9B，到 2030 年增至 $9.9B（CAGR 38.4%）。这些子板块估计为
              Writer 的现实可服务市场提供锚点：扣除基础设施、基础模型 API 和消费端工具后，企业 GenAI 平台类别在 2025 年可能是 $20–$30B 的可寻址机会（估计方法是对整体 GenAI 市场规模应用
              30–40% 的企业层折扣）；若 CAGR 估计成立，到 2030 年可增长至 $200–$300B。

              Writer 的可获取市场（SOM）受其当前 go-to-market 覆盖限制：北美和欧洲、收入 $500M+、有多部门部署预算、且愿意把自有数据跑在第三方 AI 平台上的英语企业。鉴于 Writer 截至
              2024 年末 ARR 为 $47M、拥有约 300+ 企业客户，当前 SOM 渗透率估计低于最保守 SAM 估计的 0.5%。如果企业 AI
              支出继续按各大分析机构预测扩张，增长空间巨大。关键风险在于，超大规模云厂商的打包产品（Microsoft Copilot、Google Duet、Salesforce
              Einstein）可能在专门平台建立持久差异化之前，先吃掉大部分 SOM。

              GenAI 市场测算的长期挑战，是分析师估计差距很大。CAGR 预测从 30.6%（广义 AI 市场）到 47%（专指企业智能体 AI）不等，GenAI 整体按 MarketsandMarkets 为
              43.4%，意味着 7 年内市场约扩张 10 倍。这些预测内含企业采用速度、计算成本下降和模型能力提升等假设，而每一项都存在不确定性。BCG 在 2024 年发现，90%
              企业仍是「观察者」（尚未规模化），这让总体市场规模预测能否按分析师时间表落地，存在合理疑问。
