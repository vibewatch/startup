  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 关键依赖
      - 风险
    rows:
      - - Palmyra LLM 系列（X5、X4）
        - 支撑所有平台能力的核心推理
        - Writer 自有模型权重；在 AWS Bedrock 和内部基础设施上推理
        - 若前沿模型跃迁，模型质量可能被拉开；X5 Agent Builder 仍处于 Beta
      - - LLM Gateway
        - 通用模型路由、护栏执行、可观测性
        - 兼容 OpenAI 的 API 抽象；AWS / Azure / NVIDIA NIM 支持外部模型
        - 单一网关成为关键路径；故障转移设计未公开披露
      - - Knowledge Graph RAG
        - 为智能体回答提供有依据的检索
        - 专用图谱构建 LLM；连接 Confluence/Notion/GDrive/SharePoint 的数据连接器
        - 连接器 GA 对齐程度；向量竞争对手向图感知检索收敛
      - - MCP Gateway
        - 跨企业系统的受控智能体-工具访问
        - IdP（SSO 提供商）；连接器特定 OAuth；企业工具 API
        - GA 前连接器覆盖度；工具 API 边界上的身份校验
      - - Writer Framework（开源）
        - 基于 Python 的应用和智能体开发
        - Python 3.9+；WebSocket；pip/PyPI 分发
        - 相对 LangChain/Crew.ai 既有生态的社区采用度
      - - 护栏（AWS Bedrock / Azure AI）
        - 输入 / 输出内容安全和 PII 保护
        - AWS Bedrock Guardrails；Azure AI Content Safety（第三方依赖）
        - 没有自有第一方护栏；执行依赖云栈
      - - AES-256-GCM 静态加密 + BYOK
        - 静态数据保护；客户密钥控制
        - AWS KMS / Azure Key Vault / GCP KMS（客户托管）
        - 非云原生客户使用 BYOK 会增加复杂度
      - - SSO / MFA / RBAC
        - 身份、访问、治理
        - 主要 SSO 提供商；Writer 平台权限模型
        - 嵌套智能体权限下最小权限执行的深度
      - - REST API / Python SDK / Node SDK（开发者接口）
        - 开发者集成界面
        - PyPI（writerai）；npm（writer-sdk）；兼容 OpenAI 的 REST
        - SDK 版本稳定性；弃用政策需要与模型变更协同
      - - 可观测性插件（Datadog、OpenLLMetry）
        - 外部监控和 LLM 追踪
        - 通过插件集成 Datadog、New Relic、Traceloop、Jaeger
        - 并非所有可观测性平台都获得原生支持；需要手工配置插件
    notes: |
      架构来自 May 2026 抓取的 dev.writer.com 文档、工程博客和产品页面。依赖关系反映官方文档； 内部基础设施拓扑（云区域、计算配置）未公开披露。
    claimRefs:
      - CE020
      - CE022
      - CE023
      - CE024
      - CE025
      - CE035
      - CE036
