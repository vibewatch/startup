      - number: '8.5'
        title: 投资逻辑破裂触发器与最终尽调事项
        blocks:
          - type: paragraph
            body: >
              投资逻辑依赖几项必须在尽调中验证的假设。最关键的 thesis-break 触发器包括：（1）截至 2024 年 Q4 的 ARR 低于 $35M，这意味着 Sacra 估计被明显夸大，40×
              倍数无法辩护；（2）毛利率低于 50%，说明自研模型托管在当前规模下结构性不经济；（3）每月烧钱高于 $15M，意味着 Series C 后现金跑道短于 12
              个月，并立刻触发再融资风险；（4）              数据室访问时 NRR 低于 120%，逆转 Series B 引用的 >150% 数字，指向客户满意度问题或竞争性流失；（5）前三大客户贡献超过
              ARR 的 35%，说明集中度可能在单一客户流失时引发悬崖式收入事件； （6）股权结构表偏好显示后期阶段存在超过 1.5× 的非参与型清算优先权，这会把普通股回报压到 2.5× 总退出倍数以下。

              退出就绪度好坏参半。如果当前增长持续，Writer 已经具备与 $200–300M+ ARR IPO
              相匹配的客户标杆、产品广度和融资历史。更可能的近期退出，是被超大规模云厂商（Microsoft、Google、AWS）、大型企业软件供应商（SAP、Salesforce、Adobe），或寻求自研企业 AI
              栈的系统集成商战略收购。Salesforce Ventures 2025 年 10 月披露的投资尤其值得注意，可能是战略前奏；Salesforce 历来把 Ventures 投资作为收购前评估机制。若此类收购按
              $1.9B Series C 标记的 2–3× 完成，对后期投资人是合格但不算突出的回报。

              最终尽调事项集中在六个阻碍高置信承保的披露缺口：带客户级队列数据的已验证 ARR 明细、经审计或 CFO 认证的按产品线毛利率、截至 2024 年 Q4
              的烧钱速度和现金余额、完整股权结构表及优先股堆叠和反稀释条款、客户集中度（前 10 大客户收入占比），以及 AWS Bedrock 收入分成经济性。
