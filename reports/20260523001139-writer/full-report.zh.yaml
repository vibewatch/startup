      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: EU AI Act GPAI 义务带来 2026 年 8 月合规期限
            body: >
              Writer 的 Palmyra 模型家族符合 EU AI Act 对通用 AI（GPAI）模型的定义——在广泛数据上训练、可用于多样任务，并通过 API 和平台商业化部署。GPAI
              模型提供商义务（透明度、事件报告、训练数据摘要、参与实践准则）已于 2025 年 8 月生效。AI 内容透明度披露规则——要求标注 AI 生成内容——将于 2026 年 8 月生效，直接适用于 Writer
              的输出。EU AI Act 对 GPAI 不合规的罚款最高可达 €30 million 或全球营业额 6%。Writer 的 ISO 42001:2023 认证是一项前瞻性缓释；不过，训练数据摘要披露要求，以及
              Palmyra 的算力画像与系统性风险门槛之间的确切关系，仍是未解决的尽调事项，需要法律顾问介入。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
