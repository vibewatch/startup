      - number: '2.3'
        title: 买方分层与需求画像
        blocks:
          - type: paragraph
            body: >
              企业 AI 买方沿两条主轴分层：公司规模（决定预算授权和部署复杂度）与行业垂直（决定监管约束和用例优先级）。McKinsey State of AI 2025 数据显示，大型企业（收入
              $5B+）与中型市场公司（收入 $1B–$5B）之间存在显著规模化差距：前者约 50% 正在主动规模化 AI，后者只有 29%。差距既来自预算可得性，也来自组织吸收 AI 驱动流程变革的能力。

              按职能看，营销和内容运营是最高吞吐量的 GenAI 初始入口。Salesforce 的 State of Marketing 调查显示，营销负责人中的 AI
              采用率几乎普及，内容生成、活动优化和客户沟通个性化是头部用例。Writer 自身客户组合——包括 KPMG、Vanguard、Vodafone UK/VOIS、EE（BT Group）和 Snap Health
              Plan——说明初始营销部署经常成为 wedge，随后扩展到法务、HR、财务和客户支持职能。Snap Health Plan 用 Writer 做个性化会员沟通；Vanguard 报告产品发布上市时间缩短
              57%；Vodafone UK 将内容创建时间减少 50%，员工每周约节省一天。

              企业 AI 采购决策权正在上移。PwC 2026 AI Business Predictions 指出，组织正把 AI 战略集中到 C-suite 负责，并出现「AI
              studio」模式：中央团队设立获准平台、治理政策和部署 playbook，再由业务单元消费。这种集中化形成持久的供应商选择动态：一旦平台获 CIO/CTO
              批准并嵌入治理政策，切换成本就会大幅上升，有利于赢下初始企业平台评估的供应商。

              Capgemini 的 Rise of Agentic AI 报告（1,500 名高管，14 个国家）发现，尽管 61% 组织仍在探索 AI 智能体部署，82% 计划在一到三年内部署智能体，且 15%
              业务流程预计在 12 个月内达到半自主或全自主。到 2028 年，38% 组织预计 AI 智能体会在人类工作流中像团队成员一样运作。这些数据刻画出 2025–2026 年的买方状态：他们正在主动评估智能体 AI
              供应商，并承受内部压力，需要展示部署进展——这为具备成熟智能体编排能力的平台创造了有利采购窗口。
