      - number: '3.2'
        title: 竞争对手画像与战略方向
        blocks:
          - type: paragraph
            body: >
              OpenAI 的 ChatGPT Enterprise 是企业市场认知度最高的 AI 应用。定价经销售谈判，不公开列价；部署需要组织 IT 治理、SSO 配置和工作区分析。OpenAI 称 98% 员工更偏好
              ChatGPT Enterprise 而非其他 AI 工具——这是公司自行生成的数据，未获独立佐证。企业部署包括专用实例、不用客户数据训练、带 SLA 的 24/7 支持，以及面向大规模 rollout 的 AI
              advisor 服务。OpenAI 的 API 定价（2026 年 5 月）约为 GPT-4o 每百万输入 / 输出 token $2.50 / $10（优先处理），让开发者能直接访问模型。Writer
              的风险在于，OpenAI 的品牌统治力会让企业买方默认选择 ChatGPT Enterprise 作为阻力最小路径，即便 Writer 的专门企业能力（品牌声音、Knowledge
              Graph、合规）能交付更高价值。

              Anthropic 的 Claude Enterprise 定位为面向受监管行业、以安全优先的大语言模型。Enterprise 计划最低 50 席，需要销售辅助，并可通过合适的补充协议支持 HIPAA。功能包括
              SSO、SCIM、审计日志、基于角色的权限，以及用于大文档摄取的扩展上下文窗口。Claude API 层模型定价从 Sonnet 每百万 token $1.50 / $7.50 到 Opus 4.5 每百万
              token $15 / $75（标准推理）不等。Anthropic 与 KPMG 的联盟——在一项全球战略合作中把 Claude 集成到 276,000+ 名员工中——显示 Anthropic 有意争夺
              Writer 正在瞄准的同一企业细分市场。不同于 Writer，Anthropic 销售的是模型访问和 API 能力，而不是预构建企业工作流编排。

              Microsoft 365 Copilot 被打包进既有 Microsoft 365 企业合同，将 OpenAI 模型与 Microsoft Graph（文档、邮件、会议、日历）集成。Microsoft 365
              Copilot Chat 对拥有合格 M365 订阅的 Microsoft Entra 账户用户不额外收费，降低了企业初始采用摩擦。付费 Copilot 许可证增加
              Word、PowerPoint、Excel、Outlook 和 Teams 的跨应用集成，以及 Copilot Studio 智能体构建平台。Microsoft 的分发护城河——服务 4 亿多 M365
              用户——让它成为 Writer 应用层价值主张中最危险的既有巨头威胁。Azure AI Foundry（原 Azure AI
              Studio）为自定义模型部署、智能体工作流和多模型编排提供面向开发者的基础设施，额外创造了一个与 Writer AI Studio 竞争的企业开发者界面。

              Salesforce Agentforce 原生嵌入 Salesforce CRM 生态。Atlas Reasoning Engine 让基于 CRM 数据的自主多步骤任务执行成为可能。Agentforce
              提供开箱即用的智能体模板，覆盖 Service Agent、Sales Development Representative、Sales Coach、Campaign Optimizer 和
              Merchandiser，这些收入周期工作流往往是 Writer 初始销售切入点。定价采用 Flex Credits 或按会话计费，每个 Salesforce 客户都可通过 Salesforce
              Foundations 获得 Agentforce 访问。Zero-Retention Policy（数据不存储、不用于模型训练）和 BYOM 能力（自带 OpenAI、Anthropic 或 Google
              模型）回应了企业数据顾虑。鉴于 CRM 记录作为企业 AI 智能体 grounding 上下文已经深度嵌入，Salesforce 是 Writer 最危险的 CRM 工作流竞争对手。

              Jasper 是一家面向营销团队的 AI 执行平台，创立于 2021 年。Jasper 从上线到成为独角兽只用了 18 个月，最初领先 AI 写作助手市场；但此后转向 100+ 个专用营销 AI 智能体和内容
              pipeline 平台。Jasper 专门瞄准营销团队，是点状解决方案，而不是跨职能企业 AI 平台。Copy.ai 定位为 GTM AI 平台，采用 credit 计价，聚焦销售和营销收入工作流。相较
              Writer 的全栈企业抱负，Jasper 和 Copy.ai 的威胁方向上较弱；但当 Writer 的销售动作先进入营销部门时，它们仍是可行替代方案。

              Grammarly Business 以 15 年写作辅助历史服务 70,000+ 企业团队。Grammarly 的 Superhuman Go 产品代表了显著竞争升级：用于会议排期、ticket
              创建和跨应用工作流自动化的 AI 智能体。Grammarly 原生集成 Gmail、Microsoft Outlook、Slack、Salesforce、Microsoft PowerPoint
              等企业工具，在许多组织里拥有比 Writer 初始部署界面更广的上下文存在感。当买方主要标准是写作治理和编辑质量时，Grammarly 尤其危险，因为其 15 年品牌能迅速建立企业信任。

              Cohere 瞄准开发者和 API 层，Command 模型家族提供私有云和 VPC 部署选项，对有严格数据主权要求的企业有吸引力。Cohere 的 North 平台在 Command
              模型之上提供智能体和工作流编排，因此会在开发者构建的企业 AI 应用场景中，成为 Writer AI Studio 的间接竞争者。
