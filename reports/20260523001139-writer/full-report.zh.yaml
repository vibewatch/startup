          - type: callout
            title: 关键披露缺口：毛利率和烧钱速度未知
            body: >
              Writer 未公开披露毛利率、烧钱速度或现金余额。这是 Series C 阶段估值最重要的两个输入，缺失会阻止高置信承保。自研模型托管架构引入基础设施成本，可能把软件层毛利率压到 60%
              以下——这一水平需要相对纯软件 SaaS 同行给出有意义的倍数折价。除非数据室确认毛利率高于 65%，40× 过去期 ARR 进入倍数应被视为天花板，而不是地板。
            calloutType: risk
