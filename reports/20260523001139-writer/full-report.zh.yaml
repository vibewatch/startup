      - number: '1.4'
        title: 产品平台、技术与企业客户
        blocks:
          - type: paragraph
            body: >
              Writer 平台围绕三大支柱组织：（1）Palmyra LLM——面向企业用途打造的自研大语言模型家族；（2）AI Studio——供 IT 和业务团队构建、激活并监督的环境；（3）Knowledge
              Graph——接入企业数据源的检索与 grounding 层。三者合起来，使企业能够部署 AI 智能体，自动化复杂工作流、执行品牌和合规规则，并接入现有企业系统。

              Palmyra 模型家族目前包括 Palmyra X5（1M token 上下文窗口、自适应推理、每 1M 输入 / 输出 token $0.60 / $6.00）、Palmyra X4（128K
              上下文、HELM 基准排名靠前、每 1M token $5.00 / $12.00）、Palmyra Creative（长篇创意写作）、Palmyra Med（医疗和生物医学 NLP，在 PubMedQA
              基准中居前）以及 Palmyra Fin（金融领域，据称已通过 CFA Level III 考试）。除 Writer 自有平台外，Palmyra X5 也可在 Amazon Bedrock
              上使用。模型零数据留存，不用客户数据训练，这是受监管行业的重要合规卖点。

              平台的智能体层 Writer Agent，把 Ask Writer 对话界面与用于多步骤工作流执行的 Action Agent 结合起来。Writer AI Studio 提供无代码和 pro-code
              工具，用于构建自定义智能体，并提供 100 多个预构建智能体模板。连接器把智能体接到 Microsoft 365、Google Workspace、HubSpot、Gong、PitchBook 和
              FactSet。治理能力包括基于角色的权限、活动轨迹、护栏和审批工作流。

              企业安全认证包括 ISO/IEC 27001、27701 和 42001，以及覆盖 HIPAA/HITECH、PCI 合规和 GDPR 遵循情况的年度 SOC 2 Type II
              审计。这些认证降低了金融服务和医疗等受监管行业的采购摩擦。相比前沿模型包装层（OpenAI、Anthropic API），Writer 自研模型栈叠加零数据留存和 ISO 42001 AI
              管理认证，为受监管垂直行业提供了更完整的合规画像。

              截至 2026 年 5 月，Writer 拥有 300 多家企业客户，包括 Uber（为约 40,000 名支持坐席提供中央知识管理）、Salesforce、Qualcomm（每月节省 2,400 小时，管理
              1,200 个商标）、KPMG、Vanguard（上市时间缩短 57%，首个面向客户的 AI 智能体）、EE、Franklin Templeton、Dropbox、CirrusMD、Medisolv、N26 和
              Lennar。G2 上的第三方评价（4.3/5，104 条）把品牌一致性和知识 grounding 列为主要优势，也指出学习曲线陡、管理员 UI 有缺口、小团队成本高等弱点。TrustRadius
              评价包含明确负面反馈：一位评价者称 Writer「拖慢了写作流程，给出的内容不够事实准确，还浪费了我们的时间」。

              Writer 的 Knowledge Graph 通过 Connectors 接入企业数据源——预构建 API 集成覆盖 Microsoft 365、Google
              Workspace、HubSpot、Gong、PitchBook、FactSet 等。数据流经 Knowledge
              Graph，用于检索增强生成，不会被留存，也不会用于模型训练。该架构在满足企业数据驻留要求的同时，让输出能基于上下文落地。
