  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与知识产权风险
        blocks:
          - type: paragraph
            body: >
              Writer 处在三条活跃监管主线的交汇处，合规义务会叠加：欧盟 AI 法案对通用人工智能（GPAI）模型提供商的治理要求、美国围绕 AI 训练数据不断演变的版权法理，以及约束平台处理企业数据的隐私 /
              数据保护法律（GDPR、CCPA、HIPAA）。

              欧盟 AI 法案的 GPAI 条款已于 2025 年 8 月生效，要求被认定具有系统性风险的通用 AI 模型提供商开展对抗测试、报告事件，并与 AI Office 合作。Writer 的 Palmyra
              模型家族由其训练、部署并商业化销售，符合欧盟法案对 GPAI 模型提供商的定义。按已发布模型规模看，系统性风险门槛（10^25 FLOPs 训练算力）可能将 Palmyra X5
              排除在外；但算力持续扩张后，未来仍可能跨过门槛。AI 生成内容披露透明度规则将于 2026 年 8 月生效，直接适用于 Writer 的输出。欧盟 AI 法案下，不合规罚款最高可达 €30 million
              或全球年营业额 6%，对一家 ARR 接近 $50M 的公司构成有意义的财务敞口。欧盟法案还要求提供商发布 GPAI 模型训练数据摘要，增加 IP 披露义务，并可能暴露 Palmyra
              预训练中使用的版权敏感数据源。

              美国版权法风险发酵较慢，但潜在影响显著。美国版权局于 2025 年 5 月发布 AI Report 第 3 部分（预发布版），讨论生成式 AI 训练数据和合理使用（fair
              use）。报告本身不创造新法律，但会影响国会正在进行的审议，并释放信号：AI 模型提供商使用抓取训练数据正面临更严格审视。全行业正在进行的版权诉讼（包括主要出版商对 AI
              模型公司的案件）带来判例风险，可能要求追溯调整训练数据实践，或建立新的授权安排。Writer 的具体版权敞口主要在上游——Palmyra 的预训练数据——而不是下游（Writer
              并不把逐字复现训练文本作为产品功能）。TechCrunch 2024 年 11 月关于 Writer 融资的报道明确提到「privacy and copyright challenges」是生成式 AI
              市场的逆风，并把它们定位为行业层面而非 Writer 特有风险。

              Writer 发布的 DPA 对隐私和数据保护义务覆盖较完整，涵盖 GDPR、UK DPA 2018、FADP 和 CCPA，纳入欧盟标准合同条款，并指定 Irish Data Protection
              Commission 为 EEA 传输的主管监督机构。Writer 已在 Data Privacy Frameworks（EU-US、UK Extension、Swiss-US）下完成自认证。DPA 明确承诺
              Writer 不使用 Customer Data 训练或修改其模型——这是企业采购中的关键差异点，也由 N26 和 CirrusMD 的安全推荐语独立确认。HIPAA/HITECH 覆盖通过年度 SOC 2
              Type II 评估提供，评估纳入 HIPAA 要求，使 CirrusMD、Medisolv、Vizient、SCAN Health Plan 等医疗客户能够签署 BAA。ISO 42001:2023（AI
              管理体系）认证是尤其前瞻的合规信号，使 Writer 在 AI 专项治理成熟度上领先多数企业 AI 竞争对手。剩余法律缺口是缺少 FedRAMP 授权，这会阻碍美国联邦政府采购；Writer
              尚未优先进入这一市场，但它限制了总可用市场（TAM）上限。
