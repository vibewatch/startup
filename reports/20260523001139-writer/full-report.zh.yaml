      - 阈值 / 事件
      - 行动含义
    rows:
      - - 被 Microsoft M365 Copilot 竞争替代
        - Microsoft 在 M365 Copilot 中宣布与 Writer 深度相当的品牌治理 / Knowledge Graph 功能；或 Writer 在 Microsoft 主导续约中的胜率明显下降
        - Copilot 达到 Writer 品牌治理技术栈 >70% 功能相似度，或 Writer 在 12 个月窗口内因客户以 M365 为主要替代方案而流失 3+ 个前 10 大客户
        - 投资逻辑破坏触发项 — 重新评估战略定位；加速垂直专用差异化；研究与 M365 合作 / 集成是否比竞争更可防守
      - - 监管执法行动 — EU AI Act / GDPR / HIPAA 对 AI 内容执法
        - EU AI Office 因训练数据披露或事件报告不合规，对 GPAI 模型提供商采取执法行动；或行业监管方限制医疗 AI 内容
        - Writer 或同类 GPAI 提供商收到书面监管执法通知，且先例可直接适用于 Writer 的产品架构和客户垂直领域
        - 立即介入法律团队；评估合规补救是否能在 90 天内完成；评估对医疗和金融服务 ARR 的影响
      - - 联合创始人离任
        - CEO 或 CTO 宣布离任、出现离任传闻、长期休假，或重大角色调整导致其失去运营权
        - 在投资持有期内，任一联合创始人转任 / 离任获得公开宣布或内部确认
        - 对早期投资人构成投资逻辑破坏触发项；基于具名继任者质量、关键模型研究领导层留存和董事会治理承诺重新评估
      - - ARR 增长降至投资逻辑以下
        - Writer 披露的 ARR 或收入明显低于近期轨迹隐含的 150%+ 增速；或第三方研究下调 ARR 估计
        - 公开披露 ARR 同比增长低于 60%，或 Sacra / 二级市场 ARR 估计修正显示同比增速降至 80% 以下
        - 重新承销单位经济；评估减速来自市场饱和、竞争替代还是执行缺口；判断低增长下投资逻辑是否仍成立
      - - 企业客户替代事件
        - 前 10 大客户公开采用竞争平台承接 Writer 主要用例（例如 Salesforce 为此前使用 Writer 的 3,000+ 员工部署 Agentforce）
        - 具名前 10 大客户公开被归因于以竞争平台替代 Writer（不是补充使用），或下一次续约时披露不续约
        - 投资逻辑承压事件 — 分析根因（定价、功能缺口、平台整合）；评估组合集中度，并判断事件是个案还是系统性
    notes: |
      终止标准是说明性的投资人级投资逻辑破坏触发项，不是法律义务。阈值反映本章和前文记录的当前投资逻辑假设。监测依赖公开信号（新闻稿、客户公告、监管案卷、二级市场数据），并辅以持续的管理层沟通渠道。
