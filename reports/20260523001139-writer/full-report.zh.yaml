      - - 毛利率塌陷
        - 数据室开放时毛利率（GM）低于 50%
        - 模型托管基础设施结构性不赚钱；通往软件级盈利能力的路径被堵住
        - 放弃，除非公司拿出 18 个月内 GM 超过 60% 的清晰成本路线图
      - - 烧钱过高
        - 月度净现金消耗超过 $15M
        - Series C 后现金跑道不足 12 个月；迫使公司以不利条款做紧急过桥融资
        - 交割前要求过桥承诺或托管安排；重新审视股权结构表
      - - NRR 反转
        - Series C 数据室中的 NRR 低于 120%
        - 核心增长飞轮失效；扩张经济性撑不起先落地再扩张模式
