      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 投资立场：有条件观察
            body: >
              Writer 的增长画像和企业端证据支持按 $1.9B 估值标记参与，但立场取决于数据室对六项关键指标的验证：ARR ≥$40M、毛利率 ≥65%、月烧钱 ≤$10M、NRR ≥130%、客户集中度（前三大
              ≤35% ARR），以及没有重大不利的股权结构表偏好条款。若六项条件全部满足，进入倍数可辩护，乐观情景支持 IPO 或战略退出时获得 1.6–2.1×
              回报。若两项或更多条件不满足，估值偏高，应选择放弃或重新谈价。
            calloutType: recommendation
            claimRefs:
              - CV001
