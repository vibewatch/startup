          - type: callout
            title: Salesforce Ventures 投资作为战略信号
            body: >
              Salesforce Ventures 2025 年 10 月作为其 $1B AI 基金部署一部分，对 Writer 投入未披露金额，这一点值得注意，可能是战略前奏。 Salesforce 有使用
              Ventures 投资作为收购前评估机制的记录（例如 Slack、Tableau、MuleSoft 都曾在被收购前获得 Ventures 投资）。Salesforce 若以 $1.9B Series C 标记的
              2–3× 收购 Writer，将形成 $3.8–5.7B 交易，落在 Salesforce 近年 M&A 区间内，并让其获得一个自研企业 AI 平台，用来对抗 Microsoft Copilot for
              M365。这一战略可选性是基准情景内在价值分析尚未捕捉的有意义上行因素。
            calloutType: insight
