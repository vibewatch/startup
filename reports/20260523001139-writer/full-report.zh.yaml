  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与垂直行业组合
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Writer 的 300+ 家企业客户至少横跨五个主要垂直行业：金融服务（Vanguard、Franklin Templeton、Ally
              Bank、N26）、技术与软件（Qualcomm、Salesforce、HubSpot、Sprout
              Social、Commvault、Dropbox）、医疗健康与生命科学（CirrusMD、Medisolv、Vizient、SCAN Health Plan）、专业服务（KPMG、Accenture）以及零售 /
              消费品（Adore Me/Victoria's Secret、L'Oréal、Kenvue、Lennar）。这种垂直多样性是有意设计的：面向医疗的 Palmyra Med 和面向金融的 Palmyra Fin，使
              Writer 在受监管行业有更深产品契合；品牌治理和商标管理能力，则回应了消费品牌和专业服务公司的需求。

              主要买方是员工数 1,000+ 企业中的 AI Transformation、内容营销或传播 VP / Director。在一些部署中，买方是法律或监管事务负责人（例如 Qualcomm 的 SVP of
              Legal Counsel），或 Generative AI VP（例如 Vanguard 的 Paul
              Dyrwal）。最终用户覆盖营销、传播、法律、内容设计、产品、HR、销售和客户支持团队。平台的「先落地、再扩张」动作——从一个部门起步，再通过自发口碑扩散——意味着初始买方往往不是最终最大的用户群。

              从地域看，客户群集中在总部位于美国的企业。国际客户引用包括 N26（德国数字银行）、Go1（澳大利亚学习平台）、EE 和 VOIS/Vodafone UK（英国电信运营商）以及 TELUS（加拿大）。Writer
              的多语言 Palmyra 模型和多语言风格指南能力支持非英语部署，Adore Me 案例研究也记录了借助 Writer AI Studio 在 10 天内完成国际市场发布；但国际 ARR
              集中度未公开披露，仍是尽调缺口。

              Balderton Capital 的 Series C 公告确认了交割时的具名客户名单：Mars、Ally Bank、Franklin
              Templeton、Kenvue、Lennar、Prudential、Qualcomm、Salesforce、Uber 为较新客户，Vanguard、Accenture、L'Oréal、Intuit
              则是长期客户。Forbes 和 TechCrunch 也分别引用了锚定 Uber、Intuit、Salesforce 的 300+ 客户数字，从而佐证官方说法。Sacra 研究报告称客户群中已部署 5,000+
              个智能体，说明平台采用已超出基础内容创作。
