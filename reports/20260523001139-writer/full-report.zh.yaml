      - number: '6.4'
        title: 集中度风险、反向证据与尽调优先事项
        blocks:
          - type: paragraph
            body: >
              Writer 的客户群扩张和具名 logo 多样性是强正面因素，但几个结构性集中度风险需要尽调关注。客户地域集中在总部位于美国的企业，限制了国际收入可见度。垂直行业集中度也存在风险——金融服务和技术占据具名
              logo 的多数，任一垂直的监管逆风都可能对留存和扩张产生不成比例影响。渠道集中同样是风险：Writer 似乎主要依赖企业直销，AWS Bedrock 合作关系和一个仍处早期的合作伙伴计划（2026
              年初宣布）是主要替代分发路径。系统集成商或转售商渠道渗透深度没有公开记录。

              反向评论证据并非孤例。G2 和 Gartner Peer Insights 均出现来自中大型企业买方的 1 星评论，称产品误导和表现低于预期，评论提交于 2025 年 7
              月。两大平台措辞相同，说明它们可能来自同一底层客户体验；提交时间（Series C 后 9 个月）也可能指向快速扩张期间的一次具体部署失败。这是孤立事件，还是大规模上线导入失败的症状，是重大开放问题。Writer
              的客户成功团队在多个案例研究中获得正面引用（Qualcomm 的 Brent Summers 称赞了上线支持），但反向评论说明体验并不一致。

              Writer 在 G2 上的评分约为 4.1/5（基于可得评论），总体情绪正面，但在创意灵活性和跨会话记忆方面存在不满。TrustRadius
              评论同样呈现混合图景：希望写作工具约束更少的用户反馈较差，但企业治理用例持续获得称赞。Slashdot 列表把 Writer 归入 AI 写作助手类别，功能覆盖较广。

              客户章节的关键尽调优先事项：（1）向管理层索取按 vintage cohort 和垂直行业拆分的 NRR/GRR。（2）索取 top-1/5/10/25 客户 ARR，以评估集中度。（3）调查 2025 年 7
              月反向评论事件——识别是否有企业客户流失，以及合同如何解决。（4）评估国际 ARR 与路线图。（5）评估合作伙伴计划成熟度，把它作为扩张和多元化杠杆。（6）向客户成功职能索取客户 NPS 数据。
