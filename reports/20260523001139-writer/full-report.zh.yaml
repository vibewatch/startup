      - number: '4.3'
        title: 资本充足性与融资历史
        blocks:
          - type: paragraph
            body: >
              Writer 累计完成 $326M 股权融资，横跨多轮；最近一轮是 $200M Series C（SEC 文件精确金额：$199,999,483）。根据 2024 年 11 月 21 日提交给 SEC 的
              Form D，该轮首笔销售发生在 2024 年 11 月 6 日。Premji Invest、Radical Ventures 和 ICONIQ Growth 共同领投，投资者总数 21 家，包括
              Salesforce Ventures、Adobe Ventures、B Capital、Citi Ventures、IBM Ventures、Workday
              Ventures、Accenture、Balderton Capital、Insight Partners 和 Vanguard。这是一个覆盖企业软件、云和金融服务的广泛战略财团。

              Series B 于 2023 年 9 月完成，规模 $100M，由 ICONIQ Growth 领投，Insight Partners、WndrCo、Balderton Capital、Aspect
              Ventures 以及战略客户 Accenture、Vanguard 参投。在 Series B 之前，公司通过 Seed（Aspect Ventures）和 Series A（Insight
              Partners）合计融资约 $26M。完整融资时间线已在公司概况章节记录；本节分析重点是资本充足性和后续现金跑道。

              Writer 2024 年 11 月融资 $200M，且没有披露债务工具或项目融资义务，因此进入 2026 年时具备实质性流动性。按同等规模和增长速度的企业 AI 平台常见烧钱速度估算——一家 ARR
              $47M、员工数同比增长 168% 的公司每月约烧 $5–$10M——Series C 资金意味着自交割日起估计有 20 至 40 个月现金跑道，大约覆盖到 2026 年中至 2027
              年中。这一现金跑道估算基于公开可观察的员工增长（GrowJo 估计约 1,715 名员工，同比增长 168%）以及企业 AI 员工数 / 烧钱比基准；实际烧钱速度未公开披露。公司表示，Series C
              资金将用于产品开发，并「巩固在企业生成式 AI 品类中的领导地位」。Writer 未公开披露下一轮融资触发时间或盈利目标。
