              Series C 由提交给 SEC 的 Form D 文件独立佐证（Acc-No 0002044986-24-000002，提交日期 2024-11-21），确认精确融资额为 $199,999,483、投资者
              21 家、首笔销售日期为 2024 年 11 月 6 日。这是本章置信度最高的数据点——它来自监管文件，而非新闻稿或第三方估计——并为资本充足性分析提供锚点。
