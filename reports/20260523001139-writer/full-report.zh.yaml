  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >
              Writer 的收入来自年度企业软件订阅，计费采用席位 + 用量混合模式。客户通过与企业采购团队直接谈判的年度合同，使用完整的 Writer 平台，包括 Palmyra LLM、Knowledge
              Graph、AI 护栏和智能体层。公司采用典型的先落地、再扩张策略：初始部署瞄准某个部门或用例（营销内容、法律合规、客户支持），随后靠已验证的 ROI 扩张，ROI 以节省员工工时和生产率提升衡量；2023 年
              9 月 Series B 时披露的净收入留存率（NRR）超过 150%，也支撑了这一扩张路径。

              定价分为两层。面向公开市场的 Starter 方案最多支持 5 名用户、5 个 Playbook，并限制 Knowledge Graph 访问。真正有意义的收入来自 Enterprise 层，但 Writer
              未披露标价；潜在客户必须联系销售获取报价。这种「联系我们」入口是企业 SaaS 的标准做法，但会给习惯透明软件定价的买方增加采购摩擦。Palmyra API 的价格在 writer.com/llms/
              页面明确列出：Palmyra X5 每百万输入 token $0.60、每百万输出 token $6.00；Palmyra X4 每百万输入 token $5.00、每百万输出 token
              $12.00。按这个价格，Palmyra X5 的单 token 成本比 GPT-4.1（OpenAI 标价每百万 token 输入 $5.00、输出 $30.00）低
              3–4×，对高吞吐企业工作负载是实质性的成本优势。

              从 2021 到 2023 年 Series B，Writer 两年收入增长 10×；年经常性收入（ARR）从 2022 年约 $2M 增至 2023 年 $16M，并在 2024 年 11 月达到估计
              $47M。Series C 按 $1.9B 估值定价，也侧面印证了这条增长曲线。Sacra 估计，Writer 2024 年收入同比增速约为 194%。Writer 上架 AWS
              Bedrock，把模型分发延伸到采用 AWS 标准的企业客户，但其与 Amazon 的分成条款未公开披露。
