      - number: '5.2'
        title: AI Studio 平台与智能体架构
        blocks:
          - type: paragraph
            body: >
              Writer AI Studio 是企业部署 AI
              智能体的统一构建、激活、监督平台。它按技术深度提供三条构建路径：（1）无代码智能体——面向重复结构化任务的可视化构建器，无需编码即可产出可部署智能体；（2）Agent
              Builder——面向更复杂条件逻辑的低代码可视化界面；（3）Writer Framework——开源 Python 库，配有拖拽式 UI 构建器，采用 WebSocket 同步，事件处理仅增加 1–2ms
              开销，使工程师能够构建接入外部 API 和数据源的全栈智能体应用。REST API 访问，以及 Python（writerai，要求 Python 3.9+）和 Node.js（writer-sdk，发布于
              npm）的官方 SDK，补齐了开发者接口面，并支持与 LangChain、OpenLLMetry、AWS Strands Agents 集成。


              Writer Agent 产品层是自主多步骤工作的编排界面。Writer Agent 接收自然语言任务，制定计划，调用必要数据源（通过 Knowledge Graph）和工具（通过 MCP
              网关连接器），在指定检查点请求人工批准，并交付打磨后的成果（文档、仪表盘、演示文稿）。已展示的用例包括：营销活动管理，查询 HubSpot、综合洞察并通知 Asana 和 Microsoft
              Teams；账户会议准备，从 Google Calendar、PitchBook 和 Gong 拉取信息；以及通过第三方金融系统生成基金报告。WRITER Agent 价格为每 1M 输入 / 输出 token
              $5.00/$12.00。


              基础设施骨架是 LLM Gateway。Writer 在 2024–2025 年重建该网关，用它取代硬编码的 Content Generation
              服务。新网关由数据库驱动，工程师或客户无需部署流水线，就能通过管理面板在数秒内添加任意受支持的模型提供商。它提供跨副本负载均衡、自动模型健康检查、即时可配置护栏，以及带完整上下文日志的实时请求跟踪。来自 AWS
              Bedrock、Microsoft Azure 和 NVIDIA NIM 的外部模型，可以与 Palmyra 模型一起纳入同一个 AI Studio 界面管理。关键在于，网关把 OpenAI 兼容 API
              作为统一抽象层，降低了集成面。


              MCP（Model Context Protocol）网关位于智能体和企业工具之间。它对每一次智能体—工具交互执行四层验证：IdP
              身份验证、连接器和智能体级权限检查、畸形请求筛查、响应完整性验证。管理界面支持集中管理连接器、控制 OAuth、查看使用会话日志并执行限流。截至 2026 年 5 月，首批生产连接器已面向主要企业系统开放
              beta（Salesforce、HubSpot、SharePoint、Slack 等），代表的是受治理的 MCP 访问，而不是裸 API key。
