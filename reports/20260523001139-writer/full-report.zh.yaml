  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 主要目标客群
      - 与 Writer 相比的核心差异
      - 与 Writer 相比的主要限制
    rows:
      - - OpenAI（ChatGPT 企业版）
        - 横向 AI 平台
        - ~$6.6B ARR（2024，据报道）；估值 $157B+
        - 所有企业垂直领域
        - 品牌占优；GPT-4o 前沿模型能力；开发者生态广
        - 没有自研企业工作流编排；定价不透明；没有品牌语调治理
      - - Anthropic（Claude 企业版）
        - 基础模型 / API
        - ~$2B ARR（2024，据报道）；估值 ~$18B+；与 KPMG 建立 276K 员工联盟
        - 受监管行业、开发者团队、大型文档工作流
        - 安全优先定位；大上下文窗口；KPMG 企业联盟规模
        - API 优先，不在应用层；没有开箱即用的企业工作流编排；最低 50 席
      - - Microsoft 365 Copilot
        - 既有横向 AI
        - 400M+ M365 用户；付费层 $30/用户/月；Copilot Chat 免费
        - 所有 M365 企业账户
        - 装机基数形成分发护城河；M365 集成深；Azure AI Foundry 面向开发者
        - 通用 AI 未针对品牌语调或企业内容治理定制；没有自研模型
      - - Salesforce Agentforce
        - CRM 原生 AI 平台
        - 全球最大 CRM 供应商；Flex Credits 定价；Agentforce Foundations 免费层
        - 收入周期型企业；CRM 优先工作流
        - CRM 数据作为上下文基础；开箱即用的角色智能体；Atlas Reasoning Engine；Zero-Retention Policy
        - 脱离 CRM 场景后应用有限；没有跨职能品牌治理
      - - Google Workspace Gemini / 云端 AI
        - 横向 AI 平台
        - IDC GenAI MarketScape 领导者（2025）；Gartner Magic Quadrant 领导者（2025 Q4）
        - 已集成 Workspace 的企业；通过 Vertex AI 触达开发者
        - Gemini 覆盖 Docs/Sheets/Slides；Vertex AI Agent Builder；模型组合广
        - 消费端与企业端混合稀释品牌；没有企业品牌语调治理工具
      - - Jasper
        - 营销 AI 平台
        - 2021 年创立；18 个月成为独角兽；聚焦营销
        - 营销和内容团队
        - 100+ 个专业营销 AI 智能体；内容流水线；营销品牌一致性
        - 用例窄（仅营销）；没有跨职能企业平台；没有自研 LLM
      - - Copy.ai
        - GTM AI 平台
        - 2020 年创立；点数制 SaaS；聚焦 GTM 工作流
        - 销售和营销团队
        - 点数制灵活定价；GTM 工作流自动化；CRM 集成
        - 范围窄（GTM 工作流）；企业治理有限；没有自研 LLM 或知识图谱
      - - Grammarly Business
        - 写作与沟通 AI
        - 70,000+ 个企业团队；15 年品牌；面向智能体的 Superhuman Go
        - 所有产出书面沟通内容的团队
        - 15 年信任品牌；Superhuman Go 智能体功能；原生集成（Gmail、Slack、Teams）
        - 写作辅助定位限制平台野心；缺少跨职能 AI 编排
      - - Cohere
        - 基础模型 / API
        - 私有部署和 VPC 选项；Command 模型系列；North 平台
        - 开发者主导的企业；有数据主权需求的受监管行业
        - 私有 / VPC 部署选项；聚焦数据主权；企业 API 灵活性
        - API / 开发者层是重心，不在应用层；没有品牌语调或开箱即用的工作流编排
    notes: >
      OpenAI（$6.6B ARR）和 Anthropic（~$2B ARR）的规模/融资数据均为第三方报道估计，未获公开申报文件确认。 Microsoft、Google 和 Salesforce 的数据反映公开可得信息。
      Jasper 和 Copy.ai 的规模数据受私营公司披露限制，信息有限。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers nine primary competitors identified through product page analysis, G2 category listings, and market
        commentary as of 2026-05-23. Excludes niche vertical AI vendors (e.g., Harvey for legal, Ambience for
        healthcare) and internal-build substitutes, which are discussed qualitatively in sections.
