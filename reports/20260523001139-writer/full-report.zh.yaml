  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >
              企业 AI 平台市场涵盖一类软件产品及相关专业服务，帮助组织在业务工作流中大规模部署生成式 AI 能力。不同于消费级 AI 应用，企业 AI
              平台必须满足一组独特要求：可扩展到支持分布式组织中的数千名用户；模型可靠，输出质量一致且可审计；数据治理和安全控制达到企业及监管标准；深度接入既有企业系统（ERP、CRM、HRIS、文档管理）；并提供集中化管理和合规工具。IBM
              的企业 AI 框架把可扩展、可靠、安全、集成、可治理这五个轴，视为企业 AI 区别于消费 AI 的最低可行门槛。

              市场分为三层嵌套。最宽的是整体 AI 市场，横跨基础设施（芯片、云计算）、软件（模型、平台、应用）和服务（咨询、实施）。其内是生成式 AI 层：能从自然语言提示生成文本、代码、图像和结构化数据的 AI 系统。企业
              GenAI 层是 Writer 这类供应商最具商业相关性的可服务市场：企业合同下、嵌入工作流的 GenAI 平台，强调治理、多模型组合和部门级部署。最新、增长最快的子层是企业智能体 AI：自治 AI
              系统可规划、执行多步骤任务，并与企业数据和工具交互，不需要人类逐步复核。Writer 的产品架构横跨全部三个企业子层，把公司放在一个本已高 CAGR 市场中增长最快的板块。

              分析师对市场边界的分歧，主要来自三处分叉定义：（1）是否纳入 AI 基础设施和基础模型成本；（2）带企业层 upsell 的消费端 AI 产品是否算作「企业 AI」；（3）智能体 AI 是归入 GenAI
              子板块，还是单列垂直领域。正是这些定义争议，解释了 MarketsandMarkets、Statista 和 Gartner 估计中 headline 市场规模相差 13–30% 的原因，也是评估 Writer
              TAM 时的重要不确定性来源。
