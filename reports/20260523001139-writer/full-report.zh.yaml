      - 剩余风险敞口
    rows:
      - - LLM 模型训练基础设施 / GPU 算力
        - NVIDIA（硬件）、AWS / GCP / Azure（云 GPU）
        - GPU 不可用或价格飙升会延迟模型训练周期、抬高 OpEx，或限制 Palmyra X 系列发布
        - 高 — 模型迭代节奏是核心竞争差异
        - 自有内部模型降低对第三方推理的依赖；$700K Palmyra X004 训练成本显示架构效率较高
        - 下一代模型训练可能需要显著更多算力；未披露长期 GPU 供应合同
      - - 企业工作流连接器 — Microsoft 365、Google Workspace、HubSpot、Gong、Salesforce
        - Microsoft、Google、HubSpot、Gong、Salesforce 等连接器
        - API 弃用、认证政策变化或连接器涨价，可能打断企业客户的智能体工作流
        - 高 — 连接器中断会影响正在生产运行的部署
        - 受治理的连接器架构具备管理员访问控制；企业 API 协议提供一定稳定性
        - 未披露与 Microsoft / Google 围绕 API 访问条款的合同保护或提前通知协议
      - - 护栏基础设施 — AWS Bedrock Guardrails、Azure AI Content Safety
        - Amazon Web Services、Microsoft Azure 等云依赖
        - 服务降级或功能变化可能削弱护栏覆盖，增加受监管垂直领域的合规风险
        - 中 — 护栏缺口会产生合规敞口，但不会立即打断产品
        - 双供应商架构；部分内容安全能力也存在于 Palmyra 原生模型层
        - 护栏目前未应用于 Palmyra 原生 API / SDK 路径；全覆盖取决于外部供应商可用性
      - - IBM 战略合作 — 医疗沟通垂直领域
        - IBM
        - IBM 战略转向（Watson Health 剥离先例）可能削弱该渠道预期贡献的销售线索
        - 中 — 合作伙伴关系带来增量分销，不是核心产品依赖
        - Writer 与医疗客户的直接关系（CirrusMD、Medisolv、Vizient、SCAN）独立于 IBM 渠道
        - IBM 合作财务条款、排他性安排和联合营销承诺未公开披露
      - - Salesforce — 客户、投资方、竞争者三重关系
        - Salesforce（客户、Salesforce Ventures 投资方、Agentforce 竞争者）
        - Salesforce 投入原生 AI，在包括其自有 3,000+ 员工使用场景在内的 Salesforce 账户中替代 Writer
        - 严重 — 如果失去 Salesforce 这一标杆客户，将构成声誉和投资逻辑破坏事件
        - Salesforce Ventures 投资带来财务一致性；Writer 的 Knowledge Graph 和品牌治理差异化尚未被 Agentforce 复刻
        - 投资和客户关系不能阻止竞争产品开发；Writer 与 Salesforce 之间未披露竞业限制
    notes: >
      合作伙伴和依赖风险基于截至 2026-05-23 的公开产品文档、DPA、工程博客和 Sacra 竞争分析评估。未发现公开披露的合作伙伴纠纷或合同终止。GPU 和云算力依赖是全行业结构性约束。Salesforce
      的双重角色关系最复杂，也是本登记表中最高优先级的尽调事项。
