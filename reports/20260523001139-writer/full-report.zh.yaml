          - type: callout
            title: 未发现公开诉讼——但 AI 行业整体法律不确定性较高
            body: >
              截至 2026-05-23，公开记录中未发现针对 Writer 的未决诉讼或监管执法行动。没有披露诉讼，与 Writer 的公司年龄和画像相符。不过，企业 AI 行业整体面临较高法律不确定性，来源包括全行业 AI
              训练数据版权诉讼、FTC 对 AI 性能宣称的审查，以及 EU AI Act 执法启动。本章记录的风险主要是前瞻性的——代表可能出现的负面事件概率分布，而非当前法律负债。Copyright Office 的 AI
              Report Part 3（2025 年 5 月）不会立刻创设新法，但释放出国会和司法系统将审视合理使用原则如何适用于 AI 训练数据的信号，这一问题会在 2026–2028 年投资期内继续演化。
