  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Palmyra LLM 家族架构与基准
        blocks:
          - type: paragraph
            body: >
              Writer 的核心自研资产是 Palmyra 大语言模型家族，专为企业工作流设计。截至 2026 年 5 月，活跃生产线由 Palmyra X5、Palmyra X4 以及 5
              个专用或旧版模型（Fin、Med、Creative、Vision、X 003 Instruct）构成；后 5 个已正式废弃，并计划于 2026 年 7 月 13 日移除，Palmyra X5
              被指定为统一迁移目标。Palmyra X5 是 Writer 的旗舰模型，采用混合 Transformer 架构，拥有 100 万 token 上下文窗口、低于 300 毫秒的工具调用延迟，并可在约 22
              秒内处理完整的 100 万 token prompt。在公开披露的基准中，X5 在 BBH（Big-Bench Hard）得分 70.99%，GPQA（研究生级科学推理）得分 47.20%，MMLU_PRO 得分
              65.02%，MATH_HARD 得分 71.57%；在 OpenAI MRCR 8-needle 长上下文测试中，它接近但低于 GPT-4.1（19.1% vs. 20.25%）。价格为每 1M 输入
              token $0.60、每 1M 输出 token $6.00——Writer 声称相较 GPT-4.1 单 token 成本低 3–4×，使其可支撑 RAG 管线和高吞吐智能体工作负载。


              Palmyra X4 是 Writer 上一代模型，工具调用准确率突出：按 Berkeley Function-Calling Leaderboard 方法，工具调用识别 ACC 为
              78.76%（声称比最近竞争对手高约 20%）、AST（规划）为 87.93%、Exec 为 88.27%。Palmyra X4 在 HELM Lite 排名 86.1%，HELM MMLU 为
              81.3%，发布时位列全球前 10。它的 128k-token 上下文和每 1M token $2.50/$10.00 的价格仍可使用，但最终会被 X5 更强的经济性和更长上下文取代。


              面向领域的 Palmyra 专用模型显示出差异化垂直表现：Palmyra Fin 在 CFA Level III 多选样题中得分 73%（首个通过该考试的 AI 模型；人类平均 60%），Palmyra Med
              在医学基准上平均得分 85.9%，其中 MMLU Clinical Knowledge 为 90.9%、Medical Genetics 为 94.0%、PubMedQA 为 80%。Writer 的
              HuggingFace 主页列出 33 个已发布模型和 3 个数据集，包括 Apache 2.0 下的开放权重集合，以及 2025 年 9 月发布的 Palmyra-mini 家族。把专用模型并入通用 X5
              带来整合风险：通过独立 API 端点使用 Fin 或 Med 的客户必须迁移，而整合后在领域任务上是否达到专用模型同等表现，还没有经过独立验证。
