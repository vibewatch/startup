  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议摘要与估值立场
        blocks:
          - type: paragraph
            body: >
              Writer 进入尽调时的投后估值为 $1.9B，这一点由 2024 年 11 月 SEC Form D 文件确认（Writer, Inc., CIK 0002044986）。$200M Series C 由
              Premji Invest 和 Radical Ventures 领投，ICONIQ Growth 参与，使已披露股权融资总额达到 $326M。Sacra 随后将数字更新为截至 2025 年 6 月总融资
              $326M、估值 $1.98B；Salesforce Ventures 又在 2025 年 10 月披露，作为其 $1B AI 基金部署的一部分向 Writer
              投入新支票——这表明投资人仍愿意按相近或小幅更高的标记出手，尽管没有公开确认的更新估值。

              按 $47M 的过去期 ARR（Sacra 估计，2024 年 11 月）计算，隐含进入倍数约为 40× 收入——显著高于 2024–2025 年成熟软件公司的公开 SaaS NTM 收入倍数中位数（BVP
              Nasdaq Emerging Cloud Index，约 6–10×），也高于 ARR 可比的高增长私有 AI 公司中偏高的倍数。Writer 约 194% 的 ARR 同比增长（Sacra）、Series B
              时确认的 >150% 净留存率（NRR）、全栈自研模型架构，以及快速扩张的智能体产品套件，部分支撑了这一溢价。 但 ARR
              数字来自第三方估计，未经审计；毛利率、烧钱速度和单位经济性均未公开；平台还面临超大规模云厂商 AI 套件以及资金充裕同行的竞争加剧，例如 Glean（2024 年 9 月约 $110M ARR、估值
              $4.6B）和 Harvey（2025 年初约 $50M ARR、估值 $3B）。

              投资立场是 **有条件观察**：如果数据室尽调确认毛利率高于 65%、年化 ARR 落在 Sacra 预测区间，且现金跑道至少延伸到 2026
              年中，这一增长画像和企业端证据足以支持按该估值参与。若数据室显示毛利率低于 55%、烧钱显著超过每月 $10M，或截至 2024 年 Q4 的 ARR 明显低于
              $40M，则估值超出证据可支撑范围，应重新谈价或放弃。
