      - number: '5.4'
        title: 信任、合规与部署控制
        blocks:
          - type: paragraph
            body: >
              Writer 的企业安全姿态围绕三根支柱：认证与法律合规、数据保护架构、运行时治理控制。在认证方面，Writer 持有 SOC 2 Type
              II（年度审查覆盖安全性、可用性、保密性三项信任服务标准）、ISO/IEC 27001（信息安全管理）、ISO/IEC 27701（隐私信息管理）和 ISO/IEC 42001（AI 管理体系）认证；其中
              ISO/IEC 42001 与负责任 AI 治理尤其相关。公司还保持 HIPAA Type 1 和 PCI 合规，并通过其数据处理协议（DPA）遵守 GDPR、UK Data Protection Act
              2018、Swiss FADP 和 CCPA；DPA 包含欧盟标准合同条款（SCCs）和 UK Addendum。身份管理支持所有主要 SSO 提供商和 MFA。


              数据保护通过 AES-256-GCM 信封加密落实到静态数据。Data Encryption Key（DEK）加密客户数据；Key Encryption Key（KEK）使用 Writer 托管 KMS
              或客户提供的外部 KMS（Bring Your Own Key—BYOK）封装 DEK。BYOK 支持 AWS KMS、Azure Key Vault 和 GCP KMS。DEK 在内存中缓存，TTL 为 5
              分钟；一旦暂停、吊销、轮换或 TTL 到期，DEK 会立即清除。Writer 声明的数据政策禁止使用客户数据创建、修改或训练其模型，并在平台层执行可配置的组织数据删除计划。


              运行时治理通过护栏框架落地，该框架在调用前、调用后和调用中阶段拦截智能体请求。Enterprise 方案可集成 AWS Bedrock Guardrails（内容过滤器、拒绝主题检测、词语过滤器、PII
              检测、上下文 grounding 检查）和 Azure AI Content Safety（针对 Hate/Sexual/SelfHarm/Violence 类别的文本审核，以及用于注入检测的 Prompt
              Shields）。护栏检查同时作用于用户输入和 LLM 输出。调用前阻断可防止 LLM 接收被禁 prompt，从而节省成本并避免暴露。Writer 还没有提供自研一方护栏引擎，而是依赖 AWS 和 Azure
              提供商执行内容管控；这会限制不在这些云栈上的客户的配置深度。Sacra 2024 年分析师报告曾指出，当时 Writer
              的智能体监督套件处于「早期访问」，相较于智能体已经获得的广泛企业系统访问权限，治理工具仍不成熟。
