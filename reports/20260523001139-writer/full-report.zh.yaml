      - number: '5.3'
        title: Knowledge Graph 与数据检索架构
        blocks:
          - type: paragraph
            body: >
              Writer 的 Knowledge Graph 是公司自研的图谱型检索增强生成（RAG）系统，定位为相对商品化向量嵌入 RAG 的技术差异点。该架构分五个阶段处理企业数据：内容摄入（文件、连接器、网页
              URL）、图谱构建（由专用 LLM 抽取实体、概念和语义关系）、索引（带检索感知压缩和元数据标注的可搜索图结构）、查询处理（用自然语言问题遍历图谱，可选择分解为子查询），以及响应生成（调用 Palmyra
              LLM，基于检索片段生成并附带内联来源引用）。2024 年，Writer CTO Waseem AlShikh 共同作者的一篇 arXiv 研究论文比较了检索系统，用 RobustQA 指标评估 KG-FID
              Retrieval 与 Azure Cognitive Search、Pinecone 的 Canopy、LlamaIndex/Weaviate、Google VertexAI-Search 和 Amazon
              SageMaker RAG，为该方法提供了第三方独立验证框架。


              支持的文件格式包括 PDF、TXT、DOCX、PPT/PPTX、CSV、XLS/XLSX、EML 和 HTML。预置数据连接器覆盖 Confluence、Notion、Google Drive 和
              SharePoint；网页连接器支持特定 URL 或整个域名，并可自动更新。自定义连接器可基于 OpenAPI 规范或既有 MCP server 定义编写。Knowledge Graph
              支持多跳问题（把复杂查询拆成子查询），在每个响应中提供内联来源引用以便审计，并支持跨多个组织知识库同时搜索的多图查询。可配置的检索参数包括搜索权重、grounding 级别、最大片段数和 token
              数，以及语义阈值。


              根据 API 定价页，Knowledge Graph 定价按用量计算（文档存储 + 查询成本）；截至抓取日期，公开文档未披露具体单次查询价格。数据层与三条构建路径原生集成：无代码智能体可以在构建器 UI
              中无代码接入 Knowledge Graph，Agent Builder 和 API 用户则可在多步骤工作流中把图谱查询配置为工具调用。Writer
              将图谱型检索定位为优于向量方法，尤其适用于密集文档集合会让向量相似度方法失效的集中数据场景。除 Writer 自身文档和 arXiv 论文之外，独立基准确认仍是尽调缺口。
