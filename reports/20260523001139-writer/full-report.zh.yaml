      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              企业 GenAI 市场由四个主要增长驱动。第一，董事会层面的 AI 指令：89% C-suite 高管把 AI 或 GenAI 列为前三技术优先事项，85% 正在增加 AI 支出；即便 ROI
              清晰度不足，也形成自上而下展示部署进展的压力。第二，智能体 AI 拐点：能自主执行多步骤任务的 AI 智能体出现，把价值主张从「AI 助手」变成「AI 劳动力」，打开新的预算类别，也制造竞争紧迫感。第三，早期
              ROI 证据：为 Writer 做的 Forrester TEI 研究发现，Writer 企业客户 ROI 为 333%，回本周期六个月；McKinsey 数据显示，正在主动规模化 AI
              的组织，比仍处于试点阶段的组织更可能报告实质财务影响。第四，超级用户生产力倍数：Writer 自有数据发现，AI 工具重度用户生产力高 5 倍，获得晋升的可能性高 3
              倍；亲身感受到生产率差异的员工，形成自下而上的需求压力。

              与这些顺风相对，采用受到四个结构性壁垒约束。第一，ROI 落地缺口：只有 29% 企业高管称从 GenAI 投资中看到显著 ROI，意味着大多数企业 AI
              部署尚未跨过足以支撑扩大投入的生产率门槛。第二，人才与技能缺口：按 BCG 数据，只有 6% 组织对超过 25% 员工进行过 GenAI 工具培训；PwC 的 80/20 规则——20% 技术、80%
              工作流重设计——说明单靠技术部署无法交付价值。第三，信任和治理担忧：Capgemini 发现，组织对全自主 AI 智能体的信任度一年内从 43% 降至 27%；Writer 调查中 67%
              员工认为，同事使用未经批准的 AI 工具已经造成数据泄露风险。第四，集成与数据准备度：不到五分之一组织称自身具备大规模实施智能体 AI
              所需的数据和技术基础设施高成熟度，在完整平台价值实现前形成了长周期基础设施依赖。

              净结果是：这个市场 headline 增速极高，但部署摩擦也很重，结果会分化。一小批资源充足的企业拿到显著生产率提升；更大一批企业投入很重，短期回报有限。这种动态有利于能靠开箱部署、预构建集成和变革管理支持压缩
              time-to-ROI 曲线的供应商——这正是 Writer 在平台战略中提出的价值主张。
