      - number: '7.3'
        title: 合作伙伴、依赖与竞争替代风险
        blocks:
          - type: paragraph
            body: >
              Writer 最具战略意义的风险是平台替代：企业软件巨头——Microsoft、Salesforce、Adobe 和 Google——可能扩展原生 AI 能力，吸收 Writer
              目前占据的用例，并凭借分发优势和捆绑定价挤掉独立供应商。Sacra 将这一风险记录为 Writer 的主要竞争威胁：「随着 Salesforce、Adobe 和 Microsoft 等公司把 AI
              能力深度整合进企业软件，Writer 可能被工作实际发生的平台取代。」

              Microsoft 的 M365 Copilot 是最贴近的威胁。它嵌入 Word、Outlook、Teams、PowerPoint、Excel 和 Loop——这些应用覆盖大多数 Writer
              企业客户——并继承既有 Microsoft 365 安全、隐私和合规政策。Microsoft 将 M365 Copilot 作为现有 M365 企业订阅的附加项，定价 $30/用户/月。对以 Microsoft
              为核心的企业，采购 Copilot 的路径远短于从零部署 Writer。相对 Writer， Copilot 的关键短板在于品牌语调治理偏通用、企业内容工作流自动化不够强——这正是 Writer
              的风格指南、Knowledge Graph 和 Playbooks 想填补的缺口。不过，Microsoft 的智能体平台（Copilot Studio）正在加入企业工作流自动化能力，与 Writer 的 AI
              Studio 和智能体编排功能越来越重叠。

              Salesforce Agentforce 在 CRM 邻近工作流中构成类似风险。Salesforce 同时是 Writer 的重要客户、投资方（Salesforce Ventures 共同领投 Series
              C）和直接竞争者，正在为企业工作流建设原生智能体 AI 能力。Agentforce 提供 AI 智能体的构建、部署、管理基础设施，并原生嵌入 Salesforce 平台，可访问 CRM
              数据、客户画像和企业工作流。Salesforce 的投资可能代表合作或收购的战略选项，而非纯替代意图——但这段关系带来结构性冲突。如果 Salesforce 为目前使用 Writer 的 3,000+ 名
              Salesforce 员工（第 6 章记录的部署）原生部署 Agentforce，就会构成直接客户替代事件。

              Writer 的全栈模型所有权策略部分缓释了云厂商和模型依赖风险。Writer 自有 Palmyra 模型降低了核心推理对 OpenAI 或 Anthropic 的依赖——相较纯 API
              包装型竞争者，这是有意义的结构差异。Writer 工程博客把这一点说得很明确：靠自有用例、数据、人才和组织能力建立自给能力，才是对抗 LLM 供应商锁定效应的可持续护城河。不过，Writer
              的护栏基础设施目前依赖 AWS Bedrock Guardrails 和 Azure AI Content Safety 作为外部提供商，受治理的连接器（Microsoft 365、Google
              Workspace、HubSpot、Gong）也依赖第三方 API。AWS 和 Azure 的可用性、价格变化或 API 废弃，都会影响 Writer 的护栏与连接器覆盖。Palmyra 模型训练基础设施还需要
              GPU 算力——受 H100/B200 供给约束和定价动态影响，这也是所有 AI 模型训练方共同面对的压力。

              IBM 是聚焦医疗健康沟通的战略伙伴，加深了 Writer 在该垂直行业的定位。该合作让分发更多元，但也形成依赖：如果 IBM 的 AI 战略变化（IBM 最近剥离了 Watson Health
              业务），该渠道预期贡献的管线可能下降。Anthropic 和 OpenAI 仍是 Writer 客户可通过多 LLM 架构使用的上游模型选项，但二者定价和 API 条款可能发生重大变化；OpenAI 与
              Anthropic 的企业产品如今已在完整平台层面直接竞争 Writer。
