          value: 7
          max: 10
          note: ARR 估计 $47M、增长 194%、NRR >150%，信号很强，但依据第三方估计
        - label: 竞争护城河
          value: 6
          max: 10
          note: 全栈 + 自研模型带来切换成本；面对超大规模云厂商捆绑 AI，耐久性不足
        - label: 单位经济性
          value: 4
          max: 10
          note: 毛利率、烧钱速度和 CAC 回本周期完全未披露；这是重大投资判断缺口
        - label: 风险画像
          value: 4
          max: 10
          note: 超大规模云厂商竞争、利润率不透明和模型碎片化都是重大且未充分缓释的风险
        - label: 估值纪律
          value: 5
          max: 10
          note: 以历史 ARR 计 40×，处在区间高端；只有乐观情景假设下才说得通
        - label: 证据质量
          value: 4
          max: 10
          note: 没有经审计财务、股权结构表或经验证 ARR；Sacra 估计是主要依据
    approximationNotes: 评分是分析师按 1–10 分制给出的判断，不是量化模型。低分反映数据缺失，不代表负面事实已确认。
