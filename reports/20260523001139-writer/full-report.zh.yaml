      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              评估 Writer 约 40× 过去期 ARR 对应的 $1.9B 估值，需要锚定一组 ARR 规模和增长速度可比的私有企业 AI 应用公司，同时用公开 SaaS 基准作为重力锚。可比集合显示，40×
              倍数处在私有企业 AI 区间高端，但对 150%+ 同比增长的公司并非没有先例。

              私有同行中：Glean 2024 年 9 月以 $4.6B 估值融资，ARR 约 $110M（Sacra 估计），隐含约 42× 过去期倍数——与 Writer 进入倍数相近，但 ARR
              基数更成熟，核心切入点是企业搜索。Glean 随后在 2025 年 6 月以 $208M ARR 达到 $7.2B 估值，反映高增长 AI 平台被市场重估后倍数继续扩张。Harvey 2025 年 2 月完成
              $300M Series D，估值 $3B，ARR 约 $50M，隐含约 60× 过去期 倍数——溢价来自 Harvey 高毛利的法律 AI 垂直。Cohere 2024 年 8 月以约 $62M
              ARR（Sacra 估计）达到 $5.5B 估值，隐含约 89× 过去期倍数——API 基础设施定位和更广的可服务市场溢价抬高了倍数。Jasper 是最接近的内容 AI 同行，最后一次标记为 2022 年约
              $75M ARR、估值 $1.5B，约 20× 收入——较低倍数与其模型架构差异化不足、SMB 暴露更高一致。

              公开市场锚中：BVP Nasdaq Emerging Cloud Index（EMCLOUD）在 2024–2025 年交易于 6–10× NTM 收入，反映 ZIRP 时代高位后的重置。C3.ai（NYSE:
              AI）2024 年的 NTM 收入倍数低于 5×，且收入负增长。对 Writer 估值水平最相关的公开可比，是 NTM 收入超过 $100M、增速超过 40% 的高增长 AI 原生 SaaS
              公司——这一类公司历史上在公开市场可获得 15–25× NTM 收入。Writer 这种增速的公司一旦达到规模并具备利润率，隐含公开市场重力锚约为 $85–120M ARR 对应 $1.5–3B
              估值，与我们的基准情景区间一致。

              Bessemer State of the Cloud 2024 报告认为，私有 AI 应用公司相对传统云倍数享有溢价，因为它们具备前五分之一 NRR、ACV 快速扩张，以及历史 ARR
              尚未捕捉的智能体变现向量——这些因素部分解释了 Writer 相对公开 SaaS 基准的溢价。不过，BVP 也警告私有市场「可以说再度起泡，很大程度上由 AI Cloud
              推动」，提示投资人应对终值假设做压力测试，考虑倍数压缩可能性。
