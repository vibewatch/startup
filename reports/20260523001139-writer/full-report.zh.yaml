  - id: TP004
    title: 护城河耐久性与竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - 自研 Palmyra LLM 系列
        - 模型商品化：开源和第三方 LLM 快速进步，削弱 Palmyra 的差异化； 成本/性能曲线收窄差距
        - 高
        - 按季度跟踪开源 LLM 基准；量化 Palmyra 在受监管行业任务上的性能差距； 摸清维持性能领先所需的研发投入
      - - Knowledge Graph 企业数据锁定
        - 竞品做出同等 RAG / Knowledge Graph 能力；云厂商提供成本更低的 RAG 基础设施（Azure AI Search、Vertex AI Search）
        - 中
        - 记录企业客户搭建 Knowledge Graph 的中位时间和成本；确认 Knowledge Graph 模式是否可导出（可迁移性风险）
      - - SOC 2 / HIPAA / ISO 42001 合规状态
        - 合规认证变成企业 AI 平台标配；主要厂商都拿到认证后， 单靠合规不再能差异化
        - 低–中
        - 每年跟踪关键竞品认证状态；竞品尚未取得 ISO 42001 时， 突出 Writer 的 ISO 42001 AI 管理认证
      - - 品牌语调与内容治理
        - Microsoft Copilot 和 Grammarly Business 增加品牌治理功能；内部风格指南工具可能替代
        - 中
        - 评估品牌语调导入/导出的深度；判断品牌语调配置能否迁移到竞品平台； 在明确把留存归功于品牌治理的账户中拿到胜出证据
      - - 落地扩张型多部门锁定
        - Microsoft 先把 Copilot 打包进 M365，抢在 Writer 从初始部门扩张之前； Salesforce Agentforce 在 CRM 工作流内扩张，先于 Writer 进入收入团队
        - 高
        - 衡量现有客户从首个部门扩到第二个部门所需时间；跟踪 Writer 账户中的 Copilot 采用率； 摸清跨部门高管拥护者的稳定性
      - - 企业渠道覆盖（300+ 账户）
        - 既有厂商（Microsoft、Salesforce）借现有续约周期给出有竞争力的价格； Writer 最初的试点部门可能被整合进既有厂商 AI 许可证
        - 高
        - 跟踪续约周期中的竞品替换动作；确认按队列拆分的 NRR 和总流失率； 要求披露 Writer 被 M365 Copilot 或 Agentforce 替换的账户数据
      - - 全栈企业 AI 定位
        - 模块化 AI 市场：企业按用例挑选同类最佳工具，而不是采购全栈平台； 平台整合叙事可能落空
        - 中
        - 跟踪现有账户中的多用例采用；衡量每账户钱包份额增长； 询问客户当前 IT 偏好是平台整合还是同类最佳
      - - 摆脱第三方 API 的模型独立性
        - Anthropic 或 OpenAI 推出企业专用应用层，在自家模型上直接提供预构建工作流， 从而绕开 Writer 的平台价值
        - 中–高
        - 跟踪 OpenAI GPT Store 和 Anthropic Claude Artifacts，寻找与 Writer 特定用例智能体竞争的企业工作流模板
    notes: >
      严重性评估是基于截至 2026-05-23 公开证据的尽调阶段估计。“高”表示若不缓解， 威胁可能在 12–24 个月内实质性压低 Writer 的市场份额或 ARR 轨迹。 “中”表示时间窗口为 24–36
      个月。“低”表示除非市场发生重大变化，否则 2028 年前不太可能落地的结构性威胁。
    claimRefs:
