      - number: '3.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 自研 Palmyra 栈创造可防守的独立性
            body: >
              Writer 是少数通过 Palmyra 家族掌握完整模型栈的企业 AI 应用层供应商之一。这让公司在结构上独立于 OpenAI 和 Anthropic 的 API 定价变化、容量约束和战略转向——所有依赖
              API 的企业 AI 供应商都必须承受这些风险。Palmyra 的 ISO 42001 AI 管理认证，进一步在受监管行业采购中区分 Writer。
            calloutType: insight
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: Microsoft M365 Copilot 打包是主要结构性威胁
            body: >
              Microsoft 365 Copilot Chat 零增量成本，加上付费 Copilot 层可被打包进 M365 企业协议，形成价格锚。在 M365 已是主要生产力套件的账户里，Writer 的 $29 /
              席入口相比之下显得昂贵。若要在 IT 决策者掌控 M365 续约的账户中替代 Copilot 或与其共存，Writer 必须在品牌治理、Knowledge Graph 深度和受监管行业合规上证明清晰差异化。
            calloutType: insight
