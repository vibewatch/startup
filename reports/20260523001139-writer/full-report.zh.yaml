  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              2026 年，企业生成式 AI 市场的竞争分为两个清晰层级：出售 API 访问和定制模型能力的基础模型及基础设施供应商；以及把打包企业 AI 工作流交付给业务用户的应用层平台。Writer 位于应用层，但通过自有
              Palmyra 基础模型家族实现差异化——公司因此处在两个层级之间，也降低了对 OpenAI、Anthropic 或 Cohere 第三方模型 API 的依赖。

              竞争版图可分为五类。第一，横向 AI 平台既有巨头：Microsoft 365 Copilot、Google Workspace Gemini 和 Salesforce
              Agentforce。它们受益于深厚的企业安装基数——Microsoft 拥有 4 亿多 M365 用户，Salesforce 掌握多数企业账户的 CRM 工作流，Google Workspace
              渗透数十万家组织。这些巨头可以以很低的边际增量成本，把 AI 能力打包进既有合同，形成纯 AI 平台必须跨过的激进价格锚。

              第二，AI 基础模型供应商：OpenAI（ChatGPT Enterprise）、Anthropic（Claude Enterprise）和 Cohere 以模型能力、API
              访问和私有部署选项竞争。它们面向的企业更倾向于在模型之上构建自定义 AI 应用，而非购买预构建工作流。Writer 的 Palmyra 在这一层间接竞争，而 Writer 自有平台则位于其上。

              第三，营销 / 内容 AI 专家：Jasper 和 Copy.ai 仍聚焦营销团队和 GTM 工作流。Jasper 的 100 多个专用 AI 营销智能体，以及 Copy.ai 基于 credit 的 GTM
              自动化平台，比 Writer 跨职能企业愿景更窄，但能在完整企业级 Writer 部署之前先赢得部门预算。

              第四，写作和沟通工具：Grammarly Business 及其 Superhuman Go AI 智能体产品，占据写作辅助和沟通治理类别，拥有 15 年品牌声誉，并服务 70,000+
              企业团队。Grammarly 向智能体 AI 扩张，是对 Writer 领地的直接竞争切入。

              第五，替代方案和维持现状选项：内部 IT 自建 prompt pipeline（直接使用 LLM API）、专业服务项目（如 Accenture AI）以及「不做 /
              等一等」仍是最常见竞争姿态。值得注意的是，Writer 每一次输给既有巨头打包方案或「内部自建」决策，都是一次失去的 land-and-expand 机会，并带来多年 ARR 影响。
