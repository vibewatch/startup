      - number: '1.3'
        title: 融资历史、估值与财务快照
        blocks:
          - type: paragraph
            body: >
              Writer 累计融资约 $326M，多轮融资后，在 2024 年 11 月最近的 Series C 中达到 $1.9B 估值。Series C 规模为 $200M，据报道新老投资人均参与。此前轮次包括由
              ICONIQ Growth 领投的 $100M Series B（2023 年 9 月），WndrCo、Balderton Capital、Insight Partners（Series A 领投方）和
              Aspect Ventures 参投。Series B 中值得注意的客户投资人包括 Accenture 和 Vanguard。种子轮由 Aspect Ventures 领投。

              根据第三方分析机构 Sacra（截至 2024 年 11 月的数据），Writer 收入轨迹显示公司年经常性收入约为 $47M，较 2023 年估计 $16M ARR 同比增长约 194%，而 2022 年
              ARR 约为 $2M。这意味着两年期收入复合年增长率超过 200%。Series C 的 $1.9B 估值约为过去 ARR 的 40 倍，属于企业 AI 估值最高梯队的溢价水平，但需要持续超高速增长才能支撑。

              Salesforce Ventures 另于 2025 年 10 月披露，作为其 $1B AI 基金部署的一部分，对 Writer 做出新投资，但未披露 Writer 单项支票规模。Sacra 还报告称，截至
              2025 年 6 月，Writer 最近披露的估值为 $1.98B，累计融资 $326M。毛利率、烧钱速度、现金跑道和净留存率未公开披露。Growjo 估计，截至 2026 年 5 月，员工数约为 1,715
              人，同比增幅 168%；但这个数字可能包含全职员工、承包商或海外等效人员，应视为估计值。
