      - number: '6.3'
        title: 留存、持久性与扩张信号
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Writer 尚未公开披露净收入留存率（NRR）、总收入留存率（GRR）、年度 logo 流失率或平均合同期限。这对成长阶段私有公司来说是常见情况，但也让最根本的 SaaS
              健康指标留下重大尽调缺口。

              代理指标显示底层留存可能较强。Qualcomm 案例研究披露 85% 周活跃使用率和 60% 每周多次使用率；这类参与度指标更像深度嵌入、反复使用的平台，而不是偶发试验。Commvault 一年内日活使用率从
              30% 提升至 80%，说明粘性随时间增强。Adore Me 作为 alpha tester 的多年关系，至少说明客户保留了两到三年。HubSpot 内容设计负责人明确把使用 Writer
              之前的状态称为「黑暗时代」——这是高切换成本和低流失倾向的强定性信号。

              Balderton 引用的 Writer 组合平均 9x ROI，也强化了留存逻辑。如果客户确实获得 9x 回报，理性续约率应当较高。但这一说法是公司通过融资公告传达的，未经独立审计；方法论（纳入多少客户、ROI
              如何计算、时间跨度）没有披露。

              先落地、再扩张是 Writer 留存与 NRR 叙事的核心。部署持续显示跨部门扩散：Qualcomm 从营销和传播扩展到法律、产品、分析、销售、L&D 和 HR；Salesforce 增至 9+ 个部门；N26
              从内容设计扩展到法律和营销团队；Commvault 从营销试点扩展到全公司部署。如果这种扩张拉动席位和用量型增购，NRR 应显著高于 100%。Sacra 研究报告指出，2023 年末 Series B 时
              NRR「超过 150%」，说明扩张动作在更早阶段已带来强净留存。但这一水平是否在 2024–2025 年规模化期间持续，尚未确认。

              Writer 2026 年 AI Adoption Survey（与 Workplace Intelligence 联合执行，n=2,400）揭示了更具挑战的行业背景：只有 29% 公司报告生成式 AI 带来显著
              ROI，79% 面临采用挑战。Writer 把这组数据作为支撑其平台路径的市场背景，但它也说明，广泛采用 AI 的客户——包括 Writer
              客户——可能难以实现全组织转型，从而在初始试点无法规模化的账户中压低扩张收入。

              头部客户收入集中度完全未披露。在 300+ 客户和估计 $47M ARR 的背景下，少数大型
              logo（Uber、Vanguard、Salesforce、Qualcomm）可能贡献了不成比例的收入份额。Balderton 公告强调这些旗舰客户，虽有营销正面作用，也可能说明它们是主要商业锚点。要求提供
              top-5 或 top-10 客户收入集中度，是优先尽调动作。
