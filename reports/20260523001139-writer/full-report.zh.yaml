          - type: callout
            title: 反向：私有 AI 市场倍数压缩风险
            body: >
              Bessemer Venture Partners 的 2024 State of the Cloud 报告明确警告，私有 AI 领域「可以说再度起泡」；CB Insights 数据显示，2025 年 AI
              融资市场越来越头部化，79% 资本流向巨额融资轮（$100M+）。在这种环境下，以 Writer
              规模错过增长目标的公司会面对更紧的再融资条件，因为资本正集中到已验证的领导者（Anthropic、OpenAI、xAI）。若 Writer 2025 年增长放缓，同时更广泛的私有 AI
              市场压缩倍数，将形成复合负面压力——既压经营表现，也压投资人风险偏好——下一次融资可能变成降价轮。
