    description: >-
      Enumeration of primary market acceleration forces and friction points shaping enterprise GenAI adoption velocity
      through 2027.
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >
        Drivers and constraints synthesized from McKinsey State of AI 2025, BCG GenAI survey (1,400+ C-suite), PwC 2026
        AI Predictions, Capgemini GenAI in Organizations 2024, Capgemini Rise of Agentic AI, Gartner newsroom (April–May
        2026), Writer 2026 AI Adoption Survey, and Deloitte Insights AI analysis. Coverage is limited to factors
        affecting enterprise AI platform adoption; infrastructure, geopolitical, and macroeconomic factors are noted but
        not exhaustively enumerated.
    notes: |
      “强度”评级是基于分析机构来源中佐证出现频率与一致性的定性判断，而非量化测量。“关键证据”引用可用的最具体数据点；完整来源引用见 声明和来源章节。
    columns:
      - 类型
      - 因素
      - 强度
      - 关键证据
      - 对 Writer 的影响
    rows:
      - - 驱动因素
        - 董事会层面的 AI 指令
        - 很强
        - 89% 高管将 AI 列为前三优先事项（BCG）；85% 正在增加 AI 支出
        - RFP 环境有利；供应商选择前预算已拨出
      - - 驱动因素
        - 智能体 AI 拐点
        - 强
        - 62% 正在试验智能体（McKinsey）；Capgemini 预计经济价值 $450B
        - Writer 的多智能体平台直接切入增长最快的细分
      - - 驱动因素
        - 早期 ROI 证据
        - 中等
        - 333% ROI、6 个月回本（Forrester TEI for Writer）；McKinsey 显示，规模化组织报告影响的可能性高 3×
        - 支持基于 ROI 的销售；降低采购风险感知
      - - 驱动因素
        - 超级用户生产率倍增器
        - 中等
        - Writer 超级用户生产率提升 5×、晋升率 3×
        - 培育内部拥护者；支撑初始部署之外的自下而上扩张
      - - 约束
        - ROI 落地缺口
        - 很强
        - 只有 29% 看到显著 ROI（Writer 调研）；66% 对 GenAI 进展不满意（BCG）
        - 必须缩短实现 ROI 的时间；ROI 不达预期的客户可能流失
      - - 约束
        - 人才与技能缺口
        - 强
        - 只有 6% 企业对 >25% 员工进行 GenAI 培训（BCG）；PwC：80% 价值来自工作流重设计，而非技术
        - 需要打包变革管理和培训；不能依赖自助式部署
      - - 约束
        - 信任与治理担忧
        - 强
        - Capgemini：对自主 AI 智能体的信任一年内从 43% 降至 27%；Writer 调研：67% 担心未经批准的 AI 引发数据泄露
        - 安全、可审计性和数据隔离是硬性采购要求，不是差异化点
      - - 约束
        - 集成与数据就绪度
        - 强
        - Capgemini：少于 1/5 的组织具备面向智能体 AI 的高成熟度数据基础设施；只有 2% 达到全量智能体部署规模
        - 售前必须评估数据就绪度；集成深度是竞争护城河
    claimRefs:
