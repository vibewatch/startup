  - id: FE001
    title: Writer 平台架构栈
    type: stack
    layout: wide
    summary: |
      五层架构，展示 Writer 的数据、模型、构建、激活和监督层如何互联，交付有治理的企业 AI 智能体。
    data:
      layers:
        - label: 监督层
          detail: >-
            运行时治理控制：LLM Gateway 管理模型路由；与 AWS Bedrock 和 Azure AI Content Safety 集成的 Guardrails 在调用前 / 调用中 / 调用后拦截智能体请求；AI
            Studio 提供审计日志、RBAC、限流和部署前审批流。
          items:
            - LLM Gateway（自助模型接入、健康检查、负载均衡）
            - Guardrails（AWS Bedrock Guardrails / Azure AI Content Safety — 调用前 / 调用后 / 调用中）
            - 审计日志与事件记录（AI Studio）
            - 限流 / 请求缓存
            - RBAC / 最小权限
            - 智能体审批流（部署前）
        - label: 激活层
          detail: 自主执行层：Writer Agent 规划并运行多步骤工作流，已部署的无代码智能体处理重复任务；MCP Gateway 对接入企业系统的每一次智能体-工具交互执行 4 层身份与权限校验。
          items:
            - Writer Agent（自主多步骤任务执行）
            - 已部署无代码智能体（模板库）
            - API 嵌入式智能体调用（Applications API）
            - MCP Gateway（4 层 IdP + 权限 + 筛查 + 完整性）
        - label: 构建层
          detail: >-
            三条构建路径：面向零代码可视化组装的无代码 Agent Builder，用于低代码条件逻辑的 Agent Builder，以及 Writer Framework（开源 Python + 拖拽
            UI、WebSocket、<2ms 开销），再加 REST API 和官方 SDK，支撑全代码开发。
          items:
            - 无代码 Agent Builder（可视化、零代码）
            - Agent Builder（低代码、条件逻辑）
            - Writer Framework（Python + 拖拽式 UI、WebSocket、<2ms 开销）
            - REST API / Python SDK（writerai，PyPI）/ Node SDK（writer-sdk，npm）（开发者接口）
        - label: 模型层
          detail: >-
            Palmyra 自研 LLM 家族加外部模型集成：Palmyra X5（1M-token 上下文，$0.60/1M 输入）、Palmyra X4（128k ctx，HELM 工具调用得分领先）、专业模型 Jul
            2026 弃用；外部提供商（AWS Bedrock、Azure、NVIDIA NIM）可通过 LLM Gateway 接入。
          items:
            - Palmyra X5（1M ctx，$0.60/1M 输入，正式可用；Agent Builder Beta 阶段）
            - Palmyra X4（128k ctx，$2.50/1M 输入，正式可用）
            - Palmyra Fin / Med / Creative（Jul 13, 2026 弃用）
            - 外部模型：AWS Bedrock、Microsoft Azure、NVIDIA NIM
        - label: 数据层
          detail: >-
            Knowledge Graph 的图式 RAG 从文件（PDF、DOCX、CSV、XLS、PPT、EML、HTML）和预置连接器（Confluence、Notion、Google
            Drive、SharePoint）摄取企业数据，构建语义关系图，并给出带内联引用的多跳、有依据答案。
          items:
            - Knowledge Graph（图式 RAG、多跳问答、内联引用）
            - 预置连接器：Confluence、Notion、Google Drive、SharePoint
            - Web 连接器（URL / 域名爬取，自动更新）
            - 自定义连接器（OpenAPI 规范或 MCP 服务器定义）
            - 文件上传：PDF、DOCX、CSV/XLS、PPT、EML、HTML
    approximationNotes: |
      层级顺序（顶部 = 监督层 → 底部 = 数据层）反映 Writer 提出的 Build-Activate-Supervise 产品理念。具体基础设施拓扑（云区域、计算节点）未公开披露。
    claimRefs:
      - CE015
      - CE016
      - CE022
      - CE023
      - CE026
      - CE030
