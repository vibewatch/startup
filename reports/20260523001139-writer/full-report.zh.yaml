    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >
              Writer（writer.com）是一家端到端企业生成式 AI 平台，总部位于 111 Maiden Lane, 4th Floor, San Francisco, CA 94108。公司由 May
              Habib（CEO 兼联合创始人）和 Waseem AlShikh（CTO 兼联合创始人）于 2020 年创立；两人在 2013 年起曾在 Qordoba 共事，Qordoba
              是一家软件本地化和机器翻译企业平台。两位联合创始人看到基于 transformer 的 AI 模型可能带来范式变化后，创办 Writer，把生成式 AI 的能力带进企业。

              Writer 对外宣称的使命，是通过超级智能扩展人的能力，打造把「人的潜力与繁荣置于核心」的 AI。公司称自己是「全球企业 AI 先行者」，并把平台定位成领先企业编排 AI
              驱动工作的场所。组织可以在平台上构建、激活并监督 AI 智能体；这些智能体以公司数据为 grounding，由 Writer 自研的 Palmyra 大语言模型家族驱动。

              Writer 的商业模式是企业订阅 SaaS。公司提供每席每月 $29 的 Starter 计划，以及定制报价的 Enterprise
              计划。企业合同包含按席位和按使用量计费的部分，可选解决方案包和专业服务。Writer 采用 land-and-expand 策略：先在特定部门或用例落地，再在组织内自然扩张。平台接入 Microsoft
              365、Google Workspace、Salesforce、HubSpot、Gong 等常见企业系统，形成较深的工作流锁定。截至 2026 年 5 月，Writer
              在旧金山（总部）、纽约、伦敦、芝加哥和奥斯汀设有办公室。
