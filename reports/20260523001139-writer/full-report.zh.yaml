      - - 客户集中度悬崖
        - 前三大客户占 ARR > 35%
        - 单一大客户流失会造成 12–15% 的 ARR 断崖；增长轨迹失效
        - 要求收入集中度陈述与保证；探索托管安排
      - - 超大规模云厂商替代事件
        - 2025 年 Microsoft / Google Workspace AI 抢走 Writer 已列名潜在客户管线的 >25%
        - CAC 上行、管线被压缩，会让增长低于基准情景假设
        - 按季度监控；若 2025 队列净新增低于预期 30%+，触发重评
    notes: 这些触发项是尽调关口，不是投后 KPI。在以 $1.9B 标记作出新承诺前，六项都必须验证。
    claimRefs:
      - CV039
      - CV041
      - CV043
  - id: TV006
    title: 最终尽调资料请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 核验
        - 经审计或 CFO 出具证明的 ARR 明细表，按季度展示截至 Q4 2024 的队列瀑布
        - Sacra 的 $47M 是第三方估计；承保不能建立在未经核验的数字上
        - 向 CFO 索取并放入数据室；与资产负债表递延收入交叉核对
      - - 按产品线拆分的毛利率
        - 经审计的损益表（P&L），或管理层按收入分部编制的毛利明细表（平台订阅、API 调用、专业服务（PS））
        - 自研模型托管可能把 GM 压到企业 SaaS 常态以下；这会直接影响 DCF 和倍数选择
        - 向 CFO 索取；结合 AWS 推理成本披露和定价数据交叉验证
      - - 烧钱速度与现金余额
        - 截至 2024 年 12 月的月度现金消耗和银行余额
        - 现金跑道决定再融资风险和谈判筹码；按估计烧钱速度，$200M Series C 意味着 18–24 个月跑道
        - 索取银行对账单或司库报告；与员工数增长数据交叉核对
      - - 股权结构表与优先股堆叠
        - 完整股权结构表，列明优先权金额、参与型 / 非参与型、棘轮条款和反稀释条款
        - 后期轮优先权悬挂会在温和退出情景下侵蚀普通股回报
        - 向公司法律顾问索取；审查标准投资者权利协议
      - - 客户集中度
        - 前 10 大客户 ARR 贡献和合作年限；最早续约日期
        - 单一大客户流失会造成收入断崖，并在队列数据里显现
        - 索取客户收入明细表；通过法律审查确认续约条款
      - - AWS Bedrock 收入分成条款
        - AWS Bedrock marketplace 上架的经济条款，包括收入分成比例和最低承诺
        - 分成会压低 AWS 渠道收入的有效毛利率；未披露敞口会影响 GM 计算
        - 索取合作伙伴协议条款；与标准 AWS marketplace 分成披露对照
    notes: 六项都关系到以 $1.9B 入场标记承保。公开来源拿不到其中任何一项；都需要数据室访问或直接接触公司。
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
