    type: journey-map
    layout: wide
    summary: |
      企业客户从市场认知到多部门扩张的端到端旅程，展示 Writer 在各阶段瞄准哪些客户细分，以及基于公开案例研究，落地扩张动作如何运转。
    data:
      nodes:
        - id: awareness
          label: 1. 市场认知
          detail: >-
            企业 AI 买家通过分析师报告（Gartner、IDC）、投资人网络（ICONIQ、Balderton）、AWS Bedrock 市场、同行推荐，或围绕 Series B/C 融资和 Palmyra
            模型发布的公关传播了解到 Writer
        - id: evaluation
          label: 2. 评估与概念验证
          detail: AI 或内容副总裁 / 总监围绕 1–3 个用例运行试点；Qualcomm 试点用户选择加入率 100%；Writer 提供分批培训、入驻支持和用例工作坊
        - id: initial-deploy
          label: 3. 首个部门部署
          detail: Writer 部署到首个购买团队（通常是营销、传播或内容设计）；配置品牌规则、风格指南和术语库；测量首批 ROI（节省时间、提升质量）
        - id: expansion
          label: 4. 跨职能扩张
          detail: 口碑和 FOMO 把采用推向相邻部门（法务、产品、HR、销售、客户支持）；识别新的内部推动者；Qualcomm：8 个职能；Salesforce：9+ 个部门；N26：内容→法务→营销
        - id: platform-embed
          label: 5. 平台嵌入
          detail: >-
            基于专有数据构建 Knowledge Graph；定义 70+ 条工作流（Qualcomm）；部署自定义 AI 智能体（Salesforce：50 名内部推动者构建智能体；Commvault：Ask
