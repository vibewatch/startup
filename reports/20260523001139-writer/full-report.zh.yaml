      - number: '7.2'
        title: 安全、质量与运营风险
        blocks:
          - type: paragraph
            body: >
              企业 AI 平台的运营风险更复杂：既要承担传统 SaaS 的安全义务，又会暴露在 AI 特有失效模式下。对 Writer 而言，核心风险集中在四类：（1）AI 幻觉与输出质量；（2）自主智能体获得企业系统写入 /
              删除权限后，智能体系统治理出现缺口；（3） OWASP LLM Top 10 覆盖的威胁面；（4）供应链与基础设施可用性。

              独立研究中，AI 幻觉最常被企业列为 AI 采用担忧。McKinsey 的 State of AI 2025 调查（n=1,491）显示，33% 的组织报告过 AI 不准确带来的后果，是最常见的 AI
              相关负面结果。Gartner 的 AI TRiSM 框架指出，「未能持续管理 AI 风险的组织，出现项目失败、泄露等负面结果的倾向会呈指数级上升。」落到
              Writer，受监管垂直行业里的幻觉风险更实：Palmyra Med 如果编造医疗代码，或 Palmyra Fin 在财务报告里误引监管数据，部署企业都可能承担重大合规责任。Writer 的缓释组合包括： 以
              Knowledge Graph 扎根的 RAG 架构（把输出锚定在客户特定的已验证数据，而非模型参数记忆）、调用前、调用后 和调用中三层可配置护栏，以及 Palmyra X5 的扩展上下文（4M token
              窗口），支持整篇文档扎根。不过，护栏文档明确写到，使用 API/SDK/Agent Builder 时，护栏「只适用于外部提供商模型」——这意味着 API 场景下，Palmyra
              原生护栏覆盖度尚未完全追平外部模型护栏。这是残余成熟度缺口。

              OWASP GenAI Security Project 的 LLM Top 10 将提示词注入、不安全输出处理、训练数据投毒、模型拒绝服务、供应链漏洞和过度代理列为主要 LLM 应用安全风险。Writer
              的智能体平台让自主智能体跨 Microsoft 365、Google Workspace、HubSpot、Gong、Salesforce 和企业数据存储获得读 / 写 /
              删除权限，因此抬高了「过度代理」风险（LLM08），也带来 Sacra 列为公司特定首要风险的智能体治理复杂度。 Writer
              的缓释措施包括细粒度权限控制（最小权限访问）、所有智能体动作的审计日志、带有人在回路检查点的智能体监督套件，以及支持 MFA 的企业级 SSO。 不过，Sacra
              指出「智能体监督套件仍处于早期访问，相比已经授予的系统访问广度，治理工具尚不成熟」——这坦率承认产品能力走在治理基础设施前面。 Writer 的 2026 AI Adoption Survey 显示，67%
              的高管认为公司因未获批准的 AI 工具遭遇过数据泄露或入侵，35% 承认无法立刻「拔掉」失控智能体的插头——这是市场层面的信号：治理缺口普遍存在，Writer 的监督工具即便仍在早期，也具备商业差异化。

              基础设施与可用性风险只能部分观察。Writer 运行在主要云厂商之上（护栏集成使用 AWS 和 Azure，DPA 语言显示数据供给还涉及 GCP）。
              单一云集中或大型云厂商故障会影响服务可用性，但多云护栏架构降低了爆炸半径。Writer 的安全体系包括专职安全团队、年度第三方渗透测试，以及 trustcenter.writer.com 信任中心。ISO
              27001:2022 认证从整体覆盖信息安全管理；SOC 2 Type II（覆盖安全性、可用性和保密性） 则是企业采购最直接相关的独立保证。截至 runDate，未发现公开的 Writer 安全事件。
