        title: 管理层、董事会与关键人物风险
        blocks:
          - type: paragraph
            body: >
              Writer 由两位联合创始人 May Habib（CEO）和 Waseem AlShikh（CTO）领导。两人共事超过十年，兼具技术深度和企业销售经验。May Habib 自创立以来担任 CEO，负责
              Writer 的 go-to-market 和企业战略；Waseem AlShikh 负责 AI 研究与工程。作为一家 IPO 前创业公司，Writer 配置了异常完整的
              C-suite，显示公司试图在创始人层之外补强运营纵深。截至 2026 年 5 月的 About 页面，领导团队包括 Andy Shorkey（Chief Revenue Officer）、Diego
              Lomanto（Chief Marketing Officer）、Roger Kopfmann（Chief Financial Officer）、Brian O'Reilly（Chief Operating
              Officer）、Jevan Lenox（Chief People Officer）、Mina Alaghband（Chief Customer Officer）、Eric Freeman（Chief
              Information Security Officer）、Kevin Chung（Chief Strategy Officer）、Maureen Little（SVP Partnerships）和 Rowan
              Reynolds（General Counsel）。

              关键顾问包括 Doug Pepper（General Partner，ICONIQ Growth）、Jamie Barnett（Investor & Advisor）、Radhika
              Venkatraman（Senior Advisor，Cerberus Capital Management）和 Whit Bouck（Managing Director，Insight
              Partners）。顾问阵容同时覆盖主要投资人和战略金融伙伴。

              关键人物集中风险偏高：产品愿景和 AI 研究方向都高度依赖两位联合创始人；两人在所有融资轮中都保持控制力。公开资料没有披露双重股权结构或保护性条款。Qordoba 到 Writer
              的集中式领导传承是优势——深厚互信和企业领域经验——但若任一创始人离开，也会形成依赖。
