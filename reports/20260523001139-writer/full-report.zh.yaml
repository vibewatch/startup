  - id: TI005
    title: 公开财务披露缺口
    columns:
      - 缺失指标
      - 对投资评估的影响
      - 精确尽调路径
    rows:
      - - 经审计财务报表（P&L、资产负债表、现金流量表）
        - 阻断性 — 缺少独立依据，无法核验收入、利润率或烧钱速度
        - 要求开放数据室，提供 FY2023、FY2024 和 YTD FY2025 经审计或 CPA 审阅的财务报表
      - - 按收入流划分的毛利率（订阅、API、服务）
        - 阻断性 — LLM 托管成本可能让毛利率比 SaaS 常模低 10–25 个百分点；没有该数据就无法建模单位经济
        - 要求提供 COGS 拆分，区分基础设施 / 模型托管、软件交付和专业服务
      - - 截至运行日期的月度烧钱速度和现金余额
        - 重大 — 现金跑道取决于烧钱速度；缺少该数据就无法评估资本是否充足
        - 要求提供过去 12 个月的月度现金流量表和当前银行余额
      - - 客户收入集中度（前 10 大客户占 ARR 的比例）
        - 重大 — 单一客户依赖超过 ARR 的 10% 就构成实质集中风险
        - 要求提供客户收入集中度表（按 ACV 排名前 10）及流失 / 续约历史
      - - 净留存率（当前；队列级）
        - 重大 — 2023 年 Series B 时披露的 >150% NRR 已经陈旧；2024 队列当前 NRR 决定扩张轨迹
        - 要求提供按队列划分的 NRR 瀑布：2022 队列、2023 队列、2024 队列（企业与 SMB 分开）
      - - 按渠道划分的 CAC 和回本周期（实际）
        - 重大 — 6 个月回本（Forrester，委托研究）未经核验 CAC 支撑，不能直接采用
        - 要求提供过去 8 个季度按渠道划分的实际销售和营销支出、各渠道新增 ARR，以及 ACV 与 CAC 比率
      - - 递延收入排期
        - 次要 — 多年合同会形成递延收入；确认节奏会影响收入质量判断
        - 要求提供递延收入瀑布和多年合同占总预订额的比例
      - - 盈利路径 / 经营模型（目标利润率、时间表）
        - 重大 — $1.9B 估值建立在最终达到 SaaS 级盈利能力的前提上；公司没有公开指引
        - 要求提供内部财务模型，列出 FY2026–FY2028 的收入、毛利率和 EBITDA 目标
    notes: |
      「阻断性」表示该缺口会阻止完整的财务投资评估。「重大」表示该缺口会显著影响判断， 但仍可能允许部分评估。所有缺口均基于截至运行日期（2026-05-23）的公开信息。
    claimRefs:
      - CI031
      - CI032
      - CI034
      - CI035
      - CI036
      - CI037
