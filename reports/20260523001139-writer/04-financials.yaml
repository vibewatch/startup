  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: >
        Audited or reviewed gross margin by revenue stream (platform subscription, model API,
        professional services) for FY2024 and FY2025.
      whyItMatters: >
        LLM inference infrastructure costs may compress gross margin 10–25 points below pure-software
        SaaS norms; without this data, the margin path to profitability cannot be assessed.
      diligencePath: >
        Request data room access to audited financial statements with COGS breakdown; specifically,
        separate infrastructure/model hosting costs from software delivery and professional services.
      relatedQuestionRefs:
        - QI007
        - QI012
        - QI022

    - type: private-evidence-only
      severity: blocking
      topic: burn rate and cash position
      missingEvidence: >
        Actual monthly burn rate and current cash balance as of the run date; the Series C amount
        is confirmed but the rate of consumption is not.
      whyItMatters: >
        Capital adequacy and runway depend entirely on burn; an estimated $5–10M range is too wide
        for underwriting. Actual burn determines whether the $200M is sufficient through the next
        planned milestone.
      diligencePath: >
        Request monthly P&L and cash-flow statement for the trailing 12 months, treasury balance as
        of the most recent month-end, and any committed financial obligations.
      relatedQuestionRefs:
        - QI010

    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: >
        Customer revenue concentration table showing what share of ARR comes from the top 10 customers
        and churn/renewal history by cohort.
      whyItMatters: >
        Uber, Accenture, Salesforce, Vanguard, and Qualcomm are identified as major customers; if any
        top-3 represent more than 10% of ARR individually, this is a material revenue-quality risk.
      diligencePath: >
        Request customer revenue concentration (top-10 by ACV, by % of ARR), cohort NRR by year-of-
        first-purchase, and a list of churned customers in FY2024.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI005

    - type: missing-source
      severity: material
      topic: current NRR
      missingEvidence: >
        A 2024 or 2025 net revenue retention figure; the only disclosed NRR (>150%) is from the
        September 2023 Series B and may not reflect the current customer mix as Writer expanded
        beyond its core early-adopter base.
      whyItMatters: >
        NRR is the primary driver of ARR compounding; if NRR has declined from >150% as the customer
        base scaled and competition intensified, the growth story materially weakens.
      diligencePath: >
        Request NRR by cohort (2022, 2023, 2024 year-of-first-purchase), segmented by enterprise vs.
        SMB, and by industry vertical.
      relatedQuestionRefs:
        - QI004

    - type: missing-source
      severity: material
      topic: profitability path
      missingEvidence: >
        An internal financial model or any public disclosure of target gross margin, EBITDA target,
        or expected break-even timeline for Writer.
      whyItMatters: >
        The $1.9B valuation is premised on eventual SaaS-like profitability; without a stated path,
        the terminal value assumption underlying the multiple is entirely speculative.
      diligencePath: >
        Request the board-level financial model used to size and justify the Series C, including
        ARR, gross margin, and EBITDA projections for FY2025–FY2028.
      relatedQuestionRefs:
        - QI006
        - QI021

    - type: private-evidence-only
      severity: minor
      topic: compute cost per customer
      missingEvidence: >
        Per-customer compute infrastructure cost (GPU/CPU hosting, inference serving) that feeds
        directly into variable COGS and gross margin.
      whyItMatters: >
        Enterprise customers running high-volume agentic workflows (e.g., Uber's customer support
        agents) may generate inference costs that materially differ from seat-based software economics.
      diligencePath: >
        Request COGS allocation methodology, infrastructure cost per active enterprise seat, and
        model-serving cost per million tokens at scale.
      relatedQuestionRefs:
        - QI022

    - type: missing-source
      severity: minor
      topic: competitive pricing benchmarks
      missingEvidence: >
        Published pricing for Writer's direct competitors (Jasper, Copy.ai, Grammarly Business)
        at the enterprise tier is largely opaque or contact-sales only; no public side-by-side
        pricing comparison exists.
      whyItMatters: >
        Without comparable enterprise list prices, it is not possible to determine whether Writer's
        contact-sales model prices at a premium, discount, or parity relative to peers.
      diligencePath: >
        Request enterprise benchmark pricing data from industry analysts (IDC, Gartner); obtain
        competitive bid comparisons from customer references.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: minor
      topic: AWS Bedrock revenue contribution
      missingEvidence: >
        Writer does not disclose the revenue contribution of its AWS Bedrock distribution channel,
        the revenue-share terms with Amazon, or the mix of API-direct vs. Bedrock-mediated customers.
      whyItMatters: >
        If Bedrock becomes the primary enterprise distribution channel, Amazon's revenue share
        would reduce realized margins on API revenue and change the channel economics materially.
      diligencePath: >
        Request revenue split by channel (direct enterprise sales, API-direct, Bedrock marketplace,
        other cloud marketplaces) for FY2024 and YTD FY2025.
      relatedQuestionRefs:
        - QI018

    - type: private-evidence-only
      severity: minor
      topic: working capital and deferred revenue
      missingEvidence: >
        Deferred revenue schedule and multi-year contract share of total bookings; Writer's working
        capital dynamics—upfront cash collection vs. ratable revenue recognition on annual contracts—
        are not disclosed.
      whyItMatters: >
        Annual SaaS subscriptions billed upfront create favorable working capital (cash collected
        ahead of revenue recognition), but this structural advantage is not quantifiable without
        a deferred revenue waterfall.
      diligencePath: >
        Request deferred revenue schedule from the balance sheet and the share of multi-year
        contracts (2-year, 3-year) in total bookings to quantify cash-to-ARR timing.
      relatedQuestionRefs:
        - QI019

