  - id: TI005
    title: Public Financial Disclosure Gaps
    columns:
      - Missing Metric
      - Impact on Underwriting
      - Exact Diligence Path
    rows:
      - - Audited financial statements (P&L, balance sheet, cash-flow statement)
        - Blocking — no independent basis for revenue, margin, or burn verification
        - Request data room access to audited or CPA-reviewed financials for FY2023, FY2024, and YTD FY2025
      - - Gross margin by revenue stream (subscription, API, services)
        - Blocking — LLM hosting costs may compress margins 10–25 points below SaaS norms; cannot model unit economics without this
        - Request COGS breakdown separating infrastructure/model hosting from software delivery and professional services
      - - Monthly burn rate and cash position as of run date
        - Material — runway is a function of burn; without it, capital adequacy cannot be assessed
        - Request monthly cash-flow statement for last 12 months and current bank balance
      - - Customer revenue concentration (top 10 customers as % of ARR)
        - Material — single-customer dependence above 10% of ARR represents meaningful concentration risk
        - Request customer revenue concentration table (top 10 by ACV) with churn/renewal history
      - - Net revenue retention (current; cohort-level)
        - Material — >150% NRR from 2023 Series B is stale; current NRR across 2024 cohorts determines expansion trajectory
        - "Request NRR waterfall by cohort: 2022 cohort, 2023 cohort, and 2024 cohort (separate enterprise vs. SMB)"
      - - CAC by channel and payback period (actual)
        - Material — 6-month payback (Forrester, commissioned study) cannot be relied upon without verified CAC
        - Request actual sales and marketing spend by channel, new ARR added by channel, and ACV-to-CAC ratio for last 8 quarters
      - - Deferred revenue schedule
        - Minor — multi-year contracts create deferred revenue; recognition timing affects revenue quality assessment
        - Request deferred revenue waterfall and multi-year contract share of total bookings
      - - Path to profitability / operating model (target margins, timeline)
        - Material — $1.9B valuation is premised on eventual SaaS-level profitability; no public guidance
        - Request internal financial model with revenue, gross margin, and EBITDA targets for FY2026–FY2028
    notes: >
      "Blocking" severity means the gap prevents a complete financial underwriting assessment.
      "Material" means the gap significantly affects judgment but may allow partial assessment.
      All gaps reflect the status as of the run date (2026-05-23) based on public information only.
    claimRefs:
      - CI031
      - CI032
      - CI034
      - CI035
      - CI036
      - CI037

