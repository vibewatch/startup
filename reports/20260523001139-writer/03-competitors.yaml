figures:
  - id: FP001
    title: "Competitive Positioning Map: Enterprise Specialization vs. Platform Breadth"
    type: quadrant
    layout: wide
    summary: >
      Ordinal positioning of nine enterprise AI competitors on two axes: X = Enterprise Specialization
      (1=general-purpose/consumer, 10=enterprise-only focus) and Y = Platform Breadth (1=narrow point
      solution, 10=full-stack platform). Scores are evidence-backed estimates based on vendor product
