  - id: concentration-risk-adverse-signals
    title: Concentration Risk, Adverse Evidence, and Diligence Priorities
    body: >
      Writer's customer base expansion and named-logo diversity are strong positives, but several structural
      concentration risks require due diligence attention. Geographic concentration in US-headquartered
      enterprises limits international revenue visibility. Vertical concentration — financial services and
      technology represent the majority of named logos — means regulatory headwinds in either vertical could
      disproportionately affect retention and expansion. Channel concentration is also a risk: Writer appears
      to rely primarily on direct enterprise sales, with the AWS Bedrock partnership and a nascent partner
      program (announced early 2026) as the main distribution alternatives. The depth of System Integrator
      or reseller channel penetration is not publicly documented.

      The adverse review evidence is not isolated. Both G2 and Gartner Peer Insights show 1-star reviews
      from mid-to-large enterprise buyers citing product misrepresentation and performance below
      expectations — filed in July 2025. The identical language across platforms suggests these may be from
      the same underlying customer experience, and the filing timing (9 months post-Series C) could indicate
      a specific deployment failure during rapid scaling. Whether this is isolated or symptomatic of broader
      onboarding failures at scale is a material open question. Writer's customer success team is
      cited positively in several case studies (Qualcomm's Brent Summers praised the onboarding support),
      but the adverse reviews suggest inconsistency in the experience.

      The G2 rating for Writer stands at approximately 4.1/5 based on available reviews, reflecting
      generally positive sentiment with pockets of dissatisfaction around creative flexibility and
      cross-session memory. TrustRadius reviews similarly reflect a mixed picture for users seeking
      a less constrained writing tool, though the enterprise governance use case is consistently praised.
      Slashdot listings show Writer in AI writing assistant categories with broad feature coverage.

      Key diligence priorities for the customer chapter: (1) Request NRR/GRR by vintage cohort and by
      vertical from management. (2) Request ARR by top-1/5/10/25 customers to assess concentration.
      (3) Investigate the July 2025 adverse review incident — identify whether an enterprise customer
      churned and what the contractual resolution was. (4) Assess international ARR and roadmap. (5) Evaluate
      the partner program maturity as an expansion and diversification lever. (6) Request customer NPS data
      from the customer success function.
