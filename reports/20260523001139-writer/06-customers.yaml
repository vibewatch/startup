chapter:
  number: 6
  title: Customers
  summary: >
    Writer serves 300+ enterprise customers across financial services, technology, healthcare, professional
    services, and retail verticals, with named logos including Vanguard, Uber, Qualcomm, Salesforce, KPMG,
    Mars, Franklin Templeton, Intuit, Accenture, L'Oréal, Ally Bank, Kenvue, Lennar, Prudential, N26,
    CirrusMD, Vizient, Medisolv, HubSpot, Sprout Social, TTEC, Go1, Commvault, Adore Me, and SCAN Health
    Plan. Documented customer outcomes are strong — Qualcomm saves 2,400 hours/month, Salesforce reports a
    20% productivity boost across 3,000+ employees, Vanguard achieved 57% faster time-to-market, Vizient
    projects $700K year-one savings at 4x expected ROI, and a Balderton-cited portfolio average of 9x ROI —
    though no NRR, GRR, or churn metrics are publicly disclosed, leaving retention durability unverified.
    One adverse customer (1-star Gartner Peer Insights review, July 2025) explicitly reports product
    misrepresentation, and multiple G2 reviewers cite overly rigid brand rules and occasional quality
    inconsistencies, signaling room for improvement in the customer success model for mid-market buyers.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Vertical Mix
    body: >
      Writer's customer base of 300+ enterprises spans at least five primary verticals as of May 2026:
      financial services (Vanguard, Franklin Templeton, Ally Bank, N26), technology and software (Qualcomm,
      Salesforce, HubSpot, Sprout Social, Commvault, Dropbox), healthcare and life sciences (CirrusMD,
      Medisolv, Vizient, SCAN Health Plan), professional services (KPMG, Accenture), and retail/consumer
      goods (Adore Me/Victoria's Secret, L'Oréal, Kenvue, Lennar). This vertical diversity is intentional:
      Writer's specialized Palmyra Med model for healthcare and Palmyra Fin for finance create deeper product
      fit in regulated industries, while its brand-governance and trademark-management capabilities address
      the needs of consumer brands and professional services firms.

      The primary buyer is the VP or Director of AI Transformation, content marketing, or communications
      at an enterprise with 1,000+ employees. In some deployments the buyer is a legal or regulatory affairs
      leader (e.g., Qualcomm's SVP of Legal Counsel), or a VP of Generative AI (e.g., Vanguard's Paul Dyrwal).
      End-users span marketing, communications, legal, content design, product, HR, sales, and customer
      support teams. The platform's "land-and-expand" motion — starting with one department and spreading
      via organic word-of-mouth — means the initial buyer is often not the largest eventual user group.

      Geographically, the customer base is concentrated in US-headquartered enterprises. International
      references include N26 (Germany-based digital bank), Go1 (Australia-based learning platform), EE and
      VOIS/Vodafone UK (UK-based telcos), and TELUS (Canada). Writer's multilingual Palmyra models and
      multi-language style guide capabilities support non-English deployments, and the Adore Me case study
      documents a 10-day international market launch enabled by Writer AI Studio — but international ARR
      concentration is not publicly disclosed and remains a diligence gap.

      Balderton Capital's Series C announcement confirmed the named customer roster at close: Mars,
      Ally Bank, Franklin Templeton, Kenvue, Lennar, Prudential, Qualcomm, Salesforce, and Uber as
      newer additions, alongside long-standing customers Vanguard, Accenture, L'Oréal, and Intuit.
      Forbes and TechCrunch independently cite the 300+ customer figure anchored to Uber, Intuit, and
      Salesforce, corroborating the official claim. The Sacra research report identifies 5,000+ agents
      deployed across the customer base, suggesting broad platform adoption beyond basic content creation.
