callouts:
  - calloutType: strength
    title: Deep Named-Customer Evidence Across Verticals
    body: >
      Writer's 15+ published case studies document specific, named-executive, quantified outcomes that
      are among the most granular in the enterprise AI category. Qualcomm's 2,400 hours/month, Salesforce's
      20% productivity boost across 3,000+ employees, Vizient's 4x ROI, and CirrusMD's 15x patient benefit
      engagements are not vanity metrics — they reflect real production deployments with measurable ROI.
      The cross-vertical breadth (financial services, healthcare, technology, professional services, retail)
      and cross-function expansion patterns (Qualcomm: 8 departments; Salesforce: 9+ departments) suggest
      a platform genuinely solving enterprise-scale problems, not a point solution. Balderton reports an
      average 9x ROI and millions of hours saved across the portfolio.
    claimRefs:
      - CU010
      - CU014
      - CU022
      - CU019
      - CU032

  - calloutType: risk
    title: No Disclosed Retention Metrics — Durability Unverifiable
    body: >
      Writer has not published NRR, GRR, logo churn, or average contract length. The only independent
      retention proxy — Sacra's ~150%+ NRR estimate from the 2023 Series B round — predates the current
      300-customer scale and may not reflect current performance. Engagement metrics (Qualcomm 85% WAU,
      Commvault 80% DAU) are positive signals but are not substitutes for financial retention data. The
      July 2025 adverse 1-star reviews on G2 and Gartner citing product misrepresentation introduce
      additional uncertainty about customer success consistency at scale. NRR, GRR, and top-customer ARR
      concentration are the three highest-priority metrics to request in the data room.
    claimRefs:
      - CU035
      - CU038
      - CU039

  - calloutType: insight
    title: Land-and-Expand Producing Demonstrable Cross-Department Growth
    body: >
      The documented expansion trajectories at Qualcomm (1 team → 8 functions), Salesforce (pilot → 9+
      departments), N26 (content design → legal → marketing), and Commvault (30% → 80% daily use in one
      year) validate the land-and-expand motion as a real revenue driver, not just a marketing narrative.
      This pattern implies that initial ACV meaningfully understates lifetime customer value, and that
      NRR should structurally exceed 100% as long as product quality sustains adoption momentum. The
      five-thousand-plus agents deployed (Sacra) further suggests customers are embedding Writer as
      infrastructure, not just a productivity tool — deepening switching costs with each new agent workflow.
    claimRefs:
      - CU005
      - CU013
      - CU016
      - CU030
      - CU034

  - calloutType: assumption
    title: Customer Count and ROI Claims Are Company-Controlled
    body: >
      The 300+ customer figure originates from Writer's own communications (echoed by Balderton's investor
      announcement and Forbes reporting). The 9x average ROI claim is stated in an investor press release
      with no disclosed methodology. All 15+ case studies are published on writer.com, authored by
      Writer, and represent curated positive references. The absence of independent case study publications,
      analyst-verified ROI studies, or customer-initiated press releases means the strength of customer
      evidence is conditional on Writer's editorial choices. Any diligence process should seek independent
      reference calls with at least 5 named customers across verticals.
    claimRefs:
      - CU001
      - CU002
      - CU032

