  - id: named-customer-proof-adoption
    title: Named Customer Proof, Outcomes, and Adoption Evidence
    body: >
      The depth and specificity of Writer's published customer case studies is a significant diligence
      positive. Across the 15+ case studies available as of May 2026, documented outcomes are consistently
      material and verified by named executives with job titles and quotes.

      Qualcomm's deployment is among the most detailed. SVP and CMO Don McGuire's marketing team ran a
      pilot where 100% of users wanted full-time adoption. The rollout now spans hundreds of users across
      marketing, communications, legal, product, analytics, sales, L&D, and HR — covering 25+ vetted use
      cases and 70 defined workflows. The result: 2,400 hours saved per month across all users, 85% weekly
      active usage, and 60% using the platform multiple times per week. Senior Director of Legal Counsel
      Danielle Olivotto uploaded over 1,200 trademarks and terms, eliminating manual lookup for trademark
      compliance in Microsoft Word. This cross-functional breadth (from CMO to legal counsel) is a strong
      indicator of deep platform integration.

      Salesforce's deployment reached 3,000+ employees across at least nine departments. Senior Manager of
      AI and Content Ops Annemaria Nicholson built 50 AI champions using AI Studio's no-code tools.
      Measured outcomes include 20% productivity boost (equivalent to one saved workday per week) and
      78% of users reporting positive impact on their work. "WRITER has reviewed billions of words produced
      by our teams," said content experience lead — a statement indicating very high usage volume.

      Vanguard's deployment achieved 57% faster time-to-market in marketing and client services. VP of
      Generative AI Paul Dyrwal stated: "I want 100% adoption and 100% certification with Writer across
      teams because I know if someone's using the tool, then their imagination is unleashed on what the
      next use case could be." Vanguard also launched its first client-facing AI agent, helping financial
      advisors create customized content summaries — a meaningful production-grade deployment in a
      tightly regulated environment that required buy-in from compliance, legal, and IT.

      Healthcare deployments show strong vertical specialization. CirrusMD (serving 13M members) replaced
      an in-house OpenAI implementation with Writer's Palmyra Med model after quality issues, and deployed
      AI for patient benefits navigation and clinical documentation within six months. The outcome: 15x
      benefit engagements by patients and 234% increase in physician direction to benefits. Vizient, a
      healthcare GPO serving large health systems, projects $700K in year-one savings, achieving 4x its
      expected ROI, with 100+ collaborators saving 2.5 hours per week each. Medisolv achieved 80% time
      savings in regulatory knowledge production.

      The pattern across deployments reveals a consistent expansion trajectory: initial department-level
      deployment, demonstrated ROI, organic spread to adjacent functions. Commvault grew daily active usage
      from 30% to 80% of its marketing team over one year of deployment. Adore Me has been an "alpha tester"
      for multiple new products over several years, indicating a long-term and deepening partnership.

      Adverse signals from third-party review platforms temper the picture. A 1-star Gartner Peer Insights
      review (July 2025) from a company with 1B-10B USD revenue states: "Company Misled on Product Abilities,
      Performance Falls Short of Expectations." G2 includes a similar 1-star review (July 2025) with identical
      language. Multiple G2 reviewers note that Writer's brand rules can feel "overly strict" and
      "limit creativity," with suggestions sometimes being "rigid or generic." TrustRadius reviewers mention
      the platform has "slowed down the writing process" and delivered "less than factual content" for some users.
      These adverse signals are consistent with a product that enforces brand governance rigorously — a strength
      for compliance-heavy buyers but a friction point for creative teams.
