figures:
  - id: FU001
    title: Customer Journey Map — Segments, Surfaces, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >
      End-to-end enterprise customer journey from market awareness through multi-department expansion,
      showing which customer segments Writer targets at each stage and how the land-and-expand motion
      operates in practice based on documented case studies.
    data:
      nodes:
        - id: awareness
          label: "1. Market Awareness"
          detail: "Enterprise AI buyer learns of Writer via analyst reports (Gartner, IDC), investor networks (ICONIQ, Balderton), AWS Bedrock marketplace, peer recommendations, or PR around Series B/C funding and Palmyra model releases"
        - id: evaluation
          label: "2. Evaluation & Proof-of-Concept"
          detail: "VP/Director of AI or Content runs pilot with 1–3 use cases; Qualcomm pilot had 100% user opt-in; Writer provides cohort-based training, onboarding support, and use case workshops"
        - id: initial-deploy
          label: "3. Initial Departmental Deployment"
          detail: "Writer deployed to first buying team (typically marketing, communications, or content design); brand rules, style guides, and terminology databases configured; first ROI measured (time savings, quality improvements)"
        - id: expansion
          label: "4. Cross-Function Expansion"
          detail: "Word-of-mouth FOMO drives adoption to adjacent departments (legal, product, HR, sales, customer support); new champions identified; Qualcomm: 8 functions; Salesforce: 9+ departments; N26: content→legal→marketing"
        - id: platform-embed
          label: "5. Platform Embedding"
          detail: "Knowledge Graph built from proprietary data; 70+ workflows defined (Qualcomm); custom AI agents deployed (Salesforce: 50 champions building agents; Commvault: Ask Commvault Cloud chat); deep MS365/Google Workspace/Salesforce integrations"
        - id: renewal-advocacy
          label: "6. Renewal and Advocacy"
          detail: "High WAU (Qualcomm: 85%), executive sponsorship (VP of GenAI at Vanguard, CMO at Qualcomm), and documented ROI drive renewal; long-term customers (Adore Me: alpha tester 3+ years; Vanguard: first client-facing agent) become public reference accounts"
    approximationNotes: >
      Journey stages synthesized from 12+ published case studies on writer.com as of 2026-05-23;
      stage durations (time from POC to full deployment) are not publicly disclosed. Churn risk placement
      is qualitative based on adverse review signals, not empirical attrition data.
