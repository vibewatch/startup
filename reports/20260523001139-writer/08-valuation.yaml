chapter:
  number: 8
  title: Valuation
  summary: >
    Writer's $1.9B Series C valuation (November 2024, SEC-confirmed) implies roughly 40× trailing
    ARR on Sacra's $47M estimate—a premium that is defensible under bull-case hyper-growth
    assumptions but stretched relative to public SaaS comps and private enterprise AI peers at
    comparable scale. The base case is a fair-to-stretched entry: strong NRR (>150%), demonstrated
    enterprise traction, and a differentiated full-stack model justify a premium, but significant
    disclosure gaps—no audited ARR, gross margin, burn rate, or cap-table details—prevent
    high-confidence underwriting. A conditional "monitor" stance is warranted pending data-room
    access that closes the most critical information gaps.

sections:
  - id: recommendation-and-stance
    title: Recommendation Summary and Valuation Stance
    body: >
      Writer enters diligence at a $1.9B post-money valuation confirmed by a November 2024 SEC
      Form D filing (Writer, Inc., CIK 0002044986). The $200M Series C was led by Premji Invest
      and Radical Ventures with ICONIQ Growth participating, bringing total disclosed equity
      financing to $326M. Sacra subsequently updated the figure to $1.98B on $326M in total
      funding as of June 2025, and Salesforce Ventures disclosed a new check into Writer in
      October 2025 as part of its $1B AI fund deployment—suggesting continued investor appetite
      at a similar or modestly higher mark, though no updated valuation figure has been publicly
      confirmed.

      At $47M trailing ARR (Sacra estimate, November 2024) the implied entry multiple is
      approximately 40× revenue—well above the median public SaaS NTM revenue multiple of
      roughly 6–10× for established software companies in 2024–2025 (BVP Nasdaq Emerging Cloud
      Index) and above even the elevated multiples commanded by high-growth private AI companies
      at comparable ARR. The premium is partially justified by Writer's ~194% YoY ARR growth rate
      (Sacra), >150% net revenue retention confirmed at Series B, a full-stack proprietary model
      architecture, and rapidly expanding agentic product suite. However, the ARR figure is a
      third-party estimate, not audited; no gross margin, burn rate, or unit economics have been
      publicly disclosed; and the platform faces intensifying competition from hyperscaler AI
      suites and well-funded peers like Glean (valued at $4.6B on ~$110M ARR in September 2024)
      and Harvey (valued at $3B on ~$50M ARR in early 2025).

      The investment stance is **CONDITIONAL MONITOR**: the growth profile and enterprise proof
      points support participation at this valuation if data-room diligence confirms gross margin
      above 65%, annualized ARR in the range projected by Sacra, and cash runway extending through
      at least mid-2026. If data room access reveals gross margin below 55%, burn materially
      exceeding $10M per month, or ARR meaningfully below $40M as of Q4 2024, the valuation is
      stretched beyond what the evidence can support and a price renegotiation or pass is warranted.
