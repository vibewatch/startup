  - id: scenario-analysis
    title: Bull / Base / Bear Scenario Analysis
    body: >
      The bull case assumes Writer's $47M ARR as of November 2024 is accurate and continues to
      grow at 150%+ YoY through 2025 and 2026, reaching approximately $120–150M ARR by end of
      2025. In this scenario, Writers gross margin settles at 68–72% (consistent with enterprise
      SaaS peers that self-host their own models), burn falls below $8M per month as the go-to-
      market engine matures, and the company is on a glide path toward profitability within
      24–30 months of Series C. An IPO at 15–20× forward ARR on $200M+ ARR would imply a
      $3–4B valuation, representing a 1.6–2.1× mark-up on the $1.9B Series C entry. The bull
      case also requires that the agentic product suite drives meaningfully higher ACV from the
      existing customer base and that the AWS Bedrock channel delivers net-new enterprise logos
      at lower acquisition cost.

      The base case assumes 80–120% YoY ARR growth from the $47M November 2024 baseline,
      reaching $85–105M by end of 2025. Gross margin is in the 60–68% range, burn is $8–12M per
      month, and runway extends 18–24 months before the next financing event. The $1.9B valuation
      is defensible but not cheap at this growth rate; a next financing round at 15–18× forward
      ARR on $85–105M would imply a valuation of $1.3–1.9B, representing flat to modest upside
      from current entry. Competitive pressure from Microsoft Copilot for M365 and Google
      Workspace AI features remains a manageable headwind rather than an existential threat in
      the base case, because Writer's compliance-grade customization and proprietary model stack
      serve regulated-industry needs that hyperscaler generic tools cannot yet replicate.

      The bear case envisions ARR growth decelerating below 60% YoY—caused by budget scrutiny
      on AI ROI, competitive displacement, or a major customer churn event—with gross margin
      under 55% driven by elevated model-serving infrastructure costs. In this scenario, burn
      exceeds $12M per month, the next round is down or structured, and the $1.9B valuation mark
      is impaired. CB Insights data shows that the private AI market became increasingly top-heavy
      in 2025, with capital concentrating in the largest deals; a company at Writer's scale that
      misses growth targets faces tighter financing conditions than the Series C environment
      implies. The bear case probability is estimated at 20–25%, conditioned on the evidence gaps
      around gross margin and burn rate remaining unresolved.
