callouts:
  - calloutType: recommendation
    title: "Investment Stance: Conditional Monitor"
    body: >
      Writer's growth profile and enterprise proof points support participation at the $1.9B
      valuation mark, but the stance is conditional on data-room validation of six critical
      metrics: ARR ≥$40M, gross margin ≥65%, monthly burn ≤$10M, NRR ≥130%, customer
      concentration (top-3 ≤35% ARR), and no materially adverse cap-table preference terms.
      If all six conditions are met, the entry multiple is defensible and the bull-case scenario
      supports a 1.6–2.1× return at IPO or strategic exit. If two or more conditions fail,
      the valuation is stretched and a pass or price renegotiation is the appropriate response.
    claimRefs:
      - CV001
      - CV004
      - CV039

  - calloutType: risk
    title: "Critical Disclosure Gap: Gross Margin and Burn Rate Unknown"
    body: >
      Writer has not publicly disclosed gross margin, burn rate, or cash balance. These are the
      two most important inputs to valuation at the Series C stage, and their absence prevents
      high-confidence underwriting. The proprietary model-hosting architecture introduces
      infrastructure costs that could compress software-layer gross margin below 60%—a level
      that would require a meaningful multiple discount relative to pure-software SaaS peers.
      Until data-room access confirms gross margin above 65%, the 40× trailing ARR entry
      multiple should be treated as a ceiling, not a floor.
    claimRefs:
      - CV017
      - CV044
      - CV045

  - calloutType: insight
    title: "Salesforce Ventures Investment as Strategic Signal"
    body: >
      Salesforce Ventures' October 2025 undisclosed-check investment in Writer, as part of its
      $1B AI fund deployment, is noteworthy as a potential strategic precursor. Salesforce has
      a documented pattern of using Ventures investments as evaluation mechanisms before
      acquisition (e.g., Slack, Tableau, MuleSoft were all Ventures investments before
      acquisition). A Salesforce acquisition of Writer at 2–3× the $1.9B Series C mark would
      represent a $3.8–5.7B transaction, which is within Salesforce's recent M&A range and would
      give it a proprietary enterprise AI platform to compete with Microsoft Copilot for M365.
      This strategic optionality is a meaningful upside element not captured in the base-case
      intrinsic-value analysis.
    claimRefs:
      - CV009
      - CV047

  - calloutType: risk
    title: "Adverse: Private AI Market Multiple Compression Risk"
    body: >
      Bessemer Venture Partners' 2024 State of the Cloud report explicitly warns that the private
      AI sector has "arguably bubbled up again," and CB Insights data shows that the 2025 AI
      funding market became increasingly top-heavy, with 79% of capital in mega-rounds
      ($100M+). Companies at Writer's scale that miss growth targets in this environment face
      tighter re-financing conditions because capital is concentrating in proven leaders
      (Anthropic, OpenAI, xAI). A scenario where Writer's growth decelerates in 2025 while
      the broader private AI market compresses multiples would create compounding adverse
      pressure—both on operating performance and on investor risk appetite—that could result
      in a down-round at the next financing event.
    claimRefs:
      - CV026
      - CV028
      - CV036

