  - id: funding-and-financial-snapshot
    title: Funding History, Valuation, and Financial Snapshot
    body: >
      Writer has raised approximately $326 million in total funding across multiple rounds, achieving a $1.9 billion
      valuation in its most recent Series C in November 2024. The Series C was a $200 million round that reportedly
      saw participation from new and existing investors. Prior rounds included a $100 million Series B (September 2023)
      led by ICONIQ Growth, with participation from WndrCo, Balderton Capital, Insight Partners (who led the Series A),
      and Aspect Ventures. Notable customer-investors in the Series B included Accenture and Vanguard. A seed round
      was led by Aspect Ventures.

      Revenue trajectory, according to third-party analyst Sacra (data as of November 2024), shows Writer reached
      approximately $47M in annual recurring revenue, up roughly 194% year-over-year from an estimated $16M ARR
      in 2023 and from approximately $2M ARR in 2022. This implies a revenue compound annual growth rate exceeding
      200% over a two-year period. The $1.9B valuation at the Series C represents an approximately 40x trailing ARR
      multiple, which is a premium consistent with the highest tier of enterprise AI valuations but requires
      sustained hyper-growth to justify.

      Salesforce Ventures separately disclosed a new investment in Writer in October 2025 as part of its $1B AI
      fund deployment, though no Writer-specific check size was disclosed. Sacra also reported Writer's most
      recently disclosed valuation as $1.98B on $326M in total funding as of June 2025. Gross margin, burn rate,
      runway, and net revenue retention are not publicly disclosed. Headcount is estimated by Growjo at approximately
      1,715 employees as of May 2026, with 168% employee-count growth year-over-year — but this figure may reflect
      full-time plus contractor or international equivalents and should be treated as an estimate.
