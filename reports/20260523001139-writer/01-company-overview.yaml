  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: "Writer's gross margin, burn rate, runway, and net revenue retention (NRR) rate"
      whyItMatters: "Without gross margin and NRR, quality and sustainability of ARR growth cannot be independently assessed; premium valuation multiple relies on assumed strong unit economics"
      diligencePath: "Request data room access from management; cross-reference with customer contract terms visible in SEC filings if Writer pursues IPO"
      relatedQuestionRefs:
        - QO016
        - QO020

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Ownership structure — founder equity, dual-class shares, board composition, investor protective provisions, and independent directors"
      whyItMatters: "Without governance structure details, the ability of investors to influence company direction or replace management cannot be evaluated; key for Series D or IPO diligence"
      diligencePath: "Request cap table, voting rights summary, and board charter from management"
      relatedQuestionRefs:
        - QO015
        - QO025

    - type: missing-source
      severity: minor
      topic: funding
      missingEvidence: "Official press release or SEC Form D filing confirming Series C round size, lead investors, and terms"
      whyItMatters: "Series C details (investors, terms, secondary provisions) are based on third-party analyst reporting (Sacra), not a primary source press release or regulatory filing"
      diligencePath: "Check SEC EDGAR for Form D filing by Writer for 2024-Q4; search PR Newswire and BusinessWire archive for November 2024 Writer release"
      relatedQuestionRefs:
        - QO003

    - type: enumeration-incomplete
      severity: minor
      topic: customers
      missingEvidence: "Full named customer list with contract values or tiers; churn rate and customer health data; workflow-category ARR breakdown"
      whyItMatters: "Marketing references 300+ customers but only ~15 named case studies are visible; understanding concentration risk requires knowing whether top 10 customers represent >50% of ARR"
      diligencePath: "Request top-10 customer revenue concentration from management; cross-reference Qualcomm, Uber, Vanguard contract announcements for deal size"
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO001

    - type: private-evidence-only
      severity: minor
      topic: leadership
      missingEvidence: "Board composition, independent director names, investor-nominated directors, compensation data, and equity ownership for non-founder executives"
      whyItMatters: "Without board and equity details, governance quality, founder control, and management retention risk cannot be fully assessed ahead of a Series D or IPO process"
      diligencePath: "Request board charter, director list, and executive option grants from management data room"
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: investors
      missingEvidence: "Series C lead investor identity, all Series C participant names, stake percentages, liquidation preferences, pro-rata rights, and board seat allocations for all investors"
      whyItMatters: "Without investor governance rights, it is impossible to assess investor ability to block a sale, impose a down-round, or require co-sale in a future transaction"
      diligencePath: "Request cap table from management; pull any SEC Form D filings for late 2024 Writer rounds; request Series B and C term sheets"
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO003

    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: "Confirmed dates and amounts for Seed and Series A rounds; exact Series C investor list; any regulatory, legal, or governance adverse events not surfaced in public sources"
      whyItMatters: "Pre-2023 milestone data relies on secondary sources (Sacra, Craft.co) and approximate dating; a full chronology requires primary documents (SEC Form D filings, press releases)"
