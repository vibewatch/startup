  - id: leadership-and-governance
    title: Leadership, Board, and Key-Person Risk
    body: >
      Writer is led by its two co-founders, May Habib (CEO) and Waseem AlShikh (CTO), who have worked together
      for more than a decade and share both technical depth and enterprise-sales expertise. May Habib has served as
      CEO since founding, positioning Writer's go-to-market and enterprise strategy, while Waseem AlShikh leads
      AI research and engineering. The company maintains an unusually large C-suite for a pre-IPO startup, signaling
      an effort to build operational depth beyond the founder layer. As of the May 2026 About page, the leadership
      team includes Andy Shorkey (Chief Revenue Officer), Diego Lomanto (Chief Marketing Officer), Roger Kopfmann
      (Chief Financial Officer), Brian O'Reilly (Chief Operating Officer), Jevan Lenox (Chief People Officer),
      Mina Alaghband (Chief Customer Officer), Eric Freeman (Chief Information Security Officer), Kevin Chung
      (Chief Strategy Officer), Maureen Little (SVP Partnerships), and Rowan Reynolds (General Counsel).

      Key advisors include Doug Pepper (General Partner, ICONIQ Growth), Jamie Barnett (Investor & Advisor),
      Radhika Venkatraman (Senior Advisor, Cerberus Capital Management), and Whit Bouck (Managing Director,
      Insight Partners). The adviser bench reflects both primary investors and strategic financial partners.

      Key-person concentration risk is elevated: both product vision and AI research direction depend heavily on
      the two co-founders, who have maintained control through all funding rounds. No information on dual-class
      share structure or protective provisions has been disclosed publicly. The concentrated leadership lineage
      from Qordoba to Writer is a strength (deep mutual trust and enterprise domain expertise) but also a
      dependency if either founder were to depart.
    claimRefs:
