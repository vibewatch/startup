        - Medium
        - >-
          Document median Knowledge Graph build time and cost for enterprise customers; confirm whether Knowledge Graph
          schemas are exportable (portability risk)
      - - SOC 2 / HIPAA / ISO 42001 compliance posture
        - >-
          Compliance certifications become table stakes across all enterprise AI platforms; compliance alone ceases to
