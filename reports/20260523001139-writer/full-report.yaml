  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Writer generates revenue through annual enterprise software subscriptions built on a hybrid
              seat-plus-usage model. Customers access the full Writer platform—including Palmyra LLMs, Knowledge Graph,
              AI guardrails, and the agent layer—under annual contracts negotiated directly with enterprise procurement
              teams. The company uses a classic land-and-expand strategy: initial deployments target a specific
              department or use case (marketing content, legal compliance, customer support), with expansion driven by
              demonstrated ROI measured in employee hours saved and productivity gains, supported by a >150% net revenue
              retention rate disclosed at the time of the Series B in September 2023.

              Pricing is bifurcated. A public-facing Starter plan accommodates up to five users with five Playbooks and
              limited Knowledge Graph access. All meaningful revenue comes from the Enterprise tier, for which no list
              pricing is disclosed; prospects must contact sales to obtain a quote. This "contact us" gate is standard
              enterprise SaaS practice but creates procurement friction for buyers accustomed to transparent software
              pricing. Palmyra API pricing is explicitly listed on the writer.com/llms/ page: Palmyra X5 at $0.60 per
              million input tokens and $6.00 per million output tokens; Palmyra X4 at $5.00 per million input tokens and
              $12.00 per million output tokens. At these rates, Palmyra X5 is priced 3–4× cheaper per token than GPT-4.1
              ($5.00 input / $30.00 output per million tokens per OpenAI list pricing), a meaningful cost advantage for
              high-volume enterprise workloads.

              Writer grew revenue 10× over two years through the Series B (2021 to 2023), expanded ARR from roughly $2M
              in 2022 to $16M in 2023, and reached an estimated $47M by November 2024—a trajectory corroborated by the
              pricing of its Series C at a $1.9B valuation. Sacra estimates that writer's revenue growth rate in 2024
              was approximately 194% year-over-year. Its AWS Bedrock listing extends model distribution to
              AWS-standardized enterprises, but revenue-share terms with Amazon are not publicly disclosed.
