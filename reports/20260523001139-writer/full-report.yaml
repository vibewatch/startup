        - Multi-system connector deployments where agents chain across connectors with compounding permission sets
        - >-
          Agent supervision suite GA timeline not publicly disclosed; no published incident report from agent
          deployments
      - - Prompt injection attack on enterprise AI agents (OWASP LLM01)
        - >-
          Medium — OWASP GenAI Security Project identifies prompt injection as #1 LLM application threat; agents
          processing external content are high-attack-surface
        - >-
          High — successful prompt injection could redirect agent actions, exfiltrate enterprise data, or override
          guardrails
        - >-
          Medium — pre-call input guardrails using AWS Bedrock Guardrails and Azure AI Content Safety provide detection;
          but coverage applies to external provider models only
        - >-
          Palmyra-native agent workflows where external provider guardrails do not apply; agents processing
          user-uploaded documents from unvetted sources
        - >-
          Guardrail coverage gap for Palmyra-native API/SDK/Agent Builder use; no public penetration test results for
          agent injection attack surface
      - - Data breach — customer enterprise data processed by Writer platform exposed to unauthorized third parties
        - Low — Writer holds SOC 2 Type II, ISO 27001, annual third-party pen tests; no public incidents identified
        - >-
          Critical — enterprise data exposure in healthcare or financial services would trigger HIPAA/GDPR
          notifications, regulatory fines, and customer loss
        - High — mature security program with AES-256 encryption at rest, TLS 1.2+ in transit, dedicated security team
        - Residual risk in third-party integrations where data flows across Writer's security boundary to partner APIs
        - >-
          No public audit report abstracts for SOC 2; trustcenter.writer.com largely blank at time of access; full
          posture visibility requires data room access
      - - Service outage / availability failure during mission-critical enterprise agentic workflows
        - >-
          Low-Medium — cloud infrastructure dependency on AWS/Azure/GCP; no published uptime SLA or status page history
          identified
        - >-
          Medium — automated agentic workflows on scheduled Routines have workflow continuity dependencies; unplanned
          downtime breaks pipelines
        - >-
          Medium — multi-cloud guardrail architecture reduces single-provider blast radius; ISO 27001 includes
          availability controls
        - >-
          Automated agentic workflows running on scheduled Routines where downtime causes missed SLAs or incomplete
          workflow chains
        - >-
          No public Writer status page or historical uptime disclosure; SLA terms in enterprise MSA not publicly
          available
    notes: >
      Likelihood ratings reflect independent evidence plus product documentation as of 2026-05-23. No public Writer
