  - id: TR002
    title: Operational, Quality, and Security Risk Register
    columns:
      - Failure Mode
      - Likelihood
      - Severity
      - Mitigation Maturity
      - Residual Exposure
      - Unresolved Gap
    rows:
      - - >-
          AI hallucination / output inaccuracy in regulated professional workflows (medical coding, financial reporting,
          legal drafting)
        - >-
          High — McKinsey 2025: 33% of AI users experienced inaccuracy consequences; Gartner flags hallucination as top
          enterprise AI obstacle
        - >-
          Critical — in healthcare and financial services contexts, model errors could expose enterprise customers to
          regulatory liability
        - >-
          Medium — RAG/Knowledge Graph grounding, Palmyra domain specialization (Med, Fin), configurable guardrails
          reduce but do not eliminate risk
        - >-
          Healthcare and financial services agentic deployments where Palmyra Med/Fin outputs influence downstream
          decisions without mandatory human review
        - >-
          No published Palmyra hallucination rate benchmarks for production enterprise workflows;
          guardrails-on-Palmyra-native-API gap confirmed in documentation
      - - >-
          Agentic AI governance failure — autonomous agents take unauthorized or erroneous actions with
          read/write/delete access to enterprise systems
        - >-
          Medium-High — Sacra flags agent supervision as not yet mature; 35% of executives cannot immediately stop a
          rogue agent (Writer 2026 survey)
        - >-
          Critical — an agent that deletes, modifies, or exfiltrates enterprise data could trigger breach notifications
          and immediate customer churn
