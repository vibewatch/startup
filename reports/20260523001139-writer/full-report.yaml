              - CI001
              - CI015
              - CI029
              - CI033
          - type: callout
            title: SEC Form D Confirms $200M Series C Closing
            body: >
              The Series C is independently corroborated by a Form D filing with the SEC (Acc-No 0002044986-24-000002,
              filed 2024-11-21), confirming the exact raise amount of $199,999,483 with 21 investors and a first sale
              date of November 6, 2024. This is the highest-confidence data point in the chapter — a regulatory filing
              rather than a press release or third-party estimate — and anchors the capital adequacy analysis.
            calloutType: strength
            claimRefs:
              - CI011
              - CI019
          - type: callout
            title: NRR >150% Is the Most Important Disclosed Financial Signal
            body: >
              The >150% net revenue retention rate disclosed at the September 2023 Series B is the strongest available
              proxy for Writer's unit economics quality. At >150%, every dollar of ARR from the prior year generates
              $1.50+ in the current year through upsell and expansion alone — meaning Writer can sustain meaningful ARR
              growth even with zero new customer acquisition. The absence of a current (2024/2025) NRR figure is itself
              a material disclosure gap; the 2023 number may have improved or deteriorated as Writer expanded beyond its
              original core customer base.
