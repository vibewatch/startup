    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The enterprise generative AI market in 2026 is contested across two distinct tiers: foundation-model and
              infrastructure providers that sell API access and custom model capabilities, and application-layer
              platforms that deliver packaged enterprise AI workflows to business users. Writer operates at the
              application layer but differentiates by owning its own Palmyra foundation model family—positioning it
              between the two tiers and reducing dependence on third-party model APIs from OpenAI, Anthropic, or Cohere.

              The competitive landscape can be segmented into five categories. First, horizontal AI platform incumbents:
              Microsoft 365 Copilot, Google Workspace Gemini, and Salesforce Agentforce, each of which benefits from
              deep enterprise install bases—Microsoft has 400+ million M365 users, Salesforce owns CRM workflows for the
              majority of enterprise accounts, and Google has Workspace penetration across hundreds of thousands of
              organizations. These incumbents can bundle AI capabilities into existing contracts at marginal incremental
              cost, creating an aggressive pricing anchor that pure-play AI platforms must overcome.

              Second, AI foundation-model providers: OpenAI (ChatGPT Enterprise), Anthropic (Claude Enterprise), and
              Cohere compete on model capability, API access, and private-deployment options. They target enterprises
              seeking to build custom AI applications on top of their models rather than purchase pre-built workflows.
              Writer's Palmyra competes indirectly in this tier, and Writer's own platform sits above it.

              Third, marketing/content AI specialists: Jasper and Copy.ai remain focused on marketing teams and GTM
              workflows. Jasper's 100+ specialized AI marketing agents and Copy.ai's credit-based GTM automation
              platform are horizontally narrower than Writer's cross-functional enterprise vision but can win
              departmental budgets ahead of a full enterprise Writer deployment.

              Fourth, writing and communication tools: Grammarly Business and its Superhuman Go AI agent product occupy
              the writing assistance and communication governance category with a 15-year brand reputation and 70,000+
              enterprise teams served. Grammarly's expansion into agentic AI is a direct competitive incursion into
              Writer's territory.

              Fifth, substitutes and status-quo alternatives: internal IT-built prompt pipelines (using LLM APIs
              directly), professional services engagements (e.g., Accenture AI), and the "do nothing / wait" option
              remain the most common competitive postures. Notably, every enterprise Writer loses to an incumbent bundle
              or a "build internally" decision is a lost land-and-expand opportunity with multi-year ARR implications.
