  - id: TM004
    title: Enterprise GenAI Growth Drivers and Adoption Constraints
    description: >-
      Enumeration of primary market acceleration forces and friction points shaping enterprise GenAI adoption velocity
      through 2027.
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >
        Drivers and constraints synthesized from McKinsey State of AI 2025, BCG GenAI survey (1,400+ C-suite), PwC 2026
        AI Predictions, Capgemini GenAI in Organizations 2024, Capgemini Rise of Agentic AI, Gartner newsroom (April–May
        2026), Writer 2026 AI Adoption Survey, and Deloitte Insights AI analysis. Coverage is limited to factors
        affecting enterprise AI platform adoption; infrastructure, geopolitical, and macroeconomic factors are noted but
        not exhaustively enumerated.
    notes: >
      "Strength" ratings are qualitative assessments based on the frequency and consistency of corroboration across
      analyst sources, not quantitative measurements. "Key evidence" cites the most specific data point available; full
      source citations are in the claims and sources sections.
    columns:
      - Type
      - Factor
      - Strength
      - Key Evidence
      - Implication for Writer
    rows:
      - - Driver
        - Board-level AI mandate
        - Very strong
        - 89% of C-suite rank AI top-3 priority (BCG); 85% increasing AI spend
        - Favorable RFP environment; budget allocated before vendor selection
      - - Driver
        - Agentic AI inflection
        - Strong
        - 62% experimenting with agents (McKinsey); $450B economic value projected by Capgemini
        - Writer's multi-agent platform directly addresses the fastest-growing segment
      - - Driver
        - Early ROI evidence
        - Moderate
        - 333% ROI, 6-month payback (Forrester TEI for Writer); McKinsey scaling orgs 3× more likely to report impact
        - Enables ROI-based selling; reduces procurement risk perception
      - - Driver
        - Super-user productivity multiplier
        - Moderate
        - 5× productivity gain, 3× promotion rate for Writer super-users
        - Creates internal champions; supports bottom-up expansion beyond initial deployment
      - - Constraint
        - ROI realization gap
        - Very strong
        - Only 29% see significant ROI (Writer survey); 66% dissatisfied with GenAI progress (BCG)
        - Must accelerate time-to-ROI; may face churn from under-realizing customers
      - - Constraint
        - Talent and skills gap
        - Strong
        - 'Only 6% trained >25% of workforce on GenAI (BCG); PwC: 80% of value is workflow redesign, not technology'
        - Requires bundled change management and training; can't rely on self-serve deployment
      - - Constraint
        - Trust and governance concerns
        - Strong
        - >-
          Autonomous AI agent trust fell from 43% to 27% in one year (Capgemini); 67% worried about data breaches from
          unapproved AI (Writer survey)
        - Security, auditability, and data isolation are hard purchase requirements, not differentiators
      - - Constraint
        - Integration and data readiness
        - Strong
        - >-
          Fewer than 1-in-5 orgs have high-maturity data infrastructure for agentic AI (Capgemini); only 2% at full
          agent deployment scale
        - Pre-sales data readiness assessment required; integration depth is a competitive moat
