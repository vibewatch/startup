      - number: '8.5'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The thesis rests on several assumptions that must be validated in diligence. The most critical
              thesis-break triggers are: (1) ARR below $35M as of Q4 2024, which would imply the Sacra estimate is
              materially overstated and the 40× multiple is unjustifiable; (2) gross margin below 50%, which would
              indicate that proprietary model hosting is structurally uneconomic at current scale; (3) monthly burn
              above $15M, which would imply a runway shorter than 12 months post-Series C and trigger immediate
              re-financing risk; (4) NRR below 120% at the time of data-room access, reversing the >150% figure cited at
              Series B and indicating customer satisfaction problems or competitive churn; (5) top-three customers
              representing more than 35% of ARR, indicating concentration that could create a cliff-edge revenue event
              if a single customer churns; and (6) cap-table preferences showing more than 1.5× non-participating
              liquidation preference at later stages, which would impair common-equity returns below a 2.5× gross exit.

              The exit readiness picture is mixed. Writer has built the customer reference set, product breadth, and
              funding history consistent with an IPO at $200–300M+ ARR if current growth continues. The more likely
              near-term exit is a strategic acquisition by a hyperscaler (Microsoft, Google, AWS), a major enterprise
              software vendor (SAP, Salesforce, Adobe), or a systems integrator seeking a proprietary enterprise AI
              stack. Salesforce Ventures' disclosed investment in October 2025 is particularly notable as a potential
              strategic precursor; Salesforce has historically used Ventures investments as evaluation mechanisms before
              acquisition. Any such acquisition at 2–3× the $1.9B Series C mark would represent an adequate but not
              outsized return for late-stage investors.

              Final diligence asks focus on the six disclosure gaps that prevent high-confidence underwriting: verified
              ARR schedule with customer-level cohort data, audited or CFO-attested gross margin by product line, burn
              rate and cash balance as of Q4 2024, full cap table with preference stack and anti-dilution provisions,
              customer concentration (top-10 customer revenue share), and AWS Bedrock revenue-share economics.
            claimRefs:
              - CV039
              - CV040
