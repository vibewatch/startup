  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Palmyra LLM Family Architecture and Benchmarks
        blocks:
          - type: paragraph
            body: >
              Writer's core proprietary asset is the Palmyra family of large language models, engineered specifically
              for enterprise workflows. As of May 2026 the active production line consists of Palmyra X5, Palmyra X4,
              and five specialist or legacy models (Fin, Med, Creative, Vision, X 003 Instruct)—with the latter five
              formally deprecated and scheduled for removal on July 13, 2026, with Palmyra X5 designated as the
              universal migration target. Palmyra X5 is Writer's flagship, featuring a hybrid transformer architecture
              with a 1-million-token context window, sub-300-millisecond tool-call latency, and the ability to process a
              full million-token prompt in approximately 22 seconds. On publicly disclosed benchmarks, X5 scores 70.99%
              on BBH (Big-Bench Hard), 47.20% on GPQA (graduate-level science reasoning), 65.02% on MMLU_PRO, and 71.57%
              on MATH_HARD, placing it near but below GPT-4.1 on the OpenAI MRCR 8-needle long-context test (19.1% vs.
              20.25%). Pricing is $0.60 per 1M input tokens and $6.00 per 1M output tokens—Writer claims 3–4× lower cost
              per token versus GPT-4.1, making it viable for RAG pipelines and high-volume agent workloads.


              Palmyra X4, Writer's previous generation, is notable for its tool-calling accuracy: 78.76% ACC in tool
              call identification (claimed ~20% above nearest competitor), 87.93% AST (planning), and 88.27% Exec scores
              on the Berkeley Function-Calling Leaderboard methodology. Palmyra X4 ranks 86.1% on HELM Lite and 81.3% on
              HELM MMLU, placing it in the top 10 globally at the time of its release. Its 128k-token context and
              $2.50/$10.00 per-1M-token price remain available but will ultimately be superseded by X5's stronger
              economics and longer context.


              Domain-specialist Palmyra models demonstrated differentiated vertical performance: Palmyra Fin scored 73%
              on the CFA Level III multiple-choice sample exam (first AI model to pass; human average 60%), while
              Palmyra Med averaged 85.9% across medical benchmarks including 90.9% on MMLU Clinical Knowledge, 94.0% on
              Medical Genetics, and 80% on PubMedQA. Writer's HuggingFace profile lists 33 published models and 3
              datasets, including open-weight collections under Apache 2.0 and a Palmyra-mini family released in
              September 2025. The deprecation of specialist models into the general-purpose X5 represents a
              consolidation risk: customers using Fin or Med via separate API endpoints must migrate, and performance
              parity on domain-specific tasks has not been independently verified post-consolidation.
