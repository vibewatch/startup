            body: >
              Writer's decision to build proprietary Palmyra models from the ground up — rather than wrapping frontier
              APIs — creates a zero-data-retention architecture and self-hosting optionality that are structural
              advantages in regulated industries. ISO 27001/27701/42001 and annual SOC 2 Type II (HIPAA/HITECH)
