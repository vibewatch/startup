  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >
              The enterprise AI platform market encompasses software products and related professional services that
              enable organizations to deploy generative AI capabilities at scale across business workflows. Unlike
              consumer AI applications, enterprise AI platforms must satisfy a distinct set of requirements: scalability
              to support thousands of users across distributed organizations; model reliability with consistent,
              auditable output quality; data governance and security controls meeting enterprise and regulatory
              standards; deep integration with existing enterprise systems (ERP, CRM, HRIS, document management); and
              centralized administration and compliance tooling. IBM's enterprise AI framework identifies these five
              axes—scalable, reliable, secure, integrated, governed—as the minimum viable requirement threshold
              distinguishing enterprise from consumer AI.

              The market stratifies into three nested layers. The broadest is the overall AI market, which spans
              infrastructure (chips, cloud compute), software (models, platforms, applications), and services
              (consulting, implementation). Within that sits the generative AI layer: AI systems capable of generating
              text, code, images, and structured data from natural-language prompts. The enterprise GenAI layer is the
              commercially relevant serviceable market for vendors such as Writer: enterprise-contracted,
              workflow-integrated GenAI platforms emphasizing governance, multi-model composition, and departmental
              deployment. The newest and fastest-growing sub-layer is enterprise agentic AI: autonomous AI systems that
              plan, execute multi-step tasks, and interact with enterprise data and tools without human review of each
              step. Writer's product architecture spans all three enterprise sub-layers, positioning the company in the
              fastest-growing segment of an already high-CAGR market.

              Market boundary disagreements among analysts trace primarily to three definitional forks: (1) whether AI
              infrastructure and foundational model costs are included, (2) whether consumer-facing AI products with
              enterprise tier upsells count as "enterprise AI," and (3) whether agentic AI is classified as a
              sub-segment of GenAI or a separate vertical. These definitional disputes explain the 13–30% spread in
              headline market size figures across MarketsandMarkets, Statista, and Gartner estimates and are a material
              source of uncertainty in assessing Writer's TAM.
