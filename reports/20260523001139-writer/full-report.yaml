              HubSpot, Gong, and enterprise data stores — but the agent supervision suite is described as "early access"
              in product communications, and Sacra explicitly flags that "governance tooling is not yet mature relative
              to the breadth of system access already being granted." Writer's own 2026 survey found that 35% of
              executives admit they could not immediately pull the plug on a rogue agent, and 67% believe their company
              has already suffered a data breach from unapproved AI tools. This is a product maturity risk that is
              time-limited — the supervision suite will mature — but the near-term window creates real liability
              exposure for enterprises deploying agents in mission-critical workflows before governance tooling reaches
              production readiness. The OWASP LLM Top 10 identifies "excessive agency" (LLM08) as a top enterprise AI
