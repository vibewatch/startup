      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: EU AI Act GPAI Obligations Create August 2026 Compliance Deadline
            body: >
              Writer's Palmyra model family meets the EU AI Act's definition of a general-purpose AI (GPAI) model — a
              model trained on broad data, usable for diverse tasks, and commercially deployed via API and platform.
              GPAI model provider obligations (transparency, incident reporting, training data summaries, code of
              practice participation) became effective August 2025. The AI content transparency disclosure rules —
              requiring labeling of AI-generated content — come into effect in August 2026, directly applicable to
              Writer's output. EU AI Act fines for GPAI non-compliance reach up to €30 million or 6% of global turnover.
              Writer's ISO 42001:2023 certification is a forward-looking mitigation; however, training data summary
              disclosure requirements and the exact relationship between Palmyra's compute profile and the systemic-risk
              threshold are unresolved diligence items requiring legal counsel engagement.
