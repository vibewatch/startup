      - number: '8.4'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >
              Assessing Writer's $1.9B valuation at ~40× trailing ARR requires anchoring against a peer set of private
              enterprise AI application companies at comparable ARR scale and growth velocity, plus public SaaS
              benchmarks as a gravity anchor. The comparable set reveals that the 40× multiple is at the high end of the
              private enterprise AI range but not unprecedented for companies growing at 150%+ YoY.

              Among private peers: Glean raised at a $4.6B valuation in September 2024 on approximately $110M ARR (Sacra
              estimate), implying a roughly 42× trailing multiple—comparable to Writer's entry multiple but at a more
              mature ARR base and with enterprise search as its core wedge. Glean subsequently reached $7.2B in June
              2025 on $208M ARR, reflecting continued multiple expansion as the market re-rated high-growth AI
              platforms. Harvey raised a $300M Series D in February 2025 at a $3B valuation on approximately $50M ARR,
              implying roughly 60× trailing multiple—a premium driven by Harvey's high-margin legal AI niche. Cohere
              reached a $5.5B valuation in August 2024 on approximately $62M ARR (Sacra estimate), implying roughly 89×
              trailing multiple—elevated by API infrastructure positioning and a broader addressable market premium.
              Jasper, the closest content-AI peer, was last marked at $1.5B on approximately $75M ARR in 2022 at roughly
              20× revenue—a lower multiple consistent with its less differentiated model architecture and higher SMB
              exposure.

              Among public anchors: the BVP Nasdaq Emerging Cloud Index (EMCLOUD) traded at 6–10× NTM revenue through
              2024–2025, reflecting the reset from ZIRP-era highs. C3.ai (NYSE: AI) traded at negative-growth revenue
              multiples below 5× NTM in 2024. The most relevant public analogues for Writer's valuation level are
              high-growth AI-native SaaS companies with NTM revenue above $100M and growth rates exceeding 40%—a cohort
              that historically commanded 15–25× NTM revenue at the public market. The implied public-market gravity
              anchor for a company growing at Writer's rate, once it achieves scale and margin, is approximately $1.5–3B
              on $85–120M ARR, consistent with our base-case scenario range.

              The Bessemer State of the Cloud 2024 report characterizes private AI application companies as commanding a
              premium over legacy cloud multiples because of top-quintile NRR, rapid ACV expansion, and agentic
              monetization vectors not yet captured in trailing ARR—factors that partially justify Writer's premium over
              public SaaS benchmarks. However, BVP also cautions that the private sector has "arguably bubbled up again,
              largely on the back of AI Cloud," suggesting investors should stress-test terminal-value assumptions
              against the possibility of multiple compression.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
