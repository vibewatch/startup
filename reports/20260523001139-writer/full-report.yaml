  - id: FE001
    title: Writer Platform Architecture Stack
    type: stack
    layout: wide
    summary: >
      Five-layer architecture showing how Writer's data, model, build, activate, and supervise tiers interconnect to
      deliver governed enterprise AI agents.
    data:
      layers:
        - label: Supervise Layer
          detail: >-
            Runtime governance controls: the LLM Gateway manages model routing, guardrail integrations with AWS Bedrock
            and Azure AI Content Safety intercept agent requests at pre/post/during-call stages, and AI Studio provides
            audit logs, RBAC, rate limiting, and pre-deployment approval flows.
          items:
            - LLM Gateway (self-serve model enrollment, health checks, load balancing)
            - Guardrails (AWS Bedrock Guardrails / Azure AI Content Safety – pre/post/during-call)
            - Audit Logs & Event Logging (AI Studio)
            - Rate Limiting / Request Caching
            - RBAC / Least-Privilege Permissions
            - Agent Approval Flows (pre-deployment)
        - label: Activate Layer
          detail: >-
            Autonomous execution surface: Writer Agent plans and runs multi-step workflows, deployed no-code agents
            handle recurring tasks, and the MCP Gateway enforces 4-layer identity and permissions validation on every
            agent-tool interaction across connected enterprise systems.
          items:
            - Writer Agent (autonomous multi-step task execution)
            - No-code deployed agents (template library)
            - API-embedded agent calls (Applications API)
            - MCP Gateway (4-layer IdP + permissions + screening + integrity)
        - label: Build Layer
          detail: >-
            Three build paths: no-code Agent Builder for zero-code visual assembly, Agent Builder for lower-code
            conditional logic, and Writer Framework (open-source Python + drag-and-drop UI, WebSocket, <2ms overhead)
            plus REST API and official SDKs for full-code development.
          items:
            - No-code Agent Builder (visual, zero-code)
            - Agent Builder (lower-code, conditional logic)
            - Writer Framework (Python + drag-and-drop UI, WebSocket, <2ms overhead)
            - REST API / Python SDK (writerai, PyPI) / Node SDK (writer-sdk, npm)
        - label: Model Layer
          detail: >-
            Palmyra proprietary LLM family plus external model integrations: Palmyra X5 (1M-token context, $0.60/1M
            input), Palmyra X4 (128k ctx, top HELM tool-calling scores), specialist models deprecated Jul 2026, and
            external providers (AWS Bedrock, Azure, NVIDIA NIM) accessible via LLM Gateway.
          items:
            - Palmyra X5 (1M ctx, $0.60/1M input, GA; Agent Builder beta)
            - Palmyra X4 (128k ctx, $2.50/1M input, GA)
            - Palmyra Fin / Med / Creative (deprecated Jul 13, 2026)
            - 'External models: AWS Bedrock, Microsoft Azure, NVIDIA NIM'
        - label: Data Layer
          detail: >-
            Knowledge Graph graph-based RAG ingests enterprise data from files (PDF, DOCX, CSV, XLS, PPT, EML, HTML) and
            prebuilt connectors (Confluence, Notion, Google Drive, SharePoint), builds semantic relationship graphs, and
            serves multi-hop grounded answers with inline citations.
          items:
            - Knowledge Graph (graph-based RAG, multi-hop QA, inline citations)
            - 'Prebuilt connectors: Confluence, Notion, Google Drive, SharePoint'
            - Web connectors (URL / domain crawl with auto-update)
            - Custom connectors (OpenAPI spec or MCP server definition)
            - 'File upload: PDF, DOCX, CSV/XLS, PPT, EML, HTML'
    approximationNotes: >
      Layer ordering (top = Supervise → bottom = Data) reflects Writer's stated Build-Activate-Supervise product
      philosophy. Specific infrastructure topology (cloud regions, compute nodes) not publicly disclosed.
    claimRefs:
      - CE015
      - CE016
      - CE022
      - CE023
      - CE026
      - CE030
