          unforeseeable
        - >-
          Critical — investor sentiment, customer confidence, and team cohesion tightly coupled to founder narrative at
          this stage
        - >-
          Habib's previous company (Qordoba) built with AlShikh demonstrates partnership durability; board composition
          includes experienced Balderton and Insight partners
        - Request detailed organizational chart with VP/SVP level; confirm board succession planning
      - - CTO / Co-founder (Waseem AlShikh)
        - Palmyra model architecture owner, AI research vision, product technical roadmap; no disclosed succession plan
        - Low-Medium — same structural reasoning as CEO; deep technical knowledge is a single-person concentration risk
        - >-
          Critical — loss of technical co-founder during active model development cycle could delay Palmyra X-series
          releases
        - >-
          Two-founder architecture provides mutual backup for near-term leadership; engineering team depth below CTO is
          the key unknown
        - >-
          Identify VP of Engineering or Head of Model Research; assess whether Palmyra IP is institutionalized beyond
          AlShikh
      - - AI/ML engineering talent — model research, infrastructure, and agent development
        - >-
          Competition for ML researchers and AI engineers from Google, OpenAI, Anthropic, Microsoft at higher
          compensation bands
        - High — BCG survey finds 62% of executives cite AI talent shortage as top barrier
        - High — model research lag could allow competitors to close the Palmyra quality/cost gap
        - >-
          Writer's $1.9B valuation creates meaningful equity upside for earlier employees; domain-specific model work
          may attract specialists
        - Request headcount by function, attrition rates by tenure band, and equity vesting schedule distribution
      - - Customer success and implementation capacity at scale
        - >-
          Writer's high-touch enterprise onboarding model requires significant CS investment as customer count grows
          beyond 300+
        - >-
          Medium — current customer base may be serviced by existing CS team; scaling constraints emerge at higher
          counts
        - Medium — CS capacity constraints increase time-to-value, reduce expansion revenue, and raise churn risk
        - >-
          AI Studio no-code tools reduce implementation dependencies for simpler use cases; named CS success in Qualcomm
          and Salesforce deployments
        - Request CS headcount, average time-to-value by customer size, CSAT/NPS scores
    notes: >
      Co-founder dependency is inherent at this stage; the risk level is not unusual for a Series C enterprise AI
