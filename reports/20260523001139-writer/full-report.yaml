  - id: TR001
    title: Regulatory / Legal Risk Register
    enumerationScope:
      coverage: exhaustive
      basis: >
        All material regulatory and legal risk vectors identified as of 2026-05-23 for an enterprise AI platform with US
        and European customers, including GPAI model provider obligations, copyright training data exposure, data
        privacy law, sector-specific regulation (HIPAA, financial services compliance), and IP protection. Ordered by
        severity (Critical first).
    columns:
      - Rule / Law / Risk
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Writer Mitigation
      - Residual Exposure
    rows:
      - - EU AI Act — GPAI model provider obligations (transparency, incident reporting, training data summaries)
        - European Union
        - Active — GPAI obligations effective August 2025; transparency rules August 2026
        - High — Palmyra qualifies as GPAI model under Act definition
        - Critical — fines up to €30M or 6% global turnover; disclosure obligations ongoing
        - ISO 42001:2023 AI management certification; GDPR-compliant DPA; AI governance program; EU SCCs
        - >-
          Systemic-risk GPAI threshold uncertainty; training data summary disclosure not yet public; August 2026 AI
          content labeling deadline
      - - US Copyright — AI training data fair use uncertainty (Copyright Office AI Report Part 3, May 2025)
        - United States
        - Active — Part 3 pre-published May 2025; ongoing litigation in related cases
        - Medium — affects all AI model trainers; no Writer-specific action identified
        - High — adverse precedent could require licensing or model retraining; cost and timeline unpredictable
        - >-
          Full-stack model ownership reduces downstream reproduction risk; Writer does not reproduce training text
          verbatim as a product output
        - >-
          Upstream Palmyra pre-training data provenance not publicly disclosed; potential licensing cost if fair use
          narrowed by courts
      - - GDPR / CCPA / Data Privacy — cross-border personal data processing
        - EU, UK, Switzerland, California, US states
        - Active — ongoing compliance obligation; Irish DPC as competent authority for EEA
        - Low-Medium — Writer DPA and data processing practices appear robust; risk is implementation error or breach
        - High — GDPR fines up to 4% global turnover; CCPA penalties; reputational damage
        - >-
          DPA covers GDPR, UK DPA 2018, FADP, CCPA; EU SCCs incorporated; EU-US/UK/Swiss DPF self-certification;
          no-training-on-customer-data commitment
        - Customer is responsible for ensuring compliant data submission; Writer cannot assess customer data content
      - - HIPAA / HITECH — healthcare data in enterprise AI workflows
        - United States
        - Active — applies to Writer's healthcare deployments (CirrusMD, Medisolv, Vizient, SCAN)
        - Medium — Writer operates as a Business Associate for covered entities
        - High — HIPAA breach penalties up to $1.9M per violation category per year; OCR enforcement active
        - Annual SOC 2 Type II with HIPAA/HITECH criteria; BAA available; ISO 27701 privacy management
        - >-
          Palmyra Med outputs in clinical decision support require human oversight; misclassification liability
          allocation is untested
      - - AI-generated content liability — errors in regulated professional outputs (legal, financial, medical)
        - United States, EU, global
        - Emerging — no established case law directly on enterprise AI SaaS liability
        - Medium — rising as agentic AI expands autonomous decision-making
        - Medium-High — liability allocation between Writer (platform) and customer (deployer) is untested
        - >-
          DPA places content verification responsibility on customer; Writer terms disclaim liability for AI output
          accuracy
        - No court cases specifically addressing Writer platform liability for hallucinated professional content
      - - FTC enforcement — deceptive or unsubstantiated AI performance claims in marketing
        - United States
        - Active — FTC has issued AI guidance; enforcement actions in adjacent markets
        - >-
          Low-Medium — Writer marketing includes quantified ROI claims (333% ROI, 9x return) with limited public
          methodology
        - Medium — FTC action could require claim substantiation, modification, or corrective advertising
        - Forrester TEI report cited for 333% ROI figure; multiple named customer case studies with quantified outcomes
        - >-
          9x average ROI claim in Balderton announcement lacks disclosed methodology; Forrester TEI may represent
          commissioned study with selection bias
    notes: >
      Severity ratings are based on publicly available information as of 2026-05-23. No active litigation or regulatory
      enforcement actions against Writer have been identified. Likelihood assessments reflect the probability of a
      material adverse event, not merely applicability of the rule. EU AI Act systemic-risk thresholds and GPAI
      classification may change as the AI Office issues further guidance. All diligence paths are investor-level asks
      for pre-investment due diligence.
