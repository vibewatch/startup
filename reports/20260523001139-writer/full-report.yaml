  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Intellectual Property Risk
        blocks:
          - type: paragraph
            body: >
              Writer operates at the intersection of three active regulatory vectors that create compounding compliance
              obligations: EU AI Act governance requirements for general-purpose AI (GPAI) model providers, evolving US
              copyright doctrine on AI training data, and privacy/data-protection law (GDPR, CCPA, HIPAA) governing
              enterprise data processed by the platform.

              The EU AI Act's GPAI provisions became effective in August 2025, requiring providers of general-purpose AI
              models with systemic risk designation to perform adversarial testing, incident reporting, and cooperate
              with the AI Office. Writer's Palmyra model family — which it trains, deploys, and sells commercially —
              meets the EU Act's definition of a GPAI model provider. While the systemic risk threshold (10^25 FLOPs
              training compute) likely excludes Palmyra X5 based on published model size, ongoing compute scaling could
              eventually cross this threshold. The transparency rules for AI-generated content disclosure come into
              effect in August 2026 — directly applicable to Writer's output. Non-compliance penalties under the EU AI
              Act reach up to €30 million or 6% of global annual turnover, creating meaningful financial exposure for a
              company approaching $50M ARR. The EU Act also requires providers to publish summaries of training data
              used for GPAI models, increasing IP disclosure obligations and potentially surfacing copyright-sensitive
              data sources used in Palmyra pre-training.

              US copyright law poses a slower-burning but potentially significant risk. The US Copyright Office issued
              Part 3 of its AI Report in May 2025 (pre-publication), addressing generative AI training data and fair
              use. While the report does not create new law, it informs ongoing Congressional deliberations and signals
              that AI model providers' use of scraped training data faces increasing scrutiny. Ongoing copyright
              litigation industry-wide (including cases involving major publishers versus AI model companies) creates
              precedent risk that could require retroactive changes to training data practices or novel licensing
              arrangements. Writer's specific copyright exposure is primarily upstream — in Palmyra's pre-training data
              — rather than downstream (Writer does not generate verbatim reproductions of training text as a product
              feature). TechCrunch's November 2024 coverage of Writer's funding explicitly notes "privacy and copyright
              challenges" as headwinds for the generative AI market, positioning these as sector-wide rather than
              Writer-specific risks.

              Privacy and data protection obligations are well-addressed in Writer's published DPA, which covers GDPR,
              UK DPA 2018, FADP, and CCPA with EU Standard Contractual Clauses incorporated and the Irish Data
              Protection Commission as competent supervisory authority for EEA transfers. Writer is self-certified under
              the Data Privacy Frameworks (EU-US, UK Extension, Swiss-US). The DPA explicitly commits that Writer does
              not use Customer Data to train or modify its models — a key enterprise procurement differentiator
              confirmed independently by N26's and CirrusMD's quoted security testimonials. HIPAA/HITECH coverage is
              provided via annual SOC 2 Type II evaluations that include HIPAA requirements, enabling healthcare
              customers such as CirrusMD, Medisolv, Vizient, and SCAN Health Plan to sign BAAs. ISO 42001:2023 (AI
              management systems) certification is a particularly forward-looking compliance indicator, positioning
              Writer ahead of most enterprise AI competitors on AI-specific governance maturity. The residual legal gap
              is the absence of FedRAMP authorization, which blocks US federal government procurement — a market segment
              Writer has not prioritized but which limits TAM ceiling.
