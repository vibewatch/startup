    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Business Model
        blocks:
          - type: paragraph
            body: >
              Writer (writer.com) is an end-to-end enterprise generative AI platform headquartered at 111 Maiden Lane,
              4th Floor, San Francisco, CA 94108. The company was founded in 2020 by May Habib (CEO & co-founder) and
              Waseem AlShikh (CTO & co-founder), who had previously worked together since 2013 at Qordoba, a software
              localization and machine-translation enterprise platform. Writer launched to bring the power of generative
              AI to enterprises following the co-founders' observation of transformative opportunities in
              transformer-based AI models.

              Writer's stated mission is to expand human capacity through superintelligence, building AI that "puts
              human potential and flourishing at the core." The company describes itself as "the world's enterprise AI
              pioneer" and positions its platform as the place where leading enterprises orchestrate AI-powered work.
              The platform enables organizations to build, activate, and supervise AI agents grounded in company data
              and powered by Writer's proprietary Palmyra family of large language models.

              Writer's business model is enterprise subscription SaaS. The company offers a Starter plan at $29 per seat
              per month and an Enterprise plan with custom pricing. Enterprise contracts include seat-based and
              usage-based components, optional solution packs, and professional services. Writer employs a
              land-and-expand strategy: initial deployment to specific departments or use cases followed by organic
              expansion across the organization. The platform integrates with common enterprise systems including
              Microsoft 365, Google Workspace, Salesforce, HubSpot, and Gong, creating deep workflow lock-in. As of May
              2026 Writer operates offices in San Francisco (HQ), New York, London, Chicago, and Austin.
