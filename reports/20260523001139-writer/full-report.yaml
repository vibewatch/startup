  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR below minimum viable level
        - Q4 2024 ARR < $35M (Sacra understated by >25%)
        - 40× multiple becomes 55×+; unjustifiable by any private peer benchmark
        - Pass or require valuation renegotiation to sub-$1.3B
      - - Gross margin collapse
        - GM below 50% at time of data-room access
        - Model-hosting infrastructure is structurally uneconomic; path to software-level profitability blocked
        - Pass unless company demonstrates clear cost roadmap to >60% GM within 18 months
      - - Excessive burn
        - Monthly net cash burn above $15M
        - Runway below 12 months post-Series C; forces emergency bridge financing at unfavorable terms
        - Require bridge commit or escrow before closing; revisit cap table
      - - NRR reversal
        - NRR at Series C data room below 120%
        - Core growth flywheel broken; expansion economics not sustaining land-and-expand model
        - Downgrade to pass; existing customer set may not support $1.9B mark
      - - Customer concentration cliff
        - Top-3 customers > 35% of ARR
        - Single logo churn creates 12–15% ARR cliff event; growth trajectory invalidated
        - Require revenue concentration representation and warranty; explore escrow
      - - Hyperscaler displacement event
        - Microsoft/Google Workspace AI captures > 25% of Writer's named prospect pipeline in 2025
        - CAC escalation and pipeline compression would decelerate growth below base-case assumptions
        - Monitor quarterly; trigger re-evaluation if 2025 cohort net adds miss by 30%+
    notes: >-
      Triggers are diligence gates, not post-investment KPIs. All six must be validated before closing a new commitment
      at the $1.9B mark.
    claimRefs:
      - CV039
      - CV041
      - CV043
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR verification
        - Audited or CFO-attested ARR schedule with cohort waterfall by quarter through Q4 2024
        - Sacra $47M is a third-party estimate; underwriting cannot be based on unverified figures
        - Request from CFO in data room; cross-check against deferred revenue in balance sheet
      - - Gross margin by product line
        - >-
          Audited P&L or management-prepared gross profit schedule by revenue segment (platform subscriptions vs. API
          calls vs. PS)
        - Proprietary model hosting may compress GM below enterprise SaaS norms; critical to DCF and multiple selection
        - Request from CFO; triangulate with AWS inference cost disclosures and pricing data
      - - Burn rate and cash balance
        - Monthly cash burn and bank balance as of December 2024
        - >-
          Runway determines refinancing risk and negotiating leverage; $200M Series C implies 18–24 months at estimated
          burn
        - Request bank statements or treasurer's report; cross-reference with headcount growth data
      - - Cap table and preference stack
        - >-
          Full capitalization table with preference amounts, participating vs. non-participating, ratchets, and
          anti-dilution provisions
        - Later-stage preference overhang can impair common equity returns in modest exit scenarios
        - Request from company counsel; review standard investor rights agreement
      - - Customer concentration
        - Top-10 customer ARR contribution and tenure; earliest renewal dates
        - Single large customer churn can create cliff-edge revenue events visible in cohort data
        - Request customer revenue schedule; confirm renewal terms with legal review
      - - AWS Bedrock revenue-share terms
        - Economic terms of AWS Bedrock marketplace listing including revenue-share percentage and minimum commitments
        - >-
          Revenue-share reduces effective gross margin on AWS-channeled revenue; undisclosed exposure affects GM
          calculation
        - Request partner agreement terms; compare with standard AWS marketplace rev-share disclosures
    notes: >-
      All six items are material to underwriting at the $1.9B entry mark. None are obtainable from public sources; each
      requires data-room access or direct company engagement.
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
