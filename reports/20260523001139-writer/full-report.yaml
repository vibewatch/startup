            title: 40× ARR Multiple Demands Sustained Hyper-Growth Validation
            body: >
              Writer's $1.9B valuation at approximately 40× trailing ARR (Sacra est. $47M) places it at the upper range
              of enterprise AI comparables. This multiple is defensible only if Writer sustains triple-digit ARR growth,
              achieves SaaS-level gross margins despite LLM infrastructure costs, and avoids displacement by platform
              incumbents bundling AI into existing contracts. None of these conditions can be verified without audited
              financials, making the valuation disproportionately sensitive to unverifiable private assumptions.
            calloutType: risk
