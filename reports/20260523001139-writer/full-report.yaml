  - id: TR005
    title: Risk Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Competitive displacement by Microsoft M365 Copilot
        - >-
          Microsoft announces brand-governance / Knowledge Graph features in M365 Copilot with Writer-competitive depth;
          or Writer win rate against Microsoft-led renewals declines materially
        - >-
          Copilot achieves >70% feature parity with Writer's brand governance stack, or Writer loses 3+ top-10 customers
          citing M365 as primary alternative within a 12-month window
        - >-
          Thesis-break trigger — reassess strategic positioning; accelerate vertical-specific differentiation; explore
          whether M365 partnership/integration is more defensible than competition
      - - Regulatory enforcement action — EU AI Act / GDPR / HIPAA enforcement on AI content
        - >-
          EU AI Office enforcement action against GPAI model provider for training data disclosure or incident reporting
          non-compliance; or sector regulator restricts AI content in healthcare
        - >-
          Written regulatory enforcement notice to Writer or to a peer GPAI provider with precedent directly applicable
          to Writer's product architecture and customer verticals
        - >-
          Immediate legal team engagement; assess whether compliance remediation is achievable within 90 days; evaluate
          impact on healthcare and financial services ARR
      - - Co-founder departure
        - >-
          CEO or CTO announced departure, departure rumor, long leave of absence, or significant role change removing
          operational authority
        - >-
          Public announcement of departure or confirmed inside information of either co-founder transition within the
          investment holding period
        - >-
          Thesis-break trigger for early-stage investors; reassess based on named successor quality, retention of key
          model research leadership, and board governance commitment
      - - ARR growth deceleration below investment thesis
        - >-
          Writer discloses ARR or revenue at a rate materially below the 150%+ growth rate implied by recent trajectory;
          or third-party research revises ARR estimate downward
        - >-
          Publicly disclosed ARR growth below 60% YoY, or Sacra/secondary-market ARR estimate revision indicating
          deceleration to below 80% YoY
        - >-
          Re-underwrite unit economics; assess whether deceleration reflects market saturation, competitive
          displacement, or execution gap; determine if thesis is valid at lower growth
      - - Enterprise customer displacement event
        - >-
          Top-10 customer publicly adopts competing platform for primary Writer use cases (e.g., Salesforce deploys
          Agentforce for 3,000+ employees previously on Writer)
        - >-
          Named top-10 customer publicly attributed to a competing platform as replacement for Writer (not
          supplemental), or non-renewal disclosed at next opportunity
        - >-
          Thesis-stress event — analyze root cause (pricing, feature gap, platform consolidation); assess portfolio
          concentration and whether event is idiosyncratic or systemic
    notes: >
      Kill criteria are illustrative investor-level thesis-break triggers, not legal obligations. Thresholds reflect the
      current investment thesis assumptions documented in this chapter and in prior chapters. Monitoring relies on
      public signals (press releases, customer announcements, regulatory dockets, secondary market data) supplemented by
      ongoing management channel access.
    claimRefs:
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
