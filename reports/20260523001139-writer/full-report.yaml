      - number: '1.4'
        title: Product Platform, Technology, and Enterprise Customers
        blocks:
          - type: paragraph
            body: >
              Writer's platform is organized around three primary pillars: (1) Palmyra LLMs — a proprietary family of
              large language models purpose-built for enterprise use; (2) AI Studio — a build, activate, and supervise
              environment used by both IT and business teams; and (3) Knowledge Graph — a retrieval and grounding layer
              that integrates with enterprise data sources. Together, these enable deployment of AI agents that automate
              complex workflows, enforce brand and compliance rules, and integrate with existing enterprise systems.

              The Palmyra model family currently includes Palmyra X5 (1M token context window, adaptive reasoning,
              $0.60/$6.00 per 1M input/output tokens), Palmyra X4 (128K context, top HELM benchmark rankings,
              $5.00/$12.00 per 1M tokens), Palmyra Creative (long-form creative writing), Palmyra Med (healthcare and
              biomedical NLP, top on PubMedQA benchmarks), and Palmyra Fin (finance domain, claimed to have passed the
              CFA Level III exam). Palmyra X5 is available on Amazon Bedrock in addition to Writer's own platform.
              Models are zero-data-retention and do not train on customer data, a key compliance selling point for
              regulated industries.

              The platform's agentic layer — Writer Agent — combines an Ask Writer conversational interface with an
              Action Agent for multi-step workflow execution. Writer AI Studio provides no-code and pro-code tools for
              building custom agents, with more than 100 prebuilt agent templates. Connectors link agents to Microsoft
              365, Google Workspace, HubSpot, Gong, PitchBook, and FactSet. Governance includes role-based permissions,
              activity traces, guardrails, and approval workflows.

              Enterprise security certifications include ISO/IEC 27001, 27701, and 42001, plus annual SOC 2 Type II
              audits covering HIPAA/HITECH, PCI compliance, and GDPR adherence. These certifications lower procurement
              friction for regulated industries such as financial services and healthcare. Compared to frontier model
              wrappers (OpenAI, Anthropic API), Writer's proprietary model stack with zero-data-retention and ISO 42001
              AI management certification offers a more complete compliance profile for regulated verticals.

              As of May 2026, Writer counts 300+ enterprise customers including Uber (central knowledge management for
              ~40,000 support agents), Salesforce, Qualcomm (saves 2,400 hours per month, manages 1,200 trademarks),
              KPMG, Vanguard (57% faster time to market, first client-facing AI agent), EE, Franklin Templeton, Dropbox,
              CirrusMD, Medisolv, N26, and Lennar. Third-party reviews on G2 (4.3/5, 104 reviews) highlight brand
              consistency and knowledge grounding as top strengths, and cite steep learning curves, admin UI gaps, and
              high cost for small teams as weaknesses. TrustRadius reviews include explicit negative feedback: one
              reviewer stated Writer "slowed down the writing process, given us less than factual content, wasted our
              time."

              Writer's Knowledge Graph integrates with enterprise data sources through Connectors — pre-built API
              integrations to Microsoft 365, Google Workspace, HubSpot, Gong, PitchBook, FactSet, and others. Data flows
              through the Knowledge Graph for retrieval-augmented generation without being retained or used for model
              training. This architecture enables contextually grounded outputs while satisfying enterprise data
              residency requirements.
