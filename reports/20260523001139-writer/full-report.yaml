          pilot departments may be consolidated into incumbent AI licenses
        - High
        - >-
          Monitor competitive displacement attempts in renewal cycles; confirm NRR and gross churn by cohort; request
          data on accounts where Writer was displaced by M365 Copilot or Agentforce
      - - Full-stack enterprise AI positioning
        - >-
          Modular AI market: enterprises choose best-of-breed tools per use case rather than a full-stack platform;
          platform consolidation narrative may not materialize
        - Medium
        - >-
          Track multi-use-case adoption within existing accounts; measure share-of-wallet growth per account; ask
          customers whether platform consolidation or best-of-breed is the prevailing IT preference
