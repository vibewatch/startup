        - >-
          Microsoft Copilot and Grammarly Business add brand-governance features; internal style guide tools may
          substitute
        - Medium
        - >-
          Evaluate depth of brand-voice import/export; determine if brand voice configurations can be migrated to
          competing platforms; win proof points in accounts that explicitly credit brand governance for retention
      - - Land-and-expand multi-department lock-in
        - >-
          Microsoft bundles Copilot into M365 before Writer expands beyond initial department; Salesforce Agentforce
          expands within CRM workflows before Writer enters revenue teams
        - High
