      - number: '2.2'
        title: Market Sizing—TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              The global generative AI market stands at approximately $71.4 billion in 2025 per MarketsandMarkets and is
              projected to reach $890.6 billion by 2032 at a 43.4% compound annual growth rate—one of the most
              aggressive expansion trajectories observed in enterprise software history. Statista puts the same market
              at $63 billion in 2025 (a 13% lower estimate), reflecting narrower definitional scope that excludes
              certain AI infrastructure costs. The broader AI market, including infrastructure, is estimated at $371.7
              billion in 2025 growing to $2.4 trillion by 2032 (30.6% CAGR). These figures establish the macro TAM for
              any enterprise AI platform operating at the intersection of GenAI capability and enterprise deployment.

              Within GenAI, the enterprise agentic AI sub-market—most closely aligned with Writer's current product
              positioning—grew from negligible in 2023 to an estimated $6.8 billion in 2025, with a 47% CAGR trajectory
              to $46.0 billion by 2030. A related subsegment, retrieval-augmented generation (RAG)—a core technical
              component of Writer's knowledge platform—is estimated at $1.9 billion in 2025 growing to $9.9 billion by
              2030 (38.4% CAGR). These subsegment estimates provide anchors for Writer's realistic serviceable
              addressable market: the enterprise GenAI platform category, net of infrastructure, foundational model
              APIs, and consumer-facing tools, is plausibly a $20–$30 billion addressable opportunity in 2025 (estimated
              based on applying an enterprise layer discount of 30–40% to overall GenAI market size), growing toward
              $200–$300 billion by 2030 if CAGR estimates hold.

              The serviceable obtainable market (SOM) for Writer is bounded by its current go-to-market reach: English-
              language enterprises in North America and Europe with $500M+ revenue, multi-departmental deployment
              budgets, and willingness to run proprietary data through a third-party AI platform. Given Writer's $47M
              ARR and ~300+ enterprise customers as of late 2024, its current SOM penetration is estimated at less than
              0.5% of even the most conservative SAM estimates, implying enormous headroom if enterprise AI spend
              continues scaling at the rates forecast by all major analysts. The key risk is that hyperscaler bundled
              offerings (Microsoft Copilot, Google Duet, Salesforce Einstein) could capture the majority of SOM before
              specialized platforms establish durable differentiation.

              A persistent challenge in GenAI market sizing is the analyst estimate spread. CAGR projections range from
              30.6% (for the broad AI market) to 47% (for enterprise agentic AI specifically), with GenAI as a whole at
              43.4% per MarketsandMarkets—implying roughly 10x market expansion in 7 years. These projections embed
              assumptions about enterprise adoption velocity, compute cost deflation, and model capability improvements
              that are individually uncertain. The 2024 BCG finding that 90% of enterprises remain "observers" (not
              scaling) raises legitimate questions about whether aggregate market size projections will materialize on
              the timelines analysts project.
