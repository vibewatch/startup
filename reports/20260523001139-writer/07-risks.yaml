callouts:
  - calloutType: risk
    title: EU AI Act GPAI Obligations Create August 2026 Compliance Deadline
    body: >
      Writer's Palmyra model family meets the EU AI Act's definition of a general-purpose AI (GPAI)
      model — a model trained on broad data, usable for diverse tasks, and commercially deployed via
      API and platform. GPAI model provider obligations (transparency, incident reporting, training
      data summaries, code of practice participation) became effective August 2025. The AI content
      transparency disclosure rules — requiring labeling of AI-generated content — come into effect
      in August 2026, directly applicable to Writer's output. EU AI Act fines for GPAI non-compliance
      reach up to €30 million or 6% of global turnover. Writer's ISO 42001:2023 certification is
      a forward-looking mitigation; however, training data summary disclosure requirements and
      the exact relationship between Palmyra's compute profile and the systemic-risk threshold are
      unresolved diligence items requiring legal counsel engagement.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: risk
    title: Agent Governance Maturity Lags Agent Capability — Sacra Top Company-Specific Risk
    body: >
      Writer's autonomous AI agents now have read/write/delete access across Microsoft 365,
      Google Workspace, HubSpot, Gong, and enterprise data stores — but the agent supervision
      suite is described as "early access" in product communications, and Sacra explicitly flags
      that "governance tooling is not yet mature relative to the breadth of system access already
      being granted." Writer's own 2026 survey found that 35% of executives admit they could not
      immediately pull the plug on a rogue agent, and 67% believe their company has already
      suffered a data breach from unapproved AI tools. This is a product maturity risk that
      is time-limited — the supervision suite will mature — but the near-term window creates
      real liability exposure for enterprises deploying agents in mission-critical workflows
      before governance tooling reaches production readiness. The OWASP LLM Top 10 identifies
      "excessive agency" (LLM08) as a top enterprise AI security risk applicable directly
      to Writer's multi-system agentic deployments.
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017

  - calloutType: risk
    title: Salesforce Is Simultaneously Writer's Top Customer, Lead Investor, and a Direct Competitor
    body: >
      The Salesforce relationship is the most structurally complex risk in Writer's portfolio.
      Salesforce Ventures co-led the $200M Series C; Salesforce employs 3,000+ users on Writer
      making it one of the largest named deployments; and Salesforce's Agentforce platform is
      building native AI agent capabilities for enterprise workflows that overlap directly with
      Writer's AI Studio and agent orchestration. A scenario where Salesforce develops feature
      parity with Writer's brand-governance and knowledge-graph stack, then uses its native
      platform distribution and Salesforce CRM data advantage to displace Writer at Salesforce
      employees, would simultaneously remove a top reference customer and validate competitive
      risk for all Salesforce ecosystem accounts. The investment provides financial alignment
      but does not prevent competitive product development — no disclosed non-compete or
      contractual use restrictions have been identified.
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR029
      - CR030

  - calloutType: strength
    title: Compliance Stack Is a Structural Moat in Regulated Verticals
    body: >
      Writer's certification portfolio — SOC 2 Type II (Security, Availability, Confidentiality)
      with HIPAA/HITECH, ISO 27001:2022, ISO 27701:2019, ISO 42001:2023, and GDPR/CCPA DPA
      with EU SCCs — is materially ahead of pure-play AI writing competitors (Jasper, Copy.ai,
      Typeface) and creates a structural procurement barrier in healthcare, financial services,
      and professional services. ISO 42001 is the first international standard for AI management
      systems, and Writer holds the certification — a forward-looking governance signal that will
      become increasingly important as EU AI Act obligations and sector-specific AI governance
      requirements mature through 2026–2028. N26 and CirrusMD have publicly cited Writer's
      privacy and security posture as primary selection criteria, providing independent verification
      that the compliance investment translates to competitive win rate in regulated accounts.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR019

  - calloutType: assumption
    title: No Public Litigation Identified — But AI Sector-Wide Legal Uncertainty Is Elevated
    body: >
      As of 2026-05-23, no active lawsuits or regulatory enforcement actions against Writer
      specifically have been identified in public records. The absence of disclosed litigation is
      consistent with a company of Writer's age and profile. However, the enterprise AI sector
      as a whole faces elevated legal uncertainty from AI training data copyright litigation
      industry-wide, FTC scrutiny of AI performance claims, and EU AI Act enforcement ramp-up.
      The risks documented in this chapter are primarily forward-looking — representing the
      probability distribution of adverse events that could materialize, not current legal
      liabilities. The Copyright Office's AI Report Part 3 (May 2025) does not create immediate
      new law but signals Congressional and judicial scrutiny of the fair use doctrine's
      application to AI training data that will evolve over the 2026–2028 investment horizon.
    claimRefs:
      - CR004
      - CR005
      - CR006

