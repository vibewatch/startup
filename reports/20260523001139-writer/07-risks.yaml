  - id: security-quality-operational-risk
    title: Security, Quality, and Operational Risk
    body: >
      Enterprise AI platforms face a distinct operational risk profile that combines traditional SaaS
      security obligations with AI-specific failure modes. For Writer, the material risks cluster
      around: (1) AI hallucination and output quality, (2) agentic system governance gaps as autonomous
      agents gain write/delete access to enterprise systems, (3) the OWASP LLM Top 10 threat surface,
      and (4) supply chain and infrastructure availability.

      AI hallucination is the most frequently cited enterprise AI concern in independent research.
      McKinsey's State of AI 2025 survey (n=1,491 respondents) found that 33% of organizations reported
      consequences from AI inaccuracy, making it the single most common AI-related adverse outcome.
      Gartner's AI TRiSM framework notes that "organizations that do not consistently manage AI risks
      are exponentially inclined to experience adverse outcomes, such as project failures and breaches."
      For Writer specifically, the hallucination risk is meaningful in regulated verticals: a Palmyra
      Med output that hallucinates a medical code or a Palmyra Fin output that misquotes a regulatory
      figure in a financial report could expose the deploying enterprise to material compliance
      liability. Writer's mitigation is a combination of Knowledge Graph-grounded RAG architecture
      (which grounds outputs in customer-specific verified data rather than model parametric memory),
      configurable guardrails at the pre-call, post-call, and during-call layers, and Palmyra X5's
      extended context (4M token window) enabling full-document grounding. However, the guardrails
      documentation explicitly notes that guardrails "will only apply to external provider models" when
      using the API/SDK/Agent Builder — indicating that Palmyra-native guardrail coverage via API
      is not yet fully parity with external model guardrails. This is a residual maturity gap.

      The OWASP GenAI Security Project's LLM Top 10 identifies prompt injection, insecure output
      handling, training data poisoning, model denial of service, supply chain vulnerabilities, and
      excessive agency as the leading LLM application security risks. Writer's agent platform —
      which grants autonomous agents read/write/delete access across Microsoft 365, Google Workspace,
      HubSpot, Gong, Salesforce, and enterprise data stores — raises the "excessive agency" risk
      (LLM08) and agent governance complexity flagged by Sacra as a top company-specific risk. Writer's
      mitigation includes granular permission controls (least-privilege access), audit logs for all
      agent actions, an agent supervision suite with human-in-the-loop checkpoints, and
      enterprise-grade SSO with MFA support. However, Sacra notes that "the agent supervision suite
      is in early access, meaning governance tooling is not yet mature relative to the breadth of
      system access already being granted" — a candid acknowledgment that the product is ahead of
      its governance infrastructure. Writer's 2026 AI Adoption Survey found that 67% of executives
      believe their company has suffered a data leak or breach due to unapproved AI tools, and 35%
      admitted they could not immediately "pull the plug" on a rogue agent — a market-level indicator
      that governance gaps are widespread and that Writer's supervision tooling is commercially
      differentiated even in its current early state.

      Infrastructure and availability risk is partially observable. Writer operates on major cloud
      providers (AWS and Azure for guardrail integrations, plus GCP for data provisioning based on
      DPA language). Single-cloud concentration or a major provider outage would affect service
      availability, but the multi-provider guardrail architecture reduces the blast radius. Writer's
      security program maintains a dedicated security team, annual third-party penetration testing,
      and a trust center at trustcenter.writer.com. The ISO 27001:2022 certification covers information
      security management holistically, while SOC 2 Type II (covering Security, Availability, and
      Confidentiality) provides the most directly relevant independent assurance for enterprise
      procurement. No public Writer security incidents have been identified as of the runDate.
