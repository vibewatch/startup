callouts:
  - calloutType: strength
    title: Palmyra X5 Cost-Performance Advantage
    body: >
      At $0.60/$6.00 per 1M input/output tokens with a 1M-token context window, Palmyra X5 provides a claimed
      3–4× per-token cost advantage over GPT-4.1. Combined with ~300ms tool-call latency and strong benchmark scores
      (BBH 70.99%, MMLU_PRO 65.02%), this positions Writer's model as viable for high-volume agentic workloads
      where frontier model pricing creates budget constraints for large-scale enterprise deployment.
    claimRefs:
      - CE003
      - CE004
      - CE008

  - calloutType: risk
    title: Legacy Model Deprecation and Migration Risk
    body: >
      Five Palmyra models—X 003 Instruct, Vision, Med, Fin, and Creative—are deprecated as of the May 2026 developer
      documentation and will be removed on July 13, 2026. Customers using specialized endpoints for Fin (CFA-level
      financial reasoning) or Med (healthcare coding and clinical QA) must migrate to Palmyra X5, whose domain-specific
      parity versus the specialist models has not yet been independently benchmarked. This concentrated migration
      event in a 7-week window represents delivery and integration risk for enterprise clients.
    claimRefs:
      - CE001
      - CE009
      - CE010

  - calloutType: risk
    title: Governance Tooling Maturity Gap
    body: >
      Writer's MCP gateway and agent supervision controls are reported as available in beta for enterprise connectors
      as of May 2026. Sacra's 2024 analysis highlighted that governance tooling was not yet mature relative to the
      breadth of system access (read, write, delete across Microsoft 365, Google Workspace, HubSpot, Asana, and others)
      already being granted to Writer Agent. Enterprise buyers in regulated industries should conduct due diligence on
      the pre-GA maturity of MCP connector controls and the coverage and enforcement fidelity of guardrail integrations
      dependent on third-party AWS and Azure services.
    claimRefs:
      - CE025
      - CE041
      - CE042

  - calloutType: insight
    title: Graph RAG as a Technical Moat
    body: >
      Writer's graph-based Knowledge Graph is published research validated by a 2024 arXiv paper co-authored by CTO
      Waseem AlShikh. The system's semantic-relationship graph structure, retrieval-aware compression, and multi-hop
      query decomposition address documented failure modes of vector-only RAG in dense enterprise document corpora.
      If this technical approach is validated at scale, it represents a defensible architectural moat beyond the
      commoditizable model layer—though competitive RAG platforms (Cohere, AWS Bedrock, Microsoft Fabric) are
      developing equivalent graph-aware retrieval capabilities.
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE029

