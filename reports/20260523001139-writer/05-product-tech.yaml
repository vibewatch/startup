  - id: trust-compliance-controls
    title: Trust, Compliance, and Deployment Controls
    body: >
      Writer's enterprise security posture centers on three pillars: certifications and legal compliance, data
      protection architecture, and runtime governance controls. On certifications, Writer holds SOC 2 Type II
      (annual examinations covering Security, Availability, and Confidentiality trust service criteria), ISO/IEC
      27001 (information security management), ISO/IEC 27701 (privacy information management), and ISO/IEC 42001
      (AI management system)—the latter being specifically relevant to responsible-AI governance. The company also
      maintains HIPAA Type 1 and PCI compliance and adheres to GDPR, UK Data Protection Act 2018, Swiss FADP,
      and CCPA through its Data Processing Agreement (DPA), which includes EU Standard Contractual Clauses (SCCs)
      and UK Addendum. All major SSO providers and MFA are supported for identity management.


      Data protection is implemented via AES-256-GCM envelope encryption for data at rest. A Data Encryption
      Key (DEK) encrypts customer data; a Key Encryption Key (KEK) wraps the DEK using either Writer's managed
      KMS or a customer-supplied external KMS (Bring Your Own Key—BYOK). BYOK supports AWS KMS, Azure Key Vault,
      and GCP KMS. The DEK is cached in memory with a 5-minute TTL and is immediately cleared on pause, revoke,
      rotate, or TTL expiry. Writer's stated data policy prohibits using customer data to create, modify, or train
      its models, with configurable organizational data deletion schedules enforced at the platform level.


      Runtime governance is operationalized through the guardrails framework, which intercepts agent requests at
      pre-call, post-call, and during-call stages. Integrations with AWS Bedrock Guardrails (content filters,
      denied topic detection, word filters, PII detection, contextual grounding checks) and Azure AI Content
      Safety (text moderation for Hate/Sexual/SelfHarm/Violence categories, and Prompt Shields for injection
      detection) are available on Enterprise plans. Guardrail checks apply to both user inputs and LLM outputs.
      Pre-call blocking prevents the LLM from ever receiving disallowed prompts, saving cost and preventing
      exposure. Writer does not yet offer a proprietary first-party guardrail engine, relying on AWS and Azure
      providers for content enforcement—a dependency that constrains configuration depth for customers not already
      on those cloud stacks. A Sacra analyst report from 2024 flagged that Writer's agent supervision suite was
      in "early access" at the time, with governance tooling described as not yet mature relative to the breadth
      of enterprise system access already being granted to agents.
