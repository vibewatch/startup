  - id: knowledge-graph-rag-architecture
    title: Knowledge Graph and Data Retrieval Architecture
    body: >
      Writer's Knowledge Graph is the company's proprietary graph-based retrieval-augmented generation (RAG) system,
      positioned as a technical differentiator versus commodity vector-embedding RAG. The architecture processes
      enterprise data through five stages: content ingestion (files, connectors, web URLs), graph construction
      (entities, concepts, and semantic relationships extracted by a specialized LLM), indexing (searchable graph
      structure with retrieval-aware compression and metadata tagging), query processing (graph traversal using
      natural-language questions with optional subquery decomposition), and response generation (Palmyra LLM call
      grounded on retrieved fragments with inline source citations). A 2024 Writer research paper comparing retrieval
      systems (co-authored by CTO Waseem AlShikh) published on arXiv evaluated the KG-FID Retrieval approach
      against Azure Cognitive Search, Pinecone's Canopy, LlamaIndex/Weaviate, Google VertexAI-Search, and Amazon
      SageMaker RAG using the RobustQA metric, providing third-party independent validation framing.


      Supported file formats include PDF, TXT, DOCX, PPT/PPTX, CSV, XLS/XLSX, EML, and HTML. Prebuilt data
      connectors cover Confluence, Notion, Google Drive, and SharePoint, with web connector support for specific
      URLs or entire domains with automatic updates. Custom connectors can be authored from OpenAPI specifications
      or existing MCP server definitions. Knowledge Graph supports multi-hop questions (decomposing complex queries
      into subqueries), provides inline source citations in every response for auditability, and enables multi-graph
      queries that search across multiple organizational knowledge bases simultaneously. Configurable retrieval
      parameters include search weight, grounding level, maximum snippets and token count, and semantic thresholds.


      The Knowledge Graph pricing, per the API pricing page, is usage-based (document storage + query costs);
      specific per-query pricing was not disclosed in public documentation as of the fetch date. The data layer
      integrates natively with all three build paths—no-code agents can connect a Knowledge Graph in the builder UI
      without code, while Agent Builder and API users can configure graph queries as tool calls within multi-step
      workflows. Writer positions graph-based retrieval as superior to vector approaches for concentrated data scenarios
      where dense document collections cause vector similarity methods to fail. Independent benchmark confirmation
      beyond Writer's own documentation and the arXiv paper remains a diligence gap.
