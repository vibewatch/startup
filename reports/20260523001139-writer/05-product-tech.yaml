  - id: ai-studio-platform-architecture
    title: AI Studio Platform and Agent Architecture
    body: >
      Writer AI Studio is the unified build-activate-supervise platform through which enterprises deploy AI agents.
      It offers three build paths differentiated by technical depth: (1) no-code agents—a visual builder for recurring
      structured tasks that produces deploy-ready agents without any coding; (2) Agent Builder—a lower-code visual interface
      for more complex conditional logic; and (3) Writer Framework—an open-source Python library with a drag-and-drop UI
      builder that uses WebSocket synchronization and adds only 1–2ms overhead for event handling, enabling engineers to
      build full-stack agentic applications that integrate external APIs and data sources. REST API access and official
      SDKs in Python (writerai, requiring Python 3.9+) and Node.js (writer-sdk, published on npm) complete the developer
      surface, enabling integration with LangChain, OpenLLMetry, and AWS Strands Agents.


      The Writer Agent product layer is the orchestration surface for autonomous multi-step work. Writer Agent receives
      a natural-language task, builds a plan, invokes the necessary data sources (via Knowledge Graph) and tools (via MCP
      gateway connectors), requests human approval at designated checkpoints, and delivers polished artifacts (documents,
      dashboards, presentations). Demonstrated use cases include campaign management that queries HubSpot, synthesizes
      insights, and notifies Asana and Microsoft Teams; account meeting prep that pulls from Google Calendar, PitchBook,
      and Gong; and fund reporting via third-party financial systems. The WRITER Agent pricing is $5.00/$12.00 per 1M
      input/output tokens.


      The infrastructure backbone is the LLM Gateway, which Writer rebuilt in 2024–2025 to replace a hard-coded
      Content Generation service. The new gateway is database-driven, allowing engineers or customers to add any
      supported model provider in seconds through an admin panel without a deployment pipeline. It provides load
      balancing across replicas, automated model health checks, instant configurable guardrails, and real-time
      request tracking with full context logging. External models from AWS Bedrock, Microsoft Azure, and NVIDIA NIM
      can be enrolled and managed alongside Palmyra models within the same AI Studio interface. Crucially, the
      gateway uses an OpenAI-compatible API as the universal abstraction layer, reducing integration surface.


      The MCP (Model Context Protocol) gateway sits between agents and enterprise tools. It performs four-layer
      validation on every agent-tool interaction: IdP identity verification, connector- and agent-level permission
      check, malformed-request screening, and response integrity verification. Admin surfaces allow centralized
      connector management, OAuth control, usage session logs, and rate limit enforcement. As of May 2026, the first
      set of production connectors is available in beta for major enterprise systems (Salesforce, HubSpot, SharePoint,
      Slack, and others), representing governed MCP-based access rather than raw API keys.
