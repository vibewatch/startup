chapter:
  number: 2
  title: Market Analysis
  summary: >
    The enterprise generative AI platform market—broadly defined as software enabling AI-powered content generation,
    agentic workflows, and knowledge automation for corporate customers—is one of the fastest-growing segments in
    technology, with MarketsandMarkets estimating the global GenAI market at $71.4 billion in 2025 growing to
    $890.6 billion by 2032 (43.4% CAGR). Within this, the enterprise agentic AI sub-market is smaller but
    accelerating even faster: $6.8 billion in 2025 to $46.0 billion by 2030 (47% CAGR). Adoption has reached
    mainstream status—88% of organizations use AI in at least one function per McKinsey—but scaling remains the
    exception: only one-third of organizations are actively scaling, only 2% have deployed AI agents at full scale,
    and just 29% report significant ROI. Growth is driven by board-level AI mandates, the emergence of the agentic
    AI paradigm, and early productivity evidence. Constraints include skills gaps, data and integration complexity,
    trust concerns, and ROI realization challenges. Large enterprises ($5B+ revenue) lead adoption velocity at
    ~50% scaling vs. ~29% for smaller firms. Market estimates from different analysts diverge by 13–30%,
    primarily due to definitional inconsistencies in what counts as "enterprise GenAI platform" spend.

sections:
  - id: market-boundary
    title: Market Definition and Scope
    body: >
      The enterprise AI platform market encompasses software products and related professional services that enable
      organizations to deploy generative AI capabilities at scale across business workflows. Unlike consumer AI
      applications, enterprise AI platforms must satisfy a distinct set of requirements: scalability to support
      thousands of users across distributed organizations; model reliability with consistent, auditable output
      quality; data governance and security controls meeting enterprise and regulatory standards; deep integration
      with existing enterprise systems (ERP, CRM, HRIS, document management); and centralized administration and
      compliance tooling. IBM's enterprise AI framework identifies these five axes—scalable, reliable, secure,
      integrated, governed—as the minimum viable requirement threshold distinguishing enterprise from consumer AI.

      The market stratifies into three nested layers. The broadest is the overall AI market, which spans
      infrastructure (chips, cloud compute), software (models, platforms, applications), and services (consulting,
      implementation). Within that sits the generative AI layer: AI systems capable of generating text, code,
      images, and structured data from natural-language prompts. The enterprise GenAI layer is the commercially
      relevant serviceable market for vendors such as Writer: enterprise-contracted, workflow-integrated GenAI
      platforms emphasizing governance, multi-model composition, and departmental deployment. The newest and
      fastest-growing sub-layer is enterprise agentic AI: autonomous AI systems that plan, execute multi-step
      tasks, and interact with enterprise data and tools without human review of each step. Writer's product
      architecture spans all three enterprise sub-layers, positioning the company in the fastest-growing segment
      of an already high-CAGR market.

      Market boundary disagreements among analysts trace primarily to three definitional forks: (1) whether AI
      infrastructure and foundational model costs are included, (2) whether consumer-facing AI products with
      enterprise tier upsells count as "enterprise AI," and (3) whether agentic AI is classified as a sub-segment
      of GenAI or a separate vertical. These definitional disputes explain the 13–30% spread in headline market
      size figures across MarketsandMarkets, Statista, and Gartner estimates and are a material source of
      uncertainty in assessing Writer's TAM.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM035
      - CM036
    tableRefs:
      - TM001
    figureRefs:
      - FM001

  - id: market-sizing
    title: Market Sizing—TAM, SAM, and SOM
    body: >
      The global generative AI market stands at approximately $71.4 billion in 2025 per MarketsandMarkets and is
      projected to reach $890.6 billion by 2032 at a 43.4% compound annual growth rate—one of the most aggressive
      expansion trajectories observed in enterprise software history. Statista puts the same market at $63 billion
      in 2025 (a 13% lower estimate), reflecting narrower definitional scope that excludes certain AI infrastructure
      costs. The broader AI market, including infrastructure, is estimated at $371.7 billion in 2025 growing to
      $2.4 trillion by 2032 (30.6% CAGR). These figures establish the macro TAM for any enterprise AI platform
      operating at the intersection of GenAI capability and enterprise deployment.

      Within GenAI, the enterprise agentic AI sub-market—most closely aligned with Writer's current product
      positioning—grew from negligible in 2023 to an estimated $6.8 billion in 2025, with a 47% CAGR trajectory
      to $46.0 billion by 2030. A related subsegment, retrieval-augmented generation (RAG)—a core technical
      component of Writer's knowledge platform—is estimated at $1.9 billion in 2025 growing to $9.9 billion by
      2030 (38.4% CAGR). These subsegment estimates provide anchors for Writer's realistic serviceable addressable
      market: the enterprise GenAI platform category, net of infrastructure, foundational model APIs, and
      consumer-facing tools, is plausibly a $20–$30 billion addressable opportunity in 2025 (estimated based on
      applying an enterprise layer discount of 30–40% to overall GenAI market size), growing toward $200–$300
      billion by 2030 if CAGR estimates hold.

      The serviceable obtainable market (SOM) for Writer is bounded by its current go-to-market reach: English-
      language enterprises in North America and Europe with $500M+ revenue, multi-departmental deployment budgets,
      and willingness to run proprietary data through a third-party AI platform. Given Writer's $47M ARR and
      ~300+ enterprise customers as of late 2024, its current SOM penetration is estimated at less than 0.5% of
      even the most conservative SAM estimates, implying enormous headroom if enterprise AI spend continues scaling
      at the rates forecast by all major analysts. The key risk is that hyperscaler bundled offerings (Microsoft
      Copilot, Google Duet, Salesforce Einstein) could capture the majority of SOM before specialized platforms
      establish durable differentiation.

      A persistent challenge in GenAI market sizing is the analyst estimate spread. CAGR projections range from
      30.6% (for the broad AI market) to 47% (for enterprise agentic AI specifically), with GenAI as a whole
      at 43.4% per MarketsandMarkets—implying roughly 10x market expansion in 7 years. These projections embed
      assumptions about enterprise adoption velocity, compute cost deflation, and model capability improvements
      that are individually uncertain. The 2024 BCG finding that 90% of enterprises remain "observers" (not
      scaling) raises legitimate questions about whether aggregate market size projections will materialize on the
      timelines analysts project.
