  - id: buyer-segmentation
    title: Buyer Segmentation and Demand Profiles
    body: >
      Enterprise AI buyers segment along two primary axes: company size (which determines budget authority and
      deployment complexity) and industry vertical (which determines regulatory constraints and use-case priority).
      McKinsey's State of AI 2025 data reveals a significant scaling gap between large enterprises ($5B+ revenue),
      where approximately 50% are actively scaling AI, and mid-market firms ($1B–$5B revenue), where only 29%
      are scaling. This gap reflects both budget availability and the organizational capacity to absorb AI-driven
      process change.

      By function, marketing and content operations represent the highest-volume initial GenAI entry point.
      Salesforce's State of Marketing survey finds AI adoption rates near universal among marketing leaders, with
      content generation, campaign optimization, and customer communication personalization as the top use cases.
      Writer's own customer portfolio—including KPMG, Vanguard, Vodafone UK/VOIS, EE (BT Group), and Snap
      Health Plan—illustrates that initial marketing deployments frequently serve as a wedge into broader
      enterprise adoption across legal, HR, finance, and customer support functions. Snap Health Plan uses Writer
      for personalized member communication; Vanguard reports 57% faster time to market for product launches;
      Vodafone UK reduced content creation time by 50%, saving employees approximately one day per week.

      Decision-making authority in enterprise AI procurement has migrated upward. PwC's 2026 AI Business
      Predictions note that organizations are centralizing AI strategy under C-suite ownership, with an
      emerging "AI studio" model where a central team establishes approved platforms, governance policies,
      and deployment playbooks that business units then consume. This centralization creates a durable vendor-
      selection dynamic: once a platform is approved by a CIO/CTO and embedded in governance policy, switching
      costs rise substantially, favoring vendors that win the initial enterprise platform evaluation.

      Capgemini's Rise of Agentic AI report (1,500 executives, 14 countries) finds that while 61% of organizations
      are still exploring AI agent deployment, 82% plan to deploy agents within one to three years, and 15% of
      business processes are expected to reach semi- or full autonomy within 12 months. By 2028, 38% of
      organizations expect AI agents to operate as team members within human workflows. These data points
      characterize the buyer in 2025–2026 as actively evaluating agentic AI vendors and under internal pressure
      to show deployment progress—creating a procurement window favorable for platforms with proven agent
      orchestration capabilities.
