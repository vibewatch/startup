  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >
        No publicly available breakdown of enterprise AI spend by functional area (marketing vs. legal vs. HR vs.
        customer support) to validate TAM sizing for Writer's specific multi-department deployment segments.
      whyItMatters: >
        Without functional-area spend data, the SAM estimate remains a top-down calculation that may overstate
        the addressable market for a platform entering primarily through marketing/content use cases.
      diligencePath: >
        Acquire primary Gartner or Forrester functional-area AI spend research; request analyst briefing or
        purchase enterprise AI spend-by-function report from IDC.
      relatedQuestionRefs:
        - QM006
        - QM007
      relatedTableRefs:
        - TM003
  
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >
        The 13%+ spread between MarketsandMarkets and Statista GenAI market estimates ($71.4B vs. $63B for 2025)
        has not been reconciled by either source, and no independent audit of analyst market-sizing methodologies
        for GenAI is publicly available.
      whyItMatters: >
        The spread in estimates affects the confidence interval on TAM calculations and may indicate that one
        analyst is significantly over- or under-counting enterprise-contracted GenAI spend.
      diligencePath: >
        Obtain methodology disclosures from both MarketsandMarkets and Statista (primary research vs. secondary
        synthesis); cross-reference with Gartner Magic Quadrant spend data if available.
      relatedQuestionRefs:
        - QM009
        - QM016
  
    - type: missing-source
      severity: material
      topic: buyer-segmentation
      missingEvidence: >
        No analyst or industry body has published an authoritative, independently verified buyer segment breakdown
        for the enterprise GenAI platform market with percentage shares of spend by segment.
      whyItMatters: >
        Without segment-level spend data, the buyer segment map in TM003 is a qualitative synthesis, not a
        quantitative estimate. It may misrepresent the relative importance of regulated industries vs. horizontal
        enterprise segments.
      diligencePath: >
        Request IDC or Gartner custom research on enterprise AI platform buyer segment spend allocation. Supplement
        with SCIM or similar enterprise SaaS spend-intelligence platforms.
      relatedQuestionRefs:
        - QM001
        - QM002
        - QM003
      relatedTableRefs:
        - TM003
  
    - type: missing-source
      severity: minor
      topic: competitive-landscape
      missingEvidence: >
        No independent estimate of hyperscaler enterprise AI platform revenue (Microsoft Copilot M365, Google Duet
        for Workspace, Salesforce Einstein GPT) is publicly available, making it impossible to quantify the SOM
        that hyperscalers have already captured.
      whyItMatters: >
        If hyperscalers have captured 60%+ of the enterprise AI platform spend at large enterprises, the realistic
        SOM for Writer and independent platforms may be substantially smaller than the segment estimates in TM003
        suggest.
      diligencePath: >
        Monitor Microsoft, Google, and Salesforce earnings call disclosures for enterprise AI seat or revenue
        data; cross-reference with analyst notes on Copilot commercial seat counts.
      relatedQuestionRefs:
        - QM013
  
    - type: stale
      severity: minor
      topic: adoption-constraints
      missingEvidence: >
        BCG's GenAI survey ("From Potential to Profit") was published in 2024 and may not fully reflect the
        acceleration in agentic AI adoption observed in late 2025 and early 2026.
      whyItMatters: >
        If enterprise AI scaling has meaningfully accelerated since the BCG survey, the 90% "observer" figure
        may overstate the adoption constraint, affecting the growth driver / constraint balance analysis.
      diligencePath: >
        Monitor BCG's 2025–2026 GenAI update publications; cross-reference with McKinsey's most recent
        State of AI survey (November 2025 data is the most current confirmed source).
      relatedQuestionRefs:
        - QM014

    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >
        No publicly available enterprise AI platform spend-per-employee or per-seat data at organizations
        that have reached the scaling stage, making it impossible to validate pricing benchmarks or
        estimate SOM from a bottoms-up per-seat perspective.
      whyItMatters: >
        Without per-seat spend data, the SOM calculation relies entirely on top-down market fractions
        rather than bottoms-up unit economics, reducing confidence in the estimates provided.
      diligencePath: >
        Request analyst briefing from Gartner or Forrester on enterprise AI seat-based spend per employee;
        supplement with LinkedIn Talent Insights or enterprise procurement data where available.
      relatedQuestionRefs:
        - QM023

    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >
        No independent breakdown of enterprise AI platform market size and growth rates by geography
        (North America vs. Europe vs. Asia-Pacific) is publicly available to assess whether Writer's
        primarily North American and European revenue base reflects a higher-growth or lower-growth
        segment of the global market.
      whyItMatters: >
        If Asia-Pacific is growing materially faster than North America and Europe (which available
        data suggest but does not confirm quantitatively), Writer's concentration in Western markets
        may result in lower realized CAGR than headline global GenAI market estimates imply.
      diligencePath: >
        Acquire IDC or Gartner regional AI spend reports; cross-reference with regional enterprise
        software market analysis from Synergy Research or similar firms.
      relatedQuestionRefs:
        - QM018

    - type: missing-source
      severity: minor
      topic: adoption-constraints
      missingEvidence: >
        No independent authoritative assessment of the probability or magnitude of regulatory impact
        from the EU AI Act (enforcement beginning 2025-2026), US sector-specific AI rules (financial
        services, healthcare), and data-residency requirements on enterprise GenAI platform adoption
        through 2027.
      whyItMatters: >
        Regulatory restrictions in regulated industries—healthcare, financial services, and public
        sector—could limit Writer's addressable market in those verticals if compliance requirements
        prove more onerous than current customer evidence suggests.
      diligencePath: >
        Commission regulatory counsel review of EU AI Act compliance implications for enterprise GenAI
        platforms; monitor NIST AI Risk Management Framework adoption and sector-specific AI rule
