  - id: drivers-and-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The enterprise GenAI market is propelled by four primary growth drivers. First, board-level AI mandates:
      89% of C-suite executives rank AI or GenAI as a top-three technology priority, and 85% are increasing AI
      spend, creating top-down pressure to show deployment progress regardless of ROI clarity. Second, the agentic
      AI inflection point: the emergence of AI agents capable of autonomous multi-step task execution is
      transforming the value proposition from "AI assistant" to "AI workforce," unlocking new budget categories
      and competitive urgency. Third, early ROI evidence: the Forrester TEI study commissioned for Writer found
      333% ROI with a six-month payback period among Writer enterprise customers, and McKinsey data shows that
      organizations actively scaling AI are substantially more likely to report material financial impact than
      those still at the pilot stage. Fourth, the super-user productivity multiplier: Writer's own data finds
      that heavy users of AI tools are 5× more productive and 3× more likely to receive promotion, creating
      grassroots demand pressure from employees who experience the productivity differential firsthand.

      Against these tailwinds, adoption is constrained by four structural barriers. First, the ROI realization
      gap: only 29% of enterprise executives report seeing significant ROI from GenAI investments, meaning the
      majority of enterprise AI deployments have not yet crossed the productivity threshold necessary to justify
      expanded investment. Second, the talent and skills gap: only 6% of organizations have trained more than
      25% of their workforce on GenAI tools per BCG, and the PwC 80/20 rule—20% technology, 80% workflow
      redesign—illustrates that technical deployment alone does not deliver value. Third, trust and governance
      concerns: Capgemini found that trust in fully autonomous AI agents dropped from 43% to 27% of organizations
      in one year, and 67% of employees in Writer's survey believe that unapproved AI tool usage by colleagues
      has already created data breach risk. Fourth, integration and data readiness: fewer than one in five
      organizations report high maturity in the data and technology infrastructure required to implement agentic
      AI at scale, creating a long-lead infrastructure dependency before full platform value is achievable.

      The net effect is a market with exceptional headline growth rates but substantial deployment friction,
      creating bifurcated outcomes: a small cohort of well-resourced enterprises achieving dramatic productivity
      gains, and a larger cohort investing heavily with minimal near-term return. This dynamic favors vendors
      that can compress the time-to-ROI curve through turnkey deployment, pre-built integrations, and
      change management support—precisely the value proposition Writer articulates in its platform strategy.
