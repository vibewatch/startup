  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: "NRR and GRR cohort data from private investor documents or company disclosures"
      whyItMatters: >
        Without NRR or GRR, it is impossible to assess whether TravelPerk's 50%+ headline growth reflects
        durable expansion of the existing customer base or is primarily new customer acquisition. NRR above
        or below 100% fundamentally changes the revenue quality assessment.
      diligencePath: "Request annual cohort retention tables in due diligence; benchmark against SaaS peer group (Navan, Expensify, Concur)"
      relatedQuestionRefs:
        - QU017
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: concentration risk
      missingEvidence: "Revenue concentration data: top-10 and top-50 customer revenue as percentage of total"
      whyItMatters: >
        With $200M+ ARR and 10,000 accounts, average ACV is ~$20,000 — but the distribution is unknown.
        If a handful of anchor accounts (Red Bull, large enterprise) represent a meaningful revenue share,
        loss of one creates outsized impact.
      diligencePath: "Request tiered customer breakdown by ACV band; ask for historical churn rates by segment"
      relatedQuestionRefs:
        - QU022
      relatedTableRefs:
        - TU005

    - type: missing-source
      severity: minor
      topic: customer satisfaction
      missingEvidence: "NPS or CSAT data segmented by buyer persona (travel manager vs. individual traveler)"
      whyItMatters: >
        Trustpilot's mixed 3.2/5 rating may reflect a different persona (business traveler) than TravelPerk's
        core buyer (travel manager, CFO). Without persona-segmented NPS, the satisfaction signal is ambiguous.
      diligencePath: "Request internal NPS data by role; compare buyer NPS vs. traveler NPS for top 100 accounts"
      relatedQuestionRefs:
        - QU018

    - type: enumeration-incomplete
      severity: minor
      topic: named customer proof
      missingEvidence: "Published case studies for high-profile brand logos: Red Bull, Fujifilm, Aesop, Nord Security"
      whyItMatters: >
        These brands appear in press materials as marquee references, but lack any published outcome data.
        Their inclusion without case studies reduces the evidentiary value of the named-logo list.
      diligencePath: "Request reference calls or written testimonials from at least two of these named accounts"
      relatedQuestionRefs:
        - QU008
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: minor
      topic: customer segments
      missingEvidence: "US customer count, revenue split, and growth rate following AmTrav acquisition"
      whyItMatters: >
        The US market is a stated strategic priority; without any public disclosure of AmTrav's client
        count or post-acquisition revenue contribution, the US expansion thesis cannot be independently assessed.
      diligencePath: "Request AmTrav standalone P&L and customer migration metrics for Q4 2024 – Q1 2026"
      relatedQuestionRefs:
        - QU026

    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Growth trajectory segmented by new accounts vs. expansion revenue vs. booking volume 2025–2026"
      whyItMatters: >
        TravelPerk's 50%+ ARR growth is publicly stated, but whether it is driven by new logo acquisition or
        net expansion of existing accounts cannot be determined without disclosed NRR/GRR or customer-count
        growth data for calendar year 2025 and into 2026.
      diligencePath: "Request monthly cohort-level bookings data for 2024–2026; NRR/GRR by ACV band"
      relatedQuestionRefs:
        - QU005

    - type: private-evidence-only
      severity: minor
      topic: retention
      missingEvidence: "FlexiPerk add-on attachment rate, cancellation rate, and cohort-level retention uplift"
      whyItMatters: >
        FlexiPerk is described as TravelPerk's top-selling paid add-on and a key moat, but no data on cohort
        retention difference between FlexiPerk and non-FlexiPerk accounts has been disclosed. Without this,
        the retention durability claim cannot be independently validated.
      diligencePath: "Request internal cohort analysis: 24-month GRR for accounts with vs. without FlexiPerk"
      relatedQuestionRefs:
        - QU019

