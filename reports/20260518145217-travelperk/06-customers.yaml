company:
  name: TravelPerk

chapter:
  number: 6
  title: Customers
  summary: >
    TravelPerk (rebranded Perk) serves more than 10,000 business customers globally, concentrated in SMB and
    mid-market companies across Europe and the US, with a growing enterprise footprint via the AmTrav and Yokoy
    acquisitions. Named accounts spanning tech, mobility, retail, and fitness verticals demonstrate multi-year
    tenures, high platform adoption rates (97–99% compliance), and quantified cost savings. Customer satisfaction
    is mixed: case studies show strong outcomes, but Trustpilot carries a 3.2/5 average rating with recurring
    complaints about customer support responsiveness and FlexiPerk policy ambiguity. NRR and formal churn data
    remain undisclosed, representing a material diligence gap.

sections:
  - id: customer-base-segmentation
    title: Customer Base and Market Segmentation
    body: >
      TravelPerk primarily targets SMB and mid-market companies—broadly defined as 10–5,000 employees—in Europe
      and the United States, with the Series E in January 2025 explicitly stating the company's strategic focus on
      "SMB and mid-market companies in the US and Europe." Named customers span a wide range of verticals: tech
      scale-ups (Storyblok, Freepik, GoCardless), mobility and transport (Bolt, Cabify), retail and lifestyle
      (Fabletics, Lush), e-commerce (ManoMano), fitness (PureGym), automotive marketplaces (AutoScout24), and
      travel technology (GetYourGuide). The platform is also used by high-profile brands cited in company
      materials: Red Bull, Aesop, Fujifilm, and Nord Security.

      Geographically, the historical installed base is predominantly European (Barcelona-headquartered, with UK,
      Germany, Spain, and France as core markets), but the 2024 acquisitions of AmTrav (US-based, 30+ years
      history) and the 2024 expansion of its AmTrav brand have significantly accelerated US penetration. Yokoy's
      700+ customers in Switzerland and DACH markets add a Central European dimension. Company size skews toward
      digital-native businesses with distributed workforces that travel regularly for inter-office coordination,
      sales, and events rather than for strategic account management at enterprise scale. TravelPerk does not
      publicly disclose a breakdown of its customer base by size band, geography, or vertical, which makes
      independent validation of segment proportions impossible.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory-and-scale
    title: Adoption Trajectory and Platform Scale
    body: >
      TravelPerk's adoption story is framed through booking volume growth rather than customer count growth.
      Annualized gross booking volumes reached $2.5 billion as of early 2025, up from roughly $2 billion in
      January 2024 and from a pre-pandemic level that the company has described as a fraction of current scale.
      Annualized revenue passed $200 million with growth exceeding 50% per annum over the prior two years. The
      Travel Weekly Power List 2025 cites TravelPerk's 2024 reported sales at $2.22 billion, ranking it among
      the top-40 travel management companies by booking volume globally.

      At the account level, TravelPerk's own materials cite more than 10,000 business customers globally as
      of September 2025. The value of business travel survey published in June 2024 recruited more than 5,200
      Perk customers for primary research, providing a meaningful proxy for an active user base. Individual
      case studies show steep trip-volume growth within accounts: Bolt went from manual ad-hoc booking in 2018
      to 11,000 services for 2,000+ traveling staff in 2024 alone; GetYourGuide scaled to 200+ monthly trips
      across 17 offices; Storyblok runs 60+ monthly trips across 43 international offices. Fabletics onboarded
      116 employees with 99% adoption and processed $37,500 in quantifiable savings in the first twelve months.
      These trajectories are consistent with a land-and-expand dynamic where initial policy-compliance tooling
      drives seat expansion as customer workforces grow.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-customer-evidence
    title: Named Customer Evidence and Reference Quality
    body: >
      TravelPerk's customer proof library is extensive for a private SaaS company of its vintage. The case
      study portfolio covers at least twelve named accounts with published quotes from named individuals in
      specific job titles, quantified outcome metrics, and deployment context (production vs. expansion stage).
      GetYourGuide stands out as the most tenured reference: a customer since TravelPerk's founding in 2015,
      managing 200+ monthly trips across 17 offices and co-developing the FlexiTravel cancellation feature. Bolt
      offers the most operationally rich case: 4,000+ employees, 51 offices across 50 countries, 27,000 work
      trips booked since 2018, and a documented 10% travel cost reduction since adopting TravelPerk.

      The named-customer roster skews toward European tech and scale-up companies, with limited US enterprise
      reference accounts (AmTrav's client list has not been disclosed publicly). The cases predominantly reflect
      self-booking adoption, policy compliance, and time savings as outcomes rather than hard ROI metrics. The
      most detailed quantified case is Fabletics: $15,268 in policy savings, $10,235 in flight policy savings,
      and $3,013 in finance team time savings over twelve months, totaling $37,500 with a 99% adoption rate
      across 116 European employees. MedSkin demonstrates integration depth: 99% AI accuracy in expense
      matching, 100% data synchronization between HR (Personio), travel, and expense tools. AutoScout24
      (Europe's largest online car marketplace, 1,000 employees, 11 European markets) adopted the platform in
      2023 for pan-European policy consolidation and hotel rate negotiation. These cases validate production
      deployment, not piloting.
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
    tableRefs:
      - TU003
    figureRefs:
      - FU003

  - id: retention-satisfaction-durability
    title: Retention, Satisfaction, and Durability Signals
    body: >
      TravelPerk does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or
      annual churn rates. The absence of these metrics in any investor communication, press release, or media
      coverage is a material diligence gap. However, proxy signals suggest structural retention durability.
      Named customers show multi-year tenures: GetYourGuide has been a customer since 2015 (11 years), Bolt
      since 2018 (8 years), and multiple others for 3–5 years without any publicized churn. The company's
      50%+ annual growth with a customer count exceeding 10,000 implies net customer growth, indicating
      new customer acquisition comfortably outpaces any attrition.

      Third-party satisfaction signals are mixed. TravelPerk holds a 3.2 out of 5 ("Average") TrustScore
      on Trustpilot as of mid-2025, with recurring themes in negative reviews: FlexiPerk policy confusion
      (customers expecting change coverage that applies only to cancellations), slow customer support response
      times, flight-provider data outages preventing self-service modifications, and perceived lack of pricing
      advantage over direct booking. GetApp reviews are generally positive, and G2 positions the platform
      as a top-rated travel management SaaS. The divergence between B2B enterprise case study satisfaction
      and individual B2C-style Trustpilot reviews may partly reflect consumer travelers using employer-issued
      accounts rather than the core SMB/mid-market buyers who are the product's design target.
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-concentration-risk
    title: Expansion, Concentration Risk, and Durability Outlook
    body: >
      TravelPerk's revenue model is structurally aligned with customer expansion: seat count grows as
      customer workforces scale, booking volume grows as travelers take more trips, and the FlexiPerk
      add-on (charged at 25% of booking value) creates a recurring revenue attach rate. The acquisition of
      Yokoy and the launch of integrated expense management deepens switching costs by embedding financial
      workflows into the same platform as travel policy, making replacement costlier. Customer integration
      case studies uniformly highlight HR system connections (BambooHR, Workday, Personio, SSO) and finance
      integrations, anchoring TravelPerk in the operational stack rather than as a simple booking tool.

      Customer concentration risk is not disclosed. No individual customer has been named as representing
      more than a modest share of booking volume; the 10,000+ account base suggests low single-account
      concentration risk, but the Yokoy base (700+ smaller finance-focused clients) and the AmTrav addition
      bring integration complexity. Geographic concentration in Europe remains an overhang: US expansion is
      recent and the AmTrav brand still operates semi-independently. The emerging expense management motion
      is both an expansion opportunity and an execution risk, since Yokoy integration is in progress and
      direct competitors (Navan, SAP Concur, Emburse) offer more mature spend management suites. The
      announced GVB (a European mobility provider) expense automation deployment delivering 300+ hours per
      year in savings illustrates the value proposition, but the pipeline depth for T&E integrated deals
      has not been disclosed.
    claimRefs:
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
    tableRefs:
      - TU005

