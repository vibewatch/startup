callouts:
  - calloutType: strength
    title: Deep Named-Customer Proof With Multi-Year Tenures
    body: >
      TravelPerk's published case study library includes nine+ named accounts with specific job-title quotes,
      measurable outcomes, and multi-year tenures (GetYourGuide 9 years, Bolt 8 years). The depth and volume of
      this proof library is uncommon for a private company at this stage and validates platform stickiness
      beyond marketing claims.
    claimRefs:
      - CU014
      - CU015
      - CU016

  - calloutType: risk
    title: NRR / GRR Entirely Undisclosed — Material Diligence Gap
    body: >
      No investor communication, press release, or media coverage has disclosed TravelPerk's net revenue
      retention or gross revenue retention. The 50%+ headline growth obscures whether expansion revenue
      or new customer acquisition drives growth. Without NRR, the durability of the installed base
      cannot be independently validated.
    claimRefs:
      - CU022
      - CU036

  - calloutType: risk
    title: Mixed Customer Satisfaction — Trustpilot 3.2/5 With Recurring Complaints
    body: >
      Trustpilot's 3.2/5 "Average" rating reflects recurring complaints about FlexiPerk policy confusion,
      customer support latency, and flight-provider data outages. These issues disproportionately affect
      traveler-users rather than admin buyers, but unresolved traveler dissatisfaction can drive management
      to switch platforms at contract renewal.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028

