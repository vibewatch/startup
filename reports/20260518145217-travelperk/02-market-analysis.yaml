  - id: growth-drivers-constraints
    title: "Growth Drivers and Adoption Constraints"
    body: |
      Several structural forces are simultaneously expanding the TMS market and reshaping buying criteria, while a
      separate set of constraints limits the pace at which new platforms displace incumbents.

      The most powerful tailwind is market recovery and sustained expansion. GBTA buyer sentiment (Q4 2025) found
      that 79% of corporate travel buyers expected their company's travel spend to increase in 2026 versus 2025,
      while only 8% anticipated cuts. This consistent upward budget pressure increases GBV through existing
      platforms and accelerates evaluation of new tools.

      AI adoption is the fastest-moving technology driver. Travel programs using AI-assisted booking recommendations
      rose from 34% in 2024 to 71% in 2026 according to the American Express GBT 2026 Tech Trends Report cited by
      Travel-Code. IATA's New Distribution Capability (NDC) standard crossed 30% of indirect airline content by
      Q1 2026, enabling richer fare bundling and ancillary visibility — a tailwind for platforms investing in NDC
      integration. Together, AI and NDC raise switching costs and differentiate modern platforms from legacy TMC tools.

      Regulatory pressure is an emerging but material driver. The EU Corporate Sustainability Reporting Directive
      (CSRD, Directive 2022/2464, in force January 2024) requires approximately 50,000 companies to disclose Scope 3
      travel emissions in audited annual filings. GBTA's 2025 Sustainability Index found that 64% of corporate travel
      programs now include emissions data in supplier RFPs, up from 38% in 2023. This elevates green-reporting
      capabilities — Perk's GreenPerk and carbon-offset features — from differentiators to evaluation criteria.

      On the constraint side, legacy ERP integration remains the most cited deployment blocker. Finance teams at
      mid-market and enterprise companies require Perk to connect with Workday, NetSuite, SAP, and local payroll
      systems before they can close the loop on expense reconciliation. Platforms that lack out-of-the-box connectors
      face extended implementation cycles that delay ARR recognition. Consumer-channel leakage is a second persistent
      constraint: 56% of travellers still book at least some trips through consumer OTAs (Expedia, Booking.com)
      rather than the corporate tool, fragmenting expense data and undermining the policy-compliance value proposition.
      Travel disruptions — 78% of travellers were affected in 2024 — add operational cost but also validate
      FlexiPerk and real-time rebooking as high-perceived-value features that justify TMS investment.
