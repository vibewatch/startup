callouts:
  - calloutType: insight
    title: "Mid-Market is the Highest-Velocity Segment"
    body: >
      Mid-sized businesses (201–2,000 employees) are the most likely to increase travel budgets (51% in 2024),
      face the strongest product-market fit gap — too large for consumer tools, too cost-constrained for enterprise
      TMCs — and represent Perk's declared core segment. Every dollar in business travel generates $12 in SMB/mid-
      market revenue, supporting the payer's willingness to invest in a managed platform over ad-hoc booking.
    claimRefs:
      - CM021
      - CM027

  - calloutType: risk
    title: "Consumer Booking Leakage Undermines TMS Value Proposition"
    body: >
      56% of business travellers book at least some trips outside their corporate tool, and only 14% of buyers were
      using AI in their travel programs as recently as 2023. Leakage degrades expense data completeness,
      reduces compliance rates, and weakens the policy-enforcement value proposition that justifies TMS subscription
      costs. This structural headwind requires continuous traveller-side UX investment to narrow the gap with
      consumer OTAs.
    claimRefs:
      - CM024
      - CM039

  - calloutType: strength
    title: "EU CSRD Creates a Mandatory Demand Signal"
    body: >
      With the EU CSRD requiring ~50,000 companies to disclose Scope 3 travel emissions in audited filings, and
      64% of corporate programs already including emissions data in supplier RFPs, green-capable TMS platforms gain
      a compliance-driven procurement advantage. Perk's GreenPerk carbon tracking and offsetting features move from
      nice-to-have to essential for EU customers approaching their first CSRD reporting cycle.
    claimRefs:
      - CM035
      - CM036

