  - id: buyer-segmentation
    title: "Buyer, User, and Payer Segmentation"
    body: |
      Corporate travel decisions involve three distinct roles that rarely reside in the same person: the buyer (who
      evaluates and contracts the platform), the user (the employee traveller), and the payer (the budget holder who
      funds the spend). Understanding who controls each role — and what each role cares about — is the foundation of
      Perk's go-to-market and product design.

      The buyer is typically a Travel Manager, Finance Director, or VP of Operations at mid-market firms; a
      Procurement Director or Global Travel Director at enterprise; and the CEO or Office Manager at SMBs. Buying
      criteria differ sharply: enterprise buyers prioritise compliance, duty-of-care coverage, and ERP integration;
      mid-market buyers want cost visibility, ease of deployment, and policy automation; SMB buyers prioritise
      simplicity, per-trip pricing (no seat licence), and time savings. Survey data from Perk confirms that 94% of
      T&E decision-makers want an all-in-one solution covering travel, reimbursements, expense management, and
      corporate cards — validating the post-Yokoy unified platform strategy. Similarly, 90% want automated policy
      compliance enforcement, which Perk reports achieving above 90% compliance rate on its platform.

      The user is the travelling employee — most frequently sales representatives, consultants, client-service
      professionals, and executives. Of these travellers, 56% book their own hotel stays and flights while 44%
      have an administrator or travel manager book on their behalf. This split means Perk's UX must satisfy both
      a consumer-style self-service booker and a manager operating on behalf of others.

      The payer is the company finance function, which in 62% of firms (by CEO survey) expected to increase travel
      budgets in 2024. ROI justification drives budget allocation: for SMBs and mid-market companies, Perk's own
      research shows that every dollar invested in business travel generates $12 in incremental revenue, primarily
      through new customer acquisition, while 34% of C-suite leaders credited a third of their 2023 sales growth to
      in-person meetings. This strong ROI narrative supports budget protection even under macro headwinds.

      Mid-sized businesses (201–2,000 employees) are the most likely to increase travel spend (51% in 2024) ahead of
      large enterprises (50%) and SMBs (43%). This segment — Perk's stated core — has outgrown consumer tools and
      informal workflows but lacks the procurement power and custom-build budget of large enterprises, creating the
      strongest product-market fit for a self-serve, policy-aware SaaS platform.
