  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "virtual meeting substitution"
      missingEvidence: "Quantitative longitudinal data on the share of in-person meetings displaced by video conferencing since 2019, by trip purpose and industry vertical"
      whyItMatters: "Residual substitution risk is the primary long-run demand headwind for the TMS market; without credible displacement data, the recovery trajectory's sustainability cannot be confirmed"
      diligencePath: "Request GBTA or Deloitte primary data on trip-purpose composition (2019 vs. 2025) broken out by internal versus external meetings; cross-reference with Microsoft Teams and Zoom enterprise usage data"
      relatedQuestionRefs:
        - QM019
        - QM027

    - type: enumeration-incomplete
      severity: material
      topic: "status-quo substitute market share"
      missingEvidence: "Quantified market share estimates for consumer OTA booking (Expedia, Booking.com), traditional TMC-only models, and unmanaged/expense-only workflows relative to dedicated SaaS TMS platforms"
      whyItMatters: "Without share data, it is not possible to size the conversion opportunity from each substitute category, which limits go-to-market targeting precision"
      diligencePath: "Commission or license GBTA buyer segmentation data on current booking tool ownership; combine with Phocuswright corporate travel market share estimates"
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM001

    - type: private-evidence-only
      severity: material
      topic: "Perk served market and penetration rate"
      missingEvidence: "Perk's actual GBV (gross booking value), number of active customers, and average revenue per customer, which would allow a precise SOM and penetration calculation"
      whyItMatters: "The SOM shown in FM001 and TM002 is a back-calculated estimate from disclosed revenue run rate and analyst SAM figures; actual company metrics are not publicly disclosed"
      diligencePath: "Request customer count, GBV, and ARPU from management in due diligence; benchmark against Navan's disclosed metrics for triangulation"
      relatedQuestionRefs:
