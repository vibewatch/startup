summary:
  headline: >
    TravelPerk is a rare late-stage SaaS unicorn achieving EBITDA break-even alongside >50% revenue growth, but gross
    margin opacity and an undisclosed-NRR gap prevent high-conviction underwriting at the current 13x revenue multiple.
  overallScore: 6.5
  recommendation: research-more
