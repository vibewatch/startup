evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Full capitalization table including ownership percentages, liquidation preferences, and anti-dilution provisions
      for each investor class.
    whyItMatters: >-
      Ownership concentration and liquidation stack materially affect the risk/return profile for any new investor or
      acquirer and cannot be assessed without disclosure.
    diligencePath: >-
      Request cap table and shareholder agreement from Perk directly in due diligence; cross-reference with Companies
      House filings for UK subsidiary.
    relatedQuestionRefs:
      - QO006
      - QO027
  - type: private-evidence-only
    severity: material
    topic: revenue-by-geography
    missingEvidence: Explicit revenue breakdown by geography (US vs. Europe vs. rest of world) for the 2024 and 2025 fiscal years.
    whyItMatters: >-
      With the US targeted as the top growth market and AmTrav/Yokoy integrations underway, the geographic revenue mix
      is critical to assessing expansion risk and momentum.
    diligencePath: >-
      Request management accounts or investor reporting package; review AmTrav and Yokoy integration financial
      disclosures.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: material
    topic: regulatory-legal
    missingEvidence: >-
      Any specific regulatory enforcement actions, GDPR investigations, or legal proceedings naming Perk or TravelPerk
      as respondent.
    whyItMatters: >-
      As a data processor for millions of business traveler itineraries across EU and US jurisdictions, Perk's
      regulatory exposure under GDPR and US privacy law is non-trivial; no specific action was found in available public
      sources.
    diligencePath: >-
      Search ICO enforcement register, CNIL database, and US FTC/state AG databases for TravelPerk or Perk Ltd. entries;
      review litigation databases.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-history
    missingEvidence: >-
      Minor product launches (GreenPerk, FlexiPerk initial launch, TravelSafe API, Perk Events), partnership
      announcements, and country-by-country market entries are not covered in the milestone table.
    whyItMatters: >-
      A complete product and partnership milestone record would enable better analysis of the company's innovation
      cadence and go-to-market velocity.
    diligencePath: >-
      Retrieve complete press release archive from perk.com/media and cross-reference with TechCrunch and Travel Weekly
      archives for 2015–2025.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: customer-retention
    missingEvidence: Net revenue retention (NRR) rate and gross customer churn data for Perk's platform.
    whyItMatters: >-
      At 10,000+ customers, NRR is the primary driver of long-term revenue trajectory; the absence of a disclosed NRR
      leaves a gap in assessing organic growth quality and revenue model resilience.
    diligencePath: Request cohort revenue data from Perk management; benchmark against SaaS travel-management peers.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-coverage
    missingEvidence: >-
      Complete enumeration of all current C-suite, VP-level, and board observer roles at Perk, including any interim
      appointments and executives who departed since 2023.
    whyItMatters: >-
      The leadership table covers the primary named executives drawn from press releases; VP-level and country-lead
      roles are not systematically enumerated in public sources.
    diligencePath: >-
      Cross-reference Perk LinkedIn company page, Crunchbase people section, and Companies House director filings for a
