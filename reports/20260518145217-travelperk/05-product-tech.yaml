callouts:
  - calloutType: strength
    title: "NDC Leadership Drives Content Advantage"
    body: >
      With 25+ NDC airline connections as of October 2025 representing 40% of global bookings, TravelPerk
      has materially outpaced most corporate travel tools in direct airline content. The Lufthansa NDC
      integration alone delivers fares up to 37% cheaper than GDS equivalents, creating a measurable
      value proposition for cost-conscious travel buyers. NDC content also enables richer ancillary
      services and branded fares not available through legacy GDS channels.
    claimRefs:
      - CE011
      - CE012
      - CE014

  - calloutType: strength
    title: "AI-Native Rebuild Expanded Gross Margins"
    body: >
      CTO Robin Smith's September 2025 blog post confirmed that a 2024 AI-native platform rebuild
      doubled gross margins by automating customer service, policy enforcement, and trip modification.
      The Yokoy expense AI adding 90% automation to expense processing further reduces human touchpoints
      per booking. Together, these AI investments are shifting TravelPerk from a labor-intensive travel
      management model to a higher-margin software platform, underpinning the $2.7B valuation.
    claimRefs:
      - CE005
      - CE006
      - CE017
      - CE018

  - calloutType: risk
    title: "Security Certification Gap Is an Enterprise Sales Risk"
    body: >
      TravelPerk does not publicly confirm ISO 27001 or SOC 2 Type II certification as of May 2026.
      These are standard procurement requirements for mid-market and enterprise buyers in North America
      and the UK. Without public attestation, TravelPerk may be excluded from procurement shortlists
      or required to provide private security documentation, adding friction to enterprise sales cycles.
      This is particularly relevant given TravelPerk's stated ambition to move up-market following the
      Yokoy acquisition.
    claimRefs:
      - CE029
      - CE030

  - calloutType: risk
    title: "Yokoy Integration Execution Risk"
    body: >
      The January 2025 Yokoy acquisition adds a previously independent AI expense platform with its own
      engineering stack, customer base, and brand. Full platform integration — shared identity, unified
      UI, single policy engine — is technically complex and has not been confirmed as complete. The
      2024 AI-native rebuild was described as an architectural shift; adding a second AI stack (Yokoy)
      post-rebuild introduces integration risk. Customer-facing seams between the travel booking
      experience and the expense management experience could undermine the "connected travel and spend"
      positioning.
    claimRefs:
      - CE005
      - CE018
      - CE033

  - calloutType: insight
    title: "Platform Consolidation Thesis Is Accelerating"
    body: >
      TravelPerk's trajectory — from flight-and-hotel OBT to connected travel, expense, and events
      platform — mirrors the playbook of enterprise software consolidators like Salesforce and Workday.
      The January 2026 Events module and Yokoy expense integration suggest a company methodically
      closing the gap between a $1.3T travel market and a $200B+ expense management market. If the
      platform achieves true single-pane-of-glass for travel, expense, and events, the addressable
      market and pricing power both expand significantly.
    claimRefs:
      - CE007
      - CE034
      - CE038
      - CE039
      - CE040

