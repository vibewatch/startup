  - id: section-e-3
    title: "Developer Ecosystem and Marketplace"
    body: >
      TravelPerk opened its API platform to third-party developers in September 2020, creating a
      marketplace that now includes 200+ integrated apps. The developer platform at developers.perk.com
      offers REST APIs, webhooks, and OAuth 2.0 authentication, providing companies with a sandbox
      environment to build and test custom travel applications before production deployment. The GitHub
      organization (github.com/travelperk) maintains open-source tools including jets-seatmap-react
      (a seat-map rendering library), fabricator (an internal tooling framework), label-requires-reviews-action
      (a GitHub Actions workflow helper), and platform-assessment-terraform (infrastructure-as-code
      modules). These public repositories signal active engineering culture and provide integration
      starting points for partners. The marketplace covers HR systems, expense platforms, accounting
      tools, and communication apps, enabling TravelPerk to embed within enterprise software stacks
      rather than operate as a standalone point solution. The open API strategy also supports TravelPerk's
      TMC and channel-partner distribution model, allowing third parties to embed booking workflows into
      their own products. No public SLA or uptime guarantee is published for the developer platform as
      of May 2026.
    claimRefs:
      - CE024
      - CE025
      - CE027
      - CE028
    figureRefs:
      - FE004

  - id: section-e-4
    title: "Trust, Compliance, and Privacy"
    body: >
      TravelPerk's privacy policy confirms GDPR data controller designation for EU customer data, with
      processing confirmed within EU infrastructure. This is material for enterprise procurement in
      European markets where GDPR compliance is a vendor requirement. However, as of May 2026, TravelPerk
      has not publicly confirmed ISO 27001 certification or SOC 2 Type II attestation — certifications
      that are standard procurement gatekeepers for mid-market and enterprise buyers in North America and
      the United Kingdom. The absence of public certification documentation is a gap in the observable
      trust posture and is listed as a material evidence gap in this chapter. Customer satisfaction, as
      measured by Trustpilot, sits at 3.2 out of 5 ("Average") as of the May 2026 access date, with
      user reviews surfacing complaints about customer service responsiveness and occasional booking
      errors. The FlexiTravel guarantee terms (cancel 2h before departure, 80%+ refund) are clearly
      stated on product pages but have not been independently verified through claims audit data.
      TravelPerk's sustainability claims under GreenPerk are verified by three independent certification
      bodies (VERRA, Gold Standard, Puro.earth), which provides stronger third-party validation than
      most competitors in the travel tech space.
    claimRefs:
      - CE003
      - CE004
      - CE029
      - CE030
      - CE031
      - CE032
    tableRefs:
      - TE004

  - id: section-e-5
    title: "Product Roadmap and Strategic Development"
    body: >
      TravelPerk's 2025–2026 product releases reflect a deliberate consolidation from travel-only to
      full travel-and-spend lifecycle management. The Yokoy acquisition (January 2025, $200M Series E)
      brings AI expense automation directly into the platform, eliminating the need for third-party
      expense tools. The Events management module launched in January 2026 extends addressable workflow
      from individual trips to group travel and off-site planning. Publicly signaled AI investments
      include trip modification, policy recommendation, and customer service automation — all aligned to
      the CTO's stated "AI-native" platform direction. The NDC roadmap continues: with 25 connections
      as of October 2025, TravelPerk is still expanding airline-direct content. SilverRail
      partnership expansion into US rail adds geographic coverage. No formal product roadmap document
      is public, but the pattern of acquisitions (Click Travel, NexTravel, AmTrav, Albatross,
      Yokoy) and organic builds (GreenPerk, FlexiTravel, Events, AI layer) shows a consistent
      expansion arc from booking tool to complete corporate travel and expense operating system.
      The fintech expansion signaled in the January 2025 Series E fundraise (corporate cards, payment
      reconciliation) represents the next logical extension beyond expense management.
    claimRefs:
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037
      - CE038
      - CE039
      - CE040
    tableRefs:
      - TE005

