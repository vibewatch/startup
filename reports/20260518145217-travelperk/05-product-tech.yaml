  name: TravelPerk
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    TravelPerk's platform covers six booking modes (flight, hotel, rail, car, expense, events) unified under a
    single interface, with 25+ NDC airline connections representing 40% of global bookings by October 2025.
    The January 2025 Yokoy acquisition extended the platform into AI-powered expense management, while the
    January 2026 Events module launch completes a full travel-and-spend lifecycle offering. The open API
    platform, launched September 2020, underpins a 200+ app marketplace. The trust posture is partially
    opaque: GDPR data-controller designation is confirmed, but ISO 27001 and SOC 2 certifications are not
    publicly disclosed as of May 2026, and the Trustpilot rating of 3.2/5 signals user experience gaps.

sections:
  - id: section-e-1
    title: "Platform Modules and Customer Workflow"
    body: >
      TravelPerk offers a unified business travel and spend management platform covering six booking modes:
      flight, hotel, rail, car rental, expense management, and events. Under the "Connected Travel & Spend"
      brand launched with the Yokoy acquisition, the platform positions itself as the end-to-end lifecycle
      solution for corporate travel. The flight module connects to both traditional GDS (Amadeus, Sabre) and
      25+ NDC airline connections as of October 2025, with NDC content representing over 40% of global
      bookings and over 50% of European bookings. The rail module achieved 33% of trips on the platform by
      2023 (up from 17% in 2019), partly driven by the SilverRail partnership that added Amtrak coverage in
      the United States. The FlexiTravel add-on allows cancellations up to two hours before departure with
      an 80%+ refund guarantee and non-expiring credit, funded by a premium charged to booking value.
      GreenPerk, launched in March 2020, integrates Atmosfair carbon offsets certified by VERRA, Gold
      Standard, and Puro.earth for every booking, making TravelPerk an early mover in sustainability
      tooling. The Events module, launched in January 2026, extends the platform to group events from 9 to
      5,000 attendees using AI-powered planning, emerging from the Real Work Incubator program founded in
      2024. Across all modes, the booking engine processed one transaction every 7.5 seconds as of 2024.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE019
      - CE020
      - CE021
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE001
      - FE002

  - id: section-e-2
    title: "Technology Architecture and NDC Integration"
    body: >
      TravelPerk's technology architecture is layered around its booking engine, policy engine, expense
      engine (Yokoy), and events engine — all connected through an integration layer that spans GDS
      connectors, NDC connectors, and a marketplace API. The NDC (New Distribution Capability) strategy
      is a core differentiator: TravelPerk reached 20 NDC connections in 2024 (including Emirates) and
      extended that to 25+ by October 2025 through a deepened Amadeus partnership. IATA's NDC standard,
      designed to replace the legacy EDIFACT messaging protocol, allows richer airline-direct content
      including branded fares and ancillary services, enabling Perk to offer Lufthansa NDC fares with
      savings of up to 37% versus GDS published rates. The Yokoy expense AI engine, acquired in January
      2025, uses machine learning for receipt OCR, auto-categorization, and policy enforcement, achieving
      a reported 90% expense automation rate. CTO Robin Smith disclosed in September 2025 that an
      AI-native platform rebuild completed in 2024 doubled gross margins and added AI trip modification,
      customer service automation, and policy recommendation features. The AI trip modification feature
      allows travelers to alter bookings post-confirmation via a conversational interface. Rail technology
      is powered by the SilverRail partnership, enabling Amtrak rail booking in the United States
      alongside existing European rail coverage. The reporting module delivers real-time spend dashboards
      with customizable analytics for travel managers.
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
