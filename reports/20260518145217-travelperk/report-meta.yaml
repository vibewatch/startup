companyProfile:
  summary: >
    TravelPerk (rebranded Perk in March 2025) is a Barcelona-based B2B SaaS company founded in 2015
    by Avi Meir, Javier Suarez, and Ron Levin. It provides an integrated travel and expense management
    platform targeting SMB and mid-market businesses in Europe and the United States. The platform
    offers access to the world's largest bookable travel inventory—flights, hotels, rail, rental cars,
    and apartments—through a unified interface with centralised policy controls, plus FlexiPerk
    (flexible cancellation), GreenPerk (carbon tracking), TravelCare (travel risk management), and,
    following the January 2025 acquisition of Yokoy, AI-powered expense, invoice, and card-payment
    management. As of January 2025, TravelPerk reported annualized revenue exceeding $200 million,
    annualized gross booking value surpassing $2.5 billion, and EBITDA break-even—having raised
    a $200 million Series E at a $2.7 billion post-money valuation.
  foundedDate: null  # only year (2015) known from public sources; exact month/day not documented
  foundingLocation: "Barcelona, Spain"
  headquarters: "Barcelona, Spain (22@ innovation district)"
  founders:
    - name: "Avi Meir"
