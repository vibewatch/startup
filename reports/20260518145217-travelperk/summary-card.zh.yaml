summary:
  headline: |
    TravelPerk 是少见的后期 SaaS 独角兽，收入增长超过 50% 的同时打到 EBITDA 盈亏平衡；但毛利率不透明、NRR 未披露，按当前 13x 收入倍数承销还缺少高确定性。
  overallScore: 6.5
  recommendation: research-more
