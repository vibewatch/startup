  - id: moat-durability
    title: "Moat Durability and Competitive Risk Assessment"
    body: >-
      TravelPerk's competitive moat rests on four interconnected pillars: product
      differentiation (FlexiTravel, Green Trip, Perk Cards), supply-side advantages (20 NDC
      connections and negotiated low-cost carrier rates), switching costs from policy and
      HR/ERP integrations, and an acquisition-led consolidation strategy. Of these, FlexiTravel
      and EMEA rail coverage are the most defensible near-term differentiators because they
      require supplier relationships and product investment that cannot be replicated overnight.
      The most material moat risks are: first, Navan's commission-funded model structurally
      undercuts TravelPerk's per-booking fees for high-frequency accounts; second, SAP Concur's
      300-plus ERP connectors and Fortune 500 install base foreclose large-enterprise
      greenfield; third, Amex GBT's post-CWT combined supplier rate portfolio exceeds
      TravelPerk's negotiating leverage; and fourth, TravelPerk's Trustpilot score of 3.2 out
      of 5 points to service quality gaps that could accelerate churn to Navan. Multi-homing
      is possible through TravelPerk's open API enabling Ramp and Pleo integrations, which
      limits lock-in but supports hybrid T&E stacks. TravelPerk's Yokoy acquisition positions
      it to extend into integrated expense management, competing more directly with Navan, but
      the integration timeline and depth remain unverified publicly. TravelPerk's fintech push
      via Perk Cards could deepen switching costs if spend data creates policy-enforcement
      flywheel effects. EMEA-first product investment (GDPR compliance, EU sustainability
      reporting tooling, VAT recovery) provides a regulatory moat versus US-origin rivals that
      is hard to replicate at speed.
    claimRefs:
      - CP031
      - CP032
      - CP033
      - CP035
      - CP036
