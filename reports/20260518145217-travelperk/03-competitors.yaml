company:
  name: "TravelPerk"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    TravelPerk occupies a differentiated mid-market position between modern SaaS rivals (Navan,
    TravelBank) and legacy enterprise incumbents (SAP Concur, Amex GBT, BCD Travel), with its
    FlexiTravel cancellation guarantee, EMEA rail coverage, and transparent per-booking pricing
    as primary differentiators. Navan's commission-funded free-travel model is the most direct
    structural pricing threat, while SAP Concur's 300+ ERP integrations and Amex GBT's
    post-CWT supplier scale create durable barriers in large-enterprise accounts. TravelPerk's
    2025 acquisition of Yokoy and its 20 NDC connections signal ambitions to expand from a
    booking tool into a full T&E platform, but commoditization risk from AI booking agents and
    the company's 3.2/5 Trustpilot score point to service quality and pricing headwinds that
    warrant diligence.

sections:
  - id: competitive-landscape
    title: "Competitive Landscape Overview"
    body: >-
      The corporate travel management market divides into three competitive tiers. Direct SaaS
      competitors — Navan (formerly TripActions), TravelBank, and BizAway — compete on modern
      UX, integrated expense management, and developer-friendly platforms aimed at SMB and
      mid-market buyers. Enterprise software incumbents — SAP Concur (an SAP SE subsidiary)
      and Amex GBT (which acquired Egencia in 2021 and CWT for $540 million in September 2025)
      — dominate large-enterprise accounts through ERP lock-in and supplier network scale.
      Traditional full-service TMCs — BCD Travel, FCM Travel, and CWT (pre-acquisition) —
      compete on global footprint, dedicated agents, and sector expertise in industries such
      as pharma, energy, and financial services. TravelPerk positions itself as the best-fit
      alternative for SMB and mid-market buyers who find SaaS rivals either too US-centric
      (Navan), too costly in total cost of ownership (SAP Concur), or too agent-dependent
      (BCD Travel, FCM Travel). Status-quo alternatives — direct booking via consumer travel
      platforms, manual expense reimbursement, or local travel agents — remain a material
      portion of the unaddressed market, particularly among companies with fewer than 100
      employees where no formal travel policy exists. The market is consolidating rapidly:
      Amex GBT absorbed CWT in 2025, and TravelPerk itself completed four acquisitions
      since 2021 including Click Travel, NexTravel, AmTrav, and Yokoy.
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP012
      - CP026
      - CP043
    tableRefs:
      - TP001

  - id: competitor-profiles
    title: "Key Competitor Profiles"
    body: >-
      Navan is TravelPerk's closest SaaS peer. Headquartered in Palo Alto, Navan reported
      estimated 2024 sales of approximately $6.1 billion on a booking volume basis, employs
      around 3,000 staff, and is backed by Andreessen Horowitz, Coatue, and Lightspeed. It
      also owns Reed & Mackay for enterprise TMC coverage. Its proprietary Navan Cognition AI
      handled more than 150,000 monthly chat support interactions with 50% autonomous resolution
      in 2024, and the platform has earned a G2 rating of 4.7 out of 5 across 9,075 reviews
      as of May 2026 — the highest review volume of any SaaS TMS. SAP Concur, a fully-owned
      SAP subsidiary, commands the deepest enterprise install base with approximately 6,997 G2
      reviews and over 300 pre-built connectors; average enterprise total cost of ownership
      reaches approximately $110,000 per year when implementation costs are included. Amex GBT
      completed its acquisition of CWT for $540 million in September 2025, creating the world's
      largest corporate travel management group by booking volume, and launched an AI-powered
      Egencia platform in 2026 offering sub-3-minute booking with integrated Concur Expense
      reconciliation. BCD Travel, based in Utrecht and reporting $22.9 billion in 2024 sales
      across 170-plus countries with approximately 15,000 employees, owns the TripSource
      booking platform and Advito consulting. FCM Travel, part of Flight Centre Travel Group,
      serves mid-to-large enterprises in 95-plus countries and relaunched its AI assistant Sam
      in 2026 with conversational booking capabilities, supported by Crisis24-powered risk
      intelligence and SHERPA regulatory data.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
      - CP013
      - CP014
      - CP015
      - CP016

  - id: capability-pricing-comparison
    title: "Capability and Pricing Comparison"
    body: >-
      TravelPerk differentiates from SaaS peers on several product dimensions. FlexiTravel — an
      80% refund guarantee for cancellations up to two hours before departure — is not offered
      by any major competitor at equivalent terms. EMEA rail coverage and European VAT recovery
      in the UK, Spain, and Germany provide defensible advantages versus US-origin competitors.
      TravelPerk's marketplace offers 50-plus third-party integrations (Ramp, Pleo, HiBob,
      Deel), while SAP Concur's 300-plus connectors still lead on enterprise integration depth.
      TravelPerk launched its 20th NDC airline integration in August 2024 with Emirates,
      compared to Navan's 17 NDC connections; both exceed what most traditional TMCs support
      natively. TravelPerk also offers Green Trip carbon-footprint tracking, a feature relevant
      for EU CSRD compliance buyers. On pricing, TravelPerk's Starter plan (free plus 5% per
      booking), Premium ($99 per month plus 3% per booking), and Pro ($299 per month plus 3%
      per booking) are competitively positioned against enterprise alternatives but face
      structural pressure from Navan's commission-funded free-travel model. A company booking
      100 trips monthly at $300 average ticket size would incur approximately $9,000 in
      TravelPerk booking fees annually under the Pro plan, versus zero direct fees under Navan.
      Capterra lists TravelPerk at 4.7 out of 5 (422 reviews) and G2 at 4.6 out of 5 (1,906
      reviews) as of May 2026, both strong but trailing Navan's 4.7/5 at significantly higher
      review volume.
    claimRefs:
      - CP011
