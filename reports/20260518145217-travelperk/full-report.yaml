    title: Valuation Sensitivity to EV/Revenue Multiple (Base $200M Revenue)
    type: bar
    layout: standard
    summary: >-
      Sensitivity of implied enterprise value to revenue multiple assumption anchored at the current Series E revenue
      run-rate of approximately $200M.
    data:
      items:
        - label: 6x (Bear floor)
          value: 1200
        - label: 8x (Stressed base)
          value: 1600
        - label: 10x (Base)
          value: 2000
        - label: 13x (Current Series E)
          value: 2600
        - label: 15x (Bull entry)
          value: 3000
        - label: 18x (Bull IPO)
          value: 3600
    approximationNotes: >-
      Implied values in USD millions. Revenue base of $200M is the announced minimum annualized figure; actual revenue
      may be higher. Multiples derived from SaaS T&E peer range analysis.
