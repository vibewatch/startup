      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Navan's Free Travel Model Creates Structural Pricing Pressure
            body: >-
              Navan funds its travel module through airline and hotel supplier commissions (approximately 92% of
              revenue) and charges no direct booking fees to customers. For a company booking 100 trips per month at an
              average ticket of $300, TravelPerk's 3% booking fee under the Pro plan implies roughly $9,000 in annual
              booking charges versus zero under Navan. This fee gap widens for high-frequency accounts and is structural
              — TravelPerk cannot eliminate per-booking fees without replacing revenue from its Starter plan funnel.
              Diligence should model fee sensitivity across customer booking-frequency cohorts and assess whether Yokoy
              expense revenue offsets per-booking fee pressure in the medium term.
            calloutType: risk
            claimRefs:
              - CP018
              - CP034
          - type: callout
            title: FlexiTravel and EMEA Rail Coverage Are Defensible Near-Term Differentiators
            body: >-
              TravelPerk's FlexiTravel guarantee — an 80% refund for cancellations up to two hours before departure — is
              not offered by Navan, SAP Concur, BCD Travel, or FCM Travel at equivalent terms as of May 2026. Combined
              with native EMEA rail booking and EU VAT recovery in three markets, these features address a specific
              buyer pain (unpredictable travel spend) that consumer-grade booking tools cannot replicate. They also
              require supplier relationship investments and actuarial risk management that constitute genuine barriers
              to competitive replication in the near term. These differentiators are most valuable for
              EMEA-headquartered mid-market buyers — TravelPerk's core ICP — and represent the strongest argument
              against commoditization in that segment.
            calloutType: strength
            claimRefs:
              - CP021
              - CP022
              - CP033
          - type: callout
            title: Enterprise Incumbents Are Consolidating and Launching AI Upgrades
            body: >-
              Amex GBT completed its $540 million acquisition of CWT in September 2025, combining the first- and
              third-largest corporate TMCs by booking volume and substantially enlarging the combined supplier rate
              advantage. Simultaneously, Amex GBT relaunched Egencia in 2026 with an AI booking experience designed to
              deliver sub-3-minute itineraries and integrate directly with SAP Concur Expense — a move targeting
              mid-market buyers who previously found Egencia too enterprise-only. SAP Concur's embedded ML toolkit, in
              deployment for more than 10 years, also gives it an advantage in automating compliance and
              policy-exception workflows. These moves compress TravelPerk's mid-market window from above (enterprise
              incumbents moving down-market via AI) and below (Navan capturing SMB via free pricing).
            calloutType: risk
