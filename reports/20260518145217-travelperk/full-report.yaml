      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Navan is TravelPerk's closest SaaS peer. Headquartered in Palo Alto, Navan reported estimated 2024 sales
              of approximately $6.1 billion on a booking volume basis, employs around 3,000 staff, and is backed by
              Andreessen Horowitz, Coatue, and Lightspeed. It also owns Reed & Mackay for enterprise TMC coverage. Its
              proprietary Navan Cognition AI handled more than 150,000 monthly chat support interactions with 50%
              autonomous resolution in 2024, and the platform has earned a G2 rating of 4.7 out of 5 across 9,075
              reviews as of May 2026 — the highest review volume of any SaaS TMS. SAP Concur, a fully-owned SAP
              subsidiary, commands the deepest enterprise install base with approximately 6,997 G2 reviews and over 300
              pre-built connectors; average enterprise total cost of ownership reaches approximately $110,000 per year
              when implementation costs are included. Amex GBT completed its acquisition of CWT for $540 million in
              September 2025, creating the world's largest corporate travel management group by booking volume, and
              launched an AI-powered Egencia platform in 2026 offering sub-3-minute booking with integrated Concur
              Expense reconciliation. BCD Travel, based in Utrecht and reporting $22.9 billion in 2024 sales across
              170-plus countries with approximately 15,000 employees, owns the TripSource booking platform and Advito
              consulting. FCM Travel, part of Flight Centre Travel Group, serves mid-to-large enterprises in 95-plus
              countries and relaunched its AI assistant Sam in 2026 with conversational booking capabilities, supported
              by Crisis24-powered risk intelligence and SHERPA regulatory data.
