      - number: '1.3'
        title: Funding History and Investor Landscape
        blocks:
          - type: paragraph
            body: >
              Perk has raised over $700 million in equity financing across six rounds since 2015, plus a $135 million
              credit facility secured in June 2024. The funding progression began with a $21 million Series B in April
              2018 (bringing the total raised to $30 million) and a $44 million Series C in October 2019 led by
              Kinnevik, Yuri Milner, and Tom Stafford (total: approximately $75 million). The COVID-era Series D
              comprised an initial $160 million in April 2021 led by Greyhound Capital (total: $294 million) followed by
              an additional $115 million in January 2022 led by General Catalyst and Kinnevik that conferred unicorn
              status at over $1 billion valuation (total: $409 million). A $104 million Series D-1 extension led by
              SoftBank Vision Fund 2 in January 2024 valued the company at $1.4 billion. The $200 million Series E
              announced January 28, 2025, led by Atomico and EQT Growth with participation from Noteus Partners and
              existing investors Kinnevik and General Catalyst, nearly doubled the valuation to $2.7 billion. In June
              2024, a $135 million credit facility from Blackstone Credit & Insurance and Blue Owl provided capital to
              fund the AmTrav acquisition. The cap table is broadly distributed with no single majority holder; Sequoia
              Capital joined via the all-equity Yokoy acquisition. Perk's COO stated publicly in January 2025 that no
              near-term IPO was planned, emphasising a long-term growth orientation over near-term liquidity.
