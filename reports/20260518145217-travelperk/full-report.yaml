    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue growth falls below 25% for two consecutive quarters
        - Reported GBV growth <25% YoY
        - Bull and base cases become untenable; bear case approaches
        - Downgrade to Research-More or Avoid
      - - Gross margin disclosed below 35%
        - On release of audited accounts or IPO S-1
        - Valuation multiple should compress toward 5-8x; SaaS premium evaporates
        - Immediate model reset; potential Avoid
      - - US market share fails to materialise post-AmTrav
        - No meaningful US revenue contribution 18 months post-acquisition
        - Core growth lever for bull case eliminated
        - Re-assess exit timeline and valuation ceiling
      - - Two or more lead investors exit stake below entry price
        - Secondary transaction at sub-$2.7B implied valuation
        - Confidence signal severely damaged; potential forced exit
        - Treat as binary downside event
      - - Regulatory or legal action on expense data or card processing
        - EU or US enforcement action against Yokoy card-payment module
        - Yokoy synergy impaired; compliance cost spike
        - Evaluate materiality; flag as blocking risk
    notes: >-
      Triggers are analyst-defined kill criteria. Thresholds are indicative; actual materiality depends on market
      conditions at time of trigger.
