      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Lenses'
        blocks:
          - type: paragraph
            body: >
              Multiple analyst firms size this market with different scope definitions, producing estimates that vary by
              one

              to two orders of magnitude. Understanding these methodological differences is essential to sizing Perk's

              opportunity correctly and avoiding the common error of citing the largest available figure without
              boundary logic.


              The GBTA 2024 Business Travel Index Outlook — the most widely cited primary source in the industry —
              tracks

              all business travel spending across 72 countries and 44 industries. It reported that global business
              travel

              recovered past its 2019 pre-pandemic peak of $1.43 trillion during 2024, reaching approximately $1.48
              trillion,

              and projects $1.64 trillion in 2026 with 6–8% annualised growth continuing through 2027. Asia-Pacific is
              the

              largest regional market at approximately $720 billion, followed by North America at $410 billion and
              Western

              Europe at $345 billion. The United States alone accounted for an estimated $472 billion in business travel

              spend in 2024 per the World Travel and Tourism Council. These figures represent the full-stack TAM — the
              gross

              economic activity that corporate travel management platforms route and capture.


              Perk's directly monetisable SAM is the TMS software platform market. The Business Research Company pegs
              this

              at $1.26 billion in 2026, growing to $1.66 billion by 2030 (7.2% CAGR), driven by AI integration, cloud

              adoption, and mobile-first booking. If the definition expands to the full T&E software suite — TMS plus
              expense

              management, invoice processing, and corporate cards (Perk's post-Yokoy positioning) — Technavio's $4.25
              billion

              on-premises segment baseline and $3.27 billion incremental opportunity at 10.4% CAGR suggests a $7–8
              billion

              addressable software market by 2030. Analyst estimates diverge significantly: some cite figures in the
              hundreds

              of millions (pure-play TMS SaaS) while others include managed services, and at least one analyst projects
              the

              narrow "business travel market" at only $829.5 billion by 2027 using a different scope definition — this

              contradicts GBTA's broader measurement and should be treated as a different market boundary.


              North America was the largest single region for TMS software in 2025, and Perk's acquisition of AmTrav in
              June

              2024 represents a direct expansion into this geography. The addressable SOM — Perk's practical opportunity

              given its current footprint in Europe and North America, its focus on mid-market and SMB segments, and its

              per-trip pricing model — is not disclosed but can be bounded by its reported annualised revenue run rate

              of over $200 million against a SAM of ~$1.26 billion, implying approximately 16% penetration of the narrow

              TMS market, with significant room if the T&E adjacency is successfully captured.
            claimRefs:
