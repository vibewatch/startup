      - number: '5.4'
        title: Trust, Compliance, and Privacy
        blocks:
          - type: paragraph
            body: >
              TravelPerk's privacy policy confirms GDPR data controller designation for EU customer data, with
              processing confirmed within EU infrastructure. This is material for enterprise procurement in European
              markets where GDPR compliance is a vendor requirement. However, as of May 2026, TravelPerk has not
              publicly confirmed ISO 27001 certification or SOC 2 Type II attestation — certifications that are standard
              procurement gatekeepers for mid-market and enterprise buyers in North America and the United Kingdom. The
              absence of public certification documentation is a gap in the observable trust posture and is listed as a
              material evidence gap in this chapter. Customer satisfaction, as measured by Trustpilot, sits at 3.2 out
              of 5 ("Average") as of the May 2026 access date, with user reviews surfacing complaints about customer
              service responsiveness and occasional booking errors. The FlexiTravel guarantee terms (cancel 2h before
              departure, 80%+ refund) are clearly stated on product pages but have not been independently verified
              through claims audit data. TravelPerk's sustainability claims under GreenPerk are verified by three
              independent certification bodies (VERRA, Gold Standard, Puro.earth), which provides stronger third-party
              validation than most competitors in the travel tech space.
