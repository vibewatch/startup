      - number: '7.2'
        title: Operational and Technology Risk
        blocks:
          - type: paragraph
            body: >
              TravelPerk's platform availability depends entirely on AWS Ireland with no documented secondary cloud
              failover. A prolonged AWS Ireland outage would disable all TravelPerk services simultaneously — booking,
              expense submission, Perk Finance card transactions, and customer care operations. The company claims ISO
              27001 alignment and SOC Type 2 certification, but neither the certification body nor the audit report
              scope is publicly disclosed. Operational disruption risk is inherent to the travel industry at high
              frequency: TravelPerk's own research confirmed that 78% of business travelers globally experienced
              disruptions in 2024, with 43% facing delays over one hour. Systemic events amplify this simultaneously:
              the July 2024 CrowdStrike IT outage depressed global airline on-time performance to 57% in a single month,
              generating a simultaneous surge in rebooking requests, FlexiTravel refund claims, and emergency support
              calls. Despite deploying AI to handle double the query volume with unchanged customer care headcount in
              2024, TravelPerk faces a structural cost floor: only 10% of business travelers prefer automated chatbot
              support during disruptions; the remaining 90% require human agents. The expansion into fintech (Perk
              Finance) adds a new risk category: card payment failures at Transact Payments Malta or Gibraltar would
              impair corporate cardholders' ability to pay for travel in real time. FlexiTravel's 80% refund guarantee
              creates an insurance-like liability: during a geopolitical shock or systemic IT failure, simultaneous
              mass-cancellation claims could create a short-term cash draw not hedged by any disclosed financial
              instrument. TravelPerk's CEO acknowledged in January 2025 that OpenAI's Operator AI agent — capable of
              autonomously booking travel — represents a credible medium-term disruption threat to the managed booking
              flow.
            claimRefs:
