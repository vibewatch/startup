  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The corporate travel management market divides into three competitive tiers. Direct SaaS competitors —
              Navan (formerly TripActions), TravelBank, and BizAway — compete on modern UX, integrated expense
              management, and developer-friendly platforms aimed at SMB and mid-market buyers. Enterprise software
              incumbents — SAP Concur (an SAP SE subsidiary) and Amex GBT (which acquired Egencia in 2021 and CWT for
              $540 million in September 2025) — dominate large-enterprise accounts through ERP lock-in and supplier
              network scale. Traditional full-service TMCs — BCD Travel, FCM Travel, and CWT (pre-acquisition) — compete
              on global footprint, dedicated agents, and sector expertise in industries such as pharma, energy, and
              financial services. TravelPerk positions itself as the best-fit alternative for SMB and mid-market buyers
              who find SaaS rivals either too US-centric (Navan), too costly in total cost of ownership (SAP Concur), or
              too agent-dependent (BCD Travel, FCM Travel). Status-quo alternatives — direct booking via consumer travel
              platforms, manual expense reimbursement, or local travel agents — remain a material portion of the
              unaddressed market, particularly among companies with fewer than 100 employees where no formal travel
              policy exists. The market is consolidating rapidly: Amex GBT absorbed CWT in 2025, and TravelPerk itself
              completed four acquisitions since 2021 including Click Travel, NexTravel, AmTrav, and Yokoy.
            claimRefs:
              - CP001
              - CP002
