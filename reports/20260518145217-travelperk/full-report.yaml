      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Buy with Valuation Discipline
            body: >-
              TravelPerk earns a Buy at the current $2.7B entry point conditional on confirming gross margins above 40%
              before deploying significant capital. The 13x revenue multiple reflects a premium that is justified by
              50%+ growth and EBITDA break-even but margin opacity prevents high conviction. The base case delivers a
              1.5-2x return in 3-5 years; the bull case delivers 3-4x on an IPO. Investors entering at or above $2.7B
              should size positions to tolerate a bear case where the exit is near the entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV039
              - CV040
          - type: callout
            title: Gross Margin Opacity is the Key Valuation Risk
            body: >-
              The single most important missing data point is gross margin. If TravelPerk gross margin is in the 45-60%
              SaaS range the 13x multiple is defensible and the base case holds. If margins are in the 20-35% range
              typical of pure booking marketplaces the comparable set shifts to GDS companies and traditional travel
              agents and the multiple should be 5-8x. Until audited accounts are filed at UK Companies House (next due
              September 2026 for FY2025) or the company files for IPO this risk cannot be resolved.
            calloutType: risk
            claimRefs:
              - CV014
              - CV034
              - CV036
              - CV050
          - type: callout
            title: EBITDA Break-Even at Scale is a Rare Signal
            body: >-
              TravelPerk achieving EBITDA break-even at over $200M revenue while growing 50%+ annually is an unusual
              combination. Most hypergrowth SaaS companies at this stage burn heavily to acquire customers. If the
              break-even is structural (driven by strong take-rate economics and unit margin improvement) it provides a
              floor on the valuation and significantly de-risks the base case. If it is transitory (driven by cost
              restraint during a fundraise) post-round investment could delay profitability. Management statements on
              this inflection should be a key focus of due diligence.
            calloutType: insight
            claimRefs:
              - CV013
              - CV026
              - CV043
