              - CR028
              - CR030
              - CR031
              - CR036
      - number: '7.5'
        title: Execution, People, and M&A Integration Risk
        blocks:
          - type: paragraph
            body: >
              TravelPerk is simultaneously integrating three acquired companies across four countries — Albatross (UK),
              AmTrav (Chicago, USA, acquired June 2024), and Yokoy (Zurich, Switzerland, acquired January 2025) — while
              managing a 1,500+ person workforce and building a new fintech product line. The pace of M&A is unusually
              high: two material acquisitions in seven months, each requiring technology integration, compliance
              harmonization, and cultural alignment. Key-man risk is concentrated at the founder layer: CEO Avi Meir is
              the primary external face and strategic visionary; CFO Roy Hefer and COO JC Taunay-Bucalo are central to
              financial management and IPO preparation respectively. No succession plans or executive vesting schedules
              are publicly disclosed. The Yokoy acquisition was partly premised on acquiring AI engineering talent; loss
              of key Yokoy technical leads post-acquisition would directly undermine TravelPerk's AI expense automation
              roadmap. Layoffs.fyi shows no material TravelPerk workforce reductions through May 2026, but integration
              of three product stacks into a unified architecture is a multi-year engineering program with high
              execution risk. Geographic workforce complexity is material: Barcelona (Spanish labor law, AEPD), London
              (UK employment law, ICO), Chicago (US at-will employment, CCPA via AmTrav), and Zurich (Swiss employment
              law, nDSG post-Yokoy) each impose distinct requirements on data handling, severance, and works council
              obligations.
            claimRefs:
              - CR031
              - CR033
              - CR034
              - CR035
              - CR044
          - type: table
