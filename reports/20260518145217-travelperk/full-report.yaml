  - id: FR001
    title: TravelPerk Risk Heatmap — Likelihood vs. Impact Matrix
    type: matrix
    description: >
      Two-dimensional risk heatmap plotting TravelPerk's identified risk categories by assessed likelihood (rows: High,
      Medium, Low) against potential business impact (columns: Low, Medium, High, Critical). Cells list risk categories
      falling in each quadrant.
    notes: >
      Likelihood and Impact assessments are analyst-derived from public evidence as of May 2026. Risks in the High
      Likelihood and High or Critical Impact quadrant represent priority investment-thesis risks.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - EU air passenger claim pass-through
            - Business travel disruption surge; FlexiTravel refund demand; CSRD platform obligation
            - GDS and NDC content gap; AmTrav customer attrition during migration
            - —
        - label: Medium Likelihood
          values:
            - nDSG post-Yokoy compliance overhead
            - DORA compliance for financial-sector customers; M&A integration delay; workforce attrition
            - GDPR enforcement action by AEPD or ICO; Blackstone debt covenant pressure; AWS Ireland outage
            - Major data breach triggering maximum GDPR fine
        - label: Low Likelihood
          values:
            - —
            - Blackstone debt acceleration; IPO valuation step-down
            - Card processor license revocation; AI agent full bypass of managed booking flow
            - Simultaneous GDS failure and cyber breach
