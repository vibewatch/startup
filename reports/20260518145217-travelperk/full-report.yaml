  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Perk operates a hybrid SaaS and transactional revenue model that has evolved materially since the
              company's 2018 Series B, when the platform was offered free to customers and revenue came solely from
              supplier incentive payments. The current model layers three subscription tiers (Starter, Premium, Pro) on
              top of per-booking transaction fees and supplier-incentive income. The pricing page lists no dollar
              amounts; enterprise and mid-market contracts are sized after a demo, a standard approach for B2B travel
              platforms that makes realized average selling price and discounting behavior opaque. The Starter tier
              allows card-only payment and limited cost-object customization (one field), Premium adds advanced HR
              integrations and single sign-on (SSO), and Pro provides a dedicated account manager and all future
              roles—features that indicate meaningful per-seat or per-entity pricing differentiation. FlexiPerk, the
              company's flexible-cancellation add-on, charges 25% of the booking value and guarantees at least an 80%
              refund, which monetizes customers' willingness to pay a risk premium—a structurally attractive margin
              contributor. The January 2025 acquisition of Yokoy added expense-management streams (invoice processing,
              card-payment processing, and expense-report automation) that diversify revenue beyond pure travel booking.
              Corporate card issuance via Transact Payments Malta (EEA) and Transact Payments Ltd (UK) signals an
              emerging fintech revenue layer. Revenue per customer has doubled versus the pre-pandemic baseline, per
              Kinnevik commentary from January 2024, confirming that monetization deepening—not just volume
              growth—drives the financial improvement trajectory.
            claimRefs:
