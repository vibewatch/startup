  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Market Segmentation
        blocks:
          - type: paragraph
            body: >
              TravelPerk primarily targets SMB and mid-market companies—broadly defined as 10–5,000 employees—in Europe
              and the United States, with the Series E in January 2025 explicitly stating the company's strategic focus
              on "SMB and mid-market companies in the US and Europe." Named customers span a wide range of verticals:
              tech scale-ups (Storyblok, Freepik, GoCardless), mobility and transport (Bolt, Cabify), retail and
              lifestyle (Fabletics, Lush), e-commerce (ManoMano), fitness (PureGym), automotive marketplaces
              (AutoScout24), and travel technology (GetYourGuide). The platform is also used by high-profile brands
              cited in company materials: Red Bull, Aesop, Fujifilm, and Nord Security.

              Geographically, the historical installed base is predominantly European (Barcelona-headquartered, with UK,
              Germany, Spain, and France as core markets), but the 2024 acquisitions of AmTrav (US-based, 30+ years
              history) and the 2024 expansion of its AmTrav brand have significantly accelerated US penetration. Yokoy's
              700+ customers in Switzerland and DACH markets add a Central European dimension. Company size skews toward
              digital-native businesses with distributed workforces that travel regularly for inter-office coordination,
              sales, and events rather than for strategic account management at enterprise scale. TravelPerk does not
              publicly disclose a breakdown of its customer base by size band, geography, or vertical, which makes
              independent validation of segment proportions impossible.
