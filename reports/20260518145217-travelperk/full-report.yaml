      - number: '5.3'
        title: Developer Ecosystem and Marketplace
        blocks:
          - type: paragraph
            body: >
              TravelPerk opened its API platform to third-party developers in September 2020, creating a marketplace
              that now includes 200+ integrated apps. The developer platform at developers.perk.com offers REST APIs,
              webhooks, and OAuth 2.0 authentication, providing companies with a sandbox environment to build and test
              custom travel applications before production deployment. The GitHub organization (github.com/travelperk)
              maintains open-source tools including jets-seatmap-react (a seat-map rendering library), fabricator (an
              internal tooling framework), label-requires-reviews-action (a GitHub Actions workflow helper), and
              platform-assessment-terraform (infrastructure-as-code modules). These public repositories signal active
              engineering culture and provide integration starting points for partners. The marketplace covers HR
              systems, expense platforms, accounting tools, and communication apps, enabling TravelPerk to embed within
              enterprise software stacks rather than operate as a standalone point solution. The open API strategy also
              supports TravelPerk's TMC and channel-partner distribution model, allowing third parties to embed booking
              workflows into their own products. No public SLA or uptime guarantee is published for the developer
              platform as of May 2026.
