  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Modules and Customer Workflow
        blocks:
          - type: paragraph
            body: >
              TravelPerk offers a unified business travel and spend management platform covering six booking modes:
              flight, hotel, rail, car rental, expense management, and events. Under the "Connected Travel & Spend"
              brand launched with the Yokoy acquisition, the platform positions itself as the end-to-end lifecycle
              solution for corporate travel. The flight module connects to both traditional GDS (Amadeus, Sabre) and 25+
              NDC airline connections as of October 2025, with NDC content representing over 40% of global bookings and
              over 50% of European bookings. The rail module achieved 33% of trips on the platform by 2023 (up from 17%
              in 2019), partly driven by the SilverRail partnership that added Amtrak coverage in the United States. The
              FlexiTravel add-on allows cancellations up to two hours before departure with an 80%+ refund guarantee and
              non-expiring credit, funded by a premium charged to booking value. GreenPerk, launched in March 2020,
              integrates Atmosfair carbon offsets certified by VERRA, Gold Standard, and Puro.earth for every booking,
              making TravelPerk an early mover in sustainability tooling. The Events module, launched in January 2026,
              extends the platform to group events from 9 to 5,000 attendees using AI-powered planning, emerging from
              the Real Work Incubator program founded in 2024. Across all modes, the booking engine processed one
              transaction every 7.5 seconds as of 2024.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
