      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Perk's publicly available financial profile is unusually strong for a late-stage private company:
              greater-than-50% revenue growth, a path to EBITDA break-even, more than $200 million in annualized
              revenue, and $2.5 billion in gross booking value all point to a scaled, recovering platform with genuine
              operational momentum. The revenue quality appears high—multi-stream (subscription, transaction fees,
              supplier incentives, FlexiPerk add-on, and now expense management)—and is improving: gross profit growing
              faster than revenue is a reliable gross-margin-expansion signal. However, the absence of audited
              financials, undisclosed gross margin percentage, undisclosed NRR, undisclosed burn rate, and no public CAC
              or payback data create material underwriting uncertainty. At $2.7 billion valuation on approximately $200
              million annualized revenue, the implied revenue multiple is roughly 13–14x— a premium that requires either
              a materially higher gross margin than pass-through booking businesses typically deliver, or confidence in
              a Yokoy-driven gross margin step-up. Customer reviews on Trustpilot and G2 document meaningful
              dissatisfaction with pricing value (customers perceiving no cost advantage over direct booking) and
              FlexiPerk complexity, which creates a retention and NPS risk that is not visible in topline metrics alone.
              The COVID revenue collapse demonstrated that the entire platform remains dependent on discretionary
              business travel spending—a factor that should drive stress scenarios in any capital-adequacy model.
            claimRefs:
              - CI036
              - CI037
              - CI038
              - CI039
          - type: table
            tableRef: TI005
            claimRefs:
