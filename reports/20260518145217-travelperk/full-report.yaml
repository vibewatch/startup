  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              TravelPerk operates across three distinct data-protection regimes simultaneously: Spanish GDPR under AEPD
              supervision (Perk Platform SLU, Barcelona), UK GDPR under ICO supervision (Perk UK Ltd, London), and —
              following the January 2025 Yokoy acquisition — Swiss nDSG under FDPIC oversight (Yokoy AG, Zurich). Each
              regime carries its own notification deadlines, data subject rights obligations, and enforcement posture,
              requiring TravelPerk to maintain three parallel compliance programs rather than a single unified
              framework. The AEPD is among the most active EU data protection authorities by enforcement volume. Its
              2026 activity indicates ongoing inspection programs targeting AI-based automated decisions and profiling
              for marketing purposes, both directly relevant to TravelPerk's AI booking recommendations and marketing
              campaigns. The ICO maintains a publicly accessible enforcement register showing regular monetary penalty
              notices against data controllers for security failures and unlawful processing; Perk UK Ltd falls squarely
              within its jurisdiction. Under GDPR Article 83(5), fines for the most serious violations — breaches of
              basic processing principles in Article 5 or violations of data subjects' rights under Articles 12–22 —
              reach EUR 20 million or 4% of worldwide annual turnover. At TravelPerk's $200M+ ARR, the 4% ceiling
              equates to approximately $8 million. This is a material but non-existential fine amount; the more
              significant risk is the reputational and customer-trust impact of a public enforcement action. TravelPerk
              processes sensitive personal data at volume: travel itineraries, passport numbers, payment card details,
              and health or dietary information for special assistance. As both a data controller (for marketing and
              employees) and a data processor (for corporate customer traveler data), TravelPerk must maintain two
              distinct compliance postures and two sets of data processing agreements. Cross-border data flows between
              Perk Platform SLU (EU) and American Travel Solutions LLC (US, AmTrav) require Standard Contractual Clauses
              or equivalent mechanisms under the applicable EU-US data transfer framework. Two EU-origin regulatory
              frameworks impose further obligations: CSRD requires TravelPerk's enterprise customers to report Scope 3
              travel emissions, mandating audit-quality carbon data at the booking level; DORA (effective January 2025)
              requires financial-services customers using Perk Finance or Yokoy expense tools to verify TravelPerk's ICT
              resilience and third-party risk management program.
            claimRefs:
