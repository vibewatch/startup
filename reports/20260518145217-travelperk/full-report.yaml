      - number: '3.3'
        title: Capability and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              TravelPerk differentiates from SaaS peers on several product dimensions. FlexiTravel — an 80% refund
              guarantee for cancellations up to two hours before departure — is not offered by any major competitor at
              equivalent terms. EMEA rail coverage and European VAT recovery in the UK, Spain, and Germany provide
              defensible advantages versus US-origin competitors. TravelPerk's marketplace offers 50-plus third-party
              integrations (Ramp, Pleo, HiBob, Deel), while SAP Concur's 300-plus connectors still lead on enterprise
              integration depth. TravelPerk launched its 20th NDC airline integration in August 2024 with Emirates,
              compared to Navan's 17 NDC connections; both exceed what most traditional TMCs support natively.
              TravelPerk also offers Green Trip carbon-footprint tracking, a feature relevant for EU CSRD compliance
              buyers. On pricing, TravelPerk's Starter plan (free plus 5% per booking), Premium ($99 per month plus 3%
              per booking), and Pro ($299 per month plus 3% per booking) are competitively positioned against enterprise
              alternatives but face structural pressure from Navan's commission-funded free-travel model. A company
              booking 100 trips monthly at $300 average ticket size would incur approximately $9,000 in TravelPerk
              booking fees annually under the Pro plan, versus zero direct fees under Navan. Capterra lists TravelPerk
              at 4.7 out of 5 (422 reviews) and G2 at 4.6 out of 5 (1,906 reviews) as of May 2026, both strong but
