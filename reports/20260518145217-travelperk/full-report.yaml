          support SLA
        - Trustpilot reviews document persistent service failures; pricing rarely below direct booking
        - NPS >50 and published customer churn <10% annually
      - - Financial Quality
        - EBITDA break-even at $200M+ revenue; 50%+ growth for two consecutive years
        - Gross margin and NRR undisclosed; EBITDA breakeven could mask negative gross profit contribution
        - Audited gross margin >40% and NRR >110%
      - - Competitive Position
        - Product-led SMB motion that Concur and Amex GBT cannot replicate; 25+ NDC connections
        - Navan ($6B+ GBV) well-capitalised and winning US enterprise accounts; direct competition intensifying
        - US market share gain evidenced by post-AmTrav revenue metrics
      - - Valuation
        - 13x justified if growth sustains 40%+ and gross margins are SaaS-quality
        - 13x stretched vs. profitable SaaS peers; any growth slowdown triggers re-rating
        - IPO comps or secondary transaction confirming >10x at exit
    notes: >-
