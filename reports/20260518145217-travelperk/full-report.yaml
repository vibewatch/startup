      - number: '5.2'
        title: Technology Architecture and NDC Integration
        blocks:
          - type: paragraph
            body: >
              TravelPerk's technology architecture is layered around its booking engine, policy engine, expense engine
              (Yokoy), and events engine — all connected through an integration layer that spans GDS connectors, NDC
              connectors, and a marketplace API. The NDC (New Distribution Capability) strategy is a core
              differentiator: TravelPerk reached 20 NDC connections in 2024 (including Emirates) and extended that to
              25+ by October 2025 through a deepened Amadeus partnership. IATA's NDC standard, designed to replace the
              legacy EDIFACT messaging protocol, allows richer airline-direct content including branded fares and
              ancillary services, enabling Perk to offer Lufthansa NDC fares with savings of up to 37% versus GDS
              published rates. The Yokoy expense AI engine, acquired in January 2025, uses machine learning for receipt
              OCR, auto-categorization, and policy enforcement, achieving a reported 90% expense automation rate. CTO
              Robin Smith disclosed in September 2025 that an AI-native platform rebuild completed in 2024 doubled gross
              margins and added AI trip modification, customer service automation, and policy recommendation features.
              The AI trip modification feature allows travelers to alter bookings post-confirmation via a conversational
              interface. Rail technology is powered by the SilverRail partnership, enabling Amtrak rail booking in the
              United States alongside existing European rail coverage. The reporting module delivers real-time spend
              dashboards with customizable analytics for travel managers.
