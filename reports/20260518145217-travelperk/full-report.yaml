      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'GDPR Enforcement Risk: Material but Not Existential'
            body: >
              GDPR maximum fine exposure of approximately $8M (4% of $200M ARR) is material but not existential; the
              more significant risk is reputational. A public enforcement action by AEPD or ICO would be prominently
              disclosed and scrutinized by enterprise customers in regulated sectors, potentially triggering churn among
              financial-services and healthcare TMC clients — TravelPerk's highest-value segment.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR007
          - type: callout
            title: 'M&A Integration: Compounding Execution Risk'
            body: >
              TravelPerk's three-acquisition program over six years is unusually ambitious for a company that only
              reached EBITDA break-even at end-2024. Integration of three product stacks, four workforce jurisdictions,
              and three compliance regimes simultaneously creates compounding execution risk that is not captured in
              headline financial metrics such as ARR growth or booking volume.
            calloutType: insight
            claimRefs:
              - CR031
              - CR033
              - CR034
              - CR038
          - type: callout
            title: Single-Cloud Concentration — Primary Single Point of Failure
            body: >
              Single-cloud concentration on AWS Ireland is TravelPerk's most acute single-point-of-failure risk: a
              prolonged AWS Ireland availability event would halt booking, expense, card operations, and customer care
              simultaneously with no documented secondary cloud fallback or geographic redundancy.
            calloutType: insight
            claimRefs:
              - CR014
          - type: callout
            title: 'Undisclosed Debt Covenants: Priority Diligence Gap'
            body: >
              The Blackstone and Blue Owl $135M debt facility terms are entirely undisclosed — including covenants,
              interest rate, maturity, and amortization schedule. In a growth-deceleration scenario, a covenant breach
              could force a capital raise at disadvantageous terms concurrent with multi-entity integration spending.
              This is a priority diligence gap requiring direct management disclosure.
            calloutType: risk
            claimRefs:
              - CR024
              - CR028
          - type: callout
            title: 'GDPRhub Access Blocked: Active AEPD Proceedings Unverifiable'
            body: >
              GDPRhub enforcement tracking of AEPD cases was inaccessible via automated fetch due to JavaScript
              rendering requirements and bot-protection. Active AEPD enforcement proceedings against TravelPerk
              entities, if any exist, could not be verified from public sources and require bespoke legal diligence of
              the AEPD case register.
            calloutType: risk
            claimRefs:
              - CR006
              - CR039
          - type: callout
            title: Multi-Product Switching Costs Partially Hedge GDS Risk
            body: >
              TravelPerk's multi-product depth (booking plus Yokoy expense plus Perk Finance cards plus safety via
              TravelCare) creates high switching costs that partially hedge GDS and NDC content risk: customers who have
              adopted Perk Finance and Yokoy expense tools have substantially higher exit costs than single-product TMC
              users, insulating the business from rapid competitor migration even in a GDS content-degradation scenario.
            calloutType: strength
            claimRefs:
              - CR029
              - CR031
          - type: callout
            title: CSRD and DORA Compliance as Pull-Market Opportunity
            body: >
              CSRD and DORA compliance pressure on enterprise customers creates a pull-market for TravelPerk's data-rich
              platform: companies that must report Scope 3 emissions or demonstrate T&E digital resilience under DORA
              will prefer an integrated TMC plus expense platform that provides audit-quality data trails over
              fragmented point solutions requiring manual data reconciliation.
            calloutType: insight
            claimRefs:
              - CR010
              - CR020
          - type: callout
            title: 'Evidence Gap Acknowledgment: Debt, Litigation, and Concentration'
            body: >
              Research questions QR008 (debt covenant terms), QR020 (active litigation or enforcement proceedings), and
              QR021 (customer revenue concentration by segment) could not be answered from publicly available sources.
              Three evidence gaps are documented in localEvidence.evidenceGaps below. These items require direct
              management disclosure in any formal investment or audit process.
            calloutType: assumption
            claimRefs: []
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Financing Context
        blocks:
          - type: paragraph
            body: >-
              TravelPerk closed a $200M Series E in January 2025 led by Atomico and EQT Growth with Noteus Partners and
              Sequoia Capital joining as new investors alongside continuing shareholders General Catalyst Kinnevik
              SoftBank Vision Fund and Blackstone. The oversubscribed round nearly doubled the company valuation to
              $2.7B. Total capital raised across all rounds stands at approximately $731M per Dealroom data.

              The investment thesis rests on four pillars. First the global corporate travel market is estimated at $1.5
              trillion (2024) with a $200B SMB and mid-market sub-segment in the US and Europe that legacy TMCs have
              chronically underserved. TravelPerk targets precisely this segment with a product-led self-serve motion
              that incumbent Concur and BCD Travel cannot replicate quickly. Second the Yokoy acquisition (closed
              January 2025 all-equity Sequoia now on cap table) adds AI-powered expense invoice and card-processing
              capability to create a genuine end-to-end T&E platform eliminating the buy-integrated-or-buy-best-of-breed
              trade-off for SMBs. Third TravelPerk reached EBITDA break-even at end of 2024 while posting 50%+ annual
              revenue growth for two consecutive years a rare combination. Fourth the AmTrav acquisition (June 2024)
              provides a US beachhead and cross-sell surface into the world largest corporate travel market.

              The anti-thesis is equally important. TravelPerk has not disclosed GAAP-equivalent audited financials
              gross margins or NRR so every valuation model rests on management-provided KPIs. Trustpilot reviews from
              2025 document a pattern of slow customer-service response pricing not materially better than direct
              booking and difficulty changing reservations signals that the product premium may be narrowing. Navan is
              well-capitalised with $6B+ in annual GBV making the US expansion harder than management investor messaging
              implies. And the 13x revenue multiple leaves limited margin of safety if growth decelerates.
            claimRefs:
              - CV001
