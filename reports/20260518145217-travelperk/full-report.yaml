      - number: '4.2'
        title: Financial Performance and Traction
        blocks:
          - type: paragraph
            body: >
              Perk reported annualized revenue exceeding $200 million (approximately €191 million) as of January 2025,
              with annualized gross booking value (GBV) surpassing $2.5 billion. The company sustained more than 50%
              annual revenue growth for two consecutive years (2023 and 2024), and in fiscal year 2023 specifically,
              revenue grew 70% year-over-year while gross profit grew more than 90% year-over-year—implying gross margin
              expansion through AI-driven automation of customer-care operations. Revenue declined sharply during the
              COVID-19 travel standstill of 2020 to 2021 before recovering; by early 2025 the company's revenue was
              approximately five times its pre-COVID level, which implies a pre-COVID annualized run rate of roughly $40
              million. EBITDA break-even was achieved at end-2024, representing a pivotal milestone for a company that
              had been deeply loss-making during COVID. Travel Weekly's independent 2025 Power List corroborates
              internal figures, reporting TravelPerk's 2024 gross bookings at $2.22 billion. U.S. revenues grew 65%
              year-over-year in 2023 and the company expects the U.S. to become its largest revenue region by 2026
              following the June 2024 AmTrav acquisition. The combined company (Perk plus Yokoy plus AmTrav) employs
              approximately 1,500 full-time staff across its global network. These metrics represent company-claimed
              figures; no independently audited financial statements have been published.
