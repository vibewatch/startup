      - CV016
      - CV050
  - id: FV003
    title: Valuation and Exit Return Range by Scenario
    type: range
    layout: standard
    summary: >-
      Low/base/high enterprise value outcomes across bear base and bull exit scenarios versus the Series E entry
      valuation with explicit growth and multiple assumptions.
    data:
      items:
        - label: Bear exit (2028)
          low: 1400
          high: 2000
          note: 20% CAGR to ~$280M revenue; 6-7x multiple; churn risk
        - label: Series E entry (2025)
          low: 2700
          high: 2700
          note: 'Reference point: $2.7B January 2025 Series E'
        - label: Base exit (2028)
          low: 3800
          high: 5000
          note: 35% CAGR to ~$400M revenue; 10-12x multiple; PE/strategic
        - label: Bull exit (2028)
          low: 7500
          high: 10500
          note: 50% CAGR to ~$600M revenue; 15-18x IPO multiple
    approximationNotes: >-
      All values in USD millions. Ranges reflect uncertainty in both revenue growth and exit multiple. Bear/base/bull
      scenarios are modelled estimates not company guidance. Yokoy integration is assumed to add incremental value in
      base and bull cases only.
    claimRefs:
      - CV039
      - CV040
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across seven investment dimensions rated 1-10 based on available evidence. Lower scores reflect
      higher uncertainty or weaker evidence.
    data:
      items:
        - label: Market Opportunity
          value: 8
          note: $200B SMB TAM $1.5T global corporate travel; tailwinds strong
        - label: Product Differentiation
          value: 7
          note: Integrated T&E unique; 25+ NDC; service quality concerns cap score
        - label: Financial Growth
          value: 8
          note: 50%+ CAGR x2 years; EBITDA break-even; booking volume $2.5B+
        - label: Competitive Moat
          value: 6
          note: Strong in SMB Europe; US moat unproven post-AmTrav
        - label: Margin / Unit Economics
          value: 4
          note: Gross margin undisclosed; NRR unknown; significant opacity
        - label: Valuation Discipline
          value: 4
          note: 13x rev stretched vs. peers; limited margin of safety
        - label: Evidence Quality
          value: 5
          note: No audited financials; management KPIs only; Trustpilot adverse signals
    approximationNotes: >-
      Scores are analyst judgements based on available public evidence as of May 2026. Margin/unit economics and
      evidence quality scores would increase materially if audited financials and NRR data were disclosed.
    claimRefs:
      - CV013
      - CV022
      - CV035
      - CV036
