  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Addressable Spend
        blocks:
          - type: paragraph
            body: >
              The addressable market for Perk (formerly TravelPerk) spans two concentric layers: the full global
              corporate

              travel spend market and the narrower travel management software (TMS) / travel-and-expense (T&E) platform

              market. The outer layer — all money businesses spend on flights, hotels, ground transportation, meals, and

              meetings while employees travel for work — reached an estimated $1.48 trillion globally in 2024 and is

              projected to hit $1.64 trillion in 2026 according to the Global Business Travel Association's 2024
              Business

              Travel Index Outlook. This macro pool sets the economic ceiling; every dollar flowing through corporate

              channels is a potential gross booking value (GBV) opportunity for a managed travel platform.


              Included in this outer market: domestic and international air travel booked for business purposes, hotel
              and

              serviced-apartment accommodation, ground transportation (rail, car rental, ride-hailing), business meals
              billed

              to a travel budget, and meetings/events/conferences where a company funds attendance. Excluded are leisure

              travel unconnected to business purpose, personal commuting, long-term corporate housing (separate
              real-estate

              budget), and consumer-to-consumer accommodation not managed through a corporate program.


              The inner and directly monetisable layer is the TMS / T&E software platform market: software
              subscriptions,

              platform licensing fees, and bundled service charges that companies pay to manage bookings, enforce
              policy,

              capture expenses, and report on travel spend. The Business Research Company estimated this TMS software
              market

              at $1.26 billion in 2026, growing to $1.66 billion by 2030. Technavio sizes the broader Travel and Expense

              Management Software market — encompassing TMS plus expense management and corporate cards — at a
              substantially

              larger opportunity, with the on-premises segment alone valued at $4.25 billion in 2024 and incremental
              growth

              of $3.27 billion projected at 10.4% CAGR through 2030.


              Status-quo substitutes include traditional Travel Management Companies (TMCs) such as CWT, BCD Travel, and

              American Express GBT that charge per-transaction fees ranging from $7.84 to $25.20; consumer booking sites

              (Expedia, Booking.com, Airbnb) that employees use when no corporate tool is mandated; and in-house Excel
              or

              email-based workflows common in smaller businesses. Each substitute represents both a risk (leakage from
              the

              managed platform) and a conversion opportunity for Perk.
