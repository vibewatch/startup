        title: Product Roadmap and Strategic Development
        blocks:
          - type: paragraph
            body: >
              TravelPerk's 2025–2026 product releases reflect a deliberate consolidation from travel-only to full
              travel-and-spend lifecycle management. The Yokoy acquisition (January 2025, $200M Series E) brings AI
              expense automation directly into the platform, eliminating the need for third-party expense tools. The
              Events management module launched in January 2026 extends addressable workflow from individual trips to
              group travel and off-site planning. Publicly signaled AI investments include trip modification, policy
              recommendation, and customer service automation — all aligned to the CTO's stated "AI-native" platform
              direction. The NDC roadmap continues: with 25 connections as of October 2025, TravelPerk is still
