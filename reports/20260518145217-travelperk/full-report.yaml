  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Factor
      - Type
      - Direction
      - Timing
      - Implication for TMS Adoption
      - Diligence Ask
    rows:
      - - Post-COVID market recovery exceeding pre-pandemic peak
        - Driver
        - Positive
        - 2024 — ongoing
        - Expanded TAM and budget headroom; more companies re-activating or upgrading travel programs
        - Confirm GBTA 2026 BTI actuals against IATA enplanement data when published
      - - AI-assisted booking adoption (71% of programs in 2026 vs 34% in 2024)
        - Driver
        - Positive
        - Current — accelerating
        - Raises willingness to pay for AI-enabled SaaS TMS; differentiates Perk from legacy TMC tools
        - Measure conversion-rate uplift from AI booking recommendations in platform cohort data
      - - EU CSRD Scope 3 travel emissions reporting mandate
        - Driver and Compliance Constraint
        - Positive (demand) and Negative (compliance overhead)
        - In force January 2024; first filings 2025
        - >-
          64% of programs now require emissions data in RFPs; elevates green features from differentiator to table
          stakes
        - Confirm which Perk EU customer segments fall within CSRD mandatory scope
      - - NDC adoption crossing 30% of indirect airline content (Q1 2026)
        - Driver
        - Positive
        - Current — growing
        - Platforms with NDC integration show richer fares and lower consumer-site leakage; raises switching cost
        - Audit depth of Perk NDC integrations and share of bookings via NDC vs. GDS
      - - Legacy ERP and HRIS integration gaps
        - Constraint
        - Negative
        - Persistent
        - >-
          Slows enterprise deal cycles; mid-market requires API connectors to Workday, NetSuite, SAP, or Xero before
          finance sign-off
        - Count out-of-the-box ERP connectors in Perk platform and compare to Concur and Navan
      - - Consumer-site booking leakage ('shadow booking')
        - Constraint
        - Negative
        - Persistent
        - >-
          56% of travellers book at least some trips outside the corporate tool; fragments expense data and lowers
          compliance rates
        - Measure Perk platform's in-policy booking rate and compare to pre-onboarding baseline
      - - Travel disruption rates (78% of travellers affected in 2024)
        - Driver and Risk
        - Positive (FlexiPerk demand) and Negative (employee experience)
        - Ongoing
        - >-
          High disruption validates FlexiPerk and 24/7 rebooking; poor disruption handling is the #1 switcher trigger
          away from a TMS
        - Track Perk FlexiPerk usage rate and NPS delta versus non-FlexiPerk bookings
      - - Bleisure normalisation (56% of travellers extended a trip for leisure in 2024)
        - Driver
        - Positive
        - Current — growing
        - >-
          Longer average trip duration increases hotel and flight GBV per booking; also raises policy and insurance
          complexity
        - Assess Perk's bleisure policy-split tools and measure average booking duration trend
    notes: >-
      Drivers and constraints identified from GBTA, Perk primary research, Travel-Code (citing AmexGBT), IATA, and EU
      Commission sources. Timing assessments reflect 2026 status. 'Driver and Constraint' rows capture factors with dual
      implications for the TMS market.
