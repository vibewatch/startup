      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              Gross margin percentage has not been publicly disclosed, but the 90% gross-profit growth versus 70%
              revenue growth in FY2023 confirms that gross margin as a percentage is expanding. This trajectory is
              consistent with AI automation reducing the marginal cost of customer-care operations (the company embedded
              AI that served twice the query volume with the same agent headcount), and with the subscription and
              FlexiPerk components growing faster than lower-margin pass-through booking revenue. A rough industry
              benchmark for SaaS-augmented corporate travel platforms places gross margins in the 40–60% range, but
              Perk's blend of high-margin SaaS subscription, moderate-margin transaction fees, and lower-margin GDS
              pass-through makes a specific estimate highly uncertain without internal data. Net revenue retention (NRR)
              has not been disclosed; given high-spend corporate customers and cross-sell expansion via Yokoy expense
              management, NRR above 100% is plausible but unverified. Customer acquisition cost and payback period are
              undisclosed. Sales efficiency proxies are limited to the observation that Perk added the U.S. as its
              second-largest market via organic growth plus two acquisitions (NexTravel 2021, AmTrav 2024), and that
              U.S. revenue doubled following the AmTrav deal—suggesting acquisition-driven top-line acceleration
              supplementing organic CAC efficiency. Cost structure is dominated by engineering/R&D, 24/7 customer
              support, and content/inventory costs; capex is minimal given the software-only model.
            claimRefs:
