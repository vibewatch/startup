      - number: '4.4'
        title: Capital Structure and Adequacy
        blocks:
          - type: paragraph
            body: >
              Perk has raised approximately $731 million in equity financing across six rounds through its January 2025
              Series E, plus a $135 million credit facility from Blackstone Credit & Insurance and Blue Owl Capital
              secured in June 2024, totaling approximately $866 million in lifetime capital. The Series E, led by
              Atomico and EQT Growth, closed at a $2.7 billion post-money valuation—nearly doubling the $1.4 billion
              valuation of the January 2024 Series D-1 led by SoftBank Vision Fund 2. The Yokoy acquisition was
              structured entirely in equity, with Sequoia Capital joining the cap table as a result, and no cash outflow
              was required. The $135 million debt facility was drawn to fund the AmTrav acquisition and broad U.S.
              expansion. Series E proceeds are designated for continued U.S. geographic expansion, AI and product
              investment, and Yokoy integration. EBITDA break-even at end-2024 means the company was not consuming cash
              operationally at time of the Series E, but the scale of the post-Yokoy integration, headcount of 1,500+,
              and ongoing U.S. expansion are likely to consume significant cash through 2026. No near-term IPO is
              planned per CEO and COO public statements in January 2025. The cap table is broadly distributed with no
              single majority holder, which reduces governance concentration risk but also means no single institutional
              owner is strongly incentivized to push toward a near-term liquidity event. The Eliran Glazer appointment
              as Audit Committee Chair (a public-company CFO with NASDAQ experience) is a credible signal of IPO
              preparedness for a future window.
