      - number: '8.3'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Three scenarios are modelled based on different assumptions about revenue growth trajectory margin
              improvement and exit multiple. All scenarios assume a 3-year forward horizon (exit in 2028-2029) from the
              January 2025 Series E entry point.

              The bull case assumes TravelPerk sustains 45-50% compound annual revenue growth through US expansion Yokoy
              cross-sell and continued European market penetration reaching $550-620M in revenue by 2027-28. In this
              scenario disclosed gross margins exceed 50% and the company files for IPO or completes a strategic sale at
              15-18x forward revenue implying an enterprise value of $8-10B. Probability signal is low-to-medium; it
              requires Navan not to achieve a competing IPO first the US market to ramp rapidly after AmTrav integration
              and customer satisfaction issues to be resolved.

              The base case assumes growth decelerates to 30-35% CAGR as the company scales reaching $380-420M in
              revenue. A PE-led secondary buyout or strategic acquisition by a travel technology conglomerate (Amadeus
              Sabre Booking Holdings) occurs at 10-12x revenue implying $3.8-5.0B enterprise value. Entry at $2.7B
              implies a 1.4-1.9x return at exit with upside from carry on warrants and the fact that Yokoy was acquired
              in an all-equity deal that added zero cash cost to the round. Probability signal is medium.

              The bear case assumes macro headwinds compress SMB travel budgets customer churn accelerates due to
              service quality issues documented in Trustpilot reviews and Navan wins the US SMB market with superior AI
              tooling. Revenue growth drops to 15-20% CAGR reaching only $270-300M by 2027-28. Multiple compression to
              6-7x implies an enterprise value of $1.7-2.1B a meaningful loss from the $2.7B entry point. Probability
              signal is low but non-trivial given lack of disclosed unit economics.
            claimRefs:
              - CV030
              - CV039
              - CV040
              - CV042
              - CV043
              - CV047
              - CV048
              - CV049
          - type: table
            tableRef: TV003
            claimRefs:
              - CV039
              - CV040
      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              TravelPerk investor base including EQT Growth Atomico Kinnevik General Catalyst SoftBank Vision Fund and
              Blackstone represents a high-quality syndicate with both the capital and relationships to support an IPO
              or large M&A process. Kinnevik has held a stake since 2018 signalling long holding-period comfort while
              Atomico and EQT bring direct experience with European technology IPOs. Sequoia joining via the Yokoy
              all-equity deal adds a US-focused investor who could facilitate a NASDAQ listing.

              The company was incorporated as an active private limited company (PERK UK LTD formerly TravelPerk UK IRL
              Limited formerly Click Travel Ltd) at UK Companies House (number 03770815) with accounts last made up to
              31 December 2024. Audited UK accounts if made public would provide the first independent verification of
              the revenue and EBITDA figures management has cited. The next accounts are due by 30 September 2026.

              The primary diligence ask is gross margin disclosure. Without it investors cannot determine whether
              TravelPerk is a high-margin SaaS platform (40-60% gross margin) or a lower-margin marketplace/intermediary
              (15-30% gross margin). This single variable changes the valuation range by a factor of two. Secondary asks
              include NRR/churn data (the Trustpilot evidence suggests retention risk) post-acquisition metrics for
              AmTrav and Yokoy and a detailed breakdown of the $731M total raised by round to understand the preference
              overhang.

              The rebranding from TravelPerk to Perk announced in 2025 is a strategic signal that the company intends to
              position itself as a broader business-spend platform rather than a travel tool consistent with the Yokoy
              acquisition. This expands the exit universe to include fintech and expense management acquirers (SAP Coupa
              Workday) in addition to travel technology buyers. Exit readiness is high on process infrastructure; the
              key gate is gross margin and NRR disclosure to support a premium multiple at IPO or in a competitive M&A
              process.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV041
              - CV045
              - CV046
