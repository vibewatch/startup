      - number: '7.6'
        title: 缓释措施、监测指标与投资逻辑失效标准
        blocks:
          - type: paragraph
            body: >
              TravelPerk 围绕主要风险向量建立了有意义但不完整的缓释措施。数据保护方面：双实体结构（独立 EEA 和 UK 法律实体，配套不同 DPA 协议）提供了司法辖区隔离。对齐 ISO 27001
              的控制、SOC Type 2 认证、专职安全运营（包括钓鱼模拟、端点检测、第三方供应商审计）和 CIIS 会员身份，提供了认证基线。运营风险方面：收购 Albatross
              为平台加入差旅风险情报；International SOS 支撑大规模 TravelCare 紧急协助；AI 客服在 2024 年不增加人手的情况下让查询吞吐翻倍。FlexiTravel 的 80%（而非
              100%）退款上限限制了单笔索赔负债。GDS/NDC 风险方面：TravelPerk 的多产品深度（预订加 Yokoy 费用、Perk Finance
              卡和安全能力）创造了高切换成本，对库存渠道风险形成部分对冲。财务风险方面：$200M Series E 提供流动性缓冲；EBITDA 已达到盈亏平衡；Yokoy
              以全股收购，保留了现金余量。主要未缓释财务风险是未披露的 Blackstone/Blue Owl 债务约束条款结构。下表定义了应触发投资者重新评估的监测指标和投资逻辑失效标准。
