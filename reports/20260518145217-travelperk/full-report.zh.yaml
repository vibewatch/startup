  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              TravelPerk 同时运营在三套不同数据保护制度下：受 AEPD 监管的西班牙 GDPR（Perk Platform SLU，Barcelona）、受 ICO 监管的 UK GDPR（Perk UK
              Ltd，London），以及 January 2025 收购 Yokoy 后受 FDPIC 监督的瑞士 nDSG（Yokoy AG，Zurich）。每套制度都有自己的通知期限、数据主体权利义务和执法姿态，要求
              TravelPerk 维持三套并行合规程序，而不是一个统一框架。按执法数量看，AEPD 是欧盟最活跃的数据保护机构之一。其 2026 年活动显示，检查项目持续瞄准基于 AI 的自动化决策和营销画像，两者都直接对应
              TravelPerk 的 AI 预订推荐和营销活动。ICO 维护公开执法登记册，定期显示针对数据控制者安全失效和违法处理的金钱罚款通知；Perk UK Ltd 明确处于其管辖范围内。根据 GDPR Article
              83(5)，最严重违规——违反 Article 5 的基本处理原则，或违反 Articles 12–22 下的数据主体权利——罚款可达 EUR 20 million 或全球年营业额的 4%。以
              TravelPerk $200M+ ARR 计算，4% 上限约为 $8 million。这笔罚款重大但不致命；更大的风险是公开执法行动对声誉和客户信任的冲击。TravelPerk
              大规模处理敏感个人数据：旅行行程、护照号、支付卡明细，以及特殊协助所需的健康或饮食信息。作为数据控制者（营销和员工）以及数据处理者（企业客户旅客数据），TravelPerk
              必须维持两套不同合规姿态和两套数据处理协议。Perk Platform SLU（EU）与 American Travel Solutions LLC（US，AmTrav）之间的跨境数据流，需要在适用 EU-US
              数据传输框架下使用 Standard Contractual Clauses 或等效机制。两项源自欧盟的监管框架进一步增加义务：CSRD 要求 TravelPerk 的企业客户报告 Scope 3
              差旅排放，因此预订层面必须提供审计级碳数据；DORA（January 2025 生效）要求使用 Perk Finance 或 Yokoy 费用工具的金融服务客户验证 TravelPerk 的 ICT
              韧性和第三方风险管理计划。
