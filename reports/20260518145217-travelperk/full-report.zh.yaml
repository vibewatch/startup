            body: >
              截至 2025 年 1 月，Perk 披露年化收入超过 $200 million（约 €191 million），年化总预订额（GBV）超过 $2.5 billion。公司连续两年（2023 和 2024
              年）维持超过 50% 的年收入增长；单看 2023 财年，收入同比增长 70%，毛利同比增长超过 90%，意味着 AI 驱动的客户服务自动化推动了毛利率扩张。2020 至 2021 年 COVID-19
              导致差旅停摆，收入大幅下滑，随后恢复；到 2025 年初，公司收入约为 COVID 前水平的五倍，意味着 COVID 前年化运行率约 $40 million。公司在 2024 年底实现 EBITDA
              收支平衡，对一家 COVID 期间深度亏损的公司来说，这是关键里程碑。Travel Weekly 的独立 2025 Power List 对内部数据形成佐证，披露 TravelPerk 2024 年总预订额为
              $2.22 billion。美国收入 2023 年同比增长 65%；在 2024 年 6 月收购 AmTrav 后，公司预计美国到 2026 年成为最大收入区域。合并后公司（Perk 加 Yokoy 加
