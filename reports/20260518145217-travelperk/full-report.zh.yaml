      - number: '6.5'
        title: 扩张、集中度风险与韧性展望
        blocks:
          - type: paragraph
            body: >
              TravelPerk 的收入模型与客户扩张天然一致：客户员工规模扩大带动席位数增长，旅客出行增加带动预订量增长，FlexiPerk 附加服务（按预订价值 25% 收费）创造了经常性收入附着率。收购 Yokoy
              并推出集成费用管理后，财务工作流嵌进了与差旅政策同一平台，切换成本被进一步加深，替换平台也更昂贵。客户集成案例几乎都强调 HR 系统连接（BambooHR、Workday、Personio、SSO）和财务集成，把
              TravelPerk 固定在运营栈里，而不只是一个简单预订工具。

              客户集中度风险未披露。没有单个客户被点名占据超过温和比例的预订量；10,000+ 账户基础意味着单一账户集中度风险大概率较低，但 Yokoy 客户基础（700+ 家较小、偏财务的客户）和 AmTrav
              加入带来了集成复杂度。欧洲地理集中仍是压力：美国扩张刚起步，AmTrav 品牌仍半独立运作。新兴费用管理动作既是扩张机会，也是执行风险，因为 Yokoy 集成仍在推进，而直接竞争对手（Navan、SAP
              Concur、Emburse）拥有更成熟的支出管理套件。已宣布的 GVB（一家欧洲出行服务商）费用自动化部署每年节省 300+ 小时，展示了价值主张，但 T&E 集成交易的管线深度尚未披露。
