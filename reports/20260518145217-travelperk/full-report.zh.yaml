  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              企业差旅管理市场可以分为三层竞争。直接 SaaS 竞争对手——Navan（前称 TripActions）、TravelBank 和 BizAway——比拼现代 UX、一体化费用管理，以及面向 SMB
              和中端市场买方的开发者友好平台。企业软件既有厂商——SAP Concur（SAP SE 子公司）和 Amex GBT（2021 年收购 Egencia，并于 2025 年 9 月以 $540 million 收购
              CWT）——凭 ERP 锁定和供应商网络规模主导大型企业账户。传统全服务 TMC——BCD Travel、FCM Travel 和
              CWT（被收购前）——凭全球足迹、专属顾问，以及在制药、能源、金融服务等行业的专门经验竞争。TravelPerk 将自己定位为最适合 SMB 和中端市场买方的替代方案：这些客户认为 SaaS
              对手要么过于美国中心（Navan），要么总拥有成本太高（SAP Concur），要么太依赖代理人（BCD Travel、FCM
              Travel）。现状替代方案——通过消费者差旅平台直接预订、手工报销费用、本地差旅代理——仍占未触达市场的实质部分，尤其是在少于 100 名员工且没有正式差旅政策的公司。市场正在快速整合：Amex GBT 于
              2025 年吸收 CWT，TravelPerk 自身也自 2021 年以来完成了 Click Travel、NexTravel、AmTrav 和 Yokoy 在内的四项收购。
