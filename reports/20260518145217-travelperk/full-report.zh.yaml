      - number: '7.3'
        title: 合作伙伴与供应链风险
        blocks:
          - type: paragraph
            body: >
              TravelPerk 的库存获取在结构上依赖 Global Distribution System 中介，主要是 Amadeus、Sabre 和
              Travelport，用于获取数百家航司的航班内容。如果航司加速基于 NDC 的直连分发，并降低 GDS 内容同等性，TravelPerk 可能失去差异化所依赖的完整企业票价库存。IATA 的 NDC
              标准如今已被多数主要航司采用，使航司能够直接向买家分发个性化价格。多家航司已推出 GDS 附加费或降低票价同等性，为 GDS 部分过时提供了可信的中期路径。TravelPerk 尚未公开披露其 NDC
              覆盖比例，或已经来自 NDC 渠道的预订份额。Perk Finance 卡运营依赖两个单一来源伙伴：Transact Payments Malta（EEA，受 Malta FSA 监管）和 Transact
              Payments Limited（UK，受 Gibraltar FSC 监管）。公司没有披露备用卡项目管理方；任一牌照或合作伙伴丢失，都会让 Perk Finance 在对应地区暂停。TravelCare
              照护责任能力对 International SOS 的依赖，也让安全价值主张出现类似集中风险。需求侧同样暴露：截至 early 2026，TravelPerk 9%
              的预订量增长仍容易受地缘政治事件影响——中东不稳定推动自愿国际取消增加 28%、中国差旅成本上升 68%——也容易受衰退期企业收紧差旅政策影响。
