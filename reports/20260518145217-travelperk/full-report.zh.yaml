  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可寻址支出
        blocks:
          - type: paragraph
            body: >
              Perk（前称 TravelPerk）的可寻址市场由两个同心层构成：完整的全球企业差旅支出市场，以及更窄的差旅管理软件（TMS）/
              差旅与费用（T&E）平台市场。外层市场包括企业为员工商务出行支付的航班、酒店、地面交通、餐饮和会议等全部支出；根据 Global Business Travel Association 的 2024
              Business Travel Index Outlook，2024 年全球规模估计达到 $1.48 trillion，并预计 2026 年达到 $1.64
              trillion。这个宏观资金池设定了经济天花板；每一美元通过企业渠道流动的支出，都可能成为托管差旅平台的总预订额（GBV）机会。

              外层市场包括：以商务目的预订的国内和国际航空出行、酒店和服务式公寓住宿、地面交通（铁路、租车、网约车）、计入差旅预算的商务餐饮，以及由公司承担参会费用的会议 / 活动 /
              大会。排除项包括与商务目的无关的休闲旅行、个人通勤、长期企业住房（属于独立房地产预算），以及未通过企业项目管理的消费者对消费者住宿。

              内层也是 Perk 能直接变现的层，是 TMS / T&E 软件平台市场：企业为管理预订、执行政策、采集费用并报告差旅支出而支付的软件订阅、平台许可费和打包服务费。The Business Research
              Company 估计 TMS 软件市场 2026 年规模为 $1.26 billion，到 2030 年增长至 $1.66 billion。Technavio 对更广的 Travel and Expense
              Management Software 市场——涵盖 TMS、费用管理和企业卡——给出了大得多的机会，本地部署细分市场 2024 年就达到 $4.25 billion，并预计到 2030 年以 10.4%
              CAGR 增加 $3.27 billion。

              现状替代方案包括传统差旅管理公司（TMC），如 CWT、BCD Travel 和 American Express GBT，它们按交易收取 $7.84 至 $25.20 的费用；也包括
              Expedia、Booking.com、Airbnb 等消费者预订网站，员工在没有强制企业工具时会直接使用；以及小型企业常见的内部 Excel 或邮件流程。每一种替代方案对 Perk
              既是风险（交易从托管平台漏出），也是转化机会。
