chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与产品平台
        blocks:
          - type: paragraph
            body: >
              Perk（前称 TravelPerk）是一家总部位于巴塞罗那的 SaaS 公司，为全球中小企业（SMB）和中端市场企业提供一体化差旅与费用管理平台。公司成立于 2015
              年，声称接入全球最大的可预订差旅库存——来自 Booking.com、Expedia、Airbnb
              等主要供应商的航班、酒店、火车、租车和公寓——并通过单一统一界面交付：出行员工获得接近消费者产品的自由度，财务团队和差旅经理则能集中控制支出和政策合规。2025 年 3 月 31 日，公司成立 10
              周年之际，TravelPerk 正式更名为 Perk，体现其从单纯差旅预订转向更广的差旅与费用（T&E）管理平台。此次品牌重塑由品牌咨询公司 Wolff Olins 操刀，推出新的 “Perk Green”
              视觉识别，与行业常见的企业蓝形成区隔。Perk 总部位于巴塞罗那 22@ 创新区（Carrer dels Almogàvers, 160），并在伦敦以及美国的 Boston、Chicago、Los
              Angeles、Miami 设有办公室。平台核心产品线包括 FlexiPerk（灵活取消，至少 80% 退款保证）、GreenPerk（碳足迹追踪与抵消）、TravelCare（实时差旅风险管理），以及在
              2025 年 1 月收购 Yokoy 后加入的 AI 费用、发票和银行卡支付管理。公司使命是让企业在一个自动化平台中端到端管理差旅和支出，并提供 24/7
              多语言客户支持。目标客户是欧洲和美国的中小企业（SMB）及中端市场公司。
