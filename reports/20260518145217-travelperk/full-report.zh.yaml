            title: 安全认证缺口构成企业销售风险
            body: >
              截至 May 2026，TravelPerk 没有公开确认 ISO 27001 或 SOC 2 Type II 认证。这些是北美和英国中端市场、企业买家的标准采购要求。没有公开鉴证，TravelPerk
              可能被排除在采购短名单之外，或被要求私下提供安全文件，从而拉长企业销售周期。考虑到 TravelPerk 在收购 Yokoy 后明确要上探大客户，这一点尤其重要。
