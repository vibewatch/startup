      - number: '8.2'
        title: 估值框架与可比分析
        blocks:
          - type: paragraph
            body: >-
              按 January 2025 Series E 价格，TravelPerk 企业价值为 $2.7B，对应超过 $200M 的年化收入，隐含 EV/revenue 倍数约 13x。在 SaaS
              增长市场语境下，13x 偏高，但对增长 50%+ 且 EBITDA 为正的公司并非没有先例。关键问题不是 13x 在绝对意义上是否便宜，而是它是否匹配底层业务质量。

              直接可比公司有限，因为真正有规模的 TMC 同业要么上市（Amex GBT，NYSE GBTG），要么嵌在更大的企业里（SAP Concur），要么仍是私营且经济性未披露（Navan、BCD
              Travel、CWT）。Amex GBT 2024 年收入约 $2.4B，市值隐含约 3x 收入；但 Amex GBT 服务大型企业，运营模式根本不同（高接触、人员密集），相较 TravelPerk
              产品驱动模式出现倍数折价符合预期。Navan 2024 年估计 GBV 为 $6.1B，不能直接与收入相比；但若 Navan 抽佣率为估计的 3-5%，收入将为 $180-300M，正落在 TravelPerk
              区间内。Navan 仍是私营公司，上一轮以来未披露估值。

              2024-2025 年，增长 30-50% 的 SaaS T&E 软件公司在公开市场上的 EV/revenue 倍数约为 8-20x，取决于增长、毛利率和盈利路径。TravelPerk 的 13x
              位于可信区间高端；公司已经达到 EBITDA 盈亏平衡，但尚未披露毛利率。如果毛利率处于 SaaS 相邻平台常见的 40-55% 区间，这一倍数可以自洽。如果毛利率更低，如预订 GTV
              较重的模型常见情况，倍数就会压缩。这种不透明性是投资案例中最大的量化风险。
