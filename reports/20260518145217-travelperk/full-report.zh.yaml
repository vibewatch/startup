  - id: TM001
    title: 市场定义和支出类别
    columns:
      - 类别
      - 包含支出
      - 排除支出
      - 买方 / 付款方
      - 与 TMS 平台的关系
    rows:
      - - 企业航空差旅
        - 用于商务目的的国内和国际航班预订
        - 休闲或个人航空旅行；货运；包机
        - 公司财务 / 采购
        - 高——通常占企业差旅预算的 17–27%；是 TMS 中的核心预订对象
      - - 商务住宿
        - 酒店、服务式公寓、工作出差短租
        - 休闲住宿；计入独立房地产预算的长期企业住房
        - 公司财务
        - 高——通常占企业差旅预算的 34%；TMS 处理协议价获取和合规
      - - 地面交通
        - 租车、出租车、网约车和商务铁路出行
        - 员工通勤；个人事务；公司车队车辆
        - 员工 / 公司卡
        - 中——属于 TMS 预订的一部分；费用捕捉覆盖未预订事项
      - - 会议、会展和活动
        - 外部活动注册、场地租赁、MICE（会议、激励旅游、大会、展览）支出
        - 单独计入 L&D / HR 预算的内部全员会或培训
        - 采购 / 市场
        - 中——可通过 TMS 报告间接触达；通常属于独立活动管理预算
      - - 差旅管理软件（TMS）
        - SaaS 平台订阅、OBT 授权、TMC 服务和交易费用
        - IT 基础设施、ERP 系统、非差旅导向的 HR 平台
        - IT / 财务 / 差旅经理
        - 直接——这就是 Perk 竞争的软件市场（2026 年全球约 $1.26B）
      - - 费用管理和 T&E 套件
        - 与差旅相关的费用报销、公司卡管理、发票处理
        - 与差旅无关的薪资、应付 / 应收账款
        - CFO / 财务总监
        - 扩张邻接市场——Perk 收购 Yokoy 是为拿下这一相邻支出类别
    notes: 航空和住宿预算占比估算来自 perk.com 博客引用的 Hotel Tech Report。支出类别沿用 GBTA 需求侧测算框架。T&E 套件是相邻市场，Perk 于 2025 年 1 月 通过收购 Yokoy 进入。
