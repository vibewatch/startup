      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Perk 由 Avi Meir（CEO）、Javier Suarez 和 Ron Levin 于 2015 年共同创立。Avi Meir 此前曾将一家公司出售给
              Booking.com，自创立起一直带领公司，外界普遍认为其推动了公司的增长策略；其中包括 COVID-19
              疫情期间坚持零裁员，在竞争对手收缩时保住工程和产品能力。Jean-Christophe（JC）Taunay-Bucalo 担任总裁兼 COO，负责全球扩张战略；Roy Hefer 于 2022 年 7 月加入担任
              CFO，曾参与两家科技公司 IPO，并在 McKinsey 和 Hippo Insurance 任职；Nikita Miller 于 2025 年 9 月从 The Knot Worldwide 和 Trello
              加入担任首席产品官；拥有 20 年差旅科技经验的 Robin Smith 于 2025 年 9 月晋升为首席技术官。董事会由主要投资方代表和独立董事组成。2025 年 1 月 Series E
              轮之后，Hillary Ball（Atomico）和 Carolina Brochado（EQT Growth）加入董事会。Booking.com 前 CEO 兼董事长 Gillian Tans 于 2022 年
              1 月作为独立董事加入，带来深厚行业经验。Joel Cutler（General Catalyst）和 Stephen Thorne（SoftBank Investment
              Advisers）代表机构投资者。monday.com（NASDAQ: MNDY）CFO Eliran Glazer 于 2024 年 11
              月获任审计委员会主席，为公司接近潜在资本市场准备阶段补上上市公司治理经验。CEO Avi Meir
              自创立以来主导了每一轮重大融资、并购交易和战略转向，领导权高度集中；公开记录中没有继任计划披露来对冲这一风险，关键人风险仍然实质存在。
