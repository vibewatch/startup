            body: >
              以一家该阶段的私营 SaaS 公司而言，TravelPerk
              的客户证明库相当厚。案例组合覆盖至少十二个具名账户，包含具名人士、具体职位的公开引语、量化结果指标和部署语境（生产使用还是扩展阶段）。GetYourGuide 是时间最长的推荐客户：自 TravelPerk
              2015 年创立起就是客户，在 17 个办公室管理每月 200+ 次行程，并共同开发了 FlexiTravel 取消功能。Bolt 则是运营细节最丰富的案例：4,000+ 名员工、50 个国家 51
              个办公室、2018 年以来预订 27,000 次工作行程，并记录了采用 TravelPerk 后差旅成本下降 10%。

              具名客户名单偏向欧洲科技公司和成长型公司，美国企业推荐账户有限（AmTrav 客户名单未公开披露）。案例结果主要体现自助预订采用、政策合规和节省时间，而不是硬 ROI 指标。量化最细的案例是
              Fabletics：十二个月内政策节省 $15,268、航班政策节省 $10,235、财务团队时间节省 $3,013，合计 $37,500，116 名欧洲员工采用率 99%。MedSkin
              展示了集成深度：费用匹配 AI 准确率 99%，HR（Personio）、差旅和费用工具之间数据同步 100%。AutoScout24（欧洲最大的在线汽车 交易平台，1,000 名员工，覆盖 11 个欧洲市场）在
              2023 年采用平台，用于泛欧洲政策整合和酒店价格谈判。这些案例验证的是生产部署，不是试点。
