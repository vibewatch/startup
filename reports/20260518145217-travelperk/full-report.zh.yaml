            title: 消费者预订漏出削弱 TMS 价值主张
            body: >
              56% 的商务差旅人员至少会把部分行程预订在企业工具之外，而最近到 2023 年，也只有 14% 的买方在差旅项目中使用 AI。漏出会损害费用数据完整性、降低合规率，并削弱支撑 TMS
              订阅成本的政策执行价值主张。这个结构性逆风要求公司持续投资差旅人员侧 UX，缩小与消费者 OTA 的差距。
