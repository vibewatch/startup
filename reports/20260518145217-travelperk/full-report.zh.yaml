      - number: '6.2'
        title: 采用轨迹与平台规模
        blocks:
          - type: paragraph
            body: >
              TravelPerk 的采用故事更多由预订量增长讲述，而不是由客户数增长讲述。截至 early 2025，年化总预订量达到 $2.5 billion，高于 January 2024 的约 $2
              billion，也远高于公司称为当前规模一小部分的疫情前水平。年化收入超过 $200 million，过去两年年增长超过 50%。Travel Weekly Power List 2025 引用
              TravelPerk 2024 年报告销售额为 $2.22 billion，按全球预订量跻身前 40 大差旅管理公司。

              账户层面，TravelPerk 自有材料称截至 September 2025 全球商业客户超过 10,000 家。June 2024 发布的商务差旅价值调查招募了 5,200+ 名 Perk
              客户做一手研究，为活跃用户基础提供了有意义的代理指标。单个案例显示账户内行程量快速增长：Bolt 从 2018 年手工临时预订，扩展到仅 2024 年就为 2,000+ 名出差员工提供 11,000
              项服务；GetYourGuide 扩展到 17 个办公室、每月 200+ 次行程；Storyblok 在 43 个国际办公室每月运行 60+ 次行程。Fabletics 上线 116 名员工，采用率
              99%，前十二个月处理出可量化节省 $37,500。这些轨迹符合先落地再扩张的动态：最初的政策合规工具随客户员工规模增长带动席位扩张。
