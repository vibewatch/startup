              进一步把费用处理自动化率提高到 90%，减少每笔预订需要的人为触点。这些 AI 投资正在把 TravelPerk 从劳动密集型差旅管理模式推向更高毛利的软件平台，支撑 $2.7B 估值。
            calloutType: strength
