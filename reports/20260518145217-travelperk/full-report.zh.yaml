      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 在多个产品维度上与 SaaS 同行拉开差异。FlexiTravel 对出发前两小时内取消提供 80% 退款保证，主要竞争对手没有以同等条款提供。EMEA
              铁路覆盖，以及在英国、西班牙和德国提供欧洲 VAT 追回，相对美国起家的竞争对手形成可防守优势。TravelPerk 的市场提供 50 多个第三方集成（Ramp、Pleo、HiBob、Deel），而 SAP
              Concur 的 300 多个连接器仍在企业集成深度上领先。TravelPerk 于 2024 年 8 月与 Emirates 完成第 20 个 NDC 航司集成，Navan 为 17 个 NDC
              连接；两者原生支持能力都超过大多数传统 TMC。TravelPerk 还提供 Green Trip 碳足迹追踪，对欧盟 CSRD 合规买方有价值。定价上，TravelPerk 的 Starter（免费加每笔预订
              5%）、Premium（每月 $99 加每笔预订 3%）和 Pro（每月 $299 加每笔预订 3%）相对企业级替代方案具备竞争力，但会受到 Navan 佣金资助的免费差旅模式的结构性压力。一家公司每月预订
              100 次、平均票价 $300，在 Pro 方案下每年约需支付 $9,000 TravelPerk 预订费，而 Navan 直接费用为零。截至 2026 年 5 月，Capterra 显示 TravelPerk
