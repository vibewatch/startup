      - number: '5.5'
        title: 产品路线图与战略演进
        blocks:
          - type: paragraph
            body: >
              TravelPerk 在 2025–2026 年的产品发布显示，公司正有意从单纯差旅扩展为完整的差旅与支出生命周期管理。Yokoy 收购（January 2025，$200M Series E）把 AI
              费用自动化直接并入平台，减少对第三方费用工具的需求。January 2026 推出的 Events 管理模块，把可覆盖工作流从个人行程扩展到团体差旅和异地活动规划。公开释放的 AI
              投资方向包括行程修改、政策推荐和客服自动化，都与 CTO 提出的 "AI-native" 平台方向一致。NDC 路线图仍在推进：截至 October 2025 已有 25 个连接，TravelPerk
              仍在扩展航司直连内容。SilverRail 合作扩展到美国铁路，补上了地理覆盖。公司没有公开正式产品路线图，但收购（Click
              Travel、NexTravel、AmTrav、Albatross、Yokoy）和自研（GreenPerk、FlexiTravel、Events、AI
              层）的组合，呈现出从预订工具扩展到完整企业差旅与费用操作系统的一致路径。January 2025 Series E 融资释放出的金融科技扩展信号（企业卡、支付对账），是费用管理之后顺理成章的下一步。
