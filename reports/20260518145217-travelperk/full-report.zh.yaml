      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Navan 免费差旅模式制造结构性定价压力
            body: >-
              Navan 通过航司和酒店供应商佣金为差旅模块供血（约占收入 92%），不向客户收取直接预订费。对一家每月预订 100 次、平均票价 $300 的公司来说，TravelPerk Pro 方案下 3%
              预订费意味着每年约 $9,000 预订费用，而 Navan 为零。高频账户的费用缺口会继续扩大，而且具有结构性——TravelPerk 无法在不替代 Starter
              方案漏斗收入的情况下取消按预订收费。尽调应按客户预订频率分组建模费用敏感性，并评估中期 Yokoy 费用收入能否抵消按预订收费压力。
            calloutType: risk
            claimRefs:
              - CP018
              - CP034
          - type: callout
            title: FlexiTravel 与 EMEA 铁路覆盖是近期可防守差异化
            body: >-
              截至 2026 年 5 月，TravelPerk 的 FlexiTravel 保证——出发前两小时内取消可获 80% 退款——Navan、SAP Concur、BCD Travel 或 FCM Travel
              都没有以同等条款提供。再加上原生 EMEA 铁路预订和三个市场的欧盟 VAT
              追回，这些功能解决了一个明确买方痛点（差旅支出不可预测），消费者级预订工具无法复制。它们还需要供应商关系投入和精算风险管理，构成近期真正的竞争复制壁垒。对总部位于 EMEA 的中端市场买方——也就是
              TravelPerk 的核心 ICP——这些差异化最有价值，也是反驳该细分市场商品化的最强论据。
            calloutType: strength
            claimRefs:
              - CP021
              - CP022
              - CP033
          - type: callout
            title: 企业既有厂商正在整合并推出 AI 升级
            body: >-
              Amex GBT 于 2025 年 9 月完成以 $540 million 收购 CWT，把按预订量排名第一和第三的企业 TMC 合并，显著放大合并后的供应商费率优势。与此同时，Amex GBT 在 2026
              年重启 Egencia，推出 AI 预订体验，目标是在 3 分钟内交付行程，并直接集成 SAP Concur Expense；这瞄准的是此前认为 Egencia 太偏企业级的中端市场买方。SAP Concur
              已部署超过 10 年的嵌入式 ML 工具包，也让其在自动化合规和政策例外流程上更有优势。这些动作从上方压缩 TravelPerk 的中端市场窗口（企业既有厂商借 AI 下沉），也从下方施压（Navan
              以免费定价拿 SMB）。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP042
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Perk 采用 SaaS 与交易混合收入模式；自 2018 年 Series B
              以来，这一模式已发生实质变化，当时平台免费向客户开放，收入完全来自供应商激励付款。当前模式在按预订收取的交易费和供应商激励收入之上，叠加三档订阅套餐（Starter、Premium、Pro）。定价页没有列出美元金额；企业和中端市场合同需要演示后定价，这是
              B2B 差旅平台的标准做法，但也让实际平均售价和折扣行为变得不透明。Starter 档只允许卡支付，并限制成本对象自定义（一个字段）；Premium 增加高级 HR 集成和单点登录（SSO）；Pro
              提供专属客户经理和所有未来角色——这些功能显示公司在按席位或按实体定价上有明显差异。FlexiPerk 作为灵活取消附加产品，收取预订金额 25%，并保证至少 80%
              退款，本质上把客户为风险溢价付费的意愿变现，是结构上有吸引力的利润率贡献项。2025 年 1 月收购 Yokoy
              后，公司增加了费用管理收入流（发票处理、银行卡支付处理和报销自动化），把收入从纯差旅预订向外分散。通过 Transact Payments Malta（EEA）和 Transact Payments
              Ltd（UK）发行企业卡，显示金融科技收入层正在成形。Kinnevik 2024 年 1 月评论称，客户收入较疫情前基准已经翻倍，说明财务改善轨迹由变现深化驱动，而不只是交易量增长。
            claimRefs:
