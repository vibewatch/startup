      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 的投资人阵容包括 EQT Growth、Atomico、Kinnevik、General Catalyst、SoftBank Vision Fund 和
              Blackstone。这个财团质量高，既有资本，也有关系网络，足以支撑 IPO 或大型 M&A 进程。Kinnevik 自 2018 年以来持股，说明其能接受长持有期；Atomico 和 EQT
              直接做过欧洲科技公司 IPO。Sequoia 通过 Yokoy 全股权交易加入，引入了偏美国市场的投资人，可能为 NASDAQ 上市铺路。

              公司在 UK Companies House 登记为活跃私人有限公司（PERK UK LTD，曾用名 TravelPerk UK IRL Limited、Click Travel Ltd），公司编号
              03770815，最近一份账目截至 2024 年 12 月 31 日。若经审计的英国账目公开，将首次独立验证管理层披露的收入和 EBITDA。下一份账目应在 2026 年 9 月 30 日前提交。

              首要尽调问题是毛利率披露。没有这个变量，投资人无法判断 TravelPerk 究竟是高毛利 SaaS 平台（40-60% 毛利率），还是低毛利市场 / 中介（15-30%
              毛利率）。单是这一项，就会让估值区间相差一倍。第二层问题包括 NRR / 流失率数据（Trustpilot 证据提示留存风险）、AmTrav 和 Yokoy 收购后的指标，以及 $731M
              总融资按轮次拆分，以看清优先清算权包袱。

              2025 年 TravelPerk 更名为 Perk，是一个战略信号：公司想把自己定位成更宽的企业支出平台，而不只是差旅工具；这与收购 Yokoy
              一致。退出买家范围也因此扩大，除差旅科技买家外，SAP、Coupa、Workday 等金融科技和费用管理收购方也进入视野。流程基础设施上，退出准备度高；真正的关口是披露毛利率和 NRR，才能在 IPO 或竞争性
              M&A 中支撑高溢价倍数。
