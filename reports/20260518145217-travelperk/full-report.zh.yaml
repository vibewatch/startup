      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: 估值有纪律时可买入
            body: >-
              按当前 $2.7B 入场价，TravelPerk 评级为买入，但前提是在投入大额资金前确认毛利率高于 40%。13x 收入倍数带有溢价；50%+ 增长和 EBITDA
              盈亏平衡能解释这部分溢价，但毛利率不透明，无法形成高确信度。基准情形在 3-5 年内给出 1.5-2x 回报；牛市情形靠 IPO 给出 3-4x。若以 $2.7B
              或更高估值进入，仓位必须能承受熊市情形：退出价接近入场价。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV039
              - CV040
          - type: callout
            title: 毛利率不透明是核心估值风险
            body: >-
              TravelPerk 毛利率是最关键的缺失数据。若毛利率落在 45-60% 的 SaaS 区间，13x 倍数可以自洽，基准情形也成立。若毛利率只有 20-35%，更像纯预订市场的典型水平，可比公司就会切到 GDS
              公司和传统旅行代理，合理倍数应降至 5-8x。在 UK Companies House 提交经审计账目（FY2025 下一次截至 2026 年 9 月）或公司递交 IPO 文件之前，这个风险无法消除。
            calloutType: risk
            claimRefs:
              - CV014
              - CV034
              - CV036
              - CV050
          - type: callout
            title: 规模化后 EBITDA 盈亏平衡是稀缺信号
            body: >-
              TravelPerk 在收入超过 $200M、年增速 50%+ 的情况下实现 EBITDA 盈亏平衡，这个组合并不常见。多数处在这个阶段的高增长 SaaS 公司会大举烧钱获客。如果盈亏平衡是结构性的——由强
              take-rate 经济性和单位毛利改善驱动——它会给估值托底，也会显著降低基准情形风险。如果只是阶段性的——靠融资期间压费用实现——本轮后继续投入可能推迟盈利。管理层对这一拐点的说明，应成为尽调重点。
            calloutType: insight
            claimRefs:
              - CV013
              - CV026
              - CV043
