      - number: '5.2'
        title: 技术架构与 NDC 集成
        blocks:
          - type: paragraph
            body: >
              TravelPerk 的技术架构围绕预订引擎、政策引擎、费用引擎（Yokoy）和活动引擎分层；这些模块通过一层集成层连接 GDS 连接器、NDC 连接器和应用市场 API。NDC（New Distribution
              Capability）策略是核心差异化：TravelPerk 在 2024 年达到 20 个 NDC 连接（包括 Emirates），并通过深化 Amadeus 合作，到 October 2025 扩展至
              25+。IATA 的 NDC 标准旨在替代传统 EDIFACT 消息协议，让航司直连内容更丰富，包括品牌票价和辅营服务；因此 Perk 能提供 Lufthansa NDC 票价，最高比 GDS 公布价节省
              37%。January 2025 收购的 Yokoy 费用 AI 引擎用机器学习处理收据 OCR、自动分类和政策执行，据称实现 90% 费用自动化率。CTO Robin Smith 在 September
              2025 披露，2024 年完成的 AI 原生平台重构让毛利率翻倍，并加入 AI 行程修改、客服自动化和政策推荐功能。AI 行程修改功能允许旅客在预订确认后通过对话界面调整预订。铁路技术由 SilverRail
              合作支撑，在既有欧洲铁路覆盖之外支持美国 Amtrak 铁路预订。报告模块为差旅经理提供实时支出仪表盘和可定制分析。
