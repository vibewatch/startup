      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Navan 是 TravelPerk 最接近的 SaaS 同类。Navan 总部位于 Palo Alto，2024 年按预订量口径估计销售额约 $6.1 billion，员工约 3,000 人，投资方包括
              Andreessen Horowitz、Coatue 和 Lightspeed。公司还拥有 Reed & Mackay，用于覆盖企业级 TMC 需求。其自研 Navan Cognition AI 在 2024
              年每月处理超过 150,000 次聊天支持互动，其中 50% 可自主解决；截至 2026 年 5 月，平台在 9,075 条评价中获得 4.7/5 的 G2 评分，是所有 SaaS TMS 中评价量最高的。SAP
              Concur 是 SAP 全资子公司，拥有最深的企业安装基础，G2 评价约 6,997 条，预置连接器超过 300 个；如果计入实施成本，企业客户平均总拥有成本约 $110,000 / 年。Amex GBT 于
              2025 年 9 月完成以 $540 million 收购 CWT，按预订量形成全球最大的企业差旅管理集团，并在 2026 年推出 AI 驱动的 Egencia 平台，支持 3 分钟内完成预订，并与 Concur
              Expense 集成对账。BCD Travel 总部位于 Utrecht，2024 年销售额 $22.9 billion，覆盖 170 多个国家，员工约 15,000 人，拥有 TripSource 预订平台和
              Advito 咨询业务。FCM Travel 隶属于 Flight Centre Travel Group，服务 95 多个国家的中大型企业，2026 年重启 AI 助手 Sam，提供对话式预订能力，并由
              Crisis24 风险情报和 SHERPA 监管数据支持。
