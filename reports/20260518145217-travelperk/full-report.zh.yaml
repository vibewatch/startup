  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与市场分层
        blocks:
          - type: paragraph
            body: >
              TravelPerk 主要面向欧洲和美国的 SMB 与中端市场企业，广义上是 10–5,000 名员工的公司；January 2025 的 Series E 明确写到，公司战略重点是“美国和欧洲的 SMB
              与中端市场企业”。具名客户覆盖多个垂直领域：科技成长型公司（Storyblok、Freepik、GoCardless）、出行与交通（Bolt、Cabify）、零售与生活方式（Fabletics、Lush）、电商（ManoMano）、健身（PureGym）、汽车交易平台（AutoScout24）和差旅科技（GetYourGuide）。公司材料还引用了几家高知名度品牌：Red
              Bull、Aesop、Fujifilm 和 Nord Security。

              地理上，历史装机基础以欧洲为主（总部在 Barcelona，英国、德国、西班牙、法国是核心市场），但 2024 年收购 AmTrav（美国公司，30+ 年历史）以及 2024 年扩张 AmTrav
              品牌，显著加快了美国渗透。Yokoy 在瑞士和 DACH 市场的 700+
              客户增加了中欧维度。客户规模偏向数字原生企业；这类企业员工分散，经常为跨办公室协同、销售和活动出差，而不是按企业级战略客户管理模式出差。TravelPerk
              没有公开披露客户基础按规模、地理或垂直行业拆分，外部无法独立验证各细分占比。
