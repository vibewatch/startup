      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM 视角
        blocks:
          - type: paragraph
            body: >
              多家分析机构用不同范围定义衡量这个市场，估算结果相差一到两个数量级。要正确判断 Perk 的机会，首先要理解这些方法论差异，避免只引用最大可得数字却没有边界逻辑的常见错误。

              GBTA 2024 Business Travel Index Outlook 是业内引用最广的第一手来源，追踪 72 个国家、44 个行业的全部商务差旅支出。报告称，全球商务差旅在 2024 年超过 2019
              年疫情前 $1.43 trillion 的峰值，达到约 $1.48 trillion，并预计 2026 年达到 $1.64 trillion，6–8% 的年化增长将延续到 2027 年。亚太是最大区域市场，规模约
              $720 billion，其次是北美 $410 billion 和西欧 $345 billion。按 World Travel and Tourism Council 估计，仅美国 2024 年商务差旅支出就达到
              $472 billion。这些数字代表全栈 TAM——企业差旅管理平台经手并捕获的总体经济活动。

              Perk 能直接变现的 SAM 是 TMS 软件平台市场。The Business Research Company 将该市场估为 2026 年 $1.26 billion，到 2030 年增至 $1.66
              billion（7.2% CAGR），驱动因素包括 AI 集成、云采用和移动优先预订。如果定义扩展到完整 T&E 软件套件——TMS 加费用管理、发票处理和企业卡（Perk 在收购 Yokoy
              后的定位）——Technavio 的 $4.25 billion 本地部署细分基准和以 10.4% CAGR 增加 $3.27 billion 的机会，意味着到 2030 年可寻址软件市场约 $7–8
              billion。分析师估算分歧很大：有些只统计纯 TMS SaaS，规模为数亿美元；有些纳入托管服务；至少还有一家分析机构用不同边界定义，把狭义“business travel market”到 2027
              年只预测为 $829.5 billion——这与 GBTA 更广的口径相冲突，应视为另一个市场边界。

              北美是 2025 年 TMS 软件最大的单一区域，Perk 于 2024 年 6 月收购 AmTrav，正是对这一地理市场的直接扩张。可寻址 SOM——在 Perk 当前欧洲和北美足迹、聚焦中端市场和
              SMB、采用按行程定价模式的条件下能实际拿到的机会——公司没有披露；但可以用其超过 $200 million 的年化收入运行率对照约 $1.26 billion 的 SAM 粗略框定，意味着狭义 TMS
              市场渗透率约 16%。如果 T&E 邻近市场被成功拿下，仍有显著空间。
