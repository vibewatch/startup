      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              毛利率百分比尚未公开披露，但 2023 财年毛利增长 90% 对比收入增长 70%，确认毛利率正在扩张。这一轨迹与 AI 自动化降低客户服务运营边际成本相符（公司嵌入的 AI
              在客服人数不变的情况下服务了两倍查询量），也与订阅和 FlexiPerk 组件增长快于较低利润率的转付型预订收入相符。SaaS 增强型企业差旅平台的粗略行业基准毛利率在 40–60% 区间，但 Perk
              混合了高毛利 SaaS 订阅、中等毛利交易费和较低毛利 GDS 转付收入；没有内部数据，很难给出具体估计。净留存率（NRR）未披露；考虑到高支出企业客户以及通过 Yokoy 费用管理做交叉销售扩张，NRR 超过
              100% 有可能，但尚未验证。获客成本（CAC）和回本周期未披露。销售效率的替代指标很有限，只能看到 Perk 通过有机增长加两次收购（NexTravel 2021、AmTrav
              2024）把美国做成第二大市场，且美国收入在 AmTrav 交易后翻倍——这说明收购驱动的收入加速补充了有机 CAC 效率。成本结构主要由工程 / 研发、24/7 客户支持以及内容 /
