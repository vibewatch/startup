      - number: '5.4'
        title: 信任、合规与隐私
        blocks:
          - type: paragraph
            body: >
              TravelPerk 的隐私政策确认，其对欧盟客户数据承担 GDPR 数据控制者身份，且处理发生在欧盟基础设施内。欧洲市场的企业采购通常把 GDPR 合规列为供应商门槛，因此这一点很关键。但截至 May
              2026，TravelPerk 尚未公开确认 ISO 27001 认证或 SOC 2 Type II
              鉴证——这些认证是北美和英国中端市场、企业买家的标准采购门槛。缺少公开认证文件，使其可观察的信任姿态出现缺口，本章将其列为重要证据缺口。按 Trustpilot 衡量的客户满意度，在 May 2026 访问日为
              3.2/5（"Average"），用户评论反复提到客服响应和偶发预订错误。FlexiTravel 保证条款（出发前 2h 取消、80%+
              退款）在产品页写得很清楚，但尚未通过索赔审计数据独立验证。TravelPerk 在 GreenPerk 下的可持续主张由 VERRA、Gold Standard、Puro.earth
              三家独立认证机构验证，比多数差旅科技竞争对手拥有更强的第三方背书。
            claimRefs:
              - CE003
              - CE004
              - CE029
              - CE030
              - CE031
