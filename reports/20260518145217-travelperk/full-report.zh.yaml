  - id: TV006
    title: 最终尽调待索取材料
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 毛利率画像
        - 未公开披露；管理层 KPI 仅引用收入和 EBITDA
        - 决定 13x 倍数反映的是 SaaS 质量，还是 GTV 占重的预订收入
        - CFO 会议；数据室；或 IPO S-1 申报文件
      - - 净留存率（NRR）
        - 未披露；未发布队列或扩张收入数据
        - 验证产品粘性的主要证据；Trustpilot 证据提示下行风险
        - 商业数据室；投资人管理层演示材料
      - - 经审计 GAAP / IFRS 财务报表
        - UK Companies House FY2025 下一期账目应于 2026 年 9 月提交；FY2024 账目已提交但尚未公开
        - 独立核验 $200M+ 收入和 EBITDA 盈亏平衡说法
        - UK Companies House 文件（03770815）；直接索取审计账目
      - - AmTrav 后美国收入爬坡
        - 交易于 2024 年 6 月完成；整合表现没有公开指标
        - 乐观情景依赖美国扩张；若 AmTrav 停滞，悲观情景风险抬升
        - 管理层更新；索取美国预订 / 收入拆分
      - - Yokoy 后费用管理收入贡献
        - 全股票收购于 2025 年 1 月完成；没有公开整合 KPI
        - 验证一体化 T&E 逻辑；决定交叉销售收入潜力
        - CFO/COO 简报；Yokoy 客户留存和 ARR
      - - 优先股压力与股权结构表
        - 累计融资 $731M，包含多轮优先股；清算优先权未披露
        - 决定普通股在什么退出估值上才有实质分配
        - 法律数据室；股权结构表审查
    notes: 尽调待索取材料按对估值的重要性排序。第 1-2 项（毛利率和 NRR）是按当前倍数形成投资信念的前置条件。第 3-6 项也重要，但可在投资条款清单之后补齐。
    claimRefs:
      - CV034
      - CV036
