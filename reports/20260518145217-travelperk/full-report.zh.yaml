      - number: '1.4'
        title: 业务规模、指标与客户牵引
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 1 月，Perk 披露年化收入超过 $200 million，年化预订量超过 $2.5 billion，过去两年收入年增长率超过 50%。公司到 2025 年毛利率约为 72%，并在 2024
              年底实现 EBITDA 收支平衡——在 SaaS 赛道里，能在规模化阶段同时保住增长和盈利并不常见。2023 财年毛利同比增长超过 90%，由 AI 驱动的客户服务自动化拉动。截至 2025 年 9 月，Perk
              在全球服务超过 10,000 家企业客户，包括 Red Bull、Revolut、Wise、Adyen、GetYourGuide、Aesop、On Running、Breitling、Fujifilm 和
              Nord Security。截至 2025 年中，公司全职员工约 1,500 人。2020 至 2021 年 COVID-19 造成差旅停摆，公司收入大幅下滑，估计较峰值下降约 80% 至 90%；到 2025
              年初已恢复至 COVID 前水平的约五倍。Travel Weekly 的 2025 Power List 披露 2024 年总预订额为 $2.22 billion，为公司的交易量指标提供独立佐证。Perk
              的差异化来自广泛差旅库存、AI 自动化和灵活的 FlexiPerk 政策，而非价格折扣；混合客户评价里已经能看到价值感知缺口。美国收入 2023 年同比增长 65%，并在 2024 年 6 月收购 AmTrav
              后约翻倍，把美国推向公司最高收入地区的位置。
