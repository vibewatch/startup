      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              以一家后期私营公司衡量，Perk 公开可得的财务画像异常强：收入增长超过 50%、走到 EBITDA 收支平衡、年化收入超过 $200 million、总预订额 $2.5
              billion，都指向一个已规模化、正在复苏且具备真实运营动能的平台。收入质量看起来较高——多收入流（订阅、交易费、供应商激励、FlexiPerk
              附加费以及现在的费用管理）——并且在改善：毛利增长快于收入，是可靠的毛利率扩张信号。但缺少审计财务、未披露毛利率百分比、未披露 NRR、未披露烧钱速度，也没有公开 CAC 或回本数据，造成实质承销不确定性。以约
              $200 million 年化收入对应 $2.7 billion 估值，隐含收入倍数约 13–14x——这是溢价水平，需要公司拥有显著高于转付型预订业务通常水平的毛利率，或让投资人相信 Yokoy
              会带来毛利率台阶式提升。Trustpilot 和 G2 客户评价记录了对价格价值的明显不满（客户认为相对直接预订没有成本优势）以及 FlexiPerk 复杂度，这构成留存和 NPS
              风险，而这些风险无法只从收入指标中看到。COVID 收入坍塌证明整个平台仍依赖可自由裁量的商务差旅支出；任何资本充足性模型都应纳入压力情景。
            claimRefs:
              - CI036
