  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与融资背景
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 在 January 2025 完成 $200M Series E，由 Atomico 和 EQT Growth 领投，Noteus Partners 和 Sequoia Capital
              作为新投资者加入，既有股东 General Catalyst、Kinnevik、SoftBank Vision Fund 和 Blackstone 继续跟投。这轮超额认购融资几乎让公司估值翻倍至 $2.7B。按
              Dealroom 数据，历轮累计融资约 $731M。

              投资逻辑建立在四个支柱上。第一，全球企业差旅市场估计为 $1.5 trillion（2024），其中美国和欧洲 SMB 与中端市场子板块为 $200B，传统 TMC 长期服务不足。TravelPerk
              用产品驱动、自助式动作精准切入该细分，现有 Concur 和 BCD Travel 难以快速复制。第二，Yokoy 收购（January 2025 完成，全股；Sequoia 因此进入股权结构表）加入 AI
              驱动的费用、发票和卡处理能力，打造真正端到端 T&E 平台，消除 SMB 在买集成方案和买同类最佳工具 之间的取舍。第三，TravelPerk 在 end-2024 达到 EBITDA
              盈亏平衡，同时连续两年年收入增长 50%+，这种组合少见。第四，AmTrav 收购（June 2024）提供美国桥头堡，并在全球最大企业差旅市场打开交叉销售界面。

              反向逻辑同样重要。TravelPerk 没有披露 GAAP 等价经审计财务、毛利率或 NRR，因此每个估值模型都建立在管理层提供的 KPI 之上。2025 年 Trustpilot
              评论记录了慢客服响应、价格并不显著优于直接预订、改签困难等模式，说明产品溢价可能正在收窄。Navan 资本充足，年 GBV 超过 $6B，使美国扩张比管理层和投资者叙事暗示的更难。而 13x
              收入倍数在增长放缓时留给安全边际的空间有限。
