      - number: '7.5'
        title: 执行、人员与 M&A 整合风险
        blocks:
          - type: paragraph
            body: >
              TravelPerk 正同时整合跨四个国家的三家被收购公司——Albatross（UK）、AmTrav（Chicago，USA，June 2024 收购）和
              Yokoy（Zurich，Switzerland，January 2025 收购）——并管理 1,500+ 人团队、建设新的金融科技产品线。M&A
              节奏异常快：七个月内两项重大收购，每项都需要技术整合、合规协调和文化融合。关键人风险集中在创始人层面：CEO Avi Meir 是主要外部代表和战略愿景负责人；CFO Roy Hefer 与 COO JC
              Taunay-Bucalo 分别对财务管理和 IPO 准备至关重要。公司未公开披露接班计划或高管归属期安排。Yokoy 收购部分前提是获得 AI 工程人才；若收购后流失关键 Yokoy 技术负责人，将直接削弱
              TravelPerk 的 AI 费用自动化路线图。Layoffs.fyi 显示截至 May 2026，TravelPerk
              没有重大裁员，但把三套产品栈整合进统一架构是多年工程项目，执行风险高。地理上的员工复杂度也很关键：Barcelona（西班牙劳动法、AEPD）、London（英国雇佣法、ICO）、Chicago（美国
              任意雇佣制度，经 AmTrav 触及 CCPA）和 Zurich（瑞士雇佣法、Yokoy 后的 nDSG）分别对数据处理、遣散和员工委员会义务提出不同要求。
