      - number: '1.3'
        title: 融资历程与投资人版图
        blocks:
          - type: paragraph
            body: >
              自 2015 年以来，Perk 已通过六轮股权融资获得超过 $700 million，另于 2024 年 6 月拿到 $135 million 信贷额度。融资路径从 2018 年 4 月 $21 million
              Series B 开始（累计融资达到 $30 million），随后是 2019 年 10 月由 Kinnevik、Yuri Milner 和 Tom Stafford 领投的 $44 million
              Series C（累计约 $75 million）。COVID 时期的 Series D 包括 2021 年 4 月由 Greyhound Capital 领投的首笔 $160 million（累计 $294
              million），以及 2022 年 1 月由 General Catalyst 和 Kinnevik 领投的追加 $115 million；后者让公司以超过 $1 billion 估值跻身独角兽（累计 $409
              million）。2024 年 1 月，SoftBank Vision Fund 2 领投 $104 million Series D-1 延展轮，公司估值 $1.4 billion。2025 年 1 月 28
              日宣布的 $200 million Series E 轮由 Atomico 和 EQT Growth 领投，Noteus Partners 以及老股东 Kinnevik、General Catalyst
              参投，估值几乎翻倍至 $2.7 billion。2024 年 6 月，Blackstone Credit & Insurance 和 Blue Owl 提供 $135 million 信贷额度，为收购
              AmTrav 提供资金。股权结构较为分散，没有单一多数股东；Sequoia Capital 通过全股权收购 Yokoy 进入股东名册。Perk 的 COO 于 2025 年 1 月公开表示近期没有 IPO
              计划，公司优先长期增长而非短期流动性。
