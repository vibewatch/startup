      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              TravelPerk 平台可用性完全依赖 AWS Ireland，未见有记录的第二云故障切换。AWS Ireland 若长时间宕机，TravelPerk 所有服务会同时停摆——预订、费用提交、Perk
              Finance 卡交易和客服运营。公司声称对齐 ISO 27001，并拥有 SOC Type 2 认证，但未公开认证机构或审计报告范围。高频运营中断风险是差旅行业固有问题：TravelPerk
              自有研究确认，2024 年全球 78% 的商务旅客遭遇中断，43% 遭遇超过一小时延误。系统性事件会同时放大这一压力：July 2024 CrowdStrike IT 故障使全球航司准点率在单月降至
              57%，同时推高改签请求、FlexiTravel 退款索赔和紧急支持来电。尽管 2024 年 TravelPerk 借 AI
              在客服人数不变的情况下处理了两倍查询量，公司仍面临结构性成本底线：商务旅客在中断期间只有 10% 偏好自动聊天机器人支持，其余 90% 需要人工坐席。向金融科技（Perk
              Finance）扩张加入了新的风险类别：Transact Payments Malta 或 Gibraltar 的卡支付失败，会损害企业持卡人实时支付差旅的能力。FlexiTravel 的 80%
              退款保证形成类似保险的负债：地缘政治冲击或系统性 IT 故障期间，同时出现的大规模取消索赔可能带来短期现金流出，而公司未披露任何金融工具对冲。TravelPerk CEO 在 January 2025
              承认，OpenAI 的 Operator AI 智能体——能够自主预订旅行——对托管预订流程构成可信的中期颠覆威胁。
