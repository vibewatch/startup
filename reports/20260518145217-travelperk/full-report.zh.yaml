      - number: '7.7'
        title: 关键证据
        blocks:
          - type: callout
            title: GDPR 执法风险：重大但不致命
            body: >
              GDPR 最高罚款敞口约为 $8M（$200M ARR 的 4%），重大但不致命；更重要的风险是声誉。AEPD 或 ICO 的公开执法行动会被显著披露，并受到受监管行业企业客户审视，可能触发金融服务和医疗健康
              TMC 客户流失——这是 TravelPerk 价值最高的细分。
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR007
          - type: callout
            title: M&A 整合：执行风险叠加
            body: >
              对一家到 end-2024 才达到 EBITDA 盈亏平衡的公司而言，TravelPerk 六年三次收购的计划异常激进。三套产品栈、四个员工司法辖区和三套合规制度同时整合，形成叠加执行风险；ARR
              增长或预订量等表层财务指标捕捉不到这一点。
            calloutType: insight
            claimRefs:
              - CR031
              - CR033
              - CR034
              - CR038
          - type: callout
            title: 单一云集中——首要单点故障
            body: |
              集中在 AWS Ireland 这一单一云，是 TravelPerk 最尖锐的单点故障风险：AWS Ireland 长时间可用性事件会同时中断预订、费用、卡运营和客服，且没有记录显示有第二云回退或地理冗余。
            calloutType: insight
            claimRefs:
              - CR014
          - type: callout
            title: 未披露债务约束条款：优先尽调缺口
            body: >
              Blackstone 和 Blue Owl 的 $135M 债务工具条款完全未披露——包括约束条款、利率、到期日和摊销安排。在增长放缓情景下，约束条款
              违约可能迫使公司在多实体整合支出同步发生时，以不利条款融资。这是需要管理层直接披露的优先尽调缺口。
            calloutType: risk
            claimRefs:
              - CR024
              - CR028
          - type: callout
            title: GDPRhub 访问受阻：无法验证活跃 AEPD 程序
            body: >
              由于 JavaScript 渲染要求和机器人防护，自动抓取无法访问 GDPRhub 对 AEPD 案件的执法跟踪。若 TravelPerk 实体存在活跃 AEPD 执法程序，公开来源无法验证，需要对 AEPD
              案件登记册做专项法律尽调。
            calloutType: risk
            claimRefs:
              - CR006
              - CR039
          - type: callout
            title: 多产品切换成本部分对冲 GDS 风险
            body: >
              TravelPerk 的多产品深度（预订加 Yokoy 费用、Perk Finance 卡以及通过 TravelCare 提供的安全能力）创造了高切换成本，能够部分对冲 GDS 和 NDC 内容风险：采用
              Perk Finance 和 Yokoy 费用工具的客户，退出成本明显高于单一产品 TMC 用户，即便出现 GDS 内容退化，也能让业务免受快速竞品迁移冲击。
            calloutType: strength
            claimRefs:
              - CR029
              - CR031
          - type: callout
            title: CSRD 和 DORA 合规成为拉动型市场机会
            body: >
              CSRD 和 DORA 给企业客户带来的合规压力，为 TravelPerk 的数据丰富平台创造了拉动型市场：必须报告 Scope 3 排放或证明 DORA 下 T&E
              数字韧性的公司，会更偏好能提供审计级数据轨迹的一体化 TMC 加费用平台，而不是需要手工对账的碎片化单点方案。
            calloutType: insight
            claimRefs:
              - CR010
              - CR020
          - type: callout
            title: 证据缺口确认：债务、诉讼与集中度
            body: >
              研究问题 QR008（债务约束条款）、QR020（活跃诉讼或执法程序）和 QR021（按细分划分的客户收入集中度）无法从公开来源回答。下方 localEvidence.evidenceGaps
              记录了三个证据缺口。任何正式投资或审计流程都需要管理层直接披露这些事项。
            calloutType: assumption
