      - number: '5.3'
        title: 开发者生态与市场
        blocks:
          - type: paragraph
            body: >
              TravelPerk 在 September 2020 向第三方开发者开放 API 平台，形成了如今包含 200+ 集成应用的应用市场。developers.perk.com 上的开发者平台提供 REST
              API、webhook 和 OAuth 2.0 认证，让企业先在沙盒环境里构建并测试定制差旅应用，再投入生产。GitHub 组织（github.com/travelperk）维护多款开源工具，包括
              jets-seatmap-react（座位图渲染库）、fabricator（内部工具框架）、label-requires-reviews-action（GitHub Actions 工作流助手）和
              platform-assessment-terraform（基础设施即代码模块）。这些公开仓库显示出活跃工程文化，也为合作伙伴提供了集成切入点。应用市场覆盖 HR 系统、费用平台、会计工具和通信应用，使
              TravelPerk 能嵌入企业软件栈，而不是只做一个独立单点工具。开放 API 策略也支撑 TravelPerk 的 TMC 和渠道伙伴分销模式，允许第三方把预订工作流嵌进自己的产品。截至 May
              2026，开发者平台没有公开 SLA 或正常运行时间保证。
