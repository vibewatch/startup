      - number: '8.3'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              三个情景基于不同收入增长轨迹、毛利率改善和退出倍数假设建模。所有情景都以 January 2025 Series E 入场点为起点，假设三年前瞻周期（2028-2029 退出）。

              乐观情景假设 TravelPerk 借助美国扩张、Yokoy 交叉销售和欧洲市场继续渗透，将复合年收入增长维持在 45-50%，到 2027-28 年收入达到 $550-620M。在该情景下，披露毛利率超过
              50%，公司提交 IPO 文件或以 15-18x 远期收入完成战略出售，隐含企业价值 $8-10B。概率信号为低到中；它要求 Navan 不先完成竞争性 IPO、AmTrav
              整合后美国市场快速爬坡，并且客户满意度问题得到解决。

              基准情景假设公司规模扩大后增长放缓至 30-35% CAGR，收入达到 $380-420M。由 PE 主导的二级买断，或由差旅科技集团（Amadeus、Sabre、Booking Holdings）战略收购，以
              10-12x 收入发生，隐含 $3.8-5.0B 企业价值。以 $2.7B 入场，退出时回报为 1.4-1.9x，另有认股权证持有收益 以及 Yokoy
              以全股收购、未给本轮带来现金成本所带来的上行。概率信号为中。

              悲观情景假设宏观逆风压缩 SMB 差旅预算，Trustpilot 评论记录的服务质量问题导致客户流失加速，Navan 凭更强 AI 工具赢下美国 SMB 市场。收入增长降至 15-20% CAGR，到
              2027-28 年只达到 $270-300M。倍数压缩至 6-7x，隐含企业价值 $1.7-2.1B，相较 $2.7B 入场点构成显著亏损。鉴于公司未披露单位经济性，概率信号虽低但并非可以忽略。
