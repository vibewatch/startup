      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              企业差旅决策涉及三个不同角色，而且很少由同一个人承担：买方（评估并签约平台）、用户（出差员工）和付款方（承担预算的人）。谁控制每个角色、每个角色关心什么，是 Perk 获客和产品设计的基础。

              买方通常是中端市场公司的差旅经理、财务总监或运营副总裁；企业级客户中则是采购总监或全球差旅总监；SMB 中往往是 CEO 或办公室经理。采购标准差异很大：企业级买方优先看合规、照护责任覆盖和 ERP
              集成；中端市场买方要成本可见性、部署便利和政策自动化；SMB 买方优先看简单、按行程定价（无席位许可）和省时间。Perk 的调研显示，94% 的 T&E
              决策者希望得到覆盖差旅、报销、费用管理和企业卡的一体化方案，这验证了 Yokoy 之后统一平台的策略。同样，90% 的人希望自动执行政策合规，Perk 称其平台合规率超过 90%。

              用户是出差员工，最常见的是销售代表、顾问、客户服务人员和高管。其中 56% 的差旅人员自行预订酒店和航班，44% 由管理员或差旅经理代订。这个分裂意味着 Perk 的 UX
              必须同时满足偏消费者化的自助预订者，以及代表他人操作的管理者。

              付款方是公司财务职能。CEO 调研显示，62% 的企业预计 2024 年增加差旅预算。ROI 论证决定预算分配：对 SMB 和中端市场公司而言，Perk 自有研究显示，商务差旅每投入 $1 可带来 $12
              增量收入，主要来自新客户获取；同时 34% 的高管层领导者把 2023 年三分之一的销售增长归功于线下会面。即便宏观环境承压，这种强 ROI 叙事也支撑差旅预算不被削减。

              中型企业（201–2,000 名员工）最可能增加差旅支出（2024 年为 51%），高于大型企业（50%）和 SMB（43%）。这个 Perk
              明确声明的核心客群，已经超出消费者工具和非正式流程的边界，但又缺乏大型企业的采购权力和定制开发预算，因此最适合自助、内置政策感知的 SaaS 平台。
