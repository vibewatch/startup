            title: 中端市场是速度最快的细分
            body: >
              中型企业（201–2,000 名员工）最可能增加差旅预算（2024 年为 51%），也面临最强的产品市场匹配缺口——对消费者工具来说太大，对企业级 TMC 来说又太受成本约束——并且正是 Perk
              声明的核心细分。商务差旅每 $1 支出可带来 $12 的 SMB / 中端市场收入，支撑付款方愿意投资托管平台，而不是继续用临时预订。
