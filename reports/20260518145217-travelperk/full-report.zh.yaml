companyProfile:
  summary: >
    TravelPerk（2025 年 3 月更名为 Perk）是一家总部位于巴塞罗那的 B2B SaaS 公司，2015 年由 Avi Meir、Javier Suarez 和 Ron Levin
    创立。公司面向欧洲和美国的中小企业（SMB）及中端市场企业，提供一体化差旅与费用管理平台。平台把全球最大的可预订差旅库存——航班、酒店、铁路、租车和公寓——整合到统一界面，并叠加集中化政策控制；产品还包括
    FlexiPerk（灵活取消）、GreenPerk（碳追踪）、TravelCare（差旅风险管理），以及在 2025 年 1 月收购 Yokoy 后加入的 AI 费用、发票和银行卡支付管理。截至 2025 年 1
    月，TravelPerk 披露年化收入超过 $200 million，年化总预订额超过 $2.5 billion，并实现 EBITDA 收支平衡；公司完成了 $200 million Series E 轮融资，投后估值为 $2.7
    billion。
