      - number: '4.4'
        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 1 月 Series E，Perk 已通过六轮股权融资累计约 $731 million，另于 2024 年 6 月获得 Blackstone Credit & Insurance 和 Blue
              Owl Capital 提供的 $135 million 信贷额度，生命周期累计资本约 $866 million。Series E 由 Atomico 和 EQT Growth 领投，投后估值 $2.7
              billion——几乎是 2024 年 1 月 SoftBank Vision Fund 2 领投 Series D-1 时 $1.4 billion 估值的两倍。Yokoy 收购完全以股权结构完成，因此
              Sequoia Capital 进入股权结构表，且没有现金流出。$135 million 债务额度用于支持 AmTrav 收购和美国大范围扩张。Series E 资金用途包括继续美国地理扩张、AI
              与产品投资、Yokoy 整合。2024 年底 EBITDA 收支平衡意味着 Series E 时点公司运营层面并未烧钱，但 Yokoy 整合规模、1,500+ 员工以及持续美国扩张，很可能在 2026
              年前消耗大量现金。CEO 和 COO 2025 年 1 月公开表态称近期无 IPO 计划。股权结构分散，没有单一多数股东，这降低了治理集中风险，但也意味着没有单一机构股东会强烈推动近期流动性事件。任命
