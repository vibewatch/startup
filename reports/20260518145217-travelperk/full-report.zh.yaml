      - number: '3.4'
        title: 护城河耐久度与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 的竞争护城河建立在四个相互连接的支柱上：产品差异化（FlexiTravel、Green Trip、Perk Cards）、供给侧优势（20 个 NDC
              连接和谈下来的低成本航司费率）、来自政策与 HR/ERP 集成的切换成本，以及收购驱动的整合策略。其中，FlexiTravel 和 EMEA
              铁路覆盖是近期最可防守的差异化，因为它们需要供应商关系和产品投入，无法一夜复制。最实质的护城河风险包括：第一，Navan 的佣金资助模式会在结构上压低高频账户使用 TravelPerk
              按预订收费的吸引力；第二，SAP Concur 的 300 多个 ERP 连接器和 Fortune 500 安装基础，会封锁大型企业新增机会；第三，Amex GBT 在收购 CWT 后合并后的供应商费率组合超过
              TravelPerk 的议价能力；第四，TravelPerk 在 Trustpilot 的 3.2/5 评分指向服务质量缺口，可能加快客户流向 Navan。TravelPerk 的开放 API 支持 Ramp 和
              Pleo 集成，因此多归属可行，锁定效应受限，但也支持混合 T&E 技术栈。收购 Yokoy 让 TravelPerk 能延展到一体化费用管理，与 Navan
              更直接竞争，但整合时间表和深度仍未得到公开验证。Perk Cards 推动的金融科技路线，如果支出数据形成政策执行飞轮，可能加深切换成本。EMEA 优先的产品投入（GDPR 合规、欧盟可持续报告工具、VAT
