            title: NDC 领先带来内容优势
            body: >
              截至 October 2025，TravelPerk 拥有 25+ 个 NDC 航司连接，覆盖全球预订的 40%，在航司直连内容上已经实质性领先多数企业差旅工具。仅 Lufthansa NDC 集成就能提供最高比
              GDS 同类票价低 37% 的价格，为关注成本的差旅买家创造可量化价值。NDC 内容还支持传统 GDS 渠道拿不到的更丰富辅营服务和品牌票价。
            calloutType: strength
