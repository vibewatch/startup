      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              多股结构性力量同时扩大 TMS 市场、重塑采购标准；另一组约束则限制新平台替代存量厂商的速度。

              最强顺风是市场复苏和持续扩张。GBTA 买方情绪调查（2025 年 Q4）发现，79% 的企业差旅买方预计 2026 年公司差旅支出会高于 2025 年，只有 8% 预计削减。预算持续上行会提升既有平台的
              GBV，也会加快企业评估新工具。

              AI 采用是移动最快的技术驱动因素。Travel-Code 引用的 American Express GBT 2026 Tech Trends Report 显示，使用 AI 辅助预订推荐的差旅项目从 2024
              年的 34% 升至 2026 年的 71%。IATA 的 New Distribution Capability（NDC）标准到 2026 年 Q1 已超过间接航空内容的
              30%，让更丰富的票价打包和附加服务可见性成为可能——这利好投资 NDC 集成的平台。AI 与 NDC 共同提高切换成本，并把现代平台与传统 TMC 工具区分开。

              监管压力正在出现，而且已经具备实质影响。欧盟 Corporate Sustainability Reporting Directive（CSRD，Directive 2022/2464，2024 年 1
              月生效）要求约 50,000 家公司在经审计年报中披露 Scope 3 差旅排放。GBTA 的 2025 Sustainability Index 发现，64% 的企业差旅项目现在已在供应商 RFP
              中纳入排放数据，高于 2023 年的 38%。这把绿色报告能力——Perk 的 GreenPerk 和碳抵消功能——从差异化卖点推成评估标准。

              约束侧，传统 ERP 集成仍是最常被提及的部署障碍。中端市场和企业级公司的财务团队要求 Perk 接入 Workday、NetSuite、SAP
              和本地薪资系统，才算闭合费用对账链条。缺少开箱即用连接器的平台，会面临更长实施周期，延迟 ARR 确认。消费者渠道漏出是第二个持续约束：56% 的差旅人员仍会把至少一部分行程通过消费者
              OTA（Expedia、Booking.com）预订，而不是使用企业工具，导致费用数据碎片化，也削弱政策合规价值主张。差旅中断——2024 年有 78% 差旅人员受影响——会增加运营成本，但也证明
              FlexiPerk 和实时改签是高感知价值功能，足以支撑 TMS 投入。
