      - number: '6.4'
        title: 留存、满意度与韧性信号
        blocks:
          - type: paragraph
            body: >
              TravelPerk
              没有公开披露净留存率（NRR）、总留存率（GRR）或年度流失率。任何投资者沟通、新闻稿或媒体报道中都缺少这些指标，这是重大尽调缺口。不过，代理信号显示结构性留存韧性。具名客户呈现多年合作关系：GetYourGuide
              自 2015 年起就是客户（11 年），Bolt 自 2018 年起（8 年），另外多家客户持续 3–5 年，且没有公开流失。公司年增长 50%+、客户数超过 10,000
              家，意味着净客户增长为正，也说明新客户获取足以覆盖任何流失。

              第三方满意度信号较混杂。截至 mid-2025，TravelPerk 在 Trustpilot 的 TrustScore 为 3.2/5（"Average"），负面评论反复提到几类问题：FlexiPerk
              政策混淆（客户以为改签也受保障，但保障只适用于取消）、客服响应慢、航班供应商数据中断导致无法自助修改、以及相较直接预订缺少价格优势。GetApp 评论整体正面，G2 将平台列为高评分差旅管理 SaaS。B2B
              企业案例满意度与个人 B2C 风格 Trustpilot 评论之间的差异，可能部分源于使用雇主账户的旅客用户，而不是产品设计瞄准的核心 SMB 和中端市场买家。
