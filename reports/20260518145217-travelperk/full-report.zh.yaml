  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: 从市场机会、产品定位、财务证明和风险因素，推导到估值偏高情况下的最终买入建议。
    data:
      nodes:
        - id: market
          label: 市场：$200B SMB T&E TAM 仍低渗透
        - id: product
          label: 产品：Yokoy 并购后形成一体化 T&E 平台；25+ 个 NDC 连接
        - id: financials
          label: 财务：收入 $200M+，增长 50%+，EBITDA 盈亏平衡
        - id: risk
          label: 风险：毛利率不透明，NRR 未知，服务质量有隐忧
        - id: valuation
          label: 估值：$2.7B（13x 收入）偏高，但增长可支撑
        - id: recommendation
          label: 建议：有纪律买入，基准情景 1.5-2x，乐观情景 3-4x
      edges:
        - from: market
          to: product
        - from: product
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: 流程代表分析师逻辑链，不是量化模型。风险和估值节点分别汇总多维证据。
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV028
      - CV043
  - id: FV002
    title: EV/收入倍数估值敏感性（基准收入 $200M）
    type: bar
    layout: standard
    summary: 以当前 Series E 收入运行率约 $200M 为锚，展示隐含企业价值对收入倍数假设的敏感性。
    data:
      items:
        - label: 6x（悲观底线）
          value: 1200
        - label: 8x（压力基准）
          value: 1600
        - label: 10x（基准）
          value: 2000
        - label: 13x（当前 Series E）
          value: 2600
        - label: 15x（乐观入场）
          value: 3000
        - label: 18x（乐观 IPO）
          value: 3600
    approximationNotes: 隐含价值以百万美元计。收入基数 $200M 是已宣布的最低年化口径；实际收入可能更高。倍数来自 SaaS T&E 同业区间分析。
    claimRefs:
      - CV014
      - CV016
      - CV050
  - id: FV003
    title: 不同情景下估值与退出回报区间
    type: range
    layout: standard
    summary: 在悲观、基准和乐观退出情景下，对低 / 基准 / 高企业价值结果进行比较，并与 Series E 入场估值对照，明确列出增长和倍数假设。
    data:
      items:
        - label: 悲观退出（2028）
          low: 1400
          high: 2000
          note: 收入以 20% CAGR 增至约 $280M；6-7x 倍数；流失风险
        - label: Series E 入场（2025）
          low: 2700
          high: 2700
          note: 参考点：2025 年 1 月 Series E，$2.7B
        - label: 基准退出（2028）
          low: 3800
          high: 5000
          note: 收入以 35% CAGR 增至约 $400M；10-12x 倍数；PE/战略买家
        - label: 乐观退出（2028）
          low: 7500
          high: 10500
          note: 收入以 50% CAGR 增至约 $600M；15-18x IPO 倍数
    approximationNotes: 所有数值以百万美元计。区间反映收入增长和退出倍数两方面的不确定性。悲观 / 基准 / 乐观情景均为模型化估计，并非公司指引。仅在基准和乐观情景中假设 Yokoy 集成带来增量价值。
    claimRefs:
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的七项投资维度评分，按现有证据评为 1-10 分。分数越低，代表不确定性越高或证据越弱。
    data:
      items:
        - label: 市场机会
          value: 8
          note: $200B SMB TAM，$1.5T 全球企业差旅；顺风强劲
        - label: 产品差异化
          value: 7
          note: 一体化 T&E 独特；25+ 个 NDC；服务质量隐忧压低评分
        - label: 财务增长
          value: 8
          note: 连续 2 年 50%+ CAGR；EBITDA 盈亏平衡；预订量 $2.5B+
        - label: 竞争护城河
          value: 6
          note: 欧洲 SMB 领先；并入 AmTrav 后美国护城河尚未验证
        - label: 毛利 / 单位经济
          value: 4
          note: 毛利率未披露；NRR 未知；透明度显著不足
        - label: 估值纪律
          value: 4
          note: 13x 收入较同业偏高；安全边际有限
        - label: 证据质量
          value: 5
          note: 无审计财务；仅有管理层 KPI；Trustpilot 出现反向信号
    approximationNotes: 评分为分析师基于截至 2026 年 5 月可得公开证据的判断。如果披露审计财务和 NRR 数据，毛利 / 单位经济和证据质量评分会显著上升。
    claimRefs:
      - CV013
      - CV022
      - CV035
      - CV036
