      - number: '7.4'
        title: 财务与资本风险
        blocks:
          - type: paragraph
            body: >
              TravelPerk 的财务风险来自激进收购计划与刚刚实现盈利之间的张力。公司到 end-2024 才达到 EBITDA 盈亏平衡，留存收益缓冲很薄，难以吸收七个月内两项重大收购的整合成本：AmTrav（June
              2024，由 Blackstone 和 Blue Owl 提供 $135M 债务融资）和 Yokoy（January 2025，全股）。Blackstone/Blue Owl
              债务工具条款完全未披露，是优先尽调缺口。January 2025 Series E 对 TravelPerk 的估值为 $2.7 billion，是 January 2024 $1.4 billion
              估值的两倍多，内含高增长预期；若收入增速从 50%+ 持续放缓，下一轮融资可能触发降估值融资，削弱用于留住 Yokoy 和 AmTrav
              人才的股权激励包。股权结构表目前包括八家主要机构投资者，回报时间表各不相同——SoftBank、General Catalyst、Kinnevik、Atomico、EQT、Blackstone、Blue Owl
              和 Sequoia；在公司承认不急于 IPO 的情况下，早期投资者面临更长持有期，可能在增长与盈利取舍上制造董事会张力。FlexiTravel 的 80%
              取消退款保证形成类似保险的财务负债，未见披露的准备金或保险工具对冲。
