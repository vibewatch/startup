  - id: TM004
    title: 增长驱动因素与采纳制约
    columns:
      - 因素
      - 类型
      - 方向
      - 时间
      - 对 TMS 采纳的含义
      - 尽调问题
    rows:
      - - 新冠后市场复苏超过疫情前峰值
        - 驱动因素
        - 正向
        - 2024 — 持续
        - TAM 扩大、预算空间增加；更多公司重新启用或升级差旅项目
        - GBTA 发布后，将 2026 BTI 实际值与 IATA 登机数据交叉验证
      - - AI 辅助预订采纳（2026 年 71% 项目 vs 2024 年 34%）
        - 驱动因素
        - 正向
        - 当前 — 加速
        - 提高企业为 AI 驱动 SaaS TMS 付费的意愿；让 Perk 区别于传统 TMC 工具
        - 在平台队列数据中衡量 AI 预订推荐带来的转化率提升
      - - EU CSRD Scope 3 差旅排放报告要求
        - 驱动因素兼合规制约
        - 正向（需求）和负向（合规负担）
        - 2024 年 1 月生效；2025 年首次申报
        - 现在 64% 的项目在 RFP 中要求排放数据；绿色功能从差异化卖点变成入场门槛
        - 确认 Perk 哪些 EU 客户细分落入 CSRD 强制适用范围
      - - NDC 采纳超过间接航空内容的 30%（2026 年 Q1）
        - 驱动因素
        - 正向
        - 当前 — 增长
        - 接入 NDC 的平台能展示更丰富票价，减少用户流向消费者网站；切换成本也随之上升
        - 审计 Perk NDC 集成深度，并比较 NDC 与 GDS 预订占比
      - - 传统 ERP 和 HRIS 集成缺口
        - 制约因素
        - 负向
        - 持续存在
        - 拖慢企业交易周期；中型市场在财务批准前需要接上 Workday、NetSuite、SAP 或 Xero 的 API 连接器
        - 统计 Perk 平台开箱即用的 ERP 连接器数量，并与 Concur 和 Navan 对比
      - - 消费者网站预订外流（“影子预订”）
        - 制约因素
        - 负向
        - 持续存在
        - 56% 的差旅者至少会把部分行程订在企业工具之外；费用数据被切碎，合规率下降
        - 衡量 Perk 平台的合规预订率，并与上线前基线对比
      - - 差旅中断率（2024 年 78% 差旅者受影响）
        - 驱动因素兼风险
        - 正向（FlexiPerk 需求）和负向（员工体验）
        - 持续
        - '高频中断验证 FlexiPerk 和 24/7 改签服务的价值；中断处理差，是用户离开 TMS 的 #1 触发因素'
        - 跟踪 Perk FlexiPerk 使用率，以及相对非 FlexiPerk 预订的 NPS 变化
      - - 商务 + 休闲常态化（2024 年 56% 差旅者延长行程用于休闲）
        - 驱动因素
        - 正向
        - 当前 — 增长
        - 平均行程变长，单次预订的酒店和机票 GBV 增加；但政策和保险复杂度也上升
        - 评估 Perk 的 bleisure 政策拆分工具，并衡量平均预订时长趋势
    notes: >-
      驱动因素和制约因素来自 GBTA、Perk 一手研究、Travel-Code（引用 AmexGBT）、IATA 和 EU Commission 来源。时间判断反映 2026 年状态。“驱动因素兼制约因素”行涵盖对 TMS
      市场有双重影响的因素。
    claimRefs:
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
      - CM040
      - CM041
      - CM042
