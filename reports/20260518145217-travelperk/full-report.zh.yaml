      - number: '1.5'
        title: 收购、里程碑与反向信号
        blocks:
          - type: paragraph
            body: >
              自 2020 年以来，Perk 完成了六起战略收购，每一起都瞄准明确的地理或能力缺口：Albatross（2020 年 7 月，差旅风险管理 API，也是公司首次收购）、NexTravel（2021 年 1
              月，美国企业差旅平台）、Susterra（2021 年，碳抵消管理）、Click Travel（2021 年，英国最大的商务差旅平台，拥有 2,000 多家中小企业客户，年预订额约 £300
              million）、AmTrav（2024 年 6 月，总部位于 Chicago 的美国企业差旅公司，有 30 年历史和超过 1,000 家企业客户），以及 Yokoy（2025 年 1 月，瑞士 AI 费用 /
              发票 / 企业卡平台，拥有 700 多家企业客户）。这些收购呈现清晰的双轨并购整合策略：一条是地理扩张（NexTravel、Click Travel、AmTrav），另一条是平台延展（Albatross
              补风险能力，Yokoy 补费用能力）。COVID-19 疫情期间，公司坚持零裁员，保住工程人才。Trustpilot 客户评价呈现复杂图景：截至 2025 年中，平台评分为
              3.2/5（“一般”），反复出现的投诉集中在 FlexiPerk 政策模糊、相对直接预订价格优势有限、客户支持响应度不足。鉴于 Perk
              的差异化建立在用户体验优越性上，这些风险具有商业实质。AmTrav、Yokoy 以及纳入统一 Perk 品牌的 Click Travel
              三项重大收购同时整合，构成不小的运营和文化整合挑战，公开记录尚未充分解释公司如何消化。
