  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台模块与客户工作流
        blocks:
          - type: paragraph
            body: >
              TravelPerk 提供统一的商务差旅与支出管理平台，覆盖六类场景：航班、酒店、铁路、租车、费用管理和活动。借 Yokoy 收购推出的 "Connected Travel & Spend"
              品牌，平台把自己定位为企业差旅端到端生命周期方案。航班模块同时连接传统 GDS（Amadeus、Sabre）和 NDC 航司连接；截至 October 2025，NDC 连接超过 25 个，NDC
              内容占全球预订超过 40%、欧洲预订超过 50%。铁路模块到 2023 年已占平台行程的 33%（2019 年为 17%），部分由 SilverRail 合作推动，后者补上了美国 Amtrak
              覆盖。FlexiTravel 附加服务允许出发前两小时内取消，并保证 80%+ 退款和不过期额度，资金来自按预订金额收取的溢价。GreenPerk 在 March 2020 推出，为每笔预订接入由
              VERRA、Gold Standard 和 Puro.earth 认证的 Atmosfair 碳抵消，使 TravelPerk 较早切入可持续差旅工具。Events 模块在 January 2026
              推出，把平台延伸到 9 至 5,000 人的团体活动，用 AI 驱动规划能力，源自 2024 年创立的 Real Work Incubator 项目。所有场景合计，预订引擎在 2024 年达到每 7.5
