  - id: scenario-analysis
    title: Scenario Analysis
    body: >-
      Three scenarios are modelled based on different assumptions about revenue growth trajectory
      margin improvement and exit multiple. All scenarios assume a 3-year forward horizon (exit
      in 2028-2029) from the January 2025 Series E entry point.

      The bull case assumes TravelPerk sustains 45-50% compound annual revenue growth through US
      expansion Yokoy cross-sell and continued European market penetration reaching $550-620M
      in revenue by 2027-28. In this scenario disclosed gross margins exceed 50% and the company
      files for IPO or completes a strategic sale at 15-18x forward revenue implying an enterprise
      value of $8-10B. Probability signal is low-to-medium; it requires Navan not to achieve a
      competing IPO first the US market to ramp rapidly after AmTrav integration and customer
      satisfaction issues to be resolved.

      The base case assumes growth decelerates to 30-35% CAGR as the company scales reaching
      $380-420M in revenue. A PE-led secondary buyout or strategic acquisition by a travel
      technology conglomerate (Amadeus Sabre Booking Holdings) occurs at 10-12x revenue
      implying $3.8-5.0B enterprise value. Entry at $2.7B implies a 1.4-1.9x return at exit
      with upside from carry on warrants and the fact that Yokoy was acquired in an all-equity deal
      that added zero cash cost to the round. Probability signal is medium.

      The bear case assumes macro headwinds compress SMB travel budgets customer churn
      accelerates due to service quality issues documented in Trustpilot reviews and Navan wins
      the US SMB market with superior AI tooling. Revenue growth drops to 15-20% CAGR reaching
      only $270-300M by 2027-28. Multiple compression to 6-7x implies an enterprise value of
      $1.7-2.1B a meaningful loss from the $2.7B entry point. Probability signal is low but
      non-trivial given lack of disclosed unit economics.
