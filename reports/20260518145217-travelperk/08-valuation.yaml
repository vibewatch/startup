  - id: exit-readiness-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >-
      TravelPerk investor base including EQT Growth Atomico Kinnevik General Catalyst SoftBank
      Vision Fund and Blackstone represents a high-quality syndicate with both the capital and
      relationships to support an IPO or large M&A process. Kinnevik has held a stake since 2018
      signalling long holding-period comfort while Atomico and EQT bring direct experience with
      European technology IPOs. Sequoia joining via the Yokoy all-equity deal adds a US-focused
      investor who could facilitate a NASDAQ listing.

      The company was incorporated as an active private limited company (PERK UK LTD formerly
      TravelPerk UK IRL Limited formerly Click Travel Ltd) at UK Companies House (number 03770815)
      with accounts last made up to 31 December 2024. Audited UK accounts if made public would
      provide the first independent verification of the revenue and EBITDA figures management has
      cited. The next accounts are due by 30 September 2026.

      The primary diligence ask is gross margin disclosure. Without it investors cannot determine
      whether TravelPerk is a high-margin SaaS platform (40-60% gross margin) or a lower-margin
      marketplace/intermediary (15-30% gross margin). This single variable changes the valuation
      range by a factor of two. Secondary asks include NRR/churn data (the Trustpilot evidence
      suggests retention risk) post-acquisition metrics for AmTrav and Yokoy and a detailed
      breakdown of the $731M total raised by round to understand the preference overhang.

      The rebranding from TravelPerk to Perk announced in 2025 is a strategic signal that the
      company intends to position itself as a broader business-spend platform rather than a travel
      tool consistent with the Yokoy acquisition. This expands the exit universe to include
      fintech and expense management acquirers (SAP Coupa Workday) in addition to travel technology
      buyers. Exit readiness is high on process infrastructure; the key gate is gross margin and
      NRR disclosure to support a premium multiple at IPO or in a competitive M&A process.
    claimRefs:
