company:
  name: TravelPerk
chapter:
  number: 8
  title: Valuation
  summary: >-
    TravelPerk January 2025 Series E raised $200M at a $2.7B valuation approximately 13x its
    annualised revenue of more than $200M which is a meaningful premium to profitable SaaS peers
    but arguably justified by 50%+ two-year revenue CAGR and EBITDA break-even. The base-case
    recommendation is Buy with discipline: the price is stretched but the growth profile integrated
    T&E platform post-Yokoy and underpenetrated SMB market create a credible path to a 3-5x return
    on an IPO or strategic exit at a $4-5B valuation. Gross-margin opacity undisclosed NRR and
    mounting customer-service complaints are material risks that compress conviction.

sections:
  - id: investment-thesis-context
    title: Investment Thesis and Financing Context
    body: >-
      TravelPerk closed a $200M Series E in January 2025 led by Atomico and EQT Growth with
      Noteus Partners and Sequoia Capital joining as new investors alongside continuing shareholders
      General Catalyst Kinnevik SoftBank Vision Fund and Blackstone. The oversubscribed round
      nearly doubled the company valuation to $2.7B. Total capital raised across all rounds stands
      at approximately $731M per Dealroom data.

      The investment thesis rests on four pillars. First the global corporate travel market is
      estimated at $1.5 trillion (2024) with a $200B SMB and mid-market sub-segment in the US and
      Europe that legacy TMCs have chronically underserved. TravelPerk targets precisely this segment
      with a product-led self-serve motion that incumbent Concur and BCD Travel cannot replicate
      quickly. Second the Yokoy acquisition (closed January 2025 all-equity Sequoia now on cap
      table) adds AI-powered expense invoice and card-processing capability to create a genuine
      end-to-end T&E platform eliminating the buy-integrated-or-buy-best-of-breed trade-off for
      SMBs. Third TravelPerk reached EBITDA break-even at end of 2024 while posting 50%+ annual
      revenue growth for two consecutive years a rare combination. Fourth the AmTrav acquisition
      (June 2024) provides a US beachhead and cross-sell surface into the world largest corporate
      travel market.

      The anti-thesis is equally important. TravelPerk has not disclosed GAAP-equivalent audited
      financials gross margins or NRR so every valuation model rests on management-provided KPIs.
      Trustpilot reviews from 2025 document a pattern of slow customer-service response pricing
      not materially better than direct booking and difficulty changing reservations signals that
      the product premium may be narrowing. Navan is well-capitalised with $6B+ in annual GBV
      making the US expansion harder than management investor messaging implies. And the 13x revenue
      multiple leaves limited margin of safety if growth decelerates.
