  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        TravelPerk gross margin percentage has never been publicly disclosed. Audited financial
        accounts at UK Companies House (FY2024 accounts filed; FY2025 due September 2026) may
        provide partial data but consolidated group accounts covering all entities would be needed.
      whyItMatters: >-
        Gross margin determines whether TravelPerk deserves a SaaS-quality multiple (40-60%
        gross margin defensible 13x) or a booking-marketplace multiple (20-35% appropriate
        6-9x). This single unknown shifts the fair value range by $1B-$2B+.
      diligencePath: >-
        Request audited financial statements directly; alternatively wait for IPO S-1 filing
        or FY2025 UK Companies House accounts.
      relatedQuestionRefs:
        - QV019

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Net revenue retention (NRR) customer acquisition cost (CAC) and customer lifetime
        value (LTV) have not been disclosed in any public communication.
      whyItMatters: >-
        NRR above 110% would materially strengthen the investment case by confirming land-and-expand
        dynamics. Adverse Trustpilot reviews suggest retention risk. NRR below 90% would
        fundamentally undermine the bull case.
      diligencePath: >-
        Management presentation or commercial data room. Proxy measure is to track net new logo
        announcements and customer case study volumes over 12 months.
      relatedQuestionRefs:
        - QV017

    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        The detailed preference stack liquidation waterfall and anti-dilution provisions
        across the $731M raised are not publicly disclosed.
      whyItMatters: >-
        If senior preferred shares carry 1.5-2x liquidation preferences the effective
        entry price for common equity may be materially higher than $2.7B compressing
        returns for later-stage investors in a base or bear scenario.
      diligencePath: >-
        Legal data room; review investment agreements for each preferred round.
      relatedQuestionRefs:
        - QV017

    - type: enumeration-incomplete
      severity: minor
      topic: SaaS-comparables
      missingEvidence: >-
        No pure-play public SaaS TMC exists for direct multiple benchmarking. Navan revenue
        is estimated and its last disclosed valuation is several years old.
      whyItMatters: >-
        Without a clean comparable the 13x multiple argument rests on basket analysis
        rather than direct peer evidence.
      diligencePath: >-
        Monitor Navan IPO filings; track Amex GBT segment reporting for SMB metrics.
      relatedTableRefs:
        - TV004
      relatedQuestionRefs:
        - QV023

