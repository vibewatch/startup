  - id: valuation-comparables
    title: Valuation Framework and Comparable Analysis
    body: >-
      At the January 2025 Series E price TravelPerk carries a $2.7B enterprise value against
      annualised revenue exceeding $200M implying an EV/revenue multiple of approximately 13x. In
      the context of SaaS growth markets 13x is elevated but precedented for companies growing
      50%+ with positive EBITDA. The relevant question is not whether 13x is cheap in absolute
      terms but whether it is appropriate given the quality of the underlying business.

      Direct comparables are limited because every TMC peer of real scale is either publicly
      listed (Amex GBT at NYSE GBTG) embedded within a larger corporate (SAP Concur) or
      privately held with undisclosed economics (Navan BCD Travel CWT). Amex GBT 2024 revenue
      was approximately $2.4B at a market capitalisation that implies roughly 3x revenue but Amex
      GBT serves large enterprises with a fundamentally different operating model (high-touch
      people-intensive) so multiple compression versus TravelPerk product-led model is expected.
      Navan estimated 2024 GBV of $6.1B is not directly comparable to revenue but if Navan
      carries a 3-5% take rate estimated revenue would be $180-300M squarely in TravelPerk range
      yet Navan remains private with no disclosed valuation since its last round.

      Among SaaS T&E software companies growing 30-50% public market EV/revenue multiples in
      2024-2025 ranged approximately 8-20x depending on growth margin and path to profitability.
      TravelPerk 13x sits at the high end of the credible range for a company that has achieved
      EBITDA break-even but has not yet disclosed gross margins. If gross margins are in the
      40-55% range typical of SaaS-adjacent marketplaces the multiple looks defensible. If
      margins are lower as booking GTV-heavy models often produce the multiple compresses.
      This opacity is the single biggest quantitative risk to the investment case.
