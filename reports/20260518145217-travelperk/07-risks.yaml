  evidenceGaps:
    - topic: "Blackstone and Blue Owl Debt Facility Terms"
      type: private-evidence-only
      severity: material
      missingEvidence: >
        The full terms of TravelPerk's $135M debt facility — including principal repayment schedule, interest rate,
        maintenance covenants, leverage ratio tests, and any amendment or waiver history since June 2024 — are not
        publicly disclosed in any accessible source. TravelPerk press releases confirm the facility exists and name
        the lenders, but no term sheet or covenant summary is available.
      whyItMatters: >
        Debt covenant breach in a growth-deceleration or integration-cost-overrun scenario could trigger accelerated
        repayment at a time when TravelPerk needs capital flexibility, potentially forcing a dilutive equity raise or
        asset sale with negative signaling effects on the Yokoy and AmTrav integrations.
      diligencePath: >
        Request full loan agreement, current principal balance, covenant compliance certificate from CFO, and lender
        waiver history from TravelPerk management. Confirm whether the January 2025 Yokoy acquisition triggered any
        covenant renegotiation or lender consent process.
      relatedQuestionRefs:
        - QR008
        - QR015
      relatedTableRefs:
        - TR005

    - topic: "Active Litigation and Regulatory Enforcement Cases"
      type: missing-source
      severity: material
      missingEvidence: >
        No specific litigation cases, regulatory enforcement proceedings, or material claims involving Perk Platform
        SLU, Perk UK Ltd, or American Travel Solutions LLC were found in any accessible public source. The GDPRhub
        AEPD enforcement tracker was inaccessible (JavaScript-only rendering, bot protection); Spanish civil court
        databases and the ICO case decisions database were not searched at URL level.
      whyItMatters: >
        Active enforcement proceedings or employment tribunal claims could affect valuation, partner trust, and IPO
        readiness. The absence of evidence from inaccessible databases is not evidence of absence given TravelPerk's
        scale and multi-jurisdiction operational footprint.
      diligencePath: >
        Request management litigation disclosure schedule covering all TravelPerk entities. Commission bespoke legal
        searches of the AEPD enforcement register, ICO case decisions database, UK Employment Tribunal, Spanish courts,
        and US PACER for AmTrav-related proceedings, and Gibraltar and Malta financial services registers.
