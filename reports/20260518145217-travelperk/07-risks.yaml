  - id: mitigations-kill-criteria
    title: "Mitigations, Monitoring Indicators, and Thesis-Break Criteria"
    body: >
      TravelPerk has established meaningful but incomplete mitigations across its primary risk vectors. On data
      protection: the dual-entity structure (separate EEA and UK legal entities with distinct DPA agreements)
      provides jurisdictional containment. ISO 27001-aligned controls, SOC Type 2 certification, dedicated
      security operations including phishing simulations, endpoint detection, third-party vendor audits, and CIIS
      membership provide a certified baseline. On operational risk: the Albatross acquisition added travel risk
      intelligence to the platform; International SOS backs TravelCare emergency assistance at scale; and
      AI-powered customer care doubled query throughput without headcount growth in 2024. FlexiTravel's 80%
      (not 100%) refund cap limits per-claim liability. On GDS/NDC risk: TravelPerk's multi-product depth
      (booking plus Yokoy expense plus Perk Finance cards plus safety) creates high switching costs that partially
      hedge inventory channel risk. On financial risk: the $200M Series E provides liquidity cushion; EBITDA
      break-even is achieved; and Yokoy was acquired all-equity preserving cash headroom. The primary unmitigated
      financial risk is the undisclosed Blackstone/Blue Owl debt covenant structure. The following table defines
      monitoring indicators and thesis-break criteria that should trigger investor reassessment.
    claimRefs:
      - CR015
      - CR017
      - CR018
