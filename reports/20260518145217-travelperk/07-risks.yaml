  - id: partner-dependency-risk
    title: "Partner and Supply-Chain Risk"
    body: >
      TravelPerk's inventory access is structurally dependent on Global Distribution System intermediaries —
      principally Amadeus, Sabre, and Travelport — for flight content from hundreds of airlines. If airlines
      accelerate NDC-based direct distribution and reduce GDS content parity, TravelPerk risks losing access to
      the comprehensive corporate fare inventory that differentiates it from consumer booking tools. IATA's NDC
      standard is now adopted by a majority of major airlines, enabling them to distribute personalized pricing
      directly to buyers. Several carriers have introduced GDS surcharges or reduced fare parity, creating a
      credible medium-term path toward partial GDS obsolescence. TravelPerk has not publicly disclosed its NDC
      coverage percentage or the share of bookings already sourced via NDC channels. Perk Finance card operations
      depend on two single-source partners: Transact Payments Malta (EEA, Malta FSA-regulated) and Transact
      Payments Limited (UK, Gibraltar FSC-regulated). No backup card-program managers are disclosed; loss of
      either license or partner would suspend Perk Finance in the relevant geography. International SOS dependency
      for TravelCare duty-of-care creates a similar concentration risk for the safety proposition. The demand side
      is equally exposed: TravelPerk's 9% booking volume growth as of early 2026 remains sensitive to geopolitical
      events — Middle East instability drove a 28% spike in voluntary international cancellations and a 68% rise
      in China travel costs — and to corporate travel policy tightening in a recession.
