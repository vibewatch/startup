    - topic: "Customer Revenue Concentration by Segment"
      type: private-evidence-only
      severity: material
      missingEvidence: >
        TravelPerk has not disclosed its customer count breakdown or revenue split across SMB, mid-market, and
        enterprise segments, nor its geographic revenue distribution. With over $200M ARR and more than 10,000
        customers implied by public statements, average ACV of approximately $20,000 suggests mid-market focus,
        but no primary source confirms this.
      whyItMatters: >
        High SMB concentration amplifies recession sensitivity as SMB travel spend contracts faster and more deeply
        in downturns, and SMB customers have lower switching costs. High enterprise concentration implies longer sales
        cycles, higher RFP costs, and the risk of outsized impact from a few large contract losses.
      diligencePath: >
        Request from management: total customer count, revenue and GTV by segment tier (SMB, mid-market, enterprise),
        top-10 customer revenue concentration as percentage of total ARR, and geographic revenue breakdown. Compare
        ACV distribution with SAP Concur, Navan, and Egencia estimated segment profiles.
      relatedQuestionRefs:
        - QR021
