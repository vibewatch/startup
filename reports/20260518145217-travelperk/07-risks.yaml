  - id: financial-model-risk
    title: "Financial and Capital Risk"
    body: >
      TravelPerk's financial risk profile is shaped by the tension between its ambitious acquisition program and
      its only-recently-achieved profitability. The company reached EBITDA break-even only at end-2024, providing
      minimal retained earnings buffer to absorb integration costs from two material acquisitions in seven months:
      AmTrav (June 2024, debt-funded with $135M from Blackstone and Blue Owl) and Yokoy (January 2025, all-equity).
      The Blackstone/Blue Owl debt facility terms are entirely undisclosed, representing a priority diligence gap.
      The January 2025 Series E valued TravelPerk at $2.7 billion — more than double the January 2024 $1.4 billion
      valuation — embedding high growth expectations; any sustained deceleration from 50%+ revenue growth could
      trigger a down-round at the next financing event, impairing the equity compensation packages used to retain
      Yokoy and AmTrav talent. The cap table now includes eight major institutional investors with differing return
      timelines — SoftBank, General Catalyst, Kinnevik, Atomico, EQT, Blackstone, Blue Owl, and Sequoia — and with
      no IPO rush acknowledged, early investors face a prolonged hold period that may generate board tension around
      growth versus profitability trade-offs. FlexiTravel's 80% cancellation refund guarantee creates an
      insurance-like financial liability not hedged by any disclosed reserve fund or insurance instrument.
