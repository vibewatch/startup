callouts:
  - calloutType: insight
    title: "GDPR Enforcement Risk: Material but Not Existential"
    body: >
      GDPR maximum fine exposure of approximately $8M (4% of $200M ARR) is material but not existential; the more
      significant risk is reputational. A public enforcement action by AEPD or ICO would be prominently disclosed
      and scrutinized by enterprise customers in regulated sectors, potentially triggering churn among
      financial-services and healthcare TMC clients — TravelPerk's highest-value segment.
    sourceRefs:
      - SR001
      - SR002
      - SR016
      - SR018
    claimRefs:
      - CR003
      - CR004
      - CR007

  - calloutType: insight
    title: "M&A Integration: Compounding Execution Risk"
    body: >
      TravelPerk's three-acquisition program over six years is unusually ambitious for a company that only reached
      EBITDA break-even at end-2024. Integration of three product stacks, four workforce jurisdictions, and three
      compliance regimes simultaneously creates compounding execution risk that is not captured in headline financial
      metrics such as ARR growth or booking volume.
    sourceRefs:
      - SR003
      - SR005
      - SR006
      - SR007
    claimRefs:
      - CR031
      - CR033
      - CR034
      - CR038

  - calloutType: insight
    title: "Single-Cloud Concentration — Primary Single Point of Failure"
    body: >
      Single-cloud concentration on AWS Ireland is TravelPerk's most acute single-point-of-failure risk: a prolonged
      AWS Ireland availability event would halt booking, expense, card operations, and customer care simultaneously
      with no documented secondary cloud fallback or geographic redundancy.
    sourceRefs:
      - SR017
    claimRefs:
      - CR014

  - calloutType: risk
    title: "Undisclosed Debt Covenants: Priority Diligence Gap"
    body: >
      The Blackstone and Blue Owl $135M debt facility terms are entirely undisclosed — including covenants, interest
      rate, maturity, and amortization schedule. In a growth-deceleration scenario, a covenant breach could force a
      capital raise at disadvantageous terms concurrent with multi-entity integration spending. This is a priority
      diligence gap requiring direct management disclosure.
    sourceRefs:
      - SR004
      - SR005
    claimRefs:
      - CR024
      - CR028

  - calloutType: risk
    title: "GDPRhub Access Blocked: Active AEPD Proceedings Unverifiable"
    body: >
      GDPRhub enforcement tracking of AEPD cases was inaccessible via automated fetch due to JavaScript rendering
      requirements and bot-protection. Active AEPD enforcement proceedings against TravelPerk entities, if any exist,
      could not be verified from public sources and require bespoke legal diligence of the AEPD case register.
    sourceRefs:
      - SR029
      - SR030
    claimRefs:
      - CR006
      - CR039

  - calloutType: strength
    title: "Multi-Product Switching Costs Partially Hedge GDS Risk"
    body: >
      TravelPerk's multi-product depth (booking plus Yokoy expense plus Perk Finance cards plus safety via TravelCare)
      creates high switching costs that partially hedge GDS and NDC content risk: customers who have adopted Perk
      Finance and Yokoy expense tools have substantially higher exit costs than single-product TMC users, insulating
      the business from rapid competitor migration even in a GDS content-degradation scenario.
    sourceRefs:
      - SR006
      - SR027
    claimRefs:
      - CR029
      - CR031

  - calloutType: insight
    title: "CSRD and DORA Compliance as Pull-Market Opportunity"
    body: >
      CSRD and DORA compliance pressure on enterprise customers creates a pull-market for TravelPerk's data-rich
      platform: companies that must report Scope 3 emissions or demonstrate T&E digital resilience under DORA will
      prefer an integrated TMC plus expense platform that provides audit-quality data trails over fragmented point
      solutions requiring manual data reconciliation.
    sourceRefs:
      - SR010
    claimRefs:
      - CR010
      - CR020

  - calloutType: assumption
    title: "Evidence Gap Acknowledgment: Debt, Litigation, and Concentration"
    body: >
      Research questions QR008 (debt covenant terms), QR020 (active litigation or enforcement proceedings), and
      QR021 (customer revenue concentration by segment) could not be answered from publicly available sources.
      Three evidence gaps are documented in localEvidence.evidenceGaps below. These items require direct management
      disclosure in any formal investment or audit process.
    sourceRefs: []
    claimRefs: []

