chapter:
  number: 7
  title: "Risks"
  summary: >
    TravelPerk's risk profile is materially shaped by four interlocking forces: multi-jurisdiction data-protection
    exposure (GDPR/AEPD in Spain and ICO/UK-GDPR in the UK, with Swiss nDSG following the Yokoy acquisition),
    operational concentration on third-party GDS inventory and a single AWS Ireland cloud deployment, an aggressive
    three-acquisition M&A program (Albatross 2020, AmTrav 2024, Yokoy 2025) executed while only reaching EBITDA
    break-even at end-2024, and medium-term competitive disruption risk from AI travel agents and NDC-driven GDS
    disintermediation. GDPR maximum fines (4% of global annual revenue) represent an approximately $8M statutory
    ceiling at current $200M+ ARR; the $135M Blackstone/Blue Owl debt facility adds financial covenants and limits
    the capital cushion available for integration setbacks. Mitigations include ISO 27001-aligned security controls,
    SOC Type 2 certification, the Albatross travel-risk acquisition, and dual-entity fintech licensing; however,
    three unresolved diligence gaps — public litigation history, segmented revenue concentration, and debt covenant
    terms — require direct management disclosure.

sections:
  - id: regulatory-legal-risk
    title: "Regulatory and Legal Risk"
    body: >
      TravelPerk operates across three distinct data-protection regimes simultaneously: Spanish GDPR under AEPD
      supervision (Perk Platform SLU, Barcelona), UK GDPR under ICO supervision (Perk UK Ltd, London), and —
      following the January 2025 Yokoy acquisition — Swiss nDSG under FDPIC oversight (Yokoy AG, Zurich). Each
      regime carries its own notification deadlines, data subject rights obligations, and enforcement posture,
      requiring TravelPerk to maintain three parallel compliance programs rather than a single unified framework.
      The AEPD is among the most active EU data protection authorities by enforcement volume. Its 2026 activity
      indicates ongoing inspection programs targeting AI-based automated decisions and profiling for marketing
      purposes, both directly relevant to TravelPerk's AI booking recommendations and marketing campaigns. The
      ICO maintains a publicly accessible enforcement register showing regular monetary penalty notices against
      data controllers for security failures and unlawful processing; Perk UK Ltd falls squarely within its
      jurisdiction. Under GDPR Article 83(5), fines for the most serious violations — breaches of basic processing
      principles in Article 5 or violations of data subjects' rights under Articles 12–22 — reach EUR 20 million
      or 4% of worldwide annual turnover. At TravelPerk's $200M+ ARR, the 4% ceiling equates to approximately
      $8 million. This is a material but non-existential fine amount; the more significant risk is the reputational
      and customer-trust impact of a public enforcement action. TravelPerk processes sensitive personal data at
      volume: travel itineraries, passport numbers, payment card details, and health or dietary information for
      special assistance. As both a data controller (for marketing and employees) and a data processor (for
      corporate customer traveler data), TravelPerk must maintain two distinct compliance postures and two sets
      of data processing agreements. Cross-border data flows between Perk Platform SLU (EU) and American Travel
      Solutions LLC (US, AmTrav) require Standard Contractual Clauses or equivalent mechanisms under the applicable
      EU-US data transfer framework. Two EU-origin regulatory frameworks impose further obligations: CSRD requires
      TravelPerk's enterprise customers to report Scope 3 travel emissions, mandating audit-quality carbon data at
      the booking level; DORA (effective January 2025) requires financial-services customers using Perk Finance or
      Yokoy expense tools to verify TravelPerk's ICT resilience and third-party risk management program.
