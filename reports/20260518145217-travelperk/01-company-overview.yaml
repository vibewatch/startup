  - id: acquisitions-and-milestones
    title: "Acquisitions, Milestones, and Adverse Signals"
    body: >
      Perk has executed six strategic acquisitions since 2020, each targeting specific geographic or capability
      gaps: Albatross (July 2020, travel risk management API—the company's first acquisition), NexTravel
      (January 2021, US corporate travel platform), Susterra (2021, carbon-offset management), Click Travel
      (2021, UK's largest business travel platform, 2,000-plus SME clients handling approximately £300 million
      in annual bookings), AmTrav (June 2024, Chicago-based US corporate travel with 30-year history and more
      than 1,000 business customers), and Yokoy (January 2025, Swiss AI-powered expense/invoice/card platform
      with 700-plus enterprise customers). The acquisitions follow a clear dual-track roll-up strategy:
      geographic expansion (NexTravel, Click Travel, AmTrav) combined with platform extension (Albatross
      for risk, Yokoy for expense). The company adopted a zero-layoff policy throughout the COVID-19 pandemic,
      preserving engineering talent. Customer reviews on Trustpilot reveal a mixed picture: the platform
      carries a 3.2 out of 5 rating ("Average") as of mid-2025, with recurring complaints about FlexiPerk
      policy ambiguity, limited price advantages over direct booking, and customer support responsiveness—risks
      that are material given Perk's differentiation is predicated on user experience superiority. The concurrent
      integration of three major acquisitions (AmTrav, Yokoy, and Click Travel under the unified Perk brand)
      represents a meaningful operational and cultural integration challenge that the public record does not yet
      fully address.
