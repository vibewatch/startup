  - id: founders-and-leadership
    title: "Founders, Leadership, and Governance"
    body: >
      Perk was co-founded in 2015 by Avi Meir (CEO), Javier Suarez, and Ron Levin. Avi Meir, who previously
      sold a company to Booking.com, has led the business since inception and is widely credited with its
      growth strategy, including a zero-layoff policy throughout the COVID-19 pandemic that preserved
      engineering and product capabilities while rivals contracted. Jean-Christophe (JC) Taunay-Bucalo
      serves as President and COO, driving global expansion strategy; Roy Hefer joined as CFO in July 2022
      bringing experience from two technology IPOs and prior roles at McKinsey and Hippo Insurance; Nikita
      Miller joined as Chief Product Officer in September 2025 from The Knot Worldwide and Trello; and
      Robin Smith, a 20-year travel technology veteran, was promoted to Chief Technology Officer in September
      2025. The board is composed of representatives from major investors alongside independent directors.
      Hillary Ball (Atomico) and Carolina Brochado (EQT Growth) joined the board following the January 2025
      Series E. Gillian Tans, former CEO and Chairwoman of Booking.com, joined as an independent director
      in January 2022, bringing deep industry expertise. Joel Cutler (General Catalyst) and Stephen Thorne
      (SoftBank Investment Advisers) represent institutional investors. Eliran Glazer, CFO of monday.com
      (NASDAQ: MNDY), was appointed Chair of the Audit Committee in November 2024, adding public-company
      governance experience as the company approaches potential capital markets readiness. Leadership
      concentration on CEO Avi Meir—who has led every major fundraising, M&A transaction, and strategic
      pivot since founding—remains a material key-person risk that is unhedged by succession-planning
      disclosures in the public record.
