chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Perk (formerly TravelPerk), founded in Barcelona in 2015 by Avi Meir, Javier Suarez, and Ron Levin,
    is a late-stage SaaS unicorn delivering integrated travel and expense management to SMB and mid-market
    businesses globally. As of January 2025 the company reported annualized revenue exceeding $200 million,
    a $2.7 billion Series E valuation, and EBITDA break-even following a rapid post-COVID rebound and six
    strategic acquisitions—most recently Yokoy—cementing its position as a full T&E platform.

sections:
  - id: identity-and-product
    title: "Company Identity and Product Platform"
    body: >
      Perk (formerly TravelPerk) is a Barcelona-based SaaS company providing an integrated travel and
      expense management platform for SMB and mid-market businesses worldwide. Founded in 2015, the
      company offers access to what it describes as the world's largest bookable travel inventory—comprising
      flights, hotels, trains, rental cars, and apartments sourced from major providers including Booking.com,
      Expedia, and Airbnb—through a single unified interface that gives travelers consumer-grade freedom
      while providing finance teams and travel managers centralised control over spend and policy compliance.
      On its 10th anniversary, March 31, 2025, the company formally rebranded from TravelPerk to Perk,
      reflecting its evolution beyond pure travel booking into a broader travel and expense (T&E) management
      platform. The rebrand, developed with brand consultancy Wolff Olins, introduced a new "Perk Green"
      visual identity distinct from the corporate-blue palette common in the industry. Headquartered in
      Barcelona's 22@ innovation district (Carrer dels Almogàvers, 160), Perk also operates offices in
      London, and across the United States in Boston, Chicago, Los Angeles, and Miami. The platform's core
      product lines include FlexiPerk (flexible cancellation with at-least-80% refund guarantee), GreenPerk
      (carbon-footprint tracking and offsetting), TravelCare (real-time travel risk management), and—following
      the January 2025 acquisition of Yokoy—AI-powered expense, invoice, and card-payment management. The
      company's stated mission is to enable businesses to manage end-to-end travel and spend in one automated
      platform, with 24/7 multilingual customer support. Target customers are SMB and mid-market companies
      in Europe and the United States.
