  - id: business-scale-and-performance
    title: "Business Scale, Metrics, and Customer Traction"
    body: >
      As of January 2025, Perk reported annualized revenue exceeding $200 million and annualized booking
      volumes surpassing $2.5 billion, with revenue growing at more than 50% per annum over the preceding
      two years. The company's gross margin reached approximately 72% by 2025, and it achieved EBITDA
      break-even at the end of 2024—a milestone representing a rare combination of growth and profitability
      at scale in the SaaS sector. Gross profit grew more than 90% year-over-year in fiscal year 2023, driven
      by AI-powered automation of customer-care operations. Perk serves over 10,000 business customers
      globally as of September 2025, including Red Bull, Revolut, Wise, Adyen, GetYourGuide, Aesop, On
      Running, Breitling, Fujifilm, and Nord Security. The company employed approximately 1,500 full-time
      staff as of mid-2025. Revenue declined sharply—estimated at roughly 80 to 90 percent from peak—during
      the COVID-19 travel standstill of 2020 to 2021, before recovering to approximately five times
      pre-COVID levels by early 2025. Travel Weekly's 2025 Power List reports 2024 gross bookings of
      $2.22 billion, providing independent corroboration of the company's volume figures. Perk's
      differentiation rests on its broad travel inventory, AI automation, and flexible FlexiPerk policy
      rather than price discount, which creates a value-perception gap that is visible in mixed customer
      reviews. US revenue grew 65% year-over-year in 2023 and approximately doubled following the AmTrav
      acquisition in June 2024, positioning the US as the company's top revenue-generating region.
