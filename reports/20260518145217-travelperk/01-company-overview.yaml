  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: "Full capitalization table including ownership percentages, liquidation preferences, and anti-dilution provisions for each investor class."
      whyItMatters: "Ownership concentration and liquidation stack materially affect the risk/return profile for any new investor or acquirer and cannot be assessed without disclosure."
      diligencePath: "Request cap table and shareholder agreement from Perk directly in due diligence; cross-reference with Companies House filings for UK subsidiary."
      relatedQuestionRefs:
        - QO006
        - QO027

    - type: private-evidence-only
      severity: material
      topic: revenue-by-geography
      missingEvidence: "Explicit revenue breakdown by geography (US vs. Europe vs. rest of world) for the 2024 and 2025 fiscal years."
      whyItMatters: "With the US targeted as the top growth market and AmTrav/Yokoy integrations underway, the geographic revenue mix is critical to assessing expansion risk and momentum."
      diligencePath: "Request management accounts or investor reporting package; review AmTrav and Yokoy integration financial disclosures."
      relatedQuestionRefs:
        - QO026

    - type: missing-source
      severity: material
      topic: regulatory-legal
      missingEvidence: "Any specific regulatory enforcement actions, GDPR investigations, or legal proceedings naming Perk or TravelPerk as respondent."
      whyItMatters: "As a data processor for millions of business traveler itineraries across EU and US jurisdictions, Perk's regulatory exposure under GDPR and US privacy law is non-trivial; no specific action was found in available public sources."
