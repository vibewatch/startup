callouts:
  - calloutType: strength
    title: "Profitable Growth at Scale"
    body: >
      Perk reached EBITDA break-even at end of 2024 while sustaining more than 50% revenue growth per
      annum, reporting a 72% gross margin and >90% gross profit growth in FY2023. This combination of
      scale, margin, and profitability is rare among late-stage SaaS unicorns and meaningfully de-risks
      the Series E valuation.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO030

  - calloutType: risk
    title: "Customer Experience Gap and Adverse Reviews"
    body: >
      Despite strong financial metrics, Perk carries a 3.2/5 ("Average") rating on Trustpilot with
      recurring complaints about FlexiPerk policy ambiguity, no price advantage over direct booking, and
      customer support responsiveness. Because Perk's differentiation is anchored to user experience
      rather than price, this customer perception gap is a material commercial risk and warrants attention
      in go-to-market and product investment decisions.
    claimRefs:
      - CO041
      - CO042
      - CO047

  - calloutType: risk
    title: "CEO Key-Person Concentration"
    body: >
      Avi Meir has led every major strategic decision—fundraising rounds, acquisitions, product pivots,
      and the COVID zero-layoff policy—since the company's founding in 2015. No public succession plan
      or deputy-CEO structure has been disclosed. At a $2.7 billion valuation with six acquired entities
      to integrate, key-person risk is a diligence imperative.
    claimRefs:
      - CO002
      - CO003
      - CO046

