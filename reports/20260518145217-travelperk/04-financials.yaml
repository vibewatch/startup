callouts:
  - calloutType: strength
    title: "Rare Growth-and-Profitability Combination"
    body: >
      Perk's annualized revenue exceeding $200 million, sustained >50% annual growth, and EBITDA break-even
      at end-2024 make it one of the few late-stage SaaS companies to demonstrate profitability without
      sacrificing growth—a durable signal for long-term value creation.
    claimRefs:
      - CI001
      - CI003
      - CI010

  - calloutType: risk
    title: "Undisclosed Margin and Burn Create Valuation Underwriting Risk"
    body: >
      At a $2.7 billion valuation on approximately $200 million annualized revenue, the implied 13–14x
      revenue multiple demands a high gross margin to be defensible. Perk has not disclosed gross margin
      percentage, NRR, or monthly burn rate. Without this data, investors cannot verify whether the premium
      is warranted or whether margin is being consumed by the GDS pass-through component of the booking model.
    claimRefs:
      - CI021
      - CI027
      - CI039

  - calloutType: risk
    title: "COVID Revenue Collapse Demonstrates Cyclical Exposure"
    body: >
      TravelPerk's revenue fell approximately 80–90% during the COVID-19 travel standstill and the company
      drew down substantial venture capital to survive. Any future shock to discretionary business travel—
      geopolitical, pandemic, regulatory—would carry similar downside. The company's capital reserves and
      EBITDA break-even improve resilience, but cyclical exposure remains a structural risk.
    claimRefs:
      - CI036
      - CI009

  - calloutType: insight
    title: "Yokoy Acquisition Shifts Revenue Mix Toward Higher-Margin Fintech"
    body: >
      The all-equity acquisition of Yokoy adds invoice processing, corporate card, and expense-report
      automation to Perk's platform. These fintech-adjacent revenue streams typically carry higher gross
      margins than traditional OBT booking fees, and Yokoy's 700+ enterprise customers in Europe provide
      a cross-sell base for Perk's travel module. If successfully integrated, this could drive meaningful
      blended gross margin improvement by 2026.
    claimRefs:
      - CI018
      - CI032

