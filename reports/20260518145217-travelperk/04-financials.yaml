  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "Audited or management-reported gross margin percentage for FY2022, FY2023, and FY2024, broken down by revenue stream."
      whyItMatters: "Without gross margin data, the $2.7 billion valuation at ~13–14x annualized revenue cannot be independently evaluated against SaaS comps; the pass-through nature of GDS bookings could depress blended GM well below the 60–80% range typical of pure SaaS platforms."
      diligencePath: "Request audited income statement or, at minimum, GAAP gross profit figures from CFO Roy Hefer in a formal diligence data room."
      relatedQuestionRefs: [QI003, QI024]
      relatedTableRefs: [TI003]

    - type: private-evidence-only
      severity: blocking
      topic: nrr
      missingEvidence: "Net revenue retention rate for calendar years 2023 and 2024, ideally broken down by customer cohort size."
      whyItMatters: "NRR is the single most diagnostic metric for SaaS platform health; an NRR below 100% would indicate net churn and would materially change the revenue growth durability thesis."
      diligencePath: "Request cohort-level NRR data from Perk's VP of Sales or CFO, with comparison to Series D-1 period (2022–2023)."
      relatedQuestionRefs: [QI011]
      relatedTableRefs: [TI003]

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: "Monthly operating cash burn and cash runway estimate from the January 2025 Series E close through end-2026, incorporating Yokoy integration costs and U.S. scaling expenses."
      whyItMatters: "EBITDA break-even at end-2024 may not reflect post-close burn given the Yokoy integration headcount, continued U.S. buildout, and $135M in debt service obligations."
      diligencePath: "Request post-Yokoy-close cash flow bridge and 18-month budget from CFO Roy Hefer."
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI004]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "Customer acquisition cost (CAC), blended payback period, and average revenue per user (ARPU) for 2023 and 2024 by channel and geography."
      whyItMatters: "The U.S. expansion strategy was accelerated by two acquisitions (NexTravel 2021, AmTrav 2024); the organic CAC efficiency is unknown and may be unfavorable if organic growth is slow relative to marketing spend."
      diligencePath: "Request sales efficiency KPIs (CAC, payback, ARPU) from SVP Sales or investor relations, alongside organic vs acquisition-adjusted cohort breakdowns."
      relatedQuestionRefs: [QI005]

    - type: missing-source
      severity: minor
      topic: debt-structure
      missingEvidence: "Terms of the $135 million Blackstone/Blue Owl credit facility: interest rate, maturity date, covenants, and any security interests or liens on Perk assets."
      whyItMatters: "Debt covenants could restrict Perk's strategic flexibility (e.g., further acquisitions, dividend recaps, IPO timing); interest expense at current rates could meaningfully affect net income."
      diligencePath: "Request credit agreement or term sheet summary from CFO; confirm whether any assets (GBV receivables, IP) serve as collateral."

