- id: TV006
  title: Thesis-break trigger register
  columns:
  - Trigger
  - Threshold or event
  - Why it matters
  - Action implication
  rows:
  - - Trust regression
    - Another material security or data-loss incident
    - Premium software multiples compress quickly when trust weakens.
    - Pause underwriting until remediation and customer impact are known.
  - - Growth miss
    - Management clearly misses the public 2026 revenue ambition
    - The current price already leans on strong forward growth.
    - Rebase scenarios toward bear and revisit valuation.
  - - Retention disappointment
    - Private NRR or churn data comes in below premium-band norms
    - Premium private ARR multiples require strong expansion quality.
    - Do not pay a premium multiple without re-rating the case.
  - - Round reset
    - A later round or secondary clears materially below $1.4B
    - That would directly falsify the current pricing thesis.
    - Treat the current round as fully marked down and reassess.
  - - Cap-table overhang
    - Preference stack or secondary-heavy structure is worse than expected
    - Return math can fail even if operating execution is solid.
    - Model downside with full terms before re-engaging.
  notes: The register focuses on events that would invalidate the current price support, not generic operating noise.
  claimRefs:
  - CV041
  - CV042
  - CV047
  - CV051
  - CV052
- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and terms
    - Current share count, security type, liquidation preferences, participation, pro rata rights
    - These inputs determine return math and downside protection.
    - Request the latest cap table and executed term sheets.
  - - Primary vs secondary split
    - How much of each 2025 round actually went onto the balance sheet versus to selling holders
    - Runway and dilution cannot be inferred from headlines alone.
    - Review closing memos and funds-flow schedules.
  - - Retention quality
    - NRR, gross churn, and cohort expansion by product and customer segment
    - Premium multiples require proof that growth quality is durable.
    - Review board KPI pack and customer cohort tables.
  - - Paid conversion
    - Free-to-paid conversion, attach rates, and large-account monetization path
    - A 90%+ free base changes how logos convert into enterprise value.
    - Inspect billing cohorts and PLG funnel analytics.
  - - Gross margin
    - Cloud gross margin, self-host/cloud mix, and infrastructure cost by product line
    - Public comp comparison is impossible without denominator and margin quality.
    - Request finance bridge and hosting-cost allocations.
  - - Reliability / trust
    - Enterprise customer retention after 2025-2026 incidents and post-mortem trendline
    - Trust shocks can change exit timing and discount rates fast.
    - Sample affected accounts and incident follow-up reporting.
  notes: These asks are the minimum dataset needed to turn a public-evidence view into a priceable underwriting case.
  claimRefs:
  - CV052
  - CV053
  - CV054
