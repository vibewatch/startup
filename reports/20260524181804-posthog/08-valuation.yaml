  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Exact post-money share count, security type, liquidation preferences, and investor rights for the 2025 rounds.
    whyItMatters: Those terms determine dilution, downside protection, and whether the latest headline valuation is actually investable.
    diligencePath: Request the current cap table plus executed term sheets and closing memos for the 2025 financings.
    relatedQuestionRefs:
    - QV019
    - QV031
    relatedTableRefs:
    - TV003
  - type: private-evidence-only
    severity: material
    topic: primary-secondary-split
    missingEvidence: Exact primary-versus-secondary allocation for each 2025 financing and any linked employee liquidity program.
    whyItMatters: Headline dollars can overstate actual balance-sheet strengthening if a meaningful share of proceeds went to selling holders.
    diligencePath: Review the funds-flow schedule, selling-holder schedule, and board approvals for both rounds.
    relatedQuestionRefs:
    - QV019
    - QV032
    relatedTableRefs:
    - TV003
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-conversion
    missingEvidence: Cohort NRR, gross churn, free-to-paid conversion, attach rates, and expansion by product and customer segment.
    whyItMatters: Premium private ARR multiples require proof that the large free base converts and expands with healthy retention economics.
    diligencePath: Inspect board KPI packs, cohort tables, funnel metrics, and top-customer expansion analysis.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: gross-margin-by-product
    missingEvidence: Product-level cloud gross margin, infrastructure cost intensity, and self-host versus cloud mix.
    whyItMatters: Without margin quality, public comp comparisons to Datadog, Atlassian, or Amplitude remain incomplete and can overstate fair value.
    diligencePath: Request a finance bridge by product line plus hosting-cost allocations and margin walk.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV007
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A wider benchmark sheet covering additional private rounds, M&A references, and more public peer screens across developer software.
    whyItMatters: The selected comparable set is sufficient for discipline but not exhaustive, so a fuller pricing memo could still move the fair-value band at the margin.
    diligencePath: Extend the comp sheet with banker data, additional public screens, and recent private transactions before issuing a term-sheet recommendation.
    relatedQuestionRefs:
    - QV012
    - QV016
    relatedTableRefs:
    - TV004
