tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why it lands here
  - What would improve it
  rows:
  - - Recommendation
    - RESEARCH-MORE
    - Public evidence does not cleanly underwrite the reported $1.4B price.
    - Disclose denominator, retention, margin, and financing terms.
  - - Confidence
    - Medium
    - The source base is strong on pricing, rounds, comps, and market context, but thin on private-company economics.
    - Add audited-like KPI disclosure or data-room confirmation.
  - - Risk rating
    - High
    - Trust incidents, conversion quality, and cap-table opacity all directly affect return math.
    - Show stable reliability and retention through 2026.
  - - Valuation stance
    - Full to expensive
    - The current round already sits near the low end of the bull case under public-style bands.
    - Offer a materially better entry or prove an exceptional premium band.
  - - Public denominator quality
    - Incomplete
    - Only an official >$50M revenue floor, a $100M target, and one external ARR estimate are public.
    - Publish current ARR or enough KPIs to triangulate it.
  - - Entry discipline
    - Wait for evidence or price
    - This is a high-quality company where price sensitivity matters more than narrative quality.
    - A lower secondary / flat round or fuller disclosure would move the call.
  - - Exit readiness
    - Emerging, not ready
    - Scale ambition is real, but public-company disclosure and reliability signaling are not there yet.
    - Reach public-company-style metrics and maintain trust.
  - - Primary diligence gate
    - Cap table + NRR + gross margin
    - Those three items determine whether a premium multiple is deserved.
    - Receive term sheet, cohort metrics, and margin bridge.
  notes: This table summarizes the investment call at the current price, not company quality in the abstract.
