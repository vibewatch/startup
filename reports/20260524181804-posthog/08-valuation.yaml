- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull case
  - Anti-thesis
  - What would change the view
  rows:
  - - Platform breadth
    - Product OS breadth supports consolidation across several product workflows.
    - Breadth can also hide margin complexity and reliability drag across too many surfaces.
    - Show product-level gross margin and stable reliability by surface.
  - - Monetization
    - Transparent usage pricing supports PLG adoption and land-and-expand.
    - A 90%+ free base means logo count alone does not prove paid economics.
    - Disclose free-to-paid conversion and product attach rates.
  - - Market backdrop
    - Independent reports still show double-digit category growth and a large developer TAM.
    - Market growth does not guarantee premium multiples once public comp discipline resets.
    - Show premium-quality retention and efficient growth.
  - - Public comp support
    - Datadog proves premium dev-tools multiples still exist.
    - Atlassian and Amplitude show how quickly multiples compress when scale, maturity, or category quality differ.
    - Earn a comp set closer to premium dev-tools than analytics software.
  - - Capital strategy
    - Repeated investor support and a 2025 step-up indicate real financing momentum.
    - Preference stack, primary-versus-secondary split, and true dilution remain undisclosed.
    - Open the cap table and 2025 term sheets.
  - - Exit path
    - A later IPO is plausible if PostHog reaches $100M+ revenue and discloses public-grade KPIs.
    - Trust incidents or a growth miss can delay or shrink exit options quickly.
    - Sustain reliability and hit revenue milestones.
  notes: The anti-thesis is mostly about price quality and disclosure quality, not about whether the product matters.
