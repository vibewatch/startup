- id: recommendation-exit-readiness-and-kill-switches
  title: Recommendation, confidence, exit readiness, and thesis-break triggers
  body: 'The recommendation is RESEARCH-MORE, not because PostHog lacks product quality, but because public evidence does not yet support paying the current price with discipline. This is exactly the type of company that can be attractive at the wrong valuation: broad platform scope, strong PLG distribution, and real investor quality. But the underwriting gap is still too large. Investors do not know the actual cap-table stack after two 2025 rounds, the exact primary-versus-secondary split, the paid-conversion quality of a base where more than 90% of companies are free, or the margin structure of the expanding product set. Exit readiness is therefore emerging rather than mature. The company looks capable of becoming IPO-eligible if it closes the gap between the current >$50 million floor and the public $100 million target, while also surfacing public-company-style retention, margin, and reliability metrics. The thesis breaks if trust incidents recur, if management misses the 2026 target
    badly, or if a later round resets the valuation below the current headline. Until those gates move, price discipline matters more than admiration.'
