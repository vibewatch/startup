- id: TV003
  title: Current financing and dilution context
  columns:
  - Item
  - Public disclosure
  - What it suggests
  - Dilution / overhang read
  - What remains unknown
  rows:
  - - Series D (June 2025)
    - Officially $70M at $920M led by Stripe.
    - There was real new-money demand before unicorn status.
    - Likely single-digit to low-double-digit dilution depending on pre/post-money framing.
    - Exact share count, security type, and liquidation preferences.
  - - Reported Series E (2025)
    - Independent coverage says $75M at $1.4B led by Peak XV.
    - The company achieved a fast step-up into unicorn territory.
    - Headline dilution may look mid-single-digit if mostly primary, but public evidence is insufficient to confirm.
    - Whether the valuation is pre- or post-money and who sold shares.
  - - Employee liquidity / tenders
    - Official materials emphasize employee liquidity and careers highlights secondaries/tenders.
    - Not every disclosed financing dollar should be treated as pure runway extension.
    - Secondary volume can reduce founder/employee pressure without improving balance-sheet cash one-for-one.
    - Primary-versus-secondary split in both 2025 rounds.
  - - Preference stack
    - No public cap-table or terms package was found.
    - Return math cannot be modeled cleanly from public evidence.
    - Potential preference overhang remains unknown.
    - Liquidation stack, participation rights, and investor protections.
  - - Entry discipline implication
    - Current headline price must be judged against public comp quality, not product quality alone.
    - The round requires either premium private metrics or a very strong forward path.
    - A better price or better evidence is needed before underwriting.
    - Board-level KPI pack and signed term sheets.
  notes: The table preserves denominator and term gaps instead of forcing a false dilution point estimate.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV041
  - CV052
- id: TV004
  title: Comparable valuation table
  layout: wide
  enumerationScope:
    coverage: partial
    basis: Selected public and private reference points most relevant to developer tools, product analytics, and current SaaS market discipline; not an exhaustive universe of software comps.
  columns:
  - Company / reference
  - Status
  - Current denominator or scale signal
  - Valuation multiple / price context
  - Why it matters
  - Key limitation
  rows:
  - - PostHog
    - Private
    - Official >$50M revenue floor; Sacra est. $57.5M ARR in Feb 2026
    - <$28x on official floor; ~24x on Sacra estimate at $1.4B
    - Subject company; shows how much current price leans on future execution.
    - No public NRR, margin, cap table, or audited denominator.
  - - Datadog
    - Public
    - FY2025 revenue $3.427B; Q1 2026 revenue $1.006B
    - 18.3x ARR on SaaSValuation.io
    - Premium public dev-tools reference with strong growth and filings-grade transparency.
    - Far larger scale and broader observability footprint than PostHog.
  - - Atlassian
    - Public
    - FY2025 revenue $5.215B; ~83-85% gross margin
    - Low-single-digit implied revenue multiple
    - Shows how even very large PLG software platforms can trade far below premium dev-tools bands.
    - Collaboration / productivity suite is not a pure analytics comp.
  - - Amplitude
    - Public
    - FY2025 revenue $343M; Q1 2026 revenue $93.5M
    - ~2.3x implied revenue multiple
    - Closest public product-analytics category comp.
    - Narrower platform and slower growth than PostHog's private story.
  - - 2026 SaaS benchmark band
    - Market reference
    - Public SaaS around 6x-7x median; private SaaS 3x-7x ARR median 4.5x
    - All-SaaS average around 10.4x but dispersion is wide
    - Frames late-stage valuation discipline outside a single company.
    - Not a direct operational comp set.
  notes: Comparable rows deliberately mix category closeness with disclosure quality, because both matter when judging a private round.
