  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA (remote-first)
  productSummary: PostHog sells a usage-based, open-source-friendly platform for product engineers that combines product analytics, web analytics, session replay, feature flags, experiments, surveys, data warehouse functions, CDP-style routing, and AI-assisted developer workflows.
  customerFocus: Engineering-led startups, developer-tools companies, product teams, and adjacent growth/data functions that want one integrated product-intelligence stack.
  businessModel: Open-core / usage-based SaaS subscription
  stage: Series E
  fundingStatus: Officially disclosed $70M Series D in 2025, followed by independently reported $75M Series E at a $1.4B valuation later in 2025.
