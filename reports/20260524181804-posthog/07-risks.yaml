- id: regulatory-legal-privacy-risk
  title: Regulatory, legal, and privacy-transfer risk
  body: 'The legal and regulatory story is stronger than average for a private software vendor, but it is not low risk. PostHog is unusually explicit about controller-versus-processor roles, cross-border transfers, regulated-use support, and customer responsibility. That is positive because it gives customers clearer instruments than vague marketing pages do. At the same time, those same documents preserve real residual exposure. PostHog relies on an active DPF certification plus SCC fallback where needed, which is workable today but still exposes the company to any future transfer-mechanism challenge or customer-side misuse of event data. The company also limits its own financial exposure contractually through a low liability cap and by placing compliance responsibility for collected customer data on customers. Public disclosure of PSA-2025-00001 adds another trust wrinkle: even though the issue was resolved and the company says there are no active advisories, the advisory confirmed that
    a cross-team query-visibility defect existed and that part of the historical US window could not be fully verified. That is exactly the kind of event that highly regulated buyers remember.'
