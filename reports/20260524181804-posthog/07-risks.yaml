  evidenceGaps:
  - type: missing-source
    severity: material
    topic: incident-exposure-counts
    missingEvidence: Exact affected customer, machine, or account counts for PSA-2025-00001 and the Shai-Hulud incident.
    whyItMatters: Exposure counts determine reserve sizing, customer-communication burden, and whether public incidents were narrow mishaps or broad trust breaks.
    diligencePath: Request internal incident reports, affected-account lists, and customer-notification tallies from security leadership under NDA.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: subprocessor-concentration
    missingEvidence: A current subprocessor roster with service criticality, region, and concentration by workload.
    whyItMatters: Vendor concentration and jurisdiction mapping drive both privacy-transfer risk and single-point-of-failure risk for enterprise customers.
    diligencePath: Request the current subprocessor page, trust-center attachments, and vendor criticality register during legal diligence.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: plg-conversion-and-unit-economics
    missingEvidence: Current burn, gross margin, NRR, paid-customer count, and conversion from the 90%+ free base.
    whyItMatters: Without unit economics, investors cannot tell whether the 2026 ARR target is a stretch but reachable goal or an indicator of future down-round pressure.
    diligencePath: Request board materials or monthly operating metrics showing ARR bridge, gross margin, infra spend, and free-to-paid conversion cohorts.
    relatedQuestionRefs:
    - QR028
  - type: missing-source
    severity: material
    topic: component-slas-and-recovery-objectives
    missingEvidence: Formal uptime commitments, RTOs, RPOs, and recovery-runbook commitments for logs, workflows, feature flags, and replay.
    whyItMatters: Public incident history shows newer surfaces can fail differently from core analytics, so enterprise diligence needs explicit service boundaries before under-writing expansion.
    diligencePath: Request MSA or enterprise support addenda plus internal incident-response and backup standards by component.
    relatedQuestionRefs:
    - QR029
