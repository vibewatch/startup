company:
  name: PostHog
chapter:
  number: 7
  title: Risks
  summary: 'PostHog''s risk profile is led by a combined trust problem rather than by one isolated defect: the company openly documents a five-hour npm supply-chain compromise in November 2025, confirmed logs data loss in February 2026, and a run of additional public post-mortems across workflows, replay, feature flags, and surveys. Legal and privacy posture is stronger than average for a private software vendor, with active DPF participation, SCC fallback, and unusually explicit controller-processor language, but the documents also preserve real residual exposure because customers remain responsible for what they collect and because a 2025 query-visibility advisory left part of the historical US window unverifiable. Business-model risk sits behind the operational picture: more than 90% of companies reportedly use PostHog for free while the company is still targeting $100M ARR by end-2026 from a much lower outside estimate, so any further trust shock could hit both enterprise adoption and
    monetization simultaneously.'
sections:
- id: severity-ranked-risk-register
  title: Severity-ranked risk register
  body: 'PostHog''s residual risk stack is led by a pattern rather than one isolated red flag. The company publicly discloses real privacy, security, and reliability controls, but it also openly documents enough adverse evidence to show that operational and trust risk are not theoretical. The most material cluster is a combined security and reliability risk: a five-hour npm supply-chain compromise in November 2025, a confirmed logs data-loss event in February 2026, and a public run of post-mortems spanning workflows, feature flags, replay, surveys, and database migration issues. That history matters more than any single bug because PostHog is expanding from analytics into a broader Product OS with more components, more package surfaces, and more downstream integrations. The investment implication is that enterprise trust, not just feature breadth, is the scarce asset to underwrite. Privacy-transfer and legal role-allocation risk rank next, followed by dependency risk around GitHub or npm
    and business-model risk from trying to convert a 90%+ free base into a $100M ARR target inside 2026.'
