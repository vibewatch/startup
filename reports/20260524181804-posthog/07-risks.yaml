- id: TR006
  title: Mitigations and monitoring table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Current public baseline
  - Action implication
  rows:
  - - Cross-tenant privacy or authorization regression
    - New security advisory, post-mortem, or customer notice
    - Any new confirmed cross-tenant exposure
    - No active advisories, but PSA-2025-00001 exists historically
    - Treat as immediate thesis re-underwrite; ask for root cause, blast radius, and controls validation.
  - - Supply-chain compromise recurrence
    - Security advisory, npm package withdrawal, or incident post from PostHog
    - Any new malicious publish or customer environment compromise
    - Shai-Hulud is resolved and release workflows were hardened
    - Pause underwriting of developer-trust assumptions until new controls are independently reviewed.
  - - Operational reliability slippage
    - Another logs, workflows, feature-flags, replay, or app incident with prolonged customer impact
    - Two or more publicly acknowledged incidents in a quarter or any core-data loss event
    - Recent incident history is visible across 2025-2026
    - Re-cut enterprise expansion assumptions and ask for SLOs, backup depth, and support staffing.
  - - Transfer-mechanism or privacy governance stress
    - DPF status change, SCC challenge, or material enterprise privacy complaint
    - DPF no longer active or a major customer pause tied to transfer concerns
    - DPF is active and SCC fallback is documented
    - Escalate legal diligence and contract-risk modeling.
  - - PLG monetization miss
    - ARR updates, hiring pace, and external estimates diverge further from the $100M target
    - Public trajectory implies the goal is structurally out of reach by late 2026
    - Public goal is $100M ARR by 2026; outside Feb 2026 estimate is ~$57.5M
    - Pressure-test valuation, burn, and hiring assumptions before adding capital.
  - - Self-host or enterprise-fit erosion
    - More cloud-first warnings, review friction, or deal losses tied to reliability and support boundaries
    - Pattern of losses where self-host or regulated buyers reject PostHog's support posture
    - Cloud-first guidance and some review friction are already public
    - Limit upside case for upmarket expansion until support and SLA boundaries are clearer.
  notes: Thresholds are investor heuristics rather than contractual covenants. They are meant to convert public signals into decision points rather than to predict exact financial outcomes.
