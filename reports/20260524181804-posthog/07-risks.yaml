callouts:
- calloutType: risk
  title: Transparency is both a mitigation and a warning label
  body: 'PostHog deserves credit for publishing the evidence that lets an investor rank these risks at all. But the same transparency also proves that the residual exposure is real: disclosed query-visibility problems, a public logs data-loss event, and a detailed supply-chain compromise are not hypothetical scenario planning. They are part of the operating record.'
  claimRefs:
  - CR013
  - CR014
  - CR020
  - CR022
  - CR024
  - CR060
- calloutType: risk
  title: The business model is only attractive if trust holds while conversion improves
  body: A 90%+ free base is a powerful distribution engine, but it is not a durable valuation defense by itself. If outage cadence, review-visible crashes, or security incidents continue while the company is still chasing a $100M ARR target from a much lower estimated base, the model can become operationally impressive yet financially fragile.
  claimRefs:
  - CR036
  - CR041
  - CR042
  - CR043
  - CR044
  - CR055
