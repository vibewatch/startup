- id: dependency-people-and-model-risk
  title: Partner, dependency, people, and model risk
  body: 'PostHog''s dependency and model risks are more software-specific than supplier-specific, but they are still consequential. The Shai-Hulud post-mortem shows direct dependence on GitHub Actions and npm publishing workflows. Product OS and CDP positioning show another layer of exposure: PostHog wants to move data between many surfaces and hundreds of external tools, which increases the number of places where integration, compliance, or permissioning can fail. Self-hosting adds a further boundary risk because PostHog still uses open-source distribution as a growth funnel while also explicitly saying that cloud is the right choice at scale. On people and model risk, the public evidence points to a company still stretching into its next phase. Careers says 200+ people and ongoing hiring, the future page says $100M ARR by end-2026, and Sacra''s February 2026 ARR estimate of roughly $57.5M implies a meaningful gap to close. A 90%+ free user share is excellent for distribution, but it means
    valuation support depends on conversion, expansion, and reliability all holding together at the same time.'
