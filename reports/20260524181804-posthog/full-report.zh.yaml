      - number: '6.2'
        title: 采用轨迹指向广覆盖，但公开证明漏斗很快变窄
        blocks:
          - type: paragraph
            body: >-
              最宽的采用解读来自官方使用量主张，而不是披露的付费客户递进。PostHog 在关于页和定价页之间指向 190254+ 个团队、60000+ 个客户，以及超过 90%
              公司免费使用的自助动作。除此之外，PostHog 称每一届 Y Combinator 批次中有 65% 使用其产品，这是最重要创业渠道之一里的有意义分发信号。独立评论数量又提供了一个外部标记：G2 档案显示
              950 条评论和 4.5/5 评分，这个表面积远大于纯概念客户基础应有的水平。


              但这仍不是干净的队列或部署阶梯。当证据从广泛官方计数转向独立可见用户，再转向具名客户故事时，公开证明很快变薄。本次审阅中，九个公开客户故事页面可访问，其中八个包含量化结果或规模标记。这足以说明采用真实存在，但仍是被策展的子集。因此，漏斗支持一个有层次的结论：PostHog
              可能拥有很大的漏斗顶端和广泛产品熟悉度，但公开记录更能说明部分客户如何使用产品，而不是每个变现队列里到底有多少付费客户。
