      - number: '5.3'
        title: 部署、集成与产品变更如何发布
        blocks:
          - type: paragraph
            body: >-
              PostHog 给客户两种非常不同的部署姿态。云端是推荐路径，也是明显为规模优化的路径。自托管仍可通过 MIT 许可的 Docker Compose
              爱好者部署获得，文档强调产品表面相同，但基础设施和支持模型不同。运营方要自己承担扩容、URL、升级和故障风险；公开 README 还暗示，开源部署在大约每月 100k
              个事件以内才实际可行，之后迁移到云端会成为推荐动作。任何买方或投资人如果想把「开源」等同于完整企业私有云支持策略，都需要重视这个限定条件。


              发布机制也异常透明。手册称，新产品先放在功能开关后面，再经过 alpha、beta 和 GA，并用用户级预览和即将上线界面发现早期需求。这与技术产品形态一致：浏览器 SDK
              模块可以选择性打包，服务端功能开关可以本地评估，MCP 向导可以把 PostHog 的 AI 访问层直接安装到开发者工具里。较弱的是路线图具体性。公开路线图 URL
              存在，但留存的审计抓取只看到加载壳，因此近期详细时间表仍更多依赖发布流程披露，而不是可读的公开路线图导出。
