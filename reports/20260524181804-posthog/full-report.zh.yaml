      - number: '1.2'
        title: 创始人、运营模式与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开创始人叙事异常清晰，尽管更完整的治理图景并不透明。PostHog 的手册、Y Combinator 档案和第三方研究都指向同一个事实：James Hawkins 和 Tim Glaser 于 2020 年 1
              月创办公司，Hawkins 为 CEO，Glaser 为 CTO。Contrary 的备忘录补充了有用背景：两人都曾在 Arachnys 工作，商业与技术经验互补，解释了为什么 PostHog
              既会讲强产品故事，又保持很深的技术取向。运营模式同样明确。招聘页和外部远程工作资料显示，公司围绕小型自治团队、异步优先习惯和全球分布式招聘搭建，而不是围绕办公室管理。与此同时，公开治理披露比创始人披露薄得多。除创始人和运营副总裁
              Charles Cook 等少数签字人外，审阅材料中没有同样可见的公开董事会页面或完整高管名单。尽调上，这意味着关键人依赖是真实风险，正式治理需要直接核验，不能只从品牌强度推断。
