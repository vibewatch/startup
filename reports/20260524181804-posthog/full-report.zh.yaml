  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、公开标价与价格卡没有说明的部分
        blocks:
          - type: paragraph
            body: >-
              对一家私营软件公司而言，PostHog 的公开定价表面异常透明。公司按产品发布免费额度和超量计费器，覆盖分析、回放、功能开关、问卷、数据仓库、管道、AI
              可观测性、AI、工作流和日志；配套文档还解释，用量而非席位是核心变现原语。这是模型标价侧的强证据。但它不足以把用量机制转成实际收入。同一套公开文档也称，客户可以获得创业公司赠额、非营利折扣、自定义优惠券、定制价格层、首层固定收费结构，以及预付固定、不按表计费的方案。换句话说，PostHog
              对标价透明，但对净价不透明。正确解读是，自助价格卡真实且有战略价值，但企业和促销结构仍会改变各客户队列的实际
              ARPA、递延收入节奏和毛利率。因此，投资人应把公开价格视为入口经济性，把实际经济性视为尽调请求，而不是已经披露的事实。
