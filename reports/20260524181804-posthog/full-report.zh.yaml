  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 为何落在这里
      - 什么会改善它
    rows:
      - - 投资建议
        - 继续研究
        - 公开证据不足以干净支撑据称 $1.4B 的价格。
        - 披露分母、留存、毛利率和融资条款。
      - - 信心
        - 中
        - 资料基础在定价、融资轮次、可比公司和市场背景上较强，但私营公司经济性证据偏薄。
        - 补充类审计 KPI 披露或数据室确认。
      - - 风险评级
        - 高
        - 信任事件、转化质量和股权结构表不透明都会直接影响回报测算。
        - 展示 2026 年内稳定的可靠性和留存。
      - - 估值立场
        - 充分到偏贵
        - 当前轮次已经接近公开市场估值区间下乐观情景的低端。
        - 给出明显更好的入场价，或证明能拿到异常高的溢价区间。
      - - 公开分母质量
        - 不完整
        - 公开信息只有官方 >$50M 收入下限、$100M 目标和一个外部 ARR 估计。
        - 发布当前 ARR，或足够用来三角验证的 KPI。
      - - 入场纪律
        - 等待证据或价格
        - 这是一家高质量公司，但价格敏感度比叙事质量更重要。
        - 更低的老股价格 / 平轮，或更完整披露，会改变判断。
      - - 退出准备度
        - 正在成形，但未就绪
        - 规模抱负真实，但上市公司级披露和可靠性信号还不到位。
        - 达到上市公司式指标，并守住信任。
      - - 主要尽调关口
        - 股权结构表 + NRR + 毛利率
        - 这三项决定其是否值得溢价倍数。
        - 拿到投资意向书、队列指标和毛利率桥接。
    notes: 本表总结当前价格下的投资判断，不抽象评价公司质量。
