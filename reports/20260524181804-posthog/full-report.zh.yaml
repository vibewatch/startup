  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张或压力点
      - 证据
      - 威胁向量
      - 严重程度
      - 当前缓释或抵消因素
      - 尽调要求
    rows:
      - - 产品整合广度
        - PostHog 打包的模块比多数直接对手更多
        - 品类趋同意味着对手也在补相邻模块
        - 高
        - 一体化套件仍能帮技术团队减少工具蔓延
        - 按队列索取附加率和多产品留存
      - - 开源 / 自托管控制
        - PostHog 和 GrowthBook 让买方可选择部署方式
        - 部署选择降低供应商锁定，退出时痛感也可能更小
        - 中
        - 隐私和基础设施控制仍能形成差异
        - 验证自托管转向付费云增购与流失各占多少
      - - 透明定价
        - PostHog 公布慷慨免费档和按量费率
        - Statsig、GrowthBook、Mixpanel 和 GA4 也给出有吸引力的免费入门条件
        - 中
        - 透明度仍能推动自助采用并建立信任
        - 收集真实企业报价，检验规模化后定价是否仍透明
      - - 开发者工作流强度
        - 独立评测认为 PostHog 最适合开发者
        - 非技术 PM 可能更偏好 Amplitude 或 Mixpanel
        - 高
        - 目标客群仍是工程主导团队
        - 用同时包含 PM 和工程师的参考客户测试真实工作流
      - - 回放深度对比专业厂商
        - Fullstory 仍以回放为核心，行为数据更丰富
        - 部分团队可能发现，最佳单点回放工具仍跑赢套件便利性
        - 中
        - PostHog 把回放留在同一技术栈内，借此缩小差距
        - 在真实部署中比较回放分析深度和上线速度
      - - 企业治理与审批
        - LaunchDarkly 和 Amplitude 在大型组织中仍有治理可信度
        - 即便功能重叠增加，既有工作流仍会阻碍替换
        - 高
        - 当治理要求较轻或更多由开发者掌控时，PostHog 有机会胜出
        - 要求安排企业参考客户访谈，核验审批、可审计性和 RBAC 适配度
      - - 现状方案与专业工具多栖
        - GA4 加单点工具仍可行，且通常便宜
        - 买方可以混搭不同层级，而不是完全标准化到一个套件
        - 中
        - 一体化合同仍能节省协调成本
        - 衡量套件整合带来的实际采购和管理节省
      - - 功能趋同与商品化
        - Forrester 和厂商页面显示，实验加功能开关正在变常见
        - 单一模块可能不再稀缺到足以支撑溢价
        - 高
        - 护城河从原始功能转向工作流、数据模型和分发
        - 按竞争对手类型跟踪路线图速度和赢单 / 输单原因
    notes: 严重程度衡量其对 2026 年采购流程的竞争影响，不是量化财务损失模型。
