      - 关键细节
      - 部署注意
      - 证据
    rows:
      - - JavaScript Web SDK
        - 代码片段或包管理器安装
        - 框架专项文档、命名实例、跨域 cookie、回放触发器和退出捕获
        - 扩展加载和 CSP / Electron 约束，可能要求选择 slim 或 no-external bundle 包
        - JS 文档
      - - 服务端功能开关评估
        - Node、Ruby、Go、Python、C#/.NET、PHP、Java 和 Rust
        - 本地评估在后台拉取功能开关定义，并减少请求数
        - 调用方必须提供所有相关属性；无状态运行时需要共享缓存或远程评估
        - 功能开关本地评估文档 + PyPI
      - - 分析 / SQL / 数据仓库产品面
        - 可视化分析、SQL 访问和外部数据导入
        - SQL 定位为基于共享产品 / 客户数据的无限制自定义分析
        - 详细导入来源覆盖不如顶层定位充分
        - Product OS + 代码仓库 + YC
      - - CDP / 管道 / 目的地
        - 实时转换、webhook 和下游同步
        - 支持数据增强、映射、校验、PII 清理和运营触发器
        - 各目的地的实现质量公开描述不深
        - CDP 页面 + 代码仓库 README
      - - MCP / AI 客户端
        - PostHog Code、Cursor、Claude Code/Desktop、Codex、VS Code 和 Zed
        - 免费 MCP 服务器，支持 OAuth 或项目级 API 密钥，并按区域路由
        - LLM 工作流带来提示注入审查要求
        - MCP 文档
      - - 自托管部署
        - Docker Compose 爱好者部署
        - 与云端相同的产品面，并可选 TUI 试用
        - 无带标签的版本发布、无保证，也不再新增付费开源 Kubernetes 部署
        - 自托管文档 + README
    notes: 表格聚焦公开实现细节最清楚的集成产品面。它不试图枚举每一种语言 SDK 或每一个下游目的地。
