  - id: TP001
    title: 竞品画像表
    columns:
      - 竞品 / 替代方案
      - 类别
      - 公开规模 / 融资信号
      - 目标团队或买方
      - 产品范围
      - 定价 / 打包信号
      - 战略方向 / 局限
    rows:
      - - PostHog
        - 一体化 Product OS 锚点
        - 定价页披露 60,000+ 客户；开源并提供自托管选项
        - 工程驱动的初创公司、产品团队、重视数据的构建者
        - 分析、回放、功能开关、实验、问卷、数据仓库、CDP、工作流
        - 按用量计费，各产品提供慷慨免费额度
        - 本组里最宽的一体化栈，但对非技术 PM 来说 UI 不是最容易上手
      - - Mixpanel
        - 直接分析竞品
        - 公开产品和定价页更强调成熟数字分析平台，而不是当前融资披露
        - 需要分析优先工作流的产品驱动型 SaaS 团队
        - 分析、网站分析、回放和热图、实验和功能开关、KPI 树
        - 1M 事件免费；Growth 档按用量计费；Enterprise 定制
        - 成熟且覆盖面广，但部署控制以 SaaS 为先，打包宽度仍窄于 PostHog
      - - Amplitude
        - 直接分析竞品
        - 官方定价展示套件深度；独立评测强调企业适配，而不是公开当前融资数据
        - 大型组织的产品、增长和高管团队
        - 分析、问卷、功能实验、网页实验、激活、回放、AI 工具
        - 免费档，Plus 每月 $49；更高档位定制
        - PM 和治理定位强，但企业经济性更难公开对比
      - - Heap
        - 直接分析 / 回放竞品
        - 10,000+ 家公司使用，现为 Contentsquare 旗下
        - 想要自动捕获和更易上手设置的团队
        - 带自动捕获的分析、AI 助手、回放附加项、更高套餐的数据仓库集成
        - 免费入门至每月 10k 会话；更高套餐和回放更偏定制
        - 自动捕获和 DX 网络背书有帮助，但模块宽度薄于 PostHog
      - - Fullstory
        - 回放优先的相邻竞品
        - 定位为行为数据平台；审阅材料未给出当前公开融资细节
        - 需要定性旅程洞察的产品、UX、支持和 CX 团队
        - 自动捕获、行为分析、AI 洞察、指南和问卷、激活
        - 采用申请演示式打包，而非透明自助标价
        - 回放深度和行为细节仍强，但更宽的产品开发套件较窄
      - - LaunchDarkly
        - 功能管理老牌厂商
        - 强调企业工程规模；审阅材料页面未显示当前客户数或融资
        - 优先考虑运行时控制、审批和发布治理的工程组织
        - 功能开关、渐进式交付、实验、可观测性、智能体控制
        - Developer 套餐免费起步；企业档定制
        - 治理驱动的老牌厂商，工作流可信度强，但不是完整分析 OS
      - - Statsig
        - 实验和功能管理套件
        - 客户证据显示竞争胜单；定价页未披露私募融资
        - 大规模跑实验的数据驱动型产品和工程团队
        - 分析、实验、功能管理、回放、网站分析、配置
        - Developer 档包含 2M 计量事件免费；更高档按用量扩展
        - 快速增长的一体化控制平面；部署可移植性弱于开源对手
      - - GrowthBook
        - 开源 / 数据仓库原生相邻竞品
        - 主页披露 3,000+ 家公司；审阅材料未披露私募融资
        - 需要数据仓库原生实验的技术型产品和数据团队
        - 实验、功能开关、产品分析、数据仓库原生部署、自托管
        - Starter 免费，Pro 每席 $40，Enterprise 定制
        - 开源和成本叙事强，但产品宽度和分发仍小于 PostHog 或 Amplitude
      - - Google Analytics 4
        - 现状型老牌方案
        - 更像 Google 生态默认项，而不是独立初创公司的规模故事
        - 营销、网页和归因团队
        - 绑定 Google 广告栈的客户旅程和 ROI 分析
        - 免费
        - 营销分析里摩擦最低的默认项，但卖点不是统一产品开发控制平面
      - - 内部自建 / 数据仓库原生栈
        - 替代方案
        - 没有共享规模信号；经济性取决于内部团队产能和数据基础设施
        - 优先考虑控制权和可组合性的技术团队
        - 围绕既有数据仓库和开源层自建分析、功能开关、回放或实验
        - 资本开支是工程时间，而非标价
        - 控制权和可移植性强，但价值兑现更慢，运营负担更重
    notes: 各行综合保留的官方产品和定价页面，以及少量独立团队适配评论；只有审阅公开材料明确披露时，才列出融资和客户规模。
