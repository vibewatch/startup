      - number: '1.4'
        title: 规模信号、披露缺口与后续需要带入的问题
        blocks:
          - type: paragraph
            body: >-
              公开规模信号方向上很强，但仍不够一致，后续章节应把多个指标当作区间，而不是定论。积极面是，PostHog 关于页称平台被 190,254+ 个团队使用，定价页称超过 90% 的公司免费使用，未来页称管理层希望到
              2026 年底实现 $100M 年收入。手册也展示了历史招聘和收入扩张，包括 2022 年收入增长 6x，员工数从 2021 年中 25 人增长到 2022 年底 38
              人。但当前规模图景没有被干净交叉验证。招聘页和人员页暗示公司有 200+ 人，而外部远程工作资料称团队更接近 110 人。ARR 同样混杂：Sacra 发布了 2026 年估计，但审阅过的官方页面没有披露权威当前
              ARR。最后，PostHog 的透明度有利也有弊：公司公开列出事后复盘和安全公告，文化上是正面信号，但也留下具体风险标记，包括一个已解决的 2025 年查询可见性安全公告，以及多个 2025-2026
              年面向客户的事故，值得在风险章节单独处理。
