    rows:
      - - 实际 ARPA / 混合净价
        - 没有该指标，公开标价无法转化为实际收入质量或回本判断。
        - 定价文档显示公开档位；计费文档显示积分、折扣和定制方案。
        - 按产品、客户、折扣和合同类型导出 12 个月账单收入。
      - - 按产品拆分的 ARR / 确认收入
        - 无法评估收入结构集中度和增长持久性。
        - 招聘页称 >$50M/year，future 页面称目标 $100M，Sacra 发布了非官方估计。
        - 提供 2025 年 1 月以来的月度确认收入、ARR 和产品结构。
      - - 按产品和托管模式拆分的毛利率
        - 阻碍判断用量增长能否盈利性扩张。
        - Atlassian 和 Datadog 文件暗示软件毛利率约 80-83%，但 PostHog 可能存在实质差异。
        - 披露云端 COGS、自托管经济性、存储 / 计算成本和毛利率瀑布图。
      - - NRR / logo 留存 / 流失
        - 没有队列留存，就无法检验落地扩张叙事。
        - 客户故事显示扩张，但没有公开队列统计。
        - 按客群提供总金额留存、净金额留存、logo 流失和扩张。
      - - CAC 回本周期和销售辅助转化
        - 自助服务案例看不出获客效率。
        - 没有公开 CAC 或回本周期；只能看到支持和采用代理指标。
        - 提供漏斗转化、按渠道拆分的支出和按队列拆分的回本周期。
      - - 现金 / 烧钱 / 现金跑道
        - 资本充足性仍不可知，也无法判断下一轮融资时点。
        - 公开信息只有融资事件和 default-alive 表述。
        - 提供当前现金、月度烧钱、现金跑道和下行情景计划。
      - - 云端与自托管收入结构
        - 托管结构会改变毛利、支持负担和收入确认。
        - 开源和自托管定位已公开，但收入结构未公开。
        - 提供付费云端 ARR、自托管支持收入和迁移趋势。
      - - 企业合同负债 / 递延收入
        - 混合合同可能让现金回款节奏与收入确认错位。
        - 计费手册确认存在预付和额度结构；但没有公开披露递延收入。
        - 提供合同原型、递延收入余额，以及按产品拆分的收入确认政策。
    notes: 每一行都是尽调阻断项，而不是隐藏结论。提到上市公司基准的地方，只作为框架类比，不能替代公司数据。
