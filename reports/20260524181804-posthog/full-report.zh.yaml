  - id: FE001
    title: 产品系统流
    type: flow
    layout: wide
    summary: PostHog 的产品循环从采集开始，进入分析、受控发布、下游激活，再从开发者工具里做 AI 辅助查询。
    approximationNotes: 该图综合已记录的工作流界面，而非复刻内部系统图。它只反映留存公共资料包中明确可见的产品流。
    data:
      nodes:
        - id: capture
          label: 采集 + 识别
          detail: SDK、自动捕获和 API 从产品与网页界面收集行为。
        - id: analyze
          label: 分析 + 回放
          detail: 分析、会话回放和 SQL 帮团队查看行为、调试问题。
        - id: control
          label: 控制 + 测试
          detail: 功能开关和实验控制发布节奏，并验证影响。
        - id: activate
          label: 激活 + 路由
          detail: CDP、管道和工作流转换事件，并把动作推送到下游工具。
        - id: ai
          label: AI 辅助访问
          detail: MCP 让编码工具和 AI 智能体能访问项目数据并执行动作。
      edges:
        - to: analyze
          label: 共享事件和用户数据
          from: capture
        - to: control
          label: 洞察反哺发布和测试
          from: analyze
        - to: activate
          label: 事件输入目的地和工作流
          from: capture
        - to: ai
          label: 数据可从 AI 原生工具查询
          from: analyze
        - to: activate
          label: 发布结果和触发器推动下游动作
          from: control
    claimRefs:
