            body: >-
              PostHog 的产品定义比「产品分析」更宽。官方 Product OS 文档把分析、网站分析、回放、功能开关、实验、问卷和数据仓库打包成一个系统；代码仓库和 YC
              档案又把范围扩展到错误跟踪、CDP/数据管道、LLM 可观测性和 AI 产品助手。按工作流看，公司想拿下一个工程师主导的闭环：用 SDK 和自动捕获埋点行为，用分析 / 回放 / SQL
              检查行为，在功能开关和实验背后发布变更，再把由此产生的数据激活或导出到栈内其他系统。


              这个打包工作流是真正差异点，因为它减少了早期和中期工程团队的工具拼接。公开资料包也让商业形态清晰：定价按产品表面用量计费，免费层覆盖几乎所有主要模块。取舍在于，模块宽度本身已经成为尽调问题。核心分析、回放和功能开关在公开文档中看起来成熟；较新的
              AI、工作流和更广的激活表面可见且已变现，但它们各自 GA 还是预览的确切组合，在留存资料包中并不同样明确。
