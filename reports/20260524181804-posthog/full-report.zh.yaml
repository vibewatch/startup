        title: 乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于 PostHog 没有公布权威的当前 ARR 分母，估值更适合用前瞻情景区间框定，而不是给出虚假精确的点估计。 悲观情景假设公司大幅落后于公开目标，2027 年收入只长到 $75 million 至 $90
              million， 并在 5x 至 7x 出清，因为后期 SaaS 投资者会惩罚留存或信任证明缺失。基准情景给管理层完成或小幅超过公开 $100 million 目标的信用， 但只给 7x 至
              10x，因为公开市场纪律仍紧，溢价区间仍需要比今天更强的披露。乐观情景假设 PostHog 显著跑赢公开计划， 宽套件货币化保持非常强，并拿到 10x 至 14x 区间，接近分层市场里最强的软件公司。按这些假设，
              当前 $1.4 billion 名义估值已经落在乐观结果低端附近，而不是基准情景中点。这不能证明该轮融资错了， 但意味着新投资者接受这个价格前，需要异常强的非公开证据。
