        title: 监管、法律和隐私传输风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管叙事强于一般私有软件供应商，但并非低风险。PostHog 对控制者与处理者角色、跨境传输、受监管使用支持和客户责任讲得异常明确。
              这是利好，因为相比模糊的营销页面，客户拿到的是更清楚的工具。与此同时，同一批文件也保留了真实残余敞口。 PostHog 依赖有效的 DPF 认证，并在需要时以 SCC
              兜底；这在今天可行，但公司仍暴露于未来传输机制被挑战， 或客户侧误用事件数据的风险。公司还用低责任上限在合同上限制自身财务敞口，并把所收集客户数据的合规责任放在客户身上。 PSA-2025-00001
              的公开披露又添了一层信任褶皱：问题虽已解决，公司也称目前没有有效安全公告， 但该公告确认曾存在跨团队查询可见性缺陷，且美国历史窗口的一部分无法完全核验。这正是高度受监管买方会记住的事件。
