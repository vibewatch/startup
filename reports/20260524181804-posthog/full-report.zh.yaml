        title: 资本充足性、回款纪律与仍未解决的阻碍
        blocks:
          - type: paragraph
            body: >-
              2025 年融资历史让 PostHog 看起来暂时资金充足，但只是暂时。官方口径是，公司 2025 年 6 月以 $920 million 估值融资 $70 million 新股资本；第三方报道后来称 Peak
              XV 领投一轮 $75 million 融资，估值 $1.4 billion。与此同时，官方 Series D
              文章和招聘页都明确员工流动性很重要，这意味着投资人不能假设每一美元披露融资都像纯新股一样延长现金跑道。运营计费文档提供了另一个有用但需要谨慎的视角。它们显示了正式回款控制：信用方案采用 Net 30
              开票，预付合同用银行转账结算，随用随付客户可重试四次，逾期付款者可能被暂停服务、退回免费层或被要求预付款。这对纪律是正面信号，但也提醒我们，收入运营可能带来流失或数据丢失风险。核心阻碍很直接：公开材料仍未披露现金、烧钱速度、现金跑道、毛利率、NRR
              或云与自托管组合。因此，财务结论是，模型看起来像软件公司，也可能具备资本效率，但当前资本充足性仍无法只靠公开证据完全承销。
