        title: 成本结构、公开牵引力下限与上市公司参照
        blocks:
          - type: paragraph
            body: >-
              尽管缺少审计视角，公开牵引力下限仍比许多私营同业更强。招聘页称收入已经超过每年 $50 million，手册未来页目标到 2026 年底达到 $100 million，Y Combinator 档案称收入月增约
              10%。官方表面还显示一系列规模信号：60,000+ 客户、190,254+ 团队、176k+ 历史注册、200+ 人团队和 25 个计划招聘名额。这些数据点确认了商业动能，但没有证明实际 ARR
              质量。成本侧，产品和计费文档暗示的是经典云软件成本基座：计算、存储、事件处理、回放留存、数据仓库行、AI 工作负载，以及庞大的
              R&D/支持表面。因此，合适的公开基准不是硬件或金融科技，而是高毛利开发者软件。Atlassian FY2025 报告显示毛利率 83%，R&D 占收入 51%，销售和营销占 22%。Datadog FY2025
              10-K 暗示毛利率约 80%，GTM 强度更高，约 28%，R&D 约 45%。这些数字有助于框定规模化软件平台可能长什么样，但它们是基准，不是 PostHog 事实。
