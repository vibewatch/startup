companyProfile:
  summary: >-
    PostHog 是一家私营、远程优先的软件公司，由 James Hawkins 和 Tim Glaser 于 2020
    年创立。公司从开源产品分析工具起步，已经扩展成更广的开发者优先平台，覆盖分析、回放、功能开关、实验、类数据仓库工具、CDP 式路由和 AI
    辅助工作流。公开证据支持其广泛的自助式、工程驱动分发动作，但还不足以给出承销最新私募估值所需的完整财务分母。
