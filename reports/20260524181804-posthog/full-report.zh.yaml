      - number: '5.2'
        title: 模块地图、架构与共享数据平面
        blocks:
          - type: paragraph
            body: >-
              PostHog 披露的运营栈多于许多私营软件公司。架构文档点名 Django 用于 Web 应用和 API，Rust 用于高吞吐捕获 / 功能开关 / 回放服务，Kafka 作为传输层，Celery 加
              Temporal 加 Dagster 处理工作进程，一个 Node.js CDP 工作进程，以及 ClickHouse/PostgreSQL/Redis/blob 存储作为核心数据平面。ClickHouse
              文档又把摄取模式具体化：Kafka-engine 表、物化视图、分布式表和分片位于事件捕获与查询负载之间。


              SDK 表面同样明确。浏览器侧文档展示了代码片段和包管理器安装路径、框架专用集成、可选扩展包、跨域追踪、回放触发器和命名实例；服务端功能开关文档则暴露多语言本地评估。结果是，PostHog
              的架构更像一个可观测数据与控制平面，而不是单一仪表盘产品：一个捕获层把分析、回放、功能开关、实验、数据仓库查询和下游 CDP 动作都喂给同一个共享底座。
