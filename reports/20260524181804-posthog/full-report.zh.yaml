  - id: TV003
    title: 当前融资与稀释背景
    columns:
      - 项目
      - 公开披露
      - 暗示什么
      - 稀释 / 悬挂风险解读
      - 仍未知
    rows:
      - - Series D（2025 年 6 月）
        - 官方披露由 Stripe 领投，$70M 融资，估值 $920M。
        - 成为独角兽前已有真实新股资金需求。
        - 根据投前 / 投后口径不同，稀释可能在个位数到低双位数。
        - 准确股数、证券类型和清算优先权。
      - - 据报道 Series E（2025）
        - 独立报道称，Peak XV 领投 $75M，估值 $1.4B。
        - 公司估值快速上台阶，进入独角兽区间。
        - 如果主要是新股，名义稀释可能看起来在中个位数，但公开证据不足以确认。
        - 估值是投前还是投后，以及谁出售了股份。
      - - 员工流动性 / 要约收购
        - 官方材料强调员工流动性，招聘页面也突出老股交易 / 要约收购。
        - 并非每一美元披露融资都应视为纯粹延长现金跑道。
        - 老股交易量能缓解创始人 / 员工压力，但不会一比一增加资产负债表现金。
        - 2025 年两轮中新股与老股的拆分。
      - - 优先股堆叠
        - 未找到公开股权结构表或条款包。
        - 仅靠公开证据无法干净建模回报测算。
        - 潜在优先权悬挂仍未知。
        - 清算顺位、参与权和投资人保护条款。
      - - 入场纪律含义
        - 当前名义价格必须对照公开可比公司质量判断，而不能只看产品质量。
        - 这一轮需要溢价级私营指标，或非常强的前瞻路径。
        - 作出投资判断前，需要更好价格或更强证据。
        - 董事会级 KPI 包和已签署条款清单。
    notes: 本表保留分母和条款缺口，不强行给出虚假的稀释点估计。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV041
      - CV052
  - id: TV004
    title: 可比估值表
    layout: wide
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public and private reference points most relevant to developer tools, product analytics, and current
        SaaS market discipline; not an exhaustive universe of software comps.
    columns:
      - 公司 / 参考
      - 状态
      - 当前分母或规模信号
      - 估值倍数 / 价格背景
      - 重要性
      - 关键限制
    rows:
      - - PostHog
        - 私营
        - 官方 >$50M 收入下限；Sacra 估计 2026 年 2 月 ARR 为 $57.5M
        - 基于官方下限为 <$28x；按 Sacra 估计，在 $1.4B 估值下约 24x
        - 标的公司；显示当前价格多大程度押注未来执行。
        - 没有公开 NRR、毛利率、股权结构表或经审计分母。
      - - Datadog
        - 上市
        - FY2025 收入 $3.427B；Q1 2026 收入 $1.006B
        - SaaSValuation.io 显示 18.3x ARR
        - 高溢价上市开发者工具参照，公司增长强，披露达到监管文件级透明度。
        - 规模大得多，可观测性版图也比 PostHog 更广。
      - - Atlassian
        - 上市公司
        - FY2025 收入 $5.215B；毛利率约 83-85%
        - 隐含收入倍数为低个位数
        - 说明即便是超大 PLG 软件平台，交易倍数也可能远低于高溢价开发者工具区间。
        - 协作 / 生产力套件，并非纯分析可比公司。
      - - Amplitude
        - 上市公司
        - FY2025 收入 $343M；2026 Q1 收入 $93.5M
        - 隐含收入倍数约 2.3x
        - 最接近的上市产品分析品类可比公司。
        - 平台更窄，增长也慢于 PostHog 的私募叙事。
      - - 2026 SaaS 基准区间
        - 市场参照
        - 上市 SaaS 中位数约 6x-7x；私募 SaaS 为 3x-7x ARR，中位数 4.5x
        - 全部 SaaS 平均约 10.4x，但分布很散
        - 为单一公司之外的后期估值纪律提供参照。
        - 不是直接经营可比组。
    notes: 可比行故意混合类别接近度和披露质量，因为判断一轮私募估值时，两者都重要。
    claimRefs:
