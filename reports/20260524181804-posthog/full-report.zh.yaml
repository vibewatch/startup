      - number: '8.4'
        title: 建议、信心、退出准备度和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，不是因为 PostHog 缺产品质量，而是因为公开证据还不足以支撑有纪律地支付当前价格。 这正是那类“公司可能好，但估值可能错”的标的：平台范围宽、PLG
              分发强、投资人质量也真实。但承销缺口仍太大。 投资者不知道两轮 2025 融资后的实际股权结构堆叠，不知道新股和老股的精确拆分，不知道超过 90% 公司免费这个基数的付费转化质量，
              也不知道扩张中产品组合的利润率结构。因此，退出准备度仍在成形，而非成熟。如果公司弥合当前 >$50 million 下限与公开 $100 million 目标之间的差距，
              并披露接近上市公司口径的留存、利润率和可靠性指标，就有能力变得具备 IPO 条件。一旦信任事故反复、管理层严重错失 2026 目标，
              或后续融资把估值重置到当前名义估值之下，投资逻辑就会破裂。在这些关口变化前，价格纪律比欣赏更重要。
