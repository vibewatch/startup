  - id: TE005
    title: 信任 / 安全 / 合规控制表
    columns:
      - 控制 / 信号
      - 公开状态
      - 范围
      - 帮助点
      - 剩余限制
    rows:
      - - 隐私政策 + 自托管遥测退出
        - 公开且在线的法律文本
        - 托管服务、网站和自托管安装
        - 澄清控制者立场、遥测收集和退出路径
        - 政策文字不等于外部审计，也不等于逐产品控制图。
      - - 应用内 DPA 生成器
        - 在线公开预览加应用内执行路径
        - 处理者义务和会签 DPA 工作流
        - 为数据处理条款提供法律机制
        - 公开预览只供参考；具约束力的执行需要进入应用。
      - - 美国 / 欧盟托管姿态
        - 公开且在线的法律 + 产品定位
        - 美国区域、欧盟托管云使用德国、云提供商披露，以及区域感知 MCP 认证
        - 支持数据驻留和区域选择论证
        - 资料不包含底层架构证明或客户级部署图。
      - - 回放触发器和捕获退出
        - JS 文档有说明
        - 会话录制和用户级捕获行为
        - 帮助收窄数据收集，减少过度捕获
        - 围绕这些控制的精确运营默认值和审计日志未完全公开。
      - - 无活跃安全公告 + 安全公告计划
        - 公开维护的手册页面
        - 安全审计、披露流程和活跃状态页面
        - 体现安全透明度和流程成熟度
        - 当前页面不能替代安全白皮书或渗透测试摘要。
      - - PSA-2025-00001 修复
        - 已解决的中等级别公告
        - SQL 编辑器查询可见性问题
        - 展示通过 team_id 和测试变更完成的具体授权修复
        - 单个公告不能证明相邻授权缺陷不存在。
      - - 公开复盘计划
        - 活跃公开事故列表
        - 对客户或数据有直接影响的重大事故
        - 提升可靠性透明度
        - 留存资料只抓到索引，没有抓到每篇完整 RCA 正文和指标。
      - - 自托管无保证姿态
        - 文档明确说明
        - 支持、可靠性和运营者责任
        - 让云端与自托管的信任取舍更清楚
        - 这削弱了把自托管视为同等企业托管产品的论证。
    notes: 控制项最强的地方在透明度、法律框架和用户可配置的数据收集行为。准确的审计控制范围和自托管支持边界，仍比公司姿态声明更薄。
