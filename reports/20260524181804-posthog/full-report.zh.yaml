  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 公开证据
      - 依赖
      - 薄弱时的风险
    rows:
      - - 浏览器 + 服务端 SDK
        - 从应用端捕获事件、识别用户并评估功能开关
        - 文档和包注册表证据强
        - 客户端埋点质量、项目配置和 SDK 更新状态
        - 捕获质量差，会同时污染分析、回放和实验。
      - - Django Web 应用 / API
        - 面向用户的控制平面、API 和编排入口
        - 官方架构文档
        - PostgreSQL、Redis、工作器服务和认证
        - UI 和 API 不稳定，会削弱整个操作面。
      - - Rust 捕获 / 回放 / 功能开关服务
        - 高吞吐摄取和快速评估路径
        - 官方架构文档
        - Kafka、blob 存储和上游 SDK 行为
        - 这些服务一旦滞后或故障，核心产品闭环会快速劣化。
      - - Kafka 传输层
        - 连接摄取、存储和 CDP 处理的中央总线
        - 官方架构 + ClickHouse 文档
        - 生产者可靠性、topic schema 和消费者健康度
        - 队列积压或 schema 错误会波及分析和激活。
      - - ClickHouse 分析后端
        - 主分析存储和查询引擎
        - 官方 ClickHouse 文档
        - Kafka 消费者、物化视图、分片和查询设计
        - 查询隔离或摄取设计薄弱，会带来准确性和安全问题。
      - - PostgreSQL / Redis / blob 存储
        - 运营元数据、缓存，以及录屏 / 对象数据
        - 官方架构文档
        - 应用服务和工作器
        - 这些存储承载状态和回放资产，是面向用户产品的依赖。
      - - Celery / Temporal / Dagster 工作器
        - 短任务、可靠工作流和定时数据管道
        - 官方架构文档
        - 队列健康度、权限和管道定义
        - 工作流或管道故障会直接变成用户可见事故。
      - - CDP 工作器和目的地层
        - 转换入站事件并发送到下游工具
        - 官方架构和 CDP 页面
        - Kafka、映射、目的地 API 和质量规则
        - 转换错误或导出中断会破坏激活和下游信任。
    notes: 架构表只反映留存公开资料中明确可见的层。它不纳入隐藏内部服务，也不推断微服务边界。
