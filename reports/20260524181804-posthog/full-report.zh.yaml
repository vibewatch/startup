      - number: '5.5'
        title: 信任、隐私与质量控制——保留限定条件
        blocks:
          - type: paragraph
            body: >-
              信任姿态是 PostHog 记录得更好的领域之一。法律页面覆盖托管和自管理安装、在应用内执行 DPA、EU 与 US 托管，以及用户级捕获控制。官方比较页还提出 EU 托管、SOC 2、GDPR 就绪、HIPAA
              就绪，以及相关套餐 BAA 等主张。产品文档进一步说明，捕获和回放可以通过触发器或退出选项收窄。对于一个处理敏感事件数据的开发者优先产品，这些都是有意义的控制，不只是营销口号。


              但公开记录也把下行保留在明面上，本章就应该这样处理。安全公告页称今天没有活跃公告，却记录了一个已解决的 2025 年 SQL
              编辑器问题：该问题暴露了跨团队查询文本，并用具体授权术语解释了修复。公开事后复盘索引还单独列出最近发生在工作流、日志、回放和功能开关上的可靠性故障。自托管进一步放大了取舍：PostHog
              透明地说明客户可以自托管，但同样明确自托管实例没有保证，可能意味着数据丢失风险。因此，信任结论是透明度和控制为正面，但可靠性确定性只能算中等——尤其对自管理或高度监管买方来说，他们需要精确支持边界和经审计的范围文件，而不是姿态表述。
