      - number: '3.3'
        title: 切换成本、多栖使用、分发力与信任姿态
        blocks:
          - type: paragraph
            body: >-
              PostHog 最强的切换成本论点不是硬锁定，而是运营便利。如果一个团队能在一个登录入口、一份合同里买到分析、回放、功能开关、实验、问卷和数据管道，采购和实施摩擦都会下降。Cotera
              的比较明确描述了在同一个工程驱动栈里替换 LaunchDarkly 和 Fullstory。但同一证据也显示了护城河上限。PostHog 开源且可自托管，GrowthBook
              也是如此，因此部署控制帮助技术买方，也降低了离开厂商云的痛感。多栖使用仍然现实：团队仍可把 GA4 与回放搭配，或把分析与独立功能开关厂商搭配，或从 LaunchDarkly、Statsig、VWO
              购买专门的实验层。分发力也并不均衡。GA4 受益于 Google 的默认营销覆盖，LaunchDarkly 受益于企业治理和审批，Amplitude 受益于对 PM
              友好的工作流和高管报告。信任也由这条分裂塑造。PostHog 和 GrowthBook 借代码访问与部署选择建立信任，而既有 SaaS 对手借托管治理、审批和合规姿态建立信任。
