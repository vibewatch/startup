      - number: '1.3'
        title: 融资历史、投资人图谱与资本策略
        blocks:
          - type: paragraph
            body: >-
              PostHog 的公开资本历史显示，公司从种子轮到独角兽估值爬升得异常快，同时把主要融资故事绑定在产品宽度和创始人控制上。手册时间线记录了 2020 年 4 月 $3.025M 种子轮、2020 年 12 月
              GV 领投的 $9M Series A，以及 2021 年 6 月 Y Combinator 领投的 $15M Series B。更近的资本形成则由官方 Series D 文章和 2025
              年新闻报道支撑。2025 年 6 月，PostHog 称其完成 Stripe 领投的 $70M 融资，估值 $920M，同时提到较小的 Series C 式新股部分和扩大后的员工流动性安排。到 2025 年 9
              月，独立报道称 Peak XV 领投 $75M Series E，估值 $1.4B，把 PostHog 推入独角兽行列。反复出现的投资人名字很重要：YC、GV、Stripe、Peak XV、1984
              Ventures 和 Formus Capital 都是可信度锚点。公司的招聘页也强调老股交易和要约回购，说明管理层不只用融资轮支持扩张，也在降低员工对近期退出的压力。
