      - number: '2.4'
        title: 增长驱动、采用约束与仍需证明的事项
        blocks:
          - type: paragraph
            body: >-
              几乎所有来源都指向同一个主增长驱动：软件增长越来越取决于理解产品内行为，而不是继续购买更多漏斗顶端流量。Mixpanel 的 2026 年基准文章认为，增长已经移入产品内部，激活和留存比原始获客更重要。Grand
              View 和 Mordor 补充了结构性原因：云原生交付降低部署摩擦，AI 和自助分析提高了丰富行为数据的价值，监管收紧后，隐私安全的增强能力和区域数据托管选项更重要。PostHog 自己的 GA4
              和客户页面展示了这个论点的运营侧：工程师想要更少的割裂工具、更少手工埋点，以及更好地处理广告拦截器、cookies 和下游激活。约束同样可见。Mixpanel 提到，实验需要足够流量和清晰假设；dbt
              强调数据质量差是最常见挑战；Forrester 称市场本身正在在开发者主导的功能管理和产品主导的实验之间分裂。合起来看，采用应会继续增长，但买方教育、数据治理和市场定义模糊会继续影响品类扩张速度。
