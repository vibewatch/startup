  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              定义 PostHog 市场的最干净方式，是把它看作开发者优先的产品智能栈，而不只是单一分析品类。PostHog 自己的产品、Product OS、CDP
              和竞品比较页面显示，公司想捕获过去分散在网站分析、产品分析、会话回放、功能管理、实验、类数据仓库集成和行为激活工具上的预算。因此，最相关的市场边界应包括用于埋点用户行为、分析行为、在产品内采取动作，并把数据路由到运营系统的软件。广义商业智能和通用营销云不应纳入，除非这些系统被拿来绕路承担产品埋点或客户旅程分析。最常见的现状替代仍是一套拼接栈：GA4
              负责流量，Amplitude 或 Mixpanel 负责产品分析，FullStory 负责回放，LaunchDarkly 或 Statsig 负责功能开关，再加上独立的数据或激活管道。PostHog
              的机会来自把这些品类压缩成一个工程友好的控制平面。
