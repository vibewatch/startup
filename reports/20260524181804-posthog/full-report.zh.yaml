      - number: '6.3'
        title: 具名客户证明扎实，且大多达到生产级，但新鲜度不均
        blocks:
          - type: paragraph
            body: >-
              PostHog 的具名客户证明明显强于通用 Logo 墙，因为最佳案例描述了活跃工作流、具名操作者和可衡量结果。Y Combinator 讨论其匹配产品上的实验；Hasura 和 Supabase
              描述具体分析、漏斗和增长工作流；Phantom 每天用 PostHog 监控可靠性和 DAU；ElevenLabs 把它接入发布、周留存检查和问卷；Arena
              用它在百万级用户规模上做实验护栏；ResearchGate 则依靠它在数亿会话上跑长达一年的算法测试。这些不是「工具不错」的轶事引语，读起来像对客户有实际重要性的运营部署。


              新鲜度仍不均衡。最强案例使用现在时，并提到当前产品或近期时间窗口，但许多页面没有暴露清晰发布日期或续约时间戳。因此，可从当前功能引用中方向性推断新鲜度，却无法像有日期的新闻稿或客户文件一样严格审计。生产级与试点的分类，对具名故事本身最强，对更广客户名册最弱。公开证据支持可访问具名引用大多是真实生产账户，但不足以证明更大的不可见基础具备同样深度、年龄或耐久性。
