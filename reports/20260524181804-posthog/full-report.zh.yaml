  - id: FV004
    title: 建议 KPI 快照
    type: kpi
    layout: standard
    summary: 公司在产品广度和市场相关性上得分较高，但承销卡点在分母质量和条款透明度。
    data:
      items:
        - label: 建议
          value: RESEARCH-MORE
          context: 不要在当前名义估值上追投新资金。
        - label: 信心
          value: Medium
          context: 证据足以判断价格偏满，但不足以承销完整业务栈。
        - label: 风险评级
          value: High
          context: 信任事件和隐藏的经济变量仍然重要。
        - label: 估值立场
          value: Full to expensive
          context: 当前价格已经押注牛市情景路径。
        - label: 官方收入分母
          value: '>$50M'
          context: 有助于设定下限，但不是完整的当前 ARR 披露。
        - label: 公开 2026 目标
          value: $100M
          context: 基准情景使用它；牛市情景需要跑赢它。
        - label: 关键缺失 KPI
          value: NRR / gross margin
          context: 溢价倍数能否成立取决于两者。
        - label: 关键缺失条款
          value: Preference stack
          context: 没有它，回报测算无法定稿。
    claimRefs:
      - CV048
      - CV049
      - CV050
      - CV052
      - CV053
      - CV054
      - CV056
