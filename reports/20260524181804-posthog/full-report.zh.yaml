      - number: '8.2'
        title: 估值背景、可比公司质量和入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资记录显示真实动能，也暴露分母问题。公开证据支持 2025 年 6 月官方 $70 million 融资、$920 million 估值， 之后独立报道又称公司以 $1.4 billion 估值融资 $75
              million。这次重估发生时，多位观察者都说后期 SaaS 投资已经比 2021 年高点更有纪律。 公开软件倍数仍高度分散，但市场不会宽容那些拿不出留存质量或利润率质量的公司。最相关的公开可比集不是泛消费软件，
              而是优质开发者基础设施和相邻分析品类的组合。Datadog 仍享受溢价倍数，因为它同时有强增长和监管文件级透明度。 Atlassian 规模巨大、毛利率优秀，但收入倍数低得多。Amplitude
              是最接近的公开品类类比，交易倍数只有低个位数。 PostHog 也许因为增长和产品宽度值得私人市场溢价，但当前名义价格已经要求投资者像业务已经拥有 Datadog 级市场支撑一样付费， 却没有 Datadog
              级披露。因此，入场纪律必须从两个条件开始：价格明显更好，或证据明显更好。
