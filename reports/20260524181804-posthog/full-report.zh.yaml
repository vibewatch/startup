  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑很直接，也值得认真对待。PostHog 搭出了一个可信的开发者优先平台：用量计费透明、产品宽度足够、免费分发漏斗很大，
              还有客户证据表明，团队能把实验和用户引导改进转化为可衡量的业务结果。公司所在品类也仍被多家分析机构描述为十几个百分点中段到高段的 CAGR 增长， SlashData 的 48.4 million
              名全球开发者基数进一步说明技术买方池子足够大。换句话说，PostHog 有一条可信路径， 可能长成有规模的 PLG 开发者基础设施公司，而不只是小众分析工具。反向逻辑是，当前价格已经要求投资者承销这个结果，
              却没有给出公开市场要求的分母质量。最新报道的 $1.4 billion 融资，无法和已披露 ARR 基数、NRR、毛利率或干净股权结构表对照。 只用官方 >$50 million 收入下限，倍数也不低于约
              28x；即使用 Sacra 的 2026 ARR 估计，仍约 24x。 这个水平高于 Datadog 的公开市场溢价倍数，也远高于 Atlassian 或 Amplitude。在这个价格上，PostHog
              不只是产品质量下注； 也是对转化质量、利润率质量和治理质量的下注。
