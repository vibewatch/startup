      - number: '6.5'
        title: 扩张路径可见，但集中度、独占性和证明质量风险仍未关闭
        blocks:
          - type: paragraph
            body: >-
              扩张证据是真实的。PostHog 的套件已经明显铺得很宽，多家具名客户称使用场景从核心分析延伸到功能开关、回放、调研、AI、可观测性， 或更深的产品埋点。Exa 把更多分析栈集中到
              PostHog；ResearchGate 的使用规模已经需要定制打包和专人支持。这条公开扩张路径最清楚： 先以低摩擦自助切入，再在团队内铺开，随后带动更多模块采用；部分大客户再叠加企业级支持。这个路径也符合
              Sacra 的判断： 用量计费先扩大工程团队采用面，再随事件量和产品挂载扩张。


              未解决的风险在于，公开证据仍回答不了客户集中度和钱包份额问题。公开样本明显偏向 AI、创业公司和开发者主导客户。 Lovable 明确说自己在 PostHog 之外还同时使用多家可观测性厂商；这能证明
              PostHog 被真实使用， 但也提醒我们：生产环境使用不等于供应商独占标准化。G2 也暴露出崩溃和文档上的产品质量担忧。最关键的是， PostHog
              没有公开大客户收入占比、付费客户组合或续约经济性。因此，本章对客户喜爱度和扩张潜力给正面结论， 但对集中度，以及公开客户样本是否能代表全基数的货币化留存，仍需谨慎。
