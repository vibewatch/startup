  - id: TV005
    title: 情景假设表
    columns:
      - 情景
      - 概率信号
      - 2027 收入假设
      - 倍数区间
      - 隐含价值区间
      - 必须成立的前提
    rows:
      - - 悲观
        - 真实风险情形
        - 75M-90M
        - 5x-7x
        - 0.4B-0.6B
        - 免费用户转付费不及预期、信任成本上升，且公开市场不给予高溢价区间。
      - - 基准
        - 公开证据下最平衡的情形
        - 100M-120M
        - 7x-10x
        - 0.7B-1.2B
        - 管理层达到或小幅超过公开目标，但仍缺少 Datadog 式高溢价指标。
      - - 乐观
        - 需要溢价证据
        - 130M-160M
        - 10x-14x
        - 1.3B-2.2B
        - PostHog 显著超过公开计划，并证明一流的留存、转化和利润率质量。
    notes: 情景只是基于公开证据和明确分母假设的估值区间示意；它们不能替代真实数据室后的逐项建模估值。
