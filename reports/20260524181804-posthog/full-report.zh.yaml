    type: stack
    layout: wide
    summary: 产品栈把采集接口和共享数据基础设施垫在底层，上面承载分析、控制、激活和 AI 工作流。
    approximationNotes: 层级按功能角色分组，不按内部归属或计费 SKU 边界分组。
    data:
      layers:
