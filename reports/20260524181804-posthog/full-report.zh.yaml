      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方证据指向多线程采购动作，而不是单一画像。PostHog
              的客户故事显示，工程和产品团队经常主导采用，因为他们负责埋点、漏斗、实验和发布质量。但同一批案例也显示，平台嵌入后，领导层、UX、营销和数据角色都会成为相邻用户。Y Combinator 在 Startup
              School 和 Co-Founder Matching 中使用 PostHog，领导层、产品和工程都参与其中。Hasura 从工程主导的新用户引导分析起步，随后扩展到 UX
              和营销。竞品和相邻平台页面进一步强化了这个模式：VWO 明确面向产品经理、工程师、增长营销和 UX/分析团队；Statsig 的客户引语来自数据工程、CTO、PM 和工程角色；Forrester
              认为功能管理仍由开发者主导，而实验越来越服务产品和体验设计人群。实际含义是，初始用户常常是技术角色，但随着更多团队消费数据或使用控制能力，预算和续约逻辑会变成交叉职能问题。
