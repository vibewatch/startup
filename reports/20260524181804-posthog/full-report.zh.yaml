  - id: FE003
    title: 部署 / 集成流
    type: dag
    layout: wide
    summary: PostHog Cloud 是首选运行路径；自托管仍是同一产品的一条分支，但由客户自己运营，支持和规模假设也不同。
    approximationNotes: 这张依赖地图强调部署选择和集成端点，不强调法律实体结构，也不穷尽每条内部服务边。
