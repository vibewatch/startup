      - number: '2.2'
        title: 规模测算视角：先看产品分析，再看更广的数据工具
        blocks:
          - type: paragraph
            body: >-
              公开市场规模来源没有收敛到一个精确数字，但方向一致：产品分析已经是有意义的软件品类，仍在以健康的双位数速度增长。Grand View、Expert Market Research 和 Mordor
              都把当前市场描述为低双位数到高双位数十亿美元级别，预测 CAGR 从大约中双位数到约 20% 不等。这些差异更多来自方法和年份，而不是对方向的分歧。Grand View 采用更宽的 2024
              年基数，给出最高当前值；Expert 使用 2025 年数值并拉长预测周期；Mordor 则锚定 2026 年市场规模估计，并按企业规模和部署方式做额外拆分。StartUs
              提供了有用的外沿边界：更宽的高级分析相邻市场远大于产品分析本身，这很重要，因为 PostHog 正在向数据仓库、激活和工作流用例扩张。另一条 SAM 视角来自开发者人口数据：SlashData 估计全球有
              48.4 million 名开发者，提醒我们开发者中心型分析和实验的买方基础远大于传统只面向产品经理的工具。
