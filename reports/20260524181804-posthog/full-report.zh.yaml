      - CV048
      - CV049
      - CV050
      - CV052
      - CV053
      - CV054
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观情景
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 平台广度
        - Product OS 的广度支持整合多条产品工作流。
        - 广度也可能掩盖过多产品面带来的毛利复杂性和可靠性拖累。
        - 按产品披露毛利率，并按产品面展示稳定可靠性。
      - - 变现
        - 透明按量计价支持 PLG 采用和落地后扩张。
        - 90%+ 免费基数意味着，logo 数本身不能证明付费经济性。
        - 披露免费转付费和产品附加率。
      - - 市场背景
        - 独立报告仍显示品类双位数增长和庞大开发者 TAM。
        - 公开可比公司的纪律重置后，市场增长不保证溢价倍数。
        - 展示高质量留存和高效增长。
      - - 公开可比公司支撑
        - Datadog 证明高溢价开发者工具倍数仍然存在。
        - Atlassian 和 Amplitude 说明，当规模、成熟度或品类质量不同，倍数压缩会很快。
        - 让可比公司集合更接近高溢价开发者工具，而不是分析软件。
      - - 资本策略
        - 投资人反复支持，且 2025 年估值上台阶，说明融资动能真实。
        - 优先股堆叠、新股与老股拆分、真实稀释仍未披露。
        - 打开股权结构表和 2025 年条款清单。
      - - 退出路径
        - 如果 PostHog 达到 $100M+ 收入并披露上市级 KPI，未来 IPO 有可能。
        - 信任事件或增长失手会快速推迟或缩小退出选项。
        - 维持可靠性并完成收入里程碑。
    notes: 反向逻辑主要针对价格质量和披露质量，不是否认产品价值。
    claimRefs:
