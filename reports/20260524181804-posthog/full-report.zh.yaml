      - number: '4.2'
        title: GTM 动作与销售效率代理证据
        blocks:
          - type: paragraph
            body: >-
              PostHog 不披露 CAC、回本周期或 NRR，因此公开材料中读销售效率，最好看动作和客户行为，而不是财务比率。这个动作很强地呈现产品驱动、工程优先。官方页面强调透明定价和无需销售介入的接入，计费 FAQ
              称，潜在客户通常先免费启动并观察用量，反而能得到更好的支出估计。客户证明方向上也一致。Y Combinator 称 PostHog 比 Google Analytics 捕获多 30% 的数据，看重与工程师直接
              Slack 沟通，并用实验带来 40% 更多消息和 35% 更多接受请求。Hasura 称 PostHog 驱动的新用户引导调整让转化率提升 10-20%，使用也从工程扩展到 UX
              和营销。这些是可信的落地扩张信号，但仍是代理。它们没有告诉我们混合付费转化、自助到销售辅助的转化率，或增长中有多少来自单账户用量提升、多少来自更多付费账户。公开证据支持低摩擦采用和清晰客户价值，但还不能构成完整的单位经济模型。
