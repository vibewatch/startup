  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层在工程驱动产品里最强，但公开客户数含义模糊
        blocks:
          - type: paragraph
            body: >-
              PostHog 可见的客户证明集中在快速构建和发布软件的团队。可访问的具名案例聚集在 Y Combinator 的创始人产品、Hasura 和 Supabase 的开发者基础设施、Phantom
              的加密应用、ElevenLabs 和 Lovable 的 AI 产品、Arena 的模型比较平台、Exa 的 AI 搜索 API，以及 ResearchGate
              的科研网络。贯穿这些案例，反复出现的买方和日常用户是产品、工程、增长，有时还有营销团队，而不是经典集中采购部门。这个画像与 PostHog 自身作为工程师「Product
              OS」的定位吻合，也解释了为什么产品常常通过埋点、实验和运营调试被采用，而不是通过自上而下的 CIO 指令进入。


              不过，规模披露需要谨慎处理。PostHog 官方页面使用了几种不同单位：关于页称 190254+ 个团队，同一页称超过 190254+ 个客户和近 25 万名工程师，定价页称 60000+ 个客户。定价页还称超过
              90% 的公司免费使用产品。这些表述方向上都支持广泛自助式足迹，但不能直接比较，也不能读成干净的付费客户阶梯。正确尽调立场是，PostHog
              几乎肯定拥有很宽的漏斗顶端采用，但公开材料没有干净区分公司、团队、用户、注册、免费账户和付费客户。
