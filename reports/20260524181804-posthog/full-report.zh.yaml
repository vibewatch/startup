chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台边界与公开定位
        blocks:
          - type: paragraph
            body: >-
              PostHog 自己的公开页面已经呈现出一个远比 2020
              年起步时的开源分析工具更宽的业务。关于页、产品页、定价页和战略页都把公司框定为开发者优先平台：产品分析、会话回放、功能开关、实验、问卷、类数据仓库基础设施、AI
              可观测性和工作流自动化被放在同一个地方。这个统一定位很关键，因为它解释了公司的分发模型和资本故事：PostHog 想先用慷慨的免费层切入工程师，再把原本分散在多个点状工具上的预算整合过来。公司也把透明度当作产品和
              GTM 资产来经营，明确称代码库开源、手册公开、定价完全发布。后续章节可据此建立基线：PostHog 不是小众分析厂商，而是一个更宽的开发者基础设施平台，目标是成为产品和客户上下文的事实记录系统。
