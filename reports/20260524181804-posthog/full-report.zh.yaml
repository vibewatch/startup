      - number: '6.4'
        title: 耐久性代理信号有利，但没有正式留存披露
        blocks:
          - type: paragraph
            body: >-
              审阅的客户资料包没有公开 NRR、GRR、流失、合同期限或续约率披露，因此无法直接用公开证据承销耐久性。公开记录能提供的是一组有用代理。Y Combinator 在多个面向创始人的产品中使用
              PostHog；Phantom 每天在每周全员会中使用，并把功能开关当作运营安全控制；ElevenLabs 在广泛推出功能前监控周留存；Arena 把留存和回访行为称作北极星指标；ResearchGate 基于
              PostHog 跑了长达一年的信息流模型测试，并与专家支持互动。这些都是可信信号，说明产品嵌入了重复工作流，而不是偶尔用于一次性分析。


              独立满意度证据有支持性，但仍不完整。G2 在 950 条评论上的 4.5/5 评分，对熟悉度和覆盖宽度是正面信号；Sacra 的商业模型框架也符合落地扩张型 PLG
              动作。但评论评分不是续约指标，即便最好的公开证明集合，也很少说明客户是否续约、扩张合同价值，或完全替代竞品。正确解读是建设性但谨慎：公开证据支持重复使用和多产品扩张，但在 PostHog
              披露队列经济性或给出一致付费客户指标前，客户耐久性仍是管理层会议室问题。
