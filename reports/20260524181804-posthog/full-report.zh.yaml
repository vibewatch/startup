  - id: TV006
    title: 打破投资逻辑的触发项清单
    columns:
      - 触发项
      - 阈值或事件
      - 为什么重要
      - 行动含义
    rows:
      - - 信任倒退
        - 再次发生重大安全或数据丢失事件
        - 信任变弱时，高溢价软件倍数会很快压缩。
        - 暂停承销，直到补救措施和客户影响明确。
      - - 增长落空
        - 管理层明显未达到公开 2026 收入目标
        - 当前价格已经依赖强劲的远期增长。
        - 把情景重置到悲观侧，并重新审视估值。
      - - 留存不及预期
        - 私下 NRR 或流失数据低于高溢价区间常模
        - 高溢价私募 ARR 倍数需要强扩张质量。
        - 未重新评级前，不应支付溢价倍数。
      - - 轮次重置
        - 后续轮次或老股交易价格显著低于 $1.4B
        - 这会直接证伪当前定价逻辑。
        - 将当前轮次视为完全减记，并重新评估。
      - - 股权结构悬置风险
        - 优先股堆叠或老股占比高的结构比预期更差
        - 即便经营执行扎实，回报数学也可能失效。
        - 重新接触前，按完整条款建模下行情景。
    notes: 该清单聚焦会推翻当前价格支撑的事件，而非泛化的经营噪音。
    claimRefs:
      - CV041
      - CV042
      - CV047
      - CV051
      - CV052
  - id: TV007
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和条款
        - 当前股数、证券类型、清算优先权、参与权、按比例认购权
        - 这些输入决定回报数学和下行保护。
        - 索取最新股权结构表和已签署条款清单。
      - - 新股与老股拆分
        - 2025 年每轮融资中实际进入资产负债表的金额，以及流向出售股东的金额
        - 现金跑道和稀释不能只靠新闻标题推断。
        - 审阅交割备忘录和资金流向表。
      - - 留存质量
        - 按产品和客户细分划分的 NRR、总流失率和队列扩张
        - 高溢价倍数需要证明增长质量可持续。
        - 审阅董事会 KPI 包和客户队列表。
      - - 付费转化
        - 免费转付费转化率、附加率和大客户货币化路径
        - 90%+ 的免费用户基数会改变 logo 转化为企业价值的方式。
        - 检查账单队列和 PLG 漏斗分析。
      - - 毛利率
        - 云毛利率、自托管 / 云混合，以及按产品线拆分的基础设施成本
        - 没有分母和利润率质量，就无法做上市可比比较。
        - 索取财务桥表和托管成本分摊。
      - - 可靠性 / 信任
        - 2025-2026 事故后企业客户留存，以及事后复盘趋势线
        - 信任冲击能迅速改变退出时点和折现率。
        - 抽样受影响账户，并查看事故跟进报告。
    notes: 这些索取项是把公开证据视角转成可定价承销案例所需的最低数据集。
    claimRefs:
      - CV052
      - CV053
      - CV054
