      nodes:
        - id: browser
          label: 浏览器 / 应用 SDK
          detail: JS 和服务器 SDK 采集事件、回放和功能开关。
        - id: cloud
          label: PostHog Cloud US/EU
          detail: 规模化、托管运维和区域感知认证的推荐路径。
        - id: selfhost
          label: 自托管 Docker 业余部署
