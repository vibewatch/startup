      - 公开入门价 / 免费档
      - 计量单位或打包模式
      - 入门档覆盖宽度
      - 公开不透明度
      - 影响
    rows:
      - - PostHog
        - 免费；各产品免费额度之后按用量计费
        - 事件、录制、功能开关请求、行数和其他产品单位
        - 超额计费前已包含多个核心产品
        - 低
        - 最适合想先广泛试用、再付费的团队
      - - Mixpanel
        - 每月 1M 事件以内永久免费
        - 分析事件，Growth 按用量计费
        - 付费扩容前包含核心分析和有限回放
        - 自助部分不透明度低；Enterprise 定制
        - 分析经济性直观，但额外规模仍转向用量驱动
      - - Amplitude
        - 免费档，Plus 每月 $49
        - 按席位和产品套件打包，更高档位定制
        - 分析优先套件，实验、回放和 AI 功能可见
        - 中等不透明度，因为更高档位定制
        - 入门门槛可达，但企业 TCO 需要实时报价验证
      - - Heap
        - 每月 10k 会话以内免费入门
        - 入门按会话计费，更高档位定制打包
        - 分析优先；回放附加项和数据仓库功能上移到高端
        - 中
        - 自动捕获取向买方的好起点，但可比套件经济性没那么透明
      - - Fullstory
        - 申请报价 / 演示
        - 按套餐类别打包，没有公开自助美元标价
        - 按角色划分的行为数据和分析套餐
        - 高
        - 不走销售流程，更难与用量型套件对标
      - - LaunchDarkly
        - Developer 免费起步
        - 按套餐计价，并提供定制企业价格
        - 以运行时控制和实验切入，不含完整分析 OS
        - 入门以上中高不透明度
        - 对治理优先买方有吸引力，但价格无法直接与分析套件对比
      - - Statsig
        - Developer 档含 2M 计量事件免费
        - 按用量计量事件和曝光
        - 入门即包含功能开关、配置、实验和分析
        - 入门档不透明度低
        - 对实验密集团队，自助经济性进攻性强
      - - GrowthBook
