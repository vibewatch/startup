      - number: '5.4'
        title: 差异化：一个数据 / 控制平面，再叠加 AI 辅助工作流
        blocks:
          - type: paragraph
            body: >-
              PostHog 最强的产品差异化不是某个孤立模块，而是各模块共享同一个数据平面的方式。Product OS、公开代码仓库和 GA4
              比较都指向同一条判断：分析、回放、功能开关、问卷、SQL、数据仓库查询和数据激活应该放在一起，因为工程师想在一个地方发布和调试，而不是对齐多个厂商。MCP 把这个判断延伸到更新的工作流。PostHog
              不把分析只当作仪表盘目的地，而是暴露一个 MCP 服务器，让 Cursor、Claude Code、Codex、VS Code 和 Zed 等 AI 原生开发者工具能访问项目数据和产品动作。


              不过，这个套件没有消除专业化风险。Forrester 认为功能管理和实验正在按人群分化，Mixpanel 认为 AI 正把门槛从「报告」抬到「决策支持」。因此，正确解读需要分层：PostHog
              通过共享数据、SQL、捕获、控制和 AI 访问，具备可信的平台级差异化；但部分买方仍会按工作流评估最佳单项深度，而不是天然奖励套件宽度。开发者信号在这里仍是正面：公开代码仓库、npm 包和 Python
              包都显示当前仍在积极发布的表面，而不是一个封在闭源商业核心外面的冻结开源壳。
