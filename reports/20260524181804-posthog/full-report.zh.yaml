        - 云优先指引和部分评论摩擦已经公开
        - 在支持和 SLA 边界更清楚前，限制上行情景中的高端市场扩张假设。
    notes: 这些阈值是投资人启发式指标，不是合同约束。它们用于把公开信号转成决策点，而不是预测精确财务结果。
