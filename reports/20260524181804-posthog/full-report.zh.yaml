        title: 直接同业、相邻控制平面与现状替代
        blocks:
          - type: paragraph
            body: >-
              PostHog 面对的不是一个镜像式竞争对手。分析侧最接近的直接同业是 Mixpanel、Amplitude、Heap 和 Fullstory，它们都已从经典事件图表向会话回放、实验或 AI
              辅助分析的某些组合延伸。第二组竞争的是发布控制和实验预算：LaunchDarkly、Statsig、GrowthBook，以及现在承载在 Harness FME 内的 Split
              能力。第三组并非直接同业，却仍然赢得同一个买方任务：Google Analytics 仍是免费、默认的营销和网站分析选项，VWO
              销售优化和实验但没有变成完整开发者数据栈，内部自建或仓库原生方案对想控制存储、部署或成本的技术团队仍有可信度。按类别拆分很重要，因为当买方想要一个工程主导平台时，PostHog
              能赢；但买方只要满足于专业层或现状栈，PostHog 就会输。
