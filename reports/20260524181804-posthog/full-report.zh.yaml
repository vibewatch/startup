        - id: f3
          label: 分母质量门槛
          detail: 公开数据只能把收入框在当前 >$50M、2026 年底 $100M；ARR 仅有一个外部估计。
        - id: f4
          label: 公开可比公司门槛
          detail: Datadog 享受溢价，Atlassian 和 Amplitude 便宜得多，后期 SaaS 倍数也更克制。
        - id: f5
          label: 风险门槛
          detail: 即便产品质量仍高，信任事件和股权结构不透明也可能压缩价值。
        - id: f6
          label: 建议
          detail: 继续研究；没有更强证据或更好价格，不要在 $1.4B 估值上追投新资金。
      edges:
        - from: f1
          to: f2
          label: 市场有吸引力 → 继续
        - from: f2
          to: f3
          label: 公司强 → 核对分母
        - from: f3
          to: f4
          label: 分母不完整 → 谨慎对标
        - from: f4
          to: f5
          label: 可比公司差距 → 加风险折价
        - from: f5
          to: f6
          label: 价格还撑不住
    claimRefs:
      - CV015
      - CV020
      - CV021
      - CV024
      - CV025
      - CV043
      - CV048
      - CV049
