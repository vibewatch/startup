  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险登记表
        blocks:
          - type: paragraph
            body: >-
              PostHog 的剩余风险不是一个孤立红旗，而是一组模式。公司公开披露了真实的隐私、安全和可靠性控制，但也公开记录了足够多的反向证据， 说明运营和信任风险并非理论问题。最重要的风险簇是安全和可靠性叠加：2025
              年 11 月 npm 供应链遭入侵 5 小时， 2026 年 2 月确认发生日志数据丢失，以及一串公开事故复盘，覆盖工作流、功能开关、回放、调研和数据库迁移问题。 这段历史比任何单个漏洞更重要，因为
              PostHog 正从分析扩展为更宽的 Product OS，组件更多、软件包暴露面更广、下游集成也更多。 投资含义是，企业信任才是需要承销的稀缺资产，不只是功能宽度。隐私传输和法律角色分配风险排在其次；
              随后是围绕 GitHub 或 npm 的依赖风险，以及在 2026 年内把 90%+ 免费基数转化为 $100M ARR 目标的商业模式风险。
