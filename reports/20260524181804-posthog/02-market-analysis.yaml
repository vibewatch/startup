  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market estimate methodology
    missingEvidence: Public market estimates use different base years, segment definitions, and forecast horizons, so they cannot be averaged into a clean single TAM without adjustment.
    whyItMatters: Valuation work later in the report needs a range with methodology context, not a false precision midpoint.
    diligencePath: Choose one external methodology as the anchor or rebuild TAM bottom-up from target customers and pricing assumptions.
    relatedQuestionRefs:
    - QM005
  - type: private-evidence-only
    severity: material
    topic: budget owner
    missingEvidence: Customer stories identify users and champions, but they do not disclose who ultimately owned contract budgets or approved renewals.
    whyItMatters: Go-to-market efficiency and competitive displacement depend on whether the economic buyer is engineering, product, growth, or data.
    diligencePath: Request a sample of closed-won deals showing department ownership, contract size, and approval chain.
    relatedQuestionRefs:
    - QM010
  - type: private-evidence-only
    severity: material
    topic: privacy-sensitive demand
    missingEvidence: Public sources show privacy and residency matter, but they do not quantify how much demand comes from self-hosted or regulated buyers.
    whyItMatters: That distinction changes how durable PostHog's differentiation is against ad-tech-like or warehouse-native alternatives.
    diligencePath: Request customer mix by cloud region, self-hosted share, and regulated-industry concentration.
    relatedQuestionRefs:
    - QM017
  - type: missing-source
    severity: blocking
    topic: posthog som
    missingEvidence: No public source reviewed here cleanly isolates the directly addressable PostHog wedge inside overlapping analytics, experimentation, replay, and CDP categories.
    whyItMatters: A precise SOM is needed to translate category growth into realistic share assumptions for valuation.
    diligencePath: Build a bottom-up SOM using ideal customer counts, expected ARPU, and attach rates across PostHog's products.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: market diligence gaps
    missingEvidence: Public evidence does not fully resolve feature-management TAM, experimentation-specific spend, willingness-to-pay thresholds, or cloud-versus-self-hosted conversion patterns.
    whyItMatters: Those gaps affect how quickly integrated platforms can monetize beyond entry analytics use cases.
    diligencePath: Supplement public sources with customer interviews, pricing / contract data, and management disclosure before underwriting aggressive market-share assumptions.
    relatedQuestionRefs:
    - QM025
