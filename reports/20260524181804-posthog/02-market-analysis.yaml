callouts:
- calloutType: insight
  title: The real alternative is often a stitched stack, not a single vendor
  body: PostHog's opportunity is strongest where teams are tired of paying a coordination tax across analytics, replay, flags, experimentation, and data-routing vendors. That means market share can shift through consolidation even if standalone category TAMs stay fuzzy.
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM006
  - CM037
- calloutType: strength
  title: Integrated platforms benefit from product-led buying behavior
  body: Customer stories and benchmark pages consistently show engineers or product teams starting the motion, then pulling in UX, growth, data, and leadership once the data becomes useful. That pattern favors vendors with self-serve onboarding and broader product breadth.
  claimRefs:
  - CM008
  - CM009
  - CM021
  - CM028
  - CM029
  - CM038
- calloutType: risk
  title: Market definition remains a diligence problem, not just a storytelling choice
  body: 'Public sources describe overlapping but not identical categories: product analytics, experimentation, feature management, digital experience intelligence, CDP, and broader analytics engineering. Without discipline, that makes it too easy to overstate TAM or confuse adjacent demand with directly monetizable spend.'
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM014
  - CM026
  - CM027
  - CM039
