chapter:
  number: 2
  title: Market Analysis
  summary: PostHog sits at the intersection of product analytics, experimentation and feature management, session replay, and lightweight customer-data infrastructure, so the relevant market is broader than standalone analytics but narrower than generic data tooling. Public sizing sources cluster the standalone product analytics market in the low-to-high teens of billions today, while buyer evidence shows engineering-led instrumenters, product/growth consumers, and multi-threaded budget owners increasingly rewarding integrated platforms that reduce tool sprawl and shorten time to value.
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: 'The cleanest way to define PostHog''s market is as a developer-first product intelligence stack, not just a single analytics category. PostHog''s own product, Product OS, CDP, and comparison pages show that the company is trying to capture spend that historically sat across web analytics, product analytics, session replay, feature management, experimentation, warehouse-style data integration, and behavioral activation tooling. That means the most relevant boundary includes software bought to instrument user behavior, analyze it, act on it inside the product, and route it into operational systems. It excludes broad business intelligence and generic marketing clouds except where those systems are being used as workarounds for product instrumentation or customer-journey analysis. The most common status quo substitute is still a stitched stack: GA4 for traffic, Amplitude or Mixpanel for product analytics, FullStory for replay, LaunchDarkly or Statsig for flags, and then separate data
    or activation plumbing. PostHog''s market opportunity is created by collapsing those categories into one engineering-friendly control plane.'
  claimRefs:
