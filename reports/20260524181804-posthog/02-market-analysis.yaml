- id: sizing-lenses
  title: 'Sizing lenses: product analytics first, broader data tooling second'
  body: 'Public market-sizing sources do not converge on one exact number, but they are directionally aligned: product analytics is already a meaningful software category and is still growing at a healthy double-digit rate. Grand View, Expert Market Research, and Mordor all describe a current market in the low-to-high teens of billions of dollars, with forecast CAGRs ranging from roughly the mid-teens to about 20%. Those differences reflect methodology and vintage more than a disagreement about direction. Grand View uses a broader 2024 base and reports the highest current value, Expert uses a 2025 value with a longer horizon, and Mordor anchors on a 2026 market-size estimate with additional segment splits by enterprise size and deployment. StartUs provides a useful outer bound: the broader advanced analytics adjacency is much larger than product analytics alone, which matters because PostHog is expanding toward warehouse, activation, and workflow use cases. A separate SAM lens comes from
    developer population data: SlashData estimates 48.4 million developers globally, reminding us that the buyer base for developer-centric analytics and experimentation is much larger than classic product-manager-only tools suggest.'
  claimRefs:
