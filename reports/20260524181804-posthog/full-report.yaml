  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward and worth taking seriously. PostHog has assembled a credible
              developer-first platform with transparent usage pricing, broad product breadth, a large free-distribution
              funnel, and customer proof that teams can turn experimentation and onboarding improvements into measurable
              business outcomes. The company also sits inside a category that multiple analysts still describe as
              growing at a mid-teens to high-teens CAGR, while SlashData's 48.4 million global developer base reinforces
              the size of the technical buyer pool. In other words, there is a plausible path for PostHog to become a
              scaled PLG developer infrastructure company rather than just a niche analytics tool. The anti-thesis is
              that the current price already asks investors to underwrite that outcome without the denominator quality
              public markets demand. The latest reported $1.4 billion round is not being compared against a disclosed
              ARR base, NRR, gross margin, or clean cap table. Using only the official >$50 million revenue floor still
              yields a multiple no better than about 28x, and using Sacra's 2026 ARR estimate still implies roughly 24x.
              That is above Datadog's public premium multiple and far above Atlassian or Amplitude. At this price,
              PostHog is not just a product-quality bet; it is a conversion-quality, margin-quality, and
              governance-quality bet.
            claimRefs:
