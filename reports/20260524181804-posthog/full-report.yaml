  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and terms
        - Current share count, security type, liquidation preferences, participation, pro rata rights
        - These inputs determine return math and downside protection.
        - Request the latest cap table and executed term sheets.
      - - Primary vs secondary split
        - How much of each 2025 round actually went onto the balance sheet versus to selling holders
        - Runway and dilution cannot be inferred from headlines alone.
        - Review closing memos and funds-flow schedules.
      - - Retention quality
        - NRR, gross churn, and cohort expansion by product and customer segment
        - Premium multiples require proof that growth quality is durable.
        - Review board KPI pack and customer cohort tables.
      - - Paid conversion
        - Free-to-paid conversion, attach rates, and large-account monetization path
        - A 90%+ free base changes how logos convert into enterprise value.
        - Inspect billing cohorts and PLG funnel analytics.
      - - Gross margin
        - Cloud gross margin, self-host/cloud mix, and infrastructure cost by product line
        - Public comp comparison is impossible without denominator and margin quality.
        - Request finance bridge and hosting-cost allocations.
      - - Reliability / trust
        - Enterprise customer retention after 2025-2026 incidents and post-mortem trendline
        - Trust shocks can change exit timing and discount rates fast.
        - Sample affected accounts and incident follow-up reporting.
    notes: These asks are the minimum dataset needed to turn a public-evidence view into a priceable underwriting case.
    claimRefs:
      - CV052
      - CV053
      - CV054
