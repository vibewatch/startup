          detail: Public data only brackets revenue at >$50M today and $100M by end-2026, with one external ARR estimate.
        - id: f4
          label: Public comp gate
          detail: Datadog is premium, Atlassian and Amplitude are much cheaper, and late-stage SaaS multiples are disciplined.
        - id: f5
          label: Risk gate
          detail: Trust incidents and cap-table opacity can compress value even if product quality remains high.
        - id: f6
          label: Recommendation
          detail: RESEARCH-MORE; do not chase fresh capital at $1.4B without better evidence or better price.
      edges:
        - from: f1
          to: f2
          label: Attractive market → continue
        - from: f2
          to: f3
          label: Strong company → check denominator
        - from: f3
          to: f4
          label: Incomplete denominator → benchmark carefully
        - from: f4
          to: f5
          label: Comp gap → add risk discount
        - from: f5
          to: f6
          label: Price not yet justified
