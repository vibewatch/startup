      - number: '1.2'
        title: Founders, operating model, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The public founder narrative is unusually clear even though the broader governance picture is not.
              PostHog's handbook, Y Combinator profile, and third-party research all line up on a January 2020 founding
              by James Hawkins and Tim Glaser, with Hawkins presented as CEO and Glaser as CTO. Contrary's memo adds
              useful background: both met at Arachnys, and their complementary commercial-plus-technical experience
              helps explain why PostHog mixes strong product storytelling with deep technical orientation. The operating
              model is also explicit. Careers and external remote-work profiles describe a company built around small
              autonomous teams, async-first habits, and globally distributed hiring rather than office-centric
              management. At the same time, public governance disclosure is thinner than founder disclosure. Beyond
              founders and a small number of signatories such as VP Operations Charles Cook, there is no equally visible
              public board page or complete executive roster in the reviewed material. For diligence purposes, that
              means key-person dependence is real, and formal governance should be verified directly rather than
              inferred from brand strength alone.
