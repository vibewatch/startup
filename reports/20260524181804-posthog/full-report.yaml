              PostHog’s visible customer proof is centered on teams that build and ship software quickly. The accessible
              named stories cluster around Y Combinator’s founder products, Hasura and Supabase’s developer
              infrastructure, Phantom’s crypto app, ElevenLabs and Lovable’s AI products, Arena’s model-comparison
              platform, Exa’s AI search API, and ResearchGate’s scientific network. Across those stories, the repeated
              buyers and everyday users are product, engineering, growth, and sometimes marketing teams rather than
              classic centralized procurement departments. That profile matches PostHog’s own positioning as “Product
              OS” for engineers and helps explain why the product is often adopted through instrumentation,
              experimentation, and operational debugging rather than through a top-down CIO mandate.


              The scale disclosures, however, need careful handling. PostHog’s official pages use several different
              units: 190254+ teams on the about page, over 190254+ customers and nearly a quarter of a million engineers
              on the same page, and 60000+ customers on the pricing page. Pricing also says more than 90% of companies
              use the product for free. Those statements are directionally consistent with a broad self-serve footprint,
              but they are not directly comparable and should not be read as a clean paid-customer ladder. The right
              diligence stance is that PostHog almost certainly has wide top-of-funnel adoption, but public materials do
              not cleanly separate companies, teams, users, signups, free accounts, and paying customers.
