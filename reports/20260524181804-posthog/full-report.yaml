      - number: '3.4'
        title: Moat durability, commoditization risk, and where PostHog is most exposed
        blocks:
          - type: paragraph
            body: >-
              The adverse reading is straightforward: analytics, experimentation, and feature management are converging
              into a common capability layer, which reduces the chance that any one module stays proprietary for long.
              Forrester already frames feature management plus experimentation as one combined market, and vendor pages
              now show the same convergence in practice. GrowthBook is pushing open-source and low-cost experimentation.
              Statsig is bundling analytics with release control. Mixpanel and Amplitude are both extending beyond
              classic analytics. That leaves PostHog's moat resting less on any single feature and more on a specific
              combination: integrated developer workflow, transparent usage pricing, and open deployment control. Those
              are real advantages, especially for engineering-led startups, but they are not universal buyer priorities.
              Independent reviews also preserve two material adverse points: PostHog is not the easiest choice for
              non-technical PMs, and best-of-breed specialists still own some high-end use cases in replay depth,
              enterprise governance, or ecosystem default. The durability question is therefore segment-specific.
