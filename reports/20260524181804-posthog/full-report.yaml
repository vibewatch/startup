      - number: '7.3'
        title: Operational, reliability, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is best read through PostHog's own transparency. The public post-mortem list and
              independent status trackers show that incident pressure spans multiple components rather than a single
              isolated subsystem. The February 2026 logs incident is especially important because it combined confirmed
              customer data loss with a disclosure that backup depth for that newer product was limited to three days
              and that the logs cluster was materially less mature than the company's core data stack. The November 2025
              Shai-Hulud incident is even more serious from a trust standpoint: it showed that PostHog's software-supply
              chain could become a distribution vector for an ecosystem-wide npm worm. The company's response looks
              credible and detailed, but the event converted supply-chain security from a hypothetical posture question
              into a demonstrated failure mode. Review evidence also shows that some users experienced frequent crashes
              and documentation ambiguity, which is consistent with the broader story that product breadth can outrun
              reliability polish. The risk is not that PostHog hides its issues; the risk is that the issues span enough
              surfaces to matter for enterprise adoption.
