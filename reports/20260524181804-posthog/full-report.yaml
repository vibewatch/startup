      - number: '1.4'
        title: Scale signals, disclosure gaps, and issues to carry forward
        blocks:
          - type: paragraph
            body: >-
              Public scale signals are directionally strong but still inconsistent enough that later chapters should
              treat several metrics as ranges rather than settled facts. On the positive side, PostHog's about page says
              the platform is used by 190,254+ teams, the pricing page says more than 90% of companies use it for free,
              and the future page says management wants to reach $100M of annual revenue by the end of 2026. The
              handbook also shows historical hiring and revenue expansion, including 6x revenue growth in 2022 and
              headcount growth from 25 people in mid-2021 to 38 by the end of 2022. But the current-size picture is not
              cleanly corroborated. Careers and people pages imply a 200+ person company, while an external remote-work
              profile says the team is closer to 110. ARR is similarly mixed: Sacra publishes a 2026 estimate, yet the
              reviewed official pages do not disclose a canonical current ARR figure. Finally, PostHog's transparency
              cuts both ways: it publicly lists post-mortems and security advisories, which is positive culturally but
              also creates concrete risk markers, including a resolved 2025 query-visibility advisory and several
              2025-2026 customer-facing incidents that deserve dedicated treatment in the risks chapter.
