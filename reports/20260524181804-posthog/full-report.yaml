  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk register
        blocks:
          - type: paragraph
            body: >-
              PostHog's residual risk stack is led by a pattern rather than one isolated red flag. The company publicly
              discloses real privacy, security, and reliability controls, but it also openly documents enough adverse
              evidence to show that operational and trust risk are not theoretical. The most material cluster is a
              combined security and reliability risk: a five-hour npm supply-chain compromise in November 2025, a
              confirmed logs data-loss event in February 2026, and a public run of post-mortems spanning workflows,
              feature flags, replay, surveys, and database migration issues. That history matters more than any single
              bug because PostHog is expanding from analytics into a broader Product OS with more components, more
              package surfaces, and more downstream integrations. The investment implication is that enterprise trust,
              not just feature breadth, is the scarce asset to underwrite. Privacy-transfer and legal role-allocation
              risk rank next, followed by dependency risk around GitHub or npm and business-model risk from trying to
              convert a 90%+ free base into a $100M ARR target inside 2026.
