      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigations are real enough that this is not a blanket avoidance case. PostHog appears unusually
              transparent, publishes post-mortems and advisories, documents privacy roles, offers EU hosting and BAA
              support, and responded to the npm worm with tangible SDLC hardening. Those are meaningful positives
              because they improve both trust and diligence efficiency. But the right investment use of those
              mitigations is to sharpen monitoring, not to dismiss the downside. The public metrics worth watching are
              outage cadence, whether any new post-mortems or advisories appear, whether DPF participation remains
              active, whether review complaints about crashes or documentation worsen, and whether hiring and product
              sprawl continue to outpace the public ARR trajectory. The thesis breaks if PostHog suffers another
              material cross-tenant exposure, another supply-chain compromise, or a core-data loss incident outside the
              newer logs surface; any of those would undermine the argument that the company's culture of transparency
              is translating into a sustainably safer and more reliable platform.
