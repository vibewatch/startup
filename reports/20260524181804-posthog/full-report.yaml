companyProfile:
  summary: >-
    PostHog is a private, remote-first software company founded in 2020 by James Hawkins and Tim Glaser. It started as
    an open-source product analytics tool and has expanded into a broader developer-first platform spanning analytics,
    replay, feature flags, experimentation, warehouse-style data tooling, CDP-style routing, and AI-assisted workflows.
    Public evidence supports a broad self-serve and engineering-led distribution motion, but not the full set of
    financial denominators needed to underwrite the latest private valuation with high conviction.
  foundedDate: '2020-01-23'
  founders:
    - name: James Hawkins
      role: Co-founder, CEO
      background: >-
        Former Arachnys operator with commercial and product narrative credibility; remains the main public strategic
        voice.
      claimRefs:
        - CO003
        - CO004
    - name: Tim Glaser
      role: Co-founder, CTO
      background: Technical co-founder with deep product and engineering roots; central to architecture and developer credibility.
