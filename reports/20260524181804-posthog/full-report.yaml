      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Because PostHog does not publish a canonical current ARR denominator, the right way to frame valuation is
              as a forward scenario range rather than a false-precision point estimate. The bear case assumes the
              company misses its public ambition materially, grows into only $75 million to $90 million of 2027 revenue,
              and clears at 5x to 7x as late-stage SaaS investors punish missing retention or trust proof. The base case
              gives management the benefit of hitting or modestly exceeding the public $100 million ambition, but only
              awards 7x to 10x because public market discipline remains tight and premium bands still require stronger
              disclosure than we have today. The bull case assumes PostHog materially outperforms the public plan,
              sustains very strong monetization of its broad suite, and earns a 10x to 14x band similar to the strongest
              software names in a segmented market. On those assumptions, the current $1.4 billion headline already sits
              around the low end of the bull outcome rather than the middle of the base case. That does not prove the
              round is wrong, but it does mean new investors need unusually strong non-public proof before accepting it.
