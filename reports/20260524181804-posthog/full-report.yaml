      - number: '2.4'
        title: Growth drivers, adoption constraints, and what still needs proof
        blocks:
          - type: paragraph
            body: >-
              The main growth driver across nearly every source is that software growth increasingly depends on
              understanding behavior inside the product rather than buying more top-of-funnel traffic. Mixpanel's 2026
              benchmark write-up argues that growth has moved inside the product, with activation and retention
              mattering more than raw acquisition. Grand View and Mordor add the structural reasons: cloud-native
              delivery lowers deployment friction, AI and self-service analytics increase the value of richer behavior
              data, and privacy-safe enrichment plus regional data-hosting options matter more as regulation tightens.
              PostHog's own GA4 and customer pages show the operational side of that argument: engineers want fewer
              disconnected tools, less manual instrumentation, and better handling of adblockers, cookies, and
              downstream activation. The constraints are equally visible. Mixpanel notes that experimentation requires
              enough traffic and clear hypotheses; dbt highlights poor data quality as the most common challenge;
              Forrester says the market itself is fragmenting between developer-led feature management and product-led
              experimentation. Taken together, adoption should keep growing, but buyer education, data governance, and
              market-definition ambiguity will continue to shape the pace of category expansion.
