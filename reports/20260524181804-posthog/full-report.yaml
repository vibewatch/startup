chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and public positioning
        blocks:
          - type: paragraph
            body: >-
              PostHog's own surfaces now describe a much broader business than the open-source analytics tool it
              launched with in 2020. The about, products, pricing, and strategy pages consistently frame the company as
              a developer-first platform that combines product analytics, session replay, feature flags, experiments,
              surveys, warehouse-style data infrastructure, AI observability, and workflow automation in one place. That
              unified positioning matters because it explains both the company's distribution model and its capital
              story: PostHog is trying to win by landing early with engineers, giving them a generous free tier, and
              then consolidating spend that would otherwise sit across many point solutions. The company also leans
              heavily into transparency as a product and go-to-market asset. It explicitly says its codebase is open
              source, its handbook is public, and its pricing is fully published. That combination gives later chapters
              a clear baseline: this is not just a niche analytics vendor, but a broader developer infrastructure
              platform that wants to be the system of record for product and customer context.
            claimRefs:
