              and ResearchGate relies on it for year-long algorithm testing across hundreds of millions of sessions.
              Those are not anecdotal “nice tool” quotes. They read like operational deployments that matter to the
              customer.


              Freshness is still uneven. The strongest stories are current-tense and reference present products or
              recent time windows, but many of the pages do not expose clean publication dates or renewal timestamps.
              That means freshness can be inferred directionally from current feature references, yet it cannot be
              audited as tightly as a dated press release or a customer filing. Production-vs-pilot classification is
              therefore strongest for the named stories themselves and weakest for the broader customer roster. The
              public evidence supports that accessible named references are mostly real production accounts, but it does
              not support a claim that the larger unseen base has the same depth, age, or durability.
