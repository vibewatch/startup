  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define PostHog's market is as a developer-first product intelligence stack, not just a
              single analytics category. PostHog's own product, Product OS, CDP, and comparison pages show that the
              company is trying to capture spend that historically sat across web analytics, product analytics, session
              replay, feature management, experimentation, warehouse-style data integration, and behavioral activation
              tooling. That means the most relevant boundary includes software bought to instrument user behavior,
              analyze it, act on it inside the product, and route it into operational systems. It excludes broad
              business intelligence and generic marketing clouds except where those systems are being used as
              workarounds for product instrumentation or customer-journey analysis. The most common status quo
              substitute is still a stitched stack: GA4 for traffic, Amplitude or Mixpanel for product analytics,
              FullStory for replay, LaunchDarkly or Statsig for flags, and then separate data or activation plumbing.
              PostHog's market opportunity is created by collapsing those categories into one engineering-friendly
              control plane.
            claimRefs:
