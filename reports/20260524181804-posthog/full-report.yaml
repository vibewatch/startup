      - number: '8.2'
        title: Valuation context, comp quality, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record shows real momentum but also a denominator problem. Public evidence supports a June
              2025 official round of $70 million at a $920 million valuation and later independent reporting of a $75
              million round at $1.4 billion. That re-rating happened in a market where multiple observers describe
              late-stage SaaS investing as far more disciplined than the 2021 peak. Public software multiples remain
              widely dispersed, but they are not forgiving toward companies that cannot show retention quality or margin
              quality. The most relevant public comparison set is not generic consumer software; it is a mix of premium
              developer infrastructure and category-adjacent analytics. Datadog still commands a premium multiple
              because it pairs strong growth with filings-grade transparency. Atlassian trades on much lower revenue
              multiples despite enormous scale and excellent gross margins. Amplitude is the closest public category
              analog and it trades at a low-single-digit multiple. PostHog may deserve a private premium for growth and
              product breadth, but the current headline price already asks investors to pay like the business has
              Datadog-level market support without Datadog-level disclosure. Entry discipline therefore has to start
              with two conditions: materially better pricing, or materially better evidence.
