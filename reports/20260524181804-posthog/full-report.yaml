      - number: '6.5'
        title: Expansion paths are visible, but concentration, exclusivity, and proof-quality risks stay open
        blocks:
          - type: paragraph
            body: >-
              Expansion evidence is real. PostHog sells a visibly broad suite, and multiple named customers describe
              widening from core analytics into flags, replay, surveys, AI, observability, or deeper product
              instrumentation. Exa centralized more of its analytics stack into PostHog. ResearchGate uses PostHog at a
              scale that requires custom packaging and hands-on support. That is the clearest public expansion path:
              low-friction self-serve entry, team-wide spread, then broader module adoption and enterprise support for
              some large accounts. This is consistent with Sacra’s view that usage-based pricing broadens engineering
              adoption and then expands with event volume and product attach.


              The unresolved risk is that none of this public proof closes concentration or wallet-share questions. The
              public proof set skews heavily toward AI, startup, and developer-led logos. Lovable explicitly says it
              runs multiple observability vendors alongside PostHog, which is healthy proof of usage but a reminder that
              production use is not the same as exclusive vendor standardization. G2 also surfaces product-quality
              concerns around crashes and documentation. Most importantly, PostHog does not publicly disclose
              top-customer share, paid-customer mix, or renewal economics. So the chapter conclusion is positive on
              customer love and expansion potential, but still cautious on concentration and on whether the public
              reference set fairly represents monetized retention across the whole base.
