  - id: TV006
    title: Thesis-break trigger register
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Action implication
    rows:
      - - Trust regression
        - Another material security or data-loss incident
        - Premium software multiples compress quickly when trust weakens.
        - Pause underwriting until remediation and customer impact are known.
      - - Growth miss
        - Management clearly misses the public 2026 revenue ambition
        - The current price already leans on strong forward growth.
        - Rebase scenarios toward bear and revisit valuation.
      - - Retention disappointment
        - Private NRR or churn data comes in below premium-band norms
        - Premium private ARR multiples require strong expansion quality.
        - Do not pay a premium multiple without re-rating the case.
      - - Round reset
        - A later round or secondary clears materially below $1.4B
        - That would directly falsify the current pricing thesis.
        - Treat the current round as fully marked down and reassess.
      - - Cap-table overhang
        - Preference stack or secondary-heavy structure is worse than expected
        - Return math can fail even if operating execution is solid.
        - Model downside with full terms before re-engaging.
    notes: The register focuses on events that would invalidate the current price support, not generic operating noise.
