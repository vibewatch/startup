        title: 'Differentiation: one data/control plane plus AI-assisted workflows'
        blocks:
          - type: paragraph
            body: >-
              PostHog’s strongest product differentiation is not one isolated module; it is the way the modules share
              one data plane. Product OS, the public repo, and the GA4 comparison all point to the same thesis:
              analytics, replay, flags, surveys, SQL, warehouse queries, and data activation belong together because
              engineers want to ship and debug from one place rather than reconcile multiple vendors. MCP extends that
              thesis into a newer workflow. Instead of treating analytics as a dashboard-only destination, PostHog
              exposes an MCP server that makes project data and product actions reachable from AI-native developer tools
              such as Cursor, Claude Code, Codex, VS Code, and Zed.


              That said, the bundle does not eliminate specialization risk. Forrester argues feature management and
              experimentation are diverging across personas, and Mixpanel argues AI is raising the bar from “reporting”
              to “decision support.” So the right reading is nuanced: PostHog has credible platform-level
              differentiation through shared data, SQL, capture, control, and AI access, but some buyers will still
              evaluate best-of-breed depth by workflow rather than rewarding suite breadth on its own. Developer-signal
              remains a positive here: the public repos, npm package, and Python package all show a current and actively
              shipped surface rather than a frozen open-source wrapper around a closed commercial core.
