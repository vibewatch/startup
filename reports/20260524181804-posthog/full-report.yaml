      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer evidence points to a multi-threaded purchasing motion rather than a single archetype. PostHog's
              customer stories show that engineering and product teams often lead adoption because they own
              instrumentation, funnels, experiments, and release quality. Yet those same case studies also show adjacent
              users in leadership, UX, marketing, and data roles once the platform is embedded. Y Combinator used
              PostHog across Startup School and Co-Founder Matching, with leadership, product, and engineering all
              involved. Hasura started with engineering-led onboarding analysis but broadened usage into UX and
              marketing. Competitor and adjacent-platform pages reinforce the pattern: VWO explicitly markets to product
              managers, engineers, growth marketers, and UX/analytics teams; Statsig's customer quotes come from data
              engineering, CTO, PM, and engineering roles; Forrester argues feature management remains developer-led
              while experimentation increasingly serves product and experience-design personas. The practical
              implication is that the initial user is often technical, but the budget and renewal logic become
              cross-functional as more teams consume the data or use the resulting controls.
