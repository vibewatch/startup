  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and the engineering workflow PostHog is selling
        blocks:
          - type: paragraph
            body: >-
              PostHog’s product definition is broader than “product analytics.” The official Product OS docs package
              analytics, web analytics, replay, feature flags, experimentation, surveys, and a data warehouse as one
              system, while the repo and YC profile extend that scope into error tracking, CDP/data pipelines, LLM
              observability, and an AI product assistant. In workflow terms, the company is trying to own an
              engineer-led loop: instrument behavior with SDKs and autocapture, inspect it with analytics/replay/SQL,
              ship changes behind flags and experiments, and then activate or export the resulting data into the rest of
              the stack.


              That bundled workflow is a real differentiator because it reduces tool stitching for early and mid-stage
              engineering teams. The public pack also makes the commercial shape legible: pricing is usage-metered by
              product surface, and the free tier spans nearly every major module. The trade-off is that module breadth
              is now part of the diligence question. Core analytics, replay, and flags look mature in public docs; newer
              AI, workflow, and broader activation surfaces are visible and monetized, but their exact GA-vs-preview mix
              is not equally explicit across the retained pack.
