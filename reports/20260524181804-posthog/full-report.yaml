        blocks:
          - type: paragraph
            body: >-
              PostHog gives customers two very different deployment postures. Cloud is the recommended path and the one
              clearly optimized for scale. Self-hosting remains available under an MIT-licensed Docker Compose hobby
              deployment, and the docs stress that it is the same product surface, but not the same infrastructure or
              support model. Operators own their own scaling, URLs, upgrades, and failure risk; the public README also
              suggests open-source deployments are practical only to roughly 100k events per month before migration to
              cloud becomes the recommended move. That is a meaningful caveat for any buyer or investor tempted to
              equate “open source” with a full enterprise private-cloud support strategy.


              Release mechanics are also unusually transparent. The handbook says new products start behind feature
              flags, then move through alpha, beta, and GA, with user-level preview and coming-soon surfaces for early
              demand discovery. That lines up with the technical product shape: browser SDK modules can be bundled
              selectively, server flags can be evaluated locally, and the MCP wizard can install PostHog’s AI access
              layer directly into developer tools. What remains weaker is roadmap specificity. The public roadmap URL
              exists, but the retained audited fetch surfaced only a loading shell, so detailed near-term timing still
              depends more on release-process disclosures than on a readable public roadmap export.
