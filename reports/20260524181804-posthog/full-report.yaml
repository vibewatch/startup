            body: >-
              There is no public NRR, GRR, churn, contract-length, or renewal-rate disclosure in the reviewed customer
              pack, so durability cannot be underwritten directly from public evidence. What the public record does
              offer is a useful set of proxies. Y Combinator uses PostHog across multiple founder-facing products;
              Phantom uses it daily in weekly all-hands and treats feature flags as operational safety controls;
              ElevenLabs monitors weekly retention before rolling features out widely; Arena calls retention and return
              behavior north-star metrics; and ResearchGate has run year-long feed-model tests on top of PostHog while
              interacting with expert support. Those are credible signals that the product is embedded in recurring
              workflows rather than dabbed into one-off analyses.


              Independent satisfaction evidence is supportive but still incomplete. G2’s 4.5/5 rating across 950 reviews
              is a positive signal for familiarity and breadth, and Sacra’s business-model framing also fits a
              land-and-expand PLG motion. But a review score is not a renewal metric, and even the best public proof set
              rarely says whether the customer renewed, expanded contract value, or displaced competing vendors fully.
              The correct read is constructive but cautious: public evidence supports repeat use and multi-product
              expansion, yet customer durability remains a management-room question until PostHog discloses cohort
              economics or gives consistent paid-customer metrics.
