      - number: '3.2'
        title: Competitor profiles, capability breadth, and packaging signals
        blocks:
          - type: paragraph
            body: >-
              On official product and pricing pages, PostHog still stands out for the sheer width of the bundle: product
              analytics, web analytics, session replay, feature flags, A/B testing, surveys, a data warehouse layer,
              CDP-style routing, and workflow tooling are all marketed as one Product OS. But that breadth advantage is
              no longer unique in direction, only in degree. Mixpanel now markets replay, experiments, flags, KPI
              mapping, and warehouse connectors beside analytics. Amplitude presents analytics, experiments, activation,
              surveys, replay, and multiple AI features. Statsig markets analytics, experimentation, feature management,
              session replay, and developer configs from one platform, while GrowthBook markets warehouse-native
              experimentation, feature flags, and product analytics with self-host or cloud deployment. Pricing
              reinforces the same pattern. PostHog, Mixpanel, Statsig, and GrowthBook publish transparent free-entry or
              self-serve pricing, whereas Fullstory, LaunchDarkly enterprise plans, and enterprise Amplitude remain more
              opaque. That makes the market look less like one dominant incumbent and more like a broad menu of suites
              that are converging around the same shortlist of buyer expectations.
