- id: cost-structure-and-public-traction
  title: Cost structure, public traction floor, and public-company analogs
  body: 'The public traction floor is stronger than many private peers even though the audited view is still missing. Careers says revenue is already over $50 million a year, the handbook future page targets $100 million by end-2026, and the Y Combinator profile says revenue has been growing about 10% monthly. Official surfaces also show scale signals of 60,000+ customers, 190,254+ teams, 176k+ historical signups, a 200+ person team, and 25 planned hires. Those datapoints confirm commercial momentum without proving realized ARR quality. On costs, the product and billing docs imply a classic cloud-software cost base: compute, storage, event processing, replay retention, warehouse rows, AI workloads, and a large R&D/support surface. The right public benchmark is therefore not hardware or fintech but high-gross-margin developer software. Atlassian''s FY2025 report shows 83% gross margin with R&D at 51% of revenue and sales and marketing at 22%. Datadog''s FY2025 10-K implies roughly 80% gross
    margin with heavier go-to-market intensity around 28% and R&D around 45%. Those numbers are useful framing for what a scaled software platform can look like, but they are benchmarks, not PostHog facts.'
