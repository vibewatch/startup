  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn, runway, debt balances, and minimum-cash policy.
    whyItMatters: These are the core inputs needed to judge whether the 2025 financings still provide a comfortable buffer or whether a new round is already time-sensitive.
    diligencePath: Request the latest board package, cash bridge, debt schedule, and 12-month operating plan from finance.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-retention
    missingEvidence: Realized ARPA, discount ladders, startup-credit conversion, NRR, logo churn, CAC, and sales-assisted conversion by cohort.
    whyItMatters: Transparent list pricing is strategically helpful, but underwriting depends on what customers actually pay and whether cohorts expand profitably over time.
    diligencePath: Pull a billing export by customer and product, then pair it with cohort-retention and CAC-payback dashboards.
    relatedQuestionRefs:
    - QI024
    - QI025
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-recognition
    missingEvidence: Cloud-versus-self-hosted revenue mix, contract-liability balances, deferred revenue, and revenue-recognition treatment for hybrid credit-based plans.
    whyItMatters: Without mix and recognition data, investors cannot tell whether growth is coming from recurring cloud usage, support-like revenue, or one-off contract mechanics.
    diligencePath: Request product-level revenue mix, deferred-revenue schedule, and a memo covering recognition policy for usage, credits, and flat-fee contracts.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI001
    - TI004
    - TI005
