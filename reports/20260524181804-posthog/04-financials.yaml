callouts:
- calloutType: strength
  title: Transparent list pricing makes the top of funnel unusually legible
  body: PostHog publishes a real self-serve price card, free tiers, and billing-limit safeguards, then backs that up with customer stories that show measurable product value. That combination is a meaningful GTM strength even though the private retention and payback math is still missing.
  claimRefs:
  - CI001
  - CI002
  - CI034
  - CI035
  - CI028
  - CI032
- calloutType: risk
  title: List-price transparency still hides realized economics
  body: Startup credits, nonprofit discounts, coupons, bespoke tiers, and flat up-front plans mean the public price card cannot be treated as realized ARPA. Gross margin, NRR, CAC payback, and cloud-versus-contract mix all remain private.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI067
  - CI068
  - CI070
- calloutType: insight
  title: The model looks software-like, but capital adequacy is only provisionally comfortable
  body: Recent financings and default-alive language suggest PostHog is not obviously cash constrained, while public SaaS analogs show that a developer platform can sustain high gross margins even with large R&D programs. But without cash, burn, runway, and retention data, that remains a directionally positive read rather than a fully underwritten one.
