- id: gtm-and-sales-efficiency-proxies
  title: GTM motion and the proxy evidence for sales efficiency
  body: Because PostHog does not publish CAC, payback, or NRR, the best public read on efficiency comes from motion and customer behavior rather than finance ratios. The motion looks strongly product-led and engineering-first. Official pages emphasize transparent pricing and no-sales onboarding, while the billing FAQ says prospects can often get a better spend estimate by starting free and watching usage. Customer proofs are directionally consistent with that story. Y Combinator says PostHog captured 30% more data than Google Analytics, valued direct Slack access to engineers, and used experiments that produced 40% more messages and 35% more accepted requests. Hasura says PostHog-driven onboarding changes improved conversion by 10-20% and that usage expanded from engineering into UX and marketing. Those are credible land-and-expand signals, but they are still proxies. They do not tell us blended paid conversion, self-serve-to-sales-assisted transition rates, or how much of growth came from
    more volume per account versus more paying accounts. The public evidence supports low-friction adoption and clear customer value, not a finished unit-economics model.
