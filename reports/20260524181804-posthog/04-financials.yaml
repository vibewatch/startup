chapter:
  number: 4
  title: Financials
  summary: PostHog discloses unusually detailed list pricing and several traction signals, including a revenue floor above $50 million per year, a $100 million 2026 target, and two 2025 financings. The reviewed public pack supports a software-like, usage-based, engineering-led revenue model with some enterprise exceptions, but realized pricing, gross margin, burn, runway, and retention all remain private, so capital adequacy is only partially underwritten from public evidence.
sections:
- id: revenue-model-and-pricing
  title: Revenue model, list pricing, and what the public card does not tell us
  body: PostHog's public pricing surface is unusually transparent for a private software company. The company publishes product-by-product free allowances and overage meters across analytics, replay, feature flags, surveys, warehouse, pipelines, AI observability, AI, workflows, and logs, and the companion docs explain that usage - not seats - is the core monetization primitive. That is strong evidence for the list-pricing side of the model. It is not, however, enough to convert usage mechanics into realized revenue. The same public doc set also says customers can get startup credits, nonprofit discounts, custom coupons, bespoke price tiers, flat-first-tier structures, and flat up-front no-metering plans. In other words, PostHog is transparent about list pricing but not about net pricing. The right reading is that the self-serve card is real and strategically important, yet enterprise and promotional constructs can still change realized ARPA, deferred revenue timing, and gross margin by customer
    cohort. Investors should therefore treat the published prices as entry economics and treat realized economics as a diligence request, not as a fact already disclosed.
