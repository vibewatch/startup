- id: capital-adequacy-and-blockers
  title: Capital adequacy, collections discipline, and the blockers that remain
  body: 'The 2025 financing history makes PostHog look provisionally well funded, but only provisionally. Officially, the company raised $70 million of primary capital at a $920 million valuation in June 2025, and third-party coverage later reported a $75 million round at a $1.4 billion valuation led by Peak XV. At the same time, the official Series D post and the careers page both make clear that employee liquidity mattered, which means investors cannot assume every disclosed dollar extended runway like a pure primary raise. The operational billing docs add another useful but cautionary lens. They show formal collections controls - Net 30 invoicing for credit plans, bank-transfer settlement for upfront contracts, four retries for pay-as-you-go customers, and possible suspension, free-tier reversion, or advance-payment requirements for late payers. That is positive on discipline but also a reminder that revenue operations can create churn or data-loss risk. The core blocker is straightforward:
    public materials still do not disclose cash, burn, runway, gross margin, NRR, or cloud-versus-self-hosted mix. So the financial verdict is that the model looks software-like and plausibly capital efficient, but current capital adequacy still cannot be fully underwritten from public evidence alone.'
