- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Public proxy or benchmark
  - Exact diligence path
  rows:
  - - Realized ARPA / blended net price
    - Without this, list pricing cannot be converted into actual revenue quality or payback.
    - Pricing docs show list tiers; billing docs show credits, discounts, and bespoke plans.
    - Export 12 months of billed revenue by product, customer, discount, and contract type.
  - - ARR / recognized revenue by product
    - Prevents assessing mix concentration and growth durability.
    - Careers says >$50M/year, future says $100M target, and Sacra publishes a non-canonical estimate.
    - Provide monthly recognized revenue, ARR, and product mix since Jan 2025.
  - - Gross margin by product and hosting mode
    - Blocks conviction on whether usage growth scales profitably.
    - Atlassian and Datadog filings imply ~80-83% software gross margins, but PostHog may differ materially.
    - Share cloud COGS, self-host economics, storage/compute costs, and gross-margin waterfall.
  - - NRR / logo retention / churn
    - Land-and-expand claims are untestable without cohort retention.
    - Customer stories show expansion, but no cohort stats are public.
    - Provide gross and net dollar retention, logo churn, and expansion by segment.
  - - CAC payback and sales-assisted conversion
    - Self-serve anecdotes do not show acquisition efficiency.
    - No public CAC or payback; only support and adoption proxies are visible.
    - Provide funnel conversion, spend by channel, and payback by cohort.
  - - Cash / burn / runway
    - Capital adequacy remains unknowable and next-round timing cannot be underwritten.
    - Only funding events and default-alive language are public.
    - Provide current cash, monthly burn, runway, and downside plan.
  - - Cloud vs self-hosted revenue mix
    - Hosting mix changes margin, support burden, and revenue recognition.
    - Open-source and self-host positioning are public, but the revenue mix is not.
    - Provide paying cloud ARR, self-host support revenue, and migration trend.
  - - Enterprise contract liabilities / deferred revenue
    - Hybrid contracts may shift cash timing versus revenue recognition.
    - Billing handbook confirms upfront and credit structures exist; no public deferred-revenue disclosure exists.
    - Provide contract archetypes, deferred revenue balances, and recognition policy by product.
  notes: Every row is a diligence blocker rather than a hidden conclusion. Where public-company benchmarks are mentioned, they are framing analogs only and not substitutes for company data.
