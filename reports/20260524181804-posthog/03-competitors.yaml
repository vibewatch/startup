  evidenceGaps:
  - type: missing-source
    severity: material
    topic: private-competitor-scale
    missingEvidence: Like-for-like current funding, ARR, and customer counts for private rivals such as Mixpanel, Statsig, and GrowthBook.
    whyItMatters: Scale and capital strength affect how durable a pricing war or bundling war can become.
    diligencePath: Request private data-room KPIs or pull current financing and customer metrics from paid databases and management references.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-floor-pricing
    missingEvidence: Actual enterprise order forms or minimum commits for Fullstory, LaunchDarkly, and enterprise Amplitude tiers.
    whyItMatters: List-price opacity makes it hard to compare total cost of ownership or discounting behavior at scale.
    diligencePath: Collect customer proposals, procurement screenshots, or live sales quotes from reference accounts before underwriting pricing moat claims.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: net-retention-vs-bundle
    missingEvidence: Independent renewal, attach-rate, or expansion data showing whether integrated suites retain customers better than mixed best-of-breed stacks.
    whyItMatters: Without retention or win-loss data, moat claims around bundle durability remain directional rather than proven.
    diligencePath: Ask PostHog and customer references for win-loss logs, cohort retention by product attach, and reasons for replacing or keeping adjacent vendors.
    relatedQuestionRefs:
    - QP025
