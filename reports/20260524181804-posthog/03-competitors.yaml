- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public entry price / free tier
  - Metering unit or packaging model
  - Included breadth at entry
  - Public opacity
  - Implication
  rows:
  - - PostHog
    - Free; usage-based after product-specific free tiers
    - Events, recordings, flag requests, rows, and other product units
    - Multiple core products included before overage billing
    - Low opacity
    - Best fit for teams that want to start broad before paying
  - - Mixpanel
    - Free forever up to 1M monthly events
    - Analytics events with usage-based Growth pricing
    - Core analytics plus limited replay before paid scale
    - Low opacity for self-serve; Enterprise custom
    - Straightforward analytics economics but extra scale still becomes usage-driven
  - - Amplitude
    - Free plus Plus at $49 per month
    - Seat and product-suite packaging with higher custom tiers
    - Analytics-first suite with experiments, replay, and AI features visible
    - Medium opacity because higher tiers are custom
    - Accessible entry, but enterprise TCO needs live quote validation
  - - Heap
    - Free entry up to 10k monthly sessions
    - Session-based entry with custom higher-tier packaging
    - Analytics first; replay add-on and warehouse features move upmarket
    - Medium opacity
    - Good first step for autocapture buyers, but comparable bundle economics are less transparent
  - - Fullstory
    - Request pricing / demo
    - Plan-category packaging without public self-serve dollar list
    - Behavioral data and analytics plans by role
    - High opacity
    - Harder to benchmark against usage-based suites without sales process
  - - LaunchDarkly
    - Developer free to start
    - Plan-based plus tailored enterprise pricing
    - Runtime control and experimentation entry without full analytics OS
    - Medium to high opacity above entry
    - Compelling for governance-first buyers, but not directly price-comparable to analytics suites
  - - Statsig
    - Developer tier with 2M metered events free
    - Usage-based metered events and exposures
    - Flags, configs, experimentation, and analytics included at entry
    - Low opacity on entry tier
    - Aggressive self-serve economics for experimentation-heavy teams
