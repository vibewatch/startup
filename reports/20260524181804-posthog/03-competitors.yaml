company:
  name: PostHog
chapter:
  number: 3
  title: Competitors
  summary: 'PostHog now competes in a broad competitive field rather than a single product-analytics lane: analytics suites, replay specialists, feature-management incumbents, warehouse-native open-source tools, and GA4-style defaults all overlap with part of the same buyer job. The company still looks differentiated where integrated developer workflow, open-source deployment control, and transparent usage pricing matter together, but independent and analyst evidence also shows real commoditization pressure and a meaningful usability gap for non-technical buyers.'
sections:
- id: landscape-and-categories
  title: Direct peers, adjacent control planes, and status-quo substitutes
  body: 'PostHog does not face one clean mirror-image rival. The closest direct peers on the analytics side are Mixpanel, Amplitude, Heap, and Fullstory, each of which now stretches beyond classic event charts into at least some combination of replay, experimentation, or AI-assisted analysis. A second cluster competes for the release-control and experimentation budget: LaunchDarkly, Statsig, GrowthBook, and the Split capabilities now carried forward inside Harness FME. A third set is not a direct peer at all but still wins the same buyer job: Google Analytics remains the free, default marketing and web-analytics option, VWO sells optimization and experimentation without becoming a full developer data stack, and internal or warehouse-native builds remain credible for technical teams that want control over storage, deployment, or cost. That class-based framing matters because PostHog wins when a buyer wants one engineering-led platform, but it loses whenever a buyer is satisfied with a specialist
    layer or with the status quo.'
