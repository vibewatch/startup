  rows:
  - - PostHog
    - Integrated Product OS anchor
    - 60,000+ customers disclosed on pricing page; open-source and self-host option
    - Engineering-led startups, product teams, data-conscious builders
    - Analytics, replay, flags, experiments, surveys, data warehouse, CDP, workflows
    - Usage-based with generous free tiers across products
    - Broadest integrated stack in this pack, but not the easiest UI for non-technical PMs
  - - Mixpanel
    - Direct analytics peer
    - Public product and pricing pages emphasize mature digital analytics platform more than current funding disclosure
    - Product-led SaaS teams wanting analytics-first workflows
    - Analytics, web analytics, replay and heatmaps, experiments and flags, KPI trees
    - 1M events free; usage-based Growth tier; Enterprise custom
    - Mature and broad, but deployment control is SaaS-first and bundle breadth is still narrower than PostHog
  - - Amplitude
    - Direct analytics peer
    - Official pricing shows broad suite depth; independent reviews emphasize enterprise fit rather than public current funding data
    - Product, growth, and executive teams in larger orgs
    - Analytics, surveys, feature experiment, web experiment, activation, replay, AI tools
    - Free tier plus $49 per month Plus; higher tiers custom
    - Strong PM and governance positioning, but enterprise economics are harder to compare publicly
  - - Heap
    - Direct analytics / replay peer
    - Used by 10,000+ companies and now part of Contentsquare
    - Teams that want autocapture and easier setup
    - Analytics with autocapture, AI assistant, replay add-on, warehouse integration on higher plans
    - Free entry up to 10k monthly sessions; higher plans and replay more custom
    - Autocapture and DX-network backing help, but module breadth is thinner than PostHog
  - - Fullstory
    - Replay-first adjacent peer
    - Behavioral-data platform framing without public current funding detail in reviewed pack
    - Product, UX, support, and CX teams needing qualitative journey insight
    - Automatic capture, behavioral analytics, AI insight, guides and surveys, activation
    - Request-demo packaging instead of transparent self-serve list pricing
    - Replay depth and behavioral detail remain strong, but broader product-dev bundle is narrower
  - - LaunchDarkly
    - Feature-management incumbent
    - Enterprise engineering scale emphasis; reviewed pack does not surface current customer count or funding on-page
    - Engineering orgs prioritizing runtime control, approvals, and release governance
    - Feature flags, progressive delivery, experimentation, observability, agent control
    - Developer plan free to start; enterprise tiers custom
    - Governance-led incumbent with strong workflow credibility, but not a full analytics OS
  - - Statsig
    - Experimentation and feature-management suite
    - Customer proof shows competitive wins; pricing page does not disclose private funding on-page
    - Data-driven product and engineering teams running experiments at scale
    - Analytics, experimentation, feature management, replay, web analytics, configs
    - Developer tier includes 2M metered events free; higher tiers scale usage-based
    - Fast-growing integrated control plane; weaker on deployment portability than open-source rivals
  - - GrowthBook
    - Open-source / warehouse-native adjacent
    - 3,000+ companies disclosed on homepage; private financing not disclosed in reviewed pack
    - Technical product and data teams wanting warehouse-native experimentation
    - Experimentation, feature flags, product analytics, warehouse-native deployment, self-host
    - Starter free, Pro $40 per seat, Enterprise custom
    - Strong open-source and cost narrative, but product breadth and distribution are still smaller than PostHog or Amplitude
  - - Google Analytics 4
    - Status-quo incumbent
    - Google ecosystem default rather than standalone startup scale story
    - Marketing, web, and attribution teams
    - Customer-journey and ROI analytics tied to Google ads stack
    - Free
    - Lowest-friction default for marketing analytics, but not sold as a unified product-development control plane
  - - Internal build / warehouse-native stack
    - Substitute
    - No shared scale signal; economics depend on internal team capacity and data infrastructure
    - Technical teams prioritizing control and composability
    - Self-built analytics, flags, replay, or experimentation around existing warehouse and open-source layers
    - Capex is engineering time rather than list price
    - Strong control and portability, but slower time to value and heavier operating burden
  notes: Rows synthesize retained official product and pricing pages with selective independent team-fit commentary; funding and customer scale are listed only where the reviewed public pack disclosed them clearly.
