- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or pressure point
  - Evidence
  - Threat vector
  - Severity
  - Current mitigation or offset
  - Diligence ask
  rows:
  - - Integrated product breadth
    - PostHog bundles more modules than most direct peers
    - Category convergence means rivals are adding adjacent modules too
    - High
    - Bundle still reduces tool sprawl for technical teams
    - Ask for attach-rate and multi-product retention by cohort
  - - Open-source / self-host control
    - PostHog and GrowthBook give buyers deployment choice
    - Choice lowers vendor lock-in and can make switching out less painful
    - Medium
    - Still differentiates on privacy and infra control
    - Validate how often self-host leads to paid cloud upsell versus churn
  - - Transparent pricing
    - PostHog publishes generous free tiers and usage-based rates
    - Statsig, GrowthBook, Mixpanel, and GA4 also publish strong free-entry terms
    - Medium
    - Transparency still helps self-serve adoption and trust
    - Collect actual enterprise quotes to see if transparency survives at scale
  - - Developer workflow strength
    - Independent reviews call PostHog strongest for developers
    - Non-technical PMs may prefer Amplitude or Mixpanel
    - High
    - Target segment remains engineering-led teams
    - Test live workflows with mixed PM and engineer reference accounts
  - - Replay depth versus specialists
    - Fullstory remains replay-forward and behavior-rich
    - Best-of-breed replay can still outrun suite convenience for some teams
    - Medium
    - PostHog closes gap by keeping replay inside same stack
    - Compare replay analysis depth and onboarding speed in real deployments
  - - Enterprise governance and approvals
    - LaunchDarkly and Amplitude keep governance credibility with large orgs
    - Incumbent workflows can block displacement even when feature overlap grows
    - High
    - PostHog can win where governance needs are lighter or more developer-owned
    - Request enterprise reference calls on approvals, auditability, and RBAC fit
  - - Status-quo and specialist multi-homing
    - GA4 plus point tools remains viable and often cheap
    - Buyers can mix layers instead of fully standardizing on one suite
    - Medium
    - Integrated contract still saves coordination cost
    - Measure actual procurement and admin savings from suite consolidation
  - - Feature convergence and commoditization
    - Forrester and vendor pages show experiments plus flags becoming common
    - No single module may remain scarce enough to support premium pricing
    - High
    - Moat shifts to workflow, data model, and distribution rather than raw features
    - Track roadmap velocity and win-loss reasons by competitor class
  notes: Severity reflects competitive impact on a 2026 buying process, not a quantified financial loss model.
