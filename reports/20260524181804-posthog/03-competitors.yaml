    - Starter free; Pro $40 per seat per month
    - Seat-based cloud pricing with self-host option
    - Unlimited experiments and flags at starter; analytics beta and advanced stats higher up
    - Low opacity on public tiers
    - Strong price pressure on closed feature-management incumbents
  - - GA4
    - Free
    - Usage is largely hidden behind Google ecosystem economics
    - Marketing and customer-journey analytics only
    - Low opacity on entry tier
    - Cheap default that can delay a switch until product teams outgrow marketing analytics
