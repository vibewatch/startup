- id: switching-costs-distribution-and-trust
  title: Switching costs, multi-homing, distribution power, and trust posture
  body: 'The strongest switching-cost argument for PostHog is not hard lock-in; it is operational convenience. If one team can buy analytics, replay, flags, experiments, surveys, and data plumbing in one login and one contract, procurement and implementation friction fall. Cotera''s comparison explicitly describes replacing LaunchDarkly and Fullstory in the same engineering-led stack. Yet that same evidence also shows the moat cap. PostHog is open source and self-hostable, as is GrowthBook, so deployment control helps technical buyers but also lowers the pain of leaving the vendor cloud. Multi-homing therefore remains realistic: teams can still pair GA4 with replay, or analytics with a separate flag vendor, or buy a dedicated experimentation layer from LaunchDarkly, Statsig, or VWO. Distribution power also remains uneven. GA4 benefits from Google''s default marketing footprint, LaunchDarkly from enterprise governance and approvals, and Amplitude from PM-friendly workflows and executive reporting.
    Trust is shaped by the same split. PostHog and GrowthBook lean on code access and deployment choice, while incumbent SaaS rivals lean on managed governance, approvals, and compliance posture.'
