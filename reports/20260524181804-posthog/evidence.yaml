evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership bench
    missingEvidence: A current public board roster and fuller executive-team page were not found in the reviewed materials.
    whyItMatters: Later governance and risk judgments need more than founder biographies and one operations signatory.
    diligencePath: Request a current org chart, board composition, and observer-rights summary directly from the company.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: total funding
    missingEvidence: Reviewed public sources do not provide one canonical cumulative funding figure; third-party totals are estimates.
    whyItMatters: >-
      Capitalization, dilution, and step-up analysis depend on whether prior rounds and secondary components are counted
      consistently.
    diligencePath: Request a round-by-round cap table with primary versus secondary proceeds clearly separated.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      Official pages imply 200+ people while an external remote-work profile says roughly 110, and neither source
      provides an auditable employee list.
    whyItMatters: Headcount is a core efficiency and scale denominator for later financial and operating analysis.
    diligencePath: Obtain a current employee count by function and geography from management or a trusted HR system export.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: current arr
    missingEvidence: Current ARR is not published on reviewed official pages; only targets and third-party estimates are available.
    whyItMatters: >-
      Valuation work later in the report needs a clean current-revenue denominator, not just a management target or
      outside estimate.
    diligencePath: Request current ARR, net revenue retention, and gross margin with board-level or investor-level support.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: overview disclosure gaps
    missingEvidence: >-
      Important overview facts such as exact board composition, current ARR, current headcount, and formal
      headquarters/office footprint policy remain only partially public.
    whyItMatters: Those gaps directly affect governance, efficiency, valuation, and operating-risk analysis across later chapters.
    diligencePath: >-
      Collect a management data room package covering governance, headcount, revenue, and legal-entity structure before
      final underwriting.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
