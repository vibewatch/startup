- id: adoption-trajectory
  title: Adoption trajectory points to broad reach, but the public proof funnel narrows quickly
  body: |-
    The broadest adoption read comes from official usage claims rather than from a disclosed paid-customer progression. Between the about and pricing pages, PostHog points to 190254+ teams, 60000+ customers, and a self-serve motion where more than 90% of companies use it for free. On top of that, PostHog says 65% of every Y Combinator batch uses its products, which is a meaningful distribution signal in one of the most important startup channels. Independent review volume adds one more external marker: the G2 archive shows 950 reviews and a 4.5/5 rating, which is far too much surface area for a purely notional customer base.

    But this still is not a clean cohort or deployment ladder. Public proof becomes much thinner as the evidence moves from broad official counts to independently visible users and then to named customer stories. In this run, nine public customer-story pages were accessible and eight of those contained a quantified result or scale marker. That is enough to show that adoption is real, but it is still a curated subset. The funnel therefore supports a nuanced conclusion: PostHog likely has large top-of-funnel and broad product familiarity, yet the public record gives much better evidence on how some customers use the product than on how many paying customers exist in each monetized cohort.
  claimRefs:
