- id: TU005
  title: Concentration / expansion risk table
  columns:
  - Expansion driver
  - Concentration / friction signal
  - Likely impact
  - Diligence path
  rows:
  - - Free self-serve land
    - Broad free usage is public, but paid-customer conversion and monetized cohort mix are not
    - Logo or team counts may overstate durable revenue concentration quality
    - Request active paid accounts by plan, cloud/self-host split, and free-to-paid conversion
  - - Multi-product suite
    - 10+ products and customer stories support cross-sell, but module attach and downsell by cohort are undisclosed
    - Expansion may be real but uneven across modules
    - Request attach, renewal, and churn by major product family
  - - Developer- and AI-heavy proof set
    - Named public proof skews toward startup, AI, and developer-led buyers
    - Public proof may underrepresent enterprise non-technical buyers or regulated procurement constraints
    - Request ARR and customer count by vertical and customer size
  - - Large-scale enterprise support
    - ResearchGate shows custom-package motion, but top-10 customer exposure is undisclosed
    - A few large customers could matter more than public logo counts imply
    - Request top-10 customers by ARR, renewal date, and support model
  - - Vendor overlap
    - Lovable openly runs multiple observability vendors alongside PostHog
    - Useful product fit may not always imply vendor exclusivity or full wallet share
    - Request competitive displacement and win-back data by segment
  - - Product quality concerns
    - A visible G2 reviewer cites crashes and confusing documentation
    - Reliability or DX issues can slow deeper adoption across more teams
    - Request gross churn, support response metrics, and incident-driven downgrades
  - - Curated public proof
    - Named stories are strong but are still company-authored and rarely disclose contract value or renewal history
    - Public references can exaggerate average customer success
    - Request active reference accounts by ARR band, tenure, and whether the deployment is still current
  notes: This table focuses on where expansion evidence is real but underwriting still depends on management disclosure rather than public evidence alone.
