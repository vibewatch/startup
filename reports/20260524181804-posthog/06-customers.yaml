  evidenceGaps:
  - type: missing-source
    severity: material
    topic: paid-customer-breakout
    missingEvidence: A consistent public metric for active paying customers, separated from free companies, teams, engineers, or total signups.
    whyItMatters: Without a canonical paid-customer number, it is hard to translate broad adoption claims into monetized cohort quality or concentration.
    diligencePath: Ask management for monthly active paying customers, cloud-vs-self-host split, and free-to-paid conversion by major product family.
    relatedQuestionRefs:
    - QU003
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, logo churn, renewal-rate, and contract-length data by customer size or product family.
    whyItMatters: The public stories show real usage, but durability and future revenue quality cannot be underwritten without cohort economics.
    diligencePath: Request cohort retention tables, renewal terms, downsell rates, and expansion bridges for self-serve and enterprise cohorts.
    relatedQuestionRefs:
    - QU012
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR share, top-10 renewal dates, and segment-level mix for enterprise, startup, and AI-heavy accounts.
    whyItMatters: A few large customers could drive a disproportionate share of revenue while remaining invisible in public logo counts.
    diligencePath: Ask for ARR concentration by top accounts, vertical mix, and support model, plus churn and expansion for the largest cohorts.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof-coverage
    missingEvidence: A fuller roster of publicly nameable current customers and whether each story is still live, current, and comparable across segments.
    whyItMatters: The named-customer table is intentionally partial, so it cannot be treated as a representative sample of the whole base.
    diligencePath: Ask PostHog for a current reference list by segment, deployment status, and ARR band, or for permission to speak with live references outside the public marketing set.
    relatedQuestionRefs:
    - QU021
    - QU024
    relatedTableRefs:
    - TU002
  - type: stale
    severity: minor
    topic: proof-freshness
    missingEvidence: Explicit publication dates or renewal timestamps for several customer stories that currently read as current-tense but are hard to date precisely.
    whyItMatters: Freshness affects how much confidence to place on the proof set as evidence of current production usage rather than historical success.
    diligencePath: Confirm story publication dates, whether each account is still live, and whether the referenced workflow remains in production today.
    relatedQuestionRefs:
    - QU008
    relatedTableRefs:
    - TU002
