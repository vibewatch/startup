company:
  name: PostHog
chapter:
  number: 1
  title: Company Overview
  summary: PostHog is a 2020-founded, remote-first developer tools company that expanded from open-source product analytics into a broader product and customer infrastructure platform spanning analytics, replay, flags, experimentation, warehouse, AI observability, and workflows. Public evidence strongly supports the founding story, the developer-first multi-product strategy, and the 2025 valuation step-up from a $920M Series D to a $1.4B Series E, while exact headcount, board composition, and current ARR remain only partially disclosed.
sections:
- id: identity-product-model
  title: Identity, platform scope, and public positioning
  body: 'PostHog''s own surfaces now describe a much broader business than the open-source analytics tool it launched with in 2020. The about, products, pricing, and strategy pages consistently frame the company as a developer-first platform that combines product analytics, session replay, feature flags, experiments, surveys, warehouse-style data infrastructure, AI observability, and workflow automation in one place. That unified positioning matters because it explains both the company''s distribution model and its capital story: PostHog is trying to win by landing early with engineers, giving them a generous free tier, and then consolidating spend that would otherwise sit across many point solutions. The company also leans heavily into transparency as a product and go-to-market asset. It explicitly says its codebase is open source, its handbook is public, and its pricing is fully published. That combination gives later chapters a clear baseline: this is not just a niche analytics vendor,
    but a broader developer infrastructure platform that wants to be the system of record for product and customer context.'
  claimRefs:
  - CO001
  - CO003
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO036
  - CO040
  figureRefs:
  - FO002
- id: founders-governance
  title: Founders, operating model, and governance visibility
  body: 'The public founder narrative is unusually clear even though the broader governance picture is not. PostHog''s handbook, Y Combinator profile, and third-party research all line up on a January 2020 founding by James Hawkins and Tim Glaser, with Hawkins presented as CEO and Glaser as CTO. Contrary''s memo adds useful background: both met at Arachnys, and their complementary commercial-plus-technical experience helps explain why PostHog mixes strong product storytelling with deep technical orientation. The operating model is also explicit. Careers and external remote-work profiles describe a company built around small autonomous teams, async-first habits, and globally distributed hiring rather than office-centric management. At the same time, public governance disclosure is thinner than founder disclosure. Beyond founders and a small number of signatories such as VP Operations Charles Cook, there is no equally visible public board page or complete executive roster in the reviewed material.
    For diligence purposes, that means key-person dependence is real, and formal governance should be verified directly rather than inferred from brand strength alone.'
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO010
  - CO011
