- id: capital-formation
  title: Funding history, investor map, and capital strategy
  body: 'PostHog''s public capital history shows an unusually fast climb from seed to unicorn valuation while keeping the primary financing story tied to product breadth and founder control. The handbook chronology documents a $3.025M seed in April 2020, a $9M Series A in December 2020 led by GV, and a $15M Series B in June 2021 led by Y Combinator. More recent capital formation is supported by the official Series D post plus 2025 news coverage. In June 2025, PostHog said it raised $70M at a $920M valuation led by Stripe while also noting a smaller Series C-style primary component and expanded employee liquidity. By September 2025, independent coverage said Peak XV led a $75M Series E at a $1.4B valuation, pushing PostHog into unicorn territory. Repeated investor names matter here: YC, GV, Stripe, Peak XV, 1984 Ventures, and Formus Capital all recur as credibility anchors. The company''s own careers page also highlights secondaries and tender offers, suggesting management is using financing
    rounds not only to fund expansion but also to reduce employee pressure for a near-term exit.'
  claimRefs:
  - CO018
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  - CO028
