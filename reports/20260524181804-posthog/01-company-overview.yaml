callouts:
- calloutType: strength
  title: Transparency is a distribution asset, not just a cultural slogan
  body: PostHog repeatedly uses public code, public handbook content, and transparent pricing to make trust and adoption easier for engineers. That is strategically important because it lowers the friction of trying additional PostHog products and reinforces the company's self-serve land motion.
  claimRefs:
  - CO008
  - CO009
  - CO036
  - CO040
- calloutType: risk
  title: Headline scale is strong, but public KPIs are not clean enough for underwriting
  body: The company shows clear product breadth and strong adoption, yet current headcount, total funding, and ARR are not all supported by one canonical public source. That means later chapters should preserve ranges and explicit evidence gaps instead of converting directional signals into hard numbers.
  claimRefs:
  - CO029
  - CO030
  - CO031
  - CO032
  - CO033
- calloutType: insight
  title: Financing has also been used to preserve long-term incentives
  body: PostHog's public financing narrative is not purely about adding primary capital. The company explicitly discusses secondaries, tender offers, and founder control, which suggests management is trying to lengthen the company's time horizon by reducing pressure for an early sale.
  claimRefs:
  - CO021
  - CO023
  - CO028
