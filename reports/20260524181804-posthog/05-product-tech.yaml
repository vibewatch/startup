- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Public evidence
  - Dependency
  - Risk if weak
  rows:
  - - Browser + server SDKs
    - Capture events, identify users, and evaluate flags from application surfaces
    - Strong in docs and package registries
    - Client instrumentation quality, project config, and SDK currency
    - Bad capture quality would poison analytics, replay, and experimentation together.
  - - Django web app / API
    - User-facing control plane, API, and orchestration entry point
    - Official architecture docs
    - PostgreSQL, Redis, worker services, and auth
    - UI and API instability would weaken the whole operating surface.
  - - Rust capture / replay / flag services
    - High-throughput ingestion and fast evaluation path
    - Official architecture docs
    - Kafka, blob storage, and upstream SDK behavior
    - If these services lag or fail, core product loops degrade quickly.
  - - Kafka transport layer
    - Central bus linking ingestion, storage, and CDP processing
    - Official architecture + ClickHouse docs
    - Producer reliability, topic schema, and consumer health
    - Queue backlogs or schema errors would ripple across analytics and activation.
  - - ClickHouse analytics backend
    - Primary analytical store and query engine
    - Official ClickHouse docs
    - Kafka consumers, materialized views, sharding, and query design
    - Weak query isolation or ingest design can create correctness and security problems.
  - - PostgreSQL / Redis / blob stores
    - Operational metadata, caching, and recordings/object data
    - Official architecture docs
    - App services and workers
    - These stores hold state and replay assets that user-facing products depend on.
  - - Celery / Temporal / Dagster workers
    - Short tasks, reliable workflows, and scheduled data pipelines
    - Official architecture docs
    - Queue health, permissions, and pipeline definitions
    - Workflow or pipeline failures surface directly as user-facing incidents.
  - - CDP worker and destination layer
    - Transforms inbound events and sends them to downstream tools
    - Official architecture and CDP pages
    - Kafka, mappings, destination APIs, and quality rules
    - Bad transforms or export outages break activation and downstream trust.
  notes: The architecture table reflects only layers explicitly visible in the retained public pack. It avoids hidden internal services or inferred microservice boundaries.
