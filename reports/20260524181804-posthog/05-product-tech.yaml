- id: module-map-and-operating-architecture
  title: Module map, architecture, and the shared data plane
  body: |-
    PostHog discloses more of its operating stack than many private software companies. The architecture docs name Django for the web app and API, Rust for high-throughput capture/flag/replay services, Kafka as the transport layer, Celery plus Temporal plus Dagster for workers, a Node.js CDP worker, and ClickHouse/PostgreSQL/Redis/blob storage as the core data plane. The ClickHouse docs then make the ingest pattern specific: Kafka-engine tables, materialized views, distributed tables, and sharding sit between event capture and query workloads.

    The SDK surface is similarly explicit. Browser-side docs show snippet and package-manager install paths, framework-specific integrations, selective extension bundles, cross-domain tracking, replay triggers, and named instances, while server-side flag docs expose local evaluation across multiple languages. The result is a platform that is architected more like an observable data and control plane than like a single dashboard product: one capture layer feeds analytics, replay, flags, experiments, warehouse querying, and downstream CDP actions from the same shared substrate.
