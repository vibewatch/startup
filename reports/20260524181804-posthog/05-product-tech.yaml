- id: TE005
  title: Trust / security / compliance controls table
  columns:
  - Control / signal
  - Public status
  - Scope
  - What it helps
  - Remaining caveat
  rows:
  - - Privacy policy + self-managed telemetry opt-out
    - Live public legal text
    - Hosted services, websites, and self-managed installs
    - Clarifies controller posture, telemetry collection, and opt-out paths
    - Policy language is not the same as an external audit or product-by-product control map.
  - - In-app DPA generator
    - Live public preview plus in-app execution path
    - Processor obligations and countersigned DPA workflow
    - Gives legal mechanism for data-processing terms
    - Public preview is informational; binding execution requires the app.
  - - US / EU hosting posture
    - Live public legal + product positioning
    - US region, Germany for EU-hosted cloud, cloud-provider disclosure, and region-aware MCP auth
    - Supports residency and region-selection arguments
    - The pack does not include underlying architecture attestations or customer-specific deployment diagrams.
  - - Replay triggers and capture opt-outs
    - Documented in JS docs
    - Session recording and user-level capture behavior
    - Helps narrow data collection and reduce over-capture
    - Precise operational defaults and audit logging around those controls are not fully public.
  - - No active advisories + advisory program
    - Publicly maintained handbook page
    - Security audits, disclosure process, and active-status surface
    - Shows security transparency and process maturity
    - Current page is not a substitute for a security whitepaper or penetration-test summary.
  - - PSA-2025-00001 remediation
    - Resolved medium advisory
    - SQL-editor query-visibility issue
    - Shows concrete auth remediation via team_id and testing changes
    - Single advisory does not prove the absence of adjacent authorization defects.
  - - Public post-mortem program
    - Active public incident list
    - Significant incidents with direct customer or data impact
    - Improves reliability transparency
    - The retained pack captures the index, not every full RCA body and metric.
  - - Self-host no-guarantee posture
    - Explicit in docs
    - Support, reliability, and operator responsibility
    - Makes cloud-vs-self-host trust trade-offs legible
    - It weakens the case for self-host as a like-for-like enterprise managed offering.
  notes: Controls are strongest on transparency, legal framing, and user-configurable collection behavior. Exact audited control scope and self-host support boundaries are still thinner than the company’s posture statements.
