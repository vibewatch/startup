- id: trust-privacy-and-reliability-controls
  title: Trust, privacy, and quality controls — with caveats preserved
  body: |-
    Trust posture is one of PostHog’s better-documented areas. Legal pages cover hosted and self-managed installs, DPA execution inside the app, EU-versus-US hosting, and user-level capture controls. Official comparison pages add claims around EU hosting, SOC 2, GDPR readiness, HIPAA readiness, and BAAs for relevant packages. The product docs reinforce that capture and replay can be narrowed with triggers or opt-outs. For a developer-first product that handles sensitive event data, those are meaningful controls, not just marketing slogans.

    But the public record also keeps the downside visible, which is exactly how this chapter should preserve it. The security-advisory page says there are no active advisories today, yet it documents a resolved 2025 SQL-editor issue that exposed query text across teams and explains the remediation in concrete authorization terms. The public post-mortem index separately lists recent reliability failures across workflows, logs, replay, and feature flags. Self-hosting sharpens the trade-off further: PostHog is transparent that customers can self-host, but equally explicit that self-hosted instances come without guarantees and may imply data-loss risk. So the trust verdict is positive on transparency and controls, but only moderate on reliability certainty — especially for self-managed or highly regulated buyers who need exact support boundaries and audited scope documents rather than posture statements.
