  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: public-roadmap-detail
    missingEvidence: Readable public roadmap items, statuses, and dates from the roadmap surface or another accessible official export.
    whyItMatters: Near-term module timing and sequencing matter for underwriting newer AI, workflow, and activation surfaces, but the retained roadmap fetch exposed only a loading shell.
    diligencePath: Request an internal roadmap export or a maintainer-provided readable snapshot of current roadmap items, then map each item to module maturity and expected launch window.
    relatedQuestionRefs:
    - QE030
    relatedTableRefs:
    - TE006
  - type: missing-source
    severity: material
    topic: self-host-enterprise-support
    missingEvidence: A public support matrix for private-cloud or enterprise self-host deployments covering architecture patterns, SLAs, escalation paths, and scale commitments.
    whyItMatters: Open-source availability is not the same as a fully supported enterprise private-cloud product, and this distinction directly affects buyer trust, support load, and deployment fit.
    diligencePath: Ask for the current enterprise deployment policy, supported reference architectures, and any paid support or uptime commitments for non-cloud environments.
    relatedQuestionRefs:
    - QE017
    - QE031
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: compliance-scope
    missingEvidence: Current SOC 2 report scope, exact HIPAA/BAA coverage boundaries, and any product-level compliance scoping documents.
    whyItMatters: Public posture statements are directionally useful, but regulated buyers need exact scope, exclusions, and control ownership before underwriting trust claims.
    diligencePath: Request the latest SOC 2 report, security package, BAA terms, and a product-by-product control matrix covering cloud and self-host variants.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: incident-detail
    missingEvidence: Full public RCA bodies or internal incident reviews for the 2026 workflow, logs, replay, and feature-flag incidents listed on the post-mortem index.
    whyItMatters: The public index proves transparency and preserves caveats, but it does not quantify duration, blast radius, root cause depth, or remediation completeness for each event in the retained pack.
    diligencePath: Pull the full post-mortem documents or incident reviews, then map each incident to product area, recurrence risk, and customer-impact metrics.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE005
  - type: enumeration-incomplete
    severity: minor
    topic: module-maturity
    missingEvidence: A current public module-by-module map of which newer surfaces are GA, beta, preview, or experimental, especially around AI, workflows, and logs.
    whyItMatters: Breadth is a selling point, but underwriting depends on knowing whether revenue-bearing modules are mature products or still preview-era adjacencies.
    diligencePath: Request a current module maturity sheet tied to release stage, billing status, and major customer references.
