- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow need
  - PostHog path
  - Public proof
  - Main limitation
  rows:
  - - Instrument product behavior quickly
    - Engineers want usable analytics without hand-instrumenting every trivial interaction
    - SDKs, posthog-js autocapture, and product analytics
    - Product OS, repo README, and JS docs
    - Autocapture reduces setup work but does not remove the need for thoughtful event design.
  - - Debug conversion or support issues
    - Teams need behavioral context plus technical detail
    - Analytics, replay, console/network views, and SQL
    - Replay docs plus FullStory comparison and repo README
    - The pack proves the workflow, but not module-by-module benchmark superiority against best-of-breed tools.
  - - Ship safely in production
    - Release features gradually and measure impact
    - Feature flags, experiments, local evaluation, and release stages
    - Feature-flag docs, local-eval docs, and release handbook
    - Governance, approval, and large-enterprise operating detail are less public than core mechanics.
  - - Operationalize product data
    - Move cleaned product data into downstream tooling
    - CDP transformations, destinations, and workflows
    - CDP page plus repo README
    - Destination breadth is clear, but destination-level quality/SLA detail is thin.
  - - Use product data inside AI-native tooling
    - Developers want context and actions from editors or agents
    - MCP server plus wizard installs into coding clients
    - MCP docs and GA4 comparison
    - Security model is documented, but actual adoption and ROI data are not public.
  notes: This workflow table is intentionally engineer-centric because the retained public pack repeatedly frames PostHog as a developer platform rather than a marketer-first analytics tool.
