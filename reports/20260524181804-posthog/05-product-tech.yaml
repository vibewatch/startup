    - Caller must supply all relevant properties; stateless runtimes need shared cache or remote eval
    - Feature-flag local-evaluation docs + PyPI
  - - Analytics / SQL / warehouse surface
    - Visual analytics plus SQL access and external data imports
    - SQL is positioned as unrestricted custom analysis on top of shared product/customer data
    - Detailed import-source coverage is thinner than top-level positioning
    - Product OS + repo + YC
  - - CDP / pipelines / destinations
    - Realtime transforms, webhooks, and downstream syncs
    - Supports enrichment, mapping, validation, PII scrubbing, and operational triggers
    - Per-destination implementation quality is not deeply described publicly
    - CDP page + repo README
  - - MCP / AI clients
    - PostHog Code, Cursor, Claude Code/Desktop, Codex, VS Code, and Zed
    - Free MCP server with OAuth or project-scoped API keys and region-aware routing
    - LLM workflows bring prompt-injection review requirements
    - MCP docs
  - - Self-host deployment
    - Docker Compose hobby deploy
    - Same product surface as cloud and optional TUI trial
    - No tagged releases, no guarantees, and no new paid-open-source Kubernetes deployments
    - Self-host docs + README
  notes: This table focuses on the integration surfaces with the clearest public implementation detail. It does not attempt to enumerate every language SDK or every downstream destination.
