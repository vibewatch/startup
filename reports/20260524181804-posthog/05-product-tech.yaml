summary: 'PostHog’s product story is strongest as an integrated developer control plane: SDK-led capture, ClickHouse-backed analytics and SQL, replay, flags, experiments, warehouse, CDP, and MCP all share one data substrate. Public evidence also makes the deployment trade-off unusually clear — cloud is the preferred and better-supported path, while self-host remains real but hobby-to-midscale, operator-owned, and explicitly weaker on guarantees. Trust posture benefits from transparent legal pages, security advisories, and public post-mortems, but those same disclosures preserve real reliability and self-host risk caveats that diligence should not smooth away.'
sections:
- id: platform-definition-and-engineering-loop
  title: Platform definition and the engineering workflow PostHog is selling
  body: |-
    PostHog’s product definition is broader than “product analytics.” The official Product OS docs package analytics, web analytics, replay, feature flags, experimentation, surveys, and a data warehouse as one system, while the repo and YC profile extend that scope into error tracking, CDP/data pipelines, LLM observability, and an AI product assistant. In workflow terms, the company is trying to own an engineer-led loop: instrument behavior with SDKs and autocapture, inspect it with analytics/replay/SQL, ship changes behind flags and experiments, and then activate or export the resulting data into the rest of the stack.

    That bundled workflow is a real differentiator because it reduces tool stitching for early and mid-stage engineering teams. The public pack also makes the commercial shape legible: pricing is usage-metered by product surface, and the free tier spans nearly every major module. The trade-off is that module breadth is now part of the diligence question. Core analytics, replay, and flags look mature in public docs; newer AI, workflow, and broader activation surfaces are visible and monetized, but their exact GA-vs-preview mix is not equally explicit across the retained pack.
