- id: TE006
  title: Roadmap / release / development-stage table
  columns:
  - Stage / mechanism
  - What the public surface says
  - Current implication
  - Evidence
  - Remaining gap
  rows:
  - - Setting up
    - Initial planning and alpha development happen behind a feature flag
    - New surfaces can exist before broad customer visibility
    - Release handbook + feature-flag docs
    - No public artifact ties each current module to this stage taxonomy.
  - - Alpha
    - Customers you have spoken with are added slowly to the feature flag
    - Manual early rollout is part of the standard operating model
    - Release handbook
    - No public customer list or alpha telemetry is disclosed.
  - - Beta
    - Open to all users who want to opt in
    - Opt-in beta is a normal gate before broad release
    - Release handbook
    - The retained pack does not map every current product to beta or GA status.
  - - GA
    - Full launch includes pricing and marketing
    - Commercial and product surfaces are expected to align at GA
    - Release handbook + pricing
    - Specific launch dates remain product-specific and often undisclosed.
  - - Feature previews / coming soon
    - Users can toggle previews or register interest at user level
    - PostHog uses in-product demand discovery before wider rollout
    - Release handbook
    - The preview list itself is not fully captured in the retained pack.
  - - JS SDK cadence
    - Docs say the team ships weirdly fast and npm shows a release two days before run date
    - The browser surface appears actively maintained
    - JS docs + npm
    - Velocity alone does not prove stability.
  - - Python SDK cadence
    - PyPI shows a 2026-05-21 upload with trusted publishing provenance
    - Non-JS SDK surface also appears active and current
    - PyPI
    - Registry freshness does not prove equal feature parity across languages.
  - - Public roadmap page
    - Roadmap URL is live but retained fetch returned only a loading shell
    - Readable near-term roadmap detail is not accessible from the audited public pack
    - Roadmap fetch
    - Specific upcoming items, owners, and dates still require internal diligence.
  notes: Release-process evidence is stronger than roadmap readability. Public process exists, but public item-level timing is still partially opaque in the retained pack.
