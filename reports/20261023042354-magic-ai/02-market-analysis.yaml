    notes: "Polaris values are analyst-market-data estimates; Magic context values are technical claims, not revenue or market-size measures. SAM, SOM, pricing, and customer conversion remain unavailable in the assigned evidence."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
