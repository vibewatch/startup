    notes: "Buyer roles and triggers are analytical segmentation grounded in Polaris's enterprise/SME adoption discussion and the cited software-engineering use cases; Magic-specific procurement, pricing, and conversion are not disclosed."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
