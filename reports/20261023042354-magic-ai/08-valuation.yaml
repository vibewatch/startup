    columns: [Dimension, Assessment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, research-more, "No public current revenue, ARR, or price evidence in assigned sources", "Do not underwrite a buy at an unverified price"]
      - [Confidence, medium, "Technical and funding disclosures are company-issued; commercial proof is incomplete", "Seek primary operating and financing data"]
      - [Risk rating, high, "Compute scale and commercialization uncertainty are material", "Require downside protection and milestones"]
      - [Valuation stance, expensive-or-unknown, "No current Magic financing price is evidenced in the assigned source pool", "Do not treat an unsupported historical mark as current NAV"]
      - [Target return, not supportable, "No entry price, dilution, or exit assumptions are public in the assigned pool", "Calculate only after cap-table and terms diligence"]
    notes: "The table separates recommendation from valuation stance; null or unsupported current price inputs are treated as evidence gaps rather than estimates."
    claimRefs: [CV001, CV004, CV005, CV006, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Technical scarcity, "Magic reports a 100M-token context model and a custom stack", "Independent benchmark replication and paid production usage"]
      - [Compute access, "Magic says it is building Google Cloud H100 and GB200 supercomputers", "Signed capacity economics, utilization, and inference-cost disclosure"]
      - [Funding capacity, "Magic reports $515M total raised including a $320M investment", "Audited cash, burn, runway, and financing instrument review"]
      - [Commercialization risk, "The New Stack reports no public evidence of LTM-2-mini use outside Magic as of early 2026", "Named customers, deployment depth, renewal, and usage telemetry"]
      - [Category validation, "Sacra and TechCrunch describe large coding-agent financings and revenue signals", "Comparable product, margin, growth, and preference adjustments"]
      - [Incumbent pressure, "Cursor presents broad enterprise adoption and multiple model-provider integrations", "Evidence Magic wins durable workloads despite bundled alternatives"]
    notes: "Comparable-company claims are directional context only; they are not interchangeable revenue multiples for Magic."
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Key risks and trigger]
    rows:
      - [Bull, "Production customers validate long-context coding; recurring revenue and margins become measurable", "Strategic scarcity could support a premium category valuation, but no multiple is assigned without revenue", "Low-to-medium; requires new evidence", "Trigger: verified paid deployments and repeatable gross margin"]
      - [Base, "Technical progress continues while commercial metrics remain private or early", "Track rather than price; wait for terms and operating denominator", "Medium; consistent with current public evidence", "Trigger: no timely disclosure of revenue, retention, or unit economics"]
      - [Bear, "Competition reduces scarcity and compute commitments outpace monetization", "Down-round or preference-adjusted common value may be materially below headline financing marks", "Material; adverse commercialization evidence exists", "Trigger: failed production conversion, financing stress, or persistent benchmark gap"]
      - [Entry discipline, "Current price and fully diluted ownership are verified", "Only model returns after preferences, dilution, debt, and exit window are known", "Required before investment", "Trigger: terms cannot be independently checked"]
    notes: "Scenarios are qualitative because the assigned evidence does not provide a current entry price, revenue denominator, cap table, or supported probability distribution."
    claimRefs: [CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Technical promise and financing scale pass through missing commercial denominators and execution risk to a research-more recommendation.
    data:
      nodes:
        - id: technical-proof
          label: Technical proof
          detail: 100M-token context claim and custom training stack
        - id: financing-signal
          label: Financing signal
          detail: $515M total raised claimed by Magic
        - id: commercial-proof
          label: Commercial proof
          detail: Current revenue, retention, and paid deployments not publicly evidenced
        - id: compute-risk
          label: Compute and execution risk
          detail: Large planned supercomputer footprint and hiring burden
        - id: comparable-context
          label: Comparable context
          detail: Coding-agent category shows both large financings and repricing risk
        - id: recommendation
          label: Research-more
          detail: Verify terms and operating metrics before entry
      edges:
        - [technical-proof, commercial-proof]
        - [financing-signal, compute-risk]
        - [commercial-proof, recommendation]
        - [compute-risk, recommendation]
        - [comparable-context, recommendation]
    approximationNotes: "The flow is analytical sequencing, not a probability tree or valuation bridge; no unsupported conversion rates are implied."
    claimRefs: [CV001, CV004, CV008, CV010, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Research-more
    body: >-
      The public record supports a technically differentiated company, not a priced
      investment. Require current financing terms, paid production evidence, retention,
      gross margin, inference cost, and preference-adjusted ownership before underwriting.
    claimRefs: [CV004, CV005, CV006, CV013, CV016]
  - calloutType: risk
    title: Commercialization is the valuation hinge
    body: >-
      A respected independent report says there was no public evidence of LTM-2-mini use
      outside Magic as of early 2026. This is a diligence trigger rather than proof of
      non-use, and it limits confidence in any headline valuation.
    claimRefs: [CV010]
