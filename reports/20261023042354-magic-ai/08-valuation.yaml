company:
  name: Magic AI
chapter:
  number: 8
  title: Valuation
  summary: Magic has credible technical differentiation in ultra-long-context code models and disclosed $515 million of total funding, but the public record does not establish current revenue, customer conversion, or a current financing price. The appropriate stance is research-more rather than a precise buy recommendation because comparable-company evidence shows both substantial category value and rapid repricing risk.
sections:
  - id: investment-call
    title: Investment call and evidence boundary
    body: >-
      The evidence supports a differentiated technical thesis but not a fully underwritten
      valuation. Magic states that its LTM-2-mini model was trained for 100 million-token
      contexts and that it has raised $515 million, including a recent $320 million
      investment; these are company claims rather than independently audited financial
      results. The same source says Magic had 23 people and was still hiring, which
      underscores an unusually concentrated execution model relative to the compute
      ambition.       The assigned evidence set does not provide current revenue, ARR, gross margin,
      retention, customer count, price realization, or cap-table preferences. That
      missing denominator makes a revenue-multiple or cash-flow valuation speculative.
      I therefore recommend research-more, with high risk and an expensive-or-unknown
      entry stance until management supplies current financing terms and operating
      metrics. The positive case is that a useful long-context coding system could create
      strategic value for developers and infrastructure partners; the anti-thesis is
      that technical demonstrations may not translate into production demand before
      compute and model competition compress economics.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparables
    body: >-
      Magic's strongest valuation support is capability scarcity: its post says the
      company built a custom training and inference stack, reported a 100 million-token
      model, and planned large Google Cloud supercomputers using H100 and GB200 systems.
      Those statements indicate ambition and a potentially valuable technical option, but
      they do not prove commercial scalability. The competitive record is a warning.
      The New Stack notes that Magic had raised more than $500 million on its
      context-window strength and that, as of early 2026, there was no public evidence
      of LTM-2-mini being used outside Magic. This is an adverse commercialization
      signal, not proof that Magic has no customers. Meanwhile, Sacra estimates that
      Cursor reached $4 billion of annualized revenue in May 2026, while TechCrunch
      reported Cognition at a $25 billion pre-money valuation and $492 million
      annualized revenue run-rate. These are
      category comparables, not direct multiples for Magic: they have different products,
      scale, disclosure quality, and financing terms.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, entry discipline, and diligence
    body: >-
      A scenario framework is more defensible than a point estimate. In the bull case,
      independent production usage validates the 100 million-token architecture, Magic
      converts strategic cloud and developer relationships into recurring revenue, and
      the company raises on terms that preserve meaningful common-equity upside. In the
      base case, technical progress continues but commercialization remains
      under-disclosed, so an investor tracks the company and waits for revenue,
      retention, and unit-economics evidence. In the bear case, competing models make
      long context less scarce, compute commitments create financing pressure, and a
      down round or preference stack absorbs much of the value implied by the prior
      financing. The entry rule should therefore require a verified current price,
      fully diluted capitalization, liquidation preferences, debt or cloud commitments,
      and evidence of paid production workloads. Exit readiness is not demonstrated by
      the assigned sources: a financing, acquisition, or IPO path remains contingent on
      durable usage and efficient inference. The highest-value diligence asks are current
      ARR and revenue recognition, cohort retention, named paid deployments, gross
      margin and inference cost per task, financing instruments and preferences, and
      independent benchmark or customer validation.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
