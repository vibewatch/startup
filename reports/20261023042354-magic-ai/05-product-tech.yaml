          detail: Controls not established by retained evidence.
          items:
            - label: Isolation
              detail: Tenant and execution isolation are not established in retained evidence.
            - label: Reliability
              detail: SLA, incident, and rollback controls are not established in retained evidence.
    approximationNotes: "The stack is an analytical synthesis of disclosed workflow and infrastructure components; it does not imply a verified implementation sequence or data-flow guarantee."
    claimRefs: [CE001, CE005, CE009, CE011, CE012]

callouts:
  - calloutType: recommendation
    title: Diligence stance
    body: Treat Magic as a technically differentiated but early product opportunity. Advance only after obtaining reproducible benchmark artifacts, external production references, security and privacy documentation, and unit-cost evidence at repository scale.
    claimRefs: [CE008, CE011, CE012]
  - calloutType: assumption
    title: Evidence boundary
    body: Public reporting and benchmark documentation establish the product thesis and evaluation context, but not commercial availability, independent performance, or production reliability.
    claimRefs: [CE002, CE007, CE008]

