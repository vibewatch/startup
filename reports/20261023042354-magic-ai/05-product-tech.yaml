      - ["HashHop evaluation", "Test storage and retrieval across long context", "Benchmark design and implementation", "Metric may not predict production coding outcomes"]
      - ["Coding-agent workflow", "Write, review, debug, and plan changes", "Execution environment, tools, and tests", "No retained evidence of isolation, rollback, or audit controls"]
      - ["Magic-G4 compute", "Training and inference capacity using H100 GPUs", "Google Cloud and NVIDIA hardware", "Cloud capacity, cost, and supply concentration"]
      - ["Magic G5 compute", "Planned next-generation training/inference capacity", "Blackwell systems and cloud deployment", "Schedule, utilization, and economics unverified"]
    notes: "Architecture rows distinguish reported components from diligence assumptions; no security or reliability control is inferred from the existence of a compute partnership."
    claimRefs: [CE005, CE006, CE009, CE010, CE011, CE012]

