      - [Cursor, "Named testimonials from Stripe, Brex, Coinbase, Rippling, Optiver, and others", "Several testimonials describe broad or firm-wide rollout", "Reported adoption and velocity improvements, including 70% of engineers at Brex and over 800 engineers at Trimble", "Competitor marketing testimonials lack independent verification and Magic comparability"]
    notes: "Enumeration is partial and limited to named proof visible in the assigned prefetched pages; it is a benchmark, not an exhaustive market census."
    enumerationScope:
      coverage: partial
      basis: "Named customer and deployment proof visible in the eight assigned prefetched sources, accessed 2026-10-23, with Magic and selected coding-agent comparators."
    claimRefs: [CU004, CU006, CU007, CU011]
