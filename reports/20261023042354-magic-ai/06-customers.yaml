company:
  name: Magic AI
chapter:
  number: 6
  title: Customers
  summary: Public evidence describes Magic's intended buyer as professional software-engineering teams, but the assigned evidence does not establish named Magic production customers, active-account scale, retention, or commercial conversion. Competitor case studies show that customer proof in this category is available at meaningful operational depth, making Magic's limited disclosure a material diligence gap.
sections:
  - id: buyer-and-use-case
    title: Buyer, user, and use-case fit
    body: >-
      Magic presents an autonomous software engineer rather than a conventional code-completion utility. The available company-profile material describes natural-language planning, writing, review, debugging, and management of large code changes, while also framing the product as an “AI colleague” for complex engineering work. That positioning implies a primary user set of software engineers and engineering managers, with an economic buyer likely in a technology organization that can value throughput, migration speed, or reduced technical debt. The evidence does not identify a paying customer, a contract structure, a deployment boundary, or whether a human engineer must approve every production change. Accordingly, buyer fit is plausible from the workflow described, but payer, procurement owner, and realized business value remain unverified.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof and evidence quality
    body: >-
      Magic's public customer proof is materially thinner than the category benchmarks in the assigned pool. AIHub describes the company and its models but does not name a customer deployment or outcome, and Startuply explicitly says that commercial details and named customers are not yet public. By contrast, competitor-owned pages provide long lists of named organizations and quantified workflow outcomes, while a Cognition engineering post describes a concrete internal deployment across web, Slack, Linear, CLI, and API interfaces. These comparators do not prove Magic's adoption; they establish the level of evidence a buyer or investor could expect from a mature coding-agent go-to-market motion. The key conclusion is therefore not that Magic has no customers, but that public evidence cannot distinguish pilots, evaluations, internal use, and production accounts.
    claimRefs: [CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      No assigned source reports Magic's net revenue retention, gross retention, churn, renewal rate, contract length, cohort behavior, customer count, or concentration. The absence of those disclosures prevents a durability judgment and also blocks a reliable land-and-expand analysis. A plausible expansion path would move from a bounded engineering workflow such as repository understanding or code migration toward broader agent access and integrations, but that is an analytical hypothesis rather than observed Magic behavior. Competitor evidence suggests that expansion can be measured through organization-wide rollout, repeated workflows, or quantified engineering output, yet those metrics remain competitor-reported and cannot be transferred to Magic. Commercial diligence should therefore prioritize cohort-level usage and renewal evidence rather than additional logo collection.
    claimRefs: [CU008, CU009, CU010]
    tableRefs: [TU003]
  - id: customer-diligence-implications
    title: Investment implications and diligence priorities
    body: >-
      The customer case is investable only as an open proof question, not as demonstrated traction. Magic's long-context and autonomous-engineering positioning may create a differentiated wedge for large codebases, but customer value depends on reliability, security review, workflow integration, and repeat use. The assigned benchmark material shows that named customers often disclose the use case and an outcome, such as migration acceleration, incident triage, or organization-wide adoption; Magic's retained evidence does not reach that standard. The next decision should be driven by verifiable customer artifacts: a segmented account list, production-versus-pilot status, usage and renewal cohorts, realized savings or output lift, procurement blockers, and the share of revenue or usage represented by the largest accounts. Until those are available, customer confidence should remain low.
    claimRefs: [CU011, CU012, CU013]
    figureRefs: [FU001]
