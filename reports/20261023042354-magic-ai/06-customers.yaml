    title: Customer proof path from product fit to durable expansion
    type: journey-map
    summary: Magic's publicly supportable customer journey stops at a plausible workflow fit and lacks disclosed proof for production deployment, renewal, and expansion.
    data:
      items:
        - label: "1. Workflow fit"
          stage: "1. Workflow fit"
          title: "Autonomous engineering use case"
          touchpoints: ["Natural-language engineering work", "Large-codebase context", "Professional developer workflow"]
          value: "Supported positioning"
          note: "Third-party profiles describe the intended workflow; they do not identify a paying account."
        - label: "2. Evaluation"
          stage: "2. Evaluation"
          title: "Pilot or design-partner validation"
          touchpoints: ["Security review", "Reliability testing", "Procurement assessment"]
          value: "Not disclosed"
          note: "No assigned source separates evaluation activity from production use."
        - label: "3. Production deployment"
          stage: "3. Production deployment"
          title: "Named account using Magic"
          touchpoints: ["Repository integration", "Human review", "Measured engineering outcome"]
          value: "Not publicly evidenced"
          note: "Startuply says named customers are not yet public."
        - label: "4. Renewal"
          stage: "4. Renewal"
          title: "Repeat usage and contract durability"
          touchpoints: ["Renewal", "Usage cohort", "Gross or net retention"]
          value: "Not disclosed"
          note: "No retention, churn, contract-length, or cohort metric is retained."
        - label: "5. Expansion"
          stage: "5. Expansion"
          title: "Broader organization rollout"
          touchpoints: ["More repositories", "More teams", "Additional workflows or API usage"]
          value: "Unverified"
          note: "Competitor examples show this proof can be reported, but they are not Magic evidence."
        - label: "6. Concentration control"
          stage: "6. Concentration control"
          title: "Resilient customer base"
          touchpoints: ["Top-account share", "Channel dependence", "Diversified use cases"]
          value: "Unknown"
          note: "No Magic account concentration or channel data is publicly retained."
    claimRefs: [CU001, CU004, CU008, CU009, CU010]
callouts:
  - calloutType: risk
    title: Customer traction is an unresolved investment risk
    body: "The retained evidence supports a plausible buyer and workflow, but not external production adoption, retention, expansion, or concentration. Treat customer traction as unproven until Magic supplies account-level and cohort-level evidence."
    claimRefs: [CU004, CU008, CU010]
  - calloutType: insight
    title: The evidence gap is unusually testable
    body: "A customer diligence package can resolve the central uncertainty without relying on more market commentary: provide named references, production-versus-pilot status, usage cohorts, renewal behavior, and outcome measurement."
    claimRefs: [CU011, CU012, CU013]
