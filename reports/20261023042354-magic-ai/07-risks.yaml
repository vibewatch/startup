schemaVersion: "report-v2"
artifact: risks
slug: magic-ai
runDate: 2026-10-23
company:
  name: Magic AI
chapter:
  number: 7
  title: Risks
  summary: >-
    Magic's principal risk is execution under a capital-intensive research-first model: public evidence describes a technically ambitious but not-yet-commercial product, while the company has disclosed limited customer, security, legal, and financial operating detail. External AI governance, authorization, and copyright frameworks make those evidence gaps material diligence items rather than proof of a company-specific violation.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break conditions
    body: >-
      Magic's risk profile is dominated by commercialization and infrastructure execution. TechCrunch reported in August 2024 that Magic's tools were “not yet for sale,” that the company had around two dozen people and “no revenue to speak of”; the assigned company and independent profiles also describe a research-first strategy and very large compute ambitions. Those facts support a high execution and financing-risk assessment, but they do not establish cash burn, runway, or insolvency. The practical thesis break is a failure to convert the long-context research advantage into a sellable product with repeatable production use before the compute and hiring burden outruns financing capacity. A second thesis break is an inability to document customer-facing security, privacy, authorization, and reliability controls suitable for enterprise code access. The monitoring plan is to obtain monthly cash runway, launch and deployment milestones, production customer references, incident metrics, and an enterprise control matrix; absent that evidence, residual exposure remains high rather than “managed.”
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and data-governance exposure
    body: >-
      The assigned evidence does not show a Magic-specific lawsuit, enforcement action, license failure, or infringement finding, so the report should not convert general AI litigation or regulation into a company allegation. It does show why training-data provenance, copyright allocation, privacy controls, and deployment governance are decision-critical. The EU Artificial Intelligence Act is a binding harmonized framework whose application depends on system role and use case; NIST's framework is voluntary and intended to improve trustworthiness risk management. A court docket involving Stability AI records a complaint and later motion practice, but it is a competitor precedent rather than evidence against Magic. Magic's public materials describe frontier pretraining, reinforcement learning, ultra-long context, and code generation without providing the requested provenance, evaluation, or indemnity package. The residual legal exposure is therefore unquantified and should be treated as material until counsel reviews datasets, licenses, model cards, customer terms, and jurisdiction-specific obligations.
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: operational-dependencies
    title: Operational, security, partner, and financial dependencies
    body: >-
      Magic's operating model creates linked dependencies: large-scale compute, cloud and accelerator availability, model quality at long context, secure handling of customer code, and enough capital to reach product-market proof. TechCrunch reported a Google Cloud partnership involving H100 and planned Blackwell systems and an ambition to scale to “tens of thousands” of GPUs; that is a disclosed plan, not evidence that the infrastructure was delivered or economically sustainable. The New Stack's 2026 comparison shows that long-context claims are contestable and that benchmark results can carry methodological caveats, while the MCP security document demonstrates how authorization proxies can create confused-deputy attacks if per-client consent and redirect controls are missing. Magic has not publicly supplied enough architecture, uptime, benchmark-reproduction, security, or unit-cost data in the assigned pool to rate these controls mature. Diligence should therefore test failure modes with production telemetry, red-team reports, cost per task, cloud commitments, and customer reference checks.
    claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: diligence-triggers
    title: Monitoring indicators and diligence triggers
    body: >-
      The risk register is intentionally evidence-led. Positive evidence would include a shipping product, named production deployments, repeatable task-level quality against relevant baselines, documented security controls, and disclosed unit economics that reconcile compute commitments with gross-margin potential. Negative evidence would include delayed launches, inability to reproduce long-context results, outages or data incidents, customer restrictions on code use, adverse legal findings, or financing that increases dilution without improving commercial proof. The absence of a recorded incident in the assigned sources is not evidence that no incident occurred. Investors should require a current litigation and regulatory search, dataset and license schedule, SOC 2 or equivalent control evidence where applicable, cloud contract and GPU capacity terms, cash-burn and runway schedule, and customer-level conversion and retention data before reducing the high residual-risk assessment.
    claimRefs: [CR003, CR004, CR009, CR012, CR014, CR016]

tables:
  - id: TR001
    title: Severity-ranked risk register
    columns: [Risk, Evidence, Likelihood, Impact, Mitigation maturity, Residual exposure, Thesis-break or diligence trigger]
    rows:
      - [Commercialization before capital exhaustion, "Tools were not yet for sale and no revenue to speak of in TechCrunch's 2024 account; Netfigo describes research first, product later.", high, critical, "Low: milestone and runway data are not disclosed in the assigned evidence.", high, "Monthly cash runway; paid production deployments; conversion from pilot to recurring contract."]
      - [Compute and infrastructure scale, "Magic disclosed thousands of GB200s and TechCrunch reported plans for H100/Blackwell supercomputers and tens of thousands of GPUs.", medium, critical, "Low-to-medium: partnership and capacity claims are disclosed, but delivery, utilization, and cost evidence are not.", high, "Capacity delivery, utilization, cost per task, cloud commitments, and gross-margin reconciliation."]
      - [Model quality and differentiation, "Magic claims 100M-token context; independent coverage notes that rivals ship products and later reporting says there is no public evidence of external LTM-2-mini use.", high, high, "Low: no assigned reproducible evaluation package or production benchmark set.", high, "Reproducible task-level benchmarks and named production references versus shipped competitors."]
    notes: "Risk judgments synthesize the assigned source text; likelihood, impact, mitigation maturity, and residual exposure are analyst assessments, not company-reported measurements. Null or undisclosed operating metrics are not treated as zero."
    enumerationScope:
      coverage: partial
      basis: "Three highest-priority risks visible in assigned public sources through 2026-10-23; not a complete enterprise risk inventory."
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction or relationship, Evidence status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Training-data copyright and licensing, "United States and other source-data jurisdictions", "General AI litigation precedent exists; no Magic-specific finding in assigned evidence.", medium, high, "Unknown: no dataset or indemnity disclosure supplied.", high, "Obtain dataset provenance, license exceptions, model memorization tests, customer indemnities, and outside-counsel opinion."]
      - [EU AI Act obligations, European Union, "Regulation (EU) 2024/1689 lays down harmonised rules; applicability depends on system role and use.", medium, high, "Unknown: provider/deployer classification and technical file are not supplied.", medium-high, "Map Magic models and coding-agent deployments to provider, deployer, GPAI, transparency, and risk-management obligations."]
      - [Privacy and confidential-code handling, "Customer and employee data across deployment jurisdictions", "Public company page states mission and technology direction but does not provide retention, DPA, or tenant-isolation terms.", medium, high, "Unknown.", high, "Review DPA, retention/deletion defaults, training-use controls, encryption, access logs, and breach response."]
      - [Regulatory assurance and trustworthiness, "Enterprise and potentially critical-infrastructure customers", "NIST AI RMF is voluntary; assigned source does not establish Magic adoption or certification.", medium, medium-high, "Unknown.", medium-high, "Request control mapping, evaluation governance, incident response, and any independent assurance reports."]
    notes: "The court docket is a competitor precedent, not a Magic proceeding. Regulatory severity reflects exposure if the relevant use case or jurisdiction applies; it is not a finding that Magic has violated a rule."
    enumerationScope:
      coverage: partial
      basis: "Four material legal and governance issue classes identified from assigned statutes, court record, standards, and company disclosures; not legal advice."
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
  - id: TR003
    title: Operational, quality, security, and dependency risk register
    columns: [Failure mode or dependency, Counterparty or surface, Failure scenario, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Cloud and accelerator dependency, "Google Cloud and NVIDIA systems described by TechCrunch", "Delayed or uneconomic capacity prevents training, inference, or customer service.", critical, "Unknown: partnership intent is public, but contract terms and utilization are not.", high, "Obtain capacity commitments, pricing, portability, failover, and actual utilization."]
      - [Long-context reliability, "LTM-2-mini and code-generation workflow", "Large context produces retrieval or coding errors that a demo does not reveal.", high, "Low: independent reproduction and production telemetry are absent.", high, "Run blinded repository tasks with recall, defect, latency, and cost metrics."]
      - [Authorization and customer-code security, "Any API, agent, plugin, or MCP-style integration", "Confused-deputy, redirect, consent, or token-handling flaw exposes third-party access or code.", critical, "Unknown: MCP guidance specifies controls, but Magic's implementation is not disclosed.", high, "Obtain architecture, threat model, per-client consent evidence, redirect validation, CSRF controls, and red-team results."]
      - [Capital intensity and financing dependency, "Private investors and compute suppliers", "High compute and hiring spend requires new capital before commercial proof, causing dilution or strategic constraint.", high, "Low: funding is reported, but cash available, burn, runway, and terms are not.", high, "Reconcile bank cash, monthly burn, committed spend, runway, debt, preferences, and next financing assumptions."]
    notes: "Operational and dependency ratings are conditional where Magic-specific controls or contracts are not public. The MCP source is a technical security reference, not evidence that Magic uses MCP or has suffered an incident."
    claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016]

figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Residual exposure remains concentrated in commercialization, infrastructure, model reliability, and customer-code security until operating evidence is supplied.
    data:
      columns: [Likelihood, Impact, Residual severity]
      rows:
        - {label: Commercialization before capital exhaustion, values: [High, Critical, "Commercialization before capital exhaustion — High"]}
        - {label: Compute and infrastructure scale, values: [Medium, Critical, "Compute and infrastructure scale — High"]}
        - {label: Model quality and differentiation, values: [High, High, "Model quality and differentiation — High"]}
        - {label: Privacy and confidential-code handling, values: [Medium, High, "Privacy and confidential-code handling — High"]}
        - {label: Capital intensity and financing dependency, values: [Medium, High, "Capital intensity and financing dependency — High"]}
        - {label: Regulatory assurance and trustworthiness, values: [Medium, "Medium-high", "Regulatory assurance and trustworthiness — Medium-high"]}
    approximationNotes: "Likelihood, impact, and residual severity are qualitative analyst assessments from the assigned evidence; the matrix does not imply numerical probabilities or a company-reported risk score."
    claimRefs: [CR001, CR002, CR003, CR008, CR009, CR016]

callouts:
  - calloutType: risk
    title: Commercial proof is the central kill criterion
    body: "The strongest adverse evidence is the gap between very large disclosed funding and a product described as not yet for sale with no revenue to speak of. Require paid production usage and runway evidence before treating technical differentiation as investable commercial traction."
    claimRefs: [CR001, CR002, CR005]
  - calloutType: assumption
    title: Absence of incident evidence is not clearance
    body: "The assigned pool contains no verified Magic-specific breach, outage, enforcement, or lawsuit finding. That is a coverage limitation, not proof that none occurred; obtain a current legal, security, and reliability review."
    claimRefs: [CR008, CR009, CR014]

