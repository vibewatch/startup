company:
  name: Magic AI
chapter:
  number: 1
  title: Company Overview
  summary: Magic AI is a San Francisco-based private company founded in 2022 by Eric Steinberger and Sebastian De Ro that is developing long-context coding models and an AI software engineer. Public evidence confirms substantial financing and ambitious product claims, but current revenue, customers, valuation, governance, and production adoption remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity and product
    body: >-
      Magic AI is identified by Tracxn as a San Francisco company founded in 2022 by Eric
      Steinberger and Sebastian De Ro, operating in AI-based code completion and code
      generation. Independent coverage describes a broader ambition than inline completion:
      Magic's tools were designed to help engineers write, review, debug, and plan changes,
      while its LTM architecture was intended to ingest unusually large codebases. The
      Decoder reported the company's LTM-2-mini claim of a 100-million-token context window,
      equivalent to about 10 million lines of code or 750 novels. These are company or
      third-party reports of product capability, not independent proof of production
      reliability, customer deployment, or realized revenue.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: founders-and-leadership
    title: Founders and leadership
    body: >-
      The public record supports a founder-led operating model centered on Eric Steinberger,
      who TechCrunch described as co-founder and CEO, and Sebastian De Ro, his co-founder.
      TechCrunch linked Steinberger's background to Cambridge computer science study and
      Meta AI research, and described De Ro's prior CTO role at FireStart. The same report
      said Magic had a small team of around two dozen people in August 2024, while later
      profiles give materially different staffing signals: approximately 50-100, 109 as of
      an unspecified August 26, and 19 for a legal-entity row dated December 31, 2024. These
      figures are not comparable enough to establish current headcount. The evidence also
      does not establish a board, independent directors, formal governance controls, or a
      complete executive roster, leaving founder dependence as a material diligence issue.
    claimRefs: [CO001, CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing and operating scale
    body: >-
      Financing is the clearest externally visible scale signal. TechCrunch reported a
      $320 million round announced in August 2024 and total funding of $465 million, while
      The Decoder reported $320 million from investors including Eric Schmidt, Jane Street,
      and Sequoia and $465 million total. Tracxn's later profile reports $466 million across
      four rounds, whereas AI Market Watch reports $515 million and lists a $5 million seed,
      $23 million Series A, $117 million Series B, and $320 million Series C. The resulting
      $465 million, $466 million, and $515 million totals are not reconciled. Tracxn also
      shows a historical peak valuation of $1.5 billion in December 2023 and says the latest
      valuation was 7% lower as of December 31, 2024; the actual latest valuation is masked.
      Revenue, ARR, customers, burn, runway, and financing terms remain unestablished.
    claimRefs: [CO009, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones and unresolved diligence
    body: >-
      The milestone record shows rapid movement from a 2022 founding to a major 2024
      financing and infrastructure build-out. TechCrunch reported a Google Cloud
      partnership for Magic-G4 and Magic-G5 systems using Nvidia H100 and planned Blackwell
      chips, while The Decoder described the 100-million-token LTM-2-mini announcement and
      the HashHop benchmark. The New Stack provides an important adverse check: in early
      2026 it stated there was no public evidence of LTM-2-mini being used outside Magic,
      despite the earlier financing and long-context claims. That does not prove the
      technology failed, but it limits public evidence of commercial adoption. A board
      roster, named customers, recurring revenue, production usage, security posture,
      training-data provenance, and current valuation should be requested before relying on
      the financing headline as evidence of operating maturity. The retained Polaris, BLS,
      and Artificial Analysis pages provide category, labor, and benchmark context, but no
      Magic-specific operating metrics; they should not be treated as company proof.
    claimRefs: [CO014, CO015, CO016, CO017]
    figureRefs: [FO001]
