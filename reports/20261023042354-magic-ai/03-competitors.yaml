      - [Amazon Q Developer, "Perpetual free tier: 50 agentic chat interactions per month and up to 1,000 transformed lines per month", "IDE, CLI, console, GitHub, chat, AWS operations, security scanning", "AWS identity and workflow integration can raise switching costs", "Verify paid tiers and realized enterprise pricing"]
      - [Claude Code, Not disclosed in assigned evidence, Prompt recipes and repository workflows; parallel sessions and scripts documented, Workflow familiarity can create process dependence, "Obtain current plans, data terms, and admin controls"]
      - [Cursor / Anysphere, Not disclosed in assigned evidence, "AI-powered coding tool; financing reported by TechCrunch; product and pricing details are not evidenced here", "Dedicated-editor adoption may create workflow migration cost", "Obtain current pricing, usage limits, and enterprise controls"]
    notes: "Only Amazon Q's captured page provides a concrete free-tier quantity. It is a published allowance, not realized customer pricing or unit economics; all other price fields remain unavailable."
    claimRefs: [CP004, CP005, CP006, CP015]
