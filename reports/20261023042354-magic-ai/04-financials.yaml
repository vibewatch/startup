callouts:
  - calloutType: strength
    title: Historically strong financing capacity
    body: Two retained sources report approximately $465M-$466M of total funding, including a roughly $320M-$321M 2024 round, although the totals and round descriptions should be reconciled.
    claimRefs: [CI010, CI011]
  - calloutType: risk
    title: Commercial proof is the missing bridge
    body: Public evidence does not establish current revenue, realized pricing, gross margin, cash, burn, runway, or production-customer conversion; an independent article also notes no public evidence of LTM-2-mini use outside Magic as of early 2026.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
  - calloutType: recommendation
    title: Underwrite only after private financial diligence
    body: Treat the reported valuation and funding as historical context, and require a current revenue-quality, unit-cost, cash-runway, and financing-dependency package before assigning a financial valuation stance.
    claimRefs: [CI014, CI015, CI016]
