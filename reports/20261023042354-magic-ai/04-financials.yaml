  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value or status, Confidence, Why it matters / diligence ask]
    rows:
      - [Total historical funding, "$465M-$466M reported by two sources", medium, "Historical capacity signal; reconcile round ledger and proceeds"]
      - [Reported valuation, "$1.5B tied to the reported 2024 Series C", medium, "Historical pricing reference, not current fair value"]
      - [Cash on hand, null, low, "Obtain latest balance and restricted cash"]
      - [Monthly net burn, null, low, "Obtain trailing-12-month burn and forecast"]
      - [Runway, null, low, "Calculate from cash, burn, and committed obligations"]
      - [Gross margin, null, low, "Obtain unit cost and realized-price bridge"]
      - [Cloud and hardware commitments, null, low, "Review Google Cloud, Nvidia, and other capacity obligations"]
    notes: "Funding and valuation are reported historical figures with a source discrepancy; all other nulls are material private-data gaps, not assumed zeros."
    claimRefs: [CI010, CI011, CI012, CI013, CI015, CI016]
