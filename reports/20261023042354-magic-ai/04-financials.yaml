company:
  name: Magic AI
chapter:
  number: 4
  title: Financials
  summary: Magic has raised substantial capital and is pursuing a technically ambitious, infrastructure-intensive model, but public evidence does not establish current revenue, realized pricing, gross margin, burn, runway, or customer conversion. The underwriting case therefore depends more on validating monetization and capital adequacy than on the reported financing headline.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: Magic's public materials describe a code-focused model and product workflow, but the assigned evidence does not disclose a price list, contract structure, realized revenue, ARR, or customer-level conversion. The careers page shows that the company is building both core systems and product surfaces, including APIs, backend services, and frontend workflows, which is consistent with a product-led or enterprise software motion but does not prove a particular revenue model. A third-party funding profile describes AI-powered code completion and generation and reports four funding rounds, yet that profile is a directory-style source rather than audited financial disclosure. The appropriate underwriting stance is therefore to separate capability from monetization - the product may support usage-based inference, subscriptions, enterprise contracts, or a mixture, but the current public record does not identify the unit actually sold or the realized price per unit. List prices from competing platforms can frame infrastructure economics, not Magic's revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure
    title: Cost structure and margin drivers
    body: The cost base is likely shaped by model training, inference, data acquisition, engineering, and specialized compute, but only some of those drivers are directly evidenced. Magic's recruiting copy explicitly calls out internet-scale data acquisition, long-horizon post-training loops, production reliability, and trade-offs between quality, performance, and cost. The Decoder reports that Magic was building supercomputers with Google Cloud and Nvidia and says the company raised $320 million in 2024, while Nvidia describes the GB200 NVL72 as a 72-GPU liquid-cooled rack designed for large-model training and inference. These sources establish technical and infrastructure context, not Magic's actual utilization, depreciation, cloud bill, or gross margin. Google Cloud's published token prices illustrate how model-serving costs can vary by input, output, caching, and endpoint, reinforcing that realized margin requires Magic's workload mix and commercial terms. No public source in this pool provides cash burn, gross margin, or working-capital data.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: traction-and-capital
    title: Traction, financing dependency, and capital adequacy
    body: The evidence supports a large historical financing headline but not cash available today. The assigned funding directory reports $466 million raised over four rounds and a $1.5 billion valuation tied to a $321 million Series C; The Decoder independently reports $465 million total funding and a $320 million 2024 raise. Those figures are close but not identical, so the chapter preserves the discrepancy rather than treating either as an audited total. The New Stack adds an adverse diligence signal - it says Magic announced a 100-million-token model in 2024, raised over $500 million on that strength, and had no public evidence of LTM-2-mini use outside Magic as of early 2026. That observation does not prove a failed commercialization effort, but it weakens confidence that technical differentiation has translated into repeatable customer revenue. Capital adequacy remains unresolved because there is no current cash balance, burn rate, runway, debt schedule, or next-round trigger in the retained pool.
    claimRefs: [CI010, CI011, CI012, CI013]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: Magic's financial profile is best characterized as well-funded historically but opaque operationally. The company has credible evidence of a high-cost frontier-model build - its own hiring materials describe distributed pre-training pipelines and production systems, while external reporting describes long-context performance claims, supercomputer infrastructure, and a large 2024 financing. That combination can create meaningful technical option value, but it also creates financing dependency if inference, training, and data costs scale faster than paid usage. A financial underwriting decision should not convert the $1.5 billion reported valuation into a current valuation conclusion, or convert total funding into cash on hand. The immediate diligence requests are current revenue and ARR by product, realized price and gross margin by workload, customer concentration and renewal, monthly net burn, cash and liquid investments, debt or committed cloud obligations, and the financing milestone that would trigger another round. Until those are supplied, the financial verdict remains research-more with high sensitivity to commercialization evidence.
    claimRefs: [CI014, CI015, CI016]
