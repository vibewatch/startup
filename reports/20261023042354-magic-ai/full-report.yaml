      - number: '5.2'
        title: Model architecture and evaluation
        blocks:
          - type: paragraph
            body: >-
              The central technical differentiation is the Long-term Memory Network, or LTM, with LTM-2-mini reported to
              support a 100 million-token context window—roughly 10 million lines of code or 750 novels. The Decoder
              reports that Magic created HashHop to test retrieval over random, non-compressible hashes and multi-step
              jumps through context, rather than relying only on semantic “needle” retrieval. The same report attributes
              a roughly 1,000-times efficiency comparison against the attention mechanism of Llama 3.1 405B to Magic,
              while noting that these are company claims. SWE-bench is a useful external task definition, but the
              retained SWE-bench repository documents the benchmark and reproducible Docker harness, not a Magic score.
              Accordingly, the evidence supports a differentiated evaluation approach, not a verified production-quality
              or independent benchmark lead.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE011
              - CE012
      - number: '5.3'
        title: Operating dependencies, maturity, and trust
        blocks:
          - type: paragraph
            body: >-
              Magic's disclosed scaling plan depends on specialized compute: TechCrunch reports a Google Cloud
              partnership for Magic-G4 with H100 GPUs and Magic G5 with next-generation Blackwell chips, while The
              Decoder describes a larger LTM-2 model and supercomputer work with Google Cloud and Nvidia. This creates a
              credible path to training and serving capability, but also concentrates execution on capital access, cloud
              capacity, accelerator supply, and software efficiency. The available sources do not establish
              customer-facing security architecture, data retention defaults, tenant isolation, privacy controls,
              copyright provenance, reliability SLAs, incident history, or certification status. OpenAI's Codex
              description illustrates the level of isolated execution, test evidence, and manual review expected in this
              category; it is a competitor reference, not evidence that Magic provides those controls. Product maturity
              should therefore be treated as promising but unverified outside the company's reported demonstrations.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence stance
            body: >-
              Treat Magic as a technically differentiated but early product opportunity. Advance only after obtaining
              reproducible benchmark artifacts, external production references, security and privacy documentation, and
              unit-cost evidence at repository scale.
            calloutType: recommendation
            claimRefs:
              - CE008
              - CE011
              - CE012
          - type: callout
            title: Evidence boundary
            body: >-
              Public reporting and benchmark documentation establish the product thesis and evaluation context, but not
              commercial availability, independent performance, or production reliability.
            calloutType: assumption
            claimRefs:
              - CE002
              - CE007
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and use-case fit
        blocks:
          - type: paragraph
            body: >-
              Magic presents an autonomous software engineer rather than a conventional code-completion utility. The
              available company-profile material describes natural-language planning, writing, review, debugging, and
              management of large code changes, while also framing the product as an “AI colleague” for complex
              engineering work. That positioning implies a primary user set of software engineers and engineering
              managers, with an economic buyer likely in a technology organization that can value throughput, migration
              speed, or reduced technical debt. The evidence does not identify a paying customer, a contract structure,
              a deployment boundary, or whether a human engineer must approve every production change. Accordingly,
              buyer fit is plausible from the workflow described, but payer, procurement owner, and realized business
              value remain unverified.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption proof and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Magic's public customer proof is materially thinner than the category benchmarks in the assigned pool.
              AIHub describes the company and its models but does not name a customer deployment or outcome, and
              Startuply explicitly says that commercial details and named customers are not yet public. By contrast,
              competitor-owned pages provide long lists of named organizations and quantified workflow outcomes, while a
              Cognition engineering post describes a concrete internal deployment across web, Slack, Linear, CLI, and
              API interfaces. These comparators do not prove Magic's adoption; they establish the level of evidence a
              buyer or investor could expect from a mature coding-agent go-to-market motion. The key conclusion is
              therefore not that Magic has no customers, but that public evidence cannot distinguish pilots,
              evaluations, internal use, and production accounts.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              No assigned source reports Magic's net revenue retention, gross retention, churn, renewal rate, contract
              length, cohort behavior, customer count, or concentration. The absence of those disclosures prevents a
              durability judgment and also blocks a reliable land-and-expand analysis. A plausible expansion path would
              move from a bounded engineering workflow such as repository understanding or code migration toward broader
              agent access and integrations, but that is an analytical hypothesis rather than observed Magic behavior.
              Competitor evidence suggests that expansion can be measured through organization-wide rollout, repeated
              workflows, or quantified engineering output, yet those metrics remain competitor-reported and cannot be
              transferred to Magic. Commercial diligence should therefore prioritize cohort-level usage and renewal
              evidence rather than additional logo collection.
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU011
      - number: '6.4'
        title: Investment implications and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The customer case is investable only as an open proof question, not as demonstrated traction. Magic's
              long-context and autonomous-engineering positioning may create a differentiated wedge for large codebases,
              but customer value depends on reliability, security review, workflow integration, and repeat use. The
              assigned benchmark material shows that named customers often disclose the use case and an outcome, such as
              migration acceleration, incident triage, or organization-wide adoption; Magic's retained evidence does not
              reach that standard. The next decision should be driven by verifiable customer artifacts: a segmented
              account list, production-versus-pilot status, usage and renewal cohorts, realized savings or output lift,
              procurement blockers, and the share of revenue or usage represented by the largest accounts. Until those
              are available, customer confidence should remain low.
            claimRefs:
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU009
              - CU010
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer traction is an unresolved investment risk
            body: >-
              The retained evidence supports a plausible buyer and workflow, but not external production adoption,
              retention, expansion, or concentration. Treat customer traction as unproven until Magic supplies
              account-level and cohort-level evidence.
            calloutType: risk
            claimRefs:
              - CU004
              - CU008
              - CU010
          - type: callout
            title: The evidence gap is unusually testable
            body: >-
              A customer diligence package can resolve the central uncertainty without relying on more market
              commentary: provide named references, production-versus-pilot status, usage cohorts, renewal behavior, and
              outcome measurement.
            calloutType: insight
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Magic's risk profile is dominated by commercialization and infrastructure execution. TechCrunch reported
              in August 2024 that Magic's tools were “not yet for sale,” that the company had around two dozen people
              and “no revenue to speak of”; the assigned company and independent profiles also describe a research-first
              strategy and very large compute ambitions. Those facts support a high execution and financing-risk
              assessment, but they do not establish cash burn, runway, or insolvency. The practical thesis break is a
              failure to convert the long-context research advantage into a sellable product with repeatable production
              use before the compute and hiring burden outruns financing capacity. A second thesis break is an inability
              to document customer-facing security, privacy, authorization, and reliability controls suitable for
              enterprise code access. The monitoring plan is to obtain monthly cash runway, launch and deployment
              milestones, production customer references, incident metrics, and an enterprise control matrix; absent
              that evidence, residual exposure remains high rather than “managed.”
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not show a Magic-specific lawsuit, enforcement action, license failure, or
              infringement finding, so the report should not convert general AI litigation or regulation into a company
              allegation. It does show why training-data provenance, copyright allocation, privacy controls, and
              deployment governance are decision-critical. The EU Artificial Intelligence Act is a binding harmonized
              framework whose application depends on system role and use case; NIST's framework is voluntary and
              intended to improve trustworthiness risk management. A court docket involving Stability AI records a
              complaint and later motion practice, but it is a competitor precedent rather than evidence against Magic.
              Magic's public materials describe frontier pretraining, reinforcement learning, ultra-long context, and
              code generation without providing the requested provenance, evaluation, or indemnity package. The residual
              legal exposure is therefore unquantified and should be treated as material until counsel reviews datasets,
              licenses, model cards, customer terms, and jurisdiction-specific obligations.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational, security, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Magic's operating model creates linked dependencies: large-scale compute, cloud and accelerator
              availability, model quality at long context, secure handling of customer code, and enough capital to reach
              product-market proof. TechCrunch reported a Google Cloud partnership involving H100 and planned Blackwell
              systems and an ambition to scale to “tens of thousands” of GPUs; that is a disclosed plan, not evidence
              that the infrastructure was delivered or economically sustainable. The New Stack's 2026 comparison shows
              that long-context claims are contestable and that benchmark results can carry methodological caveats,
              while the MCP security document demonstrates how authorization proxies can create confused-deputy attacks
              if per-client consent and redirect controls are missing. Magic has not publicly supplied enough
              architecture, uptime, benchmark-reproduction, security, or unit-cost data in the assigned pool to rate
              these controls mature. Diligence should therefore test failure modes with production telemetry, red-team
              reports, cost per task, cloud commitments, and customer reference checks.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Monitoring indicators and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              The risk register is intentionally evidence-led. Positive evidence would include a shipping product, named
              production deployments, repeatable task-level quality against relevant baselines, documented security
              controls, and disclosed unit economics that reconcile compute commitments with gross-margin potential.
              Negative evidence would include delayed launches, inability to reproduce long-context results, outages or
              data incidents, customer restrictions on code use, adverse legal findings, or financing that increases
              dilution without improving commercial proof. The absence of a recorded incident in the assigned sources is
              not evidence that no incident occurred. Investors should require a current litigation and regulatory
              search, dataset and license schedule, SOC 2 or equivalent control evidence where applicable, cloud
              contract and GPU capacity terms, cash-burn and runway schedule, and customer-level conversion and
              retention data before reducing the high residual-risk assessment.
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof is the central kill criterion
            body: >-
              The strongest adverse evidence is the gap between very large disclosed funding and a product described as
              not yet for sale with no revenue to speak of. Require paid production usage and runway evidence before
              treating technical differentiation as investable commercial traction.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: callout
            title: Absence of incident evidence is not clearance
            body: >-
              The assigned pool contains no verified Magic-specific breach, outage, enforcement, or lawsuit finding.
              That is a coverage limitation, not proof that none occurred; obtain a current legal, security, and
              reliability review.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a differentiated technical thesis but not a fully underwritten valuation. Magic
              states that its LTM-2-mini model was trained for 100 million-token contexts and that it has raised $515
              million, including a recent $320 million investment; these are company claims rather than independently
              audited financial results. The same source says Magic had 23 people and was still hiring, which
              underscores an unusually concentrated execution model relative to the compute ambition.       The assigned
              evidence set does not provide current revenue, ARR, gross margin, retention, customer count, price
              realization, or cap-table preferences. That missing denominator makes a revenue-multiple or cash-flow
              valuation speculative. I therefore recommend research-more, with high risk and an expensive-or-unknown
              entry stance until management supplies current financing terms and operating metrics. The positive case is
              that a useful long-context coding system could create strategic value for developers and infrastructure
              partners; the anti-thesis is that technical demonstrations may not translate into production demand before
              compute and model competition compress economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV013
      - number: '8.2'
        title: Thesis, anti-thesis, and comparables
        blocks:
          - type: paragraph
            body: >-
              Magic's strongest valuation support is capability scarcity: its post says the company built a custom
              training and inference stack, reported a 100 million-token model, and planned large Google Cloud
              supercomputers using H100 and GB200 systems. Those statements indicate ambition and a potentially valuable
              technical option, but they do not prove commercial scalability. The competitive record is a warning. The
              New Stack notes that Magic had raised more than $500 million on its context-window strength and that, as
              of early 2026, there was no public evidence of LTM-2-mini being used outside Magic. This is an adverse
              commercialization signal, not proof that Magic has no customers. Meanwhile, Sacra estimates that Cursor
              reached $4 billion of annualized revenue in May 2026, while TechCrunch reported Cognition at a $25 billion
              pre-money valuation and $492 million annualized revenue run-rate. These are category comparables, not
              direct multiples for Magic: they have different products, scale, disclosure quality, and financing terms.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, entry discipline, and diligence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate. In the bull case, independent production
              usage validates the 100 million-token architecture, Magic converts strategic cloud and developer
              relationships into recurring revenue, and the company raises on terms that preserve meaningful
              common-equity upside. In the base case, technical progress continues but commercialization remains
              under-disclosed, so an investor tracks the company and waits for revenue, retention, and unit-economics
              evidence. In the bear case, competing models make long context less scarce, compute commitments create
              financing pressure, and a down round or preference stack absorbs much of the value implied by the prior
              financing. The entry rule should therefore require a verified current price, fully diluted capitalization,
              liquidation preferences, debt or cloud commitments, and evidence of paid production workloads. Exit
              readiness is not demonstrated by the assigned sources: a financing, acquisition, or IPO path remains
              contingent on durable usage and efficient inference. The highest-value diligence asks are current ARR and
              revenue recognition, cohort retention, named paid deployments, gross margin and inference cost per task,
              financing instruments and preferences, and independent benchmark or customer validation.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              The public record supports a technically differentiated company, not a priced investment. Require current
              financing terms, paid production evidence, retention, gross margin, inference cost, and
              preference-adjusted ownership before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
              - CV016
          - type: callout
            title: Commercialization is the valuation hinge
            body: >-
              A respected independent report says there was no public evidence of LTM-2-mini use outside Magic as of
              early 2026. This is a diligence trigger rather than proof of non-use, and it limits confidence in any
              headline valuation.
            calloutType: risk
            claimRefs:
              - CV010
