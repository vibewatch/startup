        title: Exhibits
        blocks:
          - type: callout
            title: Capital and technical ambition
            body: >-
              Public sources report $465M, $466M, or $515M of financing while consistently describing an unusually
              ambitious long-context coding-model roadmap.
            calloutType: strength
            claimRefs:
              - CO009
