evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Current revenue, ARR, pricing realization, customer count, named deployments, and pilot-to-production conversion.
    whyItMatters: Funding and product claims do not establish commercial traction or operating maturity.
    diligencePath: >-
      Request management KPI schedules, customer cohort data, contracts, invoices, renewal records, and deployment
      references under confidentiality.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete executive roster, board composition, cap table, investor preferences, and control rights.
    whyItMatters: Founder concentration and financing headline may obscure governance, dilution, and key-person risk.
    diligencePath: >-
      Obtain the current charter, cap table, board materials, option ledger, investor rights agreements, and succession
      plan.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: A reconciled round-by-round financing schedule with signed close dates and exact proceeds.
    whyItMatters: >-
      Assigned sources report $465M, $466M, and $515M totals, so neither exact proceeds nor current ownership can be
      inferred.
    diligencePath: >-
      Reconcile financing announcements against bank statements, closing documents, the capitalization table, debt or
      credit agreements, and any secondary-sale records.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: adoption
    missingEvidence: Independent customer references and production telemetry for LTM-2-mini and Magic's coding tools.
    whyItMatters: The New Stack's absence-of-public-evidence observation limits confidence in external adoption.
    diligencePath: Request anonymized production metrics, customer references, retention data, and security/procurement artifacts.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Magic-specific pricing, active customers, production deployments, usage intensity, conversion, retention, and
      revenue or ARR.
    whyItMatters: >-
      Without company-level demand and monetization data, the broad AI code-tools forecast cannot be translated into
      SAM, SOM, or valuation-relevant revenue capture.
    diligencePath: >-
      Request a current customer and revenue cohort pack, pricing and contract examples, deployment counts,
      pilot-to-production conversion, renewal data, and segment-level pipeline.
