  - id: FM004
    title: Adoption funnel or value-chain map
    type: flow
    layout: standard
    summary: Public-road autonomous logistics scales through a staged path from policy opening to route validation, then into buyer-specific contracts and fleet integration.
    data:
      nodes:
        - id: P1
          label: "1. Policy opening"
          detail: "National and local policy opens a legal path for low-altitude or autonomous-logistics pilots."
          type: step
        - id: P2
          label: "2. Pilot-zone / route approval"
          detail: "Cities or districts qualify routes, vehicles, safety personnel, and operating conditions."
          type: step
          parent: P1
        - id: P3
          label: "3. Depot and relay integration"
          detail: "Operators connect depots, indoor robots, lockers, or manual couriers to the autonomous vehicle workflow."
          type: step
          parent: P2
        - id: P4
          label: "4. Remote ops and cost verification"
          detail: "Route economics improve as remote labor, maintenance, and downtime stabilize."
          type: step
          parent: P3
        - id: P5
          label: "5. Public-road scale contract"
          detail: "Postal, grocery, or platform customers expand from controlled sites into recurring commercial routes."
          type: step
          parent: P4
        - id: P6
          label: "6. Network integration"
          detail: "Platform or postal partners fold autonomous capacity into broader dispatch, procurement, and key-account networks."
          type: step
          parent: P5
        - id: R1
          label: "Risk: regulatory or IP delay"
          detail: "Approval cycles or unresolved legal disputes can stop a route from graduating from pilot to scale."
          type: risk
          parent: P4
    approximationNotes: "This flow is a generalized commercialization pathway inferred from Beijing's pilot path, Suzhou's operating examples, Meituan's certificate, and buyer deployment case studies from SingPost, FairPrice, and DHL."
    claimRefs: [CM015, CM019, CM021, CM025, CM026, CM027, CM031, CM043, CM044]
