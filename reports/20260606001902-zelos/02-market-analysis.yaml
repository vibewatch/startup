  evidenceGaps:
    - type: missing-source
      severity: material
      topic: proxy-market-sizing
      missingEvidence: A China-only, methodology-transparent TAM or SAM for robovans and autonomous ground-delivery vehicles.
      whyItMatters: Without a direct market-size study, valuation has to rely on proxy markets that mix parcel demand, drones, indoor robots, and warehouse automation.
      diligencePath: Ask management for the exact market-sizing framework used internally, including route classes, buyer segments, and the split between last-mile and middle-mile revenue pools.
      relatedQuestionRefs: [QM007, QM024]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: fleet-scale
      missingEvidence: An audited post-merger fleet count reconciled across Zelos, Cainiao, and partner materials.
      whyItMatters: Public sources disagree on whether current fleet scale is above 20,000 or above 25,000 vehicles, which affects implied market share and commercialization maturity.
      diligencePath: Request a dated fleet bridge showing active vehicles, delivered vehicles, countries, and whether Cainiao-branded vehicles are included.
      relatedQuestionRefs: [QM022]
    - type: private-evidence-only
      severity: material
      topic: economics
      missingEvidence: Route-level gross margin, remote-operations cost, utilization, failure-rate, and capex data by vehicle class and scenario.
      whyItMatters: Public articles cite cost reductions, but not with enough granularity to underwrite normalized unit economics for last-mile versus middle-mile contracts.
      diligencePath: Request cohort-level operating data by customer type, including parcel economics, monthly opex, and payback period for Z5- versus Z10-class deployments.
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM004]
    - type: access-blocked
      severity: minor
      topic: legal-risk
      missingEvidence: An official filing, court record, or final regulator statement on the outcome of JD's complaint against Jiushi.
      whyItMatters: The legal overhang is visible in media coverage, but the chapter cannot yet separate allegation, investigation, and adjudicated outcome.
      diligencePath: Search Chinese court and police disclosure systems, then request company counsel's summary of case status, settlements, and IP-clean-room procedures.
      relatedQuestionRefs: [QM020, QM025]
    - type: missing-source
      severity: material
      topic: buyer-segmentation
      missingEvidence: A public split of Zelos revenue or fleet mix between last-mile relay, middle-mile freight, and overseas deployments.
      whyItMatters: Buyer mix determines whether the right underwriting lens is parcel-density economics, depot-transfer economics, or international benchmarking.
      diligencePath: Ask management for booked revenue, active routes, and gross-margin split by scenario, geography, and customer type.
      relatedQuestionRefs: [QM024, QM025]
      relatedTableRefs: [TM003]
