slug: zelos
runDate: "2026-06-06"
company:
  name: Zelos
chapter:
  number: 2
  title: Market Analysis
  summary: >
    China's autonomous logistics market is commercially real but still evidence-constrained. The parcel network handled
    199 billion express parcels in 2025, official and state-media sources show autonomous delivery vehicles operating
    normally in Jiangsu/Suzhou, Shenzhen, and Beijing, and Meituan now holds a nationwide low-altitude logistics
    certificate. But there is still no clean published China-only robovan TAM, so the most defensible underwriting lens
    is a proxy stack—parcel demand, delivery drones and robots, warehousing automation, and route-level cost evidence—rather
    than a single heroic market-size estimate.
sections:
  - id: market-boundary-and-demand-base
    title: Market Boundary and Demand Base
    body: |
      Zelos should be analyzed inside China autonomous logistics rather than inside the whole autonomous-vehicle market or the whole e-commerce market. The relevant boundary is autonomous movement of parcels and freight across repeatable logistics workflows: campus and community last-mile relay, urban public-road distribution, depot-to-store middle-mile, and park or hub circulation where vehicles, dispatch software, and relay robotics work together. That included spend covers autonomous delivery vehicles, software and fleet operations, relay robots, and the site integration needed to turn a route into a repeatable operating line. It excludes passenger robo-taxis, consumer delivery gadgets, and generic parcel labor or non-robotic transport spend.

      Demand is unquestionably large. China's express-delivery network handled 174.5 billion parcels in 2024, 199 billion in 2025, and 47.73 billion in the first quarter of 2026 alone. Official sources and industry media also show how that demand is being operationally absorbed: automated sorting centers, drones, indoor relay robots, and unmanned delivery vehicles are being deployed in mainstream parcel operations rather than confined to labs. The important analytical caution is that demand volume is not the same thing as robovan revenue. Public evidence supports a very large parcel economy, a large logistics-automation adjacency, and a fast-growing global delivery-robot and delivery-drone market; it does not support one clean China-only robovan TAM. That is why this chapter preserves proxy-based sizing and explicit evidence gaps.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM045, CM046]
    tableRefs: [TM001, TM002]
    figureRefs: [FM001, FM002]
  - id: policy-pilot-zones-and-deployment-readiness
    title: Policy, Pilot Zones, and Deployment Readiness
    body: |
      China's policy picture is moving from experimentation toward more standardized commercialization, but deployment still depends heavily on where a route sits and which regulator owns it. Suzhou and broader Jiangsu are leading current ground-delivery operations, while Beijing's high-level autonomous-driving demonstration zone is becoming a benchmark for what large-scale public-road readiness looks like. By 2025, Beijing had already issued permits to 33 companies covering about 900 vehicles and more than 32 million autonomous-test kilometers, and the city plans to expand its zone to roughly 3,000 square kilometers. Beijing's new autonomous-vehicle regulation, effective April 2025, explicitly opens a road-application pilot path for urban operational services including logistics.

      National policy is also supportive. The 2026 government work report named the low-altitude economy as an emerging pillar industry, which matters because China increasingly treats autonomous logistics as an ecosystem question touching roads, depots, drones, vehicle-road-cloud infrastructure, and industrial standards rather than as one narrow product category. Still, the source pack shows that commercialization remains jurisdiction-specific. The presence of Beijing's pilot path, Jiangsu's early legislation, and Meituan's national low-altitude certificate is strong evidence that policy friction is falling, but not that open-road deployment is turnkey nationwide. Investors should underwrite geography and route eligibility as hard market filters, not as administrative details.
    claimRefs: [CM013, CM014, CM015, CM016, CM017, CM018, CM019, CM020, CM021]
    tableRefs: []
    figureRefs: []
  - id: buyer-segments-and-workflow-economics
    title: Buyer Segments and Workflow Economics
    body: |
      The buyer map is workflow-led. Postal and express operators buy autonomous logistics to defend parcel throughput and last-mile economics; platform operators buy it to keep delivery fees low and integrate autonomous capacity into existing digital networks; grocers and supply-chain operators buy it to move palletized or boxed goods between depots; and large cross-border or contract-logistics operators test it first in controlled facilities before seeking public-road approval. The same technology stack therefore sells into two different budget logics: last-mile relay is usually justified by parcel economics and labor substitution, while middle-mile and depot-transfer use cases are justified by route reliability, DC productivity, and vehicle utilization.

      The evidence suggests that buyers care most about cost-to-serve and public-road readiness, not abstract autonomy scores. SingPost frames public-road deployment as the lever for reducing last-mile cost. FairPrice and DHL both tie AV adoption to moving goods between distribution centers and to reducing manual routine tasks. KR-Asia and 36Kr report that unmanned vehicles can halve cost per parcel in some settings, reduce customer operating cost materially, and cut remote labor share after deployment matures. Product specs also show why last-mile and middle-mile should not be conflated: Zelos' Z5 is a smaller urban-delivery workhorse, while the Z10 pushes into heavier, longer-range middle-mile freight. That segmentation matters because the buyer, route, and ROI threshold change with vehicle class.
    claimRefs: [CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM029, CM030, CM036, CM037, CM041, CM042]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: competitive-structure-barriers-and-sizing-gaps
    title: Competitive Structure, Barriers, and Sizing Gaps
    body: |
      China's autonomous-logistics market is no longer one-company-one-scenario. The competitive structure now includes specialist robovan companies such as Zelos, Neolix, and White Rhino; platform-backed operators such as Cainiao, JD, and Meituan; and adjacent automotive or supplier entrants moving in from 2025 onward. Cainiao's decision to fold its autonomous-driving business into Zelos shows how distribution power and route access can matter as much as vehicle hardware. China Post's 7,000-vehicle order likewise suggests that large procurement rounds can quickly concentrate volume with scaled vendors.

      The barriers are equally real. Public-road commercialization still depends on pilot permissions, route qualification, remote-operations economics, and adverse-weather or cold-start performance. Taibo's account of JD's IP complaint adds a second barrier category: legal and trade-secret risk in a market where founding teams and engineers have migrated from large incumbents. The source pack also preserves a more mundane but important analytical problem: public sources do not agree on Zelos' current fleet scale, with partner materials citing more than 20,000 deployed vehicles and product pages citing more than 25,000 active vehicles. Combined with the absence of a clean published China-only robovan TAM, that means valuation work should underwrite adoption with multiple proxies and explicit diligence asks rather than with one headline market-size slide.
    claimRefs: [CM031, CM032, CM033, CM034, CM035, CM038, CM039, CM040, CM043, CM044, CM047]
    tableRefs: [TM004]
    figureRefs: [FM004]
