- id: TV005
  title: Thesis-break trigger table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Hidden down-round economics
    - Primary documents show the February 2026 price is materially below RMB 10B on a fully diluted basis or contains heavy liquidation preferences
    - That would mean the public unicorn narrative overstates common-equity value
    - Reprice the deal to the bear range or walk away
  - - Monetization gap
    - No audited 2024-2026 revenue bridge or route-level margin evidence is produced
    - Fleet scale without monetization proof should not command a premium mark
    - Hold the process until financial diligence is complete
  - - China Post or Cainiao scale fails to convert
    - Large announced programs do not map to recognized revenue, repeat orders, or healthy unit economics
    - The headline scale case would lose its valuation force quickly
    - Move from base case to bear case
  - - Legal escalation
    - JD-related IP dispute advances materially, creates injunction risk, or expands into broader claims
    - Legal uncertainty can delay IPO timing and compress strategic buyer appetite
    - Pause diligence and request counsel memos before continuing
  - - IPO slippage
    - The reported Hong Kong IPO path stalls or bankers force a meaningful markdown
    - Exit optionality is part of the bull case, so slippage weakens the premium case
    - Remove bull-case underwriting and tighten entry price
  notes: These are hard-stop triggers rather than ordinary watch items; each should change price discipline or stop the process if confirmed.
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV020
  - CV036
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue bridge
    - Audited 2024-2026 revenue, deferred revenue, and customer concentration
    - The valuation cannot be underwritten from fleet size alone
    - Request management accounts and auditor tie-outs
  - - Margin and unit economics
    - Gross margin, contribution margin, uptime, and route economics by vehicle class
    - Needed to convert deployment proof into a durable multiple
    - Review route-level cohorts and gross-profit waterfalls
  - - Round terms and cap table
    - Term sheet, preference stack, dilution, and board rights for the February 2026 financing
    - A nominal unicorn headline can still hide weak common-equity economics
    - Inspect legal docs and fully diluted ownership tables
  - - Cainiao agreements
    - Exclusivity, customer ownership, revenue sharing, and brand-licensing terms
    - Determines whether Cainiao is a moat or a dependency discount
    - Review shareholder and commercial agreements
  - - China Post program
    - ASP, deployment schedule, acceptance tests, and recurring software/service revenue attached to the 7,000-vehicle order
    - This is the cleanest large-volume proof point in the public record if economics are real
    - Obtain the contract schedule and recognition policy
  - - Legal status
    - Counsel memo, claim status, and remediation plan for the JD IP allegation
    - Legal risk can alter both financing appetite and IPO readiness
    - Request outside-counsel diligence memo and management responses
  notes: Each ask is tied directly to a decision variable that could move the valuation range, recommendation, or acceptable entry price.
