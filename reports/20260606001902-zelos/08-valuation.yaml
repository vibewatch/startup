- id: scenario-range-and-entry-discipline
  title: Scenario range and entry discipline
  body: 'Because Zelos does not disclose a live revenue denominator, the valuation range has to be constructed from evidence-supported anchors instead of false-precision multiple math. The key anchors are the conflicting February 2026 private marks, the stronger strategic signal from Cainiao’s contribution, the China Post order, and the public valuation envelopes visible in WeRide, Serve, and Nuro. In the bear case, investors eventually discover that the fleet headline overstates monetized scale or that the round terms contain heavy protection, forcing a steep discount to the strategic headline. In the base case, the RMB 10 billion cluster is directionally right, but the company still deserves a discount to the higher strategic mark until revenue and margin are auditable. In the bull case, the Cainiao combination, China Post rollout, and IPO path convert from story to disclosed operating proof. That framework implies entry discipline, not categorical rejection: the reported unicorn price
    is not obviously impossible, but it is too weakly documented to pay a premium without a data room.'
