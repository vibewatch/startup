  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-precision
    missingEvidence: Primary financing documents or investor confirmations that reconcile the RMB 10 billion narrative with the separate ~$2 billion strategic-business valuation reference.
    whyItMatters: Without a clean reconciliation, the chapter can only support a directional range rather than one exact post-money price.
    diligencePath: Obtain the February 2026 term sheet, post-money cap table, and any investor or board materials describing how the Cainiao asset injection was valued.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV021
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: 2024-2026 monthly or quarterly revenue, gross margin, EBITDA or burn, and route-level unit economics by vehicle class.
    whyItMatters: These are the core variables that determine whether Zelos deserves a premium to the reported unicorn mark or a discount to it.
    diligencePath: Request audited financial statements, management accounts, and route-cohort economics for Z5 and larger-format vehicles.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV026
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cainiao-commercial-terms
    missingEvidence: The Cainiao shareholder agreement, exclusivity boundaries, revenue-sharing economics, governance rights, and any partner concentration disclosures.
    whyItMatters: Cainiao can be either a moat amplifier or a dependency that compresses Zelos’s standalone equity value.
    diligencePath: Review the merger and shareholder agreements, partner concentration schedules, and any side letters governing brand use or customer ownership.
    relatedQuestionRefs:
    - QV004
    - QV013
    - QV028
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table coverage remains partial because China robo-van peers rarely disclose live valuation and revenue denominators.
    missingEvidence: Additional direct disclosed valuation and revenue anchors for China robo-van peers such as White Rhino or Neolix, plus any disclosed M&A multiples for logistics-autonomy assets.
    whyItMatters: The comparable valuation table has to mix public caps, private rounds, and transaction anchors because like-for-like direct comps are under-disclosed.
    diligencePath: Search primary filings, investor decks, and signed transaction announcements for peer valuation disclosures; expand the table only when direct valuation and denominator evidence is found.
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Any banker materials, audited listing package, or governance-readiness documentation supporting the reported Hong Kong IPO path.
    whyItMatters: The IPO rumor helps frame exit optionality, but without listing-readiness evidence it should not be underwritten as a near-term certainty.
    diligencePath: Request IPO adviser letters, draft listing timetable, audited statements prepared for listing, and governance remediation materials.
    relatedQuestionRefs:
    - QV014
    - QV029
    - QV030
  - type: missing-source
    severity: material
    topic: china-post-order economics
    missingEvidence: The signed China Post contract schedule, ASP, recurring software or service revenue, deployment cadence, and acceptance milestones for the 7,000-vehicle order.
    whyItMatters: A headline order supports the bull case only if it converts into recognizable revenue and repeatable deployment economics.
    diligencePath: Obtain the master supply agreement, production schedule, acceptance criteria, and revenue-recognition policy tied to the China Post program.
    relatedQuestionRefs:
    - QV010
    - QV028
    - QV030
