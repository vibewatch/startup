- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Zelos already has unusual physical scale for a private robo-van company'
    - Official and partner sources support a 20,000-to-25,000 vehicle fleet, international deployments, and public-road operations in Singapore
    - Confidence would rise if audited utilization, revenue per vehicle, and gross margin confirmed that scale is economic rather than promotional
  - - 'THESIS: Cainiao backing is more meaningful than ordinary venture branding'
    - Cainiao injected assets and cash instead of just running a minority pilot relationship, and February 2026 reports frame it as a strategic combination
    - The view improves if shareholder and exclusivity terms show Zelos retains meaningful standalone economics rather than acting as a controlled channel vehicle
  - - 'THESIS: Public autonomy comps show that investors still tolerate rich multiples for scarce assets'
    - WeRide and Serve both trade at high revenue multiples, while Nuro and Starship show continued capital support for sector leaders
    - This gets stronger if Zelos can prove revenue quality closer to public comps, not just asset or fleet scale
  - - 'ANTI-THESIS: The exact February 2026 valuation is weakly documented'
    - Retained sources disagree between a >RMB 10B narrative and a separate ~$2B strategic-business reference
    - The concern falls sharply if management releases the term sheet, post-money cap table, and investor list
  - - 'ANTI-THESIS: Economics visibility is still too thin for a buy call'
    - No retained source discloses current revenue, ARR, gross margin, or unit economics
    - The bear case softens only if diligence shows revenue scale and healthy route-level economics
  - - 'ANTI-THESIS: Legal and execution overhang can compress the multiple quickly'
    - The JD intellectual-property allegation and a still-fluid IPO path create non-trivial downside if commercialization or disclosure wobbles
    - The risk eases if counsel shows the issue is closed and IPO-readiness materials demonstrate public-market discipline
  notes: The table separates what is genuinely valuation-supportive from what still relies on hidden financial or legal evidence.
