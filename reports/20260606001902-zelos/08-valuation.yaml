tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - TRACK / RESEARCH-MORE at the reported unicorn price
    - Strategic backing and scale are real, but the exact February 2026 price is not cleanly pinned and financial disclosure is missing
    - Proceed only with a price-protection mechanism or after a fuller data room
  - - Confidence
    - Low
    - Retained sources split between >RMB 10B (~$1.4B) and ~$2B narratives and disclose no current revenue or terms
    - Upgrade only after audited revenue, gross margin, and cap-table evidence
  - - Risk rating
    - High
    - Capital intensity, legal overhang, and hidden economics dominate the underwriting risk
    - Treat downside as fast-moving until legal and monetization evidence improve
  - - Valuation stance
    - Fair to stretched on public evidence
    - A low-to-mid-unicorn band is plausible, but a premium to the reported marks is not supported
    - Avoid paying above the base-case range without hard proof
  - - Exit path
    - Hong Kong listing or strategic sale is more plausible than a clean global IPO today
    - IPO rumor exists, but disclosure quality still trails public autonomy comps
    - Request listing-readiness and strategic-interest evidence before underwriting an exit
  notes: This recommendation uses only retained public evidence as of 2026-06-06; it is intentionally price-sensitive and discounts the absence of disclosed revenue, margin, and round terms.
