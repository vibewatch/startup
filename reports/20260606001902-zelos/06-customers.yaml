chapter:
  number: 6
  title: Customers
  summary: Zelos has real named-customer proof, especially in Singapore and postal logistics, but the public record is much
    stronger on deployments, pilot-to-rollout progression, and channel partnerships than on retention or customer-count disclosure.
    The Cainiao integration likely broadens enterprise access and Alibaba ecosystem reach, yet it also raises channel-concentration
    questions, while 2026 field-incident coverage shows customer trust and deployment safety still matter.
sections:
- id: customer-segments-and-scenario-map
  title: Customer Segments and Scenario Map
  body: 'Public evidence shows Zelos sells into workflows rather than one narrow customer archetype. The cleanest segment
    split is between postal and express operators, grocery and retail supply chains, contract-logistics or industrial operators,
    and ecosystem channels that can resell or operationalize vehicles at scale. Zelos’ own surfaces repeatedly highlight last-mile
    parcel, retail, campus, industrial-park, intralogistics, and pharmaceutical use cases, while third-party coverage expands
    that map into fresh-food, dairy, electronics, grain-and-oil transport, tires, auto parts, and hotel-linen logistics. Buyer,
    user, and payer also shift by segment: postal networks and courier operators care about depot-to-station relay and route
    density; retailers care about distribution-centre transfers and shelf-availability; industrial hubs care about closed-scenario
    yard productivity; and channel partners care about standardizing a fleet-and-service layer across many end accounts. That
    scenario-first framing matters because it explains why Zelos can show proof in campuses, communities, industrial parks,
    and logistics hubs without implying one homogeneous customer base.'
  claimRefs:
