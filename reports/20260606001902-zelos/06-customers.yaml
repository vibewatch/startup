  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Net revenue retention, gross retention, logo churn, contract term, and renewal rates by major customer
      segment.
    whyItMatters: The chapter can show adoption and some expansion proxies, but cannot underwrite durability or cohort quality
      without actual retention data.
    diligencePath: Request customer cohort retention tables, contract templates, and renewal dashboards for Singapore, China
      postal, and international pilot accounts.
    relatedQuestionRefs:
    - QU017
    - QU018
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 customer mix, and proportion of revenue tied to Cainiao-linked scenarios
      or China Post procurement.
    whyItMatters: Cainiao and China Post dominate the public proof set, so concentration risk cannot be sized from public
      evidence alone.
    diligencePath: Request customer concentration schedule, country and account revenue mix, and scenario mix split between
      Alibaba-linked, postal, retail, and industrial accounts.
    relatedQuestionRefs:
    - QU022
    - QU023
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-coverage
    missingEvidence: A fuller roster of paying accounts with deployment maturity, route count, and economic outcomes beyond
      the handful of named public references.
    whyItMatters: Public named proof is useful but still partial; logo-only references do not establish retention or production
      depth.
    diligencePath: Request a customer-reference list with segment, start date, vehicle count, route type, and permission to
      contact at least three reference accounts.
    relatedQuestionRefs:
    - QU004
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: contract-economics-and-customer-count
    missingEvidence: Customer count, average contract value, pricing model mix, and gross-margin profile by sale, lease, and
      managed-service accounts.
    whyItMatters: The go-to-market model is clearly multi-form, but the economics of each form are not public and customer
      count cannot be inferred from vehicle count.
    diligencePath: Request board or finance pack metrics for active customers, ACV/TCV, contribution margin by model, and
      attach rates from pilots to scaled rollouts.
    relatedQuestionRefs:
    - QU025
