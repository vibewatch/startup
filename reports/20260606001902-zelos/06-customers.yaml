- id: named-deployments-and-public-adoption-proof
  title: Named Deployments and Public Adoption Proof
  body: 'The strongest public customer proof sits in Singapore and postal logistics. FairPrice provides the clearest production-like
    public-road reference: a customer press release says it received LTA approval, signed a 2025 collaboration agreement,
    and aimed to add close to 30 Zelos vehicles for distribution-centre transfers. SingPost is the best durability proxy because
    both sides describe a sequence from hub trials since December to an expanded 2026 MoU focused on public-road commercialization,
    fleet management, and distribution business development. DHL and Infineon show a different pattern: an in-plant deployment
    with a defined phase-two path to public roads and more customer operations. Outside Singapore, Pos Malaysia is still in
    PoC mode, while KEZAD is an industrial-hub deployment rather than a broad public-road network. China Post is the opposite
    extreme: large procurement scale, but limited public disclosure on realized utilization and economics. The chapter therefore
    supports real adoption proof, but the proof varies sharply by customer and maturity stage.'
