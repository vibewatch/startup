  - - Grocery and retail supply chains
    - Supply-chain leadership at FairPrice-style retailers
    - Distribution-centre staff and transport supervisors
    - Supply-chain and fleet budgets
    - Inter-DC transfers and store replenishment
    - FairPrice public-road rollout in Singapore
