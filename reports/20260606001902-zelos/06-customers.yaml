- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Type
  - Impact
  - Current public evidence
  - Diligence path
  rows:
  - - Cainiao shareholding and brand license
    - Expansion driver + concentration risk
    - Improves enterprise access and international scenario density, but can make volume dependent on one ecosystem
    - Reuters, Zelos, Gasgoo, and Jiemian all describe asset injection, non-control stake, and dual-brand operating model
    - Request revenue share from Alibaba-linked scenarios and brand-license terms
  - - China Post 7,000-vehicle tender
    - Expansion driver + concentration risk
    - Large procurement validates capability, but one mega-account can dominate optics and potentially revenue
    - Jiemian Global is the strongest retained procurement source
    - Request share of annual revenue or deployed fleet tied to China Post
  - - Singapore template market
    - Expansion driver
    - FairPrice, SingPost, and DHL create a replicable public-road and private-road reference cluster
    - Customer releases and MOT page show the cluster is real
    - Request country-level gross margin and local support cost in Singapore
  - - ADS leasing and managed operations
    - Expansion driver
    - Can lower adoption friction for customers that do not want to own or operate vehicles
    - Jiemian describes leasing and operations-service options
    - Request mix of sale vs lease vs managed-service accounts
  - - International postal and industrial pilots
    - Expansion driver
    - Pos Malaysia and KEZAD show exportability into postal and industrial hubs
    - Public sources prove activity, but not scaled conversion
    - Request pipeline-to-conversion ratios and follow-on purchase orders
  - - Undisclosed customer count and revenue mix
    - Concentration risk
    - Without customer count, renewal metrics, and top-account mix, concentration cannot be underwritten
    - Public sources do not provide these metrics
    - Request top-10 customer revenue share, customer count, and cohort retention
  notes: The table separates things that clearly help customer acquisition from the unresolved concentration questions those
    same channels create. Public evidence is strongest on channel access and weakest on revenue mix.
