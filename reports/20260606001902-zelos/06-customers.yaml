  - - Postal and express operators
    - Postal HQ, regional parcel operators, depot managers
    - Depot staff, route supervisors, parcel handlers
    - Operations budgets or government-backed procurement
    - Depot-to-station relay, postal trunk links, last-mile handoff
    - China Post order; SingPost hub trials; Pos Malaysia PoC
