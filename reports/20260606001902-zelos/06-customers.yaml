  title: Customer growth / adoption trajectory table
  columns:
  - Deployment / account
  - Earliest retained proof
  - Latest retained status
  - Scale / outcome signal
  - Implication
  - Missing denominator
  rows:
  - - FairPrice Group
    - 2023 cooperation on autonomous urban logistics transfer project
    - 2025 public-road approval and plan for close to 30 AVs
    - 27 tonnes CO2 reduction expected per vehicle per year
    - Best public proof of step-up from partnership to approved rollout
    - No disclosed route count, fleet utilization, or renewal period
  - - Singapore Post
    - Hub trials since December 2025
    - 2026 expanded MoU for public-road commercialization and fleet management
    - Regional eCommerce Logistics Hub trial and public-road licensing push
    - Strongest repeat-collaboration / expansion proxy in chapter
    - No disclosed contract value, volume handled, or renewal term
  - - DHL Supply Chain / Infineon
    - Singapore in-plant deployment at ARC
    - Phase-two plan to expand across public roads and more customer operations
    - '>80% annual carbon-emission reduction versus prior diesel truck'
    - Confirms production operations with a structured roadmap
    - Vehicle count and follow-on scope remain undisclosed
  - - China Post Express & Logistics
    - 7,000-vehicle procurement announced
    - Four-year delivery plan with Zelos leading share
    - World’s largest disclosed autonomous-delivery procurement in source set
    - Shows procurement credibility and tender capability
    - No public utilization, pricing, or revenue recognition details
  - - Pos Malaysia
    - 2026 launch of first autonomous vehicle deployment
    - Six-month PoC with two more AVs expected after proof period
    - National-mail-centre operational trial with regulatory support
    - Useful postal proof for Southeast Asia, but still early stage
    - No disclosed commercial conversion after PoC
  - - KEZAD / Metal Park
    - 2026 trail deployment in Abu Dhabi
    - System-level industrial-hub integration focus
    - 93,000 sqm Metal Park site and warehouse-to-yard loop claim
    - Shows heavier industrial positioning beyond campus/community
    - Not disclosed as a recurring scaled customer program
  - - Cainiao ecosystem demand benchmark
    - 2020-2026 campus/community robot rollout
    - 10M+ deliveries and 200+ universities by March 2026
    - 0.1 RMB per parcel and 20%-30% labor-cost savings claims
    - Validates dense-scenario demand adjacent to Zelos
    - These are Cainiao metrics, not Zelos customer metrics
  notes: This table mixes named customer deployments with adjacent ecosystem demand benchmarks. It intentionally separates
    customer proof from broader scenario-density evidence and highlights where scale, utilization, or economics are still
    missing.
