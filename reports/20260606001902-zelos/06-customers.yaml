- id: TU006
  title: Procurement and go-to-market model table
  columns:
  - Model
  - Who it fits
  - Public evidence
  - Customer benefit
  - Zelos implication
  rows:
  - - Direct enterprise rollout
    - Customers ready to add vehicles to owned fleet
    - FairPrice collaboration agreement and China Post tender
    - Clear dedicated capacity and workflow integration
    - Works best when customer can underwrite vehicles and route density
  - - Leasing model
    - Customers preferring light-asset adoption
    - Jiemian ADS reporting
    - Lower upfront capex and faster trial start
    - Supports broader SMB / regional-operator adoption
  - - Managed operations service
    - Customers that do not want to own, charge, or maintain vehicles
    - Jiemian says some customers prefer full operations service
    - Minimal operational burden for buyer
    - Pushes Zelos toward transport-service economics, not only hardware margins
  - - Channel enablement / seed vehicles
    - Large network partners such as SingPost
    - SingPost MoU includes seed vehicles, training, and distribution business development
    - Partner can scale locally using Zelos know-how
    - Creates leverage but also channel dependence
  - - Dual-brand enterprise channel
    - Large enterprise clients and Alibaba-linked scenarios
    - Gasgoo and Reuters say Cainiao brand remains for scenarios and enterprise clients
    - Access to established logistics networks and enterprise relationships
    - May accelerate customer acquisition while obscuring direct-customer ownership
  - - Pilot-to-regulatory-scale pathway
    - Public-road or national-post customers
    - LTA and Malaysia sources show staged trials before scale
    - Reduces safety and compliance risk before large rollout
    - Elongates sales cycle and makes procurement timing regulator-dependent
  notes: This table focuses on how customers procure or adopt the product rather than on end-market segmentation. The public
    record supports multiple models, but not the mix of revenue among them.
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU030
- id: TU007
  title: Adverse deployment evidence table
  columns:
  - Date / source
  - Deployment context
  - Issue
  - Company / source response
  - Customer implication
  rows:
  - - 2026, Securities Times
    - Xi’an city-road delivery operation
    - Rear-end collision with a parked black car
    - Company said manual takeover error caused the event
    - Questions supervision model and operator handoff discipline
  - - 2026, Securities Times
    - Xianyang route with ZTO-branded delivery workflow
    - Vehicle dragged a fallen electric scooter before stopping
    - Company said deformed obstacle recognition failed and promised regulator cooperation
    - Raises customer and community confidence questions in mixed-traffic settings
  - - 2026, Securities Times
    - Beijing Changping public-road operation
    - Collision with a passenger car and allegation the vehicle left the scene
    - Report cited traffic record saying designated route requirements were not met
    - Creates compliance risk for future public-road permits
  - - 2026, Malay Mail
    - Pos Malaysia autonomous-vehicle launch
    - Labor-displacement concern surfaced publicly at launch
    - Minister explicitly said the deployment should not trigger layoffs
    - Shows automation sales can attract workforce and political scrutiny even before accidents occur
  notes: Adverse evidence here is not a thesis-break by itself, but it is concrete and current. The incidents matter because
    this chapter otherwise leans heavily on public-road and high-frequency deployment proof.
  claimRefs:
  - CU037
  - CU038
  - CU039
