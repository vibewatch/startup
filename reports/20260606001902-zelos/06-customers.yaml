- id: procurement-go-to-market-and-alibaba-channel
  title: Procurement, Go-to-Market, and the Cainiao / Alibaba Channel
  body: 'Zelos does not appear to rely on a single go-to-market pattern. Jiemian’s ADS-center reporting suggests the company
    is deliberately widening procurement options across direct sale, leasing, and fully managed operations, which fits a market
    where some customers do not want vehicle ownership or operational burden. Customer proof in Singapore supports that reading:
    SingPost’s MoU adds team training, seed vehicles, and distribution-business development rather than only hardware supply.
    The Cainiao relationship deepens the model further. Zelos’ official release, Gasgoo, and Reuters all describe a business-and-equity
    integration in which Cainiao stops directly manufacturing or selling vehicles, Zelos operates both brands, and the Cainiao
    brand focuses on logistics scenarios and large enterprise clients. That should help enterprise access and international
    deployment speed, especially within Alibaba’s ecosystem and warehouse network. But it also blurs the boundary between
    customer, shareholder, and channel. For diligence, the key underwriting question is not whether Cainiao helps — it clearly
    does — but how much of future volume becomes dependent on one ecosystem-controlled scenario funnel.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
