  - - Contract logistics and industrial operators
    - 3PLs, warehouse operators, site GMs
    - In-plant logistics teams and warehouse operators
    - Customer operations or site budgets
    - Storage-zone transfers, yard movement, warehouse-to-yard loops
    - DHL/Infineon at ARC; KEZAD Metal Park
    - No disclosed contract length or expansion pricing
  - - Platform and ecosystem channels
    - Cainiao or scenario owners with large network density
    - Fleet managers, station operators, dispatch teams
    - Platform logistics budget or partner channel budget
    - Public-road station shuttles, campus/community routes, enterprise channel enablement
    - Cainiao brand license and scenario focus; Xiaomanlv density proof
    - Channel dependence may concentrate scenario access
  - - International postal partners
    - National post operators and exclusive local integrators
    - Mail-centre operations and national logistics teams
    - Postal transformation budgets
    - Postal hub automation and repetitive B2B point-to-point routes
    - Pos Malaysia with ALS; UAE postal / KEZAD-adjacent export proof
    - Public utilization and renewal terms remain undisclosed
  - - Industrial park and campus operators
    - Park management, campus logistics operators, site services
    - Security, facilities, and logistics teams
    - Site operations budget or shared-service budget
    - Campus parcel routes, business-park logistics, industrial-park transfers
    - Official Zelos use-case positioning; Cainiao university deployments; KEZAD industrial hub
    - Named paying customers are thinner than scenario-level proof
  notes: Segment map combines official positioning with named customer releases and third-party reporting. Public sources
    identify workflows, but not segment-level revenue mix or average contract value.
