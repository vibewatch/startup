company:
  name: Zelos
chapter:
  number: 7
  title: Risks
  summary: >-
    Zelos's public risk stack is led by fragmented autonomous-vehicle regulation,
    deepening dependency on Cainiao and a handful of giant logistics customers,
    and an unresolved JD intellectual-property complaint that could complicate an
    IPO or financing cycle. Singapore deployments prove real commercialization,
    but they also show that public-road scale is still permit-dependent, while
    multi-factory expansion, price compression, and geopolitically sensitive
    connected-vehicle rules create downside if route rights, key accounts, or
    legal clarity do not keep pace with fleet growth.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and thesis-break framing
    body: >-
      The public record supports a clear ordering of Zelos's risk stack. The
      first bucket is regulatory and legal: national Chinese rules for unmanned
      delivery vehicles are still incomplete, city-by-city route-right and
      insurance obligations remain decisive, Singapore scale-up is still subject
      to approvals, and JD's IP allegation remains unresolved on primary public
      documents. The second bucket is partner and customer dependence. Cainiao's
      asset-plus-cash integration undeniably improves scale and scenario access,
      but it also pulls Zelos closer to one ecosystem's priorities at the same
      moment that China Post's 7,000-vehicle tender appears large enough to
      become a material execution burden. Third is capital intensity and
      operating leverage: public sources describe 25,000+ deployed vehicles,
      multi-factory manufacturing, and breakeven only at much larger fleet scale,
      implying little room for route-right or utilization disappointment. Fourth
      is operational safety and execution. Sector-level legal reporting shows that
      accidents, privacy, and remote-safety responsibilities are still being
      worked out in public roads. The correct underwriting stance is therefore
      not to reject Zelos's traction, but to treat regulatory, platform,
      concentration, and IP diligence as thesis-critical rather than incidental.
    claimRefs:
      - CR001
      - CR010
      - CR016
      - CR020
      - CR024
      - CR025
      - CR031
      - CR034
      - CR038
      - CR040
