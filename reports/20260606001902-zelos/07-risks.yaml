  - id: capital-intensity-people-and-downside-scenarios
    title: Capital intensity, people, and downside scenarios
    body: >-
      Zelos is no longer a lightweight software thesis. Public sources describe a
      business with tens of thousands of vehicles, multiple factories, aggressive
      capacity targets, international expansion, and a model that still appears to
      need far larger fleet scale before full breakeven including R&D. That makes
      capital efficiency and organizational execution central risks. Jiemian's
      interview material suggests the company is trying to expand capacity, lower
      unit costs, and preserve rapid growth simultaneously while also integrating
      Cainiao and pursuing overseas markets. Sohu and 21jingji show why that can
      become structurally difficult: large customers are under intense cost
      pressure, route-rights remain fragmented, and sector competition is pushing
      low upfront pricing plus recurring software subscriptions. People and public-
      acceptance risk are therefore subtler than an outright consumer backlash.
      Xinhua says social acceptance is improving, but local rules, safety staffing,
      partner training, and compliance operations still require significant human
      systems around the vehicles. The evidence-based downside scenarios are not
      hypothetical abstractions: a formal IP escalation, a serious public-road
      incident, a route-right slowdown, or a failure to diversify beyond Cainiao
      and mega-accounts would all transmit quickly into deployment pace, financing
      leverage, and valuation support.
