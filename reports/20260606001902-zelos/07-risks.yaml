  - id: TR004
    title: People / execution risk register
    columns:
      - Role / function
      - Dependency or gap
      - Likelihood
      - Severity
      - Mitigation evidence
      - Diligence path
    rows:
      - - Executive and legal management bandwidth
        - Cainiao integration, mega-account execution, overseas rollout, and an unresolved IP complaint all compete for senior attention.
        - Medium
        - High
        - Public interviews suggest an experienced, highly active operating team.
        - Review legal committee structure, escalation ownership, and board oversight for integration and dispute management.
      - - Compliance and operations staffing
        - Singapore releases still require training in fleet monitoring, management, maintenance, and regulatory coordination.
        - High
        - Medium
        - Partners are willing to co-train and dedicate teams.
        - Obtain org chart for remote ops, safety, maintenance, and regulatory affairs by country.
      - - Multi-market execution load
        - 300+ cities and 20+ countries create heterogeneous route-right, servicing, and customer-success requirements.
        - Medium
        - High
        - Zelos has already built real partner proof in China and Singapore.
        - Request market-by-market rollout owners, post-launch incident governance, and support ratios.
      - - Growth and pricing discipline
        - Public breakeven commentary still depends on much larger fleet scale while sector pricing remains aggressive.
        - Medium
        - High
        - Scale is growing fast and customer adoption is real.
        - Review budget, capex plan, warranty assumptions, and downside plan if route-right or order growth disappoints.
    notes: >-
      Zelos's people risk is less about a missing public founder and more about
      whether the operating system around compliance, fleet service, and key-
      account execution can mature as fast as the hardware and commercial story.
