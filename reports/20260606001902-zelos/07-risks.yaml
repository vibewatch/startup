  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Platform and scene dependence
        - Cainiao / Alibaba logistics ecosystem
        - Asset injection, cash investment, dual-brand operation, and team integration
        - Strategy changes or scene access shifts reduce deployment pace or bargaining power.
        - High
        - Cainiao is not becoming the controlling shareholder and the combination should expand key-account reach.
        - Public evidence still shows one ecosystem becoming more central to Zelos's go-to-market and data loop.
      - - Anchor-order concentration
        - China Post tender
        - 7,000-vehicle procurement with Zelos reported as the biggest winner and roughly half-capacity provider
        - Execution misses, cancellations, or low utilization on a giant order impair unit economics and reputation.
        - High
        - Government-backed procurement is stronger proof than a pilot logo.
        - No retained source discloses margin, cancellation terms, or revenue share.
      - - Overseas customer concentration
        - SingPost, FairPrice, DHL
        - Strong logos but all phase-based and permit-dependent
        - A delayed Singapore public-road expansion would hit one of Zelos's most visible international showcases.
        - Medium
        - Three separate enterprises publicly endorse the technology.
        - None of the retained sources discloses recurring revenue or contract duration.
      - - Route-right dependence
        - City and country regulators
        - 103 Chinese cities have opened rights, but fragmentation persists
        - Expansion into new cities or countries slows because permits, insurance, or data rules lag the commercial plan.
        - High
        - Policy trend is supportive and road-right coverage is expanding.
        - Local approval remains a gating variable rather than a solved background issue.
      - - Key-account mix opacity
        - Postal, express, FMCG, and platform customers
        - Public logos include邮政、顺丰、蒙牛 and others, but no revenue split is disclosed
        - One or two accounts dominate cash generation without investors seeing it until a renewal or utilization problem appears.
        - Medium
        - Customer logos span more than one segment.
        - The absence of disclosed concentration data is itself a material diligence gap.
    notes: >-
      The partner register ranks dependencies by their ability to change route
      rights, utilization, or financing confidence quickly. Public logos show real
      commercial traction, but the evidence base remains much stronger on named
      relationships than on concentration math.
