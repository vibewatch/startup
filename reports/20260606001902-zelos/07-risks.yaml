  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - China regulatory fragmentation
        - National rule progress and local route-right expansion
        - No meaningful national clarity or stalled access in top expansion cities by the next financing cycle
        - Treat route-right as a gating diligence item and haircut deployment assumptions.
      - - JD IP overhang
        - Primary case documents, injunction, or settlement status
        - Formal litigation, injunction, or unresolved police/court process entering IPO execution
        - Pause underwriting until external counsel confirms exposure and operational continuity.
      - - Cainiao ecosystem dependence
        - Revenue share, routing share, and operating-control concentration
        - One ecosystem or affiliate exceeds a diligence-agreed concentration threshold without contractual protection
        - Re-rate the business as platform-dependent rather than broadly diversified logistics infrastructure.
      - - China Post mega-order execution
        - Utilization, cancellation, service-level, and cash-conversion metrics
        - Large tender ramps with weak utilization, margin dilution, or delayed collections
        - Reduce growth assumptions and test working-capital needs under a slower ramp.
      - - Safety and incident exposure
        - Serious incident frequency, insurance claims, public-road suspensions, and root-cause closure time
        - A serious injury event, repeated route-scope violations, or inability to produce credible loss data
        - Treat the thesis as broken until safety governance and insurability are re-established.
      - - Capital intensity and overseas expansion
        - Factory utilization, after-sales burden, breakeven progress, and foreign compliance barriers
        - Capacity buildout outruns orders, or foreign connected-vehicle / data rules materially block target markets
        - Move to a slower-growth downside case and require proof of cash durability before new capital.
    notes: >-
      These triggers are designed to be monitorable with management data rather
      than broad narrative updates. The main discipline is to convert Zelos's most
      attractive scale signals into explicit downside thresholds instead of giving
      them unconditional credit.
