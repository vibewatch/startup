  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: fleet-loss-history
      missingEvidence: Zelos-specific incident logs, insurance claims, disengagements, root-cause reports, and regulator notices for public-road operations.
      whyItMatters: Without actual loss-history evidence, the chapter can rank safety risk but cannot quantify whether media-reported incidents are isolated noise or an emerging operating pattern.
      diligencePath: Request three years of incident summaries by city, insurer loss runs, serious-near-miss reviews, and any public-road suspension or remediation notices.
      relatedQuestionRefs: [QR027]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Revenue, utilization, cancellation, and gross-margin exposure by Cainiao, China Post, SingPost, FairPrice, DHL, SF, and other named key accounts.
      whyItMatters: The public record proves large anchor relationships but not whether one ecosystem or one tender dominates cash generation, working capital, or bargaining power.
      diligencePath: Obtain top-10 customer concentration, renewal schedules, committed volume, payment terms, and sensitivity if the largest two accounts slow deployments.
      relatedQuestionRefs: [QR028]
      relatedTableRefs: [TR003]
    - type: conflicting-data
      severity: minor
      topic: manufacturing-scale
      missingEvidence: Audited factory count, annual capacity, utilization, warranty reserve, and after-sales cost data for the current manufacturing footprint.
      whyItMatters: Public sources agree the ramp is large but disagree on exact factories and capacity, which makes it hard to judge absorption risk or service quality pressure precisely.
      diligencePath: Request current plant list, line-by-line capacity, delivered units, service tickets per thousand vehicles, and warranty accrual policy.
      relatedQuestionRefs: [QR029]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: jd-case-status
      missingEvidence: Formal case number, police filing acknowledgement, company response, injunction status, settlement terms, or court docket confirming the JD matter's current stage.
      whyItMatters: The allegation is material enough to affect IPO or financing diligence, but a media-only record leaves investors unable to separate a reputational overhang from a legally advancing case.
      diligencePath: Request outside-counsel memo, regulator or court notices, and management's written chronology plus preservation of any relevant patent-assignment analysis.
      relatedQuestionRefs: [QR030]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: permit-pack
      missingEvidence: Country- and city-level permit scope, insurance schedules, data-handling commitments, and operating design domain boundaries for Zelos's active routes.
      whyItMatters: The strongest commercialization story is route-right dependent, so investors need to know exactly what has been approved, where it can run, and what conditions could force a rollback.
      diligencePath: Build a permit ledger covering each major Chinese city and each overseas market, including issuing authority, route scope, insurance limits, remote-operation requirements, and expiry conditions.
      relatedQuestionRefs: [QR004, QR005]
      relatedTableRefs: [TR001, TR003]
