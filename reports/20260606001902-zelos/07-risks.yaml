callouts:
  - calloutType: risk
    title: China policy is improving, but scale still depends on local permissions
    body: >-
      Zelos's risk is not that China opposes autonomous logistics; it is that the
      operational regime still relies on local route-right, insurance, emergency,
      and liability frameworks rather than one clean national rulebook.
    claimRefs:
      - CR001
      - CR002
      - CR010
      - CR022
  - calloutType: insight
    title: Cainiao is both a moat enhancer and a dependency amplifier
    body: >-
      Cainiao's cash, assets, key-account access, and logistics scenes make Zelos
      stronger, but the same integration raises single-ecosystem dependence at the
      exact moment the company is also absorbing very large anchor orders.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR020
  - calloutType: risk
    title: The JD matter is material precisely because it is unresolved
    body: >-
      The retained sources do not prove infringement, but they do establish a
      specific allegation, a reported police filing date, and a missing set of
      primary public documents that investors would normally want before backing
      an IPO-bound autonomous-vehicle story.
    claimRefs:
      - CR013
      - CR015
      - CR039
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Public evidence
      - Likelihood
      - Severity
      - Current mitigation evidence
      - Residual exposure / diligence path
    rows:
      - - Fragmented China legal status for unmanned delivery vehicles
        - Xinhua and CCTV both say national qualification and liability rules are incomplete and local pilots still do most of the legal work.
        - High
        - High
        - National standards and local pilots are expanding rather than shrinking.
        - Obtain a city-by-city permit, insurance, and operating-scope matrix before underwriting nationwide scale.
      - - Local insurance, privacy, and incident-response burden
        - Beijing and Shenzhen practice requires liability insurance, monitoring, emergency plans, and route controls; legal scholars still see unresolved responsibility splits.
        - High
        - High
        - Operators can comply city by city and use existing pilot rules.
        - Verify actual policy limits, claims handling, data-retention controls, and operator/safety-staff obligations for each active city.
      - - Singapore public-road deployment still approval dependent
        - FairPrice has LTA approval, but SingPost and DHL both say wider public-road deployment remains subject to authority approval.
        - Medium
        - High
        - Zelos already has partner traction and helped shape local standards.
        - Review permit scope, renewal terms, operating design domain, and any conditions attached to open-road approvals.
      - - JD intellectual-property / trade-secret escalation
        - Taibo and QQ News report JD's 2024-11-20 police filing and continuing investigation; no retained primary docket resolves the matter.
        - Medium
        - Critical
        - None visible beyond the absence of a proven public outcome.
        - Request case number, filing documents, company response, external counsel memo, and any injunction or settlement status.
      - - Cybersecurity and data-governance liability
        - National standards now include vehicle cybersecurity, while Xinhua/CCTV highlight privacy, anonymization, and multi-party data-responsibility gaps for unmanned delivery fleets.
        - Medium
        - High
        - Standards are moving in a tighter direction and local frameworks require data retention and reporting.
        - Obtain cybersecurity architecture, data-minimization controls, cross-border data map, and third-party audit results.
    notes: >-
      Rows are ordered by residual severity, not by certainty of loss. The legal
      register is partial because no retained source set exposes Zelos's full
      city-by-city permit pack, policy limits, or any primary JD case documents.
    enumerationScope:
