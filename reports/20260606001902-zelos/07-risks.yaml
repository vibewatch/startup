  - id: partner-dependency-operations-and-safety
    title: Partner dependency, operations, and safety
    body: >-
      Zelos's strongest commercial proof also highlights its dependency risk.
      Reuters and Chinese press agree that Cainiao is not just a passive investor:
      it is contributing assets, integrating teams, licensing a brand, and moving
      key-account and logistics-scene capability into the combined structure. That
      should help route acquisition, data scale, and overseas rollout, but it also
      makes Zelos more exposed to one ecosystem's capital allocation, platform
      priorities, and strategic shifts. Customer concentration is similarly real
      but hard to quantify. China Post's 7,000-vehicle order is described as the
      largest procurement in the segment, and third-party coverage says Zelos will
      shoulder roughly half of the new capacity. SingPost, FairPrice, and DHL are
      credible overseas references, but all three are phase-based programs rather
      than disclosed long-dated revenue annuities. Operationally, the company is
      attempting to run multi-scenario, map-free L4 vehicles across 300+ cities,
      20+ countries, and a growing set of anchor accounts. Sector legal reporting
      confirms that open-road incidents, privacy handling, emergency response,
      route compliance, and remote-safety responsibility are still live issues.
      A company-specific safety pattern is not proven on retained primary records,
      but 36Kr's reported incidents are enough to justify diligence on loss runs,
      disengagements, and root-cause controls before treating fleet scale as pure
      strength.
    claimRefs:
