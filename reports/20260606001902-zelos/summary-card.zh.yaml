summary:
  headline: Zelos 看起来是一家真实且规模异常大的自动驾驶物流运营商，合作伙伴背书的落地证据很强；但经济模型仍被遮住，估值报道相互打架，法律和治理问题也未解，结论只能停在继续研究。
