  - id: TI006
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Why unavailable publicly
      - Impact
      - Exact diligence path
      - Related public proxy
    rows:
      - - Revenue and revenue mix
        - No retained source publishes audited or management-level revenue by product or geography
        - Prevents underwriting of scale quality and growth conversion
        - Request monthly revenue bridge by hardware, lease, service, and geography for the last 24 months
        - Orders, deliveries, customers, fleet size
      - - Gross margin by product line
        - Hardware and service obligations are public, but margin disclosures are absent
        - Blocks assessment of long-term margin path
        - Request unit BOM, warranty reserve, service gross margin, and installation cost data by model
        - Maintenance, warranty, and service-network evidence
      - - Cash balance and runway
        - Funding rounds are public but balance-sheet liquidity is not
        - Blocks solvency and next-round timing assessment
        - Request current cash, restricted cash, monthly burn, and 18-month cash forecast
        - Series B funding chronology and IPO rumor
      - - Debt or project-finance obligations
        - No retained filing or article discloses debt balances, covenants, or asset financing
        - Hidden leverage could materially change downside risk
        - Request all debt schedules, guarantee obligations, and supplier-finance agreements
        - Xinghui investment and hardware-heavy model
      - - Customer concentration and renewals
        - Big logos are public, but revenue concentration and renewal rates are not
        - Prevents assessment of account dependence and pricing power
        - Request top-20 customer revenue share, contract terms, and renewal cohorts
        - China Post, SingPost, FairPrice, DHL, Cainiao signals
      - - Realized ASP and service attach rate
        - Contract archetypes are visible but realized net pricing is not
        - Prevents payback and margin modeling
        - Request signed order samples showing ASP, service bundles, discounts, and financing terms
        - Turnkey sale plus O&M, installments, leasing scope
      - - Legal reserve exposure
        - Taibo reports a material IP dispute, but no reserve, probability, or insurance disclosure exists
        - Litigation or settlement could affect valuation and IPO readiness
        - Request legal memo, reserve policy, insurance coverage, and case-status chronology
        - JD IP report and Hong Kong IPO discussion
    notes: Every major private-metric gap has a concrete diligence path; none should be filled with guesses from fleet scale alone.
