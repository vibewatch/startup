  - id: funding-investors-and-capital-commitments
    title: Funding history, investor base, and capital commitments
    body: >-
      Zelos’s financing chronology is one of the better-supported parts of the
      public record, although exact lifetime capital still depends on secondary
      summaries. Gasgoo reported a $100 million B1 in November 2024 led by CDH
      BAIFU and Blue Lake. Blue Lake then said its April 2025 B3 round added
      another $100 million and brought Series B financing to nearly $300 million,
      with Asia Investment Capital and Baidu Ventures participating. The strongest
      new primary-like funding anchor is Blue Lake’s October 2025 B4 post,
      corroborated by EqualOcean, which says Ant Group led a fresh $100 million
      round and Series B cumulative funding reached $400 million. After that, the
      evidence becomes more strategic and more secondary. Reuters-derived U.S.
      News coverage said Cainiao would inject its autonomous-driving business plus
      cash, would not take control, and that the combined robovan business was
      valued around $2 billion by the Wall Street Journal. February 2026 press then
      converged around another >$300 million financing and valuation above RMB10
      billion, while April 2026 Chinese financial media circulated a roughly $600
      million Hong Kong IPO plan that remained unconfirmed. The net effect is clear
      access to capital, but weaker evidence on post-money mechanics and proceeds
      already consumed.
