  - id: unit-economics-and-cost-structure
    title: Unit economics, cost structure, and public traction proxies
    body: >-
      Public unit economics are directional rather than complete, but the pattern
      is consistent: Zelos is selling or operating heavy physical assets with a
      visible service tail, not an asset-light software SKU. The product pages
      show Z5 and Z10 payload, battery, and range specifications and include
      illustrative savings calculators, but both pages explicitly say those
      savings are examples rather than guaranteed realized outcomes. More useful
      operating proxies come from partner and media surfaces. Cainiao’s own
      unmanned-vehicle page says the platform can cut labor cost by 20%–30%, drive
      per-delivery cost to RMB0.1, and includes free maintenance, high-value
      insurance, and a five-year warranty on core parts. Blue Lake’s April 2025
      note claims the turnkey model cuts customer operating cost by more than 50%,
      while Gasgoo cited a 62% reduction in November 2024. KrASIA’s translated
      36Kr coverage then added a sharper but still secondary operating proxy:
      franchisees reportedly spend RMB2,000–3,000 per vehicle per month, with cost
      per parcel falling from RMB0.2 to RMB0.1. On the cost side, Jiemian’s report
      of six factories and 45,000 units of annual capacity, plus the March 2026
      Xinghui materials investment, both reinforce that supply chain and vehicle
      economics matter at least as much as software margins.
