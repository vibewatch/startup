callouts:
  - calloutType: insight
    title: Revenue mechanism is visible before price realization is
    body: >-
      The retained record is enough to conclude that Zelos monetizes through a
      mix of vehicle deployment and service support, but not enough to compute
      realized ASP, attach rate, or revenue recognition timing.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI012
  - calloutType: risk
    title: Funding chronology is stronger than valuation evidence
    body: >-
      Blue Lake and EqualOcean provide solid support for B3 and B4 financing,
      but the >RMB10 billion valuation and ~$600 million IPO markers are still
      secondary press rather than retained primary financing documents.
    claimRefs:
      - CI020
      - CI021
      - CI027
      - CI028
      - CI047
  - calloutType: risk
    title: Hardware and supply-chain intensity matter more than headline fleet size
    body: >-
      The economics story is not just more vehicles. Factories, warranties,
      maintenance, distributor support, and the Xinghui materials investment all
      suggest a capital-intensive operating model with non-trivial cash demands.
    claimRefs:
      - CI010
      - CI015
      - CI025
      - CI029
      - CI030
      - CI045
  - calloutType: recommendation
    title: Management pack is still mandatory
    body: >-
      A real underwrite now needs revenue by stream, gross margin by product,
      cash and runway, debt schedules, customer concentration, and legal reserve
      analysis for the JD dispute before valuation can be taken with conviction.
    claimRefs:
      - CI043
      - CI044
      - CI046
      - CI050
      - CI051
