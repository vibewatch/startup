  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Current unrestricted cash, restricted cash, monthly burn, and runway bridge.
      whyItMatters: Capital adequacy cannot be judged from financing history alone when the current balance-sheet position is unknown.
      diligencePath: Request the latest monthly cash report, board cash-forecast deck, and treasury schedule.
      relatedQuestionRefs: [QI012]
      relatedTableRefs: [TI005, TI006]
    - type: private-evidence-only
      severity: material
      topic: debt-obligations
      missingEvidence: Debt schedules, supplier finance, guarantees, and any asset-backed or project-finance obligations.
      whyItMatters: Hidden leverage could materially change downside risk in a hardware-heavy business.
      diligencePath: Request all loan agreements, covenant summaries, and contingent-liability schedules from finance and legal teams.
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI005, TI006]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Revenue by stream, realized ASP, service attach, contract duration, and gross margin by product line.
      whyItMatters: Without this, investors cannot determine whether fleet scale converts into attractive recurring economics.
      diligencePath: Request a 24-month revenue and gross-margin bridge by hardware, lease, service, and geography.
      relatedQuestionRefs: [QI013, QI025]
      relatedTableRefs: [TI001, TI002, TI006]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue concentration, renewal cohorts, and account-level profitability.
      whyItMatters: Large public logos may imply concentration or pricing dependence that public sources cannot resolve.
      diligencePath: Request top-20 customer revenue share, contract expiration schedule, and renewal history.
      relatedQuestionRefs: [QI023]
      relatedTableRefs: [TI004, TI006]
    - type: missing-source
      severity: material
      topic: valuation-mechanics
      missingEvidence: Signed financing documents or board-approved post-money materials for the >RMB10 billion round and the rumored IPO process.
      whyItMatters: Secondary press can establish market narrative, but not valuation mechanics, preference stack, or dilution.
      diligencePath: Request the latest financing term sheet, cap table, and IPO-preparation memorandum.
      relatedQuestionRefs: [QI010, QI018]
      relatedTableRefs: [TI005]
    - type: conflicting-data
      severity: material
      topic: cumulative-funding
      missingEvidence: A reconciled round-by-round financing ledger that explains the gap between Series B totals and secondary claims of >$800 million cumulative funding.
      whyItMatters: Investors need one coherent financing history before modeling dilution and remaining proceeds.
      diligencePath: Request company-approved financing chronology with dates, investors, pre-money, post-money, and primary versus secondary proceeds.
      relatedQuestionRefs: [QI007, QI026]
      relatedTableRefs: [TI005]
    - type: missing-source
      severity: material
      topic: legal-reserve
      missingEvidence: Formal court, police, or company disclosure on the JD intellectual-property matter and any associated reserve or insurance coverage.
      whyItMatters: The legal downside could affect valuation, financing timing, and IPO eligibility.
      diligencePath: Request outside-counsel memo, case-status tracker, and reserve analysis from legal and finance.
      relatedQuestionRefs: [QI011]
      relatedTableRefs: [TI006]
