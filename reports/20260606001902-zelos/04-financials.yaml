  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is mixed but investable only with management support.
      Zelos has enough public deployment proof, financing history, and enterprise
      customer evidence that a zero-revenue or purely promotional story is not
      credible. The company plainly appears to monetize through some combination of
      vehicle sales or leases, service and maintenance, and channel or fleet
      operations support. It also appears materially capital intensive: the product
      is hardware-heavy, maintenance obligations are explicit, national service
      networks are large, factories and annual capacity are discussed in press, and
      2026 filings around Xinghui point to upstream supply-chain positioning rather
      than a purely outsourced model. But the underwriting blockers remain severe.
      No retained source discloses revenue, ARR, gross margin, burn, runway, debt,
      or customer concentration, and even the most repeated valuation markers are
      still press-level rather than financing-document-level evidence. The adverse
      overlay matters too. Taibo’s JD intellectual-property report is material
      because it links legal uncertainty directly to valuation and IPO eligibility.
      Investors can therefore underwrite that Zelos is scaled, financed, and still
      funding-dependent; they cannot yet underwrite revenue quality, margin path,
      or capital adequacy with conviction from public sources alone.
    claimRefs:
