company:
  name: Zelos
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real hardware-plus-service revenue model, repeated
    nine-figure financing, and credible enterprise deployment scale for Zelos,
    but not a clean public underwrite of revenue quality or runway. Funding
    chronology is stronger than valuation evidence, and the chapter's core
    conclusion is that capital intensity and partner dependence are visible while
    cash, burn, margin, and debt remain private.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing visibility, and GTM motion
    body: >-
      Zelos does not look like a pure software company in the retained record.
      The clearest monetization evidence comes from a mix of registry scope,
      investor communication, and deployment announcements. Qichacha and Aiqicha
      show a business scope that includes AI software and hardware, IoT devices,
      vehicle and equipment rental, battery and charging equipment sales, and
      related logistics services. Blue Lake’s April 2025 financing note goes
      further by explicitly describing a “turnkey vehicle sales + full lifecycle
      operation and maintenance” model, while a later Sohu/Cyber-car article says
      Zelos first pushed low-cost hardware plus software installments before more
      mature products moved back toward fixed-price selling. What is still absent
      is equally important: none of the retained official product, partner, or
      financing pages discloses a public sticker price or standard contract value
      for the Z5, Z10, or enterprise service package. The go-to-market motion also
      appears enterprise-led rather than self-serve. SingPost, FairPrice, DHL, and
      China Post all point to large-account deployments or procurement programs,
      and Blue Lake’s B4 note adds a national distributor and service-provider
      network that looks more like channelized industrial sales than app-like
      subscription acquisition.
