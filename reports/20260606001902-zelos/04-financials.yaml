    title: Revenue model bridge
    type: flow
    layout: standard
    summary: Zelos converts enterprise logistics deployments into a mix of hardware, service, and channel-supported revenue, but public prices remain opaque.
    data:
      nodes:
        - id: r1
          label: Enterprise demand
          detail: Postal, parcel, retail, and contract-logistics operators seek lower-cost autonomous freight capacity.
        - id: r2
          label: Channel-led acquisition
          detail: Direct enterprise selling, distributors, and strategic partners shape market access.
        - id: r3
          label: Contract archetypes
          detail: Turnkey vehicle sales, leasing scope, installments, and full-lifecycle O&M all appear in public evidence.
        - id: r4
          label: Vehicle deployment
          detail: Z5, Z10, and broader RoboVan families are deployed into fixed logistics scenarios.
        - id: r5
          label: Service layer
          detail: Maintenance, OTA, insurance, training, and fleet management create recurring obligations.
        - id: r6
          label: Recognized revenue
          detail: Hardware, lease, and service revenue likely book on different timelines, but public accounting detail is absent.
