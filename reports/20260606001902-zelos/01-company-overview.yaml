  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: board and management control structure
      missingEvidence: Current board roster, observer rights, executive org chart, and formal authority split among Sean Zhang, Kong Qi, Cui Xiao, and any other group-level officers.
      whyItMatters: Without an official governance pack, public leadership references remain role-labeled but not control-verified.
      diligencePath: Request the current board list, corporate organization chart, board committees, and signing-authority matrix.
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: blocking
      topic: post-February-2026 cap table and financing mechanics
      missingEvidence: Signed term sheet, share price, liquidation preference stack, dilution math, and ownership percentages after the Cainiao and February 2026 transactions.
      whyItMatters: The unicorn narrative is well circulated, but valuation precision and investor rights cannot be underwritten from secondary press alone.
      diligencePath: Request financing agreements, updated cap table, investor-rights schedule, and any board approvals tied to the February 2026 raise or Cainiao transaction.
      relatedQuestionRefs: [QO015]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: blocking
      topic: 2026 revenue and unit economics
      missingEvidence: Current revenue, ARR, gross margin, utilization, debt, and customer concentration data for 2025-2026.
      whyItMatters: Public milestone and fleet claims do not answer whether Zelos is monetizing deployments efficiently or financing growth with healthy economics.
      diligencePath: Request monthly revenue bridge, gross-margin analysis, utilization by fleet cohort, debt register, and top-customer concentration data.
      relatedQuestionRefs: [QO016]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: IPO readiness and legal-overhang assessment
      missingEvidence: Board-approved IPO plan, listing timetable, legal opinions, and counsel update on the JD intellectual-property matter.
      whyItMatters: Yahoo describes an IPO path as fluid, while Taibo surfaces a potentially material legal overhang; the combination could affect timing and valuation.
      diligencePath: Request IPO readiness memo, counsel letters, regulatory filing timetable, and litigation or investigation tracker.
      relatedQuestionRefs: [QO024]
    - type: missing-source
      severity: minor
      topic: TO004 milestone chronology completeness
      missingEvidence: A complete archived company press log and primary customer contracts that reconcile every milestone, order, and financing date.
      whyItMatters: The milestone table is directionally strong, but several important financing and procurement entries still depend on secondary or partner coverage instead of a full primary archive.
      diligencePath: Build a dated primary-source chronology from the company archive, signed contracts, and financing binder before using the table as a definitive transaction history.
      relatedTableRefs: [TO004]
