slug: zelos
runDate: '2026-06-06'
company:
  name: Zelos
chapter:
  number: 1
  title: Company Overview
summary: >-
  Zelos is a 2021-founded autonomous logistics company whose strongest public
  evidence supports a Suzhou legal-operating base, a Singapore commercialization
  hub, map-free L4 robo-van products, and unusually large disclosed fleet scale
  for a private operator. The company has credible deployment proof and a well
  circulated February 2026 unicorn narrative, but the exact post-money
  valuation mechanics, cap table, board rights, and 2026 financial disclosures
  remain unresolved, while JD-related IP allegations create a real adverse flag.
sections:
  - id: section-identity-product-footprint
    title: Identity, Product Scope, and Geographic Footprint
    body: >-
      Zelos presents itself as a full-stack autonomous logistics company rather
      than a narrow software supplier. The homepage and about materials say the
      company builds the technology stack in-house, uses map-free L4 autonomy,
      and operates purpose-built RoboVan platforms for logistics use cases.
      Public company materials also support a dual-footprint story. QCC and the
      Suzhou Industrial Park administration anchor the core PRC operating entity
      as Jiushi (Suzhou) Intelligent Technology Co., Ltd., founded in 2021 in
      Suzhou Industrial Park, while the official about page and April 2026
      Singapore partnership releases show an active Singapore operating address
      and commercial team. Scale disclosures are large but not perfectly
      harmonized across sources: the current official site says 25,000+ vehicles
      across 350+ cities and 20+ countries with 100M+ autonomous kilometers,
      whereas April 2026 partner releases still use 20,000+ vehicles and 300+
      cities. The strongest read is that Zelos has real global deployment
      breadth, but the company updates headline metrics across surfaces over
      time, so chapter-1 should preserve both the current official numbers and
      the lower April 2026 corroboration rather than collapse them into one
      falsely precise benchmark.
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO006
      - CO007
      - CO009
      - CO010
      - CO026
      - CO034
      - CO041
      - CO042
      - CO046
      - CO047
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003
  - id: section-founders-leadership-governance
    title: Founders, Leadership, and Governance Surface
    body: >-
      Public leadership evidence is directionally useful but not fully clean.
      QCC identifies Cui Xiao as legal representative and executive director of
      the Suzhou operating entity and Kong Qi as manager, while the DHL launch
      release names Sean Zhang as co-founder and COO. The April 2026 Zelos and
      SingPost partnership releases then describe Sean Zhang as Co-Founder & CEO,
      Global Business, and Terry Zhou as Managing Director, Zelos Singapore.
      China Daily separately names Zhuang Li as a co-founder, and Taibo says
      Zhuang Li, Kong Qi, and Zhu Weicheng previously came from JD’s autonomous
      vehicle team. That does not amount to a clean current org chart. Instead,
      it suggests founder continuity plus regional operating leadership, but with
      role labels that vary across registry, partner, and media sources. For
      diligence, the bigger issue is governance opacity: no retained source gives
      the full current board roster, observer rights, ownership splits, or the
      post-Cainiao/post-February-2026 control structure. That means the company
      can be described as founder-linked and operationally visible, but not as a
      transparently governed late-stage company on public evidence alone.
    claimRefs:
      - CO008
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
    tableRefs:
      - TO002
  - id: section-capital-investors-cainiao
    title: Funding History, Investors, and the Cainiao Link
    body: >-
      Zelos’s capital story is strong in headline terms but weaker on mechanics.
      Gasgoo reported a $100 million B1 round in November 2024 led by CDH BAIFU
      and Blue Lake, and Blue Lake later said the company completed nearly
      $300 million of Series B financing after a fresh $100 million B3 round in
      April 2025, with Asia Investment Capital and Baidu Ventures participating.
      Reuters-derived U.S. News reporting added a separate strategic twist in
      January 2026: Cainiao would contribute its autonomous-driving business and
      cash for a stake in Zelos, without taking control, at an approximately
      $2 billion robovan-business valuation according to the Wall Street Journal.
      Multiple February 2026 secondary outlets then described a new financing of
      more than $300 million and a valuation above RMB 10 billion, roughly
      $1.4 billion. That unicorn-level narrative is well corroborated in press,
      so it should not be dismissed, but the exact valuation mechanics still rest
      on secondary coverage rather than retained primary financing documents.
      Chapter-1 therefore can support a large late-stage financing story and a
      meaningful Cainiao strategic relationship, while explicitly preserving cap-
      table, post-money, governance-rights, and ownership uncertainties.
    claimRefs:
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO035
      - CO040
      - CO048
      - CO049
    tableRefs:
      - TO003
  - id: section-milestones-deployments-risks
    title: Milestones, Commercial Deployments, and Adverse Signals
    body: >-
      The milestone record shows why Zelos is notable. SIPAC said the company was
      founded in Suzhou Industrial Park in 2021 and secured Singapore’s first
      unmanned transport vehicle license on 2024-05-30. By July 2024 it claimed
      100+ cities and 2M+ kilometers; by April 2025 China Daily described six
      countries and 200+ regions; and by April 2026 Zelos and SingPost were using
      20,000+ vehicles and 300+ cities as externally corroborated scale markers.
      Commercial proof is not limited to one pilot. DHL launched a Singapore
      deployment in 2025, FairPrice received public-road approval in October 2025
      and planned close to 30 vehicles, SingPost expanded its MOU in April 2026,
      and Zelos separately used 365Group and Intertraffic Amsterdam announcements
      to signal Middle East and European ambitions. The chapter should still stay
      disciplined about weaker evidence. Jiemian’s China Post order, market-share,
      factory-count, and annual-capacity claims are useful but secondary.
      Taibo’s report that JD alleged IP infringement and referred the matter to
      public security is the clearest retained adverse source and cannot be waved
      away, especially when Yahoo also depicts a still-fluid IPO path. The main
      underwriting posture is therefore positive on deployment proof, cautious on
      financial transparency, and explicitly alert to legal and governance risk.
    claimRefs:
      - CO024
      - CO025
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
      - CO036
      - CO037
      - CO038
      - CO039
      - CO043
      - CO044
    tableRefs:
      - TO004
    figureRefs:
      - FO001
callouts:
  - calloutType: strength
    title: Singapore deployment proof is unusually concrete
    body: >-
      Zelos is not relying only on concept demos. SIPAC, DHL, FairPrice, SingPost,
      and Zelos’s own releases collectively support a real Singapore commercialization
      thread that includes licensing, warehouse deployment, and public-road rollout.
    claimRefs:
      - CO027
      - CO029
      - CO030
      - CO031
  - calloutType: risk
    title: February 2026 valuation remains secondary, not primary-verified
    body: >-
      The market clearly circulated a >RMB10 billion or roughly $1.4 billion Zelos
      valuation in February 2026, but every retained citation is secondary press.
      Without primary financing documents, the company should be treated as a
      press-corroborated unicorn headline rather than a primary-verified post-money.
    claimRefs:
      - CO022
      - CO023
      - CO040
  - calloutType: risk
    title: JD intellectual-property allegations are a real diligence flag
    body: >-
      Taibo’s report is adverse, specific, and potentially material: it says JD
      reported suspected IP infringement to public security and that the matter
      remained under investigation, with possible implications for valuation and IPO timing.
    claimRefs:
      - CO015
      - CO038
      - CO039
  - calloutType: insight
    title: Public identity is best read as Suzhou legal base plus Singapore GTM hub
    body: >-
      The cleanest synthesis is not one headquarters label. Registry and SIPAC
      records anchor Suzhou, while official about and partner releases show a
      meaningful Singapore operating footprint that matters for commercialization.
    claimRefs:
      - CO006
      - CO009
      - CO042
