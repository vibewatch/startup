  title: Product & Technology
summary: >-
  Zelos’ retained public product surface is strongest on its Z-series RoboVan family,
  with structured SKU data for range, payload, cargo volume, and batteries plus
  named B2B logistics workflows spanning retail replenishment, postal, pharma, and
  industrial-park moves. The autonomy stack is more specific than typical marketing
  copy—map-free L4, multi-sensor 360° perception, BEV end-to-end planning, sub-100 W
  compute, and partner-corroborated WMS / fleet-monitoring operations—but public
  diligence is still blocked by missing safety-case artifacts, patent visibility,
  benchmark data, and unresolved trim-level spec drift as the platform expands into
  Cainiao-integrated, E-series, and L-series programs.
sections:
  - id: product-family-and-job-to-be-done
    title: Product family and customer workflow fit
    body: >-
      Zelos’ current official product surface is built around logistics-specific RoboVan
      variants rather than a single generic autonomous van. The CMS-backed product catalog
      exposes five currently named Z-series SKUs: Z5, Z5-Cold Chain, Z5 Multiple Locker,
      Z10, and Z10-Cold Chain, each tied to a distinct workflow and payload profile. The
      smaller Z5 is positioned for urban and campus delivery, reverse pickup, and shuttle
      operations; the Z10 moves into heavier middle-mile or depot-transfer work; the
      cold-chain and locker variants adapt the same autonomy base into temperature-controlled
      or multi-drop last-mile configurations. The scenario layer is equally workflow-led.
      Zelos’ public solutions materials map the platform into FMCG, pharmaceutical,
      business-park, parcel, and retail-replenishment jobs, while partner-detail cards add
      named operating examples such as Yum store replenishment, Sinopharm hospital-campus
      delivery, DHL warehouse logistics, and FairPrice public-road pallet transfer.
      The most important underwriting distinction is maturity by branch. The Z family has
      clear published specs and the strongest deployment proof. By contrast, 36Kr and
      supplier pages point to newer E-series and L-series branches, but those newer lines
      are less fully documented on Zelos’ own product catalog. The right chapter-5 read is
      therefore that Zelos already has a real, differentiated RoboVan portfolio for B2B
      logistics, but investors should separate the mature, spec-visible Z family from the
      newer E/L roadmap branches whose exact trims, economics, and certification status are
      not yet equally transparent.
