          detail: Choose Z5, Z10, cold-chain, locker, or lighter / heavier branch based on payload, temperature, and stop pattern.
        - id: n3
          label: Supervised pilot
          detail: Begin with private-road or accompanied public-road trial while validating loading, routing, and safety controls.
        - id: n4
