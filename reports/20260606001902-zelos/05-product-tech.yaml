    summary: Zelos’ public stack spans route-specific fleet operations down to multi-sensor perception and vehicle hardware.
    approximationNotes: >-
      The stack is a qualitative synthesis from official tech modules and partner deployment materials,
      not a vendor-complete or fail-operational engineering diagram.
    data:
      layers:
        - label: Fleet operations and compliance
          value: 6
          detail: Fleet monitoring, maintenance, training, route approvals, and operating procedures with partners such as SingPost and DHL.
        - label: Mission and workflow orchestration
          value: 5
          detail: B2B logistics tasks such as warehouse transfer, public-road pallet movement, parcel relay, and pharma campus replenishment.
        - label: End-to-end autonomy layer
          value: 4
          detail: BEV-based perception-plus-planning stack with company-claimed synchronized prediction and trajectory generation.
        - label: Localization and lightweight mapping
