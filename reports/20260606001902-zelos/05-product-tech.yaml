callouts:
  - calloutType: strength
    title: The public product surface is unusually concrete for a private AV logistics company
    body: >-
      Zelos does not only claim autonomy in generic terms. Its retained public evidence includes
      SKU-level Z-series specs, named customer workflows, structured tech-module descriptions,
      WMS and fleet-monitoring references, and multi-stage deployment proof in Singapore.
    claimRefs:
      - CE001
      - CE005
      - CE015
      - CE022
      - CE035
      - CE040
  - calloutType: risk
    title: The public safety case is still incomplete
    body: >-
      The company and its partners describe sensors, monitoring, and public-road approvals, but
      retained sources still do not publish the hard engineering metrics that would fully support
      an institutional safety diligence pack: speed envelope, braking performance, disengagement,
      MTBF, cybersecurity assurance, and formal safety-standard mappings.
    claimRefs:
      - CE022
      - CE035
      - CE042
      - CE043
  - calloutType: insight
    title: Zelos looks like a platform operator now, not only a vehicle startup
    body: >-
      Cainiao integration, SingPost fleet-management training, DHL WMS integration, and the
      supplier-backed shift into new E/L branches all point to a broader platform strategy that
      combines manufacturing, autonomy, and operating-system responsibilities.
    claimRefs:
      - CE022
      - CE023
      - CE030
      - CE031
      - CE034
  - calloutType: recommendation
    title: Diligence should focus on trim-level reconciliation and formal assurance artifacts
    body: >-
      Management should be pressed for the exact product-variant matrix by market, current sensor
      BOM by platform, safety-case documentation, remote-ops staffing model, factory capacity, and
      any patent or paper list that backs the in-house full-stack narrative.
    claimRefs:
