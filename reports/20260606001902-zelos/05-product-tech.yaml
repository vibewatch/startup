  evidenceGaps:
    - type: missing-source
      severity: material
      topic: public-safety-metrics-gap
      missingEvidence: Public max-speed, braking, stopping-distance, MTBF, disengagement, and remote-ops staffing data by vehicle class and market.
      whyItMatters: Without operating-envelope and reliability metrics, investors cannot fully underwrite safety, utilization, or gross-margin durability for public-road freight operations.
      diligencePath: Request the current safety case, route-approval dossier, and KPI dashboard for the Z5, Z10, and any E/L-series platforms in Singapore and China.
      relatedQuestionRefs: [QE018, QE025]
    - type: missing-source
      severity: material
      topic: assurance-gap
      missingEvidence: Formal safety-standard and cybersecurity artifacts such as ISO 26262, SOTIF, ISO 21434, penetration-test summaries, or internal assurance mappings.
      whyItMatters: Partner testimonials and permits prove progress, but not the completeness of Zelos' engineering and cyber assurance processes as the fleet scales.
      diligencePath: Obtain the internal safety management system, cybersecurity framework, external audit results, and any regulator-submitted hazard analyses.
      relatedQuestionRefs: [QE022, QE025]
    - type: conflicting-data
      severity: material
      topic: z10-variant-drift
      missingEvidence: A market-by-market vehicle-trim matrix reconciling the base Z10 catalog with the lower-payload, lower-range Singapore public-road deployment spec.
      whyItMatters: Buyers and investors need to know whether the published differences reflect earlier hardware, local homologation, battery derating, or a different Z10 sub-variant.
      diligencePath: Request the exact BOM and homologation sheet for every Z10 configuration currently sold or deployed, including Singapore and China variants.
      relatedQuestionRefs: [QE019, QE025]
      relatedTableRefs: [TE001]
    - type: private-evidence-only
      severity: material
      topic: patent-gap
      missingEvidence: Patent docket, technical-paper list, and claims chart connecting specific inventions to the map-free full-stack autonomy narrative.
      whyItMatters: Zelos and recruiting pages imply substantial proprietary IP, but public chapter-5 evidence does not let investors test the depth or defensibility of that moat.
      diligencePath: Request the patent portfolio by jurisdiction, published applications, technical papers, and any freedom-to-operate review after the Cainiao integration.
      relatedQuestionRefs: [QE021, QE025]
    - type: missing-source
      severity: material
      topic: supplier-mix
      missingEvidence: Official sensor and compute BOM disclosure by product branch, including when Hesai, Seyond, or other suppliers are used and how supplier changes affect software calibration.
      whyItMatters: Rapid platform branching can create hidden integration, reliability, and procurement risk if sensor stacks vary materially across Z, E, and L programs.
      diligencePath: Request the current supplier matrix, validation process for cross-sensor software reuse, and supply-agreement terms for any exclusive lidar commitments.
      relatedQuestionRefs: [QE017, QE025]
      relatedTableRefs: [TE003, TE005]
