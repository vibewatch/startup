  - id: deployment-fleet-ops-and-odd
    title: Deployment model, fleet operations, and ODD
    body: >-
      Zelos’ operational-design-domain story is best understood as a phased expansion from
      controlled or private logistics environments into designated public-road freight routes,
      with Singapore as the clearest template market. Customer and official materials show
      the same pattern repeatedly. DHL’s first phase is in-plant movement inside the Asia
      Pacific Advanced Regional Centre, with public-road expansion only in phase two and only
      subject to regulatory approval. FairPrice’s 2024 trial similarly progressed from test
      drives with a safety vehicle to a second phase without an accompanying safety vehicle,
      and Zelos’ own October 2025 news item says the year-long pilot achieved zero takeovers
      and zero incidents before nearly 30 Z10s were slated for scaled rollout. SingPost adds
      another stage gate: hub operations and training first, then public-road driverless
      deployment with explicit fleet-management and maintenance roles. Malaysia’s Pos
      Malaysia PoC starts from the National Mail Centre before any broader operational or
      public-road rollout. The workflow detail behind these deployments matters. Zelos is
      solving repetitive B2B logistics jobs—DC-to-DC pallet transfer, warehouse material
      movement, parcel relay, pharma campus replenishment, and park logistics—not generalized
      urban autonomy. That focus likely narrows the ODD to structured freight routes with
      repeatable loading patterns and operational oversight, which is a strength for
      commercialization. It also means investors should underwrite public-road autonomy as a
      route-qualified, regulator-dependent capability rather than as a universally available
      city-driving product. The real product is vehicle plus dispatch, fleet monitoring,
      training, and compliance progression.
