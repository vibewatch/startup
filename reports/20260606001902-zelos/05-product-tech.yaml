  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Zelos deployments follow a phased logistics-autonomy workflow from route qualification to supervised and then driverless operation.
    approximationNotes: >-
      Flow reflects retained Singapore and Malaysia operating patterns rather than every global deployment.
