  - id: autonomy-stack-and-safety-architecture
    title: Autonomy stack and safety architecture
    body: >-
      Zelos publishes a more concrete autonomy stack than many private AV logistics peers,
      but the evidence is still uneven between architecture claims and formal safety-case
      disclosure. The company homepage and about materials consistently describe a map-free,
      proprietary, full-stack L4 system built in-house from vehicle engineering through
      autonomous driving software. The technical modules are more specific: one module states
      that the perception stack fuses lidar, radars, cameras, and ultrasonic sensors into
      360° awareness with millimeter-level precision; another says a next-generation
      end-to-end model uses a bird’s-eye-view representation to jointly model roads,
      vehicles, and pedestrians while removing HD-map dependence; and a third claims the
      onboard L4 compute unit operates below 100 W. Partner sources deepen the hardware view.
      Hesai said the 2024 Z5 used four AT128 long-range lidars, while Seyond later said the
      newer E6 uses two Lingque W lidars plus millimeter-wave radar, ultrasonic radar, and
      multi-camera sensing. On the operations side, DHL’s Singapore deployment adds advanced
      navigation, real-time monitoring, built-in safety protocols, and warehouse-management-
      system integration, while SingPost’s expanded partnership explicitly covers fleet
      monitoring, management, maintenance, and training. That is enough to conclude that
      Zelos is selling a full operating system for logistics autonomy, not just an AV kit.
      What is still missing is the hard underwriting layer: retained sources do not publish
      max speed, braking distance, MTBF, disengagement, remote-ops staffing ratios, or a
      public ISO 26262 / SOTIF / ISO 21434 style assurance package. So chapter 5 can support
      a credible stack narrative and specific safety mechanisms, but not a complete public
      safety case.
    claimRefs:
