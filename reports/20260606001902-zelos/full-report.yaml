      - number: '2.4'
        title: Competitive Structure, Barriers, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >
              China's autonomous-logistics market is no longer one-company-one-scenario. The competitive structure now
              includes specialist robovan companies such as Zelos, Neolix, and White Rhino; platform-backed operators
              such as Cainiao, JD, and Meituan; and adjacent automotive or supplier entrants moving in from 2025 onward.
              Cainiao's decision to fold its autonomous-driving business into Zelos shows how distribution power and
              route access can matter as much as vehicle hardware. China Post's 7,000-vehicle order likewise suggests
              that large procurement rounds can quickly concentrate volume with scaled vendors.


              The barriers are equally real. Public-road commercialization still depends on pilot permissions, route
              qualification, remote-operations economics, and adverse-weather or cold-start performance. Taibo's account
              of JD's IP complaint adds a second barrier category: legal and trade-secret risk in a market where
              founding teams and engineers have migrated from large incumbents. The source pack also preserves a more
              mundane but important analytical problem: public sources do not agree on Zelos' current fleet scale, with
              partner materials citing more than 20,000 deployed vehicles and product pages citing more than 25,000
              active vehicles. Combined with the absence of a clean published China-only robovan TAM, that means
              valuation work should underwrite adoption with multiple proxies and explicit diligence asks rather than
              with one headline market-size slide.
