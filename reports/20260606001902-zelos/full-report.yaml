      - number: '6.4'
        title: Durability, Expansion Proxies, and Customer Risks
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is directional, not complete. The positive side is real: FairPrice moved from
              early cooperation to approved public-road rollout; SingPost moved from hub trials to a broader strategic
              partnership; DHL framed its current deployment as phase one with additional customer operations planned;
              and Pos Malaysia plus KEZAD show the model translating into postal and industrial export settings. Those
              are credible expansion proxies. The missing side is equally important: public sources do not disclose
              contract length, renewal rates, churn, NRR, GRR, top-customer revenue share, or overall customer count.
              That means the chapter can defend adoption breadth and channel momentum, but not true retention or
              concentration comfort. Customer risk is also not hypothetical. Securities Times reported multiple 2026
              incidents involving Zelos-branded delivery vehicles, including collision and route-compliance allegations,
              which could affect customer trust, deployment permissions, and community acceptance if repeated. The
              result is a balanced judgment: customer proof is materially stronger than a logo wall, yet still weaker
              than a fully underwritable enterprise-retention dossier.
