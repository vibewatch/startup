      - number: '2.2'
        title: Policy, Pilot Zones, and Deployment Readiness
        blocks:
          - type: paragraph
            body: >
              China's policy picture is moving from experimentation toward more standardized commercialization, but
              deployment still depends heavily on where a route sits and which regulator owns it. Suzhou and broader
              Jiangsu are leading current ground-delivery operations, while Beijing's high-level autonomous-driving
              demonstration zone is becoming a benchmark for what large-scale public-road readiness looks like. By 2025,
              Beijing had already issued permits to 33 companies covering about 900 vehicles and more than 32 million
              autonomous-test kilometers, and the city plans to expand its zone to roughly 3,000 square kilometers.
              Beijing's new autonomous-vehicle regulation, effective April 2025, explicitly opens a road-application
              pilot path for urban operational services including logistics.


              National policy is also supportive. The 2026 government work report named the low-altitude economy as an
              emerging pillar industry, which matters because China increasingly treats autonomous logistics as an
              ecosystem question touching roads, depots, drones, vehicle-road-cloud infrastructure, and industrial
              standards rather than as one narrow product category. Still, the source pack shows that commercialization
              remains jurisdiction-specific. The presence of Beijing's pilot path, Jiangsu's early legislation, and
              Meituan's national low-altitude certificate is strong evidence that policy friction is falling, but not
              that open-road deployment is turnkey nationwide. Investors should underwrite geography and route
              eligibility as hard market filters, not as administrative details.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
      - number: '2.3'
        title: Buyer Segments and Workflow Economics
        blocks:
          - type: paragraph
            body: >
              The buyer map is workflow-led. Postal and express operators buy autonomous logistics to defend parcel
              throughput and last-mile economics; platform operators buy it to keep delivery fees low and integrate
              autonomous capacity into existing digital networks; grocers and supply-chain operators buy it to move
              palletized or boxed goods between depots; and large cross-border or contract-logistics operators test it
              first in controlled facilities before seeking public-road approval. The same technology stack therefore
              sells into two different budget logics: last-mile relay is usually justified by parcel economics and labor
              substitution, while middle-mile and depot-transfer use cases are justified by route reliability, DC
              productivity, and vehicle utilization.


              The evidence suggests that buyers care most about cost-to-serve and public-road readiness, not abstract
              autonomy scores. SingPost frames public-road deployment as the lever for reducing last-mile cost.
              FairPrice and DHL both tie AV adoption to moving goods between distribution centers and to reducing manual
              routine tasks. KR-Asia and 36Kr report that unmanned vehicles can halve cost per parcel in some settings,
              reduce customer operating cost materially, and cut remote labor share after deployment matures. Product
              specs also show why last-mile and middle-mile should not be conflated: Zelos' Z5 is a smaller
              urban-delivery workhorse, while the Z10 pushes into heavier, longer-range middle-mile freight. That
              segmentation matters because the buyer, route, and ROI threshold change with vehicle class.
            claimRefs:
