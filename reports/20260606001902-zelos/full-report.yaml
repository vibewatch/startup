        title: Milestones, Commercial Deployments, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows why Zelos is notable. SIPAC said the company was founded in Suzhou Industrial
              Park in 2021 and secured Singapore’s first unmanned transport vehicle license on 2024-05-30. By July 2024
              it claimed 100+ cities and 2M+ kilometers; by April 2025 China Daily described six countries and 200+
