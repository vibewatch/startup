              deployment in 2025, FairPrice received public-road approval in October 2025 and planned close to 30
              vehicles, SingPost expanded its MOU in April 2026, and Zelos separately used 365Group and Intertraffic
              Amsterdam announcements to signal Middle East and European ambitions. The chapter should still stay
              disciplined about weaker evidence. Jiemian’s China Post order, market-share, factory-count, and
              annual-capacity claims are useful but secondary. Taibo’s report that JD alleged IP infringement and
              referred the matter to public security is the clearest retained adverse source and cannot be waved away,
              especially when Yahoo also depicts a still-fluid IPO path. The main underwriting posture is therefore
              positive on deployment proof, cautious on financial transparency, and explicitly alert to legal and
              governance risk.
