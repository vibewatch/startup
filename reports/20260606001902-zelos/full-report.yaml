    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Zelos presents itself as a full-stack autonomous logistics company rather than a narrow software supplier.
              The homepage and about materials say the company builds the technology stack in-house, uses map-free L4
              autonomy, and operates purpose-built RoboVan platforms for logistics use cases. Public company materials
              also support a dual-footprint story. QCC and the Suzhou Industrial Park administration anchor the core PRC
              operating entity as Jiushi (Suzhou) Intelligent Technology Co., Ltd., founded in 2021 in Suzhou Industrial
              Park, while the official about page and April 2026 Singapore partnership releases show an active Singapore
              operating address and commercial team. Scale disclosures are large but not perfectly harmonized across
              sources: the current official site says 25,000+ vehicles across 350+ cities and 20+ countries with 100M+
              autonomous kilometers, whereas April 2026 partner releases still use 20,000+ vehicles and 300+ cities. The
              strongest read is that Zelos has real global deployment breadth, but the company updates headline metrics
              across surfaces over time, so chapter-1 should preserve both the current official numbers and the lower
              April 2026 corroboration rather than collapse them into one falsely precise benchmark.
