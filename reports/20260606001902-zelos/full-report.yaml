  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        The table covers the most defensible retained autonomy and robo-logistics valuation anchors available on
        2026-06-06—public comps with live market caps, private rounds with disclosed valuations, and the most direct
        Zelos transaction references. China robo-van peer disclosures remain incomplete.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Zelos reported Feb 2026 mark
        - '>RMB 10B narrative and separate ~$2B strategic-business reference'
        - Conflicting private marks
        - Direct valuation object for this chapter
        - No disclosed revenue, margin, or term sheet
      - - WeRide
        - ~$2.17B June 2026 market cap; $16.5M Q1 2026 revenue
        - ~33x annualized sales
        - Closest China autonomy public comp with live filing cadence
        - Robotaxi and ADAS mix, not a pure robo-van operator
      - - Serve Robotics
        - ~$0.65B June 2026 market cap; $5.20M TTM revenue
        - ~115x sales
        - Shows the speculative premium investors can place on scarce autonomy assets
        - Tiny revenue base, U.S. delivery-robot format, and geofenced operations
      - - Nuro
        - 2025 private valuation at $6B after a down-round from 2021
        - Late-stage private reset, not a public multiple
        - Useful downside signal for capital-intensive autonomy leaders
        - Pivoted to licensing, so business model differs materially
      - - Starship Technologies
        - 2025 $50M round; 9M deliveries; 2,700+ robots; total funding >$280M
        - Operational scale comp, no disclosed valuation
        - Shows that autonomous delivery can reach meaningful volume and claimed positive margins
        - Mostly campus and geofenced delivery rather than public-road robovans
      - - Cainiao/Zelos strategic transaction
        - ~$2B robovan-business valuation in Reuters/WSJ-derived reporting
        - Strategic transaction anchor
        - Most direct observed private price signal around Zelos in 2026
        - May reflect injected-business value rather than clean equity value
    notes: >-
      Comparable evidence mixes public market caps, private round valuations, and strategic transaction references
      because no retained source discloses Zelos revenue or a like-for-like China robo-van comp set with both valuation
      and denominator data.
