            body: >-
              Zelos has stronger manufacturing-maturity evidence than an average robotics startup, but its
              next-generation platform roadmap is still only partly transparent. The official milestone record says the
              first prototype launched in May 2022 to validate self-driving systems and hardware, Z5 mass production
              started in June 2023, and the all-scenario Z-series platform launched in June 2024. Those milestones,
              together with supplier announcements from Hesai and later Seyond, support a real production program rather
              than a lab-only prototype effort. The Cainiao integration then moves the story beyond a standalone vehicle
              OEM: Zelos says Cainiao injected its RoboVan business, joined the shareholder base, and contributed
              management, manufacturing, operations, and VLM/world- model research capabilities. Official materials also
              say L-series models and L4.5 technology were launched in September 2025, while 36Kr describes an emerging
              three-branch portfolio: Z for standard products, E for lighter and lower-cost use cases, and L for
              heavier-load demand. The problem is that the newest branches are not yet documented with the same clarity
              as the current Z catalog. Public sources also suggest sensor-stack evolution rather than a stable bill of
              materials: Z5 2024 used four Hesai lidars, partner reporting on E6 highlights dual Seyond lidars, and a
              March 2026 media item says the latest-gen RoboVan lineup will standardize on a 200,000-unit Hesai lidar
              order. That does not invalidate the roadmap, but it does create diligence questions on trim management,
              supplier concentration, and whether different markets are using different hardware generations. Public
              patent visibility is also thin: retained sources do not enumerate patent numbers or technical papers. So
