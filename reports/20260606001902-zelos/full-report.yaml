  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product family and customer workflow fit
        blocks:
          - type: paragraph
            body: >-
              Zelos’ current official product surface is built around logistics-specific RoboVan variants rather than a
              single generic autonomous van. The CMS-backed product catalog exposes five currently named Z-series SKUs:
              Z5, Z5-Cold Chain, Z5 Multiple Locker, Z10, and Z10-Cold Chain, each tied to a distinct workflow and
              payload profile. The smaller Z5 is positioned for urban and campus delivery, reverse pickup, and shuttle
              operations; the Z10 moves into heavier middle-mile or depot-transfer work; the cold-chain and locker
              variants adapt the same autonomy base into temperature-controlled or multi-drop last-mile configurations.
              The scenario layer is equally workflow-led. Zelos’ public solutions materials map the platform into FMCG,
              pharmaceutical, business-park, parcel, and retail-replenishment jobs, while partner-detail cards add named
              operating examples such as Yum store replenishment, Sinopharm hospital-campus delivery, DHL warehouse
              logistics, and FairPrice public-road pallet transfer. The most important underwriting distinction is
              maturity by branch. The Z family has clear published specs and the strongest deployment proof. By
              contrast, 36Kr and supplier pages point to newer E-series and L-series branches, but those newer lines are
              less fully documented on Zelos’ own product catalog. The right chapter-5 read is therefore that Zelos
              already has a real, differentiated RoboVan portfolio for B2B logistics, but investors should separate the
              mature, spec-visible Z family from the newer E/L roadmap branches whose exact trims, economics, and
              certification status are not yet equally transparent.
