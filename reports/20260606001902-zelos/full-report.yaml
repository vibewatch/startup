          economic rather than promotional
      - - 'THESIS: Cainiao backing is more meaningful than ordinary venture branding'
        - >-
          Cainiao injected assets and cash instead of just running a minority pilot relationship, and February 2026
          reports frame it as a strategic combination
        - >-
          The view improves if shareholder and exclusivity terms show Zelos retains meaningful standalone economics
          rather than acting as a controlled channel vehicle
      - - 'THESIS: Public autonomy comps show that investors still tolerate rich multiples for scarce assets'
        - >-
          WeRide and Serve both trade at high revenue multiples, while Nuro and Starship show continued capital support
          for sector leaders
        - This gets stronger if Zelos can prove revenue quality closer to public comps, not just asset or fleet scale
      - - 'ANTI-THESIS: The exact February 2026 valuation is weakly documented'
        - Retained sources disagree between a >RMB 10B narrative and a separate ~$2B strategic-business reference
        - The concern falls sharply if management releases the term sheet, post-money cap table, and investor list
      - - 'ANTI-THESIS: Economics visibility is still too thin for a buy call'
