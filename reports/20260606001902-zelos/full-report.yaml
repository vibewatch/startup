        - The bear case softens only if diligence shows revenue scale and healthy route-level economics
      - - 'ANTI-THESIS: Legal and execution overhang can compress the multiple quickly'
        - >-
          The JD intellectual-property allegation and a still-fluid IPO path create non-trivial downside if
          commercialization or disclosure wobbles
        - >-
          The risk eases if counsel shows the issue is closed and IPO-readiness materials demonstrate public-market
          discipline
    notes: >-
      The table separates what is genuinely valuation-supportive from what still relies on hidden financial or legal
      evidence.
