  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation evidence and confidence
        blocks:
          - type: paragraph
            body: >-
              Zelos enters valuation work with real strategic momentum but weak pricing precision. The strongest
              positive evidence is that the company has accumulated a meaningful financing history, pulled Cainiao’s
              robovan business into its orbit, and is consistently described in February 2026 coverage as having raised
              more than $300 million at a low-to-mid unicorn price. The problem is that the retained sources do not
              resolve to one exact figure. Reuters-derived reporting anchors a roughly $2 billion valuation for the
              robovan business associated with the Cainiao transaction, while multiple February 2026 Chinese and English
              reports cluster around “above RMB 10 billion,” which is roughly $1.4 billion. That is not a trivial
              discrepancy. It means the public record supports the direction of a unicorn mark, but not the exact
              number. Because the same source set also fails to disclose revenue, gross margin, or financing terms,
              confidence in the precise February 2026 price must stay low even though confidence in Zelos’s strategic
              relevance is much higher.
            claimRefs:
              - CV003
