      - number: '1.2'
        title: Founders, Leadership, and Governance Surface
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is directionally useful but not fully clean. QCC identifies Cui Xiao as legal
              representative and executive director of the Suzhou operating entity and Kong Qi as manager, while the DHL
              launch release names Sean Zhang as co-founder and COO. The April 2026 Zelos and SingPost partnership
              releases then describe Sean Zhang as Co-Founder & CEO, Global Business, and Terry Zhou as Managing
              Director, Zelos Singapore. China Daily separately names Zhuang Li as a co-founder, and Taibo says Zhuang
              Li, Kong Qi, and Zhu Weicheng previously came from JD’s autonomous vehicle team. That does not amount to a
              clean current org chart. Instead, it suggests founder continuity plus regional operating leadership, but
              with role labels that vary across registry, partner, and media sources. For diligence, the bigger issue is
              governance opacity: no retained source gives the full current board roster, observer rights, ownership
              splits, or the post-Cainiao/post-February-2026 control structure. That means the company can be described
              as founder-linked and operationally visible, but not as a transparently governed late-stage company on
              public evidence alone.
