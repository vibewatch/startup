  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation logic
      - Indicative value range
      - Probability signal
      - Main trigger
    rows:
      - - Bear
        - >-
          Fleet scale is real but monetization is weaker than implied; legal or IPO risk widens the discount; terms may
          be investor-protective
        - Deep discount to the strategic mark and only limited premium to smaller public autonomy comps
        - $0.7B-$1.0B
        - ~30%
        - Revenue disclosure disappoints or the legal / IPO picture worsens
      - - Base
        - >-
          RMB 10B reporting cluster is directionally right; Cainiao support is helpful; disclosure is still too thin for
          a premium
        - Moderate discount to the higher $2B strategic-business reference because revenue and terms remain hidden
        - $1.1B-$1.6B
        - ~50%
        - Current public story stays intact but does not convert into auditable economics
      - - Bull
        - >-
          Cainiao and China Post scale converts into clear recurring revenue; IPO path or strategic-sale readiness
          improves materially
        - Near-parity with the strategic mark and room for a premium toward the WeRide public cap
        - $1.8B-$2.4B
        - ~20%
        - Audited growth, clean terms, and repeated large-account wins justify paying up
      - - Probability-weighted midpoint
        - Weighted combination of the three ranges
        - Midpoint of the scenario set rather than a disclosed price
        - $1.35B
        - 100%
        - Useful only as a framing anchor; not a substitute for financial diligence
    notes: >-
      Values are in USD millions. The rows deliberately anchor on discounts or premiums to reported private marks and
      public comp envelopes because Zelos does not disclose a live revenue denominator.
