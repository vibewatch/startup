      - number: '8.4'
        title: Recommendation, hard-stop triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK / RESEARCH-MORE with low confidence and high risk. That stance is not a denial
              of Zelos’s progress; it is the consequence of missing underwriting variables. The retained record is
              strong enough to say that Zelos is more than a slide-deck company: it has visible partner deployments, a
              real Cainiao link, and a credible case for why strategic investors would want a robo-van champion. It is
              not strong enough to say that an exact February 2026 valuation is cleanly supported. A buyer should treat
              the current mark as workable only if diligence can convert the story into numbers—audited revenue, gross
              margin, ordinary investor terms, and customer economics on the China Post and Cainiao-backed programs.
              Until then, the right posture is to define hard-stop triggers rather than rationalize ambiguity. If the
              company cannot evidence monetization, if legal issues escalate, or if the IPO narrative weakens, the
              valuation case should compress quickly. If disclosure sharpens and repeat large-account economics hold up,
              the same recommendation can move upward fast.
