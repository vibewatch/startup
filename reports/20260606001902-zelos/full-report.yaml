      - number: '8.2'
        title: Thesis, anti-thesis, and comparable set
        blocks:
          - type: paragraph
            body: >-
              The positive case for Zelos is that it may already control the most scaled independent robo-van footprint
              disclosed in this source set: the company says 25,000-plus vehicles and 100 million-plus kilometers,
              partner and media sources still corroborate a 20,000-plus vehicle base, and a reported China Post order
              suggests the platform can win national-scale procurement. Cainiao’s asset injection also matters because
              it is a stronger signal than ordinary venture backing: a major logistics platform chose combination over
              in-house continuation. The anti-thesis is equally important. Nearly every valuation-supporting fact is
              company-led, partner-led, or secondary-media-led rather than audited. Public comps such as WeRide and
              Serve prove investors will support rich autonomy multiples, but those businesses also publish financials
              and filings that Zelos does not. Nuro’s down-round is the more sobering lesson: when autonomy leaders
              cannot show a capital-efficient path, the market can re-rate quickly. Zelos therefore screens as
              strategically credible but disclosure-poor, which is why the thesis must stay price-sensitive rather than
              celebratory.
