    Zelos is a China-rooted autonomous-logistics company centered on Jiushi (Suzhou) Intelligent Technology Co., Ltd.,
    founded in Suzhou Industrial Park in 2021 and commercialized internationally through a meaningful Singapore
    operating footprint. The company sells and deploys purpose-built L4 robo-vans and related fleet operations services
    for parcel, retail, postal, industrial-park, and middle-mile logistics scenarios. Public evidence supports real
    scale and customer proof — including SingPost, FairPrice, DHL, and a reported China Post order — plus a
    strategically important Cainiao asset-and-cash transaction. What remains opaque is the exact 2026 post-money
    valuation, cap table, board/control structure, and current revenue or margin profile.
