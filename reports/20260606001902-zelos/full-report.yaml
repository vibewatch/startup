      - number: '1.3'
        title: Funding History, Investors, and the Cainiao Link
        blocks:
          - type: paragraph
            body: >-
              Zelos’s capital story is strong in headline terms but weaker on mechanics. Gasgoo reported a $100 million
              B1 round in November 2024 led by CDH BAIFU and Blue Lake, and Blue Lake later said the company completed
              nearly $300 million of Series B financing after a fresh $100 million B3 round in April 2025, with Asia
              Investment Capital and Baidu Ventures participating. Reuters-derived U.S. News reporting added a separate
              strategic twist in January 2026: Cainiao would contribute its autonomous-driving business and cash for a
              stake in Zelos, without taking control, at an approximately $2 billion robovan-business valuation
              according to the Wall Street Journal. Multiple February 2026 secondary outlets then described a new
              financing of more than $300 million and a valuation above RMB 10 billion, roughly $1.4 billion. That
              unicorn-level narrative is well corroborated in press, so it should not be dismissed, but the exact
              valuation mechanics still rest on secondary coverage rather than retained primary financing documents.
              Chapter-1 therefore can support a large late-stage financing story and a meaningful Cainiao strategic
              relationship, while explicitly preserving cap- table, post-money, governance-rights, and ownership
              uncertainties.
