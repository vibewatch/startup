      - number: '7.2'
        title: Regulatory, legal, and policy risk
        blocks:
          - type: paragraph
            body: >-
              China's unmanned-delivery policy surface is still supportive but not fully normalized. Xinhua and CCTV
              both frame the core problem as unfinished legal status, with local pilot rules doing most of the real work
              while national qualification, liability, and vehicle-classification questions remain open. That matters
              because Zelos is trying to scale a cross-city and cross-border fleet, not a single-zone demo. Beijing's
              and Shenzhen's local rules impose insurance, monitoring, emergency-response, and designated-route
              controls; national standard-setting is still advancing around safety, cybersecurity, and operating
              conditions rather than offering a single settled national regime. Singapore is more commercially promising
              but legally similar in one important sense: FairPrice, SingPost, DHL, and Zelos itself all describe a
              phased path in which larger public-road deployments remain approval- dependent. The second legal thread is
              JD's complaint. Taibo and QQ News say JD reported suspected IP infringement to public security and that
              the matter remained under investigation, while 36Kr argues that a formal escalation could become material
              to IPO timing. That does not prove wrongdoing. It does show that Zelos enters any financing or listing
              process with an unresolved, specifically alleged, potentially high-severity legal overhang.
            claimRefs:
