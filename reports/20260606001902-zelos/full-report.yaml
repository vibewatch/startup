  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Demand Base
        blocks:
          - type: paragraph
            body: >
              Zelos should be analyzed inside China autonomous logistics rather than inside the whole autonomous-vehicle
              market or the whole e-commerce market. The relevant boundary is autonomous movement of parcels and freight
              across repeatable logistics workflows: campus and community last-mile relay, urban public-road
              distribution, depot-to-store middle-mile, and park or hub circulation where vehicles, dispatch software,
              and relay robotics work together. That included spend covers autonomous delivery vehicles, software and
              fleet operations, relay robots, and the site integration needed to turn a route into a repeatable
              operating line. It excludes passenger robo-taxis, consumer delivery gadgets, and generic parcel labor or
              non-robotic transport spend.


              Demand is unquestionably large. China's express-delivery network handled 174.5 billion parcels in 2024,
              199 billion in 2025, and 47.73 billion in the first quarter of 2026 alone. Official sources and industry
              media also show how that demand is being operationally absorbed: automated sorting centers, drones, indoor
              relay robots, and unmanned delivery vehicles are being deployed in mainstream parcel operations rather
              than confined to labs. The important analytical caution is that demand volume is not the same thing as
              robovan revenue. Public evidence supports a very large parcel economy, a large logistics-automation
              adjacency, and a fast-growing global delivery-robot and delivery-drone market; it does not support one
              clean China-only robovan TAM. That is why this chapter preserves proxy-based sizing and explicit evidence
              gaps.
