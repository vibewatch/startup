companyProfile:
  summary: Zelos is a China-rooted autonomous-logistics company centered on Jiushi (Suzhou) Intelligent Technology Co., Ltd., founded in Suzhou Industrial Park in 2021 and commercialized internationally through a meaningful Singapore operating footprint. The company sells and deploys purpose-built L4 robo-vans and related fleet operations services for parcel, retail, postal, industrial-park, and middle-mile logistics scenarios. Public evidence supports real scale and customer proof — including SingPost, FairPrice, DHL, and a reported China Post order — plus a strategically important Cainiao asset-and-cash transaction. What remains opaque is the exact 2026 post-money valuation, cap table, board/control structure, and current revenue or margin profile.
  foundedDate: '2021-08-10'
  founders:
    - name: Sean Zhang
      role: Co-Founder; CEO, Global Business
      background: Named by DHL and SingPost/Zelos partnership releases as a co-founder and cross-border commercial leader.
      claimRefs: [CO012, CO013]
    - name: Zhuang Li
      role: Co-Founder
      background: Named by China Daily as a co-founder; Taibo says he previously worked on JD's autonomous-vehicle team.
      claimRefs: [CO015]
  foundingLocation: Suzhou Industrial Park, Suzhou, China
  headquarters: Suzhou, China
  productSummary: Purpose-built autonomous cargo-delivery robots and robovans (including Z5 and Z10 platforms) with map-free L4 autonomy, in-house vehicle plus autonomy engineering, and lifecycle fleet operations / O&M support for logistics operators.
  customerFocus: Postal operators, parcel and express networks, grocery and retail supply chains, contract-logistics operators, and industrial-park / campus logistics workflows.
  businessModel: Vehicle sales plus leasing or managed-operation models, supported by lifecycle operations and maintenance services and strengthened by Cainiao-linked channel access.
  stage: late-stage private / post-Series B-plus strategic financing
  fundingStatus: Nearly $300M of Series B financing was publicly disclosed by April 2025; February 2026 secondary reports then described >$300M of new financing and a >RMB 10B headline valuation, while Reuters-derived coverage separately described an approximately $2B Cainiao-linked robovan-business valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO006, CO019, CO021, CO022, CO034, CO042, CU001, CU010, CU027]
summary:
  headline: Zelos appears to be a real, unusually scaled autonomous-logistics operator with strong partner-backed deployment proof, but hidden economics, mixed valuation reporting, and unresolved legal/governance questions keep the case in research-more territory.
