  topStrengths:
    - >-
      Real partner-backed commercialization proof in Singapore with SingPost, FairPrice, and DHL rather than only lab or
      pilot claims
    - >-
      Unusually large disclosed fleet scale for a private robo-van company, with official 25,000+ vehicle claims and
      partner-backed 20,000+ corroboration
    - >-
      Strategic Cainiao integration appears to add route access, enterprise distribution, and ecosystem support beyond
      pure venture branding
    - Product breadth spans last-mile, middle-mile, postal, retail, and industrial-park logistics scenarios
    - >-
      China Post and other large-network references suggest the company can compete for national-scale logistics
      programs
  topRisks:
    - >-
      Exact February 2026 valuation, terms, and cap-table mechanics remain unresolved because retained evidence is
      secondary and internally split
    - No retained public disclosure of current revenue, gross margin, unit economics, or customer-retention metrics
    - JD intellectual-property allegations remain an unresolved legal overhang for financing or IPO readiness
    - >-
      Cainiao and other large-account relationships create channel and customer-concentration risk even as they
      accelerate growth
    - >-
      Public-road autonomy remains highly permit- and safety-dependent across China, Singapore, and other expansion
      markets
  unresolvedGaps:
    - >-
      Primary financing documents or shareholder disclosures that reconcile the >RMB 10B and ~$2B February 2026
      valuation narratives
    - Current revenue, gross margin, burn/runway, and route-level unit-economics disclosure
    - Full board roster, ownership percentages, liquidation preferences, and post-Cainiao governance rights
    - >-
      Customer concentration, renewal/churn, and contract-economics disclosure across China Post, Cainiao-linked, and
      Singapore accounts
    - Primary-case-status or company-response documents for the JD intellectual-property complaint
