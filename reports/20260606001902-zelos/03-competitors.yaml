- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim / risk
  - Supporting evidence
  - Threat source
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Claimed scale moat
    - Zelos discloses 25,000+ vehicles and 100M+ km, larger than disclosed direct peer fleets in this source set
    - Direct peers may under-disclose and incumbents may offset with captive order flow
    - Medium
    - Request jurisdiction-level deployment mix, active-customer counts, and repeat-order retention
  - - Cainiao channel leverage
    - Cainiao is both a shareholder in Zelos and the operator behind Xiaomanlv
    - Partner can become platform gatekeeper or internalize more robo-van demand
    - High
    - Request commercial terms, exclusivity boundaries, and revenue concentration tied to Cainiao
  - - Chinese incumbent distribution power
    - JD and Meituan pair automation with existing parcel or consumer-app demand
    - Bundling can beat a better vehicle if the incumbent controls traffic and routes
    - High
    - Test Zelos win/loss history against parcel incumbents and app-linked operators
  - - Regulatory asymmetry
    - Meituan holds a nationwide low-altitude logistics certificate while WeRide and AutoX have stronger public-road permit disclosure than most private robo-van peers
    - Policy access can compound faster than product differentiation
    - High
    - Request Zelos permit inventory by country, city, road type, and operating partner
  - - Pricing opacity
    - Public sources rarely disclose realized robo-van prices or margins
    - Cannot prove Zelos has better economics than peers from public evidence alone
    - Medium
    - Obtain signed customer contracts or at least anonymized deployment-unit economics
  - - Capital intensity benchmark
    - Nuro down-rounded while pivoting to licensing, and Starship/Serve prove that easier geofenced formats scaled first
    - Owning fleets may remain expensive even with strong autonomy software
    - Medium
    - Model capex, maintenance, utilization, and payback under multiple deployment densities
  notes: Severity reflects underwriting relevance rather than certainty of loss. The register intentionally separates evidence-backed strengths from unresolved diligence asks.
