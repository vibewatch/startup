- id: moat-durability-and-displacement-risks
  title: Moat Durability and Displacement Risks
  body: 'Zelos has real differentiation in the public record: a broad claimed fleet footprint, multi-country operations, a purpose-built robo-van product line, and open-road plus closed-road deployment language that is more expansive than most private China specialists disclose. That matters because many competitors either focus on a narrower operating domain, such as White Rhino''s retail same-city use cases, or on different autonomy categories, such as Meituan drones, AutoX robotaxis, or Gatik middle-mile trucks. The durability question is whether Zelos can turn those product and scale claims into defensible access. Public evidence points to four main risks. First, incumbent distribution power from Cainiao, JD, and Meituan can compress the value of independent vehicle vendors. Second, exact customer pricing and realized economics remain opaque across nearly all peers, so the market still lacks hard evidence on who can profitably operate robo-vans at scale. Third, the best-documented global
    scale benchmarks today are Starship and Serve, which run lighter, more geofenced formats than Zelos. Fourth, Nuro''s down-round and licensing pivot show that capital intensity can force even well-funded pioneers to reframe their go-to-market model. The chapter therefore supports a tempered conclusion: Zelos appears competitively credible, but its moat is not yet publicly proven without clearer win-loss data, pricing evidence, and direct disclosure on how Cainiao, regulators, and enterprise customers shape recurring demand.'
