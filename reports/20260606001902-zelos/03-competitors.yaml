  - Constraint vs Zelos
  rows:
  - - Zelos
    - Direct robo-van specialist
    - 25,000+ vehicles; 100M+ km; 20+ countries; 350+ cities
    - Enterprise logistics operators, campuses, industrial sites, parcel workflows
    - Map-free L4 robo-vans across open and closed roads
    - Cainiao shareholding; global footprint claimed by company
    - Private disclosure only; exact pricing and win rates not public
  - - Cainiao Xiaomanlv
    - Platform-linked direct competitor
    - 10M+ parcels; 500+ robots; target 1,000 robots at 500 campuses
    - Campus parcels, Cainiao post stations, broader e-commerce logistics
    - L4 unmanned vehicles for end-to-end logistics
    - Embedded Cainiao parcel network and campus density
    - Heaviest public evidence is campus and parcel-station use, not broad third-party enterprise sales
  - - JD Logistics robots
    - Incumbent logistics network benchmark
    - 100+ road robots and ~50 indoor robots in Shanghai; 2025 plan for 3M robots, 1M AVs, 100k drones
    - JD logistics network, warehouses, hospitals, last-mile and internal logistics
    - Road robots, indoor robots, multi-process warehouse and delivery automation
    - JD order flow, national logistics estate, procurement scale
    - Autonomy sits inside JD network rather than as an open robo-van platform
  - - White Rhino
    - Direct robo-van specialist
    - Series C1 financing announced May 2026; nearly ten-city urban distribution footprint; 5,000-vehicle daily target in five years
    - Same-city freight, supermarkets, fresh retail, instant delivery
    - Vehicle-grade robo-vans and unmanned freight operations
    - Huolala and SF Same-City partnerships in retail and instant delivery
    - Public disclosure on actual fleet size and unit economics is still thin
  - - Neolix / New Stone
    - Direct robo-van specialist
    - 15,000+ deployed vehicles; 1,200+ Qingdao benchmark fleet; first unmanned public-road approvals in UAE
    - Urban delivery, vending, low-speed logistics, city programs
    - Mapless L4 robo-vans under RaaS model
    - Dense benchmark fleet and international pilot footprint
    - Company-led disclosure dominates; current pricing not public
  - - WeRide Robovan W5
    - Direct cargo benchmark
    - Public Nasdaq issuer; Robovan W5 launched 2025; 1,900 days and ~40M km of autonomous ops
    - Express delivery, urban distribution, point-to-point logistics
    - Open-road cargo robovan with 1,000 kg payload and 220 km range
    - Public-company filing cadence and open-road proof
    - Heavier cargo orientation than campus or micro-fulfillment use cases
  - - Meituan autonomous delivery
    - Incumbent adjacent benchmark
    - 450,000+ drone orders by end-2024; 740,000 by Dec-2025; nationwide CAAC certificate
    - Food, instant retail, airport and park delivery
    - Drone network plus autonomous last-hundred-meter fulfillment
    - Consumer demand aggregation and unique national-scale low-altitude license
    - Lead is drone-centric, not a direct public-road robo-van business
  - - Starship
    - Global benchmark
    - 10M+ deliveries; 2,700+ robots; $50M 2025 funding; $280M+ total funding
    - Campuses, retailers, delivery apps, industrial sites
    - Sidewalk / campus robots at Level 4
    - Mature geofenced operations across seven countries
    - Format is lighter and more geofenced than Zelos robo-vans
  notes: Public numbers mix company claims, independent coverage, and filing indexes as of 2026-06-06. Several private operators disclose deployment scale but not audited revenue, realized pricing, or current valuation.
