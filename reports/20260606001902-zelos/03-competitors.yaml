- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public pricing disclosure
  - Contract / packaging model
  - Included capabilities
  - Discount / unknown note
  - Implication
  rows:
  - - Zelos
    - Undisclosed
    - Enterprise vehicle-and-platform deployments
    - RoboVan hardware, autonomy stack, fleet operations support
    - No public list pricing or realized margin data
    - Buyers must diligence economics through direct proposal process
  - - Cainiao
    - No customer list price; internal cost claim disclosed
    - Managed unmanned-vehicle service inside Cainiao logistics network
    - Vehicle, OTA, maintenance, insurance, five-year core-component warranty
    - 0.1 RMB delivery-cost claim is vendor-stated cost logic, not external contract pricing
    - Cainiao can compete on network economics even without open price sheets
  - - Neolix
    - Undisclosed
    - RoboVan-as-a-Service
    - Mapless L4 robo-vans, cloud dispatch, fleet management
    - RaaS lowers upfront capex, but actual contract fees are not public
    - Flexible service framing may accelerate adoption where buyers avoid owning fleets
  - - WeRide
    - Undisclosed
    - Vehicle + cloud + operations deployment package
    - Robovan W5, scheduling, OTA, training, maintenance, warranty support
    - Public specs are detailed but customer prices are not
    - High feature disclosure helps trust, but economic comparison still requires diligence
  - - Serve
    - Undisclosed
    - Multi-year deployment contracts with platforms
    - Sidewalk robots integrated with Uber Eats and other enterprise partners
    - Public company discloses contracts and growth events, not unit economics per robot
    - Platform-led packaging looks replicable for apps, but not directly for heavy robo-vans
  - - Nuro
    - Undisclosed
    - Autonomy licensing to OEMs and fleets
    - Nuro Driver and Nuro Toolkit
    - Licensing removes vehicle ownership from the customer value proposition
    - Shows one path away from fleet capex for operators facing capital pressure
  - - Gatik
    - Undisclosed
    - Autonomous Transportation as a Service (ATaaS)
    - Autonomous trucks, driver stack, operating service on repeat routes
    - No public rate card; value framed around network uptime and safety
    - ATaaS is a benchmark for enterprise packaging, but for middle-mile freight rather than last-mile robo-vans
  notes: Most vendors disclose operating model and service bundle, not list pricing. Table focuses on packaging structure and what remains unknown so unsupported cost comparisons are not invented.
