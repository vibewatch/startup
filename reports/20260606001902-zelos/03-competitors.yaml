- id: regulatory-access-and-channel-power
  title: Regulatory Access and Channel Power
  body: 'The most important competitive pattern in public evidence is that channel ownership and regulatory access often matter more than autonomy software in isolation. Cainiao combines robo-van development with parcel-station density, campus traffic, and broader e-commerce logistics infrastructure; Zelos itself says Cainiao injected its RoboVan business and became a shareholder, which can help distribution but also raises platform-dependence questions. JD brings an even larger logistics network and has already demonstrated public-road delivery robots, indoor hospital robots, and an automation procurement plan that dwarfs what specialist vendors disclose. Meituan is not a direct robo-van vendor, but it is the clearest proof that Chinese logistics incumbents can turn regulatory approval into a structural moat: by April 2025 it had secured the country''s first nationwide low-altitude logistics operating certificate, after already building 53 routes and more than 450,000 deliveries. AutoX
    and DeepRoute.ai matter because they show adjacent autonomy stacks with permits, OEM backing, or mass-produced smart-driving deployments that could move into logistics if the commercial case improves. For Zelos, the implication is that winning in China likely requires not only strong robo-van technology, but also privileged route access, order aggregation, and operating partners that can match the embedded advantages of Cainiao, JD, or Meituan.'
