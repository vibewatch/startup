- id: operating-model-and-global-benchmarks
  title: Operating Model and Global Benchmark Comparison
  body: 'The global benchmark set is useful mainly for operating-model contrast, not for one-to-one Chinese substitution. Starship and Serve prove that autonomous delivery can reach public scale, but the evidence is strongest in sidewalk, campus, or tightly geofenced formats rather than heavier public-road robo-vans. Starship discloses more than 10 million deliveries and 2,700-plus robots, while Serve discloses tens of thousands of deliveries and a signed plan to deploy up to 2,000 robots on Uber Eats. Nuro is the clearest cautionary benchmark: it still reports years of driverless deployments and more than 1.7 million autonomous miles, but its 2025 fundraise came at a lower valuation and alongside a shift away from operating goods-only vehicles toward licensing autonomy. Gatik sits outside last-mile delivery but is still relevant because it shows a different path to enterprise adoption: autonomous transportation as a service on repeatable middle-mile routes, combined with heavy stakeholder
    engagement and structured safety validation. Against those benchmarks, Zelos looks less like a consumer app network and more like a multi-scenario robo-van platform that still relies on bespoke enterprise packaging rather than transparent list pricing. Public sources reveal service models, payload domains, and support structures, but not clean apples-to-apples contract economics, which makes capability and channel access more observable than gross margin or realized price.'
