  evidenceGaps:
  - type: missing-source
    severity: material
    topic: adjacent-entry-pipeline
    missingEvidence: Direct product roadmaps or signed logistics customers showing whether AutoX or DeepRoute will commercialize last-mile or robovan logistics rather than stay adjacent to it.
    whyItMatters: Likely-entrant risk is directionally important, but current public evidence mostly proves permits or OEM relationships rather than a committed delivery-market launch.
    diligencePath: Request product roadmaps, customer references, or pilot contracts that tie AutoX or DeepRoute to logistics-specific commercialization.
    relatedQuestionRefs:
    - QP016
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Signed contracts or anonymized deployment economics that show list price, realized price, utilization, and service margin for Zelos and direct peers.
    whyItMatters: Without real contract economics, the public record cannot prove whether Zelos has a defendable cost or pricing advantage versus Cainiao, Neolix, White Rhino, or WeRide.
    diligencePath: Obtain customer contracts, pricing schedules, or board materials with realized deployment economics and renewal terms.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: cainiao-channel-dependence
    missingEvidence: Commercial terms governing Cainiao's shareholding, channel rights, exclusivity boundaries, and revenue concentration exposure for Zelos.
    whyItMatters: Cainiao can be either a moat amplifier or a gating dependency, and public sources do not show which side dominates in actual contracts or governance.
    diligencePath: Review shareholder agreements, revenue concentration by partner, exclusivity clauses, and pipeline ownership rules between Zelos and Cainiao.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: meituan-transferability
    missingEvidence: Direct public evidence on Meituan ground-robot or robo-van scale that would show how far its drone lead transfers into road-based autonomous logistics.
    whyItMatters: Meituan's regulatory lead is clear in drones, but robo-van competition is only partially resolved if the same route, merchant, and locker advantages do not carry over to road vehicles.
    diligencePath: Collect Meituan ground-robot route counts, vehicle deployments, or customer metrics and compare them with its drone network and merchant base.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: win-loss-evidence
    missingEvidence: Named customer wins, renewal data, tender outcomes, and churn evidence showing where Zelos actually wins or loses against Cainiao, JD, Neolix, White Rhino, and WeRide.
    whyItMatters: Claimed fleet scale does not prove durable moat unless buyers repeatedly select Zelos over the strongest local and global alternatives.
    diligencePath: Request top-20 customer cohorts, tender scorecards, renewal history, and post-deployment expansion rates segmented by competitor encountered.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
