company:
  name: Zelos
chapter:
  number: 3
  title: Competitors
  summary: Zelos competes most directly with China robo-van specialists such as Neolix/New Stone, White Rhino, Cainiao Xiaomanlv, and WeRide cargo, while JD Logistics and Meituan matter because their distribution networks and regulatory access can be harder to replicate than vehicle hardware itself. Public evidence suggests Zelos discloses unusually large claimed scale for a private robo-van operator, but incumbents still hold stronger captive order flow, more visible policy access, or stronger public-market disclosure than Zelos does today.
sections:
- id: china-direct-operators
  title: China Direct Operators and Peer Classes
  body: 'The direct China field is not a single homogeneous peer set. Zelos positions itself as a global RoboVan platform with more than 25,000 autonomous logistics vehicles, over 100 million kilometers, and operations in 20-plus countries and 350-plus cities, which is larger than any other disclosed robo-van fleet in this source set. The closest like-for-like competition comes from Neolix/New Stone and White Rhino, which both market purpose-built autonomous delivery vehicles for dense urban logistics. Neolix claims more than 15,000 vehicles deployed, a RoboVan-as-a-Service model, and a dense Qingdao benchmark fleet, while White Rhino emphasizes same-city grocery, supermarket, and instant-delivery operations with Huolala and SF Same-City. Cainiao Xiaomanlv and JD Logistics are structurally different but strategically important because they combine autonomy with existing parcel or e-commerce infrastructure. Cainiao already claims L4 public-road capability, 7x24 service, and more than 10 million
    delivered parcels, while JD has shown both emergency last-mile deployment and a procurement plan measured in millions of robots, vehicles, and drones. WeRide belongs in the direct set only for heavier open-road cargo benchmarking: its Robovan W5 is more truck-like in payload and range than campus or sidewalk robots, but it proves that another China autonomy company is commercializing urban logistics on public roads with public-company disclosure.'
