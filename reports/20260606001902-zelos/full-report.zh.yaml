  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与需求底盘
        blocks:
          - type: paragraph
            body: >
              分析 Zelos
              应放在中国自动驾驶物流里，而不是整个自动驾驶汽车市场或整个电商市场里。相关边界是包裹和货物在可重复物流工作流中的自动移动：园区和社区末端接驳、城市公开道路配送、仓到店中段运输，以及园区或枢纽内部循环，车辆、调度软件和接驳机器人共同运转。纳入的支出包括自动配送车辆、软件和车队运营、接驳机器人，以及把一条路线变成可重复运营线所需的场地集成。不纳入乘用
              robotaxi、消费级配送小玩意，以及普通包裹人工或非机器人运输支出。


              需求无疑很大。中国快递网络 2024 年处理 174.5 billion 件包裹，2025 年处理 199 billion 件，仅 2026 年第一季度就处理 47.73 billion
              件。官方来源和行业媒体也显示，需求正如何被运营端吸收：自动化分拣中心、无人机、室内接驳机器人和无人配送车已经进入主流包裹运营，而不是困在实验室。重要的分析约束在于，需求量不等于 robovan
              收入。公开证据支持一个巨大的包裹经济、一个庞大的物流自动化邻近市场，以及快速增长的全球配送机器人和配送无人机市场；但它并不支持一个干净的“中国单一 robovan
              TAM”。因此，本章保留基于代理指标的测算，并明确列出证据缺口。
