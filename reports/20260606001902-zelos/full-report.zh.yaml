      - number: '6.3'
        title: 采购、商业化模式与 Cainiao / Alibaba 渠道
        blocks:
          - type: paragraph
            body: >-
              Zelos 似乎不依赖单一商业化模式。Jiemian 的 ADS-center
              报道显示，公司正有意拓宽采购选项，覆盖直接销售、租赁和全托管运营；这符合一个现实市场：部分客户不想拥有车辆，也不想承担运营负担。新加坡客户验证支持这种解读：SingPost
              的谅解备忘录（MOU）加入团队培训、种子车辆和配送业务开发，而不只是硬件供给。Cainiao 关系进一步加深了这个模式。Zelos 官方发布、Gasgoo 和 Reuters
              都描述了一项业务加股权整合：Cainiao 停止直接制造或销售车辆，Zelos 运营两个品牌，Cainiao 品牌聚焦物流场景和大型企业客户。这应有助于企业入口和国际部署速度，尤其是在 Alibaba
              生态和仓储网络内。但它也模糊了客户、股东和渠道之间的边界。尽调的关键承销问题不是 Cainiao 是否有帮助——它显然有——而是未来多大比例的销量会依赖一个由生态控制的场景漏斗。
