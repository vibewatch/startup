              称社会接受度在提高，但地方规则、安全人员配置、合作伙伴培训和合规运营仍要求车辆周围有大量人工系统支撑。基于证据的下行情景不是抽象假设：IP 正式升级、严重公共道路事故、路权放缓，或无法摆脱对 Cainiao
