  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与破坏投资逻辑的框架
        blocks:
          - type: paragraph
            body: >-
              公开记录支持对 Zelos 的风险层次做清晰排序。第一类是监管与法律：中国无人配送车的全国规则仍不完整，各城市路权和保险义务仍是决定性因素，新加坡扩张仍需审批，JD
              的知识产权指控在一手公开文件中仍未解决。第二类是合作伙伴和客户依赖。Cainiao 的资产加现金整合无疑提升规模和场景入口，但也在中国邮政 7,000 辆招标看起来足以形成重大交付负担的同时，把 Zelos
              拉得更接近单一生态的优先级。第三类是资本强度和经营杠杆：公开来源描述了 25,000+
              已部署车辆、多工厂制造，以及只有在更大车队规模下才可能盈亏平衡，这意味着路权或利用率一旦不及预期，缓冲很小。第四类是运营安全和执行。行业层面的法律报道显示，事故、隐私和远程安全责任仍在公共道路上被逐步厘清。因此，正确的投资判断不是否定
              Zelos 的牵引力，而是把监管、平台、集中度和 IP 尽调视为决定投资逻辑的事项，而非附带问题。
