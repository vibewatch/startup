              Ventures 参投。Reuters 衍生的 U.S. News 报道在 2026 年 1 月增加了一个战略变量：Cainiao 将把自动驾驶业务和现金注入 Zelos 换取股权，但不取得控制权；Wall
              Street Journal 称该 robovan 业务估值约 $2 billion。多家 2026 年 2 月二级媒体随后称，公司新融资超过 $300 million，估值高于 RMB 10 billion，约
              $1.4 billion。媒体对这个独角兽叙事的相互佐证足够多，因此不应直接否定；但准确估值机制仍停留在二级报道，而非留存的一手融资文件。第 1 章因此可以支持“大额后期融资 + Cainiao
              战略关系”的判断，同时明确保留股权结构表、投后估值、治理权利和所有权不确定性。
