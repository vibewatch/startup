    type: flow
    layout: wide
    summary: Zelos 部署遵循分阶段的物流自动驾驶流程：先做路线资质判断，再进入有人监督，最后走向无人驾驶运营。
    approximationNotes: 流程反映保留的新加坡和马来西亚运营模式，并不覆盖每一个全球部署。
