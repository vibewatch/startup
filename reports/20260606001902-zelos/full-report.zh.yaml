              的资产注入同样重要，因为它比普通创投背书信号更强：一家大型物流平台选择合并，而不是继续内部推进。反向逻辑同样关键。几乎所有支撑估值的事实都来自公司、合作伙伴或二级媒体，而非审计材料。WeRide 和 Serve
