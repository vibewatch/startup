            body: >-
              财务结论是复杂的：只有在管理层配合下才具备可投性。Zelos
              的公开部署验证、融资历史和企业客户证据已经足够多，零收入或纯宣传故事并不可信。公司显然通过车辆销售或租赁、服务与维护、渠道或车队运营支持的某种组合变现。它看起来也明显资本密集：产品偏重硬件，维护义务明确，全国服务网络庞大，媒体讨论工厂和年产能，2026
              年围绕 Xinghui
              的文件又指向上游供应链布局，而不是纯外包模式。但承销阻塞点仍然严重。留存信源没有披露收入、ARR、毛利率、烧钱速度、现金跑道、债务或客户集中度；即便是反复出现的估值标记，也仍是媒体层面，而不是融资文件层面的证据。反向覆盖同样重要。Taibo
              关于 JD 知识产权的报道具有实质性，因为它把法律不确定性直接连到估值和 IPO 资格。因此，投资人可以承销 Zelos
              已具规模、已融资且仍依赖资金；但仅靠公开来源，还不能有把握地承销收入质量、利润率路径或资本充足性。
