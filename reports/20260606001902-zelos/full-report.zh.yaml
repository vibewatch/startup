      - number: '5.2'
        title: 自动驾驶技术栈与安全架构
        blocks:
          - type: paragraph
            body: >-
              与许多私营自动驾驶物流同行相比，Zelos 发布的自动驾驶技术栈更具体；但架构主张与正式安全案例披露之间仍不均衡。公司官网和关于材料一贯描述一套无图、自研、全栈 L4
              系统，从车辆工程到自动驾驶软件均由内部构建。技术模块更具体：一个模块称感知栈融合激光雷达、毫米波雷达、摄像头和超声波传感器，以毫米级精度形成 360°
              感知；另一个模块称新一代端到端模型使用鸟瞰视角（BEV）表征，联合建模道路、车辆和行人，同时去除对高精地图（HD map）的依赖；第三个模块称车载 L4 计算单元功耗低于 100
              W。合作伙伴信源加深了硬件视角。Hesai 称 2024 年 Z5 使用 4 颗 AT128 长距激光雷达；Seyond 后来称更新的 E6 使用 2 颗 Lingque W
              激光雷达，加上毫米波雷达、超声波雷达和多摄像头感知。运营侧，DHL 新加坡部署加入高级导航、实时监控、内置安全协议和仓储管理系统（WMS）集成；SingPost
              扩大合作则明确覆盖车队监控、管理、维护和培训。这足以判断 Zelos 销售的是一套物流自动驾驶运营系统，而不只是 AV
              套件。仍缺失的是硬承销层：留存信源没有公布最高速度、制动距离、MTBF、脱离接管、远程运营人车比，或公开的 ISO 26262 / SOTIF / ISO 21434 类保障材料。因此，第 5
              章可以支持可信的技术栈叙事和具体安全机制，但不能支持完整的公开安全案例。
