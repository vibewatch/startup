      - number: '1.2'
        title: 创始人、管理层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开管理层证据有方向性价值，但并不干净。QCC 将崔啸列为苏州运营实体的法定代表人和执行董事，将孔琪列为经理；DHL 发布则称 Sean Zhang 是联合创始人兼 COO。2026 年 4 月 Zelos 与
              SingPost 合作发布又将 Sean Zhang 描述为 Co-Founder & CEO, Global Business，并将 Terry Zhou 描述为 Managing Director,
              Zelos Singapore。China Daily 另将庄莉列为联合创始人，Taibo 称庄莉、孔琪、朱伟成此前来自 JD
              自动驾驶车辆团队。这些信息还拼不出一张干净的当前组织架构图。更合理的解读是：创始团队延续，区域运营领导层也可见，但角色标签会随注册、合作伙伴和媒体来源而变。尽调中更大的问题是治理不透明：留存信源没有给出当前完整董事名单、观察员权利、持股拆分，或
              Cainiao 交易 / 2026 年 2 月融资后的控制结构。这意味着，单靠公开证据，可以把公司描述为与创始人相关、运营可见，但还不能称为治理透明的后期公司。
