            body: >-
              Zelos
              已不再是轻量软件投资逻辑。公开来源描述的是一个拥有数万辆车、多座工厂、激进产能目标、国际扩张计划的业务；其模式看起来仍需远大于当前的车队规模，才可能在计入研发后完全盈亏平衡。因此，资本效率和组织执行成为核心风险。Jiemian
              的访谈材料显示，公司试图同时扩产、降单位成本、保持高速增长，还要整合 Cainiao 并开拓海外市场。Sohu 和 21jingji
