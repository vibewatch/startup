  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Zelos 的核心下行情景穿过审批、平台集中度、法律升级和工厂利用率；每一项都可能直接拖慢部署节奏、削弱融资议价力，并压低估值支撑。
    data:
      nodes:
        - id: R1
          label: 本地规则 / 路权延误
          detail: 城市和国家级审批慢于商业计划。
          tone: risk
        - id: R2
          label: China Post 或关键大客户爬坡失手
          detail: 大型项目的利用率、回款或服务水平不及预期。
          tone: risk
        - id: R3
          label: Cainiao 战略转向
          detail: 整合后，平台优先级、品牌或场景入口发生变化。
          tone: risk
        - id: R4
          label: JD 案件升级
          detail: 警方备案演变成正式诉讼、禁令或 IPO 披露负担。
          tone: risk
        - id: R5
          label: 安全事故 / 暂停运营
          detail: 严重公开道路事件触发调查或运营暂停。
          tone: risk
        - id: R6
          label: 部署节奏放慢
          detail: 实际启用的车辆或路线少于增长叙事暗示。
          tone: risk
        - id: R7
          label: 工厂利用率走弱
          detail: 产能、质保和服务网络跑在盈利需求前面。
          tone: risk
        - id: R8
          label: 融资议价力走弱
          detail: 新资金成本上升，或到账延后。
          tone: risk
        - id: R9
          label: 估值支撑被压缩
          detail: 增长和护城河叙事撑不起此前估值。
          tone: risk
      edges:
        - from: R1
          to: R6
          label: 获批路线更少
