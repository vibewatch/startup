      - number: '2.3'
        title: 买方分层与工作流经济账
        blocks:
          - type: paragraph
            body: >
              买方地图由工作流牵引。邮政和快递运营商采购自动驾驶物流，是为了守住包裹吞吐量和末端经济性；平台运营商采购，是为了压低配送费，并把自动化运力接入既有数字网络；生鲜杂货和供应链运营商采购，是为了在场站之间移动托盘货或箱货；大型跨境或合同物流运营商则通常先在受控设施中测试，再寻求公开道路审批。因此，同一套技术栈卖向两种不同预算逻辑：末端接驳通常靠包裹经济性和劳动力替代来证明；中段和场站转运则靠路线可靠性、DC
              生产率和车辆利用率来证明。


              证据显示，买方最关心的是服务成本和公开道路准备度，而不是抽象的自动驾驶分数。SingPost 将公开道路部署定义为降低末端成本的杠杆。FairPrice 和 DHL
              都把采用自动驾驶车辆（AV）与配送中心之间的货物流转、减少人工重复任务联系起来。KR-Asia 和 36Kr
              报道称，无人车在某些场景下可将单包裹成本减半，显著降低客户运营成本，并在部署成熟后减少远程人工占比。产品规格也说明为什么不能混淆末端和中段：Zelos 的 Z5 是更小的城市配送主力车型，Z10
              则进入更重、更长里程的中段货运。这种分层很重要，因为车辆类别一变，买方、路线和 ROI 门槛都会随之改变。
