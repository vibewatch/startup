  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与场景地图
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Zelos 卖进的是工作流，而不是单一狭窄客户原型。最干净的分层是：邮政和快递运营商、生鲜杂货和零售供应链、合同物流或工业运营商，以及能大规模转售或运营车辆的生态渠道。Zelos
              自有页面反复强调末端包裹、零售、园区、工业园区、内部物流和医药场景；第三方报道又把地图扩展到生鲜食品、乳品、电子、粮油运输、轮胎、汽车零部件和酒店布草物流。买方、用户和付款方也会随分层而变：邮政网络和快递运营商关心场站到驿站接驳和路线密度；零售商关心配送中心转运和货架可得性；工业枢纽关心封闭场景堆场生产率；渠道伙伴关心如何在许多终端账户上标准化车队与服务层。这种场景优先的框架很重要，因为它解释了
              Zelos 为什么能在校园、社区、工业园区和物流枢纽展示验证，而不意味着它拥有一个同质化客户基础。
