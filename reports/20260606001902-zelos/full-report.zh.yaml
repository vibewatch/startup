      - number: '6.2'
        title: 具名部署与公开采用验证
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户验证集中在新加坡和邮政物流。FairPrice 提供了最清晰的近生产级公开道路参考：客户新闻稿称其获得 LTA 批准，签署 2025 年合作协议，并计划为配送中心转运增加接近 30 辆 Zelos
              车辆。SingPost 是最好的耐久性代理指标，因为双方都描述了一条序列：从 12 月以来的枢纽试验，到 2026 年扩大谅解备忘录（MOU），重点转向公开道路商业化、车队管理和配送业务开发。DHL 和
              Infineon 展示了另一种模式：厂内部署，并有定义明确的第二阶段通往公开道路和更多客户运营。新加坡之外，Pos Malaysia 仍处于概念验证（PoC）模式；KEZAD
              则是工业枢纽部署，不是广泛公开道路网络。China Post 是另一个极端：采购规模大，但关于实际利用率和经济账的公开披露有限。因此，本章支持真实采用验证，但验证强度会因客户和成熟阶段而大幅不同。
