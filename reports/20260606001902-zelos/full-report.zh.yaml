      - number: '7.2'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              中国无人配送政策总体支持，但还没有完全常态化。Xinhua 和 CCTV 都把核心问题指向法律地位尚未完成：地方试点规则承担了大部分实际工作，全国层面的资质、责任和车辆分类仍未敲定。这一点很关键，因为 Zelos
              要扩的是跨城市、跨境车队，不是单一区域演示。北京和深圳的地方规则要求保险、监控、应急响应和指定路线控制；全国标准制定仍围绕安全、网络安全和运营条件推进，而不是已经给出一套稳定的全国制度。新加坡商业前景更好，但在一个关键法律点上相似：FairPrice、SingPost、DHL
              和 Zelos 自身都描述了一条分阶段路径，更大规模的公共道路部署仍取决于审批。第二条法律线索是 JD 的投诉。Taibo 和 QQ News 称，JD 已向公安报告疑似 IP 侵权，事项仍在调查；36Kr
              认为，正式升级可能对 IPO 节奏构成重大影响。这并不证明存在不当行为。但它说明，Zelos 进入任何融资或上市流程时，都带着一项未解决、指控具体、潜在严重度较高的法律悬而未决事项。
