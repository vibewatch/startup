      - number: '5.4'
        title: 制造、供应商依赖、路线图与开放缺口
        blocks:
          - type: paragraph
            body: >-
              相比一般机器人创业公司，Zelos 的制造成熟度证据更强，但下一代平台路线图仍只部分透明。官方里程碑记录称，首个原型车在 2022 年 5 月推出，用于验证自动驾驶系统和硬件；Z5 在 2023 年 6
              月开始量产；全场景 Z 系列平台在 2024 年 6 月发布。这些里程碑，加上 Hesai 和后续 Seyond 的供应商公告，支持其生产项目真实存在，而不是停留在实验室原型。Cainiao
              整合随后把故事推过了单纯车辆 OEM：Zelos 称 Cainiao 注入 RoboVan 业务、进入股东名单，并贡献管理、制造、运营以及 VLM / 世界模型研究能力。官方材料还称，L 系列车型和 L4.5
              技术在 2025 年 9 月发布；36Kr 则描述了一个正在形成的三分支组合：Z 面向标准产品，E 面向更轻、更低成本用例，L 面向更重载需求。问题是，最新分支还没有像当前 Z
              目录那样被清楚记录。公开来源也显示传感器栈在演进，而不是一份稳定物料清单（BOM）：2024 年 Z5 使用 4 颗 Hesai 激光雷达，合作伙伴对 E6 的报道突出双 Seyond 激光雷达，2026 年 3
              月一篇媒体称最新一代 RoboVan 阵容将标准化使用 200,000 颗 Hesai
              激光雷达订单。这并不推翻路线图，但会产生关于配置管理、供应商集中度，以及不同市场是否使用不同硬件代际的尽调问题。公开专利可见度也很薄：留存信源没有列出专利号或技术论文。因此，路线图可信，但若没有更深入的工厂、BOM
              和安全文档，仍无法充分承销。
