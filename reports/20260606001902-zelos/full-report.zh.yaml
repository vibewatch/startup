  - id: TV002
    title: 正反投资逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正向逻辑：Zelos 作为私有无人配送车公司，已经具备少见的实物规模
        - 官方与合作伙伴来源支持 20,000–25,000 辆车队、国际部署，以及新加坡公路运营
        - 若经审计利用率、单车收入和毛利率证明规模有经济性，而不是宣传性，置信度会提高
      - - 正向逻辑：Cainiao 背书比普通创投品牌更有分量
        - Cainiao 注入资产和现金，而不只是跑少数股权试点关系；2026 年 2 月报道将其描述为战略组合
        - 如果股东和排他性条款显示 Zelos 保留有意义的独立经济性，而不是充当受控渠道载体，判断会改善
      - - 正向逻辑：公开自动驾驶可比公司显示，投资人仍愿意为稀缺资产承受高倍数
        - WeRide 和 Serve 都以高收入倍数交易；Nuro 和 Starship 则显示行业龙头仍能获得资本支持
        - 如果 Zelos 能证明收入质量接近公开可比公司，而不只是资产或车队规模，这一点会更强
      - - 反向逻辑：2026 年 2 月的确切估值文件支撑偏弱
        - 留存来源在 >RMB 10B 叙事和另一个 ~$2B 战略业务引用之间不一致
        - 如果管理层披露条款清单、投后股权结构表和投资人名单，担忧会大幅下降
      - - 反向逻辑：经济性可见度仍太薄，不足以下买入结论
        - 没有留存来源披露当前收入、ARR、毛利率或单位经济性
        - 只有尽调显示收入规模和健康的路线级经济性，空头情景才会缓和
      - - 反向逻辑：法律和执行悬而未决风险会快速压缩倍数
        - JD 知识产权指控和仍在变化的 IPO 路径，会在商业化或披露摇摆时带来不小下行
        - 如果律师证明问题已关闭，且 IPO 准备材料体现公开市场纪律，风险会缓解
    notes: 本表把真正支撑估值的因素，与仍依赖隐藏财务或法律证据的因素分开。
    claimRefs:
