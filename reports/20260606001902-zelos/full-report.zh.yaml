  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 中国直接运营商与同类分层
        blocks:
          - type: paragraph
            body: >-
              中国直接竞争场并不是一组同质化同行。Zelos 把自己定位为全球 RoboVan 平台，拥有超过 25,000 辆自动驾驶物流车、超过 100 million 公里，并在 20+ 国家和 350+
              城市运营；在本信源集中，这比其他任何披露的 robo-van 车队都大。最接近的同类竞争来自 Neolix/New Stone 和 White
              Rhino，两者都销售面向高密度城市物流的专用自动配送车辆。Neolix 声称已部署超过 15,000 辆车，采用 RoboVan 即服务模式，并拥有密集的青岛标杆车队；White Rhino 则强调与
              Huolala、SF Same-City 在同城生鲜杂货、商超和即时配送中的运营。Cainiao Xiaomanlv 和 JD Logistics
              在结构上不同，但战略上重要，因为它们把自动驾驶与既有包裹或电商基础设施结合起来。Cainiao 已声称具备 L4 公开道路能力、7x24 服务，并已配送超过 10 million 个包裹；JD
              则展示过应急末端部署、室内医院机器人，以及以数百万台机器人、车辆和无人机计量的采购计划。WeRide 只应在更重的公开道路货运基准中放入直接竞争集：其 Robovan W5
              在载荷和续航上更像卡车，而不是园区或人行道机器人；但它证明了另一家中国自动驾驶公司正在用上市公司披露口径，在公开道路上商业化城市物流。
