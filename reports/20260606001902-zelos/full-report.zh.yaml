      - number: '3.3'
        title: 监管入口与渠道权力
        blocks:
          - type: paragraph
            body: >-
              公开证据中最重要的竞争模式是：渠道所有权和监管入口往往比单独的自动驾驶软件更重要。Cainiao 把 robo-van 研发与驿站密度、园区流量和更广的电商物流基础设施结合起来；Zelos 自己也称
              Cainiao 注入 RoboVan 业务并成为股东，这能帮助分销，但也带来平台依赖问题。JD
              拥有更大的物流网络，且已经展示公开道路配送机器人、室内医院机器人，以及规模远超专业供应商披露的自动化采购计划。Meituan 不是直接 robo-van
              供应商，但它最能证明中国物流既有企业可以把监管审批变成结构性护城河：到 2025 年 4 月，它已拿到中国首张全国低空物流运营证书，此前已建设 53 条航线并完成超过 450,000 次配送。AutoX 和
              DeepRoute.ai 重要，是因为它们展示了邻近自动驾驶技术栈，拥有许可、OEM 支持或量产智能驾驶部署；一旦商业账跑通，它们可能切入物流。对 Zelos 而言，含义是：在中国取胜很可能不只需要强
              robo-van 技术，还需要特权路线入口、订单聚合能力，以及能对上 Cainiao、JD 或 Meituan 内嵌优势的运营伙伴。
