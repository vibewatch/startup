        title: 合作伙伴依赖、运营与安全
        blocks:
          - type: paragraph
            body: >-
              Zelos 最强的商业证明也凸显了依赖风险。Reuters 和中文媒体一致认为，Cainiao
              不只是被动投资者：它贡献资产、整合团队、授权品牌，并把大客户和物流场景能力放进合并结构。这会帮助拿到路权、扩大数据规模和推进海外落地，但也让 Zelos
              更暴露于单一生态的资本配置、平台优先级和战略转向。客户集中度同样真实，却难以量化。中国邮政 7,000 辆订单被描述为该细分市场最大采购，第三方报道称 Zelos
              将承担新增产能的大约一半。SingPost、FairPrice 和 DHL 是可信的海外背书，但三者都是分阶段项目，不是已披露的长期收入型合约。运营上，公司试图让无需高精地图的 L4 车辆跑进 300+
              城市、20+ 国家和越来越多锚定客户。行业法律报道确认，开放道路事故、隐私处理、应急响应、路线合规和远程安全责任仍是现实议题。保留的一手记录还不能证明公司层面的安全模式，但 36Kr
              报道的事件已经足以要求尽调历史出险记录、人工接管和根因控制，再把车队规模当作纯粹优势。
