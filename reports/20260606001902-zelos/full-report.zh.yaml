      - number: '2.2'
        title: 政策、试点区与部署成熟度
        blocks:
          - type: paragraph
            body: >
              中国政策图景正从试验走向更标准化的商业化，但部署仍高度取决于路线所在区域以及哪个监管方拥有管辖权。苏州和更广义的江苏引领当前地面配送运营；北京高级别自动驾驶示范区则正在成为大规模公开道路准备度的标杆。到 2025
              年，北京已向 33 家公司发放许可，覆盖约 900 辆车和超过 32 million 自动驾驶测试公里；北京还计划将示范区扩至约 3,000 平方公里。北京 2025 年 4
              月生效的新自动驾驶车辆条例，明确为包括物流在内的城市运营服务打开道路应用试点路径。


              国家政策也在托底。2026
              年政府工作报告将低空经济列为新兴支柱产业，这一点重要，因为中国越来越把自动驾驶物流视为一个生态系统问题，涉及道路、场站、无人机、车路云基础设施和产业标准，而不是单一狭窄品类。尽管如此，信源包显示商业化仍具有明显地域属性。北京试点路径、江苏早期立法和
              Meituan 全国低空证书的存在，是政策摩擦下降的强证据；但它并不意味着全国公开道路部署已经开箱即用。投资人应把地理位置和路线准入作为硬市场过滤器，而不是行政细节。
