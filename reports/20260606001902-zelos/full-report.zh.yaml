      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Zelos 在公开记录中确有差异化：声称覆盖广泛的车队足迹、多国运营、专用 robo-van
              产品线，以及比多数中国私营专业公司披露更宽的公开道路加封闭道路部署表述。这一点重要，因为许多竞争者要么聚焦更窄的运营域，例如 White Rhino 的零售同城场景；要么处于不同自动驾驶类别，例如 Meituan
              无人机、AutoX robotaxi、Gatik 中段卡车。耐久性问题在于，Zelos 能否把产品和规模主张转化为可防守的入口。公开证据指向四个主要风险。第一，Cainiao、JD、Meituan
              的既有分销权力会压缩独立车辆供应商的价值。第二，几乎所有同行的准确客户定价和实际经济账仍不透明，因此市场仍缺少硬证据来判断谁能盈利地大规模运营 robo-van。第三，今天文档最充分的全球规模基准是
              Starship 和 Serve，它们运行的形态比 Zelos 更轻、地理围栏更强。第四，Nuro
              的降估值融资和授权转向说明，资本强度会迫使资金充足的先行者也重新定义商业化模式。因此，本章支持一个克制结论：Zelos 看起来具备竞争可信度；但若没有更清楚的胜负数据、定价证据，以及
              Cainiao、监管方和企业客户如何塑造经常性需求的直接披露，其护城河还未被公开证明。
