  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品家族与客户工作流匹配
        blocks:
          - type: paragraph
            body: >-
              Zelos 当前官方产品界面围绕物流专用 RoboVan 变体展开，而不是单一通用自动驾驶厢式车。CMS 支撑的产品目录列出 5 个当前命名的 Z 系列 SKU：Z5、Z5-Cold Chain、Z5
              Multiple Locker、Z10 和 Z10-Cold Chain，每个都对应不同工作流和载荷画像。较小的 Z5 面向城市和园区配送、逆向取件和接驳运营；Z10
              切入更重的中段或场站转运工作；冷链和多柜变体则把同一套自动驾驶底座改造为温控或多点末端配置。场景层同样由工作流驱动。Zelos 公开解决方案材料将平台映射到
              FMCG、医药、商务园区、包裹和零售补货任务；合作伙伴详情卡还加入 Yum 门店补货、Sinopharm 医院园区配送、DHL 仓储物流和 FairPrice
              公开道路托盘转运等具名运营案例。最重要的承销区分是各产品分支成熟度。Z 家族有清楚的公开规格和最强部署验证。相比之下，36Kr 和供应商页面指向更新的 E 系列和 L 系列分支，但这些新线在 Zelos
              自有产品目录中的文档还不充分。因此，第 5 章的正确解读是：Zelos 已拥有面向 B2B 物流的真实且差异化 RoboVan 组合；但投资人应把成熟、规格可见的 Z 家族，与更新的 E/L
              路线图分支分开看，后者的准确配置、经济账和认证状态还没有同等透明。
