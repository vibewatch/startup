      - number: '3.2'
        title: 运营模式与全球基准对比
        blocks:
          - type: paragraph
            body: >-
              全球基准集主要用于对比运营模式，而不是做一一对应的中国替代。Starship 和 Serve 证明自动配送可以达到公开规模，但证据最强的场景在人行道、校园或严格地理围栏内，而不是更重的公开道路
              robo-van。Starship 披露超过 10 million 次配送和 2,700+ 台机器人；Serve 披露数万次配送，并签下在 Uber Eats 上部署最多 2,000 台机器人的计划。Nuro
              是最清晰的警示基准：公司仍报告多年无人驾驶部署和超过 1.7 million 自动驾驶英里，但其 2025 年融资估值下调，同时从运营纯货运车辆转向授权自动驾驶技术。Gatik
              不在末端配送内，但仍然相关，因为它展示了另一条企业采用路径：在可重复中段路线提供自动驾驶运输即服务，并结合深度利益相关方沟通和结构化安全验证。对照这些基准，Zelos 更不像一个消费者 App
              网络，更像一个多场景 robo-van
              平台；它仍依赖定制化企业打包，而不是透明的标价。公开来源揭示了服务模式、载荷范围和支持结构，却没有给出干净的可比合同经济账，因此能力和渠道入口比毛利率或实际成交价格更可观察。
