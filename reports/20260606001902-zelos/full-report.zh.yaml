companyProfile:
  summary: >-
    Zelos 是一家源自中国的自动驾驶物流公司，核心围绕 Jiushi (Suzhou) Intelligent Technology Co., Ltd. 展开；公司 2021
    年在苏州工业园区成立，并通过有分量的新加坡运营足迹推进国际商业化。公司为包裹、零售、邮政、工业园区和中段物流场景销售并部署专用 L4 robo-van 以及相关车队运营服务。公开证据支持其已有真实规模和客户验证——包括
    SingPost、FairPrice、DHL、据报道的 China Post 订单，以及一笔具有战略意义的 Cainiao 资产加现金交易。仍然不透明的是 2026 年投后估值的准确口径、股权结构表、董事会 /
    控制结构，以及当前收入或利润率情况。
