  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价可见度与商业化动作
        blocks:
          - type: paragraph
            body: >-
              留存记录中的 Zelos 并不像一家纯软件公司。最清晰的变现证据来自注册经营范围、投资人沟通和部署公告的组合。Qichacha 和 Aiqicha 显示，其经营范围包括 AI 软硬件、IoT
              设备、车辆和设备租赁、电池与充电设备销售，以及相关物流服务。Blue Lake 2025 年 4 月融资说明更进一步，明确描述了“交钥匙车辆销售 + 全生命周期运营维护”模式；后来的 Sohu/Cyber-car
              文章则称，Zelos 早期先推低成本硬件加软件分期，产品更成熟后又回到固定价格销售。缺失的信息同样重要：留存的官方产品页、合作伙伴页或融资页都没有披露 Z5、Z10
              或企业服务包的公开标价或标准合同金额。商业化动作也更像企业销售，而不是自助式购买。SingPost、FairPrice、DHL 和 China Post 都指向大客户部署或采购项目；Blue Lake 的 B4
              说明又加入全国经销商和服务商网络，这更像渠道化工业销售，而不是 App 式订阅获客。
