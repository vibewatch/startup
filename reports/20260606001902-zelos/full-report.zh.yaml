      - number: '5.3'
        title: 部署模式、车队运营与运行设计域
        blocks:
          - type: paragraph
            body: >-
              Zelos 的运行设计域（ODD）叙事最好理解为从受控或私有物流环境，分阶段扩展到指定公开道路货运路线；新加坡是最清晰的模板市场。客户和官方材料反复呈现同一模式。DHL 第一阶段是在 Asia Pacific
              Advanced Regional Centre 内部做厂内移动，第二阶段才扩展到公开道路，且仅在监管批准后推进。FairPrice 2024
              年试点同样从带安全车的测试驾驶，推进到无随行安全车的第二阶段；Zelos 自己 2025 年 10 月新闻称，为期一年的试点实现零接管、零事故，随后计划近 30 辆 Z10 规模化推出。SingPost
              又增加一道阶段门：先做枢纽运营和培训，再进行公开道路无人驾驶部署，并明确车队管理和维护角色。Malaysia 的 Pos Malaysia PoC 则从 National Mail Centre
              起步，之后才可能走向更广运营或公开道路推出。这些部署背后的工作流细节很重要。Zelos 解决的是重复 B2B
              物流任务——配送中心到配送中心（DC-to-DC）托盘转运、仓库物料移动、包裹接驳、医药园区补货和园区物流——而不是泛化城市自动驾驶。这种聚焦很可能把 ODD
              缩窄到结构化货运路线：装载模式可重复，并有运营监督；这对商业化是优势。它也意味着，投资人应把公开道路自动驾驶承销为路线合格、依赖监管的能力，而不是随处可用的城市驾驶产品。真正的产品是车辆加调度、车队监控、培训和合规推进。
