  - id: TV005
    title: 投资逻辑破裂触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 隐藏下轮经济性
        - 一手文件显示，2026 年 2 月价格在完全稀释口径下显著低于 RMB 10B，或包含沉重清算优先权
        - 这意味着公开独角兽叙事高估普通股价值
        - 将交易重新定价到悲观区间，或退出
      - - 变现缺口
        - 未提供经审计 2024–2026 收入桥，或路线级利润率证据
        - 没有变现证明的车队规模，不应获得溢价估值
        - 财务尽调完成前暂停流程
      - - China Post 或 Cainiao 规模未能转化
        - 已宣布的大项目无法对应到确认收入、复购或健康单位经济性
        - 对外强调的规模逻辑会很快失去估值支撑
        - 从基准情景转向悲观情景
      - - 法律升级
        - JD 相关 IP 争议实质推进、产生禁令风险，或扩展为更广泛索赔
        - 法律不确定性会拖慢 IPO 节奏，并压缩战略买家意愿
        - 暂停尽调，继续前先索取律师备忘录
      - - IPO 滑坡
        - 报道中的香港 IPO 路径停滞，或投行要求显著降价
        - 退出可选性是乐观情景的一部分，滑坡会削弱溢价逻辑
        - 移除乐观情景承销，并收紧入场价格
    notes: 这些是硬性停顿触发项，不是普通观察项；一经确认，每项都应改变价格纪律或停止流程。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV020
      - CV036
      - CV041
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 经审计 2024–2026 收入、递延收入和客户集中度
        - 不能只靠车队规模承销估值
        - 索取管理账和审计师勾稽
      - - 利润率和单位经济性
        - 按车型划分的毛利率、贡献利润率、在线率和路线经济性
        - 需要把部署证明转成可持续倍数
        - 核查路线级队列和毛利瀑布
      - - 轮次条款与股权结构表
        - 2026 年 2 月融资的条款清单、优先权堆栈、稀释和董事会权利
        - 名义独角兽标题仍可能隐藏普通股经济性偏弱
        - 检查法律文件和完全稀释持股表
      - - Cainiao 协议
        - 排他性、客户归属、收入分成和品牌授权条款
        - 决定 Cainiao 是护城河，还是依赖折价
        - 核查股东协议和商业协议
      - - China Post 项目
        - 7,000 辆订单对应的 ASP、部署排期、验收测试和经常性软件 / 服务收入
        - 如果经济性真实，这是公开记录里最干净的大量级证明点
        - 获取合同排期和收入确认政策
      - - 法律状态
        - JD IP 指控的律师备忘录、索赔状态和补救计划
        - 法律风险会改变融资意愿和 IPO 准备度
        - 索取外部律师尽调备忘录和管理层回复
    notes: 每项要求都直接对应可能移动估值区间、投资建议或可接受入场价格的决策变量。
    claimRefs:
      - CV016
      - CV017
      - CV018
