      - number: '2.4'
        title: 竞争结构、壁垒与测算缺口
        blocks:
          - type: paragraph
            body: >
              中国自动驾驶物流市场已经不再是一家公司对应一个场景。当前竞争结构包括 Zelos、Neolix、White Rhino 等专业 robovan 公司；Cainiao、JD、Meituan 等平台支持的运营商；以及
              2025 年后切入的汽车或供应商邻近玩家。Cainiao 决定把自动驾驶业务注入 Zelos，说明分销能力和路线入口可能与车辆硬件同样重要。China Post 的 7,000
              辆车订单同样表明，大额采购轮次可以迅速把销量集中到有规模的供应商手中。


              壁垒同样真实。公开道路商业化仍取决于试点许可、路线资质、远程运营经济性，以及恶劣天气或冷启动表现。Taibo 关于 JD
              知识产权投诉的叙述增加了第二类壁垒：在一个创始团队和工程师不断从大型既有企业流动的市场里，法律和商业秘密风险不能忽视。信源包还保留了一个更日常但重要的分析问题：公开来源并不认同 Zelos
              当前车队规模，合作伙伴材料称已部署超过 20,000 辆车，产品页称活跃车辆超过 25,000 辆。再叠加没有干净公开的中国单一 robovan
              TAM，估值工作应通过多个代理指标和明确尽调问题来承销采用率，而不是靠一页头部市场规模幻灯片。
