          note: 完全认可据报战略业务估值
        - label: WeRide 2026 年 6 月上市市值
          value: 2170
          note: 有持续披露节奏的中国自动驾驶上市锚点
    approximationNotes: 柱状图以百万美元展示，意在围绕据报战略估值框定价格敏感性，而不是暗示 Zelos 披露了收入倍数。
    claimRefs:
      - CV005
      - CV014
      - CV022
      - CV037
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Zelos 的悲观、基准和乐观估值区间，来自战略估值折扣、上市可比公司区间和披露置信度。
    data:
      items:
        - label: 悲观情景
          low: 700
          mid: 850
          high: 1000
          note: 规模跑出来但经济性较弱，隐藏条款拉大折扣
        - label: 基准情景
          low: 1100
          mid: 1350
          high: 1600
          note: RMB 10B 叙事方向正确，但相对更高战略估值仍需折价
        - label: 乐观情景
          low: 1800
          mid: 2100
          high: 2400
          note: 战略估值、China Post 推进和 IPO 准备度都经得起尽调
    approximationNotes: 数值单位为百万美元。由于 Zelos 不披露收入、利润率或融资条款，这些区间受证据约束，但仍高度依赖假设。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以投委会口径给 Zelos 打分，维度包括规模、战略背书、披露质量、经济性可见度、法律干净度和入场纪律。
    data:
      items:
        - label: 规模证据
          value: 4
          note: 车队和部署证据强于多数未上市无人配送车同行
        - label: 战略背书
          value: 4
          note: Cainiao 与 Ant 相关支持对分销和资本通道格外有分量
        - label: 披露质量
          value: 1.5
          note: 未公开披露收入、利润率或清晰轮次条款
        - label: 经济性可见度
          value: 1
          note: 路线级单位经济性和贡献利润率仍未公开
        - label: 可比公司支撑
          value: 2.5
          note: 可比公司组能用，但公开和私有锚点难以干净对齐，噪声很大
        - label: 法律 / 治理干净度
          value: 2
          note: JD 知识产权指控和合并后治理不透明，确实拖累估值
        - label: 入场纪律匹配度
          value: 2.5
          note: 只有带价格保护或更深入的数据室，才可操作
    approximationNotes: 评分是方向性判断工具，不是机械模型；低分更多反映披露和法律缺口，而非否定技术。
    claimRefs:
      - CV017
      - CV034
      - CV035
      - CV040
      - CV041
      - CV042
      - CV045
