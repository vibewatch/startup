  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张 / 风险
      - 支撑证据
      - 威胁来源
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 声称的规模护城河
        - Zelos 披露 25,000+ 辆车和 100M+ km，规模大于本资料集中直接同行披露的车队
        - 直接同行可能披露不足，既有玩家也可能用自有订单流抵消差距
        - 中
        - 索取按司法辖区拆分的部署结构、活跃客户数和复购留存
      - - Cainiao 渠道杠杆
        - Cainiao 既是 Zelos 股东，也是 Xiaomanlv 背后的运营方
        - 伙伴可能变成平台守门人，也可能把更多无人配送车需求内部化
        - 高
        - 索取商业条款、排他边界，以及与 Cainiao 绑定的收入集中度
      - - 中国既有玩家分发能力
        - JD 和 Meituan 把自动化接到既有包裹或消费者 App 需求上
        - 既有玩家掌握流量和线路时，捆绑方案可能胜过更好的车辆
        - 高
        - 核验 Zelos 面对包裹既有玩家和 App 绑定运营商时的赢单 / 输单记录
      - - 监管不对称
        - Meituan 持有全国性低空物流证书；WeRide 和 AutoX 的公开道路许可披露也强于多数私有无人配送车同行
        - 政策准入的复利可能快过产品差异化
        - 高
        - 索取 Zelos 按国家、城市、道路类型和运营伙伴拆分的许可清单
      - - 定价不透明
        - 公开来源很少披露无人配送车实际成交价或利润率
        - 仅凭公开证据，无法证明 Zelos 经济性优于同行
        - 中
        - 获取已签客户合同，或至少获取匿名化的部署单位经济
      - - 资本强度参照
        - Nuro 转向授权时降估值融资；Starship / Serve 则证明，更容易落地的地理围栏形态先跑出规模
        - 即便自动驾驶软件够强，自持车队仍可能很贵
