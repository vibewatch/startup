            body: >-
              公开的客户耐久性证据只能指方向，还不完整。正面证据确实存在：FairPrice 从早期合作走到获批公共道路部署；SingPost 从枢纽试点走向更广的战略合作；DHL
              把当前部署定义为第一阶段，并计划接入更多客户运营；Pos Malaysia 和 KEZAD
              则说明这套模式能落到邮政和工业出口场景。这些都是可信的扩张代理指标。缺口同样关键：公开来源没有披露合同期限、续约率、流失率、NRR、GRR、头部客户收入占比或总体客户数。也就是说，本章能支撑采用广度和渠道动能，却不能真正支撑留存或集中度安全。客户风险也不是假设。Securities
              Times 报道了多起 2026 年涉及 Zelos 品牌配送车的事件，包括碰撞和路线合规指控；如果反复发生，可能影响客户信任、部署许可和社区接受度。结论需要平衡：客户证明明显强于一面 logo
