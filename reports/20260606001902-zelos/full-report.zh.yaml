              Zelos 给自己的定位不是狭义软件供应商，而是全栈自动驾驶物流公司。官网和关于页面称，公司自研技术栈，采用无图 L4 自动驾驶，并运营面向物流场景的专用 RoboVan
              平台。公开公司材料也支持“双足迹”叙事。QCC 和苏州工业园区管委会把中国内地核心运营实体锚定为 Jiushi (Suzhou) Intelligent Technology Co., Ltd.，2021
              年成立于苏州工业园区；官网关于页面和 2026 年 4 月新加坡合作发布则显示，公司在新加坡有活跃运营地址和商业团队。规模披露很大，但不同信源并未完全对齐：当前官网称在 350+ 城市、20+ 国家运营
              25,000+ 辆车，累计 100M+ 自动驾驶公里；2026 年 4 月合作伙伴发布仍使用 20,000+ 辆车和 300+ 城市。最稳妥的判断是：Zelos
              的全球部署广度真实存在，但公司会随时间在不同页面更新头部指标，因此第 1 章应同时保留当前官方数字和 2026 年 4 月较低的佐证口径，而不是把它们压成一个虚假的精确基准。
