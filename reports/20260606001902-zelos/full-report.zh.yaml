      - CV035
      - CV040
      - CV045
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 指示性价值区间
      - 概率信号
      - 主要触发项
    rows:
      - - 悲观
        - 车队规模真实，但变现弱于暗示；法律或 IPO 风险拉大折价；条款可能保护投资人
        - 对战略标记大幅折价，对较小公开自动驾驶可比公司仅给有限溢价
        - $0.7B-$1.0B
        - ~30%
        - 收入披露令人失望，或法律 / IPO 图景恶化
      - - 基准
        - RMB 10B 报道簇方向上正确；Cainiao 支持有帮助；披露仍太薄，无法给溢价
        - 由于收入和条款仍隐藏，对更高的 $2B 战略业务引用给予中等折价
        - $1.1B-$1.6B
        - ~50%
        - 当前公开叙事保持完整，但无法转化为可审计经济性
      - - 乐观
        - Cainiao 与 China Post 规模转化为清晰经常性收入；IPO 路径或战略出售准备度实质改善
        - 接近战略标记，并有空间向 WeRide 公开市值给溢价
        - $1.8B-$2.4B
        - ~20%
        - 经审计增长、干净条款和反复拿下大客户，支持支付更高价格
      - - 概率加权中点
        - 三个区间的加权组合
        - 情景组合的中点，而不是披露价格
        - $1.35B
        - 100%
        - 仅可作为框架锚点；不能替代财务尽调
    notes: 价值单位为 USD 百万美元。各行有意锚定相对报道私募标记和公开可比区间的折价或溢价， 因为 Zelos 不披露实时收入分母。
