  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        The table covers the most defensible retained autonomy and robo-logistics valuation anchors available on
        2026-06-06—public comps with live market caps, private rounds with disclosed valuations, and the most direct
        Zelos transaction references. China robo-van peer disclosures remain incomplete.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Zelos 报道的 2026 年 2 月估值标记
        - '>RMB 10B 叙事和单独 ~$2B 战略业务引用'
        - 私募估值标记冲突
        - 本章的直接估值对象
        - 未披露收入、利润率或条款清单
      - - WeRide
        - 2026 年 6 月市值 ~$2.17B；2026 Q1 收入 $16.5M
        - 年化销售额 ~33x
        - 最接近的中国自动驾驶公开可比公司，且有持续申报节奏
        - Robotaxi 与 ADAS 混合，不是纯无人配送车运营商
      - - Serve Robotics
        - 2026 年 6 月市值 ~$0.65B；TTM 收入 $5.20M
        - 销售额 ~115x
        - 显示投资人可为稀缺自动驾驶资产给出的投机溢价
        - 收入基数很小、美国配送机器人形态，且地理围栏运营
      - - Nuro
        - 2025 年私募估值 $6B，较 2021 年下轮
        - 后期私募重估，不是公开市场倍数
        - 对资本密集型自动驾驶龙头是有用下行信号
        - 已转向授权，商业模式实质不同
      - - Starship Technologies
        - 2025 年 $50M 融资；9M 次配送；2,700+ 台机器人；累计融资 >$280M
        - 运营规模可比，没有披露估值
        - 显示自动配送能达到有意义量级，并宣称利润率为正
        - 主要是校园和地理围栏配送，而非公路无人配送车
      - - Cainiao / Zelos 战略交易
        - Reuters / WSJ 衍生报道中的无人配送车业务估值 ~$2B
        - 战略交易锚点
        - 2026 年围绕 Zelos 最直接可观察私募价格信号
        - 可能反映注入业务价值，而非干净股权价值
    notes: 可比证据混合公开市值、私募轮估值和战略交易引用，因为没有留存来源披露 Zelos 收入， 也没有能同时给出估值和分母数据的同口径中国无人配送车可比组。
