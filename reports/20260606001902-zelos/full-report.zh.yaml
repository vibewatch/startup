  - id: FM004
    title: 采用漏斗或价值链地图
    type: flow
    layout: standard
    summary: 公共道路自动驾驶物流按阶段放量：先有政策放开和路线验证，再进入买方定制合同和车队集成。
    data:
      nodes:
        - id: P1
          label: 1. 政策放开
          detail: 国家和地方政策为低空或自动驾驶物流试点打开合法路径。
          type: step
        - id: P2
          label: 2. 试点区 / 路线审批
          detail: 城市或区县对路线、车辆、安全人员和运营条件做资质认定。
          type: step
          parent: P1
        - id: P3
          label: 3. 仓站与接驳集成
          detail: 运营商把仓站、室内机器人、储物柜或人工快递员接入自动驾驶车辆工作流。
          type: step
          parent: P2
        - id: P4
          label: 4. 远程运营与成本验证
          detail: 远程人力、维护和停机时间稳定后，路线经济性会改善。
          type: step
          parent: P3
        - id: P5
          label: 5. 公共道路规模化合同
          detail: 邮政、生鲜杂货或平台客户从受控场地扩展到经常性商业路线。
          type: step
          parent: P4
        - id: P6
          label: 6. 网络集成
          detail: 平台或邮政伙伴把自动驾驶运力纳入更广的调度、采购和大客户网络。
          type: step
          parent: P5
        - id: R1
          label: 风险：监管或 IP 延误
          detail: 审批周期或未解决的法律纠纷，可能让路线无法从试点走向规模化。
          type: risk
          parent: P4
    approximationNotes: 这一路径是概括性的商业化路线，依据包括北京试点路径、苏州运营案例、Meituan 证书，以及 SingPost、FairPrice、DHL 的买方部署案例。
