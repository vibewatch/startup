            body: >-
              Zelos 的融资时间线是公开记录中支撑较好的部分之一，尽管准确累计融资额仍取决于二级摘要。Gasgoo 报道，公司 2024 年 11 月完成 $100 million B1 轮，由 CDH BAIFU 和
              Blue Lake 领投。Blue Lake 随后称，其 2025 年 4 月 B3 轮又增加 $100 million，使 Series B 融资总额接近 $300 million，Asia
              Investment Capital 和 Baidu Ventures 参投。最强的新一手类融资锚点是 Blue Lake 2025 年 10 月的 B4 文章，并由 EqualOcean 佐证；该文称 Ant
              Group 领投新一轮 $100 million，Series B 累计融资达到 $400 million。之后证据变得更具战略性、也更二级。Reuters 衍生的 U.S. News 报道称，Cainiao
              将注入自动驾驶业务加现金，不取得控制权，而 Wall Street Journal 给出的合并 robovan 业务估值约 $2 billion。2026 年 2 月媒体随后趋同于另一轮 >$300
              million 融资和高于 RMB10 billion 的估值；2026 年 4 月中国财经媒体又流传约 $600 million 的香港 IPO
              计划，但尚未确认。净结果很清楚：公司能拿到资本；但投后机制和资金已消耗情况的证据较弱。
