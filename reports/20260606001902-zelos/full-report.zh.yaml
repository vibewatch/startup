            body: >-
              公开单位经济账只有方向性而不完整，但模式一致：Zelos 销售或运营的是带明显服务尾巴的重型实物资产，而不是轻资产软件 SKU。产品页展示了 Z5 和 Z10
              的载荷、电池和续航规格，并包含示例节省计算器；但两页都明确说明，这些节省只是示例，不是保证实现的结果。更有用的运营代理指标来自合作伙伴和媒体页面。Cainiao 自有无人车页面称，该平台可将人工成本降低
              20%–30%，把单票配送成本降至 RMB0.1，并包含免费维护、高额保险和核心部件五年质保。Blue Lake 2025 年 4 月说明称，交钥匙模式将客户运营成本降低超过 50%；Gasgoo 2024 年
              11 月引用了 62% 的降幅。KrASIA 翻译的 36Kr 报道随后加入了更尖锐但仍属二级的运营代理指标：加盟商据称每辆车每月花费 RMB2,000–3,000，单包裹成本从 RMB0.2 降至
              RMB0.1。成本侧，Jiemian 关于 6 家工厂和 45,000 台年产能的报道，加上 2026 年 3 月 Xinghui materials
              投资，都强化了一点：供应链和车辆经济账至少与软件利润率同样重要。
