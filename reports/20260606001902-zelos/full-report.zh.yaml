        - 收入占比、路线占比和运营控制集中度
        - 单一生态或关联方超过尽调约定集中度阈值，且没有合同保护
        - 将业务重新定价为平台依赖型，而不是广泛分散的物流基础设施。
      - - China Post 大订单交付
        - 利用率、取消率、服务水平和现金转换指标
        - 大型标案爬坡伴随利用率偏弱、利润率稀释或回款延迟
        - 下调增长假设，并在更慢爬坡下测试营运资本需求。
      - - 安全与事故敞口
        - 严重事故频率、保险索赔、公路暂停和根因关闭时间
        - 出现严重伤害事件、反复违反路线范围，或无法提供可信损失数据
        - 在安全治理和可保性重新建立之前，视为投资逻辑破裂。
      - - 资本强度与海外扩张
        - 工厂利用率、售后负担、盈亏平衡进展和海外合规壁垒
        - 产能建设跑在订单前面，或海外智能网联车 / 数据规则实质阻断目标市场
        - 转入较慢增长下行情景，并要求新资金投入前证明现金耐久度。
    notes: 这些触发项设计成用管理层数据监控，而不是宽泛叙事更新。核心纪律是把 Zelos 最吸引人的规模信号， 转成明确的下行阈值，而不是无条件给估值信用。
    claimRefs:
      - CR010
      - CR015
      - CR020
      - CR025
      - CR034
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 在报道的独角兽价格上，跟踪 / 继续研究
        - 战略背书和规模是真实的，但 2026 年 2 月的确切价格并未被干净锚定，财务披露缺失
        - 只有带价格保护机制，或拿到更完整资料室后，才继续推进
      - - 置信度
        - 低
        - 留存来源在 >RMB 10B（~$1.4B）与 ~$2B 两套叙事之间分裂，且不披露当前收入或条款
        - 只有看到经审计收入、毛利率和股权结构表证据后，才上调判断
      - - 风险评级
        - 高
        - 资本强度、法律悬而未决风险和隐藏经济性主导承销风险
        - 在法律和变现证据改善前，将下行视为快速变化
      - - 估值立场
        - 按公开证据看，合理到偏高
        - 低到中等独角兽区间可信，但公开证据不支持在报道标记之上再给溢价
        - 没有硬证据，不要支付高于基准区间的价格
      - - 退出路径
        - 今天看，香港上市或战略出售比干净的全球 IPO 更可信
        - IPO 传闻存在，但披露质量仍落后于公开自动驾驶可比公司
        - 承销退出前，先索取上市准备度和战略兴趣证据
    notes: 本建议仅使用截至 2026-06-06 的留存公开证据；它有意对价格敏感，并折价处理收入、利润率和融资条款缺失。
