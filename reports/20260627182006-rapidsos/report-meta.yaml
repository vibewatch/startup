companyProfile:
  summary: >-
    RapidSOS is a founder-led private public-safety software company that sits between connected devices, enterprise data
    providers, and emergency-response agencies. Its commercial narrative has shifted from routing smartphone location into
    911 to operating a broader AI-enabled workflow and interoperability layer spanning HARMONY AI, UNITE, multimedia,
    mutual aid, and responder coordination. Public evidence is unusually strong on network scale and deployment momentum,
    but still thin on economics, governance detail, and cap-table structure.
  foundedDate: '2015-01-01'
  founders:
    - name: Michael Martin
      role: Founder and CEO
      background: Founder-CEO whose public origin story ties RapidSOS to a 2012 Manhattan safety scare and a 2015 company launch.
      claimRefs: [CO010, CO011]
  foundingLocation: New York City origin story tied to a Manhattan emergency experience; formal incorporation location was not independently confirmed in retained sources.
  headquarters: New York City, New York, USA
  productSummary: >-
    RapidSOS sells a public-safety data and workflow stack anchored by the Safety Network, the UNITE operator workspace,
    and HARMONY AI, routing location, video, health, alarm, and incident context from devices and enterprises into ECC,
    CAD, and responder workflows.
  customerFocus: >-
    Primary users are emergency communications centers, PSAPs, state 911 programs, and responder organizations; payer
    responsibility is split across public-safety agencies, premium modules, and enterprise/device partners feeding data into the network.
  businessModel: >-
    Mission-critical software sold through a mix of agency workflow modules, interoperability and resilience products,
    enterprise/device integrations, and channel distribution through existing public-safety infrastructure partners.
  stage: Late-stage private / growth equity-backed
  fundingStatus: >-
    RapidSOS announced a $100M Apax-led round on 2025-11-19, bringing total raised above $450M and producing the
    strongest public valuation marker above $1B. Public sources do not disclose the revenue base, liquidation preferences,
    or any secondary component needed to judge the quality of that headline valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO010, CO011, CO013, CE001, CE003, CU001, CV013]
summary:
  headline: >-
    RapidSOS has credible category leadership in emergency-response intelligence and interoperability, but the public file
    is still too thin on revenue quality and margin structure to support a buy decision at or above the latest private marker.
