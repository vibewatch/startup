  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board composition, protective provisions, and post-2025 ownership stakes for Apax and earlier investors.
    whyItMatters: Control terms determine how much founder discretion remains and whether the unicorn step-up came with governance concessions.
    diligencePath: Request the latest cap table, board observer agreements, and investor rights summary from management.
    relatedQuestionRefs:
    - QO007
    - QO010
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A reliable current employee count and geographic split across engineering, GTM, and public-safety operations.
    whyItMatters: Headcount is a core operating-scale KPI and a proxy for burn, hiring intensity, and implementation capacity.
    diligencePath: Ask management for current headcount by function and reconcile it to payroll or HRIS exports.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-mechanics
    missingEvidence: The exact post-money valuation methodology and whether the 2025 financing included any secondaries or structured preferences.
    whyItMatters: A headline unicorn valuation can mask very different economics if structure or secondaries drove the mark-up.
    diligencePath: Obtain the term sheet, investor deck, and any side-letter summary for the 2025 round.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: current-scale-metrics
    missingEvidence: A management reconciliation of the late-2025 and mid-2026 scale counters for agencies, devices, emergencies, and software integrations.
    whyItMatters: The public numbers are directionally positive but move fast enough that a diligence model should know which counters are live and which are cumulative or milestone-based.
    diligencePath: Ask management to provide dated KPI definitions for agencies, enterprises, responders, devices, integrations, and emergencies supported.
    relatedQuestionRefs:
    - QO013
    - QO019
    relatedTableRefs:
    - TO004
