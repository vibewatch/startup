company:
  name: RapidSOS
chapter:
  number: 1
  title: Company Overview
  summary: 'RapidSOS is a New York-based public-safety software company whose current public narrative centers on a November 2025 $100M Apax-led financing, a unicorn valuation signal, and a rapid expansion from emergency-data routing into a broader AI-enabled operating layer for 911 and first responders. Retained sources support strong scale claims across agencies, devices, responders, and integrations, plus meaningful milestone evidence around AT&T ESInet, Google live video, Northern911, and Total Response. The same file also shows real diligence friction: headcount and board disclosure are thin, privacy exposure is inherent to the product, and third-party monitoring still captures recent outage history.'
sections:
- id: identity-product-and-address
  title: Identity, Product, and Address Record
  body: 'RapidSOS is best understood as an emergency-response data and workflow platform rather than a generic communications vendor. The reviewed sources consistently frame the company as software that detects emergencies from people, sensors, alarms, and connected devices; fuses location, health, video, and incident context; and delivers that intelligence to public-safety agencies and responders. The most concrete corporate fact in the public file comes from RapidSOS''s own emergency-services privacy notice, which lists RapidSOS Inc. at 161 Madison Avenue in New York City. That legal notice also clarifies why the product category matters: RapidSOS may process precise geolocation, health information, device metadata, communications, and even images or video streams when enabled. In other words, the company''s identity is inseparable from a data-rich operational role inside emergency workflows. Frost & Sullivan''s 2024 award write-up reinforces the same picture by describing RapidSOS as
    a New York City intelligent safety company and highlighting RapidSOS UNITE as an AI-driven NG911 workflow platform. Together those sources support a clean one-line description: RapidSOS sells mission-critical public-safety software that routes emergency intelligence from connected devices and enterprises into responder workflows.'
