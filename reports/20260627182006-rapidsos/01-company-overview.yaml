- id: milestones-and-platform-expansion
  title: Milestones and Platform Expansion
  body: 'The strongest company-overview evidence is the milestone trail from funding into broader platform scope. November 2025 was pivotal: RapidSOS paired its Apax-led financing with claims of one billion emergencies supported and large-scale adoption across agencies, enterprises, devices, and responders. The company then kept widening the story in 2026. January brought a public push around real-time interoperability, April moved HARMONY AI inside AT&T ESInet, and June rebranded the broader architecture as the Safety Network with even larger public counters than the November funding announcement. M&A and partner moves reinforce the same direction of travel. Northern911 adds backup call-taking and mutual-aid capabilities, Total Response deepens dispatch workflow expertise, Arlo extends video verification, and Google adds live video from Android callers. None of those events proves deep monetization on its own, but together they show RapidSOS trying to evolve from location delivery into
    a broader public-safety operating layer that spans intake, coordination, automation, and cross-jurisdiction interoperability.'
