tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Role in workflow
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - RapidSOS Safety Network
    - Public safety agencies; enterprise partners
    - Aggregates emergency data from connected devices, apps, vehicles, sensors, and enterprise systems
    - Scaled production network
    - Network-effect data asset linking agencies, enterprises, and responders
    - No public per-vertical revenue mix
  - - RapidSOS Clearinghouse / APIs
    - Tech partners; ECC software environments
    - Normalizes and routes caller location and supplemental emergency data to 911 and responders
    - Scaled production infrastructure
    - Standards-compliant LIS/ADR plus API access into existing workflows
    - Public API auth, rate-limit, and commercial terms are not fully public
  - - RapidSOS UNITE
    - ECC telecommunicators and dispatch supervisors
    - Primary end-to-end incident workspace for calls, text, video, analytics, and interagency coordination
    - Commercial platform upgrade path
    - Single pane for voice/text/video/context with AI-enhanced workflows
    - Module attach rates and pricing are undisclosed
  - - RapidSOS HARMONY AI
    - Call-takers and dispatch leaders
    - Adds transcription, translation, summaries, natural-language query, telematics assistance, and automation
    - Commercial production feature layer
    - Purpose-built public-safety AI embedded in workflow rather than separate chatbot
    - Model governance, benchmarks, and hallucination controls are not public
  - - Real-Time Interoperability
    - State and regional ECC networks
    - Shares live transcripts, summaries, chat, and caller context across jurisdictions
    - Launched in 2026
    - Solves reroute visibility without waiting for CAD-to-CAD projects
    - Proof of multi-state adoption beyond North Carolina is not yet public
  - - Northern911 backup 911 services
    - Agencies with continuity requirements
    - Last-resort telecommunicator backup during outages, disasters, or surges
    - Commercial adjunct service
    - Extends resiliency beyond software alone
    - Commercial terms and activation thresholds are not public
  - - IamResponding / responder apps
    - Field responders and fire/EMS agencies
    - Pushes RapidSOS caller-location and incident data downstream to field maps and CAD-adjacent tools
    - Operational integration surface
    - Extends platform value beyond ECC desktop
    - Extent of attach rate across agency base is not public
  notes: Rows synthesize official product surfaces, developer materials, and partner workflow documents. “Status / maturity” reflects public deployment evidence, not audited unit economics.
