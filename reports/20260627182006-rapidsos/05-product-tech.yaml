- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Connected devices and partner apps
    - Generate location, health, alarm, telematics, video, and other emergency context
    - OEMs, app developers, enterprise systems, opt-in data collection
    - Coverage and data richness vary by partner
  - - Ingress APIs and webhooks
    - Receive and normalize emergency payloads from B2B partners
    - Stable schemas, partner engineering, onboarding quality
    - Integration errors can block or degrade data flow
  - - RapidSOS Clearinghouse / LIS-ADR
    - Standards-compliant emergency data routing layer
    - Cloud uptime, standards compatibility, security controls
    - Mission-critical bottleneck if routing or data normalization fails
  - - UNITE operator workspace
    - Fuses calls, text, video, maps, and analytics into one ECC interface
    - Call-handling/CAD integration, operator adoption
    - Workflow complexity or poor UI adoption can blunt value
  - - HARMONY AI services
    - Transcription, translation, summaries, query, automation, telematics support
    - Model quality, governance, human review, compute capacity
    - Bad summaries or brittle automation can create operator mistrust
  - - Interoperability / continuity services
    - Cross-jurisdiction incident sharing and last-resort backup handling
    - Agency participation, ESInet policy routing, Northern911 staffing
    - Adoption unevenness can leave regional gaps
  - - Cloud platform / SRE stack
    - Runs multi-region production workloads and observability
    - AWS, Kubernetes, RabbitMQ, Terraform, Datadog, CI/CD
    - Operational incidents or cost pressure can affect resilience
  notes: Architecture is derived from public product, developer, partner, and recruiting materials; some internal service boundaries remain non-public.
