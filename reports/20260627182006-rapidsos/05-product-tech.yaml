- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow without RapidSOS
  - RapidSOS workflow
  - Measurable benefit
  - Limitation
  rows:
  - - Locate wireless caller indoors
    - Carrier/ALI location often delayed or tower-based
    - Device-based hybrid location flows through RapidSOS Clearinghouse into ECC tools
    - Faster, more accurate caller location; supplemental data inside existing software
    - Works best where agency software and partner integrations are enabled
  - - Handle non-English 911 call
    - Conference external language service; manual relay
    - HARMONY transcribes and translates inside UNITE in real time
    - Reduces delay and repeat questioning
    - AI output still requires human review
  - - Transfer/reroute out-of-jurisdiction incident
    - Manual phone coordination or CAD-to-CAD dependency
    - Real-Time Interoperability shares transcript, summary, chat, and context instantly
    - Cuts handoff delay and preserves context
    - Requires participating agencies and workflow adoption
  - - Process telematics/alarm-heavy event
    - Manual lookup of crash details or alarm context
    - HARMONY surfaces structured incident insights and optional automation
    - Speeds triage and resource selection
    - Dependent on partner data quality
  - - Keep operations running during system disruption
    - Local outage can cripple agency workflow
    - UNITE plus backup 911/Northern911 and ESInet routing create redundant digital path
    - Improves continuity during outages or surges
    - Reliability still depends on cloud, partners, and network infrastructure
  notes: Benefits are sourced from official pages, pilot materials, and partner case evidence. Quantitative impact is often directional rather than contractually guaranteed.
