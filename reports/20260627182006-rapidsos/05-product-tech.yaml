  title: Workflow ownership is expanding, not shrinking
  body: RapidSOS is moving from a data-routing utility toward workflow control inside the ECC. Unite, Harmony, interoperability, analytics, and continuity services show a deliberate push to own more of the responder interface and operator decision loop.
