  evidenceGaps:
  - type: missing-source
    severity: material
    topic: api-commercial-terms
    missingEvidence: Public API authentication, credentialing, and rate-limit documentation that is accessible without portal login.
    whyItMatters: Integration economics and implementation friction materially affect partner onboarding and product scalability.
    diligencePath: Obtain public or customer-facing API onboarding docs, auth guides, and commercial packaging from management or the developer portal.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: security-attestation
    missingEvidence: Third-party security attestations or certifications specific to the production platform.
    whyItMatters: Public-safety buyers handling health, location, and communications data need audit-grade evidence beyond policy disclosures.
    diligencePath: Request SOC reports, penetration-test summaries, or equivalent security-assurance materials under NDA.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: premium-module-attach-rate
    missingEvidence: Installed-base attach rates for HARMONY AI, Interoperability, and other premium modules.
    whyItMatters: Module penetration is needed to gauge product monetization depth and true workflow adoption.
    diligencePath: Request cohort data by agency type, module attach, and renewal status from management.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: partner-traffic-dependence
    missingEvidence: Share of agency or incident volume that depends on AT&T ESInet, Northern911, or other named downstream partners.
    whyItMatters: Concentration in critical delivery partners would change outage and pricing risk.
    diligencePath: Request dependency concentration metrics and contractual contingency arrangements.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: minor
    topic: model-benchmarking
    missingEvidence: Public benchmark, accuracy, or hallucination-control evidence for HARMONY outputs.
    whyItMatters: AI workflow claims are central to differentiation, but public proof remains descriptive rather than measured.
