company:
  name: RapidSOS
chapter:
  number: 6
  title: Customers
  summary: 'RapidSOS primarily sells into public-safety agencies and into enterprise/device partners that want their emergency data delivered into 911 workflows. The strongest public customer proof is operational public-safety use: Butler County 911, the City of Miami Police Department, North Carolina''s statewide 911 program, and legacy NG911 pilot PSAPs all appear in current or historical evidence. Adoption breadth is real at the network level, but retention and concentration are harder to underwrite because public materials emphasize agency count, coverage, and anecdotes rather than renewal cohorts, contract terms, or revenue retention metrics.'
sections:
- id: customer-segments-and-payers
  title: Customer segments, buyers, and payers
  body: 'RapidSOS serves at least two economically distinct customer groups. On one side are public-safety agencies: ECCs, PSAPs, dispatch leaders, state 911 boards, and field-responder organizations that consume RapidSOS data inside emergency workflows. Official FAQ material says more than 23,500 first responder agencies use RapidSOS in over 171 million annual emergencies, while the HARMONY product page says 5,700 or more 911 centers are already on that AI-enabled workflow surface. On the other side are enterprise and device partners that contribute data into the network. RapidSOS says more than 250 enterprise organizations integrate devices, apps, and services with the platform, and the Clearinghouse overview clarifies the commercial split: public safety gets the Clearinghouse for free, while connected-device companies pay RapidSOS for value-add safety services.


    That creates a two-sided adoption model. Agencies are the operational users, but payer responsibility often sits with enterprise integrators on the inbound side and with optional premium modules on the agency side. Public materials also show segment breadth across commercial security, connected vehicles and telematics, personal safety, home security, schools, rail, and wearables. In customer-analysis terms, RapidSOS is not just a dispatcher desktop vendor; it is a network intermediary whose adoption depends on both agency workflow penetration and enterprise-data contribution.'
