- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - AT&T ESInet distribution and state procurement path
    - Expansion driver
    - High positive — can accelerate statewide NG911 and HARMONY deployments
    - Track additional state examples beyond North Carolina and procurement cycle length
  - - Broader enterprise-device partner network
    - Expansion driver
    - High positive — more devices and enterprise payloads increase network value
    - Request top-partner contribution mix and enterprise logo evidence
  - - CAD / responder app integrations
    - Expansion driver
    - Medium positive — deeper workflow embedding can raise stickiness
    - Request active CAD integration count by product tier and attach rate
  - - Public-safety proof concentrated in a few named agency references
    - Concentration risk
    - Medium — public evidence breadth lags overall agency-count claims
    - Obtain a larger live reference set across geographies and agency sizes
  - - Mission-critical uptime expectations
    - Concentration risk
    - High — warning windows and outages matter disproportionately in emergency workflows
    - Review official status history, SLA terms, and postmortem practice
  - - AI procurement friction at agencies
    - Concentration risk
    - Medium-High — limited technical evaluators and uncertain AI cost governance can slow buying
    - Request procurement conversion data and standard evaluation artifacts
  - - Weak independent review depth
    - Concentration risk
    - Medium — makes retention and satisfaction harder to verify externally
    - Prioritize direct customer interviews over software-directory summaries
  notes: Risks reflect both company-specific evidence and sector-wide AI procurement constraints that shape adoption speed for public-safety buyers.
