- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - FCC NG911 transition rules taking effect
    - Driver
    - 2026 onward
    - Creates real timing pressure for migration and interoperability planning
    - Which states or authorities now face hard deadlines or compliance milestones?
  - - Multimedia emergency inputs
    - Driver
    - Current / ongoing
    - Video, text, crash data, and IoT alerts expand the need for richer workflows
    - How often do buyers actually use multimedia features in production?
  - - Major-event readiness and multilingual callers
    - Driver
    - 2025-2026
    - World Cup and large events make translation and shared situational awareness urgent
    - Which host cities or event agencies are live references versus pilots?
  - - Telecommunicator staffing and burnout
    - Driver
    - Current / ongoing
    - QA and non-emergency automation become easier to justify
    - What implementation burden do these AI modules add for supervisors?
  - - Statewide continuity and outage resilience
    - Driver
    - Current / ongoing
    - Interoperability and backup workflows matter beyond normal daily traffic
    - How many buyers treat continuity as the primary budget justification?
  - - Grant dependency and 40% match requirements
    - Constraint
    - Current / ongoing
    - Even eligible agencies can be delayed by budget-match hurdles
    - What share of target buyers can self-fund without grant timing?
  - - Formal public procurement cycles
    - Constraint
    - Current / ongoing
    - Sales cycles are slower and more compliance-heavy than enterprise SaaS
    - Which products can ride existing contract vehicles versus full RFPs?
  - - Legacy system fragmentation and costly integrations
    - Constraint
    - Current / ongoing
    - CAD-to-CAD and local upgrades can slow value realization
    - What integrations are truly plug-and-play and which require custom work?
  - - Security, policy, and trust requirements
    - Constraint
    - Current / ongoing
    - Public safety buyers need cloud and AI assurances before adoption
    - What audit artifacts and incident data are available to prove reliability?
  notes: 'Several factors operate in both directions: the same operational complexity that creates demand for RapidSOS also slows deployment, procurement, and policy approval.'
