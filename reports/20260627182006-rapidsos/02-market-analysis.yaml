  title: Funding mechanics and procurement complexity can delay monetization even when need is obvious
  body: A strong policy and product story does not guarantee fast revenue conversion. Grants, 40% cost matches, public contracting, legacy integrations, and cloud-security review can all slow adoption materially even while agencies agree the technology is needed.
