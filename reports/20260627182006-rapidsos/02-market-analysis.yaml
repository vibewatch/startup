  rows:
  - - NG911 infrastructure migration
    - ESInets, IP delivery points, multimedia-ready network upgrades, standards compliance
    - General telecom spend unrelated to 911 and non-emergency consumer voice networks
    - State 911 authorities, telco partners, public-safety agencies
    - Outer boundary but not fully capturable by RapidSOS
  - - PSAP / ECC workflow software
    - Call handling, multimedia intake, QA, translation, non-emergency automation, responder assist
    - Standalone back-office ERP or generic contact-center software
    - ECC directors, 911 boards, public-safety IT
    - Core software layer for RapidSOS
  - - Interoperability and incident data sharing
    - Cross-jurisdiction routing context, data sharing, CAD-linked incident intelligence
    - Simple one-way routing with no shared data context
    - State or regional public-safety leaders
    - Core especially for statewide or multi-agency deployments
  - - Major-event and multilingual emergency coordination
    - Translation, live video, situational awareness, event command support
    - General event-ticketing or crowd-marketing software
    - Host-city public safety leaders, ECCs, emergency managers
    - High-value adjacency that sharpens urgency
  - - Vertical safety workflows
    - Schools, law enforcement, drones, campus safety, connected-device alerts
    - Pure consumer panic apps with no responder workflow integration
    - School safety leads, law-enforcement command, public-safety technology teams
    - Adjacency that expands reachable demand
  - - Mass notification / generic consumer safety apps
    - Outbound notifications or personal-safety utilities with no PSAP workflow depth
    - Deep responder workflow, QA, interoperability, ESInet-linked data sharing
    - Mixed enterprise or consumer buyers
    - Mostly substitute or adjacent, not core RapidSOS SAM
  notes: The market is defined around the workflow and interoperability layers that sit on top of NG911 modernization, not the entire telecom or public-sector safety budget.
