chapter:
  number: 2
  title: Market Analysis
  summary: 'RapidSOS sells into a layered market that starts with NG911 modernization but narrows quickly to the software workflow layer for multimedia intake, interoperability, responder-assist AI, and adjacent public-safety automation. Public sources do not offer one compatible TAM figure: Frost gives a $1.19B 2026 U.S. NG911 revenue lens, while NENA, NTIA-related commentary, and House debate focus on multi-year public capital needs that can reach the tens of billions. Buyers are primarily state 911 authorities and ECC operators, but downstream users extend to field agencies, schools, major events, and drone-response programs. Demand drivers are real, yet procurement, grant dependency, legacy integration, and policy burdens make RapidSOS''s serviceable and obtainable market materially narrower than headline NG911 spend.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'RapidSOS sits inside a broader NG911 and public-safety workflow modernization market, but it does not equal the whole market. The FCC''s definition of NG911 sets the clean outer boundary: interoperable, secure, standards-based IP infrastructure able to receive and process text, video, data, and other emergency inputs over ESInets instead of legacy analog systems. RapidSOS participates in that transition through multimedia intake, interoperability, responder-assist AI, and data integration, not by capturing every fiber, transport, or core-services dollar. That distinction matters because status-quo substitutes are layered. Some buyers can address part of the problem with legacy CAD-to-CAD integrations, homegrown workflows, or one-off multimedia tools. Others rely on telco-led ESInet upgrades or infrastructure vendors first, then add workflow software later. The retained RapidSOS product pages also show adjacency expansion beyond central call taking into schools, law enforcement,
    drones, and major events. Those adjacencies widen the commercial story, but they remain attached to the same core job: converting fragmented emergency inputs into shareable operational context for public safety.'
