callouts:
- calloutType: insight
  title: RapidSOS participates in a workflow layer, not the whole NG911 budget
  body: The best-supported market case is not all emergency communications spend. It is the narrower layer where multimedia intake, interoperability, responder-assist AI, and automation sit on top of NG911 modernization and can actually win software budget.
  claimRefs:
