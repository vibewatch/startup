- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Revenue disappointment on disclosure
    - Disclosed ARR or revenue below $80M
    - Implies above 12x EV/revenue at the $1.0B mark — expensive even vs. Axon; thesis unsupported
    - Request renegotiation of entry price or exit the thesis entirely
  - - Major partner defection
    - Motorola Solutions or Axon terminates or materially reduces RapidSOS integration
    - Removes estimated 25-40% of device-side distribution channel; moat narrative undermined
    - Reassess network-effects claim; demand PSAP-direct retention data and churn figures
  - - Down round or heavily structured financing
    - Next round closes at or below $1.0B pre-money or with ratchet preferences
    - Signals growth stall; worsens preference overhang; dilutes common equity materially
    - Reduce exposure; clarify pro-rata rights; model preference stack before re-entry
  - - Sustained public-sector budget contraction
    - Federal 911 grant programmes frozen; state agencies defer PSAP upgrades by more than 12 months
    - Slows agency adoption and renewal pace; base-case revenue range shifts toward the bear scenario
    - Build 2-year revenue scenario under a 20% public-sector spend reduction assumption
  - - Governance or data-privacy enforcement action
    - Regulatory enforcement action related to 911 data handling or HARMONY AI model outputs
    - Litigation risk and trust erosion with agency buyers; procurement disqualification possible
    - Flag as blocking; engage legal review of DPA terms, AI liability clauses, and audit logs
  - - Competitive displacement by major incumbent
    - Motorola Solutions or Axon deploys native 911 AI with ESInet parity; agencies can substitute in-contract
    - Reduces distribution partner to direct competitor; the most defensible channel closes
    - Kill trigger — reassess whether a standalone RapidSOS thesis remains viable
  notes: Thresholds are directional, not contractual; they represent the evidence point at which the retained research base would shift the recommendation from track to avoid. The down-round and partner-defection triggers are the most material given the undisclosed preference stack and partner revenue concentration.
