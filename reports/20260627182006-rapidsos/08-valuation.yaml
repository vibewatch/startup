- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner or Diligence Path
  rows:
  - - Revenue and ARR
    - Last 3 fiscal years of revenue, ARR run rate, and quarterly growth trajectory
    - Without revenue no multiple is calculable; the $1.0B mark is solely round-based; bear risk is non-quantifiable
    - Management data room; CFO presentation; audited financials or reviewed interim statements
  - - Gross margin and unit economics
    - Gross margin percentage; COGS breakdown by hosting, support, and professional services; CAC and LTV
    - Gross margin determines whether the Motorola (6x) or Axon (13x) multiple is the right anchor for scenarios
    - Management data room; compare against Axon and Tyler filed margin disclosures from 2025 10-Ks
  - - Net revenue retention and churn
    - NRR or gross dollar retention by PSAP cohort; average contract length; early-termination clauses
    - NRR above 110% justifies premium software treatment; below 100% makes the network-effects narrative unsupported
    - Management data room; request cohort retention waterfall by agency size and contract vintage
  - - Cap table and preference stack
    - Full capitalisation table as of run date; investor preference rights; liquidation waterfall analysis
    - $450M+ raised over 12-plus years likely involves layered preferences; $1.0B headline mark may be misleading without stack
    - Legal review of investor rights agreements, charter, and side-letter summary; pre/post-money analysis for Nov 2025 round
  - - Partner revenue concentration
    - Revenue split across Motorola, Axon, AT&T, and direct-sale channels; contract renewal terms
    - If top 2-3 partners represent above 30% of revenue, the thesis carries concentration and displacement risk
    - Management channel revenue breakdown; partnership contracts; ask for top-10 revenue sources by channel
  - - Secondary market valuation freshness
    - Most recent mutual fund NAV mark or secondary transaction since November 2025
    - PM Insights flags subscriber-gated signals; the Nov 2025 mark is 7-plus months old; conditions have changed
    - Secondary brokers such as Forge and Nasdaq Private Market; mutual fund filings; PM Insights full report
  notes: Diligence asks are prioritised in order of impact on recommendation movement. Revenue and ARR unlock all scenario work and should be the first ask in any management discussion.
