callouts:
- calloutType: risk
  title: Revenue Opacity Is the Blocking Gap
  body: >-
    RapidSOS has disclosed no revenue, gross margin, ARR, or net revenue
    retention figure in any retained public source. Without revenue, every
    applicable public-market multiple produces a range of $77M-$202M in implied
    revenue to justify the $1.0B private marker — and investors cannot determine
    which part of that range is realistic without a data-room engagement.
  claimRefs:
  - CV039
  - CV041
  - CV042
- calloutType: recommendation
  title: Entry Price Discipline Is the Core Posture
  body: >-
    The most defensible entry posture is to treat the November 2025 $1.0B
    private marker as the ceiling of fair value under current information, not
    a floor for negotiation. Any entry materially above that level without
    revenue and margin disclosure is structurally a bet on blind premium rather
    than evidence-based pricing.
  claimRefs:
  - CV002
  - CV039
