- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Key Assumptions
  - Implied Valuation (USD)
  - Return Logic
  - Key Risk or Probability Signal
  rows:
  - - Bear
    - Revenue below $100M; public-sector budget freeze or PSAP spending cut; major partner defection or down-round; NRR below 100%
    - $300M–$800M (below the current ~$1.0B private marker)
    - At 5x EV/rev on $80M rev equals ~$400M; Apax round mark compressed; further dilution worsens LP returns
    - Material probability if FY2026 agency growth stalls or revenue disclosure disappoints significantly
  - - Base
    - Revenue $100M–$180M; stable retention; AT&T and Motorola channels intact; no forced financing; agency count growing at public pace
    - $800M–$1.5B (around the current marker with modest premium room)
    - At 6-8x EV/rev on $150M rev equals $900M–$1.2B; step-up from Nov 2025 mark if channel discipline holds
    - Most plausible given current public evidence; requires 2026-2027 agency growth to continue at observed pace
  - - Bull
    - Revenue above $200M with accelerating NRR; gross margin above 70%; strategic acquirer (Motorola, Axon, or AT&T) crystallises exit
    - $2.0B–$2.5B
    - At 10-12x EV/rev on $200M+ rev equals $2.0B–$2.4B; strategic premium above public-market multiple
    - Low probability without revenue and margin disclosure; requires evidence currently absent from public file
  notes: Revenue ranges are directional estimates derived from applying public-market comparable multiples to hypothetical revenue bands. No RapidSOS revenue has been disclosed; these are scenario thresholds only, not forecasts.
