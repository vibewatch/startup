- id: thesis-break-and-final-diligence
  title: Thesis-Break Triggers and Final Diligence Asks
  body: >-
    TV005 enumerates six thesis-break triggers spanning revenue disclosure,
    partner defection, down-round mechanics, public-sector spending, governance
    enforcement, and competitive displacement. The most material near-term
    trigger is a down round or structurally complex financing at or below $1.0
    billion pre-money, which would signal a growth stall and worsen a preference
    overhang that is already unquantifiable from public sources. [CV040] [CV047]
    The Washoe County contract document is an illustrative concrete signal of
    the procurement friction that can delay agency renewals even when the product
    is well-regarded — it shows multi-PSAP scope-of-work language, budget
    authorisation requirements, and specific service-level terms. [CV046]

    TV006 translates the six evidence gaps into a prioritised diligence ask
    list. Revenue and ARR disclosure is the highest-priority ask because without
    it no multiple is calculable and no scenario can be anchored against real
    data. Gross margin and NRR follow immediately because they determine whether
    the applicable comparable multiple is closer to the Motorola floor or the
    Axon ceiling. Cap table and preference stack disclosure matters because the
    $450 million-plus raised over more than a dozen years likely involves layered
    preferences that can materially alter the real return math relative to the
    $1.0 billion headline. [CV001] [CV040] [CV047] Partner revenue share is the
    fifth ask: if Motorola Solutions or Axon together account for more than 30
    percent of revenue, the investment thesis and the partnership simultaneously
    carry dependency and displacement risk. [CV025] [CV026]

    The chapter closes with the same call it opened with: Research-More / Track,
    medium confidence, high risk, and stretched if priced above the current
    $1.0 billion private marker. Entry discipline at or below the November 2025
    marker is the core posture until revenue and margin are on the table.
