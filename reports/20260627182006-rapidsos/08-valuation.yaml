  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-arr
    missingEvidence: RapidSOS annual recurring revenue, last three fiscal years of total revenue, quarterly growth trajectory, and gross revenue run rate.
    whyItMatters: Without revenue no multiple is calculable; the $1.0B mark is solely round-based; bear risk is non-quantifiable and the entire scenario analysis rests on hypothetical revenue bands.
    diligencePath: Management data room; CFO presentation; audited financial statements or reviewed interim results; compare filed gross margin disclosures from Axon and Tyler 10-Ks.
    relatedQuestionRefs:
    - QV029
    - QV032
    relatedTableRefs:
    - TV003
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-unit-economics
    missingEvidence: Gross margin percentage, COGS breakdown by hosting and support, customer acquisition cost, and lifetime value by segment.
    whyItMatters: Gross margin determines whether the applicable comp multiple is closer to the Motorola floor (6x) or the Axon ceiling (13x), swinging the base-case valuation by up to 2x.
    diligencePath: Management data room; compare against Axon and Tyler filed margin disclosures from the 2025 SEC 10-K filings retained as SV009 and SV010.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: net-revenue-retention-and-churn
    missingEvidence: Net revenue retention or gross dollar retention by PSAP cohort, average contract length, early-termination clauses, and AT&T ESInet channel renewal terms.
    whyItMatters: NRR above 110% justifies premium software treatment; below 100% undermines the network-effects narrative and caps the applicable multiple closer to the Tyler floor.
    diligencePath: Management data room; cohort retention waterfall by agency size and contract vintage; ask for AT&T ESInet channel renewal and pricing terms specifically.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preference-stack
    missingEvidence: Full capitalisation table as of the run date, investor preference rights, liquidation waterfall analysis, and round structure for the November 2025 Apax financing.
    whyItMatters: More than $450M raised over 12-plus years likely involves layered preferences; the $1.0B headline mark may materially overstate real common-equity fair value without a stack analysis.
    diligencePath: Legal review of investor rights agreements, company charter, and side-letter summary; request pre/post-money analysis and preference coverage ratio for the November 2025 round.
    relatedQuestionRefs:
    - QV012
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: partner-revenue-concentration
    missingEvidence: Revenue split across Motorola Solutions, Axon, AT&T, and direct-sale channels; contract renewal terms and exclusivity provisions for each channel.
    whyItMatters: If the top two or three partners represent more than 30% of revenue, the investment thesis simultaneously carries concentration risk and displacement risk from the same counterparties.
    diligencePath: Management channel revenue breakdown; review partnership contracts for renewal, exclusivity, and revenue-share terms; ask for top-10 revenue sources by channel and vintage.
    relatedQuestionRefs:
    - QV011
    - QV031
    relatedTableRefs:
    - TV005
    - TV006
  - type: stale
    severity: minor
    topic: secondary-market-valuation-freshness
    missingEvidence: A secondary transaction price or mutual fund NAV mark for RapidSOS equity from any date after November 2025.
    whyItMatters: The PM Insights subscriber gate and the seven-month age of the Premier Alternatives $1.0B mark mean the reference valuation may no longer reflect current market conditions.
    diligencePath: Secondary brokers such as Forge Global and Nasdaq Private Market; mutual fund quarterly reports that disclose RapidSOS NAV marks; PM Insights full subscriber report.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV001
