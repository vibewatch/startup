- id: investment-scorecard-and-risk-calibration
  title: Investment Scorecard and Risk Calibration
  body: >-
    FV004 scores the investment across seven IC dimensions. Market opportunity
    earns a high mark (7/10) because the NG911 transformation is federally
    mandated, 911.gov funding programmes provide recurring demand signals, and
    the FCC regulatory framework is active. [CV035] [CV036] However, GAO
    findings on mission-critical IT procurement gaps and the NENA 2024 survey
    of staffing shortages and technology adoption barriers both constrain the
    pace at which agencies can upgrade, limiting the score below top-tier.
    [CV029] [CV034] Platform and product also score 7/10, reflecting consistent
    public evidence of AI-enabled workflows, Apple Emergency SOS and Google
    Android integrations, and a network of more than 600 million connected
    devices. [CV005] [CV027] [CV028]

    Competitive moat scores 6/10. Motorola Solutions and Axon are distribution
    partners today but operate in adjacent public-safety markets and have the
    capital and channel relationships to internalize comparable capabilities.
    [CV025] [CV026] The 2026 reports from Intrado and Mission Critical Partners
    note sector consolidation trends and interoperability pressures but do not
    resolve the partner-to-competitor risk. [CV031] [CV032] NENA's 2025 Pulse
    report, the third annual edition, confirms sustained interest in 911
    technology but also notes the human-capital constraints on adoption pace.
    [CV033]

    Financial economics scores only 3/10 — the lowest dimension — because
    revenue, margin, NRR, and burn are all undisclosed. [CV039] Risk scores
    4/10: the Washoe County contract document confirms that multi-PSAP
    procurement involves detailed scope-of-work requirements and budget
    authorisation, and the 911.gov cybersecurity framework notes persistent
    infrastructure vulnerabilities in the 911 ecosystem. [CV030] [CV037]
    Valuation support scores 4/10 because the $1.0 billion private-round marker
    has no revenue anchor, and PM Insights flags that subscriber-gated secondary
    valuation signals are thin. [CV038] Evidence quality scores 5/10: scale
    claims are well-sourced and corroborated by primary-tier evidence, but the
    economic inputs that would drive any rigorous valuation remain private only.
    LeadIQ indicates the company employs 201-500 people, consistent with
    significant but not hyper-scaled headcount for its revenue footprint.
    [CV013]
