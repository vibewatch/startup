company:
  name: RapidSOS
chapter:
  number: 8
  title: Valuation
  summary: >-
    Chapter 8 converts cross-chapter evidence into a Research-More / Track
    recommendation for RapidSOS at medium confidence and high risk, anchored on
    the November 2025 private marker of approximately $1.0 billion derived from
    Premier Alternatives and Inc. reporting. The absence of any disclosed
    revenue, gross margin, ARR, or net revenue retention prevents a
    multiple-based fair-value calculus and makes the current mark stretched if
    entered materially above it. Public-company comparables — Motorola Solutions
    at 6.4× EV/revenue, Tyler Technologies at 5.0×, and Axon Enterprise at
    12.9× — establish plausible scenario bounds, while GAO mission-critical IT
    findings, NENA staffing surveys, and a Washoe County procurement record
    supply concrete public-sector headwinds that constrain the base case.
sections:
- id: recommendation-and-framework
  title: Recommendation and Analytical Framework
  body: >-
    RapidSOS arrives at the valuation chapter with an unusually rich public
    operating narrative — 22,000-plus agencies, more than one billion emergencies
    supported, 600 million-plus connected devices, and a November 2025 Apax-led
    financing that brought total capital raised above $450 million and generated
    independent reporting of a unicorn valuation. [CV001] [CV004] [CV005]
    [CV007] Premier Alternatives, one of the few secondary-market platforms that
    publishes a figure for private companies, marks RapidSOS at approximately
    $1.0 billion as of November 2025 with a capital efficiency ratio of 2.22×.
    [CV002] [CV003] That marker is the single most actionable public valuation
    reference in the retained evidence set.

    What is materially absent is the revenue, gross margin, net revenue
    retention, or churn data needed to translate those operating claims into a
    multiple-based fair-value estimate. [CV039] No public or third-party source
    in the retained file discloses RapidSOS annual recurring revenue, COGS
    structure, or renewal cohort quality. An SEC EDGAR search confirms that
    RapidSOS has filed nothing as a private company. [CV045] Tracxn and Craft.co
    confirm the private-active status but add no financial detail. [CV040]
    [CV011] [CV012]

    Given this evidence configuration the most defensible recommendation is
    Research-More / Track at medium confidence and high risk, with a valuation
    stance of stretched if entry is priced materially above the November 2025
    $1.0 billion marker. TV001 summarises the core recommendation dimensions.
    FV001 traces the decision flow from scale evidence, partner proof, revenue
    gap, public-market comps, and sector headwinds to the final call. The path
    to a more constructive recommendation runs exclusively through revenue and
    margin disclosure — not through additional scale metrics, which are already
    well-documented.
