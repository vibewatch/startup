- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR / revenue
    - Need to know monetized scale rather than operational scale claims
    - Blocks revenue-quality underwriting
    - Request audited or board-approved revenue bridge by product and quarter
  - - Gross margin by product
    - Need to know whether network intelligence scales like software or is dragged down by services and support
    - Blocks margin-path underwriting
    - Request gross-margin waterfall for core platform, interoperability, and continuity services
  - - CAC and payback
    - Need to know whether procurement-led growth is efficient
    - Blocks GTM efficiency judgment
    - Request funnel metrics, CAC by channel, and payback by cohort
  - - Retention / renewal
    - Need to know whether agencies expand or churn after deployment
    - Blocks durability judgment
    - Request gross and net retention by agency and enterprise segment
  - - Customer concentration
    - Need to know whether a few states or partners dominate revenue
    - Blocks concentration-risk assessment
    - Request top-customer, top-state, and top-partner exposure schedules
  - - Cash / burn / runway
    - Need to know financing dependency and downside resilience
    - Blocks capital-adequacy judgment
    - Request monthly burn, unrestricted cash, debt, and runway scenarios
  notes: Every gap is actionable and tied to a concrete diligence request because public traction alone does not close underwriting questions.
