  topStrengths:
    - >-
      Strong public proof of platform scale across 23,500+ agencies, 723M+ connected devices, and 1B+ emergencies
      informed.
    - >-
      Product scope has expanded from location delivery into AI-assisted interoperability, multimedia, and responder
      workflow orchestration.
    - >-
      Distribution leverage is improving through AT&T ESInet, major device ecosystems, and existing public-safety
      software integrations.
    - >-
      Named public-agency references and statewide interoperability examples indicate real workflow adoption, not only
      partner logos.
  topRisks:
    - >-
      Revenue, ARR, gross margin, NRR, and burn remain undisclosed, making the latest valuation impossible to underwrite
      rigorously.
    - >-
      The business handles sensitive location, health, video, and AI-routing data, creating meaningful privacy,
      security, and liability exposure.
    - >-
      Procurement cycles, PSAP staffing shortages, and public-sector budget friction can slow deployment and renewal
      velocity.
    - >-
      Large partners such as Axon, Motorola, and AT&T help distribution today but could compress margins or absorb
      adjacent functionality over time.
    - >-
      Cap-table complexity and preference overhang are opaque despite more than $450M raised over multiple financing
      rounds.
  unresolvedGaps:
    - Revenue, ARR, gross margin, and renewal metrics needed to anchor any credible valuation multiple.
    - Current cap table, preference stack, and any secondary mechanics embedded in the November 2025 financing.
    - Customer concentration, partner revenue share, and premium-module attach rates by agency and enterprise cohort.
    - >-
      Governance detail beyond the visible founder-led executive profile, including board composition and control
      rights.
    - >-
      Reliability, incident-response, and model-governance evidence for AI-assisted routing and emergency workflow
      automation.
