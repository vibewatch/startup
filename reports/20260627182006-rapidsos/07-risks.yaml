  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-controls
    missingEvidence: SOC 2 Type II report or FedRAMP / StateRAMP authorization letters
      confirming RapidSOS cyber controls meet public-safety-grade standards.
    whyItMatters: Without independent audit attestations the quality of RapidSOS's
      defenses against the NG911 IP-network attack vectors identified by CISA and
      911.gov cannot be verified from public sources alone.
    diligencePath: Request SOC 2 Type II report, any FedRAMP or StateRAMP authorization
      letters, and most recent penetration-test executive summary from management.
    relatedQuestionRefs:
    - QR004
    - QR028
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: service-reliability
    missingEvidence: Internal SLA commitments, uptime targets, and full incident postmortem
      records covering at least calendar years 2024 and 2025.
    whyItMatters: RapidSOS serves 22,000-plus agencies in mission-critical emergency
      contexts; StatusGator provides external incident visibility but not the contractual
      reliability guarantees or recovery standards that agencies depend on.
    diligencePath: Request SLA documentation, uptime dashboard access, and incident
      postmortems from management; cross-check against representative agency contracts.
    relatedQuestionRefs:
    - QR009
    - QR022
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue share attributable to Axon, Motorola Solutions, and AT&T
      partnerships relative to direct PSAP and enterprise contracts.
    whyItMatters: If Axon or Motorola Solutions accounts for more than 20 percent
      of revenue or data volume, a partnership change would be materially adverse;
      public sources confirm the relationships but give no revenue or volume split.
    diligencePath: Request revenue segmentation by channel and top-partner revenue
      and data-volume contribution from management.
    relatedQuestionRefs:
    - QR006
    - QR014
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: litigation
    missingEvidence: State-court docket search covering New York, California, and
      other key states for civil, consumer, or privacy actions involving RapidSOS.
    whyItMatters: The PACER search found no active federal case, but state-level privacy
      suits under CCPA, CPRA, or state 911 statutes would not appear in federal records.
    diligencePath: Commission a state-court litigation search in New York, California,
      and any state with a material PSAP customer base before closing.
    relatedQuestionRefs:
    - QR003
    - QR020
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: Audited or management-prepared financials including ARR, revenue
      growth rate, gross margin, burn rate, and 12-to-24-month runway projection.
    whyItMatters: Investors cannot assess valuation quality, terminal value, or path
      to profitability for a company with more than $450 million raised and no public
      revenue disclosure.
    diligencePath: Request most recent audited financial statements or management
      accounts, a 12-to-24-month operating plan, and the cap-table mechanics for
      the November 2025 Apax round.
    relatedQuestionRefs:
    - QR017
    - QR030
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: ai-model-risk
    missingEvidence: Independent algorithmic audit of HARMONY AI routing and prioritization
      models for bias, hallucination, failure modes, and model drift across emergency-call
      types.
    whyItMatters: AI-assisted emergency routing creates direct liability if model
      outputs contribute to delayed or misrouted emergency response; no external audit
      result appeared in the public source set.
    diligencePath: Request internal model validation reports, red-team results, and
      any third-party AI-audit documentation from management; review indemnification
      provisions in agency MSAs for AI-output liability allocation.
    relatedQuestionRefs:
    - QR021
    - QR028
    relatedTableRefs:
    - TR001
    - TR002
