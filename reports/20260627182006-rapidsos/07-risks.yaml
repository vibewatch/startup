- id: TR006
  title: Mitigation and Kill-Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold or Event
  - Action Implication
  rows:
  - - Privacy or data-breach event
    - Regulatory enforcement action or public breach disclosure
    - FTC, state AG, or CISA notification involving RapidSOS data
    - Immediate legal review; halt new data integrations; escalate to board
  - - AI routing harm or liability event
    - Public report or lawsuit attributing emergency harm to HARMONY output
    - First credible harm report or complaint in the public record
    - Independent AI audit; review agency indemnification terms; board escalation
  - - NG911 transition compliance failure
    - FCC enforcement notice or OSP rule violation finding
    - Formal FCC notice or published enforcement action against RapidSOS or key OSP
      partner
    - Review compliance road map with regulatory counsel; reassess AT&T ESInet reliance
  - - Major partner departure (Axon or Motorola)
    - Public announcement of competitor deal or contract termination
    - Named anchor partner signs RapidSOS competitor or publicly exits integration
    - Reassess distribution moat and go-forward TAM; revisit valuation thesis
  - - Cyberattack on PSAP infrastructure linked to RapidSOS
    - Public reporting of PSAP data corruption or outage traced to NG911 IP network
    - Any confirmed CISA incident advisory naming the NG911 data layer
    - Full security audit; potential customer pause; board escalation
  - - Service outage during mass-casualty or major event
    - StatusGator critical-incident flag or agency self-report
    - Extended outage exceeding four hours in a peak-demand period
    - SLA review; escalate to reliability engineering; activate communications plan
  - - PSAP federal funding cut
    - Congressional appropriations legislation reducing NG911 grant pool
    - Signed legislation or executive order reducing NG911 grants by 20% or more
    - Quantify revenue at risk from public-sector segment; model commercial offset
  - - Key-person departure
    - Public announcement of CEO or founder departure
    - Public announcement of departure
    - Succession and leadership continuity review; assess strategic relationships
  - - Funding runway concern
    - No new round or revenue disclosure within 18 months of November 2025 round
    - Window closes November 2027 without new capital or revenue proof
    - Request financial model and cash bridge from management; assess strategic alternatives
  notes: Triggers rely on publicly monitorable signals. Internal operating metrics
    and SLA thresholds require private-document access to define precise kill-criteria
    thresholds beyond these external indicators.
