- id: operational-security-dependencies
  title: Operational, Security, and Dependency Risk
  body: 'RapidSOS''s operational risk profile is defined by two structural tensions — the company provides software to emergency-response workflows where availability is a life-safety requirement, and it does so through a chain of external platform and partner dependencies over which it exercises limited direct control. On service reliability, three distinct product surfaces are publicly monitored on StatusGator — the main RapidSOS service, the Data Connect module, and the Alerts module. The existence of module-level external monitoring makes uptime accountability visible even without public SLA disclosure. The operational stack also sits on top of device-level networks that introduce their own failure modes — Apple''s Emergency SOS may route through alternative networks or satellite when the primary carrier is unavailable, introducing latency and coverage variation, while Android location-based features depend entirely on explicit user permission grants, meaning revoked or approximate-only permissions directly degrade emergency data fidelity. On security, the NIST Cybersecurity Framework is the standard against which NG911-class systems are evaluated. CISA and the 911.gov cybersecurity page are explicit that the IP-based expansion of 911 networks widens the cyberattack surface beyond what legacy PSTN infrastructure faced. RapidSOS has a compliance page and a trust center but no publicly visible SOC 2 Type II or FedRAMP documentation was found in the retained source set, leaving the quality of private controls unverified. On partner and platform concentration, two named anchors dominate — Axon, which equips responders and dispatchers with holistic real-time data via the RapidSOS integration, and Motorola Solutions, which routes connected-device data including location, health information, and live video through emergency response systems. Both represent high-severity single-point-of-failure distribution vectors if either relationship changed. The AT&T ESInet relationship adds a third critical infrastructure dependency — if that arrangement changed, HARMONY AI''s distribution inside NG911 infrastructure would require rerouting. The partner and dependency risk register and the dependency map below document the full picture.'
