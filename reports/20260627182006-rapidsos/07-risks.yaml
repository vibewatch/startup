callouts:
- calloutType: risk
  title: Critical Privacy and AI Routing Liability
  body: 'RapidSOS''s own privacy notice is the most direct risk document in this
    chapter — it acknowledges that AI-automated systems may affect the routing and
    prioritization of emergency communications and that the company processes precise
    geolocation, health data, and video streams. That combination of sensitive-data
    processing and AI-influenced life-safety decisions creates liability exposure
    that no public contract or certification fully addresses from the available evidence.'
  claimRefs:
  - CR003
  - CR008
  - CR038
- calloutType: risk
  title: Financial Model Opacity Across $450M Raised
  body: 'More than $450 million in total capital raised without any public revenue, margin, or burn disclosure means the unicorn valuation signal cannot be independently tested. Investors cannot model terminal value or assess whether the platform gross margin profile is genuinely SaaS-like or diluted by implementation and professional-services costs embedded in public-sector contracts.'
  claimRefs:
  - CR009
  - CR044
- calloutType: insight
  title: NG911 Transition Is Both Moat and Compliance Burden
  body: 'RapidSOS''s AT&T ESInet distribution positions the company inside the very NG911 infrastructure the FCC is mandating all OSPs to adopt. That is a structural distribution advantage. But it also means RapidSOS is co-obligated to the security and interoperability standards CISA imposes on IP-based 911 networks, adding compliance overhead that scales with the mandate''s pace and scope.'
  claimRefs:
  - CR022
  - CR023
  - CR043
