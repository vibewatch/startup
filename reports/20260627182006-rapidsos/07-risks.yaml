- id: regulatory-legal-privacy
  title: Regulatory, Legal, and Privacy Risk
  body: 'RapidSOS''s regulatory and legal exposure is unusually concentrated in a few high-stakes domains — federal and state privacy law as it applies to emergency-grade sensitive data, NG911 transition mandates that directly affect how the company''s infrastructure must perform, and the inherent liability of AI-assisted decision systems in life-safety contexts. On privacy and data handling, the company''s own legal documents are the most direct evidence source. The Terms of Use, last updated December 14 2022, explicitly govern RapidSOS subscribers, partner relationships, and Emergency Communications Center users. The emergency-related services privacy notice covers a broader population including responders, callers, connected-device operators, and partners, and states that it updates as law, regulation, or industry practice changes. Most significantly, the privacy notice acknowledges that RapidSOS AI-automated systems may affect the routing or prioritization of emergency communications and the incident information that responders receive. That disclosure is the clearest company-level acknowledgment that HARMONY outputs could create liability if a routing or prioritization decision causes harm or omits a critical data point during an active emergency. On regulatory compliance, FCC rules issued in July 2024 require originating service providers to begin or continue NG911 transitions toward a secure, standards-based, interoperable system. CISA reinforces this as an interconnected public-private network security obligation. The 911.gov cybersecurity page makes the risk concrete — IP-based 911 data sharing expands the cyberattack surface and creates pathways for hackers to overwhelm PSAP infrastructure. Two 2025 GAO reports add broader federal context: one finding that seven of sixteen major federal IT efforts studied had significant privacy and cybersecurity risks, and a second finding that law-enforcement technologies can raise civil-rights, civil-liberties, and privacy concerns directly relevant to AI-assisted dispatch. No public federal case was found in a PACER search conducted for this run, so litigation risk is framed here as privacy, contract, and compliance exposure rather than confirmed active federal litigation. A state-court search remains an open diligence item. The regulatory and legal risk register and the risk transmission map below capture the full inventory and causal flows.'
