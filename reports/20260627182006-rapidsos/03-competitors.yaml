- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - RapidSOS
    - Focal company / safety-network layer
    - 22,000+ agencies; 200+ to 250+ enterprises; 600M+ to 723M+ devices; 1B+ emergencies supported
    - Public safety agencies, enterprises, connected-device ecosystems
    - External safety-network data, AT&T ESInet path, mutual-aid resilience, enterprise-device connectivity
    - Public pricing opaque; win-rate and renewal data undisclosed
  - - Carbyne / Axon 911 Core
    - Direct cloud-native 911 infrastructure
    - US and international deployments; 100+ partners; 40+ integrations
    - PSAPs modernizing cloud call handling and AI-assisted intake
    - Cloud-native infrastructure, all-in-one packaging, open integrations, AT&T alignment
    - Less visible enterprise-device network breadth than RapidSOS
  - - Prepared / Axon
    - Direct AI-assisted 911 workflow
    - 1,000+ agencies in 49 states; nearly 100M people protected
    - PSAPs wanting AI help on audio, text, video, GPS, and translation
    - Single-screen operator assistance and now Axon ecosystem bundling
    - Still centered on PSAP workflow rather than broader external safety network
  - - Motorola Solutions
    - Incumbent PSAP and command-center suite
    - Large public incumbent with VESTA, mapping, analytics, CAD adjacency, and SEC disclosure
    - State and local PSAPs, multi-product public-safety estates
    - Cloud-native and on-prem paths, call handling, mapping, analytics, AI call agent
    - Portfolio breadth can mean slower unified-network story than RapidSOS
  - - Tyler Technologies
    - Incumbent public-sector suite
    - Large public-sector software vendor spanning CAD, dispatch, records, analytics, and justice
    - Jurisdictions preferring bundled government relationships
    - Integrated public-safety and justice workflows with broad government footprint
    - Less visible external device/enterprise connectivity than RapidSOS
  - - CentralSquare
    - Incumbent cloud public-safety suite
    - 8,000+ public-sector agencies; cloud NG911 case studies across counties and ECCs
    - Agencies replacing aging call handling, RMS, and dispatch stacks
    - Interoperable suite with cloud NG911, mapping, records, and analytics
    - Focused on suite replacement rather than external safety-network inputs
  - - Mark43
    - Adjacent cloud operations platform
    - 300+ agencies; hundreds of integrations; 24/7/365 support claim
    - Agencies prioritizing dispatch, records, evidence, and analytics unification
    - Cloud-native operations platform with strong data integration and compliance posture
    - Not marketed as a carrier-grade external safety-data network
  - - Priority Dispatch
    - Protocol and dispatch substitute
    - 4,000+ emergency communications centers worldwide
    - ECCs prioritizing protocol rigor, pre-arrival instructions, and dispatch quality
    - Evidence-based protocols and rapid code assignment
    - Narrower than a full multi-agency intelligence and interoperability platform
  - - Hexagon
    - Incumbent public-safety alternative
    - Protect 1B people worldwide according to official positioning
    - Agencies wanting resilient CAD and incident-management infrastructure
    - Large-scale incident-management and dispatch credibility
    - Public evidence here is broad positioning rather than specific RapidSOS overlap
  - - Internal build / legacy stack
    - Status quo substitute
    - Existing call handling, CAD, protocol, and governance infrastructure
    - Agencies with strong incumbent estates or slow procurement cycles
    - Avoids wholesale migration and preserves local control
    - Requires complex NG911 coordination and can perpetuate routing or connectivity friction
  notes: Rows compare the main buyer alternatives visible in retained official sources; scale cells use public website claims rather than audited revenue.
