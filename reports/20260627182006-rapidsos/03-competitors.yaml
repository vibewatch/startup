- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - External safety-network data breadth
    - Carbyne, Prepared/Axon, and Motorola are all adding richer AI-assisted workflows around the call itself
    - High
    - Request evidence that external enterprise and device data changes dispatch outcomes enough to beat UI-only competitors
  - - Procurement leverage through AT&T ESInet
    - Motorola, CentralSquare, and Tyler also sell through existing public-safety procurement relationships
    - Medium
    - Ask for state-level attach rates and renewal data on AT&T-routed opportunities
  - - Resilience and mutual aid story
    - Outages, routing failures, and staffing shortages remain common enough that resilience is still table stakes, not exclusive
    - Medium
    - Request Northern911 cross-sell results and evidence that continuity features win incremental deals
  - - Interoperability moat
    - Carbyne and Mark43 both emphasize large integration ecosystems
    - Medium
    - Request which integrations are truly unique, deeply embedded, or revenue-critical
  - - Platform breadth advantage
    - Suite incumbents can bundle adjacent call handling, CAD, records, or analytics modules
    - High
    - Request competitive-loss notes versus Motorola, Tyler, and CentralSquare by buyer segment
  - - Switching-cost argument
    - Public evidence does not show win rates, multi-homing patterns, or renewal resilience
    - High
    - Request cohort renewals, displacements, and attachment of RapidSOS alongside incumbent systems
  notes: Risk severity reflects the gap between RapidSOS public differentiation story and the breadth of credible substitutes visible in retained sources.
