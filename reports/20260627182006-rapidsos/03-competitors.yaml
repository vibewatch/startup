- id: switching-costs-substitutes-and-build-vs-buy
  title: Switching costs, substitutes, and build-vs-buy pressure
  body: 'Switching costs look meaningful, but not uniform. RapidSOS’s value is clearest when agencies or enterprise-linked response flows depend on outside telematics, device, or video inputs that sit beyond the PSAP’s legacy system of record. The AT&T ESInet release and Northern911 release both reinforce that the company is trying to make interoperability and resilience part of the package rather than just part of the product story. Those are real advantages where agencies care about routing continuity, multi-agency information sharing, and external data arriving with the call.


    But substitutes remain credible. 911.gov explicitly frames NG911 as a multi-entity transition rather than a single vendor purchase, which keeps internal build alive for agencies that already own major components of the stack. Motorola and CentralSquare can offer broad PSAP suites with cloud and on-prem modernization paths. Mark43 can win the broader operations layer. Priority Dispatch can own the protocol layer. In other words, RapidSOS is not selling into an empty field where replacing one interface wins the account forever. It is selling into a layered architecture where buyers can still combine incumbents, specialist modules, and internal migration plans.'
