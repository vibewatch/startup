              公开证据集中在公共安全机构和公共部门基础设施合作伙伴，而不是一大批具名企业客户；最知名的运营引用也都聚集在网络的应急响应侧。


              反向证据并不致命，但有意义。StatusGator 显示 2026 年 5 月和 6 月多次告警窗口，并指出 2026 年 6 月 10 日有一次官方确认故障；
              对嵌入应急工作流的平台来说，即便审阅时服务正在运行，这也相关。另一个层面，GAO 2026 年 AI 采购报告和 ExecutiveGov 的摘要强调了全行业采用障碍： 评估供应商的技术专家有限、AI
              成本不确定，以及围绕 AI 合同条款或测试要求的机构学习不足。 这些问题不是 RapidSOS 特有失败，但与公司把产品势头转化为可重复的州和机构采购的能力高度相关。
