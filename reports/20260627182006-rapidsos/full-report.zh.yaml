        title: KPI 快照与风险信号
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 的公开证据足以拼出有意义的 KPI 快照，但还不足以消除尽调保留。融资、累计资本、独角兽状态、总部、
              机构覆盖、设备覆盖、响应人员覆盖、软件集成和当前战略合作伙伴，都能从留存来源中得到支撑。员工数不行。 本文审阅的公开材料和留存第三方报道，都没有干净披露当前员工数、董事会构成，或 2025
              年融资是否包含老股转让或其他影响估值质量的结构性条款。 风险也不止披露。隐私声明明确写明，RapidSOS 可能处理精确位置、健康数据、通信内容，以及 AI 辅助的路由或摘要。
              这在运营上很强，但一旦数据处理或模型输出出错，就会带来隐私、合规和责任暴露。StatusGator 提供了第二个非营销风险信号： 它的 RapidSOS 状态页称最近一次官方确认故障发生在 2026 年 6 月
              10 日，并显示 5 月下旬和 6 月上旬有多次轻微事件。 这不否定增长故事，但提醒投资人：使命关键软件除了平台杠杆，也背着可用性和治理负担。
