      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              真实采用的最佳公开证据不是 logo 墙，而是具名生产或试点使用。RapidSOS 有多条。Butler County 911 公开描述使用 RapidSOS UNITE
              查看来电者、定位精确位置、翻译和转录呼叫，并接收现场图像或视频；当地报道还引用调度负责人说， 过去需要几分钟的翻译延迟现在几乎即时完成。在南佛罗里达，Miami Police Department
              通信中心管理员称 Real-Time Interoperability 立即在屏幕上显示实时转接呼叫、转录、摘要和位置，并把它称为公共安全的重大转折。州级层面， North Carolina 911 Board
              在 Hurricane Helene 凸显了通过 AT&T ESInet 转接呼叫时保留事件上下文的价值后， 正在把 RapidSOS 互操作性扩展到跨机构。


              Virginia 地方政府页面补充了一个更专门的用例：Suffolk 称 RapidSOS 作为 Marcus Alert 的一部分嵌入 Emergency Communications Center
              协议系统，并使用 Emergency Health Profile 在紧急呼叫期间向响应人员提供行为健康和医疗上下文。这很重要， 因为它说明采用已经从通用位置丰富化延伸到危机响应工作流设计。历史技术证据早于 AI
              层。通过 NG911 Clearinghouse 进行的 Android ELS 试点显示，North Central Texas、Loudon County 和 Collier County 的 PSAP
              接收到更快、更准确的设备位置，并把它集成进现有软件； 试点材料还引用了该位置挽救生命的真实紧急事件。因此，轨迹看起来是累积式的：先是位置丰富化， 然后是数据丰富的 ECC 工作流，最后是跨辖区 AI
              辅助和网络级互操作。
