  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 位于更宽的 NG911 和公共安全工作流现代化市场中，但它不等于整个市场。FCC 对 NG911 的定义给出了清晰外边界： 可互操作、安全、基于标准的 IP 基础设施，能够通过 ESInet
              而非传统模拟系统接收和处理文本、视频、数据和其他紧急输入。 RapidSOS 通过多媒体接入、互操作、响应人员辅助 AI 和数据集成参与这场迁移，而不是捕获每一美元光纤、传输或核心服务支出。
              这个区分很重要，因为现状替代方案是分层的。有些买家可以用传统 CAD-to-CAD 集成、自建工作流或一次性多媒体工具解决一部分问题。 另一些买家先依赖电信商主导的 ESInet
              升级或基础设施供应商，再在后续加入工作流软件。留存的 RapidSOS 产品页面还显示， 公司把邻近场景扩展到中心接警之外，进入学校、执法、无人机和大型活动。这些邻近场景拓宽了商业故事，
              但仍挂在同一件核心工作上：把碎片化紧急输入转化为公共安全可共享的运营上下文。
