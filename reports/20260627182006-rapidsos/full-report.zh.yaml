      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 收入不透明是卡住估值的核心缺口
            body: >-
              RapidSOS 在任何保留公开来源中都未披露收入、毛利率、ARR 或净收入留存数字。没有收入，所有适用公开市场倍数都会给出 $77M-$202M 的隐含收入区间，用来支撑 $1.0B
              私营标记；如果不进入资料室，投资人无法判断区间中哪一段现实。
            calloutType: risk
            claimRefs:
              - CV039
              - CV041
              - CV042
          - type: callout
            title: 入场价格纪律是核心姿态
            body: 最可辩护的入场姿态，是把 2025 年 11 月 $1.0B 私营标记视为当前信息下公允价值的上限，而不是谈判底价。没有收入和利润率披露，任何显著高于该水平的入场，本质上都是押注盲目溢价，而不是基于证据定价。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV039
