      - number: '5.2'
        title: 架构与集成流
        blocks:
          - type: paragraph
            body: >-
              官方和合作伙伴文档中可见的技术流，是一条事件驱动的应急数据管道。在 911 呼叫或数字警报发生时， 联网设备和合作伙伴应用把位置和补充事件数据发送给 RapidSOS。Clearinghouse
              概览把这一层描述为符合标准的 LIS/ADR 基础设施， 能从智能手机、联网汽车、可穿戴设备、应用和 IoT 设备接收数据，并在呼叫送达后的毫秒级时间内交付给公共安全部门。 同一份文档也明确说明，RapidSOS
              是对既有运营商数据的补充，而不是替代：基于设备的混合定位和富数据与传统 ALI、运营商信息并行到达。 在这个数据平面之上，UNITE 把语音、文本、视频、呼叫者上下文、响应人员工作流和分析融合到一个接线员视图中。


              HARMONY AI 位于这个工作流内部，而不是旁边。它转录呼叫、实时翻译语言、汇总事件、支持自然语言查询， 并能自动化非紧急或车联网重的流程。Real-Time Interoperability
              通过在呼叫重新路由时同步转录、摘要、聊天和呼叫者上下文， 把流程扩展到机构边界之外。公开职位描述也证明这不是简单的宣传册栈：其中提到 ingress API、webhook、分布式系统故障排查、
              上线后合作伙伴健康度和持续集成演进。合在一起，图景是一张网络平台：它依赖标准化接入、编排进入 ECC 工作流， 并与公共安全和企业合作伙伴环境中的软件完成集成。
