      - CR022
      - CR024
      - CR038
      - CR041
      - CR043
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 因果流展示隐私、网络、AI 和伙伴等根层风险，如何经合规动作和服务中断，传导到收入、任务和平台价值。
    data:
      nodes:
        - id: privacy_breach
          label: 隐私 / 数据泄露
          type: input
        - id: cyber_attack
          label: NG911 网络攻击
          type: input
        - id: ai_failure
          label: AI 路由失败
          type: input
        - id: partner_loss
          label: Axon / Motorola 伙伴关系丧失
          type: input
        - id: funding_cuts
          label: PSAP 资金削减
          type: input
        - id: staffing
          label: PSAP 人员短缺
          type: input
        - id: compliance_action
          label: 监管 / 法律行动
          type: process
        - id: service_outage
          label: 服务中断
          type: process
        - id: adoption_friction
          label: 采用摩擦
          type: process
        - id: revenue_risk
          label: 面临风险的收入
          type: output
        - id: mission_risk
          label: 任务失败风险
          type: output
        - id: platform_value
          label: 平台价值受损
          type: output
      edges:
        - from: privacy_breach
          to: compliance_action
          label: 触发执法
        - from: ai_failure
          to: compliance_action
          label: 产生责任
        - from: cyber_attack
          to: service_outage
          label: 造成中断
        - from: ai_failure
          to: service_outage
          label: 削弱路由质量
        - from: partner_loss
          to: service_outage
          label: 移除数据通道
        - from: partner_loss
          to: adoption_friction
          label: 削弱生态触达
        - from: funding_cuts
          to: adoption_friction
          label: 放慢采购
        - from: staffing
          to: adoption_friction
          label: 降低 PSAP 采用率
        - from: compliance_action
          to: revenue_risk
          label: 罚款和修复成本
        - from: service_outage
          to: mission_risk
          label: 应急数据缺口
        - from: service_outage
          to: revenue_risk
          label: SLA 罚金和流失
        - from: adoption_friction
