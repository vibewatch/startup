  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买家与付款方
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 至少服务两组经济属性不同的客户。一侧是公共安全机构：ECC、PSAP、调度负责人、州级 911 委员会和现场响应人员组织， 它们在应急工作流中消费 RapidSOS 数据。官方 FAQ
              材料称，超过 23,500 家一线响应机构在每年超过 1.71 亿次紧急事件中使用 RapidSOS； HARMONY 产品页则称，5,700 个以上 911 中心已经使用这个 AI
              工作流界面。另一侧是把数据贡献进网络的企业和设备合作伙伴。 RapidSOS 称，超过 250 家企业组织把设备、应用和服务接入平台；Clearinghouse 概览则说明商业分工： 公共安全部门免费获得
              Clearinghouse，而联网设备公司为增值安全服务向 RapidSOS 付费。


              这形成了双边采用模型。机构是运营用户，但付款责任往往在入站侧的企业集成方，以及机构侧的可选高级模块。 公开材料还显示，细分覆盖商业安防、联网汽车与车联网、个人安全、家庭安防、学校、铁路和可穿戴设备。
              从客户分析角度看，RapidSOS 不只是调度员桌面供应商；它是网络中介，采用取决于机构工作流渗透和企业数据贡献两端。
