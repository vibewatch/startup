      - number: '4.2'
        title: 牵引力、分发与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              作为一家私营公共安全技术公司，RapidSOS 发布了异常扎实的运营规模信号。公司现在称已支持超过 10 亿次紧急事件、 连接 22,000+ 至 23,500+ 家机构、200+ 至 250+
              家企业、600M+ 至 723M+ 台设备或数据输入， 以及 100 万名一线响应人员用户。这些是有分量的证明点，说明平台不是早期试点。AT&T ESInet 关系又增加了一个正向代理指标： 它能把
              RapidSOS 情报挂到可信的州级基础设施路径上，而不是要求每个机构购买完全独立的栈，从而降低采购摩擦。 Northern911 也让连续性服务成为可见运营路径，加深了实际产品故事。


              即便如此，销售效率仍是推断而非已被承销。留存来源没有披露 CAC、回本周期、实施小时数或真实追加销售。 公开牵引指标也不等于收入。连接机构、连接设备和支持紧急事件在战略上很重要，
              但它们不会告诉投资人这片覆盖中有多少转化为已确认收入、客户扩张多快，或销售动作在规模化后是否更高效。
