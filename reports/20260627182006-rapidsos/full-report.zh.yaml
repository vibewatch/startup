      - number: '1.2'
        title: 领导层、资本基础与利益相关方
        blocks:
          - type: paragraph
            body: >-
              领导层档案显示公司由创始人主导，但公开信息比资本叙事更薄。Inc. 和公司现有材料清楚标明 Michael Martin 是创始人兼 CEO，但留存来源只能看到一部分更广的高管团队。Karin Marquez
              在当前产品信息中以 Chief Public Safety Brand Officer 身份出现，公司公开材料也高度依赖 Martin 作为战略、融资和使命的发言人。这种不对称很重要，因为资本故事格外突出。
              RapidSOS 于 2025 年 11 月 19 日宣布由 Apax Digital Funds 领投的 $100M 融资；公司、通讯社、行业和商业媒体来源都重复同一组核心信息： 累计融资超过
              $450M。Inc. 进一步称该轮融资把估值推到 $1B 以上，这是本章留存公开估值标记中最强的一条。 利益相关方不止投资人。AT&T 重要，因为它提供通向 NG911 基础设施的分发；Google
              重要，因为它扩展了多媒体输入； 州级买家也重要，因为 RapidSOS 销售的是韧性和互操作性，而不只是应用级功能。
