  - id: FR003
    title: 依赖地图
    type: dag
    layout: wide
    summary: RapidSOS 靠监管机构、基础设施伙伴、设备平台和 PSAP 客户共同支撑；每个上游节点都有单独的失效情景，已记录在伙伴风险台账中。
