      - number: '8.3'
        title: 可比估值组与牛 / 基准 / 熊情景
        blocks:
          - type: paragraph
            body: >-
              三家美国上市公司构成可比组：Motorola Solutions (MSI)、Axon Enterprise (AXON) 和 Tyler Technologies (TYL)。三家公司均向 SEC 提交了
              2025 年年报，审计财务报表让其倍数成为可靠锚点。Motorola 于 2026 年 2 月 13 日提交，Axon 于 2026 年 2 月 27 日提交，Tyler 于 2026 年 2 月 18
              日提交。[CV020] [CV021] [CV022] Motorola 和 Tyler 的 IR 页面及年报落地页确认其持续公开申报人身份。[CV023] [CV024]

              Motorola Solutions 是公共安全硬件和软件平台的既有龙头，收入 $11.9 billion，企业价值 $75.6 billion，对应 6.4× EV/revenue。[CV014]
              [CV015] 其风险更低、硬件更重的画像，使它更适合作为底部参考而非上限。Axon Enterprise 在 $3.0 billion 收入和 $38.6 billion EV 上交易于 12.9×
              EV/revenue，反映出更高软件强度，以及强于典型政府软件可比公司的增长。[CV016] [CV017] Tyler Technologies 居中，约 5.0× EV/revenue（$11.8
              billion EV、$2.4 billion 收入），代表政府软件定位，但没有另外两家公司那样的公共安全特异性。[CV018] [CV019] TV004 列出完整可比组。

              FV002 把这些倍数换算为 $1.0 billion EV 标记下的隐含收入门槛：按 Tyler 底部（5×），RapidSOS 需要约 $202 million 收入；按 Axon 上限（12.9×），约
              $77 million 即可支撑。这个区间之所以宽，正是因为收入未披露。TV003 将牛、基准、熊三种情景映射到明确假设和隐含估值区间。基准情景锚定 $100-$180 million 收入区间、2026
              年留存稳定且现有渠道伙伴关系完好，对应 6-8× 收入、$0.9-$1.5 billion EV。牛市情景要求披露收入超过 $200 million 且 NRR 改善；只有经济性改善到足以支持 Axon
              式待遇时，10-13× 才站得住。熊市情景假设收入低于 $100 million，或公共部门支出下行，把隐含 EV 压缩到 $300-$800 million，低于当前轮次标记。[CV041] [CV042]
