      - number: '7.5'
        title: 人员、执行风险与缓释
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 的执行风险最直观地体现在管理规模与承载这些工作的团队人数之间的落差。LeadIQ 数据显示其北美员工约 305 人，而公司公开声称支撑 22,000 多家机构、100 多万名一线响应人员和 6
              亿多台联网设备。这个比例意味着运营杠杆很高；对软件定义平台而言，这本身不一定是问题，但如果关键 AI
              工程、公共安全领域能力或机构实施职能相对承诺面配备不足，就会变成实质风险。公开材料里的领导层画像较薄——Michael Martin 被清楚标识为 CEO 和创始人，Karin Marquez 以 Chief
              Public Safety Brand Officer 身份出现，但更广泛的领导班子没有公开披露。由此形成集中在创始人 CEO 身上的关键人依赖，公开来源中看不到接班规划。Craft.co
              高管页面也印证了有限可见性——公开出现的高管集合很小。缓释方面，公司具备几项可信的结构性保护。AT&T ESInet 分发把 HARMONY AI 放进受信任的 NG911
              基础设施，而不是公共互联网，从而限制部分网络风险。合规页面和信任中心提供了公开披露锚点。使用条款和隐私通知建立了法律治理框架，即便其在新型 AI 路由场景中的执行效果仍未经过检验。分布在公共安全司法辖区的
              22,000 多家机构基础提供了收入多元化，部分抵消单个机构预算风险。下方缓释表和终止标准登记表把每项主要风险转化为可监测阈值和行动含义，便于投资人持续跟踪风险画像。
