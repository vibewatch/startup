companyProfile:
  summary: >-
    RapidSOS 是一家创始人主导的私营公共安全软件公司，处在联网设备、企业数据提供方和应急响应机构之间。 它的商业叙事已从把智能手机定位接入 911，转向运营更宽的 AI 工作流和互操作层，覆盖 HARMONY AI、UNITE、
    多媒体、互助和响应人员协同。公开证据在网络规模和部署势头上异常扎实，但经济性、治理细节和股权结构仍偏薄。
