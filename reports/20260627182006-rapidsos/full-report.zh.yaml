      - number: '1.3'
        title: 里程碑与平台扩张
        blocks:
          - type: paragraph
            body: >-
              公司概览中最强的证据，是从融资一路延伸到更宽平台范围的里程碑轨迹。2025 年 11 月是关键节点： RapidSOS 把 Apax 领投融资与支持 10
              亿次紧急事件、并在机构、企业、设备和响应人员中大规模采用的主张放在一起。 2026 年，公司继续把故事做宽。1 月公开推动实时互操作，4 月把 HARMONY AI 放进 AT&T ESInet， 6
              月又把更大的架构重新包装为 Safety Network，并给出比 11 月融资公告更大的公开计数器。并购和合作伙伴动作强化了同一方向。 Northern911 补上备用接警和互助能力，Total
              Response 加深调度工作流经验，Arlo 扩展视频核验， Google 增加来自 Android 呼叫者的实时视频。单看任何一件事，都无法证明深度变现；合在一起， 它们显示 RapidSOS
              正试图从位置传递演进为更宽的公共安全操作层，覆盖接入、协同、自动化和跨辖区互操作。
