      - number: '2.2'
        title: 规模测算视角与受约束的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 所处市场的公开规模高度依赖定义，因此本章保留几种彼此不兼容的视角，而不是假装存在一个干净 TAM。 Frost & Sullivan 给出最清楚、可获取的宽口径：美国 NG911 市场从
              2021 年的 $888.1M 增长到 2026 年的 $1.19B， CAGR 为 6.1%。立法和倡议来源描述的是另一层：完成迁移仍需要的公共投资金额。NENA 称 NTIA 的 2026
              年工作仍意味着一项持续多年、 数十亿美元级的联邦承诺；Urgent Communications 则显示政策制定者仍在争论资本需求是否更接近此前引用的 $15B 水平，
              以及资金从哪里来。这些数字不是互相矛盾，而是计量单位不同：一个是年度市场收入，另一个是全国现代化所需资本。 因此，RapidSOS 专属 SAM 应窄于完整 NG911 基础设施市场，更接近卖给州、PSAP
              和邻近垂直场景的软件、互操作、多媒体和响应人员辅助层。 公开 SOM 仍低置信度，因为留存来源没有暴露附着率、定价或转化率。
