  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与地址记录
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 更适合被理解为应急响应数据和工作流平台，而不是泛通信供应商。已审阅来源一致把公司描述为一套软件： 从人员、传感器、警报和联网设备中发现紧急事件；融合位置、健康、视频和事件上下文；
              再把这些情报送到公共安全机构和响应人员手里。公开档案中最具体的公司事实来自 RapidSOS 自己的应急服务隐私声明， 其中列明 RapidSOS Inc. 位于纽约市 161 Madison
              Avenue。这份法律声明也解释了为什么产品类别重要： RapidSOS 在启用时可能处理精确地理位置、健康信息、设备元数据、通信内容，甚至图像或视频流。换句话说，
              公司的身份与其在应急工作流中承担的数据密集型运营角色不可分割。Frost & Sullivan 2024 年奖项文章也强化了同一图景： 它把 RapidSOS 描述为纽约市的智能安全公司，并强调 RapidSOS
              UNITE 是 AI 驱动的 NG911 工作流平台。 这些来源合在一起，支撑一个清晰的一句话描述：RapidSOS 销售使命关键公共安全软件， 把来自联网设备和企业的应急情报导入响应人员工作流。
