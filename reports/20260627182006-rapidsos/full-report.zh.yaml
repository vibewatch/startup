      - number: '8.4'
        title: 投资评分卡与风险校准
        blocks:
          - type: paragraph
            body: >-
              FV004 按七个 IC 维度给投资打分。市场机会得分较高（7/10），因为 NG911 转型受联邦强制推动，911.gov 资助计划提供反复出现的需求信号，FCC 监管框架也处于活跃状态。[CV035]
              [CV036] 但 GAO 关于关键任务 IT 采购缺口的发现，以及 NENA 2024 年关于人员短缺和技术采用障碍的调查，都限制了机构升级速度，使评分低于顶级。[CV029] [CV034] 平台和产品同样得
              7/10，反映出 AI 赋能流程、Apple Emergency SOS 与 Google Android 集成、以及超过 6 亿台联网设备网络的持续公开证据。[CV005] [CV027] [CV028]

              竞争护城河得 6/10。Motorola Solutions 和 Axon 当前是分发伙伴，但它们经营相邻公共安全市场，且拥有资本和渠道关系来内化可比能力。[CV025] [CV026] Intrado 与
              Mission Critical Partners 的 2026 报告指出行业整合趋势和互操作压力，但未消除伙伴转竞争对手的风险。[CV031] [CV032] NENA 2025 Pulse
              报告是第三年度版本，确认 911 技术兴趣持续存在，同时也指出人力资本约束会限制采用节奏。[CV033]

              财务经济性仅得 3/10，是最低维度，因为收入、利润率、NRR 和现金消耗全部未披露。[CV039] 风险得 4/10：Washoe County 合同文件确认，多 PSAP
              采购涉及详细工作范围要求和预算授权；911.gov 网络安全框架也指出 911 生态存在持续基础设施漏洞。[CV030] [CV037] 估值支撑得 4/10，因为 $1.0 billion
              私募轮标记没有收入锚点，PM Insights 也提示，订阅墙后的二级估值信号很稀薄。[CV038] 证据质量得
              5/10：规模主张来源充分，并由一线证据交叉印证，但驱动严谨估值所需的经济输入仍只存在于私有资料中。LeadIQ 显示公司有 201-500
              名员工，这与其收入足迹下“规模显著但未超大化”的人员规模一致。[CV013]
