      - number: '5.3'
        title: 部署、可靠性与依赖地图
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 看起来以云原生、合作伙伴密集的平台形式部署，其价值既取决于核心产品功能，也取决于实施质量。 最强的公开工程线索来自招聘材料。实施工程师岗位聚焦 B2B 合作伙伴入驻、端到端工作流建议、API
              问题排查和实时集成健康监控。 SRE 领导岗位指向 Kubernetes 集群、AWS 核心基础设施、多区域故障转移测试、Terraform/Atlantis 基础设施即代码、 RabbitMQ 消息，以及
              Datadog 等可观测性工具。这与一个必须接入突发应急流量、集成第三方系统并跨区域保持高可用性的平台一致。


              依赖地图也相应很宽。入站侧，RapidSOS 依赖设备 OEM、应用开发者、警报、车联网和企业平台贡献数据。 中间层依赖 API、合作伙伴入驻和云可靠性。出站侧依赖 ECC 采用、CAD
              集成、现场响应人员工作流， 以及在部分扩张场景中依赖 AT&T ESInet 或 Northern911 备用服务。可靠性故事可信，但并非无摩擦。 产品页面强调故障韧性、冗余路径和备用 911
              运营，但外部状态监测仍记录了多次告警，并在 2026 年 6 月记录一次官方确认故障。 对嵌入应急工作流的系统来说，运营成熟度因此既是差异化因素，也是持续尽调议题，而不是已经打勾完成的事项。
