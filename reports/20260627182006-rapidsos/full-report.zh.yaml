  - id: FV001
    title: 建议逻辑流程
    type: flow
    layout: wide
    summary: 决策链从规模证据、伙伴验证、收入不透明、估值标记、可比公司区间和行业逆风出发，落到「继续研究 / 跟踪」建议。
    data:
      nodes:
        - id: scale-proof
          label: 规模证据
          note: 22K+ 个机构、1B+ 起紧急事件、600M+ 台设备（CV004-CV007）
        - id: partner-proof
          label: 伙伴生态
          note: 伙伴：AT&T ESInet、Google Android、Motorola Solutions、Axon（CV025-CV028）
        - id: revenue-gap
          label: 收入不透明
          note: ARR、利润率、NRR 均未披露；无 SEC 文件（CV039、CV045）
        - id: valuation-marker
          label: 私募标记约 $1.0B
          note: 2025 年 11 月 Premier Alts 标记；Inc. 独角兽报道（CV002）
        - id: comp-range
          label: 可比倍数区间
          note: 4.96x-12.92x EV/rev；缺少 RapidSOS 收入锚点（CV015、CV017、CV019）
        - id: headwinds
          label: 公共部门逆风
          note: GAO IT 缺口；NENA 人手配置；Washoe 采购审查（CV029、CV034）
        - id: recommendation
          label: 继续研究 / 跟踪
          note: 中等置信度 | 高风险 | 估值偏紧
      edges:
        - from: scale-proof
          to: recommendation
        - from: partner-proof
          to: recommendation
        - from: revenue-gap
          to: recommendation
        - from: valuation-marker
          to: recommendation
        - from: comp-range
          to: recommendation
        - from: headwinds
          to: recommendation
    approximationNotes: 节点权重为定性判断；六个输入维度在展示中按同等贡献处理，仅用于呈现决策逻辑。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV015
      - CV017
      - CV019
      - CV029
      - CV039
  - id: FV002
    title: 估值敏感性——$1.0B EV 标记隐含的收入
    type: bar
    layout: standard
    summary: 在每个公开市场 EV/revenue 倍数下，柱状条显示 RapidSOS 要支撑 2025 年 11 月约 $1.0B 私募标记所需的收入水平。跨度很宽，因此收入披露是首要尽调问题。
    data:
      items:
        - label: Tyler 下限（4.96x）
          value: 202
        - label: Motorola（6.37x）
          value: 157
        - label: 中点（8.0x）
          value: 125
        - label: 增长溢价（10.0x）
          value: 100
        - label: Axon 上限（12.92x）
          value: 77
    approximationNotes: 收入数值按 $1,000M 除以上述倍数计算，并四舍五入到最接近的百万美元。RapidSOS 尚未披露收入；这些是情景门槛，不是实际收入估算。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV041
      - CV042
  - id: FV003
    title: 估值区间——熊市 / 基准 / 牛市带
    type: range
    layout: standard
    summary: 三种情景的方向性估值带以 2025 年 11 月 $1.0B 私募标记为锚，用公开可比公司倍数套用假设收入区间得出。所有数值单位为百万美元。
    data:
      items:
        - label: 熊市
          low: 300
          high: 800
        - label: 基准
          low: 800
          high: 1500
        - label: 牛市
          low: 1500
          high: 2500
    approximationNotes: 区间来自将可比倍数（4.96x-12.92x EV/revenue）套用到估计收入情景（熊市低于 $100M，基准 $100M-$180M，牛市高于 $200M）。RapidSOS 未披露收入；这里只做边界分析，不构成预测。
    claimRefs:
      - CV002
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向投委会的评分覆盖七个投资维度，采用 0-10 分制。收入完全不透明，财务经济性得分最低；市场机会和平台得分最高。
    data:
      items:
        - label: 市场机会
          value: 7
          note: NG911 TAM 很大；联邦要求已生效；预算周期和人手配置拖慢采用节奏
        - label: 产品与平台
          value: 7
          note: AI 工作流；600M+ 台设备；接入 Apple 和 Google；经济性证据完全缺失
        - label: 竞争护城河
          value: 6
          note: 机构与设备网络；AT&T ESInet 分发；伙伴转为竞争对手的替代风险存在
        - label: 财务经济性
          value: 3
          note: 收入、利润率、NRR 和烧钱速度均未披露——这是卡住尽调的缺口
        - label: 风险画像
          value: 4
          note: 高风险——采购摩擦、不透明、伙伴集中和股权结构未知
        - label: 估值支撑
          value: 4
          note: 只有单一 $1.0B 私募轮标记，缺少收入锚点；若入场价高于该标记，估值偏紧
        - label: 证据质量
          value: 5
          note: 规模主张有一手级证据充分支撑；经济性输入完全停留在私有信息中
    approximationNotes: 评分是基于截至 2026-06-27 留存证据作出的 0-10 分定性评估。它们不是量化模型输出，也不应被视为数字化价格目标。
    claimRefs:
      - CV004
      - CV005
      - CV025
      - CV026
      - CV029
      - CV034
      - CV035
      - CV039
