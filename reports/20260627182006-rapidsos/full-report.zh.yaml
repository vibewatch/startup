      - number: '8.5'
        title: 论点破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              TV005 列出六个论点破裂触发器，覆盖收入披露、伙伴流失、降价轮机制、公共部门支出、治理执行和竞争替代。最重要的近期触发器是投前估值等于或低于 $1.0 billion
              的降价轮，或结构复杂融资；这会释放增长停滞信号，并加重已经无法从公开来源量化的清算优先权悬置。[CV040] [CV047] Washoe County
              合同文件是采购摩擦的具体说明信号，即使产品口碑良好，该摩擦也会拖延机构续约——文件显示了多 PSAP 工作范围语言、预算授权要求和具体服务水平条款。[CV046]

              TV006 把六个证据缺口转化为按优先级排列的尽调问题清单。收入和 ARR 披露是最高优先级问题；没有它，任何倍数都算不出来，也无法用真实数据锚定情景。毛利率和 NRR 紧随其后，因为二者决定适用可比倍数更接近
              Motorola 底部还是 Axon 上限。股权结构表和优先权结构披露同样关键，因为十多年融资超过 $450 million，很可能包含多层优先权，可能相对 $1.0 billion
              名义估值显著改变真实回报数学。[CV001] [CV040] [CV047] 伙伴收入占比是第五个问题：如果 Motorola Solutions 或 Axon 合计贡献超过 30%
              收入，投资论点和伙伴关系就同时背负依赖与替代风险。[CV025] [CV026]

              本章收束到开篇同一个判断：继续研究 / 跟踪，中等信心，高风险；若价格高于当前 $1.0 billion 私营标记，则估值偏高。在收入和利润率摆上台面之前，核心姿态是在 2025 年 11
              月标记价或以下保持入场纪律。
