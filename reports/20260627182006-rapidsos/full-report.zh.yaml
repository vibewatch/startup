              扩张路径可见。官方材料显示一个更宽的网络，可销售给企业安全团队、学校、车联网、商业安防和现场响应人员软件； 产品页面和合作伙伴证据也显示，通过 CAD 集成、学校、车辆和响应人员工具可以加深附着。AT&T
