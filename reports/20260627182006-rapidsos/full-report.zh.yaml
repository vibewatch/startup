  - id: TV005
    title: 论点破裂与终止触发条件
    columns:
      - 触发条件
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 披露收入不及预期
        - 披露 ARR 或收入低于 $80M
        - 在 $1.0B 标记下意味着 EV/收入 超过 12x——即便相对 Axon 也贵；论点缺少支撑
        - 要求重新谈判入场价，或完全退出该论点
      - - 重大合作伙伴流失
        - Motorola Solutions 或 Axon 终止或实质性减少 RapidSOS 集成
        - 移除估计 25-40% 的设备侧分发渠道；护城河叙事受损
        - 重新评估网络效应主张；要求提供 PSAP 直销留存数据和流失数字
      - - 降价轮或重结构化融资
        - 下一轮以 $1.0B 投前或以下成交，或带有反稀释调整优先权
        - 释放增长停滞信号；加重优先权悬置；显著稀释普通股
        - 降低敞口；厘清按比例跟投资格；重新进入前先建模优先权堆栈
      - - 公共部门预算持续收缩
        - 联邦 911 补助项目冻结；州机构将 PSAP 升级推迟超过 12 个月
        - 放慢机构采用和续约节奏；基准收入区间向悲观情景偏移
        - 在公共部门支出减少 20% 的假设下，搭建 2 年收入情景
      - - 治理或数据隐私执法行动
        - 因 911 数据处理或 HARMONY AI 模型输出引发监管执法行动
        - 诉讼风险上升，机构买方信任被侵蚀；可能被取消采购资格
        - 标记为阻断项；让法律团队审查 DPA 条款、AI 责任条款和审计日志
      - - 被大型在位厂商竞争替代
        - Motorola Solutions 或 Axon 推出与 ESInet 同等能力的原生 911 AI；机构可在合同内替换
        - 分发伙伴变成直接竞争对手；最可防守的渠道关闭
        - 终止触发——重新评估独立 RapidSOS 论点是否仍成立
    notes: 阈值是方向性的，不是合同条款；它们代表某个证据点，一旦出现，保留研究基础会把建议从跟踪转为回避。考虑到优先权堆栈和合作伙伴收入集中度未披露，降价轮与合作伙伴流失是最关键的触发项。
    claimRefs:
      - CV002
      - CV014
      - CV025
      - CV026
      - CV029
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入和 ARR
        - 过去 3 个财年的收入、ARR 运行率和季度增长轨迹
        - 没有收入就无法计算倍数；$1.0B 标记只基于轮次；悲观风险无法量化
        - 管理层资料室；CFO 演示；经审计财务报表或经复核的中期报表
      - - 毛利率和单位经济
        - 毛利率百分比；按托管、支持和专业服务拆分的 COGS；CAC 和 LTV
        - 毛利率决定情景应锚定 Motorola（6x）还是 Axon（13x）倍数
        - 管理层资料室；对照 Axon 和 Tyler 2025 年 10-K 披露的利润率
      - - 净收入留存和流失
        - 按 PSAP 群组披露 NRR 或总美元留存；平均合同期限；提前终止条款
        - NRR 高于 110% 才能支撑溢价软件估值；低于 100% 会让网络效应叙事失去支撑
        - 管理层资料室；按机构规模和合同年份索取群组留存瀑布表
      - - 股权结构表和优先权堆栈
        - 截至运行日期的完整资本结构表；投资者优先权；清算瀑布分析
        - 12 年多融资 $450M+，很可能叠加多层优先权；没有堆栈信息，$1.0B 标题估值可能误导
        - 法律审查投资者权利协议、章程和附函摘要；分析 2025 年 11 月轮次的投前 / 投后估值
      - - 合作伙伴收入集中度
        - Motorola、Axon、AT&T 和直销渠道之间的收入拆分；合同续约条款
        - 若前 2–3 家合作伙伴贡献超过 30% 收入，该论点就带有集中和替代风险
        - 管理层渠道收入拆分；合作协议；按渠道索取前 10 大收入来源
      - - 二级市场估值新鲜度
        - 2025 年 11 月以来最新共同基金 NAV 标记或二级交易
        - PM Insights 提示存在订阅墙内信号；2025 年 11 月标记已有 7 个多月，条件已变化
        - Forge、Nasdaq Private Market 等二级经纪；共同基金文件；PM Insights 完整报告
    notes: 尽调问题按其对建议变化的影响排序。收入和 ARR 能打开所有情景分析，应成为任何管理层讨论中的第一个问题。
