            body: >-
              耐久性比采用更难证明。公开材料显示清楚的装机基础广度和少数具名生产用户，但没有披露 NRR、GRR、流失、合同期限或分群留存。 这很重要，因为 RapidSOS 现在销售的是工作流和 AI
              层，而不只是原始位置丰富化。最强的留存邻近证据来自公开客户引用和合作伙伴集成中的持续使用： Butler County 在 2026 年使用 UNITE；Miami 正在主动使用互操作性；North
              Carolina 正在全州扩展； IamResponding 描述了一项活跃的 RapidSOS 集成，可在一次 CAD 事件中最长 10 分钟提供实时呼叫者位置、面包屑轨迹、 不确定性半径和额外应急上下文。


              评价证据弱于机构证据。FeaturedCustomers 汇总评论、案例研究和客户视频，但它是营销色彩很重的来源。 PeerSpot 提供的实质性评论细节很少；SoftwareWorld
              则复制通用产品文案，甚至与官方材料矛盾，称 RapidSOS 不提供 API。 这不否定客户价值，但会降低对公开第三方留存或满意度信号的信心。实际结论是， RapidSOS 嵌入 911
              工作流的地方耐久性看起来最强；但投资人想看的 SaaS 式续约分析，公开证据要弱得多。
