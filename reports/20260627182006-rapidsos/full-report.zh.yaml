  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 卡在关键公共安全基础设施和已商业化扩张的 AI
              软件交汇处，风险画像既有应急服务失灵带来的责任重力，也有后期成长型公司常见的执行不确定性。基于保留的公开证据，缓释前有五类风险达到关键或高等级。严重度最高的单项风险首先是隐私或数据泄露事件：公司在隐私通知中承认，在应急场景下可能处理精确地理位置、健康信息、设备元数据、通信内容以及图片或视频流。第二，RapidSOS
              嵌入的 IP 化 NG911 网络可能遭遇网络攻击——CISA 和 911.gov 网络安全页面都把扩大的攻击面明确列为当前担忧，并指出黑客可以压垮 PSAP 线路，或访问、篡改应急数据。第三，HARMONY 的
              AI 路由或优先级排序可能失灵；隐私通知承认，这些系统可能影响应急通信的路由和优先级，从而形成直接责任敞口。紧随其后的是伙伴和平台集中度：Axon 与 Motorola Solutions
              是两个被点名的主要集成锚点；公共部门采购摩擦又叠加 PSAP 人员短缺，NENA 和 Mission Critical Partners 将其列为 911 行业头号挑战；公司已融资超过 $450
              million，却未披露收入、利润率或现金消耗，财务模型不透明。其余重大风险——约 305 名北美员工支撑 22,000 多家机构、通过 Apple Emergency SOS 和 Android
              定位权限形成的设备级 OS 依赖、以及尚未确认存在活跃联邦诉讼——都是真实风险，但从现有证据看相对可控。下方风险热力图展示所有风险簇按严重度和可能性分布的情况。
