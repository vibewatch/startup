  - id: FR001
    title: 风险严重度 vs. 发生可能性热力图
    type: matrix
    layout: wide
    summary: 按缓释前的发生可能性和影响严重度映射风险簇；关键簇出现在右上方单元格。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - label: AI 路由失败；估值不透明
              tone: negative
            - label: 隐私 / 数据泄露；NG911 网络入侵
              tone: negative
            - label: 大规模事件服务中断；IP 网络攻击
              tone: negative
        - label: 高影响
          values:
            - label: 州法院诉讼；MSA 争议
              tone: neutral
            - label: 伙伴集中（Axon / Motorola）；关键人物风险；PSAP 预算削减
              tone: negative
            - label: PSAP 人员配置逆风；Fortune 10 流失；人员规模约束
              tone: negative
        - label: 中等影响
          values:
            - label: 民权 / 偏见主张
              tone: neutral
            - label: 设备 / OS 权限丧失；模块停机
              tone: neutral
            - label: 采购摩擦；传统 PSTN 边缘案例
              tone: negative
