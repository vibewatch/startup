      - number: '2.3'
        title: 买家、用户与采购路径
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 的购买动作不是简单的单席位软件销售。州政府和互操作页面显示，采购往往从 911 主管机构、州级协调者或区域领导者开始； 他们要解决本地 PSAP 之间的碎片化、故障风险和服务水平不均。ECC 和
              PSAP 领导者是运营用户， 因为他们需要在实时应急工作流中使用文本、视频、翻译、QA 和路由工具。现场机构——执法、消防、EMS、校园安全，
              有时还有无人机响应团队——在下游消费输出。预算负责人随销售动作而变：州级现代化项目可能由 911 委员会或公共安全机构控制， 学校或执法垂直部署则可能挂在地方安全预算下。采购机制也塑造购买路径。911.gov
              强调对联邦拨款的依赖， LegalClarity 提到此前拨款轮次的 40% 配套资金要求；SAM.gov 和 eVA 等公共采购门户也解释了为什么周期常常正式、 由州管理且合规负担重。AT&T ESInet
              和平台合作伙伴分发可以降低摩擦，但无法改变很多买家仍按公共部门节奏推进的现实。
