      - number: '7.2'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 的监管和法律敞口异常集中在少数高风险领域：适用于应急级敏感数据的联邦和州隐私法；直接决定公司基础设施表现要求的 NG911 迁移强制事项；以及生命安全场景中 AI
              辅助决策系统天然带来的责任。隐私和数据处理方面，公司自己的法律文件是最直接的证据来源。最后更新于 2022 年 12 月 14 日的使用条款，明确约束 RapidSOS 订阅方、伙伴关系和 Emergency
              Communications Center 用户。应急相关服务隐私通知覆盖更广人群，包括响应人员、报警人、联网设备运营方和合作伙伴，并说明会随法律、法规或行业实践变化而更新。最重要的是，隐私通知承认
              RapidSOS 的 AI 自动化系统可能影响应急通信的路由或优先级，以及响应人员接收的事件信息。这是公司层面最清晰的承认：如果 HARMONY
              输出的路由或优先级决定在活跃应急事件中造成伤害，或漏掉关键数据点，就可能产生责任。监管合规方面，FCC 于 2024 年 7 月发布的规则要求始发服务提供商启动或继续向安全、基于标准、可互操作的 NG911
              系统迁移。CISA 进一步把这定义为互联的公私网络安全义务。911.gov 网络安全页面把风险说得很具体：IP 化 911 数据共享扩大网络攻击面，也给黑客压垮 PSAP 基础设施打开路径。两份 2025 年
              GAO 报告补充了更宽的联邦背景：一份发现其研究的 16 个大型联邦 IT 项目中有 7 个存在显著隐私和网络安全风险；另一份发现，执法技术可能引发民权、公民自由和隐私担忧，这与 AI 辅助调度直接相关。本轮
              PACER 检索未发现公开联邦案件，因此这里把诉讼风险界定为隐私、合同和合规敞口，而不是已确认的活跃联邦诉讼。州法院检索仍是未完成的尽调事项。下方监管与法律风险登记表和风险传导图列出完整清单及因果路径。
