      - number: '3.4'
        title: 护城河耐久性与竞争对手反向证据
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 护城河耐久性的最佳论点是广度：一个横跨机构、企业、车联网、视频、文本和互助连续性的外部安全网络， 是与简单调度控制台明显不同的资产。这个论点最弱的地方在于竞争者行动很快。Prepared 出售给
              Axon 显示， 911 AI 现在可以被捆进更大的公共安全生态。Carbyne 把自己营销为基础设施，而不只是软件。Mark43 和 CentralSquare
              都强调集成深度，削弱了互操作性话术的排他性。RapidSOS 自己的 Northern911 发布也隐含承认， 故障、路由和人员配置韧性仍是难题；这对 RapidSOS
              有商业用处，但也提醒市场，可靠性仍是一个活着的品类弱点。


              实际判断需要保留细微差别。RapidSOS 在外部网络输入，以及企业与公共安全参与方之间的互操作性上仍显得差异化。
              但只有当这些输入转化为已证明的替换、更好的续约和低于当前公开记录所能显示的多供应商并用时，护城河才算耐久。
              目前证据在竞争形态上很强，在持久账户经济性上偏弱。足以说明公司有真实战略位置，但还不足以说护城河已被充分承销。
