  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价架构与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据让 RapidSOS 的变现逻辑比实际财务报表更清楚。              公司不像消费应用或交易型工具那样商品化。 官方界面把它定位为进入机构和企业工作流的使命关键应急情报；AT&T ESInet
              发布显示，至少一条主要销售路径借助既有公共安全采购和传输层。 Northern911 收购增加了另一条可见路径：连续性和备用运营能力，可以作为韧性出售，而不只是作为数据丰富化出售。
              这些事实支撑一个判断：RapidSOS 通过机构合同、企业关系、合作伙伴集成和韧性导向模块变现，而不是靠一个简单的按事件计价模型。


              弱点在于公开定价几乎完全不透明。已审阅材料没有提供标价、折扣阶梯、标准实施费或收入确认政策。 即便商业动作能看懂，实际定价也看不到。因此，收入架构看起来具有经常性特征和战略价值，
              但本章无法只凭公开证据证明平均合同价值、贡献利润率或收入结构。
