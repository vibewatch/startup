      - number: '7.3'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              RapidSOS
              的运营风险由两组结构性张力决定：公司为应急响应流程提供软件，而可用性在该流程中就是生命安全要求；同时，公司又借助一条外部平台和伙伴依赖链交付服务，直接控制力有限。服务可靠性方面，StatusGator
              公开监测三个不同产品面：RapidSOS 主服务、Data Connect 模块和 Alerts 模块。即便没有公开
              SLA，模块级外部监测的存在也让正常运行时间责任变得可见。运营栈还压在设备级网络之上，后者有自己的失效模式：Apple Emergency SOS
              在主运营商不可用时可能改走替代网络或卫星，带来延迟和覆盖差异；Android 基于位置的功能完全依赖用户明确授权，权限被撤销或仅允许近似定位，都会直接降低应急数据保真度。安全方面，NIST
              Cybersecurity Framework 是评估 NG911 级系统的标准。CISA 和 911.gov 网络安全页面明确指出，911 网络 IP 化扩张使攻击面超过传统 PSTN
              基础设施面对的范围。RapidSOS 有合规页面和信任中心，但保留来源集中未找到公开可见的 SOC 2 Type II 或 FedRAMP
              文件，私有控制的质量仍未验证。伙伴和平台集中度方面，两个被点名的锚点占据主导地位：Axon 通过 RapidSOS 集成为响应人员和调度员提供整体实时数据；Motorola Solutions
              则把包括位置、健康信息和实时视频在内的联网设备数据路由进应急响应系统。如果任一关系发生变化，两者都可能成为高严重度的单点失效分发向量。AT&T ESInet
              关系增加了第三个关键基础设施依赖——一旦该安排改变，HARMONY AI 在 NG911 基础设施内的分发就需要重新路由。下方伙伴与依赖风险登记表和依赖图记录完整图景。
