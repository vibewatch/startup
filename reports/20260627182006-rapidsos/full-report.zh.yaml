      - number: '5.4'
        title: 信任、安全、合规与路线图
        blocks:
          - type: paragraph
            body: >-
              信任控制是产品叙事的核心，因为 RapidSOS 处理精确地理位置、健康数据、通信元数据、图像、视频和 AI 生成的事件输出。 应急服务隐私声明称，平台依据 GDPR、UK GDPR、PIPEDA
              和一长串美国州隐私法律处理应急数据； 该声明还称，AI 系统可以在人类监督下处理呼叫、文本、转录、警报、图像和视频，以生成翻译、摘要和其他决策支持输出。 RapidSOS
              称其不会出售通过应急服务收集的个人信息，并把留存限制在服务交付、安全、可靠性和合规所需范围内。 与此同时，非应急网页政策更松，允许基于营销 cookie 的共享并受选择退出约束；这不是产品阻断项，
              但尽调时应与应急数据姿态分开看。


              过去两年的路线图清楚显示，公司从数据交付转向工作流自动化。2024 年 Unite 发布，把旧门户和高级能力合并成一个 AI 工作台， 增加地图、分析、文本 / 视频和现场工作流。2025 年产品材料把范围扩展到
              SOP 指引、非紧急自动化和更广数据源覆盖。 2026 年，RapidSOS 推出 Real-Time Interoperability，并把 HARMONY AI 嵌入 AT&T
              ESInet。产品方向是连贯的——更深工作流所有权、 更宽互操作性和更多 AI 辅助——但公共部门买家仍应尽调问责、测试、数据权利条款和实施治理， 尤其是在公共安全采购追赶 AI 部署复杂度时。
