      - number: '3.3'
        title: 切换成本、替代方案与自建压力
        blocks:
          - type: paragraph
            body: >-
              切换成本看起来有分量，但并不一致。当机构或企业联动响应流程依赖 PSAP 传统记录系统之外的车联网、设备或视频输入时， RapidSOS 的价值最清楚。AT&T ESInet 发布和 Northern911
              发布都强化了一点：公司正试图把互操作性和韧性做进包装里， 而不只是写进产品故事。只要机构在意路由连续性、多机构信息共享，以及随呼叫到达的外部数据，这些就是实实在在的优势。


              但替代方案仍可信。911.gov 明确把 NG911 描述为多主体迁移，而非单一供应商采购，这让已经拥有主要栈组件的机构仍可能内部自建。 Motorola 和 CentralSquare
              可以提供带云和本地现代化路径的宽 PSAP 套件。Mark43 可以赢下更宽的运营层。 Priority Dispatch 可以掌握协议层。换句话说，RapidSOS
              不是在一个空白市场里销售，不是替换一个界面就永远拿下账户； 它进入的是分层架构，买家仍可以组合既有供应商、专门模块和内部迁移计划。
