  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 面对的不是一组干净的同类公司。留存证据至少指向五类竞争者。第一类是 Carbyne 和 Prepared 这样的云原生 911 与应急情报挑战者，它们都强调 AI
              辅助接入、实时媒体和简化后的接线员体验。第二类是 Motorola、Tyler、 CentralSquare 和 Hexagon 等既有 PSAP
              套件供应商，已经向政府买家销售接警、地图、CAD、分析、记录或更宽的公共安全工作流。 第三类是 Mark43 这样的邻近运营平台，统一调度、记录、证据和分析，即使看起来不完全像 RapidSOS 的外部数据网络。
              第四类是 Priority Dispatch 这样的协议替代方案，可以掌握接警分诊严谨性，而不必替代更宽的互操作层。第五类是现状： 在既有接警和 CAD 系统之上内部自建，并逐步推进 NG911 现代化。


              这个格局重要，因为当买家想要一个把企业、车联网、设备和互助关系中的外部数据带进来的网络层时，RapidSOS 看起来最强。 当客户把任务收窄到单一 PSAP 工作流，例如接警、地图、CAD
              或到达前指令时，它的独特性就弱一些。竞争对手提供的不只是邻近工具； 它们越来越把自己包装成现代 911 基础设施、云套件或单屏 AI 工作台。因此，真正的竞争问题不是 RapidSOS 有没有对手， 而是
              RapidSOS 更宽的安全网络数据能否把运营结果改到足以击败更窄的点状解决方案和大型既有套件。
