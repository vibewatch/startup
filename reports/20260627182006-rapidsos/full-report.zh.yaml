        - $800M–$1.5B（围绕当前标记，有有限溢价空间）
        - $150M 收入按 6-8x EV/收入 计算等于 $900M–$1.2B；若渠道纪律守住，可较 2025 年 11 月标记上调
        - 以当前公开证据看最可能；前提是 2026–2027 年机构增长继续维持已观察到的节奏
      - - 乐观
        - 收入超过 $200M，NRR 加速；毛利率超过 70%；战略买方（Motorola、Axon 或 AT&T）兑现退出
        - $2.0B–$2.5B
        - $200M+ 收入按 10-12x EV/收入 计算等于 $2.0B–$2.4B；战略溢价高于公开市场倍数
        - 若没有收入和利润率披露，概率较低；需要当前公开文件尚未出现的证据
    notes: 收入区间是方向性估算，来自把公开市场可比倍数套用到假设收入带。RapidSOS 未披露收入；这些只是情景阈值，不是预测。
