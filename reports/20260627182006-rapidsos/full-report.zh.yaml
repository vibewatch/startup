      - number: '3.2'
        title: 能力、包装、定价与分发
        blocks:
          - type: paragraph
            body: >-
              公开产品证据显示三种不同包装模式。RapidSOS 把自己包装成网络化情报层，能借助机构和企业关系运行， 并通过 AT&T ESInet 嵌入既有州级采购路径。Carbyne、Prepared 和
              Motorola 则强调一体化或完整 PSAP 工作流， 把接警、地图、分析或 AI 支持集中在一个运营环境里。Mark43 和 CentralSquare 靠云迁移、集成数据和更低本地 IT 负担竞争。
              Priority Dispatch 更窄，但很重要：它以证据为基础的调度协议可以替代相当一部分运营决策支持，即使它不能复制 RapidSOS 的外部数据图谱。


              全行业定价可见度都明显偏弱。已审阅页面绝大多数把买家导向演示、定价对话或定制采购。Motorola 明确邀请买家讨论其 NG911 产品组合的定价。RapidSOS 的 AT&T
              路径意味着商业杠杆来自嵌入式采购，而不是公开标价。实际含义是， 竞争压力更可能通过采购便利性、捆绑范围、实施负担和续约逻辑体现，而不是通过可见的公开价目表体现。
              因此，公开比较可以展示包装形态，但看不到实际折扣或真实利润率纪律。
