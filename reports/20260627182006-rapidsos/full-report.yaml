  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Analytical Framework
        blocks:
          - type: paragraph
            body: >-
              RapidSOS arrives at the valuation chapter with an unusually rich public operating narrative — 22,000-plus
              agencies, more than one billion emergencies supported, 600 million-plus connected devices, and a November
              2025 Apax-led financing that brought total capital raised above $450 million and generated independent
              reporting of a unicorn valuation. [CV001] [CV004] [CV005] [CV007] Premier Alternatives, one of the few
              secondary-market platforms that publishes a figure for private companies, marks RapidSOS at approximately
              $1.0 billion as of November 2025 with a capital efficiency ratio of 2.22×. [CV002] [CV003] That marker is
              the single most actionable public valuation reference in the retained evidence set.

              What is materially absent is the revenue, gross margin, net revenue retention, or churn data needed to
              translate those operating claims into a multiple-based fair-value estimate. [CV039] No public or
              third-party source in the retained file discloses RapidSOS annual recurring revenue, COGS structure, or
              renewal cohort quality. An SEC EDGAR search confirms that RapidSOS has filed nothing as a private company.
              [CV045] Tracxn and Craft.co confirm the private-active status but add no financial detail. [CV040] [CV011]
              [CV012]

              Given this evidence configuration the most defensible recommendation is Research-More / Track at medium
              confidence and high risk, with a valuation stance of stretched if entry is priced materially above the
              November 2025 $1.0 billion marker. TV001 summarises the core recommendation dimensions. FV001 traces the
              decision flow from scale evidence, partner proof, revenue gap, public-market comps, and sector headwinds
              to the final call. The path to a more constructive recommendation runs exclusively through revenue and
              margin disclosure — not through additional scale metrics, which are already well-documented.
