      - number: '2.2'
        title: Sizing Lenses and Constrained TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Public sizing for RapidSOS's market is definition-sensitive, which is why this chapter preserves several
              incompatible lenses instead of pretending there is one clean TAM. Frost & Sullivan gives the clearest
              accessible broad lens: the U.S. NG911 market growing from $888.1M in 2021 to $1.19B in 2026 at a 6.1%
              CAGR. Legislative and advocacy sources describe a different layer: the amount of public investment still
              needed to finish the migration. NENA says NTIA's 2026 work still implies a sustained multi-year,
              multi-billion-dollar federal commitment, while Urgent Communications shows policymakers still debating
              whether the capital need is closer to the previously cited $15B level and where that money would come
              from. Those figures are not contradictions so much as different measurement units: one is annual market
              revenue, another is nationwide modernization capital need. A RapidSOS-specific SAM should therefore be
              narrower than the full NG911 infrastructure market and closer to the software, interoperability,
              multimedia, and responder-assist layer sold into states, PSAPs, and adjacent verticals. A public SOM
              remains low-confidence because no retained source exposes attach rates, pricing, or conversion.
