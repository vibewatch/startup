      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The best public proof of real adoption is not a logo wall but named production or pilot usage. RapidSOS
              has several. Butler County 911 publicly described using RapidSOS UNITE to see who is calling, pinpoint
              exact locations, translate and transcribe calls, and receive images or video from the scene; local
              coverage also quoted dispatch leaders saying translation delays that used to take minutes are now almost
              instantaneous. In South Florida, Miami Police Department's communications-center administrator said
              Real-Time Interoperability immediately showed live routed calls, transcripts, summaries, and location on
              screen, and framed it as a game changer for public safety. At the statewide level, North Carolina's 911
              Board is extending RapidSOS interoperability across agencies after Hurricane Helene highlighted the value
              of keeping incident context attached to rerouted calls over AT&T ESInet.


              Virginia local-government pages add a more specialized use case: Suffolk says RapidSOS is embedded in the
              Emergency Communications Center protocol system as part of Marcus Alert and uses an Emergency Health
              Profile to provide behavioral-health and medical context to responders during emergency calls. That
              matters because it shows adoption extending beyond generic location enrichment into crisis-response
              workflow design. Historical technical proof predates the AI layer. The Android ELS pilot through the NG911
              Clearinghouse showed PSAPs in North Central Texas, Loudon County, and Collier County receiving faster,
              more accurate device location integrated into existing software, and the pilot materials cite real
              emergencies where that location saved lives. The trajectory therefore looks cumulative: first location
              enrichment, then data-rich ECC workflows, then cross-jurisdiction AI assistance and network-level
              interoperability.
