      - number: '5.4'
        title: Trust, security, compliance, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Trust controls are a central part of the product narrative because RapidSOS handles precise geolocation,
              health data, communications metadata, images, video, and AI-generated incident outputs. The
              emergency-services privacy notice says the platform processes emergency data under GDPR, UK GDPR, PIPEDA,
              and a long list of U.S. state privacy laws; it also says AI systems can process calls, texts, transcripts,
              alarms, images, and video to generate translations, summaries, and other decision-support outputs under
              human oversight. RapidSOS says it does not sell personal information collected through emergency-related
              services and limits retention to what is needed for service delivery, security, reliability, and
              compliance. At the same time, the non-emergency web policy is looser, allowing marketing-cookie-based
              sharing subject to opt-out, which is not a product blocker but is worth separating from the emergency data
              posture in diligence.


              The roadmap over the last two years shows clear movement from data delivery to workflow automation. The
              2024 Unite launch merged older portal and premium capabilities into a single AI-enabled workspace, adding
              mapping, analytics, text/video, and field workflows. 2025 product materials expand that into SOP guidance,
              non-emergency automation, and broader data-source coverage. In 2026, RapidSOS launched Real-Time
              Interoperability and embedded HARMONY AI into AT&T ESInet. The product direction is coherent—deeper
              workflow ownership, broader interoperability, and more AI assistance—but public buyers should still
              diligence accountability, testing, data-rights terms, and implementation governance, especially as
              public-safety procurement catches up with AI deployment complexity.
