      - number: '3.2'
        title: Capability, packaging, pricing, and distribution
        blocks:
          - type: paragraph
            body: >-
              The public product evidence shows three distinct packaging models. RapidSOS packages itself as a networked
              intelligence layer that can ride agency and enterprise relationships and, through AT&T ESInet, fit
              existing state procurement pathways. Carbyne, Prepared, and Motorola instead emphasize all-in-one or
              comprehensive PSAP workflows that centralize call handling, mapping, analytics, or AI support in one
              operational environment. Mark43 and CentralSquare compete through cloud migration, integrated data, and
              lower local IT burden. Priority Dispatch is narrower, but important: its evidence-based dispatch protocol
              can replace a meaningful slice of operational decision support even if it does not replicate RapidSOS’s
              external data graph.


              Pricing visibility is notably weak across the field. Reviewed pages overwhelmingly push buyers toward
              demos, pricing conversations, or tailored procurement. Motorola explicitly invites pricing discussions for
              its NG911 portfolio. RapidSOS’s AT&T path implies commercial leverage through embedded procurement rather
              than public list prices. The practical implication is that competitive pressure is likely expressed
              through procurement convenience, bundle scope, implementation burden, and renewal logic rather than
              through visible posted rate cards. That means public comparisons can show packaging shape, but not
              realized discounting or actual margin discipline.
