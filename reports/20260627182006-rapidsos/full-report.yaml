      - number: '7.5'
        title: People, Execution Risk, and Mitigations
        blocks:
          - type: paragraph
            body: >-
              RapidSOS's execution risk is most visible in the gap between the scale of what it is managing and the
              headcount it does so with. LeadIQ data suggests approximately 305 employees in North America, while the
              company publicly claims to support 22,000-plus agencies, one million-plus first responders, and 600
              million-plus connected devices. That ratio implies high operational leverage, which is not inherently a
              problem for a software-defined platform but becomes a material risk if key AI engineering, public-safety
              domain, or agency implementation functions are understaffed relative to the commitment surface. The
              leadership profile in public materials is thin — Michael Martin is clearly identified as CEO and founder,
              and Karin Marquez appears as Chief Public Safety Brand Officer, but the broader leadership bench is not
              publicly disclosed. That creates key-person dependency concentrated on the CEO founder, with no visible
              succession planning from public sources. The Craft.co executive page confirms the limited visibility —
              only a small public executive set appears. On mitigations, the company has several credible structural
              protections. The AT&T ESInet distribution puts HARMONY AI inside trusted NG911 infrastructure rather than
              over the public internet, limiting some cyber exposure. The compliance page and trust center provide
              public disclosure anchors. The Terms of Use and privacy notice create a legal governance framework even if
              its enforcement in novel AI-routing scenarios remains untested. The 22,000-plus agency base spread across
              public-safety jurisdictions provides revenue diversification that partially offsets individual agency
              budget risk. The mitigation table and kill-criteria register below translate each major risk into a
