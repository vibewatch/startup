        title: Comparable Valuation Set and Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Three U.S.-listed public companies form the comparable set: Motorola Solutions (MSI), Axon Enterprise
              (AXON), and Tyler Technologies (TYL). All three have 2025 annual reports on file with the SEC, providing
              audited financial statements that make their multiples reliable anchors. Motorola filed on February 13
              2026, Axon on February 27 2026, and Tyler on February 18 2026. [CV020] [CV021] [CV022] The Motorola and
              Tyler IR pages and annual report landing pages confirm ongoing public filer status. [CV023] [CV024]

              Motorola Solutions is the incumbent public-safety hardware and software platform with $11.9 billion in
              revenue and a $75.6 billion enterprise value, implying 6.4× EV/revenue. [CV014] [CV015] Its lower-risk,
              hardware-heavy profile makes it a floor reference rather than a ceiling. Axon Enterprise carries a premium
              at 12.9× EV/revenue on $3.0 billion in revenue and a $38.6 billion EV, reflecting higher software
              intensity and stronger growth than typical government-software comps. [CV016] [CV017] Tyler Technologies
              sits in the middle at approximately 5.0× EV/revenue ($11.8 billion EV, $2.4 billion revenue), representing
              government-software positioning without the public-safety specificity of the other two. [CV018] [CV019]
              TV004 tabulates the full comparable set.

              FV002 translates those multiples into implied revenue thresholds at the $1.0 billion EV marker: at the
              Tyler floor (5×), RapidSOS would need approximately $202 million in revenue; at the Axon ceiling (12.9×),
              only approximately $77 million would suffice. That range is wide precisely because revenue is undisclosed.
              TV003 maps the bull, base, and bear scenarios onto explicit assumptions and implied valuation ranges. The
              base case anchors on a $100-$180 million revenue band with stable 2026 retention and existing channel
              partnerships intact, implying a $0.9-$1.5 billion EV at 6-8× revenue. The bull case requires disclosed
              revenue above $200 million with improving NRR and is only supportable at 10-13× if economics improve
              enough to justify Axon-like treatment. The bear case assumes revenue below $100 million or a public-sector
              spending downturn, compressing the implied EV to $300-$800 million below the current round marker. [CV041]
