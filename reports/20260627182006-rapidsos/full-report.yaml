    summary: Operational flow showing how RapidSOS ingests, enriches, and delivers an emergency event.
    data:
      nodes:
        - id: n1
          label: Emergency event on device / app
          detail: Caller dials 911 or device triggers an emergency workflow
        - id: n2
          label: Connected-data ingestion
          detail: Location, health, telematics, alarm, and optional video/text context are sent to RapidSOS
        - id: n3
          label: Clearinghouse normalization
          detail: RapidSOS routes standards-compliant supplemental data alongside carrier / ALI information
        - id: n4
          label: UNITE incident workspace
          detail: ECC receives one data-rich view with voice, text, video, maps, and analytics
        - id: n5
          label: HARMONY assistance
          detail: AI transcribes, translates, summarizes, and surfaces next-step insights
        - id: n6
          label: Dispatch and field response
          detail: Context moves to CAD, field responders, or neighboring ECCs as needed
