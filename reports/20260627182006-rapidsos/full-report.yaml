      - number: '1.4'
        title: KPI Snapshot and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              RapidSOS has enough public evidence to fill a meaningful KPI snapshot, but not enough to eliminate
              diligence caveats. Funding, total capital, unicorn status, headquarters, agency reach, device reach,
              responder reach, software integrations, and current strategic partnerships are all supportable from
              retained sources. Headcount is not. Neither the public materials reviewed here nor the retained
              third-party coverage cleanly disclose current employee count, board composition, or whether the 2025 round
              included secondaries or other structural features that matter for valuation quality. Risk is not limited
              to disclosure. The privacy notice is explicit that RapidSOS may handle precise location, health data,
              communications content, and AI-assisted routing or summarization. That is operationally powerful, but it
              creates privacy, compliance, and liability exposure if data handling or model outputs go wrong.
              StatusGator adds a second non-marketing risk signal: its RapidSOS status page said the last officially
              acknowledged outage was on June 10, 2026 and showed multiple minor incidents in late May and early June.
              That does not negate the growth story, but it does remind investors that mission-critical software has
              uptime and governance burden along with platform leverage.
