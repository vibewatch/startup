  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              RapidSOS sits at the intersection of mission-critical public-safety infrastructure and commercially scaled
              AI software, producing a risk profile that merges the liability gravity of emergency-service failures with
              the execution uncertainty typical of a late-stage growth company. Based on retained public evidence, five
              risk clusters rank critical or high before mitigation. The highest-severity individual risks are first, a
              privacy or data-breach event arising from the company's own acknowledgment in its privacy notice that it
              may process precise geolocation, health information, device metadata, communications content, and images
              or video streams under emergency conditions. Second, a cyberattack on the IP-based NG911 network in which
              RapidSOS is embedded — CISA and the 911.gov cybersecurity page explicitly frame this expanded attack
              surface as a current concern, noting hackers can overwhelm PSAP lines or access and corrupt emergency
              data. Third, an AI routing or prioritization failure by HARMONY that the privacy notice acknowledges could
              affect the routing and prioritization of emergency communications, creating direct liability exposure.
              Immediately below those are partner and platform concentration on Axon and Motorola Solutions as the two
              named major integration anchors, public-sector procurement friction compounded by a PSAP staffing crisis
              that NENA and Mission Critical Partners identify as the top 911-industry challenge, and financial-model
              opacity in a company that has raised more than $450 million without disclosing revenue, margins, or burn.
              The remaining material risks — an approximately 305-person North America headcount supporting 22,000-plus
              agencies, device-level OS dependencies via Apple Emergency SOS and Android location permissions, and the
              absence of confirmed active federal litigation — are real but relatively contained by current evidence.
              The risk heatmap below visualizes the severity-by-likelihood distribution across all clusters.
