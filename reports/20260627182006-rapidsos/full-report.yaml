        title: Exhibits
        blocks:
          - type: callout
            title: Revenue Opacity Is the Blocking Gap
            body: >-
              RapidSOS has disclosed no revenue, gross margin, ARR, or net revenue retention figure in any retained
              public source. Without revenue, every applicable public-market multiple produces a range of $77M-$202M in
              implied revenue to justify the $1.0B private marker — and investors cannot determine which part of that
              range is realistic without a data-room engagement.
            calloutType: risk
            claimRefs:
