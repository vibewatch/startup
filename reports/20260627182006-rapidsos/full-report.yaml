  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              RapidSOS sits inside a broader NG911 and public-safety workflow modernization market, but it does not
              equal the whole market. The FCC's definition of NG911 sets the clean outer boundary: interoperable,
              secure, standards-based IP infrastructure able to receive and process text, video, data, and other
              emergency inputs over ESInets instead of legacy analog systems. RapidSOS participates in that transition
              through multimedia intake, interoperability, responder-assist AI, and data integration, not by capturing
              every fiber, transport, or core-services dollar. That distinction matters because status-quo substitutes
              are layered. Some buyers can address part of the problem with legacy CAD-to-CAD integrations, homegrown
              workflows, or one-off multimedia tools. Others rely on telco-led ESInet upgrades or infrastructure vendors
              first, then add workflow software later. The retained RapidSOS product pages also show adjacency expansion
              beyond central call taking into schools, law enforcement, drones, and major events. Those adjacencies
              widen the commercial story, but they remain attached to the same core job: converting fragmented emergency
              inputs into shareable operational context for public safety.
