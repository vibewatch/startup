      - number: '2.3'
        title: Buyers, Users, and Procurement Path
        blocks:
          - type: paragraph
            body: >-
              RapidSOS's buying motion is not a simple single-seat software sale. The state-government and
              interoperability pages show that procurement often starts with 911 authorities, statewide coordinators, or
              regional leaders trying to fix fragmentation, outage risk, and uneven service levels across local PSAPs.
              ECC and PSAP leaders are the operating users because they need text, video, translation, QA, and routing
              tools inside live emergency workflows. Field agencies—law enforcement, fire, EMS, school safety, and
              sometimes drone-response teams—consume the outputs downstream. Budget owners vary by motion: statewide
              modernization programs may be controlled by 911 boards or public-safety agencies, while vertical
              deployments in schools or law enforcement can be attached to local safety budgets. The path to purchase is
              also shaped by procurement machinery. 911.gov highlights federal grant dependency, LegalClarity notes the
              40% matching requirement in prior grant rounds, and public procurement portals such as SAM.gov and eVA
              show why cycles are often formal, state-administered, and compliance-heavy. AT&T ESInet and
              platform-partner distribution can reduce friction, but they do not eliminate the reality that many buyers
              still move on public-sector timelines.
