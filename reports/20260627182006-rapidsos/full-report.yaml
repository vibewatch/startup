          - type: callout
            title: Entry Price Discipline Is the Core Posture
            body: >-
              The most defensible entry posture is to treat the November 2025 $1.0B private marker as the ceiling of
              fair value under current information, not a floor for negotiation. Any entry materially above that level
              without revenue and margin disclosure is structurally a bet on blind premium rather than evidence-based
              pricing.
            calloutType: recommendation
