            body: >-
              The leadership file is founder-led but publicly thinner than the capital narrative. Inc. and current
              company materials clearly identify Michael Martin as founder and CEO, but the broader executive bench is
              only partially visible in the retained sources. Karin Marquez appears as Chief Public Safety Brand Officer
              in current product messaging, and the company's public materials rely heavily on Martin as the
              spokesperson for strategy, fundraising, and mission. That asymmetry matters because the capital story is
              unusually prominent. RapidSOS announced a $100 million round on November 19, 2025 led by Apax Digital
              Funds, and company, wire, trade, and business-press sources all repeat the same topline: more than $450
              million raised in total. Inc. went further by saying the round pushed valuation above $1 billion, which is
              the strongest retained public valuation marker in this chapter. Stakeholder relevance extends beyond
              investors. AT&T matters because it provides distribution into NG911 infrastructure, Google matters because
              it broadens multimedia inputs, and state-level buyers matter because RapidSOS is selling resiliency and
              interoperability, not only app-level features.
