  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: wide
    summary: >-
      Decision chain from scale evidence, partner proof, revenue opacity, valuation marker, comp range, and sector
      headwinds to the Research-More / Track recommendation.
    data:
      nodes:
        - id: scale-proof
          label: Scale Evidence
          note: 22K+ agencies, 1B+ emergencies, 600M+ devices (CV004-CV007)
        - id: partner-proof
          label: Partner Ecosystem
          note: AT&T ESInet, Google Android, Motorola Solutions, Axon (CV025-CV028)
        - id: revenue-gap
          label: Revenue Opacity
          note: ARR, margin, NRR all undisclosed; no SEC filing (CV039, CV045)
        - id: valuation-marker
          label: Private Marker ~$1.0B
          note: Nov 2025 Premier Alts mark; Inc. unicorn report (CV002)
        - id: comp-range
          label: Comp Multiple Range
          note: 4.96x-12.92x EV/rev; no RapidSOS revenue anchor (CV015, CV017, CV019)
        - id: headwinds
          label: Public Sector Headwinds
          note: GAO IT gaps; NENA staffing; Washoe procurement scrutiny (CV029, CV034)
        - id: recommendation
          label: Research-More / Track
          note: Medium confidence | High risk | Stretched stance
      edges:
        - from: scale-proof
          to: recommendation
        - from: partner-proof
          to: recommendation
        - from: revenue-gap
          to: recommendation
        - from: valuation-marker
          to: recommendation
        - from: comp-range
          to: recommendation
        - from: headwinds
          to: recommendation
    approximationNotes: >-
      Node weights are qualitative; all six input dimensions are treated as equal contributors to the decision logic for
      display purposes only.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV015
      - CV017
      - CV019
      - CV029
      - CV039
  - id: FV002
    title: Valuation Sensitivity — Implied Revenue at the $1.0B EV Marker
    type: bar
    layout: standard
    summary: >-
      At each public-market EV/revenue multiple, the bar shows the revenue level RapidSOS would need to justify the Nov
      2025 ~$1.0B private marker. The wide span underscores why revenue disclosure is the primary diligence ask.
    data:
      items:
        - label: Tyler floor (4.96x)
          value: 202
        - label: Motorola (6.37x)
          value: 157
        - label: Midpoint (8.0x)
          value: 125
        - label: Growth premium (10.0x)
          value: 100
        - label: Axon ceiling (12.92x)
          value: 77
    approximationNotes: >-
      Revenue values computed as $1,000M divided by the stated multiple and rounded to the nearest million. No RapidSOS
      revenue has been disclosed; these are scenario thresholds, not estimates of actual revenue.
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV041
      - CV042
  - id: FV003
    title: Valuation Range — Bear / Base / Bull Bands
    type: range
    layout: standard
    summary: >-
      Directional valuation bands for three scenarios anchored on the $1.0B Nov 2025 private marker and derived from
      public-comparable multiples applied to hypothetical revenue ranges. All values in USD millions.
    data:
      items:
        - label: Bear
          low: 300
          high: 800
        - label: Base
          low: 800
          high: 1500
        - label: Bull
          low: 1500
          high: 2500
    approximationNotes: >-
      Ranges derived from applying comp multiples (4.96x-12.92x EV/revenue) to estimated revenue scenarios (bear below
      $100M, base $100M-$180M, bull above $200M). No RapidSOS revenue disclosed; this is bounds analysis only and does
      not constitute a forecast.
    claimRefs:
      - CV002
      - CV041
      - CV042
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across seven investment dimensions on a 0-10 scale. Financial economics is the lowest-scoring
      dimension due to complete revenue opacity; market opportunity and platform earn the highest marks.
    data:
      items:
        - label: Market Opportunity
          value: 7
          note: Large NG911 TAM; federal mandate active; adoption pace constrained by budget cycles and staffing
        - label: Product and Platform
          value: 7
          note: AI-enabled workflows; 600M+ devices; Apple and Google integrations; economic proof entirely missing
        - label: Competitive Moat
          value: 6
          note: Agency and device network; AT&T ESInet distribution; partner-to-competitor displacement risk present
        - label: Financial Economics
          value: 3
          note: Revenue, margin, NRR, and burn all undisclosed — the blocking diligence gap
        - label: Risk Profile
          value: 4
          note: High risk — procurement friction, opacity, partner concentration, and cap-table unknowns
        - label: Valuation Support
          value: 4
          note: Single $1.0B private-round marker with no revenue anchor; stretched if entered above marker
        - label: Evidence Quality
          value: 5
          note: Scale claims well-sourced with primary-tier evidence; economic inputs entirely private-only
    approximationNotes: >-
      Scores are 0-10 qualitative assessments based on retained evidence as of 2026-06-27. They are not a quantitative
      model output and should not be treated as numerical price targets.
    claimRefs:
      - CV004
      - CV005
      - CV025
      - CV026
      - CV029
      - CV034
      - CV035
      - CV039
