  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              RapidSOS does not compete against one clean peer set. The retained evidence points to at least five rival
              classes. First are direct cloud-native 911 and emergency-intelligence challengers such as Carbyne and
              Prepared, both of which emphasize AI-assisted intake, real-time media, and a simplified operator
              experience. Second are incumbent PSAP suite vendors such as Motorola, Tyler, CentralSquare, and Hexagon,
              which already sell call handling, mapping, CAD, analytics, records, or broader public-safety workflows
              into government buyers. Third are adjacent operations platforms such as Mark43 that unify dispatch,
              records, evidence, and analytics even if they do not look exactly like RapidSOS’s external data network.
              Fourth are protocol substitutes such as Priority Dispatch that can own call-triage rigor without replacing
              a broader interoperability layer. Fifth is the status quo: internal build and gradual NG911 modernization
              on top of existing call-handling and CAD systems.


              This landscape matters because RapidSOS appears strongest when the buyer wants a network layer that brings
              in outside data from enterprises, telematics, devices, and mutual-aid relationships. It looks less unique
              when a customer narrows the job to a single PSAP workflow such as call taking, mapping, CAD, or
              pre-arrival instructions. Competitors are not merely offering adjacent tools; they are increasingly
              framing themselves as modern 911 infrastructure, cloud suites, or single-screen AI workbenches. The real
              competitive question is therefore not whether RapidSOS has peers. It is whether RapidSOS’s broader
              safety-network data can change operational outcomes enough to beat narrower point solutions and large
              incumbent suites.
            claimRefs:
              - CP001
              - CP006
