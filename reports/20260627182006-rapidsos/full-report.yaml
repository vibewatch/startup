      - number: '6.3'
        title: Retention, durability, and proof quality
        blocks:
          - type: paragraph
            body: >-
              Durability is harder to prove than adoption. Public materials show clear installed-base breadth and a
              handful of named production users, but they do not disclose NRR, GRR, churn, contract duration, or cohort
              retention. That matters because RapidSOS is now selling workflow and AI layers, not just raw location
              enrichment. The strongest retention-adjacent proof is continuity of use in public customer references and
              partner integrations: Butler County is using UNITE in 2026; Miami is actively using interoperability;
              North Carolina is expanding statewide; and IamResponding describes an active RapidSOS integration that
              provides live caller locations, breadcrumb trails, uncertainty radius, and additional emergency context
              for up to ten minutes of a CAD incident.


              Review evidence is weaker than the agency proof. FeaturedCustomers aggregates reviews, case studies, and
              customer videos, but it is a marketing-heavy source. PeerSpot provides little substantive review detail,
              while SoftwareWorld reproduces generic product copy and even contradicts official materials by saying
              RapidSOS does not offer an API. That does not negate customer value, but it does reduce confidence in
              public third-party retention or satisfaction signals. The practical conclusion is that durability looks
              strongest where RapidSOS is embedded into 911 workflows, and much weaker where an investor would want
              SaaS-style renewal analytics.
