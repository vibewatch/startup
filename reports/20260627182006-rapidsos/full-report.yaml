      - number: '5.3'
        title: Deployment, reliability, and dependency map
        blocks:
          - type: paragraph
            body: >-
              RapidSOS appears to deploy as a cloud-native, partner-heavy platform whose value depends on implementation
              quality as much as on core product features. The strongest public engineering clues come from recruiting
              materials. The implementation-engineer role centers on onboarding B2B partners, advising on end-to-end
              workflows, troubleshooting API issues, and monitoring live integration health. The SRE leadership role
              points to Kubernetes clusters, AWS core infrastructure, multi-region failover testing, Terraform/Atlantis
              infrastructure-as-code, RabbitMQ messaging, and observability tooling such as Datadog. That is consistent
              with a platform that must ingest bursty emergency traffic, integrate with third-party systems, and
              maintain high uptime across regions.


              The dependency map is correspondingly broad. On the inbound side, RapidSOS depends on device OEMs, app
              developers, alarms, telematics, and enterprise platforms to contribute data. In the middle, it depends on
              APIs, partner onboarding, and cloud reliability. On the outbound side, it depends on ECC adoption, CAD
              integration, field-responder workflows, and—in some expansion cases—AT&T ESInet or Northern911 backup
              services. The reliability story is credible but not frictionless. Product pages emphasize outage
              resilience, redundant pathways, and backup 911 operations, yet external status monitoring still recorded
              repeated warnings and one officially acknowledged outage in June 2026. For a system embedded in emergency
              workflows, operational maturity is therefore a differentiator and a continuing diligence topic, not a
              solved checkbox.
