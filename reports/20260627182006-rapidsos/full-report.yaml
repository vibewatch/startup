  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and module map
        blocks:
          - type: paragraph
            body: >-
              RapidSOS presents itself as a mission-critical AI platform for emergency response rather than a single
              point product. The core commercial stack has three visible layers. First, the Safety Network aggregates
              device and enterprise signals: smartphone location, telematics, alarms, health profiles, video, text, and
              other context from hundreds of millions of endpoints and hundreds of enterprises. Second, the RapidSOS
              Clearinghouse and APIs act as the routing and data-normalization layer that receives that information
              during an emergency and makes it available to emergency communications centers and responders. Third,
              operator-facing applications package the data into workflow products. UNITE is the end-to-end incident
              workspace for telecommunicators; HARMONY AI adds transcription, translation, summaries, natural-language
              querying, and automation; and the public-safety portfolio also includes IamResponding, eDispatches,
              Northern911, and Total Response.


              Product breadth matters because RapidSOS is trying to become the operating layer between connected-device
              ecosystems and public-safety software. The reviewed materials repeatedly show the same module logic:
              device-side data ingestion, normalized incident context, and then delivery into ECC, CAD, and responder
              interfaces. That architecture supports multiple buyer groups at once—public safety agencies that receive
              the data, enterprise partners that contribute it, and integration partners that package it into their own
              workflows. The product surface is therefore broader than a location API or a single dispatcher console; it
              is a multi-module network business with workflow, interoperability, and partner-integration components.
