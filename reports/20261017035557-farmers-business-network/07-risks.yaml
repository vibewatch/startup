callouts:
  - calloutType: risk
    title: Top blocker remains finance-book opacity
    body: >-
      Public materials prove that FBN Finance is scaled and strategically
      important, but they do not disclose delinquency, loss, covenant, or
      funding-partner concentration metrics, so the sharpest downside remains
      underwritten credit risk that cannot yet be externally bounded.
    claimRefs: [CR003, CR004, CR011, CR014]
  - calloutType: insight
    title: Customer stress can compound operating and credit losses
    body: >-
      Independent 2026 farm-economy sources show tight producer margins and
      rising expenses, which means a weak crop season or continued input-cost
      inflation could hit marketplace demand, payment performance, and partner
      retention at the same time.
    claimRefs: [CR010, CR011, CR012]
  - calloutType: recommendation
    title: Underwrite against explicit kill criteria, not broad platform ambition
    body: >-
      A prudent go/no-go screen should require clean regulatory checks,
      acceptable credit-loss and liquidity metrics, and service-level proof that
      the 2026 assortment and distribution expansion is not degrading
      fulfillment or member trust.
    claimRefs: [CR001, CR006, CR008, CR013, CR014]
