      - [App reliability hits multiple workflows at once, "The app touches bids, purchases, grain sales, satellite imagery, and team notes.", Medium, Medium, Moderate, Medium, "Need uptime, incident history, support backlog, and recovery-time data."]
    notes: Severity reflects how quickly operational failures could spill into revenue retention, member trust, and credit performance; no public SLA or incident dataset was retained.
    claimRefs: [CR005, CR006, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / exposure
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Funding capacity, "FBN Finance LLC and lending partners", "Capital for land, input, equipment, and operating-credit products", "$2.5B+ committed; farm lines up to $15M", "Warehouse or partner pullback slows originations or forces tighter credit terms.", High, "Experienced analysts, digital process, product breadth", High]
      - [Farmer economics, "Row-crop producers and borrowing members", "Demand for inputs, services, and repayment quality", "120,000+ members; 2026 margins still tight", "Lower farm profitability reduces purchasing power and loan performance.", High, "Insurance plus ARC/PLC safety-net tools and transparent pricing", Medium-High]
