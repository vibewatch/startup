evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-transparency
    missingEvidence: >-
      Current post-2025 valuation, share-class pricing, liquidation preferences, and any secondary or structured
      financing terms.
    whyItMatters: >-
      Valuation and security terms materially affect downside protection and whether legacy headline values still anchor
      judgment.
    diligencePath: Request the latest financing deck, cap table, and board-approved pricing materials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Current recognized revenue, gross margin, contribution margin, and finance-segment economics.
    whyItMatters: >-
      Product breadth and member scale do not answer whether the platform is compounding efficiently or carrying hidden
      balance-sheet risk.
    diligencePath: Request segment revenue, margin, and lending-performance detail from management or the data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headcount-governance
    missingEvidence: >-
      A refreshed employee count, current headquarters, canonical financing stage, and a current public board or
      governance roster.
    whyItMatters: >-
      Corporate identity, leadership depth, operating leverage, and governance quality all matter for execution risk
      during the asset-light transition.
    diligencePath: Confirm via current corporate filings, leadership pages, investor materials, or a board and governance appendix.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale-definition
    missingEvidence: One canonical definition and reporting date for members, member farms, and network acres.
    whyItMatters: >-
      Inconsistent current denominators can overstate commercial reach and complicate later customer, market, and
      valuation analysis.
    diligencePath: Ask management to reconcile active members, farms, acres, and geography coverage in one dated KPI sheet.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Current product-line GMV, paid Market Intelligence subscriptions, finance originations, and transacting member
      counts by geography.
    whyItMatters: >-
      Without workflow-level volume data, public sources can bound reach but cannot isolate FBN’s current SAM, SOM, or
      cross-sell attach rates.
    diligencePath: >-
      Request current product-mix, cohort, and regional transaction metrics from management, lenders, or investor
      materials.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-evidence
    missingEvidence: >-
      Independent procurement evidence showing who approves input purchases, financing, and grain-marketing adoption by
      farm size or crop mix.
    whyItMatters: >-
      The buyer/user/payer map is currently inferred from product structure rather than validated with customer-side
      procurement or budgeting evidence.
    diligencePath: Interview growers, channel partners, or lenders and request anonymized role-based adoption data or case studies.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: >-
      Realized input prices, financing APRs and fees, rebates, commissions, and discount schedules for FBN and competing
      channels by farm type.
    whyItMatters: >-
      Without realized economics, the chapter can support a transparency and convenience thesis but not a definitive
      all-in cost leadership conclusion.
    diligencePath: >-
      Request anonymized transaction-level pricing, rebate, and financing comparisons for matched customer cohorts
      versus dealer and bank alternatives.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Win-loss data, retention by product line, multi-homing rates, and contract or workflow switching costs versus
      dealers, lenders, and brokers.
    whyItMatters: >-
      Bundle breadth alone does not prove durable share if farms still split spend across incumbents or treat FBN as an
      episodic secondary channel.
    diligencePath: >-
      Request cohort retention, repeat-purchase, credit-renewal, and wallet-share data segmented by product line and
      geography.
    relatedQuestionRefs:
      - QP004
      - QP007
  - type: conflicting-data
    severity: minor
    topic: member-scale-definition
    missingEvidence: >-
      A reconciled definition of registered members, active transacting farms, financed farms, and member acres across
      2025-2026 company surfaces.
    whyItMatters: >-
      Public scale claims are directionally useful, but inconsistent definitions can distort competitor positioning if
      reader assumes every member metric measures the same thing.
    diligencePath: >-
      Ask management to reconcile member-count methodology across homepage, AI partnership, finance, and July 2025
      release disclosures.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Recognized revenue, segment revenue mix, and gross margin by marketplace, financing, crop marketing, and
      premium-program streams.
    whyItMatters: >-
      Without segment economics, the public file cannot distinguish scale from profitable scale or test whether
      financing subsidizes commerce growth.
    diligencePath: >-
      Request audited historical financials or management segment P&Ls with revenue, gross margin, and contribution
      margin by stream.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, monthly burn, warehouse or debt facilities, covenants, funding costs, and credit-loss performance
      inside FBN Finance.
    whyItMatters: >-
      Capital intensity and liquidity determine whether the 2025 raise is sufficient or merely a bridge to another
      financing event.
    diligencePath: >-
      Request the latest balance sheet, debt schedule, facility terms, delinquency or loss vintages, and 12- to 24-month
      cash-runway model.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: third-party-estimates
    missingEvidence: A management-certified reconciliation of cumulative funding, valuation history, and current revenue or GMV.
    whyItMatters: >-
      Third-party data vendors disagree on funding and top-line figures, so external estimates cannot replace primary
      financial disclosure.
    diligencePath: >-
      Reconcile the cap table and financing history to board materials, and provide a current KPI pack covering revenue,
      GMV, and financed balances.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Public security certifications, status-page history, uptime metrics, or formal service-level commitments for the
      commerce, finance, and mobile surfaces.
    whyItMatters: >-
      The product touches payments, finance, agronomic guidance, and farm records, so operational-control quality
      materially affects implementation and retention risk.
    diligencePath: >-
      Request SOC 2 or equivalent control reports, status-history exports, incident postmortems, and enterprise
      support/SLA documentation by module.
  - type: private-evidence-only
    severity: material
    topic: ai-adoption-quality
    missingEvidence: >-
      Production adoption, usage frequency, answer-quality metrics, escalation rules, and hallucination/error monitoring
