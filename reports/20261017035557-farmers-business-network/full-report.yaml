        - >-
          The 2025 funding disclosures identify the $50M amount and investors, but the retained public sources do not
          disclose the round valuation or preference stack.
        - >-
          A term sheet, cap table, and secondary/board-mark context could convert this from a track name into an
          investable price debate.
      - - 'Anti-thesis: execution and channel risk still matter'
        - >-
          Reuters documented historical supplier pushback serious enough to trigger a Canadian antitrust probe, while
          Agriculture Dive still describes regenerative lending proof at pilot scale.
        - >-
          Evidence of stable channel access, healthy credit loss experience, and broader program adoption would narrow
          the bear case.
    notes: Rows synthesize retained evidence into decision-oriented arguments; they do not add undisclosed valuation math.
    claimRefs:
