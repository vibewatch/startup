        title: Publicly visible breadth favors FBN, but economic comparison remains only partially observable
        blocks:
          - type: paragraph
            body: >-
              Public company-controlled evidence shows meaningful breadth: FBN's homepage describes free membership, a
              direct-to-farm inputs marketplace, financing, grain-buyer connections, premium programs, and
              network-driven benchmarking, while the finance page lists multiple loan products and an operating-line
              offering up to $15 million. The 2025 Yahoo Finance / Business Wire release adds 7,200 marketplace
              products, third-party sellers, 24-to-72-hour delivery, and nearly $3 billion of financing extended. In
              contrast, the assigned pool provides only partial public pricing visibility into competing alternatives,
              especially local dealer discounting, realized loan rates, and broker economics.


              That makes the pricing comparison inherently asymmetrical. FBN discloses free membership and repeatedly
              markets transparent list pricing, but the chapter cannot prove that farmers consistently realize the best
              all-in economics versus negotiated dealer bundles or local credit relationships. The right reading is
              therefore that FBN has a credible public packaging story, not a conclusively proven price leadership
              position across all farm categories.
