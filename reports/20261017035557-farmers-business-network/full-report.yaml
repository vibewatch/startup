  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is broader than inputs but narrower than total agriculture spend
        blocks:
          - type: paragraph
            body: >-
              FBN is best understood as a bundled farm-operations marketplace rather than a generic agtech TAM story.
              Its own positioning combines input purchasing, financing, premium programs, grain-buyer access, and
              benchmarking or market-intelligence workflows for family farms, which means included spend sits inside
              recurring operating decisions instead of one enterprise software budget. That boundary still excludes
              large parts of agriculture: upstream manufacturer economics, downstream grain handling margins, unrelated
              livestock systems, and farm software categories that do not touch input procurement, credit, crop
              marketing, or agronomic decision support. The relevant question is therefore not whether agriculture is
              huge, but whether growers will consolidate several economically material decisions onto one farmer-facing
              platform.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM012
      - number: '2.2'
        title: Public sizing is possible through operational lenses, not a clean TAM-SAM-SOM stack
        blocks:
          - type: paragraph
            body: >-
              The public record supports several sizing lenses but not a precise bottom-up market model. On the broadest
              lens, 2026 Farm Bureau and AGDaily coverage of USDA outlooks describes 94 million corn acres, 85 million
              soybean acres, and 45 million wheat acres, implying roughly 224 million acres of row-crop activity in the
              U.S. acreage base most aligned with FBN’s merchandising and grain-marketing workflows. At the
              company-reported lens, FBN cites more than 100,000 member farms or 120,000+ farmer members and 185
              million+ network acres, while a 2025 trade report cites 117,000 farms and 187 million acres. Those figures
              show real scale, but they do not reveal how many members buy inputs, borrow capital, or pay for
              market-intelligence features in a given season, so public SAM and SOM remain constrained by missing attach
              and transacting-user data.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM011
              - CM015
