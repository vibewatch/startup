              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers are tangible, but 2026 economics and trust still constrain conversion
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers in the public record are economic and workflow-based: transparent input
              pricing, direct-to-farm delivery, integrated financing, and faster access to local grain bids or market
              signals. Those benefits fit periods when farmers need to preserve margin and reduce search costs. The same
              low-margin environment also creates friction, however, because producers facing projected prices below
              break-even may delay optional subscriptions, compare every input order carefully, or favor trusted local
              advisors over new AI-backed recommendations. Hyperlocal logistics and basis conditions add another
              constraint, since national scale does not erase local fulfillment, financing, or marketing execution risk.
              For diligence, this means FBN’s market relevance is credible, but the valuation-relevant question is
              conversion depth by workflow, not just headline membership reach.
            claimRefs:
              - CM006
              - CM010
              - CM013
              - CM014
