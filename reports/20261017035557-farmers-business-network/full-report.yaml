              uptime, security certifications, model accuracy, implementation effort, or post-spin operating boundaries.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Public materials present FBN as a bundled operating platform for family farms rather than a single-product
              vendor. The homepage ties membership to inputs, financing, crop marketing, premium programs, agronomic
              insights, and community, while the mobile app extends that bundle into daily use cases such as input
              purchasing, bid checking, inventory tracking, scouting notes, and team collaboration. The clearest
              payer-side segmentation comes from FBN Finance, which markets distinct lending products for land, inputs,
              equipment, and operating capital, while grain-marketing users are positioned as a separate workflow with
              buyer discovery, contract management, and payments. That breadth supports land-and-expand logic, but the
              public record still does not separate free members, active transactors, and multi-product customers. 
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU008
              - CU010
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              FBN's public scale claims have risen materially over time, from 33,500 members farming more than 82
              million acres in the 2021 capital-raise post to over 117,000 farms and 187 million acres in July 2025
              coverage, and then to 120,000+ members with 185 million+ to 190 million+ acres in 2025-2026 materials.
              Financing and commerce metrics point to meaningful commercial activity, including 3,200+ farmers served by
              FBN Finance, $2.5B+ funds committed on the finance page, nearly $3B financed in July 2025 release
              coverage, 100,000+ input deliveries on the homepage, and 7,200+ marketplace products in release-based
              coverage. The quality of proof is mixed, however: the strongest named customer evidence in the assigned
              pool is still company-hosted testimonial content and community activity rather than independent case
              studies or disclosed renewal cohorts.
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU009
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU013
      - number: '6.3'
        title: Expansion loops, durability, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The expansion story is credible on workflow adjacency. FBN keeps adding product categories, financing
              tools, community touchpoints, and events that can cross-sell across the same farm account, while the
              October 2025 spin-off reframed the company as a more open, asset-light marketplace with more third-party
              sellers and financial partners. That helps assortment breadth and capital efficiency, but it also means
              customers may depend on commercial relationships outside FBN for continuity in key categories such as crop
              protection. More importantly, the assigned public evidence never discloses NRR, GRR, churn, contract
              length, top-customer exposure, or product-line cohort behavior, so durability and concentration remain
              core diligence gaps rather than proven strengths.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad workflow coverage increases expansion surface
            body: >-
              The strongest customer positive is breadth: FBN can enter through commerce, financing, grain marketing, or
              community and then cross-sell adjacent workflows inside the same farm account.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU010
          - type: callout
            title: Durability is still under-proven in public evidence
            body: >-
              Public scale claims are plentiful, but the assigned pool still lacks independently verified renewal,
              churn, cohort, and concentration disclosures, so customer durability remains a diligence risk.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulated-product breadth creates the sharpest diligence burden
        blocks:
          - type: paragraph
            body: >-
              FBN is no longer just a software or marketplace story: the retained public record shows commodity-market
              advisory activity, finance products, state-licensed inputs and pharmacy distribution, and lending-partner
              relationships operating under explicit terms, underwriting, and risk disclosures. That mix makes
              compliance quality, legal entity discipline, and supervisory controls first-order investment risks because
              a single breakdown could affect financing growth, marketplace trust, or the company's ability to keep
              shipping regulated products. The public packet is directionally supportive but does not independently
              clear current enforcement, privacy, or incident history, so this area remains a diligence blocker rather
              than a cleared risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR014
      - number: '7.2'
        title: Marketplace expansion raises fulfillment and reliability risk
        blocks:
          - type: paragraph
            body: >-
              The refresh evidence shows FBN is still broadening assortment, geography, and service surfaces at the same
              time it asks members to use a single app for input purchasing, grain marketing, field operations, and team
              coordination. That combination can be powerful when it works, but it also increases failure modes around
              supplier onboarding, inventory accuracy, on-time delivery, app uptime, and cross-border execution.
              Management has described a meaningful warehouse, pharmacy, and partner footprint and has flagged new
              Canadian distribution-center growth, but the retained public sources do not disclose operational KPIs such
              as fill rate, stockouts, returns, recalls, or incident history.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
      - number: '7.3'
        title: Partner dependence and farm-economy stress can amplify losses
        blocks:
          - type: paragraph
            body: >-
              FBN's growth logic depends on two external constituencies staying healthy at the same time: suppliers and
              funding partners on one side, and row-crop producers on the other. Public finance marketing materials show
              a scaled credit operation, while company-issued marketplace updates point to a wider supplier network and
              continued buyer aggregation. At the same time, independent farm-economy sources describe 2026 as a year of
              margin pressure, rising expenses, and continued volatility for many growers. That backdrop matters because
              weaker farm economics can simultaneously compress demand for inputs and services, worsen repayment
              quality, and make partner retention harder if FBN misses service levels or price competitiveness.
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR009
              - CR010
              - CR011
              - CR015
      - number: '7.4'
        title: Mitigations are visible, but the kill criteria are still mostly private-data tests
        blocks:
          - type: paragraph
            body: >-
              The public record does show meaningful mitigants: experienced finance staff, digital underwriting
              workflows, direct-to-farm delivery, and farm safety-net tools that can cushion producer stress. Those are
              useful, but they are not substitutes for hard private diligence because the core thesis-break triggers are
              measurable and currently undisclosed: rising delinquencies or covenant pressure in FBN Finance, licensing
              or supervisory exceptions across regulated entities, or operational slippage during the 2026 marketplace
              and distribution expansion. Until those metrics clear, the prudent investment posture is to treat FBN as a
              scaled platform with real optionality but also with real execution and balance-sheet risk.
            claimRefs:
              - CR007
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top blocker remains finance-book opacity
            body: >-
              Public materials prove that FBN Finance is scaled and strategically important, but they do not disclose
              delinquency, loss, covenant, or funding-partner concentration metrics, so the sharpest downside remains
              underwritten credit risk that cannot yet be externally bounded.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR014
          - type: callout
            title: Customer stress can compound operating and credit losses
            body: >-
              Independent 2026 farm-economy sources show tight producer margins and rising expenses, which means a weak
              crop season or continued input-cost inflation could hit marketplace demand, payment performance, and
              partner retention at the same time.
            calloutType: insight
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: callout
            title: Underwrite against explicit kill criteria, not broad platform ambition
            body: >-
              A prudent go/no-go screen should require clean regulatory checks, acceptable credit-loss and liquidity
              metrics, and service-level proof that the 2026 assortment and distribution expansion is not degrading
              fulfillment or member trust.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              FBN looks investable as a category asset, but not yet as a public-evidence-backed price. The retained
              evidence shows a real multi-product platform with fresh July 2025 funding, a large member network, and a
              lending arm that FBN now markets at multi-billion-dollar cumulative volume. What it does not show is the
              one thing a valuation chapter needs most: the price and downside terms of the latest financing. Without a
              public valuation mark, preference stack, or current unit economics, the supportable stance is research
              more rather than buy.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV012
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis vs. counterweights
        blocks:
          - type: paragraph
            body: >-
              The bullish case is straightforward: FBN still looks differentiated on distribution, data, and workflow
              breadth. Company-controlled materials show a broad ag marketplace, grain-marketing tooling, and a finance
              stack that ranges from land loans to operating lines, while July 2025 sources say the company raised
              another $50 million to expand AI and marketplace capabilities. AgWeb's March 2026 coverage also suggests
              FBN still produces proprietary market-intelligence content at meaningful scale. The counterweight is that
              public proof of monetization durability remains thin, and even the finance proof retained here includes
              pilot-scale programs rather than mature disclosed economics.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The current financing context is good enough to justify continued tracking, but not a priced commitment.
              The last clearly disclosed large round in this pool is the 2021 $300 million raise, and the latest 2025
              financing disclosures identify the amount and investors but not valuation or preference terms. That means
              the only honest public comparison set in the assigned evidence is internal: a much larger 2021 round
              versus a smaller 2025 refresh round aimed at product and AI expansion. In that setting, the base case
              should assume valuation discipline below any undisclosed insider mark until management can prove current
              margins, repeat purchase, and loan-book performance.
            claimRefs:
              - CV001
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final diligence path is specific. Before moving from research-more to invest, an investor needs the
              July 2025 term sheet, full cap table, current revenue and gross-margin mix, and vintage-level credit
              metrics for the finance book. The bear case is not theoretical: Reuters documented historical channel
              conflict serious enough for Canadian regulators to investigate whether suppliers coordinated against FBN,
              and Agriculture Dive still describes regenerative-lending proof as a 20-farm land-loan concept layered on
              top of a 140-farmer operating-loan program. Those facts do not break the thesis, but they do define the
              kill criteria if commercialization, channel access, or credit quality disappoint.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
