      - number: '3.3'
        title: Durability comes from bundle depth and distribution assets, but incumbents still have power
        blocks:
          - type: paragraph
            body: >-
              The evidence for durability is strongest where FBN has already built infrastructure that is hard for a
              point solution to replicate quickly. Public materials cite a large member network, warehouses and
              pharmacies, community-builder partners, a growing financing arm, and continuing investment in AI. The
              September 2026 Google AI Futures Fund partnership is especially important because it signals that FBN
              wants to push beyond agronomy chat into a broader operating layer that can connect agronomic, financial,
              equipment, and market context with executable commercial actions on the platform.


              Still, the adverse evidence matters. Wikipedia's summary of the Canadian Competition Bureau matter
              indicates that major incumbents were alleged to have tried to block FBN in Canada, underscoring how strong
              channel and supplier relationships can be used defensively against a digital marketplace. Combined with
              FBN's own acknowledgment that it has made difficult workforce choices to focus on core digital strengths,
              the public record supports a moat that is real but not yet immune to incumbent pricing pressure, channel
              leverage, or partial multi-homing by farms.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
