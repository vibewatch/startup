      - number: '5.4'
        title: Public controls remain thin, and the product perimeter is still shifting
        blocks:
          - type: paragraph
            body: >-
              The main technical-risk signal in the assigned evidence is not product absence but boundary and control
              ambiguity. Digital Commerce 360 reports that FBN spun off crop protection and logistics into Global Crop
              Solutions so FBN could operate as a purer technology marketplace, while still depending on the separated
              supplier through its marketplace. That can simplify focus, but it also makes partner, supply, and
              integration dependencies more important. Separately, the patent and mobile materials show FBN touching
              regulated or high-consequence workflows such as crop-label interpretation, agronomic recommendations,
              grain marketing, and farm finance, yet this pool does not include public evidence of security
              certifications, incident history, model-governance metrics, or service-level commitments. A
              lower-confidence independent profile also indicates continuing litigation around incumbent suppliers
              allegedly constraining marketplace access, reinforcing that ecosystem access remains part of the
              product-risk surface.
