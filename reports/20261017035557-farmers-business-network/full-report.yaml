      - number: '2.3'
        title: Buyer, user, and payer shift with workflow even inside the same farm account
        blocks:
          - type: paragraph
            body: >-
              FBN’s buyer map is organized around family-farm workflows rather than a single software persona. The
              grower or farm manager is typically the user across the app, marketplace, and market-intelligence tools,
              but the budget owner changes depending on the decision being made. Input purchasing pulls against seasonal
              operating budgets, crop-marketing tools monetize time savings and basis visibility, and finance products
              tie into land, equipment, or working-capital decisions with different approval thresholds. This matters
              for adoption timing: a farm that joins for price transparency on chemicals may not immediately convert
              into a finance customer, while a credit user may still treat market intelligence or premium programs as
              optional. The market is therefore cross-sellable, but not automatically one budget or one sales motion.
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
