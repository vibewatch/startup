  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Multi-surface farm workflow, not a point product
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports FBN as a multi-workflow operating surface for farms rather than a narrow
              ecommerce storefront. The current homepage says the platform helps farmers buy inputs and supplies
              directly from manufacturers, access financing and premium marketing programs, connect to grain buyers, and
              use network-derived insights from more than 100,000 member farms. The same page still markets current
              scale metrics of 120,000-plus farmer members, 185 million-plus network acres, $2.5 billion financed,
              100,000-plus input deliveries, and 6,000 seed profiles. That breadth matters because it makes FBN's
              product risk less about one SKU and more about whether the company can keep commerce, financing, and
              decision support coherent on one farmer-facing surface.
