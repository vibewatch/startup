            body: >-
              FBN's clearest product wedge is bundling multiple economically relevant jobs around the farm gate:
              transparent input buying, local grain-buyer access, finance, premium programs, and data-driven agronomy.
              The 2024 Gradable joint-venture announcement adds a specialized sustainability workflow that tracks
