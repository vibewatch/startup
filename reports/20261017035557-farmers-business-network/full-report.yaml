      layers:
        - label: Farmer data and field context
          detail: >-
            Aggregated member-farm data, seed profiles, imagery, scouting notes, and precision events feed the broader
            platform.
          modules:
            - 120,000+ farmer-member network
            - 185M+ network acres
            - 6,000 seed profiles
            - Weekly EVI imagery
            - GPS-tagged scouting notes
          outputs:
            - Benchmarking and agronomic insight context
