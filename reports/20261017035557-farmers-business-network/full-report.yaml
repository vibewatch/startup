        title: Exhibits
        blocks:
          - type: callout
            title: The real market is four linked farm budgets
            body: >-
              FBN’s relevance comes from touching procurement, credit, grain marketing, and decision support in one
              account, so market size is better bounded by workflow depth than by a generic agriculture-spend headline.
            calloutType: insight
            claimRefs:
