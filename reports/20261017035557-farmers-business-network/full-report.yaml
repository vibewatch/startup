      - number: '4.3'
        title: Revenue quality, margin path, and capital adequacy remain the underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The core financial blocker is not demand proof but disclosure depth. Retained public sources show customer
              reach, financing throughput, product breadth, and strategic uses of capital, yet they do not disclose
              recognized revenue, segment contribution, gross margin by line, CAC or payback, credit losses, warehouse
              funding structure, or cash runway. Third-party top-line signals are also too noisy to substitute for
              company data: Multiples reports cumulative funding of $968 million and a last priced valuation of $4
              billion in 2021, while CyberDB shows estimated revenue and a different total raised figure. Crop-marketing
              disclosures also remind investors that commodity activity can involve substantial risk of loss. The public
              verdict is therefore scale with strategic optionality, but still a research-more financial file until
              management provides segmented operating and balance-sheet data.
