  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competition is a fragmented incumbent workflow, not one named pure-play
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence suggests that FBN's competitive set is structurally fragmented. Official FBN
              surfaces describe one account spanning direct input purchasing, grain marketing, farm financing, and data
              or AI tools, while the mobile app extends that bundle into inventory, scouting, community, and local-bid
              monitoring. That means FBN is usually asking a farm to replace a stack of incumbent behaviors: buying
              through local retailers or manufacturer-aligned dealers, calling grain buyers directly, sourcing credit
              through specialist lenders, and managing records or decisions through internal spreadsheets and advisors
              rather than a unified workflow.


              This matters because FBN's differentiation depends more on workflow consolidation and transparency than on
              one narrow feature battle. Sponsored and official company materials repeatedly position FBN against opaque
              negotiated pricing, manual price discovery, and disconnected service relationships. The implication is
              that many substitutes remain viable for farmers that prefer local relationships or already use
              best-of-breed point solutions, but those substitutes typically do not match FBN's full public bundle on
              one surface.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
