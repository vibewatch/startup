    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Current Platform
        blocks:
          - type: paragraph
            body: >-
              The assigned 2026 prefetched record consistently describes FBN as a digital agriculture platform rather
              than a single-point software tool or lender. Current company surfaces combine direct input purchasing,
              financing, grain marketing, benchmarking, and mobile workflow tools under one membership umbrella, while
              independent spin-off reporting still treats the marketplace as the center of the company. What is less
              consistent is the current scale language: the homepage narrative still references "over 100,000 member
              farms," while other current materials cite 120,000+ farmer members and as much as $2.5 billion financed or
              committed. That makes the business model clear, but the exact current denominator for members and acres
              remains a diligence item rather than settled ground truth. The assigned fetched text also does not
              establish a current headquarters or financing stage, so neither should be inherited from the prior report.
