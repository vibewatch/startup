  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          The $50M 2025 round funds AI and marketplace expansion, cross-sell improves across inputs/finance/marketing,
          and the company turns scale into cleaner unit economics.
        - >-
          Only attractive if entry is at or below a reset mark that still leaves room for upside after verifying margin
          and credit performance.
        - >-
          Needs disclosed retention, contribution margin, and lending vintages that are stronger than public evidence
          currently proves.
        - AI/product launches fail to convert into repeat purchase or finance attachment.
      - - Base
        - >-
          FBN remains strategically relevant and keeps growing products, but economics and pricing stay only partly
          disclosed.
        - >-
          Fair value likely sits near or below insider-support levels until outside diligence can triangulate revenue
          quality, cash burn, and downside terms.
        - Most consistent with the retained evidence because scale is visible but valuation inputs are not.
        - A diligence pack shows weak repeat purchase, compressed margin, or elevated credit losses.
      - - Bear
        - >-
          The latest capital is bridge capital, not proof of durable monetization, while channel or credit friction
          limits commercialization.
        - >-
          Material downside exists if new money is priced above fundamentals or sits behind heavy preferences without
          enough margin expansion to bail out returns.
        - Historical Canadian supply conflict and still-pilot financing proofs keep this scenario live.
        - A down round, covenant pressure, or adverse loan-book surprises would move this case to the front.
    notes: >-
      Ranges are qualitative because retained public evidence does not disclose a current valuation mark, preference
      stack, or segment-level economics.
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
