schemaVersion: "report-v2"
artifact: financials
slug: farmers-business-network
runDate: 2026-10-17
company:
  name: Farmers Business Network
chapter:
  number: 4
  title: Financials
  summary: >-
    Farmers Business Network's public record supports a scaled marketplace-plus-finance model and shows
    another $50 million of fresh capital in July 2025, but it does not yet support underwriteable
    conclusions on revenue quality. Official and independent sources disclose member, acreage, product,
    delivery, and financing-volume metrics, while recognized revenue, segment mix, margins, credit
    performance, and runway remain undisclosed.
sections:
  - id: revenue-model
    title: Revenue model surfaces are visible, but realized monetization is not
    body: >-
      FBN publicly positions membership as free and uses that free relationship to pull farmers into
      several monetizable workflows: online input purchasing, financing, grain marketing, premium
      programs, and data or benchmarking tools. Official surfaces show transparent list pricing, mobile
      checkout, grain-buyer discovery, and multiple credit products, while Multiples characterizes the
      revenue model at a high level as commission plus subscription. That is enough to conclude the
      business is not a pure SaaS seat sale and that financing is strategically important, but it is not
      enough to judge recognized revenue mix, realized price realization, or gross profit by stream.
    claimRefs: [CI001, CI004, CI005, CI006, CI012, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: scale-and-capital
    title: Public scale signals are meaningful, and fresh capital still appears expansionary
    body: >-
      Public traction signals are substantial. FBN's homepage shows 120,000+ farmer members,
      185 million+ network acres, $2.5 billion financed, and 100,000+ input deliveries, while July 2025
      coverage and the syndicated company release cite 117,000 farms, 187 million acres, more than
      7,200 products, and nearly $3 billion of financing extended. The slight differences look more like
      timing and rounding drift than a challenge to the broader scale story. The capital history also still
      looks expansionary rather than self-funding: FBN raised $50 million in July 2025 for AI and
      ecommerce expansion, and its 2021 $300 million raise was earmarked for hiring, technology, data
      science, and supply-chain investment.
    claimRefs: [CI002, CI003, CI007, CI008, CI009, CI010, CI011, CI013]
    tableRefs: [TI003]
  - id: underwriting-visibility
    title: Revenue quality, margin path, and capital adequacy remain the underwriting blockers
    body: >-
      The core financial blocker is not demand proof but disclosure depth. Retained public sources show
      customer reach, financing throughput, product breadth, and strategic uses of capital, yet they do not
      disclose recognized revenue, segment contribution, gross margin by line, CAC or payback, credit
      losses, warehouse funding structure, or cash runway. Third-party top-line signals are also too noisy
      to substitute for company data: Multiples reports cumulative funding of $968 million and a last
      priced valuation of $4 billion in 2021, while CyberDB shows estimated revenue and a different total
      raised figure. Crop-marketing disclosures also remind investors that commodity activity can involve
      substantial risk of loss. The public verdict is therefore scale with strategic optionality, but still a
      research-more financial file until management provides segmented operating and balance-sheet data.
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Input marketplace (FBN Direct)
        - Product-margin and/or seller-fee revenue from online farm-input orders
        - Order / SKU
        - 7,200+ products with direct-to-farm delivery; homepage and app emphasize transparent list pricing
        - Strong public proof of usage, weak proof of realized margin or take rate
        - Provide recognized marketplace revenue, gross margin, third-party seller fees, and repeat-purchase cohorts.
      - - FBN Finance
        - Interest income and financing fees across land, input, equipment, and operating credit
        - Loan / credit facility
        - $2.5B+ funds committed on finance page; nearly $3B total financing in July 2025 coverage
        - Strong activity signal, but funding costs, net interest margin, and losses are undisclosed
        - Provide originations, outstanding balances, yield, delinquency, charge-offs, and warehouse-line terms.
      - - Crop marketing / brokerage
        - Brokerage and advisory workflow around grain marketing and buyer connections
        - Transaction / advisory relationship
        - App aggregates bids from thousands of buyers; market disclaimer flags suitability and loss risk
        - Public workflow evidence exists, but no monetization terms or unit economics are public
        - Provide commissions, advisory fees, buyer concentration, and contract structure by crop.
      - - Premium programs
        - Enrollment, verification, and payment programs tied to sustainable practices
        - Program enrollment
        - Homepage says members can access a marketplace of premium programs
        - Existence is public; revenue basis and contribution margin are not
        - Provide pricing, partner economics, and renewal or retention by program.
      - - Membership / intelligence
        - Free membership that seeds demand for commerce, financing, and benchmarking
        - Member relationship
        - Membership is free and positioned as the front door to financing, buyers, and insights
        - Well supported operationally; direct software revenue is not publicly evidenced
        - Clarify whether any subscription or data revenue exists outside transaction-linked services.
    notes: >-
      Rows combine directly stated facts with inferred monetization mechanics; "undisclosed" means the
      retained public record did not publish realized economics for that stream.
    claimRefs: [CI001, CI003, CI004, CI006, CI008, CI009, CI012, CI015, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price / term signal
      - List vs realized
      - Source-backed status
      - Implication
    rows:
      - - Membership
        - Free membership
        - No monetized seat fee evidenced
        - Homepage says membership is free
        - Commercial value must come from downstream transactions, financing, or services.
      - - Input marketplace
        - Transparent list pricing and mobile checkout for inputs
        - List pricing only; realized discounts, rebates, and mix are undisclosed
        - Homepage and app support price visibility before purchase
        - Public pricing transparency can drive demand without proving realized revenue quality.
      - - Farm line of credit
        - Up to $15 million in capital
        - Marketing maximum; actual rates and fees undisclosed
        - Finance page
        - Credit revenue could be material, but underwriting needs APRs, utilization, and defaults.
      - - Land-loan pre-qualification
        - Pre-qualification for a land loan up to $5 million
        - Qualification cap only; actual pricing undisclosed
        - Finance page
        - Shows large-ticket financing ambition without public yield or conversion disclosure.
      - - Farmland Capital
        - Up to 25% of farm value in cash with no interest payments
        - Alternative structure disclosed; economics to FBN undisclosed
        - Finance page
        - Could alter capital intensity materially, but public sources do not show funding source, duration, or profitability.
    notes: >-
      This table intentionally separates marketing maxima and list-price signals from realized commercial
      outcomes; public terms are customer-facing offers, not proof of net revenue or margin.
    claimRefs: [CI001, CI005, CI006, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Recognized revenue
        - No company-disclosed figure in retained public sources
        - Low
        - Top-line quality cannot be underwritten from activity metrics alone
        - Provide audited or management revenue by year and by product line.
      - - Revenue model mix
        - Multiples labels the model "Commission, Subscription"; official surfaces add marketplace, financing, premium programs, and crop marketing
        - Medium
        - Mix drives cyclicality, margin profile, and working-capital needs
        - Provide revenue split across commerce, financing, crop marketing, premium programs, and any software-like subscriptions.
      - - Commerce activity proxy
        - 7,200+ products, 24-72 hour delivery, 100,000+ input deliveries, and 35% of farmers visiting FBN when shopping for inputs
        - Medium
        - Activity scale can support volume without revealing realized gross profit
        - Provide GMV, take rate, repeat purchase, and contribution margin by category.
      - - Financing activity proxy
        - $2.5B+ funds committed on the finance page versus nearly $3B total financing in July 2025 reporting
        - High
        - Credit can be a major revenue and risk driver
        - Provide originations, net interest income, delinquencies, charge-offs, and funding-cost data.
      - - Liquidity and runway
        - No public cash, burn, debt warehouse, or runway disclosure in retained sources
        - Low
        - Capital adequacy cannot be judged from fundraising headlines alone
        - Provide cash on hand, monthly burn, debt maturities, covenants, and next-round trigger.
    notes: >-
      "No public" entries mark diligence gaps rather than zeros. Activity proxies are directionally useful,
      but they are not substitutes for segment economics or balance-sheet disclosure.
    claimRefs: [CI002, CI003, CI008, CI009, CI012, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests FBN monetizes after farmer engagement through transactions and financing,
      not through a paid membership fee.
    data:
      nodes:
        - label: Farmer membership
          value: Free
          note: Membership is free and acts as the front door to commerce, financing, and market services.
        - label: Input purchasing
          value: 7,200+ products
          note: Marketplace activity includes transparent list pricing and direct-to-farm delivery.
        - label: Crop marketing
          value: Buyer bids + breakeven tools
          note: App workflow includes buyer-bid aggregation, inventory tracking, and break-even calculations.
        - label: Financing
          value: $2.5B+ to nearly $3B financed
          note: Public sources show large financing throughput across land, input, equipment, and operating products.
        - label: Premium programs / insights
          value: Programs + benchmarking
          note: Official surfaces position premium programs and data-driven insights as engagement levers.
        - label: Revenue & gross profit
          value: Mix undisclosed
          note: Public sources support margin, fee, and interest-income pathways, but not realized mix or profitability.
      edges:
        - from: Farmer membership
          to: Input purchasing
          label: Browse and order inputs
        - from: Farmer membership
          to: Crop marketing
          label: Compare bids and manage sales
        - from: Farmer membership
          to: Financing
          label: Apply for credit
        - from: Farmer membership
          to: Premium programs / insights
          label: Enroll and benchmark
        - from: Input purchasing
          to: Revenue & gross profit
          label: Merchandise margin / seller fees not broken out
        - from: Crop marketing
          to: Revenue & gross profit
          label: Advisory or brokerage economics undisclosed
        - from: Financing
          to: Revenue & gross profit
          label: Interest and fees offset by funding costs and losses
        - from: Premium programs / insights
          to: Revenue & gross profit
          label: Program revenue not publicly segmented
    claimRefs: [CI001, CI003, CI005, CI006, CI008, CI009, CI012, CI016]
callouts:
  - calloutType: strength
    title: Real distribution and credit surface are visible
    body: >-
      Even without published revenue, the public file shows a meaningful operating surface: six-figure
      farmer membership, nationwide input deliveries, and multi-billion-dollar financing throughput.
    claimRefs: [CI002, CI003, CI008, CI009]
  - calloutType: risk
    title: Revenue quality is still opaque
    body: >-
      Underwriting cannot rely on the public record because realized pricing, segment mix, gross margin,
      credit losses, and runway are still absent, while third-party top-line estimates disagree.
    claimRefs: [CI012, CI013, CI014, CI016]
  - calloutType: insight
    title: Fresh capital looks expansionary, not validating
    body: >-
      The 2025 raise appears to fund AI, ecommerce, financing, and distribution expansion, much like the
      2021 raise funded hiring, data science, and supply chain. That supports strategic ambition, not yet a
      disclosed margin inflection.
    claimRefs: [CI007, CI010, CI011, CI013]
