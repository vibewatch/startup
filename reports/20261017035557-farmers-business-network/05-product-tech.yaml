  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Public security certifications, status-page history, uptime metrics, or formal service-level commitments for the commerce, finance, and mobile surfaces.
      whyItMatters: The product touches payments, finance, agronomic guidance, and farm records, so operational-control quality materially affects implementation and retention risk.
      diligencePath: Request SOC 2 or equivalent control reports, status-history exports, incident postmortems, and enterprise support/SLA documentation by module.
