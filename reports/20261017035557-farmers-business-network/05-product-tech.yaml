      - Current workflow
      - FBN solution
      - Measurable benefit
      - Limitation
    rows:
      - [Buy inputs, "Dealer quotes and phone-based comparison", "FBN Direct on web/mobile", "Transparent list pricing and direct-to-farm delivery", "Public evidence does not disclose realized price advantage by category"]
      - [Market grain, "Call local buyers and track contracts manually", "Bid aggregation, contracts, scale tickets, and payments in Crop Marketing", "Local bid visibility and digital sale/inventory tracking", "Buyer coverage, volumes, and retention are undisclosed"]
      - [Monitor field activity, "Separate notes, desktop files, and delayed scouting", "Weekly EVI imagery, GPS-tagged scouting notes, team sharing, and precision-event timeline", "Field history and observations available on phone", "No public uptime, offline mode, or implementation metrics in pool"]
      - [Fund land and working capital, "Traditional lender paperwork and slower approvals", "Digital finance intake with multiple ag-loan products", "3,200+ farmers served and line-of-credit offers up to $15 million", "Approval rates, delinquency, and funding-partner dependence are undisclosed"]
      - [Earn sustainability premiums, "Separate enrollment and verification workflows", "Gradable tracking, scoring, and incentives", "20,000+ users, 12M+ acres, and $30M+ annual incentives on the Gradable platform", "Unit economics to FBN and persistence after corporate restructuring are unclear"]
    notes: Benefits are quoted from public product claims; where the pool lacks denominator, adoption, or economics detail, the limitation column preserves that gap explicitly.
    claimRefs: [CE003, CE004, CE005, CE006, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Member-data and benchmarking layer, "Aggregates member-farm data and seed profiles into insights", "Farmer data contribution and data quality", "Public pool does not show governance detail for data accuracy or privacy enforcement"]
      - [Commerce engine, "Supports digital purchase of crop protection, fertilizer, nutrition, feed, and supplies", "Supplier inventory, logistics, and distribution partners", "Margin, fulfillment SLA, and supplier concentration are undisclosed"]
      - [Crop Marketing workflow, "Connects farmers to local grain bids, contracts, tickets, and payments", "Buyer participation and payments operations", "No public evidence on dispute handling, integration depth, or buyer churn"]
      - [Finance workflow, "Handles lending discovery and application across multiple loan products", "Credit analysts, funding partners, and regulated lending controls", "Public evidence does not show credit performance or servicing quality"]
      - [Gradable sustainability infrastructure, "Tracks practices and outcomes and links farmer and buyer experiences", "ADM JV and commercial partners", "Partner concentration and carve-out boundaries could limit roadmap control"]
      - [AI advisor stack, "Uses LLMs, agricultural corpora, label extraction, and recommendation tools", "Public, licensed, and proprietary agronomic data plus prompt/fine-tuning workflows", "Hallucination, label misread, and regulatory-variance risks are visible; mitigation evidence is thin"]
    notes: This table mixes current product pages, the Gradable JV announcement, and the patent filing to separate visible architecture layers from still-unproven control quality.
    claimRefs: [CE001, CE004, CE006, CE009, CE011, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: FBN's public architecture stacks farmer data and field tools underneath transaction, finance, sustainability, and AI workflows.
    data:
      layers:
        - label: Farmer data and field context
          detail: Aggregated member-farm data, seed profiles, imagery, scouting notes, and precision events feed the broader platform.
          modules:
            - 120,000+ farmer-member network
            - 185M+ network acres
            - 6,000 seed profiles
            - Weekly EVI imagery
            - GPS-tagged scouting notes
          outputs:
            - Benchmarking and agronomic insight context
            - Field history on mobile
        - label: Commerce and grain-marketing workflows
          detail: Farmer transactions span direct input buying and grain merchandising rather than one isolated marketplace.
          modules:
            - FBN Direct input purchasing
            - Transparent list pricing
            - Direct-to-farm delivery
            - Local grain-buyer bids
            - Contracts, scale tickets, and payments
          outputs:
            - Digital procurement
            - Crop-marketing execution
        - label: Finance and premium-program layer
          detail: Financing and premium enrollment extend the platform into working-capital and sustainability economics.
          modules:
            - Land, input, equipment, and operating-credit products
            - Up to $15M line of credit offer
            - Premium-program enrollment
            - Verification and payment workflow
          outputs:
            - Loan application and decision support
            - Sustainability-premium access
        - label: Sustainability infrastructure
          detail: Gradable adds a buyer-facing sustainability data rail linked to regenerative-practice verification.
          modules:
            - Practice and outcome tracking
            - Farm-level buyer data
            - 20,000+ farmer users
            - 12M+ acres
            - 200M+ bushels scored
          outputs:
            - Premium eligibility
            - Traceable sustainable-grain workflow
        - label: Support and community layer
          detail: FBN pairs digital workflows with local agronomists, AI tools, member forums, and in-person events.
          modules:
            - Local agronomists
            - FBN Community online forum
            - In-person farmer events
            - AI tool support
          outputs:
            - Product onboarding help
            - Peer knowledge exchange
        - label: AI advisory layer
          detail: The patent filing describes an agriculture-specific LLM advisor with tool-based retrieval rather than a generic chatbot alone.
          modules:
            - Product-label extraction
            - Product finder and usage tool
            - Complementary product recommendation tool
            - Public, licensed, and proprietary agronomic corpus
            - Land-loan appraisal narrative use case
          outputs:
            - Agronomic question answering
            - Label-guided recommendation workflow
    claimRefs: [CE004, CE009, CE010, CE012, CE013]
