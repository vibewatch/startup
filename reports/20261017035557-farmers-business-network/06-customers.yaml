company:
  name: Farmers Business Network
chapter:
  number: 6
  title: Customers
  summary: >-
    FBN shows a broad North American farm customer surface spanning inputs, financing, grain marketing,
    insights, and community, with repeated public claims of 120,000+ members and large workflow breadth.
    The public record is materially weaker on independently verified production deployments, retention, and
    concentration, because most assigned evidence is company-issued or syndicated company announcements.
sections:
  - id: customer-segmentation
    title: Customer base segmentation and workflow coverage
    body: >-
      Public materials present FBN as a bundled operating platform for family farms rather than a
      single-product vendor. The homepage ties membership to inputs, financing, crop marketing, premium
      programs, agronomic insights, and community, while the mobile app extends that bundle into daily use
      cases such as input purchasing, bid checking, inventory tracking, scouting notes, and team
      collaboration. The clearest payer-side segmentation comes from FBN Finance, which markets distinct
      lending products for land, inputs, equipment, and operating capital, while grain-marketing users are
      positioned as a separate workflow with buyer discovery, contract management, and payments. That
      breadth supports land-and-expand logic, but the public record still does not separate free members,
      active transactors, and multi-product customers. 
    claimRefs: [CU001, CU002, CU004, CU005, CU006]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption trajectory and proof quality
    body: >-
      FBN's public scale claims have risen materially over time, from 33,500 members farming more than 82
      million acres in the 2021 capital-raise post to over 117,000 farms and 187 million acres in July
      2025 coverage, and then to 120,000+ members with 185 million+ to 190 million+ acres in 2025-2026
      materials. Financing and commerce metrics point to meaningful commercial activity, including 3,200+
      farmers served by FBN Finance, $2.5B+ funds committed on the finance page, nearly $3B financed in
      July 2025 release coverage, 100,000+ input deliveries on the homepage, and 7,200+ marketplace
      products in release-based coverage. The quality of proof is mixed, however: the strongest named
      customer evidence in the assigned pool is still company-hosted testimonial content and community
      activity rather than independent case studies or disclosed renewal cohorts.
    claimRefs: [CU003, CU007, CU008, CU009, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-and-risk
    title: Expansion loops, durability, and concentration risk
    body: >-
      The expansion story is credible on workflow adjacency. FBN keeps adding product categories,
      financing tools, community touchpoints, and events that can cross-sell across the same farm account,
      while the October 2025 spin-off reframed the company as a more open, asset-light marketplace with
      more third-party sellers and financial partners. That helps assortment breadth and capital
      efficiency, but it also means customers may depend on commercial relationships outside FBN for
      continuity in key categories such as crop protection. More importantly, the assigned public evidence
      never discloses NRR, GRR, churn, contract length, top-customer exposure, or product-line cohort
      behavior, so durability and concentration remain core diligence gaps rather than proven strengths.
    claimRefs: [CU010, CU011, CU012, CU013]
