      severity: material
      topic: retention-gap
      missingEvidence: Current NRR, GRR, churn, renewal, and cohort-repeat metrics by product line or farm segment.
      whyItMatters: Retention quality is the core test of whether FBN's broad surface becomes durable recurring business rather than low-friction lead generation.
      diligencePath: Request cohort tables for marketplace buyers, finance borrowers, crop-marketing users, and multi-product members for 2024-2026.
      relatedQuestionRefs: [QU007]
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-customer exposure, partner/channel concentration, seller mix after the GCS spin-off, and product-line revenue concentration.
      whyItMatters: The open-marketplace strategy improves breadth, but it can also hide dependence on a narrow set of large customers, product categories, or strategic sellers.
      diligencePath: Obtain product-line GMV or revenue mix, top-customer concentration, and post-spin seller concentration for marketplace supply and finance origination.
      relatedQuestionRefs: [QU006, QU007]
    - type: missing-source
      severity: material
      topic: TU003 named customer proof quality
      missingEvidence: Independent customer case studies, procurement records, or disclosed deployment outcomes for the named proof surfaced in TU003.
      whyItMatters: Company-hosted testimonials can show relevance, but they do not prove production depth, renewal, contract value, or independently verified outcomes.
      diligencePath: Ask FBN for customer references with deployment length, spend, product mix, and measurable outcomes, then corroborate them with external records or customer-side materials.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
