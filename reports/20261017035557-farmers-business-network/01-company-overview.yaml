  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-transparency
      missingEvidence: Current post-2025 valuation, share-class pricing, liquidation preferences, and any secondary or structured financing terms.
      whyItMatters: Valuation and security terms materially affect downside protection and whether legacy headline values still anchor judgment.
      diligencePath: Request the latest financing deck, cap table, and board-approved pricing materials.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001, TO003]
    - type: private-evidence-only
      severity: material
      topic: current-financials
      missingEvidence: Current recognized revenue, gross margin, contribution margin, and finance-segment economics.
      whyItMatters: Product breadth and member scale do not answer whether the platform is compounding efficiently or carrying hidden balance-sheet risk.
      diligencePath: Request segment revenue, margin, and lending-performance detail from management or the data room.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001]
    - type: stale
      severity: material
      topic: headcount-governance
      missingEvidence: A refreshed employee count, current headquarters, canonical financing stage, and a current public board or governance roster.
      whyItMatters: Corporate identity, leadership depth, operating leverage, and governance quality all matter for execution risk during the asset-light transition.
      diligencePath: Confirm via current corporate filings, leadership pages, investor materials, or a board and governance appendix.
      relatedQuestionRefs: [QO003, QO008]
      relatedTableRefs: [TO001, TO002]
    - type: conflicting-data
      severity: material
      topic: scale-definition
      missingEvidence: One canonical definition and reporting date for members, member farms, and network acres.
      whyItMatters: Inconsistent current denominators can overstate commercial reach and complicate later customer, market, and valuation analysis.
      diligencePath: Ask management to reconcile active members, farms, acres, and geography coverage in one dated KPI sheet.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
