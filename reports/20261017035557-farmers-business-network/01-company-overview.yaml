figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Prefetched sources support a 2014 origin story, a 2021 financing step-up,
      and a 2026 shift toward a more open marketplace plus a cleaner operating
      perimeter.
    data:
      items:
        - date: "2014"
          label: FBN says it started with three farms and a transparency mission.
          detail: >-
            The 2021 capital-raise announcement says the company "started in
            2014 with just 3 farms" and set out to improve data-driven farm
            decisions.
          tone: positive
          claimRefs: [CO006]
        - date: "2021"
          label: FBN announced a $300 million capital raise led by Fidelity.
          detail: >-
            The company said the round paired FBN with long-term capital partners
            and would support future hiring and technology investment.
          tone: positive
          claimRefs: [CO007, CO008]
        - date: "2021"
          label: FBN also introduced Gradable alongside its finance expansion push.
          detail: >-
            The same announcement presented Gradable as a new company for
            sustainability and commercial-ag services while highlighting finance
            offerings.
          tone: neutral
          claimRefs: [CO008]
        - date: "2026-02-24 to 2026-02-26"
          label: Farmer2Farmer VII was scheduled for Omaha.
          detail: >-
            FBN said the seventh edition of Farmer2Farmer would welcome more than
            1,000 farmers from the U.S. and Canada.
          tone: positive
          claimRefs: [CO009]
        - date: "2026-06-11"
          label: Marketplace expansion added new categories and partners.
          detail: >-
            A company-issued release hosted by AmericanAg Network highlighted
            broader oils, biologicals, seed, livestock, and supplies coverage.
          tone: positive
          claimRefs: [CO010]
        - date: "Observed by 2026-10-17"
          label: Baron described GCS as a standalone first-mile spin-off.
          detail: >-
            AgribusinessGlobal quotes Charles Baron saying GCS now handles
            formulation, regulatory, and supply-chain work while FBN stays focused
            on farmers; the fetched text does not include its publication date.
          tone: neutral
          claimRefs: [CO011]
        - date: "Observed by 2026-10-17"
          label: AgFunder framed the separation as a pure-platform reset.
          detail: >-
            AgFunder reported that the split helps FBN concentrate on its digital
            marketplace while GCS becomes a preferred supplier; the fetched text
            does not include its publication date.
          tone: risk
          claimRefs: [CO013]
        - date: "2026-10-17"
          label: Current public snapshot still emphasizes scale more than economics.
          detail: >-
            Current company pages highlight 120,000+ members and $2.5 billion in
            financing scale, but the assigned pool still does not disclose a
            refreshed valuation, recognized revenue, or current headcount.
          tone: risk
          claimRefs: [CO002, CO015]
    approximationNotes: >-
      The GCS items use the retrieval date as an observation bound because their
      fetched text omits original publication dates; it is not the event date.
    claimRefs: [CO002, CO006, CO007, CO008, CO009, CO010, CO011, CO013, CO015]
