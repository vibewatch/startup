slug: farmers-business-network
runDate: 2026-10-17
company:
  name: Farmers Business Network
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Farmers Business Network (FBN) still presents as a scaled ag-commerce and
    farm-finance platform with a June 2026 marketplace expansion and an
    operating-model shift that separates first-mile crop-protection operations
    into Global Crop Solutions. The assigned public record is strong on product
    breadth and member reach, but current scale disclosures are inconsistent and
    it does not establish current valuation, recognized revenue, headcount,
    headquarters, financing stage, or total capital raised.
sections:
  - id: identity-and-current-platform
    title: Identity and Current Platform
    body: >-
      The assigned 2026 prefetched record consistently describes FBN as a digital
      agriculture platform rather than a single-point software tool or lender.
      Current company surfaces combine direct input purchasing, financing, grain
      marketing, benchmarking, and mobile workflow tools under one membership
      umbrella, while independent spin-off reporting still treats the marketplace
      as the center of the company. What is less consistent is the
      current scale language: the homepage narrative still references "over
      100,000 member farms," while other current materials cite 120,000+ farmer
      members and as much as $2.5 billion financed or committed. That makes the
      business model clear, but the exact current denominator for members and
      acres remains a diligence item rather than settled ground truth. The
      assigned fetched text also does not establish a current headquarters or
      financing stage, so neither should be inherited from the prior report.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO016]
    tableRefs: [TO001]
  - id: leadership-and-operating-model
    title: Leadership and Operating Model
    body: >-
      Public leadership visibility in the assigned pool is concentrated in two
      people: CEO Diego Casanello and co-founder Charles Baron. Casanello is the
      executive voice on the June 2026 marketplace expansion and the later
      spin-off narrative, while Baron appears as both a co-founder and the public
      explainer of how FBN is narrowing into a more open marketplace and service
      platform after separating first-mile formulation, regulatory, and supply
      chain work into Global Crop Solutions (GCS). That provides enough evidence
      to assess operating direction, but not enough to verify a broader board or
      governance bench from the current prefetched pool. Key-person dependence
      therefore looks elevated at the public-disclosure layer even if the actual
      management bench may be deeper in private materials.
    claimRefs: [CO009, CO011, CO012, CO013, CO014]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital, Scale, and Stakeholders
    body: >-
      The strongest dated financing fact in the assigned evidence remains
      historical: FBN's 2021 announcement of a $300 million capital raise led by
      Fidelity Management and Research. AgFunder separately reports that FBN
      raised $50 million "earlier this year," but its publication date is absent
      from the fetched text; that relative period cannot be normalized or added
      to a lifetime total without risking double counting. The 2021 source framed
      its round as fuel for hiring, technology, finance, and sustainability
      expansion, which helps explain the later breadth across lending, grain
      marketing, and digital tools. Current evidence is still much clearer on
      commercial reach than economics: refreshed valuation, recognized revenue,
      current headcount, total raised, and capital-structure terms remain missing.
    claimRefs: [CO002, CO006, CO007, CO008, CO010, CO011, CO012, CO015]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones and Open Questions
    body: >-
      The milestone sequence in this pool supports a coherent refresh story. FBN
      says it began in 2014, added a major capital infusion in 2021, expanded its
      marketplace in June 2026, and later described an operating-model change
      that moves crop-protection sourcing and first-mile infrastructure into GCS.
      The fetched spin-off articles omit their original publication dates, so the
      timeline marks only when that current evidence was accessed rather than
      assigning an unsupported event date. The change still points to a more
      asset-light marketplace posture and broader partner openness. Disclosure
      quality remains the blocker: valuation, recognized revenue, headcount,
      headquarters, stage, total raised, and canonical member/acres definitions
      remain unresolved.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
