  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - FBN
      - 现状经销商 / 既有渠道
      - 专业单点解决方案
      - 含义
    rows:
      - - 投入品采购和配送
        - 广泛的在线市场，支持直送农场；2025 年 7 月宣称有 7,200 种产品
        - 可通过本地经销商网络获得，但指定资料池未显示同等数字化广度
        - 通常按产品线或服务收窄
        - FBN 的公开优势是便利和组合式商务；普遍价格优势尚未得到证明
      - - 种子 / 投入品价格透明度
        - 全国平均价格、种子档案、基准分析和公司声称的透明度工具
        - 赞助的 AGDaily 报道称本地谈判价格不透明
        - 往往只覆盖一种作物、一家贷款方或一种顾问工作流
        - 即使实际节省尚未获得独立证明，透明度仍是对现状的明显突破口
      - - 谷物营销工作流
        - 应用内提供本地买方报价、合同管理、库存跟踪、付款和盈亏平衡工具
        - 许多农场仍可直接致电买家，或使用传统经纪关系
        - 专业经纪商可能具备相当的执行深度，但没有完整组合
        - FBN 靠减少电话沟通，并把记录集中在同一平台上竞争
      - - 嵌入式融资广度
        - 在一个品牌界面中提供土地、投入品、设备、LOC、经营额度和农地资本产品
        - 经销商融资可能存在，但指定资料池未记录
        - 专业贷款方在单一类别中深耕
        - 如果农场偏好在商务和信贷上使用同一交易对手，组合经济性会更好
      - - 数据 / AI 层
        - 基准分析、种子分析、社区数据、Norm AI 和规划中的 AI Context Engine
        - 指定资料池未显示可比的既有企业数字化情境层
        - 一些单点工具可能帮助完成一种工作流，但资料池无法证明其广度
        - FBN 的护城河论点越来越依赖专有情境加交易入口，而不只是产品目录
    notes: 由于指定资料池包含的 FBN 披露远多于第三方竞争者规格，未获支持的竞争者单元格标记为未知，或按类别表述。
