  - id: FE001
    title: 产品架构图
    type: stack
    summary: FBN 的公开架构以农户数据和田间工具为底座，向上支撑交易、金融、可持续发展和 AI 工作流。
    data:
      layers:
        - label: 农户数据与田间背景
          detail: 汇总的会员农场数据、种子档案、影像、巡田记录和精准农业事件，为更广泛的平台提供输入。
          modules:
            - 120,000+ 农户会员网络
            - 185M+ 网络覆盖英亩数
            - 6,000 个种子档案
            - 每周 EVI 影像
            - GPS 标记的巡田记录
          outputs:
            - 基准比较和农艺洞察背景
            - 移动端田间历史
        - label: 商业与粮食营销工作流
          detail: 农户交易覆盖直接采购投入品和粮食商品化，而不是局限于一个孤立市场。
          modules:
            - FBN Direct 投入品采购
            - 透明标价
            - 直送农场
            - 本地粮食买方报价
            - 合同、过磅单和付款
          outputs:
            - 数字化采购
            - 作物营销执行
        - label: 金融与溢价项目层
          detail: 融资和溢价项目注册，把平台延伸到营运资本和可持续发展业务。
          modules:
            - 土地、投入品、设备和运营信贷产品
            - 最高 $15M 信用额度产品
            - 溢价项目注册
            - 验证与付款工作流
          outputs:
            - 贷款申请与决策支持
            - 可持续发展溢价准入
        - label: 可持续发展基础设施
          detail: Gradable 增加了一条面向买方的可持续发展数据链，并连接再生农业实践验证。
          modules:
            - 实践与结果跟踪
            - 农场层面的买方数据
            - 20,000+ 名农户用户
            - 12M+ 英亩
            - 200M+ 蒲式耳已评分
          outputs:
            - 溢价资格
            - 可追溯的可持续粮食工作流
        - label: 支持与社区层
          detail: FBN 将数字工作流与本地农艺师、AI 工具、会员论坛和线下活动结合起来。
          modules:
            - 本地农艺师
            - FBN Community 在线论坛
            - 线下农户活动
            - AI 工具支持
          outputs:
            - 产品上手支持
            - 同行知识交流
        - label: AI 咨询层
          detail: 专利申请描述了一种农业专用 LLM 顾问，依靠工具检索，而不只是通用聊天机器人。
          modules:
            - 产品标签提取
            - 产品查找与使用工具
            - 互补产品推荐工具
            - 公开、授权和自有农艺语料库
            - 土地贷款评估叙事用例
          outputs:
            - 农艺问答
            - 标签引导的推荐工作流
    claimRefs:
      - CE004
      - CE009
      - CE010
      - CE012
      - CE013
