    title: 正反论点表
    columns:
      - 论点
      - 保留来源中的证据
      - 会改变判断的因素
    rows:
      - - 正论：分销规模和工作流覆盖面
        - FBN 仍在宣传 120,000+ 名会员、185M+ 英亩、融资、粮食营销、溢价项目和市场投入品；2025 年 7 月材料则提到 117,000 个农场、7,200+ 种产品以及接近 $3B 的融资规模。
        - 经过验证的 cohort 留存率、抽成率和毛利率数据，才能让规模真正具备融资价值，而不只是看起来亮眼。
      - - 正论：金融与数据可以加深钱包份额
        - 融资页面显示已服务 3,200+ 名农户、承诺资金超过 $2.5B，并提供最高 $15M 的信用额度产品；AgWeb 也显示 FBN 仍在生成自有的价格透明度数据。
        - 按批次拆分的贷款账本表现、CAC / 回收期，以及投入品、金融和营销业务的附加率，将显著增强这一论点。
      - - 反论：价格仍无法验证
        - 2025 年融资披露了 $50M 金额和投资者，但保留的公开来源没有披露该轮估值或优先股堆叠。
        - 条款清单、股权结构表以及二级交易 / 董事会估值背景，可能把这场讨论从“继续跟踪”变成可投资的价格判断。
      - - 反论：执行与渠道风险仍然重要
        - Reuters 记录了严重到触发加拿大反垄断调查的历史供应商反弹，而 Agriculture Dive 仍将再生农业贷款的验证描述为试点规模。
        - 稳定渠道准入、健康信贷损失表现以及项目更广泛采用的证据，会收窄看空情景。
    notes: 这些行将保留证据综合为面向决策的论点；没有加入未披露的估值计算。
