              当前融资背景足以支持继续跟踪，但不足以支持按某个价格承诺投资。指定证据池中最后一轮明确披露的大额融资是 2021 年的 $300M；最新的 2025
              年融资只披露了金额和投资者，没有披露估值或优先权条款。因此，公开证据能做的诚实比较只有公司内部口径：一轮规模大得多的 2021 年融资，对比一轮面向产品和 AI 扩张、规模更小的 2025
              年刷新融资。在这种情况下，在管理层证明当前利润率、复购和贷款账簿表现前，基准情景应假设估值纪律低于任何未披露的内部估值。
