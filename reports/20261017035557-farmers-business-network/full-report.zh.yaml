        - 指定资料池未公开披露
        - 即使 FBN 的数字体验更好，供应商和渠道的杠杆仍可能放慢市场去中介化
      - - 专业谷物经纪商 / 买方关系
        - 单点解决方案
        - FBN 应用汇集了数千名买家，说明外部市场较为分散
        - 销售谷物的农场经营者
        - 报价、合同管理、销售记录、付款
        - 报价经济具有本地性和时效性，不是公开目录定价
        - 即使缺少 FBN 更广泛的农场经营组合，专业机构仍可凭本地执行能力保持竞争力
      - - 专业农业贷款方
        - 单点解决方案
        - 仅 FBN Finance 页面就列出服务 3,200+ 名农户和多种贷款产品；指定资料池没有同等的竞争者披露
        - 寻求营运资金、土地或设备融资的农场经营者
        - 土地、投入品、设备、LOC、经营额度和农地资本产品
        - FBN 将利率宣传为“great”，但未公开逐项列明；资料池中竞争者利率也未公开
        - 信贷专业机构可在信贷评估关系和定价上竞争，而 FBN 则把金融嵌入商务和数据旁边
      - - 内部自建 + 顾问
        - 现状 / 替代方案
        - 无需外部资本；负担由农场承担
        - 所有人 / 经营者和农场团队
        - 电子表格、电话、内部记录、可信顾问
        - 以人工投入为基础，而非公开定价
        - 现金支出可能最低，但会保留数据分散和更高的工作流摩擦
    notes: 由于指定资料池更适合分析组合与替代方案，而非直接画像初创公司，行项目混合了已命名企业和替代类别；未知单元格反映公开证据缺失，而非分析师推断。
