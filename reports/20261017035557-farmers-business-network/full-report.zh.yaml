          value: 7,200+ products
          note: 市场业务包括透明标价和直送农场。
        - label: 作物营销
          value: Buyer bids + breakeven tools
          note: 应用工作流包括买方报价汇总、库存跟踪和盈亏平衡计算。
        - label: 融资
          value: $2.5B+ to nearly $3B financed
