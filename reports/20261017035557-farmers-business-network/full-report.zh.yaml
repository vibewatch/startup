  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 2025 年的 $50M 融资用于 AI 和市场扩张，投入品 / 金融 / 营销之间的交叉销售改善，公司把规模转化为更清晰的单位经济性。
        - 只有当入场价不高于重置估值、且验证毛利率和信贷表现后仍留有上行空间时，才具吸引力。
        - 需要披露强于当前公开证据所能证明水平的留存率、贡献毛利和各批次贷款数据。
        - AI / 产品发布未能转化为复购或金融业务附加。
      - - 基准
        - FBN 保持战略相关性，产品持续增长，但单位经济性和定价仍只部分披露。
        - 在外部尽调能够交叉验证收入质量、现金消耗和下行条款前，公允价值可能接近或低于内部人支持价位。
        - 这与保留证据最一致：规模可见，但估值输入不可见。
        - 尽调材料显示复购疲弱、利润率收缩或信贷损失上升。
      - - 悲观
        - 最新资本是过桥资金，并不能证明变现具有持续性；渠道或信贷摩擦也限制商业化。
        - 如果新资金定价高于基本面，或处于沉重优先股堆叠之后、而利润扩张又不足以挽救回报，下行风险将很大。
        - 加拿大历史供应冲突以及仍处于试点阶段的融资验证，让这一情景仍然成立。
        - 下轮融资、契约压力或贷款账本出现不利意外，都会让这一情景成为首要情景。
    notes: 这些区间是定性的，因为保留的公开证据没有披露当前估值、优先股堆叠或分部层面的单位经济性。
