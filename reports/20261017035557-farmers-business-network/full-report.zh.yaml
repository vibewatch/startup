  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在受监管活动、资本敞口和客户利润压力交汇处，剩余风险严重度最高。
    data:
      columns:
        - label: 中等可能性
          note: 如果执行指标和合规控制有效，风险可以控制。
        - label: 高可能性
          note: 保留的公开记录已显示近期压力。
        - label: 极高可能性
          note: 压力已嵌入 2026 年运营环境。
      rows:
        - label: 供应商 / 买方依赖
          note: 市场覆盖面和报价流动性依赖外部交易对手。
          values:
            - label: 高剩余严重度
              tone: high
              note: 供应商或买方退出将削弱品类丰富度和市场流动性。
            - ''
            - ''
        - label: 应用 / 工作流可靠性
          note: 一个应用同时触达多个会员工作流。
          values:
            - ''
            - label: 中等剩余严重度
              tone: medium
              note: 服务中断会同时冲击订购、营销和团队工作流。
            - ''
        - label: 扩张与物流执行
          note: 品类和地域仍在扩展。
          values:
            - ''
            - label: 高剩余严重度
              tone: high
              note: 新品类和计划中的加拿大分销增长增加履约复杂度。
            - ''
        - label: 信贷与资金敞口
          note: 如果资金或借款人质量恶化，金融规模会放大损失。
          values:
            - ''
            - label: 关键剩余严重度
              tone: critical
              note: 如果借款人状况或合作伙伴资金支持转弱，规模化金融产品会放大损失。
            - ''
        - label: 受监管的多实体业务组合
          note: 经纪、贷款、投入品和药房业务都需要严密控制。
          values:
            - ''
            - label: 关键剩余严重度
              tone: critical
              note: 合规失败可能蔓延至融资、市场信任和受监管产品分销。
            - ''
        - label: 农场收入承压
          note: 客户经济性仍暴露于大宗商品价格和投入品成本。
          values:
            - ''
            - ''
            - label: 高剩余严重度
              tone: high
              note: 独立来源显示，2026 年生产者利润率仍承受压力。
    approximationNotes: 该矩阵是基于保留来源证据的定性排序；没有在所引事实之外推断概率分布。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR009
      - CR010
      - CR011
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据指向一个真实的平台，具备上行期权，但价格和经济性缺失，使建议仍停留在“继续研究”。
    data:
      nodes:
        - label: 规模化农户触达
          detail: 当前页面显示 120,000+ 名会员 / 185M+ 英亩；2025 年 7 月材料显示 117,000 个农场 / 187M 英亩。
        - label: 扩大的变现面
          detail: 投入品、作物营销、融资和数据 / AI 产品创造多条钱包份额路径。
        - label: 新资本延长建设周期
          detail: 2025 年 7 月的 $50M 融资，接续 2021 年最后一轮明确披露的 $300M 大额融资。
        - label: 但价格无法验证
          detail: 保留的 2025 年来源没有披露该轮估值或优先权结构。
        - label: 执行风险仍然存在
          detail: 渠道冲突历史和试点规模的再生农业贷款，使下行情景仍然成立。
        - label: 建议：继续研究
          detail: 只有在披露股权结构条款、单位经济性和贷款账本表现后，才重新评估投资判断。
      edges:
        - from: Scaled farmer reach
          to: Broadened monetization surfaces
          label: 支撑交叉销售上行空间
        - from: Broadened monetization surfaces
          to: Fresh capital extends the build
          label: 让新资本更有用
        - from: Fresh capital extends the build
          to: But price is not testable
          label: 有资金，但没有定价
        - from: But price is not testable
          to: Execution risk remains live
          label: 不透明性放大下行风险
        - from: Execution risk remains live
          to: 'Recommendation: research more'
          label: 让信心低于买入门槛
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
