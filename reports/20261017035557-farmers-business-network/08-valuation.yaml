- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence from retained sources
  - What would change the view
  rows:
  - - 'Thesis: scaled distribution and workflow breadth'
    - FBN still markets 120,000+ members, 185M+ acres, financing, grain marketing, premium programs, and marketplace inputs, while July 2025 materials cite 117,000 farms, 7,200+ products, and nearly $3B financed.
    - Verified cohort retention, take-rate, and gross-margin data would make scale more financeable rather than merely impressive.
  - - 'Thesis: finance and data can deepen wallet share'
    - The finance page shows 3,200+ farmers served, $2.5B+ funds committed, products up to $15M lines of credit, and AgWeb shows FBN still generating proprietary price-transparency data.
    - Loan-book performance by vintage, CAC/payback, and attach rates across inputs, finance, and marketing would strengthen the case materially.
  - - 'Anti-thesis: price is still not testable'
    - The 2025 funding disclosures identify the $50M amount and investors, but the retained public sources do not disclose the round valuation or preference stack.
    - A term sheet, cap table, and secondary/board-mark context could convert this from a track name into an investable price debate.
  - - 'Anti-thesis: execution and channel risk still matter'
    - Reuters documented historical supplier pushback serious enough to trigger a Canadian antitrust probe, while Agriculture Dive still describes regenerative lending proof at pilot scale.
    - Evidence of stable channel access, healthy credit loss experience, and broader program adoption would narrow the bear case.
  notes: Rows synthesize retained evidence into decision-oriented arguments; they do not add undisclosed valuation math.
