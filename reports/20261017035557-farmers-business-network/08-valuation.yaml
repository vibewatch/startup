  name: Farmers Business Network
chapter:
  number: 8
  title: Valuation
  summary: FBN has enough public evidence to justify ongoing diligence, but not enough to justify paying through an undisclosed late-stage private mark. Fresh 2025 funding, platform breadth, and member scale support upside optionality, yet the retained evidence still lacks the valuation terms, unit economics, and finance-book transparency needed for a conviction buy call.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'FBN looks investable as a category asset, but not yet as a public-evidence-backed price. The retained evidence shows a real multi-product platform with fresh July 2025 funding, a large member network, and a lending arm that FBN now markets at multi-billion-dollar cumulative volume. What it does not show is the one thing a valuation chapter needs most: the price and downside terms of the latest financing. Without a public valuation mark, preference stack, or current unit economics, the supportable stance is research more rather than buy.'
  claimRefs:
  - CV001
  - CV004
  - CV005
  - CV006
  - CV007
  - CV015
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-vs-counterweights
  title: Thesis vs. counterweights
  body: 'The bullish case is straightforward: FBN still looks differentiated on distribution, data, and workflow breadth. Company-controlled materials show a broad ag marketplace, grain-marketing tooling, and a finance stack that ranges from land loans to operating lines, while July 2025 sources say the company raised another $50 million to expand AI and marketplace capabilities. AgWeb''s March 2026 coverage also suggests FBN still produces proprietary market-intelligence content at meaningful scale. The counterweight is that public proof of monetization durability remains thin, and even the finance proof retained here includes pilot-scale programs rather than mature disclosed economics.'
  claimRefs:
  - CV001
  - CV003
  - CV006
  - CV007
  - CV008
  - CV010
  - CV011
  - CV014
  tableRefs:
  - TV002
- id: scenario-framing
  title: Scenario framing and comparable context
  body: 'The current financing context is good enough to justify continued tracking, but not a priced commitment. The last clearly disclosed large round in this pool is the 2021 $300 million raise, and the latest 2025 financing disclosures identify the amount and investors but not valuation or preference terms. That means the only honest public comparison set in the assigned evidence is internal: a much larger 2021 round versus a smaller 2025 refresh round aimed at product and AI expansion. In that setting, the base case should assume valuation discipline below any undisclosed insider mark until management can prove current margins, repeat purchase, and loan-book performance.'
  claimRefs:
  - CV001
  - CV009
  - CV014
  - CV015
  tableRefs:
  - TV003
- id: diligence-asks-and-kill-criteria
  title: Diligence asks and thesis-break triggers
  body: 'The final diligence path is specific. Before moving from research-more to invest, an investor needs the July 2025 term sheet, full cap table, current revenue and gross-margin mix, and vintage-level credit metrics for the finance book. The bear case is not theoretical: Reuters documented historical channel conflict serious enough for Canadian regulators to investigate whether suppliers coordinated against FBN, and Agriculture Dive still describes regenerative-lending proof as a 20-farm land-loan concept layered on top of a 140-farmer operating-loan program. Those facts do not break the thesis, but they do define the kill criteria if commercialization, channel access, or credit quality disappoint.'
  claimRefs:
  - CV010
  - CV011
  - CV012
  - CV013
  - CV015
