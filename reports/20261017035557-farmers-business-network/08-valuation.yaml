- id: TV001
  title: Recommendation summary table
  columns:
  - Criterion
  - Current public read
  - Decision implication
  rows:
  - - Recommendation
    - Research more
    - Do not underwrite a priced round from public evidence alone; wait for data-room access or a materially downside-protected structure.
  - - Confidence
    - Medium
    - Scale and fresh financing are visible, but current pricing, profitability, and credit quality are not.
  - - Risk rating
    - High
    - Historical channel friction, finance-book opacity, and incomplete profitability data keep downside wide.
  - - Valuation stance
    - Public evidence does not support paying a premium private mark
    - Use the 2021 $300 million raise as the last disclosed anchor, not as a live mark for 2025/2026 entry pricing.
  - - Best near-term action
    - Track / diligence
    - Request cap table, July 2025 term sheet, segment gross margin, loan vintages, and repeat-purchase cohorts before moving to invest.
  notes: Public-evidence judgment only; undisclosed valuation terms and private operating metrics are treated as diligence gaps, not as zeroes.
