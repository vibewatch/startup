summary:
  headline: >
    Modal 已证明 $300M ARR、七个月增长 5 倍、高质量且分散的客户组合，以及技术差异化的 serverless 平台；Sandbox 收入超过总 ARR 三分之一，足以给出 track 判断。但 15.5× ARR
    倍数偏紧，2026 年 5–6 月三次重大宕机暴露可靠性风险，毛利率和 NRR 完全不透明，当前价格下还不能给 buy。
