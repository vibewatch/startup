    - id: n7
      label: Agent Sandbox execution
      detail: Sandbox.create() spins up gVisor container at runtime; accepts arbitrary code; returns outputs; lifecycle events for monitoring.
    - id: n8
      label: Training / fine-tuning job
      detail: GPU training functions; multi-node support; direct path from checkpoint to deployed inference endpoint.
    - id: n9
