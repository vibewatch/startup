  rows:
  - - Functions
    - ML engineers and app developers running GPU/CPU workloads
    - GA / mature core product
    - Any Python function becomes an autoscaling cloud job via @app.function or @app.cls; supports GPU, concurrency, and lifecycle hooks
    - Code-only definition; ~1s container cold start; scale from 0 to 1,000+ GPUs without reservation; multi-cloud pool
    - No independently verified cold-start benchmark methodology or public SLA for standard/team tiers
  - - Sandboxes
    - Coding agent and AI app developers executing LLM-generated code
    - GA / growing rapidly
    - Isolated gVisor containers launched at runtime with full filesystem/network isolation; support stdin/stdout/stderr, TCP tunnels, volume mounts, lifecycle events
    - 50,000+ simultaneous Sandboxes (Lovable); 1 billion+ total Sandboxes launched (May 2026); sub-second spin-up
    - Sandbox-specific SLA terms and maximum count per workspace are not fully public
  - - Training
    - ML engineers fine-tuning or training models with GPU clusters
    - GA / expanding to multi-node
    - Managed GPU training jobs, multi-node with RDMA networking (per Sacra), distributable across pooled capacity
    - Same SDK for training and inference removes vendor handoff; direct checkpoint-to-serving path
    - No dedicated training docs page was accessible in this run; multi-node/RDMA maturity not yet fully public
  - - Volumes
    - Engineers storing model weights, datasets, and pipeline outputs
    - GA (v2 with HIPAA-scope expansion)
    - Distributed filesystem optimized for write-once, read-many; backed by multi-cloud for high availability; up to 2.5 GB/s bandwidth
    - Distributed by default, no replica management; integrated with Modal Functions and Sandboxes; v2 is HIPAA-compliant
    - v1 Volumes are out of HIPAA BAA scope; per-day billing snapshot means deletion takes up to 4 days to reflect
  - - Web Endpoints
    - API and application developers serving HTTP traffic from Modal Functions
    - GA / mature web serving layer
    - Exposes FastAPI, ASGI, WSGI apps or simple Python functions as public HTTPS endpoints via @modal.fastapi_endpoint or @modal.asgi_app
    - Scale-to-zero with cold start managed by platform; custom domains available on Team plan
    - No public contractual uptime for web endpoints; 90-day status shows 99.933%
  - - Notebooks
    - ML engineers and researchers in exploratory/collaborative compute
    - GA (launched 2025 with GPU memory snapshot support)
    - Browser-based collaborative notebooks backed by any GPU; GPU memory snapshots reduce startup by up to 10x
    - GPU-backed collaboration notebooks that cold-start as fast as serverless Functions; works with any ML framework
    - Memory Snapshots are out of current HIPAA BAA scope, limiting use in regulated research environments
  - - Dicts
    - Engineers sharing distributed state across modal Functions or Sandboxes
    - GA / utility primitive
    - Distributed key-value store accessible from anywhere; cloudpickle serialization; distributed locks
    - Accessible from any container or SDK call; seamlessly composable with other Modal primitives
    - 100 MiB/object cap and 7-day inactivity TTL; not guaranteed persistent (recommended for small objects)
  - - Queues
    - Engineers building async pipelines, fan-out workflows, and producer/consumer patterns
    - GA / utility primitive
    - Multi-producer, multi-consumer FIFO queues partitioned by string key; synchronous/async access; 24-hour TTL
    - Cloud-native replacement for Redis/Celery queues with no infrastructure management; pairs with Functions for async fan-out
    - 24-hour TTL means queues are not suitable for durable message persistence; 5,000 items per partition
  - - Scheduled Functions
    - Engineers running time-based jobs or pipelines
    - GA / simple scheduling
    - Period (interval) and Cron syntax schedules attached to deployed Modal Functions; monitored via dashboard
    - No external Airflow, Prefect, or cron infrastructure needed; schedule lives next to the function definition
    - Schedules cannot be paused; must be removed and redeployed; Period resets on redeploy
  notes: Status reflects Modal public documentation and blog posts as of 2026-06-14. "GA" labels are inferred from active public documentation and customer case studies; Modal does not consistently use GA/alpha labels except for GPU Memory Snapshots (labeled alpha) and Snapshot restores.
