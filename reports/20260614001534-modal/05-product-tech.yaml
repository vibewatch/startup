chapter:
  number: 5
  title: Product & Technology
  summary: 'Modal is a Python-first serverless cloud for AI workloads built around five years of proprietary infrastructure investment. The product surface spans Functions (GPU/CPU), Sandboxes (agent code execution), Training, Volumes, Web Endpoints, Notebooks, Dicts, and Queues—all defined as code via Python decorators, with no YAML required. The architectural moat is a four-pillar cold-start system: cloud buffers of idle GPUs, a content-addressed multi-tier container filesystem, CPU checkpoint/restore, and CUDA GPU checkpoint/restore, which together reduce GPU replica scale-up from kiloseconds to tens of seconds and have demonstrated up to 10x cold-boot speedups in published workloads. The trust posture is strong for a late-private company—SOC 2 Type II, HIPAA-ready Enterprise BAA, gVisor container isolation, TLS 1.3, and a private HackerOne bug-bounty program—but diligence must weigh a cluster of three major outages in May–June 2026 against 99.9%-class uptime statistics, and enterprise SLA terms remain private.'
sections:
- id: product-surface
  title: Product Surface in Customer Workflow Terms
  body: 'Modal presents itself as a "production cloud for AI" built around a single mental model: any Python function can become an autoscaling, GPU-backed cloud job by adding a decorator. In customer workflow terms, the product covers four distinct use patterns. First, interactive and exploratory compute: Notebooks let ML engineers spin up a GPU-backed browser notebook in seconds, and the `modal shell` command attaches a debug shell directly to a running container. Second, batch and scheduled workloads: Functions with `map()`, `starmap()`, and `for_each()` fan out across thousands of containers in parallel, and `modal.Cron`/`modal.Period` handle time-based triggers without external schedulers. Third, serving and real-time inference: Web Endpoints expose any function as a public HTTPS endpoint via `@modal.fastapi_endpoint`, ASGI, or WSGI apps; input concurrency via `@modal.concurrent` enables continuous batching for LLM serving. Fourth, agent and untrusted-code execution: Sandboxes are ephemeral isolated containers that accept arbitrary code (from an LLM or user), execute it under gVisor isolation, and return stdout/stderr—Lovable used this to support tens of thousands of simultaneous app-creation sessions, and Cognition ran millions of Sandboxes for coding agents. Storage is first-class: Volumes (high-performance distributed filesystem), Dicts (distributed key-value), and Queues (FIFO, multi-producer/consumer) complete the primitive set. The unified SDK means a team can move from a single-function prototype to a production serving cluster and an agent sandbox—all in the same codebase—without changing infrastructure vendors.'
