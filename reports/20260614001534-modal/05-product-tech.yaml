- id: architecture
  title: Architecture and Operating Model
  body: 'Modal''s architecture is layered around a Python SDK that abstracts multi-cloud GPU provisioning, container management, and distributed storage into a single programming interface. Compute containers are defined through the `modal.Image` Python API (method chaining: `Image.debian_slim().pip_install(...)`) with no YAML or Dockerfile required; the image builder then validates and distributes the image to worker nodes. Containers run inside gVisor, Google''s kernel sandbox used in Cloud Run and GKE, providing workload isolation that is stronger than standard container namespacing. The container runtime is written in Rust for performance and memory safety. Capacity is pooled across AWS, GCP, and Oracle Cloud Infrastructure globally—hundreds of data centers—allowing Modal to route each GPU request to the cheapest available hardware without the user reserving capacity. GPU selection is expressed as `@app.function(gpu="H100")` and Modal may automatically upgrade requests (H100→H200, A100-40GB→A100-80GB) at no extra charge to maximize pool utilization. Multi-GPU containers support up to 8 cards per container (B200, H200, H100, A100, L4, T4, L40S). Input concurrency via `@modal.concurrent` enables containers to process multiple requests simultaneously, which is essential for continuous batching in vLLM or SGLang LLM serving. The container lifecycle model (enter/exit hooks via `@modal.enter` and `@modal.exit`) separates one-time initialization from per-request execution, enabling efficient model weight loading patterns. Region selection (up to narrow/wide granularity) and independent routing regions (us-east, us-west, eu-west, ap-south) allow latency-sensitive workloads to pin near databases or robots. Secrets are injected as environment variables via `modal.Secret` without ever reaching the image build layer.'
