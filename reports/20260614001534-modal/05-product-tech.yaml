  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-methodology
    missingEvidence: Independent third-party benchmarks for Modal cold-start, throughput, and latency claims across representative GPU workloads.
    whyItMatters: Modal markets sub-second cold starts and 10x GPU snapshot speedup as core differentiators; investors need reproducible methods, not isolated company-published or customer-reported numbers.
    diligencePath: Request benchmark harness definitions, GPU type and workload configurations, and customer-approved before/after test outputs; ask for comparison with RunPod, Replicate, and AWS Lambda SnapStart on identical workloads.
    relatedQuestionRefs:
    - QE008
    - QE017
    - QE025
  - type: private-evidence-only
    severity: material
    topic: enterprise-sla
    missingEvidence: Public contractual SLA terms for any Modal plan below Enterprise; enterprise SLA exhibit and uptime commitment.
    whyItMatters: Three major outages in May–June 2026 make reliability commitments relevant; the only available data is status-page statistics, not enforceable SLA terms.
    diligencePath: Request the standard Enterprise SLA exhibit, uptime commitment percentage, credit mechanism, and any exclusions (scheduled maintenance, cloud-provider outages).
    relatedQuestionRefs:
    - QE015
    - QE022
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: moderate
    topic: hipaa-baa-memory-snapshots
    missingEvidence: Roadmap or timeline for bringing Memory Snapshots into HIPAA BAA scope.
    whyItMatters: Healthcare AI customers who want HIPAA compliance but also need fast cold starts are currently blocked from using Memory Snapshots (the key performance feature) in a BAA-governed deployment.
    diligencePath: Ask Modal whether and when Memory Snapshots will be added to BAA scope; ask for examples of healthcare customers operating under the existing BAA constraints.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: training-docs
    missingEvidence: Public documentation for multi-node RDMA training, distributed training API, and Training product roadmap beyond the currently disclosed features.
    whyItMatters: Training-to-inference is a stated Series C roadmap priority, but the technical documentation for multi-node training was not accessible in this research run.
    diligencePath: Obtain product roadmap and technical docs for Training, including multi-node RDMA configuration, supported frameworks, and customer reference deployments.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
