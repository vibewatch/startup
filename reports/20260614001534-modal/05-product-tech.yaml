- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Key technical detail
  - Dependency
  - Risk
  rows:
  - - Python SDK / decorator layer
    - Developer interface; translates decorated Python functions into Modal App objects
    - '@app.function, @app.cls, @modal.enter, @modal.exit, @modal.fastapi_endpoint, @modal.concurrent; no YAML required'
    - Python 3.10-3.14; open-source client (modal-labs/modal-client)
    - Any breaking change to SDK requires downstream developer code changes; v1.5.0 in June 2026
  - - Container image builder
    - Converts Python Image definitions into container images distributed to workers
    - Method chaining from Image.debian_slim(); pip/uv install; Dockerfile fallback; add_local_dir for local code
    - Modal-controlled build infrastructure; underlying cloud provider storage
    - Image build 90-day uptime 99.863%; image build failures block deployments
  - - gVisor container runtime
    - Provides OS-level isolation for Functions and Sandboxes; kernel sandbox used in GKE and Cloud Run
    - Each container runs under gVisor; automatic synthetic monitoring checks network/application isolation
    - Google-maintained gVisor project; NVIDIA CUDA driver compatibility may limit future GPU features
    - gVisor compatibility with new CUDA features requires driver certification testing
  - - Rust worker runtime
    - Executes container lifecycle, handles network I/O, and coordinates with storage layer
    - Memory-safe implementation for security; handles TLS, gRPC, and container IPC
    - Internal Modal proprietary component
    - Core proprietary component; limited external auditability of implementation
  - - Custom content-addressed container filesystem
    - Serves image layers from a multi-tier cache (worker memory → cluster → storage); reduces cold start
    - Files are content-addressed; popular files (torch, etc.) cached in worker memory; 3-5x faster than uncached
    - Multi-cloud object storage (AWS S3, GCP GCS, Oracle)
    - Cache effectiveness depends on file popularity distribution; new image builds may cold-start slower initially
  - - CPU Memory Snapshots
    - Captures container memory state before first request; restores on cold start, skipping re-initialization
    - Captures Python imports, JIT compilation results; 3-10x faster cold starts; integrated with @modal.enter(snap=True)
    - Cloudpickle-compatible serialization; Modal distributed filesystem for snapshot storage
    - Out of HIPAA BAA scope; incompatible with stateful I/O during snapshot phase
  - - GPU Memory Snapshots (alpha)
    - Extends CPU snapshots to capture GPU device memory, CUDA kernels, streams, and memory mappings
    - Uses NVIDIA CUDA checkpoint/restore API (driver 570/575 branches); cuCheckpointProcessCheckpoint(); up to 10x cold-start reduction
    - NVIDIA driver compatibility requirement; currently alpha status
    - Incompatible with multi-GPU and non-CUDA code; torch.compile interactions require workarounds
  - - Multi-cloud capacity pool
    - Routes each GPU request to available hardware across AWS, GCP, and Oracle; no user-level reservation needed
    - Cloud buffers of idle GPUs maintained for each GPU type; automatic upgrade paths (H100→H200, A100→A100-80GB)
    - AWS, GCP, Oracle Cloud Infrastructure; Oracle partnership cited by Sacra
    - 'Cloud provider outages directly affect capacity (May 7 SEV1: AWS AZ overheating); single-AZ failures visible in incident history'
  - - Secrets management
    - Injects credentials as environment variables into containers without baking them into images
    - Dashboard, CLI, and Python API to create/update/delete; multiple Secrets per Function; key-value limit 32KB
    - Modal-controlled secret storage; Dependabot-audited dependencies
    - No HSM or dedicated secret-store integration noted in public docs
  notes: Architecture details sourced from official Modal docs and engineering blog posts as of 2026-06-14. Rust runtime and content-addressed filesystem architecture confirmed by Sacra analyst research and Modal's own technical blog.
