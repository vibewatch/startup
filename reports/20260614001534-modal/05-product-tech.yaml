- id: FE002
  title: Customer Workflow / Operating Flow
  type: flow
  layout: wide
  summary: How a developer or team moves from a local Python function or model to a production workload on Modal, with branches for inference, agent execution, and batch processing.
  data:
    nodes:
    - id: n1
