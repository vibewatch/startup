  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: 'Gross margin percentage broken down by GPU compute, Sandbox, and storage revenue lines;
      COGS detail showing GPU procurement costs versus customer billing rates.'
    whyItMatters: 'At a 15.5x ARR multiple, gross margin is the single most influential unknown; the range
      of plausible outcomes (20–65%) spans multiple compression from CoreWeave-like 4.5x to Datadog-like 20x+.'
    diligencePath: 'Request audited or management-prepared income statement in data room; cross-reference
      hyperscaler GPU list pricing versus Modal published rates to triangulate spread.'
    relatedQuestionRefs:
    - QV021
    - QV038

  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: 'Net revenue retention (NRR), customer cohort data, top-10 customer concentration
      as percentage of ARR, and monthly revenue trend within the $300M ARR figure.'
    whyItMatters: 'Without NRR, it is impossible to determine whether $300M ARR is durable expansion-driven
      growth or volatile project-based spend concentrated in a few large accounts.'
    diligencePath: 'Request internal customer analytics dashboard; ask for cohort analysis showing 12-month
      retention rates at developer, team, and enterprise tiers.'
    relatedQuestionRefs:
    - QV022

  - type: conflicting-data
    severity: material
    topic: series-b-conflict
    missingEvidence: 'Resolution of the discrepancy between Sacra''s $87M Series B led by Lux Capital
      (September 2025) versus the company''s $110M with Redpoint and Sutter Hill Ventures as leads
      (October 2025).'
    whyItMatters: 'Unexplained funding-history conflicts are a due diligence red flag; they may reflect
      cap table complexity, staged closings, or data errors—but each scenario warrants investigation.'
    diligencePath: 'Request capitalization table and Series B term sheet in data room; ask company directly
      for explanation of discrepancy.'
    relatedQuestionRefs:
    - QV023

  - type: incomplete-coverage
    severity: material
    topic: TV004-comparable-universe
    missingEvidence: 'The comparable valuation table TV004 covers five companies (Baseten, Fireworks AI,
      Together AI, CoreWeave, Groq) but excludes other relevant infrastructure and inference platforms
      such as Replicate, fal.ai, Lambda Labs, and Vast.ai that are also referenced in the Hostfleet
      pricing matrix. Coverage is partial due to absence of public ARR and valuation data for these
      smaller comparable firms.'
    whyItMatters: 'A fuller comparable set might compress or expand the multiple range; the current five
      comps suggest 3.3x–18.75x, which is already a very wide range. Additional comps could tighten the
      central tendency estimate.'
    diligencePath: 'Monitor Sacra, PitchBook, and Tracxn for new funding disclosures from Replicate,
      fal.ai, and Lambda Labs; request PitchBook comp set analysis in a formal diligence process.'
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV030

