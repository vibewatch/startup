- id: comparables-and-scenarios
  title: Comp work places $4.65B inside the base case but with no room for error
  body: 'The most useful private comparables for Modal are Fireworks AI and Together AI, both pure-play inference
    platforms with Sacra revenue estimates available. Fireworks AI reported approximately $800 million in ARR as
    of its October 2025 Series C at a $4 billion post-money valuation, implying roughly 5x ARR—a significant
    discount to Modal''s 15.5x. Fireworks is reportedly in discussions to raise at a $15 billion mark, which if
    closed at $800 million ARR would imply roughly 18.75x, above Modal. Together AI carried a $3.3 billion mark
    from its February 2025 Series B against approximately $1 billion in annualized revenue in 2026, implying
    3.3x; it is reportedly in discussions at $7.5 billion, which would imply 7.5x on $1 billion ARR. CoreWeave
    is the wrong architectural analogue—it owns GPU hardware at massive capital intensity—but its FY2025 revenue
    of $5.13 billion against a $23 billion pre-IPO mark implies approximately 4.5x trailing revenue, far below
    Modal''s software-like multiple. The CoreWeave 10-K filed in March 2026 provides the only primary-source
    financial disclosure across this comparable set.

    Three scenario bands summarize the range of outcomes. In the bull case, Sandbox and inference momentum
    continues, Modal reaches $600 million to $1 billion ARR by mid-2027, gross margins prove to be at or above
    40%, and investors price a next round at 15–18x ARR, implying a $9 billion to $18 billion valuation. In the
    base case, revenue grows at 100–150% to reach $450 million to $600 million by mid-2027, multiple gently
    compresses to 12–15x as the company matures, implying a $5.4 billion to $9 billion range that places the
    current $4.65 billion inside the distribution. In the bear case, outage recurrence damages customer trust,
    growth decelerates below 80%, hyperscalers bundle competing products, and the multiple compresses to 7–10x
    on $250–350 million ARR, implying a $1.75 billion to $3.5 billion valuation—representing a material
    mark-to-market loss from the Series C price.

    The range between base and bear is wide enough that the current mark cannot be called attractive. The case
    is one where a buyer is betting on execution continuing. The comparable set confirms that AI infrastructure
    companies can trade at wide multiple ranges—from CoreWeave''s 4.5x to Fireworks'' proposed 18.75x—so the
    precision of any single multiple is low. The most defensible anchor for Modal is "premium developer cloud
    with proven Sandbox traction," which is worth closer to the 12–16x range than to the 4–8x raw-compute range.'
