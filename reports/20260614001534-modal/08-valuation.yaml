- id: diligence-gates
  title: Four diligence gates separate track from buy; the thesis can move on evidence alone
  body: 'The investment call can be upgraded from track to buy without any additional operating improvement—only
    evidence disclosure is required. Four diligence items dominate. First, gross margin: at a 15.5x ARR multiple,
    investors are implicitly paying for software-like economics. If Modal''s actual gross margin on GPU compute
    is 20–30% (comparable to raw cloud aggregators), the multiple is very demanding. If gross margin is 40–55%
    (comparable to Cloudflare or Datadog''s cloud delivery economics), the multiple is more supportable. The
    spread is wide enough to flip the conclusion: this single data point most directly gates the buy decision.
    RunPod, the lowest-cost serverless GPU provider in the Hostfleet matrix, reports gross margins in the
    mid-60s to high-70s percent range according to Sacra, suggesting that asset-light GPU intermediaries can
    achieve software-like economics—but that is a company running at far lower revenue scale with a different
    mix.

    Second, revenue quality. The company has disclosed $300 million ARR and 5x growth, but no cohort data,
    NRR, or churn has been published. A 300% annualized growth rate could reflect a small number of very large
    deals (concentration risk) or broad developer-led expansion (NRR risk if developers churn after initial use).
    Without NRR, the durability of $300 million ARR remains open. Third, cap table and liquidation preferences.
    The $4.65 billion post-money valuation is the headline, but the actual investor economics depend on the
    preference stack accumulated across seed, Series A, Series B, and Series C—four rounds totaling approximately
    $465 million in primary capital. Investors at $4.65 billion need to model the waterfall before calling the
    entry attractive. Fourth, the Series B discrepancy: Sacra reports an $87 million Series B led by Lux Capital
    in September 2025 at a $1.1 billion valuation, while Modal''s own blog post describes $110 million and lists
    Redpoint and Sutter Hill Ventures as leads. This conflict is not explained in any publicly available source
    and represents a transparency gap that must be resolved in a proper data room.

    Four thesis-break triggers should gate any follow-on from the current mark: another major outage within six
    months; gross margin evidence below 20%; revenue growth decelerating below 80% year-over-year by Q4 2026;
    or departure of Erik Bernhardsson as CEO. The company is worth tracking closely because the growth rate is
    genuine, the customer roster is high-quality, and the product has real technical differentiation. But any
    upgrade from track requires evidence, not extrapolation.'
