  rows:
  - - '$300M ARR demonstrates platform scale'
    - 'Company-disclosed in Series C blog (May 2026); Sacra independently estimates $300M ARR in April 2026'
    - 'Single independent estimate only; no audited financials; growth rate could be front-loaded by a few large accounts'
  - - '5x growth in 7 months validates acceleration'
    - 'Company stated fivefold growth since October 2025 Series B; Sacra estimates ~$119M ARR at YE2025'
    - 'Implied ~3x YoY annualizes to a rate that is difficult to sustain; Series B baseline may be lower than $119M if Sacra data is stale'
  - - 'Asset-light model avoids capital intensity risk'
    - 'GPU capacity aggregated from AWS, GCP, Oracle; no owned hardware or GPU debt'
    - 'Gross margin ceiling set by hyperscaler procurement rates; hyperscalers can bundle to undercut spread'
  - - 'Sandbox traction extends platform beyond compute'
    - 'Sandboxes disclosed as >1/3 of total revenue; 1+ billion Sandboxes launched across customers'
    - 'Sandbox margin and churn not disclosed; execution environment is replicable by hyperscalers and open-source alternatives'
  - - 'Tier-1 investor syndicate confirms underwriting quality'
