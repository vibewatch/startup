- id: diligence-gaps
  title: Sizing Gaps, Contradictions, and Diligence Asks
  body: 'Five evidence gaps should be preserved before accepting any specific market size for Modal''s
    addressable opportunity. First, no analyst has published a dedicated "serverless GPU cloud" or "Python-native
    AI compute platform" market category; all sizing estimates cover broader or differently-defined categories,
    so the serviceable market figures in this chapter are constructs of the author, not published research.
    Second, analyst estimates diverge significantly in scope and magnitude—from $85.25B (Technavio, narrow
    inference service layer) to $394.46B (MarketsandMarkets, full AI infrastructure including hardware)
    to $601.93B (MarketsandMarkets, broadest AI market)— reflecting definitional inconsistency rather
    than forecasting disagreement; a diligence ask is to pressure-test which definition best tracks Modal''s
    actual invoice line items. Third, the GPU fractionalization trend (sub-$2/hr GPU slices cited by Mordor
    Intelligence in February 2026) is a double-edged signal: it expands the addressable buyer base (lower
    entry cost) but simultaneously compresses the price floor and could commoditize inference compute
    for batch-tolerant workloads. Fourth, Modal''s international go-to-market traction is not publicly
    disclosed; Asia-Pacific is projected to grow at the highest CAGR (22.74% per Mordor Intelligence),
    representing an unconfirmed expansion opportunity. Fifth, Modal''s compliance certification posture
    (SOC2, HIPAA, FedRAMP) was not independently confirmed in the fetched public corpus, creating a gap
    for enterprise and regulated buyers. Investors should request direct evidence of revenue concentration
    by vertical, geographic mix, and compliance certifications to close these gaps.'
