- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Driver or constraint
  - Direction
  - Timing
  - Implication for Modal
  - Diligence ask
  rows:
  - - AI model complexity growth (larger parameters → higher inference cost)
    - Driver
    - Ongoing; accelerating 2025–2027
    - Larger models increase platform value; buyers cannot self-manage at scale
    - Track NVIDIA training and inference revenue split to confirm inference share growth
  - - Agentic AI workload growth (Sandboxes, multi-step LLM loops)
    - Driver
    - Emerging 2024–2026; high growth
    - Sandboxes are Modal's differentiated product; no direct analog at hyperscalers
    - Confirm Sandbox revenue as % of total to assess segment weight
  - - GPU supply shortage (H100/MI300X 12+ month lead times)
    - Driver
    - Current; expected to ease partially by late 2026
    - Pushes buyers away from reserved capacity toward pooled managed clouds
    - Monitor NVIDIA/AMD availability and lead time trends quarterly
  - - Mix shift from training to inference spend
    - Driver
    - Ongoing; accelerating as model deployment widens
    - Inference workloads (steady-state serving) align with Modal's billing model
    - 'Request cohort analysis: are inference workloads growing as % of Modal GPU hours?'
  - - North America dominant geography (41.1% of incremental growth)
    - Driver
    - Current; aligns with Modal's NYC HQ and customer base
    - Geographic fit reduces sales overhead in current growth phase
    - Confirm international revenue split and expansion plan
  - - Hyperscaler incumbency (AWS Bedrock, Vertex AI, Azure ML bundled)
    - Constraint
    - Persistent; strongest for large enterprise buyers
    - Limits TAM for customers with existing EDP/CUD cloud commitments
    - Quantify EDP displacement rate from disclosed customer wins
  - - GPU supply ceiling on scaling promises
    - Constraint
    - Current through mid-2026; easing
    - Large burst events could fail if Modal's allocation is insufficient
    - Request SLA terms and capacity guarantee documentation for Enterprise tier
  - - Compliance / regulatory friction (HIPAA, GDPR, SOC2, FedRAMP)
    - Constraint
    - Ongoing; intensifying for healthcare, finance, government
    - Blocks regulated-vertical expansion without certification evidence
    - Confirm published SOC2 Type II and HIPAA BAA availability
  notes: Growth drivers sourced from Technavio (2026), Mordor Intelligence (Feb 2026), and MarketsandMarkets
    (Nov 2024). Constraint rows draw on inferences from analyst reports, pricing comparisons, and Modal
    technical documentation.
