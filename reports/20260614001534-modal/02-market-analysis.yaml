      detail: Production Functions, Sandboxes, Web Endpoints, Training jobs, and Volumes run on Modal.
        Auto-scaling from 0 to 1,000+ GPUs; billing is per second. B200/H200/H100/A100/L40S/L4 GPU tiers.
      tone: positive
    - id: v6
      label: Elastic GPU pool (B200 → T4 tiers)
      detail: Modal allocates from its pooled multi-cloud GPU inventory. Supply constraints (H100/H200/B200
        allocation) are the primary ceiling risk at this layer.
      tone: warning
