callouts:
- calloutType: insight
  title: Sub-1% Penetration Despite $300M ARR
  body: Modal's >$300M ARR in 2026 represents approximately 0.35% of the USD 85.25B AI inference-as-a-service
    market (Technavio 2025). Even applying a conservative 22.1% market CAGR and holding Modal's current
    growth rate constant, the remaining underpenetrated market is orders of magnitude larger than Modal's
    current footprint, suggesting the relevant risk is execution and competition, not market saturation.
  claimRefs:
  - CM006
  - CM013
  - CM041
- calloutType: risk
  title: Hyperscaler TAM Ceiling Is Real but Not Deterministic
  body: AWS Bedrock, Google Vertex AI, and Azure ML each bundle AI inference services into existing enterprise
    cloud agreements at discounted rates. Enterprises with multi-year EDP or CUD commitments face meaningful
    switching friction to route AI workloads to Modal. This structural constraint does not foreclose Modal's
    opportunity but does cap the largest-enterprise segment of the TAM and reinforces the importance of
    Modal's AI-native startup and developer-led growth motion, where hyperscaler lock-in is less entrenched.
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM036
- calloutType: strength
  title: Serverless Economics Align With AI Traffic Patterns
  body: 'The core economic logic of Modal''s value proposition is that AI application traffic is inherently
    variable—holiday peaks for consumer apps (Suno), sparse usage for scientific computing, bursty demand
    for coding agents—making reserved GPU capacity structurally over-priced. The Suno case study illustrates
    this: peak GPU demand at holidays "kills" teams that commit to steady-state reserved hardware. Modal''s
    billing model (pay per second of actual use, scale from 0 to 1,000+ GPUs in seconds) directly addresses
    this mismatch and justifies a premium over bare-metal spot GPU pricing for traffic-variable workloads.'
  claimRefs:
  - CM025
  - CM026
  - CM034
