summary:
  headline: >
    Modal has earned a track call by demonstrating $300M ARR with 5x growth in seven months, a diversified high-quality
    customer roster, and a technically differentiated serverless platform with Sandbox revenue exceeding one-third of
    total ARR — but the 15.5x ARR multiple is stretched, three major outages in May–June 2026 signal reliability risk,
    and complete opacity on gross margin and NRR prevents a buy call at the current price.
  overallScore: 7
  recommendation: track
