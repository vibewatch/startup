- id: FI002
  title: Unit economics bridge
  type: flow
  layout: wide
  summary: Modal's unit economics path runs from multi-cloud GPU procurement through in-house efficiency technology to customer
    billing, but breaks before gross margin because COGS and realized discounts are private.
  data:
    nodes:
    - id: cloud-procurement
      label: Cloud GPU procurement
      detail: GPU capacity from AWS, GCP, Oracle Cloud under undisclosed commercial terms.
      tone: warning
    - id: efficiency-tech
      label: In-house efficiency technology
      detail: GPU snapshotting (40–100x cold-start reduction), custom Rust runtime, content-addressed FS.
      tone: positive
    - id: utilization
      label: Utilization improvement
      detail: Higher aggregate GPU utilization vs. competitors due to faster cold starts and global pooling.
      tone: positive
    - id: list-pricing
      label: List pricing (compute + storage + plans)
      detail: CPU $0.00003942/core/sec; GPU ~$3.95/hr illustrative; Team $250/mo.
      tone: neutral
    - id: enterprise-yield
      label: Realized enterprise yield
      detail: Volume discounts, minimum commits, and support attachment affect net revenue; all private.
      tone: warning
    - id: cogs-unknown
      label: COGS (private)
      detail: Cloud pass-through + R&D amortization + support labor; no public disclosure.
      tone: negative
    - id: gross-margin
      label: Gross margin (estimated 30–50%)
      detail: Analyst-range estimate for asset-light GPU aggregators; not confirmed for Modal.
      tone: warning
    edges:
    - from: cloud-procurement
      to: efficiency-tech
    - from: efficiency-tech
      to: utilization
    - from: utilization
      to: list-pricing
    - from: list-pricing
      to: enterprise-yield
    - from: enterprise-yield
      to: gross-margin
    - from: cogs-unknown
      to: gross-margin
