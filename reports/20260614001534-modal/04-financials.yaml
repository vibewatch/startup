- id: TI003
  title: Unit economics table
  columns:
  - metric
  - value / public proxy
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Published billing unit
    - Per-second compute (CPU, GPU, memory); per-GB-day storage; monthly plan fee
    - High
    - Shows modal monetizes usage at very granular intervals, maximizing revenue capture for bursty workloads.
    - Provide billing-unit yield by product line and average invoice size by plan tier.
  - - Revenue growth rate (public claim)
    - 5x since October 2025 Series B; from ~$119M ARR (Dec 2025) to $300M ARR (April 2026)
    - Medium — company claim plus Sacra corroboration; not audited
    - Implies ~150% growth in five months; if sustained, the business is compounding faster than CAC could plausibly constrain.
    - Provide monthly ARR cohort data and new-versus-expansion breakdown for the last 12 months.
  - - Sandbox revenue share
    - '>1/3 of total revenue per Series C blog disclosure (May 2026)'
    - Medium — company-disclosed; not independently verified
    - Second-largest product line after less than three years; suggests platform breadth reduces single-product concentration
      risk.
    - Provide Sandbox revenue trend quarterly for the last four periods.
  - - GPU cost vs. list price (proxy)
    - 'RunPod H100 SXM: $3.29/hr; Modal pricing-page example: ~$3.95/GPU-hr serverless'
    - Medium — comparison of public list prices; not realized Modal COGS
    - Modest ~20% list premium over a low-cost GPU cloud; implies some gross-margin headroom if procurement discounts exist.
    - Provide actual GPU procurement rate by provider and GPU type, and gross margin by GPU family.
  - - Gross margin
    - Not publicly disclosed; comparable asset-light GPU aggregators estimated 30–50% (analyst range, unverified for Modal)
    - Low — estimate only
    - Gross margin determines whether $300M ARR translates to meaningful contribution toward profitability.
    - Provide audited or management-reported gross margin by product line.
  - - CAC / payback period
    - Not disclosed; PLG model implies low CAC, but no public conversion or payback data
    - Low
    - CAC efficiency of developer-led model determines whether growth is capital-efficient.
    - Provide CAC by acquisition channel, time-to-revenue per cohort, and payback period by plan tier.
  - - NRR / churn
    - Not disclosed; rapid ARR growth implies strong net retention, but cohort breakdown is unavailable
    - Low
    - NRR above 100% would confirm expansion-revenue thesis; churn below 5% would validate reliability perception.
    - Provide logo and dollar churn, NRR by cohort vintage, and customer concentration (top-10 as % of ARR).
  - - Headcount efficiency
    - ~$300M ARR / ~120–180 employees = ~$1.67M–$2.5M ARR per employee
    - Medium — both figures are estimates or company-claimed
    - ARR/employee ratio is among the highest in private infrastructure; suggests lean operating model consistent with PLG.
    - Provide confirmed headcount and R&D/G&A/S&M breakdown.
  notes: No public source discloses gross margin, CAC, NRR, or churn for Modal; all estimates are proxies from list-price
    comparisons, ARR disclosures, and analyst estimates.
