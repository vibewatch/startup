figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: Modal converts developer compute consumption across Functions, Sandboxes, Volumes, and Notebooks into per-second
    metered revenue, then upgrades a subset into higher-value Team and Enterprise contracts.
  data:
    nodes:
    - id: developer-demand
      label: Developer workloads
      detail: ML inference, agent execution, training jobs, batch, and notebook sessions.
      tone: neutral
    - id: functions
      label: Functions (CPU + GPU)
      detail: Core compute surface; per-second billing for containerized workloads.
      tone: positive
    - id: sandboxes
      label: Sandboxes
      detail: Isolated containers for agent and untrusted code; disclosed as >1/3 of revenue.
      tone: positive
    - id: storage
      label: Volumes and Buckets
      detail: Distributed file storage; per-GB-day billing.
      tone: positive
    - id: notebooks
      label: Notebooks
      detail: Hosted Jupyter with GPU access and idle-shutdown pricing.
      tone: positive
    - id: metering
      label: Per-second metering
      detail: Usage aggregated across compute, storage, and sandbox surfaces; attributed by App/tag.
      tone: neutral
    - id: plan-fee
      label: Plan subscription fee
      detail: Starter ($0/mo), Team ($250/mo), Enterprise (custom) layer on top of compute.
      tone: neutral
    - id: enterprise-upgrade
      label: Enterprise upsell
      detail: Compliance, embedded engineering, higher concurrency, private support, volume discounts.
      tone: positive
    - id: revenue-pool
      label: Revenue pool
      detail: '>$300M ARR; product-level mix private except Sandbox >1/3 disclosure.'
      tone: neutral
    edges:
    - from: developer-demand
      to: functions
    - from: developer-demand
      to: sandboxes
    - from: developer-demand
      to: storage
    - from: developer-demand
      to: notebooks
