- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Gross margin by product line (Compute, Sandboxes, Storage, Notebooks)
    - Cannot determine whether $300M ARR represents 30% or 60% gross profit; difference is billions of dollars of intrinsic
      value.
    - Request audited product-level P&L with COGS breakdown by cloud provider and GPU family for the last four quarters.
  - - Cloud-provider procurement terms, committed spend, and reserved-capacity obligations
    - GPU pass-through cost is the dominant COGS item; undisclosed procurement discount determines gross-margin floor.
    - Review all cloud provider agreements (AWS, GCP, Oracle) including committed-use contracts, reserved-instance holdings,
      and spot-instance mix.
  - - Monthly burn rate and cash balance
    - Capital adequacy is asserted, not demonstrated; runway could range from 24 months to 60+ months depending on burn.
    - Provide current unrestricted cash, trailing 6-month net burn (including infrastructure payments), and 12-month scenario
      runway model.
  - - Customer concentration (top-10 as % of ARR) and NRR
    - Revenue quality depends on whether growth is broad-based or concentrated in 2–3 hyperscalers/agents companies; NRR determines
      whether the expansion loop is real.
    - Provide top-20 customer revenue table, dollar NRR by cohort vintage, and logo churn for the last four quarters.
  - - CAC and payback by acquisition channel
    - PLG model should yield low CAC, but without data, growth efficiency cannot be confirmed; startup program economics unknown.
    - Provide CAC by channel (PLG self-serve, startup program, outbound, marketplace), time-to-revenue, and payback by plan
      tier.
  - - Series B amount and date discrepancy resolution
    - Sacra reports $87M in September 2025; company context reports $110M in October 2025; different lead investors named;
      unresolved.
    - Provide closing documents for the Series B confirming exact round size, date, lead investor, and cap table impact.
  - - Revenue recognition policy and deferred revenue
    - Consumption-based revenue is generally simple to recognize, but startup credits, enterprise minimums, and pre-paid compute
      could create deferred-revenue or contra-revenue items.
    - Provide revenue recognition policy, deferred revenue balance, and credit liability schedule.
  notes: Every row is a material diligence blocker. Public evidence establishes strong directional narrative but is insufficient
    to underwrite revenue quality, margins, or capital sufficiency.
