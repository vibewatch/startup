  rows:
  - - Total capital raised
    - ~$465M approximate (seed ~$7M, Series A ~$16M, Series B ~$110M per company context, Series C $355M)
    - Substantial capital base for a 2021-founded company; provides buffer for continued GPU procurement and team growth.
    - Confirm exact amounts for seed and Series A; resolve Sacra/$110M Series B discrepancy.
  - - Most recent financing (Series C)
    - $355M at $4.65B post-money valuation, May 2026; co-led by General Catalyst and Redpoint
    - Fresh large round from top-tier investors provides significant runway runway, assuming typical burn rates for a 120–180-person
      infrastructure company.
    - Provide post-close cash balance and board-approved use-of-funds plan.
  - - Annualized revenue
    - '>$300M ARR as of May 2026 (company-disclosed)'
    - If revenue is growing at the disclosed pace, the business may be approaching self-sustainability on a gross-profit basis
      even if not fully profitable.
    - Provide monthly ARR and gross margin to determine contribution margin trajectory.
  - - Headcount and OpEx proxy
    - 120+ per Series C blog; ~180 on LinkedIn people section
    - A team of 150 (midpoint) in NY/SF at market rates implies $25–40M+ annual cash compensation before benefits and infrastructure;
      total burn likely $50–100M+ per year (estimated range only).
    - Provide actual headcount by function, total cash compensation, and monthly operating cash burn.
  - - Cash balance / monthly burn / runway
    - Not publicly disclosed
    - Cannot underwrite capital sufficiency without this data; $355M round suggests adequate runway but does not confirm it.
    - Provide current unrestricted cash balance, trailing 6-month average burn, and runway under base and downside cases.
  - - Planned use of funds
    - Low-latency inference at scale; RL / training loop; Sandbox expansion; team growth across NY, SF, Stockholm
    - Investment targets are product and team—not capital expenditure for hardware—consistent with asset-light model.
    - Provide 18-month capex/opex budget by function and product.
  - - Debt / project-finance / cloud commitment obligations
    - None publicly disclosed; GPU capacity is procured from hyperscalers under undisclosed commercial terms
    - Absence of public disclosure does not confirm absence of obligations; cloud committed-use discounts typically require
      minimum spend commitments.
    - Provide all debt facilities, cloud-provider minimum-spend commitments, reserved-capacity obligations, and material vendor
      terms.
  notes: Funding history is referred to from the Company Overview chapter; this table mints local Financials claims only for
    capital-adequacy inputs. Cash, burn, runway, and obligation facts remain private.
