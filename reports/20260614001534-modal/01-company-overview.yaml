callouts:
- calloutType: strength
  title: Modal crossed $300M ARR in five years with a distinctive infrastructure moat
  body: The Series C disclosure of $300M+ ARR and 5x growth since October 2025 is a rare public signal for a Series C company. The supporting technical depth—GPU snapshotting delivering 40x cold-start improvement, multi-cloud capacity pooling, and a Python-first developer experience—gives Modal a technical differentiation story that is harder to replicate than pure API-layer wrappers. The customer roster spans robotics, music generation, enterprise agents, coding tools, and biotech, demonstrating genuine platform breadth.
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO028
  - CO043
  - CO044

- calloutType: risk
  title: Governance opacity and outage cadence are material diligence gaps at $4.65B valuation
  body: For a company at this valuation, the complete absence of board-level disclosure, the opacity around Akshat Bubna's role, and the lack of any named C-suite beyond the founders create governance risk that cannot be resolved from public sources alone. The June 2026 community report of three major outages in one month—including an internal authentication failure—raises reliability concerns that the aggregate 99.9% uptime headline may obscure. These two risks, governance opacity and infrastructure reliability, should both be addressed in investor diligence before any commitment.
  claimRefs:
  - CO017
  - CO018
  - CO019
  - CO020
  - CO046
  - CO049
  - CO050

