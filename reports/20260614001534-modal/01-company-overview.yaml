- id: founders-leadership-governance
  title: Founders, Leadership, and Governance
  body: 'Modal was founded by Erik Bernhardsson and Akshat Bubna, as confirmed by both the Redpoint Ventures portfolio page and multiple public references. Erik Bernhardsson is the public-facing CEO and co-founder, most visibly through his personal blog (erikbern.com), where a December 2022 post announced Modal publicly ("Long story short: I''m working on a super cool tool called Modal"). Bernhardsson is well known in the machine learning engineering community as the creator of the Annoy approximate nearest-neighbor library and as a prominent blogger on software infrastructure and ML systems. His prior industry role is not independently confirmed by a fetched primary source in this run, so specific previous employer claims are excluded. Akshat Bubna is the co-founder; his functional title (CTO or other) and prior background are not confirmed in the fetched public corpus as of June 2026, representing a governance transparency gap. Beyond the two founders, the public corpus does not surface other named executives (VP Engineering, VP Sales, CFO, Head of Revenue, etc.) in any official or independent source that was successfully retrieved in this run. The board of directors is similarly opaque: no board composition, committee structure, or investor control rights have been disclosed in the fetched sources. This is typical for a late-private Series C company but notable given the $4.65B valuation and the depth of the investor syndicate. A structural risk is that the company appears to present a two-founder, founder-led narrative that has not yet disclosed independent governance oversight mechanisms in public channels. The Series C blog post was co-authored in the voice of the company rather than naming individual executives, consistent with a tight founder-communications style. Key-person risk is therefore concentrated in Bernhardsson, who serves as the primary external communications face and technical thought leader. The absence of a publicly named head of sales or revenue leader is also notable for a company at $300M+ ARR.'
  claimRefs:
