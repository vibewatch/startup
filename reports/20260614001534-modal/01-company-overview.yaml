    severity: material
    topic: revenue
    missingEvidence: No third-party source (analyst report, customer filings, leak) independently corroborates Modal's disclosed $300M+ ARR or the claimed 5x growth since Series B.
    whyItMatters: ARR is the primary justification for the $4.65B Series C valuation. Without corroboration the revenue figure is solely company-disclosed and the implied multiple (~15x ARR at current valuation) cannot be independently assessed.
    diligencePath: Request audited revenue figures under NDA; seek analyst estimates from firms covering AI infrastructure (Bain, IDC, SemiAnalysis).
