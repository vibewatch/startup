    topic: funding
    missingEvidence: No independently fetched press release, news article, or third-party source confirms the Series B amount ($110M), valuation ($1.1B), closing date (October 2025), or investor list (Redpoint, Sutter Hill Ventures).
    whyItMatters: Without independent confirmation, the Series B details—and therefore the total funding history—rest solely on the user-provided task context. Conflicting Series C disclosure (BCV listed as new investor in Series C) further complicates the Series B investor list.
    diligencePath: Request the official Series B press release or a company-provided funding summary; search for the original investor announcement from Sutter Hill Ventures.
    relatedQuestionRefs:
    - QO008
    - QO009
    relatedTableRefs:
