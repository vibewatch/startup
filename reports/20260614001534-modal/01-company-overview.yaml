- id: funding-valuation-investors
  title: Funding History, Valuation, and Investor Base
  body: 'Modal has completed three confirmed institutional funding rounds. Redpoint Ventures first invested in Modal''s Series A in 2023, as stated explicitly on the Redpoint portfolio page. The user-provided context indicates a Series B of $110M closed in October 2025 at a $1.1B post-money valuation, with Redpoint and Sutter Hill Ventures as lead investors; this round is not independently confirmed in the fetched public corpus (no press release or official announcement was retrieved), so it is carried as company-inferred / partially verified. The most recent and definitively confirmed round is the Series C announced on May 21, 2026: $355M at a $4.65B post-money valuation, co-led by General Catalyst and Redpoint Ventures, with Menlo Ventures, Bain Capital Ventures, and Accel joining as new investors; all existing major investors also participated. The Series C announcement explicitly states Modal had grown "fivefold since" the Series B and that annualized revenue had surpassed $300M. The total capital raised is approximately $465M+ (seed plus estimated Series A plus Series B $110M plus Series C $355M), though precise seed and Series A amounts are not in the fetched corpus. General Catalyst''s portfolio page confirms the investment as "a serverless cloud for the AI era" and discloses that investors in the round include Quentin Clark, Max Rimpel, and Katie Keller as the GC team. Menlo Ventures'' presence is confirmed by a Menlo CDN asset (modal.svg) uploaded in May 2026 and the list disclosed in the Series C blog. Bain Capital Ventures is listed as a new Series C investor, meaning they were not a Series B investor contrary to the user-provided context; this conflicting data point is noted as an evidence gap. Modal''s valuation progression—from $1.1B (Series B) to $4.65B (Series C) in roughly seven months—is among the fastest in the AI infrastructure sector and implies very high investor conviction in the $300M ARR milestone, though detailed margin, burn rate, and growth cohort data remain undisclosed.'
