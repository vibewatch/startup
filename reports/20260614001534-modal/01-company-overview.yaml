company:
  name: Modal
chapter:
  number: 1
  title: Company Overview
  summary: Modal (legal entity Modal Labs, Inc.) is a New York-headquartered serverless AI infrastructure company founded around 2021 by Erik Bernhardsson and Akshat Bubna. The company delivers a Python-first, cloud-agnostic compute platform designed for AI workloads—elastic GPU inference, distributed training, agent sandboxes, and batch jobs—built on proprietary technology that achieves sub-second cold starts via GPU memory snapshotting. Its May 2026 Series C ($355M at $4.65B post-money, co-led by General Catalyst and Redpoint) positions Modal as a late-stage private company with over $300M in annualized revenue and a deep customer roster spanning AI-native startups to Fortune 100 operators, though headcount detail, full board composition, and third-party revenue verification remain open diligence gaps.
sections:
- id: identity-product-market-position
  title: Identity, Product, and Market Position
  body: 'Modal Labs, Inc. is a Delaware-incorporated production cloud for AI. Its legal entity name and Delaware domicile are confirmed in the May 2026 SaaS agreement, which governs all enterprise customers. The operating headquarters is New York City, New York, as confirmed by both the LinkedIn company page (25,318 followers, June 2026) and the Redpoint Ventures portfolio page. This contradicts the San Francisco location sometimes cited in secondary market databases; the fetched primary sources are treated as authoritative. Modal describes its purpose as building the infrastructure layer that was missing when AI workloads arrived: traditional cloud infrastructure—designed for stateless web applications—was never architected for models requiring GPU memory, dynamic scaling between zero and thousands of accelerators, and isolated execution environments for agent-generated code. The company has operated under the tagline "The production cloud for AI" and the homepage text "The production cloud for AI—built for speed, at any scale." Core products as of June 2026 include: Functions (GPU and CPU serverless compute), Sandboxes (isolated containers for agent-executed or LLM-generated code), Training (fine-tuning and multi-node training jobs), Volumes (high-performance mutable storage), Web Endpoints (HTTP/ASGI serving), and GPU Notebooks (collaborative notebooks). Pricing is structured as Starter ($0 base with $30/month in free credits, 10 GPU concurrency), Team ($250/month, 50 GPU concurrency), and Enterprise (custom). The modal Python SDK (available on PyPI for Python 3.10–3.14) is Modal''s primary developer surface; JavaScript/TypeScript and Go are also supported for orchestration. Modal pools capacity across major clouds and hundreds of data centers globally, enabling autoscaling from 0 to 1,000+ GPUs in seconds without reserved capacity. The company''s claim of five years of infrastructure investment (cited in the May 2026 Series C post) supports a 2021 founding, consistent with the user-provided context; the public corpus does not surface a precise founding date or day.'
