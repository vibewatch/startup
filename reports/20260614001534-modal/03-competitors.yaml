- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Sub-second GPU cold starts via memory snapshotting
    - May 2026 blog post details four-layer technical stack (cloud buffers, content-addressed FS, CPU ckpt, CUDA ckpt); confirmed in production by Physical Intelligence (10–15ms latency)
    - RunPod FlashBoot claims sub-200ms worker starts; Google Cloud Run L4 GPU starts in 5 seconds; Azure Container Apps sub-second container start
    - Medium — RunPod narrows but doesn't match GPU-level memory snapshot depth; hyperscalers limited to L4
    - Verify whether RunPod FlashBoot is model-loaded or just worker-started; benchmark cold-start with identical model weights on Modal vs. RunPod vs. GCR
  - - Python-native SDK ergonomics (@app.function decorator)
    - 'Suno CTO: "all you need to know is that you can scale your function calls in the cloud with a few lines of Python"; zero config files cited'
    - Beam Cloud offers Python-first SDK with similar decorator patterns; future hyperscaler DX improvements possible
    - Low-Medium — Beam Cloud is early and smaller scale; Modal's SDK maturity and documentation depth create switching cost
    - Track Beam Cloud SDK usage and HN developer sentiment; assess whether Beam Cloud gains traction in the AI engineer community through 2026
  - - Multi-cloud GPU pooling (AWS + GCP + Oracle)
    - Sacra confirms Oracle Cloud Infrastructure partnership for pricing flexibility; Modal docs confirm multi-cloud scheduling
    - Baseten and Beam Cloud both offer multi-cloud or BYOC options; hyperscaler-native options have natural single-cloud pooling
    - Medium — Baseten's self-host and BYOC are more enterprise-friendly than Modal's managed-only multi-cloud model
    - Confirm Oracle partnership terms and GPU allocation guarantees; assess whether BYOC is needed for top-10 enterprise accounts
  - - Enterprise customer lock-in (Python SDK workflow coupling)
    - Applied Compute, Cognition, Lovable cited as deeply integrated users; Sandboxes power millions of coding agent environments
    - Model weights, containers, and inference frameworks (vLLM, TRT-LLM) are portable; multi-homing structurally easy in this market
    - Medium — workflow-level lock-in exists but data portability is intact; sophisticated enterprises will dual-source
    - Track customer NPS and churn at 12-month renewal; identify accounts that are multi-homing with RunPod or Baseten already
  - - Series C capital ($355M) extends runway and GPU partnership access
    - Confirmed at $4.65B valuation with General Catalyst, Redpoint, Menlo, Bain, Accel (May 2026)
    - CoreWeave has multi-billion contracts; Baseten has $585M raised; hyperscalers have infinite balance sheets
    - Low — Modal's capital position is strong for this stage; hyperscaler financial advantage is structural, not near-term
    - 'Review capital allocation plan: GPU reservation commitments, R&D headcount, sales capacity for enterprise push'
  - - $300M+ ARR growth velocity (5x from Series B to Series C)
    - Sacra estimates $300M ARR April 2026; company-stated "fivefold" growth since Series B
    - Revenue concentration in AI-native startups (Suno, Cognition) creates churn risk if those customers slow spend; company-claimed ARR unaudited
    - Medium — concentration risk is real; no independent revenue verification available
    - Verify ARR with audited revenue or customer-level usage data; assess top-10 customer revenue concentration
  - - Compliance gap vs. regulated-industry competitors
    - Lambda AI holds ISO 27001/ISO 27017/ISO 27701/ISO 22301/SOC 2 Type II; Baseten holds SOC 2 + HIPAA at all tiers; Modal HIPAA is Enterprise-only
    - Large enterprise and government buyers increasingly require full compliance stack before procurement; Modal not FedRAMP-authorized
    - High — this is a concrete displacement risk in healthcare, finance, and federal segments
    - Confirm Modal's compliance roadmap for 2026–2027; assess whether FedRAMP or ISO certifications are planned or budgeted
  notes: >-
    Severity ratings (Low/Medium/High) are based on the combination of evidence quality, competitor capability,
