- id: section-3
  title: Pricing, Distribution, and Switching Costs
  body: >-
    Modal's pricing is usage-based (per second of GPU/CPU compute) with three plan tiers: Starter
    ($0 base, $30/month in free GPU credits, 10 GPU concurrency), Team ($250/month plus compute, 50
    GPU concurrency), and Enterprise (custom). Beam Cloud's serverless pricing is roughly comparable:
    RTX 4090 at $0.000192/second, A10G at $0.000292/second, CPU at $0.0000528/core/second. Banana.dev
    charges a $1,200/month Team flat fee plus at-cost compute (zero markup claimed). RunPod's L40S
    was cited at $0.86/hr (Chapter 2 evidence) on Secure Cloud, significantly below Modal's managed
    equivalent—this is the principal cost-floor pressure point. CoreWeave's H200 NVL72 on-demand rate
    is $42.00/hr (8-GPU config), targeting large model training rather than per-request inference.
    AWS Bedrock offers batch inference at 50% below on-demand pricing for open-model access, creating
    a discount path for AWS-committed enterprises. Together AI's per-token pricing (e.g., $2.10/1M
    input tokens for DeepSeek V4 Pro) targets a different unit economics layer—token-level billing
    rather than GPU-second billing. Hyperscalers dominate enterprise distribution through cloud
    commitment programs (AWS Enterprise Discount Programs, GCP Committed Use Discounts, Azure MACC)
    that bundle AI compute into existing contracts. Modal partially addresses this through marketplace
    integrations with major cloud providers, allowing enterprises to apply existing committed spend,
    reducing procurement friction—a strategy confirmed by Sacra's analysis. Switching costs in this
    market are moderate. Modal's Python SDK decorator pattern creates workflow-level lock-in: migrating
    a large codebase from `@modal.function()` decorators to an alternative requires non-trivial
    rearchitecting. However, underlying model weights, Docker container standards, and inference
    frameworks (vLLM, TensorRT-LLM) are portable, so customers can multi-home across platforms.
    RunPod explicitly markets no lock-in. Baseten's Truss framework creates a different kind of
    packaging lock-in that requires format migration. The deepest lock-in exists in the status-quo
    alternative: enterprises that have built Kubernetes-based GPU infrastructure are often anchored by
    years of devops investment, custom monitoring, IAM integration, and vendor relationships. Modal's
    best sales motion is the cost of maintaining that infrastructure rather than direct head-to-head
    pricing competition.
