  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Named enterprise win/loss analyses against Baseten, RunPod, AWS, and GCP segmented by buyer type
      and deal size; customer NPS data; multi-homing rates.
    whyItMatters: >-
      Distribution power and switching costs determine whether Modal can hold premium pricing outside
      developer-led PLG accounts as it moves upmarket.
    diligencePath: >-
      Request the last 20 large-deal CRM records and win/loss rationale; ask sales team for top three
      reasons customers choose Modal vs. Baseten and vs. RunPod in competitive deals.
    relatedQuestionRefs:
    - QP023
    - QP017
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: compliance-roadmap
    missingEvidence: >-
      Modal's planned timeline for SOC 2 Type II, ISO 27001, and FedRAMP certifications;
      current enterprise deals blocked by compliance gaps.
    whyItMatters: >-
      Lambda AI's comprehensive compliance stack and Baseten's SOC 2 + HIPAA create concrete gating
      criteria for regulated-industry buyers that Modal cannot serve without these certifications.
    diligencePath: >-
      Confirm Modal's compliance roadmap for 2026–2027 with management; identify any enterprise accounts
      that have been lost or delayed due to missing certifications.
    relatedQuestionRefs:
    - QP011
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: moderate
    topic: independent-benchmarks
    missingEvidence: >-
      Controlled throughput and latency benchmarks comparing Modal vs. RunPod vs. Baseten for the same
      model (e.g., Llama 3 70B or Whisper large-v3) under identical load and cold-start conditions.
    whyItMatters: >-
      Modal's cold-start advantage and RunPod's FlashBoot claims are both vendor-asserted; an independent
      benchmark would clarify whether the performance gap is material for production inference buyers.
    diligencePath: >-
      Commission a bake-off using a standardized model and prompt mix on A100 80GB instances with identical
      warm/cold-start assumptions across Modal, RunPod Serverless, and Google Cloud Run L4.
    relatedQuestionRefs:
    - QP007
    - QP019
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: moderate
    topic: pricing-net-of-discounts
    missingEvidence: >-
      Net enterprise pricing (after discounts) for Modal Enterprise vs. Baseten Pro vs. AWS EDP-bundled
      Bedrock; list-to-net ratio for each vendor in comparable deal sizes.
    whyItMatters: >-
      Public list pricing overstates head-to-head cost differences; enterprise buyers negotiate materially
      and hyperscaler bundling can make Bedrock effectively free within an EDP commitment.
    diligencePath: >-
      Request three recent enterprise contracts and discount schedules for Modal; cross-reference against
      Baseten and AWS Bedrock deal sizes disclosed in CRM.
    relatedQuestionRefs:
    - QP015
    - QP006
    - QP024
    relatedTableRefs:
    - TP003

