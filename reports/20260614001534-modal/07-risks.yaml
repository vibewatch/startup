- id: SR002
  title: Operational and reliability risk is the chapter's most critical finding given three major outages in a single month
    against an absent public SLA
  body: 'Modal''s aggregate uptime statistics are solid: the status page (June 14, 2026) shows 90-day uptime of 99.946% for
    GPU

    functions, 99.938% for CPU functions, 99.933% for Web endpoints, 99.782% for Snapshot restores, and 99.861% for Sandboxes.

    Those figures are consistent with production-grade infrastructure and should not be dismissed. But the shape of the incidents

    that generated those downtime minutes is a material diligence signal. A Hacker News post from June 3, 2026 documented
    three

    major outages in a single month: the May 7 SEV 1 (AWS availability zone us1-az4 overheating), a May 19 incident with no

    published post-mortem, and the June 3 incident—an internal authentication system failure unrelated to GPU hardware or

    cloud-provider availability. The clustering of three events in 30 days raises the question of whether Modal''s reliability

    infrastructure has kept pace with its revenue growth from roughly $60M to $300M ARR in approximately 12 months.


    The authentication system failure on June 3 is particularly adverse as a signal: it indicates a centralized control-plane

    dependency that is not directly mitigated by Modal''s multi-cloud GPU pooling. The May 7 AWS AZ overheating shows that
    even

    with multi-cloud architecture, a single-zone failure propagates to customers for in-flight workloads. Together, these
    two

    failure modes suggest that Modal''s redundancy architecture may be more effective at preventing capacity shortfalls than
    at

    absorbing sudden AZ-level events or control-plane faults.


    The SLA gap compounds the operational risk. Modal publishes no contractual uptime commitment for Starter or Team customers—

    the large majority of its user base. Enterprise SLA terms are negotiated privately and are not publicly available. This
    means

    most Modal customers have no contractual remedy for the three May–June 2026 outages. Modal does have substantive mitigations:

    SOC 2 Type II with no deviations (January 2025 audit), a private HackerOne bug bounty program, gVisor container isolation,

    Rust-based container runtime, TLS 1.3 on all public APIs, and automated synthetic monitoring. These are real protections.

    But the absence of a published SLA for non-Enterprise customers, combined with the outage cluster, means operational risk

    belongs at the top of the severity ranking until confirmed by diligence on incident root causes and post-mortem cadence.

    '
