- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  notes: Triggers are designed to be observable within a quarterly monitoring cadence. All thresholds assume the investor
    has confirmed baseline reliability and growth metrics in diligence prior to investment.
  rows:
  - - Operational reliability — outage cluster recurrence
    - Track monthly incident count and severity from status.modal.com; request post-mortem reports for each SEV 1 event
    - Three or more major incidents per quarter with no published root-cause remediation; or any single incident exceeding
      4 hours of GPU function unavailability
    - Investment pause; escalate diligence request for infrastructure architecture review and post-mortem library; consider
      SLA escrow in enterprise terms
  - - SLA gap — absence of non-Enterprise contractual protections
    - Monitor for published SLA for Starter or Team plans; track any public announcement of SLA policy changes
    - Continued absence of published SLA for non-Enterprise plans after Series C deployment (expected within 12 months)
    - Require enterprise MSA with custom SLA as condition of any production deployment; flag as negative signal for broad
      developer market monetization
  - - HIPAA / regulated-workload compliance — BAA scope expansion
    - Track trust.modal.com and security docs page for BAA scope updates; request updated BAA exhibit annually
    - GPU Memory Snapshots remain excluded from BAA scope for more than 24 months post-GA; no custom BAA expansion available
      for regulated healthcare customers
    - Downgrade healthcare vertical TAM estimate; flag HIPAA compliance as marketing-ahead-of-contract risk in regulated enterprise
      sales
  - - ARR growth deceleration — hypergrowth slowdown
    - Sacra quarterly ARR estimate; any public disclosure from Modal; secondary market valuation signals; new enterprise customer
      announcements
    - ARR growth falls below 50% YoY (from 5x 7-month pace); or Sandbox revenue share declines from one-third without offsetting
      Functions growth
    - Re-underwrite financial model; reduce multiple target; request pipeline visibility and customer cohort data in diligence
  - - Hyperscaler substitution — named customer defection
    - Monitor customer announcement feeds, press coverage, and product launch alerts from AWS Bedrock AgentCore, GCP Vertex
      AI, Azure AI Foundry for Modal-adjacent features
    - Any named Modal reference customer (Suno, Cognition, Physical Intelligence, Ramp, Applied Compute) publicly announces
      migration to hyperscaler-native serverless GPU or Sandbox-equivalent product
    - Thesis-break event; halt position sizing increase; trigger full portfolio review of Modal exposure; request emergency
      management briefing on competitive response
