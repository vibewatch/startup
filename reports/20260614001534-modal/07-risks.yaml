chapter:
  number: 7
  title: Risks
  summary: 'Modal''s risk profile is severe on three counts and manageable on two others. The severe risks are: (1) a cluster
    of three major operational outages in a single month (May–June 2026) against an absent public SLA for the majority of
    its customer base; (2) an asset-light supply model that concentrates GPU compute dependency on AWS, GCP, and Oracle Cloud
    with no owned hardware buffer; and (3) a $4.65B valuation at approximately 15.5x ARR that prices in hypergrowth execution
    and tolerates no sustained outage or commoditization drag. The manageable risks are compliance scope (SOC 2 Type II no-deviation
    audit, HIPAA BAA on Enterprise, GDPR DPA embedded in terms) and key-person concentration (Bernhardsson is highly visible
    but the company is engineering-led, well-funded, and has broad investor backing). Regulatory exposure is real but bounded:
    the EU AI Act''s GPAI governance rules became applicable in August 2025 and full applicability arrives August 2026, creating
    indirect compliance burden through Modal''s enterprise customers. No litigation or enforcement action has been identified.
    Thesis-break triggers are quantifiable: three or more major incidents per quarter, ARR growth falling below 50% YoY, or
    a named enterprise defection to a hyperscaler native offering would each warrant investment pause. Mitigations are real
    but incomplete: multi-cloud architecture, SOC 2, HIPAA BAA, and $355M in fresh capital provide meaningful risk absorption,
    but the outage cluster and SLA gap require diligence confirmation before underwriting production-critical use.'
sections:
- id: SR001
  title: Legal and regulatory risk is bounded but requires diligence on HIPAA scope and EU AI Act compliance chains
  body: 'Modal''s legal and regulatory posture is among the more transparent for a late-stage private infrastructure company.
    The

    company embeds a full Data Processing Agreement in its terms of service (effective October 2025), completing the GDPR

    Article 28 controller-processor relationship and naming the subprocessor list at trust.modal.com/subprocessors. The DPA''s

    Technical and Organizational Measures table commits Modal to encryption at rest, access controls, annual SOC 2 Type II

    renewal, and daily customer-data backups. Critically, however, the DPA places legal-basis, notice, and consent obligations

    on the customer as data controller—not on Modal—meaning regulated deployments require customer-side GDPR compliance programs

    even when Modal''s infrastructure stack is fully compliant. This shared-responsibility split is common in cloud services
    but

    is often underappreciated by enterprise buyers in healthcare or financial services.


    On HIPAA specifically, Modal''s security documentation lists Volumes v1, Memory Snapshots, and Images (excluding Filesystem

    and Directory Snapshots) as explicitly out of BAA scope. This limitation is material: GPU Memory Snapshots are Modal''s
    most

    differentiated cold-start feature, and their HIPAA exclusion means healthcare customers cannot use the capability that

    justifies Modal''s performance premium without risk of PHI exposure. The BAA-eligible surface is therefore narrower than

    the product marketing implies, and diligence must confirm whether custom Enterprise contracts expand BAA scope before

    underwriting regulated workloads on Modal.


    The EU AI Act (Regulation 2024/1689) entered into force August 1, 2024 and reaches full applicability August 2, 2026.

    GPAI model governance rules—which require technical documentation, training data transparency, and copyright compliance

    from providers of general-purpose AI models—became applicable August 2, 2025. Modal is not a GPAI model provider, but

    its enterprise customers who are GPAI providers (fine-tuning open models, serving Llama variants, building downstream

    products) may need to satisfy AI Act documentation requirements that flow upstream to their infrastructure vendors. This

    creates an indirect compliance burden for Modal: enterprise procurement cycles may lengthen as customers ask Modal for

    documentation, subprocessor lists, and data residency confirmations to satisfy their own AI Act filing requirements.

    The AI omnibus political agreement of May 7, 2026 extended some high-risk AI system rules to December 2027, but did

    not delay the GPAI obligations already in force. No active litigation, enforcement action, or regulatory investigation

    against Modal Labs, Inc. has been identified in any publicly available source as of June 14, 2026.

    '
