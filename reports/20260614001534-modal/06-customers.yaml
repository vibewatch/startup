figures:
  - id: FU001
    title: Modal Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Customer acquisition, onboarding, expansion, and retention stages across
      Modal's primary buyer segments from free trial through multi-product enterprise use.
    data:
      items:
        - label: Discovery and Free Trial
          stage: Awareness
          actors:
            - ML engineer
            - Platform engineer
            - Startup founder
          touchpoints:
            - Hacker News / GitHub word-of-mouth
            - Modal startup credits program ($30/month free compute)
            - PyPI modal package install
          emotion: Teams want instant cloud GPU access without cluster overhead.
        - label: First Workload Deployment
          stage: Activation
          actors:
            - ML engineer
            - Applied-AI team
          touchpoints:
            - First Modal Function deployed (fine-tuning, batch, inference endpoint)
            - Hours-to-first-result from Python decorators
            - Modal Volumes for persistent dataset storage
          emotion: Surprise at the speed and simplicity vs. prior AWS/K8s experience.
        - label: Production Scale
          stage: Expansion
          actors:
            - ML engineering team
            - Platform team
            - Product engineering
          touchpoints:
            - Auto-scale to 100-1500 GPUs on-demand
            - Cold starts under 1 second; scale-to-zero billing
            - SOC2/HIPAA enterprise tier adopted
          emotion: Trust established; Modal becomes preferred infrastructure.
        - label: Multi-Product Expansion
          stage: Retention
          actors:
            - ML engineering lead
            - Product manager (Ramp case)
            - Infra team
          touchpoints:
            - Add Modal Sandboxes for agent evals or code execution
            - Add Queues and Dicts for distributed coordination
            - Add multi-node GPU clusters for RL or video inference
          emotion: Platform becomes core AI infrastructure layer, not just one tool.
        - label: Strategic Partnership
          stage: Advocacy
          actors:
            - Engineering leadership
            - ML team
          touchpoints:
            - Case study co-authored with Modal
            - CEO or CTO quoted in Modal blog or Series C announcement
            - Customer referenced in fundraising materials
          emotion: Deep organizational commitment; switching cost grows with integration depth.
    approximationNotes: >-
      Journey stages are inferred from case study narratives; no disclosed funnel
      conversion data or time-in-stage metrics are available.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU026
      - CU027
      - CU029
      - CU030

