  - id: retention-durability-and-expansion
    title: Retention, durability, and expansion signals
    body: >-
      Retention evidence is directionally positive but structurally incomplete.
      On the positive side, at least two named accounts (Ramp and Quora) show
      documented multi-product expansion: Ramp moved from fine-tuning to the full
      Inspect coding agent platform, and Quora extended from model deployment
      infrastructure to full Sandbox adoption for Poe's code interpreter. Lovable's
      founder explicitly described Modal as the partner they "trust to keep up with
      growth," language that reads as high-commitment intent rather than short-term
      evaluation. The platform's structural land-and-expand motion is visible:
      customers typically start with one workload (a fine-tuning job, a batch
      pipeline, a single inference endpoint) and then add products as they scale
      (Sandboxes, Volumes, Queues, multi-node clusters). Multiple case studies show
      that customers migrated from stitched-together AWS or Kubernetes environments
      and did not go back, implying high switching costs driven by developer experience
      rather than technical lock-in.
      On the durability gap side, Modal has disclosed no NRR, GRR, contract duration,
      average revenue per account, cohort retention, or top-customer revenue
      concentration data in any public filing, press release, or interview reviewed
      in this run. This means that the expansion signals are anecdotal and cannot be
      extrapolated to the full book. The reliability risks are real: three separate
      outages in May–June 2026 (documented on Hacker News and confirmed by the status
      page) raise the question of whether enterprise customers experienced SLA
      breaches or whether churn followed those events.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
    tableRefs:
      - TU004

  - id: concentration-adverse-and-competitive-pressure
    title: Concentration risk, adverse signals, and competitive pressure
    body: >-
      The core concentration risk is not visible in the public record but inferred
      from its absence. Modal has not disclosed the revenue share of its top five or
      ten customers. Given that the case study library features a handful of very
      high-profile accounts running extremely large workloads (Lovable at 1 million
      sandboxes in 48 hours; Suno scaling to thousands of GPUs), it is plausible
      that a small cohort of hyperscale customers drives a disproportionate share
      of compute consumption. The platform's usage-based billing model means that
      any single large customer reducing workloads—whether due to model optimization,
      competitive switch, or business contraction—could create significant revenue
      variance. Sacra flags that hyperscaler competition (AWS, Google, Azure adding
      serverless GPU with scale-to-zero billing) may erode Modal's cost and cold-start
      advantages over time. DoorDash's May 2026 quote described its use of Claude
      Managed Agents on Modal as "evaluating," which reads as directional exploration
      rather than committed production spend, suggesting some named accounts are in
      earlier stages than the most mature case studies imply. The three outages
      documented in May–June 2026 represent an adverse signal: Hacker News user
      comments described the June 3 event as "the third major outage in a month,"
      pointing to a reliability trend that could be a retention risk for
      latency-sensitive enterprise workloads. Modal's 99.86–99.95% uptime figures
      over 90 days are serviceable but not top-tier for mission-critical production
      systems. On switching cost: Modal benefits from Python-native ergonomics and
      low infrastructure overhead, but the open-model, open-runtime design means
      customers carry their models and code with them if they leave.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
    tableRefs:
      - TU005
    figureRefs:
      - FU003

  - id: platform-breadth-and-use-case-taxonomy
    title: Platform breadth and use-case taxonomy
    body: >-
      Modal's customer evidence spans eight distinct use-case categories—LLM
      inference serving, sandboxed code execution, RL training infrastructure,
      custom fine-tuning, audio/video/image generation, computational biology, batch
      processing, and robotic real-time inference—each demonstrated by at least one
      named production deployment. The breadth matters because it reduces the
      risk that Modal is dependent on a single workload type. Sandboxed code
      execution alone drives more than one-third of revenue per the Series C
      announcement, anchored by Lovable's AI app generation, Ramp's Inspect coding
      agent, Quora's Poe code interpreter, and Cognition's RL environment work.
      LLM inference is the second major category, covering Decagon's real-time
      voice model, Runway Characters' video model, Suno's music generation, and
      Reducto's document intelligence pipelines. The RL training category has
      emerged rapidly in 2025–2026: Applied Compute, Cognition, and AE Studio
      (theorem proving) all use Modal for high-parallelism RL rollouts, and the
      Series C post explicitly cited "RL workloads" as a key growth driver.
      The computational biology category (Chai Discovery) and robotic AI (Physical
      Intelligence) are smaller but strategically relevant because they demonstrate
      Modal's ability to serve latency-critical and domain-specific scientific
      workloads beyond typical cloud-AI patterns. Solutions pages for LLM serving,
      image and video, and coding agents confirm that Modal is actively marketing
      to each of these categories and not just observing organic adoption.
    claimRefs:
      - CU002
      - CU006
      - CU011
      - CU020
      - CU021
      - CU023
      - CU028

