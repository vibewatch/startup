callouts:
  - calloutType: strength
    title: Ten Production Deployments with Measurable Outcomes
    body: >-
      Unlike many early-stage AI infrastructure companies whose customer proof
      consists of logo walls, Modal's ten disclosed case studies all describe
      production workloads with specific performance metrics (latency reductions,
      GPU counts, throughput benchmarks, engineering time saved). This depth of
      proof is unusual for a private company three years from founding.
    claimRefs:
      - CU014
      - CU016
      - CU017
      - CU018
      - CU028

  - calloutType: risk
    title: No Retention Metrics Disclosed; Three Recent Outages
    body: >-
      Modal has disclosed no NRR, GRR, contract duration, or top-customer
      concentration data. Combined with three documented major outages in May–June
      2026, investors cannot independently validate the durability of the revenue
      base. Retention must be inferred from expansion anecdotes and testimonials
      rather than measured cohort economics.
    claimRefs:
      - CU031
      - CU032
      - CU033

  - calloutType: insight
    title: Sandboxes as the Breakout Product
    body: >-
      Modal's Series C announcement that sandboxes drive more than one-third of
      revenue—and that over 1 billion sandboxes have been launched—marks a
      product-mix shift from general GPU compute toward the AI agent infrastructure
      category. Coding agents (Ramp, Lovable, Quora, Cognition) and RL training
      (Applied Compute, Cognition, AE Studio) both anchor on Sandboxes. This
      concentration is both a growth driver and a market-linkage risk.
    claimRefs:
      - CU006
      - CU011
      - CU028

