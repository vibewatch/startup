company:
  name: Modal
chapter:
  number: 6
  title: Customers
  summary: >-
    Modal's public customer evidence shows deep production adoption across AI-native
    software builders, fintech, enterprise SaaS, media/content, computational biology,
    and robotics—anchored by ten named case studies with concrete performance and
    scale outcomes. Expansion signals are strong (Ramp, Quora each extended their
    footprint across multiple Modal products), and sandboxes now drive more than a
    third of revenue per the May 2026 Series C announcement. Critical gaps remain:
    no NRR, GRR, contract duration, or top-customer revenue concentration data are
    publicly disclosed, and three outages in May–June 2026 introduce a reliability
    question for enterprise customers.

sections:
  - id: customer-segmentation-and-buyer-profile
    title: Customer segmentation and buyer profile
    body: >-
      Modal's disclosed customer set spans six recognizable archetypes. The largest
      visible cohort is AI-native software builders—companies whose products are
      themselves AI applications—where buyers are ML engineers and platform teams
      who need elastic GPU compute without managing clusters. Lovable ($75M ARR,
      AI app generation), Cognition (Devin coding agent), Decagon (voice AI), and
      Applied Compute (RL agent training for DoorDash and Cognition) all fall here.
      The second cohort is enterprise SaaS and fintech: Ramp (fintech, $10B+ GMV
      platform), Quora (Poe, 400M monthly unique visitors), and Blend (mortgage
      technology for hundreds of banking environments). The third cohort covers
      media and content platforms (Suno music generation, Runway video characters,
      Zencastr podcast AI), which experience highly variable GPU demand tied to
      consumer usage patterns. Computational biology (Chai Discovery drug design)
      and robotic AI (Physical Intelligence real-time inference) round out the named
      base. Sacra's 2026 analysis estimates Modal serves thousands of ML teams and
      cites Meta's Code World Models team as a notable logo. Across all segments,
      the buyer is typically an ML, platform-engineering, or applied-AI team that
      values Python-native ergonomics and instant scalability over lower-level
      control. The visible population is still predominantly AI-native startups and
      mid-size tech companies; traditional enterprise names outside fintech and
      banking are sparse in the public record, a gap that the Runway Characters
      announcement (Fortune 10 companies cited) partially addresses but does not
      fully close.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU022
      - CU024
      - CU025
    tableRefs:
      - TU001
      - TU006
    figureRefs:
      - FU001

  - id: named-customer-proof-and-adoption-trajectory
    title: Named customer proof and adoption trajectory
    body: >-
      Modal's case study library now spans ten production deployments with measurable
      outcomes across diverse workloads. The strongest individual data points are
      Lovable (1 million sandboxes in a 48-hour event, 250,000 apps created, no
      engineering pages during the event), Ramp (more than half of all merged pull
      requests authored by the Inspect coding agent running on Modal Sandboxes), and
      Reducto (3x reduction in P90 latency after migrating 30-plus model pipelines,
      with cold-boot times cut 83%). Across the ten named deployments, every described
      use case is in production, not pilot—customers migrate existing workloads or
      build net-new products directly on Modal rather than running evaluations.
      The cumulative adoption signal is equally clear: Modal's own May 2026 Series C
      announcement disclosed that over one billion sandboxes have been launched on
      the platform since founding roughly three years earlier. The Series C post also
      noted that sandboxes drive more than one-third of total revenue, confirming
      that the sandbox product line—which underpins coding agents and RL
      infrastructure—has become Modal's fastest-growing commercial surface.
      Quora extended from general model deployment to Sandbox adoption for Poe's code
      interpreter, demonstrating that even existing customers expand use case coverage.
      Runway went from proof-of-concept to global production deployment in under
      30 days, highlighting a short time-to-value that facilitates rapid customer
      commitment.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
