  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: >-
        NRR, GRR, contract duration, cohort retention data, and top-customer
        revenue concentration have not been publicly disclosed.
      whyItMatters: >-
        Without these metrics, the durability of Modal's revenue base cannot be
        independently evaluated; expansion anecdotes cannot substitute for
        measured cohort economics.
      diligencePath: >-
        Request NRR/GRR breakdown, average contract length, and top-5/top-10
        customer ARR concentration in management due-diligence session.
      relatedQuestionRefs:
        - QU008
        - QU012

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: >-
        The customers page shows additional logos beyond the ten with full case
        studies; outcome details and production status for these additional
        accounts are not publicly available.
      whyItMatters: >-
        The full addressable customer set may be larger and more diverse than
        the ten disclosed deployments suggest, but without evidence the analysis
        is limited to the named set.
      diligencePath: >-
        Request full anonymized customer list with segment, workload type, and
        ARR band from management; ask for additional reference customers.
      relatedQuestionRefs:
        - QU002
        - QU007
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: adverse-reliability
      missingEvidence: >-
        No independent post-mortem reports from the May–June 2026 outage cluster
        were publicly available; only the status page and a single HN thread
        provide evidence.
      whyItMatters: >-
        Three outages in one month could indicate systemic reliability issues;
        without customer impact data or SLA breach records, the severity for
        enterprise accounts is unquantifiable.
      diligencePath: >-
        Request internal post-mortem reports for the three outage events;
        ask customers directly whether SLA credits were issued or service
        discussions triggered.
      relatedQuestionRefs:
        - QU010
        - QU011

    - type: private-evidence-only
      severity: minor
      topic: startup-conversion-funnel
      missingEvidence: >-
        Cohort conversion rate from startup credits to paid enterprise contracts,
        and the average time from credits graduation to first ARR, are not
        publicly disclosed.
      whyItMatters: >-
        The startup credits program is cited as a key growth funnel by Sacra, but
        without conversion data its contribution to recurring revenue is unverifiable.
      diligencePath: >-
        Request cohort data: how many credits customers graduated to paid accounts
        in the last two years, and what ARR they represent.
      relatedQuestionRefs:
        - QU021

    - type: missing-source
      severity: minor
      topic: customer-concentration
      missingEvidence: >-
        No public source discloses whether a small number of very large customers
        (e.g., Lovable, Cognition, Runway) dominate Sandbox revenue.
      whyItMatters: >-
        Usage-based billing on a platform with 1 billion sandboxes cumulatively
        implies that a few hyperscale accounts may drive a disproportionate
        revenue share; this cannot be confirmed or denied from public evidence.
      diligencePath: >-
        Request top-5 and top-10 customer revenue shares for both Sandbox and
        Inference product lines; ask for revenue distribution by customer spend tier.
      relatedQuestionRefs:
        - QU012
        - QU025

    - type: missing-source
      severity: minor
      topic: competitive-comparison
      missingEvidence: >-
        No independent head-to-head benchmark or customer survey comparing
        Modal's customer proof depth versus Baseten, BentoML, or other AI
        inference platforms exists in the public record.
      whyItMatters: >-
        Without a comparative baseline, evaluating whether Modal's ten named
        deployments represent segment leadership or average market coverage
        requires subjective inference rather than evidence.
      diligencePath: >-
        Review competitor case-study libraries; commission third-party developer
        survey covering which platforms AI-native teams use in production.
      relatedQuestionRefs:
        - QU015

    - type: missing-source
      severity: minor
      topic: pricing-durability
      missingEvidence: >-
        No public source confirms whether Modal customers cite price
        competitiveness as a retention driver, or whether hyperscaler or
        cheaper-alternative pricing has triggered any known churns or
        pricing negotiations.
      whyItMatters: >-
        Usage-based pricing on GPU compute is vulnerable to hyperscaler
        price-matching; without explicit customer price-satisfaction signals
        or disclosed churn attributable to cost, pricing durability is
        assumed rather than verified.
      diligencePath: >-
        Ask for customer NPS breakdown by segment; request any known
        churn analyses and the stated departure reason; review whether
        any case studies explicitly address cost comparison.
      relatedQuestionRefs:
        - QU016
