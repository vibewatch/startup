  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver
      - Concentration / Switching Risk
      - Impact
      - Diligence Path
    rows:
      - - Multi-product adoption (Sandboxes + Inference + Fine-tuning)
        - Revenue could concentrate in few hyperscale accounts (usage-based billing)
        - Large account departure creates revenue variance
        - Request top-5 customer ARR share; ask for churn rate by spend tier
      - - Startup credits → enterprise conversion funnel
        - Cohort conversion rate and graduation timing unknown
        - Funnel efficiency and CAC opaque; may distort growth optics
        - Request cohort conversion rate and average credits-to-paid time
      - - Sandbox product line (>1/3 of revenue)
        - Single product category concentration; agent market linked risk
        - Market slowdown in AI agent adoption would disproportionately impact Modal
        - Monitor agent market growth; ask for Sandbox vs. Inference revenue trend
      - - Python-native ergonomics as primary stickiness driver
        - No hard technical lock-in; open model/runtime means code is portable
        - Customer churn if competitor closes DX gap or undercuts price significantly
        - Ask for churned customer interviews; survey price sensitivity at $10K+/mo spend
      - - Enterprise sales motion
        - Sales motion and AE headcount not disclosed; may limit large deal capacity
        - Revenue ceiling if self-serve hits a contract-size wall
        - Request headcount, GTM structure, and large-deal sales cycle data
    notes: >-
      Expansion drivers and risks derived from case studies, Series C blog, and
      Sacra 2026 analysis. No primary financial data available; all risk ratings
