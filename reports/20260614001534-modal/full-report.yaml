      - number: '2.2'
        title: Multiple Sizing Lenses and Evidence Constraints
        blocks:
          - type: paragraph
            body: >-
              No single analyst report defines "serverless GPU cloud" as a standalone market category. Analysts instead
              publish estimates at different levels of abstraction, none of which perfectly match Modal's competitive
              perimeter. The most relevant narrow lens is Technavio's AI inference-as-a-service market, sized at USD
              85.25 billion in 2025 growing at 22.1% CAGR through 2030, with North America accounting for 41.1% of
              incremental growth and the GPU component alone representing USD 42.28 billion in 2024. MarketsandMarkets
              publishes a wider AI infrastructure lens (compute, memory, network, storage, and software) at USD 135.81
              billion in 2024, forecast to reach USD 394.46 billion by 2030 at a 19.4% CAGR. A third lens from
              MarketsandMarkets isolates the cloud AI market (infrastructure + ML platforms + MLOps + AIaaS) at USD
              327.15 billion by 2029 at 32.4% CAGR. Mordor Intelligence forecasts the cloud AI market at USD 269.02
              billion by 2031 at an 18.68% CAGR from 2026, with hybrid and multi-cloud architectures projected to grow
              at 22.31% CAGR. Finally, MarketsandMarkets' broadest AI estimate (hardware + software + services) puts the
              full market at USD 601.93 billion in 2026, growing to USD 3.638 trillion by 2033 at 29.3% CAGR.


              These estimates should not be summed. They measure overlapping or partially different markets at different
              definitional boundaries; the MarketsandMarkets infrastructure figure includes hardware capex, while
              Technavio's figure is narrower but service-only. The useful inference is directional: Modal operates in a
              market whose serviceable layer (cloud-managed, serverless AI compute) is conservatively in the tens to low
              hundreds of billions of dollars today, with documented growth in the 19–32% CAGR range depending on the
              lens applied. A bottom-up estimate—applying a 25–30% cloud- or serverless-managed share to the
              MarketsandMarkets $135B AI infrastructure figure— yields an implied SAM of USD 34–41 billion in 2024,
              scaling proportionally. Modal's >$300 million ARR represents approximately 0.35% penetration of the
              Technavio narrow inference market (USD 85.25B in 2025), confirming very early penetration within a large
              and expanding opportunity. At a 15x ARR multiple, Modal's $4.65B valuation is consistent with premium AI
              infrastructure peers showing similar top-line growth trajectories in 2026.
