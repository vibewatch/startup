    title: Valuation / return range — Modal scenario bands
    type: range
    layout: standard
    summary: >-
      The $4.65B Series C sits comfortably inside the base case; a step-up from here requires bull-case assumptions on
      both revenue and multiple.
    data:
      items:
        - label: Bear case
          low: 1.4
          mid: 2.4
          high: 3.5
          unit: USD bn
        - label: Base case
          low: 5.4
          mid: 7.2
          high: 9.75
          unit: USD bn
        - label: Bull case
          low: 9.75
          mid: 12.5
          high: 18
          unit: USD bn
        - label: Closed Series C
          low: 4.65
          mid: 4.65
          high: 4.65
          unit: USD bn
    approximationNotes: >-
      Scenario bands derived from ARR growth projections and multiple ranges derived from the private comparable set in
      TV004; bear/base/bull ARR ranges are $200–$330M, $450–$650M, and $650M–$1.0B respectively; multiples applied are
      7–10x (bear), 12–15x (base), 15–18x (bull). All figures are directional analyst estimates.
