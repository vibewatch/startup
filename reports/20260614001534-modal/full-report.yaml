        title: Competitive Landscape and Job-to-be-done Coverage
        blocks:
          - type: paragraph
            body: >-
              Modal addresses the same fundamental job as at least four overlapping competitor categories: run
              GPU-accelerated AI workloads in the cloud without provisioning or maintaining underlying hardware. The
              landscape is best understood in three tiers. Tier 1 (direct serverless peers): Baseten, Replicate, Beam
              Cloud, and Banana.dev all offer managed GPU compute with a developer-first deployment model. Baseten
              focuses on mission-critical inference with dedicated deployments, custom performance kernels
              (TensorRT-LLM, vLLM, SGLang), and hands-on forward-deployed engineer support. Replicate competes primarily
              through its community model library (hundreds of public models at one-line API access) and Cog packaging.
              Beam Cloud explicitly supports multi-cloud routing (AWS, GCP, Azure, Hetzner) and targets agentic
              sandboxes plus GPU inference. Banana.dev offers a flat monthly rate plus at-cost compute (Team:
              $1,200/month) and zero markup, targeting teams that want simplicity over managed features. Tier 2 (raw GPU
              clouds): RunPod reached 750,000+ developers and $120M ARR (Sacra, January 2026) with sub-200ms cold starts
              via FlashBoot technology, and Lambda AI (formerly Lambda Labs) pivoted to "The Superintelligence Cloud"
              with ISO 27001/SOC 2 compliance and dedicated cluster management. CoreWeave positions itself as "the
              world's #1 AI cloud platform" with Kubernetes-native infrastructure, 96% cluster goodput, and
              multi-billion-dollar contracts with OpenAI and Meta. Tier 3 (hyperscaler incumbents): AWS SageMaker
              provides a unified data-analytics-AI studio; Google Cloud Run offers on-demand L4 GPUs with 5-second
              starts and scale-to-zero; Google's Gemini Enterprise Agent Platform (formerly Vertex AI) offers 200+
              models and full MLOps tooling; Azure Container Apps provides serverless AI app hosting including Sandbox
              containers for agentic code execution. Together AI occupies an adjacent position: it raised $305M Series B
              at $3.3B valuation (Sacra) and competes primarily on per-token inference pricing for foundation model
              access, not custom model hosting. The status-quo alternative—Kubernetes clusters backed by reserved GPU
              instances on AWS, GCP, or Azure—remains the default for large enterprises and represents the
              highest-friction switching path for Modal to displace.
