      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Modal's disclosed customer base and case study corpus reveal five distinct buyer archetypes. AI-native
              product companies (Suno, Decagon, Lovable) have engineering or product leads as buyers; they start with
              self-serve Starter or Team tiers, evaluate purely on developer experience and scaling behavior, and
              typically stay on usage-based billing. Agentic coding platform builders (Cognition, Ramp, Lovable) need
              Modal's Sandbox product for isolated container execution; the buyer is an engineering or platform team and
              the workload is inherently bursty and latency-critical. Robotics and physical AI research labs (Physical
              Intelligence) require very low-latency GPU inference (10–15 ms cited) and are less price-sensitive; the
              buyer is often a research or ML infrastructure lead. Enterprise ML platform teams (DoorDash, Substack)
              have migrated existing ML pipelines from AWS SageMaker or internally managed clusters; the buyer expands
              from engineering into central platform or IT budgets, and compliance, reliability, and SLA guarantees
              become selection criteria. RL/research compute teams (Applied Compute, servicing DoorDash, Cognition,
              Mercor) require the full RL compute stack—environment, policy, reward, and data—run in parallel at scale;
              the buyer is a research or applied ML team.


              The budget owner lifecycle typically starts in product or engineering (developer tries Modal on a personal
              or team credit card), graduates to a departmental budget allocation once production workloads are
              committed, and then migrates to a central platform or IT budget at enterprise scale. Modal's pricing tiers
              (Starter at $0 with $30/month in free GPU credits and 10 GPU concurrency; Team at $250/month with 50 GPU
              concurrency; Enterprise at custom pricing) are designed to support this PLG- to-enterprise funnel without
              friction at each stage.


              The breadth of supported workload types is visible in Modal's 24+ documented examples as of June 2026: LLM
              inference (OpenAI-compatible endpoints), protein folding, coding agents, image generation, batch whisper
              transcription, video generation, music generation, RAG pipelines, and scientific computing. The scale
              limits (2,000 pending inputs and 25,000 total inputs per function for standard workloads; up to 1 million
              pending inputs for async .spawn() jobs) define the operational parameters that enterprise buyers must
              qualify against.
