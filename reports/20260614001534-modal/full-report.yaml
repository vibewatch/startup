  - id: FM004
    title: Deployment Value Chain — From AI Workload to Production Serving
    type: flow
    layout: wide
    summary: >-
      Modal captures value between model creation and end-user traffic by owning the deployment, scaling, and execution
      orchestration layers.
    data:
      nodes:
        - id: v1
          label: ML team with AI workload or model
          detail: >-
            A model, fine-tune, or inference pipeline already exists and needs a production home. Entry point can be a
            startup, enterprise ML team, or research lab.
          tone: neutral
        - id: v2
          label: Python SDK evaluation and prototyping
          detail: >-
            Engineers install the modal Python package and write a decorated function. No containers or Kubernetes
            config required. Cold-start docs and 24+ examples lower ramp time.
          tone: positive
        - id: v3
          label: Scale and cost qualification
          detail: >-
            Team validates latency (cold-start docs: ~1-second container boot), cost (pricing tiers), and concurrency
            limits (2K–25K inputs per function). For large models, pre-warm budget is assessed.
          tone: neutral
        - id: v4
          label: Security, compliance, and procurement gate
          detail: >-
            Enterprise teams apply SOC2/HIPAA/GDPR checks, negotiate Enterprise SLAs, and confirm data residency
            posture. This gate is the primary adoption barrier for regulated buyers.
          tone: warning
        - id: v5
          label: Modal serverless compute platform
          detail: >-
            Production Functions, Sandboxes, Web Endpoints, Training jobs, and Volumes run on Modal. Auto-scaling from 0
            to 1,000+ GPUs; billing is per second. B200/H200/H100/A100/L40S/L4 GPU tiers.
          tone: positive
        - id: v6
          label: Elastic GPU pool (B200 → T4 tiers)
          detail: >-
            Modal allocates from its pooled multi-cloud GPU inventory. Supply constraints (H100/H200/B200 allocation)
            are the primary ceiling risk at this layer.
          tone: warning
        - id: v7
          label: End application and end-user traffic
          detail: >-
            Consumer AI products, robotic systems, coding agents, enterprise ML pipelines, or API customers experience
            resulting latency and uptime (99.946% 90-day uptime for GPU functions, status.modal.com).
