      - number: '6.3'
        title: Retention, durability, and expansion signals
        blocks:
          - type: paragraph
            body: >-
              Retention evidence is directionally positive but structurally incomplete. On the positive side, at least
              two named accounts (Ramp and Quora) show documented multi-product expansion: Ramp moved from fine-tuning
              to the full Inspect coding agent platform, and Quora extended from model deployment infrastructure to full
              Sandbox adoption for Poe's code interpreter. Lovable's founder explicitly described Modal as the partner
              they "trust to keep up with growth," language that reads as high-commitment intent rather than short-term
              evaluation. The platform's structural land-and-expand motion is visible: customers typically start with
              one workload (a fine-tuning job, a batch pipeline, a single inference endpoint) and then add products as
              they scale (Sandboxes, Volumes, Queues, multi-node clusters). Multiple case studies show that customers
              migrated from stitched-together AWS or Kubernetes environments and did not go back, implying high
              switching costs driven by developer experience rather than technical lock-in. On the durability gap side,
              Modal has disclosed no NRR, GRR, contract duration, average revenue per account, cohort retention, or
              top-customer revenue concentration data in any public filing, press release, or interview reviewed in this
