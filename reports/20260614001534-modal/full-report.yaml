  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Modal presents itself as a "production cloud for AI" built around a single mental model: any Python
              function can become an autoscaling, GPU-backed cloud job by adding a decorator. In customer workflow
              terms, the product covers four distinct use patterns. First, interactive and exploratory compute:
              Notebooks let ML engineers spin up a GPU-backed browser notebook in seconds, and the `modal shell` command
              attaches a debug shell directly to a running container. Second, batch and scheduled workloads: Functions
              with `map()`, `starmap()`, and `for_each()` fan out across thousands of containers in parallel, and
              `modal.Cron`/`modal.Period` handle time-based triggers without external schedulers. Third, serving and
              real-time inference: Web Endpoints expose any function as a public HTTPS endpoint via
              `@modal.fastapi_endpoint`, ASGI, or WSGI apps; input concurrency via `@modal.concurrent` enables
              continuous batching for LLM serving. Fourth, agent and untrusted-code execution: Sandboxes are ephemeral
              isolated containers that accept arbitrary code (from an LLM or user), execute it under gVisor isolation,
              and return stdout/stderr—Lovable used this to support tens of thousands of simultaneous app-creation
              sessions, and Cognition ran millions of Sandboxes for coding agents. Storage is first-class: Volumes
              (high-performance distributed filesystem), Dicts (distributed key-value), and Queues (FIFO,
              multi-producer/consumer) complete the primitive set. The unified SDK means a team can move from a
              single-function prototype to a production serving cluster and an agent sandbox—all in the same
              codebase—without changing infrastructure vendors.
