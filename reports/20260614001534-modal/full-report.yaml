  - id: FR002
    title: Risk transmission map — how Modal's primary risks flow into revenue, customer trust, and valuation
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how Modal's five root-cause risk clusters propagate through operational,
      competitive, regulatory, and governance pathways into downstream impacts on revenue durability and valuation.
      Edges represent causal or dependency relationships. Node descriptions are illustrative; directionality is
      approximate.
    data:
      nodes:
        - id: n-infra
          label: Infrastructure dependency
          description: >-
            100% asset-light GPU supply from AWS, GCP, OCI with no owned hardware buffer; NVIDIA CUDA checkpoint API
            technical dependency.
        - id: n-outage
          label: Outage cluster
          description: 3 major incidents in May–June 2026; no public SLA for Starter/Team customers.
        - id: n-valuation
          label: Valuation pressure
          description: $4.65B at 15.5x ARR; requires sustained hypergrowth and margin discipline.
        - id: n-competition
          label: Competitive pressure
          description: Hyperscaler bundling, CoreWeave scale, Fireworks AI, RunPod cost competition, Sandbox substitution risk.
        - id: n-regulatory
          label: Regulatory / legal exposure
          description: >-
            HIPAA BAA scope gap, EU AI Act GPAI chain, GDPR controller-processor split, FTC cloud competition
            monitoring.
        - id: n-reliability
          label: Reliability perception
          description: Developer and enterprise trust in Modal's production readiness; critical for Sandboxes use case.
        - id: n-revenue
          label: Revenue durability
          description: >-
            Consumption-based ARR; Sandbox concentration at 33%+; enterprise expansion dependent on NRR and SLA
            confidence.
        - id: n-margin
          label: Gross margin
          description: Spread between customer pricing and cloud-provider GPU costs; no public data; estimated 30–50%.
        - id: n-valuation-out
          label: Investment valuation outcome
          description: Realized exit multiple at IPO or M&A; sensitive to revenue durability, margin, and competitive position.
      edges:
        - from: n-infra
          to: n-outage
          label: AZ failure propagates
        - from: n-infra
          to: n-margin
          label: Cloud cost determines spread
        - from: n-outage
          to: n-reliability
          label: Incidents erode trust
        - from: n-competition
          to: n-margin
          label: Pricing pressure compresses spread
        - from: n-competition
          to: n-revenue
          label: Substitution reduces ARR
        - from: n-regulatory
          to: n-revenue
          label: Compliance gaps slow healthcare/EU sales
        - from: n-reliability
          to: n-revenue
          label: Trust drives expansion and retention
        - from: n-valuation
          to: n-revenue
          label: Growth expectation drives enterprise deal urgency
        - from: n-revenue
          to: n-valuation-out
          label: ARR × multiple = exit value
        - from: n-margin
          to: n-valuation-out
          label: Gross profit quality underpins premium multiple
    claimRefs:
      - CR009
      - CR012
      - CR017
      - CR024
      - CR026
      - CR029
      - CR036
