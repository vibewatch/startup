  - id: FE001
    title: Modal Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      Layered view of Modal's public architecture from developer interface through container execution to multi-cloud
      hardware and storage.
    data:
      layers:
        - id: layer-sdk
          label: Developer Interface (Python SDK)
          detail: >-
            @app.function(), @app.cls(), @modal.fastapi_endpoint, @modal.concurrent, @modal.enter/@modal.exit
            decorators; JS/TS and Go SDKs for Sandbox/Function calls. No YAML required.
          sublayers:
            - id: sdk-function
              label: Functions / Classes
              detail: Serverless GPU/CPU compute; lifecycle hooks; map/starmap for parallel fan-out.
            - id: sdk-sandbox
              label: Sandboxes
              detail: Ephemeral isolated containers for agent-generated or untrusted code; TCP tunnels; lifecycle events.
            - id: sdk-web
              label: Web Endpoints
              detail: >-
                @modal.fastapi_endpoint, ASGI, WSGI apps; custom domains; scale-to-zero with cold start managed by
                platform.
            - id: sdk-schedule
              label: Scheduled Functions
              detail: modal.Period / modal.Cron syntax; deploys alongside function definition.
        - id: layer-storage
          label: Storage Primitives
          detail: >-
            Volumes (distributed FS, up to 2.5 GB/s, write-once-read-many optimized), Dicts (KV store, cloudpickle),
            Queues (FIFO, multi-producer/consumer), Notebooks (GPU-backed interactive).
          sublayers:
            - id: storage-volumes
              label: Volumes
              detail: Distributed filesystem; multi-cloud backed; v2 is HIPAA-compliant.
            - id: storage-dicts
              label: Dicts
              detail: Distributed key-value; 100 MiB/object; 7-day TTL; distributed locks.
            - id: storage-queues
              label: Queues
              detail: FIFO; 24-hour TTL; 5,000 items per partition; 100,000 partitions.
        - id: layer-runtime
          label: Container Runtime
          detail: >-
            Rust-based worker runtime; gVisor kernel sandbox; Python Image builder (method-chain API); content-addressed
            multi-tier image filesystem cache (3-5x vs uncached).
          sublayers:
            - id: runtime-gvisor
              label: gVisor Isolation
              detail: Kernel sandbox; same technology as Google Cloud Run and GKE; automatic synthetic isolation monitoring.
            - id: runtime-snapshots
              label: Memory Snapshots
              detail: >-
                CPU snapshots (GA, 3-10x speedup); GPU snapshots (alpha, up to 10x speedup via CUDA checkpoint/restore
                API).
            - id: runtime-images
              label: Image Builder
              detail: Python-defined; no Dockerfile required; uv/pip install; add_local_dir.
        - id: layer-infra
          label: Multi-Cloud Infrastructure
          detail: >-
            AWS, GCP, Oracle Cloud Infrastructure; hundreds of data centers globally; cloud buffers of idle GPUs per
            type; automatic GPU upgrade paths (H100→H200, A100-40GB→A100-80GB).
          sublayers:
            - id: infra-gpu
              label: GPU Fleet
              detail: >-
                T4, L4, A10, L40S, A100-40GB, A100-80GB, H100, H200, B200, B200+ (B300 opt-in); up to 8 GPUs per
                container.
            - id: infra-regions
              label: Regions
              detail: >-
                Container regions (broad 1.5x, narrow 1.75x pricing); routing regions (us-east, us-west, eu-west,
                ap-south).
