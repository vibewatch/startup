      - number: '6.5'
        title: Platform breadth and use-case taxonomy
        blocks:
          - type: paragraph
            body: >-
              Modal's customer evidence spans eight distinct use-case categories—LLM inference serving, sandboxed code
              execution, RL training infrastructure, custom fine-tuning, audio/video/image generation, computational
              biology, batch processing, and robotic real-time inference—each demonstrated by at least one named
              production deployment. The breadth matters because it reduces the risk that Modal is dependent on a single
              workload type. Sandboxed code execution alone drives more than one-third of revenue per the Series C
              announcement, anchored by Lovable's AI app generation, Ramp's Inspect coding agent, Quora's Poe code
              interpreter, and Cognition's RL environment work. LLM inference is the second major category, covering
              Decagon's real-time voice model, Runway Characters' video model, Suno's music generation, and Reducto's
