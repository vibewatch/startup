      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at $4.65B; do not chase momentum pricing above this mark without diligence evidence
            body: >-
              Modal Labs has earned a track call by demonstrating exceptional growth ($300M ARR, 5x in 7 months), strong
              customer proof, and technical differentiation. But the 15.5x ARR multiple is stretched, three recent
              outages are a material risk signal, and complete opacity on gross margin and NRR prevents a buy call. The
              company is worth close attention; an upgrade to buy requires four data-room items: gross margin, NRR, cap
              table terms, and resolution of the Series B data conflict.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV023
              - CV044
          - type: callout
            title: Three outages in May–June 2026 signal reliability maturity gap that is abnormal at $300M ARR
            body: >-
              A Hacker News community post from June 3, 2026 documented three SEV-1-equivalent incidents: a May 7 AWS
              us1-az4 overheat, a May 19 undocumented incident, and a June 3 internal authentication system failure.
              These cluster in the same seven-week window as the company's Series C close and advertising of 5x revenue
              growth—a potential sign of growth outpacing infrastructure reliability investment. At 15.5x ARR, any
              sustained reliability deterioration would trigger multiple compression and customer churn before
              management could respond.
            calloutType: risk
            claimRefs:
              - CV019
              - CV021
              - CV022
              - CV023
          - type: callout
            title: Sandbox revenue exceeding one-third of total ARR is a structural re-rating catalyst if sustained
            body: >-
              Sandboxes were launched as an agent execution primitive in 2023 and grew to more than one-third of Modal's
              total revenue by the Series C in May 2026—reaching what Cognition's CEO described as millions of
              simultaneous Sandboxes for coding agents. If Sandbox revenue continues to grow faster than core compute
              (as the agentic workload wave is still in early stages), it transforms Modal's narrative from "premium GPU
              cloud" to "agentic infrastructure platform." That narrative shift would support moving closer to software
              multiples than infrastructure multiples, which is the bull case mechanism.
            calloutType: strength
            claimRefs:
              - CV003
              - CV004
              - CV005
