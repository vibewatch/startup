  - id: TV005
    title: Thesis-break and kill-criteria triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Outage recurrence
        - Two or more SEV-1 incidents within any 90-day window
        - Customer churn accelerates; reliability discount applied to multiple; NRR degrades
        - Reduce or exit position; reassess reliability diligence before adding exposure
      - - Gross margin below threshold
        - Gross margin evidence below 25% from any credible primary source
        - >-
          Asset-light premium is eliminated; multiple compresses to CoreWeave-like 4–5x; current mark implies $750M ARR
          needed to break even
        - Downgrade to avoid; current entry price is not defensible at commodity margins
      - - Revenue growth deceleration
        - YoY ARR growth below 80% as of Q4 2026 or Q1 2027 data
        - Multiple compress to 8–10x; $4.65B mark goes from base case to rich; down-round risk materializes
        - Do not increase position; evaluate exit or hedge
      - - Hyperscaler launch of competing serverless GPU product
        - AWS, GCP, or Azure launches a serverless GPU offering with comparable Python DX and cold-start performance
        - Modal's core differentiation (cold starts, developer experience) is undermined; addressable market contracts
        - Immediate exit or severe de-rating; timeline for exit compression to 2–3 years
      - - Departure of founding CEO
        - Erik Bernhardsson departure from CEO role without transparent succession plan
        - Technical leadership and product vision risk; customer confidence in roadmap at risk
        - Pause; evaluate successor and retention of technical leadership before next capital decision
    notes: >-
      Triggers are forward-looking judgments based on public evidence as of June 14, 2026; they represent conditions
      under which the current valuation thesis materially weakens rather than short-term trading signals.
