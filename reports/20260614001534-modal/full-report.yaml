      - number: '1.4'
        title: Product Scale, Customer Proof, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Modal's scale story has been substantially validated by a growing set of customer case studies retrieved
              from the fetched corpus. Reducto achieved a 3x reduction in P90 latency and scaled to over 1,000 GPUs in
              under an hour after migrating its 30+ model inference pipeline to Modal. Zencastr scaled to 1,500
              concurrent GPUs to process hundreds of years of podcast audio in days. Quora used Modal Sandboxes for safe
              code execution in its Poe AI chatbot platform, saving the equivalent of two engineers' ongoing
              infrastructure work. Substack migrated training and deployment for its entire ML portfolio (spam
              detection, recommendations, transcription, image generation) from AWS SageMaker to Modal. Applied
              Compute—a reinforcement learning company servicing DoorDash, Cognition, and Mercor—cited Modal as the only
              infrastructure option that provided the right primitives at every layer of the RL loop. The Series C blog
              additionally names Physical Intelligence (robot inference at 10–15 ms latency), Suno (millions of songs
              per day on thousands of GPUs), Cognition (millions of Sandboxes for coding agents), Decagon (p90 latency
              of 342 ms for natural customer conversations), and DoorDash (agentic commerce infrastructure) as active
              customers. The coding agents solutions page cites Lovable (tens of thousands of simultaneous app creation
              sessions) and Ramp (full-context background coding agent). The LLM solutions page cites Allen AI,
              Substack, and Reducto. Across these names, Modal has demonstrated production deployments in healthcare AI,
              robotic control, audio, document processing, code generation, agentic commerce, and social platforms. On
              the technical frontier, Modal published a detailed blog post in May 2026 describing four technologies that
              achieve sub-second GPU cold starts: cloud buffers of idle GPUs, a custom content-addressed container
              filesystem, CPU-side process checkpoint/restore, and CUDA checkpoint/restore. The company's own status
              page shows 90-day uptime of 99.946% for GPU functions and 99.938% for CPU functions as of June 14, 2026.
              An adverse operational note: a Hacker News post from June 3, 2026 cited a community user claiming three
              major outages in a single month (May 7, May 19, and June 3, 2026), with the June 3 incident described as
              an internal authentication system failure. This adverse signal is material for reliability diligence even
              though the status page shows high aggregate uptime percentages.
