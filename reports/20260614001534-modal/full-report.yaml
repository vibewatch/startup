        in publicly available sources as of June 2026.
      claimRefs:
        - CO014
  foundedDate: '2021-01-01'
  foundingLocation: New York City, NY, USA
  headquarters: New York City, NY, USA
  productSummary: >
    Modal sells serverless GPU and CPU compute charged per second with no infrastructure management, three commercial
    tiers (Starter free, Team $250/month, Enterprise custom), and a Python SDK as the primary developer surface. Its
    differentiated technical stack achieves sub-second GPU cold starts via GPU memory snapshotting (cloud buffers,
    content-addressed container filesystem, CPU checkpoint/restore, and CUDA checkpoint/restore). The Sandbox product —
    isolated containers for agent-generated code execution — has grown to more than one-third of total revenue,
    positioning Modal as agentic infrastructure beyond commodity GPU rental. AWS and GCP marketplace integrations reduce
    enterprise adoption friction by allowing customers to apply committed cloud spend to Modal.
  customerFocus: >
    AI-native software builders, ML engineering and platform teams, reinforcement learning companies, coding agent
    operators, and enterprise AI teams across healthcare, fintech, media, robotics, and computational biology. Entry is
    developer-led (free Starter tier), with expansion to Team and Enterprise tiers driven by concurrency limits,
    compliance requirements (HIPAA, SOC 2, Okta SSO), and volume commitment economics.
  businessModel: >
    Purely consumption-based: customers are billed per second of GPU and CPU compute, per GB/day of storage (Volumes),
    and per second of Sandbox execution — with no seat fees or token-metered charges. Revenue is generated across three
    plan tiers plus Enterprise contracts with volume discounts, embedded ML engineering services, and dedicated support.
    The Startup Program provides free credits to early-stage companies as a top-of-funnel acquisition channel.
  stage: Series C
  fundingStatus: >
