      - number: '5.4'
        title: Trust, Security, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Modal's trust posture is strong by late-stage private-company standards. The security documentation is
              specific: the worker runtime and storage infrastructure are written in Rust (a memory-safe language), all
              container workloads run inside gVisor, all public APIs use TLS 1.3, all user data is encrypted in transit
              and at rest, and automated synthetic monitoring continuously checks for network and application isolation
              within the runtime. SOC 2 Type II was achieved with no deviations found (audited January 2025) and Modal
              commits to annual renewal. HIPAA-compliant workloads are available on the Enterprise plan under a BAA,
              though Volumes v1, Images (excluding Filesystem/Directory Snapshots), and Memory Snapshots are currently
              excluded from BAA scope; Volumes v2 is in scope. A private bug-bounty program runs through HackerOne with
              a published severity SLA (Critical: 24 hours; High: 1 week; Medium: 1 month). Stripe handles payment
              processing under PCI Level 1 certification; Modal does not store credit card information. Corporate
              security controls include SSO IdP, phishing-resistant MFA, Secureframe MDM, and annual business continuity
              exercises. The trust portal at trust.modal.com provides access to compliance documents. On the other side
              of the ledger: the status page (June 14, 2026) shows 90-day uptime of 99.946% for GPU functions, 99.938%
              for CPU functions, 99.933% for Web endpoints, and 99.782% for Snapshot restores—all solid numbers.
              However, a Hacker News community post (June 3, 2026) documented three major operational incidents in a
              single month: May 7 (AWS AZ overheating, SEV 1), May 19 (no published incident report), and June 3
              (internal authentication system failure). The aggregate uptime statistics are consistent with brief
              outages of this type, but the clustering of three in one month is adverse signal. Modal has not disclosed
              a public contractual SLA for either its Standard or Team plans; enterprise SLA terms are available only
              under negotiated contracts. Diligence should request the SLA exhibits.
