  - id: FV002
    title: Valuation sensitivity — revenue required to justify $4.65B at selected comparable multiples
    type: bar
    layout: standard
    summary: >-
      At a 5x multiple (CoreWeave-style infrastructure), Modal would need $930M ARR to justify the Series C price; at
      15.5x (current implied), only $300M is required. The sensitivity shows how multiple selection dominates the
      analysis.
    data:
      items:
        - label: CoreWeave-like 4.5x
          value: 1033
          detail: Revenue required in USD millions to justify $4.65B at 4.5x ARR
        - label: Together AI-like 7.5x
          value: 620
          detail: Revenue required in USD millions to justify $4.65B at 7.5x ARR
        - label: Baseten-like 8.3x
          value: 560
          detail: Revenue required in USD millions to justify $4.65B at 8.3x ARR
        - label: Modal current 15.5x
          value: 300
          detail: Revenue at time of Series C close (May 2026), per company and Sacra
        - label: Fireworks proposed 18.75x
          value: 248
          detail: Revenue implied if Fireworks raises at $15B against $800M ARR
        - label: Datadog/Cloudflare-like 20x
          value: 233
          detail: Revenue required in USD millions if premium software multiples apply
    approximationNotes: >-
      Each bar divides the $4.65B Series C post-money by a selected comparable multiple; values are support thresholds
      based on estimates, not audited revenue. Fireworks proposed multiple is based on in-progress funding discussions
      reported by Sacra and may not close.
    claimRefs:
      - CV001
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
