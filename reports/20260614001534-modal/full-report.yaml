      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Modal's go-to-market is developer-led land-and-expand. The free Starter tier and $30/month of compute
              credits act as a top-of-funnel, lowering the barrier to trial for any Python developer. The upgrade path
              from Starter to Team ($250/month) is well-defined: teams outgrow concurrency limits (10 GPU slots on
              Starter vs. 50 on Team), need custom domains and static IPs, or require programmatic billing reports. The
              jump from Team to Enterprise is driven by compliance (HIPAA, Okta SSO, audit logs), SLA requirements,
              private engineering support, or volume commitment economics. The Startup Program adds a dedicated
              acquisition channel for high-growth companies, providing free GPU credits plus direct Modal engineering
              team access, creating brand affinity that could translate into paid conversion once startups scale.

              Public case studies function as the primary GTM proof rather than quantified conversion metrics. Substack
              migrated its entire ML portfolio from AWS SageMaker—a major, sticky AWS product—to Modal; Quora's Poe
              product uses Modal Sandboxes for safe code execution, saving what Quora estimates as the equivalent of two
              engineers' ongoing maintenance work. Applied Compute, which powers RL infrastructure for DoorDash,
              Cognition, and Mercor, cited Modal as the only platform providing the right primitives at every layer of
              the RL loop. Cognition's report of running millions of Sandboxes in parallel implies very high
              per-customer sandbox consumption volume. The developer-to-enterprise migration trajectory implicit in
              these case studies—startup-tier entry, production-scale usage, eventual enterprise upgrade—is consistent
              with a PLG-to-enterprise motion.

              No CAC, payback period, enterprise sales cycle length, NRR, or churn data are disclosed publicly. The best
              available proxy for GTM efficiency is the revenue-growth rate: from ~$119M ARR at end of 2025 to $300M+
              ARR by April 2026 (per Sacra), Modal appears to be growing faster than its own cost of customer
              acquisition could plausibly limit—suggesting either very low CAC in the developer-led channel or very high
              NRR from expanding accounts. Without cohort data, neither interpretation can be confirmed.
