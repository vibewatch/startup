      - number: '6.4'
        title: Concentration risk, adverse signals, and competitive pressure
        blocks:
          - type: paragraph
            body: >-
              The core concentration risk is not visible in the public record but inferred from its absence. Modal has
              not disclosed the revenue share of its top five or ten customers. Given that the case study library
              features a handful of very high-profile accounts running extremely large workloads (Lovable at 1 million
              sandboxes in 48 hours; Suno scaling to thousands of GPUs), it is plausible that a small cohort of
              hyperscale customers drives a disproportionate share of compute consumption. The platform's usage-based
              billing model means that any single large customer reducing workloads—whether due to model optimization,
              competitive switch, or business contraction—could create significant revenue variance. Sacra flags that
              hyperscaler competition (AWS, Google, Azure adding serverless GPU with scale-to-zero billing) may erode
              Modal's cost and cold-start advantages over time. DoorDash's May 2026 quote described its use of Claude
              Managed Agents on Modal as "evaluating," which reads as directional exploration rather than committed
              production spend, suggesting some named accounts are in earlier stages than the most mature case studies
              imply. The three outages documented in May–June 2026 represent an adverse signal: Hacker News user
              comments described the June 3 event as "the third major outage in a month," pointing to a reliability
              trend that could be a retention risk for latency-sensitive enterprise workloads. Modal's 99.86–99.95%
              uptime figures over 90 days are serviceable but not top-tier for mission-critical production systems. On
              switching cost: Modal benefits from Python-native ergonomics and low infrastructure overhead, but the
              open-model, open-runtime design means customers carry their models and code with them if they leave.
