  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing
        blocks:
          - type: paragraph
            body: >-
              Modal charges exclusively for compute usage; there are no per-seat, per-API-call, or token-metered fees.
              Three plan tiers set the commercial frame: Starter ($0/month) includes $30/month in free compute credits,
              three workspace seats, and 100 containers plus 10 GPU concurrencies; Team ($250/month) adds $100/month in
              credits, unlimited seats, 1,000 containers, 50 GPU concurrencies, custom domains, static IP proxy, and
              deployment rollbacks; Enterprise (custom pricing) adds volume discounts, higher GPU concurrency, embedded
              ML engineering services, private Slack support, audit logs, Okta SSO, and HIPAA compliance. CPU compute is
              billed at $0.00003942/core/second (approximately $2.37/core-hour) and memory at $0.00000672/GiB/second
              (approximately $0.024/GiB-hour). Modal's own pricing page illustrates the serverless-vs-traditional cost
              model with a representative example: a traditional cloud approach would cost $5,400 for 75 GPUs over 24
              hours at $3/GPU-hour, while Modal's serverless approach costs $4,740 by averaging 50 active GPUs at
              $3.95/GPU-hour—suggesting a modest per-unit premium offset by utilization improvement.

              Three distinct revenue surfaces exist beyond compute: Volumes (distributed file storage, billed per GB per
              day), Sandboxes (isolated execution containers for agent and untrusted code workloads, billed per second
              like Functions), and Notebooks (hosted Jupyter environments with serverless pricing and automatic idle
              shutdown). The Series C blog disclosed that Sandboxes now drive more than one-third of total revenue,
              making them the second-largest revenue line after compute Functions. This is a structurally important
              signal: it means Modal is not a pure GPU rental business but a platform where agent-execution
              infrastructure has independently become a nine-figure revenue line in under two years since launch.

              AWS and GCP marketplace integrations allow enterprise customers to apply committed cloud spend to Modal,
              which reduces adoption friction significantly for large accounts with existing commitments. A startup
              program offers free GPU credits to early-stage companies. The billing system is monthly with incremental
              charges for usage spikes; Team and Enterprise plans access a billing-report API for cost attribution
              across workspaces. Custom invoicing, international bank transfer, and split invoices are Enterprise-tier
              features, suggesting Modal has operational infrastructure for large deal mechanics. List pricing is the
              outer layer; actual enterprise economics depend on volume discounts, custom commitments, and support
              attachment rates—none of which are publicly disclosed.
