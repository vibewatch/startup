  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Modal's competitive market is the serverless AI compute and inference-as-a-service layer: the
              cloud-managed platform that packages, deploys, auto-scales, and meters GPU workloads without requiring the
              customer to provision, maintain, or reserve underlying hardware. Included spend encompasses serverless
              function execution fees (billed per second of CPU and GPU usage), managed inference endpoint charges,
              Sandbox execution for agentic code, Storage Volumes, network egress, and enterprise support contracts.
              Excluded spend includes raw model-weight costs, training dataset acquisition, application-layer
              development labor, data center capital expenditure, bare-metal colocation fees, and spend on
              general-purpose IaaS compute not dedicated to AI workloads.


              The status-quo substitutes a prospective Modal customer would consider fall into three categories. First,
              self-managed Kubernetes clusters backed by reserved GPU instances on AWS, GCP, or Azure: this approach
              demands DevOps staffing, capacity planning, multi-year financial commitments, and significant cluster
              management overhead, as illustrated by Suno's founders who explicitly cited the desire to avoid
              "three-year GPU reservations" and cluster management when choosing Modal. Second, specialist GPU clouds
              (RunPod, Lambda Labs) that provide raw GPU rental but no managed deployment stack, requiring customers to
              build their own container orchestration, auto-scaling logic, and observability on top. Third,
              hyperscaler-native managed AI services (AWS Bedrock, Google Vertex AI / Agent Platform, Azure Machine
              Learning) that offer managed inference but with less Python-first developer experience, more proprietary
              lock-in, and generally per-token rather than per-GPU-second pricing.


              Adjacent markets that Modal has explicitly entered but which are not the center of its monetization
              include: MLOps experiment tracking, LLM fine-tuning platforms, and developer agent sandboxes. Modal's GPU
              type range as of June 2026 spans from T4 and L4 (entry inference) through A10, A100 (40GB and 80GB), L40S,
              H100 (PCIe, SXM, NVL), H200, and B200 (Blackwell architecture) with an opt-in B200+ flag that also routes
              to B300 where available. This hardware range positions Modal to serve cost-optimized batch workloads (L4,
              L40S), mid-tier production inference (A100, L40S), and frontier model deployment (H100, H200, B200).
            claimRefs:
