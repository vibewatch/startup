  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Gross margin
        - COGS breakdown by GPU tier, storage, and Sandbox; gross margin percentage by product line
        - >-
          15.5x ARR is only defensible with gross margins above 35%; below 25% collapses the premium multiple to
          commodity range
        - Request financial statements in data room; cross-check with hyperscaler GPU pricing vs Modal list prices
      - - Revenue quality
        - NRR, cohort retention, top-10 customer concentration as percentage of ARR
        - 300% annualized growth could mask a small number of rapidly scaling accounts; durability is unknown
        - Request internal BI dashboard or cohort summary; benchmark against RunPod and Fireworks data where available
      - - Burn rate and runway
        - Monthly operating cash burn and current cash balance
        - $355M raise could be exhausted quickly if burn rate is high; capital adequacy cannot be confirmed without it
        - Request CFO-level financial disclosure; triangulate against headcount (undisclosed) and infrastructure costs
      - - Cap table and preference stack
        - Capitalization table, liquidation preference amounts, and participation rights by round
        - >-
          Accumulated preferences across seed, Series A ($16M), Series B ($87–$110M), and Series C ($355M) could
          materially impair common-equity economics
        - Attorney review in data room; compute waterfall at various exit multiples
      - - Series B discrepancy
        - Resolution of $87M (Sacra/Lux Capital lead) vs $110M (company blog/Redpoint lead) conflict
        - Unexplained funding-history conflict is a transparency risk and may indicate cap table complexity
        - Request capitalization table or Series B term sheet; ask company directly for explanation
      - - Headcount and unit economics
        - Total headcount, engineering vs GTM split, average contract value by tier, CAC payback period
        - At $300M ARR with undisclosed headcount, operating leverage is unknowable; unit economics cannot be assessed
        - Request internal staffing data; LinkedIn employee count provides rough proxy only
    notes: >-
      Diligence asks represent the minimum evidence required to upgrade from track to buy; each item can move the
      recommendation independently.
