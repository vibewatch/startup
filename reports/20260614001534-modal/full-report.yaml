  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track the Series C mark, resist momentum pricing beyond it'
        blocks:
          - type: paragraph
            body: >-
              Modal Labs priced its Series C at $355 million on a $4.65 billion post-money valuation on May 21, 2026.
              General Catalyst led alongside existing investors Redpoint Ventures, with Menlo Ventures, Bain Capital
              Ventures, and Accel joining as new investors. The round followed the company's disclosure that annualized
              revenue had surpassed $300 million and had grown fivefold since the October 2025 Series B. Sacra
              independently estimates Modal hit $300 million in annualized revenue in April 2026, up from approximately
              $119 million at the end of 2025—implying roughly 150% growth in five months, or above 300% annualized. The
              $4.65 billion post-money valuation divided by $300 million ARR equals 15.5x, squarely in the upper range
              of private AI infrastructure multiples as of mid-2026.

              The closed round is real, recent, and corroborated by the company's own blog post, the Sacra Modal Labs
              research report, the General Catalyst portfolio page, the Bain Capital Ventures portfolio page, and
              general investor commentary. That makes the $4.65 billion post-money a clean anchor. The harder question
              is whether public evidence supports the price as attractive, fair, or already stretched.

              The answer is stretched-but-defensible under one condition: that Modal's revenue growth continues at or
              near its current pace. The private comparable set places 15.5x at the upper end of the distribution:
              Baseten closed a $5 billion round in February 2026 at approximately 8.3x Sacra's $600 million ARR
              estimate; Together AI carried a $3.3 billion mark from February 2025 against roughly $1 billion in 2026
              run-rate, implying 3.3x; Fireworks AI was at approximately 5x ARR on its October 2025 Series C mark and is
              reportedly in talks at a much richer price. Modal's premium to that peer set is only defensible if its
              architectural lead (sub-second cold starts, Rust runtime, CUDA checkpoint) and its Sandbox traction (more
              than one-third of revenue) sustain growth above the peer median.

              The right posture is therefore track with medium confidence, high risk rating, and a stretched valuation
              stance. The company is worth close monitoring because the market is real, the product is differentiated,
              and the growth rate has been extraordinary. But investors should insist on the diligence listed at the end
              of this chapter before underwriting any step-up from the current mark.
