            body: >-
              Modal's disclosed customer set spans six recognizable archetypes. The largest visible cohort is AI-native
              software builders—companies whose products are themselves AI applications—where buyers are ML engineers
              and platform teams who need elastic GPU compute without managing clusters. Lovable ($75M ARR, AI app
              generation), Cognition (Devin coding agent), Decagon (voice AI), and Applied Compute (RL agent training
              for DoorDash and Cognition) all fall here. The second cohort is enterprise SaaS and fintech: Ramp
              (fintech, $10B+ GMV platform), Quora (Poe, 400M monthly unique visitors), and Blend (mortgage technology
              for hundreds of banking environments). The third cohort covers media and content platforms (Suno music
              generation, Runway video characters, Zencastr podcast AI), which experience highly variable GPU demand
              tied to consumer usage patterns. Computational biology (Chai Discovery drug design) and robotic AI
              (Physical Intelligence real-time inference) round out the named base. Sacra's 2026 analysis estimates
              Modal serves thousands of ML teams and cites Meta's Code World Models team as a notable logo. Across all
              segments, the buyer is typically an ML, platform-engineering, or applied-AI team that values Python-native
              ergonomics and instant scalability over lower-level control. The visible population is still predominantly
              AI-native startups and mid-size tech companies; traditional enterprise names outside fintech and banking
              are sparse in the public record, a gap that the Runway Characters announcement (Fortune 10 companies
