    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      How a developer or team moves from a local Python function or model to a production workload on Modal, with
      branches for inference, agent execution, and batch processing.
    data:
      nodes:
        - id: n1
          label: Local Python code
          detail: Developer writes Python functions with standard imports; no cloud config files required.
        - id: n2
          label: Add @app.function() decorator
          detail: Specify GPU type, memory, secrets, volumes, and concurrency inline in code; Image defined via method chain.
        - id: n3
          label: modal run / modal serve
          detail: '"modal run" runs function once; "modal serve" live-reloads on code changes; both create ephemeral apps.'
        - id: n4
          label: modal deploy
          detail: Deploys app persistently; creates stable web endpoints, scheduled functions, or long-lived Sandboxes.
        - id: n5
          label: Autoscaling inference endpoint
          detail: >-
            Web Endpoint or Function serves HTTP requests; containers scale from 0 to thousands; input concurrency for
            batching.
        - id: n6
          label: Batch / scheduled job
          detail: map()/starmap() fans out to thousands of containers in parallel; Cron/Period triggers scheduled execution.
        - id: n7
          label: Agent Sandbox execution
