      - number: '7.3'
        title: >-
          Partner and infrastructure dependency risk centers on GPU supply concentration and NVIDIA's evolving role as
          both supplier and competitor
        blocks:
          - type: paragraph
            body: >
              Modal operates a deliberately asset-light model: it does not own GPU hardware and instead aggregates
              capacity from AWS,

              GCP, and Oracle Cloud Infrastructure across hundreds of data centers globally. This architecture provides
              structural

              flexibility—no capital-intensive GPU procurement, no depreciation risk, ability to route to cheapest
              available hardware—but

              it concentrates existential dependency on three commercial counterparties whose pricing, allocation, and
              strategic priorities

              are not controlled by Modal. The AWS shared responsibility model is instructive: even for abstracted cloud
              services, the

              cloud provider controls infrastructure reliability and leaves configuration, patching, and security
              configuration to the

              customer. Modal occupies the same position relative to AWS, GCP, and OCI as a GPU intermediary that must
              accept upstream

              availability risk while marketing its own SLA to downstream customers.


              NVIDIA is the deepest single-point dependency in Modal's technical stack. Modal's GPU Memory Snapshots—the
              alpha-stage cold-

              start feature that achieves 10x speedups—depend on the CUDA checkpoint/restore API in specific NVIDIA
              driver branches (570/575).

              Any change to NVIDIA's driver API (whether through version updates, commercial restrictions, or the end of
              the checkpoint

              capability in driver maintenance) would break the most differentiated feature in Modal's cold-start
              architecture. The

              incompatibility with multi-GPU code and non-CUDA workloads (documented by Modal) further limits the risk
              mitigation surface.

              This is a technical dependency that is not currently mitigated by any publicly disclosed alternative.


              NVIDIA's competitive behavior adds a second dimension to the dependency risk. Sacra's Fireworks AI report
              identifies NVIDIA's

              acquisition of Lepton as a signal of NVIDIA's ambition to compete directly in the GPU cloud marketplace.
              If NVIDIA's

              strategic interests shift from enabling GPU aggregators to serving customers directly, Modal's supply
              relationship with the

              dominant GPU manufacturer becomes adversarial rather than symbiotic. CoreWeave's situation—where NVIDIA
              holds a $2B equity

              stake and provides a $6.3B take-or-pay GPU backstop—illustrates how NVIDIA can use preferential allocation
              to deepen

              relationships with capital-intensive data center operators at the potential expense of lighter-weight
              aggregation platforms.

              Modal's dependency on Oracle Cloud Infrastructure (OCI) as a third cloud provider—likely Oracle's GPU
              cloud expansion—adds

              concentration and counterparty risk from a less-established AI infrastructure provider relative to AWS and
              GCP.
