  - id: FV004
    title: Investment KPIs — IC-ready scoring across key dimensions
    type: kpi
    layout: standard
    summary: >-
      Modal scores well on market tailwind and product differentiation but significantly lower on economic transparency
      and valuation fairness at the current mark.
    data:
      items:
        - label: Market tailwind
          value: 8
          unit: /10
          detail: >-
            AI inference and agent execution markets are large, growing, and structurally supported by open-weight model
            adoption
        - label: Product differentiation
          value: 8
          unit: /10
          detail: >-
            GPU snapshotting, Rust runtime, and Sandbox primitive are technically genuine and validated by production
            deployments
        - label: Revenue proof
          value: 7
          unit: /10
          detail: >-
            $300M ARR corroborated by company and Sacra; fivefold growth is exceptional but the single independent
            estimate limits score
        - label: Economic profile
          value: 4
          unit: /10
          detail: >-
            Gross margin, NRR, burn rate, and CAC payback are all private; asset-light model has theoretical upside but
            unconfirmed
        - label: Governance and team
          value: 5
          unit: /10
          detail: >-
            Tier-1 founder in Erik Bernhardsson but two-founder-only governance with no disclosed board, CFO, or VP
            Sales
        - label: Risk-adjusted at $4.65B
          value: 4
          unit: /10
          detail: >-
            Three outages, opacity on economics, Sacra data conflict, and 15.5x ARR multiple combine to elevate risk
            rating
        - label: Evidence quality
          value: 5
          unit: /10
          detail: >-
            Sufficient for a ranged view; insufficient for a high-confidence buy call without private financial
            disclosure
    approximationNotes: >-
      Scores are directional IC-style judgments based on public evidence as of June 14, 2026; they reflect relative
      strength, not absolute calibration.
