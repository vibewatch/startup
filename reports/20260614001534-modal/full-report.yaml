      - number: '4.5'
        title: Financial verdict and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is more constructive than most infrastructure-company diligence files at this stage,
              but not underwriteable without private data. On the positive side, Modal has done something unusual: it
              voluntarily disclosed crossing $300M ARR and 5x growth since the prior round in a public announcement.
              That transparency, combined with Sacra's independent corroboration, gives the revenue claim a higher
              credibility weight than company-only assertions. The consumption-based model is well-suited to the AI
              workload category—consumption expands as customers deploy more models, add more agents, and grow their
              end-user base, creating a natural expansion loop that is already visible in the Sandbox segment growing
              from a product launch in 2023 to more than one-third of revenue by 2026. The customer roster is
              diversified across use cases with named production deployments at substantial scale.

              The asset-light supply model preserves cash that a GPU-owning competitor would consume on hardware, but it
              creates a gross-margin ceiling that is not publicly verifiable. The in-house technology moat—GPU
              snapshotting, custom filesystem, multi-cloud pooling—should support margin accretion relative to a pure
              pass-through operator, but the actual gross margin, COGS by line, and cloud procurement terms are all
              private. Until those are disclosed, the gap between $300M ARR and any profitability path is filled by
              assumption rather than evidence.

              The outage pattern is a material adverse signal that dilutes the reliability narrative. Three incidents in
              one month, including an internal authentication failure, suggest infrastructure maturity gaps that are
              uncommon at this ARR scale in a cloud infrastructure business. The aggregate uptime figures (99.946% for
              GPU functions) look adequate in isolation, but the incident clustering in May–June 2026 coincides with the
              very period the company was advertising 5x revenue growth—potentially indicating that operational scaling
              is lagging commercial growth.

              Capital adequacy is directionally positive—$355M is a large Series C for an infrastructure company—but
              cannot be confirmed without cash balance and burn disclosure. The 15.5x ARR valuation multiple is
              consistent with consensus AI-infrastructure multiples in mid-2026 but is high enough that any deceleration
              in growth would be repriced materially. The summary verdict: Modal's revenue quality is strong for a
              private company, its capital position is freshly funded, and its technology moat is credible. The
              diligence blockers are gross-margin opacity, burn-rate opacity, outage risk, and the governance/disclosure
              gaps documented in the Company Overview chapter. Full private-financials disclosure is the single most
              important gate to close before investment.
