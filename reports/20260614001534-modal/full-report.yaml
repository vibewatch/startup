      - number: '7.5'
        title: >-
          Key-person and governance risk is meaningful but manageable; explicit kill criteria anchor the investment
          thesis
        blocks:
          - type: paragraph
            body: >
              Modal's governance transparency is consistent with a founder-led Series C private company. Erik
              Bernhardsson is the sole

              publicly named executive—appearing in all Series C communications, product blogs, and press coverage.
              Akshat Bubna is

              confirmed as co-founder but his functional role and prior background are undisclosed in any public source.
              No other

              executives (CTO, CRO, CFO, VP Engineering, Head of Revenue) are named on the company website, LinkedIn
              leadership section,

              or in press coverage. The board of directors, committee structure, and investor control terms are entirely
              opaque publicly.

              This is standard for a late-stage private company in the current era but warrants diligence attention at a
              $4.65B valuation

              with $300M+ ARR and enterprise customers running production workloads.


              The key-person risk is real but partially mitigated by the nature of the product. Modal is an
              engineering-led platform

              with a large developer community (1.6M PyPI downloads in a single day, June 2026), open-source client, and
              deep technical

              moat in cold-start infrastructure. These assets do not disappear if Bernhardsson were unavailable for a
              period. The

              broader investor syndicate—General Catalyst, Redpoint, Menlo, Bain Capital Ventures, Accel—provides board
              representation

              and governance oversight that is not visible publicly but is standard for Series C investors. Modal does
              not publicly

              reference alignment with the NIST AI Risk Management Framework or other voluntary AI governance standards,
              which is an

              easily addressable gap for enterprise accounts with AI procurement policies.


              The thesis-break framework requires explicit criteria. Modal's investment case breaks if: (1) major outage
              frequency

              remains at three or more per quarter beyond Q2 2026, without public post-mortem evidence of root-cause
              remediation and

              SLA improvement; (2) ARR growth decelerates below 50% YoY without a corresponding improvement in gross
              margin;

              (3) a named enterprise customer (Sandboxes or Functions at scale) publicly migrates to a hyperscaler
              native solution,

              signaling pricing or compliance-driven substitution; (4) NVIDIA restricts or monetizes the CUDA
              checkpoint/restore API

              in a way that breaks GPU Memory Snapshots for existing customers; or (5) a regulatory enforcement action
              materially

              impairs Modal's ability to serve European or healthcare customers. Against these criteria, Modal's current
              capital position

              ($355M Series C, April/May 2026), SOC 2 posture, and developer adoption signal resilience—but the outage
              cluster and

              SLA gap require specific validation before the reliability component of the thesis can be closed.
