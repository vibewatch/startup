    Modal has earned a track call by demonstrating $300M ARR with 5x growth in seven months, a
    diversified high-quality customer roster, and a technically differentiated serverless platform
    with Sandbox revenue exceeding one-third of total ARR — but the 15.5x ARR multiple is stretched,
