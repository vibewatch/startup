companyProfile:
  summary: >
    Modal Labs, Inc. is a New York City-headquartered serverless AI infrastructure company founded
    approximately in 2021 by Erik Bernhardsson and Akshat Bubna. The company operates as a production
    cloud for AI, delivering a Python-first platform that abstracts GPU and CPU compute across AWS, GCP,
    and Oracle Cloud without requiring customers to manage infrastructure. Core products include
    Functions (serverless GPU/CPU compute), Sandboxes (isolated containers for agent-executed and
    LLM-generated code), Training (fine-tuning and multi-node jobs), Volumes (high-performance mutable
    storage), Web Endpoints, and GPU Notebooks. Modal disclosed surpassing $300M in annualized revenue
    and growing fivefold since its October 2025 Series B at the time of its May 2026 Series C close
    ($355M at $4.65B post-money, co-led by General Catalyst and Redpoint Ventures). Sandboxes now drive
    more than one-third of total revenue, making Modal a platform business beyond pure GPU rental.
    Named customers include Cognition, Physical Intelligence, DoorDash, Suno, Ramp, Quora (Poe),
    Substack, Lovable, Reducto, and Applied Compute.
  founders:
    - name: Erik Bernhardsson
      role: Co-Founder, CEO
      background: >-
        Publicly announced Modal in December 2022; known in the ML engineering community as creator of
