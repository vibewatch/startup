      - number: '4.3'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              Modal 采用轻资产供给模型：它聚合 AWS、GCP、Oracle Cloud Infrastructure 等多家云厂商的 GPU 容量，而不是直接购买或融资持有 GPU 硬件。因此，Modal
              的成本结构主要是可变成本，随客户计算消耗扩张。没有自有 GPU 资产，Modal 避开了重资本折旧和供应链风险，但也带来结构性的毛利率上限：Modal 的实际毛利来自客户支付价格与云厂商向 Modal
              收取计算费用之间的价差。Series C 博文称，Modal 在全球「数百个数据中心」做多云池化，目的在于利用区域容量差异、降低闲置成本；但 Modal 与每家 hyperscaler 谈到的采购折扣没有披露。

              自研技术层——定制 Rust 容器运行时、内容寻址分布式文件系统、CPU checkpoint/restore、GPU memory snapshotting——是结构性降本机制。按
              truly-serverless-gpus 博文和 Series C 博文，GPU snapshotting 将冷启动改善 40–100x；这意味着相比需要 30–60 秒冷启动的平台，Modal 可以用更少闲置
              GPU 秒数承接突发工作负载。对收入成本的影响很实在：如果客户工作负载呈突发模式，Modal 即使支付同样的原始基础设施费率，也能比那些在预热上浪费更多 GPU 秒的平台维持更高的整体 GPU
              利用率。这是一个直接支撑毛利的效率护城河，即便标价与竞争对手相近。

              定价侧，RunPod 公开 GPU cloud 费率与 Modal 示例定价对比显示，serverless 溢价温和。RunPod 列出的 H100 SXM 为 $3.29/hr、A100 SXM 为
              $1.49/hr；Modal 定价页示例意味着其 serverless pool 约 $3.95/GPU-hr。这个溢价与自动扩缩容、亚秒级冷启动、托管基础设施开销的价值相符。AWS EC2 GPU
              实例标价（on-demand p4d.24xlarge，8x A100）明显高于原始 GPU clouds，使 Modal 在托管云层级具备竞争力，而不是与原始算力租赁正面竞争。

              Modal 没有公开毛利率、COGS 拆分或云采购条款。覆盖可比 infrastructure-as-a-service 公司的独立分析师估算显示，拥有专有效率技术的轻资产 GPU 聚合商可实现 30–50%
              毛利率，但这个区间尚未在 Modal 身上得到验证。Sacra 收入估算（2026 年 4 月 ARR $300M）和 Series C 估值（$4.65B）意味着 15.5x ARR
              倍数，这与高增长基础设施公司相符，但没有解决毛利率问题——如果毛利率只有 30%，15.5x ARR 对应约 50x 毛利润倍数，要求很高。
