      - - Training
        - 用 GPU 集群微调或训练模型的 ML 工程师
        - GA / 正扩展到多节点
        - 托管 GPU 训练作业；多节点并配 RDMA 网络（据 Sacra）；可分发到池化容量
        - 训练和推理使用同一 SDK，消除供应商交接；checkpoint 可直接进入 serving
        - 本轮无法访问专门的训练文档页；多节点 / RDMA 成熟度尚未完全公开
      - - Volumes
        - 存储模型权重、数据集和 pipeline 输出的工程师
        - GA（v2，HIPAA 范围扩展）
        - 分布式文件系统，针对一次写入、多次读取优化；由多云支撑以实现高可用；带宽最高 2.5 GB/s
        - 默认分布式运行，不需要管理副本；已与 Modal Functions 和 Sandboxes 集成；v2 符合 HIPAA
        - v1 Volumes 不在 HIPAA BAA 范围内；按日计费快照意味着删除最多需要 4 天才会反映到账单
      - - Web Endpoints
        - 用 Modal Functions 承接 HTTP 流量的 API 和应用开发者
        - GA / 成熟 Web 服务层
        - 通过 @modal.fastapi_endpoint 或 @modal.asgi_app，把 FastAPI、ASGI、WSGI 应用或简单 Python 函数暴露为公开 HTTPS 端点
        - 平台托管冷启动并支持缩至零；Team 计划可用自定义域名
        - Web endpoints 没有公开合同式 uptime；90 天状态显示 99.933%
      - - Notebooks
        - 做探索式 / 协作式计算的 ML 工程师和研究人员
        - GA（2025 年推出，支持 GPU memory snapshot）
        - 浏览器协作式 notebooks，可挂任意 GPU；GPU memory snapshots 可将启动时间最多缩短 10x
        - GPU 支撑的协作 notebooks，冷启动速度接近 serverless Functions；适配任意 ML 框架
        - Memory Snapshots 不在当前 HIPAA BAA 范围内，限制了受监管研究环境的使用
      - - Dicts
        - 在 modal Functions 或 Sandboxes 间共享分布式状态的工程师
        - GA / 工具型原语
        - 分布式键值存储，任意位置可访问；cloudpickle 序列化；分布式锁
        - 任意容器或 SDK 调用都可访问；可与其他 Modal 原语无缝组合
        - 100 MiB/object 上限和 7 天不活跃 TTL；不保证持久化（建议用于小对象）
      - - Queues
        - 构建异步流水线、fan-out 工作流和生产者 / 消费者模式的工程师
        - GA / 工具型原语
        - 多生产者、多消费者 FIFO 队列，按字符串 key 分区；支持同步 / 异步访问；24 小时 TTL
        - 云原生替代 Redis/Celery 队列，不需要管基础设施；可与 Functions 搭配做异步 fan-out
        - 24 小时 TTL 意味着队列不适合持久消息保存；每个分区 5,000 个 item
      - - Scheduled Functions
        - 运行基于时间的 jobs 或 pipelines 的工程师
