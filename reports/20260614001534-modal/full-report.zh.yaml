      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Modal 披露的客户群和案例语料显示出五类清晰买方画像。AI 原生产品公司（Suno、Decagon、Lovable）的买方是工程或产品负责人；他们从自助 Starter 或 Team
              层起步，只看开发体验和伸缩表现，通常停留在用量计费。智能体编码平台建设者（Cognition、Ramp、Lovable）需要 Modal 的 Sandbox
              产品来做隔离容器执行；买方是工程或平台团队，工作负载天然突发且对延迟敏感。机器人和 physical AI 研究实验室（Physical Intelligence）需要极低延迟 GPU 推理（引用为 10–15
              ms），价格敏感度较低；买方通常是研究或 ML 基础设施负责人。企业 ML 平台团队（DoorDash、Substack）已把现有 ML 流水线从 AWS SageMaker
              或内部管理集群迁移出来；买方从工程扩展到中央平台或 IT 预算，合规、可靠性和 SLA 保证变成选择标准。RL/研究计算团队（Applied Compute，服务
              DoorDash、Cognition、Mercor）需要完整 RL 计算栈——环境、策略、奖励和数据——在规模化并行中运行；买方是研究或应用 ML 团队。


              预算所有者生命周期通常从产品或工程开始（开发者用个人或团队信用卡试用 Modal），生产工作负载确定后升级为部门预算分配，企业规模下再迁移到中央平台或 IT 预算。Modal 的定价层（Starter
              $0，含每月 $30 免费 GPU 额度和 10 个 GPU 并发；Team 每月 $250，50 个 GPU 并发；Enterprise 定制定价）设计上就是支撑从 PLG
              到企业的漏斗，并尽量减少每一阶段的摩擦。


              截至 2026 年 6 月，Modal 24+ 个文档化示例展示了支持工作负载的广度：LLM 推理（OpenAI 兼容端点）、蛋白质折叠、编码智能体、图像生成、批量 whisper
              转写、视频生成、音乐生成、RAG 流水线和科学计算。规模限制（标准工作负载每个函数 2,000 个 pending inputs、25,000 个 total inputs；async .spawn() 作业可达
              1 million 个 pending inputs）界定了企业买方必须核验的运营参数。
