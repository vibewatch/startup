  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承保的影响
      - 精确尽调路径
    rows:
      - - 按产品线划分的毛利率（Compute、Sandboxes、Storage、Notebooks）
        - 无法判断 $300M ARR 对应的是 30% 还是 60% 毛利；差异会影响数十亿美元内在价值。
        - 索取过去四个季度经审计的产品级 P&L，并按云供应商和 GPU 家族拆分 COGS。
      - - 云供应商采购条款、承诺支出和预留容量义务
        - GPU 转嫁成本是最大 COGS 项；未披露的采购折扣决定毛利率下限。
        - 审查所有云供应商协议（AWS、GCP、Oracle），包括 committed-use 合同、reserved-instance 持有量和 spot-instance 组合。
      - - 月度 burn rate 和现金余额
        - 资本充足性只是被声称，未被证明；runway 可从 24 个月到 60+ 个月不等，取决于 burn。
        - 提供当前非受限现金、过去 6 个月净 burn（含基础设施付款）和 12 个月情景 runway 模型。
      - - 客户集中度（前 10 大占 ARR 百分比）和 NRR
        - 收入质量取决于增长是广泛分布，还是集中在 2–3 家超大云 / agents 公司；NRR 决定扩张循环是否真实。
        - 提供前 20 大客户收入表、按 cohort 年份划分的 dollar NRR，以及过去四个季度的 logo churn。
      - - 按获客渠道划分的 CAC 和回本周期
