  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开定价
        blocks:
          - type: paragraph
            body: >-
              Modal 只对计算使用量收费；没有按席位、按 API 调用或按 token 计量的费用。三档计划构成商业框架：Starter（$0/month）含 $30/month 免费计算额度、三个 workspace
              seats、100 个 containers 和 10 个 GPU concurrencies；Team（$250/month）增加 $100/month 额度、无限 seats、1,000 个
              containers、50 个 GPU concurrencies、自定义域名、static IP proxy 和 deployment rollbacks；Enterprise（定制定价）增加用量折扣、更高
              GPU concurrency、嵌入式 ML 工程服务、private Slack 支持、audit logs、Okta SSO 和 HIPAA 合规。CPU 计算按
              $0.00003942/core/second（约 $2.37/core-hour）计费，内存按 $0.00000672/GiB/second（约 $0.024/GiB-hour）计费。Modal
              自家定价页用代表性例子说明无服务器与传统成本模型：传统云方案中，75 张 GPU 运行 24 小时、按 $3/GPU-hour 计算，成本为 $5,400；Modal 无服务器方案平均使用 50 张活跃
              GPU、按 $3.95/GPU-hour 计算，成本为 $4,740——说明单价小幅溢价可由利用率改善抵消。

              计算之外还有三条不同收入界面：Volumes（分布式文件存储，按 GB/天计费）、Sandboxes（用于智能体和不受信任代码工作负载的隔离执行容器，像 Functions 一样按秒计费），以及
              Notebooks（托管 Jupyter 环境，采用无服务器定价和自动空闲关闭）。Series C 博文披露，Sandboxes 目前贡献总收入超过三分之一，是 compute Functions
              之后第二大收入线。这是结构性重要信号：它意味着 Modal 不是纯 GPU 租赁业务，而是一个平台；智能体执行基础设施在推出不到两年内，已经独立成长为九位数收入线。

              AWS 和 GCP marketplace 集成让企业客户可把承诺云支出用于 Modal，显著降低已有承诺的大客户采用阻力。Startup program 向早期公司提供免费 GPU
              额度。计费系统按月结算，并对使用峰值追加收费；Team 和 Enterprise 计划可访问 billing-report API，用于跨 workspace 成本归因。定制发票、国际银行转账和拆分发票是
              Enterprise 层功能，说明 Modal 已具备支持大额交易机制的运营基础设施。标价只是外层；真实企业经济性取决于用量折扣、定制承诺和支持附加率——这些均未公开披露。
