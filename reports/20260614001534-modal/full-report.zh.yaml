  - id: FV003
    title: 估值 / 回报区间——Modal 情景带
    type: range
    layout: standard
    summary: $4.65B 的 Series C 估值稳稳落在基准情景内；从这里继续上调，需要收入和倍数都按牛市假设兑现。
    data:
      items:
        - label: 熊市情景
          low: 1.4
          mid: 2.4
          high: 3.5
          unit: USD bn
        - label: 基准情景
          low: 5.4
          mid: 7.2
          high: 9.75
          unit: USD bn
        - label: 牛市情景
          low: 9.75
          mid: 12.5
          high: 18
          unit: USD bn
        - label: 已完成 Series C
          low: 4.65
          mid: 4.65
          high: 4.65
          unit: USD bn
    approximationNotes: >-
      情景带来自 ARR 增长预测，以及 TV004 中私有可比公司集合推导的倍数区间；熊市 / 基准 / 牛市 ARR 区间分别为 $200–$330M、$450–$650M 和 $650M–$1.0B；适用倍数分别为
      7–10x（熊市）、12–15x（基准）、15–18x（牛市）。所有数字都是方向性分析师估计。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI——面向 IC 的关键维度评分
    type: kpi
    layout: standard
    summary: Modal 在市场顺风和产品差异化上得分较高，但当前标记估值下，经济透明度和估值公允性明显偏低。
    data:
      items:
        - label: 市场顺风
          value: 8
          unit: /10
          detail: AI 推理和 agent 执行市场规模大、还在增长，并且由开放权重模型采用提供结构性支撑
        - label: 产品差异化
          value: 8
          unit: /10
          detail: GPU snapshotting、Rust runtime 和 Sandbox 原语确有技术含量，并已通过生产部署验证
        - label: 收入证据
          value: 7
          unit: /10
          detail: $300M ARR 获公司和 Sacra 佐证；五倍增长很突出，但单一独立估计限制评分
        - label: 经济画像
          value: 4
          unit: /10
          detail: 毛利率、NRR、烧钱速度和 CAC 回收期均未公开；轻资产模型理论上有上行空间，但尚未确认
        - label: 治理与团队
          value: 5
          unit: /10
          detail: Erik Bernhardsson 是一线创始人，但治理仅披露两名创始人，没有披露董事会、CFO 或销售 VP
        - label: $4.65B 下的风险调整
          value: 4
          unit: /10
          detail: 三起故障、经济数据不透明、Sacra 数据冲突和 15.5x ARR 倍数叠加，推高风险评级
        - label: 证据质量
          value: 5
          unit: /10
          detail: 足以形成区间判断；若没有私有财务披露，不足以支持高信心买入结论
    approximationNotes: 评分是截至 2026 年 6 月 14 日基于公开证据的 IC 式方向性判断；反映相对强弱，不是绝对校准。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV015
      - CV021
      - CV022
      - CV023
      - CV044
