  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：跟踪 Series C 定价；没有尽调证据，不追逐更高动量价格
        blocks:
          - type: paragraph
            body: >-
              Modal Labs 于 2026 年 5 月 21 日完成 $355 million Series C，投后估值 $4.65 billion。General Catalyst 领投，老股东 Redpoint
              Ventures 共同参与，Menlo Ventures、Bain Capital Ventures 和 Accel 作为新投资人加入。融资前，公司披露年化收入已超过 $300 million，较 2025 年
              10 月 Series B 增长五倍。Sacra 独立估算，Modal 2026 年 4 月年化收入达到 $300 million，高于 2025 年底约 $119 million——意味着五个月约 150%
              增长，年化超过 300%。$4.65 billion 投后估值除以 $300 million ARR，为 15.5x，正落在 2026 年中私有 AI 基础设施倍数的上沿。

              这一轮已经关闭，时间很近，并得到公司博客、Sacra Modal Labs 研究报告、General Catalyst 投资组合页、Bain Capital Ventures
              投资组合页和一般投资人评论的交叉印证。因此，$4.65 billion 投后估值是干净锚点。更难的问题是，公开证据是否支持这个价格仍有吸引力、只是公允，还是已经偏贵。

              答案是：偏贵但有条件可辩护——前提是 Modal 的收入增长继续维持在当前或接近当前速度。私有可比公司显示，15.5x 已在分布上沿：Baseten 2026 年 2 月一轮融资估值 $5 billion，按
              Sacra 的 $600 million ARR 估算约 8.3x；Together AI 2025 年 2 月估值 $3.3 billion，对应 2026 年约 $1 billion run-rate，隐含
              3.3x；Fireworks AI 2025 年 10 月 Series C 约为 5x ARR，据报正在谈更高价格。Modal 相对这组同行的溢价，只有在架构领先（亚秒级冷启动、Rust
              runtime、CUDA checkpoint）和 Sandbox 牵引力（收入超过三分之一）能支撑高于同行中位数的增长时才站得住。

              因此，正确姿态是跟踪：中等置信度、高风险评级、估值偏贵。公司值得密切关注，因为市场真实、产品有差异化、增长速度异常强劲。但在为当前估值之上的任何上调买单前，投资人应坚持完成本章末尾列出的尽调。
