  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 数值 / 公开 proxy
      - 可信度
      - 重要性
      - 尽调问题
    rows:
      - - 已公开计费单位
        - 按秒计算（CPU、GPU、内存）；按 GB-day 存储；月度方案费
        - 高
        - 显示 Modal 以极细粒度变现用量，能最大化捕获突发型工作负载收入。
        - 提供按产品线划分的计费单位收益率，以及按方案层级划分的平均发票金额。
      - - 收入增速（公开说法）
        - 自 2025 年 10 月 Series B 以来增长 5 倍；从约 $119M ARR（2025 年 12 月）到 $300M ARR（2026 年 4 月）
        - 中 — 公司说法加 Sacra 佐证；未经审计
        - 意味着五个月增长约 150%；若能持续，业务复合增速快到 CAC 很难构成可信约束。
        - 提供过去 12 个月的月度 ARR cohort 数据，以及新增与扩张收入拆分。
      - - Sandbox 收入占比
        - '>1/3 的总收入，来自 Series C 博客披露（2026 年 5 月）'
        - 中 — 公司披露；未独立验证
        - 推出不到三年即成为第二大产品线；说明平台宽度降低单一产品集中风险。
        - 提供过去四个季度 Sandbox 收入趋势。
      - - GPU 成本与标价（proxy）
        - RunPod H100 SXM：$3.29/hr；Modal 定价页示例：serverless 约 $3.95/GPU-hr
        - 中 — 公开标价对比；不是 Modal 实际 COGS
        - 相对低成本 GPU 云只有约 20% 标价溢价；若采购折扣存在，说明仍有一定毛利空间。
        - 提供按供应商和 GPU 类型划分的实际 GPU 采购费率，以及按 GPU 家族划分的毛利率。
      - - 毛利率
        - 未公开披露；可比的轻资产 GPU 聚合商估计为 30–50%（分析师区间，未针对 Modal 验证）
        - 低 — 仅为估计
        - 毛利率决定 $300M ARR 是否能转化为有意义的盈利贡献。
        - 提供经审计或管理层报告的按产品线毛利率。
      - - CAC / 回本周期
        - 未披露；PLG 模型意味着 CAC 较低，但没有公开转化或回本数据
        - 低
        - 开发者驱动模型的 CAC 效率决定增长是否资本高效。
        - 提供按获客渠道划分的 CAC、各 cohort 的收入转化用时、以及按方案层级划分的回本周期。
      - - NRR / 流失
        - 未披露；ARR 快速增长意味着净留存强，但缺少 cohort 拆分
        - 低
        - NRR 高于 100% 将证实扩张收入 thesis；流失低于 5% 将验证可靠性感知。
        - 提供 logo 和 dollar churn、按 cohort 年份划分的 NRR、以及客户集中度（前 10 大占 ARR 百分比）。
      - - 人效
        - ~$300M ARR / ~120–180 名员工 = 每员工 ~$1.67M–$2.5M ARR
        - 中 — 两组数字都是估计或公司声称
        - ARR/员工比在私有基础设施公司中居前；说明运营模型精简，符合 PLG。
        - 提供确认后的员工数，以及 R&D/G&A/S&M 拆分。
    notes: 没有公开来源披露 Modal 的毛利率、CAC、NRR 或流失；所有估计都来自标价对比、ARR 披露和分析师估算等 proxy。
