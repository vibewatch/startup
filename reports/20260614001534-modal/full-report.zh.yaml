      - number: '4.5'
        title: 财务结论与披露缺口
        blocks:
          - type: paragraph
            body: >-
              与同阶段多数基础设施公司尽调文件相比，财务结论更偏建设性；但没有私有数据，仍无法承销。正面看，Modal 做了一件不寻常的事：在公开公告中自愿披露 ARR 突破 $300M，并称较上一轮增长 5x。这种透明度叠加
              Sacra 的独立验证，让收入声明比单纯公司自述更可信。按用量计费的模型很适合 AI 工作负载类别——客户部署更多模型、增加更多 agents、扩大终端用户基础时，消耗自然扩张，形成天然扩张循环；Sandbox
              分部已从 2023 年产品发布成长到 2026 年贡献超过三分之一收入，说明这种循环已经可见。客户名单覆盖多类用例，并有具名生产部署达到相当规模。

              轻资产供给模型保留了本会被自持 GPU 竞争对手花在硬件上的现金，但也制造了一个外界无法验证的毛利率天花板。自研技术护城河——GPU
              snapshotting、定制文件系统、多云池化——应当能让毛利相对纯转售运营商改善，但实际毛利率、逐项 COGS 和云采购条款都没有公开。披露前，$300M ARR
              与任何盈利路径之间的空白只能靠假设填补，而不是证据。

              宕机模式是一个实质负面信号，削弱了可靠性叙事。一个月三次事件，包括一次内部认证故障，提示基础设施成熟度存在缺口；对这个 ARR 规模的云基础设施公司来说并不常见。整体 uptime 数字（GPU
              functions 99.946%）单看足够，但 2026 年 5–6 月事故聚集，正好与公司宣传收入增长 5x 的时期重合——可能说明运营扩张落后于商业增长。

              资本充足性方向上为正——$355M 对基础设施公司的 Series C 来说金额很大——但没有现金余额和 burn 披露，无法确认。15.5x ARR 估值倍数与 2026 年中市场共识中的 AI
              infrastructure 倍数相符，但足够高，任何增长降速都会引发实质重估。总结结论是：作为私有公司，Modal 的收入质量强，资本位置刚刚补足，技术护城河可信。尽调阻断项是毛利率不透明、burn rate
              不透明、宕机风险，以及「公司概览」章节记录的治理 / 披露缺口。投资前，完整私有财务披露是最重要的一道关。
