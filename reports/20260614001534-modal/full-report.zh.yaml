      - number: '8.4'
        title: 四个尽调闸门决定跟踪还是买入；论点只能靠证据推进
        blocks:
          - type: paragraph
            body: >-
              投资判断可以从跟踪升级为买入，不需要额外经营改善，只需要披露证据。四项尽调最关键。第一，毛利率：在 15.5x ARR 倍数下，投资人隐含支付的是软件化经济性。如果 Modal 实际 GPU compute
              毛利率只有 20–30%（类似原始云聚合商），这个倍数非常吃紧。如果毛利率为 40–55%（类似 Cloudflare 或 Datadog
              的云交付经济性），倍数就更可支撑。两端差距足以翻转结论：这个单一数据点最直接决定是否买入。Hostfleet 矩阵中最低成本的 serverless GPU 提供商 RunPod，据 Sacra 称毛利率在
              60% 中段至 70% 高段，说明轻资产 GPU 中介可以做到软件化经济性——但那是一家收入规模低得多、业务组合不同的公司。

              第二，收入质量。公司披露了 $300 million ARR 和 5x 增长，但没有公布 cohort 数据、NRR 或 churn。300%
              年化增速可能来自少数超大交易（集中度风险），也可能来自广泛的开发者驱动扩张（若开发者初次使用后流失，则有 NRR 风险）。没有 NRR，$300 million ARR
              的耐久性仍未定。第三，股权结构和清算优先权。$4.65 billion 投后估值是标题，但真实投资人经济性取决于 seed、Series A、Series B 和 Series C 累积的优先权堆栈——四轮合计约
              $465 million 一级资本。以 $4.65 billion 入场的投资人，必须先建模瀑布分配，才能说入口价格有吸引力。第四，Series B 差异：Sacra 报告称 2025 年 9 月由 Lux
              Capital 领投的 $87 million Series B，估值 $1.1 billion；而 Modal 自己的博客写的是 $110 million，并列出 Redpoint 和 Sutter Hill
              Ventures 为领投方。公开可得来源都没有解释这一冲突，它构成透明度缺口，必须在正式 data room 里解决。

              当前估值之上的任何跟投，都应由四个破坏论点的触发器卡住：六个月内再发生一次重大故障；毛利率证据低于 20%；到 2026 年 Q4 收入同比增速跌破 80%；或 Erik Bernhardsson 离任
              CEO。公司值得密切跟踪，因为增长率真实、客户名单质量高、产品确有技术差异化。但任何从跟踪升级为买入的动作，都需要证据，而不是外推。
