    title: 论文破裂与否决标准触发项
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 宕机复发
        - 任意 90 天窗口内发生两起或更多 SEV-1 事故
        - 客户流失加速；倍数被施加可靠性折扣；NRR 恶化
        - 降低或退出仓位；增加暴露前重新评估可靠性尽调
      - - 毛利率低于阈值
        - 任何可信一手来源显示毛利率低于 25%
        - 轻资产溢价消失；倍数压缩至 CoreWeave 式 4–5x；当前标记需要 $750M ARR 才能打平
        - 下调至回避；在商品化利润率下，当前入场价站不住
      - - 收入增长降速
        - 截至 2026 年 Q4 或 2027 年 Q1 数据，ARR 同比增长低于 80%
        - 倍数压缩至 8–10x；$4.65B 标记从基准情景变成偏贵；down-round 风险兑现
        - 不增加仓位；评估退出或对冲
      - - 超大云推出竞争性 serverless GPU 产品
        - AWS、GCP 或 Azure 推出具备类似 Python DX 和冷启动表现的 serverless GPU 产品
        - Modal 的核心差异化（冷启动、开发者体验）被削弱；可服务市场收缩
        - 立即退出或严重下调估值；退出压缩时间线缩至 2–3 年
      - - 创始 CEO 离任
        - Erik Bernhardsson 在没有透明继任计划的情况下离开 CEO 职位
        - 技术领导力和产品愿景承压；客户对路线图的信心受损
        - 暂停；下一次资本决策前评估继任者和技术领导层留存
    notes: 触发项是基于截至 2026 年 6 月 14 日公开证据的前瞻判断；它们代表当前估值论点会显著走弱的条件，而非短期交易信号。
    claimRefs:
      - CV019
      - CV021
