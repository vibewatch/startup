  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    notes: 触发项设计为可按季度监测节奏观察。所有阈值均假设投资人在投资前尽调中已确认基线可靠性和增长指标。
    rows:
      - - 运营可靠性——宕机集群复发
        - 跟踪 status.modal.com 的月度事故数量和严重性；索取每起 SEV 1 事件的事后复盘报告
        - 单季度发生三起或更多重大事故且未发布根因修复；或任一单次事故导致 GPU 函数不可用超过 4 小时
        - 暂停投资；升级尽调要求，审查基础设施架构和事后复盘库；考虑在企业条款中加入 SLA 托管
      - - SLA 缺口——非 Enterprise 合同保护缺失
        - 监测 Starter 或 Team 计划是否发布 SLA；跟踪任何 SLA 政策变更公开公告
        - Series C 部署后非 Enterprise 计划仍未发布 SLA（预期 12 个月内应出现）
        - 将含自定义 SLA 的企业 MSA 作为任何生产部署的前置条件；将其标记为开发者大众市场变现的负面信号
      - - HIPAA / 受监管工作负载合规——BAA 范围扩展
        - 跟踪 trust.modal.com 和安全文档页面的 BAA 范围更新；每年索取更新版 BAA 附件
        - GPU Memory Snapshots 在 GA 后超过 24 个月仍被排除在 BAA 范围外；无法为受监管医疗客户提供自定义 BAA 扩展
        - 下调医疗垂直 TAM 估算；在受监管企业销售中，将 HIPAA 合规标记为营销走在合同前面的风险
      - - ARR 增长降速——超高增长放缓
        - Sacra 季度 ARR 估算；Modal 的任何公开披露；二级市场估值信号；新增企业客户公告
        - ARR 同比增长低于 50%（相较 7 个月 5x 的节奏）；或 Sandbox 收入占比从三分之一下降且 Functions 增长未能抵消
        - 重新承销财务模型；下调目标倍数；在尽调中索取 pipeline 可见度和客户 cohort 数据
      - - 超大云替代——具名客户流失
        - 监测客户公告流、媒体报道，以及 AWS Bedrock AgentCore、GCP Vertex AI、Azure AI Foundry 针对 Modal 邻近功能的产品发布提醒
        - >-
          任何具名 Modal 参考客户（Suno、Cognition、Physical Intelligence、Ramp、Applied Compute）公开宣布迁移至超大云原生 serverless GPU 或
          Sandbox 等价产品
        - 论文破裂事件；停止增加仓位规模；触发对 Modal 暴露的完整组合复盘；要求管理层就竞争应对进行紧急说明
