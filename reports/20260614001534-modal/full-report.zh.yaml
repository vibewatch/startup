  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - Compute Functions（CPU + GPU）
        - 所有容器执行（CPU 和 GPU）按秒计费
        - CPU：$0.00003942/core/sec；Memory：$0.00000672/GiB/sec；GPU：按秒市场价
        - 核心收入界面；准确 GPU 层级定价可在定价页（wayback）获得
        - 计费单位可信度高；按 GPU 类型的实际收益率可信度低
        - 提供按 GPU 类型划分的收入组合、平均实际成交价与标价对比、以及按 GPU 家族划分的毛利率。
      - - Sandboxes
        - 隔离容器环境按秒计费；计算定价结构与 Functions 相同
        - 按秒；同 CPU/内存/GPU 费率
        - '>1/3 的总收入，来自 Series C 博客（2026 年 5 月）；增长最快的产品线'
        - 披露可信度高；利润率细节可信度低
        - 提供 Sandbox 收入轨迹、平均会话时长，以及 GPU Sandboxes 是否有不同利润率。
      - - Storage（Volumes 和 Buckets）
        - Volume 快照按 GB 每日计费；定价页提到按 GB 费率
        - 每 GB 每日
        - 定价页列出；可访问归档未披露费率
        - 低
        - 提供 storage 收入占 ARR 比例、每客户平均 GB、以及毛利率。
      - - Notebooks
        - 基于浏览器的托管 Jupyter，采用 serverless 定价并自动闲置关停
        - 按秒（同计算费率）
        - 近期推出；产品页在线；收入贡献未知
        - 低
        - 提供 Notebooks 激活和付费转化、平均会话时长、以及收入贡献。
      - - Team 方案订阅
        - $250/月的经常性平台费，独立于计算用量
        - 每 workspace $250/月
        - 定价页确认标价；workspace 数量和付费方案挂载率未知
        - 标价可信度中；实际组合可信度低
        - 提供 Team-plan workspace 数量、订阅产生的月度经常性收入，以及从 Starter 升级的比例。
      - - Enterprise 方案（定制）
        - 定制定价，包括量级折扣、嵌入式工程、更高并发、合规功能
        - 定制合同
        - 公开营销；未披露合同价值、最低承诺或 ACV 数据
        - 低
        - 提供 Enterprise ACV 分布、最低计算承诺、支持服务挂载率和续约行为。
      - - Startup credits 计划
        - 向早期初创公司提供免费计算额度；获客渠道；随增长转付费
        - 补贴型
        - 计划已上线；披露为获客工具；无转化数据
        - 低
        - 提供 startup cohort 转化率和首次付费发票用时指标。
    notes: 公开证据清楚确认了计费界面和单位；产品级收入组合以及高于标价之外的实际定价未公开披露。
