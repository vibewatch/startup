      - number: '6.3'
        title: 留存、耐久性与扩张信号
        blocks:
          - type: paragraph
            body: >-
              留存证据方向为正，但结构上不完整。正面看，至少两个具名账户（Ramp 和 Quora）有记录显示 multi-product expansion：Ramp 从 fine-tuning 走到完整 Inspect
              coding agent platform，Quora 从 model deployment infrastructure 扩展到 Poe code interpreter 的完整 Sandbox
              采用。Lovable 创始人明确称 Modal 是他们「trust to keep up with growth」的伙伴，这种语言更像高承诺意图，而非短期评估。平台的结构性 land-and-expand
              动作可见：客户通常从一个工作负载开始（fine-tuning job、batch pipeline、single inference
              endpoint），随规模扩大再增加产品（Sandboxes、Volumes、Queues、multi-node clusters）。多个案例显示客户从拼接式 AWS 或 Kubernetes
              环境迁出且没有回头，说明高 switching costs 来自开发者体验，而非技术锁定。耐久性缺口在于，Modal 没有在本轮审阅的任何公开 filing、press release 或 interview
              中披露 NRR、GRR、contract duration、average revenue per account、cohort retention 或 top-customer revenue
              concentration 数据。这意味着扩张信号仍是 anecdotal，不能外推到全量客户账本。可靠性风险真实存在：Hacker News 记录、状态页确认的 2026 年 5–6
              月三次独立宕机，提出了企业客户是否经历 SLA breaches、事后是否发生 churn 的问题。
