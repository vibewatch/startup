      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Modal 的 GTM 走的是开发者自助进入、用量扩张后再上企业版的路径。免费的 Starter 档和每月 $30 计算额度负责拉开漏斗，让任何 Python 开发者都能低门槛试用。从 Starter 升到
              Team（$250/month）的触发点很清楚：团队碰到并发上限（Starter 10 个 GPU slot，Team 50 个），需要自定义域名和静态 IP，或需要程序化账单报表。从 Team 跳到
              Enterprise，则主要由合规（HIPAA、Okta SSO、审计日志）、SLA 要求、专属工程支持，或批量承诺带来的经济性驱动。Startup Program 又给高增长公司单独开了一条获客通道，提供免费
              GPU 额度和 Modal 工程团队直连；这种早期品牌亲近感，可能在创业公司放大后转成付费。

              公开案例承担了主要 GTM 证明功能，而不是量化转化率指标。Substack 把整套 ML 组合从 AWS SageMaker——一个重要且粘性很强的 AWS 产品——迁到 Modal；Quora 的 Poe 用
              Modal Sandboxes 做安全代码执行，Quora 估算由此省下了相当于两名工程师的持续维护工作。为 DoorDash、Cognition、Mercor 提供 RL 基础设施的 Applied
              Compute 称，Modal 是唯一在 RL loop 每一层都给出合适 primitives 的平台。Cognition 报告并行运行数百万个 Sandboxes，意味着单客户 sandbox
              消耗量极高。这些案例隐含的开发者到企业迁移轨迹——从创业公司档进入、生产规模使用、最终升级企业版——符合 PLG 转企业销售的动作。

              Modal 没有公开 CAC、回收期、企业销售周期长度、NRR 或流失数据。GTM 效率最好的可用代理指标是收入增速：按 Sacra，ARR 从 2025 年底约 $119M 增至 2026 年 4 月
              $300M+，Modal 的增长速度看起来快到不太可能被获客成本约束；这指向两种可能：开发者自助渠道 CAC 很低，或存量账户扩张带来很高 NRR。没有 cohort 数据，两种解释都无法确认。
