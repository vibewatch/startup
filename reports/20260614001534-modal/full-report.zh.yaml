  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流理解的产品表面
        blocks:
          - type: paragraph
            body: >-
              Modal 把自己定位为围绕单一心智模型构建的「production cloud for AI」：任何 Python function 加一个 decorator，就能变成可自动扩缩、由 GPU 支撑的
              cloud job。按客户工作流看，产品覆盖四类使用模式。第一，交互式和探索式计算：Notebooks 让 ML 工程师几秒内拉起带 GPU 的浏览器 notebook，`modal shell` 命令可把
              debug shell 直接接到运行中的容器。第二，批处理和定时任务：Functions 通过 `map()`、`starmap()`、`for_each()` 在数千个容器中并行 fan
              out，`modal.Cron`/`modal.Period` 则无需外部调度器即可处理基于时间的触发。第三，服务化和实时推理：Web Endpoints 通过
              `@modal.fastapi_endpoint`、ASGI 或 WSGI apps，把任意 function 暴露为公开 HTTPS endpoint；`@modal.concurrent` 提供 input
              concurrency，支持 LLM serving 的 continuous batching。第四，agent 和不可信代码执行：Sandboxes 是临时隔离容器，接收任意代码（来自 LLM 或用户），在
              gVisor 隔离下执行，并返回 stdout/stderr——Lovable 用它支持数万场同时进行的 app 创建 session，Cognition 为 coding agents 运行了数百万个
              Sandboxes。Storage 也是一等公民：Volumes（高性能分布式文件系统）、Dicts（分布式 key-value）和 Queues（FIFO、多生产者 / 消费者）补齐了
              primitives。统一 SDK 意味着团队可以在同一套 codebase 里，从单 function 原型，走到生产 serving cluster，再走到 agent
              sandbox，无需更换基础设施供应商。
