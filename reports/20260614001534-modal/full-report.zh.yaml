  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险有边界，但需尽调 HIPAA 范围和 EU AI Act 合规链条
        blocks:
          - type: paragraph
            body: >
              在 late-stage 私有基础设施公司中，Modal 的法律与监管姿态算是更透明的一类。公司把完整 Data Processing Agreement 嵌入服务条款（2025 年 10 月生效），补齐
              GDPR Article 28 下 controller-processor 关系，并在 trust.modal.com/subprocessors 列出 subprocessor list。DPA 的
              Technical and Organizational Measures 表承诺静态加密、访问控制、年度 SOC 2 Type II 续审和每日客户数据备份。不过关键在于，DPA 把
              legal-basis、notice 和 consent 义务放在作为 data controller 的客户身上，而不是 Modal 身上；这意味着受监管部署即便 Modal
              的基础设施栈完全合规，客户侧仍需要自己的 GDPR compliance programs。这种 shared-responsibility split 在云服务中很常见，但 healthcare 或
              financial services 的企业买方常常低估它。


              HIPAA 方面，Modal 安全文档明确把 Volumes v1、Memory Snapshots 和 Images（不含 Filesystem and Directory Snapshots）列在 BAA
              范围之外。这个限制很重要：GPU Memory Snapshots 是 Modal 最差异化的冷启动能力，HIPAA 排除意味着医疗客户如果使用这一能力，就无法在不承担 PHI exposure
              风险的情况下获得支撑 Modal 性能溢价的功能。因此，BAA-eligible surface 比产品营销暗示的更窄；在承销受监管工作负载前，尽调必须确认定制 Enterprise 合同是否扩大 BAA 范围。


              EU AI Act（Regulation 2024/1689）已于 2024 年 8 月 1 日生效，并将在 2026 年 8 月 2 日全面适用。GPAI model governance rules 要求
              general-purpose AI models 的 providers 提供技术文档、训练数据透明度和版权合规，这些规则已于 2025 年 8 月 2 日适用。Modal 不是 GPAI model
              provider，但其企业客户中若有 GPAI providers（fine-tuning open models、serving Llama variants、building downstream
              products），可能需要满足 AI Act 文档要求，并把要求向上游传导到基础设施供应商。这给 Modal 带来间接合规负担：企业采购周期可能拉长，因为客户会要求 Modal
              提供文档、subprocessor lists 和 data residency confirmations，以满足自身 AI Act filing requirements。2026 年 5 月 7 日 AI
              omnibus political agreement 将部分 high-risk AI system rules 延至 2027 年 12 月，但没有推迟已经生效的 GPAI obligations。截至
              2026 年 6 月 14 日，任何公开可得来源均未发现针对 Modal Labs, Inc. 的 active litigation、enforcement action 或 regulatory
              investigation。
