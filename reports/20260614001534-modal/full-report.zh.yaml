  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 开发者或团队如何把本地 Python 函数或模型迁移到 Modal 上的生产工作负载，并分流到推理、智能体执行和批处理。
    data:
      nodes:
        - id: n1
          label: 本地 Python 代码
          detail: 开发者用标准 imports 写 Python 函数；不需要云配置文件。
        - id: n2
          label: 添加 @app.function() 装饰器
          detail: 在代码中内联指定 GPU 类型、内存、secrets、volumes 和并发；Image 通过方法链定义。
        - id: n3
          label: modal run / modal serve 命令
          detail: '"modal run" 运行一次函数；"modal serve" 在代码变更时热重载；两者都会创建临时 app。'
        - id: n4
          label: modal deploy
          detail: 持久部署 app；创建稳定的 web endpoints、定时函数或长生命周期 Sandboxes。
        - id: n5
          label: 自动扩缩容推理端点
          detail: Web Endpoint 或 Function 服务 HTTP 请求；容器从 0 扩到数千个；输入并发用于 batching。
        - id: n6
          label: 批处理 / 定时任务
          detail: map()/starmap() 并行扇出到数千个容器；Cron/Period 触发定时执行。
        - id: n7
          label: 智能体 Sandbox 执行
          detail: Sandbox.create() 在运行时拉起 gVisor 容器；接收任意代码；返回输出；生命周期事件用于监控。
        - id: n8
          label: 训练 / 微调任务
          detail: GPU 训练函数；支持多节点；从 checkpoint 到已部署推理端点有直接路径。
        - id: n9
          label: 观察与调试
          detail: 实时日志流式传到终端；modal shell 将调试 shell 连接到运行中的容器；dashboard 展示指标。
