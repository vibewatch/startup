      - number: '7.2'
        title: 运营与可靠性风险是本章最关键发现：一个月三次重大宕机，且没有公开 SLA
        blocks:
          - type: paragraph
            body: >
              Modal 的整体 uptime 统计扎实：状态页（2026 年 6 月 14 日）显示，过去 90 天 GPU functions uptime 为 99.946%，CPU functions 为
              99.938%，Web endpoints 为 99.933%，Snapshot restores 为 99.782%，Sandboxes 为 99.861%。这些数字符合生产级基础设施，不应轻视。但产生这些
              downtime minutes 的事故形态，是实质尽调信号。2026 年 6 月 3 日 Hacker News 帖子记录一个月内三次重大宕机：5 月 7 日 SEV 1（AWS availability
              zone us1-az4 overheating）、5 月 19 日一次没有公开 post-mortem 的事件，以及 6 月 3 日事件——一次与 GPU hardware 或 cloud-provider
              availability 无关的内部认证系统故障。30 天内三起事件聚集，提出了一个问题：Modal 的可靠性基础设施是否跟上了约 12 个月内从约 $60M ARR 增至 $300M ARR 的收入增长。


              6 月 3 日认证系统故障作为信号尤其负面：它暴露了一个 central control-plane dependency，而 Modal 的多云 GPU pooling 并不能直接缓解这个依赖。5 月 7 日
              AWS AZ overheating 则说明，即便采用多云架构，单一区域故障仍会传播到进行中的客户工作负载。两个 failure modes 合在一起，说明 Modal
              的冗余架构也许更擅长防止容量短缺，而不是吸收突发 AZ-level events 或 control-plane faults。


              SLA 缺口进一步放大运营风险。Modal 没有为 Starter 或 Team 客户——其用户基础的大多数——发布 contractual uptime commitment。Enterprise SLA
              条款私下谈判，公开不可得。这意味着大多数 Modal 客户对 2026 年 5–6 月三次宕机没有合同救济。Modal 确实有实质缓释措施：SOC 2 Type II 且无偏差（2025 年 1 月审计）、私有
              HackerOne bug bounty program、gVisor container isolation、Rust-based container runtime、所有 public APIs 使用 TLS
              1.3，以及 automated synthetic monitoring。这些保护是真实的。但非 Enterprise 客户没有公开 SLA，再加上宕机集群，意味着在通过事故根因和 post-mortem
              cadence 尽调确认前，运营风险应排在 severity ranking 顶部。
