  - id: TE003
    title: 技术 / 运行架构表
    columns:
      - 层 / 组件
      - 角色
      - 关键技术细节
      - 依赖
      - 风险
    rows:
      - - Python SDK / decorator 层
        - 开发者界面；把 decorated Python functions 转成 Modal App objects
        - '@app.function、@app.cls、@modal.enter、@modal.exit、@modal.fastapi_endpoint、@modal.concurrent；不需要 YAML'
        - Python 3.10-3.14；开源 client（modal-labs/modal-client）
        - SDK 任何 breaking change 都要求下游开发者改代码；2026 年 6 月为 v1.5.0
      - - 容器镜像构建器
        - 把 Python Image definitions 转成分发给 workers 的 container images
        - 从 Image.debian_slim() 开始链式调用；pip/uv install；Dockerfile fallback；add_local_dir 放本地代码
        - Modal 控制的 build infrastructure；底层 cloud provider storage
        - Image build 90 天 uptime 为 99.863%；image build 失败会阻断 deployments
      - - gVisor 容器运行时
        - 为 Functions 和 Sandboxes 提供 OS 级隔离；GKE 和 Cloud Run 使用的 kernel sandbox
        - 每个 container 都在 gVisor 下运行；自动 synthetic monitoring 检查 network/application isolation
        - Google 维护的 gVisor project；NVIDIA CUDA driver 兼容性可能限制未来 GPU 功能
        - gVisor 对新 CUDA 功能的兼容性需要 driver certification testing
      - - Rust worker 运行时
        - 执行 container lifecycle，处理 network I/O，并与 storage layer 协调
        - memory-safe 实现提升安全性；处理 TLS、gRPC 和 container IPC
        - Modal 内部专有组件
        - 核心专有组件；外部可审计性有限
      - - 自定义内容寻址容器文件系统
        - 从多层 cache（worker memory → cluster → storage）提供 image layers；降低冷启动
        - 文件按 content-addressed 管理；热门文件（torch 等）缓存在 worker memory；比未缓存快 3-5x
        - 多云对象存储（AWS S3、GCP GCS、Oracle）
        - Cache 效果取决于文件热度分布；新 image builds 初期可能 cold-start 更慢
      - - CPU Memory Snapshots
        - 捕获首次请求前的 container memory state；冷启动时恢复，跳过重新初始化
        - 捕获 Python imports、JIT compilation results；冷启动快 3-10x；与 @modal.enter(snap=True) 集成
        - Cloudpickle-compatible serialization；Modal distributed filesystem 用于 snapshot storage
        - 不在 HIPAA BAA 范围内；与 snapshot 阶段的 stateful I/O 不兼容
      - - GPU Memory Snapshots（alpha，GPU 内存快照）
        - 将 CPU snapshots 扩展到捕获 GPU device memory、CUDA kernels、streams 和 memory mappings
        - 使用 NVIDIA CUDA checkpoint/restore API（driver 570/575 branches）；cuCheckpointProcessCheckpoint()；冷启动最多降低 10x
        - NVIDIA driver compatibility 要求；目前为 alpha 状态
        - 不兼容 multi-GPU 和非 CUDA code；torch.compile 交互需要 workarounds
      - - 多云容量池
        - 将每个 GPU request 路由到 AWS、GCP、Oracle 中可用硬件；用户不需要预留
        - 各 GPU 类型维持闲置 GPUs 的 cloud buffers；自动升级路径（H100→H200、A100→A100-80GB）
        - AWS、GCP、Oracle Cloud Infrastructure；Sacra 提到 Oracle partnership
        - Cloud provider outages 会直接影响 capacity（5 月 7 日 SEV1：AWS AZ overheating）；incident history 可见 single-AZ failures
      - - 密钥管理
        - 把 credentials 作为环境变量注入 containers，不写入 images
        - Dashboard、CLI 和 Python API 可创建 / 更新 / 删除；每个 Function 可挂多个 Secrets；key-value limit 32KB
        - Modal 控制的 secret storage；Dependabot-audited dependencies
        - 公开文档未提到 HSM 或专用 secret-store 集成
    notes: >-
      架构细节来自截至 2026-06-14 的 Modal 官方文档和工程博客。Rust runtime 与 content-addressed filesystem 架构由 Sacra analyst research 和
      Modal 自身技术博客确认。
