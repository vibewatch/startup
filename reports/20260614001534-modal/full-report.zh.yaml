      - number: '3.3'
        title: 定价、分发与切换成本
        blocks:
          - type: paragraph
            body: >-
              Modal 采用用量计费（按 GPU/CPU 计算秒数），并有三档计划：Starter（$0 基础费、每月 $30 免费 GPU 额度、10 个 GPU 并发）、Team（每月 $250 外加计算费用、50 个
              GPU 并发）和 Enterprise（定制）。Beam Cloud 的无服务器定价大致可比：RTX 4090 为 $0.000192/second，A10G 为 $0.000292/second，CPU 为
              $0.0000528/core/second。Banana.dev 收取每月 $1,200 Team 固定费，加按成本计算（声称零加价）。RunPod 的 L40S 在 Secure Cloud 上被引用为
              $0.86/hr（第 2 章证据），显著低于 Modal 的托管等价产品——这是主要的成本底部压力点。CoreWeave 的 H200 NVL72 按需价格为 $42.00/hr（8-GPU
              配置），目标是大型模型训练，而非按请求推理。AWS Bedrock 对开放模型访问提供比按需价格低 50% 的批量推理，为已承诺 AWS 支出的企业提供折扣路径。Together AI 的按 token
              定价（例如 DeepSeek V4 Pro 每 1M 输入 tokens $2.10）面向不同的单位经济层——token 级计费，而非 GPU 秒计费。Hyperscalers 通过云承诺计划（AWS
              Enterprise Discount Programs、GCP Committed Use Discounts、Azure MACC）主导企业分发，把 AI 计算打包进既有合同。Modal 通过与主要云供应商的
              marketplace 集成部分缓解这一点，让企业能使用既有承诺支出、减少采购摩擦；Sacra 分析确认了这一策略。该市场切换成本中等。Modal 的 Python SDK
              装饰器模式造成工作流层锁定：将大型代码库从 `@modal.function()` 装饰器迁移到替代方案，需要不小的重构。不过，底层模型权重、Docker
              容器标准和推理框架（vLLM、TensorRT-LLM）可迁移，客户可以跨平台 multi-home。RunPod 明确宣传无锁定。Baseten 的 Truss
              框架产生另一种打包锁定，需要格式迁移。最深的锁定存在于现状替代方案：已建设 Kubernetes GPU 基础设施的企业，常被多年 devops 投入、定制监控、IAM 集成和供应商关系锚住。Modal
              最好的销售动作，是销售维护那套基础设施的成本，而非直接正面价格竞争。
