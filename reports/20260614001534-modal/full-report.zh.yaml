      nodes:
        - id: developer-demand
          label: 开发者工作负载
          detail: ML 推理、智能体执行、训练任务、批处理和 notebook 会话。
          tone: neutral
        - id: functions
          label: Functions（CPU + GPU）
          detail: 核心计算表面；容器化工作负载按秒计费。
          tone: positive
        - id: sandboxes
          label: Sandboxes
          detail: 面向智能体和不可信代码的隔离容器；披露为收入的 >1/3。
          tone: positive
        - id: storage
          label: Volumes 和 Buckets
          detail: 分布式文件存储；按 GB-day 计费。
          tone: positive
        - id: notebooks
          label: Notebooks
          detail: 托管 Jupyter，支持 GPU 访问和闲置关停定价。
          tone: positive
        - id: metering
          label: 按秒计量
          detail: 聚合计算、存储和沙箱表面的使用量；按 App/tag 归因。
          tone: neutral
        - id: plan-fee
          label: 方案订阅费
          detail: Starter（$0/mo）、Team（$250/mo）、Enterprise（定制）叠加在计算之上。
