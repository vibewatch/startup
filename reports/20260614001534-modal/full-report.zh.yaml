    type: dag
    layout: wide
    summary: Modal 平台依赖的关键外部依赖和内部组件；突出单一供应商风险集中点和合规范围边界。
    data:
      nodes:
        - id: d-clouds
          label: 云 GPU 提供商
          detail: AWS、GCP、Oracle Cloud Infrastructure；闲置 GPU 的云缓冲；自动升级路径；Oracle 合作用于定价。
        - id: d-nvidia
          label: NVIDIA CUDA 驱动
          detail: GPU Memory Snapshots 需要 NVIDIA driver 570/575 分支来支持 cuCheckpointProcessCheckpoint()；B200+ 需要 CUDA 13.0+。
        - id: d-gvisor
          label: gVisor（Google）
          detail: Google 维护的开源内核沙箱；Modal 用它隔离所有 Function 和 Sandbox；兼容性必须跟上 gVisor 版本。
        - id: d-rust-runtime
          label: Modal Rust runtime（专有）
          detail: Worker runtime 和存储基础设施；内存安全；核心专有组件；不开源。
        - id: d-fs
          label: 自定义内容寻址 FS
          detail: Modal 专有的多层 image 文件系统；worker memory → cluster cache → object storage；对冷启动快 3-5x 至关重要。
        - id: d-stripe
          label: Stripe（支付）
          detail: PCI Level 1 支付处理商；Modal 不存储银行卡数据；Stripe SaaS 依赖。
        - id: d-sentry
          label: 可观测性（Datadog、Sentry）
          detail: 日志和指标提供商；安全文档中提到；运营足迹里的外部 SaaS 依赖。
        - id: d-hackerone
          label: HackerOne（漏洞赏金）
          detail: 私有漏洞赏金计划；仅邀请制；研究员可通过 security@modal.com 获取访问权限。
        - id: d-platform
          label: Modal 平台
          detail: 交付给客户的核心产品；依赖所有上游节点。
      edges:
        - from: d-clouds
          to: d-platform
          label: GPU 容量
        - from: d-nvidia
          to: d-platform
          label: CUDA 快照能力
        - from: d-gvisor
          to: d-platform
          label: 容器隔离
        - from: d-rust-runtime
          to: d-platform
          label: 执行引擎
        - from: d-fs
          to: d-platform
          label: 快速容器 FS
        - from: d-stripe
          to: d-platform
          label: 支付处理
        - from: d-sentry
          to: d-platform
          label: 可观测性
        - from: d-hackerone
          to: d-platform
          label: 安全研究
    claimRefs:
