        - RunPod FlashBoot 声称 worker 启动低于 200ms；Google Cloud Run L4 GPU 5 秒启动；Azure Container Apps 容器亚秒级启动
        - 中 — RunPod 拉近差距，但没有达到 GPU 级内存快照深度；超大云厂商受限于 L4
        - 核实 RunPod FlashBoot 是已加载模型还是仅启动 worker；用相同模型权重对 Modal、RunPod、GCR 做冷启动基准测试
      - - Python 原生 SDK 易用性（@app.function 装饰器）
        - Suno CTO 称：「你只需要知道，可以用几行 Python 在云端扩展函数调用」；并提到零配置文件
        - Beam Cloud 提供 Python-first SDK，装饰器模式相似；未来超大云厂商 DX 也可能改进
        - 低-中 — Beam Cloud 还早、规模更小；Modal 的 SDK 成熟度和文档深度构成切换成本
        - 跟踪 Beam Cloud SDK 使用量和 HN 开发者情绪；评估 Beam Cloud 到 2026 年能否在 AI 工程师社区获得牵引力
      - - 多云 GPU 池化（AWS + GCP + Oracle）
        - Sacra 确认 Oracle Cloud Infrastructure 合作带来定价弹性；Modal 文档确认多云调度
        - Baseten 和 Beam Cloud 都提供多云或 BYOC 选项；超大云原生选项天然是单云池化
        - 中 — Baseten 的自托管和 BYOC 比 Modal 仅托管的多云模式更适合企业
        - 确认 Oracle 合作条款和 GPU 分配保障；评估前 10 大企业客户是否需要 BYOC
      - - 企业客户锁定（Python SDK 工作流耦合）
        - Applied Compute、Cognition、Lovable 被列为深度集成用户；Sandboxes 支撑数百万个 coding agent 环境
        - 模型权重、容器和推理框架（vLLM、TRT-LLM）都可迁移；这个市场结构上容易多家部署
        - 中 — 工作流层面的锁定存在，但数据可迁移性仍完整；成熟企业会双供应
        - 跟踪 12 个月续约时的客户 NPS 和流失；识别已经与 RunPod 或 Baseten 多家部署的账户
      - - Series C 资本（$355M）延长 runway，并增加 GPU 合作资源
        - 2026 年 5 月确认以 $4.65B 估值融资，投资方包括 General Catalyst、Redpoint、Menlo、Bain、Accel
        - CoreWeave 拥有数十亿美元合同；Baseten 已融资 $585M；超大云厂商资产负债表近乎无限
        - 低 — Modal 在这一阶段资本位置很强；超大云厂商的财务优势是结构性的，不是近期风险
        - 审查资本配置计划：GPU 预留承诺、R&D 人员、企业销售产能
      - - $300M+ ARR 增速（Series B 到 Series C 增长 5 倍）
        - Sacra 估计 2026 年 4 月 ARR 为 $300M；公司称自 Series B 以来增长「五倍」
        - 收入集中在 AI-native 初创公司（Suno、Cognition）会带来流失风险，一旦这些客户放缓支出；公司声称的 ARR 未经审计
        - 中 — 集中度风险真实存在；没有独立收入验证
        - 用经审计收入或客户级使用数据验证 ARR；评估前 10 大客户收入集中度
      - - 与受监管行业竞争对手相比，合规存在缺口
        - >-
          Lambda AI 持有 ISO 27001/ISO 27017/ISO 27701/ISO 22301/SOC 2 Type II；Baseten 全层级持有 SOC 2 + HIPAA；Modal HIPAA 仅限
          Enterprise
        - 大型企业和政府买方采购前越来越要求完整合规栈；Modal 未获 FedRAMP 授权
        - 高 — 这是医疗、金融和联邦市场的具体替代风险
        - 确认 Modal 2026–2027 年合规路线图；评估 FedRAMP 或 ISO 认证是否已规划或列入预算
    notes: 严重性评级（低 / 中 / 高）基于证据质量、竞争对手能力和达到重要性的时间窗口综合判断。尽调问题面向未来，需要本轮未能取得的一手来源验证。
