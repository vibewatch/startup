      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              五股结构性力量正在推动对 Modal 这类产品的需求。第一，AI 模型复杂度非线性上升：LLM
              参数量从数百亿扩展到数千亿时，推理基础设施成本和管理复杂度增长快于模型规模，托管计算平台抽象运营层的价值随之提高。第二，智能体 AI
              架构需要隔离、短生命周期的执行环境（Sandboxes），并能在亚秒级需求下从零扩展到数千个容器；Kubernetes 支撑的预留基础设施不适合这类工作负载，也因此拉动对 Modal
              冷启动优化无服务器模型的需求。第三，GPU 供应短缺——Mordor Intelligence（2026 年 2 月）称 H100 和 MI300X 交期超过 12 个月——推动开发者选择池化托管 GPU
              云，而非直接采购硬件，从结构上扩大弹性计算平台的可寻址市场。第四，AI 支出正从训练为重加速转向推理为重：到 2025–2026 年，对多数生产 AI 公司而言，推理在 AI
              计算总支出中的占比已高于训练；相比一次性大型训练，推理工作负载更适合无服务器弹性计费。第五，北美贡献 AI inference-as-a-service 增量增长的 41.1%（Technavio 2026），与
              Modal 总部和当前客户集中度相匹配。


              三项采用约束在中期限制 Modal 的 TAM。Hyperscaler 既有优势是主要天花板：AWS、GCP 和 Azure 都把 AI 推理服务（Bedrock、Vertex AI、Azure
              OpenAI）捆绑进既有企业云协议、折扣计划（EDP/CUD）和采购关系，大企业把 AI 工作负载路由到独立供应商的成本很高。GPU 供应约束也压住伸缩承诺：只要 NVIDIA 硬件配额仍然紧张，即使 Modal
              也无法保证立刻弹性扩展到数千张 GPU。大型模型部署的冷启动延迟是一项部署权衡：Modal 容器栈约一秒启动，但加载数十 GB
              模型权重仍需数分钟，除非配置预热，而预热会提高有效成本。随着受监管行业企业买方要求明确的基础设施保证，数据驻留、HIPAA、FedRAMP 和 GDPR
              合规要求正成为新约束，多租户无服务器云必须证明自己能满足。最后，裸金属 GPU 云（2026 年 6 月 RunPod L40S
              $0.86/hr）对愿意吸收运营开销、面向批处理优化或成本敏感的工作负载形成下行价格压力。
