companyProfile:
  summary: >
    Modal Labs, Inc. 是一家总部位于纽约市的无服务器 AI 基础设施公司，约由 Erik Bernhardsson 与 Akshat Bubna 于 2021 年创立。公司定位为 AI 生产云，提供 Python
    优先的平台，在 AWS、GCP 和 Oracle Cloud 之上抽象 GPU 与 CPU 计算，客户无需管理基础设施。核心产品包括 Functions（无服务器 GPU/CPU 计算）、Sandboxes（用于智能体执行和 LLM
    生成代码的隔离容器）、Training（微调和多节点作业）、Volumes（高性能可变存储）、Web Endpoints 和 GPU Notebooks。2026 年 5 月 Series C 完成时，Modal 披露年化收入突破
    $300M，较 2025 年 10 月 Series B 增长五倍；该轮融资 $355M，投后估值 $4.65B，由 General Catalyst 和 Redpoint Ventures 共同领投。Sandboxes
    目前贡献总收入超过三分之一，使 Modal 从单纯 GPU 租赁延展为平台型业务。已披露客户包括 Cognition、Physical
    Intelligence、DoorDash、Suno、Ramp、Quora（Poe）、Substack、Lovable、Reducto 和 Applied Compute。
  founders:
    - name: Erik Bernhardsson
      role: 联合创始人、CEO
      background: 2022 年 12 月公开发布 Modal；在 ML 工程社区以 Annoy 近似最近邻库创建者、软件基础设施领域知名博主而闻名。
      claimRefs:
