              Modal 的案例库现在覆盖十个生产部署，横跨多样工作负载且有可衡量结果。最强的单点数据是 Lovable（48 小时活动中 100 万个 sandboxes、创建 250,000 个 apps、活动期间没有工程
              page）、Ramp（所有已合并 pull requests 中超过一半由运行在 Modal Sandboxes 上的 Inspect coding agent 编写）和 Reducto（迁移 30 多条
              model pipelines 后 P90 latency 降低 3x，cold-boot times 缩短 83%）。十个具名部署中，每个被描述的用例都是生产而非
              pilot——客户要么迁移既有工作负载，要么直接在 Modal 上构建全新产品，而不是只做评估。累计采用信号同样清楚：Modal 自己的 2026 年 5 月 Series C
              公告披露，自约三年前创立以来，平台已启动超过 10 亿个 sandboxes。Series C 文章还指出，sandboxes 贡献总收入超过三分之一，确认了支撑 coding agents 和 RL
              infrastructure 的 sandbox 产品线已成为 Modal 增长最快的商业表面。Quora 从通用 model deployment 扩展到为 Poe code interpreter 采用
              Sandbox，说明即便现有客户也会扩大用例覆盖。Runway 从 proof-of-concept 到全球生产部署不到 30 天，凸显了较短的 time-to-value，有利于客户快速承诺。
