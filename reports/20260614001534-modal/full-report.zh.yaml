      - number: '5.3'
        title: 冷启动技术与容器创新
        blocks:
          - type: paragraph
            body: >-
              Modal 技术上最突出的能力是冷启动工程，2026 年 5 月工程博客「Truly Serverless GPUs」有详细记录。四层能力叠加，把 GPU replica scaling 从「multiple
              kiloseconds」压到数十秒。第一，cloud buffers：Modal 在网络中维持一池健康、空闲的 GPU，让多数扩容请求不必等待 hyperscaler 实例
              provisioning。第二，内容寻址的多层容器文件系统：全球分布式 cache 把热门容器镜像文件存入 worker memory，相比未缓存下载快 3–5x；torch
              等大库因被许多用户共享，收益尤其明显。第三，CPU Memory Snapshots（2025 年 1 月 GA）：容器在接受请求前被 snapshot；后续冷启动直接从冻结的内存状态恢复，跳过 Python
              imports 和 JIT compilation；实际加速 3–10x。第四，GPU Memory Snapshots（2025 年 7 月 alpha）：借助 NVIDIA driver branches
              570/575 中的 CUDA checkpoint/restore API，Modal 捕获 device memory contents（model weights）、CUDA kernels、CUDA
              objects、streams 和 memory mappings；恢复时重建 GPU context，无需重新运行 `torch.compile` 等昂贵操作。公开 benchmark 显示，vLLM
              serving Qwen2.5-0.5B-Instruct 的 P0 cold start 从 45s 改善到 5s，带 `torch.compile` 的 ViT inference function 的 P0
              从 8.5s 改善到 2.25s。生产中，Reducto 称采用 GPU snapshots 后，其文档处理模型 cold boot time 降低 83%（70s 到 12s）。Modal
              记录的限制包括：GPU snapshots 通常不兼容 multi-GPU code 和非 CUDA GPU work，也不会加速从 storage 加载权重。整体架构瞄准 GPU Allocation
              Utilization 问题——把付费 GPU-hours 与真正运行应用代码的 GPU-hours 之间的差距最小化；Modal 认为传统固定分配云部署中，这个利用率远低于 50%。
