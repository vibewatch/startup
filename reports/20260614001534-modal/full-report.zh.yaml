  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与待完成任务覆盖
        blocks:
          - type: paragraph
            body: >-
              Modal 处理的基础任务，至少与四类重叠竞争对手相同：在云端运行 GPU 加速 AI
              工作负载，同时无需配置或维护底层硬件。这个格局最好分三层理解。第一层（直接无服务器同行）：Baseten、Replicate、Beam Cloud 和 Banana.dev 都提供托管 GPU
              计算，并采用开发者优先的部署模型。Baseten 聚焦关键任务推理，提供专属部署、定制性能 kernel（TensorRT-LLM、vLLM、SGLang）和前线部署工程师支持。Replicate
              主要靠社区模型库竞争（数百个公开模型，一行 API 即可访问）和 Cog 打包。Beam Cloud 明确支持多云路由（AWS、GCP、Azure、Hetzner），目标是智能体沙箱加 GPU
              推理。Banana.dev 采用固定月费加按成本计算（Team：每月 $1,200）且零加价，面向更看重简单性而非托管功能的团队。第二层（原始 GPU 云）：RunPod 借助 FlashBoot 技术实现低于
              200ms 冷启动，并达到 750,000+ 开发者和 $120M ARR（Sacra，2026 年 1 月）；Lambda AI（原 Lambda Labs）转向「The Superintelligence
              Cloud」，具备 ISO 27001/SOC 2 合规和专属集群管理。CoreWeave 将自己定位为「the world's #1 AI cloud platform」，拥有 Kubernetes
              原生基础设施、96% 集群 goodput，以及与 OpenAI 和 Meta 的数十亿美元合同。第三层（hyperscaler 既有玩家）：AWS SageMaker 提供统一的数据-分析-AI
              studio；Google Cloud Run 提供按需 L4 GPUs、5 秒启动和 scale-to-zero；Google 的 Gemini Enterprise Agent Platform（原
              Vertex AI）提供 200+ 模型和完整 MLOps 工具；Azure Container Apps 提供无服务器 AI 应用托管，包括面向智能体代码执行的 Sandbox
              containers。Together AI 处在相邻位置：其以 $3.3B 估值完成 $305M Series B（Sacra），主要在基础模型访问的按 token
              推理定价上竞争，而不是定制模型托管。现状替代方案——在 AWS、GCP 或 Azure 预留 GPU 实例之上搭 Kubernetes 集群——仍是大型企业默认选择，也是 Modal
              最难替换、切换摩擦最高的路径。
