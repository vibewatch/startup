    type: flow
    layout: wide
    summary: Modal 将开发者在 Functions、Sandboxes、Volumes 和 Notebooks 上的计算消耗转化为按秒计量收入，再把其中一部分升级为价值更高的 Team 和 Enterprise 合同。
