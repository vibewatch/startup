      - number: '2.5'
        title: 规模测算缺口、矛盾与尽调要求
        blocks:
          - type: paragraph
            body: >-
              接受任何关于 Modal 可寻址机会的具体市场规模前，应保留五个证据缺口。第一，尚无分析师发布专门的「serverless GPU cloud」或「Python-native AI compute
              platform」市场类别；所有规模估算都覆盖更宽或定义不同的类别，因此本章可服务市场数字是作者构建，而非已发表研究。第二，分析师估算在范围和规模上差异很大——从
              $85.25B（Technavio，窄口径推理服务层）到 $394.46B（MarketsandMarkets，含硬件的完整 AI 基础设施），再到 $601.93B（MarketsandMarkets，最宽
              AI 市场）——反映的是定义不一致，而不是预测分歧；尽调问题是压测哪种定义最贴近 Modal 的实际发票项目。第三，GPU fractionalization 趋势（Mordor Intelligence
              2026 年 2 月引用的低于 $2/hr GPU 切片）是双刃剑：它扩大可寻址买方基础（进入成本更低），但同时压缩价格底部，并可能让批处理容忍型推理计算商品化。第四，Modal 的国际 go-to-market
              牵引未公开披露；Asia-Pacific 预计拥有最高 CAGR（Mordor Intelligence 为 22.74%），代表未经确认的扩张机会。第五，Modal
              的合规认证状态（SOC2、HIPAA、FedRAMP）未在抓取到的公开语料中得到独立确认，给企业和受监管买方留下缺口。投资人应要求公司直接提供按垂直行业划分的收入集中度、地域组合和合规认证证据，以填补这些缺口。
