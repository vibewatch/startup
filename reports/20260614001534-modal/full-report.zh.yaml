      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 以 $4.65B 跟踪；没有尽调证据，不追逐高于该价格的动量定价
            body: >-
              Modal Labs 凭借出色增长（$300M ARR，7 个月 5x）、强客户证明和技术差异化，已经足以获得跟踪评级。但 15.5x ARR 倍数偏贵，近期三次故障是实质风险信号，毛利率和 NRR
              完全不透明，阻止了买入判断。公司值得密切关注；升级为买入需要四项 data-room 材料：毛利率、NRR、股权结构条款，以及 Series B 数据冲突的解决。
            calloutType: recommendation
