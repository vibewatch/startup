  - id: FV001
    title: 推荐逻辑——从证据到结论
    type: flow
    layout: standard
    summary: TRACK 结论在强收入和客户证据，与偏高倍数和未披露单位经济之间做权衡。
    data:
      nodes:
        - id: arr
          label: $300M ARR 已确认——7 个月增长 5x
        - id: customers
          label: 高质量、多元化客户名单（DoorDash、Cognition、Physical Intelligence、Suno）
        - id: tech
          label: 技术护城河——GPU snapshotting、Rust runtime、CUDA checkpoint
        - id: sandboxes
          label: Sandboxes >1/3 收入——平台，而非单纯 GPU 租赁
        - id: multiple
          label: 15.5x ARR 倍数——处于私有 AI 基础设施区间上沿
        - id: opacity
          label: 毛利率、烧钱速度、NRR 和股权结构表均未披露
        - id: reliability
          label: 2026 年 5–6 月三起重大故障——规模化下的可靠性隐忧
        - id: call
          label: 结论：TRACK——中等信心、高风险、估值偏紧
      edges:
        - from: arr
          to: call
          label: 支持继续接触
        - from: customers
          to: call
          label: 验证产品市场匹配
        - from: tech
          to: call
          label: 支持相对大宗算力的溢价
        - from: sandboxes
          to: call
          label: 延展平台叙事
        - from: multiple
          to: call
          label: 压低信心；要求超高速增长持续
        - from: opacity
          to: call
          label: 阻止买入；需要数据室材料
        - from: reliability
          to: call
          label: 推高运营风险评级
    approximationNotes: 这是推理图，不是加权评分模型；边权重为定性判断。
