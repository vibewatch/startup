      - number: '7.3'
        title: 合作伙伴与基础设施依赖风险集中在 GPU 供应集中度，以及 NVIDIA 作为供应商和竞争者的角色演变
        blocks:
          - type: paragraph
            body: >
              Modal 有意采用轻资产模式：不持有 GPU 硬件，而是在全球数百个数据中心聚合 AWS、GCP 和 Oracle Cloud Infrastructure 的容量。这一架构带来结构性灵活性——无需重资本
              GPU 采购、没有折旧风险、可路由到最便宜的可用硬件——但也把生存级依赖集中到三家商业交易对手身上；它们的定价、分配和战略优先级都不受 Modal 控制。AWS shared responsibility
              model 很有启发：即便对抽象化云服务，云厂商也控制基础设施可靠性，而把配置、patching 和 security configuration 留给客户。Modal 相对于 AWS、GCP 和 OCI
              的位置类似：它是 GPU intermediary，必须承受上游 availability risk，同时又向下游客户营销自己的 SLA。


              NVIDIA 是 Modal 技术栈中最深的 single-point dependency。Modal 的 GPU Memory Snapshots——处于 alpha 阶段、可实现 10x
              加速的冷启动特性——依赖特定 NVIDIA driver branches（570/575）中的 CUDA checkpoint/restore API。NVIDIA driver API
              的任何变化，无论来自版本更新、商业限制，还是 driver maintenance 中止 checkpoint capability，都可能打断 Modal 冷启动架构中最差异化的功能。Modal 记录的
              multi-GPU code 和 non-CUDA workloads 不兼容，也进一步限制了风险缓释空间。这一技术依赖目前没有任何公开披露的替代方案缓释。


              NVIDIA 的竞争行为给依赖风险增加第二个维度。Sacra 的 Fireworks AI 报告把 NVIDIA 收购 Lepton 解读为 NVIDIA 有意直接竞争 GPU cloud marketplace
              的信号。如果 NVIDIA 的战略利益从赋能 GPU aggregators 转向直接服务客户，Modal 与主导 GPU 制造商的供应关系就会从共生变成对抗。CoreWeave 的处境说明了 NVIDIA
              如何用优先分配加深与重资本数据中心运营商的关系：NVIDIA 持有 CoreWeave $2B equity stake，并提供 $6.3B take-or-pay GPU
              backstop；这种安排可能以牺牲轻量级聚合平台为代价。Modal 依赖 Oracle Cloud Infrastructure（OCI）作为第三家云厂商——很可能来自 Oracle 的 GPU cloud
              expansion——相较 AWS 和 GCP，也增加了来自较不成熟 AI infrastructure provider 的集中与交易对手风险。
