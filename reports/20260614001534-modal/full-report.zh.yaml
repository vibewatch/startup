    notes: 各行按严重性排序。OCI = Oracle Cloud Infrastructure。
    rows:
      - - GPU 算力供给——没有自有硬件；100% 依赖云厂商分配和定价
        - AWS、GCP、Oracle Cloud（OCI，多云供应）
        - 跨数百个全球数据中心提供主要 GPU 算力
        - 高——3 家供应商；若三家同时限制分配或提价，没有硬件备份
        - 任何主要供应商提价、限制容量或战略性降级优先级；单 AZ 故障会传导（5 月 7 日事故）
        - 严重
        - 多云池化分散风险；区域路由；GPU 自动升级（H100→H200）最大化池利用率
        - 实质性——任何供应商定价动作或容量限制都会直接影响 Modal 毛利率和客户可用性
      - - NVIDIA CUDA checkpoint/restore API——GPU Memory Snapshot 功能依赖 570/575 驱动分支
        - NVIDIA
        - 为 GPU Memory Snapshots（alpha）提供底层 CUDA checkpoint/restore 能力
        - 严重——未披露替代实现；与多 GPU 代码不兼容
        - NVIDIA 弃用或更改 checkpoint/restore API；依赖亚秒级冷启动优化的现有客户功能中断
        - 高
        - GPU snapshots 仍处 alpha；CPU Memory Snapshots（GA）提供后备；Modal 可禁用依赖 snapshot 的工作流
        - NVIDIA 驱动变更可能让 Modal 最差异化的冷启动功能消失；未披露缓解时间线
      - - NVIDIA 作为潜在竞争者——收购 Lepton 释放 GPU 云市场野心
        - NVIDIA
        - 目前是 GPU 硬件供应商；通过 Lepton 逐步成为直接 GPU 云平台
        - 中——NVIDIA 的分配决策偏向资本密集型伙伴（CoreWeave $6.3B 兜底）；Modal 不在该层级
        - NVIDIA 优先把 GPU 分配给自有市场或资本密集型伙伴，而非聚合平台
        - 中
        - 多云采购降低 NVIDIA 专属 GPU 风险；AMD GPU 多元化是长期选项
        - NVIDIA 建设竞争性分发渠道的同时，Modal 对 NVIDIA 硬件存在结构性依赖
      - - gVisor 容器运行时——容器隔离依赖 Google 维护的开源项目
        - Google（gVisor）
        - 为所有 Modal 容器工作负载提供内核级沙箱隔离
        - 中——gVisor 是开源项目；Google 也在 Cloud Run 和 GKE 使用；停更风险低
        - gVisor 维护优先级下降或分叉；隔离属性偏离生产要求
        - 低
