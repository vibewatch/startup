      - number: '6.4'
        title: 集中风险、负面信号与竞争压力
        blocks:
          - type: paragraph
            body: >-
              核心集中风险在公开记录中不可见，只能从缺席中推断。Modal 没有披露前五或前十大客户的收入占比。鉴于案例库中少数高知名度账户运行极大工作负载（Lovable 48 小时 100 万个
              sandboxes；Suno 扩到数千块 GPU），一个小型 hyperscale 客户 cohort 贡献不成比例的 compute consumption
              是合理可能。平台按用量计费，意味着任一大客户减少工作负载——无论因为模型优化、切换竞争对手，还是自身业务收缩——都可能带来显著收入波动。Sacra 提醒，hyperscaler
              竞争（AWS、Google、Azure 增加带 scale-to-zero 计费的 serverless GPU）可能随时间侵蚀 Modal 的成本和冷启动优势。DoorDash 2026 年 5 月引用中把其在
              Modal 上使用 Claude Managed Agents 描述为「evaluating」，读起来更像方向性探索，而非已承诺的生产支出，说明部分具名账户所处阶段可能早于最成熟案例所暗示的状态。2026 年
              5–6 月记录的三次宕机构成负面信号：Hacker News 用户评论称 6 月 3 日事件是「the third major outage in a
              month」，指向可能危及延迟敏感企业工作负载留存的可靠性趋势。Modal 90 天 99.86–99.95% uptime 数字可用，但对 mission-critical production systems
