      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Modal 的架构围绕 Python SDK 分层，把多云 GPU provisioning、容器管理和分布式存储抽象成一个编程接口。计算容器通过 `modal.Image` Python API
              定义（链式调用：`Image.debian_slim().pip_install(...)`），无需 YAML 或 Dockerfile；随后 image builder 校验镜像并分发到 worker
              nodes。容器运行在 gVisor 中，这是 Google 在 Cloud Run 和 GKE 使用的 kernel sandbox，工作负载隔离强于标准容器 namespace。容器运行时用 Rust
              编写，以追求性能和内存安全。容量在全球 AWS、GCP、Oracle Cloud Infrastructure 的数百个数据中心池化，让 Modal 能把每次 GPU
              请求路由到最便宜的可用硬件，用户无需预留容量。GPU 选择写成 `@app.function(gpu="H100")`；Modal
              可能自动升级请求（H100→H200、A100-40GB→A100-80GB）且不额外收费，以最大化池化利用率。多 GPU 容器每个容器最多支持 8
              张卡（B200、H200、H100、A100、L4、T4、L40S）。`@modal.concurrent` 提供 input concurrency，让容器可同时处理多个请求；这对 vLLM 或 SGLang
              LLM serving 的 continuous batching 很关键。容器生命周期模型（通过 `@modal.enter` 和 `@modal.exit` 设置 enter/exit
              hooks）把一次性初始化与逐请求执行拆开，从而高效加载模型权重。Region selection（最高支持窄 / 宽粒度）和独立 routing
              regions（us-east、us-west、eu-west、ap-south）让对延迟敏感的工作负载可以贴近数据库或机器人。Secrets 通过 `modal.Secret` 注入为环境变量，永远不会进入
              image build layer。
