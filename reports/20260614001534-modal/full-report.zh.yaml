      - number: '6.5'
        title: 平台宽度与用例分类
        blocks:
          - type: paragraph
            body: >-
              Modal 的客户证据覆盖八类不同用例——LLM inference serving、sandboxed code execution、RL training infrastructure、custom
              fine-tuning、audio/video/image generation、computational biology、batch processing 和 robotic real-time
              inference——每一类至少有一个具名生产部署证明。这种宽度重要，因为它降低了 Modal 依赖单一工作负载类型的风险。按 Series C 公告，单是 sandboxed code execution
              就贡献超过三分之一收入，由 Lovable 的 AI app generation、Ramp 的 Inspect coding agent、Quora 的 Poe code interpreter 和
              Cognition 的 RL environment work 支撑。LLM inference 是第二大类别，覆盖 Decagon 的 real-time voice model、Runway
              Characters 的 video model、Suno 的 music generation 和 Reducto 的 document intelligence pipelines。RL training
              类别在 2025–2026 年快速出现：Applied Compute、Cognition 和 AE Studio（theorem proving）都使用 Modal 做高并行 RL
              rollouts，Series C 文章也明确把「RL workloads」列为关键增长驱动。Computational biology（Chai Discovery）和 robotic AI（Physical
              Intelligence）规模较小，但战略上相关，因为它们证明 Modal 能服务典型 cloud-AI 模式之外、对延迟敏感且领域特定的科学工作负载。LLM serving、image and
              video、coding agents 的 solutions pages 确认，Modal 正主动营销这些类别，而不只是观察有机采用。
