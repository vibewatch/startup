  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Modal 的竞争市场是无服务器 AI 计算和 inference-as-a-service 层：由云管理的平台负责打包、部署、自动伸缩并计量 GPU
              工作负载，客户无需配置、维护或预留底层硬件。纳入支出包括无服务器函数执行费（按 CPU 和 GPU 使用秒数计费）、托管推理端点费用、智能体代码 Sandbox 执行、Storage
              Volumes、网络出口，以及企业支持合同。排除支出包括原始模型权重成本、训练数据集采购、应用层开发人力、数据中心资本开支、裸金属托管费用，以及未专用于 AI 工作负载的通用 IaaS 计算支出。


              潜在 Modal 客户会考虑的现状替代方案分三类。第一，基于 AWS、GCP 或 Azure 预留 GPU 实例自管 Kubernetes 集群：这种方式需要 DevOps
              人手、容量规划、多年期财务承诺和大量集群管理开销；Suno 创始人选择 Modal 时明确提到希望避开「三年 GPU 预留」和集群管理，就是典型例子。第二，专业 GPU 云（RunPod、Lambda
              Labs）提供原始 GPU 租赁，但没有托管部署栈，客户还要自己搭建容器编排、自动伸缩逻辑和可观测性。第三，hyperscaler 原生托管 AI 服务（AWS Bedrock、Google Vertex AI
              / Agent Platform、Azure Machine Learning）提供托管推理，但 Python 优先开发体验较弱，专有锁定更强，且通常按 token 而非 GPU 秒计价。


              Modal 已明确进入、但并非其变现中心的相邻市场包括：MLOps 实验跟踪、LLM 微调平台和开发者智能体沙箱。截至 2026 年 6 月，Modal 的 GPU 类型覆盖从 T4、L4（入门推理）到
              A10、A100（40GB 和 80GB）、L40S、H100（PCIe、SXM、NVL）、H200 和 B200（Blackwell 架构），并提供可选 B200+ 标记，在可用时也路由到
              B300。该硬件范围让 Modal 能服务成本优化批处理工作负载（L4、L40S）、中端生产推理（A100、L40S）和前沿模型部署（H100、H200、B200）。
