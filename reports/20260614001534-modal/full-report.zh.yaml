  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 毛利率
        - 按 GPU tier、存储和 Sandbox 拆分的 COGS；按产品线划分的毛利率百分比
        - 15.5x ARR 只有在毛利率高于 35% 时才站得住；低于 25% 会把溢价倍数压回商品化区间
        - 索取数据室财务报表；用超大云 GPU 定价对照 Modal 标价交叉核验
      - - 收入质量
        - NRR、cohort 留存、前 10 大客户集中度占 ARR 的比例
        - 300% 年化增长可能掩盖少数快速扩张账户；持久性未知
        - 索取内部 BI dashboard 或 cohort 摘要；与可得 RunPod 和 Fireworks 数据对标
      - - 烧钱速度和 runway
        - 月度经营现金消耗和当前现金余额
        - 若 burn rate 很高，$355M 融资可能很快耗尽；没有该数据无法确认资本充足性
        - 索取 CFO 级财务披露；结合员工数（未披露）和基础设施成本三角验证
      - - Cap table 和优先权栈
        - Capitalization table、清算优先权金额，以及各轮参与权
        - 种子轮、Series A（$16M）、Series B（$87–$110M）和 Series C（$355M）累积优先权可能显著损害普通股经济性
        - 律师在数据室审阅；按不同退出倍数计算 waterfall
      - - Series B 差异
        - 解释 $87M（Sacra / Lux Capital 领投）与 $110M（公司博客 / Redpoint 领投）冲突
        - 无法解释的融资历史冲突是透明度风险，也可能显示 cap table 复杂
        - 索取 capitalization table 或 Series B term sheet；直接向公司询问解释
      - - 员工数和单位经济
        - 总员工数、工程与 GTM 拆分、按 tier 划分的平均合同价值、CAC payback period
        - $300M ARR 且员工数未披露，经营杠杆无法判断；单位经济无法评估
        - 索取内部 staffing 数据；LinkedIn 员工数只能提供粗略 proxy
    notes: 尽调问题代表把建议从持续跟踪上调至买入所需的最低证据；每一项都可独立推动建议变化。
    claimRefs:
