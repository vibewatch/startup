  - id: FR002
    title: 风险传导图——Modal 主要风险如何流向收入、客户信任和估值
    type: dag
    layout: wide
    summary: 有向无环图展示 Modal 五个根因风险集群如何沿运营、竞争、监管和治理路径向下传导，影响收入耐久性和估值。边表示因果或依赖关系。节点描述用于说明；方向性为近似判断。
    data:
      nodes:
        - id: n-infra
          label: 基础设施依赖
          description: GPU 供应 100% 轻资产，来自 AWS、GCP、OCI，没有自有硬件缓冲；同时依赖 NVIDIA CUDA checkpoint API。
        - id: n-outage
          label: 故障集群
          description: 2026 年 5–6 月 3 起重大事故；Starter/Team 客户无公开 SLA。
        - id: n-valuation
          label: 估值压力
          description: $4.65B、15.5x ARR；需要持续超高速增长和利润率纪律。
        - id: n-competition
          label: 竞争压力
          description: 超大云厂商打包、CoreWeave 规模、Fireworks AI、RunPod 成本竞争、Sandbox 替代风险。
        - id: n-regulatory
          label: 监管 / 法律敞口
          description: HIPAA BAA 范围缺口、EU AI Act GPAI 链条、GDPR 控制者—处理者分工、FTC 云竞争监测。
        - id: n-reliability
          label: 可靠性感知
          description: 开发者和企业客户是否信任 Modal 已具备生产就绪能力；对 Sandboxes 用例至关重要。
        - id: n-revenue
          label: 收入耐久性
          description: 基于用量的 ARR；Sandbox 占比 33%+；企业扩张依赖 NRR 和 SLA 信心。
        - id: n-margin
          label: 毛利率
          description: 客户定价与云服务商 GPU 成本之间的价差；无公开数据；估计为 30–50%。
        - id: n-valuation-out
          label: 投资估值结果
          description: IPO 或 M&A 时实现的退出倍数；受收入耐久性、利润率和竞争位置影响。
      edges:
        - from: n-infra
          to: n-outage
          label: AZ 故障向外传导
        - from: n-infra
          to: n-margin
          label: 云成本决定价差
        - from: n-outage
          to: n-reliability
          label: 事故侵蚀信任
        - from: n-competition
          to: n-margin
          label: 价格压力压缩价差
        - from: n-competition
          to: n-revenue
          label: 替代方案减少 ARR
        - from: n-regulatory
          to: n-revenue
          label: 合规缺口拖慢医疗健康 / 欧盟销售
        - from: n-reliability
          to: n-revenue
          label: 信任驱动扩张和留存
        - from: n-valuation
          to: n-revenue
          label: 增长预期推动企业交易紧迫性
        - from: n-revenue
          to: n-valuation-out
          label: ARR × 倍数 = 退出价值
        - from: n-margin
