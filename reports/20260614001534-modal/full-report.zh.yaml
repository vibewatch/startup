      - number: '4.4'
        title: 公开牵引力与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Modal 的公开牵引力叙事强过多数 Series C 阶段的私有基础设施公司。公司在 2026 年 5 月 Series C 公告中披露年化收入超过 $300M；这类自愿披露多数私有公司会回避。Sacra
              也验证了方向，估算 2026 年 4 月 ARR 为 $300M，而 2025 年底约 $119M；五个月隐含增速约 150%，年化后同比超过 300%。公司称自 2025 年 10 月 Series B
              以来收入增长 5x；若 Series B 时 ARR 约 $60M、2025 年 12 月约 $119M，这与 Sacra 估算相符。客户名单横跨 robotics（Physical
              Intelligence）、music（Suno，每天数百万首歌、数千块 GPU）、coding agents（Cognition、Lovable）、enterprise
              commerce（DoorDash）、document AI（Reducto）、social（Substack）和 developer
              productivity（Ramp），显示出真实的平台宽度，也降低了单一垂直行业集中风险。

              公开资料显示资本充足性偏强，但无法完成承销级确认。「公司概览」章节（完整轮次时间线见该章）记录了三轮机构融资，最终是 2026 年 5 月以 $4.65B post-money 完成 $355M Series
              C。对本章资本充足性分析，关键事实是：Series C 在 Series B 后一年内完成，提供了大量运营资本；公开证据支持的总融资额约 $465M（seed 约 $7M、Series A 约
              $16M、Series B 按公司语境约 $110M［Sacra 报告 $87M，构成证据缺口］、Series C $355M）；该轮由 General Catalyst 联合领投，GC 团队的 Quentin
              Clark、Max Rimpel、Katie Keller 参与，意味着行业内资本最充足的 growth-equity 机构之一提供了深度受托监督。

              公开证据无法确定的事项包括：账上现金、月度 burn rate、runway、Modal 在毛利或经营层面是否亏损、任何债务或授信安排义务，以及向云厂商承诺 GPU 容量是否构成表外负债。120–180
              人团队，按纽约 / 旧金山 AI 基础设施公司的典型薪酬福利，再加上多云 GPU 采购，可能意味着可观的月度现金消耗。$355M 融资提供了厚实缓冲，但没有内部财务数据，任何 runway
              估算都站不住。公开来源中唯一的负面信号仍是宕机模式：2026 年 6 月 3 日 Hacker News 社区报告记录一个月内三次重大宕机——5 月 7 日 AWS 过热事件、5 月 19 日未列明事件、6 月
              3 日内部认证系统故障——提示高增长率可能暂时掩盖运营风险。
