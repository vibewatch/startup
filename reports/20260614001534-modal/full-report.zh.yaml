  - id: FV002
    title: 估值敏感性——在选定可比倍数下支撑 $4.65B 所需收入
    type: bar
    layout: standard
    summary: 若采用 5x 倍数（CoreWeave 式基础设施），Modal 需要 $930M ARR 才能支撑 Series C 价格；在 15.5x（当前隐含倍数）下，只需 $300M。敏感性显示，倍数选择主导了分析。
    data:
      items:
        - label: CoreWeave 式 4.5x
          value: 1033
          detail: 以 4.5x ARR 支撑 $4.65B 所需收入（百万美元）
        - label: Together AI 式 7.5x
          value: 620
          detail: 以 7.5x ARR 支撑 $4.65B 所需收入（百万美元）
        - label: Baseten 式 8.3x
          value: 560
          detail: 以 8.3x ARR 支撑 $4.65B 所需收入（百万美元）
        - label: Modal 当前 15.5x
          value: 300
          detail: Series C 交割时收入（2026 年 5 月），据公司和 Sacra
        - label: Fireworks 拟议 18.75x
          value: 248
          detail: 若 Fireworks 以 $800M ARR 对应 $15B 融资，隐含收入
        - label: Datadog/Cloudflare 式 20x
          value: 233
          detail: 若适用溢价软件倍数，所需收入（百万美元）
    approximationNotes: 每根柱将 Series C 投后 $4.65B 除以选定可比倍数；数值是基于估计的支撑门槛，不是经审计收入。Fireworks 拟议倍数基于 Sacra 报道的进行中融资讨论，可能不会完成。
