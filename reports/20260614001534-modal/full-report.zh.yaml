      - number: '2.2'
        title: 多重测算口径与证据约束
        blocks:
          - type: paragraph
            body: >-
              没有单一分析师报告把「serverless GPU cloud」定义为独立市场类别。分析师发布的是不同抽象层级的估算，没有一个能完全匹配 Modal 的竞争边界。最相关的窄口径是 Technavio 的 AI
              inference-as-a-service 市场：2025 年规模为 USD 85.25 billion，至 2030 年 CAGR 为 22.1%；北美贡献增量增长的 41.1%，仅 GPU 组件 2024
              年规模就达 USD 42.28 billion。MarketsandMarkets 发布更宽的 AI 基础设施口径（计算、内存、网络、存储和软件）：2024 年 USD 135.81 billion，预计
              2030 年达 USD 394.46 billion，CAGR 19.4%。第三个 MarketsandMarkets 口径单独测算云 AI 市场（基础设施 + ML 平台 + MLOps + AIaaS）：到
              2029 年达 USD 327.15 billion，CAGR 32.4%。Mordor Intelligence 预测云 AI 市场 2031 年达 USD 269.02 billion，自 2026 年起
              CAGR 18.68%，其中混合云和多云架构预计以 22.31% CAGR 增长。最后，MarketsandMarkets 最宽的 AI 估算（硬件 + 软件 + 服务）把整体市场定为 2026 年 USD
              601.93 billion，到 2033 年增长至 USD 3.638 trillion，CAGR 29.3%。


              这些估算不能相加。它们在不同定义边界上衡量重叠或部分不同的市场；MarketsandMarkets 基础设施数字包含硬件 capex，而 Technavio 数字更窄但仅限服务。可用推论是方向性的：Modal
              所处市场的可服务层（云托管、无服务器 AI 计算）今天保守估计也有数百亿到低千亿美元规模，具体取决于采用哪个口径，且有文档支持的 CAGR 区间为 19–32%。自下而上的估算——对
              MarketsandMarkets $135B AI 基础设施规模套用 25–30% 云或无服务器托管占比——得到 2024 年隐含 SAM 为 USD 34–41 billion，并按比例扩张。Modal 超过
              $300 million ARR 约等于 Technavio 窄口径推理市场（2025 年 USD 85.25B）的 0.35% 渗透率，说明其在大型且扩张中的机会里仍处于极早期渗透。按 15x ARR
              倍数计算，Modal $4.65B 估值与 2026 年同样呈现高速收入增长的优质 AI 基础设施同行相符。
