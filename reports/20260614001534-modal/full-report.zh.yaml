          - type: callout
            title: 2026 年 5–6 月三次故障显示可靠性成熟度缺口；在 $300M ARR 阶段并不正常
            body: >-
              2026 年 6 月 3 日一篇 Hacker News 社区帖记录了三起等同 SEV-1 的事件：5 月 7 日 AWS us1-az4 过热、5 月 19 日未记录事件、6 月 3
              日内部认证系统失败。它们集中在公司 Series C 关闭、宣传收入增长 5x 的同一个七周窗口内，可能说明增长速度超过了基础设施可靠性投入。按 15.5x
              ARR，任何持续可靠性恶化都会在管理层来得及反应前，触发倍数压缩和客户流失。
            calloutType: risk
