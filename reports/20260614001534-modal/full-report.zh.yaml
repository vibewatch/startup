chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与市场定位
        blocks:
          - type: paragraph
            body: >-
              Modal Labs, Inc. 是一家在 Delaware 注册的 AI 生产云公司。2026 年 5 月 SaaS 协议确认了其法律实体名称和 Delaware 注册地；该协议适用于所有企业客户。运营总部位于
              New York City, New York，这一点由 LinkedIn 公司页面（2026 年 6 月 25,318 名关注者）和 Redpoint Ventures
              组合公司页面共同确认。部分二级市场数据库称其位于 San Francisco，与上述信息冲突；本报告以抓取到的一手来源为准。Modal 将自身使命描述为补齐 AI
              工作负载到来时缺失的基础设施层：传统云基础设施为无状态 Web 应用设计，从未针对需要 GPU 内存、可在零到数千张加速卡之间动态伸缩、并为智能体生成代码提供隔离执行环境的模型来架构。公司使用过标语「The
              production cloud for AI」以及首页文案「The production cloud for AI—built for speed, at any scale.」。截至 2026 年 6
              月，核心产品包括：Functions（GPU 和 CPU 无服务器计算）、Sandboxes（用于智能体执行或 LLM
              生成代码的隔离容器）、Training（微调和多节点训练作业）、Volumes（高性能可变存储）、Web Endpoints（HTTP/ASGI 服务）和 GPU Notebooks（协作笔记本）。定价分为
              Starter（$0 基础费，含每月 $30 免费额度，10 个 GPU 并发）、Team（每月 $250，50 个 GPU 并发）和 Enterprise（定制）。modal Python SDK（PyPI
              可用，支持 Python 3.10–3.14）是 Modal 的主要开发者界面；JavaScript/TypeScript 和 Go 也支持编排。Modal
              在主要云和全球数百个数据中心池化容量，可在没有预留容量的情况下数秒内从 0 自动扩展到 1,000+ GPUs。公司在 2026 年 5 月 Series C 文章中称已投入五年基础设施建设，支持 2021
              年成立的判断，也与用户提供的背景一致；公开语料未显示精确成立日期。
