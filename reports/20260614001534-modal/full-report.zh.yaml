  - id: FE001
    title: Modal 产品架构图
    type: stack
    layout: wide
    summary: 分层展示 Modal 的公开架构，从开发者接口到容器执行，再到多云硬件和存储。
    data:
      layers:
        - id: layer-sdk
          label: 开发者接口（Python SDK）
          detail: >-
            @app.function()、@app.cls()、@modal.fastapi_endpoint、@modal.concurrent、@modal.enter/@modal.exit 装饰器；JS/TS 和 Go
            SDK 用于 Sandbox/Function 调用。不需要 YAML。
          sublayers:
            - id: sdk-function
              label: Functions / Classes
              detail: Serverless GPU/CPU compute; lifecycle hooks; map/starmap for parallel fan-out.
            - id: sdk-sandbox
              label: Sandboxes
              detail: Ephemeral isolated containers for agent-generated or untrusted code; TCP tunnels; lifecycle events.
            - id: sdk-web
              label: Web Endpoints
              detail: >-
                @modal.fastapi_endpoint, ASGI, WSGI apps; custom domains; scale-to-zero with cold start managed by
                platform.
            - id: sdk-schedule
              label: Scheduled Functions
              detail: modal.Period / modal.Cron syntax; deploys alongside function definition.
        - id: layer-storage
          label: 存储原语
          detail: >-
            Volumes（分布式 FS，最高 2.5 GB/s，针对一次写入、多次读取优化）、Dicts（KV store，cloudpickle）、Queues（FIFO，多生产者 / 消费者）、Notebooks（GPU
            支持的交互式环境）。
          sublayers:
            - id: storage-volumes
              label: Volumes
              detail: Distributed filesystem; multi-cloud backed; v2 is HIPAA-compliant.
            - id: storage-dicts
              label: Dicts
              detail: Distributed key-value; 100 MiB/object; 7-day TTL; distributed locks.
            - id: storage-queues
              label: Queues
              detail: FIFO; 24-hour TTL; 5,000 items per partition; 100,000 partitions.
        - id: layer-runtime
          label: 容器运行时
          detail: >-
            基于 Rust 的 worker runtime；gVisor 内核沙箱；Python Image builder（method-chain API）；内容寻址的多层 image 文件系统缓存（比未缓存快
            3-5x）。
          sublayers:
            - id: runtime-gvisor
              label: gVisor Isolation
              detail: Kernel sandbox; same technology as Google Cloud Run and GKE; automatic synthetic isolation monitoring.
            - id: runtime-snapshots
              label: Memory Snapshots
              detail: >-
                CPU snapshots (GA, 3-10x speedup); GPU snapshots (alpha, up to 10x speedup via CUDA checkpoint/restore
                API).
            - id: runtime-images
              label: Image Builder
              detail: Python-defined; no Dockerfile required; uv/pip install; add_local_dir.
        - id: layer-infra
          label: 多云基础设施
          detail: AWS、GCP、Oracle Cloud Infrastructure；全球数百个数据中心；按类型保留闲置 GPU 的云缓冲；自动 GPU 升级路径（H100→H200，A100-40GB→A100-80GB）。
          sublayers:
            - id: infra-gpu
              label: GPU Fleet
              detail: >-
                T4, L4, A10, L40S, A100-40GB, A100-80GB, H100, H200, B200, B200+ (B300 opt-in); up to 8 GPUs per
                container.
            - id: infra-regions
              label: Regions
              detail: >-
                Container regions (broad 1.5x, narrow 1.75x pricing); routing regions (us-east, us-west, eu-west,
                ap-south).
    claimRefs:
