      - number: '8.3'
        title: 可比公司分析把 $4.65B 放进基准情景，但已没有犯错空间
        blocks:
          - type: paragraph
            body: >-
              对 Modal 最有用的私有可比公司是 Fireworks AI 和 Together AI，二者都是纯推理平台，且有 Sacra 收入估算。Fireworks AI 在 2025 年 10 月 Series C
              时披露 ARR 约 $800 million、投后估值 $4 billion，隐含约 5x ARR——显著低于 Modal 的 15.5x。据报 Fireworks 正在讨论以 $15 billion
              估值融资；若按 $800 million ARR 关闭，则隐含约 18.75x，高于 Modal。Together AI 2025 年 2 月 Series B 估值 $3.3 billion，对应 2026
              年约 $1 billion 年化收入，隐含 3.3x；据报它正以 $7.5 billion 估值洽谈，若按 $1 billion ARR 计算则为 7.5x。CoreWeave
              不是合适的架构类比——它以巨大资本强度自有 GPU 硬件——但其 FY2025 收入 $5.13 billion 对应 IPO 前 $23 billion 估值，隐含约 4.5x trailing
              revenue，远低于 Modal 的软件化倍数。2026 年 3 月提交的 CoreWeave 10-K，是这组可比公司中唯一一份一手财务披露。

              三个情景带概括了结果区间。牛市情景中，Sandbox 和推理动能延续，Modal 到 2027 年中达到 $600 million 至 $1 billion ARR，毛利率被证明达到或高于
              40%，投资人为下一轮按 15–18x ARR 定价，隐含 $9 billion 至 $18 billion 估值。基准情景中，收入增长 100–150%，到 2027 年中达到 $450 million 至
              $600 million，公司成熟后倍数温和压缩至 12–15x，隐含 $5.4 billion 至 $9 billion 区间，使当前 $4.65 billion
              落在分布之内。熊市情景中，故障复发损害客户信任，增速跌破 80%，hyperscaler 打包竞品，倍数在 $250–350 million ARR 上压缩到 7–10x，隐含 $1.75 billion 至
              $3.5 billion 估值——相较 Series C 价格形成实质性按市值重估损失。

              基准与熊市之间的区间足够宽，当前估值不能称为有吸引力。这个案子本质上是买方押注执行继续兑现。可比公司确认，AI 基础设施公司交易倍数跨度可以很大——从 CoreWeave 的 4.5x 到 Fireworks
              拟议的 18.75x——因此任何单一倍数的精确度都低。Modal 最可辩护的锚点是「具备已验证 Sandbox 牵引力的高端开发者云」，其价值更接近 12–16x 区间，而不是 4–8x 的原始算力区间。
