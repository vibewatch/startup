  - id: TI004
    title: 资本充足性表
    columns:
      - 指标
      - 公开数值 / 状态
      - 有来源支撑的含义
      - 尽调问题
    rows:
      - - 总融资额
        - 约 $465M（seed 约 $7M、Series A 约 $16M、Series B 按公司上下文约 $110M、Series C $355M）
        - 对一家 2021 年成立的公司而言，资本基础充足；为继续采购 GPU 和团队增长提供缓冲。
        - 确认 seed 和 Series A 的准确金额；解决 Sacra / $110M Series B 差异。
      - - 最近融资（Series C）
        - 2026 年 5 月以 $4.65B post-money valuation 融资 $355M，由 General Catalyst 和 Redpoint 共同领投
        - 顶级投资方新近领投大额融资；若以 120–180 人基础设施公司的典型 burn rate 估算，runway 很充足。
        - 提供交割后现金余额和董事会批准的资金用途计划。
      - - 年化收入
        - '> $300M ARR，截至 2026 年 5 月（公司披露）'
        - 若收入按披露速度增长，即便尚未完全盈利，业务也可能在毛利基础上接近自我可持续。
        - 提供月度 ARR 和毛利率，以判断贡献利润率轨迹。
      - - 员工数和 OpEx proxy
        - Series C 博客称 120+；LinkedIn 人员页面约 180
        - 以 150 人（中点）团队在 NY/SF 的市场薪酬估算，福利和基础设施前的年度现金薪酬约 $25–40M+；总 burn 可能为每年 $50–100M+（仅估算区间）。
        - 提供按职能划分的实际员工数、总现金薪酬和月度经营现金 burn。
      - - 现金余额 / 月 burn / runway
        - 未公开披露
        - 没有这些数据，无法承保资本充足性；$355M 融资说明 runway 可能足够，但不能确认。
        - 提供当前非受限现金余额、过去 6 个月平均 burn，以及 base 和 downside 情景下的 runway。
      - - 计划资金用途
        - 规模化低延迟推理；RL / 训练循环；Sandbox 扩展；NY、SF、Stockholm 团队增长
        - 投资目标是产品和团队，而非硬件资本开支；与轻资产模型一致。
        - 提供未来 18 个月按职能和产品划分的 capex/opex 预算。
      - - 债务 / 项目融资 / 云承诺义务
        - 无公开披露；GPU 容量通过未披露商业条款从超大云厂商采购
        - 没有公开披露不等于没有义务；云 committed-use 折扣通常要求最低支出承诺。
        - 提供所有债务额度、云供应商最低支出承诺、预留容量义务和重大供应商条款。
    notes: 融资历史引用自 Company Overview 章节；本表只为资本充足性输入生成本地 Financials claims。现金、burn、runway 和义务事实仍属私有。
