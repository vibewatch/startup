      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              在直接无服务器同行中，Modal 和 Baseten 对生产推理工作负载最直接互为替代，但二者打包哲学不同。Modal 是纯 Python SDK：开发者用 `@app.function()`
              装饰器包裹函数，再调用 `.remote()` 在云端执行，容器构建和多云调度自动完成。Baseten 依赖 Truss 框架（一种基于 YAML 的模型打包标准），并提供明确的推理优化栈，包括定制
              kernel、speculative decoding 和 KV-cache 管理——这些能力不在 Modal 的通用平台中。Baseten 还提供前线部署工程师（FDEs）作为高接触支持模式，这是 Modal
              未公开宣传的高端差异点。Replicate 的差异更根本：面向社区的模型库（Flux、Stable Diffusion 等公开模型）是主要用户漏斗，私有定制部署只是次级用例。Replicate
              私有模型按专属硬件的 setup time、idle time 和 active time 计费，不同于 Modal 的 scale-to-zero 无服务器计费模型。Beam Cloud 在单一平台内提供
              sandboxes（用于智能体代码执行的安全容器）、GPU 推理和明确的多云路由，并支持 Docker-in-Docker 和 GitHub Actions 部署集成。Modal 的 Sandbox
              产品（同样运行在 gVisor 安全容器中）直接竞争 Beam Cloud 的 sandbox 以及 Azure Container Apps 面向智能体代码执行工作负载的 Sandbox。原始 GPU
              云方面，RunPod 的 FlashBoot 实现低于 200ms 冷启动（供应商口径），而 Modal 预热容器冷启动约一秒。RunPod 运营两层基础设施：来自数据中心合作伙伴的企业 Secure
              Cloud，以及来自经筛选个人主机的 Community Cloud。Lambda AI（原 Lambda Labs）已重新定位为完整 Superintelligence
              Cloud，面向大型基础模型训练和推理，并具备 ISO 27001、ISO 27017、ISO 27701、ISO 22301 和 SOC 2 Type II 证明；该合规姿态目前超过 Modal
              的公开认证。CoreWeave 面向最大规模集群（H100/B200/GB200）提供 96% 集群 goodput，并声称相对 hyperscalers 推理启动快 10x。Hyperscaler
              原生选项中，Google Cloud Run 的按需 NVIDIA L4 GPU 实例 5 秒启动并可 scale to zero，占据了 Modal 入门级 GPU
              产品同一工作负载空间的有意义部分。Google 的 Gemini Enterprise Agent Platform（截至 2026 年 6 月已由 Vertex AI 改名）提供 200+ 模型、Agent
              Studio、定制训练和 MLOps 工具——平台范围比 Modal 广得多，但在定制模型部署上没那么 Python 原生。Azure Container Apps Serverless GPUs
              提供按秒计费、scale-to-zero，以及明确用于执行 AI 生成代码的 Sandbox 模式，在 Azure 生态内镜像了 Modal 的 Sandbox 功能。
