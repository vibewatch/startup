      - number: '1.4'
        title: 产品规模、客户证明与里程碑
        blocks:
          - type: paragraph
            body: >-
              抓取语料中的客户案例不断增加，已经大幅验证 Modal 的规模叙事。Reducto 将其 30+ 模型推理流水线迁移到 Modal 后，P90 延迟降低 3x，并在一小时内扩展到超过 1,000
              GPUs。Zencastr 扩展到 1,500 张并发 GPU，在数天内处理了数百年的播客音频。Quora 在 Poe AI 聊天机器人平台中使用 Modal Sandboxes
              做安全代码执行，节省了相当于两名工程师的持续基础设施工作。Substack 将其整个 ML 组合（垃圾检测、推荐、转写、图像生成）的训练和部署从 AWS SageMaker 迁移到 Modal。服务
              DoorDash、Cognition 和 Mercor 的强化学习公司 Applied Compute 称，Modal 是唯一在 RL 循环每一层都提供合适 primitives 的基础设施选择。Series C
              博文还点名 Physical Intelligence（机器人推理延迟 10–15 ms）、Suno（每天在数千张 GPU 上生成数百万首歌曲）、Cognition（面向编码智能体的数百万个
              Sandboxes）、Decagon（自然客户对话 p90 延迟 342 ms）和 DoorDash（智能体商务基础设施）为活跃客户。编码智能体解决方案页面引用了 Lovable（数万个同时进行的应用创建会话）和
              Ramp（全上下文后台编码智能体）。LLM 解决方案页面引用了 Allen AI、Substack 和 Reducto。从这些客户看，Modal 已在医疗
              AI、机器人控制、音频、文档处理、代码生成、智能体商务和社交平台中跑通生产部署。技术前沿方面，Modal 于 2026 年 5 月发布详细博客，描述实现亚秒级 GPU 冷启动的四项技术：空闲 GPU
              的云缓冲、自研内容寻址容器文件系统、CPU 侧进程 checkpoint/restore，以及 CUDA checkpoint/restore。公司状态页显示，截至 2026 年 6 月 14 日，GPU
              functions 90 天 uptime 为 99.946%，CPU functions 为 99.938%。负面运营信号是：2026 年 6 月 3 日 Hacker News
              帖子引用社区用户说法，称一个月内发生三次重大中断（2026 年 5 月 7 日、5 月 19 日和 6 月 3 日），其中 6 月 3 日事件被描述为内部认证系统故障。尽管状态页显示汇总 uptime
              比例很高，这一负面信号对可靠性尽调仍然重要。
