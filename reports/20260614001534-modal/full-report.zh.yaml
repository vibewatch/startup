        blocks:
          - type: paragraph
            body: >-
              Modal 披露的客户集覆盖六类清晰原型。最大可见 cohort 是 AI-native software builders——产品本身就是 AI 应用的公司；买方是 ML 工程师和平台团队，需要弹性 GPU
              compute，但不想管理 clusters。Lovable（$75M ARR，AI app generation）、Cognition（Devin coding agent）、Decagon（voice
              AI）和 Applied Compute（为 DoorDash 与 Cognition 做 RL agent training）都在这一类。第二类是 enterprise SaaS 和
              fintech：Ramp（fintech，$10B+ GMV platform）、Quora（Poe，400M monthly unique visitors）和 Blend（面向数百个银行环境的
              mortgage technology）。第三类覆盖 media 和 content platforms（Suno music generation、Runway video
              characters、Zencastr podcast AI），GPU demand 随消费者使用模式高度波动。Computational biology（Chai Discovery drug design）和
              robotic AI（Physical Intelligence real-time inference）补齐具名客户基础。Sacra 2026 年分析估算 Modal 服务数千个 ML teams，并把
              Meta 的 Code World Models 团队列为值得注意的 logo。所有分部中，买方通常是 ML、platform-engineering 或 applied-AI 团队，他们更看重
              Python-native 易用性和即时扩展性，而不是更底层的控制权。可见客户群仍以 AI-native startups 和中型科技公司为主；fintech 和 banking
              之外的传统企业名称在公开记录中稀疏，Runway Characters 公告（提到 Fortune 10 companies）部分填补了缺口，但没有完全关闭。
