  - id: TI002
    title: 定价 / 变现表
    columns:
      - 价格 / 单位 / 合同
      - 标价与实际定价
      - 折扣 / 未知项
      - 有来源支撑的含义
    rows:
      - - Starter：$0/月 + 计算
        - 纯标价；含 $30/月免费计算额度
        - 无公开转化数据、ARPU 或激活率
        - 带计算补贴的实质免费试用；漏斗入口摩擦低。
      - - Team：$250/月 + 计算，含 $100/月额度
        - 标价已确认
        - 量级折扣未公开；升级触发点（并发限制、自定义域名）清晰
        - 每个 workspace 有可预测的 $250 MRR，再叠加计算扩张；付费订阅 ARR 取决于 workspace 数量。
      - - Enterprise：定制定价
        - 报价制；量级折扣、嵌入式工程、更高 GPU 并发、合规
        - 最低计算承诺、ACV、续约条款均未披露
        - Enterprise 层是收入收益率和利润率最偏离标价的地方；属于关键尽调目标。
      - - CPU 计算：$0.00003942/core/sec（约 $2.37/core-hr）
        - 标价（定价页，Wayback 2026 年 6 月快照）
        - Enterprise 谈判费率未知
        - 对云服务商而言，精确到秒的 CPU 费率透明度少见。
      - - Memory：$0.00000672/GiB/sec（约 $0.024/GiB-hr）
        - 标价
        - Enterprise 谈判费率未知
        - 内存定价可从定价页独立验证。
      - - GPU 示例（定价页）：serverless 约 $3.95/GPU-hr，传统云 $3/GPU-hr
        - 定价页上的示例标价；不是按具体 GPU 类型列出的费率表
        - 实际按 GPU 类型的定价无法在公开归档中取得；RunPod 列出 H100 SXM 为 $3.29/hr，可作对比
        - Modal 的 serverless 溢价温和（相对 RunPod H100 SXM 约 20%），也低于纯托管云替代方案。
      - - AWS/GCP marketplace 集成
        - 合同机制；Modal 通过超大云 marketplace 交易
        - 无公开抽成率或 marketplace 折扣披露
        - 降低企业采购摩擦；marketplace 费用会略微压低实际收入。
    notes: 标价透明度高于多数私有基础设施同行；实际企业收益率、按 GPU 类型的费率和 marketplace 经济性均未披露。
