      - number: '5.4'
        title: 信任、安全与可靠性
        blocks:
          - type: paragraph
            body: >-
              以 late-stage 私有公司标准看，Modal 的信任姿态较强。安全文档写得具体：worker runtime 和 storage infrastructure 用
              Rust（一种内存安全语言）编写，所有容器工作负载运行在 gVisor 内，所有 public APIs 使用 TLS 1.3，所有用户数据在传输中和静态状态下加密，自动 synthetic monitoring
              持续检查 runtime 内的网络和应用隔离。SOC 2 Type II 已通过且未发现偏差（2025 年 1 月审计），Modal 承诺每年续审。Enterprise 计划在 BAA 下支持
              HIPAA-compliant workloads，但 Volumes v1、Images（不含 Filesystem/Directory Snapshots）和 Memory Snapshots 目前排除在
              BAA 范围外；Volumes v2 在范围内。私有漏洞赏金计划通过 HackerOne 运行，并公布严重程度 SLA（Critical：24 hours；High：1 week；Medium：1
              month）。Stripe 在 PCI Level 1 认证下处理支付；Modal 不存储信用卡信息。公司安全控制包括 SSO IdP、抗钓鱼 MFA、Secureframe MDM
              和年度业务连续性演练。trust.modal.com 的 trust portal 提供合规文件访问。账本另一侧：状态页（2026 年 6 月 14 日）显示，过去 90 天 GPU functions
              uptime 为 99.946%，CPU functions 为 99.938%，Web endpoints 为 99.933%，Snapshot restores 为
              99.782%——数字都扎实。不过，Hacker News 社区帖子（2026 年 6 月 3 日）记录一个月内三次重大运营事件：5 月 7 日（AWS AZ overheating，SEV 1）、5 月 19
              日（没有公开 incident report）、6 月 3 日（内部认证系统故障）。整体 uptime 统计与这种短时宕机相容，但一个月三次集中出现是负面信号。Modal 未披露 Standard 或 Team
              计划的公开 contractual SLA；enterprise SLA 条款只在谈判合同中提供。尽调应索取 SLA exhibits。
