      - number: '1.3'
        title: 融资历史、估值与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Modal 已完成三轮确认的机构融资。Redpoint Ventures 组合公司页面明确称，其于 2023 年首次投资 Modal 的 Series A。用户提供的背景显示，Series B 于 2025 年
              10 月完成，规模 $110M，投后估值 $1.1B，Redpoint 和 Sutter Hill Ventures 领投；抓取到的公开语料未独立确认该轮（未检索到新闻稿或官方公告），因此本报告按公司推断 /
              部分验证处理。最近且明确确认的一轮是 2026 年 5 月 21 日公布的 Series C：$355M，投后估值 $4.65B，由 General Catalyst 和 Redpoint Ventures
              共同领投，Menlo Ventures、Bain Capital Ventures 和 Accel 作为新投资方加入；所有现有主要投资人也参与。Series C 公告明确称，Modal 较 Series
              B「增长五倍」，年化收入已超过 $300M。累计融资约为 $465M+（种子轮加估算 Series A，再加 Series B $110M 和 Series C $355M），但抓取语料没有给出种子轮和
              Series A 的精确金额。General Catalyst 组合公司页面确认该投资，并称 Modal 是「AI 时代的无服务器云」，同时披露该轮 GC 团队包括 Quentin Clark、Max
              Rimpel 和 Katie Keller。Menlo Ventures 的参与由 2026 年 5 月上传的 Menlo CDN 资产（modal.svg）以及 Series C 博文披露名单确认。Bain
              Capital Ventures 被列为新的 Series C 投资方，意味着其并非 Series B 投资人，这与用户提供的背景相矛盾；该冲突作为证据缺口记录。Modal 估值约七个月内从
              $1.1B（Series B）升至 $4.65B（Series C），在 AI 基础设施领域速度极快，说明投资人对 $300M ARR 里程碑信心很高；但毛利率、烧钱速度和增长 cohort 数据仍未披露。
