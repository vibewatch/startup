      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Redpoint Ventures 组合公司页面和多处公开引用均确认，Modal 由 Erik Bernhardsson 与 Akshat Bubna 创立。Erik Bernhardsson 是面向公众的
              CEO 兼联合创始人，最显著的公开入口是其个人博客（erikbern.com）：2022 年 12 月一篇文章公开宣布 Modal（"Long story short: I'm working on a
              super cool tool called Modal"）。Bernhardsson 在机器学习工程社区知名，既是 Annoy 近似最近邻库创建者，也是软件基础设施和 ML
              系统领域活跃博主。本轮抓取未通过一手来源独立确认其此前行业职位，因此排除具体前雇主说法。Akshat Bubna 是联合创始人；截至 2026 年 6 月，抓取到的公开语料未确认其职能头衔（CTO
              或其他）和过往背景，这构成治理透明度缺口。两位创始人之外，本轮成功检索的官方或独立来源没有显示其他具名高管（工程 VP、销售
              VP、CFO、收入负责人等）。董事会同样不透明：抓取来源未披露董事会构成、委员会结构或投资人控制权。对于一家 Series C 后期私人公司，这并不罕见；但结合 $4.65B
              估值和投资人阵容深度，仍值得注意。结构性风险在于，公司呈现出双创始人、创始人主导的叙事，但尚未在公开渠道披露独立治理监督机制。Series C
              博文以公司口吻共同署名，而非点名个别高管，符合紧凑的创始人沟通风格。因此，关键人物风险集中在 Bernhardsson 身上，他是主要外部沟通面孔和技术思想领袖。对于一家 ARR 超过 $300M
              的公司，未公开具名销售负责人或收入负责人同样值得关注。
