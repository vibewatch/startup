              - CV019
              - CV021
              - CV022
              - CV023
          - type: callout
            title: Sandbox 收入超过总 ARR 三分之一；若能持续，就是结构性重估催化剂
            body: >-
              Sandboxes 于 2023 年作为 agent 执行原语推出，到 2026 年 5 月 Series C 时已增长到 Modal 总收入的三分之一以上——达到 Cognition CEO 所描述的、为
              coding agents 同时运行数百万个 Sandboxes 的规模。如果 Sandbox 收入继续快于核心计算增长（agentic workload 浪潮仍处早期），Modal 的叙事就会从「高端 GPU
              云」转为「agentic 基础设施平台」。这一叙事切换会支撑其倍数更接近软件公司而非基础设施公司，这正是牛市情景的机制。
