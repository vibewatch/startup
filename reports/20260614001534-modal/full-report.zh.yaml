  productSummary: >
    Modal 销售按秒计费的无服务器 GPU 和 CPU 计算，无需基础设施管理；商业层级有三档（Starter 免费、Team 每月 $250、Enterprise 定制），Python SDK 是主要开发者入口。其差异化技术栈借助
    GPU 内存快照实现亚秒级 GPU 冷启动（云缓冲、内容寻址容器文件系统、CPU checkpoint/restore 和 CUDA checkpoint/restore）。Sandbox
    产品提供隔离容器，用于执行智能体生成代码；该产品已贡献总收入超过三分之一，使 Modal 从商品化 GPU 租赁走向智能体基础设施。AWS 和 GCP marketplace 集成让企业客户可把既有云承诺支出用于
    Modal，降低采用阻力。
  customerFocus: >
    AI 原生软件开发者、ML 工程与平台团队、强化学习公司、编码智能体运营方，以及医疗、金融科技、媒体、机器人和计算生物学等行业的企业 AI 团队。进入路径由开发者驱动（免费 Starter
    层）；并发上限、合规要求（HIPAA、SOC 2、Okta SSO）和用量承诺经济性推动客户升级到 Team 和 Enterprise。
  businessModel: >
    纯用量计费：客户按 GPU 与 CPU 计算秒数、存储（Volumes）的 GB/天，以及 Sandbox 执行秒数付费——没有席位费，也没有按 token 计量的费用。收入来自三档计划，加上带用量折扣、嵌入式 ML
    工程服务和专属支持的 Enterprise 合同。Startup Program 向早期公司提供免费额度，作为漏斗顶部获客渠道。
