company:
  name: Freenome
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Freenome is a clinical-stage multi-cancer early detection company founded in 2014 in South San Francisco,
    combining blood-based multi-omics with AI/ML to detect cancer at early stages. The company has raised
    approximately $1.5B and is pursuing a SPAC merger valuing it at $1.1B post-transaction.
sections:
  - id: identity-and-mission
    title: Identity, business model, and current stage
    body: >-
      Freenome Holdings, Inc. is a clinical-stage biotechnology company headquartered in South San Francisco,
      California, focused on multi-cancer early detection (MCED) through a routine blood draw. The company
      was founded in 2014 by Riley Ennis, Charlie Vaske, and Gabriel Otte, with a mission to detect cancer
      at its earliest and most treatable stages using a proprietary multi-omics platform that integrates
      cell-free DNA (cfDNA) methylation, protein biomarkers, metabolomics, and immunomics signals with
      machine learning algorithms. Unlike single-analyte liquid biopsy approaches, Freenome's multiomics
      platform analyzes multiple biological signal layers simultaneously, aiming to maximize sensitivity and
      specificity for early-stage cancer detection. The company operates as a private entity as of July 2026,
      though it announced a SPAC merger with Perceptive Capital Solutions Corp in December 2025. The lead
      clinical program targets colorectal cancer screening, with the HARMONY Phase 3 trial completed and a
      target product launch in 2026. Freenome's business model centers on developing and commercializing
      laboratory-developed tests (LDTs) and pursuing FDA approval for its blood-based screening tests, with
      a long-term vision of a multi-cancer screening panel sold through physician ordering channels and
      potentially direct-to-consumer pathways.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      Riley Ennis serves as CEO and co-founder, having started the company at age 21 after dropping out of
      a computational biology program. Ennis has led Freenome through multiple funding rounds and the SPAC
      transaction, demonstrating ability to attract tier-one healthcare investors. The leadership team
      includes Jacob Kirkegaard as President, who joined from Roche Diagnostics bringing commercial
      expertise in diagnostics go-to-market, and scientific leadership including chief medical and scientific
      officers with backgrounds in oncology genomics and clinical trial execution. The board composition
      reflects the investor base, with representation from Perceptive Advisors and other major shareholders.
      Key-person risk is moderate: while Ennis is the public face and strategic driver, the company has
      built a deep scientific bench including veterans from Illumina, Grail, Foundation Medicine, and Roche.
      Governance has been typical for a late-stage venture-backed biotech, with board seats allocated to
      major investors. The pending SPAC transaction will introduce public-company governance requirements
      including independent board members and SOX compliance. There have been no publicly reported governance
      controversies, though co-founder Gabriel Otte departed the CEO role in 2016 with Ennis assuming the
      position, representing an early leadership transition that was resolved without public disruption.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO002
  - id: funding-and-capital
    title: Funding history, valuation, and capital structure
    body: >-
      Freenome has raised approximately $1.5 billion across multiple funding rounds since its founding,
      making it one of the best-capitalized private cancer diagnostics companies globally. The funding
      trajectory includes a $65 million Series A in 2017 led by Andreessen Horowitz with participation from
      Google Ventures, a $160 million Series B in 2019, a $270 million Series C in 2020 led by Bain Capital
      Life Sciences and RA Capital Management, and a $250 million Series D in 2022 led by Perceptive Advisors
      and Andreessen Horowitz. In December 2025, Freenome announced a definitive agreement to merge with
      Perceptive Capital Solutions Corp (NASDAQ: PCSC), a special purpose acquisition company, through a
      transaction supported by a $240 million PIPE at $10 per share. The post-transaction equity value was
      announced at $1.1 billion, implying significant down-round dynamics relative to the rumored $4+ billion
      valuation at the Series D round. The shareholder vote for the SPAC merger is scheduled for July 9, 2026,
      meaning Freenome remains private as of the research date. Capital adequacy appears sufficient to fund
      operations through commercialization given the PIPE proceeds plus existing cash, though exact runway
      depends on the pace of commercial launch spend and clinical trial costs for the lung cancer program.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
