      - TO003
    figureRefs:
      - FO003
  - id: milestones-and-partnerships
    title: Milestones, partnerships, and adverse events
    body: >-
      Freenome's milestone chronology spans founding in 2014 through multiple financing events, clinical
      trial execution, regulatory interactions, and strategic partnerships. The most significant clinical
      milestone is the completion of the HARMONY Phase 3 registrational trial for colorectal cancer screening,
      which enrolled approximately 25,000 average-risk adults aged 45-85 across more than 200 clinical sites
      in the United States. The trial was designed to support both FDA PMA submission and CMS coverage
      determinations. Strategic partnerships include a significant licensing deal with Roche announced in 2021
      for early cancer detection biomarkers, validating Freenome's multi-omics approach and providing
      non-dilutive capital. Freenome also has a collaboration with Exact Sciences in the colorectal cancer
      screening space. On the adverse side, the company experienced significant valuation compression from
      rumored $4+ billion at Series D to $1.1 billion at the SPAC transaction, reflecting broader biotech
      market corrections, longer-than-expected timelines to commercialization, and competitive pressure from
      Guardant Health's Shield test which received FDA approval in 2024. The timeline from founding to
      potential commercial product spans over 12 years, which is notable even for clinical-stage diagnostics.
      Multiple leadership changes occurred in the early years, though the team has been stable since 2018.
    claimRefs:
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
      - CO034
      - CO035
    tableRefs:
      - TO004
    figureRefs:
      - FO001
  - id: scale-and-metrics
    title: Scale metrics and diligence gaps
    body: >-
      As a pre-revenue clinical-stage company, Freenome's scale metrics are measured in research and
      clinical execution rather than commercial traction. The company reports approximately 300 employees
      as of mid-2025, concentrated in South San Francisco with laboratory operations and computational
      biology teams. Freenome has processed samples from over 25,000 clinical trial participants through
      its CLIA-certified laboratory. The company has published peer-reviewed research in journals including
      Nature Medicine and presented data at major oncology conferences including ASCO and AACR. Revenue
      is effectively zero pending commercial launch, with the company fully dependent on venture capital
      and the pending SPAC proceeds for operating capital. Key diligence gaps include exact burn rate,
      detailed headcount trajectory, specific HARMONY trial performance data (sensitivity and specificity
      numbers have not been publicly disclosed as of July 2026), and the precise timeline for FDA submission.
      The absence of publicly reported revenue, unit economics, or even pricing strategy creates material
      gaps for financial modeling that later chapters must address explicitly.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO039
      - CO040
      - CO041
      - CO042
