callouts:
  - calloutType: risk
    title: Significant valuation compression signals market skepticism
    body: >-
      The decline from a rumored $4+ billion valuation at Series D to $1.1 billion at the SPAC transaction represents
      a ~75% compression, reflecting competitive pressure from Guardant Health's approved Shield test, extended
      development timelines, and the broader biotech market correction of 2022-2024.
    claimRefs:
      - CO023
      - CO024
      - CO030
  - calloutType: strength
    title: Deep multi-omics platform with $1.5B invested in R&D
    body: >-
      Freenome's combination of cfDNA, protein, metabolomic, and immunomic signals represents one of the most
      comprehensive multi-analyte approaches in cancer screening, supported by extensive capital investment and
      partnerships with Roche and Exact Sciences.
    claimRefs:
      - CO003
      - CO004
      - CO015
      - CO027
