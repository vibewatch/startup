- id: people-and-execution-risks
  title: People, execution, and financial risks
  body: 'Execution and financing risk are tightly linked because Freenome is trying to commercialize after a long pre-revenue development cycle in a category that still demands field reimbursement work, lab scale-up, and physician behavior change. The company has attracted substantial capital and has a visible founder-led story, but that does not remove key-person concentration around Riley Ennis or prove that the public-facing leadership bench already matches the operational demands of a nationwide screening launch. Public reporting continues to frame exact runway and cash-burn composition as live questions rather than closed ones, and healthcare SPAC conditions remain volatile enough that investors cannot assume the announced transaction fully insulates the company from another financing need. The result is a familiar but real late-stage biotech risk profile: real assets, meaningful partners, and still-material uncertainty about whether the organization can convert science into disciplined
    commercial execution before cash pressure returns.'
