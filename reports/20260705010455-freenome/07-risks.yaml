  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: clinical-performance
    missingEvidence: A full HARMONY performance package with sensitivity, specificity, stage mix, false-positive rate, and subgroup analyses versus standard comparators.
    whyItMatters: Without exact Phase 3 performance data, investors cannot judge whether Freenome deserves a premium launch probability or simply a longer and riskier wait.
    diligencePath: Request the investor / lender diligence deck, PMA-ready statistical summary, and any physician-market-access briefing materials tied to HARMONY.
    relatedQuestionRefs:
    - QR001
  - type: missing-source
    severity: material
    topic: legal-history
    missingEvidence: Counsel-grade searches for litigation, demand letters, regulator correspondence, or material complaint history specific to Freenome.
    whyItMatters: A clean public search is not the same as a clean legal history, and a hidden dispute can change both timing and underwriting confidence.
    diligencePath: Run external counsel docket and regulator searches, then obtain a management representation letter covering litigation, enforcement, and IP challenges.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Month-end cash, debt or working-capital constraints, quarterly burn bridge, and redemption-sensitive post-close runway scenarios.
    whyItMatters: The launch case can look attractive in principle and still fail in practice if the company does not have enough cash to absorb regulatory or commercial slippage.
    diligencePath: Request the latest board package, cash waterfall, minimum-cash covenant analysis, and management base / downside runway model.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: commercial-org-depth
    missingEvidence: A detailed launch organization chart covering field sales, market access, medical affairs, compliance, patient navigation, and partner-management roles.
    whyItMatters: Public leadership visibility alone does not prove that Freenome has the operational depth to execute a national screening rollout without partner overdependence.
    diligencePath: Request launch headcount by function, open requisitions, territory design, payer-priority map, and Exact role split by workstream.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Economic schedules, pricing-control rights, exclusivity boundaries, milestone terms, and termination mechanics for the Exact and Roche agreements.
    whyItMatters: Partner announcements validate demand, but underwriting still depends on who actually controls margins, launch pace, and strategic degrees of freedom.
    diligencePath: Review executed agreements and side letters with counsel, then bridge partner economics into the company operating model and downside cases.
    relatedTableRefs:
    - TR003
    - TR005
