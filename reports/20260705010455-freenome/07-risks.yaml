chapter:
  number: 7
  title: Risks
  summary: 'Freenome’s risk profile is dominated by a simple but unforgiving chain: unpublished Phase 3 performance keeps FDA timing uncertain, uncertain timing delays reimbursement and launch, and delayed launch prolongs cash burn in a category where Guardant is already approved and commercial. The company still has credible assets—large trial execution, Exact and Roche partnerships, and a differentiated multi-omics story—but the residual risk stays high because several underwriting-critical facts remain private, including HARMONY sensitivity/specificity, exact cash runway, partner economics, and launch-organization depth.'
sections:
- id: regulatory-and-legal-risks
  title: Regulatory, legal, and reimbursement risks
  body: 'Regulatory risk is still the first lens because Freenome has not yet crossed the two milestones that make a blood-based screening thesis underwritable at scale: a disclosed registrational performance package and a cleared path to durable reimbursement. HARMONY enrollment is complete, but public materials still stop short of giving investors the exact sensitivity and specificity numbers that would let them compare Freenome directly with Shield, FIT, colonoscopy, or other noninvasive options. That missing disclosure matters more now that Guardant has already established an FDA-approved and commercially available benchmark. CMS has already shown that blood-based colorectal screening can win category coverage, but that does not guarantee that Freenome will receive the same treatment on the same timeline. Add ongoing LDT-policy litigation, molecular-diagnostics patent risk, and healthcare fraud-and-abuse obligations, and the regulatory and legal stack remains the chapter’s highest-conviction
    source of launch delay risk.'
  claimRefs:
