chapter:
  number: 4
  title: Financials
  summary: >-
    Freenome is still a pre-revenue diagnostics company, so this chapter is fundamentally about future unit economics and capital sufficiency rather than current operating results. Public evidence supports a plausible physician-ordered, payer-billed CRC screening model with attractive long-run gross margins if reimbursement lands near the current Medicare anchor, but it also supports a high-risk near-term picture: large launch costs, estimated annual burn that can consume the PIPE inside roughly 12-19 months, and material disclosure gaps around cash on hand, assay COGS, and sponsor dilution.
sections:
- id: revenue-model-and-recognition
  title: Revenue model, revenue quality, and recognition mechanics
  body: >-
    Freenome does not yet have commercial product revenue, so the quality question is prospective rather than historical. The likely model is straightforward in structure even if not yet proven in volume: a physician orders a blood-based colorectal cancer screening test, a specimen is collected and processed through Freenome's CLIA laboratory workflow, results are reported back to the ordering provider, and the laboratory then bills Medicare, Medicaid, or commercial payers for the completed assay. That means revenue is expected to be transactional, fee-per-test, and tied to medical-necessity and coverage rules rather than software subscriptions or upfront licenses. Potential non-test inflows such as Roche biomarker milestones or the Exact Sciences collaboration may help cash needs, but public disclosures do not establish them as dependable operating revenue. The practical consequence is that near-term financial quality depends on reimbursement, physician ordering behavior, and clean claims
    collection, while current revenue remains effectively zero until launch begins.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI031
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-and-monetization
  title: Pricing anchors, payer logic, and monetization range
  body: >-
    Pricing is not publicly posted by Freenome, so the best supportable lens is anchoring to the newly created blood-based colorectal cancer reimbursement category. Medicare reimbursement near $920, established through the Guardant Shield pathway, is the clearest public benchmark because it shows what a covered blood-based CRC screen can earn in the market Freenome most needs to enter. That anchor makes the estimated $500-$1,500 Freenome launch range plausible, but it should not be mistaken for realized net price. Commercial plans may discount below list, and early contracting can differ materially by channel and geography. Freenome could argue for premium positioning if HARMONY data show stronger sensitivity or convenience-adjusted utility, but that upside still depends on regulatory acceptance and payer confidence. For underwriting, the right takeaway is that category pricing now exists, yet Freenome's own realized price, denial rate, and payer-mix economics are still unproven.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI002
- id: unit-economics-and-launch-costs
  title: Cost structure, gross margin path, and launch spending
  body: >-
    The attractive part of the model is that a reimbursed blood-based screening test can carry strong gross margin once assay operations scale, but the unattractive part is that launch-period economics are likely much worse than steady-state margins imply. Public company comps and liquid-biopsy cost benchmarks support test-level COGS around $100-$300 once operations are efficient, which can translate into 60%-75% gross margin at scale if reimbursement stays near the current Medicare anchor. The risk is that early commercial batches are rarely optimized: reagent costs are higher, automation is incomplete, and bioinformatics compute plus lab overhead can push launch COGS into a less attractive band. Above gross margin sits a second cost wall: field sales, medical affairs, market access work, PMA preparation, and laboratory capex. Those costs are heavy enough that positive test-level margin does not automatically mean near-term operating profitability, especially for a first launch into primary-care
    screening.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI024
  - CI026
