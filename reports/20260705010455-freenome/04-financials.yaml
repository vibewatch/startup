    - Clinical performance drives payer negotiations, price, and adoption speed
    - Review full readout package and payer feedback before underwriting revenue ramps
  - - SPAC sponsor promote dilution
    - Dilution changes per-share economics and effective cash per share
    - Review definitive proxy / prospectus for promote, forfeiture, earnout, and fully diluted share count
