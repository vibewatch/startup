            body: >-
              资本故事比损益表更清楚，但仍不完整。公开来源支持按每股 $10 计算的 $240M PIPE，以及约 $1.5B 的累计融资；但它们没有披露 Freenome 在 SPAC
              交割时或交割后的确切现金余额。这个缺失的现金数字很关键，因为估计每年约 $150M-$250M 的现金消耗意味着，单靠 PIPE 可能只覆盖约 12-19 个月运营。管理层对资金有多种合理用途，包括 CRC
              商业化、继续推进肺癌项目和一般公司用途；但每一项都在争夺同一个资金池。合并后的上市公司报告应会提高可见度，但不会降低底层现金需求。如果商业化推迟或上线采用缓慢，Freenome
              很可能在更广泛多癌种野心能够自我供血之前，就需要后续融资。
