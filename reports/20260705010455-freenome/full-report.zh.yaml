              耐久性是公开证据最薄弱的地方。保留来源没有披露 Freenome 净收入留存、毛留存、流失、续约节奏或头部客户集中度；这对一家上线前诊断公司并不意外，但仍留下真实承销缺口。当前最好的重复使用
              替代指标是筛查间隔本身：现行指南和覆盖基准指向年度 FIT、三年一次粪便 DNA 和血液检测、十年一次结肠镜，因此成功的血液检测业务最终应更像一个重复性预防保健品类，而不是一次性急性诊断。这个
              替代指标不等同于留存，因为每个阳性非侵入性检测仍需要结肠镜跟进，医生是否愿意再次开单也取决于证据质量、支付方覆盖和流程简洁度。渠道侧也有集中度风险：Exact Sciences 可以加速触达，也可能成为
              Freenome 接触医疗系统和支付方的主导入口。
