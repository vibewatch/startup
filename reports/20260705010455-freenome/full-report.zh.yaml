      - number: '2.2'
        title: 规模测算、TAM 逻辑与相互矛盾的公开估计
        blocks:
          - type: paragraph
            body: >-
              这个市场大到值得关注，但不干净，不能用一个标题数字概括。全球范围内，跨模态癌症筛查支出超过 $50B；公开 MCED 展望大多聚集在 2030 年约 $20B-$30B 区间。方向上有吸引力，但 Freenome
              近期真正的商业机会更窄：美国符合指南资格成年人的血液结直肠癌筛查。用约 1 亿名合格成年人乘以 $100+ 血液检测价格，一个简单口径已经能得到 $10B+ 的品类规模。公开资料也支持全球结直肠癌筛查市场到
              2028 年约 $11B-$12B。未解决的问题不是市场是否存在，而是在 FDA 批准、定价和纳入指南尚未落定之前，公开数据能否隔离出 Freenome 特定的 SAM 或
              SOM。因此，相互矛盾的分析师区间应该保留，不能压成虚假的精确值。
