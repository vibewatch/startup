  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块 / 资产图谱
        blocks:
          - type: paragraph
            body: >-
              Freenome 的产品表面现在已经足够清晰，可以按真实交付系统来承销，而不是把它当成研发口号。公开页面显示了一个有名称的主力产品 SimpleScreen
              CRC，一个围绕抽血加流程支持搭建的医疗系统包装层，以及一个既承担验证引擎又构成管线资产基础的临床研究项目。这一点很重要，因为公司卖的不是血液癌症筛查这个想法本身；它试图商业化的是一套可常规化的筛查流程，能够嵌入初级保健和医疗系统运营。同一个产品表面也显示出公开边界所在。CRC
              显然是最成熟用例，肺癌和更广泛多癌种扩展仍是后续项目。换句话说，现有证据支持一个产品家族：一个近期主力资产，周围围绕若干验证和扩展资产，并配有面向医疗系统的流程叙事；但还不是一个完全透明的多产品菜单，也没有披露附加率或服务水平细节。
