      - number: '5.4'
        title: 监管路径与质量 / 合规姿态
        blocks:
          - type: paragraph
            body: >-
              合规姿态可信，但不完整。Freenome 公开披露其拥有 CLIA 认证的高复杂度临床实验室，明确说明 SimpleScreen CRC 尚未获得 FDA 许可或批准，并在 2025 年 JAMA
              结果公告中把投资人指向 PMA 路径。这种透明度有帮助，因为它清楚地区分了当前基于 CLIA 的运营能力，与市场最终关心、仍待完成的 FDA
              里程碑。与此同时，公开尽调文件仍未给出买方或投资人想要的所有信息。已审查来源没有确认实验室具备持久公开的 CAP 名录，没有浮现产品特定 HIPAA 控制映射，也没有披露常规运营的周转时间 SLA
              或经验证的样本稳定性容差。外部技术文献进一步说明这些细节为何重要：血浆蛋白组学和 ctDNA
              流程对预分析、检测设计和混杂信号高度敏感。因此，信任姿态方向上不错，但仅靠公开材料，它仍更像证据性支持，而非完全可审计状态。
