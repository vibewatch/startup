        - PCP 或高级执业临床医生 / 诊所人员 / 支付方承担的预防福利
        - 面向可能不完成结肠镜或粪便检测的平均风险成人，开展常规筛查沟通
        - USPSTF、ACS、NCCRT 和 AGA 都把平均风险筛查定位为广泛的初级保健工作流
        - 如果血液检测成为可完成的预防选项，这将是最大的开单入口
        - 没有公开重复开单意向、销售效率或上市账户数据
      - - 胃肠科医生
        - GI 专科医生 / 内镜团队 / 支付方承担的预防或诊断路径
        - 替代性非侵入选项，加上血液或粪便检测阳性后的结肠镜随访
        - 即便首筛为非侵入方式，指南和随访规则也让 GI 继续参与
        - 重要的转诊、随访和可信度把关人群
        - 公开证据未显示专科医生对 Freenome 自身的开单行为
      - - 医疗系统、IDN 和社区医院
        - 人群健康负责人 / 采血与实验室运营 / 风险共担或按服务付费预算
        - 部署采血、结果流转、提醒和后续结肠镜闭环的运营流程
        - PREEMPT 覆盖社区医院、医疗系统、三级医疗中心和教学医院
        - 可能把大规模筛查人群集中到少数企业级关系里
        - 尚未披露已签约的启动客户或系统级合同条款
      - - Medicare 与商业支付方
        - 医疗政策团队 / 理赔管理 / 保险预算
        - 覆盖决定、频率政策和后续结肠镜经济账
        - CMS 已覆盖三年一次的基准血检类别；商业保险态度仍在变化
        - 支付方采纳决定实际价格和可落地的完成量
        - 没有 Freenome 商业保险覆盖组合或拒付率的公开证据
      - - 回避结肠镜或未完成粪便检测的患者
        - 患者 / 导航员 / 保险方或自费的自付风险
        - 面向平均风险成人、以便利性拉动筛查完成
        - ACS 和 AGA 明确把血检放在拒绝筛查或未完成筛查人群里
        - 带来增量完成机会，而不只是从现有方法手里抢份额
        - 患者意愿不会自动变成医生开单或保险覆盖
      - - Exact Sciences 商业化渠道
        - 商业伙伴 / Exact 一线销售和市场准入团队 / 经济利益共享
        - 为未来 Freenome 检测提供潜在共同商业化和支付方准入
        - Exact 公开把广泛的医疗系统和支付方关系列为授权理由之一
