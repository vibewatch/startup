  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Freenome 可能的客户旅程，从筛查回避或未完成开始，经过医生讨论、采血、阳性后的结肠镜随访，最终进入重复筛查提醒。
    data:
      items:
        - label: 筛查惯性或回避
          detail: 成本、不适、可及性缺口、肠道准备反感和认知不足，压低了现有选项的完成率。
          tone: warning
        - label: 初级保健或 GI 就诊
          detail: 临床医生识别平均风险患者，并在粪便、结肠镜或血液方案中选择。
          tone: neutral
        - label: 针对拒绝者的血液检测讨论
          detail: 当前指南主要把血液检测放在拒绝或未完成优先选项的患者身上。
          tone: neutral
        - label: 样本采集与流转
          detail: 采血、实验室物流和结果报告必须嵌入正常医疗系统工作流。
          tone: positive
        - label: 阳性结果后的结肠镜闭环
          detail: 任何血液或粪便阳性结果仍需及时随访结肠镜，才算完成筛查。
          tone: warning
        - label: 重复筛查与扩展循环
          detail: 若获得报销并被临床接受，该模型可按预防节奏重复，并沿支付方和合作伙伴渠道加深。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
      - CU029
      - CU031
      - CU044
      - CU046
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 指数化漏斗显示，公开证据在广泛需求和验证就绪度上最强，在实时商业客户转化上最弱。
    approximationNotes: 指数值仅表示方向。它们概括公开来源中的相对证据强度，而不是公司披露的商业转化漏斗。
    data:
      items:
        - label: 广泛的指南适用筛查基数
          value: 100
          description: CRC 筛查适用于非常庞大的平均风险成人群体，NCCRT 仍报告未筛查占比较高。
        - label: 未筛查或未完成者机会
          value: 62
          description: 45 岁以上成人中超过三分之一未按建议筛查，血液检测瞄准拒绝既有方法的患者。
        - label: 已验证的就绪人群
          value: 25
          description: PREEMPT 招募了约 25,000 名平均风险参与者。
        - label: 运营站点网络
          value: 12
          description: 超过 200 个站点和全国邮编覆盖，显示研究运营范围较广。
        - label: 已披露付费客户层
          value: 2
          description: 公开来源未披露 Freenome 的实时付费客户数量或已签约上市账户基数。
    claimRefs:
