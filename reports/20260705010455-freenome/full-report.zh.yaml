  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与购买模式
        blocks:
          - type: paragraph
            body: >-
              Freenome 的未来客户图谱是多边结构，尽管产品尚未上线。开单表面始于初级保健医生和胃肠科医生，因为符合指南的平均风险成年人通常通过常规就诊、预防性提醒或专科后续进入结直肠筛查。经济支付方通常是
              Medicare 或商业保险，而不是患者；因此，覆盖政策和后续结肠镜规则对采用的影响不亚于医生兴趣。医疗系统和 IDN
              是运营客户，因为它们控制大规模筛查人群中的采血、实验室流转、照护导航和质量指标。患者仍直接重要，因为便利性、避开不适和认知水平决定医生开出的选项是否真正完成。Exact Sciences
              增加了最后一个准客户分群：它不是传统意义上的买方，但可能成为关键商业化渠道，把 Freenome 的检测转化为真实开单量。
