  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 上行证明和下行不确定性如何合并为“继续研究”的建议。
    data:
      nodes:
        - id: thesis
          label: 多组学上行空间 + 大型 CRC 市场
        - id: comp
          label: Guardant 验证品类经济性
        - id: risk1
          label: HARMONY 数据待披露
        - id: risk2
          label: 12 年 R&D / 尚无产品
        - id: risk3
          label: SPAC 稀释 + 投票不确定性
        - id: rec
          label: 建议：继续研究 / 跟踪
      edges:
        - from: thesis
          to: rec
        - from: comp
          to: rec
        - from: risk1
          to: rec
        - from: risk2
          to: rec
        - from: risk3
          to: rec
    approximationNotes: 逻辑流属于定性归纳，抓住信号最强的驱动因素，并未分配明确模型权重。
    claimRefs:
