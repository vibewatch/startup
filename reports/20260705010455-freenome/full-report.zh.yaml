            body: >-
              Freenome 没有公开发布定价，因此最可支撑的视角，是锚定新形成的血液结直肠癌报销品类。通过 Guardant Shield 路径建立的约 $920 Medicare 报销，是最清晰的公开基准，因为它显示了
              Freenome 最需要进入的市场中，有覆盖的血液 CRC 筛查能赚到多少。这个锚让 $500-$1,500 的 Freenome
              上线区间显得合理，但不能把它误当作已实现净价。商业保险计划可能低于标价折扣，早期合约也可能因渠道和地区而明显不同。如果 HARMONY 数据显示更强的敏感性或便利性调整后的效用，Freenome
              可以主张溢价定位；但这一上行仍取决于监管接受度和支付方信心。用于承销时，正确结论是品类定价已经存在，但 Freenome 自身的实现价格、拒付率和支付方组合经济性仍未被证明。
