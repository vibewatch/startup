              竞争对手可分成三类。Guardant 是专注的血液 CRC 上线者，拥有上市公司规模、监管验证和最强报销先发优势。GRAIL 先做广度：Galleri 覆盖 50
              多种癌症，在雇主和医疗系统渠道有商业牵引力，但仍缺 FDA 批准和全国保险覆盖。Exact Sciences 是既有分发机器，靠粪便 DNA 筛查把庞大装机基础变现，并用 Cologuard Plus
              继续扩展。Natera 是相邻肿瘤学平台，当前强项在 MRD 和分子检测而不是预防性筛查；但医生关系和实验室运营能力让它成为观察名单中的进入者。Freenome
