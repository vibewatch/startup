      - number: '8.5'
        title: 最终尽调问题与阻碍
        blocks:
          - type: paragraph
            body: >-
              剩余阻碍很具体，不是理念问题。投资人需要 HARMONY 顶线表现、准确的监管与上市计划、完全摊薄的交易后股本表，以及从合并交割到首次商业拐点之间可信的现金续航桥。还需要弄清 Exact Sciences 和
              Roche 关系到底创造实际经济价值，还是主要提供叙事背书。没有这些答案，任何高于基准情景的估值，都是在本已很宽的不确定性上再叠一层猜测。退出准备同样为时尚早：临床证明落地前，Freenome
              更像一家可能还需要再做一轮私募融资的公司，而不是一家能顺利转成 IPO 级筛查故事的公司。这并不意味着公司永远不可投，但确实让眼下的入场纪律远比主题热情重要。
