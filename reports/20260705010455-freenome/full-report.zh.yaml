      - number: '2.3'
        title: 买方图谱、支付方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              虽然患者是终端用户，购买流程却是多角色结构。初级保健医生和胃肠科医生是一线开单方，因为筛查建议、诊断后续和指南解读都由他们把关。医疗系统和 GI
              诊所是重要机构账户，因为筛查量常常通过质量项目、患者提醒和实验室流转决策来运营，而不是靠一次性检测订单。公共支付方，尤其是
              Medicare，仍是最重要的报销锚；商业保险计划则决定血液检测能多快扩展到更年轻的商业保险人群。采用路径始于符合指南的成年人收到筛查建议，随后在结肠镜、粪便检测或有覆盖且临床认可的非侵入性血液替代方案之间选择。雇主和直接面向消费者渠道确实存在，但仍属次级；核心商业路径仍经过医生开单、支付方覆盖，以及阳性结果后的后续结肠镜。
