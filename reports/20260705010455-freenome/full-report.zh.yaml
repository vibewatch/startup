      - number: '5.3'
        title: 差异化、知识产权与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Freenome
              最强的公开差异化主张，不只是它是一项血液检测；多个竞争对手都能这样说。更强的主张是，相比主要可比公司页面上可见的单模态描述，它当前平台叙事覆盖更丰富的分析物多样性，也有更多模型驱动的信号整合。Guardant
              Shield 公开框架围绕游离 DNA 改变，Galleri 围绕靶向甲基化，Cologuard 围绕粪便 DNA 加血红蛋白；而 Freenome 2026 年披露描述的是 DNA
              甲基化、RNA、蛋白和其他分析物，并用 AI/ML 串联。围绕甲基化测序和基于分类器的结直肠癌检测，公开 IP
              叙事也强化了这种广度；面向从业者的出版物则显示公司内部确实在做模型构建。因此，护城河可能有意义，但仍只被部分证明。公开证据支持差异化技术野心和真实 IP
              支架；它还不能证明，在规模化条件下，更宽的分析物堆栈会稳定转化为比窄路线竞争对手更好的成本、吞吐或临床表现。
