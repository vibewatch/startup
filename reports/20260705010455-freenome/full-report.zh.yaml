        title: 采用约束、相互矛盾的估计与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要警示在于，品类得到验证不等于广泛采用。报销仍是第一道闸门，因为 Medicare
              流程清晰度和血液检测费率设定，仍会影响医疗系统是否把该模态当作常规选项。临床表现阈值是第二道闸门：如果敏感性、特异性和指南纳入不足，医生就缺乏动力改变既有结肠镜和粪便检测流程。假阳性也会带来真实的下游成本和运营摩擦，因为每个阳性筛查结果仍要流向确认性结肠镜。在这些采用摩擦之外，公开市场记录仍未给出干净的
              Freenome 特定 SAM 或 SOM。已发布 MCED 估计从约 $5B 到超过 $30B
              不等，取决于来源是否只纳入筛查、是否包含更广义液体活检、覆盖多个地区，或混合不同癌种假设。用于投资承销时，结论是市场故事可信，但仍受区间和证据约束，而不是能给出单点估计。
