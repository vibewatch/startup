  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Freenome 的多头逻辑很容易理解：如果一项多组学血检能在结直肠癌筛查中拿出清晰差异化的性能，公司就能用一种比粪便采样或结肠镜方便得多的方式切入一个很大的筛查市场。医生友好的抽血流程、广泛的合格人群，加上
              Guardant 已经建立的品类定价锚点，让强劲 HARMONY 数据具备真实上行空间。反论点同样有力。Guardant 已经获 FDA 批准并获得 Medicare 支付，Exact Sciences
              已经掌握工作流和触达，而 Freenome 经过约十二年研发仍未推出产品。这段历史把公司从纯平台叙事变成了临床证明赌注。在 HARMONY 把故事转化为已验证性能之前，最合适的框架是：科学有前景，执行风险异常高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV023
