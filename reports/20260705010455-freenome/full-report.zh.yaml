      - number: '8.3'
        title: 多头、基准与空头情景分析
        blocks:
          - type: paragraph
            body: >-
              情景分析比点估值更重要，因为 Freenome 仍是一家里程碑驱动的公司。多头情景下，HARMONY 结果读出理想，监管路径可信，医生接受血液筛查替代方案，投资人开始按已获批或接近获批的品类领导者为
              Freenome 定价；这可以支撑约 $3B 至 $5B 价值。基准情景假设路径更有限：通过较窄渠道上市，报销牵引适中，采用速度较慢，而竞争对手在证据和分销上仍领先，形成约 $1B 至 $2B
              价值。空头情景严厉但符合这一阶段现实：数据令人失望、批准延迟、覆盖薄弱或现金压力，都可能把价值压到约 $300M 至 $500M 区间。因此，当前 $1.1B 估值已经落在基准区间内，而不是多头情景。
            claimRefs:
              - CV025
