            body: >-
              Freenome 选择的商业化路径更快，但比一家凡事自建的公司更重依赖。Exact Sciences
              带来分销杠杆、外勤触达和支付方关系，自己重建这些能力成本很高；但同一套独家结构也把美国上市执行集中到一个激励可能变化的合作伙伴手里。Roche
              增加了美国以外市场和技术可选项，同时也意味着未来路线图的一部分不完全由 Freenome 掌控。竞争压力进一步放大依赖问题。Guardant 已经有获批并上市的血液 CRC 产品，Exact 通过
              Cologuard 掌握既有结直肠筛查工作流，GRAIL 继续把投资人注意力留在更广的 MCED 野心上。如果血液 CRC 定价向现有 CMS
              锚点收敛，分销触达和证据质量可能比检测架构本身更重要。也因此，合作伙伴对齐和竞争对手节奏是核心战略风险，不是二阶因素。
