              Freenome 仍处于商业化前，因此采用故事最好通过准备度替代指标来读，而不是看收入指标。最强替代指标是 PREEMPT CRC：公开来源支持约 25,000 名平均风险参与者入组、完成入组、超过 200
              个研究中心，以及覆盖美国本土每个 ZIP code 患者的招募设计。这种广度很重要，因为它显示供应方站点参与已经远超单一学术中心，也说明 Freenome
              已经搭建起样本采集和研究协调的运营网络。市场拉力看起来也真实。NCCRT 仍称，45
              岁及以上成年人中超过三分之一未按建议筛查；指南机构也持续强调，需要便利性和选项多样性来弥合缺口。弱点在于商业化证据本身：本组公开来源没有披露 Freenome 的付费客户数量、上线账户基础或复购行为。
