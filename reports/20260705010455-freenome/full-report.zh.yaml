            body: >-
              客户结论是有希望，但仍未被证明。积极一面，Freenome
              围绕一个真实公共卫生问题验证了需求相关性，搭建了庞大且多元的试验网络，并锁定一个覆盖医疗系统和支付方的商业化伙伴。消极一面，同一组公开记录也说明医生采用可能保守。AGA 和 ACS 都把当前血液 CRC
              检测排在既有筛查选项之后，而不是作为直接替代；AGA
              还明确表示，当前血液检测不如既有项目有效，且成本更高。初级保健瓶颈同样重要：人手短缺、职业倦怠、预约延迟和可及性不均，都会压缩新筛查沟通所需的时间和流程余量。最重要的剩余尽调问题很简单：已签约多少上线账户，未来检测量有多大比例依赖
              Exact，真实使用后的医生复购意愿如何，以及后续结肠镜完成率将如何管理。
