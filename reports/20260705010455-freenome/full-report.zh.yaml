      - number: '8.4'
        title: 建议逻辑与否决触发点
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究 / 跟踪，因为公司质量和价格纪律指向不同方向。Freenome
              仍值得密切关注：市场很大，检测方式直观，差异化数据可能快速重估股权。但仅凭公开证据，它还不具备可投资性，因为缺失的输入恰好决定普通股东价值。HARMONY 仍未公布足以支撑溢价倍数的性能指标。SPAC
              投票和赎回结果会改变交割时现金。发起人 promote 机制可能稀释表面入场标记。报销也必须证明 Freenome 自身可持续，而不只是 Guardant
              可持续。因此，投委会应盯住一小组明确的否决触发点，而不是滑入叙事承销。
            claimRefs:
