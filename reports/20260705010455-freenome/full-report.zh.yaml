companyProfile:
  summary: >-
    Freenome Holdings, Inc. 是一家临床阶段生物技术公司，2014 年成立于加州南旧金山。公司用自有多组学平台开发多癌种早筛检测，把游离 DNA
    甲基化、蛋白生物标志物、代谢组学、免疫组学与机器学习算法整合起来，通过一次简单抽血，在癌症最早期发现信号。其主力项目瞄准结直肠癌筛查，HARMONY 3 期注册性试验已于 2025 年完成。公司 2025 年 12 月宣布与
