            body: >-
              能力比较中，CRC 专用产品和更广义 MCED 产品之间的差别最关键。Shield 针对单一用例优化：用抽血面向平均风险人群做结直肠癌筛查。公开比较显示，它在便利性调整后的表现上高于
              FIT，但仍低于结肠镜的诊断和治疗标准。Galleri 赢在广度，因为它筛查多种癌症；但同样的广度削弱了它与单癌种筛查检测的可比性，也让监管路径更难。Exact Sciences
              提供的是另一种完全不同的主张：Cologuard 和 Cologuard Plus 已获批准、已有覆盖，并已嵌入筛查路径，但粪便采集仍是明显的合规拖累，而血液检测正是瞄准这一点。Freenome
              的差异化主张建立在把 cfDNA 与其他分析物类别结合起来；这在战略上有吸引力，但在 HARMONY 敏感性和特异性数据公开前，尚未得到充分外部验证。
