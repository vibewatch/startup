      - number: '1.5'
        title: 规模指标与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Freenome 仍处于临床阶段且尚无收入，规模指标更多体现在研发和临床执行，而非商业牵引力。公司披露截至 2025 年中约有 300 名员工，主要集中在南旧金山，覆盖实验室运营和计算生物学团队。Freenome
              已通过其 CLIA 认证实验室处理超过 25,000 名临床试验参与者的样本。公司在 Nature Medicine 等期刊发表过同行评议研究，也在 ASCO、AACR
              等主要肿瘤学会议上展示数据。商业化启动前收入基本为零，运营资本完全依赖风险投资和待完成 SPAC 的资金。关键尽调缺口包括：确切现金消耗率、详细员工人数变化、HARMONY 试验具体表现数据（截至 2026 年
              7 月，敏感性和特异性数字尚未公开披露），以及 FDA 申报精确时间线。公开资料没有收入、单位经济模型，甚至没有定价策略，这给财务建模留下实质性缺口，后续章节必须明确处理。
