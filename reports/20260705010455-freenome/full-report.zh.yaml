  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局、类别与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Freenome 近期的竞争场并不是一个清晰同业集合，而是分层市场：直接的血液结直肠癌筛查厂商、既有粪便检测和结肠镜等程序型筛查玩家、相邻的多癌种早筛项目，以及少数可能进入者。Guardant Health
              是最清晰的直接基准，因为 Shield 已获 FDA 授权并拿到报销；Exact Sciences 仍是最重要的既有玩家，因为 Cologuard 和 Cologuard Plus
              已掌握结直肠筛查中的医生流程、触达和物流。GRAIL 以更广泛的多癌种野心从相邻角度竞争。Natera 作为当前产品对手没那么重要，但如果把肿瘤学关系重新部署到筛查上，就是可信进入者。结肠镜和 FIT 或
              gFOBT 仍控制现状预算和转诊路径。对大多数医疗系统来说，内部自建并不是主要的实际替代方案，因为受监管检测开发、指南支持和报销基础设施很难在本地复制。
