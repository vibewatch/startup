      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Freenome 已在多轮融资中募得约 $1.5B，是全球资本最充足的私营癌症诊断公司之一。融资路径包括 2017 年由 Andreessen Horowitz 领投、Google Ventures
              参投的 $65M Series A；2019 年 $160M Series B；2020 年由 Bain Capital Life Sciences 和 RA Capital Management 领投的
              $270M Series C；以及 2022 年由 Perceptive Advisors 和 Andreessen Horowitz 领投的 $250M Series D。2025 年 12
              月，Freenome 宣布与特殊目的收购公司 Perceptive Capital Solutions Corp（NASDAQ: PCSC）签署最终合并协议，交易配有一笔按每股 $10 计算的 $240M
              PIPE。公告给出的交易后股权价值为 $1.1B，较 Series D 轮传闻的 $4B+ 估值显示出显著下轮融资压力。SPAC 合并的股东投票定于 2026 年 7 月 9 日举行，因此截至研究日
              Freenome 仍为私营公司。从 PIPE 资金加现有现金看，资本充足性似乎足以支撑公司走到商业化；但具体 runway 取决于商业化启动投入和肺癌项目临床试验成本的节奏。
