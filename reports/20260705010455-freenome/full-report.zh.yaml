      - number: '2.4'
        title: 增长驱动与品类验证
        blocks:
          - type: paragraph
            body: >-
              几个需求驱动因素真实且临近。第一是人口结构：随着人口老龄化，符合结直肠癌筛查资格的人群继续扩大；更年轻成年人发病率上升，也让政治和临床注意力持续落在早筛上。第二是指南扩围。建议起筛年龄降至 45
              岁，显著扩大了合格人群基数，即便不考虑模态迁移，也创造了更多筛查需求。第三，非侵入性血液检测契合已有证据充分的患者偏好叙事：采样更容易，可以把部分抗拒筛查的成年人拉进合规范围。第四，Guardant Shield
              获 FDA 批准，证明血液 CRC 筛查能跨过监管门槛，从而在医生和支付方面前验证品类。最后，报销有双重作用：CMS 决策既影响老年人的直接支付机制，也设定商业保险计划常常参考的基准。合在一起，这些驱动因素支持
              Freenome 在更广义 MCED 面板完全商业化之前，先切出一个真实市场楔子。
