chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Freenome Holdings, Inc. 是一家临床阶段生物技术公司，总部位于加州南旧金山，聚焦通过常规抽血开展多癌种早筛（MCED）。公司由 Riley Ennis、Charlie Vaske 和
              Gabriel Otte 于 2014 年创立，使命是用自有多组学平台在癌症最早、最可治疗的阶段发现病灶。该平台把游离
              DNA（cfDNA）甲基化、蛋白生物标志物、代谢组学、免疫组学信号与机器学习算法整合起来。不同于单分析物液体活检路线，Freenome
              的多组学平台同时分析多层生物信号，目标是在早期癌症检测中尽量拉高敏感性和特异性。截至 2026 年 7 月，公司仍为私营实体，但已于 2025 年 12 月宣布与 Perceptive Capital
              Solutions Corp 进行 SPAC 合并。其主力临床项目瞄准结直肠癌筛查，HARMONY 3 期试验已完成，目标是在 2026 年推出产品。Freenome
              的商业模式围绕开发和商业化实验室自建检测（LDT），并为其血液筛查检测寻求 FDA 批准；长期愿景是打造一个多癌种筛查面板，通过医生开单渠道销售，也可能走向直接面向消费者的路径。
