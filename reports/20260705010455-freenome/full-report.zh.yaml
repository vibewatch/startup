      nodes:
        - id: core
          label: Freenome 核心 CRC 项目
          description: SimpleScreen CRC 以及与 HARMONY 绑定的上市路径。
        - id: exact
          label: Exact Sciences
          description: 美国独家商业化伙伴。
        - id: roche
          label: Roche
          description: 技术和美国以外市场合作伙伴。
        - id: cms
          label: FDA / CMS 准入关口
          description: 支撑品类准入的审批和报销路径。
        - id: guardant
          label: Guardant Shield
          description: 已获批的血液 CRC 基准。
        - id: grail
          label: GRAIL / MCED 领域
          description: 相邻叙事和资本市场参照物。
        - id: providers
          label: 医疗服务方和支付方
          description: 开单、覆盖和采用的接触面。
      edges:
        - from: exact
          to: core
        - from: roche
          to: core
        - from: cms
          to: core
        - from: guardant
          to: providers
        - from: grail
          to: providers
        - from: core
          to: providers
        - from: exact
          to: providers
        - from: cms
          to: providers
    approximationNotes: null
    claimRefs:
