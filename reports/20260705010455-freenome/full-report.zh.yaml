        blocks:
          - type: paragraph
            body: >-
              承销结论是高风险，但并非不自洽。Freenome 提出的经济模型要跑通，需要三个条件同时成立：报销落在当前品类锚附近，检测 COGS
              走向规模化水平，上线执行能足够快地把筛查兴趣转化为有覆盖的医生订单，从而抵消现金消耗。问题在于，投资人最需要的几项输入仍缺乏公开证据。怀疑性报道正是盯住已募现金与所需现金之间的缺口，认为 SPAC
              资本包相对上线需求和时间线不确定性可能偏小。最重要的未解阻断点包括：确切在手现金、详细现金消耗构成、检测 层面毛利率、Roche 和 Exact
              关系中未披露的经济条款，以及发起人激励份额条款的完全摊薄影响。在这些信息披露前，任何估值观点都必须依赖宽情景区间，而不是单一高置信模型。
