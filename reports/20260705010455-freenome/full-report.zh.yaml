  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Freenome 的上市路径取决于少数外部节点：美国商业化靠 Exact，美国以外的杠杆靠 Roche，品类准入靠 CMS / FDA，时间压力来自竞争对手。
