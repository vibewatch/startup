  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Freenome
              时，不能只贴一个泛泛的「液体活检」标签，而要划清具体市场边界。相关核心市场是通过抽血开展常规、无症状癌症筛查；近期商业切入口在平均风险人群的结直肠癌筛查。因此，纳入的支出包括当下流向结肠镜、FIT、gFOBT
              和粪便 DNA
              路线的预防性筛查预算，以及支撑人群触达的临床流程和支付方基础设施。排除的支出包括肿瘤治疗监测、微小残留病灶监测，以及治疗性液体活检场景；这些场景落在不同预算和临床决策语境中。边界纪律很重要，因为一旦把所有液体活检用例合并计算，表观
              TAM 会急剧放大。对 Freenome 来说，真正可投资的问题不是所有液体活检是否足够大，而是血液 CRC 筛查能否替代足够多的筛查延迟、粪便检测摩擦和结肠镜回避，从而成为有报销的主流类别。
