      - number: '1.4'
        title: 里程碑、合作伙伴与不利事件
        blocks:
          - type: paragraph
            body: >-
              Freenome 的里程碑从 2014 年创立一路覆盖多次融资、临床试验执行、监管互动和战略合作。最重要的临床里程碑是完成结直肠癌筛查的 HARMONY 3 期注册性试验，该试验在美国 200 多个临床中心招募约
              25,000 名 45-85 岁平均风险成年人。试验设计同时服务于 FDA PMA 申报和 CMS 覆盖决策。战略合作包括 2021 年与 Roche 宣布的一项重要早期癌症检测生物标志物许可交易；这既验证了
              Freenome 的多组学路线，也带来非稀释性资本。Freenome 还在结直肠癌筛查领域与 Exact Sciences 合作。不利一面是，公司估值从 Series D 传闻的 $4B+ 压缩至 SPAC
              交易时的 $1.1B，幅度很大，反映出 2022-2024 年生物技术市场整体回调、商业化时间线长于预期，以及 Guardant Health 的 Shield 检测在 2024 年获 FDA
              批准带来的竞争压力。从成立到潜在商业产品上市超过 12 年，即便按临床阶段诊断公司的标准也值得注意。公司早年经历过多次领导层变化，不过团队自 2018 年以来保持稳定。
