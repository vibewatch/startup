      - number: '4.3'
        title: 成本结构、毛利率路径与上线支出
        blocks:
          - type: paragraph
            body: >-
              这个模式有吸引力的一面是，一旦检测运营规模化，获得报销的血液筛查检测可以有较强毛利率；不吸引人的一面是，上线期经济性很可能远差于稳态毛利所暗示的水平。上市公司可比对象和液体活检成本基准支持，运营效率到位后，单次检测
              COGS 约 $100-$300；如果报销维持在当前 Medicare 锚附近，规模化后可转化为 60%-75%
              毛利率。风险在于，早期商业批次很少一开始就优化：试剂成本更高，自动化不完整，生物信息计算和实验室间接成本会把上线期 COGS
              推到不那么好看的区间。毛利之上还有第二堵成本墙：外勤销售、医学事务、市场准入工作、PMA 准备和实验室资本开支。这些成本足够重，正的单次检测毛利并不自动意味着近期经营盈利，尤其是第一次切入初级保健筛查。
