      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Riley Ennis 担任 CEO 兼联合创始人。他 21 岁从计算生物学项目退学后创办公司，带领 Freenome 完成多轮融资和 SPAC 交易，证明了吸引一线医疗投资人的能力。领导团队包括总裁 Jacob
              Kirkegaard；他来自 Roche
              Diagnostics，带来诊断产品商业化落地经验。科学领导层则包括具备肿瘤基因组学和临床试验执行背景的首席医学官、首席科学官。董事会结构反映投资人基础，Perceptive Advisors
              和其他主要股东均有代表。关键人物风险中等：Ennis 是公开形象和战略驱动者，但公司已搭建深厚科学梯队，成员来自 Illumina、Grail、Foundation Medicine 和
              Roche。作为一家后期风投支持的生物技术公司，其治理安排较为典型，董事席位分配给主要投资方。待完成的 SPAC 交易将引入上市公司治理要求，包括独立董事和 SOX 合规。公开资料中没有治理争议；不过联合创始人
              Gabriel Otte 于 2016 年离开 CEO 岗位，由 Ennis 接任，属于一次早期领导层切换，且未造成公开层面的扰动。
