  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的剩余敞口出现在未披露的 III 期表现、报销不确定性和合作伙伴依赖相互作用之处。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: HARMONY 数据披露 / PMA 时点
          values:
            - label: 高
              tone: negative
              detail: 截至本次运行日期，公开指标仍缺失。
            - label: 高
              tone: negative
              detail: 这直接决定上市时点和竞争可信度。
            - label: 中
              tone: warning
              detail: 试验入组已经完成，有帮助但还不够。
            - label: 高
              tone: negative
              detail: 完整性能数据包公开前，剩余风险仍高。
        - label: 报销与定价
          values:
            - label: 中高
              tone: warning
              detail: 品类路径已经存在，但 Freenome 的覆盖不会自动到位。
            - label: 高
              tone: negative
              detail: 覆盖范围和实际价格决定上市放量是否能算账。
            - label: 中
              tone: warning
              detail: Guardant 和 CMS 降低了不确定性，但没有消除。
            - label: 中高
              tone: warning
              detail: 后来者仍可能遭遇价格和政策摩擦，剩余风险仍在。
        - label: Exact / Roche 合作伙伴依赖
          values:
            - label: 中高
              tone: warning
              detail: 商业化和地域扩张的杠杆有一部分握在合作方手里。
            - label: 高
              tone: negative
              detail: 激励不一致可能拖慢准入、定价或路线图控制。
            - label: 中
              tone: neutral
              detail: 伙伴关系确实带来分销和验证价值。
            - label: 高
              tone: negative
              detail: 核心上市仍依赖伙伴执行，剩余敞口仍高。
        - label: 检测放大与 QA 复杂度
          values:
            - label: 中高
              tone: warning
              detail: 多组学编排比范围更窄的检测更难。
            - label: 高
              tone: negative
              detail: 质量一旦走样，监管方和支付方信心都会受损。
            - label: 中低
              tone: warning
              detail: 关于可重复性和通量的公开证据很薄。
            - label: 中高
              tone: warning
              detail: 运营指标披露前，剩余风险偏高。
        - label: 现金跑道与 de-SPAC 融资
          values:
            - label: 中
              tone: warning
              detail: 交易补充了资本，但交割后的缓冲垫在公开信息中仍有争议。
            - label: 高
              tone: negative
              detail: 现金覆盖不足会压缩吸收上市延误的时间。
            - label: 中
              tone: neutral
              detail: 既往融资和 PIPE 有帮助，但具体跑道仍未公开。
            - label: 中高
              tone: warning
              detail: 现金、烧钱速度和赎回结果透明前，剩余风险仍在。
    approximationNotes: null
    claimRefs:
      - CR003
      - CR007
      - CR008
      - CR018
      - CR020
      - CR027
      - CR031
      - CR038
      - CR039
      - CR041
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行路径从监管和运营不确定性出发，传导到上市延迟、烧钱加重和估值支撑变弱。
    data:
