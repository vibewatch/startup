      - number: '5.2'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              描述 Freenome 架构时，最可支撑的说法是：它把一次简单抽血变成一个多层生物分类问题。公开记录显示，公司从平均风险筛查患者身上采血，在 CLIA 认证环境中处理样本，跨 DNA
              甲基化和蛋白层提取分析物；2026 年 AI 材料还提到 RNA 和其他分析物；随后 AI/ML
              评分把这些特征转化为面向医生的筛查结果。这在技术上有差异化，但运营要求也很高。每多一层分析物，检测协同、预分析敏感性和管线复杂度都会上升；公开来源对这些层的存在给出了更强证据，却较少说明把它们连接起来的内部服务拓扑、计算吞吐或故障处理逻辑。因此，平台看起来真实且复杂，但在技术委员会能把它称为充分去风险之前，仍需要围绕吞吐、可观测性和可复现性做有意义的尽调。
