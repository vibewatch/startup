      - number: '7.4'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >-
              执行和融资风险紧密绑在一起。Freenome 经历了尚无收入的漫长开发周期，如今要在一个仍需要现场报销推进、实验室扩容和医生行为改变的品类里商业化。公司拿到大量资本，也有创始人主导的可见叙事，但这既不能消除
              Riley Ennis 周围的关键人集中度，也不能证明公开可见的管理梯队已经匹配全国性筛查上市的运营要求。公开报道仍把具体现金续航期和现金消耗结构视为未解问题；医疗 SPAC
              环境也足够波动，投资人不能假设已宣布交易能让公司完全免于下一轮融资需求。最终呈现的是常见但真实的后期生物技术风险画像：资产真实、合作伙伴有分量，但组织能否在现金压力回归前把科学转成有纪律的商业执行，仍有实质不确定性。
            claimRefs:
