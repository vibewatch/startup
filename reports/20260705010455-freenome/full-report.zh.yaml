            body: >-
              路线图现在更像一串验证、商业化和平台扩展步骤，而不是一次单体发布事件。PREEMPT CRC 打下临床验证基础，2025 年 JAMA 发表和 PMA 信息把资产推向监管决策，Exact Sciences 为
              CRC 增加商业化渠道，Roche 扩展国际和多组学合作可选性，2026 年 NVIDIA 计划显示公司继续投资模型堆栈。最终图景是连贯的：一个主力 CRC
              项目，一个后续肺癌项目，以及一圈商业和技术合作伙伴，目的是拓宽分发并加深检测引擎。剩下的担忧是成熟度不对称。公开证据在 CRC 和平台存在性上最强，但在能证明 Freenome
