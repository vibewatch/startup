      - number: '8.2'
        title: 估值语境与可比分析
        blocks:
          - type: paragraph
            body: >-
              当前估值语境主要由 SPAC 结构决定，而不是经营结果。交易材料指向约 $1.1B 的 SPAC 后股权价值，以及按每股 $10 定价的 $240M PIPE；累计融资约 $1.5B。也就是说，投资人已经投进
              Freenome 的钱，高于新的公开市场入场估值，这最清楚地说明它是一项重置定价资产，而不是周期尾声的加价故事。公开可比公司也强化了这一点。Guardant、Exact Sciences 和 Natera
              的股权价值都高得多，但它们各自拥有更多商业验证、更多收入，或两者兼具。GRAIL $7.1B 的收购仍是战略买家曾经愿意为多癌种野心支付价格的最佳私有锚点，但它也说明 Freenome
              距离高溢价战略结果仍有多远。
