  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与报销风险
        blocks:
          - type: paragraph
            body: >-
              监管风险仍是第一视角，因为 Freenome 还没有跨过两个里程碑；只有跨过之后，血液筛查投资论点才能在规模上被承销：一套已披露的注册性表现数据包，以及一条通往耐久报销的清晰路径。HARMONY
              入组已完成，但公开材料仍没有给出精确的敏感性和特异性数字，无法让投资人把 Freenome 与 Shield、FIT、结肠镜或其他非侵入性选项直接比较。在 Guardant 已经建立 FDA
              批准且商业可售基准之后，这项缺失更关键。CMS 已经证明，血液结直肠筛查可以获得品类覆盖，但这不保证 Freenome 会在相同时间线上获得相同待遇。再加上 LDT
              政策诉讼仍在进行、分子诊断专利风险，以及医疗反欺诈和反滥用义务，监管和法律栈仍是本章最高置信度的上线延迟风险来源。
