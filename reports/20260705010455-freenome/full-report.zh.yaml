  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名证明在站点和合作伙伴识别上最强，在可持续商业结果上最弱。
    data:
      columns:
        - 具名实体清晰度
        - 结果具体度
        - 生产成熟度
        - 持久性可见度
      rows:
        - label: 试验站点网络
          values:
            - 高 — 注册库列出具名地点
            - 中 — 站点参与是具体事实，但缺少经济结果
            - 中 — 活跃验证场景，不是已上线开单账户
            - 低 — 无续约或重复订单数据
        - label: 多元化入组合作伙伴
          values:
            - 高 — 列出 Morehouse 和其他面向社区的合作伙伴
            - 中 — 代表性和触达结果已有描述
            - 中 — 真实入组支持，不是商业使用
            - 低 — 无长期开单或患者留存证据
        - label: 招募渠道合作伙伴
          values:
            - 中 — Freenome 披露中具名 CVS 角色
            - 中 — 明确触达结肠镜患者
            - 中 — 上市前已有规模化运营支持
            - 低 — 无上市后转化或经济性数据
        - label: 商业渠道合作伙伴
          values:
            - 高 — 列出 Exact Sciences，且合同已有界定
            - 高 — 独家权利、里程碑和共同独家路径明确
            - 中 — 上市前渠道就绪，不是已交付量
            - 低 — 依赖程度和收入集中度尚未披露
