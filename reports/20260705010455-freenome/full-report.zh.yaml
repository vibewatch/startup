      - number: '7.5'
        title: 缓释、否决标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              管理本章风险的实用办法，不是假装这组风险很低，而是定义什么证据能改变判断。公司已经有一些有分量的缓释因素：一项大型完成的注册研究、既有品类报销先例，以及在核心临床包足够强时能缩短上市时间的商业合作伙伴。这些优势只有通过具体测试后才有价值。投资人应要求公司披露
              HARMONY 相对现有方案的性能桥接、明确 PMA 时间表、de-SPAC
              后现金确定性、合作伙伴控制权清晰度，以及更清楚的上市组织，然后才承销一条干净的商业化叙事。否决标准应该可观察，而不是停留在话术上。数据延迟或不及预期、交易后现金偏薄、支付方准备度证据弱、合作伙伴激励模糊，都是外部可跟踪事件；一旦出现，应触发估值重置，而不是继续靠善意假设支撑估值。
