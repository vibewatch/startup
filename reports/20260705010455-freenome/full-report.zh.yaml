  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、收入质量与确认机制
        blocks:
          - type: paragraph
            body: >-
              Freenome 还没有商业产品收入，因此质量问题是前瞻性的，不是历史性的。可能的模式结构简单，即便销量尚未被证明：医生开具血液结直肠癌筛查检测，采集样本并通过 Freenome 的 CLIA
              实验室流程处理，结果回传给开单医生，实验室随后就已完成检测向 Medicare、Medicaid
              或商业支付方计费。这意味着收入预计是交易型、按次收费，并与医疗必要性和覆盖规则绑定，而不是软件订阅或预付许可。Roche 生物标志物里程碑、Exact Sciences
              合作等潜在非检测收入或许能缓解现金需求，但公开披露不能证明它们是可靠经营收入。实际结论是，近期财务质量取决于报销、医生开单行为和干净的理赔回款；在上线前，当前收入仍基本为零。
