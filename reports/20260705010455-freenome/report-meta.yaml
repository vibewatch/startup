companyProfile:
  summary: >-
    Freenome Holdings, Inc. is a clinical-stage biotechnology company founded in 2014 in
    South San Francisco, California. The company develops multi-cancer early detection tests
    using a proprietary multi-omics platform that integrates cell-free DNA methylation,
    protein biomarkers, metabolomics, and immunomics with machine learning algorithms to
    detect cancer at its earliest stages from a simple blood draw. Its lead program targets
    colorectal cancer screening, with the HARMONY Phase 3 registrational trial completed in
    2025. The company announced a SPAC merger with Perceptive Capital Solutions Corp in
    December 2025, valuing the combined entity at $1.1 billion. Freenome has raised
    approximately $1.5 billion across multiple rounds from investors including Perceptive
    Advisors, RA Capital Management, Bain Capital Life Sciences, Andreessen Horowitz, and
    Google Ventures.
