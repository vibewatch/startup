  - - Multi-omics will create superior test performance
    - Public HARMONY sensitivity and specificity remain undisclosed
    - High
    - Require lesion-stage performance data and direct comparison versus Shield and FIT
  - - Exact collaboration increases launch leverage
    - Undisclosed terms could constrain channel freedom or economics
    - Medium
    - Review exclusivity, data rights, referral obligations, and termination mechanics
  - - MCED optionality expands the moat beyond CRC
    - Multi-cancer regulation is slower and more complex than single-cancer approval
    - High
