chapter:
  number: 3
  title: Competitors
  summary: Guardant Health sets the immediate commercial benchmark because Shield already has FDA authorization, Medicare reimbursement, and physician-launch data. Exact Sciences remains the workflow incumbent through Cologuard, while GRAIL and Natera shape the adjacent MCED and entrant threat sets. Freenome's competitive upside is credible on multi-omics breadth, but its moat remains partially unproven until HARMONY performance and launch details are public.
sections:
- id: landscape-and-classes
  title: Landscape, classes, and status-quo alternatives
  body: Freenome's near-term competitive arena is not one clean peer set but a layered market of direct blood-based colorectal cancer screening vendors, established stool and procedure incumbents, adjacent multi-cancer early detection programs, and a small set of likely entrants. Guardant Health is the clearest direct benchmark because Shield is already FDA-authorized and reimbursed, while Exact Sciences remains the most important incumbent because Cologuard and Cologuard Plus already own physician workflow, outreach, and logistics in colorectal screening. GRAIL competes from an adjacent angle by selling broader multi-cancer ambition, and Natera matters less as a current product rival than as a credible entrant if it redeploys its oncology relationships into screening. Colonoscopy and FIT or gFOBT still control the status quo budget and referral path. Internal build is not a major practical substitute for most health systems because regulated assay development, guideline support, and reimbursement
    infrastructure are difficult to replicate locally.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  figureRefs:
  - FP001
- id: competitor-profiles
  title: Competitor profiles by scale, scope, and strategic direction
  body: 'The competitor profiles divide into three archetypes. Guardant is a focused blood-based CRC launch with public-company scale, regulatory validation, and the strongest reimbursement head start. GRAIL is breadth-first: Galleri covers more than 50 cancers and has commercial traction in employer and health-system channels, but it still lacks FDA approval and national insurance coverage. Exact Sciences is the incumbent distribution machine, monetizing a large installed base through stool-DNA screening and extending that base with Cologuard Plus. Natera is an adjacent oncology platform whose current strength is MRD and molecular testing rather than preventive screening, yet its physician relationships and laboratory operations make it a watch-list entrant. Freenome''s own profile remains the most strategy-rich and evidence-thin: it is differentiated on public multi-omics framing and has partnership leverage through Exact Sciences, but it still lacks disclosed Phase 3 performance and a
    public commercial playbook.'
  claimRefs:
  - CP008
  - CP009
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
  - CP016
  - CP017
