  - - Price discipline can be maintained
    - Multiple blood tests may converge near the Medicare anchor and commoditize
    - Medium
    - Stress-test downside pricing and required performance premium
  - - Adjacent oncology leaders are not immediate threats
    - Natera can redeploy oncology relationships into early detection over time
    - Medium
    - Track screening pilots, partnership disclosures, and assay roadmap signals
  - - Status quo will yield once blood draws are available
    - Colonoscopy and FIT remain deeply embedded in guidelines and workflows
    - Medium
    - Quantify conversion assumptions, adherence lift, and follow-up support in the launch model
