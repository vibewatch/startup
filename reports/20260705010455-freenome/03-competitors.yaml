- id: capability-and-trust-comparison
  title: Capability, clinical utility, and trust posture
  body: 'Capability comparison is where the distinction between CRC-specific products and broader MCED products matters most. Shield is optimized for one use case: average-risk colorectal cancer screening with a blood draw, and public comparisons suggest it sits above FIT on convenience-adjusted performance while still below colonoscopy''s diagnostic and therapeutic standard. Galleri wins on breadth because it screens for many cancers, but that same breadth reduces its comparability to a single-cancer screening assay and contributes to a harder regulatory path. Exact Sciences offers a very different proposition: Cologuard and Cologuard Plus are already cleared, covered, and integrated into screening pathways, but stool collection remains a meaningful compliance drag that blood tests explicitly target. Freenome''s differentiation claim rests on combining cfDNA with other analyte classes, which is strategically interesting but not fully externally validated until HARMONY sensitivity and specificity
    data are public.'
  claimRefs:
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: pricing-and-distribution
  title: Pricing, packaging, and go-to-market leverage
  body: 'Pricing and go-to-market structure favor the companies that already have reimbursement and distribution muscle. Guardant''s approximately $895 list price and roughly $920 Medicare reimbursement effectively anchor the blood-based CRC category for later entrants, because payers and providers now have a public reference point for what a covered blood screen can cost. Galleri shows the opposite pattern: it can command a roughly $949 self-pay price because it promises broader multi-cancer scope, but the lack of FDA approval and national coverage keeps it out of the most scalable primary-care reimbursement lanes. Exact Sciences competes less on a clean list price than on kit logistics, physician authorization flow, and long-standing patient outreach. Freenome''s biggest unresolved competitive variable is GTM execution. Public sources support partnership relevance and category positioning, but they do not yet disclose launch staffing, channel design, or contracting strategy in enough detail
    to benchmark against Guardant or Exact.'
  claimRefs:
  - CP009
  - CP011
  - CP012
  - CP017
  - CP026
  - CP027
  - CP028
  - CP029
  tableRefs:
  - TP003
- id: moat-and-displacement-risk
  title: Moat durability, switching costs, and displacement risk
  body: 'The durable moat question is less about whether blood-based screening is useful and more about who controls the approval, reimbursement, distribution, and data-feedback loops first. Guardant''s first-mover FDA authorization creates a real time advantage because guideline inclusion and payer operationalization usually lag regulatory milestones, giving Shield a multi-year opportunity to normalize provider behavior before Freenome launches. Exact Sciences has a different moat centered on outreach, logistics, and familiarity with the colorectal screening workflow. Freenome''s counter-argument is multi-omics differentiation, but that claim remains partly unverified until HARMONY results are publicly disclosed. The category also carries commoditization risk: if multiple blood tests converge toward similar sensitivity, specificity, and price near the Medicare anchor, then distribution power will matter more than assay nuance. Natera remains a credible entrant, and slower-than-expected
    Shield physician uptake is a useful warning that even a first mover still needs reimbursement clarity and workflow support to translate regulatory wins into volume.'
