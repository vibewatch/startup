- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Blood collection and accessioning
    - Convert a routine screening encounter into a lab-ready plasma specimen
    - Reliable phlebotomy, accessioning, and sample transport
    - Preanalytic variation can degrade downstream data quality and screening reliability
  - - cfDNA methylation sequencing layer
    - Generate high-resolution methylation features from circulating nucleic acids
    - Sequencing chemistry, conversion quality, and classifier-ready feature extraction
    - Low-signal early disease and sequencing-quality drift can weaken sensitivity
  - - Protein and broader analyte layer
    - Add complementary non-DNA signal channels to the screening model
    - Protein assays and additional multiomic measurement workflows
    - Each added analyte layer increases assay orchestration and QA complexity
  - - AI / ML feature engineering and scoring
    - Fuse multimodal inputs into cancer-likelihood outputs
    - Model training infrastructure, monitoring, and confounder control
    - Public sources do not show detailed throughput, observability, or rollback mechanics
  - - Clinical-laboratory reporting layer
    - Turn analytical output into a physician-facing result inside a CLIA environment
    - Validated lab workflow, report generation, and quality review
    - Turnaround, exception handling, and report-latency metrics are not public
  - - Partner and channel interfaces
    - Link assay development to commercial and international delivery paths
    - Exact commercialization, Roche collaboration, and health-system operations
    - Rights splits and partner handoffs can complicate roadmap control and release sequencing
