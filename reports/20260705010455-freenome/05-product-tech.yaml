- id: differentiation-and-ip
  title: Differentiation, IP, and competitive moats
  body: Freenome's strongest public differentiation claim is not simply that it is a blood test; multiple competitors can say that. The stronger claim is that its current platform narrative spans more analyte diversity and more model-driven signal integration than the single-modality descriptions visible on leading comparator pages. Guardant Shield is publicly framed around cell-free-DNA alterations, Galleri around targeted methylation, and Cologuard around stool DNA plus hemoglobin, while Freenome's own 2026 disclosures describe DNA methylation, RNA, protein, and other analytes tied together with AI/ML. That breadth is reinforced by a public IP story around methylation sequencing and classifier-based colorectal-cancer detection, plus practitioner-facing publications that show real internal model-building activity. The moat is therefore potentially meaningful, but it is still only partially proven. Public evidence supports differentiated technical ambition and real IP scaffolding; it does
    not yet prove that the broader analyte stack consistently translates into better cost, throughput, or clinical performance than narrower competitors at scale.
