  rows:
  - - SimpleScreen CRC
    - Primary-care and gastroenterology screening workflows
    - Lead named product; pre-approval but commercially framed
    - Blood-based CRC screening asset built on multiomics plus AI/ML classification
    - Need launch readiness data, payer onboarding detail, and physician-report SLA evidence
  - - PREEMPT CRC validation asset
    - Clinical, regulatory, and market-access teams
    - Most mature evidence base
    - Largest public Freenome CRC validation asset with prospective multicenter design
    - Need final PMA timing, site-level performance breakdowns, and operational reproducibility evidence
  - - Health-system workflow layer
    - Health-system innovation, screening, and operations teams
    - Actively merchandised
    - Combines blood draw, digital tools, workflow integration, and implementation support
    - Need concrete EHR / LIS integration list and post-go-live performance metrics
  - - PROACT LUNG program
    - Pulmonary, oncology, and population-screening stakeholders
    - Follow-on program
    - Extends the same blood-based platform into lung-cancer screening
    - Need validated performance data, regulatory plan, and exact LDT launch boundary
  - - AI / ML model stack
    - Bioinformatics, clinical-science, and platform teams
    - Clearly promoted but externally abstracted
    - Uses multimodal features, deep learning, and methylation-specific modeling
    - Need architecture, throughput, monitoring, and model-governance detail beyond high-level descriptions
  - - Partner-enabled commercialization and assay ecosystem
    - Commercial, regulatory, and international channel teams
    - Expansion layer
    - Exact adds CRC commercialization while Roche adds ex-U.S. and protein / sequencing optionality
    - Need economics, operational handoffs, and how partner rights affect product-control boundaries
