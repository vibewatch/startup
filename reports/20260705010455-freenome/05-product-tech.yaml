- id: development-roadmap
  title: Development stage and roadmap
  body: 'The roadmap now reads as a sequence of validation, commercialization, and platform-broadening steps rather than as one monolithic launch event. PREEMPT CRC established the clinical-validation base, the 2025 JAMA publication and PMA messaging moved the asset toward regulatory decision, Exact Sciences added a commercialization channel for CRC, Roche expanded international and multiomic collaboration optionality, and the 2026 NVIDIA initiative showed continued investment in the model stack itself. The resulting picture is coherent: one lead CRC program, one follow-on lung program, and a surrounding network of commercial and technical partners intended to widen distribution and deepen the assay engine. The remaining concern is maturity asymmetry. Public evidence is strongest around CRC and around the existence of the platform, but weaker on the operating metrics that would show whether Freenome can convert those milestones into a repeatable launch machine. That is why the roadmap is
    promising, but still transitional rather than fully landed.'
