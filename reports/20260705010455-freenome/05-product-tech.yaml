chapter:
  number: 5
  title: Product & Technology
  summary: 'Freenome now presents a concrete product-and-platform story rather than a purely aspirational liquid-biopsy narrative: a blood-based CRC screening product, a large prospective validation program, a CLIA-certified lab workflow, and an AI/ML-enabled multiomics engine that publicly discloses DNA methylation, RNA, protein, and related analyte processing. The public evidence also shows why the story is not yet fully de-risked: regulatory approval is still pending, workflow integration is described at a high level, and critical diligence items such as CAP proof, assay turnaround SLAs, sample-stability windows, and deeper bioinformatics architecture remain outside the durable public record.'
sections:
- id: product-definition
  title: Product definition and module / asset map
  body: Freenome's product surface is now legible enough to underwrite as a real delivery system rather than as a research slogan. Public pages show a named lead product in SimpleScreen CRC, a health-system packaging layer built around blood draw plus workflow support, and a clinical-studies program that functions as both validation engine and pipeline asset base. That matters because the company is not merely selling the idea of blood-based cancer screening; it is trying to commercialize a routinized screening workflow that fits primary-care and health-system operations. The same surface also shows where the public boundary still sits. CRC is clearly the most mature use case, while lung and broader multi-cancer expansion remain follow-on programs. In other words, the available evidence supports a product family with one near-term lead asset, several validation and expansion assets around it, and a workflow story designed for health systems, but not yet a fully transparent multi-product
    menu with disclosed attach rates or service-level detail.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE015
  - CE017
  - CE046
  - CE048
  - CE051
  tableRefs:
  - TE001
- id: technology-architecture
  title: Technology and operating architecture
  body: The most supportable way to describe Freenome's architecture is as a blood-sample workflow that turns a simple phlebotomy event into a multi-layer biological classification problem. The public record shows blood collection from average-risk screening patients, laboratory processing inside a CLIA-certified environment, analyte extraction across DNA methylation and protein layers with additional RNA and other analytes described in 2026 AI materials, and then AI/ML scoring that converts those features into a physician-facing screening result. This is technologically differentiated, but it is also operationally demanding. Each extra analyte layer increases assay coordination, preanalytics sensitivity, and pipeline complexity; public sources are much stronger on the existence of the layers than on the exact internal service topology, compute throughput, or failure-handling logic that links them together. That means the platform looks real and sophisticated, yet still leaves meaningful
    diligence work around throughput, observability, and reproducibility before a technical committee should call it fully de-risked.
  claimRefs:
