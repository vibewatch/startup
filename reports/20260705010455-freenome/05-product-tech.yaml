  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-level-gap
    missingEvidence: Validated routine operating metrics for turnaround time, report latency, exception handling, and service credits.
    whyItMatters: A screening workflow can look clinically credible yet still fail buyers if result timing and operational reliability are weak or inconsistent.
    diligencePath: Request commercial launch playbooks, operational dashboards, and signed customer implementation materials that show target and actual turnaround metrics.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE002
    - TE004
  - type: access-blocked
    severity: material
    topic: cap-gap
    missingEvidence: A durable CAP listing or certificate tied directly to Freenome's Brisbane laboratory.
    whyItMatters: Additional accreditation proof materially changes buyer comfort around quality systems and laboratory governance beyond the disclosed CLIA status.
    diligencePath: Search the live CAP directory by legal entity and address, then obtain the current certificate or screenshot the authoritative listing.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: sample-stability-gap
    missingEvidence: Validated sample-stability windows, cold-chain tolerances, redraw criteria, and excursion handling thresholds for routine operations.
    whyItMatters: Preanalytic instability can undermine assay performance and make real-world screening quality worse than controlled-study results suggest.
    diligencePath: Request SOP excerpts, stability-validation reports, and QC excursion logs from laboratory operations and assay-development teams.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: bioinformatics-gap
    missingEvidence: A detailed system diagram showing feature generation, model serving, throughput limits, monitoring, alerting, and rollback controls.
    whyItMatters: High-level AI descriptions do not answer whether the production pipeline is observable, resilient, and economically scalable for large screening volumes.
    diligencePath: Request an engineering architecture review with pipeline diagrams, throughput benchmarks, model-governance controls, and incident-response examples.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: privacy-controls
    missingEvidence: A product-specific HIPAA and security control matrix covering PHI flows, access controls, logging, retention, and third-party processors.
    whyItMatters: A generic privacy notice is not sufficient to underwrite operational security, regulated data handling, or enterprise procurement readiness.
    diligencePath: Request the latest security packet, HIPAA risk assessment, vendor list, and any trust-center materials used in enterprise diligence.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
