- id: regulatory-and-compliance
  title: Regulatory pathway and quality / compliance posture
  body: 'The compliance posture is credible but incomplete. Freenome publicly discloses a CLIA-certified high-complexity clinical laboratory, openly states that SimpleScreen CRC is not yet FDA cleared or approved, and points investors toward the PMA pathway through its 2025 JAMA-result announcement. That level of transparency is helpful because it clearly separates present CLIA-based operating capability from the still-pending FDA milestone the market ultimately cares about. At the same time, the public diligence file does not yet deliver everything a buyer or investor would want. The reviewed source set did not establish a durable public CAP listing for the lab, did not surface product-specific HIPAA control mappings, and did not disclose turnaround SLAs or validated sample-stability tolerances for routine operations. External technical literature reinforces why those details matter: plasma proteomics and ctDNA workflows are highly sensitive to preanalytics, assay design, and confounding
    signals. So the trust posture is directionally good, but still more evidentiary than fully auditable from public materials alone.'
  claimRefs:
