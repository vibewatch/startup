- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Freenome solution
  - Measurable benefit
  - Limitation
  rows:
  - - Average-risk CRC screening
    - Patient gets a routine blood draw alongside preventive screening workflow
    - SimpleScreen CRC plus Freenome lab processing and reporting
    - Potentially lowers friction versus stool prep or colonoscopy-first approaches
    - Public sources do not disclose turnaround SLA or post-positive follow-up rates
  - - Health-system screening deployment
    - Health system must coordinate ordering, collection, patient engagement, and results operations
    - Digital tools plus implementation support for tailored workflow integration
    - Could reduce adoption friction for systemwide rollout
    - No public integration catalog or quantified deployment timelines
  - - Clinical validation recruitment
    - Prospective average-risk participants are recruited for blood draw before colonoscopy
    - PREEMPT CRC uses traditional and virtual recruitment methods
    - Broader enrollment can improve representativeness of validation data
    - Public pages do not expose screening-site throughput or protocol-deviation rates
  - - Lung-screening expansion
    - High-risk individuals need a future blood-based option beyond imaging-only routines
    - PROACT LUNG extends the platform into blood-based lung screening
    - Creates follow-on panel leverage if validated
    - Public evidence is much thinner than for CRC and launch timing remains conditional
  - - Partner commercialization
    - Commercial launch requires distribution, market access, and geographic reach
    - Exact and Roche relationships extend channel and assay-development reach
    - May accelerate launch and international optionality without rebuilding all infrastructure internally
    - Public economics, control boundaries, and operational responsibilities remain undisclosed
