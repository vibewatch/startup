- id: FM003
  title: Buyer / segment map
  type: flow
  layout: standard
  summary: The adoption path runs from guideline-eligible adult to physician order, payer adjudication,
    and colonoscopy follow-up rather than through a pure consumer purchase loop.
  data:
    nodes:
    - id: eligible
      label: Guideline-eligible adult
      detail: Average-risk adult in the 45-75 screening window deciding whether to screen.
    - id: pcp
      label: Primary care or GI touchpoint
      detail: Physician recommendation is the primary trigger for modality choice.
    - id: order
      label: Test order and logistics
      detail: Ordering workflow routes patient to blood draw, stool kit, or colonoscopy scheduling.
    - id: lab
      label: Lab processing and result return
      detail: Blood-based screening depends on contracted laboratory processing and result interpretation.
    - id: payer
      label: Payer coverage decision
      detail: CMS and commercial policy shape whether blood testing is routine or frictional.
    - id: followup
      label: Follow-up colonoscopy or routine interval
      detail: Positive screens escalate to diagnostic colonoscopy; negative screens return to normal cadence.
    edges:
    - to: pcp
      label: screening prompt
      from: eligible
    - to: order
      label: physician order
      from: pcp
    - to: lab
      label: sample routed to
      from: order
    - to: payer
      label: claim and coverage context
      from: lab
    - to: followup
      label: coverage shapes uptake
      from: payer
    - to: pcp
      label: positive result returns to clinician
      from: followup
  approximationNotes: This is a workflow map rather than a volume model; it highlights the physician-led
    and payer-mediated path that makes blood-based CRC screening different from simple self-pay wellness
    testing.
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM032
- id: FM004
  title: Adoption funnel
  type: funnel
  layout: standard
  summary: The funnel narrows from total guideline-eligible adults to the smaller near-term cohort that
    is both overdue for screening and likely reachable through blood-test reimbursement.
  data:
    items:
    - label: Guideline-eligible adults
      value: 100
      description: Approximate millions of U.S. adults in current colorectal screening age bands.
    - label: Up-to-date on any screening
      value: 60
      description: Roughly 60% of eligible adults are already compliant with current screening options.
    - label: Overdue or unscreened adults
      value: 40
      description: The remaining population is the practical conversion pool that non-invasive modalities
        target first.
    - label: Preference-driven blood-test wedge
      value: 20
      description: Illustrative narrowing lens assuming a meaningful subset of overdue adults would prefer
        a blood-based option over stool or colonoscopy pathways.
    - label: Near-term reimbursed launch wedge
      value: 5
      description: Illustrative early-adoption cohort after payer coverage, physician ordering, and follow-up
        workflow frictions are applied.
  approximationNotes: Stages one to three use public eligibility and compliance figures. Stages four and
    five are evidence-constrained adoption lenses derived from patient-preference and reimbursement-friction
    evidence, not disclosed company forecasts.
