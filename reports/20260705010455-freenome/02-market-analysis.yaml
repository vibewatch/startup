  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Three nested lenses show why the broad cancer-screening TAM is much larger than the specific
    public market slice Freenome can currently underwrite.
  data:
    nodes:
    - id: tam
      label: TAM
      value: $50B+ global cancer screening
      detail: Broad all-modality screening spend across cancer types and geographies; useful for category
        context, not company underwriting.
    - id: sam
      label: SAM
      value: $10B+ U.S. blood-based CRC lens
      detail: Nearer-term Freenome-relevant opportunity derived from guideline-eligible adults and an
        indicative blood-test price floor.
    - id: som
      label: SOM
      value: Not publicly supportable
      detail: Public sources do not isolate a clean Freenome-specific SOM before FDA approval, launch
        pricing, and guideline inclusion are known.
  approximationNotes: TAM and SAM preserve public market lenses; the SOM layer is intentionally qualitative
    because no public bottom-up company model is supportable yet.
