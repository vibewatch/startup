- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - ACS age-45 screening guideline
    - Tailwind
    - Already in force
    - Expands the eligible screening pool and increases outreach volume for any modality
    - Confirm which payer cohorts fully operationalized age-45 coverage and reminder workflows
  - - Aging eligible population
    - Tailwind
    - Ongoing through 2030
    - Adds more guideline-eligible adults each year and supports durable volume growth
    - Quantify age-band growth by payer mix to refine launch geography assumptions
  - - Patient preference for non-invasive testing
    - Tailwind
    - Immediate if reimbursed
    - Can convert some overdue or colonoscopy-averse adults into compliance
    - Review survey and claims data showing actual completion uplift versus stool-based tests
  - - Guardant Shield FDA approval
    - Tailwind
    - Since 2024
    - Validates the category with physicians, labs, and payers
    - Assess whether approval changes payer evidence thresholds for second entrants such as Freenome
  - - CMS coverage as reimbursement anchor
    - Tailwind
    - 2025-2026
    - Creates a reference point for commercial-plan negotiations and coding workflow
    - Map CPT, LCD, and payment mechanics that would apply to Freenome specifically
  - - Unsettled reimbursement rates and coverage breadth
    - Headwind
    - Near term
    - Keeps adoption cautious until payment levels and utilization rules become clearer
    - Request the company view on likely CMS pricing, coding, and commercial parity timing
  - - Guideline inclusion evidence burden
    - Headwind
    - Near term to medium term
    - Without sensitivity and specificity evidence, physicians may not change ordering patterns
    - Request the HARMONY data package and any publication timeline tied to guideline submissions
  - - Physician behavior change and referral inertia
    - Headwind
    - Near term
    - Established colonoscopy and stool-test workflows are operationally sticky
    - Understand commercial spend required for education, detailing, and EHR workflow integration
  - - False-positive follow-up burden
    - Headwind
    - Immediate after launch
    - Every positive blood screen can create colonoscopy cost, anxiety, and workflow friction
    - Model downstream utilization and payer objections under different specificity scenarios
  - - Price sensitivity versus stool tests and colonoscopy benchmarks
    - Headwind
    - Immediate
    - Premium pricing without reimbursement support can slow uptake even in a large market
    - Pressure-test acceptable ASP versus FIT, stool-DNA, and colonoscopy reimbursement benchmarks
  notes: Tailwinds and headwinds are mixed intentionally because Freenome has a real category wedge, but
    adoption timing still depends on reimbursement, guideline inclusion, and workflow change.
