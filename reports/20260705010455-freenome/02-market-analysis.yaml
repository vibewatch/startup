slug: freenome
runDate: '2026-07-05'
company:
  name: Freenome
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Freenome's market opportunity is credible but definition-sensitive. The broad global cancer-screening
    TAM is large, with public lenses exceeding $50 billion, and published MCED outlooks point to roughly
    $20 billion to $30 billion by 2030. The nearer-term commercial wedge is much narrower and more concrete:
    physician-ordered, blood-based colorectal cancer screening for about 100 million guideline-eligible
    U.S. adults. That wedge benefits from three real drivers already in force: screening beginning at
    age 45, persistent under-screening near 40% of the eligible population, and patient preference for
    non-invasive options. The caution is that reimbursement, guideline inclusion, and workflow change
    still determine whether blood-based screening becomes routine. Public sources support a real $10 billion-plus
    U.S. category lens, but they do not yet support a clean Freenome-specific SAM or SOM, so contradictory
    market estimates should be preserved rather than over-normalized.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: >-
    Freenome should be analyzed inside a specific market boundary rather than a generic 'liquid biopsy'
    label. The relevant core market is routine, asymptomatic cancer screening through a blood draw, with
    the near-term commercial wedge in average-risk colorectal cancer screening. That means included spend
    is preventive screening budget that today flows to colonoscopy, FIT, gFOBT, and stool-DNA pathways,
    plus the clinical workflow and payer infrastructure that supports population outreach. Excluded spend
    includes oncology-treatment monitoring, minimal residual disease surveillance, and therapeutic liquid
    biopsy use cases that sit in a different budget and clinical-decision context. Boundary discipline
    matters because the apparent TAM expands dramatically when every liquid-biopsy use case is counted
    together. For Freenome, the investable question is not whether all liquid biopsy is large, but whether
    blood-based CRC screening can displace enough screening deferral, stool-test friction, and colonoscopy
    avoidance to become a reimbursed mainstream category.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
- id: sizing-lenses-and-contradictions
  title: Sizing lenses, TAM logic, and contradictory published estimates
  body: >-
    The market is large enough to matter, but it is not clean enough to summarize with one headline number.
    Broad cancer-screening spend across modalities exceeds $50 billion globally, while published MCED
    outlooks cluster around roughly $20 billion to $30 billion by 2030. That is directionally attractive,
    yet Freenome's actual near-term commercial opportunity is narrower: blood-based colorectal cancer
    screening for guideline-eligible adults in the United States. A simple price-times-population lens
    using roughly 100 million eligible adults and a $100-plus blood test already yields a $10 billion-plus
    category. Public sources also support a global colorectal screening market around $11 billion to $12
    billion by 2028. The unresolved issue is not whether the market exists; it is whether public data
    can isolate a Freenome-specific SAM or SOM before FDA approval, pricing, and guideline inclusion are
    settled. Contradictory analyst ranges should therefore be preserved, not collapsed into false precision.
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM039
  - CM040
