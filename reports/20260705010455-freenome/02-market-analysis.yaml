  - FM003
  - FM004
- id: growth-drivers-and-category-validation
  title: Growth drivers and category validation
  body: >-
    Several demand drivers are real and near term. The first is demographics: the eligible colorectal
    cancer screening population continues to grow as the population ages, while younger-adult incidence
    keeps political and clinical attention on earlier detection. The second is guideline expansion. Lowering
    the recommended starting age to 45 materially widened the eligible base, creating more screening demand
    even before modality shifts are considered. Third, non-invasive blood testing fits a well-documented
    patient-preference story: easier sample collection can move some screening-averse adults into compliance.
    Fourth, Guardant Shield's FDA approval validated the category with physicians and payers by proving
    that blood-based CRC screening can clear a regulatory bar. Finally, reimbursement matters twice: CMS
    decisions influence direct payment mechanics for seniors and also set the benchmark that commercial
    plans often reference. Together these drivers support a real market wedge for Freenome even before
    a broader MCED panel becomes fully commercial.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
  - CM032
  tableRefs:
  - TM004
- id: constraints-and-diligence-gaps
  title: Adoption constraints, contradictory estimates, and diligence gaps
  body: >-
    The main caution is that category validation does not equal broad adoption. Reimbursement remains
    the first gating issue, because Medicare process clarity and rate setting for blood-based tests still
    influence whether health systems treat the modality as routine. Clinical-performance thresholds are
    the second gate: without enough sensitivity, specificity, and guideline inclusion, physicians have
    limited incentive to change established colonoscopy and stool-testing workflows. False positives also
    impose real downstream cost and operational friction because every positive screen still routes into
    confirmatory colonoscopy. On top of those adoption frictions, the public market record still does
    not provide a clean Freenome-specific SAM or SOM. Published MCED estimates span from roughly $5 billion
    to more than $30 billion depending on whether the source includes only screening, broader liquid biopsy,
    multiple geographies, or mixed cancer-type assumptions. For underwriting, that means the market story
    is credible but still range-bound and evidence-constrained rather than point-estimated.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
  - CM037
  - CM038
  - CM039
  - CM040
tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Freenome relevance
  rows:
  - - Multi-cancer early detection
    - Routine blood-draw screening for asymptomatic adults across multiple cancer signals
    - Therapeutic monitoring, recurrence surveillance, and symptomatic diagnostic workups
    - Physicians order; Medicare, Medicaid, and commercial plans pay
    - Long-term platform upside, but broader than the first launch wedge
  - - Blood-based colorectal cancer screening
    - Average-risk adults eligible for preventive CRC screening with a physician-ordered blood test
    - Diagnostic colonoscopy after symptoms or post-positive follow-up procedures
    - Primary care, GI practices, CMS, commercial payers
    - Core near-term market for Freenome
  - - Stool-based CRC screening
    - FIT, gFOBT, and stool-DNA pathways that compete for preventive screening budget
    - Therapeutic oncology diagnostics and unrelated GI testing
    - Primary care, population-health programs, payers
    - Main non-invasive substitute that sets price expectations
  - - Colonoscopy pathway
    - Preventive colonoscopy reimbursement, bowel-prep workflow, sedation, and follow-up care
    - Hospital oncology treatment spend and inpatient cancer management
    - Gastroenterologists, health systems, insurers
    - Gold-standard comparator and referral incumbent
  - - Therapeutic liquid biopsy / MRD
    - None for Freenome primary market in this chapter
    - Treatment monitoring, relapse detection, companion diagnostics
    - Oncologists, biopharma, specialty-payor budgets
    - Explicitly excluded from core addressable market
  - - Employer or direct-to-consumer screening adjacency
    - Pilot wellness budgets, self-pay curiosity, navigation tools
    - Mass consumer wellness testing without physician oversight
    - Employer benefits teams or self-pay patients
    - Emerging channel, but not the core reimbursement pathway
  notes: 'Boundary is deliberately narrow: preventive screening budget is in scope, while therapeutic
    liquid-biopsy spend is excluded even though it shares technology vocabulary.'
