- id: customer-verdict
  title: Adverse analysis and customer diligence asks
  body: 'The customer verdict is promising but still unproven. On the positive side, Freenome has validated demand relevance around a real public-health problem, built a large and diverse trial network, and secured a commercialization partner with health-system and payer reach. On the negative side, the same public record shows why physician adoption may be conservative. AGA and ACS both position current blood-based CRC tests behind established screening options rather than as outright replacements, and AGA explicitly says current blood tests are less effective and more costly than established programs. Primary care bottlenecks also matter: shortages, burnout, appointment delays, and uneven access all reduce the time and workflow slack available for a new screening conversation. The most important remaining diligence asks are simple: how many launch accounts are contracted, what share of future volume depends on Exact, what physician reorder intent looks like after real use, and how follow-up
    colonoscopy completion will be managed.'
  claimRefs:
