- id: adoption-trajectory
  title: Adoption trajectory and evidence
  body: 'Because Freenome remains pre-commercial, the adoption story is best read through readiness proxies instead of revenue metrics. The strongest proxy is PREEMPT CRC: public sources support roughly 25,000 enrolled average-risk participants, enrollment completion, more than 200 study sites, and a recruitment design that reached patients from every ZIP code in the continental United States. That breadth matters because it shows provider-site participation well beyond a single academic center and suggests Freenome has already built an operational network for specimen collection and study coordination. The market pull also looks real. NCCRT still says more than one in three adults age 45 or older are not screened as recommended, and guideline bodies keep emphasizing that convenience and option diversity are needed to close the gap. The weak point is commercialization evidence itself: no public source in this set discloses a paying-customer count, launch account base, or reorder behavior
    for Freenome.'
  claimRefs:
  - CU008
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU018
  - CU019
