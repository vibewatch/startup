tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale evidence
  - Revenue / strategic value
  - Gap
  rows:
  - - Primary care physicians
    - PCP or advanced practice clinician / clinic staff / payer-funded preventive benefit
    - Routine screening conversation for average-risk adults who may not complete colonoscopy or stool testing
    - USPSTF, ACS, NCCRT, and AGA all frame average-risk screening as a broad primary-care workflow
    - Largest ordering surface if blood-based testing becomes a completed preventive option
    - No public reorder-intent, sales productivity, or launch-account data
  - - Gastroenterologists
    - GI specialist / endoscopy team / payer-funded preventive or diagnostic pathway
    - Alternative non-invasive option plus colonoscopy follow-up after positive blood or stool test
    - Guidelines and follow-up rules keep GI involved even when the first screen is non-invasive
    - Important referral, follow-up, and credibility gatekeeper segment
    - Public evidence does not show specialist ordering behavior for Freenome itself
  - - Health systems, IDNs, and community hospitals
    - Population-health leader / phlebotomy-lab operations / shared-risk or fee-for-service budget
    - Operational deployment of blood draw, result routing, reminders, and follow-up colonoscopy closure
    - PREEMPT includes community hospitals, health systems, tertiary centers, and teaching hospitals
    - Could concentrate large screening populations into a few enterprise relationships
    - No disclosed signed launch accounts or system-level contract terms
  - - Medicare and commercial payers
    - Medical policy team / claims administration / insurance budget
    - Coverage decision, frequency policy, and follow-up colonoscopy economics
    - CMS already covers the benchmark blood-test category every three years; commercial posture is still evolving
    - Payer adoption determines realized price and practical completion volume
    - No public commercial-coverage mix or denial-rate evidence for Freenome
  - - Patients who avoid colonoscopy or do not complete stool testing
    - Patient / navigator / insurer or self-pay out-of-pocket risk
    - Convenience-first screening completion for average-risk adults
    - ACS and AGA explicitly place blood tests in the decliner or non-completer segment
    - Creates incremental completion opportunity rather than pure share shift from incumbents
    - Patient willingness does not automatically translate into physician orders or coverage
  - - Exact Sciences commercialization channel
    - Commercial partner / Exact field and market-access teams / shared economics
    - Potential co-commercialization and payer access for a future Freenome assay
    - Exact publicly cites broad health-system and payer relationships as part of the license rationale
    - Fastest plausible path to scaled reach without building all GTM infrastructure alone
    - Creates partner dependence and leaves economics and control allocation only partially disclosed
  notes: This segmentation table mixes direct clinical buyers, economic payers, operational enterprise accounts, and the Exact commercialization channel because Freenome remains pre-launch.
