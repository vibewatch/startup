  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-customer-count
    missingEvidence: A current count of contracted or live Freenome commercial accounts, segmented by physician office, health system, and payer mix.
    whyItMatters: Without launch-account disclosure, customer quality cannot be distinguished from trial readiness, and the named-proof table remains a partial proxy rather than real customer traction.
    diligencePath: Request the launch pipeline, signed account list, first-ordering sites, and any post-approval deployment agreements.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal cadence, reorder behavior, and physician satisfaction by cohort once the product is commercially available.
    whyItMatters: Customer durability is central to underwriting a preventive screening company, and today's public evidence substitutes category cadence for actual retention data.
    diligencePath: Request cohort-level retention tables, reorder rates, satisfaction surveys, and follow-up colonoscopy completion metrics after first commercial launch.
    relatedQuestionRefs:
    - QU019
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue-share, commercialization-control, exclusivity trigger, and termination details for the Exact Sciences relationship plus any alternative channel plans.
    whyItMatters: If Exact becomes the dominant route to market, Freenome may trade faster reach for meaningful concentration and strategic-flexibility risk.
    diligencePath: Review the full commercial agreement, revenue-sharing terms, field-role split, and fallback plan if Exact underperforms or reprioritizes.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: named-proof-completeness
    missingEvidence: A fuller named roster of provider sites or early adopters that can move the chapter from sampled proof to a more complete customer ledger.
    whyItMatters: The current named proof is enough to show real readiness, but not enough to measure how concentrated or representative the future account base may be.
    diligencePath: Ask management for the complete site roster, future conversion targets, and a map from PREEMPT sites to launch-priority health systems.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU003
