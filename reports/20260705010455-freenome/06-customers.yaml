figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The likely Freenome customer journey runs from screening avoidance or non-completion through physician discussion, blood draw, colonoscopy follow-up when positive, and eventual repeat-screening reminders.
  data:
    items:
    - label: Screening inertia or avoidance
      detail: Cost, discomfort, access gaps, bowel-prep aversion, and limited awareness suppress completion of existing options.
      tone: warning
    - label: Primary care or GI encounter
      detail: A clinician identifies an average-risk patient and chooses among stool, scope, or blood-based options.
      tone: neutral
    - label: Blood-test discussion for decliners
      detail: Current guidance places blood-based testing mainly with patients who decline or do not complete preferred options.
      tone: neutral
    - label: Sample collection and routing
      detail: Phlebotomy, lab logistics, and results reporting must fit normal health-system workflow.
      tone: positive
    - label: Positive-result colonoscopy closure
      detail: Any positive blood or stool result still requires timely follow-up colonoscopy to complete screening.
      tone: warning
    - label: Repeat-screening and expansion loop
      detail: If covered and clinically accepted, the model can repeat on a preventive cadence and deepen through payer and partner channels.
      tone: positive
  approximationNotes: null
  claimRefs:
  - CU001
  - CU004
  - CU005
  - CU006
  - CU029
  - CU031
  - CU044
  - CU046
