- id: named-proof
  title: Named customer and partner proof
  body: The named-proof layer is credible but not yet equivalent to paying-customer proof. Starling Physicians publicly recruits participants into PREEMPT, showing real physician-site engagement rather than abstract trial branding. ClinicalTrials.gov and its mirrored registry identify named locations such as John Muir Health, Pomona Valley Hospital Medical Center/Cancer Care Center, Morehouse School of Medicine, and NYU Langone Health, which supports a geographically and institutionally diverse validation network. Freenome's own enrollment announcement adds more operational texture by naming Morehouse as a diversity-enrollment partner and CVS Health Clinical Trial Services as an outreach channel for patients already scheduled for colonoscopy. Exact Sciences is the most commercially important named partner because it now holds the U.S. rights to current and future Freenome blood-based CRC screening tests. Taken together, those references show adoption readiness, but they still stop short
    of proving recurring commercial demand or post-launch physician reorder behavior.
  claimRefs:
  - CU011
  - CU013
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU049
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-and-concentration
  title: Retention, satisfaction, and concentration risk
  body: 'Durability is where public evidence is thinnest. No retained source discloses Freenome net revenue retention, gross retention, churn, renewal cadence, or top-customer concentration, which is unsurprising for a pre-launch diagnostics company but still leaves a real underwriting gap. The best available repeat-use proxy is the screening interval itself: current guidance and coverage benchmarks point to annual FIT, three-year stool-DNA and blood-based testing, and ten-year colonoscopy cycles, so a successful blood-test business should eventually behave more like a repeat preventive care category than a one-time acute diagnostic. That proxy is not the same thing as retention, because every positive non-invasive test still requires colonoscopy follow-up and because physician willingness to reorder depends on evidence quality, payer coverage, and workflow simplicity. Concentration risk also exists on the channel side: Exact Sciences could accelerate reach, but it could also become the
    dominant gateway through which Freenome accesses health systems and payers.'
  claimRefs:
  - CU006
