- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Exact co-commercialization and market access
    - Dependence on one commercialization partner
    - Could accelerate launch reach while reducing Freenome's direct control over field execution and economics
    - Review exclusivity triggers, termination rights, sales-role split, and partner contribution to forecast volume
  - - Blood-draw convenience for decliners and non-completers
    - Guidelines still position blood tests behind established methods
    - May open incremental demand without immediately displacing stool or colonoscopy incumbents
    - Test reorder intent among decliners and incomplete-screening cohorts instead of assuming broad substitution
  - - Medicare category benchmark already exists
    - Commercial coverage may lag or vary by plan
    - Category validation helps the pitch, but realized payer mix could remain narrow at launch
    - Request contracted lives, prior-authorization rules, and denial assumptions by payer type
  - - Large PREEMPT site network
    - Study sites may not convert into paying accounts
    - Validation footprint proves readiness but not commercial traction
    - Ask how many sites signed launch MOUs, pilots, or post-approval ordering commitments
  - - Future DTC or patient-navigation optionality
    - No disclosed direct-to-consumer motion today
    - Could broaden awareness later but may raise CAC and follow-up complexity
    - Request future channel roadmap, patient-navigation design, and economics for any consumer-facing motion
  notes: This table is a strategic expansion and concentration register, not a quantified customer-concentration disclosure.
