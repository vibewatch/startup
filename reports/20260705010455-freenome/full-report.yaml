      - number: '4.3'
        title: Cost structure, gross margin path, and launch spending
        blocks:
          - type: paragraph
            body: >-
              The attractive part of the model is that a reimbursed blood-based screening test can carry strong gross
              margin once assay operations scale, but the unattractive part is that launch-period economics are likely
              much worse than steady-state margins imply. Public company comps and liquid-biopsy cost benchmarks support
              test-level COGS around $100-$300 once operations are efficient, which can translate into 60%-75% gross
              margin at scale if reimbursement stays near the current Medicare anchor. The risk is that early commercial
              batches are rarely optimized: reagent costs are higher, automation is incomplete, and bioinformatics
              compute plus lab overhead can push launch COGS into a less attractive band. Above gross margin sits a
              second cost wall: field sales, medical affairs, market access work, PMA preparation, and laboratory capex.
              Those costs are heavy enough that positive test-level margin does not automatically mean near-term
              operating profitability, especially for a first launch into primary-care screening.
