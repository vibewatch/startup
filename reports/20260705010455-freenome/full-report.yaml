            body: >-
              Riley Ennis serves as CEO and co-founder, having started the company at age 21 after dropping out of a
              computational biology program. Ennis has led Freenome through multiple funding rounds and the SPAC
              transaction, demonstrating ability to attract tier-one healthcare investors. The leadership team includes
              Jacob Kirkegaard as President, who joined from Roche Diagnostics bringing commercial expertise in
              diagnostics go-to-market, and scientific leadership including chief medical and scientific officers with
              backgrounds in oncology genomics and clinical trial execution. The board composition reflects the investor
              base, with representation from Perceptive Advisors and other major shareholders. Key-person risk is
              moderate: while Ennis is the public face and strategic driver, the company has built a deep scientific
              bench including veterans from Illumina, Grail, Foundation Medicine, and Roche. Governance has been typical
              for a late-stage venture-backed biotech, with board seats allocated to major investors. The pending SPAC
              transaction will introduce public-company governance requirements including independent board members and
              SOX compliance. There have been no publicly reported governance controversies, though co-founder Gabriel
              Otte departed the CEO role in 2016 with Ennis assuming the position, representing an early leadership
              transition that was resolved without public disruption.
