chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and current stage
        blocks:
          - type: paragraph
            body: >-
              Freenome Holdings, Inc. is a clinical-stage biotechnology company headquartered in South San Francisco,
              California, focused on multi-cancer early detection (MCED) through a routine blood draw. The company was
              founded in 2014 by Riley Ennis, Charlie Vaske, and Gabriel Otte, with a mission to detect cancer at its
              earliest and most treatable stages using a proprietary multi-omics platform that integrates cell-free DNA
              (cfDNA) methylation, protein biomarkers, metabolomics, and immunomics signals with machine learning
              algorithms. Unlike single-analyte liquid biopsy approaches, Freenome's multiomics platform analyzes
              multiple biological signal layers simultaneously, aiming to maximize sensitivity and specificity for
              early-stage cancer detection. The company operates as a private entity as of July 2026, though it
              announced a SPAC merger with Perceptive Capital Solutions Corp in December 2025. The lead clinical program
              targets colorectal cancer screening, with the HARMONY Phase 3 trial completed and a target product launch
              in 2026. Freenome's business model centers on developing and commercializing laboratory-developed tests
              (LDTs) and pursuing FDA approval for its blood-based screening tests, with a long-term vision of a
              multi-cancer screening panel sold through physician ordering channels and potentially direct-to-consumer
              pathways.
