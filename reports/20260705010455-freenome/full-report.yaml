      - number: '4.4'
        title: Capital adequacy, burn, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The capital story is clearer than the income statement, but it is still incomplete. Public sources support
              a $240 million PIPE at $10 per share and roughly $1.5 billion of lifetime capital raised, yet they do not
              disclose the exact cash balance Freenome will carry into or out of the SPAC close. That missing cash
              number matters because estimated burn of roughly $150-$250 million per year implies that the PIPE by
              itself may cover only about 12-19 months of operations. Management has multiple legitimate uses for the
              proceeds, including CRC commercialization, continuing the lung cancer program, and general corporate
              purposes, but every one of those uses competes for the same capital pool. Public-company reporting after
              the merger should improve visibility, though it will not reduce the underlying need for cash. If
              commercialization slips or launch uptake is slow, Freenome likely needs follow-on financing well before
              its broader multi-cancer ambition can self-fund.
