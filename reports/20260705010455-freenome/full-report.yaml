      - - Cash shortfall at close
        - Redemptions, fees, or structure leave materially less launch cash than expected
        - Raises dilution and execution risk simultaneously
        - Assume another financing sooner and lower fair value
      - - Coverage below category anchor
        - Reimbursement settles materially below current Guardant and CMS reference point
        - Damages unit economics and NPV
        - Reduce valuation range and reset adoption assumptions
      - - Timeline slip
        - Commercial launch or regulatory milestones move out again
        - Extends the long-R&D skepticism cycle
        - Lower probability weight on bull case
      - - Partnership economics disappoint
        - Exact or Roche relationships are low-value or heavily restricted
        - Removes narrative support without adding economics
        - Treat partnerships as marketing, not valuation support
    notes: >-
      Kill triggers translate narrative risks into observable signals the investment committee can actually monitor
      after entry or before committing new capital.
    claimRefs:
      - CV024
      - CV033
      - CV034
      - CV035
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - Ask
      - Missing evidence
      - Why it matters
      - Owner / next step
    rows:
      - - HARMONY topline performance
        - Sensitivity, specificity, and workflow characteristics
        - Determines whether the bull case exists at all
        - Management / upcoming data release
      - - Regulatory path
        - PMA versus LDT sequencing and timeline
        - Changes launch timing and approval probability
        - Management / regulatory counsel
      - - Fully diluted cap table
        - Sponsor promote, options, earnouts, and PIPE ownership bridge
        - Converts headline equity value into common-share economics
        - Finance / deal counsel
      - - Post-close cash and runway
        - Cash sources and uses plus launch burn assumptions
        - Separates base case from financing-risk bear case
        - Finance / board materials
      - - Assay economics
        - COGS, gross margin path, and lab scaling assumptions
        - Required for rNPV and long-run moat assessment
        - Operations / lab leadership
      - - Exact and Roche economics
        - Milestones, royalties, exclusivity, and channel obligations
        - Determines whether partnerships add actual valuation support
        - BD / legal
    notes: >-
      These are the specific diligence items that would move the chapter from research-more toward investable, not a
      generic request list.
    claimRefs:
      - CV036
      - CV037
      - CV038
