      - number: '7.5'
        title: Mitigations, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The practical way to manage this chapter is not to pretend the risk stack is low; it is to define what
              evidence would move it. The company already has some meaningful mitigants: a large completed
              registrational study, an existing category reimbursement precedent, and commercial partners that can
              shorten time-to-market if the core clinical package is strong. Those strengths only matter if they survive
              specific tests. Investors should require a disclosed HARMONY performance bridge to incumbents, clear PMA
              timing, de-SPAC cash certainty, partner-control clarity, and a more legible launch organization before
              underwriting a clean commercialization narrative. Kill criteria should therefore be observable rather than
              rhetorical. Delayed or underwhelming data, shallow post-close cash, weak payer-readiness proof, or
              ambiguous partner incentives are all events that can be monitored from the outside and should force a
              valuation reset rather than a benefit-of-the-doubt extension.
