      - number: '1.3'
        title: Funding history, valuation, and capital structure
        blocks:
          - type: paragraph
            body: >-
              Freenome has raised approximately $1.5 billion across multiple funding rounds since its founding, making
              it one of the best-capitalized private cancer diagnostics companies globally. The funding trajectory
              includes a $65 million Series A in 2017 led by Andreessen Horowitz with participation from Google
              Ventures, a $160 million Series B in 2019, a $270 million Series C in 2020 led by Bain Capital Life
              Sciences and RA Capital Management, and a $250 million Series D in 2022 led by Perceptive Advisors and
              Andreessen Horowitz. In December 2025, Freenome announced a definitive agreement to merge with Perceptive
              Capital Solutions Corp (NASDAQ: PCSC), a special purpose acquisition company, through a transaction
              supported by a $240 million PIPE at $10 per share. The post-transaction equity value was announced at $1.1
              billion, implying significant down-round dynamics relative to the rumored $4+ billion valuation at the
              Series D round. The shareholder vote for the SPAC merger is scheduled for July 9, 2026, meaning Freenome
              remains private as of the research date. Capital adequacy appears sufficient to fund operations through
              commercialization given the PIPE proceeds plus existing cash, though exact runway depends on the pace of
              commercial launch spend and clinical trial costs for the lung cancer program.
