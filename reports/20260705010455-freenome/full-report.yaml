  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, revenue quality, and recognition mechanics
        blocks:
          - type: paragraph
            body: >-
              Freenome does not yet have commercial product revenue, so the quality question is prospective rather than
              historical. The likely model is straightforward in structure even if not yet proven in volume: a physician
              orders a blood-based colorectal cancer screening test, a specimen is collected and processed through
              Freenome's CLIA laboratory workflow, results are reported back to the ordering provider, and the
              laboratory then bills Medicare, Medicaid, or commercial payers for the completed assay. That means revenue
              is expected to be transactional, fee-per-test, and tied to medical-necessity and coverage rules rather
              than software subscriptions or upfront licenses. Potential non-test inflows such as Roche biomarker
              milestones or the Exact Sciences collaboration may help cash needs, but public disclosures do not
              establish them as dependable operating revenue. The practical consequence is that near-term financial
              quality depends on reimbursement, physician ordering behavior, and clean claims collection, while current
              revenue remains effectively zero until launch begins.
