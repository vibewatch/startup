  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and reimbursement risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is still the first lens because Freenome has not yet crossed the two milestones that make
              a blood-based screening thesis underwritable at scale: a disclosed registrational performance package and
              a cleared path to durable reimbursement. HARMONY enrollment is complete, but public materials still stop
              short of giving investors the exact sensitivity and specificity numbers that would let them compare
              Freenome directly with Shield, FIT, colonoscopy, or other noninvasive options. That missing disclosure
              matters more now that Guardant has already established an FDA-approved and commercially available
              benchmark. CMS has already shown that blood-based colorectal screening can win category coverage, but that
              does not guarantee that Freenome will receive the same treatment on the same timeline. Add ongoing
              LDT-policy litigation, molecular-diagnostics patent risk, and healthcare fraud-and-abuse obligations, and
              the regulatory and legal stack remains the chapter’s highest-conviction source of launch delay risk.
