  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying patterns
        blocks:
          - type: paragraph
            body: >-
              Freenome's future customer map is multi-sided even though the product is not yet launched. The ordering
              surface starts with primary care physicians and gastroenterologists, because guideline-eligible
              average-risk adults usually enter colorectal screening through routine visits, preventive reminders, or
              specialist follow-up. The economic payer is usually Medicare or a commercial plan rather than the patient,
              which means coverage policy and follow-up colonoscopy rules shape adoption as much as physician interest
              does. Health systems and IDNs matter as operational customers because they control phlebotomy, lab
              routing, care navigation, and quality metrics across large screening populations. Patients still matter
              directly because convenience, discomfort avoidance, and awareness determine whether a physician-ordered
              option actually gets completed. Exact Sciences adds a final quasi-customer segment: it is not a buyer in
              the classic sense, but it can become the key commercialization channel that translates Freenome's assay
              into real ordering volume.
