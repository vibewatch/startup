  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, classes, and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              Freenome's near-term competitive arena is not one clean peer set but a layered market of direct
              blood-based colorectal cancer screening vendors, established stool and procedure incumbents, adjacent
              multi-cancer early detection programs, and a small set of likely entrants. Guardant Health is the clearest
              direct benchmark because Shield is already FDA-authorized and reimbursed, while Exact Sciences remains the
              most important incumbent because Cologuard and Cologuard Plus already own physician workflow, outreach,
              and logistics in colorectal screening. GRAIL competes from an adjacent angle by selling broader
              multi-cancer ambition, and Natera matters less as a current product rival than as a credible entrant if it
              redeploys its oncology relationships into screening. Colonoscopy and FIT or gFOBT still control the status
              quo budget and referral path. Internal build is not a major practical substitute for most health systems
              because regulated assay development, guideline support, and reimbursement infrastructure are difficult to
              replicate locally.
            claimRefs:
              - CP001
