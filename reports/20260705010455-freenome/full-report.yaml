  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module / asset map
        blocks:
          - type: paragraph
            body: >-
              Freenome's product surface is now legible enough to underwrite as a real delivery system rather than as a
              research slogan. Public pages show a named lead product in SimpleScreen CRC, a health-system packaging
              layer built around blood draw plus workflow support, and a clinical-studies program that functions as both
              validation engine and pipeline asset base. That matters because the company is not merely selling the idea
              of blood-based cancer screening; it is trying to commercialize a routinized screening workflow that fits
              primary-care and health-system operations. The same surface also shows where the public boundary still
              sits. CRC is clearly the most mature use case, while lung and broader multi-cancer expansion remain
              follow-on programs. In other words, the available evidence supports a product family with one near-term
              lead asset, several validation and expansion assets around it, and a workflow story designed for health
              systems, but not yet a fully transparent multi-product menu with disclosed attach rates or service-level
