      - number: '2.5'
        title: Adoption constraints, contradictory estimates, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main caution is that category validation does not equal broad adoption. Reimbursement remains the
              first gating issue, because Medicare process clarity and rate setting for blood-based tests still
              influence whether health systems treat the modality as routine. Clinical-performance thresholds are the
              second gate: without enough sensitivity, specificity, and guideline inclusion, physicians have limited
              incentive to change established colonoscopy and stool-testing workflows. False positives also impose real
              downstream cost and operational friction because every positive screen still routes into confirmatory
              colonoscopy. On top of those adoption frictions, the public market record still does not provide a clean
              Freenome-specific SAM or SOM. Published MCED estimates span from roughly $5 billion to more than $30
              billion depending on whether the source includes only screening, broader liquid biopsy, multiple
              geographies, or mixed cancer-type assumptions. For underwriting, that means the market story is credible
              but still range-bound and evidence-constrained rather than point-estimated.
            claimRefs:
