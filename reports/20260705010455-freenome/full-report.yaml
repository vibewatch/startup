      - number: '5.2'
        title: Technology and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The most supportable way to describe Freenome's architecture is as a blood-sample workflow that turns a
              simple phlebotomy event into a multi-layer biological classification problem. The public record shows
              blood collection from average-risk screening patients, laboratory processing inside a CLIA-certified
              environment, analyte extraction across DNA methylation and protein layers with additional RNA and other
              analytes described in 2026 AI materials, and then AI/ML scoring that converts those features into a
              physician-facing screening result. This is technologically differentiated, but it is also operationally
              demanding. Each extra analyte layer increases assay coordination, preanalytics sensitivity, and pipeline
              complexity; public sources are much stronger on the existence of the layers than on the exact internal
              service topology, compute throughput, or failure-handling logic that links them together. That means the
              platform looks real and sophisticated, yet still leaves meaningful diligence work around throughput,
              observability, and reproducibility before a technical committee should call it fully de-risked.
