        title: Milestones, partnerships, and adverse events
        blocks:
          - type: paragraph
            body: >-
              Freenome's milestone chronology spans founding in 2014 through multiple financing events, clinical trial
              execution, regulatory interactions, and strategic partnerships. The most significant clinical milestone is
              the completion of the HARMONY Phase 3 registrational trial for colorectal cancer screening, which enrolled
              approximately 25,000 average-risk adults aged 45-85 across more than 200 clinical sites in the United
              States. The trial was designed to support both FDA PMA submission and CMS coverage determinations.
              Strategic partnerships include a significant licensing deal with Roche announced in 2021 for early cancer
              detection biomarkers, validating Freenome's multi-omics approach and providing non-dilutive capital.
              Freenome also has a collaboration with Exact Sciences in the colorectal cancer screening space. On the
              adverse side, the company experienced significant valuation compression from rumored $4+ billion at Series
              D to $1.1 billion at the SPAC transaction, reflecting broader biotech market corrections,
              longer-than-expected timelines to commercialization, and competitive pressure from Guardant Health's
              Shield test which received FDA approval in 2024. The timeline from founding to potential commercial
              product spans over 12 years, which is notable even for clinical-stage diagnostics. Multiple leadership
              changes occurred in the early years, though the team has been stable since 2018.
