      - number: '8.4'
        title: Recommendation logic and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is Research-More / Track because the company quality and the price discipline point in
              different directions. Freenome is still interesting enough to follow closely: the market is large, the
              modality is intuitive, and differentiated data could re-rate the equity quickly. But it is not yet
              investable on public evidence alone because the missing inputs are exactly the ones that determine
              common-shareholder value. HARMONY still has not published the performance metrics that would justify a
              premium multiple. The SPAC vote and redemption outcome can change cash at close. Sponsor promote mechanics
              can dilute the apparent entry mark. And reimbursement still has to prove durable for Freenome rather than
              just for Guardant. The investment committee should therefore watch for a small set of explicit kill
              triggers rather than drift into narrative underwriting.
            claimRefs:
              - CV014
