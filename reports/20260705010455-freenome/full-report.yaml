  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Freenome should be analyzed inside a specific market boundary rather than a generic 'liquid biopsy' label.
              The relevant core market is routine, asymptomatic cancer screening through a blood draw, with the
              near-term commercial wedge in average-risk colorectal cancer screening. That means included spend is
              preventive screening budget that today flows to colonoscopy, FIT, gFOBT, and stool-DNA pathways, plus the
              clinical workflow and payer infrastructure that supports population outreach. Excluded spend includes
              oncology-treatment monitoring, minimal residual disease surveillance, and therapeutic liquid biopsy use
              cases that sit in a different budget and clinical-decision context. Boundary discipline matters because
              the apparent TAM expands dramatically when every liquid-biopsy use case is counted together. For Freenome,
              the investable question is not whether all liquid biopsy is large, but whether blood-based CRC screening
              can displace enough screening deferral, stool-test friction, and colonoscopy avoidance to become a
              reimbursed mainstream category.
