  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest residual exposure sits where undisclosed Phase 3 performance, reimbursement uncertainty, and partner
      dependence interact.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: HARMONY data disclosure / PMA timing
          values:
            - label: high
              tone: negative
              detail: Public metrics are still missing as of the run date.
            - label: high
              tone: negative
              detail: This directly governs launch timing and competitive credibility.
            - label: medium
              tone: warning
              detail: Trial enrollment is complete, which is helpful but not sufficient.
            - label: high
              tone: negative
              detail: Residual risk stays high until the exact performance package is public.
        - label: Reimbursement and pricing
          values:
            - label: medium-high
              tone: warning
              detail: A category exists, but Freenome-specific coverage is not automatic.
            - label: high
              tone: negative
              detail: Coverage and realized price determine whether launch volume is economically usable.
            - label: medium
              tone: warning
              detail: Guardant and CMS lower uncertainty but do not eliminate it.
            - label: medium-high
              tone: warning
              detail: Residual risk remains because later entrants can still face price and policy friction.
        - label: Exact / Roche partner dependence
          values:
            - label: medium-high
              tone: warning
              detail: Commercial and geographic leverage sit partly with counterparties.
            - label: high
              tone: negative
              detail: Misaligned incentives can slow access, pricing, or roadmap control.
            - label: medium
              tone: neutral
              detail: Partnerships provide real distribution and validation benefits.
            - label: high
              tone: negative
              detail: Residual exposure stays high because the core launch still depends on partner execution.
        - label: Assay scale-up and QA complexity
          values:
            - label: medium-high
              tone: warning
              detail: Multi-omics orchestration is harder than a narrower assay.
            - label: high
              tone: negative
              detail: Quality slips would damage both regulator and payer confidence.
            - label: low-medium
              tone: warning
              detail: Public evidence on reproducibility and throughput is thin.
            - label: medium-high
              tone: warning
              detail: Residual risk is elevated until operating metrics are disclosed.
        - label: Cash runway and de-SPAC financing
          values:
            - label: medium
              tone: warning
              detail: The transaction adds capital, but the post-close cushion is still debated publicly.
            - label: high
              tone: negative
              detail: Weak cash coverage would shorten the time available to absorb launch delays.
            - label: medium
              tone: neutral
              detail: Prior capital raised and PIPE help, but exact runway remains private.
            - label: medium-high
              tone: warning
              detail: Residual risk remains until cash, burn, and redemption outcomes are transparent.
    approximationNotes: null
    claimRefs:
      - CR003
      - CR007
      - CR008
      - CR018
      - CR020
      - CR027
      - CR031
      - CR038
      - CR039
