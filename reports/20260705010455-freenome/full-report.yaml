  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main downside paths run from regulatory and operating uncertainty into delayed launch, heavier burn, and
      weaker valuation support.
    data:
      nodes:
        - id: n1
          label: Undisclosed HARMONY performance
          description: Public Phase 3 metrics remain incomplete.
        - id: n2
          label: PMA / reimbursement delay
          description: Approval or coverage timing slips.
        - id: n3
          label: Slower physician / payer adoption
          description: Launch readiness and market trust stay constrained.
        - id: n4
          label: Extended cash burn
          description: Science and launch costs continue without offsetting revenue.
        - id: n5
          label: New financing need
          description: Company may need more capital before proving commercial traction.
        - id: n6
          label: Valuation compression
          description: Investors reduce willingness to pay for the platform story.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n3
          to: n6
    approximationNotes: null
