  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Freenome is easy to understand: if a multi-omics blood test can show clearly
              differentiated colorectal cancer screening performance, the company could enter a very large screening
              market with a much more convenient modality than stool collection or colonoscopy. A physician-friendly
              blood draw, broad eligible population, and a category pricing anchor already established by Guardant
              create real upside if HARMONY data are strong. The anti-thesis is equally powerful. Guardant already has
              FDA approval and Medicare payment, Exact Sciences already owns workflow and outreach, and Freenome still
              has not launched a product after roughly twelve years of R&D. That history turns the company from a pure
              platform narrative into a clinical-proof bet. Until HARMONY converts the story into verified performance,
              the right framing is promising science plus unusually high execution risk.
            claimRefs:
              - CV001
              - CV002
