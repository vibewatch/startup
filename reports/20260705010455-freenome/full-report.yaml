      - number: '4.2'
        title: Pricing anchors, payer logic, and monetization range
        blocks:
          - type: paragraph
            body: >-
              Pricing is not publicly posted by Freenome, so the best supportable lens is anchoring to the newly created
              blood-based colorectal cancer reimbursement category. Medicare reimbursement near $920, established
              through the Guardant Shield pathway, is the clearest public benchmark because it shows what a covered
              blood-based CRC screen can earn in the market Freenome most needs to enter. That anchor makes the
              estimated $500-$1,500 Freenome launch range plausible, but it should not be mistaken for realized net
              price. Commercial plans may discount below list, and early contracting can differ materially by channel
              and geography. Freenome could argue for premium positioning if HARMONY data show stronger sensitivity or
              convenience-adjusted utility, but that upside still depends on regulatory acceptance and payer confidence.
              For underwriting, the right takeaway is that category pricing now exists, yet Freenome's own realized
              price, denial rate, and payer-mix economics are still unproven.
