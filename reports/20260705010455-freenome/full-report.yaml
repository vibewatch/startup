      - number: '7.3'
        title: Partner, competitive, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Freenome has chosen a faster but more dependency-heavy commercialization route than a company building
              everything itself. Exact Sciences gives the company distribution leverage, field access, and payer
              relationships that would be expensive to recreate, but the same exclusive structure concentrates U.S.
              launch execution in a partner whose own incentives can evolve. Roche adds ex-U.S. and technology
              optionality, yet that also means pieces of the future roadmap sit outside Freenome’s sole control.
              Competitive pressure compounds the dependency issue. Guardant already has an approved and marketed
              blood-based CRC product, Exact owns the installed colorectal workflow through Cologuard, and GRAIL keeps
              investor attention on broader MCED ambition. If blood-based CRC pricing converges around the existing CMS
              anchor, distribution reach and evidence quality may matter more than assay architecture alone. That makes
              partner alignment and competitor timing central strategic risks rather than second-order considerations.
