      - number: '2.2'
        title: Sizing lenses, TAM logic, and contradictory published estimates
        blocks:
          - type: paragraph
            body: >-
              The market is large enough to matter, but it is not clean enough to summarize with one headline number.
              Broad cancer-screening spend across modalities exceeds $50 billion globally, while published MCED outlooks
              cluster around roughly $20 billion to $30 billion by 2030. That is directionally attractive, yet
              Freenome's actual near-term commercial opportunity is narrower: blood-based colorectal cancer screening
              for guideline-eligible adults in the United States. A simple price-times-population lens using roughly 100
              million eligible adults and a $100-plus blood test already yields a $10 billion-plus category. Public
              sources also support a global colorectal screening market around $11 billion to $12 billion by 2028. The
              unresolved issue is not whether the market exists; it is whether public data can isolate a
              Freenome-specific SAM or SOM before FDA approval, pricing, and guideline inclusion are settled.
              Contradictory analyst ranges should therefore be preserved, not collapsed into false precision.
