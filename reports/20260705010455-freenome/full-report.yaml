            body: >-
              Durability is where public evidence is thinnest. No retained source discloses Freenome net revenue
              retention, gross retention, churn, renewal cadence, or top-customer concentration, which is unsurprising
              for a pre-launch diagnostics company but still leaves a real underwriting gap. The best available
              repeat-use proxy is the screening interval itself: current guidance and coverage benchmarks point to
              annual FIT, three-year stool-DNA and blood-based testing, and ten-year colonoscopy cycles, so a successful
              blood-test business should eventually behave more like a repeat preventive care category than a one-time
              acute diagnostic. That proxy is not the same thing as retention, because every positive non-invasive test
              still requires colonoscopy follow-up and because physician willingness to reorder depends on evidence
              quality, payer coverage, and workflow simplicity. Concentration risk also exists on the channel side:
              Exact Sciences could accelerate reach, but it could also become the dominant gateway through which
