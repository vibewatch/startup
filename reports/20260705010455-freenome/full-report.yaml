  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Indexed funnel values show that public evidence is strongest on broad need and validation readiness and weakest on
      live commercial customer conversion.
    approximationNotes: >-
      Indexed values are directional only. They summarize relative evidence strength from public sources rather than a
      company-disclosed commercial conversion funnel.
    data:
      items:
