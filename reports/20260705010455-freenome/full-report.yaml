      - number: '2.3'
        title: Buyer map, payer map, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying workflow is multi-actor even though the patient is the end user. Primary care physicians and
              gastroenterologists are the frontline ordering parties, because they control screening recommendations,
              diagnostic follow-up, and guideline interpretation. Health systems and GI practices matter as
              institutional accounts because screening volume is often operationalized through quality programs, patient
              reminders, and lab routing decisions rather than one-off test orders. Public payers, especially Medicare,
              remain the most important reimbursement anchor, while commercial plans determine how quickly a blood-based
              test can scale into younger commercially insured populations. The adoption path starts with a
              guideline-eligible adult receiving a screening recommendation, then choosing among colonoscopy,
              stool-based testing, or a non-invasive blood alternative when covered and clinically accepted. Employer
              and direct-to-consumer channels are real but still secondary; the core commercial pathway still runs
              through physician ordering, payer coverage, and follow-up colonoscopy after any positive result.
