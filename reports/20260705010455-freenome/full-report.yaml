      - number: '8.5'
        title: Final diligence asks and blockers
        blocks:
          - type: paragraph
            body: >-
              The remaining blockers are concrete, not philosophical. Investors need HARMONY topline performance, the
              exact regulatory and launch plan, a fully diluted post-close cap table, and a credible cash-runway bridge
              from merger close to first commercial inflection. They also need to understand whether the Exact Sciences
              and Roche relationships create actual economic value or mostly narrative validation. Without those
              answers, any valuation above the base case is speculation layered on top of already wide uncertainty. Exit
              readiness is similarly premature: until the clinical proof lands, Freenome looks more like a company that
              may need another private financing than one that can cleanly convert to an IPO-quality screening story.
              That does not make the company uninvestable forever, but it does make immediate entry discipline far more
              important than thematic enthusiasm.
