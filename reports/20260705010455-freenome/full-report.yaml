      - number: '4.5'
        title: Financial verdict, adverse views, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The underwriting verdict is high-risk but not incoherent. Freenome's proposed economics can work if three
              conditions hold together: reimbursement lands near the current category anchor, assay COGS move toward
              scale levels, and launch execution converts screening interest into covered physician orders quickly
              enough to offset burn. The problem is that several of the inputs investors need most are still missing
              from public evidence. Skeptical coverage has focused on precisely that gap between cash raised and cash
              required, arguing that the SPAC capital package may be small relative to launch needs and timeline
              uncertainty. The most important unresolved blockers are exact cash on hand, detailed burn composition,
              assay-level gross margin, undisclosed economics in Roche and Exact relationships, and the fully diluted
              effect of sponsor promote terms. Until those are disclosed, any valuation view has to rely on wide
              scenario ranges rather than a single conviction model.
