      - number: '3.5'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The durable moat question is less about whether blood-based screening is useful and more about who
              controls the approval, reimbursement, distribution, and data-feedback loops first. Guardant's first-mover
              FDA authorization creates a real time advantage because guideline inclusion and payer operationalization
              usually lag regulatory milestones, giving Shield a multi-year opportunity to normalize provider behavior
              before Freenome launches. Exact Sciences has a different moat centered on outreach, logistics, and
              familiarity with the colorectal screening workflow. Freenome's counter-argument is multi-omics
              differentiation, but that claim remains partly unverified until HARMONY results are publicly disclosed.
              The category also carries commoditization risk: if multiple blood tests converge toward similar
              sensitivity, specificity, and price near the Medicare anchor, then distribution power will matter more
              than assay nuance. Natera remains a credible entrant, and slower-than-expected Shield physician uptake is
              a useful warning that even a first mover still needs reimbursement clarity and workflow support to
              translate regulatory wins into volume.
