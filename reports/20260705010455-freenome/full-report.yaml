      - number: '3.4'
        title: Pricing, packaging, and go-to-market leverage
        blocks:
          - type: paragraph
            body: >-
              Pricing and go-to-market structure favor the companies that already have reimbursement and distribution
              muscle. Guardant's approximately $895 list price and roughly $920 Medicare reimbursement effectively
              anchor the blood-based CRC category for later entrants, because payers and providers now have a public
              reference point for what a covered blood screen can cost. Galleri shows the opposite pattern: it can
              command a roughly $949 self-pay price because it promises broader multi-cancer scope, but the lack of FDA
              approval and national coverage keeps it out of the most scalable primary-care reimbursement lanes. Exact
              Sciences competes less on a clean list price than on kit logistics, physician authorization flow, and
              long-standing patient outreach. Freenome's biggest unresolved competitive variable is GTM execution.
              Public sources support partnership relevance and category positioning, but they do not yet disclose launch
              staffing, channel design, or contracting strategy in enough detail to benchmark against Guardant or Exact.
