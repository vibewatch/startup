      - number: '8.2'
        title: Valuation context and comparable analysis
        blocks:
          - type: paragraph
            body: >-
              The current valuation context is dominated by the SPAC structure rather than operating results.
              Transaction materials point to about $1.1 billion of post-SPAC equity value and a $240 million PIPE priced
              at $10 per share, while cumulative capital raised reaches roughly $1.5 billion. That means investors have
              already put more money into Freenome than the new public-market entry mark implies, which is the clearest
              sign that this is a reset-priced asset rather than a late-cycle markup story. Public comparables reinforce
              that point. Guardant, Exact Sciences, and Natera all trade at much higher equity values, but each has more
              commercial proof, more revenue, or both. GRAIL's $7.1 billion takeout remains the best private anchor for
              what strategic buyers once paid for multi-cancer ambition, yet it also shows how far Freenome still is
              from a premium strategic outcome.
