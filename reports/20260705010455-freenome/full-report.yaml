      - number: '7.2'
        title: Operational, technology, and security risks
        blocks:
          - type: paragraph
            body: >-
              The operating risk is not that Freenome lacks technical ambition; it is that multi-omics screening is
              inherently harder to industrialize than a narrower single-modality assay. Public sources support a real
              product story around SimpleScreen CRC and a real clinical program around HARMONY, but they do not provide
              the laboratory-yield, turnaround, reproducibility, failure-rate, or throughput metrics that would let an
              outside investor judge scaling discipline directly. That opacity is especially important because every
              additional analyte layer can add new preanalytics, QA, software, and workflow failure points. Security and
              privacy risk also sits in this section rather than as a generic footnote because Freenome handles genomic
              and health-related information. A breach, model-control failure, or laboratory-quality issue would not
              merely create cleanup cost; it would directly threaten payer trust, physician adoption, and the
              willingness of partners to keep leaning into the launch.
