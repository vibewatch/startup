      - number: '3.3'
        title: Capability, clinical utility, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Capability comparison is where the distinction between CRC-specific products and broader MCED products
              matters most. Shield is optimized for one use case: average-risk colorectal cancer screening with a blood
              draw, and public comparisons suggest it sits above FIT on convenience-adjusted performance while still
              below colonoscopy's diagnostic and therapeutic standard. Galleri wins on breadth because it screens for
              many cancers, but that same breadth reduces its comparability to a single-cancer screening assay and
              contributes to a harder regulatory path. Exact Sciences offers a very different proposition: Cologuard and
              Cologuard Plus are already cleared, covered, and integrated into screening pathways, but stool collection
              remains a meaningful compliance drag that blood tests explicitly target. Freenome's differentiation claim
              rests on combining cfDNA with other analyte classes, which is strategically interesting but not fully
              externally validated until HARMONY sensitivity and specificity data are public.
