      - number: '3.2'
        title: Competitor profiles by scale, scope, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              The competitor profiles divide into three archetypes. Guardant is a focused blood-based CRC launch with
              public-company scale, regulatory validation, and the strongest reimbursement head start. GRAIL is
              breadth-first: Galleri covers more than 50 cancers and has commercial traction in employer and
              health-system channels, but it still lacks FDA approval and national insurance coverage. Exact Sciences is
              the incumbent distribution machine, monetizing a large installed base through stool-DNA screening and
              extending that base with Cologuard Plus. Natera is an adjacent oncology platform whose current strength is
              MRD and molecular testing rather than preventive screening, yet its physician relationships and laboratory
              operations make it a watch-list entrant. Freenome's own profile remains the most strategy-rich and
              evidence-thin: it is differentiated on public multi-omics framing and has partnership leverage through
              Exact Sciences, but it still lacks disclosed Phase 3 performance and a public commercial playbook.
