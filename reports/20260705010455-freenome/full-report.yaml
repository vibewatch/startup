      - number: '2.4'
        title: Growth drivers and category validation
        blocks:
          - type: paragraph
            body: >-
              Several demand drivers are real and near term. The first is demographics: the eligible colorectal cancer
              screening population continues to grow as the population ages, while younger-adult incidence keeps
              political and clinical attention on earlier detection. The second is guideline expansion. Lowering the
              recommended starting age to 45 materially widened the eligible base, creating more screening demand even
              before modality shifts are considered. Third, non-invasive blood testing fits a well-documented
              patient-preference story: easier sample collection can move some screening-averse adults into compliance.
              Fourth, Guardant Shield's FDA approval validated the category with physicians and payers by proving that
              blood-based CRC screening can clear a regulatory bar. Finally, reimbursement matters twice: CMS decisions
              influence direct payment mechanics for seniors and also set the benchmark that commercial plans often
              reference. Together these drivers support a real market wedge for Freenome even before a broader MCED
              panel becomes fully commercial.
            claimRefs:
