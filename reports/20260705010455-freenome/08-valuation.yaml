- id: scenario-analysis
  title: Bull, base, and bear scenario analysis
  body: 'Scenario analysis matters more than point-estimate valuation because Freenome is still a milestone business. In the bull case, HARMONY reads out well, the regulatory path looks credible, physicians accept a blood-based screening alternative, and investors begin underwriting Freenome as an approved or near-approved category leader; that can support a roughly $3 billion to $5 billion value. The base case assumes a more limited path: launch through a narrower channel, moderate reimbursement traction, and slower adoption while competitors remain ahead on proof and distribution, producing a roughly $1 billion to $2 billion value. The bear case is harsh but realistic for this stage: disappointing data, approval delay, weak coverage, or cash pressure can compress value into a roughly $300 million to $500 million band. The current $1.1 billion mark therefore already sits inside the base-case zone, not the bull case.'
