- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / signal
  - Why it matters
  - Action implication
  rows:
  - - Weak HARMONY data
    - No convincing clinical advantage versus available alternatives
    - Breaks the core product-differentiation thesis
    - Do not pay premium; reassess even base-case valuation
  - - Cash shortfall at close
    - Redemptions, fees, or structure leave materially less launch cash than expected
    - Raises dilution and execution risk simultaneously
    - Assume another financing sooner and lower fair value
  - - Coverage below category anchor
    - Reimbursement settles materially below current Guardant and CMS reference point
    - Damages unit economics and NPV
    - Reduce valuation range and reset adoption assumptions
  - - Timeline slip
    - Commercial launch or regulatory milestones move out again
    - Extends the long-R&D skepticism cycle
    - Lower probability weight on bull case
  - - Partnership economics disappoint
    - Exact or Roche relationships are low-value or heavily restricted
    - Removes narrative support without adding economics
    - Treat partnerships as marketing, not valuation support
  notes: Kill triggers translate narrative risks into observable signals the investment committee can actually monitor after entry or before committing new capital.
