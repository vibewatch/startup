- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Missing evidence
  - Why it matters
  - Owner / next step
  rows:
  - - HARMONY topline performance
    - Sensitivity, specificity, and workflow characteristics
    - Determines whether the bull case exists at all
    - Management / upcoming data release
  - - Regulatory path
    - PMA versus LDT sequencing and timeline
    - Changes launch timing and approval probability
    - Management / regulatory counsel
  - - Fully diluted cap table
    - Sponsor promote, options, earnouts, and PIPE ownership bridge
    - Converts headline equity value into common-share economics
    - Finance / deal counsel
  - - Post-close cash and runway
    - Cash sources and uses plus launch burn assumptions
    - Separates base case from financing-risk bear case
    - Finance / board materials
  - - Assay economics
    - COGS, gross margin path, and lab scaling assumptions
    - Required for rNPV and long-run moat assessment
    - Operations / lab leadership
  - - Exact and Roche economics
    - Milestones, royalties, exclusivity, and channel obligations
    - Determines whether partnerships add actual valuation support
    - BD / legal
  notes: These are the specific diligence items that would move the chapter from research-more toward investable, not a generic request list.
