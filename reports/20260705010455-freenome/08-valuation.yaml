- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Clinical product
    - Multi-omics could produce a best-in-class CRC screen
    - No public HARMONY performance yet
    - Published sensitivity and specificity that outperform practical alternatives
  - - Market
    - CRC screening is large, underpenetrated, and physician relevant
    - Large TAM does not matter if adoption is slow
    - Proof of physician ordering and payer coverage
  - - Competition
    - Guardant validates category demand
    - Guardant and Exact already own proof and workflow
    - Evidence that Freenome can win share despite incumbent advantages
  - - Capital
    - The PIPE can fund the next de-risking steps
    - Raised capital already exceeds current value and more funding may still be needed
    - Clear runway bridge through launch
  - - Platform narrative
    - Exact and Roche relationships support external validation
    - Partnership headlines do not equal monetizable economics
    - Disclosed milestone, royalty, or channel economics
  - - Timing
    - A strong HARMONY readout could re-rate the equity quickly
    - Twelve years without product heightens skepticism
    - A launch calendar that actually compresses timeline risk
  notes: Rows enumerate the core valuation dimensions rather than every diligence lens; each row balances a real upside thesis against the main present-tense rebuttal.
