chapter:
  number: 8
  title: Valuation
  summary: 'Freenome''s proposed $1.1 billion post-SPAC value is not obviously irrational, but it is only supportable as a base-case underwriting mark for a pre-revenue, pre-data screening company that has already raised roughly $1.5 billion. The upside is meaningful if HARMONY proves a differentiated multi-omics test and the $240 million PIPE funds approval and launch. The problem is that pending clinical data, unresolved dilution mechanics, and no commercial proof keep the value range extremely wide. Recommendation: Research-More / Track; underwrite to the base case, not the headline TAM.'
sections:
- id: investment-thesis
  title: Investment thesis and anti-thesis
  body: 'The bull case for Freenome is easy to understand: if a multi-omics blood test can show clearly differentiated colorectal cancer screening performance, the company could enter a very large screening market with a much more convenient modality than stool collection or colonoscopy. A physician-friendly blood draw, broad eligible population, and a category pricing anchor already established by Guardant create real upside if HARMONY data are strong. The anti-thesis is equally powerful. Guardant already has FDA approval and Medicare payment, Exact Sciences already owns workflow and outreach, and Freenome still has not launched a product after roughly twelve years of R&D. That history turns the company from a pure platform narrative into a clinical-proof bet. Until HARMONY converts the story into verified performance, the right framing is promising science plus unusually high execution risk.'
