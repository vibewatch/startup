  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: harmony-results
    missingEvidence: Public or management-shared HARMONY sensitivity, specificity, and workflow performance results.
    whyItMatters: The entire bull case and any premium multiple depend on whether Freenome can prove clinically differentiated screening performance.
    diligencePath: Wait for a conference, filing, or company release with topline HARMONY data, then rebuild the scenario table using the actual test characteristics.
    relatedQuestionRefs:
    - QV009
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: fully-diluted-cap-table
    missingEvidence: A fully diluted post-close share-count bridge including sponsor promote, rollover equity, options, earnouts, and PIPE ownership.
    whyItMatters: Headline equity value cannot be translated into common-equity entry price or downside protection without the full capitalization waterfall.
    diligencePath: Review the definitive capitalization tables and merger exhibits under NDA before converting enterprise value into per-share economics.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV001
    - TV006
  - type: conflicting-data
    severity: material
    topic: post-close-cash-runway
    missingEvidence: Exact cash on hand at close, expected redemptions, launch burn, and management runway assumptions.
    whyItMatters: The base and bear cases diverge quickly if net cash is meaningfully below the headline PIPE or if commercialization burn is higher than expected.
    diligencePath: Reconcile the merger cash sources and uses table with management burn forecasts and the final redemption outcome after the vote.
    relatedQuestionRefs:
    - QV025
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: partnership-economics
    missingEvidence: Economic terms for the Exact Sciences and Roche relationships, including milestones, exclusivity, revenue share, and commercialization obligations.
    whyItMatters: Partnership headlines can improve narrative quality, but they do not create valuation support until the economics and control rights are known.
    diligencePath: Request the commercial agreements or management summaries that quantify what value, if any, flows to Freenome common shareholders.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: Cleaner 2026 private comparable marks with disclosed terms and current revenue context for cancer-screening peers beyond the public comp set.
    whyItMatters: TV004 is directionally useful, but missing private-market detail keeps the comparable frame wider than an IC would want for precision pricing.
    diligencePath: Add newer private financing memos, investor mark schedules, or management-provided peer sets that disclose enough detail to tighten the comparable band.
    relatedQuestionRefs:
    - QV010
    - QV014
    relatedTableRefs:
    - TV004
