evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: burn rate
    missingEvidence: Exact annual burn rate, monthly cash consumption, and remaining runway post-PIPE proceeds
    whyItMatters: Critical for assessing whether SPAC proceeds plus existing cash fund operations through commercialization
    diligencePath: Request financial projections from S-4 filing or management presentation
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: HARMONY results
    missingEvidence: Sensitivity, specificity, and positive predictive value from HARMONY Phase 3 trial
    whyItMatters: Clinical performance data determines regulatory approvability and competitive positioning vs Guardant Shield
    diligencePath: Await public data release at medical conference or in SEC filing
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: liquidation preferences
    missingEvidence: Liquidation preference stack, participation rights, and anti-dilution terms for $1.5B in prior funding
    whyItMatters: Determines actual equity value available to common shareholders post-SPAC
    diligencePath: Review S-4 pro forma capitalization tables and merger agreement exhibits
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: minor
    topic: leadership completeness
    missingEvidence: Full C-suite roster, scientific advisory board members, and board composition post-SPAC
    whyItMatters: Leadership depth and governance quality affect execution risk assessment
    diligencePath: Review S-4 filing management section and proxy statement for complete director slate
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: investor ownership
    missingEvidence: Exact ownership percentages, voting rights, and board seat allocations for each major investor
    whyItMatters: Stakeholder control dynamics affect governance and strategic direction post-SPAC
    diligencePath: Review S-4 pro forma ownership tables and shareholder agreements
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: >-
      Methodology-level breakdown of each MCED market size estimate needed to reconcile the public range from about $5B
      to more than $30B.
    whyItMatters: >-
      Wide public dispersion creates underwriting uncertainty because some estimates appear to include broader
      liquid-biopsy categories or non-U.S. multi-cancer panels.
    diligencePath: >-
      Request Freenome's internal market model from S-4 investor materials and cross-check it against the underlying
      MarketsandMarkets and Grand View Research methodologies.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Freenome GTM strategy
    missingEvidence: >-
      Freenome's commercial sales-force size, launch sequencing, distribution partnerships, and post-approval
      contracting plan have not been publicly detailed.
    whyItMatters: >-
      Launch execution will determine whether Freenome can penetrate a market where Guardant and Exact Sciences already
      have workflow and reimbursement advantages.
    diligencePath: >-
      Review the Freenome S-4 commercial plans section and management presentations for a detailed go-to-market roadmap
      and operating buildout.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: spac-sponsor-dilution
    missingEvidence: >-
      Complete SPAC promote structure, founder-share surrender conditions, earnout mechanics, and the effective
      post-SPAC fully diluted share count.
    whyItMatters: >-
      Sponsor economics can materially dilute common shareholders and change the true cash-per-share outcome of the
      merger.
    diligencePath: >-
      Review the definitive proxy/prospectus and linked exhibits on SEC EDGAR for promote schedule, forfeiture
      thresholds, and fully diluted capitalization tables.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: service-level-gap
    missingEvidence: Validated routine operating metrics for turnaround time, report latency, exception handling, and service credits.
    whyItMatters: >-
      A screening workflow can look clinically credible yet still fail buyers if result timing and operational
      reliability are weak or inconsistent.
    diligencePath: >-
      Request commercial launch playbooks, operational dashboards, and signed customer implementation materials that
      show target and actual turnaround metrics.
    relatedQuestionRefs:
      - QE022
    relatedTableRefs:
      - TE002
      - TE004
  - type: access-blocked
    severity: material
    topic: cap-gap
    missingEvidence: A durable CAP listing or certificate tied directly to Freenome's Brisbane laboratory.
    whyItMatters: >-
      Additional accreditation proof materially changes buyer comfort around quality systems and laboratory governance
      beyond the disclosed CLIA status.
    diligencePath: >-
      Search the live CAP directory by legal entity and address, then obtain the current certificate or screenshot the
      authoritative listing.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: sample-stability-gap
    missingEvidence: >-
      Validated sample-stability windows, cold-chain tolerances, redraw criteria, and excursion handling thresholds for
      routine operations.
    whyItMatters: >-
      Preanalytic instability can undermine assay performance and make real-world screening quality worse than
      controlled-study results suggest.
    diligencePath: >-
      Request SOP excerpts, stability-validation reports, and QC excursion logs from laboratory operations and
      assay-development teams.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE003
      - TE004
  - type: private-evidence-only
    severity: material
    topic: bioinformatics-gap
    missingEvidence: >-
      A detailed system diagram showing feature generation, model serving, throughput limits, monitoring, alerting, and
      rollback controls.
    whyItMatters: >-
      High-level AI descriptions do not answer whether the production pipeline is observable, resilient, and
      economically scalable for large screening volumes.
    diligencePath: >-
      Request an engineering architecture review with pipeline diagrams, throughput benchmarks, model-governance
      controls, and incident-response examples.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: privacy-controls
    missingEvidence: >-
      A product-specific HIPAA and security control matrix covering PHI flows, access controls, logging, retention, and
      third-party processors.
    whyItMatters: >-
      A generic privacy notice is not sufficient to underwrite operational security, regulated data handling, or
      enterprise procurement readiness.
    diligencePath: >-
      Request the latest security packet, HIPAA risk assessment, vendor list, and any trust-center materials used in
      enterprise diligence.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: commercial-customer-count
    missingEvidence: >-
      A current count of contracted or live Freenome commercial accounts, segmented by physician office, health system,
      and payer mix.
    whyItMatters: >-
      Without launch-account disclosure, customer quality cannot be distinguished from trial readiness, and the
      named-proof table remains a partial proxy rather than real customer traction.
    diligencePath: >-
      Request the launch pipeline, signed account list, first-ordering sites, and any post-approval deployment
      agreements.
    relatedQuestionRefs:
      - QU020
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      NRR, GRR, churn, renewal cadence, reorder behavior, and physician satisfaction by cohort once the product is
      commercially available.
    whyItMatters: >-
      Customer durability is central to underwriting a preventive screening company, and today's public evidence
      substitutes category cadence for actual retention data.
    diligencePath: >-
      Request cohort-level retention tables, reorder rates, satisfaction surveys, and follow-up colonoscopy completion
      metrics after first commercial launch.
    relatedQuestionRefs:
      - QU019
      - QU026
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Revenue-share, commercialization-control, exclusivity trigger, and termination details for the Exact Sciences
      relationship plus any alternative channel plans.
    whyItMatters: >-
      If Exact becomes the dominant route to market, Freenome may trade faster reach for meaningful concentration and
      strategic-flexibility risk.
    diligencePath: >-
      Review the full commercial agreement, revenue-sharing terms, field-role split, and fallback plan if Exact
      underperforms or reprioritizes.
    relatedQuestionRefs:
      - QU021
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: minor
    topic: named-proof-completeness
    missingEvidence: >-
      A fuller named roster of provider sites or early adopters that can move the chapter from sampled proof to a more
      complete customer ledger.
    whyItMatters: >-
      The current named proof is enough to show real readiness, but not enough to measure how concentrated or
      representative the future account base may be.
    diligencePath: >-
      Ask management for the complete site roster, future conversion targets, and a map from PREEMPT sites to
      launch-priority health systems.
    relatedQuestionRefs:
      - QU026
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: clinical-performance
    missingEvidence: >-
