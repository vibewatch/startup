company:
  name: "Andela"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Andela has repositioned from an Africa-centered developer training and placement company into a
    broader AI-native talent and delivery platform anchored by Andela Talent Cloud, but the public
    evidence available in this worker pool remains much stronger on positioning and milestones than on
    current financial disclosure. The clearest reusable ground truth for later chapters is a 2014
    founding, New York headquarters with strong African roots, a September 2024 CEO transition to
    Carrol Chang, and a still-stale public valuation marker from the September 2021 Series E.
sections:
  - id: "identity-positioning"
    title: "Identity, positioning, and operating footprint"
    body: >
      The assigned source set shows a company that now markets itself less as a traditional staffing
      intermediary and more as the human execution layer for enterprise AI adoption. Official pages
      describe Andela Talent Cloud as an integrated platform that helps enterprises source, qualify,
      hire, manage, and pay global technical talent, while the homepage adds AI delivery and workforce
      upskilling to that core marketplace story. Third-party profiles keep the older identity in view:
      Andela was founded in 2014 in Lagos, Nigeria, and public profiles now place headquarters in New
      York while still emphasizing African roots. For later chapters, the safe shorthand is that Andela
      is a late-stage private talent marketplace and AI-talent platform whose commercial story spans
      hiring, assessment, compliance, and AI-oriented workforce development rather than one narrow
      product SKU.
    claimRefs: [CO001, CO002, CO003, CO004, CO007, CO008]
    tableRefs: [TO001]
  - id: "leadership-governance"
    title: "Leadership transition and governance visibility"
    body: >
      Leadership is a meaningful live variable in the current report vintage. Public founder histories
      consistently frame Andela as a multi-founder company rather than a single-founder business, and
      third-party profiles say Carrol Chang took over as CEO in September 2024 after a long operating
      tenure at Uber. That matters because the current strategic narrative—AI-native engineers,
      technical assessment depth, and upskilling partnerships—is closely tied to her repositioning
      agenda. The same evidence set is much thinner on governance mechanics: it identifies some current
      executives and major financing backers, but it does not disclose current board composition,
      ownership percentages, or durable control rights. That leaves clear key-person and governance
      diligence asks even though the operating direction is easier to describe than the formal decision
      structure behind it.
    claimRefs: [CO005, CO006, CO014]
    tableRefs: [TO002]
  - id: "funding-scale-disclosure"
    title: "Funding history, scale markers, and disclosure limits"
    body: >
      The best public financing marker in this worker pool is still historical rather than fresh: third-
      party histories point to a $200 million Series E in September 2021 and roughly $381 million of
      cumulative capital raised, with the last widely cited valuation at about $1.5 billion. Official
      current pages are more helpful on commercial scale than on finance, highlighting 2,000+ global
      client MSAs, 17K deployable AI-native engineers, and 150K+ learners forming the next talent
      cohort. Those are useful operating indicators, but they are not substitutes for revenue, cash,
      margin, or current headcount disclosure. For diligence purposes, this means Andela looks large
      enough to matter strategically, yet still opaque on the metrics investors would need to judge the
      durability of that scale or the freshness of the last private-market price.
    claimRefs: [CO007, CO008, CO009, CO010, CO014]
    tableRefs: [TO003]
  - id: "milestones-adverse-context"
    title: "Operating-model shifts, milestones, and adverse context"
    body: >
      The milestone history matters because it explains why Andela should now be analyzed as a broader
      platform company rather than only as an African developer pipeline. Third-party histories mark a
      2020 shift to a fully remote, borderless marketplace; official sources then show a March 2023
      Qualified acquisition and the October 2023 launch of Andela Talent Cloud. More recent third-party
      profiles add 2025-2026 AI-oriented milestones, including upskilling partnerships and the Woven
      acquisition. That forward motion is real, but the same assigned evidence set also contains adverse
      signals: layoff episodes, criticism that the model can extract African talent without enough local
      reinvestment, and a May 2024 lawsuit filed by Toptal. The overview judgment is therefore mixed:
      Andela keeps evolving, but it does so with meaningful execution, legal, and narrative risk still
      attached.
    claimRefs: [CO011, CO012, CO013, CO015]
    figureRefs: [FO001]
