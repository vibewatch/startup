  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Independent market studies or company disclosures that isolate TAM, SAM, SOM, and product-line revenue mix for hire, build, and upskill workflows.
      whyItMatters: Without those splits, valuation work has to rely on broad category narratives instead of addressable-revenue math.
      diligencePath: Request management's segment revenue bridge, attach-rate assumptions, and any third-party market work they use internally.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: demand-footprint
      missingEvidence: Active customer counts, deployment-seat volumes, renewal rates, and average contract values behind the 650+ clients served and 2,000+ MSA claims.
      whyItMatters: Reach metrics do not show how much budget is recurring, deployed, or concentrated in a few accounts.
      diligencePath: Ask for cohort retention, active-account, and ACV data split by embedded talent, managed delivery, and training products.
      relatedQuestionRefs: [QM003, QM008]
    - type: missing-source
      severity: minor
