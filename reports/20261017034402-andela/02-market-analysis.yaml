    approximationNotes: >-
      The figure mixes supply-side and demand-side denominators from different sources and
      should be read as a constrained market-access stack, not as a modeled TAM/SAM/SOM
      waterfall or an implied conversion funnel.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM014]
