      - number: '2.3'
        title: 受证据约束的市场规模、驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持分层的市场触达判断，而非精确的 TAM/SAM/SOM 规模链。Andela 发布了若干有用但不可直接比较的分母：提供行为数据的 5.6M+ 开发者生态、培训过的 200K+ 技术人员、17K
              名可部署 AI 原生工程师、覆盖 135 个国家的 150K+ 名资深技术人员网络、650+ 个服务客户，以及 2,000+ 个全球
              MSA。这些指标显示供应广度和企业触达真实存在，却没有揭示产品线收入组合、活跃客户数、合同规模或抽成率。结果是，市场故事有可见的需求动能和可信的规模信号，但投资人要把品类广度转化为可辩护的估值假设，仍需尽调定价、转化率和分部经济性。
            claimRefs:
