      - number: '4.2'
        title: 定价仍不透明，公开效率指标仍只是营销代理
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的商业信号是结果主张，而非公开价目表。Andela 委托 Forrester 的研究称，综合客户获得了 97% 的三年 ROI，招聘速度快 66%；更早的 Talent Cloud
              发布稿称招聘最快可在 48 小时内完成，成本效率提高 30% 至 50%。这些指标对 GTM 定位有方向性价值，却不能替代实际定价、获客成本、回收期、折扣或净收入留存。资料中的反向证据同样重要：Flexiple
              的竞争比较没有为 Andela 的定价行提供来源，反而列出 30 天终止、按月支付人才费用，以及承包商负责税费和福利等合同机制。因此，Andela
              的公开经济模型在商业上看似可信，但价目表信息过少且依赖样本，尚不足以有把握地评估。
