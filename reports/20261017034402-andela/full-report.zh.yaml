              - CV015
      - number: '8.3'
        title: 乐观、中性与悲观情景
        blocks:
          - type: paragraph
            body: >-
              指定公开证据无法支持精确估值区间，因为资料没有当前经审计财务数据、近期融资文件，或高于 2021 年 E
              轮参考点的已披露私募市场标记。因此，情景分析聚焦于要实现什么条件，才能相对这一历史基准溢价、接近持有，或向下重置。关键变量不是 Andela 是否拥有可信市场——人才和 AI
              需求叙事清晰可见——而是公司能否把所称生态规模和 AI 定位转化为持久的企业经济性。在这座桥得到证明前，情景分化仍很大，下行保护比上行故事更重要。
            claimRefs:
              - CV004
              - CV005
              - CV006
