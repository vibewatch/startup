  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Andela 当前定义的市场不止人才匹配。其材料如今把三类相邻预算打包为一套方案：嵌入式 AI 原生工程师、托管式 AI 系统开发，以及面向 AI
              采用的劳动力技能提升。这一点很重要，因为估值和采用率应放在一个横跨类人力服务、类专业服务和赋能支出的混合市场中考量，而不是套用笼统的“未来工作”TAM。独立摘要也印证，外部观察者仍主要把 Andela
              看作人才市场或人才平台，而非纯软件公司；因此替代方案分析必须包括内部招聘、咨询公司、外包伙伴和内部赋能项目，而不只是其他自由职业者网络。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM015
      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              当企业已有 AI 优先事项却缺少执行能力时，采用路径最清晰。Andela 在 2023 年推出 Talent Cloud
              时，将平台定位为让企业在一个工作流中招募、筛选、雇用、管理并向全球技术人员付款；较新的定位则转向帮助企业把 AI 从试验推入生产。因此，买方不止一个预算负责人：嵌入式人才和托管交付面向工程与数据负责人，企业 AI
              项目面向转型负责人，技能提升面向学习发展或工程赋能负责人。主要采用动力是 AI 就绪人才稀缺，以及无国界招聘更受接受；但定价不透明、项目结构偏企业化，使该平台对大型组织比对小型买家更容易评估。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
