      - number: '8.4'
        title: 最终尽调问题与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              下一步尽调应聚焦真正能影响价格的证据，而不是继续确认公司参与 AI 人才趋势。最重要的问题包括：2021
              年后的新融资或二级市场标记、经审计或达到董事会级别的收入和毛利率数据、客户集中度与续约证据，以及说明已报告客户或 MSA
              中有多少转化为持久多年经济效益的桥接数据。论点破坏触发条件很明确：没有新经济数据却高于最近已知 $1.5 billion 基准加价，AI 原生定位未能转化为留存或利润率扩张，或竞争性定价压力正在以快于
              Andela 上移高端市场的速度侵蚀市场模式。
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
