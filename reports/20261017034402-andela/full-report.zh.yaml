  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合覆盖平台、人力服务与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的对比集合显示，买方并非只拿 Andela 与其他非洲起源市场比较。竞争对手发布的资料和独立替代方案指南将其与 Turing、Toptal、Arc.dev 等全球人才平台并列，也与
              South、Nearsure、Howdy、BairesDev 等区域人力与增员方案并列。这种广度很重要，因为买方真正的选择往往不是“选 Andela
              还是不选”，而是哪种供给模式最适合其地域、团队结构和合同形态。时区重叠和更紧密的团队协作比全球搜索广度更重要时，区域供应商更有吸引力；买方需要填补更窄的岗位或更短承诺时，自由职业和市场模式更合适。现状内部招聘，加上独立的评估、合规和付款工具，也属于有效竞争版图，因为
              Andela 的卖点正是把这些工作流收拢到一个界面，而不是让客户自行拼装。
            claimRefs:
              - CP003
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP013
      - number: '3.2'
        title: 产品广度超过人力服务，但打包方式不够灵活
        blocks:
          - type: paragraph
            body: >-
              Andela 的官方定位已超出传统人员增补。当前页面主推一个平台，用于招聘 AI 工程师、构建 AI 系统并提升内部劳动力技能；2023 年 Talent Cloud
              发布时，则把工作流描述为在一个一体化产品内招募、筛选、雇用、管理并向全球技术人才付款。这让 Andela 比单一路径招聘网络具备更广的解决方案主张，代价是打包方式。保留的第三方评论称其采用承包商模式、最低 12
              个月合作期和私下定价；Tecla 的文章还称把人才转为内部员工需支付转换费。因此，Arc
              式市场招聘、按小时网络或无最低期限的人力方案，对需要试验、小额支出或项目制承诺而非长期托管关系的买方可能更灵活。资料对期限刚性也有分歧：Tecla 报告最低 12 个月，Flexiple 则称持续 MSA
              下可提前 30 天终止项目。因此，主要合同条款仍是尽调缺口，而非已经坐实的竞争劣势。
