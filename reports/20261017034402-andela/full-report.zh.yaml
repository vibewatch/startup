chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与运营版图
        blocks:
          - type: paragraph
            body: >
              指定资料显示，Andela 如今不再主要把自己包装成传统人力中介，而是企业采用 AI 时的人力执行层。官方页面将 Andela Talent Cloud
              描述为一体化平台，帮助企业招募、筛选、雇用、管理并向全球技术人才付款；官网还在这一市场平台叙事上加入 AI 交付和劳动力技能提升。第三方资料仍保留其旧身份：Andela 2014
              年在尼日利亚拉各斯成立，公开资料如今将总部列在纽约，同时仍强调其非洲根基。后续章节可将其概括为：Andela 是一家后期阶段的私有人才市场和 AI 人才平台，商业故事覆盖招聘、评估、合规及面向 AI
              的劳动力发展，而非单一产品 SKU。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: 领导层变动与治理透明度
        blocks:
          - type: paragraph
            body: >
              本报告时点，领导层是一个重要的动态变量。公开创始人履历一贯将 Andela 描述为多位创始人共同创立，而非单一创始人公司；第三方资料称 Carrol Chang 在 Uber 长期任职后，于 2024 年 9
              月接任 CEO。这一点很关键，因为当前关于 AI
              原生工程师、技术评估深度和技能提升合作的战略叙事，与她推动的转型紧密相连。相同证据对治理机制的覆盖则薄弱得多：资料列出部分现任高管和主要融资方，却未披露现任董事会构成、持股比例或持续控制权。因此，关键人物和治理仍有明确的尽调问题，尽管运营方向比背后的正式决策结构更容易描述。
            claimRefs:
              - CO005
              - CO006
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO014
      - number: '1.3'
        title: 融资历史、规模标记与披露边界
        blocks:
          - type: paragraph
            body: >
              这批资料中最好的公开融资标记仍是历史信息而非最新信息：第三方历史资料指向 2021 年 9 月的 $200 million E 轮融资，累计融资约 $381 million，最近广泛引用的估值约为 $1.5
              billion。官方当前页面对商业规模的披露多于财务信息，重点提到 2,000+ 个全球客户 MSA、17K 名可部署的 AI 原生工程师，以及构成下一人才梯队的 150K+
              名学习者。这些是有用的运营指标，却不能替代收入、现金、利润率或当前员工数披露。就尽调而言，Andela 的规模足以具备战略意义，但投资人判断规模能否持续、以及最近一次私募市场定价是否仍新鲜，所需指标依然不透明。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
      - number: '1.4'
        title: 运营模式变化、里程碑与不利背景
        blocks:
          - type: paragraph
            body: >
              里程碑历史很重要，因为它解释了为什么现在应把 Andela 视为更广泛的平台公司，而不只是非洲开发者管道。第三方历史资料标记了 2020 年转向完全远程、无国界市场；官方资料随后显示其于 2023 年 3 月收购
              Qualified，并于 2023 年 10 月推出 Andela Talent Cloud。较新的第三方资料补充了 2025—2026 年面向 AI 的里程碑，包括技能提升合作和收购
              Woven。这一推进确实存在，但同一批指定证据也包含不利信号：裁员事件、关于该模式可能抽取非洲人才却缺乏本地再投资的批评，以及 Toptal 于 2024 年 5 月提起的诉讼。因此总体判断是混合的：Andela
              持续演进，但仍背负显著的执行、法律和叙事风险。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO015
