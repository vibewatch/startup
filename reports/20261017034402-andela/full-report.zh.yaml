  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 商业规模和 AI 重新定位创造了期权价值，但过时的估值标记和未披露的单位经济性，使建议仍停留在跟踪。
    data:
      nodes:
        - label: AI 时代定位
          detail: 官方页面将 Andela 定位为企业 AI 的人工算力或执行层。
        - label: 规模信号
          detail: 5.6M 开发者生态、17K 名认证 AI 原生工程师、200K+ 名受训人才，以及 650+ 家客户。
        - label: 战略扩张
          detail: 第三方来源将 Qualified、Casana 和 Woven 与更广泛的供给、地理覆盖和更深的 AI 评估能力联系起来。
        - label: 变现证明缺口
          detail: 公开证据仍缺少经审计的盈利能力、毛利率、现金消耗、现金和续约披露。
        - label: 价格发现缺口
          detail: 最新明确的公开基准仍是第三方反复引用的 2021 年 $1.5B E 轮标记。
        - label: 建议
          detail: 继续跟踪，估值纪律应绑定最新市场标记和董事会级经营证据。
      edges:
        - label: 支持相关性
        - label: 拓宽上行空间
        - label: 需要转化为经济效益
        - label: 阻碍清晰的投资判断
        - label: 因此跟踪
    claimRefs:
