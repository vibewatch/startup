  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - AI 原生定位转化为持久的企业增长，续约保持稳定，且最新尽调证明单位经济性有吸引力。
        - 只有出现新的外部价格标记和经审计的经营证明后，乐观情景才可能支持支付高于 2021 年已知基准的价格。
        - 市场平台规模与企业变现之间的执行落差，仍是主要失败模式。
        - 需要新的融资或二级交易证据，以及已披露的留存和利润率实力。
      - - 基准
        - Andela 仍具战略相关性并已形成商业规模，但公开证据仍缺少当前盈利能力和价格发现。
        - 在新数据证明 AI 转型已转化为经济效益前，估值最好看在已知基准附近或以下。
        - 过时的估值依据和不完整的收入质量数据，使上行逻辑仍未得到证明。
        - 符合当前材料：叙事和规模强劲，但投资判断输入不完整。
      - - 悲观
        - 竞争压力、较弱的留存或疲软的企业招聘，使 AI 重新定位无法带来持久的经济效益。
        - 估值因此可能低于上一个明确基准，当前规模信号也不足以保护下行空间。
        - 没有公开定价、没有最新标记、也没有经审计的现金流证据；若基本面令人失望，几乎没有防线。
        - 没有最新证明就试图加价，或出现集中度和续约疲软的证据，都会把案件推向这一情景。
    notes: 由于指定材料缺少最新按市值计价证据，情景表采用相对于已知基准的方向性估值逻辑。
    claimRefs:
