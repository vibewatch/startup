  - id: FE001
    title: 产品架构图
    type: stack
    summary: 官方材料描述了一套分层运营模式，将生态和评估数据转化为人员配置交付、托管式 AI 构建和劳动力技能提升。
    data:
      layers:
        - label: 客户需求与工作流接入
          detail: 企业岗位、项目和劳动力需求通过市场平台需求说明和招聘工作流进入。
          modules:
            - label: 岗位 / 项目接入
            - label: 人才档案可见性
            - label: ATS / VMS 连接器
          outputs:
            - label: Structured role requirements routed into the marketplace
        - label: 评估与匹配引擎
          detail: Talent Decision Engine 和 Qualified 评估在形成候选名单前评估岗位匹配度。
          modules:
            - label: 技能评估
            - label: 面试信号
            - label: 匹配算法
          outputs:
            - label: Ranked candidate or team matches
        - label: 企业工作流集成
          detail: 招聘系统连接器让客户将岗位和市场平台活动导入现有采购与人员配置工作流。
          modules:
            - label: Greenhouse
            - label: Beeline
            - label: Fieldglass
          outputs:
            - label: Connected enterprise hiring workflow
        - label: 交付与合规运营
          detail: 匹配完成后，Andela 支持入职、付款、外汇处理和合规管理。
          modules:
            - label: 获取—评估—匹配—交付工作流
            - label: Andela Pay
            - label: OFAC / KYC 检查
          outputs:
            - label: Active cross-border engagements inside client teams
        - label: 持续培训与反馈闭环
          detail: 当前定位将可部署人才与持续更新的 AI 课程和重复评估绑定起来，以适应工具和需求变化。
          modules:
            - label: 与生产实践绑定的 AI 课程
            - label: 季度人才群组
            - label: 劳动力技能提升项目
          outputs:
            - label: Refreshed supply of AI-ready talent
        - label: AI 构建与劳动力赋能
          detail: 同一平台也被宣传为支持 AI 系统交付和团队技能提升。
          modules:
            - label: 构建者 / 集成者 / 扩展者
            - label: RAG 和智能体 AI 课程
            - label: 培训即服务
          outputs:
            - label: Managed AI delivery plus internal workforce training
    approximationNotes: 该堆栈将供应商工作流描述和当前产品摘要合并为面向读者的单一视图；应将其理解为推断的运营架构，而不是经审计的供应商系统图。
