      - number: '4.3'
        title: 交付经济模型看似轻资产，但利润率透明度较弱
        blocks:
          - type: paragraph
            body: >-
              保留证据支持一种轻资产运营模式，但合规和服务交付义务真实存在。2023 年 Talent Cloud 发布稿称 Andela 在一个平台上帮助客户招募、筛选、雇用、管理并向全球技术人员付款，付款体系覆盖 100
              多个国家的货币兑换和合规，软件、评估和市场工具因此可以带来运营杠杆，而非依赖实体资本开支。但同一证据也显示服务交付成本中心不轻：合规、全球薪资通道、评估基础设施、培训，以及最近扩大的市场拓展团队。Grokipedia
              的低置信度二手资料还据称平均合作期超过 18
              个月；若得到验证，这将有助于判断回收期和收入持久性。公开资料仍缺少关键评估层：各收入线毛利率、人才利用率、分包商组合、营运资本时点，以及培训收入的利润率高于还是低于安置收入。
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI015
      - number: '4.4'
        title: 资本充足性是核心尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开资本证据没有跟上 Andela 在 AI 时代的重新定位。Tracxn 称公司八轮融资累计 $381 million，指定资料中的最新一轮是 2021 年 9 月的 $200 million E 轮，投后估值
              $1.5 billion。2026 年运营故事仍在推进——管理层目标是年底前拥有 15,000 名 AI 熟练开发者，2026 年 7
              月新闻稿称公司在此前六个月将市场拓展团队扩大一倍——但保留的公开资料都没有给出当前现金余额、烧钱速度、现金跑道、债务额度或下一轮融资触发条件。因此，前瞻判断比产品叙事更窄：Andela
              历史上资金充足、运营上雄心勃勃，但公开投资人仍无法判断 AI 转型是自筹资金、提升利润率，还是依赖下一次融资。
            claimRefs:
              - CI010
              - CI011
              - CI012
