      - number: '3.3'
        title: 切换成本来自工作流和合同设计，而非独家供给
        blocks:
          - type: paragraph
            body: >-
              保留证据没有显示 Andela 能独家接触某类独有劳动力。相反，多家竞争对手都提供经过筛选的全球或区域开发者，有些还给出更明确的价目表或更低承诺的切入口。因此 Andela
              切换成本更多是运营性的而非结构性的：客户一旦依赖 Andela 处理评估数据、承包商管理、合规和更广泛的 AI
              赋能，更换供应商就意味着同时重建数条相互关联的流程。不过，对招聘体系成熟的买方而言，同一体化设计也可能成为被替代的目标，而非护城河，因为这些团队可能更愿意把招募、评估、薪资和直接雇佣选择掌握在自己手中。换言之，当流程所有权比交钥匙速度更重要时，内部自建仍是可信的替代方案。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 持久性取决于企业 AI 广度；被替代风险仍然存在
        blocks:
          - type: paragraph
            body: >-
              当企业买方希望在一段关系中同时获得 AI 原生工程能力、托管交付和劳动力技能提升时，Andela 的护城河最强。这比普通开发者人力服务更能争取客户钱包份额，对围绕生产级 AI
              重组的大客户可能很重要。但同一转型也缩小了显而易见的适配范围。保留的 Toolradar
              资料指出其缺乏公开定价，小型买方还可能受最低合作规模限制；竞争指南则持续列出自由职业、区域服务和增员模式中的可信替代方案。实际结论是，Andela
              在复杂企业项目中有差异化，但当买方只需补充承包商、改善时区匹配，或以更便宜透明的方式完成同一任务时，仍容易被商品化。
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP015
              - CP016
