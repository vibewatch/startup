  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - [Andela, Toolradar says no public pricing; Tecla reports roughly $6000-$14000 per developer monthly with a 12-month minimum while Flexiple reports 30-day project termination under a continuing MSA, Hiring plus contractor admin and retained official AI delivery / upskilling stack, 'Realized discounts, official rates, and the reconciliation of reported contract terms are unknown', Sales-led packaging raises diligence burden but supports larger-scope enterprise relationships]
      - [Arc.dev, '$15-$110+ per hour freelance or 20% of annual salary for full-time placement per Flexiple-cited pricing', Vetted developer hiring for freelance and permanent roles, Effective date on cited pricing page not published, Easier for buyers who want transparent unit economics]
      - [CloudDevs, '$45-$75 per hour per Flexiple-cited homepage pricing', Timezone-aligned LATAM developers and vetting pipeline, Retained sources do not show enterprise AI-delivery breadth, Strong alternative for narrower regional staff augmentation]
      - [Lemon.io, No public hourly rate in retained source but no upfront fee and no minimum engagement per Flexiple summary, Flexible freelance developer marketplace, Realized pricing remains unknown, Lower-commitment packaging undercuts Andela on experimentation]
      - [South, No retained public rate card and no minimum hiring commitment per HireInSouth guide, Recruitment plus staffing support across technical and non-technical roles, Pricing undisclosed in retained sources, Better fit when long-term LATAM integration matters more than global platform breadth]
    notes: >-
