      - [Contract flexibility, Retained reviews cite contractor model and 12-month minimums, Marketplace and freelance models are retained as more flexible, Some staffing partners emphasize no minimum or shorter commitment, Andela looks less attractive for experimentation or bursty demand]
      - [Pricing transparency, Toolradar says pricing is not public, Some rivals publish hourly or placement pricing in retained sources, Often partial or sales-led but with clearer low-commitment entry, Opaque packaging increases buyer diligence burden]
