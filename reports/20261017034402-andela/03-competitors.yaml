  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: contract-model
      missingEvidence: Primary current Andela buyer contract terms reconciling Tecla's reported 12-month minimum with Flexiple's reported 30-day project termination right.
      whyItMatters: Contract duration and termination flexibility materially affect switching cost and the comparison with project-based rivals.
      diligencePath: Request the current buyer MSA and representative statements of work, then verify minimum term and termination clauses directly.
      relatedQuestionRefs:
        - QP004
        - QP005
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: A primary public Andela rate card or contract schedule showing list pricing, discounts, and minimum commitment by product lane.
      whyItMatters: Without primary pricing, the chapter can only assess packaging opacity and reported ranges, not true price competitiveness.
      diligencePath: Request current pricing sheets or anonymized customer contracts covering talent, managed delivery, and training products.
      relatedQuestionRefs:
        - QP004
    - type: private-evidence-only
      severity: material
      topic: competitive-win-loss
      missingEvidence: Public win-loss, renewal, or displacement data against Turing, Toptal, Arc, and regional staffing rivals.
      whyItMatters: The retained evidence shows category overlap but not whether buyers systematically choose Andela over the closest substitutes.
      diligencePath: Ask management for cohort-level pipeline conversion, renewal, and loss-reason data by competitor class.
      relatedQuestionRefs:
        - QP006
        - QP007
    - type: private-evidence-only
      severity: material
      topic: talent-exclusivity
      missingEvidence: Evidence on multi-homing, exclusivity, or supply-side churn for Andela technologists versus rival platforms.
      whyItMatters: Moat durability depends on whether Andela controls differentiated supply or only a better orchestration layer.
      diligencePath: Request internal data on active-talent exclusivity, cross-platform overlap, and supply retention by region and skill family.
      relatedQuestionRefs:
        - QP005
        - QP007
