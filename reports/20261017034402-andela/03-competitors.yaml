figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from the retained evidence puts Andela at the highest
      breadth of solution scope, but below freelance-first and regional
      alternatives on buyer flexibility because pricing is opaque and retained
      third-party descriptions of contract flexibility conflict.
    data:
      xAxis:
        label: Solution breadth
        min: 1
        max: 5
        low: narrow role fill
        high: hire/build/upskill stack
        scale: ordinal
        description: Evidence-backed ordinal placement from retained source descriptions
      yAxis:
        label: Engagement flexibility
        min: 1
        max: 5
        low: high commitment
        high: low commitment
        scale: ordinal
        description: Evidence-backed ordinal placement from retained pricing and contract evidence
      points:
        - label: Andela
          x: 5
          y: 2
          note: Official pages span hiring, AI delivery, and training; pricing is opaque, and retained third-party contract descriptions conflict.
        - label: Arc.dev
          x: 2
          y: 4
          note: Flexiple cites hourly freelance pricing and permanent-placement fees, supporting modular but narrower hiring scope.
        - label: Lemon.io
          x: 2
          y: 5
          note: Flexiple reports no minimum engagement and flexible part-time or full-time work, but a narrower developer-marketplace scope.
        - label: South
          x: 3
          y: 4
          note: HireInSouth describes LATAM recruitment across technical and business roles with no minimum hiring commitment.
        - label: CloudDevs
          x: 2
          y: 4
          note: Flexiple cites hourly LATAM developer pricing and a defined vetting process, but not Andela's AI delivery and training breadth.
        - label: Proxify
          x: 3
          y: 5
          note: Flexiple reports monthly and hourly-equivalent pricing, included compliance, and a two-week termination notice.
    approximationNotes: >-
      Axis placements are ordinal judgments anchored to retained source
      descriptions of scope, geography, and contract structure rather than
      measured market-share or conversion-rate data.
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP006
      - CP007
      - CP010
      - CP014
      - CP015
callouts:
  - calloutType: strength
    title: Breadth beyond staffing is the real differentiator
    body: >-
      The retained official pages widen Andela's comparison frame from
      recruiting into AI system delivery and workforce training, which gives it a
      materially broader enterprise story than pure marketplace rivals.
    claimRefs:
      - CP001
      - CP002
      - CP010
  - calloutType: risk
    title: Packaging leaves an opening for more transparent and flexible rivals
    body: >-
      Retained third-party sources consistently point to opaque pricing, long
      commitment periods, and startup-fit limits, so alternatives can win even
      when their capability scope is narrower.
    claimRefs:
      - CP006
      - CP008
      - CP009
      - CP015
  - calloutType: insight
    title: Moat is workflow integration, not exclusive access to talent
    body: >-
      The retained evidence shows overlap in the underlying talent categories
      across multiple rivals, implying that Andela's stickiness comes from
      combined workflow, compliance, and AI-service breadth more than from a
      uniquely captive labor pool.
    claimRefs:
      - CP012
      - CP013
