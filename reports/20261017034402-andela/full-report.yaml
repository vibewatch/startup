      - number: '1.2'
        title: Leadership transition and governance visibility
        blocks:
          - type: paragraph
            body: >
              Leadership is a meaningful live variable in the current report vintage. Public founder histories
              consistently frame Andela as a multi-founder company rather than a single-founder business, and
              third-party profiles say Carrol Chang took over as CEO in September 2024 after a long operating tenure at
              Uber. That matters because the current strategic narrative—AI-native engineers, technical assessment
              depth, and upskilling partnerships—is closely tied to her repositioning agenda. The same evidence set is
              much thinner on governance mechanics: it identifies some current executives and major financing backers,
              but it does not disclose current board composition, ownership percentages, or durable control rights. That
              leaves clear key-person and governance diligence asks even though the operating direction is easier to
              describe than the formal decision structure behind it.
            claimRefs:
