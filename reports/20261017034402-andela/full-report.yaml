      - number: '7.3'
        title: Pricing opacity and partner dependencies are the main kill-criteria triggers
        blocks:
          - type: paragraph
            body: >-
              The clearest investment kill criteria are commercial rather than narrative. Toolradar says Andela has no
              public pricing and that minimum engagement size may exclude small startups, while TechVendorIndex says
              senior AI pricing now overlaps with US onshore staffing rates. That combination narrows the room for
              labor-arbitrage upside and makes buyer ROI more dependent on quality, speed, and compliance than on
              headline rate savings. Flexiple's source-checked contract summary also points to 30-day project
              termination rights and immediate termination during the first 15 business days of a new-client trial,
              which makes early-fit failure costly if onboarding quality slips. Official pages highlight 2,000+ client
              MSAs and 98% client satisfaction, but the assigned pool still lacks public evidence on concentration,
              renewal, NRR, margin, or incident history. If private diligence cannot close those gaps, the risk case
              should dominate the valuation case.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR012
              - CR013
