      - number: '5.2'
        title: Operating model combines marketplace intake, assessment, matching, delivery, and compliance
        blocks:
          - type: paragraph
            body: >-
              The clearest documented workflow comes from Andela's own support and product-launch materials. The support
              article lays out a linear source-assess-match-deliver model in which technologists are recruited,
              evaluated, matched to projects, and then supported through delivery inside client teams. The 2023 Talent
              Cloud launch expands that process into a platform claim: enterprises can source, qualify, hire, manage,
              and pay talent in one system, supported by the Talent Decision Engine, developer assessments from
              Qualified, payout/compliance rails, and integrations into Greenhouse, Beeline, and Fieldglass. Read
              together, the evidence supports a layered operating architecture where software mainly coordinates supply
              discovery, skill verification, workflow routing, and cross-border administration around a people-delivery
              core. What the evidence does not show is a vendor-published systems diagram, API surface, or
              implementation benchmark that would let investors separate true platform leverage from service-heavy
              execution.
