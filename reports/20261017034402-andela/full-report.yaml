      - number: '7.2'
        title: Delivery quality depends on screening accuracy and contractor continuity
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently describe Andela as more than a listing marketplace: the company evaluates
              technologists, matches them to projects, provides hiring infrastructure, and continues supporting delivery
              after placement. That makes the quality bar operationally sensitive to screening accuracy,
              account-management execution, and contractor continuity at scale. Independent evidence adds pressure
              points. TechVendorIndex says the bench is contractor-based and not mostly directly employed, which limits
              long-term retention guarantees, while EIA News still frames competition, changing workforce expectations,
              macro uncertainty, and hiring fluctuations as live risks for the category. The current AI-native
              positioning may expand demand and relevance, but it also raises the burden of proving that training
              cohorts, assessment products, and forward-deployed AI work convert into repeatable enterprise outcomes
              rather than a marketing refresh.
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR010
              - CR011
              - CR013
