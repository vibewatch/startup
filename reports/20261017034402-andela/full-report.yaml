      - number: '3.3'
        title: Switching cost comes from workflow and contract design, not exclusive supply
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not show a uniquely exclusive labor category that only Andela can access.
              Instead, multiple competitors advertise vetted global or regional developers and, in some cases, more
              explicit rate cards or lower-commitment entry points. That means Andela's switching cost is more
              operational than structural: once a customer relies on Andela for assessment data, contractor
              administration, compliance, and broader AI enablement, changing vendors means rebuilding several linked
              processes at once. For buyers with mature recruiting operations, however, the same integrated design can
              be a substitute target rather than a moat, because those teams may prefer to keep sourcing, evaluation,
              payroll, and direct employment options under their own control. In other words, internal build remains a
              credible substitute where process ownership matters more than turnkey speed.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Durability depends on enterprise AI breadth; displacement risk remains real
        blocks:
          - type: paragraph
            body: >-
              Andela's moat looks strongest when an enterprise buyer wants a combination of AI-native engineering
              capacity, managed delivery, and workforce upskilling under one relationship. That is a wider wallet-share
              argument than generic developer staffing and could matter for large accounts already reorganizing around
              production AI. The downside is that this same repositioning narrows obvious fit. Toolradar's retained
              profile flags a lack of public pricing and minimum-engagement concerns for smaller buyers, while
              competitor guides keep surfacing credible substitutes across freelance, regional, and augmentation models.
              The practical read-through is that Andela is differentiated for complex enterprise programs, but still
              exposed to commoditization whenever the buyer only needs contractor fill, better timezone alignment, or a
              cheaper and more transparent path to the same job-to-be-done.
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth beyond staffing is the real differentiator
            body: >-
              The retained official pages widen Andela's comparison frame from recruiting into AI system delivery and
              workforce training, which gives it a materially broader enterprise story than pure marketplace rivals.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP010
          - type: callout
            title: Packaging leaves an opening for more transparent and flexible rivals
            body: >-
              Retained third-party sources consistently point to opaque pricing, long commitment periods, and
              startup-fit limits, so alternatives can win even when their capability scope is narrower.
            calloutType: risk
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP015
          - type: callout
            title: Moat is workflow integration, not exclusive access to talent
            body: >-
              The retained evidence shows overlap in the underlying talent categories across multiple rivals, implying
              that Andela's stickiness comes from combined workflow, compliance, and AI-service breadth more than from a
              uniquely captive labor pool.
            calloutType: insight
            claimRefs:
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model has widened beyond classic talent marketplace fees
        blocks:
          - type: paragraph
            body: >-
              Andela's current public surface presents a broader monetization stack than a single staffing spread. The
              homepage says the platform lets customers "Hire AI engineers," "Train models and build production AI
              systems," and "Upskill your engineering workforce for AI," while the TechTrends interview says management
              is repositioning the company from a hiring marketplace toward a training and reskilling partner for
              enterprise AI rollouts. That matters financially because it implies at least three revenue lines with
              different sales motions and margin profiles: placement or managed-team revenue tied to deployed engineers,
              project revenue tied to AI system development, and training revenue tied to workforce enablement. The
              public pool supports that Andela wants to monetize more of the enterprise AI workflow, but it does not
              disclose revenue mix, attach rates, or how much of growth now comes from training and managed delivery
              versus the legacy talent marketplace.
            claimRefs:
