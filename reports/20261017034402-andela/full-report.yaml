chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and operating footprint
        blocks:
          - type: paragraph
            body: >
              The assigned source set shows a company that now markets itself less as a traditional staffing
              intermediary and more as the human execution layer for enterprise AI adoption. Official pages describe
              Andela Talent Cloud as an integrated platform that helps enterprises source, qualify, hire, manage, and
              pay global technical talent, while the homepage adds AI delivery and workforce upskilling to that core
              marketplace story. Third-party profiles keep the older identity in view: Andela was founded in 2014 in
              Lagos, Nigeria, and public profiles now place headquarters in New York while still emphasizing African
              roots. For later chapters, the safe shorthand is that Andela is a late-stage private talent marketplace
              and AI-talent platform whose commercial story spans hiring, assessment, compliance, and AI-oriented
              workforce development rather than one narrow product SKU.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
