    Africa-centered developer training business into a broader enterprise offer spanning vetted technical talent, AI
    delivery, compliance, and upskilling. The current public record shows meaningful enterprise scale and a clear
    AI-native repositioning, but it remains opaque on the operating metrics investors would need to underwrite the
    business with confidence.
