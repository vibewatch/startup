      - number: '8.2'
        title: Thesis, anti-thesis, and current valuation context
        blocks:
          - type: paragraph
            body: >-
              The bull case is not hard to articulate: Andela appears to have widened its supply funnel, broadened its
              geography, and reframed itself around AI execution at exactly the moment enterprises need scarce
              implementation talent. Official and partner sources point to a large ecosystem, multi-country supply, and
              enterprise references that could justify continued strategic relevance. The anti-thesis is equally clear.
              The public record in this worker pool says much more about capability, positioning, and marketplace
              breadth than about revenue quality, margins, burn, concentration, or renewal durability. The same evidence
              also shows a competitive market full of adjacent alternatives and incomplete public pricing visibility,
              which makes it difficult to argue that the latest known valuation marker is still conservative rather than
              stretched.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
