  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Cross-border compliance is the highest-severity structural risk
        blocks:
          - type: paragraph
            body: >-
              The most consequential risk in the assigned evidence is structural rather than episodic: Andela publicly
              positions itself as a platform that can source, qualify, hire, manage, pay, and support technologists
              across more than 100 countries, which creates labor, tax, sanctions, privacy, IP, and local-contracting
              exposure across a wide jurisdictional footprint. The mitigations visible in public are
              meaningful—partner-wallet OFAC and KYC checks, basic background checks with client-specific add-ons, a
              single contracting interface, and contractual IP assignment—but they still rely on correct vendor
              execution and local rule interpretation. Empower Africa also highlights that African scaling spans
              different regulatory environments, talent pools, and infrastructure conditions, and Andela itself
              describes consistency of quality and service across that fragmentation as a core barrier. The pool does
              not surface primary enforcement, breach, or litigation files, but that is a diligence gap rather than
              proof of absence.
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR009
              - CR013
