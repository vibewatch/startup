  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Commercial scale and AI repositioning create option value, but stale valuation markers and undisclosed unit
      economics keep the call at track.
    data:
      nodes:
        - label: AI-era positioning
          detail: Official pages frame Andela as the human compute or execution layer for enterprise AI.
        - label: Scale signals
          detail: A 5.6M developer ecosystem, 17K certified AI-native engineers, 200K+ trained, and 650+ clients.
        - label: Strategic expansion
          detail: Third-party sources link Qualified, Casana, and Woven to wider supply, geography, and AI assessment depth.
        - label: Monetization proof gap
          detail: Public evidence still lacks audited profitability, gross margin, burn, cash, and renewal disclosure.
        - label: Price discovery gap
          detail: Latest explicit public benchmark remains the 2021 $1.5B Series E marker repeated by third parties.
        - label: Recommendation
          detail: Track, with valuation discipline tied to fresh market marks and board-grade operating evidence.
      edges:
        - label: supports relevance
        - label: broadens upside
        - label: needs translation into economics
        - label: blocks clean underwriting
        - label: therefore track
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
