  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans platforms, staffing, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained comparison set shows that buyers do not evaluate Andela only against other Africa-origin
              marketplaces. Competitor-issued and independent alternatives guides place it alongside global talent
              platforms such as Turing, Toptal, and Arc.dev, plus regional staffing and augmentation options such as
              South, Nearsure, Howdy, and BairesDev. That breadth matters because the buyer's real choice is often not
              "Andela or nothing" but which sourcing model best matches geography, team structure, and contract shape.
              Regional providers gain relevance when timezone overlap and closer team integration matter more than
              worldwide search breadth, while freelance and marketplace models matter when buyers want narrower role
              fill or shorter commitments. The effective landscape also includes status quo internal recruiting plus
              separate assessment, compliance, and payment tools, because Andela's own pitch is to collapse those
              workflows into one surface instead of asking customers to assemble them independently.
            claimRefs:
              - CP003
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP013
      - number: '3.2'
        title: Product breadth is wider than staffing, but packaging is less flexible
        blocks:
          - type: paragraph
            body: >-
              Andela's official positioning has expanded beyond classic staff augmentation. Its current pages pitch one
              platform to hire AI engineers, build AI systems, and upskill internal workforces, while the 2023 Talent
              Cloud launch framed the workflow as sourcing, qualifying, hiring, managing, and paying global technical
              talent inside one integrated product. That gives Andela a broader solution-breadth claim than single-lane
              recruiting networks. The trade-off is packaging. Retained third-party reviews describe contractor-based,
              12-month minimum engagements, private pricing, and in Tecla's write-up a reported conversion fee for
              taking talent in-house. Competing models such as Arc-style marketplace hiring, hourly networks, or
              no-minimum staffing alternatives can therefore look more flexible for buyers that need experimentation,
              smaller spend, or project-bound commitments rather than a long-duration managed relationship. The retained
              sources disagree on how rigid that duration is: Tecla reports a 12-month minimum, while Flexiple describes
              project termination on 30 days' notice under a continuing MSA. Primary contract terms are therefore a
              diligence gap rather than a settled competitive disadvantage.
            claimRefs:
