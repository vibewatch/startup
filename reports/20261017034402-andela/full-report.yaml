  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from the retained evidence puts Andela at the highest breadth of solution scope, but below
      freelance-first and regional alternatives on buyer flexibility because pricing is opaque and retained third-party
      descriptions of contract flexibility conflict.
    data:
      xAxis:
        label: Solution breadth
        min: 1
        max: 5
        low: narrow role fill
        high: hire/build/upskill stack
        scale: ordinal
        description: Evidence-backed ordinal placement from retained source descriptions
      yAxis:
        label: Engagement flexibility
        min: 1
        max: 5
        low: high commitment
        high: low commitment
        scale: ordinal
        description: Evidence-backed ordinal placement from retained pricing and contract evidence
      points:
        - label: Andela
          x: 5
          'y': 2
          note: >-
            Official pages span hiring, AI delivery, and training; pricing is opaque, and retained third-party contract
            descriptions conflict.
        - label: Arc.dev
          x: 2
          'y': 4
          note: >-
            Flexiple cites hourly freelance pricing and permanent-placement fees, supporting modular but narrower hiring
            scope.
        - label: Lemon.io
          x: 2
          'y': 5
          note: >-
            Flexiple reports no minimum engagement and flexible part-time or full-time work, but a narrower
            developer-marketplace scope.
        - label: South
          x: 3
          'y': 4
          note: >-
            HireInSouth describes LATAM recruitment across technical and business roles with no minimum hiring
            commitment.
        - label: CloudDevs
          x: 2
          'y': 4
          note: >-
            Flexiple cites hourly LATAM developer pricing and a defined vetting process, but not Andela's AI delivery
            and training breadth.
        - label: Proxify
          x: 3
          'y': 5
          note: >-
            Flexiple reports monthly and hourly-equivalent pricing, included compliance, and a two-week termination
            notice.
    approximationNotes: >-
      Axis placements are ordinal judgments anchored to retained source descriptions of scope, geography, and contract
      structure rather than measured market-share or conversion-rate data.
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP006
      - CP007
      - CP010
      - CP014
      - CP015
