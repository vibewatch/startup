      - number: '6.2'
        title: Named customer proof and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Public customer proof exists, but it is uneven in depth. The strongest named reference in this pool is
              Mindshare, where a quoted executive describes elastic usage and fast value capture in a company-issued
              product launch release. Andela also presents reference signals from Goldman Sachs and International
              Service Group on its homepage, and the same release says brands including GitHub, Mastercard Foundry,
              ViacomCBS, and Mindshare trust the platform. These references are useful for showing buyer quality and
              cross-vertical appeal, but most are still logo, testimonial, or press-release evidence rather than audited
              deployment metrics, contract values, or disclosed expansion cohorts. The result is credible adoption proof
              for enterprise access, but only partial proof for production depth and breadth within each named account.
            claimRefs:
              - CU006
              - CU007
              - CU008
