              - CV015
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              A precise valuation range is not supportable from the assigned public evidence because the pool does not
              contain current audited financials, a recent financing document, or a disclosed private-market mark newer
              than the 2021 Series E reference. The scenarios therefore focus on what would have to be true for a
              premium, hold-near, or reset-below that historical benchmark. The key variable is not whether Andela has a
              credible market, because the talent and AI demand narratives are visible, but whether the company can
              convert its stated ecosystem scale and AI positioning into durable enterprise economics. Until that bridge
              is proven, scenario dispersion remains wide and downside protection matters more than upside storytelling.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
          - type: table
