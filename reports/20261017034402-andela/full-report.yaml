      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The chapter's main diligence gap is durability. Company materials highlight 97% client ROI, 98%
              satisfaction, and strong matching speed, while third-party comparison pages describe MSA- based
              engagements, 30-day notice, and low-confidence average engagement duration above 18 months. That is
              directionally positive because it implies Andela is not purely transactional and may benefit from repeat
              enterprise procurement relationships. Still, none of the retained sources disclose NRR, GRR, logo churn,
              renewal rates, cohort behavior, or top-customer revenue concentration. Competitive comparison pages also
              flag narrower functional scope than broader staffing platforms and premium pricing versus some
              alternatives, which means expansion can still be bounded by software-centric use cases and procurement
              budget scrutiny. Until Andela discloses renewal or concentration metrics, durability remains inferred
              rather than verified.
            claimRefs:
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise proof is real, even if uneven
            body: >-
              Named references such as Mindshare, Goldman Sachs, International Service Group, GitHub, and Mastercard
              Foundry show that Andela is selling into recognizable enterprises rather than only long-tail buyers, which
              matters for account quality and brand trust.
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Durability is still mostly inferred
            body: >-
              Public evidence supports customer access and some deployment quality signals, but not the retention math
              that matters most for underwriting expansion and concentration risk.
            calloutType: risk
            claimRefs:
              - CU010
