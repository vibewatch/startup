  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint and who appears to buy
        blocks:
          - type: paragraph
            body: >-
              The retained source set points to an enterprise-oriented buyer base rather than a self-serve freelancer
              marketplace. Andela's current about page says more than 650 organizations have built with the platform and
              that it has 2,000+ global MSAs, while the talent-facing page says technologists can access 650+
              enterprises, unicorns, and scale-ups. That framing, combined with the homepage's "hire, build AI, and
              upskill teams" positioning, suggests the paying customer is typically an enterprise technology, product,
              HR, or transformation leader, with end users spanning hiring managers, delivery teams, and internal
              workforces being reskilled for AI adoption. Independent coverage broadly supports the scale narrative:
              trade press repeats a 150,000+ technologist network across 135 countries, and background profiles describe
              Andela as a global technology talent marketplace for distributed engineering teams.
