              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step should focus on evidence that can actually move price, not on more narrative
              confirmation that the company participates in the AI talent trend. The most important asks are a fresh
              financing or secondary marker after 2021, audited or board-grade revenue and gross margin data, customer
              concentration and renewal evidence, and a bridge showing how many of the reported clients or MSAs are
              translating into durable multi-year economics. Thesis-break triggers are straightforward: a markup above
              the last known $1.5 billion benchmark without fresh economics, evidence that AI-native positioning is not
              converting into retention or margin expansion, or signs that competitive pricing pressure is eroding the
              marketplace model faster than Andela can move up-market.
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence call
            body: >-
              Andela merits continued coverage, but not a buy recommendation, because the evidence of platform scale is
              meaningfully stronger than the evidence that today's price would be attractive.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV013
          - type: callout
            title: Main underwriting blocker
            body: >-
              The assigned pool does not surface a post-2021 market-clearing valuation marker or the profitability data
              needed to defend one.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
