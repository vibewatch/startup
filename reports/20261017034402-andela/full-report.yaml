      - number: '4.2'
        title: Pricing remains opaque, so public efficiency metrics are still marketing proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest commercial signals in the assigned evidence are outcome claims rather than public price
              cards. Andela's commissioned Forrester study says a composite customer saw a 97% three-year ROI and 66%
              faster hiring, and the earlier Talent Cloud launch release claims the hiring process can take as little as
              48 hours and be 30% to 50% more cost efficient. Those metrics are directionally useful for GTM
              positioning, but they are not substitutes for realized pricing, customer acquisition cost, payback period,
              discounting, or net revenue retention. The adverse evidence in the pool is also important: Flexiple's
              competitor comparison leaves Andela's pricing row unsourced and instead surfaces contract mechanics such
              as 30-day termination, monthly talent payments, and contractor responsibility for taxes and benefits. The
              result is that Andela's public economics look commercially credible, but still too list-price-light and
              sample-dependent to underwrite with confidence.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI015
      - number: '4.3'
        title: Delivery economics look asset-light, but margin visibility is weak
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports an asset-light operating model with real compliance and service delivery
              obligations. The 2023 Talent Cloud release says Andela helps customers source, qualify, hire, manage, and
              pay global technologists in one platform and that its payout stack handles currency exchange and
              compliance in more than 100 countries, which implies operating leverage from software, assessment, and
              marketplace tooling rather than physical capex. However, the same evidence also shows meaningful
              service-delivery cost centers: compliance, global payroll rails, assessment infrastructure, training, and
              a recently expanded go-to- market team. Grokipedia's lower-confidence secondary profile adds that average
              engagements are reportedly over 18 months, which would be helpful for payback and revenue durability if
              verified. What is still missing publicly is the key underwriting layer: gross margin by revenue stream,
              talent utilization, subcontractor mix, working-capital timing, and whether training revenue is higher- or
              lower-margin than placement revenue.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI015
      - number: '4.4'
        title: Capital adequacy is the core diligence blocker
        blocks:
          - type: paragraph
            body: >-
              Public capital evidence has not kept pace with Andela's AI-era repositioning. Tracxn says the company has
              raised $381 million across eight rounds and that the latest round in the assigned pool is the September
              2021 $200 million Series E at a $1.5 billion post-money valuation. The 2026 operating story is active —
              management is targeting 15,000 AI-fluent developers by year end and the July 2026 newsroom release says
              the company doubled its go-to-market team in the prior six months — but none of the retained public
              sources provide current cash on hand, burn, runway, debt facilities, or a next-round trigger. That means
              the forward judgment is narrower than the product narrative: Andela appears well-funded historically and
              ambitious operationally, but public investors still cannot tell whether the AI transition is self-funded,
              margin accretive, or dependent on another financing event.
            claimRefs:
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope has shifted from staffing marketplace to AI-workforce platform
        blocks:
          - type: paragraph
            body: >-
              The strongest consistent signal in the 2026 materials is not just that Andela places engineers, but that
              it now packages workforce supply, AI project delivery, and training as a single enterprise transformation
              product. The homepage and "Why Andela" pages both frame the offer as one platform that can deploy
              AI-native engineers, support production AI builds, and upskill internal teams, while independent reviews
              still categorize the business as a vetted global talent platform rather than a software product with
              standalone technical tooling. That matters for diligence: the product appears to be a managed operating
              model layered on software, assessment, and compliance infrastructure, not a pure self-serve SaaS product.
              The official AI repositioning is therefore credible as messaging and packaging, but the chapter's evidence
              suggests the monetizable core is still human-enabled execution quality rather than proprietary
              infrastructure alone.
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE010
              - CE011
          - type: table
