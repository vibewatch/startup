          - type: callout
            title: What would upgrade the view
            body: >-
              A stronger recommendation would require fresh evidence that Andela's AI positioning is translating into
              durable revenue quality, not just broader marketplace scale.
            calloutType: assumption
            claimRefs:
              - CV001
