              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              Cross-border compliance is the top underwriting risk because Andela's public value proposition explicitly
              includes managed hiring, payout, and compliance across a very broad jurisdiction set, while the visible
              control evidence remains high-level and partly vendor-mediated.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR009
          - type: callout
            title: Why the risk is not automatically fatal
            body: >-
              The company is not hand-waving the problem away: public materials describe structured vetting, compliance
              checks, client-specific screening, and ongoing support, which suggests a real control architecture even if
              it still needs diligence-level proof.
            calloutType: insight
            claimRefs:
              - CR001
              - CR009
              - CR011
          - type: callout
            title: Investment kill criteria
            body: >-
              The thesis should weaken materially if diligence cannot prove stable retention and renewal, acceptable
              margin after the AI pivot, or a clean record on incidents and labor-compliance exceptions in Andela's
              largest delivery markets.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest supportable call from the assigned evidence is track rather than buy. Andela has real scale
              signals: official pages position the company as a human execution layer for enterprise AI, list 17K
              certified AI-native engineers and 200K+ trained technologists, and show 650+ clients. Those facts matter
              because they suggest Andela has already converted its original marketplace thesis into a broader AI
              workforce platform with meaningful commercial reach. The problem is price support. The company-controlled
              history still points back to the June 2021 unicorn round, third-party pool sources repeat that $1.5
              billion marker, and the comparator evidence still cannot surface transparent public pricing. Without a
              fresher valuation marker, audited unit economics, or durable retention data, public evidence does not
              justify paying up from the last known benchmark.
            claimRefs:
              - CV001
              - CV002
