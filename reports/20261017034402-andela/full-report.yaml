      - number: '1.3'
        title: Funding history, scale markers, and disclosure limits
        blocks:
          - type: paragraph
            body: >
              The best public financing marker in this worker pool is still historical rather than fresh: third- party
              histories point to a $200 million Series E in September 2021 and roughly $381 million of cumulative
              capital raised, with the last widely cited valuation at about $1.5 billion. Official current pages are
              more helpful on commercial scale than on finance, highlighting 2,000+ global client MSAs, 17K deployable
              AI-native engineers, and 150K+ learners forming the next talent cohort. Those are useful operating
              indicators, but they are not substitutes for revenue, cash, margin, or current headcount disclosure. For
              diligence purposes, this means Andela looks large enough to matter strategically, yet still opaque on the
              metrics investors would need to judge the durability of that scale or the freshness of the last
              private-market price.
            claimRefs:
              - CO007
