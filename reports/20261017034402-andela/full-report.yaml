      - number: '1.4'
        title: Operating-model shifts, milestones, and adverse context
        blocks:
          - type: paragraph
            body: >
              The milestone history matters because it explains why Andela should now be analyzed as a broader platform
              company rather than only as an African developer pipeline. Third-party histories mark a 2020 shift to a
              fully remote, borderless marketplace; official sources then show a March 2023 Qualified acquisition and
              the October 2023 launch of Andela Talent Cloud. More recent third-party profiles add 2025-2026 AI-oriented
              milestones, including upskilling partnerships and the Woven acquisition. That forward motion is real, but
              the same assigned evidence set also contains adverse signals: layoff episodes, criticism that the model
              can extract African talent without enough local reinvestment, and a May 2024 lawsuit filed by Toptal. The
              overview judgment is therefore mixed: Andela keeps evolving, but it does so with meaningful execution,
              legal, and narrative risk still attached.
