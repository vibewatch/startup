      - number: '5.3'
        title: Differentiation is plausible, but public proof is richer on breadth than on control depth
        blocks:
          - type: paragraph
            body: >-
              The differentiated story is straightforward: Andela argues that it has more structured assessment data,
              more AI-oriented training, and more managed execution capability than a generic freelance marketplace.
              Independent descriptions broadly support that framing, especially around vetted talent, managed teams, and
              AI-oriented specializations, so the category position looks real. The harder diligence question is whether
              the product has defensible technical controls and repeatable performance. Public materials cite match
              success, hiring speed, customer satisfaction, and cost outcomes, but they do not expose the methodology
              behind those metrics or provide public reliability, security, or integration-depth evidence. For a product
              increasingly aimed at production AI programs and regulated enterprises, that leaves investors with a
              platform that is easy to understand commercially but still under-instrumented from a technical-risk
              perspective.
