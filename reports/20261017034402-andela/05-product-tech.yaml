company:
  name: Andela
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Andela's current product surface is broader than a traditional remote-talent marketplace:
    official pages now present one platform to deploy AI-native engineers, build AI systems,
    and upskill enterprise teams. The mechanics most clearly evidenced in the pool are the
    source-assess-match-deliver workflow, the Talent Decision Engine plus assessment layer,
    and source-to-pay operations, while public diligence remains thin on audited security,
    reliability, and methodology proof.
sections:
  - id: product-scope
    title: Product scope has shifted from staffing marketplace to AI-workforce platform
    body: >-
      The strongest consistent signal in the 2026 materials is not just that Andela places
      engineers, but that it now packages workforce supply, AI project delivery, and training
      as a single enterprise transformation product. The homepage and "Why Andela" pages
      both frame the offer as one platform that can deploy AI-native engineers, support
      production AI builds, and upskill internal teams, while independent reviews still
      categorize the business as a vetted global talent platform rather than a software
      product with standalone technical tooling. That matters for diligence: the product
      appears to be a managed operating model layered on software, assessment, and compliance
      infrastructure, not a pure self-serve SaaS product. The official AI repositioning is
      therefore credible as messaging and packaging, but the chapter's evidence suggests the
      monetizable core is still human-enabled execution quality rather than proprietary
      infrastructure alone.
    claimRefs: [CE001, CE002, CE008, CE010, CE011]
    tableRefs: [TE001]
  - id: operating-model
    title: Operating model combines marketplace intake, assessment, matching, delivery, and compliance
    body: >-
      The clearest documented workflow comes from Andela's own support and product-launch
      materials. The support article lays out a linear source-assess-match-deliver model in
      which technologists are recruited, evaluated, matched to projects, and then supported
      through delivery inside client teams. The 2023 Talent Cloud launch expands that process
      into a platform claim: enterprises can source, qualify, hire, manage, and pay talent
      in one system, supported by the Talent Decision Engine, developer assessments from
      Qualified, payout/compliance rails, and integrations into Greenhouse, Beeline, and
      Fieldglass. Read together, the evidence supports a layered operating architecture where
      software mainly coordinates supply discovery, skill verification, workflow routing, and
      cross-border administration around a people-delivery core. What the evidence does not
      show is a vendor-published systems diagram, API surface, or implementation benchmark
      that would let investors separate true platform leverage from service-heavy execution.
    claimRefs: [CE003, CE004, CE005, CE006, CE009, CE012]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: differentiation-and-risks
    title: Differentiation is plausible, but public proof is richer on breadth than on control depth
    body: >-
      The differentiated story is straightforward: Andela argues that it has more structured
      assessment data, more AI-oriented training, and more managed execution capability than
      a generic freelance marketplace. Independent descriptions broadly support that framing,
      especially around vetted talent, managed teams, and AI-oriented specializations, so the
      category position looks real. The harder diligence question is whether the product has
      defensible technical controls and repeatable performance. Public materials cite match
      success, hiring speed, customer satisfaction, and cost outcomes, but they do not expose
      the methodology behind those metrics or provide public reliability, security, or
      integration-depth evidence. For a product increasingly aimed at production AI programs
      and regulated enterprises, that leaves investors with a platform that is easy to
      understand commercially but still under-instrumented from a technical-risk perspective.
    claimRefs: [CE007, CE010, CE011, CE013]
    tableRefs: [TE003]
