      - ["Validate technical talent fit before deployment", "Resume-led screening does not prove role-specific delivery ability.", "Talent Decision Engine plus Qualified assessments and interviews.", "Official launch materials cite thousands of data points and 500+ coding challenges.", "No public precision/recall benchmark or published pass/fail thresholds."]
      - ["Run compliant cross-border engagements", "FX, payout, and worker-compliance steps add friction to global staffing.", "Andela Pay plus OFAC/KYC checks and source-to-pay workflow.", "PR materials describe payout and compliance coverage in 100+ countries.", "No public audit report, trust-center evidence, or control testing detail in the pool."]
      - ["Upskill internal teams for AI", "Enterprise teams often lack production AI and LLMOps depth.", "Training as a Service covering RAG, agentic systems, LLMOps, and AI leadership.", "Current official pages present workforce training as a co-equal product pillar.", "No public cohort completion, certification, or post-training productivity data."]
    notes: "Benefit language is reader-normalized from company-controlled product claims; where independent validation is missing, the limitation column preserves that caveat explicitly."
    claimRefs: [CE002, CE004, CE005, CE006, CE009, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Developer ecosystem and sourcing pipeline", "Generates candidate supply and behavioral data for later assessment.", "Sustained top-of-funnel quality, partner ecosystems, and candidate participation.", "Scale claims are company-asserted; the independent pool does not verify mix, freshness, or channel concentration."]
      - ["Predictive assessment layer", "Scores skills and fit before shortlist creation.", "Assessment content quality, proctoring, interview rigor, and feedback loops.", "Matching can become a black box without public methodology or external accuracy validation."]
      - ["Talent Cloud workflow and integrations", "Coordinates intake, shortlist routing, and enterprise workflow handoff.", "Greenhouse, Beeline, Fieldglass, and client process adoption.", "Public evidence names integrations but not implementation depth, API surface, or active-usage metrics."]
      - ["Delivery and support model", "Embeds talent into client teams and supports execution after matching.", "Client onboarding quality and Andela support capacity.", "Outcome quality likely depends on client-side management as much as platform matching."]
      - ["Pay and compliance rails", "Handles payouts, FX, and worker-compliance checks across jurisdictions.", "Payment partners plus country-specific regulatory operations.", "Pool evidence names OFAC/KYC checks but not audited controls, incident history, or privacy architecture."]
    notes: "This is an inferred operating stack assembled from official workflow descriptions and third-party product summaries; it is not a vendor-published systems diagram."
    claimRefs: [CE003, CE005, CE006, CE009, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Official materials describe a layered operating model that turns ecosystem and assessment
      data into staffed delivery, managed AI builds, and workforce upskilling.
    data:
      layers:
        - label: Client demand and workflow intake
          detail: Enterprise role, project, and workforce needs enter through marketplace briefs and hiring workflows.
          modules:
            - label: Job / project intake
            - label: Talent profile visibility
            - label: ATS / VMS connectors
          outputs:
            - label: Structured role requirements routed into the marketplace
        - label: Assessment and matching engine
          detail: The Talent Decision Engine and Qualified assessments evaluate role fit before shortlist formation.
          modules:
            - label: Skills assessments
            - label: Interview signals
            - label: Matching algorithms
          outputs:
            - label: Ranked candidate or team matches
        - label: Enterprise workflow integrations
          detail: Hiring-system connectors let clients route roles and marketplace activity into existing procurement and staffing workflows.
          modules:
            - label: Greenhouse
            - label: Beeline
            - label: Fieldglass
          outputs:
            - label: Connected enterprise hiring workflow
        - label: Delivery and compliance operations
          detail: Once matched, Andela supports onboarding, payouts, FX handling, and compliance administration.
          modules:
            - label: Source-assess-match-deliver workflow
            - label: Andela Pay
            - label: OFAC / KYC checks
          outputs:
            - label: Active cross-border engagements inside client teams
        - label: Continuous training and feedback loop
          detail: Current positioning ties deployable talent to ongoing AI curricula and repeated assessment as tools and demand evolve.
          modules:
            - label: Production-tied AI curricula
            - label: Quarterly talent cohorts
            - label: Workforce upskilling programs
          outputs:
            - label: Refreshed supply of AI-ready talent
        - label: AI build and workforce enablement
          detail: The same platform is marketed as supporting AI-system delivery and team upskilling.
          modules:
            - label: Builders / Integrators / Scalers
            - label: RAG and agentic AI curricula
            - label: Training as a Service
          outputs:
            - label: Managed AI delivery plus internal workforce training
    approximationNotes: >-
      This stack consolidates vendor workflow descriptions and current product summaries into
      a single reader-facing view; it should be read as an inferred operating architecture,
      not as an audited vendor systems diagram.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE009, CE011]
callouts:
  - calloutType: strength
    title: The product is broader than a classic talent marketplace
    body: >-
      The current surface area combines talent supply, assessment, managed delivery, source-to-pay
      operations, and AI workforce training, which is a meaningfully broader package than a
      simple remote-developer marketplace.
    claimRefs: [CE001, CE002, CE004, CE009]
  - calloutType: risk
    title: Public proof depth lags the breadth of the pitch
    body: >-
      The pool supports Andela's breadth claims, but it does not provide audited security,
      reliability, or methodology evidence strong enough to underwrite technical-control depth
      for production AI programs.
    claimRefs: [CE013]
