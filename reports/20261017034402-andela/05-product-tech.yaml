  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Public trust-center materials, security architecture, incident disclosures, uptime or SLA metrics, and any audited control evidence such as SOC 2 or ISO documentation.
      whyItMatters: Enterprise AI delivery and global workforce data handling create privacy, availability, and control-risk questions that marketing copy alone cannot resolve.
      diligencePath: Request security architecture, trust-center exports, latest audits, uptime commitments, and incident postmortems from Andela.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Independent developer or practitioner signal such as public repos, package usage, docs traffic, API activity, or community evidence showing recurring technical pull.
      whyItMatters: The product is sold as an AI-capability platform, but the retained sources do not show whether it generates developer adoption signals beyond enterprise sales-led deployments.
      diligencePath: Request developer portal analytics, public integration usage, or practitioner references, and supplement with GitHub, registry, or community telemetry if a public surface exists.
      relatedQuestionRefs: [QE009]
    - type: private-evidence-only
      severity: material
