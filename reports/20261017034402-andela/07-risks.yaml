      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - [Match-quality deterioration as scale rises, Medium, High, Medium, High, No public placement-level quality or replacement-rate disclosure]
      - [Contractor churn or continuity loss on placed talent, High, High, Medium, High, Bench is contractor-led and retention economics are undisclosed]
      - [AI pivot fails to produce durable enterprise outcomes, Medium, High, Medium, Medium-High, No public margin attachment or renewal data by AI offering]
