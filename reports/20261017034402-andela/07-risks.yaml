schemaVersion: report-v2
artifact: risks
slug: andela
runDate: 2026-10-17
company:
  name: Andela
chapter:
  number: 7
  title: Risks
  summary: >-
    Andela's risk profile is driven less by one verified public incident than by the
    cumulative fragility of a contractor-led, cross-border operating model that promises
    managed compliance, fast matching, and AI-native delivery without publishing the
    renewal, margin, incident, or concentration data needed to prove resilience.
    Public mitigations are real, but most remain company-described or partner-mediated,
    so investment comfort depends on diligence proving control effectiveness and economic durability.
sections:
  - id: cross-border-compliance
    title: Cross-border compliance is the highest-severity structural risk
    body: >-
      The most consequential risk in the assigned evidence is structural rather than episodic:
      Andela publicly positions itself as a platform that can source, qualify, hire, manage,
      pay, and support technologists across more than 100 countries, which creates labor,
      tax, sanctions, privacy, IP, and local-contracting exposure across a wide jurisdictional
      footprint. The mitigations visible in public are meaningful—partner-wallet OFAC and KYC
      checks, basic background checks with client-specific add-ons, a single contracting
      interface, and contractual IP assignment—but they still rely on correct vendor execution
      and local rule interpretation. Empower Africa also highlights that African scaling spans
      different regulatory environments, talent pools, and infrastructure conditions, and
      Andela itself describes consistency of quality and service across that fragmentation as
      a core barrier. The pool does not surface primary enforcement, breach, or litigation files,
      but that is a diligence gap rather than proof of absence.
    claimRefs: [CR002, CR004, CR007, CR009, CR013]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: delivery-and-model-fragility
    title: Delivery quality depends on screening accuracy and contractor continuity
    body: >-
      Public materials consistently describe Andela as more than a listing marketplace:
      the company evaluates technologists, matches them to projects, provides hiring
      infrastructure, and continues supporting delivery after placement. That makes the
      quality bar operationally sensitive to screening accuracy, account-management execution,
      and contractor continuity at scale. Independent evidence adds pressure points. TechVendorIndex
      says the bench is contractor-based and not mostly directly employed, which limits
      long-term retention guarantees, while EIA News still frames competition, changing workforce
      expectations, macro uncertainty, and hiring fluctuations as live risks for the category.
      The current AI-native positioning may expand demand and relevance, but it also raises the
      burden of proving that training cohorts, assessment products, and forward-deployed AI work
      convert into repeatable enterprise outcomes rather than a marketing refresh.
    claimRefs: [CR001, CR003, CR008, CR010, CR011, CR013]
    tableRefs: [TR002]
  - id: commercial-and-dependency-triggers
    title: Pricing opacity and partner dependencies are the main kill-criteria triggers
    body: >-
      The clearest investment kill criteria are commercial rather than narrative. Toolradar
      says Andela has no public pricing and that minimum engagement size may exclude small
      startups, while TechVendorIndex says senior AI pricing now overlaps with US onshore
      staffing rates. That combination narrows the room for labor-arbitrage upside and makes
      buyer ROI more dependent on quality, speed, and compliance than on headline rate savings.
      Flexiple's source-checked contract summary also points to 30-day project termination
      rights and immediate termination during the first 15 business days of a new-client trial,
      which makes early-fit failure costly if onboarding quality slips. Official pages highlight
      2,000+ client MSAs and 98% client satisfaction, but the assigned pool still lacks public
      evidence on concentration, renewal, NRR, margin, or incident history. If private diligence
      cannot close those gaps, the risk case should dominate the valuation case.
    claimRefs: [CR004, CR005, CR006, CR009, CR012, CR013]
    tableRefs: [TR003]
