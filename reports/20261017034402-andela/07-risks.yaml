    notes: >-
      Residual exposure remains provisional because public sources describe the workflow but do not
      disclose replacement rates, incident history, or service credits.
    claimRefs: [CR001, CR003, CR008, CR010, CR011, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Payout and compliance partner stack, Wallet and compliance vendors, FX payout KYC OFAC and local compliance execution, High, Vendor failure or control miss disrupts payments or creates sanctions exposure, High, Andela discloses partner-mediated checks and centralized workflow, High]
      - [Enterprise sales process and opaque pricing, Prospective clients and procurement teams, Revenue conversion and commercial discipline, High, Buyers balk at pricing or compare Andela to onshore alternatives, High, Speed quality and compliance value proposition, Medium-High]
      - [Large-scale delivery supplements, Systems integrators and client internal teams, Managed-delivery completion beyond core placement model, Medium, Andela wins the placement but not the scaled delivery wallet share, Medium, Strong fit in pods and distributed teams rather than very large managed programs, Medium]
    notes: >-
      This register focuses on dependency-bearing counterparties and buyer behaviors surfaced in the
      assigned pool, not on every possible supplier relationship.
    claimRefs: [CR002, CR004, CR005, CR006, CR009, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Severity remains highest where cross-border compliance promises intersect with opaque economics and vendor-mediated controls.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual exposure
      rows:
        - label: Cross-border compliance stack
          note: 100+ country promise with partner-mediated controls.
          values: [High, High, High]
        - label: Contractor bench continuity
          note: Retention guarantees are structurally limited in the public evidence.
          values: [High, High, High]
        - label: AI pivot execution
          note: Positioning is strong but public proof of durable economics is thin.
          values: [Medium, High, Medium-High]
        - label: Pricing and procurement friction
          note: No public pricing and onshore-overlap risk compress buyer ROI.
          values: [High, Medium-High, Medium-High]
        - label: Customer durability opacity
          note: Public sources do not show concentration, renewal, or NRR.
          values: [Medium, High, High]
        - label: Compliance partner dependence
          note: Payout, KYC, and sanctions checks rely partly on partner infrastructure.
          values: [Medium, High, High]
    claimRefs: [CR002, CR003, CR005, CR006, CR007, CR009, CR011, CR013]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: >-
      Cross-border compliance is the top underwriting risk because Andela's public value proposition
      explicitly includes managed hiring, payout, and compliance across a very broad jurisdiction set,
      while the visible control evidence remains high-level and partly vendor-mediated.
    claimRefs: [CR002, CR007, CR009]
  - calloutType: insight
    title: Why the risk is not automatically fatal
    body: >-
      The company is not hand-waving the problem away: public materials describe structured vetting,
      compliance checks, client-specific screening, and ongoing support, which suggests a real control
      architecture even if it still needs diligence-level proof.
    claimRefs: [CR001, CR009, CR011]
  - calloutType: recommendation
    title: Investment kill criteria
    body: >-
      The thesis should weaken materially if diligence cannot prove stable retention and renewal,
      acceptable margin after the AI pivot, or a clean record on incidents and labor-compliance
      exceptions in Andela's largest delivery markets.
    claimRefs: [CR005, CR012, CR013]
