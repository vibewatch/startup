  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-proof-gap
      missingEvidence: Customer concentration, renewal, GRR/NRR, and top-account churn data for the past eight quarters.
      whyItMatters: 2,000+ MSAs and a 98% satisfaction KPI do not prove durable revenue quality without concentration and renewal evidence.
      diligencePath: Request account-level cohort retention, top-10 revenue share, logo churn, and renewal waterfall data from management.
      relatedQuestionRefs: [QR008]
    - type: missing-source
      severity: material
      topic: security-and-incidents
      missingEvidence: Independent incident history, status-page uptime, SOC 2 or ISO reports, and breach-disclosure evidence for the hiring and payout stack.
      whyItMatters: Andela's promise to manage matching, onboarding, and global payouts creates operational and liability exposure if controls fail.
      diligencePath: Obtain the security packet, customer incident log, certifications, and any material exception register before underwriting platform reliability.
      relatedQuestionRefs: [QR006, QR008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Current gross margin, take rate, contractor utilization, and AI-service attachment economics.
      whyItMatters: The AI pivot could expand margin or simply replace lower-cost staff augmentation with more expensive supply and sales motion.
      diligencePath: Review board KPI packs and finance materials showing gross margin and contribution margin by offering before and after the AI repositioning.
      relatedQuestionRefs: [QR007, QR008]
    - type: missing-source
      severity: material
      topic: litigation-regulatory-screen
      missingEvidence: Litigation, worker-classification, and regulatory enforcement searches across New York and major delivery jurisdictions.
      whyItMatters: Public website evidence does not prove the absence of disputes, penalties, or reserve-building events.
      diligencePath: Run docket and regulator searches across core markets and reconcile findings with insurance coverage, reserves, and indemnity terms.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR001]
