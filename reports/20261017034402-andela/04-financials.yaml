        - from: upskill
          to: gross
          label: "Training fees less curriculum and support cost"
    approximationNotes: Public sources identify the revenue motions but do not disclose per-line revenue mix or realized margin contribution.
    claimRefs: [CI001, CI002, CI003, CI008, CI010]
