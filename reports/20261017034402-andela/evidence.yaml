evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table completeness
    missingEvidence: >-
      Current board composition, durable executive roster, and clarified founder involvement after the 2024 CEO
      transition.
    whyItMatters: >-
      Leadership concentration and governance visibility affect underwriting of key-person risk and execution
      resilience.
    diligencePath: Request the current board deck, executive org chart, and biographies with start dates and reporting lines.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map completeness
    missingEvidence: >-
      Current cap table, ownership percentages, board rights, any debt facilities, and secondary or tender history since
      the 2021 Series E.
    whyItMatters: >-
      Without ownership and rights visibility, the investor map is only a historical financing sketch and not a control
      analysis.
    diligencePath: Request the latest cap table, financing documents, investor rights summary, and any 409A or tender materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: Financial disclosure and unsupported cover metrics
    missingEvidence: Current revenue, run-rate, gross margin, cash, burn, and verified employee headcount.
    whyItMatters: >-
      Those metrics determine whether Andela's operating scale converts into durable economics and whether the stale
      2021 valuation still holds.
    diligencePath: Request monthly management reporting, headcount export, and audited or reviewed financial statements.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent market studies or company disclosures that isolate TAM, SAM, SOM, and product-line revenue mix for
      hire, build, and upskill workflows.
    whyItMatters: Without those splits, valuation work has to rely on broad category narratives instead of addressable-revenue math.
    diligencePath: >-
      Request management's segment revenue bridge, attach-rate assumptions, and any third-party market work they use
      internally.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: demand-footprint
    missingEvidence: >-
      Active customer counts, deployment-seat volumes, renewal rates, and average contract values behind the 650+
      clients served and 2,000+ MSA claims.
    whyItMatters: Reach metrics do not show how much budget is recurring, deployed, or concentrated in a few accounts.
    diligencePath: >-
      Ask for cohort retention, active-account, and ACV data split by embedded talent, managed delivery, and training
      products.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: minor
    topic: pricing-opacity
    missingEvidence: Current public pricing, minimum commitments, or sample commercial terms for Andela's enterprise offers.
    whyItMatters: >-
      Hidden pricing makes it harder to map Andela's reachable buyer set and compare adoption friction across enterprise
      versus SMB customers.
    diligencePath: >-
      Request current pricing sheets, sample SOWs, and the smallest supported engagement profile from sales or
      management.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: material
    topic: contract-model
    missingEvidence: >-
      Primary current Andela buyer contract terms reconciling Tecla's reported 12-month minimum with Flexiple's reported
      30-day project termination right.
    whyItMatters: >-
      Contract duration and termination flexibility materially affect switching cost and the comparison with
      project-based rivals.
    diligencePath: >-
      Request the current buyer MSA and representative statements of work, then verify minimum term and termination
      clauses directly.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      A primary public Andela rate card or contract schedule showing list pricing, discounts, and minimum commitment by
      product lane.
    whyItMatters: >-
      Without primary pricing, the chapter can only assess packaging opacity and reported ranges, not true price
      competitiveness.
    diligencePath: >-
      Request current pricing sheets or anonymized customer contracts covering talent, managed delivery, and training
      products.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Public win-loss, renewal, or displacement data against Turing, Toptal, Arc, and regional staffing rivals.
    whyItMatters: >-
      The retained evidence shows category overlap but not whether buyers systematically choose Andela over the closest
      substitutes.
    diligencePath: Ask management for cohort-level pipeline conversion, renewal, and loss-reason data by competitor class.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: talent-exclusivity
    missingEvidence: Evidence on multi-homing, exclusivity, or supply-side churn for Andela technologists versus rival platforms.
    whyItMatters: Moat durability depends on whether Andela controls differentiated supply or only a better orchestration layer.
    diligencePath: >-
      Request internal data on active-talent exclusivity, cross-platform overlap, and supply retention by region and
      skill family.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt obligations, and downside runway.
    whyItMatters: >-
      Capital adequacy cannot be underwritten when the latest public funding marker is from 2021 but current liquidity
      is undisclosed.
    diligencePath: Request the latest board package or monthly finance dashboard with cash, burn, covenant, and runway views.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue mix by placement, managed AI delivery, and training plus realized pricing and discount data.
    whyItMatters: Public offer breadth does not reveal which revenue line drives growth or whether the AI pivot is margin accretive.
    diligencePath: Request segmented revenue, bill-rate waterfall, discount schedule, and gross margin by revenue stream.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Net revenue retention, logo retention, customer concentration, and top-account exposure.
    whyItMatters: Revenue durability matters more than gross customer count in a services-heavy model with evolving product mix.
    diligencePath: Request cohort retention, customer concentration, and renewal data by segment and geography.
    relatedQuestionRefs:
      - QI003
      - QI005
  - type: stale
    severity: material
    topic: valuation-refresh
    missingEvidence: A verified post-2021 financing, secondary, or valuation marker tied to the AI-native repositioning period.
    whyItMatters: The public valuation anchor predates the current product and GTM narrative by several years.
    diligencePath: Request any secondary pricing, internal 409A updates, lender materials, or board-approved financing plans.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Public trust-center materials, security architecture, incident disclosures, uptime or SLA metrics, and any audited
      control evidence such as SOC 2 or ISO documentation.
    whyItMatters: >-
      Enterprise AI delivery and global workforce data handling create privacy, availability, and control-risk questions
      that marketing copy alone cannot resolve.
    diligencePath: >-
      Request security architecture, trust-center exports, latest audits, uptime commitments, and incident postmortems
      from Andela.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Independent developer or practitioner signal such as public repos, package usage, docs traffic, API activity, or
      community evidence showing recurring technical pull.
    whyItMatters: >-
      The product is sold as an AI-capability platform, but the retained sources do not show whether it generates
      developer adoption signals beyond enterprise sales-led deployments.
    diligencePath: >-
      Request developer portal analytics, public integration usage, or practitioner references, and supplement with
      GitHub, registry, or community telemetry if a public surface exists.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: platform-performance
    missingEvidence: >-
      Internal KPI definitions and longitudinal data for match accuracy, specialist retention, integration usage, and
      outcomes by Builders, Integrators, and Scalers cohorts.
    whyItMatters: >-
      Andela's moat depends on assessment quality and execution repeatability, but the pool only exposes headline
      outcome claims rather than the operating methodology behind them.
    diligencePath: >-
      Request cohort-level qualification funnels, retention and renewal data, implementation case studies, and
      score-to-outcome calibration for the matching engine.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Public NRR, GRR, churn, renewal, and cohort data by customer segment.
    whyItMatters: >-
      Without retention and cohort data, expansion durability cannot be underwritten from logos and satisfaction proxies
      alone.
    diligencePath: >-
      Request board materials or management reporting with cohort retention, expansion, and logo churn by segment for
      the last 8 quarters.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, top-10 customer concentration, and channel/partner contribution.
    whyItMatters: >-
      A marketplace with enterprise buyers can still be fragile if a small number of large accounts drives a
      disproportionate share of revenue.
    diligencePath: Ask for current customer concentration tables, top-account renewal history, and channel-sourced revenue mix.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: An exhaustive list of live reference accounts with deployment stage, geography, and use case.
    whyItMatters: >-
      The current sample proves recognizable customers exist, but it does not show how representative production
      deployments are across the book.
    diligencePath: Request a customer reference list and three renewal-backed case studies segmented by buyer type and contract size.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-proof-gap
    missingEvidence: Customer concentration, renewal, GRR/NRR, and top-account churn data for the past eight quarters.
    whyItMatters: >-
      2,000+ MSAs and a 98% satisfaction KPI do not prove durable revenue quality without concentration and renewal
      evidence.
    diligencePath: >-
      Request account-level cohort retention, top-10 revenue share, logo churn, and renewal waterfall data from
      management.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: security-and-incidents
    missingEvidence: >-
      Independent incident history, status-page uptime, SOC 2 or ISO reports, and breach-disclosure evidence for the
      hiring and payout stack.
    whyItMatters: >-
      Andela's promise to manage matching, onboarding, and global payouts creates operational and liability exposure if
      controls fail.
    diligencePath: >-
      Obtain the security packet, customer incident log, certifications, and any material exception register before
      underwriting platform reliability.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current gross margin, take rate, contractor utilization, and AI-service attachment economics.
    whyItMatters: >-
      The AI pivot could expand margin or simply replace lower-cost staff augmentation with more expensive supply and
      sales motion.
    diligencePath: >-
      Review board KPI packs and finance materials showing gross margin and contribution margin by offering before and
      after the AI repositioning.
    relatedQuestionRefs:
      - QR007
      - QR008
  - type: missing-source
    severity: material
    topic: litigation-regulatory-screen
    missingEvidence: >-
      Litigation, worker-classification, and regulatory enforcement searches across New York and major delivery
      jurisdictions.
    whyItMatters: Public website evidence does not prove the absence of disputes, penalties, or reserve-building events.
    diligencePath: >-
      Run docket and regulator searches across core markets and reconcile findings with insurance coverage, reserves,
      and indemnity terms.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: valuation-recency
    missingEvidence: A post-2021 primary round, secondary trade, tender, or internal mark that updates the $1.5B reference.
    whyItMatters: Without a fresh price signal, valuation stance is anchored to a stale benchmark rather than the current market.
    diligencePath: >-
      Request the latest board materials, financing memos, tender documents, or third-party mark references from
      2024-2026.
    relatedQuestionRefs:
      - QV003
      - QV006
      - QV008
  - type: private-evidence-only
    severity: material
    topic: profitability-and-cash
    missingEvidence: Audited or board-grade revenue, gross margin, burn, runway, and cash balance evidence.
    whyItMatters: >-
      The recommendation cannot move beyond track without proving whether the AI repositioning creates attractive
      economics.
    diligencePath: Request audited financial statements, monthly management accounts, and cohort margin bridges covering 2024-2026.
    relatedQuestionRefs:
      - QV005
      - QV006
      - QV008
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: Customer concentration, renewal, NRR, and expansion data tied to the enterprise client base.
    whyItMatters: >-
      Client and MSA counts do not show how durable or concentrated revenue is, which is central to downside
      underwriting.
    diligencePath: >-
      Request top-customer concentration, logo retention, NRR, gross retention, and AI-solution attach-rate data by
      cohort.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV007
      - QV008
