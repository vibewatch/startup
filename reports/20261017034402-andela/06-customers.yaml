  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public NRR, GRR, churn, renewal, and cohort data by customer segment.
      whyItMatters: Without retention and cohort data, expansion durability cannot be underwritten from logos and satisfaction proxies alone.
      diligencePath: Request board materials or management reporting with cohort retention, expansion, and logo churn by segment for the last 8 quarters.
      relatedQuestionRefs: [QU008]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, top-10 customer concentration, and channel/partner contribution.
      whyItMatters: A marketplace with enterprise buyers can still be fragile if a small number of large accounts drives a disproportionate share of revenue.
      diligencePath: Ask for current customer concentration tables, top-account renewal history, and channel-sourced revenue mix.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: An exhaustive list of live reference accounts with deployment stage, geography, and use case.
      whyItMatters: The current sample proves recognizable customers exist, but it does not show how representative production deployments are across the book.
      diligencePath: Request a customer reference list and three renewal-backed case studies segmented by buyer type and contract size.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
