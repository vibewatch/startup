  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, Track, "Do not underwrite a buy call from public evidence alone."]
      - [Confidence, Medium, "Scale and positioning are visible, but valuation support is incomplete."]
      - [Risk rating, High, "Missing profitability, retention, and fresh pricing data widen downside uncertainty."]
      - [Valuation stance, Stretched, "Latest explicit public marker is still the 2021 $1.5B round."]
      - [Entry discipline, "Fresh price discovery required", "Need a new primary, secondary, or tender reference before paying up."]
      - ["Target return / hold / exit", "Not supportable from public evidence", "No reliable current valuation or cash-flow base is disclosed in the pool."]
    notes: >-
      Analytical summary table based on the retained chapter claims; it
      intentionally avoids unsupported valuation precision.
    claimRefs: [CV003, CV004, CV005, CV010, CV011, CV012, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - ["Thesis: AI positioning", "Official pages now frame Andela as a human execution layer for enterprise AI with deployable AI-native engineers and training capacity.", "Sustained proof that AI solutions attach to revenue and renewals would strengthen the bull case."]
      - ["Thesis: Commercial footprint", "A 5.6M developer ecosystem, 17K certified AI-native engineers, and 650+ clients suggest real supply and enterprise reach.", "Board-level cohort data showing active, retained, and expanding accounts would convert footprint into underwriting proof."]
      - ["Anti-thesis: stale valuation support", "The pool still centers on the 2021 $1.5B Series E marker plus derivative restatements rather than a fresh market-clearing price.", "A credible 2024-2026 round, tender, or secondary reference could reset the valuation debate."]
      - ["Anti-thesis: competition and opacity", "Comparator evidence shows active alternatives while public pricing remains incomplete, limiting confidence in margin durability and differentiation.", "Transparent pricing, gross-margin disclosure, and win-rate or retention data would narrow this concern."]
    notes: >-
      Rows separate the evidence-backed thesis from the specific proof still
      needed to move the recommendation.
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV010, CV011, CV012, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "AI-native positioning converts into durable enterprise growth, renewals hold, and fresh diligence proves attractive unit economics.", "Could justify paying above the last known 2021 benchmark only after a new external price marker and audited operating proof.", "Execution gap between marketplace scale and enterprise monetization remains the main failure mode.", "Would require new financing or secondary evidence plus disclosed retention and margin strength."]
      - [Base, "Andela remains strategically relevant and commercially scaled, but public evidence still lacks current profitability and price discovery.", "Best viewed around or below the last known benchmark until new data proves the AI pivot is translating into economics.", "Stale valuation support and incomplete revenue-quality data keep the upside case unproven.", "Matches the current pool: strong narrative and scale, incomplete underwriting inputs."]
      - [Bear, "Competitive pressure, weaker retention, or softer enterprise hiring prevents the AI repositioning from yielding durable economics.", "Would imply a reset below the last explicit benchmark and turn current scale signals into insufficient downside protection.", "No public pricing, no fresh mark, and no audited cash-flow evidence leave little defense if fundamentals disappoint.", "Any markup attempt without fresh proof, or evidence of concentration and renewal weakness, would push the case here."]
    notes: >-
      Scenario table uses directional valuation logic relative to the last known
      benchmark because the assigned pool lacks fresh mark-to-market evidence.
    claimRefs: [CV004, CV005, CV006, CV009, CV010, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Commercial scale and AI repositioning create option value, but stale
      valuation markers and undisclosed unit economics keep the call at track.
    data:
      nodes:
        - label: "AI-era positioning"
          detail: "Official pages frame Andela as the human compute or execution layer for enterprise AI."
        - label: "Scale signals"
          detail: "A 5.6M developer ecosystem, 17K certified AI-native engineers, 200K+ trained, and 650+ clients."
        - label: "Strategic expansion"
          detail: "Third-party sources link Qualified, Casana, and Woven to wider supply, geography, and AI assessment depth."
        - label: "Monetization proof gap"
          detail: "Public evidence still lacks audited profitability, gross margin, burn, cash, and renewal disclosure."
        - label: "Price discovery gap"
          detail: "Latest explicit public benchmark remains the 2021 $1.5B Series E marker repeated by third parties."
        - label: "Recommendation"
          detail: "Track, with valuation discipline tied to fresh market marks and board-grade operating evidence."
      edges:
        - label: "supports relevance"
        - label: "broadens upside"
        - label: "needs translation into economics"
        - label: "blocks clean underwriting"
        - label: "therefore track"
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV008, CV011, CV012, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Public-evidence call
    body: >-
      Andela merits continued coverage, but not a buy recommendation, because
      the evidence of platform scale is meaningfully stronger than the evidence
      that today's price would be attractive.
    claimRefs: [CV003, CV011, CV012, CV013]
  - calloutType: risk
    title: Main underwriting blocker
    body: >-
      The assigned pool does not surface a post-2021 market-clearing valuation
      marker or the profitability data needed to defend one.
    claimRefs: [CV004, CV005, CV006, CV011, CV012]
  - calloutType: assumption
    title: What would upgrade the view
    body: >-
      A stronger recommendation would require fresh evidence that Andela's AI
      positioning is translating into durable revenue quality, not just broader
      marketplace scale.
    claimRefs: [CV001, CV003, CV011, CV013, CV014]
