- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Chinese-mythology distinctiveness
    - Incumbents can outspend Game Science on franchise marketing even if they cannot copy the exact IP angle
    - medium
    - Request long-term Black Myth franchise roadmap and sequel timing.
  - - Breakout launch proof
    - Single-franchise concentration means one weak follow-up could reset trust quickly
    - high
    - Request project slate beyond Black Myth and staffing allocation by title.
  - - PC + PS5 premium foothold
    - Elden Ring, God of War Ragnarök, and Dragon's Dogma 2 already span broader console footprints
    - high
    - Verify Xbox timing and whether future launches will be broader at day one.
  - - Full-price premium positioning
    - Free-entry substitutes like Naraka and other live-service habits can absorb attention without another boxed purchase
    - medium
    - Request evidence on post-launch retention, DLC plans, and cross-title cannibalization.
  - - First-mover Chinese AAA prestige
    - Phantom Blade Zero and other funded Chinese projects can narrow the novelty gap
    - high
    - Track Chinese premium pipeline, funding rounds, and launch windows quarterly.
  - - Strong launch buzz and visuals
    - Performance/design criticism can weaken long-term brand trust versus higher-scoring incumbents
    - medium
    - Review patch cadence, user-rating trend, and major content-update reception.
  notes: This register focuses on displacement vectors visible in retained public evidence rather than hypothetical competitive
    scenarios.
