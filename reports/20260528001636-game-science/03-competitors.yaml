    - Sony uses premium pricing but offsets with platform-brand trust and bundles
  - - Dragon's Dogma 2
    - $69.99 base on Steam
    - Premium single-player fantasy RPG sequel
    - DLC attach and realized discounting are not public in retained sources
    - Capcom priced the sequel above the $59.99 tier
  - - Stellar Blade
    - Current retained official sources confirm premium console and PC release but not a contemporaneous list-price snapshot
    - Story-driven single-player action adventure on PS5 and PC
    - List price should be refreshed from a live store page before underwriting realized monetization
    - Packaging is premium, but current public price evidence in retained sources is incomplete
