callouts:
- calloutType: insight
  title: Black Myth already proved demand; the harder problem is defending that demand against deeper franchises
  body: Game Science no longer has to prove that a new Chinese premium action IP can sell globally. It now has to prove that
    the franchise can keep winning against publishers with broader platforms, stronger sequel machines, and more repeatable
    distribution leverage.
  claimRefs:
  - CP005
  - CP006
  - CP011
  - CP018
  - CP019
  - CP042
- calloutType: risk
  title: Success is funding the next Chinese challenger, not freezing the field
  body: Phantom Blade Zero matters because Black Myth’s own success appears to be unlocking capital for nearby Chinese premium-action
    competitors. That reduces the odds that Wukong remains a one-off category without local follow-on pressure.
  claimRefs:
  - CP024
  - CP026
  - CP027
