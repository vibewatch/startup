  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: aaa-budgets
    missingEvidence: Game Science budget, marketing spend, and external development cost compared with incumbent AAA peers.
    whyItMatters: Budget scale determines whether Black Myth can sustain blockbuster production values against larger publishers.
    diligencePath: Request management budget disclosures, outsourcing spend, and capitalized development cost by title.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-economics
    missingEvidence: Realized ASPs, regional discounting, deluxe attach rates, and refund/discount cadence across the peer
      set.
    whyItMatters: List pricing alone does not show monetization quality or how hard the category is competing on net price.
    diligencePath: Request sell-through dashboards by storefront and region, plus discount calendars and deluxe attach data.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: buyer-overlap-metrics
    missingEvidence: A public cohort or survey source quantifying how often premium action-RPG buyers also spend heavily in
      Genshin, Naraka, or similar live-service titles.
    whyItMatters: Switching-cost and substitute analysis is directionally strong but not quantified at the buyer-overlap level.
    diligencePath: Pull platform-survey, player-behavior, or publisher telemetry sources that break down cross-title time
      share.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: stale
    severity: material
    topic: post-launch-cadence
    missingEvidence: Current public confirmation of Game Science’s next platform, expansion, or sequel cadence beyond the
      existing launch footprint.
    whyItMatters: Without roadmap visibility, it is harder to judge whether Black Myth can convert one breakout into a durable
      franchise.
    diligencePath: Refresh official announcements, earnings commentary, and platform pages for Xbox timing, DLC, or sequel
      milestones.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP004
