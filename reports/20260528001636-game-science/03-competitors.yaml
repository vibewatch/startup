tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - 'Black Myth: Wukong / Game Science'
    - Direct peer / focal company
    - 10M copies in 3 days; 2.2M Steam peak CCU in day one
    - Premium single-player action-RPG buyers on PC and PS5
    - Chinese mythology, strong spectacle, full-price premium launch
    - Publicly visible franchise set is concentrated around one breakout title
  - - Elden Ring / FromSoftware + Bandai Namco
    - Direct incumbent
    - 94 Metacritic on Steam PC; 817,955 Steam recommendations
    - Hardcore premium action-RPG buyers across console and PC
    - Soulslike benchmark, Xbox + PS5 + PC reach, franchise trust
    - Less culturally differentiated than Black Myth and already heavily established
  - - God of War Ragnarök / Santa Monica Studio + Sony
    - Direct incumbent
    - 15M+ units sold across PS4 and PS5; Sony-backed publishing
    - Cinematic action-adventure buyers and PlayStation loyalists
    - First-party brand trust, awards recognition, PS4 + PS5 + PC footprint
    - Less open-ended combat identity than Elden Ring or Black Myth
  - - Dragon's Dogma 2 / Capcom
    - Direct incumbent
    - 2.5M+ units sold; series above 10M; Capcom IP-driven model
    - Fantasy action-RPG players wanting party systems and open-world depth
    - Established Capcom catalog and multi-platform launch
    - Higher $69.99 base price and weaker review consensus than Elden Ring
  - - Stellar Blade / Shift Up + PlayStation
    - Direct peer / adjacent incumbent
    - 3M+ units across PS5 and PC; Sony publishing support
    - Console-first action players seeking spectacle and boss fights
    - High presentation quality, Sony distribution, similar premium production values
    - Sci-fi setting and smaller public-company scale than Sony first party
  - - Phantom Blade Zero / S-GAME
    - Likely entrant
    - Coming in Sep 2026; VGC says extra funding followed Wukong success
    - Chinese-action fans likely to cross-shop Black Myth and Soulslike-adjacent titles
    - Wuxia/Kungfupunk identity, PS5 + PC plan, single-player focus
    - Not yet shipped, so execution and demand remain unproven
  - - Genshin Impact / HoYoverse
    - Adjacent substitute
    - Large live-service benchmark; exact scale is not quantified in retained sources here
    - Players who want ongoing action-RPG progression without a premium ticket
    - Persistent live-service habit formation and content cadence
    - Not a like-for-like premium boxed single-player comparison
  - - 'NARAKA: BLADEPOINT / NetEase'
    - Substitute / time competitor
    - 40M+ players and free entry on Steam
    - Action players prioritizing multiplayer retention over premium solo narrative
    - Free-to-play battle royale loop lowers switching cost
    - Different session model and less direct story-driven overlap than Black Myth
  notes: Profiles focus on the buyer-relevant competitive classes most likely to absorb premium-action budget or time rather
    than on every global action title.
