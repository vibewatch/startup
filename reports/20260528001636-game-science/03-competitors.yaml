  rows:
  - - 'Black Myth: Wukong'
    - $59.99 standard; $69.99 digital deluxe
    - Premium single-player action RPG on PC plus PS5 availability
    - Realized sell-through discounts and regional pricing are undisclosed
    - Competes head-on with top premium peers rather than undercutting them
  - - Elden Ring
    - $59.99 base; $79.99 Shadow of the Erdtree Edition; $99.99 deluxe
    - Base game plus expansion-linked upsell paths
