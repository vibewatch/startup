  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Game Science’s public financial picture is dominated by one hit: official store pages anchor Black Myth: Wukong at a $59.99 standard price and $69.99 PC deluxe price, while multiple reports place unit sales at 10 million in three days, 18 million in two weeks, more than 25 million by January 2025, and more than 30 million within the first year. Those verified and near-verified facts support extraordinary launch economics, but not a fully underwriteable P&L: net receipts still depend on platform mix, store fees, Unreal royalties, taxes, refunds, and self-publishing costs, while cash balance, burn, development budget, and the current cap table remain only partially public. The evidence-led verdict is therefore strong one-title cash generation with material sequel-funding capacity, but also substantial hit concentration and disclosure risk."
  },
