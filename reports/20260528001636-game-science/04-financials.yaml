    {
      "id": "underwriting-blockers-and-adverse-lens",
      "title": "Underwriting blockers, concentration risk, and adverse evidence",
      "body": "The adverse case is not that Black Myth: Wukong lacked commercial success; it is that the surrounding financial disclosure is still too thin for clean underwriting. Official store pages do not disclose realized ASP, taxes, refunds, net revenue, gross margin, or profitability. Media coverage of Tencent’s 2026 ownership increase explicitly notes that Game Science had not publicly disclosed figures for the game for some time, reinforcing that even after a record-breaking launch the company remains financially opaque. The second adverse lens is concentration. Nearly every visible financial proof point in the public set traces back to one premium title, and KrASIA’s report that Game Science shelved DLC plans in favor of Zhong Kui suggests management is already redeploying attention and likely capital into the next cycle instead of simply harvesting the first hit. That may be strategically rational, but it also means investors are underwriting repeatability, not just a single launch outcome. The chapter’s verdict is therefore intentionally split. Verified numbers show a premium title with extraordinary sell-through and likely very large pre-Opex receipts. Modeled ranges suggest the game plausibly paid back development several times over. But inferred judgments on margins, liquidity, and franchise durability still rest on missing private data. In diligence terms, the bull case is powerful launch economics; the blocker is that the remaining financial unknowns are exactly the ones that determine how durable those economics really are.",
