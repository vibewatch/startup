            title: Do not underwrite against an all-games TAM
            body: >-
              The broadest market numbers are useful context, but they mix mobile, live service, and other spend pools
              that do not translate into Game Science net revenue. The more defensible lens is premium PC and console
              unit demand filtered through platform economics and China export capability.
