  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Premium single-player action RPG on PC and console
        - Full-game purchases and deluxe-edition upsell on Steam and PS5 for Black Myth-like titles
        - Mobile gacha, ad-funded play, and non-premium subscription consumption
        - End-player account holder pays through Steam or PlayStation billing rails
        - Core market that maps directly to Game Science's current product
      - - Chinese premium game export
        - Overseas unit sales and digital sell-through for Chinese-developed premium titles
        - Domestic-only approvals or revenue pools that never export
        - International players, platforms, and publishers/distributors
        - Captures the cultural-export and China-AAA upside around Game Science
      - - Action RPG / soulslike adjacency
        - Comparable premium titles with challenge-driven combat and long-tail engagement
        - Genres without comparable monetization or engagement patterns
        - Premium players choosing among adjacent franchises
        - Best public proxy for willingness to pay and replay in Game Science's genre neighborhood
      - - Global premium PC and console publishing economics
        - Platform fees, storefront discovery, certification, digital mix, and export economics
        - Hardware, peripherals, and non-game media spending
        - Platforms, publishers, and end users all influence realized economics
        - Explains why gross demand does not convert one-for-one into publisher revenue
      - - Broad games market outer envelope
        - All-game PC, console, mobile, cloud, and live-service spend used in macro market reports
        - Direct Game Science revenue when spending never becomes a premium unit sale
        - Mixed across users, advertisers, subscribers, and platforms
        - Useful context, but too broad to be treated as Game Science's TAM
    notes: >-
      Boundary is drawn from Black Myth's current monetization surfaces outward: premium unit sales on Steam and
      PlayStation, adjacent premium action-RPG demand, and Chinese premium export rather than all games spend.
