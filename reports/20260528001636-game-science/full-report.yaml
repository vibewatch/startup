      - number: '2.3'
        title: Buyer, platform, and regional publishing routes
        blocks:
          - type: paragraph
            body: >-
              The user is the player, but the payer map is mediated by platforms, subscriptions, and regional rules. On
              PlayStation, Black Myth is sold as a PS5 premium title with broad language support, while Sony's ecosystem
              reports 125 million monthly active users, 74.6 million quarterly software units, and an 85% digital mix.
              That creates a large digitally native console buyer pool. Steam provides a parallel PC route with global
              reviews, community discovery, and a revenue-share structure that meaningfully shapes economics at scale.
              These routes are not interchangeable: storefront operators control billing, discovery, and policy, while
              optional subscription layers such as PlayStation Premium can alter access paths without changing the core
              premium positioning. Regional publishing choices matter even more in China. Microsoft's public guide shows
              how certification itself adds process and timing friction before retail publish, and China adds another
              gate through NPPA licensing. Public licensing sources indicate approvals are ongoing but permissioned,
              with monthly lists and an English-language tracking database. For foreign titles, Abacus reports that
              local publishing partners are required and approval can take materially longer. Game Science has already
              shown export-oriented localization, but that does not remove platform or regulatory gatekeepers.
