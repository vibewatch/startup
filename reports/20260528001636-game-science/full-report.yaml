      - number: '7.2'
        title: Franchise and platform concentration
        blocks:
          - type: paragraph
            body: >-
              Commercial concentration remains the chapter's core financial risk. Wukong's sales trajectory was
              extraordinary: 10 million units in three days, 18 million in two weeks, more than 20 million in a month,
              and more than 30 million in a year in later reporting. That success created cash, brand recognition, and
              recruiting leverage, but it also reset the hurdle rate for anything that follows. Public market-structure
              data from Newzoo and BCG suggests this is the wrong moment to assume easy repeatability. Proven franchises
              are no longer guaranteed to work, console remains hit-driven, and digital storefronts are growing more
              crowded rather than less.


              The distribution footprint reinforces the concentration story. Steam and PlayStation carried the original
              breakout, while Xbox arrived a full year later. That meant Game Science's most visible premium success
              initially depended on PC storefront conversion, Steam review visibility, and PlayStation console
              economics. Steam and Sony both reserve wide rights around rules enforcement, access restrictions, content
              availability, and review or moderation frameworks. Even without a direct enforcement event, those terms
              make platform dependence a structural rather than theoretical risk. The business is not merely selling a
              game; it is renting visibility from two powerful storefront ecosystems.


              Execution risk on platform expansion is also tangible rather than hypothetical. Game Science's own founder
              tied the Xbox delay to Series S optimization constraints, undercutting the comforting story that expansion
              is purely a business-deal choice. If one blockbuster title already needed an extra year to broaden
              platform coverage, investors should not assume faster or cheaper multiplatform execution on the sequel, on
              DLC-scale content, or on a broader portfolio. That matters because a one-hit studio needs not just another
              good game, but another good game that ships widely and on time.
            claimRefs:
