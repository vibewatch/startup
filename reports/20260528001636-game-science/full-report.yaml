        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Game Science’s customer base here is not enterprise procurement; it is players who discover, buy, own,
              rate, and sometimes upgrade one premium action RPG. Official store surfaces show a straightforward premium
              structure rather than free-to-play or subscription monetization: the standard edition sits at $59.99, a
              digital deluxe edition adds cosmetic/equipment extras plus a soundtrack, and a later upgrade path lets
              standard buyers step up without rebuying the game. The most visible buyer split is platform-led. Steam
              concentrates the enthusiast PC audience, benchmarking activity, review volume, and modding surface.
              PlayStation captures a mainstream premium-console cohort with a far smaller but still very large rating
              base. Geography is less cleanly disclosed, but public reporting and language/review mix indicate the
              audience is bigger than China alone while still likely anchored in China and broader non-English demand.
              That creates four practical segments for diligence: China-anchored premium buyers, overseas premium
              buyers, Steam-first hardcore action-RPG owners, and higher-ARPU deluxe/DLC purchasers.
