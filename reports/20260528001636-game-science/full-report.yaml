              Public geography data is incomplete, but the retained set is still enough to make two defensible points.
              First, China is almost certainly the single biggest customer block. 80 Level reported Yang Qi saying 30%
              of players were outside China, which implies the majority were domestic Chinese buyers. Second, the
              customer base is not merely a China-only phenomenon. SCMP says Black Myth’s global popularity helped drive
              almost 21% overseas revenue growth for China-developed games, while Steam’s all-language review count
