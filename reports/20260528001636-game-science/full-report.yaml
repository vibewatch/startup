      - number: '3.2'
        title: >-
          Capability, platform reach, and packaging show where Black Myth competes on equal footing and where it does
          not
        blocks:
          - type: paragraph
            body: >-
              On raw presentation, Black Myth belongs in the same conversation as the category leaders. Its Metacritic
              result is level with Stellar Blade and its launch traction on Steam was exceptional for a single-player
              game. The problem is that capability comparison is broader than graphics and boss fights. Elden Ring and
              Dragon’s Dogma 2 already cover Xbox as well as PlayStation and PC; God of War Ragnarök adds Sony’s
              two-console install base plus a later PC expansion; and Phantom Blade Zero is already listing both PS5 and
              Steam before release. Packaging also reveals pressure points. Black Myth entered the market at a standard
              $59.99 base edition with a $69.99 digital deluxe option, which is competitive against Elden Ring and God
              of War Ragnarök but below Dragon’s Dogma 2’s $69.99 standard price. That makes Black Myth reasonably
              priced for a premium launch, yet it also means it is competing head-on with category leaders at nearly
              identical ticket sizes rather than winning on a meaningful price wedge. At the same time, substitutes like
              Naraka attack from the opposite direction with free entry, while unreleased Phantom Blade Zero still has
              pricing flexibility. Public evidence therefore supports a nuanced conclusion: Black Myth is competitive on
              spectacle and fair on list pricing, but it does not yet enjoy the broadest platform footprint or the most
              defensible packaging position in the field.
