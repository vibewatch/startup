  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope & Gameplay Pillars
        blocks:
          - type: paragraph
            body: >-
              Black Myth: Wukong is best understood as a premium single-player action RPG product family rather than
              just a boxed game. The shipped experience now spans the base game across PC/PS5/Xbox, the pre-launch
              benchmark utility, and smaller monetized or replayability extensions such as the digital deluxe upgrade
              and later challenge-mode content. In player-workflow terms, the product starts before purchase on PC
              because Game Science gave users a public benchmark tool to test whether their machine could cope with the
              game’s unusually heavy rendering load. That is a notable product decision: it lowers acquisition friction
              for a visually ambitious title that knows compatibility anxiety is part of the buying workflow.


              Inside the game, the pillars are clear and consistently repeated across official surfaces and review
              coverage: cinematic boss encounters, staff-centered melee, spell and transformation combinations,
              myth-rich environments, and lore delivered through enemies and character backstories. The product’s
              differentiation is therefore not a novel business model or live-service loop but a tight blend of
              Chinese-mythology framing with spectacle-heavy combat execution. The tradeoff is that Black Myth’s scope
              remains concentrated on authored single-player play. Deluxe content is cosmetic/utility-oriented, while
              meaningful post-launch expansion has so far favored challenge and replay systems over openly roadmapped
              story DLC.
