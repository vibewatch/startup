      - number: '4.2'
        title: Gross-to-net mechanics and modeled revenue ranges
        blocks:
          - type: paragraph
            body: >-
              The chapter’s central distinction is between verified consumer spend anchors and modeled company receipts.
              Official prices, unit milestones, and Steam tier economics are real observations; booked net revenue is
              not public. Valve’s Steamworks terms show that a title of this scale should move above Steam’s $10 million
              and $50 million thresholds quickly, which means the marginal platform take on Steam is likely better than
              a flat 30 percent assumption. Unreal’s royalty terms also matter, but not uniformly, because the license
              excludes the first $1 million of lifetime gross revenue and contains Epic-store-specific exclusions. That
              is why the modeling in this chapter uses a deliberately broad 60 to 72 percent developer-receipt band
              rather than pretending to know the exact net percentage. With a blended gross price assumption of roughly
              $56 to $64 per unit, the first three days likely imply around $560 million to $640 million of consumer
              spend and roughly $336 million to $461 million of pre-operating-cost receipts. Extending the same
              framework through the two-week, one-month, January 2025, and first-year milestones produces very large
              numbers, but those remain medium-confidence scenarios, not verified financial statements. The conclusion
              is clear enough for diligence: Wukong looks like a blockbuster cash event, yet still not a transparent
              public-company revenue disclosure.
