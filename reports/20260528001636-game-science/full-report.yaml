  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Recommendation: track the franchise, but do not mistake one huge launch for fully underwritten platform
          economics
        blocks:
          - type: paragraph
            body: >-
              Game Science has already crossed the threshold where dismissing it as a niche studio is no longer
              credible. Public sales evidence shows Black Myth: Wukong reached 10 million copies in roughly 83 hours, 20
              million copies in its first month, and more than 25 million copies by January 2025, with later reporting
              pointing to 30 million copies in its first year. That scale alone corroborates unicorn status. The problem
              is not whether Wukong mattered; it is whether a private investor today is buying a durable multi-title
              franchise or simply harvesting an extraordinary first hit. Public comps suggest diversified game
              publishers can trade around 6x-8x sales, and CD Projekt can clear a higher premium when investors believe
              a hit-driven studio still owns repeatable franchise economics. Game Science has not yet disclosed the
              recurrence, margin, or governance data needed to claim similar quality with confidence. That makes the
              right posture track or research-more rather than buy: public evidence supports real value, but not a blind
              premium beyond the breakout title.
