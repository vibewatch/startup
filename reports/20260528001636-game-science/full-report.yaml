            body: >-
              The adverse customer picture is real even though launch sales were extraordinary. SteamCharts shows
              average monthly players collapsing from 970,442.70 in August 2024 to 7,187.86 over the last 30 days, with
              monthly peak concurrency dropping from 1,365,923 in September 2024 to 15,575 in the last 30 days. That
              kind of decay is not fatal for a premium single-player game, but it does mean the business cannot be
              treated like a live-service annuity without internal cohort data. The bigger concern is platform friction.
              PC Gamer and GamesRadar both cited technical issues, Game Science itself warned about occasional serious
              PC problems, GamesRadar later documented a compatibility mode for stability, and a Steam discussion thread
              shows returning players still complaining about stutter and freezes after later updates. Platform reach
              was also capped by Xbox’s one-year delay. Finally, every retained customer proof point still centers on
              one SKU. Until Game Science proves sequel, DLC, or next-title carryover with comparable public demand,
              visible customer concentration remains single-title concentration.
