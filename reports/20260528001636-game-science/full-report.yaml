      - number: '1.5'
        title: Adverse Issues, Regulatory Context, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The company overview also has to carry the main adverse and diligence caveats forward into later chapters.
              The biggest reputational issue in retained sources is not game quality but governance and communications
              risk. TheGamer, Inverse, and The Week all describe a 2024 controversy in which creators who received codes
              were reportedly instructed not to discuss topics such as politics, 'feminist propaganda,' or Covid-19,
              with the incident landing in a broader debate about censorship and Game Science's earlier sexism
              allegations. Those reports do not prove a regulatory sanction, but they do show how quickly Game Science's
              global brand can collide with culture-war and governance scrutiny. Platform execution risk also remained
              visible even after launch. Gadgets360 cites Game Science's FAQ saying the Xbox version needed more
              optimization time to meet quality standards, while The Game Post and Forbes quote Feng Ji blaming Xbox
              Series S memory constraints and note that Microsoft publicly denied the delay was due to platform
              limitations raised to it. Finally, public coverage still leaves several core diligence asks unanswered:
              regulator-primary proof of the February 2024 approval item, a verified current valuation, total capital
              raised, revenue or run-rate, and a defendable headcount figure.
