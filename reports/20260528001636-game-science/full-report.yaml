        - CO006
        - CO012
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    Game Science develops premium AAA action RPGs rooted in Chinese mythology. Its flagship product, Black Myth: Wukong,
    is a premium single-player console/PC title sold on Steam, PlayStation, Epic Games Store, and regional PC channels,
    with future franchise expansion, merchandising, and sequel optionality still emerging.
  customerFocus: >-
    Premium action-RPG players on PC and console, especially Steam-first global buyers and PS5 owners, with China still
    important but overseas demand already material to the franchise's economics.
  businessModel: >-
    Premium unit sales of Black Myth: Wukong and future franchise titles, plus deluxe-edition upsell, possible DLC or
    sequel monetization, and longer-tail merchandise or licensing revenue if the Black Myth universe expands.
  stage: Private, post-launch franchise scale-up
  fundingStatus: >-
    Public evidence supports an early Hero Entertainment investment and a disclosed Tencent strategic stake of 5% by
    2021, but no fully corroborated post-launch priced financing round is publicly confirmed.
