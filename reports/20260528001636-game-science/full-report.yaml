      - number: '4.3'
        title: Cost proxies, capital structure, and cash-flow implications
        blocks:
          - type: paragraph
            body: >-
              Open-source cost evidence is thinner than open-source sell-through evidence, so this section leans on
              proxies and labels them accordingly. Public profiles place Game Science’s founding in 2014 and its
              footprint across Hangzhou and Shenzhen, while Baidu Baike pegs the standalone Wukong project start to
              February 2018. That creates roughly a six-year production arc into the August 2024 launch. Team-size
              reporting suggests a sub-150-person studio in 2024, with only around 20 developers attached to the 2020
              demo and one lower-confidence profile describing a roughly 100-person lean team supported by outsourcing.
              Unreal’s own interview confirms the team migrated from UE4 to UE5 and viewed Nanite, Lumen, and
              editor-performance gains as meaningful workflow improvements, which likely helped efficiency but did not
              eliminate AAA-scale content and optimization costs. Marketing intensity was also real rather than
              accidental: Niko describes four million-plus wishlists, 55 million Bilibili trailer views, 1.7 billion
              Weibo views on launch day, and rapid sell-outs for limited physical editions and co-branded promotions.
              Capital structure is only partly visible. Yicai reported Tencent’s move to a 5 percent stake in 2021, and
              Game World Observer reported a move to 24 percent in 2026 after Hero’s exit, but the retained source set
              still lacks the underlying primary filing and discloses no purchase price. Most importantly, no retained
              public source discloses current cash, burn, runway, or debt. That means the likely cash windfall from
              launch does not automatically translate into a proven self-funded sequel case; it only makes one
              plausible.
