  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: wide
    summary: >-
      The strongest public unit-economics read is not SaaS-like retention but premium sell-through converting into a
      one-time cash event that must then cover a long development cycle and sequel spend.
    data:
      nodes:
        - id: u1
          label: China-heavy launch
          description: Domestic demand supplied the largest share of units and likely anchored early cash conversion.
        - id: u2
          label: PC-heavy mix
          description: Steam appears to have carried more units than PS5 early on.
        - id: u3
          label: Premium pricing
          description: Headline pricing stayed in AAA territory rather than chasing discount-led volume.
        - id: u4
          label: Steam fee relief
          description: A blockbuster can earn better marginal Steam terms above major thresholds.
