            body: >-
              The strongest verified financial facts are about monetization format and launch velocity, not about
              recognized revenue. Official PlayStation, Steam, and Epic pages all frame Black Myth: Wukong as a premium
              single-player action RPG, and the official US list price is consistently $59.99 for the standard edition,
              with a $69.99 digital deluxe tier visible on PC storefronts. Steam metadata also shows Game Science
              publishing the title itself on Steam, while PlayStation lists Game Science as publisher, supporting a
              self-published launch posture rather than a globally disclosed third-party publishing deal. Public
              launch-channel evidence is similarly strong: Gematsu and official Steam news show PS5 and PC as the core
              launch platforms, with WeGame explicitly included for China preloads. Sales milestones then move from
              strong to extraordinary. Multiple outlets reported Game Science’s 10 million-copy mark in three days,
              Gematsu later cited 18 million in two weeks, WN Hub cited more than 25 million by January 2025, and KrASIA
              said the game crossed 30 million within its first year. The weaker part of the record is mix. Regional and
              platform splits mostly come from analysts and secondary relays, but they consistently point to a
              China-heavy and PC-heavy launch, with PS5 still materially additive rather than the primary driver.
