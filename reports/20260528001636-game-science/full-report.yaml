            body: >-
              The cleanest public bridge starts with price and geography. PlayStation shows a $59.99 US list price,
              while Reuters-sourced coverage in Bangkok Post puts mainland China and Hong Kong pricing around $38 and
              says overseas markets represented roughly one quarter of early sales. That yields a rough blended gross
              list price near $43.5 per copy. Applied to 25 million copies, public consumer spend reaches about $1.09
              billion before platform fees, and a simple 70% publisher-retention assumption implies roughly $0.76
              billion of net receipts. If the title ultimately reaches 30 million copies, the same bridge climbs to
              about $1.31 billion gross and roughly $0.91 billion net. On that math, a $1.5 billion valuation is not
              absurd: it equals roughly 2.0x the 25 million-unit net-receipt bridge or about 1.6x the 30 million-unit
              bridge. The catch is that these are harvested hit-title economics, not audited recurring revenue, and the
              exact platform mix, tax burden, royalty burden, and free-cash conversion remain undisclosed. The public
              bridge supports unicorn status, but it does not erase execution or opacity discounts.
