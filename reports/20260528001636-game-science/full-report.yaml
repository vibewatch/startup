chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Game Science's public-company identity is clearest at the legal-entity level: Baidu's company profile and
              Crunchbase both identify the business as Shenzhen Game Science Interactive Technology Co., Ltd., founded
              in June 2014. The location story needs nuance rather than a single-city shortcut. The public Baidu entry
              ties the registered address to Nanshan District, Shenzhen, while Gematsu's company profile describes a
              dual Shenzhen and Hangzhou footprint, and Yicai's 2021 Tencent-investment report referred to the studio as
              Hangzhou-based. The safest synthesis is that the registered company sits in Shenzhen while the creative
              and production footprint spans both Shenzhen and Hangzhou. That matters because later media shorthand
              often collapses one of those facts and makes the business sound less distributed than it is.
              Operationally, Game Science looks like a premium-content studio rather than a services shop or
              live-service publisher. Its first products were mobile games, but the post-launch investment case now
              rests overwhelmingly on selling premium action RPG content and related platform distribution through Black
              Myth: Wukong. The studio is still private and founder-led, yet no longer pre-launch or experimental: it is
              best framed as a post-launch scale-up studio whose first globally successful AAA-like release is already
              in market.
