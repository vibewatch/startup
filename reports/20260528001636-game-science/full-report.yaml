  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, incumbents, and substitute competition all overlap the same premium-action buyer
        blocks:
          - type: paragraph
            body: >-
              The direct peer set for Black Myth: Wukong is clear at the top end of premium single-player action RPGs:
              Elden Ring, God of War Ragnarök, Dragon’s Dogma 2, Stellar Blade, and the incoming Phantom Blade Zero.
              Each of those titles asks the same core question from buyers: if I have one premium-action slot in my
              budget and limited time, which game best combines spectacle, combat quality, platform access, and trust
              that the purchase will be worth 30 to 80 hours? Black Myth’s strongest differentiation is cultural and
              visual rather than structural. Its Chinese-mythology framing, Journey to the West positioning, and huge
              launch proof make it feel fresher than another western dark-fantasy or first-party cinematic sequel. But
              incumbents still own advantages in franchise depth and distribution. Elden Ring stretches across Xbox,
              PlayStation, and PC; God of War Ragnarök spans PS4, PS5, and PC with Sony’s first-party trust; Dragon’s
              Dogma 2 carries Capcom’s repeatable IP machine; Stellar Blade combines similar spectacle with Sony-backed
              publishing; and Phantom Blade Zero shows that Black Myth is already attracting Chinese followers.
              Meanwhile, Naraka and HoYoverse-style live-service habits matter as substitutes because they can absorb
              time and wallet share without requiring another $60 to $70 upfront purchase.
            claimRefs:
