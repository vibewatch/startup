      - number: '1.2'
        title: Founders, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Founder concentration is a core feature of the Game Science story. Public profiles consistently center
              Feng Ji as founder, chief executive, legal representative, and the main public spokesman on both strategic
              and technical questions. Yang Qi is the other verifiable co-founder and the clearest creative counterpart,
              with the founders' shared ex-Tencent background tracing back to work on Dou Zhan Shen/Asura-era
              development. That founder-market fit matters: the pair left Tencent during studio-system reorganization,
              built smaller titles first, and then spent years incubating Black Myth before global launch.
              Registry-style public information is more revealing about ownership than about classic venture governance.
              The accessible evidence identifies Feng Ji as the largest direct shareholder, with two internal management
              partnerships together controlling another large block, which implies that insiders still hold a majority
              position even after outside funding. What remains opaque is formal governance architecture. Publicly
              readable sources do not provide a dependable, current board roster, veto-right map, or investor-side
              protective provisions. For diligence, that means the key-person question is not cosmetic: Feng Ji appears
              to concentrate operational leadership, public narrative control, and a large direct ownership stake, while
              Yang Qi anchors the creative side of the franchise.
