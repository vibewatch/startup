      - number: '2.2'
        title: Multiple sizing lenses and premium action-RPG comparables
        blocks:
          - type: paragraph
            body: >-
              No single TAM headline is reliable enough for Game Science. The cleanest public lenses span different
              layers: global PC and console spend, premium PC and premium console spending, China's domestic
              mobile-plus-PC market, China's export game revenue, and direct franchise proof from premium action-RPG
              publishers. China is large by any standard, with Niko projecting $55.23 billion of domestic mobile-plus-PC
              revenue and 730 million gamers by 2026, plus $26.46 billion of export mobile-plus-PC revenue. But those
              numbers still do not isolate premium console or premium single-player spending. That is why comparable
              franchise performance matters. CD PROJEKT shows that export-heavy, digitally distributed premium RPGs can
              sell tens of millions of copies globally; Capcom's Monster Hunter numbers show similar scale for
              action-oriented premium franchises; and Elden Ring demonstrates that the soulslike adjacency can support a
              30 million-unit base game plus large DLC and spin-off demand. Black Myth: Wukong itself adds the strongest
              China-specific proof point in the set: third-party analytics estimate more than $835 million of Steam
              gross revenue with long average playtime, even though the installed base remained China-weighted. Together
              these sources say the opportunity is real, but they still do not collapse into one additive SAM.
