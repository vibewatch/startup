  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - current evidence
      - why it matters for value
      - what would change the view
    rows:
      - - Wukong is already a global premium-game outlier
        - >-
          10 million copies in three days, 20 million in one month, and 25 million by January 2025 are all publicly
          corroborated.
        - That sales curve is enough to support a unicorn bridge without inventing a financing round.
        - Further audited sell-through and platform mix would strengthen it.
      - - Self-publishing likely preserves more economics
        - Game Science appears as the publisher on the main PC and PlayStation storefronts.
        - Owning publisher economics can make each unit far more valuable than outsourced publishing.
        - Show the exact platform-fee, tax, and royalty bridge.
      - - 'Counter: this is still one title'
        - Public evidence shows one mega-hit and merch extensions, not a disclosed recurring portfolio.
        - Single-title concentration deserves a discount versus diversified listed peers.
        - A second release roadmap with funded milestones would narrow the discount.
      - - 'Counter: there is no priced public mark'
        - Tencent increased its stake, but the purchase price was not disclosed.
        - Without a priced mark, public valuation claims are inference rather than confirmation.
        - Disclose the transfer price or any later financing.
      - - 'Counter: sequel timing is not locked'
        - The studio pivoted away from immediate Wukong DLC toward Zhong Kui.
        - That makes investors pay for future franchise value before timing is clear.
        - Publish a hard roadmap or milestone cadence.
      - - Merchandising is real but its economics are unclear
        - KrASIA cited RMB 1.5 billion of Chow Tai Fook retail sales.
        - This proves IP demand but not Game Science take-rate.
        - Disclose licensing margins and revenue recognition.
    notes: >-
      Bull arguments are strongest on scale and IP pull; anti-thesis arguments are strongest on concentration, pricing
      opacity, and sequel timing.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV015
      - CV017
      - CV022
      - CV025
      - CV050
      - CV053
      - CV055
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - core assumptions
      - valuation logic
      - value range (USD billions)
      - probability signal
    rows:
      - - Bear
        - >-
          Wukong remains mostly a harvested one-hit event; sequel timing slips; disclosed net receipts come in below
          public bridges.
        - Apply a one-title discount to harvested cash flows and limited optionality.
        - 0.7-1.3
        - Most likely if private diligence shows low take-rates, heavy taxes/royalties, or no near-term follow-on slate.
      - - Base
        - >-
          25-30 million units hold, self-publishing economics are broadly intact, and Black Myth becomes a credible but
          not yet diversified franchise.
        - Support a public-evidence range modestly above unicorn level but below diversified public multiples.
        - 1.5-2.2
        - Fits the current evidence best because sales are real but recurrence is still assumed rather than disclosed.
      - - Bull
        - >-
          The Black Myth universe becomes repeatable, Zhong Kui or DLC monetizes well, and licensing margins prove
          meaningful.
        - Underwrite a durable premium-franchise path closer to the high end of hit-game public comps.
        - 2.8-4.0
        - >-
          Needs sequel visibility, higher-confidence cash conversion, and proof that Wukong was a platform not a
          one-off.
    notes: >-
      Scenario ranges are public-evidence underwriting guides, not discounted cash-flow outputs, and all scenarios
      retain a private-company opacity discount.
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV051
      - CV052
      - CV053
      - CV055
  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - metric basis
      - multiple / value signal
      - relevance to Game Science
      - limitation
    rows:
      - - CD Projekt
        - May 2026 market cap and TTM revenue
        - ~22.0x sales on $6.39B market cap and $0.29B TTM revenue
        - Useful premium-franchise comp for a hit-driven studio with owned IP and large back-catalog economics.
        - Still far more disclosed than Game Science and supported by multiple franchises and public reporting.
      - - Capcom
        - May 2026 market cap and TTM revenue
        - ~8.1x sales on $8.31B market cap and ~$1.03B TTM revenue
        - Useful diversified premium-publisher lens with strong catalog monetization and global IP breadth.
        - Capcom has much broader catalog depth and annual release cadence than Game Science.
      - - SHIFT UP
        - March 2026 market cap versus 2025 revenue
        - ~6.3x sales on KRW 1.87T market cap and KRW 294.5B revenue
        - Useful listed Asian single-hit / concentrated-IP lens with high margins and Tencent ownership.
        - SHIFT UP still has multiple monetization lines and fuller public disclosure than Game Science.
      - - Electronic Arts
        - May 2026 market cap and TTM revenue
        - ~6.9x sales on $50.32B market cap and $7.30B TTM revenue
        - Useful diversified benchmark for what public investors pay when recurrence and live services are visible.
        - EA's live-services mix and scale are far beyond anything publicly disclosed by Game Science.
      - - Take-Two
        - May 2026 market cap and revenue peer data
        - ~6.2x sales on ~$40.56B market cap and ~$6.55B revenue
        - Useful hit-driven publisher comp with explicit disclosures about concentration and acceptable pricing levels.
        - Still benefits from Rockstar, 2K, and Zynga portfolio breadth that Game Science lacks.
    notes: >-
      Multiples are simplified market-cap-to-sales lenses using public market data and reported revenue; they are
      directional rather than enterprise-value precision measures.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of five public gaming comparables with May 2026 market data and most recent reported annual or TTM
        revenue.
    claimRefs:
      - CV028
      - CV032
      - CV036
      - CV039
      - CV041
      - CV044
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold or event
      - transmission to thesis
      - action implication
    rows:
      - - Net receipts disappoint
        - Private diligence shows materially less than ~70% gross-to-net retention or materially lower ASP realization.
        - The fair-value bridge falls below unicorn support quickly.
        - Reset valuation downward and avoid premium entry.
      - - No credible follow-on slate
        - No funded DLC, Zhong Kui, or second Black Myth monetization plan within the next 12-18 months.
        - The market must treat Wukong as a harvested one-off rather than a franchise platform.
        - Move toward the bear range.
      - - Cap table is investor-unfriendly
        - >-
          Preferences, governance rights, or employee-platform economics make common-equity value materially worse than
          the headline mark.
        - Headline valuation becomes a poor guide to new-money economics.
        - Require a lower entry or pass.
      - - Licensing optionality is economically thin
        - Merch and partnerships create large retail GMV but very low royalty take-rates to Game Science.
        - Bull-case optionality shrinks toward noise.
        - Strip merch upside out of valuation.
      - - Pipeline execution slips
        - Sequel or spinout timing slips enough that cash-flow continuity breaks.
        - Public comp support weakens because recurrence remains unproven.
        - Keep only a watchlist position, not an underwritten entry.
    notes: >-
      These are valuation triggers, not product-review opinions; each would change what a buyer is actually purchasing
      at the same price.
    claimRefs:
      - CV023
      - CV025
      - CV047
      - CV052
      - CV053
      - CV055
      - CV056
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Post-launch mark
        - Disclosed price for Tencent's stake increase or any later transfer.
        - Separates inferred value from actual investor-clearing price.
        - Company counsel, cap table, share transfer register.
      - - Gross-to-net bridge
        - Platform fees, refunds, taxes, royalties, and true net revenue by platform and geography.
        - Turns unit success into economic value instead of gross-sales theater.
        - Finance team P&L bridge and platform statements.
      - - Franchise roadmap
        - DLC, Zhong Kui, and next-title milestone calendar with budgeted spend.
        - Determines whether investors are buying a one-hit studio or a repeatable franchise owner.
        - Product roadmap review and milestone dashboard.
      - - Cap table and rights
        - Fully diluted ownership, preferences, vetoes, and employee platforms.
        - Can make headline valuation diverge sharply from common-equity value.
        - Legal diligence on SHA, bylaws, and option plan.
      - - Licensing monetization
        - Royalty rates and recognized revenue from merch, events, and co-branding.
        - Bull-case optionality cannot be underwritten from retail GMV alone.
        - Commercial contracts and revenue-recognition schedule.
    notes: >-
      These asks focus on the missing information that most directly changes entry price discipline, not on general
      company trivia.
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV053
      - CV055
