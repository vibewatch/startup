      - number: '3.3'
        title: Publisher scale, awards, and review proof still favor larger franchises and platform owners
        blocks:
          - type: paragraph
            body: >-
              The most important adverse evidence is not that Black Myth failed to find demand; it clearly did. The
              adverse evidence is that the comparison set combines demand with stronger institutional support. God of
              War Ragnarök’s PlayStation page alone ties the title to more than 15 million sell-through and multiple The
              Game Awards wins, while Elden Ring carries a 94 Metacritic score and a larger Steam recommendation base
              than Black Myth. Dragon’s Dogma 2 is supported by an IP-driven Capcom machine and has already pushed the
              series above 10 million cumulative units. Sony’s market capitalization dwarfs every other name in this
              chapter, which matters because Sony can reinforce first-party and partner titles with hardware placement,
              storefront power, and publishing support. Even smaller public peers such as Capcom, CD Projekt, and Shift
              Up still disclose scale in ways Game Science does not. That improves investor confidence, lowers
              uncertainty around sequel funding, and gives those firms more ways to defend a franchise after launch.
              Black Myth’s launch therefore proves Game Science can create a global premium hit, but it does not erase
              the advantage that deeper catalogs, broader disclosure, and bigger publisher ecosystems give the
              incumbents.
