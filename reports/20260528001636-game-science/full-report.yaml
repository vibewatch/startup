      - number: '3.4'
        title: >-
          Black Myth’s moat is real but narrow: cultural distinctiveness is durable, single-franchise concentration is
          not
        blocks:
          - type: paragraph
            body: >-
              The durable part of Black Myth’s competitive position is easy to see. Very few premium AAA action games
              combine this level of production value with explicitly Chinese mythology, wuxia-adjacent martial
              presentation, and proof that global buyers will pay full price for it. That cultural-IP distinctiveness
              matters. The less durable part is everything around it. Public evidence does not yet show a broad
              multi-game Game Science portfolio, a disclosed long-term franchise slate, or the kind of platform ubiquity
              that Elden Ring and God of War Ragnarök enjoy. Review evidence is also strong but not category-defining:
              Black Myth and Stellar Blade both sit at 81 on Metacritic, while Elden Ring, God of War Ragnarök, and
              Dragon’s Dogma 2 score higher. Black Myth also faced early performance and design criticism in launch
              coverage, which matters because brand trust compounds over sequels and DLC, not just week-one excitement.
              Finally, Black Myth’s own success is creating the next threat. VGC’s reporting on Phantom Blade Zero
              suggests investors are willing to back more Chinese premium-action projects after Wukong. That means Game
              Science is not just fighting old incumbents; it may also have taught the market how to fund the next
              challenger. The practical diligence conclusion is that Black Myth’s moat is strongest at the IP layer and
              weakest at franchise depth, release-cadence visibility, and distribution power.
