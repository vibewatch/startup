              The public data are strong enough to justify deep diligence, but not to pay a large premium before net
              receipts, sequel timing, and cap-table economics are visible.
            calloutType: recommendation
            claimRefs:
              - CV050
              - CV051
              - CV056
          - type: callout
            title: Why the story is real
            body: >-
              Very few premium games hit 25-30 million units this fast, and Game Science appears to own publisher
              economics on the main storefronts.
            calloutType: strength
            claimRefs:
              - CV010
              - CV014
              - CV016
              - CV017
          - type: callout
            title: Why the discount stays large
            body: >-
              One title carries the value today, while follow-on release timing, licensing take-rates, and the actual
              price of Tencent's stake increase remain undisclosed.
            calloutType: risk
            claimRefs:
              - CV022
              - CV023
              - CV025
              - CV053
              - CV055
          - type: callout
            title: What makes $1.5B plausible
            body: >-
              The number works if investors capitalize harvested Wukong cash flow plus moderate franchise optionality,
              but it stops working quickly if the sequel path slips or realized net receipts disappoint.
            calloutType: assumption
            claimRefs:
              - CV047
              - CV048
              - CV049
              - CV051
