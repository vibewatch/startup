  rows:
  - - China-anchored premium buyers
    - Player / same / same
    - One-time premium ownership on PC or PS5 with strong cultural familiarity and local language fit
    - 80 Level reports roughly 70% of players were in China if 30% were outside
    - Core domestic demand base and likely the single largest country block
    - No public split by platform, city, or monetization tier
  - - Overseas premium buyers
    - Player / same / same
    - Cross-cultural premium action-RPG purchase driven by spectacle, reviews, and exported mythology
    - 80 Level says 30% of players were outside China; Steam has a very large non-English review base
    - Proves exportability and brand resonance beyond home market
    - No country-by-country overseas mix or CAC disclosure
  - - Steam-first hardcore action-RPG owners
    - Player / same / same
    - PC purchase, benchmarking, high-volume reviewing, optional modding, and long-tail replay
    - 2.4 million all-time Steam peak and 1.2 million all-language Steam reviews
    - Biggest visible customer-proof surface and likely primary enthusiast cohort
    - No public conversion from wishlist or benchmark participation to paid copies
  - - PS5 mainstream premium owners
    - Player / same / same
    - Console purchase for a premium single-player action RPG
    - 212,260 PS ratings at 4.51/5 on the US store
    - Shows meaningful mainstream console demand outside the PC enthusiast core
    - No public PS5 unit count or geography split
  - - Digital deluxe / DLC upgraders
    - Player / same / same
    - Buy $69.99 digital deluxe or later $9.99 upgrade for extras and soundtrack
    - Official Steam and PS surfaces list deluxe content and upgrade paths
    - Higher-ARPU collector-adjacent cohort without requiring live-service design
    - No attach rate, upsell revenue, or soundtrack conversion disclosure
  - - Mod/community-engaged PC users
    - Owner / same / same
    - Continue engaging through mods, discussions, and advocacy after purchase
    - Nexus Mods hosts a dedicated game page and Steam surfaces active discussions
    - Extends relevance and signals enthusiast stickiness beyond first completion
    - No public download, endorsement, or mod-user count
  notes: Segments are inferred from official store design, platform proof surfaces, review behavior, and geography reporting; Game Science does not publish a formal customer segmentation disclosure.
