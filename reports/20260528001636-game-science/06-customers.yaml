  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: platform-unit-mix
    missingEvidence: PC-versus-PS5 sell-through, net revenue, and geography split by platform for the base game and deluxe upgrade.
    whyItMatters: Without platform unit mix, investors cannot size Steam dependence, console diversification, or the true commercial weight of Xbox’s delayed launch.
    diligencePath: Request sell-through, gross-to-net revenue, and regional mix by platform for Steam, PS5, Xbox, and any Chinese PC stores such as WeGame.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU001
    - TU002
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Replay, chapter-completion, NG+, return-to-play, and patch-by-patch retention cohorts by platform and acquisition wave.
    whyItMatters: Steam decay suggests heavy launch normalization, but only internal cohorts can distinguish healthy premium-game completion from preventable churn.
    diligencePath: Request weekly and monthly active-user cohorts, chapter-completion funnels, replay rates, and reactivation after patches or awards spikes.
    relatedQuestionRefs:
    - QU022
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: deluxe-attach-and-refunds
    missingEvidence: Deluxe attach rate, soundtrack uptake, refund rate, support tickets, and refund reasons by platform and hardware tier.
    whyItMatters: Upsell economics and technical friction both feed customer value, but neither can be modeled from public store pages alone.
    diligencePath: Request deluxe/DLC attach, refund rates, refund causes, chargeback rate, and customer-support volumes broken out by store and patch period.
    relatedQuestionRefs:
    - QU025
    - QU026
    relatedTableRefs:
    - TU001
    - TU004
    - TU005
  - type: access-blocked
    severity: minor
    topic: steam-proprietary-analytics
    missingEvidence: Public owners, geography share, follower curves, and playtime distributions from services such as SteamSpy remain behind paid or special-access walls.
    whyItMatters: Those datasets could sharpen customer mix and conversion estimates, but the current public record stops short of a fully segmented platform view.
    diligencePath: Either license the paid analytics tools or request equivalent internal telemetry directly from management instead of reverse-engineering from public pages.
    relatedQuestionRefs:
    - QU023
    - QU026
    relatedTableRefs:
    - TU002
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: mod-community-scale
    missingEvidence: Download counts, active modders, endorsement totals, and post-launch mod adoption rates for the Nexus Mods community.
    whyItMatters: The existence of a mod page proves enthusiast afterlife, but not how large or durable that afterlife is in commercial terms.
    diligencePath: Request first-party telemetry on mod usage where available and pair it with direct Nexus community metrics or creator interviews.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU003
    - TU004
