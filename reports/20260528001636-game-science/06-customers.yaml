- id: geographic-mix-and-conversion-proxies
  title: Geographic mix and conversion proxies
  body: 'Public geography data is incomplete, but the retained set is still enough to make two defensible points. First, China is almost certainly the single biggest customer block. 80 Level reported Yang Qi saying 30% of players were outside China, which implies the majority were domestic Chinese buyers. Second, the customer base is not merely a China-only phenomenon. SCMP says Black Myth’s global popularity helped drive almost 21% overseas revenue growth for China-developed games, while Steam’s all-language review count dwarfs its English-language subset and official store surfaces support 15 languages, including Simplified and Traditional Chinese. The result is a customer mix that looks China-led but internationally meaningful, especially on PC. What public sources do not yet provide is the commercially crucial denominator: there is no clean split for PC versus PS5 units, no country-by-country breakdown inside the overseas 30%, and no disclosed conversion from benchmark users, wishlists,
    or review writers into paid owners by platform. That makes geography and conversion a genuine diligence gap, not a modeling detail to guess away.'
