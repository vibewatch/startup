company:
  name: Game Science
chapter:
  number: 6
  title: Customers
  summary: 'Black Myth: Wukong’s customer base is best understood as a premium single-title audience split across Steam-first PC owners, PS5 buyers, and a smaller deluxe/DLC upsell cohort, with the biggest public proof surface on Steam rather than console. Public customer proof is unusually strong for a private game studio—Steam alone shows 1.2 million all-language reviews and a 2.4 million all-time peak, while PlayStation shows 212,260 ratings at 4.51/5 and press reports 10 million copies in four days and 20 million-plus within weeks. The same evidence also shows customer risk: visible engagement has normalized sharply since launch, PC optimization complaints persisted after release, Xbox arrived a year later, and nearly all visible demand concentration sits in one breakout title.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'Game Science’s customer base here is not enterprise procurement; it is players who discover, buy, own, rate, and sometimes upgrade one premium action RPG. Official store surfaces show a straightforward premium structure rather than free-to-play or subscription monetization: the standard edition sits at $59.99, a digital deluxe edition adds cosmetic/equipment extras plus a soundtrack, and a later upgrade path lets standard buyers step up without rebuying the game. The most visible buyer split is platform-led. Steam concentrates the enthusiast PC audience, benchmarking activity, review volume, and modding surface. PlayStation captures a mainstream premium-console cohort with a far smaller but still very large rating base. Geography is less cleanly disclosed, but public reporting and language/review mix indicate the audience is bigger than China alone while still likely anchored in China and broader non-English demand. That creates four practical segments for diligence: China-anchored
    premium buyers, overseas premium buyers, Steam-first hardcore action-RPG owners, and higher-ARPU deluxe/DLC purchasers.'
