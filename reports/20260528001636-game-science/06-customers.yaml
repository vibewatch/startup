- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Digital deluxe and upgrade DLC
    - Attach rate is undisclosed
    - Upsell may lift ARPU, but investors cannot see how many standard owners convert
    - Request deluxe attach, soundtrack attach, and upgrade revenue by platform
  - - Steam-first breakout audience
    - PC platform dependence is high in visible customer proof
    - Steam dominates reviews, concurrency, and community evidence, increasing platform-policy exposure
    - Request PC vs PS5 gross and net sales, including fee structure and regional pricing effects
  - - Xbox launch one year later
    - Console TAM was constrained during the key launch window
    - Late Xbox support delayed access to a portion of the premium console market
    - Request lost-demand estimate and actual Xbox uptake after release
  - - Single breakout title
    - Visible customer concentration is effectively single-title concentration
    - All retained demand proof sits on one SKU and one monetization loop
    - Request sequel, expansion, or next-title wishlist and attach benchmarks
  - - Post-launch technical work
    - Performance friction can suppress long-tail play and recommendations
    - Compatibility mode, PC warnings, and forum complaints raise customer-experience risk
    - Request refund, crash, and support-ticket trends before and after major patches
  - - China-led but global audience
    - Geography mix by platform is missing
    - Domestic concentration and international expansion cannot be sized cleanly
    - Request country-level unit sales and revenue by platform, language, and store
  - - Community/mod afterlife
    - Modding interest may be real but commercially unpriced
    - A visible mod scene can extend relevance without showing monetization impact
    - Request mod download, creator, and retention data if tracked internally
  notes: Expansion here means either deeper monetization of existing owners or broadening platform/geographic reach. Every row combines a visible upside with a concentration or measurement risk.
