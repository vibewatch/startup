- id: adoption-scale-and-platform-proof
  title: Adoption scale and platform proof
  body: 'The strongest public adoption evidence is on PC. Steam’s store page shows 1.2 million all-language reviews, 872,536 Steam-purchaser reviews, and 92% recent positivity, while SteamCharts records a 2.4 million all-time concurrency peak. Those are exceptional public proof points for a premium single-player game. Pre-launch demand was also visible: PC Gamer says Black Myth hit the top of Steam’s wishlist charts by May 2024, and GamesRadar reported more than 60,000 users on its Steam feedback tool before release. Press then tied that pre-launch heat to commercial conversion. GamesRadar called it one of the fastest-selling games ever at 10 million copies in four days, then reported 20 million-plus copies across PC and PS5 by early October 2024. PlayStation is materially smaller in public visibility than Steam, but 212,260 ratings at 4.51/5 still show broad paid-owner engagement on console. The adoption story is therefore not hypothetical demand—it is a premium launch that converted pre-release
    hype into one of the most visible player bases of 2024.'
