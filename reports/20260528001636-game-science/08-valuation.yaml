  - FV003
- id: comp-lenses
  title: 'Comparable lenses: public publishers say a lot about the ceiling, but they also show why Game Science deserves a concentration discount'
  body: 'The named comp set cuts both ways. CD Projekt still trades at a premium multiple because investors are willing to pay for a proven premium-franchise studio with large back-catalog profitability, yet even there the business remains built around a small number of global IPs. Capcom, EA, Take-Two, and Shift Up show a more diversified pattern: they trade in roughly the 6x-8x sales band, but they also disclose revenue bases, pipeline depth, live-service mix, and concentration risks in a way Game Science has not. EA derived 71% of fiscal 2026 net revenue from live services and other revenue, while Take-Two explicitly warns investors about dependence on Grand Theft Auto, NBA 2K, and acceptable pricing levels. Those disclosures matter because they show that even scaled leaders admit hit concentration risk. Game Science today has one proven mega-hit, apparent self-publishing economics on PC and PlayStation, some merch optionality, and a Tencent strategic signal, but it still lacks the diversified
    revenue visibility that supports full public-company multiples. That is why a low-single-digit-billion valuation can be plausible, while a very high-single-digit comp transplant would be too generous.'
  claimRefs:
