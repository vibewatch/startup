- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Post-launch mark
    - Disclosed price for Tencent's stake increase or any later transfer.
    - Separates inferred value from actual investor-clearing price.
    - Company counsel, cap table, share transfer register.
  - - Gross-to-net bridge
    - Platform fees, refunds, taxes, royalties, and true net revenue by platform and geography.
    - Turns unit success into economic value instead of gross-sales theater.
    - Finance team P&L bridge and platform statements.
  - - Franchise roadmap
    - DLC, Zhong Kui, and next-title milestone calendar with budgeted spend.
    - Determines whether investors are buying a one-hit studio or a repeatable franchise owner.
    - Product roadmap review and milestone dashboard.
  - - Cap table and rights
    - Fully diluted ownership, preferences, vetoes, and employee platforms.
    - Can make headline valuation diverge sharply from common-equity value.
    - Legal diligence on SHA, bylaws, and option plan.
  - - Licensing monetization
    - Royalty rates and recognized revenue from merch, events, and co-branding.
    - Bull-case optionality cannot be underwritten from retail GMV alone.
    - Commercial contracts and revenue-recognition schedule.
  notes: These asks focus on the missing information that most directly changes entry price discipline, not on general company trivia.
