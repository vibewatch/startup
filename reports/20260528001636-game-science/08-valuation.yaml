- id: diligence-and-triggers
  title: 'Bull, base, and bear logic: fair today if franchisability is real, stretched if investors pay sequel-quality prices before sequel-quality evidence exists'
  body: 'The bear case is simple: Wukong remains mostly a harvested one-hit event, sequel timing slips, merchandising proves optically large but economically modest for the studio, and investors re-rate Game Science closer to a harvested-hit cashflow vehicle than a repeatable franchise owner. That points to a sub-$1.3 billion value. The base case gives management credit for 25-30 million unit sell-through, strategic validation from Tencent, self-publishing upside, and enough franchise probability to justify about $1.5 billion to $2.2 billion. The bull case starts only once an investor underwrites the Black Myth universe as a multi-title IP with repeatable launches, better visibility on licensing take-rates, and proof that follow-on releases can be funded and distributed without meaningfully diluting economics. That is where $3 billion-plus becomes possible. Until then, thesis-break triggers are straightforward: a weak follow-up roadmap, evidence that net receipts were much lower than modeled,
    or a privately disclosed cap table that makes the headline valuation less attractive to new money. The public evidence supports watching closely, not paying for certainty that has not yet been published.'
