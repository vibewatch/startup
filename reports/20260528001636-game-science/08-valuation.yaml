  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: priced post-launch financing mark
    missingEvidence: A disclosed financing round, secondary transaction, or audited fair-value mark showing what investors actually paid for Game Science after Wukong launched.
    whyItMatters: Without a priced mark, public discussion around unicorn or $1.5B+ status remains inference from sales rather than confirmation from capital markets.
    diligencePath: Request the latest shareholder register, any 2024-2026 secondary transfer documents, and board materials showing the implied price of Tencent or employee transactions.
    relatedQuestionRefs:
    - QV010
    - QV011
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: sequel and follow-on release timing
    missingEvidence: 'A development roadmap covering DLC, Black Myth: Zhong Kui milestones, expected launch windows, and capitalized development spend by project.'
    whyItMatters: The difference between a one-hit cash harvest and a durable franchise company is mostly a sequel-timing question, not a rear-view sales question.
    diligencePath: Request product roadmap reviews, milestone burn-down charts, and any greenlight memos covering Zhong Kui, DLC, and other Black Myth universe content.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: margin and cash-conversion quality
    missingEvidence: Gross margin, platform-fee take rates, tax treatment, royalty obligations, marketing spend, and free-cash-flow conversion for Wukong by platform and geography.
    whyItMatters: Public unit sales support scale, but valuation depends on how much of the consumer spend became durable cash earnings rather than one-off gross receipts.
    diligencePath: Request platform P&Ls, royalty schedules, tax filings, and a management bridge from gross consumer spend to net revenue, EBITDA, and operating cash flow.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap table and preference stack
    missingEvidence: Fully diluted ownership, employee platform economics, investor preferences, and any rights that could make headline valuation differ from common-equity value.
    whyItMatters: A headline $1.5B or $3B value can be misleading if liquidation preferences, earn-outs, or unusual governance rights materially change what new money is buying.
    diligencePath: Obtain the current cap table, shareholder agreements, employee platform documents, and all amendments tied to Tencent and Hero Games transfers.
    relatedQuestionRefs:
    - QV011
    - QV030
    relatedTableRefs:
    - TV006
