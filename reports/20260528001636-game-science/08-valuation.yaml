- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - core assumptions
  - valuation logic
  - value range (USD billions)
  - probability signal
  rows:
  - - Bear
    - Wukong remains mostly a harvested one-hit event; sequel timing slips; disclosed net receipts come in below public bridges.
    - Apply a one-title discount to harvested cash flows and limited optionality.
    - 0.7-1.3
    - Most likely if private diligence shows low take-rates, heavy taxes/royalties, or no near-term follow-on slate.
  - - Base
    - 25-30 million units hold, self-publishing economics are broadly intact, and Black Myth becomes a credible but not yet diversified franchise.
    - Support a public-evidence range modestly above unicorn level but below diversified public multiples.
    - 1.5-2.2
    - Fits the current evidence best because sales are real but recurrence is still assumed rather than disclosed.
  - - Bull
    - The Black Myth universe becomes repeatable, Zhong Kui or DLC monetizes well, and licensing margins prove meaningful.
    - Underwrite a durable premium-franchise path closer to the high end of hit-game public comps.
    - 2.8-4.0
    - Needs sequel visibility, higher-confidence cash conversion, and proof that Wukong was a platform not a one-off.
  notes: Scenario ranges are public-evidence underwriting guides, not discounted cash-flow outputs, and all scenarios retain a private-company opacity discount.
