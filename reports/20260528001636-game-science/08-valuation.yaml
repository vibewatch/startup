- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric basis
  - multiple / value signal
  - relevance to Game Science
  - limitation
  rows:
  - - CD Projekt
    - May 2026 market cap and TTM revenue
    - ~22.0x sales on $6.39B market cap and $0.29B TTM revenue
    - Useful premium-franchise comp for a hit-driven studio with owned IP and large back-catalog economics.
    - Still far more disclosed than Game Science and supported by multiple franchises and public reporting.
  - - Capcom
    - May 2026 market cap and TTM revenue
    - ~8.1x sales on $8.31B market cap and ~$1.03B TTM revenue
    - Useful diversified premium-publisher lens with strong catalog monetization and global IP breadth.
    - Capcom has much broader catalog depth and annual release cadence than Game Science.
  - - SHIFT UP
    - March 2026 market cap versus 2025 revenue
    - ~6.3x sales on KRW 1.87T market cap and KRW 294.5B revenue
    - Useful listed Asian single-hit / concentrated-IP lens with high margins and Tencent ownership.
    - SHIFT UP still has multiple monetization lines and fuller public disclosure than Game Science.
  - - Electronic Arts
    - May 2026 market cap and TTM revenue
    - ~6.9x sales on $50.32B market cap and $7.30B TTM revenue
    - Useful diversified benchmark for what public investors pay when recurrence and live services are visible.
    - EA's live-services mix and scale are far beyond anything publicly disclosed by Game Science.
  - - Take-Two
    - May 2026 market cap and revenue peer data
    - ~6.2x sales on ~$40.56B market cap and ~$6.55B revenue
    - Useful hit-driven publisher comp with explicit disclosures about concentration and acceptable pricing levels.
    - Still benefits from Rockstar, 2K, and Zynga portfolio breadth that Game Science lacks.
  notes: Multiples are simplified market-cap-to-sales lenses using public market data and reported revenue; they are directional rather than enterprise-value precision measures.
  enumerationScope:
    coverage: sample
    basis: Sample of five public gaming comparables with May 2026 market data and most recent reported annual or TTM revenue.
