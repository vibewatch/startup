company:
  name: Game Science
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence easily supports unicorn status and makes a post-launch ~$1.5B mark plausible on harvested Wukong cash flows, but it does not prove that investors should pay a large franchise premium. A fair public-evidence range is roughly $1.5B-$2.2B, while values above ~$3B need sequel success, licensing take-rate proof, and much better private disclosure. Recommendation: track / research-more with medium confidence and high concentration risk.'
sections:
- id: recommendation
  title: 'Recommendation: track the franchise, but do not mistake one huge launch for fully underwritten platform economics'
  body: 'Game Science has already crossed the threshold where dismissing it as a niche studio is no longer credible. Public sales evidence shows Black Myth: Wukong reached 10 million copies in roughly 83 hours, 20 million copies in its first month, and more than 25 million copies by January 2025, with later reporting pointing to 30 million copies in its first year. That scale alone corroborates unicorn status. The problem is not whether Wukong mattered; it is whether a private investor today is buying a durable multi-title franchise or simply harvesting an extraordinary first hit. Public comps suggest diversified game publishers can trade around 6x-8x sales, and CD Projekt can clear a higher premium when investors believe a hit-driven studio still owns repeatable franchise economics. Game Science has not yet disclosed the recurrence, margin, or governance data needed to claim similar quality with confidence. That makes the right posture track or research-more rather than buy: public evidence
    supports real value, but not a blind premium beyond the breakout title.'
  claimRefs:
  - CV004
  - CV008
  - CV010
  - CV014
  - CV018
  - CV044
  - CV050
  - CV051
  - CV056
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: unit-economics
  title: 'Unit-economics framing: the public evidence is strong enough to bridge to a unicorn, but not to a frictionless premium'
  body: 'The cleanest public bridge starts with price and geography. PlayStation shows a $59.99 US list price, while Reuters-sourced coverage in Bangkok Post puts mainland China and Hong Kong pricing around $38 and says overseas markets represented roughly one quarter of early sales. That yields a rough blended gross list price near $43.5 per copy. Applied to 25 million copies, public consumer spend reaches about $1.09 billion before platform fees, and a simple 70% publisher-retention assumption implies roughly $0.76 billion of net receipts. If the title ultimately reaches 30 million copies, the same bridge climbs to about $1.31 billion gross and roughly $0.91 billion net. On that math, a $1.5 billion valuation is not absurd: it equals roughly 2.0x the 25 million-unit net-receipt bridge or about 1.6x the 30 million-unit bridge. The catch is that these are harvested hit-title economics, not audited recurring revenue, and the exact platform mix, tax burden, royalty burden, and free-cash conversion
    remain undisclosed. The public bridge supports unicorn status, but it does not erase execution or opacity discounts.'
  claimRefs:
  - CV002
  - CV003
  - CV010
  - CV011
  - CV045
  - CV046
  - CV047
  - CV048
  - CV049
  - CV050
