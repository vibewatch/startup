tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - current view
  - why it lands here
  - what changes the call
  rows:
  - - Recommendation
    - track / research-more
    - Public evidence supports real scale but not enough recurrence or disclosure quality to underwrite an aggressive premium today.
    - Receive a priced financing mark plus audited-like KPI disclosure.
  - - Confidence
    - medium
    - Sales and comp evidence are strong, but margin, cap-table, and royalty disclosure remain private.
    - Add platform P&Ls, tax, and cash-conversion data.
  - - Risk rating
    - high
    - One title drives the case, and even public gaming leaders warn that hit concentration and pricing power can break quickly.
    - Show a second monetizable release path and stable franchise roadmap.
  - - Valuation stance
    - $1.5B looks fair-to-stretched
    - That range is plausible on harvested Wukong cash flows but not obviously cheap once opacity and sequel risk are discounted.
    - A lower entry, better disclosure, or faster follow-on franchise proof would improve it.
  - - Best public-evidence range
    - $1.5B-$2.2B
    - This range gives credit for 25-30 million units, self-publishing economics, and some franchise optionality without paying full public-comp multiples.
    - A stronger second-title roadmap can support more; weaker cash conversion supports less.
  - - Red-zone valuation
    - '>$3B before follow-on proof'
    - That requires underwriting repeat-hit capability, licensing take-rates, and durable pipeline economics.
    - Only pay this after sequel-quality evidence exists.
  notes: This table frames entry discipline from public evidence only; it is not a substitute for a private data-room valuation model.
