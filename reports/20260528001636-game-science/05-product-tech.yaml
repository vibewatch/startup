tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Base game campaign
    - Console and PC players
    - Released on PC/PS5; later shipped on Xbox
    - Chinese-mythology setting plus spectacle-heavy boss combat and transformation buildcraft
    - Need deeper telemetry on completion, retention after credits, and chapter-by-chapter drop-off
  - - Standalone Benchmark Tool
    - PC buyers and support teams
    - Released before launch; production utility
    - Lets users preflight hardware compatibility with a representative in-game render sequence
    - No comparable public tool exists for console buyers, so platform-fit transparency remains asymmetric
  - - Digital Deluxe / upgrade surface
    - Existing owners and upsell buyers
    - Live commerce add-on
    - Adds a higher-value SKU without changing the core design loop
    - Public channels do not show a substantive story-expansion SKU yet
  - - Challenge mode / Journeyer's Chart layer
    - Post-game and replay-focused players
    - Added post-launch
    - Extends replayability and navigation convenience without rebuilding the core campaign
    - Still not the same as a publicly scheduled DLC roadmap
  - - Unofficial modding layer
    - Power users and PC community
    - Community active, unsupported officially
    - Demonstrates demand for customization and fixes beyond the shipped build
    - No first-party mod tools, policy page, or official compatibility guarantee is public
  notes: This module view distinguishes the base game, support tooling, monetization add-ons, replayability layers, and the unofficial PC community surface rather than treating Black Myth as a single monolithic SKU.
