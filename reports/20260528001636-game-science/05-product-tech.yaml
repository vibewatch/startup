- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Implication
  - Gap
  rows:
  - - Official benchmark transparency
    - Public and shipped
    - PC pre-purchase and support flow
    - Game Science acknowledged hardware-fit risk early instead of hiding it
    - No equivalent first-party preflight surface exists for console players
  - - Launch-support guidance
    - Public and official
    - Launch-day tips plus links to graphics/crash FAQs
    - Shows the team expected non-trivial field issues and tried to route users toward fixes
    - Support detail pages are not richly indexed in a public documentation center
  - - Patch responsiveness
    - Demonstrated across 1.0.8, later major patches, and 2026 bug-fix update
    - Crashes, localization, UI, balance, and replayability features
    - Confirms the team kept shipping fixes and content after launch
    - Also confirms the backlog was large enough to require sustained repair work
  - - Critical review quality
    - Strong but not elite
    - IGN, Metacritic, OpenCritic, Epic/OpenCritic embed
    - Public verdict supports a credible premium product with artistic strength
    - Consensus repeatedly flags technical problems and weaker exploration depth
  - - Community-reported stability signal
    - Still active in 2026
    - Steam discussions and post-patch troubleshooting threads
    - Problems are not merely launch-week folklore; they remain part of the live support burden
    - Community evidence is noisy and lacks vendor-grade reproducibility data
  - - Localization and accessibility breadth
    - Meaningful but imperfect
    - 15+ store languages, later subtitle/lyrics/voice fixes, PS5 accessibility flag
    - Broad international reach is real and got better post-launch
    - Repeated patch notes show localization quality needed iteration, not just expansion
  notes: 'This table treats “trust” as player-facing product quality for a premium offline title: preflight transparency, patch discipline, localization breadth, and visible support behavior rather than SaaS-style compliance badges.'
