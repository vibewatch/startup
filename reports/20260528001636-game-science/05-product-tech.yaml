- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - UE5 runtime + DX12 rendering
    - Core simulation, lighting, asset streaming, and visual presentation
    - Unreal Engine 5 feature maturity and platform-specific implementation
    - Engine ambition lifts quality but also concentrates vendor and optimization risk
  - - Nanite / Lumen / editor workflow
    - High-fidelity environments and faster iteration for art and lighting teams
    - UE5 content-pipeline features and workstation/editor stability
    - Improved production speed does not automatically remove run-time performance pressure
  - - VHM snow + hair / foliage systems
    - Signature environmental and character-detail effects
    - Experimental and high-cost rendering subsystems
    - Effect ambition can surface bugs, crashes, and tuning work on specific platforms or scenes
  - - Upscaling / frame-generation layer
    - Makes high-end rendering modes more playable on commodity hardware
    - DLSS, FSR, XeSS, TSR, driver quality, and vendor-specific performance behavior
    - Upscaler bugs or poor defaults can directly damage first impressions and patch backlog
  - - Benchmark / support layer
    - Turns hardware-fit uncertainty into a visible preflight step
    - Benchmark-tool maintenance, FAQ links, support guidance, and platform messaging
    - Tool-side bugs or benchmark-to-game mismatch can erode trust instead of building it
  - - Storefront / certification / DRM layer
    - Packages and delivers SKUs across Steam, Epic, PlayStation, Xbox, and Denuvo-protected PC builds
    - Platform certification, storefront metadata, cloud/save features, and third-party DRM
    - Platform timing and certification constraints can delay parity or create user-friction tradeoffs
  notes: This architecture table mixes runtime technology, production tooling, and delivery infrastructure because Black Myth’s actual user experience is shaped by all three layers, not by engine code alone.
