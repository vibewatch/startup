- id: roadmap-and-tech-debt
  title: Roadmap, Sequel Signals & Technical Risk
  body: |-
    The public roadmap is more visible through execution artifacts than through formal roadmap prose. Game Science showed the benchmark tool before launch, shipped PS5/PC first, spent months on bug-fix and quality patches, then brought the game to Xbox later. Official storefronts now show Xbox as shipped, but that does not erase the execution signal: Game Science itself said Xbox missed simultaneous release because the team was still optimizing Series X|S to hit quality standards, and later technical reporting says the delivered Xbox result still involved screen tearing and reduced visual quality—especially on Series S. For diligence purposes, that is the clearest evidence that Black Myth’s technology ambition can outrun platform-porting ease.

    Post-launch content expansion has been real but bounded. Challenge mode, Journeyer’s Chart, soundtrack-library functions, and seasonal gear rewards show continuing product investment, yet public channels still do not show a dated DLC roadmap. Sequel/series continuation signals exist through industry-coverage surfaces that reference Black Myth: Zhong Kui and suggest Wukong’s story may continue, but those are still not the same as an official schedule. The result is a familiar AAA risk profile: Game Science has proven it can ship and support a premium action RPG, but the company still looks dependent on engine maturity, storefront/platform certification, and ongoing optimization work. The upside is clear product ambition; the risk is that the next content beat or platform expansion again exposes the same rendering and QA bottlenecks.
