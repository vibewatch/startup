  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: internal-production-pipeline
    missingEvidence: A current official breakdown of motion-capture vendors, animation pipeline partners, localization vendors, and any proprietary internal tooling beyond the high-level UE5 interview.
    whyItMatters: Without that detail, it is hard to separate repeatable internal capability from outsourced execution or partner dependence for future titles.
    diligencePath: Request a postmortem-style production overview covering mocap, facial/animation tools, localization workflow, asset-review tooling, and external vendor share by chapter/cutscene volume.
    relatedQuestionRefs:
    - QE010
  - type: missing-source
    severity: material
    topic: official-roadmap-transparency
    missingEvidence: An official dated roadmap that spells out future platform optimization milestones, patch priorities, or feature releases after the currently visible store-and-patch trail.
    whyItMatters: Execution history already shows that platform timing and optimization work can slip; without a roadmap, outside investors cannot gauge sequencing risk for the next content beat.
    diligencePath: Request internal roadmap snapshots for platform maintenance, feature backlog, and post-launch support ownership, with explicit milestones and gating risks.
    relatedQuestionRefs:
    - QE021
  - type: missing-source
    severity: material
    topic: story-dlc-roadmap
    missingEvidence: 'A first-party statement on whether Black Myth: Wukong will receive paid story DLC, free expansions, or only replayability/QoL updates before the next series entry.'
    whyItMatters: Post-launch content strategy affects revenue upside, team allocation, and whether the current code/content base will be meaningfully extended or only maintained.
    diligencePath: 'Ask management for post-launch P&L expectations by category: bug-fix support, content expansion, sequel preproduction, and any monetizable add-on pipeline.'
    relatedQuestionRefs:
    - QE022
