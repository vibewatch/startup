- id: platform-quality-and-live-ops
  title: Platform Quality, Benchmarks & Live-Ops
  body: |-
    Product quality evidence is strong but not clean. On the upside, critic and player reception cluster around an above-average result: IGN’s 8/10, a Metacritic 81, OpenCritic’s low-80s consensus, and extremely positive Steam user reviews all support the view that Game Science shipped a commercially and critically successful first AAA outing. Benchmark coverage and store surfaces also show unusually high player interest in whether the game can run acceptably, which is why the benchmark tool became part of the product itself. That is a positive maturity signal, but it is also an admission that the visuals push the hardware envelope hard enough to require preflight testing.

    The downside is that the patch trail reads like a real technical-debt ledger. Patch 1.0.8 fixed FSR startup crashes, a full-ray-tracing crash, combat bugs, quest/UI defects, and multilingual text problems. Later patch histories add memory-leak fixes, low-end optimization, DLSS/XeSS crash fixes, challenge-mode features, and more localization repair. January 2026 coverage shows Game Science was still fixing super-resolution behavior, chart UI tearing on PS5, and other defects. Community threads in 2026 still cite post-patch frame drops, shader compilation failures, launch instability, and hardware-specific trouble. So the product-quality conclusion is not “broken game”; it is “excellent combat/art direction shipped on top of a still-active optimization and QA burden.”
