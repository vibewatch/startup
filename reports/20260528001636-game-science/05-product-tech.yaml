- id: FE001
  title: 'Black Myth: Wukong Product Architecture Map'
  type: stack
  layout: wide
  summary: The shipped product layers combine UE5 content production, vendor-specific rendering, platform packaging, and live patch support.
  data:
    layers:
    - label: Content & encounter layer
      detail: Boss fights, lore delivery, staff techniques, spells, transformations, and authored chapter progression.
      items:
      - Boss encounter scripting
      - Staff stance system
      - Spell / transformation loadout
      - Lore and character backstories
    - label: UE5 world-building layer
      detail: Nanite, Lumen, VHM snow, foliage, hair, and editor-side iteration improvements that shape asset fidelity.
      items:
      - Nanite geometry density
      - Lumen lighting
      - Virtual Heightfield Mesh snow
      - Hair / vegetation systems
    - label: Runtime graphics layer
      detail: DX12 rendering plus multiple upscalers, frame generation, and optional full ray tracing/path tracing for PC.
      items:
      - DLSS
      - FSR
      - XeSS
      - TSR / Frame Generation
    - label: Platform delivery layer
      detail: Storefront packaging, platform features, DRM, certifications, and console-specific capability surfaces.
      items:
      - Steam / Epic PC delivery
      - PS5 feature set
      - Xbox Series X|S release
      - Denuvo on PC
    - label: Support & live-ops layer
      detail: Benchmark tool, official troubleshooting posts, patch notes, and ongoing community issue handling.
      items:
      - Standalone benchmark tool
      - Patch note cadence
      - Launch-support FAQs
      - Community troubleshooting
