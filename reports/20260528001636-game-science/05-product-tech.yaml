- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - Game Science solution
  - Measurable benefit
  - Limitation
  rows:
  - - Check whether a PC can run the game
    - Search forums, guess specs, risk a refund
    - Run the official benchmark tool before purchase or install
    - Reduces uncertainty for a notoriously demanding UE5 title
    - Benchmark-tool confidence still does not guarantee a stutter-free live play session
  - - Install and start on launch day
    - Preload, unlock at launch, troubleshoot crashes manually
    - Preload on supported launch platforms plus official launch-tips and FAQ links
    - Smooths day-one acquisition and directs users toward official fixes quickly
    - Support detail pages are still relatively opaque from public scraping and the burden stays on the player
  - - Progress through combat-heavy chapters
    - Learn boss patterns, tune stances and abilities, retry encounters
    - Staff techniques, spells, transformations, equipment, and boss-focused pacing
    - Creates a distinctive mastery loop that critics and users both highlight
    - Exploration depth and level readability receive weaker external marks than combat
  - - Tune settings for acceptable visual/performance tradeoffs
    - Experiment with presets, upscalers, RT, and frame generation
    - Multiple upscalers, granular settings, benchmark tool, and vendor guidance
    - Lets high-end users chase visual spectacle while mid-range users fall back to High/Medium presets
    - The best-looking modes are expensive enough that many users still need compromise
  - - Re-engage after finishing the story
    - Return only for NG+ or community challenges
    - Challenge mode, gauntlets, charts, soundtrack features, mods, and patch-driven returns
    - Adds replay hooks without requiring a full DLC campaign
    - Public evidence still favors replayability additions over a story-expansion plan
  notes: The “measurable benefit” column captures evidence-backed workflow improvements such as reduced compatibility uncertainty, broader tuning flexibility, and clearer replay hooks; it is not a promise of audited ROI.
