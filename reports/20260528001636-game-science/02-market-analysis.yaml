    - Cross-border demand for premium Chinese cultural IP
  - - Content ecosystem
    - Creators, streamers, guide makers, and community sites
    - Prospective and existing players
    - Attention and advocacy rather than direct purchase
    - Marketing attention economy
    - Breakout conversation, discovery, and long-tail community retention
