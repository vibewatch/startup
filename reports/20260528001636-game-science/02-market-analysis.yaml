  - - PlayStation 5 premium player
    - Individual console player
    - Player
    - Direct purchase through PlayStation Store; optional access via Premium cloud tier
    - Household discretionary spend plus subscription budget
    - Story-driven single-player demand inside the PS5 ecosystem
  - - Platform storefronts
    - Valve and Sony as channel owners
    - Not the end user
