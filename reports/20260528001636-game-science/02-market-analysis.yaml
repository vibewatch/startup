chapter:
  number: 2
  title: Market Analysis
  summary: Game Science's underwriteable market is not the whole games industry but the narrower intersection of premium single-player PC and console action RPGs, Chinese premium game export, and platform-mediated publishing economics. Public evidence supports strong global demand for premium action RPGs and rising Chinese export capability, but exact SAM or SOM remains obscured by mixed market definitions, gatekept licensing, platform fees, and hit-driven development risk.
sections:
- id: market-boundary
  title: Market boundary and included spend
  body: 'Game Science should not be underwritten against the whole global games market. The practical market boundary is the set of premium single-player action RPG purchases that can flow through Steam and PlayStation storefronts, plus the adjacent export opportunity for Chinese-developed premium games that can win global attention. Black Myth: Wukong is explicitly sold as an action RPG rooted in Chinese mythology, as a one-player PS5 title with offline play, and as a premium purchase rather than a free-to-play service. That immediately excludes large pools of spend such as mobile gacha, ad-funded games, and subscription consumption that never converts into unit sales for Game Science. The outer market backdrop still matters: Newzoo projects the global PC and console market at $103.7 billion by 2028, with 2025 marking the first notable growth year since the pandemic. But the most relevant part of that backdrop is premium demand within PC and console, not all gaming. Newzoo''s evidence that
    premium PC sales reached $12.5 billion in 2025, grew 11.8% year over year, and that premium titles make up roughly half of console revenue is much closer to the economic pool Game Science can actually access.'
