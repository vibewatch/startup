- id: TM005
  title: Premium action RPG / publishing comparables
  columns:
  - franchise/title
  - publisher
  - public scale signal
  - platform/economics signal
  - implication
  rows:
  - - Elden Ring
    - Bandai Namco / FromSoftware
    - 30M base-game units; 10M DLC units; 5M Nightreign units
    - Steam peak near 1M at launch per GameWatcher; multi-format brand expansion
    - Soulslike adjacency is commercially deep enough to support sequels, DLC, and spin-offs
  - - Monster Hunter
    - Capcom
    - World 29.6M units; Rise 18.6M units
    - Long-running action franchise with cross-platform premium sales
    - Action-heavy premium ecosystems can sustain blockbuster scale outside shooters and sports
  - - The Witcher / Cyberpunk
    - CD PROJEKT
    - '>85M Witcher trilogy; >35M Cyberpunk 2077'
    - 97% export and 87% digital sales mix in fact sheet
    - Global premium RPG economics increasingly skew toward export and digital distribution
  - - 'Black Myth: Wukong'
    - Game Science
    - ~$835.5M estimated Steam gross revenue; 27.3-hour average playtime; China share fell from 80% to 76%
    - Steam + PS5 premium distribution with localization and deluxe upsell
    - Chinese premium single-player exports can break out globally, but the revenue base is still materially China-weighted
  notes: Comparable rows mix official unit sales with third-party platform analytics. The table is intended as proof-of-demand and publishing-economics context, not as a normalized market-share model.
