- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Premium PC reacceleration
    - up
    - current
    - Premium PC spending is growing again, improving the backdrop for high-quality single-player launches
    - Request platform-level sell-through benchmarks by price band and genre
  - - Chinese premium export proof
    - up
    - current
    - Black Myth and Tencent international results show Chinese publishers can monetize globally
    - Request Game Science regional sell-through and attach-rate data by platform
  - - Digital console scale
    - up
    - current
    - Large PSN MAUs and high digital mix expand the reachable console audience for premium releases
    - Request PS5 versus PC sales mix and net receipts
  - - Cultural export / localization
    - up
    - current
    - Mythology-led differentiation plus multi-language support can widen addressable demand beyond China
    - Request conversion by language region and storefront
  - - Cloud and subscription access
    - up
    - 12-24 months
    - Alternative access routes may broaden discovery without changing the core premium model
    - Request whether streaming or subscriptions are meaningful for long-tail monetization
  - - Hit-driven economics
    - down
    - current
    - Premium categories remain concentrated in titles that achieve breakout relevance
    - Request scenario analysis for base-hit-miss outcomes
  - - Platform fees
    - down
    - current
    - Storefront cuts materially reduce publisher net revenue even before marketing and tax
    - Request net revenue by channel after platform take rates
  - - China approvals and content rules
    - down
    - current and recurring
    - Licensing, partner requirements, and censorship rules can delay launches or require content changes
    - Request China-specific build strategy and approval history
  - - Certification and release process
    - down
    - current
    - Console certification adds submission, review, and resubmission overhead before retail launch
    - Request historical certification cycle times and defect rates
  - - FX, geopolitical, and piracy risk
    - down
    - current
    - Cross-border publishers face currency swings, geopolitical shocks, and ongoing infringement pressure
    - Request hedging policy, region mix, and anti-piracy enforcement plan
  notes: Valuation should focus on conversion from gross demand into net publisher economics after platform fees, approvals, certification, FX, and hit-driven variance are applied.
