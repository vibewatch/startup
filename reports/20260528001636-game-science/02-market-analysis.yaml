  evidenceGaps:
  - type: missing-source
    severity: material
    topic: china-premium-pc-console-sam
    missingEvidence: A standalone 2026 dataset for paid premium PC and console revenue in China, separated from mobile and free-to-play spend.
    whyItMatters: Without this cut, the chapter can frame China's scale but cannot isolate the part of the domestic market that actually resembles Black Myth's monetization model.
    diligencePath: Request paid Newzoo or Niko custom cuts, or obtain first-party sell-through data from Sony, Valve, or Game Science by country and platform.
    relatedQuestionRefs:
    - QM005
    - QM025
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: material
    topic: soulslike-subsegment-size
    missingEvidence: A consistent public dataset that enumerates soulslike or premium action-RPG revenue and units across PC and console.
    whyItMatters: Comparable franchise sales prove demand, but they do not create a clean denominator for underwriting Game Science's adjacent subsegment share.
    diligencePath: Build a peer set from publisher sell-through disclosures and third-party charts, then normalize by platform and title age.
    relatedQuestionRefs:
    - QM007
    - QM025
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: game-science-platform-region-mix
    missingEvidence: Game Science's own sell-through, net revenue, and user mix by Steam versus PlayStation and by China versus overseas regions.
    whyItMatters: The chapter can prove demand and distribution routes, but not the company's realized mix, margins, or dependence on any one platform or geography.
    diligencePath: Request platform settlement reports, regional sales dashboards, and post-launch cohort retention by storefront.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
    - TM005
  - type: missing-source
    severity: minor
    topic: platform-fees-and-certification-across-all-platforms
    missingEvidence: Public PlayStation and Xbox fee schedules plus comparable certification SLAs across all major premium-console channels.
    whyItMatters: Steam's fee structure is publicized, but cross-platform net-revenue and launch-timing assumptions remain approximate without equivalent disclosures from other channels.
    diligencePath: Collect direct platform agreements or partner-manager confirmations for net take rates, certification failure rates, and average review times.
    relatedQuestionRefs:
    - QM018
    - QM020
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: material
    topic: non-additive-market-lenses
    missingEvidence: A harmonized methodology that bridges global PC/console market size, premium layers, China export revenue, and Game Science-specific regional sell-through.
    whyItMatters: Current public figures are directionally useful but not additive, so a false sense of precision would distort valuation and SAM assumptions.
    diligencePath: Create a bottoms-up model using Game Science sell-through, platform fee schedules, regional mix, and a comparable-title benchmark set.
    relatedQuestionRefs:
    - QM002
    - QM025
    relatedTableRefs:
    - TM002
