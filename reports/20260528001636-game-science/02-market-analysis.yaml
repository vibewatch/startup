- id: drivers-constraints-and-gaps
  title: Growth drivers, constraints, and valuation-relevant gaps
  body: 'The chapter''s positive demand signals are clear. BCG finds that gamers are still increasing time spent, premium PC demand has reaccelerated, cloud access is widening, and Chinese premium games can now plausibly travel globally rather than staying domestic-only. Those conditions help explain why investors increasingly believe China can produce globally competitive premium AAA titles. But the constraints are just as material. BCG also says game prices affect purchase choices for more than three quarters of respondents and that AAA development costs can reach $300 million, which reinforces the hit-driven nature of the category. Platform fees remain meaningful, certification adds process overhead, Chinese approvals and content rules can delay or reshape distribution, and the European Commission still flags software piracy and cheat-software ecosystems as active risks. Public filings from Take-Two, Ubisoft, and Tencent add another layer: large publishers explicitly warn about market
    acceptance, hit-title dependence, foreign exchange, and geopolitical exposure. The result is a market that is attractive but operationally unforgiving. Game Science benefits from strong category pull and a demonstrated export breakout, yet no public dataset cleanly isolates the company''s own SAM, platform mix, or region mix, so valuation should rely on constrained lenses and diligence asks rather than one headline TAM.'
