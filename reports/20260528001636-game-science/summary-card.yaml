  topStrengths:
    - >-
      Black Myth: Wukong achieved rare premium-game scale for a new IP, reaching 10 million units in three days and
      roughly 30 million in its first year.
    - >-
      Game Science combined differentiated Chinese mythology and AAA production values into a product that resonated
      globally across Steam and PS5.
    - >-
      Founder control plus strategic support from Hero and Tencent appears to preserve creative autonomy while leaving
      room to fund follow-on franchise bets.
    - >-
      Self-publishing evidence on major PC and console storefronts suggests Game Science can retain more upside than a
      heavily outsourced publishing model.
  topRisks:
    - >-
      Public demand is still concentrated in one breakout franchise, and a shelved DLC path raises the risk of a long
      monetization gap before the next title.
    - >-
      Audited revenue, margins, cash balance, headcount, and current cap-table terms remain too opaque for a clean
      underwriting case.
    - >-
      The studio depends on external platform gatekeepers, Chinese approval regimes, and geopolitically sensitive export
      conditions.
    - >-
      Founder-centric governance and rapid post-hit scaling create execution and talent-retention risk if the next
      project slips.
    - >-
      Technical-performance, localization, and reputation issues could weaken long-tail franchise durability outside the
      initial enthusiast audience.
  unresolvedGaps:
    - >-
      A disclosed priced financing round, tender, or audited fair-value mark showing what investors actually paid for
      Game Science after Wukong launched.
    - >-
      Audited or management-confirmed revenue, margin, cash, and free-cash-flow data separating gross consumer spend
      from studio net receipts.
    - 'Current headcount, development budget, and staffing plan for Black Myth: Zhong Kui or any other follow-on title.'
    - >-
      Exact overseas sales mix, platform mix, refund rate, and live engagement curve after the first-year sell-through
      burst.
    - >-
      The economic terms of Tencent's newer stake position, any investor preferences, and any governance rights that
      affect common-equity value.
