companyProfile:
  summary: >-
    Game Science is a privately held Chinese game developer founded in 2014 by Feng Ji and Yang Qi, two Tencent-era
    developers who built the studio around premium action games and ultimately broke out globally with Black Myth:
    Wukong. The company operates from a Shenzhen legal base with a Shenzhen/Hangzhou studio footprint and has evolved
    from early mobile titles into a founder-led AAA franchise studio whose public investment case rests heavily on one
    breakout premium title and its ability to turn that success into a durable multi-title platform.
  foundedDate: '2014-06-13'
  founders:
    - name: Feng Ji
      role: Founder and CEO
      background: Former Tencent-era game developer tied to Dou Zhan Shen/Asura before co-founding Game Science.
      claimRefs: [CO004, CO006]
    - name: Yang Qi
      role: Co-founder and creative lead
      background: Former Tencent-era developer tied to Dou Zhan Shen/Asura and the studio's public creative co-founder.
      claimRefs: [CO005, CO006, CO012]
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    Game Science develops premium AAA action RPGs rooted in Chinese mythology. Its flagship product, Black Myth:
    Wukong, is a premium single-player console/PC title sold on Steam, PlayStation, Epic Games Store, and regional PC
    channels, with future franchise expansion, merchandising, and sequel optionality still emerging.
  customerFocus: >-
    Premium action-RPG players on PC and console, especially Steam-first global buyers and PS5 owners, with China still
    important but overseas demand already material to the franchise's economics.
  businessModel: >-
    Premium unit sales of Black Myth: Wukong and future franchise titles, plus deluxe-edition upsell, possible DLC or
    sequel monetization, and longer-tail merchandise or licensing revenue if the Black Myth universe expands.
  stage: Private, post-launch franchise scale-up
  fundingStatus: >-
    Public evidence supports an early Hero Entertainment investment and a disclosed Tencent strategic stake of 5% by
    2021, but no fully corroborated post-launch priced financing round is publicly confirmed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO006, CO008, CO010, CO019, CO020, CO028, CO030, CV014]
summary:
  headline: >-
    Game Science proved with Black Myth: Wukong that a founder-led Chinese studio can ship a world-class premium hit,
    but single-franchise concentration, limited financial disclosure, and unclear sequel economics keep the investable
    posture at research-more rather than buy.
