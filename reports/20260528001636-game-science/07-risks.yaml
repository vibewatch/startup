chapter:
  order: 7
  number: 7
  title: Risks
  letter: R
  summary: Game Science’s risk profile is dominated by single-franchise concentration, external platform and regulatory control, people-and-governance transition risk, and unusually poor financial transparency for a studio now carrying blockbuster expectations. The largest thesis risk is not that Wukong was weak, but that its success raised sequel, DLC, platform, and valuation expectations faster than the company has disclosed a diversified pipeline, durable operating system, or auditable financial base.
sections:
- id: risk-overview
  title: Risk overview
  body: |-
    Game Science's risk stack is unusually concentrated for a studio with one of the biggest premium-game launches of the decade. Public sources show that Black Myth: Wukong became a historic hit, but the same evidence also shows how much of the company's current economic narrative still depends on one title, one franchise frame, and a narrow set of distribution and approval channels. The risk heatmap makes franchise concentration the defining issue: if the next monetizable release slips, the company moves from a success story into a gap story, with valuation marks and recruiting expectations still anchored to Wukong-scale outcomes.

    The next layer of risk is external control. China still subjects games to licensing and policy supervision; Steam and PlayStation both retain broad moderation, termination, and content-governance rights; and Hero Games and Tencent sit close enough to launch narrative and ownership that Game Science cannot be analyzed as a fully self-contained studio. That does not make the business fragile in the near term, but it does mean the downside is not only about game quality. Regulatory posture, creator-guideline backlash, platform policy, and partner behavior can all compress optionality before players ever judge a sequel.

    The chapter's adverse evidence therefore matters more than usual. The public record is not just a list of wins. It includes sexist-culture allegations, restrictive creator-guideline reporting, platform-port delays, limited valuation transparency, and unresolved rights-chain questions around a future Black Myth universe. None of those issues alone breaks the thesis, but together they explain why Game Science should be underwritten as a one-hit studio trying to become a portfolio company, not as a de-risked franchise machine.
