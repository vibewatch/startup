- id: execution-people-and-financial-opacity
  title: Execution, people, and financial opacity
  body: |-
    Game Science also faces the classic transition problem from an admired project team into an institution. PC Gamer's reporting shows how quickly the studio had to expand: a trailer built by a small team went viral, thousands of resumes arrived, and about 100 hires followed as the studio tried to catch up with the hype it accidentally created. That is an impressive recruiting story, but it also implies management span, process, and culture had to scale under maximum external pressure. Public sources do not disclose current headcount, attrition, or crunch controls, so investors cannot tell whether the studio successfully industrialized or simply outran early bottlenecks.

    Culture risk is not abstract. AP-linked and Fast Company reporting preserved a real controversy around sexist remarks and recruiting imagery associated with Game Science staff or leadership. Those reports also note that the screenshots were not independently verified by AP, which matters for nuance; this is not a final legal finding. But for diligence purposes, the issue still matters because employer brand, retention, and management credibility are path-dependent. A studio asking candidates to spend years chasing another phenomenon cannot afford even partially corroborated signals that leadership tolerates disrespectful behavior or dismisses criticism as politically irrelevant noise.

    Financial opacity compounds the people problem. Tencent's step-up from 5% ownership in 2021 to 24% in 2026, and Hero Games' exit, imply a major rise in enterprise value. Yet public reporting still gives only anecdotal marks and undisclosed prices, not audited revenue, margin, or burn data. That means investors can see the silhouette of value creation without seeing the balance-sheet quality behind it. The risk is not that the company is weak; the risk is that external observers will mistake hit-product revenue and secondary-transaction storytelling for a fully underwritten studio-level financial model.
