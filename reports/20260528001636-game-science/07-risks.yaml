  evidenceGaps:
  - type: missing-source
    severity: material
    topic: china-approval-chain
    missingEvidence: 'The exact NPPA ISBN filing, publishing entity, and operating entity for Black Myth: Wukong were not located in directly attributable public materials during this run.'
    whyItMatters: Exact domestic publication and operating entities would clarify how much legal and censorship exposure sits with Game Science versus affiliated publishers or operating partners.
    diligencePath: Request the domestic ISBN approval notice, publishing contract, and ICP / Internet Publishing Permit chain from management or China counsel.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: valuation-opacity
    missingEvidence: Current cap table, secondary transaction documents, audited revenue, margin, cash balance, burn, and board-approved valuation materials remain undisclosed.
    whyItMatters: Ownership anecdotes imply a major mark-up, but the absence of auditable company-level financials keeps valuation and downside analysis imprecise.
    diligencePath: Request the current cap table, shareholder agreements, latest audited or management accounts, and any 2024-2026 secondary or primary financing memos.
    relatedQuestionRefs:
    - QR021
    - QR030
  - type: private-evidence-only
    severity: material
    topic: people-retention
    missingEvidence: Public sources do not disclose current headcount, attrition, compensation competitiveness, crunch policies, grievance handling, or manager span-of-control metrics.
    whyItMatters: A studio moving from one hit to a portfolio strategy can fail through hidden people bottlenecks long before sales decline becomes visible.
    diligencePath: Request an HR pack with headcount by function, 24-month attrition, offer acceptance, compensation benchmarking, and formal conduct-policy / complaint-resolution data.
