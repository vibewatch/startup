- id: mitigations-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: |-
    The most realistic mitigation case is not that these risks disappear, but that Game Science learns to make them legible. The company already has three real advantages: a globally recognized franchise label, proven ability to ship a premium hit, and enough brand gravity to keep attracting talent and partners. If management can pair those strengths with disciplined portfolio planning, explicit rights-chain work, and cleaner communication norms, then many current risks can be downgraded from thesis-breakers to monitorable execution problems. The public record, however, does not yet show that operating system in detail.

    That is why the kill criteria in this chapter are concrete. If the next premium release path remains vague through 2029, if platform breadth stays narrow even after the Xbox catch-up, if new Chinese regulatory or censorship events directly constrain launch mechanics, or if culture and governance issues worsen instead of cooling, then Game Science stops looking like a compounding franchise studio and starts looking like a one-off masterpiece with a hard sequel problem. The investment implication would shift from price discipline to outright skepticism.

    The positive version of the thesis is still available. A clean domestic approval chain, auditable cap-table and operating data, a rights memo for the Black Myth universe, and a believable milestone plan for Zhong Kui or another follow-up would each remove a major layer of uncertainty. Until those are provided, this chapter should be read as an argument for caution: Game Science has already proven it can make one landmark game; it has not yet proven that it can repeatedly convert that cultural breakthrough into a durable, diversified studio model.
