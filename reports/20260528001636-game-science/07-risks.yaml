- calloutType: risk
  title: Valuation marks are anecdotes, not an audited model
  body: Tencent’s rising stake and Daniel Wu’s “billions of yuan” comment imply very large value creation, but public sources still do not provide audited company-level revenue, margin, burn, or board-rights detail. Investors should underwrite Game Science as financially opaque until the data room proves otherwise.
  claimRefs:
  - CR033
  - CR034
  - CR036
  - CR037
- calloutType: recommendation
  title: Priority data-room ask
  body: 'Ask first for five items: the China publishing / ISBN chain, the current cap table, rights-chain and trademark clearance for the Black Myth universe, people-retention and conduct data, and the post-Wukong milestone plan for Zhong Kui or alternative follow-up content. Those five artifacts would collapse most of the uncertainty surviving this chapter.'
  claimRefs:
  - CR050
