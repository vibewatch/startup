- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Current public signal
  - Action implication
  rows:
  - - Pipeline concentration
    - Time from Wukong peak to next monetizable premium release
    - No credible follow-up premium release path by 2029 or repeated milestone slippage
    - Public roadmap points to Zhong Kui, but timing remains vague and multi-year.
    - Treat as thesis-break territory unless management shows a funded, resourced release plan.
  - - Platform concentration
    - Share of commercial relevance still sitting on Steam plus PlayStation versus broader channels
    - Xbox remains de minimis in commercial mix after another full cycle, or a storefront enforcement event directly impairs visibility
    - Xbox eventually launched, but the initial concentration lasted a full year.
    - Escalate diligence on platform relations, channel economics, and store-account health.
  - - Regulatory / censorship shock
    - Named adverse action, delayed approvals, or new political-content controversy tied to launch marketing
    - A fresh China-policy flare-up, approval disruption, or partner-guideline scandal around the next title
    - 2024 already produced a creator-guideline controversy and China remains policy-driven.
    - Re-underwrite launch timing, international PR plan, and downside case for narrative backlash.
  - - People / culture deterioration
    - Senior departures, attrition spike, or conduct issue escalation
    - Evidence that senior creative or technical leaders are leaving, or that employer-brand damage is worsening
    - Public sources do not yet disclose retention data, so this remains a blind spot.
    - Require board-level oversight, HR reporting, and a clean succession and conduct package before conviction increases.
  - - Rights-chain / legal friction
    - Trademark objection, platform IP complaint, or delayed merch / sequel approvals
    - Any formal challenge tied to Black Myth naming, depictions, localized assets, or merchandising
    - Public legal commentary says public-domain status is not enough by itself.
    - Do not underwrite a broader universe without a rights memo and clearance workflow.
