summary:
  headline: 'Game Science 用 Black Myth: Wukong 证明，创始人主导的中国工作室也能交付世界级买断制爆款；但单一 IP 集中、财务披露有限、续作经济性不清，让可投资姿态只能停在继续研究，而不是买入。'
