- id: launch-traction-milestones
  title: Launch, Traction, and Milestones
  body: 'The milestone record is unusually strong for a private game studio because Black Myth: Wukong turned Game Science into a globally legible company. Public profile sources say the single-player project formally started in February 2018, and the August 2020 gameplay reveal became the studio''s breakout moment; Baidu says the Bilibili upload alone approached 50 million views. Release timing then became straightforward. Gematsu and PlayStation''s official game hub show the title launched on PS5 and PC on August 20, 2024, while Gematsu and Forbes show the Xbox release arrived exactly one year later, on August 20, 2025. Commercial traction moved almost immediately from breakthrough to category-defining. Gematsu relayed Game Science''s announcement of 10 million units sold in three days, then reported 18 million in two weeks from a Bloomberg interview with Hero Games. Push Square and PlayStation Universe both said a Tokyo Game Show presentation later put first-month sales at 20 million
    units. SteamCharts still records an all-time Steam peak of 2,406,967 concurrent players. Awards reinforced that commercial story: CGTN and Global Times say the game won Best Action Game and Players'' Voice at The Game Awards 2024, and China Daily reports that it also won Ultimate Game of the Year and Best Visual Design at the 42nd Golden Joystick Awards.'
