  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: An official financing announcement, filing, or investor confirmation for the reported February 2025 Series A and 10 billion yuan post-money valuation.
    whyItMatters: Without primary corroboration, valuation cannot be used as a cover fact or relied upon in later valuation work.
    diligencePath: Request the financing announcement, shareholder registry update, or investor-side confirmation from HongShan, Hillhouse, Tencent, 5Y, or management.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: total-raised
    missingEvidence: A complete financing chronology with round sizes, dates, investor mix, and any secondary sales or debt facilities.
    whyItMatters: Total capital raised is a core cover metric and materially changes how investors frame dilution, valuation, and runway.
    diligencePath: Ask management for a cap-table summary or investor presentation that enumerates every primary and secondary financing event.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: 'Verified revenue, run-rate, platform mix, and margin disclosure for Black Myth: Wukong and any other live commercial products.'
    whyItMatters: Commercial traction is visible from unit sales, but revenue economics drive valuation and sustainability.
    diligencePath: Request sell-through revenue by platform, net receipts after platform fees, and current cash conversion from management or investor materials.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A verified current employee count broken down by studio, function, and franchise staffing.
    whyItMatters: Headcount is necessary to judge production leverage, burn, and organizational depth beyond two visible founders.
    diligencePath: Request current org charts or HR headcount summaries and reconcile them to LinkedIn, registry, or payroll evidence.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
    - TO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, shareholder agreement summary, and any protective provisions or side letters for Hero and Tencent.
    whyItMatters: Ownership percentages alone do not reveal who can block financings, partnerships, or liquidity events.
    diligencePath: Obtain registry-certified governance documents or management summaries of board seats, reserved matters, and investor vetoes.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
