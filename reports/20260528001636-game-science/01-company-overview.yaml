- id: ownership-funding-disclosure
  title: Ownership, Funding History, and Disclosure Gaps
  body: 'The externally verifiable funding timeline is thinner than the franchise''s commercial visibility. The strongest public ownership milestone before launch is Hero Entertainment''s early backing: Baidu''s company profile says Game Science received angel financing from Hero in May 2017 and that Hero''s Tianjin vehicle later held roughly 19% of the company. The strongest third-party corroborated strategic-capital event is Tencent''s March 2021 minority investment. Yicai reported that Tencent''s stake rose to 5%, the smallest among shareholders, and explicitly said Tencent committed not to interfere with Game Science''s operations or decision-making; Game World Observer separately relayed the same 5% figure. Gematsu''s September 2024 reporting, citing a Bloomberg interview with Hero Games executive Daniel Wu, further described Hero Games as the biggest external shareholder in Game Science. What investors cannot yet underwrite cleanly from open evidence is the full capital stack. A public
    Baidu profile claims that Game Science completed a February 2025 Series A of several hundred million U.S. dollars at a 10 billion yuan post-money valuation with HongShan, Hillhouse, Tencent, and 5Y Capital participating, but no retained official announcement, filing, or top-tier finance story in this chapter independently corroborates that claim. Accordingly, the chapter treats valuation and total raised as unsupported cover metrics rather than hard facts.'
