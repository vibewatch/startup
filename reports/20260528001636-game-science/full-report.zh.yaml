              这意味着多数是中国国内买家。第二，客户基础不只是中国现象。SCMP 称，Black Myth 的全球热度帮助中国开发游戏的海外收入增长近 21%；Steam 全语言评价数远高于英文评价子集，官方商店页面支持 15
