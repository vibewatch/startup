      - number: '3.3'
        title: 发行商规模、奖项和评测证据仍更偏向大型系列和平台方
        blocks:
          - type: paragraph
            body: >-
              最重要的反向证据，不是 Black Myth 没有找到需求；它显然找到了。反向证据在于，可比集合把需求和更强的机构支持结合在一起。God of War Ragnarök 仅 PlayStation
              页面就把作品与超过 15 million 实销和多项 The Game Awards 奖项相连；Elden Ring 则有 94 的 Metacritic 分数，以及比 Black Myth 更大的 Steam
              推荐基数。Dragon’s Dogma 2 获得 IP 驱动的 Capcom 机器支持，并已把该系列累计销量推到 10 million 份以上。Sony 市值压倒本章所有其他名字，这很重要，因为 Sony
              能用硬件摆位、店面权力和发行支持，强化第一方及合作伙伴作品。即便 Capcom、CD Projekt 和 Shift Up 等较小公开同业，也能以 Game Science
              不具备的方式披露规模。这会提高投资人信心，降低续作融资不确定性，并给这些公司更多方式在上线后守住系列。 因此，Black Myth 的上线证明 Game Science
              能打造全球买断制爆款，但并没有抹掉更深目录、更广披露和更大发行生态给既有巨头带来的优势。
