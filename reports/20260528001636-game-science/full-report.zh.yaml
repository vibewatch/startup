      - - Elden Ring / FromSoftware + Bandai Namco 作品
        - 直接在位者
        - Steam PC 版 Metacritic 94 分；817,955 条 Steam 推荐
        - 横跨主机和 PC 的硬核高价动作 RPG 买家
        - Soulslike 标杆，覆盖 Xbox + PS5 + PC，系列信任强
        - 文化差异化弱于 Black Myth，且已经高度成熟
      - - God of War Ragnarök / Santa Monica Studio + Sony 作品
        - 直接在位者
        - PS4 和 PS5 合计销量 15M+ 份；Sony 支持发行
