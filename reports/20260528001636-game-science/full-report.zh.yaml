  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、既有巨头和替代竞争者都争夺同一批买断制动作玩家
        blocks:
          - type: paragraph
            body: >-
              Black Myth: Wukong 的直接同业集合，在高端买断制单人动作 RPG 顶部很清楚：Elden Ring、God of War Ragnarök、Dragon’s Dogma 2、Stellar
              Blade， 以及即将到来的 Phantom Blade Zero。每一款作品都向买家提出同一个核心问题：如果预算和时间里只有一个买断制动作游戏名额，哪款游戏最能把场面感、战斗质量、 平台访问和 30 到 80
              小时购买价值的信任组合起来？Black Myth 最强的差异化在文化和视觉层面，而非结构层面。中国神话框架、西游记定位和庞大发售验证，
              让它比另一款西式暗黑奇幻或第一方电影化续作更新鲜。但既有玩家仍掌握系列深度和分发优势。Elden Ring 覆盖 Xbox、PlayStation 和 PC；God of War Ragnarök 横跨
              PS4、PS5 和 PC，并带有 Sony 第一方信任；Dragon’s Dogma 2 背后是 Capcom 可复制的 IP 机器；Stellar Blade 把相似场面感和 Sony
              支持的发行结合起来；Phantom Blade Zero 则说明 Black Myth 已经吸引中国追随者。与此同时，Naraka 和 HoYoverse
              式长线运营习惯也构成替代品，因为它们能吸收时间和钱包份额，而且不要求玩家再预付 $60 到 $70。
