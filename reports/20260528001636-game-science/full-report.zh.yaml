  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的支出
        blocks:
          - type: paragraph
            body: >-
              不能拿整个全球游戏市场来给 Game Science 做投资假设。实际市场边界，是能从 Steam 和 PlayStation 店面流入的买断制单人动作 RPG
              购买需求，加上中国开发买断制游戏赢得全球关注的邻近出口机会。Black Myth: Wukong 明确是一款扎根中国神话的动作 RPG，是支持离线游玩的单人 PS5
              作品，也是买断制购买，而不是免费游玩服务。这马上排除了几大支出池：手游抽卡、广告驱动游戏、 以及永远不会转化为 Game Science 单份销量的订阅消费。外层市场背景仍然重要：Newzoo 预计全球 PC
              和主机市场到 2028 年达到 $103.7 billion， 2025 年会成为疫情后第一个显著增长年。但这个背景里最贴近的部分，是 PC 和主机内的买断制需求，不是全部游戏消费。Newzoo
              证据显示，2025 年买断制 PC 销售额达到 $12.5 billion，同比增长 11.8%，买断制作品约占主机收入一半；这更接近 Game Science 真正能触达的经济池。
