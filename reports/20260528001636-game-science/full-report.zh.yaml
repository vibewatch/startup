  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现模型和销售证据
        blocks:
          - type: paragraph
            body: >-
              最强的已验证财务事实，关乎变现形式和上线速度，而不是已确认收入。PlayStation、Steam 和 Epic 官方页面都把 Black Myth: Wukong 定位为买断制单人动作
              RPG；官方美国标价也一致，标准版为 $59.99，PC 店面可见的数字豪华版为 $69.99。Steam 元数据还显示 Game Science 在 Steam 上自行发行该作，PlayStation 则列
              Game Science 为发行商，支持其以自发行姿态上线，而不是已有全球披露的第三方发行协议。公开上线渠道证据同样强： Gematsu 和官方 Steam 新闻显示 PS5 与 PC
              是核心首发平台，WeGame 明确被纳入中国预载。销售里程碑随后从强劲变成非凡。多家媒体报道 Game Science 三天售出 10 million 份，Gematsu 后来引用两周 18 million
              份，WN Hub 引用 2025 年 1 月超过 25 million 份，KrASIA 称该游戏首年内突破 30 million
              份。记录中较弱的是组合。区域和平台拆分大多来自分析师和二手转述，但它们一致指向一个中国权重高、PC 权重高的首发；PS5 仍有实质增量，但不是主要驱动。
