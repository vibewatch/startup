      - number: '4.2'
        title: 毛额到净额机制与模型收入区间
        blocks:
          - type: paragraph
            body: >-
              本章的核心区分，是已验证的消费者支出锚点与模型化公司到手款。官方价格、单位销量里程碑和 Steam 阶梯经济账是真实观察；入账净收入没有公开。Valve 的 Steamworks
              条款显示，这种规模的作品应会很快越过 Steam 的 $10 million 和 $50 million 门槛，意味着 Steam 边际平台抽成很可能优于固定 30% 假设。Unreal
              的版税条款也重要，但影响并不均匀，因为许可排除了首个 $1 million 生命周期总收入， 并包含 Epic 商店特定豁免。因此，本章模型故意采用较宽的 60% 到 72%
              开发商到手区间，而不是假装知道确切净百分比。在混合总价大约 $56 到 $64 / 份的假设下，前三天很可能意味着约 $560 million 到 $640 million 的消费者支出，以及约 $336
              million 到 $461 million 的扣除运营成本前到手款。把同一框架延伸到两周、一个月、2025 年 1 月和首年里程碑，会得出很大的数字，但这些仍是中等置信情景，不是已验证财务报表。
              尽调里足够清楚的结论是：Wukong 看起来像一次爆款现金事件，但仍不是透明的上市公司式收入披露。
