            body: >-
              即便首发销量惊人，客户侧的反向图景仍然真实存在。SteamCharts 显示，月均玩家数从 2024 年 8 月的 970,442.70 跌到过去 30 天的 7,187.86；月度峰值并发从 2024 年 9
              月的 1,365,923 降到过去 30 天的 15,575。买断制单机游戏遇到这种衰减并不致命，但若没有内部队列数据，就不能把这门生意当成 服务型游戏式年金来估。更大的担忧是平台摩擦。PC Gamer 和
              GamesRadar 都提到技术问题，Game Science 自己也警示 PC 端偶发严重问题；GamesRadar 后来记录了为稳定性准备的兼容模式，Steam
              讨论帖显示，后续更新后回流玩家仍在抱怨卡顿和冻结。平台触达也被 Xbox 延后一年的上线压住。最后，所有留存客户证据仍围绕一个 SKU。在 Game Science 用续作、DLC
              或下一款产品证明同等公开需求能承接之前，可见的客户集中度本质上还是单一标题集中。
