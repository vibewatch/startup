      - - Genshin Impact / HoYoverse
        - 相邻替代品
        - 大型持续运营标杆；保留来源未量化其精确规模
        - 不买高价门票、但想要持续动作 RPG 养成的玩家
        - 持续运营习惯养成和内容节奏
        - 不是一一对应的高价盒装单机可比对象
      - - 'NARAKA: BLADEPOINT / NetEase'
        - 替代品 / 时间竞争者
        - 40M+ 玩家，可在 Steam 免费游玩
        - 比起高价单人叙事，更看重多人留存的动作玩家
        - 免费游玩的大逃杀循环降低切换成本
        - 对局模式不同，与 Black Myth 的剧情驱动重合更弱
    notes: 画像聚焦最可能吸收高价动作预算或时间的、买方关心的竞争类别， 而不是覆盖每一款全球动作游戏。
