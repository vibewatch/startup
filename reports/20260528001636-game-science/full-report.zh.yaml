            body: >-
              最强的公开采用证据来自 PC。Steam 商店页显示 1.2 million 条全语言评价、872,536 条 Steam 购买者评价，以及 92% 近期好评率；SteamCharts 记录了 2.4
              million 历史峰值同时在线人数。以买断制单人游戏标准看，这些都是异常强的公开证明点。上线前需求同样可见：PC Gamer 称 Black Myth 到 2024 年 5 月已登顶 Steam
              愿望单榜，GamesRadar 报道发行前其 Steam 反馈工具上有超过 60,000 名用户。媒体随后把上线前热度和商业转化连在一起。 GamesRadar 称其是史上销售最快的游戏之一，四天售出 10
              million 份；随后又报道到 2024 年 10 月初，PC 和 PS5 合计销量超过 20 million-plus 份。PlayStation 的公开能见度明显小于 Steam，但 212,260
              个评分和 4.51/5 仍显示主机上有广泛的付费拥有者参与。因此，采用故事不是假设需求； 而是一次买断制首发把预发布热度转化成了 2024 年最可见的玩家基础之一。
