      - number: '2.3'
        title: 买方、平台和区域发行路径
        blocks:
          - type: paragraph
            body: >-
              玩家是最终用户，但付款路径绕不开平台、订阅和区域规则。PlayStation 上，Black Myth 作为 PS5 买断制作品销售，语言支持广泛；Sony 生态报告月活用户 125 million、季度软件销量
              74.6 million 份、数字化占比 85%。这创造了一个庞大的数字原生主机买家池。Steam 则提供平行的 PC
              路径，带来全球评价、社区发现和会在规模上显著影响经济账的分成结构。两条路径不能互换：店面运营方控制计费、发现和政策，而 PlayStation Premium
              等可选订阅层可以改变访问路径，但不改变核心买断制定位。区域发行选择在中国更加重要。Microsoft 公开指南显示，认证本身会在零售发行前增加流程和时间摩擦； 中国还要过 NPPA
              许可这道闸。公开许可来源显示，审批仍在持续，但需要获准，且有月度清单和英文跟踪数据库。Abacus 报道称，外国作品需要本地发行伙伴，审批耗时可能明显更长。Game Science
              已经展示出面向出口的本地化能力，但这并不能移除平台或监管守门人。
