      - number: '3.4'
        title: Black Myth 的护城河真实但狭窄：文化独特性可持续，单一系列集中度不可持续
        blocks:
          - type: paragraph
            body: >-
              Black Myth 竞争位置中可持续的部分很容易看见。很少有买断制 AAA 动作游戏能同时具备这种制作水准、明确的中国神话框架、近武侠的武术呈现， 以及全球买家愿意全价付款的证据。这种文化 IP
              独特性很重要。不够可持续的是周边一切。公开证据尚未显示 Game Science 拥有广泛多游戏组合、 已披露的长期系列片单，或 Elden Ring 和 God of War Ragnarök
              那样的平台无处不在。评测证据也强，但并非定义品类：Black Myth 和 Stellar Blade 在 Metacritic 上同为 81，Elden Ring、God of War Ragnarök 和
              Dragon’s Dogma 2 分数更高。Black Myth 在上线报道中还遭遇早期性能和设计批评；这一点重要，因为品牌信任是在续作和 DLC 中复利，而不只是首周热度。最后，Black Myth
              自己的成功已经在制造下一重威胁。VGC 关于 Phantom Blade Zero 的报道显示，Wukong 之后，投资人愿意支持更多中国买断制动作项目。这意味着 Game Science
              不只是在对抗旧巨头；它可能也教会了市场如何资助下一个挑战者。实际尽调结论是：Black Myth 的护城河在 IP 层最强，在系列深度、发售节奏可见度和分发权力上最弱。
