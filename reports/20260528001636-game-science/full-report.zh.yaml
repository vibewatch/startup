  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览
        blocks:
          - type: paragraph
            body: >-
              Game Science 的风险结构对于一家拥有本十年最大买断制游戏首发之一的工作室来说异常集中。公开来源显示，Black Myth: Wukong
              成为历史级爆款；同一组证据也显示，公司当前经济叙事仍高度依赖一个标题、一个系列框架，以及一小组发行和审批通道。风险热力图把系列集中度列为决定性问题：如果下一款可变现产品延期，公司会从成功故事变成空窗期故事，而估值标记和招聘预期仍锚定在
              Wukong 量级结果上。


              下一层风险来自外部控制。中国仍对游戏实施许可和政策监管；Steam 和 PlayStation 都保留广泛的审核、终止和内容治理权；Hero Games 和 Tencent 与首发叙事及所有权足够接近，因此不能把
              Game Science 当作完全自足的独立工作室来分析。短期看，这不意味着业务脆弱，但下行风险也不只取决于游戏质量。监管姿态、创作者指南反弹、平台政策和伙伴行为，都可能在玩家评判续作之前先压缩可选项。


              因此，本章的反向证据比通常更重要。公开记录不只是一串胜利。它还包括性别歧视文化指控、创作者指南限制性报道、平台移植延迟、估值透明度有限，以及未来 Black Myth
              宇宙的权利链问题未解。单看任何一项都不会击穿投资逻辑，但合在一起，它们解释了为什么应按一个爆款工作室向作品组合公司转型来研判 Game Science，而不是把它当成已经降险的系列化机器。
            claimRefs:
