      - number: '7.4'
        title: 执行、人员和财务不透明
        blocks:
          - type: paragraph
            body: >-
              Game Science 还面临从受人称赞的项目团队转向机构的经典问题。PC Gamer
              的报道显示工作室不得不以多快速度扩张：一个小团队做出的预告片走红，数千份简历涌入，工作室为了追赶自己意外制造的热度随后招聘约 100
              人。这个招聘故事很亮眼，但也意味着管理跨度、流程和文化必须在最大外部压力下扩张。公开来源没有披露当前员工数、流失率或高压加班 管控，因此投资人无法判断工作室是成功工业化，还是只是跑赢了早期瓶颈。


              文化风险并不抽象。AP 相关报道和 Fast Company 保留了围绕 Game Science 员工或领导层性别歧视言论与招聘图片的真实争议。报道也指出，相关截图未由 AP
              独立验证，这一点影响判断分寸；这不是最终法律结论。但从尽调角度看，问题仍然重要，因为雇主品牌、留存和管理可信度都有路径依赖。一个希望候选人投入多年追逐下一个现象级作品的工作室，承受不起即便只是部分被佐证的信号：领导层容忍不尊重行为，或把批评视为政治上无关紧要的噪音。


              财务不透明进一步放大人员问题。Tencent 持股从 2021 年的 5% 提升到 2026 年的 24%，Hero Games
              退出，暗示企业价值大幅上升。但公开报道仍只给出轶事式估值和未披露价格，而不是经审计收入、利润率或烧钱数据。也就是说，投资人能看见价值创造的轮廓，却看不见背后的资产负债表质量。风险不在于公司弱；风险在于外部观察者把爆款产品收入和老股交易叙事误当成已经完整承保的工作室级财务模型。
