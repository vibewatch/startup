      - number: '1.5'
        title: 负面事项、监管背景和未解问题
        blocks:
          - type: paragraph
            body: >-
              公司概况也必须把主要负面和尽调警示带到后续章节。留存来源中最大的声誉问题不是游戏质量，而是治理和沟通风险。TheGamer、Inverse 和 The Week 均描述了 2024
              年一场争议：据称拿到代码的创作者被要求不要讨论政治、「女权主义宣传」或 Covid-19 等话题；事件落入更广泛的审查争议， 也牵动 Game Science
              早前的性别歧视指控。这些报道不能证明监管处罚，但确实显示 Game Science 的全球品牌能多快撞上文化战争和治理审视。 平台执行风险在上线后仍然可见。Gadgets360 引用 Game Science
              FAQ 称，Xbox 版本需要更多优化时间才能达到质量标准；The Game Post 和 Forbes 则引用 Feng Ji 对 Xbox Series S 内存限制的归因，并指出 Microsoft
              公开否认延期是由其提出的平台限制导致。最后，公开报道仍留下几个核心尽调问题： 2024 年 2 月审批条目的监管一手证据、经验证的当前估值、累计融资、收入或收入运行率，以及可辩护的员工数。
