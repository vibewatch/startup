companyProfile:
  summary: >-
    Game Science 是一家中国私营游戏开发商，由两位 Tencent 时代开发者 Feng Ji 和 Yang Qi 于 2014 年创立；二人围绕买断制动作游戏搭起工作室， 最终凭 Black Myth: Wukong
    打开全球声量。公司法律主体在深圳，工作室足迹横跨深圳 / 杭州；业务也从早期手游，演进为由创始人主导的 AAA 系列工作室。公开投资逻辑高度依赖一个已经爆发的买断制作品，以及公司能否把这次成功转成可持续的多作品平台。
