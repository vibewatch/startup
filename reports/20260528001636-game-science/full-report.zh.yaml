      - number: '4.4'
        title: 承保阻塞、集中度风险和反向证据
        blocks:
          - type: paragraph
            body: >-
              反向情景不是 Black Myth: Wukong 缺少商业成功，而是周边财务披露仍太薄，无法干净承保。官方商店页面没有披露实际 ASP、税费、退款、净收入、毛利率或盈利能力。 关于 Tencent 2026
              年提高持股的媒体报道明确指出，Game Science 已有一段时间没有公开披露该游戏的数据；这强化了一个事实：即便经历破纪录上线，
              公司财务仍不透明。第二个反向视角是集中度。公开集合中几乎每个可见财务证明点都追溯到一款买断制作品；KrASIA 报道称 Game Science 搁置 DLC 计划、转向 Zhong
              Kui，说明管理层已经把注意力、也可能把资本重新部署到下一轮，而不是只收割首个爆款。这可能是战略上合理的，
              但也意味着投资人在承保可复制性，而不只是一次上线结果。本章结论因此故意拆开：已验证数字显示，一款买断制作品拿到非凡实销，并且很可能产生了很大的 Opex
              前到手款。模型区间显示，该游戏很可能已数倍收回开发成本。但关于利润率、流动性和系列耐久性的推断，仍依赖缺失的私有数据。用尽调语言说，乐观情景是强大的上线经济账；
              阻塞点在于，剩余财务未知项恰好决定这些经济账究竟有多可持续。
