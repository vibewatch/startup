  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Game Science 在这里的客户基础不是企业采购，而是发现、购买、拥有、评分，并有时升级一款买断制动作 RPG 的玩家。官方商店页面显示的是直白的买断制结构， 而不是免费游玩或订阅变现：标准版定价
              $59.99，数字豪华版增加外观 / 装备额外内容和原声带，后续升级路径让标准版买家不必重新购买即可升级。 最可见的买方拆分由平台驱动。Steam 聚集了发烧友 PC 受众、基准测试活动、评价量和 Mod
              入口。PlayStation 捕捉主流买断制主机人群，评分基数小得多，但仍然很大。地域披露不那么干净，但公开报道和语言 / 评价组合显示，受众不止中国，同时仍可能锚定中国和更广泛的非英语需求。
              这为尽调形成四个实用分层：中国锚定的买断制买家、海外买断制买家、Steam 优先的硬核动作 RPG 拥有者，以及更高 ARPU 的豪华版 / DLC 购买者。
