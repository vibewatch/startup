chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图和商业模式
        blocks:
          - type: paragraph
            body: >-
              Game Science 公开可查的公司身份，在法律实体层面最清楚：Baidu 公司资料和 Crunchbase 均将其识别为深圳市游科互动科技有限公司， 成立于 2014 年 6
              月。地点叙事需要细分，不能偷懒归到一座城市。Baidu 公开条目把注册地址指向深圳南山区，Gematsu 公司资料描述其深圳和杭州双基地，Yicai 2021 年 Tencent
              投资报道则称工作室位于杭州。最稳妥的合成是：注册公司在深圳， 创意和制作足迹跨深圳与杭州。后续媒体常用一个地点概括，容易掩盖这种分布式事实，因此这一点重要。运营上，Game Science
              更像买断制内容工作室，而不是服务商或长线运营发行商。早期产品是手游，但上线后的投资逻辑如今几乎全部押在 Black Myth: Wukong 的买断制动作 RPG
              内容销售，以及配套平台分发。工作室仍是私有、由创始人主导，但已不再是上线前或实验阶段：更准确的框架是一个上线后扩张中的工作室， 首个全球成功的类 AAA 作品已经进入市场。
