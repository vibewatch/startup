      - - 动作 RPG / 魂系邻近品类
        - 具备挑战性战斗和长尾参与度的可比买断制作品
        - 变现或参与度模式不可比的类型
        - 在邻近系列间选择的买断制玩家
        - 观察 Game Science 所在类型周边支付意愿和重玩行为的最佳公开代理
      - - 全球买断制 PC 和主机发行经济
        - 平台费用、店面发现、认证、数字渠道结构和出口经济
        - 硬件、外设和非游戏媒体支出
        - 平台、发行方和终端用户都会影响实际经济性
        - 解释为什么总需求不能一比一转成发行方收入
      - - 广义游戏市场外沿
        - 宏观市场报告使用的 PC、主机、移动、云游戏和服务型游戏全品类支出
        - 支出未转化为买断制单位销售时的 Game Science 直接收入
        - 跨用户、广告主、订阅者和平台混合
        - 可作背景，但过宽，不能当作 Game Science 的 TAM
    notes: 边界从 Black Myth 当前变现表面向外划定：Steam 和 PlayStation 上的买断制单位销售、邻近买断制动作 RPG 需求，以及中国买断制出海，而不是所有游戏支出。
