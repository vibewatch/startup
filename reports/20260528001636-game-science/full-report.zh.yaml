      - number: '2.4'
        title: 增长驱动、约束和影响估值的缺口
        blocks:
          - type: paragraph
            body: >-
              本章的正向需求信号很清楚。BCG 发现，玩家游玩时长仍在增加，买断制 PC 需求重新加速，云访问在扩大，中国买断制游戏如今有可能走向全球，而不只留在国内。
              这些条件解释了为什么投资人越来越相信中国能产出具备全球竞争力的买断制 AAA 作品。但约束同样重要。BCG 也称，游戏价格会影响超过四分之三受访者的购买选择， AAA 开发成本可达到 $300
              million，这强化了该品类由爆款驱动的本质。平台费仍然显著，认证增加流程开销，中国审批和内容规则会延迟或重塑分发， European Commission
              仍将软件盗版和作弊软件生态标为活跃风险。Take-Two、Ubisoft 和 Tencent
              的公开文件又加一层：大型发行商明确警示市场接受度、爆款依赖、汇率和地缘政治暴露。结果是一个有吸引力但运营上很不宽容的市场。Game Science
              受益于强劲的品类拉力和已经验证的出口爆款，但没有公开数据集能干净隔离公司自身的可服务市场（SAM）、平台组合或区域组合；估值应依赖受约束的视角和尽调问题， 而不是一个醒目的总可用市场（TAM）标题。
