      - number: '8.2'
        title: 单位经济性框架：公开证据足以桥接到独角兽，但不足以支撑无摩擦溢价
        blocks:
          - type: paragraph
            body: >-
              最干净的公开桥接从价格和地域开始。PlayStation 显示美国标价为 $59.99，Bangkok Post 引用 Reuters 的报道给出中国大陆和香港定价约
              $38，并称海外市场约占早期销量的四分之一。由此可得每份约 $43.5 的粗略混合总标价。按 25M 份计算，公开消费者支出在平台费用前约 $1.09B；如果简单假设发行方留存 70%，净入账约
              $0.76B。如果最终达到 30M 份，同一桥接升至约 $1.31B 总额和约 $0.91B 净额。按这套数学，$1.5B 估值并不离谱：相当于 25M 份净入账桥接的约 2.0x，或 30M 份桥接的约
              1.6x。问题在于，这些是已收割爆款标题经济性，不是经审计的经常性收入；具体平台组合、税负、版税负担和自由现金转化仍未披露。公开桥接支持独角兽状态，但不能抹掉执行或不透明折扣。
