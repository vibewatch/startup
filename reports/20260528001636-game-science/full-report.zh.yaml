      - number: '7.3'
        title: 监管、审查和 IP 风险
        blocks:
          - type: paragraph
            body: >-
              中国买断制游戏监管比 2022 年整顿期更支持，但还没有正常化到可以忽略。公开法律和监管来源显示，国内发行仍依赖上线前审批机制、正式出版和运营主体，以及上线后的持续监管。SCMP
              的审批报道显示，监管机构已经重新放行大批月度版号，但这种支持仍属自由裁量。Wukong
              的成功可能改善买断制文化出口的政治气候，但不能消除监管方改变许可节奏、未成年人保护预期或执法姿态的能力；这些变化可能在大部分开发投入已经沉没后扰动经济性。


              审查和声誉层已经显形。NBC、The Week、Inverse 和 TheGamer
              均报道，早期体验创作者被告知避免政治、Covid、女权宣传和中国政策讨论。即便这些指令通过营销渠道传递，而非核心开发者直接发出，事件仍然重要，因为它显示一个中国文化出口项目可以多快从艺术里程碑滑入地缘政治与审查话语。这一风险不只是公关问题。它会影响创作者是否愿意覆盖游戏、记者姿态、平台信任，以及全球受众如何解读未来首发。


              IP 和分级敞口构成第二条法律侧翼。Journey to the West 给 Game Science
              提供了强大的神话素材底座，但法律评论明确指出，公有领域素材并不抹去商标权，也不抹去对更新衍生形象的保护。随着公司尝试搭建更大的 Black Myth
              宇宙、销售周边并本地化未来作品，这一点会更重要。与此同时，ESRB 和 Steam
              都标注了血腥、部分裸露等成人内容元素。这些描述项可管理，但会缩窄无摩擦推广路径，并增加需要额外合规审查的市场、伙伴或平台团队数量。
