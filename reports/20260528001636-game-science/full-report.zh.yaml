  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - UE5 运行时 + DX12 渲染
        - 核心模拟、光照、资产流送和视觉呈现
        - Unreal Engine 5 功能成熟度和特定平台实现
        - 引擎野心抬高质量，也集中放大厂商和优化风险
      - - Nanite / Lumen / 编辑器工作流
        - 为美术和光照团队提供高保真环境和更快迭代
        - UE5 内容管线功能和工作站 / 编辑器稳定性
        - 生产速度提升不等于运行时性能压力自动消失
      - - VHM 雪 + 毛发 / 植被系统
        - 标志性的环境和角色细节效果
        - 实验性且成本高的渲染子系统
        - 效果野心可能在特定平台或场景里暴露 bug、崩溃和调校工作
      - - 超分 / 帧生成层
        - 让高端渲染模式在大众硬件上更可玩
        - DLSS、FSR、XeSS、TSR、驱动质量和特定厂商性能表现
        - 超分 bug 或糟糕默认值会直接损害第一印象，并推高补丁积压
      - - 基准测试 / 支持层
        - 把硬件适配不确定性变成可见的预检步骤
        - 基准测试工具维护、FAQ 链接、支持指引和平台信息传达
        - 工具侧 bug 或基准测试与实际游戏不匹配，可能不是建立信任，而是侵蚀信任
      - - 商店 / 认证 / DRM 层
        - 在 Steam、Epic、PlayStation、Xbox 和 Denuvo 保护的 PC 版本中打包并交付 SKU
        - 平台认证、商店元数据、云 / 存档功能和第三方 DRM
        - 平台时点和认证约束可能延迟功能对齐，或制造用户摩擦的取舍
    notes: 这张架构表同时纳入运行时技术、生产工具和交付基础设施，因为 Black Myth 的真实用户体验由这三层共同塑造，而不只取决于引擎代码。
