        - 想要队伍系统和开放世界深度的奇幻动作 RPG 玩家
        - Capcom 既有目录和多平台首发
        - 基础价 $69.99 更高，评测共识弱于 Elden Ring
      - - Stellar Blade / Shift Up + PlayStation 作品
        - 直接同业 / 相邻在位者
        - PS5 和 PC 合计 3M+ 份；Sony 发行支持
        - 追求视听奇观和首领战的主机优先动作玩家
        - 呈现质量高、Sony 分销、相近的高价制作水准
        - 科幻设定，上市公司规模小于 Sony 第一方
      - - Phantom Blade Zero / S-GAME
        - 可能进入者
        - 2026 年 9 月上线；VGC 称 Wukong 成功后获得额外融资
        - 中国动作粉丝可能会在 Black Myth 和 Soulslike 相邻游戏之间交叉选择
        - 武侠 / Kungfupunk 身份，计划登陆 PS5 + PC，聚焦单机
