      - number: '1.3'
        title: 股权、融资历史和披露缺口
        blocks:
          - type: paragraph
            body: >-
              外部可验证的融资时间线，比该系列的商业能见度薄得多。上线前最强的公开所有权里程碑是 Hero Entertainment 的早期支持：Baidu 公司资料称，Game Science 在 2017 年 5 月获得
              Hero 天使融资，Hero 的天津主体后来持有公司约 19%。第三方交叉验证最强的战略资本事件， 是 Tencent 2021 年 3 月的少数股权投资。Yicai 报道称，Tencent 持股升至
              5%，为所有股东中最低，并明确称 Tencent 承诺不干预 Game Science 的运营或决策；Game World Observer 也转述了同样的 5% 数字。Gematsu 2024 年 9 月援引
              Hero Games 高管 Daniel Wu 的 Bloomberg 访谈，进一步称 Hero Games 是 Game Science 最大外部股东。投资人仍无法用公开证据清楚承保的是完整资本结构。
              Baidu 公开资料声称，Game Science 在 2025 年 2 月完成 several hundred million U.S. dollars 的 Series A，投后估值 10 billion
              yuan，参与方包括 HongShan、Hillhouse、Tencent 和 5Y
              Capital；但本章没有留存到官方公告、备案或一线财经报道来独立佐证该说法。因此，估值和累计融资应被视为缺乏支撑的封面指标，而不是硬事实。
