      - number: '1.2'
        title: 创始人、治理和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人集中是 Game Science 故事的核心特征。公开资料始终把 Feng Ji 放在中心：创始人、CEO、法定代表人，也是战略和技术问题上的主要公开发言人。 Yang Qi
              是另一位可验证的联合创始人，也是最清晰的创意搭档；两人共同的前 Tencent 背景可追溯到 Dou Zhan Shen/Asura 时期的开发工作。这种 founder-market fit
              有意义：两人在腾讯工作室体系调整期间离开，先做小体量作品，再花多年孵化 Black Myth 直至全球上线。登记类公开信息对所有权的揭示多于对经典风投治理的揭示。可取得的证据显示，Feng Ji
              是最大直接股东，两家内部管理合伙企业合计控制另一大块股权， 意味着即便引入外部融资后，内部人仍可能持有多数。仍不透明的是正式治理架构。公开可读来源没有给出可靠的当前董事会名单、否决权地图或投资人保护性条款。
              尽调里，关键人问题不是装饰项：Feng Ji 似乎同时集中运营领导、公共叙事控制和大额直接持股，Yang Qi 则锚定该系列的创意端。
