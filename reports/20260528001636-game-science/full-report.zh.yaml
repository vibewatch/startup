  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与玩法支柱
        blocks:
          - type: paragraph
            body: >-
              Black Myth: Wukong 最好被理解为一个买断制单人动作 RPG 产品族，而不只是一款盒装游戏。已交付体验如今包括横跨 PC/PS5/Xbox 的基础游戏、上线前基准测试
              工具，以及数字豪华升级和后续挑战模式内容等更小的付费或可重玩扩展。按玩家路径看，产品在 PC 上从购买前就开始，因为 Game Science
              给用户提供了公开基准测试工具，让他们测试自己的机器是否能承受游戏异常沉重的渲染负载。这是一个值得注意的产品决策：作品视觉野心很高，兼容性焦虑本就是购买路径的一部分， 该工具降低了获客摩擦。


              游戏内部的支柱很清楚，并在官方页面和评测报道中反复出现：电影化 Boss 战、以棍法为核心的近战、法术和变身组合、神话感强的环境，
              以及由敌人和角色背景承载的世界观。因此，产品差异化不在新商业模式或长线运营循环，而在中国神话框架与重场面战斗执行的紧密结合。取舍是 Black Myth 的范围仍集中在作者主导的单人游玩。豪华版内容偏外观 /
              功能，真正有意义的上线后扩张，到目前为止更偏挑战和重玩系统，而不是公开排期的剧情 DLC。
