        - 在提高确信度前，要求董事会层面监督、HR 报告，以及干净的继任与行为合规包。
      - - 权利链 / 法务摩擦
        - 商标异议、平台 IP 投诉或周边 / 续作审批延误
        - 任何围绕 Black Myth 命名、形象、本地化素材或周边商品的正式挑战
        - 公开法律评论称，仅有公有领域身份本身还不够。
        - 没有权利备忘录和清权流程，就不要核保更大的宇宙。
    claimRefs:
      - CR010
      - CR022
      - CR025
      - CR041
      - CR045
      - CR046
      - CR049
      - CR050
    notes: 终止标准刻意少而且绑定投资逻辑：任何触发项出现，问题就不是管理层能否补洞，而是作品组合扩张故事是否仍成立。
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 什么会改变结论
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 公开证据支持真实规模，但可重复性和披露质量还不足以支撑今天激进付溢价。
        - 拿到有价格的融资标记，以及接近审计口径的 KPI 披露。
      - - 确信度
        - 中
        - 销量和可比公司证据很强，但利润率、股权结构和分成披露仍是私有信息。
        - 增加平台 P&L、税务和现金转化数据。
      - - 风险评级
        - 高
        - 单一作品撑起投资逻辑，即便是公开游戏龙头也警告：爆款集中和定价权可能很快失效。
        - 展示第二条可变现发行路径和稳定系列 IP 路线图。
      - - 估值立场
        - $1.5B 看起来合理到偏高
        - 这个区间基于 Wukong 已收割的现金流可以成立，但把不透明度和续作风险打折后，并不明显便宜。
        - 更低的入场价、更好的披露或更快的后续系列 IP 证明都会改善判断。
      - - 最佳公开证据区间
        - $1.5B-$2.2B
        - 这个区间承认 25-30 million 套销量、自发行经济性和部分系列可选性，但不支付完整公开可比公司倍数。
        - 更强的第二款作品路线图可以支撑更高区间；现金转化较弱则支撑更低区间。
      - - 红区估值
        - 在后续证明出现前 >$3B
        - 这要求核保重复爆款能力、授权抽成率和可持续管线经济性。
        - 只有拿到续作质量证据后才支付这个价格。
    notes: 这张表只用公开证据框定入场纪律；不能替代私有数据室里的估值模型。
    claimRefs:
      - CV044
      - CV049
      - CV050
      - CV051
      - CV052
      - CV053
      - CV056
  - id: TV002
    title: 正方 / 反方投资逻辑表
    columns:
      - 论点
      - 当前证据
      - 为什么影响价值
      - 什么会改变判断
    rows:
      - - Wukong 已是全球买断制游戏异常成功样本
        - 三天 10 million 份、一个月 20 million 份、到 2025 年 1 月 25 million 份，均有公开资料相互印证。
        - 这条销售曲线足以支撑独角兽桥接估值，不必虚构一轮融资。
        - 进一步的经审计终端销量和平台组合会强化这一点。
      - - 自发行可能保留更多经济收益
        - Game Science 在主要 PC 和 PlayStation 商店中显示为发行商。
        - 拿住发行商经济性后，每一份销量的价值可能远高于外包发行。
        - 展示准确的平台费用、税费和版税桥接。
      - - 反方：这仍是一款作品
        - 公开证据显示的是一款超级爆款和周边延展，而不是已披露的可持续作品组合。
        - 单一作品集中度相对多元化上市同业应有折价。
        - 带有已获资金支持里程碑的第二款发行路线图会缩小折价。
      - - 反方：没有带价格的公开标记
        - Tencent 增持，但购买价格未披露。
        - 没有带价格的标记，公开估值说法只是推断，不是确认。
        - 披露转让价格或后续任何融资。
      - - 反方：续作时间未锁定
        - 工作室没有立即做 Wukong DLC，而是转向 Zhong Kui。
        - 这让投资者在时间尚不清楚前，就要为未来系列 IP 价值付费。
        - 发布硬路线图或里程碑节奏。
      - - 周边业务真实存在，但经济性不清楚
        - KrASIA 引述 Chow Tai Fook 零售销售额 RMB 1.5 billion。
        - 这证明 IP 需求，不证明 Game Science 抽成率。
        - 披露授权利润率和收入确认。
    notes: 多头论据最强的是规模和 IP 拉力；反方论据最强的是集中度、价格不透明和续作时间。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV015
      - CV017
      - CV022
      - CV025
      - CV050
      - CV053
      - CV055
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 价值区间（USD billions）
      - 概率信号
    rows:
      - - 熊
        - Wukong 基本仍是一次性收割的单爆款事件；续作时间滑坡；披露净回款低于公开桥接估算。
        - 对已收割现金流和有限可选性套用单作品折价。
        - 0.7-1.3
        - 如果私有尽调显示抽成率低、税费 / 版税负担重，或近期没有后续作品阵容，这最可能成立。
      - - 基准
        - 25-30 million 套销量成立，自发行经济性大体完整，Black Myth 成为可信但尚未多元化的系列 IP。
        - 支撑一个略高于独角兽水平、但低于多元化公开市场倍数的公开证据区间。
        - 1.5-2.2
        - 最贴合当前证据：销量真实，但可重复性仍是假设而非披露。
      - - 牛
        - Black Myth 宇宙具备可重复性，Zhong Kui 或 DLC 变现良好，授权利润率证明有意义。
        - 按可持续买断制系列 IP 路径核保，靠近爆款游戏公开可比公司的高端。
        - 2.8-4.0
        - 需要续作可见度、更高确信度的现金转化，以及证明 Wukong 是平台而不是一次性爆款。
    notes: 情景区间是公开证据核保指南，不是折现现金流输出；所有情景都保留私营公司不透明折价。
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV051
      - CV052
      - CV053
      - CV055
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标基础
      - 倍数 / 价值信号
      - 与 Game Science 的相关性
      - 局限
    rows:
      - - CD Projekt
        - 2026 年 5 月市值和 TTM 收入
        - 基于 $6.39B 市值和 $0.29B TTM 收入，约 22.0x 销售额倍数
        - 对一家靠爆款驱动、拥有 IP、存量目录经济性大的工作室，是有用的买断制系列 IP 可比。
        - 披露仍远多于 Game Science，且由多个系列 IP 和公开报告支撑。
      - - Capcom
        - 2026 年 5 月市值和 TTM 收入
        - 基于 $8.31B 市值和 ~$1.03B TTM 收入，约 8.1x 销售额倍数
        - 是有用的多元化买断制发行商视角，目录变现强、全球 IP 宽度大。
        - Capcom 的目录深度和年度发行节奏远高于 Game Science。
      - - SHIFT UP
        - 2026 年 3 月市值对 2025 年收入
        - 基于 KRW 1.87T 市值和 KRW 294.5B 收入，约 6.3x 销售额倍数
        - 可作为上市亚洲单爆款 / 集中 IP 样本，利润率高且有 Tencent 持股。
        - SHIFT UP 仍有多条变现线，公开披露也比 Game Science 更完整。
      - - Electronic Arts
        - 2026 年 5 月市值和 TTM 收入
        - 基于 $50.32B 市值和 $7.30B TTM 收入，约 6.9x 销售额倍数
        - 对公开投资者在可重复性和长期运营服务可见时愿意支付什么倍数，是有用的多元化基准。
        - EA 的长期运营服务组合和规模远超 Game Science 公开披露的任何内容。
      - - Take-Two
        - 2026 年 5 月市值和收入同业数据
        - 基于 ~$40.56B 市值和 ~$6.55B 收入，约 6.2x 销售额倍数
        - 有用的爆款驱动发行商可比，且明确披露集中度和可接受定价水平。
        - 仍受益于 Rockstar、2K 和 Zynga 的作品组合宽度，Game Science 不具备这一点。
    notes: 倍数是用公开市场数据和报告收入做的简化市值 / 销售额视角；它们是方向性判断，不是企业价值精算。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of five public gaming comparables with May 2026 market data and most recent reported annual or TTM
        revenue.
    claimRefs:
      - CV028
      - CV032
      - CV036
      - CV039
      - CV041
      - CV044
  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 净回款不及预期
        - 私有尽调显示毛到净留存显著低于 ~70%，或 ASP 实现显著更低。
        - 公允价值桥很快跌破独角兽支撑。
        - 下调估值，避免溢价进入。
      - - 没有可信后续作品阵容
        - 未来 12-18 个月内没有已获资金支持的 DLC、Zhong Kui 或第二个 Black Myth 变现计划。
        - 市场必须把 Wukong 当作已收割的一次性爆款，而不是系列 IP 平台。
        - 转向熊市区间。
      - - 股权结构对投资者不友好
        - 优先权、治理权或员工持股平台经济性让普通股价值显著低于名义估值。
        - 名义估值无法很好指引新钱经济性。
        - 要求更低入场价，或者放弃。
      - - 授权可选性经济性偏薄
        - 周边和合作带来大量零售 GMV，但 Game Science 的版税抽成率很低。
        - 牛市可选性缩水成噪音。
        - 从估值中剥离周边上行。
      - - 管线执行滑坡
        - 续作或衍生作品时间滑坡到现金流连续性断裂。
        - 可重复性仍未证明，公开可比公司支撑变弱。
        - 只保留观察名单位置，不做核保入场。
    notes: 这些是估值触发项，不是产品评测意见；每一项都会改变买方在同一价格下实际买到的东西。
    claimRefs:
      - CV023
      - CV025
      - CV047
      - CV052
      - CV053
      - CV055
      - CV056
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 上线后估值标记
        - Tencent 增持或后续任何转让的披露价格。
        - 把推断价值和真实投资者成交价分开。
        - 公司法律顾问、股权结构表、股份转让登记册。
      - - 毛到净桥
        - 按平台和地区拆分的平台费、退款、税费、版税与真实净收入。
        - 把销量成功转成经济价值，而不是毛销售额叙事。
        - 财务团队 P&L 桥和平台报表。
      - - 系列 IP 路线图
        - DLC、Zhong Kui 和下一款作品的里程碑日历及预算支出。
        - 判断投资者买的是单爆款工作室，还是可重复的系列 IP 所有者。
        - 产品路线图审阅和里程碑仪表盘。
      - - 股权结构和权利
        - 完全摊薄股权、优先权、否决权和员工持股平台。
        - 可让名义估值与普通股价值大幅背离。
        - 对 SHA、章程和期权计划做法律尽调。
      - - 授权变现
        - 周边、活动和联名的版税费率和已确认收入。
        - 仅凭零售 GMV 无法核保牛市可选性。
        - 商业合同和收入确认表。
    notes: 这些要求聚焦最直接改变入场价格纪律的缺失信息，而不是一般公司花边。
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV053
      - CV055
      - CV056
