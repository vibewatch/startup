      - number: '1.4'
        title: 上线、牵引力和里程碑
        blocks:
          - type: paragraph
            body: >-
              以私营游戏工作室标准看，Game Science 的里程碑记录异常强，因为 Black Myth: Wukong 把公司变成了全球都能识别的名字。 公开资料称，这个单人项目在 2018 年 2
              月正式启动，2020 年 8 月玩法演示成为工作室的爆发点；Baidu 称，仅 Bilibili 上传版本的播放量就接近 50 million。发售时间随后很清楚。Gematsu 和 PlayStation
              官方游戏中心显示，该作于 2024 年 8 月 20 日登陆 PS5 和 PC；Gematsu 与 Forbes 显示，Xbox 版本在整整一年后的 2025 年 8 月 20
              日到来。商业牵引几乎立刻从突破变成定义品类。Gematsu 转述 Game Science 三天售出 10 million 份的公告，又根据 Hero Games 的 Bloomberg 访谈报道两周销量为 18
              million。Push Square 和 PlayStation Universe 均称，Tokyo Game Show 演示后来把首月销量定为 20 million 份。SteamCharts 仍记录着
              2,406,967 的 Steam 历史峰值同时在线人数。奖项进一步强化了商业叙事：CGTN 和 Global Times 称，该游戏获得 The Game Awards 2024 最佳动作游戏和
              Players' Voice，China Daily 报道它还在第 42 届 Golden Joystick Awards 拿下 Ultimate Game of the Year 和 Best Visual
              Design。
