      - number: '8.3'
        title: 可比视角：上市发行商显示天花板，也说明 Game Science 为什么该有集中度折价
        blocks:
          - type: paragraph
            body: >-
              指定可比公司是双刃剑。CD Projekt 仍以溢价倍数交易，因为投资人愿意为一家已验证的买断制系列工作室，以及庞大历史目录盈利能力付钱；但即便如此，它的业务仍围绕少数全球 IP
              搭建。Capcom、EA、Take-Two 和 Shift Up 展示了更分散的模式：它们大致在 6x-8x 销售额区间交易，但也披露收入基数、管线深度、服务型游戏组合和集中度风险，而 Game Science
              尚未做到。EA 2026 财年净收入的 71% 来自服务型游戏及其他收入，Take-Two 也明确提醒投资人其依赖 Grand Theft Auto、NBA 2K
              和可接受定价水平。这些披露重要，因为它们显示即便规模化龙头也承认爆款集中风险。Game Science 今天有一个已验证的超级爆款，PC 和 PlayStation 上看似自发行的经济性，一些周边可选项，以及
              Tencent 的战略信号；但它仍缺少支撑完整上市公司倍数的多元化收入可见性。因此，低个位数十亿美元估值可以成立，把很高的个位数十亿美元可比倍数直接移植过来则过于慷慨。
