      - number: '8.4'
        title: 乐观、基准和悲观逻辑：如果系列化能力真实，当前估值合理；如果续作级证据出现前就按续作质量定价，则偏紧
        blocks:
          - type: paragraph
            body: >-
              悲观情景很简单：Wukong 大体仍是一次已收割的单爆款事件，续作时间表滑坡，周边看上去很大但对工作室经济贡献有限，投资人把 Game Science
              重新定价得更接近已收割爆款现金流工具，而不是可重复的系列所有者。这指向低于 $1.3B 的价值。基准情景认可管理层实现 25-30M 套实际售出、Tencent 战略验证、自发行上行空间，以及足以支撑约
              $1.5B 至 $2.2B 的系列概率。乐观情景只有在投资人能把 Black Myth 宇宙承保为多标题
              IP、具备可重复首发、更清晰的授权抽成率，以及证明后续作品可以在不显著稀释经济性的情况下获得资金和发行之后才开始。那时 $3B
              以上才可能。此前，击穿投资逻辑的触发因素很直接：后续路线图疲弱，证据显示净入账远低于模型，或私下披露的股权结构表让头部估值对新钱不再有吸引力。公开证据支持密切观察，而不是为尚未发布的确定性付费。
