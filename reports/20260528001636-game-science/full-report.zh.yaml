      - number: '2.2'
        title: 多重测算视角与买断制动作 RPG 可比项
        blocks:
          - type: paragraph
            body: >-
              Game Science 不能靠任何单一总可用市场（TAM）标题支撑判断。最干净的公开视角横跨不同层：全球 PC 和主机支出、买断制 PC 和买断制主机支出、中国国内移动端加 PC
              市场、中国游戏出口收入，以及买断制动作 RPG 发行商给出的直接系列验证。按任何标准看，中国都很大：Niko 预计到 2026 年，国内移动端加 PC 收入为 $55.23 billion，玩家数为 730
              million，出口移动端加 PC 收入为 $26.46 billion。 但这些数字仍未隔离买断制主机或买断制单人支出。因此，可比系列表现才重要。CD PROJEKT 表明，出口导向、数字分发的买断制 RPG
              可以在全球卖出 tens of millions of copies；Capcom 的 Monster Hunter 数字显示，动作导向买断制系列也能达到类似规模；Elden Ring 证明，soulslike
              邻近品类可以支撑 30 million 份基础游戏销量，以及大型 DLC 和衍生需求。Black Myth: Wukong 自身给出这组证据中最强的中国特定证明：第三方分析估计其 Steam 总收入超过 $835
              million，平均游玩时长也长，尽管装机基础仍偏中国。合起来看， 这些来源说明机会真实存在，但仍不能合并成一个可相加的可服务市场（SAM）。
