        - 社区活跃，但官方未支持
        - 显示玩家对发售版本之外的自定义和修复有需求
        - 官方没有公开第一方 Mod 工具、政策页面或兼容性保证
    notes: 这个模块视角把基础游戏、支持工具、变现附加项、可重玩层和非官方 PC 社区入口区分开， 而不是把 Black Myth 当成一个单一的整体 SKU。
