  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：跟踪这个系列，但不要把一次巨大首发误当成已经完整承保的平台经济性
        blocks:
          - type: paragraph
            body: >-
              Game Science 已经跨过了一个门槛：再把它当作小众工作室已经不可信。公开销售证据显示，Black Myth: Wukong 约 83 小时售出 10M 份，首月售出 20M 份，到 2025 年 1
              月超过 25M 份，后续报道指向首年 30M 份。单是这个规模就足以佐证独角兽状态。问题不在于 Wukong
              是否重要；问题在于今天的私募投资人买到的是持久的多标题系列，还是只是在收割一次非凡首发。公开可比公司显示，多元化游戏发行商可在约 6x-8x 销售额交易；当投资人相信爆款驱动工作室仍拥有可重复的系列经济性时，CD
              Projekt 可以拿到更高溢价。Game Science
              还没有披露足以自信声称同等质量的复现性、利润率或治理数据。因此，正确姿态是观察或继续研究，而不是买入：公开证据支持真实价值，但不支持在突破性标题之外盲目给溢价。
