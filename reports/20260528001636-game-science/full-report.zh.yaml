      - number: '5.4'
        title: 路线图、续作信号与技术风险
        blocks:
          - type: paragraph
            body: >-
              公开路线图更多藏在执行痕迹里，而不是正式路线图文字里。Game Science 上线前展示基准测试工具，先发 PS5/PC，随后数月修 bug 和质量补丁， 再把游戏带到 Xbox。官方店面如今显示 Xbox
              已发售，但这并没有抹掉执行信号：Game Science 自己称，Xbox 未能同步发售，是因为团队仍在优化 Series X|S 以达到质量标准；后续技术报道则称，交付的 Xbox
              结果仍包含画面撕裂和视觉质量降低，尤其是在 Series S 上。尽调里，这是最清楚的证据：Black Myth 的技术野心可能跑在平台移植难度前面。


              上线后内容扩张真实存在，但边界明确。挑战模式、Journeyer’s Chart、原声库功能和季节性装备奖励显示公司仍在投入产品；但公开渠道仍没有带日期的 DLC 路线图。续作 /
              系列延续信号见于行业报道，这些报道提到 Black Myth: Zhong Kui，并暗示 Wukong 故事可能延续；但这仍不等于官方时间表。 结果是熟悉的 AAA 风险画像：Game Science
              已证明自己能交付并支持买断制动作 RPG，但公司仍依赖引擎成熟度、店面 / 平台认证和持续优化工作。 上行来自清晰的产品野心；风险在于，下一个内容节点或平台扩张可能再次暴露同样的渲染和 QA 瓶颈。
