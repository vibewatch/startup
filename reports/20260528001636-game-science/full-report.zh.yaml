      - number: '4.3'
        title: 成本代理、资本结构和现金流含义
        blocks:
          - type: paragraph
            body: >-
              开源成本证据比开源实销证据更薄，所以本节依赖代理指标，并逐一标注。公开资料把 Game Science 的创立放在 2014 年，并显示其足迹横跨杭州和深圳； Baidu Baike 则把独立 Wukong
              项目启动时间定为 2018 年 2 月。这形成了通往 2024 年 8 月上线的约六年制作周期。团队规模报道显示， 2024 年工作室少于 150 人，2020 年演示时只有约 20
              名开发者参与；另有一个置信度较低的资料称，团队约 100 人，偏精简，并有外包支持。 Unreal 自家访谈确认，团队从 UE4 迁移到 UE5，并认为 Nanite、Lumen
              和编辑器性能提升明显改善了工作流；这可能提高效率，但没有消除 AAA 级内容和优化成本。营销强度也真实存在，而非偶然：Niko 描述了 four million-plus 愿望单、55 million
              Bilibili 预告片播放、上线当天 1.7 billion Weibo 浏览，以及限量实体版和联名促销的快速售罄。资本结构只部分可见。Yicai 报道 Tencent 在 2021 年持股达到 5%，Game
              World Observer 报道 2026 年 Hero 退出后其持股升至 24%；但留存来源集合仍缺少底层一手备案，也没有披露收购价格。最重要的是，没有留存公开来源披露当前现金、烧钱速度、
              现金跑道或债务。这意味着上线带来的潜在现金暴增，并不会自动转化为已证明的自筹续作能力；它只是让这种能力变得可信。
