  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流
      - Game Science 方案
      - 可衡量收益
      - 限制
    rows:
      - - 检查一台 PC 能否运行游戏
        - 搜论坛、猜配置、承担退款风险
        - 购买或安装前运行官方基准测试工具
        - 降低这款以硬件要求高著称的 UE5 游戏带来的不确定性
        - 基准测试工具给出的信心仍不能保证实际游玩全程无卡顿
      - - 在首发日安装并启动
        - 预载、发布时解锁、手动排查崩溃
        - 在支持的首发平台预载，并配套官方发布提示和 FAQ 链接
        - 改善首日获客体验，并把用户快速导向官方修复方案
        - 从公开抓取看，支持详情页仍相对不透明，排障负担仍落在玩家身上
      - - 推进以战斗为主的章节
        - 学习 Boss 模式、调整棍法和技能、反复挑战
        - 棍法、法术、变身、装备和围绕 Boss 的节奏设计
        - 打出一个鲜明的精通循环，评论家和用户都反复提到
        - 探索深度和关卡可读性获得的外部评价弱于战斗
      - - 调整画质 / 性能取舍到可接受水平
        - 试验预设、超分、RT 和帧生成
        - 多种超分方案、细粒度设置、基准测试工具和厂商指引
        - 让高端用户追求视觉奇观，也让中端用户退回高 / 中预设
        - 最好看的模式成本很高，许多用户仍必须妥协
      - - 通关剧情后重新投入
        - 仅为 NG+ 或社区挑战回归
        - 挑战模式、连战、图表、原声功能、Mod 和补丁驱动的回归
        - 不需要完整 DLC 战役，也能增加重玩钩子
        - 公开证据仍更支持可重玩性增强，而不是剧情扩展计划
    notes: “可衡量收益”列记录有证据支撑的工作流改善，例如兼容性不确定性降低、 调校弹性更大、重玩钩子更清晰；它不是对经审计 ROI 的承诺。
