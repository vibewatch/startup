      - number: '5.3'
        title: 平台质量、基准测试与上线后运营
        blocks:
          - type: paragraph
            body: >-
              产品质量证据强，但并不干净。好的一面是，评论家和玩家反馈集中在高于平均的结果：IGN 8/10、Metacritic 81、OpenCritic 低 80 段共识，以及极其正面的 Steam 用户评价，都支持
              Game Science 首次 AAA 出击在商业和评论上成功。基准测试报道和商店页面也显示，
              玩家异常关心这款游戏能否顺畅运行，这也是基准测试工具成为产品一部分的原因。这是正向的成熟度信号，但也承认视觉把硬件推得足够狠，购买前测试变成必要。


              不利的一面是，补丁轨迹读起来像一张真实技术债台账。1.0.8 补丁修复了 FSR 启动崩溃、全光追崩溃、战斗 bug、任务 / UI 缺陷和多语言文本问题。
              后续补丁历史又加入内存泄漏修复、低端优化、DLSS/XeSS 崩溃修复、挑战模式功能和更多本地化修补。2026 年 1 月报道显示，Game Science 仍在修复超分辨率行为、PS5 地图 UI
              撕裂和其他缺陷。2026 年社区讨论仍提到补丁后掉帧、着色器编译失败、启动不稳定和特定硬件问题。 所以，产品质量结论不是「坏游戏」，而是「出色战斗和美术方向之上，仍压着持续优化和 QA 负担」。
