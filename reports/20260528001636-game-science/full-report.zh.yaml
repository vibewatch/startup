      - number: '3.2'
        title: 能力、平台触达和包装方式显示 Black Myth 哪里能平起平坐，哪里还不能
        blocks:
          - type: paragraph
            body: >-
              只看展示效果，Black Myth 已经能和品类领头羊放在同一张桌上。它的 Metacritic 结果与 Stellar Blade 持平，以单人游戏标准看，Steam 上线牵引力也异常强。
              问题在于，能力比较不只是画面和 Boss 战。Elden Ring 和 Dragon’s Dogma 2 已经覆盖 Xbox、PlayStation 和 PC；God of War Ragnarök 叠加
              Sony 两代主机装机盘和后续 PC 扩展；Phantom Blade Zero 尚未发售，就已经列出 PS5 和 Steam。包装方式也暴露压力点。Black Myth 以 $59.99 标准版和 $69.99
              数字豪华版入市，相比 Elden Ring 和 God of War Ragnarök 有竞争力，但低于 Dragon’s Dogma 2 的 $69.99 标准价。这让 Black Myth
              的买断制首发定价合理，但也意味着它几乎以相同票价正面对抗品类领头羊，而不是靠显著价格差取胜。与此同时，Naraka 等替代品从相反方向进攻，提供免费进入；尚未发售的 Phantom Blade Zero
              仍保留定价灵活性。因此，公开证据支持一个更细的结论：Black Myth 在场面感上有竞争力，标价也公允，但还没有这个赛场里最广的平台版图或最有防御力的包装位置。
