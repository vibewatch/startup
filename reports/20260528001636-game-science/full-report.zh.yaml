      - number: '5.2'
        title: UE5 技术栈与制作管线
        blocks:
          - type: paragraph
            body: >-
              最强的技术证据显示，Game Science 的产品架构离不开 Unreal Engine 5。工作室披露称，它在开发中期从 UE4 迁移到 UE5，API 适配痛感相对较小，随后依赖
              Nanite、Lumen、编辑器端响应速度和 Virtual Heightfield Mesh 来提高资产精度，同时压缩部分内容生产流程。 这一点重要，因为 Black Myth
              的市场定位既依赖战斗系统，也同样依赖视觉密度和环境场面。UE5 不只是渲染器替换；它是生产方法论的一部分， 让更高细节环境、灯光迭代和动态雪地变形等特效实验成为可能。


              已交付运行时栈把这条制作故事延伸到了用户可见产品。独立基准测试显示，它具备 DX12 时代特征：DLSS、FSR、XeSS、TSR、帧生成， 以及光追 / 路径追踪组合。NVIDIA
              自家合作伙伴材料清楚说明，旗舰 PC 呈现有多依赖 RTX 生态；TechSpot 和 NotebookCheck 则显示，这些功能也带来真实调校复杂度。实际看，Black Myth
              的运营模型是一套分层栈：核心是 UE5 内容和模拟，上面叠加厂商特定渲染功能， 外层是店面 / 平台包装，再加一层基准测试 / 支持，帮助用户在安装前后处理性能风险。
