      - number: '7.2'
        title: 系列和平台集中度
        blocks:
          - type: paragraph
            body: >-
              商业集中度仍是本章核心财务风险。Wukong 的销售轨迹极其罕见：3 天 10M 套、两周 18M、一个月超过 20M，后续报道称一年超过
              30M。这一成功带来现金、品牌认知和招聘筹码，但也重设了后续产品的门槛。Newzoo 和 BCG 的公开市场结构数据表明，现在不是假设轻松复刻的好时点。成熟系列不再天然奏效，主机仍由爆款驱动，数字店面只会更拥挤。


              发行足迹进一步强化了集中度叙事。原始突破由 Steam 和 PlayStation 承载，Xbox 则整整晚到一年。这意味着 Game Science 最可见的买断制成功最初依赖 PC 店面转化、Steam
              评论可见性和 PlayStation 主机经济。Steam 和 Sony
              都在规则执行、访问限制、内容可用性、评论或审核框架上保留广泛权利。即便没有直接执法事件，这些条款也把平台依赖变成结构性风险，而不是理论风险。公司不只是卖一款游戏；它在向两个强势店面生态租借可见性。


              平台扩张的执行风险也是真实的，而非假设。Game Science 创始人自己把 Xbox 延迟归因于 Series S
              优化限制，削弱了扩张只是商业交易选择的安慰性说法。如果一个爆款标题已经需要额外一年才能扩大平台覆盖，投资人就不应假设续作、DLC
              级内容或更广作品组合能更快、更便宜地完成多平台执行。原因很简单：单爆款工作室需要的不只是一款好游戏，而是一款能准时、广泛上线的好游戏。
