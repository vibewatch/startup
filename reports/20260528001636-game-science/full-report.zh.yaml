  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 结论从毋庸置疑的销售证据推进到一个更窄的问题：一款游戏是否足以支撑今天为尚未完全披露的 IP 经济性买单。
    data:
      nodes:
        - id: sales
          label: 销售证据
          detail: 3 天 10m；截至 2025 年 1 月 25m+；首年报道 30m。
          tone: positive
        - id: cash
          label: 现金流桥
          detail: 公开定价和地域分布暗示，消费者支出足以支撑独角兽叙事。
          tone: positive
        - id: ownership
          label: 战略信号
          detail: Tencent 提高持股，但未披露价格。
          tone: neutral
        - id: concentration
          label: 集中风险
          detail: 一款爆款、复购披露薄弱、续作时间不确定。
          tone: negative
        - id: comp
          label: 可比公司视角
          detail: 6x-8x 上市发行商区间，更高倍数只适用于已验证 IP 耐久性。
          tone: warning
        - id: call
          label: 结论
          detail: 观察 / 继续研究，除非价格或披露改善。
          tone: warning
