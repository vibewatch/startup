      "calloutType": "strength",
      "title": "Fee stack is transparent, recurring, and GMV-linked",
      "body": "Unlike most private fintechs, Flex's fee structure is fully public and structurally coherent: the $14.99 subscription provides a recurring base while the 1% transaction fee scales with payment volume. The subscription auto-renews and accrues even without active use, creating meaningful retention economics. The Move-in APR (16.95%–23.84%) and the Bills fee (≤3%) add higher-yield product surfaces. The fee model is cleanly designed and well-disclosed.",
