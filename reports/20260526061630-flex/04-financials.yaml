    {
      "id": "transaction-scale-revenue-proxy",
      "title": "Transaction scale and revenue proxy estimation",
      "body": "Flex does not publish audited financial statements, ARR, or revenue, but company-issued press materials provide the raw inputs for bottom-up proxy analysis. As of March 2026, Flex reported 2.7 million customers and $33 billion in on-time payments processed. In February 2025, the comparable figures were 1.4 million renters and $14.8 billion in on-time rent payments. The growth from 1.4 million to 2.7 million represents approximately 93% cumulative growth over thirteen months, or roughly a doubling of the disclosed customer base. Both figures are company-asserted and have not been independently corroborated in the retained evidence.\n\nThe term 'monthly on-time payments' in Flex's press materials is most plausibly interpreted as the cumulative lifetime total of on-time monthly rent payment transactions facilitated, not a monthly run rate. Under this interpretation, $33B cumulative at an average rent of ~$1,500 implies roughly 22 million individual monthly rent events — consistent with 1–2 million active subscribers over several years. A ZoomInfo company profile, updated as of the run date, estimates Flex's annual revenue at $141.8M and its employee count at 501–1,000. These are ZoomInfo modeled estimates, not audited figures, and should be treated as directionally informative at best.\n\nA bottom-up proxy yields comparable ranges. If 700,000–1,000,000 of the 2.7 million cumulative customers are concurrently active in any given month, subscription revenue alone would be $125M–$180M annually ($14.99 × 12 × 700K–1M). The 1% bill payment fee applied to the monthly rent volume of those same active users (assuming $1,500 average rent) yields $126M–$180M annually from transaction fees. Combined, the two primary fee lines could plausibly generate $250M–$360M in gross revenue at the high end of the active-subscriber range, or $125M–$180M at the low end — the ZoomInfo estimate of $141.8M falls near the lower bound. All these figures are proxies built on company-asserted inputs and unverifiable assumptions; they are illustrative, not confirmatory.",
