    {
      "id": "capital-structure-financing-dependency",
      "title": "Capital structure and banking partner dependency",
      "body": "Flex's financial model is structurally dependent on a federally insured banking partner to issue the underlying consumer credit. Flexible Finance, Inc. itself is not a bank and does not disburse loan proceeds. All lines of credit and loans are issued and disbursed by Lead Bank or Column N.A., Member FDIC. Brokering activities are legally performed by Flexible Finance Brokering, Inc. (NMLS #2599800), which holds state lending licenses in at least 20 states according to Flex's public licenses page. Collection and servicing are performed by Flexible Finance Servicing, Inc. (NMLS #2256673), which holds a separate collection license set. A third entity, Flexible Finance Payments, LLC (NMLS #2713261), is listed on the legal page but not described in detail.\n\nAs of early 2026, Flex is transitioning its banking partner from Lead Bank to Column N.A. Column N.A. is a nationally chartered bank described as API-first and purpose-built for fintech partners; Lead Bank similarly positions itself as a financial infrastructure provider for fintechs. Neither partner relationship contract has been publicly disclosed. The transition from Lead Bank to Column N.A. requires customers to accept updated terms in the Flex app by June 1, 2026, or face potential interruption of service. The transition also requires some customers to update payment methods registered in their property's rent portal, adding execution risk.\n\nThe banking-partner dependency is a two-sided credit risk. Flex advances the full month's rent to the property manager before the consumer has repaid the second installment. The partner bank bears the credit risk on the line of credit itself (it is the lender of record), but Flex's stated policy is to handle write-offs internally, absorbing the residual economic exposure when a renter defaults rather than passing it to the property. This implies Flex has some form of credit-risk-sharing or credit-enhancement arrangement with its banking partners, though the terms are not public. Plaid is used as the bank-linking and income-verification layer, disclosed explicitly in the bank account linking guidelines.\n\nNo public disclosure of Flex's equity funding, debt facilities, cash position, or capital adequacy metrics was found in the retained evidence. The Company Overview chapter confirms that no venture round, investor identity, or round size has been publicly disclosed. This creates an unusually opaque capital picture for a company reporting 2.7 million customers.",
