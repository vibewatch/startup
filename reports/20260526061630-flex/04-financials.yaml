    {
      "id": "unit-economics-cost-structure-gaps",
      "title": "Unit economics proxies and cost structure gaps",
      "body": "Flex's cost structure for the Flex Rent product is not publicly detailed, but the architecture implies several material cost layers. The subscription fee ($14.99/month) and the bill payment fee (1%) together cover: the cost of funds from the banking partner (interest paid on advances), credit losses on consumers who default, operating and compliance costs of the NMLS-licensed brokering and servicing entities, technology and platform costs, and consumer-support costs. The large BBB complaint volume and the WSBTV investigation suggest consumer support costs are material.\n\nGross margin is entirely private. For comparison, the most structurally similar publicly traded consumer fintech credit products (BNPL and rent-to-own) typically show gross margins of 20–55% after credit losses and funding costs, before SG&A. Flex's margin structure is likely tighter because the Flex Rent line is short-duration (monthly), unsecured, and targeted at renters with fair-or-better credit who may have limited ability to absorb payment timing failures. The 'what if resident doesn't pay' help article confirms Flex absorbs all write-offs without passing costs to properties — this internal write-off absorption is a real cost that the fee stack must cover.\n\nCustomer acquisition cost (CAC) is also private. Flex's distribution model relies principally on embedding Flex as a payment option within property management system portals — Yardi, RealPage, Entrata, AppFolio, MRI, Zego, and Rent Manager. This PMS-embedded model means Flex likely incurs partnership and integration costs rather than traditional direct-to-consumer advertising spend, which may keep CAC lower than comparably scaled consumer fintech companies that rely on paid channels. However, the revenue per account is also capped at ~$14.99/month plus roughly $18/year in bill fees on a $1,500 monthly rent — perhaps $197/year in aggregate. If CAC exceeds one year of revenue per account, the payback period would be materially negative.\n\nService-delivery cost includes the Plaid-based income-verification flow (a per-transaction API cost), the banking partner relationship fees, and ACH payment execution. None of these unit costs are publicly disclosed. The 1% bill payment fee appears designed to cover these transaction-level costs, while the $14.99 membership contributes to overhead and, ideally, gross profit.",
