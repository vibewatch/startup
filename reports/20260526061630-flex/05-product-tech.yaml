    {
      "id": "SE002",
      "title": "Technology Stack and Property Management Integrations",
      "body": "Flex has built a property management software integration layer as its primary distribution channel, enabling residents to activate Flex Rent directly within the PMS portal they already use to pay rent. By mid-2026 Flex has integration agreements with seven of the major property management software platforms: Yardi RentCafe (announced June 2024), RealPage (August 2024, covering 1.3 million-plus units), Entrata (September 2024), AppFolio (2025), Zego Pay, Rent Manager, and MRI Software. These integrations allow residents to sign up for Flex without leaving the property management portal, reducing friction substantially. For properties not served by any of these platforms, Flex provides a direct-landlord payment flow in which Flex sends an ACH transfer directly to the landlord on the resident's behalf. The banking infrastructure is undergoing a material transition: Column N.A., described as an API-first, nationally chartered bank purpose-built for developers and fintechs with direct Federal Reserve connections, is replacing Lead Bank as the primary banking partner. Flex also relies on Plaid for bank account verification and income data aggregation during onboarding. Property managers access resident-level account data and management controls through the Flex Hub (Property Hub) dashboard. Independent property managers who use no PMS can participate through a manual enrollment workflow documented in Flex's partner knowledge base.",
