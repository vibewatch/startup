  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      Flex sits between renters (who need payment flexibility) and property managers (who need on-time full rent), using
      partner-bank credit to bridge the timing gap while earning subscription and transaction fees from renters.
    data:
      nodes:
        - id: renter
          label: Renter
          detail: Needs to split rent across two pay periods; applies via Flex app (soft credit check).
        - id: flex-platform
          label: Flex platform
          detail: Approves line of credit, collects two installments from renter, charges $14.99/mo + 1% fee.
        - id: bank-partner
          label: Column N.A. / Lead Bank
          detail: Issues the unsecured line of credit; Flex is the broker and servicer.
        - id: property-manager
          label: Property manager / landlord
          detail: Receives full rent on due date at zero cost; integrates via Yardi, RealPage, Entrata, etc.
        - id: credit-bureaus
          label: Credit bureaus
          detail: May receive positive rent payment data; credit-building benefit for renter.
      edges:
        - from: renter
          to: flex-platform
          label: Applies; pays two installments + fee
        - from: bank-partner
          to: flex-platform
          label: Issues line of credit to eligible renters
        - from: flex-platform
          to: property-manager
          label: Pays full rent on due date
        - from: flex-platform
          to: credit-bureaus
          label: Reports positive payment history (optional)
        - from: property-manager
          to: flex-platform
          label: Integrates via PMS (Yardi, RealPage, etc.); zero-cost adoption
        - from: flex-platform
          to: bank-partner
          label: Brokering and servicing activities; portfolio management
    approximationNotes: >-
