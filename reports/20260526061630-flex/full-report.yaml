  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Five-stage renter customer journey from awareness through advocacy, with acquisition channels, conversion
      touchpoints, and the PMS-embedded distribution model that makes operator adoption a prerequisite for scaled renter
      reach.
    data:
      items:
        - label: Awareness
          channel: Property portal / app (PMS-embedded) or word-of-mouth
          description: >-
            Renter sees 'Split your rent payment' banner or button in Yardi RentCafe, RealPage LOFT, Entrata
            ResidentPortal, AppFolio, MRI, Zego, or Rent Manager portal. Awareness is almost entirely operator-mediated;
            direct-to-consumer awareness is secondary.
        - label: Evaluation
          channel: Flex app onboarding / getflex.com/rent
          description: >-
            Renter clicks banner and is redirected to Flex signup. Flex performs soft credit check (no credit score
            impact), income verification, and shows split schedule with full fee disclosure upfront. Renter can abandon
            before committing.
        - label: Activation
          channel: First rent payment via Flex
          description: >-
            Renter approves split schedule, Flex pays full rent to property on due date, renter completes first
            installment. Membership auto-renews monthly at $14.99 + 1% transaction fee. For non-portal renters, property
            manager must complete bank account setup first.
        - label: Retention
          channel: Monthly auto-renewal; app usage; credit-building reporting
          description: >-
            Subscription renews automatically each month. Renters can turn off autopay month-to-month without canceling,
            preserving credit line. Flex reports positive rent history to TransUnion. Cancellation requires app
            navigation and 2-day lead time; outstanding balance goes to collections if canceled mid-cycle.
        - label: Advocacy
          channel: App store reviews; word-of-mouth; Flex testimonials page
          description: >-
            Satisfied renters leave app reviews (4.8-star claimed average, 340,000+ reviews) and organic word-of-mouth
            within properties. Flex curates paid testimonials on getflex.com/reviews (labeled 'Paid testimonials;
            results may vary'). Negative advocacy manifests in BBB complaints and consumer media investigations.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU024
      - CU025
  - id: FU002
    title: Adoption and Deployment Funnel
    type: funnel
    layout: standard
    summary: >-
      Deployment funnel from total available U.S. rental units to confirmed active Flex renters, illustrating the
      sequential reduction at each stage. Values are approximate and sourced from company disclosures and market
      context; the denominator gaps are material evidence gaps.
    data:
