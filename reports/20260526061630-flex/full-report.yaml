      - number: '1.3'
        title: Leadership, governance, and funding — significant evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The public evidence base for Flex's founders, executive leadership, board composition, and funding history
              is materially thin. No founder names for Flexible Finance, Inc. appear in the retained sources — not in
              official company pages, press releases, or the ZoomInfo profile. This stands in contrast to typical
              venture-backed fintech companies at similar scale. Ryan Metcalf is publicly identified as VP of Public
              Affairs in official March 2026 and February 2025 press releases and is the named media contact. ZoomInfo's
              profile lists partial job titles (Chief Financial Officer with initials only) but does not disclose names,
              backgrounds, or reporting structure. The careers page on getflex.com confirms the company has open roles
              but does not disclose headcount.


              Equally notable is the absence of any public funding disclosure. No venture round, investor name, or
              valuation figure appears in the retained sources. No press release announcing a fundraise was found.
              Neither Crunchbase-style third-party profiles nor Flex's own pages disclose Series A, B, or any round.
              ZoomInfo's page does not list investors. CBInsights' profile links to Flex press releases but lists no
              funding events. This is unusual for a company that by its own account serves 2.7 million consumers and
              processes $33 billion in monthly payments. The most likely explanation is that Flex has chosen to keep its
              capital structure private, but it cannot be ruled out that public funding databases simply have not
              indexed the company under the correct legal entity.


              Because founders and capital history are unknown, key-person dependence and governance cannot be assessed
              from public evidence. The leadership table and stakeholder map below are therefore highly partial — they
              are anchored on what public sources do disclose (the banking partners and integration partners) rather
              than what a normal company overview would want to say about equity ownership and board control.
