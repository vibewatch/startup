      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >-
              Flex's market has three distinct buyer/user/payer archetypes. The primary user is the cost-burdened or
              pay-cycle-stressed renter: 22.7 million US renter households spending more than 30% of income on housing,
              with a median net worth of just $10,400 and only $1,800 in cash savings. Flex's own Q1 2026 survey of
              approximately 1,000 active users found that 73% had experienced an unexpected financial shock in the past
              month, 54% had three weeks or fewer of savings, and 70% rated their own credit as fair or poor. The renter
              pays Flex's membership fee — approximately $14.99 per month — in exchange for access to sub-monthly
              payment splitting, making this segment both the user and the payer.


              The second segment is the credit-building renter: individuals who are credit-invisible or subprime and
              seek to convert their rent payments into a credit history record. Fannie Mae's Desktop Underwriter now
              incorporates rent payment history for thin-file borrowers, providing a GSE-backed mechanism for rent
              payments to influence mortgage access. This tailwind expands the perceived value proposition for renters
              beyond cash-flow management to long-term credit trajectory.


              The third segment is the property management company (PMC). Enterprise PMCs (top 50 by units, led by
              Greystar at 946,742 units) are the primary distribution channel and adopt Flex through existing PMS
              integrations at zero cost. Independent PMCs (owner-operators of 1–50 units) represent an emerging
              direct-onboarding channel. In both cases, the PMC pays nothing — Flex's zero-cost-to-PMC model is the core
              GTM driver — and the PMC benefits from reduced late payments and evictions. Table TM003 maps these
              segments; Figure FM003 visualizes comparative fit.
            claimRefs: []
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM014
              - CM015
