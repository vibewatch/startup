      - number: '7.2'
        title: >-
          Consumer credit, default, and underwriting model risk: Flex advances rent before collecting from
          credit-stressed renters
        blocks:
          - type: paragraph
            body: >-
              Flex's business model requires it to advance the full month's rent to the property manager before the
              renter's second payment is received. This means Flex bears actual credit exposure on every live account
              for the roughly two-week period between first-half payment and second-half collection. The scale of this
              exposure is material: at 2.7 million cumulative customers and a claimed $33 billion in payments processed,
              even a modest default rate creates significant loss exposure per year.


              Flexpartners documentation confirms the risk allocation: the partner help article on 'What if my resident
              doesn't pay Flex back?' confirms that Flex advances rent to the property regardless of whether it has yet
              collected from the renter, and that non-payment by the renter creates a balance owed to Flex. This
              confirms that Flex, not the property manager, bears the default risk. The resident qualifications
              documentation (flexpartners.zendesk.com) states that Flex evaluates credit report data, bank account
              information, and payment history, and that 'residents who are fair or better credit, with sufficient
              deposits and average bank balances will qualify.' The Signing Up help article confirms that SSN, income
              verification, and Plaid bank linking are required at onboarding.


              The underwriting model risk is significant because Flex's target demographic is structurally
              credit-stressed. The March 2026 Financial Health Survey found that 70% of active Flex renters rated their
              own credit as fair or poor, and 47% spent more than they earned in the prior year. These are not low-risk
              borrowers. The causal study in the same survey used a regression-discontinuity design on applicants near
              the approval margin — a population that is by construction close to the underwriting threshold and not
              representative of the full approved pool. No loss rate, charge-off rate, delinquency rate, or reserve
              coverage has ever been publicly disclosed for the Flex Rent product.


              The income verification article discloses that Flex uses income data as part of its underwriting, but the
              specific signals used, model architecture, and independent validation record are not public. Model risk
              increases in economic downturns: at the moment renter financial stress rises most — job loss, medical
              emergency, reduction in hours — Flex's default rate would likely spike precisely when its own capital base
              is most constrained. The Harvard JCHS America's Rental Housing 2026 report documents that renter
              affordability pressure has been rising for years, with cost-burden rates elevated especially among
              low-income renters. Flex's user base skews heavily toward this population.


              The Flex Funds feature (help.getflex.com/...31677734448663) allows renters to pre-fund a balance that
              reduces default risk for individual accounts, but it is not available to all customers and does not
              address systemic default in a downturn. The bank account linking guidelines
              (help.getflex.com/...26169491459735) confirm that Flex monitors account balances ongoing through Plaid,
              which may allow earlier detection of deteriorating financial health, but no automated credit-limit
              adjustment, proactive account pause, or loss-mitigation workflow is publicly described. The adverse
              question here is whether Flex's approval model, applied to credit-stressed renters in a rising-rent,
              low-savings environment, is effectively creating a cycle where the cost of the product ($14.99/month plus
              1% fee) for a renter paying $1,500/month is roughly $30/month, or $360/year — a meaningful additional cost
              burden for households already spending more than they earn.
