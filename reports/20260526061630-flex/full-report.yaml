        - Broadest deposit-adjacent coverage options; employer-sponsored offering available
        - Deposit / move-in focused only; no ongoing payment flexibility
      - - ClickPay (Entrata subsidiary)
        - Incumbent — rent payment platform
        - Part of Entrata group; claims broad property portfolio coverage
        - Property managers of all sizes needing multi-channel payment processing
