      - number: '1.2'
        title: Scale, operations, and platform integrations
        blocks:
          - type: paragraph
            body: >-
              By March 2026, Flex reported having served 2.7 million customers to date and having processed more than
              $33 billion in monthly on-time rent payments. The company also reported a 4.8-star average rating across
              more than 340,000 reviews. These figures come from official Flex press materials and have not been
              independently corroborated in the retained evidence. An earlier February 2025 press release cited 1.4
              million renters and $14.8 billion in on-time rent payments, with trust from more than 2,000 property
              management companies across more than eight million units nationwide — figures that were consistent with
              messaging in partner announcements from Yardi, RealPage, and Entrata during 2024.


              Flex's operational scale is partly validated by its integration footprint. During 2024 and 2025, Flex
              announced or expanded integrations with the seven largest property management software platforms: Yardi
              (RentCafe, 2024), RealPage (August 2024), Entrata (September 2024), AppFolio (October 2025), MRI Software,
              Zego (Powered by PayLease), and Rent Manager. Several of these integrations are confirmed by the partner
              companies' own press releases and support pages. The company also states that properties using Flex
              include members of NMHC's 2025 top-50 property managers list. Flex's mobile application on Google Play
              (package name: com.avance.consumer) has accumulated over one million downloads.


              A March 2026 causal study commissioned by Flex tracked credit bureau outcomes for 9,613 applicants over
              five quarters using a regression discontinuity design, finding no worsening of measured financial outcomes
              among those approved for Flex Rent versus those narrowly denied. The February 2025 Flex Financial
              Well-Being Survey of approximately 1,000 active Flex renters found 92% avoided late fees and 82% reported
              a reduced risk of eviction while using Flex. Both studies are company-funded and have not undergone
              independent peer review, which limits how definitively they can be cited.
