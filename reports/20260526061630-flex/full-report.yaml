        - label: 'TAM — Total annual US residential rent spend: ~$600–750B'
          detail: >-
            ~44M US renter households × median ~$1,400/mo × 12 months. Broadest payment-volume ceiling; not all
            represents demand for flexibility.
          tone: neutral
        - label: 'SAM — Cost-burdened renter segment: ~$280–350B'
          detail: >-
            22.7M cost-burdened renter HHs (Harvard JCHS 2026, record high 2024) with structural pay-cycle timing
            mismatch and limited savings.
          tone: neutral
        - label: 'PMS-accessible SAM — 8M+ units with Flex integrations: ~$165B'
