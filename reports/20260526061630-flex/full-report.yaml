  - id: TP004
    slug: moat-durability-competitive-risk-register
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Threat Actor
      - Severity
      - Supporting / Complicating Evidence
      - Mitigation / Diligence Ask
    rows:
      - - Deepest PMS integration footprint (7 platforms) among rent-split providers
        - Yardi, RealPage, Entrata, or Zego building native flexible-rent features or favoring Best Egg
        - High
        - >-
          Yardi co-launched Flex and Best Egg simultaneously in June 2024, confirming lack of exclusivity; Zego
          white-labels Flex today but Global Payments has infrastructure to internalize the product
        - >-
          Obtain and disclose whether any PMS integration agreements include exclusivity provisions or minimum volume
          commitments; assess Zego's product roadmap for native flex-rent
      - - Zero-cost-to-operator model drives rapid property adoption
        - >-
          PMS vendors offering competing zero-cost flexible rent as a standard feature at no incremental cost to
          operators
        - High
        - >-
          If RealPage or Yardi builds native flexible rent, the zero-cost attribute no longer differentiates Flex;
          operators would migrate to the embedded native option with less change management friction
        - >-
          Assess degree to which Flex has sticky operator-level commercial agreements (multi-year contracts, volume
          minimums) that reduce migration risk
      - - 2.7M renter base creates switching cost via enrollment, credit profile, and Flex Funds inertia
        - Competing provider winning PMS distribution and prompting property-level migration
        - Medium
        - >-
          Renter re-enrollment is a friction point but not prohibitive; Flex Funds balance is a minor retention
          incentive; property-level switching by operators would force mass renter migration regardless of individual
          preference
        - >-
          Quantify renter churn rate and re-enrollment costs; assess whether Flex Funds creates material lock-in vs.
          operational inconvenience
      - - Bilt's credit card rewards model is not a cash-flow relief product and does not directly compete
        - Bilt expanding to include payment splitting or cash advance features targeted at cost-constrained renters
        - Medium
        - >-
          Bilt's 4M+ home network, Wells Fargo capital, and zero-fee positioning give it the infrastructure to add
          installment features at low marginal cost; TransUnion data shows renters self-reporting rent payments at
          rising rates, indicating appetite for renter-side fintech products
        - >-
          Monitor Bilt product roadmap for cash-advance or split-pay feature announcements; Bilt's primary identity as a
          rewards product historically limits its appeal to prime renters who do not need financial relief
      - - Pioneer status and brand recognition in flexible rent niche
        - Adverse consumer complaint record (BBB, Mother Jones) degrading trust vs. newer entrants with clean records
        - Medium
        - >-
          Mother Jones 2023 investigation and BBB 400+ complaint file represent differentiated adverse signals not borne
          by Bilt, Esusu, Obligo, or Jetty; WSBTV local investigation documented customer service failures; adverse
          trust gap could slow enterprise property manager adoption if institutional buyers conduct customer reference
          checks
        - >-
          Review whether Flex has disclosed improvement in BBB complaint rate or resolution rate since 2023; assess
          impact on NMHC Top 50 property manager pipeline
      - - Regulatory and compliance infrastructure (NMLS-registered, Lead Bank / Column N.A. bank partnerships)
        - >-
          State-level BNPL or rental-assistance regulation treating Flex's product as a consumer loan requiring
          additional disclosures or fee caps
        - Medium
        - >-
          TransUnion 2025 report documents California mandate for rent reporting and Colorado pilot; increasing
          state-level regulatory interest in renter-protection products; Flex's transition from Lead Bank to Column N.A.
          in 2026 shows operational banking risk; CFPB complaint pathway documented on Flex's help center
        - >-
          Assess whether Flex's product structure is subject to emerging BNPL or consumer lending regulations in key
          states; evaluate Column N.A. transition risk for service continuity
    notes: >-
      Severity ratings are qualitative assessments based on available public evidence. High = near-term displacement
      risk if unmitigated; Medium = material but addressable. Moat claims reference data from getflex.com, yardi.com,
      realpage.com, gozego.com, bilt.com, and motherjones.com as cited in this chapter's evidence.
