      - number: '5.3'
        title: User Onboarding, Identity Verification, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Residents must complete a structured onboarding workflow to activate Flex Rent. The process requires
              providing a Social Security Number for identity verification, completing income verification either
              through Plaid's income data feed or by uploading supporting documents such as pay stubs or bank
              statements, and linking a bank account via Plaid's tokenized ACH authorization. Flex applies a
              qualification check that evaluates the resident's income relative to their rent burden and account
              standing. Once approved, the resident selects their property from the PMS integration list or initiates a
              direct-payment setup. Flex charges a monthly membership fee of up to $14.99 per month, a 1 percent bill
              payment fee, and a 2.5 percent fee for credit or debit card-funded transactions. On-time rent payments
              through Flex are reported to TransUnion, giving residents a potential credit-building benefit. Flex
              maintains a consumer complaint process via its help center and accepts complaints from regulatory bodies.
              Cancellation of Flex while carrying an outstanding balance may result in collections proceedings through
              third-party collectors, a risk that has generated documented consumer complaints in public forums. The
              compliance infrastructure is anchored by NMLS registration, TILA disclosures, Plaid-based KYC, and
              TransUnion credit reporting—all standard elements for a fintech credit product—but the company's
              state-by-state license coverage is not publicly enumerated.
