  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Flex operates a two-sided market with a third ecosystem layer. On the demand side, renter end-users are
              the fee-paying customers: they pay a $14.99 monthly membership fee plus a 1% bill payment fee on each rent
              transaction (with an additional 2.5% processing fee for credit cards). Renters are the primary revenue
              source; they receive split-payment convenience, potential credit-building, and budgeting flexibility in
              exchange. On the supply side, property operators and managers — ranging from individual landlords to large
              institutional property management companies — are the distribution channel and value-creation endpoint.
              Operators pay zero to offer Flex and receive the guaranteed full-rent, on-time payment benefit that
              reduces their collections overhead and improves cash flow predictability. The third layer is the PMS
              ecosystem: seven integrated platforms (Yardi/RentCafe, RealPage/LOFT, Entrata/ResidentPortal, AppFolio
              Payments Platform, MRI PMX, Zego Pay/Zego Living, and Rent Manager TWA/rmResident) act as embedded
              distribution rails, surfacing Flex as a native payment option within the resident portal experience.


              Flexible rent is relevant to the broadest cross-section of U.S. renters, but Flex's accessible demographic
              skews toward renters who live paycheck-to-paycheck, have biweekly pay cycles misaligned with monthly rent
              due dates, or carry limited savings buffers. The March 2026 Flex Financial Health Survey of approximately
              1,000 active Flex renters found that 70% rated their own credit as fair or poor, and 47% spent more than
              they earned over the prior year — signaling a lower-income, credit-constrained core user base. No precise
              demographic breakdown by income, age, or geography is publicly available, though AppFolio's 2025 Renter
              Preferences Report found that 77% of renters aged 18–24 and 74% aged 25–34 ranked flexible rent payments
              as highly important when choosing a home, suggesting disproportionate demand among younger renters.


              Geographically, Flex claims availability across all 50 U.S. states through its PMS integrations, though
              state licensing disclosures (Vermont and certain states) indicate regulatory heterogeneity. No
              international customer base has been disclosed. A non-portal pathway exists for renters who pay by check
              or direct transfer: Flex can invite property managers without a PMS integration to connect their bank
              account directly, extending reach to independent landlords, though this pathway requires property manager
              opt-in and involves greater friction.
