          Requires credit loss track record to remain benign and PMS moat to hold; no public evidence confirms either
          yet.
        - Bank transition attrition >20%; CFPB enforcement action; any top-5 PMS integration termination.
      - - Base
        - >-
          Growth moderates to 30–50% annually; revenue reaches $200M–$350M within 5 years; M&A exit to PMS platform
          (Yardi, RealPage) or mortgage servicer at 4–6x revenue.
        - >-
          Implied equity $800M–$2.1B at strategic acquisition. Zero-cost-to-PMC model accretive to PMS platforms adding
          resident financial services revenue.
        - >-
          Most defensible scenario from current evidence: Flex has sufficient scale and integration lock-in to be an
          attractive acquisition target.
        - No strategic acquirer emerges; IPO market closes; credit losses surprise to the upside.
      - - Bear
        - >-
          Bank transition causes >30% subscriber loss; CFPB or state enforcement restricts the consumer credit offering;
          credit losses exceed fee revenue; growth stalls; down-round or distressed exit.
        - Implied equity <$300M at distressed sale or restructuring. Down-round financing below any prior round marks.
        - >-
