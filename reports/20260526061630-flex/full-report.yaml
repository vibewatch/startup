  - id: FI004
    title: Capital intensity and cash-flow map — Flex Rent credit flow
    type: flow
    layout: wide
    summary: >-
      Flex fronts full-month rent to the property manager on the renter's behalf, then recovers through two consumer
      installments. The banking partner (Column N.A.) is the legal lender of record. Flex bears residual write-off risk
      after collections. This map shows the cash-flow dependencies and where credit risk resides.
    approximationNotes: >-
      Flow is constructed from official documentation (banking partner pages, help articles, TILA disclosure,
      FlexPartners articles). No contract terms, cost-of-funds rates, or revenue shares are disclosed; nodes reflect
      publicly confirmed roles only. Directional cash flows are schematic.
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI027
      - CI029
      - CI030
    data:
      nodes:
        - id: cf1
          label: Renter (consumer)
          description: >-
            Pays membership fee on the 15th and two rent installments per month. Linked to Flex via debit/credit card;
            income verified via Plaid at sign-up.
        - id: cf2
          label: Plaid
          description: >-
            Provides bank account linking and income verification API. Required for renter sign-up and eligibility
            assessment.
        - id: cf3
          label: Column N.A. / Lead Bank (banking partner)
          description: >-
            Issues the Flex Rent unsecured revolving line of credit; legal lender of record; disburses the full month
            rent to the property manager before renter repayment. Regulated by FDIC.
        - id: cf4
          label: Property manager
          description: >-
            Receives full-month rent via ACH within 2–5 business days. Pays $0 to Flex. Integrated via
            Yardi/RealPage/Entrata/AppFolio/MRI/Zego/Rent Manager.
        - id: cf5
          label: Flex (Flexible Finance, Inc.)
          description: >-
            Collects membership fee and bill-payment fees from renters. Bears write-off risk on defaults — does not pass
            delinquency costs to property managers. Operates brokering (NMLS #2599800) and servicing (NMLS #2256673)
            entities.
