      - number: '8.2'
        title: Valuation context, revenue proxy, and comparable set
        blocks:
          - type: paragraph
            body: >-
              Flex's revenue is not publicly disclosed, but two independent modeling approaches converge on a
              $100M–$200M annual range. ZoomInfo's B2B intelligence model estimates annual revenue at $141.8M with
              501–1,000 employees. A bottom-up proxy built from the subscription pricing ($14.99/month) and transaction
              fee (1%) applied to an estimated 700,000–1,000,000 concurrent active subscribers at a median $1,500
              monthly rent yields $125M–$180M annually. Growjo's growth trajectory estimate and usearch's revenue range
              are broadly consistent. These figures are modeled, not audited, and the ratio of concurrent-active
              subscribers to Flex's stated 2.7 million cumulative customers is unknown — a meaningful uncertainty given
              that cumulative counts include inactive and churned users.


              Applying standard SaaS-adjacent and fintech revenue multiples to the $125M–$180M modeled range illustrates
              the valuation space. At 3–6x revenue (mature consumer fintech baseline), implied equity value is
              $375M–$1.08B. At 6–10x revenue (growth premium for 70%+ YoY growth and distribution moat), implied equity
              is $750M–$1.8B. Neither range is a price-supported valuation; both are multiples-on-estimates scenarios
              that require significantly more diligence to anchor.


              The comparable set is constrained by private company data limitations. Bilt Rewards (rent rewards, large
              multi-round funding per public reporting) operates in an adjacent segment targeting higher-income renters
              via card interchange rather than fee-split, making it a directional but imperfect comp. Esusu Financial
              (rent credit-building, reported substantial funding through 2022) operates a B2B multifamily data stack
              more than a consumer rent-splitting product. Rhino and Jetty (security deposit and renters insurance
              respectively) compete in the adjacent multifamily fintech ecosystem with different unit economics.
              Semrush's competitive analysis identifies Bilt, Esusu, and payment processing platforms as the primary
              digital traffic competitors to Flex. Fannie Mae's positive rent payment reporting program named Esusu,
              Jetty, and Rent Dynamics as initial approved vendors — Flex is not listed, which may represent a
              competitive gap in the credit-building value proposition offered to cost-burdened renters seeking mortgage
              pathway benefits.
