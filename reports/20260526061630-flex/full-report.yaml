  - id: TM001
    slug: market-definition-table
    title: Market definition table
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All major product categories in or adjacent to the US rent payment flexibility market, based on competitor and
        adjacent-product research conducted in the 2025-2026 window.
    columns:
      - Market Segment
      - In-Scope for Flex
      - Rationale
      - Key Products / Substitutes
    rows:
      - - Rent payment timing flexibility
        - ✓ Core market
        - >-
          Renters split monthly rent into two or more sub-monthly payments; PMC receives full contractual amount on the
          lease due date.
        - Flex Rent (core product); no direct full-feature equivalent
      - - Rent payment credit building
        - ✓ Adjacent feature
        - >-
          On-time rent payments reported to Equifax, Experian, TransUnion to build credit history for renters with thin
          or no credit file.
        - Esusu Financial, Jetty Credit, Rent Dynamics, Flex Credit Builder
      - - Security deposit alternatives
        - ✗ Excluded
        - >-
          Replaces upfront cash security deposit with insurance or billing; different buyer economics; one-time problem
          vs ongoing cash-flow.
        - Obligo, Jetty Deposit, Say Rhino
      - - Rent rewards and loyalty programs
        - ✗ Excluded
        - >-
          Earns loyalty points on rent spend via card; targets higher-income renters; revenue model is interchange, not
          renter fee.
        - Bilt Rewards
      - - Traditional digital rent collection
        - ✗ Excluded
        - Processes rent payments for PMC without addressing renter timing mismatch, credit building, or flexibility.
        - ClickPay (RealPage), Zillow Rent Pay, Zego Pay
      - - High-cost short-term credit substitutes
        - ✗ Excluded (adverse context)
        - >-
          Payday loans, bank overdraft, cash advances — status-quo alternatives renters use to bridge timing gap;
          high-cost and credit-harmful.
        - Payday lenders, bank overdraft programs, credit cards at 20%+ APR
    notes: >-
      Market boundaries drawn as of run date 2026-05-26. PMS = Property Management Software. PMC = Property Management
      Company.
