      - Category
      - Scale / Presence (company-stated unless noted)
      - Target Customer
      - Product Scope
      - Key Differentiation
      - Key Limitation
    rows:
      - - Flex (Flexible Finance, Inc.)
        - Direct — rent split
        - 2.7M customers; $33B on-time payments processed; 8M+ units; 7 PMS integrations (Mar 2026 company press)
        - Renters in professionally managed multifamily properties
        - >-
          Rent splitting via unsecured LOC from partner bank; credit building; 7 PMS integrations; zero cost to
          operators
        - >-
          Pioneer with broadest PMS footprint; 4 in 10 NMHC Top 50 managers; embedded in Yardi, RealPage, Entrata,
          AppFolio, MRI, Zego, Rent Manager
        - $14.99/month + 1% fee creates consumer friction; adverse consumer complaint record (BBB, Mother Jones, WSBTV)
      - - Best Egg Flexible Rent (Marlette Holdings)
        - Direct — rent split
        - Not disclosed; co-launched with Flex in Yardi/RentCafe June 2024
        - Renters via Yardi RentCafe platform
        - Rent splitting via Yardi integration; flat-fee pricing model (per Yardi PR)
        - >-
          Alternative rent-split option within the dominant PMS; flat-fee pricing may differ from Flex's percentage
          model
        - No independent public metrics; narrow PMS reach; no disclosed integrations beyond Yardi
      - - Bilt Rewards
        - Adjacent — rent rewards
        - 4M+ homes in Bilt property network (company-stated May 2026); Wells Fargo co-branded Mastercard
        - Renters seeking travel and lifestyle rewards on rent; premium renters
        - >-
          Bilt Points on rent (in-network free, BillPay out-of-network); credit building (free reporting); Rent Day
          monthly benefits; transfer partners
        - >-
          Loyalty economics via Wells Fargo card; no renter fee in network; aspirational brand positioning; credit
          reporting for free
        - Does not solve payment timing or cash-flow gap; premium card model excludes credit-constrained renters
      - - Esusu
        - Adjacent — rent reporting / financial wellness
        - VC-backed; not disclosed; active in affordable housing / LIHTC portfolios
        - Renters seeking credit building; property managers in affordable housing
        - >-
          Rent payment reporting to all 3 credit bureaus; credit hub; financial coaching; identity / fraud services;
          analytics
        - Comprehensive financial wellness suite; affordable housing alignment; can co-deploy with Flex at same property
        - No payment advancing or splitting; does not address cash-flow timing problem
      - - Obligo
        - Adjacent — deposit alternative
        - 1M+ homes (company-stated); VC-backed
        - Property managers seeking deposit alternatives; renters with low upfront cash
        - No-deposit / reduced-deposit / installment deposit / full-deposit models; digital move-out payment flow
        - Replaces security deposit friction with billing on file; streamlines move-in and move-out cash flows
        - Targets move-in cost only; no impact on ongoing monthly rent timing or payment splitting
      - - Jetty
        - Adjacent — deposit alternative + insurance
        - VC-backed; scale not publicly disclosed
        - Renters seeking lower move-in costs; property managers
        - Security deposit alternative; renters insurance; credit building (free rent reporting); membership benefits
        - Suite approach to rental affordability across multiple friction points at move-in
        - Move-in focused; no ongoing monthly rent-split or timing product
      - - Rhino
        - Adjacent — deposit insurance + renter guarantee
        - VC-backed; scale not publicly disclosed
        - Renters and property managers at move-in
        - >-
