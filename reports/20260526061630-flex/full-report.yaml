  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Flex competes in the rent payment flexibility market — the segment of residential fintech that enables
              renters to split a single monthly rent obligation into two or more sub-monthly installments while ensuring
              the property management company (PMC) receives the full contractual amount on the lease due date. The core
              problem Flex addresses is the structural pay-cycle mismatch: most US rental leases require full payment on
              the first of the month, yet more than half of American workers are paid biweekly or weekly. This mismatch
              is a design artifact of an era when wages were monthly and rent was collected in person; it has persisted
              into the digital era without meaningful structural change from the landlord side.


              The market boundary is narrow relative to the broader residential real estate technology landscape.
              Security deposit alternatives (Obligo, Jetty) serve different buyer economics and solve a one-time upfront
              cost rather than ongoing cash-flow timing. Rent rewards programs (Bilt Rewards) target higher-income
              renters and generate revenue via card interchange rather than renter fees. Traditional digital rent
              collection processors (ClickPay, Zillow Rent Pay) process payments without addressing timing mismatch or
              credit building. Rent reporting / credit building services (Esusu, Jetty Credit, Rent Dynamics) overlap on
              the credit-building dimension but do not address the timing problem. Payday loans, overdraft facilities,
              and credit cards are the primary status-quo substitutes renters use when they cannot meet the monthly
              deadline, each carrying high costs and limited credit-building upside. Table TM001 maps these boundaries
              explicitly.
            claimRefs: []
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: 'Market Size: Sizing Lenses and Evidence Constraints'
        blocks:
          - type: paragraph
            body: >-
              Sizing the rent payment flexibility market requires several lenses because no independent analyst has
              published a directly applicable TAM figure. The broadest ceiling is the total annual US residential rent
              payment volume, estimated at $600–$750 billion based on approximately 44 million renter households and a
              median rent of $1,400 per month (Harvard JCHS 2026). Not all of this spend represents demand for
              flexibility; the SAM narrows to renters experiencing cash-flow stress or credit-building need.


              The most defensible SAM anchor is the 22.7 million US renter households that are cost-burdened — spending
              more than 30% of income on rent and utilities — a figure that reached a record high in 2024 per Harvard's
              Joint Center for Housing Studies. At median rent levels, this cohort represents roughly $280–$350 billion
              in annual rent spend. A second, product-specific SAM lens is the 8 million-plus units currently accessible
              through Flex's PMS integrations, which represent roughly $165 billion in annual rent payment flow assuming
              median Class A/B rents.


              Flex's current SOM is directly observable from company disclosures: 1.4 million active renters and $14.8
              billion in on-time payments processed as of early 2025. The credit-building sub-segment adds a further
              sizing dimension: 26 million Americans are credit-invisible, and approximately 70% of Flex users report
              fair or poor credit — a population for whom on-time rent reporting represents a meaningful pathway to
              financial inclusion. Evidence constraints are described in Table TM002 and illustrated in Figures FM001
              and FM002.
