            ~50M renter-occupied housing units in the U.S. (Harvard JCHS 2026 estimate); Flex accessible to a subset
            only
        - label: Units on PMS platforms with Flex integration
          value: 8000000
          examples: 8M+ units across Yardi, RealPage, Entrata, AppFolio, MRI, Zego, Rent Manager (company-asserted, Mar 2026)
        - label: Units at properties where Flex is actively offered
          value: 5500000
          examples: >-
            ~5.5M units estimated actively marketed; '8M+ units' reflects enrolled-property capacity across all 7 PMS
            integrations but Flex acknowledges not all operators on a PMS necessarily activate Flex. Estimate is
            illustrative; actual count not publicly disclosed.
        - label: Renters who applied for and were approved
          value: 3200000
