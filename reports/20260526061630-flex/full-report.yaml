  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Mechanism and Financial Architecture
        blocks:
          - type: paragraph
            body: >-
              Flex Rent is a revolving, unsecured line of credit that enables renters to split a single monthly rent
              obligation into two installments without requiring the landlord to change any billing process. When a
              resident activates Flex Rent, the platform pays 100 percent of the rent to the landlord on or before the
              lease due date—funded by a line of credit issued through Lead Bank or Column N.A.—and the resident then
              repays Flex in two parts: approximately 54 percent due around the first of the month and the remaining 46
              percent due around the 15th, aligned to the resident's pay schedule. Critically, Flex itself does not
              disburse funds; all ACH transfers are executed exclusively by its banking partners. This structure
              insulates Flex from being classified as a money transmitter while keeping full legal responsibility for
              the credit obligation within a NMLS-registered entity. The company operates through three legal entities:
              Flexible Finance Inc. (the parent), Flexible Finance Brokering Inc. (NMLS #2599800, which arranges the
              line of credit), and Flexible Finance Servicing Inc. (NMLS #2256673, which services the obligation). The
              product is subject to Truth-in-Lending Act disclosures, and Flex publishes a TILA fee schedule on its
              legal page. The overall financial architecture is designed to be landlord-agnostic: the landlord receives
              full rent on time and needs no technical integration with Flex to benefit. All credit risk and consumer
              protection obligations reside on Flex's side of the transaction.
            claimRefs:
              - CE001
