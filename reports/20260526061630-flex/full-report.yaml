  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and consumer fee stack
        blocks:
          - type: paragraph
            body: >-
              Flex's primary revenue mechanism is a recurring monthly membership fee combined with percentage-based
              transaction fees charged to consumers. The monthly membership fee is $14.99, billed on the 15th of each
              month as long as the Flex Rent line of credit is active. The fee renews automatically and continues to
              accrue even when a consumer turns off rent autopay — the line of credit remains open and the membership
              charge persists until the consumer completes a formal cancellation. This is a subscription-like model that
              generates revenue from active accounts independent of monthly transaction activity.


              On top of the subscription, Flex charges a 1% bill payment fee on the gross rent amount for every
              transaction, regardless of payment method. Consumers paying by credit card are charged an additional 2.5%
              card processing fee, bringing the total fee to 3.5% of rent for credit card users. The 1%/3.5% fee is
              split proportionally across the two monthly installment payments rather than charged as a lump sum. An
              optional $3 monthly property-passthrough fee applies at a subset of properties — Flex's pricing page notes
              this as an add-on for certain property partnerships.


              Flex Move-in, the installment loan product for move-in costs, is priced separately under a term loan
              structure at 16.95%–23.84% APR based on state of residence, loan duration, and eligibility factors. There
              is also a 1% bill payment fee on the initial payment for Move-in loans. Flex Bills, the extension of the
              split-payment model to utility and household bills, carries a fee of up to 3% per transaction plus up to
              1.5% for credit card use. The Flex Rent credit line itself is an unsecured revolving line subject to a
              Truth in Lending Act (TILA) disclosure published on Flex's legal page, which in its sample form cites an
              18% APR and a $7.99 membership — this sample may reflect a prior pricing tier or a different product
              variant from the current $14.99 published rate.


              For property managers, the product is explicitly priced at $0 — Flex recovers all its economics from
              renters. This zero-cost-to-property model is core to Flex's distribution strategy and is confirmed by both
              the official property-facing pages and the property partner help articles.
