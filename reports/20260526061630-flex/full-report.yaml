      - number: '3.2'
        title: Direct and Adjacent Fintech Competitors
        blocks:
          - type: paragraph
            body: >-
              Among Tier 1 direct peers, Best Egg Flexible Rent (operated by Marlette Holdings) is the only publicly
              named competitor to Flex inside a major PMS ecosystem. Yardi's June 2024 press release announcing flexible
              rent integrations named both Flex and Best Egg as providers available in RentCafe, making it the first
              documented case of two rent-split products competing within the same portal. Best Egg's offering is
              described as flat-fee pricing (distinct from Flex's percentage-based model), but no scale metrics,
              customer counts, or funding details are publicly disclosed. The co-presence of Flex and Best Egg on Yardi
              establishes multi-homing risk — Yardi may route renters to either provider — reducing Flex's de facto
              exclusivity on the world's largest property management platform.


              In Tier 2, Bilt Rewards represents the most strategically differentiated adjacent competitor. Bilt's model
              is a co-branded Mastercard (issued by Wells Fargo) that earns points on rent payments processed through
              its 4-million-plus-home partner network. Bilt charges renters no fee for rent payments made inside its
              partner network; outside the network, renters use BillPay at a cost. Bilt does not split rent payments or
              solve the timing-gap problem; its value proposition is aspirational loyalty (points, travel rewards,
              exclusive neighborhood experiences) rather than financial relief. This means Bilt competes for renter
              attention and property manager mindshare rather than the specific cash-flow need Flex addresses. Bilt's
              Wells Fargo partnership and credit card infrastructure represent significant capital depth that Flex does
              not have.


              Esusu targets the same institutional multifamily customer as Flex but with a rent-reporting and financial
              wellness suite rather than a payment splitting product. Esusu reports rent payments to all three major
              credit bureaus, offers financial coaching, and has expanded into identity and fraud services and analytics
              for property managers. Esusu is particularly active in affordable housing and LIHTC portfolios. Its
              credit-building pitch overlaps with one of Flex's secondary benefits, creating competition for operator
              marketing attention. The key difference is Esusu does not advance rent — it reports payments that have
              already been made — so Esusu and Flex can coexist at the same property without direct conflict.


              Obligo, Jetty, and Rhino compete in the security deposit and move-in-cost layer. Obligo processes
              deposit-free move-ins for over 1 million homes (company-stated) using a billing-on-file model. Jetty
              offers a deposit alternative, renters insurance, and free rent payment credit reporting. Rhino provides
              security deposit insurance, cash deposit management, renters insurance, and a renter guarantee. None of
              these three address ongoing monthly payment timing, and all three typically co-deploy at properties
              alongside payment products. However, each brand competes for operator attention, property website real
              estate, and the limited set of technology integrations an operator is willing to adopt. As Jetty adds
              credit building and Esusu expands into rent payments, the boundaries between tiers are blurring.
