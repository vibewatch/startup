            ~3.2M cumulative approved applicants estimated; derived from 2.7M confirmed customers and an assumed >80%
            approval rate (income-verified, soft-credit-check model). Approval rate and application volume not publicly
            disclosed; estimate is illustrative only.
        - label: Active Flex members (renters currently subscribed)
          value: 2700000
          examples: >-
            2.7M customers to date (Mar 2026, cumulative since founding per GlobeNewswire); active monthly subscribers
            vs. cumulative count not distinguished
