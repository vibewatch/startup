      - number: '8.3'
        title: 'Bull, base, and bear scenarios: distribution moat versus credit and regulatory risk'
        blocks:
          - type: paragraph
            body: >-
              The bull case requires that Flex's PMS integration network continues to drive low-cost subscriber growth,
              that the bank-partner transition completes without material attrition, and that credit losses remain
              manageable within the fee revenue envelope. If 3–4 million concurrent active subscribers are onboarded
              within three to five years, annualized revenue could reach $500M–$700M without new product lines. At an
              8–12x revenue exit multiple (strategic acquirer or late-stage IPO), implied equity value is $4B–$8.4B. The
              comparable fintech premium at that scale would be supported by distribution moat, regulated multi-state
              licensing, and PMS network effects that are hard to replicate. This scenario requires that Flex's 93%
              growth rate sustains at at least half its current pace and that credit quality remains benign.


              The base case assumes growth moderates to 30–50% annually as the easiest PMS integrations are fully
              absorbed and retention proves sticky but not perfect. Revenue reaches $200M–$350M within three to five
              years. At a 4–6x exit multiple (private strategic acquisition by Yardi, RealPage, or a large mortgage
              servicer), implied equity value is $800M–$2.1B. This is the most defensible outcome from current evidence:
              Flex has enough scale and integration lock-in to be attractive as an M&A target, and its zero-cost-to-PMC
              model makes it accretive to PMS platforms seeking to add resident financial services revenue.


              The bear case is driven by three independent pathways: (1) the June 2026 bank-partner transition causes
              significant subscriber loss among customers who do not complete re-enrollment under Column N.A. terms; (2)
              CFPB or state regulatory scrutiny of the consumer credit structure leads to enforcement action or product
              restriction; or (3) delinquency rates on the unsecured revolving credit book materially exceed the level
              covered by the 1% bill-payment fee and $14.99 subscription economics. Under the bear case, growth stalls
              and operational costs associated with compliance or credit remediation compress margins. A strategic exit
              below $300M or a down-round refinancing becomes the likely outcome. The Mother Jones and WSBTV adverse
              record, active BBB complaint file, and CFPB complaint escalation language in Flex's own help center are
              all directional support for the bear case being a non-negligible probability.
            claimRefs:
