      - number: '1.4'
        title: Adverse signals, consumer complaints, and open risk issues
        blocks:
          - type: paragraph
            body: >-
              The adverse record for Flex is non-trivial and directly relevant to the company overview. In June 2023,
              Mother Jones published an investigative article documenting cases in which renters experienced
              payment-timing confusion, unexpected late fees charged by landlords, and what the article described as
              housing portal mandates that effectively required tenants to use Flex without meaningful opt-out. The
              article included named consumer accounts of financial distress triggered by the gap between Flex's stated
              payment deadlines and the deadlines communicated to individual renters. Flex responded to the article but
              did not directly refute the described cases.


              A local television investigation by WSBTV (Channel 2 Action News, Atlanta) reported on a Cobb County
              resident who experienced payment failures when updating her payment method, received over 30 emails over
              more than a month without resolution, and stated she could not find a way to cancel the service. Flex
              acknowledged in a written statement to the outlet that the response time had been inadequate. At the time
              of the WSBTV investigation, the report noted BBB had received more than 400 complaints over the prior
              year, and Flex had a 1-out-of-5-star BBB rating. The BBB New York profile as of the run date shows the
              complaint history remains active.


              Flex provides a formal consumer complaints process described on its help center, directing consumers with
              unresolved issues to file complaints with the Consumer Financial Protection Bureau (CFPB), state financial
              regulators, and in New York, the Department of Financial Services. This is standard practice for
              NMLS-registered lenders but is notable because it implicitly confirms that consumer disputes have reached
              the level requiring regulatory channels. The banking partner transition from Lead Bank to Column N.A. in
              2026 adds a second operational risk dimension: customers who do not accept the new terms by June 2026 may
              lose access to Flex, creating a potential gap in rent payment continuity. None of these adverse signals
              are individually disqualifying, but they constitute a meaningful pattern of operational trust friction
              that later chapters on product and risk should investigate in depth.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO041
              - CO042
              - CO043
