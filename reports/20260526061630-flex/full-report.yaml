        - Delinquency rate by bucket (30/60/90 DPD); net charge-off rate; reserve coverage ratio
      - - Customer lifetime value (LTV)
        - Not disclosed; theoretical LTV at 0% churn and $197/year ARPU → multi-year stream; actual LTV unknown
