      - number: '7.3'
        title: >-
          Partner, bank, and infrastructure dependency risk: bank migration, Plaid single point of failure, and PMS
          concentration
        blocks:
          - type: paragraph
            body: >-
              Flex's operating model depends on three categories of critical external dependencies: bank partners that
              originate and disburse loans, Plaid for bank account verification and ongoing balance monitoring, and PMS
              platforms for embedded distribution to renters.


              Bank partner risk is currently acute. The help article 'Notice of Change — Lead Bank to Column N.A.'
              (published ahead of a June 1, 2026 deadline) documents a live migration of the banking backend from Lead
              Bank to Column N.A., Member FDIC. The article states that customers who do not accept the new terms by
              June 1, 2026 may have their access to Flex interrupted, and that customers who pay via their property's
              rent portal must update their payment method to the new Flex-provided bank account or debit card before
              their next payment date. This migration affects the underlying account structure — not just a backend swap
              — creating material execution risk: if property managers or renters fail to complete the update in time,
              rent payments may fail, generating the same class of harm documented in the BBB complaints, Mother Jones,
              and WSBTV investigations. The migration also reveals concentration risk: Flex currently operates with two
              bank partners (Lead Bank and Column N.A.), and the transition implies that Lead Bank's role is being wound
              down. If Column N.A. were to exit the relationship or face regulatory issues of its own, Flex would need
              to find a new FDIC-chartered bank partner — a process that can take months and requires OCC or FDIC
              approval of bank-fintech program agreements.


              Plaid dependency is a critical single-point-of-failure in the underwriting and payment collection
              pipeline. The bank account linking guidelines confirm that Flex uses a third-party aggregator (consistent
              with Plaid's public description) to verify bank accounts and monitor balances. Plaid serves more than
              12,000 financial institutions and processes over 1 million daily connections. A Plaid outage, API change,
              or regulatory restriction — including CFPB rulemaking on data aggregator access (Section 1033 of
              Dodd-Frank, which issued final rules in 2024) — could disrupt Flex's ability to onboard new customers or
              monitor existing accounts. CFPB's 1033 rule is particularly relevant: it requires financial institutions
              to make account data available to consumers and their authorized third parties, but it also allows
              financial institutions to set rate limits and restrict access for data security reasons, which could
              affect Plaid's ability to provide real-time balance monitoring at the scale Flex requires.


              PMS platform concentration is the third layer. Flex's seven active integrations (Yardi, RealPage, Entrata,
              AppFolio, MRI, Zego, Rent Manager) provide distribution to approximately 8 million+ units. The RealPage
              'strategic partnership' framing (preferred technology provider) creates both a moat and a concentration
              risk: if RealPage were to switch to a different flexible payment provider, launch its own product, or
              change integration terms, Flex could lose access to the more than 1.3 million units the RealPage
              partnership announcement cited. Similar risks apply to Yardi, which serves an even larger share of
              institutional multifamily properties. None of the integration agreements are publicly disclosed, and the
              'strategic partnership' language does not indicate exclusivity or long-term contractual protection. The
              NAAHQ 2025 AppFolio Benchmark Report notes that PMS adoption and technology integration strategies are
              evolving rapidly among property managers, increasing the risk that competitive dynamics displace existing
              integrations.
