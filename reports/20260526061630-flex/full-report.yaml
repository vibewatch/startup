      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment recommendation: research-more'
            body: >-
              Flex has real scale, a defensible PMS distribution moat, and a large structural pain point. But no cap
              table, no audited financials, no credit loss data, an active bank-partner transition, and a material
              adverse consumer record make a buy recommendation unsupportable from public evidence alone. The call is
              research-more with medium confidence and high risk. What would move the call to buy: full cap-table
              disclosure, audited revenue and credit quality, and a confirmed clean bank-transition outcome.
            calloutType: insight
            claimRefs: []
          - type: callout
            title: Bear case is non-negligible
            body: >-
              Three independent bear-case pathways exist: bank transition attrition, CFPB enforcement, and credit loss
              surprise. The Mother Jones, WSBTV, and BBB adverse record is more consistent with structural operational
              risk than isolated incidents. Investors should not discount the bear case as a tail scenario when
              underwriting without private data room access.
            calloutType: insight
            claimRefs: []
