    layout: standard
    summary: >-
      Five nested layers map the rent payment flexibility TAM from total US residential rent spend (~$675B/yr) down to
      Flex's current SOM (1.4M renters, $14.8B processed). Each layer narrows by eligibility, distribution access, or
      awareness — with the widest constraint being PMS integration reach and the renter acquisition funnel within it.
    approximationNotes: >-
      All TAM and SAM figures are model-derived from Harvard JCHS 2026 renter household and rent burden data. No
      independent third-party market sizing report for the rent payment flexibility category has been published.
