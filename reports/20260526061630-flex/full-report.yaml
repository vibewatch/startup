            body: >-
              Beyond Flex Rent, the company offers Flex Bills (the same split-payment mechanism applied to utility and
              bill payments), Flex Funds (a reserve account allowing residents to set aside up to 1.2 times their
              monthly rent, available on a debit-only basis to eligible accounts), and Flex Move-in (a separate term
              loan product with an APR range of 16.95 percent to 23.84 percent offered in three- or six-month terms,
              currently in early access only). The core Flex Rent product is the most mature, with seven PMS
              integrations, more than four years in market, and corroborated outcome metrics from third-party partner
              announcements. Flex Funds and Flex Move-in are materially earlier in availability and have limited public
              documentation. The banking infrastructure migration from Lead Bank to Column N.A. is an active execution
              risk: Flex issued a formal migration notice to Connecticut users by June 2026 with an acceptance deadline,
              indicating the transition is not yet complete. The company has not published a product roadmap, and
