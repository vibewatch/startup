  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold / event
      - transmission to thesis
      - action implication
    rows:
      - - CFPB enforcement action
        - Confirmed public enforcement action against Flex consumer credit structure or fee disclosure adequacy.
        - >-
          Directly undermines the regulated-lending thesis; may force product restriction or fee cap, materially
          compressing revenue.
        - Immediate pass; full thesis reassessment required before re-engagement.
      - - Bank partner withdrawal
        - >-
          Column N.A. or a future banking partner terminates the credit-issuance agreement without a qualified
          replacement ready.
        - Without a bank partner Flex cannot issue the consumer line of credit; entire core product ceases to function.
        - Immediate pass; no recovery path without alternative bank arrangement confirmed in advance.
      - - Confirmed down-round financing
        - Publicly reported equity round at valuation materially below any prior disclosed or estimated mark.
        - >-
          Signals growth-below-investor-expectations; preference stack overhang grows; dilution risk increases; moat
          narrative weakens.
        - Reopen pricing assessment from scratch; require full cap table disclosure before any investment.
      - - Top-5 PMS integration termination
        - Any announced termination or non-renewal of Yardi, RealPage, Entrata, AppFolio, or MRI Software integration.
        - >-
          Distribution moat thesis is challenged; growth trajectory could break if a single platform represents more
          than 20% of acquisition flow.
        - Track integration renewal risk in diligence; require integration contract duration and exclusivity disclosure.
      - - Credit charge-off above 5%
        - >-
          Net charge-off rate on the consumer revolving credit book disclosed or credibly estimated at above 5% of
          outstanding balances.
        - >-
          At modeled $141.8M revenue, even 2–3% charge-off on a $200–400M credit book could approach or exceed fee
          revenue; bear case becomes base case.
        - >-
          Immediate reassessment of bear case probability; require audited credit quality data before any investment
          commitment.
    notes: >-
      None of these triggers can be monitored from public evidence alone; private data room access or ongoing
      portfolio-company reporting is required to establish baseline metrics.
