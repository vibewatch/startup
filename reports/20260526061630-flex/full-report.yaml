    slug: competitor-profile-table
    title: Competitor Profile Table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers direct rent-split peers, fintech-adjacent rental products, major PMS portals, and status-quo substitutes
        as of May 2026, based on publicly disclosed products and company websites; does not include stealth-stage
