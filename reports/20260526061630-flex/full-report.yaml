      - number: '8.4'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Flex's most natural exit paths from current evidence are a strategic acquisition by a property management
              software platform or a large mortgage/financial services company, a secondary sale at a later funding
              round, or an eventual IPO — none of which has been publicly signaled. Bloomberg's private company profile
              confirms Flex remains privately held with no public equity listing. The careers page shows active growth
              investment across engineering, product design, and marketing functions, consistent with a company still
              building to scale rather than preparing for near-term liquidity. RocketReach and usearch employee profiles
              confirm 501–1,000 headcount, consistent with a $100M+ revenue company but below the threshold typically
              needed to support a standalone public offering.


              The five most material diligence gaps, in order of priority: (1) capital structure — any investor in Flex
              needs to know the preference stack, liquidation waterfall, and anti-dilution provisions from all prior
              rounds before making a price-sensitive decision; (2) audited or reviewed financials — the ZoomInfo and
              Growjo revenue estimates are modeled, not verified; (3) credit book quality — delinquency rates,
              charge-off rates, and banking partner loss-recourse terms are entirely opaque; (4) bank-partner transition
              outcome — whether Column N.A. migration completes without material subscriber loss will be determinative
              for near-term revenue continuity; and (5) regulatory posture — any active CFPB inquiry, state AG
              investigation, or DFS examination that is not publicly disclosed could be a thesis-breaking event.


              Thesis-break triggers are definable from available evidence. A confirmed CFPB enforcement action against
              the Flex consumer credit structure would immediately undermine the regulatory risk assumption. A publicly
              reported down-round financing would signal that growth has stalled below investor expectations. A material
              property management software platform choosing to build competing functionality in-house would threaten
              the distribution moat. Any announced exit from a top-five integration partner within 12 months would
              represent a concentration risk event requiring immediate reassessment. These triggers, combined with the
              ongoing adverse consumer record, define the monitoring watch list for a research-more recommendation.
