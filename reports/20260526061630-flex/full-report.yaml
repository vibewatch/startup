  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and legal risk: consumer credit classification, licensing gaps, and disclosure obligations'
        blocks:
          - type: paragraph
            body: >-
              Flex Rent is legally structured as an unsecured line of credit, not a payment facilitation or subscription
              service. The footer disclosures on the flexpartners payment timing page and the Signing Up for Flex Rent
              help article make this explicit: 'All loans, banking services, and payment transmissions are offered by
              Lead Bank or Column N.A., Member FDIC. An application and credit assessment are required. Unsecured lines
              of credit for Flex Rent are provided for a recurring monthly membership fee up to $14.99.' Two distinct
              NMLS-registered entities operate the non-bank functions: Flexible Finance Brokering, Inc. (NMLS #2599800)
              and Flexible Finance Servicing, Inc. (NMLS #2256673). Neither Flex nor its subsidiaries disburse loan
              proceeds or move consumer funds — all origination and disbursement flows through the bank partners.


              This structure creates several regulatory exposure layers. First, TILA compliance: Flex publishes a Truth
              in Lending disclosure for its 3-fee variant
              (getflex.com/legal/flex-rent-truth-in-lending-disclosure-3-fee), which indicates that at least some
              pricing configurations require formal credit cost disclosures. The core membership fee model —
              $14.99/month plus 1% of rent — does not present a simple APR, and CFPB guidance on fintech credit products
              has consistently focused on whether recurring fees effectively constitute finance charges that must be
              disclosed as APR. If regulators or courts determine that the effective APR on a $1,500 rent advance repaid
              over two payments is materially higher than disclosed, Flex faces TILA restatement risk, class action
              exposure, and potential consent order obligations.


              Second, the state licensing landscape is heterogeneous. The getflex.com/legal/licenses page discloses
              state-by-state license status, and the Vermont disclosure on the payment timing page makes an unusually
              restrictive statement: 'THIS IS A LOAN SOLICITATION ONLY. FLEXIBLE FINANCE BROKERING, INC. IS NOT THE
              LENDER. INFORMATION RECEIVED WILL BE SHARED WITH ONE OR MORE THIRD PARTIES IN CONNECTION WITH YOUR LOAN
              INQUIRY.' This carve-out implies that Flex cannot fully operate in Vermont as it does elsewhere, and it
              signals that other state regulators may require similar modifications. Any state that characterizes Flex's
              product differently from the bank-origination framing — for example, as a rent-to-own, payday-adjacent, or
              wage-advance product — could trigger licensing requirements or cease-and-desist actions that Flex's
              current structure does not satisfy.


              Third, data and privacy obligations: the SSN-requirement help article and the income verification and bank
              linking articles reveal that Flex collects Social Security Numbers, income data, bank account credentials
              (via Plaid), and ongoing bank balance information. This data collection footprint creates GLBA, state data
              privacy law (CCPA, CPRA, and analogs), and biometric/financial privacy obligations that are not publicly
              documented in a consumer-facing privacy notice or data-processing disclosure. The getflex.com/legal page
              contains the consumer-facing legal documents but does not publicly disclose a data retention schedule,
              third-party data sharing register, or GLBA-compliant privacy notice at the level of specificity regulators
              routinely request. Fourth, Fannie Mae's positive-rent-payment-reporting program and the Federal Housing
              Finance Agency's September 2025 order creating a rent-to-homeownership pathway mean that Flex's credit
              reporting practices are now embedded in a regulated ecosystem with increasing FHFA and GSE oversight of
              rent-data flows.


              The adverse stance on this risk: a CFPB examination of Flex's fee disclosure practices — which already
              attract high complaint volume and consumer harm allegations — could rapidly escalate from inquiry to
              consent order. CFPB has settled or issued consent orders against multiple fintech lenders using
              membership-fee models (e.g., Earnin, Dave, MoneyLion) precisely because recurring fees create effective
              APRs that look different from the nominal framing.
