chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and regulatory positioning
        blocks:
          - type: paragraph
            body: >-
              Flex, operating through Flexible Finance, Inc., is a financial technology company incorporated and
              headquartered in New York, New York. The company was founded in 2019 and describes its mission as
              transforming the rental experience by providing financial flexibility to renters. Its core product, Flex
              Rent, enables renters to split a single monthly rent payment into two installments that align better with
              typical biweekly pay cycles: Flex pays the full rent to the landlord or property manager when due, and the
              renter repays Flex in two parts over the month. This is made possible through an unsecured revolving line
              of credit issued by a federally insured partner bank. Historically, that partner was Lead Bank; as of
              early 2026, Flex is transitioning some customers to Column N.A., Member FDIC.


              Flex is not a bank and does not hold a banking charter. All loans, lines of credit, and payment
              transmissions are provided by Lead Bank or Column N.A., Member FDIC; brokering activities are performed by
              Flexible Finance Brokering, Inc. (NMLS #2599800); and servicing and collection activities are performed by
              Flexible Finance Servicing, Inc. (NMLS #2256673). An application and credit assessment are required for
              eligibility, though Flex markets this as a soft credit check that does not harm the applicant's credit
              score. Positive rent payment history may be reported to national credit bureaus, which Flex frames as a
              credit-building benefit for renters.


              The consumer fee structure is public: a $14.99 monthly membership fee plus a 1% bill payment fee on each
              rent transaction, with an additional 2.5% card processing fee when a credit card is used (3.5% total for
              credit card payments; 1% for debit). Property managers pay nothing to offer Flex. Beyond Flex Rent, the
              company also offers Flex Bills, which extends the split-payment model to utility and household bill
              payments.
