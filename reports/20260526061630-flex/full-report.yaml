  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Capital structure and cap table
        - >-
          Investor identities, round sizes, post-money valuations, preference terms, liquidation waterfall,
          anti-dilution provisions, and pay-to-play history from all prior rounds.
        - >-
          Without cap table, any entry price is blind to dilution and preference overhang; prior investor preference
          stack could materially affect equity value at exit.
        - Flex management; require cap table as condition of term sheet; verify via legal data room.
      - - Audited or reviewed financials
        - >-
          Audited P&L, balance sheet, and cash flow statement for at least the last two fiscal years; ideally reviewed
          by a Big 4 or top-10 accounting firm.
        - >-
          ZoomInfo and Growjo revenue estimates are modeled; audited financials are the only way to verify revenue,
          margins, burn, and unit economics.
        - >-
          Flex CFO (Kristine Dickson per ZoomInfo); request reviewed financials as condition of entering exclusivity or
          final term sheet.
      - - Credit book quality and banking partner terms
        - >-
          Delinquency rates, net charge-off rates, aging-of-receivables, banking partner cost-of-funds, and
          loss-recourse provisions for the Flex Rent revolving credit book.
        - >-
          The unsecured consumer credit book is the primary operational risk; losses not covered by fee revenue could
          make the model unviable at scale.
        - >-
          Flex CFO and Column N.A. banking partner via data room; request credit risk reporting and banking agreement
          term sheet.
      - - Bank-partner transition outcome
        - >-
          Final subscriber counts before and after Lead Bank to Column N.A. migration; attrition rate from customers who
          did not accept new terms by June 2026.
        - >-
          Transition attrition is a near-term revenue risk; a 20%+ subscriber loss would materially revise the base case
          trajectory.
        - Flex customer operations team; request post-migration analytics in Q3 2026 diligence update.
      - - Regulatory posture and CFPB interaction history
        - >-
          Any active CFPB inquiries, state AG investigations, DFS examinations, NMLS enforcement actions, or formal
          complaint dispositions not visible in public NMLS records.
        - >-
          A non-disclosed regulatory inquiry could be a thesis-breaking event; CFPB BNPL enforcement precedent makes
          this a material risk for the Flex consumer credit structure.
        - >-
          Outside counsel regulatory opinion; NMLS enforcement action search; formal regulatory representation and
          warranty in investment documents.
    notes: >-
      These five diligence items are sequential: capital structure should be disclosed first as it determines entry
      price; credit quality second as it determines model viability under stress.
