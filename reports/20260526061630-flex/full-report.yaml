  - id: TM004
    slug: growth-drivers-and-constraints-table
    title: Growth drivers and constraints table
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All major identified growth drivers and constraints for the US rent payment flexibility market as of 2025-2026,
        per Harvard JCHS, Fannie Mae, TransUnion, Mother Jones, WSBTV, and Flex company disclosures.
    columns:
      - Factor
      - Type
      - Evidence
      - Impact on Flex
      - Horizon
    rows:
      - - Structural pay-cycle mismatch (biweekly pay vs monthly rent)
        - Driver
        - 50%+ renters paid biweekly or weekly (Flex marketing; independent corroboration not in retained sources).
        - High — core product-market fit; persistent until lease structure changes
        - Permanent
      - - Rising rent cost burden (record 22.7M cost-burdened HHs)
        - Driver
        - 'Harvard JCHS 2026: cost burden at all-time high in 2024; median renter wealth $10,400 vs homeowner $396,500.'
        - High — expands SAM; intensifies demand for timing relief
        - Multi-year (structural supply deficit)
      - - Fannie Mae Desktop Underwriter rent payment history
        - Driver
        - >-
          DU uses rent history since Aug 2022 for thin-file borrowers; Esusu, Jetty Credit, Rent Dynamics are approved
          vendors (Fannie Mae).
        - High — adds credit-building incentive for renters; differentiates Flex from payment processors
        - Current and ongoing
      - - State rent reporting mandates (CA, CO)
        - Driver
        - >-
          California requires PMC rent reporting; Colorado requires PMCs to offer reporting annually; TransUnion 2025
          anticipates more state mandates.
        - Medium — creates PMC-side compliance demand for rent reporting products
        - 2–5 year expansion
      - - Consumer protection and fee scrutiny
        - Constraint
        - >-
          TILA Reg Z applies to Flex as open-end credit; Mother Jones (2023) raised portal lock-in concerns; WSBTV
          (2024) documented payment failures causing late fees.
        - Medium — limits pricing flexibility; creates reputational and regulatory risk
        - Current
      - - PMS platform concentration and integration dependency
        - Constraint
        - >-
          5 PMS providers (Yardi, RealPage, Entrata, AppFolio, MRI) control the majority of professionally managed
          units; Flex distribution depends on sustained integration access.
        - Medium-High — any major PMS partner terminating access would reduce accessible unit base sharply
        - Current
      - - Fannie Mae multifamily pilot sunset (June 2025)
        - Constraint
        - >-
          Fannie Mae multifamily positive rent reporting pilot ended June 30, 2025; vendor cost subsidy removed; ongoing
          cost shifts to PMCs and vendors.
        - Low-Medium — reduces one external subsidy; does not eliminate single-family DU tailwind
        - Resolved (2025)
    notes: >-
      Driver = structural demand driver. Constraint = factor limiting adoption pace or market size realization. Horizon
      indicates whether the factor is currently active, multi-year, or resolved.
