  - id: FP001
    slug: competitive-positioning-map
    title: 竞争定位图
    type: quadrant
    layout: standard
    summary: >-
      Flex 位于分发深度高、价值宽度中等的象限——深度嵌入 PMS 门户，但给租户的价值主张比新兴套件更窄。Bilt 依托其银行卡网络，占据高价值 /
      低分发嵌入象限。既有门户（ClickPay、Zillow）处在低嵌入、低宽度象限。
    approximationNotes: >-
      X 轴：PMS 分发深度（1=独立 / 无 PMS 集成，5=嵌入 5+ 个主要 PMS 平台）。Y 轴：租户价值主张宽度（1=单一功能，5=拆分支付 + 信用积累 + 奖励 +
      财务辅导）。评分是有证据支持的序数评估，来自公开披露的产品页面和集成公告。象限：右上 = 宽价值 + 宽分发（Flex 目标状态）；右下 = 窄价值 + 宽分发（当前 Flex 区域）；左上 = 宽价值 +
      窄分发（Bilt、Esusu）；左下 = 窄价值 + 窄分发（ClickPay 独立版、Zillow）。
    data:
      points:
        - label: Flex
          x: 5
          'y': 3
          detail: 7 个 PMS 集成；2.7M 客户；拆分租金 + 信用积累；产品深度相对完整健康金融套件更窄
        - label: Best Egg
          x: 2
          'y': 2
          detail: 已确认 1 个 PMS（Yardi）；固定费用拆分租金；公开产品宽度数据有限
        - label: Bilt Rewards
          x: 2
          'y': 4
          detail: 4M+ 住宅网络，但不依赖门户；银行卡 + 信用上报 + Rent Day + 旅行奖励——面向优质租户的宽价值主张
        - label: Esusu
          x: 2
          'y': 4
          detail: 信用上报 + 辅导 + 分析 + 身份服务——最宽的健康金融套件；PMS 集成未公开确认
        - label: Zego + Flex
          x: 4
          'y': 2
          detail: 4 个已知 PMS 触点；通过 Flex 基础设施提供灵活租金；除 Flex 功能外，独立租户价值有限
        - label: ClickPay
          x: 3
          'y': 1
          detail: 宽泛的多渠道运营覆盖；没有租户健康金融功能；面向运营方的工具
        - label: Obligo
          x: 1
          'y': 2
          detail: 1M+ 住宅；押金替代 + 退租流程；没有持续月度拆分租金；PMS 深度有限
        - label: Zillow Rent Pay
          x: 1
          'y': 2
          detail: 无 PMS 集成；免费 ACH + 信用积累；仅面向直接房东分层
        - label: Jetty / Rhino
          x: 1
          'y': 2
          detail: 入住押金与保险产品；持续月租互动较窄；PMS 分发深度有限
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP014
