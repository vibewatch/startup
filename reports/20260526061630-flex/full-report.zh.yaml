        - 要求按渠道拆分 CAC；PMS 集成开发和维护成本；是否与 PMS 供应商收入分成
      - - 现金头寸、烧钱速度和现金跑道
        - 重大 — 没有这些，无法评估资本充足性和下一轮触发条件
        - 要求资产负债表和利润表；确认过去 8 个季度经营现金流趋势
      - - 股权融资、投资人和股权结构表
        - 重大 — 对于报告规模达到这一水平的公司，透明度异常低；评估治理、稀释和退出路径必须用到
        - 要求股权结构表；确认任何投资人姓名、轮次规模、优先股条款和清算优先权
    notes: 每一行都是私有证据缺口，截至运行日无法用公开来源解决。这些缺口合在一起，使财务评估达不到承销质量，也是投资或信贷决策的前置条件。
