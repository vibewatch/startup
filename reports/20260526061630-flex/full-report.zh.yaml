      - number: '3.2'
        title: 直接与相邻金融科技竞争者
        blocks:
          - type: paragraph
            body: >-
              在第一层直接同行中，Best Egg Flexible Rent（由 Marlette Holdings 运营）是唯一在主要 PMS 生态内公开具名的 Flex 竞争者。Yardi 2024 年 6
              月宣布灵活租金集成的新闻稿同时点名 Flex 和 Best Egg，称二者均可在 RentCafe 中使用，这是两个租金拆分产品在同一门户内竞争的首个记录案例。Best Egg 的产品被描述为固定费用定价（区别于
              Flex 的按比例收费模式），但没有公开披露规模指标、客户数或融资细节。Flex 和 Best Egg 同时出现在 Yardi 上，确立了多归属风险——Yardi 可以把租客导向任一供应商——削弱了 Flex
              在全球最大物业管理平台上的事实排他性。


              第二层中，Bilt Rewards 是战略差异最明显的相邻竞争者。Bilt 的模式是联名 Mastercard（由 Wells Fargo 发行），用户在其覆盖 400
              多万套住房的合作网络内处理租金支付可赚取积分。租客在合作网络内支付租金时，Bilt 不收费；网络外则通过 BillPay 付费使用。Bilt
              不拆分租金，也不解决时点缺口；它的价值主张是向往型忠诚度（积分、旅行奖励、专属社区体验），而不是财务纾困。因此，Bilt 争夺的是租客注意力和物业管理方心智，而不是 Flex 处理的具体现金流需求。Bilt 的
              Wells Fargo 合作和信用卡基础设施代表了 Flex 不具备的显著资本深度。


              Esusu 面向与 Flex 相同的机构多户住宅客户，但提供的是租金上报和财务健康套件，而不是支付拆分产品。Esusu
              向三大全国信用局上报租金支付，提供财务辅导，并扩展到身份、欺诈服务和面向物业管理方的分析。Esusu 在可负担住房和 LIHTC 组合中尤其活跃。它的信用建设话术与 Flex
              的次级收益之一重叠，会争夺运营方营销注意力。关键差别是 Esusu 不垫付租金——它上报的是已经完成的支付——因此 Esusu 和 Flex 可以在同一物业共存，不发生直接冲突。


              Obligo、Jetty 和 Rhino 在押金与入住成本层竞争。Obligo 用留档账单模式为超过 100 万套住房（公司自述）处理免押入住。Jetty 提供押金替代、租客保险和免费租金支付信用上报。Rhino
              提供押金保险、现金押金管理、租客保险和租客担保。这三家公司都不解决持续的月度支付时点问题，也通常与支付产品共同部署在物业中。不过，每个品牌都会争夺运营方注意力、物业网站展示位，以及运营方愿意采用的有限技术集成名额。随着
              Jetty 增加信用建设、Esusu 扩展到租金支付，各层之间的边界正在变模糊。
