      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              Flex 的市场有三类清晰的买方 / 用户 / 付款方画像。第一类核心用户是租金负担过重或受发薪周期压力挤压的租客：2,270 万个美国租房家庭住房支出超过收入 30%，净资产中位数仅
              $10,400，现金储蓄只有 $1,800。Flex 自己在 2026 年 Q1 对约 1,000 名活跃用户的调查发现，73% 过去一个月遭遇过意外财务冲击，54% 的储蓄只能支撑三周或更少，70%
              自评信用一般或较差。租客向 Flex 支付会员费——约每月 $14.99——换取月内拆分支付权限，因此这一群体既是用户也是付款方。


              第二类是信用建设型租客：没有可见信用记录或属于次级信用的人，希望把租金支付转化为信用历史记录。Fannie Mae 的 Desktop Underwriter
              现在把租金支付历史纳入薄档案借款人的评估，提供了一条由 GSE 支持的机制，让租金支付影响按揭可得性。这股顺风把租客感知到的价值主张从现金流管理扩展到长期信用轨迹。


              第三类是物业管理公司（PMC）。企业级 PMC（按套数排名前 50，由 946,742 套的 Greystar 领跑）是主要分销渠道，通过既有 PMS 集成零成本采用 Flex。独立 PMC（1–50
              套的业主运营方）代表正在出现的直接入驻渠道。两类场景下，PMC 都不付费——Flex 对 PMC 零成本的模式是 GTM 核心驱动——PMC 则受益于更少的逾期付款和驱逐。Table TM003
              映射这些分层；Figure FM003 可视化比较适配度。
