  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与消费者费用栈
        blocks:
          - type: paragraph
            body: >-
              Flex 的主要收入机制，是经常性月度会员费叠加向消费者收取的按比例交易费。月度会员费为 $14.99，只要 Flex Rent 信用额度处于激活状态，就在每月 15
              日扣费。该费用自动续费，即使消费者关闭租金自动支付也会继续累积——信用额度仍保持开放，会员费会持续产生，直到消费者完成正式取消。这是一种类订阅模式，从活跃账户产生收入，不依赖每月交易活动。


              在订阅之外，Flex 对每笔交易按总租金金额收取 1% 账单支付费，不区分支付方式。使用信用卡的消费者另付 2.5% 卡处理费，使信用卡用户总费用达到租金的 3.5%。1% / 3.5%
              费用按比例分摊到每月两笔分期中，而不是一次性收取。部分物业还适用可选的每月 $3 物业转嫁费——Flex 定价页将其标注为某些物业合作的附加项。


              Flex Move-in 是用于入住成本的分期贷款产品，按定期贷款结构单独定价，APR 为 16.95%–23.84%，取决于居住州、贷款期限和准入因素。Move-in 贷款的初始支付也有 1%
              账单支付费。Flex Bills 将拆分支付模式延伸到水电和家庭账单，每笔交易最高收费 3%，信用卡使用另最高收 1.5%。Flex Rent 信用额度本身是无抵押循环信用额度，受 Flex 法律页面发布的
              Truth in Lending Act（TILA，美国真实贷款法）披露约束；样例表格列出 18% APR 和 $7.99 会员费——该样例可能反映旧定价层级，或不同于当前公开 $14.99 价格的产品变体。


              对物业管理方，产品明确定价为 $0——Flex 从租客端收回全部经济性。这种对物业零成本模式是 Flex 分销策略的核心，并由官方物业端页面和物业合作方帮助文章共同确认。
