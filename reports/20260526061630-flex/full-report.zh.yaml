      - number: '1.2'
        title: 规模、运营与平台集成
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 3 月，Flex 称累计服务 270 万客户，并处理了超过 $33B 的按时月度租金支付。公司还披露，在超过 34 万条评价中平均评分为 4.8 星。这些数字来自 Flex
              官方新闻材料，未在本次留存证据中得到独立印证。更早的 2025 年 2 月新闻稿称，公司服务 140 万租客、处理 $14.8B 按时租金支付，并获得超过 2,000 家物业管理公司的信任，覆盖全国超过 800
              万套住房——这些表述与 Yardi、RealPage 和 Entrata 在 2024 年合作公告中的口径一致。


              Flex 的运营规模部分由其集成覆盖验证。2024 和 2025 年，Flex 宣布或扩展了与七大物业管理软件平台的集成：Yardi（RentCafe，2024 年）、RealPage（2024 年 8
              月）、Entrata（2024 年 9 月）、AppFolio（2025 年 10 月）、MRI Software、Zego（Powered by PayLease）和 Rent
              Manager。其中多项集成得到合作方自身新闻稿和支持页面确认。公司还称，使用 Flex 的物业包括 NMHC 2025 年前 50 大物业管理方名单中的成员。Flex 在 Google Play
              的移动应用（包名：com.avance.consumer）下载量已超过 100 万。


              Flex 委托开展的一项 2026 年 3 月因果研究，使用断点回归设计追踪 9,613 名申请人在五个季度内的信用局结果，发现获批 Flex Rent
              的人相较临界被拒的人，在被衡量的财务结果上没有恶化。2025 年 2 月的 Flex Financial Well-Being Survey 覆盖约 1,000 名活跃 Flex 租客，发现 92%
              避免了滞纳金，82% 称使用 Flex 降低了被驱逐风险。两项研究均由公司出资，且没有经过独立同行评审，因此可引用的确定性有限。
