        - Flex 声称覆盖多数 NMHC top-50 管理方；top-50 合计管理约 4M 个单元
        - 若属实为高风险；主张未验证带来不确定性
        - 若集中在 5–10 家运营方，失去任何一家都会显著影响单元量
