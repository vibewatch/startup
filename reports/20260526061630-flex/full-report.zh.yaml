        - 运营破裂：大规模付款失败事件会触发监管问询、客户补偿和 PMS 合作伙伴复审
    notes: 否决标准是会打破投资逻辑的事件——一旦出现，投资前提就需要实质性修订。触发阈值仅为示例；精确阈值应在对 Flex 的尽调中与管理层确认。
