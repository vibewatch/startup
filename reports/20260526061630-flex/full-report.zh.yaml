      - number: '6.4'
        title: 租客满意度、留存信号与耐久性缺口
        blocks:
          - type: paragraph
            body: >-
              Flex 的主要租客满意度证据来自两次公司委托的活跃 Flex 用户调查和一项因果研究。2025 年 2 月，Flex Financial Well-Being Survey 调查约 1,000
              名活跃租客，发现：92% 避免了滞纳金和罚金，82% 称被驱逐风险下降，85% 在过去一年省下钱，90% 改善了居住稳定性。2026 年 3 月 Financial Health Survey 同样在约
              1,000 名活跃 Flex 租客中进行（2026 年 Q1），发现 73% 在过去一个月遭遇意外财务冲击；在报告遭遇冲击的受访者中，60% 把 Flex
              拆分租金作为其财务管理策略的一部分。两项调查均由活跃用户自报——样本排除了已经流失的会员和被拒绝准入的申请人——因此明显向正面结果存在选择偏差。


              2026 年 3 月新闻稿还包含一项因果研究：使用断点回归设计，对 9,613 名 Flex Rent
              申请人通过信用局数据连续跟踪五个季度。研究发现，与刚好被拒的申请人相比，获得租金拆分访问权的获批申请人在任何已测信用结果（信用分、循环余额、使用率、逾期率、催收或债务水平）上都没有恶化。在若干指标上——更少信用查询、90
              天以上逾期余额更低、类 payday 产品使用更少——获批申请人结果略好。这一设计的方法强度高于简单调查，但研究由 Flex 委托、执行并发布，没有独立同行评审；并且，处在 Flex
              批准边界附近的人群不能代表所有租客。


              留存和流失数据在公开披露中完全缺席。公司没有发布 NRR、GRR、月度或年度流失率、平均会员期限，也没有队列级留存数字。订阅模型（自动续费 $14.99/月）会给不主动取消的租客带来自动粘性，但 BBB
              投诉档案和消费者调查记录了取消流程的摩擦。住户账户管理帮助页面确认，会员会自动续费，取消需要住户在 Flex app 中进入 “Settings > Account > Membership > Cancel
              membership”，且必须在月末前至少提前 2 天操作，才能避免额外月费。这种设计产生的留存信号，把真实价值满意度与取消摩擦混在一起。getflex.com/reviews
              页面显示有“截至目前已服务”的租客数，并显示“Flex 会员中有……觉得住房更稳定”的比例——页面上有具体数字，但留存文本抽取没有捕捉到，这是一个来源覆盖缺口。
