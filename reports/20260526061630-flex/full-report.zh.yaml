        - Greystar 946K 个单元、Asset Living 289K、Willow Bridge 221K；主要已接入 Yardi 和 RealPage；对住户体验有预算敏感性。
        - 中 — 延迟付款和驱逐都是成本中心
        - PMC 零直接成本；PMC 受益于拖欠和驱逐减少
        - PMS 集成合作；Flex 企业销售团队
      - - 独立 PMC（业主运营方，1–50 个单元）
        - 约 ~10M 个单元由小型业主运营方管理；通常没有 PMS；技术栈异质；Flex 直接入驻渠道自 2025 年起活跃。
