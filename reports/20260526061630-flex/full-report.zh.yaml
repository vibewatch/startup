  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Flex 竞争的市场是租金支付弹性市场——住宅金融科技中的一个细分板块，让租客把一笔月租拆成两笔或更多月内分期，同时确保物业管理公司（PMC）在租约到期日收到合同约定的全额款项。Flex
              解决的核心问题是结构性发薪周期错配：美国租约大多要求每月 1 日全额付款，但超过一半美国工人按双周或每周领薪。工资按月、租金线下收取的时代留下了这种错配；进入数字时代后，房东端也没有出现实质性结构调整。


              相比更广泛的住宅地产科技版图，这个市场边界较窄。押金替代方案（Obligo、Jetty）面对不同买方经济学，解决的是一次性前置成本，而不是持续现金流时点。租金奖励计划（Bilt
              Rewards）面向更高收入租客，通过银行卡交换费赚钱，而不是向租客收费。传统数字租金收款处理商（ClickPay、Zillow Rent Pay）处理支付，但不解决时点错配或信用建设。租金上报 /
              信用建设服务（Esusu、Jetty Credit、Rent
              Dynamics）与信用建设维度重叠，却不处理时点问题。租客无法赶上月度截止日时，现状替代品主要是发薪日贷款、透支工具和信用卡；它们成本高，信用建设收益有限。Table TM001 对这些边界做了明确映射。
