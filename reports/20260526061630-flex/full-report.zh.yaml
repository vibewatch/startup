              除 Flex Rent 外，公司还提供 Flex Bills（把同样的拆分付款机制用于水电和账单支付）、Flex Funds（一个储备账户，允许合格账户以仅借记卡方式预留最高 1.2 倍月租金），以及 Flex
              Move-in（单独的期限贷款产品，APR 区间为 16.95% 至 23.84%，期限三个月或六个月，目前仅早期开放）。核心 Flex Rent 产品最成熟，已有七个 PMS
              集成、上市超过四年，并有第三方伙伴公告中的结果指标相互印证。Flex Funds 和 Flex Move-in 的可用性明显更早期，公开文档也有限。银行基础设施从 Lead Bank 迁移到 Column
