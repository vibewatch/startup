      - number: '1.4'
        title: 负面信号、消费者投诉与待解风险
        blocks:
          - type: paragraph
            body: >-
              Flex 的负面记录并不轻，且与公司概览直接相关。2023 年 6 月，Mother Jones 发表调查文章，记录了租客遇到的付款时间混乱、房东意外收取滞纳金，以及文章所称住房门户强制要求租户使用 Flex
              且缺乏实质退出选项的案例。文章列出了具名消费者叙述，他们因 Flex 公布的付款截止日与个别租客收到的截止日之间存在落差而陷入财务压力。Flex 回应了该文章，但没有直接反驳其中案例。


              WSBTV（Channel 2 Action News，Atlanta）的一项地方电视调查报道了一名 Cobb County 居民：她在更新付款方式时遭遇付款失败，一个多月内收到 30
              多封邮件仍未解决，并称找不到取消服务的方法。Flex 在给该媒体的书面声明中承认响应时间不足。WSBTV 调查当时，报道指出 BBB 过去一年收到 400 多起投诉，Flex 的 BBB 评分为 1/5
              星。截至本次运行日期，BBB New York 档案显示投诉记录仍然活跃。


              Flex 在帮助中心描述了正式消费者投诉流程，指引问题未解决的消费者向美国消费者金融保护局（CFPB）、州金融监管机构，以及在纽约向纽约州金融服务部投诉。这是 NMLS
              注册放贷方的标准做法，但仍值得注意，因为它间接确认消费者纠纷已达到需要监管渠道介入的层级。2026 年合作银行从 Lead Bank 迁移到 Column N.A. 又增加了第二层运营风险：截至 2026 年 6
              月仍不接受新条款的客户可能失去 Flex 使用权限，从而在租金支付连续性上产生缺口。上述负面信号单独看都不构成一票否决，但合在一起形成了有意义的运营信任摩擦，后续产品和风险章节应深入调查。
