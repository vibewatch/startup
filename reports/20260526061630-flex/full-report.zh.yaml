      - number: '5.3'
        title: 用户开户、身份验证与合规控制
        blocks:
          - type: paragraph
            body: >-
              住户必须完成结构化开户流程才能启用 Flex Rent。流程要求提供 Social Security Number 做身份验证；通过 Plaid
              的收入数据流完成收入验证，或上传工资单、银行对账单等支持文件；并通过 Plaid 的 tokenized ACH 授权连接银行账户。Flex 会执行资格检查，评估住户收入相对租金负担以及账户状态。获批后，住户从
              PMS 集成列表中选择自己的物业，或发起直接付款设置。Flex 收取最高 $14.99/月的月度会员费、1% 账单支付费，以及信用卡或借记卡资助交易的 2.5% 费用。通过 Flex 按时支付的租金会报告给
              TransUnion，给住户带来潜在的信用建设收益。Flex 通过帮助中心维护消费者投诉流程，并接受监管机构转来的投诉。若在仍有未偿余额时取消
              Flex，可能进入第三方催收程序；公开论坛中已有消费者投诉记录了这一风险。合规基础设施由 NMLS 注册、TILA 披露、基于 Plaid 的 KYC 和 TransUnion 信用报告构成——这些都是
              fintech 信贷产品的标准要素——但公司没有逐州公开列明牌照覆盖。
