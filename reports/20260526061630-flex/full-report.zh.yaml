        - 要求过去 12 个月月活跃账户数据；与累计数字勾稽
      - - 消费者信用损失率和准备金政策
        - 阻断 — 面向财务脆弱租户的无担保消费者信贷；损失率是首要毛利变量
        - 要求按批次的净核销率；损失准备方法；30/60/90 DPD 分桶
      - - 银行合作方资金成本和收入分成
        - 重大 — 决定 Flex 是保留经济收益，还是把大部分收入让给银行
        - 要求合作方条款清单；确认任何交换费分成、资金成本率和损失分担协议
      - - 获客成本和回本周期
