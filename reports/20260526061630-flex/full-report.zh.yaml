  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Flex 站在租户（需要付款弹性）和物业管理方（需要按时收到全额租金）之间，借助银行合作伙伴的信贷弥合付款时点差，并从租户处赚取订阅费和交易费。
    data:
      nodes:
        - id: renter
