      - number: '2.4'
        title: 采用驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最持久的结构性驱动是发薪周期错配本身：只要雇主双周发薪、房东按月收租，相当一部分租客就会遇到时点缺口，从而产生对灵活性的需求。Harvard JCHS 2026 记录显示，这种结构性压力到 2024
              年继续加剧，即使工资增速放缓，租金负担率仍创历史高点。租金相对收入上涨不是临时状态；住房供给结构性短缺意味着租金成本压力很可能至少持续到 2020 年代后期。


              Fannie Mae 的政策决定提供了显著制度顺风。Desktop Underwriter 自 2022 年 8 月起使用租金支付历史，为 Flex 用户改善按揭可得性打开直接路径——这是高感知度收益，也把
              Flex 与单纯支付处理区分开来。California 现在要求物业管理方将租金支付上报信用局，Colorado 要求管理方每年提供上报选择；预计更多州级强制要求会出现。TransUnion 2025
              年分析发现，57% 租客更愿意从会上报租金的 PMC 处租房，这对 PMC 启用租金上报产品形成竞争压力。


              约束同样实质。消费者保护审查正在发生：2023 年 Mother Jones 调查提出了对费用设计和门户锁定的担忧，2024 年 WSBTV 调查记录了支付失败导致已向 Flex 付款的租客仍被收滞纳金。Flex
              作为受 TILA Regulation Z 约束的开放式信贷产品运营，州级费用上限或利率监管可能在特定辖区限制其定价。分销集中在 PMS 集成渠道：一项主要 PMS
              合作若终止，会立刻缩小可触达住房基数。Fannie Mae 多户住宅试点项目在 2025 年 6 月到期，取消了此前覆盖供应商上报成本的补贴，把经济负担转移给 PMC 和供应商。Table TM004
              总结所有主要驱动和约束；Figure FM004 映射租客采用漏斗。
