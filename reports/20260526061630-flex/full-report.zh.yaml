        - 会员费增加固定月成本；存在逾期还款风险
      - - 通过 PMS 门户启用灵活支付
        - 门户外手动申请
        - PMS 原生 Flex 激活（Yardi, RealPage, Entrata, AppFolio, Zego, Rent Manager, MRI）
        - 住户无需离开租金门户即可完成开通
        - 集成深度不一；部分 PMS 门户仍然受限
      - - 房东没有在线门户时支付租金
        - 邮寄支票或使用第三方服务
        - Flex 直接向房东 ACH 支付流程
        - 让非 PMS 房东也保留 Flex 分期支付收益
        - 手动设置；没有自动到期日同步
      - - 靠租金支付建立信用记录
        - 租金支付不上报征信机构
        - TransUnion 信用上报，覆盖按时 Flex 付款
        - 帮助信用档案薄的租户积累信用
        - 仅 TransUnion；未上报 Equifax 或 Experian
      - - 为租金中断预留资金
        - 非正式储蓄；没有集成缓冲
        - Flex Funds：最高 1.2x 月租储备（合格账户）
        - 减少短期现金缺口引发的驱逐风险
        - 仅借记卡；账户资格有限；未披露利息
    notes: 收益数据来自 Flex 发布的研究（2025 年 2 月 GlobeNewswire 新闻稿）。92% 统计尚无独立验证。
