      coverage: exhaustive
      basis: >-
        All major identified growth drivers and constraints for the US rent payment flexibility market as of 2025-2026,
        per Harvard JCHS, Fannie Mae, TransUnion, Mother Jones, WSBTV, and Flex company disclosures.
    columns:
      - 因素
      - 类型
      - 证据
      - 对 Flex 的影响
      - 时间跨度
    rows:
      - - 结构性发薪周期错配（双周发薪 vs 月付租金）
        - 驱动因素
        - 50%+ 租客按双周或每周领薪（Flex 营销；留存来源中没有独立佐证）。
        - 高 — 核心产品-市场匹配；除非租约结构改变，否则会持续存在
        - 长期
      - - 租金负担上升（22.7M 住房成本负担过重家庭户，创纪录）
        - 驱动因素
        - Harvard JCHS 2026：2024 年成本负担处于历史高位；租客财富中位数 $10,400，房主为 $396,500。
        - 高 — 扩大 SAM；强化对时间缓冲的需求
        - 多年（结构性供给缺口）
      - - Fannie Mae Desktop Underwriter 租金支付历史
        - 驱动因素
        - DU 自 Aug 2022 起把租金历史用于信用档案薄的借款人；Esusu、Jetty Credit、Rent Dynamics 是获批供应商（Fannie Mae）。
        - 高 — 给租客增加建立信用的激励；把 Flex 与支付处理商拉开差异
        - 当前且持续
      - - 州层面租金上报强制要求（CA、CO）
        - 驱动因素
        - California 要求 PMC 上报租金；Colorado 要求 PMC 每年提供一次上报选项；TransUnion 2025 预计更多州会出台强制要求。
        - 中 — 在 PMC 侧催生租金上报产品的合规需求
        - 2–5 年扩张期
      - - 消费者保护与费用审查
        - 约束
        - Flex 作为开放式信贷受 TILA Reg Z 约束；Mother Jones（2023）提出门户锁定担忧；WSBTV（2024）记录了支付失败导致滞纳金。
        - 中 — 限制定价弹性；带来声誉和监管风险
        - 当前
      - - PMS 平台集中度与集成依赖
        - 约束
        - 5 家 PMS 提供商（Yardi、RealPage、Entrata、AppFolio、MRI）控制大多数专业管理房源；Flex 分发依赖持续的集成访问。
        - 中-高 — 任一主要 PMS 伙伴终止访问，都会大幅压缩可触达房源基础
        - 当前
      - - Fannie Mae 多户住宅试点到期（June 2025）
        - 约束
        - Fannie Mae 多户住宅正向租金上报试点已于 June 30, 2025 结束；供应商成本补贴取消；持续成本转向 PMC 和供应商。
        - 低-中 — 减少一项外部补贴；不消除单户住宅 DU 顺风
        - 已结束（2025）
    notes: 驱动因素 = 结构性需求驱动。约束 = 限制采用速度或市场规模兑现的因素。时间范围说明该因素是当前生效、多年期，还是已结束。
