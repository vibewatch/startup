      - - 独立房东渠道（非门户）
        - 全国可用；设置摩擦较高，需连接物业管理方银行账户；无采用数据
        - 低-中机会
        - 打开机构化多户公寓之外估计约 30–40M 个单元；单元变现更低
        - 收集非门户物业激活率数据；评估获客成本相对门户渠道
