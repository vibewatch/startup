    Flex（法定名称 Flexible Finance, Inc.）是一家总部位于纽约的金融科技公司，帮助租客把每月租金拆成两期支付，同时确保房东按时收到全额租金。产品结构是由合作银行 Lead Bank 以及越来越多由 Column
    N.A. 发放的无抵押循环信用额度；Flex 通过 NMLS 注册关联公司负责撮合和服务。公开证据显示，它在主要物业管理软件栈中的分销有相当深度，集成覆盖
