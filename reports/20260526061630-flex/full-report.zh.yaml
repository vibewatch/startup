      - number: '2.2'
        title: 市场规模：测算口径与证据约束
        blocks:
          - type: paragraph
            body: >-
              测算租金支付弹性市场需要多重口径，因为没有独立分析师发布过可直接适用的 TAM 数字。最宽的天花板是美国住宅租金年度总支付额：基于约 4,400 万租房家庭和每月 $1,400 的租金中位数（Harvard
              JCHS 2026），估计为 $600B–$750B。并非所有支出都代表对灵活性的需求；SAM 应收窄到承受现金流压力或有信用建设需求的租客。


              最可辩护的 SAM 锚点，是 2,270 万个租金负担过重的美国租房家庭——租金和水电支出超过收入 30%；按 Harvard's Joint Center for Housing Studies，该数字在
              2024 年创下历史新高。按租金中位数计算，这一群体对应约 $280B–$350B 年租金支出。第二个更贴近产品的 SAM 口径，是当前可通过 Flex PMS 集成触达的 800 多万套住房；假设 Class
              A/B 租金中位数，对应约 $165B 年租金支付流。


              Flex 当前 SOM 可直接从公司披露观察：截至 2025 年初，140 万活跃租客，处理 $14.8B 按时支付。信用建设子板块又增加了一个规模维度：2,600 万美国人没有可见信用记录，约 70% Flex
              用户自报信用一般或较差；对这类人群，按时租金上报是通向金融包容的有意义路径。证据约束见 Table TM002，并在 Figures FM001 和 FM002 中图示。
