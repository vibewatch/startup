      - number: '4.4'
        title: 单位经济替代指标与成本结构缺口
        blocks:
          - type: paragraph
            body: >-
              Flex Rent 产品的成本结构没有公开拆解，但其架构指向几层重要成本。订阅费（$14.99/月）和账单支付费（1%）合在一起需要覆盖：银行伙伴的资金成本（垫付款利息）、消费者违约带来的信用损失、持 NMLS
              牌照的经纪和服务实体的运营与合规成本、技术和平台成本，以及消费者支持成本。BBB 投诉量很大，WSBTV 调查也显示，消费者支持成本应当不小。


              毛利率完全不公开。作为对比，结构上最相近的上市消费 fintech 信贷产品（BNPL 和 rent-to-own）在扣除信用损失和资金成本后、SG&A 之前，通常毛利率为 20–55%。Flex
              的利润结构可能更紧，因为 Flex Rent 信用额度期限短（按月）、无担保，并面向信用为 fair-or-better、但可能难以承受付款时点失误的租客。题为 “what if resident doesn't
              pay” 的帮助文章确认，Flex 吸收所有核销，不把成本转嫁给物业——内部吸收核销是真实成本，必须由这套收费结构覆盖。


              获客成本（CAC）同样不公开。Flex 的分发模型主要靠把 Flex 嵌入物业管理系统门户，成为一个付款选项——Yardi、RealPage、Entrata、AppFolio、MRI、Zego 和 Rent
              Manager。这种嵌入 PMS 的模式意味着 Flex 可能花在合作关系和集成上的成本更多，而不是传统直面消费者广告投放；相比依赖付费渠道、规模相近的消费 fintech 公司，CAC
              可能更低。不过，每个账户收入也被封顶在大约 $14.99/月，加上按 $1,500 月租计算约 $18/年的账单费，合计或许约 $197/年。若 CAC 超过单账户一年收入，回本周期会明显为负。


              服务交付成本包括基于 Plaid 的收入验证流程（逐交易 API 成本）、银行伙伴关系费用和 ACH 支付执行。这些单位成本都没有公开披露。1% 的账单支付费看起来用于覆盖这些交易层成本，而 $14.99
              会员费则贡献给固定开销，并在理想情况下形成毛利。
