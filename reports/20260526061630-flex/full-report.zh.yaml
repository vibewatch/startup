      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Fannie Mae Desktop Underwriter 为 Flex 创造由 GSE 支持的信用建设顺风
            body: >-
              自 2022 年 8 月起，Fannie Mae 的 Desktop Underwriter 将资产核验报告中的正向租金支付历史纳入，用于加强薄档案借款人的按揭信用评估。Fannie Mae 与
              Esusu、Jetty Credit 和 Rent Dynamics 的多户住宅试点（2022–2025）验证了供应商生态。这套 GSE 支持的基础设施，把月度支出转化为 2,600
              万没有可见信用记录美国人的信用建设资产，也服务于自报信用一般或较差的 70% Flex 用户。它是持久的结构性顺风，竞争对手靠复制产品也很难轻易抵消，因为 Fannie Mae 审批流程形成了具名供应商护城河。
            calloutType: insight
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM029
          - type: callout
            title: 消费者保护审查和支付失败风险构成实质产品设计约束
            body: >-
              Flex 作为受 TILA Regulation Z 约束的开放式信贷产品运营，其嵌入门户的分销模式创造了调查记者已标记为可能限制租客选择的条件。2023 年 Mother Jones
              调查记录了费用设计和房东强制门户锁定的担忧；2024 年 WSBTV 调查发现，Flex 支付失败导致租客虽已向 Flex 付款仍产生滞纳金。这些不只是声誉风险：如果州检察长或 CFPB 将 Flex
              的费用结构认定为门户锁定市场中的高利产品，可能触发执法行动、费用上限立法或压缩利润率的产品重设计要求。
            calloutType: risk
            claimRefs:
              - CM032
              - CM033
              - CM034
          - type: callout
            title: 所有市场规模估计都是模型测算——没有独立分析师发布过该类别 TAM
            body: >-
              不同于 HELOC 发放或先买后付等成熟类别，本次研究留存的公开报告中，没有独立分析师测算过租金支付弹性市场规模。本章所有 TAM 和 SAM 数字都由租房家庭数量、租金中位数数据、Harvard JCHS
              租金负担数据，以及 Flex 公司披露的 SOM 指标共同建模得出。投资人和尽调读者应把这些估计视为方向性框架，而不是权威市场规模主张。
