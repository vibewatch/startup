  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              Flex 运营的是一个双边市场，外加第三层生态。在需求侧，租客终端用户是付费客户：每笔租金交易支付 $14.99 月度会员费和 1% 账单支付费（信用卡另收 2.5%
              处理费）。租客是主要收入来源；作为交换，他们获得拆分付款便利、潜在信用建设和预算灵活性。在供给侧，物业运营方和经理——从个人房东到大型机构物业管理公司——既是分发渠道，也是价值创造终点。运营方零成本提供
              Flex，并获得按时、全额收租的保证收益，从而降低催收开销，改善现金流可预测性。第三层是 PMS
              生态：七个已集成平台（Yardi/RentCafe、RealPage/LOFT、Entrata/ResidentPortal、AppFolio Payments Platform、MRI PMX、Zego
              Pay/Zego Living 和 Rent Manager TWA/rmResident）充当嵌入式分发轨道，在住户门户体验中把 Flex 呈现为原生付款选项。


              灵活租金支付覆盖美国租客中最广泛的人群，但 Flex 可触达的人口结构更偏向几类租客：靠薪水周转、双周发薪周期与月度租金到期日错位，或储蓄缓冲有限。2026 年 3 月，Flex Financial Health
              Survey 调查约 1,000 名活跃 Flex 租客，发现 70% 自评信用为 fair 或 poor，47%
              在过去一年支出超过收入——这指向较低收入、受信用约束的核心用户群。公开材料没有按收入、年龄或地区给出精确人口结构拆分。不过，AppFolio 的 2025 Renter Preferences Report
              发现，18–24 岁租客中 77%、25–34 岁租客中 74% 在选房时把灵活租金支付列为高度重要，说明年轻租客需求不成比例地更高。


              地理上，Flex 声称通过 PMS 集成覆盖美国 50 个州，但州牌照披露（Vermont 和若干州）显示监管并不一致。公司没有披露国际客户群。对通过支票或直接转账交租的租客，存在一条非门户路径：Flex
              可以邀请没有 PMS 集成的物业经理直接连接其银行账户，把触达范围延伸到独立房东；不过，这条路径需要物业经理主动加入，摩擦更大。
