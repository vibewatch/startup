      - number: '4.3'
        title: 资本结构与合作银行依赖
        blocks:
          - type: paragraph
            body: >-
              Flex 的财务模型结构上依赖一家受联邦保险保护的银行伙伴，由后者发放底层消费信贷。Flexible Finance, Inc. 本身不是银行，也不发放贷款资金。所有信用额度和贷款均由 Lead Bank 或
              Column N.A.（Member FDIC）发放并拨款。经纪活动由 Flexible Finance Brokering, Inc.（NMLS #2599800）依法执行；根据 Flex
              公开牌照页面，该实体至少持有 20 个州的放贷牌照。催收和服务由 Flexible Finance Servicing, Inc.（NMLS #2256673）执行，并持有另一套催收牌照。第三个实体
              Flexible Finance Payments, LLC（NMLS #2713261）出现在法律页面上，但没有详细说明。


              截至 2026 年初，Flex 正在把银行伙伴从 Lead Bank 切换到 Column N.A.。Column N.A. 是一家全国性特许银行，自称 API-first、专为 fintech
              伙伴打造；Lead Bank 也把自己定位成面向 fintech 的金融基础设施提供商。两段伙伴关系的合同都没有公开披露。客户必须在 2026 年 6 月 1 日前在 Flex app
              内接受更新后的条款，银行伙伴从 Lead Bank 迁移到 Column N.A. 才能继续使用服务，否则可能中断。部分客户还需要更新其物业租金门户里登记的付款方式，执行风险因此上升。


              银行伙伴依赖是一种双边信用风险。消费者偿还第二笔分期之前，Flex 会先把整月租金垫付给物业经理。伙伴银行承担信用额度本身的信用风险（它是登记贷款人），但 Flex 的公开政策是内部处理核销：租客违约时，Flex
              吸收剩余经济敞口，而不是把成本转嫁给物业。这意味着 Flex 与银行伙伴之间存在某种信用风险分担或增信安排，但条款没有公开。Plaid 被用作银行账户连接和收入验证层，这一点在银行账户连接指南中有明确披露。


              留存证据中没有发现 Flex 股权融资、债务额度、现金状况或资本充足指标的公开披露。公司概况章节确认，没有任何风投轮次、投资方身份或轮次规模被公开披露。对于一家声称拥有 2.7 million
              名客户的公司，这形成了异常不透明的资本图景。
