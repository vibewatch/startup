  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品机制与金融架构
        blocks:
          - type: paragraph
            body: >-
              Flex Rent 是一条循环、无担保信用额度，让租客把单月租金义务拆成两笔分期，同时不要求房东改变任何计费流程。住户启用 Flex Rent 后，平台会在租约到期日当天或之前向房东支付 100%
              租金；资金来自通过 Lead Bank 或 Column N.A. 发放的信用额度。随后住户分两部分偿还 Flex：约 54% 在月初前后到期，剩余 46% 在 15
              日前后到期，并与住户发薪节奏匹配。关键是，Flex 自身不拨付资金；所有 ACH 转账完全由其银行伙伴执行。这种结构让 Flex 避免被归类为资金传输商，同时把信贷义务的完整法律责任留在 NMLS
              注册实体内。公司通过三个法律实体运营：Flexible Finance Inc.（母公司）、Flexible Finance Brokering Inc.（NMLS #2599800，安排信用额度）和
              Flexible Finance Servicing Inc.（NMLS #2256673，服务该义务）。产品受 Truth-in-Lending Act 披露约束，Flex 在其法律页面发布 TILA
              费用表。整体金融架构刻意做到与房东无关：房东按时收到全额租金，不需要与 Flex 做技术集成也能受益。所有信用风险和消费者保护义务都留在 Flex 这一侧。
