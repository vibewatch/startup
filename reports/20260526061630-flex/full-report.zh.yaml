      - number: '4.2'
        title: 交易规模与收入代理估算
        blocks:
          - type: paragraph
            body: >-
              Flex 不发布经审计财务报表、ARR 或收入，但公司发布的新闻材料提供了自下而上代理分析所需的原始输入。截至 2026 年 3 月，Flex 披露 270 万客户和 $33B 按时支付处理量。2025 年 2
              月的可比数字是 140 万租客和 $14.8B 按时租金支付。从 140 万到 270 万，意味着 13 个月内累计增长约 93%，披露客户基数大致翻倍。两组数字均为公司自述，未在本次留存证据中得到独立印证。


              Flex 新闻材料中的“月度按时支付”最合理的理解，是促成的按时月租支付交易的累计生命周期总额，而不是月度运行率。按这一理解，$33B 累计额在约 $1,500 平均租金下，意味着大约 2,200
              万次单月租金事件——这与数年内 100–200 万活跃订阅用户相符。本次运行日期更新的 ZoomInfo 公司档案估算 Flex 年收入为 $141.8M，员工数为 501–1,000。这些是 ZoomInfo
              模型估计，不是审计数字，最多只能作为方向性信息。


              自下而上代理估算给出相近区间。如果 270 万累计客户中有 700,000–1,000,000 人在任一月份同时活跃，仅订阅收入每年就是 $125M–$180M（$14.99 × 12 ×
              700K–1M）。对同一批活跃用户的月租金额应用 1% 账单支付费（假设平均租金 $1,500），每年可产生 $126M–$180M 交易费。两条主要收费线合计，在活跃订阅用户区间高端可能产生
              $250M–$360M 总收入；低端则为 $125M–$180M——ZoomInfo 的 $141.8M 估计接近下限。所有这些数字都是建立在公司自述输入和不可验证假设上的代理值；它们用于说明，而不是确认。
