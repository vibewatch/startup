    type: kpi
    layout: compact
    summary: Flex 的竞争耐久性在分发宽度上很高（7 个 PMS 集成，尚无直接复制到全规模），在租户忠诚度上中等（1M+ App 下载，4.8 星均分）。关键风险是相较竞争对手的负面信任差，以及 PMS 合作非独家。
    data:
      items:
        - label: 已接入 Flex 的 PMS 平台
