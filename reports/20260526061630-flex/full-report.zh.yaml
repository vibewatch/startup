        - $14.99/month + 1% 费用带来消费者阻力；消费者投诉记录偏负面（BBB、Mother Jones、WSBTV）
      - - Best Egg Flexible Rent（Marlette Holdings 旗下）
        - 直接 — 租金拆付
        - 未披露；June 2024 与 Flex 在 Yardi/RentCafe 联合发布
        - 通过 Yardi RentCafe 平台触达的租客
        - 通过 Yardi 集成拆付租金；固定费用定价模式（据 Yardi 新闻稿）
