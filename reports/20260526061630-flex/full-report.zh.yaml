chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与监管定位
        blocks:
          - type: paragraph
            body: >-
              Flex 通过 Flexible Finance, Inc. 运营，是一家在纽约州纽约市注册并设总部的金融科技公司。公司成立于 2019 年，自称使命是为租客提供财务灵活性，改变租房体验。核心产品 Flex
              Rent 让租客把一笔月租拆成两期，更贴近常见的双周发薪周期：租金到期时，Flex 向房东或物业管理方支付全额租金，租客再在当月分两次偿还
              Flex。这套安排依托受联邦保险保护的合作银行发放的无抵押循环信用额度。历史上，合作银行是 Lead Bank；截至 2026 年初，Flex 正在把部分客户迁移到 Column N.A., Member
              FDIC。


              Flex 不是银行，也没有银行牌照。所有贷款、信用额度和支付传输均由 Lead Bank 或 Column N.A., Member FDIC 提供；撮合活动由 Flexible Finance
              Brokering, Inc.（NMLS #2599800）执行；服务和催收活动由 Flexible Finance Servicing, Inc.（NMLS #2256673）执行。申请和信用评估是准入前提，但
              Flex 将其宣传为不会伤害申请人信用分的软查询。按时缴租的正向记录可能会上报全国信用局，Flex 将其包装成租客建设信用的收益。


              消费者收费结构是公开的：每月 $14.99 会员费，每笔租金交易收取 1% 账单支付费；使用信用卡时另收 2.5% 卡处理费（信用卡支付合计 3.5%；借记卡为 1%）。物业管理方提供 Flex 不需要付费。除
              Flex Rent 外，公司还提供 Flex Bills，把拆分支付模式延伸到水电和家庭账单支付。
