  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：四层竞争
        blocks:
          - type: paragraph
            body: >-
              Flex（Flexible Finance, Inc.）所处的竞争空间很分散，横跨四个层级。第一层是直接租金拆分金融科技同行——这些公司先向物业管理方全额支付租金，再允许租客分期偿还。在这一层，Flex
              是分销最广的玩家，Best Egg Flexible Rent（Marlette Holdings）是 Yardi 生态内最直接的具名同行。第二层包括租金相邻金融科技平台——Bilt
              Rewards（租金奖励和信用建设）、Esusu（租金支付上报和财务健康）、Obligo（押金替代）、Jetty（押金替代加租客保险）和
              Rhino（押金保险和租客担保）——它们争夺同一租客钱包和物业管理方心智，但解决的任务不同。第三层涵盖既有租金支付门户和物业管理软件生态——RealPage、Yardi、Entrata、AppFolio、MRI
              Software、Zego（一家 Global Payments 公司）和 ClickPay（Entrata 子公司）——它们既是 Flex
              的分销伙伴，也可能在构建原生灵活支付能力后成为内部竞争对手。第四层是现状：滞纳金、发薪日贷款、现金预支、信用卡债务和非正式房东付款安排；对多数租客而言，这才是真正的反事实，也构成最高切换成本门槛，因为它们不需要注册或采用新产品。因此，竞争地图不是简单的一对一对战，而是围绕分销控制、产品定位，以及哪一层最终捕获并留住租客关系的分层争夺。Flex
              目前的优势是 PMS 集成深度——它是唯一同时嵌入全部七大 PMS 平台的灵活租金玩家——但这种嵌入也制造了与合作生态的双边依赖，后者可能把分销转向竞品或自建替代方案。
