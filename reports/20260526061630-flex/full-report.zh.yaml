          tone: positive
        - label: 提供 Flex 的 NMHC Top 50 管理公司占比
          value: 4 in 10 (company-stated)
          detail: 公司新闻材料称，NMHC 2025 Top 50 管理公司中 40% 提供 Flex；未由独立来源验证
          tone: positive
        - label: 有规模的直接 PMS 竞争者（拆分租金）
          value: 1 confirmed (Best Egg in Yardi)
          detail: Best Egg 是唯一公开点名、且确认接入主要 PMS 的竞品租金拆分服务商；其他竞争者是邻近而非直接
          tone: positive
        - label: 相比关键竞争者的负面投诉差
          value: 'Flex: 400+ BBB complaints (1 year); Bilt/Esusu/Obligo: no equivalent public complaint volumes'
          detail: Mother Jones 调查（2023）和 WSBTV 调查记录了运营故障；WSBTV 报道时 BBB 评分为 1/5 星；已审阅来源中没有 Bilt、Esusu 或 Obligo 的同等负面报道
