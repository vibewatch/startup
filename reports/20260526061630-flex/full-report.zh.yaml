  - id: TP004
    slug: moat-durability-competitive-risk-register
    title: 护城河韧性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁方
      - 严重性
      - 支持 / 复杂化证据
      - 缓释 / 尽调问题
    rows:
      - - 租金拆付提供商中最深的 PMS 集成版图（7 个平台）
        - Yardi、RealPage、Entrata 或 Zego 自建原生灵活租金功能，或偏向 Best Egg
        - 高
        - Yardi 在 June 2024 同时联合发布 Flex 和 Best Egg，确认没有排他性；Zego 目前白标 Flex，但 Global Payments 有基础设施可把产品内化
        - 获取并披露 PMS 集成协议是否包含排他条款或最低量承诺；评估 Zego 原生灵活租金产品路线图
      - - 运营方零成本模式推动物业快速采用
        - PMS 供应商把竞争性的零成本灵活租金作为标准功能提供，且不向运营方收取增量费用
        - 高
        - 如果 RealPage 或 Yardi 自建原生灵活租金，零成本属性不再让 Flex 差异化；运营方会迁移到变更管理摩擦更小的嵌入式原生选项
        - 评估 Flex 是否拥有黏性运营方级商业协议（多年合同、最低量），足以降低迁移风险
      - - 2.7M 租客基础通过注册、信用档案和 Flex Funds 惯性形成切换成本
        - 竞争提供商拿下 PMS 分发，推动物业级迁移
        - 中
        - 租客重新注册有摩擦，但并非不可跨越；Flex Funds 余额只是小型留存激励；运营方的物业级切换会迫使租客大规模迁移，不受个人偏好影响
        - 量化租客流失率和重新注册成本；评估 Flex Funds 相比运营不便是否形成实质锁定
      - - Bilt 的信用卡奖励模式不是现金流缓解产品，且不直接竞争
        - Bilt 扩展付款拆付或现金垫付功能，瞄准成本受限租客
        - 中
        - Bilt 的 4M+ 住房网络、Wells Fargo 资本和零费用定位，让其能以低边际成本增加分期功能；TransUnion 数据显示租客自主上报租金付款的比例上升，说明租客侧金融科技产品有需求
        - 监测 Bilt 产品路线图是否发布现金垫付或拆付功能；Bilt 历史上以奖励产品为主，主要吸引不需要财务缓解的优质租客，覆盖面因此受限
      - - 灵活租金细分中的先行者地位和品牌认知
        - 负面消费者投诉记录（BBB、Mother Jones）削弱信任，相比记录干净的新进入者处于劣势
        - 中
        - >-
          Mother Jones 2023 调查和 BBB 400+ 投诉档案，是 Bilt、Esusu、Obligo、Jetty 没有类似记录的差异化负面信号；WSBTV
          地方调查记录了客服失败；如果机构买家做客户背调，负面信任缺口可能拖慢企业物业管理方采用
        - 审查 Flex 是否披露 2023 以来 BBB 投诉率或解决率改善；评估对 NMHC Top 50 物业管理方管线的影响
      - - 监管与合规基础设施（NMLS 注册，Lead Bank / Column N.A. 银行合作）
        - 州级 BNPL 或租赁援助监管把 Flex 产品视为消费贷款，要求更多披露或费用上限
        - 中
        - >-
          TransUnion 2025 报告记录 California 租金上报强制要求和 Colorado 试点；州级对租客保护产品的监管兴趣上升；Flex 在 2026 从 Lead Bank 转向 Column
          N.A.，显示运营银行风险；Flex 帮助中心记录了 CFPB 投诉路径
        - 评估 Flex 产品结构在关键州是否受到新兴 BNPL 或消费信贷监管约束；评估 Column N.A. 迁移对服务连续性的风险
    notes: >-
      严重性评级是基于可得公开证据的定性评估。高 = 若不缓释，存在近期被替代风险；中 = 风险重大但可处理。护城河主张引用 getflex.com、yardi.com、realpage.com、gozego.com、bilt.com
      和 motherjones.com 的数据，见本章证据引用。
