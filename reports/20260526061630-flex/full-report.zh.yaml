  - id: FM001
    slug: market-sizing-lens
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: >-
      五层嵌套将租金支付灵活性的 TAM 从美国住宅租金年度总支出（约 $675B/年）逐层收窄到 Flex 当前 SOM（1.4M 租户，已处理 $14.8B）。每一层都按资格、分发触达或认知度收窄——最宽的约束是 PMS
      集成覆盖，以及其内部的租户获客漏斗。
    approximationNotes: 所有 TAM 和 SAM 数字均由模型根据 Harvard JCHS 2026 租户家庭与租金负担数据推导。租金支付灵活性品类尚无独立第三方市场规模报告发布。
    data:
      nodes:
        - label: TAM — 美国住宅租金年度总支出：约 $600–750B
          detail: 约 44M 个美国租房家庭 × 月租中位数约 $1,400 × 12 个月。这是最宽的支付额上限；并非全部代表对灵活支付的需求。
          tone: neutral
        - label: SAM — 租金负担过重租户分层：约 $280–350B
          detail: 22.7M 个租金负担过重租房家庭（Harvard JCHS 2026，2024 年创纪录高位），存在结构性薪资周期错配，储蓄有限。
          tone: neutral
        - label: PMS 可触达 SAM — 已接入 Flex 的 8M+ 房源单元：约 $165B
          detail: 截至 2025 年初，可通过 Yardi、RealPage、Entrata、AppFolio、MRI、Zego、Rent Manager 集成触达的房源单元（Flex 披露）。
          tone: positive
        - label: Flex 当前 SOM — 1.4M 活跃租户：已处理 $14.8B
          detail: 公司截至 2025 年初披露：1.4M 租户、2,000+ 家 PMC、已处理 $14.8B 按时租金付款。
          tone: positive
        - label: 信用积累子分层 — 约 70% 的 Flex 用户（估计约 1M）信用评分一般 / 较差
          detail: 受访 Flex 用户中 70% 信用评分一般 / 较差；26M 美国人无信用记录——这类人最容易被租金上报信用激励。
