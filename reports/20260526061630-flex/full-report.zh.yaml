        - PMC 零直接成本
        - 通过 Flex 独立管理者渠道自助直接入驻
    notes: PMC = 物业管理公司。PMS = 物业管理软件。Flex 用户统计来自 Q1 2026 Financial Health Survey（约 ~1,000 名活跃用户）。
