      - number: '6.2'
        title: 采用轨迹与规模指标
        blocks:
          - type: paragraph
            body: >-
              2024–2026 年间，Flex 公开报告的规模数字大幅增长，但这些指标全部由公司自行声称，且标签存在不一致，需要谨慎解读。2024 年 8 月，RealPage 战略合作公告提到“年处理租金支付 $8
              billion”和“超过 6 million 个租赁单元”——这些数字看起来分别代表当时的年化运行率和已安装单元基础。到 2025 年 2 月，Flex 的 Financial Well-Being Survey
              新闻稿称已服务 “1.4 million 名租客”，促成 “$14.8 billion 准时租金支付”，并获得“超过 2,000 家物业管理公司、覆盖超过 8 million 个单元”的信任。到 2025 年
              10 月，AppFolio 伙伴公告称 Flex 每年为“数千家物业管理公司”促成“超过 $16 billion 准时租金支付”。到 2026 年 3 月，Flex 的 GlobeNewswire
              Financial Health Survey 新闻稿称“截至目前 2.7 million 名客户”、“每月准时付款 $33 billion”、“超过 340,000 条评价中的 4.8 星评分”；公司网站和
              MRI/Rent Manager 物业页面则提到 “5,000+ 家物业经理”和“通过 Flex 支付租金 $20B+”。


              这里存在重大不一致：“$16 billion annually”（2025 年 10 月）和 “$33 billion in monthly on-time payments”（2026 年 3
              月）不可能同时是同一年口径的年化运行率——五个月内约 2x 的差距，在没有剧烈加速的情况下并不可信。最可能的解释是，“$33 billion in monthly on-time payments”
              是累计总额（自成立以来处理过的全部租金付款），而不是每月运行率；“$16 billion annually” 则是 2025 年 10 月的年化运行率。另一种可能是 $33 billion 是 2026 年 3
              月的当前年化运行率，这要求业务在 2025 年 10 月至 2026 年 3 月间年吞吐量大约翻倍。两种解释都没有独立来源确认，这一差异应被视为未解决的证据缺口。


              其他规模信号来自 Google Play Store：Flex app（包名 com.avance.consumer）累计下载量超过 1 million。getflex.com/properties 页面称“多数
              NMHC 2025 top 50 管理方信任 Flex”；若属实，这意味着覆盖了美国多户住宅市场中机构集中度最高的部分：NMHC top-50 管理方合计管理超过 4 million 个单元。
