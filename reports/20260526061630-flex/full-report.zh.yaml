  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承销的影响
      - 精确尽调路径
    rows:
      - - 按产品线审计的收入和毛利率
        - 阻断 — 没有收入质量，无法评估可持续经济性或给业务估值
