    summary: 租户客户旅程分五阶段，从认知到推荐，覆盖获客渠道、转化触点，以及让运营方采用成为规模化触达租户前提的 PMS 嵌入式分发模型。
    data:
      items:
        - label: 认知
          channel: 物业门户 / 应用（嵌入 PMS）或口碑
          description: >-
            租户在 Yardi RentCafe、RealPage LOFT、Entrata ResidentPortal、AppFolio、MRI、Zego 或 Rent Manager
            门户中看到「拆分你的租金支付」横幅或按钮。认知几乎完全由运营方中介触发；直接面向消费者的认知是次要渠道。
        - label: 评估
          channel: Flex 应用入门流程 / getflex.com/rent
          description: 租户点击横幅后被重定向到 Flex 注册。Flex 做软性信用检查（不影响信用分）、收入验证，并在前置完整披露费用的同时展示分期时间表。租户承诺前可以放弃。
        - label: 激活
          channel: 首次通过 Flex 支付租金
          description: 租户批准分期时间表后，Flex 在到期日向物业支付全额租金，租户完成第一期还款。会员资格每月自动续费，费用为 $14.99 + 1% 交易费。非门户租户需要物业经理先完成银行账户设置。
        - label: 留存
          channel: 月度自动续费；应用使用；信用建设报告
          description: 订阅每月自动续费。租户可以按月关闭自动扣款而不取消，保留信用额度。Flex 向 TransUnion 报告正向租金历史。取消需要在应用内操作并提前 2 天；若在周期中取消，未结余额会进入催收。
        - label: 推荐
          channel: 应用商店评论；口碑；Flex 用户证言页
          description: >-
            满意租户留下应用评论（声称平均 4.8 星、340,000+ 条评论）并在物业内部自然口碑传播。Flex 在 getflex.com/reviews 策划付费证言（标注为「付费证言；结果可能不同」）。负面口碑体现在
            BBB 投诉和消费者媒体调查中。
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU024
      - CU025
