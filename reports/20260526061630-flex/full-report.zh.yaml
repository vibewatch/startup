  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - CFPB 执法行动
        - 确认针对 Flex 消费者信贷结构或费用披露充分性的公开执法行动。
        - 直接削弱受监管放贷逻辑；可能迫使产品受限或费用封顶，显著压缩收入。
        - 立即放弃；重新接触前必须完整重估投资逻辑。
      - - 银行合作伙伴退出
        - Column N.A. 或未来银行合作伙伴终止信用发行协议，且没有合格替代方就位。
        - 没有银行合作伙伴，Flex 无法发行消费者信用额度；整个核心产品停止运转。
        - 立即放弃；若未提前确认替代银行安排，没有恢复路径。
      - - 确认降价融资
        - 公开报道的股权融资估值显著低于此前任何已披露或估计标记。
        - 表明增长低于投资者预期；优先权堆叠悬挂加重；稀释风险上升；护城河叙事变弱。
        - 从零重启定价评估；任何投资前都要求完整披露股权结构表。
      - - 前五大 PMS 集成终止
        - Yardi、RealPage、Entrata、AppFolio 或 MRI Software 任一集成宣布终止或不续约。
        - 分发护城河逻辑受到挑战；如果单一平台贡献超过 20% 获客流，增长轨迹可能断裂。
        - 在尽调中跟踪集成续约风险；要求披露集成合同期限和排他性。
      - - 信贷核销率高于 5%
        - 消费者循环信用账簿净核销率披露或可信估计高于未偿余额的 5%。
        - 在 $141.8M 建模收入下，即便 $200–400M 信贷账簿出现 2–3% 核销，也可能接近或超过费用收入；悲观情景会变成基准情景。
        - 立即重估悲观情景概率；任何投资承诺前必须取得经审计信贷质量数据。
    notes: 这些触发项都无法仅靠公开证据监测；需要进入私有数据室，或建立持续的被投公司报告机制，才能确定基线指标。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV015
      - CV016
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 资本结构与股权结构表
        - 所有此前轮次的投资者身份、轮次规模、投后估值、优先权条款、清算瀑布、反稀释条款和强制跟投条款历史。
        - 没有股权结构表，任何入场价格都看不清稀释和优先权悬挂；此前投资者的优先权堆叠可能实质影响退出时股权价值。
        - Flex 管理层；将股权结构表作为投资条款书条件；通过法律数据室验证。
      - - 经审计或审阅的财务
        - 至少最近两个财年的经审计损益表、资产负债表和现金流量表；最好由四大或前十大审计机构审阅。
        - ZoomInfo 和 Growjo 收入估计均为建模值；只有经审计财务才能验证收入、利润率、烧钱速度和单位经济。
        - Flex CFO（据 ZoomInfo 为 Kristine Dickson）；要求以审阅财务作为进入排他期或最终投资条款书的条件。
      - - 信贷账簿质量与银行合作伙伴条款
        - Flex Rent 循环信用账簿的逾期率、净核销率、应收账款账龄、银行合作伙伴资金成本和损失追索条款。
        - 无担保消费者信用账簿是主要运营风险；若费用收入覆盖不了损失，模型在规模化后可能不可行。
        - 通过数据室接触 Flex CFO 和 Column N.A. 银行合作伙伴；要求提供信贷风险报告和银行协议条款清单。
      - - 银行合作伙伴迁移结果
        - Lead Bank 至 Column N.A. 迁移前后的最终订阅用户数；截至 2026 年 6 月未接受新条款客户的流失率。
        - 迁移流失是近期收入风险；若订阅用户流失 20%+，将实质性修正基准情景轨迹。
        - Flex 客户运营团队；要求在 2026 年 Q3 尽调更新中提供迁移后分析。
      - - 监管姿态与 CFPB 互动历史
        - 任何未在公开 NMLS 记录中可见的活跃 CFPB 问询、州总检察长调查、DFS 检查、NMLS 执法行动或正式投诉处理结果。
        - 未披露的监管问询可能打破投资逻辑；CFPB 针对 BNPL 的执法先例让 Flex 消费者信贷结构面临实质风险。
        - 外部律师监管意见；NMLS 执法行动检索；在投资文件中加入正式监管陈述与保证。
    notes: 这五项尽调要求有先后顺序：应先披露资本结构，因为它决定入场价格；其次是信贷质量，因为它决定压力情景下的模型可行性。
    claimRefs:
      - CV001
      - CV018
      - CV037
      - CV040
