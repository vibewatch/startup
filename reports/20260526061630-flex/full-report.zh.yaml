      - number: '5.2'
        title: 技术栈与物业管理系统集成
        blocks:
          - type: paragraph
            body: >-
              Flex 已经搭建一层物业管理软件集成，把它作为主要分发渠道，让住户直接在原本用于交租的 PMS 门户中启用 Flex Rent。到 2026 年中，Flex 已与七个主要物业管理软件平台签署集成协议：Yardi
              RentCafe（2024 年 6 月宣布）、RealPage（2024 年 8 月，覆盖 1.3 million+ 个单元）、Entrata（2024 年 9 月）、AppFolio（2025 年）、Zego
              Pay、Rent Manager 和 MRI Software。这些集成让住户无需离开物业管理门户即可注册 Flex，大幅降低摩擦。对于不在这些平台覆盖下的物业，Flex 提供直接房东付款流程，由 Flex
              代表住户直接向房东发送 ACH 转账。银行基础设施正在经历一次重大迁移：Column N.A. 被描述为 API-first、全国性特许银行，专为开发者和 fintech 打造，并直接连接 Federal
              Reserve；它正在取代 Lead Bank，成为主要银行伙伴。Flex 在开户流程中也依赖 Plaid 做银行账户验证和收入数据聚合。物业经理通过 Flex Hub（Property
              Hub）仪表盘访问住户级账户数据和管理控制。未使用 PMS 的独立物业经理可通过 Flex 伙伴知识库记录的手动注册流程参与。
