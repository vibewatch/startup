      - number: '6.3'
        title: 物业运营方与 PMS 生态的客户证据
        blocks:
          - type: paragraph
            body: >-
              Flex 面向运营方的客户证据主要来自 PMS 集成公告，而不是具名物业管理公司披露。2024 年至 2025 年间，七个 PMS 集成已宣布或确认；每一个都代表一份分发协议，让 Flex
              作为嵌入式付款选项向该运营方客户群开放：


              Yardi（RentCafe 和 Yardi Voyager）在 2024 年完成集成，由 Yardi 自己的新闻稿和 getflex.com/properties/yardi 确认。Yardi
              伙伴关系打开了美国多户住宅中最大 PMS 覆盖之一。RealPage（LOFT 住户门户）在 2024 年 8 月宣布为“战略合作”，RealPage 称 Flex
              是其“灵活租金支付首选技术提供商”。RealPage 新闻稿称，公告时已有 1.3 million+ 个 RealPage 单元向住户提供灵活付款选项。Entrata（ResidentPortal）在 2024
              年 8 月/9 月通过 API 集成宣布，由 Entrata 和 BusinessWire 新闻稿共同确认。AppFolio（Payments Platform）在 2025 年 10 月宣布，AppFolio
              Chief Growth Officer Chris Womack 给出了具名背书。MRI Software 确认 Flex 是 “MRI Certified Solution Partner”，并通过与 MRI
              PMX 直接集成运行。Zego（PayLease、Zego Pay、Zego Living app）通过 Zego Pay 集成，由 Zego 自己的产品页面和住户帮助文档确认。Rent Manager 通过
              Rent Manager-Zego 伙伴公告，确认其 TWA 网页门户和 rmResident 移动 app 中有集成。


              留存证据中，没有任何具体运营方名称——无论是 NMHC top-50 成员、REIT，还是私人管理公司——被公开确认为 Flex 运营方客户。getflex.com/properties 上“多数 NMHC
              2025 top-50 管理方信任 Flex”的说法，没有任何具名管理方披露或伙伴新闻稿支撑。物业运营方通过 Flex Property Hub 这一单独管理界面访问 Flex，并在租客首笔付款完成后 2
              个工作日内收到 ACH 付款。没有 PMS 门户的独立房东也可以通过直接银行账户邀请路径注册，扩大机构管理物业之外的潜在触达。
