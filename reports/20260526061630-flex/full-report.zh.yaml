  - id: TM001
    slug: market-definition-table
    title: 市场定义表
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All major product categories in or adjacent to the US rent payment flexibility market, based on competitor and
        adjacent-product research conducted in the 2025-2026 window.
    columns:
      - 市场细分
      - 是否属于 Flex 范围
      - 理由
      - 关键产品 / 替代品
    rows:
      - - 租金支付时间灵活性
        - ✓ 核心市场
        - 租客将月租拆成两次或更多次月内付款；PMC 在租约到期日收到全额合同租金。
        - Flex Rent（核心产品）；暂无直接的完整功能等价品
      - - 租金支付信用建设
        - ✓ 邻近功能
        - 按时租金支付上报至 Equifax、Experian、TransUnion，帮助征信记录较薄或没有征信记录的租客建立信用历史。
        - Esusu Financial、Jetty Credit、Rent Dynamics、Flex Credit Builder 等信用建设工具
      - - 押金替代方案
        - ✗ 不纳入
        - 用保险或账单替代预付现金押金；买方经济性不同；是一次性问题，而非持续现金流问题。
        - Obligo、Jetty Deposit、Say Rhino 等押金替代方案
      - - 租金奖励和忠诚度计划
        - ✗ 不纳入
        - 通过银行卡租金消费赚取忠诚度积分；面向收入更高的租客；收入模型是交换费，而不是租客费用。
        - Bilt Rewards
      - - 传统数字化租金收款
        - ✗ 不纳入
        - 为 PMC 处理租金付款，但不解决租客时间错配、信用建设或灵活性问题。
        - ClickPay（RealPage）、Zillow Rent Pay、Zego Pay 等租金支付工具
      - - 高成本短期信用替代品
        - ✗ 不纳入（负面参照）
        - 发薪日贷款、银行透支、现金垫款——租客用于弥合时间缺口的现状替代方案；成本高且伤害信用。
        - 发薪日贷款机构、银行透支项目、APR 20%+ 的信用卡
    notes: 市场边界截至运行日期 2026-05-26。PMS = 物业管理软件。PMC = 物业管理公司。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
  - id: TM002
    slug: tam-sam-som-or-sizing-lens-table
    title: TAM/SAM/SOM 或规模测算口径表
    enumerationScope:
      coverage: partial
      basis: >-
        Key US rent payment flexibility market sizing lenses from primary public sources (Harvard JCHS 2026, Flex
        company disclosures 2025) and modeled estimates. No independent analyst has published a directly applicable TAM
        figure.
    columns:
      - 规模测算口径
      - 估算
      - 方法 / 依据
      - 置信度
    rows:
      - - TAM：美国住宅租金年度支付总额
        - ~$600–750B
        - ~44M 租房家庭户（Harvard JCHS 2026）× 租金中位数约 ~$1,400/mo × 12 个月。任何租金技术产品最宽的付款量天花板。
        - 低（建模）
      - - SAM：住房成本负担过重的租房家庭户
        - 年度租金支出 ~$280–350B
        - 22.7M 个住房成本负担过重家庭户（Harvard JCHS 2026）× 租金中位数约 ~$1,030–1,280/mo。最能代表存在急迫时间错配需求家庭的代理指标。
        - 低（建模）
      - - SAM：PMS 集成可触达单元（Flex 覆盖范围）
        - 年度租金流 ~$165B
        - 通过 Flex PMS 集成可触达 8M+ 个单元（Flex 2025）× A/B 类估算租金中位数 ~$1,720/mo。
        - 低（建模）
      - - SOM：Flex 当前活跃租客（2025）
        - 已处理 $14.8B；1.4M 租客
        - 公司披露：截至 2025 年初，$14.8B 按时付款、1.4M 活跃租客、2,000+ 家 PMC。
        - 中（公司披露）
      - - 子细分：征信空白 / 次级信用租客
        - ~26M 征信空白美国人
        - CFPB 估计有 26M 名征信空白消费者；70% 的 Flex 用户自报信用一般 / 较差（Flex Q1 2026 调查）。
        - 低（公司声称）
    notes: 所有美元估算均为近似值，来自公开来源或建模假设。尚无独立第三方发布租金支付灵活性市场规模测算。HH = 家庭户。
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
  - id: TM003
    slug: segment-buyer-map
    title: 细分 / 买方图谱
    enumerationScope:
      coverage: partial
      basis: >-
        Primary buyer/user/payer segments for Flex's rent payment flexibility product, derived from Harvard JCHS 2026,
        Flex Q1 2026 user survey, Fannie Mae documentation, and NMHC 2025 top-50 manager data.
    columns:
