        - 22.7M 个美国租房家庭户；收入中位数 $53,700；储蓄中位数 $1,800；73% 在过去一个月经历过财务冲击（Flex 2026 调查）。
        - 高 — 时间错配造成反复出现的月度压力
        - 租客支付约 ~$14.99/mo 会员费
        - PMC 启用的门户或直接下载 Flex App；需要收入和银行账户验证
      - - 信用建设型租客（次级信用 / 征信空白）
        - ~26M 征信空白美国人；约 ~70% Flex 用户信用一般 / 较差；可受益于自 2022 年起的 Fannie Mae DU 租金转信用报告顺风。
        - 高 — 信用可得性限制住房和财务流动性
        - 租客支付会员费；信用建设器可能带来边际价值
        - 同上；信用功能在 Flex App 内激活
