      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 投资建议：继续研究
            body: >-
              Flex 有真实规模、可防守的 PMS
              分销护城河，以及大型结构性痛点。但公司没有股权结构表、没有审计财务、没有信用损失数据，银行合作伙伴切换仍在进行，且消费者负面记录较重；仅凭公开证据无法支持买入建议。结论是继续研究，置信度中等、风险高。若要把结论推向买入，需要完整披露股权结构表、经审计收入和信用质量，并确认银行切换结果干净。
            calloutType: insight
            claimRefs: []
          - type: callout
            title: 悲观情景不可忽视
            body: >-
              三条相互独立的悲观路径都存在：银行切换导致流失、CFPB 执法、信用损失超预期。Mother Jones、WSBTV 和 BBB
              的负面记录，更像结构性运营风险，而不是孤立事件。投资者如果没有私有数据室访问权，不应在承销时把悲观情景当作尾部情形打折处理。
            calloutType: insight
            claimRefs: []
