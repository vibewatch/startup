    {
      "id": "s604",
      "title": "Renter Satisfaction, Retention Signals, and Durability Gaps",
      "body": "Flex's primary renter satisfaction evidence comes from two company-commissioned surveys of active Flex users and one causal study. The February 2025 Flex Financial Well-Being Survey of approximately 1,000 active renters found: 92% avoided late fees and penalties, 82% reported a reduced risk of eviction, 85% saved money in the past year, and 90% improved housing stability. The March 2026 Financial Health Survey, also fielded among approximately 1,000 active Flex renters in Q1 2026, found that 73% experienced an unexpected financial shock in the past month, and that among respondents who reported a shock, 60% used Flex to split rent as part of their financial management strategy. Both surveys are self-reported by active users — a sample that excludes churned members and applicants denied access — which introduces substantial selection bias toward favorable outcomes.\n\nThe March 2026 release also included a causal study using a regression discontinuity design on 9,613 Flex Rent applicants tracked over five consecutive quarters via credit bureau data. The study found that access to rent-splitting did not worsen any measured credit outcome (scores, revolving balances, utilization, delinquency rates, collections, or debt levels) for approved applicants compared to narrowly-denied applicants. On several measures — fewer credit inquiries, lower balances 90 days or more past due, lower use of payday-like products — approved applicants showed modestly better outcomes. This design is methodologically stronger than a simple survey, but the study was commissioned, conducted, and published by Flex without independent peer review, and the population near Flex's approval margin is not representative of all renters.\n\nRetention and churn data are entirely absent from public disclosures. No NRR, GRR, monthly or annual churn rate, average membership tenure, or cohort-level retention figures have been published. The subscription model (auto-renewing $14.99/month) creates automatic stickiness for renters who do not actively cancel, but the BBB complaint file and consumer investigations document friction in the cancellation process. The resident account management help page confirms that membership auto-renews and that cancellation requires the resident to navigate the Flex app to 'Settings > Account > Membership > Cancel membership,' with a minimum 2-day lead time before month-end to avoid an additional monthly charge. This design creates a retention signal that conflates genuine value satisfaction with cancellation friction. The getflex.com/reviews page states that renters 'served to date' and 'of Flex members feel more stable in their housing' — specific numbers appear on the page but are not captured in the retained text extraction, which is a gap in source coverage.",
