    {
      "id": "s603",
      "title": "Property Operator and PMS Ecosystem Customer Evidence",
      "body": "Flex's operator-facing customer evidence is dominated by PMS integration announcements rather than named property management company disclosures. Seven PMS integrations have been announced or confirmed between 2024 and 2025, each representing a distribution agreement that makes Flex available to the operator's customer base as an embedded payment option:\n\nYardi (RentCafe and Yardi Voyager) was integrated in 2024, confirmed by Yardi's own press release and getflex.com/properties/yardi. The Yardi partnership unlocks distribution into what is one of the largest PMS footprints in U.S. multifamily. RealPage (LOFT resident portal) was announced in August 2024 as a 'strategic partnership' with RealPage naming Flex as its 'preferred technology provider for flexible rent payments.' The RealPage press release cited 1.3 million+ RealPage units offering residents a flexible payment option as of announcement. Entrata (ResidentPortal) was announced in August/September 2024 via API integration, confirmed by both Entrata and BusinessWire press releases. AppFolio (Payments Platform) was announced in October 2025, with AppFolio's Chief Growth Officer Chris Womack providing a named endorsement. MRI Software confirmed Flex as an 'MRI Certified Solution Partner' operating via direct integration with MRI PMX. Zego (PayLease, Zego Pay, Zego Living app) is integrated via Zego Pay, confirmed by Zego's own product page and resident help documentation. Rent Manager confirmed integration in its TWA web portal and rmResident mobile app, via a Rent Manager-Zego partnership announcement.\n\nNo specific operator names — no NMHC top-50 member, REIT, or private management company — have been publicly confirmed as Flex operator customers in the retained evidence base. The claim that 'a majority of NMHC 2025 top-50 managers trust Flex' appears on getflex.com/properties but is not substantiated by any named manager disclosure or partner press release. Property operators access Flex through the Flex Property Hub, a separate management interface, and receive ACH payments within 2 business days of renter first-payment completion. Independent landlords without a PMS portal can also sign up via a direct bank account invitation pathway, expanding potential reach beyond institutionally managed properties.",
