    "title": "Customers",
    "summary": "Flex's customer base spans three interlocking segments: renter end-users who pay a monthly membership fee to split rent; property operators and managers who receive full, on-time payment at zero cost; and property management system (PMS) ecosystems whose portals distribute Flex at scale. As of March 2026, Flex reports 2.7 million cumulative customers, $33 billion in on-time payments processed, a 4.8-star average across 340,000+ reviews, and availability in 8 million+ U.S. units through integrations with seven major PMS platforms (Yardi, RealPage, Entrata, AppFolio, MRI, Zego, and Rent Manager). The company also claims relationships with a majority of the NMHC 2025 top-50 property managers and 5,000+ property management companies. All scale figures are company-asserted and unaudited. Key metric inconsistencies exist: the phrasing '$33 billion in monthly on-time payments' (March 2026) conflicts with '$16 billion in on-time rent payments annually' (October 2025) and '$14.8 billion in on-time rent payments' (February 2025), creating an unresolved discrepancy between cumulative-total and run-rate interpretations. No named property management companies are publicly disclosed as operator customers. Renter satisfaction data comes from two company-funded surveys of active Flex users and a regression-discontinuity causal study, none of which have been independently peer-reviewed. Adverse signals include 400+ BBB complaints, a 1/5 BBB star rating, a 2023 Mother Jones investigation documenting billing confusion, and a local television investigation into customer service failures."
  },
