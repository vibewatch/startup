    "number": 1,
    "title": "Company Overview",
    "summary": "Flex (Flexible Finance, Inc.) is a New York-based fintech founded in 2019 that allows renters to split their monthly rent payment into two installments through an unsecured line of credit issued by a partner bank. The company's March 2026 press materials report 2.7 million customers, $33 billion in monthly on-time payments processed, and a 4.8-star average across 340,000+ reviews — all company-asserted figures without independent third-party verification. Flex operates at zero cost to property managers, integrating with major property management systems (Yardi, RealPage, Entrata, AppFolio, MRI, Zego, Rent Manager) and is available in over eight million units nationwide. Public evidence for founders, funding history, and valuation is absent; no investor names or round sizes appear in retained sources. The adverse record includes a 2023 Mother Jones investigation, a local television consumer investigation, and a BBB complaint file, all of which are material for operational trust assessment."
  },
