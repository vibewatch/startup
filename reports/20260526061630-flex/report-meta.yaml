companyProfile:
  summary: Flex, legally Flexible Finance, Inc., is a New York-based fintech that lets renters split a monthly rent obligation into two installments while ensuring the landlord receives full payment on time. The product is structured as an unsecured revolving line of credit issued by bank partners Lead Bank and, increasingly, Column N.A., while Flex handles brokering and servicing through NMLS-registered affiliates. Public evidence supports meaningful distribution depth across the major property management software stack, with integrations spanning Yardi, RealPage, Entrata, AppFolio, MRI, Zego, and Rent Manager, and company-reported scale of 2.7 million cumulative customers and billions of dollars of rent processed. The business proposition is real, but the public record remains unusually thin on founders, investors, funding history, and credit-book performance, and the adverse servicing record is material enough to weigh on trust and regulatory risk.
  foundedDate: "2019-01-01"
