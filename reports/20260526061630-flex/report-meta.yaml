  productSummary: Flex Rent pays 100% of a renter's monthly rent to the landlord on the due date and collects repayment from the resident in two installments through an unsecured revolving credit line, with adjacent offerings including Flex Bills and Flex Move-in.
  customerFocus: U.S. renters with biweekly-pay-cycle mismatch, limited liquidity, or credit-building needs, distributed primarily through multifamily property managers and PMS portals.
  businessModel: Consumer-fee model built on a recurring monthly membership fee, per-payment transaction fees, optional ancillary fees, and APR-bearing adjacent credit products, with property managers adopting at zero direct cost.
