summary:
  headline: >-
    Flex appears to have built a genuine distribution moat in rent-payment flexibility, but undisclosed capital
    structure, opaque credit economics, and a meaningful record of servicing failures keep the correct call at
    research-more rather than a price-sensitive underwriting.
