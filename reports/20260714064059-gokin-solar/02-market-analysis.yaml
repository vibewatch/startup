- id: demand-sizing
  title: 'Demand and Sizing Lenses: Big Market, Imperfect TAM'
  body: 'Global demand remains very large even after adjusting for hype. SolarPower Europe said the world installed 597 GW of solar in 2024 and reached 2.2 TW of cumulative capacity, while IEA-PVPS estimated installations rose further to 698 GW in 2025 and cumulative capacity approached 3 TW. China remained the single biggest engine, contributing around 60% of new global installations in 2025 and adding 277.57 GWAC in 2024 on its own. In other words, the demand side is not the problem: solar deployment is still expanding at extraordinary scale. For Gokin Solar, that means the addressable use case for wafers continues to grow structurally even as pricing is cyclically broken.


    What is harder to pin down is the market’s revenue pool. Global Market Insights, Straits Research, and Maximize Market Research place the wafer market in a roughly USD14 billion to USD16 billion band for 2024-2025, but they use different base years, assumptions, and regional definitions. Those numbers are still useful as comparative lenses, especially when paired with deployment metrics and concentration data, but they should not be mistaken for a single definitive TAM. The real underwriting lesson is that the wafer market is simultaneously huge in physical throughput and compressed in current dollar revenue because oversupply has driven prices down. That is why deployment growth and pricing discipline must be analyzed separately.'
