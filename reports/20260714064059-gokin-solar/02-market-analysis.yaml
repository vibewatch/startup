  - - Wafer supply 2.3x demand in late 2024
    - Negative
    - Current
    - Destroys pricing power and utilization economics
    - Model gross-margin sensitivity under sub-cash pricing
  - - Inventory above 28 GW in 2026
    - Negative
    - Current
    - Slows price recovery and pressures working capital
