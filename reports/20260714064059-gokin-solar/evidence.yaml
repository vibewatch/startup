evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: >-
      A current shareholder register with ownership percentages, voting control, and any founder or state-platform
      concentration has not been retained.
    whyItMatters: >-
      Ownership concentration affects governance control, dilution risk, and IPO readiness, especially for a private
      manufacturer that scaled with large state-linked and institutional backers.
    diligencePath: >-
      Obtain the latest shareholder register from IPO counseling materials, company registration extracts, or a
      prospectus draft once available.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: employees
    missingEvidence: >-
      A reconciled 2026 groupwide employee count is unavailable because official materials, ENF, and Qichacha appear to
      count different scopes.
    whyItMatters: >-
      Headcount is a core maturity and cost-structure signal; inconsistent counts weaken confidence in productivity and
      SG&A benchmarking.
    diligencePath: >-
      Ask management for current consolidated employee counts by entity and site, plus reconciliation to insured payroll
      records.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: No retained public source provides audited 2024-2025 income statement, cash flow, debt, or margin detail.
    whyItMatters: >-
      Without audited financial detail, it is hard to convert the scale narrative into a credible view of profitability,
      leverage, or IPO quality.
    diligencePath: Request audited financial statements, lender packages, or IPO working drafts during management diligence.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: board-detail
    missingEvidence: >-
      Official retained sources do not provide a full current board and committee roster with biographies and
      independence status.
    whyItMatters: >-
      Board quality matters for IPO readiness, related-party control, and risk oversight in a large private
      manufacturer.
    diligencePath: >-
      Request current board list, committee structure, and director biographies from investor-relations or counseling
      materials.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: merchant-wafer-tam
    missingEvidence: A clean public estimate of the global merchant wafer market excluding captive internal transfers is not retained.
    whyItMatters: >-
      This distinction affects valuation multiples because integrated producers may report very different economics from
      stand-alone wafer sellers.
    diligencePath: >-
      Seek industry datasets or management disclosures that split merchant wafer shipments from captive intra-group
      consumption.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM001
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-value-methodology
    missingEvidence: >-
      Retained third-party wafer market value estimates vary from roughly USD14.4B to USD16.2B for adjacent periods and
      use opaque methodologies.
    whyItMatters: >-
      A valuation case built on one estimate without reconciling definitions could materially misstate addressable
      market size.
    diligencePath: >-
      Request underlying methodology notes or triangulate with shipment volumes and ASP data from paid industry
      databases.
    relatedQuestionRefs:
      - QM010
      - QM011
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: gokin-serviceable-market
    missingEvidence: >-
      Public evidence does not reveal how much of Gokin’s wafer capacity is sold externally versus consumed internally
      or reserved for strategic customers.
    whyItMatters: Without that split, the serviceable market opportunity is directional rather than precise.
    diligencePath: >-
      Ask management for third-party sales mix, captive consumption share, and target customer concentration by
      geography.
    relatedQuestionRefs:
      - QM022
      - QM023
