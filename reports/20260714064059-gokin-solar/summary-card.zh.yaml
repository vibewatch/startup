  topStrengths:
    - Gokin 已在硅片端做出真实工业规模，并在下游组件形成有意义的出货牵引，较早期气候科技公司大幅降低存在性风险。
    - 官方与第三方证据显示，公司有较广制造足迹、强出货历史和增长中的国际渠道，而不是纯国内故事。
    - BC 组件进展和首次进入 bankability 名单提供了可信上行期权，前提是公司能证明经济性优于商品化同业。
    - IPO 辅导和此前多轮大额融资至少给出一条可见的未来流动性路径，而不是无限期私有持有。
  topRisks:
    - 太阳能硅片和组件下行周期仍很重，多家中国上市同业仍处于低倍数、弱经济性，限制投资者今天应为 Gokin 支付的价格。
    - Gokin 当前 0.7x-sales 明面估值高于多家流动性上市同业，但现金、债务、利润率和集中度的经审计披露明显更弱。
    - 相较出货和渠道公告数量，客户质量、集中度和复购经济性仍不够可见，收入质量难以下判断。
    - IPO 进程在推进但尚未完成，投资者还不能假设近期流动性事件或干净的公开市场估值重置。
    - 任何隐藏杠杆、优先权堆栈悬顶，或 BC 路线经济性偏弱，都可能迅速把公允价值拉到当前 Hurun 明面估值以下。
  unresolvedGaps:
    - 2024-2025 年经审计财报、现金流明细、债务 / covenant 时间表。
    - 主要客户的客户集中度、地域结构、应收账款质量和经销商 sell-through。
    - BC 与硅片路线层面的毛利、良率、产能利用率、库存账龄和质保准备数据。
    - 真实普通股价值所需的 cap table、优先权、质押、担保及其他资本结构细节。
