      - number: '5.4'
        title: 'Technical Verdict: Real Manufacturing Depth, Real BC Progress, Still Important Factory-Stack Gaps'
        blocks:
          - type: paragraph
            body: >-
              The right product-and-technology verdict is balanced. Gokin clearly has more than branding. It publishes
              real wafer specs, real module datasheets, real certification surfaces, and repeated evidence of industrial
              build-out. Independent and quasi-independent sources also support that its BC push is not imaginary: by
              2026 the company was publicly claiming multi-million-unit BC output, mass-production status, and a
              flexible-line manufacturing setup that could support global delivery. That makes the company technically
              more credible than a private manufacturer that only publishes capacity slogans.


              At the same time, the evidence is not complete enough to underwrite the factory stack on trust alone.
              Public materials do not identify the majority of equipment vendors, do not specify the factory software
              backbone, do not break out BC yield versus TOPCon or HJT yield, and do not give a sourceable
              bill-of-materials or supplier concentration map. Even the patent narrative is mostly count-based rather
              than claim-by-claim. The conclusion is therefore not that Gokin lacks technology. It is that Gokin has
              shown enough to prove industrial competence and BC momentum, while still leaving investors to do on-site
              diligence for the exact machine set, software systems, process economics, and dependency concentrations
              that determine whether this technical story is durable through a difficult solar cycle.
