  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product Scope and Technology Routes: A Deliberate Multi-Route Stack'
        blocks:
          - type: paragraph
            body: >-
              Gokin’s product surface is now much broader than a single wafer business. The company’s English product
              pages and download center show an upstream wafer line built around large-format monocrystalline silicon
              wafers, plus a downstream module portfolio that spans BC, TOPCon, HJT, and legacy PERC-compatible
              positioning. On the wafer side, public specs are concrete rather than vague: the N-type page lists M10,
              G12, and G12-R formats with 90–160µm thickness, while the P-type page still shows a legacy route with M10
              and G12 formats. On the module side, the FLAMINGO line anchors TOPCon, the WING line anchors HJT, and the
              GOKIN BC line anchors the company’s newer back-contact push. This matters because it shows Gokin is not
              betting only on one architecture or only on one part of the chain. It is trying to use wafer scale as a
              base, while offering multiple module technology routes for different customer and regional needs.


              The strongest product signal is that Gokin presents BC not as a lab demo but as a packaged commercial
              line. The GOKIN BC page and its downloadable datasheet show named SKUs, warranty terms, temperature
              coefficients, packaging details, and installation-oriented parameters. Meanwhile, the TOPCon and HJT
              product pages show that Gokin is still offering more mainstream or alternative efficiency routes rather
              than abandoning them. The clearest reading is that Gokin’s product strategy is a portfolio strategy:
              preserve broad bankable coverage with TOPCon and HJT while trying to push BC into higher-value scenarios
              where aesthetics, heat performance, and shading resilience matter more.
