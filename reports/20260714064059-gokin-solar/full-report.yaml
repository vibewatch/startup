      - number: '7.4'
        title: 'Mitigation, Monitoring, and Kill Criteria: What Would Break the Thesis'
        blocks:
          - type: paragraph
            body: >-
              A workable investment case for Gokin therefore depends on monitorable, falsifiable triggers. The thesis
              improves if management can prove that channel expansion is converting into durable repeat orders, that BC
              and other next-generation products are earning healthier economics than commodity wafers alone, and that
              the IPO path is turning into a real financing option rather than a long counseling loop. The thesis
              weakens if wafer and module pricing relapse, if major channel relationships fail to convert, if trade
              remedies spread more broadly through key export routes, or if public or private diligence turns up
              unresolved legal, environmental, or warranty problems.


              The most important diligence asks are therefore concrete: audited margin and cash-flow detail, route-level
              yield and warranty data, top-customer concentration schedules, distributor sell-through, project
              repeat-order behavior, and direct court or administrative-record checks. Gokin is risky primarily because
              too many core variables still sit between “visible scale” and “underwritten resilience.” The company does
              not need zero risk to be investable. It does need enough disclosure to show that its current scale is a
              durable asset rather than a large fixed-cost structure waiting for the market to turn against it again.
