  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Wafers as the Critical Midstream Node'
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Gokin Solar is narrower than “all solar” but broader than a single merchant
              wafer line. Wafers sit in the crystalline-silicon chain between ingot growth and cell production, and
              their economics are pulled by downstream module and project demand. Market-research sources consistently
              describe wafers as the foundational component used by cell and module manufacturers serving residential,
              commercial, and utility-scale projects. That means the directly relevant spend pool is the wafer layer of
              the c-Si supply chain, including both merchant sales and internal transfers within integrated
              manufacturers. Downstream deployment is still crucial because it determines how much wafer demand can be
              absorbed, but not every dollar spent on modules, EPC, or project finance belongs in Gokin’s immediate TAM.


              This distinction matters because the wafer industry is highly integrated and often captive. The same
              companies that produce wafers may also consume them internally in cells and modules, which makes pure
              merchant-wafer demand harder to isolate than overall solar deployment. Gokin’s own positioning supports
              this broader integrated reading: its official materials cover wafers, modules, and solution delivery, so
              the company participates in a market where upstream wafer capacity can either be sold or consumed within a
              wider product stack. The chapter therefore treats global solar installations as the demand driver,
              wafer-market revenue reports as imperfect sizing lenses, and the integrated c-Si supply chain as the
              practical economic arena.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM032
