      - number: '3.2'
        title: 'Profiles and Capability Comparison: Gokin Versus Named Public and Private Benchmarks'
        blocks:
          - type: paragraph
            body: >-
              Among direct comparables, LONGi and TCL Zhonghuan stand out because they combine wafer leadership with
              aggressive technology roadmaps, especially around BC and large-format products. LONGi publicly advertises
              much deeper R&D resources and an integrated solutions stack, while TCL positions its 210mm wafer ecosystem
              and BC patent base as a format-and-technology platform. GCL sits in a somewhat different position: less a
              clean merchant-wafer peer and more an upstream ecosystem company whose granular-silicon economics,
              related-party wafer sales, and downstream system ties shape the competitive field from above.


              The integrated module leaders change the competitive math even further. Jinko, JA Solar, and Trina show
              how scale players can turn modules, storage, systems, and overseas subsidiaries into distribution power
              that a newer downstream entrant may not yet match. Tongwei adds upstream and cell dominance, while Huasun
              and AIKO show that technology-specialist adjacencies can still matter if BC or HJT architectures gain
              outsized traction. In short, Gokin’s relevant benchmarks are not only other wafer slicers but also firms
              with stronger balance-sheet visibility, broader product adjacency, or tighter customer-channel control.
