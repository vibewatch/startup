            body: >-
              The retained comparable set is directionally clear. JA Solar and Trina Solar currently screen near 0.49x
              and 0.41x sales respectively using retained Yahoo Finance market-cap and revenue pages. Canadian Solar
              screens even lower at roughly 0.19x. LONGi, by contrast, screens around 1.30x, reminding investors that
              not all Chinese solar names are valued equally even in a weak market. First Solar sits in an entirely
              different bracket at roughly 4.5x sales, showing how much premium public markets will still pay for
              differentiated geography, policy shelter, and profitability. Gokin’s own implied 0.7x headline multiple
              lands above several stressed public peers, below LONGi, and far below First Solar.


              That positioning matters because Gokin is the least transparent asset in the group. JinkoSolar’s
              public-market footprint makes the disclosure gap especially visible: it filed its 2025 20-F in April 2026
              and maintains a routine public-results archive. Gokin has nothing comparable in the retained set. The
              market is therefore being asked to pay a richer multiple than JA or Trina while receiving materially less
              audited information on cash, debt, customer concentration, route-level margin, and governance. That does
              not rule out investment. It does rule out treating the Hurun headline as self-justifying. A private
              company with weaker disclosure should typically enter below, not above, stressed public peers unless it
              can prove better economics or a faster route to liquidity.
