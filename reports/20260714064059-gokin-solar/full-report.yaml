      - number: '1.3'
        title: Funding History, Valuation Signals, and IPO Status
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar’s early scale-up was financed unusually aggressively for a company founded in 2019. EqualOcean
              reported a USD250 million Series A in April 2022, while Gokin’s own development-history page calls that
              round a CNY1.6 billion financing. Four months later, Gokin’s history page recorded a Series B of more than
              CNY2.5 billion, and GPCA reported a roughly USD362 million round led by CICC with participation from
              Walden International, Goldstone Investment, Haitong Kaiyuan, and Guangdong-backed financial investors.
              Sina Finance’s September 2022 profile said cumulative financing had already exceeded CNY5 billion and that
              the company’s valuation had reached CNY20 billion. Caplight’s secondary-market profile broadly
              corroborates the timing and investor mix, even though it does not surface a fresh verified post-2022 mark.


              The more current valuation signal is weaker and more cautious. An Eastmoney solar-unicorn summary citing
              the 2025 Hurun Global Unicorn list said Gokin’s valuation had fallen from CNY20.5 billion in the 2024 list
              to CNY14 billion in 2025, with a global rank of 671. That is not an audited financing mark, but it is
              directionally important because it implies that solar oversupply and private-market repricing likely
              compressed Gokin’s paper value relative to the 2022 funding narrative. IPO evidence shows ambition without
              completion: Qichacha records an IPO-counseling filing on 2023-11-28 and lists ten counseling-progress
              reports through 2026-04-15, while Eastmoney’s notice list mirrors the continuing progress reports. The
              cleanest reading is that Gokin remained a private company in 2026, still advancing through counseling
              rather than yet trading publicly.
