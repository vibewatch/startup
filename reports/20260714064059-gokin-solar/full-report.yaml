      - number: '4.2'
        title: 'Pricing, Unit Economics, and Margin Proxies: The Market Is Public, Gokin’s Economics Are Not'
        blocks:
          - type: paragraph
            body: >-
              The public market offers enough information to understand sector pricing pressure, but not enough to
              calculate Gokin’s realized unit economics. TrendForce and pv magazine provide spot-like price references
              for mainstream n-type wafer formats, and the retained sector reporting shows inventories still elevated
              and discounting still active. Public-company peers show how brutal the margin environment remains: LONGi
              was negative on gross margin in Q1 2026, JA Solar barely positive, and even the better-reported names were
              far from healthy. This is the backdrop in which any private wafer maker must sell.


              What is missing is just as important. None of the retained public sources provides Gokin’s ASP by wafer
              type, gross margin, yield loss, scrap rates, receivables cycle, or inventory days. So the most honest
              financial analysis uses peer proxies and sector spot data as outer bounds, while preserving a clear
              evidence gap around Gokin’s own cost stack. That is enough to say pricing is cyclical and margin pressure
              is intense; it is not enough to prove how resilient Gokin itself is inside that cycle.
