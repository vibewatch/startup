  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Wafer Rivals, Integrated Giants, and Technology Adjacent Threats'
        blocks:
          - type: paragraph
            body: >-
              The right competitor set for Gokin Solar is broader than a simple list of wafer brands. At the core are
              direct wafer rivals such as LONGi, TCL Zhonghuan, and GCL-related entities, all of which sit in the
              Chinese manufacturing center that still dominates global wafer output. Around that core sits a second ring
              of vertically integrated giants including JinkoSolar, JA Solar, Trina Solar, and Tongwei. These firms
              matter even when they are not selling wafers as a standalone brand, because they can internalize wafer
              production, bundle downstream modules and solutions, and use export channels to shape demand. A third ring
              consists of technology-specific adjacencies such as Huasun in HJT and AIKO in BC, where differentiated
              architectures can influence what kind of wafer supplier wins next-generation share.


              That framing matters because Gokin is no longer competing only on upstream slicing cost. Its own official
              materials now market wafers, modules, and solutions, and its bankability and BC-summit messaging place it
              in a conversation about technology pathways and downstream trust, not only merchant wafer throughput. The
              competitive question is therefore not merely whether Gokin is top-three in wafer shipments, but whether it
              can defend relevance against larger integrated firms with broader product stacks and stronger public
              channel evidence.
