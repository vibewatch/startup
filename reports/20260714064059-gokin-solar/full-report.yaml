      - number: '2.3'
        title: Buyer Segments and the Shift to Large-Format N-Type Wafers
        blocks:
          - type: paragraph
            body: >-
              The immediate buyers of wafers are not end consumers but cell manufacturers, module producers, and
              vertically integrated PV firms deciding whether to buy externally or consume internally. Downstream payers
              then split into utility developers, commercial-and-industrial rooftop channels, residential installers,
              governments, and EPC contractors. Public sources also show that different segments pull different product
              specifications. Utility-scale and premium efficiency projects particularly favor large-format,
              high-efficiency wafers because they lower cost per watt and improve output, while distributed and
              residential channels care more about module form factor, aesthetics, and bankability. In China
              specifically, utility-scale remained the majority of 2024 additions, but distributed
              commercial-and-industrial installations grew quickly, showing that both centralised and distributed
              channels matter to wafer demand.


              Technology adoption is moving decisively toward Gokin’s preferred territory. EnergyTrend and PV Tech both
              describe a market standardising around M10 and G12-sized wafers, with M6 already phased out and 210-series
              products gaining share. PV Tech’s ITRPV summary says TOPCon surpassed PERC in 2024, n-type wafers held
              about 82% share in 2025, and n-type is expected to dominate almost completely within a decade. Fraunhofer
              likewise says silicon remained 98% of production in 2025 and that n-type represented about 86% of that
              market. Thin-wafer trends, lower kerf loss, and a move to 100-110 μm wafers all support lower material
              cost per watt. Gokin’s official focus on 182mm and 210mm wafers plus BC-compatible module architectures
              therefore aligns with where the market is actually moving.
