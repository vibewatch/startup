  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Market-Cycle and Valuation Risk: Scale Does Not Cancel the Downcycle'
        blocks:
          - type: paragraph
            body: >-
              The highest-probability risk is still the industry itself. Reuters, TrendForce, PVTime, and pv magazine
              all show a sector that has not fully repaired from the oversupply shock. Wafer inventories remain
              elevated, module prices remain near aggressive low bands, and peer manufacturers are still reporting
              losses or near-loss economics. PVTime’s 2024 review is especially stark: wafer prices collapsed across
              formats, P-type economics deteriorated sharply, and module price wars pushed much of the value chain into
              what even sector observers described as a “darkest hour.” TrendForce’s current market data shows that this
              pressure has not cleanly disappeared. Inventory is still high, procurement is weak, and distressed pricing
              is still visible in the module segment.


              For Gokin, that means scale can be a double-edged sword. The company has meaningful shipments, real
              customers, and multi-base production, but it also has more capacity to keep filled during a weak-pricing
              cycle. The valuation signals show that the market already understands this. The 2025 Eastmoney summary of
              Hurun’s unicorn list says Gokin’s paper valuation fell from roughly CNY20.5 billion in 2024 to CNY14
              billion in 2025. That is not a bankruptcy signal, but it is a material repricing of expectations. The key
              risk is therefore not just cyclical price pain; it is the possibility that the market continues to treat
              Gokin as a scale-heavy, margin-light manufacturer until management can prove better pricing discipline,
              healthier route economics, or a credible IPO-quality disclosure package.
