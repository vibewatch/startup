      - number: '1.2'
        title: Leadership, Governance, and Disclosure Boundaries
        blocks:
          - type: paragraph
            body: >-
              The retained evidence consistently points to Xu Zhiqun as the central operating figure. Qichacha lists him
              as legal representative, Sina Finance describes him as chairman and general manager with a prior
              JinkoSolar background, and EnergyTrend still referred to him as founder and chairman in late 2025. This
              combination makes Gokin a founder-led or at least principal-operator-led business in practice, even though
              the fully documented founder roster is thinner than for a public company. Sohu’s late-2025 profile adds
              more governance color: it reported that Gokin changed filed management personnel during 2025, adding
              director Zhang Yang and supervisor Zhang Beibei while keeping Xu Zhiqun in the
              chairman-and-general-manager role. That suggests an evolving board and supervisory structure as the
              company prepared for capital-markets work.


              The bigger diligence point is that disclosure quality remains uneven. Gokin does not yet publish a
              public-company-style investor-relations section with a complete live board matrix, committee charters, or
              detailed executive biographies. Instead, the evidence is fragmented across official corporate pages,
              business-registry aggregators, and media profiles. Governance positives do exist: the
              sustainable-development page makes anti-corruption and risk management part of the company’s “stable
              operation” pillar, and the integrity page exposes audit-committee reporting channels with stated
              whistleblower protection and reward mechanisms. Still, those governance signals should be read alongside
              the limits of private-company transparency. For underwriting purposes, Gokin looks professionally managed
              but not yet fully disclosed.
            claimRefs:
              - CO015
