      - number: '1.5'
        title: Cautionary Signals and What Remains Unclear
        blocks:
          - type: paragraph
            body: >-
              Despite the scale story, several caution flags remain visible in public data. First, employee and
              disclosure figures are not internally consistent: Gokin’s official profile says the company had more than
              6,000 employees in 2024, ENF lists 7,900 staff, and Qichacha shows the holding-company entity with fewer
              than 50 personnel and only 39 insured employees. That gap is understandable if different sources are
              counting different legal entities or only head-office payroll, but it means investors should not quote a
              current 2026 headcount as settled fact. Second, public disclosure on cap table, profitability, and current
              leverage remains thin. The company highlights revenue, patents, and shipments, but there is no public
              prospectus or audited financial package in the retained source set.


              Third, the public adverse surface is small but real. Qichacha’s risk overview lists three judicial cases,
              one judgment document, and four hearing announcements, while the 2025 Eastmoney solar-unicorn summary
              explicitly framed Gokin as part of a broad photovoltaic valuation compression cycle. Sohu also said
              Gokin’s IPO plan had stalled by late 2025 even as governance filings changed. None of those signals is
              fatal on its own, but together they mean the company-overview case should be read as “large, fast-scaling,
              and strategically relevant” rather than “fully transparent.” Later chapters need to pressure-test whether
              Gokin’s operating scale translates into durable margins, customer quality, and a defensible valuation
              through a downcycle.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
