  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Segments and Geographic Footprint: Broad Reach, Mostly Channel-Led Proof'
        blocks:
          - type: paragraph
            body: >-
              The customer evidence points to a business that sells through multiple buying entities rather than one
              simple direct-sales model. Official globalization and company-profile materials describe a footprint
              spanning 30-plus countries or regions, 4 production bases, 5 solar-farm business-development centers, and
              2,900-plus global partners. That by itself does not prove monetization quality, but it sets the stage for
              the more important point: named public customer evidence repeatedly appears through distributors,
              EPC-facing channels, procurement pools, and project accounts. Brazil, Poland, Spain, and Australia all
              show public channel-building activity, while China provides project and procurement examples that look
              more like institutional or utility-scale demand.


              The channel shape is therefore clearer than the revenue shape. Gokin appears to sell to distributors who
              then serve installers and EPCs, to project developers and public-market buyers through procurement or
              partnership frameworks, and to named infrastructure or industrial projects through direct module supply.
              The public record is good enough to segment the customer base by payer and user: distributors and
              procurement buyers appear to pay, installers and EPCs appear to implement, and end-project owners or
