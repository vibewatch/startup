chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Legal Footprint, and Business Scope
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar presents itself as a Zhuhai-based photovoltaic manufacturer that began as a wafer specialist
              and has since widened into modules, solar-project solutions, and broader green-energy services. The core
              identity is consistent across the English homepage, the about page, and the globalization page: the
              company focuses on monocrystalline silicon ingots and wafers, high-efficiency modules, and downstream
              solution delivery. Registry-style data from Qichacha add legal precision, showing the operating legal
              entity as Gokin Solar Co., Ltd. with a 2019-07-03 establishment date and a Hengqin Huajin Street address
              in Zhuhai. Official history materials, however, place the company-establishment milestone on 2019-03-07,
              which suggests that Gokin’s operational formation narrative predates the current legal-entity registration
              date.


              The operating footprint is large for a company that remains privately held. Official materials say Gokin
              has four production bases, five solar-farm business-development centers, and one sales-and-marketing
              center, while the globalization page maps production or office activity across Guangdong, Qinghai,
              Sichuan, Jiangsu, Hong Kong, Malaysia, Thailand, Vietnam, Australia, Germany, Italy, and the Netherlands.
              That footprint matters because later chapters depend on whether Gokin is merely a domestic wafer plant or
              a vertically integrating exporter with real module and downstream ambitions. Official product pages and
              ENF’s supplier profile both support the latter reading: Gokin is no longer only selling wafers, but is
              building an integrated chain from ingots and wafers into modules, project development, and associated
              services.
