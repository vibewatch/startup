      - number: '8.3'
        title: 'Scenario Ranges and Recommendation: Track Now, Pay Up Only After Proof'
        blocks:
          - type: paragraph
            body: >-
              The scenario work points toward a price-sensitive middle ground. A low-end 0.4x-sales case values Gokin
              near CNY8 billion, roughly where a stressed-cycle private entry starts to look differentiated from simply
              buying liquid public risk. A 0.5x-sales case implies about CNY10 billion and better matches the idea of
              paying something for Gokin’s visible scale while still preserving a private-market discount. The current
              0.7x-sales headline aligns with about CNY14 billion and therefore assumes either that Gokin deserves to
              sit above several public peers already or that its BC transition, channel expansion, and IPO path will
              close the quality gap soon. A 1.0x-sales outcome, roughly CNY20 billion, would require much stronger proof
              on margin, balance-sheet resilience, and disclosure than the retained set currently provides.


              That leads to a practical recommendation: track or research more, rather than buy at the current public
              mark. The bull case is real—BC scale-up, bankability entry, and international distribution could move
              Gokin toward a higher-quality earnings story. The bear case is equally real—another pricing relapse, a
              slow IPO process, or hidden working-capital stress could pull fair value closer to CNY8–10 billion.
              Because both tails are plausible and the evidence quality on core financial variables remains incomplete,
              the right answer is to demand either a materially lower entry or a materially better disclosure package
              before underwriting.
