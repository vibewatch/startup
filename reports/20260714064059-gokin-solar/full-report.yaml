        title: 'Exit Readiness and Final Diligence Asks: The Missing Data Is Valuation-Critical, Not Cosmetic'
        blocks:
          - type: paragraph
            body: >-
              Gokin does have an exit story. The IPO counseling process is active, the business is large enough to
              matter, and the company has begun to accumulate public-quality proof points such as bankability inclusion
              and BC manufacturing milestones. But exit possibility is not the same as exit readiness. The retained
              evidence still does not answer several questions that would directly change value: whether current-period
              gross margin is positive after financing and inventory effects, whether working capital is stretching
              under weak pricing, whether the cap table contains preference or pledge overhang, and how concentrated
              revenue remains by distributor, customer, or region. Those are not secondary diligence items. They are the
              variables that decide whether Gokin deserves to clear public-peer multiples or trade below them.


              The final diligence list is therefore intentionally narrow and commercial. Investors need audited
              2024–2025 statements, debt and covenant schedules, customer-concentration and sell-through data,
              BC-versus-wafer route economics, warranty and inventory-ageing detail, and pre-IPO capital-structure
              documents. If those materials show healthier economics than the public peer set, the recommendation can
              move up quickly. If they show commodity-level margins, concentration, or hidden leverage, then even the
              current Hurun mark may still be generous. Until then, the valuation answer is not “no”—it is “only at the
              right price, and only after the missing proof arrives.”
