  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Streams and Public Traction: Real Scale, Narrow Visibility'
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to say that Gokin Solar is already operating at serious industrial scale.
              The official company profile reports more than CNY20 billion of 2023 operating revenue, thousands of
              employees, hundreds of patents, and a partner base in the thousands. The bankability release adds shipment
              proxies that matter more than abstract unicorn branding: cumulative wafer shipments above 200GW, more than
              7GW of 2025 module shipments, and a claim that roughly one in seven solar modules worldwide incorporates
              Gokin wafers. Those are not startup metrics.


              At the same time, the public revenue story is narrow. Gokin’s official pages clearly describe wafers,
              modules, and some solution capability, but they do not disclose segment mix, customer concentration,
              renewal behavior, or regional revenue splits. That means the evidence supports industrial traction without
              yet supporting a precise view of revenue quality. Investors can see that there is a large business; they
              cannot yet see how much of it is repeatable at attractive margins.
