              reported that Gokin secured 1.2GW in CGN New Energy’s 2026 procurement pool after 1.5GW in 2025, which is
              one of the clearest repeat-procurement signals in the retained set.


              The quality of this proof is good, but not uniform. Distributor announcements are credible evidence of
              channel access, and procurement-pool wins are better than generic exhibition attendance. Yet many of these
              proofs still sit one step away from fully disclosed end-customer economics. A signed distributor target
              does not automatically reveal sell-through velocity. A procurement-pool qualification does not disclose
              delivered margin. A project casebook can show deployment, but not whether it generated follow-on orders.
              So the right conclusion is that Gokin’s customer base is real and internationally distributed, while the
              best public proofs remain more about channel activation, procurement access, and project presence than
