companyProfile:
  summary: >-
    Gokin Solar is a Zhuhai-headquartered private photovoltaic manufacturer founded in 2019 that scaled rapidly from
    monocrystalline silicon ingots and wafers into modules and broader solar solutions. Public evidence supports large
