- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Distributor-led beachhead entry in Spain, Poland, Brazil, and Australia
    - A few strong distributors may represent disproportionate near-term volume
    - Fast scale but hidden account concentration
    - Request top-10 accounts, channel mix, and exclusivity terms by region
  - - Utility procurement-pool participation
    - Large tender pools can create lumpy revenue and pricing pressure
    - Shipment visibility can outrun realized margin quality
    - Request award-to-delivery conversion and account-level gross margin
  - - Domestic ecosystem agreements such as Zhongtuo
    - Channel expansion can deepen partner dependence without public economics
    - Creates exposure to a few integrator ecosystems
    - Request partner contribution margin and pipeline by channel
  - - Brazilian localization strategy
    - Local climate fit may not translate into durable installer loyalty
    - Can create marketing strength without retention proof
    - Request repeat-order data by installer/distributor and warranty-claim outcomes
  - - European premium BC positioning
    - Higher-value modules may depend on a narrow premium-residential segment
    - Good ASP potential but narrower buyer base
    - Request segment revenue split and attach rate by product family
  - - Trade barriers and price war environment
    - Tariffs and oversupply can weaken distributor economics and switching costs
    - Channels may demand lower pricing or diversify suppliers quickly
    - Stress-test top markets under tariff, FX, and module-price scenarios
  notes: The risk table separates expansion mechanics from revenue predictability. Growth is visible; concentration transparency is not.
