  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / evidence
  - Revenue / strategic value
  - Gap
  rows:
  - - Overseas distributors
    - Buyer/payer = national distributor; user = installer/EPC network
    - Stock, logistics, local technical support, reseller enablement
    - Named partners in Brazil, Poland, Spain, Australia
    - Fast market entry and localized support
    - No public sell-through or distributor concentration data
  - - Installers and EPCs
    - User = installer/EPC; payer may be distributor or project owner
    - Module selection, design support, installation, commissioning
    - Spain and Australia coverage explicitly cites installers/EPCs
    - Critical for channel scale and service quality
    - No public installer-count or repeat-order metrics
  - - Utility / procurement pools
    - Buyer/payer = centralized procurement entity or utility buyer
    - Large-scale module supply for utility and institutional projects
    - CGN 2025/2026 procurement pool evidence
    - High-volume route if qualification converts to delivery
    - Margins and delivered volume versus pool qualification are undisclosed
  - - Industrial / commercial project owners
    - Buyer may be developer/EPC; user/payer = industrial or commercial host
    - Rooftop, airport, and commercial distributed projects
    - Yibin Airport and Brazilian C&I positioning
    - Creates reference sites and high-visibility proof
    - No public renewal or add-on order data
  - - Residential and premium rooftop channels
    - Buyer = distributor/installer; user = household or small commercial owner
    - All-black BC and other premium modules for aesthetic-sensitive rooftops
    - Spain, Amsterdam, and Brazil messaging
    - Supports higher-value BC proposition
    - No public attach rate or homeowner satisfaction metrics
  - - Domestic ecosystem / channel integrators
    - Buyer/payer = strategic partner or supply-chain organizer
    - Module supply plus market-channel cooperation and project ecosystem buildout
    - Zhongtuo Guangying agreement
    - Can broaden domestic route-to-market and power-plant business
    - Public sources do not quantify revenue contribution or exclusivity
  notes: The segmentation uses payer-user-buyer distinctions because distributor-led PV channels separate who signs the order from who installs or consumes the module.
