- id: durability-concentration
  title: 'Durability, Expansion, and Concentration: Evidence of Expansion Loops, Little Transparency on Concentration'
  body: 'Public evidence is strongest on expansion vectors and weakest on durability metrics. Expansion vectors are visible: Gokin appears to enter new markets through local distributors, reinforces the channel with exhibitions and workshops, then tries to move from pilot visibility to larger annual or procurement relationships. Brazil, Spain, Poland, and Australia each show some version of that pattern. China’s procurement evidence shows another expansion loop: once a utility or state-linked buyer qualifies Gokin, future rounds can turn into repeat supply opportunities. The Zhongtuo Guangying agreement adds a domestic channel-and-supply-chain expansion route around module and power-plant business.


    What is missing is the data investors usually need to underwrite customer quality. No retained public source gives net revenue retention, gross retention, churn, renewal rate, contract length, top-customer revenue share, geographic revenue mix, or share of shipments attributable to any one distributor or procurement program. That silence matters more in a solar downcycle. Reuters reported that overcapacity, tariffs, and ongoing price wars are pushing Chinese manufacturers to seek new markets outside China while margins remain under pressure. In that context, a distributor-led overseas model can scale quickly, but it can also hide concentration and pricing risk. Public evidence therefore supports expansion momentum without yet supporting confidence on customer stickiness or concentration resilience.'
