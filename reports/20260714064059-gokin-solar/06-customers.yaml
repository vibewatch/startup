- id: customer-verdict
  title: 'Customer Verdict: Real Adoption Surface, Still a Diligence Discount on Customer Quality'
  body: 'The customer verdict is better than for many private industrial companies because named channel, procurement, and project proofs already exist across several regions. Gokin is clearly not relying only on theoretical demand: it has named Brazilian, Polish, Spanish, and Australian channel partners; visible Chinese procurement and project examples; and a shipment scale claim that would be hard to reconcile with pure pilot-stage activity. That makes the customer base look commercially real.


    But the chapter cannot honestly upgrade this to high-confidence customer quality yet. The public record is too thin on retention, concentration, and realized customer economics. Investors can see signed annual targets and supply agreements, but not the sell-through, repeat-order, or account-mix data behind them. In practice, Gokin looks like a company with credible customer acquisition and channel expansion, but with customer durability still under-disclosed. Until management provides geography split, top-account share, renewal behavior, and repeat-buy data by channel, the customer chapter supports traction and expansion more strongly than it supports predictability.'
