- id: named-proof
  title: 'Named Customer Proof: Real Distributors, Real Procurement, Limited Retention Visibility'
  body: 'The strongest named customer proof is overseas distribution and procurement proof. In Brazil, Gokin publicly announced a 100MW supply agreement with Serrana Solar and quoted Serrana’s CEO praising module quality, reliability, and stability. In Poland, Gokin announced a 200MW annual target with Grodno S.A. and named Grodno as general distributor. In Spain, multiple trade publications reported that Master Battery became Gokin’s first official distributor with local stock and technical support. In Australia, Gokin paired its OSW partnership with installer workshops and localized market positioning. In China, Solarbytes reported that Gokin secured 1.2GW in CGN New Energy’s 2026 procurement pool after 1.5GW in 2025, which is one of the clearest repeat-procurement signals in the retained set.


    The quality of this proof is good, but not uniform. Distributor announcements are credible evidence of channel access, and procurement-pool wins are better than generic exhibition attendance. Yet many of these proofs still sit one step away from fully disclosed end-customer economics. A signed distributor target does not automatically reveal sell-through velocity. A procurement-pool qualification does not disclose delivered margin. A project casebook can show deployment, but not whether it generated follow-on orders. So the right conclusion is that Gokin’s customer base is real and internationally distributed, while the best public proofs remain more about channel activation, procurement access, and project presence than about disclosed long-term retention.'
