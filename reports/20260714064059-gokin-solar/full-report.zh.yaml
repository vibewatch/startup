  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：硅片是关键中游节点
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar
              合适的市场边界，比“所有太阳能”窄，但又比单一外售硅片线宽。硅片位于晶硅链条中硅锭生长和电池片生产之间，其经济性由下游组件和项目需求牵引。市场研究来源一致把硅片描述为电池片和组件制造商服务户用、工商业及公用事业项目时使用的基础部件。这意味着，直接相关的支出池是
              c-Si 供应链里的硅片层，包括外售和一体化制造商内部转移。下游装机仍然关键，因为它决定能吸收多少硅片需求；但花在组件、EPC 或项目融资上的每一美元，并不都属于 Gokin 的直接 TAM。


              这个区分重要，因为硅片行业高度一体化，且常常被内部消化。同一批生产硅片的公司也可能在电池片和组件环节内部使用硅片，这让纯外售硅片需求比整体太阳能装机更难拆分。Gokin
              自己的定位也支持这种更宽的一体化解读：官方材料覆盖硅片、组件和解决方案交付，因此公司参与的是一个上游硅片产能既可外售、也可在更宽产品栈内部消化的市场。本章因此把全球太阳能装机视为需求驱动，把硅片市场收入报告视为不完美的测算镜头，并把一体化
              c-Si 供应链视为实际经济场。
            claimRefs:
