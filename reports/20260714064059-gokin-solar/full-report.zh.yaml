  - id: TV006
    title: 最终尽调待索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 审计财务
        - 2024、2025 年审计报表，以及 2026 年年初至今的桥接表
        - 把宽估值区间收敛为可投资价格的核心输入
        - 管理层、审计师和资料室
      - - 债务与契约
        - 借款、到期梯队、质押、担保和契约余量
        - 决定规模扩张能否穿越周期获得融资
        - 资金团队和贷款方
      - - 客户集中度
        - 头部客户、区域、应收账款和复购行为
        - 决定收入质量是否配得上同业溢价
        - 销售运营和财务
      - - 技术路线经济性
        - BC 相对硅片的毛利率、良率、产能利用率和质保准备
        - 检验上行空间来自经济性，还是只是叙事
        - 运营和 FP&A
      - - 资本结构
        - 股权结构表、优先权层级、期权和附属协议
        - 防止为劣后股权付太高价格
        - 法律顾问和公司秘书
      - - IPO 准备度
        - 辅导报告、董事会准备度、内控以及时间表障碍
        - 直接影响退出折价与时间
        - 保荐人、律师和 CFO
    notes: 这里列出的每项尽调要求都关乎估值，不是表面功夫。
