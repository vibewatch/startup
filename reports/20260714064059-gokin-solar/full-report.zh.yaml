      - number: '7.2'
        title: 监管、法律与 IPO 风险：公开状态可见，完整敞口不可见
        blocks:
          - type: paragraph
            body: >-
              下一组主要风险是法律监管和融资流程风险。Qichacha 的 IPO 页面显示，Gokin 于 2023-11-28 提交辅导备案，到 2026-04-15
              已进入第十期进展报告，但仍未完成上市。这意味着辅导真实存在，完成风险也同样真实。在艰难市场里，一家明显寻求资本市场入口但尚未上市的民营制造商，同时面对时点风险、披露风险和估值重置风险。Eastmoney
              公告页面进一步说明，公司仍处在上市前披露流程中，而不是已经进入完整上市公司制度。


              贸易和法律敞口又加了一层。美国贸易救济门户和 WTO 贸易救济门户都显示，中国工业出口商仍处在一个反倾销、反补贴和 Section 301 式行动都很重要的世界。即使 Gokin
              没有在每项行动中被点名，其出口策略也位于这样的政策环境之内。同时，Qichacha 风险概览称公司有 3 起司法案件、1 份裁判文书和 4
              条开庭公告，但保留材料没有详细还原这些案件。因此，中国裁判文书网显然是一条尽调路径，而不是已经关闭的问题。换句话说，公司的法律和监管表面不一定令人警觉，但仍不完整，投资者不应默认按“干净”承销。
