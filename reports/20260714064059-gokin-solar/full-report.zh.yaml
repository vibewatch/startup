      - number: '1.2'
        title: 领导层、治理与披露边界
        blocks:
          - type: paragraph
            body: >-
              已留存证据一致指向 Xu Zhiqun 是核心运营人物。Qichacha 将其列为法定代表人，Sina Finance 称其为董事长兼总经理且曾在 JinkoSolar 任职，EnergyTrend 到 2025
              年末仍称其为创始人兼董事长。综合来看，Gokin 在实际运作上是一家由创始人或至少由主要运营者主导的企业，尽管完整创始人名单的文件化程度低于上市公司。Sohu 的 2025
              年末画像补充了更多治理信息：报道称，Gokin 在 2025 年变更了备案管理人员，新增董事 Zhang Yang 和监事 Zhang Beibei，同时 Xu Zhiqun
              继续担任董事长兼总经理。这说明，公司在准备资本市场工作时，董事会和监督结构也在演进。


              更关键的尽调点在于，披露质量仍不均衡。Gokin
              还没有发布上市公司式投资者关系栏目，也没有完整的实时董事会矩阵、委员会章程或高管详细履历。现有证据分散在官方公司页面、工商登记聚合器和媒体画像里。治理上的积极信号确实存在：可持续发展页面把反腐败和风险管理纳入公司的“稳定运营”支柱，廉洁页面公开了审计委员会举报渠道，并写明举报人保护和奖励机制。即便如此，这些治理信号仍必须和民营公司透明度有限这一事实一起读。按承销视角看，Gokin
              像是一家专业化管理的公司，但尚未做到充分披露。
