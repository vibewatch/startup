      - number: '6.2'
        title: 具名客户证明：真实分销商、真实采购，但留存能见度有限
        blocks:
          - type: paragraph
            body: >-
              最强的具名客户证明来自海外分销和采购。在巴西，Gokin 公开宣布与 Serrana Solar 签署 100MW 供应协议，并引用 Serrana CEO 对组件质量、可靠性和稳定性的认可。在波兰，Gokin
              宣布与 Grodno S.A. 达成 200MW 年度目标，并称 Grodno 为总经销商。在西班牙，多家行业媒体报道 Master Battery 成为 Gokin
              首家官方分销商，提供本地库存和技术支持。在澳大利亚，Gokin 把与 OSW 的合作配套安装商培训和本地化市场定位。在中国，Solarbytes 报道称 Gokin 继 2025 年 1.5GW
              之后，又进入中广核新能源 2026 年 1.2GW 采购池，这是保留材料里最清晰的重复采购信号之一。


              这些证明质量不错，但并不均衡。分销商公告能可信地证明渠道入口；进入采购池比普通参展更有含金量。但其中不少证据距离完整披露终端客户经济性仍隔着一层。签下分销商年度目标，并不会自动说明终端销售速度。采购池资格也不披露交付利润率。项目案例集能展示落地，却不能说明是否带来后续订单。因此，合理结论是：Gokin
              的客户群真实且分布在多个国际市场；但最强的公开证据更多说明渠道启动、采购入口和项目存在，而不是披露出的长期留存。
