  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 过剩 / 价格战
        - 硅片和组件价格
        - 硅片或组件价格再次持续下探，但成本端未同步退出
        - 重新评估利润率耐受性；考虑规避 / 减仓立场
      - - IPO 路径失败
        - 辅导和上市时间表
        - 下一个主要报告周期内，辅导之外没有实质进展
        - 提高融资折价，并推动替代流动性方案
      - - 渠道集中
        - 头部分销商或采购依赖
        - 某一伙伴或买方似乎占出货量过大份额
        - 要求集中度契约、分散化计划或修订估值倍数
      - - BC 商业化风险
        - 质保 / 现场失效 / 良率指标
        - BC 产线出现质保索赔、良率滑坡或认证受挫
        - 暂停按 BC 溢价上行情景承保，退回商品化路线假设
      - - 贸易政策升级
        - 重点路线出现新关税 / AD/CVD / 规避认定
        - 主要出口市场经济性发生实质变化
        - 下调海外增长假设，并重审渠道策略
      - - 法律 / 环保意外
        - 法院、许可或执法发现
        - 出现重大未披露诉讼、许可问题或环保不合规
        - 在范围和整改得到核实前，按投资论点破裂处理
    notes: 否决标准聚焦可衡量触发项，而不是泛泛提醒。每一项都应在尽调或后续更新中直接核查。
