    Gokin Solar 是一家总部位于珠海的民营光伏制造商，2019
    年成立，从单晶硅锭和硅片快速扩展到组件及更广的太阳能解决方案。公开证据支持其制造产能大、全球出货有分量，并且渠道已经拓展到欧洲、拉丁美洲、澳大利亚和亚洲；同时也显示，公司仍然资本开支重、周期性强，IPO
    辅导还在推进中。因此，更合适的理解是：Gokin Solar 是一个后期产业型太阳能平台，商业验证可见，但披露质量仍停留在民营公司阶段。
