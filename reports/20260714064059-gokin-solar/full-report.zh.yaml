      - number: '8.4'
        title: 退出准备度与最终尽调问题：缺失数据影响估值，不是装饰项
        blocks:
          - type: paragraph
            body: >-
              Gokin 确实有退出故事。IPO 辅导流程活跃，业务规模足够重要，公司也开始积累进入可融资性名单、BC
              制造里程碑等公开质量证明。但退出可能性不等于退出准备度。保留证据仍未回答几个会直接改变价值的问题：当期毛利率在融资和库存影响后是否为正，弱定价下营运资金是否被拉长，股权结构中是否存在优先权或质押悬挂，以及收入按分销商、客户或地区看仍有多集中。这些不是次要尽调项，而是决定
              Gokin 应当跑赢上市同业倍数，还是折价交易的变量。


              因此，最终尽调清单刻意保持狭窄且商业化。投资者需要经审计的 2024–2025 年报表、债务和契约表、客户集中度和终端销售数据、BC 与硅片路线经济性、质保和库存库龄细节，以及 IPO
              前资本结构文件。如果这些材料显示其经济性优于公开同业组，建议可以很快上调。如果它们显示商品级利润率、集中度或隐藏杠杆，那么即使当前 Hurun
              标记也可能仍然慷慨。在此之前，估值答案不是“否”，而是“只有价格合适，且缺失证据到位后才行”。
            claimRefs:
