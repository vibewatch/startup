  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接硅片对手、一体化巨头与技术邻近威胁
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar 的正确竞争集，不是一份简单的硅片品牌清单。核心层是 LONGi、TCL Zhonghuan 和 GCL 系实体等直接硅片对手，它们都处在仍主导全球硅片产出的中国制造中心。核心外圈是
              JinkoSolar、JA Solar、Trina Solar 和 Tongwei
              等纵向一体化巨头。即便这些公司不把硅片作为独立品牌销售，它们仍然重要，因为它们可以内部消化硅片生产，捆绑下游组件和解决方案，并用出口渠道塑造需求。第三圈是 Huasun 的 HJT、AIKO 的 BC
              等特定技术邻近方；差异化架构会影响下一代份额由哪类硅片供应商拿走。


              这个框架重要，因为 Gokin 已不只是在上游切片成本上竞争。其官方材料现在营销硅片、组件和解决方案；可融资性与 BC 峰会叙事也把公司放进技术路径和下游信任的讨论，而不只是外售硅片吞吐量。竞争问题因此不只是
              Gokin 是否位列硅片出货前三，而是面对产品栈更宽、公开渠道证据更强的大型一体化公司，它能否守住相关性。
