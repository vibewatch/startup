  - id: TV005
    title: 论点破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - IPO 路径实质停滞
        - 又一个报告周期过去，辅导仍在继续，但准备度没有可见提升
        - 削弱退出可选性，要求更大的未上市折价
        - 避免按名义估值买单
      - - 硅片 / 组件价格战再度加深
        - 公开价格跟踪数据与同业亏损进一步恶化
        - 压低合理同业估值区间，并抬高流动性风险
        - 按熊市情景重新测算
      - - 非公开尽调显示经济性已接近大宗品
        - BC 与组件路线的利润率不优于承压同业
        - 削弱为高于公开同业低端估值买单的主要理由
        - 要求更深折价，或直接放弃
      - - 客户集中度高
        - 少数渠道主导收入或回款
        - 抬高收入质量与营运资本风险
        - 下调估值，或要求结构性保护
      - - 资本结构存在悬顶压力
        - 优先权、质押或债务优先级高于预期
        - 削弱名义股权价值的吸引力
        - 按普通股权益现实重新定价
      - - 信息披露显著改善
        - 审计报表与上市准备度证据到位
        - 支持从跟踪标的推进为可投资标的
        - 上调估值区间与投资建议
    notes: 这些都是一票否决触发项，因为每一项都会改变投资人真正买到的东西：一个已降风险的工业平台，还是一个不透明的周期性制造商。
    claimRefs:
      - CV006
      - CV033
      - CV034
