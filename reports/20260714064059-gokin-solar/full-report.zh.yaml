  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与技术路线：有意搭建的多路线栈
        blocks:
          - type: paragraph
            body: >-
              Gokin 的产品版图已经远不止单一硅片业务。公司英文产品页和下载中心显示，上游硅片线围绕大尺寸单晶硅片搭建，下游组件组合则覆盖 BC、TOPCon、HJT 以及兼容传统 PERC
              的定位。硅片侧，公开规格很具体而不是空泛：N 型页面列出 M10、G12 和 G12-R 尺寸，厚度 90–160µm；P 型页面仍显示包含 M10 和 G12 尺寸的传统路线。组件侧，FLAMINGO 系列锚定
              TOPCon，WING 系列锚定 HJT，GOKIN BC 系列锚定公司更新的背接触推进。这很重要，因为它说明 Gokin
              不只押注一种架构，也不只押注链条中的一个环节。公司试图以硅片规模为底座，同时为不同客户和地区需求提供多条组件技术路线。


              最强的产品信号是，Gokin 把 BC 呈现为一条打包好的商业产品线，而不是实验室样机。GOKIN BC 页面及其可下载数据表展示了命名 SKU、质保条款、温度系数、包装细节和安装导向参数。同时，TOPCon 与
              HJT 产品页显示，Gokin 仍在提供更主流或替代效率路线，并没有放弃它们。最清晰的解读是，Gokin 的产品策略是一种组合策略：用 TOPCon 和 HJT 保留广泛、可获融资认可的覆盖，同时尝试把 BC
              推进到更高价值场景——那些更重视美观、热性能和遮阴韧性的场景。
