              官方页面清楚描述了硅片、组件和部分解决方案能力，但没有披露分部组合、客户集中度、续约行为或区域收入拆分。因此，证据支持产业牵引，却尚不能支持对收入质量的精确判断。投资人能看到这里有一门大生意；但还看不到有多少收入能以有吸引力的利润率重复发生。
