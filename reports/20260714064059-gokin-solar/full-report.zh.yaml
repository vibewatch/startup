      - number: '8.3'
        title: 情景区间与建议：现在跟踪，只有证据到位后才加价
        blocks:
          - type: paragraph
            body: >-
              情景分析指向一个对价格敏感的中间地带。低端 0.4x 销售额情景把 Gokin 估在接近 CNY8 billion，大致是承压周期里民营入场开始区别于直接买入流动性上市风险的位置。0.5x 销售额情景意味着约
              CNY10 billion，更符合为 Gokin 可见规模支付一定价格、同时保留民营市场折价的思路。当前 0.7x 销售额名义数字对应约 CNY14 billion，因此隐含的假设是：Gokin
              已经理应高于几家上市同业，或其 BC 转型、渠道扩张和 IPO 路径很快会补上质量差距。1.0x 销售额结果约为 CNY20 billion，需要在利润率、资产负债表韧性和披露上拿出比保留材料目前强得多的证据。


              因此，实际建议是继续跟踪或进一步研究，而不是按当前公开标记买入。多头故事真实存在——BC 放量、进入可融资性名单和国际分销，可能把 Gokin 推向更高质量的盈利故事。空头故事也同样真实——又一轮价格下探、IPO
              进程缓慢或隐藏的营运资金压力，可能把公允价值拉近 CNY8–10 billion。由于两端都说得通，而核心财务变量的证据质量仍不完整，正确做法是在承销前要求实质性更低的入场价，或实质性更好的披露包。
