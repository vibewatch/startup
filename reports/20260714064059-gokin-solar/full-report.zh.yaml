            body: >-
              Gokin 的制造版图意味着持续资本需求很大。官方历史和第三方报道共同描述了珠海、西宁、宜宾多基地的巨额投资，以及向硅锭、硅片和组件的快速扩产。2022
              年股权融资规模很大，并且明显与项目建设挂钩，而不只是为了通用公司流动性。供应商协议和早期客户订单也显示，公司商业模式里，长规划周期、原材料承诺和营运资金需求具有结构性重要性。


              但公开记录仍没给出承销商最想知道的东西：账上现金、债务期限结构、月度现金消耗、库存融资、契约余量或资金可支撑周期。活跃的 IPO
              辅导流程显示，管理层认识到需要更广资本市场入口；但辅导进展不等于已经上市，也不等于资产负债表已经去风险化。这让资本充足性成为本章最清晰的未解尽调项。
