    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与业务范围
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar
              将自己定位为一家珠海光伏制造商，起步时专注硅片，之后扩展到组件、太阳能项目解决方案和更广的绿色能源服务。英文首页、关于页面和全球化页面给出的核心身份一致：公司聚焦单晶硅锭和硅片、高效组件，以及下游解决方案交付。Qichacha
              的登记类数据补上了法律精度：运营主体为 Gokin Solar Co., Ltd.，成立日期为 2019-07-03，地址在珠海 Hengqin Huajin Street。不过，官方历史材料把公司成立里程碑放在
              2019-03-07，这说明 Gokin 的运营组建叙事早于当前法律实体的登记日期。


              作为一家仍未上市的公司，Gokin 的运营版图已经很大。官方材料称，Gokin
              拥有四个生产基地、五个太阳能电站业务开发中心和一个销售与营销中心；全球化页面则标出了广东、青海、四川、江苏、香港、马来西亚、泰国、越南、澳大利亚、德国、意大利和荷兰的生产或办公室活动。这个版图重要，因为后续章节要判断
              Gokin 只是国内硅片厂，还是一个有真实组件和下游野心、正在纵向整合的出口商。官方产品页面和 ENF 供应商档案都支持后一种判断：Gokin
              已不只是卖硅片，而是在搭建从硅锭、硅片到组件、项目开发和配套服务的一体化链条。
