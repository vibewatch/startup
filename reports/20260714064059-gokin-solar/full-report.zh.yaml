      - number: '6.3'
        title: 耐久性、扩张与集中度：扩张回路有证据，集中度透明度很低
        blocks:
          - type: paragraph
            body: >-
              公开证据最能证明扩张路径，最难证明耐久性指标。扩张路径看得见：Gokin
              似乎通过本地分销商进入新市场，再用展会和培训强化渠道，然后尝试从试点曝光走向更大的年度关系或采购关系。巴西、西班牙、波兰和澳大利亚都呈现了某种版本。中国的采购证据展示了另一条扩张回路：一旦公用事业公司或国资相关买家认可
              Gokin，后续轮次就可能变成重复供应机会。中拓光盈协议又为组件和电站业务增加了一条国内渠道与供应链扩张路径。


              缺的是投资者通常需要用来判断客户质量的数据。保留的公开来源没有给出净收入留存、总留存、流失率、续约率、合同期限、头部客户收入占比、地域收入结构，或任何单一分销商、采购项目贡献的出货占比。太阳能下行周期里，这种沉默更重要。Reuters
              报道称，产能过剩、关税和持续价格战正在迫使中国制造商开拓中国以外的新市场，而利润率仍承压。在这种背景下，分销商驱动的海外模式可以快速放量，也可能掩盖集中度和定价风险。因此，公开证据支持扩张动能，但尚不足以支撑对客户黏性或集中度韧性的信心。
