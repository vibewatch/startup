      - number: '2.3'
        title: 买方分层与大尺寸 N 型硅片迁移
        blocks:
          - type: paragraph
            body: >-
              硅片的直接买方不是终端消费者，而是电池片制造商、组件生产商，以及决定外采还是内部消化的纵向一体化光伏公司。下游付款方再分为公用事业开发商、工商业屋顶渠道、户用安装商、政府和 EPC
              承包商。公开来源还显示，不同细分场景拉动不同产品规格。公用事业级和高端高效率项目尤其偏好大尺寸、高效率硅片，因为它们能降低每瓦成本并提升发电输出；分布式和户用渠道则更看重组件外形、外观和可融资性。在中国，公用事业级项目仍占
              2024 年新增装机多数，但分布式工商业装机增长很快，说明集中式和分布式渠道都会影响硅片需求。


              技术采用正坚决移动到 Gokin 偏好的地带。EnergyTrend 和 PV Tech 都描述了一个围绕 M10 与 G12 尺寸硅片标准化的市场：M6 已经出清，210 系列产品份额上升。PV Tech 的
              ITRPV 摘要称，TOPCon 在 2024 年超过 PERC，n 型硅片在 2025 年约占 82%，且 n 型预计十年内几乎完全主导市场。Fraunhofer 同样称，2025 年硅材料仍占产量 98%，n
              型约占该市场 86%。薄片趋势、更低切割损失，以及向 100-110 μm 硅片迁移，都支持降低每瓦材料成本。因此，Gokin 官方聚焦 182mm 和 210mm 硅片，并叠加兼容 BC
              的组件架构，符合市场实际前进方向。
