      - number: '1.3'
        title: 融资历史、估值信号与 IPO 状态
        blocks:
          - type: paragraph
            body: >-
              对一家 2019 年成立的公司而言，Gokin Solar 早期扩张的融资力度异常激进。EqualOcean 报道其在 2022 年 4 月完成 USD250 million A 轮；Gokin
              自己的发展历史页面则称该轮融资为 CNY1.6 billion。四个月后，Gokin 的历史页面记录了一笔超过 CNY2.5 billion 的 B 轮，GPCA 报道该轮规模约 USD362 million，由
              CICC 领投，Walden International、Goldstone Investment、Haitong Kaiyuan 以及广东背景金融投资人参与。Sina Finance 2022 年 9
              月的画像称，公司累计融资已超过 CNY5 billion，估值达到 CNY20 billion。Caplight 的二级市场档案大体佐证了融资时间和投资人组合，尽管没有呈现 2022 年之后新的、已验证估值标记。


              更近的估值信号更弱，也更需要谨慎。Eastmoney 一篇引用 2025 Hurun Global Unicorn 榜单的太阳能独角兽汇总称，Gokin 的估值从 2024 年榜单的 CNY20.5
              billion 降至 2025 年的 CNY14 billion，全球排名 671。它不是经审计的融资估值，但方向上重要，因为这意味着太阳能供给过剩和私募市场重定价，可能已压缩 Gokin 相较 2022
              年融资叙事的账面价值。IPO 证据显示有雄心但未完成：Qichacha 记录 2023-11-28 有 IPO 辅导备案，并列出截至 2026-04-15 的十份辅导进展报告；Eastmoney
              的公告列表也映射出持续披露的辅导进展。最干净的解读是：到 2026 年，Gokin 仍是一家民营公司，还在推进辅导，而不是已经公开交易。
