              缺失的信息同样重要。留存公开来源没有提供 Gokin 按硅片类型划分的 ASP、毛利率、良率损失、废品率、应收账款周期或存货天数。因此，最诚实的财务分析，是把同行代理和行业现货数据作为外边界，同时清楚保留
