  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场周期与估值风险：规模不能抵消下行周期
        blocks:
          - type: paragraph
            body: >-
              概率最高的风险仍是行业本身。Reuters、TrendForce、PVTime 和 pv magazine
              都显示，行业尚未从供给过剩冲击中完全修复。硅片库存仍高，组件价格仍贴近激进低位区间，同业制造商仍在报告亏损或接近亏损的经济性。PVTime 的 2024 年回顾尤其严峻：各规格硅片价格暴跌，P-type
              经济性急剧恶化，组件价格战把价值链相当一部分推入连行业观察者都称为“至暗时刻”的状态。TrendForce 当前市场数据表明，压力并未干净消失。库存依然偏高，采购疲弱，组件环节仍能看到困境定价。


              对 Gokin 来说，规模因此是双刃剑。公司有可观出货、真实客户和多基地生产，但在弱定价周期里，也有更多产能需要填满。估值信号显示，市场已经理解这一点。Eastmoney 2025 年对 Hurun
              独角兽榜单的总结称，Gokin 账面估值从 2024 年约 CNY20.5 billion 降至 2025 年 CNY14
              billion。这不是破产信号，但确实是预期的实质性重估。因此，关键风险不只是周期性价格压力；更在于市场可能继续把 Gokin
              视为重规模、轻利润率的制造商，直到管理层证明更好的定价纪律、更健康的渠道经济性，或拿出可信的 IPO 级披露包。
