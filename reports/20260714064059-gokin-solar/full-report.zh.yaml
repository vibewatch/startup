        - ~0.41x 销售额
        - 产品组合更广的中国一体化光伏同业参照
        - 业务组合比 Gokin 更广，且已上市
      - - LONGi
        - 当前市值对比最新收入
        - ~1.30x 销售额
        - 显示中国一线龙头仍可获得更高倍数
        - 反映市场认为其质量和规模强于中位同业
      - - Canadian Solar
        - 当前市值对比最新收入
        - ~0.19x 销售额
        - 受周期影响的光伏行业低端上市基准
