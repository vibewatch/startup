  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与地理足迹：触达广，证据多由渠道牵引
        blocks:
          - type: paragraph
            body: >-
              客户证据指向一门通过多类采购实体销售的业务，而不是单一直接销售模型。官方全球化和公司简介材料描述了覆盖 30 多个国家或地区、4 个生产基地、5 个太阳能电站业务开发中心和超过 2,900
              家全球伙伴的版图。单看这一点并不能证明变现质量，但它为更重要的事实铺垫：具名公开客户证据反复出现在分销商、面向 EPC
              的渠道、采购池和项目账户中。巴西、波兰、西班牙和澳大利亚都有公开渠道建设活动；中国则提供了项目和采购案例，看起来更像机构或公用事业级需求。


              因此，渠道形态比收入形态更清晰。Gokin 似乎向分销商销售，由分销商服务安装商和
              EPC；也通过采购或合作框架服务项目开发商和公开市场买家；还通过直接组件供应触达具名基础设施或工业项目。公开记录足以按付款方和使用方切分客户基础：分销商和采购买家似乎负责付款，安装商和 EPC
              负责实施，终端项目业主或家庭则消纳交付组件。它仍没有说明哪个细分贡献最多收入、哪些渠道有黏性，或 2025 年超过 7GW 的出货声称中，有多少来自重复账户，多少来自一次性项目拉动。
