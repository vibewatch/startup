      - CR011
      - CR031
      - CR036
      - CR042
      - CR043
  - id: TV001
    title: 推荐意见摘要表
    columns:
      - 维度
      - 当前看法
      - 依据
      - 改善条件
      - 决策含义
    rows:
      - - 推荐意见
        - 跟踪 / 继续研究
        - 规模和渠道证据可见，但经审计财务证明不足
        - 2024-2025 年经审计报表、路线级利润率和资本结构细节
        - 缺少更多证明前，不按当前名义估值承保
      - - 置信度
        - 中
        - 公开证据在规模和同业背景上强，在现金和利润率上弱
        - 非公开尽调包，或达到公开申报质量的披露
        - 使用区间和折价，不用点估计
      - - 风险评级
        - 高
        - 周期、价格和披露风险仍高
        - 证明利润率韧性，并给出更清晰的流动性路径
        - 在进入条款或价格中要求下行保护
      - - 估值立场
        - 只有较当前 Hurun 估值显著折价才有吸引力
        - 0.7x 名义倍数高于若干承压上市同业
        - 进入价接近 0.4x-0.5x 销售额，或证明 Gokin 值得享有溢价经济性
        - 较立即投入，更偏好排队观察
      - - 退出立场
        - 可能，但风险尚未拆掉
        - IPO 辅导仍在推进，但尚未完成
        - 明确上市里程碑和经审计准备度
        - 基准情形下不要指望近期流动性
    notes: 本表刻意对价格敏感。它把业务质量和按当前隐含进入估值是否可投分开看。
    claimRefs:
      - CV033
      - CV035
      - CV039
      - CV040
      - CV045
      - CV048
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 当前依据
      - 重要性
      - 观点改变条件
    rows:
      - - 正方：Gokin 是真正具备规模、值得密切跟踪的制造商
        - 收入、出货、融资认可度和渠道证据都是真实的
        - 避免仅因公司未上市而低估它
        - 若有经审计盈利能力和营运资本证明，论点会进一步增强
      - - 反方：当前私募估值已经计入大部分公开利好
        - 尽管经审计披露很薄，Hurun 估值仍隐含 0.7x 销售额
        - 避免为同一叙事付两次钱
        - 如果 BC 经济性和披露质量快速改善，反方会削弱
      - - 上行论点：BC 和国际渠道可能推高质量
        - BC 里程碑、融资认可度入选和全球足迹带来可选性
        - 以后可能支撑更高倍数
        - 需要独立变现和路线级利润率证明
      - - 下行论点：Gokin 本质上仍是周期性、透明度不足的太阳能制造商
        - 上市同业仍便宜，且受亏损压力
        - 意味着私募折价应继续存在
        - 只有 Gokin 证明经济性结构性好于同业，反方才会削弱
    notes: 反方论点和正方同样重要，因为关键问题不是公司是否存在，而是当前价格是否已经假定改善。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV032
      - CV041
      - CV042
      - CV047
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 隐含价值区间
      - 概率信号
      - 关键风险 / 上行空间
      - 行动含义
    rows:
      - - 牛市
        - BC 放量能够变现，融资认可度帮助融资，IPO 准备度提高，利润率跑出高于商品化同业的水平
        - CNY15B-CNY18B
        - 可能发生，但尚非基准
        - 上行取决于披露能否快速补上
        - 只有经审计证明到位后，才按接近该区间付款
      - - 基准
        - 规模真实，但在受周期影响的中国光伏制造里，经济性仍只是平均水平
        - CNY9B-CNY12B
        - 最符合当前公开证据
        - 主要风险是今天为尚未公开的证明买单
        - 若治理和现金核查通过，这是认真尽调的最佳区间
      - - 熊市
        - 价格战持续、渠道质量转弱，或资本需求高企但 IPO 进程拖延
        - CNY6B-CNY8B
        - 若周期恶化或隐性杠杆浮现，这一情景可信
        - 下行来自流动性和利润率压缩，不只是需求缺失
        - 避免按名义估值进入，保留等待的选择权
    notes: 区间刻意放宽，因为当前证据更适合框定估值边界，而不是精确定位。
