      - number: '4.4'
        title: 财务结论：收入基底已证实，利润率路径未证实，资产负债表风险未解决
        blocks:
          - type: paragraph
            body: >-
              综合图景清楚但不完整。Gokin
              并非只靠希望定价：公司似乎已经建成大收入基底、真实制造规模和有意义的下游组件牵引。但太阳能制造下行周期压缩了估值，侵蚀了同行利润率，也让资产负债表韧性成为承销案例的核心。在这种环境下，一家没有公开审计报表、详细分部披露或现金流透明度的民营公司，不应在利润率耐久性上获得默认信任。


              因此，合适的结论应当平衡。真实出货和真实客户可见，所以收入质量强于许多民营产业创业公司。利润率质量在公开层面大体未经证实。历史融资和活跃 IPO
              准备从方向上支持资本充足性，但没有真正证明。管理层提供现金、债务、营运资金、毛利率和客户集中度的私密明细之前，财务案例只有在重尽调折扣下才具备可投性。
