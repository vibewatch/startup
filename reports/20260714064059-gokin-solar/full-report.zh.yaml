      - number: '2.4'
        title: 约束：供给过剩、中国依赖，以及对 Gokin 的含义
        blocks:
          - type: paragraph
            body: >-
              当前市场逆风不是太阳能需求不足，而是硅片及相邻制造产能过剩。Wood Mackenzie 称，到 2026 年，中国将在所有主要太阳能环节保持超过 80% 的制造产能，且到 2024 年已有超过 1 TW
              的硅片、电池片和组件产能上线。pv magazine 称，2024 年末硅片厂可生产的产品是需求的 2.3 倍；TrendForce 到 2026 年中仍看到库存超过 28 GW；S&P Global
              预测，在重大供给过剩下，利用率多年低于 40%。Reuters 2025 年报道补充称，中国光伏制造价值链 2024 年行业亏损约 USD40
              billion。因此，这个市场长期看既大又有结构吸引力，但短期利润率极其难看。


              对 Gokin Solar 而言，市场机会不在于证明太阳能需求，而在于证明自己能在集中、周期性强且中国主导的供应链里相对活下来。正面案例是，Gokin 已经声称硅片出货前三、100GW 硅片产能，并且高度匹配 N
              型和 BC 迁移。更难的问题是，当过剩产能、政策干预和贸易摩擦压迫整个行业时，这种规模是否足以保护利润率。非中国本地化努力有助于组件产能，但仍很难快速复制上游硅片经济性，因此 Gokin
              的国内制造优势仍有意义。不过，同样的集中度也让贸易和政策变化成为真实战略风险。公司因此暴露在一个体量巨大、地理集中、价格残酷的市场中。
