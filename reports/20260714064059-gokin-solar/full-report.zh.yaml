      - number: '3.3'
        title: 转换成本、分销力量，以及渠道广度为何重要
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，硅片转换成本真实存在，但并不极端。买方仍需要围绕质量、尺寸兼容性、可靠性和可融资性对供应商做认证，这会制造摩擦。但行业已经收敛到标准化的大尺寸和 n
              型路径，因此锁定效果弱于专有软件市场。这样一来，基础产品可得性带来的护城河降低，渠道强度、认证历史和打包更多客户解决方案的能力变得更重要。


              因此，InfoLink
              的出货排名具有战略意义。它显示，一个由头部供应商控制大部分出口、且前十组件龙头全部纵向一体化的赛场。实际竞争中，独立硅片专精企业不只要拼单位经济性，还要对抗那些已有深度关系、海外制造、捆绑产品或内部硅片消化能力的既有玩家。TrendForce
              的定价方法进一步强化了这一点：外界看到公开竞争，靠的是匿名现货指数和市场调研，而不是透明的公司价目表。稀缺资产是分销入口，而不是挂牌价格。
