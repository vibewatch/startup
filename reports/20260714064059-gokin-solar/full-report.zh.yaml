      - number: '1.4'
        title: 扩产、产品演进与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              Gokin 自身材料描述的运营建设速度异常快。历史页面称，一期西宁硅锭项目和珠海硅片项目在 2021 年 6 月试产，建设周期分别只有 93 天和 140 天；随后在 2022 年初又追加二期。到 2023 年
              6 月，Gokin 称其硅锭产能达到 55GW、硅片产能达到 75GW；后续公司级材料又把 2026 年表观产能统一为 100GW 硅锭、100GW 硅片和 16GW 组件。产品页面说明了战略含义：Gokin
              正围绕 182mm 和 210mm 大尺寸硅片、N 型工艺能力，以及覆盖 BC、PERC、TOPCon 和 HJT 的扩展组件栈定位。


              里程碑轨迹还显示，公司有意从上游硅片走向下游组件和差异化 BC 产品。官方材料显示，广州组件基地在 2023 年下线首块 TOPCon 组件，Gokin 进入 PV ModuleTech 2026 年 Q1
              可融资性评级，并在 2026 年 5 月宣布第 3 million 块 BC 组件下线。2025 年 12 月的 BC 峰会页面更进一步，称 Gokin 已成为全球第三家量产 BC 组件的企业，并把这次产品迁移同
              RE100 和更广的生态伙伴关系绑定。每一个营销最高级能否经受第三方审视，要放到后续章节判断；但方向性结论很强：Gokin 不是静态硅片卖家，而是在走向纵向一体化规模、国际交付和更高价值的 BC 组件定位。
