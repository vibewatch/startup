            body: >-
              直接可比公司里，LONGi 和 TCL Zhonghuan 最突出，因为它们把硅片领导地位和激进技术路线图结合在一起，尤其是在 BC 和大尺寸产品上。LONGi
              公开展示的研发资源和一体化解决方案栈明显更深；TCL 则把 210mm 硅片生态和 BC 专利基础定位为一个尺寸与技术平台。GCL
              所处位置略有不同：它不太像干净的外售硅片同行，更像上游生态公司，其颗粒硅经济性、关联方硅片销售和下游系统连接，从上方塑造竞争场。


              一体化组件龙头进一步改变竞争数学。Jinko、JA Solar 和 Trina 展示了规模玩家如何把组件、储能、系统和海外子公司转化为分销力量，而较新的下游进入者未必能匹配。Tongwei
              叠加了上游和电池片主导地位；Huasun 与 AIKO 说明，如果 BC 或 HJT 架构获得超额牵引，技术专精型邻近方仍会重要。简言之，Gokin
              的参照基准不只是其他硅片切片商，还包括资产负债表可见度更强、产品邻近更宽或客户渠道控制更紧的公司。
