      - number: '2.2'
        title: 需求与测算镜头：大市场，但 TAM 不完美
        blocks:
          - type: paragraph
            body: >-
              即使扣掉炒作，全球需求仍然很大。SolarPower Europe 称，全球 2024 年新增 597 GW 太阳能装机，累计装机达到 2.2 TW；IEA-PVPS 估算，2025 年新增装机进一步升至 698
              GW，累计容量接近 3 TW。中国仍是最大单一引擎，2025 年贡献约 60% 的全球新增装机，2024 年单独新增 277.57 GWAC。换言之，需求侧不是问题：太阳能部署仍在以巨大规模扩张。对 Gokin
              Solar 而言，这意味着硅片可服务用例仍在结构性增长，即便定价在周期上已经被打坏。


              更难锁定的是市场收入池。Global Market Insights、Straits Research 和 Maximize Market Research 将 2024-2025 年硅片市场放在约 USD14
              billion 至 USD16 billion 区间，但它们采用的基准年、假设和地区定义不同。这些数字作为比较镜头仍然有用，尤其是和装机指标、集中度数据配合阅读时；但不应把它们误认为单一确定的
              TAM。真正的承销教训是：硅片市场在物理吞吐量上巨大，但当前美元收入被压缩，因为供给过剩把价格打了下来。因此，装机增长和定价纪律必须分开分析。
