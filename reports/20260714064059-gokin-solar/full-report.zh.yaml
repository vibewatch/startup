  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格背景与入场纪律：名义估值标记真实存在，但不自动便宜
        blocks:
          - type: paragraph
            body: >-
              第一个估值问题不是 Gokin 是否真实，而是当前价格信号是否已经反映了公开证据目前能证明的大部分内容。公开证据确实有分量。Gokin 自身简介指向超过 CNY20 billion 的 2023
              年营业收入、6,000 多名员工、数百项专利和全球前三的硅片出货。公司的可融资性说明又给了更强的商业框架：累计硅片出货超过 200GW，2025 年组件出货超过 7GW，销售覆盖 30
              多个国家和地区。工业证明已经足够把 Gokin 视为一家严肃的制造平台，而不是一个停留在愿景层面的气候创业公司。


              更难的是，当前名义估值到底买到了什么。Hurun 相关来源把 Gokin 的 2025 年估值放在 CNY14 billion 左右，低于 2024 年接近 CNY20.5 billion
              的标记，说明太阳能下行周期中，市场已经下调了这家公司估值。按简单销售额口径看，当前标记约为上一期公开收入的
              0.7x。单独看并不显得贵。但也谈不上明显便宜，因为同一组保留证据显示，中国太阳能股票仍承压，同业经济性仍疲弱或为负，而 Gokin
              仍缺少经审计的当期利润率和现金披露，无法支撑其质量高于同业的假设。因此，价格纪律比欣赏规模更重要。
