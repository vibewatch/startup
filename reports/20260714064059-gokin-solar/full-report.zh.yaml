      - number: '5.2'
        title: 制造架构与依赖：工艺信号强，栈透明度仍部分缺失
        blocks:
          - type: paragraph
            body: >-
              对一家民营产业公司而言，公开制造证据异常具体，但仍有选择性。Gokin 硅片页面称，公司掌握大尺寸 N 型单晶拉制、大尺寸薄硅片生产和自动化硅片生产。组件页面补充称，下游制造采用数字化管理、AGV
              无人叉车、可视化全流程信息管理和行业领先自动化产线。Huadu 政府报道和 Gokin 自身 BC 量产材料，从另一个角度强化了同一幅图景：Gokin 组件业务已经在有意义规模上运转，广州 /
              花都场地已投产，公司高度依赖自动化和柔性产线来切换产品类型、摊薄成本。


              但同样的来源也暴露了栈的不透明之处。公开材料反复提到一线供应商、外部合作和智能工厂基础设施，却没有点名多数拉晶、切片、层压机、串焊机、MES、ERP 或 WMS 厂商。最突出的具名依赖是 AIKO 在 BC
              电池片和技术协作上的角色。TaiyangNews、pv magazine 和 EnergyTrend 都支持一种判断：Gokin 的 BC 策略是协作式，而非完全自有闭环。Gokin
              贡献硅片、封装、产线和组件执行，AIKO 贡献 BC 电池片能力、工艺专长和专利强度。这并不天然是弱点，但意味着 Gokin 最差异化的路线仍依赖外部生态执行，也依赖内部制造纪律。
