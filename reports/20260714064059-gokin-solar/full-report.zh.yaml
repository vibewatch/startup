      - number: '8.2'
        title: 公开可比公司映射：Gokin 高于多家流动性同业，但披露少得多
        blocks:
          - type: paragraph
            body: >-
              保留的可比公司组方向上很清楚。按保留的 Yahoo Finance 市值和收入页面，JA Solar 和 Trina Solar 当前销售额倍数分别约为 0.49x 和 0.41x。Canadian Solar
              更低，约 0.19x。相比之下，LONGi 约 1.30x，提醒投资者，即便在弱市场里，中国太阳能公司的估值也并不相同。First Solar 则处在完全不同的区间，约为销售额的
              4.5x，显示公开市场仍愿意为差异化地域、政策保护和盈利能力支付多高的溢价。Gokin 自身隐含的 0.7x 名义倍数，高于几家承压上市同业，低于 LONGi，远低于 First Solar。


              这个位置很重要，因为 Gokin 是这组资产里最不透明的。JinkoSolar 的公开市场足迹让披露差距尤其明显：它在 2026 年 4 月提交了 2025 年
              20-F，并保持常规公开业绩档案。保留材料中，Gokin 没有任何可比内容。因此，市场被要求支付高于 JA 或 Trina
              的倍数，同时得到的关于现金、债务、客户集中度、路线级利润率和治理的审计信息却少得多。这不排除投资，但排除了把 Hurun
              名义数字当作自证合理。披露更弱的民营公司通常应低于、而不是高于承压上市同业入场，除非它能证明更好的经济性或更快的流动性路径。
