      - number: '1.5'
        title: 风险信号与仍未厘清的问题
        blocks:
          - type: paragraph
            body: >-
              尽管规模故事成立，公开数据里仍能看到几类警示。第一，员工和披露数字内部不一致：Gokin 官方简介称公司 2024 年员工超过 6,000 人，ENF 列出 7,900 名员工，Qichacha
              则显示控股公司实体人员少于 50 人，参保员工只有 39 人。如果不同来源统计的是不同法律实体，或只统计总部薪资人员，这个差距可以理解；但它意味着投资人不应把当前 2026
              年员工数当作已定事实引用。第二，公开披露中的股权结构、盈利能力和当前杠杆仍然很薄。公司强调收入、专利和出货，但留存来源集中没有公开招股书或经审计财务包。


              第三，公开负面面不大，但真实存在。Qichacha 风险概览列出三起司法案件、一份裁判文书和四则开庭公告；2025 年 Eastmoney 太阳能独角兽汇总明确把 Gokin 放在整个光伏估值压缩周期里。Sohu
              还称，即便治理备案发生变化，Gokin 的 IPO 计划到 2025
              年末已经停滞。这些信号单独看都不致命，但合在一起意味着，公司概览案例应被理解为“体量大、扩张快、战略意义强”，而不是“完全透明”。后续章节需要压力测试：Gokin
              的运营规模能否在下行周期里转化为可持续利润率、客户质量和站得住的估值。
