  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        The table emphasizes public companies with enough retained market-cap and revenue evidence to anchor a
        sales-multiple read-through. It is partial because some peers use different reporting currencies or business
        mixes, so the output is directional rather than perfectly normalized.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Gokin Solar
        - 私募名义估值对比官方 2023 年收入
        - 收入 CNY20B+、估值 CNY14B，对应 ~0.7x 销售额
        - 本报告的直接进入参照
        - 私有公司，当期经济性未经审计
      - - JA Solar
        - 当前市值对比最新收入
        - ~0.49x 销售额
        - 当前公开市场承压下的大型中国光伏制造商参照
        - 公开市场流动性和披露强于 Gokin
      - - Trina Solar
