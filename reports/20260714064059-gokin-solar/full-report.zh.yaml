      - number: '5.4'
        title: 技术结论：真实制造深度、真实 BC 进展，但工厂栈仍有重要缺口
        blocks:
          - type: paragraph
            body: >-
              合适的产品与技术结论应当平衡。Gokin 显然不只是品牌包装。它发布真实硅片规格、真实组件数据表、真实认证证据，并反复给出产业建设证据。独立和准独立来源也支持其 BC 推进并非想象：到 2026 年，公司公开声称
              BC 出货达到数百万级、进入量产状态，并拥有可支持全球交付的柔性产线制造设置。这让公司在技术可信度上强于那些只发布产能口号的民营制造商。


              同时，证据还不足以让投资人只凭信任承销整个工厂栈。公开材料没有识别多数设备供应商，没有说明工厂软件骨干，没有拆分 BC 良率与 TOPCon 或 HJT
              良率，也没有给出可追溯的物料清单或供应商集中度地图。即使专利叙事，也主要是数量叙事，而不是逐项权利要求叙事。因此，结论不是 Gokin 缺少技术，而是它已经展示出足以证明产业能力和 BC
              动能的内容，同时仍把投资人留在现场尽调阶段：必须核查具体机器组合、软件系统、工艺经济性和依赖集中度，才能判断这个技术故事能否穿越艰难的太阳能周期。
