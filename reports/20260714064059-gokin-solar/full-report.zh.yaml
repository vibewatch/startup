      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 问题不在于 Gokin 是否真实
            body: 证据已经显示，Gokin 建成了真实的工业平台。估值争议在于价格、披露和周期风险，而不是存在性。
            calloutType: insight
