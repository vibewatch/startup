tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Silicon wafers
    - Sell large-format wafers to cell/module makers and possibly affiliated channels
    - Per piece / per GW shipped
    - Core stream; top-three global wafer shipments claimed
    - High volume but cyclical and price-sensitive
    - Provide ASP by wafer format, top customers, and share of external versus affiliated sales
  - - PV modules
    - Sell TOPCon / BC-capable modules into downstream projects and distributors
    - Per watt / per GW shipped
    - 7GW+ 2025 module shipments claimed; top-20 global ranking claimed
    - Growing and strategically important, but margin not disclosed
    - Provide module ASP, gross margin, regional mix, and warranty reserve assumptions
  - - Solutions / project support
    - One-stop or regional solution packaging around PV deployment
    - Project contract / service fee
    - Publicly described but not financially segmented
    - Low visibility; could enhance channel stickiness if real
    - Disclose solution revenue share, contract type, and whether services are positive-margin or bundled
  - - Potential captive / internal channel economics
    - Wafer output may feed affiliated or strategically locked channels before external sales
    - Internal transfer or negotiated sale
    - Not publicly broken out
    - Important to revenue quality and pricing power
    - Break out third-party revenue versus internal or strategic-program shipments
  notes: 'The stream list is evidence-constrained: wafers and modules are clear, while solution and internal-channel revenue remain directionally described rather than quantified.'
