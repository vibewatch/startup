  - CI004
  - CI005
  - CI030
  - CI038
- calloutType: risk
  title: Capital intensity is visible, liquidity is not
  body: Disclosed project commitments and capacity scale imply a business that consumes real capital. Without cash, debt, and runway disclosures, IPO counseling should be viewed as a financing signal, not just a governance milestone.
  claimRefs:
  - CI010
  - CI012
  - CI013
  - CI029
  - CI033
- calloutType: risk
  title: Peer economics say the cycle is still unforgiving
  body: Public peers show low or negative gross margins and ongoing losses across much of the chain. That makes any private margin assumption for Gokin highly sensitive to inventory discipline, input costs, and ASP realization.
  claimRefs:
  - CI019
