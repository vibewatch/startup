callouts:
- calloutType: insight
  title: Top-line proof exists; margin proof does not
  body: 'The public record already supports real scale: CNY20B-plus 2023 revenue, 200GW-plus wafer shipments, and 7GW-plus module shipments. What it does not support is Gokin’s actual gross margin, cash generation, or working-capital resilience.'
  claimRefs:
