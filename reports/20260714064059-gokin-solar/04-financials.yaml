- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash, debt, and undrawn facilities
    - Cannot assess solvency or refinancing risk
    - Request latest balance sheet, facility schedule, covenant package, and treasury forecast
  - - Gross margin by wafers / modules / solutions
    - Cannot tell which stream is profitable or dilutive
    - Request segment gross-profit bridge by quarter
  - - ASP by format and region
    - Cannot tie shipment scale to revenue quality
    - Request invoiced ASP data for top wafer and module SKUs
  - - Receivables aging and inventory turns
    - Cannot model working-capital stress in a falling-price market
    - Request AR aging, inventory by format, and write-down policy
  - - Customer concentration and contract duration
    - Cannot judge whether top-line scale is durable
    - Request top-10 customer list with contract terms and renewal status
  - - Capex incurred versus plan by base
    - Cannot compare actual funding need versus historical round size
    - Request site-by-site capex roll-forward and remaining committed spend
  - - Related-party or strategic-channel share
    - Cannot distinguish merchant revenue from ecosystem-driven volume
    - Request internal / related / third-party sales mix
  notes: Every gap here directly changes valuation, solvency, or margin interpretation; none is optional.
