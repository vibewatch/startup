- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2023 operating revenue
    - CNY20B+
    - medium
    - Proves meaningful commercial scale
    - Provide audited 2023 and 2024 income statements plus Q1 2025 bridge
  - - 2025 module shipments
    - 7GW+
    - medium
    - Shows downstream business has commercial mass
    - Disclose revenue and gross profit contribution from modules
  - - Wafers embedded in global modules
    - Approx. 1 in 7 modules worldwide (company-claimed)
    - medium
    - Indicates shipment penetration and channel relevance
    - Show external customer concentration and verification basis
  - - Realized wafer ASP
    - Unknown
    - low
    - Central to revenue and gross-margin modeling
    - Provide ASP by format, region, and top account
  - - Gross margin
    - Unknown
    - low
    - Determines resilience in a price war
    - Provide gross margin by segment and quarter
  - - Contribution margin / cash margin
    - Unknown
    - low
    - Separates accounting growth from real unit economics
    - Provide contribution-margin bridge with energy, labor, and depreciation split
  - - Peer gross-margin proxy range
    - -1.19% to 9.3%
    - medium
    - Frames likely industry bounds for current profitability
    - Benchmark Gokin against public peers on equivalent periods
  - - Input-cost proxy
    - GCL granular silicon cash cost RMB25.12/kg
    - medium
    - Useful upstream anchor for cost sensitivity
    - Show actual polysilicon sourcing terms and conversion cost per watt
  - - Inventory and receivables days
    - Unknown
    - low
    - Key working-capital driver in manufacturing
    - Provide quarterly working-capital schedule
  notes: The nulls are intentional. They mark the exact places where public evidence fails and diligence must move into management-provided schedules.
