- id: capital-intensity
  title: 'Capital Intensity and Financing Dependency: Big Plants, Big Commitments, Limited Cash Disclosure'
  body: 'Gokin’s manufacturing footprint implies large ongoing capital needs. The official history and third-party reporting together describe enormous multi-base investments in Zhuhai, Xining, and Yibin, plus rapid capacity expansion into ingots, wafers, and modules. Equity financing in 2022 was substantial and clearly linked to project buildout rather than merely to general corporate liquidity. Supplier agreements and early customer orders also suggest a business model where long planning cycles, raw-material commitments, and working-capital needs are structurally important.


    Yet the public record still does not show what an underwriter most wants to know: cash on hand, debt maturity profile, monthly burn, inventory financing, covenant headroom, or runway. The active IPO counseling process suggests management recognizes the need for broader capital-market access, but counseling progress is not the same thing as a completed listing or a de-risked balance sheet. This leaves capital adequacy as the clearest unresolved diligence item in the entire chapter.'
