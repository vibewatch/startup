- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - Unknown
    - low
    - Most direct buffer against cyclical losses and capex
    - Provide unrestricted cash, restricted cash, and credit-line availability
  - - Monthly burn / operating cash flow
    - Unknown
    - low
    - Needed to estimate runway
    - Provide trailing 12-month operating cash flow and monthly burn under base/downcase
  - - Runway months
    - Unknown
    - low
    - Synthesizes liquidity risk
    - Provide management runway view under current and stressed pricing assumptions
  - - Disclosed equity funding
    - Series A CNY1.6B; Series B >CNY2.5B; cumulative >CNY5B
    - high
    - Shows historic ability to raise expansion capital
    - Reconcile round proceeds to uses of funds and remaining liquidity
  - - Planned use of funds
    - Capacity expansion and project ramp
    - medium
    - Clarifies whether prior funding mostly built plants or funded working capital
    - Provide actual capex by site versus plan
  - - Next-round trigger
    - IPO counseling active through Apr 2026; listing not complete
    - medium
    - Indicates future dependence on capital markets
    - Describe milestones and fallback plans if IPO timing slips
  - - Debt / supplier obligations
    - Large supplier commitments and capex plans disclosed; debt quantum not public
    - medium
    - Could tighten liquidity even if revenue is large
    - Provide debt maturity, prepayment, and major supply-contract obligations
  notes: The chapter can observe funding history and counseling progress, but it cannot prove present liquidity without management data.
