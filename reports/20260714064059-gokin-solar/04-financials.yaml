- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  - Implication
  rows:
  - - Wafers priced per piece / shipment contract
    - Public list pricing not retained; public view comes through spot indices
    - Customer-specific rebates, format premia, and freight terms unknown
    - TrendForce / pv magazine
    - Realized economics could differ materially from public spot reference prices
  - - Modules priced per watt / project or distributor contract
    - Official product pages show capability, not durable list price
    - BC or TOPCon premium versus realized ASP unknown
    - Official product pages / bankability note
    - Downstream mix could improve value capture, but no public margin proof exists
  - - Solutions packaged with hardware
    - No public fee schedule retained
    - Bundling may hide margin allocation between hardware and services
    - Official company pages
    - Could support stickiness but cannot yet be modeled
  - - Bankability as monetization support
    - Not a price line itself; supports financing eligibility and customer trust
    - Commercial uplift from bankability not quantified
    - Bankability release
    - Can improve sales conversion even if not directly monetized
  - - Public wafer benchmark
    - May-2026 references of CNY0.93 G10L / CNY1.00 G12R / CNY1.17 G12
    - Reference only; not equivalent to company ASP
    - pv magazine / TrendForce
    - Useful for stress testing revenue sensitivity, not for revenue recognition
  notes: The table distinguishes disclosed market references from unknown company realized prices because public hardware pricing is structurally opaque.
