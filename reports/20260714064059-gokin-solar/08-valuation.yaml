- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials
    - 2024 and 2025 audited statements plus 2026 year-to-date bridge
    - Core input to move from broad ranges to investable price
    - Management, auditors, and data room
  - - Debt and covenants
    - Borrowings, maturity ladder, pledges, guarantees, and covenant headroom
    - Determines whether scale is financeable through the cycle
    - Treasury team and lenders
  - - Customer concentration
    - Top accounts, geographies, receivables, and reorder behavior
    - Decides whether revenue quality deserves peer-premium treatment
    - Sales ops and finance
  - - Route economics
    - BC versus wafer gross margin, yield, utilization, and warranty reserve
    - Tests whether upside thesis is economic or narrative
    - Operations and FP&A
  - - Capital structure
    - Cap table, preference stack, options, and side letters
    - Protects against overpaying for junior equity
    - Legal counsel and company secretary
  - - IPO readiness
    - Counseling reports, board readiness, controls, and timetable blockers
    - Directly affects exit discount and timing
    - Sponsor, counsel, and CFO
  notes: Every diligence ask listed here is valuation-critical. None is cosmetic.
