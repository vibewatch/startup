    - Prevents underestimating the company simply because it is private
    - Would strengthen further with audited profitability and working-capital proof
  - - 'Anti-thesis: Current private valuation already prices most public positives'
    - Hurun mark still implies 0.7x sales despite thin audited disclosure
    - Prevents paying for narrative twice
    - Would weaken if BC economics and disclosure quality improve quickly
  - - 'Upside thesis: BC and international channels could shift quality upward'
    - BC milestone, bankability inclusion, and global footprint create optionality
    - Could justify a higher multiple later
    - Needs independent monetization and route-level margin proof
  - - 'Downside thesis: Gokin is still mostly a cyclical, opaque solar manufacturer'
    - Public peers remain cheap and loss-pressured
    - Implies private discount should persist
    - Would weaken only if Gokin proves structurally better economics than peers
  notes: The anti-thesis is as important as the thesis because the key question is not company existence but whether the current price already assumes improvement.
