  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-pack
    missingEvidence: Audited 2024 and 2025 financial statements, cash-flow statements, and notes on working capital, debt, and contingent liabilities.
    whyItMatters: Without current audited statements, investors cannot tell whether Gokin's scale translates into durable margin or merely larger exposure to the downcycle.
    diligencePath: Request the latest audited financial package, management discussion, debt schedule, and subsidiary cash balances before underwriting any entry price.
    relatedQuestionRefs:
    - QV007
    - QV014
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share, top-channel share, repeat-order behavior, and geography mix by revenue and gross profit.
    whyItMatters: Even a reasonable sales multiple can be too high if a large share of revenue depends on a small set of distributors or project buyers.
    diligencePath: Obtain top-10 customer schedules, distributor sell-through, and regional gross-margin bridges for the last eight quarters.
    relatedQuestionRefs:
    - QV021
    - QV022
    relatedTableRefs:
    - TV006
    - TV005
  - type: private-evidence-only
    severity: material
    topic: capital-structure-overhang
    missingEvidence: Preference stack, investor rights, employee-option pool, pledge data, guarantees, and any pre-IPO restructuring commitments.
    whyItMatters: Headline equity value can overstate common-share attractiveness if preference or dilution overhang sits ahead of new money.
    diligencePath: Review the cap table, shareholder agreements, investor side letters, and any banking-security documents before pricing a round.
    relatedQuestionRefs:
    - QV026
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: ipo-execution-granularity
    missingEvidence: Full counseling reports, auditor readiness milestones, board-composition disclosures, and timeline-critical dependencies for listing.
    whyItMatters: IPO counseling presence alone does not show when or whether Gokin can convert process into liquid exit.
    diligencePath: Request all counseling reports, audit workplans, sponsor feedback, and listing-readiness blockers from management and counsel.
    relatedQuestionRefs:
    - QV010
    - QV025
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: route-level-economics
    missingEvidence: BC-versus-wafer gross margin, warranty reserve, yield, utilization, and inventory-ageing data by site and product family.
    whyItMatters: The valuation debate hinges on whether Gokin is becoming a higher-quality platform or remaining mostly a commodity wafer manufacturer.
    diligencePath: Request monthly route-level P&Ls, warranty claims, field-failure data, and yield-learning curves for BC and mainstream products.
    relatedQuestionRefs:
    - QV012
    - QV016
    - QV023
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: comparable-valuation-tv004-normalization
    missingEvidence: Perfectly normalized peer set with common currency, common enterprise-value bridge, and like-for-like product-mix adjustments for TV004.
    whyItMatters: TV004 is directionally strong, but comp outputs still mix different business models, currencies, and reporting bases.
    diligencePath: Rebuild the table with management-adjusted EV, minority interest, cash, debt, and a common currency framework before final term-sheet pricing.
    relatedQuestionRefs:
    - QV002
    - QV020
    relatedTableRefs:
    - TV004
