company:
  name: Gokin Solar
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports that Gokin Solar is a real, scaled PV manufacturer with enough shipment, bankability, and channel proof to deserve serious diligence. But the same evidence also shows a brutal public-market backdrop for Chinese solar, significant valuation compression from roughly CNY20.5 billion to CNY14 billion, and a disclosure gap versus listed peers that makes a clean buy at the current headline mark hard to justify. The chapter therefore lands on a track / research-more stance: Gokin may become attractive either at a meaningful discount to the current Hurun mark or after management supplies IPO-quality financial and capital-structure disclosure.'
sections:
- id: price-context-and-entry-discipline
  title: 'Price Context and Entry Discipline: The Headline Mark Is Real, But It Is Not Automatically Cheap'
  body: 'The first valuation question is not whether Gokin is real; it is whether the current price signal already captures most of what public evidence can presently prove. That public evidence is meaningful. Gokin’s own profile points to more than CNY20 billion of 2023 operating revenue, 6,000-plus employees, hundreds of patents, and top-three global wafer shipments. The company’s bankability note adds a stronger commercial framing: 200GW-plus cumulative wafer shipments, more than 7GW of 2025 module shipments, and sales reach into more than 30 countries and regions. That is enough industrial proof to treat Gokin as a serious manufacturing platform rather than an aspirational climate startup.


    The harder part is what the current headline value buys. Hurun-linked sources place Gokin around CNY14 billion in 2025 after a higher 2024 mark near CNY20.5 billion, implying that the market has already repriced the business downward during the solar downcycle. On a simple sales lens, the current mark is roughly 0.7x trailing public revenue. That is not optically expensive in isolation. But it is not obviously cheap either, because the same retained evidence shows that Chinese solar equities remain under pressure, peers are still posting weak or negative economics, and Gokin still lacks the audited current-period margin and cash disclosures that would justify assuming quality above the peer group. Price discipline therefore matters more than admiration for scale.'
