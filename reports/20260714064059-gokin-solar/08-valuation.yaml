- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO path stalls materially
    - Counseling remains active without visible step-up in readiness through another reporting cycle
    - Weakens exit optionality and argues for larger private discount
    - Avoid paying headline mark
  - - Wafer / module price war deepens again
    - Public price trackers and peer losses deteriorate further
    - Compresses fair comp band and raises liquidity risk
    - Re-underwrite toward bear case
  - - Private diligence shows commodity-level economics
    - BC and module routes do not earn better margins than stressed peers
    - Removes main argument for paying above low-end public comps
    - Demand deeper discount or walk away
  - - Customer concentration is high
    - A small set of channels dominates revenue or cash collection
    - Raises revenue-quality and working-capital risk
    - Cut valuation or require structure protection
  - - Capital structure shows overhang
    - Preference, pledge, or leverage seniority is heavier than expected
    - Reduces attractiveness of headline equity value
    - Reprice to common-equity reality
  - - Disclosure improves materially
    - Audited statements and listing-readiness proof arrive
    - Supports movement from track toward investable
    - Revisit range and recommendation upward
  notes: 'These are kill triggers because each one changes what investors are really buying: a de-risking industrial platform or an opaque cyclical manufacturer.'
