  topStrengths:
    - >-
      Gokin has already built genuine industrial scale in wafers and meaningful downstream module traction, which
      sharply reduces existence risk versus earlier-stage climate startups.
    - >-
      Official and third-party evidence support broad manufacturing footprint, strong shipment history, and a growing
      international channel presence rather than a purely domestic story.
    - >-
      BC-module progress and first-time bankability inclusion create plausible upside optionality if the company can
      prove better economics than commodity peers.
    - >-
      The IPO counseling process and prior large financing rounds mean there is at least a visible path to future
      liquidity rather than an indefinite private hold.
  topRisks:
    - >-
      The solar-wafer and module downcycle remains severe enough that several listed Chinese peers still screen at low
      multiples and weak economics, capping what investors should pay for Gokin today.
    - >-
      Gokin's current headline 0.7x-sales valuation sits above several liquid public peers despite materially weaker
      audited disclosure on cash, debt, margin, and concentration.
    - >-
      Customer-quality, concentration, and repeat-order economics remain less visible than shipment and
      channel-announcement volume, making revenue quality hard to underwrite.
    - >-
      The IPO process is active but unfinished, so investors cannot yet assume a near-term liquidity event or a clean
      public-market valuation reset.
    - >-
      Any hidden leverage, preference-stack overhang, or weak BC route economics could pull fair value below the current
      Hurun headline quickly.
  unresolvedGaps:
    - Audited 2024-2025 financial statements, cash-flow detail, and debt/covenant schedules.
    - Customer concentration, geography mix, receivables quality, and distributor sell-through by major account.
    - BC-versus-wafer route-level margin, yield, utilization, inventory-ageing, and warranty-reserve data.
    - >-
      Cap-table, preference, pledge, guarantee, and other capital-structure details relevant to true common-equity
      value.
    - IPO counseling reports, governance-readiness detail, and concrete listing-critical milestones.
