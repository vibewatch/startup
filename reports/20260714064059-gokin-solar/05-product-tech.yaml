- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification
  - Public status
  - Scope
  - Why it matters
  - Gap
  rows:
  - - IEC 61215:2021 and IEC 61730:2023
    - Publicly claimed as obtained
    - BC module design qualification and safety
    - Supports basic export and bankability trust
    - Need certificate numbers and model-by-model scope list
  - - 2PfG 2926 A+ anti-shading and Class A fire rating
    - Publicly claimed as achieved
    - BC shading resilience and fire safety positioning
    - Central to Gokin’s premium BC marketing case
    - Need independent field data to pair with lab test claims
  - - IEC TS 63209-1 extended stress
    - Publicly reported by PV Tech / TÜV coverage
    - Long-term environmental adaptability under harsh conditions
    - Suggests deeper reliability testing than brochure specs alone
    - Need exact tested SKUs and surveillance cadence
  - - IEC 62938 non-uniform snow load
    - Publicly reported by PV Tech / TÜV coverage
    - Module mechanical resilience in snow-load scenarios
    - Improves suitability for colder or uneven-load markets
    - Need broader mechanical test matrix beyond one certificate
  - - TMP laboratory qualification
    - Publicly reported by PV Tech / TÜV coverage
    - Internal lab test data accepted more directly by TÜV
    - Can shorten certification loops and speed engineering response
    - Need lab-scope details and governance of retests / failures
  - - ISO 9001 / 14001 / 14064 / 45001 / 50001 / 37301
    - Download-center pages show certificates across multiple bases
    - Quality, environment, GHG verification, safety, energy, and compliance systems
    - Shows enterprise-level systems maturity beyond individual modules
    - Need site-by-site audit findings and exceptions, not just certificate presence
  - - PAS2060 zero-carbon factory recognition
    - Officially claimed for Sichuan base
    - Carbon-neutral operations narrative tied to SGS certificate
    - Useful trust signal for sustainability-sensitive buyers
    - Need third-party detail on offsets, boundaries, and permanence assumptions
  notes: The table distinguishes certificate presence from full audit transparency; public existence is real, but detailed scope and findings are usually not disclosed.
