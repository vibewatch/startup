  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: equipment-transparency
    missingEvidence: Named pulling, slicing, stringing, lamination, AOI, AGV, and automation vendors by base and line.
    whyItMatters: Specific machine vendors and line configurations determine capex intensity, spares risk, uptime, and future upgrade cost.
    diligencePath: Request line-by-line equipment lists, vendor contracts, and current OEE by base during management diligence.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: software-transparency
    missingEvidence: ERP, MES, WMS, traceability, and quality-data architecture by plant, including major software vendors and system boundaries.
    whyItMatters: Factory software quality affects scheduling, genealogy, recalls, compliance, and multi-route manufacturing flexibility.
    diligencePath: Request systems architecture diagram, named vendors, data-flow maps, and screenshots of production-traceability workflows.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: bc-economics
    missingEvidence: BC yield, scrap, cycle time, warranty reserve assumptions, and unit-cost delta versus TOPCon and HJT.
    whyItMatters: The BC commercialization story is strong technically, but underwriting depends on whether yields and costs are durable at scale.
    diligencePath: Request route-level production KPIs, yield-learning curves, and margin bridges for BC, TOPCon, and HJT lines.
    relatedQuestionRefs:
    - QE022
    - QE026
  - type: missing-source
    severity: minor
    topic: patent-schedule
    missingEvidence: A retained patent-by-patent schedule tying counts to specific families, jurisdictions, and expiration dates.
    whyItMatters: Patent counts alone do not show blocking strength, freedom to operate, or whether IP is concentrated in process know-how versus branding.
    diligencePath: Pull a full IP docket from counsel or a patent database export and map it to wafer, BC packaging, and manufacturing-process themes.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: material
    topic: field-performance
    missingEvidence: Independent, non-company field-performance data for BC, TOPCon, and HJT products in real customer installations.
    whyItMatters: Bankability and certification are helpful, but long-term degradation and site-level reliability determine financing quality.
    diligencePath: Request third-party yield studies, insurer claims history, and representative operating data from utility and rooftop deployments.
    relatedQuestionRefs:
    - QE018
    - QE025
