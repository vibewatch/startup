  layout: wide
  summary: Gokin’s public product architecture layers from mono ingot and wafer engineering through module platforms, validation, and application scenarios.
  data:
    layers:
    - label: Ingot & Pulling Layer
      detail: Czochralski-based monocrystalline pulling and thermal-field know-how feed the upstream chain.
      items:
      - Large-size mono ingots
      - N-type pulling
      - P-type legacy route
    - label: Wafer Engineering Layer
      detail: Large-format wafer specs are public across M10, G12, and G12-R with thin-wafer positioning.
      items:
      - 182.2mm M10
      - 210mm G12
      - 182.3x210mm G12-R
      - 90–160µm thickness
    - label: Cell-Route Layer
      detail: Module platforms sit on multiple cell routes rather than one architecture bet.
      items:
      - TOPCon
      - HJT
      - BC / GBC
      - Legacy PERC compatibility
    - label: Module Platform Layer
      detail: Named module brands package the routes into commercial SKUs and warranties.
      items:
      - FLAMINGO TOPCon
      - WING HJT
      - GOKIN BC
      - Full-screen BC variants
    - label: Validation & Quality Layer
      detail: Public trust signals combine TÜV product certificates, internal labs, and multi-base ISO systems.
      items:
      - IEC 61215 / 61730
      - Anti-shading A+
      - TMP lab qualification
      - ISO systems across bases
    - label: Application Layer
      detail: Gokin positions modules across distributed rooftops, C&I, agrivoltaics, and utility-scale use cases.
      items:
      - Residential
      - Commercial & industrial
      - Agrivoltaics
      - Utility / ground-mount
