tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Product line
  - Buyer / user
  - Current public status
  - Differentiation
  - Diligence gap
  rows:
  - - N-type mono wafers
    - Cell makers and module manufacturers
    - Public wafer specs, large-format portfolio, core upstream line
    - 182/210 family, thin-wafer and lifetime positioning, in-house wafer strength
    - Need actual yield, scrap, and customer-specific qualification data
  - - P-type mono wafers
    - Price-sensitive or legacy-route customers
    - Still listed publicly but clearly secondary to N-type push
    - Gives compatibility and legacy coverage
    - Need current shipment mix and whether route is strategic or residual
  - - FLAMINGO TOPCon modules
    - Utility and mainstream commercial projects
    - Public module page with 710–740W products and 23.8% efficiency
    - Bankable mainstream route with broad market acceptance
    - Need shipped volume, gross margin, and regional mix
  - - WING HJT modules
    - Projects valuing bifaciality and HJT performance
    - Public module page with 735W flagship product and HJT positioning
    - Alternative high-efficiency route beyond TOPCon
    - Need evidence on actual commercial scale versus brochure presence
  - - GOKIN BC modules
    - Premium residential, C&I, and selected utility buyers
    - Public SKUs, datasheet, certification news, and 2026 commercialization milestones
    - Gridless aesthetics, low temp coefficient, anti-shading story, BC branding
    - Need route economics, yield, and cell-sourcing concentration
  - - Solutions / power-station packaging
    - Distributors, EPCs, developers, end-project owners
    - Official site and third-party directories show solution and project activity
    - Lets Gokin sell modules inside broader packaged projects
    - Need services revenue share and actual downstream margins
  notes: The matrix reflects public product surfaces and retained third-party coverage, not a private BOM or profitability view.
