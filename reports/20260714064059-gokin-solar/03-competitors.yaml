- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Top-three wafer scale
    - Integrated leaders can internalize supply and own export channels
    - high
    - Request Gokin’s external-sales mix, top-customer concentration, and renewal profile
  - - BC technology momentum
    - LONGi, TCL, JA, and AIKO are all pushing BC or dual-path roadmaps
    - high
    - Benchmark Gokin BC yields, certification depth, and customer qualification speed
  - - Bankability entry
    - One rating appearance does not yet equal entrenched bankability parity with global leaders
    - medium
    - Track repeat inclusion, insured project wins, and financing-linked customer references
  - - International reach
    - 30+ countries is meaningful, but peers disclose deeper overseas channel infrastructure
    - medium
    - Obtain region-by-region shipment split, local warehouses, and service capability map
  - - Independent focus
    - Pure-play focus can become a disadvantage if storage / systems bundling wins procurement
    - medium
    - Clarify whether Gokin intends to stay wafer-led or broaden solution packaging
  - - Cost competitiveness
    - Price war and 28GW+ inventory pressure can erase product differentiation
    - high
    - Stress-test gross margin at sector spot prices and compare against integrated peers
  - - Technology optionality
    - HJT, BC, and perovskite adjacencies may reorder value capture over time
    - medium
    - Map Gokin’s real option set beyond current BC messaging
  notes: The register treats moat claims as hypotheses under stress rather than accepted truths because public adverse evidence across the sector is unusually strong.
