  - Limitation
  rows:
  - - Gokin Solar
    - Direct merchant wafer peer moving downstream
    - 100GW wafer capacity; 200GW+ cumulative wafer shipments; 7GW+ 2025 module shipments
    - Cell makers, module makers, growing downstream module buyers
    - Top-three wafer scale, 182/210 formats, BC momentum, 30+ countries
    - Private disclosure remains limited; customer concentration and external-sales mix undisclosed
  - - LONGi
    - Incumbent direct rival and integrated benchmark
    - 20.49GW Q1 2026 wafer shipments; 7.64GW external wafer sales; 1,000+ researchers
    - Global utility, C&I, residential, project developers
    - Deep R&D base, BC push, vertically integrated solutions stack
    - Loss-making in Q1 2026 despite scale and brand depth
  - - TCL Zhonghuan
    - Direct wafer rival with format leadership
    - 200GW+ cumulative 210mm wafer shipments; 1,600+ BC patents
    - Cell/module makers and high-efficiency BC buyers
    - 210mm ecosystem leadership; integrated BC technology platform
    - Less public English evidence on downstream channel breadth than LONGi/Jinko
  - - GCL Technology / GCL SI
    - Upstream ecosystem and adjacent integrated rival
    - 480,000 MT polysilicon capacity; continuing wafer sale agreements; BNEF Top 10 bankability mention
    - Internal ecosystem, module/system customers, low-carbon-material buyers
    - Granular silicon cost moat, captive relationships, perovskite optionality
    - Less comparable as a pure merchant wafer competitor; broader materials pivot can dilute focus
  - - JinkoSolar
    - Integrated substitute competitor
    - 75-85GW 2026 module guide; 10+ production facilities; 20+ overseas subsidiaries
    - Global utility, C&I, residential, ESS buyers
    - Huge export network, ESS adjacency, strong TOPCon scale
    - Public posture centers modules and systems, not direct standalone wafer sales
  - - JA Solar
    - Integrated substitute competitor
    - 11.87GW Q1 2026 shipments; 77.16% overseas mix
    - Utility-scale and distributed buyers across modules and solutions
    - Dual TOPCon/BC roadmap and integrated energy-solutions push
    - Less English public evidence on wafer-specific commercial share
  - - Trina Solar
    - Integrated substitute competitor
    - 60-70GW 2025 shipment tier; positive Q1 2026 operating cash flow
    - PV products, storage, systems, digital-energy customers
    - Broadest adjacency set among named peers; 210 standardization influence
    - Not a like-for-like wafer specialist
  - - Tongwei
    - Integrated incumbent with upstream/downstream power
    - No.1 polysilicon market share since 2021; No.1 cell shipments since 2017
    - Upstream silicon buyers and downstream cell/module channels
    - Power across multiple supply-chain layers
    - Merchant-wafer positioning is less explicit than Gokin/LONGi/TCL
  - - Huasun / AIKO
    - Technology-adjacent entrants
    - Huasun 20GW HJT capacity / 10GW+ shipments; AIKO 200GW+ cell & module shipments
    - Premium HJT or BC applications
    - Architecture-driven differentiation beyond standardized TOPCon
    - Not perfect direct wafer comps; more technology-path disruptors than merchant-wafer peers
  notes: The table mixes like-for-like wafer rivals with integrated substitutes and adjacent technology challengers because buyers can solve the same procurement problem through multiple channel structures.
