- id: moat-adverse
  title: 'Moat Durability and Adverse Evidence: Technology Progress Without Margin Protection'
  body: 'The harshest competitive fact is that technology leadership has not prevented financial pain across the field. TrendForce still sees inventory above 28GW and persistent discounting. Reuters and pv magazine both describe an industry where leading Chinese players keep shipping enormous volumes while still reporting heavy losses or fragile margins. In that environment, even strong brands can struggle to convert technical progress into durable returns. That is disconfirming evidence against any simplistic moat narrative.


    For Gokin, the positive case is still real. The company has meaningful independent wafer scale, BC momentum, international reach, and emerging bankability recognition. But the public record does not yet show the same depth of disclosed R&D resources, audited segment breadth, or proven global distribution infrastructure seen at LONGi, Jinko, or Trina. The moat therefore looks promising but conditional: Gokin can plausibly stay relevant as a top-tier wafer and BC-aligned supplier, yet public evidence does not prove that it already enjoys superior customer lock-in, resilient pricing power, or distribution dominance.'
