  rows:
  - - Gokin Solar
    - Negotiated supply contracts; no public posted wafer or module list price retained
    - Wafers, modules, solutions
    - Realized ASP and rebate terms unknown
    - Must compete on qualification, roadmap fit, and negotiated economics rather than transparent list pricing
  - - LONGi
    - Negotiated project and supply contracts; no public retained list prices
    - Wafers, modules, project solutions
    - Unknown customer-specific discounts or internal transfer pricing
