  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: concentration-opacity
    missingEvidence: Top-customer share, top-country share, sell-through by distributor, and repeat-order behavior by major account.
    whyItMatters: Relationship-heavy growth can look diversified externally while remaining concentrated economically.
    diligencePath: Request customer concentration schedules, geography mix, sell-through dashboards, and distributor reorder histories.
    relatedQuestionRefs:
    - QR015
    - QR019
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: margin-and-cash
    missingEvidence: Route-level margin, yield, warranty reserve, inventory ageing, and cash-conversion detail by base and product family.
    whyItMatters: The biggest risk is that visible scale is not translating into healthy economics under current pricing conditions.
    diligencePath: Request audited management accounts, route-level production KPIs, and working-capital schedules.
    relatedQuestionRefs:
    - QR001
    - QR003
    - QR020
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: litigation-visibility
    missingEvidence: Case-by-case court dockets, enforcement status, and legal memos for the judicial cases and hearing announcements visible in Qichacha.
    whyItMatters: Count-based legal risk summaries are not enough to judge whether exposure is trivial, reputational, or financially material.
    diligencePath: Search Wenshu and related official court systems by full company name and pull each docket into counsel review.
