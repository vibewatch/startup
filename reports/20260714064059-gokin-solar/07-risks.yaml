- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Oversupply / price war
    - Wafer and module pricing
    - Another sustained leg down in wafer or module prices without matching cost exits
    - Re-underwrite margin durability; consider avoid / reduce stance
  - - IPO path failure
    - Counseling and listing timeline
    - No material progression beyond counseling over the next major reporting cycle
    - Increase financing discount and push for alternative liquidity plan
  - - Channel concentration
    - Top distributor or procurement reliance
    - One partner or buyer appears to represent an outsized share of shipments
    - Require concentration covenant, diversification plan, or revised valuation multiple
  - - BC commercialization risk
    - Warranty / field-failure / yield indicators
    - Warranty claims, yield slippage, or certification setbacks emerge in BC line
    - Pause premium BC-upside underwriting and fall back to commodity-route assumptions
  - - Trade-policy escalation
    - New tariffs / AD/CVD / circumvention findings in priority routes
    - Major export market economics change materially
    - Cut overseas growth assumptions and revisit channel strategy
  - - Legal / environmental surprise
    - Court, permit, or enforcement findings
    - Material undisclosed litigation, permit issue, or environmental non-compliance surfaces
    - Treat as thesis-break until scope and remediation are verified
  notes: Kill criteria focus on measurable triggers rather than generic caution words. Each one should be checked directly in diligence or in future refreshes.
