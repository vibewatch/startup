- id: regulatory-legal-ipo
  title: 'Regulatory, Legal, and IPO Risk: Public Status Is Visible, Full Exposure Is Not'
  body: 'The next major risk cluster is legal-regulatory and financing-process risk. Qichacha’s IPO page shows that Gokin filed counseling on 2023-11-28 and had reached a tenth progress report by 2026-04-15, but it still had not crossed into a completed listing. That means counseling is real, but completion risk remains real too. In a tough market, a private manufacturer that is visibly seeking capital-markets access but has not yet listed faces timing risk, disclosure risk, and valuation-reset risk at the same time. The Eastmoney notice page reinforces that the company is still living inside a pre-listing disclosure process rather than a completed public-company regime.


    Trade and legal exposure add another layer. The U.S. trade-remedies portal and WTO trade-remedies portal both show that Chinese industrial exporters continue to operate in a world where anti-dumping, countervailing, and Section 301-style actions matter. Even if Gokin is not explicitly named in every action, its export strategy sits inside that policy environment. Meanwhile, Qichacha’s risk overview says the company has three judicial cases, one judgment document, and four hearing announcements, but the retained set does not reconstruct those cases in detail. The official Chinese Judgments Online portal is therefore an obvious diligence path, not a closed issue. Put differently: the company’s legal and regulatory surface is not necessarily alarming, but it is still incomplete enough that investors should not underwrite it as clean by default.'
