callouts:
- calloutType: strength
  title: Few private solar manufacturers have scaled this fast while staying private
  body: From 2019 founding to a reported 100GW wafer footprint, Gokin Solar’s ramp speed is unusually fast even by Chinese photovoltaic standards. The combined evidence of early factory buildout, two large 2022 financing rounds, and later PVBL / bankability recognition suggests the company became a real top-tier manufacturing platform rather than a paper unicorn.
  claimRefs:
  - CO007
  - CO021
  - CO023
  - CO026
  - CO039
  - CO040
- calloutType: risk
  title: Scale is visible, but transparency still lags the scale story
  body: The retained public record still leaves major underwriting questions open. Gokin has no retained public prospectus, headcount figures vary sharply by source, Qichacha shows a small insured-employee count at the holding-company entity, and 2025 commentary pointed to valuation compression and a stalled IPO plan. That means later chapters must test whether operating scale is translating into durable economics and governable disclosure.
  claimRefs:
  - CO042
  - CO044
  - CO045
  - CO046
  - CO047
- calloutType: insight
  title: The strategic pivot is from independent wafer champion to BC-enabled integrated supplier
  body: Official sources now frame Gokin less as a pure wafer house and more as an integrated solar-solutions company. The module base, BC milestones, RE100 commitment, and global partner language all point to a deliberate move up the value chain, which should change how later chapters assess customer mix, competition, and valuation multiples.
