  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: A current shareholder register with ownership percentages, voting control, and any founder or state-platform concentration has not been retained.
    whyItMatters: Ownership concentration affects governance control, dilution risk, and IPO readiness, especially for a private manufacturer that scaled with large state-linked and institutional backers.
    diligencePath: Obtain the latest shareholder register from IPO counseling materials, company registration extracts, or a prospectus draft once available.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: employees
    missingEvidence: A reconciled 2026 groupwide employee count is unavailable because official materials, ENF, and Qichacha appear to count different scopes.
    whyItMatters: Headcount is a core maturity and cost-structure signal; inconsistent counts weaken confidence in productivity and SG&A benchmarking.
    diligencePath: Ask management for current consolidated employee counts by entity and site, plus reconciliation to insured payroll records.
    relatedQuestionRefs:
    - QO022
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: No retained public source provides audited 2024-2025 income statement, cash flow, debt, or margin detail.
    whyItMatters: Without audited financial detail, it is hard to convert the scale narrative into a credible view of profitability, leverage, or IPO quality.
    diligencePath: Request audited financial statements, lender packages, or IPO working drafts during management diligence.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: minor
    topic: board-detail
    missingEvidence: Official retained sources do not provide a full current board and committee roster with biographies and independence status.
    whyItMatters: Board quality matters for IPO readiness, related-party control, and risk oversight in a large private manufacturer.
    diligencePath: Request current board list, committee structure, and director biographies from investor-relations or counseling materials.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO002
