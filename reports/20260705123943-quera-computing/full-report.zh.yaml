            body: >-
              QuEra 并不处在一个整齐的单一同行组里。直接同行是中性原子阵营，Atom Computing 和 Pasqal
              也在销售同一个承诺：可扩展、基于门或混合的中性原子系统。既有参照组更宽，也资本更充足：超导系统中的 IBM Quantum 和 Google Quantum AI，囚禁离子中的 IonQ 和
              Quantinuum，光子路线中的 PsiQuantum，以及作为较小超导全栈挑战者的 Rigetti。D-Wave
              不是同类的通用门模型竞争者，但对更在意今天生产工作流、而不是最终哪种架构赢得容错的优化型买方来说，它是真实替代品。第二层替代品位于硬件供应商之上。AWS Braket 和 Azure Quantum
              把多个后端聚合到同一个采购界面之后；NVIDIA CUDA-Q 等混合 AI / HPC 平台则让团队推迟做出硬件承诺。因此，QuEra
