  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊、基准、牛三种情形下的低、中、高价值结果，以当前公开估值背景为锚，而不是已披露定价轮。
    approximationNotes: 所有数值都是分析师按十亿美元口径估算。回报框架假设有效入场价约为常被引用的 ~$1B，并排除未知优先权包袱。
    data:
      items:
        - label: 熊市情形价值（$B）
          low: 0.3
          base: 0.5
          high: 0.8
        - label: 基准情形价值（$B）
          low: 1.2
          base: 1.5
          high: 2
        - label: 牛市情形价值（$B）
          low: 3
          base: 4
          high: 5
