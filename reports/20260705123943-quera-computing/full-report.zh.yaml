        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              QuEra 的部署界面正在拓宽，这对商业化很重要。通过 Braket 的云访问最成熟，因为它有公开文档，并且已经集成进 AWS 工作流。Premium Access
              为需要更快迭代的用户增加科学家支持、入门引导和预约式合作。本地材料主打另一套价值主张：受控访问、安全本地执行、调度器和认证集成，以及在现有 HPC 环境中的室温部署。第三方信号显示，这不只是幻灯片概念。NERSC
              的 2026 年项目分配 Aquila 时间并开发 Gemini 工作流；QuEra 自己的 HPC 中心页面称，一套 Gemini 级系统已经与 AIST 的 ABCI-Q
              超级计算机一起运行。合作伙伴集成进一步扩展漏斗：Classiq 把 QuEra 硬件包进更广的软件平台，NVIDIA 则把 QuEra 放进 NVAQC 和以 CUDA-Q 为中心的混合 QEC
              工作流。关键成熟度差异在于，这些集成今天主要支持试点、研究或早期工程工作流。Libra 和更宽的容错路线图若交付，可能具备战略重要性；但公开证据仍显示，QuEra
              当前业务是运营模拟访问、扩展数字试点，并借助合作伙伴生态为后续容错时代预热客户。
