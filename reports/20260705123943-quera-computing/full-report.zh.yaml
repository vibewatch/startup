      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              QuEra 的创始人—市场匹配仍直接来自支撑其架构的 Harvard / MIT 科学家。公司发布材料把 Mikhail Lukin、Markus Greiner、Vladan Vuletić、Dirk
              Englund、Nathan Gemelke 和 John Pena 列为创始团队；当前关于页面仍突出 Lukin 为联合创始人兼首席科学家、Vuletić 为联合创始人兼 CTO、Greiner
              为联合创始人、Gemelke 为联合创始人兼首席技术战略官。这种连续性是资产，因为公司的可信度仍很大程度取决于外界如何看待其中性原子路线图和纠错工作的科学领先性。


              但 CEO 席位已经不再由创始人担任。2024 年 7 月，董事会让 Alex Keesling 离开 CEO 角色，并任命董事 Andy Ory 为代理 CEO；在当前公司材料和 2025 年 9
              月融资扩充新闻稿中，Ory 已直接以 CEO 身份出现。QuEra 还在 2024 年 9 月聘请 Ed Durkin 担任 CFO，并让 Takuya Kitagawa 围绕日本战略和 AIST
              部署承担可见的总裁角色，管理层进一步职业化。公开治理披露仍不完整：留存来源确认 Arthur Chu 是董事，并显示董事会任命了
              Ory，但没有给出完整现任董事名单、委员会地图或详细少数股东保护条款。因此，商业化和资本形成明显依赖 Ory，技术路线图执行则依赖 Lukin、Vuletić 和 Gemelke。
