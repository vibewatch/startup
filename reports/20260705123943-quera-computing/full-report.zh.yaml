      - number: '6.5'
        title: 扩张路径、集中度风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              扩张潜力清楚，集中度风险同样清楚。QuEra 有多条先落地再扩张的循环：AWS 降低首次使用摩擦；Deloitte 和 BCG X
              能把企业客户从战略推进到原型；本地部署包可从一个安全安装点扩展到培训、软件集成和后续升级；主权项目也可从硬件采购扩展到更广的生态或云访问关系，AIST
              已经如此。风险在于，已披露价值和参考客户质量仍集中在少数旗舰级政府和 HPC 项目上。公开企业证明仍以试点为主；即便 2026
              年就绪度数据也显示，只有少数组织拥有规模化生产应用。金融作为近期证明板块尤其薄弱，尽管行业多年感兴趣，其商业化预期仍排在最后。采购摩擦也真实存在：主权买家越来越重视主权，NERSC
              施加发表和出口管制约束，QuEra 的本地部署动作还需要大量集成工作。因此，客户故事已经足够耐久、值得重视，但仍集中、顾问式色彩重，也容易受长周期项目节奏影响。
