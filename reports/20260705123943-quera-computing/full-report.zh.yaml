      - number: '2.3'
        title: 按细分市场拆解买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              QuEra 的买方地图比泛泛的“企业量子”故事更分层。目前最强的买方类别是政府和国家实验室基础设施：付款方是主权或研究项目预算，用户是计算科学家或平台团队，采用触发因素是国家能力目标，而不是一年期企业 ROI
              门槛。因此，AIST、NERSC 和 ICSC 远比一个泛化市场调查数据点重要。第二层是企业联合设计：BCG X 和 Deloitte 都把 QuEra 定位为企业、政府和 HPC
              中心的合作伙伴，买方在购买大量硬件时间之前，需要用例发现、基准设计和集成规划。在企业层内，制药和生命科学目前比金融更可信，因为 QuEra 有公开的生物学和药物发现项目；金融仍主要通过行业研究计划和 QuEra
              之外的混合试点可见。材料、化学和能源也有结构性重要性，因为在 QED-C、McKinsey、AWS 和 Pawsey 的论述中，仿真是近期最具体的用例集群。金融仍是长期目标，因为价值池大、银行也在积极学习，但
              QuEra 自己的调查和公开银行证据都显示，金融的规模化更晚：金融机构需要安全的混合环境、抗量子迁移计划，以及更强的效用证明，才会成为重复买方。这意味着 QuEra
              的采用路径是先云端探索，再联合设计，第三步是主权或实验室锚定部署，最后才是更广泛的企业生产工作负载。
