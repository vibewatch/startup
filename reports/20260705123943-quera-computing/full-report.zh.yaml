  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按 IC 口径给 QuEra 打分，聚焦今天评估一个私有量子仓位时最关键的维度。
    approximationNotes: 评分为 0-10 分，是分析师基于公开证据给出的方向性判断，不是管理层提供的内部 IC 框架。
    data:
      items:
        - label: 市场机会
          value: 8
          note: 即使买方更克制，宏观需求仍然真实存在。
        - label: 技术路线图
          value: 7
          note: 2025 年容错工作和 2028 年 AWS 计划可信，但尚未交付。
        - label: 商业证据
          value: 6
          note: AIST 和创纪录客户收入有分量，但可复现性仍未验证。
        - label: 财务披露
          value: 4
          note: 烧钱速度、利润率、留存和优先权数据仍未公开。
        - label: 竞争位置
          value: 6
          note: 中性原子叙事强，但 Quantinuum 披露了更多客户证据。
        - label: 估值支撑
          value: 4
          note: 原始融资是可转债，准确价格支撑仍相互冲突。
        - label: 证据质量
          value: 5
          note: 融资和路线图证据扎实；经济性证据一般。
        - label: 退出就绪度
          value: 4
          note: 披露成熟之前，再融一轮私募比 IPO 更可能。
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV010
