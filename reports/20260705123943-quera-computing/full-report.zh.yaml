      - number: '3.3'
        title: 转换成本、分销权力与合作伙伴访问
        blocks:
          - type: paragraph
            body: >-
              反驳“持久赢家通吃护城河”的最强证据，是访问层已经相当标准化。AWS Braket 把 QuEra、IonQ 和 Rigetti 放在同一个控制平面上；Azure Quantum 则发布来自
              IonQ、Quantinuum、Rigetti 和 Pasqal 的合作伙伴专属报价。开放开发者工具进一步强化这一模式：Google 推 Cirq，Quantinuum 推 pytket，IonQ 支持主流
              SDK，Rigetti 可从外部格式编译，NVIDIA 正在推动一种混合量子—经典模型，把 QPU
              当作更大加速系统中的一个部件。这让软件侧转换成本保持中等。买方可以基准测试、多宿主，并推迟承诺。锁定仍存在，但主要是硬件特定和工作流特定，而不是应用层独占：中性原子模拟仿真、囚禁离子保真度、超导门速度、光子制造或基于退火的优化，各自适配不同工作负载和控制假设。因此，分销权力倾向已经拥有云关系、企业支持模型或本地集成足迹的代理商和既有厂商。QuEra
              的访问多样性有助于留在候选名单上，但还没有消除云市场鼓励的比价动态。
