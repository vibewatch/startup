      - number: '1.3'
        title: 融资历史、投资方与已披露规模指标
        blocks:
          - type: paragraph
            body: >-
              QuEra 披露的融资历史显示资本规模快速抬升，但定价透明度并不干净。公司 2021 年走出隐身模式时获得 $17 million 融资，之后披露 2023 年初完成 $30 million Series
              A。2025-02-11，公司宣布从 Google Quantum AI、SoftBank Vision Fund 2、Valor Equity Partners、QVT Family Office、Safar
              Partners 和其他现有投资者处获得超过 $230 million 融资，其中 $60 million 在公告时仍受融资条件约束。独立报道在这里很重要，因为 TechCrunch
              称该工具是可转债，而不是定价股权轮；Reuters 和 TechCrunch 也都说 QuEra 未披露估值。


              因此，本章可以支撑最低公开资本基数，却不能给出精确当前估值标记。把公开披露的 $17 million 启动轮、2023 年 $30 million Series A 和 2025 年融资相加，在纳入
              NVentures 于 2025 年 9 月扩轮带来的任何未披露增量之前，已披露资本至少为 $277 million。QuEra 还有一个对量子创业公司而言异常具体的商业证明点：约 $41 million 的
              AIST 系统合同。但其他封面指标仍有意不完整。留存章节来源没有提供可靠的当前公开 ARR 或收入数字，没有披露确切客户数量，也没有在 2024 年披露超过 50
              名科学家和工程师这一部分信息之外确认当前全公司员工规模。
