        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，QuEra 是一家有前景、但尚不能完全承销的混合深科技公司。正面案例可信：真实客户活动、多条收入入口、超大云厂商和 GPU
              生态支持，以及足够资本继续推进纠错系统。负面案例同样清楚：公开资料包没有揭示实际定价、收入流结构、积压订单、毛利率、现金跑道或客户集中度。投资人因此无法区分标价和实际收入，无法区分公司报告的商业动能和经佐证指标，也无法区分项目收入和经常性使用。最大尽调阻塞点不是
              QuEra
              是否有客户，而是当前收入是否足够多元、成本基础是否足够克制，能否支撑公司从早期部署走向可重复的容错生产。在私人经营资料包补上这些缺口之前，正确结论是：收入质量可信但未证明，利润率路径概念上有吸引力但未披露，资本强度明确偏高。
