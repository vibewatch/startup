              剩余工作主要是财务和商业尽调，而不是基础技术认知。公开证据现在足以说明 QuEra
              有真实战略资本、至少一个有意义的付费硬件部署，以及通向容错云访问的可信路径。但证据还不足以说明新投资者在下行情景中实际拥有多少权益、公司要烧掉多少资本才能到达 2028 年 Libra 里程碑，或 2025
