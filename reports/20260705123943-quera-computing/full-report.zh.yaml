              的工作有具名客户，也有明确结果，但仍是围绕小数据预测的概念验证。Cinfo 的电信项目是最清楚的行业运营证明之一，因为它说明了网络问题、使用的量子硬件和服务韧性目标。QIC 和 Roadrunner
