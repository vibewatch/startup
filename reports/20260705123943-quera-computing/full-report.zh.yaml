  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态
      - 公开估值 / 融资轮
      - 收入 / 牵引力锚点
      - 重要性
      - 局限
    rows:
      - - QuEra
        - 私有中性原子 FTQC 公司
        - ~$1B 市场数据估算；具体票据转换价格未公开披露
        - ~$39.9M 2025 年收入估算；一笔约 $41M AIST 系统销售；首个本地部署 HPC 项目
        - 标的公司基准
        - 公开估值支撑存在冲突，优先权条款未披露。
      - - IonQ
        - 上市离子阱龙头
        - $18.33B 2026 年 7 月市值；10-K 中 2025 年 6 月非关联方持有市值 $11.5B
        - $130M FY25 收入；FY25 净亏损仍达 $510.4M
        - 收入规模更可见时，展示公开市场量子期权价值的高端
        - 公开流动性和 M&A 情绪让估值标记比私募轮更波动。
      - - D-Wave
        - 上市量子退火 / 门模型混合玩家
        - $8.34B 2026 年 7 月市值；10-K 中 2025 年 6 月非关联方持有市值约 ~$4.93B
        - $24.6M FY25 收入，来自 135+ 客户
        - 小规模量子收入仍能支撑高股权价值的最佳公开证据
        - 技术路线和客户组合不同于中性原子 FTQC。
      - - Rigetti
        - 上市超导玩家
        - $5.96B 2026 年 7 月市值；10-K 中 2025 年 6 月非关联方持有市值 $3.82B
        - $7.1M FY25 收入；FY25 净亏损 $216.1M
        - 当规模和商业化滞后时会发生什么，有用的下行提醒
        - 公开估值标记受情绪影响，架构也不同。
      - - Quantinuum
        - 私有商业化离子阱龙头
        - $600M 融资，投前估值 $10B（2025 年 9 月）
        - Helios 发布，具名客户包括 Amgen、BMW Group、JPMorganChase 和 SoftBank
        - 最接近的高端私募基准，公开客户披露明显更强
        - 技术路线、规模和披露纪律都强于今天的 QuEra。
      - - PsiQuantum
        - 私有主权级光子 FTQC 公司
        - $1B Series E 已披露；抓取的官方来源未提供公开估值
        - 澳大利亚项目破土，且获得 DARPA 支持的技术验证
        - 说明主权支持的量子规模故事仍能吸引巨额资本
        - 官方估值不透明，因此更像资本强度参考，不是干净价格可比。
      - - IQM
        - 私有 / 上市前超导公司
        - ~$1.8B 2026 年 2 月 SPAC 交易投前估值；预计交割时现金 >$450M
        - 声称拥有真实客户和本地部署；此前完成逾 $300M Series B
        - 提供一个披露的欧洲私有 / 公开桥接估值，低于 Quantinuum 但高于 QuEra
        - 交易尚未成为成熟公开市场出清价格。
    notes: 覆盖范围刻意保持局部：纳入 2025-2026 年资料最充分的公开量子股票，以及具备可用收入或部署锚点的私募融资标记。
