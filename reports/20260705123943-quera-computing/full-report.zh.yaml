              技术上重要，背后也有大生态，但访问仍由提案把关，而不是像目录商品一样开放。Rigetti 和 D-Wave 各自提供不同类型的信任信号——Rigetti 依靠深度栈控制和可立即交付的本地 QPU，D-Wave
