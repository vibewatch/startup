chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              QuEra Computing 总部在波士顿，是一家中性原子量子计算公司，2018 年由 Harvard 和 MIT 的研究孵化而来。公司公开材料如今把 QuEra
              定位为一家私营、偏后期公司：它已经越过纯实验室孵化阶段，但仍未上市，并且多个财务指标披露很少。联系页面列出全球总部位于波士顿 1380 Soldiers Field Road，并标出英国、日本办公室以及筑波
              AIST 站点；一份 2026 年公司来源的路线图说明还提到运营足迹扩展到波士顿、新墨西哥、东京、苏黎世和英国。


              一句话概括，QuEra 的商业模式比许多量子同行更具体：公司通过云端和高端渠道销售中性原子算力访问，为国家实验室或 HPC 中心销售或部署本地系统，并用应用联合设计和研究合作包裹这些系统。第一代 256
              量子比特模拟系统 Aquila 已在 Amazon Braket 上开放，也可通过高端访问使用；公司还销售本地与量子—经典混合部署，例如日本的 AIST / ABCI-Q 安装。这种组合会影响本报告后续判断，因为
              QuEra 并不只是在销售未来路线图：它已经在商业化硬件访问、科学服务和战略部署项目，尽管留存的一手来源仍未披露确切公开估值、ARR、客户数量和员工规模。
