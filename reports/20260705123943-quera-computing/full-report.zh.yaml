      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              对 QuEra 的市场而言，三个驱动最重要。第一，主权资金和公私测试床在主流企业 ROI
              出现前，仍会创造非共识需求。第二，后量子密码和安全规划迫使政府与受监管机构现在就建立量子能力，即使这些支出不会立刻转化为硬件购买。第三，市场正从炒作转向证明驱动采购；如果 QuEra
              的公开里程碑、合作伙伴栈和混合 HPC 定位强于同行，这反而有利于公司。但约束同样重要。BCG、Moody’s 和 IBM 用不同方式都在说，硬件就绪度仍是瓶颈，优势主张需要反复验证。QuEra
              自己的调查称，只有少数机构已经高效规模化应用；QED-C 也提示人才和供应链瓶颈。经典计算竞争是另一大约束：AI 和 HPC 进步足够快，会抬高每个仿真和优化用例所需的 ROI 门槛。BCG
              的成本比较对估值尤其重要，因为买方常常想要短回本期，而量子时间仍远比经典计算昂贵。换句话说，这个市场可以战略上很大，同时商业上很窄。估值时，投资人应更关注 QuEra
              的渠道证明、采购质量和时间纪律，而不是最终量子经济的抽象规模。
