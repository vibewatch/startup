              QBI、ABCI-Q 和 Roadrunner。2025 年 9 月扩轮尤其有揭示性，因为它明确把 HPC 中心框定为销售动线目标，并称混合部署降低采购摩擦。这说明公司不是在蛮力追求纯 SaaS
