      - number: '5.4'
        title: 信任、质量、合规与依赖风险
        blocks:
          - type: paragraph
            body: >-
              QuEra 的信任界面最强之处，是物理和系统性能已经被迫走到公开台前。独立论文和配套公司发布记录了 48 个逻辑量子比特、99.5% 级两量子比特门保真度，以及逻辑层魔态蒸馏；Tsim 和 NVIDIA
              解码器合作也显示，QuEra 正在投资容错所需的软件和解码层。这些都是有意义的质量信号。但它们不等于企业级运营成熟度。公开产品页面提到灵活
              SLA、安全本地执行和托管支持，却没有发布正常运行时间目标、响应时间、定价、SOC 2、ISO 27001 或公共状态页面。Gemini 的公开文档也比 Aquila 的 AWS
              背书模拟文档更薄，使数字产品线更难尽调。因此，关键依赖地图是混合的：QuEra 必须继续改善激光和光镊控制、Rydberg
              门保真度、分区穿梭、解码器和混合编排，同时把服务运营职业化。这个组合让公司在技术上差异化、在商业上有吸引力，但也意味着买方应通过直接尽调承销安全性、可靠性和支持，而不能假设研究里程碑已经证明产品就绪。
