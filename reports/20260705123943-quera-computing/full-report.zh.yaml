              采用轨迹真实存在，但衡量维度是访问扩张、分阶段项目和首次安装，而不是已披露客户数量。云端方面，Aquila 自 2022 年底起可在 Amazon Braket 上访问，QuEra 把可用时长从上线时每周 10
