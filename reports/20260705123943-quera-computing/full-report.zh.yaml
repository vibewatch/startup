  - id: TV006
    title: 最终尽调问题清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构与转换条款
        - 可转债 / Series B 转换机制、清算优先权、反稀释，以及任何优先级堆栈
        - 决定表面入场价在下行情景中能否真正站住
        - 要求提供投资人版股权结构表、票据摘要和律师备忘录。
      - - 烧钱、现金与资本开支桥接
        - 当前现金、月度烧钱、2026-2028 年资本开支计划和招聘爬坡
        - 检验现有融资是否真能支撑 QuEra 到达下一个证明点，而不触发惩罚性融资
        - 要求提供 CFO 现金桥接和董事会批准的运营计划。
      - - 收入构成
        - 一次性系统销售、云收入、服务和政府支持项目之间的拆分
        - 区分可复制 ARR 和里程碑占重的收入确认
        - 审查收入桥接、头部合同和会计政策摘要。
      - - 客户集中度与积压订单
        - 具名积压订单、续约结构，以及按客户 / 地域划分的集中度
        - AIST 有帮助，但投资人需要知道业务有多少依赖一个标杆客户
        - 要求提供已签约积压订单、销售漏斗阶段和集中度明细。
      - - 单位经济性
        - 按产品 / 服务线划分的毛利率，以及本地部署所需支持成本
        - 决定增长是在创造企业价值，还是只是在吃掉更多资本
        - 审查产品毛利分析和服务交付成本模型。
      - - 路线图治理
        - 2026-2028 年系统、AWS 交付物，以及供应商 / 合作伙伴依赖的里程碑仪表盘
        - 整个上行情景都取决于执行链按时打通
        - 要求提供 PMO 仪表盘和合作伙伴工作流归属图。
    notes: 这些问题按对下行承销影响的直接程度排序；第 1-3 项在形成高信念投资前是阻断项。
