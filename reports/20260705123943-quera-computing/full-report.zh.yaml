  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 相对 $1.5B 基准股权价值的方向性变化，来自最重要的公开敏感性驱动因素。
    approximationNotes: 敏感性数值是分析师基于公开证据估算的十亿美元口径；它们只显示方向和相对幅度，不是管理层预测。
    data:
      items:
        - label: 第二个 $40M 级硬件订单，或同等积压订单证据
          value: 0.8
        - label: ARR 期末超过 $100M，且收入结构更好
          value: 0.9
        - label: 2028 年 Libra / AWS 里程碑按期推进
          value: 1.2
        - label: 高额优先权堆叠或高级票据转换条款
          value: -0.7
        - label: 路线图延误 12-18 个月
          value: -0.9
        - label: 公开量子公司估值倍数压缩 / 证据缺口持续
          value: -0.6
