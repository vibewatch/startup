  - id: TE003
    title: 技术 / 运行架构表
    columns:
      - 层 / 组件
      - 角色
      - 关键依赖
      - 关键风险
    rows:
      - - 中性原子寄存器（87Rb 原子）
        - 模拟和数字模式共用的物理量子比特基底
        - 光镊中的稳定捕获、冷却和原子装载
        - 装载、寿命或相干性瓶颈会限制可用规模
      - - 里德堡相互作用层
        - 通过阻塞物理产生模拟演化和纠缠相互作用
        - 激光稳定性、校准，以及对失谐和振幅的精准控制
        - 控制噪声或阻塞缺陷会直接拉低结果质量
      - - 可编程几何与穿梭
        - 重配置连接关系，并在功能区之间移动量子比特
        - 运输过程中可靠移动、对准并保持相干性
        - 穿梭复杂度可能成为扩展或可维护性瓶颈
      - - 数字分区架构
        - 将存储、纠缠和读出操作分开，支撑逻辑工作流
        - 分区控制、前馈和低错误率中途读出
        - 如果分区控制难以工业化，数字产品叙事会跑在公开运行证据前面
      - - Bloqade 开发层
        - 把工作负载转成模拟或数字程序、仿真和参数扫描
        - 持续维护的 SDK、文档和包分发
        - 软件频繁变动或文档不完整会拖慢用户采用和集成
      - - Braket 执行接口
        - 提供作业提交、AHS schema，以及对 Aquila 的云端访问
        - AWS 平台可用性和 QuEra-AWS 集成质量
        - 云端访问仍取决于队列和服务，而不是客户完全自有
      - - QEC 与解码器栈
        - 支撑逻辑电路设计、纠错仿真和未来实时解码
        - 快速仿真器、可扩展解码器和经典加速器资源
        - 解码器延迟或扩展性差，可能削弱 FTQC 价值主张
      - - 混合 HPC 集成层
        - 将 QPU 接入调度器、GPU、数据管道以及本地或实验室环境
        - AIST、NERSC、NVIDIA 或 Dell 式编排等合作伙伴生态
        - 如果混合编排比 QPU 路线图暗示的更难，产品化可能滞后
    notes: 这张表混合硬件、软件和运行层，因为 QuEra 的差异化靠的是全栈，而不是单一 QPU 规格。
