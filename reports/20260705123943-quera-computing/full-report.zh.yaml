              成本结构在定性上比定量上更容易框定。QuEra 的支出投向容错 R&D、构建 / 测试能力、HPC 集成和制造供应链，而不是简单销售软件席位。AWS—NVIDIA 证据链在这里很关键：QuEra 正在训练 AI
              解码器，把硬件连接到 GB200 集群，并在数千颗 H100 GPU 旁边的混合环境中运行。Roadrunner 也提供另一条线索：光子实验室、机架、网络和远程访问基础设施；QuEra 2025 年回顾还称
              NEDO 正在帮助建设光学和真空组件供应链。这些都是典型资本强度标志。公司也主张中性原子具备室温、低功耗优势，相比低温路线可能有助于长期服务经济性，但 QuEra
              没有发布任何美元收益、服务成本或按收入流拆分的毛利率。公开同行申报是最接近的数字代理：Quantinuum、IonQ、D-Wave 和 Rigetti 都呈现出数千万美元收入对应巨大 R&D
              预算或现金消耗的图景。这个行业模式说明，QuEra 缺失的毛利披露不是边缘问题，而是核心承销问题。
