        title: 运营、合作伙伴与客户集中度叠加
        blocks:
          - type: paragraph
            body: >-
              从运营看，QuEra 已经比许多量子创业公司更像一家真实公司，因为它不只是承诺未来机器；它在 Braket 上支持 Aquila，为云交付准备
              Libra，运行公共项目部署，并在容错硬件到来之前联合设计应用。这种广度也是核心风险。云分发让访问和经济性依赖 AWS。解码器和混合工作流性能经过 NVIDIA 及周边经典基础设施。公共验证经过
              DARPA，客户证明则高度经过 AIST、NERSC 和 NQCC。每个节点都有价值，但没有哪个可替代。AIST 部署显示客户真实愿意购买本地系统；NERSC 和 NQCC 显示机构相关性；AWS
              证明可访问分发成立。但同一组证据也显示集中度：大多数具名证明来自政府、主权或 HPC 组织，它们能接受长前置周期和政策目标。一旦 QuEra
              错过里程碑，损害会很快传导，因为客户证明、合作伙伴信心和路线图可信度，都压在少数交易对手和用例上。传导图和依赖图关注的是这种相关性，而不是孤立的技术轶事。
