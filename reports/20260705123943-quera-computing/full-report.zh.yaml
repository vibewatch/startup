  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 正方论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 市场
        - 经典计算极限和政府支持的量子需求，仍为 FTQC 厂商打开真实切口。
        - 2026 年预算调查显示，买家现在要证据，不再凭信念为量子故事买单。
        - 以证据驱动的企业采购明显回升，或付费部署增多，会增强信心。
      - - 产品 / 路线图
        - QuEra 已把 2025 年容错里程碑接到一条具体的 2028 年 Libra-on-AWS 路线图上。
        - 在 QuEra 达成 2026-2027 年内部系统里程碑前，路线图可信度仍只是前瞻承诺。
        - 面向投资人的 2026-2028 年链条里程碑报告，会收窄交付风险。
      - - 客户
        - AIST 和首个本地部署 HPC 项目证明 QuEra 能拿下有分量的硬件业务。
        - 公开证据仍看不出这笔 $41M 级别订单能否复制，还是集中在一个标杆买家身上。
        - 第二个具名付费系统，或披露多客户积压订单，会显著改善客户故事。
      - - 财务
        - 估算的 2025 年收入约 ~$40M，说明 QuEra 已不再是零收入科研项目。
        - 最好的公开收入数字来自市场数据而非审计；毛利率、烧钱速度和留存仍未披露。
        - 管理层披露经常性与一次性收入拆分、毛利率和现金跑道，会增强估值支撑。
      - - 竞争
        - 按头部私募估值看，QuEra 比 Quantinuum 便宜，也比许多商业化前同行有更可见的收入。
        - Quantinuum 已有更强客户披露；公开可比公司也显示，量子估值标记压缩可以很快。
        - QuEra 凭什么相对 D-Wave / Rigetti 享受溢价倍数、又相对 Quantinuum 只承受披露折扣，需要更清楚的理由。
      - - 融资风险
        - Google、SoftBank、Valor 和 NVentures 是强外部背书。
        - 原始融资是可转债，公开来源仍未披露转换、优先权或反稀释条款。
        - 干净的定价股权轮，或公布票据转换条款，会消除一个重大承销缺口。
    notes: 反方论点不是 QuEra 没有进展，而是当前公开证据在定价和下行条款上仍藏着太多信息。
