        - 立即转入熊市情景承销，停止追加资本。
      - - 没有第二个标杆客户斩获
        - AIST 之后没有新增具名付费系统，也没有持久积压订单证据
        - 让 QuEra 依赖一笔参考销售，而不是可复制需求
