              提供云分发渠道，终端用户可通过 AWS 账户访问 Aquila，而不是直接购买硬件。第二，AIST、NQCC、NERSC 和 Pawsey 等主权与 HPC
              买方通过长周期项目参与；他们更关心安全执行、混合集成和国家能力建设，而不是低摩擦席位增长。第三，生命科学和电信的研究与应用项目显示，QuEra 通过联合设计和问题特定试点进入客户。第四，Deloitte 和
              BCG X 等咨询与战略伙伴通过把客户从发现推进到价值证明，扩大漏斗。关键细分结论是，QuEra 当前客户基础在政府、HPC 和先进 R&D
              买方中最强；企业使用更多通过试点和伙伴中介参与可见，而不是通过可重复的生产软件订阅可见。
