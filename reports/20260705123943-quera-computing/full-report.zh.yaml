              牵引力真实存在，但公开财务可见度仍零散。QuEra 可以指向 2025 年创纪录收入和现金回款、AIST 首个本地 HPC 部署、英国测试床奖项、美国联邦合同历史、DARPA Stage B 支持，以及 2026
