      - number: '1.4'
        title: 里程碑、合作伙伴与商业化现实核验
        blocks:
          - type: paragraph
            body: >-
              公开里程碑记录最强之处在于产品化和生态集成。QuEra 2022 年把 Aquila 放上 Amazon Braket，2023 年底宣布 48 个逻辑量子比特突破，2024 年初发布 100
              个逻辑量子比特路线图，2024 年 4 月赢得 AIST 本地合同，2025 年 3 月加入 NVIDIA NVAQC，2025 年 9 月扩展为 NVentures 支持的更深 NVIDIA 合作，到 2026
              年 6 月又承诺 2028 年在 AWS 上推出 Libra，以及后续更大的 gigaquop 级系统。因此，后续章节可以把 QuEra 视为运营上更严肃的私营量子公司之一：它有真实的云、研究、HPC
              和国家项目触点，而不是单一、未分化的实验室资产。


              需要警惕的是，技术动能仍超过公开商业披露。TechCrunch 对债务轮的定性，以及 Reuters 对估值不透明的报道，意味着 2025
              年融资不能被理解为对市场价值的一次清晰定价验证。更广泛看，Observer Research Foundation
              认为，具备商业相关性的量子计算很可能仍至少需要十年，并警告炒作驱动的说法可能制造金融泡沫。QuEra 自己的 2026
              年市场报告也部分强化了这种怀疑：它称行业已从炒作驱动支出转向证明驱动采购，并且整体仍大体处于商业化前阶段。平衡判断是，QuEra
              的证明强于大多数同行，但它仍处在一个时间线、收入可重复性和客户广度都高度不确定的行业里。
