      - number: '7.2'
        title: 监管、法律与主权风险
        blocks:
          - type: paragraph
            body: >-
              对 QuEra 而言，法律风险首先是政策边界问题，而不是可见的法庭问题。美国出口管制如今覆盖量子计算机、组件、软件和技术；已发布规则还明确考虑某些外籍人员访问带来的视同出口和再出口可见性。这一点重要，因为
              QuEra
              正是依赖国际研究人才、跨境合作者和主权客户项目的公司。联邦和关键基础设施采购也比泛泛的创业公司法律样板更重要。OMB、CISA、NIST、白宫，以及后续法律评论都指向同一方向：后量子迁移和承包商网络安全义务正在成为联邦生态的运营要求，而不是抽象的长期主题。英国则通过
              NQCC
              和《国家安全与投资法》框架加入主权视角。与此同时，公开法律案卷和专利检索工具确实存在，但保留下来的公开证据仍不能给出经律师确认的诉讼或自由实施结论。因此，投资者应把法律风险承销为合规执行加尽调不完整，而不是健康证明。
