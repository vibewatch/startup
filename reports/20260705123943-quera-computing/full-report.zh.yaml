        - 研究人员、应用科学团队、早期企业试验者
        - 已上线，并通过 AWS Braket 和 QuEra 托管访问公开记录
        - 可重构 256-qubit 模拟中性原子系统，支持用户定义布局和原生哈密顿量控制
        - 需要更清晰的公开吞吐量、可用率、定价和可重复企业运营指标
      - - Gemini 数字中性原子 QPU
        - QEC 研究人员、HPC 中心、早期数字电路试点
        - 已有公开描述，处于试点或分阶段项目，不是开放自助访问
        - 基于门的中性原子架构，具备原子搬运、分区操作和公开发表的高门保真度
        - 开放 API 文档、公开运营手册和广泛访问条款仍有限
      - - Libra 容错系统
        - 规划 FTQC 工作流的战略伙伴
        - 仅路线图；目标 2028 年登陆 Braket
        - 云端容错定位，并给出逻辑量子位和逻辑错误率目标预测
        - 全部商业成熟度取决于路线图执行和中期里程碑交付
      - - Bloqade 软件栈
        - 量子开发者、算法研究人员、应用团队
        - 文档、代码仓库和软件包界面均活跃且公开
        - 面向硬件的 SDK，覆盖模拟、数字、仿真、参数扫描和混合开发
        - 数字模式工具和用户文档仍不如模拟路径成熟
      - - Tsim QEC 仿真器
        - QEC 研究人员和解码器开发者
        - 2026 年新近开源
        - GPU 加速的非 Clifford 仿真把 QuEra 从硬件访问延伸到逻辑电路工具
        - 早期开源版本仍需要广泛外部采用和基准测试
      - - Premium Access 托管服务
        - 需要引导式试验和更快迭代的团队
        - 目前作为托管访问模式可用
        - 直接科学家支持、入门支持和预留容量可缩短产出有用实验的时间
        - 公开 SLA、定价和升级细节未披露
      - - 本地部署与 HPC 部署包
        - 国家实验室、主权项目、HPC 中心、安全敏感用户
        - 已在部分中心部署并明确营销，但还不是大众市场产品
        - 室温、低功耗的中性原子系统，比低温路线更容易接入现有设施
        - 仍需更多公开证据：安装基数、正常运行时间和现场支持负担
      - - 应用联合设计项目
        - 将工作负载映射到当前或未来 QuEra 硬件的客户
        - 服务推进活跃，但与路线图成熟度绑定
