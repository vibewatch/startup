  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价现实
        blocks:
          - type: paragraph
            body: >-
              QuEra 显然已不再是纯研究实验室。官方界面显示四条变现路径：直接系统交付、通过 Amazon Braket 的云访问、市场之外的高端 /
              直接访问，以及应用联合设计或合作研究项目。最好的公开收入信号仍来自第三方：LATKA 列出 2025 年收入为 $39.9 million，2023 年为 $6.3 million；QuEra 自己的 2025
              年回顾称，公司来自产品和服务交付的收入与现金回款创下纪录。缺失的是结构。AWS 和 QuEra 展示客户如何购买访问，但没有说明扣除平台分成、支持义务或折扣后，QuEra 实际拿到多少。硬件这条腿很重要，因为
              TechCrunch 独立报道过约 $41 million 的日本销售，规模与 2025 年全年收入估计处在同一数量级。即使云使用在增长，收入质量也可能仍然偏项目波动。D-Wave 和 IonQ
              的可比公开申报说明了为什么这很重要：混合量子供应商往往按不同节奏确认云、服务和系统销售收入，而 QuEra 自己的收入确认政策和积压订单仍是私有信息。
