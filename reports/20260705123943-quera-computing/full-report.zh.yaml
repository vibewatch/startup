  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 QuEra 的相关性
    rows:
      - - 中性原子量子硬件和系统
        - 量子处理器、控制栈、本地安装、集成、支持
        - 量子传感硬件、量子网络基础设施
        - 国家实验室、主权项目、研究联盟、企业设计合作伙伴
        - 这是 QuEra 的核心市场，因为 Aquila、Gemini 和 Libra 级系统都在这里销售或供应。
      - - 云端量子访问
        - Braket 使用、优先云访问、指导、工作流开发、仿真时间
        - 与量子无关的通用云计算支出
        - 研究人员、企业 R&D 团队、大学、平台团队
        - 这是重要入口，因为 QuEra 当前商业化路径从访问和联合设计开始，然后才走向完整部署。
      - - 混合 HPC 与量子集成
        - 共址、工作流编排、经典仿真、培训、基准设计
        - 与量子项目无关的独立经典超算
        - 国家实验室、超算中心、政府支持研究枢纽
        - 这很关键，因为 AIST、NERSC、AWS、Pawsey 和 ICSC 都通过混合 HPC 用例来定位 QuEra。
      - - 应用联合设计和服务
        - 用例筛选、算法开发、集成、企业就绪工作
        - 没有硬件或工作流绑定的通用战略咨询
        - CIO/CTO 办公室、科学计算团队、创新预算
        - 这块很重要，因为 BCG X 和 Deloitte 借助价值证明和路线图项目，把 QuEra 卖进企业。
      - - 相邻量子安全和通信支出
        - 后量子就绪研讨会、密码迁移规划、安全网络试点
        - 直接中性原子计算收入
        - 政府、银行、关键基础设施运营商
        - 制造紧迫感和相邻预算，但这类支出大多不会直接转化为 QuEra 收入。
      - - 现状替代栈
        - 经典 HPC、GPU AI、经典优化、量子启发式软件
        - N/A
        - 现有 IT、R&D 或运营预算
        - 这才是 QuEra 必须真正击败的现有方案；胜负取决于 ROI、信任和工作流适配，而不只是技术新颖性。
    notes: 纳入支出是 QuEra 特定口径，限于中性原子计算、混合部署和联合设计渠道；排除类别是相邻或替代市场，而不是 QuEra TAM。
