  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              QuEra 应放在量子计算硬件与服务市场中分析，但即便在该市场内，它的实际边界也比许多醒目 TAM 幻灯片暗示的更窄。相关支出不是“所有量子技术”，甚至也不是每一美元量子计算支出。QuEra
              可触达的层级，是通过云访问、本地系统、混合 HPC 集成和应用联合设计销售的中性原子量子能力，买方需要的仿真或优化工作负载未来可能跑赢经典方法。这个边界包括 Aquila 和未来 Braket 访问、AIST
              式本地路线，以及与算法开发和集成绑定的服务工作；不包括量子传感、量子通信或 QKD，也不包括大多数后量子密码迁移预算，因为这些类别可以快速增长，却不购买 QuEra
              硬件。因此，现状替代品不是“什么都没有”，而是经典 HPC、GPU 密集型 AI 仿真、经典优化软件和抗量子软件迁移。BCG 提醒说，今天量子相对经典计算仍没有可感知的商业优势；这一点很关键，因为 QuEra
              竞争的对象不只是其他量子供应商，也包括快速改进的替代方案。中性原子仍有用，因为 AWS、Braket 和 QuEra 都把这种路线与仿真、优化任务绑定，而几何结构、可重构性和类似全连接的连通性在这些任务中有价值。
