          tone: positive
        - date: 2021-11
          label: 退出隐身
          detail: 公司带着 $17M 融资和一台 256 量子比特设备公开亮相。
          tone: positive
        - date: 2022-11
          label: AWS 上的 Aquila
          detail: 首个普遍可访问的中性原子系统在 Amazon Braket 上线。
          tone: positive
        - date: '2023-12-06'
          label: 48 个逻辑量子比特
          detail: Harvard/QuEra/MIT/NIST-UMD 宣布在 48 个逻辑量子比特上运行复杂纠错算法。
          tone: positive
