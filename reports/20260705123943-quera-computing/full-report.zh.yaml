      - number: '6.4'
        title: 留存、重复使用与收入耐久性信号
        blocks:
          - type: paragraph
            body: >-
              公开的耐久性证据是本章明显转弱的地方。QuEra 不披露 NRR、GRR、流失率、续约率、合同期限或客户满意度分组，因此只能用代理指标推断耐久性。最强的代理指标是重复访问和阶段推进：Braket
              机器小时增长和容量扩张意味着需求回流；NERSC 的 Stage A 和 Stage B 结构意味着从评估走向更充分使用的路径；AIST 从硬件合同推进到备忘录，再到共享远程访问平台；Wellcome Leap
              项目也从算法工作推进到大规模仿真，再到硬件执行。这些信号有价值，但不能替代收入留存。即便最强的企业引用，大多仍由公司筛选发布，也不披露试点是否续约、扩容，或转成经常性支出。诚实的承销判断是：QuEra
              已有足够公开证据说明用户会回来购买更多访问权限，并加深技术参与；但证据还不足以量化经济耐久性。管理层披露账户级续约，或客户独立谈及重复支出之前，耐久性仍是可信但未被证明的判断。
