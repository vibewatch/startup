              表明资本仍会流向主权级量子故事，但即便如此，公开估值披露也有限。对 QuEra 而言，最可能的退出路径仍是在 IPO 之前再做一轮私募或战略资本事件，因为当前公开披露还没有达到公开市场准备度。
