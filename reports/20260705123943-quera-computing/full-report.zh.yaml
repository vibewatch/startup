              可比工作支持纪律，而不是兴奋。公开量子股票相对当前收入仍有很大市值，但同一批公开文件和业绩报道也显示持续亏损、资本需求和不确定的市场采用。IonQ 是最强的公开收入基准；D-Wave
              具名客户覆盖更广；Rigetti 说明执行落后时下行会多快出现；每家公司仍高度由期权价值驱动。私募方面，Quantinuum 2025 年 9 月的 $10 billion 融资和 Helios
