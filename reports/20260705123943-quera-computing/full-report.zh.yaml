        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              按客户工作流看，QuEra 销售的是访问路径，而不是一台单一完工设备。当前最强产品是 Aquila：一台 256 量子比特的模拟中性原子 QPU，客户今天可以通过 Amazon Braket 使用，也可以通过
              QuEra 的更高接触 Premium Access 项目访问。围绕这个锚点，QuEra
              增加了托管服务层、面向希望本地控制的中心的本地部署包，以及面向需要在产品化用例前调优工作流的客户的应用联合设计动线。公开模块地图现在还包括基于门的产品线。Gemini 被描述为数字中性原子系统，Libra
              则位于更远处，是容错云路线图，而非现成 SKU。软件侧，Bloqade 和更新的 Tsim
              资产很重要，因为它们不是泛泛的营销配件；用户正是靠这些工具在消耗稀缺硬件时间之前仿真、原型化并转换工作负载。关键尽调结论是：QuEra 已经交付真实访问和工具，但产品包装不均衡——Aquila
              已在运行，Gemini 只部分开放，Libra 仍是路线图承诺，应被视为未来能力而非当前可交付物。
