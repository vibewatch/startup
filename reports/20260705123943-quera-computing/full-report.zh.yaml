      - number: '5.2'
        title: 架构与运行模型
        blocks:
          - type: paragraph
            body: >-
              QuEra 的技术核心很具体，而不泛化：中性 87Rb 原子阵列被困在光镊中，需要相互作用时被激发到 Rydberg 态，并被编程为模拟 Hamiltonian 仿真器或基于门的数字处理器。对 Aquila
              而言，AWS 文档和 QuEra 白皮书显示，用户工作流是先定义二维原子排布，再指定随时间变化的振幅、相位和失谐参数，驱动原生 Hamiltonian。这与标准门列表工作流有实质差异。在数字模式下，公开叙事转向
              Gemini 和逻辑处理器论文：量子比特在不同区域之间移动，纠缠操作集中在专用区域，逻辑操作依赖可重构布局、穿梭和并行控制。Bloqade 用仿真、参数扫描、可视化和 Braket
              提交把这些模式连接起来；Tsim 发布则把栈进一步推进到非 Clifford 和 QEC
              仿真。该架构凭可重构性以及在同一中性原子平台上支持模拟和数字工作流的能力形成差异化，但这也意味着成熟度取决于最弱的一层：物理控制、软件编排和解码器性能都必须一起提高。
