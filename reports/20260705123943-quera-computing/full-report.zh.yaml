      - number: '2.5'
        title: 矛盾、未解问题与仍需尽调事项
        blocks:
          - type: paragraph
            body: >-
              本章最大的两个矛盾应被保留，而不是取平均。第一是市场规模框架：近期收入视角集中在低个位数十亿美元，但长期价值池估计会跳到数百亿甚至数千亿美元，取决于来源衡量的是供应商收入、行业创造价值，还是更宽的量子技术伞。第二是时间线：QuEra
              和 AWS 把 2028 年描述为云端可访问容错工作流的起点，而 BCG 仍把全规模容错放在 2040 年之后。如果没有额外尽调，这两种观点不能同时作为基准情景。还有一些重要缺口。公开证据没有隔离出中性原子专属
              SAM，没有披露 QuEra 的定价或部署经济性，也没有在一般行业实验之外验证一个具名 QuEra 金融客户。这些遗漏很重要，因为 QuEra 的估值并不取决于量子抽象上是否是大品类，而更取决于 QuEra
              能否在经典替代方案持续改进之前，把一小组锚定渠道转化为可重复的商业合同。因此，务实的尽调路径是索取垂直行业收入结构、定价和利用率假设、金融领域具名设计伙伴证据，以及对 Libra
              时间表的外部技术审查。在这些信息可用之前，市场案例应被视为战略方向强、政府和 HPC 最强，但企业转化经济性仍不完整。
