              具名客户证明在绑定具体机构、工作流和结果时最有力。AIST 是质量最高的案例：证据包括已披露的合同金额、具名安装地点、与 ABCI-Q 并行的混合用例，以及之后把关系扩展到外部用户远程访问的证据。NERSC
              也是强证明点，因为该中心公开点名 Aquila 和 Gemini，列出项目数量、QPU 小时分配区间和论文发表规则。NQCC 和 Pawsey 比生产环境低一档，但仍高于泛泛的合作伙伴表述：NQCC
