  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              QuEra 最严重的风险不是已知丑闻，也不是单一监管争议；而是雄心很大的多代容错路线图，可能比当前公开叙事暗示的更晚、更贵，或商业重复性更差。公司确实有可信资产——真实云访问、具名 AIST 合同、DARPA
              阶段门，以及深厚的 NVIDIA/AWS 生态——但这些资产也把下行风险集中起来。如果 Libra 延迟，如果 gigaquop
              里程碑右移，或公共项目客户证明无法扩大为可重复的企业需求，收入集中度和融资压力会迅速恶化。阅读本章的正确方式，是把它看成一个耦合系统。出口管制会拖慢招聘和合作；政府客户安全要求会拖慢采购；AWS 和 NVIDIA
              依赖会压缩利润率或进度弹性；客户集中度也会让每一次项目延误比多元化软件公司更痛。热力图因此把路线图压缩、客户集中度，以及合规加依赖的交互，放在普通创业噪音之上。
