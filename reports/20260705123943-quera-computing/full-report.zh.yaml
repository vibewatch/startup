      - number: '2.2'
        title: 受证据约束的测算：收入、价值池、主权预算与标杆采购视角
        blocks:
          - type: paragraph
            body: >-
              只有先收紧市场边界，公开市场测算才有用。近期第三方收入视角并不巨大：McKinsey 估计量子计算公司 2025 年收入略高于 $1 billion，2028 年达到 $3.2 billion 到 $4.4
              billion；QED-C 给出的图景相近但不完全一样，2025 年为 $1.4 billion 到 $1.9 billion，2028 年超过 $3
              billion。这些差异已经足以说明市场仍高度依赖定义。BCG 对容错之前供应商能现实变现多少更谨慎：它把 2030 年供应商市场仅维持在 $1 billion 到 $2 billion，同时保留 2040 年
              $90 billion 到 $170 billion 的更大供应商收入情景，以及 $450 billion 到 $850 billion 的经济价值区间。对 QuEra 来说，最有决策价值的视角既不是宽泛的
              2035 年价值池，也不是简单 TAM 级联，而是主权预算和标杆采购：BCG 称公共订单已经支撑超过半个市场，英国战略承诺十年投入 £2.5 billion，美国再授权路径资助测试床和应用，DOE 希望到
              2028 年建成具备科学意义的容错平台，而 QuEra 自身已经在 AIST、NERSC、AWS 和意大利 ICSC
              项目中拥有具名证明。这足以说明市场真实存在，但没有私人定价、合同和利用率数据，还不足以发布干净的中性原子专属 SAM 或 SOM。因此正确结论是，QuEra
              可触达的早期市场偏主权和仿真密集；长期上行空间取决于容错采用是否能接近公司自己的时间表。
