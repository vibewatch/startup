        - 主权、战略和长周期企业买方
        - 今天没有广泛公开计算；平台和软件叙事瞄准公用事业级 FTQC
        - 深度制造论点和资本强度让它具备战略重要性；短期买方可及性有限。
      - - Rigetti
        - 超导挑战者
        - 全栈 Fab-1 制造商，有 108Q 云系统历史和 Novera 产品
        - 研究、政府、HPC 相关实验室、硬件测试床
        - 混合云服务，加上可立即交付的 9 量子比特本地部署 Novera QPU
        - 吸引需要硬件控制和低延迟混合工作流的买方；商业规模小于 IBM 或离子阱领导者。
      - - D-Wave
        - 相邻 / 替代方案
        - $20M FAU 系统协议和生产级 Leap 服务
        - 优化密集型企业、公共部门、物流、制造
        - Leap 量子云、混合求解器、本地部署 Advantage2 系统和门模型 R&D
        - 今天最接近运营就绪的优化任务替代方案；不是一对一的通用门模型竞争者。
      - - AWS / Azure 经纪商 + 混合 HPC 现状
        - 云经纪商和内部自建替代
        - 超大云厂商分销，加上按量付费市场和经典 GPU 资产
        - 探索型买方、平台团队，以及想推迟硬件承诺的预算所有者
        - 经纪式访问多个 QPU，加上 CUDA-Q 等混合开发栈
        - 最容易多供应商并行和比较；但不能消除不同模态的性能差异。
    notes: 行覆盖直接中性原子同业、既有通用硬件平台、相邻替代方案，以及 2026 年买方能现实比较的经纪式现状路径；规模信号混合融资、机群和商业化证据，而非单一归一化指标。
