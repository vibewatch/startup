        title: 投资建议与论点
        blocks:
          - type: paragraph
            body: >-
              QuEra 现在已有足够公开证据留在投资者的活跃名单上，但还不足以支撑在 2025 年末隐含接近 $1 billion 的私募标记下给出明确买入结论。正面论点真实存在：QuEra 从
              Google、SoftBank Vision Fund 2、Valor、QVT、Safar 以及之后的 NVentures 融资超过 $230 million；它通过日本 AIST
              系统销售拿到可见客户证明；它也通过 2025 年容错里程碑和与 AWS 关联的 2028 年 Libra
              路线图，展现出可信的技术动能。反论点同样重要。公开来源仍不披露票据转换机制、清算优先权、烧钱速度、毛利率或积压订单质量，这些都是投资者有信心承销下行所需要的信息。TechCrunch 还报道，2025 年 2
              月的工具是可转换票据，QuEra 拒绝披露估值；因此常被引用的约 $1 billion 数字有参考价值，但还不是完全有支撑的价格证据。建议：跟踪，置信度中等，风险高。
