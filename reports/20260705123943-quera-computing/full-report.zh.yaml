      - - Pasqal
        - 直接中性原子竞争者
        - 预计上市前融资至少 €340M
        - 工业优化、金融、HPC 和云买方
        - Pasqal Cloud、本地部署系统、Google Cloud 和 Azure 路径
        - 工业和云姿态强；具体经济性和容错成熟度仍在演进。
      - - IBM Quantum
        - 既有通用硬件平台
        - 100 量子比特以上系统 30+ 台、可用量子比特 2,300+、正常运行时间 97%
        - 企业、HPC、研究机构和本地部署买方
        - 通过 IBM Quantum Platform 提供开放、按量付费、Flex、Premium 和本地部署方案
        - 企业包装最透明、机群最广；低温超导栈和纠错开销仍是真实约束。
      - - Google Quantum AI
        - 既有 R&D 对手
        - Alphabet 支持的 Willow 项目，取得 105 量子比特基准结果
        - 顶尖研究合作者和旗舰科学伙伴
        - 选择性 Willow Early Access 加 Cirq 软件生态
        - 生态引力大、技术品牌强；近期采购界面弱，因为访问不公开。
      - - IonQ
        - 商业化离子阱对手
        - 上市公司，2026 年一季度收入 $64.7M，2026-2030 路线图激进
        - 企业、政府、云和数据中心运营商
        - 直连云、预留、主要 SDK 支持和 Forte Enterprise 本地部署系统
        - 商业重叠和渠道宽度很强；路线图雄心领先于当前 36 量子比特产品规模。
      - - Quantinuum
        - 商业化离子阱对手
        - Honeywell 支持的 Helios 平台，提供 Azure 和直接订阅
        - 企业、政府、制药、金融和高级 R&D 买方
        - 直接订阅、云服务、Azure 分销和本地部署 Helios 访问
        - 高保真全栈产品，有公开经纪式定价；偏企业的经济性可能拖慢更广泛试验。
      - - PsiQuantum
