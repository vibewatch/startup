            body: >-
              与许多量子创业公司相比，QuEra 的商业界面异常清楚，因为 AWS 公布 Aquila 价格，QuEra 也单独宣传高端直接访问和本地部署。即便如此，QuEra 仍不是最容易采购的供应商。IBM
              仍是透明包装的基准，因为它在一个地方公开列出 Open 计划、按量付费访问、更大的年度承诺和本地路线。IonQ 和 Quantinuum
