- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Status
  - Public valuation / round
  - Revenue / traction anchor
  - Why it matters
  - Limitation
  rows:
  - - QuEra
    - Private neutral-atom FTQC company
    - ~$1B market-data estimate; exact note conversion price not publicly disclosed
    - ~$39.9M 2025 revenue estimate; one ~ $41M AIST system sale; first on-prem HPC deployment
    - Subject company benchmark
    - Public valuation support is conflicted and preference terms are undisclosed.
  - - IonQ
    - Public trapped-ion leader
    - $18.33B July 2026 market cap; $11.5B June 2025 non-affiliate market value in 10-K
    - $130M FY25 revenue; still $510.4M FY25 net loss
    - Shows the high end of public quantum option value when revenue scale is more visible
    - Public liquidity and M&A sentiment make the mark more volatile than a private round.
  - - D-Wave
    - Public annealing / gate-model hybrid player
    - $8.34B July 2026 market cap; ~$4.93B June 2025 non-affiliate market value in 10-K
    - $24.6M FY25 revenue from 135+ customers
    - Best public proof that small quantum revenue can still support a rich equity value
    - Different modality and customer mix from neutral-atom FTQC.
  - - Rigetti
    - Public superconducting player
    - $5.96B July 2026 market cap; $3.82B June 2025 non-affiliate market value in 10-K
    - $7.1M FY25 revenue; $216.1M FY25 net loss
    - Useful downside reminder of what happens when scale and commercialization lag
    - Public mark is sentiment-sensitive and architecture is different.
  - - Quantinuum
    - Private commercial trapped-ion leader
    - $600M raise at $10B pre-money (Sep 2025)
    - Helios launch with Amgen, BMW Group, JPMorganChase, and SoftBank as named customers
    - Closest premium private benchmark with materially stronger public customer disclosure
    - Different modality, larger scale, and stronger disclosure discipline than QuEra today.
  - - PsiQuantum
    - Private sovereign-scale photonic FTQC company
    - $1B Series E disclosed; public valuation not provided in fetched official sources
    - Groundbreaking in Australia and DARPA-backed technical validation
    - Shows that sovereign-backed quantum scale stories still attract huge capital
    - Official valuation is opaque, so it is more a capital-intensity than a clean price comp.
  - - IQM
    - Private / pre-listing superconducting company
    - ~$1.8B pre-money in Feb 2026 SPAC transaction; expected >$450M cash at close
    - Claims real customers and on-prem deployments; previously raised over $300M Series B
    - Provides a disclosed European private/public bridge value below Quantinuum but above QuEra
    - Transaction is not yet a seasoned public market-clearing price.
  notes: 'Coverage is intentionally partial: it includes the best-documented 2025-2026 public quantum equities and
    private financing marks with usable revenue or deployment anchors.'
  enumerationScope:
    coverage: partial
    basis: Built from the best-documented 2025-2026 public pure-play quantum companies and private peers with visible
      financing or valuation marks rather than every undisclosed startup globally.
