- id: TV001
  title: Recommendation Summary Table
  columns:
  - Dimension
  - Assessment
  - Confidence
  - Decision implication
  rows:
  - - Recommendation
    - Track at current public price context
    - medium
    - Stay engaged, but do not clear an investment memo without next-round terms and full downside math.
  - - Risk rating
    - High
    - medium
    - Position sizing should assume binary roadmap, financing, and customer-repeatability risk.
  - - Valuation stance
    - Stretched on public evidence; only defensible if effective entry is around or below ~$1B and terms are clean
    - medium
    - Do not pay up further on narrative momentum alone.
  - - Target return / hold
    - Need a credible path to 3x+ gross over 4-5 years to compensate for dilution and execution risk
    - medium
    - Base-case returns are not sufficient if the true entry sits materially above the market-data mark.
  - - Primary upgrade trigger
    - Priced round with light preferences plus a second named paid lighthouse deployment
    - medium
    - That combination would improve both price support and repeatability evidence.
  - - Primary downside trigger
    - Flat/down round, heavy seniority, or visible 2026-2028 roadmap slippage
    - medium
    - Re-underwrite immediately to bear-case assumptions.
  notes: 'Recommendation is explicitly price-sensitive: QuEra can move to buy only if valuation terms and repeatable
    commercial proof improve together.'
