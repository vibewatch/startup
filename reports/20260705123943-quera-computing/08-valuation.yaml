- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Classical compute limits and government-backed quantum demand still create a real wedge for FTQC vendors.
    - The 2026 budget survey shows buyers now want proof and are no longer funding quantum stories on faith.
    - A visible uptick in proof-led enterprise buying or more paid deployments would strengthen conviction.
  - - Product / roadmap
    - QuEra has linked 2025 fault-tolerance milestones to a concrete 2028 Libra-on-AWS roadmap.
    - Roadmap credibility remains a forward promise until QuEra hits 2026-2027 in-house system milestones.
    - Investor-visible milestone reporting against the 2026-2028 chain would narrow delivery risk.
  - - Customers
    - AIST and the first on-prem HPC deployment prove QuEra can win meaningful hardware business.
    - Public evidence still does not show whether the $41M-class win is repeatable or concentrated in one lighthouse
      buyer.
    - A second named paid system or disclosed multi-customer backlog would improve the customer story materially.
  - - Financials
    - Estimated ~$40M 2025 revenue suggests QuEra is not a zero-revenue science project anymore.
    - The best public revenue number is market-data-based rather than audited, and gross margin, burn, and retention
      remain undisclosed.
    - Management disclosure of recurring versus one-off revenue, gross margin, and runway would improve valuation
      support.
  - - Competition
    - QuEra looks cheaper than Quantinuum on headline private valuation and has more visible revenue than many pre-commercial
      peers.
    - Quantinuum already shows stronger customer disclosure, while public comps show how quickly quantum marks can
      compress.
    - A clearer reason why QuEra deserves a premium multiple over D-Wave / Rigetti and a disclosure discount to
      Quantinuum would help.
  - - Financing risk
    - Google, SoftBank, Valor, and NVentures are strong external validators.
    - The original financing was a convertible note, and public sources still do not disclose conversion, preference,
      or anti-dilution terms.
    - A clean priced equity round or released note-conversion terms would remove a major underwriting gap.
  notes: The anti-thesis is not that QuEra lacks progress; it is that current public evidence still leaves too much
    hidden in pricing and downside terms.
