company:
  name: QuEra Computing
chapter:
  number: 8
  title: Valuation
  summary: QuEra has enough real commercial and technical proof to stay investable, but not enough public downside
    detail to justify a buy at anything materially above the roughly $1 billion market-data mark. The company’s
    visible AIST sale, strategic investor base, and AWS-linked 2028 roadmap create upside, yet the opaque convertible-note
    pricing, missing preference terms, and proof-driven 2026 market backdrop keep the correct recommendation at
    Track with high risk.
sections:
- id: investment-recommendation-and-thesis
  title: Investment Recommendation and Thesis
  body: 'QuEra now has enough public evidence to stay on an investor''s active list, but not enough to justify a
    clean buy call at an implied late-2025 private mark near $1 billion. The positive side of the case is real:
    QuEra raised more than $230 million from Google, SoftBank Vision Fund 2, Valor, QVT, Safar, and later NVentures;
    it has visible customer proof through the AIST system sale in Japan; and it has credible technical momentum
    through its 2025 fault-tolerance milestones and 2028 AWS-linked Libra roadmap. The anti-thesis is equally important.
    Public sources still do not disclose the note-conversion mechanics, liquidation preferences, burn, gross margin,
    or backlog quality that would let investors underwrite downside with confidence. TechCrunch also reported that
    the February 2025 instrument was a convertible note and that QuEra declined to disclose valuation, which makes
    the commonly cited ~$1 billion figure useful context but not fully supported price evidence. Recommendation:
    Track, with medium confidence and high risk.'
