- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Key assumptions
  - Estimated value
  - Gross return vs ~$1B entry
  - Probability signal
  - Key downside trigger
  rows:
  - - Bull
    - 2026-2027 system milestones stay on track, Libra/AWS timing holds for 2028, ARR grows past $100M, and AIST-class
      deployments become repeatable.
    - $3.0B-$5.0B
    - ~3.0x-5.0x
    - Low-to-medium
    - Any slip in roadmap or second-customer proof breaks the setup quickly.
  - - Base
    - Revenue grows into roughly $60M-$80M, Japan remains a lighthouse account, next round is only modestly up,
      and buyers keep demanding proof.
    - $1.2B-$2.0B
    - ~1.2x-2.0x
    - Medium
    - Returns fall below hurdle if terms are senior or entry is well above the implied current mark.
  - - Bear
    - Revenue stays lumpy, milestones slip, or the next round prices flat/down with heavy preferences and sector
      multiples compress.
    - $0.3B-$0.8B
    - ~0.3x-0.8x
    - Material tail risk
    - Financing reset plus missed delivery milestones would impair the thesis before the technology fully fails.
  notes: Ranges are analyst scenario estimates based on public evidence, not company guidance; precision is limited
    by opaque note terms, burn, and margin data.
