- id: financing-context-scenarios-and-entry-discipline
  title: Financing Context, Scenarios, and Entry Discipline
  body: The current valuation context is directionally understandable but still too opaque for false precision.
    GetLatka lists QuEra at roughly $1 billion with about $39.9 million of 2025 revenue, while QuEra's own releases
    confirm the $230 million financing and later describe the NVentures top-up as an expansion of a $230 million
    Series B round. Yet TechCrunch states that the original financing was a convertible note that will convert in
    a future equity round and says QuEra did not provide a valuation. That combination matters more than the headline
    itself, because private downside will depend on conversion price, preference stack, and whether the $41 million
    AIST deal is the start of a repeatable commercial motion or just a lighthouse contract. At a true $1 billion-equivalent
    entry, the bull case can work, but the base case only modestly clears a venture hurdle and the bear case still
    implies capital impairment. If the effective entry is above $1 billion or burdened by senior preferences, the
    recommendation should stay Track.
