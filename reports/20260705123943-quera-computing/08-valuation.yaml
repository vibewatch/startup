  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-note-terms
    missingEvidence: Convertible note conversion mechanics, full capitalization table, liquidation preferences,
      anti-dilution terms, and seniority stack.
    whyItMatters: These terms determine whether the apparent entry price survives downside cases or is overwhelmed
      by preference overhang.
    diligencePath: Request the note summary, investor cap table, board-approved financing documents, and counsel
      memo on conversion mechanics.
    relatedQuestionRefs:
    - QV024
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: burn-capex-runway
    missingEvidence: Current cash, monthly burn, committed capex, hiring ramp, and milestone-by-milestone cash needs
      through 2028 Libra delivery.
    whyItMatters: Without a cash bridge, investors cannot tell whether the current round avoids a punitive financing
      before the core proof point arrives.
    diligencePath: Request the CFO cash bridge, annual operating plan, and capex schedule tied to the 2026-2028
      roadmap.
    relatedQuestionRefs:
    - QV028
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-and-repeatability
    missingEvidence: Breakdown of recurring cloud / services revenue versus one-off system sales, backlog conversion
      timing, and customer concentration.
    whyItMatters: The difference between repeatable ARR and a few lighthouse contracts is central to whether QuEra
      deserves a premium private multiple.
    diligencePath: Review revenue bridge, top-customer schedule, signed backlog, and renewal / support terms for
      large deployments.
    relatedQuestionRefs:
    - QV004
    - QV030
    - QV029
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: exact-public-price-support
    missingEvidence: A clearly priced equity round or disclosed conversion formula that reconciles the undisclosed
      convertible note with third-party ~$1B valuation estimates.
    whyItMatters: Investors cannot know whether current headline valuation context is conservative, fair, or already
      stretched without a real price anchor.
    diligencePath: Ask management for the conversion formula, any valuation cap or discount, and the expected timing
      of the next priced round.
    relatedQuestionRefs:
    - QV003
    - QV024
    relatedTableRefs:
    - TV004
    - TV006
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by product / service line and support cost for installed systems and cloud usage.
    whyItMatters: A growth story with poor deployment economics may require more capital without creating proportional
      equity value.
    diligencePath: Request management margin analysis and cost-to-serve assumptions for hardware, cloud, and support
      lines.
    relatedQuestionRefs:
    - QV009
    - QV028
    - QV029
    relatedTableRefs:
    - TV006
