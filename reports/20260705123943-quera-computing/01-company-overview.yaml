  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A priced equity round, conversion formula, or valuation cap/discount for the 2025 convertible financing and its NVentures expansion.
    whyItMatters: Without conversion economics, investors cannot know the true valuation benchmark, dilution risk, or whether the 2025 financing implied a clean up-round.
    diligencePath: Request the note purchase agreement, conversion mechanics, any valuation cap or discount, and the post-expansion cap table.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: A current revenue bridge or ARR disclosure that distinguishes recurring cloud or support revenue from milestone-heavy system or services revenue.
    whyItMatters: Revenue quality is central to judging whether QuEra is building repeatable software-plus-hardware economics or still living off a small number of bespoke deals.
    diligencePath: Ask management for monthly recurring revenue, FY2025 and trailing-12-month revenue breakdowns, gross margin by line, and top-customer concentration.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current company-wide headcount by function and geography rather than a dated partial count of scientists and engineers.
    whyItMatters: Headcount reveals operating burn, hiring intensity, manufacturing readiness, and the true scale of QuEra’s global footprint.
    diligencePath: Request a current org chart, employee count by department and site, and a 12-month hiring or attrition summary.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full public board roster with committee assignments, independence markers, and biographies for all directors.
    whyItMatters: Governance rights, investor control, and decision authority cannot be judged from one named board member and a CEO-transition press release alone.
    diligencePath: Request the current board list, committee charter documents, observer rights, and any shareholder agreement sections covering protective provisions.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: Exact ownership percentages, liquidation preferences, board rights, and side-letter terms for named investors and strategic partners.
    whyItMatters: The stakeholder map identifies who matters, but not how economics and control are actually allocated across the cap table and partnership stack.
    diligencePath: Review the current cap table, SAFEs or notes, preferred-stock terms, board rights, and any commercial side letters with AWS, NVIDIA, or AIST-linked entities.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: A complete public chronology for every government-program selection, contract close date, and internal system-generation milestone.
    whyItMatters: The chronology is sufficient for a company overview, but later diligence will want a cleaner linkage between scientific milestones, contract wins, and financing events.
    diligencePath: Build a management-verified timeline that reconciles internal product milestones, government-program gates, and customer contract dates.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TO004
