- id: founders-leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: 'QuEra still draws founder-market fit directly from the Harvard/MIT scientists behind its architecture. Launch materials name Mikhail Lukin, Markus Greiner, Vladan Vuletić, Dirk Englund, Nathan Gemelke, and John Pena on the founding team, while the current about page still highlights Lukin as co-founder and chief scientist, Vuletić as co-founder and CTO, Greiner as co-founder, and Gemelke as co-founder and chief technology strategist. That continuity is an asset because the company’s credibility still depends heavily on the perceived scientific edge of its neutral-atom roadmap and error-correction work.


    Leadership, however, is no longer founder-led in the CEO seat. In July 2024 the board moved Alex Keesling out of the CEO role and appointed board member Andy Ory as acting CEO; by current company materials and the September 2025 financing-expansion release, Ory is simply presented as CEO. QuEra further professionalized its bench by hiring Ed Durkin as CFO in September 2024 and by giving Takuya Kitagawa a visible president role around the Japanese strategy and AIST deployment. Public governance disclosure is still incomplete: retained sources confirm Arthur Chu as a board member and show the board appointing Ory, but they do not provide a full current board roster, committee map, or detailed minority-protection terms. That leaves clear key-person dependence on Ory for commercialization and capital formation and on Lukin, Vuletić, and Gemelke for technical roadmap execution.'
