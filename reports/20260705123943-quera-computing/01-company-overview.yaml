- id: funding-history-and-disclosed-scale
  title: Funding history, investors, and disclosed scale metrics
  body: 'QuEra’s disclosed financing history shows sharp step-ups in capital but not clean transparency on pricing. The company emerged from stealth in 2021 with $17 million in funding and later disclosed a $30 million Series A completed early in 2023. On 2025-02-11 it announced financing of more than $230 million from Google Quantum AI, SoftBank Vision Fund 2, Valor Equity Partners, QVT Family Office, Safar Partners, and other existing investors, with $60 million still subject to a funding condition at announcement. Independent coverage is important here because TechCrunch reported the instrument was a convertible note rather than a priced equity round, while Reuters and TechCrunch both said QuEra did not disclose a valuation.


    That means the chapter can defend a minimum public capital base but not a precise current mark. Adding the publicly disclosed $17 million launch round, the 2023 $30 million Series A, and the 2025 financing yields at least $277 million of disclosed capital before considering any undisclosed incremental amount from NVentures, which expanded the round in September 2025. QuEra also has one unusually tangible commercial proof point for a quantum startup: the roughly $41 million AIST system contract. But the other cover metrics remain intentionally incomplete. Retained chapter sources do not provide a dependable current public ARR or revenue figure, do not disclose an exact customer count, and do not confirm a current company-wide headcount beyond the partial 2024 disclosure of more than 50 scientists and engineers.'
