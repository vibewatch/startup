  rows:
  - - 99.5%-class CZ gate fidelity
    - Peer-reviewed and independently published
    - Digital two-qubit gate performance on up to 60 neutral-atom qubits in parallel
    - Still needs translation from laboratory performance into product SLAs and uptime
  - - 48 logical qubits and logical algorithms
    - Peer-reviewed and company-promoted
    - Fault-tolerant logical operations and large logical-code experiments
    - Research milestone, not yet a broad commercial product surface
  - - Logical magic-state distillation
    - Peer-reviewed preprint plus company release
    - Key non-Clifford/QEC building block for future universal FTQC
    - Early logical milestone still far from a routine customer workflow
  - - Managed onboarding and support
    - Publicly disclosed at a high level
    - Premium Access office hours, scientist mentoring, onboarding, and flexible SLAs
    - No public response-time, uptime, or remediation commitments
  - - Secure local execution claims
    - Publicly disclosed at a high level
    - On-prem materials emphasize local execution, controlled access, and facility integration
    - No public third-party assurance or detailed security architecture
  - - Open research-governance constraints
    - Visible through NERSC program rules
    - Export-control, publication, and training obligations in national-lab access programs
    - These are program controls, not direct proof of QuEra's own enterprise compliance maturity
  - - Enterprise assurance artifacts
    - Not found in the reviewed public pack
    - SOC 2, ISO 27001, privacy-security operations packet, and status surface
    - Security and reliability diligence remains materially incomplete without direct vendor disclosure
  notes: The table distinguishes technical quality evidence from enterprise operating assurance. Public proof is strong on the former and weak on the latter.
