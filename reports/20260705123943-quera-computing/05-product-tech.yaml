  - type: missing-source
    severity: material
    topic: service-operating-metrics
    missingEvidence: Public uptime targets, queue-performance metrics, response-time SLAs, or pricing for Aquila, Premium Access, or Gemini programs.
    whyItMatters: Without operating metrics, buyers cannot model reliability, throughput, or total cost of ownership for production or pilot workloads.
    diligencePath: Ask for contract terms, sample SLAs, utilization data, and queue-performance history for Braket, Premium Access, and on-prem customers.
    relatedQuestionRefs:
    - QE022
    - QE026
    relatedTableRefs:
    - TE001
    - TE004
