  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-assurance
    missingEvidence: Public SOC 2, ISO 27001, privacy/security operations materials, or a status page tied to Aquila, Gemini, or managed access.
    whyItMatters: Enterprise buyers need independent evidence of security controls and service operations before trusting sensitive workloads to managed or on-prem quantum systems.
    diligencePath: Request QuEra's security packet, incident-response policy, and any third-party assurance reports during diligence; if none exist, treat security governance as immature.
    relatedQuestionRefs:
    - QE023
    - QE021
    relatedTableRefs:
