    severity: material
    topic: gemini-documentation
    missingEvidence: Open developer documentation, API references, and a public technical specification sheet for Gemini beyond the marketing summary page.
    whyItMatters: The digital product cannot be compared rigorously to Aquila or competing gate-based systems if key interfaces and operating details are only available on request.
    diligencePath: Request the Gemini spec pack, API docs, and pilot-operating handbook; validate whether third-party researchers receive the same materials.
