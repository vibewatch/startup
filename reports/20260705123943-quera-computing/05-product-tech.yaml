tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - module / asset
  - primary buyer or user
  - status / maturity
  - differentiation
  - diligence gap
  rows:
  - - Aquila analog QPU
    - Researchers, applied-science teams, early enterprise experimenters
    - Live and publicly documented via AWS Braket and QuEra-managed access
    - Reconfigurable 256-qubit analog neutral-atom system with user-defined layouts and native Hamiltonian control
    - Need clearer public throughput, uptime, pricing, and repeatable enterprise operating metrics
  - - Gemini digital neutral-atom QPU
    - QEC researchers, HPC centers, early digital-circuit pilots
    - Publicly described, in pilots or staged programs rather than open self-serve access
    - Gate-based neutral-atom architecture with shuttling, zoned operation, and high published gate fidelities
    - Open API docs, public operating handbook, and broad access terms remain limited
  - - Libra fault-tolerant system
    - Strategic partners planning FTQC workflows
    - Roadmap only; targeted for Braket in 2028
    - Cloud fault-tolerant positioning with projected logical-qubit and logical-error-rate targets
    - All commercial maturity depends on roadmap execution and intermediate milestone delivery
  - - Bloqade software stack
    - Quantum developers, algorithm researchers, applications teams
    - Active and public across docs, repos, and package surfaces
    - Hardware-aware SDK spanning analog, digital, emulation, parameter sweeps, and hybrid development
    - Digital-mode tooling and user docs are still less mature than the analog path
  - - Tsim QEC simulator
    - QEC researchers and decoder developers
    - Newly open-sourced in 2026
    - GPU-accelerated non-Clifford simulation extends QuEra beyond hardware access into logical-circuit tooling
    - Early open-source release still needs broad outside adoption and benchmarking
  - - Premium Access managed service
    - Teams needing guided experimentation and faster iteration
    - Available now as a managed access model
    - Direct scientist support, onboarding, and reserved capacity can shorten time to useful experiments
    - Public SLA, pricing, and escalation details are not disclosed
  - - On-prem and HPC deployment package
    - National labs, sovereign programs, HPC centers, security-sensitive users
    - Deployed in select centers and clearly marketed, but not mass-market
    - Room-temperature, low-power neutral-atom systems fit more naturally into existing facilities than cryogenic modalities
    - Need more public evidence on install base, operational uptime, and field-support burden
  - - Application co-design program
    - Customers mapping workloads to current or future QuEra hardware
    - Active services motion tied to roadmap readiness
    - Links algorithm design, simulation, hardware tuning, and capability transfer in one engagement model
    - Program outcomes are case-study driven; repeatability and economics are not yet transparent
  notes: Rows separate present-day operating surfaces from pilot and roadmap assets. Maturity labels reflect public evidence rather than internal readiness.
