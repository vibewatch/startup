- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - key dependency
  - key risk
  rows:
  - - Neutral-atom register (87Rb atoms)
    - Physical qubit substrate for both analog and digital modes
    - Stable trapping, cooling, and atom loading in optical tweezers
    - Loading, lifetime, or coherence bottlenecks cap usable scale
  - - Rydberg interaction layer
    - Creates analog evolution and entangling interactions through blockade physics
    - Laser stability, calibration, and accurate control of detuning and amplitude
    - Control noise or blockade imperfections directly degrade result quality
  - - Programmable geometry and shuttling
    - Reconfigures connectivity and moves qubits between functional zones
    - Reliable movement, alignment, and preserved coherence during transport
    - Shuttling complexity becomes a scaling or serviceability bottleneck
  - - Digital zoned architecture
    - Separates storage, entangling, and readout operations for logical workflows
    - Zone control, feedforward, and low-error mid-circuit readout
    - Digital product claims outrun public operating evidence if zone control is hard to industrialize
  - - Bloqade development layer
    - Turns workloads into analog or digital programs, simulations, and parameter sweeps
    - Maintained SDKs, docs, and package distribution
    - Software churn or incomplete docs slow user adoption and integration
  - - Braket execution interface
    - Provides job submission, AHS schema, and cloud access to Aquila
    - AWS platform availability and QuEra-AWS integration quality
    - Cloud access remains queue- and service-dependent rather than fully self-owned by the customer
  - - QEC and decoder stack
    - Supports logical-circuit design, error-correction simulation, and future real-time decoding
    - Fast simulators, scalable decoders, and classical accelerator resources
    - Decoder latency or poor scaling could erode the FTQC value proposition
  - - Hybrid HPC integration layer
    - Connects QPUs to schedulers, GPUs, data pipelines, and on-prem or lab environments
    - Partner ecosystems such as AIST, NERSC, NVIDIA, or Dell-style orchestration
    - Productization can lag if hybrid orchestration is harder than the QPU roadmap implies
  notes: This table mixes hardware, software, and operating layers because QuEra's differentiation depends on the full stack rather than on a single QPU specification.
