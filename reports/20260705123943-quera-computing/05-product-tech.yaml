- id: deployment-integration-and-roadmap
  title: Deployment, integration, and roadmap
  body: 'QuEra''s deployment surface is broadening in a way that matters for commercialization. Cloud access through Braket is the most mature route because it is publicly documented and already integrated into AWS workflows. Premium Access adds scientist support, onboarding, and reservation-style engagement for users who need faster iteration. On-prem materials push a different value proposition: controlled access, secure local execution, scheduler and authentication integration, and room-temperature deployment inside existing HPC environments. Third-party signals show that this is more than a slideware concept. NERSC''s 2026 program allocates Aquila time and Gemini workflow development, while QuEra''s own HPC-center page says a Gemini-class system is already operating with AIST''s ABCI-Q supercomputer. Partner integrations extend the funnel further: Classiq wraps QuEra hardware into a broader software platform, and NVIDIA positions QuEra inside NVAQC and CUDA-Q-centered hybrid QEC workflows.
    The key maturity distinction is that these integrations mostly support pilot, research, or early engineering workflows today. Libra and the broader fault-tolerant roadmap could become strategically important if delivered, but the public evidence still says QuEra''s present business is operating analog access, growing digital pilots, and using partner ecosystems to prepare customers for a later fault-tolerant era.'
