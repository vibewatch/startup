chapter:
  number: 5
  title: Product & Technology
  summary: QuEra has a real product surface today around Aquila, Bloqade, and managed or institutional access paths, while its gate-based Gemini and Libra fault-tolerant story is still partly pilot or roadmap-driven. Public evidence is strongest on the underlying neutral-atom and Rydberg architecture, analog programming model, logical-qubit milestones, and expanding open-source toolchain; it is weaker on enterprise assurance, operating metrics, pricing, and the completeness of Gemini's public documentation.
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'In customer workflow terms, QuEra is selling access paths rather than a single finished appliance. The strongest current product is Aquila: a 256-qubit analog neutral-atom QPU that customers can reach on Amazon Braket today or through QuEra''s higher-touch Premium Access program. Around that anchor, QuEra adds a managed-services layer, an on-prem deployment package for centers that want local control, and an application co-design motion for customers that need workflow tuning before they can productize a use case. The public module map also now includes a gate-based line. Gemini is presented as the digital neutral-atom system, while Libra sits further out as a fault-tolerant cloud roadmap, not as a present-day SKU. On the software side, Bloqade and the newer Tsim assets matter because they are not generic marketing accessories; they are the practical path by which users simulate, prototype, and translate workloads before spending scarce hardware time. The key diligence takeaway
    is that QuEra already delivers real access and tooling, but product packaging is uneven: Aquila is operational, Gemini is only partly open, and Libra remains a roadmap promise that still needs to be judged as future capacity rather than current deliverable.'
