- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - QuEra solution
  - measurable benefit
  - limitation
  rows:
  - - Run analog simulation or optimization experiments
    - Model the problem as a geometry plus analog control schedule, validate with emulation, then submit hardware runs
    - Aquila on Braket with Bloqade-assisted prototyping
    - Publicly available hardware path today with programmable layouts and documented AHS workflow
    - Analog mode is powerful but not universally gate-based or turnkey for every workload
  - - Prototype digital or logical-QEC circuits
    - Develop circuits, decoders, and logical workflows largely in software before scarce hardware time
    - Gemini positioning plus Bloqade digital and Tsim tooling
    - Lets teams prepare digital and QEC workflows before full FTQC hardware is broadly available
    - Public Gemini hardware access and documentation remain limited
  - - Integrate quantum into an HPC or AI environment
    - Attach QPU workflows to existing schedulers, data pipelines, and accelerator-rich compute clusters
    - On-prem installations, ABCI-Q deployment, NVAQC, and SC25-style hybrid demonstrations
    - Supports low-latency hybrid experiments and sovereign or facility-local workflows
    - Evidence is still pilot and engineering focused rather than scaled production operations
  - - Keep sensitive research inside a controlled perimeter
    - Run quantum work locally with internal access rules instead of a shared public queue
    - On-prem package with secure local execution and tailored integration
    - Improves data control and scheduling authority for government or industrial users
    - Security assurances are described at a high level, without public third-party certifications
  - - Accelerate workload discovery and algorithm fit
    - Jointly refine use cases, tune hardware mappings, and assess future scale-up potential
    - Application co-design and Premium Access
    - Higher-touch support can reduce wasted hardware cycles and build internal capability faster
    - Commercial terms and repeatability across customers are not publicly transparent
  - - Access QuEra systems through external research programs
    - Apply through an institutionally mediated call rather than direct procurement
    - NERSC QCAN and partner-platform programs such as Classiq
    - Broadens reach beyond direct enterprise sales and creates independent research proof points
    - Program access is episodic and scoped, not equivalent to general commercial availability
  notes: Benefits are limited to what public docs and partner programs explicitly support today; they should not be read as proof of broad production deployment.
