- id: trust-quality-and-dependency-risks
  title: Trust, quality, compliance, and dependency risks
  body: 'QuEra''s trust surface is strongest where physics and system performance have already been forced into the open. Independent papers and accompanying company releases document 48 logical qubits, 99.5%-class two-qubit gate fidelity, and logical-level magic-state distillation, while Tsim and the NVIDIA decoder collaboration show that QuEra is investing in the software and decoding layers that fault tolerance will need. Those are meaningful quality signals. They are not, however, the same thing as enterprise operating maturity. Public product pages mention flexible SLAs, secure local execution, and managed support, but they do not publish uptime targets, response times, pricing, SOC 2, ISO 27001, or a public status surface. Gemini''s public documentation is also thinner than Aquila''s AWS-backed analog docs, which makes the digital line harder to diligence. The critical dependency map is therefore mixed: QuEra must keep improving laser and tweezer control, Rydberg-gate fidelity, zoned
    shuttling, decoders, and hybrid orchestration, while simultaneously professionalizing service operations. That combination makes the company technically differentiated and commercially interesting, but it also means a buyer should underwrite security, reliability, and support through direct diligence rather than assuming the research milestones already prove product readiness.'
