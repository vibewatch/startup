  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Signed enterprise contracts or anonymized quotes showing realized QuEra, IonQ, Quantinuum, IBM, and D-Wave pricing after discounts, support bundles, and commitment terms.
    whyItMatters: Public rate cards exist only for parts of the field, so price-to-value comparisons are materially weaker than feature and access comparisons.
    diligencePath: Request current quotes, SOWs, and recent invoices from at least three competitive evaluations that included QuEra and one incumbent or trapped-ion rival.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Recent win/loss data showing how often QuEra beats IBM, IonQ, Quantinuum, D-Wave, or brokered cloud alternatives by workload and customer segment.
    whyItMatters: Without actual conversion and churn evidence, moat durability remains an informed judgment rather than an underwritten fact.
    diligencePath: Ask management for the last 12 months of competitive opportunities, lost-deal reasons, and renewal saves segmented by cloud-only, premium direct, and on-prem routes.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: workload-portability
    missingEvidence: A buyer-level benchmark that ports the same optimization or simulation workflow across QuEra, IonQ, Quantinuum, IBM, Rigetti, and D-Wave with measured queueing, cost, and outcome quality.
    whyItMatters: Switching-cost analysis is weaker when public evidence shows access and tooling, but not same-workload comparability across modalities.
    diligencePath: Run a controlled bake-off on one analog simulation workload and one optimization workload using retained marketplace and direct-access routes.
    relatedQuestionRefs:
    - QP018
    - QP020
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: neutral-atom-peer-economics
    missingEvidence: Consistent public data on Atom and Pasqal customer counts, recurring revenue, and realized deployment scale beyond self-reported financing and use-case counts.
    whyItMatters: QuEra's direct peer risk depends not just on physics parity but on whether those neutral-atom rivals are converting their momentum into recurring commercial traction.
    diligencePath: Pull private-market databases, customer references, or procurement records for Atom and Pasqal to test whether direct peer crowding is translating into real buying pressure.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
