- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Neutral-atom architecture plus room-temperature/HPC fit
    - Direct peer crowding from Atom and Pasqal plus better-capitalized trapped-ion and superconducting rivals
    - High
    - Atom and Pasqal are scaling hardware, cloud access, and financing while IBM, IonQ, and Quantinuum offer broader enterprise surfaces
    - Ask for current win rates by workload against Atom, Pasqal, IonQ, Quantinuum, and IBM
  - - Public Braket pricing and multi-route access make QuEra easier to evaluate
    - IBM and Azure-linked rivals still expose broader plan ladders or brokered comparison surfaces
    - High
    - IBM publishes a full ladder, Azure publishes IonQ/Quantinuum/Rigetti plans, and Braket keeps multi-vendor comparison easy
    - Request funnel conversion by channel and evidence that public transparency improves close rates
  - - On-prem and premium direct access can raise switching costs after deployment
    - Rivals including IBM, IonQ, Quantinuum, Rigetti, and D-Wave also sell dedicated or on-prem routes
    - Medium
    - Dedicated deployment is becoming table stakes for enterprise trust, not a QuEra-only wedge
    - Request reference customers, deployment timelines, and renewal evidence for on-prem programs
  - - Logical-qubit roadmap differentiates QuEra from pure experimentation stories
    - Google, IonQ, Quantinuum, and the whole category are making competing FTQC claims while third-party skepticism stays high
    - High
    - Willow, IonQ’s 2026 logical target, and IEEE’s skepticism all bound how much roadmap value buyers should underwrite
    - Demand independent milestone criteria tied to customer-usable workloads, not just internal roadmap labels
  - - Useful workloads can justify premium pricing before full FTQC
    - D-Wave and hybrid AI/HPC substitutes can satisfy near-term optimization or simulation needs without QuEra-specific lock-in
    - Medium
    - Leap, hybrid solvers, and CUDA-Q strengthen the status-quo alternative of delaying a dedicated hardware decision
    - Benchmark the exact workloads where QuEra beats hybrid classical baselines on time-to-solution or result quality
  notes: Severity rates the risk to QuEra’s pricing power and shortlist position, not the probability that quantum computing as a category fails; the register emphasizes the threats that most directly weaken differentiation durability in 2026 buying cycles.
