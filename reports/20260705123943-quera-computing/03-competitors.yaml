tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / alternative
  - Category
  - Scale / funding signal
  - Target buyer
  - Product / access scope
  - Differentiation and limitation
  rows:
  - - QuEra Computing
    - Direct neutral-atom competitor
    - '>$230M financing in 2025; cloud plus on-prem access'
    - Research labs, HPC centers, government programs, enterprises exploring simulation/optimization/ML
    - Aquila on AWS Braket, premium direct access, and on-prem neutral-atom systems
    - Differentiates on room-temperature neutral-atom hardware, analog simulation, and logical-qubit roadmap; limited by smaller ecosystem and channel reach than IBM/IonQ/Quantinuum
  - - Atom Computing
    - Direct neutral-atom competitor
    - 1,200+ fully-connected qubits and $300M+ raise announced in 2026
    - Organizations pursuing large gate-based neutral-atom systems and logical-qubit programs
    - Direct neutral-atom systems and Microsoft-linked supercomputer path
    - Strong scale signal inside the same modality; public commercialization proof and pricing are still thin
  - - Pasqal
    - Direct neutral-atom competitor
    - Expected financing of at least €340M ahead of public listing
    - Industrial optimization, finance, HPC, and cloud buyers
    - Pasqal Cloud, on-prem systems, Google Cloud, and Azure routes
    - Strong industrial and cloud posture; exact economics and fault-tolerant maturity are still evolving
  - - IBM Quantum
    - Incumbent universal hardware platform
    - 30+ systems above 100 qubits, 2,300+ available qubits, 97% uptime
    - Enterprise, HPC, research institutions, and on-prem buyers
    - Open, pay-as-you-go, flex, premium, and on-prem plans via IBM Quantum Platform
    - Most transparent enterprise packaging and broadest fleet; cryogenic superconducting stack and error-correction overhead remain real constraints
  - - Google Quantum AI
    - Incumbent R&D rival
    - Alphabet-backed Willow program with 105-qubit benchmark result
    - Elite research collaborators and flagship scientific partners
    - Selective Willow Early Access plus Cirq software ecosystem
    - High ecosystem gravity and strong technical brand; weak near-term procurement surface because access is not public
  - - IonQ
    - Commercial trapped-ion rival
    - Public company with $64.7M Q1 2026 revenue and aggressive 2026-2030 roadmap
    - Enterprise, government, cloud, and data-center operators
    - Direct cloud, reservations, major SDK support, and Forte Enterprise on-prem systems
    - Very strong commercial overlap and channel breadth; roadmap ambition is ahead of current 36-qubit product scale
  - - Quantinuum
    - Commercial trapped-ion rival
    - Honeywell-backed Helios platform with Azure and direct subscriptions
    - Enterprise, government, pharma, finance, and advanced R&D buyers
    - Direct subscriptions, cloud service, Azure distribution, and on-prem Helios access
    - High-fidelity full-stack offer with public brokered pricing; enterprise-heavy economics may slow broader experimentation
  - - PsiQuantum
    - Photonic long-horizon rival
    - Government-backed Chicago and Australia utility-scale buildouts
    - Sovereign, strategic, and long-horizon enterprise buyers
    - No broad public compute today; platform and software story aimed at utility-scale FTQC
    - Deep manufacturing thesis and capital intensity make it strategically important; limited immediate buyer accessibility
  - - Rigetti
    - Superconducting challenger
    - Full-stack Fab-1 manufacturer with 108Q cloud system history and Novera product
    - Research, government, HPC-linked labs, hardware testbeds
    - Hybrid cloud services plus immediately shippable 9-qubit on-prem Novera QPU
    - Appeals to buyers needing hardware control and low-latency hybrid workflows; smaller commercial scale than IBM or trapped-ion leaders
  - - D-Wave
    - Adjacent / substitute
    - $20M FAU system agreement and production-grade Leap service
    - Optimization-heavy enterprises, public sector, logistics, manufacturing
    - Leap quantum cloud, hybrid solvers, on-prem Advantage2 systems, and gate-model R&D
    - Most operations-ready substitute for optimization jobs today; not a like-for-like universal gate-model competitor
  - - AWS / Azure brokers + hybrid HPC status quo
    - Cloud-broker and internal-build substitute
    - Hyperscaler distribution plus pay-as-you-go marketplace and classical GPU estate
    - Exploratory buyers, platform teams, and budget owners trying to defer hardware commitment
    - Brokered access to multiple QPUs plus hybrid development stacks such as CUDA-Q
    - Easiest way to multi-home and compare vendors; does not remove modality-specific performance differences
  notes: Rows cover the direct neutral-atom peers, incumbent universal-hardware platforms, adjacent substitutes, and brokered status-quo routes that a 2026 buyer can realistically compare against QuEra; scale signals mix financing, fleet, and commercialization evidence rather than a single normalized metric.
  enumerationScope:
    coverage: partial
    basis: The table covers the most decision-relevant named rivals and substitute routes evidenced by retained 2026 sources, rather than every quantum startup or academic architecture in the market.
