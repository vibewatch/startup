company:
  name: QuEra Computing
chapter:
  number: 3
  title: Competitors
  summary: 'QuEra enters the 2026 competitor set from a stronger-than-average neutral-atom position: it has public AWS Braket pricing, premium direct access, on-prem HPC deployment, and a roadmap centered on logical qubits and room-temperature systems. But the field around it is crowded and asymmetrical. IBM and Google set the incumbent bar on ecosystem depth, IonQ and Quantinuum are farther along on enterprise procurement surfaces, direct neutral-atom peers Atom and Pasqal are scaling quickly, and cloud brokers plus hybrid-HPC substitutes keep buyer switching costs moderate rather than high.'
sections:
- id: landscape-and-solution-classes
  title: Landscape and Solution Classes
  body: 'QuEra is not competing in a single tidy peer group. The direct peer set is the neutral-atom cohort, where Atom Computing and Pasqal are also selling the same promise of scalable, gate-based or hybrid neutral-atom systems. The incumbent reference set is broader and better capitalized: IBM Quantum and Google Quantum AI in superconducting systems, IonQ and Quantinuum in trapped ions, PsiQuantum in photonics, and Rigetti as a smaller superconducting full-stack challenger. D-Wave is not a like-for-like universal gate-model rival, but it is a real substitute for optimization-heavy buyers who care more about production workflows today than about which architecture ultimately wins fault tolerance. A second substitute layer sits above the hardware vendors altogether. AWS Braket and Azure Quantum aggregate multiple backends behind one procurement surface, while hybrid AI/HPC platforms such as NVIDIA CUDA-Q let teams defer a hard hardware commitment. That means QuEra has to beat direct modality
    peers, broader universal-hardware alternatives, and the default choice to keep experimenting through cloud brokers or classical-quantum hybrid stacks rather than standardizing on one hardware vendor.'
