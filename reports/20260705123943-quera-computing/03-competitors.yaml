- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider / route
  - Public pricing signal
  - Contract model
  - Included capabilities
  - Unknowns / caveat
  - Buyer implication
  rows:
  - - QuEra / Amazon Braket
    - $0.30 per task, $0.01 per shot, $2,500 per reserved hour
    - Pay-as-you-go on Braket plus premium direct access and separate on-prem discussions
    - Aquila analog simulation, optimization, ML experimentation, direct support through premium access
    - Direct enterprise discounting and realized premium-access economics are not public
    - One of the easiest neutral-atom offers to price, which lowers evaluation friction
  - - IBM Quantum
    - Free Open plan; $96/minute PAYG; $72/minute Flex; $48/minute Premium; on-prem quote only
    - Self-serve entry plus contract plans and dedicated on-prem service
    - Quantum compute access, Qiskit Runtime, platform tooling, and optional accelerator services
    - Actual enterprise discounts and on-prem pricing are private
    - Best-in-class packaging transparency and fastest procurement clarity in the set
  - - IonQ / Azure and direct cloud
    - Azure publishes gate-shot pricing and minimum execution charges; direct pricing remains quote-led
    - On-demand, reservations, direct cloud, and Forte Enterprise deployment
    - Multiple SDKs, simulators, direct support, and rack-based enterprise hardware
    - Non-Azure direct terms and reserved-capacity discounts are not public
    - Strong overlap with QuEra for buyers who want live access plus an enterprise path
  - - Quantinuum / Azure and direct subscription
    - Azure Standard $125,000/month and Premium $175,000/month for H2 access
    - Monthly subscription, queued access, direct cloud, and on-prem Helios availability
    - H2 hardware, emulators, software stack, Azure procurement option
    - Direct non-Azure pricing, negotiated discounts, and utilization economics are private
    - Enterprise-ready but expensive enough to narrow the buyer set
  - - Rigetti / Azure or Novera
    - Azure time-based billing and direct hardware sale signals; no broad public cloud list card from Rigetti retained here
    - Pay-as-you-go for brokered runtime and direct purchase for Novera
    - Hybrid cloud access, on-prem 9-qubit QPU, deep hardware control
    - Real cost to scale from Novera into broader production programs is still opaque
    - Appeals to labs that care more about control and integration than turnkey managed access
  - - Google Willow
    - No public price signal retained
    - Proposal-gated early access for selected research partners
    - State-of-the-art hardware access for accepted proposals plus Cirq ecosystem
    - Commercial terms, volumes, and future catalog plans are unknown
    - Competitive threat is strategic and ecosystem-driven rather than immediate on price
  - - D-Wave Leap / Advantage2
    - No simple public rate card on retained D-Wave pages
    - Cloud access, hybrid solvers, and on-prem system purchase
    - Annealing systems, hybrid solvers, and enterprise-grade uptime/security posture
    - Exact commercial list pricing is private even though system sales are publicly referenced
    - Substitute route for buyers who need operational quantum workflows today
  - - Brokered cloud / hybrid-HPC status quo
    - Transparent metering through hyperscaler or GPU consumption, but hidden people cost
    - Marketplace usage plus internal engineering time
    - Multi-vendor experimentation, simulation, hybrid workflows, and deferred hardware commitment
    - Engineering burden and workload-portability limits are rarely visible in the list price
    - Sets the practical price floor under any dedicated hardware vendor
  notes: The table separates explicit public rate cards from contract-led or unknown economics; because most quantum hardware vendors still negotiate terms privately, unsupported cells are left as unknown or quote-led rather than normalized into false apples-to-apples comparisons.
