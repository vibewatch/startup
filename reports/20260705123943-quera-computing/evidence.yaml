evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A priced equity round, conversion formula, or valuation cap/discount for the 2025 convertible financing and its
      NVentures expansion.
    whyItMatters: >-
      Without conversion economics, investors cannot know the true valuation benchmark, dilution risk, or whether the
      2025 financing implied a clean up-round.
    diligencePath: >-
      Request the note purchase agreement, conversion mechanics, any valuation cap or discount, and the post-expansion
      cap table.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: >-
      A current revenue bridge or ARR disclosure that distinguishes recurring cloud or support revenue from
      milestone-heavy system or services revenue.
    whyItMatters: >-
      Revenue quality is central to judging whether QuEra is building repeatable software-plus-hardware economics or
      still living off a small number of bespoke deals.
    diligencePath: >-
      Ask management for monthly recurring revenue, FY2025 and trailing-12-month revenue breakdowns, gross margin by
      line, and top-customer concentration.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      A current company-wide headcount by function and geography rather than a dated partial count of scientists and
      engineers.
    whyItMatters: >-
      Headcount reveals operating burn, hiring intensity, manufacturing readiness, and the true scale of QuEra’s global
      footprint.
    diligencePath: Request a current org chart, employee count by department and site, and a 12-month hiring or attrition summary.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full public board roster with committee assignments, independence markers, and biographies for all directors.
    whyItMatters: >-
      Governance rights, investor control, and decision authority cannot be judged from one named board member and a
      CEO-transition press release alone.
    diligencePath: >-
      Request the current board list, committee charter documents, observer rights, and any shareholder agreement
      sections covering protective provisions.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Exact ownership percentages, liquidation preferences, board rights, and side-letter terms for named investors and
      strategic partners.
    whyItMatters: >-
      The stakeholder map identifies who matters, but not how economics and control are actually allocated across the
      cap table and partnership stack.
    diligencePath: >-
      Review the current cap table, SAFEs or notes, preferred-stock terms, board rights, and any commercial side letters
      with AWS, NVIDIA, or AIST-linked entities.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      A complete public chronology for every government-program selection, contract close date, and internal
      system-generation milestone.
    whyItMatters: >-
      The chronology is sufficient for a company overview, but later diligence will want a cleaner linkage between
      scientific milestones, contract wins, and financing events.
    diligencePath: >-
      Build a management-verified timeline that reconciles internal product milestones, government-program gates, and
      customer contract dates.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: neutral-atom-market-sizing
    missingEvidence: A public neutral-atom-specific TAM or SAM model with segment-level spend, pricing assumptions, and modality share.
    whyItMatters: >-
      Without a modality-specific spend model, QuEra’s TAM and SAM can only be bounded indirectly through broader
      quantum-computing and buyer-budget lenses.
    diligencePath: >-
      Request QuEra board materials or investor decks showing segment revenue assumptions, average contract values, and
      modality share versus the broader quantum-computing market.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: deployment-roi
    missingEvidence: >-
      Published pricing, utilization, maintenance, and integration-cost data for cloud and on-prem QuEra deployments
      relative to classical HPC alternatives.
    whyItMatters: >-
      Buyer conversion depends on ROI and payback periods, but public sources do not disclose the cost stack needed to
      test adoption economics.
    diligencePath: >-
      Ask for AIST or enterprise pilot commercial terms, gross-margin assumptions, and benchmark studies against
      classical HPC workflows.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
      - TM004
  - type: missing-source
    severity: material
    topic: finance-customer-proof
    missingEvidence: >-
      A named QuEra financial-services customer or production workflow with budget owner, contract type, and deployment
      stage.
    whyItMatters: >-
      Finance appears strategically attractive, but without customer proof it should not be underwritten as a
      demonstrated current revenue vertical.
    diligencePath: >-
      Request a customer reference, signed pilot, or paid design-partner evidence for a finance workflow on Aquila,
      Gemini, or Libra-readiness programs.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: fault-tolerance-timeline
    missingEvidence: >-
      An independent technical review that reconciles QuEra and AWS’s 2028 Libra timetable with BCG’s view that
      full-scale fault tolerance arrives after 2040.
    whyItMatters: >-
      Timeline risk is the central market and valuation variable; contradictory public views materially change how much
      of the long-run market should be capitalized today.
    diligencePath: >-
      Commission an external architecture review using QuEra milestone data, hardware roadmaps, and benchmark
      assumptions to test whether 2028 is a realistic first-useful date or an aggressive outlier.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Signed enterprise contracts or anonymized quotes showing realized QuEra, IonQ, Quantinuum, IBM, and D-Wave pricing
      after discounts, support bundles, and commitment terms.
    whyItMatters: >-
      Public rate cards exist only for parts of the field, so price-to-value comparisons are materially weaker than
      feature and access comparisons.
    diligencePath: >-
      Request current quotes, SOWs, and recent invoices from at least three competitive evaluations that included QuEra
      and one incumbent or trapped-ion rival.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Recent win/loss data showing how often QuEra beats IBM, IonQ, Quantinuum, D-Wave, or brokered cloud alternatives
      by workload and customer segment.
    whyItMatters: >-
      Without actual conversion and churn evidence, moat durability remains an informed judgment rather than an
      underwritten fact.
    diligencePath: >-
      Ask management for the last 12 months of competitive opportunities, lost-deal reasons, and renewal saves segmented
      by cloud-only, premium direct, and on-prem routes.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
