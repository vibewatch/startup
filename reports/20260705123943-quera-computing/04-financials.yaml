callouts:
  - calloutType: risk
    title: Revenue quality may still be event-driven
    body: >-
      One independently reported Japan system sale is roughly the same size as LATKA's entire 2025
      revenue estimate, so a small number of hardware or project events could still dominate annual
      results.
    claimRefs:
      - CI007
      - CI019
      - CI042
  - calloutType: insight
    title: Cloud access improves reach, not financial visibility
    body: >-
      AWS makes the consumption mechanics legible, but public materials still do not show QuEra's
      device rates, discounts, or net payout economics, and IonQ's filing warns that the platform
      provider can be the actual contractual customer.
    claimRefs:
      - CI016
      - CI017
      - CI037
      - CI043
  - calloutType: recommendation
    title: Treat the capital raised as bridge capital, not independence proof
    body: >-
      The 2025 financing and sponsored programmes clearly buy QuEra time, but investors still need a
      private operating pack that closes stream-mix, margin, concentration, and runway gaps before
      they can underwrite the business on fundamentals.
    claimRefs:
      - CI001
      - CI004
      - CI030
      - CI032
      - CI043
