  - id: cost-structure-and-capital-intensity
    title: Cost Structure, Unit Economics, and Capital Intensity
    body: >-
      Cost structure is easier to bound qualitatively than numerically. QuEra is spending on
      fault-tolerance R&D, build/test capacity, HPC integration, and manufacturing supply chains
      rather than simply shipping software seats. The AWS-NVIDIA evidence chain matters here: QuEra
      is training AI decoders, coupling hardware to GB200 clusters, and operating in hybrid
      environments next to thousands of H100 GPUs. Roadrunner adds another clue, with photonics
      labs, racks, networking, and remote-access infrastructure, while QuEra's 2025 recap says NEDO
      is helping build optical and vacuum component supply chains. Those are classic
      capital-intensity markers. The company also argues that neutral atoms offer room-temperature,
      low-power advantages, which could help long-run service economics relative to cryogenic
      modalities, but QuEra does not publish any dollar benefit, service cost, or stream-level gross
      margin. Public peer filings are the closest numeric proxy: Quantinuum, IonQ, D-Wave, and
      Rigetti each show tens of millions of revenue against very large R&D budgets or cash burn.
      That sector pattern suggests QuEra's missing margin disclosures are not a side issue; they are
      the main underwriting issue.
