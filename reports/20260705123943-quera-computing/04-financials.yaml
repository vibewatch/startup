company:
  name: QuEra Computing
chapter:
  number: 4
  title: Financials
  summary: >-
    QuEra has clear commercial surfaces—on-premises systems, Amazon Braket access,
    premium/direct access, and application co-design—but public data remain too thin to underwrite
    realized economics. Third-party revenue estimates of roughly $39.9 million in 2025 versus
    $6.3 million in 2023, plus one independently reported ~$41 million Japan system sale, suggest
    real traction but also potential event-driven lumpiness. The 2025 financing meaningfully extends
    development, yet the business still looks capital-intensive and financing-dependent because public
    sources omit mix, margin, cash, burn, and runway.
sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing Reality
    body: >-
      QuEra clearly is not a pure research lab anymore. Official surfaces show four monetization
      lanes: direct system delivery, cloud access via Amazon Braket, premium/direct access outside
      the marketplace, and application co-design or collaborative-research engagements. The best
      public top-line signal remains third-party: LATKA lists $39.9 million of 2025 revenue versus
      $6.3 million in 2023, while QuEra's own 2025 recap says the company delivered record revenues
      and cash collections from product and service deliveries. What remains missing is the mix. AWS
      and QuEra show how customers can buy access, but not what QuEra actually realizes after
      marketplace economics, support obligations, or discounts. The hardware leg matters because
      TechCrunch independently reported roughly a $41 million Japan sale, the same order of magnitude
      as the entire 2025 revenue estimate. That makes revenue quality potentially lumpy even if cloud
      usage is growing. Comparable public filings from D-Wave and IonQ show why this matters: hybrid
      quantum vendors often recognize cloud, services, and system sales on different schedules, yet
      QuEra's own revenue-recognition policy and backlog are private.
    claimRefs:
      - CI003
      - CI007
      - CI008
