  - id: public-traction-and-capital-adequacy
    title: Public Traction, Capital Adequacy, and Financing Dependency
    body: >-
      Traction is real but public financial visibility is still patchy. QuEra can point to record
      2025 revenue and cash collections, a first on-premises HPC deployment at AIST, a UK testbed
      award, U.S. federal contract history, Stage B DARPA support, and a 2026 Roadrunner testbed
      buildout. Those signals prove commercial demand and government relevance. Capital availability
      is also meaningful: more than $230 million was announced in February 2025, with an additional
      strategic investment in September, and QuEra says that capital is being used to scale
      manufacturing, hiring, and fault-tolerant development. But capital adequacy is still not
      publicly underwritable because the note structure obscures valuation precision, $60 million
      remained conditional at announcement, and neither cash on hand nor burn is disclosed. The
      closest honest answer is that QuEra looks better funded than many private peers, yet still
      dependent on external capital until management proves that cloud, services, and hardware can
      convert into durable margins rather than milestone-driven revenue bursts.
