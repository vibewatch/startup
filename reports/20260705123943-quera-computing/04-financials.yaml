  evidenceGaps:
    - type: missing-source
      severity: material
      topic: realized-pricing-and-recognition
      missingEvidence: QuEra-specific price books, discount schedules, contract minimums, and revenue-recognition memo by stream.
      whyItMatters: >-
        Without realized pricing and recognition rules, investors cannot separate recurring cloud
        economics from milestone-heavy hardware or services revenue.
      diligencePath: >-
        Request top contracts, AWS settlement reports, direct-channel price book, and accounting
        policy memo under NDA.
      relatedQuestionRefs:
        - QI003
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: material
      topic: aws-channel-economics
      missingEvidence: Marketplace take rates, vendor payout timing, reserved-capacity economics, and direct-versus-marketplace mix.
      whyItMatters: >-
        Braket list mechanics do not reveal QuEra's realized revenue or margin, so cloud economics
        cannot be underwritten from public pages alone.
      diligencePath: >-
        Request AWS payout statements, partner agreements, and cohort-level usage-to-revenue bridge.
      relatedQuestionRefs:
        - QI010
      relatedTableRefs:
        - TI002
    - type: private-evidence-only
      severity: blocking
      topic: sales-efficiency-metrics
      missingEvidence: CAC, payback, win rate, cohort renewals, NRR, and pilot-to-production conversion by segment.
      whyItMatters: >-
        GTM quality cannot be judged from cloud availability and named programmes alone; investors
        need efficiency metrics to test repeatability.
      diligencePath: >-
        Request board KPI pack, CRM funnel snapshots, and cohort retention analysis by enterprise,
        government, and HPC segment.
      relatedQuestionRefs:
        - QI011
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-and-runway
      missingEvidence: Current cash balance, monthly burn, capex plan, debt schedule, and note-conversion terms.
      whyItMatters: >-
        Public funding headlines are not enough to establish capital adequacy or next-round timing.
      diligencePath: >-
        Request monthly cash waterfall, latest balance sheet, 24-month operating plan, and note
        documents.
      relatedQuestionRefs:
        - QI020
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: valuation-and-note-terms
      missingEvidence: Board marks, note cap/discount, conversion triggers, and investor side letters for the 2025 financing.
      whyItMatters: >-
        The $1B valuation is widely repeated but remains weaker than a disclosed priced round; note
        terms determine true dilution and next-round pressure.
      diligencePath: >-
        Request note purchase agreement, cap table bridge, and valuation materials used with the
        board or lead investors.
      relatedQuestionRefs:
        - QI019
      relatedTableRefs:
        - TI004
        - TI005
    - type: enumeration-incomplete
      severity: material
      topic: underwriting-pack-gaps
      missingEvidence: A management pack covering revenue mix, margins, concentration, backlog, cash, burn, capex, and renewal metrics.
      whyItMatters: >-
        The public record proves commercial activity, but not the private metric set required to
        convert that activity into an underwriting view.
      diligencePath: >-
        Open a finance data room with monthly KPI history, stream-level P&L, customer concentration
        schedule, and forward plan.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI001
        - TI003
        - TI004
        - TI005
