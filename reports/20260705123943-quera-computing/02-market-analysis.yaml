- id: buyers-and-adoption-path
  title: Buyer, user, payer, and adoption path by segment
  body: |-
    QuEra’s buyer map is more segmented than a generic “enterprise quantum” story suggests. The strongest current buyer class is government and national-lab infrastructure, where the payer is a sovereign or research-program budget, the users are computational scientists or platform teams, and the adoption trigger is a national capability goal rather than a one-year enterprise ROI hurdle. That is why AIST, NERSC, and ICSC matter so much more than a generic market-survey data point. The second layer is enterprise co-design: BCG X and Deloitte both position QuEra as a partner for enterprises, governments, and HPC centers that need use-case discovery, benchmark design, and integration planning before they buy large amounts of hardware time. Within that enterprise layer, pharma and life sciences are more credible than finance today because QuEra has public biology and drug-discovery programs, while finance is still mostly visible through industry research programs and hybrid pilots outside QuEra. Materials, chemicals, and energy are also structurally important because simulation is the most tangible near-term use case cluster across QED-C, McKinsey, AWS, and Pawsey. Finance remains a long-run target because the value pool is large and banks are active learners, but both QuEra’s own survey and public bank evidence imply it is later to scale: financial institutions want secure hybrid environments, quantum-safe migration plans, and stronger proof of utility before they become repeat buyers. That means QuEra’s adoption path is cloud exploration first, co-design second, sovereign or lab anchor deployments third, and only then broader enterprise production workloads.
