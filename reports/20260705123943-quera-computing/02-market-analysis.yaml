- id: contradictions-and-gaps
  title: Contradictions, unresolved questions, and what still needs diligence
  body: |-
    The chapter’s two biggest contradictions should be preserved, not averaged away. The first is market-size framing: near-term revenue lenses cluster in the low single-digit billions, yet long-run value-pool estimates jump into the tens or hundreds of billions depending on whether the source is measuring provider revenue, industry value created, or a broader quantum-technology umbrella. The second is timeline: QuEra and AWS present 2028 as the start of cloud-accessible fault-tolerant workflows, while BCG still places full-scale fault tolerance after 2040. Those views cannot both be treated as base case without additional diligence. There are also important absences. Public evidence does not isolate a neutral-atom-specific SAM, does not disclose QuEra’s pricing or deployment economics, and does not verify a named QuEra finance customer beyond general industry experimentation. Those omissions matter because QuEra’s valuation hinges less on whether quantum is a large category in the abstract and more on whether QuEra can convert a small set of anchor channels into repeatable commercial contracts before classical alternatives keep improving. The practical diligence path is therefore to request vertical revenue mix, pricing and utilization assumptions, named design-partner evidence in finance, and an external technical review of the Libra timetable. Until those are available, the market case should be viewed as strong on strategic direction, strongest in government and HPC, and still incomplete on enterprise conversion economics.
