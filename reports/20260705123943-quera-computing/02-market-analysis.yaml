- id: FM004
  title: Adoption path from access to production
  type: flow
  layout: standard
  summary: The public buyer journey starts with cloud access and co-design, then moves into sovereign or lab anchor deployments before broader fault-tolerant workloads.
  data:
    nodes:
    - id: cloud-access
      label: Cloud access
      detail: Aquila on Braket or premium access establishes first contact and benchmark workflows.
    - id: co-design
      label: Co-design / mentoring
      detail: BCG X, Deloitte, QuEra scientists, and partner programs shape use cases and integration plans.
    - id: research-testbed
      label: Research or sovereign testbed
      detail: NERSC, ICSC, Pawsey, or AIST-like programs provide funded environments for deeper proof.
    - id: on-prem-anchor
      label: On-prem anchor deployment
      detail: AIST-style installations validate hybrid HPC and customer-specific operations.
    - id: fault-tolerant-workflows
      label: Fault-tolerant workflows
