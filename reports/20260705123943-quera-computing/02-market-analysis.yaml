  rows:
  - - Neutral-atom quantum hardware and systems
    - Quantum processors, control stack, on-prem installation, integration, support
    - Quantum sensing hardware, quantum networking infrastructure
    - National labs, sovereign programs, research consortia, enterprise design partners
    - Core QuEra market because this is where Aquila, Gemini, and Libra-class systems are sold or provisioned.
  - - Cloud quantum access
    - Braket usage, premium cloud access, mentoring, workflow development, simulation time
    - Generic cloud compute spend unrelated to quantum
    - Researchers, enterprise R&D groups, universities, platform teams
    - Important entry point because QuEra’s current commercialization path starts with access and co-design before full deployments.
  - - Hybrid HPC and quantum integration
    - Colocation, workflow orchestration, classical simulation, training, benchmark design
    - Standalone classical supercomputing unrelated to quantum programs
    - National labs, supercomputing centers, government-backed research hubs
    - Critical because AIST, NERSC, AWS, Pawsey, and ICSC all frame QuEra through hybrid HPC use cases.
  - - Application co-design and services
    - Use-case selection, algorithm development, integration, enterprise readiness work
    - Generic strategy consulting without hardware or workflow tie-in
    - CIO/CTO offices, scientific computing groups, innovation budgets
    - Material because BCG X and Deloitte sell QuEra into enterprises through proof-of-value and roadmap engagements.
  - - Adjacent quantum-security and communications spend
    - Post-quantum readiness workshops, cryptography migration planning, secure networking pilots
    - Direct neutral-atom compute revenue
    - Governments, banks, critical infrastructure operators
    - Creates urgency and adjacent budgets, but most of this spend does not translate directly into QuEra revenue.
  - - Status-quo substitute stack
    - Classical HPC, GPU AI, classical optimization, quantum-inspired software
    - N/A
    - Existing IT, R&D, or operations budgets
    - This is the real incumbent that QuEra must beat on ROI, trust, and workflow fit rather than just on technical novelty.
  notes: Included spend is QuEra-specific and limited to neutral-atom compute, hybrid deployment, and co-design channels; excluded categories are adjacency or substitute markets rather than QuEra TAM.
