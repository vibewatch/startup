- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for QuEra
  - Diligence ask
  rows:
  - - Sovereign quantum funding and testbeds
    - Tailwind
    - Active now through 2030+
    - Keeps near-term demand alive even before broad enterprise ROI is proven; best fit with QuEra’s public proof set.
    - Map QuEra pipeline by sovereign program, not just by total TAM narrative.
  - - Post-quantum cryptography and security deadlines
    - Tailwind
    - 2026-2035 migration window
    - Creates urgency for quantum-readiness budgets and secure infrastructure planning, especially in government and finance.
    - Separate adjacent PQC budgets from direct hardware conversion assumptions.
  - - Simulation-first use-case concentration
    - Tailwind
    - Near-term
    - Chemistry, materials, and biology align with QuEra’s neutral-atom strengths and public partner set.
    - Request benchmark evidence that links QuEra hardware to a buyer KPI rather than only technical feasibility.
  - - Hybrid HPC and cloud integration
    - Tailwind
    - Near-term to medium-term
    - AWS, AIST, NERSC, Pawsey, and ICSC make QuEra easier to buy as part of an existing compute stack.
    - Test whether hybrid workflow performance and latency are good enough for repeated customer use, not just pilots.
  - - Hardware readiness and timeline uncertainty
    - Headwind
    - Immediate and ongoing
    - If 2028 slips materially, a large fraction of the current bull case gets pushed out while classical alternatives keep improving.
    - Commission an external architecture review of the Libra timetable and milestone dependencies.
  - - Classical AI and HPC competition
    - Headwind
    - Immediate and ongoing
    - QuEra has to beat a moving target, especially in simulation and optimization workloads that AI and GPUs keep improving.
    - Benchmark against named classical baselines rather than generic “intractable” claims.
  - - Talent shortage and supply-chain fragility
    - Headwind
    - Immediate and ongoing
    - Scaling deployments requires scarce quantum, photonics, and systems talent, while specialized components remain supply constrained.
    - Inspect hiring plan, partner dependence, and component bottlenecks for scaling beyond lighthouse projects.
  - - ROI, trust, and procurement discipline
    - Headwind
    - Immediate and ongoing
    - The market has moved to proof-driven purchasing, so buyers increasingly demand validated economics, integrations, and governance before signing.
    - Request pricing, renewal, and conversion data from cloud users, design partners, and on-prem customers.
  notes: Direction is from QuEra’s perspective. Tailwinds increase buyer willingness or funding availability; headwinds raise the proof burden, stretch timelines, or reduce willingness to convert pilots into production contracts.
