chapter:
  number: 2
  title: Market Analysis
  summary: 'QuEra’s market is real but narrower than generic quantum TAM slides suggest: the strongest current demand sits in government, national-lab, and hybrid-HPC channels, while pharma and materials are the most credible enterprise-adjacent expansion paths. Third-party forecasts still range from low-single-digit billions near term to large long-run value pools only if fault tolerance arrives, and the sharpest unresolved issue is whether QuEra’s 2028 Libra timetable proves early or remains an aggressive outlier versus broader market consensus.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: |-
    QuEra should be analyzed inside the quantum-computing hardware-and-services market, but inside that market its practical boundary is narrower than many headline TAM slides imply. The relevant spend is not “all quantum technology,” and it is not even every quantum-computing dollar. QuEra’s addressable layer is neutral-atom quantum capability sold through cloud access, on-prem systems, hybrid HPC integration, and application co-design for buyers who need simulation or optimization workloads that may eventually outrun classical methods. That boundary includes Aquila and future Braket access, the AIST-style on-prem route, and service work tied to algorithm development and integration. It excludes quantum sensing, quantum communications or QKD, and most post-quantum cryptography migration budgets, because those categories can grow rapidly without buying QuEra hardware. The status-quo substitute is therefore not “nothing”; it is classical HPC, GPU-heavy AI simulation, classical optimization software, and quantum-safe software migration. BCG’s caution that quantum still provides no tangible commercial advantage over classical computing today is essential here, because it means QuEra is competing against fast-improving alternatives, not just against other quantum vendors. Neutral atoms remain relevant because AWS, Braket, and QuEra all tie the modality to simulation and optimization tasks where geometry, reconfigurability, and all-to-all-style connectivity matter.
