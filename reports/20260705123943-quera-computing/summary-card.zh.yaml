  topStrengths:
    - 中性原子架构让 QuEra 具备差异化的室温运行、可重构连接性和可信的逻辑量子比特进展。
    - QuEra 已有真实商业化证据：AWS Braket 接入，以及约 $41 million 的 AIST 本地部署系统合同。
    - Google、SoftBank Vision Fund 2、Valor、QVT、Safar、NVentures 等战略支持方，显著改善资本可得性和生态信用。
    - 公司仍受益于异常强的科学创始人-市场匹配，根基是 Harvard 和 MIT 的研究领导力。
    - 2023-2026 年的公开里程碑，比许多私有量子同行给出了更具体的容错和部署路径。
  topRisks:
    - 2025 年 2 月融资被描述为可转债，估值和转换经济性未披露，价格支撑有限。
    - 公开收入证据可能仍主要来自少数灯塔硬件或项目事件，而不是广泛经常性需求。
    - 毛利率、烧钱速度、现金跑道、留存、积压订单和客户集中度仍未披露，限制下行承保。
    - QuEra 的 2028 Libra 路线图和更大规模容错目标，仍有显著执行、供应链和时间表风险。
    - IBM、Google、IonQ、Quantinuum、Rigetti 等资本更充足或披露更多的技术路线，竞争仍很激烈。
  unresolvedGaps:
    - 2025 年融资的确切票据转换机制、清算优先权、反稀释条款和任何优先级。
    - 云、硬件和服务之间的收入结构，以及毛利率、烧钱速度、现金跑道和积压订单转化。
    - 当前客户数量、留存、集中度，以及 AIST 级部署能否在多个买方中重复。
    - 当前公司整体员工数，以及 Boston、New Mexico、Japan、United Kingdom 和 Zurich 各站点人员配置。
