  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Account-level NRR, GRR, churn, renewal timing, and contract-length data across cloud, sovereign, and enterprise segments.
    whyItMatters: Without true retention metrics, it is impossible to distinguish repeat technical engagement from durable recurring revenue.
    diligencePath: Request cohort retention tables and renewal summaries broken out by channel and customer segment.
    relatedQuestionRefs:
    - QU018
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, backlog concentration, and the share of revenue attributable to AIST, AWS-mediated cloud usage, and other sovereign programmes.
    whyItMatters: Public proof is concentrated in a few marquee programmes; without concentration data the downside from one slipped programme cannot be sized.
    diligencePath: Request top-5 customer share, backlog by customer, and annual revenue bridge between cloud, on-prem, and service engagements.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: enterprise-conversion
    missingEvidence: Independent customer references or case studies that show pilots in life sciences, telecom, or other verticals converting into repeat paid production work.
    whyItMatters: Named pilots prove technical relevance but not repeatable enterprise monetization.
    diligencePath: Request reference calls with Merck, Amgen, Cinfo or equivalent users plus renewal or phase-two purchase orders.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU026
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: minor
    topic: finance-proof
    missingEvidence: Named financial-services customers with funded workloads, concrete outcomes, or production-stage adoption.
    whyItMatters: Finance has historically been a headline quantum vertical, but current public proof for QuEra is thin and market data suggests delayed adoption.
    diligencePath: Request named financial-services accounts, funded pilot budgets, and evidence of repeat usage beyond exploratory workshops.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU001
    - TU005
