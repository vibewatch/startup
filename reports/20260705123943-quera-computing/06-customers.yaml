  title: Customer journey map
  type: journey-map
  layout: wide
  summary: QuEra’s visible journey begins with cloud or consultative discovery, deepens through pilot or programme access, and only later expands into installed or multi-party hybrid environments.
  data:
    nodes:
    - id: discover
      label: Discovery
      description: Prospects first encounter QuEra through AWS Braket, consulting partners, or sovereign quantum initiatives.
    - id: prototype
      label: Prototype / Evaluation
      description: Users explore Aquila on Braket, test algorithms, or assess fit through partner-led proof-of-value work.
    - id: secure-pilot
      label: Secure Pilot / Programme Access
      description: Sensitive buyers move into private cloud access, staged national-lab programmes, or industry-specific pilot projects.
    - id: deploy
      label: Deployment
      description: A small set of buyers advance to on-prem or facility-linked deployments such as AIST, NQCC, or Roadrunner.
    - id: expand
      label: Expansion
      description: Relationships can expand through remote access, training, software integration, or follow-on phases.
    - id: future
      label: Fault-Tolerant Readiness
      description: Partners such as AWS, Deloitte, and BCG X prepare users to migrate toward deeper Gemini and Libra-era workflows.
