- id: expansion-and-concentration
  title: Expansion Paths, Concentration Risk, and Procurement Friction
  body: 'Expansion potential is clear, but so are concentration risks. QuEra has multiple land-and-expand loops: AWS lowers first-use friction; Deloitte and BCG X can move corporate accounts from strategy to prototype; on-prem packages can expand from one secure installation into training, software integration, and future upgrades; and sovereign programs can grow from a hardware purchase into broader ecosystem or cloud-access relationships, as AIST already has. The risk is that disclosed value and reference quality remain concentrated in a handful of marquee government and HPC programs. Public enterprise proof is still mostly pilot-heavy, and even the 2026 readiness data says only a small minority of organizations have productive applications at scale. Finance is especially weak as a near-term proof segment, ranking last in commercialization expectations despite years of industry interest. Procurement friction is also real: sovereign buyers increasingly care about sovereignty, NERSC imposes
    publication and export-control constraints, and QuEra’s on-prem motion requires substantial integration work. The customer story is therefore durable enough to matter, but still concentrated, consultative, and vulnerable to long-cycle program timing.'
