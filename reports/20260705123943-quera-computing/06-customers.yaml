- id: retention-and-durability
  title: Retention, Repeat Usage, and Durability Signals
  body: 'Public durability evidence is where the chapter gets materially weaker. QuEra does not disclose NRR, GRR, churn, renewal rates, contract length, or customer satisfaction cohorts, so durability must be inferred from proxies. The strongest proxies are repeat access and stage progression: Braket machine-hour growth and capacity expansion imply returning demand; NERSC’s Stage A and Stage B structure implies a pathway from evaluation to fuller use; AIST moved from hardware contract to memorandum to shared remote-access platform; and Wellcome Leap projects advanced from algorithm work to large-scale simulation and then to hardware execution. These are useful signals, but they are not substitutes for revenue retention. Even the strongest enterprise references remain largely company-curated and do not disclose whether pilots renewed, expanded, or turned into recurring spend. The honest underwriting view is that QuEra has enough public evidence to show that users come back for more access
    and deeper technical engagement, but not enough to quantify economic durability. Until management discloses account-level renewals or customer references speak independently about repeat spend, durability remains plausible rather than proven.'
