- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Covers the publicly named institutions, companies, and programmes with fetched evidence of real use, deployment, or formal access paths; confidential enterprise pilots and undisclosed accounts are necessarily excluded.
  columns:
  - Customer / programme
  - Segment
  - Deployment or use case
  - Production vs pilot
  - Outcome / evidence quality
  - Limitation
  rows:
  - - AIST / ABCI-Q
    - Sovereign HPC buyer
    - On-prem Gemini-class system alongside ABCI-Q for hybrid quantum-classical research in AI, energy, and biology
    - Early production deployment
    - 'Highest-quality proof: disclosed contract value, named site, later operationalization and remote-access expansion'
    - Still effectively one marquee sovereign account, not a diversified installed base
  - - NERSC QCAN
    - National lab user programme
    - Research access to Aquila and Gemini with staged QPU-hour allocations and publication requirements
    - Structured research access
    - Customer-side page names processors, hours, timing, and eligibility rules
    - Not a commercial subscription or unrestricted production environment
  - - NQCC testbed
    - National programme testbed
    - UK neutral-atom testbed for qubit shuttling and error-correction experimentation
    - Testbed / pre-production
    - Customer-side selection plus QuEra shipment evidence validate real hardware commitment
    - Evidence still centers on testbed status, not end-user workload volume
  - - Pawsey Supercomputing Research Centre
    - HPC partner / user
    - Private cloud access, quantum machine time, consulting, and training for hybrid workflows
    - Pilot / programme access
    - Customer-side proof and detailed workflow language exceed a logo mention
    - No public on-site machine or recurring contract value disclosed
  - - Merck / Amgen with Deloitte
    - Life sciences enterprise users
    - Quantum reservoir computing for small-data molecular or clinical-trial prediction
    - Proof-of-concept
    - Named end users plus outcome specificity on small-data performance
    - No production contract, renewal, or deployment-volume disclosure
  - - R / MassOrange via Cinfo
    - Telecommunications operator
    - Optical-network resilience analysis using QuEra neutral-atom hardware via cloud access
    - Pilot with operational problem framing
    - Customer-side write-up names operator, workflow, and qubit usage
    - Scope remains limited and future scaling was deferred to later hardware generations
  - - Roadrunner Quantum Lab
    - Ecosystem and facility partner
    - New Mexico quantum testbed with academic and national-lab users first, later industry collaborators
    - Expansion-stage testbed
    - Named funding commitment, facility plan, and phased user opening
    - Infrastructure launch is forward-looking and not yet proof of mature recurring demand
  notes: Production vs pilot reflects the maturity of publicly evidenced usage, not QuEra’s private internal classification; early production here means a live installed system, not proven recurring economics.
