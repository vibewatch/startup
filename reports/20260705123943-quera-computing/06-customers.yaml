  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - AWS Braket channel
    - Channel gives reach but public economics are opaque
    - Medium
    - Aquila is accessible through Braket accounts and capacity has grown materially
