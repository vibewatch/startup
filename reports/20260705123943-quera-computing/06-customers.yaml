tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Primary use case
  - Strategic value
  - Key gap
  rows:
  - - Cloud-distributed researchers and developers
    - 'Buyer/payer: AWS account holder; user: researchers and quantum developers; platform payer likely AWS-mediated'
    - Amazon Braket / Aquila
    - Analog simulation, optimization, experimentation
    - Lowest-friction global access path and repeat-use signal
    - Public user count, paid-account count, and realized QuEra revenue share are undisclosed
  - - Sovereign and national HPC buyers
    - 'Buyer/payer: government or national lab programme; user: center staff and research teams'
    - AIST, NQCC, NERSC, Roadrunner coalition
    - Hybrid HPC-quantum infrastructure and national capability building
    - Largest disclosed dollars and strongest named infrastructure proof
    - Top-customer revenue concentration and renewal terms are not public
  - - HPC partner institutions
    - 'Buyer/user: supercomputing center leadership and researchers; payer may be center or grant programme'
    - Pawsey, NERSC
    - Private cloud access, training, software integration, co-design
    - Reference accounts that validate hybrid workflows
    - Often framed as pilot, evaluation, or access programme rather than scaled production
  - - Life-sciences and healthcare innovators
    - 'Buyer/user: pharma R&D teams, researchers, quantum specialists; payer often via pilot or joint research budget'
    - Merck, Amgen, Wellcome Leap projects, Quantum Intelligence Corp
    - Small-data molecular prediction and drug-discovery workflows
    - Best enterprise vertical proof today
    - Commercial terms, repeat purchasing, and deployment scope are opaque
  - - Telecom and infrastructure operators
    - 'Buyer/user: network operator and technical partners'
    - R / MassOrange via Cinfo and Kipu Quantum
    - Network resilience optimization
    - Concrete industry workflow with named operator and hardware usage
    - Still proof-of-concept scale, not broad fleet-wide production evidence
  - - Enterprise transformation channels
    - 'Buyer influencer: consulting and innovation teams; user: client quantum programmes; payer: end client project budgets'
    - Deloitte, BCG X
    - Use-case discovery, proof-of-value sprint, prototype-to-production advisory
    - Can widen funnel without QuEra carrying every enterprise sale directly
    - Channel conversion, contract value, and renewal rates are undisclosed
  notes: Segments distinguish direct infrastructure buyers, cloud users, and partner-mediated enterprise pathways; strategic value is inferred from proof quality, disclosed dollars, and role in the customer journey.
