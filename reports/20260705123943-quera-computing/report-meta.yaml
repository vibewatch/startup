  topStrengths:
    - Neutral-atom architecture gives QuEra differentiated room-temperature operation, reconfigurable connectivity, and credible logical-qubit progress.
    - QuEra has real commercialization proof through AWS Braket access and the roughly $41 million AIST on-premises system contract.
    - Strategic backers including Google, SoftBank Vision Fund 2, Valor, QVT, Safar, and NVentures materially improve capital access and ecosystem credibility.
    - The company still benefits from unusually strong scientific founder-market fit anchored in Harvard and MIT research leadership.
    - Public milestones from 2023-2026 show a more concrete fault-tolerance and deployment path than many private quantum peers.
  topRisks:
    - The February 2025 financing was described as a convertible note with undisclosed valuation and undisclosed conversion economics, limiting price support.
    - Public revenue evidence may still be dominated by a small number of lighthouse hardware or project events rather than broad recurring demand.
    - Gross margin, burn, runway, retention, backlog, and customer concentration remain undisclosed, constraining downside underwriting.
    - QuEra's 2028 Libra roadmap and larger fault-tolerant ambitions still carry meaningful execution, supply-chain, and timeline risk.
    - Competition remains intense across better-capitalized or more-disclosed modalities including IBM, Google, IonQ, Quantinuum, and Rigetti.
  unresolvedGaps:
    - Exact note-conversion mechanics, liquidation preferences, anti-dilution, and any seniority attached to the 2025 financing.
    - Revenue mix between cloud, hardware, and services, plus gross margin, burn, cash runway, and backlog conversion.
    - Current customer count, retention, concentration, and whether AIST-class deployments are repeatable across multiple buyers.
    - Current company-wide headcount and site-level staffing across Boston, New Mexico, Japan, the United Kingdom, and Zurich.
