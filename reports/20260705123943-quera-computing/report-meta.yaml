companyProfile:
  summary: >-
    QuEra Computing is a Boston-based neutral-atom quantum computing company founded in 2018 from Harvard and MIT research.
    The company commercializes quantum access through Amazon Braket and premium channels, pursues on-premises deployments
    such as the AIST / ABCI-Q system in Japan, and is aiming to bring its Libra fault-tolerant system to AWS in 2028.
    QuEra announced more than $230 million of financing in February 2025 from Google Quantum AI, SoftBank Vision Fund 2,
    Valor, QVT, Safar, and others, later expanded by NVentures, while current materials identify Andy Ory as CEO and keep
    Mikhail Lukin, Vladan Vuletić, Markus Greiner, and Nathan Gemelke closely tied to the technical roadmap. What remains
    less visible is exact round pricing, cumulative capital after the NVentures top-up, and how much of current revenue is
    recurring versus lighthouse hardware programs.
