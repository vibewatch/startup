      - number: '8.4'
        title: Final Diligence Asks and Thesis-Break Criteria
        blocks:
          - type: paragraph
            body: >-
              The remaining work is mostly financial and commercial diligence, not basic technology awareness. Public
              evidence is now good enough to say QuEra has real strategic capital, at least one meaningful paid hardware
              deployment, and a credible route to fault-tolerant cloud access. It is not good enough to say what a new
              investor actually owns in a downside case, how much capital the company burns to reach the 2028 Libra
              milestone, or how much of 2025 revenue is recurring versus one-off. Those are not cosmetic gaps: they
              determine whether a $1 billion-equivalent entry is cheap option value or just under-disclosed risk. The
              thesis should be treated as broken if QuEra materially slips the 2026-2028 delivery chain, fails to repeat
              the AIST-style win with another named paying customer, or raises the next round flat/down or with punitive
              seniority. Until those conditions clear, the correct stance is to keep diligence warm, insist on price
              discipline, and avoid underwriting upside solely from narrative momentum.
