  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: standard
    summary: >-
      Directional change in estimated equity value from the $1.5B base case under the most important public sensitivity
      drivers.
    approximationNotes: >-
      Sensitivity values are analyst estimates in billions of USD derived from public evidence; they show direction and
      relative magnitude, not a management forecast.
    data:
      items:
        - label: Second $40M-class hardware win or equivalent backlog proof
          value: 0.8
        - label: ARR exits above $100M with better revenue mix
          value: 0.9
        - label: 2028 Libra / AWS milestone remains on-time
          value: 1.2
        - label: Heavy preference stack or senior note conversion terms
          value: -0.7
        - label: 12-18 month roadmap slip
          value: -0.9
        - label: Public quantum multiple compression / proof gap persists
          value: -0.6
    claimRefs:
