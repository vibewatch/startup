chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              QuEra Computing is a Boston-headquartered neutral-atom quantum computing company founded in 2018 from
              Harvard and MIT research. Public company materials now present QuEra as a private, late-stage company that
              is past the pure lab-spinout phase but still pre-public and disclosure-light on several financial metrics.
              The contact page lists a global headquarters at 1380 Soldiers Field Road in Boston plus named U.K. and
              Japan offices and an AIST site in Tsukuba, while a 2026 company-sourced roadmap note describes broader
              operating presence across Boston, New Mexico, Tokyo, Zurich, and the United Kingdom.


              The one-line business model is more concrete than many quantum peers: QuEra sells neutral-atom compute
              access through cloud and premium channels, sells or deploys on-premises systems for national labs or HPC
              centers, and wraps those systems with application co-design and research partnerships. Aquila, the
              first-generation 256-qubit analog system, is available on Amazon Braket and via premium access; the
              company also markets on-premises and hybrid quantum-classical deployments such as the AIST / ABCI-Q
              installation in Japan. That mix matters for the rest of the report because it means QuEra is not just
              selling a future roadmap: it is already commercializing hardware access, scientific services, and
              strategic deployment programs, even though exact public valuation, ARR, customer count, and headcount
              remain undisclosed in retained primary sources.
