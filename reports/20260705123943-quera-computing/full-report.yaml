            body: >-
              QuEra's go-to-market motion looks bifurcated. At the top of the funnel, Amazon Braket gives low-friction
              cloud discovery and experimentation. At the high-value end, QuEra is selling into long-cycle national
              labs, HPC centers, and government-backed programmes such as NQCC, DARPA QBI, ABCI-Q, and Roadrunner. The
              September 2025 expansion is especially revealing because it explicitly frames HPC centers as a GTM target
              and says hybrid deployments lower procurement friction. That tells us the company is not trying to
              brute-force pure SaaS velocity; it is using cloud access as a wedge into consultative, high-touch,
              infrastructure-heavy deals. Public sales-efficiency metrics are absent. No CAC, payback, NRR, or
              conversion data are disclosed, and IonQ's filing reminds investors that marketplace revenue can be net of
              platform economics because the cloud provider, not the end user, is the contractual customer. The right
              read-through is that QuEra has a plausible channel stack, but not one that can yet be scored like mature
              software.
