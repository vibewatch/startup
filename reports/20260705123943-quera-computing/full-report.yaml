        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, QuEra presents as a promising but not yet underwritable hybrid deep-tech business. The
              positive case is credible: real customer activity, multiple revenue surfaces, hyperscaler and
              GPU-ecosystem support, and enough capital to keep pushing toward error-corrected systems. The negative
              case is equally clear: the public pack does not reveal realized pricing, stream mix, backlog, gross
              margin, cash runway, or customer concentration. That means investors cannot separate list pricing from
              realized revenue, company-reported commercial momentum from corroborated metrics, or project revenue from
              recurring usage. The biggest diligence blocker is not whether QuEra has customers; it is whether the
              current top line is diversified enough, and the cost base disciplined enough, to finance the road from
              early deployments to repeatable fault-tolerant production. Until the private operating pack closes those
              gaps, the correct verdict is revenue quality plausible but unproven, margin path conceptually attractive
