  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and conversion terms
        - >-
          Convertible note / Series B conversion mechanics, liquidation preferences, anti-dilution, and any seniority
          stack
        - Determines whether the apparent entry price actually survives downside scenarios
        - Request investor-ready cap table, note summary, and counsel memo.
      - - Burn, cash, and capex bridge
        - Current cash, monthly burn, 2026-2028 capex plan, and hiring ramp
        - Tests whether the existing round truly carries QuEra to the next proof point without a punitive financing
        - Request CFO bridge and board-approved operating plan.
      - - Revenue composition
        - Split between one-off system sales, cloud revenue, services, and government-backed work
        - Distinguishes repeatable ARR from milestone-heavy revenue recognition
        - Review revenue bridge, top contracts, and accounting policy summary.
      - - Customer concentration and backlog
        - Named backlog, renewal structure, and concentration by customer / geography
        - AIST is helpful, but investors need to know how much of the business depends on one lighthouse account
        - Request booked backlog, pipeline stages, and concentration schedule.
      - - Unit economics
        - Gross margin by product / service line and required support cost for on-prem deployments
        - Determines whether growth creates enterprise value or just absorbs more capital
        - Review product margin analysis and service-delivery cost model.
      - - Roadmap governance
        - Milestone dashboard for 2026-2028 systems, AWS deliverables, and dependencies on suppliers / partners
        - The whole upside case depends on hitting the execution chain on time
        - Request PMO dashboard and partner workstream ownership map.
    notes: >-
      These asks are ordered by what most directly changes downside underwriting; items 1-3 are blocking before any
      conviction investment.
