              QuEra’s customer picture is clearer than a logo wall but still unusual by software standards. The company
              is not selling one homogeneous product to one homogeneous buyer. Public evidence shows at least four
              visible motions. First, Amazon Braket gives QuEra a cloud-distributed channel where end users can reach
              Aquila through AWS accounts rather than by buying hardware directly. Second, sovereign and HPC buyers such
              as AIST, NQCC, NERSC, and Pawsey engage through long-cycle programs that care about secure execution,
              hybrid integration, and national capability building more than low-friction seat growth. Third, research
              and application programs in life sciences and telecom show QuEra entering through co-design and
              problem-specific pilots. Fourth, consulting and strategy partners such as Deloitte and BCG X broaden the
              funnel by moving customers from discovery to proof-of-value. The key segmentation conclusion is that
              QuEra’s current customer base is strongest in government, HPC, and advanced R&D buyers, with enterprise
              usage more visible through pilots and partner-mediated engagements than through repeatable production
              software subscriptions.
