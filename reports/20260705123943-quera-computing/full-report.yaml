  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Residual-risk view showing QuEra's heaviest exposures cluster around roadmap compression, concentration, and
      compliance-interaction rather than around a known lawsuit or recall.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - ''
            - AIST-scale repeatability failure; financing overhang if burn stays opaque
            - Libra/gigaquop execution miss
        - label: High impact
          values:
            - Patent or docket surprise from private diligence
            - AWS or NVIDIA dependency slip; government-program concentration
            - Export-control / contractor-compliance friction; public-program concentration
        - label: Medium-high impact
          values:
            - UK sovereignty review or customer-side screening
            - Field-support and uptime proof gap
            - QEC talent shortage and hiring lag
        - label: Medium impact
          values:
