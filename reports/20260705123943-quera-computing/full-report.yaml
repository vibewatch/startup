  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Thesis
        blocks:
          - type: paragraph
            body: >-
              QuEra now has enough public evidence to stay on an investor's active list, but not enough to justify a
              clean buy call at an implied late-2025 private mark near $1 billion. The positive side of the case is
              real: QuEra raised more than $230 million from Google, SoftBank Vision Fund 2, Valor, QVT, Safar, and
              later NVentures; it has visible customer proof through the AIST system sale in Japan; and it has credible
              technical momentum through its 2025 fault-tolerance milestones and 2028 AWS-linked Libra roadmap. The
              anti-thesis is equally important. Public sources still do not disclose the note-conversion mechanics,
              liquidation preferences, burn, gross margin, or backlog quality that would let investors underwrite
              downside with confidence. TechCrunch also reported that the February 2025 instrument was a convertible
              note and that QuEra declined to disclose valuation, which makes the commonly cited ~$1 billion figure
              useful context but not fully supported price evidence. Recommendation: Track, with medium confidence and
              high risk.
