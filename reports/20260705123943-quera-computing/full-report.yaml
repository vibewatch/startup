  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: standard
    summary: >-
      Low, base, and high value outcomes for the bear, base, and bull cases, anchored on the current public valuation
      context rather than a disclosed priced round.
    approximationNotes: >-
      All values are analyst estimates in billions of USD. Return framing assumes an effective entry around the commonly
      cited ~$1B mark and excludes unknown preference overhang.
    data:
      items:
        - label: Bear case value ($B)
          low: 0.3
          base: 0.5
          high: 0.8
        - label: Base case value ($B)
          low: 1.2
          base: 1.5
          high: 2
        - label: Bull case value ($B)
          low: 3
          base: 4
          high: 5
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of QuEra on the dimensions most relevant to underwriting a private quantum position today.
    approximationNotes: >-
      Scores are 0-10 directional analyst judgments based on public evidence rather than an internal IC framework
      provided by management.
    data:
      items:
        - label: Market opportunity
          value: 8
          note: Macro demand remains real even as buyers become more disciplined.
        - label: Technical roadmap
          value: 7
          note: 2025 fault-tolerance work and 2028 AWS plan are credible but not delivered yet.
        - label: Commercial proof
          value: 6
          note: AIST and record customer revenue matter, but repeatability is still unproven.
        - label: Financial disclosure
          value: 4
          note: Burn, margin, retention, and preference data are still private.
        - label: Competitive position
          value: 6
          note: Neutral-atom story is strong, but Quantinuum discloses more customer proof.
        - label: Valuation support
          value: 4
          note: Exact price support remains conflicted because the original round was a convertible note.
        - label: Evidence quality
          value: 5
          note: Funding and roadmap evidence are solid; economics evidence is middling.
        - label: Exit readiness
          value: 4
          note: Another private round is likelier than IPO until disclosure matures.
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV010
      - CV016
      - CV027
      - CV037
      - CV044
