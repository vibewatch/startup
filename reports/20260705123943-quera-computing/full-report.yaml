      - number: '6.3'
        title: Named Customer Proof and Use-Case Specificity
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is strongest where QuEra’s systems are tied to a concrete institution, workflow, and
              outcome. AIST is the highest-quality example because the proof includes a disclosed contract value, a
              named installation site, a hybrid use case alongside ABCI-Q, and later evidence that the relationship
              expanded into remote access for external users. NERSC is another strong proof point because the center
              publicly named both Aquila and Gemini, specified project counts, QPU-hour allocation bands, and
              publication rules. NQCC and Pawsey sit one notch below production, but still above generic partnership
              language: NQCC is explicitly a testbed program, while Pawsey has private cloud access, training, and
              software co-development rather than a public on-site machine. Enterprise proof is more mixed. The
              Merck-Amgen-Deloitte work is named and outcome-specific, but it is still a proof-of-concept around
              small-data prediction. Cinfo’s telecom project is among the clearest operational industry proofs because
              it cites the network problem, quantum hardware used, and service-resilience goal. QIC and Roadrunner add
              breadth, but both remain expansion-stage rather than mature recurring accounts.
