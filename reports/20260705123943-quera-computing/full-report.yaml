      - number: '8.3'
        title: Comparable Context and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Comparable work argues for discipline rather than enthusiasm. Public quantum equities still trade at very
              large market caps relative to present revenue, but the same public filings and earnings coverage show
              continuing losses, capital needs, and uncertain market adoption. IonQ is the strongest public revenue
              benchmark; D-Wave has broader named-customer breadth; Rigetti shows how quickly downside emerges when
              execution lags; and each remains heavily option-value-driven. On the private side, Quantinuum's $10
              billion September 2025 financing and Helios launch show what a premium quantum private mark looks like
              when there is stronger customer disclosure, while IQM's February 2026 go-public transaction provides a
              lower but more transparent private/public bridge. PsiQuantum demonstrates that capital still flows to
              sovereign-scale quantum stories, but even there public valuation disclosure is limited. For QuEra, the
              most plausible exit path remains another private round or strategic capital event before any IPO, because
              current public disclosure is not yet public-market ready.
