      - number: '3.3'
        title: Switching Costs, Distribution Power, and Partner Access
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence against a durable winner-take-all moat is how standardized the access layer has
              already become. AWS Braket puts QuEra, IonQ, and Rigetti on one control plane, while Azure Quantum
              publishes partner-specific offers from IonQ, Quantinuum, Rigetti, and Pasqal. Open developer tooling
              reinforces that pattern: Google pushes Cirq, Quantinuum pushes pytket, IonQ supports the major SDKs,
              Rigetti compiles from external formats, and NVIDIA is pushing a hybrid quantum-classical model that treats
              the QPU as one part of a larger accelerated system. This keeps software-side switching costs moderate.
              Buyers can benchmark, multi-home, and defer commitment. Lock-in still exists, but it is mostly
              hardware-specific and workflow-specific rather than app-layer exclusive: neutral-atom analog simulation,
              trapped-ion fidelity, superconducting gate speed, photonic manufacturing, or annealing-based optimization
              each fit different workloads and control assumptions. Distribution power therefore tilts toward the
              brokers and incumbents that already own cloud relationships, enterprise support models, or on-prem
              integration footprints. QuEra's access diversity helps it stay on the shortlist, but it does not yet
              eliminate the comparison-shopping dynamic that cloud marketplaces encourage.
