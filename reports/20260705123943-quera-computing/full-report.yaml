  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold event
      - Transmission to thesis
      - Action implication
    rows:
      - - 2026-2028 roadmap slip
        - Visible miss against the 2026-2027 in-house system plan or the 2028 Libra target
        - Breaks the timing premium embedded in the option-value case
        - Move immediately to bear-case underwriting and stop adding capital.
      - - No second lighthouse win
        - No additional named paid system or durable backlog evidence after AIST
        - Leaves QuEra dependent on one reference sale rather than repeatable demand
        - Downgrade commercial-proof score and keep recommendation at Track or worse.
      - - Financing reset
        - Next round prices flat/down to the current implied mark or adds punitive seniority / anti-dilution
        - Shows public price support was overstated and compresses upside for new money
        - Re-underwrite to downside recovery rather than headline valuation.
      - - Economics miss
        - Burn, gross margin, or capex profile implies far more capital is needed before Libra
        - Turns a roadmap risk into a financing risk
        - Require a full cash bridge or pause diligence.
      - - Sector proof gap widens
        - Survey and buyer behavior continue to favor only proven systems while QuEra remains disclosure-light
        - Shrinks the multiple investors will pay for future milestones
        - Demand a lower entry price or stay on the watchlist.
    notes: Each trigger is intended to be monitorable and directly tied to pricing, not just a generic operational risk list.
    claimRefs:
      - CV016
      - CV017
