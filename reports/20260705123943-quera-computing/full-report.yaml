      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Three drivers matter most for QuEra’s market. First, sovereign funding and public-private testbeds keep
              creating non-consensus demand even before mainstream enterprise ROI exists. Second, post-quantum
              cryptography and security planning force governments and regulated institutions to build quantum
              competence now, even if that spend does not immediately convert into hardware purchases. Third, the market
              is moving from hype to proof-driven procurement, which actually helps QuEra if its public milestones,
              partner stack, and hybrid-HPC positioning are stronger than peers’. But the constraints are just as
              important. BCG, Moody’s, and IBM all say in different ways that hardware readiness is still the bottleneck
              and that advantage claims require repeated validation. QuEra’s own survey says only a small minority have
              scaled applications productively, while QED-C flags talent and supply-chain bottlenecks. Classical
              competition is another major constraint: AI and HPC are improving quickly enough to raise the required ROI
              threshold for every simulation and optimization use case. BCG’s cost comparison is especially important
              for valuation because buyers often want short payback periods while quantum time remains drastically more
              expensive than classical computation. Put differently, the market can be strategically large and
              commercially narrow at the same time. For valuation, that means investors should pay more attention to
              QuEra’s channel proof, procurement quality, and timing discipline than to the abstract size of the
              eventual quantum economy.
