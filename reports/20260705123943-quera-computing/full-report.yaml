      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              QuEra's technical core is specific, not generic: arrays of neutral 87Rb atoms are trapped in optical
              tweezers, excited into Rydberg states when interaction is needed, and programmed either as an analog
              Hamiltonian simulator or as a gate-based digital processor. For Aquila, AWS documentation and QuEra's own
              whitepaper show that the user workflow is to define a two-dimensional atom arrangement and then specify
              time-dependent amplitude, phase, and detuning parameters that drive the native Hamiltonian. That is
              materially different from a standard gate-list workflow. In digital mode, the public story shifts to
              Gemini and to the logical-processor papers: qubits are moved between zones, entangling work is
              concentrated in dedicated regions, and logical operations rely on reconfigurable layouts, shuttling, and
              parallel control. Bloqade ties these modes together by giving users emulation, parameter sweeps,
              visualization, and Braket submission; the Tsim release extends the stack deeper into non-Clifford and QEC
              simulation. The architecture is differentiated by reconfigurability and by the ability to support both
              analog and digital workflows on a common neutral-atom platform, but that also means maturity depends on
              the weakest layer: physical control, software orchestration, and decoder performance all have to improve
              together.
