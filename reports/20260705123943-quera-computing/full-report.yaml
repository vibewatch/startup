      - number: '6.2'
        title: Adoption Trajectory and Deployment Cadence
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is real, but it is measured in access expansion, staged programs, and first
              installations rather than in disclosed customer counts. On the cloud side, Aquila has been accessible on
              Amazon Braket since late 2022, with QuEra raising available hours from 10 per week at launch to 48 per
              week in August 2023 and then above 100 hours per week by November 2023. QuEra also said users from dozens
              of countries had already logged almost 1,000 machine hours by that point, which is meaningful repeat-use
              evidence even though it is not a revenue cohort. On the infrastructure side, the sequence also matters:
              QuEra announced the AIST contract in April 2024, expanded it with a memorandum in October 2024, and now
              says the Gemini-class system is operational in early 2026. NERSC moved from a 2023 partnership to a 2026
              formal access call with staged QPU-hour awards. NQCC moved from award selection in 2024 to shipment by
              2025. Roadrunner is still opening with academic and national-lab users first. The company is therefore
              progressing from access and evaluation into early deployment, but the installed base remains small and
              recent.
