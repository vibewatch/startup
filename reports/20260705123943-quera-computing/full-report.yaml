  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: standard
    summary: >-
      Decision chain from financing and customer proof to a Track recommendation constrained by opaque valuation terms
      and proof-driven sector sentiment.
    data:
      nodes:
        - id: n1
          label: '>$230M financing plus Google / SoftBank / NVentures validation'
        - id: n2
          label: AIST system sale and record 2025 customer revenue create real commercial signal
        - id: n3
          label: 2028 Libra on AWS provides credible technical upside if milestones hold
        - id: n4
          label: Convertible note pricing, preferences, burn, and margin remain undisclosed
        - id: n5
          label: 2026 buyers demand measurable ROI and commercialization proof
        - id: n6
          label: Base-case upside exists but is not enough for a blind buy above ~$1B
        - id: n7
          label: 'Recommendation: TRACK with strict entry discipline'
      edges:
        - from: n1
          to: n6
          label: supports staying engaged
        - from: n2
          to: n6
