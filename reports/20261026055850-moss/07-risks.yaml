callouts:
  - calloutType: risk
    title: Treat assurance as a diligence item
    body: >-
      BaFin, ISO, SOC 2, and GDPR statements are company claims in the available materials. Confirm
      the entity, scope, audit period, and control evidence before treating them as verified.
    claimRefs:
      - CR003
      - CR014
  - calloutType: risk
    title: Financing raised is not liquidity
    body: >-
      Public sources disagree on the latest round and cumulative funding figures. Reconcile signed
      financing records and audited cash/runway data; do not treat funding raised as available cash.
    claimRefs:
      - CR001
      - CR002
