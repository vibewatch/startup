  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: regulatory-assurance
      missingEvidence: >-
        Independent evidence of the licensed legal entity and permission scope, current ISO
        certificate scope, SOC 2 audit period and exceptions, and operational GDPR controls.
      whyItMatters: >-
        The product operates around payments and sensitive finance data, while available assurance
        statements are company claims without scope or test results.
      diligencePath: >-
        Verify the entity and permissions in BaFin records; request current certificates, the SOC 2
        report, DPA, subprocessor list, and control-remediation evidence.
      relatedQuestionRefs:
        - QR002
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: incident-history
      missingEvidence: >-
        Company-specific security, outage, fraud-loss, chargeback, account-takeover, and
        transaction-error history with denominators and reporting periods.
      whyItMatters: >-
        Broad IC3 statistics establish a threat context but cannot estimate Moss's exposure or
        demonstrate its control effectiveness.
      diligencePath: >-
        Review incident registers, loss and dispute rates by transaction volume, uptime and recovery
        records, and control-test results for the latest 24 months.
      relatedQuestionRefs:
        - QR003
    - type: conflicting-data
      severity: material
      topic: financing
      missingEvidence: >-
        Reconciled signed Series C documents and a consistent cumulative-funding bridge supporting
        the different public round and total-funding figures.
      whyItMatters: >-
        Reported financing is not cash available, and inconsistent round figures weaken confidence
        in public capital-structure and liquidity analysis.
      diligencePath: >-
        Reconcile the press release and external report against subscription documents, cap-table
        records, bank statements, audited accounts, and current cash/runway schedules.
      relatedQuestionRefs:
        - QR007
    - type: missing-source
      severity: material
      topic: partner-dependency
      missingEvidence: >-
        Current issuer, processor, settlement-bank and distribution counterparties, contract terms,
        exposure concentration, and tested fallback arrangements.
      whyItMatters: >-
        Card and partnership workflows could be impaired by a concentrated or non-substitutable
        counterparty, but the assigned pool does not quantify these dependencies.
      diligencePath: >-
        Obtain a counterparty map, partner-level revenue and volume shares, termination clauses,
        contingency plans, and evidence from a failover test.
    - type: missing-source
      severity: material
      topic: audited-financials
      missingEvidence: The underlying 2024 annual accounts and audited current cash, credit, and loss metrics.
      whyItMatters: >-
        A directory listing of a filing and a generic disclosure-search page do not reveal Moss's
        audited economics or liquidity.
      diligencePath: >-
        Retrieve the filed accounts from the Company Register and request audited management
        accounts, card receivables, loss rates, and a cash/runway bridge.
      relatedQuestionRefs:
        - QR006
        - QR007
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top-customer revenue and transaction-volume shares, retention and renewal cohorts, and
        customer-level module or partner exposure.
      whyItMatters: >-
        An aggregate customer count does not establish diversification or durability, and a single
        product review cannot quantify customer-level retention or spending dependence.
      diligencePath: >-
        Request top-customer and top-industry shares, cohort GRR/NRR, renewal and churn data, and
        payment volume by customer and period.
      relatedQuestionRefs:
        - QR010
