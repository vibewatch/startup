company:
  name: Moss
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest-priority exposures are unverified regulatory and security-control scope, payment and
    automation risks without company-specific loss metrics, opaque card and partner dependencies,
    and inconsistent public financing figures. Moss describes controls and scale in company
    materials, but those claims do not establish independent assurance, cash available, or the
    absence of incidents.
sections:
  - id: regulatory-trust-controls
    title: Regulatory assurance and trust controls
    body: >-
      Moss's homepage says it is regulated in Germany by BaFin, ISO/IEC 27001:2022 certified, and
      SOC 2 audited; it also says its data is hosted in the EU and handled under GDPR. These are
      company statements, not evidence in this pool of the regulated legal entity, permission
      scope, certificate boundaries, audit period, or control results. The claims matter because
      Moss's product pages describe card, invoice, reimbursement, and accounting workflows, but
      do not independently verify subprocessors, retention, cross-border access, or incident
      response. The potential impact of a permission or data-control failure is high; its likelihood
      cannot be estimated from these sources. No Moss-specific litigation, enforcement, or
      security-incident record was established by the assigned evidence, which is a diligence gap
      rather than proof that none occurred. Request current regulator records, certificate scope,
      the SOC 2 report, privacy schedules, and incident disclosures before relying on the stated
      assurance.
    claimRefs:
      - CR003
      - CR010
      - CR013
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR001
  - id: operational-and-loss-exposure
    title: Operational, cyber, and financial exposure
    body: >-
      The control design Moss describes is directionally relevant: the company says consequential
      AI actions require team sign-off and its website says actions are logged and reversible.
      Those statements do not show transaction-error rates, control testing, recovery performance,
      or the rate of fraud losses. The FBI's IC3 reported 1,008,597 complaints and $20.877 billion
      in losses for 2025, including 24,768 business-email-compromise complaints; those are
      U.S.-wide complaint statistics, not Moss incidents or a direct estimate of European exposure.
      They justify testing invoice-redirection, account-takeover, and payment-approval scenarios,
      not claiming Moss has suffered them. A 2022 report described Moss card terms of up to 60 days,
      but the current pool contains no card receivables, delinquency, loss, chargeback, or funding
      data with which to size that exposure. One Software Advice reviewer said newer features
      were in more expensive plans; a single review is a signal to test packaging and renewal
      behavior, not a measure of customer-wide price sensitivity.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR012
    tableRefs:
      - TR002
  - id: dependency-and-disclosure
    title: Partner dependencies and disclosure quality
    body: >-
      Moss's October 2026 partnership-manager listing assigns staff to assess partners, negotiate
      agreements, and grow revenue through partnerships; its product pages describe more than 40
      accounting, ERP, HR, and productivity connections. These items show active channel and
      integration work, not partner concentration, contractual protections, or redundancy. The
      assigned evidence does not identify card issuers, settlement banks, processors, or
      concentration by counterparty. Moss's August 2026 company release reports a €35 million
      Series C and total funding above €200 million; an undated TechFundingNews article reports a
      €30 million round and about €160 million in total funding, while a dated Renascence briefing
      also reports €30 million. Preserve these as source-attributed figures until signed financing
      records reconcile them; none is cash available. A commercial registry-data listing identifies
      a Moss GmbH 2024 annual-account entry disclosed on 8 January 2026, and the Federal Gazette
      directs users to the Company Register for deposited accounts, but the accounts themselves
      were not in this pool. Moss reports more than 5,000 businesses, but the assigned sources do
      not show revenue or payment-volume concentration; one customer review cannot supply that
      denominator. Obtain audited statements, round documents, customer and partner maps, exposure
      limits, fallback arrangements, and tested exit procedures.
    claimRefs:
      - CR001
      - CR002
      - CR009
      - CR008
      - CR013
      - CR014
      - CR012
      - CR010
      - CR011
    tableRefs:
      - TR003
  - id: decision-gates
    title: Monitoring and thesis-break gates
    body: >-
      The evidence supports a conditional diligence agenda, not a probability estimate: the public
      record does not establish licensing scope, company-specific incident rates, counterparty
      concentration, or current cash. Before underwriting, reconcile the signed Series C and
      cumulative-funding bridge, verify the regulated entity and permissions, and obtain current
      audit, loss, uptime, recovery, and counterparty records. Treat a material permission
      suspension, substantiated consequential payment without required approval, unresolved
      material data incident, or loss of a critical issuer or settlement partner without tested
      replacement as a thesis-break event. Thereafter monitor fraud losses, disputes, uptime and
      recovery, AI overrides and errors, and customer and partner concentration using explicit
      periods and denominators; do not set numerical thresholds before baselines are supplied.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
      - CR009
      - CR011
      - CR016
    figureRefs:
      - FR001
tables:
  - id: TR001
    title: Regulatory / legal risk register
    enumerationScope:
      coverage: partial
      basis: >-
        Partial screen of assigned successful URLs and public materials as of 2026-10-26; not an
        exhaustive legal-record search.
    columns:
      - Risk / evidence
      - Likelihood
      - Potential impact
      - Mitigation maturity
      - Residual exposure
      - Monitoring and diligence path
    rows:
      - - Regulatory permissions and assurance scope
        - Unknown from assigned sources
        - High if permissions or control scope are inadequate
        - Company states BaFin regulation, ISO/IEC 27001:2022, and SOC 2; scope not independently checked
        - High / unverified
        - Confirm legal entity and permissions with BaFin; inspect certificate scope and SOC 2 period/findings
      - - Finance-data privacy and processing
        - Unknown
        - High because workflows handle payment and accounting records
        - Moss says data is EU-hosted and handled under GDPR; no DPA or subprocessor record supplied
        - Medium-high / unverified
        - Review DPA, subprocessors, retention, access controls, and incident-notification terms
      - - Litigation, enforcement, and company-specific incident history
        - Not established by this pool
        - Potentially high
        - No company-specific record in the assigned sources; this is not evidence of no incidents
        - Unknown
        - Obtain current litigation, regulator, complaint, outage, and incident registers
    notes: >-
      Qualitative ranking from the assigned sources; unknown likelihood is not scored as zero.
      Company assurance statements are not independent verification, and the table is not an
      exhaustive legal or incident search.
    claimRefs:
      - CR003
      - CR010
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap / monitor
    rows:
      - - Card-credit, settlement, or fraud-loss exposure
        - Unknown; current loss and delinquency rates unavailable
        - High potential impact
        - Historical 2022 card terms reported; current limits, counterparties, and controls unverified
        - High / unknown
        - Obtain receivables aging, loss and chargeback rates, limits, settlement flows, and stress tests
      - - Business-email compromise or invoice/payment manipulation
        - Not quantifiable for Moss; IC3 data is U.S.-wide
        - High potential impact
        - Moss describes approval controls; no incident or resilience metrics supplied
        - Medium-high / unknown
        - Test payment-change verification, account takeover controls, recovery time, and fraud losses
      - - AI coding, reconciliation, or approval error
        - Unknown
        - High if errors repeat in finance records
        - Moss says consequential actions require sign-off and actions are logged/reversible
        - Medium-high until tested
        - Review error rates, overrides, reversals, audit samples, model changes, and escalation controls
      - - Feature-tier friction and willingness to pay
        - Unknown; one review is not representative
        - Moderate
        - A Software Advice reviewer reported newer features on more expensive plans
        - Low-medium / unquantified
        - Compare plan attach, renewal, downgrade, and churn by feature and customer segment
    notes: >-
      Rows are ordered by potential impact, not measured probability. The 2025 IC3 figures describe
      U.S. complaints across many organizations and do not indicate Moss-specific incidents.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR012
  - id: TR003
    title: Partner and operating-dependency risk register
    columns:
      - Dependency
      - Public evidence
      - Failure scenario
      - Severity
      - Mitigation maturity
      - Residual exposure / diligence
    rows:
      - - Card issuer, settlement bank, and payment rails
        - Moss markets cards; assigned pool names no current issuer or settlement counterparty
        - A partner restriction or outage could disrupt card issuance, settlement, or credit availability
        - High potential impact; likelihood unknown
        - Not established
        - Identify counterparties, exposure concentration, termination rights, and tested alternatives
      - - Customer and revenue concentration
        - Moss reports more than 5,000 businesses, but no customer-level revenue or payment-volume shares
        - Loss or contraction of a concentrated customer could impair revenue or transaction volume
        - Material; concentration and likelihood unknown
        - Aggregate customer count and one review do not establish retention or diversification
        - Obtain top-customer shares, cohort retention, renewal, and payment-volume data by period
      - - Partner-led acquisition and distribution
        - October 2026 job listing assigns partnership assessment, negotiation, and revenue growth
        - Loss of a material referral, distribution, or commercial partner could slow acquisition
        - Medium-high; concentration unknown
        - Hiring and role scope are visible; signed partner coverage and economics are not
        - Provide partner-level revenue, pipeline, renewal, and concentration data
      - - Accounting, ERP, HR, and productivity integrations
        - Moss states it connects to 40+ tools
        - API changes or outages could impair reconciliation and customer workflows
        - Medium-high; incident likelihood unknown
        - Product integration claims are public; service-level and fallback evidence is absent
        - Map critical integrations, uptime by dependency, support obligations, and manual fallback
    notes: >-
      Public product and hiring materials establish stated activity, not counterparty concentration,
      contractual resilience, or measured dependency-level uptime.
    claimRefs:
      - CR009
      - CR012
      - CR008
      - CR010
      - CR011
