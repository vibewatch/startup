      - [Cherry Ventures, "Participated in the 2026 Series C as an existing investor.", "Repeat participation reported; present stake and governance rights undisclosed.", "Reconcile historical investments with current ownership and board rights."]
      - [Tiger Global Management, "Reported as lead investor in the Series B.", "Round participation reported; current stake and terms undisclosed.", "Request Series B terms, dilution history, and current beneficial ownership."]
      - [Valar Ventures and Global Founders Capital, "Named among Series A-extension investors.", "Participation reported; investor-level amounts and current stakes undisclosed.", "Request investor-by-investor financing history and current cap-table waterfall."]
