summary:
  headline: >-
    Moss has reported late-stage scale and an integrated finance workflow, but conflicting financing disclosures and
    unverified unit economics, retention, and capital terms leave the €1.0bn mark too difficult to underwrite for a buy.
  overallScore: 6.8
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: null
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Independent 2026 coverage reports ARR above €70 million and more than 5,000 business customers, although neither
      metric is audited or precisely defined.
    - >-
      Moss presents a joined workflow across cards, payables, reimbursements, controls, and accounting, with more than
      40 claimed integrations.
    - >-
      The recent Series C and investor participation support continued product investment, including a Finance AI
      strategy described with human oversight.
  topRisks:
    - >-
      Public financing reports conflict on the Series C amount and cumulative funding, while signed terms and the fully
      diluted capitalization remain undisclosed.
    - >-
      Audited revenue-to-ARR reconciliation, gross margin, retention, contribution economics, cash conversion, current
      cash, and runway are unavailable.
    - >-
      Series C liquidation preferences, anti-dilution provisions, debt seniority, and the fully diluted cap table are
      not public.
    - >-
      Regulatory, certification, privacy, and AI-control statements are primarily company claims; independent evidence
      of scope, effectiveness, and incidents is incomplete.
    - >-
      Card and payment-rail losses, partner concentration, chargebacks, and dependency-level reliability are not
      quantified.
  unresolvedGaps:
    - Audited ARR bridge, recognized revenue, gross margin, EBITDA, and module-level revenue mix.
    - Net and gross retention, churn, cohort expansion, module attachment, and customer-level economics.
    - Series C liquidation preferences, anti-dilution terms, debt seniority, and fully diluted capitalization.
    - Current cash balance, net burn, runway, and debt or credit-facility obligations.
    - Unit economics and concentration by payment or banking rail, including fraud, chargeback, and incident metrics.
    - Current active-customer definition, named production deployments, customer concentration, and current headcount.
    - >-
      Independent confirmation of licensing scope, certification boundaries, security controls, and company-specific
      incident history.
disclaimer: >-
