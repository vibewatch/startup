evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      A current, dated employee count and staffing trend were not established by the assigned successful prefetched
      sources.
    whyItMatters: >-
      Headcount and hiring trajectory inform operating leverage, execution capacity, and the scale implied by the
      reported customer and ARR figures.
    diligencePath: >-
      Request a current employee roster or dated headcount series from management and reconcile it to payroll and hiring
      data.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership-and-governance
    missingEvidence: >-
      Current cap table, board roster, investor rights, founder ownership, and financing terms are not in the assigned
      sources.
    whyItMatters: >-
      Reported investors and round valuations do not establish control, dilution, liquidation preference, or governance
      protections.
    diligencePath: Obtain the fully diluted cap table, financing documents, shareholder agreements, and current board materials.
    relatedQuestionRefs:
      - QO002
      - QO007
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, ARR reconciliation, gross margin, EBITDA, cash flow, and module-level revenue mix are not
      established.
    whyItMatters: >-
      Reported ARR and valuation cannot establish recognized revenue, profitability, cash burn, or the sustainability of
      the latest valuation.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, an ARR-to-revenue bridge, and cohort and module
      economics.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: customer-review
    missingEvidence: >-
      The available review excerpt is one individual's dated experience within a listing that shows five of 66 reviews;
      it is not a representative cohort.
    whyItMatters: >-
      A single pricing complaint cannot establish prevalence, customer satisfaction, churn, or the commercial effect of
      plan gating.
    diligencePath: >-
      Review the complete, dated customer-feedback set and compare recurring themes with retention, churn, and
      pricing-tier data.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: moss-specific-sam-som
    missingEvidence: >-
      An audited or otherwise supportable spend denominator for Moss's eligible products, customer geographies,
      target-company segments, current module revenue and attainable share.
    whyItMatters: >-
      The published analyst categories span different products and geographies; without an eligible-spend denominator
      they cannot be converted into Moss-specific TAM, SAM or SOM.
    diligencePath: >-
      Request a product-by-product revenue bridge, eligible-country and company-size definitions, customer counts by
      workflow, and a documented bottom-up serviceable-market model.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets-adoption
    missingEvidence: >-
      Verified budget owner, procurement path, willingness-to-pay, implementation time, conversion rates and realized
      workflow ROI by buyer segment.
    whyItMatters: >-
      Public product positioning and a claimed time saving do not establish that target users control budget or that
      regulatory and efficiency drivers convert into adoption.
    diligencePath: >-
      Validate with anonymized pipeline and cohort data, contract values and renewal rates by module, measured pre/post
      workflow outcomes, and independent customer references.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-estimate-comparability
    missingEvidence: >-
      Underlying market definitions, research methodology and a reconciliation of The Business Research Company's
      conflicting global CAGR figures.
    whyItMatters: >-
      OMR and the global spend-management estimate differ in category, geography and period; the global source also
      conflicts internally, while OMR's page contains a geographic labeling inconsistency.
    diligencePath: >-
      Obtain both publishers' underlying methodology and segment tables, then reconcile scope, base years, forecast
      periods and market-value definitions before using either in a valuation model.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer_substitutes
    missingEvidence: >-
      Buyer interviews or procurement records that quantify use of spreadsheets, ERP-only workflows, internal builds,
      and specialist alternatives.
    whyItMatters: >-
      Without the status-quo and build-versus-buy mix, the addressable competitive set and Moss's displacement
      opportunity remain incomplete.
    diligencePath: >-
      Request recent win/loss analyses and interview finance buyers who chose Moss, a competitor, an ERP module, or an
      internal process.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing_and_switching
    missingEvidence: >-
      Comparable vendor quotes, discounts, contract minimums, migration costs, renewal terms, customer multi-homing, and
      switching outcomes.
    whyItMatters: >-
      Public feature pages do not establish the buyer's total cost or whether integrations create durable retention
      rather than convenience.
    diligencePath: >-
      Obtain anonymized contracts and cohort-level churn, expansion, migration, and win/loss data for comparable
      customers.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP002
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor_profiles
    missingEvidence: >-
      Direct current product, pricing, customer-segment, and scale evidence for each market-listed provider and likely
      entrants.
    whyItMatters: >-
      OMR and TBRC provide provider lists rather than an exhaustive, comparable competitive census or relative market
      positions.
    diligencePath: >-
      Verify the shortlist against procurement data and obtain direct product, pricing, and customer references for the
      most frequently encountered alternatives.
    relatedQuestionRefs:
      - QP002
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current unrestricted cash, monthly net burn, runway, debt and credit-facility terms, and card-program exposure.
    whyItMatters: >-
      A financing announcement does not show proceeds retained, liquidity available to the operating company, repayment
      obligations or the time to a next financing need.
    diligencePath: >-
      Obtain a current cash reconciliation, monthly management accounts, debt and facility agreements, maturity schedule
      and an 18-month downside cash plan.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin, CAC and payback, retention and module attach, payment-rail costs, fraud losses and working-capital
      usage.
    whyItMatters: >-
      Without cohort and rail-level economics, product breadth and reported funding cannot establish scalable
      contribution profit or the cash cost of growth.
    diligencePath: >-
      Request cohort-level bookings, revenue, transaction volume, interchange and partner fees, sales costs, losses,
      support costs and reconciliation to audited accounts.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      Revenue by product and geography, contract terms, billing basis, discounting, deferrals and revenue-recognition
      policy.
    whyItMatters: >-
      A single third-party starting-price listing cannot support ARR, realized price, revenue quality or a bridge from
