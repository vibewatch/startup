company:
  name: Moss
chapter:
  number: 4
  title: Financials
  summary: Moss presents an integrated spend workflow and a reported €30 million Series C, but the retained public record does not establish current pricing, revenue mix, unit economics, or cash runway. A third-party listing and selected customer reviews provide limited, dated pricing and service signals; available company-register pages identify financial statements without exposing their figures.
sections:
  - id: monetization-and-pricing
    title: Monetization and observed pricing
    body: >-
      Moss markets an integrated spend-management workflow spanning cards, invoices,
      reimbursements, controls, purchase requests and accounting data synchronization
      (CI001, CI002). That describes the product surface, not a verified revenue
      breakdown: the two current Moss pages reviewed do not state a contract price,
      module revenue mix or recognition policy (CI015, CI016). SoftwareAdvice lists
      a paid version starting at €12.00 per month and no free version or trial, but
      its captured page does not establish the listing's currentness, package,
      billing basis or realized price (CI004, CI005). The number is therefore a
      third-party listing rather than a current Moss quote. Pricing evidence is
      insufficient to infer average revenue per account, card economics or attach
      rates; table TI001 separates identified product lines from unverified
      monetization, while TI002 preserves the listing's limitations.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI015
      - CI016
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: delivery-costs-and-unit-economics
    title: Delivery costs and unit economics
    body: >-
      The documented workflow implies operational dependencies on card and payment
      processing, invoice and receipt handling, approval controls, reimbursements,
      and accounting integrations; the retained sources do not quantify the
      associated interchange, processor, banking, funding, fraud, support or
      implementation costs. Moss describes structured, pre-accounted data and
      integrations, but that does not establish gross margin or labor savings at
      company level (CI001, CI002, CI003). One customer-review page contains
      favorable comments alongside a report that newer features are in more
      expensive plans and a report of occasional PDF auto-attachment problems
      dependent on email formatting (CI006, CI007). These are isolated user
      observations, not a representative churn, support-cost or reliability
      measure. FinTech Global's January 2022 report also said Moss claimed card
      payment terms of up to 60 days; that historical statement does not identify
      who funded balances or bore credit exposure (CI010). The unit-economics
      table in the final section leaves private inputs unfilled and converts each
      into a specific diligence request rather than presenting an unsupported
      SaaS benchmark or a modeled margin.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
      - CI007
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting gaps
    body: >-
      Renascence reports a €30 million Series C led by Portage and Cherry Ventures
      on 25 August 2026, while The Financial Analyst separately reports the same
      round, while The Financial Analyst separately asserts a billion-dollar
      valuation (CI008, CI009). That stronger valuation assertion is not
      independently corroborated in this retained pool and should not be
      treated as audited or as cash available to Moss. The company-register listing identifies a 2024
      annual account disclosure, and the Federal Gazette explains that accounting
      documents are not full-text searchable there, but neither fetched page
      supplies the statements' financial figures (CI011, CI012). Cash, burn,
      runway, debt, working capital, gross margin and product-level revenue remain
      underwriting blockers (CI015, CI016); diligence should obtain the underlying
      accounts and current management schedules.
    claimRefs:
      - CI008
      - CI011
      - CI012
      - CI015
      - CI016
    tableRefs:
      - TI003
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Product or workflow
      - Publicly supported status
      - Monetization / recognition evidence
      - Underwriting implication
    rows:
      - - Corporate cards and spend controls
        - Moss markets physical and virtual cards with limits, tracking and controls.
        - No retained source quantifies card revenue, interchange share, credit exposure or recognition.
        - Obtain cardholder, volume, interchange, funding and loss data by program.
      - - Invoices, reimbursements and purchase requests
        - Company pages describe invoice, reimbursement and purchase-request workflows.
        - Separate module pricing, adoption and revenue contribution are not established.
        - Request contracted module mix, attach rates and revenue-recognition policy.
      - - Accounting automation and integrations
        - Moss describes pre-accounting and data synchronization to accounting / ERP tools.
        - No implementation, integration or service-fee schedule is disclosed in retained sources.
        - Request implementation revenue, ongoing service cost and partner-fee detail.
      - - Paid software access
        - A third-party listing describes a paid version.
        - A SoftwareAdvice listing says €12.00/month; package, vintage and realized price are unverified.
        - Verify current price book, discounts, contract duration and billed customer cohort.
    notes: Product capability is not proof of a separately monetized stream; price and revenue recognition are unavailable or qualified as shown.
    claimRefs:
      - CI001
      - CI004
      - CI013
      - CI014
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Evidence item
      - Price / term
      - Source and qualification
      - Diligence ask
    rows:
      - - Paid software listing
        - €12.00/month starting price
        - SoftwareAdvice listing; publication vintage, package and billing terms are not established.
        - Obtain the current official price book and signed customer examples.
      - - Free version / trial
        - Listing says neither is offered
        - Third-party listing only; current company policy is not confirmed.
        - Confirm current trial, free tier and conversion policy.
      - - Realized pricing and discounting
        - Not available
        - No retained source reports contract-level prices or discounts.
        - Review a representative contract sample by segment and product.
      - - Card, AP and reimbursement module pricing
        - Not available
        - Current Moss marketing pages describe capabilities but no module-specific prices.
        - Map module pricing to seats, cards, transaction volume and payment rails.
    notes: The €12.00/month amount is a third-party listing, not a verified current quote or realized revenue; other missing values are not zero.
    claimRefs:
      - CI004
      - CI005
      - CI013
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence / limitation
      - Diligence request
    rows:
      - - Gross margin by product and payment rail
        - null
        - No retained source provides a measured margin or rail-level cost allocation.
        - Reconcile gross revenue, interchange, funding, processor, scheme and servicing costs by rail.
      - - CAC and payback
        - null
        - No retained source provides acquisition spend, cohort gross profit or payback.
        - Provide fully loaded sales and marketing cost, channel mix and cohort payback calculation.
      - - Retention, churn and module attach
        - null
        - No retained source provides NRR, churn, expansion or module-attach data.
        - Provide customer cohorts by segment, product, renewal and expansion.
      - - Cash, burn and runway
        - null
        - The financing reports do not disclose current cash, net burn or runway.
        - Provide a current cash reconciliation, monthly burn and 18-month operating plan.
      - - Working capital, debt and credit exposure
        - null
        - No retained source quantifies obligations, available facilities or card-credit exposure.
        - Provide debt / facility terms, maturity schedule, collateral and exposure by program.
    notes: Null means not reported in the retained source set; it is not an estimate of zero. Each requested metric requires company schedules and definitions.
    claimRefs:
      - CI014
      - CI015
      - CI016
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Moss describes a connected spend-to-accounting workflow, but the retained sources do not quantify prices, revenue capture or costs.
    data:
      nodes:
        - id: spend
          label: Company spend, invoices and requests
          details: >-
            Company pages list spend, invoices, employee reimbursements, and purchase
            requests; customer and transaction volumes are not disclosed.
        - id: capture
          label: Cards, invoice and reimbursement capture
          details: >-
            Moss describes card, invoice, and reimbursement workflows; their separate
            revenue contribution is not reported.
        - id: controls
          label: Budgets, policy controls and approvals
          details: >-
            Moss describes budgets and approvals, but plan-level price and paid attach
            are not established.
        - id: payment
          label: Payment and reimbursement processing
          details: >-
            The company describes card payments and centralized reimbursements; current
            settlement, funding, and loss responsibility are not disclosed.
        - id: accounting
          label: Pre-accounted data synced to finance systems
          details: >-
            Moss describes accounting data synchronization; integration and servicing
            costs are not quantified.
        - id: economics
          label: Fees, revenue mix and cost-to-serve not quantified
          details: >-
            No assigned source reports current revenue, gross margin, cash, burn, or runway.
      edges:
        - from: spend
          to: capture
        - from: capture
          to: controls
        - from: controls
          to: payment
        - from: payment
          to: accounting
          label: Product workflow described
        - from: accounting
          to: economics
          label: Revenue and cost bridge not disclosed
    claimRefs:
      - CI001
      - CI002
      - CI013
      - CI014
callouts:
  - calloutType: insight
    title: Product breadth is clearer than revenue quality
    body: Moss documents an integrated spend workflow, but retained sources do not establish module-level monetization, realized pricing or gross profit.
    claimRefs:
      - CI001
      - CI013
      - CI014
  - calloutType: risk
    title: The funding headline is not a liquidity measure
    body: The reported Series C provides a financing event, not a current cash balance, burn rate, runway, debt schedule or evidence of capital adequacy.
    claimRefs:
      - CI008
      - CI015
  - calloutType: recommendation
    title: Obtain financial statements and operating schedules
    body: Underwriting should remain conditional on the filed accounts and company schedules for margin, cohort economics, cash and credit exposure.
    claimRefs:
      - CI011
      - CI012
      - CI015
      - CI016
