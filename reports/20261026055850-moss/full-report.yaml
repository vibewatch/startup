              - CR012
      - number: '7.3'
        title: Partner dependencies and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Moss's October 2026 partnership-manager listing assigns staff to assess partners, negotiate agreements,
              and grow revenue through partnerships; its product pages describe more than 40 accounting, ERP, HR, and
              productivity connections. These items show active channel and integration work, not partner concentration,
              contractual protections, or redundancy. The assigned evidence does not identify card issuers, settlement
              banks, processors, or concentration by counterparty. Moss's August 2026 company release reports a €35
              million Series C and total funding above €200 million; an undated TechFundingNews article reports a €30
              million round and about €160 million in total funding, while a dated Renascence briefing also reports €30
              million. Preserve these as source-attributed figures until signed financing records reconcile them; none
              is cash available. A commercial registry-data listing identifies a Moss GmbH 2024 annual-account entry
              disclosed on 8 January 2026, and the Federal Gazette directs users to the Company Register for deposited
              accounts, but the accounts themselves were not in this pool. Moss reports more than 5,000 businesses, but
              the assigned sources do not show revenue or payment-volume concentration; one customer review cannot
              supply that denominator. Obtain audited statements, round documents, customer and partner maps, exposure
              limits, fallback arrangements, and tested exit procedures.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR008
              - CR013
              - CR014
              - CR012
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR012
              - CR008
              - CR010
              - CR011
      - number: '7.4'
        title: Monitoring and thesis-break gates
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a conditional diligence agenda, not a probability estimate: the public record does
              not establish licensing scope, company-specific incident rates, counterparty concentration, or current
              cash. Before underwriting, reconcile the signed Series C and cumulative-funding bridge, verify the
              regulated entity and permissions, and obtain current audit, loss, uptime, recovery, and counterparty
              records. Treat a material permission suspension, substantiated consequential payment without required
              approval, unresolved material data incident, or loss of a critical issuer or settlement partner without
              tested replacement as a thesis-break event. Thereafter monitor fraud losses, disputes, uptime and
              recovery, AI overrides and errors, and customer and partner concentration using explicit periods and
              denominators; do not set numerical thresholds before baselines are supplied.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR009
              - CR011
              - CR016
          - type: figure
