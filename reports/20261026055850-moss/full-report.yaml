      - number: '5.4'
        title: Trust, maturity, and unresolved technical proof
        blocks:
          - type: paragraph
            body: >-
              Moss's homepage states that the company is regulated in Germany by BaFin, ISO/IEC 27001:2022 certified,
              SOC 2 audited, and handles EU-hosted data under GDPR (CE008, CE009). These are company statements; the
              assigned evidence does not include a regulator record, certificate, audit report, security architecture,
              incident history, or availability record to verify their scope or operating effectiveness. GoCardless
              announced in July 2023 that Moss selected it as a UK direct-debit provider for collections, which
              demonstrates a disclosed partner integration at that date but not its current terms or concentration
              (CE010). Independent evidence on resilience, model accuracy, security controls, and engineering activity
              remains insufficient for technical underwriting. A commercial register profile lists Moss GmbH as active
              but displays a last-change field dated 31 May 2022; that is entity context, not assurance about current
              product controls (CE012).
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target users are clearer than the actual customer mix
        blocks:
          - type: paragraph
            body: >-
              Moss describes a broad buyer environment rather than publishing a customer roster by segment. In a
              Startuprad interview, CEO Ante Spittler distinguished microbusinesses from a mid-segment of roughly 10 to
              500 or 1,000 employees, and described that mid-segment as Moss’s core; the transcript does not give the
              share of current customers that fits either range (CU001, CU004). The company’s product pages identify
              finance teams as the control point and spending teams as users, while the feature set spans cards,
              invoices, reimbursements, approvals, and accounting integrations (CU002). Moss says a customer can start
              with one module and add others as requirements grow (CU003), but that is a stated adoption path, not
              evidence of realized expansion or attach rates. No source in this pool segments paying accounts by
              geography, vertical, revenue, buyer, or payer, so the segmentation table describes intended fit and
              workflow roles rather than a measured installed base.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
      - number: '6.2'
        title: Public adoption evidence is dated and not account-equivalent
        blocks:
          - type: paragraph
            body: >-
              The available scale indicators are not directly comparable. A January 2022 FinTech Global article reported
              more than 20,000 cards issued and more than 250,000 transactions processed since launch, but those are
              cumulative instrument and transaction counts, not unique or currently active customers (CU005, CU006). An
              undated Startuprad interview question uses “over 5000 SMEs onboarded” as a premise; the excerpt supplies
              no measurement date or active-customer definition, and the CEO’s answer moves to market segmentation
              rather than confirming that count (CU007). Startbase carries an “up to 16 hours” monthly time-saving
              claim, without a disclosed sample or measurement method (CU013). Named proof is similarly uneven: Moss’s
              homepage publishes a Mercanis COO testimonial, while Software Advice pages contain individual reviews, not
              independently verified customer references (CU008–CU012). These signals support product use cases, not
              current scale, deployment conversion, or customer outcomes across the base.
            claimRefs:
              - CU005
              - CU006
