      - number: '6.3'
        title: Retention and concentration remain material diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence is insufficient to underwrite customer durability. The assigned public sources disclose no
              current NRR or GRR, churn, renewal rate, cohort retention, contract length, or module-level attach data;
              those measures should be treated as unknown, not zero (CU015). The historical card and transaction totals
              have no current activity denominator, and the interviewer’s onboarding premise is undated, so neither
              establishes repeat use or ongoing customer value. Individual reviews provide practical but
              non-representative signals: one reviewer reported using Moss at a second employer, while a July 2026
              reviewer described monthly receipt navigation as indirect despite a 5/5 overall rating; the latter review
              also rated value and customer support 3/5 (CU010, CU011). A separate UK review noted that newer features
              were available on more expensive plans (CU009). No evidence in the pool quantifies top-customer exposure,
              partner/channel dependence, or revenue concentration (CU016). Before treating the modular product story as
              land-and-expand, diligence should request dated active-account cohorts, renewal and churn definitions,
              module attach by cohort, top-customer and channel shares, and named customer references with production
              status and measurable outcomes.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption signals do not establish active customers
            body: >-
              The reported card and transaction counts are historical cumulative volumes, while the undated SME
              onboarding figure is an interviewer premise; none is a current active-account count.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Retention and concentration are unmeasured in this evidence set
            body: >-
              No current cohort, renewal, churn, top-customer, or channel-share metric is available here, leaving
              durability and concentration unverified.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory assurance and trust controls
        blocks:
          - type: paragraph
            body: >-
              Moss's homepage says it is regulated in Germany by BaFin, ISO/IEC 27001:2022 certified, and SOC 2 audited;
              it also says its data is hosted in the EU and handled under GDPR. These are company statements, not
              evidence in this pool of the regulated legal entity, permission scope, certificate boundaries, audit
              period, or control results. The claims matter because Moss's product pages describe card, invoice,
              reimbursement, and accounting workflows, but do not independently verify subprocessors, retention,
              cross-border access, or incident response. The potential impact of a permission or data-control failure is
              high; its likelihood cannot be estimated from these sources. No Moss-specific litigation, enforcement, or
              security-incident record was established by the assigned evidence, which is a diligence gap rather than
              proof that none occurred. Request current regulator records, certificate scope, the SOC 2 report, privacy
              schedules, and incident disclosures before relying on the stated assurance.
            claimRefs:
              - CR003
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Operational, cyber, and financial exposure
        blocks:
          - type: paragraph
            body: >-
              The control design Moss describes is directionally relevant: the company says consequential AI actions
              require team sign-off and its website says actions are logged and reversible. Those statements do not show
              transaction-error rates, control testing, recovery performance, or the rate of fraud losses. The FBI's IC3
              reported 1,008,597 complaints and $20.877 billion in losses for 2025, including 24,768
              business-email-compromise complaints; those are U.S.-wide complaint statistics, not Moss incidents or a
              direct estimate of European exposure. They justify testing invoice-redirection, account-takeover, and
              payment-approval scenarios, not claiming Moss has suffered them. A 2022 report described Moss card terms
              of up to 60 days, but the current pool contains no card receivables, delinquency, loss, chargeback, or
              funding data with which to size that exposure. One Software Advice reviewer said newer features were in
              more expensive plans; a single review is a signal to test packaging and renewal behavior, not a measure of
              customer-wide price sensitivity.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
