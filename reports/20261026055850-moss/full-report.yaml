  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic and probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          ARR compounds beyond the reported floor; workflow adoption sustains retention and margin; AI modules attach;
          preference overhang is limited.
        - >-
          Potential premium to the current mark only if audited cash economics support it. Evidence probability: low
          until diligence; no numeric range is supportable.
        - Growth or attach fails to translate into durable gross profit and cash generation.
      - - Base
        - >-
          The €1.0B round mark remains the only recent public price anchor; revenue quality and dilution remain
          unresolved.
        - >-
          Track at the reported mark without assuming upside or assigning a target return. Evidence probability:
          moderate as a status-quo case, not a forecast.
        - Audited ARR is materially below the reported run rate or dilution changes effective entry value.
      - - Bear
        - >-
          ARR quality weakens, retention or margins disappoint, card economics add losses, or senior preferences absorb
          more exit proceeds than common holders expect.
        - >-
          Downside may be substantial, but public evidence cannot quantify a recovery value or price floor. Evidence
          probability: uncalibrated.
        - Verified negative cohort economics, a down-round, or a preference stack that materially impairs common equity.
    notes: >-
      Scenario assumptions are analytical, not forecasts. Numeric valuation ranges and probabilities are omitted because
      audited economics, comparable multiples, and preference terms are unavailable in the retained evidence.
    claimRefs:
      - CV003
      - CV005
      - CV011
      - CV015
      - CV016
