      - number: '5.2'
        title: Operating model and integrations
        blocks:
          - type: paragraph
            body: >-
              Public materials support a workflow-level map rather than a software-stack reconstruction: spending and
              documents enter through cards, invoices, receipts, reimbursements, and purchase requests; rules route
              approvals; Moss says it captures, matches, categorizes, and pre-accounts activity; and structured data is
              exported or synchronized to finance systems (CE003, CE004, CE005). The homepage says Moss connects to
              “40+” accounting, ERP, HR, and productivity tools, while the product page names DATEV, Xero, and Exact
              Online (CE005, CE006). No API specification, data-flow diagram, integration uptime, or independent
              implementation test is in the retained evidence. The figure therefore presents only the documented
              operating layers and identifies the partner payment rail as a dated dependency, not a current architecture
              guarantee (CE010).
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
