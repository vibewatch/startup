      - number: '1.3'
        title: Leadership, governance, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies four co-founders and names Ante Spittler as co-founder and CEO, but does
              not establish the other founders' current operating roles, board composition, succession coverage, or
              ownership [CO003]. The investor record identifies Portage and Cherry Ventures in the 2026 round, Tiger
              Global Management in the Series B reporting, and Valar Ventures and Global Founders Capital in Series
              A-extension coverage; these financing relationships do not establish present control or economic ownership
              [CO002, CO009, CO008]. Moss's website and press coverage state that it is BaFin-regulated and cite
              security certifications, but the available pool contains no regulator register or audit report to
              independently verify the status or scope [CO011, CO012]. One SoftwareAdvice-hosted reviewer said newer
              features were in more expensive plans, while describing this as a minor concern; this is an individual
              review, not a representative measure of customer sentiment [CO013]. No current employee count or board
              roster was established from these assigned sources.
