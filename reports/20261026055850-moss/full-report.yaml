chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product
        blocks:
          - type: paragraph
            body: >-
              EU-Startups reports Moss was founded in 2019 by Ante Spittler, Anton Rummel, Ferdinand Meyer, and Stephan
              Haslebacher, while Silicon Canals describes the company as launched in mid-2020; these are distinct
              founding and product-launch milestones, not a resolved exact incorporation date [CO003, CO014]. The Next
              Web describes Moss as a Berlin-based spend-management business serving small and mid-sized companies
              [CO005]. Moss's own current pages present a workflow spanning corporate cards, invoices, reimbursements,
              purchase requests, budgets, approvals, and accounting integrations [CO004, CO010]. That is a coherent
              software-led finance-operations proposition, but the supplied materials do not quantify module-level
              revenue, customer retention, or the economics of any payment or credit product. The company describes
              configurable Finance AI as preparing work while leaving consequential actions under team control; current
              press coverage presents this as a strategic product direction rather than independently measured
              automation outcomes [CO015].
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO010
              - CO014
              - CO015
      - number: '1.2'
        title: Capital, valuation, and reported scale
        blocks:
          - type: paragraph
            body: >-
              EU-Startups and The Next Web report that Moss closed a €30 million Series C led by Portage, with Cherry
              Ventures participating, at a valuation above €1 billion in August 2026 [CO001, CO002]. The same coverage
              says the company serves more than 5,000 businesses across Germany, the UK, the Netherlands, and Austria
              and reports ARR above €70 million [CO005, CO006]. These are reported company-scale figures, not audited
              disclosures; ARR must not be read as recognized revenue, and neither source supplies an ARR bridge, growth
              rate, margins, or cash burn. Earlier reporting gives a useful but non-comparable financing sequence: a €21
              million Series A at a €100 million valuation in January 2021, a later extension reported as $29 million
              (approximately €24.8 million) at a $264 million valuation, and a €75 million Series B at a valuation above
              €500 million [CO007, CO008, CO009].       different currencies and periods are retained as reported;
              Silicon Canals reports the Series A extension as $29 million (approximately €24.79 million), while Open
              Banking Expo reports £29 million, although both give a $264 million valuation [CO008, CO016]. cumulative
              cash raised and current cash availability cannot be derived from these round headlines.
            claimRefs:
