  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Moss describes a connected spend-to-accounting workflow, but the retained sources do not quantify prices, revenue
      capture or costs.
    data:
      nodes:
        - id: spend
          label: Company spend, invoices and requests
          details: >-
            Company pages list spend, invoices, employee reimbursements, and purchase requests; customer and transaction
            volumes are not disclosed.
        - id: capture
          label: Cards, invoice and reimbursement capture
          details: >-
            Moss describes card, invoice, and reimbursement workflows; their separate revenue contribution is not
            reported.
        - id: controls
          label: Budgets, policy controls and approvals
          details: Moss describes budgets and approvals, but plan-level price and paid attach are not established.
        - id: payment
          label: Payment and reimbursement processing
          details: >-
            The company describes card payments and centralized reimbursements; current settlement, funding, and loss
            responsibility are not disclosed.
        - id: accounting
          label: Pre-accounted data synced to finance systems
          details: Moss describes accounting data synchronization; integration and servicing costs are not quantified.
        - id: economics
          label: Fees, revenue mix and cost-to-serve not quantified
          details: No assigned source reports current revenue, gross margin, cash, burn, or runway.
