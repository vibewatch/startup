      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat assurance as a diligence item
            body: >-
              BaFin, ISO, SOC 2, and GDPR statements are company claims in the available materials. Confirm the entity,
              scope, audit period, and control evidence before treating them as verified.
            calloutType: risk
