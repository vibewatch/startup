      - number: '5.3'
        title: Automation claims and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Moss markets receipt and invoice capture, automatic matching, accounting categorization, approval routing,
              and reversible logged actions as part of its automation proposition (CE005, CE007). Its homepage states
              that accounting-field coding is “90%+ accurate from day one,” but does not define the denominator, task
              mix, evaluation set, or independent audit; this is a product claim, not a validated benchmark (CE007). A
              2022 trade-press article described a modular product across cards, invoice approval, expenses, and
              liquidity, providing historical context rather than proof of present product depth (CE011). Current review
              material includes individual user-reported limitations, but those accounts do not establish technical
              performance or representative customer outcomes (CE014, CE015, CE016).
            claimRefs:
              - CE007
              - CE011
              - CE014
              - CE015
              - CE016
          - type: table
