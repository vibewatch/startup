    "number": 8,
    "title": "Valuation",
    "summary": "August 2026 coverage places Moss at a reported €1.0 billion valuation on more than €70 million of annual recurring revenue, implying a simple valuation-to-ARR ratio below 14.3x. The mark has a credible recent financing anchor, but the public evidence does not establish audited unit economics or capital-structure terms; track rather than buy until the entry price can be tested against verified cash generation and dilution."
  },
  "sections": [
    {
      "id": "public-mark",
      "title": "Public mark and the limits of the price signal",
      "body": "Startup.eu reported Moss’s August 2026 Series C at €30 million and a €1.0 billion valuation, alongside more than €70 million in annual recurring revenue and more than 5,000 business customers (CV001, CV002, CV007). Dividing the reported valuation by the reported ARR floor produces a valuation-to-ARR ratio below 14.3x; it is not an enterprise-value multiple, and it does not normalize cash, debt, preference rights, or ARR quality (CV003). FinTech Global had reported a €500 million mark alongside a €75 million Series B in January 2022, so the later reported mark is twice that earlier round mark, not a realized investor return or proof of intervening growth (CV004, CV005). Tracxn’s fetched profile is internally time-ambiguous: its page carries a 2021 publication timestamp while also listing August 2026 financing and a current $1.17 billion valuation. That makes its dollar figure a cautionary data point, not a clean independent current price confirmation (CV006).",
      "claimRefs": [
        "CV001",
        "CV002",
        "CV003",
        "CV004",
        "CV005",
        "CV006",
        "CV007"
      ]
    },
    {
      "id": "evidence-and-comparables",
      "title": "Operating proof and comparable boundaries",
      "body": "The product evidence supports a coherent finance-workflow proposition rather than a proven valuation multiple: Moss’s current site and an archived third-party software listing both describe cards, invoice handling, and expense workflows, while Moss says it connects to more than 40 accounting, ERP, HR, and productivity tools (CV008, CV009). SoftwareAdvice lists strong feature ratings but displays only five reviews out of 66; individual reviewers also flag premium-plan feature access and a first-use learning curve. Those comments are useful friction signals, not representative churn or willingness-to-pay estimates (CV010, CV011). The broad B2B-payments forecast is not Moss’s software TAM: Mordor Intelligence estimates payment-market volume, including domestic and cross-border rails, rather than revenue available to spend-management software (CV012). Sacra’s Airwallex profile and CompaniesMarketCap’s Adyen market capitalization provide context only: one is a broader global accounts/payments platform and the other a scaled public payments acquirer, so neither yields a defensible direct multiple for Moss (CV013, CV014).",
      "claimRefs": [
        "CV008",
        "CV009",
        "CV010",
        "CV011",
        "CV012",
        "CV013",
        "CV014"
      ],
      "tableRefs": [
        "TV002"
      ]
    },
    {
      "id": "decision-and-scenarios",
      "title": "Price-sensitive decision and underwriting gates",
      "body": "The recommendation is TRACK, with low confidence in intrinsic value and a high risk rating: the recent round supplies a usable mark, but the retained public material does not establish audited revenue reconciliation, gross margin, retention, contribution economics, cash conversion, or preference terms (CV015, CV016). A buyer should not convert the reported ARR floor into an earnings or cash-flow valuation, and no numeric target return or bull/base/bear price range is defensible without those inputs. The scenarios below therefore make assumptions and reversal triggers explicit while leaving unsupported price ranges blank. Upgrade only if audited operating data supports durable growth and attractive cash economics, the fully diluted waterfall is understood, and entry terms offer an adequate return after dilution. A verified deterioration in ARR quality, customer retention, card-related losses, or senior preference claims would invalidate the bull case and lower the acceptable entry price.",
      "claimRefs": [
