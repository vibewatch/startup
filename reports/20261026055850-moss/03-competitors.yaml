  evidenceGaps:
    - type: missing-source
      severity: material
      topic: buyer_substitutes
      missingEvidence: Buyer interviews or procurement records that quantify use of spreadsheets, ERP-only workflows, internal builds, and specialist alternatives.
      whyItMatters: Without the status-quo and build-versus-buy mix, the addressable competitive set and Moss's displacement opportunity remain incomplete.
      diligencePath: Request recent win/loss analyses and interview finance buyers who chose Moss, a competitor, an ERP module, or an internal process.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP001]
    - type: private-evidence-only
      severity: material
      topic: pricing_and_switching
      missingEvidence: Comparable vendor quotes, discounts, contract minimums, migration costs, renewal terms, customer multi-homing, and switching outcomes.
      whyItMatters: Public feature pages do not establish the buyer's total cost or whether integrations create durable retention rather than convenience.
      diligencePath: Obtain anonymized contracts and cohort-level churn, expansion, migration, and win/loss data for comparable customers.
      relatedQuestionRefs: [QP004, QP006]
      relatedTableRefs: [TP002, TP003]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor_profiles
      missingEvidence: Direct current product, pricing, customer-segment, and scale evidence for each market-listed provider and likely entrants.
      whyItMatters: OMR and TBRC provide provider lists rather than an exhaustive, comparable competitive census or relative market positions.
      diligencePath: Verify the shortlist against procurement data and obtain direct product, pricing, and customer references for the most frequently encountered alternatives.
      relatedQuestionRefs: [QP002, QP003]
      relatedTableRefs: [TP001, TP002]
