tables:
  - id: TP001
    title: Competitor, incumbent, and substitute map
    columns: [Alternative or group, Category, Evidence in assigned sources, Limitation]
    rows:
      - [Moss, "Direct spend-management baseline", "Cards, invoices, reimbursements, controls, procurement, and accounting connections are described in Moss's current materials.", "Company claims and third-party reporting do not establish relative product performance or market share."]
      - [Spendesk, "Direct spend-management alternative", "Its page describes cards, reimbursements, invoice payments, controls, integrations, and transaction-based variable fees.", "No fee amounts or independently tested feature comparisons are provided."]
      - [Ramp, "Direct or adjacent spend platform", "Its supplied page lists card, expense, accounts-payable, accounts-receivable, procurement, and accounting capabilities.", "The retained page does not establish European coverage, contract pricing, or comparative outcomes."]
      - [Basware / Bill.com / Coupa / SAP Concur / Tipalti, "European AP-automation market-listed providers", "OMR names these firms among major companies operating in its European AP-automation market.", "The list is not a market-share ranking and does not establish equal overlap with Moss."]
      - [Oracle / SAP / Workday / Coupa / Basware / others, "Global spend-management or finance-suite adjacency", "The Business Research Company lists these firms among global spend-management platform companies.", "Geographic fit and product-level overlap require vendor-specific evidence."]
      - [Brex / Payhawk / Expensify / Mesh / others, "Other named specialist vendors; entrant status unverified", "The Business Research Company includes these firms in its global spend-management roster.", "The page does not establish entry dates, scale, funding, or comparable product scope."]
      - [Manual process or existing ERP workflow, "Status-quo substitute", "Not evidenced in the assigned source text.", "Buyer interviews and procurement records are needed to estimate use and switching triggers."]
      - [Internal finance-tool build, "Build alternative", "Not evidenced in the assigned source text.", "No evidence identifies how often Moss prospects build or maintain internal tools."]
    notes: "Market-source company lists are not a complete census or independent competitor benchmark. The fetched OMR page has scope inconsistencies, and TBRC labels its chart illustrative; treat these as candidate lists only. Rows with no direct evidence are explicitly marked."
    claimRefs: [CP001, CP008, CP009, CP012, CP013, CP016]
  - id: TP002
    title: Feature and capability evidence matrix
    columns: [Buying criterion, Moss, Spendesk, Ramp, Other listed providers]
    rows:
      - ["Cards and spend controls", "Physical/virtual cards, limits, budgets, and approval controls described.", "Unlimited cards, controls, budgets, and policy workflows described.", "Corporate card, card controls, and credit-limit features listed.", "Not evidenced for named peers in the assigned source text."]
      - ["Expense and reimbursement workflow", "Employee reimbursements and receipt capture/matching described.", "Expense reimbursement and receipt handling described.", "Expense management, reimbursements, and receipt matching listed.", "Not evidenced for named peers in the assigned source text."]
      - ["Invoices and accounts payable", "Invoice management, approval, and payment workflows described.", "Invoice payments appear in the pricing-unit description.", "Invoice capture, bill payment, and AP workflows listed.", "Market-list inclusion alone does not establish vendor-specific features."]
      - ["Accounting and integrations", "Moss's homepage states 40+ accounting, ERP, HR, and productivity connections.", "Page names Xero, QuickBooks, DATEV, and other integrations.", "Accounting integrations and automation are listed; connector count is not stated.", "Not evidenced for named peers in the assigned source text."]
      - ["Procurement and purchase flows", "Purchase requests, controls, and procurement workflows described.", "Purchase orders and procurement add-on features appear in its page.", "Procurement is listed as an add-on capability.", "Not evidenced for named peers in the assigned source text."]
    notes: "This matrix records what the supplied pages disclose, not audited feature availability, implementation quality, or like-for-like product equivalence; unsupported cells remain explicit."
    claimRefs: [CP001, CP002, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider, Disclosed mechanism, Price amount visible, Unknowns and implication]
    rows:
      - [Moss, "No monetary price or pricing formula is visible in the assigned Moss product pages.", "No", "List price, discounting, interchange share, minimums, and realized contract terms are unknown."]
      - [Spendesk, "Fixed monthly platform fee plus variable fees based on transaction usage; unlimited users and no active-user fee are stated.", "No", "Fee amounts, volume bands, card economics, and negotiated discounts are unknown."]
      - [Ramp, "The assigned page presents a feature grid across product areas; no subscription amount appears in the retained text.", "No", "Plan-specific availability, regional terms, and negotiated pricing are unknown."]
    notes: "Observed disclosure in the assigned pages only; no numeric prices, realized customer contracts, discounts, or total-cost comparisons were available."
    claimRefs: [CP012, CP013, CP016]
