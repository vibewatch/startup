      - ["Wellness and health services", "Employee/member and employer", "Telemedicine, mental-health and preventive features described in 2025 interview", "Combines prevention with benefits utilization", "Obtain provider roster, service levels and measured outcomes"]
      - ["Buddy AI health guide", "Employee/member", "Active feature direction; App Store says it asks questions and interview describes 24/7 assistance", "Contextualizes plan, habit and goal information", "Validate model safeguards, escalation, consent and clinical boundaries"]
    notes: Public descriptions mix product claims and partner-reported capabilities; maturity is not a substitute for independently measured deployment or reliability evidence.
