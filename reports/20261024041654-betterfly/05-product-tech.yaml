chapter:
  number: 5
  title: Product & Technology
  summary: Betterfly delivers a gamified employee-benefits platform that links wellness activity to insurance, rewards, and social impact. Public evidence supports a functioning mobile product, partner-enabled insurance distribution, and a newer AI-guided health experience, but leaves material questions about technical reliability, data governance, and production-scale outcomes.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      Betterfly's product is a B2B2C benefits layer: an employer makes the service available, an employee uses a mobile experience to understand benefits and complete health activities, and insurer and health-service partners supply regulated or clinical components. Chubb described the 2021 model as an embedded-insurance B2B2C model in which healthy behavior generated charitable donations and life-insurance protection that grew at no cost. The product surface has since broadened. A 2025 interview describes a gamified experience focused on helping employees understand and use benefits, with telemedicine, mental-health services, indemnity insurance, major-medical coverage in Mexico, and a planned preventive Health Plan 3.0. The public workflow is therefore more than a wellness app: it is an engagement and orchestration layer whose value depends on benefit comprehension, repeated behavior, and partner execution. The principal diligence gap is whether the expanded promise is consistently available by country, employer plan, and insurance carrier rather than only described at platform level.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-maturity
    title: Architecture, integrations, and maturity
    body: >-
      The clearest public architecture evidence is a partner-integrated cloud and mobile model rather than a disclosed internal software stack. Chubb said its digital product distribution platform supplied multiple APIs, secure and scalable infrastructure, and digital claims capabilities for the alliance; Betterfly said its behavioral-science layer was AI-based. The App Store listing provides direct evidence of an active iOS distribution surface: version 2.128.0 added a rewards-interface improvement and made Buddy ask questions to personalize the experience, while the listing identifies health and fitness, contact, identifiers, and usage data associated with identity. A 2025 interview characterizes Buddy as a 24/7 AI-powered assistant using plan and personal context to provide tailored recommendations. These signals indicate ongoing product iteration and data-rich personalization, but they do not prove uptime, model quality, API latency, clinical validation, security controls, or uniform deployment across partners. Those items should remain explicit implementation and trust diligence requests.
      Google Play's current product description adds a benefit-explanation surface, habit tracking, rewards, and Buddy guidance based on results, habits, and goals. The listing is company-supplied product evidence rather than independent validation, but it helps establish the intended live mobile workflow.
    claimRefs: [CE005, CE006, CE007, CE008, CE016]
  - id: differentiation-and-risks
    title: Differentiation and execution risks
    body: >-
      Betterfly's differentiation is the combination of behavior-linked protection, wellness engagement, and social-impact rewards, supported by insurer distribution rather than a standalone consumer app. The Digital Insurer describes the platform as merging wellness, financial inclusion, and insurance through gamification, with AI-driven personalization, wearable integration, and a cloud-based system; because the deck says its images are sourced from Betterfly, these are best treated as a structured secondary description of company materials, not independent technical verification. The product also depends on country-level adaptation: management said Mexico requires connecting insurers, providers, employers, and individuals in a fragmented system, while a restructuring report says the company concentrated on Chile, Mexico, and Spain, where it said the product was more consolidated and generated 94% of revenue. That retrenchment is both a prioritization signal and a portability risk. GetLatka's current taxonomy places Betterfly across corporate wellness, employee engagement, benefits administration, and HR software, illustrating product breadth but not technical depth. Product diligence should test partner dependency, privacy and consent handling, benefits accuracy, claims handoffs, clinical boundaries for AI guidance, and whether the architecture can support future U.S. expansion without recreating fragmented operations.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE003]
