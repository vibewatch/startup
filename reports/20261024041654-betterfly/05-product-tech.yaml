  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Betterfly solution, Measurable benefit, Limitation]
    rows:
      - ["Understand employer benefits", "Employee receives conventional plan information", "Gamified experience explains benefits and encourages use", "Better benefit comprehension is the stated objective", "No public before/after utilization or comprehension result"]
      - ["Build healthy habits", "Employee tracks sleep, movement, mindfulness or nutrition", "Activities earn rewards and may increase coverage", "Repeated engagement is the intended mechanism", "Persistence and incentive economics are not disclosed"]
      - ["Access protection", "Employer offers employee benefit and insurer supplies policy", "Digital embedded insurance with behavior-linked coverage", "Lower-friction access is the proposition", "Policy availability and claims performance vary by partner and market"]
      - ["Receive personalized guidance", "Employee has plan, health and goal context", "Buddy provides tailored recommendations", "Faster navigation of health choices is claimed", "AI accuracy, privacy and clinical escalation remain unverified"]
    notes: This table describes the publicly stated workflow; measurable benefit fields are intentionally qualified where no outcome denominator was published.
    claimRefs: [CE002, CE003, CE006, CE007, CE016]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Mobile experience", "Collect activity and present benefits", "Apple distribution and device health data", "Cross-platform parity, permissions and app reliability"]
      - ["Behavior and personalization layer", "Translate activity and plan context into rewards or guidance", "Health inputs, plan data and AI/Buddy logic", "Consent, explainability, model errors and clinical boundaries"]
      - ["Insurance distribution", "Provide policy and claims journey inside digital ecosystem", "Chubb Studio and local insurers", "Carrier APIs and country regulation; coverage accuracy, claims handoff and partner concentration"]
      - ["Health-service network", "Deliver telemedicine, mental-health and preventive services", "External providers and country-specific networks", "Service quality, availability and data-sharing controls"]
      - ["Employer administration", "Enroll employees and configure benefits", "Employer implementation and support teams", "Customer configuration and adoption; integration effort and benefit-communication quality"]
    notes: The operating architecture is reconstructed from public partner, product-listing and management descriptions; Betterfly has not publicly disclosed a complete internal stack or service-level design.
    claimRefs: [CE005, CE006, CE008, CE010, CE011]
