callouts:
  - calloutType: strength
    title: Integrated engagement-to-protection proposition
    body: Betterfly has a differentiated product narrative because healthy behavior, insurance protection, and social-impact rewards are presented as one employer-mediated workflow rather than separate benefits.
    claimRefs: [CE001, CE002, CE009]
  - calloutType: risk
    title: Partner and data-governance dependency
    body: The public architecture relies on insurers, providers, device data, employer configuration, and AI personalization; diligence should establish whether controls and service levels are consistent across markets.
    claimRefs: [CE005, CE006, CE008, CE010]
  - calloutType: insight
    title: Retrenchment tests portability
    body: The reported concentration on Chile, Mexico, and Spain suggests management is prioritizing markets where the product is more consolidated; the same fact raises a question about repeatability in new jurisdictions.
    claimRefs: [CE011, CE012]
