  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A current country-level SAM and SOM model separating employer benefits insurance and wellness spend for
      Betterfly’s active markets.
    whyItMatters: Broad market estimates do not establish the portion Betterfly can serve or win, which is central to adoption
      timing and valuation.
    diligencePath: Request management’s 2026 market model with segment definitions geographies price assumptions pipeline
      conversion and sensitivity cases.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Current employer budget ownership win rates utilization retention and outcomes by segment and geography.
    whyItMatters: The public record describes the value proposition but does not show whether employers renew or whether wellness
      and insurance outcomes justify spend.
    diligencePath: Obtain anonymized cohort renewal utilization claims and customer-reference evidence from Chile Mexico Spain
      Brazil and the United States pipeline.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A scope-reconciled comparison between the corporate-wellness estimate and the 11-sector wellness-economy
      estimate.
    whyItMatters: The figures differ by scope and cannot support a single market multiple without reconciliation.
    diligencePath: Have management or an independent market adviser map Betterfly revenue categories to each published market
      taxonomy.
