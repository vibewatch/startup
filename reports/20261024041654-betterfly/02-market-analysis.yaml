company:
  name: Betterfly
chapter:
  number: 2
  title: Market Analysis
  summary: Betterfly sits in a narrower employer-benefits and embedded-insurance market than the headline wellness economy.
    Public sizing supports a sizable but non-additive opportunity, while employer budget ownership, insurance penetration,
    engagement outcomes and country-level serviceable market remain the main underwriting gaps.
sections:
- id: market-boundary
  title: Market boundary and demand context
  body: 'Betterfly’s addressable context is employer-sponsored benefits that combine wellness engagement, digital health access
    and insurance protection. The platform is not equivalent to the full wellness economy: the Global Wellness Institute’s
    USD 6.3 trillion 2023 figure aggregates 11 industries, while Betterfly’s proposition is a B2B2C benefits and insurance
    workflow. Within the boundary, substitutes include conventional group life and health benefits, standalone employee-assistance
    or wellness vendors, insurer distribution channels, and internal HR benefits programs. That distinction matters because
    a broad wellness total can signal demand but cannot be treated as Betterfly revenue opportunity. WHO’s workplace evidence
    and Gallup’s engagement data support the underlying employer pain point, not a company-specific conversion rate.'
  claimRefs:
  - CM001
  - CM003
  - CM006
  - CM007
  - CM008
  - CM009
  tableRefs:
  - TM001
- id: sizing-and-segments
  title: Sizing lenses and buyer segmentation
  body: 'The strongest public sizing lens is Grand View Research’s corporate wellness estimate: USD 55.1 billion in 2025,
    USD 56.7 billion in 2026 and USD 70.1 billion in 2033 at 3.1% CAGR. Its segmentation points to large organizations and
    employer buyers, but it is an analyst estimate with a stated source mix of documents, interviews and paid databases. The
    Global Wellness Institute provides a larger adjacent lens, useful for category context but not additive to corporate wellness.
    Betterfly’s historical $4-per-employee-per-month starting price and carrier partnerships show a possible entry path, yet
    public evidence does not disclose current pricing, conversion, retention or budget allocation by country. The sizing table
    therefore preserves methodologies and limits instead of forcing a TAM/SAM/SOM bridge.'
  claimRefs:
  - CM002
  - CM004
  - CM005
  - CM006
  - CM011
  - CM014
  - CM015
  - CM016
  tableRefs:
  - TM002
  - TM003
  figureRefs:
  - FM001
- id: drivers-and-constraints
  title: Adoption drivers, constraints and valuation relevance
  body: 'Demand drivers are concrete: WHO quantifies the productivity cost of depression and anxiety; Gallup documents low
    engagement and a gap between individual AI productivity and organizational transformation; Mexico Business reports low
    insurance penetration, benefit-understanding friction and medical-cost inflation. These drivers support employer interest
    in prevention, engagement and navigation, but they also raise the proof bar. Trust in insurance, carrier economics, regulatory
    compliance, data governance, and the ability to demonstrate utilization or claims outcomes can slow adoption. Betterfly’s
    Chubb alliance and multi-country footprint reduce distribution friction, yet they do not prove independent demand or unit
    economics. For valuation, the opportunity is credible but the public record cannot convert category growth into Betterfly’s
    SAM, SOM, revenue growth or durable retention.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
