      - Strategic value
      - Evidence gap
    rows:
      - [Employer-sponsored benefits, "HR / benefits leadership", Employees, Employer, "Integrated insurance and wellbeing subscription", "Core B2B2C route", "No segment revenue, seat count, or renewal disclosure"]
      - [Insurance-carrier distribution, Chubb, "Chubb consumer-line insureds", "Not disclosed", "Five-country Latin American alliance announced in 2021", "Extends distribution beyond direct employer sales", "No activation, premium, or conversion data"]
      - [Mexico health-product adopters, "Employer benefits teams", Employees, Employer, "Around 50 companies reported in May 2025", "Tests preventive-health proposition in a priority market", "No named cohort, seats, utilization, or revenue"]
      - [minu financial-benefit footprint, "Employer benefits and payroll teams", Employees, Employer, "Combined platform reported above one million employees across 4,000 companies", "Adds compensation and financial-wellness entry points", "Legacy minu and Betterfly adoption are not disaggregated"]
      - [Employee app users, "Employer or distribution partner", Employees, "Employer-paid core benefits; optional top-ups described historically", "Habit tracking, benefit education, rewards, insurance, and health guidance", "Creates a recurring engagement surface", "No MAU, activation, completion, or benefit-use rate"]
    notes: >-
      Scale figures are source-reported snapshots from different dates and scopes; they
      must not be summed or treated as current retained-customer counts.
    claimRefs: [CU001, CU002, CU005, CU007, CU008, CU010, CU013]
  - id: TU002
    title: Public customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period / date
      - Attribution
      - Confidence
      - Implication
      - Missing denominator or qualifier
    rows:
      - ["Companies offering Betterfly", "More than 2,500", "Reported in 2022 for 2021", InvestChile, Medium, "Evidence of early employer distribution scale", "No paying-account, active-user, or renewal denominator"]
      - ["Company-count growth", "60x", "2021", "CEO quoted by InvestChile", Medium, "Rapid early expansion", "Starting base and cohort survival are not disclosed"]
      - ["Starting subscription price", "$4 per employee per month", "June 2021", "Betterfly release via Business Wire", Medium, "Historically low-friction employer entry point", "Current pricing, realized price, and attach rates are unknown"]
      - ["Operating countries", "Eight named markets", "January 2024", "FT Partners profile using company information", Medium, "Broad geographic footprint", "No country-level customer, revenue, or retention mix"]
      - ["Mexican health-product adopters", "Around 50 companies", "May 2025", "Betterfly co-founder interview", Medium, "Some direct health-product adoption in Mexico", "No seats, utilization, contract value, or renewal data"]
      - ["Combined Mexico reach after minu", "More than 1 million employees / 4,000 companies", "Publication date unavailable", LATAM Republic, Medium, "Large addressable installed base for cross-sell", "Legacy minu versus Betterfly users and paying status are not split"]
      - ["Chilean iOS rating", "2.7 / 5 from 204 ratings", "Observed 2026-10-24", "Apple App Store", Medium, "Material negative user-experience signal", "Rating distribution, review dates, and account mix are unavailable"]
    notes: >-
      Values retain their original metric names and periods. Different company, country,
      employee, price, and app-rating measures are not a common funnel or cohort.
    claimRefs: [CU003, CU004, CU005, CU006, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Organization
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - [Grupo Modelo, Enterprise employer, "Financial benefits associated with minu", "Described as already in use", "Not disclosed", "No Betterfly module, deployment date, usage, or renewal evidence"]
      - [Liverpool, Enterprise employer, "Financial benefits associated with minu", "Described as already in use", "Not disclosed", "No Betterfly module, deployment date, usage, or renewal evidence"]
      - ["Televisa Univision", Enterprise employer, "Financial benefits associated with minu", "Described as already in use", "Not disclosed", "No Betterfly module, deployment date, usage, or renewal evidence"]
      - [Coppel, Enterprise employer, "Financial benefits associated with minu", "Described as already in use", "Not disclosed", "No Betterfly module, deployment date, usage, or renewal evidence"]
      - [Avis, Enterprise employer, "Financial benefits associated with minu", "Described as already in use", "Not disclosed", "No Betterfly module, deployment date, usage, or renewal evidence"]
    notes: >-
      This is a sample of names disclosed by LATAM Republic for minu-linked financial
      benefits; it does not establish use of Betterfly health or insurance modules.
    enumerationScope:
      coverage: sample
      basis: >-
        Organizations explicitly named in the retained LATAM Republic article about the
        minu acquisition; no complete customer roster was available.
    claimRefs: [CU005, CU010, CU011]
