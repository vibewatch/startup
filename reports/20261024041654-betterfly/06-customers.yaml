  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        NRR, GRR, logo and seat churn, renewal rates, contract duration, revenue
        concentration, utilization cohorts, and expansion by country and product.
      whyItMatters: >-
        Public reach cannot establish durable customer value or concentration-adjusted
        revenue quality without cohort and contract evidence.
      diligencePath: >-
        Request monthly customer and seat cohorts, renewal files, top-20 account revenue,
        contract terms, product attach rates, and country-level utilization for 2024-2026.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        A complete current customer roster identifying product modules, production start,
        employee activation, measured outcomes, renewal status, and contract value.
      whyItMatters: >-
        The five public names relate to acquired minu offerings and do not prove adoption
        of Betterfly health, insurance, or engagement modules.
      diligencePath: >-
        Obtain ten referenceable customers across Chile, Mexico, Spain, and the United
        States, then validate use and outcomes directly with buyer and user references.
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: material
      topic: user-satisfaction
      missingEvidence: >-
        Review-level analysis and support-ticket data explaining the 2.7/5 Chilean iOS
        rating, including rating trend, version effects, countries, and account cohorts.
      whyItMatters: >-
        A low aggregate rating may indicate onboarding, reliability, or value problems,
        but the public listing does not expose causes or commercial impact.
      diligencePath: >-
        Review the full rating distribution and recent comments, then compare them with
        support contacts, app retention, incident history, and employer renewal cohorts.
