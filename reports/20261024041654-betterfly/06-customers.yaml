          detail: "Access can originate through an employer or an insurance distribution partner."
          touchpoints: ["Employer subscription", "Chubb distribution alliance"]
        - id: enrollment
          label: Employee enrollment
          detail: "Employees receive access to the app and the sponsored benefit set."
          touchpoints: ["Mobile app", "Benefit coverage"]
        - id: orientation
          label: Benefit orientation
          detail: "The product explains coverage and guides users toward available care and benefits."
          touchpoints: ["Benefit explanations", "Buddy guidance"]
        - id: recurring-engagement
          label: Recurring engagement
          detail: "Habits, challenges, rewards, donations, and coverage growth create repeat-use prompts."
          touchpoints: ["Habit tracking", "Rewards", "Insurance coverage"]
        - id: renewal-expansion
          label: Renewal and expansion
          detail: "The intended loop is broader use and account expansion, but public renewal evidence is absent."
          touchpoints: ["Cross-sell", "Renewal", "Geographic expansion"]
    approximationNotes: >-
      This is a mechanism map, not a measured conversion funnel; no stage conversion
      rates or cohort retention values were disclosed.
    claimRefs: [CU007, CU008, CU013, CU014]
