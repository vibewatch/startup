schemaVersion: "report-v2"
artifact: customers
slug: betterfly
runDate: 2026-10-24
company:
  name: Betterfly
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows a B2B2C customer model with employers and insurance partners
    distributing benefits to employees, plus meaningful historical scale claims across
    Latin America and Spain. The evidence does not disclose retention, concentration,
    contract duration, or post-acquisition cohort economics, while a 2.7/5 Chilean App
    Store rating is a tangible adverse adoption signal.
sections:
  - id: customer-architecture
    title: Buyer, user, payer, and channel architecture
    body: >-
      Betterfly's public customer architecture is employer-led: organizations buy or
      sponsor a digital benefits subscription, while employees use insurance, wellness,
      rewards, and social-impact features. Chubb's 2021 alliance adds a second route to
      market, making Betterfly available to Chubb consumer-line insureds through existing
      distribution channels in Mexico, Colombia, Ecuador, Chile, and Argentina. In Mexico,
      the acquired minu platform broadens the proposition from health and insurance into
      compensation and financial wellness. That combination may increase relevance to HR
      and benefits buyers, but the retained sources do not reveal payer mix, average seats
      per employer, revenue by segment, or whether insurance-carrier distribution produces
      active usage. Public scale should therefore be read as ecosystem reach rather than a
      verified count of paying, retained Betterfly accounts.
    claimRefs: [CU001, CU002, CU005, CU010, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and engagement surfaces
    body: >-
      The strongest trajectory disclosures are point-in-time and not fully comparable.
      InvestChile reported more than 2,500 companies in 2022 after a sixty-fold increase
      during 2021; an FT Partners profile listed operations in eight countries in January
      2024; and Betterfly's co-founder said in May 2025 that roughly 50 Mexican companies
      had adopted its health products. A later account of the minu acquisition described
      a combined reach above one million employees across 4,000 Mexican companies, but it
      did not disaggregate legacy minu users from Betterfly users. The product offers
      repeat engagement loops through habit tracking, rewards, benefit explanations, and
      an AI guide, yet public reach, enrollment, monthly activity, benefit utilization,
      and paid-account retention remain different measures and should not be conflated.
    claimRefs: [CU003, CU004, CU005, CU007, CU008, CU010, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named proof and reference quality
    body: >-
      The retained evidence names Grupo Modelo, Liverpool, Televisa Univision, Coppel,
      and Avis as users of financial-benefit offerings associated with minu. This is
      useful production-use evidence for the acquired Mexican footprint, but it is not
      the same as proof that those organizations use Betterfly's insurance, preventive
      health, or rewards modules. Chubb is better understood as a distribution and
      insurance partner than as an ordinary employer customer. The available references
      also omit deployment dates, employee activation, measured outcomes, renewal status,
      and contract value. Consequently, the named-customer set demonstrates recognizable
      enterprise access but does not yet establish cross-sell, durable adoption, or
      comparable outcomes across Betterfly's markets.
    claimRefs: [CU002, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration risk
    body: >-
      Public materials describe mechanisms intended to support expansion: benefit
      education, personalized support, daily habit rewards, and broader health and
      financial-benefit bundles. In 2021, QED said employer and employee response had
      exceeded its expectations, but that investor quotation predates subsequent market
      expansion and is not a retention metric. No retained source reports NRR, GRR,
      churn, renewal rates, contract length, customer concentration, or cohort-level
      utilization. The Chilean App Store displayed a 2.7/5 rating from 204 ratings at
      retrieval, an adverse user signal that deserves review-level analysis rather than
      dismissal, while a low-reputation Startup Autopsy page explicitly frames Betterfly
      as a unit-economics failure. These signals do not prove customer attrition, but they
      raise the diligence burden around satisfaction, engagement cost, and account
      profitability.
    claimRefs: [CU006, CU012, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Multi-channel access
    body: >-
      Employer subscriptions, an insurer distribution alliance, and the acquired minu
      footprint create several routes to employee access across multiple markets.
    claimRefs: [CU001, CU002, CU010]
  - calloutType: risk
    title: Reach is not retention
    body: >-
      Public company and employee counts are not accompanied by active-use, renewal,
      churn, revenue-concentration, or cohort evidence.
    claimRefs: [CU003, CU010, CU012]
