        - {label: Deel, x: 2, y: 5, note: "Global workforce workflow ownership; wellbeing and insurance scope not shown"}
    approximationNotes: "Coordinates are ordinal analyst placements from assigned source descriptions, not market-share, revenue, pricing, or independently benchmarked scores."
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP013, CP014]
