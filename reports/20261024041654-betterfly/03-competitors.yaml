    title: Capability matrix
    columns: [Buying criterion, Betterfly, Wellhub, Rippling, Gusto, Buk, Deel]
    rows:
      - [Wellbeing content and engagement, "Yes: gamified wellbeing, telemedicine, AI assistant claimed", "Yes: gyms, apps, coaching, nutrition, engagement campaigns", "Not shown on assigned page", "Not shown on assigned page", "Not shown on assigned page", "Not shown on assigned page"]
      - [Embedded or employee insurance, "Yes: life and other insurance described", "Not shown", "Benefits administration and marketplace; carrier model shown", "Health benefits and 401(k) administration", "Benefits and insurance module", "Not shown"]
      - [Financial wellness, "Yes: Minu acquisition adds earned wage access and savings tools", "Not shown", "Not shown", "401(k) and payroll-linked financial benefits", "Advances and finance modules", "Financial management workflows"]
      - [Payroll and HR system of record, "Not established", "Program administration and usage tracking", "Yes", "Yes", "Yes", "Yes"]
      - [Global distribution, "Four markets and planned U.S. entry reported; current breadth needs verification", "18 countries plus digital access in additional countries", "Global HR platform positioning", "Primarily U.S. small-business positioning on assigned page", "Chile-native compliance and regional expansion not quantified", "International workforce positioning"]
      - [Regulatory or trust posture, "Carrier alliance and insurance relationships; retention proof unavailable", "Operational scale and internal studies, no insurance evidence", "Benefits compliance workflows", "Payroll and benefits compliance workflows", "ISO 27001, SOC 2, Chilean regulatory certifications claimed", "Security or insurance evidence not shown"]
    notes: "Cells summarize only assigned source text. 'Not shown' is an evidence boundary, not a claim that the capability does not exist."
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider, Price or contract model, Included capabilities described, Discount or unknowns, Competitive implication]
    rows:
      - [Betterfly, "$4 per employee per month starting price in 2021 company release", "Smart life insurance, wellbeing tools, telemedicine, mental health, fitness, meditation, nutrition, financial education", "Current price, realized price, country variation, and discounts unknown", "Low historical entry price supported a broad bundle, but current monetization is unverified"]
      - [Wellhub, "Annual corporate contract; monthly payment at annual rates based on team size and investment level", "Network access, administration, adoption campaigns, ROI tracking, employee monthly subscriptions", "Exact rates and employer contribution unknown", "Contracted employer program and network breadth may strengthen distribution and renewal"]
      - [Rippling, "Price not shown on assigned page", "Benefits administration, payroll sync, compliance, enrollment, marketplace, AI processing", "Pricing, implementation cost, and discounts unknown", "Bundling can reduce the buyer's need for a separate benefits platform"]
      - [Gusto, "Price not shown on assigned page", "Payroll, health benefits, 401(k), time, hiring, HR, compliance", "Pricing, plan tiers, and insurance economics unknown", "Small-business distribution and payroll ownership can displace point solutions"]
      - [Buk, "Monthly price per active employee; modules can be contracted independently", "Payroll, attendance, benefits, talent, finance, AI, compliance", "Exact price and discounts require simulator or sales contact", "Regional localization and modularity may compete for the same HR budget"]
      - [Deel, "Price not shown on assigned page", "Payroll, contracts, compliance, invoices, transactions, global workforce workflows", "Exact price and wellbeing or insurance packaging unknown", "International workforce ownership may be an adjacency rather than direct wellbeing competition"]
    notes: "Pricing is not normalized across currencies, geographies, employee populations, or contract terms. The Betterfly figure is historical company-issued list pricing, not current realized revenue."
    claimRefs: [CP008, CP009, CP010, CP011, CP016]
