      - [Gusto, "Payroll and benefits incumbent", "500,000+ businesses reported on company page", "Small and midsize U.S. businesses", "Payroll, health benefits, 401(k), time, hiring, compliance", "U.S.-centric scope and no embedded insurance comparison"]
      - [Buk, "Regional HR and finance incumbent", "Serves firms from 5 to more than 15,000 employees", "Chilean and Latin American employers", "Localized payroll compliance plus talent, benefits, and finance modules", "Public page does not establish Betterfly overlap or customer switching costs"]
      - [Deel, "Global workforce platform", "Global payroll, contracts, compliance, and financial workflows", "Distributed and international employers", "Workforce administration and cross-border compliance", "Wellbeing and insurance depth is not evidenced on the assigned page"]
      - [Internal build or broker status quo, "Substitute", "No public scale metric", "Employers using existing HR, brokers, carriers, and wellness vendors", "Control, customization, and incumbent relationships", "No assigned source quantifies switching costs, implementation time, or total cost"]
    notes: "Scale signals are issuer-reported and use different populations and periods; null or qualitative entries mean no comparable public metric was found in the assigned pool."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP013, CP014, CP015]
