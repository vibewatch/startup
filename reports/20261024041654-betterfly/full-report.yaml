figures:
  - id: FO001
    title: Betterfly company milestone timeline
    type: timeline
    summary: >-
      Betterfly progressed from a 2018 habit-and-impact origin to major financing, regional insurance partnerships,
      product redesign, and a 2026 Minu acquisition.
    data:
      items:
        - date: '2018'
          label: '2018'
          title: Founded as Burn to Give
          details: Eduardo and Cristóbal della Maggiora founded the company and its habit-linked social-impact model.
          tone: positive
          claimRefs:
            - CO001
        - date: '2020-12-30'
          label: Series A
          title: Series A
          details: Tracxn records a $9M Series A; a later company announcement describes the Series A as $18M.
          tone: positive
          claimRefs:
            - CO006
            - CO009
        - date: '2021-06-16'
          label: Series B
          title: Series B
          details: Betterfly announced a $60M Series B, bringing reported equity raised to $80M.
          tone: positive
          claimRefs:
            - CO009
        - date: '2021-12-02'
          label: '2021'
          title: Chubb alliance
          details: Chubb announced a preferred-provider and distribution alliance across five Latin American countries.
          tone: positive
          claimRefs:
            - CO005
        - date: '2022-02-01'
          label: '2022'
          title: Series C and unicorn valuation
          details: Sources report a $125M Series C and a $1B valuation.
          tone: positive
          claimRefs:
            - CO006
            - CO008
        - date: '2022'
          label: '2022'
          title: Mexico operations begin
          details: A 2025 interview states that Betterfly began Mexican operations in 2022.
          tone: positive
          claimRefs:
            - CO014
