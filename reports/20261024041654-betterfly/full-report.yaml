      - number: '1.2'
        title: Founders, funding, and scale
        blocks:
          - type: paragraph
            body: >-
              The founders are Eduardo and Cristóbal della Maggiora, with Eduardo repeatedly identified as founder and
              CEO in company and partner materials. Public funding records converge on a $60 million Series B in June
              2021 and a $125 million Series C in February 2022, but the Series A amount conflicts: Tracxn records $9
              million, while Betterfly’s syndicated announcement says $18 million. Totals also vary by source: Indexed
              reports $194 million over three rounds, while Contxto reports $202.5 million after the Series C. These
              differences are not safely reconciled because the sources use different round-count and inclusion
              conventions. The evidence supports a historic $1 billion valuation, not a current valuation or available
              cash balance. Headcount also conflicts materially across the evidence, so the chapter treats mixed-vintage
              figures as signals rather than a current cover metric.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
