      - number: '1.3'
        title: Milestones, partnerships, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Betterfly’s expansion story is partnership-led and acquisition-led. Chubb supplied an
              insurance-distribution relationship in five Latin American countries, while the 2026 Minu transaction
              added financial-wellness capabilities and a Mexico customer base. A 2025 interview describes two platform
              revamps since 2022 and a more gamified product, but it is a company interview and does not independently
              verify adoption. Historical plans to expand across Latin America, the United States, Spain, and Portugal
              were ambitious; later evidence gives a specific U.S. pilot and January 2027 commercial-launch plan, which
              should be treated as a forward plan rather than an achieved milestone. The central diligence gaps are
              current cash and burn, current headcount and customers, cap table and control, post-Minu integration, and
              market-by-market regulatory execution.
