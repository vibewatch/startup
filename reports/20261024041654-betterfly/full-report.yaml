chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Betterfly originated in Chile in 2018 as Burn to Give, founded by brothers Eduardo and Cristóbal della
              Maggiora, and evolved from habit-linked charitable giving into an employer-sponsored benefits platform.
              The product combines wellness engagement, insurance, and social purpose: employers pay for membership
              while employees receive benefits and can earn or increase protection through healthy behaviors. Chubb
              described the model as embedded-insurance B2B2C and identified Mexico, Colombia, Ecuador, Chile, and
              Argentina as its initial preferred-provider footprint. Retained official website content positions the
              proposition around voluntary insurance, health insights, missions, rewards, and employer reporting. The
              model therefore depends on both recurring employer distribution and insurer or local-market partnerships;
              the public evidence does not establish current retention, margin, or contribution economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
