      - number: '5.2'
        title: Architecture, integrations, and maturity
        blocks:
          - type: paragraph
            body: >-
              The clearest public architecture evidence is a partner-integrated cloud and mobile model rather than a
              disclosed internal software stack. Chubb said its digital product distribution platform supplied multiple
              APIs, secure and scalable infrastructure, and digital claims capabilities for the alliance; Betterfly said
              its behavioral-science layer was AI-based. The App Store listing provides direct evidence of an active iOS
              distribution surface: version 2.128.0 added a rewards-interface improvement and made Buddy ask questions
              to personalize the experience, while the listing identifies health and fitness, contact, identifiers, and
              usage data associated with identity. A 2025 interview characterizes Buddy as a 24/7 AI-powered assistant
              using plan and personal context to provide tailored recommendations. These signals indicate ongoing
              product iteration and data-rich personalization, but they do not prove uptime, model quality, API latency,
              clinical validation, security controls, or uniform deployment across partners. Those items should remain
              explicit implementation and trust diligence requests. Google Play's current product description adds a
              benefit-explanation surface, habit tracking, rewards, and Buddy guidance based on results, habits, and
              goals. The listing is company-supplied product evidence rather than independent validation, but it helps
              establish the intended live mobile workflow.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
      - number: '5.3'
        title: Differentiation and execution risks
        blocks:
          - type: paragraph
            body: >-
              Betterfly's differentiation is the combination of behavior-linked protection, wellness engagement, and
              social-impact rewards, supported by insurer distribution rather than a standalone consumer app. The
              Digital Insurer describes the platform as merging wellness, financial inclusion, and insurance through
              gamification, with AI-driven personalization, wearable integration, and a cloud-based system; because the
              deck says its images are sourced from Betterfly, these are best treated as a structured secondary
              description of company materials, not independent technical verification. The product also depends on
              country-level adaptation: management said Mexico requires connecting insurers, providers, employers, and
              individuals in a fragmented system, while a restructuring report says the company concentrated on Chile,
              Mexico, and Spain, where it said the product was more consolidated and generated 94% of revenue. That
              retrenchment is both a prioritization signal and a portability risk. GetLatka's current taxonomy places
              Betterfly across corporate wellness, employee engagement, benefits administration, and HR software,
              illustrating product breadth but not technical depth. Product diligence should test partner dependency,
              privacy and consent handling, benefits accuracy, claims handoffs, clinical boundaries for AI guidance, and
              whether the architecture can support future U.S. expansion without recreating fragmented operations.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE010
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated engagement-to-protection proposition
            body: >-
              Betterfly has a differentiated product narrative because healthy behavior, insurance protection, and
              social-impact rewards are presented as one employer-mediated workflow rather than separate benefits.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE009
          - type: callout
            title: Partner and data-governance dependency
            body: >-
              The public architecture relies on insurers, providers, device data, employer configuration, and AI
              personalization; diligence should establish whether controls and service levels are consistent across
              markets.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE010
          - type: callout
            title: Retrenchment tests portability
            body: >-
              The reported concentration on Chile, Mexico, and Spain suggests management is prioritizing markets where
              the product is more consolidated; the same fact raises a question about repeatability in new
              jurisdictions.
            calloutType: insight
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and channel architecture
        blocks:
          - type: paragraph
            body: >-
              Betterfly's public customer architecture is employer-led: organizations buy or sponsor a digital benefits
              subscription, while employees use insurance, wellness, rewards, and social-impact features. Chubb's 2021
              alliance adds a second route to market, making Betterfly available to Chubb consumer-line insureds through
              existing distribution channels in Mexico, Colombia, Ecuador, Chile, and Argentina. In Mexico, the acquired
              minu platform broadens the proposition from health and insurance into compensation and financial wellness.
              That combination may increase relevance to HR and benefits buyers, but the retained sources do not reveal
              payer mix, average seats per employer, revenue by segment, or whether insurance-carrier distribution
              produces active usage. Public scale should therefore be read as ecosystem reach rather than a verified
              count of paying, retained Betterfly accounts.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU010
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU008
              - CU010
              - CU013
      - number: '6.2'
        title: Adoption trajectory and engagement surfaces
        blocks:
          - type: paragraph
            body: >-
              The strongest trajectory disclosures are point-in-time and not fully comparable. InvestChile reported more
              than 2,500 companies in 2022 after a sixty-fold increase during 2021; an FT Partners profile listed
              operations in eight countries in January 2024; and Betterfly's co-founder said in May 2025 that roughly 50
              Mexican companies had adopted its health products. A later account of the minu acquisition described a
              combined reach above one million employees across 4,000 Mexican companies, but it did not disaggregate
              legacy minu users from Betterfly users. The product offers repeat engagement loops through habit tracking,
              rewards, benefit explanations, and an AI guide, yet public reach, enrollment, monthly activity, benefit
              utilization, and paid-account retention remain different measures and should not be conflated.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU010
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU008
              - CU013
              - CU014
      - number: '6.3'
        title: Named proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              The retained evidence names Grupo Modelo, Liverpool, Televisa Univision, Coppel, and Avis as users of
              financial-benefit offerings associated with minu. This is useful production-use evidence for the acquired
              Mexican footprint, but it is not the same as proof that those organizations use Betterfly's insurance,
              preventive health, or rewards modules. Chubb is better understood as a distribution and insurance partner
              than as an ordinary employer customer. The available references also omit deployment dates, employee
              activation, measured outcomes, renewal status, and contract value. Consequently, the named-customer set
              demonstrates recognizable enterprise access but does not yet establish cross-sell, durable adoption, or
              comparable outcomes across Betterfly's markets.
            claimRefs:
              - CU002
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU010
              - CU011
      - number: '6.4'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public materials describe mechanisms intended to support expansion: benefit education, personalized
              support, daily habit rewards, and broader health and financial-benefit bundles. In 2021, QED said employer
              and employee response had exceeded its expectations, but that investor quotation predates subsequent
              market expansion and is not a retention metric. No retained source reports NRR, GRR, churn, renewal rates,
              contract length, customer concentration, or cohort-level utilization. The Chilean App Store displayed a
              2.7/5 rating from 204 ratings at retrieval, an adverse user signal that deserves review-level analysis
              rather than dismissal, while a low-reputation Startup Autopsy page explicitly frames Betterfly as a
              unit-economics failure. These signals do not prove customer attrition, but they raise the diligence burden
              around satisfaction, engagement cost, and account profitability.
            claimRefs:
              - CU006
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-channel access
            body: >-
              Employer subscriptions, an insurer distribution alliance, and the acquired minu footprint create several
              routes to employee access across multiple markets.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: callout
            title: Reach is not retention
            body: >-
              Public company and employee counts are not accompanied by active-use, renewal, churn,
              revenue-concentration, or cohort evidence.
            calloutType: risk
            claimRefs:
              - CU003
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk
        blocks:
          - type: paragraph
            body: >-
              Execution and concentration are the leading evidenced risks. Independent reports say Betterfly closed
              Colombia, Ecuador, Peru, Argentina, and Brazil and dismissed 30 employees in 2025; one report also
              describes workforce reductions in 2022 and 2023. Management said Chile, Mexico, and Spain generated 94% of
              revenue, making the retrenchment economically coherent but leaving performance more exposed to three
              markets and a planned U.S. entry. Management also claimed more than five years of cash runway after
              lowering operating expense, but neither report supplies current cash, burn, debt, or the assumptions
              behind that runway. The investment implication is therefore to treat geographic focus as an unproven
              mitigation rather than evidence that execution risk has normalized.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory, privacy, and AI boundaries
        blocks:
          - type: paragraph
            body: >-
              Betterfly's public product descriptions place it near several conditional U.S. compliance boundaries
              without establishing which rules apply to each entity or data flow. The product has been described as
              tracking activity through Apple Health, Google Fit, and Strava, while the Buddy assistant is intended to
              use health-plan data and personal attributes to provide tailored health guidance. FTC guidance says HIPAA
              status turns on whether an app operator is a covered entity or business associate; health apps outside
              HIPAA may instead fall under the FTC Act and Health Breach Notification Rule. FDA oversight can also turn
              on intended use and functionality. These are conditional exposures, not findings of noncompliance, and
              require a legal mapping of each product, jurisdiction, contracting entity, and data flow.
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: Operating and partner resilience
        blocks:
          - type: paragraph
            body: >-
              The operating model relies on user engagement, insurers, content providers, and connected platforms. Chubb
              was named Betterfly's preferred insurance provider across five Latin American countries in 2021, while
              later reporting identified Headspace, FitOn, and Udemy as benefit partners. Betterfly's own executive
              described the product approach as experimental, said the platform had been rebuilt twice since 2022, and
              framed Mexico's preventive plan as a test of whether the company can earn trust. This evidence
              demonstrates active iteration and partner reach, but does not disclose service levels, carrier replacement
              rights, claims performance, integration uptime, security controls, or revenue concentration by partner.
              Investment protection should therefore require contract, incident, and concentration evidence before
              crediting these dependencies as durable mitigations.
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR015
              - CR016
      - number: '7.4'
        title: Monitoring controls and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The near-term control set should focus on evidence that can falsify the execution thesis. Monthly
              reporting should reconcile cash, burn, debt, country revenue, user activity, renewal, claims, uptime,
              security events, carrier concentration, and U.S. regulatory milestones. A further country exit, another
              material workforce reduction, a missed U.S. launch milestone, loss of a core carrier, an unremediated
              reportable health-data event, or failure to document applicable licenses should trigger a formal
              investment re-underwrite. The strongest kill criterion is a divergence between management's runway claim
              and verified liquidity or burn data; the second is inability to produce a jurisdiction-by-jurisdiction
              compliance and data-flow map before U.S. commercialization. Until those controls are evidenced, residual
              risk remains high despite the strategic rationale for focus.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-confidence risk signal
            body: >-
              Five-country withdrawal and repeated staffing reductions are observed execution events, while the claimed
              cash runway and benefits of geographic focus remain management assertions that require financial and
              operating verification.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR014
          - type: callout
            title: Pre-investment control package
            body: >-
              Condition underwriting on verified liquidity, a jurisdiction-license map, a complete health-data
              inventory, incident and certification evidence, carrier contracts, and country-level revenue and
              retention.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR007
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              Betterfly's strongest investment argument is strategic rather than financial. Its B2B2C model combines
              wellbeing engagement, insurance protection, and employer distribution, and the Chubb alliance demonstrates
              that a major carrier was willing to integrate the platform into existing channels. The 2025 company
              interview describes a broader health-plan and AI direction, including preventive components and a Mexico
              focus, while the 2026 Minu transaction indicates continued platform expansion. These are credible scale
              and product signals, but they do not establish recurring revenue quality, retention, contribution margin,
              or cash efficiency. The public valuation anchor is the reported $1 billion Series C valuation in February
              2022; later public materials provide no independently audited mark. A 2024 revenue estimate of $72 million
              implies approximately 13.9x revenue at that stale valuation, but the numerator is explicitly
              source-unrecorded and is not ARR. That calculation is directional only, not a market-clearing multiple.
              The recommendation is research-more, with a price-sensitive upgrade only after current financial and
              cap-table evidence is obtained.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV011
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Betterfly can monetize an underserved insurance and employee-benefits gap through a
              differentiated distribution layer, with carrier partnerships and a broader preventive-health product
              increasing wallet share. The anti-thesis is that geographic retrenchment, integration complexity, and
              limited disclosure may indicate a business still optimizing for survival and product-market fit rather
              than durable public-market economics. LatamList reports that Betterfly ceased operations in five countries
              and said Chile, Mexico, and Spain generated 94% of revenue, which supports focus but also shows that
              earlier expansion plans did not persist unchanged. The Minu deal adds financial wellness and more than one
              million users to the platform, yet the article does not disclose purchase consideration mechanics, revenue
              synergies, or post-close performance. Public comparables provide context rather than a direct multiple:
              Oscar Health's October 2026 market capitalization and Wellhub's published employee pricing describe
              adjacent listed and wellness offerings, not equivalent business models. Accordingly, the thesis is
              investable only with milestone-based underwriting and explicit downside protection.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A defensible valuation range cannot be produced from the available evidence because current revenue, ARR
              reconciliation, gross margin, net retention, cash balance, burn, debt, and preference stack are not
              publicly disclosed. The scenario framework therefore uses explicit evidence thresholds rather than
              invented dollar outcomes. In the bull case, current Mexico adoption, the preventive-insurance launch, the
              US pilot-to-commercial path, and Minu cross-sell produce audited growth and improving unit economics; the
              base case assumes strategic progress but continued private-company opacity and selective geographic
              execution; the bear case assumes retrenchment, integration drag, or inability to convert engagement into
              profitable insurance economics. The key exit-readiness test is not a headline unicorn mark but repeatable
              revenue quality, carrier economics, and a financeable path through claims and compliance obligations.
              Before entry, diligence should obtain monthly cohort retention, country-level revenue and gross margin,
              cash and debt schedules, cap table and liquidation preferences, Minu integration KPIs, and signed evidence
              for the US launch plan. A thesis break occurs if management cannot reconcile the $72 million estimate to
              audited revenue, if net retention or contribution margin deteriorates materially, or if planned market
              launches are delayed without a funded operating plan.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Continue diligence rather than underwrite a confident buy. The reported $1B Series C valuation is
              historical, and the public revenue estimate is explicitly source-unrecorded; current unit economics and
              capitalization must be verified before setting price or return targets.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat an unreconciled revenue bridge, deteriorating retention or margin, an unfunded US plan, or
              undisclosed senior preferences as a material break in the investment thesis.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
