      - number: '2.3'
        title: Adoption drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are concrete: WHO quantifies the productivity cost of depression and anxiety; Gallup
              documents low engagement and a gap between individual AI productivity and organizational transformation;
              Mexico Business reports low insurance penetration, benefit-understanding friction and medical-cost
              inflation. These drivers support employer interest in prevention, engagement and navigation, but they also
              raise the proof bar. Trust in insurance, carrier economics, regulatory compliance, data governance, and
              the ability to demonstrate utilization or claims outcomes can slow adoption. Betterfly’s Chubb alliance
              and multi-country footprint reduce distribution friction, yet they do not prove independent demand or unit
              economics. For valuation, the opportunity is credible but the public record cannot convert category growth
              into Betterfly’s SAM, SOM, revenue growth or durable retention.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Opportunity is credible; serviceable market is unproven
            body: >-
              Category demand is supported by workplace health, engagement and insurance-penetration evidence, but
              Betterfly-specific SAM, SOM, conversion, retention and budget ownership remain open. Underwrite the
              company on verified country-level economics rather than the broad wellness total.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Betterfly's relevant alternatives span four layers. Wellhub is a direct wellbeing-network alternative with
              global gym, studio, coaching, nutrition, and mental-wellbeing coverage. Rippling, Gusto, Buk, and Deel are
              broader HR, payroll, benefits, or workforce platforms that can own the employer relationship and make a
              point solution harder to displace. Minu was an adjacent financial-wellness and earned-wage-access platform
              before its acquisition by Betterfly, expanding the combined proposition rather than removing the
              underlying competitive threat. Internal HR administration, broker-led insurance, and the status quo of
              fragmented vendors remain substitutes. Independent reporting says the Minu transaction would combine more
              than one million employees and more than 4,000 corporate clients, while LatamList reports Minu had more
              than 2,000 corporate customers and one million users; the different denominators and issuer contexts make
              the scale signal useful but not a reconciled KPI.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Betterfly's strongest product distinction is the combination of behavioral engagement, wellbeing content,
              and insurance protection. Chubb described the model as embedded insurance distributed through Betterfly's
              platform and existing carrier channels, with healthy activity converted into rewards and growing life
              coverage. Betterfly's 2025 interview describes a newer emphasis on gamification, telemedicine, indemnity
              and major-medical coverage, and an AI assistant, but these are company-representative statements rather
              than independent product validation. The competitive tradeoff is breadth versus proof: Wellhub publishes a
              large network and an annual-contract corporate model; Rippling and Gusto show tightly integrated benefits
              and payroll administration; Buk emphasizes localized Chilean compliance and modular HR/finance coverage;
              Deel emphasizes global workforce administration. Betterfly's historical Business Wire release gives a
              $4-per-employee-per-month starting price, but that is a 2021 company release and should not be treated as
              current realized pricing.
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: Moat durability, switching costs, and displacement risks
        blocks:
          - type: paragraph
            body: >-
              Betterfly can build switching costs through benefits enrollment, employee habit data, insurance
              underwriting or carrier relationships, and employer distribution, but the sources do not establish
              retention, renewal, utilization, or customer-level integration depth. Chubb's alliance supports partner
              access and digital distribution, while the Minu acquisition adds financial-wellness capability and a
              reported U.S. expansion path; both also increase execution complexity across insurance, health, financial
              products, and multiple jurisdictions. Wellhub's published network scale and global support create a
              credible distribution challenge for the wellbeing layer, while Rippling, Gusto, Buk, and Deel can bundle
              adjacent workflows into an existing system of record. The durability question is therefore not whether
              Betterfly has a distinctive narrative, but whether its combined product produces measurable employer ROI
              and renewal behavior that bundled incumbents cannot replicate. No assigned source provides a current
              Betterfly price sheet, churn, win/loss data, or independently verified capability benchmark.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated category position
            body: >-
              Betterfly's combination of wellbeing engagement, insurance, and financial wellness is broader than a
              single fitness or HR-administration module, creating a credible cross-sell thesis if execution and renewal
              evidence emerge.
            calloutType: strength
            claimRefs:
              - CP006
              - CP012
          - type: callout
            title: Distribution incumbents
            body: >-
              The largest competitive risk is distribution ownership: HR, payroll, benefits, and wellness platforms
              already sit in employer workflows and can bundle adjacent functionality, while Betterfly's public evidence
              does not yet show switching-cost or retention outcomes.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Betterfly's disclosed commercial mechanism is a B2B2C subscription: employers contract for a platform that
              combines wellbeing, insurance and related health benefits for employees. The 2021 company release
              described entry pricing of $4 per employee per month, with insurance and digital services included, but
              that is historical list pricing rather than realized revenue, net price, or contribution margin. Chubb's
              partner announcement supports the embedded-insurance distribution model and says the platform was made
              available through Chubb's existing channels in five Latin American countries. A 2025 interview describes a
              broader product set, including telemedicine, indemnity insurance and major medical coverage in Mexico,
              while also noting that about 20% of employees do not fully understand their benefits. That utilization
              problem is financially important: the platform may monetize contracted seats, active usage, insurance
              economics, or a blended arrangement, but public evidence does not disclose the revenue mix, renewal rate,
              claims ratio, take rate, or customer concentration. The reported $72 million of 2024 annual revenue on
              GetLatka is useful as a third-party data point, but the page explicitly says its source was not recorded;
              it should not be treated as audited revenue or ARR.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a cost structure shaped by insurance and health-service delivery, product and
              technology investment, geographic expansion, and integration. Betterfly's 2026 Minu coverage says the
              company planned to invest more than US$40 million in the United States opening over the prior 18 months
              and expected its U.S. team to grow from 20 to 50 people in the next 12 months. A 2025 Forbes report says
              the company closed five countries, dismissed 30 people, and concentrated on Chile, Mexico and Spain, which
              generated 94% of revenue according to company statements. The same report records management's claim of
              more than five years of cash and notes that operating expense had fallen after the closures. These are
              company claims, not a cash-flow statement: no current cash balance, monthly burn, debt schedule,
              working-capital profile, claims reserve, or capex schedule is disclosed in the assigned evidence. The
              restructuring can lower fixed operating costs, but it also creates transition costs and makes the 94%
              geographic concentration a material underwriting sensitivity.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI007
              - CI008
              - CI010
      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Betterfly's financing history shows substantial prior access to capital: the 2021 Series B announcement
              reported $60 million raised and $80 million of cumulative equity at that time, while FundedIQ records a
              later $125 million Series C and $185 million across two recorded rounds. LAVCA independently reported the
              Series C at a reported $1 billion valuation, but these historical financing facts do not establish cash
              available today, and a private-company funding total is not revenue or runway. The 2026 acquisition of
              Minu was reported at US$100 million and adds financial-wellbeing capabilities, but the consideration mix,
              post-close integration cost, and incremental revenue are not public in the assigned sources. The financial
              case therefore rests on a potentially attractive recurring employer-benefits model and strategic
              cross-sell, offset by opaque unit economics, uncertain insurance gross profit, and an unverified runway
              claim. Underwriting should require monthly management accounts, revenue recognition by stream and country,
              cohort retention, claims and service costs, cash and debt reconciliation, acquisition consideration, and a
              base/downside plan for the U.S. launch before supporting a valuation conclusion.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic monetization breadth
            body: >-
              The subscription, insurance, health and financial-wellbeing combination creates several potential
              expansion paths, and the Minu acquisition adds a complementary benefit category without requiring all
              capabilities to be built internally.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI011
          - type: callout
            title: Runway and margin remain unverified
            body: >-
              Management's reported runway claim and third-party revenue datapoint do not substitute for current cash,
              burn, gross margin, claims economics or a reconciliation of revenue streams.
            calloutType: risk
            claimRefs:
              - CI003
              - CI007
              - CI010
              - CI014
          - type: callout
            title: Require operating-finance pack before pricing
            body: >-
              Underwriting should remain conditional until Betterfly provides audited or management accounts, cohort
              economics, insurance cost data, cash and debt schedules, and the post-Minu integration budget.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Betterfly's product is a B2B2C benefits layer: an employer makes the service available, an employee uses a
              mobile experience to understand benefits and complete health activities, and insurer and health-service
              partners supply regulated or clinical components. Chubb described the 2021 model as an embedded-insurance
              B2B2C model in which healthy behavior generated charitable donations and life-insurance protection that
              grew at no cost. The product surface has since broadened. A 2025 interview describes a gamified experience
              focused on helping employees understand and use benefits, with telemedicine, mental-health services,
              indemnity insurance, major-medical coverage in Mexico, and a planned preventive Health Plan 3.0. The
              public workflow is therefore more than a wellness app: it is an engagement and orchestration layer whose
              value depends on benefit comprehension, repeated behavior, and partner execution. The principal diligence
              gap is whether the expanded promise is consistently available by country, employer plan, and insurance
              carrier rather than only described at platform level.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
