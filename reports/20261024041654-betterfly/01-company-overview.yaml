company:
  name: Betterfly
chapter:
  number: 1
  title: Company Overview
  summary: Betterfly is a Chile-founded employee benefits and insurtech platform combining wellness engagement, embedded insurance, and social impact. The evidence supports a 2018 founding, a $1 billion valuation associated with its February 2022 Series C, and a 2026 Minu acquisition, but current operating economics, governance, and post-acquisition scale remain incompletely disclosed.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Betterfly originated in Chile in 2018 as Burn to Give, founded by brothers Eduardo and Cristóbal della Maggiora, and evolved from habit-linked charitable giving into an employer-sponsored benefits platform. The product combines wellness engagement, insurance, and social purpose: employers pay for membership while employees receive benefits and can earn or increase protection through healthy behaviors. Chubb described the model as embedded-insurance B2B2C and identified Mexico, Colombia, Ecuador, Chile, and Argentina as its initial preferred-provider footprint. Retained official website content positions the proposition around voluntary insurance, health insights, missions, rewards, and employer reporting. The model therefore depends on both recurring employer distribution and insurer or local-market partnerships; the public evidence does not establish current retention, margin, or contribution economics.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: founders-funding-and-scale
    title: Founders, funding, and scale
    body: >-
      The founders are Eduardo and Cristóbal della Maggiora, with Eduardo repeatedly identified as founder and CEO in company and partner materials. Public funding records converge on a $60 million Series B in June 2021 and a $125 million Series C in February 2022, but the Series A amount conflicts: Tracxn records $9 million, while Betterfly’s syndicated announcement says $18 million. Totals also vary by source: Indexed reports $194 million over three rounds, while Contxto reports $202.5 million after the Series C. These differences are not safely reconciled because the sources use different round-count and inclusion conventions. The evidence supports a historic $1 billion valuation, not a current valuation or available cash balance. Headcount also conflicts materially across the evidence, so the chapter treats mixed-vintage figures as signals rather than a current cover metric.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: milestones-and-open-diligence
    title: Milestones, partnerships, and diligence gaps
    body: >-
      Betterfly’s expansion story is partnership-led and acquisition-led. Chubb supplied an insurance-distribution relationship in five Latin American countries, while the 2026 Minu transaction added financial-wellness capabilities and a Mexico customer base. A 2025 interview describes two platform revamps since 2022 and a more gamified product, but it is a company interview and does not independently verify adoption. Historical plans to expand across Latin America, the United States, Spain, and Portugal were ambitious; later evidence gives a specific U.S. pilot and January 2027 commercial-launch plan, which should be treated as a forward plan rather than an achieved milestone. The central diligence gaps are current cash and burn, current headcount and customers, cap table and control, post-Minu integration, and market-by-market regulatory execution.
    claimRefs: [CO003, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
