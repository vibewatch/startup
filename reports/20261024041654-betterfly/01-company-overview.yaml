callouts:
  - calloutType: strength
    title: Partnership-enabled distribution
    body: >-
      Betterfly has paired its benefits software with insurer and local-market relationships rather than relying only on direct distribution; the Chubb alliance is the clearest documented example.
    claimRefs: [CO003, CO005]
  - calloutType: risk
    title: Current scale and economics remain opaque
    body: >-
      Public sources disagree on funding totals and historical headcount, while current ARR, burn, margin, retention, cash, debt, and standalone customer count are not established in the assigned evidence.
    claimRefs: [CO006, CO007, CO010, CO011, CO015, CO016]
