      - [Telemedicine and health services, "Digital access and preventive health benefits", "Member / service; price undisclosed", "Offered in product descriptions", "Product evidence; revenue allocation unavailable", "Usage, vendor fees, service cost and revenue-recognition policy"]
      - [Financial-wellbeing benefits, "Minu salary advances, vouchers and financial tools after acquisition", "User / employer; price undisclosed", "Integration described; incremental revenue unavailable", "Third-party reporting; post-close results unavailable", "Acquisition accounting, attach rate, contribution margin and cross-sell cohorts"]
    notes: "Sources include a 2021 company release, a 2021 partner announcement and 2026 third-party acquisition coverage; historical list price and product descriptions are not realized revenue or margin, and null economics require diligence."
    claimRefs: [CI001, CI002, CI005, CI011]
  - id: TI002
