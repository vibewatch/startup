callouts:
  - calloutType: strength
    title: Strategic monetization breadth
    body: The subscription, insurance, health and financial-wellbeing combination creates several potential expansion paths, and the Minu acquisition adds a complementary benefit category without requiring all capabilities to be built internally.
    claimRefs: [CI001, CI002, CI011]
  - calloutType: risk
    title: Runway and margin remain unverified
    body: Management's reported runway claim and third-party revenue datapoint do not substitute for current cash, burn, gross margin, claims economics or a reconciliation of revenue streams.
    claimRefs: [CI003, CI007, CI010, CI014]
  - calloutType: recommendation
    title: Require operating-finance pack before pricing
    body: Underwriting should remain conditional until Betterfly provides audited or management accounts, cohort economics, insurance cost data, cash and debt schedules, and the post-Minu integration budget.
    claimRefs: [CI009, CI010, CI012, CI013]

