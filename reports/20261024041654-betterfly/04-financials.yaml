    columns: [Price or contract, Basis, List versus realized, Confidence, Implication]
    rows:
      - ["$4", "Per employee per month", "Historical list/entry price in 2021; realized price unknown", "Medium", "Provides a monetization anchor but not current ARPU or gross profit"]
      - ["Smart life insurance plus wellbeing tools", "Employer-sponsored subscription", "Included bundle; allocation across insurance and services unknown", "Medium", "Requires revenue disaggregation and carrier economics"]
      - ["Top-up and family extension", "Optional marketplace purchase", "Availability described; price and conversion unknown", "Low", "Potential expansion revenue cannot be modeled publicly"]
      - ["Minu financial benefits", "Salary advance, vouchers and related tools", "Post-acquisition packaging and realized pricing unknown", "Low", "Integration may broaden wallet share but adds cost and execution risk"]
    notes: "Pricing evidence is historical or descriptive; no assigned source discloses current realized pricing, discounts, net revenue retention or contribution margin."
    claimRefs: [CI001, CI002, CI011, CI012]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annual revenue, "$72M in December 2024", "Low to medium", "Sets a third-party scale reference, but the page says source not recorded", "Audited P&L, revenue-recognition policy and stream/country bridge"]
      - [Gross margin, null, "Unavailable", "Insurance claims and health-service costs determine revenue quality", "Gross margin by product, carrier and geography"]
      - [CAC and payback, null, "Unavailable", "Employer-led distribution can be efficient or sales-intensive", "Sales funnel, CAC, contract length and cohort payback"]
      - [Cash balance, null, "Unavailable", "Determines ability to fund U.S. launch and integration", "Bank statements and restricted cash reconciliation"]
      - [Burn and runway, "Management claims more than five years of cash", "Low", "May indicate capital adequacy, but is not a cash-flow disclosure", "Monthly burn bridge, cash balance, scenario runway and assumptions"]
      - [Debt and project-finance obligations, null, "Unavailable", "Debt, insurance liabilities and working capital can change financing need", "Debt schedule, guarantees, claims reserves and working-capital aging"]
    notes: "Null means the assigned public evidence did not disclose the metric; the runway figure is a management claim reported by third parties and is not independently verified."
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI010]

