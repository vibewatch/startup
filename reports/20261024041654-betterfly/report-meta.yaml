  topStrengths:
    - Differentiated combination of employee wellness, embedded insurance, and social-impact engagement.
    - Carrier and employer distribution partnerships provide strategic reach beyond direct sales.
    - Minu acquisition expands the platform into financial wellness and Mexico.
  topRisks:
    - Current revenue quality, retention, margin, cash, debt, and capitalization are not publicly reconciled.
    - Geographic retrenchment and concentration in Chile, Mexico, and Spain raise execution sensitivity.
    - Post-Minu integration, U.S. expansion, insurance economics, and data-compliance boundaries remain unproven.
  unresolvedGaps:
