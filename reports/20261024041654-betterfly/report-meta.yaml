companyProfile:
  summary: >-
    Betterfly is a Chile-founded employee benefits and insurtech platform that evolved from Burn to Give into an
    employer-sponsored B2B2C proposition spanning wellness engagement, insurance, rewards, health services, and
    financial-wellness capabilities. Its public record shows meaningful historic fundraising, carrier distribution,
    geographic retrenchment, and the 2026 Minu acquisition, but not enough current operating disclosure to underwrite
    durable economics.
