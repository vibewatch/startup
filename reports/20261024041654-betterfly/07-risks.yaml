    title: Highest-confidence risk signal
    body: >-
      Five-country withdrawal and repeated staffing reductions are observed execution events,
      while the claimed cash runway and benefits of geographic focus remain management assertions
      that require financial and operating verification.
    claimRefs: [CR001, CR002, CR004, CR005, CR014]
  - calloutType: recommendation
    title: Pre-investment control package
    body: >-
      Condition underwriting on verified liquidity, a jurisdiction-license map, a complete
      health-data inventory, incident and certification evidence, carrier contracts, and
      country-level revenue and retention.
    claimRefs: [CR005, CR007, CR011, CR012, CR013, CR015, CR016]
