evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Current ARR, gross margin, NRR, cash, burn, debt, and valuation with period definitions and reconciled accounting
      treatment.
    whyItMatters: >-
      Without current economics, historical financing and the 2022 valuation cannot support a current pricing or runway
      judgment.
    diligencePath: >-
      Request monthly management accounts, KPI definitions, cash and debt schedules, and the latest board-approved
      operating plan.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive, board, ownership, and succession disclosures.
    whyItMatters: Founder-centered public reporting leaves key-person dependence and governance rights difficult to assess.
    diligencePath: Obtain the current organization chart, board minutes or composition, option ledger, and succession plan.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated, entity-level headcount reconciliation separating Betterfly, Minu, contractors, and country teams.
    whyItMatters: The 33-to-500 range changes the interpretation of operating scale and integration capacity.
    diligencePath: Request payroll-based headcount by legal entity and country for each quarter since the Minu acquisition.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: integration
    missingEvidence: Post-Minu customer overlap, retention, cross-sell, integration cost, and synergy evidence.
    whyItMatters: The acquisition may expand product scope while adding execution and integration risk.
    diligencePath: Request the acquisition scorecard, customer cohort data, synergy case, and 100-day integration review.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current country-level SAM and SOM model separating employer benefits insurance and wellness spend for
      Betterfly’s active markets.
    whyItMatters: >-
      Broad market estimates do not establish the portion Betterfly can serve or win, which is central to adoption
      timing and valuation.
    diligencePath: >-
      Request management’s 2026 market model with segment definitions geographies price assumptions pipeline conversion
      and sensitivity cases.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Current employer budget ownership win rates utilization retention and outcomes by segment and geography.
    whyItMatters: >-
      The public record describes the value proposition but does not show whether employers renew or whether wellness
      and insurance outcomes justify spend.
    diligencePath: >-
      Obtain anonymized cohort renewal utilization claims and customer-reference evidence from Chile Mexico Spain Brazil
      and the United States pipeline.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
