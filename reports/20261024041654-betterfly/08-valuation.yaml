      - [Confidence, "Medium-low", "Strategic evidence is meaningful, but valuation inputs are stale or incomplete."]
      - [Risk rating, "High", "Geographic retrenchment, integration, insurance economics, and disclosure gaps remain material."]
      - [Valuation stance, "Unknown", "A February 2022 $1B financing mark is not a current fair-value assessment."]
      - [Entry discipline, "Milestone-based", "Require audited revenue bridge, retention, margin, cash runway, and preference terms."]
    notes: "Sources include company and partner disclosures plus independent reporting; the recommendation is an analytical judgment, not a quoted market price."
    claimRefs: [CV001, CV002, CV003, CV006, CV011]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Embedded-insurance differentiation", "Chubb described a digital alliance using Chubb Studio and Betterfly's wellbeing platform.", "Carrier renewal, claims outcomes, and recurring contribution margin by country."]
      - ["Focused market strategy", "LatamList reported operations in Chile, Mexico, and Spain after exits from five countries.", "Audited country-level growth and evidence that focus improves payback."]
      - ["Platform expansion", "The Minu transaction added financial wellness, more than 2,000 corporate customers, and over one million users to the combined platform.", "Post-close cross-sell, retention, and integration cost scorecard."]
      - ["Funding capacity", "Business Wire reported $80M of equity raised through Series B in June 2021; LAVCA reported a later $125M Series C at a $1B valuation.", "Current cash, debt, cap table, and liquidation preferences."]
      - ["Market comparability", "Oscar market capitalization and Wellhub published plan prices show adjacent market reference points only.", "A disclosed peer set with comparable revenue, margin, growth, and risk basis."]
    notes: "The rows mix company-issued, partner, independent, and adjacent-market evidence; comparables are contextual and not equivalent valuation benchmarks."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks and probability signal]
    rows:
      - [Bull, "Mexico adoption scales; preventive Health Plan 3.0 and US pilot convert; Minu cross-sell is measurable; audited retention and margins improve.", "Re-underwrite using verified recurring revenue and a peer-supported multiple; target return becomes supportable only after evidence.", "Execution, insurance claims, regulatory and integration risk remain; probability signal: low-to-medium."]
      - [Base, "Core markets remain focused; product experimentation continues; public economics remain incomplete; no verified current valuation.", "Hold or defer entry; use milestone financing rather than a precise range.", "Opacity and uneven market execution dominate; probability signal: medium."]
      - [Bear, "Further country exits, delayed US commercialization, weak claims economics, or Minu integration drag.", "Require a substantial price reset and downside protection; avoid if cash runway is unverified.", "Liquidity, dilution, preference overhang, and commercialization failure; probability signal: medium."]
      - [Diligence gate, "Management reconciles revenue, ARR, gross margin, NRR, cash, debt, cap table, and country cohorts.", "Only then set entry price, target return, and exit timing.", "Failure to provide evidence is itself a decision blocker; probability signal: required condition."]
    notes: "Scenarios are conditional underwriting frameworks, not forecasts. No precise valuation ranges are shown because current financial and capitalization inputs are unavailable."
    claimRefs: [CV003, CV004, CV011, CV012, CV013, CV014, CV015]
