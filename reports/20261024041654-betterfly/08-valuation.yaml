callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: Continue diligence rather than underwrite a confident buy. The reported $1B Series C valuation is historical, and the public revenue estimate is explicitly source-unrecorded; current unit economics and capitalization must be verified before setting price or return targets.
    claimRefs: [CV003, CV004, CV011, CV012]
  - calloutType: risk
    title: Thesis-break trigger
    body: Treat an unreconciled revenue bridge, deteriorating retention or margin, an unfunded US plan, or undisclosed senior preferences as a material break in the investment thesis.
    claimRefs: [CV012, CV013, CV014, CV015]
