  evidenceGaps:
    - id: GV001
      type: private-evidence-only
      severity: blocking
      topic: "audited-financials-revenue"
      description: >
        Lyten has not disclosed audited financial statements for any fiscal year. Compworth's
        $110M model-based revenue estimate is not independently verified. Without audited P&L
        and balance sheet data, it is impossible to independently assess revenue, burn rate,
        gross margin, or capital sufficiency. This gap is blocking for any investor who
        requires financial due diligence before committing capital at current valuation marks.
      missingEvidence: >
        FY2024 and FY2025 audited financial statements (P&L, balance sheet, cash flow statement)
        from an independent auditor, or equivalent public financial disclosure.
      relatedClaimRefs: [CV007, CV011]
      relatedQuestionRefs: [QV005]
      relatedTableRefs: [TV004]

    - id: GV002
      type: private-evidence-only
      severity: material
      topic: "series-c-valuation-undisclosed"
      description: >
        The post-money valuation of Lyten's Series C (July 2025) has not been disclosed by
        the company or any named investor. All valuation estimates ($1.3–1.5B) are derived
        from third-party models (Compworth) or pre-IPO database estimates (AccessIPOs) and
        cannot be verified against actual transaction terms. The dilution percentage and
        preference stack for the Series C are also undisclosed.
      missingEvidence: >
        Official company disclosure or verified investor communication of Series C post-money
        valuation, dilution percentage, and preference terms.
      relatedClaimRefs: [CV004, CV005]
      relatedQuestionRefs: [QV017]

    - id: GV003
      type: private-evidence-only
      severity: material
      topic: "secondary-market-pricing-unavailable"
      description: >
        No secondary market transactions in Lyten equity have been publicly disclosed on
        Forge Global or any comparable pre-IPO trading platform. Forge Global lists Lyten
        as a watchlist entry without active secondary pricing. The absence of secondary
        market data prevents determination of a market-clearing price for Lyten shares and
        limits the ability to validate model-based valuation estimates.
      missingEvidence: >
        Published secondary market transaction price(s) for Lyten equity on Forge Global
        or equivalent regulated secondary trading platform.
      relatedClaimRefs: [CV032, CV039]
      relatedQuestionRefs: [QV018]

    - id: GV004
      type: private-evidence-only
      severity: minor
      topic: "cap-table-composition"
      description: >
        Lyten's full cap table—including equity percentages held by each named investor,
        founder equity, employee option pool, and preference stack—has not been publicly
        disclosed. Named investors (Prime Movers Lab, Stellantis, FedEx, Honeywell,
        Luxembourg Future Fund, Walbridge) are identified from press releases, but their
        equity ownership percentages are unknown. This limits downside and dilution modeling.
      missingEvidence: >
        Full cap table with per-investor equity ownership, liquidation preference amounts,
        anti-dilution provisions, and option pool size.
      relatedClaimRefs: [CV002, CV003, CV037, CV038]
      relatedQuestionRefs: [QV022]

    - id: GV005
      type: missing-source
      severity: material
      topic: "northvolt-sweden-acquisition-accounting"
      description: >
        The accounting treatment for the Northvolt Sweden and Poland asset acquisitions
        (announced February 2026) has not been disclosed. The book value of acquired assets,
        purchase price allocation, any contingent liabilities assumed, and goodwill or
        impairment charges are all unavailable. This gap prevents assessment of the
        acquisition's true cost and its impact on Lyten's balance sheet and capital runway.
      missingEvidence: >
        Audited purchase price allocation, book value of acquired assets, and any contingent
        liability disclosures for the Northvolt Sweden and Poland acquisitions.
      relatedClaimRefs: [CV025]
      relatedQuestionRefs: [QV026]

