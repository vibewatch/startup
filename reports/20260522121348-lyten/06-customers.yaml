  - id: adoption-trajectory
    title: Adoption Trajectory and Pipeline Maturity
    body: >
      Lyten's commercial trajectory is non-linear: BESS is already in limited commercial production
      while LiS battery segments are still in evaluation or qualification phases. Major adoption
      milestones span May 2023 (Stellantis JDA), February 2024 (Chrysler Halcyon Concept unveiling),
      May 2024 (A-sample deliveries to 20+ targets), August 2024 (AEVEX partnership), September 2024
      (DIU ISS contract), December 2024 (EXIM LOI for CARICOM), May 2025 (drone propulsion
      initiative, accepting orders), Q4 2025 (BESS Voltpack shipments from Poland), and H2 2026
      (targeted NMC cell sales from Sweden). The Northvolt acquisition (completed February 2026)
      added the most commercially mature customer base — existing European BESS customers who receive
      Voltpack NMC cells and are candidates for future LiS BESS upgrades. Lyten's "revenue-first"
      strategy, articulated by CBO Keith Norman, explicitly sequences BESS and defense revenue ahead
      of automotive to avoid repeating Northvolt's fatal dependence on a single large OEM customer
      before reaching profitability. No revenue figures, unit volumes, or order-book sizes have been
      publicly disclosed for any segment. The pipeline funnel narrows sharply from 20+ evaluation
      targets to a handful of named partners, and further narrows to two commercial-stage product
      lines (defense/drone and BESS/grid). Automotive OEM production supply remains a mid-to-long-term
      prospect, contingent on B-sample delivery, production-scale cycle-life validation, and gigascale
      LiS manufacturing capacity that is not yet operational.
