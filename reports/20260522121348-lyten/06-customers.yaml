  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Factor
      - Description
      - Severity
      - Mitigation Signal
    rows:
      - - Stellantis dual-sourcing (Zeta Energy JDA, Dec 2024)
        - Stellantis signed a separate LiS JDA with Zeta Energy while maintaining its Lyten JDA, signalling a multi-supplier strategy
        - High — reduces probability of Lyten becoming Stellantis's exclusive primary LiS cell supplier
        - Lyten has 18-month head start; A-sample delivered; composites/sensing differentiation beyond cells
      - - Automotive OEM pipeline at A-sample only
        - Automotive LiS pipeline is A-sample evaluation stage; B-sample, C-sample, and production qualification require 4–7 more years
        - High — EV volume revenue is 5+ years out; all near-term revenue must come from other segments
        - BESS and defense providing near-term diversification; revenue-first strategy explicitly acknowledges risk
      - - BESS customer attrition (Northvolt legacy contracts voided)
        - Northvolt bankruptcy voided most legacy supply contracts; EU BESS customers evaluating alternative NMC suppliers
        - Medium — Lyten must re-win each customer; facility is operational but customer relationships are rebuilding
        - Poland facility shipping VMS gen-3; former customers "already know the cells" (CBO Keith Norman)
      - - Investor ≠ Customer (FedEx, Honeywell — no purchase agreements)
        - FedEx and Honeywell have equity stakes from Series B (Sep 2023) but no disclosed product purchase agreements
        - Medium — investor presence may signal future customer intent but creates overstated pipeline impression
        - Honeywell is a sensing technology partner; sensor applications could be earliest non-battery commercial relationship
