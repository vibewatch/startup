  - id: retention-durability-gaps
    title: Retention, Durability, and Evidence Gaps
    body: >
      Lyten has disclosed no net revenue retention (NRR), gross revenue retention (GRR), customer
      churn, satisfaction scores, or repeat-purchase data for any segment as of May 2026. The closest
      proxy for retention durability is the BESS segment: Lyten's Voltpack Mobile System is described
      as a "gen-3" product with "commercial installations throughout Europe," implying a customer base
      that has continued through at least three product generations inherited from Northvolt's VMS
      line. Keith Norman stated Lyten expects "strong demand from previous and new customers" and that
      former Northvolt OEM customers "already know the cells," reducing re-qualification friction.
      However, the February 2026 Northvolt acquisition legally voided most legacy Northvolt supply
      contracts, meaning Lyten must renegotiate each customer relationship from scratch. In the
      defense and UAV segment, AEVEX Aerospace committed to delivering UAVs with Lyten cells by end
      of 2024, but no confirmation of completed deliveries has appeared in subsequent public sources.
      The DIU ISS contract is a single government demonstration award with no disclosed follow-on. In
      automotive, the Stellantis JDA is active but neither B-sample delivery nor production intent
      has been publicly announced; one unnamed European carmaker reportedly exited the evaluation
      process citing production-scale limitations. The core evidence gap is the absence of any
      quantitative retention metric for any segment — the entire customer engagement picture is
      milestone-based rather than metric-based, which is appropriate for a pre-revenue or early-revenue
      hardware startup but limits investor-grade durability assessment.
    claimRefs:
      - CU009
      - CU019
      - CU021
      - CU023
      - CU034
