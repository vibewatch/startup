        - EXIM Bank Standard LOI requires progression to Enhanced LOI → Preliminary Commitment → Final Commitment before funds disbursed
        - Medium — CARICOM BESS scale-up could stall for 1–3 years; $650M figure is aspirational not contracted
        - Multiple CARICOM MOUs; energy-security political tailwinds; US EXIM actively lending in Caribbean
    notes: >
