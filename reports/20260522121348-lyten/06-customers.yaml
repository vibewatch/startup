  - id: expansion-and-concentration-risk
    title: Expansion Vectors and Concentration Risk
    body: >
      Lyten's expansion logic follows a segment-based land-and-expand model: BESS capacity in Poland
      serves existing European customers while targeting new industrial, data-centre, and grid buyers;
      defense/drone volume scales from California as production accepts orders; CARICOM BESS expands
      from MOUs to contracted deliveries subject to EXIM LOI conversion; and automotive OEM supply
      scales only after successful B-sample and C-sample validation. Concentration risk is material
      and multi-dimensional. Stellantis represents the highest-exposure single-entity risk: it is
      simultaneously an equity investor (~2% stake), JDA partner, A-sample evaluation customer, and
      the company with the most public product proof (Chrysler Halcyon). Stellantis's December 2024
      JDA with rival LiS developer Zeta Energy signals it is hedging across multiple suppliers, which
      could reduce Lyten's probability of winning an exclusive or primary supply position. FedEx and
      Honeywell are investors without disclosed procurement commitments; if they become customers,
      Lyten gains revenue but faces potential conflict-of-interest constraints; if they do not, their
      equity stakes do not translate to commercial traction. The EXIM LOI for CARICOM is conditional
      — a Standard LOI requires progression to Enhanced LOI, Preliminary Commitment, and Final
      Commitment stages before any financing is disbursed, meaning the $650M figure is aspirational
      rather than contracted. Channel risk is low (all known relationships are direct B2B) but creates
      scalability limits at volume. AEVEX Aerospace is the sole disclosed channel partner for DoD UAV
      supply, creating single-integrator dependency for defense-segment expansion.
