    figureRefs: []

  - id: named-customer-proof
    title: Named Customer Proof
    body: >
      The highest-quality customer proof comes from the Stellantis relationship and the AEVEX
      Aerospace partnership. Stellantis CEO Carlos Tavares publicly described Lyten's platform as
      "a key investment for the future of electrification" in the May 2023 JDA announcement, and
      Stellantis's own media site featured Lyten's LiS cells in the Chrysler Halcyon Concept EV
      (February 2024) — a customer-sourced demonstration of technology commitment. In August 2024,
      Lyten and AEVEX Aerospace issued a joint press release stating AEVEX "plans to demonstrate,
      manufacture, and deliver" UAVs powered by Lyten LiS batteries, including a commitment to first
      deliveries targeting end of 2024; AEVEX confirmed the partnership serves US DoD requirements
      under the NDAA. The Defense Innovation Unit's September 2024 selection of Lyten for ISS
      lithium-sulfur battery demonstration constitutes a government procurement record — the
      highest-trust form of customer-proof evidence for a hardware supplier. Titan Dynamics executed
      a 3+ hour, 86 mph demonstration flight with a Lyten-powered 3D-printed UAV at Palos Verdes, CA,
      validating real-world flight performance but not disclosing a commercial supply contract. On the
      BESS side, Keith Norman (Chief Business Officer) confirmed in a 2026 Renewables Now interview
      that the Voltpack VMS is shipping product from Poland, and electrive reported European commercial
      installations were already in progress as of mid-2025. Adverse signal: Reuters reported in August
      2025 that a battery scientist at a named European carmaker stated their firm "backed away from
      working with Lyten about six months ago because the US company was only producing at research
      and development scale" — at least one customer evaluation did not progress to partnership stage.
    claimRefs:
