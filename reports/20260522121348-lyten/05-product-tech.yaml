  - id: manufacturing-maturity
    title: Manufacturing Maturity and Process Readiness
    body: >
      Lyten's manufacturing footprint spans three geographies at materially different readiness levels.

      San Jose, California (3D Graphene + LiS pilot): The original 145,000 sq ft facility at
      145 Baytech Dr. houses 3D Graphene production and an automated pilot cell assembly line
      commissioned in May 2023. Published pilot capacity is approximately 200,000 cells/year
      (combined multi-layer pouch and 18650/2170/26650 cylindrical), equivalent to roughly 2.4 MWh/yr
      of total pilot-line throughput. Semi-automatic and automatic equipment for electrode coating,
      electrolyte filling, and cell sealing is in operation, and more than 3,000 battery test channels
      (Maccor, Arbin) are in use for cell formation and cycling. This facility delivered the May 2024
      A-sample shipments and supplies current defense and drone orders.

      San Leandro, California (LiS scale-up): The 119,000 sq ft former Cuberg facility, acquired in
      November 2024 for a reported ~$20M conversion investment, targets 200 MWh/yr annual LiS cell
      capacity with commercial production starting H2 2025. This represents a roughly 80× step-up
      from the San Jose pilot. The acquisition and conversion timeline implies a rapid industrialisation
      schedule that carries execution risk; no independent confirmation of production-line commissioning
      status has been publicly reported as of May 2026.

      Northvolt Sweden (NMC restart → LiS industrialisation): The February 2026 completion of the
      ~$5B acquisition brings 16 GWh of installed cell-manufacturing capacity across Northvolt Ett
      and Ett Expansion in Skellefteå, and Northvolt Labs R&D center in Västerås. Skellefteå will
      immediately restart NMC lithium-ion cell production targeting commercial sales in H2 2026
      to BESS, automotive (Scania, Porsche 718 successor), and mobility customers. Northvolt Labs
      in Västerås will collaborate with the Lyten Silicon Valley team to industrialise LiS technology
      for gigascale manufacturing — a process with an undefined timeline. Over 600 employees are
      being rehired across both Swedish sites.

      Gdańsk, Poland (BESS manufacturing): Northvolt Dwa, acquired October 2024, is Europe's
      largest BESS manufacturing facility with 6 GWh annual capacity (expandable to 12 GWh). It
      produces the Voltpack Mobile System family using lithium-ion chemistry; BESS deliveries to
      European customers were targeted for Q4 2025. This is the most mature commercial manufacturing
      asset in Lyten's portfolio.

      A critical manufacturing dependency is the conversion of cell-assembly infrastructure from
      NMC to LiS chemistry. LiS cell processes share substrate equipment (coaters, electrolyte fill,
      sealers) with Li-ion, but the sulfur cathode, lithium-metal anode, and modified electrolyte
      require material-specific process controls — particularly moisture exclusion, lithium handling,
      and post-synthesis cathode processing. Lyten has not publicly disclosed yield rates or
      manufacturing cost-per-cell at any production level.
