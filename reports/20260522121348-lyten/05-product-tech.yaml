figures:
  - id: FE001
    title: Lyten 3D Graphene Product Architecture Stack
    type: stack
    layout: wide
    summary: >
      Lyten's technology stack from raw material feedstock through core platform to commercial
      product applications, showing how 3D Graphene enables five distinct product lines.
    data:
      layers:
        - label: "Raw Material Feedstock"
          detail: >-
            Methane (natural gas) as carbon source; sulfur (industrial by-product) as cathode active
            material; lithium metal (US-domestic since April 2025); electrolyte solvents/salts.
          items:
            - "Methane (CH₄) — US-domestic natural gas; carbon and hydrogen co-products"
            - "Sulfur — industrial by-product; zero-conflict supply chain"
            - "Lithium metal — US-domestic foil production started April 2025"
        - label: "3D Graphene Synthesis Platform"
          detail: >-
            Proprietary microwave plasma reactor at 55k sq ft San Jose fab converts methane to
            tunable 3D carbon scaffold and hydrogen. 541+ patents cover synthesis, structure,
            and application integration.
          items:
            - "Patented microwave plasma reactor (methane cracking)"
            - "Tunability engine: porosity / surface area / conductivity / surface energy control"
            - "Hydrogen co-capture for clean fuel reuse; net carbon-negative process"
        - label: "Core Cell Architecture (Li-S)"
          detail: >-
            Multi-component LiS cell stack: 3DG-sulfur cathode (nano-capture polysulfide
            confinement), protected Li-metal anode, low-E/S electrolyte, multifunctional
            separator. Aqueous cathode processing (NMP-free).
          items:
            - "3D Graphene-sulfur composite cathode (high areal capacity; aqueous NMP-free binder)"
            - "Protected Li-metal anode (dendrite-suppression; polysulfide-resistant SEI)"
            - "Low E/S ratio electrolyte (proprietary formulations; enables high specific energy)"
            - "Multifunctional separator (polysulfide migration barrier)"
        - label: "Manufacturing and System Integration"
          detail: >-
            San Jose pilot (2.4 MWh/yr), San Leandro scale-up (200 MWh/yr target), Northvolt
            Labs Västerås (LiS industrialisation), Gdańsk BESS (6 GWh), Skellefteå NMC (16 GWh).
          items:
            - "San Jose: automated pilot line; 200k cells/yr; pouch + 18650/2170/26650"
            - "San Leandro: conversion from Cuberg; target 200 MWh/yr LiS (H2 2025)"
            - "Västerås: LiS gigascale industrialisation (timeline unspecified)"
            - "Gdańsk: Voltpack BESS 6 GWh/yr (NMC → LiS transition roadmap)"
            - "Skellefteå: 16 GWh NMC restart; commercial sales H2 2026"
        - label: "Commercial Product Lines"
          detail: >-
            Five products sharing the 3D Graphene platform: LiS cells, Voltpack BESS,
            lightweight composites, IoT sensors, and NMC bridge cells.
          items:
            - "LiS battery cells (pouch 6.5 Ah / cylindrical 18650 / 2170 / 26650)"
            - "Voltpack Mobile System BESS (281–1,405 kWh; gen-3; Poland)"
            - "Lightweight composites (50% weight reduction; transportation / aerospace)"
            - "IoT sensor arrays (chemical / environmental; Honeywell partnership)"
            - "NMC Li-ion cells (Northvolt legacy; bridge revenue H2 2026)"
    approximationNotes: >
      Manufacturing capacity figures are company-stated targets. San Leandro commissioning status
      is unconfirmed as of May 2026. Skellefteå capacity is inherited from Northvolt; LiS conversion
      timeline is not publicly specified.
    claimRefs:
      - CE001
      - CE008
      - CE011
      - CE012
      - CE013
      - CE040

  - id: FE002
    title: Customer Workflow — LiS Battery Procurement and Deployment
    type: flow
    layout: standard
    summary: >
      How a customer progresses from energy need through Lyten cell qualification to deployed
      application across three representative verticals.
    data:
      nodes:
        - id: need
          label: "Customer Energy Need"
          description: "Weight-critical energy storage need — UAV endurance, space power, grid edge, or EV range"
        - id: rfq
          label: "RFQ / B2B Engagement"
          description: "Direct B2B outreach; no channel or retail; NDA contract negotiation"
        - id: sample
          label: "A/B-Sample Testing"
          description: "Lyten supplies A-samples (6.5 Ah pouch or cylindrical); OEM conducts qualification testing"
        - id: qualification
          label: "Application Qualification"
          description: "Defense: NDAA audit + flight test; Space: ISS/NASA protocol; Auto: UN 38.3 + pack validation"
        - id: production
          label: "Production Order"
          description: "Binding supply agreement; Lyten allocates capacity at San Jose / San Leandro / Gdańsk"
        - id: deployment
          label: "Field Deployment"
          description: "Cells integrated into UAV pack, satellite, BESS, or EV; LytenCloud monitoring for BESS"
        - id: monitoring
          label: "Lifecycle Monitoring"
          description: "LytenCloud telemetry (BESS); defense field performance data; OEM cycle-life feedback"
      edges:
        - from: need
          to: rfq
        - from: rfq
          to: sample
        - from: sample
          to: qualification
        - from: qualification
          to: production
        - from: production
          to: deployment
        - from: deployment
          to: monitoring
    approximationNotes: >
      Automotive qualification loop is significantly longer (3–5 years for OEM supply programmes);
      defense/drone qualification is faster (months). Monitoring capability via LytenCloud applies
      only to BESS Voltpack deployments, not individual battery cells.
    claimRefs:
      - CE010
      - CE015
      - CE016
      - CE017
      - CE035

