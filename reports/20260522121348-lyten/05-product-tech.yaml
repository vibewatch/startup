  - id: critical-dependencies-and-roadmap
    title: Critical Dependencies, Roadmap, and Adverse Evidence
    body: >
      Critical supply-chain dependencies are significantly lower than for Li-ion chemistry. Sulfur
      is an industrial by-product of oil and gas refining, abundantly available domestically and
      globally at low cost. Lyten's 3D Graphene is produced from methane (natural gas), which is
      also abundant and domestically sourced. The most constrained input is battery-grade lithium
      metal for the anode. In April 2025, Lyten announced the first US production of battery-grade
      lithium-metal foil using lithium alloys and lithium metal entirely sourced from within the US,
      reducing import dependency and FEOC exposure. Other inputs — electrolyte solvents, salts,
      separator materials, and standard cell-assembly hardware — are either domestically available
      or sourceable from non-restricted geographies.

      Technology dependencies include the proprietary microwave plasma reactor system (patented,
      in-house); controlled by Lyten's 541+ patent portfolio, which covers 3D graphene synthesis
      (US11309545B2), expansion-tolerant cathode structures (US11335911B2), and recent thick-cathode
      hybrid-electrolyte architectures (WO2025085743A1). DoE validated the commercial potential of
      Lyten's LiS technology through a $4M grant awarded January 2024.

      The technology roadmap has four documented stages: (1) 2023 pilot-line commissioning and
      A-sample supply (defense/aerospace boutique); (2) 2024–2025 scale-up at San Leandro for
      non-EV commercial volumes; (3) H2 2026 NMC commercial sales from Northvolt Sweden supporting
      BESS and automotive bridge customers while LiS industrialisation continues in Västerås;
      and (4) a later gigascale LiS manufacturing phase, timeline unspecified. The Nevada gigafactory
      plan (announced October 2024) was abandoned by early 2026 in favour of acquired European assets.

      Adverse evidence on cycle life is well-documented in Lyten's own technical papers.
      The 150-cycle-at-100%-DoD result in commercial-format cells represents a roughly 10–13×
      shortfall versus Li-ion requirements for automotive EV (typically 1,500–2,000 cycles).
      Industry analysts at CleanTechnica (August 2025) reported that Lyten had not yet convinced
      European carmakers, including former Northvolt customers, to make binding supply commitments.
      The electrolyte-to-sulfur ratio challenge and lithium-metal anode dendrite management remain
      active research problems, not solved engineering questions. External technical commentary on
      Li-S chemistry generally confirms that practical cycle life at realistic energy density and lean
      electrolyte conditions — a prerequisite for cost-competitive cell economics — remains an
      unsolved challenge across the industry, not unique to Lyten.

      Manufacturing scale-up risk is material. The transition from 2.4 MWh/yr pilot to
      200 MWh/yr San Leandro to eventually multi-GWh LiS production requires resolving yield, process
      uniformity, electrolyte management at scale, and lithium-metal anode handling — none of which
      have been publicly validated beyond pilot. The Northvolt Sweden acquisition provides
      infrastructure but requires substantial capital for chemistry conversion.
