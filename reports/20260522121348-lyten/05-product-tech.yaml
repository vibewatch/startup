  - id: TE003
    title: Technology and Operating Architecture
    columns:
      - Layer / Component
      - Role in System
      - Key Dependency
      - Risk
    rows:
      - - 3D Graphene synthesis (methane cracking reactor)
        - Converts CH₄ to 3D carbon scaffold and H₂; core feedstock for all products
        - Proprietary microwave plasma reactor; methane supply; San Jose fab
        - Single-site concentration; reactor uptime and yield are undisclosed
      - - Sulfur cathode (3D Graphene-sulfur composite)
        - Stores lithium during discharge; polysulfide confinement via nano-capture
        - Sulfur (industrial by-product; abundant); proprietary binder; aqueous process
        - Sulfur loading and areal capacity limits energy density; volume expansion (~80%) during cycling
      - - Protected lithium-metal anode
        - Provides lithium-ion source during charge; critical for cell energy density
        - US-domestic lithium metal foil (production begun April 2025); anode coatings
        - Dendrite formation; SEI instability; polysulfide-induced passivation
      - - Electrolyte (low E/S ratio formulation)
        - Enables sulfur reduction kinetics; must stabilise both anode and cathode
        - Proprietary salt/solvent blends; low electrolyte-to-sulfur ratio critical
        - Electrolyte consumption by polysulfide shuttle; mass contributes ~50% of cell weight
      - - Multifunctional separator
        - Limits polysulfide migration between electrodes; additional confinement layer
        - Specialty separator suppliers; proprietary coatings
        - Additional cell cost; compatibility with LiS electrolytes requires optimisation
      - - Cell formats (MLP pouch / 18650 / 2170 cylindrical)
        - Commercial delivery format for OEM integration and system assembly
        - Standard Li-ion-compatible assembly equipment (adapted for LiS)
        - Cycle life in MLP (~150 @ 100% DoD) lags coin-cell results (~300); ongoing improvement
      - - LytenCloud (BESS monitoring platform)
        - Remote monitoring and control of Voltpack BESS deployments
        - Cloud infrastructure; connectivity to Voltpack hub inverter/control systems
        - Software-as-a-service continuity; cybersecurity of grid-connected storage
    notes: >
      Architecture as of May 2026 based on published technical papers, patent filings, and company
      product pages. Proprietary process parameters and manufacturing yield are not public information.
