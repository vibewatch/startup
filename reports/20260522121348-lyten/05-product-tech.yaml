  - id: product-line-map
    title: Product Line Map
    body: >
      Lyten commercialises five distinct product lines, all derived from the 3D Graphene platform:

      Lithium-Sulfur Battery Cells are the flagship product, available in multi-layer pouch
      (6.5 Ah A-sample, 10 Ah pilot-line format) and cylindrical (18650, 2170, 26650) formats.
      The cells contain no cobalt, nickel, manganese, or graphite, making them NDAA-compliant and
      tariff-exempt under current US-China trade policy. First commercial delivery of A-samples
      occurred in May 2024 to Stellantis and other OEMs. The cells are manufactured in San Jose,
      California, with scale-up ongoing at San Leandro and future transfer to Northvolt Labs in
      Västerås for gigascale LiS industrialisation.

      The Voltpack Mobile System (VMS) is Lyten's BESS product line, acquired through the Northvolt
      Gdańsk transaction in October 2024 and incorporated into the July 2025 Northvolt portfolio
      acquisition. The VMS is in its third generation, with commercial installations across Europe.
      Each Voltpack module scales from 281 kWh to 1,405 kWh and up to five Voltpacks can be
      paralleled via a central hub to larger system capacities. The hub integrates inverter and
      auxiliary systems, supports island mode, peak shaving, microgrid, grid arbitrage, and mobile
      power applications, and provides cloud connectivity via LytenCloud. The Gdańsk facility has
      6 GWh annual BESS manufacturing capacity. Current generation VMS modules use lithium-ion
      chemistry; the product roadmap targets LiS-powered BESS as the technology matures.

      Lightweight Composites use 3D Graphene as an additive in polymer matrices to deliver weight
      reduction of up to 50% while maintaining structural and impact strength. Intended for
      transportation, aerospace, and construction applications, these are in early commercial stage
      with customers in automotive and industrial channels. Lyten also markets a concrete admixture
      product and 3D-printing filaments using 3D Graphene.

      IoT Sensor Arrays leverage the tunable electrical properties of 3D Graphene to build
      next-generation chemical and environmental sensors with significantly increased detection
      sensitivity and selectivity. Current applications span methane detection, structural health
      monitoring, automotive gas sensing, industrial monitoring, and supply chain tracking.
      Commercial stage is early, with partnerships including Honeywell (investor with strategic
      sensing application interest).

      Legacy NMC Lithium-Ion Cells will be produced at the Northvolt Ett Skellefteå facility
      as a near-term bridge product, supporting existing Northvolt customer commitments (including
      Scania and Porsche 718 successor models) and generating revenue while the facility transitions
      toward LiS chemistry. Commercial NMC cell sales from Sweden target H2 2026.
