      - number: '5.6'
        title: Safety, Quality, and Compliance
        blocks:
          - type: paragraph
            body: >
              Lyten's LiS cells have demonstrated surprisingly strong abuse tolerance in preliminary testing, which is a
              meaningful differentiator versus lithium-ion chemistries that carry known thermal- runaway risk. Abuse
              tests on multi-layer pouch and 18650 cylindrical cells — including nail penetration (simulating internal
              short), external short, overcharge, over-discharge, and mechanical crush — produced no flame, smoke,
              charring, rupture, or thermal runaway, and only a small temperature rise. The mechanism is attributed to
              non-conductive reaction products (Li₂S₂ and Li₂S) that form locally at fault sites, electrically
              insulating the short circuit; and to the absence of oxygen evolution from the sulfur cathode during
              overcharge, removing a key exothermic pathway present in NMC and NCA chemistries. This behaviour is
              consistent with published third-party studies on OXIS Energy Li-S cells.

              Regulatory compliance postures: National Defense Authorization Act (NDAA) compliance is confirmed. Lyten
              cells contain no cobalt, nickel, manganese, or graphite — eliminating the Chinese-dominated critical
              mineral supply chain that disqualifies most Li-ion cells from DoD procurement. This is explicitly stated
              across Lyten's defense-facing product communications and is a primary selling point for UAV and satellite
              customers.

              Inflation Reduction Act (IRA) compliance is confirmed for the domestic manufacturing credit pathway.
              Lyten's LiS cells are manufactured in California using materials sourced within the United States and are
              not subject to tariffs on electric vehicles, batteries, and critical minerals imported from China. This
              IRA-qualification claim was explicitly asserted in the September 2024 ISS announcement.

              Space qualification: The ISS demonstration project is specifically designed to generate flight-certified,
              space-compatible cells across three formats. ISS integration requires compliance with NASA safety and
              reliability standards. Lyten's stated target is full flight certification upon completion of the ISS
              demonstration mission.

              Automotive certification: No automotive-standard safety certifications (UN 38.3 transport, ISO 26262
              functional safety, IATF 16949 quality) have been publicly confirmed for Lyten's LiS cells at
              commercial-format scale. OEM qualification requires extensive cell-level and pack-level testing that is
              ongoing. This is a known gap for the automotive revenue pathway.

              Quality and manufacturing controls at scale are not publicly disclosed. Lyten has not published yield
              data, defect rates, or process capability metrics. The pilot-scale operation at San Jose employs standard
              Li-ion-compatible equipment adapted for LiS chemistry, which reduces process-engineering risk compared to
              a from-scratch novel process, but manufacturing yield at commercial volumes for LiS cells is unvalidated.
