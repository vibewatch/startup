      - number: '1.3'
        title: Core Technology Platform
        blocks:
          - type: paragraph
            body: >
              Lyten's foundational technology is Lyten 3D Graphene™, a proprietary form of graphene with a
              three-dimensional structure rather than the conventional two-dimensional single layer. The material is
              synthesised by passing hydrocarbon gases (primarily methane) through a microwave plasma reactor, which
              breaks down the molecules and deposits carbon as a solid 3D graphene structure while releasing hydrogen
              for capture as clean fuel. The process has been independently verified to be carbon neutral at scale,
              according to company statements backed by investor disclosures.

              Unlike flat, 2D graphene, Lyten 3D Graphene is tunable: engineers can adjust its porosity, electrical
              conductivity, structural stiffness, and chemical affinity by modifying synthesis parameters and
              post-processing. This tunability is what allows a single platform to serve battery cathodes, structural
              composites, and sensor membranes.

              In lithium-sulfur batteries, 3D Graphene's key role is to act as a porous scaffold that holds sulfur atoms
              in place within the cathode, preventing the polysulfide-shuttling effect that historically limits Li-S
              cycle life. The graphene scaffold is electrically conductive, enabling efficient charge transport, while
              immobilising dissolved lithium polysulfides that would otherwise migrate to the anode and degrade the
              cell. Lyten claims its cells target greater than twice the energy density of conventional NMC lithium-ion
              batteries and up to 50% lower weight, with a carbon footprint estimated at 60–65% lower than best-in-class
              lithium-ion because the chemistry eliminates nickel, cobalt, manganese, and graphite from the supply
              chain. The pilot production line in San Jose manufactures cells in both pouch (6.5 Ah) and cylindrical
              formats (18650 and 21700).
            claimRefs:
              - CO013
              - CO018
