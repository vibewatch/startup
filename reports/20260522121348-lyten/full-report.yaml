      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Lyten's commercial and financial position is heavily concentrated in a small number of strategic
              relationships, each of which carries potential for misalignment. Stellantis is simultaneously a strategic
              investor (disclosed stake, value undisclosed), a Joint Development Agreement partner, and an A-sample
              evaluation customer — and in December 2024 it signed a parallel JDA with Zeta Energy, Lyten's nearest US
              Li-S competitor, for EV battery development. This multi-supplier hedging strategy signals that Stellantis
              has not committed exclusively to Lyten's chemistry and creates a real risk that the relationship remains
              at evaluation stage permanently. FedEx and Honeywell are equity investors (Series B, September 2023) with
              no publicly disclosed procurement agreements; their inclusion in commercial narratives conflates investor
              and customer roles. The AEVEX Aerospace partnership — Lyten's sole publicly named defence-drone customer —
              has a stated intent to "demonstrate, manufacture, and deliver" UAVs with Lyten cells, but no completed
              first delivery has been confirmed in any public source as of May 2026. In the space channel, the DIU ISS
              demonstration is a single government-funded contract with no disclosed production follow-on. On the
              financing side, the US Export-Import Bank represents the largest single prospective financing source ($650
              million LOI) but is non-binding and subject to political risk — EXIM's mandate and priorities shift with
              administration changes, and the LOI's alignment with the "Make More in America" initiative may be
              re-evaluated if US industrial policy priorities shift. European Union grant funding for battery
              manufacturing is actively sought (Lyten has indicated it is "targeting EU battery booster grants"), but EU
              state-aid rules impose co-investment and compliance requirements that could constrain Lyten's flexibility.
              Supply chain dependencies include California Sulphur Company and Port of Stockton supplier for industrial
              sulfur (both sole-sourced), Creative Engineers Inc. (New Freedom, PA) for lithium metal alloy processing,
              and an undisclosed Eastern US lithium feedstock supplier. A disruption to any of these domestic supply
              nodes could halt US Li-S cell production.
