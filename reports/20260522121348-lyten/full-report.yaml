      - number: '8.3'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >
              Public comparables for Lyten are imperfect because no pure-play Li-S battery company is listed on any
              major exchange. QuantumScape (NASDAQ:QS) is the closest structural analog: a pre-commercial
              next-generation battery company with a mature public market price. As of May 22, 2026, QuantumScape
              carried a market capitalization of approximately $5.10B against FY2025 first billings of only $19.5M,
              reflecting an extreme technology premium driven by the Toyota partnership and solid-state platform
              narrative. QuantumScape's FY2025 10-K (SEC EDGAR) reports a net loss of $421M and operating loss of $458M,
              with net cash of $835M providing approximately two years of runway at current burn. SES AI (NASDAQ:SES)
              and Solid Power (NASDAQ:SLDP) represent additional public analogs at earlier commercial stages; both trade
              below $1B market capitalization, having suffered steep declines from their SPAC-era peaks, illustrating
              how the public market reprices pre-revenue battery startups over time.

              Private market comparables are sparse and earlier-stage. Theion (Berlin, Germany), the only other
              well-documented pure-play Li-S startup, raised only €16M in a Series A. PolyPlus Battery, a lithium-water
              battery developer, was acquired by Panasonic in 2023 without disclosing price. Northvolt, the dominant
              adverse comparable, raised $15B+ before filing Chapter 11 in November 2024; its equity investors absorbed
              near-total losses. ForgeGlobal lists Lyten as a pre-IPO watchlist entry without active secondary market
              trading. NewMarketPitch places Lyten among high-potential LDES startups but with no disclosed revenue
              anchor. ChemAnalyst characterizes the Li-S commercial market as in early-commercialization stage with no
              dominant player established, and FutureMarketInsights forecasts the Li-S battery market reaching only
              $82.5M by 2030—a small absolute TAM that limits near-term revenue thesis confidence.
