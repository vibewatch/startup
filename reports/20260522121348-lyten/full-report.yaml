      - number: '3.5'
        title: Moat Durability, Switching Costs, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >
              Lyten's primary moat claims rest on three pillars: proprietary 3D graphene synthesis enabling a unique
              sulfur cathode host, domestic US supply chain aligned with FEOC/NDAA requirements, and first-mover early
              adoption in defense and UAV niches. Each pillar faces durability risks.

              On IP: Zeta Energy's independently developed sulfurized-carbon cathode and CNT-anode approach demonstrates
              that alternative architectures can reach comparable performance (450 Wh/kg, 2,000 cycles) without
              replicating Lyten's specific 3D graphene process. Theion's crystalline-sulfur cathode and Sion Power's
              Licerion® lithium-metal anode represent further independent technical pathways. The existence of multiple
              convergent Li-S architectures reduces the "single-solution" exclusivity of Lyten's IP without eliminating
              it; patent counts (Sion Power: 430+, Zeta: 60+, Lyten's own portfolio undisclosed in public filings)
              suggest a crowded IP landscape.

              On supply chain: Lyten's NDAA-compliant, domestically-sourced claim is genuinely differentiated versus
              Chinese suppliers, but Zeta Energy makes the same assertion, and Sion Power's Tucson facility is also
              domestic. The US-supply advantage is table stakes among next-gen US-based players, not a differentiator
              within that set.

              On switching costs: Buyers in defense and aerospace face long qualification cycles (DoD qualification for
              new cell chemistries can take 2–5 years), which creates temporary lock-in for any first-to-qualify
              supplier, including Lyten. However, if Sion Power qualifies its Licerion® cells in the same segments
              before Lyten scales volume, that advantage reverts to Sion. For the EV OEM segment, automakers
              structurally multi-home: Stellantis holds simultaneous JDAs with both Lyten (investment, 2023) and Zeta
              Energy (JDA, December 2024), confirming that automotive buyers do not provide exclusivity to any single
              next-gen chemistry partner.

              Adverse evidence: LG Energy Solution's own analysts project that Li-S batteries are unlikely to enter
              mass-market automotive use before 2030, and that fundamental technical challenges (polysulfide shuttle,
              volumetric change, anode dendrite formation, low-temperature performance) remain partially unresolved
              across the entire Li-S category. A nature.com benchmarking study confirms that practical Li-S cells in
              2025 achieve cycle stability exceeding 400–600 cycles under moderate conditions, still below Li-ion's
              1,000–5,000-cycle commercial standard. Theion's CEO acknowledged "there is still a way to go" before full
              commercial pouch cells are ready. Lyten's own gigafactory plans in Reno, Nevada collapsed in 2025, raising
              questions about manufacturing execution risk at scale.
