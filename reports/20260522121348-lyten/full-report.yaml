companyProfile:
  summary: >-
    Lyten was founded in 2015 in San Jose, California by Dan Cook (CEO) and co-founders who developed the company's
    proprietary Three-Dimensional Graphene synthesis process. The technology converts greenhouse gases (methane) into
    solid carbon and hydrogen, producing 3D Graphene with tuneable thermal, electrical, and structural properties.
    Lyten's primary product lines are lithium-sulfur (Li-S) battery cells (branded LytCell), lightweight composites, IoT
    sensor arrays, and BESS systems (Voltpack). In September 2023, the company raised a $200M Series B led by Prime
    Movers Lab with Stellantis, FedEx, Honeywell, and Walbridge as co-investors; in July 2025, it closed a second $200M
    round, bringing total equity raised to $625M. In February 2026, Lyten acquired former Northvolt assets — the
    Northvolt Ett gigafactory in Skellefteå, Sweden and a BESS facility in Gdańsk, Poland — positioning the company for
    large-scale Li-S cell and BESS production. As of May 2026 the company employs approximately 315 people at its San
    Jose headquarters, with additional headcount from the Swedish and Polish acquisitions. Revenue from BESS and defense
    channels is expected but no audited financials have been published.
