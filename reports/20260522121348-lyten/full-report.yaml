  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Lyten's buyers—defense integrators, aerospace primes, UAV OEMs, automakers, and stationary-storage
              developers—can solve the "higher energy per kilogram" job through several routes: adopt a competing Li-S
              cell, switch to a solid-state lithium-metal cell, deploy an advanced LFP or NMC pouch from an incumbent,
              wait for status-quo technology to improve, or fund an internal R&D program. Each route imposes different
              switching costs, qualification timelines, and risk profiles, so Lyten competes simultaneously against
              pre-commercial peers, large established suppliers, and the inertia of proven incumbents.

              Direct Li-S peers—Zeta Energy, Sion Power, Theion, and PolyPlus—all target the same high-energy-density
              niches and share Lyten's core thesis that sulfur replaces costly critical minerals. None has reached
              gigawatt-hour production, but Zeta's 2024 Stellantis joint development agreement and Sion Power's 2026
              pivot to defense significantly heighten near-term competitive pressure on Lyten's two core markets.

              Adjacent next-generation competitors (QuantumScape, Factorial, SES AI) address the same buyer pain
              points—energy density, weight, range—through solid-state or lithium-metal chemistries rather than Li-S.
              Their OEM partnerships are, in several cases, more advanced than Lyten's: Factorial has Stellantis
              demonstration-fleet validation by 2026 and four major OEM JDAs, while QuantumScape licenses to
              Volkswagen's PowerCo. These companies compete for the same vehicle-integration budget and the same program
              slots at global automakers.

              Incumbent Li-ion suppliers—led by CATL (45.2% global EV battery share in January 2026) and BYD
              (13.8%)—represent the deepest competitive moat through scale, proven reliability, and rapidly falling LFP
              costs. The Korean trio (LG Energy Solution, Samsung SDI, SK On) are deploying domestic LFP capacity in the
              US market that competes in Lyten's stationary-storage segments. Status-quo NMC/LFP remains the default
              choice and resets the hurdle Lyten must clear on cost, cycle life, and supply-chain integration with every
              design win.
