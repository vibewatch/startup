      - number: '2.5'
        title: Adoption Constraints and Disconfirming Evidence
        blocks:
          - type: paragraph
            body: >
              Li-S batteries face a set of interconnected technical and commercial barriers that constrain near-term
              adoption and limit Lyten's SAM relative to the headline TAM.

              Cycle life is the primary gating constraint. Lyten's disclosed 2026 target is 500 C/3-rate charge cycles—a
              benchmark that, if met, would enable drone and space applications but falls short of the 1,000–2,000
              cycles required for automotive EV and 3,000–6,000 cycles required for mainstream BESS. The polysulfide
              shuttle effect— where lithium polysulfide intermediates dissolve into the electrolyte, migrate to the
              anode, and deplete the cathode—causes progressive capacity fade and remains the industry's primary
              unsolved manufacturing problem. Sulfur cathodes also expand up to 80% in volume during lithiation,
              stressing cell structure and reducing calendar life.

              Volumetric energy density limits space advantages. Modern Li-S cells achieve ~500 Wh/kg gravimetrically
              but only ~540 Wh/L volumetrically—comparable to Li-ion rather than superior. For space-constrained EV
              platforms where volume matters as much as weight, this limits the substitution case to weight-sensitive
              applications only.

              LFP cost competition is severe and worsening. LFP pack prices fell to $52–74/kWh in 2025 versus Li-S cells
              that remain in small-batch pricing. Battery storage costs in China reached $63/kWh in system-level BESS
              tenders—a floor that Li-S cannot yet compete against for stationary storage. Apricum's analysis concludes
              Li-S is "unlikely to make it to any applications where cycle life is paramount, such as stationary
              storage."

              Sodium-ion batteries have emerged as a competitive threat in cost-sensitive segments at $59/kWh—just above
              LFP but below NMC—and are being integrated into low-cost EVs by CATL and Chinese OEMs. Volta Foundation's
              2024 SWOT analysis identifies Na-ion as a "growing threat" to Li-S in exactly the cost-sensitive market
              segments where Li-S was expected to have an early commercial toehold.

              Manufacturing supply-chain immaturity and US tariff/FEOC compliance costs add friction. BESS project costs
              rose 56–69% in the US market due to Trump administration tariffs since January 2025. Long-duration energy
              storage (LDES) funding fell 30% in 2025, with VC investment dropping 72%, signaling investor skepticism
              about non-LFP chemistries reaching commercial viability within the near-term investment horizon. Oxis
              Energy's 2021 bankruptcy and Sion Power's pivot away from Li-S are historical precedents for the
              commercialization risk.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM033
              - CM035
              - CM036
      - number: '2.6'
        title: Evidence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              Several material uncertainties limit the precision of this market analysis.

              The Li-S-specific SAM cannot be isolated from published data. No analyst report segments the Li-S market
              by end-use at the level of granularity needed to bound Lyten's true SAM (e.g., high-performance UAV
              battery sub-segment vs. all UAV batteries). Published Li-S market estimates span $0.85 B (TBRC, 2025) to
              $271 B (Mordor Intelligence, 2025)—a 300-fold range reflecting incompatible methodologies. The Mordor
              figure appears to reflect a comprehensive TAM under optimistic disruption assumptions, while TBRC
              represents current or near-term commercial revenues. Neither provides a defensible bottoms-up SAM for
              Lyten's specific segments.

              Defense procurement volumes and contract values for Li-S batteries are classified or commercially
              sensitive. The US DoD's $2.6 B drone investment figure was cited in market research reports, but the
              portion allocated to battery R&D versus airframe or software development is not publicly disclosed, making
              the battery-specific defense market size difficult to estimate.

              Lyten's cycle-life data at commercial cell scale has not been independently validated. The 500-cycle
              target has been disclosed but not independently verified in peer-reviewed publications or third-party
              benchmarks. If cycle life falls short, the automotive EV and BESS segments become inaccessible,
              compressing Lyten's addressable market to UAV and space applications only.

              Pricing for Lyten's cells in commercial supply arrangements is undisclosed. Without contract pricing data,
              it is not possible to assess whether Lyten's unit economics are competitive with LFP at volume, or to
              verify the company's claim that Li-S production consumes 90% less energy than conventional Li-ion
              manufacturing.
