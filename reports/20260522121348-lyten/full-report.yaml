        blocks:
          - type: paragraph
            body: >
              Lyten addresses five distinct customer segments with materially different technology readiness levels,
              commercial maturity profiles, and buying-cycle dynamics. The defense and UAV segment is the most
              commercially advanced: Lyten dedicated California LiS production capacity to defense, unmanned systems,
              and satellite customers in May 2025 and began accepting orders. The space and ISS segment entered a
              government-funded qualification phase following a Defense Innovation Unit contract (September 2024) to
              test pouch and cylindrical LiS cells aboard the International Space Station. The automotive OEM segment is
              anchored by Stellantis, which signed a joint development agreement in May 2023, received A-sample (6.5 Ah
              pouch) cells in May 2024, and features Lyten cells in the Chrysler Halcyon Concept EV; however, no binding
              supply agreement exists and the relationship remains at evaluation stage. The BESS and grid-storage
              segment is the most commercially mature: the Voltpack Mobile System gen-3 product is manufactured in
              Gdańsk, Poland (6 GWh facility restarted after the Northvolt acquisition) and is shipping to inherited
              European customers. Consumer electronics, composites, and sensors represent a fifth segment with limited
              public disclosure — one major unnamed US OEM received A-sample cells in Q2 2024, and Honeywell
              participates as a strategic investor with undisclosed procurement interest. A critical segmentation note:
              FedEx and Honeywell are equity investors from the September 2023 Series B but have not publicly committed
              to purchasing Lyten products; their inclusion in commercialisation narratives conflates investor and
              customer roles. Geographic split is US-centric for LiS battery customers (defense, space) and
              Europe-centric for BESS.
