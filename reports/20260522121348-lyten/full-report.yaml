  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and Chemistry Risk
        blocks:
          - type: paragraph
            body: >
              The core technical risk for Lyten is that lithium-sulfur cycle life at automotive-grade depth-of-discharge
              (DoD) has not been demonstrated at commercial cell formats. Lyten's own published data — presented at the
              2023 Power Sources Conference and confirmed in a July 2025 aerospace presentation by JPL researcher K.
              Bugga — shows that multi-layer pouch and 18650 cylindrical cells achieve approximately 150 cycles at 100%
              DoD and ~1,000 cycles at 50% DoD. The automotive EV threshold is 1,500+ cycles at 100% DoD. The gap —
              roughly 10× at full discharge — is not a Lyten-specific failure but reflects the fundamental chemistry of
              lithium polysulfide dissolution: long-chain polysulfides (Li₂S₈ to Li₂S₄) dissolve into ether electrolyte,
              migrate to the lithium-metal anode, and undergo parasitic reduction reactions that deplete both cathode
              sulfur and electrolyte. Lyten's 3D graphene polysulfide- confinement architecture materially reduces this
              shuttle but does not eliminate it, and the electrolyte-to-sulfur ratio (E/S) must remain high in
              commercial cells — adding mass and reducing practical energy density relative to theoretical limits.
              Independent academic review in Oxford's National Science Review (2025) confirms that "practical pouch
              cells with high sulfur loading and low E/S ratios typically fail much sooner" than coin-cell benchmarks.
              Battery Technology Online notes that state-of-charge monitoring of Li-S cells is materially more complex
              than Li-ion, introducing reliability risk in BMS design across applications. Lithium-metal anode dendrite
              growth, a separate risk, can cause short-circuits and thermal runaway under deep cycling; Lyten mitigates
              this with proprietary anode protective layers and electrolyte additives but has not published independent
              cell-safety data at commercial scale. The commercialisation path therefore bifurcates: near-term
              applications (drones, satellites, BESS at moderate cycle counts) are achievable with current performance,
              while automotive requires a chemistry breakthrough that no Li-S developer has yet demonstrated in
              production-scale cells. Adverse evidence: a battery scientist at an unnamed European carmaker told Reuters
              (August 2025) that the firm "backed away from working with Lyten about six months ago because the US
              company was only producing at research and development scale" — corroborating that external EV partners
              share the same concern about cycle life and scale. The thesis-break trigger for this risk is failure to
              demonstrate ≥500 cycles at 100% DoD in 21700 or equivalent commercial cylindrical cells by end of 2027.
            claimRefs:
