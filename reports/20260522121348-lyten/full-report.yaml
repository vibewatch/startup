  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              Lyten's relevant market consists of four nested arenas, each with distinct budget owners and technology
              substitutes. The innermost ring is the lithium-sulfur battery market—pre-commercial cells and packs
              serving high-value niches where energy density and weight savings justify a premium over lithium-ion. The
              second ring is the broader advanced-battery market, which includes solid-state, sodium-ion, lithium-metal,
              and next-generation chemistries competing for the same performance-sensitive applications. The third ring
              covers end-use segment markets—UAV/drone power systems, space and satellite batteries, automotive EV
              batteries, and stationary BESS—in which Lyten's Li-S cells compete against incumbent LFP and NMC
              batteries. The fourth ring, the overall energy storage market, provides macro demand signals.

              Included spend comprises primary cells and battery packs for defense UAVs, spacecraft, commercial drones,
              automotive EV modules (design-in phase), BESS systems under the Voltpack brand, and advanced-material
              licensing. Excluded are commodity lead-acid, consumer-electronics Li-ion, hydrogen fuel cells, and flow
              batteries, none of which Lyten currently addresses. Status-quo substitutes differ by segment: defense UAV
              buyers default to lithium-polymer (LiPo) and high-density Li-ion packs; satellite programs rely on
              heritage nickel-hydrogen and mission-grade Li-ion; automotive OEMs use cylindrical and prismatic NMC or
              LFP; BESS operators overwhelmingly deploy LFP at $63/kWh tenders. Any Lyten adoption story depends on
              demonstrating a compelling advantage over these incumbents in the specific performance dimension that
              matters most to each buyer—weight and range for UAV and EV, cost and cycle life for BESS, and radiation
              tolerance plus weight for space.
