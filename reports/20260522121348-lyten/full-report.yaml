      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Lyten's buyer landscape is fragmented across four segments with meaningfully different budget cycles,
              technical gatekeepers, and adoption triggers.

              Defense and government programs are the most advanced buyers. The US DoD announced a $2.6 B drone
              technology investment in March 2024 that includes battery R&D, and military UAV applications represent
              about 31% of global UAV battery demand. Defense procurement runs on multi-year acquisition cycles
              (typically 3–7 years from qualification to volume contract), requiring MIL-SPEC certification and
              extensive thermal and vibration testing. Budget authority sits with program offices (e.g., PEO Missiles
              and Space), not procurement divisions.

              Space and satellite programs represent the highest-margin segment. Lyten's Li-S cells were formally
              presented at the 2023 NASA Aerospace Battery Workshop, and the company secured a demonstration slot on the
              International Space Station. North America holds 31.2% of the $4.68 B space battery market. Buyers (NASA,
              commercial LEO operators, defense satellite primes) pay a significant premium for weight savings and
              radiation tolerance, but qualification cycles can span 3–5 years.

              Automotive OEMs are the largest long-term prize but the furthest from revenue. Stellantis's $323 M
              investment in Lyten signals design-in intent, but OEM battery qualification (PPAP process) requires 2–4
              years of field validation before volume supply. The global EV market grew to over 25% of new vehicle sales
              in 2025, and IEA projects 40% EV penetration by 2030—creating a large demand pool if Li-S achieves
              sufficient cycle life.

              Commercial drone and logistics operators (including FedEx as a Lyten investor) sit between defense and
              automotive in qualification timelines. Their primary driver is flight-time extension per battery weight,
              and they typically buy through tier-1 drone manufacturers rather than directly from cell suppliers.
              Commercial drones' share of UAV battery demand is growing rapidly.
