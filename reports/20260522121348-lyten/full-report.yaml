      - number: '1.2'
        title: Founding, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Lyten was founded in 2015 in San Jose, California. Its co-founder and CEO, Dan Cook, has served as
              President and Chief Executive Officer since inception and is widely cited in press releases and investor
              communications as the primary spokesperson. Cook's background spans advanced materials and cleantech
              commercialisation; he co-authored key IP related to the 3D graphene synthesis process and has been the
              named executive in every major funding announcement since 2023.

              Celina Mikolajczak serves as Chief Battery Technology Officer (CBTO), bringing deep battery chemistry and
              manufacturing expertise. Prior to Lyten, Mikolajczak held senior roles at Panasonic and Tesla's battery
              division, and she leads the technical roadmap for the lithium-sulfur cell programme. Keith Norman serves
              as Chief Marketing Officer (CMO) and was previously the Chief Sustainability Officer, having responded to
              press inquiries and authored public-facing positions on Lyten's supply-chain and sustainability claims.
              Ratnakumar Bugga joined as Senior Fellow with 34 years of space battery R&D experience, directly
              supporting the ISS demonstration programme.

              In September 2025, following the announced acquisition of Northvolt's European assets, Lyten appointed
              Matthias Arleth as CEO of Lyten Sweden, reporting to Dan Cook. Arleth brought more than 25 years of
              international leadership across automotive, energy, and electronics industries, having joined Northvolt
              one year earlier as President BU Cells and COO. Robert Chryc-Gawrychowski was named CEO of Lyten Poland,
              and Sami Haikala continues as CEO of Northvolt Labs in Västerås. Dennis van Schie joined as Chief Supply
              Chain Officer for Lyten Sweden.

              Lyten has not publicly disclosed its full board composition or governance structure. The investor seat
              held by Zia Huque (Prime Movers Lab General Partner) is publicly noted. Key-person dependence on Dan Cook
              appears material given his central role in both the technical vision and investor relations.
