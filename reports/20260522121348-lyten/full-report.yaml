chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Mission
        blocks:
          - type: paragraph
            body: >
              Lyten, Inc. is a San Jose, California-based supermaterial applications company that describes itself as
              the pioneer in Three-Dimensional Graphene—a novel class of carbon material produced by converting
              greenhouse gases such as methane into solid carbon and hydrogen gas. The company was incorporated and
              began operations in 2015 and has pursued a dual-track commercialisation strategy: developing its
              proprietary 3D Graphene platform as a foundational technology and simultaneously building products that
              leverage its unique properties across multiple high-value industries.

              Lyten's stated mission is to "enable economic growth without emissions growth in every economy across the
              planet." The company frames its supermaterial approach as a way for even the highest-emitting industries
              to achieve net-zero targets without compromising performance, profitability, or customer experience. Its
              tagline—"Lighter. Stronger. Lower Cost. AND Cleaner."—encapsulates the core value proposition: that
              decarbonisation should not require a trade-off against industrial performance.

              The company's primary product lines are lithium-sulfur (Li-S) battery cells and systems, lightweight
              composites, IoT sensor arrays, and battery energy storage systems (BESS) under the Voltpack brand. A
              concrete admixture product and advanced 3D-printing filaments have been added more recently. Each of these
              applications draws on the tunability of Lyten 3D Graphene™, which can be engineered at the atomic level to
              optimise thermal, electrical, structural, and energy-absorbing properties across a wide range of use
              cases. The company's homepage as of May 2026 reported $625M in capital raised, 541 patents granted and
              pending, and approximately 315 employees—though headcount has grown significantly as European operations
              have been added.
