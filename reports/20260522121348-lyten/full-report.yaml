      - number: '7.3'
        title: Manufacturing and Operational Risk
        blocks:
          - type: paragraph
            body: >
              Lyten's acquisition-led manufacturing strategy — buying distressed Northvolt assets rather than building
              greenfield facilities — reduces upfront capital cost but introduces a distinctive set of operational
              risks. Northvolt's collapse provides a direct cautionary parallel: the Skellefteå gigafactory ran at less
              than 10% of target capacity and had over 4,000 unopened equipment boxes before bankruptcy; production
              lines designed for NMC chemistry must now be re-tooled for Li-S chemistry, which has different electrolyte
              handling requirements, cathode deposition processes, and anode preparation steps. Lyten has committed to
              delivering commercial cells from Skellefteå (Northvolt Ett) to its Gdańsk BESS facility in H2 2026 — a ~7
              month timeline from acquisition completion (February 2026) that is aggressive by any historical standard
              for battery manufacturing turnarounds. No independent production yield, ramp rate, or quality
              certification data has been published for the Skellefteå facility under Lyten management. The San Leandro
              facility (acquired from Northvolt's Cuberg unit in November 2024) has been partially restarted, but its
              Li-S cell volume remains at pilot scale. The Gdańsk Poland facility (Northvolt Dwa, acquired in October
              2025) is the most commercially mature — it is shipping Voltpack NMC BESS product — but it runs on NMC
              chemistry and will require conversion for any Li-S BESS product. A fire or thermal incident at any Li-S
              manufacturing facility would have outsized reputational and regulatory consequences: the proposed Reno
              factory faced "strong opposition" from Stead and Silver Knolls residents citing the Moss Landing,
              California BESS fire as a precedent, and lithium-metal anode manufacturing carries inherent fire-hazard
              risk that is higher than conventional Li-ion. The manufacturing management team — Matthias Arleth
              (Sweden), Robert Chryc-Gawrychowski (Poland), and Sami Haikala (Västerås R&D) — joined through the
              Northvolt acquisition and have no track record of delivering Li-S cell production at scale. Lyten has said
              it plans to hire 600+ additional employees in Europe over 12 months, which introduces workforce ramp and
              quality-system risk typical of early-stage manufacturing scale-up.
