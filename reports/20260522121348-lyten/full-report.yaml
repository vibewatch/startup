  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Proxies
        blocks:
          - type: paragraph
            body: >
              Lyten operates a direct B2B sales model, selling lithium-sulfur battery cells and systems to customers in
              defense, drone/UAV, battery energy storage (BESS), space, and ultimately automotive markets. No consumer
              or channel distribution exists at this stage. The company completed delivery of its first commercially
              available LiS cells in May 2024, initially targeting non-EV applications where regulatory barriers are
              lower and weight-to-energy ratio premiums justify pricing.

              Beyond LiS cells, Lyten holds three product revenue streams: (1) restarted NMC lithium-ion battery
              production from the acquired Northvolt Ett facility in Skellefteå (near-term bridge revenue); (2) BESS
              systems via the Voltpack Mobile System (VMS) product portfolio acquired from Northvolt in July 2025, which
              is already in its third generation with commercial European installations; and (3) graphene composites and
              chemical sensors for industrial customers. The Poland (Gdansk) facility is producing BESS products
              targeting delivery in Q4 2025, and the Swedish factory targets commercial battery cell sales in H2 2026.

              No public list pricing exists for LiS cells. Pricing is negotiated in B2B contracts under confidentiality.
              Lyten claims that at manufacturing scale, LiS will be lower-cost than Li-ion because sulfur is an
              industrial by-product while cobalt, nickel, and graphite are eliminated from the chemistry. This cost
              advantage remains a company projection, not a corroborated market data point. The defense and space
              segments command premium pricing due to weight, cycle-life, and supply-chain independence requirements,
              providing a favorable early-revenue mix before the more price-sensitive automotive segment matures.
            claimRefs:
