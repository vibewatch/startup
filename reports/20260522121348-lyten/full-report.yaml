      - number: '8.6'
        title: Recommendation, Investment KPIs, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The overall investment recommendation for Lyten is Track at Low confidence, with a High risk rating and
              Stretched valuation stance. The company demonstrates genuine technology differentiation—its 3D
              graphene-enabled Li-S platform is the furthest-commercialized Li-S technology in the public record—but the
              $1.3–1.5B estimated valuation cannot be independently supported without audited financial disclosure. The
              EXIM LOI is a pivotal near-term catalyst: conversion to a formal preliminary commitment within 12 months
              would be a strong positive signal justifying an upgrade to Buy at appropriate entry price. Failure to
              convert, or a structural change in the LOI conditions, would be a thesis-break event.

              What would change the call to Buy: (1) publication of EXIM preliminary commitment; (2) release of FY2025
              audited financial statements showing >$20M commercial product revenue; (3) execution of a binding OEM
              supply contract with >$50M annual take-or-pay obligation; and (4) commencement of Li-S cell production at
              Lyten Sweden. A downgrade to Avoid would be triggered by LOI lapse, a material down-round, or termination
              of the Stellantis JDA. The diligence asks in the Final Diligence Asks table are priority items for any
              investor conducting serious due diligence. The Investment KPIs scorecard summarizes key quantitative
              anchors derived from public sources, noting that the absence of audited financials limits the value of
              most financial metrics to indicative estimates only.
