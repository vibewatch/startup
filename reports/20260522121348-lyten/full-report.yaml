      - number: '8.2'
        title: Financing History and Valuation Marks
        blocks:
          - type: paragraph
            body: >
              Lyten has raised $625M across five funding rounds since its founding in 2015, making it one of the most
              heavily capitalized lithium-sulfur battery startups globally. The Series B, closed in September 2023,
              raised $200M and was led by Prime Movers Lab with strategic investors including Stellantis, FedEx, and
              Honeywell. Post-Series B implied valuation estimates cluster near $1.15B based on typical Series B
              dilution parameters. The Series C, closed in July 2025, raised $200M or more with Prime Movers Lab
              continuing as lead investor and Luxembourg Future Fund joining as a new institutional backer, signaling EU
              sovereign support for Lyten's European manufacturing expansion. Post-Series C implied valuation estimates
              range from $1.3B (Tracxn) to $1.4B (Compworth) to "at least $1.5B" (AccessIPOs).

              Compworth's model-based estimate of approximately $110M in annualized revenue is the only available proxy
              for commercial activity, but it is derived from a proprietary model and not from audited financial
              statements. No secondary market transactions in Lyten equity have been publicly reported on Forge Global
              or any other pre-IPO platform, limiting the ability to determine a market-clearing price. The $650M EXIM
              LOI issued December 17, 2024 is non-binding and has not been converted to a formal preliminary commitment
              as of May 2026. Tracxn classifies Lyten in the "Lithium Sulfur Batteries" sector and confirms the $625M
              total raised as of its May 2026 data update. CB Insights tracks Lyten as a private company without public
              financial disclosure. No IPO timeline or listing exchange has been announced; Forge Global lists Lyten as
              a pre-IPO watchlist company in monitoring status without active secondary market pricing.
