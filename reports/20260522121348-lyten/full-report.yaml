      - number: '5.4'
        title: Deployment and Application Readiness
        blocks:
          - type: paragraph
            body: >
              Defense and UAV / drone is Lyten's most advanced commercial deployment context. Lyten announced a
              dedicated drone propulsion initiative in May 2025, dedicating California manufacturing capacity to UAV,
              defense, and satellite sectors and accepting orders. The inaugural demonstration flight powered a Titan
              Dynamics 8.5-ft wingspan UAV at up to 86 mph for over three hours; the next battery generation targets 8
              hours of flight time on the same platform. Lyten's batteries are NDAA-compliant (no Chinese-sourced
              critical minerals), a critical qualification for US Department of Defense procurement. The Defense
              Innovation Unit has an ongoing production-focused relationship with Lyten. This segment commands premium
              pricing and has the shortest qualification cycle, making it the highest-confidence near-term revenue
              pathway.

              Space and ISS is a marquee validation signal. In September 2024, Lyten announced DIU-funded selection of
              its LiS cells for demonstration aboard the International Space Station (ISS) as part of a 2025 mission.
              Three cell formats (pouch and two cylindrical sizes) will be tested under launch, orbital, and recovery
              conditions, with Spacebilt/Skycorp as integration partner under ISS National Lab sponsorship via a
              NASA-funded commercial resupply mission. Ratnakumar Bugga, Lyten Senior Fellow with 34 years of space
              battery R&D experience (including prior NASA work on this technology), notes that Li-S was originally
              developed by NASA specifically to extend extravehicular activity time from 4–5 hours to 8 hours.
              Successful ISS demonstration would unlock a range of satellite, space-suit, and EVA applications where
              weight savings translate directly into cost and mission-duration benefits. Partial DoD cycling for
              satellite applications (where cycle depth is managed) reportedly achieves over 3,000 cycles.

              BESS and grid storage is Lyten's most commercially mature segment. The Voltpack Mobile System, already in
              its third generation with European commercial installations, is actively shipping from Gdańsk. This
              segment is adjacent to Lyten's core LiS technology and provides revenue while LiS cells mature. The value
              proposition centres on modularity (281–1,405 kWh per unit), mobility, NDAA compliance, EU-local
              manufacturing, and AI data-centre integration.

              Automotive EV is the long-term prize but the most technically distant near-term application. Lyten shipped
              A-samples to Stellantis in May 2024 and integrated its LiS battery design into Chrysler's Halcyon 800V
              concept vehicle. However, as of August 2025, European carmakers were explicitly withholding binding supply
              commitments, citing the unresolved cycle-life gap. Industry observers and analysts place EV-grade LiS
              commercialisation beyond 2028 at the earliest. B-sample deliveries to OEMs are expected from the San Jose
              pilot line in 2025–2026.

              Composites, sensors, and industrial applications represent an early-stage commercial layer. Honeywell
              (investor and strategic partner) has a stated interest in sensor applications. FedEx has explored
              logistics-chain integration. These segments are less capital-intensive than battery manufacturing and
              offer near-term revenue diversification, but public evidence of material contracted revenue is absent.
