      - number: '4.5'
        title: Financial Verdict and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Lyten's financial picture is dominated by evidence constraints: as a private company it has no disclosure
              obligation, no audited financial statements have been published, and all operating metrics—revenue, ARR,
              gross margin, burn rate, EBITDA—are confidential. The company is at a pre-commercial-scale inflection
              point where it has secured significant capital and manufacturing assets but has not yet demonstrated
              sustained commercial revenue.

              The revenue quality verdict is mixed. Near-term revenue from BESS sales (Poland) and defense/space LiS
              cells is credible and early-stage; the Voltpack Mobile System is a proven product with European
              installations. However, automotive revenue—which would underwrite Lyten's core technology thesis—is at
              least several years away and requires independent technical validation, industrial scale delivery, and OEM
              supply contracts that have not materialized.

              Capital adequacy is the primary financial risk. The company has $625M+ in equity, a $650M conditional EXIM
              LOI, and is targeting EU grant programs, but also carries the burden of $5B+ in acquisition commitments
              financed entirely through equity. The absence of debt facilities or long-term customer contracts means
              ongoing reliance on equity market receptivity. A third-party estimate of ~$110M annual revenue lacks
              primary source corroboration and should be discounted in underwriting.

              Diligence priorities are: (1) audited financial statements or management accounts; (2) confirmed status of
              EXIM LOI conversion to actual credit facility; (3) customer MOU details for CARICOM BESS contracts; (4)
              gross margin by product line; (5) burn rate and confirmed cash runway; (6) OEM letters of intent or supply
              agreements; and (7) technology readiness level for LiS at multi-GWh scale.
