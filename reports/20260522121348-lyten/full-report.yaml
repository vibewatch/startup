        title: Exhibits
        blocks:
          - type: callout
            title: Cycle-Life Gate Constrains the SAM
            body: >
              Lyten's serviceable addressable market is effectively gated by cycle life. Until the company independently
              validates 500+ cycles at commercial cell scale, the automotive EV and BESS segments remain inaccessible,
              confining Lyten to premium UAV and space niches. If cycle-life targets are missed, the SAM compresses by
