      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              The bull case for Lyten requires three simultaneous developments: conversion of the EXIM LOI to a formal
              preliminary commitment by year-end 2026, restart of Lyten Sweden (Northvolt Ett) at commercial-scale Li-S
              cell production by mid-2027, and execution of at least one binding automotive OEM supply contract. Under
              this scenario, Lyten would be the first Li-S battery company to achieve gigawatt-hour production with a
              credible OEM customer, justifying a re-rating comparable to QuantumScape's early IPO valuation of $3–6B.
              BNEF's 2026 Energy Transition Investment Trends report provides supportive macro context: global clean
              energy investment reached $2.3T in 2025, climate-tech equity investment grew 53% year-over-year, and
              global energy storage deployments are forecast to reach 158 GWh in 2026—a 41% increase from 2025. Energy
              storage investment alone totaled $71B in 2025, creating a favorable capital environment for battery
              scale-up narratives.

              The base case assumes the EXIM LOI remains non-binding through most of 2026, Lyten Sweden achieves limited
              production milestones, and the company raises a Series D at modest premium to Series C marks. In this
              scenario, the $1.0–1.6B valuation range persists with dilution from new equity. No step-change in
              commercial revenue materializes before 2027. The bear case is anchored to the Northvolt precedent: if EXIM
              conditions remain unmet, if Lyten Sweden's conversion from NMC to Li-S chemistry fails technical
              validation, or if Stellantis reduces its commitment following its parallel Zeta Energy JDA, the company
              could face a down-round or Series D at substantial discount. FutureMarketInsights forecasts the Li-S
              battery market at only $24.8M in 2025 and $82.5M by 2030—a small absolute market size that limits revenue
              confidence in the near term. Under the bear scenario, implied valuation compresses to $0.3–0.8B,
              consistent with a near-term capital distress event.
