      - number: '2.2'
        title: TAM, SAM, and SOM Sizing Lenses
        blocks:
          - type: paragraph
            body: >
              Market sizing for the Li-S battery opportunity is highly sensitive to scope definition, and published
              estimates differ by two orders of magnitude. The Business Research Company (TBRC) estimates the actual
              Li-S battery market at $0.85 B in 2025, growing to $2.52 B by 2030 at a 24.1% CAGR—a bottom-up revenue
              lens that counts only cells in production or under contract. Strategic Market Research puts the 2024
              market at $0.7 B and forecasts $6.5 B by 2030 at 45.3% CAGR, implying steeper acceleration. Mordor
              Intelligence reports the market at $271 B in 2025, projected to reach $582 B by 2030 at 16.5% CAGR—an
              estimate that appears to include the full downstream value chain and broad TAM assumptions rather than
              current cell revenues, and conflicts irreconcilably with the narrower revenue-based figures.

              A more tractable sizing approach uses Lyten's four end-use segments. The global drone battery market was
              $7.31 B in 2025, forecast to reach $8.84 B in 2026 at 20.8% CAGR; the UAV subsegment (defense-weighted)
              was $1.77 B in 2024. The global space battery market is $4.68 B in 2026, growing to $7.76 B by 2033. The
              global BESS stationary market added 315 GWh in 2025 (51% growth) and is forecast to add over 450 GWh in
              2026, representing a market value of $55–65 B. The automotive EV battery market exceeds $150 B across all
              Li-ion chemistry in 2025. Lyten's serviceable addressable market is limited to the high-performance,
              weight-sensitive niches of these four segments where Li-S energy density commands a premium before
              mainstream EV adoption. Lyten's serviceable obtainable market (SOM) in 2026 is pre-commercial and largely
              confined to paid customer samples, proof-of-concept programs, and early-adopter defense contracts.
