      - number: '2.4'
        title: Market Growth Drivers
        blocks:
          - type: paragraph
            body: >
              Five structural forces are expanding the addressable battery market for Lyten.

              Electrification of transport: global EV sales exceeded 25% of new vehicles in 2025 and are projected to
              reach 40% by 2030 (IEA Stated Policies Scenario). This expands the overall battery demand to over 3 TWh by
              2030, giving Lyten a growing demand pool into which its higher-energy-density cells could be designed.

              BESS capacity build-out: battery storage demand rose 51% in 2025 to 315 GWh, with 2026 forecast exceeding
              450 GWh. The IEA Net Zero Emissions scenario requires a sixfold increase in global storage to 1,500 GW by
              2030. Even a marginal share of premium-performance BESS applications could be material for Lyten's
              Voltpack line.

              Defense drone modernization: global UAV battery demand grew alongside $2.6 B in DoD drone technology
              investments in 2024. LiS batteries' weight advantage is highly relevant for MALE/HALE platforms where
              endurance is mission-critical.

              Supply-chain de-risking: China controls 70–90% of global Li-ion supply chains. US FEOC regulations
              starting in 2026 force buyers to source from non-FEOC suppliers or face IRA credit ineligibility. Lyten's
              domestic production of battery-grade lithium metal and its acquisition of European manufacturing assets
              position it as a FEOC-compliant alternative to Chinese LFP—a structural tailwind for procurement.

              AI and data-center load growth: battery storage adjacent to data centers grew 30% in 2025 to 45 GW in
              UPS-class installations, supplementing grid-scale BESS. While LFP dominates this segment today, demand
              pressure for energy-dense, non-flammable alternatives is growing.
