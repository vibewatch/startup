      - number: '8.5'
        title: Thesis-Break Triggers and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Lyten's investment thesis is critically dependent on a small number of binary near-term decisions, each of
              which could materially alter the risk-return profile. The EXIM LOI conversion is the most time-sensitive:
              if EXIM does not publish a formal preliminary commitment for Lyten by end of 2026, the primary mechanism
              for debt-financed scale-up is effectively closed, and Lyten would need to raise additional equity at
              potentially unfavorable terms. The EXIM Make More in America approved-transactions page and the
              letter-of-interest resource page both confirm the LOI process is active as of May 2026 but do not list a
              formal preliminary commitment for Lyten—consistent with an LOI that has not yet advanced to the committed
              credit stage. The LOI is conditional on domestic content requirements for exports, environmental review,
              and Lyten demonstrating binding export contracts from foreign customers, none of which have been publicly
              confirmed.

              Down-round risk is elevated given the likely double-digit monthly burn at multi-facility operations
              following the Northvolt Sweden and Poland acquisitions. A Series D priced at or below Series C implied
              per-share would signal deteriorating investor confidence and could activate anti-dilution provisions in
              prior rounds. Manufacturing delay at Lyten Sweden beyond H2 2027 would erode the acquisition rationale for
              the Northvolt Ett plant. Peer company distress—a QS delisting or SES AI bankruptcy—would compress
              public-market comparables and reduce pre-IPO appetite for the entire battery startup asset class.
              Stellantis terminating its JDA would convert the investor stake from strategic endorsement to purely
              financial, removing Lyten's most credible OEM validation. Each of these events individually would justify
              escalating the risk rating or downgrading the recommendation.
