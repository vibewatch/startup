      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Northvolt Precedent: $15B+ Raised, Chapter 11 Filed'
            body: >
              Northvolt represents the most important adverse comparable for any large-scale battery startup investment.
              The Swedish company raised over $15B in equity and debt from world-class investors including Goldman Sachs
              Asset Management, BlackRock, Volkswagen, and the European Investment Bank. Despite this capital base and
              significant NMC production capacity, Northvolt filed Chapter 11 bankruptcy protection in November 2024.
              Equity investors absorbed near-total losses. The collapse was attributed to manufacturing execution
              failures, a customer concentration in automotive OEM contracts that could not be renegotiated under cost
              pressure, and capital requirements that escalated far beyond initial models. Lyten's acquisition of
              Northvolt Sweden and Poland assets at distressed prices removes the most obvious asset impairment risk—but
              it does not insulate against the same underlying dynamics: unproven manufacturing at scale,
              capital-intensive chemistry conversion, and OEM customers who can delay or terminate contracts. Any Lyten
              valuation analysis that does not account for the Northvolt precedent is incomplete.
            calloutType: risk
            claimRefs:
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 'EXIM LOI as a Binary Option: Conversion is the Single Largest Value Catalyst'
            body: >
              The Export-Import Bank's $650M Letter of Interest is best understood as a binary option on Lyten's capital
              structure. If converted to a formal preliminary commitment and ultimately to committed credit, it would
              add $650M in debt capacity at government-backed rates, essentially doubling Lyten's effective capital base
              from $625M equity to approximately $1.275B. This would be transformative for the scale-up plan, enabling
              Lyten Sweden restart and Pennsylvania lithium metal foil expansion without a dilutive equity round.
              However, LOIs are non-binding by design; the EXIM Make More in America list confirms the LOI is active but
              does not reflect a preliminary commitment. EXIM conversion requires domestic content certification, an
              environmental review, and—critically—binding foreign buyer contracts from Lyten's export customers. None
              of these conditions have been publicly confirmed. Monitoring the EXIM approved-transactions page for a
              Lyten preliminary commitment listing is the single highest-signal monitoring action for investors tracking
              this thesis.
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV010
