      - number: '1.4'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >
              Lyten has raised $625M in total equity financing as reported on its homepage as of May 2026. The most
              recent publicly documented financing event was the completion of the Series B funding round's third
              tranche in July 2024, which brought the total raised at that time to more than $410M and introduced
              Luxembourg Future Fund 2—a fund managed by the European Investment Fund—as a new institutional investor.

              The principal Series B financing was announced in September 2023 at $200M. The round was led by Prime
              Movers Lab, the venture capital firm founded by Dakin Sloss, which also holds a board observer or director
              seat. Strategic co-investors in the Series B included Stellantis Ventures (the corporate venture arm of
              Stellantis, funded with an initial €300M earmarked for automotive innovation startups), FedEx
              (supply-chain logistics), Honeywell (industrial and smart-building technology), and Walbridge, a large
              commercial construction contractor. Stellantis had initially invested in Lyten in May 2023 ahead of the
              broader Series B close.

              The funding is intended to scale the San Jose pilot production line, develop gigascale manufacturing
              capacity, and support commercialisation of three primary product lines: Li-S batteries, composites, and
              IoT sensors. Earlier rounds prior to the Series B are not fully detailed in public disclosures; the
              company has raised over $410M as of late 2023 and now reports $625M total. The gap between these figures
              likely reflects additional tranches in 2024–2026, including the Luxembourg Fund tranche and proceeds
              related to the Northvolt acquisitions, but the precise round structure is not publicly itemised.
