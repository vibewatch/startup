  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 3D Graphene Platform and Cell Architecture
        blocks:
          - type: paragraph
            body: >
              Lyten's foundational technology is Lyten 3D Graphene™, a carbon nanomaterial produced by a patented
              microwave plasma reactor process that cracks methane (CH₄) into solid carbon and hydrogen gas. Unlike
              conventional two-dimensional graphene, the 3D structure has a mechanically flexible, electrically
              conductive framework and a hierarchical nano/micro/mesoporosity that can be engineered at the molecular
              level by adjusting reactor parameters — porosity, surface area, conductivity, and surface energy — to
              target specific applications. The hydrogen co-product is captured for use as a clean fuel, making the
              synthesis process net carbon-negative. Lyten's 55,000-square-foot San Jose fabrication facility is
              dedicated to 3D Graphene production.

              In lithium-sulfur cells, 3D Graphene acts as the sulfur cathode host. The hierarchical porous structure
              physically confines sulfur and intermediate lithium polysulfide species (Li₂S₄, Li₂S₆) within the cathode
              through what the company calls "nano-capture," suppressing dissolution and migration that causes the
              polysulfide shuttle effect — the primary historical failure mode for Li-S chemistry. Sulfur utilization
              with Lyten 3D Graphene improves by approximately 15% over the best commercial nanocarbons, and
              self-discharge decreases by approximately 30% versus commercial analogues, according to Lyten's Power
              Sources Conference technical paper (June 2023).

              Cell development addresses multiple interdependent components simultaneously: (i) 3D graphene
              sulfur-composite cathodes with high areal capacity (mAh/cm²) and high sulfur loading; (ii) protected
              lithium-metal anodes incorporating bulk and interfacial modifications to suppress dendrite growth and
              polysulfide-induced passivation; (iii) proprietary electrolyte formulations with low electrolyte-to-sulfur
              (E/S) ratio enabling high specific energy; (iv) multifunctional separators; and (v) high-energy cell
              designs in both multi-layer pouch and 18650/2170/26650 cylindrical formats. Published performance as of
              mid-2023 is 250–275 Wh/kg specific energy, ~300 cycles at 100% DoD at C/3 rate in coin cells, and ~150
              cycles at 100% DoD in commercial multi-layer pouch and 18650 cylindrical cells. At 50% DoD, cycle life
              exceeds 1,000 cycles, and satellite applications targeting partial DoD use reportedly achieve over 3,000
              cycles.

              A key adverse observation is the persistent gap between coin-cell performance and commercial- format
              performance. At full depth of discharge, pouch and cylindrical cells deliver half the cycle life of coin
              cells, reflecting the more demanding electrolyte-starved conditions required for practical energy density.
              Bridging this gap is the primary near-term technical objective; Lyten's 2025 patent WO2025085743A1 covers
              advances in thick cathode design and hybrid electrolyte systems targeting this transition.

              The cathode manufacturing process avoids N-Methyl-2-pyrrolidone (NMP), a hazardous solvent used in
              conventional Li-ion cathode slurry processing, instead using an aqueous binder with spray-dried active
              materials — reducing occupational health risk and simplifying environmental compliance.
