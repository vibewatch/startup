      - number: '1.5'
        title: Milestones, Scale, and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Lyten opened its first automated pilot production facility in San Jose in May 2023, capable of producing
              up to 200,000 cells per year using standard lithium-ion equipment, demonstrating the drop-in
              manufacturability of its lithium-sulfur chemistry. The first customer A-samples—6.5 Ah pouch cells—were
              shipped to Stellantis and other US and European OEMs in May 2024. A major US consumer electronics company
              and the US Department of Defense also received early shipment commitments in that window.

              In September 2024, the Defense Innovation Unit (DIU) selected Lyten for a funded programme to demonstrate
              rechargeable Li-S battery cells aboard the International Space Station (ISS), with integration partner
              Spacebilt/Skycorp and a goal of achieving flight certification for space-suit and satellite applications.
              In October 2024, Lyten announced plans to invest over $1 billion in the world's first Li-S gigafactory
              near Reno, Nevada, targeting 10 GWh annual capacity at full scale with a Phase 1 online date of 2027.

              However, in early 2026 the Reno gigafactory plan was abandoned after Lyten was unable to negotiate a lease
              with the Reno-Tahoe Airport Authority. The Airport Authority stated that Lyten's US presence was shrinking
              "significantly" due to its pivot to European green-energy assets; Lyten's CMO publicly denied federal
              energy policy was a factor, attributing the decision to the cost efficiency of acquired European
              manufacturing. A CleanTechnica analysis published in August 2025 had already flagged that Li-S commercial
              EV deployment timing remained uncertain and that Stellantis had also invested in rival Li-S startup Zeta
              Energy, introducing competitive risk.

              In October 2025, Lyten completed the acquisition of Northvolt's BESS manufacturing facility in Gdańsk,
              Poland. In February 2026, Lyten completed the acquisition of Northvolt Ett and Northvolt Labs in Sweden,
              acquiring 16 GWh of battery manufacturing capacity, 160+ hectares of land, and—in Västerås—the largest
              battery R&D centre in Europe, collectively valued at approximately $5B in assets. A co-located data-centre
              deal with EdgeConneX (up to 1 GW capacity) was announced simultaneously. In March 2026, Lyten announced
              plans to establish an Industrial Hub in Gdańsk, Poland, centred on the BESS facility and evaluating
              expanded manufacturing and co-location of AI data infrastructure. As of April 2025, Lyten had also
              produced the first US battery-grade lithium-metal foil using domestically sourced materials, strengthening
              its tariff-free, fully US-sourced supply chain claim.
