      - number: '7.7'
        title: Customer Concentration and Commercial Risk
        blocks:
          - type: paragraph
            body: >
              Lyten's active Li-S revenue is entirely concentrated in the defence, UAV, and space channel as of May
              2026. The drone propulsion initiative (California, launched May 2025) is the only channel accepting
              commercial orders for Li-S cells; the AEVEX Aerospace partnership and Titan Dynamics demonstration are the
              only named deployments. The DIU ISS contract is a single government-funded demonstration with no disclosed
              production follow-on. This concentration creates a thesis-break risk: if AEVEX fails to qualify or
              complete deliveries, or if DoD procurement priorities shift, Lyten's only near-term commercial Li-S
              revenue source disappears. The automotive channel — which represents the majority of the total addressable
              market — requires B-sample delivery, production-scale cycle-life validation at automotive DoD, formal OEM
              qualification (typically 3–5 years post-A-sample), and gigascale manufacturing capacity, none of which
              exists as of May 2026. Stellantis's December 2024 JDA with Zeta Energy creates a credible alternative that
              could reduce the probability of a Lyten–Stellantis production supply agreement. One unnamed European
              carmaker, per Reuters (August 2025), explicitly exited its Lyten evaluation "because the US company was
              only producing at research and development scale" — a direct indication of customer churn at the
              evaluation stage. The BESS channel provides the most stable near-term revenue via inherited Northvolt EU
              customers, but this revenue is from NMC chemistry (not Li-S) and is subject to competitive pressure from
              Chinese LFP BESS suppliers who have manufacturing cost advantages that Li-S cannot yet overcome on unit
              economics. Industry analysts at IDTechEx note that Li-S battery commercialisation remains narrowly focused
              on specialty high-energy applications through the late 2020s; mainstream automotive and grid adoption is a
              post-2030 probability for the sector overall, not just Lyten. Customer concentration in defence also
              introduces dependency on US government spending priorities, continuing-resolution budget dynamics, and
              NDAA compliance certification requirements that add procurement friction.
