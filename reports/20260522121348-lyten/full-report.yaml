          - type: callout
            title: FEOC Regulations Create a Supply-Chain Moat Opportunity
            body: >
              The combination of US FEOC regulations (effective 2026), high tariffs on Chinese battery imports (+56–69%
              BESS costs since January 2025), and China's 70–90% share of Li-ion supply chains creates a structural
              opportunity for Lyten's domestic production platform. If Lyten can demonstrate FEOC-compliant production
              at its US and European sites at competitive cost, it gains a regulatory moat that LFP manufacturers based
              in China cannot easily replicate—making government and utility buyers willing to pay a premium even before
              Li-S achieves full cost parity with LFP.
