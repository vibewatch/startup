company:
  name: Lyten

chapter:
  number: 3
  title: Competitors
  summary: >
    Lyten competes across five overlapping battlegrounds: direct lithium-sulfur (Li-S) peers
    (Zeta Energy, Sion Power, Theion, PolyPlus), adjacent next-generation chemistries
    (QuantumScape, Factorial Energy, SES AI), incumbent Li-ion giants (CATL, BYD, LG Energy
    Solution, Samsung SDI), the status-quo of NMC/LFP cells in every target market, and
    likely new entrants from Chinese automakers. No competitor has yet commercialized Li-S at
    scale; Lyten holds an early-mover advantage in defense/UAV applications. However, Zeta
    Energy's Stellantis partnership directly threatens Lyten's OEM positioning, Sion Power's
    2026 defense pivot competes in Lyten's core military segment, and incumbent suppliers'
    entrenched supply chains and falling LFP costs raise the bar for displacement.

sections:
  - id: competitor-landscape
    title: Competitive Landscape Overview
    body: >
      Lyten's buyers—defense integrators, aerospace primes, UAV OEMs, automakers, and
      stationary-storage developers—can solve the "higher energy per kilogram" job through
      several routes: adopt a competing Li-S cell, switch to a solid-state lithium-metal
      cell, deploy an advanced LFP or NMC pouch from an incumbent, wait for status-quo
      technology to improve, or fund an internal R&D program. Each route imposes different
      switching costs, qualification timelines, and risk profiles, so Lyten competes
      simultaneously against pre-commercial peers, large established suppliers, and the
      inertia of proven incumbents.

      Direct Li-S peers—Zeta Energy, Sion Power, Theion, and PolyPlus—all target the same
      high-energy-density niches and share Lyten's core thesis that sulfur replaces
      costly critical minerals. None has reached gigawatt-hour production, but Zeta's
      2024 Stellantis joint development agreement and Sion Power's 2026 pivot to defense
      significantly heighten near-term competitive pressure on Lyten's two core markets.

      Adjacent next-generation competitors (QuantumScape, Factorial, SES AI) address the
      same buyer pain points—energy density, weight, range—through solid-state or
      lithium-metal chemistries rather than Li-S. Their OEM partnerships are, in several
      cases, more advanced than Lyten's: Factorial has Stellantis demonstration-fleet
      validation by 2026 and four major OEM JDAs, while QuantumScape licenses to
      Volkswagen's PowerCo. These companies compete for the same vehicle-integration
      budget and the same program slots at global automakers.

      Incumbent Li-ion suppliers—led by CATL (45.2% global EV battery share in January
      2026) and BYD (13.8%)—represent the deepest competitive moat through scale, proven
      reliability, and rapidly falling LFP costs. The Korean trio (LG Energy Solution,
      Samsung SDI, SK On) are deploying domestic LFP capacity in the US market that
      competes in Lyten's stationary-storage segments. Status-quo NMC/LFP remains the
      default choice and resets the hurdle Lyten must clear on cost, cycle life, and
      supply-chain integration with every design win.
