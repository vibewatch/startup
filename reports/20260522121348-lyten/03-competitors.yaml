  - id: direct-lis-peers
    title: Direct Lithium-Sulfur Peers
    body: >
      Zeta Energy (Houston, TX) is Lyten's closest direct peer and most credible near-term
      threat in the automotive OEM segment. Founded in 2014, Zeta uses a sulfurized-carbon
      cathode and lithiated vertically-aligned carbon-nanotube anode, claiming 450 Wh/kg
      energy density, up to 2,000 full charge/discharge cycles, and a 10C charge rate.
      In December 2024, Stellantis signed a joint development agreement with Zeta targeting
      Li-S EV batteries for vehicles by 2030—the same automaker that invested in Lyten in
      2023. A $4 million DOE grant (early 2024) further validates Zeta's technology. Zeta's
      CSO explicitly identified Lyten as the biggest US Li-S competitor and noted that Zeta
      can use the same gigafactory assembly equipment as Li-ion, a direct comparison with
      Lyten's equivalent claim. Zeta has not yet disclosed a pouch-cell pilot facility nor
      publicly confirmed volume orders, but its dual OEM access (Stellantis, undisclosed
      others) materially compresses Lyten's automotive moat.

      Sion Power (Tucson, AZ) evolved from Brookhaven National Laboratory Li-S origins
      into a lithium-metal (Licerion®) platform exceeding 500 Wh/kg. In March 2026, Sion
      Power announced a strategic expansion into US defense and aerospace—drones, loitering
      munitions, autonomous maritime/ground vehicles—directly competing with Lyten's
      strongest current market. With 430+ patents, 30+ years of R&D, and a 110,000-sq-ft
      domestic facility, Sion Power is well-resourced. Its CNBC-cited pivot "amid weak
      electric vehicle market" signals tactical retreat from EVs and redeployment into
      Lyten's core segments. Initial product shipments are expected in late 2026.

      Theion (Berlin, Germany) closed a €15 million (~$16 M) Series A in March 2025, led
      by Team Global, Geschwister Oetker Beteiligungen, and Enpal. Theion's
      crystalline monoclinic gamma-sulfur cathode targets >1,000 cycle life, with claims
      of 3× energy density and 1/3 the cost of conventional Li-ion. The company has car,
      stationary-storage, and electric-aerospace customers "under observation" pending
      first pouch cells. Theion competes primarily in Europe but expands Lyten's global
      peer set and signals that non-US entrants are accelerating.

      PolyPlus (Berkeley, CA), founded in 1991, develops glass-protected lithium-metal and
      Li-S batteries (400–600 Wh/kg) for military, drone, and underwater applications.
      A $10 million Series A in 2023 funded expansion of pilot manufacturing. PolyPlus
      competes with Lyten specifically in defense and aerospace niches but has not
      disclosed an automotive or stationary-storage JDA and is at an earlier
      commercialization stage than Zeta or Sion Power.
