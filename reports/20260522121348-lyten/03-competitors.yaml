  - id: adjacent-next-gen
    title: Adjacent Next-Generation Chemistry Competitors
    body: >
      QuantumScape (San Jose, CA; NYSE: QS) pursues a technology-licensing model for
      solid-state lithium-metal batteries, positioning itself as the battery equivalent of a
      semiconductor IP licensor. Its Eagle Line pilot facility, inaugurated in February 2026,
      produces QSE-5 cells at 844 Wh/L volumetric energy density with 10–80% charging
      in under 15 minutes and ~95% capacity retention after 1,000 cycles. Volkswagen's
      PowerCo holds rights to up to 85 GWh of QSE-5-based production annually; Corning
      and Murata are ceramic-separator manufacturing partners. QuantumScape is also
      targeting drones, defense aerospace, and AI data centers—directly overlapping with
      Lyten's defense, UAV, and industrial segments. Cell costs remain $400–$800/kWh, well
      above incumbent Li-ion, but the licensing model could accelerate scale-up by avoiding
      direct capex burden on QuantumScape itself.

      Factorial Energy (Woburn, MA) combines FEST® and Solstice solid-state electrolyte
      platforms with up to 450 Wh/kg (Solstice) and real-world validated cells (77 Ah
      cells clearing Stellantis lab tests; Mercedes EQS prototype driving 745+ miles on
      a single charge). Stellantis is incorporating Factorial's cells into a demonstration
      Dodge Charger Daytona fleet by 2026. Factorial holds JDAs with Mercedes-Benz,
      Stellantis, Hyundai Motor, and Kia—four OEM agreements compared to Lyten's Stellantis
      investment relationship. A proposed Nasdaq merger (ticker: FAC) valuing Factorial at
      ~$1.1 billion with $100 million in fresh capital was expected to close mid-2026,
      significantly increasing its financial firepower. Factorial targets EV market entry
      as early as 2027 in premium/luxury vehicles.

      SES AI (Boston, MA; NYSE: SES) combines lithium-metal B-sample cells (417 Wh/kg
      demonstrated) with an AI-for-Science material-discovery platform (AlphaPhase).
      In January 2025, SES AI secured contracts totaling up to $10 million from two major
      undisclosed OEM partners to develop AI-discovered electrolytes for both Li-metal
      B-samples and mature Li-ion batteries. Historical JDA partners include GM, Hyundai-Kia,
      and Honda. SES targets mass production in the early-to-mid 2030s, giving Lyten
      a window before automotive SES competition intensifies, but SES's drone and
      robotics-focused material discovery also overlaps Lyten's near-term defense pipeline.
