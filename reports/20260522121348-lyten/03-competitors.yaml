  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cycle life at commercial loading
      missingEvidence: >
        Independent third-party cycle-life data for Lyten cells at commercial sulfur loading
        (>6 mg/cm²) and full pouch-cell format; Lyten has not published peer-reviewed
        cycle-life data at these conditions.
      whyItMatters: >
        Cycle life is the primary gate for automotive and BESS qualification. Without
        independent data Lyten's claimed performance advantage over Zeta's 2,000-cycle
        claim cannot be assessed, and Zeta may be ahead on this critical metric.
      diligencePath: >
        Request independent laboratory cycle-life data from Lyten covering: cell format,
        sulfur loading, C-rate, temperature range, capacity retention at 500, 1,000, and
        2,000 cycles; compare against Zeta's DOE grant test protocol data.
      relatedQuestionRefs:
        - QP006
        - QP014
        - QP015

    - type: private-evidence-only
      severity: material
      topic: Lyten IP exclusivity and FTO analysis
      missingEvidence: >
        Freedom-to-operate analysis comparing Lyten's 3D graphene patent portfolio against
        Zeta's 60+ patents and Sion Power's 430+ patents; no public FTO study or
        comparative IP landscape report found.
      whyItMatters: >
        If Lyten's key 3D graphene manufacturing patents can be designed around (as Zeta's
        alternative architecture suggests is feasible), the IP moat may not provide durable
        commercial protection, especially in jurisdictions outside the US.
      diligencePath: >
        Commission or request FTO analysis covering at least Zeta Energy's 60+ patents,
        Sion Power's 430+ patents, and academic Li-S publications (e.g., Nature
        Communications benchmarking study) to map freedom of operation.
      relatedQuestionRefs:
        - QP013

    - type: private-evidence-only
      severity: material
      topic: Lyten manufacturing capacity post-Northvolt acquisition
      missingEvidence: >
        Publicly disclosed production capacity (GWh/yr) at the Northvolt Sweden facility
        post-acquisition, capital expenditure plan to scale from pilot to commercial, and
        timeline to first commercial-volume shipments.
      whyItMatters: >
        Without a credible manufacturing scale-up path, Lyten cannot fulfill large defense
        contracts or OEM supply agreements even if it wins program qualification. The
        Reno gigafactory cancellation leaves a gap that the Sweden hub must fill.
