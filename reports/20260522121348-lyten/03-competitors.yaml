  - id: incumbent-li-ion
    title: Incumbent Li-Ion Suppliers and Status Quo
    body: >
      The deepest competitive moat Lyten faces is the entrenched NMC/LFP supply chain.
      CATL held 45.2% of global EV battery installations in January 2026 (32.5 GWh) and
      crossed 50.1% of China's domestic production share in Q1 2026 for the first time
      in five years—dominating NMC at 81.6% share and advancing in LFP at 41%. BYD held
      13.8% globally in January 2026 (9.9 GWh), virtually all in LFP. Together, CATL
      and BYD accounted for ~59% of global EV battery installations that month.

      South Korean producers—LG Energy Solution (6.6% global share in Jan 2026), SK On
      (3.2%), and Samsung SDI (2.2%)—are pursuing LFP alongside their NMC strengths to
      challenge Chinese dominance in US and EU markets. LG's Michigan LFP facility began
      mass production in June 2025 with US capacity targeted at 50 GWh by end-2026.
      Samsung SDI is retrofitting its Indiana StarPlus Energy joint-venture line for
      prismatic LFP ESS production, targeting 30 GWh capacity by Q4 2026.

      For the segments Lyten targets, incumbent suppliers represent the status-quo
      alternative buyers know well. NMC cells reach 265 Wh/kg in premium EV packs, and
      modern LFP at 160–200 Wh/kg delivers cycle lives of 2,000–5,000 cycles at proven
      quality. The falling cost trajectory of LFP—with Chinese producers still pricing
      at ~$60–80/kWh at cell level and Korean producers targeting within 10% of Chinese
      pricing—makes the switching-cost calculus increasingly unfavorable for any buyer
      not specifically locked out of Chinese supply chains by FEOC/NDAA regulations.

      Status quo is thus not static: incumbent suppliers are adding capacity, reducing
      costs, and exploring LFP+ (manganese-enhanced) and solid-state development tracks
      in parallel. Any delay in Lyten's cycle-life and scale milestones extends the
      window during which incumbents can close the energy-density gap.
