callouts:
  - calloutType: risk
    title: Stellantis Multi-Homers Across Li-S and Solid-State
    body: >
      Stellantis holds an equity investment in Lyten (2023) and a joint development
      agreement with Zeta Energy (December 2024) and a demonstration-fleet agreement
      with Factorial Energy (October 2024). This three-way portfolio approach confirms
      that Lyten's most prominent OEM relationship does not provide exclusivity and
      that Stellantis is explicitly hedging across Li-S and solid-state chemistries.
      Lyten's path to a commercial supply agreement depends on outperforming two direct
      rivals with the same customer before 2030.
    claimRefs:
      - CP004
      - CP021
      - CP022
  - calloutType: risk
    title: Sion Power's Defense Pivot Directly Threatens Lyten's Core Market
    body: >
      Sion Power's March 2026 announcement targets long-endurance UAS, high-performance
      tactical drones, loitering munitions, autonomous maritime/ground vehicles, and space
      systems—nearly identical to Lyten's disclosed defense pipeline. With 430+ patents,
      30 years of Li-metal R&D, and initial shipments expected H2 2026, Sion Power is the
      nearest-term qualified competitor in Lyten's strongest segment and may reach
      defense program qualification before Lyten scales.
    claimRefs:
      - CP007
      - CP008
      - CP009
  - calloutType: insight
    title: Li-S Category Faces Shared Cycle-Life and Manufacturability Gap vs Incumbents
    body: >
      LG Energy Solution's own analysts and independent academic benchmarking (Nature,
      2025) agree that practical Li-S cells currently achieve 400–600 cycles under
      moderate conditions, below the 1,000+ cycle commercial standard. Theion's CEO
      acknowledged "there is still a way to go" for pouch cells. Lyten's advantage
      is not that it has solved these problems ahead of peers, but that its 3D graphene
      architecture may address the polysulfide shuttle more effectively. Investors should
      treat cycle-life and manufacturability milestones as industry-wide gates, not
      Lyten-specific risks alone.
    claimRefs:
      - CP034
      - CP035
      - CP036
      - CP040

