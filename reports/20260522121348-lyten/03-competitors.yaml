  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Evidence Gap / Diligence Ask
    rows:
      - - 3D graphene cathode host as unique IP
        - Zeta's CNT-anode + sulfurized-carbon approach achieves comparable performance without 3D graphene; Theion's crystalline sulfur offers yet another pathway
        - High
        - How many Lyten patents are currently enforceable vs Zeta's 60+ patents? Has Lyten commissioned FTO (freedom-to-operate) analysis?
      - - First-mover defense qualification advantage
        - Sion Power announced defense-specific expansion in March 2026; expected initial shipments H2 2026 in same drone/UAS segments
        - High
        - Has Lyten secured any exclusive or preferred-supplier agreements with US defense programs that would block Sion Power qualification?
      - - Stellantis as anchor EV OEM partner
        - Stellantis signed a separate JDA with Zeta Energy in December 2024 while the Lyten investment relationship remains equity-stage only
        - High
        - Does Stellantis hold any exclusivity with Lyten, or is this a portfolio-hedge multi-chemistry strategy? What program slot is at risk?
      - - US supply chain / NDAA compliance as differentiator
        - Zeta Energy and Sion Power make equivalent NDAA-alignment claims; this is category-level table stakes, not a Lyten-specific advantage within next-gen Li-S
        - Medium
        - Can Lyten document specific NDAA section 4891 qualification or DoD contract language that names Lyten's supply chain as compliant?
      - - Cycle-life leadership over Li-S peers
        - Zeta claims 2,000 cycles (vs Lyten's ~500–1,000 in development); Li-ion incumbents offer 2,000–5,000 cycles at commercial scale
        - High
        - Third-party independent cycle-life data for Lyten at commercial sulfur loading and cell format; no public disclosure found
      - - Manufacturing scale-up execution
        - Lyten's Reno gigafactory plans collapsed in 2025; Sweden Northvolt acquisition provides pilot capacity but no gigawatt-hour path disclosed
        - Critical
        - What is the current manufacturing capacity in Sweden (GWh/yr)? What is the path to 1+ GWh and the capital requirement?
    notes: >
      Severity ratings are qualitative assessments based on published evidence as of May 2026.
      "Critical" = potential company-defining risk; "High" = likely affects commercial timeline
      or valuation; "Medium" = important but manageable with execution. All diligence asks require
      non-public data.
