      diligencePath: >
        Commission a bottoms-up market sizing study using Lyten's disclosed pilot customer
        list, unit price targets, and production roadmap; cross-reference with customers'
        disclosed procurement budgets.
      relatedQuestionRefs: [QM004, QM025]

    - type: missing-source
