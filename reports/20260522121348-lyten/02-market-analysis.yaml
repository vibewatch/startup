  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cycle-life
      missingEvidence: >
        Independent third-party validation of Lyten's cycle-life data at commercial cell
        scale (production-line cells, not laboratory cells), including capacity retention
        curves at C/3 rate over 500 cycles.
      whyItMatters: >
        Without independent cycle-life validation, the size of Lyten's SAM cannot be
        determined; if cycle life falls below 500 cycles, the automotive and BESS segments
        are inaccessible and the market is limited to defense UAV and space niches.
      diligencePath: >
        Request Electrochemical Society or third-party test lab reports for production-line
        cells; review any PPAP-stage data shared with automotive customers.
      relatedQuestionRefs: [QM009, QM026]

    - type: missing-source
      severity: material
      topic: defense-procurement
      missingEvidence: >
        Public contract award notices or SBIR/STTR records showing specific DoD programs
        (program name, award value, contract number) that have awarded Lyten battery
        supply contracts.
      whyItMatters: >
        The $2.6 B DoD drone investment figure cited in market research does not
        break out the battery-specific portion, making the defense SAM difficult to
        bound precisely.
      diligencePath: >
        Search SAM.gov, USASpending.gov, and DoD budget justification books for Lyten
        contract awards; review SBIR/STTR Phase II/III awards.
      relatedQuestionRefs: [QM013]

    - type: conflicting-data
      severity: material
      topic: lithium-sulfur-market-size
      missingEvidence: >
        A bottoms-up, revenue-basis SAM model for Li-S batteries segmented by Lyten's
        specific end-use verticals (tactical UAV, space-qualified cells, automotive
