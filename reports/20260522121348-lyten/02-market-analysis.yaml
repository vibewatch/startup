callouts:
  - calloutType: risk
    title: Cycle-Life Gate Constrains the SAM
    body: >
      Lyten's serviceable addressable market is effectively gated by cycle life. Until the
      company independently validates 500+ cycles at commercial cell scale, the automotive
      EV and BESS segments remain inaccessible, confining Lyten to premium UAV and space
      niches. If cycle-life targets are missed, the SAM compresses by an order of
      magnitude relative to the headline TAM, and the investment thesis depends entirely
      on defense and space program adoption—which carry their own long qualification
      timelines and certification risks.
    claimRefs: [CM025, CM026, CM027, CM035]

  - calloutType: insight
    title: FEOC Regulations Create a Supply-Chain Moat Opportunity
    body: >
      The combination of US FEOC regulations (effective 2026), high tariffs on Chinese
      battery imports (+56–69% BESS costs since January 2025), and China's 70–90% share
      of Li-ion supply chains creates a structural opportunity for Lyten's domestic
      production platform. If Lyten can demonstrate FEOC-compliant production at its US
      and European sites at competitive cost, it gains a regulatory moat that LFP
      manufacturers based in China cannot easily replicate—making government and utility
      buyers willing to pay a premium even before Li-S achieves full cost parity with LFP.
    claimRefs: [CM031, CM032, CM033]

