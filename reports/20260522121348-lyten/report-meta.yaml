companyProfile:
  summary: >-
    Lyten was founded in 2015 in San Jose, California by Dan Cook (CEO) and co-founders
    who developed the company's proprietary Three-Dimensional Graphene synthesis process.
    The technology converts greenhouse gases (methane) into solid carbon and hydrogen,
    producing 3D Graphene with tuneable thermal, electrical, and structural properties.
    Lyten's primary product lines are lithium-sulfur (Li-S) battery cells (branded LytCell),
    lightweight composites, IoT sensor arrays, and BESS systems (Voltpack). In September 2023,
    the company raised a $200M Series B led by Prime Movers Lab with Stellantis, FedEx,
    Honeywell, and Walbridge as co-investors; in July 2025, it closed a second $200M round,
    bringing total equity raised to $625M. In February 2026, Lyten acquired former Northvolt
    assets — the Northvolt Ett gigafactory in Skellefteå, Sweden and a BESS facility in
    Gdańsk, Poland — positioning the company for large-scale Li-S cell and BESS production.
    As of May 2026 the company employs approximately 315 people at its San Jose headquarters,
    with additional headcount from the Swedish and Polish acquisitions. Revenue from BESS and
    defense channels is expected but no audited financials have been published.
  foundedDate: "2015-01-01"
  founders:
    - name: Dan Cook
      role: Co-Founder and CEO
      background: >-
        Co-authored key IP related to the 3D graphene synthesis process; has led Lyten as
        CEO since founding; primary spokesperson in all major financing and partnership
        announcements.
  foundingLocation: San Jose, CA, USA
  headquarters: San Jose, CA, USA
  productSummary: >-
    Lyten's core product platform is built on Three-Dimensional Graphene (3DG), an engineered
    carbon structure produced by microwave-driven pyrolysis of methane. Commercial products span:
    (1) LytCell Li-S battery pouch and prismatic cells targeting EV, defense, UAV, and space
    markets—claimed 40% lighter than lithium-ion for equivalent energy storage and up to 60%
    lighter than LFP; (2) 3DG-reinforced lightweight composites for automotive and aerospace
    applications; (3) IoT sensor arrays with embedded 3DG for industrial environments;
    (4) Voltpack Mobile System (VMS) BESS products acquired with the Northvolt Poland facility,
    targeting CARICOM nations under the EXIM Bank LOI; and (5) concrete admixture and
    3D-printing filaments as emerging adjacent applications. A-sample Li-S pouch cells (6.5 Ah)
    were shipped to Stellantis and unnamed OEMs in May 2024.
  customerFocus: >-
    Primary target segments are weight-sensitive defense (US DoD, DIU), UAV/drone operators,
    space/satellite (ISS demonstration contract Sep 2024), and premium automotive OEMs
    (Stellantis Joint Development Agreement). Secondary targets are BESS customers in energy
    transition markets (CARICOM nations, EU grid storage) and industrial IoT operators.
    No disclosed commercial revenue contracts as of May 2026.
  businessModel: >-
    B2B hardware manufacturer and technology licensor: Lyten aims to sell Li-S battery cells
    and packs directly to OEMs and system integrators, and to sell BESS products to utilities
    and energy buyers. Near-term revenue bridges include BESS product sales from the Northvolt
    Poland facility and defence-channel battery deliveries. Government funding (US DoD contracts,
    EU grant programs) supplements equity financing. The company is pre-commercial-scale;
    no audited revenue has been published and the Compworth model-based estimate of ~$110M
    annualised revenue is unverified.
  stage: "Series C — pre-commercial scale, pre-audited-revenue"
  fundingStatus: >-
    Total equity raised: $625M across five rounds. Key rounds: Series B (Sep 2023): $200M
    led by Prime Movers Lab with Stellantis, FedEx, Honeywell, Walbridge; Series C (Jul 2025):
    $200M (undisclosed lead, strategic investors). Post-Series C estimated valuation: $1.3B
    (Tracxn), $1.4B (Compworth), "at least $1.5B" (AccessIPOs). Non-binding EXIM Bank Letter
    of Interest (Dec 2024): $650M conditional on audited financials and binding export
    contracts. Series D not yet announced; down-round risk elevated at current manufacturing
    burn rate.
