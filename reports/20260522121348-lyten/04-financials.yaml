  - id: unit-economics
    title: Unit Economics and Cost Structure
    body: >
      Lyten does not disclose unit-level financial data. Gross margin, cost per kWh, and contribution margin
      are private. At current pilot production volumes, margin is almost certainly negative: battery
      manufacturing is highly capital- and process-intensive, and Lyten's cells are hand-built at
      semi-automated scale in San Jose, California. The company is investing up to $20M to convert the
      119,000-square-foot San Leandro facility (acquired from Cuberg in November 2024) to LiS production
      targeting 200 MWh/year of annual capacity, with commercial production starting H2 2025.

      The structural cost thesis for LiS at scale is credible but unproven industrially: replacing cobalt
      (~$20–35/kg), nickel, manganese, and graphite with abundant sulfur and Lyten's 3D graphene
      (derived from natural gas methane) reduces raw material cost per kWh on paper. However, the
      manufacturing process yield, cycle consistency, and equipment depreciation at gigascale are unknowns.

      The Northvolt Sweden acquisition illustrates capital intensity: the ~$5B all-in deal covers 16 GWh of
      installed cell capacity, implying roughly $312M per GWh in total asset cost—well above the
      $80–120M/GWh greenfield capex for conventional Li-ion, though the Northvolt figure includes Europe's
      largest battery R&D center, 160 hectares of land, and extensive infrastructure. Lyten's stated strategy
      is capital-efficient manufacturing via asset acquisition and incremental line-by-line ramp rather than
      greenfield construction, reducing upfront capital risk while accepting legacy chemistry conversion costs.

      Operating costs are dominated by R&D (technology transition from NMC to LiS), hiring (600+ new
      European employees targeted within 12 months of February 2026), and retrofitting existing Northvolt
      production lines for Lyten's chemistry. These are the core burn rate drivers. None of the standard
      unit-economics metrics (CAC, LTV, payback period, gross margin) have been publicly disclosed.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
