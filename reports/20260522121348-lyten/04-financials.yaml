callouts:
  - calloutType: risk
    title: EXIM LOI Conditionality Is the Central Capital Risk
    body: >
      The $650M EXIM Bank export-credit LOI is the most significant capital instrument in Lyten's
      disclosed financing pipeline, but it carries multiple conditionalities: finalization of loan terms,
      credit underwriting, environmental review, and conversion of customer MOUs to binding contracts.
      The Reno gigafactory—one of the LOI's original targets—has since been cancelled. If the EXIM credit
      does not close, Lyten's capital adequacy depends entirely on continued private equity raises in a
      market that remains skeptical of battery startup execution.
    claimRefs:
      - CI018
      - CI019
      - CI035

  - calloutType: risk
    title: No Binding Automotive OEM Contracts as of May 2026
    body: >
      Reuters reporting confirmed that automotive OEMs including BMW, Volvo Cars, and Scania have not
      committed to ordering from Lyten. BMW described any engagement as "a long way off." Without OEM
      supply contracts, the core EV battery market thesis is unvalidated, and the high-volume revenue
      needed to support the company's capital-intensity model cannot be demonstrated. Defense, BESS,
      and space revenue is real but insufficient to justify a gigafactory-scale capital deployment alone.
    claimRefs:
      - CI027
      - CI028
      - CI030

  - calloutType: insight
    title: Acquisition-Based Capital Model Reduces Greenfield Risk but Not Revenue Risk
    body: >
      Lyten's strategy of acquiring and repurposing Northvolt's existing assets rather than building
      greenfield gigafactories materially reduces upfront capex risk and accelerates manufacturing
      readiness. However, it does not solve the revenue-side risk: the company still needs customers to
      commit at scale, and the technology transition from legacy NMC to Lyten's LiS chemistry at the
      acquired facilities introduces execution risk that no prior battery incumbent has navigated.
    claimRefs:
      - CI015
      - CI038
      - CI033

