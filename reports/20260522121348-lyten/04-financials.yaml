company:
  name: Lyten
chapter:
  number: 4
  title: Financials
  summary: >
    Lyten has secured $625M+ in equity and $650M in conditional EXIM export-credit LOIs, and completed the
    ~$5B acquisition of Northvolt's Swedish assets (16 GWh capacity) in February 2026, but the company
    remains pre-commercial-scale with no audited financials, no binding automotive OEM contracts, a high
    burn rate, and unit economics entirely undisclosed. Revenue from BESS and defense channels is expected
    to begin in earnest from H2 2026; however, expert consensus places EV-grade Li-S commercialization
    beyond 2028 and European carmakers are explicitly withholding supply commitments.

sections:
  - id: revenue-model
    title: Revenue Model and Pricing Proxies
    body: >
      Lyten operates a direct B2B sales model, selling lithium-sulfur battery cells and systems to customers
      in defense, drone/UAV, battery energy storage (BESS), space, and ultimately automotive markets.
      No consumer or channel distribution exists at this stage. The company completed delivery of its first
      commercially available LiS cells in May 2024, initially targeting non-EV applications where regulatory
      barriers are lower and weight-to-energy ratio premiums justify pricing.

      Beyond LiS cells, Lyten holds three product revenue streams: (1) restarted NMC lithium-ion battery
      production from the acquired Northvolt Ett facility in Skellefteå (near-term bridge revenue); (2) BESS
      systems via the Voltpack Mobile System (VMS) product portfolio acquired from Northvolt in July 2025,
      which is already in its third generation with commercial European installations; and (3) graphene
      composites and chemical sensors for industrial customers. The Poland (Gdansk) facility is producing
      BESS products targeting delivery in Q4 2025, and the Swedish factory targets commercial battery cell
      sales in H2 2026.

      No public list pricing exists for LiS cells. Pricing is negotiated in B2B contracts under
      confidentiality. Lyten claims that at manufacturing scale, LiS will be lower-cost than Li-ion because
      sulfur is an industrial by-product while cobalt, nickel, and graphite are eliminated from the chemistry.
      This cost advantage remains a company projection, not a corroborated market data point. The defense
      and space segments command premium pricing due to weight, cycle-life, and supply-chain independence
      requirements, providing a favorable early-revenue mix before the more price-sensitive automotive
      segment matures.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
