  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-statements
      missingEvidence: >
        Audited financial statements or management accounts for Lyten, Inc. including income statement,
        balance sheet, and cash flow statement.
      whyItMatters: >
        Without audited financials it is impossible to verify revenue, gross margin, burn rate, cash
        position, or debt levels. All financial underwriting is operating on indirect signals only.
      diligencePath: >
        Request audited financial statements (or management accounts if unaudited) in investor data room.
        Engage Big 4 audit firm for financial due diligence if data room access is granted.
      relatedQuestionRefs: [QI002, QI003, QI005]

    - type: private-evidence-only
      severity: blocking
      topic: EXIM-LOI-conversion
      missingEvidence: >
        Current status of EXIM Bank LOI conversion to a committed loan facility, including whether
        CARICOM customer MOUs have converted to binding contracts and whether credit underwriting
        has been completed.
      whyItMatters: >
        The $650M EXIM conditional credit is the largest single financing instrument in Lyten's
        disclosed pipeline. If it does not convert, Lyten's capital adequacy depends entirely on
        equity raises. The Reno gigafactory cancellation may have reduced the LOI scope.
      diligencePath: >
        Request EXIM Bank public transaction records and direct company disclosure on LOI status.
        Contact EXIM Bank directly via public inquiries for transaction pipeline status.
      relatedQuestionRefs: [QI006, QI007, QI008, QI020]

    - type: private-evidence-only
      severity: material
      topic: OEM-supply-contracts
      missingEvidence: >
        Signed supply agreements or binding letters of intent from automotive OEM customers for
        LiS battery cell procurement at commercial volumes.
      whyItMatters: >
        Without OEM contracts, the largest potential revenue stream (automotive) is unvalidated.
        This is the primary gap between Lyten's stated technology vision and near-term revenue
        realization.
      diligencePath: >
        Request signed LOIs or supply agreements in data room. Independent verification via
        carmaker investor relations offices or supply chain announcements.
      relatedQuestionRefs: [QI012]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >
        Per-unit manufacturing cost ($/kWh), gross margin by product line, and contribution
        margin at current production volumes vs. projected gigascale economics.
      whyItMatters: >
        Without unit economics it is impossible to assess the credibility of Lyten's long-term
        profitability thesis or the capital requirements to reach breakeven.
      diligencePath: >
        Request segment P&L and COGS breakdown in CFO data room. Commission independent
        techno-economic analysis if internal data is withheld.
      relatedQuestionRefs: [QI003, QI011, QI014, QI019]

    - type: private-evidence-only
      severity: material
      topic: burn-rate-runway
      missingEvidence: >
        Confirmed monthly cash burn rate and forward cash runway estimate as of Q2 2026.
      whyItMatters: >
        Lyten's OPEX is elevated due to simultaneous multi-site integration, R&D, and hiring.
        Without runway data, timing of next equity raise and risk of capital shortfall is unknown.
      diligencePath: >
        Request 13-week cash flow forecast and trailing 12-month OPEX summary from CFO.
      relatedQuestionRefs: [QI005]

