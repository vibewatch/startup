  - id: scale-up-risk
    title: Manufacturing Scale-Up, Capital Intensity, and Adverse Evidence
    body: >
      The Reuters investigation published August 2025 provides the most credible adverse signal on Lyten's
      financial position: despite completing the Northvolt acquisition, the company lacked Northvolt's $50B
      order book and had not secured binding OEM supply commitments. Carmakers including BMW, Volvo Cars,
      and Scania declined to comment or explicitly required evidence of industrial-scale delivery before
      engaging. BMW noted any successor to Northvolt "would only be considered for a future battery cell
      project—still a long way off." A battery scientist at an unnamed European carmaker said their firm
      backed away from Lyten six months prior to August 2025 because it was "only producing at R&D scale."
      These signals indicate that the pathway from pilot to commercial-scale revenue is long and customer-
      dependent.

      Industry experts including former Northvolt executive Emma Nehrenheim warned that European battery
      manufacturers face a "valley of death" requiring 5+ years and government subsidies to become
      competitive with Asian counterparts. Northvolt's own failure—$8B in debt at bankruptcy—demonstrates
      that high funding levels do not protect against execution and demand-side risk. The technology
      transition from NMC to LiS at Northvolt facilities adds another layer of execution risk beyond normal
      manufacturing ramp. Production will start with conventional NMC chemistry and transition to LiS, but
      the timeline and costs of that transition are not publicly disclosed.

      Lyten's burn rate in 2025–2026 is elevated: retrofitting large-scale facilities, hiring 600+ employees
      in Europe, conducting R&D across two continents, and managing multiple simultaneous site acquisitions
      is capital-intensive. The company acknowledged further large capital raises are planned. If equity
      market conditions tighten or OEM customers do not commit, Lyten faces the same structural financing
      dependency that contributed to Northvolt's collapse. The acquisition-based model is more capital-
      efficient than greenfield construction, but does not eliminate the fundamental challenge: manufacturing
      yield, technology risk, and the need for long-term customer contracts to justify ongoing investment.
    claimRefs:
