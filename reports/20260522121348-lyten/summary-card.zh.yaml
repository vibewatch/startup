summary:
  headline: >-
    Lyten 确实拥有差异化的 Li-S 电池化学体系，也通过收购拿到可扩产制造基础设施；但商业进展极不透明、没有经审计收入、$1.3–1.5B 估值相对同业偏高，两处欧洲工厂收购又压上重资本负担。在 EXIM 转化、绑定 OEM
    合同或经审计财务披露降低不确定性之前，只能低置信度观察。
