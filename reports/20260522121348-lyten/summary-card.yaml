summary:
  headline: >-
    Lyten holds genuinely differentiated Li-S battery chemistry and the acquired manufacturing infrastructure to scale
    it — but deep commercial opacity, no audited revenue, a stretched $1.3–1.5B estimated valuation relative to peers,
    and a heavy capital burden from two European facility acquisitions make this a Track at Low confidence until EXIM
    conversion, binding OEM contracts, or audited financial disclosure reduces uncertainty.
