  shortDescription: >-
    Lyten is a San Jose-based supermaterial applications company that commercialises Three-Dimensional Graphene (3DG)
    for use in lithium-sulfur (Li-S) battery cells, lightweight composites, IoT sensors, and battery energy storage
    systems (BESS). The company has raised $625M in equity, acquired the former Northvolt Ett gigafactory in Sweden and
    a BESS facility in Poland, and holds a non-binding $650M EXIM Bank Letter of Interest for export-credit financing.
