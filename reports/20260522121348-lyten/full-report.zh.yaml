      - number: '1.5'
        title: 里程碑、规模与反向事件
        blocks:
          - type: paragraph
            body: >
              2023 年 5 月，Lyten 在 San Jose 启用首个自动化试生产设施，使用标准锂离子设备每年可生产最高 200,000 颗电芯，证明锂硫化学体系可以导入既有制造流程。2024 年 5 月，第一批客户
              A 样件——6.5 Ah 软包电芯——发给 Stellantis 以及其他美国和欧洲 OEM。同一窗口期内，一家美国大型消费电子公司和美国国防部也获得早期交付承诺。

              2024 年 9 月，Defense Innovation Unit（DIU）选择 Lyten 进入一个受资助项目，在 International Space Station（ISS）上演示可充电 Li-S
              电池电芯；集成合作方是 Spacebilt/Skycorp，目标是为宇航服和卫星应用取得飞行认证。2024 年 10 月，Lyten 宣布计划在 Nevada 州 Reno 附近投资超过 $1
              billion，建设全球首座 Li-S 超级工厂，满产年产能目标 10 GWh，一期计划 2027 年上线。

              但到 2026 年初，Lyten 因未能与 Reno-Tahoe Airport Authority 谈妥租约，放弃 Reno 超级工厂计划。Airport Authority 称，Lyten
              转向欧洲绿色能源资产后，美国业务规模“显著”收缩；Lyten CMO 公开否认联邦能源政策是因素，并把决定归因于收购欧洲制造资产的成本效率。CleanTechnica 在 2025 年 8
              月发布的分析已提示，Li-S 商业 EV 部署时间仍不确定，而且 Stellantis 也投资了竞争对手 Li-S 创业公司 Zeta Energy，带来竞争风险。

              2025 年 10 月，Lyten 完成收购 Northvolt 位于波兰 Gdańsk 的 BESS 制造工厂。2026 年 2 月，Lyten 完成收购瑞典 Northvolt Ett 和 Northvolt
              Labs，取得 16 GWh 电池制造产能、160+ 公顷土地，以及位于 Västerås 的欧洲最大电池研发中心；这些资产合计估值约 $5B。与 EdgeConneX 的共址数据中心交易（最高 1 GW
              容量）也同步宣布。2026 年 3 月，Lyten 宣布计划在波兰 Gdańsk 建立工业中心，围绕 BESS 工厂展开，并评估扩大制造和共址 AI 数据基础设施。截至 2025 年 4 月，Lyten
              还使用美国本土材料生产出首批美国电池级锂金属箔，强化其免关税、完全美国本土供应链主张。
