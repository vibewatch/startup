      - number: '7.7'
        title: 客户集中与商业化风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Lyten 活跃的 Li-S 收入全部集中在防务、UAV 和太空渠道。无人机推进项目（加州，2025 年 5 月启动）是唯一接受 Li-S 电芯商业订单的渠道；AEVEX
              Aerospace 合作和 Titan Dynamics 示范 是仅有的点名部署。DIU ISS 合同是单个政府资助示范，没有披露量产后续。这种集中带来投资逻辑失效风险：如果 AEVEX
              无法通过资质或完成交付，或者 DoD 采购优先级改变，Lyten 近端唯一商业 Li-S 收入来源就会消失。汽车渠道代表总可用市场的大部分， 但它需要 B-sample 交付、在汽车 DoD
              下完成量产规模循环寿命验证、正式 OEM 认证（通常在 A-sample 后 3–5 年）和 GWh 级 制造产能；截至 2026 年 5 月，这些都不存在。Stellantis 2024 年 12 月与
              Zeta Energy 签署的 JDA 提供了可信替代方案， 可能降低 Lyten–Stellantis 量产供货协议的概率。Reuters（2025 年 8 月）报道，一家未具名欧洲车企明确退出 Lyten
              评估， 「因为这家美国公司只处在研究和开发规模生产」——这是评估阶段客户流失的直接信号。BESS 渠道借助继承的 Northvolt 欧盟客户，提供最稳定的近端收入， 但这部分收入来自 NMC 化学体系（不是
              Li-S），并承受中国 LFP BESS 供应商的竞争压力；后者拥有制造成本优势，Li-S 在单位经济上尚无法克服。 IDTechEx 行业分析师指出，到 2020 年代末，Li-S
              电池商业化仍将狭窄聚焦在专业高能量应用；主流汽车和电网采用是 2030 年后的行业概率， 不只是 Lyten 的问题。防务客户集中还会引入对美国政府支出优先级、临时拨款决议预算动态以及 NDAA
              合规认证要求的依赖， 增加采购摩擦。
