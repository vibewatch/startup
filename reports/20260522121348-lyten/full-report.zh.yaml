              - CM035
              - CM036
      - number: '2.6'
        title: 证据缺口与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              几个重大不确定性限制了本市场分析的精度。

              公开数据无法单独切出 Li-S 专属 SAM。没有分析师报告按终端用途把 Li-S 市场拆到足以框定 Lyten 真实 SAM 的颗粒度（例如高性能 UAV 电池子市场，而非全部 UAV 电池）。公开 Li-S
              市场估算从 $0.85 B（TBRC，2025）到 $271 B（Mordor Intelligence，2025）不等，相差 300 倍，反映方法论互不兼容。Mordor 数字看起来是在乐观颠覆假设下的综合
              TAM，而 TBRC 代表当前或近期商业收入。两者都不能为 Lyten 的具体场景给出可辩护的自下而上 SAM。

              国防采购量和 Li-S 电池合同金额属于机密或商业敏感信息。美国 DoD 的 $2.6 B 无人机投资数字出现在市场研究报告中，但分配给电池研发、机体或软件开发的比例没有公开，因此很难估算电池专属国防市场规模。

              Lyten 在商业尺寸电芯上的循环寿命数据尚未独立验证。500 次循环目标已经披露，但没有在同行评议论文或第三方基准中得到独立验证。如果循环寿命不达标，汽车 EV 和 BESS 场景将不可进入，Lyten
              可进入市场会被压缩到 UAV 和航天应用。

              Lyten 电芯在商业供货安排中的价格未披露。没有合同价格数据，就无法评估 Lyten 单位经济性在规模化后能否与 LFP 竞争，也无法验证公司关于 Li-S 生产能耗比传统锂离子制造低 90% 的说法。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM025
              - CM035
      - number: '2.7'
        title: 展项
        blocks:
          - type: callout
            title: 循环寿命关口压缩 SAM
            body: >
              Lyten 的可服务市场实际上被循环寿命卡住。在公司独立验证商业尺寸电芯达到 500+ 次循环之前，汽车 EV 和 BESS 场景仍不可进入，Lyten 只能待在高端 UAV
              和航天细分市场。如果循环寿命目标落空，SAM 会相对标题式 TAM 缩小一个数量级，投资逻辑也将完全取决于国防和航天项目采用——而这些项目本身也有漫长认证周期和认证风险。
            calloutType: risk
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM035
          - type: callout
            title: FEOC 规则带来供应链护城河机会
            body: >
              美国 FEOC 规则（2026 年生效）、中国电池进口高关税（自 2025 年 1 月以来 BESS 成本 +56–69%），以及中国在锂离子供应链中 70–90% 的份额，合在一起给 Lyten
              的本土生产平台创造结构性机会。如果 Lyten 能在美国和欧洲基地以有竞争力的成本证明 FEOC 合规生产，它就能获得中国 LFP 制造商难以复制的监管护城河——让政府和公用事业买家即使在 Li-S 尚未与
              LFP 完全成本平价前，也愿意支付溢价。
            calloutType: insight
            claimRefs:
              - CM031
              - CM032
              - CM033
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Lyten 的买家——国防集成商、航空航天主承包商、UAV OEM、车企和固定式储能开发商——要解决“每公斤更高能量”这个任务，有几条路：采用竞争对手的 Li-S 电芯，转向固态锂金属电芯，部署既有供应商的先进
              LFP 或 NMC 软包，等待现状技术进步，或资助内部研发项目。每条路的切换成本、认证时间线和风险画像都不同，因此 Lyten 同时面对商业化前同行、大型成熟供应商和已验证既有方案的惯性。

              直接 Li-S 同行——Zeta Energy、Sion Power、Theion 和 PolyPlus——都瞄准同样的高能量密度细分市场，也共享 Lyten 的核心判断：硫可以替代昂贵的关键矿物。尚无一家达到
              GWh 级生产，但 Zeta 2024 年与 Stellantis 的联合开发协议，以及 Sion Power 2026 年转向国防，显著加大了 Lyten 两个核心市场的近期竞争压力。

              相邻的下一代竞争对手（QuantumScape、Factorial、SES AI）也在解决同样买家痛点——能量密度、重量和续航——只是路径不是 Li-S，而是固态或锂金属化学体系。它们的 OEM
              合作在若干案例中比 Lyten 更成熟：Factorial 到 2026 年有 Stellantis 演示车队验证和四家主要 OEM JDA，QuantumScape 则向 Volkswagen 的
              PowerCo 授权。这些公司争夺同一批车辆集成预算，也争夺全球车企的同一组项目名额。

              既有锂离子供应商——以 CATL（2026 年 1 月全球 EV 电池份额 45.2%）和 BYD（13.8%）为首——凭规模、已验证可靠性和快速下跌的 LFP 成本，构成最深的竞争护城河。韩国三巨头（LG
              Energy Solution、Samsung SDI、SK On）正在美国市场部署本土 LFP 产能，直接竞争 Lyten 的固定式储能场景。现状 NMC / LFP
              仍是默认选择，并且在每一次设计导入中，都重新设定 Lyten 必须跨过的成本、循环寿命和供应链整合门槛。
