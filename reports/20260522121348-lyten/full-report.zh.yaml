  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
      - 优先级
    rows:
      - - 审计财务报表
        - FY2024 和 FY2025 经审计 P&L、资产负债表和现金流量表
        - 无法核验收入、烧钱速度或资本充足性；Compworth $110M 估计值是未经验证的模型输出
        - 通过 NDA 直接向 Lyten 管理层或数据室索取
        - 关键
      - - EXIM 初步承诺
        - EXIM.gov 已批准交易列表发布 EXIM 正式初步承诺
        - LOI ≠ 承诺融资；转化是最大的短期价值催化剂，也是主要资本充足性抓手
        - 监测 EXIM.gov Make More in America 已批准交易页面；直接联系 EXIM Washington
        - 关键
      - - Series C 条款和股权结构表
        - 投后估值、稀释比例、优先股堆叠、清算瀑布、反稀释条款
        - 影响回报计算和下行情景模型；评估优先权包袱和下轮降估值风险时必须拿到
        - 向投资者关系部门获取；在 NDA 下审阅 Series C 认购协议
        - 高
      - - 具约束力的商业收入合同
        - 来自具名客户、含年付 ≥$10M 照付不议条款的收入合同
        - 没有具约束力收入，投资逻辑就全靠技术和里程碑假设；无法预测 Series D 现金跑道
        - 在 NDA 下索取客户参考名单和合同摘要；核查监管文件中的重大合同
        - 高
      - - Lyten 瑞典转产时间线和资本开支估计
        - Northvolt Ett（Skellefteå）从 NMC 转为 Li-S 的转换成本、时间线、已承诺资本开支和里程碑计划
        - GWh 规模从 NMC 转为 Li-S 尚未验证；未量化的资本开支敞口是最大未披露财务风险
        - 委托独立工厂评估；索取 Lyten 内部可行性模型和重启计划
        - 中
    notes: |
      尽调事项按关键 / 高 / 中排序，反映信息缺口的相对严重程度。所有事项均假设投资人已在 NDA 下进入后期尽调。数据可得性截至 2026 年 5 月 22 日。
    claimRefs:
      - CV007
      - CV008
      - CV011
      - CV025
      - CV039
