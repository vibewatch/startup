              $650M EXIM Bank 出口信贷 LOI 是 Lyten 已披露融资管线中最重要的资本工具，但它带着多项条件：敲定贷款条款、信贷承销、环境审查，以及把客户 MOU 转成具约束力的合同。Reno
              超级电池工厂是 LOI 原始目标之一，后来已取消。如果 EXIM 信贷无法关闭，Lyten 的资本充足性就完全依赖继续私募股权融资，而市场仍对电池初创公司的执行能力保持怀疑。
