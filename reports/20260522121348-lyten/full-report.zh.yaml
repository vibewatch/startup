      - number: '5.3'
        title: 制造成熟度与工艺准备度
        blocks:
          - type: paragraph
            body: >
              Lyten 的制造版图横跨三个地区，准备度差异很大。

              San Jose, California（3D Graphene + LiS 试点）：位于 145 Baytech Dr. 的原始 145,000 sq ft 设施承载 3D Graphene 生产，以及
              2023 年 5 月投产的自动化试点电芯组装线。已披露试点产能约 200,000 cells/year（合并多层软包和 18650/2170/26650 圆柱），相当于总试点线吞吐量约 2.4
              MWh/yr。电极涂布、电解液灌注和电芯封装的半自动及自动设备已在运行，超过 3,000 个电池测试通道（Maccor、Arbin）用于化成和循环测试。该设施完成了 2024 年 5 月 A-sample
              出货，并供应当前防务和无人机订单。

              San Leandro, California（LiS 扩产）：这座 119,000 sq ft 的前 Cuberg 设施于 2024 年 11 月收购，据报道改造投资约 $20M，目标 LiS 电芯年产能
              200 MWh/yr，并于 2025 年 H2 启动商业生产。相较 San Jose 试点线，这大约是 80× 的跃升。收购和改造时间表意味着工业化节奏很快，带有执行风险；截至 2026 年 5
              月，生产线投产状态尚无公开独立确认。

              Northvolt Sweden（NMC 重启 → LiS 工业化）：2026 年 2 月完成的约 $5B 收购，带来 Skellefteå 的 Northvolt Ett 和 Ett Expansion，以及
              Västerås 的 Northvolt Labs R&D 中心，总计 16 GWh 已安装电芯制造产能。Skellefteå 将立即重启 NMC 锂离子电芯生产，目标 2026 年 H2 向
              BESS、汽车（Scania、Porsche 718 后继车型）和出行客户商业销售。Västerås 的 Northvolt Labs 将与 Lyten Silicon Valley 团队合作，把 LiS
              技术工业化到吉瓦级制造——但这一过程没有明确时间表。两个瑞典场地合计将重新雇用 600+ 名员工。

              Gdańsk, Poland（BESS 制造）：2024 年 10 月收购的 Northvolt Dwa 是欧洲最大 BESS 制造设施，年产能 6 GWh（可扩至 12 GWh）。它使用锂离子化学体系生产
              Voltpack Mobile System 系列；面向欧洲客户的 BESS 交付目标为 2025 年 Q4。这是 Lyten 资产组合中商业制造成熟度最高的资产。

              一个关键制造依赖，是把电芯组装基础设施从 NMC 转向 LiS 化学体系。LiS
              电芯工艺与锂离子共享底层设备（涂布机、电解液灌注、封口机），但硫正极、锂金属负极和改性电解液需要针对材料的工艺控制，尤其是水分隔绝、锂处理和合成后正极加工。Lyten 没有公开任何生产层级的良率或单电芯制造成本。
