  - id: FR002
    title: 风险传导地图
    type: dag
    layout: wide
    summary: |
      展示 Lyten 主要风险如何传导到收入、客户关系、资本状况和投资逻辑可行性。循环寿命缺口与 Northvolt 重启是两个中心度最高的节点，多数下游风险会经过其中一个或两个节点。
    data:
      nodes:
        - id: cycle-life-gap
          label: Li-S 循环寿命缺口（100% DoD）
          type: risk
          description: ~150 次软包电芯循环，对比 EV 所需 1,500+ 次
          claimRefs:
            - CR001
            - CR002
            - CR003
        - id: northvolt-restart
          label: Northvolt Ett 重启风险
          type: risk
          description: 从收购到商业 LiS 电芯交付的 7 个月目标（Feb–H2 2026）
          claimRefs:
            - CR016
            - CR017
        - id: exim-loi-risk
          label: EXIM LOI 未转化风险
          type: risk
          description: $650M LOI 不具约束力；条件包括客户合同和环境审查
          claimRefs:
            - CR009
            - CR010
        - id: stellantis-hedging
          label: Stellantis 多供应商对冲
          type: risk
          description: Stellantis 于 Dec 2024 签署 Zeta Energy JDA；未对 Lyten 作出排他承诺
          claimRefs:
            - CR023
            - CR041
        - id: automotive-channel-at-risk
          label: 汽车渠道延迟 / 流失
          type: impact
          description: 没有有约束力的汽车供货合同；车企退出信号；2030+ 可行性
          claimRefs:
            - CR005
            - CR006
            - CR041
        - id: capital-shortfall
          label: 资本缺口 / 加速稀释
          type: impact
          description: EXIM 失败将迫使股权稀释，或削减欧盟制造
          claimRefs:
            - CR029
            - CR033
        - id: manufacturing-delay
          label: 制造延迟（瑞典 / 美国）
          type: impact
          description: 面向 BESS 和无人机客户的 Li-S 电芯交付延迟；CARICOM MOU 面临风险
          claimRefs:
            - CR017
            - CR022
        - id: revenue-concentration
          label: 收入集中在国防 / BESS
          type: impact
          description: 近期 LiS 收入完全来自无人机 / 太空；BESS 收入来自 NMC，而非 LiS
          claimRefs:
            - CR039
            - CR040
        - id: thesis-break
          label: 投资逻辑破裂事件
          type: outcome
          description: 到 2028 年仍无法在商业规模证明汽车级 LiS
          claimRefs:
            - CR006
            - CR007
      edges:
        - from: cycle-life-gap
          to: automotive-channel-at-risk
          label: 没有循环寿命突破，就无法取得汽车认证
        - from: cycle-life-gap
          to: revenue-concentration
          label: 迫使公司依赖循环次数要求较低的应用
        - from: northvolt-restart
          to: manufacturing-delay
          label: 重启失败会推迟 H2 2026 面向波兰 BESS 的电芯供应
        - from: northvolt-restart
          to: capital-shortfall
          label: 延迟会增加现金消耗，且没有收入对冲
        - from: exim-loi-risk
          to: capital-shortfall
          label: LOI 未转化会抹掉 $650M 债务资本
        - from: stellantis-hedging
          to: automotive-channel-at-risk
          label: 对冲会降低签下有约束力供应合同的概率
        - from: automotive-channel-at-risk
          to: thesis-break
          label: 失去 OEM 渠道是主要投资逻辑破裂情景
        - from: capital-shortfall
          to: manufacturing-delay
          label: 资本不足会限制设施重启和爬坡
        - from: manufacturing-delay
          to: revenue-concentration
          label: 延迟会拉长 LiS 收入对国防 / 无人机的依赖
