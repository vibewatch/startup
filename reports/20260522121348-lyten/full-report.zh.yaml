  - id: FE001
    title: Lyten 3D Graphene 产品架构栈
    type: stack
    layout: wide
    summary: |
      Lyten 的技术栈从原材料输入到核心平台再到商业产品应用，展示 3D Graphene 如何支撑五条不同产品线。
    data:
      layers:
        - label: 原材料输入
          detail: 甲烷（天然气）作为碳源；硫（工业副产品）作为正极活性材料；锂金属（2025 年 4 月起美国本土供应）；电解液溶剂 / 盐。
          items:
            - 甲烷（CH₄）— 美国本土天然气；碳和氢副产品
            - 硫 — 工业副产品；零冲突供应链
            - 锂金属 — 美国本土箔材生产 2025 年 4 月启动
        - label: 3D Graphene 合成平台
          detail: 自研微波等离子反应器位于 55k sq ft San Jose 工厂，把甲烷转化为可调 3D 碳骨架和氢。541+ 项专利覆盖合成、结构和应用集成。
          items:
            - 专利微波等离子反应器（甲烷裂解）
            - 可调引擎：孔隙率 / 比表面积 / 导电性 / 表面能控制
            - 氢同步捕集，用于清洁燃料再利用；净碳负工艺
        - label: 核心电芯架构（Li-S）
          detail: 多组件 LiS 电芯堆栈：3DG-硫正极（纳米捕获多硫化物限域）、受保护 Li-metal 负极、低 E/S 电解液、多功能隔膜。水系正极加工（无 NMP）。
          items:
            - 3D Graphene-硫复合正极（高面容量；水系无 NMP 粘结剂）
            - 受保护 Li-metal 负极（抑制枝晶；抗多硫化物 SEI）
            - 低 E/S 比电解液（自研配方；支撑高比能量）
            - 多功能隔膜（多硫化物迁移屏障）
        - label: 制造与系统集成
          detail: >-
            San Jose 试点（2.4 MWh/yr）、San Leandro 爬坡（目标 200 MWh/yr）、Northvolt Labs Västerås（LiS 工业化）、Gdańsk BESS（6
            GWh）、Skellefteå NMC（16 GWh）。
          items:
            - San Jose：自动化试验线；200k cells/yr；软包 + 18650/2170/26650
            - San Leandro：由 Cuberg 转换；目标 200 MWh/yr LiS（2025 H2）
            - Västerås：LiS GWh 级工业化（时间线未说明）
            - Gdańsk：Voltpack BESS 6 GWh/yr（NMC → LiS 转换路线图）
            - Skellefteå：16 GWh NMC 重启；2026 H2 商业销售
        - label: 商业产品线
          detail: 五类产品共用 3D Graphene 平台：LiS 电芯、Voltpack BESS、轻量化复合材料、IoT 传感器和 NMC 过渡电芯。
          items:
            - LiS 电芯（软包 6.5 Ah / 圆柱 18650 / 2170 / 26650）
            - Voltpack Mobile System BESS（281–1,405 kWh；第三代；波兰）
            - 轻量化复合材料（减重 50%；交通运输 / 航空航天）
            - IoT 传感器阵列（化学 / 环境；Honeywell 合作）
            - NMC 锂离子电芯（Northvolt 遗留；H2 2026 过渡收入）
    approximationNotes: |
      制造产能数字是公司披露的目标。San Leandro 投产状态截至 May 2026 尚未确认。Skellefteå 产能承接自 Northvolt；LiS 转换时间表尚未公开。
    claimRefs:
      - CE001
      - CE008
      - CE011
      - CE012
      - CE013
      - CE040
  - id: FE002
