      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >
              Lyten 的财务图景主要受证据限制约束：作为私营公司，它没有披露义务，也没有发布经审计财务报表；收入、年经常性收入（ARR）、毛利率、烧钱速度、EBITDA
              等所有运营指标均保密。公司处在商业规模化前的拐点，已经拿到可观资本和制造资产，但尚未证明可以持续产生商业收入。

              收入质量判断喜忧参半。BESS 销售（波兰）和防务 / 航天 LiS 电芯带来的近期收入可信但仍处早期；Voltpack Mobile System 是已经在欧洲安装过的成熟产品。可是，能支撑 Lyten
              核心技术逻辑的汽车收入至少还要几年，并且依赖独立技术验证、工业规模交付，以及尚未落地的 OEM 供货合同。

              资本充足性是首要财务风险。公司拥有 $625M+ 股权资本、一份 $650M 条件性 EXIM LOI，并在争取欧盟拨款项目，但同时背着完全靠股权融资支撑的 $5B+
              收购承诺。缺少债务授信和长期客户合同，意味着公司仍依赖股权市场愿意买单。第三方估计的约 $110M 年收入缺少一手来源佐证，承销时应打折处理。

              尽调优先事项是：(1) 经审计财务报表或管理账；(2) EXIM LOI 转为实际信贷额度的确认状态；(3) CARICOM BESS 合同相关客户 MOU 细节；(4) 分产品线毛利率；(5)
              烧钱速度和已确认现金跑道；(6) OEM 意向函或供货协议；(7) 多 GWh 规模下 LiS 的技术成熟度。
