      - number: '3.3'
        title: 相邻的下一代化学体系竞争者
        blocks:
          - type: paragraph
            body: >
              QuantumScape（San Jose, CA；NYSE: QS）为固态锂金属电池采用技术授权模式，把自己定位成电池行业里的半导体 IP 授权商。其 Eagle Line 试生产设施于 2026 年 2
              月启用，生产 QSE-5 电芯，体积能量密度 844 Wh/L，10–80% 充电少于 15 分钟，1,000 次循环后容量保持约 ~95%。Volkswagen 的 PowerCo 持有每年最高 85 GWh
              QSE-5 相关产能权利；Corning 和 Murata 是陶瓷隔膜制造伙伴。QuantumScape 也瞄准无人机、国防航空航天和 AI 数据中心——与 Lyten 的国防、UAV
              和工业场景直接重叠。电芯成本仍在 $400–$800/kWh，远高于既有锂离子，但授权模式可以让 QuantumScape 自身避开直接资本开支负担，从而更快扩产。

              Factorial Energy（Woburn, MA）结合 FEST® 和 Solstice 固态电解质平台，最高达到 450 Wh/kg（Solstice），并已有真实世界验证电芯（77 Ah 电芯通过
              Stellantis 实验室测试；Mercedes EQS 原型车单次充电行驶 745+ 英里）。Stellantis 正把 Factorial 电芯装入 2026 年的 Dodge Charger
              Daytona 演示车队。Factorial 与 Mercedes-Benz、Stellantis、Hyundai Motor 和 Kia 持有 JDA——四家 OEM 协议，相比之下 Lyten 只有
              Stellantis 投资关系。拟议 Nasdaq 合并（ticker: FAC）对 Factorial 估值约 ~$1.1 billion，并带来 $100 million 新资本，预计 2026
              年中完成，将显著增强其资金火力。Factorial 目标最早 2027 年进入高端 / 豪华 EV 市场。

              SES AI（Boston, MA；NYSE: SES）把锂金属 B 样件电芯（已展示 417 Wh/kg）与 AI-for-Science 材料发现平台（AlphaPhase）结合。2025 年 1 月，SES
              AI 从两家未披露名称的主要 OEM 合作伙伴获得合计最高 $10 million 合同，用于为锂金属 B 样件和成熟锂离子电池开发 AI 发现的电解液。历史 JDA 合作伙伴包括 GM、Hyundai-Kia
              和 Honda。SES 目标在 2030 年代早中期量产，给 Lyten 留出一段汽车竞争窗口，但 SES 面向无人机和机器人的材料发现，也与 Lyten 近期国防管线重叠。
