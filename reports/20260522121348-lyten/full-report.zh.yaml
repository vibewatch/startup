  - id: FM003
    title: 买方 / 细分市场地图
    type: matrix
    layout: wide
    summary: |
      按近期收入就绪度、预算可得性、认证周期长度和 Li-S 重量优势相关性，对 Lyten 五个目标买方细分场景打分。
    data:
      columns:
        - 近期收入就绪度
        - 预算可得性
        - 认证周期长度
        - Li-S 重量优势相关性
      rows:
        - label: 国防 / UAV
          values:
            - 高 — 已交付 DoD 样品；试点项目活跃
            - 中 — 需要 MIL-SPEC 认证并进入项目办公室
            - 长（3–7 年到全速量产）
            - 关键 — 单位重量续航决定任务表现
        - label: 航天 / 卫星
          values:
            - 中 — ISS 演示进行中；尚无生产合同
            - 中 — NASA 任务预算；商业 LEO 主承包商愿付溢价
            - 很长（3–5 年 TRL 门槛到飞行认证）
            - 关键 — 卫星平台减重是最高价值用例
        - label: 汽车 EV
          values:
            - 低 — 正与 Stellantis 处于设计导入阶段；未披露 SOP 日期
            - 高 — Stellantis 投资 $323 M；OEM 设计预算可用
            - 长（循环寿命里程碑后 2–4 年 PPAP）
            - 高 — 每 kg 续航提升相对 NMC 有竞争力
        - label: 商用无人机 / 物流
          values:
            - 中 — FedEx 是投资方；近期可能有试点交付
            - 中 — 物流车队有预算；靠交付效率 ROI 付费
            - 中（1–3 年供应商认证到车队铺开）
            - 高 — 单次充电飞行时间是核心性能 KPI
        - label: BESS / 固定式储能
          values:
            - 低 — 循环寿命缺口限制大多数 BESS 应用
            - 低-中 — LFP 达到 $63/kWh，当前招标中 Li-S 缺乏竞争力
            - 中（1–2 年项目融资周期）
