  - id: TV005
    title: 投资逻辑击穿与止损触发因素表
    columns:
      - 触发事件
      - 阈值
      - 投资逻辑影响
      - 时间范围
      - 建议行动
    rows:
      - - EXIM LOI 未获正式承诺即失效
        - 到 Q4 2026，EXIM.gov 未发布初步承诺
        - 移除主要债务融资机制；总资本可得性减少约 $650M；资本充足性投资逻辑坍塌
        - 6–12 个月
        - 下调至回避；评估纯股权再融资能力和稀释影响
      - - Series D 估值持平或下调
        - Series D 投后每股价格 ≤ Series C 隐含每股价格
        - 发出投资者信心流失信号；反稀释条款触发；股权结构压力显性化
        - 12–18 个月
        - 下调至回避；监测股权结构重组和优先股堆叠
      - - Lyten Sweden 重启延误至 H2 2027 之后
        - 到 2027 年 12 月，Skellefteå 未产出商业规模 Li-S 电芯
        - 制造执行风险兑现；收购逻辑削弱；NMC 转 Li-S 所需资本开支未量化且加速消耗
        - 12–24 个月
        - 将风险评级上调至关键；要求独立工厂评估
      - - Stellantis JDA 终止，或披露排他性竞争投资
        - 新闻稿或监管披露显示 Stellantis 终止 JDA，或签署排他性竞争电池供货协议
        - 移除关键 OEM 战略验证；Stellantis 从客户投资者变成纯财务持有人；削弱 Series D 叙事
        - 持续
        - 重大重估投资逻辑；可能下调
      - - 上市电池同行退市或申请破产
        - QS、SES AI 或 SLDP 停止交易或申请破产保护
        - 公开市场重估下一代电池资产类别；IPO 前二级市场需求坍塌；板块情绪转为负面
        - 持续
        - 暂停新增敞口；任何追加承诺前，完整重估板块
    notes: |
      触发因素和阈值为指示性，并非合同约定。时间范围为近似值。所有触发描述基于截至 2026 年 5 月 22 日公开可得证据。
