      - number: '3.2'
        title: 直接锂硫同行
        blocks:
          - type: paragraph
            body: >
              Zeta Energy（Houston, TX）是 Lyten 最接近的直接同行，也是汽车 OEM 场景中最可信的近期威胁。Zeta 成立于 2014 年，使用硫化碳正极和预锂化垂直排列碳纳米管负极，声称能量密度
              450 Wh/kg、最高 2,000 次完整充放电循环、10C 充电倍率。2024 年 12 月，Stellantis 与 Zeta 签署联合开发协议，目标是在 2030 年前将 Li-S EV
              电池用于车辆——这也是 2023 年投资 Lyten 的同一家车企。2024 年初 $4 million DOE 赠款进一步验证了 Zeta 技术。Zeta CSO 明确称 Lyten 是美国最大的 Li-S
              竞争对手，并指出 Zeta 可以使用与锂离子相同的超级工厂 装配设备，直接对标 Lyten 的同等主张。Zeta 尚未披露软包电芯试生产设施，也未公开确认批量订单，但其双重 OEM 触达（Stellantis
              和未披露其他方）实质压缩了 Lyten 的汽车护城河。

              Sion Power（Tucson, AZ）从 Brookhaven National Laboratory 的 Li-S 源头，演化为超过 500 Wh/kg 的锂金属（Licerion®）平台。2026 年
              3 月，Sion Power 宣布战略性扩张进入美国国防和航空航天——无人机、巡飞弹、自主海上 / 地面车辆——与 Lyten 当前最强市场正面竞争。Sion Power 拥有 430+ 项专利、30+
              年研发积累和 110,000 平方英尺美国本土设施，资源充足。CNBC 引述的其“在电动车市场疲软之际”转向，显示它从 EV 战术性撤退，并把资源重新投向 Lyten 的核心场景。首批产品预计 2026
              年底出货。

              Theion（Berlin, Germany）于 2025 年 3 月完成 €15 million（约 $16 M）Series A，由 Team Global、Geschwister Oetker
              Beteiligungen 和 Enpal 领投。Theion 的晶态单斜 γ-硫正极瞄准 >1,000 次循环寿命，并声称能量密度是传统锂离子的 3×、成本为
              1/3。公司称汽车、固定式储能和电动航空航天客户正在“观察中”，等待首批软包电芯。Theion 主要在欧洲竞争，但扩大了 Lyten 的全球同行集合，也显示非美国玩家正在提速。

              PolyPlus（Berkeley, CA）成立于 1991 年，开发玻璃保护锂金属和 Li-S 电池（400–600 Wh/kg），用于军事、无人机和水下应用。2023 年 $10 million Series
              A 资助试生产扩张。PolyPlus 在国防和航空航天细分市场直接与 Lyten 竞争，但未披露汽车或固定式储能 JDA，商业化阶段也早于 Zeta 或 Sion Power。
