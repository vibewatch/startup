      - number: '2.5'
        title: 采用约束与反证
        blocks:
          - type: paragraph
            body: >
              Li-S 电池面临一组互相牵连的技术和商业障碍，压制近期采用，也让 Lyten 的 SAM 低于标题式 TAM。

              循环寿命是第一道关口。Lyten 披露的 2026 年目标是 500 次 C/3 倍率充放电循环——若达成，可支撑无人机和航天应用，但仍低于汽车 EV 所需的 1,000–2,000 次，也低于主流 BESS
              所需的 3,000–6,000 次。多硫化物穿梭效应——多硫化锂中间体溶入电解液、迁移到负极并消耗正极——会造成容量持续衰减，仍是行业最主要、尚未解决的制造问题。硫正极在嵌锂过程中体积最高膨胀
              80%，会挤压电芯结构并缩短日历寿命。

              体积能量密度限制了空间优势。现代 Li-S 电芯重量能量密度约 ~500 Wh/kg，但体积能量密度只有 ~540 Wh/L——与锂离子相当，并未更优。对空间受限、体积和重量同样关键的 EV
              平台来说，这把替代逻辑限制在重量敏感应用中。

              LFP 成本竞争严酷，而且还在恶化。2025 年 LFP 电池包价格降至 $52–74/kWh，而 Li-S 电芯仍停留在小批量定价。中国电池储能系统级 BESS 招标价格达到 $63/kWh——这是 Li-S
              在固定式储能中尚无法竞争的价格底线。Apricum 的分析结论是，Li-S “不太可能进入任何循环寿命至关重要的应用，例如固定式储能”。

              钠离子电池已在成本敏感场景成为竞争威胁，价格 $59/kWh——略高于 LFP 但低于 NMC——并被 CATL 和中国 OEM 集成进低成本 EV。Volta Foundation 2024 年 SWOT
              分析把 Na-ion 认定为 Li-S 的“日益增长威胁”，威胁的正是 Li-S 原本有望率先商业落地的成本敏感市场。

              制造供应链不成熟，以及美国关税 / FEOC 合规成本，也增加摩擦。自 2025 年 1 月以来，Trump 政府关税让美国市场 BESS 项目成本上升 56–69%。长时储能（LDES）资金 2025 年下降
              30%，VC 投资下滑 72%，说明投资人怀疑非 LFP 化学体系能否在近期投资周期内跑通商业可行性。Oxis Energy 2021 年破产、Sion Power 转离 Li-S，都是商业化风险的历史先例。
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
