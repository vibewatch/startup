  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              Lyten 面向五个不同客户细分市场，它们在技术准备度、商业成熟度和采购周期上差异很大。防务和 UAV 细分市场商业进展最靠前：Lyten 于 2025 年 5 月把加州 LiS
              产能投入防务、无人系统和卫星客户，并开始接受订单。航天和 ISS 细分市场在 Defense Innovation Unit 合同（2024 年 9
              月）之后进入政府资助的认证阶段，将在国际空间站（ISS）上测试软包和圆柱 LiS 电芯。汽车 OEM 细分市场由 Stellantis 锚定；Stellantis 于 2023 年 5
              月签署联合开发协议，2024 年 5 月收到 A-sample（6.5 Ah 软包）电芯，并在 Chrysler Halcyon Concept EV 中展示 Lyten
              电芯；但双方没有具约束力的供货协议，关系仍处评估阶段。BESS 和电网储能细分市场商业成熟度最高：Voltpack Mobile System 第三代产品在波兰 Gdańsk 制造（Northvolt
              收购后重启的 6 GWh 设施），并向继承的欧洲客户出货。消费电子、复合材料和传感器构成第五个细分市场，公开披露有限——一家未具名大型美国 OEM 于 2024 年 Q2 收到 A-sample
              电芯，Honeywell 作为战略投资方参与，但采购兴趣未披露。一个关键分层提醒是：FedEx 和 Honeywell 是 2023 年 9 月 Series B 轮的股权投资方，但没有公开承诺采购 Lyten
              产品；商业化叙事把它们纳入时，混淆了投资者和客户角色。地域拆分上，LiS 电池客户（防务、航天）以美国为中心，BESS 以欧洲为中心。
