      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              Lyten 的乐观情景要求三件事同时发生：EXIM LOI 在 2026 年底前转成正式初步承诺；Lyten Sweden（Northvolt Ett） 到 2027 年中以商业规模重启 Li-S
              电芯生产；至少签署一份有约束力的汽车 OEM 供货合同。在这个情景下，Lyten 将成为第一家拥有可信 OEM 客户并实现 GWh 级生产的 Li-S 电池公司，足以支撑类似 QuantumScape IPO
              早期 $3–6B 估值的重估。BNEF 2026 Energy Transition Investment Trends 报告提供了有利宏观背景：2025 年全球清洁能源投资达到 $2.3T，
              气候科技股权投资同比增长 53%，全球储能部署预计 2026 年达到 158 GWh，较 2025 年增长 41%。仅储能投资在 2025 年就达到 $71B，为电池扩产叙事创造了有利资本环境。

              基准情景假设 EXIM LOI 在 2026 年大部分时间仍不具约束力，Lyten Sweden 达成有限生产里程碑，公司以较 Series C 标记小幅溢价融资 Series
              D。在这个情景下，$1.0–1.6B 估值区间延续，并伴随新股稀释。2027 年前商业收入不会出现台阶式变化。 悲观情景锚定 Northvolt 先例：如果 EXIM 条件仍未满足，Lyten Sweden 从
              NMC 转向 Li-S 化学体系的技术验证失败， 或 Stellantis 在并行 Zeta Energy JDA 后降低承诺，公司可能面对降价轮，或以大幅折价完成 Series D。
              FutureMarketInsights 预测 Li-S 电池市场 2025 年仅 $24.8M、2030 年 $82.5M——绝对市场规模很小，限制近端收入信心。 悲观情景下，隐含估值压缩至
              $0.3–0.8B，与近端资本困境事件一致。
