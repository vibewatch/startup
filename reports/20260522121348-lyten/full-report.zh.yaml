      - number: '3.4'
        title: 既有锂离子供应商与现状
        blocks:
          - type: paragraph
            body: >
              Lyten 面对最深的竞争护城河，是根深蒂固的 NMC / LFP 供应链。2026 年 1 月，CATL 占全球 EV 电池装车量 45.2%（32.5 GWh），并在 2026 年 Q1
              首次五年来把中国国内产量份额推过 50.1%——在 NMC 中份额高达 81.6%，在 LFP 中推进至 41%。BYD 2026 年 1 月全球份额 13.8%（9.9 GWh），几乎全部来自 LFP。CATL
              和 BYD 合计约占当月全球 EV 电池装车量 ~59%。

              韩国厂商——LG Energy Solution（2026 年 1 月全球份额 6.6%）、SK On（3.2%）和 Samsung SDI（2.2%）——正在 NMC 强项之外推进
              LFP，以挑战中国在美国和欧盟市场的主导地位。LG Michigan LFP 工厂 2025 年 6 月开始量产，美国目标产能到 2026 年底达到 50 GWh。Samsung SDI 正在改造 Indiana
              StarPlus Energy 合资线，用于方形 LFP ESS 生产，目标 2026 年 Q4 达到 30 GWh 产能。

              对 Lyten 瞄准的场景来说，既有供应商就是买家熟悉的现状替代方案。NMC 电芯在高端 EV 电池包中达到 265 Wh/kg，现代 LFP 以 160–200 Wh/kg 交付 2,000–5,000
              次循环寿命，质量已得到验证。LFP 的成本下行轨迹——中国厂商电芯层面仍报价约 ~$60–80/kWh，韩国厂商目标做到中国价格 10% 以内——让任何未被 FEOC / NDAA
              规则锁出中国供应链的买家，越来越不愿承担切换成本。

              因此，现状并非静止：既有供应商在增加产能、降低成本，并同步探索 LFP+（锰增强）和固态开发路线。Lyten 的循环寿命和规模里程碑每推迟一次，就会延长既有供应商缩小能量密度差距的窗口。
