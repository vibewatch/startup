  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: |
      从宏观顺风、技术位置、资本结构、商业证据缺口和可比公司风险，串联到“观察”推荐的证据链。
    data:
      nodes:
        - id: macro-tailwinds
          label: 宏观顺风
          description: BNEF 2026：全球储能投资 $71B；气候科技股权融资 +53%；预测 2026 年储能部署 158 GWh
          claimRefs:
            - CV021
            - CV022
            - CV023
            - CV024
        - id: technology-position
          label: 技术位置
          description: Li-S + 3D graphene；电芯级 560 Wh/kg；541 项专利；公开记录中商业化推进最远的 Li-S 平台
          claimRefs:
            - CV040
        - id: capital-structure
          label: 资本结构
          description: $625M 股权融资（5 轮）；截至 May 2026，$650M EXIM LOI 不具约束力；没有已承诺债务融资
          claimRefs:
            - CV001
            - CV008
            - CV010
        - id: commercial-evidence
          label: 商业证据缺口
          description: 未披露经审计收入；Compworth 约 $110M 模型估计未经验证；没有有约束力的 OEM 供货合同
          claimRefs:
            - CV007
            - CV011
        - id: comparable-risk
          label: 可比公司风险
          description: QS：净亏损 $421M；Northvolt：融资 $15B+ → Nov 2024 Chapter 11；SES AI 和 SLDP 较 SPAC 高点大幅折价
          claimRefs:
            - CV013
            - CV025
            - CV026
            - CV034
        - id: execution-risk
          label: 执行风险
          description: EXIM LOI 条件仍未解决；Lyten Sweden 的 NMC 到 Li-S 转换尚未在 GWh 规模测试
          claimRefs:
            - CV010
        - id: valuation-judgment
          label: 估值判断
          description: $1.3–1.5B 估计值，对比已披露商业收入为零；相较可比的收入前电池公司估值偏高
          claimRefs:
            - CV004
            - CV005
            - CV029
            - CV033
        - id: recommendation-output
          label: 观察
          description: 低信心 · 高风险 · 估值偏高 · 上调触发条件：EXIM 转化 + 经审计收入 + 有约束力 OEM 合同
          claimRefs:
            - CV036
      edges:
        - from: macro-tailwinds
          to: valuation-judgment
          label: 提供宏观支撑，但不足以单独锚定估值
        - from: technology-position
          to: valuation-judgment
          label: 相对零收入可比公司获得溢价的核心理由
        - from: capital-structure
          to: valuation-judgment
          label: 若 EXIM 转化，可提高资本充足性；仍有条件
        - from: commercial-evidence
          to: valuation-judgment
          label: 没有经审计锚点，信心被压到低
        - from: comparable-risk
          to: recommendation-output
          label: 考虑 Northvolt 先例，最高推荐只能到观察
        - from: execution-risk
          to: recommendation-output
          label: 把风险评级抬到高
        - from: valuation-judgment
          to: recommendation-output
          label: 估值偏高挡住买入；证据又不足以支持回避
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV011
      - CV013
      - CV021
      - CV025
      - CV033
      - CV036
