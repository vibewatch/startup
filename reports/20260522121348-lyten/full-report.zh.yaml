      - number: '7.5'
        title: 资本强度与融资风险
        blocks:
          - type: paragraph
            body: >
              Lyten 目前承担与预商业状态和多洲制造野心相匹配的重大财务风险。公司披露累计股权投资超过 $625 million（截至 2025 年 7 月），但从未公布收入、毛利率、烧钱速度或现金跑道。Northvolt
              Sweden 收购（承接资产价值约 $5 billion）通过股权和资产交易安排， 而不是全现金支付；但把陷入困境的 NMC 设施改成 Li-S
              生产，需要在设备改造、电解液处理基础设施和工艺认证上投入大量资本开支。 Lyten CBO Keith Norman 在 2026 年 3 月采访中确认，公司把收入再投资、欧盟补助和私募股权作为近期主要资本来源，
              但把融资策略描述为仍在推进（「我们有多种可用融资杠杆」）。 EXIM LOI 转换风险是最大单一资本不确定性：$650 million 条件性出口信贷如果无法落地，至少需要部分用更稀释的股权或政府补助替代，
              也很可能迫使 CARICOM BESS 项目缩小。Northvolt 自身曾募集超过 $15 billion 股权和补助，却每月烧掉约 $100 million，并在 $5.8 billion
              债务下倒下；这个类比不完美，但非常醒目。Lyten 明确把收购策略描述为提升资本效率的手段， 但每次收购都会带来遗留负债、员工义务和整合成本。另一个风险是，Lyten 现有投资者——Prime Movers
              Lab、Luxembourg Future Fund（EIF）、Stellantis、FedEx、Honeywell 和 Walbridge——集中在相对少数资本提供方手中；任何一家拒绝参与未来轮次，
              都可能在这个过桥融资难拿的资本密集型领域造成资金缺口。波兰设施和 Voltpack 产品最接近产生现金流，但欧洲市场竞争激烈， 与基于 LFP 的中国产品竞争，NMC BESS 毛利受压。
