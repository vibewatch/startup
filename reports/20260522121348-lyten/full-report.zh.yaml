      - number: '6.2'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              质量最高的客户证据来自 Stellantis 关系和 AEVEX Aerospace 合作。Stellantis CEO Carlos Tavares 在 2023 年 5 月 JDA 公告中公开称 Lyten
              平台是「电气化未来的一项关键投资」；Stellantis 自有媒体网站也在 Chrysler Halcyon Concept EV（2024 年 2 月）中展示 Lyten 的 LiS
              电芯——这是来自客户侧的技术承诺展示。2024 年 8 月，Lyten 与 AEVEX Aerospace 发布联合新闻稿，称 AEVEX「计划展示、制造并交付」由 Lyten LiS 电池供电的
              UAV，并承诺首批交付目标为 2024 年底；AEVEX 确认该合作服务于 NDAA 下的美国 DoD 需求。Defense Innovation Unit 于 2024 年 9 月选择 Lyten 进行 ISS
              锂硫电池演示，构成政府采购记录——对硬件供应商而言，这是可信度最高的客户证据。Titan Dynamics 在 CA Palos Verdes 用 Lyten 供电的 3D 打印 UAV 完成 3+ 小时、86
              mph 示范飞行，验证了真实飞行表现，但未披露商业供货合同。BESS 方面，Keith Norman（首席商务官）在 2026 年 Renewables Now 采访中确认 Voltpack VMS
              正从波兰出货；electrive 报道，截至 2025 年中，欧洲商业安装已在推进。反向信号：Reuters 2025 年 8 月报道称，一家具名欧洲车企的电池科学家表示，其公司「约六个月前退出了与 Lyten
              的合作，因为这家美国公司还只是在研发规模生产」——至少一个客户评估没有推进到合作阶段。
