      - number: '6.4'
        title: 留存、持久性与证据缺口
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Lyten 没有披露任何细分市场的净收入留存（NRR）、总收入留存（GRR）、客户流失、满意度评分或复购数据。最接近留存持久性的代理指标来自 BESS 细分市场：Lyten 的
              Voltpack Mobile System 被描述为「第三代」产品，并且「在欧洲各地有商业安装」，这意味着继承自 Northvolt VMS 线的客户基础至少延续过三代产品。Keith Norman 表示
              Lyten 预计「来自既有和新客户的强劲需求」，且前 Northvolt OEM 客户「已经了解这些电芯」，可降低重新认证摩擦。不过，2026 年 2 月 Northvolt 收购在法律上使大多数旧
              Northvolt 供货合同失效，意味着 Lyten 必须从零重新谈判每个客户关系。在防务和 UAV 细分市场，AEVEX Aerospace 承诺在 2024 年底前交付搭载 Lyten 电芯的
              UAV，但后续公开来源中没有完成交付确认。DIU ISS 合同是一项单次政府演示授标，没有披露后续订单。汽车方面，Stellantis JDA 仍有效，但 B-sample
              交付和量产意向均未公开宣布；据报道，一家未具名欧洲车企因量产规模限制退出评估流程。核心证据缺口是，所有细分市场都缺少任何量化留存指标——整个客户互动图景靠里程碑而非指标支撑，这对一家收入前或早期收入硬件初创公司可以理解，但限制了投资级持久性评估。
