      - number: '5.4'
        title: 部署与应用准备度
        blocks:
          - type: paragraph
            body: >
              防务和 UAV / 无人机是 Lyten 商业部署最靠前的场景。Lyten 于 2025 年 5 月宣布专门的无人机推进计划，把加州制造产能投入 UAV、防务和卫星领域，并开始接受订单。首次示范飞行中，一架
              Titan Dynamics 8.5-ft 翼展 UAV 由 Lyten 电池供电，以最高 86 mph 飞行超过三小时；下一代电池目标是在同一平台实现 8 小时飞行。Lyten 电池符合
              NDAA（不含中国来源关键矿物），这是美国国防部采购的重要资格。Defense Innovation Unit 与 Lyten
              保持面向生产的持续关系。该细分市场能拿到溢价，认证周期最短，因此是近期收入路径中确定性最高的一条。

              航天和 ISS 是醒目的验证信号。2024 年 9 月，Lyten 宣布其 LiS 电芯获 DIU 资助选中，将作为 2025
              年任务的一部分在国际空间站（ISS）上演示。三种电芯格式（软包和两种圆柱尺寸）将在发射、轨道和回收条件下测试；Spacebilt/Skycorp 担任集成合作伙伴，项目由 ISS National Lab
              赞助，并通过 NASA 资助的商业补给任务执行。Lyten Senior Fellow Ratnakumar Bugga 拥有 34 年航天电池 R&D 经验（包括此前在 NASA 从事该技术），他指出 Li-S
              最初正是 NASA 为把舱外活动时间从 4–5 小时延长到 8 小时而开发。ISS 演示若成功，将打开一系列卫星、航天服和 EVA 应用；在这些场景里，减重会直接转化为成本和任务时长收益。据报道，卫星应用的部分
              DoD 循环（循环深度受控）可超过 3,000 次。

              BESS 和电网储能是 Lyten 商业成熟度最高的细分市场。Voltpack Mobile System 已经到第三代，并在欧洲有商业安装，目前正从 Gdańsk 出货。该细分市场贴近 Lyten 核心 LiS
              技术，并在 LiS 电芯成熟前提供收入。价值主张集中在模块化（每单元 281–1,405 kWh）、移动性、NDAA 合规、欧盟本地制造，以及 AI 数据中心集成。

              汽车 EV 是长期大奖，但也是近期应用中技术距离最远的一项。Lyten 于 2024 年 5 月向 Stellantis 交付 A-sample，并把 LiS 电池设计整合进 Chrysler Halcyon
              800V 概念车。但截至 2025 年 8 月，欧洲车企明确暂不作具约束力的供货承诺，理由是循环寿命缺口未解。行业观察者和分析师认为，EV 级 LiS 商业化最早也要到 2028 年之后。San Jose
              试点线预计在 2025–2026 年向 OEM 交付 B-sample。

              复合材料、传感器和工业应用构成早期商业层。Honeywell（投资方和战略伙伴）已表达对传感器应用的兴趣。FedEx
              探索过物流链集成。这些细分市场不如电池制造吃资本，也能提供近期收入多元化，但缺少重大合同收入的公开证据。
