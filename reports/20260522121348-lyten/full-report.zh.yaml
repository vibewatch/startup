  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Lyten 是典型深科技投资悖论：技术叙事很有吸引力，融资阵容也漂亮，但经审计的商业证据几乎为空。乐观情景靠三根柱子支撑。 第一，Lyten
              的三维（3D）石墨烯平台可能带来独特材料优势，让锂硫（Li-S）电芯在电芯层面 达到约 560 Wh/kg——大约是最优锂离子电芯能量密度的两倍——从而打开现有化学体系难以经济服务的无人机、 EV
              和太空市场。第二，$650M Export-Import Bank 意向书（LOI）如果转成承诺融资，将成为迄今披露的美国政府支持本土电池制造最大支持包， 大幅降低扩产计划的资本充足风险。第三，Lyten
              以重置成本的一小部分买下陷入困境的 Northvolt Sweden 和 Poland 电池资产， 再叠加与 Stellantis、FedEx 和 Honeywell 已建立的战略关系，提供了一条通向 GWh
              级商业化的可信路径。

              与这些正面因素相对，反向逻辑同样有力。Lyten 没有披露任何财年的经审计财务报表，收入、烧钱速度、毛利率或资本充足性都无法独立验证。 估计 $1.3–1.5B
              估值意味着投资者已经为大量未来商业化定价，但公司尚未披露有约束力的汽车供货合同。Northvolt 先例——2024 年 11 月 Chapter 11 前募集
              $15B+——说明电池制造资本本身不能保证商业可行。最佳公开可比公司 QuantumScape 只有 $19.5M 首批账单和 $421M 年度亏损，仍以 $5.10B
              交易，显示预收入电池公司面临极端重估风险。Lyten 的主要投资者兼客户 Stellantis 2024 年 12 月同时与竞争性 Li-S 创业公司 Zeta Energy
              签署联合开发协议，信号更像对冲，而不是独家承诺。
