          description: 有约束力的供应协议；Lyten 在 San Jose / San Leandro / Gdańsk 分配产能
        - id: deployment
          label: 现场部署
          description: 电芯集成进 UAV 电池包、卫星、BESS 或 EV；BESS 由 LytenCloud 监测
        - id: monitoring
