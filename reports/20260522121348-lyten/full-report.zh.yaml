      - number: '7.6'
        title: 执行与人员风险
        blocks:
          - type: paragraph
            body: >
              2025–2026 年收购计划之后，Lyten 领导层被大幅重组，地理上也更分散。CEO Dan Cook（联合创始人）和首席电池技术官 Celina Mikolajczak
              领导硅谷核心团队，但三位新高管——Matthias Arleth（CEO Lyten Sweden）、Robert Chryc-Gawrychowski（CEO Lyten Poland）和 Sami
              Haikala（CEO Northvolt Labs, Västerås）——都通过 Northvolt 交易加入，此前没有在 Lyten 文化或技术栈里共事的历史。Dan Cook
              的关键人物风险很高：几乎所有重大公司披露都会点名他，他是主要技术和战略架构师；一旦离开，很可能影响投资者信心和客户关系。 2026 年 2 月收购 Northvolt 资产——增加约 16 GWh
              闲置欧洲制造产能、数百名前 Northvolt 员工和三处不同设施—— 是预商业电池创业公司尝试过的最激进运营整合之一。Lyten 计划 12 个月内再招聘 600+ 名欧洲员工，这会带来人员扩张速度风险：
              Northvolt 自身就因快速招聘跑在培训和管理系统前面，遭遇过安全事故和质量失败。欧洲设施适用不同劳动法（瑞典、波兰和德国），
              还有工会代表和职工委员会要求，一家总部在加州的创业公司未必能顺利应对。文化和运营对齐风险真实存在：Lyten 的 硅谷工程文化与 Northvolt 的欧洲工业模式差异很大，双方也缺少共同技术基础（NMC
              化学体系 vs. Li-S 化学体系）， 意味着没有统一生产手册。除非 Lyten 走向公开市场，否则面向欧洲高管的股权留才激励在本地市场未必有竞争力，而公司尚未宣布这一步。 Northvolt 前高管、现任
              European Battery Alliance 负责人 Emma Nehrenheim 公开表示，跨过亏损生产的「死亡谷」需要超过五年和政府补贴——
              这条时间线会让看不到近期上行空间的欧洲人才，对创业公司股权结构产生留任风险。
