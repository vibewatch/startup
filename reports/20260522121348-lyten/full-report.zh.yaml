      - number: '3.5'
        title: 护城河耐久性、切换成本与反向证据
        blocks:
          - type: paragraph
            body: >
              Lyten 的主要护城河主张建立在三根支柱上：自研 3D graphene 合成支撑独特硫正极载体、美国本土供应链契合 FEOC / NDAA 要求，以及在国防和 UAV
              细分市场率先早期采用。每根支柱都有耐久性风险。

              知识产权层面：Zeta Energy 独立开发的硫化碳正极和 CNT 负极路线表明，不复制 Lyten 具体 3D graphene 工艺，也可能达到可比性能（450 Wh/kg、2,000
              次循环）。Theion 的晶态硫正极和 Sion Power 的 Licerion® 锂金属负极代表了更多独立技术路径。多条 Li-S 架构收敛存在，降低了 Lyten
              知识产权“唯一解”的排他性，但并未消除它；专利数量（Sion Power：430+，Zeta：60+，Lyten 自身组合未在公开文件披露）显示这是拥挤的知识产权版图。

              供应链层面：Lyten 关于 NDAA 合规、美国本土采购的主张，相比中国供应商确实有差异，但 Zeta Energy 也做同样声明，Sion Power 的 Tucson
              工厂同样位于美国本土。美国供应优势是美国下一代玩家的入场券，不是这个群体内部的差异化。

              切换成本层面：国防和航空航天买家认证周期很长（新电芯化学体系 DoD 认证可能需要 2–5 年），会为任何率先通过认证的供应商创造临时锁定，Lyten 也包括在内。但如果 Sion Power 在同一场景中先于
              Lyten 规模化前通过 Licerion® 电芯认证，优势就会转到 Sion。EV OEM 场景下，车企结构性多线下注：Stellantis 同时与 Lyten（投资，2023 年）和 Zeta
              Energy（JDA，2024 年 12 月）有合作，说明汽车买家不会给任何单一下一代化学体系伙伴独家地位。

              反向证据：LG Energy Solution 自身分析师预计，Li-S 电池不太可能在 2030 年前进入大众汽车市场，而且基础技术挑战（多硫化物穿梭、体积变化、负极枝晶形成、低温性能）在整个 Li-S
              品类仍未完全解决。nature.com 的基准研究确认，2025 年实用 Li-S 电芯在中等条件下循环稳定性超过 400–600 次，仍低于锂离子 1,000–5,000 次商业标准。Theion CEO
              承认，完整商业软包电芯准备就绪前“仍有路要走”。Lyten 自己在 Nevada 州 Reno 的超级工厂计划于 2025 年失败，也引发外界对规模化制造执行风险的质疑。
