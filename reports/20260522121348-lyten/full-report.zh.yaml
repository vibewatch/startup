      - number: '1.6'
        title: 展项
        blocks:
          - type: callout
            title: 自研知识产权护城河与垂直整合超材料平台
            body: >
              Lyten 已拥有 541 项已授权及申请中专利，围绕 3D graphene 合成、电池电芯架构和超材料多应用搭起了相当厚的知识产权组合。其在电池、复合材料和传感器上的宽度形成防御性护城河，也让 Lyten
              有机会在自有产品线之外，成为潜在授权方或平台供应商。平台可调性能服务 Li-S 电池、BESS、复合材料、传感器、混凝土外加剂和 3D 打印材料，降低单一产品集中风险。
            calloutType: strength
            claimRefs:
              - CO011
              - CO029
              - CO044
          - type: callout
            title: Li-S 商业化时间不确定与美国超级工厂逆转
            body: >
              独立分析师在 2025 年 8 月指出，Li-S 电池的商业 EV 部署仍不确定，时间可能继续后移。Lyten 的主要汽车合作伙伴 Stellantis 同时投资了竞争对手 Li-S 创业公司 Zeta
              Energy，说明它是在对冲，而非独家押注。Reno 超级工厂计划在 2026 年初终止——此前 2024 年 10 月曾高调宣布投资超过 $1B——这让外界质疑 Lyten 的执行纪律、美国制造雄心，以及
              Northvolt 收购转向究竟是真正强化扩产，还是只是把规模化挑战往后推。
            calloutType: risk
            claimRefs:
              - CO022
              - CO023
              - CO034
              - CO040
          - type: callout
            title: Northvolt 收购是资本效率更高的制造扩产打法
            body: >
              Lyten 没有新建全新超级工厂（现已放弃的 Nevada 项目估计需 $1B+），而是以管理层所称的较低成本，收购了陷入困境但仍可运转的 Northvolt 瑞典和波兰资产。瑞典基地带来 16 GWh
              现有产能、160+ 公顷土地和欧洲最大电池研发中心——为 Northvolt Labs 的 Li-S 扩产提供即时制造基础设施和技术人才。与 EdgeConneX 的共址数据中心交易（最高 1
              GW）把多余土地和电力基础设施变现，可能为电池业务供血。如果执行风险受控，这是一条资本效率较高的 GWh 级路径；如果失控，Lyten 就会继承 Northvolt 的运营和劳工难题。
