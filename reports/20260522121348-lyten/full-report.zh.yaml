      - number: '2.4'
        title: 市场增长驱动因素
        blocks:
          - type: paragraph
            body: >
              五个结构性力量正在扩大 Lyten 可进入的电池市场。

              交通电动化：2025 年，全球 EV 销量超过新车销量的 25%，预计到 2030 年达到 40%（IEA Stated Policies Scenario）。这把整体电池需求推高到 2030 年超过 3
              TWh，给 Lyten 的高能量密度电芯提供不断扩大的设计导入需求池。

              BESS 容量建设：2025 年，电池储能需求增长 51% 至 315 GWh，2026 年预测超过 450 GWh。IEA Net Zero Emissions 情景要求全球储能到 2030 年增长六倍至
              1,500 GW。即便只拿到高性能溢价型 BESS 应用的边际份额，也可能对 Lyten 的 Voltpack 产品线有实质意义。

              国防无人机现代化：2024 年，全球 UAV 电池需求随 DoD $2.6 B 无人机技术投资增长而扩大。Li-S 电池的重量优势，对续航高度决定任务成败的 MALE / HALE 平台尤其有用。

              供应链去风险：中国控制全球锂离子供应链的 70–90%。2026 年起生效的美国 FEOC 规则，迫使买家从非 FEOC 供应商采购，否则失去 IRA 抵免资格。Lyten
              已在美国本土生产电池级锂金属，并收购欧洲制造资产，使其成为中国 LFP 之外的 FEOC 合规替代方案——这是采购端的结构性顺风。

              AI 和数据中心负载增长：邻近数据中心的电池储能 2025 年增长 30%，UPS 级装机达到 45 GW，补充电网级 BESS。尽管 LFP 目前主导该场景，市场对高能量密度、不可燃替代方案的需求压力正在上升。
