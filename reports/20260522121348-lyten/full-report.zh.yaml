      - number: '5.6'
        title: 安全、质量与合规
        blocks:
          - type: paragraph
            body: >
              Lyten 的 LiS 电芯在初步测试中展现出出人意料的强滥用耐受性；相较存在已知热失控风险的锂离子化学体系，这是有意义的差异点。多层软包和 18650
              圆柱电芯的滥用测试——包括针刺（模拟内短路）、外短路、过充、过放和机械挤压——没有产生火焰、烟雾、炭化、破裂或热失控，温升也很小。机理被归因于故障点局部形成的非导电反应产物（Li₂S₂ 和
              Li₂S），它们会对短路形成电绝缘；同时，硫正极在过充时不析氧，移除了 NMC 和 NCA 化学体系中的一条关键放热路径。这一行为与 OXIS Energy Li-S 电芯已发表第三方研究一致。

              监管合规姿态：《国防授权法》（NDAA）合规已确认。Lyten 电芯不含钴、镍、锰或石墨，避开了由中国主导的关键矿物供应链；正是这条供应链让多数锂离子电芯无法进入 DoD 采购。Lyten
              面向防务的产品传播中明确强调这一点，也是面向 UAV 和卫星客户的核心卖点。

              《通胀削减法案》（IRA）合规已在本土制造抵免路径上确认。Lyten 的 LiS 电芯在加州制造，使用美国境内采购材料，不受中国进口电动汽车、电池和关键矿物关税影响。2024 年 9 月 ISS
              公告明确提出了这项 IRA 资格主张。

              航天认证：ISS 演示项目专门设计来产出三种格式的飞行认证、航天兼容电芯。ISS 集成要求符合 NASA 安全和可靠性标准。Lyten 声称的目标是在 ISS 演示任务完成后取得完整飞行认证。

              汽车认证：Lyten 商用格式 LiS 电芯尚未公开确认任何汽车标准安全认证（UN 38.3 运输、ISO 26262 功能安全、IATF 16949 质量）。OEM
              认证需要大量电芯级和电池包级测试，目前仍在进行。这是汽车收入路径上的已知缺口。

              规模化质量和制造控制没有公开披露。Lyten 没有发布良率数据、缺陷率或工艺能力指标。San Jose 试点规模运营使用适配 LiS 化学体系的标准锂离子兼容设备；相比从零开始的新工艺，这降低了工艺工程风险，但
              LiS 电芯在商业产量下的制造良率仍未验证。
