      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Lyten 的公开可比公司并不完美，因为没有任何纯 Li-S 电池公司在主要交易所上市。QuantumScape（NASDAQ:QS） 是结构上最接近的类比：一家预商业下一代电池公司，已有成熟公开市场价格。截至
              2026 年 5 月 22 日，QuantumScape 市值约 $5.10B，而 FY2025 首批账单只有 $19.5M，反映 Toyota 合作关系和固态平台叙事驱动的极端技术溢价。
              QuantumScape FY2025 10-K（SEC EDGAR）披露净亏损 $421M、经营亏损 $458M，$835M 净现金按当前烧钱速度约提供两年跑道。 SES AI（NASDAQ:SES）和
              Solid Power（NASDAQ:SLDP）是商业阶段更早的额外公开类比；两者市值均低于 $1B， 且较 SPAC 高点大幅下跌，说明公开市场会随着时间重新定价预收入电池创业公司。

              私募市场可比公司稀少，阶段也更早。Theion（Berlin, Germany）是另一家资料较完整的纯 Li-S 创业公司， 但 Series A 只募集 €16M。锂水电池开发商 PolyPlus
              Battery 2023 年被 Panasonic 收购，价格未披露。 最重要的反向可比 Northvolt 在 2024 年 11 月申请 Chapter 11 前募集
              $15B+；其股权投资者几乎全损。ForgeGlobal 将 Lyten 列为 pre-IPO 观察名单条目，没有活跃二级市场交易。NewMarketPitch 把 Lyten 放入高潜 LDES 创业公司名单，
              但没有披露收入锚点。ChemAnalyst 将 Li-S 商业市场描述为早期商业化阶段，尚无主导玩家；FutureMarketInsights 预测 Li-S 电池市场到 2030 年仅达 $82.5M——绝对
              TAM 很小，限制近端收入逻辑的可信度。
