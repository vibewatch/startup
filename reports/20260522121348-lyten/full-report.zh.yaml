companyProfile:
  summary: >-
    Lyten 由 Dan Cook（CEO）及联合创始人于 2015 年在加州 San Jose 创立；团队开发了公司自研的 Three-Dimensional Graphene
    合成工艺。该技术把温室气体（甲烷）转化为固体碳和氢气，产出 3D Graphene，并可调控其热、电和结构属性。Lyten 的主要产品线包括锂硫（Li-S）电池电芯（品牌 LytCell）、轻量化复合材料、IoT 传感器阵列和
    BESS 系统（Voltpack）。2023 年 9 月，公司完成 $200M Series B，由 Prime Movers Lab 领投，Stellantis、FedEx、Honeywell 和 Walbridge
    共同投资；2025 年 7 月，公司又完成第二笔 $200M 融资，累计股权融资达到 $625M。2026 年 2 月，Lyten 收购前 Northvolt 资产——瑞典 Skellefteå 的 Northvolt Ett
    超级工厂和波兰 Gdańsk 的 BESS 工厂——为大规模 Li-S 电芯和 BESS 生产铺路。截至 2026 年 5 月，公司在 San Jose 总部约有 315 名员工，瑞典和波兰收购还带来额外员工。BESS
    和国防渠道预计会贡献收入，但公司尚未发布经审计财务数据。
