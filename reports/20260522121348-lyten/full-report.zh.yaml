      - number: '4.4'
        title: 制造扩产、资本强度与反向证据
        blocks:
          - type: paragraph
            body: >
              Reuters 2025 年 8 月调查提供了 Lyten 财务状况上最可信的反向信号：尽管完成 Northvolt 收购，公司没有拿到 Northvolt 的 $50B 订单簿，也没有锁定具约束力的 OEM
              供货承诺。BMW、Volvo Cars、Scania 等车企要么拒绝置评，要么明确要求先看到工业规模交付证据才会接触。BMW 表示，任何 Northvolt
              后继方「只会被纳入未来电池电芯项目考虑——仍然很遥远」。一家未具名欧洲车企的电池科学家称，公司在 2025 年 8 月前约六个月已退出与 Lyten 的合作，因为
              Lyten「还只是在研发规模生产」。这些信号说明，从试点到商业规模收入的路很长，而且高度依赖客户。

              包括前 Northvolt 高管 Emma Nehrenheim 在内的行业专家警告，欧洲电池制造商要与亚洲同行竞争，必须穿过一个需要 5+ 年和政府补贴的「死亡之谷」。Northvolt 自身失败时背负 $8B
              债务，说明融资规模再高，也挡不住执行和需求侧风险。在 Northvolt 设施内从 NMC 转向 LiS，还会在正常制造爬坡之外再叠一层执行风险。生产会先从传统 NMC 化学体系开始，再转向
              LiS，但转型时间表和成本均未公开。

              Lyten 2025–2026 年烧钱速度偏高：改造大型设施、在欧洲招聘 600+ 名员工、跨两大洲做 R&D、同时管理多个场地收购，都很吃资本。公司承认还计划进一步大额融资。如果股权市场收紧，或 OEM
              客户不作承诺，Lyten 将面临与 Northvolt 倒下时相同的结构性融资依赖。收购式模型比新建绿地工厂更省资本，但没有消除根本挑战：制造良率、技术风险，以及必须拿到长期客户合同来证明持续投资合理。
