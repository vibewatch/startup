      - number: '2.2'
        title: TAM、SAM 与 SOM 测算口径
        blocks:
          - type: paragraph
            body: >
              Li-S 电池机会的市场规模，对范围定义高度敏感；公开估算相差两个数量级。The Business Research Company（TBRC）估计，实际 Li-S 电池市场 2025 年为 $0.85 B，到
              2030 年增至 $2.52 B，CAGR 为 24.1%——这是自下而上的收入口径，只统计已投产或有合同的电芯。Strategic Market Research 认为 2024 年市场为 $0.7 B，并预测
              2030 年达到 $6.5 B，CAGR 为 45.3%，隐含更陡的加速。Mordor Intelligence 报告 2025 年市场为 $271 B，2030 年预计达到 $582 B，CAGR 为
              16.5%——该估算看起来纳入了完整下游价值链和宽泛 TAM 假设，而不是当前电芯收入，并且与较窄的收入口径数字无法调和。

              更可操作的测算方式，是沿用 Lyten 的四个终端应用场景。全球无人机电池市场 2025 年为 $7.31 B，预计 2026 年以 20.8% CAGR 增至 $8.84 B；UAV 子市场（偏国防）2024
              年为 $1.77 B。全球航天电池市场 2026 年为 $4.68 B，到 2033 年增至 $7.76 B。全球固定式 BESS 市场 2025 年新增 315 GWh（增长 51%），预计 2026
              年新增超过 450 GWh，对应市场价值 $55–65 B。2025 年，汽车 EV 电池市场按所有锂离子化学体系计算超过 $150 B。Lyten
              的可服务市场局限在这四个场景中高性能、重量敏感的细分市场；在主流 EV 采用之前，Li-S 能量密度需要支撑溢价。Lyten 2026
              年的可获取市场（SOM）仍处于商业化前，基本限于付费客户样品、概念验证项目和早期国防合同。
