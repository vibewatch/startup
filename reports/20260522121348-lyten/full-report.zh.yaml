      - number: '5.2'
        title: 产品线图谱
        blocks:
          - type: paragraph
            body: >
              Lyten 正在商业化五条不同产品线，全部源自 3D Graphene 平台：

              锂硫电芯是旗舰产品，提供多层软包（6.5 Ah A-sample、10 Ah 试点线格式）和圆柱（18650、2170、26650）格式。电芯不含钴、镍、锰或石墨，因此符合
              NDAA，并在当前美中贸易政策下免关税。首批 A-sample 已于 2024 年 5 月商业交付给 Stellantis 和其他 OEM。电芯在加州 San Jose 制造，San Leandro
              正在扩产，未来会转移到 Västerås 的 Northvolt Labs，推进吉瓦级 LiS 工业化。

              Voltpack Mobile System（VMS）是 Lyten 的 BESS 产品线，来自 2024 年 10 月 Northvolt Gdańsk 交易，并被纳入 2025 年 7 月 Northvolt
              资产组合收购。VMS 已到第三代，在欧洲有商业安装。每个 Voltpack 模块可从 281 kWh 扩展到 1,405 kWh，最多五个 Voltpack
              可通过中央枢纽并联，形成更大系统容量。该枢纽集成逆变器和辅助系统，支持孤岛模式、削峰、微电网、电网套利和移动电源应用，并通过 LytenCloud 提供云连接。Gdańsk 工厂拥有 6 GWh 年 BESS
              制造产能。当前一代 VMS 模块使用锂离子化学体系；产品路线图是在技术成熟后转向 LiS 驱动的 BESS。

              轻量复合材料把 3D Graphene 作为聚合物基体中的添加剂，在保持结构强度和抗冲击强度的同时，最高可减重
              50%。这些材料面向交通、航空航天和建筑应用，目前处于早期商业阶段，客户来自汽车和工业渠道。Lyten 还销售使用 3D Graphene 的混凝土外加剂产品和 3D 打印线材。

              IoT 传感器阵列利用 3D Graphene
              可调电学特性，构建下一代化学和环境传感器，显著提高检测灵敏度和选择性。当前应用覆盖甲烷检测、结构健康监测、汽车气体传感、工业监控和供应链追踪。商业阶段仍早，合作方包括
              Honeywell（投资方，且对战略传感应用感兴趣）。

              传统 NMC 锂离子电芯将在 Northvolt Ett Skellefteå 设施生产，作为近期过渡产品，支撑现有 Northvolt 客户承诺（包括 Scania 和 Porsche 718
              后继车型），并在设施转向 LiS 化学体系期间产生收入。来自瑞典的商用 NMC 电芯销售目标是 2026 年 H2。
