      - number: '6.3'
        title: 采用轨迹与管线成熟度
        blocks:
          - type: paragraph
            body: >
              Lyten 的商业轨迹并非线性：BESS 已进入有限商业生产，而 LiS 电池细分市场仍在评估或认证阶段。主要采用里程碑包括 2023 年 5 月（Stellantis JDA）、2024 年 2
              月（Chrysler Halcyon Concept 发布）、2024 年 5 月（向 20+ 个目标交付 A-sample）、2024 年 8 月（AEVEX 合作）、2024 年 9 月（DIU ISS
              合同）、2024 年 12 月（面向 CARICOM 的 EXIM LOI）、2025 年 5 月（无人机推进计划，开始接受订单）、2025 年 Q4（BESS Voltpack 从波兰出货），以及 2026 年
              H2（目标从瑞典销售 NMC 电芯）。Northvolt 收购（2026 年 2 月完成）加入了商业成熟度最高的客户基础——现有欧洲 BESS 客户，它们接收 Voltpack NMC 电芯，也可能未来升级到
              LiS BESS。首席商务官 Keith Norman 阐述的 Lyten「收入优先」策略，明确把 BESS 和防务收入排在汽车之前，以避免重演 Northvolt 在盈利前致命依赖单一大型 OEM
              客户的路径。任何细分市场都没有公开收入、出货量或订单簿规模。管线漏斗从 20+ 个评估目标快速收窄到少数具名合作方，又进一步收窄到两条商业阶段产品线（防务 / 无人机和 BESS / 电网）。汽车 OEM
              量产供货仍是中长期前景，取决于 B-sample 交付、量产规模循环寿命验证，以及尚未运行的吉瓦级 LiS 制造产能。
