      - number: '1.2'
        title: 创立、管理层与治理
        blocks:
          - type: paragraph
            body: >
              Lyten 于 2015 年在加州 San Jose 创立。联合创始人兼 CEO Dan Cook 自公司成立起担任总裁和首席执行官，也是新闻稿和投资人沟通中最常出现的主要发言人。Cook
              的经历横跨先进材料和清洁技术商业化；他共同发明了与 3D graphene 合成工艺有关的关键知识产权，并且是 2023 年以来每一次重大融资公告中被点名的管理层。

              Celina Mikolajczak 担任首席电池技术官（CBTO），带来深厚的电池化学和制造经验。加入 Lyten 前，Mikolajczak 曾在 Panasonic 和 Tesla
              电池部门担任高管，她负责锂硫电芯项目的技术路线图。Keith Norman 担任首席营销官（CMO），此前是首席可持续发展官，曾回应媒体询问并公开阐述 Lyten 的供应链和可持续性主张。Ratnakumar
              Bugga 以资深研究员身份加入，拥有 34 年航天电池研发经验，直接支持 ISS 演示项目。

              2025 年 9 月，在宣布收购 Northvolt 欧洲资产后，Lyten 任命 Matthias Arleth 为 Lyten Sweden CEO，向 Dan Cook 汇报。Arleth
              在汽车、能源和电子行业拥有超过 25 年国际领导经验；一年前他加入 Northvolt，担任 电芯业务总裁和 COO。Robert Chryc-Gawrychowski 被任命为 Lyten Poland
              CEO，Sami Haikala 继续担任 Västerås 的 Northvolt Labs CEO。Dennis van Schie 加入后担任 Lyten Sweden 首席供应链官。

              Lyten 尚未公开完整董事会构成或治理结构。公开信息显示 Zia Huque（Prime Movers Lab 普通合伙人）持有投资方席位。Dan Cook
              同时主导技术愿景和投资人关系，关键人依赖看起来较为实质。
