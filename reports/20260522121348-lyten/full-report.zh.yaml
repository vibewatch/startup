      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: Northvolt 先例：募集 $15B+，申请 Chapter 11
            body: >
              对任何大规模电池创业公司投资来说，Northvolt 都是最重要的反向可比。这家瑞典公司从 Goldman Sachs Asset Management、BlackRock、Volkswagen 和
              European Investment Bank 等世界级投资者手中募集超过 $15B 股权和债务。 尽管拥有这套资本基础和可观 NMC 产能，Northvolt 仍在 2024 年 11 月申请 Chapter
              11 破产保护。股权投资者几乎全损。 倒下的原因包括制造执行失败、汽车 OEM 合同客户集中且无法在成本压力下重新谈判，以及资本需求远超初始模型。Lyten 以困境价格收购 Northvolt Sweden 和
              Poland 资产，拿掉了最明显的资产减值风险——但并不能隔绝同一组底层动力：尚未验证的规模化制造、 资本密集型化学体系转换，以及可以推迟或终止合同的 OEM 客户。任何 Lyten 估值分析如果不纳入
              Northvolt 先例，都是不完整的。
            calloutType: risk
            claimRefs:
              - CV025
              - CV026
              - CV027
          - type: callout
            title: EXIM LOI 作为二元期权：转换是最大单一价值催化剂
            body: >
              Export-Import Bank 的 $650M 意向书，最好理解为 Lyten 资本结构上的二元期权。如果转成正式初步承诺， 并最终进入承诺信贷，它将以政府背书利率增加 $650M 债务容量，基本把
              Lyten 的有效资本基础从 $625M 股权翻倍至约 $1.275B。这会彻底改变扩产计划，让 Lyten Sweden 重启和宾夕法尼亚州锂金属箔扩产不必依赖稀释性股权轮。 但 LOI
              的设计本来就不具约束力；EXIM Make More in America 清单确认 LOI 仍活跃，却未显示初步承诺。EXIM 转换需要国内含量认证、 环境审查，最关键的是 Lyten
              出口客户提供有约束力外国买家合同。这些条件都没有公开确认。跟踪 EXIM 已批准交易 页面是否出现 Lyten 初步承诺条目，是追踪这条投资逻辑的投资者最应该关注的单一高信号动作。
            calloutType: insight
            claimRefs:
