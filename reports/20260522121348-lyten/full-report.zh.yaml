      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Lyten 的商业和财务位置高度集中在少数战略关系上，每一条都可能错位。Stellantis 同时是战略投资者（披露持股、价值未披露）、 联合开发协议合作方和 A-sample 评估客户；2024 年 12
              月，它又与 Lyten 最接近的美国 Li-S 竞争对手 Zeta Energy 签署并行 JDA，开发 EV 电池。这种多供应商对冲策略说明 Stellantis 并未独家押注 Lyten
              的化学体系，也带来关系长期停留在评估阶段的真实风险。FedEx 和 Honeywell 是股权投资者（Series B，2023 年 9 月），
              没有公开披露的采购协议；把它们写进商业叙事，会混淆投资者和客户角色。AEVEX Aerospace 合作关系——Lyten 唯一公开点名的防务无人机客户—— 意向是用 Lyten
              电芯「展示、制造并交付」UAV，但截至 2026 年 5 月，公开来源均未确认已完成首批交付。太空渠道方面， DIU ISS 示范是单个政府资助合同，没有披露量产后续。融资侧，美国 EXIM Bank
              是最大单一潜在融资来源（$650 million LOI），但不具约束力且受政治风险影响——EXIM 的授权和优先级随政府更迭变化；如果美国工业政策重点转向，该 LOI 与 「Make More in
              America」倡议的契合也可能被重新评估。Lyten 正积极争取欧盟电池制造补助（公司称正在「瞄准欧盟电池助推补助」）， 但欧盟国家援助规则会施加共同投资和合规要求，可能限制 Lyten 灵活性。供应链依赖包括
              California Sulphur Company 和 Port of Stockton 工业硫供应商（均为单一来源）、Creative Engineers Inc.（New Freedom,
              PA）锂金属合金加工，以及一家未披露的美国东部锂原料供应商。任何一个国内供应节点中断，都可能让美国 Li-S 电芯生产停摆。
