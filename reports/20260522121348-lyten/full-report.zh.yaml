      - number: '1.3'
        title: 核心技术平台
        blocks:
          - type: paragraph
            body: >
              Lyten 的底层技术是 Lyten 3D Graphene™，一种具备三维结构的自研石墨烯形态，而不是传统二维单层。合成过程把烃类气体（主要是甲烷）送入微波等离子体反应器，分解分子并把碳沉积成固体 3D
              graphene 结构，同时释放氢气，用于捕获为清洁燃料。公司称，在投资人披露支持下，该工艺已被独立验证为规模化碳中性。

              不同于扁平的二维石墨烯，Lyten 3D Graphene 可以调节：工程师通过调整合成参数和后处理，改变孔隙率、导电性、结构刚度和化学亲和力。正是这种可调性，让同一平台可以服务电池正极、结构复合材料和传感膜。

              在锂硫电池中，3D Graphene 的关键作用是作为多孔支架，把硫原子固定在正极中，阻止历史上限制 Li-S
              循环寿命的多硫化物穿梭效应。石墨烯支架具备导电性，能高效传输电荷，同时固定溶解的多硫化锂；否则这些中间体会迁移到负极并劣化电芯。Lyten 称其电芯目标是达到传统 NMC
              锂离子电池两倍以上的能量密度、重量最高降低 50%；由于该化学体系从供应链中去掉镍、钴、锰和石墨，碳足迹估计比一流锂离子电池低 60–65%。San Jose 试生产线生产软包（6.5
              Ah）和圆柱（18650、21700）两种电芯。
