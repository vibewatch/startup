        - Lyten 能否拿出具体的 NDAA 第 4891 条资格文件，或 DoD 合同里点名 Lyten 供应链合规的措辞？
      - - 相对 Li-S 同行的循环寿命领先
        - Zeta 声称 2,000 次循环（Lyten 研发阶段约 500–1,000 次）；Li-ion 现有厂商在商业规模提供 2,000–5,000 次循环
        - 高
        - Lyten 在商业硫载量和电芯形态下的第三方独立循环寿命数据；未找到公开披露
      - - 制造放大执行
        - Lyten 的 Reno gigafactory 计划在 2025 年崩盘；收购 Northvolt 瑞典资产带来试点产能，但未披露 GWh 级路径
