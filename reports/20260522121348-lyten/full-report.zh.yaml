      - number: '5.5'
        title: 关键依赖、路线图与反向证据
        blocks:
          - type: paragraph
            body: >
              关键供应链依赖明显低于锂离子化学体系。硫是油气炼制的工业副产品，在美国国内和全球都供应充足且成本低。Lyten 的 3D Graphene
              由甲烷（天然气）制成，天然气同样充足，并可在美国国内采购。最受约束的投入是负极用电池级锂金属。2025 年 4 月，Lyten
              宣布首次在美国生产电池级锂金属箔，使用的锂合金和锂金属全部来自美国境内，从而降低进口依赖和 FEOC 暴露。其他投入——电解液溶剂、盐、隔膜材料和标准电芯组装硬件——要么可在美国国内获得，要么可从非受限地区采购。

              技术依赖包括自研专利微波等离子反应器系统，并由 Lyten 541+ 项专利组合保护；专利覆盖 3D
              石墨烯合成（US11309545B2）、耐膨胀正极结构（US11335911B2），以及近期厚正极混合电解液架构（WO2025085743A1）。DoE 在 2024 年 1 月授予 $4M 拨款，验证了
              Lyten LiS 技术的商业潜力。

              技术路线图有四个已记录阶段：(1) 2023 年试点线投产并供应 A-sample（防务 / 航空航天小批量）；(2) 2024–2025 年在 San Leandro 扩产，服务非 EV 商业量；(3)
              2026 年 H2 从 Northvolt Sweden 销售商用 NMC，支撑 BESS 和汽车过渡客户，同时在 Västerås 继续推进 LiS 工业化；(4) 更后期进入吉瓦级 LiS
              制造阶段，时间表未定。Nevada 超级电池工厂计划（2024 年 10 月宣布）已在 2026 年初前放弃，转而依赖收购的欧洲资产。

              循环寿命的反向证据在 Lyten 自己的技术论文中记录得很清楚。商用格式电芯在 100% DoD 下 150 次循环，相比汽车 EV 对锂离子的要求（通常 1,500–2,000 次循环）大约短了
              10–13×。CleanTechnica 行业分析师（2025 年 8 月）报道，Lyten 尚未说服包括前 Northvolt 客户在内的欧洲车企作出具约束力的供货承诺。电解液 /
              硫比例挑战和锂金属负极枝晶管理仍是活跃研究问题，不是已经解决的工程问题。外部关于 Li-S
              化学体系的技术评论总体确认，在现实能量密度和贫电解液条件下实现实用循环寿命——这是具成本竞争力电芯经济性的前提——仍是全行业未解难题，并非 Lyten 独有。

              制造扩产风险重大。从 2.4 MWh/yr 试点，到 200 MWh/yr San Leandro，再到最终多 GWh LiS
              生产，需要解决良率、工艺均一性、规模化电解液管理和锂金属负极处理；这些能力都尚未在试点之外得到公开验证。Northvolt Sweden 收购提供了基础设施，但化学体系转换仍需要大量资本。
