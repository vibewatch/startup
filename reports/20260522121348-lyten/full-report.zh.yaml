  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 3D Graphene 平台与电芯架构
        blocks:
          - type: paragraph
            body: >
              Lyten 的基础技术是 Lyten 3D Graphene™，这是一种碳纳米材料，通过专利微波等离子反应器工艺把甲烷（CH₄）裂解成固体碳和氢气。不同于传统二维石墨烯，3D
              结构既有机械柔性和导电骨架，也有分级纳米 / 微米 /
              介孔结构；团队可通过调整反应器参数，在分子层面调控孔隙率、表面积、导电性和表面能，以适配特定应用。副产氢气被捕获后可作为清洁燃料使用，使合成过程实现净碳负。Lyten 位于 San Jose 的 55,000
              平方英尺制造设施专门用于 3D Graphene 生产。

              在锂硫电芯中，3D Graphene
              充当硫正极宿主。分级多孔结构通过公司所称的「nano-capture」，把硫和中间态多硫化锂物种（Li₂S₄、Li₂S₆）物理限制在正极内，从而抑制导致多硫化物穿梭效应的溶解和迁移——这是 Li-S
              化学体系历史上的主要失效模式。根据 Lyten 在 Power Sources Conference 的技术论文（2023 年 6 月），使用 Lyten 3D Graphene
              后，硫利用率比最好的商用纳米碳提高约 15%，自放电较商用类似材料降低约 30%。

              电芯开发同时处理多项互相依赖的组件：(i) 具备高面容量（mAh/cm²）和高硫载量的 3D 石墨烯硫复合正极；(ii) 通过体相和界面改性抑制枝晶生长及多硫化物诱导钝化的受保护锂金属负极；(iii) 低电解液
              / 硫（E/S）比的自研电解液配方，用于实现高比能量；(iv) 多功能隔膜；(v) 多层软包和 18650/2170/26650 圆柱格式的高能量电芯设计。截至 2023 年中期，已发表性能为：比能量
              250–275 Wh/kg；纽扣电池在 C/3 rate、100% DoD 下约 300 次循环；商用多层软包和 18650 圆柱电芯在 100% DoD 下约 150 次循环。在 50% DoD
              下，循环寿命超过 1,000 次；据报道，针对部分 DoD 使用的卫星应用可超过 3,000 次循环。

              一个关键反向观察是，纽扣电池性能与商用格式性能之间的差距仍然存在。满放电深度下，软包和圆柱电芯的循环寿命只有纽扣电池的一半，反映出实际能量密度所需的贫电解液条件更苛刻。补上这个差距是近期最重要的技术目标；Lyten
              2025 年专利 WO2025085743A1 覆盖厚正极设计和混合电解液系统的进展，正是面向这次过渡。

              正极制造工艺避开了 N-Methyl-2-pyrrolidone（NMP）这种传统锂离子正极浆料加工中的有害溶剂，改用水性粘结剂和喷雾干燥活性材料——这降低了职业健康风险，也简化了环保合规。
