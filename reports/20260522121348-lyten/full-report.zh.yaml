      - number: '7.3'
        title: 制造与运营风险
        blocks:
          - type: paragraph
            body: >
              Lyten 的制造策略由收购驱动——买入陷入困境的 Northvolt 资产，而不是从零新建工厂——降低了前期资本开支， 但也带来一组独特运营风险。Northvolt 倒下就是直接警示：Skellefteå
              超级工厂产能不到目标 10%，破产前还有 4,000 多箱设备未开封；原本按 NMC 化学体系设计的产线，现在必须改造为 Li-S 化学体系，而后者的电解液处理、 阴极涂布工艺和阳极准备步骤都不同。Lyten
              承诺在 H2 2026 从 Skellefteå（Northvolt Ett）向其 Gdańsk BESS 设施交付商业电芯——从 2026 年 2 月收购完成算起约 7
              个月，这对任何电池制造翻盘案例都很激进。Lyten 管理下的 Skellefteå 工厂尚未发布独立的生产良率、爬坡速度或质量认证数据。San Leandro 设施（2024 年 11 月从 Northvolt
              的 Cuberg 业务单元收购）已部分重启，但 Li-S 电芯产量仍停留在试点规模。波兰 Gdańsk 设施（Northvolt Dwa， 2025 年 10 月收购）商业成熟度最高——正在发货 Voltpack
              NMC BESS 产品——但它运行的是 NMC 化学体系， 任何 Li-S BESS 产品都需要转换产线。任何 Li-S 制造设施一旦发生火灾或热事件，声誉和监管后果都会被放大：拟议的 Reno 工厂曾遭
              Stead 和 Silver Knolls 居民「强烈反对」，他们把加州 Moss Landing BESS 火灾作为先例； 锂金属负极制造本身存在火灾隐患，风险高于传统
              Li-ion。制造管理团队——Matthias Arleth（瑞典）、 Robert Chryc-Gawrychowski（波兰）和 Sami Haikala（Västerås R&D）——均通过
              Northvolt 收购加入， 尚无规模化交付 Li-S 电芯生产的记录。Lyten 称计划 12 个月内在欧洲再招聘 600+ 名员工，这会引入早期制造扩产常见的人员爬坡和质量体系风险。
