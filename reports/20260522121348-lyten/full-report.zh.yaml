        - Zeta 的 CNT 负极 + 硫化碳路线无需 3D graphene，也能做到相近性能；Theion 的晶态硫又提供另一条路径
        - 高
        - Lyten 目前有多少专利可执行？与 Zeta 的 60+ 项专利相比如何？Lyten 是否委托做过 FTO (freedom-to-operate) 分析？
      - - 防务认证先发优势
        - Sion Power 在 March 2026 宣布防务专用扩产；预计 H2 2026 在同一无人机 / UAS 赛道开始首批出货
        - 高
        - Lyten 是否已与美国防务项目签下独家或优先供应商协议，足以挡住 Sion Power 认证？
      - - Stellantis 是锚定 EV OEM 伙伴
        - Stellantis 在 December 2024 与 Zeta Energy 另签 JDA，而与 Lyten 的投资关系仍停留在股权阶段
        - 高
        - Stellantis 与 Lyten 是否有任何排他安排，还是在用多化学体系组合对冲？哪个项目席位面临风险？
      - - 美国供应链 / NDAA 合规是差异化
        - Zeta Energy 和 Sion Power 也提出等同的 NDAA 对齐主张；这已是品类级入场券，不是 Lyten 在下一代 Li-S 内的独特优势
