      - number: '7.2'
        title: 监管、政策与法律风险
        blocks:
          - type: paragraph
            body: >
              Lyten 的商业模式与美国政府政策和融资工具深度绑定，每一项都带有实质条件风险。2024 年 12 月宣布的 $650 million EXIM Bank 意向书（LOI）明确不具约束力：EXIM 将 LOI
              定义为「基于初步审查，EXIM 可能考虑的融资条款指示」——不是已承诺贷款。要转成正式初步承诺，Lyten 必须满足 EXIM 信用标准（组合违约率 0.98%，意味着标准严格）、完成环境审查，并把客户 MOU
              换成有约束力合同。2026 年 1 月 Reno 超级工厂取消， 压缩了原 LOI 范围，因为两个目标美国制造基地之一已不存在；EXIM 是否会给瑞典和波兰同等条款仍不清楚。 2025 年 12 月签署的
              FY2026 NDAA 对含有受关注外国实体（FEOC）部件或材料的先进电池，分阶段限制 DoD 采购，并要求供应链追溯到采矿、精炼和分离环节。Lyten 在加州的 Li-S 生产符合
              NDAA（本土锂、美国硫）， 但瑞典和波兰制造设施把欧盟来源部件引入供应链。Lyten 尚未披露欧盟制造电芯能否作为「合格国家」来源项目 获得 NDAA 豁免——瑞典和波兰在现有 DFARS 框架下都是合格国家，
              提供了潜在安全港，但仍需要主承包商文件和 DFARS 条款纳入。IRA FEOC 合规是并行风险：到 2026 年，符合资格的清洁车辆不得含有 FEOC 开采或加工的电池关键矿物。Lyten
              的美国供应链（本土硫、宾夕法尼亚州锂合金加工、加州箔材挤压）看起来符合 IRA；但在瑞典或波兰制造、出口美国或用于美国补贴车辆的电芯，会受到更高 IRA FEOC 审查。欧盟自身 Battery
              Regulation 2023/1542 以及即将实施的碳足迹和尽职调查规则，会对欧盟制造电芯施加单独合规义务——给欧洲扩张增加成本和复杂度。 关于 IP 和专利风险：Lyten 拥有 500+
              已授权或申请中专利，在 3D 石墨烯合成和 Li-S 电芯架构上构成宽护城河， 但 Northvolt 收购把遗留 Northvolt IP 转给 Lyten，其来源和自由实施状态尚未独立验证。截至 2026 年
              5 月， 公开记录检索未发现涉及 Lyten 的未决诉讼；不过，快速资产收购叠加新型化学体系，仍可能引来第三方石墨烯或 Li-S 专利持有人的 IP 争议。
