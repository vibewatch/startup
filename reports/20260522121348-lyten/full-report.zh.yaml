  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              Lyten
              的市场由四个嵌套场域组成，每一层都有不同预算负责人和技术替代品。最内层是锂硫电池市场——尚未商业化的电芯和电池包，服务高价值细分场景，能量密度和减重足以支撑相对锂离子的溢价。第二层是更广义的先进电池市场，包括固态、钠离子、锂金属和下一代化学体系，这些技术都在争夺同样重视性能的应用。第三层覆盖终端应用市场——UAV
              / 无人机动力系统、航天与卫星电池、汽车 EV 电池和固定式 BESS——Lyten 的 Li-S 电芯在这些场景中与既有 LFP 和 NMC 电池竞争。第四层是整体储能市场，提供宏观需求信号。

              纳入范围的支出包括国防 UAV、航天器、商用无人机、汽车 EV 模组（设计导入阶段）、Voltpack 品牌下 BESS
              系统，以及先进材料授权所需的一次电池和电池包。不纳入范围的是商品化铅酸电池、消费电子锂离子电池、氢燃料电池和液流电池，Lyten 目前并未覆盖。现状替代品因场景而异：国防 UAV
              买家默认使用锂聚合物（LiPo）和高密度锂离子电池包；卫星项目依赖成熟镍氢和任务级锂离子；汽车 OEM 使用圆柱和方形 NMC 或 LFP；BESS 运营商压倒性部署 $63/kWh 招标价的 LFP。Lyten
              的任何采用故事，都取决于它能否在每类买家最看重的具体性能维度上，对既有方案打出足够优势——UAV 和 EV 看重量与续航，BESS 看成本与循环寿命，航天看辐照耐受加重量。
