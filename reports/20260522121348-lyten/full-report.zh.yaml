  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点类型
      - 论点
      - 什么会改变该观点
    rows:
      - - 投资逻辑（乐观）
        - 3D 石墨烯使电芯层面的 560 Wh/kg Li-S 电芯成为可能，潜在能量密度可达现有锂离子的 2×，打开无人机、EV 和太空市场
        - 竞争对手以更低成本或更快循环寿命做到同等能量密度，石墨烯优势随之商品化
      - - 投资逻辑（乐观）
        - EXIM $650M LOI 一旦转化，可降低资本充足性风险，并传递美国政府对出口制造计划的验证信号
        - LOI 失效或在没有正式初步承诺的情况下重组；未宣布替代债务融资
      - - 反向逻辑（悲观）
        - 无审计收入；Compworth $110M 估计值基于模型，未获独立验证；公司从未发布 P&L 或资产负债表
        - Lyten 发布 FY2025 经审计财报，显示商业产品收入 >$20M
      - - 反向逻辑（悲观）
        - Northvolt 融资 $15B+，却于 2024 年 11 月申请 Chapter 11，说明电池制造资本需求经常超过规模化前估算
        - Lyten 签署首份有约束力 EV OEM 供货合同，年度照付不议义务 >$50M
      - - 反向逻辑（悲观）
        - 上市电池初创公司 QS、SES AI、SLDP 较 IPO 时期高点均折价 60–90%；若没有有约束力的商业合同，商业化前 Li-S 可能遭遇更严厉的公开市场重估
        - Li-S 电芯进入 OEM B-sample 项目，且 Lyten 在 2027 年前建立先发生产优势
    notes: |
      论点基于截至 2026 年 5 月 22 日的公开信息。“什么会改变该观点”触发因素为指示性，并非穷尽。概率评估为定性判断。
