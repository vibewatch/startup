      - number: '1.4'
        title: 融资历程与投资方
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Lyten 官网披露累计股权融资 $625M。最近一次有公开文件支持的融资事件，是 2024 年 7 月完成 Series B 第三批交割；该批融资把当时累计融资推高到超过
              $410M，并引入 Luxembourg Future Fund 2 这个新机构投资者，该基金由 European Investment Fund 管理。

              主要 Series B 融资于 2023 年 9 月宣布，规模 $200M。该轮由 Dakin Sloss 创立的风险投资机构 Prime Movers Lab 领投，Prime Movers Lab
              也持有董事会观察员或董事席位。Series B 的战略共同投资方包括 Stellantis Ventures（Stellantis 的企业风投部门，初始 €300M
              资金专门投向汽车创新创业公司）、FedEx（供应链物流）、Honeywell（工业和智能楼宇技术）以及大型商业建筑承包商 Walbridge。Stellantis 已在更大范围 Series B 交割前，于
              2023 年 5 月先行投资 Lyten。

              这笔融资用于扩建 San Jose 试生产线、发展 GWh 级制造能力，并支持三条主要产品线商业化：Li-S 电池、复合材料和 IoT 传感器。Series B 之前的早期轮次在公开披露中并不完整；公司截至
              2023 年底融资超过 $410M，目前披露累计 $625M。这两个数字之间的差额很可能来自 2024–2026 年的额外批次，包括 Luxembourg Fund 批次以及 Northvolt
              收购带来的资金，但具体轮次结构并未公开列明。
