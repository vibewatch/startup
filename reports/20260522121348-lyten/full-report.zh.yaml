      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              Lyten 不披露单元级财务数据。毛利率、每 kWh 成本和贡献利润均未公开。以当前试点产量看，利润率几乎肯定为负：电池制造高度吃资本、吃工艺，Lyten 在加州 San Jose
              的电芯仍处于半自动化规模下的手工组装。公司正投入最高 $20M，将 2024 年 11 月从 Cuberg 收购的 119,000 平方英尺 San Leandro 设施改造为 LiS 产线，目标年产能 200
              MWh/year，并于 2025 年 H2 启动商业生产。

              LiS 放量后的结构性成本逻辑可信，但尚未被工业化验证：用储量丰富的硫和 Lyten 3D 石墨烯（来自天然气甲烷）替代钴（~$20–35/kg）、镍、锰和石墨，账面上可降低每 kWh
              原材料成本。但千兆瓦时级制造下的工艺良率、循环一致性和设备折旧仍是未知数。

              Northvolt Sweden 收购案直接体现资本强度：全口径约 $5B 的交易覆盖 16 GWh 已安装电芯产能，折合总资产成本约 $312M/GWh，明显高于传统锂离子绿地项目 $80–120M/GWh
              的资本开支；不过 Northvolt 数字还包括欧洲最大电池 R&D 中心、160 公顷土地和大量基础设施。Lyten
              的既定策略不是新建绿地工厂，而是收购资产、逐条产线爬坡，以更省资本的方式制造；这样能降低前期资本风险，但也要承担既有化学体系改造成本。

              运营成本主要被 R&D（从 NMC 转向 LiS 的技术迁移）、招聘（目标在 2026 年 2 月后的 12 个月内新增 600+ 名欧洲员工）以及把 Northvolt 现有产线改造成 Lyten
              化学体系三件事拉动。这些就是核心烧钱速度来源。标准单位经济指标（CAC、LTV、回本周期、毛利率）均未公开披露。
