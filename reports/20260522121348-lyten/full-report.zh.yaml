      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Lyten 的买方版图分散在四个场景，预算周期、技术把关人和采用触发因素都明显不同。

              国防和政府项目是推进最靠前的买家。美国 DoD 2024 年 3 月宣布 $2.6 B 无人机技术投资，其中包括电池研发；军事 UAV 应用约占全球 UAV 电池需求的
              31%。国防采购走多年获取周期（从认证到批量合同通常 3–7 年），要求 MIL-SPEC 认证以及大量热和振动测试。预算权在项目办公室（例如 PEO Missiles and Space），而不是采购部门。

              航天和卫星项目是利润率最高的场景。Lyten 的 Li-S 电芯在 2023 NASA Aerospace Battery Workshop 上正式展示，公司也拿到 International Space
              Station 演示窗口。北美占 $4.68 B 航天电池市场的 31.2%。买家（NASA、商业 LEO 运营商、国防卫星主承包商）愿意为减重和辐照耐受支付显著溢价，但认证周期可能长达 3–5 年。

              汽车 OEM 是最大长期奖池，但距离收入最远。Stellantis 对 Lyten 的 $323 M 投资释放出设计导入意图，但 OEM 电池认证（PPAP 流程）需要 2–4 年实车验证后才会批量供货。2025
              年，全球 EV 市场已超过新车销量的 25%，IEA 预测 2030 年 EV 渗透率达到 40%——如果 Li-S 达到足够循环寿命，就能打开巨大需求池。

              商用无人机和物流运营方（包括 Lyten 投资方
              FedEx）在认证时间线上介于国防与汽车之间。它们的主要驱动因素是单位电池重量带来的飞行时间延长，通常通过一级无人机制造商购买，而不是直接向电芯供应商采购。商用无人机在 UAV 电池需求中的占比正快速增长。
