      - number: '8.2'
        title: 融资历史与估值标记
        blocks:
          - type: paragraph
            body: >
              自 2015 年创立以来，Lyten 已通过五轮融资募集 $625M，是全球资本最充足的锂硫电池创业公司之一。 2023 年 9 月完成的 Series B 募集 $200M，由 Prime Movers Lab
              领投，战略投资者包括 Stellantis、FedEx 和 Honeywell。按典型 Series B 稀释参数估算，Series B 后隐含估值集中在约 $1.15B。2025 年 7 月完成的 Series
              C 募集 $200M 或更多，Prime Movers Lab 继续领投，Luxembourg Future Fund 作为新机构支持者加入，显示欧盟主权资本支持 Lyten 的欧洲制造扩张。Series C
              后隐含估值估计从 $1.3B（Tracxn）到 $1.4B（Compworth），再到「至少 $1.5B」（AccessIPOs）。

              Compworth 基于模型估算的约 $110M 年化收入，是目前唯一可用的商业活动代理指标，但它来自自研模型，不来自经审计财务报表。 Forge Global 或其他 pre-IPO 平台均未公开报道
              Lyten 股权二级市场交易，限制了判断市场出清价格的能力。2024 年 12 月 17 日发出的 $650M EXIM LOI 不具约束力，截至 2026 年 5 月尚未转成正式初步承诺。Tracxn 将
              Lyten 归入 「Lithium Sulfur Batteries」赛道，并在其 2026 年 5 月数据更新中确认累计融资 $625M。CB Insights 将 Lyten
              追踪为未公开财务披露的私人公司。公司尚未宣布 IPO 时间表或上市交易所；Forge Global 将 Lyten 列为监测状态的 pre-IPO 观察名单 公司，没有活跃二级市场定价。
