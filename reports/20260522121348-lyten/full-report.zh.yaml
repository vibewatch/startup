      - number: '6.5'
        title: 扩张路径与集中风险
        blocks:
          - type: paragraph
            body: >
              Lyten 的扩张逻辑遵循按细分市场先落地再扩张的模型：波兰 BESS 产能服务现有欧洲客户，同时瞄准新的工业、数据中心和电网买家；防务 / 无人机产量随加州生产接单而放大；CARICOM BESS 要在
              EXIM LOI 转换后，从 MOU 扩展到合同交付；汽车 OEM 供货只有在 B-sample 和 C-sample 验证成功后才会放量。集中风险重大且多维。Stellantis
              是单一主体中暴露最高的风险：它同时是股权投资方（~2% 持股）、JDA 合作方、A-sample 评估客户，也是公开产品证据最多的一方（Chrysler Halcyon）。Stellantis 于 2024 年
              12 月与竞争性 LiS 开发商 Zeta Energy 签署 JDA，说明它在多家供应商之间对冲，可能降低 Lyten 赢得独家或主供应地位的概率。FedEx 和 Honeywell
              是投资方，但没有披露采购承诺；如果它们成为客户，Lyten 会获得收入，但可能面对利益冲突约束；如果没有，它们的股权并不会转化为商业牵引。面向 CARICOM 的 EXIM LOI 附带条件——Standard
              LOI 必须推进到 Enhanced LOI、Preliminary Commitment 和 Final Commitment 阶段后才会拨付任何融资，因此 $650M
              数字更像愿景，而非已签合同。渠道风险低（所有已知关系都是直销 B2B），但在规模化时会限制扩张。AEVEX Aerospace 是唯一披露的 DoD UAV 供货渠道合作伙伴，使防务细分市场扩张依赖单一集成商。
