      - number: '8.6'
        title: 投资建议、投资 KPI 与尽调问题
        blocks:
          - type: paragraph
            body: >
              对 Lyten 的总体投资建议是低置信度观察，风险评级高，估值立场偏高。公司确实展现出技术差异化——其 3D 石墨烯 赋能的 Li-S 平台，是公开记录中商业化推进最远的 Li-S
              技术——但缺少经审计财务披露，$1.3–1.5B 估计估值无法独立支撑。 EXIM LOI 是关键近端催化剂：如果 12 个月内转成正式初步承诺，将是强正面信号，足以在合适入场价下把建议上调至买入。无法转换， 或
              LOI 条件发生结构性变化，都会构成投资逻辑失效事件。

              哪些变化会把建议改为买入：（1）EXIM 初步承诺发布；（2）发布 FY2025 经审计财务报表，并显示商业产品收入 >$20M；（3）签署有约束力 OEM 供货合同，且年度照付不议义务
              >$50M；（4）Lyten Sweden 开始生产 Li-S 电芯。 LOI 失效、重大降价轮或 Stellantis JDA
              终止，将触发下调至回避。最终尽调问题表中的尽调问题，是任何认真尽调投资者的优先事项。 投资 KPI 记分卡汇总了来自公开来源的关键量化锚点，并注明缺少经审计财务会让大多数财务指标只能作为指示性估计。
