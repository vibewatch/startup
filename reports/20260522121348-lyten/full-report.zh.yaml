      - number: '3.6'
        title: 展项
        blocks:
          - type: callout
            title: Stellantis 在 Li-S 与固态之间多线下注
            body: >
              Stellantis 持有 Lyten 股权投资（2023 年），也与 Zeta Energy 签有联合开发协议（2024 年 12 月），并与 Factorial Energy 签有演示车队协议（2024 年
              10 月）。这种三线组合打法确认，Lyten 最醒目的 OEM 关系并不具备独家性，Stellantis 明确在 Li-S 和固态化学体系之间对冲。Lyten 要拿到商业供货协议，必须在 2030
              年前胜过同一客户面前的两个直接对手。
            calloutType: risk
            claimRefs:
              - CP004
              - CP021
              - CP022
          - type: callout
            title: Sion Power 转向国防，直接威胁 Lyten 核心市场
            body: >
              Sion Power 2026 年 3 月公告瞄准长航时无人机系统（UAS）、高性能战术无人机、巡飞弹、自主海上 / 地面车辆和航天系统，几乎与 Lyten 披露的防务管线重合。它拥有 430+ 项专利、30
              年锂金属研发积累，预计 2026 年 H2 首批出货，是 Lyten 最强细分市场里近期最有资质的竞争对手，也可能在 Lyten 扩产前先拿到防务项目资格。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: callout
            title: Li-S 品类相对既有技术仍有共同的循环寿命与可制造性缺口
            body: >
              LG Energy Solution 自家分析师和独立学术基准（Nature，2025）判断一致：实用 Li-S 电芯在中等条件下目前只能做到 400–600 次循环，低于 1,000+
              次循环的商业标准。Theion CEO 承认软包电芯「还有一段路要走」。Lyten 的优势不在于已经比同行更早解决这些问题，而在于其 3D
              石墨烯架构可能更有效地缓解多硫化物穿梭。投资者应把循环寿命和可制造性里程碑视为全行业闸门，而不只是 Lyten 自身风险。
            calloutType: insight
