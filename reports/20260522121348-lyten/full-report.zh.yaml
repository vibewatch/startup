  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价代理
        blocks:
          - type: paragraph
            body: >
              Lyten 采用直销 B2B 模式，向防务、无人机 / UAV、电池储能系统（BESS）、航天以及最终的汽车市场客户销售锂硫电芯和系统。现阶段没有消费端业务，也没有渠道分销。公司在 2024 年 5
              月完成首批可商用 LiS 电芯交付，最初瞄准非 EV 应用；这些场景监管门槛更低，重量 / 能量比带来的溢价也更能支撑价格。

              除 LiS 电芯外，Lyten 还有三条产品收入线：(1) 收购 Skellefteå 的 Northvolt Ett 设施后重启 NMC 锂离子电池生产，作为近期过渡收入；(2) 通过 2025 年 7 月从
              Northvolt 收购的 Voltpack Mobile System（VMS）产品组合销售 BESS 系统，该产品已到第三代，并已在欧洲商业安装；(3) 面向工业客户的石墨烯复合材料和化学传感器。波兰
              Gdansk 工厂正在生产 BESS 产品，目标 2025 年 Q4 交付；瑞典工厂目标在 2026 年 H2 实现商用电芯销售。

              LiS 电芯没有公开标价。价格在保密 B2B 合同中谈判确定。Lyten 称，一旦制造放量，LiS
              成本会低于锂离子，因为硫是工业副产品，化学体系也去掉了钴、镍和石墨。这个成本优势仍是公司预测，不是经市场数据验证的事实。防务和航天客户看重重量、循环寿命和供应链独立性，愿意支付溢价；在价格更敏感的汽车市场成熟前，这能形成更有利的早期收入组合。
