chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与使命
        blocks:
          - type: paragraph
            body: >
              Lyten, Inc. 是一家位于加州 San Jose 的超材料应用公司，自称是 Three-Dimensional Graphene 的开创者——这种新型碳材料把甲烷等温室气体转化为固体碳和氢气。公司于
              2015 年注册并开始运营，商业化路线是双线并行：一边把自研 3D Graphene 平台打造成底层技术，一边开发利用其独特属性、覆盖多个高价值行业的产品。

              Lyten
              宣称的使命是“让全球每个经济体在不增加排放的情况下实现经济增长”。公司把超材料路线包装成一种让高排放行业实现净零目标的办法，同时不牺牲性能、盈利能力或客户体验。其标语“更轻。更强。成本更低。而且更清洁。”概括了核心价值主张：脱碳不该以工业性能让步为代价。

              公司的主要产品线包括锂硫（Li-S）电池电芯与系统、轻量化复合材料、IoT 传感器阵列，以及 Voltpack 品牌下的电池储能系统（BESS）。公司近期还加入了混凝土外加剂和先进 3D 打印丝材。每类应用都依托
              Lyten 3D Graphene™ 的可调性：该材料可以在原子层面工程化，以优化热、电、结构和吸能属性，覆盖广泛用例。截至 2026 年 5 月，公司官网披露累计融资 $625M，已授权及申请中专利 541
              项，员工约 315 人——不过随着欧洲业务并入，员工数已显著上升。
