  - id: FR003
    title: 依赖地图
    type: dag
    layout: wide
    summary: |
      Lyten 的关键外部依赖以有向图呈现，从公司核心运营向外展开。图中包括资本依赖（EXIM、股权投资者）、制造依赖（瑞典和波兰设施）、技术依赖（本土供应链和 IP）以及客户依赖（AEVEX、DIU、EU BESS）。
    data:
      nodes:
        - id: lyten-core
          label: Lyten（硅谷 R&D + 加州 LiS）
          type: company
          description: San Jose 试点线（LiS）、San Leandro 兆级产线（LiS）、加州锂金属箔生产
          claimRefs:
            - CR026
            - CR019
        - id: exim-bank
          label: US Export-Import Bank（$650M LOI 融资意向）
          type: capital
          description: 不具约束力的 LOI；主要潜在债务融资；附带多项条件
          claimRefs:
            - CR009
            - CR010
        - id: equity-investors
          label: 股权投资者（Stellantis、FedEx、Honeywell、PML、LFF、Walbridge）
          type: capital
          description: 股权结构集中在 6–7 名已具名投资者；已融资 $625M+；下一轮尚未承诺
          claimRefs:
            - CR027
            - CR028
            - CR033
        - id: lyten-sweden
          label: Lyten Sweden 瑞典资产（Northvolt Ett + Labs，Skellefteå / Västerås）
          type: manufacturing
          description: 16 GWh 产能；需要从 NMC 转换到 LiS；重启目标 H2 2026
          claimRefs:
            - CR016
            - CR017
        - id: lyten-poland
          label: Lyten Poland 波兰资产 / Northvolt Dwa（Gdańsk）
          type: manufacturing
