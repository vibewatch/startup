  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与化学风险
        blocks:
          - type: paragraph
            body: >
              Lyten 的核心技术风险在于，锂硫电池在汽车级放电深度（DoD）下的循环寿命，尚未在商用电芯格式中得到证明。Lyten 自己发布的数据——2023 年 Power Sources Conference
              展示，并由 JPL 研究员 K. Bugga 在 2025 年 7 月航空航天演示中确认——显示，多层软包和 18650 圆柱电芯在 100% DoD 下约 150 次循环，在 50% DoD 下约 1,000
              次循环。汽车 EV 门槛是在 100% DoD 下 1,500+ 次循环。这个缺口——满放电下约 10×——不是 Lyten 独有失败，而是反映了多硫化锂溶解的基础化学：长链多硫化物（Li₂S₈ 至
              Li₂S₄）溶解进醚类电解液，迁移到锂金属负极，并发生寄生还原反应，消耗正极硫和电解液。Lyten 的 3D 石墨烯多硫化物限域架构显著降低了这种穿梭，但没有消除；商用电芯中的电解液 /
              硫（E/S）比仍必须保持较高，增加质量，也让实际能量密度相对理论上限下降。Oxford 的 National Science Review（2025）独立学术综述确认，相比纽扣电池基准，「高硫载量、低 E/S
              比的实用软包电芯通常失效得早得多」。Battery Technology Online 指出，Li-S 电芯的荷电状态监测明显比锂离子更复杂，会在各类应用的 BMS
              设计中引入可靠性风险。锂金属负极枝晶生长是另一项风险，深度循环下可能造成短路和热失控；Lyten
              用自研负极保护层和电解液添加剂缓解，但尚未发布商业规模下的独立电芯安全数据。因此商业化路径出现分叉：近期应用（无人机、卫星、中等循环次数的 BESS）用当前性能可以达成，汽车则需要化学突破，而尚无 Li-S
              开发商在量产规模电芯中证明过这一点。反向证据：一家未具名欧洲车企的电池科学家告诉 Reuters（2025 年 8 月），该公司「约六个月前退出了与 Lyten
              的合作，因为这家美国公司还只是在研发规模生产」——这印证外部 EV 合作方同样担心循环寿命和规模。该风险的投资逻辑破裂触发点是：到 2027 年底，Lyten 未能在 21700 或等效商用圆柱电芯中证明
              100% DoD 下 ≥500 次循环。
