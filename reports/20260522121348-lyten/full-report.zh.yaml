      - number: '8.5'
        title: 投资逻辑失效触发点与退出标准
        blocks:
          - type: paragraph
            body: >
              Lyten 的投资逻辑关键取决于少数几个近端二元决策，每个都可能实质改变风险收益画像。EXIM LOI 转换最有时间敏感性： 如果 EXIM 到 2026 年底仍未发布 Lyten
              的正式初步承诺，债务融资扩产的主要机制基本关闭，Lyten 将需要以可能不利的条款追加股权融资。 EXIM Make More in America 已批准交易页面和意向书资源页均确认，截至 2026 年 5 月
              LOI 流程仍在推进， 但未列出 Lyten 的正式初步承诺——这与 LOI 尚未推进到承诺信贷阶段一致。LOI 附带出口国内含量要求、环境审查，以及 Lyten
              证明拥有外国客户有约束力出口合同等条件；这些都没有公开确认。

              Northvolt Sweden 和 Poland 收购后，多设施运营月度烧钱很可能达到双位数百万美元，降价轮风险随之升高。如果 Series D 定价等于或低于 Series C
              隐含每股价格，就会释放投资者信心恶化信号，并可能触发前几轮反稀释条款。Lyten Sweden 制造延迟超过 H2 2027，会削弱收购 Northvolt Ett 工厂的理由。同业公司陷入困境——QS 退市或
              SES AI 破产——会压缩公开市场可比估值， 降低整个电池创业资产类别的 pre-IPO 胃口。Stellantis 终止 JDA 会把投资者持股从战略背书变成纯财务投资，拿掉 Lyten 最可信的 OEM
              验证。上述任何单一事件，都足以支持上调风险评级或下调投资建议。
