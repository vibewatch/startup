      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 7 月，Lyten 累计股权融资超过 $625M，投资方包括 Prime Movers Lab、Stellantis、FedEx、Honeywell、Luxembourg Future
              Fund 和 European Investment Fund。2025 年 7 月的 $200M 轮融资是 Lyten 自 2023 年 9 月 Series B 轮以来最大一轮，资金用途明确指向
              Northvolt 收购策略和欧洲扩张，而非一般运营。公司没有披露债务义务，资金完全来自股权融资。

              最重要的或有融资工具是 2024 年 12 月的 EXIM Bank LOI：美国进出口银行这个联邦出口信贷机构出具多封意向函，合计最高 $650M 出口信贷融资，用于支持加州和内华达的 LiS 制造扩张，以及向
              CARICOM 国家交付 BESS 产品。该 LOI 附带条件，不是已承诺贷款。要转成实际信贷，还需敲定贷款条款、完成信贷承销、通过环境审查，并用具约束力的客户合同替代现有客户 MOU。LOI 原本部分指向的
              Reno, Nevada 超级电池工厂后来已取消（2026 年 1 月），可能压缩实际 LOI 覆盖范围。

              2024 年 1 月，Lyten 与 Stanford University、UT Austin 和 Arcadium Lithium 合作，获得 DOE Vehicle Technologies Office
              一笔 $4M 拨款，用于 LiS 商业化。Skellefteå 场地的 EdgeConneX 数据中心土地交易（潜在容量 1 GW）部分抵消 Northvolt 收购成本，但金额未披露。Lyten CEO Dan
              Cook 表示还计划继续大额融资，并争取欧盟电池促进拨款。现金跑道未公开；考虑到收购承诺和运营费用规模，公司看起来仍需持续股权融资才能维持足够现金覆盖。
