  - id: regulatory-policy-legal-risk
    title: Regulatory, Policy, and Legal Risk
    body: >
      Lyten's business model is deeply intertwined with US government policy and financing
      instruments, each of which carries material conditionality risk. The $650 million EXIM
      Bank Letters of Interest (LOIs), announced in December 2024, are explicitly non-binding:
      EXIM characterises an LOI as "an indication of financing terms EXIM may consider based
      on preliminary review" — it is not a committed loan. Conversion to a formal preliminary
      commitment requires satisfying EXIM's credit standards (the portfolio default rate is
      0.98%, implying strict criteria), completing environmental review, and replacing customer
      MOUs with binding contracts. The Reno gigafactory cancellation (January 2026) reduces
      the original LOI scope, as one of the two targeted US manufacturing sites no longer
      exists, and it is unclear whether EXIM will extend equivalent terms to Sweden and Poland.
      The FY2026 NDAA (signed December 2025) introduces phased restrictions on DoD procurement
      of advanced batteries containing components or materials from foreign entities of concern
      (FEOCs), with supply-chain traceability required to the mining, refining, and separation
      level. While Lyten's California Li-S production is NDAA-compliant (domestic lithium, US
      sulfur), the Swedish and Polish manufacturing facilities introduce EU-sourced components
      into the supply chain. Lyten has not disclosed whether EU-manufactured cells would qualify
      for NDAA exemptions as a "qualifying country" sourced item — Sweden and Poland are both
      qualifying countries under the existing DFARS framework, which provides a potential safe
      harbour, but prime contractor documentation and DFARS clause incorporation will be required.
      IRA FEOC compliance is a parallel risk: by 2026, eligible clean vehicles must not contain
      battery critical minerals extracted or processed by FEOCs. Lyten's US supply chain (domestic
      sulfur, Pennsylvania lithium alloy processing, California foil extrusion) appears IRA-
      compliant; however, cells manufactured in Sweden or Poland for US export or use in US-
      subsidised vehicles will face heightened IRA FEOC scrutiny. The EU's own battery regulation
      (Battery Regulation 2023/1542) and forthcoming carbon footprint and due diligence rules
      impose separate compliance obligations on EU-manufactured cells — adding cost and complexity
      to the European expansion. On IP and patent risk: Lyten's portfolio of 500+ granted or
      pending patents provides a broad moat in 3D graphene synthesis and Li-S cell architecture,
      but the Northvolt acquisitions transferred legacy Northvolt IP to Lyten, the provenance
      and freedom-to-operate status of which has not been independently verified. No pending
      litigation involving Lyten has been identified in public record searches as of May 2026,
      though the combination of rapid asset acquisitions and novel chemistry creates potential
      for IP disputes from third-party graphene or Li-S patent holders.
    claimRefs:
      - CR009
