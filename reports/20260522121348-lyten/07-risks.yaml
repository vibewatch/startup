  - id: execution-people-risk
    title: Execution and People Risk
    body: >
      Lyten's leadership team has been substantially reconstituted and geographically fragmented
      through the 2025–2026 acquisition programme. CEO Dan Cook (co-founder) and Chief Battery
      Technology Officer Celina Mikolajczak lead the Silicon Valley core team, but three new
      senior executives — Matthias Arleth (CEO Lyten Sweden), Robert Chryc-Gawrychowski
      (CEO Lyten Poland), and Sami Haikala (CEO Northvolt Labs, Västerås) — joined through
      the Northvolt deal and have no prior history of working within Lyten's culture or
      technology stack. Key-man risk on Dan Cook is high: he is named in substantially all
      major corporate disclosures, is the primary technology and strategic architect, and
      his departure would likely affect investor confidence and customer relationships. The
      acquisition of Northvolt assets in February 2026 — adding ~16 GWh of dormant European
      manufacturing capacity, hundreds of former Northvolt employees, and three distinct
      facilities — represents one of the most ambitious operational integrations attempted
      by a pre-commercial battery startup. Lyten's plan to hire 600+ additional European
      employees over 12 months introduces workforce velocity risk: Northvolt itself suffered
      safety incidents and quality failures linked to rapid hiring that outpaced its training
      and management systems. The European facilities operate under different labour laws
      (Swedish, Polish, and German), with union representation and works council requirements
      that a California-headquartered startup may be ill-equipped to navigate. Cultural and
      operational alignment risk is real: Lyten's Silicon Valley engineering culture and
      Northvolt's industrial European model are materially different, and the lack of a
      shared technology base (NMC chemistry vs. Li-S chemistry) means there is no common
      production playbook. Equity-based retention incentives for European executives may not
      be competitive in local markets unless Lyten moves toward public markets, which has
      not been announced. Emma Nehrenheim, former Northvolt executive and current head of
      the European Battery Alliance, has publicly stated that crossing the "death valley"
      of unprofitable production requires over five years and government subsidies — a
      timeline that poses a retention risk for European talent who may see limited near-term
      upside in a startup equity structure.
    claimRefs:
