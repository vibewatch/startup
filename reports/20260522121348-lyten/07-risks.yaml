  - id: TR004
    title: People / Execution Risk Register
    columns:
      - Role / Function
      - Dependency or Gap
      - Likelihood
      - Severity
      - Mitigation
      - Diligence Path
    rows:
      - - CEO Dan Cook (co-founder)
        - Key-man risk; architect of technology, strategy, and investor relationships; no named successor
        - Low (no signals of departure; co-founder alignment typically high)
        - Critical (investor confidence, customer relationships, and capital raises tied to Cook)
        - Succession planning not disclosed; strong CTO and CBTO bench
        - Confirm succession planning and leadership team depth in management due diligence
      - - European manufacturing leadership (Arleth, Chryc-Gawrychowski, Haikala)
        - All three joined through Northvolt acquisition with no prior Lyten Li-S experience; cultural integration risk
        - Medium (Northvolt experience relevant for facility management; Li-S chemistry gap is real)
        - High (manufacturing ramp delays if leadership team fragments or fails to execute Li-S conversion)
        - Equity-based retention packages; experienced in European battery facility management
        - Confirm incentive structure and retention agreements for acquired European executives
      - - 600+ European hires over 12 months
        - Workforce velocity risk — rapid hiring outpaced quality and safety management at Northvolt itself
        - High (Lyten has committed to this hiring plan; European labour markets for battery experts are competitive)
        - High (quality incidents, safety failures, or production delays if hiring and training pace is not managed)
        - No specifics disclosed on training programme, safety management system, or quality management system
        - Request training and safety management programme design; benchmark hiring velocity against Northvolt ramp
      - - Chief Battery Technology Officer Celina Mikolajczak
        - Core technical leadership for Li-S chemistry and supply chain; public face of technology credibility
        - Low-Medium (key technical voice; departure would affect credibility with EXIM, DoD, and OEM customers)
        - High (Li-S expertise is rare; Mikolajczak's credibility is cited in EXIM and government engagements)
        - Experienced technical team in San Jose; academic and national-lab collaborators provide depth
        - Confirm technical team depth and retention plan for core battery chemistry staff
    notes: >
      Personnel risk assessments are based on public disclosures, press releases, and
      interview-based reporting. Equity incentive structures, succession plans, and retention
      arrangements for executives are not publicly disclosed. Risk ratings will be revised
      following management due diligence interviews.
    claimRefs:
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038

  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Kill Event
      - Action Implication
    rows:
      - - Li-S cycle life — automotive EV viability
        - Commercial cylindrical or pouch cell cycle life data published or independently validated at 100% DoD
        - Failure to demonstrate ≥500 cycles at 100% DoD in commercial-format cells by end of 2027
        - Thesis break for automotive channel; re-scope to defence, drone, satellite, and BESS only
      - - EXIM LOI conversion to committed loan
        - EXIM preliminary commitment announcement; replacement financing sources disclosed
        - LOI not converted to preliminary commitment by mid-2027; no equivalent debt financing secured
        - Capital gap forces equity dilution at unfavourable terms or curtailment of US manufacturing scale-up
      - - Northvolt Ett (Skellefteå) commercial Li-S cell production
        - First commercial LiS cell delivery from Skellefteå confirmed by third-party or customer announcement
        - Commercial delivery not achieved by end of 2026 (H2 2026 target missed by >6 months)
        - Manufacturing thesis break; renegotiate CARICOM and BESS customer timelines; increased capital need
      - - Stellantis JDA continuity
        - Stellantis public statement on JDA status; B-sample delivery announcement; Zeta Energy programme update
        - Stellantis publicly terminates Lyten JDA or announces binding supply agreement with Zeta Energy
        - Loss of primary automotive validation; re-scope automotive strategy to alternate OEMs
      - - NDAA / EXIM defence procurement compliance
        - DFARS compliance certification for EU facilities obtained; DoD contract awards for EU-manufactured cells
        - EU facility DFARS non-compliance finding by prime contractor; loss of DoD procurement eligibility
        - Limits defence revenue to California-manufactured cells only; limits EXIM LOI scope for EU exports
      - - Financing adequacy (burn rate vs. cash runway)
        - Lyten public disclosure of revenue, burn rate, or equity raise; EXIM draw schedule published
        - Unplanned equity raise at >30% dilution without corresponding manufacturing or revenue milestone
        - Investor signal of capital distress; review risk allocation and thesis conviction
      - - Customer concentration — defence/drone channel
        - AEVEX delivery confirmation; additional named drone or defence customers announced
        - AEVEX exits partnership without replacement; California Li-S production not at commercial scale by Q4 2026
        - Near-term Li-S commercial revenue at risk; re-scope to BESS NMC revenue as primary near-term channel
    notes: >
      Kill criteria thresholds are analyst-defined based on the most material observable
      triggers for thesis revision. They represent events that, if confirmed, would require
      significant re-evaluation of investment or partnership conviction in Lyten. Thresholds
      are not Lyten-endorsed and should be revisited as disclosed information evolves.
    claimRefs:
      - CR001
      - CR009
      - CR016
      - CR017
      - CR023
      - CR029
      - CR039

