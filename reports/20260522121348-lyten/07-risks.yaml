      description: >
        The regulatory/legal risk register (TR001) documents all material regulatory instruments
        identified through public record research as of 22 May 2026. However, Northvolt legacy IP
        portfolio FTO analysis, EXIM formal preliminary commitment status, EU state-aid notifications
        for Lyten Sweden/Poland, and environmental impact assessments for Northvolt Ett restart under
        Lyten ownership are all not publicly disclosed. Additional regulatory or contractual
        obligations may exist that are not captured in public sources.
      severity: material
      relatedTableRefs: [TR001]
      relatedClaimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015]
      relatedQuestionRefs: [QR005, QR006, QR007, QR008, QR009, QR010, QR011, QR030, QR031, QR032]

    - id: GR002
      type: private-evidence-only
      description: >
        Lyten has never publicly disclosed burn rate, cash balance, runway, or total capital
        expenditure requirements for its manufacturing operations. The $625M+ equity raised and
        the ~$5 billion Northvolt asset value are disclosed, but no income statement, cash-flow,
