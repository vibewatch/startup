  - id: capital-financing-risk
    title: Capital Intensity and Financing Risk
    body: >
      Lyten is operating at significant financial risk commensurate with its pre-commercial
      status and multi-continent manufacturing ambition. The company has disclosed total equity
      investment exceeding $625 million (as of July 2025) but has never published revenue,
      gross margin, burn rate, or cash runway. The Northvolt Sweden acquisition (~$5 billion
      in inherited asset value) was structured through equity and asset transactions rather
      than full cash payment, but conversion of distressed NMC facilities to Li-S production
      requires substantial capital expenditure on equipment modification, electrolyte handling
      infrastructure, and process qualification. Lyten's CBO Keith Norman confirmed in a March
      2026 interview that the company is targeting revenue reinvestment, EU grants, and
      private equity as primary near-term capital sources, but described the financing strategy
      as ongoing ("we have a number of financing levers available to us"). The EXIM LOI
      conversion risk is the single largest capital uncertainty: $650 million in conditional
      export-credit financing, if it fails to convert, would require replacing at least
      partially with more dilutive equity or government grants — and would likely require
      scaling back the CARICOM BESS programme. Northvolt itself raised over $15 billion in
      equity and grants but burned cash at ~$100 million per month and collapsed under $5.8
      billion in debt; the parallel is imperfect but salient. Lyten has explicitly articulated
      an acquisition-based strategy as a capital efficiency measure, but each acquisition
      adds legacy liabilities, workforce obligations, and integration cost. An additional risk
      is that Lyten's existing investors — Prime Movers Lab, Luxembourg Future Fund (EIF),
      Stellantis, FedEx, Honeywell, and Walbridge — are concentrated in a relatively small
      number of capital providers; any one declining to participate in future rounds could
      create a funding gap in a capital-intensive sector where bridge financing is difficult
      to secure. The Poland facility and Voltpack product are the nearest to cash generation,
      but the margins on NMC BESS in a competitive European market against LFP-based Chinese
      products are constrained.
