figures:
  - id: FR001
    title: "Risk Heatmap"
    type: matrix
    layout: wide
    summary: >
      Lyten's eight primary risks plotted on a 3×3 likelihood-vs-impact matrix as of May 2026.
      Residual severity is shown after current mitigations. Technical (cycle-life), manufacturing
      (Northvolt restart), and capital (EXIM LOI) risks are assessed as high-impact and high-
      likelihood; regulatory/policy and partner/dependency risks are high-impact but medium
      likelihood given existing mitigations.
    notes: >
      Assessments are based on publicly available evidence as of 22 May 2026 and reflect the
      analyst's judgement given disclosed information. Lyten has not published its own risk
      assessments. 'Residual' indicates exposure after stated mitigations.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
      rows:
        - label: High Likelihood
          values:
            - "—"
            - "R3 — Production yield gap; R8 — Customer concentration (defence)"
            - "R1 — Li-S cycle life gap (automotive); R4 — Northvolt restart timeline"
        - label: Medium Likelihood
          values:
            - "—"
            - "R7 — IP / FTO gap (Northvolt legacy)"
            - "R2 — EXIM LOI conversion failure; R5 — Stellantis hedging; R6 — European hiring velocity"
        - label: Low Likelihood
          values:
            - "—"
            - "—"
            - "R9 — Li-metal thermal incident; R10 — NDAA FEOC disqualification"
    claimRefs:
      - CR001
      - CR009
      - CR011
      - CR016
      - CR017
      - CR022
      - CR023
      - CR034
      - CR039

  - id: FR002
    title: "Risk Transmission Map"
    type: dag
    layout: wide
    summary: >
      How Lyten's primary risks flow into downstream impacts on revenue, customer relationships,
      capital position, and thesis viability. The cycle-life gap and Northvolt restart are the
      two highest-centrality nodes, with most downstream risks flowing through one or both.
    data:
      nodes:
        - id: cycle-life-gap
          label: "Li-S Cycle Life Gap (100% DoD)"
          type: risk
          description: "~150 cycles in pouch cells vs 1,500+ EV requirement"
          claimRefs: [CR001, CR002, CR003]
        - id: northvolt-restart
          label: "Northvolt Ett Restart Risk"
          type: risk
          description: "7-month target from acquisition to commercial LiS cell delivery (Feb–H2 2026)"
          claimRefs: [CR016, CR017]
        - id: exim-loi-risk
          label: "EXIM LOI Non-Conversion Risk"
          type: risk
          description: "$650M LOI non-binding; conditions include customer contracts and environmental review"
          claimRefs: [CR009, CR010]
        - id: stellantis-hedging
          label: "Stellantis Multi-Supplier Hedging"
          type: risk
          description: "Stellantis signed Zeta Energy JDA Dec 2024; no exclusive commitment to Lyten"
          claimRefs: [CR023, CR041]
        - id: automotive-channel-at-risk
          label: "Automotive Channel Delayed/Lost"
          type: impact
          description: "No binding automotive supply contract; carmaker exit signal; 2030+ viability"
          claimRefs: [CR005, CR006, CR041]
        - id: capital-shortfall
          label: "Capital Shortfall / Accelerated Dilution"
          type: impact
          description: "EXIM failure forces equity dilution or curtailment of EU manufacturing"
          claimRefs: [CR029, CR033]
        - id: manufacturing-delay
          label: "Manufacturing Delay (Sweden/US)"
          type: impact
          description: "Li-S cell delivery to BESS and drone customers delayed; CARICOM MOU at risk"
          claimRefs: [CR017, CR022]
        - id: revenue-concentration
          label: "Revenue Concentrated in Defence/BESS"
          type: impact
          description: "Near-term LiS revenue entirely from drone/space; BESS revenue is NMC not LiS"
          claimRefs: [CR039, CR040]
        - id: thesis-break
          label: "Thesis Break Event"
          type: outcome
          description: "Failure to demonstrate automotive-grade LiS at commercial scale by 2028"
          claimRefs: [CR006, CR007]
      edges:
        - from: cycle-life-gap
          to: automotive-channel-at-risk
          label: "No automotive qualification without cycle-life breakthrough"
        - from: cycle-life-gap
          to: revenue-concentration
          label: "Forces reliance on lower-cycle-count applications"
        - from: northvolt-restart
          to: manufacturing-delay
          label: "Restart failure delays H2 2026 cell supply to Poland BESS"
        - from: northvolt-restart
          to: capital-shortfall
          label: "Delay increases cash burn without revenue offset"
        - from: exim-loi-risk
          to: capital-shortfall
          label: "LOI non-conversion eliminates $650M debt capital"
        - from: stellantis-hedging
          to: automotive-channel-at-risk
          label: "Hedging reduces probability of binding supply contract"
        - from: automotive-channel-at-risk
          to: thesis-break
          label: "Loss of OEM channel is primary thesis-break scenario"
        - from: capital-shortfall
          to: manufacturing-delay
          label: "Insufficient capital constrains facility restart and ramp"
        - from: manufacturing-delay
          to: revenue-concentration
          label: "Delay extends dependence on defence/drone for LiS revenue"
        - from: revenue-concentration
          to: thesis-break
          label: "Inability to diversify revenue beyond niche applications"
    claimRefs:
      - CR001
      - CR009
      - CR016
      - CR017
      - CR023
      - CR029
      - CR039
      - CR040
      - CR041

