company:
  name: Lyten
chapter:
  number: 1
  title: Company Overview
  summary: >
    Lyten, founded in 2015 and headquartered in San Jose, California, is a supermaterial
    applications company pioneering three-dimensional (3D) graphene for use in lithium-sulfur
    batteries, lightweight composites, IoT sensors, and battery energy storage systems (BESS).
    The company has raised $625M in total capital as of May 2026 and holds 541 patents granted
    and pending. After its 2023 Series B ($200M) led by Prime Movers Lab with strategic investors
    including Stellantis, FedEx, and Honeywell, Lyten accelerated its global manufacturing
    footprint through the Northvolt Sweden acquisition (February 2026, ~$5B in assets) and
    a BESS facility in Gdańsk, Poland—abandoning its previously planned $1B Nevada gigafactory
    in favour of these lower-cost acquired European assets.

sections:
  - id: identity-and-mission
    title: Identity and Mission
    body: >
      Lyten, Inc. is a San Jose, California-based supermaterial applications company that
      describes itself as the pioneer in Three-Dimensional Graphene—a novel class of carbon
      material produced by converting greenhouse gases such as methane into solid carbon and
      hydrogen gas. The company was incorporated and began operations in 2015 and has pursued
      a dual-track commercialisation strategy: developing its proprietary 3D Graphene platform
      as a foundational technology and simultaneously building products that leverage its unique
      properties across multiple high-value industries.

      Lyten's stated mission is to "enable economic growth without emissions growth in every
      economy across the planet." The company frames its supermaterial approach as a way for
      even the highest-emitting industries to achieve net-zero targets without compromising
      performance, profitability, or customer experience. Its tagline—"Lighter. Stronger.
      Lower Cost. AND Cleaner."—encapsulates the core value proposition: that decarbonisation
      should not require a trade-off against industrial performance.

      The company's primary product lines are lithium-sulfur (Li-S) battery cells and systems,
      lightweight composites, IoT sensor arrays, and battery energy storage systems (BESS)
      under the Voltpack brand. A concrete admixture product and advanced 3D-printing filaments
      have been added more recently. Each of these applications draws on the tunability of
      Lyten 3D Graphene™, which can be engineered at the atomic level to optimise thermal,
      electrical, structural, and energy-absorbing properties across a wide range of use cases.
      The company's homepage as of May 2026 reported $625M in capital raised, 541 patents
      granted and pending, and approximately 315 employees—though headcount has grown
      significantly as European operations have been added.
    claimRefs: [CO001, CO002, CO003, CO013, CO029, CO044]
    figureRefs: [FO002]

  - id: founding-and-leadership
    title: Founding, Leadership, and Governance
    body: >
      Lyten was founded in 2015 in San Jose, California. Its co-founder and CEO, Dan Cook,
      has served as President and Chief Executive Officer since inception and is widely cited
      in press releases and investor communications as the primary spokesperson. Cook's
      background spans advanced materials and cleantech commercialisation; he co-authored
      key IP related to the 3D graphene synthesis process and has been the named executive
      in every major funding announcement since 2023.

      Celina Mikolajczak serves as Chief Battery Technology Officer (CBTO), bringing deep
      battery chemistry and manufacturing expertise. Prior to Lyten, Mikolajczak held senior
      roles at Panasonic and Tesla's battery division, and she leads the technical roadmap
      for the lithium-sulfur cell programme. Keith Norman serves as Chief Marketing Officer
      (CMO) and was previously the Chief Sustainability Officer, having responded to press
      inquiries and authored public-facing positions on Lyten's supply-chain and sustainability
      claims. Ratnakumar Bugga joined as Senior Fellow with 34 years of space battery R&D
      experience, directly supporting the ISS demonstration programme.

      In September 2025, following the announced acquisition of Northvolt's European assets,
      Lyten appointed Matthias Arleth as CEO of Lyten Sweden, reporting to Dan Cook. Arleth
      brought more than 25 years of international leadership across automotive, energy, and
      electronics industries, having joined Northvolt one year earlier as President BU Cells
      and COO. Robert Chryc-Gawrychowski was named CEO of Lyten Poland, and Sami Haikala
      continues as CEO of Northvolt Labs in Västerås. Dennis van Schie joined as Chief Supply
      Chain Officer for Lyten Sweden.

      Lyten has not publicly disclosed its full board composition or governance structure.
      The investor seat held by Zia Huque (Prime Movers Lab General Partner) is publicly
      noted. Key-person dependence on Dan Cook appears material given his central role in
      both the technical vision and investor relations.
    claimRefs: [CO008, CO009, CO010, CO041, CO043, CO045]
    tableRefs: [TO002]

  - id: technology-platform
    title: Core Technology Platform
    body: >
      Lyten's foundational technology is Lyten 3D Graphene™, a proprietary form of graphene
      with a three-dimensional structure rather than the conventional two-dimensional single
      layer. The material is synthesised by passing hydrocarbon gases (primarily methane)
      through a microwave plasma reactor, which breaks down the molecules and deposits carbon
      as a solid 3D graphene structure while releasing hydrogen for capture as clean fuel.
      The process has been independently verified to be carbon neutral at scale, according
      to company statements backed by investor disclosures.

      Unlike flat, 2D graphene, Lyten 3D Graphene is tunable: engineers can adjust its porosity,
      electrical conductivity, structural stiffness, and chemical affinity by modifying
      synthesis parameters and post-processing. This tunability is what allows a single
      platform to serve battery cathodes, structural composites, and sensor membranes.

      In lithium-sulfur batteries, 3D Graphene's key role is to act as a porous scaffold that
      holds sulfur atoms in place within the cathode, preventing the polysulfide-shuttling
      effect that historically limits Li-S cycle life. The graphene scaffold is electrically
      conductive, enabling efficient charge transport, while immobilising dissolved lithium
      polysulfides that would otherwise migrate to the anode and degrade the cell. Lyten
      claims its cells target greater than twice the energy density of conventional NMC
      lithium-ion batteries and up to 50% lower weight, with a carbon footprint estimated
      at 60–65% lower than best-in-class lithium-ion because the chemistry eliminates
      nickel, cobalt, manganese, and graphite from the supply chain. The pilot production
      line in San Jose manufactures cells in both pouch (6.5 Ah) and cylindrical formats
      (18650 and 21700).
    claimRefs: [CO013, CO018, CO019, CO020, CO033, CO039, CO044, CO046]

  - id: funding-and-investors
    title: Funding History and Investors
    body: >
      Lyten has raised $625M in total equity financing as reported on its homepage as of
      May 2026. The most recent publicly documented financing event was the completion of
      the Series B funding round's third tranche in July 2024, which brought the total
      raised at that time to more than $410M and introduced Luxembourg Future Fund 2—a fund
      managed by the European Investment Fund—as a new institutional investor.

      The principal Series B financing was announced in September 2023 at $200M. The round
      was led by Prime Movers Lab, the venture capital firm founded by Dakin Sloss, which
      also holds a board observer or director seat. Strategic co-investors in the Series B
      included Stellantis Ventures (the corporate venture arm of Stellantis, funded with an
      initial €300M earmarked for automotive innovation startups), FedEx (supply-chain
      logistics), Honeywell (industrial and smart-building technology), and Walbridge, a
      large commercial construction contractor. Stellantis had initially invested in Lyten
      in May 2023 ahead of the broader Series B close.

      The funding is intended to scale the San Jose pilot production line, develop gigascale
      manufacturing capacity, and support commercialisation of three primary product lines:
      Li-S batteries, composites, and IoT sensors. Earlier rounds prior to the Series B are
      not fully detailed in public disclosures; the company has raised over $410M as of late
      2023 and now reports $625M total. The gap between these figures likely reflects
      additional tranches in 2024–2026, including the Luxembourg Fund tranche and proceeds
      related to the Northvolt acquisitions, but the precise round structure is not publicly
      itemised.
    claimRefs: [CO004, CO005, CO006, CO007, CO028, CO031]
    tableRefs: [TO001, TO003]
    figureRefs: [FO003]

  - id: milestones-and-operations
    title: Milestones, Scale, and Adverse Events
    body: >
      Lyten opened its first automated pilot production facility in San Jose in May 2023,
      capable of producing up to 200,000 cells per year using standard lithium-ion equipment,
      demonstrating the drop-in manufacturability of its lithium-sulfur chemistry. The first
      customer A-samples—6.5 Ah pouch cells—were shipped to Stellantis and other US and
      European OEMs in May 2024. A major US consumer electronics company and the US
      Department of Defense also received early shipment commitments in that window.

      In September 2024, the Defense Innovation Unit (DIU) selected Lyten for a funded
      programme to demonstrate rechargeable Li-S battery cells aboard the International
      Space Station (ISS), with integration partner Spacebilt/Skycorp and a goal of
      achieving flight certification for space-suit and satellite applications. In October
      2024, Lyten announced plans to invest over $1 billion in the world's first Li-S
      gigafactory near Reno, Nevada, targeting 10 GWh annual capacity at full scale with
      a Phase 1 online date of 2027.

      However, in early 2026 the Reno gigafactory plan was abandoned after Lyten was unable
      to negotiate a lease with the Reno-Tahoe Airport Authority. The Airport Authority
      stated that Lyten's US presence was shrinking "significantly" due to its pivot to
      European green-energy assets; Lyten's CMO publicly denied federal energy policy was
      a factor, attributing the decision to the cost efficiency of acquired European
      manufacturing. A CleanTechnica analysis published in August 2025 had already flagged
      that Li-S commercial EV deployment timing remained uncertain and that Stellantis had
      also invested in rival Li-S startup Zeta Energy, introducing competitive risk.

      In October 2025, Lyten completed the acquisition of Northvolt's BESS manufacturing
      facility in Gdańsk, Poland. In February 2026, Lyten completed the acquisition of
      Northvolt Ett and Northvolt Labs in Sweden, acquiring 16 GWh of battery manufacturing
      capacity, 160+ hectares of land, and—in Västerås—the largest battery R&D centre in
      Europe, collectively valued at approximately $5B in assets. A co-located data-centre
      deal with EdgeConneX (up to 1 GW capacity) was announced simultaneously. In March 2026,
      Lyten announced plans to establish an Industrial Hub in Gdańsk, Poland, centred on
      the BESS facility and evaluating expanded manufacturing and co-location of AI data
      infrastructure. As of April 2025, Lyten had also produced the first US battery-grade
      lithium-metal foil using domestically sourced materials, strengthening its tariff-free,
      fully US-sourced supply chain claim.
    claimRefs: [CO014, CO015, CO016, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO030, CO035, CO036, CO040, CO042]
    tableRefs: [TO004]
    figureRefs: [FO001]

