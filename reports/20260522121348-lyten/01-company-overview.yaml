  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >
        Independently verified 2026 employee count including new European hires from the Northvolt
        acquisitions; company-disclosed figure of ~315 predates the 600+ planned Sweden hires.
      whyItMatters: >
        True headcount post-acquisition affects burn rate, integration risk, and the credibility
        of the rapid-ramp claims in Sweden and Poland.
      diligencePath: >
        Request current headcount from Lyten IR; cross-check Swedish Employment Agency filings
        or Northvolt creditors' reports for European staff numbers.
      relatedQuestionRefs: [QO003, QO024]

    - type: missing-source
      severity: minor
      topic: competitive-landscape
      missingEvidence: >
        Direct public comparison of Lyten's Li-S cell specifications versus Zeta Energy, Theion,
        and other Li-S startups in terms of verified cycle life, volumetric energy density,
        and commercial readiness stage.
      whyItMatters: >
        Without a credible third-party benchmark, it is difficult to assess whether Lyten is
        differentiated from or behind its competitors; Stellantis's parallel Zeta investment
        signals uncertainty about relative positioning.
      diligencePath: >
        Review independent lab test results or peer-reviewed publications benchmarking Lyten,
        Zeta Energy, and Theion cells; contact technical advisory firms covering advanced batteries.
      relatedQuestionRefs: [QO016, QO023]

    - type: private-evidence-only
      severity: material
      topic: commercialisation-timeline
      missingEvidence: >
        Verified internal roadmap showing cycle-life test data, B-sample qualification milestones
        for automotive OEMs, and a realistic EV commercial supply date with independent
        validation.
      whyItMatters: >
        Li-S has historically suffered from insufficient cycle life; without independent
        verification of Lyten's cycle-life performance, the EV timeline claim is unverifiable
        and CleanTechnica's scepticism cannot be resolved.
      diligencePath: >
        Request cell test data from Lyten under NDA; seek corroboration from Stellantis CTIO
        office or a battery testing laboratory that has evaluated the cells.
      relatedQuestionRefs: [QO013]

    - type: private-evidence-only
      severity: material
      topic: investor-governance
      missingEvidence: >
        Full board composition, governance rights (board seats, protective provisions,
        anti-dilution terms, pro-rata), and pre-Series B investor identities for Lyten.
      whyItMatters: >
        Undisclosed early investors and opaque governance complicate assessment of founder
        control, dilution risk, and alignment between capital providers and long-term strategy.
      diligencePath: >
        Request cap table and investor rights agreement from Lyten; check Delaware Secretary
        of State filings and any SEC Form D filings.
      relatedTableRefs: [TO003]

    - type: enumeration-incomplete
      severity: minor
      topic: leadership-and-founder-table
      missingEvidence: >
        Full board of directors composition; non-disclosed C-suite roles (CFO, COO, General
        Counsel, VP Engineering); pre-2022 Lyten executive team and any departed key personnel.
      whyItMatters: >
        Incomplete executive picture limits assessment of key-person risk concentration and
        organisational depth, particularly for the US-based operations.
      diligencePath: >
        Review Lyten LinkedIn, company website team pages, LinkedIn profiles of likely senior
        hires, and any SEC or EU filings associated with the Northvolt acquisition.
      relatedTableRefs: [TO002]

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-table
      missingEvidence: >
        Proprietary commercial contract signings, B-sample qualification timelines, actual
        cell delivery volumes, and any adverse regulatory, IP, or labour events below public
        announcement threshold.
      whyItMatters: >
        The public milestone record appears positive-selection-biased; unfavourable decisions
        or delays in qualification could materially affect the commercial timeline.
      diligencePath: >
        Request detailed programme plans from Lyten; review any Delaware or EU regulatory
        filings; interview Stellantis engineering contacts about qualification status.
      relatedTableRefs: [TO004]

    - type: missing-source
      severity: material
      topic: valuation
      missingEvidence: >
        Lyten's post-money valuation at any financing round; no public disclosure exists and
        the Northvolt acquisition may have implied a valuation that remains undisclosed.
      whyItMatters: >
        Without a valuation anchor, it is impossible to assess whether $625M in capital raised
        represents attractive or expensive entry; needed for the financials and valuation chapters.
      diligencePath: >
        Review any SEC Form D filings or EDGAR disclosures; request from Lyten IR; consult
        PitchBook or Crunchbase for any disclosed post-money valuations.

