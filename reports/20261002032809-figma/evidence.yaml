evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-and-funding
    missingEvidence: >-
      A run-date market capitalization or enterprise value, an exact cumulative primary-capital total, and current debt
      and credit-facility balances.
    whyItMatters: >-
      A dated equity-market estimate, historical ownership, and a secondary tender cannot establish current valuation,
      total funding raised, or cash available.
    diligencePath: >-
      Obtain the October 2, 2026 closing share count and price, reconcile net debt from the latest 10-Q, and build
      primary financings from filed securities records.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: headcount-and-locations
    missingEvidence: A 2026 employee count and a complete current office or operating-location list.
    whyItMatters: >-
      The March 2025 headcount and principal executive address cannot support current productivity, hiring, or
      geographic-footprint conclusions.
    diligencePath: >-
      Review the latest 10-K or 10-Q properties and human-capital disclosures and request a dated management headcount
      by function and geography.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-board
    missingEvidence: >-
      A complete current executive and board roster, functional succession coverage, and any post-S-1 leadership
      changes.
    whyItMatters: >-
      The retained evidence corroborates only selected roles and cannot establish that no material leadership change
      occurred.
    diligencePath: Reconcile the latest proxy statement, 8-K leadership disclosures, and investor-relations governance roster.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: adverse-event-history
    missingEvidence: >-
      A comprehensive independent post-IPO record of litigation, regulatory actions, outages, breaches, and customer
      complaints.
    whyItMatters: >-
      Company risk factors and one independent valuation note do not prove the absence of operational or legal
      incidents.
    diligencePath: >-
      Review court, regulator, status-page, security-notice, and customer-complaint records in the next evidence
      refresh.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: ai-credit-unit-economics
    missingEvidence: Granular breakdown of AI credit gross margins, cost per inference call, and paid attach rates by enterprise tier.
    whyItMatters: >-
      Directly impacts long-term gross margin defense above the current 79% floor as generative design features scale
      across the seat base.
    diligencePath: Review subsequent SEC Form 10-Q disclosures and management commentary during FY2026 earnings calls.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: presentation-tool-conversion
    missingEvidence: Quantitative customer migration rates from Google Slides and Microsoft PowerPoint to Figma Slides.
    whyItMatters: >-
      Validates whether the $6.7 billion presentation software segment can provide a meaningful second revenue growth
      engine beyond design.
    diligencePath: Enterprise customer survey data and quarterly product cohort disclosures from management.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-win-rates
    missingEvidence: >-
      Granular enterprise win-loss data comparing Figma directly against Google Stitch, Adobe Creative Cloud bundles,
      and internal design system tooling.
    whyItMatters: >-
      Direct enterprise displacement metrics would determine whether incumbent software bundling creates pricing
      pressure on Figma's premium Enterprise tier.
    diligencePath: Conduct expert interviews with enterprise procurement heads and review customer design tool evaluation RFPs.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized seat and AI-credit prices, discounts, revenue per credit, inference cost per credit, CAC, gross-margin
      payback, sales cycle, and channel economics by customer segment.
    whyItMatters: >-
      Without these inputs, investors cannot separate price, volume, mix, and cost effects or test whether AI
      consumption is incrementally profitable.
    diligencePath: >-
      Request cohort-level pricing, consumption, contribution-margin, CAC, payback, sales-cycle, renewal, and
      channel-fee schedules from management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Debt and credit-facility terms, contractual and acquisition commitments, forward cash-use plan, minimum cash
      policy, and management's next-financing trigger.
    whyItMatters: >-
      Current liquidity and positive quarterly free cash flow do not by themselves establish forward runway or financing
      independence.
    diligencePath: >-
      Review the latest Form 10-Q debt, commitments, contingencies, and subsequent-events notes, then reconcile them
      with management's operating plan.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Revenue, ARR, paid seats, gross retention, and gross margin split by product, tier, seat type, AI add-on, and
      pay-as-you-go.
    whyItMatters: >-
      Consolidated growth and NDR cannot reveal whether durable seat expansion or emerging consumption revenue is
      driving the result.
    diligencePath: >-
      Request a quarterly revenue and ARR bridge with beginning balances, new logos, seat expansion, price, AI
      consumption, contraction, churn, and foreign exchange.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: AI inference unit economics
    missingEvidence: >-
      Granular reporting detailing direct inference compute expense per Figma agent query and gross margin realized
      across AI credit tiers.
    whyItMatters: >-
      Rapid weekly active adoption of the Figma agent by enterprise customers may dilute core platform gross margins if
      model inference costs outpace credit add-on pricing.
    diligencePath: >-
      Review quarterly cloud infrastructure agreements and request internal unit-economic contribution models for AI
      credits and agent workloads.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: pricing-friction
    missingEvidence: >-
      Granular cohort-level churn, renewal, and seat downgrades resulting from the March 2026 transition to hybrid
      seat-and-credit AI monetization.
    whyItMatters: >-
      Enterprise accounts may resist variable consumption billing, potentially dampening net dollar retention if credit
      overage anxiety leads to reduced non-designer adoption.
    diligencePath: >-
      Request confidential net retention and renewal rate breakdowns segmented by seat-only vs hybrid credit customers
      during Q3/Q4 2026 earnings reviews.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: aws-hosting-commitments
    missingEvidence: Granular multi-year minimum compute spend commitments and pricing schedules between Figma and Amazon Web Services
    whyItMatters: >-
      Directly determines baseline gross margin sensitivity to AWS hosting rate increases and long-term infrastructure
      cost predictability
    diligencePath: >-
      Request AWS enterprise discount program (EDP) schedules, minimum annual commitment levels, and penalty terms
      during private diligence
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: ai-credit-unit-economics
    missingEvidence: >-
      Gross margin breakdown and compute token cost per credit across Figma Make, Code Layers, and First-Party Agent
      operations
    whyItMatters: >-
      Critical to establish whether metered AI credit pricing creates accretive unit margins or subsidizes expensive
      third-party model inference
    diligencePath: >-
      Inspect internal financial telemetry regarding average GPU token consumption per seat across Professional and
      Enterprise tiers
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: ai-gross-margin-breakdown
    missingEvidence: >-
      Segmented gross margin accounting separating pure editor SaaS seat revenue from AI credit consumption compute
      expenses.
    whyItMatters: >-
      Enables precise modeling of long-term terminal gross margin floors as AI agent generation expands relative to seat
      licensing.
    diligencePath: Review Q3 2026 10-Q filing notes and request management disclosure on cloud inference unit economics.
    relatedQuestionRefs:
      - QV002
      - QV006
  - type: private-evidence-only
    severity: material
    topic: ndr-volume-vs-pricing-split
    missingEvidence: >-
      Decomposition of the 136% Net Dollar Retention Rate between net new seat expansion, price tier upgrades, and AI
      credit add-ons.
    whyItMatters: >-
      Determines whether enterprise customer expansion is driven by headcount growth or consumption-based monetization
      volatility.
    diligencePath: Analyze management commentary on earnings calls and conduct enterprise buyer cohort survey checks.
    relatedQuestionRefs:
      - QV003
