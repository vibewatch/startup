chapter:
  number: 8
  title: "Valuation"
  summary: "Figma demonstrates outstanding financial performance with Q2 2026 revenue of $370.1M (accelerating to 48% YoY), an expanded full-year 2026 revenue outlook of $1.463B–$1.467B (39% YoY growth), 85% non-GAAP gross margin, 136% Net Dollar Retention, and $1.7B in balance-sheet liquidity following its July 2025 IPO. Trading at an implied market capitalization of $9.5B (~6.5x FY2026 forward sales), Figma trades at an attractive entry valuation relative to its premier operating profile, yet market overhang from AI gross margin dilution, GAAP operating losses ($(117.3)M in Q2 2026), and private Series E benchmark friction justify a disciplined Buy stance with strict downside monitoring."
sections:
  - id: "investment-thesis-and-core-recommendation"
    title: "Investment Thesis, Anti-Thesis & Strategic Recommendation"
    body: "Figma presents a compelling long-term compounder profile anchored by best-in-class unit economics and near-monopolistic positioning in digital product design engineering. Our core investment thesis rests on four pillars: dominant multi-sided workflow stickiness with over 95% Fortune 500 adoption, durable enterprise expansion demonstrated by a 136% Net Dollar Retention Rate and 46% YoY growth in $100k+ ARR customer cohorts, successful initial monetization of AI credits across 80% of $10k+ ARR accounts, and substantial balance-sheet strength with $1.7 billion in cash and marketable securities as of June 30, 2026. Conversely, the anti-thesis highlights structural headwinds: GAAP operating losses ($(117.3) million in Q2 2026), gross margin compression from AI compute infrastructure costs (down to 84% GAAP and 85% non-GAAP compared to historical 90%+ SaaS peaks), and potential valuation multiple compression if non-GAAP operating margin expansion (projected at 9% for FY2026) fails to scale. Balancing these dynamics against Figma's market valuation of $9.5 billion, we issue a Buy recommendation with high confidence and a medium risk rating, characterizing Figma's current market pricing as attractive for growth software portfolios."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV001"
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "capitalization-history-and-valuation-context"
    title: "Capitalization History, Financing Benchmarks & Entry Discipline"
    body: "Evaluating Figma's valuation trajectory requires cross-referencing its public trading multiples against historical private rounds, M&A benchmarks, and IPO performance. In June 2021, Figma closed a Series E round raising $197.6 million at a $21.30 share price and an implied $9.99 billion post-money valuation. Subsequently, Adobe agreed in September 2022 to acquire Figma for approximately $20 billion; however, regulatory opposition led to the termination of the transaction in December 2023. Figma then executed an initial public offering on the New York Stock Exchange (NYSE: FIG) on July 31, 2025, raising $1.2 billion at an implied valuation of $19.3 billion. Public market secondary tracking in 2026 values Figma at a market capitalization of $9.5 billion, slightly below its 2021 Series E post-money mark despite five continuous years of compounding top-line growth. On an enterprise value basis, adjusting Figma's $9.5 billion equity market capitalization for $1.7 billion in cash and zero funded debt yields an enterprise value of approximately $7.8 billion. Against management's updated FY2026 revenue guidance midpoint of $1.465 billion, Figma trades at an attractive multiple of ~5.3x FY2026 enterprise value to revenue (~6.5x forward price to sales), reflecting significant public equity multiple compression from its $19.3 billion IPO level and creating a favorable margin of safety."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
  - id: "valuation-scenarios-and-thesis-break-triggers"
    title: "Scenario Analysis, Exit Readiness & Thesis-Break Triggers"
    body: "To frame expected equity returns, we construct a probability-weighted scenario model spanning bull, base, and bear operating cases through fiscal year 2027. Under our Base Case (50% probability), Figma sustains a 35% compound top-line expansion, reaching ~$1.98 billion in FY2027 revenue with non-GAAP operating margins expanding to 14% and free cash flow margins reaching 18%, justifying an 8.0x EV/revenue multiple and a target market equity valuation of $15.5 billion (implied +63% return). The Bull Case (25% probability) assumes aggressive AI credit monetization attach and Code Layers adoption across enterprise accounts, driving 44% FY2027 revenue growth to $2.11 billion and 22% free cash flow margin, commanded by a 10.5x multiple reflecting a $21.5 billion valuation (+126% return). The Bear Case (25% probability) models AI gross margin dilution below 80%, deceleration of Net Dollar Retention below 115%, and multiple compression to 4.0x EV/revenue on $1.70 billion in FY2027 revenue, yielding a conservative $6.5 billion valuation (-32% downside). Thesis-break triggers that would mandate an immediate downgrade to Avoid or Track include: Net Dollar Retention dropping below 120% for two consecutive quarters, non-GAAP operating margin contracting below 5%, structural loss of enterprise customer expansion in >$100k ARR accounts, or evidence of generative design alternatives eroding core editor seat demand."
    claimRefs:
