      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Non-Designer Expansion Wedge
            body: >-
              Figma's rapid enterprise expansion is propelled by non-designer adoption, with developers and product
              managers accounting for two-thirds of active users and 60% of Figma Make file generation. This dynamic
              expands the addressable seat pool within enterprise accounts well beyond creative design teams.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
          - type: callout
            title: Hybrid AI Credit Friction and Performance Overhead
            body: >-
              The introduction of AI credit limits alongside seat subscriptions introduces procurement friction, while
              user feedback highlights recurring performance degradation when handling complex enterprise design systems
              over unstable network connections.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Intellectual Property, and AI Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Figma faces an evolving legal and regulatory environment driven by the integration of generative AI into
              core workflows and the enforcement of international compliance frameworks. In its Form 10-K, Figma
              highlights that its AI offerings, such as Figma Make and integrated AI features, rely significantly on
              datasets and foundation models that carry potential risks regarding intellectual property infringement,
              training data provenance, and reputational liability. Furthermore, evolving regulatory regimes such as the
              European Union Artificial Intelligence Act impose stringent transparency, conformity assessment, and
              governance mandates on providers of AI systems. Compliance with varying state, federal, and international
              privacy laws requires continuous operational overhead and contractual adjustments. Figma mitigates these
              exposures through its enterprise Terms of Service and incorporated Data Processing Addendum, which govern
              customer content rights and mandate binding individual arbitration with class action waivers. However,
              hosting third-party community assets and generative tools creates residual legal exposure around copyright
              indemnification and user-generated content moderation across jurisdictions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
