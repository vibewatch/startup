        title: Leadership Coverage and Concentrated Control
        blocks:
          - type: paragraph
            body: >-
              Current 2026 company materials identify co-founder Dylan Field as Chief Executive Officer and Praveer
              Melwani as Chief Financial Officer; the S-1 also identified Field as President and board chair and Melwani
              as Treasurer. Evan Wallace is the other co-founder, but the retained sources do not establish a current
              operating role for him. Governance diligence should distinguish role continuity from control. The S-1
              disclosed a multi-class structure, a voting proxy from Wallace and the Wu-Wallace Family Trust to Field,
              and a company-stated high dependence on Field for technology, product, vision, and strategic direction.
              Those filing disclosures establish a key-person and minority-shareholder risk, but the preliminary filing
              does not provide a reliable current voting percentage. A current proxy statement is required to update
