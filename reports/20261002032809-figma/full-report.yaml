      - number: '7.2'
        title: Operational Reliability, Developer Ecosystem, and Technical Debt
        blocks:
          - type: paragraph
            body: >-
              Rapid feature development and expanding multi-product surfaces have accumulated technical debt across
              Figma’s platform. As detailed in SEC filings, the rapid growth from a single design tool into a broad
              platform spanning Figma Design, FigJam, Dev Mode, Figma Slides, and AI-driven capabilities places acute
              pressure on engineering and operational resources. Operational friction is visible in developer
              integration layers: for instance, open-source tools such as the Figma Console Model Context Protocol
              bridge report connection drops and bridge instability requiring client restarts. Furthermore, community
              forum feedback regarding Figma Make demonstrates significant user demand for enhanced trust, deterministic
              planning gates, and verification controls before automated code and design generation occur. While Figma
              actively recruits specialized operational and business finance talent to optimize cross-functional
              workflows and address scaling bottlenecks, maintaining system performance, cross-product stability, and
              high developer bridge reliability remains a critical operational challenge.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
