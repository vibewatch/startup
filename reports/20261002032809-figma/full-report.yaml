      - number: '7.4'
        title: Financial Model Transition, Margin Compression, and Market Overhang
        blocks:
          - type: paragraph
            body: >-
              The transition of Figma’s commercial engine from purely seat-based subscriptions to hybrid metered AI
              credit billing introduces gross margin volatility and forecasting complexity. Independent equity analysis
              underscores that while operating cash flows remain positive ($97.3M in Q1 2026), AI inference costs
              elevated cost of revenue by 112% year-over-year in 2025, depressing non-GAAP gross margins from 92% to 82%
              before recovering to 85% in Q2 2026. Starting in March 2026, Figma initiated enforcement of AI credit
              limits, adding billing complexity, customer friction, and breakage accounting challenges. Simultaneously,
              the public equity faces technical supply overhang from post-IPO lock-up expirations, with an estimated $6
              billion in low-cost-basis shares unlocking in August 2026. Figma’s $1.7 billion cash and marketable
              securities cushion provides substantial runway, yet long-term multiple expansion depends on proving that
              metered AI credit revenue can consistently outpace foundation model compute inflation.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI Inference Cost Inflation and Gross Margin Compression
            body: >-
              AI inference and model infrastructure costs surged 112% year-over-year in 2025, compressing non-GAAP gross
              margins from historical peaks of 92% down to 82%–85%. If customer adoption of Figma Make and Figma Agent
              accelerates without proportional monetization through metered AI credits, profitability margins will face
              persistent structural headwind.
            calloutType: risk
            claimRefs:
              - CR002
              - CR015
          - type: callout
            title: Working Capital Resilience vs. Equity Lock-up Pressure
            body: >-
              Figma maintains an exceptional liquidity buffer with $1.7 billion in cash and marketable securities and
              positive free cash flow generation ($53.2 million in Q2 2026). However, this balance-sheet strength is
              currently overshadowed in public equity markets by an estimated $6 billion August 2026 lock-up expiration
              and post-IPO valuation multiple contraction.
            calloutType: insight
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis & Strategic Recommendation
        blocks:
          - type: paragraph
            body: >-
              Figma presents a compelling long-term compounder profile anchored by best-in-class unit economics and
              near-monopolistic positioning in digital product design engineering. Our core investment thesis rests on
              four pillars: dominant multi-sided workflow stickiness with over 95% Fortune 500 adoption, durable
              enterprise expansion demonstrated by a 136% Net Dollar Retention Rate and 46% YoY growth in $100k+ ARR
              customer cohorts, successful initial monetization of AI credits across 80% of $10k+ ARR accounts, and
              substantial balance-sheet strength with $1.7 billion in cash and marketable securities as of June 30,
              2026. Conversely, the anti-thesis highlights structural headwinds: GAAP operating losses ($(117.3) million
              in Q2 2026), gross margin compression from AI compute infrastructure costs (down to 84% GAAP and 85%
              non-GAAP compared to historical 90%+ SaaS peaks), and potential valuation multiple compression if non-GAAP
              operating margin expansion (projected at 9% for FY2026) fails to scale. Balancing these dynamics against
              Figma's market valuation of $9.5 billion, we issue a Buy recommendation with high confidence and a medium
              risk rating, characterizing Figma's current market pricing as attractive for growth software portfolios.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
