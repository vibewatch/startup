        title: From Browser Design Tool to Product-Development Platform
        blocks:
          - type: paragraph
            body: >-
              The filing describes Figma as a browser-based, collaborative platform spanning the lifecycle from ideas to
              shipped digital products. The homepage similarly positions one workspace for product development, while
              Community exposes libraries, plugins, widgets, templates, AI skills, and remixable Figma Make projects. An
