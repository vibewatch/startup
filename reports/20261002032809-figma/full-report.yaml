      - number: '5.2'
        title: Developer Handoff, Dev Mode, and Code-Based Integration
        blocks:
          - type: paragraph
            body: >-
              The bridge between visual interface design and software engineering represents Figma's primary workflow
              expansion vector and operational lock-in mechanism [CE001, CE002]. Dev Mode provides software engineers
              with a dedicated interface inside Figma Design to inspect component box models, extract CSS/SVG
              properties, compare visual revision diffs, and access items marked ready for development [CE001, CE002,
              CE007]. Through Code Connect and IDE plugins, engineering teams link visual design components directly to
              production code repositories in React, Vue, or iOS native frameworks [CE006, CE007]. However, technical
              design analysis reveals an enduring architectural gap: Figma's components are fundamentally visual mockups
              that remain decoupled from live codebases, requiring developers to manually translate layouts into
              functional components [CE006, CE007]. In complex enterprise environments, this separation forces teams to
              maintain two parallel representations of the same design system—one in Figma files and one in Git
              repositories—introducing component drift, style synchronization overhead, and file management challenges
              when projects expand to thousands of components [CE006, CE007].
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
      - number: '5.3'
        title: Technical Architecture, AI Agent Layer, and Operating Trade-offs
        blocks:
          - type: paragraph
            body: >-
              Figma's underlying technical architecture is distinguished by a custom client-side C++ vector rendering
              engine compiled to WebAssembly and rendered via WebGL, coupled with a real-time multiplayer
              synchronization engine that propagates canvas state across concurrent web clients [CE001, CE003, CE005].
              At its Config 2026 conference, Figma accelerated its technological differentiation by embedding native
              generative intelligence directly into this canvas layer [CE004, CE005]. Key architectural additions
              include Code Layers, which convert static design components into interactive, code-backed prototypes that
              manipulate functional UI or edit code directly, and the Figma agent, a first-party conversational agent
              powered by proprietary models and multi-model routing that automates layout refactoring, shaders, and
              animations [CE004, CE005]. Enterprise governance is enabled through Skills, which allow organizations to
              train the Figma agent on custom component libraries and design system standards [CE004]. Nevertheless,
              enterprise operating constraints persist: large design files experience documented performance slowdowns,
              continuous internet connectivity is required for core multi-tenant operations, and direct AI inference
              costs across weekly active agent users introduce gross margin variability [CE004, CE006].
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: From Static Design Canvas to Full-Stack Creative Operating System
            body: >-
              Figma's technical evolution through Config 2026 marks a structural shift from visual UI prototyping to
              full-stack product creation. By embedding Code Layers, prompt-to-app tools like Figma Make, and the
              conversational Figma agent directly into the WebGL canvas, Figma is converting design assets into
              interactive code-backed components, expanding its addressable footprint into software engineering and
              marketing workflows.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: callout
            title: Large File Performance Degradation and Parallel Codebase Maintenance
            body: >-
              Despite its WebAssembly rendering performance, Figma experiences documented responsiveness slowdowns and
              file organization friction when managing massive enterprise design systems. Furthermore, because Figma
              component libraries exist in visual isolation from live production Git repositories, engineering teams
              face ongoing maintenance overhead to prevent drift between design tokens and production code.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Figma operates a horizontal collaboration platform serving a diverse range of organizations from
              seed-stage startups to Fortune 500 multinationals. According to commercial technographic tracking and
              regulatory disclosures, 95% of Fortune 500 enterprises deploy Figma, including technology leaders like IBM
              and Samsung, industrial manufacturers like Siemens and Ford, and financial institutions such as Morgan
              Stanley. The enterprise customer profile skews heavily toward established mid-market and enterprise
              organizations, with companies employing 51 to 500 personnel accounting for 38.1% of customer domains and
              large enterprises with over 10,000 employees representing 19.4%. Within customer organizations, Figma has
              transcended specialized UI/UX design departments: approximately two-thirds of active users are
              non-designers, and software developers now represent roughly 30% of total platform users. In newer product
              surfaces like Figma Make, nearly 60% of all prompt-generated design files originate from non-designer
              roles, illustrating how technical and operational personas increasingly drive intra-company expansion.
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
