      - number: '6.3'
        title: Enterprise Production Proof and Retention Risks
        blocks:
          - type: paragraph
            body: >-
              Enterprise reference case studies demonstrate deep production integration across mission-critical software
              and hardware development cycles. Global industrial manufacturer Mitsubishi Electric adopted Figma
              company-wide in 2023 across consumer appliance and aerospace divisions when its legacy design tooling
              entered maintenance mode. Technology hardware leader Hewlett-Packard documented saving 98 minutes per
              developer weekly through Dev Mode standardization, translating to a 50% reduction in development cycle
              time and a reported 500% ROI. In rapid operational prototyping, logistics provider Flexport utilized Figma
              Make to redesign its core factory onboarding flow and ship production updates within weeks. However, rapid
              expansion across enterprise surfaces introduces material operational and commercial risks. User review
              aggregations indicate that performance latency on large files and strict reliance on active network
              connectivity represent persistent technical pain points. Furthermore, Figma's March 2026 transition from
              flat seat subscriptions to a hybrid seat-plus-AI-credit consumption model creates procurement friction,
              prompting central IT departments to enforce stricter seat governance via add-ons like Governance Plus to
              manage variable cost exposure.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
