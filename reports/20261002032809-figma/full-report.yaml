              - CU010
      - number: '6.2'
        title: Growth Trajectory and Product-Led Expansion Loops
        blocks:
          - type: paragraph
            body: >-
              Figma's customer growth model is anchored in a browser-native multiplayer architecture that functions
              directly as an organic customer acquisition engine. By allowing free, unlimited canvas access for viewers
              and commenters while charging exclusively for editor seats, shared design URLs turn everyday stakeholder
              reviews into viral user acquisition channels. Approximately 70% of Figma's enterprise agreements originate
              from individual self-serve signups that organically expanded across squads before triggering centralized
              procurement reviews. This product-led motion has expanded Figma's user footprint to over 13 million
              monthly active users worldwide, with international users outside the United States accounting for 85% of
              active engagement. Financial results for Q2 2026 demonstrated sustained expansion durability, with Paid
              Customers generating over $10,000 in ARR growing 34% year-over-year to 15,964 accounts, while the
              $100,000+ ARR tier expanded 46% to 1,635 accounts. Net Dollar Retention Rate remained best-in-class at
              136%, supported by rapid early monetization of new AI capabilities where over 80% of $10,000+ ARR
              customers consumed weekly AI credits and over 50% actively utilized the first-party Figma agent.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
