  - id: FE001
    title: Figma Platform Architecture and Product Stack
    type: stack
    summary: >-
      Six-tier platform architectural stack illustrating client rendering, multi-product workspace modules, generative
      AI automation, cloud synchronization, and developer integration infrastructure.
    data:
      layers:
        - label: Collaboration & Ecosystem Surface
          detail: Top-level shared workspace and third-party extension distribution
          items:
            - label: Figma Community
              description: Public repository of UI kits, plugins, widgets, and design systems
            - label: Figma Slides & Buzz
              description: Interactive presentation decks and scalable brand marketing assets
            - label: FigJam Online Whiteboard
              description: Visual brainstorming, user journey mapping, and team diagramming
        - label: Core Canvas & Interface Authoring
          detail: Primary visual design, vector editing, and component systems
          items:
            - label: Figma Design Canvas
              description: Vector networks, responsive auto layout, and component variants
            - label: Interactive Prototyping
              description: Stateful transitions, variables, and interaction triggers
            - label: Design Systems Library
              description: Shared tokens, styles, and published UI component libraries
        - label: Developer Handoff & Code Integration
          detail: Dedicated developer inspection, code generation, and IDE bridges
          items:
            - label: Dev Mode
              description: Dedicated developer inspection, CSS/SVG extraction, and visual diffs
            - label: Code Connect
              description: Direct mapping of design components to production code repositories
            - label: IDE Extensions
              description: VS Code and native environment integrations for front-end engineers
        - label: Generative AI & Agent Layer
          detail: Canvas-native intelligence and prompt-to-production creation tools
          items:
            - label: Figma Agent
              description: First-party canvas assistant for layout, shaders, and workflow automation
            - label: Figma Make & Code Layers
              description: Prompt-driven interactive UI generation and code-backed prototyping
            - label: Skills & Weave Tools
              description: Custom organizational governance instructions and creative AI tools
        - label: Client Rendering & Interaction Engine
          detail: High-performance browser-native graphics and canvas computation
          items:
            - label: WebAssembly Core
              description: Custom C++ compiled client-side computation and geometry engine
            - label: WebGL Rendering Surface
              description: Hardware-accelerated browser vector and raster graphics rendering
            - label: Local Memory & Cache Manager
              description: In-memory document object model and canvas dirty-region tracking
        - label: Multi-Tenant Cloud & Sync Infrastructure
          detail: Real-time state replication, security, and multi-model inference backends
          items:
            - label: Real-time Multiplayer Sync
              description: Cloud-hosted multi-tenant document state and live cursor coordination
            - label: Multi-Model AI Inference
              description: Hybrid routing across first-party models, Google Gemini, and OpenAI
            - label: Enterprise Security & Storage
              description: Cloud document persistence, encryption, SOC2/ISO compliance, and IAM
    approximationNotes: >-
      Platform architecture synthesized from Figma technical documentation, Config 2026 announcements, and Sacra
      technology teardowns.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Figma's multi-tier customer journey from browser-based viral adoption to enterprise platform standardization.
    approximationNotes: >-
      Customer journey stages synthesize bottom-up PLG onboarding mechanisms and enterprise procurement transitions
      documented in Figma investor filings and industry case studies.
    data:
      items:
        - label: 1. Individual Discovery & Free Usage
          stage: Discovery
          userType: Individual Designer / Developer
          channel: Organic web, Figma Community, peer referral
          touchpoints:
            - Free Starter tier file creation and canvas exploration
            - Remixing open-source UI kits and community plugins
        - label: 2. Peer Multiplayer Collaboration
          stage: Viral Expansion
          userType: Cross-Functional Squad
          channel: Shared browser link / invite link
          touchpoints:
            - Multiplayer canvas review with visible live cursors
            - Uncapped viewer and commenter invitations without payment barriers
        - label: 3. Team Standardization
          stage: Paid Conversion
          userType: Design Lead / Engineering Manager
          channel: Self-serve credit card upgrade
          touchpoints:
            - Professional tier subscription at $15/month per editor
            - Publishing shared design component libraries and style guides
        - label: 4. Cross-Functional Developer Handoff
          stage: Departmental Scale
          userType: Product Managers & Software Engineers
          channel: Dev Mode integration
          touchpoints:
            - Dev Mode token inspection and GitHub / Jira Code Connect
            - Two-thirds non-designer user base activation across product teams
        - label: 5. Enterprise Platform Standardization
          stage: Enterprise Licensing
          userType: VP of Product, CIO, Central IT Procurement
          channel: Direct sales & enterprise contract
          touchpoints:
            - Organization or Enterprise tier contract with SCIM and SSO
            - Governance Plus add-on deployment for security and compliance
        - label: 6. AI-Powered Workflow Extension
          stage: Platform Expansion
          userType: Full Organization (Business & Technical)
          channel: Figma Make & First-Party Agents
          touchpoints:
            - Prompt-based app prototyping in Figma Make
            - Weekly consumption of allocated AI credit pools and agent skills
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU014
      - CU015
  - id: FR001
    title: Risk severity and mitigation matrix
    type: matrix
    summary: >-
      Evaluates primary risk categories across likelihood, impact, mitigation maturity, and residual severity. Cloud
      infrastructure concentration and AI compute margin dilution present the highest residual exposures.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Cloud hosting single-provider concentration
          values:
            - label: medium
              tone: warning
              detail: AWS outages occur periodically across cloud regions
            - label: critical
              tone: negative
              detail: Complete disruption of real-time collaborative canvas and data access
            - label: medium
              tone: warning
              detail: Enterprise-grade AWS infrastructure and multi-region availability designs
            - label: high
              tone: negative
              detail: Single-provider lock-in creates unhedged infrastructure counterparty exposure
        - label: AI inference cost inflation and gross margin compression
          values:
            - label: high
              tone: negative
              detail: AI compute adoption outpaces base subscription revenues
            - label: high
              tone: negative
              detail: 112% surge in cost of revenue compressing historical 90%+ gross margins
            - label: medium
              tone: warning
              detail: Commercialization of metered AI credit subscriptions and PAYG billing tiers
            - label: high
              tone: negative
              detail: Customer resistance to usage limits and unpredictable inference cost scaling
        - label: Frontier AI competitive displacement
          values:
            - label: medium
              tone: warning
              detail: Rapid emergence of generative UI tools like Claude Design
            - label: high
              tone: negative
              detail: Potential erosion of entry-level UI design seat expansion
            - label: medium
              tone: warning
              detail: Canvas-native agent tooling, Code Layers, and established design systems
            - label: medium-high
              tone: warning
              detail: Requires continuous innovation to defend design workflow dominance
        - label: Regulatory AI governance and copyright exposure
          values:
            - label: medium
              tone: warning
              detail: Active enforcement of EU AI Act and evolving US litigation
            - label: high
              tone: negative
              detail: Compliance fines, mandatory feature alterations, or copyright claims
            - label: medium
              tone: warning
              detail: Robust terms of service, commercial model indemnities, and DPA agreements
            - label: medium
              tone: neutral
              detail: Ongoing compliance overhead manageable given strong balance sheet liquidity
        - label: Technical debt from multi-product surface expansion
          values:
            - label: high
              tone: negative
              detail: Rapid expansion into slides, sites, buzz, and code generation
            - label: medium
              tone: warning
              detail: Platform latency, integration friction, and edge-case bugs
            - label: medium
              tone: warning
              detail: Continuous engineering refactoring and specialized operational hiring
            - label: medium
              tone: neutral
              detail: Manageable operational drag but diverts engineering from core innovations
        - label: Equity lock-up share supply overhang
          values:
            - label: high
              tone: negative
              detail: August 2026 unlock of estimated $6B in low-cost-basis shares
            - label: medium
              tone: warning
              detail: Near-term downward trading pressure on public equity valuation multiples
            - label: low-medium
              tone: warning
              detail: Pre-planned 10b5-1 executive selling schedules and strong cash flow generation
            - label: medium-high
              tone: warning
              detail: Persistent supply overhang until trading volumes absorb insider distributions
    approximationNotes: >-
      Risk ratings represent qualitative synthesis of disclosures in Figma's SEC Form 10-K, quarterly earnings, and
      market research reports.
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR010
      - CR015
      - CR016
