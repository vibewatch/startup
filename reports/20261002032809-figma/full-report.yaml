figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Eight source-dated milestones show Figma's progression from founding through public-company scale without treating
      secondary liquidity as company funding.
    data:
      items:
        - date: '2012'
          label: Figma started
          detail: >-
            Dylan Field and Evan Wallace started Figma after meeting at Brown University; the company was incorporated
            in Delaware in October.
          tone: positive
          claimRefs:
            - CO001
        - date: '2021'
          label: FigJam launched
          detail: Figma expanded into earlier ideation workflows with its online collaborative whiteboard.
          tone: positive
          claimRefs:
            - CO005
        - date: '2023'
          label: Dev Mode released
          detail: A developer-focused space was added to translate design concepts into coded products.
          tone: positive
          claimRefs:
            - CO006
        - date: 2024-06
          label: Secondary tender opened
          detail: >-
            A tender ultimately transferred approximately $566.7 million of existing shares; Figma did not receive the
            sale proceeds.
          tone: neutral
          claimRefs:
            - CO016
        - date: '2025'
          label: Product portfolio broadened
          detail: Figma launched Sites, Make, Buzz, and Draw, extending beyond its original design workflow.
          tone: positive
          claimRefs:
            - CO008
        - date: '2025-07-01'
          label: Public listing process documented
          detail: The S-1 described an initial public offering and an application to list Class A shares on the NYSE as FIG.
          tone: neutral
          claimRefs:
            - CO003
        - date: '2026-06-24'
          label: Config 2026 capabilities rolled out
          detail: Motion, Weave tools, agent updates, and generative plugins began staged availability around Config.
          tone: positive
          claimRefs:
            - CO009
        - date: '2026-08-05'
          label: Q2 2026 scale reported
          detail: >-
            Figma reported $370.1 million of quarterly revenue and expanding customer cohorts for the quarter ended June
            30.
          tone: positive
          claimRefs:
            - CO012
            - CO013
    approximationNotes: >-
      Year-only dates preserve the source's stated precision; 2024-06 is the tender opening month, and the Q2 release
      date is distinct from the June 30 measurement date.
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO006
      - CO008
      - CO009
      - CO012
      - CO013
      - CO016
