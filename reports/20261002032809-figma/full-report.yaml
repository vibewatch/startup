      - number: '7.3'
        title: Platform Infrastructure Concentration and Counterparty Exposure
        blocks:
          - type: paragraph
            body: >-
              Figma’s platform architecture exhibits severe single-vendor concentration on Amazon Web Services for its
              cloud hosting, storage, and compute infrastructure. Disruption, capacity limits, or contractual repricing
              by AWS poses an immediate threat to service availability and operational margins, as migrating to
              alternative cloud infrastructure or self-hosting would require massive engineering expenditures and cause
              prolonged downtime. Concurrently, Figma’s AI expansion deepens dependencies on external foundation model
              providers—including Google for Gemini and Imagen models, as well as OpenAI and Anthropic integrations—for
              core generative features. This counterparty exposure is compounded by competitive dynamics, as Anthropic’s
              launch of Claude Design introduces direct frontier AI competition that pressures Figma’s design workflows.
              Management monitors these partner relationships through enterprise SLAs and multi-model diversification,
              but residual dependency on concentrated infrastructure and frontier AI model vendors remains high.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
