            body: >-
              Figma was started in 2012 by Dylan Field and Evan Wallace and was incorporated in Delaware that October.
              Its July 2025 registration statement listed 760 Market Street in San Francisco as the principal executive
              office; the retained pool does not establish whether that address or the broader location footprint
              changed by the run date. Figma's 2026 earnings releases identify the company as NYSE: FIG, establishing
