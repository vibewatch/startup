      - number: '8.2'
        title: Capitalization History, Financing Benchmarks & Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Evaluating Figma's valuation trajectory requires cross-referencing its public trading multiples against
              historical private rounds, M&A benchmarks, and IPO performance. In June 2021, Figma closed a Series E
              round raising $197.6 million at a $21.30 share price and an implied $9.99 billion post-money valuation.
              Subsequently, Adobe agreed in September 2022 to acquire Figma for approximately $20 billion; however,
              regulatory opposition led to the termination of the transaction in December 2023. Figma then executed an
              initial public offering on the New York Stock Exchange (NYSE: FIG) on July 31, 2025, raising $1.2 billion
              at an implied valuation of $19.3 billion. Public market secondary tracking in 2026 values Figma at a
              market capitalization of $9.5 billion, slightly below its 2021 Series E post-money mark despite five
              continuous years of compounding top-line growth. On an enterprise value basis, adjusting Figma's $9.5
              billion equity market capitalization for $1.7 billion in cash and zero funded debt yields an enterprise
              value of approximately $7.8 billion. Against management's updated FY2026 revenue guidance midpoint of
              $1.465 billion, Figma trades at an attractive multiple of ~5.3x FY2026 enterprise value to revenue (~6.5x
              forward price to sales), reflecting significant public equity multiple compression from its $19.3 billion
              IPO level and creating a favorable margin of safety.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario Analysis, Exit Readiness & Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              To frame expected equity returns, we construct a probability-weighted scenario model spanning bull, base,
              and bear operating cases through fiscal year 2027. Under our Base Case (50% probability), Figma sustains a
              35% compound top-line expansion, reaching ~$1.98 billion in FY2027 revenue with non-GAAP operating margins
              expanding to 14% and free cash flow margins reaching 18%, justifying an 8.0x EV/revenue multiple and a
              target market equity valuation of $15.5 billion (implied +63% return). The Bull Case (25% probability)
              assumes aggressive AI credit monetization attach and Code Layers adoption across enterprise accounts,
              driving 44% FY2027 revenue growth to $2.11 billion and 22% free cash flow margin, commanded by a 10.5x
              multiple reflecting a $21.5 billion valuation (+126% return). The Bear Case (25% probability) models AI
              gross margin dilution below 80%, deceleration of Net Dollar Retention below 115%, and multiple compression
              to 4.0x EV/revenue on $1.70 billion in FY2027 revenue, yielding a conservative $6.5 billion valuation
              (-32% downside). Thesis-break triggers that would mandate an immediate downgrade to Avoid or Track
              include: Net Dollar Retention dropping below 120% for two consecutive quarters, non-GAAP operating margin
              contracting below 5%, structural loss of enterprise customer expansion in >$100k ARR accounts, or evidence
              of generative design alternatives eroding core editor seat demand.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Strategic Entry Stance: Capitalizing on Multiple Compression'
            body: >-
              At an equity market valuation of $9.5 billion (~5.3x FY2026 EV/sales), Figma trades at an unprecedented
              discount relative to its operating profile (48% YoY quarterly revenue growth and 136% NDR). The market has
              severely discounted Figma from its $19.3 billion IPO valuation, creating an attractive risk-adjusted entry
              point for patient investors.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
          - type: callout
            title: AI Inference Cost Structure & GAAP Loss Overhang
            body: >-
              While non-GAAP operating results are positive ($36.1 million in Q2 2026), GAAP operating losses of
              $(117.3) million and gross margin compression to 84% GAAP demonstrate that AI-driven features (Figma Make,
              Agent, Code Layers) introduce compute cost volatility that must be closely tracked.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV015
