  - id: TV001
    title: Investment Recommendation & Execution Framework
    columns:
      - Parameter
      - Assessment / Metric
      - Benchmark / Target Range
      - Strategic & Portfolio Implication
    rows:
      - - Recommendation
        - Buy
        - Outperform / Accumulate
        - Favorable risk-reward profile backed by accelerating top-line growth and balance-sheet cash
      - - Confidence
        - High
        - High / Medium / Low
        - Supported by official SEC/Q2 financial disclosures, audited cash reserves, and public filings
      - - Risk Rating
        - Medium
        - Low / Medium / High / Critical
        - Tempered by substantial balance-sheet liquidity offset by GAAP losses and AI compute costs
      - - Valuation Stance
        - Attractive
        - Attractive / Fair / Stretched / Expensive
        - Market cap of $9.5B (~5.3x FY2026 EV/Sales) represents deep discount vs historical IPO level
      - - Target Return Profile
        - 18-24 Month Horizon
        - 50% - 65% Upside Target
        - Projected re-rating toward $15.0B-$15.5B equity valuation as non-GAAP margins expand
    notes: Recommendation and confidence ratings synthesize Q2 2026 actuals, public guidance, and current market valuations.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
  - id: TV002
    title: Core Investment Thesis & Anti-Thesis Matrix
    columns:
      - Angle
      - Primary Evidence & Operational Rationale
      - Counter-Argument / Vulnerability
      - Thesis-Altering Condition
    rows:
      - - Revenue Scale & Growth
        - Q2 2026 revenue of $370.1M grew 48% YoY; guidance raised to $1.465B midpoint
        - Full year guidance implies deceleration to 36% YoY growth in Q3 2026
        - Deceleration below 25% YoY growth in annual revenue run rate
      - - Net Expansion & Retention
        - Net Dollar Retention Rate remained strong at 136% with 15,964 $10k+ ARR accounts
        - Growth driven partly by temporary Config marketing spend and early credit attach
        - NDR compression below 120% indicating seat plateauing
      - - Gross Margin & Compute
        - GAAP gross profit of $309.6M (84% margin); non-GAAP gross margin maintained at 85%
        - Cloud inference and AI feature compute drive gross margin down from 90%+ peaks
        - Non-GAAP gross margin eroding below 80% due to unrecouped model compute
      - - Operating Profitability
        - Non-GAAP operating income was $36.1M (10% margin); Q2 FCF was $53.2M (14% margin)
        - GAAP loss from operations reached $(117.3)M on elevated sales & marketing expenses
        - Inability to reach GAAP operating breakeven by fiscal year 2028
      - - Valuation & Multiple
        - Valued at $9.5B market cap (~6.5x forward sales), trading below 2021 Series E round
        - Public markets pricing structural risk of AI commoditization in software design
        - Multiple de-rating below 4.0x EV/forward sales under market-wide multiple contraction
    notes: Metrics reflect Q2 2026 financial reporting released August 5, 2026 and secondary market equity tracking.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
