chapter:
  number: 7
  title: "Risks"
  summary: >-
    Figma’s risk profile centers on AI margin compression and compute cost inflation, commercial model transition
    friction from seat enforcement to metered credits, infrastructure concentration on AWS and external foundation
    model providers, and equity lock-up overhang. While cash flow and balance sheet liquidity remain robust, navigating
    emerging AI competition and platform dependencies requires strict operational controls and diligence tracking.
sections:
  - id: "regulatory-and-legal-risks"
    title: "Regulatory, Intellectual Property, and AI Governance Risk"
    body: >-
      Figma faces an evolving legal and regulatory environment driven by the integration of generative AI into core
      workflows and the enforcement of international compliance frameworks. In its Form 10-K, Figma highlights that its
      AI offerings, such as Figma Make and integrated AI features, rely significantly on datasets and foundation models
      that carry potential risks regarding intellectual property infringement, training data provenance, and
      reputational liability. Furthermore, evolving regulatory regimes such as the European Union Artificial Intelligence
      Act impose stringent transparency, conformity assessment, and governance mandates on providers of AI systems.
      Compliance with varying state, federal, and international privacy laws requires continuous operational overhead and
      contractual adjustments. Figma mitigates these exposures through its enterprise Terms of Service and incorporated
      Data Processing Addendum, which govern customer content rights and mandate binding individual arbitration with class
      action waivers. However, hosting third-party community assets and generative tools creates residual legal exposure
      around copyright indemnification and user-generated content moderation across jurisdictions.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR012"
    tableRefs:
      - "TR001"
  - id: "operational-and-security-risks"
    title: "Operational Reliability, Developer Ecosystem, and Technical Debt"
    body: >-
      Rapid feature development and expanding multi-product surfaces have accumulated technical debt across Figma’s
      platform. As detailed in SEC filings, the rapid growth from a single design tool into a broad platform spanning
      Figma Design, FigJam, Dev Mode, Figma Slides, and AI-driven capabilities places acute pressure on engineering and
      operational resources. Operational friction is visible in developer integration layers: for instance, open-source
      tools such as the Figma Console Model Context Protocol bridge report connection drops and bridge instability
      requiring client restarts. Furthermore, community forum feedback regarding Figma Make demonstrates significant user
      demand for enhanced trust, deterministic planning gates, and verification controls before automated code and design
      generation occur. While Figma actively recruits specialized operational and business finance talent to optimize
      cross-functional workflows and address scaling bottlenecks, maintaining system performance, cross-product stability,
      and high developer bridge reliability remains a critical operational challenge.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR013"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-and-platform-dependency-risks"
    title: "Platform Infrastructure Concentration and Counterparty Exposure"
    body: >-
      Figma’s platform architecture exhibits severe single-vendor concentration on Amazon Web Services for its cloud
      hosting, storage, and compute infrastructure. Disruption, capacity limits, or contractual repricing by AWS poses an
      immediate threat to service availability and operational margins, as migrating to alternative cloud infrastructure or
      self-hosting would require massive engineering expenditures and cause prolonged downtime. Concurrently, Figma’s AI
      expansion deepens dependencies on external foundation model providers—including Google for Gemini and Imagen models,
      as well as OpenAI and Anthropic integrations—for core generative features. This counterparty exposure is compounded
      by competitive dynamics, as Anthropic’s launch of Claude Design introduces direct frontier AI competition that
      pressures Figma’s design workflows. Management monitors these partner relationships through enterprise SLAs and
      multi-model diversification, but residual dependency on concentrated infrastructure and frontier AI model vendors
      remains high.
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "financial-model-and-execution-risks"
    title: "Financial Model Transition, Margin Compression, and Market Overhang"
    body: >-
      The transition of Figma’s commercial engine from purely seat-based subscriptions to hybrid metered AI credit billing
      introduces gross margin volatility and forecasting complexity. Independent equity analysis underscores that while
      operating cash flows remain positive ($97.3M in Q1 2026), AI inference costs elevated cost of revenue by 112%
      year-over-year in 2025, depressing non-GAAP gross margins from 92% to 82% before recovering to 85% in Q2 2026.
      Starting in March 2026, Figma initiated enforcement of AI credit limits, adding billing complexity, customer
      friction, and breakage accounting challenges. Simultaneously, the public equity faces technical supply overhang from
      post-IPO lock-up expirations, with an estimated $6 billion in low-cost-basis shares unlocking in August 2026. Figma’s
      $1.7 billion cash and marketable securities cushion provides substantial runway, yet long-term multiple expansion
      depends on proving that metered AI credit revenue can consistently outpace foundation model compute inflation.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR009"
      - "CR015"
      - "CR016"
callouts:
  - calloutType: "risk"
    title: "AI Inference Cost Inflation and Gross Margin Compression"
    body: >-
      AI inference and model infrastructure costs surged 112% year-over-year in 2025, compressing non-GAAP gross margins
      from historical peaks of 92% down to 82%–85%. If customer adoption of Figma Make and Figma Agent accelerates without
      proportional monetization through metered AI credits, profitability margins will face persistent structural headwind.
    claimRefs:
      - "CR002"
      - "CR015"
  - calloutType: "insight"
    title: "Working Capital Resilience vs. Equity Lock-up Pressure"
    body: >-
      Figma maintains an exceptional liquidity buffer with $1.7 billion in cash and marketable securities and positive free
      cash flow generation ($53.2 million in Q2 2026). However, this balance-sheet strength is currently overshadowed in
      public equity markets by an estimated $6 billion August 2026 lock-up expiration and post-IPO valuation multiple
      contraction.
    claimRefs:
      - "CR015"
      - "CR016"
