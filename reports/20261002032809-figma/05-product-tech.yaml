callouts:
  - calloutType: "insight"
    title: "From Static Design Canvas to Full-Stack Creative Operating System"
    body: "Figma's technical evolution through Config 2026 marks a structural shift from visual UI prototyping to full-stack product creation. By embedding Code Layers, prompt-to-app tools like Figma Make, and the conversational Figma agent directly into the WebGL canvas, Figma is converting design assets into interactive code-backed components, expanding its addressable footprint into software engineering and marketing workflows."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
  - calloutType: "risk"
    title: "Large File Performance Degradation and Parallel Codebase Maintenance"
    body: "Despite its WebAssembly rendering performance, Figma experiences documented responsiveness slowdowns and file organization friction when managing massive enterprise design systems. Furthermore, because Figma component libraries exist in visual isolation from live production Git repositories, engineering teams face ongoing maintenance overhead to prevent drift between design tokens and production code."
    claimRefs:
      - "CE006"
      - "CE007"
