chapter:
  number: 5
  title: "Product & Technology"
  summary: "Figma delivers an integrated, browser-native collaborative canvas spanning UI/UX design, interactive prototyping, developer handoff via Dev Mode, and generative AI creation through Figma Make and the Figma agent. While its WebGL rendering architecture and multi-sided community ecosystem create powerful workflow lock-in across product development teams, the platform faces scalability bottlenecks on large enterprise files and technical divergence between design tokens and production codebases."
sections:
  - id: "product-definition-and-modular-suite"
    title: "Product Definition and Modular Suite Architecture"
    body: "Figma defines its core platform as a collaborative canvas where design, code, and artificial intelligence converge into a single workspace for end-to-end digital product creation [CE001, CE003]. Rather than functioning merely as a static vector drafting application, Figma provides a browser-native environment that unites designers, software engineers, product managers, and executive stakeholders throughout the product development lifecycle [CE001, CE002]. The core product offering centers on Figma Design, which provides professional vector networks, responsive auto layout, reusable component variants, and interactive prototyping [CE001, CE002]. Adjacent modules expand the canvas to upstream and downstream workflows: FigJam provides an open online whiteboard for brainstorms, user journey mapping, and research synthesis; Figma Slides offers live, collaborative presentation decks incorporating interactive Figma prototypes and voting widgets; and Dev Mode introduces an inspection and code-generation environment tailored specifically for developers [CE001, CE002]. Furthermore, Figma has broadened its creative capabilities through specialized modules including Figma Draw for advanced vector illustration, Figma Sites for direct web publishing, and Figma Buzz for brand marketing asset creation [CE002, CE005]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "developer-handoff-and-code-alignment"
    title: "Developer Handoff, Dev Mode, and Code-Based Integration"
    body: "The bridge between visual interface design and software engineering represents Figma's primary workflow expansion vector and operational lock-in mechanism [CE001, CE002]. Dev Mode provides software engineers with a dedicated interface inside Figma Design to inspect component box models, extract CSS/SVG properties, compare visual revision diffs, and access items marked ready for development [CE001, CE002, CE007]. Through Code Connect and IDE plugins, engineering teams link visual design components directly to production code repositories in React, Vue, or iOS native frameworks [CE006, CE007]. However, technical design analysis reveals an enduring architectural gap: Figma's components are fundamentally visual mockups that remain decoupled from live codebases, requiring developers to manually translate layouts into functional components [CE006, CE007]. In complex enterprise environments, this separation forces teams to maintain two parallel representations of the same design system—one in Figma files and one in Git repositories—introducing component drift, style synchronization overhead, and file management challenges when projects expand to thousands of components [CE006, CE007]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE002"
  - id: "technical-operating-architecture-and-ai"
    title: "Technical Architecture, AI Agent Layer, and Operating Trade-offs"
    body: "Figma's underlying technical architecture is distinguished by a custom client-side C++ vector rendering engine compiled to WebAssembly and rendered via WebGL, coupled with a real-time multiplayer synchronization engine that propagates canvas state across concurrent web clients [CE001, CE003, CE005]. At its Config 2026 conference, Figma accelerated its technological differentiation by embedding native generative intelligence directly into this canvas layer [CE004, CE005]. Key architectural additions include Code Layers, which convert static design components into interactive, code-backed prototypes that manipulate functional UI or edit code directly, and the Figma agent, a first-party conversational agent powered by proprietary models and multi-model routing that automates layout refactoring, shaders, and animations [CE004, CE005]. Enterprise governance is enabled through Skills, which allow organizations to train the Figma agent on custom component libraries and design system standards [CE004]. Nevertheless, enterprise operating constraints persist: large design files experience documented performance slowdowns, continuous internet connectivity is required for core multi-tenant operations, and direct AI inference costs across weekly active agent users introduce gross margin variability [CE004, CE006]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
