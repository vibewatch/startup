        - id: included-credits
          label: Included AI credits
          detail: "Embedded allowances can support conversion, upgrades, and retention."
        - id: excess-consumption
          label: Excess AI consumption
          detail: "Usage beyond allowances can convert to add-on subscriptions or pay-as-you-go."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Q2 consolidated revenue was $370.1 million; stream mix was not disclosed."
        - id: delivery-cost
          label: Cost of revenue
          detail: "Includes service-delivery and inference costs; beta usage can lack offsetting paid-credit revenue."
        - id: gross-profit
          label: Gross profit
          detail: "Q2 GAAP gross margin was 84% and non-GAAP gross margin was 85%."
    approximationNotes: "Conceptual ordered flow only; node widths and sequence do not represent revenue mix, conversion rates, or relative values."
    claimRefs: [CI001, CI002, CI008, CI009, CI014]
callouts:
  - calloutType: risk
    title: AI monetization is visible before AI unit economics are
    body: >-
      Figma reports paid credit conversion and stronger gross-profit growth, but
      does not disclose revenue per credit, inference cost per credit, cohort
      contribution margin, or the eventual pricing of beta products.
    claimRefs: [CI008, CI009]
