schemaVersion: "report-v2"
artifact: financials
slug: figma
runDate: 2026-10-02
company:
  name: Figma
chapter:
  number: 4
  title: Financials
  summary: >-
    Figma paired 48% year-over-year Q2 2026 revenue growth with positive free cash
    flow and $1.7 billion of cash, cash equivalents, and marketable securities.
    Revenue quality benefits from subscriptions, seat expansion, and AI-credit
    add-ons, but GAAP losses, inference-cost volatility, and undisclosed
    credit-level unit economics prevent a complete underwriting view.
sections:
  - id: revenue-model-and-quality
    title: Revenue model and quality
    body: >-
      Figma reported Q2 2026 revenue of $370.1 million, up 48% year over year,
      while net dollar retention for paid customers with more than $10,000 in ARR
      was 136% and that customer cohort expanded 34% year over year. The revenue base is subscription-led, but management now describes
      two AI monetization paths: credits included in paid seats can support
      upgrades, conversion, and retention, while usage above included limits can
      be sold through add-on subscriptions or pay-as-you-go. Most current add-ons
      are coterminous with the underlying subscription, which should provide more
      recognition visibility than purely metered consumption. Product breadth
      across Design, Dev Mode, FigJam, Slides, Make, Sites, and Buzz creates more
      potential paid surfaces, and the Community distributes reusable Skills and
      Make assets. However, neither those product pages nor the financial release
      discloses revenue by product, seat, AI add-on, or pay-as-you-go stream.
      Company-reported Fortune 500 penetration is broad but dated to March 2025
      and does not establish current paid-seat volume or realized pricing.
    claimRefs: [CI001, CI006, CI007, CI008, CI014, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: margins-cash-and-capital
    title: Margins, cash generation, and capital adequacy
    body: >-
      The Q2 economics show strong gross profitability but a wide gap between GAAP
      and adjusted operating results. GAAP gross margin was 84%, non-GAAP gross
      margin was 85%, and free cash flow was $53.2 million, or 14% of revenue.
      At the same time, Figma recorded a $117.3 million GAAP operating loss and
      $147.6 million of quarterly stock-based compensation, while non-GAAP
      operating income was positive. AI monetization improved non-GAAP gross
      profit growth, but management also said beta products consume inference
      resources without paid-credit revenue and that inference spend was the
      largest driver of the year-over-year free-cash-flow variance. Liquidity is
      substantial at $1.7 billion in cash, cash equivalents, and marketable
      securities, and current free cash flow is positive; historical funding
      reported by Tracxn is not a substitute for that balance-sheet measure.
      The assigned evidence does not disclose a forward burn plan, minimum cash
      threshold, debt-facility terms, or acquisition commitments, so a precise
      runway or next-financing trigger cannot be calculated.
    claimRefs: [CI002, CI003, CI004, CI005, CI009, CI015]
    tableRefs: [TI003]
  - id: outlook-and-underwriting-verdict
    title: Outlook and underwriting verdict
    body: >-
      Management raised full-year 2026 revenue guidance to $1.463-$1.467 billion
      while retaining a 9% midpoint non-GAAP operating-margin outlook. That
      combination indicates confidence in seat expansion and monetized AI usage,
      but it does not resolve the margin path for products still in beta or early
      access. The financial quality verdict is therefore positive on growth,
      retention, gross margin, free cash flow, and liquidity, but incomplete on
      incremental AI economics and GAAP profitability. Independent commentary
      reinforces the risk: Tickeron links the stock's sensitivity to persistent
      GAAP losses and changing AI sentiment, while TIKR identifies AI-native
      competition as the principal risk to its modeled revenue trajectory. These
      sources are directional checks rather than independent audits of company
      metrics. Underwriting should require realized seat and credit pricing,
      discounts, credit revenue and inference cost by cohort, CAC and payback by
      segment, sales-cycle data, channel economics, contractual commitments, and
      debt details before assigning durable margin or runway assumptions.
    claimRefs: [CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value or status
      - Quality
      - Diligence ask
    rows:
      - [Paid seats, Subscription agreements, Provisioned seat / ARR, "Consolidated Q2 revenue only; stream mix undisclosed", Recurring but mix unavailable, "Revenue and ARR by product, tier, and seat type"]
      - [Included AI credits, Credits embedded in each seat, Credit allowance per seat, "Supports upgrades, conversion, and retention; standalone value undisclosed", Recurring-seat support rather than separately disclosed revenue, "Included credits and utilization by tier"]
      - [AI credit add-ons, Coterminous subscription add-on, Credit commitment, "Paid conversion reported; revenue amount undisclosed", Contracted and generally coterminous, "Committed credits, realized price, attach rate, and renewal"]
      - [Pay-as-you-go AI, Metered excess consumption, Consumed credit, "Available to customers; share of revenue undisclosed", Variable usage and recognition, "Usage volume, realized price, churn, and gross margin"]
      - [Expanded product surfaces, Seat or usage expansion across the suite, Product / seat / usage, "Product breadth is public; product-level revenue is not", Strategic option rather than quantified stream, "Revenue and paid-seat contribution by product"]
    notes: "Company disclosures describe mechanisms but do not provide revenue mix, realized pricing, or product-level contribution; null-equivalent statuses are explicit evidence gaps."
    claimRefs: [CI001, CI006, CI008, CI010, CI014]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offer
      - Price / unit / contract
      - List versus realized pricing
      - Discount or unknown
      - Evidence and implication
    rows:
      - [Core paid seat, "Subscription; provisioned seats contribute to ARR", "No price in assigned evidence", "Tier mix, discounts, and contract length unknown", "Seat expansion supports NDR, but realized ARPU cannot be derived"]
      - [Included AI credits, "Allowance embedded in each seat", "No standalone price disclosed", "Allowance by tier and unused-credit treatment unknown", "Raises seat value but obscures separate AI revenue"]
      - [AI credit add-on, "Mostly coterminous subscription commitment", "No realized price per credit disclosed", "Volume discounts and rollover terms unknown", "More visible than pure usage, but credit economics remain private"]
      - [Pay-as-you-go AI, "Excess credit consumption", "No realized price per credit disclosed", "Customer mix and spending caps unknown", "Creates usage upside and revenue-recognition variability"]
    notes: "Pricing rows preserve management's disclosed contract forms; assigned sources contain no current list-price schedule or realized-price data."
    claimRefs: [CI006, CI008, CI009]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Value / status
      - Period
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue growth, "48% year over year", "Q2 2026", High, "Top-line growth and operating leverage input", "Separate seat, AI add-on, pay-as-you-go, and product contributions"]
      - [GAAP gross margin, "84%", "Q2 2026", Medium, "Current delivery-cost envelope", "Gross margin by seat versus AI-credit revenue"]
      - [Non-GAAP gross margin, "85%", "Q2 2026", Medium, "Shows adjusted gross-profit profile", "Reconcile inference and stock-compensation exclusions by cohort"]
      - [GAAP operating margin, "-32%", "Q2 2026", Medium, "Captures current accounting loss including stock compensation", "Operating expense and stock-compensation path"]
      - [Free cash flow margin, "14%", "Q2 2026", High, "Direct cash-generation measure, not accounting profit", "Normalize annual bonus, Config, and working-capital timing"]
      - [Net dollar retention, "136%", "As of June 30, 2026; customers above $10,000 ARR", High, "Expansion and churn proxy for established customers", "Decompose price, seat, AI usage, contraction, and churn"]
      - [Liquidity, "$1.7 billion cash, cash equivalents, and marketable securities", "June 30, 2026", High, "Capital-adequacy starting point", "Debt, commitments, acquisition outlays, and minimum cash policy"]
      - [CAC / payback / sales cycle, "Not disclosed in assigned evidence", Current, Low, "Required to test GTM efficiency", "Segment-level CAC, gross-margin payback, sales cycle, and channel fees"]
    notes: "Values are company-reported and unaudited Q2 disclosures; non-GAAP metrics are not substitutes for GAAP results, and unavailable private metrics are not estimated."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI009]
