chapter:
  number: 6
  title: "Customers"
  summary: "Figma has scaled to over 13 million monthly active users and $1.056 billion in FY2025 revenue driven by viral product-led expansion where 70% of enterprise transactions originate from self-serve adopters. As of Q2 2026, Figma reported 15,964 customers generating over $10,000 in ARR, 1,635 customers generating over $100,000 in ARR, and a 136% net dollar retention rate, while navigating enterprise governance scrutiny and an AI credit transition."
sections:
  - id: "customer-segmentation-and-buyer-personas"
    title: "Customer Base Segmentation and Buyer Personas"
    body: "Figma operates a horizontal collaboration platform serving a diverse range of organizations from seed-stage startups to Fortune 500 multinationals. According to commercial technographic tracking and regulatory disclosures, 95% of Fortune 500 enterprises deploy Figma, including technology leaders like IBM and Samsung, industrial manufacturers like Siemens and Ford, and financial institutions such as Morgan Stanley. The enterprise customer profile skews heavily toward established mid-market and enterprise organizations, with companies employing 51 to 500 personnel accounting for 38.1% of customer domains and large enterprises with over 10,000 employees representing 19.4%. Within customer organizations, Figma has transcended specialized UI/UX design departments: approximately two-thirds of active users are non-designers, and software developers now represent roughly 30% of total platform users. In newer product surfaces like Figma Make, nearly 60% of all prompt-generated design files originate from non-designer roles, illustrating how technical and operational personas increasingly drive intra-company expansion."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "growth-trajectory-and-plg-expansion-loops"
    title: "Growth Trajectory and Product-Led Expansion Loops"
    body: "Figma's customer growth model is anchored in a browser-native multiplayer architecture that functions directly as an organic customer acquisition engine. By allowing free, unlimited canvas access for viewers and commenters while charging exclusively for editor seats, shared design URLs turn everyday stakeholder reviews into viral user acquisition channels. Approximately 70% of Figma's enterprise agreements originate from individual self-serve signups that organically expanded across squads before triggering centralized procurement reviews. This product-led motion has expanded Figma's user footprint to over 13 million monthly active users worldwide, with international users outside the United States accounting for 85% of active engagement. Financial results for Q2 2026 demonstrated sustained expansion durability, with Paid Customers generating over $10,000 in ARR growing 34% year-over-year to 15,964 accounts, while the $100,000+ ARR tier expanded 46% to 1,635 accounts. Net Dollar Retention Rate remained best-in-class at 136%, supported by rapid early monetization of new AI capabilities where over 80% of $10,000+ ARR customers consumed weekly AI credits and over 50% actively utilized the first-party Figma agent."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "enterprise-production-proof-and-retention-risks"
    title: "Enterprise Production Proof and Retention Risks"
    body: "Enterprise reference case studies demonstrate deep production integration across mission-critical software and hardware development cycles. Global industrial manufacturer Mitsubishi Electric adopted Figma company-wide in 2023 across consumer appliance and aerospace divisions when its legacy design tooling entered maintenance mode. Technology hardware leader Hewlett-Packard documented saving 98 minutes per developer weekly through Dev Mode standardization, translating to a 50% reduction in development cycle time and a reported 500% ROI. In rapid operational prototyping, logistics provider Flexport utilized Figma Make to redesign its core factory onboarding flow and ship production updates within weeks. However, rapid expansion across enterprise surfaces introduces material operational and commercial risks. User review aggregations indicate that performance latency on large files and strict reliance on active network connectivity represent persistent technical pain points. Furthermore, Figma's March 2026 transition from flat seat subscriptions to a hybrid seat-plus-AI-credit consumption model creates procurement friction, prompting central IT departments to enforce stricter seat governance via add-ons like Governance Plus to manage variable cost exposure."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
