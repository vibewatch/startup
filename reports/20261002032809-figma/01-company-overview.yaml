company:
  name: "Figma"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Figma is a San Francisco-based public product-development software company founded in 2012 and traded on the NYSE as FIG. Its latest retained operating snapshot is Q2 2026 revenue of $370.1 million, up 48% year over year, while current valuation, cumulative primary capital raised, debt availability, and 2026 headcount remain evidence gaps."
sections:
  - id: "identity-and-public-stage"
    title: "Identity, Headquarters, and Public Stage"
    body: >-
      Figma was started in 2012 by Dylan Field and Evan Wallace and was incorporated in
      Delaware that October. Its July 2025 registration statement listed 760 Market Street in
      San Francisco as the principal executive office; the retained pool does not establish
      whether that address or the broader location footprint changed by the run date. Figma's
      2026 earnings releases identify the company as NYSE: FIG, establishing its current public
      stage without relying on the earlier S-1's then-proposed listing. The latest retained
      quarterly scale evidence is revenue, not ARR: $370.1 million for the quarter ended June
      30, 2026, up 48% year over year. Current market capitalization, enterprise valuation,
      cumulative primary funding, and 2026 headcount are not established by the assigned
      sources.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO007"
      - "CO012"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "platform-and-expansion"
    title: "From Browser Design Tool to Product-Development Platform"
    body: >-
      The filing describes Figma as a browser-based, collaborative platform spanning the
      lifecycle from ideas to shipped digital products. The homepage similarly positions one
      workspace for product development, while Community exposes libraries, plugins, widgets,
      templates, AI skills, and remixable Figma Make projects. An independent Swellpulse model
      also identifies browser-native collaboration as a competitive driver, although it labels
      its drivers as predictive estimates rather than internal deal outcomes. Product scope has
      expanded in dated steps: FigJam in 2021, Dev Mode in 2023, Sites, Make, Buzz, and Draw in
      2025, and Motion, Weave tools, agent capabilities, and generative plugins around Config
      2026. The evidence supports platform breadth, but it does not independently validate
      adoption or economics for every product.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO008"
      - "CO009"
    figureRefs:
      - "FO001"
  - id: "leadership-and-control"
    title: "Leadership Coverage and Concentrated Control"
    body: >-
      Current 2026 company materials identify co-founder Dylan Field as Chief Executive Officer
      and Praveer Melwani as Chief Financial Officer; the S-1 also identified Field as President
      and board chair and Melwani as Treasurer. Evan Wallace is the other co-founder, but the
      retained sources do not establish a current operating role for him. Governance diligence
      should distinguish role continuity from control. The S-1 disclosed a multi-class structure,
      a voting proxy from Wallace and the Wu-Wallace Family Trust to Field, and a company-stated
      high dependence on Field for technology, product, vision, and strategic direction. Those
      filing disclosures establish a key-person and minority-shareholder risk, but the preliminary
      filing does not provide a reliable current voting percentage. A current proxy statement is
      required to update ownership, the full board roster, and any post-IPO leadership changes.
    claimRefs:
      - "CO001"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capital-and-stakeholders"
    title: "Capital Events, Investors, and Evidence Limits"
    body: >-
      The S-1 named entities affiliated with Index Ventures, Greylock Partners, Kleiner Perkins,
      and Sequoia Capital as holders of more than 5% of pre-offering capital and described
      registration rights for those investors. That is a historical ownership snapshot, not
      proof of present holdings. The same filing records a 2024 tender offer in which existing
      and new stockholders bought approximately $566.7 million of Class A shares; Figma did not
      receive those sale proceeds, so the transaction is secondary liquidity rather than capital
      raised by the company. Investing.com's May 14, 2026 analysis placed market capitalization
      at approximately $10 billion and characterized the stock as overvalued relative to its
      Fair Value estimate, but that dated third-party market snapshot is not a current enterprise
      valuation. The assigned evidence does not support an exact lifetime primary-funding total,
      current debt balance, or available credit capacity.
    claimRefs:
      - "CO007"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
