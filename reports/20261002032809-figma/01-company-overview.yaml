callouts:
  - calloutType: "risk"
    title: "Control evidence needs a current proxy"
    body: "The S-1 supports a qualitative conclusion that Field's multi-class shares and the Wallace proxy concentrated voting control, but its preliminary percentage fields are not a current ownership record. Do not infer a present control percentage without the latest proxy and beneficial-ownership filings."
    claimRefs:
      - "CO011"
  - calloutType: "insight"
    title: "Secondary liquidity is not company funding"
    body: "The approximately $566.7 million 2024 tender transferred existing shares and Figma said it did not receive the sale proceeds. It should not be added to primary capital raised or treated as cash available to the company."
    claimRefs:
      - "CO016"
