callouts:
  - calloutType: "insight"
    title: "The Developer Seat Expansion Motion Redefines Category Economics"
    body: "Figma's strategic introduction of Dev Mode fundamentally transforms its unit economics by expanding the addressable user pool beyond professional designers to software engineers. With contract expansion exceeding 25,000 paid seats where developer seats often surpass designer seats, Figma captures higher-value engineering budgets at $25 to $35 per seat monthly, raising customer lifetime value and establishing deep workflow lock-in across continuous integration pipelines."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM007"
  - calloutType: "risk"
    title: "AI Infrastructure Intensity Pressures Operating Profitability"
    body: "While Figma's Q2 2026 revenue expanded 48% year-over-year to $370.08 million, the introduction of compute-intensive AI tools such as Figma Make has driven quarterly net losses to $112.15 million and compressed gross margins toward 79%. Monetizing AI credits effectively without depressing core gross margins remains a critical operational hurdle as inference costs scale."
    claimRefs:
      - "CM005"
      - "CM007"
      - "CM010"
