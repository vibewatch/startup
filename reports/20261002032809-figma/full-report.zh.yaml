          label: 1. 规模与提速
          detail: Q2 2026 营收达 $370.1M（同比 +48%）；FY2026 指引上调至 $1.465B
        - id: node-economics
          label: 2. 单客经济模型
          detail: 净金额留存率 136%；non-GAAP 毛利率 85%；Q2 自由现金流（FCF）达 $53.2M
        - id: node-risk
          label: 3. 利润率与 AI 风险
          detail: GAAP 营业亏损 $(117.3)M；AI 推理成本导致毛利率稀释
        - id: node-valuation
          label: 4. 估值折扣
          detail: 市值 $9.5B 对应 ~5.3x EV/forward sales，交易价格低于 2021 年 Series E 轮
        - id: node-decision
          label: 5. 最终立场：买入
          detail: 入场倍数具备吸引力，维持高置信度并严密监控
        - id: node-monitoring
          label: 6. 监控指标与触发条件
          detail: 跟踪 120% 的 NDR 底线、GAAP 营业亏损演进，以及 AI 算力对毛利率的影响
