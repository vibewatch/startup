  - id: FR001
    title: 风险严重度与缓解矩阵
    type: matrix
    summary: 从发生概率、影响程度、缓解成熟度与残留严重度综合评估主要风险类别。云基础设施集中与 AI 算力导致的毛利率稀释，构成最高的残留风险敞口。
