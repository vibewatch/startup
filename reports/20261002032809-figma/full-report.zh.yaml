      - number: '3.2'
        title: 竞品画像与战略定位
        blocks:
          - type: paragraph
            body: >-
              评估主要替代产品可以发现，各家在体量、融资与核心目标人群上存在显著的结构性分化。Sketch 以每位编辑每月 $12 的定价瞄准原生 macOS
              原教旨设计用户，虽在大画板本地运行上流畅自如，却牺牲了浏览器原生跨平台多人协作的保真度。在开源阵营，Penpot 提供基于 SVG
              原生且支持私有化自托管的设计技术栈，免收软件许可费，对有数据主权合规要求的组织颇具吸引力；但社区追踪数据显示，开源替代方案在长期维护与工具链成熟度上仍有明显短板。Framer
              专注于将可视化网页直接发布为生产级代码，解决了营销网站部署难题，但仍难以胜任深度的复杂应用 UI 设计系统。Adobe XD 仍捆绑在 Creative Cloud 套件内，单买每月 $9.99，CC 套件月费
              $54.99；自 2024 年 Adobe 拟收购 Figma 的交易终止后，XD 的功能迭代动能明显停滞。Canva 规模庞大，2025 法定财年收入达 $3.02 billion，2026 年化收入达到
              $4.2 billion；但其模板化架构缺乏软件产品工程所需的组件变体（variants）、自动布局精度与矢量网络。
