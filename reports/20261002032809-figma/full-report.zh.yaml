    summary: 六层平台技术架构栈，涵盖客户端渲染、多产品工作区模块、生成式 AI 自动化、云端同步以及开发者集成基础设施。
    data:
      layers:
        - label: 协作与生态外层
          detail: 顶层共享工作空间与第三方扩展分发渠道
          items:
            - label: Figma Community
              description: 汇集 UI 资源包、插件、小部件与设计系统的公开资产库
            - label: Figma Slides & Buzz
              description: 交互式演示文稿与可规模化复用的品牌营销物料
            - label: FigJam 在线白板
              description: 可视化头脑风暴、用户旅程梳理与团队图表绘制
        - label: 核心画布与界面创作层
          detail: 核心视觉设计、矢量编辑与组件系统
          items:
            - label: Figma Design 画布
              description: 矢量网络、响应式自动布局（Auto Layout）与组件变体
            - label: 交互式原型设计
              description: 状态化过渡、变量系统与交互触发器
            - label: 设计系统资产库
              description: 共享设计令牌（Tokens）、样式与已发布的 UI 组件库
        - label: 开发者交付与代码集成层
          detail: 开发者专属检查器、代码生成与 IDE 桥接
          items:
            - label: Dev Mode
              description: 开发者专属检查、CSS/SVG 提取与可视化对比（Visual Diffs）
            - label: Code Connect
              description: 将设计组件直接映射至生产环境代码仓库
            - label: IDE 插件生态
