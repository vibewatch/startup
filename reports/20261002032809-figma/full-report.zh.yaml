      - number: '6.2'
        title: 增长轨迹与产品驱动的扩张飞轮
        blocks:
          - type: paragraph
            body: >-
              Figma 的客户增长飞轮立足于浏览器原生多人协同架构，其本身就是一台高效率的自发获客引擎。对查看者和评论者免费无限开放画布、仅针对编辑席位收费，使得项目评审中分享的设计链接自然化身为病毒式获客渠道。约 70%
              的 Figma 大客户企业合约始于员工个人自助注册，在团队小组间自发扩散后，才最终触发集中采购评审。这种产品驱动型扩张将 Figma 的全球月活用户推升至 13 million 以上，其中美国以外的国际用户贡献了
              85% 的活跃度。2026 年 Q2 财报印证了其扩张韧性：ARR 超过 $10,000 的付费客户数同比增长 34% 至 15,964 家，ARR 超过 $100,000 的高价值层级客户数增长 46% 至
              1,635 家。净金额留存率（NDR）保持在行业顶尖的 136%，这背后离不开新 AI 功能的早期快速变现：ARR 超过 $10,000 的客户中，超 80% 每周消耗 AI 点数，超 50% 积极使用官方自研的
              Figma agent。
