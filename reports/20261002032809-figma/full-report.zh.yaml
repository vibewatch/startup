              IBM、Samsung 等科技巨头，Siemens、Ford 等工业制造商，以及 Morgan Stanley 等金融机构。企业客户结构明显偏向成熟的中型市场与大型企业：员工人数在 51 至 500
              人的企业占客户域名的 38.1%，员工超过 10,000 人的大型企业占 19.4%。在企业内部，Figma 已突破专职 UI/UX
              设计部门的圈层：活跃用户中约有三分之二为非设计人员，软件开发者目前占平台总用户数的大致 30%。在 Figma Make 等新产品功能中，近 60%
              由提示词生成的设计文件出自非设计岗位，反映出技术与业务人员正日益成为企业内生扩张的主导驱动力。
