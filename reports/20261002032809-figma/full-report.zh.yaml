        title: 图表要点
        blocks:
          - type: callout
            title: 非设计师群体的破圈切入点
            body: >-
              Figma 在企业端的高速扩张由非设计人群深度驱动，开发者与产品经理合计占活跃用户的三分之二，并贡献了 Figma Make 60%
              的文件生成量。这一动态将企业账户内的潜在席位池大幅拓宽，远超传统的创意设计团队边界。
            calloutType: insight
