      - number: '5.3'
        title: 技术架构、AI 智能体层与工程权衡
        blocks:
          - type: paragraph
            body: >-
              Figma 底层技术架构的亮点，在于自研的客户端 C++ 矢量渲染引擎（编译为 WebAssembly 并借助 WebGL 渲染），并配合实时多人同步引擎在并发 Web 客户端之间广播画布状态 [CE001,
              CE003, CE005]。在 Config 2026 大会上，Figma 将原生生成式智能直接植入画布层，拉大了技术差异化优势 [CE004,
              CE005]。新增的核心架构包括：能够将静态设计组件转换为可交互、有代码支撑的原型（可直接操控功能性 UI 或修改代码）的 Code Layers；以及由自研模型与多模型路由驱动的官方对话式智能体 Figma
              agent，可自动化完成布局重构、着色器配置与动效设计 [CE004, CE005]。企业治理功能则依托 Skills 实现，支持企业基于专属组件库和设计系统规范训练 Figma agent
              [CE004]。尽管如此，企业级落地的工程瓶颈依然存在：大型设计文件有明确记录的卡顿降速，核心多租户操作强依赖持续稳定的网络连接，周活跃智能体用户产生的直接 AI 推理成本也为毛利率带来了波动风险 [CE004,
              CE006]。
