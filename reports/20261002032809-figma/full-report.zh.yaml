      - number: '3.3'
        title: 定价打包与切换成本
        blocks:
          - type: paragraph
            body: >-
              Figma 的席位商业化在专业版（Professional）上划分为全功能席位 Full（年付折合每月 $16）、开发者席位 Dev（每月 $12）和协作席位 Collab（每月
              $3），在企业版合约中全功能席位可达每月 $90。尽管 Canva 提供每人每月 $10 至 $18 的更低统一定价门槛，Penpot 则免收软件授权费，但总体拥有成本（TCO）的测算逻辑往往大相径庭。自托管
              Modulz 或 Penpot 等开源工具，按 10 个席位测算每年产生的云托管、日常维护、安全补丁与平台工程开销估计达 $1,680；相比商业 SaaS，其净节省成本微乎其微，同时还会缺失成熟的多品牌
              token 工作流。更重要的是，Figma 凭借 Dev Mode、Code Connect 以及 IDE
              插件将设计系统直接植入工程代码库，构筑起极高的运营切换成本。重新构建成熟的设计组件库并重新培训产研团队，会带来有据可查、长达数周的生产力折损，这为 Figma 抵御企业客户整体流失筑起了屏障。
            claimRefs:
