      - number: '4.3'
        title: 前瞻指引与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              管理层将 2026 全年营收指引上调至 $1.463-$1.467 billion，同时维持非 GAAP 营业利润率中位数为 9% 的预期。这一组合释放出对席位扩张和 AI
              付费转化的信心，但并未消除尚处于公测或早期预览阶段产品的利润率走向疑问。因此，在财务质量评定上，增速、留存率、毛利率、自由现金流和流动性均给出正面评价，但在增量 AI 经济效益与 GAAP
              盈利能力上仍显拼图不足。独立第三方的评论加剧了这一风险考量：Tickeron 认为股价波动高度绑定持续的 GAAP 亏损与市场对 AI 情绪的变化，TIKR 则将 AI
              原生竞品列为其营收预测轨迹的核心威胁。这些来源仅能提供方向性校准，不可等同于对公司关键指标的独立审计。在给出可持续的长期利润率或现金跑道假设前，严谨的投资判断应要求摸清各群体的席位与点数实际成交价格、折扣力度、点数收入与推理成本拆分、分群
              CAC 与回本周期、销售周期数据、渠道经济模型、合同履约承诺以及负债明细。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
