      - number: '1.3'
        title: 领导层架构与高度集中的控制权
        blocks:
          - type: paragraph
            body: >-
              2026 年最新公司资料显示，联合创始人 Dylan Field 担任首席执行官，Praveer Melwani 担任首席财务官；此前 S-1 文件中，Field 还兼任总裁兼董事会主席，Melwani
              兼任财务主管（Treasurer）。Evan Wallace 为另一位联合创始人，但现有留存来源并未证实其目前是否承担具体运营职务。公司治理尽调应将职务延续性与控制权清晰区分。S-1
              文件披露了多重股权结构、Wallace 及 Wu-Wallace Family Trust 授予 Field 的表决权委托协议，以及公司口径下对 Field
              在技术、产品、愿景和战略方向上的高度依赖。申报文件的上述披露坐实了关键人物风险与中小股东权益风险，但这套初步申报材料无法提供当下可靠的实际表决权比例。若要更新最新持股比例、完整董事会名单及 IPO
              后的任何高管变动，必须查阅最新的委托投票书。
            claimRefs:
              - CO001
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
