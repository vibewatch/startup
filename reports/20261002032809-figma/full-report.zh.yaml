      - number: '7.4'
        title: 商业模式转型、利润率承压与二级市场抛压
        blocks:
          - type: paragraph
            body: >-
              Figma 商业引擎从纯席位订阅转向“席位+按量计费 AI 点数”的混合模式，给毛利率带来了波动，也推高了业绩预测难度。第三方证券分析强调，尽管经营现金流维持为正（2026 年 Q1 达 $97.3M），但 AI
              推理开支在 2025 年将营业成本同比推高了 112%，导致非 GAAP 毛利率从 92% 骤降至 82%，直到 2026 年 Q2 才温和回升至 85%。自 2026 年 3 月起，Figma 开始严格执行
              AI 点数额度限制，徒增了计费复杂度、客户摩擦以及过期未用点数（breakage）的会计核算难题。与此同时，二级市场股票面临 IPO 解禁带来的技术性抛压，预计有约 $6 billion 的低成本持股将在
              2026 年 8 月解禁。Figma 账面 $1.7 billion 的现金及有价证券垫底，提供了充裕的现金跑道；然而长期估值倍数的扩张，取决于其能否证明按量计费的 AI
              点数收入能持续跑赢基础模型的算力成本通胀。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR015
              - CR016
      - number: '7.5'
        title: 图表要点
        blocks:
          - type: callout
            title: AI 推理成本通胀与毛利率承压
            body: >-
              2025 年 AI 推理与模型算力开支同比激增 112%，导致非 GAAP 毛利率从历史高位 92% 下探至 82%–85%。若客户对 Figma Make 和 Figma Agent
              的使用持续加速，而未能借助按量 AI 点数等比例变现，利润率将面临长期的结构性阻力。
            calloutType: risk
            claimRefs:
