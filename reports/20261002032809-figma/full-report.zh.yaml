          - type: callout
            title: 混合 AI 点数计费摩擦与性能开销
            body: 在席位订阅基础上引入 AI 点数额度限制造成了采购摩擦，同时用户反馈也集中反映：在网络不稳定环境下处理复杂企业设计系统时，常常遭遇性能衰减困扰。
            calloutType: risk
            claimRefs:
              - CU013
