    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、总部地址与上市阶段
        blocks:
          - type: paragraph
            body: >-
              Dylan Field 与 Evan Wallace 于 2012 年创立 Figma，并于当年 10 月在特拉华州注册成立。公司 2025 年 7 月提交的注册声明将旧金山 Market Street 760
              号列为主要行政办公室；截至本次运行日期，留存证据无法证实该地址或更大范围的办公布局是否发生变动。Figma 2026 年财报明确标识代码为 NYSE: FIG，直接坐实了当下的公开上市地位，无需依赖早期 S-1
              文件中拟议上市的内容。留存证据中最新的季度规模指标为营收而非 ARR：截至 2026 年 6 月 30 日的季度营收为 $370.1 million，同比增长 48%。当前市值、企业价值、累计一级市场融资金额及
              2026 年员工人数，均未获指定来源证实。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO012
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO007
              - CO012
              - CO013
              - CO014
              - CO016
      - number: '1.2'
        title: 从浏览器设计工具到产品开发平台
        blocks:
          - type: paragraph
            body: >-
              申报文件将 Figma 描述为一个基于浏览器的协作平台，贯穿从创意构思到数字产品交付的全生命周期。官网主页同样将其定位于面向产品开发的一体化工作区；Community 社区则沉淀了组件库、插件、小组件、模板、AI
              技能及可二次创作的 Figma Make 项目。第三方 Swellpulse
              模型同样将浏览器原生协作视作核心竞争驱动力，不过该模型将其驱动因素归为预测性估算，而非内部成交结果。产品版图沿着清晰的时间节点逐步延展：2021 年推出 FigJam，2023 年上线 Dev Mode，2025
              年推出 Sites、Make、Buzz 与 Draw，并在 Config 2026 前后带来 Motion、Weave
              工具、智能体（agent）能力与生成式插件。现有证据印证了平台的业务广度，但尚未独立验证每款产品的渗透率或经济效益。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
