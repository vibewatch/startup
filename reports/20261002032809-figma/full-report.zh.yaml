      - number: '7.3'
        title: 平台基础设施集中度与对手方敞口
        blocks:
          - type: paragraph
            body: >-
              Figma 的平台架构在云托管、存储和计算底层基础设施上高度依赖单一供应商 Amazon Web Services (AWS)。AWS
              出现任何服务中断、算力容量瓶颈或合同调价，都会直接威胁服务可用性与运营利润率，而迁移至备选云平台或自建自托管设施将耗费巨额工程投入，并造成长时间的停机。与此同时，Figma 推进 AI
              战略使得核心生成式功能更加依赖外部基础模型供应商——包括用于 Gemini 和 Imagen 模型的 Google，以及集成的 OpenAI 和
              Anthropic。竞争格局的变动进一步加剧了这一对手方风险：Anthropic 发布 Claude Design，直接带来了前沿 AI 竞争，对 Figma 的设计工作流造成挤压。管理层借助企业级 SLA
              与多模型多元化策略监控合作伙伴关系，但对集中式底层云设施及前沿 AI 模型供应商的潜在依赖依旧显著。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
