  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定位与模块化套件架构
        blocks:
          - type: paragraph
            body: >-
              Figma 将其核心平台定义为一个协同画布，把设计、代码与人工智能整合于统一工作区中，支撑端到端数字产品创作 [CE001, CE003]。Figma
              并非一款单一的静态矢量制图工具，而是提供了一套浏览器原生环境，在整个产品开发生命周期中将设计师、软件工程师、产品经理及核心管理层紧密联结 [CE001, CE002]。核心产品矩阵以 Figma Design
              为支点，提供专业级矢量网络、自适应自动布局、可复用组件变体及交互式原型制作 [CE001, CE002]。周边模块则将画布延伸至上下游工作流：FigJam
              提供开放式在线白板，用于头脑风暴、用户旅程绘制与调研归纳；Figma Slides 提供支持嵌入交互式原型与投票组件的实时协同演示文稿；Dev Mode 则为开发者量身打造了代码检查与生成环境 [CE001,
              CE002]。此外，Figma 借助专用模块进一步拓宽创作边界，包括面向进阶矢量插画的 Figma Draw、直接支持网页发布的 Figma Sites，以及用于品牌营销素材制作的 Figma Buzz
              [CE002, CE005]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
