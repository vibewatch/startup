            title: 营运资本抗风险韧性 vs 股票解禁抛压
            body: >-
              Figma 凭借 $1.7 billion 的现金与有价证券以及正向的自由现金流造血能力（2026 年 Q2 达 $53.2
              million），构筑了出色的流动性缓冲。然而，这一资产负债表优势在公开股票市场上正被预计 $6 billion 的 2026 年 8 月解禁规模及 IPO 后的估值倍数收缩所掩盖。
            calloutType: insight
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与战略评级建议
        blocks:
          - type: paragraph
            body: >-
              Figma 凭借顶级的单位经济模型以及在数字产品设计工程领域的近乎垄断地位，展现出引人瞩目的长期复利资产潜质。我们的核心投资逻辑建立在四大支柱之上：超 95% 的《财富》500
              强渗透率带来难以撼动的多方工作流黏性；136% 的净金额留存率（NDR）与 ARR > $100k 客户群同比 46% 的增速印证了持续的企业级扩张能力；ARR > $10k 客户中 80% 跑通了 AI
              点数早期变现；以及截至 2026 年 6 月 30 日账面持有 $1.7 billion 现金与有价证券的坚实资产负债表。反向逻辑则揭示了结构性逆风：GAAP 营业亏损（2026 年 Q2 录得
              -$(117.3) million）、AI 算力成本造成的毛利率承压（GAAP 毛利率降至 84%，非 GAAP 降至 85%，远低于 SaaS 历史 90%+ 的峰值），以及若非 GAAP
              营业利润率扩张（FY2026 预测值为 9%）无法兑现所带来的估值倍数回撤风险。综合权衡上述因素并对照其 $9.5 billion 的市场估值，我们给予“买入（Buy）”评级，置信度为高，风险等级为中，认为
              Figma 当前市值对成长型软件投资组合具有吸引力。
