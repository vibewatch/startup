      - number: '3.4'
        title: 护城河韧性与 AI 扩张方向
        blocks:
          - type: paragraph
            body: >-
              Figma 的竞争护城河依托三大支柱：双边社区网络效应、多人实时协同底层架构，以及画布向代码和 AI 延伸的全栈拓展。Figma Community 沉淀了数以千计的共享设计系统、UI Kit 及小组件，例如
              Relume kit 以及安装量达数十万次的官方 iOS kit，让 Figma 成为事实上的行业默认格式。为抵御新兴自动化设计工具与生成式画布竞品，Figma 推出了官方自研 AI 智能体、Code
              Layers 以及提示词直接生成应用的 Figma Make；截至 2026 年 7 月，后者在 ARR 超过 $10k 的企业客户中周活跃使用率已突破 50%。然而薄弱环节依然存在：大型峰会与市场投放带来的非
              GAAP 营业利润率承压、AI 云端推理算力成本波动，以及 Salesforce 和 Adobe 等企业级巨头的激进捆绑竞争，持续对其终局定价权构成威胁。
            claimRefs:
              - CP015
              - CP016
              - CP010
              - CP001
