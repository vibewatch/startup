      columns:
        - 发生概率
        - 影响程度
        - 缓解成熟度
        - 残留严重度
      rows:
        - label: 云托管单一供应商集中
          values:
            - label: 中
              tone: warning
              detail: AWS 各云区域周期性出现故障宕机
            - label: 极高
              tone: negative
              detail: 实时协同画布与数据访问完全中断
            - label: 中
              tone: warning
              detail: 企业级 AWS 基础设施与多区域高可用设计
            - label: 高
              tone: negative
              detail: 单一供应商锁定效应带来未经对冲的基础设施交易对手敞口
        - label: AI 推理成本膨胀与毛利率挤压
          values:
            - label: 高
              tone: negative
              detail: AI 算力使用增速超出基础订阅收入
            - label: 高
              tone: negative
              detail: 营业成本激增 112%，挤压历史 90%+ 的毛利率
            - label: 中
              tone: warning
              detail: 推进计量型 AI 额度订阅与 PAYG 计费档位商业化
            - label: 高
              tone: negative
              detail: 客户抵触用量上限，且推理成本扩容难以预测
        - label: 前沿 AI 竞争替代
          values:
            - label: 中
              tone: warning
              detail: Claude Design 等生成式 UI 工具快速涌现
            - label: 高
              tone: negative
              detail: 初级 UI 设计席位扩张面临潜在侵蚀
            - label: 中
              tone: warning
              detail: 画布原生智能体工具、Code Layers 与成熟的设计系统
            - label: 中高
              tone: warning
              detail: 需要持续创新以守住设计工作流主导地位
        - label: AI 监管合规与版权风险敞口
          values:
            - label: 中
              tone: warning
              detail: EU AI Act 积极执法，且美国诉讼持续演进
            - label: 高
              tone: negative
              detail: 合规罚款、强制调整功能或版权侵权主张
            - label: 中
              tone: warning
              detail: 完善的服务条款、商业模型免责补偿与 DPA 协议
            - label: 中
              tone: neutral
              detail: 资产负债表流动性充裕，持续的合规开销整体可控
        - label: 多产品线扩张带来的技术债
          values:
            - label: 高
              tone: negative
              detail: 快速拓展至 Slides、Sites、Buzz 以及代码生成领域
            - label: 中
              tone: warning
              detail: 平台延迟、集成摩擦与边缘场景 Bug
            - label: 中
              tone: warning
              detail: 持续重构工程架构并定向招聘运维专才
            - label: 中
              tone: neutral
              detail: 运营拖累尚属可控，但分散了核心创新的工程精力
        - label: 股权解禁带来的股票供应抛压
          values:
            - label: 高
              tone: negative
              detail: 2026 年 8 月解禁预计 $6B 的低成本股票
            - label: 中
              tone: warning
              detail: 公开市场估值倍数短期面临下行交易压力
            - label: 中低
              tone: warning
              detail: 高管预设 10b5-1 减持计划，且现金流创造能力强劲
            - label: 中高
              tone: warning
              detail: 在成交量充分消化内部人士抛售前，供给抛压将持续存在
