      - number: '8.2'
        title: 资本历史、融资对标与入场纪律
        blocks:
          - type: paragraph
            body: >-
              评估 Figma 的估值轨迹，需要将其二级市场交易倍数与历史一级融资轮次、并购对标及 IPO 表现交叉印证。2021 年 6 月，Figma 完成 Series E 轮融资，以每股 $21.30 筹得
              $197.6 million，投后估值隐含为 $9.99 billion。随后，Adobe 于 2022 年 9 月同意以约 $20 billion 收购 Figma；但因遭遇监管阻力，该交易于 2023 年
              12 月宣告终止。其后，Figma 于 2025 年 7 月 31 日在纽约证券交易所完成 IPO（NYSE: FIG），按 $19.3 billion 的隐含估值募资 $1.2 billion。2026
              年二级市场跟踪显示其市值为 $9.5 billion，即便经历了连续五年的复合营收增长，该市值仍略低于其 2021 年 Series E 轮的投后估值。按企业价值（EV）计算，以 $9.5 billion
              的股票市值扣除 $1.7 billion 账面现金，且有息债务为零，企业价值约为 $7.8 billion。对照管理层更新后的 FY2026 营收指引中位值 $1.465 billion，Figma
              当前交易倍数仅为约 5.3x FY2026 EV/营收（约 6.5x 远期市销率 P/S），相比 IPO 时 $19.3 billion 估值水平的倍数大幅压缩，形成了有利的安全边际。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景分析、退出就绪度与逻辑证伪触发点
        blocks:
          - type: paragraph
            body: >-
              为测算预期股权回报，我们构建跨越 2027 财年的概率加权情景模型，涵盖乐观、基准与悲观三种经营情景。基准情景（概率 50%）下，Figma 保持 35% 的营收复合增速，2027 财年收入达到约 $1.98
              billion，non-GAAP 营业利润率扩张至 14%，自由现金流利润率达到 18%，支撑 8.0x 企业价值 / 营收倍数（EV/营收），对应目标股权估值 $15.5 billion（隐含 +63%
              回报）。乐观情景（概率 25%）假设企业客户积极采购 AI credit 并在全量账户中广泛采用 Code Layers，拉动 2027 财年营收增长 44% 至 $2.11 billion，自由现金流利润率达到
              22%，享有 10.5x 倍数，对应估值 $21.5 billion（+126% 回报）。悲观情景（概率 25%）模拟 AI 导致毛利率稀释至 80% 以下、净金额留存率（Net Dollar
              Retention）减速至 115% 以下，且估值倍数压缩至 4.0x EV/营收（基于 2027 财年 $1.70 billion 营收），得出保守估值 $6.5 billion（-32%
              下行空间）。触发逻辑破损并须立即下调至 Avoid 或 Track 的指标包括：净金额留存率连续两个季度低于 120%、non-GAAP 营业利润率跌破 5%、ARR 超 $100k
              的企业大客户扩张出现结构性流失，或生成式设计替代方案蚕食核心 editor 席位需求的证据。
            claimRefs:
