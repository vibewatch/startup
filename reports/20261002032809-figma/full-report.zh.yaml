  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、知识产权与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              生成式 AI 融入核心工作流以及全球合规框架的落地执行，使 Figma 面临持续演变的法律与监管环境。Figma 在 10-K 年报中强调，其 Figma Make 及各项内置 AI
              功能重度依赖外部数据集与基础模型，暗藏知识产权侵权、训练数据来源不合规以及商誉受损等潜在风险。此外，《欧盟人工智能法案》等不断出台的监管框架对 AI
              系统提供商提出了严苛的透明度、合格评定与治理合规要求。应对各州、联邦及国际司法辖区各异的隐私法律，需要持续投入运营成本并调整合同条款。Figma
              借助企业服务条款及配套的数据处理附录（DPA）对冲上述风险，以此规范客户内容权利，并强制要求适用具有约束力的个人仲裁及集体诉讼弃权条款。但托管第三方社区资产与生成式工具，依然会在跨司法管辖区的版权赔偿及用户生成内容（UGC）审核上遗留法律敞口。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
