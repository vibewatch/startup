  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代品
        blocks:
          - type: paragraph
            body: >-
              协同数字产品设计软件的核心市场涵盖矢量图形创作、交互式 UI/UX 原型设计、设计系统治理以及跨职能设计评审 [CM001,
              CM006]。此前，软件研发组织将界面创作视为孤立的、基于本地文件的活动，由专职设计师在 Sketch 或 Adobe XD 等桌面客户端上完成，随后通过手工导出素材并借助二次交付工具交付工程团队
              [CM006]。Figma 借助基于 WebGL 和 WebAssembly 构建的全浏览器原生多人协同画布，重新定义了该品类边界，将此前碎片化的工作流收敛为实时同步的单一事实来源 [CM001, CM006]。


              Figma 持续吃下相邻品类的预算支出，包括借助 FigJam 切入数字白板（头脑风暴、Sprint 规划、架构绘图），借助 Dev Mode 切入设计到代码的技术交付审查，以及借助 Figma Slides
              制作企业动态演示、借助 Figma Make 实现提示词驱动的原型生成 [CM001, CM002, CM004,
              CM007]。未覆盖的支出领域包括生产级软件工程执行（IDE、持续部署流水线）、营销自动化套件以及通用日常办公套件；在这些领域，Microsoft 365 或 Google Workspace
              等现存企业套件依然壁垒深厚 [CM001, CM005]。现状替代品涵盖传统桌面软件、PDF 或截图交付，以及 Miro、Zeplin、InVision 等独立单点工具与常规演示幻灯片 [CM001,
              CM003, CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
      - number: '2.2'
        title: 目标市场规模测算：多视角 TAM、SAM 与 SOM 分析
        blocks:
          - type: paragraph
            body: >-
              评估 Figma 的市场机遇需要拆解不同的细分软件品类，而非单纯依赖单一宽泛的 TAM 数字 [CM001]。全球核心 UI/UX 设计软件市场规模约为 $10.5 billion，未来十年预计以大致 13% 至
              15% 的复合年增长率（CAGR）扩张 [CM001]。在该基础板块中，Figma Design 贡献了公司总营收中估计 70% 至 75% 的份额，在现代产品研发团队中占据 80% 至 90% 的核心市场份额
              [CM001, CM006]。


              除核心设计外，相邻产品品类进一步撑大了 Figma 的可服务市场（SAM）：协同白板软件领域目前规模在 $2.6 billion 至 $3.0 billion 之间，CAGR 为
              20.8%；设计到代码的开发交付软件领域规模大致为 $1.2 billion，CAGR 为 15%；全球演示软件市场规模超过 $6.7 billion，CAGR 为 8%
              [CM001]。综合来看，上述可触达品类合计构成超过 $21.0 billion 的总体市场空间 [CM001]。Figma 的可获取市场（SOM）则体现在其增长轨迹上：2026 财年年化收入运行率预计突破
              $1.46 billion，其中包括 2026 年第二季度 $370.08 million 的营收，远期营收预测模型更预计 2029 年达到 $2.2 billion [CM005, CM008, CM009]。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
      - number: '2.3'
        title: 买方客群划分、预算归属与落地推进模式
        blocks:
          - type: paragraph
            body: >-
              Figma 在企业内部的渗透覆盖产品研发组织中的四大核心角色，推动预算归属由部门级设计软件预算转向集团级工程与 IT 采购集中预算 [CM001, CM002, CM003,
              CM004]。专业产品设计师和用户体验研究员是 Figma Design 的核心操作用户，根据企业治理层级不同，每位用户每月席位单价在 $12 至 $75 之间 [CM001,
              CM006]。然而，产品驱动（PLG）的扩张飞轮正迅速将非设计岗位的利益相关方卷入平台 [CM002, CM006]。


              借助 Dev Mode，软件工程师与前端开发者成为 Figma 增长最快的付费用户群体，高级席位月费在 $25 至 $35 之间 [CM001,
              CM007]。自公测转为独立付费模块后，开发者席位数实现爆发式增长；在工程师席位数量反超设计师的付费企业层级中，签约规模突破 25,000 个付费席位 [CM002,
              CM007]。与此同时，产品管理、市场、运营和高管等跨职能协作人员以每月每席位 $3 至 $5 的价格使用 FigJam，并借助社区资产与插件在分散的业务线间规范视觉标准 [CM001, CM003,
              CM011]。企业采购团队借助可量化的投资回报率（ROI）验证了这一整合效益：Forrester TEI 模型测算显示，停用冗余的传统工具授权可在三年内直接节省超过 $838,000，净现值达 $4.51
              million，ROI 高达 328% [CM003]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
      - number: '2.4'
        title: 市场增长驱动力、结构性制约与成本动态
        blocks:
          - type: paragraph
            body: >-
              深度工作流嵌入、病毒式多人协同网络效应以及开发者授权商业化，共同驱动了采纳速度的爆发 [CM001, CM002, CM006, CM007]。面对分布式与混合办公产研团队对视觉资产实时同步的刚性需求，Figma
              扮演着数字体验创作核心操作系统的角色 [CM001, CM003]。企业一旦在 Figma 内沉淀了自身的设计系统与组件库，切换成本便极高，迁移专属设计变量（tokens）及既定交付流程会引发严重的业务中断
              [CM001, CM006]。此外，由数千款社区插件、模板和小组件构成的开放生态，在不增加内部额外研发负担的前提下持续拓展了平台的应用边界 [CM001, CM006, CM011]。


              反之，多项实质性制约与风险也笼罩着 Figma 的下一轮增长 [CM005, CM007, CM010]。尽管平台借助 Figma Make 等工具中的 AI 点数成功跑通了基于用量的商业化，但承载高强度 AI
              推理底层架构却导致营业成本与运营费用陡增 [CM002, CM005, CM007, CM010]。2026 年第二季度，即便营收同比大增 48% 至 $370.08 million，高企的云托管与 AI
              算力需求仍导致 Figma 录得 $112.15 million 的季度 GAAP 净亏损，毛利率承压下探至 79% [CM005, CM007, CM010]。此外，当企业买方拿付费 Dev Mode 升级与
              Microsoft、Google 或 Atlassian 等巨头捆绑的套件工具做比对时，往往会产生潜在的预算阻力 [CM001, CM007]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.5'
        title: 图表要点
        blocks:
          - type: callout
            title: 开发者席位扩张重塑品类经济模型
            body: >-
              Figma 推出 Dev Mode 战略举措，将目标用户群体从专业设计师拓展至软件工程师，从根本上重塑了其单位经济模型。在开发者席位往往多于设计师席位的签约扩张中，付费席位规模已突破 25,000 个；Figma
              凭此以每席位每月 $25 至 $35 的单价吃下更高价值的工程研发预算，拉高客户终身价值，并在持续集成（CI）流水线中建立起深厚的工作流锁定效应。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: callout
            title: 高强度 AI 底层架构拖累营业利润率
            body: >-
              尽管 Figma 2026 年 Q2 营收同比增长 48% 达到 $370.08 million，但 Figma Make 等高算力消耗 AI 工具的面世导致季度净亏损扩大至 $112.15
              million，并将毛利率挤压至 79% 左右。随着推理成本规模化攀升，如何在不拖累核心毛利率的前提下有效推进 AI 点数变现，仍是亟待跨越的经营瓶颈。
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局全貌与核心细分市场
        blocks:
          - type: paragraph
            body: >-
              Figma 在数字产品设计生态中占据主导地位，在专业产品 UI/UX 设计团队中手握估计超过 80%
              的市场份额。更广泛的竞争空间跨越多个清晰的细分赛道：直接协同产品设计替代品、老牌传统设计套件、相邻视觉内容创作工具、开源自托管方案以及网页发布构建工具。直接竞争对手如 Sketch 仍受制于单一 macOS
              平台架构与二线网页审查层，而 InVision 在关闭旧版工具后业务大幅收缩。与此同时，拥有超过 200 million 月活跃用户的 Canva
              作为高速运转的视觉内容引擎，主打营销与非设计师日常沟通，并未切入核心软件 UI/UX 工程工作流。企业采购方因此面临分化格局：专业软件工程团队统一采用 Figma，而市场营销部门则选用模板驱动型平台。
            claimRefs:
