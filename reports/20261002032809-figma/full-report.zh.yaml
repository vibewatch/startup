      - number: '4.2'
        title: 利润率、现金造血与资本充裕度
        blocks:
          - type: paragraph
            body: >-
              Q2 财务数据展现出强劲的毛利盈利水平，但 GAAP 与调整后营业利润之间差距悬殊。GAAP 毛利率为 84%，非 GAAP 毛利率为 85%，自由现金流为 $53.2 million（占营收的
              14%）。与此同时，Figma 录得 $117.3 million 的 GAAP 营业亏损及 $147.6 million 的季度股权激励开支，非 GAAP 营业利润则为正值。AI 商业化拉动了非 GAAP
              毛利润的增长，但管理层同时称测试版产品消耗推理资源却未产生付费点数收入，且推理开支是导致自由现金流同比波动最主要的推手。公司流动性相当充裕，拥有 $1.7 billion
              的现金、现金等价物及有价证券，且当前自由现金流已回正；据 Tracxn
              统计的历史融资金额不能替代这一资产负债表指标。指定证据未披露远期资金消耗计划、最低现金水位门槛、授信额度条款或并购承诺，因而无法精确测算现金跑道或下一轮融资触发点。
            claimRefs:
