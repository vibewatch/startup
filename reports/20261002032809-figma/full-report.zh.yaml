      - number: '5.2'
        title: 研发交付、Dev Mode 与代码级集成
        blocks:
          - type: paragraph
            body: >-
              横跨视觉界面设计与软件工程之间的桥梁，既是 Figma 拓展工作流的核心抓手，也是沉淀用户黏性的锁定机制 [CE001, CE002]。Dev Mode 在 Figma Design
              内部为软件工程师提供了专属界面，便于审查组件盒模型、提取 CSS/SVG 属性、对比视觉版本 diff，并直接抓取标记为待开发的模块 [CE001, CE002, CE007]。工程团队借助 Code
              Connect 和 IDE 插件，将视觉设计组件直接关联至 React、Vue 或 iOS 原生框架的生产代码库 [CE006, CE007]。然而技术架构分析暴露出一个长期存在的断层：Figma
              的组件在底层仍属于视觉模型，与真实运行的代码库处于解耦状态，仍需开发者手动将布局逻辑转译为功能性组件 [CE006,
              CE007]。在复杂的大型企业环境中，这种割裂迫使团队必须为同一套设计系统维护两组平行的载体——一套在 Figma 文件中，一套在 Git
              代码库里；一旦项目扩张至数千个组件，就会引发组件漂移、样式同步开销以及文件管理失控等挑战 [CE006, CE007]。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
