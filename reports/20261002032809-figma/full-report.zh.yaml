  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 营收模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              Figma 公布 2026 年 Q2 营收为 $370.1 million，同比增长 48%；ARR 超过 $10,000 的付费客户净金额留存率（NDR）达 136%，该客户群体规模同比增长
              34%。虽然收入大盘仍以订阅为主，但管理层目前勾勒出两条 AI
              变现路径：付费席位内置的点数可撬动版本升级、转化与留存，超出额度的用量则可借助附加订阅或按量付费销售。当前大多数附加包的签约周期均与底层订阅保持一致（coterminous），相比纯按量计费，其收入确认的确定性更高。横跨
              Design、Dev Mode、FigJam、Slides、Make、Sites 和 Buzz 的丰富产品线开拓了更多潜在付费触点，Community 社区也持续分发可复用的 Skills 与 Make
              资产。然而，无论产品介绍页还是财报，均未披露按产品线、席位、AI 附加包或按量付费拆分的具体收入。公司口径下《财富》500 强的渗透率固然广泛，但数据停留在 2025 年 3
              月，无法证实当下的付费席位总量与实际成交价格。
