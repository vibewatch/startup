            body: >-
              S-1 文件将 Index Ventures、Greylock Partners、Kleiner Perkins 与 Sequoia Capital 的关联实体列为发行前持股 5%
              以上的股东，并说明了这些投资方享有的登记权。这仅代表发行前特定时点的历史持股切片，无法证明当下的持股状况。同一份文件还记录了 2024 年的一笔要约收购，老股东与新投资者在交易中购买了约 $566.7
              million 的 A 类普通股；Figma 明确表示未获得任何出售所得，因此该交易属于老股流动性退出，而非公司主体募集资金。Investing.com 在 2026 年 5 月 14 日的分析中将公司市值定在约
              $10 billion，并认为该股价相对其公允价值（Fair
              Value）估值存在高估，但这仅属于特定日期的第三方市场快照，并不构成当下的企业价值评估。指定证据无法支撑得出确切的历史累计一级融资金额、当前负债余额或可用信贷额度。
            claimRefs:
