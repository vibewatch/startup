callouts:
  - calloutType: "insight"
    title: "The Developer Handoff Moat"
    body: "Figma's strongest defense against visual content tools like Canva and low-code builders is Dev Mode and Code Connect. By integrating directly into frontend developer IDEs and design token pipelines, Figma embeds itself into the engineering release lifecycle, creating high organizational switching friction."
    claimRefs:
      - "CP004"
      - "CP014"
  - calloutType: "risk"
    title: "AI Inference Costs & Pricing Model Friction"
    body: "As competitors introduce automated design generation, Figma's expansion into AI agents and canvas generation increases cloud compute exposure. Monetizing through usage-based AI credits creates customer budget uncertainty compared to flat-rate alternatives."
    claimRefs:
      - "CP010"
      - "CP015"
