  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与组合形态
        blocks:
          - type: paragraph
            body: >-
              Hithium 应被视为一家固定式储能硬件平台公司来承销，而不是普通锂电芯厂商。公开材料持续呈现一套从 ESS 电芯和电池包，延伸到液冷 DC
              block、工商业柜、住宅系统，再到钠离子和长时变体的产品栈。当前官方产品界面最明确的是三条商业上重要的 LFP 电芯家族：较老的 314Ah ESS 电芯、用于 2 小时系统的 587Ah 大尺寸电芯，以及用于
              4 小时和长时系统的 1175Ah kAh 级电芯。产品组合已经借助 ∞Pack+ 标准化层和 ∞Power 6.25MWh
              平台向上移动；该平台设计目标是在不同时长配置中复用主要部件，而不是为每个用例重新设计整个系统。


              不过，公开披露里的产品组合并不完全干净。用户要求关注 320Ah 这一点很有启发，因为保留的官方来源没有显示独立的 320Ah 旗舰页面；一个渠道列表把 LF314 产品标成「320Ah」，但随后又写明标称容量为
              314Ah。投资人更应把这理解为公开产品组合沟通仍松于顶级融资级文档，而不是隐藏突破的证据。更强结论是，Hithium 的商业差异化重心已经从 314Ah 级别转向 587Ah、1175Ah 以及配套系统架构。
