        - 开发商或公用事业，取决于是自建还是合同模式
        - 电网运营商 / 公用事业系统
        - 由监管机构或董事会批准、费率支付方支撑的公用事业预算
        - RFP 或招标 -> 合同或自建 -> 并网 -> EPC / O&M -> 投运
        - 容量充裕性、峰值覆盖、可再生能源并网
