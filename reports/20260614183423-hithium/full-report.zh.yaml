  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 足迹信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Hithium
        - 直接竞争 / 仅做固定式储能的 ESS 电芯 + 系统
        - 报告累计出货 40GWh；德州 10GWh 系统工厂；沙特 5GWh JV 计划
        - 需要 LFP 电芯或完整集装箱的公用事业级和长时储能开发商
        - 仅做固定式储能的路线图，大规格 587Ah/1175Ah/1300Ah 电芯，安全营销强，本地化动作较早
        - 保留来源中没有经审计的公开收入或订单储备披露；未显示美国电芯本土化
      - - CATL
        - 直接竞争 / 电芯巨头加系统伙伴
        - 2025 年 ESS 收入 624 亿元；装机产能 772GWh；在建 321GWh；全球 ESS 份额 30.4%
        - 全球公用事业、集成商和储能 OEM
        - 披露的制造基地最大，587Ah 电芯降本、验证基础设施和下游合同都很强
        - ESS 仍只是 CATL 收入的少数部分，且中国来源政策审查正在升温
      - - BYD
        - 直接竞争 / 系统级既有厂商
        - 累计 ESS 出货 >135GWh；110+ 个国家；650+ 个项目
        - 电网级储能买方和海外光储项目
        - 大装机基础，欧洲和拉美 MC Cube 案例，EV 规模带来的资产负债表支撑
        - 2026 年需求和 Blade Battery 2.0 瓶颈说明，规模不能消除周期风险
      - - EVE Energy
        - 直接竞争 / 大规格电芯同业
        - 声称 2024 年 ESS 供应商前二；>2.8M m² 制造基地；印度 8GWh 订单
        - 需要大规格 ESS 电芯和不断增长海外供应的集成商与开发商
        - 在 CATL/BYD 规模之下，海外执行爬坡和钠离子可选性构成差异
        - 公开下游渠道控制弱于头部系统层既有厂商
      - - REPT Battero
        - 直接竞争 / 中国 ESS 电芯专精厂商
        - 全球 ESS 电芯前五；年产能 90GWh；印尼工厂在建
        - 采购中国 LFP 电芯的 ESS OEM、户储厂商和公用事业开发商
        - 青山系工业母公司支撑，314Ah/392Ah/588Ah 路线图，连续 BNEF Tier 1
        - 公开证据更偏公司声称，金融级程度弱于上市既有厂商
      - - Sungrow
        - 系统层既有厂商
        - 公用事业级 PowerTitan 案例，加上独立报道的 20MWh 燃烧测试
        - 想要可融资集装箱和电力电子底子的开发商
        - 安全 / 可融资性营销强，系统交付一体化
        - 与 Hithium、CATL、EVE 或 REPT 相比，保留来源给出的直接电芯路线图细节更少
      - - Fluence / FlexGen
        - 系统层参照 / 软件重的集成商
        - 全球 Gridstack 机队，Siemens/AES 背书，Mosaic 和 Nispera 软件，FlexGen 的 AI 驱动 EMS 叙事
        - 优先考虑软件、控制和长期服务的公用事业、IPP 和开发商
        - 通过控制、竞价、监控和 O&M 掌握电芯之上的高切换成本层
        - 仍可能依赖第三方电芯供应；与中国电芯巨头相比，在商品化硬件上的成本竞争力可能结构性较弱
    notes: 各行混合了直接电芯同业和系统层替代方案，因为买方可以靠电芯、完整集装箱或软件重的集成商完成同一个储能任务。
