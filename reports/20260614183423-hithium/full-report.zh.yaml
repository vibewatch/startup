      - number: '6.3'
        title: 渠道伙伴、本地化与地理扩张
        blocks:
          - type: paragraph
            body: >-
              Hithium 的国际客户模式高度依赖合作伙伴、集成商、EPC、公用事业公司和本地渠道专家。沙特是最清晰的例子。Hithium 先借 MANAT 合资公司和规划中的沙特 5GWh
              工厂建立本地化叙事，再把这种本地化姿态转化为 Saudi Electricity Company 的 4GWh 具体订单；Alfanar 负责施工，Hithium
              负责系统设计、供应、安装监督和长期维护。这个顺序很关键：在该市场，客户准入似乎既取决于本地关系和适配气候的产品，也取决于电芯价格。类似的渠道依赖也出现在其他地区。公司与乌克兰 KNESS 的合作、与 Brawn
              Capital 的 APAC 框架、与越南 DSS Solar 的协议，以及在东欧与 Renalfa / Solarpro 的合作，都显示 Hithium
              通过能发起项目、安排融资或掌握本地客户关系的交易对手销售。


              这种重伙伴模式有两个相反含义。积极一面，它让 Hithium 不必在每个市场都搭建直营企业销售团队，也能扩大地理覆盖。公开证据现已覆盖中国、保加利亚、捷克、罗马尼亚、美国、沙特、乌克兰、越南，以及更广泛的
              APAC / 东欧管线。消极一面，Hithium
              的客户耐久性部分取决于伙伴耐久性。框架协议不等于已入账收入，渠道胜利也不等于终端客户分散。公开记录因此支撑一个强地理扩张故事，但直接客户所有权故事较弱。Hithium
              显然在全球化，但很多路径仍由中介承接，EPC、公用事业公司和开发商仍是商业守门人。
