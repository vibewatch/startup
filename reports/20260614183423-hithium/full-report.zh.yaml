  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Hithium 的可服务市场是电力栈里的电池储能部分，不是整个电力系统。EIA 的 2026 年储能更新明确拆分了大型电池储能、小型电池储能、所有权类型、共址系统、应用和安装成本；BloombergNEF
              的公开展望则把固定式储能定义为包括辅助服务、能量时移、输配电延缓和用户侧电池，但明确排除抽水蓄能。本章纳入的支出包括公用事业级和工商业 LFP 电芯、模块、机架、集装箱、BMS/EMS、热管理、集成、EPC
              范围、并网配套工作、长期服务，以及让电池项目具备融资性的结构。排除的支出包括抽水蓄能、独立太阳能或风电发电 capex、没有储能部分的通用输电升级，以及数据中心 IT
              硬件。因此，实际替代集合不是「所有电力」，而是燃气调峰机组、柴油备电、输电升级、可再生能源弃电以及非 Hithium 电池供应商。这个边界重要，因为 Hithium 的公开材料、排名和合同都指向聚焦 ESS
              的公用事业级和工商业场景，而不是 EV 电池或通用电力设备。
