      - number: '1.4'
        title: 里程碑、IPO 时间线与不利进展
        blocks:
          - type: paragraph
            body: >-
              本章唯一记录时间线显示，公司在约六年内从成立走到重磅融资，再进入全球化和公开市场准备。对后续章节最关键的顺序始于 2019 年成立、2022 年 10 月 Series B、2023 年 7 月 Series
              C。此后节奏加速：2024 年 Q3 获 BloombergNEF Tier 1 认可，2025 年 3 月递交 HKEX 申请，2025 年 5 月推进欧洲本地化，2025 年 8 月 Saudi 与
              Texas 扩张取得里程碑，2025 年 9 月香港申请失效。10 月后续报道称，Hithium 将失效视为程序性事项，准备重新递交，而非撤回。


              同一条时间线也带着投资人不能忽视的不利记录。CATL 2025 年诉讼、围绕前高管冯登科的争议，以及 Powin 相关客户风险问题，都在 IPO
              故事展开时出现。不利报道还提示，应收账款膨胀、高杠杆和对国际利润率的依赖，是增长叙事的重要限定条件。换句话说，Hithium
              的真实商业进展足以支撑后续市场、产品和客户分析；但公司概览章节也必须明确：公司追求全球规模的同时，公开市场准备度正被法律、财务和披露质量问题一起检验。
