      - number: '1.3'
        title: 融资历史、运营规模与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              最有支撑的融资事件仍是 Hithium 2023 年 7 月的 Series C，多方来源称金额超过 RMB 4.5B（约 US$621–622M）。Verdict 和 Energy-Storage.news
              均点名 Beijing Financial Street Capital 与 China Life Private Equity
              为领投方，其他国资背景和金融投资人也参与其中。披露的资金用途就是直接的成长资本：扩制造、买设备、投研发、进入更多市场。公开数据供应商仍将公司列为私营、Series C 阶段，说明 2025 年 3 月的 HKEX
              申报是一次尝试公开市场跃迁，而不是股权转型已经完成的证据。


              运营上，招股书阶段报道指向一家在 2024 年快速放量的公司：收入约 RMB 12.9B，同比增长 26%；储能系统收入 RMB 4.67B；国际市场贡献 28.6% 销售额；全年出货 35.1 GWh，占全球
              11% 份额。国际占比重要，是因为负面报道认为海外业务毛利率显著好于中国业务，这有助于解释 Saudi、Texas
              和欧洲为何成为战略重点。不过，规模质量比规模数量更难判断。不同来源的员工数不一致，准确持股比例未公开，当前估值除了一个低置信度、超过 US$3.5B
              的媒体估算外证据偏弱。上述信息足以证明动能，却不足以消除尽调摩擦。
