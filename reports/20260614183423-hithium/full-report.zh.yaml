            body: >-
              Hithium 的人员风险，与其说是创始人戏剧，不如说是执行带宽。公司同时在升级 Changzhou、爬坡 Texas、谈判欧洲本地化、建设沙特 JV 足迹、应对 IP 索赔，并试图重启 IPO
              窗口。对于一家公开披露仍薄于上市龙头的民营制造商，这是一组异常宽的高风险项目。来自前 CATL 人才的重合曾帮助 Hithium 快速放量，如今也带来影子风险，因为与 CATL
              的诉讼部分围绕人员流动和所谓技术重合展开。与此同时，公开证据显示盈利能力仍依赖补贴，营运资本仍被拉紧，最重要的海外渠道还没有明显分散。承销 Hithium 的正确方式因此不是写一句模糊的「观察执行」，而是设定明确
              kill criteria。如果公开申报不能顺利恢复、另一家主要交易对手退出、海外本地化卡在组装站点、或出现真实现场安全事件 / 认证挫折，投资逻辑会迅速破裂，因为多条风险线都在讲同一个故事：Hithium
              的扩张速度超过了治理、资产负债表和渠道韧性能够承受的范围。
