      - number: '6.4'
        title: 耐久性、集中度与反向信号
        blocks:
          - type: paragraph
            body: >-
              Hithium 公开客户披露的最大短板不是缺少 logo，而是缺少耐久性数据。留存来源里没有公开的 NRR、GRR、流失率、续约率、活跃客户数或 cohort
              披露。服务承诺可以看到，多项区域框架和欧洲后续合作也释放出一定重复模式信号，但这些都不能替代续约数学。即便最强的官方案例，通常也止于投运、交付或框架规模。它们能证明采用，不能证明留存。


              集中度风险更容易看见。反向报道称，2024 年国际收入达到销售额的 28.6%，两个美国客户贡献了总收入近 24%，意味着少数海外交易对手就能撬动合并口径的收入结构。Powin
              是最清晰的压力测试。此前，一份为期三年的 5GWh 供应协议被包装成基于信任的全球集成商关系，也是 Hithium 300Ah 电芯的强证据点。Powin 于 2025 年 6
              月申请破产后，反向来源称其倒下危及该协议和至少 RMB 1.5 billion 预期收入，同时质疑 Hithium 美国扩张模式的韧性。这不会抹掉 Hithium
              已经拿到的真实客户胜利，但会重排尽调议程：投资人需要看到客户集中度、按交易对手划分的应收账款、积压订单转化、质保索赔历史和伙伴信用敞口，之后才能把当前订单集视为耐久的经常性需求。
