    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - CATL 诉讼恶化
        - 产品禁令、和解暗示需要重大重新设计，或赔偿金额远超当前索赔范围。
        - 会挑战产品连续性，并压缩估值倍数。
        - 从跟踪转为回避，除非价格大幅重置。
      - - 下轮降估值融资
        - 任何新一轮融资低于传闻中的当前估值，且没有结构性保护抵消。
        - 证实公开叙事估得过高，或流动性弱于预期。
        - 视为价格纪律上的论点破裂。
      - - 回款恶化
        - AR 天数从已经偏高的水平继续上升，或出现重大海外应收款减值。
        - 把增长变成融资问题，并抬高隐藏信用风险。
        - 要求重做收入质量和现金转化分析。
      - - 海外利润率优势消退
        - 国际毛利率向国内低水平收敛，且没有销量补偿。
        - 打破本地化 / 全球组合可以拯救经济性的假设。
        - 将估值重置到熊市情形倍数。
      - - 本地化资本开支超支
        - Texas / Spain 或其他海外资本开支扩大，但缺少清晰产能利用或回收支撑。
        - 增加稀释，并拉长 IPO / 流动性时间表。
        - 投资前要求项目层面的回报测算。
      - - IPO 延迟再次拉长
        - 管理层释放信号后，仍没有可信重新申报路径或保荐人可用草稿。
        - 降低近期退出可见度，削弱后期溢价。
        - 维持跟踪建议，或转为回避。
    notes: 这些触发因素是绑定估值论点的外部监测阈值，不是公司内部目标。
    claimRefs:
      - CV021
      - CV022
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权
        - 当前投后估值、清算优先权层级、反稀释、认股权证，以及任何附函。
        - 没有结构条款，估值判断只能给方向。
        - 公司 CFO / 法务；脱敏股权结构表和融资文件。
      - - 2025 年审计财务
        - 全年收入、按地区拆分的毛利率、EBITDA、现金流和补贴依赖。
        - 需要验证 H1 2025 的动能是否可持续、是否真实转化为现金。
        - 公司财务团队；审计报表和审计备忘录。
      - - 应收款质量
        - 前 20 大客户的 AR 账龄、核销历史、保理和保险覆盖。
        - 回款弱的增长应当给更低倍数。
        - 财务 + 主计长；账龄表和回款政策。
      - - Powin 和头部客户敞口
        - 已签约 backlog、已发货 backlog、债权人状态，以及受影响美国销量的替代方案。
        - 检验客户集中风险是已被控制，还是仍在发酵。
        - 商务团队；客户层面的 backlog 桥接。
      - - CATL 诉讼
        - 索赔摘要、产品重叠分析、律师对救济风险的意见，以及任何重新设计预案。
        - 法律阴影直接影响可融资性和 IPO 时间表。
        - 总法律顾问；案件备忘录和外部律师函。
      - - 本地化经济性
        - Texas、Spain 以及任何 Saudi / 其他海外资本开支、产能利用目标和单位经济假设。
        - 如果回报偏弱，资本密集度会吃掉表面增长。
        - 运营 + 战略；项目模型和产能爬坡。
      - - IPO 重启材料
        - 最新保荐人草稿、目标募资额、估值区间、基石投资者兴趣和障碍清单。
        - 需要据此承销退出准备度，而不是默认已经准备好。
        - IPO 工作组 / 保荐人；最新草稿和问题清单。
      - - 质保和现场表现
        - 索赔率、替换准备金、保险条款，以及按地区更新的可融资性材料。
        - 储能买方看重全生命周期可靠性，而不只是出货排名。
        - 产品 + 服务团队；质保材料和保险方反馈。
    notes: 每个问题都直接服务于投委会决策，并有意写成改变建议所需的证据，而不是泛泛的管理层问答。
