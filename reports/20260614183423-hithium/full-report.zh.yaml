      - number: '2.2'
        title: TAM、SAM 与受限规模测算视角
        blocks:
          - type: paragraph
            body: >-
              没有公开来源给出干净的 Hithium 专属 TAM/SAM/SOM 栈，因此市场只能从多个视角交叉估算。美国方面，2024 年底公用事业级电池储能在新增 10.4 GW 后已超过 26 GW，运营商还计划
              2025 年再增加 19.6 GW。EIA 也显示，电池储能已占美国 2024 年计划新增发电容量的 23%，独立储能还显著受益于 IRA 对储能税收抵免的处理。全球层面，BloombergNEF
              上一份广泛免费公开的储能展望预测，到 2030 年固定式储能累计达到 358 GW / 1,028 GWh，并称用户侧电池仍可达到约四分之一装机。这个视角有用，但已经陈旧：中国仅 2023 年就达到 31.4
              GW 电池储能，美国 2024 年底超过 26 GW，LFP 价格 / 政策动态也较 2021 年大幅变化。最实用的 Hithium SAM 视角，是那些长时
              LFP、融资性和安全认证很重要的公用事业级与工商业项目子集。Hithium 已公开合同——与 BOS Power 的 3 GWh、英国 720 MWh、德国 21 MW / 55 MWh
              项目——证明它有相关性，但这仍只是公开可见的下限楔子，不是完整 SOM。
