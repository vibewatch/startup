  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Hithium 当前本地化和渠道模型中的关键外部依赖。
    data:
      nodes:
        - id: D1
          label: 中国来源电芯
          detail: 仍是许多海外系统的关键上游输入。
          tone: risk
        - id: D2
          label: Texas 组装厂
          detail: 改善本土姿态，但没有实现完整电芯独立。
          tone: positive
        - id: D3
          label: 美国关税 / FEOC 制度
          detail: 改变中国关联供应链的经济性和资格。
          tone: risk
        - id: D4
          label: Powin / 集成商渠道
          detail: 将电芯供应转化为项目流和应收款。
          tone: risk
        - id: D5
          label: Navarre / Spain 当局
          detail: 控制许可、补贴执行和产业落地。
          tone: risk
        - id: D6
          label: MANAT / Saudi JV
          detail: 提供本地伙伴可信度和区域制造选择权。
          tone: risk
        - id: D7
          label: HKEX / 融资窗口
          detail: 仍然重要，因为 capex 依旧前置。
          tone: risk
        - id: D8
          label: 公用事业和开发商客户
          detail: 将本地化产能转化为可融资需求。
          tone: risk
      edges:
        - from: D1
          to: D3
          label: 暴露于
        - from: D1
          to: D2
