      - number: '2.3'
        title: 买方、用户、付款方与部署路径
        blocks:
          - type: paragraph
            body: >-
              买方地图在结构上按所有权模式分裂。在商用电站和公用事业级项目里，实际电池买方往往是开发商或 IPP，付款方则是公用事业公司、CCA、企业购电方或其他长期合同对手方。EPA 的 PPA
              指引把角色拆得很清楚：第三方开发商安装、拥有、运营和维护项目，货币化税收抵免并向终端客户收费；公用事业公司仍控制并网批准，并可要求会影响时间表的并网研究。面对公共电力和受监管公用事业买方，APPA
              储能指南显示，项目准备通常要经过可行性工作、融资选择、利益相关方对齐、技术选择、安全和监管审查、EPC
              合作以及持续运营规划。工商业和数据中心场景里，用户可能是场站运营方，但付款方仍可能是第三方业主、母公司资产负债表或合同化能源服务结构。Belfer
              的数据中心分析显示，大负荷客户越来越多使用私人电力合同、可用性付款和共址发电，因为电网时间表落后于建设时间表。这让 Hithium
              的销售动作不像简单设备转售，而更像参与一条由开发商、融资方和监管方共同调节的部署链。
