      - number: '8.3'
        title: 融资背景、稀释 / 优先权悬顶与可比估值锚
        blocks:
          - type: paragraph
            body: >-
              公开融资背景有帮助，但不完整。有帮助，是因为最后披露的轮次规模很大：Series B 超过 RMB 2 billion，Series C 超过 RMB 4.5
              billion，且有国资相关和金融投资人参与。不完整，是因为公开记录仍未披露今天的投后估值、清算优先栈、反稀释条款、认股权证覆盖，或任何 2025-2026
              年私募重定价；这些才会告诉新投资人真实有效入场价在哪。香港 IPO
              申报和失效显示，公司希望把私募规模转化为公开流动性，但没有实时发行区间，意味着市场仍未定价。投资人因此需要把稀释和优先权悬顶当成活风险来承销，而不是文档细节。


              公开可比公司提供了一些结构。CompaniesMarketCap 页面显示，截至 2026 年 6 月，Fluence 收入倍数约 1.7x、CATL 约 4.2x、BYD 约 1.1x、EVE Energy 约
              2.0x。这些可比并不完美，因为 CATL 和 BYD 是多元化巨头，Fluence 是由 Siemens 和 AES 支持的集成商而非纯电芯公司，EVE 的电池敞口也比单纯储能更宽。即便如此，它们显示
              Hithium 隐含约 1.8x-1.9x 的销售参考点位于公开区间内部，而不是区间之外。REPT Battero、FlexGen
              等私营或准私营参考更缺乏估值透明度，但它们进一步说明，储能硬件和集成已是拥挤赛道，执行、本地化和可融资性至少和原始出货量一样重要。这意味着 Hithium 不应仅凭规模大、增长快就获得稀缺性溢价。
