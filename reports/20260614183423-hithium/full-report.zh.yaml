      - number: '4.2'
        title: 定价、利润率驱动与单位经济
        blocks:
          - type: paragraph
            body: >-
              Hithium
              的公开界面在产品定位上异常清楚，在变现机制上却异常稀疏。公司销售一体化、定制化储能解决方案，而不是公布价目表，因此官方产品页能证明供给形态，却不能证明已实现收入或毛利率。最好的公开经济性线索来自结构。2024
              年系统收入快于总收入增长，2025 年上半年收入和毛利继续大幅上升，第三方分析也认为国际业务毛利率明显好于大陆业务。官方产品发布还通过设计简化支撑利润率提升叙事：Hithium 称，基于 1175Ah 的
              6.25MWh 平台将非电芯部件成本降低超过 30%，原生 8 小时平台围绕 25 年项目寿命设计。这些主张方向上有帮助，但承销仍卡在缺失指标：没有公开披露实际电池 ASP、实际系统
              ASP、质保准备金强度、安装毛利率、按地区划分的现金回收节奏或月度 burn。因此，单位经济图景更适合描述为收入质量在改善，而不是盈利能力已被充分验证。
