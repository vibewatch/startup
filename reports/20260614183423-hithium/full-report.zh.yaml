      - number: '1.2'
        title: 创始人、领导层与治理不透明
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据集中在创始人兼董事长吴祖钰（也称 Jeff Wu）身上，顶层以下透明度低得多。TMTPost 和 Energy-Storage.news 的负面报道都点名吴祖钰，称其主导 Hithium 对
              CATL 诉讼、IPO 状态质疑和公开谣言管控的回应。因此，他既是公司最清晰的公开面孔，也是最大的单一关键人物风险。同一批报道还把吴祖钰及其他前 CATL
              员工与竞业限制、知识产权争议联系起来，这意味着创始人声誉已经直接绑定法律和商业尽调。


              吴祖钰以下，公开记录更零散。Verdict 将 Wang Pengcheng 列为联合创始人兼总经理；Tracxn 列出 Jason Wang
              为联合创始人；名称差异大概率来自音译，而不是第二个人，但抓取记录无法最终证明这一点。Texas 工厂公告确认 James Boswell 为 North America Operations
              VP，为海外执行提供了一个额外运营锚点。证据没有给出当前董事会名单、委员会架构或独立董事地图。对于一家谋求公开股权融资的公司，治理不透明很关键：投资人能看到创始人能见度和部分运营副手，却还无法清楚画出正式监督结构。
