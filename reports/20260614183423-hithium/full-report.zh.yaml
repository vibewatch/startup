      - number: '8.2'
        title: 建议、置信度、风险与入场纪律：跟踪，不买入
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪。置信度：中。风险评级：高。估值立场：公允。这个组合反映的是一家公司已有足够运营证据，可以继续保持可投资性；但价格透明度还不足以支持今天给出买入建议。如果独立媒体报道方向正确，Hithium
              估值已经超过 $3.5 billion，则基于 2024 年收入的隐含销售倍数约为 1.9x，基于 2025 年上半年收入简单年化约为 1.8x。对照 Fluence、BYD、EVE Energy、CATL
              等公开储能相关可比公司，这些水平并不明显过高。不过，民营公司流动性不足、法律风险、客户集中度和股本结构不透明，应当要求相对公开可比公司折价，而不是平价。


              核心原因在于不对称，所以结论是跟踪而非买入。按传闻中超过 $3.5 billion 的参考价格，公开可比区间和我们的情景测算显示，基准情形只有有限上行；若诉讼升级、海外利润率组合回落，或 IPO
              时间再次推迟，下行仍然明显。因此，入场纪律比欣赏运营故事更重要。只有两种情况下，建设性入场才有吸引力：（a）投资人能以显著低于传闻当前标记的估值进入，大致在基准情形区间低端；或（b）拿到强优先权保护，并验证积压订单质量，直接看清营运资本和诉讼敞口。没有任一条件，公司值得跟踪，但不值得硬买。
