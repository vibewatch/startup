      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出有可行性，但还不干净。最可信的中期退出仍是公开上市，前提是 Hithium 能以更清晰的诉讼披露和更强的审计数字重新递交香港
              IPO。战略出售是次选路径，但潜在买方也很可能是最有动力压估值纪律、而不是溢价收购的公司。投资人面对的因此是熟悉的后期工业企业问题：流动性在概念上可见，但时间和价格高度路径依赖。


              投资逻辑破裂触发点应明确。诉讼状态显著恶化、海外利润率优势出现可观察逆转、证据显示 Powin 情况并未被控制，或私募 / 下轮融资低于隐含当前标记，都会打破 Hithium
              应获得类似公开可比公司收入倍数的论证。同样，如果公司无法证明积压订单质量、回款纪律和关税缓释经济性，规模故事就会变成营运资本故事。


              最终尽调包应窄而实用。投资人不需要更多产品营销；他们需要股本结构、优先权栈、2025 年审计账目、按头部客户划分的应收账款账龄、Powin 和其他海外交易对手的详细敞口、CATL 案件备忘录和救济分析，以及最新
              sponsor-ready IPO 草案。如果管理层能提供这些材料，且价格仍处于基准情形区间低端，建议可以从跟踪转向买入。否则，本章当前结论应保持不变。
