        title: 能力宽度真实存在，但融资性仍落后最大既有玩家
        blocks:
          - type: paragraph
            body: >-
              单看产品宽度，Hithium 有可信度。公开电芯路线覆盖 2 小时、4 小时和长时格式，系统页面也显示集装箱产品从约 4MWh 覆盖到近 7MWh，并引用 UL 和 NFPA
              合规。公司把这套路线上接了开发商关心的两个信号：本地化和安全。Texas 给 Hithium 在美国留下 10GWh 模块与系统支点，MANAT 合资则会把同样的 local-for-local 逻辑延伸到
              Saudi Arabia。开放式消防测试活动也让公司的安全叙事比许多年轻对手更锋利。问题不是 Hithium 没有产品实质，而是标杆一直在移动。CATL 如今结合了 772GWh 已装机容量、321GWh
              在建产能、100 MVA 储能验证中心和披露的 ESS 收入。BYD 全球储能出货早已超过 135GWh。Sungrow 有公用事业规模的独立燃烧测试宣传。Fluence
              把公开母公司背书和软件叠进产品包。在这个背景下，Hithium 的融资性差距不在于缺某个功能，而在于经审计披露更薄、装机基础证据栈小于资源最强的对手。
