      - number: '2.4'
        title: 增长驱动、约束与 Hithium 相关性
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动都能从外部看到。California 可再生能源弃电上升、鸭子曲线加深、独立储能税收激励、AI / 数据中心负荷加速，都扩大了对快速响应、可调度电池容量的需求。EIA 量化称，2022 年
              California 风电和太阳能弃电达 2.4 million MWh；California 电池容量也从 2018 年 0.2 GW 增至 2023 年 4 月 4.9 GW，并仍在扩张。与此同时，EPRI
              的 2026 年视角认为，到 2030 年美国数据中心将占全国用电需求的 9% 至 17%，hyperscaler 和公用事业决策越来越受兆瓦可用性塑造，而不只是电价。Hithium
              有相关性，是因为它的公开足迹集中在 ESS，而非 EV 电池：公司声称 2025 年上半年公用事业级出货 Top 2、Grade A 融资性、TÜV / EU
              电池就绪，并在欧洲和英国有公用事业级案例。约束同样重要。LBL 显示，储能占比高的排队项目仍面临四年以上中位时间和低完成率。中国非 EV 锂电池关税将在 2026
              年大幅上升，本土含量规则让美国经济性更复杂，BNEF 的价格历史也显示电池成本并非直线下降。安全和融资性仍是门槛，这也是 Hithium 为什么在公开沟通上大量投入消防测试、大尺寸电芯降本主张和认证叙事。
