  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、结构迁移与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Hithium 通过一套储能栈变现：起点是 ESS 电芯，向上进入更高价值的一体化系统，再延伸到项目交付和售后支持。公开披露现在已经足以说明，公司具备财务体量，而不是单纯处于开发阶段：Hithium 称 2024
              年收入从 2023 年 RMB 10.2B 增长 26% 至约 RMB 12.9B，系统收入则翻倍以上至 RMB 4.67B，占总销售额
              36.2%。这一结构迁移重要，因为系统业务看起来比纯电池出货有更好经济性，也让国际本地化更具融资性。国际销售也变得有分量，从 2023 年几乎可忽略的基数增至 2024 年收入的
              28.6%；官方和第三方来源还描述了 20 多个国家的部署或服务覆盖。出货牵引力同样重要：公开来源引用 2024 年 35.1GWh 出货、2022 至 2024 年 167% CAGR，以及截至 2025 年
              8 月累计出货超过 100GWh。结果是，公司收入模型并不依赖一次性试点销售；但公开记录仍缺少各产品线实际 ASP、合同期限、折扣、维护附加率等信息。
