      - number: '7.3'
        title: 运营、安全与依赖风险正在改善，但仍未完全可融资
        blocks:
          - type: paragraph
            body: >-
              Hithium 的安全叙事好过许多高速增长的同行，但测试表现仍比现场表现更容易证明。官方和独立来源共同显示，公司完成了开放舱门的 6.25MWh 火灾测试，测试条件由 UL 9540A 见证并与 NFPA 855
              对齐；UL 最新标准也把安全验证从较窄的组件检查推向全舱、系统级事件。这是真正的缓释项，因为它降低了 Hithium
              只靠宣传册卖货的概率。但缓释并不完整，因为更广泛的标准环境也在同步收紧：随着系统体量增加，大规模火灾测试、气体与爆炸评估、AHJ / 保险人审查都更严格。运营侧，Hithium
              的本地化也只部分去风险。Mesquite 工厂给了公司美国模块和系统组装足迹，但多方来源称该工厂不被认为包含电芯产线；在关税、FEOC
              和本土含量规则趋严时，公司仍依赖中国来源电芯。交易对手敞口让这一点更危险。Powin Chapter 11 说明，集成商失败会冲击订单和回款；公开市场报道仍把 Hithium
              放在一小组已知集成商关系之中。西班牙和沙特提升了选择权，但在美国供应链完全本地化之前，它们也新增了政府、本地伙伴和许可时间线等执行接口。
