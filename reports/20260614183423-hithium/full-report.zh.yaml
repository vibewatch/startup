  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分客群地图与买方标准
        blocks:
          - type: paragraph
            body: >-
              Hithium
              的公开客户故事不是泛泛的「所有市场」推销，而是围绕公用事业级、工商业（C&I）和住宅场景分层，其中大多数证据偏向公用事业级和伙伴主导渠道。公司的解决方案和产品页明确区分公用事业、工商业和住宅产品，2026
              年产品和访谈材料也称组合现在覆盖这些场景下的 1 至 8 小时应用。不过，实际公开证据深度并不均衡。公用事业级证据包括 Saudi Arabia、Ukraine、Eastern Europe 和 United
              States 的命名项目、命名交易对手和大型框架协议。工商业证据存在，但更多是基于地点的项目证据，而不是命名企业客户披露。住宅证据最弱：保留证据中最清晰的是一份 1GWh Vietnam
              渠道协议，而不是命名家庭或安装商群体。


              买方标准故事比留存故事更清楚。Hithium 2026 年接受 Energy-Storage.news
              采访时称，客户正从低价和快速交付，转向本地化、融资性、安全、可靠性和生命周期可信度。其支持页面用区域服务人员、仓库、备件承诺、调试支持和保后服务强化这一定位。Munich Re
              质保再保险公告又为项目业主和贷款方增加了一个独特的融资性标记：Hithium 可以指向第三方尽调和最高 15 年质保覆盖；对公用事业和项目融资买方来说，这远比纯价格驱动的大宗销售重要。结果是一种
              go-to-market 组合：Hithium 不只是想低价卖电芯，而是在通过服务、质保结构和本土含量信号降低买方摩擦。
