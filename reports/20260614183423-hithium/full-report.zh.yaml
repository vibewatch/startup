  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最大风险在传导：法律、价格和本地化问题可能叠加成融资压力
        blocks:
          - type: paragraph
            body: >-
              Hithium 现在像是一家已有真实商业规模、但执行容错很窄的公司。证据并不指向生死级技术失败：公司有真实出货、大规模 UL
              见证火灾测试，以及美国、西班牙、沙特的本地化项目在推进。承销问题在于，这些强项同时伴随几类相互耦合的风险，且风险会彼此放大。香港上市申请失效不必然扼杀
              IPO，但会让法律披露、客户健康度和营运资本质量变得更重要，因为公司仍在为长期 capex
              计划和多个国际建设项目融资。中国监管部门已另行释放信号：低于成本销售、重复建设和质量滑坡不再是可容忍的行业行为；这很关键，因为 Hithium 竞争的正是价格压力最强的市场区间。Powin
              破产又说明，交易对手承压时，渠道敞口会迅速变成收入和回款风险。结果是一组风险栈：诉讼、价格战、关税敞口和伙伴脆弱性，最终都流向同一个问题——Hithium
              能否在不牺牲质量、利润率或选择权的情况下，继续支撑全球扩张融资？
