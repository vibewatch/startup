      - number: '5.4'
        title: 相对大宗 LFP 市场的差异化与路线图方向
        blocks:
          - type: paragraph
            body: >-
              Hithium 最强的差异化在执行，而不在化学体系。更广泛市场正向固定式储能里的 LFP 收敛，因为它比 NMC 更便宜也更安全；大尺寸比较文献还显示，行业已经从 280Ah、314Ah 走向 587Ah
              及以上。这意味着 Hithium 不能把拥有大电芯本身当作护城河。它可以较可信地声称的是一个更具体的组合：较早进入 587Ah/1175Ah/1300Ah 规格，通过 ∞Pack+ 做平台标准化，在
              6.25MWh 规模公开验证安全性，并把本地化策略调向对融资性敏感的市场。这些都是商业上有意义的优势，但其他领先者可以部分复制。


              路线图同时强化上行空间和限制。SNEC 2026 上，Hithium 将组合扩展到基于 1300Ah 的 6.9MWh 8 小时系统、新 650Ah 电芯和 10+MWh 方向，同时继续展示覆盖锂离子和钠离子的
              1 至 8 小时矩阵。这支持一个判断：管理层理解时长分层，没有停在 2 小时公用事业储能上。同时，外部分析称 587Ah 正成为行业级甜点位，CATL 诉讼也直接攻击 Hithium 587Ah
              路线的原创性。含义是，Hithium 可能足够领先以保持相关性，但还没领先到能摆脱价格、专利和融资性压力；一旦客户认为市场上已有许多合格 LFP 替代品，这些压力就会出现。
