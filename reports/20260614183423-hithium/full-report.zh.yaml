companyProfile:
  summary: >-
    Hithium 是一家位于厦门的固定式储能公司，成立于 2019 年，聚焦 LFP 电芯、模块、电池包以及面向公用事业级、工商业和部分住宅场景的一体化电池储能系统。公司借助中国制造和激进的海外商业化快速放量，2023 年 7 月完成
    RMB 4.5B+ 的 Series C，招股书阶段报道显示 2024 年收入约 RMB 12.9B，并在 2025 年申请失效后准备重新赴港上市。Hithium 的核心投资吸引力在于 ESS
    规模扩张快、海外收入占比改善；核心尽调摩擦则来自法律、披露和营运资本透明度不足。
