  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点：规模证据真实，价格保护不足
        blocks:
          - type: paragraph
            body: >-
              Hithium 的建设性论点在于，它看起来已经更像一家有规模的工业储能供应商，而不是尚未放量的初创公司。公司把自己定位为专注电池储能系统的供应商，而非通用 EV 电池厂；公司发布的 2025
              年出货更新称，其在全球储能电池总出货和公用事业级出货中均排名前二。围绕香港 IPO 流程的公司推广财务报道称，2024 年收入约 RMB 12.9 billion，储能系统收入翻倍以上至 RMB 4.67
              billion，海外收入占比跃升至 28.6%，调整后利润转正至 RMB 318 million。BusinessNewsAsia 和 SCMP 补充称，2025 年上半年增长仍很快，管理层正推动 2028
              年海外收入占比大幅提高。WEF lighthouse 认可和 BNEF Tier 1 信息强化了一个判断：Hithium 已跨过有意义的可融资性和制造执行门槛，而不只是实验室里程碑。


              反论点是，估值支撑落后于运营动能。最新披露的私募轮仍是 2023 年 7 月 Series C；IPO 前公开报道只说明 Hithium 估值已超过 $3.5 billion，并未说明 2026
              年新投资人在考虑优先权、反稀释或老股折扣后实际会付什么价格。IPO 本身已失效并进入重新递表模式，因此仍没有透明的公开市场清算价。与此同时，独立反向报道把公司与 CATL 不正当竞争诉讼、大额 Powin
              相关收入敞口惊险、应收账款偏高和国内严重价格压力联系起来。换句话说：Hithium 已经做出足够规模，值得认真考虑；但披露还不足以让投资人在没有结构性下行保护的情况下支付增长溢价。
