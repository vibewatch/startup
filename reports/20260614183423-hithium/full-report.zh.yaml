      - number: '4.5'
        title: 尽调缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              最强的正面财务信号是，Hithium 已经有足够公开规模，可以围绕结构、capex
              和营运资本来讨论承销，而不只是讨论简单的产品市场匹配。最强负面信号是，最影响决策的指标仍缺失，或来源不均衡。不利情形并非假设：一个关键来源报道了 Powin 破产敞口、应收账款上升、高杠杆、2024
              年净现金流为负以及 CATL
              诉讼。即使部分细节还需要主文件确认，风险方向已经清楚：快速全球化可以改善收入结构，同时仍会拉长回款周期、质保准备金和资金需求。公开来源也没有解决实际定价、客户集中度、坏账计提或上市后流动性问题。因此，结论既不是不透明且无法扩张，也不是已经可以干净地按公开市场承销。它是一家快速扩张、商业质量在改善的储能制造商；但投资人若要有信心承销利润率或估值，仍需要在管理层会议中看到资产负债表韧性和现金转化证据。
