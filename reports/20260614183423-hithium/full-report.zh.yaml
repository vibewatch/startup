      - number: '5.2'
        title: 架构、工作流与安全设计
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Hithium 的产品逻辑很直接。买方先确定时长、项目地理位置和电站配套约束；Hithium 再把这些需求映射到电芯家族、电池包或机架配置，以及兼容集中式或组串式 PCS
              的集装箱系统。公司希望买方相信的架构故事是：更大尺寸电芯可以减少并联数量、线束复杂度和非电芯部件成本，同时支持可维护、标准化的系统构建。官方产品和发布材料给出了足够细节来支撑这一框架。587Ah 电芯支撑 2
              小时系统，1175Ah 电芯支撑 4 小时和长时系统，6.25MWh 平台则被呈现为带共享部件和灵活 PCS 集成的通用系统外壳。


              最重要的技术证据点是安全。Hithium 把开放式消防测试放在信任叙事中心；不同于许多电池厂商，它披露了相当多的测试设置和内部防护架构。6.25MWh 测试在柜门全开、间距仅 15 cm、100%
              SOC、主动灭火关闭的条件下运行；公司还描述了三维排气、双泄压阀、防火模块盖、钢制外壳、绝缘多层隔板，以及同时覆盖功能安全和网络安全的双重保护
              BMS。这不能证明全生命周期现场表现，但确实显示公司在有意回答公用事业采购中常常卡住的热蔓延和可保险性问题。
