chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品范围和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Hithium 2019
              年成立于福建厦门，身份锚点很清楚：不去卷规模更大的电动车电池市场，而是专注固定式电池储能。官网、产品系统页和公司介绍页都反复强调，公司提供电芯、模块、电池包和液冷系统的一体化组合，服务公用事业级、工商业和住宅应用。官方
              About 页面还称，Hithium 从材料、电芯、系统到控制技术做垂直整合，并由四个研发院和 1,100 多名工程师支撑。


              抓取来源里的规模信号有意义，但口径并不完全一致。World Economic Forum 资料称 Hithium 约有 8,000 名员工、3,900
              多项专利；目录型来源则给出更低员工数和更有限的办公室地图。可以稳定确认的是，公司总部在厦门，运营不止一个中国基地，并且在中国以外已有参考部署。Hithium 自己的案例页强调 Colorado 和
              Bulgaria 的公用事业级项目，官方 2025 年公告则显示欧洲、Texas 和 Saudi Arabia 的本地化正在推进。后续章节可复用的底层事实是：Hithium 是一家聚焦
              ESS、正在全球商业化的制造商；它的身份定位强于披露纪律。
