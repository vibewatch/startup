      - number: '5.5'
        title: 不利证据、缺失披露与技术结论
        blocks:
          - type: paragraph
            body: >-
              技术不利情形不是 Hithium 没有产品，而是支撑融资级信心所需的证据仍不完整。CATL 诉讼直接触及技术原创性，指控人员、IP 路线和 587Ah
              设计参数存在重叠。香港上市失效报道又把客户破产消息和应收账款压力叠加到这一担忧上；IBTimes 批评则认为，补贴依赖和遗漏运营风险削弱了公开披露质量。这些文章都没有证明现场安全失效，Hithium
              也强硬回应称相关主张不影响生产。但它们确实提高了贷款方、保险方和成熟买方的信任成本，这些买方想要独立审计证据，而不是公司控制的叙事。


              平衡结论是，Hithium
              的产品技术案例强于典型快速扩张的电池新进入者，但弱于最干净、最可融资的既有玩家。电芯到系统的栈、安全架构，以及越来越成熟的制造和本地化，都有真实证据。公开证据还不能同等有力地证明独立现场可靠性、质保损失经验、跨基地缺陷率，或每个已营销电芯变体的清晰文档。在大宗属性很强的
              LFP 市场里，这意味着 Hithium 的优势可信但有条件：若买方重视标准化、按时长设计的平台和本地交付，它可以赢；但在独立质量和融资性披露追上增长故事之前，技术尽调仍应保持怀疑。
