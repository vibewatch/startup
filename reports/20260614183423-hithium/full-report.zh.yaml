      - number: '4.3'
        title: 制造扩张与 capex 强度
        blocks:
          - type: paragraph
            body: >-
              公司的财务画像由制造强度主导。2026 年 HKEX 申请版本显示，IPO 募资用途包括常州一期升级、常州二期绿地建设、新研发中心、销售和交付扩张、补充性收购以及营运资本。申报文件列出的是一条长 capex
              尾部，而不是短期过桥：常州一期设备升级持续到 2027 年，并优化到 2031 年；常州二期目标 2029 年建成厂房、2031
              年满产。同一文件明确警示，扩张会增加固定资产、折旧、摊销和运营成本；在价格竞争激烈的电池市场里，这正是投资人应该关注的自述式利润率压缩风险。中国以外，Hithium 也在 Texas
              本地化产能，并探索欧洲。公开来源都同意 Texas 工厂规模为 10GWh，但成本说法不一致：SCMP 描述约 US$100M，Texas 本地报道则描述接近 US$200M。Spain 还增加了潜在 €400M
              承诺。这个模式指向一家有真实增长选项的公司，也指向一家制造路线图会在利润率或现金流完全体现收益前吸收大量资本的公司。
