  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - IPO / 融资脆弱性
        - 重新提交 HKEX 文件或等效长期融资
        - 在常州 / 海外重大开支进一步爬坡前，没有清晰的重新递表进展，也没有替代的已承诺资本
        - 说明资本需求正在跑赢披露准备度和贷款人胃口。
        - 除非估值重置且融资应急安排得到充分承保，否则视为投资逻辑破裂。
      - - CATL 诉讼风险
        - 法院结果或临时禁令信号
        - 围绕 587Ah 产品线的不利判决、禁令威胁或索赔范围扩大
        - 可能同时伤及旗舰产品、增加披露负担，并拖慢 IPO 审查。
        - 暂停投资，或在明确纳入产品重新设计和延误假设后重新承保。
      - - 价格战 / 产能过剩风险
        - 项目定价和监管后续执行
        - 有证据显示，Hithium 在监管加强执法时，仍以贴近成本底线的价格赢得重大项目
        - 说明份额获取靠经济性或合规质量换来，而不是靠护城河。
        - 大幅降低信心，并要求经验证的项目级利润率和准备金数据。
      - - 安全 / 质量风险
        - 现场事故、召回或认证受挫
        - 公用事业规模下，任何确认的热蔓延事件、重大质保潮、认证撤回或保险方拒保
        - 会推翻“认证证明已经转化为机队可融资性”的判断。
        - 立即视为投资逻辑破裂，直到根因和准备金影响得到充分披露。
      - - 交易对手集中风险
        - 主要集成商或头部客户健康状况
        - 又一家主要海外集成商破产，或证明少数美国客户仍主导海外利润率
        - 说明渠道韧性提升幅度小于出货头条所暗示。
        - 用受压集中度假设给公司估值，并收紧营运资本下行情景。
      - - 本地化执行风险
        - Texas、Navarre 和 Saudi 里程碑交付
        - Texas 仍只是组装且没有可信的电芯多元化，Navarre 明显延误，或 Saudi 到 2027 年仍停留在公告阶段
        - 说明全球化增加资本开支和复杂度的速度，快于它移除政策和供应链风险的速度。
        - 除非公司能证明替代采购和进度修复，否则把案例转为继续研究 / 回避。
    notes: 这些触发因素刻意设计成可监控、足以击穿投资逻辑，因此本章可直接进入投 / 等 / 退出决策，而不是停在泛泛谨慎表述。
