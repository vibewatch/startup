        - 现在到 2030 年
        - 支撑长时、表后和共址储能需求
        - Hithium 哪些部署是真实生产项目，哪些只是产品营销？
      - - 中国国内规模和出口产能
        - 驱动因素和风险
        - 现在
        - 本土市场规模支撑制造学习曲线，但也会加剧出口定价压力
        - Hithium 产量中已有多少比例锁定国内、多少用于出口？
      - - 并网排队延迟
        - 约束
        - 现在
        - 项目被推迟，融资持有成本上升，快速部署说法更难变现
        - Hithium 客户有多大敞口暴露在四年以上排队周期中？
      - - 关税和本土内容规则
        - 约束
        - 2026 年起在美国
        - 抬高中国产电池的有效成本，并改变采购选择
        - Hithium 能否把足够内容或组装本地化，守住美国竞争力？
      - - 安全 / 火灾测试审查
        - 约束和限定条件
        - 现在
        - 可融资性取决于认证、UL 9540A 证据，以及有管辖权机构的认可
        - Hithium 测试多常转化为贷款方 / 保险方接受？
      - - 电池成本波动和价格战
        - 约束
        - 现在
        - 价格先下降再波动，会压缩供应商利润率并影响客户下单时点
        - Hithium 合同是固定价、指数挂钩，还是有利润率保护？
      - - 定价、质保和客户集中度的私有信息
        - 约束
