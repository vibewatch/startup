      - number: '3.4'
        title: 商品化与监管反应是主要证伪力量
        blocks:
          - type: paragraph
            body: >-
              不利情形不是 Hithium 没有产品，而是整个中国储能栈正被拖向更硬的经济性和更重的审查。2026 年 1 月给出最清晰的直接证据：中国监管部门约谈头部电池和系统企业，包括
              Hithium、CATL、BYD、EVE 和 REPT，警示低于成本销售、盲目投资和无序产能扩张。BYD 董事长另称 2026 年初是行业「最黑暗时刻」；CATL
              的电芯成本下降则显示，最大供应商仍能继续把价格底部往下压。与此同时，美国国防部 1260H 清单新增 CATL、BYD 和 EVE，凸显海外融资性如今部分是政策变量，而不只是技术变量。Hithium
              没有被单独列入该清单，但仍在同一个中国来源审查环境里竞争，因为保留公开记录显示其电芯仍来自中国。平衡结论是，Hithium
              在固定式专注、本地化动能和安全叙事上有真实楔子。它还没有不可攻破的护城河。若公用事业采购继续围绕最低成本合格 LFP 加可信集成来标准化，巨头和系统既有玩家可以迅速压缩 Hithium
              的差异化，除非它深化项目案例、渠道控制和融资级披露。
