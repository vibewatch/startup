  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 相关同业集合同时包括中国 ESS 电芯对手和系统层既有玩家
        blocks:
          - type: paragraph
            body: >-
              Hithium 不是在一张扁平清单里和可互换电池品牌竞争。最接近的直接产品同业，是专门面向固定式场景销售大尺寸 LFP 的中国储能电芯厂商，尤其是 EVE Energy 和 REPT Battero。CATL 和
              BYD 位于外一圈：它们当然争夺同一批项目，但打法带着更宽的产业杠杆，因为 ESS 只是更大电池版图的一部分。第二圈在真实采购中同样重要。Sungrow、Fluence 和 FlexGen 竞争的是系统、控制和
              O&M 层，这一层往往最接近买方、贷款方和 EPC。Hithium
              自己的证据显示，它位于两层之间。公司现在同时卖电芯和完整集装箱，但保留下来的公开记录仍显示，它走的是内部系统叠加第三方集成商和本地伙伴的混合渠道。因此，Hithium
              最自然的正面对比对象，是在产品形态上对标中国固定式储能专家；最难的账户替换战，则常常要面对资本更充足的系统包装商，它们能把相似 LFP 化学体系做成可融资的交付包。
