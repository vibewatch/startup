      - number: '8.4'
        title: 牛市、基准与熊市情形：基准情形尚未跨过上行门槛
        blocks:
          - type: paragraph
            body: >-
              牛市情形假设 Hithium 能把规模转化为更干净的公开市场故事。在这条路径中，香港上市成功重新递表，CATL
              争议得到控制且没有产品禁令，海外本地化吸收关税压力，公司靠国际渠道维持更强的组合和定价。收入沿着强劲的 2025 年上半年 run rate 继续复合增长，投资人愿意给出 2.5x-3.0x
              的销售倍数，更接近高增长储能龙头。对应估值区间约 $5.5-7.0 billion，相较传闻中 $3.5 billion 以上的当前参考，约为 1.6x-2.0x gross MOIC。


              基准情形没那么令人兴奋，因此更重要。在这里，Hithium 会重新递表，但市场仍因诉讼、营运资本和国内经济性偏薄给出折价。收入仍增长，但倍数支撑更接近 1.5x-2.2x 销售额。对应估值约 $3.0-4.5
              billion，相比传闻当前标记仅为持平到温和正收益。这就是为什么很难给出买入判断：一家质量尚可的公司，如果入场价格已经消化大部分增长，仍可能是一笔平庸投资。


              熊市情形假设倍数压缩、客户压力和法律悬顶发生某种组合。如果 Powin 敞口比公司口径更痛，CATL 推动更强救济，或中国价格战环境继续压低毛利率，投资人可能把 Hithium 重估到 0.8x-1.2x
              销售额。对应估值约 $1.5-2.5 billion，会给后期私募进入者带来明显资本损失。决策框架因此很简单：不要为一家公开证据仍只支持基准承销的公司支付牛市价格。
