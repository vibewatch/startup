        title: 监管、法律与财务模型风险最难分散
        blocks:
          - type: paragraph
            body: >-
              Hithium 最严重的风险集中在监管—法律—财务这一簇，因为它们直接影响资本获取和增长叙事的可信度。2026 年 HKEX 申请材料显示，Changzhou
              项目资本开支沉重、周期延伸到本十年末；文件本身也警示，扩张会推高固定资产、折旧、摊销和成本，足以挤压利润率。如果上市路径清晰、现金转化强，这个负担还可管理。公开记录显示，两者都尚未成立。Hithium
              早前的香港申请已失效，公司公开准备重新递表，专业报道还把重新递表与 CATL 诉讼联系起来；该诉讼可能要求更充分披露重大诉讼，并让公司在战略重要的 587Ah
              电芯线周边面临禁令风险。在此之上，反向报道强调应收账款膨胀、杠杆偏高、2024
              年净现金流为负。即便部分数字仍需原始文件确认，风险方向已经清楚：这是一家资本密集型制造商，仍要证明收入规模扩大和现金生成扩大是同一件事。中国监管在 2026
              年干预反价格战，又增加了第二层法律和合规风险：如果利润率本就薄，对低于成本竞争更强的执法、以及更严格的质量和 IP 监督，会先伤到弱势玩家。
