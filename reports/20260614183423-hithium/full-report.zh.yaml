      - number: '4.4'
        title: 资本充足性、本地化与 IPO 背景
        blocks:
          - type: paragraph
            body: >-
              Hithium 的资本充足性叙事可信但不完整。支持面上，IPO 文件称扩张资金缺口可通过经营收入或银行借款覆盖；官方和公司周边公告把 Texas、欧洲、Saudi Arabia、Vietnam 和
              Australia 的本地化描述为有意为之的「local for local」策略，而不是投机式圈地。公司也持续增加融资性标记，包括 BNEF Tier 1 认可、出货 Top 2 排名和 World
              Economic Forum 灯塔称号。限制面上，公开文件隐去总募资额，也没有给出清晰的公开现金余额、月度 burn 或 runway。IPO
              进程本身仍是一个活的融资变量：最初香港申请按六个月规则失效，公司和专业媒体均称其准备重新递交，而非放弃上市。若资本市场窗口收紧，Hithium
              可能不得不更多依赖资产负债表借款，或放慢项目节奏，尤其是在关税和政策变化让美国经济性更复杂时。简言之，IPO
              背景重要，不是因为业务缺少牵引力，而是因为公开记录仍没有量化：在下一次大型融资事件出现前，公司能自担多少 capex。
