        - from: D6
          to: D8
          label: 赋能 MENA
        - from: D7
          to: D2
          label: 供资
        - from: D7
          to: D5
          label: 资金
    approximationNotes: 这张图把更大的合作伙伴网络简化为最可能在未来 12-24 个月改变 Hithium 承销判断的依赖关系。
