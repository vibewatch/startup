      - number: '3.3'
        title: 转换成本位于电芯层之上：渠道、软件和本地化
        blocks:
          - type: paragraph
            body: >-
              保留来源集合里最重要的竞争洞察是，储能转换成本不来自安时本身。买方在合格电芯之间多归属，比替换一个已验证的系统集成商、项目包装商、软件栈或本地 O&M 伙伴容易得多。Hithium 正在改善：它在 Texas
              做系统本地化，搭建 Saudi 进入市场路径，并销售自有集装箱，而不是只做隐藏的上游供应商。但同一批证据仍显示混合依赖。Energy-Storage.news 描述 Hithium 电芯经由 NHOA、Risen
              以及 Powin-to-FlexGen 谱系流转，也有 Hithium 品牌项目。相比之下，CATL 的 Zinfra 和 Sieyuan 案例显示，它通过本地交付和长期合同掌握更强下游控制。Fluence
              更进一步，把 Gridstack 硬件与 Mosaic、Nispera 软件打包；BYD 的广泛项目基础则在 Hithium 刚进入的市场里形成可引用性。EVE 和 REPT 也在通过 India 和
              Indonesia 向外延伸。实际含义是，Hithium 可以靠适配目的的产品和本地化动能赢单，但最黏的锁定通常仍属于那些在软件、质保和本地规模化执行上拥有控制权的供应商。
