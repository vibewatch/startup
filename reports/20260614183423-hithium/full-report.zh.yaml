        - 公用事业或开发商伙伴
        - 公共公用事业系统
        - 董事会批准的公用事业资本开支或长期合同
        - 可行性研究 -> 利益相关方对齐 -> 融资 -> 安全 / 监管审查 -> 部署
        - 成本节省、韧性、本地可靠性
      - - IPP / 商业化开发商
        - IPP / 开发商
        - 开发商运营的市场化资产
        - 开发商股权、债务、税务股权、包销或市场化收入
        - 场址控制 -> 排队 -> 购电 / 包销 -> 融资 -> EPC -> COD
        - 套利、辅助服务、合同容量
      - - 企业数据中心 / hyperscaler
        - 开发商伙伴或企业业主
        - 数据中心运营团队
        - 企业资本开支、私营电力合同、可用性付款或 PPA
        - 负荷研究 -> 公用事业 / 私营电力谈判 -> 并网或共址 -> 调试
        - 取电速度、在线率、碳目标
      - - C&I 场址 / 微电网
        - 第三方开发商或场址业主
        - 设施 / 运营团队
        - CFO、能源经理、韧性项目或第三方服务合同
        - 电价分析 -> 系统定容 -> 合同 / 融资 -> 公用事业批准 -> 安装
        - 需量电费节省、备用电源、电价波动
      - - EPC / 集成商主导项目
        - 集成商代表业主向供应商采购
        - 业主或购电方
        - 由贷款方 / 税务股权 / 公用事业合同支撑的项目业主
