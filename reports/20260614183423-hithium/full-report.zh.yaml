      - number: '6.2'
        title: 公用事业级与工商业场景都有具名落地证据
        blocks:
          - type: paragraph
            body: >-
              Hithium 最有力的具名证据，来自已投运资产，或能说清开发商 / 公用事业客户的项目。公用事业侧，公司官网案例包括保加利亚 55MWh Razlog 项目、与 Whetstone Power 交付的超过
              200MWh Colorado 项目，以及中国 Shangdu、Tengger 等大型标杆项目。工商业侧，项目体量更小，但证据仍然具体：Hithium 在捷克和罗马尼亚的公开项目均标注为 2026 年 4
              月投运，且都强调电费价值，而不是抽象的技术领先。捷克项目使用 42 台一体机，总容量 10.962MWh，明确围绕峰谷价差套利展开；罗马尼亚项目使用 36 台一体机，总容量
              9.39MWh，并把储能接入客户的光伏系统。上述案例说明，Hithium 不只卖给大型电网，也在触达追求现场用电经济性的业主或运营方。


              但证据质量并不均衡。部分官网案例会点名合作方或客户，例如 Colorado 项目中的 Whetstone
              Power；另一些只给地点、容量和产品细节，不披露买方。因此，公开证据更能证明其运营相关性和部署成熟度，较难证明复购、客户满意度或具体商业条款。本章的承销结论是：Hithium
              在公用事业级和工商业两类场景都有真实部署证据，但官方案例很多时候更像工程展示，而不是披露交易对手、合同价值和续约情况的可融资客户背书。
