  rows:
  - - Recommendation
    - Track
    - Operating momentum is real, but current private price support is incomplete and upside is not clearly asymmetric at a rumored >$3.5B mark.
    - Stay engaged; do not force an entry before price or structure improves.
  - - Confidence
    - Medium
    - The public record is rich enough to bracket scenarios but too thin on cap-table terms, litigation remedy scope, and audited 2025 cash quality.
    - Require direct diligence before any IC-ready conviction call.
  - - Risk rating
    - High
    - Legal overhang, customer concentration, price-war pressure, working-capital intensity, and private illiquidity all remain material.
    - Size conservatively even if access improves.
  - - Valuation stance
    - Fair
    - Implied ~1.8x-1.9x sales sits inside public comp ranges, but private opacity should command a discount, not parity.
    - Only invest at the low end of base-case value or with strong protections.
  - - Entry discipline
    - Tight
    - Missing preference, backlog-quality, and receivables detail weakens downside protection.
    - Walk if management seeks a bull-case price without new disclosure.
  notes: Assessment is based on public evidence only as of 2026-06-14; no internal model, cap table, or management data room was reviewed.
