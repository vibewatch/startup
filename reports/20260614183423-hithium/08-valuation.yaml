    - Top-five global ESS cell shipments in 2025; valuation undisclosed
    - Private reference only; no clean public mark
    - Relevant Chinese ESS cell peer with real scale and BloombergNEF recognition.
    - No transparent market value, liquidity, or detailed public financials.
  - - FlexGen (private, integrator / software)
    - Private status; valuation undisclosed
    - Private reference only; no clean public mark
    - Useful downstream reference for how buyers value integration, controls, and bankability.
    - Not a cell manufacturer and no public valuation disclosure.
