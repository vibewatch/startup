  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: Current post-money valuation, liquidation preferences, anti-dilution terms, and any warrants or side letters from the latest private financing or secondary transactions.
    whyItMatters: A fair company can still be a poor investment if structure shifts downside away from new entrants.
    diligencePath: Request a redacted current cap table and financing summary from company counsel or the lead sponsor.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: 2025-audited-financials
    missingEvidence: Audited full-year 2025 income statement, cash flow statement, subsidy line items, and geographic gross-margin bridge.
    whyItMatters: H1 2025 growth may overstate sustainable earnings quality if collections, subsidies, or one-off mix tailwinds drove results.
    diligencePath: Obtain audited 2025 financial statements or the latest sponsor draft containing audited numbers.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Customer-level backlog, shipped backlog, collection status, and exposure to Powin or any other top overseas counterparties.
    whyItMatters: Customer concentration and credit stress can turn a growth story into a working-capital problem very quickly.
    diligencePath: Request customer concentration schedule, order book aging, and any restructuring or creditor documentation.
    relatedQuestionRefs:
    - QV029
  - type: conflicting-data
    severity: material
    topic: ipo-relaunch
    missingEvidence: Current IPO readiness status, latest filing draft, targeted proceeds, and any soft indications on offer range or cornerstone demand.
    whyItMatters: Exit readiness is part of the late-stage valuation case; repeated delay should reduce the multiple investors are willing to pay.
    diligencePath: Review the latest sponsor deck and issue list with management and underwriters.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: litigation-remedy-scope
    missingEvidence: External counsel assessment of CATL remedy risk, redesign options, and insurance or indemnity coverage.
    whyItMatters: Damages are only one risk; an injunction or forced redesign would have much larger valuation consequences.
    diligencePath: Request counsel memo, product-overlap analysis, and board-level risk treatment for the CATL case.
    relatedQuestionRefs:
    - QV020
