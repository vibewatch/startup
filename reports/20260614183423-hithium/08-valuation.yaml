    - June 2026 market cap $4.37B; TTM revenue $2.58B
    - ~1.7x market cap / revenue
    - Closest listed pure-play grid-storage integrator with global project exposure and bankability relevance.
    - Integrator, software, and service mix differs from a cell-and-system supplier.
  - - CATL (public, battery leader)
    - June 2026 market cap $270.0B; TTM revenue $63.65B
    - ~4.2x market cap / revenue
    - Upper-bound scale comp for bankability, manufacturing quality, and storage leadership.
    - Massively diversified across EV and other battery lines; not a clean Hithium comp.
  - - BYD (public, diversified battery + EV)
    - June 2026 market cap $123.43B; TTM revenue $107.28B
    - ~1.1x market cap / revenue
    - Shows how diversified Chinese battery groups can still trade near low-double-digit sales multiples.
    - EV business dominates; storage is not separately broken out in a clean way.
  - - EVE Energy (public, battery supplier)
    - June 2026 market cap $18.52B; TTM revenue $9.26B
    - ~2.0x market cap / revenue
    - More storage-exposed manufacturing peer than BYD and materially smaller than CATL.
    - Still not a storage-only public company; segment mix limits direct read-across.
