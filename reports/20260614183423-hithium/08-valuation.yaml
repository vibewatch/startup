- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis (constructive)
  - Anti-thesis (adverse)
  - What would change the view
  rows:
  - - Scale and position
    - Top-two 2025 shipment ranking and >100GWh cumulative shipments suggest real operating relevance in stationary storage.
    - Shipment rank alone does not prove durable pricing power or attractive investor returns.
    - Verified backlog quality and sustained non-China margin advantage.
  - - Financial momentum
    - 2024 revenue, systems mix, overseas mix, and adjusted profitability improved sharply into H1 2025.
    - Public 2025 evidence is still selective; cash conversion, audited earnings quality, and customer concentration remain under-disclosed.
    - Audited 2025 accounts plus AR aging by top customer.
  - - Manufacturing and bankability
    - WEF lighthouse recognition and BNEF Tier 1 messaging indicate credible execution and bankability progress.
    - Those badges do not eliminate legal, price-war, or working-capital risk.
    - Independent bankability studies, insurer terms, and warranty-loss disclosure.
  - - Financing pathway
    - Large Series B and Series C rounds show institutional access and sponsor interest for a public listing.
    - The last disclosed round is stale, and today's liquidation stack and anti-dilution terms are not public.
    - Current cap table, preferences, and any 2025-2026 secondary/private marks.
  - - Global localization
    - Texas, Spain, and broader overseas expansion can mitigate tariff and policy friction over time.
    - Localization is capital-intensive and could dilute returns if utilization or margins disappoint.
    - Factory-level capex, utilization, and payback math by region.
  notes: 'The table is analytical rather than factual: each row pairs directly observed positives with valuation-relevant counterarguments.'
