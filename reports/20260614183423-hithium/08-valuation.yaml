company:
  name: Xiamen Hithium Energy Storage Technology Co., Ltd. (Hithium)
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports Hithium as a scaled, fast-growing stationary-storage supplier, but not as a clear buy at a rumored private valuation above $3.5 billion. Revenue, overseas mix, adjusted profitability, and shipment ranking improved sharply into 2025, yet the latest disclosed round is still the July 2023 Series C and public sources do not verify today''s cap table, preferences, or IPO offer range. Compared with public storage peers trading at roughly 1.1x-4.2x revenue, Hithium''s implied multiple near 1.8x-1.9x looks fair on growth but thin on downside protection once litigation, customer concentration, price-war, and working-capital risks are applied. Recommendation: track, with medium confidence, high risk rating, and tight entry discipline.'
sections:
- id: investment-thesis-and-antithesis
  title: 'Investment thesis and anti-thesis: scale proof is real, price protection is not'
  body: 'The constructive case for Hithium is that it already looks more like a scaled industrial storage supplier than a pre-scale startup. The company positions itself as a dedicated battery energy storage system provider rather than a general EV battery vendor, and company-issued 2025 shipment updates say it ranked top two globally in both overall storage battery shipments and utility-scale shipments. Company-promoted financial reporting around the Hong Kong IPO process says 2024 revenue reached roughly RMB 12.9 billion, energy-storage-system revenue more than doubled to RMB 4.67 billion, overseas mix jumped to 28.6% of revenue, and adjusted profit turned positive at RMB 318 million. BusinessNewsAsia and SCMP add that first-half 2025 growth remained rapid and that management is pushing toward a much larger overseas mix by 2028. WEF lighthouse recognition and BNEF Tier 1 messaging strengthen the argument that Hithium has crossed a meaningful bankability and manufacturing-execution threshold,
    not just a lab milestone.


    The anti-thesis is that valuation support has lagged operational momentum. The latest disclosed private round remains the July 2023 Series C, while public reporting ahead of the IPO only indicates that Hithium''s valuation had exceeded $3.5 billion, not what a new investor would actually pay in 2026 after preferences, anti-dilution, or secondary discounts. The IPO itself lapsed and moved into resubmission mode, so there is still no transparent public-market clearing price. Meanwhile, independent adverse reporting ties the company to a CATL unfair-competition suit, a large Powin-related revenue exposure scare, elevated receivables, and severe domestic price pressure. Put differently: Hithium has built enough scale to deserve serious consideration, but not enough disclosure to justify paying a growth premium without structural downside protection.'
