  evidenceGaps:
  - type: missing-source
    severity: material
    topic: 320ah-disclosure
    missingEvidence: An official Hithium datasheet or product page that cleanly defines whether a 320Ah ESS cell exists as a separate commercial SKU from LF314 / 314Ah.
    whyItMatters: Channel ambiguity around 314Ah versus 320Ah makes cell-portfolio mapping and apples-to-apples competitor comparison less reliable.
    diligencePath: Request the latest official ESS cell portfolio matrix, datasheet pack, and SKU naming convention from Hithium product management.
    relatedQuestionRefs:
    - QE005
  - type: private-evidence-only
    severity: material
    topic: reliability-data
    missingEvidence: Independent field data on warranty claims, failure rates, service tickets, and degradation performance for 314Ah, 587Ah, and 1175Ah deployments.
    whyItMatters: Public fire testing helps with propagation risk, but investors still need fleet-level reliability evidence to underwrite bankability and reserve assumptions.
    diligencePath: Request insurer packs, warranty-loss runs, major-customer O&M summaries, and cohort degradation data by product family and region.
    relatedQuestionRefs:
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: manufacturing-yield
    missingEvidence: Audited cross-site yield, first-pass quality, scrap, and defect metrics for Chongqing, Texas, and any future overseas sites.
    whyItMatters: Claims of near-zero-defect intelligent manufacturing are important only if they translate into measurable and repeatable quality across plants.
    diligencePath: Ask for manufacturing KPI dashboards, external audits, and warranty-return splits by site and product generation.
    relatedQuestionRefs:
    - QE022
  - type: stale
    severity: material
    topic: spain-plant-scope
    missingEvidence: A finalized and current description of Spain plant output, target customers, localization schedule, and whether cells, systems, or both will ship first.
    whyItMatters: The quality and delivery benefit of localization depends on what is actually produced locally and on what timeline.
    diligencePath: Re-check Spanish government filings, local permitting, and Hithium project updates in the next refresh or via direct management Q&A.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: recall-and-incident-disclosure
    missingEvidence: A retained public source proving independent recall history, field-incident statistics, or absence thereof for Hithium systems.
    whyItMatters: The current adverse record is dominated by litigation and disclosure concerns, but product-risk underwriting also needs a clean view of actual field-safety history.
    diligencePath: Search regulator recall databases, insurer summaries, utility incident reports, and AHJ records for named Hithium system incidents by geography.
    relatedQuestionRefs:
    - QE025
