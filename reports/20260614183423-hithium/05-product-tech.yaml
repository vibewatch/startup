tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user or buyer
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - ESS Cell 314Ah
    - Integrators and system designers needing legacy-to-current LFP ESS cell supply
    - Commercial and explicitly documented on current official product page
    - Very long stated cycle life, broad certifications, abuse-test claims, and compatibility with 314Ah-era ESS architectures
    - No independent public field-failure or warranty-loss dataset
  - - LF314 / 320Ah channel variant
    - Distributors and replacement buyers searching for 314Ah-class prismatic cells
    - Publicly visible only through channel listing, not cleanly surfaced as an official flagship
    - Suggests aftermarket or channel demand for the 314Ah class
    - Need official datasheet and naming clarification because third-party listing mixes 320Ah marketing with 314Ah nominal specs
  - - ∞Cell 587Ah
    - Utility-scale 2h BESS developers and integrators
    - Commercial and explicitly documented on official product page and 6.25MWh launch materials
    - Higher capacity with still-manageable transport and system footprint; central to ∞Pack+ and 2h ∞Power positioning
    - Need independent cycle-life and warranty data at project scale
  - - ∞Cell 1175Ah
    - 4h and LDES system buyers needing kAh-class cells
    - Mass production and delivery publicly claimed since 2025
    - Cuts parallel count and non-cell component cost while supporting 6.25MWh/4h and LDES designs
    - Need more independent proof on yield, service data, and patent defensibility
  - - ∞Power 6.25MWh 2h/4h
    - Utilities, IPPs, EPCs, and system integrators
    - Commercial platform with public specs, launch history, and fire-test publicity
    - Shared ∞Pack+ architecture, PCS flexibility, public fire-test narrative, and duration-specific cell pairing
    - Need lender-grade installed-base, service, and claims-loss data
  - - 6.9MWh 8-hour / 10+MWh roadmap
    - Long-duration buyers and international channel partners
    - Roadmap / early market-introduction stage in 2026
    - Shows portfolio extension beyond the 2h-4h commodity center and into 8-hour applications
    - Need delivered project references, full datasheets, and customer acceptance evidence
  notes: Rows separate clearly documented commercial products from channel-only or roadmap-visible items; maturity reflects retained public evidence, not internal shipment counts.
