- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow or constraint
  - Hithium solution
  - Measurable or claimed benefit
  - Limitation
  rows:
  - - Build a 2-hour utility BESS block
    - Many 314Ah-era systems require more cells, wiring, and balance-of-plant complexity
    - Use 587Ah-based ∞Pack+ and ∞Power 6.25MWh 2h configuration
    - Higher energy per container and fewer parallel paths to manage
    - Independent project-level O&M data are not public
  - - Build a 4-hour grid-scale system
    - Longer duration raises container density, thermal, and safety concerns
    - Use 1175Ah-based ∞Power 6.25MWh 4h LDES platform
    - Lower non-cell component cost and duration-specific cell/system co-design
    - Realized LCOS and degradation curves are not independently disclosed
  - - Clear utility or AHJ safety review
    - Standard vendor claims often stop at certificates and brochures
    - Use Hithium’s open-door fire-test package plus UL/NFPA-aligned design claims
    - Better narrative for propagation, insurability, and siting discussions
    - Still does not replace long-run field incident data
  - - Deploy in hot or sandy environments
    - Generic liquid-cooled systems may not address desert stressors explicitly
    - Use Saudi-announced desert-tailored systems with sandstorm and temperature design emphasis
    - Better fit for MEA climate and 12+ hour use cases
    - No public independent test report was retained for the desert line
  - - Shorten U.S. delivery and localization risk
    - Import-only supply can slow approvals and service response
    - Use Texas-built modules and systems with local production and service
    - Shorter lead times and explicit American-standards positioning
    - Public sources do not yet break out U.S. content share or local supplier depth
  notes: Benefits are either directly claimed by Hithium or inferred from the documented architecture; nulls remain where public implementation and service evidence are still missing.
