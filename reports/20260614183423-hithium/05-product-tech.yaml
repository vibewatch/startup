- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - IEC 62619 / UL 9540A / UL 1973 / GB/T 36276 / UN 38.3 on 314Ah and 587Ah product pages
    - Explicitly listed
    - Cell-level commercial and transport qualification claims on current official pages
    - Public sources do not include full underlying test reports
  - - UL 9540 / NFPA 855 alignment on 6.25MWh systems
    - Explicitly listed
    - System-level code and deployment framing for containerized BESS
    - Certification presence does not by itself prove site-specific acceptance
  - - Open-door fire test under UL Solutions / AHJ / FPE supervision
    - Explicitly claimed and externally repeated
    - System-level propagation, explosion, and structural-integrity narrative for 6.25MWh platform
    - No retained third-party raw test report or independent insurer assessment
  - - Near-zero-defect and intelligent-manufacturing language from lighthouse factory release
    - Explicitly claimed
    - Manufacturing consistency and yield narrative at Chongqing LDES line
    - No audited scrap-rate, FPY, or warranty return metrics disclosed
  - - Texas quality and standards messaging
    - Explicitly claimed
    - North American system assembly and service responsiveness
    - No public quality KPI split between China-made and Texas-made output
  - - BNEF Tier 1 / bankability signal
    - Externally reported
    - Perception of product reliability, warranty capacity, and balance-sheet fitness for global projects
    - Underlying BNEF methodology output is not fully public in retained sources
  notes: This table distinguishes presence of certifications and quality claims from the harder-to-get underlying test, yield, and warranty evidence that lenders and insurers often request.
