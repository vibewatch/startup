- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Key risk
  rows:
  - - Cell chemistry and electrode stack
    - Provide LFP electrochemistry optimized for long cycle life and safety
    - Materials science, thick-electrode process control, and cell manufacturing yield
    - Public evidence on chemistry is descriptive but not independently benchmarked at full fleet scale
  - - Large-format cell formats (587Ah / 1175Ah / 1300Ah)
    - Reduce parallel count and raise system-level energy density
    - Precision manufacturing, thermal design, and transport-envelope discipline
    - Larger formats intensify IP scrutiny and require careful heat management
  - - ∞Pack+ standardization layer
    - Share components across duration variants and simplify maintenance
    - Common mechanical/electrical interfaces across cell families
    - If platform assumptions break, shared-component benefits can erode quickly
  - - Containerized liquid-cooled DC block
    - Integrate cells, cooling, BMS, enclosure, and PCS interfaces into project-ready product
    - Reliable coolant loops, venting paths, enclosures, and PCS compatibility
    - System outages can come from thermal or controls faults even when cell chemistry is stable
  - - Safety architecture
    - Manage gas release, fire containment, monitoring, and structural resistance during fault events
    - Directional venting, dual pressure relief, fire-resistant covers, steel structure, and multi-stage detection
    - Public tests are controlled events; field conditions, maintenance quality, and integration still matter
  - - Digital manufacturing and quality layer
    - Translate design intent into consistent product quality and lower cost
    - MES, 5G, AI, inline inspection, and closed-loop data control
    - The company has not publicly released audited defect-rate or warranty-claim statistics
  notes: The table emphasizes that Hithium’s technical offering is a coupled cell-plus-system-plus-manufacturing stack, not just a battery datasheet.
