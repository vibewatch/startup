- id: TI005
  title: Public financial gaps table
  notes: These are the highest-value diligence gaps still open after reviewing public official, filing, media, and market-data sources as of 2026-06-14.
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Realized ASP and discounting by product line
    - Public product launches do not translate into revenue quality without actual ASP and discount policy
    - Request 2024 and H1 2025 booked ASP by battery cell, BESS system, and service contract, segmented by geography
  - - Cash balance, burn, and runway
    - Capital adequacy cannot be judged from a redacted filing and revenue headlines alone
    - Request monthly cash bridge, unrestricted cash balance, debt maturities, and downside runway model
  - - Customer concentration and bad-debt exposure
    - Large overseas projects can create cliff risk and long collection cycles
    - Request top-10 customer revenue concentration, AR aging by customer, reserve methodology, and post-Powin exposure update
  - - Capex budget by site and by year
    - Changzhou, Texas, and possible Spain expansion change free-cash-flow needs dramatically
    - Request approved capex budget, actual spend-to-date, and expected commissioning dates by plant
  - - Geographic margin disclosure
    - The bull case depends on international/system mix carrying higher margins than domestic battery sales
    - Request audited gross margin by mainland China, Americas, Europe/Middle East, and system-vs-cell product family
  - - Litigation and contingent liability exposure
    - Patent and contract disputes can consume cash or block commercialization
    - Request counsel memo on CATL dispute, insurance coverage, and contingent-liability accounting treatment
