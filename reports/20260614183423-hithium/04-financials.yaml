- id: TI004
  title: Capital adequacy table
  notes: This table focuses on forward capital adequacy and manufacturing intensity, not the round-by-round funding chronology already owned by Company Overview. Filing amounts remain redacted, so public evidence supports direction but not exact post-IPO liquidity.
  columns:
  - Capital item
  - Public value / status
  - Implication
  - Evidence quality
  - Diligence ask
  rows:
  - - Cash on hand
    - null
    - Without current cash, investors cannot test self-funding capacity for Changzhou, Texas, and Europe
    - Unavailable publicly
    - Request latest unrestricted cash, restricted cash, and minimum liquidity covenant headroom
  - - Monthly burn
    - null
    - Burn determines whether IPO timing is optional or financing-critical
    - Unavailable publicly
    - Request trailing 12-month monthly EBITDA-to-cash bridge including capex and working capital
  - - Runway months
    - null
    - Runway is the synthesis metric for capital adequacy under slower IPO or tariff scenarios
    - Unavailable publicly
    - Request base / downside runway model and board-approved financing plan
  - - Planned IPO use of funds
    - Changzhou Phase I and II, R&D center, sales and delivery network, M&A, and working capital
    - Supports strategic manufacturing localization but confirms capex intensity
    - Filing-backed, but quantum redacted
    - Provide gross proceeds, net proceeds, and waterfall by project and year
  - - Next financing trigger
    - Resubmitted HK IPO and/or additional bank borrowings if expansion outpaces internally generated cash
    - Capital markets access and bank appetite remain important to pacing
    - Inferred from filing and IPO reporting
    - Provide debt headroom, borrowing costs, and capex pacing assumptions under no-IPO scenario
  - - Debt / project-finance obligations
    - Filing says shortfalls may be met with bank borrowings; adverse report cites RMB 10.12B liabilities and 73.1% debt-to-asset ratio
    - Leverage could rise before overseas plants reach full utilization
    - Mixed quality; needs verification
    - Provide debt maturity ladder, security package, and project-level financing terms
  - - Localization capex outside China
    - Texas plant reported at 10GWh but with conflicting US$100M vs nearly US$200M public capex figures; Spain plant under study at ~€400M
    - Localization is strategically valuable but increases capital call size and disclosure complexity
    - Conflicting across public sources
    - Provide board-approved capex budget by region and actual spend-to-date
