  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current unrestricted cash, monthly burn, debt maturities, and base/downside runway calculations.
    whyItMatters: Capital adequacy cannot be underwritten from a redacted filing and topline growth claims alone.
    diligencePath: Request the latest monthly cash bridge, debt schedule, and board financing plan used for IPO and non-IPO scenarios.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP, discount policy, and gross margin by product family, geography, and contract type.
    whyItMatters: Official product launches and feature claims do not prove revenue quality or sustainable margin.
    diligencePath: Obtain 2024 and H1 2025 revenue bridge by battery cell, system, service, and geography with booked ASP and gross margin.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI002
    - TI003
  - type: conflicting-data
    severity: material
    topic: texas-capex
    missingEvidence: Authoritative site-by-site capex budget and actual spend for the Texas plant.
    whyItMatters: Public sources disagree on whether the Texas facility cost about US$100 million or nearly US$200 million, which changes localization ROI and group capex intensity.
    diligencePath: Request the board-approved Texas budget, cumulative spend-to-date, and any local incentives or partner financing offsets.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, AR aging by customer, reserve policy, and Powin exposure update.
    whyItMatters: Large project customers can create both revenue cliffs and cash-collection volatility, especially in international markets.
    diligencePath: Request top-10 customer revenue, AR aging, bad-debt reserves, and post-bankruptcy collections analysis for at-risk counterparties.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: ipo-quantum
    missingEvidence: Unredacted gross proceeds, net proceeds, and year-by-year project allocation from the Hong Kong listing process.
    whyItMatters: The filing names strategic uses but not the actual funding quantum, preventing a clean test of post-listing liquidity and funding sufficiency.
    diligencePath: Obtain the latest unredacted draft or management schedule showing gross proceeds, fees, and cash allocation by project and year.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
