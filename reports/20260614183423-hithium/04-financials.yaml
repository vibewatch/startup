callouts:
- calloutType: strength
  title: International and systems mix are the clearest quality-upside signals
  body: The strongest public bull-case evidence is not raw shipment growth alone but the combination of system revenue reaching 36.2% of sales, overseas revenue reaching 28.6%, and repeated evidence that localization is supporting higher-value project conversion.
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI021
- calloutType: risk
  title: Capex and working-capital opacity are the core underwriting risks
  body: The filing itself warns that Changzhou expansion can pressure margins through depreciation and higher costs, while adverse reporting points to large receivables, leverage, and negative cash flow. Those issues may be manageable, but public evidence is not strong enough to underwrite them away.
  claimRefs:
  - CI029
  - CI030
  - CI040
  - CI041
- calloutType: recommendation
  title: Treat IPO progress as financing context, not as proof of capital adequacy
  body: The lapsed-then-resubmitting IPO narrative shows capital-markets access is still relevant. Investors should request cash, burn, and customer-collection evidence before using listing momentum as a substitute for balance-sheet proof.
  claimRefs:
  - CI036
  - CI043
  - CI044
