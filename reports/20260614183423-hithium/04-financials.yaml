- id: TI003
  title: Unit economics table
  notes: Rows combine directly disclosed metrics with explicit nulls. Null fields are intentional and each one carries a concrete diligence request, per the financials chapter quality bar.
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 company-wide revenue
    - RMB 12.9B
    - High
    - Anchors scale and supports revenue-per-capacity and revenue-per-headcount proxies
    - Tie to audited 2024 financial statements and reconcile to shipment data
  - - 2024 ESS systems revenue share
    - 36.2% of revenue; RMB 4.67B
    - High
    - Higher system mix is the cleanest public margin-quality signal
    - Break out gross margin for systems vs battery cells
  - - International revenue share / margin
    - 28.6% of 2024 revenue; public margin commentary suggests materially higher overseas margins
    - Medium
    - Tests whether globalization is improving economics or just adding complexity
    - Provide audited gross margin by geography and top-five overseas customers
  - - 2024 profitability crossover
    - RMB 288M net profit and RMB 318M adjusted profit
    - Medium
    - Shows a possible transition from scale-at-all-costs to positive earnings
    - Bridge statutory net profit, adjusted profit, and operating cash flow
  - - Cash conversion quality
    - Low-confidence adverse report says AR reached RMB 8.31B and 185.7 days
    - Low
    - Receivables can erase accounting profits in project-heavy businesses
    - Provide AR aging, reserve policy, and cash collections by customer cohort
  - - Cash on hand / monthly burn / runway
    - null
    - Low
    - Core capital-adequacy metrics remain missing from public disclosures
    - Provide month-end cash, unrestricted cash, debt maturities, and 12-month cash bridge
  - - Revenue per employee proxy
    - Estimated ~RMB 1.6M using RMB 12.9B revenue and ~8,000 staff
    - Low
    - Useful only as a rough scale proxy because staff mix and period timing are not aligned
    - Provide average 2024 and H1 2025 FTEs plus direct labor share by function
