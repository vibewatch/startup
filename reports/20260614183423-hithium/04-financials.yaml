tables:
- id: TI001
  title: Revenue streams table
  notes: List pricing is generally undisclosed; rows separate disclosed business lines from inferred monetization mechanics and show where public evidence stops short of realized ASP or margin disclosure.
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - ESS battery cells
    - Sell lithium-ion storage cells to integrators, developers, and in-house system programs
    - RMB revenue / GWh shipped
    - Core business; 2024 total company revenue RMB 12.9B and 2024 shipments 35.1GWh
    - Company-reported scale, but cell-only revenue not broken out
    - Request 2024-2025 cell revenue, shipped GWh, and realized ASP by chemistry/form factor
  - - Integrated ESS systems
    - Package cells with racks/containers/BMS and project-specific engineering
    - RMB revenue / system MWh
    - 2024 ESS system revenue RMB 4.67B, or 36.2% of total revenue
    - Publicly disclosed and higher-value than cell-only sales
    - Request system backlog, realized gross margin, and warranty reserve by product family
  - - Project delivery / localization support
    - Installation supervision, commissioning, delivery, and service tied to overseas projects
    - Service revenue / project
    - Global service network spans 20+ countries; Saudi 4GWh project commissioning targeted for 2026
    - Commercial relevance is clear, but revenue recognition mechanics are not public
    - Request split between hardware revenue, services revenue, and deferred maintenance obligations
  - - Long-duration / new-market programs
    - LDES and regional channel agreements extend future monetization into Australia, Vietnam, and Europe
    - Contracted MWh / framework agreement
    - 1GWh Vietnam framework signed in 2026; 8-hour LDES products launched in 2026
    - Good traction signal but insufficient for revenue forecasting without contract economics
    - Request booked backlog, cancellation terms, and conversion cadence from framework to revenue
