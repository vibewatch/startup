callouts:
- calloutType: insight
  title: Hithium is relevant to the fastest-growing ESS slice, not the whole battery market
  body: 'Public evidence places Hithium squarely in stationary ESS: large-format LFP cells, long-duration utility containers,
    AI-data-center positioning, and disclosed utility / developer projects. That matters more than generic battery-market
    narratives, because Hithium’s investability depends on bankability, safety, and project-finance fit inside ESS procurement
    chains.'
  claimRefs:
  - CM036
  - CM038
  - CM040
  - CM041
  - CM044
  - CM049
- calloutType: risk
  title: Tariffs, queue delays, and safety scrutiny can offset pure cost-down narratives
  body: Even if battery technology improves, realized market adoption still depends on interconnection speed, domestic-content
    eligibility, tariff pass-through, authority-having-jurisdiction comfort, and lender acceptance. Those frictions can delay
    COD or compress margins even in a high-growth demand environment.
