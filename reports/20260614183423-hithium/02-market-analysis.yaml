    - Integrator procures from supplier on behalf of owner
    - Owner or offtaker
    - Project owner backed by lender / tax equity / utility contract
    - Technology selection -> EPC + LTSA + warranty stack -> acceptance testing -> O&M
    - Bankability, execution risk reduction
