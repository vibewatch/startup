- id: sizing-lenses
  title: TAM, SAM, and constrained sizing lenses
  body: 'No public source gives a clean Hithium-specific TAM/SAM/SOM stack, so the market has to be triangulated from multiple
    lenses. In the United States, utility-scale battery storage exceeded 26 GW by end-2024 after 10.4 GW of additions, and
    operators planned another 19.6 GW for 2025. EIA also shows that battery storage already represented 23% of planned 2024
    new U.S. generating capacity and that standalone storage benefited materially from the IRA’s storage tax credit treatment.
    At the global level, BloombergNEF’s last widely free public storage outlook projected 358 GW / 1,028 GWh of cumulative
    stationary storage by 2030 and said customer-sited batteries could still reach about one quarter of installations. That
    lens is useful but stale: China alone reached 31.4 GW of battery storage in 2023, the U.S. ended 2024 above 26 GW, and
    LFP price / policy dynamics have changed materially since 2021. The most practical Hithium SAM lens is the subset of utility-scale
    and C&I projects where long-duration LFP, bankability, and safety certifications matter. Publicly disclosed Hithium contracts—3
    GWh with BOS Power, 720 MWh in the U.K., and a 21 MW / 55 MWh German project—show relevance, but they are still only a
    lower-bound public wedge rather than a full SOM.'
