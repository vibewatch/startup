- id: buyer-deployment
  title: Buyer, user, payer, and deployment path
  body: 'The buyer map is structurally split across ownership models. In merchant and utility-scale projects, the physical
    battery buyer is often the developer or IPP, while the payer is a utility, CCA, corporate offtaker, or another long-term
    contract counterparty. EPA’s PPA guidance makes the role split explicit: third-party developers install, own, operate,
    and maintain the project, monetize tax credits, and bill the end customer, while utilities still control interconnection
    approval and can require interconnection studies that affect timing. For public-power and regulated utility buyers, the
    APPA storage guidebook shows that project readiness usually runs through feasibility work, financing choice, stakeholder
    alignment, technology selection, safety and regulatory review, EPC partnership, and ongoing operations planning. In C&I
    and data-center settings, the user may be the site operator but the payer can still be a third-party owner, a parent balance
    sheet, or a contracted energy-services structure. Belfer’s data-center analysis shows large-load customers increasingly
    using private power contracts, availability payments, and co-located generation because grid timelines are lagging their
    build timelines. That makes Hithium’s sales motion less like simple equipment resale and more like participation in a
    developer-, financier-, and regulator-mediated deployment chain.'
