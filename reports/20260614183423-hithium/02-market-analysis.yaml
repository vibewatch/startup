- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Who buys the battery asset?
  - Primary user
  - Primary payer / budget owner
  - Workflow / budget path
  - Adoption trigger
  rows:
  - - Regulated utility / IOU
    - Developer or utility, depending on self-build vs contract
    - Grid operator / utility system
    - Ratepayer-backed utility budget approved by regulator or board
    - RFP or solicitation -> contract or self-build -> interconnection -> EPC / O&M -> commission
    - Capacity adequacy, peak coverage, renewable integration
  - - Public power / municipal / cooperative
    - Utility or developer partner
    - Public utility system
    - Board-approved utility capex or long-term contract
    - Feasibility study -> stakeholder alignment -> financing -> safety/regulatory review -> deployment
    - Cost savings, resiliency, local reliability
  - - IPP / merchant developer
    - IPP / developer
    - Developer-operated market asset
    - Developer equity, debt, tax equity, tolling or merchant revenues
    - Site control -> queue -> offtake / toll -> financing -> EPC -> COD
    - Arbitrage, ancillary services, contracted capacity
  - - Corporate data center / hyperscaler
    - Developer partner or corporate owner
    - Data-center operations team
    - Corporate capex, private power contract, availability payment, or PPA
    - Load study -> utility / private power negotiation -> interconnection or co-location -> commissioning
    - Speed to power, uptime, carbon goals
  - - C&I site / microgrid
    - Third-party developer or site owner
    - Facilities / operations
    - CFO, energy manager, resiliency program, or third-party services contract
    - Tariff analysis -> system sizing -> contract / financing -> utility approval -> install
