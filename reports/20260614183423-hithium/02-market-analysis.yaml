- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Hithium
  - Diligence ask
  rows:
  - - Renewable curtailment and duck-curve depth
    - Driver
    - Now
    - Creates direct need for utility-scale shifting and grid services
    - Which regions beyond CAISO show similar curtailment economics?
  - - Standalone storage ITC and DOE financing tools
    - Driver
    - Now to medium term
    - Improves developer willingness to contract storage and bank projects
    - How much of Hithium’s pipeline depends on U.S. tax-equity structures?
  - - AI / data-center load growth
    - Driver
    - Now to 2030
    - Supports long-duration, behind-the-meter, and co-located storage demand
    - Which Hithium deployments are real production deals vs product marketing?
  - - China domestic scale and export capacity
    - Driver and risk
    - Now
    - Home-market scale supports manufacturing learning curves but can intensify export pricing pressure
    - What share of Hithium output is already committed domestically vs export?
  - - Interconnection queue delays
    - Constraint
    - Now
    - Pushes projects out, raises financing carry, and makes fast deployment claims less monetizable
    - How exposed are Hithium customers to four-plus year queue timelines?
  - - Tariffs and domestic-content rules
    - Constraint
    - 2026 onward in U.S.
    - Raises effective cost of Chinese batteries and shifts sourcing choices
    - Can Hithium localize enough content or assembly to preserve U.S. competitiveness?
  - - Safety / fire testing scrutiny
    - Constraint and qualifier
    - Now
    - Bankability depends on certification, UL 9540A evidence, and authority-having-jurisdiction comfort
    - How often do Hithium tests translate into lender / insurer acceptance?
  - - Battery cost volatility and price wars
    - Constraint
    - Now
    - Falling and then volatile prices can compress supplier margins and customer timing
    - Are Hithium contracts fixed-price, indexed, or margin-protected?
  - - Private information on pricing, warranties, and customer concentration
    - Constraint
    - Persistent
    - Prevents precise SOM and durable-margin sizing from public sources
    - Request backlog, ASP, warranty reserve, and top-customer exposure data
  notes: Drivers and constraints are mixed because storage adoption depends on project timing, grid rules, and financeability,
    not just on a broad “energy transition” narrative.
