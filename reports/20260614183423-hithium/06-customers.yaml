- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / dependency risk
  - Impact
  - Diligence path
  rows:
  - - Saudi localization plus SEC award
    - Large MENA growth may depend on a small set of state-linked partners and one flagship utility customer
    - High upside if converted; high downside if localization capex outruns booked demand
    - Request Saudi backlog, payment milestones, and post-2026 pipeline by counterparty
  - - Utility-scale LDES roadmap
    - Framework announcements can be mistaken for firm revenue
    - Can inflate perceived demand durability
    - Separate contracted MWh, delivered MWh, and non-binding pipeline by quarter
  - - Integrator / EPC route to market
    - Counterparty execution, credit, and policy exposure sit partly with partners such as Alfanar, KNESS, Solarpro, DSS, and Powin
    - Hithium can win projects but still suffer delays, defaults, or policy friction
    - Request partner concentration, credit terms, and receivables aging by channel
  - - U.S. channel footprint
    - A few U.S. counterparties appear to matter disproportionately
    - Powin-style stress can quickly change the revenue mix
    - Request top-10 customer list, U.S. backlog replacement plan, and tariff/local-content mitigation
  - - C&I proof set
    - Official references prove commissioning but often hide the buyer name
    - Weakens bankability of the reference set for new lenders or cautious buyers
    - Request permissioned reference calls and signed customer testimonials
  - - Service-led trust proposition
    - Service infrastructure helps win customers but also adds fixed-cost obligations across regions
    - Could pressure margin if utilization lags shipments
    - Request service cost absorption and installed-base utilization by region
  notes: Risk rows focus on customer and partner concentration rather than manufacturing or legal risk, which are handled in other chapters.
