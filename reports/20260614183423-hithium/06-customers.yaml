  - Gap
  rows:
  - - Utility-scale grid and developer market
    - Utility, grid operator, IPP, developer, EPC / integrator
    - Load shifting, ancillary services, renewable integration, long-duration storage
    - 55MWh Razlog; >200MWh Colorado; 100MW/200MWh class China projects; 4GWh Saudi contract
    - Highest strategic value; strongest named-proof set and largest contract sizes
    - Many official references still omit contract value, offtaker economics, and renewal behavior
  - - Commercial & industrial
    - Property owner, industrial facility, PV site owner, local operator
    - Peak-valley arbitrage, PV self-consumption, electricity-cost reduction
    - 10.962MWh Czech project; 9.39MWh Romania project; 261kWh machine format
    - Useful diversification beyond utility-scale and shows economics-led buyer behavior
    - Named end customers are often not disclosed publicly
  - - Residential channel
    - Installer / distributor / local channel partner; end household mostly unseen publicly
    - Residential backup and distributed storage
    - Vietnam three-year 1GWh framework is the clearest retained residential signal
    - Strategic but still proof-light in retained public evidence
    - No named residential customer cohorts or installer retention data
  - - Integrator / EPC / platform partner
    - Powin, Whetstone, Alfanar, KNESS, Solarpro, DSS Solar, Brawn Capital
    - Project origination, system integration, local delivery, bankability bridge
    - Frameworks from 1GWh to 5GWh plus named Colorado and Saudi execution
    - Critical route to market outside China
    - Execution and counterparty-credit risk sit partly outside Hithium’s direct control
  - - Local-content / government-linked route
    - MANAT, Saudi Electricity Company, regional policymakers
    - Localization, climate adaptation, procurement qualification
    - 5GWh Saudi factory plan plus 4GWh SEC award
    - High strategic value where local content screens matter
    - Public evidence does not yet prove recurring revenue after localization capex
  notes: Rows separate direct end-market demand from channel-mediated demand. Strategic value reflects public proof quality and apparent contract scale, not disclosed gross margin.
