- id: TU006
  title: Buyer criteria and procurement friction table
  columns:
  - Buyer criterion
  - Public evidence of fit
  - Most relevant segment
  - Implication
  - Gap
  rows:
  - - Bankability
    - Munich Re warranty reinsurance, third-party due diligence language, project-owner protection even in insolvency
    - Utility / project finance
    - Helps lenders and owners underwrite long-duration assets
    - No public insured-project count or claims history
  - - Price / savings case
    - Czech and Romania cases are framed around arbitrage and cost reduction; market commentary says buyers are moving beyond low price alone
    - C&I and utility
    - Price matters, but value is being sold via lifecycle economics and savings use case
    - No realized ASP or payback data
  - - Safety / reliability
    - Long-duration launches emphasize multi-layer protection, climate resilience, and 25-year life; Saudi project specifies harsh-climate engineering
    - Utility / MENA / LDES
    - Safety is a primary qualification criterion in extreme-climate procurements
    - No public field-failure or incident-rate disclosure
  - - Warranty / serviceability
    - Regional warehouses, fast response targets, repair / replacement, post-warranty support, recycling
    - All installed-base buyers and partners
    - Reduces operational friction and supports repeat consideration
    - No public SLA performance data
  - - Local content / localization
    - Saudi MANAT JV and “local for local” messaging tied to utility wins
    - MENA and regulated procurements
    - Localization appears to be a sales enabler, not just branding
    - No disclosure of local-content percentage or economics
  - - Financing support
    - KNESS bank financing and Munich Re bankability support are visible; direct Hithium vendor financing is not
    - Developer / utility / EPC
    - Hithium seems to benefit from partner financeability more than from offering financing itself
    - Need explicit policy on vendor financing, LC support, and payment terms
  notes: This table distinguishes direct product fit from the financing, warranty, and localization conditions that often determine whether a project gets approved.
