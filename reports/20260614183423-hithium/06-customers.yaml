- id: durability-concentration-and-adverse-signals
  title: Durability, concentration, and adverse signals
  body: |-
    The biggest weakness in Hithium’s public customer disclosure is not lack of logos; it is lack of durability data. There is no public NRR, GRR, churn, renewal-rate, active-customer-count, or cohort disclosure in retained sources. Service commitments are visible, and there are some repeat-pattern signals in the form of multiple regional frameworks and follow-on European collaborations, but those do not substitute for renewal math. Even the strongest official references typically stop at commissioning, delivery, or framework size. That is useful proof of adoption, but not proof of retention.

    Concentration risk is more visible. Adverse reporting says international revenue reached 28.6% of 2024 sales and that two American customers contributed nearly 24% of total revenue, meaning a relatively small group of overseas counterparties can move the consolidated mix. Powin is the clearest stress test. A 5GWh three-year supply agreement had previously been presented as a trust-based global integrator relationship and a strong proof point for Hithium’s 300Ah cells. After Powin filed for bankruptcy in June 2025, adverse sources said the collapse jeopardized the agreement and at least RMB 1.5 billion of expected revenue, while also calling into question the resilience of Hithium’s U.S. expansion model. That does not erase Hithium’s real customer wins, but it does re-rank the diligence agenda: investors need customer concentration, receivables by counterparty, backlog conversion, warranty-claim history, and partner-credit exposure before treating the current win set as durable recurring demand.
