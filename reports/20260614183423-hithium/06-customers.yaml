  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Active customer count, active site count, and account count by segment and geography.
    whyItMatters: Without denominators, investors cannot tell whether named projects represent a broad installed base or a narrow set of reference wins.
    diligencePath: Request the latest customer-count bridge split by utility, C&I, residential, direct, and channel accounts.
    relatedQuestionRefs:
    - QU019
    - QU024
  - type: missing-source
    severity: material
    topic: retention-visibility
    missingEvidence: NRR, GRR, churn, renewal rate, and contract-expiry cohorts by region or channel.
    whyItMatters: Commissioning proof does not prove durability of revenue or customer satisfaction.
    diligencePath: Request customer-cohort tables and renewal schedules for top markets and top channels.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: top-customer-concentration
    missingEvidence: Top-10 customer revenue share, receivables by counterparty, and backlog aging.
    whyItMatters: Public evidence already suggests concentration; the unanswered question is whether it is manageable.
    diligencePath: Request top-customer concentration and receivables aging schedules from management and compare them with Powin-era exposure.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: financing-support
    missingEvidence: Explicit vendor-financing, letter-of-credit, milestone-payment, or balance-sheet support policy for customers.
    whyItMatters: Bankability support is visible, but direct financing support remains ambiguous.
    diligencePath: Ask management whether Hithium offers vendor financing, payment deferrals, LC support, or insurer-backed structures beyond warranties.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: warranty-claims-history
    missingEvidence: Warranty claim frequency, field-failure data, insured project count, and exclusions under the Munich Re structure.
    whyItMatters: Warranty rhetoric is useful, but buyers and lenders need operating evidence to price lifecycle risk.
    diligencePath: Request anonymized warranty-claim history, field incident logs, and insured-project volume by geography.
    relatedQuestionRefs:
    - QU016
    - QU017
    relatedTableRefs:
    - TU004
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Permissioned end-customer names or testimonials for official C&I and China case pages that currently identify only location and capacity.
    whyItMatters: Reference quality is weaker when customer identity is obscured.
    diligencePath: Request a permissioned customer-reference list with named buyer, deployment date, MWh, and commercial use case.
    relatedQuestionRefs:
    - QU007
    - QU008
    relatedTableRefs:
    - TU003
