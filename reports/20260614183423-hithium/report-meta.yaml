  headquarters: Xiamen, Fujian, China
  productSummary: LFP storage battery cells, modules, packs, liquid-cooled BESS cabinets/containers, and related integrated stationary storage solutions.
  customerFocus: Utility-scale developers and IPPs, C&I storage buyers, integrators/EPCs, and international channel partners seeking LFP storage supply.
  businessModel: Manufactures and sells ESS battery cells and storage systems, with growth increasingly tied to overseas utility and localization programs.
