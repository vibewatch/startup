summary:
  headline: Hithium has become a scaled global ESS battery contender with credible shipment and revenue momentum, but current public evidence supports a track stance rather than a buy because valuation clarity, litigation exposure, receivables quality, and IPO-readiness disclosure remain too thin.
  overallScore: 6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
