  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'The top risk is transmission: legal, pricing, and localization problems can compound into financing stress'
        blocks:
          - type: paragraph
            body: >-
              Hithium now looks like a company with real commercial scale but a narrow margin for execution error. The
              evidence does not suggest an existential technology failure: the company has real shipments, a large-scale
              UL-witnessed fire-test campaign, and live localization projects in the United States, Spain, and Saudi
              Arabia. The underwriting problem is that these strengths arrive together with several coupled risks that
              can reinforce one another. A lapsed Hong Kong listing does not automatically kill the IPO, but it makes
              legal disclosures, customer health, and working-capital quality more important because the company is
              still funding a long capex program and multiple international build-outs. Chinese regulators have
              separately signaled that below-cost selling, repeated construction, and quality slippage are no longer
              tolerable sector behavior, which matters because Hithium competes in exactly the part of the market where
              price pressure is most intense. Powin's bankruptcy then shows how counterparty stress can turn channel
              exposure into immediate revenue and collection risk. The result is a risk stack in which litigation, price
              war, tariff exposure, and partner fragility all flow into the same final question: can Hithium keep
              financing global expansion without sacrificing quality, margins, or optionality?
