  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Hithium’s addressable market is the battery-storage slice of the power stack, not the whole electricity
              system. EIA’s 2026 storage update explicitly separates large-scale battery storage, small-scale battery
              storage, ownership types, co-located systems, applications, and installation costs, while BloombergNEF’s
              public outlook defines stationary storage to include ancillary services, energy shifting, transmission and
              distribution deferral, and customer-sited batteries but explicitly excludes pumped hydro. For this
              chapter, the included spend is utility-scale and C&I LFP cells, modules, racks, containers, BMS/EMS,
              thermal management, integration, EPC scope, interconnection-related work, long-term service, and the
              financing structures that make battery projects bankable. The excluded spend is pumped hydro, standalone
              solar or wind generation capex, generic transmission upgrades without a storage component, and data-center
              IT hardware. The practical substitute set is therefore not “all power” but gas peakers, diesel backup,
              transmission upgrades, renewable curtailment, and non-Hithium battery suppliers. That boundary matters
              because Hithium’s public materials, rankings, and contracts all point to ESS-focused utility and C&I use
              cases rather than EV batteries or general power equipment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM035
