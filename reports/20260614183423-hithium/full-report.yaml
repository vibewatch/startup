  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - CATL litigation worsens
        - Product injunction, settlement implying major redesign, or damages far beyond current claim scope.
        - Would challenge product continuity and compress valuation multiple.
        - Move from track to avoid unless price resets sharply.
      - - Down-round financing
        - Any new round below the rumored current valuation without offsetting structural protection.
        - Confirms the public story was over-marked or liquidity is weaker than expected.
        - Treat as a thesis-break on price discipline.
      - - Collections deteriorate
        - AR days rise further from already elevated levels or major overseas receivable impairment emerges.
        - Turns growth into a financing problem and raises hidden credit risk.
        - Require revised revenue quality and cash-conversion analysis.
      - - Overseas margin advantage fades
        - International gross margin converges toward low domestic levels without compensating volume.
        - Breaks the idea that localization/global mix can rescue economics.
        - Reset valuation toward bear-case multiples.
      - - Localization capex overruns
        - Texas/Spain or other overseas capex expands without clear utilization or payback support.
        - Increases dilution and extends IPO/liquidity timing.
        - Demand project-level return math before investing.
      - - IPO delay extends again
        - No credible refile path or sponsor-ready draft after management signaling.
        - Reduces near-term exit visibility and weakens late-stage premium.
        - Keep recommendation at track or move to avoid.
    notes: These triggers are external-monitoring thresholds tied to the valuation thesis, not internal company targets.
