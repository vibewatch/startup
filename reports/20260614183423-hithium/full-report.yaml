  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Critical external dependencies in Hithium's current localization and channel model.
    data:
      nodes:
        - id: D1
          label: China-origin cells
          detail: Still the critical upstream input for many overseas systems.
          tone: risk
        - id: D2
          label: Texas assembly plant
          detail: Improves domestic posture but not full cell independence.
          tone: positive
        - id: D3
          label: U.S. tariff / FEOC regime
          detail: Changes the economics and eligibility of China-linked supply chains.
          tone: risk
        - id: D4
          label: Powin / integrator channels
          detail: Translate cell supply into project flow and receivables.
          tone: risk
        - id: D5
          label: Navarre / Spain authorities
          detail: Control permits, subsidy execution, and industrial landing.
          tone: risk
        - id: D6
          label: MANAT / Saudi JV
          detail: Provides local partner credibility and regional manufacturing optionality.
          tone: risk
        - id: D7
          label: HKEX / financing window
          detail: Still matters because capex remains front-loaded.
          tone: risk
        - id: D8
          label: Utility and developer customers
          detail: Convert localized capacity into bankable demand.
          tone: risk
      edges:
