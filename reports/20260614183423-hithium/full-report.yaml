      - Owner / diligence path
    rows:
      - - Cap table and preferences
        - Current post-money, liquidation preference stack, anti-dilution, warrants, and any side letters.
        - Without structure, valuation stance can only be directional.
        - Company CFO / legal; redacted cap table and financing docs.
      - - 2025 audited financials
        - Full-year revenue, gross margin by geography, EBITDA, cash flow, and subsidy reliance.
        - Needed to verify whether H1 2025 momentum is durable and cash-real.
        - Company finance team; audited statements and audit memo.
      - - Receivables quality
        - AR aging by top 20 customers, write-off history, factoring, and insurance coverage.
        - Growth with weak collections deserves a lower multiple.
        - Finance + controller; aging schedules and collection policy.
      - - Powin and top-customer exposure
        - Contracted backlog, shipped backlog, creditor status, and replacement plan for exposed U.S. volume.
        - Tests whether customer concentration risk is contained or still active.
        - Commercial team; customer-level backlog bridge.
      - - CATL litigation
        - Claim summary, product overlap analysis, counsel view on remedy risk, and any redesign contingency.
        - Legal overhang directly affects bankability and IPO timing.
        - General counsel; case memo and external counsel letter.
      - - Localization economics
        - Texas, Spain, and any Saudi/other overseas capex, utilization targets, and unit-economics assumptions.
        - Capital intensity can erase headline growth if returns are weak.
        - Operations + strategy; project models and utilization ramp.
      - - IPO relaunch materials
        - Latest sponsor draft, targeted proceeds, valuation range, cornerstone appetite, and blocker list.
        - Needed to underwrite exit readiness instead of assuming it.
        - IPO working group / sponsors; latest draft and issue list.
      - - Warranty and field performance
        - Claim rates, replacement reserves, insurance terms, and bankability updates by region.
        - Storage buyers care about lifetime reliability, not shipment rank alone.
        - Product + service teams; warranty deck and insurer feedback.
    notes: >-
      Each ask is specific to an investment-committee decision and is intentionally framed as evidence needed to change
      the recommendation, not generic management Q&A.
