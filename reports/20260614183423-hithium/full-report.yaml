      - number: '3.2'
        title: Capability breadth is real, but bankability still trails the biggest incumbents
        blocks:
          - type: paragraph
            body: >-
              On pure product breadth, Hithium looks credible. Its public cell roadmap spans 2-hour, 4-hour, and
              long-duration formats, while its system pages show containerized products reaching from roughly 4MWh to
              nearly 7MWh with UL and NFPA compliance references. The company has paired that roadmap with two signals
              developers care about: localization and safety. Texas gives Hithium a 10GWh module-and-system foothold in
              the United States, and the MANAT venture would extend the same local-for-local logic into Saudi Arabia.
              Its open-door fire-test campaign also gives the company a sharper safety narrative than many younger
              rivals. The problem is not that Hithium lacks product substance; it is that the benchmark keeps moving.
              CATL now combines 772GWh of installed capacity, 321GWh under construction, a 100 MVA storage validation
              center, and disclosed ESS revenue. BYD has already shipped well over 135GWh of storage globally. Sungrow
              has independent burn-test publicity at utility scale. Fluence layers public parent backing and software
              into its offering. In that context, Hithium’s bankability gap is less about missing a feature and more
              about having thinner audited disclosure and a smaller installed-base proof stack than the best-resourced
              rivals.
