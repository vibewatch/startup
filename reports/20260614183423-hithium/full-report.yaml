      - number: '4.3'
        title: Manufacturing Expansion and Capex Intensity
        blocks:
          - type: paragraph
            body: >-
              The company’s financial profile is dominated by manufacturing intensity. The 2026 HKEX application proof
              shows IPO proceeds earmarked for Changzhou Phase I upgrades, Changzhou Phase II greenfield construction, a
              new R&D center, sales-and-delivery expansion, complementary acquisitions, and working capital. The filing
              lays out a long capex tail rather than a short bridge: Changzhou Phase I equipment upgrades run through
              2027 with optimization into 2031, while Changzhou Phase II targets plant completion in 2029 and full
              production by 2031. That same filing explicitly warns that the expansion will increase fixed assets,
              depreciation, amortization, and operating costs, which is exactly the kind of self-described margin
              compression risk investors should pay attention to in a price-competitive battery market. Outside China,
              Hithium is also localizing capacity in Texas and exploring Europe. Public sources agree on the 10GWh scale
              of the Texas plant but disagree on cost: SCMP described roughly US$100 million, while Texas-local coverage
              described nearly US$200 million. Spain adds a further possible €400 million commitment. This pattern
              points to a company with real growth options, but also one whose manufacturing roadmap can absorb large
              amounts of capital before all benefits are visible in margins or cash flow.
