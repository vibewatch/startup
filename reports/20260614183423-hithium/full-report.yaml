      - number: '5.2'
        title: Architecture, workflow, and safety design
        blocks:
          - type: paragraph
            body: >-
              Hithium’s product logic is straightforward in customer-workflow terms. The buyer chooses duration, project
              geography, and balance-of-plant constraints; Hithium then maps those needs to a cell family, a pack or
              rack configuration, and a containerized system compatible with centralized or string PCS. The
              architectural story the company wants buyers to believe is that larger-format cells reduce parallel count,
              wiring complexity, and non-cell component cost while allowing maintainable, standardized system builds.
              Official product and launch materials provide enough detail to support that framing. The 587Ah cell
              anchors 2-hour systems, the 1175Ah cell anchors 4-hour and long-duration systems, and the 6.25MWh platform
              is presented as a common system shell with shared components and flexible PCS integration.


              The most important technical proof point is safety. Hithium has made open-door fire testing central to its
              trust narrative, and unlike many battery vendors it discloses a meaningful amount about test setup and
              internal protective architecture. The 6.25MWh test was run with doors fully open, only 15 cm spacing, 100%
              state of charge, and disabled active suppression, while the company describes three-dimensional venting,
              dual pressure relief valves, fire-resistant module covers, steel enclosures, insulated multi-layer
              partitions, and a dual-protection BMS covering both functional safety and cybersecurity. That does not
              prove lifetime field performance, but it does show a deliberate attempt to answer the propagation and
              insurability questions that often block utility procurement.
