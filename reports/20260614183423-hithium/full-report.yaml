  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - IPO / financing fragility
        - Resubmitted HKEX filing or equivalent long-term financing
        - >-
          No clean resubmission progress or alternative committed capital before major Changzhou / overseas spend ramps
          further
        - Would show capital needs are outrunning disclosure readiness and lender appetite.
        - Treat as thesis-break unless valuation resets and financing contingencies are fully underwritten.
      - - CATL litigation risk
        - Court outcome or interim injunction signal
        - Adverse ruling, injunction threat, or expanded claim scope around the 587Ah line
        - Could impair a flagship product, increase disclosure burden, and slow IPO review simultaneously.
        - Pause the investment or re-underwrite with explicit product redesign and delay assumptions.
      - - Price-war / overcapacity risk
        - Project pricing and regulator follow-through
        - >-
          Evidence that Hithium continues winning major projects at cost-floor prices while regulators intensify
          enforcement
        - Suggests share capture is being purchased with economics or compliance quality rather than moat.
        - Reduce conviction sharply and require verified project-level margin and reserve data.
      - - Safety / quality risk
        - Field incident, recall, or certification setback
        - >-
          Any confirmed propagation event, major warranty wave, certification withdrawal, or insurer refusal at utility
          scale
        - Would invalidate the idea that certification proof has already translated into fleet bankability.
        - Immediate thesis-break until root cause and reserve impact are fully disclosed.
      - - Counterparty concentration risk
        - Major integrator or top-customer health
        - Another major overseas integrator bankruptcy, or proof that a few U.S. accounts still dominate overseas margin
        - Would show channel resilience improved less than shipment headlines imply.
        - Value the company on stressed concentration assumptions and tighten working-capital downside cases.
      - - Localization execution risk
        - Milestone delivery in Texas, Navarre, and Saudi
        - >-
          Texas remains assembly-only without credible cell diversification, Navarre slips materially, or Saudi stays
          announcement-only through 2027
        - Would mean globalization is adding capex and complexity faster than it removes policy and supply-chain risk.
        - Move the case to research-more / avoid unless the company can show alternative sourcing and schedule recovery.
    notes: >-
      The triggers are intentionally monitorable and thesis-breaking so the chapter can feed directly into a go / wait /
      walk decision rather than ending in generic caution language.
