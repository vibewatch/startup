      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Why this is track instead of buy
            body: >-
              Hithium's growth profile is strong enough to stay on the shortlist, but the base case does not show enough
              upside over a rumored >$3.5B mark to compensate for private illiquidity, legal overhang, and
              working-capital opacity. Price discipline, not company quality, is the gating variable.
            calloutType: recommendation
