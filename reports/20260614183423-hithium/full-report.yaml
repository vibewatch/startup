      - number: '3.3'
        title: Switching costs live above the cell layer in channels, software, and localization
        blocks:
          - type: paragraph
            body: >-
              The most important competitive insight in the retained source set is that storage switching costs do not
              come from amp-hours alone. Buyers can multi-home across qualified cells more easily than they can replace
              a proven system integrator, project wrapper, software stack, or local O&M partner. Hithium is improving
              here: it is localizing systems in Texas, building a Saudi route to market, and selling its own containers
              instead of remaining only a hidden upstream supplier. But the same evidence still shows hybrid dependence.
              Energy-Storage.news describes Hithium cells flowing through NHOA, Risen, and the Powin-to-FlexGen lineage
              as well as Hithium-branded projects. By contrast, CATL’s Zinfra and Sieyuan examples show stronger
              downstream control through local delivery and long-term contracting. Fluence goes even further by bundling
              Gridstack hardware with Mosaic and Nispera software, while BYD’s broad project base creates
              referenceability in markets that Hithium is only now entering. EVE and REPT are also moving outward
              through India and Indonesia. The practical implication is that Hithium can win on fit-for-purpose product
              and localization momentum, but the stickiest lock-in still tends to belong to the vendors that own
              software, warranties, and local execution at scale.
