  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Mix Shift, and Public Traction
        blocks:
          - type: paragraph
            body: >-
              Hithium monetizes energy storage through a stack that starts with ESS battery cells, moves up into
              higher-value integrated systems, and then extends into project delivery and after-sales support. Public
              disclosures are now strong enough to say the company is financially material rather than purely
              developmental: Hithium said 2024 revenue rose 26% to about RMB 12.9 billion from RMB 10.2 billion in 2023,
              while system revenue more than doubled to RMB 4.67 billion and reached 36.2% of total sales. That mix
              shift matters because systems appear to carry better economics than battery-only shipments and make
              international localization more bankable. International sales also became meaningful, reaching 28.6% of
              2024 revenue from a negligible base in 2023, while official and third-party sources describe deployments
              or service coverage in more than 20 countries. Shipment traction is equally material: public sources cite
              35.1GWh of 2024 shipments, a 167% CAGR from 2022 to 2024, and cumulative shipments above 100GWh by August
              2025. The result is a revenue model that is not dependent on one-off pilot sales, but the public record
              still lacks realized ASPs by product line, contract duration, discounting, and maintenance attach rates.
