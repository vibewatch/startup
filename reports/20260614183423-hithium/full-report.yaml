  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and portfolio shape
        blocks:
          - type: paragraph
            body: >-
              Hithium should be underwritten as a stationary-storage hardware platform company, not as a generic lithium
              cell vendor. Its public materials consistently present a stack that runs from ESS cells and packs into
              liquid-cooled DC blocks, commercial-and-industrial cabinets, residential systems, and now sodium-ion and
              long-duration variants. The current official product surface is most explicit around three commercially
              important LFP cell families: the older 314Ah ESS cell, the 587Ah large-format cell for 2-hour systems, and
              the 1175Ah kAh-class cell for 4-hour and long-duration systems. The portfolio has moved upward with the
              ∞Pack+ standardization layer and the ∞Power 6.25MWh platform, which is designed to reuse major components
              across different duration configurations rather than redesign the whole system for each use case.


              That said, the portfolio is not perfectly clean in public disclosure. The user request to focus on 320Ah
              is revealing because retained official sources do not show a standalone 320Ah flagship page, while a
              channel listing markets an LF314 product as "320Ah" but then states nominal capacity of 314Ah. Investors
              should read that less as evidence of a hidden breakthrough and more as evidence that public portfolio
              communication is still looser than top-tier bankability-grade documentation. The stronger takeaway is that
              Hithium’s commercially differentiated center of gravity has already moved beyond the 314Ah class toward
              587Ah, 1175Ah, and the associated system architectures.
            claimRefs:
              - CE001
