  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The relevant peer set mixes Chinese ESS cell rivals with system-layer incumbents
        blocks:
          - type: paragraph
            body: >-
              Hithium is not competing in a flat list of interchangeable battery brands. The closest direct product
              peers are Chinese energy-storage cell vendors that market large-format LFP specifically for stationary
              use, especially EVE Energy and REPT Battero. CATL and BYD sit one ring outward: they absolutely compete
              for the same projects, but they do so with much broader industrial leverage because ESS is only one slice
              of much larger battery franchises. A second ring matters just as much in actual procurement. Sungrow,
              Fluence, and FlexGen compete at the system, controls, and O&M layer that often sits closest to the buyer,
              lender, and EPC. Hithium’s own evidence shows it sits between those layers. It now sells both cells and
              complete containers, but the retained public record still shows a hybrid route to market with in-house
              systems plus third-party integrators and local partners. That means Hithium’s most natural head-to-head
              comparison is with Chinese stationary-storage specialists on product shape, while its hardest
              account-displacement battles are often against better-capitalized system wrappers that can turn similar
              LFP chemistry into a bankable package.
