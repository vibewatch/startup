  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment map and buyer criteria
        blocks:
          - type: paragraph
            body: >-
              Hithium’s public customer story is not a generic “all markets” pitch; it is segmented around
              utility-scale, commercial-and-industrial (C&I), and residential use cases, with most proof skewing toward
              utility-scale and partner-led channels. The company’s solutions and product pages explicitly separate
              utility, C&I, and residential offerings, while its 2026 product and interview material says the portfolio
              now spans 1- to 8-hour applications across those use cases. In practice, however, public proof depth is
              unequal. Utility-scale evidence includes named projects, named counterparties, and large framework
              agreements in Saudi Arabia, Ukraine, Eastern Europe, and the United States. C&I proof exists, but it is
              more often location-based project evidence than named corporate-customer disclosure. Residential proof is
              weakest: the clearest retained evidence is a 1GWh Vietnam channel agreement rather than named household or
              installer cohorts.


              The buyer-criteria story is clearer than the retention story. Hithium’s own 2026 interview with
              Energy-Storage.news says customers are moving beyond low price and fast delivery toward localization,
              bankability, safety, reliability, and lifecycle credibility. Its support page reinforces that positioning
              with region-specific service staffing, warehouses, spare-parts commitments, commissioning support, and
              post-warranty services. The Munich Re warranty-reinsurance announcement adds a distinct bankability marker
              for project owners and lenders: Hithium can point to third-party due diligence and up-to-15-year warranty
              coverage, which matters much more for utility and project-financed buyers than for a pure price-led
              commodity sale. The result is a go-to-market mix where Hithium is not just trying to sell cells cheaply;
              it is trying to reduce buyer friction through service, warranty structure, and local-content signals.
