      - number: '1.3'
        title: Funding history, operating scale, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The best-supported financing event remains Hithium's July 2023 Series C, which multiple sources place at
              more than RMB 4.5 billion (roughly US$621–622 million). Verdict and Energy-Storage.news both name Beijing
              Financial Street Capital and China Life Private Equity as lead investors, with other state-affiliated and
              financial investors joining the round. The disclosed use of proceeds was straightforward growth capital:
              expand manufacturing, buy equipment, fund R&D, and enter additional markets. Public data vendors still
              list the company as private and at Series C stage, implying that the March 2025 HKEX filing was an
              attempted public step-up rather than evidence of already completed equity transition.


              Operationally, the fetched prospectus-era coverage points to a company that scaled fast in 2024: roughly
              RMB 12.9 billion of revenue, a 26% year-on-year increase; energy-storage-system revenue of RMB 4.67
              billion; 28.6% of sales from international markets; and 35.1 GWh of annual shipments for an 11% global
              share. The international mix matters because adverse coverage argues that overseas business has
              significantly better margins than China, helping explain the strategic emphasis on Saudi, Texas, and
              Europe. Yet scale quality is harder to judge than scale quantity. Headcount is inconsistent across
              sources, exact ownership stakes are not public, and current valuation remains weakly evidenced beyond a
              low-confidence press estimate above US$3.5 billion. This is enough to establish momentum, but not enough
              to remove diligence friction.
