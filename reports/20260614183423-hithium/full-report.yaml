        - System outages can come from thermal or controls faults even when cell chemistry is stable
      - - Safety architecture
        - Manage gas release, fire containment, monitoring, and structural resistance during fault events
        - Directional venting, dual pressure relief, fire-resistant covers, steel structure, and multi-stage detection
        - Public tests are controlled events; field conditions, maintenance quality, and integration still matter
      - - Digital manufacturing and quality layer
        - Translate design intent into consistent product quality and lower cost
        - MES, 5G, AI, inline inspection, and closed-loop data control
        - The company has not publicly released audited defect-rate or warranty-claim statistics
