companyProfile:
  summary: >-
    Hithium is a Xiamen-based stationary energy-storage company founded in 2019 that focuses on LFP battery cells,
    modules, packs, and integrated battery energy storage systems for utility-scale, commercial-and-industrial, and
    selected residential use cases. The company scaled rapidly through China manufacturing and aggressive overseas
    commercialization, raising a RMB 4.5B+ Series C in July 2023, reporting roughly RMB 12.9B of 2024 revenue in
    prospectus-era coverage, and preparing a renewed Hong Kong listing after its 2025 application lapsed. Hithium's core
    investment appeal is fast ESS scale and improving overseas mix; its core diligence friction is legal, disclosure,
    and working-capital opacity during expansion.
