      - number: '8.2'
        title: 'Recommendation, confidence, risk, and entry discipline: track, not buy'
        blocks:
          - type: paragraph
            body: >-
              Recommendation: track. Confidence: medium. Risk rating: high. Valuation stance: fair. That mix reflects a
              company that has enough operating proof to stay investable, but not enough price clarity to justify a buy
              recommendation today. If the independent press reporting is directionally right and Hithium is already
              worth more than $3.5 billion, the implied sales multiple on 2024 revenue is about 1.9x, and on a simple
              annualization of first-half 2025 revenue it is about 1.8x. Those levels are not obviously excessive
              against public storage-related comps such as Fluence, BYD, EVE Energy, and CATL. However, private-company
              illiquidity, legal risk, customer concentration, and cap-table opacity should force a discount to public
              comps, not parity.


              The core reason this is track rather than buy is asymmetry. At a rumored reference mark above $3.5
              billion, the public comp band and our scenario work suggest only modest upside in a base case, while the
              downside remains meaningful if litigation escalates, if overseas margin mix normalizes down, or if IPO
              timing slips again. Entry discipline therefore matters more than admiration for the operating story. A
              constructive entry only becomes interesting if investors can either (a) enter at a valuation materially
              below the rumored current mark, roughly in the low end of the base-case range, or (b) obtain strong
              preference protection, verified backlog quality, and direct visibility into working capital and litigation
              exposure. Without one of those two conditions, the company looks worth following but not forcing.
