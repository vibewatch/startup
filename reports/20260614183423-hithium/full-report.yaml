            title: The hidden valuation variable is receivables quality
            body: >-
              If Hithium's elevated accounts receivable and customer concentration reflect financing support to win
              overseas share, reported top-line momentum may deserve a lower multiple than shipment rank suggests. That
              risk will not be visible from marketing updates or shipment league tables alone.
            calloutType: risk
