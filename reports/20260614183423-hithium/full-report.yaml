            body: >-
              Hithium’s public surfaces are unusually clear on product positioning and unusually sparse on monetization
              mechanics. The company markets integrated, customized storage solutions rather than a published price
              list, so official product pages are evidence of offer shape but not evidence of realized revenue or gross
              margin. The best public economics clues come from mix. System revenue grew faster than total revenue in
              2024, H1 2025 revenue and gross profit continued rising sharply, and third-party analysis suggests
              international business carries materially better gross margins than the mainland business. Official
              product releases also support a margin-uplift story through design simplification: Hithium claims its
              1175Ah-based 6.25MWh platform reduces non-cell component costs by more than 30%, and its native 8-hour
              platform is built around 25-year project life. Those claims are directionally helpful, but underwriting
              still breaks on missing metrics: there is no public disclosure of realized battery ASP, realized system
              ASP, warranty reserve intensity, installation gross margin, cash collection cadence by geography, or
              monthly burn. The unit-economics picture is therefore better described as improving revenue quality rather
