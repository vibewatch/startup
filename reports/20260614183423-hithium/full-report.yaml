        - Common mechanical/electrical interfaces across cell families
        - If platform assumptions break, shared-component benefits can erode quickly
      - - Containerized liquid-cooled DC block
        - Integrate cells, cooling, BMS, enclosure, and PCS interfaces into project-ready product
