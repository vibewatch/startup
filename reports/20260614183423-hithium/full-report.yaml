      - number: '2.4'
        title: Growth drivers, constraints, and Hithium relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are externally visible. Rising renewable curtailment in California, the
              deepening duck curve, standalone storage tax incentives, and accelerating AI/data-center load all expand
              the need for fast-response, dispatchable battery capacity. EIA quantified 2.4 million MWh of curtailed
              California wind and solar in 2022, while California battery capacity grew from 0.2 GW in 2018 to 4.9 GW by
              April 2023 and was still scaling. Meanwhile, EPRI’s 2026 lens puts U.S. data centers at 9% to 17% of
              national electricity demand by 2030, with hyperscaler and utility decisions increasingly shaped by
              megawatt availability rather than only energy price. Hithium is relevant because its public footprint is
              concentrated in ESS, not EV batteries: it claims Top 2 H1 2025 utility-scale shipments, Grade A
              bankability, TÜV / EU battery readiness, and utility-scale references across Europe and the U.K. The
              constraints are equally material. LBL shows storage-heavy queues still face four-plus year median
              timelines and low completion rates. Tariffs on Chinese non-EV lithium batteries rise sharply in 2026,
              domestic-content rules complicate U.S. economics, and BNEF’s price history shows battery costs do not
              decline in a straight line. Safety and bankability remain gating issues, which is why Hithium spends so
              much public effort on fire testing, large-format-cell cost claims, and certification narratives.
