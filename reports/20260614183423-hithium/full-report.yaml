      - number: '6.2'
        title: Named deployment proof across utility-scale and C&I
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where Hithium can show either a commissioned asset or an identified developer /
              utility counterparty. On the utility side, the company has official case pages for the 55MWh Razlog
              project in Bulgaria, a more-than-200MWh Colorado project delivered with Whetstone Power, and large China
              reference projects in Shangdu and Tengger. On the C&I side, the evidence is more modest in size but still
              concrete: Hithium’s Czech public project and Romania project were both marked commissioned in April 2026,
              and both emphasize electricity-bill value creation rather than abstract technology leadership. The Czech
              project uses 42 integrated machines for 10.962MWh and is explicitly framed around peak-valley price
              arbitrage, while the Romania project uses 36 integrated machines for 9.39MWh and pairs storage with a
              customer PV system. Those are useful signs that Hithium is selling not only to giant grids, but also to
              property owners or operators pursuing on-site power economics.


              Still, proof quality is mixed. Some official case pages identify the partner or customer, as in Colorado
              with Whetstone Power. Others provide only location, capacity, and product details, leaving the buyer
              unnamed. That means public evidence proves operating relevance and deployment maturity better than it
              proves repeat purchasing behavior, customer satisfaction, or exact commercial terms. The chapter’s
              underwriting takeaway is therefore that Hithium has real deployment proof across both utility and C&I
              categories, but that its official references often function more like engineering showcases than fully
              bankable customer references with counterparty, contract-value, and renewal disclosure.
