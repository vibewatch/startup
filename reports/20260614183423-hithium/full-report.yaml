      - number: '8.4'
        title: 'Bull, base, and bear cases: the base case does not yet clear the upside hurdle'
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Hithium converts scale into a cleaner public-market story. In that path, the Hong
              Kong listing is successfully refiled, the CATL dispute is contained without a product injunction, overseas
              localization absorbs tariff pressure, and the company sustains stronger mix and pricing through
              international channels. Revenue keeps compounding off the strong first-half 2025 run rate, and investors
              underwrite a 2.5x-3.0x sales multiple more in line with high-growth storage leaders. That produces a
              valuation zone around $5.5-7.0 billion, or roughly 1.6x-2.0x gross MOIC versus a rumored $3.5 billion-plus
              current reference.


              The base case is less exciting and therefore more important. Here, Hithium does refile, but the market
              haircut for litigation, working capital, and thin domestic economics persists. Revenue still grows, but
              multiple support stays closer to 1.5x-2.2x sales. That yields roughly $3.0-4.5 billion, which is only flat
              to moderately positive versus the rumored current mark. This is why a buy call is difficult: a
              fair-quality company can still be a mediocre investment if the entry price already discounts much of the
              growth.


              The bear case assumes some combination of multiple compression, customer stress, and legal overhang. If
              the Powin exposure proves more painful than company messaging suggests, if CATL pushes toward a stronger
              remedy, or if China's price-war environment keeps gross margin under pressure, investors could re-rate
              Hithium closer to 0.8x-1.2x sales. That puts valuation around $1.5-2.5 billion and creates a sharp
              capital-loss scenario for late private entrants. The decision framework is therefore simple: do not pay a
              bull-case price for a business whose public evidence still supports only a base-case underwriting.
            claimRefs:
