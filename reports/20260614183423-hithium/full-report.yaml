      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but not yet clean. The most credible medium-term exit remains a public listing
              if Hithium can refile the Hong Kong IPO with cleaner litigation disclosure and stronger audited numbers.
              Strategic sale is a secondary path, but the likely buyers are also the companies with the strongest
              incentives to force valuation discipline, not overpay for it. That leaves the investor with a familiar
              late-stage industrial problem: liquidity is visible in concept, but timing and price are still highly
              path-dependent.


              Thesis-break triggers are therefore explicit. A material deterioration in litigation status, an observable
              reversal in overseas margin advantage, evidence that the Powin situation was not contained, or a
              down-round/private financing below the implied current mark would all break the argument that Hithium
              deserves public-comp-like revenue multiples. Likewise, an inability to show backlog quality, collection
              discipline, and tariff-mitigation economics would turn a scale story into a working-capital story.


              The final diligence package should be narrow and practical. Investors do not need more product marketing;
              they need the cap table, preference stack, audited 2025 accounts, accounts-receivable aging by top
              customer, detailed exposure to Powin and other overseas counterparties, CATL case memos and remedy
              analysis, and the latest sponsor-ready IPO draft. If management can provide those items and the price
              remains in the low end of the base-case band, the recommendation can move from track toward buy. If not,
              the chapter's current conclusion should stand.
