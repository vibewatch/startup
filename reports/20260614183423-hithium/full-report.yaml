              Public financing context is simultaneously helpful and incomplete. Helpful, because the last disclosed
              rounds were large: over RMB 2 billion in Series B and over RMB 4.5 billion in Series C, with state-linked
              and financial investors participating. Incomplete, because the public record still does not reveal today's
              post-money, liquidation stack, anti-dilution terms, warrant coverage, or any 2025-2026 private reset that
              would tell a new investor where the effective entry price really sits. The Hong Kong IPO filing and lapse
              show an aspiration to convert private scale into public liquidity, but the absence of a live offer range
              means the market still has not spoken. Investors therefore need to underwrite dilution and preference
              overhang as live risks rather than documentation details.


              Public comps give some structure. CompaniesMarketCap pages imply roughly 1.7x revenue for Fluence, 4.2x
              for CATL, 1.1x for BYD, and 2.0x for EVE Energy as of June 2026. Those are imperfect comparables because
              CATL and BYD are diversified giants, Fluence is an integrator backed by Siemens and AES rather than a cell
              pure-play, and EVE has broader battery exposures than storage alone. Still, they show that Hithium's
              implied ~1.8x-1.9x sales reference point sits inside the public band rather than outside it. Private and
              quasi-private references such as REPT Battero and FlexGen are even less valuation-transparent, but they
              reinforce that storage hardware and integration are now crowded fields where execution, localization, and
              bankability matter at least as much as raw shipment volume. That means Hithium should not command a
              scarcity premium merely for being large and fast-growing.
