callouts:
- calloutType: strength
  title: Pure-play stationary storage positioning is real, not rhetorical
  body: Across the fetched official pages and industry coverage, Hithium consistently differentiates itself by focusing on stationary storage rather than spreading resources across EV batteries. That specialization helps explain why its product roadmap, deployment references, and localization strategy all line up around utility-scale and long-duration ESS.
  claimRefs:
  - CO002
  - CO003
  - CO007
  - CO041
  - CO042
- calloutType: insight
  title: The overseas mix is becoming the strategic center of gravity
  body: 'Revenue mix, Saudi scale, and the Texas plant all point in the same direction: Hithium''s next stage depends on converting overseas demand into local manufacturing and higher-margin systems sales. The March 2025 HKEX filing appears designed to finance and legitimize that pivot.'
  claimRefs:
  - CO018
  - CO020
  - CO026
  - CO027
  - CO028
  - CO031
- calloutType: risk
  title: IPO readiness is being tested by litigation, receivables, and disclosure quality
  body: 'The company may still resubmit its Hong Kong listing, but the fetched record shows three simultaneous pressure points: CATL litigation, receivables and leverage concerns, and weak public disclosure on valuation, headcount, and governance. Those issues do not negate growth, but they do narrow the margin for execution error.'
