- id: milestones-and-adverse-developments
  title: Milestones, IPO chronology, and adverse developments
  body: |-
    The chapter's single chronology of record shows a company that moved from founding to heavyweight fundraising, then into globalization and public-market preparation within roughly six years. The sequence that matters most to later chapters begins with the 2019 founding, the October 2022 Series B, and the July 2023 Series C. It then accelerates through Q3 2024 BloombergNEF Tier 1 recognition, the March 2025 HKEX filing, May 2025 Europe-localization moves, August 2025 Saudi and Texas expansion milestones, and the September 2025 lapse of the Hong Kong application. Follow-on reporting in October says Hithium treated the lapse as procedural and prepared a resubmission rather than a withdrawal.

    The same chronology also carries the adverse record investors cannot ignore. CATL's 2025 lawsuit, disputes around former executive Feng Dengke, and Powin-related customer-risk questions all arrived while the IPO story was unfolding. Adverse reporting further flags swollen receivables, high leverage, and international-margin dependence as important qualifiers to the growth narrative. In other words, Hithium has enough real commercial progress to justify later market, product, and customer analysis, but the company-overview chapter should remain explicit that public-market readiness is being tested by legal, financial, and disclosure quality issues at the same time that global scale is being pursued.
