  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board composition, committee structure, and any independent-director roster for the private company or IPO applicant.
    whyItMatters: Leadership concentration and governance quality are core diligence topics, but public materials do not yet show who exercises formal oversight beyond the founder group.
    diligencePath: Pull the full HKEX application proof and any corporate registry extracts; ask management for board and committee documentation.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A current audited or management-certified employee count and a clear scope definition for global staff versus site-level staff.
    whyItMatters: Public disclosures conflict between 429, 3,000, and about 8,000 employees, which limits confidence in scale and operating leverage analysis.
    diligencePath: Request the latest audited headcount from the IPO prospectus or management presentation and reconcile by geography and employment type.
    relatedQuestionRefs:
    - QO005
    - QO017
    relatedTableRefs:
    - TO001
    - TO002
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A recent priced round, cap-table excerpt, or a fetched Hurun/other benchmark row that explicitly names Hithium and its current valuation.
    whyItMatters: Valuation is a cover metric for this chapter, but only a low-confidence press estimate is available from retained sources.
    diligencePath: Fetch the full HKEX filing exhibits and investor presentation; obtain a direct cap-table or latest pricing memo from the company/data vendor.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: customer-concentration-and-receivables
    missingEvidence: Customer-level exposure, aging schedules, and specific Powin-related receivable disclosures from audited filings.
    whyItMatters: Accounts receivable, subsidy dependence, and U.S. counterparty risk are the most material financial red flags in adverse reporting.
    diligencePath: Extract the detailed accounts-receivable note and top-customer disclosures from the HKEX filing and compare against U.S. bankruptcy records.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-ownership
    missingEvidence: Exact ownership stakes, board rights, and liquidation preferences for the main financial backers and strategic counterparties.
    whyItMatters: The investor map can identify economically important parties, but public sources do not expose the exact cap table or governance rights.
    diligencePath: Use the IPO prospectus, shareholder register, and management Q&A to complete investor ownership and rights.
