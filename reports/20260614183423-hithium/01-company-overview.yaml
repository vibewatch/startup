- id: leadership-and-governance
  title: Founders, leadership, and governance opacity
  body: |-
    Public leadership evidence is concentrated around founder-chairman Wu Zuyu (also referred to as Jeff Wu), with much less transparency below the top line. Adverse coverage from TMTPost and Energy-Storage.news consistently names Wu as the founder and chairman leading Hithium's response to CATL litigation, IPO-status questions, and public rumor control. That makes him both the clearest public face of the company and the largest single key-person risk. The same reporting also ties Wu and other former CATL employees to non-compete and intellectual-property disputes, which means founder reputation is now directly linked to legal and commercial diligence.

    Below Wu, the public record is patchier. Verdict names Wang Pengcheng as co-founder and general manager; Tracxn lists Jason Wang as co-founder; the naming mismatch is probably transliteration rather than a second individual, but the fetched record cannot prove that definitively. The Texas-plant release identifies James Boswell as VP of North America Operations, giving one additional operational anchor for overseas execution. What the evidence does not provide is a current board roster, committee structure, or independent-director map. For a business pursuing public equity, that governance opacity matters: investors can see founder prominence and some operating lieutenants, but they cannot yet cleanly map formal oversight.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
