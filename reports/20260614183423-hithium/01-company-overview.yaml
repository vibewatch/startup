company:
  name: Xiamen Hithium Energy Storage Technology Co., Ltd. (Hithium)
chapter:
  number: 1
  title: Company Overview
  summary: Hithium is a Xiamen-founded stationary energy-storage specialist that grew from a 2019 startup into a top-tier battery supplier with a March 2025 HKEX filing, a July 2023 Series C worth more than RMB 4.5 billion, 2024 revenue of roughly RMB 12.9 billion, and major localization pushes in Texas and Saudi Arabia. The fetched evidence also shows that the company's rapid rise is inseparable from founder-centric governance, under-disclosed valuation and headcount, and growing legal and receivables pressure tied to the 2025 IPO process.
sections:
- id: identity-and-platform
  title: Identity, product scope, and operational footprint
  body: |-
    Hithium was founded in 2019 in Xiamen, Fujian, and has built its identity around a single proposition: focus on stationary battery energy storage rather than the much larger electric-vehicle battery market. Across its homepage, product system pages, and company profile pages, the company consistently presents itself as a provider of integrated battery cells, modules, packs, and liquid-cooled systems for utility-scale, commercial-and-industrial, and residential applications. The official about page further claims that Hithium is vertically integrated across materials, cells, systems, and control technologies, supported by four R&D institutes and more than 1,100 engineers.

    The scale signals in fetched sources are meaningful but not perfectly harmonized. World Economic Forum profile data says Hithium has about 8,000 staff and more than 3,900 patents, while directory-style sources show a lower staff count and a more limited office map. What is consistently supported is that the company is headquartered in Xiamen, operates beyond a single Chinese site, and has active reference deployments outside China. Hithium's own cases page highlights utility-scale projects in Colorado and Bulgaria, while official 2025 releases show active localization efforts in Europe, Texas, and Saudi Arabia. For later chapters, the reusable ground truth is that Hithium is an ESS-focused, globally commercializing manufacturer whose identity is stronger than its disclosure discipline.
