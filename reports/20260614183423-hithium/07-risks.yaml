- id: people-execution-and-monitoring
  title: People and execution risk comes from doing too many hard things at once
  body: 'Hithium''s people risk is less about founder drama than about execution bandwidth. The company is simultaneously upgrading Changzhou, ramping Texas, negotiating European localization, building a Saudi JV footprint, defending IP claims, and trying to reopen the IPO window. That is an unusually broad set of high-stakes programs for a private manufacturer whose public disclosures are still thinner than listed incumbents. The ex-CATL talent overlap that helped Hithium scale quickly also now creates shadow risk because litigation with CATL is partly about personnel movement and alleged technology overlap. Meanwhile, the public evidence suggests profitability still leans on subsidies, working capital remains stretched, and the most important overseas channels are not yet obviously diversified. The right way to underwrite Hithium, therefore, is with explicit kill criteria rather than with a vague ''watch execution'' caveat. If public filings do not resume cleanly, if another major counterpart
    exits, if overseas localization stalls beyond assembly-only sites, or if a real field-safety event or certification setback appears, the thesis breaks quickly because multiple risk vectors would be telling the same story: Hithium scaled faster than its governance, balance sheet, and channel resilience could support.'
