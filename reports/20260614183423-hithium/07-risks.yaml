callouts:
- calloutType: risk
  title: The IPO is a financing variable, not a vanity event
  body: Because Changzhou, Texas, Navarre, and Saudi all demand capital or management bandwidth, a delayed or disclosure-heavy IPO directly raises the probability that debt, slower capex, or weaker pricing discipline will become the fallback.
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR007
  - CR039
- calloutType: insight
  title: Safety proof is stronger than channel proof
  body: Hithium has unusually visible pre-deployment safety evidence for a private storage supplier, but its partner and customer durability evidence is still thinner than the safety narrative. That mismatch is why dependency risk still ranks high.
  claimRefs:
  - CR020
  - CR022
  - CR025
  - CR028
  - CR030
