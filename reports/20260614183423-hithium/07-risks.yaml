  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-bridge
    missingEvidence: A current cash balance, debt-maturity schedule, and month-by-month 2025-2026 cash bridge are not public in the retained set.
    whyItMatters: Without a real liquidity bridge, investors cannot tell whether the IPO is optional growth capital or a near-term funding necessity.
    diligencePath: Request the latest management accounts, unrestricted cash, covenant package, debt maturities, and 12-month financing plan.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: powin-and-us-customer-exposure
    missingEvidence: Exact shipped inventory, receivable exposure, cancellation terms, and top-customer concentration after the Powin filing are not public.
    whyItMatters: Counterparty distress is a first-order risk only if exposure is large enough to matter for collections, margin, or plant utilization.
    diligencePath: Obtain customer-level AR aging, Powin contract schedules, cancellation notices, and a post-bankruptcy commercial update.
    relatedQuestionRefs:
    - QR028
  - type: missing-source
    severity: material
    topic: catl-case-docket-depth
    missingEvidence: The retained set has press summaries of the CATL dispute but not the full Ningde pleadings, evidence bundles, or outside-counsel remedy assessment.
    whyItMatters: Remedy scope, injunction probability, and product redesign burden determine whether the case is a disclosure nuisance or a thesis-break risk.
    diligencePath: Pull the full court file and commission a Chinese IP-litigation memo that covers injunction risk, likely timeline, and design-around options.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: navarre-and-saudi-permits
    missingEvidence: Outstanding permits, subsidy agreements, land rights, and JV governance details for Navarre and the MANAT project are not fully public.
    whyItMatters: Headline investment announcements can overstate de-risking if the real administrative or partner dependencies are still unresolved.
    diligencePath: Request permit trackers, subsidy letters, land/control documents, and signed shareholder or JV agreements for each project.
    relatedQuestionRefs:
    - QR030
  - type: private-evidence-only
    severity: material
    topic: non-china-cell-contingency
    missingEvidence: The retained set does not quantify how much Hithium volume can migrate to non-China or U.S.-made cells if tariff or FEOC rules tighten further.
    whyItMatters: Texas assembly only reduces policy risk partially; true resilience depends on upstream sourcing flexibility and qualification readiness.
    diligencePath: Map BOM origin by product, alternative cell suppliers, qualification lead times, and the percentage of forecast U.S. volume covered by each sourcing path.
    relatedQuestionRefs:
    - QR031
