  rows:
  - - Certification-grade safety proof does not equal field reliability
    - Open-door fire testing is a strong proof point, but it is still a controlled demonstration rather than years of field incident and warranty data.
    - Medium
    - High
    - UL-witnessed fire test, certification, and independent coverage
    - A real propagation event, certification dispute, or warranty spike would reset bankability quickly.
    - Request fleet incident logs, warranty claims, root-cause reports, and insurer feedback from deployed projects.
  - - Standards are tightening faster than legacy products age
    - UL 9540A 6th edition and NFPA 855 increase emphasis on large-scale fire, explosion, and gas hazards as BESS energy density rises.
    - High
    - High
    - The company designed to current standards and publicized compliance
    - Products qualified to older assumptions may need redesign, spacing, or costlier balance-of-plant protection.
    - Review product-roadmap deltas needed for each standard revision and the capex needed to preserve compliance.
  - - Assembly-first localization leaves cell-origin exposure
    - Texas supports modules and systems, but public reporting says it is not thought to include cell production lines.
    - High
    - High
    - Domestic assembly, local hiring, and global supplier planning
    - Tariffs, FEOC screens, or shipping delays can still hit the most important cost input.
    - Obtain the current share of U.S. shipments using China-origin cells and the alternative supplier plan by quarter.
  - - Price-war pressure can leak into quality and warranty discipline
    - Chinese regulators explicitly tied below-cost selling and repeated construction to product quality and sustainability risk.
    - Medium-High
    - High
    - Regulatory pressure now pushes the market toward quality over price
    - If Hithium chases volume with thin pricing, QA staffing, validation depth, or reserve discipline may suffer.
    - Test gross margin, scrap, rework, and warranty provisioning by product family before and after recent overseas bids.
  - - New environments stretch product assumptions
    - Desert-specific Saudi offerings and long-duration products broaden the addressable market but also widen the operating envelope.
    - Medium
    - Medium-High
    - Product-specific positioning and local-for-local factory plans
    - Thermal, dust, and service realities may differ sharply from core Chinese references.
    - Request climatic derating data, service SLAs, and third-party performance testing for Saudi and long-duration products.
  - - Multi-site scaling can outrun service capability
    - Changzhou, Texas, Navarre, and Saudi initiatives all demand launch-quality engineering, field support, and supplier control at once.
    - Medium-High
    - High
    - The company is building regional production and service nodes
    - A stretched launch organization can turn minor defects into recurring delivery or warranty issues.
    - Provide launch-readiness scorecards, site-level staffing plans, and supplier PPAP/qualification status for each region.
  notes: This register focuses on real quality and safety transmission risks rather than generic battery-company boilerplate. The key distinction is between successful certification and repeatable fleet performance.
