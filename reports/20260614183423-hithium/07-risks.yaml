    - Powin / FlexGen lineage
    - Route to projects in Hithium's most important overseas market
    - Partner distress or ownership change disrupts orders, collections, and references.
    - High
    - Hithium also sells through other integrators and in-house systems
    - One bankruptcy already happened, so channel durability is not hypothetical.
  - - Known integrator set
    - NHOA, Risen, Powin, in-house projects
    - Translate cells into project wins and local delivery
    - A small known partner pool can hide concentration and bargaining risk.
    - High
    - Broader international expansion into Europe and MENA
    - Public evidence still shows a finite set of named system channels rather than broad diversification.
  - - U.S. policy stack
    - Federal tariff, FEOC, and domestic-content rules
    - Determines cost, sourcing eligibility, and project economics
    - Policy changes make China-origin cells less economic even if Hithium assembles locally.
    - High
    - Texas assembly site and continuing local hiring
    - Without local cells or non-China cell options, policy risk still sits upstream.
  - - Spain regional-government execution
    - Navarre / Invest in Spain / local administrative process
    - Enable the European localization story
    - Permits, land, subsidy, or timing slips can turn a headline win into sunk management time.
    - Medium-High
    - Strong political sponsorship and signed commitment
    - Public sources still describe steps and details to be finalized before full execution.
