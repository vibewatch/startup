  rows:
  - - IPO lapse and resubmission disclosure risk
    - Hithium's prior HKEX application lapsed; the company says resubmission is being prepared, while the current proof still funds a long Changzhou capex program.
    - High
    - High
    - Low-Medium
    - If the resubmission stalls or disclosures worsen, funding flexibility tightens while expansion continues.
    - Obtain the resubmitted A1, sponsor letters, latest HKEX comments, and a board-approved financing contingency plan.
  - - CATL litigation / IP injunction risk
    - CATL filed an unfair-competition case tied to the 587Ah product line; reporting says the hearing timing overlaps with IPO review and HKEX viability disclosure rules matter.
    - High
    - High
    - Low
    - An injunction, adverse ruling, or broader discovery could hit both listing credibility and core product positioning.
    - Pull the Ningde court docket, pleadings, and outside-counsel assessment of injunction probability and product redesign options.
  - - China anti-price-war enforcement
    - MIIT, NDRC, SAMR, and NEA summoned Hithium and peers and explicitly warned against blind investment, low-price competition, quality slippage, and IP violations.
    - High
    - High
    - Low-Medium
    - Hithium may face tighter tender discipline, quality audits, or pricing constraints exactly when it needs share and margin recovery.
    - Review any regulator follow-up, tender scoring changes, internal compliance memos, and margin-by-project data after January 2026.
  - - Tariff / FEOC / domestic-content policy exposure
    - Public U.S. market coverage says China battery tariffs were due to rise in 2026 while Hithium's U.S. footprint remained module-and-system heavy rather than cell-localized.
    - High
    - High
    - Medium
    - Texas improves optics but not full cell-origin exposure, so policy tightening can still hit cost and eligibility.
    - Map current BOM origin, FEOC exposure, tariff incidence by product, and the schedule for any non-China or U.S. cell sourcing.
  - - Cross-border localization permitting and subsidy risk
    - Spain and Saudi moves depend on government relationships, detailed administrative steps, and project execution beyond an announced signing ceremony.
    - Medium-High
    - High
    - Low-Medium
    - Delays in permits, subsidies, grid approvals, or JV implementation can strand capex and distract leadership.
    - Request milestone trackers, subsidy letters, land and permit status, and local-partner governance documents for Navarre and MANAT.
  - - Counterparty legal spillover from partner distress
    - Powin's Chapter 11 is now a live legal process in New Jersey, turning any disputed deliveries or receivables into court-governed recovery rather than commercial negotiation.
    - Medium
    - Medium-High
    - Low
    - A distressed integrator can freeze receivables, service obligations, and referenceability in a key overseas market.
    - Confirm whether Hithium is a creditor, quantify shipped/unshipped inventory exposure, and inspect any reservation-of-rights notices tied to the case.
