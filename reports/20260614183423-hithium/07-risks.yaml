    - MANAT / local ecosystem
    - Creates regional manufacturing and desert-market access
    - JV governance, site execution, or demand conversion may lag the announcement.
    - Medium-High
    - Local-for-local framing and Aramco-adjacent leadership credentials
    - The plan is new and public evidence is still announcement-stage.
  - - Customer concentration inside overseas mix
    - Top U.S. accounts / project developers
    - Drive high-margin overseas revenue
    - If a small number of overseas buyers slow or default, profitability can fall faster than volume suggests.
    - High
    - Growing global footprint across more than one region
    - Public adverse reporting still points to two U.S. customers accounting for a meaningful revenue share.
