  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Project-level pricing, warranty reserve terms, and realized gross-margin disclosures for Hithium and major peers in utility BESS.
    whyItMatters: Public product pages and deal announcements do not show whether Hithium wins on actual delivered economics or only on acceptable spec compliance.
    diligencePath: Request redacted customer quotes, warranty schedules, and EPC-side bid tabs for at least one 2-hour and one 4-hour project by vendor.
    relatedQuestionRefs:
    - QP021
    - QP025
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: material
    topic: bankability-disclosure
    missingEvidence: Direct access to Fluence 10-K detail and Sungrow annual-report storage disclosures in the current environment.
    whyItMatters: Western integrator bankability and Chinese system-vendor disclosure depth would be underwritten more tightly with audited backlog, warranty, and segment-margin data.
    diligencePath: Retry SEC EDGAR and CNINFO from a less restricted network or ask management to supply the relevant filings and segment extracts.
    relatedQuestionRefs:
    - QP010
    - QP025
  - type: private-evidence-only
    severity: material
    topic: channel-control
    missingEvidence: Contract structures showing whether Hithium owns customer warranties, software obligations, and O&M economics when third-party integrators are involved.
    whyItMatters: If Hithium remains mostly a cell supplier underneath other brands, apparent project wins may not translate into durable switching costs or pricing power.
    diligencePath: Obtain one signed term sheet each for a Hithium-branded system sale and an integrator-led sale that uses Hithium cells.
    relatedQuestionRefs:
    - QP015
    - QP016
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: stale
    severity: minor
    topic: hithium-scale
    missingEvidence: A newer independent shipment or installed-base disclosure for Hithium than the late-2024 40GWh cumulative-shipment figure.
    whyItMatters: Hithium’s recent share and deployment depth versus EVE, REPT, BYD, and CATL cannot be ranked as confidently without a newer verified baseline.
    diligencePath: Search 2026 conference speeches, independent market-share trackers, or ask management for a signed 2025 year-end shipment update.
    relatedQuestionRefs:
    - QP007
    - QP022
