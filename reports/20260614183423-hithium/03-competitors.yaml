  rows:
  - - Hithium
    - Direct / stationary-only ESS cells + systems
    - 40GWh cumulative shipments reported; 10GWh Texas systems plant; 5GWh Saudi JV plan
    - Utility-scale and long-duration storage developers needing LFP cells or full containers
    - Stationary-only roadmap, large-format 587Ah/1175Ah/1300Ah cells, strong safety marketing, early localization moves
    - No audited public revenue or backlog disclosure in retained set; U.S. cell onshoring not shown
  - - CATL
    - Direct / cell giant plus system partner
    - 62.4B yuan 2025 ESS revenue; 772GWh installed capacity; 321GWh under construction; 30.4% global ESS share
    - Global utilities, integrators, and storage OEMs
    - Largest disclosed manufacturing base, cost-down on 587Ah cells, validation infrastructure, strong downstream contracts
    - ESS is still a minority of CATL revenue, and China-origin policy scrutiny is rising
  - - BYD
    - Direct / system-scale incumbent
    - '>135GWh cumulative ESS shipments; 110+ countries; 650+ projects'
    - Grid-scale storage buyers and overseas solar-plus-storage projects
    - Large installed base, MC Cube references in Europe and Latin America, EV-scale balance-sheet support
    - 2026 demand and Blade Battery 2.0 bottleneck show that scale does not remove cyclic risk
  - - EVE Energy
    - Direct / large-format cell peer
    - Top-2 ESS supplier claim in 2024; >2.8M m² manufacturing base; India 8GWh order
    - Integrators and developers that want large-format ESS cells with growing overseas supply
    - Ramping overseas execution and sodium-ion optionality from below CATL/BYD scale
    - Less public downstream channel control than the top system-layer incumbents
  - - REPT Battero
    - Direct / Chinese ESS cell specialist
    - Top-five ESS cells globally; 90GWh annual capacity; Indonesia factory under construction
    - ESS OEMs, residential storage, and utility developers sourcing Chinese LFP cells
    - Tsingshan-backed industrial parent, 314Ah/392Ah/588Ah roadmap, BNEF Tier 1 streak
    - Public evidence is more company-claim heavy and less finance-grade than listed incumbents
  - - Sungrow
    - System-layer incumbent
    - Utility-scale PowerTitan references plus independently covered 20MWh burn test
    - Developers wanting bankable containers plus power-electronics heritage
    - Strong safety/bankability marketing and integrated system delivery
    - Retained source set gives less direct cell-roadmap detail than for Hithium, CATL, EVE, or REPT
  - - Fluence / FlexGen
    - System-layer reference / software-heavy integrator
    - Global Gridstack fleet, Siemens/AES backing, Mosaic and Nispera software, AI-led EMS pitch from FlexGen
    - Utilities, IPPs, and developers that prioritize software, controls, and long-term service
    - Owns high-switching-cost layer above cells through controls, bidding, monitoring, and O&M
    - Can still depend on third-party cell supply and may be structurally less cost-competitive on commodity hardware than Chinese cell giants
  notes: Rows mix direct cell peers and system-layer alternatives because buyers can solve the same storage job via cells, full containers, or software-heavy integrators.
