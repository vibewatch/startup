- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public commercial signal
  - Delivery layer
  - Main switching-cost driver
  - Implication
  rows:
  - - Hithium
    - No clean public tariff; wins are framed through product specs, localization, and partner channels
    - Cells, modules, and full containers
    - Qualification work, safety comfort, local assembly lead time, and whichever integrator owns O&M
    - Can win on fit and localization, but public pricing power is not underwritten
  - - CATL
    - ESS revenue disclosed; 587Ah cost-down and long-term contracts are visible
    - Cells plus local project partners and service models
    - Procurement scale, long-term supply agreements, local partners, and ability to keep lowering qualified cost
    - Strongest visible price-war resilience in the peer set
  - - BYD
    - Project wins and cumulative shipments visible; realized pricing still opaque
    - Full systems for utility projects
    - Installed-base references, delivery experience, and incumbent customer comfort
    - Large project base supports pricing discipline even during cyclical stress
  - - EVE Energy
    - Order scale visible; realized pricing not public
    - Large-format cells and selected system activity
    - Cell qualification, long-term supply planning, and growing overseas references
    - Competitive on cell supply but still building system-layer lock-in
  - - REPT Battero
    - Public pricing absent; product and capacity claims dominate
    - Cells first, solutions second
    - Industrial-parent supply access and OEM qualification
    - May be forced to compete hard on qualified supply economics
  - - Sungrow
    - System-value framing rather than public tariff disclosure
    - Integrated utility-scale containers
    - Bankability, power-electronics integration, and safety credibility
    - Stronger ability than cell-only players to defend value above hardware
  - - Fluence
    - Value framed through turnkey delivery, bidding software, and APM rather than hardware price
    - Full system, controls, software, O&M
    - Mosaic, Nispera, OS integration, and long-term service relationships
    - Most durable switching costs in retained set, but potentially less commodity-hardware price competitive
  - - FlexGen / Powin lineage
    - Software value story and integrator fragility signal rather than transparent hardware pricing
    - EMS / software plus integrator wrapper
    - Control-stack integration and customer workflow dependence
    - Shows that customer stickiness may survive even when a hardware integrator structure changes
  notes: The comparison captures public commercial signals, not quoted contract rates. Pricing remains largely opaque, so the table focuses on what the public record actually reveals about packaging and lock-in.
