chapter:
  number: 7
  title: Risks
  summary: Palmetto’s risk profile is dominated by policy exposure, capital-market dependence, partner execution, and customer-contract complexity. The company has credible mitigations in software, monitoring, legal disclosures, and structured-finance access, but the public record still leaves open important questions around contract performance, concentration, and the ability to keep quality consistent across a large distributed network.
sections:
- id: policy-and-legal-risk
  title: Policy, legal, and regulatory risk
  body: Palmetto’s first-order risk is that residential clean-energy economics remain heavily policy-shaped. The 2025 year-in-review from SEIA says Section 25D for owned residential solar expired at the end of 2025, while third-party-owned structures can still qualify through the commercial investment-credit framework for a limited timing window. That does not necessarily hurt Palmetto’s flagship LightReach model immediately, but it does increase policy complexity and narrows the path by which customers and capital providers evaluate economics. Tariffs, FEOC rules, consumer-protection standards, state contractor licensing, utility billing disputes, truth-in-lending disclosures, privacy obligations, and accessibility requirements all add regulatory surface area. Palmetto has published many of these disclosures, which is a positive sign of process maturity, but the sheer number of legal and operational interfaces means compliance drift is a real risk if growth outruns controls.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-quality-and-security-risk
  title: Operational, quality, and security risk
  body: 'Palmetto’s model is software-enabled, but it is still exposed to field execution. Every quote ultimately depends on installers, permits, hardware supply, activation timing, monitoring telemetry, and service resolution. Public materials point to mitigations: Palmetto Protect, nationwide technicians, customer support, a security program with role-based access and separated cloud environments, accessibility and privacy pages, and Recheck-based channel verification. Those are helpful signals, yet they do not eliminate the core risk that a distributed residential network can fail through inconsistent workmanship, delayed service, bad partner behavior, or a cyber or data incident that undermines trust. Residential energy is not a pure digital service; quality failures are operationally messy, geographically fragmented, and reputation-sensitive.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  tableRefs:
  - TR002
  figureRefs: []
- id: partner-and-capital-dependency-risk
  title: Partner, dependency, and capital-market risk
  body: 'The next major risk bucket is external dependency. Palmetto depends on installers and EPC partners to originate and fulfill projects, on capital providers and ABS markets to fund long-duration contracts, on regulators and utilities to preserve workable interconnection and rate structures, and on counterparties to keep channel relationships productive. The company’s 2025 financing announcements and repeat ABS issuance are strengths, but they also prove dependence: a business that needs warehouse debt, takeout securitizations, and policy-aligned tax economics remains vulnerable if any one link tightens. Public peer evidence makes this concrete. Sunrun’s disclosures show how central asset-level debt and tax equity are in the category, while SunPower’s bankruptcy filing and Sunnova’s later restructuring show that scale alone does not eliminate execution or financing fragility.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  tableRefs:
  - TR003
  figureRefs:
  - FR002
- id: people-execution-and-model-risk
  title: People, execution, and model risk
  body: Palmetto is also exposed to people and model risk. Chris Kemper remains founder, CEO, and chairman, making him a meaningful key-person dependency. Rapid growth increases the odds of execution mistakes in partner onboarding, sales oversight, customer support, and billing. Long-duration consumer contracts can magnify modest early mistakes into years of service burden, disputes, or bad debt. Even where Palmetto’s software lowers acquisition or fulfillment friction, the public record does not reveal complaint rates, default curves, service backlogs, or partner churn. That opacity matters because the downside in a residential-finance platform often arrives gradually through contract underperformance, servicing strain, and rising cost of capital rather than in one obvious technical failure. This risk is cumulative.
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  tableRefs:
  - TR004
  figureRefs: []
- id: mitigations-and-thesis-breaks
  title: Mitigations, monitoring indicators, and thesis-break triggers
  body: 'The good news is that most of Palmetto’s key risks are monitorable. Investors can track policy deadlines, securitization frequency, customer default behavior, complaint rates, partner concentration, service response times, and enterprise-channel expansion. Palmetto has already built some mitigation scaffolding through legal disclosures, security controls, contractor-licensing transparency, customer-support processes, and repeat capital-market access. But the thesis breaks quickly if Palmetto loses financing flexibility, if partner quality deteriorates, if customer-friction terms begin driving higher disputes or defaults, or if policy changes narrow the economics of third-party ownership faster than the company can adapt. The overall risk view is therefore elevated but not fatal: Palmetto looks like a business that can be investable only if diligence proves strong operational discipline beneath the surface growth story.'
  claimRefs:
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
