- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Policy compression
    - Loss of attractive TPO economics in major states or tighter federal eligibility timing
    - Material deterioration in customer savings or tax-credit capture
    - Reprice growth assumptions and re-underwrite channel mix
  - - Capital-market tightening
    - ABS spreads widen materially or new takeouts stop
    - No repeat securitization / warehouse expansion for multiple quarters
    - Assume slower growth and higher equity need
  - - Partner-quality deterioration
    - Complaint, rework, or partner-failure rates rise
    - Sustained increase in service burden or installer churn
    - Reduce confidence in brand and unit economics
  - - Contract underperformance
    - Defaults, transfers, or disputes rise above expected cohorts
    - Visible portfolio stress in warehouse or ABS reporting
    - Reassess asset value and residual economics
  - - Cyber / privacy or consumer-protection event
    - Regulatory inquiry, breach, or major public complaint cluster
    - Any material enforcement action or trust shock
    - Move thesis from scale story to preservation mode
  notes: The key to Palmetto diligence is building an early-warning system before stress shows up in valuation.
