summary:
  headline: >
    Palmetto appears to be a strategically interesting private residential clean-energy platform with real scale, repeat
    financing access, and credible product breadth—but public evidence still leaves enough margin,
    portfolio-performance, and capital-dependency gaps that the right call is research-more with strict valuation
    discipline rather than an unconditional buy.
  overallScore: 6.7
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
