  topStrengths:
    - >-
      Real customer and channel footprint: 20,000+ LightReach households, 600+ partners, and nearly 72,000 families
      reportedly served in 2025
    - >-
      Repeat capital-market access through a $1.2B-plus financing package and two 2025 ABS transactions totaling more
      than $716M
    - >-
      Broad product and platform story spanning consumer energy plans, marketplace products, Energy Intelligence,
      partner software, and long-term service
    - >-
      Strong market relevance in a large, underpenetrated residential-energy category with rising interest in TPO
      structures
    - >-
      Strategic backers and institutional signaling from Social Capital, TPG Rise Climate, Morgan Stanley, Truist, and
      other financial counterparties
    - >-
      Potential for software and channel leverage if Palmetto’s platform meaningfully reduces soft costs and servicing
      burden over time
  topRisks:
    - >-
      Public evidence does not disclose gross margin, cash generation, default curves, portfolio performance, or
      unrestricted liquidity
    - The business remains highly dependent on capital markets, ABS execution, partner quality, and policy stability
    - >-
      Customer-friction terms around transfers, defaults, billing, and long-duration service obligations could become
      reputation or servicing risks
    - Residential solar peers such as SunPower and Sunnova show that scale does not eliminate downside in this category
    - Public customer proof is stronger on channel breadth than on longitudinal homeowner outcomes and retention quality
    - >-
      The current unicorn-style price anchor may already assume execution success that has not yet been publicly
      validated
  unresolvedGaps:
    - Audited financial statements, revenue-recognition detail, and gross-margin transparency are not public
    - Contract-asset performance by cohort, including defaults, transfers, disputes, and servicing cost, is not public
    - Top-partner, top-state, and top-enterprise-account concentration are not publicly disclosed
    - Software usage, enterprise monetization, and module-level adoption are not publicly quantified
    - Recent secondary or inside-round pricing context is not public, so database valuation marks may be stale
    - Public retention metrics such as NRR, GRR, churn, complaint rates, and service response times remain unavailable
