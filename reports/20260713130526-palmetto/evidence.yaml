evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current cap table, preference stack, secondary transactions, and ownership by investor cohort after debt
      financings and ABS issuance.
    whyItMatters: Public round announcements establish scale but not who controls downside protection, dilution, or board rights.
    diligencePath: >-
      Request the live cap table, major financing documents, and a schedule distinguishing equity, warehouse debt, and
      ABS obligations.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited GAAP revenue, gross margin, EBITDA, cash, and debt for 2024 and 2025.
    whyItMatters: ARR snapshots and financing headlines are not enough to underwrite unit economics or solvency.
    diligencePath: >-
      Obtain audited annual financial statements plus monthly management reporting tied to LightReach and enterprise
      products.
    relatedQuestionRefs:
      - QO014
      - QO023
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current employee count and reconciliation across legal entities and geographies.
    whyItMatters: >-
      Public databases materially disagree on headcount, limiting confidence in operating-scale and productivity
      comparisons.
    diligencePath: Ask management for an HRIS export or board-level headcount rollforward by month and function.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: founder-liquidity
    missingEvidence: Public evidence on any founder secondary sales or liquidity events.
    whyItMatters: Secondary activity can change incentive alignment and investor entry assumptions.
    diligencePath: Review financing-side letters and directly ask management whether any secondaries occurred in 2022-2025 rounds.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: precise-dollar-tam
    missingEvidence: A defensible public dollar TAM specific to residential TPO plus software-enabled electrification services.
    whyItMatters: >-
      Public sources support multiple market lenses but not one clean TAM for Palmetto’s exact bundle, which makes
      top-down valuation comps noisy.
    diligencePath: >-
      Build a state-by-state model combining eligible housing stock, electric-rate bands, TPO economics, and partner
      footprint rather than relying on generic solar TAM figures.
    relatedQuestionRefs:
      - QM010
      - QM025
  - type: private-evidence-only
    severity: material
    topic: palmetto-serviceable-market
    missingEvidence: Internal data on quote volume, approval rate, partner coverage, and state-by-state conversion constraints.
    whyItMatters: >-
      Palmetto’s real SAM depends on financing eligibility, partner capacity, and utility-specific economics, not
      national solar demand alone.
    diligencePath: Request funnel metrics by state, partner, and product type plus rejection reasons for declined households.
    relatedQuestionRefs:
      - QM009
      - QM025
  - type: conflicting-data
    severity: minor
    topic: forecast-variance
    missingEvidence: >-
      A reconciled management view on how the company models 2026-2028 under conflicting pre- and post-OBBBA market
      forecasts.
    whyItMatters: >-
      Public reports changed meaningfully once policy shifted, so any base case should be tied to a specific policy
      assumption set.
    diligencePath: Ask management for scenario planning that isolates rates, tax-credit timing, and equipment-cost sensitivity.
    relatedQuestionRefs:
      - QM008
      - QM024
  - type: private-evidence-only
    severity: material
    topic: win-rate-by-channel
    missingEvidence: >-
      Actual Palmetto win rates versus Sunrun, lender-led installers, and marketplace-sourced quotes by geography and
