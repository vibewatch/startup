companyProfile:
  summary: 'Palmetto is a Charlotte-based residential clean-energy platform built around consumer energy

    products, partner tooling, financing, and long-term asset management. The company describes

    itself as a software company enabling consumer adoption of climate-technology products and

    services, but its operating reality is broader: Palmetto combines a homeowner marketplace,

    LightReach / Energy Plan subscription-style offerings, enterprise and API-based Energy

    Intelligence tools, installer and channel partnerships, and ongoing monitoring and support.

    Public evidence supports real customer scale, repeat capital-market access, and multi-product

    expansion into HVAC, rate plans, rewards, and related home-energy workflows. The strongest

    public caveat is not relevance or ambition; it is evidence quality around economics,

    concentration, and portfolio performance.

    '
