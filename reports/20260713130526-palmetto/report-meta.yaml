  productSummary: 'Palmetto sells and services residential clean-energy products across solar subscriptions,

    solar purchases, monitoring and service plans, HVAC and broader electrification offers,

    utility-rate tools, rewards, and marketplace products. It also operates Energy Intelligence,

    enterprise APIs, Instant Design, and multi-product quoting workflows that support installer,

    utility, and enterprise channels.

    '
  customerFocus: 'U.S. homeowners seeking residential solar or broader electrification products; installer and EPC partners that need financing, software, fulfillment, and brand support; and enterprise or utility channels embedding clean-energy tools into their own customer experiences.

    '
