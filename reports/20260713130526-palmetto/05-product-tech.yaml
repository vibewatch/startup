  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-reliability
    missingEvidence: API uptime history, model accuracy benchmarks, service response metrics, and installation-quality or remediation-rate data.
    whyItMatters: Public product pages describe capabilities, but reliable underwriting of quality requires measured outcomes.
    diligencePath: Request enterprise SLAs, monitoring dashboards, NPS/CSAT, installation QA metrics, and service ticket performance by cohort.
    relatedQuestionRefs:
    - QE014
    - QE015
    - QE025
  - type: private-evidence-only
    severity: material
    topic: product-usage
    missingEvidence: Usage volume for Instant Design, Multi-Product Quotes, and Energy Intelligence among external customers and internal teams.
    whyItMatters: A broad product surface is not the same as deep adoption or workflow leverage.
    diligencePath: Request MAU, API call volume, active enterprise accounts, and funnel conversion effects by module.
    relatedQuestionRefs:
    - QE003
    - QE007
    - QE008
    - QE016
    - QE023
  - type: private-evidence-only
    severity: moderate
    topic: customer-friction
    missingEvidence: Cohort-level outcomes for cancellations, transfers, defaults, and dispute rates under subscription or service contracts.
    whyItMatters: Legal disclosures surface meaningful customer-friction points that may affect product trust and retention.
    diligencePath: Request contract cohort data, cancellation reasons, complaint trends, and transfer success rates.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE022
    - QE025
