- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Energy Intelligence modeling core
    - Creates hourly household baseline and upgrade scenarios
    - Building-science models, geospatial data, tariff data, carbon data
    - Model error or stale data can damage quote trust
  - - Digital twin / inferred home attributes
    - Turns sparse property data into usable energy model
    - Data enrichment and inference logic
    - Inference quality may vary by housing type or region
  - - Instant Design
    - Produces proposal-grade system layouts
    - Model outputs, roof data, financier acceptance
    - Overconfidence if local roof or shade conditions diverge
  - - Multi-Product Quotes
    - Bundles multiple upgrades into one quote workflow
    - Cross-product rules, UI simplicity, financing options
    - Complexity can increase sales friction if outputs are hard to explain
  - - Enterprise APIs
    - External delivery of data and workflow tools
    - Developer docs, auth, versioning, support
    - Public SLA and pricing transparency are limited
  - - Fulfillment / partner orchestration
    - Routes jobs into local installation and service network
    - Partner quality and local coverage
    - Execution consistency is exposed to third-party performance
  - - Monitoring / service operations
    - Tracks system health and coordinates fixes
    - Telemetry, alerts, service network, support staff
    - False positives, missed issues, or slow dispatches can erode trust
  notes: Public materials support a layered operating architecture that mixes software, data, financing, and field operations.
