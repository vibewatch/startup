- id: deployment-support-and-quality-controls
  title: Deployment, support, and quality controls
  body: 'Palmetto’s product experience does not end at quote generation. The consumer workflow continues through installation, activation, app-based project tracking, monitoring, maintenance, billing, and service support. Palmetto Protect is especially important because it translates product quality from equipment specs into a managed service promise: proactive monitoring, intelligent issue detection, nationwide technicians, phone and email support, and performance-guarantee coverage. The security page adds another trust layer, describing risk governance, annual assessments, quarterly access reviews, MFA, SSO, encryption, incident response, backup policies, separated environments in Google Cloud Platform, and formal change-management controls. These are positive signs, but public evidence is still incomplete on uptime metrics, API SLAs, third-party certifications, false-positive rates in monitoring, and measured installation-quality outcomes across the partner network. That means investors
    should treat the public controls as encouraging evidence, not as a substitute for audited operating metrics or third-party assurance. The current public record proves process awareness, but not operational excellence at quantified scale.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
