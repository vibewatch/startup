- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow pain
  - Palmetto solution
  - measurable benefit signal
  - limitation
  rows:
  - - Homeowner evaluating solar
    - Opaque savings, complex financing, fragmented installer search
    - Quote flow plus subscription or purchase options
    - Lower-friction entry and no-upfront path
    - Exact close-rate improvement not public
  - - Partner trying to quote a household
    - Manual sizing and multi-system comparison
    - Instant Design and Multi-Product Quotes
    - Proposal generation in under a minute claimed for design tooling
    - Accuracy benchmarks and error rates not public
  - - Utility or enterprise channel partner
    - Difficult customer education and distributed local execution
    - Energy Intelligence APIs and white-label enterprise platform
    - Can embed clean-energy offers in existing channels
    - Channel economics and implementation timelines unclear
  - - Existing system owner needing support
    - Monitoring gaps and service coordination burden
    - Palmetto Protect and request-service workflow
    - Remote diagnosis, alerts, and technician coordination
    - Response SLA and first-time-fix data not public
  - - Homeowner expanding into more upgrades
    - Separate vendors for HVAC, storage, and tariffs
    - Bundled marketplace and energy tools
    - Cross-sell potential and longer customer relationship
    - Attach rates and expansion revenue unknown
  notes: The clearest product advantage is workflow compression, not a single hardware breakthrough.
