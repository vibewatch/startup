chapter:
  number: 5
  title: Product & Technology
  summary: Palmetto’s product stack is broader than a residential solar storefront. Public evidence supports a full-stack operating model that combines consumer products, installer and enterprise tooling, household energy modeling, and long-term monitoring or service workflows. The strongest technology signal is not frontier hardware IP; it is Palmetto’s software-enabled orchestration of quoting, financing, fulfillment, and lifetime asset management.
sections:
- id: portfolio-and-customer-jobs
  title: Portfolio and customer workflow
  body: 'Palmetto’s product set spans consumer energy plans, installer or enterprise tools, and post-install service layers. On the consumer side, Palmetto sells or finances solar, HVAC, battery-adjacent offerings, rate plans, monitoring, and rewards. On the business side, Palmetto markets Energy Intelligence APIs, Instant Design, and Multi-Product Quotes to help partners model homes, build proposals, and sell multiple upgrades in one workflow. The company’s 2022 enterprise-platform launch made explicit that Palmetto is trying to abstract away the fragmented local work of clean-energy sales: education, design, financing, contractor routing, permitting, inspection, and lifetime service. In practical workflow terms, Palmetto wants to become the control plane between a household’s energy profile and the fulfillment network that turns that profile into a financed, installed, and monitored energy system. That framing helps explain why Palmetto keeps adding adjacent products instead of presenting
    solar as a stand-alone transaction.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: software-and-data-architecture
  title: Software, data, and operating architecture
  body: 'The core technical differentiator in public materials is Energy Intelligence. Palmetto says the API can model any U.S. household’s energy footprint at hourly granularity, disaggregated to end use, and can simulate more than 60 upgrade scenarios. The company attributes this to building-science expertise, geospatial analytics, machine learning, physics-based simulations, and a digital-twin approach that infers dozens of building characteristics. Around that modeling engine, Palmetto appears to have built sales and operations applications: Instant Design for proposal-grade system layouts, Multi-Product Quotes for bundled upgrade scenarios, API surfaces for enterprise partners, and orchestration software that routes opportunities into financing and fulfillment. The architectural story is therefore layered rather than monolithic: household data and simulation at the bottom, quoting and design workflows in the middle, and contract, service, and partner-facing experiences on top. The technology
    story is credible, but still mostly narrated through company-authored materials rather than independent benchmarks. Independent accuracy testing, customer case studies, or benchmark disclosures would materially strengthen this part of the thesis.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
