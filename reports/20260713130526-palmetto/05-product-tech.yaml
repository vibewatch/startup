  figureRefs: []
- id: differentiation-roadmap-and-trust-limits
  title: Differentiation, roadmap, and trust limits
  body: Palmetto’s differentiation case rests on integration. It can connect customer acquisition, household modeling, proposal generation, financing choices, contractor management, and post-install service in a way that point-solution competitors usually cannot. The Exelon partnership and the enterprise-platform release both suggest that Palmetto’s software can be embedded in third-party channels, not just used internally. The public roadmap also shows steady expansion from solar into broader home-energy categories such as HVAC, utility rate plans, and subscription-style offerings. Still, several trust and maturity limits remain visible. Some enterprise pages still contain placeholder copy, public accuracy benchmarks are sparse, and legal disclosures emphasize cancellation fees, transfer rules, ownership retention, and payment-default remedies that may complicate the customer experience. The product appears real and broad; the unresolved question is whether the software layer consistently
    lowers friction enough to create durable advantage at scale. In other words, breadth is visible, but repeatable product excellence is not yet fully evidenced in public.
  claimRefs:
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
