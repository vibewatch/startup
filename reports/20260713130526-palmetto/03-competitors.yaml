  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rate-by-channel
    missingEvidence: Actual Palmetto win rates versus Sunrun, lender-led installers, and marketplace-sourced quotes by geography and product type.
    whyItMatters: Public product pages reveal competitive posture but not whether Palmetto systematically wins the same homeowner decisions.
    diligencePath: Request channel-level quote, approval, and close-rate comparisons versus major named competitors and financing alternatives.
    relatedQuestionRefs:
    - QP013
    - QP025
  - type: missing-source
    severity: material
    topic: net-pricing-comparison
    missingEvidence: A normalized quote set comparing all-in customer economics across Palmetto, Sunrun, Tesla, and loan-financed alternatives.
    whyItMatters: Public websites are insufficient to judge whether integration translates into better customer economics.
    diligencePath: Collect matched customer quotes in the same utility territories and compare escalators, storage assumptions, service commitments, and tax-credit treatment.
    relatedQuestionRefs:
    - QP013
    - QP025
  - type: private-evidence-only
    severity: material
    topic: partner-overlap
    missingEvidence: Data on installer overlap, exclusivity, and churn across Palmetto, lenders, and marketplaces.
    whyItMatters: The real defensibility of Palmetto’s partner network cannot be judged from public partner-count claims alone.
    diligencePath: Review partner contracts, exclusivity terms, and revenue concentration by installer cohort.
    relatedQuestionRefs:
    - QP021
    - QP022
    - QP025
