- id: direct-competitor-scale-and-models
  title: Direct competitor scale, business models, and current strategic direction
  body: 'Sunrun is the clearest benchmark because it validates the attractiveness of subscription-style residential solar while exposing just how far Palmetto still has to go on scale. Public 2024 results show Sunrun ended the year with 1,048,842 customers, 7.5 GW of networked solar capacity, a 62% storage attachment rate, and $518.5 million of fourth-quarter revenue. Its customer-facing pages underline the same business model logic Palmetto is pursuing: predictable monthly payments, battery add-ons, monitoring, and long-term service. The important contrast is that Sunrun combines category leadership with a much larger installed base and capital-markets history. Meanwhile, former peer sets have weakened. SunPower filed for Chapter 11 in 2024, and Sunnova’s own site now says its assets moved through a court-supervised Chapter 11 sale process and that the company ceased independent operations. The sector consequence is that Palmetto is competing in a category where the prize is large but the
    failure rate for undercapitalized or mis-executed players is also visible.'
