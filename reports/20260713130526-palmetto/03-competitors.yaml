chapter:
  number: 3
  title: Competitors
  summary: Palmetto competes most directly with Sunrun and other residential solar providers using financing-led models, but the real competitive field also includes lenders, marketplaces, battery-first brands, and sector incumbents that shape consumer expectations. Palmetto’s differentiation is platform integration and partner enablement, while its main disadvantage is scale versus the largest incumbents and the limited durability of any single distribution tactic in a policy-sensitive market.
sections:
- id: landscape-and-categories
  title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
  body: The competitive field is wider than a list of rooftop installers. Palmetto sits in the same direct lane as financed residential solar providers, but adjacent categories matter just as much because the consumer decision can fragment before it ever becomes a signed solar contract. Direct peers include Sunrun and, historically, Sunnova and SunPower in the residential-financing ecosystem. Adjacent competitors include Tesla on premium solar-plus-storage hardware, EnergySage on comparison-shopping and installer discovery, and financing specialists like Dividend Finance or GoodLeap that let an installer pair credit products with a non-integrated go-to-market stack. Palmetto’s official materials suggest it wants to beat all of those models at once by combining demand capture, quote-generation software, energy modeling, financing, installer coordination, and post-install servicing. That ambition creates a broader competitive set, but it also means Palmetto has to prove it can execute across
    more surfaces than a pure lender, pure installer, or pure marketplace.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
