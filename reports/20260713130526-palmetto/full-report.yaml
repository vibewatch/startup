  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive field is wider than a list of rooftop installers. Palmetto sits in the same direct lane as
              financed residential solar providers, but adjacent categories matter just as much because the consumer
              decision can fragment before it ever becomes a signed solar contract. Direct peers include Sunrun and,
              historically, Sunnova and SunPower in the residential-financing ecosystem. Adjacent competitors include
              Tesla on premium solar-plus-storage hardware, EnergySage on comparison-shopping and installer discovery,
              and financing specialists like Dividend Finance or GoodLeap that let an installer pair credit products
              with a non-integrated go-to-market stack. Palmetto’s official materials suggest it wants to beat all of
              those models at once by combining demand capture, quote-generation software, energy modeling, financing,
              installer coordination, and post-install servicing. That ambition creates a broader competitive set, but
              it also means Palmetto has to prove it can execute across more surfaces than a pure lender, pure
              installer, or pure marketplace.
            claimRefs:
