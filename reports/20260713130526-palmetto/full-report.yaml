              Durability is visible mostly through contract structure and customer-engagement programs, not through
              classic SaaS retention metrics. LightReach plans and solar-ownership comparisons reference 20- to 25-year
              terms, HVAC subscriptions reference 10- or 12-year terms, and Palmetto Protect plus monitoring create an
              ongoing service relationship. Rewards, perks, referrals, and marketplace offers are all designed to keep
