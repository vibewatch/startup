  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy, legal, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s first-order risk is that residential clean-energy economics remain heavily policy-shaped. The
              2025 year-in-review from SEIA says Section 25D for owned residential solar expired at the end of 2025,
              while third-party-owned structures can still qualify through the commercial investment-credit framework
              for a limited timing window. That does not necessarily hurt Palmetto’s flagship LightReach model
              immediately, but it does increase policy complexity and narrows the path by which customers and capital
              providers evaluate economics. Tariffs, FEOC rules, consumer-protection standards, state contractor
              licensing, utility billing disputes, truth-in-lending disclosures, privacy obligations, and accessibility
              requirements all add regulatory surface area. Palmetto has published many of these disclosures, which is a
              positive sign of process maturity, but the sheer number of legal and operational interfaces means
              compliance drift is a real risk if growth outruns controls.
            claimRefs:
              - CR001
