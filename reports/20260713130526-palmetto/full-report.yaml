      - number: '4.2'
        title: Traction, ARR, and public operating scale
        blocks:
          - type: paragraph
            body: >-
              The strongest public operating metric is ARR, not GAAP revenue. GetLatka reports that Palmetto reached $30
              million of ARR in December 2023 and $75 million in September 2025, which implies meaningful growth even if
              the denominator remains unaudited. Company and press sources also support real customer scale in
              LightReach, with 20,000-plus households and a 300-households-per-day pace cited in January 2025. Those
              figures do not directly reveal contribution margin, but they do suggest that Palmetto is not pre-revenue
              experimentation. At the same time, the public record is incomplete on core underwriting points: there is
              no disclosed revenue mix among financing, marketplace, software, or service streams; no public churn or
              delinquency data; and no reliable monthly run-rate for cash generation. As a result, the right
              interpretation is not that Palmetto lacks traction, but that its traction is easier to see than its
              earnings quality. That distinction matters for any valuation view.
