      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s model is software-enabled, but it is still exposed to field execution. Every quote ultimately
              depends on installers, permits, hardware supply, activation timing, monitoring telemetry, and service
              resolution. Public materials point to mitigations: Palmetto Protect, nationwide technicians, customer
              support, a security program with role-based access and separated cloud environments, accessibility and
              privacy pages, and Recheck-based channel verification. Those are helpful signals, yet they do not
              eliminate the core risk that a distributed residential network can fail through inconsistent workmanship,
              delayed service, bad partner behavior, or a cyber or data incident that undermines trust. Residential
              energy is not a pure digital service; quality failures are operationally messy, geographically fragmented,
              and reputation-sensitive.
