companyProfile:
  summary: |
    Palmetto is a Charlotte-based residential clean-energy platform built around consumer energy
    products, partner tooling, financing, and long-term asset management. The company describes
    itself as a software company enabling consumer adoption of climate-technology products and
    services, but its operating reality is broader: Palmetto combines a homeowner marketplace,
    LightReach / Energy Plan subscription-style offerings, enterprise and API-based Energy
    Intelligence tools, installer and channel partnerships, and ongoing monitoring and support.
    Public evidence supports real customer scale, repeat capital-market access, and multi-product
    expansion into HVAC, rate plans, rewards, and related home-energy workflows. The strongest
    public caveat is not relevance or ambition; it is evidence quality around economics,
    concentration, and portfolio performance.
  foundedDate: '2010-02-01'
  founders:
    - name: Chris Kemper
      role: Founder, CEO, and Chairman
      background: >
        Before founding Palmetto, Kemper worked in carbon finance and clean energy at UN ESCAP and later in clean energy
        and environmental markets at Tradition Financial Services.
      claimRefs:
        - CO003
        - CO009
        - CO010
        - CO011
  foundingLocation: Charleston, South Carolina, USA
  headquarters: Charlotte, North Carolina, USA
  productSummary: |
    Palmetto sells and services residential clean-energy products across solar subscriptions,
    solar purchases, monitoring and service plans, HVAC and broader electrification offers,
    utility-rate tools, rewards, and marketplace products. It also operates Energy Intelligence,
    enterprise APIs, Instant Design, and multi-product quoting workflows that support installer,
    utility, and enterprise channels.
  customerFocus: >
    U.S. homeowners seeking residential solar or broader electrification products; installer and EPC partners that need
    financing, software, fulfillment, and brand support; and enterprise or utility channels embedding clean-energy tools
    into their own customer experiences.
  businessModel: >
    Hybrid platform model combining long-duration customer energy contracts, marketplace and product sales, partner
    software and workflow tools, servicing and monitoring obligations, and channel-driven origination through installer,
    enterprise, and utility partners.
  stage: Private late-stage / Series C / unicorn-context
  fundingStatus: >
    Public evidence shows a February 2022 ~$375M financing led by Social Capital, a March 2023 $150M investment from TPG
    Rise Climate, a January 2025 $1.2B-plus financing package for LightReach, and two 2025 ABS transactions totaling
    more than $716M.
