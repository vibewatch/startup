  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s monetization model is best understood as a mix of recurring contract cash flows, software or
              workflow enablement, and adjacent consumer-energy commerce. Public materials show LightReach as the
              flagship financial product: a lease or PPA-style plan with no upfront payment, long-duration customer
              relationships, and monthly payments that substitute for part of the utility bill. The company also markets
              a broader marketplace that includes solar, batteries, HVAC, utility-rate tools, and rewards, implying that
              at least some revenue opportunity comes from attached products, services, or referrals rather than one
              installation event. Enterprise materials add a second monetization layer in the form of Energy
              Intelligence APIs and partner software. The platform terms and investor-relations materials do not
              disclose realized pricing, take rates, gross margins, or how much of revenue is recognized up front versus
              over time, so the public record supports the broad architecture of the model but not a clean accounting
              bridge.
            claimRefs:
