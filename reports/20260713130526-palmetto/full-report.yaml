      - number: '5.2'
        title: Software, data, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator in public materials is Energy Intelligence. Palmetto says the API can
              model any U.S. household’s energy footprint at hourly granularity, disaggregated to end use, and can
              simulate more than 60 upgrade scenarios. The company attributes this to building-science expertise,
              geospatial analytics, machine learning, physics-based simulations, and a digital-twin approach that infers
              dozens of building characteristics. Around that modeling engine, Palmetto appears to have built sales and
              operations applications: Instant Design for proposal-grade system layouts, Multi-Product Quotes for
              bundled upgrade scenarios, API surfaces for enterprise partners, and orchestration software that routes
              opportunities into financing and fulfillment. The architectural story is therefore layered rather than
              monolithic: household data and simulation at the bottom, quoting and design workflows in the middle, and
              contract, service, and partner-facing experiences on top. The technology story is credible, but still
              mostly narrated through company-authored materials rather than independent benchmarks. Independent
              accuracy testing, customer case studies, or benchmark disclosures would materially strengthen this part of
