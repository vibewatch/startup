            body: >-
              Public evidence supports real customer traction even though the metrics come from different products and
              time slices. In January 2025 Palmetto said LightReach had been adopted by more than 20,000 households and
              was adding roughly 300 households per day across 30 states. The 2025 impact report later cited 71,927
