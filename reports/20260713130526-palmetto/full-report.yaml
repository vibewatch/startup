              - CR018
              - CR037
      - number: '7.3'
        title: Partner, dependency, and capital-market risk
        blocks:
          - type: paragraph
            body: >-
              The next major risk bucket is external dependency. Palmetto depends on installers and EPC partners to
              originate and fulfill projects, on capital providers and ABS markets to fund long-duration contracts, on
              regulators and utilities to preserve workable interconnection and rate structures, and on counterparties
              to keep channel relationships productive. The company’s 2025 financing announcements and repeat ABS
              issuance are strengths, but they also prove dependence: a business that needs warehouse debt, takeout
              securitizations, and policy-aligned tax economics remains vulnerable if any one link tightens. Public peer
              evidence makes this concrete. Sunrun’s disclosures show how central asset-level debt and tax equity are in
              the category, while SunPower’s bankruptcy filing and Sunnova’s later restructuring show that scale alone
              does not eliminate execution or financing fragility.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
          - type: table
            tableRef: TR003
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR038
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR002
              - CR020
              - CR021
              - CR026
              - CR034
              - CR040
      - number: '7.4'
        title: People, execution, and model risk
        blocks:
          - type: paragraph
            body: >-
              Palmetto is also exposed to people and model risk. Chris Kemper remains founder, CEO, and chairman, making
              him a meaningful key-person dependency. Rapid growth increases the odds of execution mistakes in partner
              onboarding, sales oversight, customer support, and billing. Long-duration consumer contracts can magnify
              modest early mistakes into years of service burden, disputes, or bad debt. Even where Palmetto’s software
              lowers acquisition or fulfillment friction, the public record does not reveal complaint rates, default
              curves, service backlogs, or partner churn. That opacity matters because the downside in a
              residential-finance platform often arrives gradually through contract underperformance, servicing strain,
              and rising cost of capital rather than in one obvious technical failure. This risk is cumulative.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
          - type: table
            tableRef: TR004
            claimRefs:
