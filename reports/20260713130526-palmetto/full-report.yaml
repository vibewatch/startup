      - number: '2.4'
        title: Growth drivers, constraints, and policy sensitivity
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s market is pulled forward by real economic and environmental drivers, but those tailwinds do not
              remove execution and policy risk. Company-backed sources say rising household energy costs, including
              disproportionate burden on low-income families, are making whole-home energy savings more salient. IEA’s
              renewables outlook also supports a long-duration macro tailwind: solar PV alone is expected to account for
              80% of renewable capacity growth to 2030 and renewables are on track to approach half of global
              electricity demand by 2030. Against that backdrop, the constraints are concrete. SEIA repeatedly cites
              elevated interest rates, customer uncertainty, installer and financier failures, tariffs, labor
              constraints, interconnection bottlenecks, and shifting tax-credit rules. The 2025 review is especially
              important because it records the OBBBA’s acceleration of the Section 25D expiration and the resulting
              split between customer-owned systems and TPO structures that can still qualify through commercial-credit
              pathways if they meet construction or service deadlines. Palmetto’s market thesis therefore depends on two
              linked bets: that homeowners continue to prioritize bill savings and resiliency, and that TPO economics
              remain meaningfully easier to sell than owned-solar alternatives in a post-25D environment.
            claimRefs:
