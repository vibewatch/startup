  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s addressable market is narrower than the entire energy-transition economy but broader than
              residential solar installation alone. The most useful boundary is the U.S. distributed residential
              clean-energy spend associated with rooftop solar, batteries, home-energy upgrades, financing, and the
              software layer that turns those products into a lower-friction household decision. Official Palmetto
              materials reinforce that boundary because they market solar, battery, utility-rate guidance, financing,
              and monitoring together, while enterprise materials show partner-facing APIs for quoting, energy modeling,
              and lead conversion. The closest substitutes are not just other solar installers. They include homeowner
              inaction, utility supply, cash purchases, solar loans, and alternative lenders or marketplaces that let
              homeowners compare options without committing to one vertically integrated platform. That framing matters
              because Palmetto wins only if it can simplify both the economic decision and the operational workflow
              better than stand-alone installers, loan marketplaces, or direct-to-consumer hardware brands.
            claimRefs:
              - CM001
              - CM002
