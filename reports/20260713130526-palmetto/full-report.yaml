  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s product set spans consumer energy plans, installer or enterprise tools, and post-install
              service layers. On the consumer side, Palmetto sells or finances solar, HVAC, battery-adjacent offerings,
              rate plans, monitoring, and rewards. On the business side, Palmetto markets Energy Intelligence APIs,
              Instant Design, and Multi-Product Quotes to help partners model homes, build proposals, and sell multiple
              upgrades in one workflow. The company’s 2022 enterprise-platform launch made explicit that Palmetto is
              trying to abstract away the fragmented local work of clean-energy sales: education, design, financing,
              contractor routing, permitting, inspection, and lifetime service. In practical workflow terms, Palmetto
              wants to become the control plane between a household’s energy profile and the fulfillment network that
              turns that profile into a financed, installed, and monitored energy system. That framing helps explain why
              Palmetto keeps adding adjacent products instead of presenting solar as a stand-alone transaction.
