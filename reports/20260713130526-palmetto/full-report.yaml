      - number: '2.2'
        title: Sizing lenses and current market trajectory
        blocks:
          - type: paragraph
            body: >-
              The current market picture is best understood through multiple lenses instead of one headline TAM. First,
              the U.S. solar sector remains structurally important: SEIA said solar accounted for 64% of all new
              electricity-generating capacity added to the grid through Q3 2024, while the U.S. solar fleet already
              produced enough electricity to power more than 37 million homes. Second, the residential segment is real
              but cyclical. SEIA’s Q4 2024 report said residential installations fell sharply in 2024, with Q3
              residential volume down 39% year over year and full-year capacity expected to contract 26%. The 2025
              year-in-review later showed the segment installed 4,647 MWdc, down another 2% year over year. Third, the
              forward outlook depends on which policy window is used: SEIA’s late-2024 outlook expected 2025 recovery on
              lower rates and rising TPO share, while the 2025 review, written after the OBBBA, expects a 2026
              contraction before later stabilization. For Palmetto, the implication is that a large market exists, but
              the investable timing is highly policy-sensitive and must be sized with scenario ranges rather than a
              single line item.
            claimRefs:
