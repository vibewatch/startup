  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and current valuation context
        blocks:
          - type: paragraph
            body: >-
              The valuation question is not whether Palmetto is a real company. It clearly is. The question is whether
              the public record supports paying a unicorn-style price for a business whose economics still look part
              software platform, part project-finance machine, and part distributed field operation. GetLatka reports a
              $1.03 billion valuation in January 2025 and $75 million of ARR in September 2025; CB Insights and other
              databases also treat Palmetto as a unicorn. That implies a rough low-teens ARR multiple on limited public
              operating detail. For a business with real growth and repeat ABS access, that is not obviously absurd. But
              for a business with limited public margin, default, and liquidity data, it is also not obviously cheap.
              The right stance is therefore selective rather than enthusiastic: Palmetto may deserve a premium to a pure
              installer, but the current public evidence does not justify paying any price simply because the company
              has climate-tech and software language attached to it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV009
              - CV017
              - CV033
              - CV040
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV006
              - CV007
              - CV026
              - CV032
              - CV040
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is coherent. Palmetto appears to be building a software-enabled residential energy
              platform with recurring contract assets, multi-product expansion, enterprise distribution surfaces, and
              enough capital-market credibility to keep growing. If that model works, Palmetto could command a
              meaningfully better multiple than installer-like peers because software and servicing leverage would
              improve over time. The anti-thesis is equally coherent. Public evidence still does not reveal gross
              margin, CAC, default rates, unrestricted cash, or concentration, and the category has already shown how
              quickly capital-intensive residential energy models can break when policy, rates, or servicing economics
              move against them. The company’s current price therefore embeds a real bet that Palmetto is closer to a
              scaled platform than to a cleverly packaged project-finance intermediary.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Bull, base, and bear ranges plus entry discipline
        blocks:
          - type: paragraph
            body: >-
              A scenario-based view is the only defensible public valuation approach. The bull case assumes ARR
              continues scaling, ABS access remains open, partner quality holds, and Palmetto proves that its software
              layer actually reduces soft costs and servicing burden. The base case assumes the company remains real and
              financeable but does not earn a top-tier software multiple because evidence quality remains mixed and the
              business still behaves like a capital-intensive platform. The bear case assumes slower growth, policy or
              funding friction, or a market reassessment that values Palmetto more like a stressed residential-energy
              operator than like a differentiated software company. On that basis, a disciplined investor should prefer
              entry through protective structures, secondary opportunities, or pricing below the current unicorn
              narrative rather than paying up for narrative alone.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: table
            tableRef: TV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV003
              - CV017
              - CV018
              - CV019
              - CV023
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.4'
        title: Comparable references and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The comparable set is imperfect, which itself is revealing. Sunrun is the most relevant public operating
              comp because it shares TPO exposure, capital intensity, and large-scale residential energy operations; yet
              even at far greater scale it is valued in the low single-digit billions publicly. Tesla is a useful brand
              and storage adjacency reference, but it is far too broad and profitable elsewhere to anchor Palmetto
              directly. Distressed names like SunPower and Sunnova are not valuation comps so much as downside
              references showing that customer count does not immunize the model. Private databases place Palmetto above
              the $1 billion threshold, but those marks are stale snapshots rather than a live market-clearing price.
              Exit readiness is therefore incomplete: Palmetto has enough narrative and institutional backing to matter,
              but not enough public earnings quality to treat an IPO-style valuation as near-term validated.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
            tableRef: TV004
            claimRefs:
              - CV004
              - CV005
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV005
            claimRefs:
              - CV021
              - CV022
              - CV031
              - CV036
              - CV038
      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The missing diligence is unusually concrete. Investors need audited financials, warehouse and ABS
              performance packs, customer default and transfer cohorts, partner concentration, software-usage data, and
              a clean bridge from ARR to free cash generation. If those data prove that Palmetto’s software and
              servicing layers create durable operating leverage, the company could justify or exceed its last known
              mark. If they show thin margins, unstable partner quality, or weakening funding terms, the downside could
              be severe because the public mark already assumes success. The recommendation is thus a conditional one:
              high strategic interest, medium confidence, and a valuation stance that is only constructive below or with
              protections against a capital-market or servicing surprise.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV037
              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a price-sensitive yes, not a narrative yes
            body: >-
              Palmetto merits serious diligence, but the current public record does not support paying a large premium
              just because it sounds like climate SaaS.
            calloutType: insight
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV040
          - type: callout
            title: The current mark already assumes meaningful success
            body: >-
              At roughly a $1B-plus valuation on reported $75M ARR, the downside from evidence or multiple compression
              is still material.
            calloutType: risk
            claimRefs:
              - CV003
              - CV018
              - CV021
              - CV022
          - type: callout
            title: The company has real optionality if economics prove out
            body: >-
              If private diligence validates strong contract performance, software leverage, and resilient funding
              access, Palmetto could justify or exceed its last reported mark.
            calloutType: strength
            claimRefs:
              - CV009
              - CV017
              - CV024
              - CV039
