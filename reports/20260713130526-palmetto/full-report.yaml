              Palmetto’s differentiation case rests on integration. It can connect customer acquisition, household
              modeling, proposal generation, financing choices, contractor management, and post-install service in a way
              that point-solution competitors usually cannot. The Exelon partnership and the enterprise-platform release
              both suggest that Palmetto’s software can be embedded in third-party channels, not just used internally.
