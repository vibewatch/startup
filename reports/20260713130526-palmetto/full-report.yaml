      - number: '3.3'
        title: Capabilities, packaging, and route-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s strongest differentiation case is bundling. Its public materials show one stack spanning
              marketplace acquisition, LightReach financing, enterprise quote-generation tools, Energy Intelligence
              modeling, and partner workflows. Sunrun’s offer is also broad, especially on solar-plus-storage, but it is
              optimized around the scale benefits of an incumbent subscription platform. Tesla’s energy pages emphasize
              hardware-led backup and storage positioning. EnergySage competes by making price discovery and installer
              comparison easier rather than owning fulfillment. Dividend Finance and GoodLeap compete by enabling
              installers with financing but without owning a full consumer platform. From a pricing and packaging
              standpoint, the key issue is not list price transparency — most players price through quotes and
              individualized financing — but which company controls the highest-friction steps in the purchase path.
              Palmetto’s enterprise tools matter here because they can reduce installer soft costs and speed quote
              turnarounds, giving Palmetto a different kind of advantage than a household brand alone.
