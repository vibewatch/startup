              - CR030
              - CR031
              - CR032
              - CR033
              - CR039
      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The good news is that most of Palmetto’s key risks are monitorable. Investors can track policy deadlines,
              securitization frequency, customer default behavior, complaint rates, partner concentration, service
              response times, and enterprise-channel expansion. Palmetto has already built some mitigation scaffolding
              through legal disclosures, security controls, contractor-licensing transparency, customer-support
              processes, and repeat capital-market access. But the thesis breaks quickly if Palmetto loses financing
              flexibility, if partner quality deteriorates, if customer-friction terms begin driving higher disputes or
              defaults, or if policy changes narrow the economics of third-party ownership faster than the company can
              adapt. The overall risk view is therefore elevated but not fatal: Palmetto looks like a business that can
              be investable only if diligence proves strong operational discipline beneath the surface growth story.
            claimRefs:
              - CR036
              - CR037
