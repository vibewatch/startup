      - number: '4.3'
        title: Capital adequacy, project finance, and obligations
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the most visible part of Palmetto’s financial picture. The company announced more
              than $1.2 billion of LightReach financing in January 2025, then accessed the securitization market twice
              in 2025 through a $286 million ABS and a later $420 million ABS, for total ABS issuance above $716
              million. That sequence tells investors two useful things. First, Palmetto has found institutional appetite
              for long-duration residential solar contracts. Second, the business is capital-intensive enough that
              repeat structured finance is not optional; it is a core operating dependency. Public sources do not
              disclose unrestricted cash, monthly burn, debt-service coverage, warehouse draw profile, or residual risk
              retained by Palmetto after securitization. Sunrun’s public filings and results are relevant here as a
              category proxy because they show how much asset-level debt, tax equity, and balance-sheet management
              matter in residential solar. Palmetto’s financial health therefore cannot be judged from ARR alone; it has
              to be judged from the resilience and cost of its capital stack.
