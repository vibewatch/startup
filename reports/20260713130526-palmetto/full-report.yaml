      - number: '3.4'
        title: Switching costs, partner access, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in residential clean energy is mixed rather than absolute. Before a homeowner signs
              a contract, switching costs are low because consumers can compare installers, financing options, and
              product types across multiple channels. That makes marketplaces and financing alternatives real threats.
              After installation, switching costs rise because long-term service contracts, monitoring, maintenance, and
              battery or rate-plan optimization create relationship stickiness. Palmetto’s 600-plus installer and
              enterprise partner network is useful because partner density can improve local reach without the
              fixed-cost burden of a wholly owned installation labor force. But that same partner model creates
              quality-control exposure and leaves room for lenders or marketplaces to work with many of the same
              installers. The best evidence for moat is therefore combinational rather than singular: Palmetto has some
              brand, some financing advantage, some software leverage, and some partner reach, but none of those alone
              looks unassailable against a larger incumbent like Sunrun or a lower-friction marketplace path like
              EnergySage. The company’s moat is real only if the stack works better together than rival point solutions
              do apart.
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
