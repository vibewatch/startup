    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating model
        blocks:
          - type: paragraph
            body: >-
              Palmetto presents itself less as a commodity installer and more as a software-led clean-energy platform.
              Official company language describes Palmetto as a software company enabling consumer adoption of climate
              technology products and services, while the public product catalog shows a broader operating model that
              spans solar acquisition, financing, system monitoring, home-electrification products, and enterprise APIs.
              That distinction matters because the underwriting case is not just about the margin profile of residential
              solar installations; it is about whether Palmetto can own customer acquisition, financing, data, and
              long-term energy management in one stack. The company says its mission is to accelerate the transition to
              a clean energy future, and its marketplace shows that Palmetto is already extending beyond rooftop solar
              into batteries, HVAC, EV charging, utility-rate guidance, and rewards. The strongest current identity
              signal is therefore platform breadth: Palmetto is trying to be both the consumer front door and the
              operating layer behind distributed home-energy adoption.
