  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Palmetto’s customer base is best segmented by workflow, not just by revenue. The obvious end buyer is the
              homeowner choosing solar, HVAC, battery-adjacent products, or a LightReach plan. But the company also
              sells to installer partners that want financing, software, fulfillment, and brand leverage; to enterprise
              or utility channels that embed Palmetto APIs or marketplace experiences; and to existing account holders
              who can be expanded through rewards, referrals, rate plans, and service subscriptions. That matters
              because Palmetto’s go-to-market is not a single linear funnel. It is a hub-and-spoke system where partner
              channels feed homeowner demand, homeowner accounts feed expansion products, and public enterprise
              integrations create new top-of-funnel customer acquisition surfaces. Investors should therefore read
              customer quality through both acquisition diversity and post-sale relationship depth.
