- id: capital-formation-and-scale
  title: Funding history, scale signals, and valuation context
  body: 'Palmetto’s capital profile has changed materially since its earlier venture rounds. Company and press coverage support a January 2025 debt-financing announcement of more than $1.2 billion tied to LightReach, while later reporting shows the company tapping asset-backed securitization markets as well. The best-supported public scale metrics cluster around LightReach: Palmetto said the product was launched toward the end of 2023, had already surpassed 20,000 adopting households by January 2025, and was pacing toward roughly 300 households per day in more than 30 states through a network of over 600 small and midsize partners. Database sources also point to unicorn status and continued revenue growth, with GetLatka citing ARR growth from $30 million in late 2023 to $75 million in September 2025. The open question is not whether Palmetto has reached real scale; it clearly has. The unresolved issue is reconciliation: public databases disagree on total funding and headcount, and none of
    the public sources provide an audited bridge from venture rounds to debt facilities, securitizations, and any follow-on primary or secondary capital.'
  claimRefs:
