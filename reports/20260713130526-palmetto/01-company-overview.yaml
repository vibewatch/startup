  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, preference stack, secondary transactions, and ownership by investor cohort after debt financings and ABS issuance.
    whyItMatters: Public round announcements establish scale but not who controls downside protection, dilution, or board rights.
    diligencePath: Request the live cap table, major financing documents, and a schedule distinguishing equity, warehouse debt, and ABS obligations.
    relatedQuestionRefs:
    - QO023
    - QO024
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited GAAP revenue, gross margin, EBITDA, cash, and debt for 2024 and 2025.
    whyItMatters: ARR snapshots and financing headlines are not enough to underwrite unit economics or solvency.
    diligencePath: Obtain audited annual financial statements plus monthly management reporting tied to LightReach and enterprise products.
    relatedQuestionRefs:
    - QO014
    - QO023
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current employee count and reconciliation across legal entities and geographies.
    whyItMatters: Public databases materially disagree on headcount, limiting confidence in operating-scale and productivity comparisons.
    diligencePath: Ask management for an HRIS export or board-level headcount rollforward by month and function.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: founder-liquidity
