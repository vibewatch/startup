chapter:
  number: 1
  title: Company Overview
  summary: Palmetto is a Charlotte-based private clean-energy platform that shifted from residential solar installer roots into a software, financing, and marketplace model centered on LightReach and energy-data products. The company has reached unicorn valuation territory and large-scale capital access, but public disclosures still leave meaningful gaps around current ownership, audited revenue quality, and the exact composition of its capital stack.
sections:
- id: identity-mission-and-platform
  title: Identity, mission, and operating model
  body: 'Palmetto presents itself less as a commodity installer and more as a software-led clean-energy platform. Official company language describes Palmetto as a software company enabling consumer adoption of climate technology products and services, while the public product catalog shows a broader operating model that spans solar acquisition, financing, system monitoring, home-electrification products, and enterprise APIs. That distinction matters because the underwriting case is not just about the margin profile of residential solar installations; it is about whether Palmetto can own customer acquisition, financing, data, and long-term energy management in one stack. The company says its mission is to accelerate the transition to a clean energy future, and its marketplace shows that Palmetto is already extending beyond rooftop solar into batteries, HVAC, EV charging, utility-rate guidance, and rewards. The strongest current identity signal is therefore platform breadth: Palmetto is trying
    to be both the consumer front door and the operating layer behind distributed home-energy adoption.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
