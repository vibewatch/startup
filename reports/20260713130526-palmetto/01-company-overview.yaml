- id: founder-leadership-and-governance
  title: Founder, leadership, and governance
  body: Founder concentration is high and should be treated as a persistent diligence fact for later chapters. Chris Kemper remains founder, chief executive officer, and chairman, making him the company’s core strategic, financing, and public-facing node. Third-party profiles and CNBC reporting show a founder whose background mixes UN clean-energy policy work, carbon-finance market experience, and later private-company scale building. Official leadership materials confirm a board that includes Chris Dawson, Paul A. Camuti, Philip K. Ryan, Steven Mandel, Chamath Palihapitiya, and Will Szczerbiak, while Palmetto separately lists Jigar Shah as an independent advisor. CNBC adds an advisory layer that includes Larry Summers, Neil Chatterjee, Nirav Tolia, and Monica Williams, which suggests Palmetto is deliberately surrounding Kemper with capital-markets, policy, and consumer-network experience. The offset to that breadth is that public disclosure around ownership percentages, committee structure,
    and formal governance rights remains limited, so the leadership bench looks broader than the control picture currently available to outside investors.
