- id: milestones-and-organizational-evolution
  title: Milestones, expansion, and strategic evolution
  body: 'The milestone record shows Palmetto evolving from a residential-solar company into a broader distributed-energy platform with financing and media ambitions. Public evidence ties the current narrative to a 2010 founding, a 2022 Series C step-up into unicorn territory, the late-2023 rollout of LightReach, the 2024-2025 scaling of structured capital, and a 2025 acquisition of The Cool Down to add consumer education and top-of-funnel reach. Organizational milestones reinforce the same arc. Business North Carolina says Palmetto moved its headquarters from Charleston to Charlotte in 2023, and later Charlotte-focused reporting says the company expanded its South End office from 7,000 to 16,000 square feet while planning as many as 100 additional jobs. The company’s 2025 appointments of Hilary Lerner and Shane Battier also suggest management believes culture, talent retention, and brand trust are now strategic inputs rather than support functions. A final contextual milestone is the sector
    backdrop: Palmetto’s rise coincided with a period when major residential-solar peers were restructuring or entering bankruptcy, which makes its access to debt and securitization markets more noteworthy but also a reminder that market structure, not just company execution, will shape the next phase.'
