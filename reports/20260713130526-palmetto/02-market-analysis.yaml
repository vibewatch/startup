- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver or constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Rising household energy burden
    - positive
    - current to long-term
    - Supports value proposition for lower monthly energy spend
    - Quantify savings by state and utility cohort
  - - TPO structure with $0-down appeal
    - positive
    - current
    - Expands buyer pool versus ownership-only offers
    - Measure close-rate uplift of TPO versus loan offers
  - - Residential market contraction in 2024-2025
    - negative
    - current
    - Reduces near-term volume and increases competition for viable projects
    - Stress-test installation and marketing assumptions
  - - Section 25D expiration
    - mixed
    - 2025-2026
    - Hurts owned-solar economics but may favor TPO pathways
    - Model state-by-state mix shift after expiration
  - - Section 48/48E and safe-harbor rules
    - positive but conditional
    - 2025-2028
    - Can preserve TPO credit eligibility if deadlines are met
    - Audit construction-start and placed-in-service timing controls
  - - Interest rates and customer uncertainty
    - negative
    - current
    - Dampen homeowner conversion and loan economics
    - Assess whether TPO is materially less rate-sensitive
  - - Tariffs, FEOC, and supply-chain uncertainty
    - negative
    - current to medium-term
    - Can raise equipment cost and delay financing decisions
    - Track sourcing exposure and contract pass-throughs
  - - Interconnection and labor constraints
    - negative
    - medium-term
    - Limit throughput even when demand is present
    - Benchmark cycle times by state and installer
  notes: The biggest market lesson is that demand alone is insufficient; policy timing and capital formation determine which residential-solar products remain financeable and saleable.
