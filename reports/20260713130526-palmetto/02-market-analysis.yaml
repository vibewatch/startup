  title: Market definition table
  columns:
  - segment or category
  - included spend
  - excluded spend
  - buyer or payer
  - relevance to Palmetto
  rows:
  - - Residential rooftop solar TPO
    - Lease or PPA payments, customer acquisition, installation management, servicing
    - Utility-scale solar and community solar subscriptions
    - Homeowner monthly payer; tax-equity owner behind scenes
    - Core current Palmetto market via LightReach
  - - Residential solar ownership
    - Cash and loan-financed home solar systems
    - Commercial rooftop and utility-scale procurement
    - Homeowner purchaser or borrower
    - Important substitute, but less aligned to Palmetto’s TPO thesis
  - - Residential battery and backup
    - Battery hardware, installation, monitoring, resilience value
    - Front-of-meter storage projects
    - Homeowner and financing provider
    - Adjacency that improves attachment and savings story
  - - Home electrification upgrades
    - HVAC, EV charging, efficiency, rate optimization
    - Non-energy remodeling spend
    - Homeowner budget owner
    - Raises wallet share and customer lifetime value
  - - Enterprise energy software
    - Lead scoring, design, modeling, and partner APIs
    - Unrelated utility software or industrial EMS
    - Installers, developers, energy partners
    - Supports partner productivity and non-consumer revenue options
  notes: The market boundary is defined around distributed residential clean-energy decisions and the software or financing layers that influence them, not the entire power sector.
