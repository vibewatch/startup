callouts:
- calloutType: strength
  title: TPO can widen the buyer pool
  body: Lease and PPA structures remove the largest upfront hurdle for many households, which is why TPO share matters more to Palmetto than generic residential-solar growth alone.
  claimRefs:
  - CM020
  - CM021
  - CM022
- calloutType: risk
  title: Policy timing now matters almost as much as demand
  body: The residential market can remain attractive in the long run while still contracting sharply in the near term if tax-credit rules, tariffs, or safe-harbor timing move against installers and financiers.
  claimRefs:
  - CM012
  - CM014
  - CM031
  - CM032
  - CM033
- calloutType: insight
  title: Palmetto sells workflow simplification, not just hardware
  body: The market opportunity is strongest where data, quote generation, financing, and servicing reduce homeowner friction and installer soft costs at the same time.
