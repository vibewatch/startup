- id: buyer-segments-and-adoption-path
  title: Buyer segments, budget ownership, and adoption path
  body: 'The buyer and payer map is a core part of market structure because Palmetto is selling a financial decision as much as an energy product. In a typical LightReach-style transaction, the homeowner is the user and monthly bill payer, the installer network is the physical fulfillment channel, and the tax-credit owner is the third-party system owner or financing vehicle. EnergySage’s lease-versus-PPA explanation helps clarify why TPO has become strategically important: leases and PPAs usually require little or no money down, shift maintenance to the provider, and convert a high-upfront purchase into a recurring utility-style payment. That structure expands the addressable buyer pool to households that want savings or bill stability without absorbing hardware ownership risk. Palmetto’s enterprise solutions broaden the segment map further. Its Energy Intelligence materials position developers, partners, and quote-generation teams as additional buyers of software or API functionality. The
    result is a layered market in which consumer adoption, installer productivity, and capital-provider appetite all need to line up for volume to scale.'
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
