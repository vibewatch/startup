  evidenceGaps:
  - type: missing-source
    severity: material
    topic: precise-dollar-tam
    missingEvidence: A defensible public dollar TAM specific to residential TPO plus software-enabled electrification services.
    whyItMatters: Public sources support multiple market lenses but not one clean TAM for Palmetto’s exact bundle, which makes top-down valuation comps noisy.
    diligencePath: Build a state-by-state model combining eligible housing stock, electric-rate bands, TPO economics, and partner footprint rather than relying on generic solar TAM figures.
    relatedQuestionRefs:
    - QM010
    - QM025
  - type: private-evidence-only
    severity: material
    topic: palmetto-serviceable-market
    missingEvidence: Internal data on quote volume, approval rate, partner coverage, and state-by-state conversion constraints.
    whyItMatters: Palmetto’s real SAM depends on financing eligibility, partner capacity, and utility-specific economics, not national solar demand alone.
    diligencePath: Request funnel metrics by state, partner, and product type plus rejection reasons for declined households.
    relatedQuestionRefs:
    - QM009
    - QM025
  - type: conflicting-data
    severity: minor
    topic: forecast-variance
    missingEvidence: A reconciled management view on how the company models 2026-2028 under conflicting pre- and post-OBBBA market forecasts.
    whyItMatters: Public reports changed meaningfully once policy shifted, so any base case should be tied to a specific policy assumption set.
    diligencePath: Ask management for scenario planning that isolates rates, tax-credit timing, and equipment-cost sensitivity.
    relatedQuestionRefs:
    - QM008
    - QM024
