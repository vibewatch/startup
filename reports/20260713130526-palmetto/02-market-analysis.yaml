chapter:
  number: 2
  title: Market Analysis
  summary: Palmetto operates in the U.S. residential distributed-energy market, with its best fit at the intersection of rooftop solar, third-party ownership financing, and software-guided home electrification. The market remains large and policy-relevant, but near-term adoption is heavily shaped by financing costs, tax-credit structure, state-level rules, and the ability of TPO providers to lower friction for homeowners.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: Palmetto’s addressable market is narrower than the entire energy-transition economy but broader than residential solar installation alone. The most useful boundary is the U.S. distributed residential clean-energy spend associated with rooftop solar, batteries, home-energy upgrades, financing, and the software layer that turns those products into a lower-friction household decision. Official Palmetto materials reinforce that boundary because they market solar, battery, utility-rate guidance, financing, and monitoring together, while enterprise materials show partner-facing APIs for quoting, energy modeling, and lead conversion. The closest substitutes are not just other solar installers. They include homeowner inaction, utility supply, cash purchases, solar loans, and alternative lenders or marketplaces that let homeowners compare options without committing to one vertically integrated platform. That framing matters because Palmetto wins only if it can simplify both the economic decision
    and the operational workflow better than stand-alone installers, loan marketplaces, or direct-to-consumer hardware brands.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
  figureRefs: []
- id: market-size-and-trajectory
  title: Sizing lenses and current market trajectory
  body: 'The current market picture is best understood through multiple lenses instead of one headline TAM. First, the U.S. solar sector remains structurally important: SEIA said solar accounted for 64% of all new electricity-generating capacity added to the grid through Q3 2024, while the U.S. solar fleet already produced enough electricity to power more than 37 million homes. Second, the residential segment is real but cyclical. SEIA’s Q4 2024 report said residential installations fell sharply in 2024, with Q3 residential volume down 39% year over year and full-year capacity expected to contract 26%. The 2025 year-in-review later showed the segment installed 4,647 MWdc, down another 2% year over year. Third, the forward outlook depends on which policy window is used: SEIA’s late-2024 outlook expected 2025 recovery on lower rates and rising TPO share, while the 2025 review, written after the OBBBA, expects a 2026 contraction before later stabilization. For Palmetto, the implication is that
    a large market exists, but the investable timing is highly policy-sensitive and must be sized with scenario ranges rather than a single line item.'
  claimRefs:
