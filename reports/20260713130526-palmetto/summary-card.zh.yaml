summary:
  headline: |
    Palmetto 是一家值得战略关注的私人住宅清洁能源平台，规模、反复融资能力和产品宽度都站得住；但公开证据在利润率、 资产组合表现和资本依赖上仍有缺口，因此更合适的结论是继续研究，并把估值纪律卡严，而不是无条件买入。
