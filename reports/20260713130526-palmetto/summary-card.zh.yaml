  topStrengths:
    - 客户和渠道足迹扎实：LightReach 覆盖 20,000+ 户家庭，合作伙伴 600+ 家，2025 年据称服务近 72,000 个家庭
    - 通过超过 $1.2B 的融资组合，以及 2025 年两笔合计超过 $716M 的 ABS 交易，证明资本市场能反复打开
    - 产品和平台叙事很宽，覆盖消费者能源方案、市场型产品、Energy Intelligence、合作伙伴软件和长期服务
    - 所在住宅能源品类空间大、渗透率低，TPO 结构关注度上升，市场相关性强
    - Social Capital、TPG Rise Climate、Morgan Stanley、Truist 等战略和金融交易对手释放出机构背书信号
    - 如果 Palmetto 平台能持续压低软成本和服务负担，软件与渠道杠杆有机会跑出来
  topRisks:
    - 公开证据没有披露毛利率、现金生成、违约曲线、资产组合表现或不受限流动性
    - 业务仍高度依赖资本市场、ABS 执行、合作伙伴质量和政策稳定性
    - 转让、违约、账单和长期服务义务中的客户摩擦条款，可能演化成声誉风险或服务风险
    - SunPower、Sunnova 等住宅太阳能同行已经说明，规模不能消除这个品类的下行风险
    - 公开客户证据更能证明渠道宽度，而不是房主长期结果和留存质量
    - 当前独角兽式价格锚可能已经把尚未公开验证的执行成功计入了估值
  unresolvedGaps:
    - 经审计财务报表、收入确认细节和毛利率透明度尚未公开
    - 按 cohort 拆分的合约资产表现尚未公开，包括违约、转让、争议和服务成本
    - 头部合作伙伴、头部州市场和头部企业客户集中度尚未公开披露
    - 软件使用量、企业端变现和模块级采用率尚未公开量化
    - 近期二级市场或内部轮定价背景不公开，数据库中的估值标记可能已经过期
    - NRR、GRR、流失率、投诉率、服务响应时间等公开留存指标仍不可得
