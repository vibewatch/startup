company:
  name: Palmetto
chapter:
  number: 6
  title: Customers
  summary: 'Palmetto serves multiple customer layers at once: homeowners, installer partners, enterprise or utility channels, and a growing base of existing-account holders who can be expanded into monitoring, rewards, rate plans, and additional home-energy products. Public evidence shows meaningful adoption and partner reach, but durability metrics such as churn, renewal, and concentration remain materially under-disclosed.'
sections:
- id: segments-and-buyers
  title: Customer segments and buying surfaces
  body: Palmetto’s customer base is best segmented by workflow, not just by revenue. The obvious end buyer is the homeowner choosing solar, HVAC, battery-adjacent products, or a LightReach plan. But the company also sells to installer partners that want financing, software, fulfillment, and brand leverage; to enterprise or utility channels that embed Palmetto APIs or marketplace experiences; and to existing account holders who can be expanded through rewards, referrals, rate plans, and service subscriptions. That matters because Palmetto’s go-to-market is not a single linear funnel. It is a hub-and-spoke system where partner channels feed homeowner demand, homeowner accounts feed expansion products, and public enterprise integrations create new top-of-funnel customer acquisition surfaces. Investors should therefore read customer quality through both acquisition diversity and post-sale relationship depth.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  - FU002
- id: adoption-trajectory-and-proof
  title: Adoption trajectory and named customer proof
  body: 'Public evidence supports real customer traction even though the metrics come from different products and time slices. In January 2025 Palmetto said LightReach had been adopted by more than 20,000 households and was adding roughly 300 households per day across 30 states. The 2025 impact report later cited 71,927 systems installed in the year, nearly 72,000 families served across 30 states and Puerto Rico, and 500 EPC partners. Those metrics are not directly comparable to the LightReach figures, but together they imply a business with meaningful residential volume and a large operational network. Named proof points also extend beyond individual households: Exelon used Palmetto’s solar API, Quinn Residences deployed Palmetto in a build-to-rent community, and partner-program materials show Palmetto targeting installer businesses as repeat channel customers. The evidence is strongest on breadth of adoption and weakest on net retention economics. The chapter intentionally separates household
    counts, installed systems, and partner metrics because they describe different layers of the business and should not be naively summed. This is enough to establish real demand, but not enough to establish cohort durability or account-quality uniformity.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
