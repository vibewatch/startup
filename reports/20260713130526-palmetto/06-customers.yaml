- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Cross-sell from solar into HVAC, monitoring, rate plans, and marketplace
    - Top-geography and top-partner concentration unknown
    - Could raise LTV if real, but execution may be uneven
    - Request attach rates and revenue by product and state
  - - Referral and rewards loops
    - Actual referral conversion unknown
    - May reduce CAC or may be mostly engagement theater
    - Request referred-lead volume and close rates
  - - Installer channel programs
    - Dependence on partner quality and cash flow
    - Partner failure can damage customer experience and install volume
    - Request top-20 partner share and churn
  - - Enterprise and utility channels
    - Potential revenue concentration in a few large accounts
    - Loss of a large channel could slow growth quickly
    - Request top-account revenue share and contract terms
  - - Long-duration customer contracts
    - Default, transfer, or cancellation friction
    - Could hurt reputation or asset performance if mishandled
    - Request cohort-level defaults, transfers, and disputes
  notes: Expansion logic is credible, but the concentration picture remains largely undisclosed.
