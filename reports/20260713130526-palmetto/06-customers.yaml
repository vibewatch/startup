  - TU002
  - TU003
  figureRefs:
  - FU003
- id: durability-satisfaction-and-repeat-behavior
  title: Durability, satisfaction, and repeat behavior
  body: Durability is visible mostly through contract structure and customer-engagement programs, not through classic SaaS retention metrics. LightReach plans and solar-ownership comparisons reference 20- to 25-year terms, HVAC subscriptions reference 10- or 12-year terms, and Palmetto Protect plus monitoring create an ongoing service relationship. Rewards, perks, referrals, and marketplace offers are all designed to keep account holders active after installation rather than treating the sale as finished. Public signals of satisfaction include more than 1,000 Google reviews and a 4-plus-star rating on Palmetto’s product page, plus customer-experience positioning in the Recheck partnership. Still, Palmetto does not publish NRR, GRR, renewal rates, cancellations, complaint rates, or cohort attrition, so the public record supports long-duration relationships by design but not proven retention by outcome. That gap is especially important because project-finance businesses can look sticky contractually
    while still generating service burden, complaints, or weak voluntary advocacy.
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration-risk
  title: Expansion loops and concentration risk
  body: 'Palmetto’s expansion case is intuitive: a homeowner can begin with a solar quote, convert into a subscription or purchase, then add monitoring, rate plans, HVAC, marketplace products, and referrals; a partner can start with one tool and deepen into financing, fulfillment, and brand programs. But the concentration and dependency risks are still real. Palmetto relies heavily on partner channels and installation networks, and public materials do not quantify the contribution of top partners, top geographies, or top enterprise accounts. Even customer-proof sources are skewed toward partner and enterprise anecdotes rather than named homeowner outcomes with quantified savings. The result is a customer base that looks broad and expandable, but whose retention durability and concentration profile still require internal diligence materials. In other words, breadth of logos and programs is evident, but depth of relationship economics is still mostly private. That makes internal cohort and
    channel analytics unusually important for investment judgment.'
  claimRefs:
