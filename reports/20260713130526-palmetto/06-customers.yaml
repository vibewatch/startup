  rows:
  - - Homeowners
    - Buyer and user; payer depends on product
    - Solar, subscription energy, HVAC, rate plans, service
    - 20k+ LightReach households; 71,927 systems installed in 2025
    - Core origination and long-term account base
    - No cohort retention or segment mix
  - - Existing account holders
    - User and recurring relationship holder
    - Monitoring, support, app, rewards, referrals, add-on upgrades
    - App, monitoring, referral, and rewards surfaces are all active
    - Expansion and retention economics opportunity
    - No MAU, engagement, or attach-rate data
  - - Installer partners / EPCs
    - Channel partner, seller, fulfiller
    - Sales, financing, fulfillment, and operational tooling
    - 600+ partners in Jan 2025; 500 EPC partners in impact report
    - Critical distribution and execution network
    - No partner concentration or churn disclosure
  - - Enterprise / utility channels
    - Channel partner / customer
    - Embedded APIs, white-label clean-energy offers, market education
    - Exelon, Enerflo, Energy Trust, and ComEd cited in PRs
    - Can create low-CAC acquisition and B2B revenue
    - No contract value or expansion disclosure
  - - Build-to-rent / community developers
    - Institutional buyer and user ecosystem
    - Community-scale solar deployment and resident energy value
    - Quinn Residences proof point
    - Potential new vertical and volume source
    - Only one named example in current record
  notes: Palmetto’s customer map mixes B2C, B2B2C, and partner-led distribution rather than a single direct-sales model.
