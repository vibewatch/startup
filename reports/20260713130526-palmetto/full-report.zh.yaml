companyProfile:
  summary: |
    Palmetto 是一家总部位于 Charlotte 的住宅清洁能源平台，围绕消费者能源产品、合作伙伴工具、
    融资和长期资产管理搭建。公司称自己是用软件推动消费者采用气候技术产品和服务的公司，但
    实际运营范围更宽：Palmetto 同时做屋主市场平台、LightReach / Energy Plan 订阅式产品、
    企业和 API 型 Energy Intelligence 工具、安装商与渠道合作，以及持续监控和支持。公开证据
    支持真实客户规模、反复进入资本市场，以及向 HVAC、费率方案、奖励和家庭能源工作流扩展。
    眼下最大的公开疑点不是市场贴合度或野心，而是经济性、集中度和资产组合表现的证据质量。
  foundedDate: '2010-02-01'
  founders:
    - name: Chris Kemper
      role: 创始人、CEO 兼董事长
      background: |
        创立 Palmetto 之前，Kemper 曾在 UN ESCAP 从事碳金融和清洁能源工作，随后在 Tradition Financial Services 从事清洁能源和环境市场业务。
      claimRefs:
