      - number: '3.4'
        title: 切换成本、伙伴触达与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              住宅清洁能源的竞争耐久性是混合的，不是绝对的。屋主签约之前，切换成本低，因为消费者可以跨多个渠道比较安装商、融资选项和
              产品类型。这让市场平台和融资替代品成为真实威胁。安装之后，长期服务合同、监控、维护以及电池或费率方案优化会提高切换 成本，形成关系粘性。Palmetto 拥有 600
              多家安装商和企业合作伙伴网络，这有价值，因为伙伴密度能提升本地触达，而不必背上 全自有安装劳动力的固定成本。但同一伙伴模式也带来质量控制暴露，并给贷款方或市场平台留出与许多相同安装商合作的空间。
              因此，护城河最好的证据不是单点，而是组合：Palmetto 有一些品牌、一点融资优势、一层软件杠杆和一定伙伴触达，但其中任何一个 单独拿出来，都不像能抵住 Sunrun 这样的更大在位者，或 EnergySage
              这类低摩擦市场平台路径。只有这套栈合在一起比对手 点状方案拆开来更好用，公司的护城河才真正成立。
