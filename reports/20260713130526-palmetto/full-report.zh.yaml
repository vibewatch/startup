      - number: '2.2'
        title: 市场规模视角与当前走势
        blocks:
          - type: paragraph
            body: >-
              当前市场图景最好用多重视角理解，而不是只看一个头部 TAM 数字。第一，美国太阳能行业仍有结构性重要性：SEIA 称， 截至 2024 年 Q3，太阳能占新增并网发电容量的 64%，美国太阳能装机已经产生足以供电
              3,700 多万户家庭的电力。第二， 住宅板块真实存在但带有周期性。SEIA 的 2024 年 Q4 报告称，住宅安装在 2024 年大幅下滑，Q3 住宅装机量同比下降 39%， 全年容量预计收缩 26%。之后的
              2025 年回顾显示，该板块安装 4,647 MWdc，同比又降 2%。第三，前瞻取决于采用哪一个 政策窗口：SEIA 2024 年末展望曾预计 2025 年会受较低利率和 TPO 份额上升带动复苏；而
              OBBBA 之后写成的 2025 年回顾 则预计 2026 年先收缩，之后再企稳。对 Palmetto 来说，含义是市场确实很大，但可投资时点高度受政策影响，必须用情景 区间测算，而不是一个单线条数字。
