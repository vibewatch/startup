            body: >-
              Sunrun 是最清晰的标尺，因为它验证了订阅式住宅太阳能的吸引力，也暴露 Palmetto 在规模上还有多远。公开 2024 年业绩 显示，Sunrun 年末拥有 1,048,842 名客户、7.5 GW
              联网太阳能容量、62% 储能附加率，以及 $518.5M 的第四季度收入。它面向 客户的页面也强调 Palmetto 正在追求的同一套商业模式逻辑：可预测月付、电池附加、监控和长期服务。关键对比在于，Sunrun
              同时拥有品类领导地位、更大的安装基盘和更长的资本市场历史。与此同时，曾经的同行集合已经变弱。SunPower 在 2024 年申请 Chapter 11；Sunnova 自己的网站现在也称，其资产已通过法院监督的
              Chapter 11 出售流程转移，公司停止独立运营。行业后果是， Palmetto 竞争的品类奖池很大，但资本不足或执行失误玩家的失败率也清晰可见。
