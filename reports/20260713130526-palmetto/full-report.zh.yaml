    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Palmetto 并不把自己包装成普通安装商，而是软件驱动的清洁能源平台。公司官方表述称，Palmetto 用软件推动消费者采用气候技术产品和服务；公开产品目录显示，它的运营模式更宽，覆盖太阳能获客、
              融资、系统监控、家庭电气化产品和企业 API。这个差别很关键：投资判断不只是看住宅太阳能安装的 利润率，而是看 Palmetto 能否把客户获取、融资、数据和长期能源管理放进同一套系统。公司称使命是
              加速迈向清洁能源未来；它的市场平台也显示，Palmetto 已经从屋顶太阳能延伸到电池、HVAC、EV 充电、公用事业费率指导和奖励。因此，当前最强的身份信号是平台宽度：Palmetto 想同时成为消费者入口，
              也成为分布式家庭能源采用背后的运营层。
