      - number: '5.4'
        title: 差异化、路线图与信任边界
        blocks:
          - type: paragraph
            body: >-
              Palmetto 的差异化论点建立在整合上。它可以把客户获取、家庭建模、方案生成、融资选择、承包商管理和安装后服务连接起来，而点状方案竞争者通常做不到。 Exelon 合作和企业平台发布都显示，Palmetto
              的软件可以嵌入第三方渠道，而不只是内部使用。公开路线图也显示，公司稳步从太阳能扩展到更宽的家庭能源品类， 包括
              HVAC、公用事业费率方案和订阅式产品。不过，几项信任和成熟度限制仍然可见。有些企业页面仍含占位文案，公开准确性基准稀少，法律披露强调取消费用、
              转让规则、所有权保留和付款违约救济，这些都可能让客户体验更复杂。产品真实且宽；悬而未决的是，软件层能否稳定地把摩擦降到足以在规模化时形成耐久优势。 换句话说，宽度可见，但可重复的产品卓越尚未在公开证据中完全成立。
