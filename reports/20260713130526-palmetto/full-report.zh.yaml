      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方和付款方图谱是市场结构的核心，因为 Palmetto 卖的是金融决策，也是在卖能源产品。在典型 LightReach 式交易中，
              屋主是用户和月度账单付款方，安装商网络是实体交付渠道，税收抵免所有者是第三方系统所有者或融资载体。EnergySage 对 租赁和 PPA 的解释有助于说明 TPO 为何具备战略重要性：租赁和 PPA
              通常几乎不需要首付，把维护责任转给提供方，并把高额 前期购买转换成类似公用事业账单的经常性付款。这个结构把可服务买方扩大到那些想节省开支或稳定账单、但不愿承担硬件所有权 风险的家庭。Palmetto
              的企业解决方案进一步拓宽了分层图谱。Energy Intelligence 材料把开发者、合作伙伴和报价生成团队 定位成软件或 API
              功能的额外买方。结果就是一个分层市场：消费者采用、安装商效率和资本提供方胃口都必须对齐，规模才能上去。
