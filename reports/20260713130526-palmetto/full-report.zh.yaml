            body: >-
              公开材料里的核心技术差异化是 Energy Intelligence。Palmetto 称该 API 可以用小时级粒度为任何美国家庭的能源足迹建模，拆到终端用途， 并模拟 60
              多种升级情景。公司把这归因于建筑科学专长、地理空间分析、机器学习、基于物理的仿真，以及一种推断数十项建筑特征的数字孪生方法。 围绕这个建模引擎，Palmetto 似乎搭起了销售和运营应用：Instant
              Design 用于可生成方案级系统布局，Multi-Product Quotes 用于捆绑升级场景， API
              界面面向企业伙伴，编排软件则把机会导入融资和交付。因此，架构故事是分层的，不是单体的：底层是家庭数据和仿真，中间是报价和设计工作流，
              顶层是合同、服务和面向伙伴的体验。技术叙事可信，但主要仍由公司自有材料讲述，而不是独立基准证明。独立准确性测试、客户案例研究或基准披露 会明显强化这一部分论点。
