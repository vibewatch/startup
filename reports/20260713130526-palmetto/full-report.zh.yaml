              Palmetto 最强的差异化论点是打包。公开材料显示，它用一套栈覆盖市场平台获客、LightReach 融资、企业报价生成工具、 Energy Intelligence 建模和合作伙伴工作流。Sunrun
              的产品也很宽，尤其是太阳能加储能，但它围绕在位订阅平台的规模收益 优化。Tesla 的能源页面强调硬件驱动的备用电源和储能定位。EnergySage 的竞争方式是让价格发现和安装商比较更容易，而不是
              自己掌控交付。Dividend Finance 和 GoodLeap 通过融资赋能安装商，但不拥有完整消费者平台。从定价和打包角度看，关键问题
