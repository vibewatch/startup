        title: 收入模式与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Palmetto 的变现模式最好理解为经常性合同现金流、软件或工作流赋能、以及邻近消费者能源商业的组合。公开材料把 LightReach 展示为旗舰金融产品：类似租赁或 PPA
              的计划，不需要前期付款，绑定长期客户关系，并用月付替代一部分公用事业账单。公司还营销 一个更宽的市场平台，包含太阳能、电池、HVAC、公用事业费率工具和奖励，意味着至少一部分收入机会来自附加产品、服务或转介，
              而不是一次安装事件。企业材料又增加第二层变现：Energy Intelligence API 和合作伙伴软件。平台条款和投资者关系材料没有披露
              实际定价、抽佣率、毛利率，也没有说明多少收入前期确认、多少随时间确认，所以公开记录支持该模式的大架构，但无法搭出清晰的 会计桥。
