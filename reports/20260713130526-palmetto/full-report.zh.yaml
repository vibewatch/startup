  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Palmetto 的可服务市场比整个能源转型经济窄，但比住宅太阳能安装宽。最有用的边界，是美国分布式住宅清洁能源支出，
              包括屋顶太阳能、电池、家庭能源升级、融资，以及把这些产品变成低摩擦家庭决策的软件层。Palmetto 官方材料也强化了
              这条边界：它把太阳能、电池、公用事业费率指导、融资和监控放在一起营销；企业材料则展示面向合作伙伴的 API，用于报价、
              能源建模和线索转化。最接近的替代品不只是其他太阳能安装商，还包括屋主不行动、公用事业供电、现金购买、太阳能贷款， 以及让屋主比较选择、无需绑定一个垂直整合平台的其他贷款方或市场平台。这个框架很重要，因为
              Palmetto 只有在经济 决策和运营工作流两端都比独立安装商、贷款市场平台或直接面向消费者的硬件品牌更简单时，才能赢。
