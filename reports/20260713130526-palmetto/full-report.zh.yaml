      - number: '8.2'
        title: 正方论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              多头论点是连贯的。Palmetto 似乎在搭建一个软件赋能的住宅能源平台，拥有经常性合约资产、多产品扩展、企业分销界面，以及足以支撑继续增长的资本市场信誉。如果模型跑通，Palmetto
              的倍数可能显著高于安装商型同业，因为软件和服务杠杆会随时间改善。反方同样成立。公开证据仍没有披露毛利率、CAC、违约率、非受限现金或集中度；这个品类也已经证明，一旦政策、利率或服务经济性转向不利，资本密集型住宅能源模式会崩得多快。因此，公司当前价格已经押注
              Palmetto 更接近规模化平台，而不是一个包装聪明的项目融资中介。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
