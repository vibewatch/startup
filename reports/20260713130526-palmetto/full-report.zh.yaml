  foundingLocation: Charleston, South Carolina, USA
  headquarters: Charlotte, North Carolina, USA
  productSummary: |
    Palmetto 销售并服务住宅清洁能源产品，覆盖太阳能订阅、太阳能购买、监控和服务计划、HVAC
    以及更广泛的电气化产品、公用事业费率工具、奖励和市场平台产品。公司还运营 Energy
    Intelligence、企业 API、Instant Design 和多产品报价工作流，服务安装商、公用事业和企业渠道。
  customerFocus: |
    寻求住宅太阳能或更广泛电气化产品的美国屋主；需要融资、软件、交付和品牌支持的安装商及 EPC 合作伙伴；以及把清洁能源工具嵌入自有客户体验的企业或公用事业渠道。
  businessModel: |
