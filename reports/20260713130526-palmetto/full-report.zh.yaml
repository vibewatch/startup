              - CV016
      - number: '8.3'
        title: 牛市、基准和熊市区间，以及进入纪律
        blocks:
          - type: paragraph
            body: >-
              基于情景的视角，是公开估值唯一站得住脚的方法。牛市情形假设 ARR 继续扩张、ABS 通道保持开放、合作伙伴质量守住，且 Palmetto
              证明其软件层确实能降低软成本和服务负担。基准情形假设公司真实且可融资，但因证据质量仍混杂、业务表现仍像资本密集型平台，拿不到顶级软件倍数。熊市情形假设增长放缓、政策或融资摩擦出现，或市场重新评估
              Palmetto，把它看成承压的住宅能源运营商，而非差异化软件公司。基于这一点，纪律性投资者应优先选择带保护结构的进入方式、二级机会，或低于当前独角兽叙事的定价，而不是单为叙事支付溢价。
