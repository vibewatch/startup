  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策、法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Palmetto 的一阶风险在于，住宅清洁能源经济性仍强烈受政策塑造。SEIA 的 2025 年回顾称，自有住宅太阳能的 Section 25D 在 2025 年底到期，
              第三方持有结构仍可在有限时间窗口内通过商业投资抵免框架取得资格。这不一定会立刻伤害 Palmetto 的旗舰 LightReach 模式，但会增加政策复杂度，
              也会收窄客户和资本提供方评估经济性的路径。关税、FEOC 规则、消费者保护标准、州承包商许可、公用事业计费争议、真实借贷披露、隐私义务和无障碍 要求都会增加监管接触面。Palmetto
              已公开很多这类披露，这是流程成熟的正面信号；但法律和运营界面数量太多，意味着如果增长跑在控制之前，合规漂移会成为真实风险。
