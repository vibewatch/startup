            body: >-
              资本形成是 Palmetto 财务图景中最可见的部分。公司在 2025 年 1 月宣布超过 $1.2B 的 LightReach 融资，随后在 2025 年两次进入 证券化市场：一笔 $286M ABS
              和之后一笔 $420M ABS，ABS 总发行额超过 $716M。这一顺序告诉投资者两件有用的事。第一，Palmetto
              已经为长期住宅太阳能合同找到机构需求。第二，这门生意足够资本密集，反复结构化融资不是可选项，而是核心运营依赖。公开来源没有披露 非受限现金、月度现金消耗、债务服务覆盖率、仓储融资提款曲线，也没有披露证券化之后
              Palmetto 留存的剩余风险。Sunrun 的公开申报和 业绩在这里可作为品类参照，因为它们显示资产层债务、税务权益和资产负债表管理在住宅太阳能里有多重要。因此，不能只用 ARR 判断 Palmetto
              的财务健康；必须看资本栈的韧性和成本。
