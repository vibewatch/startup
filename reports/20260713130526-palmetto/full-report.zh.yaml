  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 隐含估值会大幅摆动，取决于投资人给 Palmetto 软件式溢价，还是按资产重的住宅能源倍数定价。
    data:
      items:
        - label: $75M ARR × 4x 情景
          value: 0.3
        - label: $75M ARR × 8x 情景
          value: 0.6
        - label: $75M ARR × 12x 情景
          value: 0.9
        - label: $75M ARR × 14x 情景
          value: 1.05
        - label: $75M ARR × 18x 情景
          value: 1.35
    approximationNotes: 所示数值为十亿美元，以据报道的 $75M ARR 作为方向性锚点，不是经审计收入。
