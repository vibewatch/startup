  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与当前估值语境
        blocks:
          - type: paragraph
            body: >-
              估值问题不在于 Palmetto 是否是一家真实公司。它显然是。关键在于，公开记录是否支持为一家经济性仍像软件平台、项目融资机器和分布式现场运营混合体的公司支付独角兽式价格。GetLatka 报告 2025 年
              1 月估值 $1.03 billion、2025 年 9 月 ARR 为 $75 million；CB Insights 和其他数据库也把 Palmetto 视为独角兽。这意味着在有限公开运营细节下，ARR
              倍数大致是十几倍偏低区间。对于一家真实增长、且能反复进入 ABS
              市场的公司，这并非显然荒唐。但对于一家利润率、违约和流动性数据公开有限的公司，这也谈不上便宜。因此，正确姿态是选择性参与而非热情追捧：Palmetto
              或许应比纯安装商享有溢价，但现有公开证据并不能证明，只因公司贴着气候科技和软件叙事，就可以无价可买。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
