        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持真实客户牵引力，尽管指标来自不同产品和时间切片。2025 年 1 月，Palmetto 称 LightReach 已被 20,000 多户家庭采用，并在 30 个州以每天约 300
              户的速度新增。之后的 2025 年影响报告称，当年安装 71,927 套系统，在 30 个州和 Puerto Rico 服务近 72,000 个家庭，并拥有 500 家 EPC 伙伴。这些指标 不能与
              LightReach 数字直接比较，但合在一起指向一家拥有有意义住宅体量和大型运营网络的公司。具名证据点也不止单个家庭：Exelon 使用了 Palmetto 的 太阳能 API，Quinn Residences
              在一个建后出租社区部署 Palmetto，合作伙伴计划材料也显示 Palmetto 把安装商企业作为重复渠道客户。证据在采用宽度上
              最强，在净留存经济性上最弱。本章有意区分家庭数、安装系统数和伙伴指标，因为它们描述业务的不同层级，不应简单相加。这足以证明真实需求，但不足以证明客户队列 耐久性或账户质量一致性。
