      - number: '8.5'
        title: 最终尽调问题与投资主题断裂触发因素
        blocks:
          - type: paragraph
            body: >-
              缺失的尽调项异常具体。投资者需要审计财报、仓储融资和 ABS 表现包、客户违约和转让分群、合作伙伴集中度、软件使用数据，以及从 ARR 到自由现金生成的清晰桥梁。如果这些数据证明 Palmetto
              的软件和服务层能创造持久运营杠杆，公司就可能证明甚至超过最后已知估值。如果数据显示利润率薄、合作伙伴质量不稳或融资条款走弱，下行可能很严重，因为公开标记已经假设成功。因此，建议是有条件的：战略兴趣高、信心中等，估值立场只在低于当前价格或带有防范资本市场/服务意外的保护时才具建设性。
