              公开证据支持一个可信的财务论点，但还不完整。正面论点是，Palmetto 似乎拥有经常性合同基础、真实客户采用、反复 ABS 进入能力， 以及足以随时间降低软成本的软件和伙伴基础设施。谨慎论点是，公开材料没有披露
              CAC、回本期、毛利率、服务成本、违约率、各融资设施的 资金成本，或 Palmetto、税务权益提供方和合同投资者之间的价值分配。即使员工数和总融资额也在第三方数据库之间存在差异，这提醒投资者：
              表面指标可能比底层财务账本更干净。本章判断因此是中性偏谨慎，而不是看多：Palmetto 看起来可融资、也越来越机构化，但收入质量和利润率
              耐久性仍是尽调室问题，不是公开结论。缺少这些指标尤其重要，因为住宅太阳能赢家如果服务或融资成本跑赢合同现金生成，仍可能摧毁股权价值。
