              最强的公开经营指标是 ARR，而不是 GAAP 收入。GetLatka 报告称，Palmetto 在 2023 年 12 月达到 $30M ARR，并在 2025 年 9 月 达到
              $75M；即便分母未经审计，这也意味着有意义的增长。公司和媒体来源也支持 LightReach 存在真实客户规模，2025 年 1 月引用了 20,000 多户家庭和每天 300
              户的节奏。这些数字不能直接揭示贡献利润率，但说明 Palmetto 不是没有收入的实验项目。与此同时，公开
              记录在核心承销问题上仍不完整：融资、市场平台、软件或服务收入流之间没有披露收入组合；没有公开流失或逾期数据；也没有可靠的 月度现金生成速度。因此，正确解读不是 Palmetto
              缺少牵引力，而是它的牵引力比盈利质量更容易看见。这个差别对任何估值判断都重要。
