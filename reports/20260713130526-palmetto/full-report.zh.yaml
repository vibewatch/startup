  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽的估值区间；基准情景集中在上一次已知独角兽估值标记或以下。
    data:
      items:
        - label: 悲观
          low: 0.2
          high: 0.45
          unit: USD billions
          detail: 按资产重或承压住宅太阳能框架定价。
          tone: warning
        - label: 基准
          low: 0.6
          high: 1
          unit: USD billions
          detail: 公司真实、规模真实，但高溢价理由还不完整。
          tone: neutral
        - label: 乐观
          low: 1.1
          high: 1.8
          unit: USD billions
          detail: 软件杠杆和资本通道韧性跑通。
          tone: positive
    approximationNotes: 区间反映明确的情景假设，而非直接观察到的市场交易。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Palmetto 在市场相关性和战略雄心上得分高，但经济性可见度和证据质量较低。
    data:
      items:
        - label: 市场吸引力
          value: 8/10
          detail: 市场大、渗透率低、受政策塑造，且有 TPO 顺风。
          tone: positive
        - label: 产品 / 平台宽度
          value: 8/10
          detail: 多产品和企业工具叙事可信。
          tone: positive
        - label: 客户证明
          value: 7/10
          detail: 真实牵引力和具名渠道存在，但房主队列细节偏薄。
          tone: neutral
        - label: 经济性可见度
          value: 4/10
          detail: ARR 已有披露，但利润率、违约和现金流仍不透明。
          tone: warning
        - label: 风险水平
          value: 3/10
          detail: 政策、资本市场和执行风险仍高。
          tone: warning
        - label: 估值舒适度
          value: 5/10
          detail: 上一次已知估值标记说得通，但并不明显有吸引力。
          tone: neutral
        - label: 证据质量
          value: 5/10
          detail: 足够值得关注，不足以激进出价。
          tone: neutral
    approximationNotes: null
