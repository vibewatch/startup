        title: 客户分层与购买触点
        blocks:
          - type: paragraph
            body: >-
              Palmetto 的客户基础最好按工作流分层，而不只是按收入分层。显然的终端买方是选择太阳能、HVAC、电池邻近产品或 LightReach 计划的屋主。
              但公司也卖给需要融资、软件、交付和品牌杠杆的安装商伙伴；卖给嵌入 Palmetto API 或市场平台体验的企业或公用事业渠道；也面向现有账户持有人， 通过奖励、转介、费率方案和服务订阅扩张。这很重要，因为
              Palmetto 的商业化路径不是单线性漏斗，而是轮辐式系统：伙伴渠道带来屋主需求， 屋主账户带来扩张产品，公开企业集成创造新的漏斗顶部获客界面。因此，投资者应同时从获客多样性和售后关系深度来读客户质量。
