      - number: '2.4'
        title: 增长驱动、约束与政策敏感性
        blocks:
          - type: paragraph
            body: >-
              Palmetto 的市场受到真实经济和环境驱动拉动，但这些顺风不能消除执行和政策风险。公司支持的来源称，家庭能源成本上升， 包括低收入家庭承受的非对称负担，正在让全屋能源节省更突出。IEA
              的可再生能源展望也支持长期宏观顺风：到 2030 年， 仅太阳能 PV 就预计贡献可再生容量增长的 80%，可再生能源也将接近全球用电需求的一半。在这个背景下，约束很具体。SEIA
              反复提到高利率、客户不确定性、安装商和融资方失败、关税、劳动力约束、并网瓶颈，以及税收抵免规则变化。2025 年回顾尤其 重要，因为它记录了 OBBBA 加速 Section 25D
              到期，以及由此形成的客户自有系统与 TPO 结构之间的分裂；后者如果满足开工或 服务截止期，仍可通过商业抵免路径取得资格。因此，Palmetto 的市场论点取决于两个相互绑定的判断：屋主会继续优先考虑账单
              节省和韧性；在后 25D 环境里，TPO 经济性仍比自有太阳能替代方案明显更容易销售。
