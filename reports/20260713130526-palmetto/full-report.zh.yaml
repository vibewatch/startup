      - number: '8.4'
        title: 可比参照与退出准备
        blocks:
          - type: paragraph
            body: >-
              可比公司集合并不完美，而这本身就说明问题。Sunrun 是最相关的公开运营可比，因为它同样暴露于 TPO、资本密集度和大规模住宅能源运营；但即使规模大得多，它在公开市场的估值也只是低个位数十亿美元。Tesla
              可作为品牌和储能邻近业务参照，但业务太宽，其他业务利润也太强，无法直接锚定 Palmetto。SunPower 和 Sunnova
              等困境公司与其说是估值可比，不如说是下行参照，说明客户数量并不能让模型免疫。私营数据库把 Palmetto 放在 $1 billion
              门槛之上，但这些标记只是过时快照，不是实时市场出清价格。因此，退出准备并不完整：Palmetto 有足够叙事和机构背书，值得关注；但公开盈利质量还不足以把 IPO 式估值视为近期已验证。
            claimRefs:
