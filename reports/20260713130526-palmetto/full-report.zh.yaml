  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接对手、在位者、邻近玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              竞争场域比一张屋顶安装商名单更宽。Palmetto 和有融资能力的住宅太阳能提供商处在同一条直接赛道，但邻近品类同样重要， 因为消费者决策可能在签下太阳能合同之前就被分流。直接对手包括
              Sunrun，以及住宅融资生态里曾经的 Sunnova 和 SunPower。 邻近竞争者包括做高端太阳能加储能硬件的 Tesla、做比价和安装商发现的 EnergySage，以及 Dividend
              Finance 或 GoodLeap 这类融资专家，它们让安装商把信贷产品接到非整合式商业化栈上。Palmetto 官方材料显示，它想把需求承接、报价生成
              软件、能源建模、融资、安装商协调和安装后服务放在一起，一次性击败这些模式。这个野心拉宽了竞争集合，也意味着 Palmetto 必须证明自己能在比纯贷款方、纯安装商或纯市场平台更多的界面上执行。
