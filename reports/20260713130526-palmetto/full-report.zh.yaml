      - - Palmetto 更深地掌握软件、服务和企业分销栈，因此可能较安装商同业享有溢价。
        - 如果软件收入仍不重要，或支持负担压过毛利，判断会削弱。
      - - Palmetto 仍是资本密集、对政策敏感的住宅能源运营商；公开证据太薄，不足以支撑大幅溢价。
        - 如果管理层披露强劲现金生成，以及跨周期韧性的合同表现，反向判断会缓和。
      - - 当前独角兽框架可能已经计入尚未公开证明的执行成功。
        - 如果新的融资事件或二级市场交易显示经运营指标验证的强劲估值上调，判断会改变。
    notes: 估值争论两边都说得通；投资决策取决于私下尽调能否化解反向逻辑。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 继续复合增长，ABS 渠道保持开放，合作伙伴质量守住，软件杠杆变得更可见。
        - 按约 14x-18x 估值的 $75M-$100M ARR 意味着约 $1.1B-$1.8B；上行空间更多来自平台重估，而不只是近期收入。
        - 需要异常干净的服务和融资执行。
        - 有可能，但需要公开记录之外的私下证据。
      - - 基准
        - Palmetto 仍是真实且可融资的公司，但证据质量依然参差，业务仍部分像资本密集型运营商。
        - 按约 8x-12x 估值的 $75M-$85M ARR 意味着约 $0.6B-$1.0B；接近或低于最后已知估值标记。
        - 如果软件溢价无法验证，估值倍数会压缩。
        - 最符合当前公开证据。
      - - 悲观
        - 增长放慢，政策或电价变化压缩需求，或资本市场重新定价住宅太阳能风险。
        - 按约 3x-6x 估值的 $60M-$75M ARR 意味着约 $0.2B-$0.45B。
        - 融资压力、服务负担或合同表现走弱，都可能迅速把公司推到这里。
        - 考虑到品类历史，这是一条真实下行路径。
    notes: 情景倍数是显式假设，不是有来源的市场报价；选择这些倍数，是为了框定与公开证据质量一致的结果范围。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Palmetto（私募估值标记）
        - 据报道 ARR $75M；据报道 2025 年 1 月估值 $1.03B
        - 报道估值标记下约 13.7x ARR
        - 投资者可能被要求支付价格的直接锚
        - ARR 和估值来自数据库报道，并非审计披露
      - - Sunrun（上市）
        - 约 1.05M 客户；2026 年 7 月市值约 $2.85B
        - 规模大得多的上市可比对象，但品类倍数承压
        - TPO 占比高的住宅能源业务中，最好的经营可比对象
        - 公开股票市场可能过度惩罚或过度折价行业风险
      - - Tesla Energy 邻近参照
        - Tesla 市值大得多，且不是纯太阳能公司
        - 不是倍数可比；只作为品牌和储能邻近参照
        - 展示消费者能源邻近赛道和品牌力的天花板
        - 业务太宽且太分散，无法直接给 Palmetto 定价
      - - SunPower / Sunnova 下行参照
        - Chapter 11 / 重组结果
        - 困境可比对象，不是健康估值可比对象
        - 可用于框定下行和回收风险
        - 无法提供健康持续经营估值锚
      - - Palmetto 私募数据库样本
        - CB Insights、Caplight、Tracxn、GetLatka 都把 Palmetto 归入后期私募区间
        - 确认 $1B+ 叙事，但细节陈旧或不一致
        - 支撑当前背景和融资阶段判断
        - 不是实时交易市场，也不是完全一致的数据集
    enumerationScope:
      coverage: sample
      basis: >-
        The public comparable set is intentionally selective and focuses on the most decision-useful references rather
        than every residential-energy or climate-tech company with a partial overlap.
    notes: 可比样本应作为三角定位工具，而不是精确定价引擎。
    claimRefs:
      - CV004
      - CV005
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV005
    title: 投资逻辑破裂和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 证券化或仓储融资扩张中断
        - 无法再次进入资本市场，或融资条款显著恶化
        - 削弱平台增长和剩余价值逻辑
        - 从有条件兴趣转为防御姿态
      - - 合同表现疲弱
        - 违约、争议或服务成本显著高于预期
        - 打破经常性资产逻辑
        - 按承压运营商而非平台重新定价
      - - 软件杠杆未能显现
        - 企业工具和数据产品战略上好看，但经济贡献不重要
        - 拿掉溢价倍数论点
        - 只按安装商或资产管理人价格支付
      - - 主要市场政策压缩
        - 客户节省额或资格显著下降
        - 压缩增长，并提高获客摩擦
        - 下调市场规模和估值假设
      - - 合作伙伴质量恶化
        - 集中度或服务故障损害品牌
        - 同时伤害获客、留存和现金生成
        - 暂停投资，直到运营控制得到证明
    notes: 这些触发因素最可能把 Palmetto 从溢价机会推成价值陷阱。
    claimRefs:
      - CV021
      - CV022
      - CV031
      - CV036
      - CV038
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 收入确认、毛利率、运营费用、流动性和现金流
        - 需要用来把 ARR 转化为盈利质量
        - 要求经审计报表和月度管理报表包
      - - 资产组合表现
        - 按队列划分的违约、拖欠、转让、争议和服务成本
        - 需要用来给长周期合同资产估值
        - 要求仓储融资和 ABS 投资者报告
      - - 资本结构
        - 授信条款、契约、预付率、利差和剩余留存
        - 需要用来理解稀释和融资风险
        - 要求审查司库资料和融资协议
      - - 软件使用
        - 企业客户、API 使用、定价和模块采用
        - 需要用来证明相对安装商同业的溢价
        - 要求产品分析数据和客户访谈
      - - 集中度
        - 头部合作伙伴、头部州和头部企业账户
        - 需要用来承销下行和增长耐久性
        - 要求按收入和装机量划分的集中度表
      - - 二级市场背景
        - 近期交易、估值上调或内部轮定价
        - 需要用来判断数据库估值标记能否仍被市场接受
        - 要求投资人更新、经纪商反馈和近期 term sheets
    notes: 如果 Palmetto 无法满足这些要求，仅靠公开证据不足以支撑激进入场价。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV037
      - CV039
      - CV040
