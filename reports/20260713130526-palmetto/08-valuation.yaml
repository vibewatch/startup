- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Loss of securitization or warehouse expansion
    - No repeat capital-market access or materially worse funding terms
    - Undercuts platform growth and residual-value logic
    - Move from conditional interest to defensive posture
  - - Weak contract performance
    - Defaults, disputes, or servicing costs materially above expectations
    - Breaks the recurring-asset thesis
    - Reprice as stressed operator, not platform
  - - Software leverage fails to appear
    - Enterprise tools and data products remain strategically nice but economically immaterial
    - Removes premium-multiple argument
    - Pay only installer-like or asset-manager-like pricing
  - - Policy compression in major markets
    - Customer savings or eligibility fall materially
    - Shrinks growth and raises acquisition friction
    - Reduce market-size and valuation assumptions
  - - Partner-quality deterioration
    - Concentration or service failures impair the brand
    - Hurts acquisition, retention, and cash generation simultaneously
    - Pause investment until operating controls are proven
  notes: These are the triggers most likely to move Palmetto from premium opportunity to value trap.
  claimRefs:
  - CV021
  - CV022
  - CV031
  - CV036
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Audited financials
    - Revenue recognition, gross margin, opex, liquidity, and cash flow
    - Needed to translate ARR into earnings quality
    - Request audited statements and monthly management pack
  - - Portfolio performance
    - Defaults, delinquencies, transfers, disputes, and servicing cost by cohort
    - Needed to value long-duration contract assets
    - Request warehouse and ABS investor reporting
  - - Capital stack
    - Facility terms, covenants, advance rates, spreads, and residual retention
    - Needed to understand dilution and funding risk
    - Request treasury and financing agreement review
  - - Software usage
    - Enterprise customers, API usage, pricing, and module adoption
    - Needed to justify premium to installer-like peers
    - Request product analytics and customer references
  - - Concentration
    - Top partners, top states, and top enterprise accounts
    - Needed to underwrite downside and growth durability
    - Request concentration tables by revenue and volume
  - - Secondary-market context
    - Recent trades, step-ups, or inside-round pricing
    - Needed to know whether the database mark still clears the market
    - Request investor-updates, broker feedback, and recent term sheets
  notes: If Palmetto cannot satisfy these asks, public evidence alone is not strong enough to support an aggressive entry price.
