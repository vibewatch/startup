- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Palmetto (private mark)
    - Reported ARR $75M; reported Jan 2025 valuation $1.03B
    - ~13.7x ARR at reported mark
    - Direct anchor for what investors may be asked to pay
    - ARR and valuation come from database reporting, not audited disclosure
  - - Sunrun (public)
    - ~1.05M customers; July 2026 market cap about $2.85B
    - Public comp with far greater scale but stressed category multiple
    - Best operating comp for TPO-heavy residential energy
    - Public equity market may over-penalize or over-discount sector risk
  - - Tesla Energy adjacency
    - Tesla market cap vastly larger and not solar-pure-play
    - Not a multiple comp; brand and storage adjacency reference only
    - Shows ceiling of consumer-energy adjacency and brand power
    - Too broad and diversified to price Palmetto directly
  - - SunPower / Sunnova downside references
    - Chapter 11 / restructuring outcomes
    - Distress comps, not healthy valuation comps
    - Useful for downside and recovery-risk framing
    - Do not provide healthy going-concern valuation anchors
  - - Palmetto private-database set
    - CB Insights, Caplight, Tracxn, GetLatka all place Palmetto in late-stage private territory
    - Confirms $1B-plus narrative but with stale or inconsistent detail
    - Supports current context and financing-stage view
    - Not a live transaction market or a fully consistent dataset
  enumerationScope:
    coverage: sample
    basis: The public comparable set is intentionally selective and focuses on the most decision-useful references rather than every residential-energy or climate-tech company with a partial overlap.
  notes: The comp set should be read as a triangulation tool, not as a precision pricing engine.
