    statement: That same ABS dependence is valuation-negative because it means growth is still tethered to funding windows and financing spreads.
    type: inferred
    topic: capital-stack
    sourceRefs:
    - SV019
    - SV020
    - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
    - QV008
  - id: CV017
    statement: A scenario-based valuation framework is more defensible than a single-point estimate because Palmetto’s multiple depends heavily on whether investors see platform leverage or capital intensity.
    type: inferred
    topic: scenarios
    sourceRefs:
    - SV001
    - SV015
    - SV019
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV013
    - QV014
  - id: CV018
    statement: The bull case requires Palmetto to earn something like a mid-teens or better ARR multiple, which demands confidence in software leverage and contract quality.
    type: estimated
    topic: scenarios
    sourceRefs:
    - SV001
    - SV019
    - SV020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV013
    - QV014
    - QV015
  - id: CV019
    statement: The base case assumes Palmetto remains a real and growing business but does not fully prove a best-in-class software premium, supporting a roughly high-single-digit to low-teens ARR multiple.
