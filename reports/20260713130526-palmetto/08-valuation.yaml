- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - what would change the view
  rows:
  - - Palmetto is a software-enabled clean-energy platform with real ARR, contract assets, and capital-market access.
    - Would strengthen if audited margins, low defaults, and partner leverage prove durable.
  - - Palmetto can earn a premium to installer peers because it owns more of the software, servicing, and enterprise distribution stack.
    - Would weaken if software revenue remains immaterial or support burden overwhelms gross profit.
  - - Palmetto is still a capital-intensive, policy-sensitive residential-energy operator whose public evidence is too thin for a large premium.
    - Would soften if management discloses strong cash generation and resilient contract performance across cycles.
  - - The current unicorn framing may already price in execution success that has not yet been publicly demonstrated.
    - Would change if a new financing event or secondary market trade shows strong step-up with validated operating metrics.
  notes: Both sides of the valuation debate are plausible; the investment decision depends on whether private diligence resolves the anti-thesis.
