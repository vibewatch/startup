- id: thesis-and-anti-thesis
  title: Thesis and anti-thesis
  body: The bull thesis is coherent. Palmetto appears to be building a software-enabled residential energy platform with recurring contract assets, multi-product expansion, enterprise distribution surfaces, and enough capital-market credibility to keep growing. If that model works, Palmetto could command a meaningfully better multiple than installer-like peers because software and servicing leverage would improve over time. The anti-thesis is equally coherent. Public evidence still does not reveal gross margin, CAC, default rates, unrestricted cash, or concentration, and the category has already shown how quickly capital-intensive residential energy models can break when policy, rates, or servicing economics move against them. The company’s current price therefore embeds a real bet that Palmetto is closer to a scaled platform than to a cleverly packaged project-finance intermediary.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  tableRefs:
  - TV002
  figureRefs: []
- id: scenario-ranges-and-entry-discipline
  title: Bull, base, and bear ranges plus entry discipline
  body: A scenario-based view is the only defensible public valuation approach. The bull case assumes ARR continues scaling, ABS access remains open, partner quality holds, and Palmetto proves that its software layer actually reduces soft costs and servicing burden. The base case assumes the company remains real and financeable but does not earn a top-tier software multiple because evidence quality remains mixed and the business still behaves like a capital-intensive platform. The bear case assumes slower growth, policy or funding friction, or a market reassessment that values Palmetto more like a stressed residential-energy operator than like a differentiated software company. On that basis, a disciplined investor should prefer entry through protective structures, secondary opportunities, or pricing below the current unicorn narrative rather than paying up for narrative alone.
  claimRefs:
