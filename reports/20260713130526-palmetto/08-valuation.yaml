company:
  name: Palmetto
chapter:
  number: 8
  title: Valuation
  summary: Palmetto has enough scale, capital access, and product breadth to justify serious investor interest, but the current public evidence does not support paying a large private-market premium without downside protection. At roughly a $1.0B-plus private mark and about $75M of reported ARR, the company already looks priced for meaningful execution success despite material opacity around margin quality, contract performance, and capital-market dependency.
sections:
- id: recommendation-and-current-context
  title: Recommendation and current valuation context
  body: 'The valuation question is not whether Palmetto is a real company. It clearly is. The question is whether the public record supports paying a unicorn-style price for a business whose economics still look part software platform, part project-finance machine, and part distributed field operation. GetLatka reports a $1.03 billion valuation in January 2025 and $75 million of ARR in September 2025; CB Insights and other databases also treat Palmetto as a unicorn. That implies a rough low-teens ARR multiple on limited public operating detail. For a business with real growth and repeat ABS access, that is not obviously absurd. But for a business with limited public margin, default, and liquidity data, it is also not obviously cheap. The right stance is therefore selective rather than enthusiastic: Palmetto may deserve a premium to a pure installer, but the current public evidence does not justify paying any price simply because the company has climate-tech and software language attached
    to it.'
  claimRefs:
