- id: comparables-and-exit-readiness
  title: Comparable references and exit readiness
  body: 'The comparable set is imperfect, which itself is revealing. Sunrun is the most relevant public operating comp because it shares TPO exposure, capital intensity, and large-scale residential energy operations; yet even at far greater scale it is valued in the low single-digit billions publicly. Tesla is a useful brand and storage adjacency reference, but it is far too broad and profitable elsewhere to anchor Palmetto directly. Distressed names like SunPower and Sunnova are not valuation comps so much as downside references showing that customer count does not immunize the model. Private databases place Palmetto above the $1 billion threshold, but those marks are stale snapshots rather than a live market-clearing price. Exit readiness is therefore incomplete: Palmetto has enough narrative and institutional backing to matter, but not enough public earnings quality to treat an IPO-style valuation as near-term validated.'
  claimRefs:
  - CV025
  - CV026
  - CV027
  - CV028
