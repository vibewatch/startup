- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - ARR continues compounding, ABS access stays open, partner quality holds, and software leverage becomes more visible.
    - $75M-$100M ARR valued at roughly 14x-18x implies ~$1.1B-$1.8B; upside comes from platform re-rating more than near-term revenue alone.
    - Requires unusually clean servicing and funding execution.
    - Possible, but needs private proof not in public record.
  - - Base
    - Palmetto remains real and financeable, but evidence quality stays mixed and the business still behaves partly like a capital-intensive operator.
    - $75M-$85M ARR valued at roughly 8x-12x implies ~$0.6B-$1.0B; close to or below the last known mark.
    - Multiple compression if software premium is not validated.
    - Most consistent with current public evidence.
  - - Bear
    - Growth slows, policy or rate changes compress demand, or capital markets re-price residential solar risk.
    - $60M-$75M ARR valued at roughly 3x-6x implies ~$0.2B-$0.45B.
    - Funding stress, service burden, or weaker contract performance can move the business here quickly.
    - A real downside path given category history.
  notes: Scenario multiples are explicit assumptions, not sourced market quotes; they are chosen to bracket outcomes consistent with public evidence quality.
