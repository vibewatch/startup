  claims:
  - id: CV001
    statement: The best current public valuation anchor is the reported January 2025 private valuation of roughly $1.03 billion.
    type: third-party-reported
    topic: valuation-anchor
    sourceRefs:
    - SV001
    - SV002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: CB Insights and Caplight both support the view that Palmetto remains a late-stage private company with a unicorn-scale narrative.
    type: third-party-reported
    topic: valuation-anchor
    sourceRefs:
    - SV002
    - SV003
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
    - QV017
  - id: CV003
    statement: Using the reported $75 million ARR and $1.03 billion valuation implies an ARR multiple of roughly 13.7x.
    type: estimated
    topic: valuation-anchor
    sourceRefs:
    - SV001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV002
  - id: CV004
    statement: A low-teens ARR multiple is not obviously unreasonable for a fast-growing platform, but it is demanding given Palmetto’s public evidence gaps on margin and cash flow.
    type: inferred
    topic: valuation-anchor
    sourceRefs:
    - SV001
    - SV025
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
    - QV005
  - id: CV005
    statement: Palmetto may deserve a premium to installer-like peers if its software, servicing, and enterprise tools create durable leverage.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV007
    - SV010
    - SV012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
    - QV004
  - id: CV006
    statement: The current public record does not justify paying any price for Palmetto simply because it is a climate-tech unicorn.
    type: inferred
    topic: recommendation
    sourceRefs:
    - SV001
    - SV002
    - SV015
    - SV017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
    - QV025
  - id: CV007
    statement: The right current recommendation is conditional interest with strong price discipline and diligence protections.
    type: inferred
    topic: recommendation
    sourceRefs:
    - SV001
    - SV019
    - SV020
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
    - QV019
    - QV025
  - id: CV008
    statement: If forced to decide on public evidence alone, a disciplined investor should prefer protected entry structures or lower pricing to an aggressive primary-round premium.
    type: inferred
    topic: recommendation
    sourceRefs:
    - SV001
    - SV004
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
    - QV019
  - id: CV009
    statement: The bull thesis rests on Palmetto being a software-enabled clean-energy platform with recurring contract assets, not just an installer.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV007
    - SV008
    - SV010
    - SV026
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV003
    - QV004
  - id: CV010
    statement: The 2023 TPG Rise Climate investment supports the idea that sophisticated climate investors saw strategic platform value in Palmetto.
    type: observed
    topic: thesis
    sourceRefs:
    - SV007
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QV004
  - id: CV011
    statement: Palmetto’s organizational vision page explicitly says the business end game is to aggregate a large amount of high-quality clean-energy assets.
    type: observed
    topic: thesis
    sourceRefs:
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV018
  - id: CV012
    statement: Palmetto’s organizational vision also says partners are the company’s lifeblood, reinforcing the platform and marketplace framing.
    type: observed
    topic: thesis
    sourceRefs:
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV018
  - id: CV013
    statement: The anti-thesis is that Palmetto is still meaningfully a capital-intensive residential-energy operator whose software claims have not yet been translated into public earnings quality.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV001
    - SV015
    - SV017
    - SV018
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV003
    - QV005
  - id: CV014
    statement: The absence of public gross-margin, default, and cash-flow data is the single biggest reason to resist paying a full software-style premium.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV001
    - SV002
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV015
    statement: Repeat ABS access is valuation-positive because it indicates real institutional appetite for Palmetto’s contract assets.
    type: inferred
    topic: capital-stack
    sourceRefs:
    - SV019
    - SV020
    - SV021
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV007
    - QV008
