- id: final-diligence-asks-and-kill-triggers
  title: Final diligence asks and thesis-break triggers
  body: 'The missing diligence is unusually concrete. Investors need audited financials, warehouse and ABS performance packs, customer default and transfer cohorts, partner concentration, software-usage data, and a clean bridge from ARR to free cash generation. If those data prove that Palmetto’s software and servicing layers create durable operating leverage, the company could justify or exceed its last known mark. If they show thin margins, unstable partner quality, or weakening funding terms, the downside could be severe because the public mark already assumes success. The recommendation is thus a conditional one: high strategic interest, medium confidence, and a valuation stance that is only constructive below or with protections against a capital-market or servicing surprise.'
