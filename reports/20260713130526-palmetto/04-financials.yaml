company:
  name: Palmetto
chapter:
  number: 4
  title: Financials
  summary: Palmetto’s public financial story is strong on capital access and weak on audited operating detail. Revenue appears to be growing and the capital stack is clearly built around long-duration residential energy contracts, but public sources still do not reveal gross margin, burn, defaults, or cash runway in a way that would support a fully underwritten view of earnings quality.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization logic
  body: 'Palmetto’s monetization model is best understood as a mix of recurring contract cash flows, software or workflow enablement, and adjacent consumer-energy commerce. Public materials show LightReach as the flagship financial product: a lease or PPA-style plan with no upfront payment, long-duration customer relationships, and monthly payments that substitute for part of the utility bill. The company also markets a broader marketplace that includes solar, batteries, HVAC, utility-rate tools, and rewards, implying that at least some revenue opportunity comes from attached products, services, or referrals rather than one installation event. Enterprise materials add a second monetization layer in the form of Energy Intelligence APIs and partner software. The platform terms and investor-relations materials do not disclose realized pricing, take rates, gross margins, or how much of revenue is recognized up front versus over time, so the public record supports the broad architecture of the
    model but not a clean accounting bridge.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-public-scale-signals
  title: Traction, ARR, and public operating scale
  body: 'The strongest public operating metric is ARR, not GAAP revenue. GetLatka reports that Palmetto reached $30 million of ARR in December 2023 and $75 million in September 2025, which implies meaningful growth even if the denominator remains unaudited. Company and press sources also support real customer scale in LightReach, with 20,000-plus households and a 300-households-per-day pace cited in January 2025. Those figures do not directly reveal contribution margin, but they do suggest that Palmetto is not pre-revenue experimentation. At the same time, the public record is incomplete on core underwriting points: there is no disclosed revenue mix among financing, marketplace, software, or service streams; no public churn or delinquency data; and no reliable monthly run-rate for cash generation. As a result, the right interpretation is not that Palmetto lacks traction, but that its traction is easier to see than its earnings quality. That distinction matters for any valuation view.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  tableRefs:
