  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2024 and 2025 financial statements with revenue-recognition policy, gross profit, opex, and cash-flow statements.
    whyItMatters: Without audited financials, ARR and financing headlines cannot be converted into a reliable view of revenue quality or profitability.
    diligencePath: Request annual audited statements plus the latest monthly management package and a revenue-recognition memo.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI024
    - QI025
    - QI010
  - type: private-evidence-only
    severity: material
    topic: portfolio-performance
    missingEvidence: Delinquency, default, prepayment, and servicing-cost performance by LightReach vintage and ABS pool.
    whyItMatters: The durability of a project-finance model depends on asset performance, not just origination volume.
    diligencePath: Request investor reporting packages for warehouse lines and ABS transactions plus internal servicing dashboards.
    relatedQuestionRefs:
    - QI017
    - QI022
    - QI023
    - QI025
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, attach rates, gross margin by stream, and partner-level productivity metrics.
    whyItMatters: These metrics determine whether Palmetto’s software and partner strategy actually creates financial leverage.
    diligencePath: Request channel-level acquisition, conversion, margin, and retention metrics with cohort views.
    relatedQuestionRefs:
    - QI011
    - QI020
    - QI025
