  - FI003
  - FI004
- id: unit-economics-and-public-gaps
  title: Unit economics verdict and public diligence gaps
  body: 'Public evidence supports a plausible financial thesis but not a complete one. The positive case is that Palmetto appears to have a recurring contract base, real customer adoption, repeat ABS access, and enough software and partner infrastructure to lower soft costs over time. The cautionary case is that none of the public materials reveal CAC, payback, gross margin, servicing costs, default rates, cost of capital by facility, or the allocation of value between Palmetto, tax-equity providers, and contract investors. Even headcount and total funding differ across third-party databases, which is a warning that surface metrics may look cleaner than the underlying financial ledger. The chapter’s judgment is therefore moderate rather than bullish: Palmetto looks financeable and increasingly institutional, but revenue quality and margin durability are still diligence-room questions, not public conclusions. The absence of these metrics is especially important because residential solar winners
    can still destroy equity value if servicing or funding costs outrun contract cash generation.'
