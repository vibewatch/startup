- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  - priority
  rows:
  - - GAAP revenue and revenue recognition policy
    - Without this, ARR cannot be translated into accounting quality
    - Request audited 2024 and 2025 statements plus revenue-recognition memo
    - high
  - - Gross margin by stream
    - Needed to distinguish software margin from service or financing margin
    - Request stream-level gross profit and cost-to-serve tables
    - high
  - - Customer acquisition cost and payback
    - Critical for marketing efficiency and growth durability
    - Request CAC by channel, partner, and product cohort
    - high
  - - Portfolio credit performance
    - Long-duration financing risk cannot be assessed without delinquencies and defaults
    - Request vintage loss curves and ABS performance reporting
    - high
  - - Warehouse, ABS, and tax-equity stack terms
    - Determines true cost of capital and residual economics
    - Request financing agreements, covenants, and collateral waterfalls
    - high
  - - Cash runway and unrestricted liquidity
    - Determines resilience to slower origination or tighter credit markets
    - Request monthly treasury and liquidity pack
    - high
  notes: These are not nice-to-have metrics; they are the minimum data needed to turn Palmetto’s public financing narrative into a defensible underwriting view.
