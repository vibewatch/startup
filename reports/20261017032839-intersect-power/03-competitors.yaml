artifact: competitors
slug: intersect-power
runDate: 2026-10-17
company:
  name: Intersect Power
chapter:
  number: 3
  title: Competitors
  summary: >-
    Intersect's post-acquisition position depends less on standalone renewable scale
    than on coordinating Google data-center load with generation and storage. IPX and
    well-capitalized renewable developers remain credible substitutes, while the
    retained public evidence does not support a standardized pricing comparison.
sections:
  - id: post-acquisition-landscape
    title: Post-acquisition competitive landscape
    body: >-
      The relevant competitive unit changed after Alphabet acquired Intersect for
      $4.75 billion in cash plus assumed debt. Google-owned Intersect retained the
      brand and works with Google's technical infrastructure team on joint generation
      and data-center projects, while IPX was carved out as an independent power
      producer serving utilities and other large energy buyers. These are distinct
      propositions: Intersect can coordinate hyperscaler load and clean-power
      buildout, whereas IPX competes on financing, constructing, owning, and operating
      large renewable portfolios. Independent reporting identifies Leeward, rPlus,
      and Enel Green Power Australia as adjacent developers capable of financing
      large solar, wind, and storage projects. Grid procurement, third-party power
      contracts, and internal development remain substitutes, but their economics are
      not quantified in the assigned evidence.
    claimRefs: [CP001, CP003, CP006, CP007, CP008, CP009, CP010, CP016]
    tableRefs: [TP001]
  - id: capability-and-distribution
    title: Capability, distribution, and switching power
    body: >-
      Intersect's clearest differentiation is the power-first model described by its
      partners: Google supplies anchor demand through newly built data-center
      campuses while Intersect builds co-located clean-energy assets. That can
      synchronize load and generation and reduce dependence on long-distance
      transmission, but it also concentrates distribution power in a strategic
      hyperscaler relationship. IPX has a broader disclosed buyer set—utilities,
      community choice aggregators, large corporates, and energy service providers—
      and is therefore a substitute when a buyer needs utility-scale clean power but
      not a co-located Google campus. Scale alone is not exclusive because peer
      evidence shows billion-dollar financing facilities and gigawatt-class projects.
      Contract duration, termination rights, interconnection control, and multi-homing
      terms are not disclosed in the assigned sources.
    claimRefs: [CP004, CP006, CP007, CP008, CP009, CP010, CP015, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: financing-and-execution
    title: Financing and execution as competitive capabilities
    body: >-
      Intersect has demonstrated access to complex project capital. A syndicated
      company release describes $837 million of construction debt, tax equity, and
      term debt for three Texas battery systems, while Intersect later said the
      transaction combined offtake, procurement, tax equity, and debt components in
      less than six months. The company also reported bringing nearly 1 GWh of
      standalone storage online in one year. These are meaningful execution signals,
      but not unique benchmarks: Mercom reported a $1.25 billion construction
      warehouse for Leeward and more than $1 billion of construction debt for rPlus.
      Industrial Info supports substantial commissioned Intersect capacity, yet
      comparable completion-rate, delay, cost-overrun, and realized-return data are
      unavailable. Capital access is therefore an advantage, not evidence of an
      unassailable moat.
    claimRefs: [CP002, CP008, CP009, CP011, CP012, CP013, CP015]
  - id: pricing-and-moat
    title: Pricing opacity and moat durability
    body: >-
      The assigned evidence does not disclose comparable customer prices, contract
      tenors, discounting, energy rates, capacity payments, or allocation of
      interconnection and curtailment risk across Intersect, IPX, and peers. The
      Google partnership describes anchor offtake, but neither that release nor the
      other retained sources provides realized commercial economics. A defensible
      moat therefore depends on repeated delivery: securing sites, interconnection,
      equipment, project finance, and anchor demand faster than rivals. The adverse
      case is straightforward. IPX controls a large disclosed operating-or-
      construction portfolio, and independent peer evidence shows that large pools of
      project capital are available to other developers. Without contract economics
      and side-by-side delivery outcomes, durable pricing power and lock-in remain
      unverified.
    claimRefs: [CP005, CP006, CP008, CP009, CP014, CP015, CP016]
    tableRefs: [TP003]
