      - ["Public standardized pricing", Unknown, Unknown, Unknown, Unknown]
    notes: "Supported means the retained source set contains direct evidence; unknown does not mean the capability is absent."
    claimRefs: [CP002, CP004, CP006, CP007, CP008, CP009, CP010, CP011, CP014, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns: ["Provider or alternative", "Disclosed commercial model", "Public price / unit", "Included capability", "Underwriting implication"]
    rows:
      - ["Google-owned Intersect", "Google anchor offtake for co-located clean-energy assets", "Not disclosed", "Load-generation coordination and storage", "Request campus-level offtake, allocation, and curtailment terms"]
      - ["IPX Power", "IPP supply to utilities and other large customers", "Not disclosed", "Solar and battery ownership / operation", "Request PPA tenor, realized pricing, and customer concentration"]
      - ["Leeward Renewable Energy", "Fully contracted projects financed through a construction warehouse", "Not disclosed", "Wind, solar, and storage development", "Use only as a capital-access comparator"]
