        - {label: "IPX Power", x: 2, y: 5, note: "Broad IPP buyer set and 4.4 GW solar plus 8.8 GWh storage."}
        - {label: "Leeward Renewable Energy", x: 1, y: 4, note: "$1.25B warehouse initially funding nearly 1 GW."}
        - {label: "rPlus Energies", x: 1, y: 3, note: "400 MW solar plus 400 MW / 1,600 MWh storage project."}
        - {label: "Enel Green Power Australia", x: 1, y: 3, note: "500 MW solar plus 500 MW / 1,000 MWh storage acquisition."}
        - {label: "Grid / internal build", x: 2, y: 1, note: "Potential buyer-controlled alternative; scale and economics not quantified."}
    approximationNotes: >-
      Analyst-authored ordinal scores from 1 (low or undisclosed) to 5 (highest
      disclosed evidence in this source set); they are not measured performance,
      market share, or independent benchmarks.
    claimRefs: [CP015]
