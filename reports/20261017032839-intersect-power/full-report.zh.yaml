      - number: '3.2'
        title: 能力、分发与转换能力
        blocks:
          - type: paragraph
            body: >-
              Intersect 最清晰的差异化，是合作伙伴所描述的电力优先模式：Google 通过新建数据中心园区提供锚定需求，Intersect
              建设共址清洁能源资产。这样可以同步负荷与发电、减少对长距离输电的依赖，但也把分发能力集中在与战略超大规模客户的关系上。IPX
              的买方范围更广——公用事业、社区选择聚合商、大型企业和能源服务商——因此，当买方需要公用事业级清洁电力而非共址 Google 园区时，IPX 就是替代选择。规模本身并不独占，因为同业也有十亿美元级融资工具和 GW
              级项目。指定来源未披露合同期限、终止权、并网控制权和多归属条款。
