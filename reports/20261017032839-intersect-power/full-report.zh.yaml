    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 共址项目按时投运；融资仍可获得；合同回报验证平台价值。
        - 战略价值高于 $4.75B 现金成交价，但公开资料无法支撑具体区间。
        - 经审计的项目 IRR、多元化购电方，以及 Google 之外的重复部署。
        - 重大建设延误、成本超支或再融资失败。
      - - 基准
        - 与 Google 相关的开发继续推进，IPX 则独立运营剥离出的并网资产组合。
        - $4.75B 被视为战略买方参考价，而非经独立验证的公允价值。
        - 里程碑交付和稳定的资本获取，但没有经审计的公司层面经济数据。
        - 边界泄漏、现金转化能力弱或商业条款过于集中。
      - - 悲观
        - 电网、政策、融资或执行约束拖慢产能落地并压缩项目回报。
        - 没有债务、优先权和现金流披露，就无法量化下行空间。
        - 保护电费支付方的义务和不断上升的资金需求超过合同经济性。
        - 无法为项目提供资金，或回报低于评估门槛。
    notes: 情景均为条件性判断；保留来源没有披露经审计的经济数据、承担债务或买方评估，因此有意省略概率百分比和估值区间。
