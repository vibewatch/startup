      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              公开证据支持情景条件，而非精确估值区间。乐观情景要求 Intersect 把多 GW 项目基础和 Google 关系转化为按时交付的数据中心容量，同时保持项目融资渠道和有吸引力的合同回报。基准情景把 $4.75B
              现金价格视为战略买方的成交点，而非独立验证的公允价值，因为交易包含未披露的债务承担，并排除了放入 IPX
              的资产。悲观情景由建设或并网延期、项目经济性弱、融资压力，或要求超大规模客户内部化更多电力成本的政策约束触发。没有经审计经济数据或买方投资判断，给情景赋概率或目标回报会制造虚假精确。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 建议、退出准备度与逻辑失效测试
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，置信度中等、投资判断风险高，而不是买入：相关 Intersect 业务已经被收购，市场没有公开证券或披露的二次进入价格。战略信号很强，但可投资性与独立价值并不明确。未来若考虑 IPX
              或相邻融资机会，应以可对账的资产边界、经审计财务、逐项目合同现金流、债务和税收股权条款、资本表优先权、客户集中度及开发里程碑为前提。逻辑失效触发因素包括共址容量严重延期、无法再融资或为建设提供资金、实际项目回报低于投资判断，或商业条款让价值集中在单一锚定买方而非平台。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: 战略交易价格不是独立公允价值
            body: $4.75B 现金对价是某项特定战略交易中已验证的成交价格；承担债务、留存资产和买方协同效应均未在公开资料中量化。
            calloutType: insight
            claimRefs:
