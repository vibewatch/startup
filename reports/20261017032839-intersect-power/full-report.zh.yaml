  - id: FV001
    title: 从战略证明到投资判断的建议逻辑
    type: flow
    summary: 战略收购和运营规模证明其相关性，但边界复杂、经济数据缺失，无法独立支撑入场估值。
    data:
      nodes:
        - id: strategic-demand
          label: AI 电力需求
          detail: Google 计划在得州数据中心和 AI 领域投入大量资本。
        - id: platform-proof
          label: 平台证明
          detail: Intersect 将大型项目、储能执行和与 Google 相关的开发结合起来。
        - id: buyer-validation
          label: 买方验证
          detail: Alphabet 以 $4.75B 现金加承担债务完成收购。
        - id: perimeter-split
          label: 边界拆分
          detail: 加州和得州并网资产由独立的 IPX 继续运营。
        - id: economics-gap
          label: 经济数据缺口
          detail: 经审计收益、项目 IRR、债务和优先权数据仍不可得。
        - id: decision
          label: 继续研究
          detail: 在赋予价值或回报前，要求提供证券条款和经审计的投资判断。
    approximationNotes: 该流程是定性且有序的；没有为决策阶段赋予概率、转化率或数值估值。
    claimRefs:
      - CV005
      - CV013
      - CV014
      - CV015
      - CV016
