    rows:
      - - 正方论点
        - 数据中心电力开发的战略稀缺性
        - Alphabet 在持有少数股权后收购了该平台，连同其团队和数吉瓦项目。
        - 若有经济性可比的已签第三方项目，论点就不再只依赖 Google。
      - - 正方论点
        - 已证明的公用事业级执行和融资能力
        - IPX 报告称有 4.4 GW 太阳能和 8.8 GWh 储能项目在建或运营；Intersect 报告了 1 GWh BESS 的 $837M 融资。
        - 按期交付和经审计的项目回报，才能把规模转化为价值证明。
      - - 反方论点
        - 公开经济数据无法验证价格
        - CompWorth 估算年收入为 $96.3M，据此得到约 49 倍现金价格 / 估算收入的脆弱筛选结果。
        - 经审计的收入、EBITDA、现金流、合同积压和项目 IRR，可能支持或否定这一价格。
      - - 反方论点
        - 交易边界和资本结构掩盖了价值
        - 收购承担了未指明的债务，同时加州和得州并网资产转入 IPX。
        - 采购价格分摊、债务明细和股权表瀑布分配能消除这一悬念。
    notes: 保留证据中的公司运营数据未经独立审计；CompWorth 数据是第三方估算，不代表收入指引或现金可用性。
