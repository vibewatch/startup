          x: 1
          'y': 3
          note: 400 MW 太阳能，加上 400 MW / 1,600 MWh 储能项目。
        - label: Enel Green Power Australia
          x: 1
          'y': 3
          note: 500 MW 太阳能，加上 500 MW / 1,000 MWh 储能收购项目。
        - label: 电网 / 内部建设
          x: 2
          'y': 1
          note: 潜在的买方控制型替代方案；规模和经济性未量化。
    approximationNotes: 分析师编制的序数评分从 1（低或未披露）到 5（本来源集披露证据最高）；不代表实测表现、市场份额或独立基准。
    claimRefs:
      - CP015
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据指向由资本驱动的基础设施循环，而非公开披露的价目表模式。
    data:
      nodes:
        - id: capital
          label: 资本投入
          value: 2024 growth equity; 2021 project finance; 2024 BESS finance
          detail: 超过 $800M 的成长资金加上大额项目融资承诺，在经营现金流可见前为资产扩建提供资金。
        - id: develop
          label: 开发 / 持有 / 运营资产
          value: Grid-tied and co-located clean energy
          detail: Intersect 将自己描述为并网资源和面向大型工业负荷的共址设施开发商、所有者和运营商。
        - id: offtake
          label: 客户 / 购电结构
          value: Google anchor tenant + utilities / corporate buyers
          detail: Google 为共址园区提供锚定购电；IPX 则服务公用事业、社区选择聚合商、企业买方和能源服务商。
        - id: buildout
          label: 资产交付规模
          value: 2.2 GW + 2.4 GWh base; 4 GW + 10 GWh planned
          detail: 公开披露强调产能扩建和融资里程碑，而非损益表指标。
        - id: finance
          label: 财务模型
          value: Shorter-tenor offtake + portfolio finance
          detail: 管理层强调较短期限购电、项目融资、税收股权和资产组合层面的债务，而非简单的固定价格模板。
        - id: underwrite
          label: 公开评估产出
          value: Directional only
          detail: 收入、EBITDA、毛利率、CAC、回本期、现金余额和现金跑道在审阅的公开来源集中仍未披露。
    approximationNotes: 该桥接是概念性的；由于指定公开来源未发布收入数值，它使用已披露的里程碑、产能和融资结构，而非报告收入金额。
    claimRefs:
      - CI003
      - CI004
      - CI008
      - CI009
      - CI011
      - CI013
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Intersect 已披露的产品把实体能源资产、并网、锚定租户购电以及资本 / 采购能力叠加成一套园区交付系统。
    data:
      layers:
        - label: 选址与许可
          detail: 退役农业用地选择、类似 CEC 的公开许可和社区福利承诺，在客户负荷上线前确立项目可行性。
          modules:
            - label: 土地控制
              detail: Darden 土地购买和场地整合
            - label: 许可
              detail: 范围界定、环境审查和机构批准
        - label: 发电资产
          detail: 公用事业级太阳能及其他清洁发电，为并网和共址园区提供主要能源基础。
          modules:
            - label: 基础资产组合
              detail: 2.2 GW 太阳能已运营或在建
            - label: 扩张轮次
              detail: 计划于 2025 年开工的 4 GW 太阳能
        - label: 储能层
          detail: 电池储能支持灵活性、削峰和更高可再生能源占比的交付。
          modules:
            - label: 运营中 / 进行中的储能
              detail: 2.4 GWh 基础资产组合
            - label: 独立 BESS 项目
              detail: 近 1 GWh 得州部署
        - label: 并网主干
          detail: 高压变电站、联络线和开关站连接发电与负荷，同时力求避免新建长距离输电线路。
          modules:
            - label: 500 kV 接口
              detail: Darden 升压变电站、联络线和 PG&E 开关站
        - label: 园区 / 购电层
          detail: Google 或其他大负荷租户为园区提供锚定，并与专用清洁电力一同上线。
          modules:
            - label: 锚定租户负荷
              detail: 新建数据中心园区
            - label: 可再生能源占比设计
              detail: 较高的年度无碳电力占比，并由电网平衡
        - label: 资本与采购骨干
          detail: 项目融资、供应商关系和组件采购都是产品的一部分，不只是支持职能。
          modules:
            - label: 采购
              detail: 7.3 GW First Solar 承诺
            - label: 融资
              detail: $837M 储能交易及更广泛的项目融资能力
    approximationNotes: 本图是根据公开资产、许可、储能和合作披露综合出的概念性技术栈，而非官方系统图。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据始于 AI 驱动的需求，以 Google 作为锚定租户变得具体，再通过 IPX 扩展到并网客户群。
    data:
      items:
        - label: AI 规模需求论点
          actor: 超大规模云厂商和大型能源用户
          touchpoints:
            - Intersect 称其为 AI 所需的可扩展基础设施建设大型项目。
            - 客户叙事从对专用电力和负荷园区的需求开始。
        - label: 与 Google 的战略合作
          actor: Google / Intersect / TPG
          touchpoints:
            - Google 于 2024 年与 Intersect 建立战略合作。
            - 该合作聚焦新增数据中心容量和可再生电力。
        - label: 锚定租户购电
          actor: Google 作为明确列名的买方和用户
          touchpoints:
            - FacilitiesNet 称 Google 将作为锚定租户，通过新建园区提供购电。
            - 这是公开资料中最清晰的明确客户证据。
        - label: 首个园区交付
          actor: 共址能源园区
          touchpoints:
            - 首个清洁能源项目据描述将于 2026 年投入运营，并于 2027 年完工。
            - 这里交付里程碑比用户数指标更重要。
        - label: IPX 并网客户基础
          actor: 公用事业、CCA、企业、ESPs
          touchpoints:
            - IPX 称其服务加州和得州的公用事业及其他客户。
            - 这些证据大多按分部呈现，而非具名客户证据。
        - label: 扩张与集中循环
          actor: 未来园区和重复需求
          touchpoints:
            - Intersect 指向更多大型园区和数吉瓦管线。
            - Google 集中度高且缺少续约数据，使业务持久性远不如需求端得到验证。
    approximationNotes: 本图定性描绘公开客户旅程和扩张循环；不是量化漏斗或转化分析。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU009
      - CU014
