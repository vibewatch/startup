              公开证据足以约束需求和供给两个视角，但不足以计算可辩护的 TAM / SAM / SOM 漏斗。需求端，Google 与 TPG 的合作被描述为通往十年末数 GW 数据中心容量和 $20B
              可再生能源投资的路径；IPX 则称美国经济到 2030 年需要新增 250 GW 电力。供给端，Intersect 披露 2.2 GW 太阳能和 2.4 GWh 储能基础组合，并计划在 2025 年再增加 4
              GW 和 10 GWh；收购后分拆起步时已有 4.4 GW 和 8.8 GWh 在建或运营。这些指标把需求与可交付资产和时间表连接起来，但仍不是按站点数、买方预算或地域自下而上的可服务市场。
