      - number: '4.3'
        title: 单位经济指标代理与缺失的投资判断输入
        blocks:
          - type: paragraph
            body: >-
              公开单位经济数据仍很少。本章资料支持用资产规模、融资额、客户类别，以及管理层偏好的短期限购电加组合层面融资进行代理分析，但没有披露收入、EBITDA、毛利率、CAC、回本期、现金余额或 资金续航。因此尽调应从
              SaaS 指标转向基础设施问题：产出合同覆盖率、对冲政策、购电期限与涨价、DSCR 与税收股权时间、每 MW / MWh 资本开支，以及按资产类别划分的项目 IRR。运营模式也有保留：Facilities
              Dive 报道近期部署可能仍需燃气备用发电机，Enki 分析指出 Google 从买方转为所有者和运营方后，建设、关税和并网风险增加。这些不是致命缺陷，但意味着公开来源只能支持对收入质量和利润率路径的方向性判断。
