  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Intersect 的实际市场边界，是为大型工业负荷、尤其是 AI
              数据中心开发共址清洁电力园区，而不是笼统的可再生能源支出。公司材料强调把新增负荷直接接到清洁发电上，避免新增输电；第三方摘要则描述了把工业需求与专用可再生发电、必要时的燃气备用结合起来的垂直整合模式。因此替代方案不止公用事业级太阳能开发商：传统选择还包括场外购电协议、依赖电网的数据中心选址，以及
              Intersect 认为可能摧毁价值的传统长期购电结构。市场吸引力取决于共址能否比这些旧式采购路径更快解决供电速度和并网痛点。
            claimRefs:
              - CM001
              - CM003
              - CM006
