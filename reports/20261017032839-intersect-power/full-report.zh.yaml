      - number: '1.3'
        title: 规模指标、里程碑路径与未解问题
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一套有实际经营规模的叙事，尽管缺少典型软件 KPI。Intersect 解决方案页面称，公司有超过 $20B 的运营中或在建基础设施，覆盖 14 个设施、清洁能源容量超过 11.5
              GW；较早的公司融资材料显示，在 Google 交易前，Intersect 已搭建多 GW 的太阳能、储能和绿氢项目管线。该官方页面还把 Oberon 设施列为已交付案例，说明公司在 AI
              基础设施定位加速前，已经具备真实的建设和融资执行能力。


              里程碑路径因此清晰：2016 年成立；2021 年前后扩大项目融资规模；2022 年完成大额成长股权融资；2024 年末至 2025 年初与 Google / TPG 建立战略合作；2025 年 12
              月签署收购协议；2026 年 3 月完成 IPX 分拆；2026 年 6 月 Quantum
              项目开始运营。但未解问题同样重要：指定来源没有给出当前收入、运行率、客户数或员工数；资料池中的官方页面未解决总部口径；第三方分析仍提示共址项目面临并网和监管流程风险。因此，除资产和融资里程碑外，读者不应过度确信其规模叙事。
