            body: >-
              公开证据最充分的是资本形成。Intersect 称 2024 年末由 TPG Rise Climate 和 Google 领投、金额超过 $800M
              的追加融资；更早的融资披露显示，公司还依赖大型项目级结构：2021 年 $2.6B 承诺涵盖建设融资、税收股权、土地融资和定期债务，2024 年另有 $837M BESS
              项目融资。这一模式体现规模和融资能力，但也意味着增长依赖持续获得股权、债务、税收股权以及愿意在经营现金流可见前为资产出资的交易对手。2026 年 3 月 Google
              收购进一步说明，价值实现可以来自战略控制交易，而不只是持续披露的经营盈利；同期 IPX 分拆也表明出售后资产边界发生了重大变化。
