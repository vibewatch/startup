  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 收购后的竞争格局
        blocks:
          - type: paragraph
            body: >-
              Alphabet 以现金 $4.75B 加承担债务收购 Intersect 后，相关竞争单元发生了变化。Google 旗下 Intersect 保留品牌，并与 Google
              技术基础设施团队合作开发联合发电和数据中心项目；IPX 则被分拆为独立电力生产商，为公用事业及其他大型能源买方服务。两者是不同命题：Intersect 协调超大规模客户负荷与清洁电力建设，IPX
              则在大型可再生能源组合的融资、建设、持有和运营上竞争。独立报道将 Leeward、rPlus 和 Enel Green Power Australia
              列为相邻开发商，它们也能融资大型太阳能、风电和储能项目。电网采购、第三方购电合同和内部开发仍是替代方案，但指定证据没有量化其经济性。
