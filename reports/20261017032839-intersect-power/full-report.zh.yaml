      - number: '2.3'
        title: 买方图谱、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              公开披露列出了多个买方类型，但只有一条高度具体的采用路径：Google 作为新建共址园区的锚定租户。除此之外，Intersect / IPX
              提到公用事业、社区选择聚合商、大型企业买方和能源服务商，说明平台同时覆盖并网电力买方与大负荷客户。主要驱动因素是速度：共址被宣传为减少输电建设要求、按数据中心时间表上线新发电的方式。约束同样明确。Intersect
              的历史说明该模式资本密集；独立报道指出，即使可再生资源条件优越的地区，在储能时长和停电缓解能力改善前，也可能仍需电网电力或燃气备用。这使 Google 主导场景之外的预算归属和采购流程成为重要尽调缺口。
