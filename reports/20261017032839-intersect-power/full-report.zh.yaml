      - number: '3.3'
        title: 融资与执行能力构成竞争优势
        blocks:
          - type: paragraph
            body: >-
              Intersect 已证明能够获得复杂项目资本。一份公司联合公告称，三套得州电池系统获得 $837M 建设债、税收股权和定期债务；Intersect
              后来称，该交易在不到六个月内整合了购电、采购、税收股权和债务。公司还报告一年内上线近 1 GWh 独立储能。这些是有意义的执行信号，但并非独有基准：Mercom 报道 Leeward 获得 $1.25B
              仓储融资，rPlus 获得超过 $1B 建设债。Industrial Info 支持 Intersect
              已投运容量可观，但可比的完工率、延期、成本超支和实现回报数据不可得。因此，资本获取是优势，却不是牢不可破护城河的证据。
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: 定价不透明，护城河持久性待验证
        blocks:
          - type: paragraph
            body: >-
              指定证据没有披露 Intersect、IPX 与同业的可比客户价格、合同期限、折扣、能源费率、容量付款，或并网与弃电风险分配。Google
              合作描述了锚定购电，但该公告及其他留存来源都没有给出已实现的商业经济性。可辩护的护城河因此取决于能否反复更快地拿到站点、并网、设备、项目融资和锚定需求。反面情景很直接：IPX
              控制着大规模公开运营或在建组合，而同业证据显示其他开发商也能获得大量项目资本。没有合同经济性和并排交付结果，持久定价权与锁定效应仍未验证。
