          - type: callout
            title: 收入倍数只能作为筛选信号
            body: 约 49 倍是现金价格与 CompWorth 未审计的 $96.3M 年收入估计的比较；它排除了承担债务，不能替代经审计盈利或项目现金流。
            calloutType: risk
            claimRefs:
              - CV001
