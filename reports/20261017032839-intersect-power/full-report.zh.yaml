            body: >-
              从财务角度看，Intersect 是差异化清洁基础设施平台，具备获得战略资本、复杂项目融资和买方支持商业化共址电力资产的能力。证据足以支持公司能够筹集并部署大额资本，但不足以评估 Google 交易和 IPX
