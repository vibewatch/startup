chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与业务边界
        blocks:
          - type: paragraph
            body: >-
              Intersect
              将自己定位为大型清洁能源与数据中心基础设施建设者，而非单纯项目开发商。其官方页面描述了一种共址模式：把工业需求与可再生发电、稳定电源结合，让供电速度快于仅靠电网扩建。这个定位很关键：后文应把公司视为基础设施驱动、贴近
              AI 的业务，而不是软件或市场平台。


              公司的当前阶段比许多私营公司经营指标更清晰。官方材料称 Google 于 2026 年 3 月收购 Intersect；解决方案页面还称，IPX Power 接手了 Intersect
              部分已运营及开发中太阳能和储能资产的所有权。综合来看，收购后 Google 持有围绕能源与算力共址项目的 Intersect 平台，IPX 则在原有投资者支持下保留独立的并网运营资产组合。
