        title: 领导层、资本基础与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              在指定资料中，创始人 Sheldon Kimber 仍是最核心的具名高管。Intersect 官方关于页面列出 Kimber 及商务、财务、运营、技术和行政负责人；第三方交易摘要称交易完成后 Intersect
              将继续由 Kimber 领导。这种连续性有利于后续尽调，但也暴露出关键人物依赖：公开记录对更广泛的董事会结构、委员会监督和收购后控制机制着墨很少。


              资本形成可见但不够精确，不能不加限定地压缩成一个无争议的募资数字。Multiples 称收购前四轮合计募资 $1.8B，同时提到 2025 年二次出售及 2017、2021、2022、2024
              年融资。公开收购价值也接近但不完全一致：Introl 报道现金 $4.75B 外加承担债务，Multiples 则四舍五入为
