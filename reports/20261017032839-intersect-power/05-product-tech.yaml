              detail: "Darden step-up substation, intertie, and PG&E switchyard"
        - label: "Campus / offtake layer"
          detail: "Google or another large-load tenant anchors the campus and comes online with dedicated clean power."
          modules:
            - label: "Anchor-tenant load"
