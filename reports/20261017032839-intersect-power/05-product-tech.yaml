      - ["Utility or corporate buyer needs clean capacity", "Contract with third-party developers or buy power from wholesale markets", "Serve demand through Intersect/IPX-owned solar and battery assets", "IPX launched with 4.4 GW solar and 8.8 GWh battery assets serving utilities and other customers", "Need contracted-versus-merchant split and duration profile"]
      - ["Grid needs peak support and flexibility", "Rely on separate generation and peaking/flex assets", "Deploy standalone and co-located BESS that can dispatch during grid instability", "Intersect said it added nearly 1 GWh of standalone BESS rapidly and has a 2.4 GWh storage portfolio", "Need round-trip efficiency, degradation, and dispatch-frequency data"]
      - ["Financiers and suppliers need bankable execution", "Piece together developers, EPCs, financiers, and suppliers by project", "Integrated development, financing, operations, and large module procurement", "Lifecycle control plus 7.3 GW First Solar procurement supports repeat buildout", "Need named EPC, inverter, and battery counterparties plus warranty terms"]
    notes: "Benefits are reader-facing summaries of cited source claims; they are not normalized unit economics or implied conversion metrics."
