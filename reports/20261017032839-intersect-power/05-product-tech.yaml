  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process"
      - "Role"
      - "Dependency"
      - "Evidence"
      - "Risk"
    rows:
      - ["Site selection and permitting", "Secure land and permit pathways for utility-scale projects", "Local landowners, environmental review, and public permitting agencies", "Darden materials emphasize retired agricultural land and least-conflict siting", "Permitting delay or changed mitigation requirements can move schedules materially"]
      - ["Interconnection and high-voltage interface", "Move generation and storage into the grid / campus interface", "Utility studies, switchyard construction, and 500 kV transfer to PG&E", "Darden includes a step-up substation, intertie, and PG&E-owned switchyard", "Interconnection timing and grid-upgrade costs are critical path items"]
      - ["Generation fleet", "Create clean primary supply for campuses and grid sales", "Solar and wind development, module procurement, EPC execution", "Base portfolio and 4 GW planned break ground show continuing buildout", "Need plant-level output, curtailment, and technology-mix detail"]
      - ["Storage and flexibility layer", "Shift energy and support reliability during volatility and peak periods", "Battery procurement, warranties, and market participation rules", "Public sources cite 2.4 GWh base storage and nearly 1 GWh standalone BESS", "Need degradation assumptions, augmentation policy, and dispatch history"]
      - ["Load / offtake integration", "Anchor campuses with large demand from Google or other industrial buyers", "Customer build schedules and offtake commitments", "Google provides offtake via newly constructed campuses in co-located industrial parks", "Customer delay or lower-than-planned utilization weakens project economics"]
      - ["Controls / assurance layer", "Coordinate planners, communities, and system operations", "Internal EMS/SCADA software, OT security, certifications, and reporting", "Assigned sources show coordination and community-benefit framing but not public technical-control artifacts", "Cyber, uptime, and compliance posture remain under-documented in this pool"]
    notes: "The final row intentionally separates public evidence of coordination and permitting controls from missing public evidence on digital controls, security, and reliability telemetry."
    claimRefs: ["CE004", "CE005", "CE008", "CE010", "CE011", "CE014"]
