            - label: "Procurement"
              detail: "7.3 GW First Solar commitment"
            - label: "Financing"
              detail: "$837M storage deal and broader project-finance capability"
    approximationNotes: "This figure is a conceptual stack synthesized from public asset, permitting, storage, and partnership disclosures rather than an official systems diagram."
