company:
  name: "Intersect Power"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Intersect's post-Google product is a power-first clean-energy platform that pairs large-scale solar, storage, and high-voltage interconnection with co-located hyperscaler campuses. Public evidence shows strong execution in utility-scale asset development, storage deployment, and procurement, but much weaker disclosure on software controls, reliability telemetry, and cyber/compliance artifacts for the newer digital-power stack."
sections:
  - id: "product-definition"
    title: "What the company delivers"
    body: |
      Intersect is no longer best understood as a conventional renewable developer that signs PPAs and exits projects. In the assigned evidence, the company defines its product as large grid-tied clean-energy assets plus co-located facilities for large industrial loads, especially AI data centers. The Google/TPG partnership reframed the offer around a "power-first" model: generation, storage, land, and interconnection are assembled first, then a large-load customer anchors the campus. That matters because the product being sold is not only megawatt-hours, but also time-to-power, interconnection readiness, and the ability to synchronize load growth with new supply. The platform already had meaningful operating scale before the campus push, which makes the co-location strategy an extension of an existing asset-delivery engine rather than a greenfield concept.
    claimRefs: ["CE001", "CE002", "CE003", "CE013"]
    tableRefs: ["TE001"]
  - id: "operating-model"
    title: "How the platform works"
    body: |
      The evidence supports a layered operating model built around site control, high-voltage interconnection, utility-scale solar generation, battery storage, and a colocated load campus. Darden is the clearest architectural example in the assigned pool: one site combines 1.15 GWac of solar, 4.6 GWh of storage, a step-up substation, up to 15 miles of 500 kV intertie, and a PG&E switchyard. In the partnership model, Google supplies offtake through newly constructed data-center campuses while Intersect builds the surrounding energy system. Public descriptions emphasize that the design reduces transmission needs and can deliver a high share of annual power from carbon-free resources, but they also imply hard dependencies on interconnection timing, backup arrangements, and customer build schedules. The post-acquisition IPX spin-out further shows that grid-tied utility and corporate-serving assets remain a distinct operating line from the hyperscaler campus product.
    claimRefs: ["CE002", "CE004", "CE005", "CE006", "CE007", "CE012", "CE013"]
    tableRefs: ["TE002", "TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-risks-controls"
    title: "Differentiation, maturity, and technical gaps"
    body: |
      Intersect's disclosed edge is executional more than algorithmic. The strongest evidence is the combination of lifecycle control across development, engineering, financing, and operations; a large domestic procurement commitment with First Solar; and repeat storage execution, including nearly 1 GWh of standalone BESS brought online rapidly in Texas. Those facts support a view that Intersect's moat is platform integration at project scale. What is much less visible is the digital control plane behind the newer campus model. The assigned pool does not expose software architecture, OT-security controls, uptime telemetry, or public certification surfaces for the data-center power stack. For diligence, that means the core technical question is not whether the company can build large assets—that is reasonably evidenced—but whether the emerging campus product has a repeatable, secure, and contractable operating layer beyond project finance and land-plus-interconnection assembly.
    claimRefs: ["CE008", "CE009", "CE010", "CE011", "CE014"]
callouts:
  - calloutType: "strength"
    title: "Execution-first product maturity"
    body: "The most credible product evidence is not software disclosure but repeated large-asset execution: a 2.2 GW solar and 2.4 GWh storage base, a defined co-location model for hyperscaler campuses, and public evidence of rapid standalone and co-located BESS deployment."
    claimRefs: ["CE003", "CE006", "CE010", "CE011"]
  - calloutType: "risk"
    title: "Operating-system visibility is weak"
    body: "The public record in this worker pool is rich on land, interconnection, financing, and physical assets, but thin on EMS/SCADA architecture, cyber controls, reliability reporting, and service-level commitments for the digital-power product."
    claimRefs: ["CE004", "CE005", "CE014"]
  - calloutType: "insight"
    title: "The acquisition sharpened product boundaries"
    body: "The Google deal appears to have separated two products that used to sit under one brand: hyperscaler-oriented powered-land campuses on one side and a utility/corporate-serving IPP portfolio on the other."
    claimRefs: ["CE007", "CE013"]
