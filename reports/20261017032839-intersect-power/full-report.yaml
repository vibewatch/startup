chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating perimeter
        blocks:
          - type: paragraph
            body: >-
              Intersect presents itself as a builder of large-scale clean-energy and data-center infrastructure rather
              than a pure project developer. Its official pages describe a co-located model that pairs industrial demand
              with renewable generation and firming sources so that power can be delivered faster than a grid-only
              buildout would allow. That positioning matters because later chapters can treat the company as
              infrastructure-led and AI-adjacent, not as a software or marketplace business.


              The company's current stage is clearer than many of its private-company operating metrics. Official
              materials say Google acquired Intersect in March 2026, while Intersect's solutions page adds that IPX
              Power assumed ownership of a portion of Intersect's solar and storage assets in operation and development.
              Taken together, the available evidence supports a post-acquisition structure in which Google owns the
              Intersect platform oriented around co-located energy-and-compute projects, while IPX retained a separate
              grid-tied operating portfolio backed by pre-existing investors.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
