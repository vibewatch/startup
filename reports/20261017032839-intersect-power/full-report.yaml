      - number: '2.3'
        title: Buyer map, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public disclosures identify several buyer archetypes, but only one highly specific adoption path: Google
              as anchor tenant for newly constructed co-located campuses. Beyond that flagship relationship,
              Intersect/IPX names utilities, community choice aggregators, large corporate buyers, and energy service
              providers, which suggests the platform spans both grid-tied power buyers and large-load customers. The
              main adoption driver is speed: co-location is marketed as a way to reduce transmission build requirements
              and bring new generation online on data-center timelines. The key constraints are equally clear.
              Intersect's own history shows the model is financing-heavy, and independent coverage notes that even
              attractive renewable-resource regions may still need grid power or gas-fired backup until storage duration
              and outage mitigation improve. That leaves a real diligence gap around who owns the budget and procurement
              workflow outside the Google-led use case.
