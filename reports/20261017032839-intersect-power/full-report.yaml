      - number: '3.3'
        title: Financing and execution as competitive capabilities
        blocks:
          - type: paragraph
            body: >-
              Intersect has demonstrated access to complex project capital. A syndicated company release describes $837
              million of construction debt, tax equity, and term debt for three Texas battery systems, while Intersect
              later said the transaction combined offtake, procurement, tax equity, and debt components in less than six
              months. The company also reported bringing nearly 1 GWh of standalone storage online in one year. These
              are meaningful execution signals, but not unique benchmarks: Mercom reported a $1.25 billion construction
              warehouse for Leeward and more than $1 billion of construction debt for rPlus. Industrial Info supports
              substantial commissioned Intersect capacity, yet comparable completion-rate, delay, cost-overrun, and
              realized-return data are unavailable. Capital access is therefore an advantage, not evidence of an
              unassailable moat.
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Pricing opacity and moat durability
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose comparable customer prices, contract tenors, discounting, energy
              rates, capacity payments, or allocation of interconnection and curtailment risk across Intersect, IPX, and
              peers. The Google partnership describes anchor offtake, but neither that release nor the other retained
              sources provides realized commercial economics. A defensible moat therefore depends on repeated delivery:
              securing sites, interconnection, equipment, project finance, and anchor demand faster than rivals. The
              adverse case is straightforward. IPX controls a large disclosed operating-or- construction portfolio, and
              independent peer evidence shows that large pools of project capital are available to other developers.
              Without contract economics and side-by-side delivery outcomes, durable pricing power and lock-in remain
              unverified.
            claimRefs:
