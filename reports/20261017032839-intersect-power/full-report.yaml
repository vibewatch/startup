      - number: '4.2'
        title: Capital structure and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence is around capital formation. Intersect disclosed an additional funding round
              of more than $800 million led by TPG Rise Climate and Google in late 2024, while earlier financing
              disclosures show the business also depends on large project-level structures: $2.6 billion of 2021
              commitments spanning construction financing, tax equity, land financing, and term debt, plus $837 million
              of 2024 BESS project financing. That pattern matters because it suggests scale advantages and financing
              sophistication, but it also means growth depends on continued access to equity, debt, tax equity, and
              counterparties willing to fund assets before operating cash flow is visible. The March 2026 Google
              acquisition further confirms that value realization can arrive via strategic control transactions rather
              than only through steady disclosed operating earnings, while the simultaneous IPX spin-out shows the asset
              perimeter itself changed materially after the sale.
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.3'
        title: Unit economics proxies and missing underwriting inputs
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics data remain thin. The chapter pool supports proxy analysis—asset scale, financing
              size, customer categories, and management's stated preference for shorter-tenor offtake plus
              portfolio-level financing—but it does not disclose revenue, EBITDA, gross margin, CAC, payback, cash
              balance, or runway. That means diligence has to shift from classic SaaS-style metrics toward
              infrastructure-specific requests: contracted percentage of output, hedge policy, offtake tenor and
              escalation, DSCR and tax-equity timing, capex per MW/MWh, and project-level IRR by asset class. Even the
              operational model carries caveats: Facilities Dive reports that near-term deployments may still need
              gas-fired backup generators, and Enki's analysis highlights added construction, tariff, and
              interconnection risk once Google moves from buyer to owner-operator. Those are not fatal flaws, but they
              do mean public sources support only a directional view of revenue quality and margin path.
            claimRefs:
              - CI008
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Intersect looks like a differentiated clean-infrastructure platform with demonstrated access
              to strategic capital, sophisticated project finance, and a buyer-backed commercialization path for
              co-located power assets. The evidence is strong enough to support a view that the company can raise and
              deploy very large amounts of capital, but not strong enough to underwrite present revenue quality, margin
              durability, or standalone liquidity after the Google transaction and IPX separation. The underwriting
              stance should therefore be conditional: attractive if diligence confirms contract coverage, project-level
              returns, and post-spin cash governance; still blocked if management cannot produce segment revenue,
              backlog, merchant exposure, and runway data.
            claimRefs:
              - CI001
              - CI007
              - CI010
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the company delivers
        blocks:
          - type: paragraph
            body: >
              Intersect is no longer best understood as a conventional renewable developer that signs PPAs and exits
              projects. In the assigned evidence, the company defines its product as large grid-tied clean-energy assets
              plus co-located facilities for large industrial loads, especially AI data centers. The Google/TPG
              partnership reframed the offer around a "power-first" model: generation, storage, land, and
              interconnection are assembled first, then a large-load customer anchors the campus. That matters because
              the product being sold is not only megawatt-hours, but also time-to-power, interconnection readiness, and
              the ability to synchronize load growth with new supply. The platform already had meaningful operating
              scale before the campus push, which makes the co-location strategy an extension of an existing
              asset-delivery engine rather than a greenfield concept.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
