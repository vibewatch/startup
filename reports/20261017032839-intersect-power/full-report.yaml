        - id: buyer-validation
          label: Buyer validation
          detail: Alphabet closed a $4.75B cash acquisition plus assumed debt.
        - id: perimeter-split
          label: Perimeter split
          detail: Grid-tied California and Texas assets continued in independent IPX.
        - id: economics-gap
          label: Economics gap
