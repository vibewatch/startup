      - number: '1.2'
        title: Leadership, capital base, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Founder Sheldon Kimber remains the central named executive in the assigned source set. Intersect's
              official about page lists Kimber as founder and chief executive officer alongside named commercial,
              finance, operating, technology, and administrative leaders, while third-party deal summaries say Intersect
              would continue under Kimber after the Google transaction. That continuity is useful for later diligence,
              but it also creates visible key-person dependence because the public record here is thin on broader board
              structure, committee oversight, or post-acquisition control mechanics.


              Capital formation is partly visible but not precise enough to collapse into a single undisputed funding
              number without qualification. Multiples reports $1.8B raised across four rounds before acquisition, while
              the same profile also summarizes a 2025 secondary sale and rounds in 2017, 2021, 2022, and 2024. Public
              acquisition-value language is similarly close but not perfectly aligned: Introl cites $4.75B in cash plus
              debt assumption, whereas Multiples rounds the transaction to $4.8B. Those figures are directionally
              consistent and sufficient for a high-level overview, but exact equity value, assumed debt, and rollover
              economics remain diligence asks.
