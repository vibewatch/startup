      - number: '5.3'
        title: Differentiation, maturity, and technical gaps
        blocks:
          - type: paragraph
            body: >
              Intersect's disclosed edge is executional more than algorithmic. The strongest evidence is the combination
              of lifecycle control across development, engineering, financing, and operations; a large domestic
              procurement commitment with First Solar; and repeat storage execution, including nearly 1 GWh of
              standalone BESS brought online rapidly in Texas. Those facts support a view that Intersect's moat is
              platform integration at project scale. What is much less visible is the digital control plane behind the
              newer campus model. The assigned pool does not expose software architecture, OT-security controls, uptime
              telemetry, or public certification surfaces for the data-center power stack. For diligence, that means the
              core technical question is not whether the company can build large assets—that is reasonably evidenced—but
              whether the emerging campus product has a repeatable, secure, and contractable operating layer beyond
              project finance and land-plus-interconnection assembly.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution-first product maturity
            body: >-
              The most credible product evidence is not software disclosure but repeated large-asset execution: a 2.2 GW
              solar and 2.4 GWh storage base, a defined co-location model for hyperscaler campuses, and public evidence
              of rapid standalone and co-located BESS deployment.
            calloutType: strength
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE011
          - type: callout
            title: Operating-system visibility is weak
            body: >-
              The public record in this worker pool is rich on land, interconnection, financing, and physical assets,
              but thin on EMS/SCADA architecture, cyber controls, reliability reporting, and service-level commitments
              for the digital-power product.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE014
          - type: callout
            title: The acquisition sharpened product boundaries
            body: >-
              The Google deal appears to have separated two products that used to sit under one brand:
              hyperscaler-oriented powered-land campuses on one side and a utility/corporate-serving IPP portfolio on
              the other.
            calloutType: insight
            claimRefs:
              - CE007
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Intersect's current customer story is bifurcated. On the digital-power side, the company is explicitly
              pitching large energy-and-data-center campuses built for AI demand, and Google is the named hyperscale
              counterparty across the strongest public proofs in the assigned pool. On the remaining grid-tied platform
              now branded as IPX Power, management says the portfolio serves utilities and other customers across
              California and Texas and identifies community choice aggregators, large corporate buyers, and energy
              service providers as customer classes. That mix suggests Intersect can sell both into hyperscale
              co-location and conventional utility-scale power markets, but the disclosures are segment-level rather
              than account-level for every class except Google.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU011
      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence emphasizes asset scale and delivery milestones more than classic SaaS or services
              metrics. Independent reporting says the Google relationship moved beyond procurement-style PPAs into a
              direct developer acquisition and a co-located campus model in which Google provides offtake as anchor
              tenant. The first campus was described as operational in 2026 and fully complete by 2027, while pv
              magazine reported about 10.8 GW of capacity online or in development by 2028. Those signals imply real
              demand and an expansion path, but they are still infrastructure metrics: the pool does not disclose active
              customer counts, deployed megawatts by customer, or utilization by campus.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU011
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU009
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The main diligence issue is not whether Intersect has customer demand, but how concentrated and durable
              that demand is. Google is the only named hyperscale customer or offtaker in the assigned pool, and Altss
              says the exact acquisition terms were not publicly disclosed. Facilities Dive adds an important operating
              caveat: even a one-gigawatt co-located campus may meet only up to 80% of annual power needs from on-site
              carbon-free resources and may still need gas-fired backup generation in the near term. That does not break
              the thesis, but it means customer economics, uptime, and expansion quality still depend on undisclosed
              contract structure and real-world operating performance rather than public proof of renewals or churn.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Google is both validation and scale engine
            body: >-
              The Google relationship is not just a logo reference: public sources show a progression from partnership
              to anchor-tenant offtake to acquisition, which is unusually strong external validation for customer demand
              in power infrastructure.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU004
          - type: callout
            title: Strategic demand is clearer than customer durability
            body: >-
              The assigned pool does not disclose renewals, churn, customer count, or top-customer revenue share, so
              Intersect's public customer narrative is stronger on strategic demand than on measurable retention or
              diversification.
            calloutType: risk
            claimRefs:
              - CU007
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory path dependence and delivery scale dominate the risk ranking
        blocks:
          - type: paragraph
            body: >-
              The leading risk is the absence of a standardized path for integrating new large loads with co-located
              generation. Utility Dive reported uncertainty around tariffs for co-located load and quoted Intersect
              describing the interconnection process as laborious, unpredictable, and semi-discretionary. That process
              risk matters because Google's December 2024 schedule called for a first phase in 2026 and completion in
              2027, while the partnership contemplated $20 billion of renewable generation and storage. The source does
              not confirm that the 2026 milestone has been achieved. Regulatory delay therefore compounds schedule,
              capital, and customer-concentration exposure rather than remaining an isolated compliance issue.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR009
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Legal exposure is defined by open rulemaking and an incompletely disclosed deal perimeter
        blocks:
          - type: paragraph
            body: >-
              Google's proposed safeguards provide a mitigation framework, not evidence of final approval: co-location
              should avoid identifiable cost shifting, preserve grid reliability, and use commitment-backed load
              forecasts. A separate legal and contractual risk arose when IPX was carved out after the sale of Intersect
              to Google. Public reporting values Google's purchase at $4.75 billion including assumed debt and the
              combined acquisition and spinout at $12 billion of enterprise value, but neither number explains permit
              ownership, contract assignment, consent rights, or liability allocation. Those transaction values are not
              operating liquidity. Direct permit, court, enforcement, environmental, and safety records are missing from
              the assigned evidence and remain diligence requirements rather than evidence that no issue exists.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR009
              - CR010
      - number: '7.3'
        title: Proven battery execution only partly offsets a larger delivery and capital challenge
        blocks:
          - type: paragraph
            body: >-
              Intersect's company-issued releases provide tangible execution evidence: an $837 million financing
              supported construction and operation of 1 GWh across three standalone battery systems, and the company
              said nearly 1 GWh was completed in one year. The same materials also described a 2025 plan for another 4
              GW of solar and 10 GWh of storage representing roughly $9 billion of assets. That plan is a historical
              company target, not proof of delivery by the run date. Likewise, Multiples' estimate of $1.8 billion
              raised over four rounds is funding history, not cash available after the acquisition. Staffing visibility
              is weaker still: a jobs aggregator's 201-500 range does not establish current post-close operating
              capacity.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Google concentration and the IPX separation create linked counterparty risks
        blocks:
          - type: paragraph
            body: >-
              Google was positioned as anchor offtaker when Intersect developed assets in regions of interest, and
              Intersect's current homepage centers the business on infrastructure for AI. The acquisition strengthens
              demand alignment but makes project timing, siting, and economics unusually dependent on one strategic
              owner and customer. At the same time, IPX says the carved-out portfolio holds 4.4 GW of solar and 8.8 GWh
              of battery storage in construction or operation across California and Texas. Investors should therefore
              require an asset-and- contract map before attributing legacy scale, financing capacity, or customer
              diversification to the acquired Intersect business. Thesis-break triggers are failure to evidence a
              repeatable tariff path, an unremedied first-project schedule miss, opaque post-close contract allocation,
              or financing terms that materially increase merchant or covenant exposure.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The regulatory schedule is the primary kill criterion
            body: >-
              The investment case should pause if the first project cannot document an approved, financeable tariff and
              interconnection path or if an unremedied schedule miss undermines the claimed speed advantage of
              co-location.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Underwrite the entity boundary before crediting legacy scale
            body: >-
              Require a contract-and-asset map that distinguishes acquired Intersect from IPX before assigning portfolio
              capacity, customers, financing access, or operating liabilities to the investment thesis.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Transaction context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Alphabet closed its acquisition of Intersect on March 10, 2026 for $4.75 billion in cash plus assumed
              debt, after announcing the transaction on December 22, 2025. Independent reporting places the combined
              enterprise value of the acquired business and concurrent IPX Power spin-out at $12 billion, but the
              retained public evidence does not provide an assumed-debt amount or a purchase-price allocation. The
              perimeter matters: the digital-power business, team, and multiple gigawatts of Google-linked projects
              entered the transaction, while grid-tied operating and development assets in California and Texas
              continued in the independently owned IPX Power. Because the equity, debt, and asset bridges are
              incomplete, neither $4.75 billion nor $12 billion is a clean standalone valuation denominator.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
      - number: '8.2'
        title: Strategic thesis and valuation anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on scarce execution capability at the intersection of large-scale generation, storage,
              and AI data-center demand. The separated IPX portfolio reports 4.4 GW of solar PV and 8.8 GWh of storage
              in construction or operation, while two company releases describe rapid execution of an $837 million
              financing for 1 GWh of standalone storage. Alphabet's willingness to acquire the digital-power platform
              after holding a minority stake is meaningful strategic validation. The anti-thesis is equally material:
              the evidence set contains no audited revenue, EBITDA, cash flow, project-level IRR, or contracted backlog.
              CompWorth's $96.3 million revenue estimate implies roughly 49 times estimated revenue against the cash
              price alone, but that calculation is a fragile screen, not a valuation method.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports scenario conditions rather than precise valuation ranges. A bull case requires
              Intersect to convert its multi-gigawatt project base and Google relationship into timely data-center
              capacity while preserving project-finance access and attractive contracted returns. The base case treats
              the $4.75 billion cash price as a strategic-buyer clearing point, not independently verified fair value,
              because the transaction embeds an undisclosed debt assumption and excludes assets placed in IPX. The bear
              case is triggered by construction or interconnection delays, weak project economics, financing stress, or
              policy constraints that require hyperscalers to internalize more power costs. Without audited economics or
              buyer underwriting, assigning scenario probabilities or target returns would create false precision.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, exit readiness, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research more, with medium confidence and high underwriting risk, rather than buy:
              the relevant Intersect business is already acquired and no public security or disclosed secondary entry
              price is available. The strategic signal is strong, but investability and standalone value are not. A
              future opportunity in IPX or an adjacent financing should be conditioned on a reconciled asset perimeter,
              audited financials, project-by-project contracted cash flows, debt and tax-equity terms, cap-table
              preferences, customer concentration, and development milestones. Thesis-break triggers are a material
              delay in co-located capacity, inability to refinance or fund construction, realized project returns below
              underwriting, or commercial terms that leave value concentrated with one anchor buyer rather than the
              platform.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic price is not standalone fair value
            body: >-
              The $4.75B cash consideration is a verified clearing price for a specific strategic transaction, while the
              assumed debt, retained assets, and buyer synergies are not quantified publicly.
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
          - type: callout
            title: The revenue multiple is only a screening signal
            body: >-
              Roughly 49x compares the cash price with CompWorth's unaudited $96.3M annual revenue estimate; it excludes
              assumed debt and cannot substitute for audited earnings or project cash flows.
            calloutType: risk
            claimRefs:
              - CV001
              - CV010
              - CV011
