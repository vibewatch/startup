  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public proof starts with AI-driven demand, turns concrete with Google as anchor tenant, and then broadens into
      grid-tied customer segments via IPX.
    data:
      items:
        - label: AI-scale demand thesis
          actor: Hyperscalers and large energy users
          touchpoints:
            - Intersect says it builds large projects for the scalable infrastructure that AI demands.
            - The customer narrative begins with demand for dedicated power-and-load campuses.
        - label: Strategic partnership with Google
          actor: Google / Intersect / TPG
          touchpoints:
            - Google entered a strategic partnership with Intersect in 2024.
            - The partnership is framed around new data center capacity and renewable power.
        - label: Anchor-tenant offtake
          actor: Google as named buyer and user
          touchpoints:
            - FacilitiesNet says Google will provide offtake through newly constructed campuses as anchor tenant.
            - This is the clearest named-customer proof in the public pool.
        - label: First campus delivery
          actor: Co-located energy park
          touchpoints:
            - The first clean-energy project was described as operational in 2026 and complete by 2027.
            - Delivery milestones matter more here than user-count metrics.
        - label: IPX grid-tied customer base
          actor: Utilities, CCAs, corporates, ESPs
          touchpoints:
            - IPX says it serves utilities and other customers across California and Texas.
            - Most of this proof is segment-level rather than named-account evidence.
        - label: Expansion and concentration loop
          actor: Future campuses and repeat demand
          touchpoints:
            - Intersect points to additional large-scale campuses and a multi-gigawatt pipeline.
            - Google concentration and missing renewal data keep durability less proven than demand.
    approximationNotes: >-
      This figure maps the public customer journey and expansion loop qualitatively; it is not a quantified funnel or
      conversion analysis.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU009
      - CU014
