      - number: '5.2'
        title: How the platform works
        blocks:
          - type: paragraph
            body: >
              The evidence supports a layered operating model built around site control, high-voltage interconnection,
              utility-scale solar generation, battery storage, and a colocated load campus. Darden is the clearest
              architectural example in the assigned pool: one site combines 1.15 GWac of solar, 4.6 GWh of storage, a
              step-up substation, up to 15 miles of 500 kV intertie, and a PG&E switchyard. In the partnership model,
              Google supplies offtake through newly constructed data-center campuses while Intersect builds the
              surrounding energy system. Public descriptions emphasize that the design reduces transmission needs and
              can deliver a high share of annual power from carbon-free resources, but they also imply hard dependencies
              on interconnection timing, backup arrangements, and customer build schedules. The post-acquisition IPX
              spin-out further shows that grid-tied utility and corporate-serving assets remain a distinct operating
              line from the hyperscaler campus product.
            claimRefs:
              - CE002
              - CE004
