        - Public economics do not validate the price
        - >-
          CompWorth estimates $96.3M annual revenue, producing a fragile roughly 49x cash-price-to-estimated-revenue
          screen.
        - Audited revenue, EBITDA, cash flow, contracted backlog, and project IRRs could support or reject the price.
      - - Anti-thesis
        - Transaction perimeter and capital stack obscure value
        - The acquisition assumed unspecified debt while California and Texas grid-tied assets moved to IPX.
        - A purchase-price allocation, debt schedule, and cap-table waterfall would resolve the overhang.
    notes: >-
      Company-issued operating figures are not independently audited in the retained evidence; CompWorth figures are
      third-party estimates and are not revenue guidance or cash availability.
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Co-located projects enter service on time; financing remains available; contracted returns validate the
          platform.
        - Strategic value exceeds the $4.75B cash clearing price, but no public range is supportable.
        - Audited project IRRs, diversified offtakers, and repeat non-Google deployments.
        - Material construction delay, cost overrun, or failed refinancing.
      - - Base
        - Google-linked development progresses while IPX operates the carved-out grid portfolio separately.
        - $4.75B is treated as a strategic-buyer reference, not independently verified fair value.
        - Milestone delivery and stable capital access without audited company-level economics.
        - Perimeter leakage, weak cash conversion, or concentrated commercial terms.
      - - Bear
        - Grid, policy, financing, or execution constraints delay capacity and compress project returns.
        - Downside cannot be quantified without debt, preference, and cash-flow disclosures.
        - Ratepayer-protection obligations and rising funding requirements outpace contracted economics.
        - Inability to fund projects or returns below underwriting thresholds.
    notes: >-
      Scenarios are conditional and intentionally omit probability percentages and valuation ranges because retained
      sources do not disclose audited economics, assumed debt, or buyer underwriting.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV011
      - CV015
      - CV016
