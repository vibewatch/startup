  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Post-acquisition competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive unit changed after Alphabet acquired Intersect for $4.75 billion in cash plus
              assumed debt. Google-owned Intersect retained the brand and works with Google's technical infrastructure
              team on joint generation and data-center projects, while IPX was carved out as an independent power
              producer serving utilities and other large energy buyers. These are distinct propositions: Intersect can
              coordinate hyperscaler load and clean-power buildout, whereas IPX competes on financing, constructing,
              owning, and operating large renewable portfolios. Independent reporting identifies Leeward, rPlus, and
              Enel Green Power Australia as adjacent developers capable of financing large solar, wind, and storage
              projects. Grid procurement, third-party power contracts, and internal development remain substitutes, but
              their economics are not quantified in the assigned evidence.
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
