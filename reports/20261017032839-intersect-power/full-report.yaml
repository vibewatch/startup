      - number: '1.3'
        title: Scale indicators, milestone path, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Public sources support a meaningful operating-scale narrative even though classic software-style KPIs are
              absent. Intersect's solutions page claims more than $20B of infrastructure operating or under construction
              and 11.5 GW+ of clean-energy capacity across 14 facilities, while older company-issued financing materials
              show that Intersect had already assembled multi-gigawatt solar, storage, and green-hydrogen pipelines
              before the Google deal. The same official page cites the Oberon facility as a delivered proof point,
              supporting the view that the company had real build-and-finance execution before its AI-infrastructure
              repositioning accelerated.


              The milestone arc is therefore legible: a 2016 founding, project-finance scale-up by 2021, a large
              growth-equity round in 2022, the Google/TPG strategic partnership in late 2024 and early 2025, acquisition
              agreement in December 2025, IPX spin-out in March 2026, and Quantum project operations beginning in June
              2026. What remains unresolved is just as important: no assigned source gives current revenue, run-rate,
              customer count, or headcount, official pages in the pool do not settle headquarters language, and
              third-party analysis still flags interconnection and regulatory process risk for co-located projects.
              Those gaps limit how confidently a reader should treat any narrative of scale beyond asset and financing
              milestones.
