  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Intersect's disclosed product stacks physical energy assets, interconnection, anchor-tenant offtake, and
      capital/procurement capabilities into one campus-delivery system.
    data:
      layers:
        - label: Siting & permitting
          detail: >-
            Retired agricultural land selection, CEC-style public permitting, and community-benefit commitments
            establish projectability before customer load goes live.
          modules:
            - label: Land control
              detail: Darden land purchase and site assembly
            - label: Permitting
              detail: Scoping, environmental review, and agency approvals
        - label: Generation assets
          detail: >-
            Utility-scale solar and other clean generation provide the primary energy base for both grid-tied and
            co-located campuses.
          modules:
            - label: Base portfolio
              detail: 2.2 GW solar already operating or in construction
            - label: Expansion wave
              detail: 4 GW of solar planned to break ground in 2025
        - label: Storage layer
          detail: Battery storage supports flexibility, peak shaving, and higher renewable-share delivery.
          modules:
            - label: Operating / in-flight storage
              detail: 2.4 GWh base portfolio
            - label: Standalone BESS program
              detail: Nearly 1 GWh Texas deployment
        - label: Interconnection spine
          detail: >-
            High-voltage substations, intertie lines, and switchyards connect generation and load while seeking to avoid
            new long-distance transmission.
          modules:
            - label: 500 kV interface
              detail: Darden step-up substation, intertie, and PG&E switchyard
        - label: Campus / offtake layer
          detail: Google or another large-load tenant anchors the campus and comes online with dedicated clean power.
          modules:
            - label: Anchor-tenant load
              detail: Newly constructed data-center campuses
            - label: Renewable-share design
              detail: High annual carbon-free percentage with grid balancing
        - label: Capital & procurement backbone
          detail: >-
            Project finance, supplier relationships, and module procurement are part of the product, not merely support
            functions.
          modules:
            - label: Procurement
              detail: 7.3 GW First Solar commitment
            - label: Financing
              detail: $837M storage deal and broader project-finance capability
    approximationNotes: >-
      This figure is a conceptual stack synthesized from public asset, permitting, storage, and partnership disclosures
      rather than an official systems diagram.
    claimRefs:
