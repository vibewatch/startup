  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Intersect's practical market boundary is the development of co-located clean-power campuses for large
              industrial loads, especially AI-linked data centers, not a generic bucket of renewable-energy spend. The
              company's own materials frame the offering around bringing new load directly to clean generation without
              new transmission, while third-party summaries describe a vertically integrated model that pairs industrial
              demand with dedicated renewable generation and, where needed, gas backup. That makes the relevant
              substitute set broader than utility-scale solar developers alone: incumbent status-quo options include
              off-site power purchase agreements, grid-dependent data-center siting, and conventional long-term offtake
              structures that Intersect argues can destroy value. As a result, market attractiveness depends on whether
              co-location solves speed-to-power and interconnection pain faster than those legacy procurement paths.
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing and adoption lenses
        blocks:
          - type: paragraph
            body: >-
              The public evidence is strong enough to bound demand and supply lenses, but not to calculate a defensible
              TAM/SAM/SOM waterfall. On the demand side, the partnership with Google and TPG is pitched as a pathway to
              gigawatts of data-center capacity and $20 billion of renewable-power investment by decade end, while IPX
              says the U.S. economy needs 250 GW of additional power by 2030. On the supply side, Intersect disclosed a
              2.2 GW solar and 2.4 GWh storage base portfolio plus a 2025 plan for another 4 GW and 10 GWh, and the
              post-acquisition spin-out started with 4.4 GW and 8.8 GWh already under construction or operating. Those
              are useful sizing lenses because they tie market demand to actual deliverable assets and timelines, but
              they still stop short of a bottoms-up serviceable market by site count, buyer budget, or geography.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
