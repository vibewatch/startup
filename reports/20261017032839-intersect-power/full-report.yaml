  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              Intersect's disclosed monetization looks like contracted infrastructure development rather than software
              subscription revenue. The December 2024 Google/TPG partnership states that Intersect will build new clean
              energy assets while Google serves as anchor offtaker for newly constructed data-center campuses, so the
              commercial engine is asset delivery plus long-lived power offtake rather than publicly posted seat pricing
              or a self-serve tariff. Intersect's own site and partnership materials also frame the company as a
              developer-owner-operator of grid-tied clean energy resources and co-located facilities for large
              industrial loads, which is consistent with a project-finance model where customer economics are embedded
              in contracts and financing structures rather than disclosed list prices. Public evidence does show where
              revenue should come from—Google-linked energy parks, grid-tied solar and storage, and historical project
              monetization—but not the realized price, contract duration, escalation, or merchant-versus-contracted mix
              that would determine quality of revenue.
