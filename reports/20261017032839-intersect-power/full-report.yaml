      - number: '3.2'
        title: Capability, distribution, and switching power
        blocks:
          - type: paragraph
            body: >-
              Intersect's clearest differentiation is the power-first model described by its partners: Google supplies
              anchor demand through newly built data-center campuses while Intersect builds co-located clean-energy
              assets. That can synchronize load and generation and reduce dependence on long-distance transmission, but
              it also concentrates distribution power in a strategic hyperscaler relationship. IPX has a broader
              disclosed buyer set—utilities, community choice aggregators, large corporates, and energy service
              providers— and is therefore a substitute when a buyer needs utility-scale clean power but not a co-located
              Google campus. Scale alone is not exclusive because peer evidence shows billion-dollar financing
              facilities and gigawatt-class projects. Contract duration, termination rights, interconnection control,
              and multi-homing terms are not disclosed in the assigned sources.
            claimRefs:
