evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: Current revenue or run-rate, EBITDA or project-level profitability, active customer count, and current headcount.
    whyItMatters: These are core cover metrics that determine whether asset and financing scale translate into operating economics.
    diligencePath: >-
      Request management KPI pack, current org chart, and post-acquisition operating plan with segment-level financial
      disclosure.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
  - type: conflicting-data
    severity: material
    topic: headquarters / TO002
    missingEvidence: An authoritative current headquarters and office-footprint statement from the company or parent.
    whyItMatters: Conflicting location language complicates identity, hiring, and jurisdiction analysis in later chapters.
    diligencePath: >-
      Confirm current registered principal office and operating headquarters in diligence materials or parent-company
      integration documents.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: governance / TO003
    missingEvidence: Board composition, committee structure, and post-acquisition governance or reserved matters.
    whyItMatters: Founder continuity without visible board or control-right detail leaves key decision rights and oversight unclear.
    diligencePath: Obtain board roster, shareholder agreement summary, and Google integration governance memo.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A bottoms-up TAM/SAM/SOM bridge by geography, interconnection-ready site count, and buyer class.
    whyItMatters: >-
      The current evidence bounds demand and supply, but it does not show how much of the macro opportunity is
      realistically serviceable by Intersect.
    diligencePath: >-
      Request a project-by-project pipeline, targeted geographies, and management's serviceable-market methodology tied
      to actual site inventory and customer segments.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Named budget owners, contract structures, and procurement stages for non-Google customers.
    whyItMatters: >-
      Without documented buyer workflow and payers, the buyer map cannot be converted into a reliable adoption forecast
      or sales-cycle estimate.
    diligencePath: >-
      Obtain customer case studies or management disclosure showing who signs, who pays, and what procurement milestones
      exist outside the Google anchor-tenant model.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Project-level capex per MW, storage-duration economics, and margin impact of backup thermal or grid-balancing
      requirements.
    whyItMatters: >-
      The model's valuation depends on whether co-location preserves attractive returns after reliability and financing
      costs are included.
    diligencePath: >-
      Request underwriting materials, project IRR targets, and sensitivity cases for storage duration, curtailment, and
      backup generation assumptions.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Comparable realized pricing, contract tenor, escalation, curtailment allocation, discounting, and termination
      terms for Intersect, IPX, peers, and status-quo procurement.
    whyItMatters: >-
      Without normalized contract economics, the analysis cannot verify customer savings, pricing power, switching
      costs, or margin durability.
    diligencePath: >-
      Request anonymized executed contracts and bid comparisons, then normalize them by geography, delivery date,
      technology, duration, and risk allocation.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: >-
      Independent completion-rate, delay, cost-overrun, realized-return, and customer-renewal benchmarks for Intersect,
      IPX, and the named peers.
    whyItMatters: >-
      Financing announcements and portfolio capacity do not establish superior delivery economics or durable customer
      preference.
    diligencePath: >-
      Obtain project-level operating histories, interconnection milestones, lender reports, customer references, and
      comparable procurement outcomes.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: segment-revenue
    missingEvidence: >-
      Segment revenue, EBITDA, gross margin, and backlog for Google-linked data-center energy parks versus other asset
      classes.
    whyItMatters: >-
      Without segment economics, the chapter cannot distinguish strategic headline value from durable cash generation or
      judge whether the co-located model earns superior returns.
    diligencePath: >-
      Request the latest management reporting pack with revenue, gross margin, EBITDA, backlog, and COD schedule by
      project family.
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: >-
      Actual offtake agreements, tenor ladders, escalation clauses, merchant exposure, and hedge policy for Intersect
      and any continuing shared economics with IPX.
    whyItMatters: >-
      Revenue quality depends on counterparty concentration, contracted share of output, and exposure to basis,
      curtailment, and commodity volatility.
    diligencePath: Obtain sample PPAs/offtake contracts, hedge summaries, and board materials on contract coverage and merchant risk.
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Current unrestricted cash, debt maturities, tax-equity timing, covenant package, and project-level DSCR/IRR.
    whyItMatters: >-
      Large project pipelines can remain equity-destructive if liquidity, leverage, or tax-equity timing misaligns with
      COD and cash generation.
    diligencePath: Request the latest liquidity forecast, debt schedule, covenant calculations, and project-level financing models.
  - type: missing-source
    severity: material
    topic: software-and-controls-architecture
    missingEvidence: >-
      A public or private architecture package covering EMS/SCADA layers, dispatch software, failover logic, and how
      campus load is coordinated with generation, storage, and grid imports.
    whyItMatters: >-
      The physical asset stack is evidenced, but the repeatability and security of the newer digital-power product
      depends on the control layer that public materials do not describe.
    diligencePath: >-
      Request product architecture diagrams, OT-network segmentation, dispatch-control documentation, and operating
      procedures for the first co-located campus.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Public or diligence-room evidence of cybersecurity governance, OT incident response, SOC/ISO-style certifications,
      uptime reporting, or a status surface for the campus product.
    whyItMatters: >-
      Without explicit assurance artifacts, investors cannot judge whether the product's reliability and cyber posture
      match the critical-load profile of hyperscaler campuses.
    diligencePath: >-
      Request security policies, certification letters, incident history, reliability SLAs, and any public or private
      uptime reporting for powered-land campuses.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Practitioner-community or developer-signal evidence such as public technical docs, API surfaces, operator talks,
      software release logs, or engineer recruiting materials tied to the digital-power stack.
    whyItMatters: >-
      The chapter brief asks for developer-signal or the closest practitioner proxy, but the assigned pool does not
      provide a durable external signal for the platform's software or operating-tooling community.
    diligencePath: >-
      Collect engineering talks, architecture blogs, recruiting packets, technical conference appearances, or product
      documentation that expose the operating-tool chain behind the campus model.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public or diligence-only evidence for NRR, GRR, churn, renewal rates, contract duration, or customer satisfaction.
