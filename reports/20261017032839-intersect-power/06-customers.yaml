company:
  name: Intersect Power
chapter:
  number: 6
  title: Customers
  summary: >-
    Intersect's public customer proof is strongest around Google: the relationship progressed
    from a 2024 strategic partnership to anchor-tenant offtake for co-located campuses and then
    to a 2026 acquisition. Outside that hyperscale relationship, public evidence supports a real
    utility-scale customer base and broad segment coverage, but not named non-Google deployments,
    retention metrics, or concentration disclosures.
sections:
  - id: customer-base
    title: Customer base and payer segmentation
    body: >-
      Intersect's current customer story is bifurcated. On the digital-power side, the company is
      explicitly pitching large energy-and-data-center campuses built for AI demand, and Google is
      the named hyperscale counterparty across the strongest public proofs in the assigned pool.
      On the remaining grid-tied platform now branded as IPX Power, management says the portfolio
      serves utilities and other customers across California and Texas and identifies community
      choice aggregators, large corporate buyers, and energy service providers as customer classes.
      That mix suggests Intersect can sell both into hyperscale co-location and conventional
      utility-scale power markets, but the disclosures are segment-level rather than account-level
      for every class except Google.
    claimRefs: [CU001, CU002, CU004, CU005, CU006]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named customer proof
    body: >-
      Public adoption evidence emphasizes asset scale and delivery milestones more than classic SaaS
      or services metrics. Independent reporting says the Google relationship moved beyond
      procurement-style PPAs into a direct developer acquisition and a co-located campus model in
      which Google provides offtake as anchor tenant. The first campus was described as operational
      in 2026 and fully complete by 2027, while pv magazine reported about 10.8 GW of capacity
      online or in development by 2028. Those signals imply real demand and an expansion path, but
      they are still infrastructure metrics: the pool does not disclose active customer counts,
      deployed megawatts by customer, or utilization by campus.
    claimRefs: [CU003, CU004, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The main diligence issue is not whether Intersect has customer demand, but how concentrated
      and durable that demand is. Google is the only named hyperscale customer or offtaker in the
      assigned pool, and Altss says the exact acquisition terms were not publicly disclosed.
      Facilities Dive adds an important operating caveat: even a one-gigawatt co-located campus may
      meet only up to 80% of annual power needs from on-site carbon-free resources and may still
      need gas-fired backup generation in the near term. That does not break the thesis, but it
      means customer economics, uptime, and expansion quality still depend on undisclosed contract
      structure and real-world operating performance rather than public proof of renewals or churn.
    claimRefs: [CU011, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: Google is both validation and scale engine
    body: >-
      The Google relationship is not just a logo reference: public sources show a progression from
      partnership to anchor-tenant offtake to acquisition, which is unusually strong external
      validation for customer demand in power infrastructure.
    claimRefs: [CU002, CU003, CU004]
  - calloutType: risk
    title: Strategic demand is clearer than customer durability
    body: >-
      The assigned pool does not disclose renewals, churn, customer count, or top-customer revenue
      share, so Intersect's public customer narrative is stronger on strategic demand than on
      measurable retention or diversification.
    claimRefs: [CU007, CU011, CU014]
