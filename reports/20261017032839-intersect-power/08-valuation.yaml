schemaVersion: "report-v2"
artifact: valuation
slug: intersect-power
runDate: 2026-10-17
company:
  name: Intersect Power
chapter:
  number: 8
  title: Valuation
  summary: >-
    Alphabet's completed $4.75 billion cash acquisition, plus assumed debt, validates strategic
    scarcity value for Intersect's data-center power platform, but public evidence does not support
    an independent intrinsic-value conclusion. The appropriate stance is research more: the acquired
    and spun-out asset perimeter is complex, the only retained revenue estimate is unaudited, and
    transaction debt, project returns, preferences, and comparable valuations remain undisclosed.
sections:
  - id: transaction-context
    title: Transaction context and entry discipline
    body: >-
      Alphabet closed its acquisition of Intersect on March 10, 2026 for $4.75 billion in cash plus
      assumed debt, after announcing the transaction on December 22, 2025. Independent reporting
      places the combined enterprise value of the acquired business and concurrent IPX Power
      spin-out at $12 billion, but the retained public evidence does not provide an assumed-debt
      amount or a purchase-price allocation. The perimeter matters: the digital-power business,
      team, and multiple gigawatts of Google-linked projects entered the transaction, while
      grid-tied operating and development assets in California and Texas continued in the
      independently owned IPX Power. Because the equity, debt, and asset bridges are incomplete,
      neither $4.75 billion nor $12 billion is a clean standalone valuation denominator.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013, CV014]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Strategic thesis and valuation anti-thesis
    body: >-
      The thesis rests on scarce execution capability at the intersection of large-scale generation,
      storage, and AI data-center demand. The separated IPX portfolio reports 4.4 GW of solar PV and
      8.8 GWh of storage in construction or operation, while two company releases describe rapid
      execution of an $837 million financing for 1 GWh of standalone storage. Alphabet's willingness
      to acquire the digital-power platform after holding a minority stake is meaningful strategic
      validation. The anti-thesis is equally material: the evidence set contains no audited revenue,
      EBITDA, cash flow, project-level IRR, or contracted backlog. CompWorth's $96.3 million revenue
      estimate implies roughly 49 times estimated revenue against the cash price alone, but that
      calculation is a fragile screen, not a valuation method.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Bull, base, and bear framing
    body: >-
      Public evidence supports scenario conditions rather than precise valuation ranges. A bull case
      requires Intersect to convert its multi-gigawatt project base and Google relationship into
      timely data-center capacity while preserving project-finance access and attractive contracted
      returns. The base case treats the $4.75 billion cash price as a strategic-buyer clearing point,
      not independently verified fair value, because the transaction embeds an undisclosed debt
      assumption and excludes assets placed in IPX. The bear case is triggered by construction or
      interconnection delays, weak project economics, financing stress, or policy constraints that
      require hyperscalers to internalize more power costs. Without audited economics or buyer
      underwriting, assigning scenario probabilities or target returns would create false precision.
    claimRefs: [CV001, CV004, CV006, CV008, CV011, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation, exit readiness, and thesis-break tests
    body: >-
      The recommendation is research more, with medium confidence and high underwriting risk, rather
      than buy: the relevant Intersect business is already acquired and no public security or
      disclosed secondary entry price is available. The strategic signal is strong, but investability
      and standalone value are not. A future opportunity in IPX or an adjacent financing should be
      conditioned on a reconciled asset perimeter, audited financials, project-by-project contracted
      cash flows, debt and tax-equity terms, cap-table preferences, customer concentration, and
      development milestones. Thesis-break triggers are a material delay in co-located capacity,
      inability to refinance or fund construction, realized project returns below underwriting, or
      commercial terms that leave value concentrated with one anchor buyer rather than the platform.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV011, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more / track
        - The target business was acquired for $4.75B cash plus assumed debt; no public entry security is identified.
        - Do not underwrite a new position without a defined security, price, and rights.
      - - Confidence
        - Medium
        - Transaction consideration and closing are corroborated, but operating economics are not disclosed.
        - Treat strategic validation as stronger than intrinsic-value evidence.
      - - Risk rating
        - High for new underwriting
        - Acquired and spun-out assets have different owners, projects, and financing exposures.
        - Require an asset-by-asset perimeter and liability bridge.
      - - Valuation stance
        - Not independently supportable
        - The $4.75B cash price excludes an undisclosed debt assumption; $12B refers to combined transactions.
        - Do not label the transaction cheap or fair from public evidence alone.
      - - Exit / liquidity
        - Already realized for the acquired platform
        - Google closed the acquisition on March 10, 2026; IPX continues independently.
        - Any future IPX investment needs a separate exit and return case.
    notes: >-
      Assessments use the retained public transaction record as of 2026-10-17; no audited valuation
      model, debt bridge, security terms, or project-level return data were available.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV011]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Strategic scarcity in data-center power development
        - Alphabet acquired the platform after holding a minority stake, including a team and multiple gigawatts of projects.
        - Signed third-party projects with comparable economics would broaden the thesis beyond Google.
      - - Thesis
        - Demonstrated utility-scale execution and financing
        - IPX reports 4.4 GW solar and 8.8 GWh storage in construction or operation; Intersect reported $837M financing for 1 GWh BESS.
        - On-time delivery and audited project returns would convert scale into value proof.
      - - Anti-thesis
        - Public economics do not validate the price
        - CompWorth estimates $96.3M annual revenue, producing a fragile roughly 49x cash-price-to-estimated-revenue screen.
        - Audited revenue, EBITDA, cash flow, contracted backlog, and project IRRs could support or reject the price.
      - - Anti-thesis
        - Transaction perimeter and capital stack obscure value
        - The acquisition assumed unspecified debt while California and Texas grid-tied assets moved to IPX.
        - A purchase-price allocation, debt schedule, and cap-table waterfall would resolve the overhang.
    notes: >-
      Company-issued operating figures are not independently audited in the retained evidence;
      CompWorth figures are third-party estimates and are not revenue guidance or cash availability.
    claimRefs: [CV004, CV006, CV008, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Co-located projects enter service on time; financing remains available; contracted returns validate the platform.
        - Strategic value exceeds the $4.75B cash clearing price, but no public range is supportable.
        - Audited project IRRs, diversified offtakers, and repeat non-Google deployments.
        - Material construction delay, cost overrun, or failed refinancing.
      - - Base
        - Google-linked development progresses while IPX operates the carved-out grid portfolio separately.
        - $4.75B is treated as a strategic-buyer reference, not independently verified fair value.
        - Milestone delivery and stable capital access without audited company-level economics.
        - Perimeter leakage, weak cash conversion, or concentrated commercial terms.
      - - Bear
        - Grid, policy, financing, or execution constraints delay capacity and compress project returns.
        - Downside cannot be quantified without debt, preference, and cash-flow disclosures.
        - Ratepayer-protection obligations and rising funding requirements outpace contracted economics.
        - Inability to fund projects or returns below underwriting thresholds.
    notes: >-
      Scenarios are conditional and intentionally omit probability percentages and valuation ranges
      because retained sources do not disclose audited economics, assumed debt, or buyer underwriting.
    claimRefs: [CV001, CV004, CV006, CV008, CV011, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic from strategic proof to underwriting decision
    type: flow
    summary: >-
      Strategic acquisition and operating scale establish relevance, while perimeter complexity and
      missing economics prevent an independently supported entry valuation.
    data:
      nodes:
        - id: strategic-demand
          label: AI power demand
          detail: Google plans substantial Texas data-center and AI capital spending.
        - id: platform-proof
          label: Platform proof
          detail: Intersect combines large projects, storage execution, and Google-linked development.
        - id: buyer-validation
          label: Buyer validation
          detail: Alphabet closed a $4.75B cash acquisition plus assumed debt.
        - id: perimeter-split
          label: Perimeter split
          detail: Grid-tied California and Texas assets continued in independent IPX.
        - id: economics-gap
          label: Economics gap
          detail: Audited earnings, project IRRs, debt, and preferences remain unavailable.
        - id: decision
          label: Research more
          detail: Require security terms and audited underwriting before assigning value or return.
    approximationNotes: >-
      The flow is qualitative and ordered; it does not assign probabilities, conversion rates, or a
      numerical valuation to the decision stages.
    claimRefs: [CV005, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: insight
    title: Strategic price is not standalone fair value
    body: >-
      The $4.75B cash consideration is a verified clearing price for a specific strategic transaction,
      while the assumed debt, retained assets, and buyer synergies are not quantified publicly.
    claimRefs: [CV001, CV003, CV004, CV011]
  - calloutType: risk
    title: The revenue multiple is only a screening signal
    body: >-
      Roughly 49x compares the cash price with CompWorth's unaudited $96.3M annual revenue estimate;
      it excludes assumed debt and cannot substitute for audited earnings or project cash flows.
    claimRefs: [CV001, CV010, CV011]
