  topStrengths:
    - Google acquisition validates strategic demand for the co-located power model.
    - Public evidence supports large-scale project execution, financing access, and multi-gigawatt asset delivery.
    - >-
      The platform is positioned around speed-to-power and grid/interconnection constraints that matter in AI
      infrastructure.
  topRisks:
    - Regulatory, interconnection, and schedule risk remain central to co-located load buildout.
    - Customer and economics concentration around Google and the IPX perimeter reduces transparency.
    - Revenue, margin, contract, and post-close governance details are not publicly disclosed.
  unresolvedGaps:
