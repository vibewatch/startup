companyProfile:
  summary: >-
    Intersect Power is a Google-owned clean-energy infrastructure platform that combines utility-scale solar PV, battery
    storage, and co-located power campuses for hyperscale and other large industrial loads. The public record supports
    meaningful project-finance scale and execution capability, but it also shows a split perimeter after the Google
    acquisition, inconsistent headquarters language, and no current public disclosure of revenue, margins, customer
    count, or standalone post-close economics.
