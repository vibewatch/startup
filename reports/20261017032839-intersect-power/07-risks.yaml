slug: intersect-power
runDate: 2026-10-17
company:
  name: Intersect Power
chapter:
  number: 7
  title: Risks
  summary: >-
    Intersect Power's highest residual risks are regulatory path dependence for co-located
    generation and load, delivery against an aggressive infrastructure schedule, and concentration
    around Google after the acquisition. Demonstrated battery-financing execution is a mitigation,
    but the Google/IPX boundary and the absence of project-level legal, incident, and financing
    disclosures keep the underwriting case diligence-dependent.
sections:
  - id: risk-ranking
    title: Regulatory path dependence and delivery scale dominate the risk ranking
    body: >-
      The leading risk is the absence of a standardized path for integrating new large loads with
      co-located generation. Utility Dive reported uncertainty around tariffs for co-located load
      and quoted Intersect describing the interconnection process as laborious, unpredictable, and
      semi-discretionary. That process risk matters because Google's December 2024 schedule called
      for a first phase in 2026 and completion in 2027, while the partnership contemplated $20
      billion of renewable generation and storage. The source does not confirm that the 2026
      milestone has been achieved. Regulatory delay therefore compounds schedule, capital, and
      customer-concentration exposure rather than remaining an isolated compliance issue.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Legal exposure is defined by open rulemaking and an incompletely disclosed deal perimeter
    body: >-
      Google's proposed safeguards provide a mitigation framework, not evidence of final approval:
      co-location should avoid identifiable cost shifting, preserve grid reliability, and use
      commitment-backed load forecasts. A separate legal and contractual risk arose when IPX was
      carved out after the sale of Intersect to Google. Public reporting values Google's purchase
      at $4.75 billion including assumed debt and the combined acquisition and spinout at $12
      billion of enterprise value, but neither number explains permit ownership, contract
      assignment, consent rights, or liability allocation. Those transaction values are not
      operating liquidity. Direct permit, court, enforcement, environmental, and safety records
      are missing from the assigned evidence and remain diligence requirements rather than evidence
      that no issue exists.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007
      - CR009
      - CR010
    tableRefs:
      - TR001
  - id: operational-financial
    title: Proven battery execution only partly offsets a larger delivery and capital challenge
    body: >-
      Intersect's company-issued releases provide tangible execution evidence: an $837 million
      financing supported construction and operation of 1 GWh across three standalone battery
      systems, and the company said nearly 1 GWh was completed in one year. The same materials also
      described a 2025 plan for another 4 GW of solar and 10 GWh of storage representing roughly
      $9 billion of assets. That plan is a historical company target, not proof of delivery by the
      run date. Likewise, Multiples' estimate of $1.8 billion raised over four rounds is funding
      history, not cash available after the acquisition. Staffing visibility is weaker still: a
      jobs aggregator's 201-500 range does not establish current post-close operating capacity.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR002
  - id: dependencies-and-triggers
    title: Google concentration and the IPX separation create linked counterparty risks
    body: >-
      Google was positioned as anchor offtaker when Intersect developed assets in regions of
      interest, and Intersect's current homepage centers the business on infrastructure for AI.
      The acquisition strengthens demand alignment but makes project timing, siting, and economics
      unusually dependent on one strategic owner and customer. At the same time, IPX says the
      carved-out portfolio holds 4.4 GW of solar and 8.8 GWh of battery storage in construction or
      operation across California and Texas. Investors should therefore require an asset-and-
      contract map before attributing legacy scale, financing capacity, or customer diversification
      to the acquired Intersect business. Thesis-break triggers are failure to evidence a repeatable
      tariff path, an unremedied first-project schedule miss, opaque post-close contract allocation,
      or financing terms that materially increase merchant or covenant exposure.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR016
    tableRefs:
      - TR003
