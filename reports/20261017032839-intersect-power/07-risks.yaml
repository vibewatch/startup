      whyItMatters: Portfolio scale and financing execution do not establish reliability, safety, or security performance, and absence from this pool is not proof of no incidents.
      diligencePath: Request incident logs, outage and availability metrics, safety statistics, applicable reliability filings, and cybersecurity or operational-control assurance materials.
