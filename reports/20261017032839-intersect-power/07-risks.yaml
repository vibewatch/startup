callouts:
  - calloutType: risk
    title: The regulatory schedule is the primary kill criterion
    body: >-
      The investment case should pause if the first project cannot document an approved,
      financeable tariff and interconnection path or if an unremedied schedule miss undermines the
      claimed speed advantage of co-location.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
  - calloutType: recommendation
    title: Underwrite the entity boundary before crediting legacy scale
    body: >-
      Require a contract-and-asset map that distinguishes acquired Intersect from IPX before
      assigning portfolio capacity, customers, financing access, or operating liabilities to the
      investment thesis.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
