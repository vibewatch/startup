    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Anchor demand and strategic control
        - Google
        - Anchor offtake, data-center siting, and owner of acquired Intersect
        - High
        - Google changes location, schedule, load, or commercial requirements.
        - High
        - Ownership and anchor demand align customer and developer incentives.
        - High
      - - Asset and contract separation
        - Google and IPX
        - Allocation of digital-power and grid-tied assets after the transaction
        - High
        - Legacy scale, permits, financing rights, or customer contracts sit outside the underwritten entity.
        - High
        - IPX launched with a disclosed operating portfolio and leadership continuity.
        - Medium-high
      - - Construction and project capital
        - Lenders, tax-equity providers, and sponsors
        - Funding capital-intensive renewable and storage projects
        - Medium
        - Future capital is slower, more expensive, or more merchant-exposed than historical packages.
        - High
        - Intersect has demonstrated one $837 million BESS financing and rapid completion claims.
        - Medium-high
    notes: Funding raised, transaction enterprise value, and project financing are distinct measures and none is treated as unrestricted cash available after the Google acquisition.
