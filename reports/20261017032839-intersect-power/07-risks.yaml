        - Tariff uncertainty and a nonstandard interconnection process were reported in December 2024.
        - High
        - High
        - Standardized frameworks and faster studies have been advocated but are not evidenced as approved.
        - High
        - Obtain the applicable tariff, queue position, completed studies, upgrade obligations, and regulator correspondence.
      - - Grid reliability and infrastructure cost allocation
        - Google, utilities, and ratepayers
        - Google urged reliability review, no identifiable cost shifting, and commitment-backed load forecasts.
        - Medium
        - High
        - Tie new load to new generation and demonstrate financially committed demand before system planning.
        - Medium-high
        - Review reliability studies, cost-allocation decisions, and financial commitments for the first energy park.
      - - Acquisition and IPX spinout allocation
        - Google, IPX, and legacy counterparties
        - The carveout and transaction values are public, but detailed asset, permit, contract, and liability schedules are not.
        - Medium
        - High
        - Management and investor continuity at IPX may support transition execution.
        - Medium-high
        - Review purchase, transition-service, contract-assignment, consent, permit, and indemnity schedules.
    notes: Ratings are qualitative investment judgments based on the cited public evidence; the assigned pool does not establish permit-by-permit, litigation, enforcement, environmental, or safety status.
