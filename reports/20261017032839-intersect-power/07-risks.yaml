    rows:
      - - First energy-park schedule slips
        - A December 2024 forecast targeted first-phase operation in 2026 and full completion in 2027; current completion proof is absent.
        - High
        - High
        - Early
        - High
        - Require current milestone, commissioning, and contingency evidence; an unremedied schedule miss breaks the near-term thesis.
      - - Multigigawatt construction plan exceeds execution capacity
        - Intersect described a 2025 plan for 4 GW of solar and 10 GWh of storage representing about $9 billion of assets.
        - Medium
        - High
        - Partial
        - Medium-high
        - Track notice-to-proceed, procurement, EPC staffing, budget variance, and achieved commercial-operation dates.
      - - Reliability, outage, safety, or cyber controls are not independently evidenced
        - The assigned evidence contains portfolio and financing claims but no dedicated incident, assurance, or safety record.
        - Unknown
        - High
        - Unverified
        - Unquantified
        - Require outage history, safety metrics, operating controls, and applicable cyber or reliability assurance materials.
      - - Post-close organizational bandwidth is insufficient
        - WFH Team reports a 201-500 employee range, but its undated estimate does not establish the current Intersect/IPX workforce split.
        - Medium
        - Medium
        - Unverified
        - Medium
        - Obtain the current organization chart, key-person coverage, hiring plan, and EPC and operations staffing by entity.
    notes: Company targets and third-party staffing estimates are not treated as achieved capacity; missing incident data is an evidence gap, not evidence of zero incidents.
    claimRefs:
      - CR004
      - CR011
      - CR012
      - CR013
      - CR015
