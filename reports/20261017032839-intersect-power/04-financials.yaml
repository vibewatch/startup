artifact: financials
slug: intersect-power
runDate: '2026-10-17'
company:
  name: Intersect Power
chapter:
  number: 4
  title: Financials
  summary: Intersect's public financial story is asset- and financing-led rather than revenue-led. Official and third-party sources show a capital-intensive model in which Intersect finances and develops co-located power assets with Google as anchor offtaker, but the public record still omits the revenue, margin, cash, and runway detail needed for full underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization surface
    body: >-
      Intersect's disclosed monetization looks like contracted infrastructure
      development rather than software subscription revenue. The December 2024
      Google/TPG partnership states that Intersect will build new clean energy
      assets while Google serves as anchor offtaker for newly constructed
      data-center campuses, so the commercial engine is asset delivery plus
      long-lived power offtake rather than publicly posted seat pricing or a
      self-serve tariff. Intersect's own site and partnership materials also
      frame the company as a developer-owner-operator of grid-tied clean energy
      resources and co-located facilities for large industrial loads, which is
      consistent with a project-finance model where customer economics are
      embedded in contracts and financing structures rather than disclosed list
      prices. Public evidence does show where revenue should come from—Google-linked
      energy parks, grid-tied solar and storage, and historical project
      monetization—but not the realized price, contract duration, escalation,
      or merchant-versus-contracted mix that would determine quality of revenue.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI014
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: capital-structure
    title: Capital structure and financing dependency
    body: >-
      The strongest public evidence is around capital formation. Intersect
      disclosed an additional funding round of more than $800 million led by
      TPG Rise Climate and Google in late 2024, while earlier financing
      disclosures show the business also depends on large project-level
      structures: $2.6 billion of 2021 commitments spanning construction
      financing, tax equity, land financing, and term debt, plus $837 million
      of 2024 BESS project financing. That pattern matters because it suggests
      scale advantages and financing sophistication, but it also means growth
      depends on continued access to equity, debt, tax equity, and
      counterparties willing to fund assets before operating cash flow is
      visible. The March 2026 Google acquisition further confirms that value
      realization can arrive via strategic control transactions rather than
      only through steady disclosed operating earnings, while the simultaneous
      IPX spin-out shows the asset perimeter itself changed materially after
      the sale.
    claimRefs:
      - CI007
      - CI008
      - CI010
      - CI011
      - CI012
      - CI016
  - id: unit-economics
    title: Unit economics proxies and missing underwriting inputs
    body: >-
      Public unit-economics data remain thin. The chapter pool supports proxy
      analysis—asset scale, financing size, customer categories, and
      management's stated preference for shorter-tenor offtake plus
      portfolio-level financing—but it does not disclose revenue, EBITDA,
      gross margin, CAC, payback, cash balance, or runway. That means
      diligence has to shift from classic SaaS-style metrics toward
      infrastructure-specific requests: contracted percentage of output, hedge
      policy, offtake tenor and escalation, DSCR and tax-equity timing, capex
      per MW/MWh, and project-level IRR by asset class. Even the operational
      model carries caveats: Facilities Dive reports that near-term deployments
      may still need gas-fired backup generators, and Enki's analysis
      highlights added construction, tariff, and interconnection risk once
      Google moves from buyer to owner-operator. Those are not fatal flaws,
      but they do mean public sources support only a directional view of
      revenue quality and margin path.
    claimRefs:
      - CI008
      - CI009
      - CI013
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI003
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Financially, Intersect looks like a differentiated clean-infrastructure
      platform with demonstrated access to strategic capital, sophisticated
      project finance, and a buyer-backed commercialization path for
      co-located power assets. The evidence is strong enough to support a view
      that the company can raise and deploy very large amounts of capital, but
      not strong enough to underwrite present revenue quality, margin
      durability, or standalone liquidity after the Google transaction and IPX
      separation. The underwriting stance should therefore be conditional:
      attractive if diligence confirms contract coverage, project-level
      returns, and post-spin cash governance; still blocked if management
      cannot produce segment revenue, backlog, merchant exposure, and runway
      data.
    claimRefs:
      - CI001
      - CI007
      - CI010
      - CI014
      - CI016
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Google-linked energy parks
        - Intersect builds co-located clean energy assets; Google is the anchor offtaker for new data-center campuses
        - GW-scale projects
        - $20B targeted infrastructure program; first project financing underway, operational target 2026 and full completion 2027
        - Officially disclosed strategy, but realized pricing and contract structure remain undisclosed
        - Provide signed offtake terms, tenor, escalation, curtailment provisions, and contracted output by site
      - - Grid-tied solar + storage portfolio
        - Develop, own, and operate grid-tied solar PV and BESS resources for energy markets and industrial loads
        - GW / GWh
        - Base portfolio of 2.2 GW solar PV and 2.4 GWh storage in operation or construction; additional 4 GW solar PV and 10 GWh storage planned in 2025
        - Capacity is public; revenue conversion and merchant exposure are not
        - Break out contracted revenue by project, hedge coverage, and expected COD-to-cash timeline
      - - Historical project monetization
        - Project development plus sale/transfer of contracted assets and financing value creation
        - Project / transaction
        - Google acquired Intersect for $4.75B including debt assumption; spin-out moved other assets into IPX
        - Demonstrates strategic exit value, not ongoing revenue run-rate
        - Share post-acquisition segment perimeter, transfer pricing, and continuing earnings rights
      - - IPX spin-out assets
        - Grid-tied operating and construction assets continued in a separate independent power producer
        - GW / GWh
        - IPX launched with 4.4 GW solar PV and 8.8 GWh battery storage in construction or operation
        - Useful for perimeter clarity, but not a direct readthrough to Google-owned Intersect cash flow
        - Provide separation agreement, retained economics, and any shared-services or offtake links
    notes: Public sources disclose commercialization pathways and asset scale, but not realized revenue by stream. Null-like descriptions in this table mean the chapter found no public pricing, contract term, or margin disclosure for that stream.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI010
      - CI012
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Google anchor offtake for co-located parks
        - No public tariff, strike price, or capacity payment disclosed
        - Contract duration, escalation, curtailment economics, and merchant exposure are all undisclosed
        - PowerAlliance release; Facilities Dive follow-up
      - - Shorter-tenor offtake + portfolio financing
        - Management describes an actively managed structure rather than standard long-term fixed offtake
        - No public hedge ratios, tenor ladder, or realized spread data
        - PR Newswire 2021 financing release
      - - Battery storage monetization
        - Management says BESS economics capture value during volatility and elevated prices
        - No public utilization, spread, degradation, or gross-margin data
        - Intersect Energy Risk award release
      - - Corporate/project equity funding
        - More than $800M round led by TPG Rise Climate and Google supports platform build-out
        - No public valuation step-up, dilution, or preferred terms disclosed
        - PowerAlliance release; Multiples profile
    notes: Intersect does not publish a list-price card in the assigned source pool. This table therefore records only the monetization mechanisms and the specific economics still missing from public evidence.
    claimRefs:
      - CI003
      - CI007
      - CI009
      - CI011
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue
        - Undisclosed in reviewed public sources
        - Low
        - Required to bridge asset scale into actual earnings power
        - Provide audited revenue by segment, project, and customer class
      - - EBITDA / gross margin
        - Undisclosed in reviewed public sources
        - Low
        - Separates contracted infrastructure quality from low-margin construction throughput
        - Provide gross margin by asset class and consolidated EBITDA bridge
      - - CAC / sales efficiency
        - No direct public CAC metric; commercial motion is project origination plus anchor-tenancy procurement
        - Low
        - This is not a self-serve model, so commercial efficiency sits in development cycle, win rate, and permitting speed
        - Provide development cost per MW won, cycle time by project, and BD spend
      - - Payback / IRR
        - Undisclosed publicly
        - Low
        - Capital recovery determines whether scale translates into equity value
        - Provide project IRR, DSCR, leverage, and payback by solar, storage, and co-located sites
      - - Capex intensity
        - 'Public proxies only: ~$9B of 2025 planned assets, $837M of 2024 BESS financing, and $2.6B of 2021 commitments'
        - Medium
        - Shows the model is capital hungry before cash generation is visible
        - Provide capex per MW/MWh, EPC contingency, and interconnection spend
      - - Working capital / runway
        - Cash balance and runway not publicly disclosed
        - Low
        - Liquidity can tighten even when project finance is available
        - Provide unrestricted cash, debt maturities, equity commitments, and tax-equity timing
      - - Revenue quality
        - Appears to mix strategic offtake, project finance, and market-exposed storage economics
        - Medium
        - Determines stability of cash flows and downside protection
        - Provide contracted share of output, hedge policy, merchant revenue share, and counterparty concentration
    notes: Confidence reflects how directly the assigned public sources answer each metric. “Undisclosed” means the chapter found no explicit public figure in the retained pool, not that the metric is unknowable in private diligence.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI011
      - CI014
      - CI015
      - CI016
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence points to a capital-funded infrastructure loop rather than a publicly disclosed price-list model.
    data:
      nodes:
        - id: capital
          label: Capital inputs
          value: 2024 growth equity; 2021 project finance; 2024 BESS finance
          detail: More than $800M growth funding plus large project-finance commitments fund asset build-out before operating cash flow is visible.
        - id: develop
          label: Develop / own / operate assets
          value: Grid-tied and co-located clean energy
          detail: Intersect describes itself as a developer-owner-operator of grid-tied resources and co-located facilities for large industrial loads.
        - id: offtake
          label: Customer / offtake structure
          value: Google anchor tenant + utilities / corporate buyers
          detail: Google provides anchor offtake for co-located parks, while IPX serves utilities, community choice aggregators, corporate buyers, and energy service providers.
        - id: buildout
          label: Asset delivery scale
          value: 2.2 GW + 2.4 GWh base; 4 GW + 10 GWh planned
          detail: Public disclosures emphasize capacity build-out and financing milestones rather than income-statement metrics.
        - id: finance
          label: Financial model
          value: Shorter-tenor offtake + portfolio finance
          detail: Management highlights shorter-tenor offtake, project finance, tax equity, and portfolio-level debt rather than a simple fixed-price template.
        - id: underwrite
          label: Public underwriting output
          value: Directional only
          detail: Revenue, EBITDA, gross margin, CAC, payback, cash balance, and runway remain undisclosed in the reviewed public source set.
    approximationNotes: The bridge is conceptual and uses disclosed milestones, capacities, and financing structures rather than reported revenue amounts because the assigned public sources do not publish those values.
    claimRefs:
      - CI003
      - CI004
      - CI008
      - CI009
      - CI011
      - CI013
      - CI014
