  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: segment-revenue
      missingEvidence: Segment revenue, EBITDA, gross margin, and backlog for Google-linked data-center energy parks versus other asset classes.
      whyItMatters: Without segment economics, the chapter cannot distinguish strategic headline value from durable cash generation or judge whether the co-located model earns superior returns.
      diligencePath: Request the latest management reporting pack with revenue, gross margin, EBITDA, backlog, and COD schedule by project family.
    - type: private-evidence-only
      severity: material
      topic: contract-terms
      missingEvidence: Actual offtake agreements, tenor ladders, escalation clauses, merchant exposure, and hedge policy for Intersect and any continuing shared economics with IPX.
      whyItMatters: Revenue quality depends on counterparty concentration, contracted share of output, and exposure to basis, curtailment, and commodity volatility.
      diligencePath: Obtain sample PPAs/offtake contracts, hedge summaries, and board materials on contract coverage and merchant risk.
    - type: private-evidence-only
      severity: material
      topic: liquidity-runway
      missingEvidence: Current unrestricted cash, debt maturities, tax-equity timing, covenant package, and project-level DSCR/IRR.
      whyItMatters: Large project pipelines can remain equity-destructive if liquidity, leverage, or tax-equity timing misaligns with COD and cash generation.
      diligencePath: Request the latest liquidity forecast, debt schedule, covenant calculations, and project-level financing models.
