  rows:
  - - Co-located AI data-center energy parks
    - On-site or adjacent clean generation, storage, land preparation, and campus power infrastructure
    - Pure colocation leases, off-site renewable credits, and grid-only siting
    - Hyperscalers / anchor tenants funding campus build-out
    - Core digital-power wedge described in the Google/TPG partnership
  - - Grid-tied utility-scale solar + storage IPP assets
    - Solar PV, battery storage, interconnection-ready projects, and long-lived operating assets
    - Merchant-only project trading without long-term asset ownership
    - Utilities, CCAs, and investors procuring delivered power capacity
    - Still relevant because the post-deal IPX portfolio preserves the legacy grid-tied business
  - - Large-load corporate clean-power supply
    - Dedicated clean power for energy-intensive industrial users and corporate buyers
    - Generic ESG procurement that does not require co-located infrastructure
    - Large corporate buyers and energy service providers
    - Extends the model beyond a single hyperscaler customer
  - - Adjacent industrial loads
    - E-fuels and other energy-intensive products named in Intersect materials
    - Unrelated industrial capex with no direct power-siting dependency
    - Industrial developers pairing load with generation
    - Shows the market boundary includes other large-load use cases but remains power-infrastructure led
  notes: Boundary table synthesized from official and third-party descriptions; excluded categories mark substitutes or adjacent spend rather than unsupported market-share estimates.
