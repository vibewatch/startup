callouts:
- calloutType: insight
  title: Near-term SAM is infrastructure-constrained, not awareness-constrained
  body: The disclosed opportunity is large, but the practical serviceable market is bounded by how fast Intersect can secure transmission-light sites, financing, and reliability solutions rather than by abstract decarbonization demand alone.
  claimRefs:
  - CM002
  - CM003
  - CM009
  - CM014
- calloutType: risk
  title: Buyer budgets remain under-specified outside the Google-led use case
  body: Public sources identify buyer archetypes, but they do not disclose who owns procurement budgets, contract terms, or payback thresholds for non-Google deployments, which weakens bottoms-up market sizing.
  claimRefs:
  - CM007
  - CM013
  - CM014
