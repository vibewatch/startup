company:
  name: Intersect Power
chapter:
  number: 2
  title: Market Analysis
  summary: 'Intersect Power is pursuing the intersection of hyperscale data-center load and utility-scale clean generation, not a generic solar-developer TAM. The public record provides directional sizing lenses rather than a clean TAM/SAM/SOM stack: the Google/TPG partnership targets $20 billion of infrastructure, IPX cites 250 GW of U.S. power need by 2030, and Intersect''s disclosed portfolio/build plan anchors what it can realistically serve. Adoption is driven by transmission scarcity and AI-led load growth, but constrained by capital intensity, reliability requirements, and still-opaque buyer budgets.'
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'Intersect''s practical market boundary is the development of co-located clean-power campuses for large industrial loads, especially AI-linked data centers, not a generic bucket of renewable-energy spend. The company''s own materials frame the offering around bringing new load directly to clean generation without new transmission, while third-party summaries describe a vertically integrated model that pairs industrial demand with dedicated renewable generation and, where needed, gas backup. That makes the relevant substitute set broader than utility-scale solar developers alone: incumbent status-quo options include off-site power purchase agreements, grid-dependent data-center siting, and conventional long-term offtake structures that Intersect argues can destroy value. As a result, market attractiveness depends on whether co-location solves speed-to-power and interconnection pain faster than those legacy procurement paths.'
  claimRefs:
  - CM001
  - CM003
  - CM006
  - CM012
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Evidence-constrained sizing and adoption lenses
  body: The public evidence is strong enough to bound demand and supply lenses, but not to calculate a defensible TAM/SAM/SOM waterfall. On the demand side, the partnership with Google and TPG is pitched as a pathway to gigawatts of data-center capacity and $20 billion of renewable-power investment by decade end, while IPX says the U.S. economy needs 250 GW of additional power by 2030. On the supply side, Intersect disclosed a 2.2 GW solar and 2.4 GWh storage base portfolio plus a 2025 plan for another 4 GW and 10 GWh, and the post-acquisition spin-out started with 4.4 GW and 8.8 GWh already under construction or operating. Those are useful sizing lenses because they tie market demand to actual deliverable assets and timelines, but they still stop short of a bottoms-up serviceable market by site count, buyer budget, or geography.
  claimRefs:
  - CM002
  - CM008
  - CM009
  - CM010
  - CM011
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyers-drivers-and-constraints
  title: Buyer map, adoption drivers, and constraints
  body: 'Public disclosures identify several buyer archetypes, but only one highly specific adoption path: Google as anchor tenant for newly constructed co-located campuses. Beyond that flagship relationship, Intersect/IPX names utilities, community choice aggregators, large corporate buyers, and energy service providers, which suggests the platform spans both grid-tied power buyers and large-load customers. The main adoption driver is speed: co-location is marketed as a way to reduce transmission build requirements and bring new generation online on data-center timelines. The key constraints are equally clear. Intersect''s own history shows the model is financing-heavy, and independent coverage notes that even attractive renewable-resource regions may still need grid power or gas-fired backup until storage duration and outage mitigation improve. That leaves a real diligence gap around who owns the budget and procurement workflow outside the Google-led use case.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM007
  - CM013
  - CM014
  tableRefs:
  - TM003
