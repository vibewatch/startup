      severity: material
      topic: headquarters / TO002
      missingEvidence: An authoritative current headquarters and office-footprint statement from the company or parent.
      whyItMatters: Conflicting location language complicates identity, hiring, and jurisdiction analysis in later chapters.
      diligencePath: Confirm current registered principal office and operating headquarters in diligence materials or parent-company integration documents.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]
