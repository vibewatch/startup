company:
  name: Intersect Power
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Intersect Power is now a Google-owned clean-energy infrastructure platform positioned around
    co-located power and data-center development, with official materials emphasizing AI-linked
    energy delivery and public deal coverage clustering the acquisition at roughly $4.75B-$4.8B.
    The chapter evidence supports scale and milestone claims, but current revenue, customer count,
    headcount, board composition, and even canonical headquarters language remain incompletely
    disclosed or internally inconsistent across public sources in the assigned pool.
sections:
  - id: identity-stage-and-model
    title: Identity, stage, and operating perimeter
    body: |-
      Intersect presents itself as a builder of large-scale clean-energy and data-center infrastructure rather than a pure project developer. Its official pages describe a co-located model that pairs industrial demand with renewable generation and firming sources so that power can be delivered faster than a grid-only buildout would allow. That positioning matters because later chapters can treat the company as infrastructure-led and AI-adjacent, not as a software or marketplace business.

      The company's current stage is clearer than many of its private-company operating metrics. Official materials say Google acquired Intersect in March 2026, while Intersect's solutions page adds that IPX Power assumed ownership of a portion of Intersect's solar and storage assets in operation and development. Taken together, the available evidence supports a post-acquisition structure in which Google owns the Intersect platform oriented around co-located energy-and-compute projects, while IPX retained a separate grid-tied operating portfolio backed by pre-existing investors.
    claimRefs: [CO001, CO002, CO003, CO015]
    tableRefs: [TO001]
  - id: leadership-capital-and-control
    title: Leadership, capital base, and stakeholder map
    body: |-
      Founder Sheldon Kimber remains the central named executive in the assigned source set. Intersect's official about page lists Kimber as founder and chief executive officer alongside named commercial, finance, operating, technology, and administrative leaders, while third-party deal summaries say Intersect would continue under Kimber after the Google transaction. That continuity is useful for later diligence, but it also creates visible key-person dependence because the public record here is thin on broader board structure, committee oversight, or post-acquisition control mechanics.

      Capital formation is partly visible but not precise enough to collapse into a single undisputed funding number without qualification. Multiples reports $1.8B raised across four rounds before acquisition, while the same profile also summarizes a 2025 secondary sale and rounds in 2017, 2021, 2022, and 2024. Public acquisition-value language is similarly close but not perfectly aligned: Introl cites $4.75B in cash plus debt assumption, whereas Multiples rounds the transaction to $4.8B. Those figures are directionally consistent and sufficient for a high-level overview, but exact equity value, assumed debt, and rollover economics remain diligence asks.
    claimRefs: [CO004, CO005, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-open-gaps
    title: Scale indicators, milestone path, and unresolved gaps
    body: |-
      Public sources support a meaningful operating-scale narrative even though classic software-style KPIs are absent. Intersect's solutions page claims more than $20B of infrastructure operating or under construction and 11.5 GW+ of clean-energy capacity across 14 facilities, while older company-issued financing materials show that Intersect had already assembled multi-gigawatt solar, storage, and green-hydrogen pipelines before the Google deal. The same official page cites the Oberon facility as a delivered proof point, supporting the view that the company had real build-and-finance execution before its AI-infrastructure repositioning accelerated.

      The milestone arc is therefore legible: a 2016 founding, project-finance scale-up by 2021, a large growth-equity round in 2022, the Google/TPG strategic partnership in late 2024 and early 2025, acquisition agreement in December 2025, IPX spin-out in March 2026, and Quantum project operations beginning in June 2026. What remains unresolved is just as important: no assigned source gives current revenue, run-rate, customer count, or headcount, official pages in the pool do not settle headquarters language, and third-party analysis still flags interconnection and regulatory process risk for co-located projects. Those gaps limit how confidently a reader should treat any narrative of scale beyond asset and financing milestones.
    claimRefs: [CO006, CO007, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
