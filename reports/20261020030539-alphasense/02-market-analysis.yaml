figures:
  - id: "FM001"
    title: "Market sizing and observed adoption-scale evidence ladder"
    type: "pyramid"
    summary: >-
      Six ordered evidence layers separate broad forecasts, adjacency estimates, company scale,
      and the unresolved company-specific SAM/SOM.
    data:
      items:
        - label: "Broad market-intelligence software forecast"
          value: 28.96
          unit: "USD billions, 2033"
          note: "IntuitionLabs cites an 11.2% CAGR from 2025; underlying category methodology is unavailable."
          tone: "neutral"
          claimRefs: ["CM010"]
        - label: "Business-intelligence and analytics adjacency"
          value: 15
          unit: "USD billions+"
          note: "Sacra estimate; broader than AlphaSense's directly addressable market."
          tone: "neutral"
          claimRefs: ["CM009"]
        - label: "Core financial and market-intelligence estimate"
          value: 13
          unit: "USD billions annually"
          note: "Sacra estimate; exact estimate year and bottom-up methodology are not stated."
          tone: "neutral"
          claimRefs: ["CM008"]
        - label: "Broad market-intelligence software baseline"
          value: 12.38
          unit: "USD billions, 2025"
          note: "IntuitionLabs cites the same industry forecast used for the 2033 endpoint."
          tone: "neutral"
          claimRefs: ["CM010"]
        - label: "AlphaSense company-scale proxy"
          value: 0.7
          unit: "USD billions ARR, Q2 2026"
          note: "Company-reported ARR; not market size, revenue, or a market-share calculation."
          tone: "positive"
          claimRefs: ["CM011"]
        - label: "Dated customer-scale observation"
          value: 7800
          unit: "customers, August 2026"
          note: "Company-reported worldwide customer count in the dated August 27 release."
          tone: "positive"
          claimRefs: ["CM012"]
        - label: "Current undated customer-scale claim"
          value: 8000
          unit: "enterprise customers+"
          note: "Current company product page; publication date is not shown in the retained text."
          tone: "neutral"
          claimRefs: ["CM013"]
        - label: "Company-specific SAM and SOM"
          value: "Not disclosed"
          unit: "No defensible value"
          note: "Requires eligible-account counts, seat density, pricing, geography, and attainable penetration."
          tone: "warning"
          claimRefs: ["CM008", "CM009", "CM010", "CM011"]
    approximationNotes: >-
      Layer order expresses evidence scope, not mathematical nesting or value-proportional
      width. Market values, ARR, and customer counts use different units and cannot be added,
      divided, or treated as a conversion funnel.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM012", "CM013"]
callouts:
  - calloutType: "risk"
    title: "Do not capitalize the headline TAM"
    body: >-
      Broad category forecasts and adjacency estimates do not establish AlphaSense's serviceable
      market or attainable share. Valuation should separate observed ARR and customer scale from
      the still-unverified SAM/SOM bridge.
    claimRefs: ["CM008", "CM009", "CM010", "CM011", "CM012", "CM013"]
