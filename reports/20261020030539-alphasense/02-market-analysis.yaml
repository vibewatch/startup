  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "market-size"
      missingEvidence: >-
        A bottom-up SAM/SOM model with eligible account counts, seat density, realized pricing,
        geographic scope, product eligibility, and attainable penetration.
      whyItMatters: >-
        Broad category estimates cannot support a company-specific revenue ceiling or market-share
        calculation without a comparable denominator.
      diligencePath: >-
        Obtain management's market model and cohort-level bookings by segment and geography,
        then reconcile it against independently sourced account and seat populations.
      relatedQuestionRefs: ["QM003"]
      relatedTableRefs: ["TM002"]
    - type: "conflicting-data"
      severity: "minor"
      topic: "customer-scale"
      missingEvidence: >-
        A dated disclosure reconciling the August 2026 figure of 7,800 customers with the
        undated current product-page claim of more than 8,000 enterprise customers.
      whyItMatters: >-
        The direction is consistent with growth, but the undated page cannot establish the
        timing or exact magnitude of net customer additions.
      diligencePath: >-
        Request the quarter-end customer series, customer definition, and gross and net adds
        through the run date.
      relatedQuestionRefs: ["QM008"]
    - type: "missing-source"
      severity: "material"
      topic: "buyer-economics"
      missingEvidence: >-
        Independent procurement data on budget ownership, implementation cost, payback period,
        switching cost, renewal rate, and deployment duration by customer segment.
      whyItMatters: >-
        Price points alone do not show adoption friction, return on investment, or retention
        durability.
      diligencePath: >-
        Review anonymized contracts and renewal cohorts, interview buyers in each segment, and
        benchmark total cost against incumbent-tool displacement.
