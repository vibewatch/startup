company:
  name: "AlphaSense"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    AlphaSense competes across market intelligence, financial-data research, enterprise
    knowledge search, and AI workflow automation. Available evidence supports a large,
    growing category and substantial company scale, but it does not isolate a defensible
    company-specific SAM or SOM, so broad market forecasts should not be treated as directly
    addressable revenue.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      AlphaSense's relevant market is narrower than all business intelligence software but
      broader than document search alone. The core boundary is enterprise subscription spend
      for licensed market and financial content, expert transcripts, search and synthesis,
      internal-knowledge integration, and research-workflow software. Adjacent spend includes
      structured financial data and automation that moves analysis into Excel, PowerPoint, and
      recurring monitoring. The boundary excludes execution-oriented terminals, pure SEO or
      social-listening products, and standalone expert-call services unless they are part of
      the same research workflow. Status-quo substitutes remain material: buyers can combine
      general-purpose AI, incumbent terminals, news databases, internal search, and manual
      analyst work. This definition avoids counting every analytics or generative-AI dollar as
      addressable to AlphaSense.
    claimRefs: ["CM001", "CM002", "CM003"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing lenses and the unresolved SAM/SOM"
    body: >-
      Independent estimates provide directional scale, not a clean TAM/SAM/SOM stack. Sacra
      estimates AlphaSense's core financial and market-intelligence market at $13 billion
      annually and identifies a $15 billion-plus business-intelligence and analytics adjacency,
      but does not publish a bottom-up methodology in the retained text. IntuitionLabs cites a
      separate industry forecast that expands from $12.38 billion in 2025 to $28.96 billion in
      2033 at an 11.2% CAGR; its category boundaries are also not reproduced. AlphaSense's
      dated disclosure of more than $700 million ARR in Q2 2026 is useful only as a company
      scale proxy. It is not market revenue, and dividing it by any broad estimate would imply
      false comparability. Geography, eligible buyer counts, seat density, willingness to pay,
      and attainable penetration remain undisclosed.
    claimRefs: ["CM008", "CM009", "CM010", "CM011"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      The user base spans financial-services analysts, corporate strategy and development
      teams, and professional-services researchers. Sacra describes investment analysts,
      portfolio managers, and hedge-fund analysts as the initial core users, while AlphaSense
      now positions the platform for corporations and consultancies as well. The practical
      adoption path is land-and-expand: a research-intensive team first buys faster discovery
      and synthesis, then broader deployments add internal content, monitoring, structured
      data, and workflow outputs. Sacra's estimated $10,000-$20,000 annual seat range and
      $50,000-$100,000-plus typical enterprise deals indicate departmental or enterprise
      budget ownership rather than individual self-serve purchasing. However, public evidence
      does not identify approval thresholds, implementation costs, payback periods, or renewal
      cohorts.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM012", "CM013"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation"
    title: "Growth drivers, adoption constraints, and valuation relevance"
    body: >-
      Market growth is supported by proliferating unstructured business data and enterprise
      demand for AI-assisted analysis, but adoption depends on trust as much as speed. In
      regulated or high-stakes workflows, buyers need source entitlement, current evidence,
      traceability, permission controls, and reconstructable outputs. AlphaSense's licensed
      content can therefore differentiate the product, while simultaneously creating a
      dependency on third-party licensing terms and costs. Sacra also warns that AlphaSense
      may remain supplementary to established financial-data platforms, making it vulnerable
      in budget reviews if incumbents close the AI-search gap. For valuation, the strongest
      evidence is company scale and category growth; the weakest is the bridge from broad TAM
      to serviceable buyers, durable retention, and attainable share. Those gaps warrant a
      discount to any thesis based solely on headline market size.
    claimRefs: ["CM014", "CM015", "CM016", "CM008", "CM009", "CM010", "CM011"]
