artifact: company-overview
slug: alphasense
runDate: 2026-10-20
company:
  name: AlphaSense
chapter:
  number: 1
  title: Company Overview
  summary: >-
    AlphaSense is a founder-led, late-stage private market-intelligence software company whose
    company-reported scale reached more than $600 million of ARR and 8,000+ enterprise customers
    in 2026. Its $350 million financing at a $7.5 billion valuation and expanding workflow product
    set show substantial scale, while profitability, retention, headcount, full governance, and
    content-licensing economics remain undisclosed.
sections:
  - id: identity-and-business-model
    title: Identity, stage, and business model
    body: >-
      AlphaSense was founded in 2011 by Jack Kokko and Raj Neervannan, who remain identified by
      the company as CEO and CTO, respectively. The product is positioned as an AI market-
      intelligence and workflow platform that combines domain-specific software with more than
      500 million premium business documents. Sacra describes an annual-subscription model with
      estimated per-seat pricing of $10,000-$20,000, but this is third-party analysis rather than
      a public rate card. The recent private financings support a late-stage private classification;
      they do not establish an IPO timetable. The assigned evidence does not reliably establish a
      current headquarters address, so that field remains open rather than being inferred from a
      press-release dateline.
    claimRefs: [CO001, CO002, CO003, CO011, CO012]
    tableRefs: [TO001]
  - id: scale-and-financing
    title: Scale and financing
    body: >-
      AlphaSense's July 2026 company profile claimed more than 8,000 enterprise customers. A June
      2026 Accenture announcement said AlphaSense had recently surpassed $600 million in annual
      recurring revenue and announced a $350 million round at a $7.5 billion valuation. Sacra
      separately estimated June 2026 ARR at $700 million; that estimate is not revenue recognized
      under accounting standards and should not replace the company's lower disclosed threshold.
      Sacra also reported total funding above $1 billion. These data establish commercial scale
      and financing access, but they do not reveal revenue, gross margin, cash burn, liquidity, or
      runway, and funding raised must not be treated as cash available.
    claimRefs: [CO004, CO005, CO006, CO007, CO010]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, governance, and stakeholder concentration
    body: >-
      Founder continuity is unusually visible: Kokko and Neervannan still occupy the two named
      executive roles in the assigned company profile. Sacra reported that Vitruvian partner
      Sophie Bower-Straziota joined the board after the June 2026 financing, while Accenture
      announced both an investment and a strategic partnership. This establishes some investor
      and partner influence but not a complete board, voting-control map, preference stack, or
      succession plan. The founders' continuing positions make key-person dependence a diligence
      question, not a proven operational weakness. A management interview and current cap table
      are required before drawing conclusions about control.
    claimRefs: [CO001, CO002, CO008, CO014]
    tableRefs: [TO002]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The development path combines product expansion, acquisitions, and large private financing.
      Sacra records the 2024 Tegus acquisition and a 2025 Carousel acquisition; AlphaSense then
      announced custom AI agents and AI-led expert calls in March 2026, followed by the June 2026
      Accenture partnership and financing. The assigned adverse source is a competitor-authored
      comparison, not an independent benchmark. Its argument that rivals can license similar
      external information is therefore best retained as a defensibility hypothesis: AlphaSense
      still must demonstrate that workflow, proprietary expert content, integration, and customer
      data create durable differentiation. No assigned source closes the profitability, retention,
      complete governance, headcount, or location gaps.
    claimRefs: [CO006, CO009, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
