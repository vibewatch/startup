    title: Scale is visible; operating economics are not
    body: >-
      The assigned evidence supports ARR, customer, funding, and valuation scale, but it does not
      disclose revenue recognition, margins, cash burn, runway, retention, or customer concentration.
      The competitor-authored licensing critique is a diligence hypothesis rather than an independent benchmark.
    claimRefs: [CO004, CO005, CO006, CO010, CO016]
