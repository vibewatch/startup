slug: "alphasense"
runDate: "2026-10-20"
company:
  name: "AlphaSense"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    AlphaSense reports more than $700 million of ARR and monetizes through annual
    enterprise subscriptions, credit bundles, and premium-content modules. Revenue
    quality appears attractive, but opaque realized pricing and missing margin,
    retention, cash, burn, and runway data prevent full underwriting of unit
    economics or capital adequacy.
sections:
  - id: "revenue-model"
    title: "Revenue model and revenue quality"
    body: >-
      AlphaSense is an enterprise subscription business rather than a public,
      self-serve SaaS product. The CFO described customer access through contracts
      for subscriptions and credit bundles, while AlphaSense says pricing varies
      by user count for smaller organizations and is customized at enterprise
      level. The product surface also supports expansion through premium broker
      research, expert transcripts, financial data, internal-content integration,
      and agentic workflows. AlphaSense reported that Enterprise Intelligence more
      than doubled its customer base in the year to October 2025, which is a useful
      adoption signal but not a disclosed revenue-mix measure. Annual contracts and
      modular expansion can support recurring revenue and higher account value;
      however, the retained evidence does not disclose realized price, discounting,
      product mix, revenue-recognition policy, or the split between fixed
      subscriptions and usage-linked credits.
    claimRefs: ["CI005", "CI006", "CI012", "CI016"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "pricing-and-sales-efficiency"
    title: "Pricing and sales-efficiency proxies"
    body: >-
      Published pricing is indicative rather than contractual. Sacra estimates
      annual pricing of $10,000-$20,000 per seat, average enterprise deals of
      $50,000-$100,000+, and some large accounts above $1 million. Tomba offers a
      wider $10,000-$40,000+ per-user range and says content add-ons can materially
      increase the bill, but it is a vendor promoting an alternative product and
      should be treated as adverse, low-reputation evidence rather than an
      independent benchmark. These estimates point to an enterprise sales motion
      with meaningful account values and packaging leverage, not to realized
      average selling price. Public ARR and customer growth are useful output
      proxies, yet the evidence does not reveal sales cycle, CAC, commissions,
      payback, quota productivity, gross retention, net retention, or cohort
      expansion. Those omissions prevent a reliable efficiency bridge from
      bookings to durable revenue.
    claimRefs: ["CI004", "CI007", "CI008", "CI009", "CI014", "CI016"]
    tableRefs: ["TI002"]
  - id: "scale-and-cost-structure"
    title: "Traction, cost structure, and margin path"
    body: >-
      The strongest financial disclosure is ARR. AlphaSense said it surpassed $600
      million in Q1 2026 and more than $700 million in Q2 2026; Sacra separately
      estimated $700 million in June 2026. Customer disclosures are less clean:
      an August company release cited 7,800 customers, while a July product article
      said 8,000+, so the current denominator and reporting conventions require
      reconciliation. ARR scale confirms commercial traction, but it does not equal
      GAAP revenue, cash receipts, or gross profit. The likely delivery-cost buckets
      include licensed content, model and compute usage, data ingestion, expert-call
      operations, customer support, and sales capacity, but the sources do not
      quantify any of them. Gross margin, contribution margin, capitalized
      development, working capital, and capex are therefore diligence asks rather
      than model inputs.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI013", "CI015", "CI016"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy"
    title: "Capital adequacy and financial verdict"
    body: >-
      AlphaSense raised $350 million at a $7.5 billion valuation in June 2026, and
      the CFO interview said total funding exceeded $1 billion. Those figures show
      access to capital, but funding raised is not cash available: the retained
      sources do not disclose current cash, debt, preference terms, burn, runway,
      acquisition obligations, or planned uses by amount. Capital adequacy cannot
      therefore be inferred from the financing headline. The financial verdict is
      positive on scale and recurring-contract structure, but incomplete on
      quality and self-funding capacity. Before underwriting, investors need an ARR
      definition and revenue bridge, audited revenue and gross margin, cohort
      retention, CAC/payback, content and AI cost allocation, cash and debt, and a
      forward operating plan showing the trigger for another financing. Until then,
      valuation and runway analysis should remain scenario-based rather than
      presented as precise.
    claimRefs: ["CI010", "CI011", "CI014", "CI016"]
tables:
  - id: "TI001"
    title: "Revenue streams and monetization mechanisms"
    columns: ["Stream", "Mechanism", "Pricing unit", "Public status", "Revenue-quality implication", "Diligence ask"]
    rows:
      - ["Core platform", "Annual enterprise subscription contract", "Users, seats, or organization", "Quote-only; realized price undisclosed", "Recurring contract base", "ARR definition, billed revenue bridge, renewals, and discount schedule"]
      - ["Workflow usage", "Credit bundles attached to contracts", "Credits or usage", "Offered; unit price and utilization undisclosed", "Potential expansion lever with unknown variability", "Credit consumption, breakage, overages, and recognition policy"]
      - ["Premium content", "Licensed broker research, expert transcripts, and financial-data modules", "Content package or module", "Packaging disclosed; realized module pricing undisclosed", "Can lift account value but adds content cost", "Attach rate, mix, supplier commitments, and gross margin by module"]
      - ["Enterprise Intelligence", "Internal-content integration and workflow suite", "Enterprise deployment", "Customer base more than doubled in the year to October 2025", "Land-and-expand signal, not a revenue disclosure", "Module ARR, attach rate, implementation cost, and retention"]
    notes: "Mechanisms are drawn from company statements and third-party analysis; realized pricing, mix, recognition, and margins are not publicly disclosed."
    claimRefs: ["CI005", "CI006", "CI012", "CI016"]
  - id: "TI002"
    title: "Pricing and packaging evidence"
    columns: ["Evidence", "Reported amount or model", "Status", "Qualification"]
    rows:
      - ["AlphaSense pricing page", "Varies by user count; enterprise packages customized", "Company-stated", "No public price list or realized contract data"]
      - ["Sacra seat estimate", "$10,000-$20,000 per seat annually", "Third-party estimate", "Not a disclosed AlphaSense price"]
      - ["Sacra account estimate", "$50,000-$100,000+ average enterprise deal; some above $1 million", "Third-party estimate", "Methodology and period are not disclosed in the fetched text"]
      - ["Tomba range", "$10,000-$40,000+ per user per year", "Adverse vendor estimate", "Competitor-promotional source; content add-ons and seat count drive variation"]
    notes: "Ranges are not comparable realized-price observations and should not be averaged; Tomba is a competing vendor, while Sacra is independent analysis."
    claimRefs: ["CI006", "CI007", "CI008", "CI009"]
  - id: "TI003"
    title: "Unit-economics and capital-adequacy scorecard"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["ARR", "More than $700 million in Q2 2026", "High", "Establishes recurring-revenue scale, not GAAP revenue", "ARR policy, exclusions, FX, acquisitions, and revenue reconciliation"]
      - ["Prior ARR marker", "More than $600 million in Q1 2026", "Medium", "Provides a recent growth marker", "Separate new logo, expansion, price, acquisition, and churn effects"]
      - ["Customer count", "7,800 and 8,000+ on different company pages", "Medium", "Changes ARR-per-customer denominator", "Reconcile date, active-customer definition, and acquired accounts"]
      - ["Gross margin", null, "Unavailable", "Core test of content, compute, and service-delivery economics", "Audited gross margin and COGS by platform, content, expert, and AI service"]
      - ["Retention and CAC/payback", null, "Unavailable", "Determines revenue durability and sales efficiency", "Gross and net retention, cohorts, CAC, commissions, and payback"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines financing dependency", "Cash and debt schedule, monthly burn, commitments, runway, and next-round trigger"]
    notes: "Null means the assigned public evidence did not disclose the metric; funding raised is not treated as cash available."
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI014", "CI015", "CI016"]
