  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the research job through several distinct routes. AlphaSense competes directly as an
              integrated market-intelligence platform, while Bloomberg and structured-data incumbents such as FactSet
              and S&P Capital IQ retain advantages in live market data, messaging, screening, and quantitative
              workflows. Factiva is an adjacent news-aggregation option; general-purpose AI is a rapidly improving
              substitute for basic search and summarization; and internal repositories plus manual web research remain
              the status quo. These alternatives are not interchangeable. The assigned evidence portrays Bloomberg as
              strongest for trading and public-market data, AlphaSense as strongest for licensed qualitative content and
              cited synthesis, and internal build as more controllable but fragmented. Public evidence does not
              establish comparable scale or funding for every alternative, so those cells remain unknown rather than
              estimated.
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP013
              - CP014
              - CP016
      - number: '3.2'
        title: Capability, distribution, and trust posture
        blocks:
          - type: paragraph
            body: >-
              AlphaSense's defensible bundle is broader than a document search engine. Company materials describe a
              500-million-plus-document library, broker research, expert transcripts, structured financial data, cited
              generative answers, workflow agents, and connectors for internal systems. The company also claims
              enterprise security controls including SOC 2 Type II and ISO/IEC 27001 certification, permission
              mirroring, and customer-managed key or bucket options. A company-issued release quoting the 2026 Forrester
              evaluation says AlphaSense received the highest possible score in 14 of 29 criteria, but the release is
              not an independent copy of the underlying report. Company-issued pages report at least 7,800 customers in
              2026, indicating meaningful distribution, while the evidence does not disclose comparable customer counts
              for the alternatives.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
