        min: 1
        max: 5
      points:
        - label: AlphaSense
          x: 5
          'y': 5
          detail: Licensed content, internal data, agents, models, and deliverable integrations
        - label: Bloomberg
          x: 4
          'y': 4
          detail: Broad public-market data and workflow; less private-market and agentic depth in the assigned comparison
        - label: FactSet / Capital IQ
          x: 3
          'y': 4
