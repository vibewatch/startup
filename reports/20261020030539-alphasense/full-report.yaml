    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              AlphaSense was founded in 2011 by Jack Kokko and Raj Neervannan, who remain identified by the company as
              CEO and CTO, respectively. The product is positioned as an AI market- intelligence and workflow platform
              that combines domain-specific software with more than 500 million premium business documents. Sacra
              describes an annual-subscription model with estimated per-seat pricing of $10,000-$20,000, but this is
              third-party analysis rather than a public rate card. The recent private financings support a late-stage
              private classification; they do not establish an IPO timetable. The assigned evidence does not reliably
              establish a current headquarters address, so that field remains open rather than being inferred from a
              press-release dateline.
