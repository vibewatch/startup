      - number: '4.2'
        title: Pricing and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Published pricing is indicative rather than contractual. Sacra estimates annual pricing of $10,000-$20,000
              per seat, average enterprise deals of $50,000-$100,000+, and some large accounts above $1 million. Tomba
              offers a wider $10,000-$40,000+ per-user range and says content add-ons can materially increase the bill,
              but it is a vendor promoting an alternative product and should be treated as adverse, low-reputation
              evidence rather than an independent benchmark. These estimates point to an enterprise sales motion with
              meaningful account values and packaging leverage, not to realized average selling price. Public ARR and
              customer growth are useful output proxies, yet the evidence does not reveal sales cycle, CAC, commissions,
              payback, quota productivity, gross retention, net retention, or cohort expansion. Those omissions prevent
              a reliable efficiency bridge from bookings to durable revenue.
