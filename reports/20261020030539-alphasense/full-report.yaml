      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The user base spans financial-services analysts, corporate strategy and development teams, and
              professional-services researchers. Sacra describes investment analysts, portfolio managers, and hedge-fund
              analysts as the initial core users, while AlphaSense now positions the platform for corporations and
              consultancies as well. The practical adoption path is land-and-expand: a research-intensive team first
              buys faster discovery and synthesis, then broader deployments add internal content, monitoring, structured
              data, and workflow outputs. Sacra's estimated $10,000-$20,000 annual seat range and $50,000-$100,000-plus
              typical enterprise deals indicate departmental or enterprise budget ownership rather than individual
              self-serve purchasing. However, public evidence does not identify approval thresholds, implementation
              costs, payback periods, or renewal cohorts.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Market growth is supported by proliferating unstructured business data and enterprise demand for
              AI-assisted analysis, but adoption depends on trust as much as speed. In regulated or high-stakes
              workflows, buyers need source entitlement, current evidence, traceability, permission controls, and
              reconstructable outputs. AlphaSense's licensed content can therefore differentiate the product, while
              simultaneously creating a dependency on third-party licensing terms and costs. Sacra also warns that
              AlphaSense may remain supplementary to established financial-data platforms, making it vulnerable in
              budget reviews if incumbents close the AI-search gap. For valuation, the strongest evidence is company
              scale and category growth; the weakest is the bridge from broad TAM to serviceable buyers, durable
              retention, and attainable share. Those gaps warrant a discount to any thesis based solely on headline
              market size.
