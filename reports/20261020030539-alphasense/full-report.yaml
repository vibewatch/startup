        title: Maturity, deployment, and workflow evidence
        blocks:
          - type: paragraph
            body: >-
              Product maturity is supported most directly by shipping breadth and reported usage, not by independent
              performance benchmarks. AlphaSense said Enterprise Intelligence more than doubled its customer base during
              2025 and that hundreds of enterprise clients adopted it that year. It separately reported a 33%
              quarter-over-quarter rise in generative-AI queries after launching Generative Search, Generative Grid,
              Deep Research, and AI Interviewer workflows. Those are company-reported adoption signals, not measures of
              task accuracy or retention. Independent directory and competitor commentary broadly confirms the
