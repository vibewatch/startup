  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              AlphaSense is delivered as a research workspace rather than a single search feature. Its current official
              description combines a 500M-plus-document external content universe with expert transcripts, financial
              datasets, internal enterprise content, natural-language retrieval, and cited synthesis. The practical
              workflow runs from discovering evidence to comparing documents, monitoring changes, building tables, and
              producing decks or models. Generative Search addresses ad hoc questions, Deep Research handles longer
              investigations, Generative Grid applies repeated prompts across document sets, and workflow agents package
              recurring tasks. This breadth can reduce tool switching, but buyers must verify which modules, licensed
              content, and deployment options are included in the contracted tier.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE014
