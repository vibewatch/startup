      - number: '5.4'
        title: Trust, security, and technical risk
        blocks:
          - type: paragraph
            body: >-
              AlphaSense documents enterprise controls including ISO 27001 and SOC 2 certifications, encryption at rest
              and in transit, SAML, SCIM, permission mirroring, mutual-TLS connectivity, and customer-managed key or
              bucket options. It also says generated answers link to exact source snippets and that customer data is not
              used to train its AI. These controls are directionally appropriate for regulated research teams, but the
              assigned evidence does not include audit reports, penetration-test findings, uptime history, incident
              records, model evaluations, or hallucination-rate benchmarks. Citation traceability improves
              reviewability; it does not itself prove that synthesis is complete, contextually fair, or correct.
              Security and reliability diligence should therefore validate the controls and operating record directly.
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is the product moat
            body: >-
              AlphaSense combines licensed content, expert evidence, internal knowledge, structured financial data,
              cited synthesis, and deliverable tooling in one research environment.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE011
          - type: callout
            title: Control claims outrun independent proof
            body: >-
              Security and traceability features are extensively documented, but the assigned pool does not
              independently validate operating effectiveness, uptime, or model quality.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base, buyers, and use cases
        blocks:
          - type: paragraph
            body: >-
              AlphaSense positions the platform for three broad enterprise groups: financial services, corporations, and
              professional services. Within those organizations, the likely economic buyers are research, strategy,
              intelligence, and deal-team leaders, while analysts and other knowledge workers are the daily users. The
              official customer scale claim has moved beyond 8,000 enterprises, and the company says 92% of the S&P 100
              use the platform. This is strong breadth evidence, but it does not reveal the distribution of seats,
              contract value, geography, or product bundle. Public pricing is also nonstandardized: AlphaSense says
              packages vary by users and organization, while Sacra estimates annual per-seat pricing and much larger
              enterprise contracts. The evidence therefore supports enterprise penetration and a multi-person buying
              motion, not a precise revenue mix by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption trajectory and expansion signals
        blocks:
          - type: paragraph
            body: >-
              The clearest public trajectory combines customer counts with usage and commercial expansion indicators.
              AlphaSense reported more than 6,500 customers in October 2025, Sacra reported more than 7,000 in June
              2026, and the current official product article claims more than 8,000. These observations are from
              different issuers and vintages, so they are directional rather than a clean cohort series. The October
              2025 company release also reported $500 million of ARR, 33% quarter-over-quarter growth in GenAI query
              usage, and 185% growth in Enterprise Intelligence deals. Sacra separately estimates that ARR per customer
              rose from $28,000 to $66,000 in less than three years. Together these data indicate customer, usage, and
              wallet expansion, but the sources do not disclose starting values, cohort definitions, or whether
              acquisitions affected comparability.
            claimRefs:
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
      - number: '6.3'
        title: Named customer proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Public reference evidence spans competitive intelligence, corporate strategy, investment research,
              internal-knowledge search, and due diligence. AlphaSense's homepage names Salesforce, Dow, ODDO BHF, YH2
              Capital, Recurve Capital, and Royalty Pharma and links each name to a workflow-oriented result. An
              independent IntuitionLabs review also summarizes cases involving 3M and Balyasny, which supports the
              breadth of named adoption beyond AlphaSense's own showcase. However, most evidence remains vendor-selected
              and qualitative: public pages rarely state rollout dates, seat counts, baselines, measured savings,
              renewal history, or whether a deployment progressed from pilot to enterprise production. The references
              are credible proof of real users, but not a complete outcome or retention dataset.
            claimRefs:
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU013
              - CU014
      - number: '6.4'
        title: Durability, concentration, and procurement risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish net revenue retention, gross revenue retention, churn, renewal rates,
              cohort curves, contract duration, or customer concentration. Those omissions prevent a direct test of
              durability despite the positive customer and usage trajectory. The evidence also contains a same-date
              attribution conflict: the PRNewswire-hosted company release says 88% of the S&P 100, while AlphaSense's
              own version says 92%, even though both pair the figure with more than 6,500 customers. Independent
              commentary adds two practical risks. IntuitionLabs records recurring complaints about feature complexity
              and information overload, and Sacra argues that buyers may treat AlphaSense as a supplementary tool during
              budget reviews. These risks do not negate adoption, but they make seat utilization, renewal behavior,
              competitive displacement, and concentration data essential diligence items.
            claimRefs:
              - CU005
              - CU006
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implications
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are not documented failures; they are high-consequence dependencies whose
              frequency and control effectiveness cannot be independently measured from the assigned evidence.
              AlphaSense says more than 90% of research projects are performed by agents and that the platform consumes
              500 billion LLM tokens weekly, making retrieval, synthesis, permissions, and model behavior core operating
              controls rather than peripheral features. The company also markets sentence-level citations and "no
              hallucinations," but the retained external reviews do not provide an error-rate benchmark. A material
              citation or permissioning failure in a regulated customer workflow would therefore be thesis-relevant even
              though no such incident is established here. Content-rights continuity and cloud/model concentration rank
              alongside output quality because AlphaSense describes licensed content, AWS-managed infrastructure, and
              outside LLM providers as product inputs. Financial and retention opacity remain decision risks: the
              retained sources disclose scale but not profitability, cash burn, runway, NRR, churn, or customer
              concentration.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, privacy, and contractual exposure
        blocks:
          - type: paragraph
            body: >-
              AlphaSense describes a substantial control set for sensitive enterprise information: BYOK encryption,
              private-cloud deployment options, permission mirroring, role-based access, no training on customer data,
              and zero-data- retention LLM vendors. These controls directly address confidentiality and access risk, but
              they are company assertions in the assigned pool; no regulator record, court docket, audit report, breach
              notice, or customer control test was allocated to this chapter. The correct conclusion is therefore that
              mitigations are disclosed while effectiveness and current incident status remain unverified—not that
              adverse events are absent. Content licensing creates a separate legal dependency because the product's
              differentiation rests on a curated, licensed corpus, yet the retained descriptions do not disclose renewal
              terms, major-provider concentration, rights disputes, or termination protections. Contract friction is
              more concrete but lower severity: a competitor review reports automatic renewal, a 90-day non-renewal
              notice, and annual fee increases, which should be checked against current customer paper rather than
              treated as independently verified standard terms.
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
      - number: '7.3'
        title: Operational, quality, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Product breadth raises execution complexity. AlphaSense combines proprietary qualitative content,
              structured financial data, customer internal documents, agents, search, and presentation workflows; a 2025
              company release said Enterprise Intelligence had more than doubled its customer base over the prior year.
              Scaling that surface creates multiple control planes for data freshness, entitlements, model selection,
              source citation, connector permissions, and support. The company says AWS manages deployment
              infrastructure and describes private-cloud, encryption, and access-control options, but the allocated
              evidence provides no service-level history, recovery objectives, outage record, model-vendor
              concentration, or independent reliability benchmark. External reviews add weaker but relevant product
              signals: pricing is opaque, smaller teams may face cost and onboarding barriers, and one review summarizes
              occasional search-relevance concerns. Those reviews are competitor or adjacent-vendor commentary, not
              independent performance tests, so they inform diligence priorities rather than prove failure rates.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.4'
        title: Dependencies, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Three dependencies deserve direct contract-level diligence: content licensors, AWS-hosted infrastructure,
              and external LLM providers. Management should provide the top-ten content-provider spend and renewal
              schedule, termination and portability provisions, uptime and recovery history, model-routing
              concentration, and the results of red-team and citation-accuracy testing. The financial evidence request
              is equally important because rapid product adoption and high token consumption do not establish attractive
              unit economics or cash durability. Monitor gross margin after content and inference costs, renewal and
              churn by cohort, citation-error rates, permissioning exceptions, severity-one incidents, and concentration
              in both customers and suppliers. Thesis-break triggers should include loss of material licensed content, a
              recurring permission or citation failure in regulated workflows, inability to meet contractual
              availability objectives, sharply deteriorating renewal economics, or evidence that growth requires
              structurally worsening content and inference costs. Until those data are produced, the residual exposure
              should remain medium-high rather than being discounted by the absence of a public incident in this limited
              source set.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-bound conclusion
            body: >-
              No retained regulator, court, breach, or outage record was assigned to this chapter. That evidence gap
              prevents a clean-history conclusion and requires primary-record and management diligence before
              underwriting incident risk.
            calloutType: risk
            claimRefs:
              - CR014
          - type: callout
            title: Thesis-break triggers
            body: >-
              Reassess the investment if AlphaSense loses material licensed content, cannot demonstrate repeatable
              citation and permission integrity, misses contractual availability objectives, or shows weakening renewals
              alongside worsening content and inference economics.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >
              The recommended posture is research more, with medium confidence and high valuation risk at the disclosed
              $7.5 billion financing mark. The round provides a current price reference, and reported ARR above $600
              million implies approximately 12.5x ARR, but that calculation is not an enterprise-value multiple because
              the retained evidence does not disclose cash, debt, or security terms. The business appears to have
              substantial scale, yet public evidence cannot establish whether growth converts into durable gross margin,
              retention, or free cash flow. Entry should therefore require either a material discount to the latest mark
              or diligence proof on net retention, gross margin, cash generation, preference seniority, and fully
              diluted ownership. Without those items, a target return or holding period would be false precision rather
              than an investable underwriting case.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >
              The thesis rests on a difficult-to-replicate content and workflow position. AlphaSense says its platform
              spans more than 500 million premium documents, and Accenture's investment and channel partnership create a
              route to embed the product in enterprise agentic workflows. The company also reported rapid adoption
              signals: Enterprise Intelligence deals grew 185% and generative-AI query usage rose 33% quarter over
              quarter when ARR crossed $500 million in October 2025. The anti-thesis is equally material. Much of the
              operating evidence is company-issued, pricing is custom and opaque, and an independent review describes
              the product as potentially expensive or excessive for light-research users. General-purpose AI, incumbent
              terminals, and enterprise-search tools may constrain pricing before AlphaSense proves durable retention
              and margins.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Bull, base, and bear framework
        blocks:
          - type: paragraph
            body: >
              Public evidence supports directional scenarios, not a precise discounted-cash-flow or comparable-company
              output. The current $7.5 billion mark is therefore the only defensible valuation anchor. A bull outcome
              requires ARR growth to remain strong, the Accenture channel to expand enterprise deployment, and premium
              content to preserve differentiation; that would support a value above the current mark, but no quantified
              range is supportable. The base case keeps value around the current mark only if growth decelerates in an
              orderly way and diligence confirms healthy retention and margins. A bear case places value below the
              current mark if multiple compression combines with weak retention, margin pressure, or onerous
              preferences. These are decision boundaries, not probability-weighted forecasts.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              AlphaSense has late-stage scale, a recent institutional financing, and a broad enterprise customer
              footprint, but the retained evidence does not establish an IPO timetable, audited readiness, or a likely
              acquirer. Exit underwriting should remain open until management provides audited revenue recognition,
              cohort retention, gross margin, cash flow, and a fully diluted cap table. Thesis-break triggers are
              measurable: ARR growth falling materially without margin improvement, net retention below an
              enterprise-software threshold chosen during diligence, loss of material premium-content rights, failure of
              the Accenture channel to generate attributable bookings, or financing terms that subordinate new common
              equity. The decision can move toward invest only after those data support an acceptable risk-adjusted
              return at the actual offered price.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Research more at the $7.5B reference; advance only with verified unit economics, clean ownership terms,
              and a return case tied to the actual offered security.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
