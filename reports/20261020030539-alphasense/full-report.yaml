      - number: '4.3'
        title: Traction, cost structure, and margin path
        blocks:
          - type: paragraph
            body: >-
              The strongest financial disclosure is ARR. AlphaSense said it surpassed $600 million in Q1 2026 and more
              than $700 million in Q2 2026; Sacra separately estimated $700 million in June 2026. Customer disclosures
              are less clean: an August company release cited 7,800 customers, while a July product article said 8,000+,
              so the current denominator and reporting conventions require reconciliation. ARR scale confirms commercial
              traction, but it does not equal GAAP revenue, cash receipts, or gross profit. The likely delivery-cost
              buckets include licensed content, model and compute usage, data ingestion, expert-call operations,
              customer support, and sales capacity, but the sources do not quantify any of them. Gross margin,
              contribution margin, capitalized development, working capital, and capex are therefore diligence asks
              rather than model inputs.
