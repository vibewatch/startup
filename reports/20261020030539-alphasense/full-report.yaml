              - CP006
              - CP010
              - CP014
      - number: '3.3'
        title: Pricing, packaging, and switching economics
        blocks:
          - type: paragraph
            body: >-
              AlphaSense uses annual, custom-quoted subscriptions rather than a public rate card. Independent sources
              provide different pricing lenses that should not be collapsed: one review cites a £81,900 annualized UK
              public contract and a $17,500 median across 38 Vendr-brokered purchases, while Sacra estimates
              $10,000-$20,000 per seat and $50,000-$100,000-plus average enterprise deal sizes. Those figures have
              different denominators, currencies, and methodologies and are not realized-price equivalents. Packaging
              adds Expert Calls and Canalyst models separately. Annual commitments, onboarding, internal-content
              ingestion, connectors, permissions, and recurring workflow automation can increase switching friction, but
              the evidence does not quantify renewal rates, migration costs, or contractual lock-in. Multi-homing
              remains rational where Bloomberg or FactSet supplies live or structured data that AlphaSense does not
              replace.
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat rests on licensed and vendor-owned content, proprietary expert interviews, a large indexed
              corpus, domain-specific retrieval, and integration into recurring deliverables. These assets make a direct
              replica harder than reproducing generic search or summarization. The same structure creates a dependency:
              Sacra identifies content licensing as a material risk if providers change terms, raise fees, or terminate
              access. General-purpose AI can commoditize basic synthesis, and incumbents can add document AI while
              preserving their installed bases and data advantages. AlphaSense's response is to move further into
              agents, PowerPoint, Excel, internal knowledge, and expert workflows. This broadening improves workflow
              attachment but is not proof of durable retention. The underwriting conclusion is therefore a strong
              current product moat with unquantified contractual durability and a credible risk of feature convergence.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is content-plus-workflow, not search alone
            body: >-
              AlphaSense combines licensed content, proprietary expert material, internal-data connectors, cited
              synthesis, and recurring agents. This bundle is harder to replace than any single AI feature, although its
              durability still depends on content rights and customer retention.
            calloutType: strength
            claimRefs:
              - CP001
              - CP011
              - CP016
          - type: callout
            title: Feature convergence preserves multi-homing pressure
            body: >-
              Bloomberg and structured-data incumbents can add AI while general-purpose models improve synthesis.
              Customers may continue paying for multiple tools, but AlphaSense can be the discretionary layer if its
              incremental workflow value is not demonstrated.
            calloutType: risk
            claimRefs:
              - CP005
              - CP010
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              AlphaSense is an enterprise subscription business rather than a public, self-serve SaaS product. The CFO
              described customer access through contracts for subscriptions and credit bundles, while AlphaSense says
              pricing varies by user count for smaller organizations and is customized at enterprise level. The product
              surface also supports expansion through premium broker research, expert transcripts, financial data,
              internal-content integration, and agentic workflows. AlphaSense reported that Enterprise Intelligence more
              than doubled its customer base in the year to October 2025, which is a useful adoption signal but not a
              disclosed revenue-mix measure. Annual contracts and modular expansion can support recurring revenue and
              higher account value; however, the retained evidence does not disclose realized price, discounting,
              product mix, revenue-recognition policy, or the split between fixed subscriptions and usage-linked
              credits.
