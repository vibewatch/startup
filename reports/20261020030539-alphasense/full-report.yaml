              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              AlphaSense raised $350 million at a $7.5 billion valuation in June 2026, and the CFO interview said total
              funding exceeded $1 billion. Those figures show access to capital, but funding raised is not cash
              available: the retained sources do not disclose current cash, debt, preference terms, burn, runway,
              acquisition obligations, or planned uses by amount. Capital adequacy cannot therefore be inferred from the
              financing headline. The financial verdict is positive on scale and recurring-contract structure, but
              incomplete on quality and self-funding capacity. Before underwriting, investors need an ARR definition and
              revenue bridge, audited revenue and gross margin, cohort retention, CAC/payback, content and AI cost
              allocation, cash and debt, and a forward operating plan showing the trigger for another financing. Until
              then, valuation and runway analysis should remain scenario-based rather than presented as precise.
            claimRefs:
