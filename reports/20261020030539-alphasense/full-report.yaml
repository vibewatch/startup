  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              AlphaSense's relevant market is narrower than all business intelligence software but broader than document
              search alone. The core boundary is enterprise subscription spend for licensed market and financial
              content, expert transcripts, search and synthesis, internal-knowledge integration, and research-workflow
              software. Adjacent spend includes structured financial data and automation that moves analysis into Excel,
              PowerPoint, and recurring monitoring. The boundary excludes execution-oriented terminals, pure SEO or
              social-listening products, and standalone expert-call services unless they are part of the same research
              workflow. Status-quo substitutes remain material: buyers can combine general-purpose AI, incumbent
              terminals, news databases, internal search, and manual analyst work. This definition avoids counting every
              analytics or generative-AI dollar as addressable to AlphaSense.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
      - number: '2.2'
        title: Sizing lenses and the unresolved SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Independent estimates provide directional scale, not a clean TAM/SAM/SOM stack. Sacra estimates
              AlphaSense's core financial and market-intelligence market at $13 billion annually and identifies a $15
              billion-plus business-intelligence and analytics adjacency, but does not publish a bottom-up methodology
              in the retained text. IntuitionLabs cites a separate industry forecast that expands from $12.38 billion in
              2025 to $28.96 billion in 2033 at an 11.2% CAGR; its category boundaries are also not reproduced.
              AlphaSense's dated disclosure of more than $700 million ARR in Q2 2026 is useful only as a company scale
              proxy. It is not market revenue, and dividing it by any broad estimate would imply false comparability.
              Geography, eligible buyer counts, seat density, willingness to pay, and attainable penetration remain
              undisclosed.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
