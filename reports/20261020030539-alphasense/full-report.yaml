        title: Architecture, ingestion, and delivery
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has six functional layers: licensed and public content, internal-content
              ingestion, indexing and permission controls, domain-specific search and synthesis, workflow orchestration,
              and end-user delivery surfaces. Official materials describe more than 20 connectors plus upload and API
              paths, while the technical documentation distinguishes standard SaaS, customer-managed encryption keys,
              and customer-managed storage. PowerPoint and Excel add-ins extend the product into deliverable creation
              without exposing the underlying model-routing, retrieval ranking, latency, or evaluation stack. The
              resulting diligence view is therefore an operating-model map, not a verified low-level system design.
            claimRefs:
