        - A 500M+ document corpus and integrated research workflows can support differentiated enterprise value.
        - Loss of premium-content access or weak usage conversion would undermine the moat.
      - - Thesis
        - Accenture's investment and channel partnership can expand enterprise distribution.
        - Attributed bookings and expansion data would confirm whether the channel is economically material.
      - - Thesis
        - >-
          Enterprise Intelligence deals grew 185% and GenAI query usage rose 33% quarter over quarter in the October
          2025 company update.
        - Independent cohort and renewal evidence would show whether reported adoption is durable.
      - - Anti-thesis
        - Custom pricing and limited transparency raise procurement and value-for-money risk.
        - Published price realization, discounting, renewal, and seat-expansion data would narrow the concern.
    notes: >-
      Growth and usage metrics are company-issued; the pricing critique comes from one independent review and should be
      validated with customer references and contract data.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          Sustained ARR growth, strong retention and margins, successful Accenture distribution, and durable
          premium-content differentiation.
        - >-
          Above the $7.5B current mark; a numeric range is not supportable without margins, cash flow, comps, and
          security terms.
        - >-
          Signal: independently verified expansion and cash generation. Trigger against: content-rights loss or channel
          underperformance.
      - - Base
        - Growth moderates while retention, gross margin, and cash conversion prove healthy in diligence.
        - Around the $7.5B current mark, conditional on clean preferences and an acceptable fully diluted entry price.
        - >-
          Signal: stable cohorts and improving operating leverage. Trigger against: declining net retention or
          persistent cash consumption.
      - - Bear
        - >-
          Growth slows, pricing pressure rises, unit economics disappoint, or preferences amplify common-equity
          downside.
        - Below the $7.5B current mark; downside cannot be bounded from public evidence.
        - >-
          Signal: weak renewals, discounting, or margin compression. Trigger: financing seniority or liquidity needs
          that impair new equity.
    notes: >-
      Scenario valuation bands are directional relative to the disclosed financing mark; no probabilities or precise
      values are assigned because public evidence lacks profitability, retention, cash-flow, comp, and cap-table inputs.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV013
      - CV014
      - CV016
