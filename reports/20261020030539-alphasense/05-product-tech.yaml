company:
  name: "AlphaSense"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    AlphaSense has expanded from financial-document search into an integrated research
    system spanning licensed content, internal-data connectors, cited generative search,
    workflow agents, structured financial data, and Office deliverables. The product is
    visibly mature at enterprise scale, but most architecture, security, performance, and
    reliability evidence in the assigned pool is company-issued rather than independently
    verified.
sections:
  - id: "product-surface"
    title: "Product surface and user workflow"
    body: >-
      AlphaSense is delivered as a research workspace rather than a single search feature.
      Its current official description combines a 500M-plus-document external content
      universe with expert transcripts, financial datasets, internal enterprise content,
      natural-language retrieval, and cited synthesis. The practical workflow runs from
      discovering evidence to comparing documents, monitoring changes, building tables,
      and producing decks or models. Generative Search addresses ad hoc questions, Deep
      Research handles longer investigations, Generative Grid applies repeated prompts
      across document sets, and workflow agents package recurring tasks. This breadth can
      reduce tool switching, but buyers must verify which modules, licensed content, and
      deployment options are included in the contracted tier.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE014]
    tableRefs: [TE001]
  - id: "architecture-and-integration"
    title: "Architecture, ingestion, and delivery"
    body: >-
      The observable architecture has six functional layers: licensed and public content,
      internal-content ingestion, indexing and permission controls, domain-specific search
      and synthesis, workflow orchestration, and end-user delivery surfaces. Official
      materials describe more than 20 connectors plus upload and API paths, while the
      technical documentation distinguishes standard SaaS, customer-managed encryption
      keys, and customer-managed storage. PowerPoint and Excel add-ins extend the product
      into deliverable creation without exposing the underlying model-routing, retrieval
      ranking, latency, or evaluation stack. The resulting diligence view is therefore an
      operating-model map, not a verified low-level system design.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-and-deployment"
    title: "Maturity, deployment, and workflow evidence"
    body: >-
      Product maturity is supported most directly by shipping breadth and reported usage,
      not by independent performance benchmarks. AlphaSense said Enterprise Intelligence
      more than doubled its customer base during 2025 and that hundreds of enterprise
      clients adopted it that year. It separately reported a 33% quarter-over-quarter rise
      in generative-AI queries after launching Generative Search, Generative Grid, Deep
      Research, and AI Interviewer workflows. Those are company-reported adoption signals,
      not measures of task accuracy or retention. Independent directory and competitor
      commentary broadly confirms the platform's module packaging and cited-output model,
      while also reinforcing that pricing and included capabilities require proposal-level
      verification.
    claimRefs: [CE012, CE013, CE014, CE015]
    tableRefs: [TE002]
  - id: "trust-and-technical-risk"
    title: "Trust, security, and technical risk"
    body: >-
      AlphaSense documents enterprise controls including ISO 27001 and SOC 2 certifications,
      encryption at rest and in transit, SAML, SCIM, permission mirroring, mutual-TLS
      connectivity, and customer-managed key or bucket options. It also says generated
      answers link to exact source snippets and that customer data is not used to train its
      AI. These controls are directionally appropriate for regulated research teams, but the
      assigned evidence does not include audit reports, penetration-test findings, uptime
      history, incident records, model evaluations, or hallucination-rate benchmarks.
      Citation traceability improves reviewability; it does not itself prove that synthesis
      is complete, contextually fair, or correct. Security and reliability diligence should
      therefore validate the controls and operating record directly.
    claimRefs: [CE004, CE008, CE009, CE013, CE016]
