    body: >-
      AlphaSense combines licensed content, expert evidence, internal knowledge, structured
      financial data, cited synthesis, and deliverable tooling in one research environment.
    claimRefs: [CE001, CE003, CE004, CE006, CE011]
  - calloutType: "risk"
