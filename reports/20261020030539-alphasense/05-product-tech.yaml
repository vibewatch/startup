    rows:
      - ["Answer a complex market question", "Search and read documents, then synthesize manually", "Generative Search and Deep Research with direct citations", "Company reports 33% quarter-over-quarter GenAI query growth", "No assigned-source accuracy or time-saved benchmark"]
      - ["Compare companies or documents", "Extract repeated fields into spreadsheets", "Generative Grid and structured Financial Data", "Company reports 4,500 Canalyst models in the 2025 launch release", "Coverage, normalization errors, and update latency are not independently tested"]
      - ["Use internal knowledge with external research", "Search separate repositories and market-data tools", "Enterprise Intelligence connectors, API, and permission-aware search", "Company says the product more than doubled its customer base in 2025", "No implementation-duration, connector-reliability, or renewal data"]
      - ["Produce an investment or strategy deliverable", "Move findings into Excel or PowerPoint and reconcile sources", "Native Office surfaces, slide agent, and workflow agents", "Current official product material describes shipped Excel and PowerPoint integrations", "No independent evidence of formula or formatting fidelity at scale"]
    notes: >-
      Adoption and workflow metrics are company-reported and do not establish task quality,
      retention, or realized customer productivity.
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012, CE013, CE015]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns:
      - "Layer / process"
      - "Role"
      - "Dependency"
      - "Primary risk"
    rows:
      - ["External content universe", "Supplies licensed and public research inputs", "Publisher and data-provider rights, ingestion, and freshness", "Coverage gaps, licensing concentration, or delayed updates"]
      - ["Internal-content ingestion", "Connects proprietary documents and communications", "Connectors, APIs, permission mapping, and customer configuration", "Misconfigured access, incomplete synchronization, or costly implementation"]
      - ["Indexing and retrieval", "Finds relevant structured and unstructured evidence", "Embedding, indexing, entity resolution, and entitlement enforcement", "Opaque recall, ranking bias, or permission leakage"]
      - ["AI synthesis and agents", "Generates cited answers and executes multi-step workflows", "Model providers, orchestration, evaluation, and source grounding", "Hallucination, omitted context, non-determinism, or model drift"]
      - ["Delivery and governance", "Presents research in web, mobile, Excel, and PowerPoint surfaces", "Identity, encryption, audit logs, export policy, and customer controls", "Data exfiltration, stale outputs, or unverified deliverable changes"]
    notes: >-
      This is a functional architecture inferred from documented product surfaces; low-level
      implementation details and performance characteristics are not public in the assigned pool.
    claimRefs: [CE001, CE007, CE008, CE009, CE016]
