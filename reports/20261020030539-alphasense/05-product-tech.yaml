          items: ["Workflow Agents", "AI Interviewer", "Scheduled workflows"]
        - label: "Delivery surfaces"
          detail: "Users consume and refine outputs in the web application, mobile app, Excel, and PowerPoint."
          items: ["Web and mobile", "Excel", "PowerPoint"]
    approximationNotes: >-
      Functional ordering is analyst interpretation from documented modules; it is not a
      representation of AlphaSense's private infrastructure or model topology.
    claimRefs: [CE004, CE005, CE006, CE010, CE011, CE016]
callouts:
