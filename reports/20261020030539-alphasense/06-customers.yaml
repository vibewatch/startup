company:
  name: AlphaSense
chapter:
  number: 6
  title: Customers
  summary: >-
    AlphaSense claims more than 8,000 enterprise customers across financial services,
    corporations, and professional services, with public evidence of expanding AI usage
    and internal-content deployments. Adoption breadth is visible, but retention,
    customer concentration, contract duration, and production-level outcome data remain
    undisclosed and require direct diligence.
sections:
  - id: customer-base-and-buyers
    title: Customer base, buyers, and use cases
    body: >-
      AlphaSense positions the platform for three broad enterprise groups: financial
      services, corporations, and professional services. Within those organizations, the
      likely economic buyers are research, strategy, intelligence, and deal-team leaders,
      while analysts and other knowledge workers are the daily users. The official
      customer scale claim has moved beyond 8,000 enterprises, and the company says 92%
      of the S&P 100 use the platform. This is strong breadth evidence, but it does not
      reveal the distribution of seats, contract value, geography, or product bundle.
      Public pricing is also nonstandardized: AlphaSense says packages vary by users and
      organization, while Sacra estimates annual per-seat pricing and much larger
      enterprise contracts. The evidence therefore supports enterprise penetration and a
      multi-person buying motion, not a precise revenue mix by segment.
    claimRefs: [CU001, CU002, CU003, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-expansion
    title: Adoption trajectory and expansion signals
    body: >-
      The clearest public trajectory combines customer counts with usage and commercial
      expansion indicators. AlphaSense reported more than 6,500 customers in October
      2025, Sacra reported more than 7,000 in June 2026, and the current official product
      article claims more than 8,000. These observations are from different issuers and
      vintages, so they are directional rather than a clean cohort series. The October
      2025 company release also reported $500 million of ARR, 33% quarter-over-quarter
      growth in GenAI query usage, and 185% growth in Enterprise Intelligence deals.
      Sacra separately estimates that ARR per customer rose from $28,000 to $66,000 in
      less than three years. Together these data indicate customer, usage, and wallet
      expansion, but the sources do not disclose starting values, cohort definitions, or
      whether acquisitions affected comparability.
    claimRefs: [CU004, CU007, CU008, CU009, CU010, CU012]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof and reference quality
    body: >-
      Public reference evidence spans competitive intelligence, corporate strategy,
      investment research, internal-knowledge search, and due diligence. AlphaSense's
      homepage names Salesforce, Dow, ODDO BHF, YH2 Capital, Recurve Capital, and Royalty
      Pharma and links each name to a workflow-oriented result. An independent
      IntuitionLabs review also summarizes cases involving 3M and Balyasny, which supports
      the breadth of named adoption beyond AlphaSense's own showcase. However, most
      evidence remains vendor-selected and qualitative: public pages rarely state
      rollout dates, seat counts, baselines, measured savings, renewal history, or whether
      a deployment progressed from pilot to enterprise production. The references are
      credible proof of real users, but not a complete outcome or retention dataset.
    claimRefs: [CU013, CU014]
    tableRefs: [TU003]
  - id: durability-and-risk
    title: Durability, concentration, and procurement risk
    body: >-
      Public evidence does not establish net revenue retention, gross revenue retention,
      churn, renewal rates, cohort curves, contract duration, or customer concentration.
      Those omissions prevent a direct test of durability despite the positive customer
      and usage trajectory. The evidence also contains a same-date attribution conflict:
      the PRNewswire-hosted company release says 88% of the S&P 100, while AlphaSense's
      own version says 92%, even though both pair the figure with more than 6,500
      customers. Independent commentary adds two practical risks. IntuitionLabs records
      recurring complaints about feature complexity and information overload, and Sacra
      argues that buyers may treat AlphaSense as a supplementary tool during budget
      reviews. These risks do not negate adoption, but they make seat utilization,
      renewal behavior, competitive displacement, and concentration data essential
      diligence items.
    claimRefs: [CU005, CU006, CU015, CU016]
