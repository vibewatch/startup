  - id: FE001
    title: 产品架构图
    type: stack
    summary: 产品从获许可且由客户控制的输入出发，经检索和带引用的 AI 工作流，最终进入研究与交付界面。
    data:
      layers:
        - label: 内容宇宙
          detail: 优质外部研究、专家转录、申报文件、新闻、金融数据和客户自有内容。
          items:
            - 500M+ 外部文档
            - 专家洞察
            - 结构化金融数据
        - label: 摄取与权限
          detail: 连接器、上传、API、身份集成和来源权限决定哪些内容进入各个工作区。
          items:
            - 20+ 连接器
            - 摄取 API
            - 权限镜像
        - label: 索引与检索
          detail: 领域专用索引、嵌入、搜索和来源级检索构成证据层。
          items:
            - 联邦搜索
            - 知识图谱
            - 语义检索
        - label: AI 综合
          detail: Generative Search、Deep Research 和 Generative Grid 生成带引用的答案和结构化比较。
          items:
            - Generative Search
            - Deep Research
            - Generative Grid
        - label: 工作流编排
          detail: 预构建和定制智能体执行重复性研究、监测、尽调和访谈任务。
          items:
            - Workflow Agents
            - AI Interviewer
            - 定时工作流
        - label: 交付界面
          detail: 用户在 Web 应用、移动应用、Excel 和 PowerPoint 中使用并完善输出。
          items:
            - 网页和移动端
            - Excel
            - PowerPoint
    approximationNotes: 功能顺序是分析师依据公开模块做出的解读，并不代表 AlphaSense 的私有基础设施或模型拓扑。
