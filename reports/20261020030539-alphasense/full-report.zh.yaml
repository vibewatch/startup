      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >
              公开证据支持方向性情景，不支持精确的现金流折现或可比公司结果。因此，当前 75 亿美元价位是唯一可辩护的估值锚点。乐观结果要求 ARR 保持强劲增长、Accenture
              渠道扩大企业部署，以及优质内容继续维持差异化；这会支撑高于当前价位的价值，但无法给出有依据的量化区间。基准情景只有在增长有序放缓且尽调确认留存和利润率健康时，才能让价值维持在当前价位附近。若估值倍数压缩同时叠加留存疲弱、利润率承压或苛刻优先权，悲观情景下的价值会低于当前价位。这些是决策边界，不是按概率加权的预测。
