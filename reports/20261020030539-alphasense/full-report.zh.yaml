            title: 受证据边界约束的结论
            body: 本章节没有指定任何保留的监管、法院、泄露或宕机记录。这个证据缺口不允许得出历史清白的结论，在判断事件风险前必须完成一手记录和管理层尽调。
            calloutType: risk
