  - id: TV002
    title: 正面论点与反面论点
    columns:
      - 立场
      - 有证据支持的论点
      - 哪些事实会改变判断
    rows:
      - - 正面论点
        - 500M+ 文档语料库和整合式研究工作流可以支撑差异化的企业价值。
        - 优质内容访问权丧失，或使用转化疲弱，都会削弱护城河。
      - - 正面论点
        - Accenture 的投资和渠道合作可以扩大企业分销。
        - 有归属的 bookings 和扩张数据将证实该渠道是否具有经济实质。
      - - 正面论点
        - Enterprise Intelligence 交易在 2025 年 10 月公司更新中增长 185%，GenAI 查询使用量环比增长 33%。
        - 独立的 cohort 和续约证据将显示所报告的采用是否具有持久性。
      - - 反面论点
        - 定制化定价和有限透明度增加了采购及性价比风险。
        - 已公布的实际价格、折扣、续约和席位扩张数据将缩小这一疑虑。
    notes: 增长和使用指标由公司发布；定价批评来自一份独立评论，应通过客户访谈和合同数据验证。
