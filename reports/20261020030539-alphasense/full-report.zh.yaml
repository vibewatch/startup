      - number: '8.4'
        title: 退出准备度与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >
              AlphaSense 已具备后期公司规模、近期机构融资和广泛的企业客户覆盖，但保留证据没有证明 IPO 时间表、经审计准备度或可能的收购方。退出判断应保持开放，直到管理层提供经审计收入确认、cohort
              留存、毛利率、现金流和完全摊薄后的股权结构表。论点破坏触发条件是可测的：ARR 增长在没有利润率改善的情况下显著下滑、净留存低于尽调时选定的企业软件门槛、失去重大优质内容权利、Accenture
              渠道无法带来可归因订单，或融资条款使新普通股处于次级地位。只有这些数据支持按实际报价获得可接受的风险调整回报后，决策才可转向投资。
