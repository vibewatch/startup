            body: >-
              创始人延续性非常明显：在指定公司简介中，Kokko 和 Neervannan 仍担任两项已披露的高管职务。Sacra 报道称，Vitruvian 的合伙人 Sophie Bower-Straziota 在
              2026 年 6 月融资后加入董事会；Accenture
              则宣布同时进行投资和战略合作。这说明投资人和合作伙伴具有一定影响力，但并不足以还原完整董事会、投票控制权图谱、优先股堆叠或继任计划。创始人持续任职使关键人物依赖成为尽调问题，而非已证实的运营弱点。在判断控制权前，需要管理层访谈和当前
