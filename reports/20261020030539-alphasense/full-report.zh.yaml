              文档的外部内容宇宙，与专家访谈记录、财务数据集、企业内部内容、自然语言检索和带引用的综合结合起来。实际工作流从发现证据、比较文档，到监控变化、搭建表格，再到制作演示稿或模型。Generative Search
              处理临时问题，Deep Research 处理更长的调查，Generative Grid
              将重复提示应用于文档集，工作流代理则把周期性任务打包。广度可以减少工具切换，但买方必须核实签约层级究竟包含哪些模块、授权内容和部署选项。
