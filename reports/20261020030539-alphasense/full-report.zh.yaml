  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >
              建议继续研究；在披露的 75 亿美元融资价位上，信心中等，估值风险高。该轮融资提供了当前价格参考，报告的 ARR 超过 6 亿美元意味着约 12.5 倍
              ARR，但由于保留证据没有披露现金、债务或证券条款，这个计算不是企业价值倍数。业务规模看起来可观，但公开证据无法证明增长能否转化为持久毛利率、留存或自由现金流。因此，入场应要求相对最新估值有明显折价，或要求尽调证明净留存、毛利率、现金创造能力、优先权级别和完全摊薄后的所有权。在没有这些数据前，目标回报或持有期限都只是伪精确，而不是可投资的判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
