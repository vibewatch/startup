        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              剩余暴露最高的不是已记录的失败，而是其发生频率和控制有效性无法通过指定证据独立衡量的高后果依赖。AlphaSense 称超过 90% 的研究项目由代理完成，平台每周消耗 5000 亿个 LLM
              tokens，因此检索、综合、权限和模型行为是核心运营控制，而不是外围功能。公司还营销句子级引用和“无幻觉”，但保留的外部评测没有提供错误率基准。在受监管客户工作流中，若引用或权限出现重大失效，即使本报告没有确认发生过此类事件，也会直接影响投资论点。内容权利连续性以及云和模型集中度同样重要，因为
              AlphaSense 将授权内容、AWS 管理的基础设施和外部 LLM
              供应商描述为产品输入。财务和留存不透明仍是决策风险：现有来源披露规模，却没有披露盈利能力、现金消耗、资金可支撑期限、NRR、流失或客户集中度。
