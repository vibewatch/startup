        title: 规模与融资
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 2026 年 7 月的公司简介称，其企业客户超过 8,000 家。2026 年 6 月，Accenture 的公告称 AlphaSense 近期已突破 6 亿美元年度经常性收入，并宣布以
              75 亿美元估值完成 3.5 亿美元融资。Sacra 另行估算 AlphaSense 2026 年 6 月 ARR 为 7 亿美元；该估算不是按会计准则确认的收入，不应替代公司披露的较低门槛。Sacra
              还称累计融资超过 10 亿美元。这些数据证明了商业规模和融资渠道，但没有揭示收入、毛利率、现金消耗、流动性或资金可支撑期限，已募资金也不能视为可用现金。
