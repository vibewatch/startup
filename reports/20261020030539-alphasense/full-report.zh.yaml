  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 是企业订阅业务，而不是面向公众、可自助购买的 SaaS 产品。CFO 描述客户通过订阅和积分包合同获得访问权限；AlphaSense
              称，小型组织的定价按用户数变化，企业级则定制报价。产品还可通过优质券商研究、专家访谈记录、财务数据、内部内容集成和代理工作流扩张。AlphaSense 报告称，Enterprise Intelligence 截至
              2025 年 10
              月的一年间客户数翻了一倍以上，这是有用的采用信号，但不是披露的收入结构指标。年度合同和模块化扩张可以支撑经常性收入和更高账户价值；不过，现有证据没有披露已实现价格、折扣、产品组合、收入确认政策，或固定订阅与按使用量计费积分之间的拆分。
