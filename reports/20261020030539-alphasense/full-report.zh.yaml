  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号和下行触发点
    rows:
      - - 乐观
        - ARR 持续增长、留存和利润率强劲、Accenture 分销成功，以及优质内容差异化能够持续。
        - 高于当前 $7.5B 估值；在缺少利润率、现金流、可比公司和证券条款的情况下，无法支持具体数值区间。
        - 信号：扩张和现金创造得到独立验证。触发下行：内容权利丧失或渠道表现不佳。
      - - 基准
        - 增长放缓，但尽调证明留存、毛利率和现金转换健康。
        - 约等于当前 $7.5B 估值，前提是优先权清晰，且完全摊薄后的进入价格可接受。
        - 信号：cohort 稳定、经营杠杆改善。触发下行：净留存下降或持续消耗现金。
      - - 悲观
        - 增长放缓、定价压力上升、单位经济性令人失望，或优先权放大普通股下行风险。
        - 低于当前 $7.5B 估值；仅凭公开证据无法界定下行幅度。
        - 信号：续约疲弱、折扣增加或利润率压缩。触发点：融资优先级或流动性需求损害新股权。
    notes: 情景估值区间是相对于已披露融资估值的方向性判断；由于公开证据缺少盈利能力、留存、现金流、可比公司和股权结构表输入，因此不赋予概率或精确数值。
