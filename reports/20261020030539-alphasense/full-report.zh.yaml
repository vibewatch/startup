  - id: FP001
    title: 受证据约束的竞争定位
    type: quadrant
    summary: 这是一种按序数衡量工作流广度与策编商业内容深度的视角，说明 AlphaSense 为什么可以与数据终端及低摩擦替代品共存。
    data:
      xAxis:
        label: 工作流广度：窄（1）至端到端（5）
        min: 1
        max: 5
      yAxis:
        label: 策编商业内容深度：仅公开内容（1）至专有内容（5）
        min: 1
        max: 5
      points:
        - label: AlphaSense
          x: 5
          'y': 5
          detail: 获许可内容、内部数据、智能体、模型和交付物集成
        - label: Bloomberg
          x: 4
          'y': 4
          detail: 广泛的公开市场数据和工作流；在指定比较中，私募市场和智能体能力深度较弱
        - label: FactSet / Capital IQ
          x: 3
          'y': 4
          detail: 结构化和量化工作流深厚；文档综合能力差异化较弱
        - label: Factiva
          x: 2
          'y': 3
          detail: 广泛的新闻聚合，但 AI 和工作流范围更窄
        - label: 通用 AI
          x: 3
          'y': 1
          detail: 综合界面广泛，但没有 AlphaSense 的获许可优质内容
        - label: 内部自建 / 手工
          x: 2
          'y': 2
          detail: 企业可控性强，但外部内容零散、集成依赖人工
    approximationNotes: 分数是分析师基于序数给出的 1 至 5 定位，不是经过测量的市场基准。它们只编码被引用的定性证据；相差一点不代表量化的性能差距，对竞争对手未知的能力采取保守评分。
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP010
      - CP014
      - CP016
  - id: FI001
    title: 收入模式与毛利证据桥
    type: flow
    summary: 公开证据通过 ARR 识别出签约和扩张杠杆，但从 ARR 到毛利的成本桥仍未披露。
    data:
      nodes:
        - id: annual-contract
          label: 年度企业合同
          detail: 订阅访问以合同形式销售，而非自助服务。
        - id: custom-quote
          label: 按席位 / 组织报价
          detail: 定价随用户数量和企业套餐变化。
        - id: premium-modules
          label: 优质内容模块
          detail: 券商研究、专家转录和金融数据可以扩展套餐。
        - id: credit-bundles
          label: 额度套餐
          detail: 提供与使用量挂钩的经济模式，但未公开量化。
        - id: reported-arr
          label: 报告 ARR
          value: '>$700M in Q2 2026'
        - id: delivery-costs
          label: 交付成本基础
          detail: 内容、算力、数据、专家运营、支持及其他成本均未量化。
        - id: gross-profit
          label: 毛利 / 利润率
          value: Unavailable
      edges:
        - from: annual-contract
          to: custom-quote
        - from: custom-quote
          to: reported-arr
        - from: premium-modules
          to: reported-arr
        - from: credit-bundles
          to: reported-arr
        - from: reported-arr
          to: delivery-costs
        - from: delivery-costs
          to: gross-profit
    approximationNotes: 该图展示已披露的机制和缺失的连接；不估算收入确认、成本分摊或利润率。
    claimRefs:
