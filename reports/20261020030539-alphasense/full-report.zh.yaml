      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 于 2026 年 6 月以 75 亿美元估值融资 3.5 亿美元，CFO 访谈称累计融资超过 10
              亿美元。这些数字说明融资能力，但已募资金不等于可用现金：现有来源没有披露当前现金、债务、优先权条款、消耗速度、资金可支撑期限、并购义务或按金额列示的资金用途。因此不能从融资 headline
              推断资本充足性。财务结论在质量和自我造血能力上仍不完整。在投资判断前，投资人需要 ARR 定义和收入桥接、经审计收入与毛利率、cohort 留存、CAC/回本周期、内容与 AI
              成本分摊、现金与债务，以及说明下一轮融资触发条件的前瞻运营计划。在此之前，估值和资金可支撑期限分析应基于情景，而不是伪装成精确数字。
