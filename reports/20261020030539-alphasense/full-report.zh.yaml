            body: >-
              已发布定价只能作为参考，不是合同价格。Sacra 估算年度价格为每席位 $10,000-$20,000，平均企业交易为 $50,000-$100,000+，部分大客户超过 $1 million。Tomba
              给出更宽的每用户 $10,000-$40,000+
              区间，并称内容增购可能大幅抬高账单；但它是推广替代产品的供应商，应视为不利、低声誉证据，而非独立基准。这些估算指向一条拥有可观账户价值和打包杠杆的企业销售路径，不代表已实现平均售价。公开 ARR
              和客户增长是有用的产出代理，但证据没有揭示销售周期、CAC、佣金、回本周期、配额达成效率、毛留存、净留存或 cohort 扩张。这些缺失使得无法可靠地把订单额桥接到持久收入。
