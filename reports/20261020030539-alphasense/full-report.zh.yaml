          - type: paragraph
            body: >-
              三项依赖应直接做合同层面的尽调：内容授权方、AWS 托管基础设施和外部 LLM
              供应商。管理层应提供前十大内容供应商支出和续约计划、终止与可移植条款、正常运行时间和恢复历史、模型路由集中度，以及红队和引用准确性测试结果。财务证据请求同样重要，因为快速产品采用和高 token
              消耗不能证明单位经济性有吸引力或现金具备持久性。应监控扣除内容和推理成本后的毛利率、按 cohort
              划分的续约和流失、引用错误率、权限例外、一级严重事件，以及客户和供应商两端的集中度。论点破坏触发条件应包括重大授权内容流失、受监管工作流中反复出现权限或引用失败、无法满足合同可用性目标、续约经济性显著恶化，或证据显示增长需要结构性更差的内容和推理成本。在这些数据交付前，剩余暴露应维持中高水平，不能因为有限来源集中没有公开事件就打折。
            claimRefs:
