              最强的财务披露是 ARR。AlphaSense 称其在 2026 年第一季度突破 $600 million，第二季度超过 $700 million；Sacra 则独立估算 2026 年 6 月 ARR 为
              $700 million。客户披露没有那么干净：公司 8 月的一份新闻稿称客户数为 7,800 家，而 7 月的一篇产品文章称超过 8,000 家，因此当前分母和报告口径需要核对。ARR
              规模证明商业牵引力，但不等于 GAAP
              收入、现金回款或毛利。可能的交付成本包括授权内容、模型和算力使用、数据摄取、专家访谈运营、客户支持和销售能力，但来源没有量化其中任何一项。因此，毛利率、贡献利润率、资本化开发、营运资本和资本开支都应作为尽调问题，而不是模型输入。
