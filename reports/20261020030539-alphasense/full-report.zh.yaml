              - CV015
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              投资论点建立在难以复制的内容和工作流位置上。AlphaSense 称平台覆盖超过 5 亿份优质文档，而 Accenture 的投资和渠道合作为产品嵌入企业代理工作流提供了路径。公司还报告了快速采用信号：2025
              年 10 月 ARR 跨过 5 亿美元时，Enterprise Intelligence 交易增长 185%，生成式 AI 查询使用量环比增长
              33%。反论点同样重要。大量运营证据来自公司，定价定制且不透明，一份独立评测称对轻度研究用户而言，产品可能过于昂贵或功能过剩。通用 AI、既有终端和企业搜索工具可能在 AlphaSense
              证明持久留存和利润率前限制其定价能力。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
